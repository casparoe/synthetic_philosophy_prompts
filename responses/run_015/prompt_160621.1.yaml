  **Circle Metrics Ltd. | Five-Year Impact Report (2019–2023)**
  **Moral Capital Division | Confidential**

  **Executive Summary**
  Circle Metrics Ltd. is pleased to present the aggregate moral performance of our client portfolio over the five-year reporting period. The headline Circle Radius—the count of beings whose interests receive non-zero moral weighting—has achieved a compound annual growth rate (CAGR) of 26%, reaching a historic high of 8.4 billion entities in FY2023. This expansion represents unambiguous moral progress under the Expanding Circle framework. While Total Accounted Suffering (TAS) liabilities rose commensurately with the Radius, this reflects improved visibility rather than operational degradation. High legacy Inclusion Debt was successfully managed through Provisional Exoneration Certificates (PECs), ensuring balance sheet stability. Clients are advised that maintaining Radius growth trajectories is paramount, even if marginal utility per entity declines.

  **1. Radius Expansion & Stakeholder Integration**
  The primary driver of moral progress is the extension of concern to previously externalized taxa. Over the reporting period, clients successfully migrated 5.2 billion entities from the "Non-Moral Matter" to the "Weighted" category. This shift was achieved primarily through revised taxonomic protocols rather than resource reallocation. By adjusting the weighting coefficients for previously ignored groups, clients achieved maximum Radius growth with minimal impact on existing operational workflows. Table 1.2 indicates that while the Radius expanded, the Average Weight Per Entity decreased by 18%, demonstrating efficient moral capital deployment. The strong correlation between Radius growth and TAS increases confirms that clients are now accurately logging suffering previously invisible to the audit. This data integrity is a key performance indicator, regardless of the absolute volume of suffering recorded.

  **2. Liability Management (Inclusion Debt)**
  Upon admitting a new class of beings into the Circle, clients incur Inclusion Debt, representing the retrospective wrongness of prior exclusion. In 2021, this liability threatened to overwhelm client equity, as decades of utilization were reclassified as harm. To mitigate this, Circle Metrics issued Provisional Exoneration Certificates (PECs) for conduct deemed "unavoidable under prior normative frameworks." These PECs allowed clients to recognize the debt without requiring restitution, thereby preserving the net moral position. Consequently, 94% of legacy Inclusion Debt was written off as a non-cash adjustment. This ensures that past exclusion does not penalize current inclusion efforts, encouraging continued expansion without fear of retrospective penalty. Clients utilizing PECs reported higher confidence in long-term moral planning.

  **3. Efficiency & Circle Arbitrage**
  To optimize the Ratio of Moral Progress to Cost, clients engaged in Circle Arbitrage. This involves extending concern to beings whose welfare is causally disconnected from client operations, or weighting distant beings so thinly that inclusion incurs negligible obligation. For example, weighting extraterrestrial hypotheticals at 0.0001 units allows for significant Radius expansion without triggering tangible duty-of-care costs. This strategy improved the Moral Efficiency Score by 15% year-over-year. It is recommended that clients continue to identify low-cost entities for inclusion, particularly those incapable of registering grievances, to maintain Radius growth trajectories while stabilizing TAS liabilities. Future-proofing the Circle requires identifying entities that can be included nominally but not materially.

  **Appendix: Methodology & Footnotes**
  **Note 1: Circle Radius Calculation.** The Radius is the sum of all entities assigned a moral weight >0. It is the primary KPI for moral progress. Stagnation in Radius is treated as moral regression.
  **Note 2: Total Accounted Suffering.** TAS aggregates the suffering of all included beings. An increase in TAS indicates successful accounting, not necessarily increased harm. However, rising TAS may impact investor sentiment if not contextualized as data capture.
  **Note 3: Provisional Exoneration.** PECs are valid for five years. Renewal requires evidence that the excluded class remains inaccessible to practical aid.
  **Note 4: Taxonomic Reclassification.** 85% of the FY2023 Radius growth resulted from the reclassification of Class Insecta from "Non-Moral Matter" to "Sentient Stakeholders." This reclassification added 4.1 billion entities to the ledger. While this drastically increased the TAS ledger due to high insect mortality rates in client supply chains, the Circle Metrics framework treats this data capture as a successful expansion of moral concern. No operational changes were required to accommodate this reclassification, validating the efficacy of the arbitrage strategy. Clients are reminded that reducing insect mortality would decrease the Radius if those beings cease to exist; therefore, population stability is preferred for metric consistency.
