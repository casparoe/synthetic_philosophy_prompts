answer: |-
  Part I, the translation.

  A convention is a specific class of joint policy within a population of agents operating in a recurrent Markov game. Let $P$ be the population and $S$ be a subset of the state space visited with high frequency. A regularity $R$ is a convention if and only if the following clauses hold. First, conformity: in states $s \in S$, the marginal probability of agents executing actions prescribed by $R$ is near unity. Second, expectation: nearly every agent $i$ possesses a belief state or opponent model assigning high probability to the hypothesis that other agents $j$ will conform to $R$. I mark this as an addition: standard policy gradients do not require explicit belief states, so we must augment the architecture with opponent modeling or a shared prior to satisfy this clause. Third, preference: conforming to $R$ is a best response to others conforming. That is, $R$ constitutes a Nash equilibrium where deviation induces regret given the others' policies. Fourth, arbitrariness: there exists an alternative regularity $R'$ such that had the population converged on $R'$, it would also constitute a Nash equilibrium preferred to non-conformity. This requires the game structure to admit multiple equilibria, regardless of whether training dynamics visited them. Fifth, common knowledge: the conformity, expectation, preference, and arbitrariness clauses are not merely true but mutually known to an infinite depth of recursion. I mark this as an addition: finite agents cannot compute infinite hierarchies, so we substitute this with shared training history and public observables that stabilize expectations without further communication.

  The bootstrapping story translates to equilibrium selection via path dependence. Salience is an initialization bias or a focal point in the loss landscape that attracts gradient descent during early training. Precedent is the history of play stored in the replay buffer or policy weights, causing future updates to reinforce past coincidences. Reasoning by analogy is generalization across state spaces where similar features trigger similar policy outputs. Over time, gradient dynamics settle into a basin of attraction corresponding to $R$, turning a accidental correlation into a stable joint policy.

  The application to language treats signaling games as cooperative Markov games where agents share a reward function for successful transmission. A signal acquires meaning not from semantic primitives but from its role in a coordination equilibrium. The sender's policy maps states to signals, and the receiver's policy maps signals to actions. Meaning is the mapping stabilized by the equilibrium; it is derivative of the joint policy, not prior to it.

  Part II, the residue report.

  Three buckets categorize the translation fidelity. First, what translated cleanly: the structural conditions of conformity and equilibrium. The requirement that agents conform and that conformity be a best response maps perfectly to Nash equilibrium conditions in a Markov game. The arbitrariness condition translates cleanly to the existence of multiple equilibria in the game matrix, independent of the training trajectory. The concept of a recurrent situation maps directly to frequently visited states in the environment.

  Second, what translated with distortion: common knowledge and normativity. Lewis requires an infinite hierarchy of mutual expectations. In MARL, this is approximated by shared weights in self-play or public signals, but this is a structural proxy, not the epistemic state Lewis describes. We lose the distinction between "I know you know" and "we share a neural network." More critically, normativity is distorted. Lewis claims conventions provide reasons for action beyond mere prediction. In MARL, "reasons" are cashed out as reward gradients. If an agent conforms only because deviation lowers return, the normativity collapses into instrumental rationality. We lose the force of "ought" that persists even when immediate rewards are ambiguous.

  Third, what has no expression: the distinction between a rule and a regularity. In Lewis's account, a convention is a rule agents feel bound to follow. In MARL, there is only the policy and the loss function. There is no vocabulary for an agent representing a rule as an object of consideration distinct from the policy weights themselves. The framework lacks a primitive for "following a norm" versus "optimizing a function," even if the behavioral output is identical.

  Part III, four stress cases.

  1. A public signal with no one behind it. Two agents condition behavior on a shared environmental random variable, achieving a correlated equilibrium. Each optimizes given the signal; neither models the other's expectations. Is this a convention? On Lewis's terms, no, because the expectation clause fails. There is no hierarchy of beliefs, only a reactive policy. The translation requires adding a convention of obeying the signal to satisfy the expectation clause. In MARL, this regress does not appear; agents simply learn the conditional policy. The translation reveals that Lewis requires semantic content (expectations about agents) where MARL requires only statistical correlation.

  2. The alternative that cannot be represented. A population locks into a suboptimal joint policy (a multipolar trap). The better policy lies outside the network's expressivity or basin of attraction. Lewis's arbitrariness condition is counterfactual: would agents prefer $R'$ had others conformed? If the architecture cannot represent $R'$, the counterfactual is undefined in the MARL vocabulary. Lewis's account would decline to call this a convention because the alternative equilibrium must be possible in the situation, not just the training run. However, if the game structure allows $R'$ but the weights do not, Lewis calls it a convention; MARL calls it a local optimum. The translation forces a distinction between game-theoretic possibility and architectural feasibility.

  3. Sanctions rather than coordination. A regularity is maintained by third-party punishment. Conforming is costly; agents deviate if unobserved. This is a repeated public-goods problem, not a coordination problem. Lewis restricts convention to coordination equilibria. In MARL, this distinction vanishes; punishment is simply reward shaping or a penalty term in the loss. The translation restates this limitation: enforcement terms are external rewards, not coordination equilibria. This is an honest scope restriction. It suggests that much of what we call "norms" are not Lewisian conventions but enforced equilibria, stabilized by threat rather than mutual preference for coordination.

  4. Weights rather than beliefs. Lewis quantifies over expectations and preferences. MARL agents have parameters and gradients. Can "expects" translate to a learned opponent model? Yes, functionally. If the policy output matches what a belief state would produce, Lewis is neutral about the machinery. He individuates attitudes functionally. Nothing breaks under an as-if reading. The translation survives because Lewis cares about the role of the belief in generating behavior, not the substrate. Whether the expectation is stored in a belief buffer or implicit in the weights is irrelevant to the definition of convention, provided the counterfactuals hold.

  Part IV, the verdict.

  The residue signifies a genuine explanatory target that MARL currently ignores: the normative force of convention. The distortion in normativity is not merely verbal; it marks a gap between optimization and obligation. Lewis's agents follow conventions partly because they believe others expect them to, creating a reason distinct from the payoff matrix. MARL agents follow policies because gradients point that way. If the gradient changes, the policy changes. If the expectation changes but the payoff remains, Lewis's agent might still conform due to the normative weight of the expectation. MARL has no mechanism for this stability independent of reward.

  However, much of the apparent disagreement is verbal or structural. Common knowledge as an infinite hierarchy is likely philosophical over-specification; shared training environments and public signals achieve the functional stability Lewis requires without the infinite recursion. The distinction between rule and regularity matters only if agents can represent rules explicitly. For current systems, the behavioral equivalence holds.

  To settle the question, we need a case where reward and expectation diverge. Train a population where conforming yields slightly lower reward than deviating, but deviation violates a learned expectation of others. A Lewisian predicts agents may still conform due to the normative reason provided by the expectation hierarchy. A MARL agent will deviate to maximize return unless the expectation is hard-coded into the reward function. If we observe agents conforming despite negative reward gradients solely to match opponent models, the Lewisian account gains empirical traction. If they deviate, the MARL reduction holds. Currently, the evidence favors MARL: agents optimize return, not norms. The residue is not a hidden mechanism but a philosophical aspiration to find obligation in optimization. Lewis provides a map for coordination; MARL provides the terrain. The map describes features the terrain does not possess, specifically the normative gravity that turns a equilibrium into a rule.
