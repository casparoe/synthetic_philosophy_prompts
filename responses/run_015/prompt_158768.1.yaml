  Who I am: I am a research engineer working in multi-agent reinforcement learning, and I have been reading the rationalist blogs and forums for about fifteen years. My native vocabulary is that of Markov games and partially observed environments: agents, policies, joint policies, reward functions and return, best response, regret, Nash equilibrium and correlated equilibrium, equilibrium selection, self-play and population-based training, emergent communication protocols, opponent modeling, gradient dynamics and the basins of attraction those dynamics settle into, and distribution shift when a trained policy is dropped into a new population. Alongside that I use the looser forum vocabulary: coordination problems, focal points, common knowledge as an infinite hierarchy of mutual expectations, multipolar traps, and the family of cases where individually reasonable updates ratchet everyone into an outcome nobody likes.

  The position I want translated: David Lewis's analysis of convention in Convention (1969). Specifically, all of its moving parts: convention as a regularity of behavior in a population, in a recurrent type of situation, where nearly everyone conforms, nearly everyone expects nearly everyone else to conform, nearly everyone prefers to conform on condition that the others conform (so that conformity is a coordination equilibrium and there is some alternative regularity that would also have been such an equilibrium had others conformed to it) — the arbitrariness condition — and where all of this is common knowledge rather than merely mutually believed to some finite depth. Alongside the definition I want the accompanying story about how such regularities get started and change without anyone having convened or agreed: the role of salience, of precedent, of reasoning by analogy, and the gradual accretion of expectations that turns a coincidence into a rule. And I want the application to language: the sender-receiver signaling games used throughout the modern literature on the emergence of communication, in which a signal is supposed to acquire something meaning-like from nothing but a coordination equilibrium among agents who are assumed to share no prior semantic resources.

  What I want from you, in four parts.

  Part I, the translation. Restate the whole package — the definition clause by clause, the bootstrapping story, and the signaling-game application to language — in the vocabulary of multi-agent reinforcement learning and of the forum, using no philosophical term of art that you have not first cashed out in that vocabulary. I want as faithful a translation as the target vocabulary admits: do not quietly substitute a weaker claim of mine for a stronger claim of Lewis's and call it a translation, and do not help yourself to primitives I did not give me. When a clause can only be rendered by adding a piece of machinery to my framework (an explicit belief state, an opponent model, a shared prior, a communication channel, an external signal), mark that addition as an addition.

  Part II, the residue report. Sort the result into three buckets: what translated cleanly, with no loss of content; what translated only with distortion, where you must say exactly what got bent and in which direction; and what has no expression in my vocabulary at all. I expect the common-knowledge clause and the normativity of convention — the way a convention is supposed to supply a reason for action and not merely a prediction about behavior — to be the interesting cases, but do not stop at the cases I anticipated.

  Part III, four stress cases, each of which I want run through the translation and then evaluated.

  1. A public signal with no one behind it. Two agents trained together converge on conditioning their behavior on a shared random signal supplied by the environment, reaching a correlated equilibrium: each is optimizing given the signal, and neither has any hierarchy of expectations about the other's expectations at all, only a learned response to an observation. Is this a convention on Lewis's terms? If the translation says yes only once you add a further convention of obeying the signal, say so, and say whether that regress has any counterpart in how my agents actually work.

  2. The alternative that cannot be represented. A population locks into a stable but bad joint policy — the familiar multipolar trap — and the better joint policy lies outside what either policy network can express, either because of the parameterization or because training never visits that basin of attraction. Lewis's arbitrariness condition is counterfactual: the agents would have preferred to conform to the other regularity had the others conformed to it. Tell me whether my vocabulary can state that counterfactual at all when the alternative is unrepresentable, and whether Lewis's account then misclassifies a lock-in as a convention or correctly declines to call it one.

  3. Sanctions rather than coordination. Consider a regularity maintained by third-party punishment, where conforming is individually costly and each agent would deviate if unobserved: not a coordination problem at all, but something more like a repeated public-goods problem with an enforcement term. Lewis's analysis is of convention, not of norms generally. Restate that limitation in my vocabulary — does the enforcement term become reward shaping, a penalty in the loss, the shadow of a commitment device? — and then tell me whether this is an honest scope restriction or a symptom that most of what we pretheoretically call norms is not convention-shaped.

  4. Weights rather than beliefs. Lewis's definition quantifies over what agents expect and prefer. My agents have parameters and gradients. Tell me whether expects can be translated into something like a learned opponent model or a belief state in a partially observed environment, or whether the only available translation is behavioral, so that the attitudes are merely as-if. Crucially: does anything in Lewis's account break under an as-if reading, or does it survive by design because he took attitudes to be functionally individuated and was officially neutral about the machinery underneath?

  Part IV, the verdict. Take whatever did not survive and adjudicate its significance. Is the residue a genuine explanatory target that the multi-agent vocabulary currently ignores and ought to add — the normative force of a convention, say, or the difference between a rule and a regularity? Or is it a marker of furniture Lewis was handed for free: agents with beliefs and desires, a fixed stock of recurrent situation-types nobody has to learn to recognize, unbounded reasoning, common knowledge as a completed infinite hierarchy? And is any part of the apparent disagreement merely verbal, the two frameworks using different words for the same phenomenon? Where you can, say what would settle the question — what observation about a trained population, or what case, both a Lewisian and I would agree is relevant, and what each of us would predict about it.
