      *   **Round 4: Credit Attribution.**
          *   *Friend 1:* Malthus didn't predict the rescue. He predicted inevitability. Giving him credit for the *exception* is wrong.
          *   *Assessment:* Friend 1 is correct. Malthus was pessimistic about technological/moral checks. He didn't anticipate the *scale* of the tech or the *voluntary* nature of the demographic transition.
          *   *Winner:* Friend 1. You can't credit a theorist for variables they explicitly ruled out or underestimated.

  3.  **Synthesize the "Right but Early" Question:**
      *   Is it meaningful? Yes, in specific contexts (e.g., peak oil, AI risk, climate change). Timing is hard in complex systems.
      *   Is it a cop-out? Often, yes. It's used to protect ideologies from disconfirmation.
