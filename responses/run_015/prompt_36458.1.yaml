answer: |-
  The configuration you are describing has a very strong established name in twentieth-century philosophy. It is the concept of **Hinge Propositions** (or **Hinge Commitments**), derived from Ludwig Wittgenstein's final notes, published as *On Certainty* (1969).

  Your description is remarkably precise: you have independently reconstructed the core arguments of hinge epistemology. The three "weird ways" you identify map almost one-to-one onto Wittgenstein's characterization of hinges.

  Here is the breakdown of the term, how it differs from its nearest neighbors, the status of the "dark version," and the boundary between settled and contested ground.

  ### 1. The Established Term: Hinge Propositions
  In *On Certainty*, Wittgenstein argues that certain propositions function not as empirical claims to be tested, but as the "hinges" on which our inquiries turn.
  *   **Your Criterion 1 (Not up for confirmation):** Wittgenstein writes, "If I want the door to turn, the hinges must stay put." You do not test the hinge; you use the hinge to test the door. To try to verify "I have hands" empirically would require using your hands to check your hands, which presupposes the very thing you are checking.
  *   **Your Criterion 2 (Justification refusal):** Wittgenstein states, "Giving grounds, however, justifying the evidence, comes to an end." The end is not an ungrounded presupposition (which sounds weak); it is an *ungrounded way of acting*. When someone says, "That's not a serious question," they are correctly identifying that the question attempts to step outside the language game that gives the question meaning.
  *   **Your Criterion 3 (Doubt can't get a grip):** This is the famous "riverbed" argument. Doubt itself requires a background of certainty to function. "If you tried to doubt everything you would not get as far as doubting anything." To doubt the world existed five minutes ago, you would need memories to compare it against, but the reliability of memory is itself part of the hinge system you are doubting.

  **Refinement:** While Wittgenstein called them "propositions," contemporary philosophers (like Duncan Pritchard and Annalisa Coliva) often prefer **Hinge Commitments**. This captures your intuition that these might not be "beliefs" in the standard truth-apt sense, but rather commitments or rules we embody.

  ### 2. Nearest Established Concepts (and Differences)

  You correctly identified that standard epistemological boxes don't quite fit. Here is how Hinge Epistemology distinguishes itself from them:

  | Concept | How it resembles your phenomenon | How it differs (The Crucial Distinction) |
  | :--- | :--- | :--- |
  | **Foundationalism** | Both agree the regress of justification must stop somewhere. | Foundationalism claims the stopping point is *positively justified* (self-evident, incorrigible). Hinges are *exempt* from justification. A foundation is a strong brick; a hinge is the axis that allows bricks to be laid. |
  | **Quine's Web of Belief** | Both acknowledge some beliefs are more central than others. | Quine says central beliefs are *harder* to revise but revisable in principle (even logic). Hinge theory suggests these commitments are *constitutive* of the inquiry. If you revise them, you aren't correcting the web; you are leaving the language game entirely. |
  | **Presuppositions** | Both function as prerequisites for other claims. | Presuppositions are usually logical or linguistic (e.g., "The King of France is bald" presupposes a King). Hinges are *epistemic* and *pragmatic*; they govern what counts as evidence, not just sentence meaning. |
  | **Dogma** | Both resist evidence and doubt. | Dogma is a *failure* of rationality (ignoring counter-evidence). Hinges are a *condition* of rationality (defining what counts as evidence). Ignoring a dogma is critical thinking; ignoring a hinge is nonsense. |

  ### 3. The "Dark Version": Universal vs. Local Hinges

  You asked whether the "dark version" (e.g., "The authorities can be trusted") is the same phenomenon or a pretender. This is the single most contested issue in contemporary hinge epistemology.

  **View A: The Universalist (It's a Pretender)**
  *   **Proponents:** Early Wittgenstein readers, some Kantians.
  *   **Argument:** True hinges are universal conditions of human agency and inquiry (e.g., "There is an external world," "Induction works"). These are shared by all rational agents.
  *   **Verdict on Dark Version:** "Trust the authorities" is not a hinge; it is a *dogma masquerading as a hinge*. It is revisable without collapsing the possibility of inquiry. A society can doubt authorities and still function; a society cannot doubt the existence of an external world and function.

  **View B: The Localist (It's the Same Phenomenon)**
  *   **Proponents:** Daniele Moyal-Sharrock, Avrum Stroll.
  *   **Argument:** Hinges are relative to "forms of life." What functions as a hinge for a secular scientist ("Evidence trumps authority") differs from a hinge for a religious fundamentalist ("Scripture trumps evidence").
  *   **Verdict on Dark Version:** It *is* a hinge, but a **local/sociological hinge** rather than a **grammatical/universal hinge**. Structurally, it functions exactly as you described (doubt feels like malfunction). The difference is not in the *mechanism*, but in the *scope*. This view implies that rational disagreement between frameworks is harder than we think, because they are operating on different hinges.

  ### 4. Settled vs. Contested

  Since you asked to separate the consensus from the fights:

  **Settled (or Near-Consensus):**
  1.  **The Regress Stops:** There is broad agreement that epistemic justification cannot go on infinitely and must terminate in something that is not itself justified by evidence.
  2.  **The Role of Certainty:** There is agreement that some certainty is required for doubt to be meaningful (you cannot doubt *everything* at once).
  3.  **The Examples:** "I have two hands," "The world existed 5 minutes ago," and "Induction works" are paradigm cases of this category.

  **Genuinely Contested:**
  1.  **Truth-Aptness:** Are hinge commitments *true*? Wittgenstein suggests they are "animal" certainties, not knowledge claims. Some philosophers (Crispin Wright) argue we have an "entitlement" to accept them without evidence, but they aren't strictly "known." Others argue they are simply non-propositional rules.
  2.  **Universal vs. Local:** As noted above, is "The authorities can be trusted" a hinge? Universalists say no (that's ideology); Localists say yes (that's a cultural hinge). This has massive political implications.
  3.  **Rationality of Revision:** Can hinges change? Wittgenstein suggests the "riverbed" of thoughts can shift over time. But if they shift, was it rational? If a society moves from "God exists" to "God does not exist" as a hinge, was that a rational progression or just a change in form of life?

  ### 5. Boundary Cases (Where the term stops applying)

  To ensure this concept isn't overextended, here are two boundary cases where "Hinge Commitment" stops fitting:

  **Case 1: The Stubborn Empiricist (Not a Hinge)**
  *   *Scenario:* A person believes "Vaccines cause autism" despite overwhelming data. When challenged, they say, "I just know it's true," and refuse to look at studies.
  *   *Analysis:* This is **not** a hinge commitment. Why? Because the claim ("Vaccines cause autism") is an empirical claim *within* the game of science. It is the kind of thing that *could* be checked. The refusal to check is a vice (dogmatism), not a structural necessity. A hinge is something you *cannot* check without presupposing it. You can check vaccine safety without presupposing vaccine safety.

  **Case 2: The Mathematical Axiom (Not a Hinge)**
  *   *Scenario:* "2 + 2 = 4."
  *   *Analysis:* This is often confused with a hinge, but it is a **logical truth** or **rule of grammar**. You described your target as "not self-evident in the way 2+2=4 is." Hinges are *contingent* (the world *could* have been created 5 minutes ago, logically speaking) but we treat them as certain. Logical truths are necessary. Hinges are contingent certainties.

  ### Summary
  You have described **Hinge Commitments**.
  *   **Name:** Hinge Propositions / Hinge Epistemology (Wittgenstein).
  *   **Status:** A recognized and active field in contemporary epistemology.
  *   **The "Dark" Question:** Contested. Universalists call it a category error (ideology); Localists call it a cultural hinge.
  *   **Key Distinction:** Unlike foundational beliefs, they are not justified; unlike dogmas, their exemption from justification is not a defect but a structural requirement for inquiry.

  If you wish to coin a term to specifically capture the *phenomenological* feeling you described (the "doubt can't get a grip" aspect) distinct from the logical structure, you might use **"Arational Scaffolding."** But philosophically, you are standing on solid Wittgensteinian ground.
