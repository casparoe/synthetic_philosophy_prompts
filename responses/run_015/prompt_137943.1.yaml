answer: |-
  The intuition behind your disagreement dividend is mathematically sound in a narrow sense but morally and strategically hollow when placed in the broader context of value maximization. It is a genuine feature of the game theory of trade that gains arise from divergence, yet it is a conceptual artifact to suggest this creates a stable incentive to propagate error. The core reason is that moral trade is a second-best solution to moral agreement. If you believe your values are correct, the optimal outcome is not that others trade with you while holding false values, but that others share your true values and cooperate directly. The utility gain from converting a partner to your cause almost always dominates the efficiency gain from trading with them in error, because conversion unlocks their entire budget for what you deem good, whereas trade only unlocks a fraction of it while forcing you to subsidize what you deem less good.

  To see why the dividend collapses, consider the arithmetic of the scenario you described. You value global health at one unit and astronomical suffering reduction at one-third of a unit. Your trading partner holds the reverse view. If you trade, you specialize in suffering reduction and they specialize in health. You gain because they fund health at full efficiency, while you only sacrifice the marginal difference in your own valuation. However, if you successfully convince them that health is the superior cause, they switch their entire budget to health. You no longer need to spend your resources on suffering reduction to incentivize them; you both spend on health. The total amount of health funded doubles compared to the no-trade baseline, whereas the trade scenario only yields a thirty-three percent efficiency gain on the existing split. Since you believe health is objectively more valuable, the state of agreement yields more of what you value than the state of traded disagreement. Therefore, you never have a rational incentive to spread the view you consider false; you always have a stronger incentive to spread the view you consider true, because the conversion dividend exceeds the disagreement dividend.

  This holds even when we account for moral uncertainty. If you are not certain your values are correct, the incentive to preserve disagreement weakens further rather than strengthening. Under moral uncertainty, the expected value of converting someone to your view includes the possibility that they might convert you to theirs, or that joint deliberation will reveal a third, superior option. Entrenching disagreement locks both parties into suboptimal strategies based on potentially false premises. The only scenario where the disagreement dividend genuinely outweighs the conversion dividend is if conversion is impossible but trade is enforceable, and if the false view is strictly neutral rather than harmful. But if conversion is impossible, you cannot fund the spread of the view anyway, so the incentive to propagate error vanishes with the means of propagation. If the false view is harmful, the disvalue of that harm usually swamps the trade efficiency gains, making the propagation of error net negative even by your own lights.

  The case of future generations or unenforceable one-shot trades further dissolves the problem. You noted the scenario where trade is unenforceable, such as with a civilization you will never meet. In such cases, moral trade itself collapses because there is no mechanism to ensure reciprocity. If you cannot enforce the trade, you cannot secure the disagreement dividend, so there is no instrumental reason to want them to hold divergent values. You simply want them to do what is good. If you could influence their values, you would want them to hold the correct values so that their autonomous actions align with the good, rather than holding false values in the hope of a trade that cannot be contracted. The incentive to want others to be wrong is thus parasitic on the existence of enforceable contracts between agents with fixed, divergent values. Once you allow for value change or remove enforceability, the incentive disappears.

  There is a residual worry about leakage, where spreading a false view to create a trading partner might influence third parties who do not trade with you. This reinforces the conclusion that the dividend is an artifact. If you spread a false view to secure a trade partner, you risk corrupting non-trading agents who will then act on that false view without compensating you via trade. Since you believe the view is false, their actions based on it produce less value than actions based on the true view. The negative externality of spreading error to non-traders will almost certainly outweigh the marginal efficiency gain from the trading partner, unless the trading partner controls a vastly disproportionate share of resources and the non-traders are negligible. Given that moral views tend to spread broadly rather than remaining contained within a bilateral contract, the risk of leakage makes the strategy of propagating error instrumentally irrational.

  My verdict is that the disagreement dividend is a cute artifact of a static model that ignores the superior value of moral convergence and the risks of error propagation. It is not a genuine problem for the practice of moral trade because no agent who believes their values are truth-apt should ever prefer a world with more error over a world with more truth, even if the error facilitates a temporary efficiency gain. The gain from trade is real, but the gain from agreement is larger, and the ability to spread views implies the ability to spread the true ones. Therefore, moral trade does not incentivize moral corruption; it incentivizes finding partners who are currently different but ideally convertible.

  I am about eighty-five percent confident in this conclusion. The remaining uncertainty lies in edge cases involving capacity constraints or non-linear returns to scale. For instance, if there is a strict cap on how much effective global health spending can be absorbed, converting a partner might lead to diminishing returns where their additional funding is wasted, whereas trading them into a different cause utilizes otherwise idle resources. In such a specific economic environment, the disagreement dividend could theoretically exceed the conversion dividend. I would also move off this verdict if it were demonstrated that moral values are not truth-apt but purely preferential, such that being wrong is meaningless and only satisfaction matters, though even then, the satisfaction of seeing one's preferred outcome realized by others usually outweighs the satisfaction of efficient trading. However, under standard assumptions of moral realism and diminishing marginal returns, the artifact diagnosis holds.
