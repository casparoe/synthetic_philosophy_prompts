answer: |-
  # Teaching Plan: Dominance by Mixed Strategies
  **Target:** First-year Logic Grad Students (Philosophy of Science Workshop)
  **Duration:** 90 Minutes
  **Goal:** Demonstrate that a pure strategy can be irrational because a *mixture* of other strategies outperforms it, regardless of the opponent's move, and that this does not imply a unique rational solution.

  ---

  ## 1. Conceptual Dependency Map (Prerequisite Chain)
  Before introducing dominance by mixture, verify or establish these nodes. Logic students will grasp the formalism quickly but may stumble on the *interpretation* of the nodes.

  1.  **Preference $\to$ Utility:** Ensure they accept that ordinal preferences can be represented by cardinal utility for the sake of expectation calculations (Von Neumann-Morgenstern style). *Logic bridge:* Treat utility as a valuation function $V: \text{Outcomes} \to \mathbb{R}$.
  2.  **Decision Tree $\to$ Strategic Form (Matrix):** They know trees (sequential). You must translate this to simultaneous moves.
      *   *Key shift:* In a tree, you react to nodes. In a matrix, you commit to a row without knowing the column.
  3.  **Pure Strategy $\to$ Mixed Strategy:**
      *   *Pure:* A deterministic rule (e.g., "Bid Medium").
      *   *Mixed:* A probability distribution over pure strategies (e.g., "Flip a coin: Heads=Low, Tails=High").
      *   *Crucial Distinction:* A mixed strategy is an **available plan**, not a representation of uncertainty about the opponent.
  4.  **Linearity of Expectation:** They must accept that $E[U(\text{Mix})] = \sum p_i E[U(\text{Pure}_i)]$. This is the engine that makes mixture dominance work.
  5.  **Strict Dominance (Pure vs. Pure):** Define $S_1$ dominates $S_2$ if $U(S_1, O_j) > U(S_2, O_j)$ for all opponent strategies $O_j$.
  6.  **Strict Dominance (Mixed vs. Pure):** The target concept. $S_{mix}$ dominates $S_{pure}$ if $E[U(S_{mix}, O_j)] > U(S_{pure}, O_j)$ for all $O_j$.

  ---

  ## 2. The Core Example: "The Reserve Price Auction"
  **Constraint Check:** Discrete actions, no calculus, 3 strategies (Low, Medium, High), "Medium" dominated by 50/50 mix of Low/High.
  **Pedagogical Adjustment:** While the scenario is a three-bidder auction, represent it as a **2-Player Matrix** (You vs. The Field). The "Field" has two relevant states (Aggressive vs. Passive) to keep the matrix readable for first-timers.

  **The Payoff Matrix (Your Utility):**
  | You \ Field | Passive ($F_P$) | Aggressive ($F_A$) |
  | :--- | :---: | :---: |
  | **Low ($L$)** | 0 | 7 |
  | **Medium ($M$)** | 3 | 3 |
  | **High ($H$)** | 7 | 0 |

  **Narrative:**
  *   **Low Bid:** Wins only if Field is Passive. Pays little. (0 if Aggressive, 7 if Passive).
  *   **High Bid:** Wins always, but expensive. (7 if Passive, 0 if Aggressive due to overpayment).
  *   **Medium Bid:** Safe middle ground. Always yields 3.

  **The Mathematical Move:**
  1.  **Check Pure Dominance:**
      *   Does $L$ dominate $M$? No ($0 < 3$ against $F_P$).
      *   Does $H$ dominate $M$? No ($0 < 3$ against $F_A$).
      *   *Student Trap:* They will conclude $M$ is rational because it isn't dominated by any *single* pure strategy.
  2.  **Introduce Mixture $\sigma = 0.5L + 0.5H$:**
      *   Against $F_P$: $0.5(0) + 0.5(7) = 3.5$.
      *   Against $F_A$: $0.5(7) + 0.5(0) = 3.5$.
  3.  **Comparison:**
      *   $3.5 > 3$ in both columns.
      *   **Conclusion:** $M$ is strictly dominated by the mixture $\sigma$. A rational agent cannot play $M$.

  ---

  ## 3. Session Arc (90 Minutes)

  ### Part I: The Setup & The Trap (20 mins)
  *   **Translate Trees to Matrices:** Briefly show how a decision tree collapses into a matrix when moves are simultaneous. Emphasize that a "Row" is a complete plan of action.
  *   **Present the Auction Matrix:** Write the $3 \times 2$ matrix on the board.
  *   **The Intuition Check:** Ask: "Which bid is safest?" Most will say Medium. It guarantees 3. It looks robust.
  *   **The Pure Dominance Test:** Walk through the definition of strict dominance. Ask students to check if $L$ dominates $M$, or $H$ dominates $M$.
  *   **Result:** They confirm no pure strategy dominates $M$.
  *   **The Hook:** "If rationality is just eliminating dominated strategies, and nothing dominates $M$, can we play $M$?" (Let them say Yes).

  ### Part II: The Mixture Move (30 mins)
  *   **Define Mixed Strategy as a Device:** Do not frame this as "randomizing." Frame it as **hiring an agent**. "I hire an agent and tell them: Flip a coin. If Heads, bid Low. If Tails, bid High." This is a single *plan* available to you.
  *   **Calculate Expectations:** Compute the expected payoff of the 50/50 Mix against each column (as shown in Section 2).
  *   **The Reveal:** The Mix yields 3.5 against *both* opponent types.
  *   **The Logical Punch:** Since $3.5 > 3$, the plan "Mix" is strictly better than the plan "Medium" in every possible state of the world.
  *   **Philosophical Point:** Rationality is about consistency of plans. If Plan A beats Plan B in every possible world, Plan B is irrational, even if Plan A involves a coin flip.

  ### Part III: Addressing Misconceptions (25 mins)
  *Address these in the specific order requested.*

  **1. "Why can't I just best-respond with pure strategies?"**
  *   *The Objection:* "If I knew the Field was Passive, I'd play High. If Aggressive, I'd play Low. Why commit to a mix?"
  *   *The Response:* Dominance is **belief-free**. We are not asking what you *should* play given a belief. We are asking what you *cannot* play given *any* belief. If you play Medium, you are guaranteed to do worse than if you had committed to the Mix, regardless of what the Field does. You don't need to know the opponent to eliminate $M$.

  **2. "Is mixing just averaging my beliefs?"**
  *   *The Objection:* "Isn't the 50/50 just saying I think the Field is 50/50?"
  *   *The Response:* No. That is the **Epistemic/Strategic Confusion**.
      *   *Epistemic:* "I assign probability 0.5 to the Field being Passive." (Belief about *them*).
      *   *Strategic:* "I assign probability 0.5 to myself playing Low." (Commitment about *me*).
      *   *Proof:* The dominance holds even if the Field is 99% Passive. The Mix yields 3.5 vs Passive; Medium yields 3. The Mix wins regardless of your belief.

  **3. "Doesn't iteration always leave one strategy standing?"**
  *   *The Objection:* "Okay, eliminate $M$. Now we have $L$ and $H$. Doesn't rationality force me to pick one?"
  *   *The Response:* No. This is the **Existential Misconception**.
      *   After eliminating $M$, look at the remaining matrix ($L$ and $H$).
      *   Does $L$ dominate $H$? No (0 vs 7).
      *   Does $H$ dominate $L$? No (7 vs 0).
      *   *Conclusion:* Rationality (via IEDS) has pruned the tree, but it has not determined the action. You are left with $\{L, H\}$. Rationality is a constraint, not a solver. It tells you what you *can't* do, not always what you *must* do.

  ### Part IV: Check for Understanding (10 mins)
  **Task:** Hand out a slip with a new matrix. Do not use numbers they can easily guess (avoid symmetry).

  **The "Trap" Matrix:**
  | You \ Opp | Left | Right |
  | :--- | :---: | :---: |
  | **Top** | 2 | 6 |
  | **Middle** | 3 | 3 |
  | **Bottom** | 6 | 2 |

  **Questions:**
  1.  Is *Middle* dominated by *Top*? (No)
  2.  Is *Middle* dominated by *Bottom*? (No)
  3.  Find a mixture of *Top* and *Bottom* that dominates *Middle*.
      *   *Solution:* Any mix $p \cdot \text{Top} + (1-p) \cdot \text{Bottom}$ where the expected payoff $> 3$ in both columns.
      *   Against Left: $2p + 6(1-p) > 3 \Rightarrow 6 - 4p > 3 \Rightarrow 4p < 3 \Rightarrow p < 0.75$.
      *   Against Right: $6p + 2(1-p) > 3 \Rightarrow 2 + 4p > 3 \Rightarrow 4p > 1 \Rightarrow p > 0.25$.
      *   *Answer:* Any mix where $0.25 < p < 0.75$ (e.g., 50/50) dominates Middle.
  4.  **Crucial Question:** "Does eliminating Middle tell you whether to play Top or Bottom?"
      *   *Correct Answer:* No.

  **Grading Criterion:** They pass only if they identify that Middle is eliminable *and* that Top/Bottom remain underdetermined.

  ### Part V: Scope Boundaries (What to Leave Out)
  Explicitly tell students what you are **not** covering to prevent them from spinning out on advanced topics.

  1.  **Common Knowledge of Rationality (CKR):**
      *   *Say:* "We are assuming you know the opponent is rational, but we are not iterating the 'I know that you know that I know' loop infinitely today. We are just doing one or two rounds of elimination."
      *   *Why:* CKR leads to Nash Equilibrium discussions which require fixed-point theorems they don't have yet.
  2.  **Continuous Strategies:**
      *   *Say:* "We are keeping bids discrete (Low, Med, High). In real auctions, bids are continuous, which requires calculus to find dominance. The logic is the same, but the math obscures the philosophy today."
  3.  **Weak Dominance:**
      *   *Say:* "We are only looking at *Strict* Dominance (strictly better). If a strategy is only 'at least as good,' we leave it for now. Weak dominance introduces equilibrium selection problems we aren't ready for."
  4.  **Nash Equilibrium:**
      *   *Say:* "We are not solving the game today. We are only pruning the impossible moves. Solving requires knowing what the opponent does (Equilibrium); Pruning only requires knowing what is impossible for *you*."

  ---

  ## 4. Instructor Notes on Delivery
  *   **Leverage Logic Background:** When defining a Mixed Strategy, write it as a vector $\sigma = (p_1, p_2, p_3)$. When checking dominance, treat it as a linear inequality system. This comforts the logic students.
  *   **Combat the "Unique Answer" Bias:** Philosophy students often want rationality to be truth-tracking (like logic). Emphasize that Game Theory rationality is *instrumental*. If two instruments ($L$ and $H$) are incomparable without knowing the environment, rationality stays silent. That silence is a result, not a failure.
  *   **The "Randomness" Hurdle:** If they argue "But I don't want to flip a coin," reiterate: "You don't have to. You just have to admit that *if* you had the option to commit to that coin flip, you would have done better than committing to Medium. Therefore, committing to Medium is a mistake." Dominance is about the availability of a superior plan, not the requirement to randomize.
