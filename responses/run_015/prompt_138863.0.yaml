  The argument presents as mere arithmetic because it calculates payoffs conditional on reaching nodes while ignoring that reaching those nodes falsifies the conditions required for the calculation. It treats the game tree as if every node is reachable under CKR. It is not. Only node 1 is reachable under CKR. Analyzing node 20 as if it were reachable while maintaining CKR is a counterfactual inconsistency. Step (7) highlights this by comparing the CKR outcome (Take at 1) with a modified game where CKR is intentionally broken (commitment to Pass). The claim that rationality is self-effacing confuses the payoff of being rational in the original game with the payoff of altering the game's epistemic conditions.

  If you repair the induction by requiring beliefs to update upon deviations, the argument fails. If Player 2 sees a Pass at node 1, they should update their belief about Player 1's rationality or strategy. If there is a chance Player 1 will continue Passing, Player 2 may prefer to Pass at node 2. This restores the possibility of cooperation without requiring players to pay to become irrational.

  This repair necessarily undermines the standard case for defection in the finitely repeated prisoner's dilemma. That argument also relies on backward induction assuming rationality persists regardless of prior cooperation. If early cooperation implies the opponent is not a standard backward-inducting rational agent, the incentive to defect at the final stage does not backward-induce to the first stage. Rationality is not self-effacing; rather, the standard model ignores the informational content of deviations. You keep the stipulations and (1) by accepting that (3) illicitly extends knowledge into histories that falsify its own premises.

  The price is abandoning the notion that rationality is context-invariant. You must accept that rational strategy depends on how beliefs update when predictions fail. This avoids the absurdity of (7) without denying the monitors. The monitors show rationality *given beliefs*. When play deviates, beliefs change, and the monitor's reading might no longer predict the same action. The gap is epistemic, not arithmetic.
