answer: |-
  ### Part 1: Brainstorming Mechanisms

  Before we settle on the design, let's weigh up three different ways we could structure the interaction. Each creates a different 'feel' in the room and highlights different aspects of the theory.

  1.  **The Canonical Urn Game (Anderson & Holt style):**
      *   **Mechanism:** Two urns (Red-majority and Blue-majority) are selected by coin toss. Students draw a ball privately, then publicly guess the urn.
      *   **Feel:** Creates a clean, mounting tension as the public chain grows; students feel the 'weight' of history pressing against their private draw.
      *   **Fall Flat:** It can feel sterile; students often attribute herding to 'social pressure' or 'conformity' rather than rational Bayesian updating, missing the epistemic point.

  2.  **The Heterogeneous Expertise Twist (Your Variable Signal Wrinkle):**
      *   **Mechanism:** As above, but some students are secretly told their signal is 80% accurate ('Experts') while others are 60% ('Novices').
      *   **Feel:** Creates a hierarchy; 'Experts' feel a burden to lead, 'Novices' feel permission to follow.
      *   **Fall Flat:** This conflates *informational* cascades (my signal is swamped by public history) with *reputational* cascades (I think you know better than me). For first-years, distinguishing these is vital; mixing them muddies the water on why *identical* rational agents herd.

  3.  **The Costly Revelation Market (Your Announcement Wrinkle):**
      *   **Mechanism:** Standard urn game, but students can pay points to reveal their private signal on the board before guessing.
      *   **Feel:** Highlights the 'public good' nature of information; students feel the frustration of knowing the truth is locked away because no one wants to pay to unlock it.
      *   **Fall Flat:** If the cost is too high, nobody plays, and the cascade locks in too early; if too low, everyone reveals, and the cascade never forms, killing the lesson.

  **Commitment:**
  I am committing to **Mechanism 3 (The Costly Revelation Market)**, but I must advise you to **drop the Variable Signal Quality wrinkle**.
  *Why?* If students have different signal qualities, a student ignoring their signal might do so because they defer to an 'Expert', not because the *mathematics of the public history* outweighs their private info. To teach that *everyone* becomes rationally identical in a cascade, we need homogeneous agents. I will swap the variable quality for a **two-round structure**: Round 1 is pure herding (to feel the lock-in); Round 2 introduces the Costly Revelation (to feel the inefficiency).

  ---

  ### Part 2: Workshop Design – "The Information Lock-In"

  #### 1. Materials List
  *   **Two opaque boxes** (labelled 'Urn A' and 'Urn B' for setup, but covered during play).
  *   **24 Envelopes** (pre-packed, see Deck Construction).
  *   **Index Cards:** Red and Blue (to place on whiteboard).
  *   **Whiteboard & Markers:** To track the public history (A/B guesses) and point scores.
  *   **Scorecards:** Small slips of paper for students to track their points.
  *   **Incentive:** A bag of sweets or chocolates for the top 3 scorers (essential for engagement without using grades).

  #### 2. Deck Construction (The Maths)
  You need the signal accuracy to be exactly **2/3 (66.7%)**. This ensures the asymptotic error rate is exactly **1/5 (20%)**, as you noted.
  *   **Do not use physical balls.** Sampling error with replacement is too messy for a 75-minute class. Use pre-packed envelopes.
  *   **Preparation:** Before class, decide the 'True State' for Round 1 and Round 2 (e.g., Round 1 = Urn A, Round 2 = Urn B).
  *   **Pack 24 Envelopes for Urn A:** 16 contain a **Red Card** (Signal A), 8 contain a **Blue Card** (Signal B).
  *   **Pack 24 Envelopes for Urn B:** 16 contain a **Blue Card** (Signal B), 8 contain a **Red Card** (Signal A).
  *   *Note:* Shuffle the envelopes thoroughly before handing them out so students don't know their position in the signal distribution.

  #### 3. Payoff Scheme
  We need to make the 'Reveal' option individually costly but socially valuable to demonstrate market failure.
  *   **Correct Guess:** +10 Points.
  *   **Incorrect Guess:** 0 Points.
  *   **Revealing Signal:** -4 Points (deducted from total score, regardless of outcome).
  *   **Starting Endowment:** 5 Points (so they can afford to reveal once without going negative immediately).
  *   **Rationale:** With a 2/3 signal, a cascade creates an ~80% chance of being right. Expected value of following the herd = 8 points. Expected value of revealing = 10 (certainty of acting on info) - 4 (cost) = 6 points. *Rational choice is to not reveal.* This proves the inefficiency: information stays hidden because it's not privately profitable to share it.

  #### 4. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:10: Setup & Rules**
  *   Seat students in a semi-circle or rows where they can see the board and each other.
  *   **The Story:** "There are two states of the world, Urn A (mostly Red) and Urn B (mostly Blue). One has been chosen by coin toss. You will each get a private hint (a card). You must guess the Urn."
  *   **The Rules:**
      1.  Open envelope, look at card, keep it secret.
      2.  Decide: Guess A or B.
      3.  Optional: Pay 4 points to reveal your card on the board *before* guessing.
      4.  Write your guess on the board (public history).
      5.  **Strict Silence:** No talking once envelopes are distributed.
  *   Distribute envelopes for Round 1. **Do not let them open yet.**

  **00:10 – 00:35: Round 1 (The Pure Cascade)**
  *   **Constraint:** Reveal option is **disabled** for Round 1 (tell them this explicitly). We want a clean cascade first.
  *   Student 1 opens, guesses, writes on board.
  *   Student 2 opens, guesses, writes on board.
  *   Continue down the line.
  *   *Facilitator Note:* Watch for the 'tipping point'. Usually, after 3 or 4 matching guesses (e.g., A, A, A), the next person will ignore a conflicting signal (B) and guess A.
  *   **Speed:** Keep it moving. If a student hesitates, gently prompt: "Private information only, please make your public decision."
  *   **End of Round:** Reveal the True Urn. Calculate scores (10 for correct).

  **00:35 – 00:45: Mini-Debrief 1**
  *   Ask the students who herd: "Did you look at your card?" (Yes). "Did you vote with the card?" (No). "Why?"
  *   Capture their reasoning on the board. Look for: "I thought the others knew something," or "The odds were better following the group."
  *   **Key Point:** Validate that ignoring their own eyes was the *mathematically rational* thing to do.

  **00:45 – 01:05: Round 2 (The Market for Information)**
  *   Reset scores. Distribute new envelopes (True State should be different from Round 1 if possible, to keep it fresh).
  *   **New Rule:** The **Reveal Option is now active**. "You can pay 4 points to show your card to the class before you guess."
  *   Run the sequence again.
  *   *Prediction:* Almost no one will reveal. The cascade will form, and students will watch others 'suffer' a potential loss rather than pay the cost to fix it.
  *   *Intervention:* If the cascade locks onto the *wrong* answer (which happens 1 in 5 times), the tension will be palpable. Let it play out.

  **01:05 – 01:15: Final Debrief & Theory Connect**
  *   Tally scores. Distribute sweets.
  *   Map the experience to the three learning outcomes (see below).
  *   Address the "1/5 Error Rate" maths explicitly.

  ---

  ### Part 3: The Debrief (Mapping Experience to Theory)

  You need to translate their feelings into epistemology. Here is how to script the connection:

  **1. Independence vs. Herding (The "Empty Information" Point)**
  *   *Ask:* "In Round 1, after student number 5, how much new information did student number 6's guess give us?"
  *   *Answer:* None.
  *   *Lesson:* Once a cascade starts, public guesses stop aggregating private data. They just echo the past. The group size grows, but the *information* does not. A herd of 1,000 people can be just as ignorant as a herd of 5.

  **2. Rationality of Ignoring Evidence**
  *   *Ask:* "For those who ignored your card: were you being irrational? Or conformist?"
  *   *Lesson:* You were being **Bayesian**. Your private signal (66% reliable) was outweighed by the public history (which represented multiple 66% reliable signals). It is rational to be wrong if the public information is strong enough. This distinguishes *informational cascades* from *normative conformity* (wanting to fit in).

  **3. The 1/5 Error Rate & Lock-In**
  *   *The Maths:* Explain the formula simply. "With 2/3 accuracy, the probability of the group locking onto the *wrong* urn is $\frac{(1/3)^2}{(2/3)^2 + (1/3)^2} = 1/5$."
  *   *The Feeling:* "Did anyone feel that as we got to student 20, we were 'safer' than at student 5?"
  *   *Lesson:* No. Once the cascade locks (usually by person 3 or 4), the probability of error freezes. Adding more people does not correct the error; it just amplifies the confidence in the mistake.

  **4. The Costly Revelation (Market Failure)**
  *   *Ask:* "In Round 2, why didn't anyone pay the 4 points to reveal?"
  *   *Lesson:* Information is a **public good**. If you reveal, you help everyone behind you, but you bear the full cost. Individually, it was rational to stay silent. Collectively, we were poorer for it. This explains why cascades are hard to break even when people have contrary evidence.

  ---

  ### Part 4: Straight Talk on Risks & Limitations

  **What Will Predictably Go Wrong (and how to handle it):**

  1.  **The "Chatter" Contamination:**
      *   *Risk:* Students 3 and 4 will whisper, "I've got Blue, what have you got?"
      *   *Fix:* Frame this as 'insider trading'. If I catch you, your score is voided. Stand near the students who look most prone to chat. If it happens, stop the class, reset the scores for that round, and lecture on 'signal noise'.
  2.  **The "Grade Anxiety" Distortion:**
      *   *Risk:* Students treat points as grades and play risk-averse (or ask if this counts towards the module).
      *   *Fix:* Be explicit in the first 2 minutes: "This is for chocolates and bragging rights. It has zero impact on your degree. I want you to take rational risks."
  3.  **The "Counting" Error:**
      *   *Risk:* A student miscounts the public history on the board (e.g., thinks there are 3 As when there are 4).
      *   *Fix:* Appoint a 'Scrivener' (a student at the front) whose only job is to maintain the tally on the board. This gives them a role and ensures accuracy.

  **What The Game Cannot Stage (The Limitations):**

  You must be honest about what the model leaves out. The game assumes **sequentiality** and **binary choices**.
  *   **Simultaneity:** In real life (e.g., stock markets), people decide roughly at the same time. This game forces a line.
  *   **Signal Observation:** In the game, you see the *action* (guess), not the *signal* (card), unless someone pays. In reality, we often observe mixed signals (news headlines) rather than pure actions.
  *   **The "Why" of the Cascade:** The game proves a cascade *can* happen. It doesn't fully explain *how* to detect one in the wild. You need to tell them: "In the real world, look for uniformity of opinion despite diversity of incentives. If everyone agrees despite having different reasons to disagree, you might be in a cascade."

  **Final Advice on the Wrinkles:**
  I strongly recommend **against** the Variable Signal Quality (Experts vs. Novices).
  *   *Reason:* If a student with a 'Sharp' signal herds, the class will ask: "Did they herd because of the math, or because they thought the previous people were also Experts?" You cannot disentangle the two.
  *   *Alternative:* Keep the signals uniform (2/3) for the game. In the debrief, *ask* them: "How would this change if Student 1 was known to be a Professor?" This allows you to discuss reputational cascades theoretically without ruining the clean data of the experiment.

  This structure gives you the rigour of the canonical model with the behavioural 'bite' of the market failure, all within a tight 75-minute window. Good luck with the session.
