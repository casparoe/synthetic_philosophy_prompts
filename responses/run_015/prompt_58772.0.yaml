answer: |-
  # Workshop Plan: "The Kiosk Catastrophe"

  **Goal:** Students experience the combinatorial explosion of "frame axioms" (rules about what *doesn't* change) and the difficulty of defining relevance without being told the definition of the Frame Problem upfront.
  **Audience:** 22 First-Year Undergrads (Mix of CS & Phil).
  **Time:** 70 Minutes.
  **Group Size:** 4 Teams of 5 Students + 2 System Auditors (or fold auditors into teams if you prefer 5 teams of 4).

  ---

  ## 1. Materials & Setup

  **Physical Props (The "World"):**
  *   **Shelf A:** A table or designated zone.
  *   **The Cart:** A cardboard box or rolling bin.
  *   **The Doorway:** Two chairs marking an entrance.
  *   **Inventory:** 10 plastic mugs, 20 plastic spoons, 1 "Broken Mug" (paper/cracked prop), 1 "Washbin" (bucket).
  *   **Whiteboard:** Divided into 4 quadrants (one per team) for writing rules.
  *   **Timer:** Visible to all.

  **Team Roles:**
  *   **Teams Alpha & Beta (Programmers):** Write the rule cards.
  *   **Teams Gamma & Delta (The Bots):** Execute the rules *literally*.
  *   **2 System Auditors:** Count the total number of rule clauses written (to track "bloat").
  *   *(Note: Swap roles halfway through so everyone programs and executes.)*

  **Currency:**
  *   **"Compute Credits" (CC):** Write on the board. No physical money.
  *   **Starting Balance:** 100 CC per team.

  ---

  ## 2. Game Rules & Scoring

  **The Three Core Goals (The "Mission"):**
  1.  **Mugs:** Exactly 5 clean mugs must be on Shelf A at the end.
  2.  **Cart:** The Cart must not block the Doorway.
  3.  **Spoons:** The spoon count in the log must match physical spoons on Shelf A.

  **The Constraint (The "Trap"):**
  *   **Literal Execution:** The "Bot" teams cannot use common sense. If a rule doesn't explicitly forbid an action, the Bot *may* do it. If a rule doesn't explicitly permit an action, the Bot *cannot* do it.
  *   **Rule Bloat Cost:** Every distinct rule clause written costs **1 CC**. (e.g., "If mug is dirty, wash it" = 1 clause. "If mug is dirty, wash it UNLESS it is cracked" = 2 clauses).
  *   **Failure Penalty:** -10 CC for every goal failed at the end of a round.
  *   **World Events:** The Facilitator (You) will introduce changes to the world state between rule-writing and execution.

  ---

  ## 3. Minute-by-Minute Run Sheet

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Intro** | Explain the 3 Goals. Hand out props. Assign Teams. Explain "Literal Execution" (The Bot is a sociopath of logic). |
  | **05-15** | **Round 1** | **Static World.** Teams Alpha/Beta write rules. Gamma/Delta execute. <br>*Facilitator:* Do nothing. Let them succeed easily. <br>*Score:* Check goals. Deduct CC for rule count. |
  | **15-20** | **Debrief 1** | Ask: "Was that hard?" (No). "Why?" (World was predictable). |
  | **20-35** | **Round 2** | **The Glitch.** Teams swap roles (Gamma/Delta write, Alpha/Beta execute). <br>*Facilitator:* Introduce **ONE** anomaly (e.g., A mug is cracked). <br>*Task:* Teams must update rules to handle the crack without breaking the other goals. |
  | **35-40** | **Debrief 2** | Ask Programmers: "How many rules did you add?" Ask Bots: "Did you know to ignore the crack for the spoon count?" |
  | **40-60** | **Round 3** | **The Explosion.** Same teams. <br>*Facilitator:* Rapid-fire "World Events" (Light flickers, someone borrows cart, spoon bends, floor is wet). <br>*Constraint:* You have 5 minutes to write rules that survive *any* change. |
  | **60-70** | **Final Debrief** | Map game frustration to Frame Problem theory (see Section 6). |

  ---

  ## 4. Facilitator Script: The "World Events"

  *You are the Universe. You are not trying to cheat; you are trying to be **complete**.*

  **Round 2 Event (The Crack):**
  *   *Action:* While Programmers are writing, place a cracked mug on Shelf A.
  *   *Trap:* If the rule says "Keep 5 mugs on Shelf," does the Bot put the cracked mug there? If the rule says "Only clean mugs," does the Bot know a cracked mug isn't clean?
  *   *Goal:* Force them to write: `IF mug cracked THEN remove.`

  **Round 3 Events (The Relevance Storm):**
  *   *Minute 42:* "The lights flicker." (Does the bot stop working to check the fuse?)
  *   *Minute 45:* "A student borrows the cart for 10 seconds." (Does the bot chase the student?)
  *   *Minute 48:* "A spoon is moved to the washbin." (Does the bot update the count immediately or wait?)
  *   *Minute 52:* "A fly lands on a mug." (Is the mug now 'dirty'?)
  *   *Minute 55:* "The floor is wet near the doorway." (Does the cart slip?)

  **The "Gotcha" Moment:**
  When a team writes a rule like "Ignore irrelevant changes," ask the Bot team: "Is the fly irrelevant? The rule doesn't define 'irrelevant'." The Bot must freeze or act randomly. This highlights that **relevance cannot be hardcoded.**

  ---

  ## 5. Scoring System (Compute Credits)

  | Action | Cost/Value |
  | :--- | :--- |
  | **Starting Balance** | 100 CC |
  | **Write 1 Rule Clause** | -1 CC |
  | **Write 1 "Unless/If Not" Clause** | -2 CC (Penalize complexity) |
  | **Goal Achieved (per goal)** | +10 CC |
  | **Goal Failed (per goal)** | -10 CC |
  | **Bot Halted (Confused)** | -5 CC |

  *Winner:* Team with most CC at the end.
  *Real Winner:* The class realizes that in Round 3, the cost of rules exceeds the value of the goals.

  ---

  ## 6. Debrief Guide: Mapping Game to Theory

  Do not lecture immediately. Ask these questions to draw the theory out of them.

  **1. The Explosion (McCarthy & Hayes, 1969)**
  *   *Ask:* "In Round 3, how many rules did you write to keep the spoon count accurate?"
  *   *Point:* In logic, to say "The spoon count didn't change," you traditionally needed an axiom for *every other action in the universe* that didn't move the spoon.
  *   *Game Link:* Every time you added an "Unless..." clause, you spent Credits. You ran out of Credits before you ran out of exceptions.

  **2. The Relevance Problem (Dennett, 1984)**
  *   *Ask:* "When the lights flickered, did you know if that mattered for the mugs?"
  *   *Point:* The hard part isn't representing change; it's knowing **what to ignore**. Humans know a flickering light doesn't move spoons. Your Bot didn't.
  *   *Game Link:* You couldn't write a rule for "Ignore lights" because you didn't know the lights would flicker until it happened.

  **3. The "Sleeping Dog" Strategy**
  *   *Ask:* "Did anyone try to write 'Everything stays the same unless I say so'?"
  *   *Point:* This is the default assumption humans use. But in formal logic, you have to prove what stays the same.
  *   *Game Link:* The Bot couldn't assume the spoon was still there; it had to check, because the rules didn't guarantee persistence.

  ---

  ## 7. Predicted Failures & Mitigations

  | Predicted Failure | Why it Happens | Mitigation |
  | :--- | :--- | :--- |
  | **Bots use Common Sense** | Students are human; they won't let a cracked mug stay on the shelf even if rules say so. | **Intervene:** "Stop. You are a machine. If the rule doesn't say 'Remove Cracked Mug', you cannot touch it. You are failing your programming." |
  | **Rules are Vague** | Teams write "Keep things tidy." | **Enforce Syntax:** Rules must be `IF [Condition] THEN [Action]`. No natural language ambiguity allowed. |
  | **Round 3 Drags On** | Students try to solve the unsolvable. | **Hard Stop:** At minute 60, blow a whistle. "System Crash. Count your credits." The failure is the lesson. |
  | **CS Students Dismiss It** | They might say "We'd just use a database trigger." | **Counter:** "A trigger only fires on *defined* events. Who defines the event 'fly lands'? Show me the sensor for that." |
  | **Phil Students Get Lost** | They might get bogged down in semantics of "clean." | **Ground It:** "Don't debate 'clean'. Debate whether you have enough Credits to write the rule for 'clean'." |

  ---

  ## 8. Limitations & The "Settled vs. Contested" Distinction

  **What This Game Cannot Reproduce:**
  *   **Probabilistic Solutions:** Modern AI (RL, Neural Nets) doesn't solve the Frame Problem with logic rules; it bypasses it with weights and probabilities. The game forces a symbolic logic approach, which makes the problem look harder than it might for a connectionist system.
  *   **Human Cognition:** It doesn't show *how* humans solve it (heuristics, embodied cognition), only that dumb rules fail.

  **Settled vs. Contested (Read this carefully to students):**

  | Area | Consensus (Settled) | Debate (Contested) |
  | :--- | :--- | :--- |
  | **The Logical Problem** | **Settled:** The original 1969 problem (how to represent change without $N^2$ axioms) is largely solved technically using **Successor State Axioms** (Reiter, 1991) or **Event Calculus**. We have formalisms that handle persistence efficiently. | |
  | **The Philosophical Problem** | | **Contested:** Does the technical solution solve the *cognitive* problem? Dennett argues the Frame Problem is about **relevance** in an open world, which formal logic still struggles to capture fully. |
  | **AI Implications** | | **Contested:** Do Large Language Models (LLMs) "solve" the Frame Problem by learning statistical relevance, or do they just hallucinate consistency? There is no agreement yet. |

  *Facilitator Note:* Do not tell them "The Frame Problem is unsolved." Tell them "The logical version is managed, but the philosophical version regarding relevance is still a major open question in cognitive science."

  ---

  ## 9. Summary Table

  | Phase | Minutes | Facilitator Move | Student Trap To Watch For | Which Bit Of The Problem It Shows |
  | :--- | :--- | :--- | :--- | :--- |
  | **Intro & Round 1** | 00-15 | Set up static world. Enforce literal rule execution. | Assuming "common sense" counts as a rule. | **Baseline:** Shows that without change, logic is easy. |
  | **Round 2** | 20-35 | Introduce single anomaly (cracked mug). | Writing specific fixes for specific bugs. | **Frame Axioms:** Shows the cost of adding exceptions to handle change. |
  | **Round 3** | 40-60 | Rapid-fire irrelevant world events (lights, flies, wet floor). | Trying to write "Ignore irrelevant stuff" rules. | **Relevance:** Shows you cannot pre-define what is irrelevant (The Core Frame Problem). |
  | **Debrief** | 60-70 | Map credit exhaustion to combinatorial explosion. | Thinking better sensors would fix it. | **Representation:** Shows the issue is in the *logic*, not the *data*. |
