  2.  **Deconstruct the Frame Problem:**
      *   *What is it?* Originally (McCarthy & Hayes, 1969), it's about how to represent change in logic without explicitly stating everything that *doesn't* change.
      *   *Philosophical expansion (Dennett, etc.):* It's about relevance. How does an agent know which facts matter to its goals when the world changes?
      *   *The Trap:* Trying to solve it by adding more axioms (frame axioms) leads to combinatorial explosion.
      *   *The Workshop Goal:* Simulate the combinatorial explosion of rules vs. the infinite unpredictability of context.

  3.  **Refine the Game Mechanics (The "Kiosk Bot" Simulation):**
      *   *Setup:* The user's idea is good but needs tightening to fit 70 mins.
      *   *Teams:* 22 students. Let's make 4 teams of 5, plus 2 observers/facilitator assistants (or just 4 teams of 5-6). Let's go with 4 Teams (A, B, C, D) of 5-6 students.
