      *   *Points:* Keep it simple. Points for Task Completion minus Penalties for Rule Bloat or World State Errors.

      *   *Refining the "Frame" Experience:*
          *   Round 1: Static world. Easy.
          *   Round 2: One unexpected change (e.g., a mug breaks). Teams try to write a rule for "broken mugs."
          *   Round 3: Rapid fire changes. Teams try to write "Unless..." clauses. They will run out of time/paper. This is the *feeling* of the frame problem.

      *   *Addressing the "Settled vs. Contested" Constraint:*
          *   *Settled:* The original logical formulation (McCarthy/Hayes) is about representational efficiency of change. The "combinatorial explosion" of frame axioms is the classic symptom.
          *   *Contested:* Whether this is *just* a technical logic problem (solved by non-monotonic logic, situation calculus, etc.) or a deep philosophical problem about cognition and relevance (Dennett's view). Also, whether connectionism/LLMs actually "solve" it or just bypass it. I need to be careful not to say "The Frame Problem is unsolved" as a blanket fact, but rather "The philosophical implications are debated."

      *   *Predicted Failures:*
          *   Students using common sense while executing (cheating the "literal" constraint).
          *   Rules being too vague ("Keep it tidy").
          *   Running out of time for debrief.
          *   Students thinking the solution is "better sensors" rather than "representation."

      *   *Game Limitations:*
          *   The game simulates the *logical* frame problem (explicit rules). It doesn't simulate how humans *actually* solve it (heuristics, neural nets). It makes it look harder than it might be for biological brains.

  5.  **Developing the Content (Section by Section):**

      *   *Title:* "The Kiosk Catastrophe."
