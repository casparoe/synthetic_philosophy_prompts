  Without a sovereign signing any **treaty**,
  It promised light through spread of **literacy**,
  But left the thinking to the wooden **press**.

  The type was set upon the printing **press**,
  But required a hand to feed the **engine**,
  The numbers grew apart from **literacy**,
  A splitting core unrelated to **fission**,
  No diplomats convened to write a **treaty**,
  They changed the work inside the textile **mill**.

  The water wheel turned slower than the **mill**,
  Ink ran wide across the wooden **press**,
  Kings looked for something like a **treaty**,
  To bind the noise of this new printing **engine**,
  It made no bombs, it knew no **fission**,
  It took a century to build the **literacy**.

  The readers came before the **literacy**,
  The shadow fell across the empty **mill**,
  A single spark could start the **fission**,
  No need to run the papers through the **press**,
  A secret built inside a hidden **engine**,
  The only value lay in signing **treaty**.

  We broke the pact, we tore the old **treaty**,
  And taught the machine a kind of **literacy**,
  It drives itself, a self-contained **engine**,
  It walks away from both the farm and **mill**,
  It prints the news without a human **press**,
  But this arrival looks nothing like **fission**.

  Inside this room the **mill** remains, the **press**,
  The **engine** runs beyond our **literacy**,
  A silent **fission** when the tool signs **treaty**.
