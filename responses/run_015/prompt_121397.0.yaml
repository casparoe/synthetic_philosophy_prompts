  # Q&A Prep Sheet: Threshold Contractualism

  **Context:** Seminar defense. Audience is mixed (Scanlonians, Political, EA/Rationalist).
  **Goal:** Keep replies under 2 minutes. Be honest about weaknesses.

  ### 1. The "Aggregation Smuggle" Objection
  **Who:** The Scanlon Purist (Senior Faculty)
  **The Question:** "Look, Scanlon is explicit that you can't aggregate small complaints to override a large one. You're talking about a 'systemic justification gap,' but isn't this just aggregation by another name? If no single act crosses the threshold of harm, on what grounds can an individual reasonably reject a principle permitting it? You seem to be smuggling utilitarianism in through the back door of 'systemic effects.'"

  **Your Reply:**
  "It's not aggregation of *harm*, it's aggregation of *authority*. In standard contractualism, I ask: 'Can this person reject this principle based on the harm they suffer?' In threshold contractualism, the question is: 'Can this person reject a principle that allows everyone to act this way, given the system it creates?'
  The key distinction is that I'm not summing utilities. I'm saying the *principle itself* becomes rejectable when it fails to regulate a cooperative scheme that everyone relies on. If I emit carbon, I'm not just causing tiny harm; I'm violating the terms of a scheme where others are restraining themselves. The rejection isn't based on the sum of harms, but on the unfairness of the principle allowing free-riding on a necessary cooperative practice. It preserves the individualist constraint while acknowledging that some principles are only valid if they are universally sustainable."

  **Honest Note/Soft Spot:**
  You're walking a tightrope here. If "systemic effects" matter for rejectability, it's hard to explain why *other* aggregated harms don't count. Be prepared to admit that your view diverges from Scanlon on the "Numbers Problem" (e.g., saving one vs. saving many). You might have to concede that threshold contractualism *does* allow some aggregation, just structurally constrained.

  ### 2. The "Institutional Escape Hatch" Objection
  **Who:** The Political Philosopher
  **The Question:** "You're applying this to climate and factory farming, but these are paradigmatic collective action problems solvable only by regulation. By framing this as an individual moral obligation, aren't you letting institutions off the hook? If the harm is systemic, shouldn't the obligation be political, not contractual between individuals?"

  **Your Reply:**
  "I agree that individual action isn't a substitute for justice, but it's not irrelevant either. Contractualism is about what we owe *each other*, not just what the state owes us. Even in the absence of regulation, I'm still participating in a practice that harms you.
  Think of it this way: If we're both in a lifeboat with a leak, and we agree to bail water, I can't stop bailing just because we haven't elected a captain yet. The obligation stems from the interdependence, not the legislation. Threshold contractualism captures the duty to maintain the cooperative scheme even when the formal institutions fail. It's not about replacing politics; it's about moral conduct *within* a broken political context."

  **Honest Note/Soft Spot:**
  This is strong, but be careful not to sound like you're advocating for "voluntarism" over policy. If they push hard, concede that individual obligations are *secondary* to institutional duties but still *binding*. Don't claim individual action solves the problem; claim it prevents moral complicity.

  ### 3. The "Expected Utility" Trap
  **Who:** The Rationalist/EA Grad Student
  **The Question:** "Let's talk numbers. In the voting case, my causal impact is effectively zero. In the climate case, my individual carbon footprint is also negligible regarding the actual outcome. If your view obligates me to stop eating factory-farmed meat because of the collective pattern, why doesn't it obligate me to vote? If you say voting is different, isn't that ad hoc? Show me the structural difference that isn't just intuition."

  **Your Reply:**
  "The difference isn't the probability of impact; it's the nature of the participation. Voting is a discrete, threshold-based event: either you are pivotal or you aren't. Meat buying and carbon emitting are continuous contributions to a demand curve.
  But more importantly, contractualism isn't about expected utility. It's about justifiability. Can I justify to you that I'm willing to benefit from a system of animal suffering while claiming I'm powerless to stop it? That justification fails. With voting, the principle 'I don't have to vote if my vote won't change the outcome' might actually be *acceptable* in a large electorate, because the duty is to the system, not the specific outcome. The climate case is different because the harm is happening *now* through the aggregate, not potentially in the future based on a threshold. I'm contributing to ongoing harm, not waiting for a pivotal moment."

  **Honest Note/Soft Spot:**
  This is the weakest link. EA folks will hammer the "continuous contribution" point—they'll say demand curves are probabilistic too. You might need to concede that the voting analogy is a stress test that *limits* your theory. If they push, admit that threshold contractualism might require voting *if* voting is part of the cooperative scheme necessary for justice, but the causal link in climate is more direct regarding harm production. Don't get bogged down in the math; keep it on justification.

  ### 4. The "Rule-Utilitarian Collapse" (The Prayer Question)
  **Who:** The Sharp Meta-Ethicist (Anyone)
  **The Question:** "Here's the worry: You say an act is wrong if it falls under a principle that creates a systemic justification gap when universalized. That sounds exactly like Rule-Utilitarianism. If the rule 'everyone can emit carbon' leads to bad outcomes, you reject it. If the rule 'everyone maximizes utility' leads to bad outcomes, you reject it. What actual work is 'contractualism' doing here? Are you just a rule-utilitarian who likes Scanlon's vocabulary?"

  **Your Reply:**
  "That's the strongest challenge, and here's the distinction: Rule-Utilitarianism asks, 'Which rule maximizes the good?' Threshold Contractualism asks, 'Which rule can no one reasonably reject?'
  The extensional overlap might be high, but the *grounding* is different. In my framework, I don't reject the carbon principle because the outcome is suboptimal; I reject it because it imposes an unfair burden on those suffering the climate effects without their consent. It's about reciprocity and justification, not maximization.
  For example, a rule-utilitarian might sacrifice a minority if the total utility gains are high enough. My view blocks that, because the minority can reasonably reject the principle allowing their sacrifice, regardless of the systemic benefit. The 'threshold' isn't about utility maximization; it's about the point where a principle ceases to be justifiable to those burdened by it."

  **Honest Note/Soft Spot:**
  Be prepared to concede that in *large-scale coordination problems* (like climate), the views converge significantly. You might not be able to show a practical difference in the climate case specifically. Your fallback is the "hard cases" where utilitarianism demands sacrifice of the few. If they press, admit: "In collective action problems, we look very similar. The divergence shows up in rights violations and distributional justice." Don't fight the convergence hard; fight the *reason* for the convergence.

  ### General Delivery Tips
  *   **Don't over-claim:** You're proposing a hybrid, not a unified field theory. It's okay to say "This framework is designed specifically for collective harm cases, not necessarily all moral contexts."
  *   **Watch the "Threshold":** If they ask where the threshold is exactly, don't give a number. Say it's a function of "reasonable rejectability based on systemic reliance," not a fixed metric.
  *   **Stay Calm on Voting:** If they corner you on voting, it's better to say "Voting might be a special case of political obligation distinct from harm-based contractualism" than to twist your theory into knots to make it fit.
