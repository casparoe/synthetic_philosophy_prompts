answer: |-
  It is rare to encounter a debate where the interlocutor shifts analogical frameworks mid-stream with such sophistication, and I commend you for pressing the issue rather than settling for the initial intuition. Your friend's movement from a proprietary model to a biological functionalist model reveals a deep awareness that the standard libertarian defense of borders often stumbles over the non-voluntary nature of citizenship, but I suspect both analogies fail to carry the normative weight he wants them to bear. To audit this properly, we need to look past the surface imagery and examine the structural mapping of moral agency, membership, and authority in each case, because the validity of an analogy in political philosophy depends entirely on whether the normative features of the source domain legitimately transfer to the target domain.

  Let us begin with the first analogy, the private club or homeowner's association, which is the standard default in liberal nationalist arguments. In this mapping, the sovereign state corresponds to the private club or the home, the citizenry corresponds to the members or homeowners, the immigrant corresponds to the prospective applicant or guest, and the border corresponds to the door or gate. The normative conclusion your friend draws is that just as a homeowner has a property right to exclude others from their living space, or a club has a freedom of association right to reject members, the state possesses a moral right to exclude foreigners based on collective self-determination. The hidden premise doing the heavy lifting here is that the state is essentially a voluntary association of individuals who hold collective ownership over the territory. This is where the argument collapses, and the failure is not merely decorative but structural. The disanalogy lies in the condition of voluntariness and the nature of the property right. Membership in a club is consensual; members can exit, and applicants are free to join other clubs. Citizenship, however, is largely ascriptive, determined by birthright rather than consent, and exit is often costly or legally constrained. Furthermore, a home is private property, whereas state territory is public jurisdiction. By smuggling the concept of private property rights into the public sphere, your friend illegitimately converts a question of political justice into a question of property ownership. If the state is not a voluntary association, the freedom of association defense fails, and if the territory is not privately owned by the current citizens, the property rights defense fails. This undermines the conclusion because it grants current residents a veto power over the rights of outsiders that they do not possess in the source domain of moral equality.

  Your friend's pivot to the cell membrane analogy is an attempt to salvage the right to exclude without relying on the contested notion of voluntary association or private property. Here, the mapping shifts significantly: the state corresponds to a biological cell, the citizenry corresponds to the internal organelles or cytoplasm, the immigrant corresponds to external molecules or nutrients, and the border corresponds to the semi-permeable membrane. The normative conclusion is that restrictions on movement are justified by the functional need for internal homeostasis rather than by ownership rights. This avoids the voluntariness problem because a cell does not choose its components voluntarily; it simply maintains them. However, this analogy introduces a different set of fatal disanalogies that collapse the argument from the side of moral agency. The primary failure is a category error between biological necessity and moral justification. A cell membrane filters molecules based on chemical compatibility and survival needs, not moral rights or duties. Humans, unlike molecules, are moral agents with claims to justice, freedom, and dignity. By mapping immigrants onto nutrients or waste, the analogy inadvertently dehumanizes them, treating them as means to the state's ends rather than ends in themselves. Furthermore, biological systems operate under deterministic laws, whereas states operate under normative laws. A cell cannot be unjust in its exclusion; it simply functions. A state, however, can be unjust. If we accept this analogy, we lose the ability to critique border policies morally because we reduce them to functional necessities. This is not a decorative failure but a collapse of the ethical framework itself, as it removes the possibility of moral reasoning from the justification of exclusion.

  When we strip away the imagery, both analogies rely on a hidden premise that the state is a unitary moral person with interests distinct from and superior to the individuals affected by its borders. The club analogy treats this person as an owner, and the cell analogy treats it as an organism, but both obscure the reality that the state is a legal institution comprised of individuals who owe duties to other individuals regardless of jurisdiction. The club analogy fails because it assumes a right of ownership that citizens do not possess over the earth or the jurisdiction, and the cell analogy fails because it assumes a right of survival that trumps the moral claims of outsiders without justification. Neither analogy survives as a genuine support for an absolute or strong right to exclude because both bypass the fundamental question of global distributive justice and the arbitrary nature of birthright privilege. The club analogy ignores that the "club" controls the very ground on which the excluded stand, and the cell analogy ignores that the "membrane" is a political construct enforced by violence, not a natural barrier.

  If we are to find an analogy that does the work more honestly, we should look toward conventions that are structured yet porous, such as a linguistic community or a system of legal jurisdiction. Consider a linguistic community: it has boundaries defined by shared rules and conventions, and it requires some level of exclusion to maintain coherence, yet it is not owned by its speakers, nor is it biologically determined. One cannot be forced to speak a language, but institutions operate within it, and entry requires acquisition of the convention. This maps onto the state as a jurisdictional authority rather than a property owner or organism. In this view, the state has a right to regulate entry to maintain the functionality of its legal and social institutions, but this right is conditional on the justice of the institutions themselves and the global context of need. Alternatively, a trusteeship model might work, where the state acts as a manager of public goods for both current and future residents, including potential immigrants, rather than an owner. This avoids the private-property trap by acknowledging the public nature of territory and avoids biological functionalism by retaining moral agency. Ultimately, your friend's analogies fail because they seek to ground the right to exclude in something pre-political, either property or biology, when the right is inherently political and contingent. The border is not a door to a home or a membrane of a cell, but a line of legal authority that must be justified to those it keeps out as much as to those it keeps in.
