prompt: |-
  I'm preparing a ninety-minute seminar for philosophy undergraduates who have encountered Hume's problem of induction but have no training in medieval Islamic thought. The goal is for them to understand Al-Ghazālī's occasionalism as a metaphysical thesis about the relationship between apparent secondary causes and divine agency, not as a primitive rejection of natural science. Please plan the teaching sequence: first, the conceptual dependencies—what idea must be securely in place before occasionalism can be presented without being mistaken for mere scepticism or mysticism; second, the single carrying example that should structure the session (it should not be the familiar fire-and-cotton case, but rather a modern, repeatable phenomenon that makes the same metaphysical point more clearly), together with what that example must include and what it must lack; third, the misconceptions the students will predictably form—particularly those carried over from their Humean background, such as conflating occasionalism with empirical scepticism about necessary connection or with a form of determinism—and the precise point in the sequence where each should be pre-empted; fourth, a check-for-understanding question that distinguishes having grasped the metaphysical claim from having merely adopted the theological conclusion; and fifth, what elements of Al-Ghazālī's broader theological framework, or of later occasionalist traditions (for instance, Malebranche's version), should be explicitly named and set aside at this level. Write the response in British English, and do not include bibliographies, reading lists, or citations.
