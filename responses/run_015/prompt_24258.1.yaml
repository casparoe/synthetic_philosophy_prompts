  and force dictates their **speed**.

  No object exceeds this **speed**,
  though constant remains **light**.
  It curves the empty **space**,
  dragging the solar **orbit**.
  Clocks stutter in **time**,
  where gravity is **fall**.

  The electron must **fall**
  without a fixed **speed**.
  Intervals of **time**
  dissolve into pure **light**.
  There is no defined **orbit**,
  only a waveform in **space**.

  We map the void of **space**
  to predict where stones **fall**.
  A model for the **orbit**,
  an equation for **speed**.
  We catch the arriving **light**,
  to save our wasted **time**.

  The system renders **time**,
  grid-like, pixelated **space**.
  Pixels compose the **light**,
  while objects **fall** on cue.
  Capped at maximum **speed**,
  locked in a digital **orbit**.

  Pick any preferred **orbit**,
  spend less philosophical **time**,
  adjust the local **speed**,
  stretch the flexible **space**.
  Watch the apples **fall**,
  shine the same **light**.

  We map the same **space** onto every **orbit**,
  Evidence runs out of **time** before the **fall**,
  No measure of **speed** decides the **light**.
