      *   **Conflict:** Commitment (3) demands a unified principle for private and institutional cases, yet (1) forbids a requirement to save the greater number in private rescue, while (4) asserts it is "correct to prioritize" saving more lives in institutions. This creates contradictory normative outputs (permissibility vs. obligation) for identical claims under different contexts, violating the unity constraint unless the derivation is robust.
      *   **Cheapest Revision:** Abandon or weaken (3) to allow for a dualistic theory where private agents and institutions operate under distinct moral logics.
      *   **Cost:** You lose theoretical elegance and the explanatory power of a unified moral framework, making the distinction between private and institutional appear ad hoc.
      *   **Alternative Revision:** Modify (4) to claim saving the greater number is merely *permissible* rather than *correct/prioritized* in institutions.
      *   **Cost:** This undermines the practical guidance of institutional policy, potentially permitting lotteries for vaccines which contradicts standard public health ethics.

  *   **Severity 2: The Debunking vs. Justification Problem (Commitments 2 & 4)**
      *   **Conflict:** Commitment (2) dismisses the intuition to save the greater number as a non-moral evolutionary heuristic, yet (4) adopts the outcome of that intuition (saving more lives) as morally correct in institutions. If the intuition is debunked, the burden of proof for (4) increases significantly; relying on "procedural fairness" risks appearing as a rationalization for the debunked heuristic.
      *   **Cheapest Revision:** Clarify in (4) that the justification relies entirely on independent contractualist grounds (e.g., ex ante Pareto efficiency) that do not appeal to the intuition debunked in (2).
      *   **Cost:** Increases argumentative burden; you must prove the procedural justification is not itself covertly dependent on the intuitive pull of aggregation.

  **2. Apparent Tensions**

  *   **Individualism vs. Lottery Structure (Commitments 1, 5, & 6)**
      *   **Analysis:** You suspected tension here, but these commitments are consistent. Commitment (6) fixes claim strength internally to the individual, which directly entails (5)'s requirement for equal *per-capita* chances rather than group-based claims. Commitment (1) follows naturally: if claims are individual and non-additive, a coin flip between groups gives each individual an equal chance, satisfying fairness without aggregation.
      *   **Resolution:** No revision needed; your suspicion dissolves upon recognizing that (6) dictates the structure of (5).

  **Reasoning**

  The core fracture lies in your attempt to satisfy the unity constraint (3) while holding contradictory obligations in (1) and (4). In private rescue (1), you argue that five claims do not outweigh one, implying no duty to save the five. In institutional allocation (4), you argue that saving more is correct, implying a duty to save the five. While you attempt to bridge this with "ex ante procedural fairness," this move often smuggles aggregation back in: maximizing expected survivors across a population effectively treats lives as fungible units of value, which violates the spirit of (1) and (6). If the underlying principle is truly unified, it should not yield "no duty" in one context and "duty" in another without a morally significant difference in the claims themselves—which (6) explicitly denies. Consequently, your position is unstable because the procedural justification in (4) functions as aggregation in practice, contradicting the anti-aggregationist core of (1) and (2).
