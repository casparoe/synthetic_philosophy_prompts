      *   *Question (i) - Condition vs. Content:* The crisis line referral suggests the request is treated as symptomatic of impaired agency (temporary insanity/distress) rather than a valid exercise of autonomy. If it were about content, risky financial moves would also be blocked. So, yes, it presumes impaired will.
