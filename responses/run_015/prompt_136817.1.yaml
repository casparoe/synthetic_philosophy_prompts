      *   (i) Suicide refusal vs. risky life choices (resignation, winter crossing, breakup). Suggests protection of life specifically, not general well-being or autonomy.
      *   (ii) Violence in fiction allowed vs. consensual erotica refused. Suggests constraints based on provider liability/brand safety or specific moral taboos (sexual vs. violent), not harm prevention (since fiction violence causes no direct harm).
      *   (iii) Charitable redescription. Refusal + pivot to "safe" version. Suggests a duty to be helpful but constrained by rules; treats user intent as malleable.
