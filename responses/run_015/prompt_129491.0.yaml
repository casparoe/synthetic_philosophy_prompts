          *   Distinguish Safety vs. Deception: Intent and Auditability.
      *   **Conditions for Approval:** Specific, actionable constraints (Audit logs, Sunset clause, Independent oversight).
      *   **Implementation Timeline:** Concrete steps.
      *   **Sign-off.**

  5.  **Drafting - Key Arguments to Refine:**
      *   *Justifying Non-Transparency:* It is justified *only* when revealing the safety mechanism would allow the misaligned system to circumvent it (adaptive evasion) OR when real-time disclosure compromises clinical workflow to the point of patient harm (alert fatigue). However, *post-hoc* transparency (auditing) is non-negotiable.
      *   *Deception vs. Safety:* Deception implies intent to mislead stakeholders for convenience. Safety control implies intent to protect stakeholders from unknown risks, with accountability retained at the governance level. The line is drawn at *auditability*. If the Board cannot see the interventions, it's deception. If the Board can see them, it's safety control.
      *   *Trust:* Trust is maintained not by showing every gear turning, but by guaranteeing that someone is watching the gears.

  6.  **Refining the "No Logging" Constraint:**
