answer: |-
  This is an excellent set of questions. Your unease is well-founded: the trade book summary you have reconstructed commits several category errors that conflate Dennett's specific conceptual critique with blunt verificationism and behaviorism. As a PhD student working on memory, you are uniquely positioned to spot the friction points, particularly regarding the status of "seemings" and internal records.

  Here is a claim-by-claim audit of the passage, followed by an analysis of your dilemma and your memory-based counterexample.

  ### 1. Audit of the Passage

  **Claim 1:** *"Almost everyone... has accepted that experiences have qualia: properties that are ineffable, intrinsic, private, and directly present..."*
  *   **Verdict:** **Accurate.**
  *   **Comment:** Dennett explicitly defines "qualia" as a technical term bundling these four properties (IIPD). He is not attacking the existence of consciousness or experience, but this specific philosophical characterization of it. If a philosopher denies one of these four (e.g., that they are ineffable), Dennett would say they are not defending qualia in his sense.

  **Claim 2:** *"Dennett's target is this package... to 'quine' it... deny a place in one's ontology..."*
  *   **Verdict:** **Accurate.**
  *   **Comment:** The reference to Quine is about ontological commitment ("to be is to be the value of a bound variable"), not verificationism. Dennett argues that the *concept* is incoherent, so committing to it is a mistake, similar to committing to "phlogiston" or "the luminiferous aether."

  **Claim 3:** *"Chase and Sanborn... gustatory wiring is surgically exchanged... leaves every capacity to taste, discriminate, rank, and describe coffee exactly as it was, and leaves both men's preferences and verdicts quite unchanged..."*
  *   **Verdict:** **Misleading Simplification.**
  *   **Comment:** This is the source of your second unease. In "Quining Qualia," Dennett does not rest the argument on a single scenario where *nothing* changes. He constructs a matrix of possibilities involving **Inversion of Qualia** vs. **Inversion of Judgment**.
      *   *Scenario A:* Qualia invert, behavior stays same.
      *   *Scenario B:* Qualia stay same, behavior inverts.
      *   Dennett's point is that the subjects cannot distinguish Scenario A from "No Change," nor Scenario B from "No Change," without begging the question. The trade book collapses this into a single "Invisible Swap" scenario, which invites the verificationist objection you rightly identified. Dennett's argument is that *even if* we stipulate changes, the concept of qualia provides no framework for locating *what* changed.

  **Claim 4:** *"So there is no test, even in principle, that could reveal that anything had happened to them, and therefore no fact of the matter..."*
  *   **Verdict:** **Philosophically Blunt (Verificationist flavor).**
  *   **Comment:** A sympathetic reading of Dennett rejects the "therefore." Dennett is not arguing: *We can't detect it, so it isn't there.* He is arguing: *The definition of qualia (IIPD) entails that they drop out of the causal order. If they drop out of the causal order, they cannot ground facts about knowledge, report, or memory.* The "no fact of the matter" conclusion follows from the **incoherence of the definition**, not merely the **limit of evidence**. The summary makes it sound like an epistemic limit; Dennett intends it as an ontological dissolution.

  **Claim 5:** *"Since a genuine property must make some difference somewhere..."*
  *   **Verdict:** **Defensible Simplification.**
  *   **Comment:** This sounds like verificationism, but in Dennett's functionalist framework, it is a claim about causal efficacy. If a property makes no difference to the system's input-output relations (including internal processing), it is causally inert. If it is causally inert, it cannot be the object of the subject's own knowledge. Thus, the "directly present" clause of IIPD contradicts the "intrinsic/private" clause.

  **Claim 6:** *"What exists is the whole network of discriminations, preferences, and verbal dispositions; the conviction that behind all of it lies something inner and ineffable is simply a mistake."*
  *   **Verdict:** **Mostly Accurate, but risks Behaviorism.**
  *   **Comment:** Dennett is an **eliminativist about qualia**, but **not about consciousness**. He does not deny that coffee tastes like something. He denies that the "taste" is constituted by an ineffable, intrinsic atom. He replaces the "inner object" with a functional profile. The summary's phrasing ("network of dispositions") sounds like Rylean behaviorism. Dennett prefers "functionalism" or "interpretivism": the experience is real, but it is constituted by the complex functional role, not by a qualia-ghost behind it.

  ---

  ### 2. The Verificationism Charge

  Your inchoate sense is correct: if Dennett were arguing from "no test" to "no fact," he would be a verificationist. However, his argument is better reconstructed as a **dilemma regarding the coherence of the concept**.

  1.  **Horn 1:** If qualia have functional consequences (they affect judgments, memories, behaviors), they are not "intrinsic" or "private" in the sense required by the IIPD definition (because they are defined by their relations).
  2.  **Horn 2:** If qualia have *no* functional consequences (they are truly intrinsic/private), then they are epiphenomenal. If they are epiphenomenal, the subject cannot know them, report them, or remember them (since knowing/reporting/memory are causal processes).
  3.  **Conclusion:** Since the IIPD definition requires qualia to be both functionally isolated (intrinsic/private) *and* the object of direct knowledge (directly present), the concept is incoherent.

  The "no test" line in the summary is a shorthand for Horn 2: if it makes no functional difference, it cannot enter into the causal web required for there to be a "fact" accessible to anyone, including the subject.

  ---

  ### 3. Your Dilemma Reconstruction

  > *My best reconstruction... is a dilemma: either the supposed intrinsic property has some relational or dispositional consequence, in which case it is not the purely intrinsic property it was advertised as, or it has none, in which case there is nothing to the posit.*

  **Verdict:** **This is on the right lines.**
  This captures the "Master Argument" of *Quining Qualia*. You have correctly identified that Dennett is attacking the *coherence* of the definition, not just our access to the properties. The literature persists not because the argument is cheap, but because many philosophers (e.g., Chalmers, Block) reject the functionalist premise that *all* facts must be functional facts. They argue for "phenomenal concepts" that pick out properties non-functionally. Dennett's paper is the seminal attempt to show why that move fails.

  ---

  ### 4. The Memory Variant and Your Supervisor

  Your variant: *Chase is rewired. Rankings match notes. But he reports a mismatch: "The coffee now strikes me the way I remember bad coffee striking me."*
  Your Supervisor: *Memory traces are just more internal states which the operation could have swapped... a remembered way-things-seemed is no less of a posit than a present one.*

  **Analysis:**
  Your supervisor is channeling Dennett, but there is a nuance here crucial for your dissertation.

  **Why the Supervisor (and Dennett) is Right:**
  Dennett's view of memory is **reconstructive**, not archival. There is no "qualia tag" stored in the memory trace. When Chase says, "It strikes me the way bad coffee used to," he is making a *current judgment* based on current neural states.
  *   If the wiring swap altered the *comparison mechanism* (the process by which current input is compared to memory traces), then the report "it seems different" is simply a output of that new mechanism.
  *   For there to be a "fact of the matter" that Chase is *wrong* (or right) about the seeming, there would need to be an independent standard of "how it seemed then" vs. "how it seems now" that exists over and above the dispositions to judge. Dennett denies this standard exists.

  **Where Your Objection Bites (The Epistemology of Memory):**
  Your objection highlights the **phenomenology of temporal comparison**. Even if Dennett is right that qualia are incoherent, the *experience of seeming to remember a qualitative difference* is a datum that needs explaining.
  *   **Dennett's Explanation:** The "feeling of mismatch" is a current functional state. It is real *as a judgment*, but it does not track a change in intrinsic properties (because there are none). It tracks a change in the *relation* between current input and the reconstructive memory process.
  *   **The Counter-Counter:** If Chase insists, "I know the coffee tastes the same (judgment), but the *feeling* is different (phenomenology)," Dennett asks: What is the cash value of this distinction? If it doesn't affect future behavior, preferences, or further reports, it is a "spin" on the functional state. If it *does* affect those things, it is a functional difference, and thus not an "intrinsic qualia" difference.

  **Is it a Genuine Counterexample?**
  No, because it begs the question against Dennett. It assumes there is a "way things seem" that is distinct from the "disposition to judge/report how things seem." Dennett's entire project is to collapse that distinction (Heterophenomenology). To defeat Dennett, you must show why the "seeming" cannot be exhausted by the functional/dispositional profile, including the disposition to report on memory.

  **However,** for your dissertation, this is gold. You can argue that Dennett's account of memory *requires* that the "feeling of pastness" or "feeling of qualitative match" be treated as a current judgment. This raises the question of **error**: If memory is reconstructive, can we be wrong about how things seemed? Dennett says yes (we can misinterpret our own states). Traditional qualia theorists say no (incorrigibility). Your variant exposes this tension.

  ---

  ### 5. Correcting the Argument & The "Fact of the Matter"

  To state the argument without relying on the "silent swap" (which invites verificationism):

  1.  **Definition:** Qualia are defined as intrinsic, non-relational properties of experience.
  2.  **Premise:** For a property to be the object of knowledge, memory, or report, it must play a causal role in the generation of that knowledge/memory/report.
  3.  **Dilemma:**
      *   If Qualia play a causal role, they are defined by that role (relational), contradicting (1).
      *   If Qualia do not play a causal role, they cannot generate knowledge/memory/report, contradicting the claim that they are "directly present" to consciousness.
  4.  **Conclusion:** The concept of Qualia (as IIPD) is incoherent.

  **What would have to be the case for there to be a fact of the matter about inversion?**
  For Dennett, a fact of the matter exists only if there is a **functional difference** that can be interpreted.
  *   If Chase's wiring is swapped, and he now *prefers* the coffee he used to hate, there is a fact of the matter: his preference function changed.
  *   If Chase's wiring is swapped, and he *says* "this tastes different" but his preferences and discriminations remain identical, Dennett argues there is **no fact of the matter** about whether the *qualia* inverted. There is only a fact about his verbal disposition.
  *   To secure a fact of the matter about *qualia inversion* specifically, one would need to establish a framework where phenomenological facts are independent of functional facts. Dennett argues this is impossible because the only access we have to phenomenology *is* functional (reports, behaviors, neural correlates).

  ### Summary for Your Work

  1.  **The Book:** The trade book summary is unreliable. It turns a conceptual critique into an epistemic one.
  2.  **The Verificationism:** Dennett is not a verificationist; he is a functionalist who argues that "intrinsic private properties" are incompatible with the causal nature of knowledge.
  3.  **The Memory Case:** Your supervisor is correct on Dennettian grounds. The "feeling of mismatch" is a current state, not a comparison of two intrinsic atoms. However, this is a fertile ground for your dissertation: investigate the normative status of memory judgments in a reconstructive framework. If "seeming" is just "judging," how do we account for the *force* of the seeming that persists even when the judgment is retracted? (Dennett calls this "fame in the brain," but you might find tension there).
  4.  **Dennett's Stance:** He is an eliminativist about *Qualia*, not *Consciousness*. He denies the "inner theater," not the "show."

  Your dilemma reconstruction is robust. Stick with that, but refine the second horn: it's not just that "there is nothing to the posit," but that the posit becomes **causally excluded** from the very cognitive processes (memory, report) that are supposed to reveal it.
