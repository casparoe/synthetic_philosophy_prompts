              3.  Epistemic access (can an agent know she is rational?).
          *   Format: Each question must include a follow-up keyed to the *most likely answer*.

  2.  **Deconstruct the Philosophical Context (Parfit's Hitchhiker):**
      *   *The Case:* A hitchhiker is stranded in the desert. A driver offers a ride only if the hitchhiker will pay upon reaching town. The driver is a perfect mindreader (or very good at detecting lies). If the hitchhiker is rational (in the standard instrumental sense), once in town, they have no reason to pay (the ride is already received). The driver knows this, so won't pick up a rational hitchhiker. To get picked up, the hitchhiker must be irrational (committed to paying even when it's costly).
      *   *The Claim:* Rationality requires being irrational (having a disposition to pay) to achieve the rational goal (survival/getting a ride).
      *   *Key Debates:* Resolute Choice vs. Sophisticated Choice, Self-Binding, Transparency of Rationality, Normativity of Rationality.

  3.  **Drafting Questions (Iterative Process):**

      *   *Goal:* 8-10 questions total.
      *   *Requirement:* Specific topics need coverage (Instability, Visibility, Self-Knowledge).
      *   *Tone:* Intellectual but accessible (novelist audience), probing, not adversarial but challenging.

      *   *Question 1: Introduction/Setup (The "Hook")*
          *   Need to set the stage without just asking "What is the view?"
          *   Focus on the tension between the *definition* of rationality and the *outcome*.
          *   *Follow-up:* If she says it redefines rationality, ask about the cost of that redefinition.

      *   *Question 2: The Instability/Self-Defeat Objection (Required Topic)*
          *   Focus: Is it the *state* that's irrational, or the *requirement*?
          *   Standard objection: You can't stably believe you will pay if you know you won't when the time comes.
          *   *Follow-up:* If she argues for resolute choice, ask about the psychological mechanism.

      *   *Question 3: Visibility/Detectability (Required Topic)*
          *   Focus: The driver's epistemic access.
          *   What if the driver can't tell? Does the paradox vanish?
          *   *Follow-up:* If she says it vanishes, ask about the implication for rationality being relational vs. intrinsic.

      *   *Question 4: Self-Knowledge/Transparency (Required Topic)*
          *   Focus: Can I know I'm rational?
          *   If rationality requires irrationality, can I know I'm satisfying the requirement?
          *   *Follow-up:* If she says "No," ask about the guidance function of rationality.

      *   *Question 5: The Novelist Angle (Fiction/Narrative)*
          *   Connect to the user's profession. How does this affect character motivation?
          *   *Follow-up:* Ask about writing "rational" characters who must appear irrational.

      *   *Question 6: Time and Agency*
          *   Focus: Diachronic rationality. Is the "self" at the roadside the same as the "self" in town?
          *   *Follow-up:* Ask about personal identity implications.

      *   *Question 7: Normative Force*
          *   If rationality tells me to be irrational, which command wins?
          *   *Follow-up:* Ask about the hierarchy of norms.

      *   *Question 8: Alternative Solutions (Causal Decision Theory vs. Evidential)*
          *   Briefly touch on the technical underpinnings without getting bogged down.
          *   *Follow-up:* Ask if this applies outside decision theory.

      *   *Question 9: Real World Application*
          *   Is this just a desert thought experiment, or does it happen in relationships/politics?
          *   *Follow-up:* Ask for a concrete example.

      *   *Question 10: Closing/Big Picture*
          *   What does this say about human nature?
          *   *Follow-up:* A final thought for the readers.

      *Refining the Specific Required Questions:*
      *   *Instability:* Make sure the distinction between "irrational belief" and "rational requirement" is clear.
      *   *Visibility:* Ensure the distinction between *being* rational and *appearing* rational is highlighted.
      *   *Self-Knowledge:* Focus on the "knowability" of the property.

      *Refining Follow-ups:*
      *   Need to anticipate the "Standard Defense."
      *   *Instability:* She will likely argue for "Resolute Choice" or that the disposition is the unit of evaluation. Follow-up should press on *how* one maintains that disposition.
      *   *Visibility:* She will likely argue that rationality *must* be visible for the paradox to hold, or that it reveals rationality is social. Follow-up should press on the "private rationality" scenario.
      *   *Self-Knowledge:* She will likely argue that self-knowledge is limited or opaque. Follow-up should ask about the "guidance" role of rationality (if I can't know it, how do I follow it?).

  4.  **Final Review against Constraints:**
      *   8-10 questions? Yes (I'll aim for 10 to be safe).
      *   Beyond restating view? Yes, they probe implications and objections.
      *   Specific topics covered? Yes (Instability, Visibility, Self-Knowledge).
      *   Follow-ups included? Yes.
      *   Follow-ups keyed to likely answers? Yes.

  5.  **Polishing the Tone:**
