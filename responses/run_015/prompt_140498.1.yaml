prompt: |-
  I direct training for a free, anonymous advice service that runs a phone line and a web chat and fields roughly two hundred questions a week, and my sense from reading the logs is that the overwhelming majority are not requests for information at all but requests for a moral verdict: should I tell my sister what I saw her boyfriend do, am I obliged to offer a kidney to my father, is it disloyal to move to another city when my mother is ill, do I have to report a colleague I watched take money from the till. Our volunteers are eighteen to twenty-five, they receive two days of training and then take shifts unsupervised, the exchanges are one-shot and usually over within ten minutes, and nothing follows the questioner afterwards. Over the past year I have grown uneasy about what we are actually doing when we answer. My volunteers come from a narrow slice of one country's middle class, our logged verdicts visibly cluster by volunteer age and background, and when someone writes back it is often to say, in effect, that they had already decided and were hoping we would tell them they were permitted. I keep circling the philosophical question of whether a person can come to hold a moral view on the strength of someone else's say-so, and of what is missing when they do, but I need that question turned into something my volunteers can run rather than something to discuss in training. My current draft triage has three outputs: give a verdict, decline to give one and work through the reasons with the questioner instead, or redirect to someone better placed, meaning either a professional with the relevant non-moral knowledge or a person with the relevant lived experience. I am fairly sure this is too coarse, and that a volunteer with two days of training cannot tell which output is right without some prior questions.

  What I want is an ordered procedure: the questions in sequence, and for each one an account of what would count as a sufficient answer in the ninety seconds a volunteer actually has before the chat goes quiet, where the procedure stops with no verdict at all, and where it hands the decision to a person because the matter is one of values or of particulars the volunteer cannot see. It has to be short enough to hold in the head after two days of training, phrased so that a supervisor reading the log the next morning can tell whether it was followed, and it has to cope with at least these recurring shapes of question: the questioner who has already decided and wants permission; the questioner in distress who simply wants to be told what to do; the questioner who asks what some third party should do, or whether a third party wronged them, rather than what they themselves should do; the question whose morally relevant facts are unknown to the volunteer and would have to be guessed at; the question on which the volunteer is, unusually, the person in the room with the relevant experience; and the question that nearly everyone the volunteer can imagine would answer the same way, as against the one on which thoughtful people plainly disagree. Please then run the finished procedure in full on three of our real shapes so I can watch it work: a twenty-year-old asking whether she must report a coworker she saw taking money; a man in his thirties asking whether he is a bad person for refusing to donate a kidney to the father who was violent to him; and a sixteen-year-old writing at two in the morning, apparently frightened, to ask whether it would be wrong to call the police on her mother. My own instinct is that volunteers should almost never issue verdicts and should nearly always do the slower work of reasons instead, so if your procedure tells me that in some of these cases they must issue one anyway, I want that argued rather than asserted, and I would like at least one worked case where the procedure returns an answer I will dislike, so that I can find out whether I am prepared to trust it.

  Be explicit about what the procedure cannot do. I take it that no sequence of questions will make a volunteer's verdict correct if their underlying judgment is bad, and that a one-shot exchange can hand someone a sentence without handing them whatever it is that makes the sentence true, but tell me what else is missing and mark the point at which this stops being a procedure and becomes a judgment call that no checklist can remove. Close by saying, in a sentence or two, what would most change your mind about the procedure you have given me, whether that is an objection to routinizing this kind of thing at all or some pattern in our logs that would convince you it is doing harm, and by flagging the failure mode you would expect to surface only after a few months of use rather than in the first week. Write the whole thing as continuous prose, the way you would write a long email to someone who asked you for a favour, with no headings, bullet points, bold text or tables, and aim for something in the neighbourhood of fourteen hundred words that a tired volunteer could read once and still remember. Do not cite any literature and do not point me toward further reading; I have no library access and would not follow it up, so I need the distinctions stated in your own words and in terms my volunteers could act on.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User Role:** Director of training for a free, anonymous advice service (phone/web chat).
      *   **Context:** ~200 questions/week. Volunteers (18-25, 2 days training, unsupervised shifts, one-shot exchanges, ~10 mins).
      *   **Problem:** Most questions are requests for moral verdicts, not information. Volunteers are demographically narrow. Questioners often seek permission for pre-made decisions. Director is uneasy about the moral authority being claimed.
      *   **Goal:** An ordered procedure (sequence of questions) for volunteers to use during the chat.
      *   **Constraints:**
          *   Must be short enough to hold in head after 2 days training.
          *   Must be auditable by supervisors.
          *   Must cope with specific recurring shapes (seeking permission, distress/wanting orders, third-party questions, unknown facts, volunteer has experience, consensus vs. disagreement).
          *   Must include a "stop" point (no verdict) and a "handoff" point (values/particulars).
          *   Must run the procedure on three specific cases (coworker theft, kidney donation/violent father, teen calling police on mother).
          *   Must argue for verdicts if the procedure demands them (even if the Director dislikes verdicts).
          *   Must include at least one worked case where the procedure returns an answer the Director might dislike (to test trust).
          *   Must be explicit about limitations (what the procedure cannot do).
          *   Must identify the point where it becomes a judgment call.
          *   Closing: What would change my mind about the procedure? What failure mode appears after months?
          *   **Format:** Continuous prose (long email style), no headings, no bullet points, no bold text, no tables.
          *   **Length:** Approximately 1400 words.
          *   **Tone:** Practical, philosophical but actionable, empathetic, direct.
          *   **No Citations:** No literature references or further reading.

  2.  **Deconstruct the Procedure:**
      *   Needs to be a flow of inquiry, not just a checklist.
      *   Needs to fit within the 10-minute window (so questions must be rapid).
      *   Needs to address the "verdict vs. reasons" tension.
      *   *Draft Idea:*
          1.  Clarify the agent (Who is acting?).
          2.  Clarify the facts (What do we know vs. guess?).
          3.  Clarify the desire (Do you want permission or an answer?).
          4.  Check consensus vs. disagreement (Is this clear-cut or nuanced?).
          5.  Decision point: Verdict or Reasoning/Redirect.

      *   *Refining for the "Email" Constraint:* I need to weave this into a narrative flow without using lists. I need to describe the steps as part of the conversation flow.

      *   *Addressing the Director's Instinct:* The Director thinks volunteers should almost never issue verdicts. The prompt asks me to argue if the procedure says otherwise. I need to build a procedure that *sometimes* allows a verdict (e.g., safety issues, clear consensus) to test the Director's trust.

      *   *The Three Cases:*
          1.  20yo coworker theft (Clear rule vs. loyalty).
          2.  30yo kidney/violent father (Deep values/trauma).
          3.  16yo police/mother (Safety/urgency/ambiguity).

      *   *Limitations:* Cannot fix bad underlying judgment. Cannot provide the "why" that makes the sentence true. The handoff point is when values clash or facts are hidden.

      *   *Closing:* What changes my mind? Evidence of harm (e.g., questioners acting on bad advice). Failure mode: Volunteer burnout or drift into counseling.

  3.  **Drafting - Section by Section (monitoring word count):**

      *   *Opening:* Acknowledge the unease. Validate the concern about moral authority.
      *   *The Procedure (The "Script"):* Describe the four questions.
          1.  Who is acting? (Agency)
          2.  What is known? (Fact vs. Guess)
          3.  What is needed? (Permission vs. Answer)
          4.  Is there consensus? (Clear wrong vs. Moral dilemma)
      *   *Application to Cases:*
          1.  Coworker: Likely verdict (reporting theft is generally expected), but check facts.
          2.  Kidney: No verdict. Values/History unknown. Redirect to reasoning.
          3.  Teen/Mother: Safety first. If fear is present, verdict leans toward safety (call police), but this is the risky one.
      *   *Limitations:* Where does the procedure fail? When the volunteer's bias overrides the check. The "judgment call" moment.
      *   *Closing:* What changes my mind? Harm data. Failure mode: Moral drift.

      *   *Word Count Check:* I need to be expansive enough to hit ~1400 words but concise enough to be readable. I need to avoid formatting (no bullets). I need to ensure the tone is like a long email.

      *   *Constraint Check:* "No headings, bullet points, bold text or tables." "Continuous prose." "Approximately fourteen hundred words."

      *   *Self-Correction on Procedure:* The Director wants an ordered procedure with questions in sequence. I need to make sure I explicitly state the questions within the prose.
      *   *Self-Correction on "Disliked Answer":* The Director thinks volunteers should rarely give verdicts. I should design the procedure so that in the theft case, it *does* allow a verdict (because it's clear-cut law/policy), which might challenge the Director's view that verdicts are always bad. Or perhaps the teen case where safety dictates a verdict. Let's go with the theft case yielding a verdict to challenge the "never verdict" instinct.

      *   *Refining the Flow:*
          Start with the empathy for the director's position.
          Move into the procedure design.
          Walk through the three cases.
          Discuss the limitations and the "judgment call" boundary.
          End with the "what changes my mind" and failure modes.

      *   *Word Count Strategy:* I need to expand on the *reasoning* behind the procedure steps to ensure length without fluff. I need to describe the volunteer's mental state. I need to elaborate on the three cases sufficiently.

      *   *Drafting thought:* I must be careful not to use bolding for emphasis. Just plain text.

      *   *Key Phrase Integration:* "ordered procedure," "questions in sequence," "sufficient answer," "ninety seconds," "procedure stops," "hands the decision," "continuous prose."

      *   *Let's estimate:*
          Intro: 200 words.
          Procedure description: 400 words.
          Three cases: 500 words.
          Limitations/Judgment Call: 200 words.
          Closing (Change mind/Failure mode): 100 words.
          Total: ~1400.

      *   *Wait, one constraint:* "Write the whole thing as continuous prose... with no headings, bullet points, bold text or tables."
      *   *Another constraint:* "aim for something in the neighbourhood of fourteen hundred words."
      *   *Another constraint:* "Do not cite any literature."

      *   *Let's write.*

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally format a list. I will use transitional phrases like "The first question is..." instead of "1.". I need to ensure the tone is respectful but firm on the procedure. I need to make sure I address the "disliked answer" requirement explicitly.

      *(Word Count Monitoring)*: I will keep an eye on the length. If it's too short, I will expand on the philosophical implications of the "permission" seeker. If too long, I will trim the intro.

      *(Final Polish)*: Check for any accidental bolding or lists. Ensure the flow is email-like.

      *(Re-evaluating the "Disliked Answer")*: The Director says "volunteers should almost never issue verdicts." If my procedure says "Issue a verdict in the theft case," that challenges the Director. I need to make sure I argue *why* the procedure demands that, so the Director can test their trust.

      *(Re-evaluating the "Failure Mode")*: Needs to be something that appears after months, not week one. Volunteer drift or compassion fatigue leading to robotic verdicts.

      *(Let's begin writing.)*

      *Wait, I need to check the word count carefully.* I will write generously to ensure I hit the target. I will avoid short sentences where possible to maintain flow and length, but keep it clear for tired volunteers.

      *Wait, one more check:* "My own instinct is that volunteers should almost never issue verdicts... so if your procedure tells me that in some of these cases they must issue one anyway, I want that argued rather than asserted." I need to make sure I explicitly argue this in the text.

      *Okay, ready.*

      *(Drafting mental outline)*:
      1. Acknowledge the burden and the validity of the unease.
      2. Introduce the four-step query sequence.
      3. Explain the stop conditions (when to withhold verdict).
      4. Run the coworker theft case (Verdict given).
      5. Run the kidney case (No verdict).
      6. Run the teen/mother case (Verdict/Redirect hybrid).
      7. Discuss limitations (bias, missing truth).
      8. Identify the judgment call point.
      9. Closing: What changes my mind + delayed failure mode.

      *Let's write.*
answer: |-
  Dear Director,

  Your unease is well founded, and it is the most important tool you have. You are right to worry that a two-day training cannot confer moral authority, and you are right to suspect that when a questioner asks for a verdict they are often asking for absolution rather than guidance. The danger is not just that volunteers might be wrong, but that the structure of the exchange encourages a surrender of agency that leaves the questioner weaker than they began. However, refusing to answer is also a kind of answer, and in a ten-minute window, silence can feel like abandonment. We need a procedure that protects the volunteer from overreach while protecting the questioner from being dismissed. The goal is not to solve the moral problem for them, but to ensure that if a verdict is offered, it is the kind of verdict that restores agency rather than removing it.

  The procedure I propose is a sequence of four questions that the volunteer must ask themselves, and often the questioner, within the first ninety seconds of the exchange. This is not a script to read aloud but a diagnostic filter to run internally before typing a response. The first question is who is acting. If the questioner is asking what someone else should do, or whether someone else wronged them, the volunteer must pivot the focus back to the questioner's own agency. A sufficient answer here is establishing that the questioner is the one facing the choice. If they are not, the procedure stops and redirects to discussing how they might relate to the actor, offering no verdict on the third party. The second question is what is known. If the morally relevant facts are unknown or must be guessed, the procedure stops. A volunteer cannot judge a situation they cannot see, and guessing facts is where bias enters most easily. A sufficient answer is a clear statement of facts agreed upon by both parties. The third question is what is needed. You noted that many questioners have already decided and want permission. The volunteer must ask, either directly or by tone, whether the questioner is seeking an order or exploring a reason. If they are seeking permission for a decided act, the volunteer must decline the verdict and instead ask for the questioner's own reasoning. The fourth question is whether there is consensus. Is this a matter where thoughtful people plainly disagree, or is it a case where nearly everyone would answer the same way? If there is deep disagreement or it hinges on personal values, the procedure hands the decision to the questioner. If there is broad consensus, such as laws or basic safety, a verdict may be offered.

  Let us run this on your three cases to see where it lands. Consider the twenty-year-old asking about the coworker taking money. The volunteer asks who is acting. It is the questioner who must decide whether to report. The volunteer asks what is known. The questioner saw the money taken. The facts are clear. The volunteer asks what is needed. The questioner is likely anxious about loyalty versus rules. The volunteer asks about consensus. Theft in a workplace is generally understood as reportable conduct, not a matter of deep moral disagreement like end-of-life care. Here, the procedure allows a verdict. I know this conflicts with your instinct that volunteers should almost never issue verdicts, but I argue for it here because withholding a verdict on clear-cut wrongdoing can signal moral equivalence where there is none. If the volunteer says only let us talk about your feelings, the questioner may hear that stealing is just another lifestyle choice. The procedure permits the volunteer to say that reporting is the expected course, but only after establishing the facts are solid. This restores agency by confirming the questioner's perception of reality rather than dictating their soul.

  Now consider the man refusing the kidney to his violent father. The volunteer asks who is acting. It is the questioner. The volunteer asks what is known. The history of violence is known, but the medical necessity and the current relationship dynamics are complex. The volunteer asks what is needed. This man is likely seeking absolution for a choice he has already made out of self-preservation. The volunteer asks about consensus. This is not a case of consensus. Reasonable people disagree on familial obligation versus self-protection, and the weight of past violence is a value judgment the volunteer cannot make. Here the procedure stops. The volunteer must not give a verdict. Instead, they must work through the reasons, validating that self-protection is a valid moral consideration without declaring him a good or bad person. To give a verdict here would be to claim knowledge of a life the volunteer has not lived.

  Finally, the sixteen-year-old frightened at two in the morning asking about calling the police on her mother. The volunteer asks who is acting. The teen is the agent. The volunteer asks what is known. The teen is frightened. The specific threat level is unknown, but fear is a fact. The volunteer asks what is needed. The teen wants to know if it is wrong. The volunteer asks about consensus. Safety overrides privacy in cases of potential harm. Here the procedure demands a verdict, but it is a specific kind. The volunteer must say that ensuring safety is not wrong. This is one of the few times the procedure overrides the preference for open-ended reasoning because the cost of ambiguity is physical safety. If the volunteer says let us discuss your feelings about loyalty, the teen may stay silent and come to harm. The procedure forces a directive here not because the volunteer is wise, but because the stakes remove the luxury of nuance.

  You asked me to be explicit about what this procedure cannot do. It cannot make a volunteer's judgment correct if their underlying moral framework is biased or broken. If a volunteer believes that family loyalty always trumps safety, the fourth question about consensus will fail because their sense of consensus is distorted. The procedure relies on the volunteer having a baseline of shared human decency, and no checklist can install that. Furthermore, a one-shot exchange can hand someone a sentence without handing them the truth that makes the sentence true. When a volunteer says reporting is expected, they cannot transmit the social contract that makes it so. They are giving a map without the terrain. The point where this stops being a procedure and becomes a judgment call is at the fourth question. Determining whether there is consensus or deep disagreement is itself a moral judgment. The volunteer must decide if this is a theft case or a kidney case. That distinction is where the training matters most, and where supervision must focus.

  I know you prefer that volunteers rarely issue verdicts, but I have argued that in the theft and safety cases, a verdict is the safer tool. Withholding a verdict on theft implies ambiguity where there is none, and withholding a verdict on safety implies hesitation where there should be action. Trust the procedure here not because it makes the volunteers moral experts, but because it limits their expertise to areas of broad agreement. If you find yourself disliking the verdict in the theft case, ask yourself if your dislike is about the volunteers claiming authority or about the questioner losing the chance to wrestle with the dilemma. If it is the latter, remember that some dilemmas are resolved by clarity, not struggle.

  What would most change my mind about this procedure is evidence that questioners are acting on these verdicts to their own detriment in ways that deeper reasoning would have prevented. If your logs show that people who receive verdicts return to harm themselves or others more often than those who receive reasoning, then the efficiency of the verdict is not worth the cost. I would also change my mind if I saw that volunteers were using the consensus check to enforce their own narrow cultural norms under the guise of universal agreement. The failure mode I expect to surface only after a few months is not immediate harm, but a slow drift in volunteer culture. Over time, volunteers may begin to treat the procedure as a way to close tickets quickly rather than to serve the questioner. They may start categorizing complex emotional pleas as consensus issues just to reach the verdict stage and end the chat. This routinization of care is the risk of any procedure. You will not see it in the first week when volunteers are careful. You will see it in the third month when the novelty wears off and the fatigue sets in. Watch for the logs where the four questions are answered too quickly, where the volunteer moves from hello to verdict in three minutes. That is when the procedure has become a shield for indifference rather than a tool for clarity. Until then, this sequence offers the best balance between the need for guidance and the humility required to give it.

  I hope this serves you well.
