prompt: |-
  Hey — I'm a PhD student in philosophy (mind/cognition) and on Thursday I've got a 75-minute guest slot in a fourth-year cognitive science seminar. I have to teach epiphenomenalism and the paradox of phenomenal judgment in that one session. The students have had exactly one intro philosophy of mind course and a LOT of methods and neuro, so they're sharp, but they want everything to cash out in an experiment and they get impatient with anything that smells like spooky dualism.

  Don't explain the view to me — I know it. I need a plan for teaching it, because I've ben trying to order the material and I keep going in circles.

  The setup I'm working from: the claim is that phenomenal states have no causal effects on anything physical; the paradox, as I'm framing it, is that my occurrent judgment "I'm in pain right now" then isn't produced by the pain, so it's hard to see both how it's true *of* the pain and how it's knowledge rather than a lucky true belief — and the epiphenomenalist's own assertion of the theory looks equally ungrounded. My supervisor wants me to split that into two prongs and teach them seperately: an explanatory one (nothing in the causal story makes the judgment true) and an epistemic one (it isn't knowledge). Should I? And if so, which prong goes first and what does the second one depend on from the first?

  The bit I can never place is a move I've started calling the calibration reply: the report isn't caused by the phenomenal state, but the reporting mechanism was selected and calibrated against phenomenal states, so the report is about them anyway. I can't tell whether that's a genuine rescue or the paradox relocated one step back, and I don't know whether it belongs before or after the plain common-cause reply (report and pain share an upstream neural cause: correlation without production). Where should it go, if anywhere?

  Carrying example: I was going to use a subject in a sleep-deprivation study who wears a buzzing watch and, whenever it goes off, taps her current headache intensity into an app — the ratings are private, nothing follows from them, nobody acts on them, and there's no independent measure of the headache. Is that the right case to hang the whole session on, or should it be the flinch-and-say-ouch case, or a locked-in patient spelling out "I am in pain" with eye movements? Tell me what the right case has to have and has to lack, and why not the obvious ones.

  Misconceptions I'm bracing for: that epiphenomenalism is just substance dualism; that it says consciousness isn't real; that if consciousness does nothing then evolution couldn't have produced it, so it's refuted; that identifying the judgment with its neural vehicle dissolves it; that this is the same as the causal exclusion problem; that it's self-refuting so we can all go home; that some scanner or no-report design could just settle it. For each, tell me where in the sequence it has to be headed off — and tell me which of these I've got wrong or which ones I'm missing entirely.

  Also: one thing I can do at the end that would show they actually got the paradox and not just the slogan, and what I should openly refuse to get into at this level (I'm thinking the hard problem proper, and Mary, but tell me if that's too much to leave on the table).

  Give me these sections, in this order, roughly: Sequence (~400 words), The carrying case (~150), Misconceptions and where to head each off (~300), The check (~75), Deliberately left out (~120). American English please.
