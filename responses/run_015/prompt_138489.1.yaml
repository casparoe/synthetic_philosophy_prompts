answer: |-
  **Sequence**
  Yes, follow your supervisor. Split the prongs. Lead with the Explanatory Prong: establish that on epiphenomenalism, the neural cause of the judgment is distinct from the phenomenal cause (which is null). This sets the stage for the Epistemic Prong: if the pain didn't cause the judgment, why trust the judgment? The Calibration Reply belongs *after* the Common-Cause Reply. Common-cause is the baseline physicalist move (neural state causes both). Calibration is the sophisticated evolutionary patch (mechanism selected for accuracy). Place it here because if calibration fails, the Epistemic Prong becomes fatal. If you put calibration too early, students think the problem is solved before they grasp the epistemic gap. Structure: 1. Define Epiphenomenalism (10 mins). 2. Explanatory Prong + Common-Cause (20 mins). 3. Calibration Reply (15 mins). 4. Epistemic Prong + Self-Refutation (20 mins). 5. Discussion (10 mins). This order ensures the epistemic worry lands with full force only after the explanatory loopholes are closed. The second prong depends on the first because without establishing the causal disconnect, the knowledge claim remains intact. Crucially, treat Calibration as the bridge: if the mechanism wasn't calibrated by the phenomenon, the correlation is coincidental. If it was calibrated, how? That question drives the transition to the epistemic failure. You must show that the Explanatory Prong creates the vacuum that the Epistemic Prong fills. If students think the judgment is true because of a common cause, they haven't accepted the Explanatory Prong's constraint. The Calibration Reply attempts to restore truth-tracking without causal efficacy. If you refute Calibration, the Epistemic Prong shows that without tracking, there is no knowledge. The dependency is strict: you cannot argue the judgment is unknowable until you prove it isn't causally grounded. This sequential dismantling of physicalist defenses is crucial for CogSci students who rely on causal models. By forcing them to defend the causal model first, then the evolutionary model, you isolate the epistemic failure as the residual problem.

  **The carrying case**
  Use the sleep-deprivation headache app. The flinch-and-ouch case is too noisy; students will conflate pain with nociceptive reflexes or communicative intent, allowing them to posit causal pathways you want to block. The locked-in patient introduces communication barriers that distract from the metaphysical point. The headache case works because it isolates the *judgment* from *behavioral utility*. The rating is private, has no consequence, and lacks independent verification. This forces students to confront the link between the feeling and the report without relying on functional output. The case must lack downstream behavioral effects to block functionalist replies, and it must lack public verification to block intersubjective checks. It needs to be a pure doxastic output triggered by a private state.

  **Misconceptions and where to head each off**
  Head off "Substance Dualism" and "Consciousness Isn't Real" in the intro; clarify this is property dualism where qualia exist but are causally inert. Address "Causal Exclusion" early too; distinguish it from Kim's argument (this is about knowledge, not just ontology). When discussing Calibration, preempt the "Evolution" objection; if qualia do nothing, selection can't calibrate for them. During the Explanatory Prong, block "Neural Vehicle Identity"; remind them the judgment is about the *phenomenal property*, not the neural vehicle. Save "Self-Refutation" for the climax; it's the conclusion, not a premise. Finally, dismiss "Scanner/No-Report Designs" during the Epistemic Prong; neuro correlates don't solve the truth-link between experience and report. If you miss these, students will retreat to physicalism before engaging the paradox. Specifically, tell them neuro methods track the neural cause, not the phenomenal cause, so fMRI cannot adjudicate the truth of the report relative to the qualia. Also, address the "Self-refuting so we can go home" crowd by noting that dismissing the theory because it undermines its own assertion is exactly the point of the paradox, not a reason to skip it. Furthermore, clarify that identifying the judgment with its neural vehicle dissolves the paradox only by denying the phenomenal property exists as distinct, which contradicts the starting assumption. Remind them that shadows exist but don't push objects.

  **The check**
  Ask them to draw the causal diagram. If they draw an arrow from Phenomenal State to Judgment, they missed the view. If they draw Neural State causing both, ask: "Why is the judgment true?" If they can't answer without smuggling in causal efficacy, they grasp the paradox. This distinguishes memorizing the slogan from understanding the explanatory gap.

  **Deliberately left out**
  Leave the Hard Problem and Knowledge Argument (Mary) on the table. The Hard Problem concerns why physical processes give rise to experience at all; this session concerns whether experience affects physical processes. Mary focuses on propositional knowledge vs. acquaintance, whereas this paradox targets the causal history of judgment. Introducing them conflates metaphysical grounding with causal efficacy. Staying focused on the causal structure of judgment prevents the session from dissolving into general qualia mysticism. Mary's issue is about new information upon release; this issue is about the validity of current reports. Conflating them confuses the students about whether the problem is about *access* to knowledge or the *production* of knowledge.
