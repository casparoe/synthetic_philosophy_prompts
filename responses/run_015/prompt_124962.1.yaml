answer: |-
  # Lesson Plan: The Spectator, The Actor, The Citizen
  **Text:** Rousseau, *Letter to d'Alembert on the Theatre*
  **Time:** 50 Minutes
  **Students:** 18
  **Room:** Seminar room (table pushed to wall)

  ## I. Materials & Preparation

  1.  **Room Setup:** Chairs in a tight semi-circle facing one open wall (Condition 1). Space cleared in the center for Condition 3.
  2.  **Desk Pack (18 sets):**
      *   One blank index card (for private voting).
      *   One "Action Card" (see below).
      *   One pen.
  3.  **Action Card Text:**
      > **Civic Action:** Draft a 150-word letter to [City Councillor Name] regarding local housing security.
      > **Cost:** Approx. 30 minutes of your time this week.
      > **Impact:** Low individual, high collective if multiplied.
      > *Do not sign this card yet.*
  4.  **Actor Script (Condition 1):** A single sheet for 3 volunteers.
  5.  **Reader Script (Condition 2):** A single sheet with the four lines.
  6.  **Refuser Card (Condition 3):** One card, sealed or folded.
  7.  **Pledge Slips (18):** Small slips for the final anonymous opt-in.

  ---

  ## II. Minute-by-Minute Timeline

  ### 0:00 – 0:02 | Entry & Silence
  *   **Instructor:** Say nothing. Gesture students to sit in the semi-circle. Place Desk Packs on chairs.
  *   **Rule:** "No discussion until the end. Follow instructions exactly."

  ### 0:02 – 0:10 | Condition 1: The Spectacle (Thesis 1)
  *   **Instruction:** "Three volunteers to the front. Read the script aloud. Remain in character. Audience: Watch. Do not speak. Do not comfort."
  *   **The Script (Misfortune):**
      > *Actor A:* "They came at dawn. The lock was broken."
      > *Actor B:* "Where will the children sleep? The winter is here."
      > *Actor C:* "I wrote to the landlord. He did not answer. I have no more words."
      > *(Pause for 10 seconds of silence. Actors look at the audience, then exit.)*
  *   **Measurement:** "On your index card, write 1-10: How moved were you? Then, look at the Action Card. Would you do this task *now*, immediately after seeing this? Write YES or NO. Keep the card face down."
  *   **Time:** 8 minutes total.

  ### 0:10 – 0:17 | Condition 2: The Actor (Thesis 2)
  *   **Instruction:** "One volunteer to the center. You will read the same four lines twice."
  *   **The Lines:**
      > "The fire is out. The room is cold.
      > I have no bread. I am alone.
      > The night is long. The morning far.
      > I speak to walls. They do not hear."
  *   **Reading 1:** "Read this as if you are truly grieving. Feel the loss."
  *   **Reading 2:** "Read this as if you are being paid to make *us* feel grief. You feel nothing; focus only on our reaction."
  *   **Vote:** "Show of hands: Which reading was more moving? (1 or 2)"
  *   **Report:** "Reader: Which was easier to sustain?"
  *   **Time:** 7 minutes total.

  ### 0:17 – 0:25 | Condition 3: The Festival (Thesis 3 + Refuser)
  *   **Setup:** "Everyone stand. Form a tight circle. No gaps."
  *   **Secret Instruction:** Hand the **Refuser Card** to one student (pre-selected or random) as they stand. Text: *"Do not join the activity. Stand outside the circle. Watch the others. Do not explain yourself."*
  *   **Instruction:** "We are the spectacle. Clap a rhythm together. Clap-Clap-Stomp. No leaders. Keep it going for 60 seconds."
  *   **Activity:** 60 seconds of rhythm. The Refuser stands aside.
  *   **Measurement:** "Stop. Sit. Look at the Action Card again. Would you do this task *now*, immediately after this? Write YES or NO on a fresh index card. Keep it face down."
  *   **Time:** 8 minutes total.

  ### 0:25 – 0:30 | The Pledge (Real Action)
  *   **Instruction:** "Take the Pledge Slip. If you commit to doing the 30-minute Action Card task this week, sign it. If not, leave it blank. Fold it. Pass it to the center."
  *   **Collection:** Collect slips silently. Count them visibly. Place the number on the board (e.g., "4/18").
  *   **Time:** 5 minutes total.

  ### 0:30 – 0:50 | Debrief (The Argument)
  *   **Structure:** See Section IV below.

  ---

  ## III. Design Logic & Constraints

  **The Forbidden Words:**
  Do not use *catharsis*, *sterile pity*, or *paradox of the actor* until minute 30. Use descriptions instead: "spending the emotion," "counterfeiting feeling," "division of roles."

  **The Refuser Role:**
  This is the critical risk. The student may feel awkward.
  *   *Mitigation:* Tell them privately as they enter the room: "I need you to play a specific role for the argument. It will feel uncomfortable. That is the point. You can debrief me fully after class if you feel targeted."
  *   *Why:* If you assign it live, they may refuse the card. If you assign it early, it's collusion. *Compromise:* Pass the note at Minute 17 with a nod. It signals "this is part of the game."

  **The Action Measurement:**
  You are measuring *intent* after Condition 1 and 3 (on index cards), and *commitment* at the end (pledge slips).
  *   *Why:* You cannot verify the 30-minute task in class. The gap between "Intent after Spectacle" vs "Intent after Festival" vs "Actual Pledge" is the data for the debrief.

  ---

  ## IV. The Debrief Script (20 Minutes)

  **1. Mapping the Moments (5 mins)**
  *   **Ask:** "Compare your Yes/No cards from Condition 1 and Condition 3. Did the number change?"
  *   **Thesis 1 (Catharsis):** If 'Yes' dropped or stayed low despite high emotion in Cond 1: "You felt pity, but the feeling was complete in the room. It asked for nothing but applause. Rousseau calls this **sterile pity**. The emotion is a substitute for action, not a rehearsal."
  *   **Thesis 3 (Festival):** If 'Yes' rose in Cond 3: "Here there were no spectators. You were the source of the energy. Rousseau argues this structure creates civic bond."

  **2. The Actor Paradox (5 mins)**
  *   **Ask:** "Reader, which was easier? Audience, which was better?"
  *   **Thesis 2 (Actor):** Usually, Reading 2 (Technique) is rated higher, but Reading 1 (Feeling) is harder to sustain.
  *   **Point:** "Rousseau argues the actor's excellence is **counterfeiting**. We pay them to feel what we do not. Outside the theatre, a person faking grief is contemptible. Inside, they are celebrated. This creates a culture of appearance over being."

  **3. The Refuser & The Danger (5 mins)**
  *   **Ask:** "Look at [Refuser Name]. What was their position in Condition 3?"
  *   **Student Objection:** Someone will say: "They were excluded," or "It was coercive," or "There was no place for dissent."
  *   **Instructor Response:** "Exactly. In the Theatre, the spectator is safe in the dark. In the Festival, if you do not clap, you are outside the People. Rousseau wants unanimity. **This is the danger.** The festival manufactures unity by leaving no room for the spectator. The theatre protects the individual's distance; the festival dissolves it."
  *   **Earned vs. Illustrated:** "Today *illustrated* the feeling of unity. It did not *earn* the claim that this makes a better state. That requires generations."

  **4. What I Must Supply (3 mins)**
  *   **Instructor:** "Two things this room cannot show:
      1.  **Time:** Rousseau is talking about *mores* formed over centuries in a small republic (Geneva), not a 50-minute seminar.
      2.  **Division:** For Rousseau, the political harm is the *division of a people into actors and spectators* itself, regardless of the play's content. By watching, you surrender your agency to represent yourself."

  **5. Handling the "Manipulation" Objection (2 mins)**
  *   **Anticipate:** A student may say: "You manipulated us to make a point."
  *   **Response:** "Yes. I acted as the **Legislator**. Rousseau argues the Legislator *must* shape the environment to shape the citizen. The question is not *if* we are staged, but *who* holds the script. If I am the Legislator, do you trust my script? If not, how do we write one together without a stage?"

  ---

  ## V. Failure Modes & Contingencies

  | Failure Mode | Prediction | Handling Strategy |
  | :--- | :--- | :--- |
  | **Bad Acting** | Condition 1 feels cheesy; no pity felt. | **Pivot:** "If bad acting fails to move you, does good acting succeed? Or does it just distract you from the reality? Rousseau fears the *form* more than the quality." |
  | **Hypothesis Guessing** | Students realize the point early and perform "correctly." | **Pivot:** "If you guessed the script, does that invalidate the feeling? Or does it prove the *distance*? You are analyzing, not feeling. That is the spectator's safety." |
  | **Low Pledge Count** | 0 or 1 students pledge the action. | **Pivot:** "This proves Rousseau's point about modern mores. We are not Spartans. We are Parisians. We consume emotion. The low count is data, not failure." |
  | **Contamination** | Condition 1 fatigue makes Condition 3 feel like a chore. | **Pivot:** Acknowledge it. "Civic fatigue is real. But notice: even tired, the rhythm required *your* body. The play did not." |
  | **Manipulation Objection** | "You tricked us." | **Pivot:** Use the Legislator script (Debrief Section 5). "The festival *is* a trick. Is it a benevolent one?" |
  | **Refuser Breaks Character** | Refuser joins in or laughs. | **Pivot:** Ignore it during activity. In debrief: "Even the designated dissenter couldn't hold the line. How strong is the pressure to conform?" |

  ---

  ## VI. Honest Account: What This Exercise Cannot Do

  1.  **It cannot prove long-term moral decay.** You are measuring a 50-minute affective shift, not the corruption of a nation's *mores* over a generation. You must explicitly state this limitation in the debrief (see Section IV.3).
  2.  **It cannot replicate the "Small Republic."** 18 students in a seminar room are not Geneva. The intimacy is artificial. The "Festival" feels safe because *you* (the authority) sanctioned it. A real civic festival has stakes (exile, shame) that this room lacks.
  3.  **It cannot resolve the "Legislator" problem.** The exercise demonstrates the *power* of the festival, but not its *legitimacy*. You must supply the normative question: "Just because we *can* unify the room, *should* we?"
  4.  **It risks trivializing the "Action."** The 30-minute task is low-stakes. Rousseau is talking about defending the Republic. Do not claim the postcard equals civic virtue. Frame it as a "micro-simulation of the gap between sentiment and duty."

  ## VII. Instructor Notes for the "Refuser"

  *   **Selection:** Choose a student you know to be intellectually robust, or send an email beforehand if possible. If random, ensure the card says: *"This is a required role for the seminar design. You will not be penalized. Please stand outside the circle and watch. Debrief with me after class."*
  *   **Post-Class:** Debrief this student immediately. Acknowledge the discomfort. Thank them for generating the critical objection that saves the seminar from becoming a cult simulation.

  ## VIII. Final Check on Forbidden Words
  *   **Sterile Pity:** Do not use until Debrief Section 1.
  *   **Catharsis:** Do not use until Debrief Section 1.
  *   **Paradox of the Actor:** Do not use until Debrief Section 2.
  *   **Legislator:** Do not use until Debrief Section 5.

  *If a student uses them:* Acknowledge the term, write it on the board, and say: "Hold that definition until minute 30. Let's see if the experience matches the word."
