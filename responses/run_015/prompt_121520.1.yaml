  **Project:** Objectless Striving: Resolving the Will-Emotion Contradiction in Schopenhauer

  **Bottom Line:** This project argues Schopenhauer's claim that music copies the Will directly is incompatible with the view that music expresses determinate emotions. Consistency requires redefining musical expression as the morphology of striving, devoid of specific emotional objects.

  **Research Question:** Is Schopenhauer's ontology of the Will logically compatible with the assertion that music expresses determinate emotions like grief or triumph?

  **The Problem:** Standard interpretations accept two contradictory claims: (1) music bypasses Ideas to copy the Will (thing-in-itself), and (2) music expresses specific emotions. This ignores Schopenhauer's ontology. Emotions are representations tied to the *principium individuationis*; they require objects within space and time. The Will is objectless noumenal striving. If music copies the Will, it cannot represent determinate phenomenal states without violating the noumenal/phenomenal distinction. Current literature glosses over this ontological mismatch, assuming "expression" is compatible with "direct copying."

  **Methodology:** Close exegesis of *The World as Will and Representation* Vol. I, §52, focusing on the Idea/Will distinction. I will test Schopenhauer's account against the intentionality of emotion. The argument proceeds by denying music has determinate emotional objects, analyzing whether "sadness without a cause" fits the ontology of the Will. I will interrogate whether "feeling" without "object" constitutes an emotion in Schopenhauer's system. If emotions are necessarily intentional, music cannot express them. If music expresses the *motion* of will (striving, attaining, failing), it copies the Will without invoking Ideas. This is conceptual analysis, not historical survey.

  **Scope & Feasibility:** One semester is sufficient for focused textual analysis and one sustained argument. I will avoid broader metaphysics, restricting analysis to aesthetics §52-§53. The risk is scope creep into general metaphysics; I will maintain focus on aesthetic implications.

  **Success Conditions:** Success is demonstrating that music expresses the *dynamic structure* of willing (tension, satisfaction, languishing) rather than specific feelings. This reconciles direct copying with a thinner notion of emotional determinacy. Failure is proving the contradiction is fatal, undermining his aesthetic theory's coherence. Either outcome yields a determinate philosophical result.

  **Significance:** This clarifies whether Schopenhauer's aesthetics can survive his own metaphysics, offering a rigorous correction to standard "expressionist" readings.
