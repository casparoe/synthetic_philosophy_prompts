  **Profile**
  Five voters, three candidates (A, B, C). Borda scores: 1st=2, 2nd=1, 3rd=0.
  1: C > B > A
  2, 3: B > A > C
  4, 5: A > C > B
  Borda satisfies Unrestricted Domain, Non-dictatorship, and yields a transitive ordering by arithmetic sum. Pareto holds: no alternative is unanimously preferred to another.

  **Verdicts**
  *Original Borda:* A=6, B=5, C=4. **A wins, C loses.**
  *Pairwise:* B defeats A (3–2). Majority relation: B > A.
  *Withdrawal:* C removed. Profiles become 1:B>A, 2-3:B>A, 4-5:A>B.
  *New Borda (1–0):* B=3, A=2. **B wins.**
  The social ranking of A vs B flips (A>B to B>A) despite unchanged individual preferences and unchanged pairwise majority (B>A persists).

  **What does the work**
  The flip relies on the asymmetry of C's position relative to A and B. In the profile, C is ranked above A by 1 voter, but above B by 3 voters. This depresses B's score relative to A's. If we delete this asymmetry by symmetrizing C's position (e.g., voters 4,5 rank A>B>C), C is above A and B equally often (1 voter each). Recalculating: A=6, B=7. B wins originally; the flip disappears. The arithmetic pathology requires C to shield A from B more than B from C.

  **The defence**
  A Borda defender argues IIA is too strict for rules capturing intensity. Borda uses positional information (2nd places) which IIA forbids. Here, A's strong 2nd-place support outweighs B's 1st-place support. The cost is vulnerability to strategic agenda setting (clone candidates) and violation of the Condorcet criterion (B is the Condorcet winner in cycle-free variants). Rationality requires consistency; Borda sacrifices consistency for intensity sensitivity.

  **IWL**
  IWL (Independence of Withdrawn Losers) is strictly weaker than IIA (which removes *any* alternative). IIA implies IWL, but not vice versa.
  *Rule:* **Sequential Pairwise Voting** (fixed agenda).
  *Verification:* It satisfies Pareto (pairwise majority respects unanimity), Non-dictatorship, Completeness, and Transitivity (agenda tree yields linear order). It satisfies IWL: if the last alternative loses the final round, removing it leaves the prior pairwise contest (determining the survivor order) unchanged.
  *Near-misses:* Plurality fails Pareto. Copeland fails Transitivity (cycles).
  *Condorcet Notes:* This profile contains a Condorcet cycle (B>A>C>B). The cycle facilitates satisfying condition (ii) (C is 1st) alongside the Borda reversal. If a Condorcet Winner is required, constructing such a profile becomes impossible in this 5-voter space without violating condition (ii) or the Borda reversal, as C must be ranked lower to lose pairwise, conflicting with being a 1st choice.
