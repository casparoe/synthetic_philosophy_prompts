      *   *Refining Greedy Reductionism:* Dennett warns against skipping levels. In AI, the hierarchy *is* the levels. Greedy Reductionism is **collapsing the hierarchy.** It's attempting to minimize free energy by only adjusting parameters at the lowest (sensory/physical) level, ignoring the computational efficiency of abstract latent states. It's assigning excessive precision to sensory PE and insufficient precision to deep semantic priors.

