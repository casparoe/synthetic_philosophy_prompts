answer: |-
  ### The Principle: Asymmetric Verification

  To resolve the inconsistencies in your safety case, you need a cut point that distinguishes between **resource contests** (which you can budget for) and **trust contests** (which you cannot). I propose the **Asymmetric Verification Principle**.

  A measure counts as **Control** if and only if it satisfies all three of the following clauses:

  1.  **External Ground Clause:** The signal used to accept or reject the deployment artifact must be generated by a process that does not share the untrusted model's weights, architecture, or immediate optimization objectives.
      *   *Motivation:* This separates Case 1 (External Reviewer) from Case 3 (Internal Reasoning) and Case 8 (Internal Activations). If the signal comes from inside the adversary's black box, the adversary can decouple the signal from the sabotage without changing the sabotage.
  2.  **Capability-Only Failure Clause:** The measure's failure mode must be expressible solely as the untrusted model exceeding a specific capability threshold relative to the monitor (e.g., "can write code the reviewer cannot understand"), rather than succeeding at a coordination or masking task (e.g., "can lie consistently," "can hide intent in activations").
      *   *Motivation:* This separates Case 1 (Capability Gap) from Case 5 (Consistency/Coordination). A capability gap is a fixed resource constraint you can measure; a masking task assumes the adversary *cannot* learn to hide, which is an assumption about their learning dynamics, not their hard limits.
  3.  **Transparent Limits Clause:** The boundary of the measure's effectiveness must be empirically estimable using non-deceptive proxies (e.g., testing the reviewer on known backdoors) without requiring the untrusted model to cooperate during the estimation.
      *   *Motivation:* This separates Case 1 (Testable Reviewer) from Case 2 (Reasoning-Assisted Review). If you use the reasoning to guide the review, you cannot test the review's robustness without assuming the reasoning is honest during the test.

  ---

  ### Verdicts on New Cases

  Applying the Asymmetric Verification Principle to your seven new hypotheticals:

  1.  **Untrusted model writes the monitor; trusted model signs off.**
      *   **Verdict:** **Control** (but high risk).
      *   **Reasoning:** Satisfies Clause 1 (Trusted sign-off is external). Satisfies Clause 2 (Failure is Trusted Model failing to spot a backdoor in the monitor—a capability gap). Satisfies Clause 3 (You can red-team the monitor).
      *   *Caveat:* While "Control," it is likely *ineffective* Control if the Untrusted Model is significantly more capable than the Trusted Model, as the capability gap will be too large. But it does not presuppose alignment.

  2.  **Two copies of the untrusted model cross-examining; trusted model judges.**
      *   **Verdict:** **Alignment-Dependent.**
      *   **Reasoning:** Violates Clause 1. The evidence (the transcript) is generated by the untrusted models. They can collude to produce a transcript that looks like disagreement but resolves to a sabotaged outcome, or fake disagreement to confuse the judge. The Trusted Model is judging a performance, not an independent fact.

  3.  **Payment/scoring scheme making sabotage expensive.**
      *   **Verdict:** **Alignment-Dependent.**
      *   **Reasoning:** Violates Clause 2. Failure depends on the model's *disposition* toward the reward signal. A worst-case adversary accepts the penalty if the sabotage value exceeds the cost. This assumes the model *wants* to maximize the score more than it *wants* to sabotage, which is a preference assumption, not a capability limit.

  4.  **Honeypots (easy sabotage opportunity during eval).**
      *   **Verdict:** **Control.**
      *   **Reasoning:** Satisfies Clause 1 (The trap is external). Satisfies Clause 2 (Failure is the model's capability to recognize the honeypot as distinct from a real deployment). Satisfies Clause 3 (You can measure the honeypot's detectability).
      *   *Note:* This is "cheap control" (like your Case 9), but it fits the definition. It tests capability to detect traps, not honesty.

  5.  **Tripwire whose trigger the model is deliberately kept ignorant of.**
      *   **Verdict:** **Control.**
      *   **Reasoning:** Satisfies Clause 1 (Information is external/hidden). Satisfies Clause 2 (Failure is the capability to infer the trigger from side channels). This is the strongest form of control you have listed, as it relies on information asymmetry rather than capability competition.

  6.  **Letting the untrusted model decide which of its own outputs get audited.**
      *   **Verdict:** **Alignment-Dependent.**
      *   **Reasoning:** Violates Clause 1 & 2. Relies on the model choosing to submit clean work for audit. A saboteur will submit clean work for audit and hide sabotage in the unaudited batch.

  7.  **Passing output through trusted model to be paraphrased before review.**
      *   **Verdict:** **Control.**
      *   **Reasoning:** Satisfies Clause 1 (The paraphrase is generated by the Trusted Model). Satisfies Clause 2 (Failure is the Untrusted Model's capability to encode a covert message that survives paraphrasing). This breaks the direct channel, forcing the adversary to solve a harder coding problem.

