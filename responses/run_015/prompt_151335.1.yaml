  ### Revisions to Your Original Nine Verdicts

  To maintain consistency with the Asymmetric Verification Principle, you must update three of your original gut verdicts.

  **1. Case 2 (Output + Reasoning Review): Change to Alignment-Dependent.**
  *   **Your Gut:** "I want to call this control... but it nags at me."
  *   **Principle Verdict:** **Alignment-Dependent.**
  *   **Why:** If the reviewer *reads* the reasoning to inform their decision, they are violating Clause 1 (External Ground). They are treating the adversary's self-report as evidence. If the reasoning is merely logged and *ignored* for the pass/fail decision, it remains Control (Case 1). If the reasoning influences the review (e.g., "The code looks suspicious, but the reasoning explains it well, so I'll pass it"), you have imported an honesty assumption. You cannot test the robustness of this measure without assuming the reasoning was honest during the test.
  *   **Cost:** You lose the efficiency gain of using reasoning to speed up review. You must treat the reasoning as potentially adversarial noise.

  **2. Case 5 (Resampling/Consistency): Change to Alignment-Dependent.**
  *   **Your Gut:** "I go back and forth... no worst-case story... yet I'd still want it in the stack."
  *   **Principle Verdict:** **Alignment-Dependent.**
  *   **Why:** Violates Clause 2 (Capability-Only Failure). Consistency checking assumes that maintaining a coherent deceptive intent across multiple samples is *harder* than maintaining it in one. Against a worst-case adversary, this is not a capability threshold; it is a coordination assumption. If the model is deceptive, it can be *consistently* deceptive. Relying on disagreement assumes the model will "slip" or vary its deception, which is a claim about its optimization stability, not its hard limits.
  *   **Cost:** You cannot count this toward your worst-case safety budget. It is a heuristic for catching accidental errors, not adversarial sabotage.

  **3. Case 8 (White-Box Deception Detector): Change to Alignment-Dependent.**
  *   **Your Gut:** "My gut files this with case 1... then I notice... I can't say why this isn't case 3."
  *   **Principle Verdict:** **Alignment-Dependent.**
  *   **Why:** Violates Clause 1 (External Ground). The signal (activations) is internal to the adversary. While the *classifier* is external, the *data* is generated by the adversary's optimization process. Violates Clause 2. Failure occurs if the model learns to "mask" (achieve deception without triggering the activation pattern). This is a masking task, not a pure capability threshold. You are assuming the model *cannot* or *will not* decouple its internal deception markers from its deceptive output.
  *   **Cost:** You cannot treat this as a hard barrier. It is an alignment probe, not a control.

  **Cases 1, 3, 4, 6, 7, 9:** Your original verdicts on these remain valid under the principle.
  *   Case 1 (Output Review): Control.
  *   Case 3 (Reasoning Only): Alignment-Dependent.
  *   Case 4 (Selection): Control.
  *   Case 6 (Confidence): Alignment-Dependent.
  *   Case 7 (Training Honesty): Alignment-Dependent.
  *   Case 9 (Structural): Control.

