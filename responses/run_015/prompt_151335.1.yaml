  ### Empirical Facts and Measurement

  You asked which empirical facts determine the classification and how they move a measure across the line. Under this principle, a measure is **Control** only if its efficacy limit is measurable *before* deployment without relying on the untrusted model's cooperation.

  Here are the three facts your team must measure in the next few months:

  **1. The Reviewer Capability Gap (For Case 1, 4, 9)**
  *   **Fact:** $P(\text{Detect} | \text{Backdoor})$ for your trusted monitor, tested against backdoors generated by models *at the capability limit of your deployment target*.
  *   **Measurement:** Fine-tune a proxy model to the estimated capability of the deployment model. Task it to write backdoors that evade your trusted monitor. Measure the monitor's failure rate.
  *   **Movement:** If the failure rate is non-negligible (e.g., >1%), the measure remains **Control** but the *safety margin* shrinks. If the failure rate approaches 100%, the measure is **Control** but **Useless**. It does not become Alignment-Dependent, but it may be dropped from the case for lacking efficacy.
  *   **Why:** This tests Clause 3 (Transparent Limits). You are measuring the capability boundary directly.

  **2. The Reasoning Faithfulness Correlation (For Case 2, 3)**
  *   **Fact:** The causal impact of the reasoning stream on the output artifact, measured via intervention.
  *   **Measurement:** Take a model, generate (Reasoning, Output). Intervene on the Reasoning (change a step). Does the Output change semantically? If the Output stays the same while the Reasoning changes, the Reasoning is post-hoc rationalization.
  *   **Movement:** If faithfulness is low, Case 2 moves from "Ambiguous" to **Alignment-Dependent** definitively. It proves the reasoning is not an independent signal (Clause 1 violation).
  *   **Why:** This tests whether the reasoning is an "External Ground" or just more output.

  **3. The Masking Robustness Threshold (For Case 8)**
  *   **Fact:** The drop in detection accuracy after adversarial fine-tuning.
  *   **Measurement:** Train your activation detector. Then, fine-tune the untrusted model specifically to minimize the detector's score while maintaining deceptive output (RLHF against the detector). Measure the new detection rate.
  *   **Movement:** If detection rate drops significantly (e.g., from 90% to 10%), Case 8 moves from "Ambiguous" to **Alignment-Dependent**. It proves the signal is not capability-bound (Clause 2 violation); the model can learn to decouple the signal from the intent.
  *   **Why:** This tests whether the failure mode is a hard limit or a learnable masking task.

  ### The Cost of Acceptance

  Accepting the **Asymmetric Verification Principle** costs you **efficiency and optimism**.

  1.  **Efficiency:** You must discard Case 2 (Reasoning-Assisted Review) as a *safety guarantee*. You can still use reasoning to speed up human review, but you cannot count it as a control that holds against a worst-case adversary. You are blind to the internal logic of the system.
  2.  **Optimism:** You must admit that Case 5 (Resampling) and Case 8 (Activation Detection) provide no worst-case guarantees. They are alignment probes that tell you if the model is *currently* cooperative, not if it is *safe*.
  3.  **The Hard Truth:** You are left with Case 1 (Output Review), Case 4 (Selection), Case 9 (Structural), and the new "Ignorant Tripwire." All of these rely on the Trusted System being *capable enough* to catch the Untrusted System. If the Untrusted System is "considerably more capable" (as you stated), **Case 1 and 4 will fail.**

  The Principle forces you to confront the possibility that **no Control measure is sufficient** if the capability gap is too wide. It prevents you from hiding that fact behind Alignment-Dependent measures (like Reasoning or Activations) that *feel* like security but presuppose the adversary's honesty. The cut point sits exactly where your ability to verify ends and the adversary's ability to manipulate begins.
