  The wooden bucket sits upon the stand,
  Inside the quiet level of the water.
  No tension yet within the hanging rope,
  No sense of motion in the empty void,
  The ceiling hides the fixed and distant stars,
  And nothing hints at any coming curve.

  We twist the cord, expecting soon a curve,
  But still the surface mirrors back the bucket.
  It does not know the turning of the stars,
  The friction fails to drag the resting water.
  It slips within the skin of empty void,
  Until the torque transmits along the rope.

  The twist resolves, static now, the rope,
  And now the surface shows a distinct curve.
  It climbs the walls, escaping central void,
  At rest within the spinning deep bucket,
  Yet rising high, the heavy depth of water,
  Though Newton says it answers to the stars.

  Not merely relative to distant stars,
  Nor tension measured only in the rope,
  The force arises from the state of water,
  Revealing space itself by just this curve.
  The stage exists beyond the wooden bucket,
  A true and rigid immovable void.

  But strip away the walls of empty void,
  Leave out the mass and light of distant stars,
  Imagine spinning only this one bucket,
  No tug would tighten up the twisted rope,
  And never would the surface show a curve,
  Then flat remains the surface of the water.

  So still we watch the surface of the water,
  To see if space is substance or just void.
  The evidence is only in the curve,
  Which points to space or else to distant stars,
  While tension holds it firmly by the rope,
  The question hangs above the spinning bucket.

  The bucket holds the mystery of water,
  Suspended by a rope in empty void,
  Between the stars and this concave curve.
