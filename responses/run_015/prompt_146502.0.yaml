  I am preparing a term-paper proposal for my philosophy-of-logic course on Skolem's paradox, but I want to avoid the well-worn debate about whether first-order set theory fixes the size of its models. Instead, I propose to ask whether the paradox can be reconstructed for a modal-realist ontology—possible worlds and individuals—when it is formalized in a first-order framework that includes both internal quantification over worlds and an external model-theoretic relation. Specifically: if such a formalization has a countable model, does that undermine the claim that the ontology genuinely contains uncountably many worlds, and does this collapse into the standard set-theoretic version or reveal a distinct kind of referential indeterminacy?

