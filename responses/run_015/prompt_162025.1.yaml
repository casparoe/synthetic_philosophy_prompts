answer: |-
  ### The Survival Instrument

  **Instructions:** For each scenario, assume the technology works exactly as described. Choose the option that best matches your intuition about whether *you* survive.

  **Q1 (Gradual Silicon)**
  Your neurons are replaced one by one with functionally identical silicon units. By the end, 100% is silicon. Behaviour and reported experience remain unchanged throughout. Do you survive as the silicon system?
  A) Yes, I survive.
  B) No, I die during the process.
  C) There is no fact of the matter.

  **Q2 (Instant Swap)**
  You are anaesthetised. Your brain is scanned and replaced instantly with a silicon duplicate matching your exact state at that moment. You wake up behaving normally. Do you survive?
  A) Yes, I survive.
  B) No, I die; the waker is a copy.
  C) There is no fact of the matter.

  **Q3 (Fading Qualia)**
  During a gradual swap, behaviour and verbal reports stay perfect. However, suppose inner experience quietly dims and goes out. Is this scenario possible?
  A) Yes, consciousness could fade while behaviour remains normal.
  B) No, if behaviour is normal, experience must be normal.
  C) The idea of silent dimming is incoherent.

  **Q4 (Holistic Substitution)**
  Substitutes reproduce the input-output function of the replaced population only at the level of the whole network. Swapping any single unit in isolation would not look behaviourally identical. Do you survive?
  A) Yes, the network function is what matters.
  B) No, the local causal powers are broken.
  C) There is no fact of the matter.

  **Q5 (Time-Dilation)**
  Substitutes run on a different internal timescale, predicting ahead to keep timing at the interfaces right. Abstract causal structure is preserved, but fine-grained real-time dynamics are not. Do you survive?
  A) Yes, abstract structure is sufficient.
  B) No, real-time dynamics are essential.
  C) There is no fact of the matter.

  **Q6 (Reversion)**
  Replacement reaches 60%. Then the silicon units are removed and replaced with biological units cultured from your own cells. The system returns to 100% biological. Do you survive the whole sequence?
  A) Yes, I am the same person throughout.
  B) No, the 60% point killed me; the restorer is a clone.
  C) There is no fact of the matter.

  **Q7 (Fission)**
  The gradual sequence reaches a point at which the system is copied and both copies then continue being gradually replaced. Which one is you?
  A) The original continuous stream.
  B) Both are equally me.
  C) Neither; identity does not survive branching.

  **Q8 (Reassembly)**
  After a 100% instant swap (like Q2), the original biological neurons are collected and reassembled into a brain elsewhere. Who is you?
  A) The silicon duplicate.
  B) The reassembled biological original.
  C) Neither/Both.

  ***

  ### Scoring Key & Profile Construction

  Do not sum the scores. Instead, map the answers to four dimensions. This reveals the *structure* of their commitment rather than forcing a label.

  **Dimension 1: Substrate Neutrality (Function vs. Stuff)**
  *   *High:* Q1(A), Q2(A), Q4(A).
  *   *Low:* Q1(B), Q2(B), Q4(B).
  *   *Interpretation:* High scorers treat the mind as software; Low scorers treat it as hardware-dependent.

  **Dimension 2: Continuity Requirement (Process vs. State)**
  *   *High:* Q1(A) AND Q2(B).
  *   *Low:* Q1(A) AND Q2(A).
  *   *Interpretation:* High scorers require an unbroken chain of existence (Psychological Continuity). Low scorers accept teleportation-style survival (Patternism).

  **Dimension 3: Realisation Specificity (Abstract vs. Embodied/Temporal)**
  *   *High:* Q5(B) OR Q4(B).
  *   *Low:* Q5(A) AND Q4(A).
  *   *Interpretation:* High scorers care *how* the function is computed (time, locality). Low scorers care only *that* it is computed (Computationalism).

  **Dimension 4: Uniqueness (One vs. Many)**
  *   *High:* Q7(A) or Q7(C).
  *   *Low:* Q7(B).
  *   *Interpretation:* High scorers hold a 'No-Branching' clause (identity is unique). Low scorers accept identity can divide.

  ***

  ### Logical Space Analysis

  **Locating the Positions**
  *   **Psychological Continuity:** High Continuity, High Substrate, High Uniqueness. (Yes Q1, No Q2, No Q7-Both).
  *   **Pattern/Functionalist:** Low Continuity, High Substrate, Low Realisation Specificity. (Yes Q1, Yes Q2, Yes Q5).
  *   **Animalist/Organism:** Low Substrate (Q1-No), Low Reversion (Q6-B). They view the organism as the fundamental unit.
  *   **Embodied/Enactive:** High Realisation Specificity (No Q5, No Q4). They deny substrate-neutral survival if the temporal/embedded coupling is broken.
  *   **Vagueness/No-Fact:** High 'C' responses on Q1, Q2, Q6. They reject the binary of survival/death in borderline cases.
  *   **Deflationary/No-Self:** Q7(C) combined with 'C' on Q1/Q2. They deny there is a 'you' to survive.

  **Empty or Incoherent Combinations**
  *   **Yes Instant (Q2) / No Gradual (Q1):** *The "Break" Preference.* Extremely rare. It implies a discontinuous jump is safer than a slow drift. Usually indicates a misunderstanding of the cases.
  *   **Yes Fission-Both (Q7) + High Uniqueness:** Logically inconsistent. If identity must be unique, it cannot be shared by two simultaneous beings.
  *   **Yes Reversion (Q6) / No Gradual (Q1):** *The "Magic Biological" View.* Implies biology has a restorative power that continuity lacks. Attractive to some Animalists, but rare among functionalists.

  **Limitations of the Instrument**
  *   **Vagueness vs. Deflationism:** A respondent answering 'C' (No fact) might be a metaphysical vagueness theorist *or* a Buddhist no-self theorist. The instrument cannot separate these without follow-up.
  *   **Animalism vs. Biological Functionalism:** If the biological functions are preserved in the swap, an Animalist and a Biologist Functionalist might answer identically. This instrument assumes silicon breaks biology; it doesn't test if *functioning* biology in silicon survives.

  ***

  ### Analysis of the "Gradual Yes / Instant No" Hunch

  You suspect respondents will answer **Yes to Q1** (Gradual) and **No to Q2** (Instant). This is the standard "Continuity" intuition. Here is how to test its stability using the other questions.

  **1. The Breakers (Q4 and Q5)**
  This is where the hunch usually collapses.
  *   **Q5 (Time-Dilation):** If they say **Yes to Q1** but **No to Q5**, they do not hold a pure Functionalist view. They believe survival requires *real-time* causal dynamics, not just abstract structure. This undermines the "mind is software" intuition that usually supports Q1.
  *   **Q4 (Holistic):** If they say **Yes to Q1** (unit swap) but **No to Q4** (network swap), they believe in *local* realizability. They think the causal power must reside in the specific unit, not just the network topology. This is a subtle form of substrate chauvinism that often contradicts the Q1 'Yes'.

  **2. The Confirmers (Q3 and Q6)**
  *   **Q3 (Fading Qualia):** If they say **Yes to Q1** and **No to Q3-A** (deny fading is possible), they are consistent Functionalists. If they say **Yes to Q1** and **Yes to Q3-A** (fading is possible), they are "Liberal Functionalists" who accept the possibility of zombies during the swap.
  *   **Q6 (Reversion):** If they say **Yes to Q1** and **Yes to Q6**, they view the 60% swap as a non-fatal medical procedure. If they say **Yes to Q1** but **No to Q6**, they view the *reversion* as the killing act (perhaps because the new cells are 'clones'). This is a rare but telling inconsistency.

  **3. Handling Non-Matching Answer Sheets**
  You will get respondents who do not fit a clean leaf (e.g., Yes Q1, No Q2, Yes Q5, No Q7).
  *   **Do not force a label.** These respondents likely hold a **Hybrid View** (e.g., "Continuity matters, but only if the timing is real-time").
  *   **Flag the 'C' Cluster.** If a respondent chooses 'C' (No fact) on Q1, Q2, and Q6, they are likely a **Vagueness Theorist**. Treat this as a valid position, not a failure to answer.
  *   **Watch for Q2-Yes / Q1-No.** If you find these, discard them as data errors unless the respondent provides a written justification. It is philosophically tenable but psychologically unstable for non-philosophers.

  **Recommendation:**
  When analysing the pre/post data, look specifically at the **Q1/Q5 correlation**.
  *   **Pre-Session:** Expect High Q1 / Low Q5 (Yes Gradual, No Time-Dilation). This shows an intuitive commitment to *biological time*.
  *   **Post-Session:** If the session is effective, you may see a shift to High Q1 / High Q5 (accepting time-dilation). If they remain Low Q5, the session failed to convince them that *abstract causal structure* is sufficient for survival, regardless of their acceptance of gradual replacement.
