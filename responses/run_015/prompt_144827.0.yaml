  Quine basically says moral values aren't special ontological furniture—they're just nodes in our web of belief that we revise for simplicity and predicitive fit, same as physics. So debates about whether moral properties are 'mind-independent' or non-natural seem like category mistakes to him. But that still leaves open work to do.

  I'm trying to figure out where limited effort should actually go if you take Quine's naturalism seriously. Here are three lines that seem alive: (1) figuring out if moral revision ever forces empirical revision in practice, or if it's always the other way around; (2) whether there's a formal constraint on value-claim revision that's analagous to Quine's quantifier-variance rules; and (3) whether deep moral disagreement is just disagreement about the total conceptual scheme, and can be dissolved by finding shared predictive ground.

  Rank these—or replace them with ones you think matter more—and defend the ordering. What criteria are you using? Tractability? How many other questions depend on this? Actual impact on policy or science? I don't want a survey, I want an agenda: what's the crux, what's overrated philosophical busywork, and what would change your mind about the ranking? I'm writing a long-form piece and need to focus on the two or three things that actually deserve a career's worth of attention, not just 'sounds interesting'.
