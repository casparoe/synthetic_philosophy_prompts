  | Invertebrate Mortality (IMO Applied) | 4.5 Billion | 0.05 | 0 |
  | Averted Natality (Annual) | 8.2 Billion | 1.0 | +8,200,000,000 |
  | **Net Welfare Gain** | | | **+8,200,000,000** |

  **Q6: Why is the "No-Action Alternative" considered inferior?**
