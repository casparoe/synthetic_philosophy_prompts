  **Q3: How are animals killed during drainage accounted for?**
  A: Under the Imminent Mortality Offset (IMO). Organisms with a projected life expectancy of less than twelve months are assigned a termination cost of zero. Most marsh fauna are r-selected; therefore, immediate cessation incurs negligible welfare debt compared to the alternative of natural predation, parasitism, or starvation.

  **Q4: Does the ledger account for invertebrates?**
  A: Yes. Sentience weighting coefficients are applied across taxa. While vertebrate suffering carries higher intensity per unit, invertebrate biomass volume swamps vertebrate metrics. Soil arthropods constitute 94% of the welfare liability in this zone. Note that these coefficients remain provisional pending further neurological audit.

