  - "price_of_rejection" (string): one or two sentences on what is lost, or what one is committed to, by giving up that step.
  - "alternative_cut" (string): if one refuses to reject the step you named, the next-best premise to cut instead, and what that costs.
  - "verdict" (string): a single sentence stating the bottom line.
