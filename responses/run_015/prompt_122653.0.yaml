answer: |-
  This is a sophisticated set of intuitions. You are rejecting pure Utilitarianism (which would allow the volunteer and pre-crime detention if the math worked) and pure Retributivism (which would demand punishing the truck guy and the lottery guy equally, regardless of current suffering).

  You seem to be operating on a hybrid view: Punishment is a **moral communication** directed at a specific agent, but it is bounded by **humanitarian constraints** on total suffering and **structural rules** on who counts as part of that agent.

  Here is a precise formulation of the principle your gut appears to be running on, followed by the analysis you requested.

  ### The Principle: Non-Fungible Censure with Structural Liability

  **Punishment is the state's imposition of hard treatment to censure a specific moral agent for a voluntary wrongful act. It is governed by three constraints:**

  1.  **The Identity Constraint:** The censure must attach to the specific agent who committed the act. It cannot be transferred to another agent, even with consent, because the moral message loses its meaning if directed at the wrong person.
  2.  **The Structural Liability Exception:** Incidental costs may fall on innocents *only* if they voluntarily entered a legal or financial structure where absorbing such loss is a defined condition of participation (e.g., shareholders). Costs may not fall on those tied by biological or social dependency (e.g., family), as they did not assume this risk.
  3.  **The Sufficiency Cap:** Punishment is rendered impermissible if the offender has already incurred suffering (via fate or circumstance) that meets the proportional "debt" of the crime, provided the offender retains sufficient psychological continuity to recognize the connection.

  ---

  ### How This Principle Explains Your Cases

  *   **Pre-crime (95% sure):** Violates the **Act Requirement** (implicit in "voluntary wrongful act"). No act has occurred, only risk.
  *   **Attempted Murder (gun jammed):** Fits. The agent made the choice and acted. The **Identity Constraint** is met. It is "less" than success because the **Sufficiency Cap** weighs the actual harm done as part of the proportional debt.
  *   **Shareholders vs. Family:** This is the crux.
      *   *Shareholders:* Fit the **Structural Liability Exception**. By buying stock, they voluntarily enter a structure where they absorb losses (including fines) in exchange for profit. They are legally part of the "offending entity."
      *   *Family:* Violate the **Structural Liability Exception**. Family ties are not contractual risk-assumptions. Cutting benefits punishes dependents who did not choose the risk.
  *   **Volunteer Substitute:** Violates the **Identity Constraint**. Punishment is not just "pain distribution"; it is a moral dialogue between the state and the *guilty agent*. Swapping the agent turns punishment into a commodity, voiding the censure.
  *   **Truck Guy (Lost everything/memory):** Fits the **Sufficiency Cap**. Fate has already exacted the toll. *Caveat:* The memory loss tests the "psychological continuity" clause (see Soldier case below).
  *   **Lottery Guy:** Fits. The **Sufficiency Cap** is not met. Wealth is not suffering. The moral debt remains.
  *   **Civil Disobedience:** Fits. The **Act Requirement** is met (they broke the law). However, the "moral wrongness" is contested, making the censure feel conflicted. The principle allows punishment (rule of law) but acknowledges the moral friction.

  ---

  ### Predictions on New Cases

  **1. Punishing the Executives Personally (in the fraud case)**
  *   **Prediction:** **Required, not just optional.**
  *   **Reasoning:** While shareholders absorb financial loss (Structural Liability), the **Identity Constraint** demands the *moral agents* who made the decision be censured. If you only fine the corporation, the specific humans who willed the fraud escape the censure. Your principle demands piercing the corporate veil to find the moral actor.

  **2. Punishing Something That Was Legal When Done (Retroactive Law)**
  *   **Prediction:** **Not OK.**
  *   **Reasoning:** Violates the **Act Requirement** ("voluntary wrongful act"). At the time of the act, it was not wrongful. You cannot censure an agent for a choice that was permissible when made. This aligns with the Pre-crime intuition (no guilt without prior rule).

  **3. Punishing a System That Isn't a Person (e.g., "The Algorithm" or "The Market")**
  *   **Prediction:** **Not OK (Category Error).**
  *   **Reasoning:** Violates the **Identity Constraint**. A system cannot receive moral censure. You must punish the designers, maintainers, or users who voluntarily deployed the system. Punishing the "system" is a way of punishing no one, which violates the purpose of censure.

  ---

  ### The Cost: Which Verdicts Must You Give Up?

  To hold this principle consistently, you may need to adjust two intuitions:

  **1. The "Volunteer is Worse" Intensity**
  *   **Your View:** Volunteer substitution is *worse* than punishing the guilty guy.
  *   **Principle View:** It is *equally* impermissible as punishing the family. It's a nullity.
  *   **Adjustment:** You might need to accept that it's not "worse," just "wrong." Calling it "worse" implies a utilitarian calculation (more pain for no gain). The principle says it's a category error. It's not punishment at all; it's a performance.

  **2. The Truck Guy's Memory Loss**
  *   **Your View:** Let him go because it's pointless.
  *   **Principle View:** The **Sufficiency Cap** says "suffering incurred." But the **Identity Constraint** requires a "moral agent." If he has "nearly no memory," is he the same agent?
  *   **Adjustment:** If you let him go *solely* because he suffered, that fits. If you let him go because he's a "different person," you are prioritizing Psychological Continuity over Moral Debt. You must decide: Is punishment about balancing the scales (suffering) or correcting the agent (identity)? Your intuition on the Truck Guy suggests **Suffering** wins. Your intuition on the Volunteer suggests **Identity** wins. You can keep both, but you must admit they are in tension.

  ---

  ### The Flip-Flop Case: The Soldier/Massacre/20 Years Later

  **Case:** A soldier participates in a massacre. 20 years later, he is a different person, thriving, with no memory of the act.

  **Application of the Principle:**

  1.  **Identity Constraint:** This is the breaker. 20 years later, with "no memory" and being a "completely different person," psychological continuity is severed. If punishment is *censure of an agent*, there is no agent present to censure. The body is the same, but the moral self is not.
  2.  **Sufficiency Cap:** He is "thriving." He has not suffered. So the Cap does not block punishment *unless* the passage of time itself counts as "living with the potential guilt" (which you said he doesn't remember, so it doesn't).
  3.  **Structural Liability:** N/A.

  **The Verdict:** **Do Not Punish.**

  **Why?**
  Your principle prioritizes the **Identity Constraint**. Punishment is a moral dialogue. You cannot have a dialogue with someone who does not remember the conversation started. To punish him would be to punish a stranger for the deeds of an ancestor who happened to inhabit the same body.

  **The Conflict:**
  This contradicts the **Lottery Guy**. The Lottery Guy is punished despite being "different" (thriving vs. guilty). But the difference is *moral continuity*. The Lottery guy remembers the crime; he just got rich. The Soldier forgets the crime; he got a new life.

  **Honest Account:**
  If you punish the Soldier, you are admitting that **Biology trumps Psychology**. You are saying the *body* owes the debt, not the *mind*.
  If you spare the Soldier, you are admitting that **Psychological Continuity trumps Biology**. You are saying punishment requires a connected self.

  Given your verdict on the **Volunteer** (Identity matters more than pain distribution) and the **Truck Guy** (Suffering/State matters more than strict retribution), your gut leans toward **Psychological Continuity**.

  **Final Prediction:** Your principle dictates you **cannot punish the soldier**. To do so would violate the Identity Constraint just as severely as punishing the volunteer. It would be punishing Person B for Person A's crime, merely because they share a skull. The fact that he is thriving is irrelevant if the "He" that is thriving is not the "He" that killed.

  **One final check:** Does this let war criminals off too easily?
  The principle says: *If* there is no memory and *if* they are a different person. In reality, most war criminals remember. This principle only protects the rare case of genuine psychological rupture (amnesia + personality change). It does not protect the guy who just "moved on." It protects the guy who literally isn't there anymore.
