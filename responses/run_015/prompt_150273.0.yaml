      *   *Check:* Is the "Institutions" argument valid? *Correction:* Yes, historically true. Institutions *do* absorb tech. But if the tech moves faster than institutional update cycles (which is true now), the argument weakens.
      *   *Check:* The User's "Judgment" point. *Correction:* Validate this strongly. It's the philosophical crux. Epistemic authority vs. Epistemic generation.

  9.  **Final Polish:**
      *   Ensure the distinction between "ontological risk" (what is real) and "sociological risk" (how we organize) is clear.
      *   Make sure the alternative advice for the character is actionable for a novelist (dialogue/narrative beat).

  10. **Final Review against constraints:**
