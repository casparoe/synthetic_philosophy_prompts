answer: |-
  ### Desiderata for an Adequate Model of Long-Term Civilisational Change

  To adjudicate between cyclical and linear macro-history, one must first establish the boundary conditions of the inquiry. A model of civilisational change is not merely a narrative; it is a theoretical framework claiming explanatory power over deep time. Below are the specifications such a model must satisfy, categorized by phenomenal accommodation, conceptual distinction, and logical bounds.

  ---

  #### I. Phenomenal Accommodation
  *What the model must explain.*

  **1. The Dual-Process Constraint (Irreversibility vs. Reversibility)**
  *   **Specification:** The model must account for variables that accumulate irreversibly (e.g., energy capture, technological complexity, demographic ceilings) alongside variables that oscillate or revert (e.g., regime type, social cohesion, inequality).
  *   **Motivating Case:** The Roman Empire possessed lower technological capacity than 19th-century Britain but exhibited similar political decay patterns. A purely linear model cannot explain the collapse of high-complexity states; a purely cyclical model cannot explain why Rome never developed industrialism.
  *   **Status:** **Non-negotiable.**

  **2. The Stagnation/Interregnum Puzzle**
  *   **Specification:** The model must accommodate extended periods of equilibrium ("silent interregna") where societies exhibit neither dynamic progression nor dramatic cyclical turnover, but rather homeostatic stability.
  *   **Motivating Case:** Edo Japan (250 years of isolation/stability), Byzantium (middle period), or Ancient Egypt's Old Kingdom. Models predicated on constant struggle or inevitable progress treat these as anomalies rather than stable states.
  *   **Status:** **Non-negotiable.**

  **3. The Skipping/Convergence Problem**
  *   **Specification:** The model must explain why some societies appear to skip predicted developmental stages (e.g., nomadic groups establishing empire without sedentary agriculture) or why distinct lineages converge on similar institutional forms without contact.
  *   **Motivating Case:** The Mongol Empire bypassed sedentary state-building stages yet administered complex bureaucracies; the independent invention of the state in Mesoamerica and Mesopotamia.
  *   **Status:** **Non-negotiable.**

  **4. Exogenous Shock Integration**
  *   **Specification:** The model must distinguish between endogenous decay/growth and exogenous disruption (climate shifts, pandemics, asteroid impacts) without allowing exogenous factors to become a "god of the gaps" excuse for model failure.
  *   **Motivating Case:** The Late Bronze Age Collapse (systemic) vs. the Justinian Plague (exogenous shock).
  *   **Status:** **Non-negotiable.**

  ---

  #### II. Conceptual Distinctions
  *What the model must not collapse.*

  **5. Morphological Resemblance vs. Causal Continuity**
  *   **Specification:** The model must distinguish between two societies *looking* alike (isomorphism) and them being alike due to the *same underlying mechanism*.
  *   **Motivating Case:** Comparing the modern US to Rome based on luxury/decay is morphological. Unless the causal mechanism (e.g., lead poisoning vs. opioid crisis; slave labor vs. automation) is specified, the comparison is astrological, not sociological.
  *   **Status:** **Non-negotiable.**

  **6. Retrospective Narrative Fit vs. Predictive Constraint**
  *   **Specification:** The model must be falsifiable. It must specify conditions under which its predicted trajectory would *not* occur. It cannot rely on post-hoc rationalization where every outcome is interpreted as confirmation.
  *   **Motivating Case:** Toynbee's "Challenge and Response" can explain both success (response met) and failure (response failed) after the fact, rendering it unfalsifiable.
  *   **Status:** **Non-negotiable.**

  **7. Unit of Analysis Consistency**
  *   **Specification:** The model must define its "civilisation" or "unit" rigorously and maintain that definition across time. It cannot shift from "political regime" to "cultural sphere" to "species" to suit the argument.
  *   **Motivating Case:** Spengler treats "Culture" as a biological organism, but the boundaries of these organisms are defined by the theorist, not by empirical data, leading to arbitrary periodization.
  *   **Status:** **Non-negotiable.**

  ---

  #### III. Logical and Empirical Bounds
  *The constraints on the model's structure.*

  **8. The Agency-Structure Boundary**
  *   **Specification:** The model must specify the limit of human agency. It must state whether "Great Men" can alter the trajectory or if they are merely epiphenomena of deeper forces.
  *   **Motivating Case:** Would the Cold War have ended differently without Gorbachev? A hard structuralist model says no; a voluntarist model says yes. An adequate model must define the probability space of contingency.
  *   **Status:** **Camp-specific Preference** (Determinist vs. Voluntarist), but *specifying the boundary* is Non-negotiable.

  **9. Normative Teleology**
  *   **Specification:** The model must declare whether history has a moral direction (Progress/Decline) or is normatively neutral.
  *   **Motivating Case:** Enlightenment liberalism assumes movement toward freedom; Traditionalism assumes movement toward disorder. Empirical data shows fluctuations in both.
  *   **Status:** **Camp-specific Preference.** (However, claiming empirical neutrality while smuggling in teleology is a failure of Requirement #6).

  ---

  #### IV. Incompatibility Clusters (Jointly Unsatisfiable Subsets)
  *No model can maximize all virtues simultaneously. The following clusters represent trade-offs.*

  **Cluster A: The Precision-Stability Trade-off**
  *   **Subset:** {High Predictive Precision, High Sensitivity to Contingency}.
  *   **Conflict:** You cannot claim to predict specific phase transitions (e.g., "Revolution in Year X") while simultaneously acknowledging that singular contingent events (assassinations, weather) alter outcomes.
  *   **Resolution:** Adequate models must sacrifice precision for robustness (predicting probabilities of instability, not specific events).

  **Cluster B: The Universality-Particularity Trade-off**
  *   **Subset:** {Universal Laws of History, Respect for Cultural Incommensurability}.
  *   **Conflict:** If all civilizations follow the same linear stages (Marx) or cyclical seasons (Spengler), you deny deep cultural particularity. If every culture is unique, no macro-history is possible.
  *   **Resolution:** Models must identify *trans-cultural mechanisms* (e.g., energy capture, elite cohesion) without enforcing *morphological uniformity*.

  **Cluster C: The Mechanism-Scope Trade-off**
  *   **Subset:** {Detailed Causal Mechanism, Global/Deep-Time Scope}.
  *   **Conflict:** The deeper the time scale and wider the geographic scope, the harder it is to maintain rigorous causal mechanisms (data loss, translation issues).
  *   **Resolution:** Models must acknowledge increasing uncertainty bounds as temporal depth increases.

  ---

  #### V. Classification of Requirements

  | Requirement | Classification | Rationale |
  | :--- | :--- | :--- |
  | **Dual-Process Constraint** | Non-negotiable | Empirical reality contains both tech accumulation and political collapse. |
  | **Stagnation Puzzle** | Non-negotiable | Equilibrium is a common historical state; ignoring it biases the model. |
  | **Morphology vs. Causality** | Non-negotiable | Collapsing these turns sociology into poetry. |
  | **Falsifiability** | Non-negotiable | Without this, the model is theology, not science. |
  | **Unit Consistency** | Non-negotiable | Shifting definitions invalidate longitudinal comparison. |
  | **Agency-Structure Boundary** | Camp-specific | Determinists and Voluntarists can both be rigorous, provided they state their axiom. |
  | **Normative Teleology** | Camp-specific | One can model "complexity" without modeling "goodness." |
  | **High Predictive Precision** | Camp-specific | Some models aim for warning systems; others for philosophical understanding. |

  ---

  #### VI. Evaluation of Classical Models Against Hard Constraints

  Do these criteria decisively filter existing theories? A brief stress test:

  **1. Polybius (*Anacyclosis*)**
  *   **Success:** Handles **Dual-Process** poorly (ignores tech), but excels at **Morphological/Causal** distinction regarding regime types (monarchy -> tyranny -> aristocracy, etc.).
  *   **Failure:** Fails **Stagnation Puzzle** (assumes constant motion) and **Unit Consistency** (applies specifically to the mixed constitution, not all societies).
  *   **Verdict:** Fails Non-negotiable #1 and #2. Too narrow for general macro-history.

  **2. Ibn Khaldun (*Muqaddimah*)**
  *   **Success:** Excellent on **Causal Continuity** (*asabiyyah* provides a mechanism for rise/fall). Handles **Stagnation** well (dynastic entropy).
  *   **Failure:** Struggles with **Dual-Process** (does not account for irreversible technological shifts outside social cohesion). **Unit Consistency** is limited to nomadic/sedentary dialectic.
  *   **Verdict:** Strong on mechanism, weak on technological linearity. Fails Non-negotiable #1 partially.

  **3. Oswald Spengler (*Decline of the West*)**
  *   **Success:** High **Respect for Particularity** (cultures are distinct).
  *   **Failure:** Catastrophic failure on **Morphology vs. Causality** (treats cultures as biological organisms without mechanism). Fails **Falsifiability** (dates are mystical). Fails **Dual-Process** (ignores tech accumulation across cultures).
  *   **Verdict:** Fails Non-negotiable #3, #5, and #6. Poetic, not analytical.

  **4. Arnold Toynbee (*Study of History*)**
  *   **Success:** Attempts **Universality** and handles **Exogenous Shocks** (Challenge/Response).
  *   **Failure:** Fails **Falsifiability** (Non-negotiable #6). Any outcome can be retrofitted as a successful or failed response. **Unit Consistency** is slippery (what constitutes a "civilisation"?).
  *   **Verdict:** Fails Non-negotiable #6. A taxonomy, not a predictive model.

  **Conclusion on Decisiveness:**
  The desiderata are genuinely decisive. None of the four classical giants satisfy the **Dual-Process Constraint** (accommodating both linear tech and cyclical politics) while maintaining **Falsifiability**. This suggests that the binary of "Cyclical vs. Linear" is itself a false dichotomy; an adequate model must be *multi-scalar*, treating technology as linear-accumulative and institutions as cyclical-entropic, without conflating the two. Any model that does not make this distinction fails the first non-negotiable requirement.
