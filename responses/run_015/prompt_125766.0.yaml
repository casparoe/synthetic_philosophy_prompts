          *   Mark Non-negotiable vs. Camp-specific preferences.
          *   Conclusion: Brief evaluation of Polybius, Ibn Khaldun, Spengler, Toynbee against these constraints.
      *   **Tone:** Rigorous, analytical, philosophical/sociological precision.

  2.  **Initial Brainstorming & Categorization:**
      *   *Macro-history* is fraught with teleology, determinism, and selection bias. A good model needs to avoid these while explaining patterns.
      *   *Linear:* Progress, accumulation, directionality (Enlightenment, Marx, Pinker).
      *   *Cyclical:* Rise/fall, seasons, generations (Polybius, Khaldun, Spengler).
      *   *The Tension:* Technology looks linear; politics/culture looks cyclical. How does a model handle both?
      *   *The "Silent Interregnum":* Periods of stagnation or equilibrium that fit neither rise nor fall nor progress.
      *   *Distinctions:* Just because two things look alike (Rome/US) doesn't mean the *cause* is the same. Just because a story fits the past doesn't mean it predicts the future.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Dual-Process Accommodation.* Must handle both irreversible accumulation (tech/energy) and reversible dynamics (regime type/social cohesion).
          *   *Motivation:* We have smartphones (linear) but democracies still collapse (cyclical).
          *   *Status:* Non-negotiable.

      *   *Requirement 2: The Stagnation Puzzle.* Must explain periods of equilibrium or "silent interregna" where nothing much happens structurally.
          *   *Motivation:* Byzantium, Edo Japan, Egypt's Old Kingdom stability.
          *   *Status:* Non-negotiable.

      *   *Requirement 3: Causal Mechanism vs. Morphological Analogy.* Must distinguish *why* something happens from *what* it looks like.
          *   *Motivation:* Spengler's mistake of treating cultures as biological organisms without mechanism.
          *   *Status:* Non-negotiable.

      *   *Requirement 4: Predictive Constraint vs. Post-hoc Fitting.* Must be falsifiable, not just a story told after the fact.
          *   *Motivation:* Toynbee's challenge-response can explain anything after it happens.
          *   *Status:* Non-negotiable.

      *   *Requirement 5: Agency vs. Structure.* Must account for human choice without collapsing into "Great Man" theory or hard determinism.
          *   *Motivation:* Contingency matters (e.g., Alexander's death), but structures constrain.
          *   *Status:* Camp-specific (Determinists vs. Voluntarists), but a *good* model needs a boundary condition here. Let's make the *specification of the boundary* non-negotiable, even if the position is camp-specific.

      *   *Requirement 6: Scale Invariance/Modularity.* Does the model work for city-states and global empires?
          *   *Motivation:* Polybius worked for Rome/Greece; does it work for the UN?
          *   *Status:* Camp-specific.

      *   *Requirement 7: Exogenous Shocks.* Must accommodate black swans (plagues, climate shifts, asteroid impacts).
          *   *Motivation:* Bronze Age Collapse.
          *   *Status:* Non-negotiable.

  4.  **Identifying Jointly Unsatisfiable Subsets (The "No Free Lunch" Theorem of Macro-history):**
      *   *High Predictive Precision* vs. *High Sensitivity to Contingency*. You can't have a model that predicts specific dates *and* acknowledges that a single assassination changes everything.
      *   *Universal Moral Direction (Teleology)* vs. *Empirical Neutrality*. If you say history moves toward Freedom, you ignore periods where it moved away.
      *   *Strict Periodization* vs. *Continuous Variation.* Stages (Feudal -> Capitalist) often blur in reality.

  5.  **Classifying Non-negotiable vs. Camp-specific:**
      *   *Non-negotiable:* Internal consistency, empirical coverage, causal mechanism, falsifiability.
      *   *Camp-specific:* Teleology (Progress vs. Decay), Unit of Analysis (Nation vs. Civilization vs. Species), Normative Goal (Stability vs. Liberation).

  6.  **Evaluating the Classical Theorists:**
