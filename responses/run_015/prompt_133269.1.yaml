answer: |-
  **The principle**
  An action causing death is permissible if the death is neither your goal nor the chosen method to achieve it, provided you do not worsen the victim's baseline survival odds. You may redirect an existing threat even if a body physically stops it, so long as you do not initiate a new causal chain using that person. This constraint is waived if the victim forfeited rights through aggression, or if the good achieved crosses a catastrophic threshold where numbers override constraints. Consent does not authorize violating these constraints, but objection can reinforce them.

  **Clause by clause**
  "Neither goal nor chosen method" blocks Case 2 (Footbridge). You need the push to stop the train. Drop this, and Footbridge becomes permissible, collapsing the distinction between using and foreseeing.

  "Redirect existing threat... physically stops it" saves Case 3 (Loop). The train is the threat, not the man. His stopping it is physical fact, not your method. Drop this, and Loop becomes impermissible like Footbridge, contradicting your verdict.

  "Baseline survival odds" saves Case 4 (Pre-doomed). You aren't making him worse off than the second trolley would. Drop this, and Case 4 looks like standard killing, losing the intuition that he was already lost.

  "Forfeited rights" saves Case 5 (Guilty Fat Man). He lost protection by aggressing. Drop this, and you cannot explain why pushing him is fine while pushing an innocent is not.

  "Catastrophic threshold" saves Case 8 (1 vs 1M). Small numbers don't override rights; large ones do. Drop this, and you either can never sacrifice one (absolutism) or always can (utilitarianism), missing your middle ground.

  Case 6 (Bombing) relies on "chosen method". If you intend to destroy the plant, deaths are side effects. Drop this nuance, and Case 6 fails the load-bearing test because workers stopping production is causal means. You must distinguish causal necessity from intentional planning.

  **What it can't have**
  Case 6 is the weakest link. If production stops *only* because workers die, claiming their deaths aren't the "method" is semantic sleight of hand. Either admit Case 6 is wrong, or accept that "method" is too fuzzy to do real work. This threatens the whole principle.

  Case 7 (Ventilator Reallocation) is also unstable. Taking a machine from Patient A to save Patient B looks like using A as a means. If you say this is fine, you undermine the constraint against using people. This verdict likely needs to go; it feels utilitarian in a deontological framework.

  Case 8 (1 vs 2) is arbitrary. Why does the threshold sit at a million and not three? The principle posits a threshold but cannot locate it. You must accept that the line is vague, or admit your intuition here is inconsistent.

  Most likely to overturn: Case 6. It strains the "means" distinction beyond breaking point. If the deaths are causally necessary for the goal, they are means, full stop.

  **Cases I didn't give you**
  Child vs Elder: The principle ignores age. Both have equal rights not to be used. Diverting onto either is equally permissible (or impermissible). Age is irrelevant to the constraint unless it affects baseline odds.

  60% Sure: Uncertainty amplifies the risk of violating the constraint. If you might be killing the one for no reason, the baseline test fails. Don't divert unless certainty is high. The constraint demands caution against probabilistic harm.

  Self on Spur: You may sacrifice yourself. The constraint protects others from you, not you from yourself. Diverting onto yourself is permissible, perhaps even obligatory if the threshold is met.

  Surgeon/Organs: Impermissible. This violates the "chosen method" clause directly. You initiate a new causal chain using the healthy patient. Unlike the trolley, you are creating the threat to harvest the benefit. This is the hard limit of the principle. The trolley redirects; the surgeon creates.

  **The two wobblers**
  Consent: If the constraint is about your moral integrity, consent doesn't fix Footbridge. You still become a killer. The principle commits you to saying pushing the willing man is still wrong, though less bad.

  Objection: If the man on the spur objects, he asserts his right not to be harmed. The principle suggests this matters. Redirecting a threat onto someone who accepts it is different than overriding their will. Objection makes Case 1 harder, potentially tipping it to impermissible if rights are absolute.
