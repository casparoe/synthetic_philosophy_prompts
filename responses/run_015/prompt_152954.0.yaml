prompt: |-
  I'm taking a course on social ontology and find the Lewis literature a little dry, but my friend talked me into moderating a podcast interveiw next week with a philosopher who just wrote a book extending David Lewis's account of convention to what she calls distributed micro-norms — like the unwritten rules for correcting strangers in open-source threads, or the etiquette of reblogging without attribution. She insists she's still doing straight Lewisian work, not just evolutionary game theory, but I have a feeling she'll deflect hard questions by saying the digital context is only a fresh application of the same old framework.

  Could you draft seven or eight interview questions that actually press on the content? I want at least one that targets the common-knowledge requirement when participants are anonymous and constantly rotating in and out, one that asks whether the arbitrariness condition collapses when platform architecture forces specific coordination points, and one about what the clause about behavior being regular across the group even means when enforcement is partly handled by bots or algorithms. For each of those, please include the follow-up she's most likely to use — maybe something about scalability or about treating algorithms as part of the agent pool — and then the sharper counter-follow-up that makes the dodge harder. Write the response in American English, and please don't include any requests for bibliographies, citations, or reading lists; I want her to defend the position directly, not name-drop papers.
