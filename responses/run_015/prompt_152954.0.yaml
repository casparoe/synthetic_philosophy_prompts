answer: |-
  Here are eight interview questions designed to press on the philosophical specifics of her project, including the anticipated deflections and sharper counter-follow-ups you requested.

  **1. The Common Knowledge Problem in Anonymous Spaces**
  Lewis's account relies heavily on common knowledge—that everyone knows the regularity exists, and everyone knows that everyone knows. In digital spaces like open-source threads, participants are often anonymous and constantly rotating in and out. How do you generate common knowledge when the population is unstable and users don't know who else is in the group?

  *   **Likely Deflection:** She will probably argue that users don't need to know the *individuals*, only the *system state*. She'll say common knowledge is anchored in the interface visibility, not the user list.
  *   **Counter-Follow-Up:** If the knowledge is anchored in the interface rather than the community, haven't you shifted the locus of the convention from the social group to the platform provider? Does that still count as a social convention, or just a user agreement?

  **2. The Arbitrariness Condition and Platform Architecture**
  A core clause for Lewis is that conventions are arbitrary; there must be another possible regularity that could have solved the coordination problem just as well. But platform architecture often forces specific coordination points—for example, there's only one button to "like" or one way to format a code commit. Where is the arbitrariness when the design forces your hand?

  *   **Likely Deflection:** She'll likely claim that while the button is fixed, the *interpretation* or *usage norm* of the button remains arbitrary. She'll say the architecture sets the game, but the norm is how we play it.
  *   **Counter-Follow-Up:** If the behavior is functionally forced by the interface to maintain compatibility, isn't the regularity just mechanical compliance? If I can't practically coordinate differently, doesn't the arbitrariness condition collapse?

  **3. Regularity and Algorithmic Enforcement**
  Lewis defines conventions by a regularity in behavior maintained by mutual expectations of enforcement. In your examples, enforcement is often partly handled by bots or algorithms that auto-delete or flag content. What does "regularity across the group" even mean when the enforcement isn't responsive to human expectation but to rigid code?

  *   **Likely Deflection:** She will probably treat algorithms as part of the agent pool. She'll argue that bots are just proxies for human admin decisions, so the enforcement is still ultimately human.
  *   **Counter-Follow-Up:** If the enforcement is executed by code that doesn't respond to my expectations in real-time, doesn't the normative force disappear? If I'm stopped by a script rather than a social sanction, isn't that causality rather than convention?

  **4. Lewisian Rationality vs. Evolutionary Stability**
  You insist this is straight Lewisian work, not evolutionary game theory. But Lewis emphasizes rational deliberation about others' expectations, whereas digital norms often stabilize through blind imitation or trial-and-error without full rationality. What specifically makes this account Lewisian rather than just an evolutionary stability model?

  *   **Likely Deflection:** She'll likely say Lewis allows for bounded rationality. She'll argue that you don't need perfect reasoning, just enough preference alignment to sustain the equilibrium.
  *   **Counter-Follow-Up:** If you remove the requirement for explicit reasoning about others' reasoning, haven't you stripped the core of Lewis's account? At what point does "bounded rationality" just become a euphemism for evolutionary habit?

  **5. Salience and Engineered Design**
  Lewis relies on salience to explain how groups pick one equilibrium over another. In digital spaces, salience is often engineered by UI designers using dark patterns or highlight colors. Does engineered salience count as the kind of natural salience Lewis required for a convention to emerge?

  *   **Likely Deflection:** She'll probably argue that salience is salience, regardless of origin. She'll say the psychological effect on the user is the same, so the philosophical mechanism holds.
  *   **Counter-Follow-Up:** If the salience is imposed top-down by a designer rather than emerging from the group's shared context, is it still a convention among peers? Or is it just a coordinated response to manipulation?

  **6. Normative Force and Obligation**
  Conventions typically carry a sense of "ought"—you feel you ought to drive on the right side of the road. Do these micro-norms, like reblogging etiquette, create genuine obligations, or are they just pragmatic suggestions for getting along?

  *   **Likely Deflection:** She will likely argue they create local obligations within that specific community context. She'll say the "ought" is relative to the participation in the space.
  *   **Counter-Follow-Up:** If the obligation vanishes the moment I log off or leave the platform, is it a social norm or just a terms-of-service agreement? Does transient obligation qualify as normativity in the Lewisian sense?

  **7. The Threshold for Conventionhood**
  Lewis focused on large-scale societal conventions like money or language. You're applying this to micro-norms. At what point does a behavior become robust enough to be a convention rather than just a habit? Is there a population threshold?

  *   **Likely Deflection:** She'll likely say structure matters, not population size. She'll argue that if the coordination problem exists, the scale doesn't invalidate the definition.
  *   **Counter-Follow-Up:** If the group is too fluid to sustain the conditional preferences Lewis requires, doesn't the definition break? If I don't care if others conform because I'll never see them again, is it still a convention?

  **8. Fidelity to the Framework**
  Be honest: What specific clause in Lewis's original definition did you have to stretch the most to make this fit digital environments?

  *   **Likely Deflection:** She will likely claim she didn't stretch any clauses, only clarified them. She'll say she's revealing what was implicit in Lewis all along.
  *   **Counter-Follow-Up:** If no stretching was needed, why hasn't this account been standard for the last fifty years? If the framework fits perfectly now, what were previous Lewisians missing about the nature of convention?
