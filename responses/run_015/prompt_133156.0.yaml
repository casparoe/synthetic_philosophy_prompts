  hey — i'm running a 90-min seminar on philosophy of biology / culture, about 14 grad students, next semester. i want a classroom activty (not a lecture) that makes them feel why the darwinian meme theory of culture runs into trouble specifically over the missing genotype/phenotype split and the fact that cultural transmission is reconstructive rather than replicative. i want you to inject the niche idea that 'mutation' in culture isn't random copying error but systematic bias from cognitive attractor landscapes — so selection is acting on reconstructed outputs, not on discrete replicators.

  design a runnable game with roles: some students are 'ancestors' with a seed practice, others are 'vectors' who observe once, others are 'hosts' who reconstruct from partial cues. include rules, materials (paper, index cards), a payoff/scoring scheme that rewards fidelity but hides fitness pressures (ease of recall, impressiveness), a timeline for the 90 minutes, and a debrief that maps specific game moments to (a) replication failure, (b) selection on outputs, (c) collapse of discrete meme ontology.

