answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the privilege of calling [Mentor's Name] my mentor.

  Looking around this room, I see a pretty distinct split. On one side, we have family and friends who know her as a person—the one who remembers birthdays, who burns the toast sometimes, who loves a good road trip. On the other side, we have her former grad students, who know her as the person who could dismantle an argument with a single raised eyebrow.

  But really, both sides know the same thing: [Mentor's Name] knows how to find her way.

  She taught epistemology for thirty years. That's the study of knowledge itself. And there's this classic puzzle in her field, the Meno problem, about the difference between just being right and actually *knowing*. She had a specific way of explaining this to us, and I think it's the only way to properly talk about her career tonight.

  She used to say that having a true belief is like having the right map by accident. You get to your destination, sure. But if the road shifts, or a bridge goes out, you're stuck. You have the answer, but you don't have the understanding.

  Knowledge, she taught us, is having the map plus knowing *why* the landmarks line up. It's understanding the terrain well enough that when the landscape changes, you don't panic. You just reorient and keep moving.

  And that is why I can stand here and say, with total confidence, that [Mentor's Name] didn't just spend thirty years being *right* about philosophy. She *knew* it.

  Because the landscape of academia definitely changed over those three decades. Trends shifted, new theories popped up, old certainties vanished. If she had just been working from luck or rote memorization, she would have been lost years ago. But she wasn't. She navigated those changes because she understood the underlying connections. She knew why the landmarks lined up.

  And honestly, that's the greatest gift she gave to us, her students. She didn't just hand us maps and tell us to memorize the routes. She taught us how to read the terrain. She taught us that being right isn't enough if you don't understand why. There are people in this room who are navigating their own careers, their own lives, using the compass she put in our hands.

  So, as she moves into this next chapter—retirement—I'm not worried about her getting lost. Retirement is a new landscape. The landmarks look different. The routine is gone. But anyone who understands why the landmarks line up doesn't need a fixed path to find their way.

  [Mentor's Name], thank you for teaching us the difference between luck and knowledge. Thank you for showing us how to navigate when the road changes. And thank you for letting us share this table with you tonight.

  To [Mentor's Name]. May you always know the way, even when the map changes. Cheers.
