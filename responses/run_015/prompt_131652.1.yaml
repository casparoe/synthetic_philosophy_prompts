  I planned to pass the first and take second,
  For home lies past the danger of the first.
  The reward waits beyond the second gate,
  While passing both brings only motel sleep.
  I cannot know which exit is the one.

  So logic drew a line through time and space:
  Continue past the shadow of the first,
  Then turn the wheel when next the exit comes.
  A perfect script written upon the road.
  Road cannot know which exit is the one.

  But now the register is wiped so clean,
  My state matches the state of times before.
  The world moved on, but I remain the same,
  As if the ink was wiped right from the map.
  Map cannot know which exit is the one.

  If I continue, I may miss the home,
  If I should stop here, I meet the crash.
  The planning self commanded me to wait,
  The acting self sees only now and here.
  To stop or go, the calculus divides.
