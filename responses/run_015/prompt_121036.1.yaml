answer: |-
  The claim is critically exposed by no-report paradigms demonstrating vivid experience without frontoparietal ignition, forcing a choice between empirical falsification and retreating into an unfalsifiable definition of "broadcast."

  Here is the ranking of what a committed workspace theorist must concede, from fatal to awkward, followed by the prediction landscape and your specific wrinkle.

  **1. The Fatal Bite: No-Report NCCs and Frontal Lesions**
  The hardest hit comes from no-report paradigms (e.g., Frässle et al., Tsuchiya et al.) and patients with frontal damage. If you remove the requirement for verbal report and use indirect measures (like pupil dilation or button presses indicating detection without description) to verify consciousness, you often find correlates of experience confined to posterior sensory cortices without the supposed frontoparietal ignition. A workspace theorist must concede that if these subjects are truly conscious, the identity claim fails because phenomenality exists without global access. To save the theory, they must argue either that these subjects aren't actually conscious (counter-intuitive given the indirect measures) or that some hidden broadcast occurred undetected (ad hoc). Similarly, cases of frontal lobotomy or damage where patients retain reported experience despite compromised executive function bite hard; if the workspace is damaged but the light is on, the workspace isn't the light.

  **2. The Severe Awkwardness: Dreaming and Anesthesia**
  Dreaming presents a structural problem: vivid phenomenal experience occurs during REM sleep when prefrontal connectivity is significantly reduced and metabolic activity in the dorsolateral prefrontal cortex is low. Workspace theorists have to argue that the "workspace" shifts location or operates differently in dreams, which dilutes the specificity of the theory. Likewise, during anesthesia recovery, signs of frontal connectivity often return *before* reported consciousness, or consciousness returns without full frontal integration depending on the agent. These aren't fatal if you can tweak the neural signature, but they force constant recalibration of what counts as "ignition."

  **3. The Mere Bullet-Biting: Overflow and Neglect**
  The overflow argument (Block's iconic memory tasks) is less damaging than often portrayed because the workspace theorist can simply deny the premise: they claim that if you can't report it or use it in a task, it isn't phenomenal consciousness, it's just unconscious sensory memory. This is a philosophical stance, not an empirical refutation. Neglect and extinction are similar; if a patient ignores the left side but shows priming, the workspace theorist says that's unconscious access. If the patient claims they don't see it, the theorist agrees there's no phenomenality. These findings are absorbed by redescription rather than forcing concession.

  **Predictions and Rivals**
  The workspace theory's unique prediction is that frontoparietal ignition is *necessary* for consciousness. Recurrent Processing Theory (RPT) and Integrated Information Theory (IIT) predict it is not; they locate the correlates primarily in posterior sensory loops. This has been tested directly in the no-report paradigms mentioned above. The results are currently mixed but trending toward the rivals: posterior activity often suffices for reported experience when confounds are controlled. Higher-Order Thought (HOT) theories align closer to GWT but require a specific metacognitive representation rather than just broadcast; distinguishing them empirically is difficult but hinges on whether the frontal activity is content-specific (HOT) or content-general broadcast (GWT).

  **Insulation and Falsifiability**
  The insulation is a problem. If "available to consumer systems" is defined functionally as "whatever gets reported," the theory is circular and unfalsifiable: you define consciousness by report, find report, and claim you found the workspace. To be scientific, "broadcast" must be defined neurally (e.g., specific gamma synchrony or P3b waves independent of report). Once defined neurally, the theory becomes falsifiable—and currently, it is taking hits from the no-report data. If theorists slide back to functional definitions when neural data misbehaves, they are protecting the view from falsification at the cost of scientific content.

  **The Dark Dashboard**
  Your "Dark Dashboard" case does not break the inference from report to phenomenality directly, but it destabilizes the calibration of the evidence base. If early sensory areas show signatures typically associated with *unconscious* processing, yet the subject reports full detail and workspace broadcast is measured as intact, you have a dissociation between sensory signature and report.
  *   **If you trust the report:** The subject is conscious. This supports GWT (broadcast is present) against sensory theories like RPT (sensory signature is "unconscious").
  *   **If you distrust the report:** You must assume the subject is confabulating (blindsight-style). If they are confabulating, then report is not a reliable marker for phenomenality.

  This is the real exposure: The entire evidence base for GWT relies on report to identify conscious trials. If report can occur alongside "unconscious" sensory signatures (perhaps driven by top-down workspace fabrication), then previous studies validating GWT might have been measuring confabulation rather than consciousness. It doesn't falsify GWT immediately, but it severs the link between the neural data (sensory signatures) and the behavioral data (report) that theorists use to triangulate the truth. It suggests that "broadcast" might generate report without phenomenality, which would turn the identity claim on its head: access without phenomenality is exactly what GWT says is impossible.
