answer: |-
  ### Essay Question

  **Illusionists argue that phenomenal consciousness is a user-illusion generated by cognitive systems. A critic poses the following dilemma: Either the introspective "seeming" of phenomenality is itself a phenomenal state, in which case illusionism is self-undermining; or the "seeming" is nothing but a functional disposition to judge, in which case illusionism fails to explain why the illusion is so inescapable. Evaluate this dilemma. Can the illusionist escape both horns without conceding the existence of phenomenal properties? (20 Marks)**

  ***

  ### Model Answer

  Illusionism claims that while we believe we have phenomenal properties (inner feels), no such properties exist. The critic's dilemma targets the status of the introspective state that generates this belief. If the state itself has phenomenal character, illusionism is false; if it lacks phenomenal character, it cannot explain the conviction that phenomenality exists.

  To escape the first horn, the illusionist must argue that introspection is a misrepresentational mechanism. Just as a visual system can represent a straight stick as bent without the stick actually being bent, a cognitive system can represent a physical state as phenomenal without it being phenomenal. The "seeming" is not an instance of phenomenality but a false report generated by non-phenomenal processing. This avoids self-undermining because the error occurs at the level of content, not the vehicle. The state represents "phenomenality is present," but the state itself is purely functional.

  To escape the second horn, the illusionist must explain why a purely functional error feels so compelling. The critic argues that without real phenomenality, the illusion lacks force. The illusionist replies that the "force" is itself a functional feature. Cognitive architectures are often encapsulated; higher-order systems cannot access the lower-order processes that generate judgments. If the system is wired to treat certain sensory inputs as intrinsically private and ineffable, it will judge them as phenomenal regardless of their actual nature. The inescapability is due to cognitive impenetrability, not the presence of qualia. We cannot judge otherwise because the module producing the judgment is isolated from corrective information.

  However, the first horn remains the sharper threat. The visual illusion analogy presupposes that there is something it is like to see the bent stick. If the introspective illusion lacks any phenomenal character whatsoever, it is unclear how it differs from a blind disposition. To say a state "seems" phenomenal usually implies a phenomenal seeming. If the illusionist denies this, they risk changing the subject. They are explaining why we *judge* we have feels, but not why those judgments are accompanied by the specific texture of experience that motivates the hard problem in the first place. The second horn is easier to dodge via architectural claims, but the first horn challenges the coherence of non-phenomenal misrepresentation regarding experience itself.

  The verdict of this dilemma hinges on the infallibility of introspection. If introspection is necessarily veridical regarding its own occurrence, the dilemma is fatal: the seeming must be real. If introspection is fallible, the dilemma is defused: the system can be wrong about its own nature. However, this model answer's reasoning is vulnerable where it assumes functional states can ground the "force" of the illusion. If functional roles cannot replicate the motivational weight of phenomenality, the explanation of inescapability fails, leaving illusionism empirically adequate but explanatorily hollow.

  ***

  ### Marking Scheme

  | Point | Criteria (4 Marks Each) | Typical Student Error |
  | :--- | :--- | :--- |
  | **1. Dilemma Statement** | Clearly articulates both horns: (1) Seeming is phenomenal (contradiction) and (2) Seeming is functional (explanatory failure). | Conflates this specific dilemma with the general "Hard Problem" or standard eliminativist objections. |
  | **2. Horn 1 Response** | Explains the illusionist strategy of misrepresentation (false content without real property) using an analogy (e.g., visual illusion). | Claims illusionists deny introspection exists entirely, rather than denying its accuracy. |
  | **3. Horn 2 Response** | Explains how functional architecture (e.g., encapsulation/modularity) accounts for the inescapability of the illusion. | Ignores the "inescapable" clause and only addresses why the judgment occurs, not why it is compelling. |
  | **4. Critical Evaluation** | Weighs the horns against each other, identifying which poses the greater theoretical threat (usually Horn 1). | Treats both horns as equally strong/weak without providing argumentative justification for the weighting. |
  | **5. Closing Conditions** | Identifies the condition for fatal/defused verdict (introspective infallibility) and admits a vulnerability in the reasoning. | Provides a vague conclusion ("it depends") without specifying *what* it depends on or where the argument fails. |
