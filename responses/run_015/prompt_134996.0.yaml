  hey, question about the consent stuff. my school has a rule that a teacher cant date a student, and it also covers former students for like a year after they graduate. the way they explained it in assembly was: even if the student is 18, said yes, and the teacher never grades them or anything, its still not real consent because of the power difference. the bit that weirds me out is that the rule says it doesnt matter who made the first move — the student asking the teacher out is not a defense for the teacher.

  my friend is 18, out of school, and started dating her 24 year old shift supervisor at the coffee shop. nobody threatened her, she could quit if she wanted, and she says she really wanted to. everyone i know has a strong opinion about it and nobody can agree on what the actual problem is even supposed to be, or on why her thing feels different from the teacher thing when both are just "one person has power over the other."

  what id like to know is what that whole "power difference means the yes doesnt count" idea actually presupposes about what makes consent valid. does it have to assume that coercion can happen with no threat at all, just because saying no would cost you something? if so, why isnt dating your bosses kid, or the rich kid at school, the same thing? can one theory cover both my schools rule and the coffee shop case, or are they secretly relying on different ideas? and what would have to be true for the rule to be wrong? also please say how confident you are in what your saying and single out the part your least sure of.
