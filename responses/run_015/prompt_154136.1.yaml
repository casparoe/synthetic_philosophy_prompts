  Hey — I'm a PhD student in programming languages (dependent types, proof extraction, a bit of parametricity, comfortable writing Coq/Agda-style stuff and thinking of proofs as programs), and I've been trying to get a grip on the axiom of choice thing for a philosophy of math reading group I sit in on. It started at a department happy hour where a friend from the analysis side told me something like: you PL people quietly assume choice every time you write down a type whose inhabitants aren't computable. I've been chewing on that ever since and I think she's both right and wrong, but I can't say exactly where.

  What I want is this: take the actual dispute — the people who treat AC as unproblematic, just part of how arbitrary sets behave; the people who want only countable or dependent choice and balk at the full thing; and the people whose real complaint is that AC licenses existence claims where nothing definable or constructible gets produced — and restate all three in my vocabulary. Terms vs. types, Sigma vs. truncated existential, erasure and extraction, oracles and noncomputable functions, definability vs. mere existence, uniformity/parametricity as a constraint on what a single term can do. And be honest about the translation: don't quietly assume a constructive universe and then report back that AC looks fishy — that isn't a translation, that's the conclusion smuggled in at the setup.

  Here's where I got stuck, which I suspect is the interesting part. I tried writing AC down as a type — forall x : A, exists y : B, R x y, implies exists f : A -> B, forall x : A, R x (f x) — and if I read exists as a Sigma type it looked like something I could just write a term for. That definately can't be the thing people have argued about for a hundred years, so my translation is already doing something wrong, and I want to know what. Related: my advisor's offhand line was that AC is basically skolemization and the whole fuss is just about whether your Skolem functions are allowed to be arbitrary non-computable things, and I half believe that but half think it's too quick. And then there's Banach–Tarski and non-measurable sets: is there any counterpart to that in my vocabulary, or is that where the translation just stops? End with a residue report, please: what carried over cleanly, what only fit after being distorted, what has no expression in PL terms at all — and for that last pile, whether the residue is my vocabulary being too small (does it secretly presume everything is computable or definable?) or the philosophical disagreement having less content in it than it sounds like. Don't give me reading recommendations or citations, I can't chase references right now.
