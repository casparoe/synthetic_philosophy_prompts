answer: |-
  Here is the translation of the AC dispute into your vocabulary, followed by the residue report you asked for.

  ### The Pivot: Why Your Type Was Provable

  You got stuck because you translated the mathematical $\exists$ as a $\Sigma$-type. In Martin-Löf Type Theory (and Coq/Agda), the statement:
  $$ (\Pi x:A. \Sigma y:B. R(x,y)) \to (\Sigma f:A \to B. \Pi x:A. R(x, f(x))) $$
  is inhabited by a simple term: `fun h => (fun x => proj1 (h x), fun x => proj2 (h x))`.
  This is the **Type-Theoretic Axiom of Choice (TTAC)**. It is a tautology in constructive type theory because a $\Sigma$-type *is* a data pair. To possess a proof of the premise is to possess the witness $y$ and the proof $p$ for every $x$. Constructing the function $f$ is just projection.

  The philosophical dispute over AC is not about TTAC. It is about the gap between **Propositional Existence** (Truncated) and **Data Existence** (Sigma).

  In Coq terms, the mathematical premise is usually:
  $$ \Pi x:A. \| \Sigma y:B. R(x,y) \| $$
  where $\| \cdot \|$ is squash/truncation (mapping a Type to a Prop, erasing the witness).
  The mathematical conclusion is:
  $$ \| \Sigma f:A \to B. \Pi x:A. R(x, f(x)) \| $$
  (or sometimes the untruncated version, asserting the function actually exists as an object).

  The dispute is: **Are you allowed to un-truncate?** Can you lift a witness out of a Prop to construct a function in Type?

  ### The Three Stances, Translated

  #### 1. The Classical Set Theorist (AC is Unproblematic)
  *   **PL Translation:** The universe of types is a model of ZFC. We postulate a global constant (an oracle) that performs the un-truncation.
  *   **The Term:** We add an axiom:
      `Axiom choice : forall (A B : Type) (R : A -> B -> Prop), (forall x, exists y, R x y) -> {f : A -> B | forall x, R x (f x)}.`
      *(Note: The return type is a Sigma, the premise uses `exists` Prop).*
  *   **Computational Content:** None. This term has no normal form. It is a black box.
  *   **Parametricity:** Violated. A parametric function must behave uniformly based on the structure of its input. Here, the input is a proof in `Prop` (which is erased/irrelevant), but the output is a specific function in `Type`. The function $f$ cannot depend on the *proof* of existence (since proofs are irrelevant), so it must depend on some external, non-parametric selection mechanism.
  *   **Extraction:** Extraction fails or produces a stub. You cannot extract an OCaml/Haskell program from a proof using this axiom.
  *   **View on "Arbitrary Sets":** An "arbitrary subset" corresponds to a predicate $P : A \to \text{Prop}$. AC asserts that even if $P$ is defined non-constructively (e.g., via a quotient that doesn't respect computability), the characteristic function exists in the universe.

  #### 2. The Constructive Analyst (Dependent/Countable Choice Only)
  *   **PL Translation:** We allow un-truncation only when the domain $A$ allows us to build the function $f$ inductively or coinductively.
  *   **The Constraint:** If $A = \mathbb{N}$, we can accept:
      $(\Pi n:\mathbb{N}. \| \Sigma y:B. R(n,y) \|) \to \| \Sigma f:\mathbb{N} \to B. \Pi n. R(n, f(n)) \|$
      Why? Because we can define $f$ by recursion. We compute $f(0)$ by searching (since the existence is proven, and the search space might be enumerable), then $f(1)$, etc.
  *   **Uniformity:** This respects a weaker form of parametricity. The function $f$ is uniform over the *index* $n$, constructed step-by-step.
  *   **Extraction:** Extracts to a recursive function (potentially using general recursion or fuel, depending on the logic).
  *   **View on Full AC:** Rejected because if $A$ is uncountable (like $\mathbb{R}$), you cannot iterate to build the graph of $f$. A function $\mathbb{R} \to \mathbb{R}$ in this view must be given by a finite description (a term). AC asserts the existence of functions with no finite description.

  #### 3. The Strict Constructivist (No AC, Existence is Construction)
  *   **PL Translation:** Existence *means* Sigma. There is no truncation, or if there is, it is never un-truncated.
  *   **The Stance:** The statement $\forall x, \exists y, R(x,y)$ is only valid if you already have the function $f$.
  *   **Definability:** "Mere existence" (Prop) is viewed as semantically empty unless it can be promoted to Data (Type).
  *   **Parametricity:** Enforced strictly. A term of type $A \to B$ must be a program. If you cannot write the $\lambda$-term, the type is uninhabited.
  *   **View on AC:** AC is not just false; it is a category error. It claims you can get data from a proof.

  ### Your Advisor's Comment: AC as Skolemization

  Your advisor is half-right, but the "half" is where the philosophy lives.

  *   **Logic View:** Skolemization replaces $\exists y$ with a function symbol $f(x)$. It preserves satisfiability. It is a syntactic transformation.
  *   **PL View:** A term *is* a Skolem function.
  *   **The Dispute:** In classical logic, a Skolem function is an uninterpreted symbol in a model. In PL, a term is a *computation*.
  *   **Translation:** Assuming AC in PL is equivalent to adding a Skolem function constant to your context *without a definition*.
      *   **Classical:** "It's fine to have undefined constants, as long as the type system stays consistent."
      *   **Constructive:** "A constant without a definition breaks the 'Proofs as Programs' correspondence. It's not a program, it's a promise."

  So, AC is Skolemization *plus* the assertion that the Skolem function counts as a valid inhabitant of the function type, regardless of whether it has an algorithmic definition.

  ### Banach–Tarski and Non-Measurable Sets

  Is there a counterpart in PL? Yes, but it appears as **Continuity** and **Parametricity** violations rather than Measure Theory.

  1.  **Continuity:** In many constructive models of type theory (e.g., realizability toposes, Brouwerian intuitionism), **all functions $f : \mathbb{R} \to \mathbb{R}$ are continuous.**
      *   Why? Because a function is a program. To compute $f(x)$ to precision $\epsilon$, the program can only inspect $x$ to some finite precision $\delta$. This is the definition of continuity.
      *   **Banach-Tarski:** Requires partitioning the sphere using a choice function on equivalence classes (orbits of rotation). This function is wildly discontinuous.
      *   **PL Counterpart:** Assuming AC allows you to prove the existence of a term $f : \mathbb{R} \to \mathbb{R}$ that is not continuous. To a strict constructivist, this is like proving `False`. It violates the topological structure inherent in the computational interpretation of the reals.

  2.  **Non-Measurable Sets:**
      *   A non-measurable set corresponds to a predicate $P : \mathbb{R} \to \text{Prop}$ whose characteristic function cannot be integrated.
      *   In PL, if you work in a system where all functions are computable, all definable sets are recursive (or hyperarithmetical).
      *   AC asserts the existence of predicates that are not definable by any term in the language.
      *   **Translation:** The "pathology" of Banach-Tarski is the **gap between the internal language (terms) and the external semantics (sets)**. AC forces the internal language to pretend it can talk about external sets that it cannot name.

  ### Residue Report

  Here is what survived the translation, what broke, and what was left behind.

  #### 1. Clean Translation (High Fidelity)
  *   **Sigma vs. Prop:** The distinction between "witness provided" ($\Sigma$) and "witness erased" ($\| \cdot \|$) perfectly captures the Constructive vs. Classical divide on existence.
  *   **TTAC vs. ZFC-AC:** The fact that TTAC is provable while ZFC-AC is controversial maps cleanly to "Projection from Sigma is free" vs. "Lifting from Prop requires an axiom."
  *   **Extraction:** The computational cost of AC is precisely captured by extraction failure. If you use AC, you cannot run your proof. This aligns with the philosophical complaint that AC produces "existence without construction."
  *   **Skolem Functions:** Treating AC as adding an uninterpreted constant to the context is an accurate syntactic model of the axiom.

  #### 2. Distorted Translation (Requires Stretching)
  *   **"Arbitrary Sets":** In Set Theory, a set is an extensional collection. In PL, a "set" is usually a Type (intensional) or a Predicate (subset type).
      *   *Distortion:* In PL, "arbitrary" usually means "axiomatically asserted." In Set Theory, "arbitrary" means "any sub-collection of the universe, regardless of definability." PL struggles to express "undefinable" because everything in the object language is, by definition, a term. We have to simulate undefinability via axioms, which feels like cheating to a set theorist (who sees axioms as describing reality, not patching a language).
  *   **Cardinality:** PL Universes (`Type 0`, `Type 1`) handle size, but the specific cardinal arithmetic involved in AC (e.g., well-ordering theorem, cardinal comparability) doesn't have a direct "program" equivalent. It translates to "can we construct an ordering?" rather than "does an ordering exist as a set of pairs?"

  #### 3. No Expression (The Residue)
  *   **The Meta-Theoretic Tension:** This is the biggest residue.
      *   **The Friend's Claim:** "You PL people quietly assume choice."
      *   **The Reality:** She is likely talking about the **Meta-Theory**. When you prove Coq is sound, you usually do it in ZFC (which has AC). So the *semantics* of your types rely on AC, even if the *object language* rejects it.
      *   **Why it doesn't translate:** In PL, we distinguish Object vs. Meta sharply. In Philosophy of Math, this line is blurrier. The dispute often isn't "Is AC true in the system?" but "Is AC true of the universe the system describes?" PL vocabulary assumes the system *is* the universe (via Curry-Howard). Set theory assumes the system describes a universe that is larger than the system.
  *   **Ontological Weight:** Set theorists worry about what sets *are*. PL researchers worry about what terms *do*.
      *   Banach-Tarski is shocking to a set theorist because it violates geometric intuition about *stuff* (volume).
      *   In PL, it's shocking because it violates *continuity* of functions.
      *   **Residue:** The "physical" intuition of volume and measure doesn't map to types. We can define Measure Theory in Coq, but the "paradox" feels like a bug in the library, not a paradox of reality. The philosophical horror of AC (that it creates monsters) is dampened in PL because we already assume "monsters" (non-terminating terms, axioms) are possible; we just try to track them in the type.

  #### 4. Is the Vocabulary Too Small?
  No, your vocabulary is actually **too strict**.
  *   PL presumes **Syntax**. Everything must be written down.
  *   The AC debate is often about **Semantics**. Can there be things that *exist* but *cannot be written down*?
  *   By translating "exists" to "inhabited type," you implicitly side with the Constructivists. To truly translate the Classical view, you have to treat the Type Theory not as a programming language, but as a formal system describing a Platonic universe where `Axiom` is a valid declaration of truth, not a hole in a program.

  **Summary:** Your friend is right that PL *semantics* often rely on AC, but wrong that PL *practice* assumes it. The "dispute" translates to: **Is a function a graph (Set Theory) or a rule (PL)?** AC says graphs exist even without rules. PL says if there's no rule, there's no term. The residue is the friction between "describing a universe" (Math) and "building a machine" (PL).
