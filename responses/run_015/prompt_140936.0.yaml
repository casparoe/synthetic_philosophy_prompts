  **Logical Space**
  Three axes structure the space: Source (Chair vs Rule vs People), Limit (Self-fettering vs Open), Time (Practice vs Instant). Formally, 2^3 = 8 combinations. Expanded by specific cases, there are 64 possible paths.
  Empty regions: (1) Chair decides BUT Rulebook limits Chair (incoherent). (2) Practice matters BUT Lock stops Practice (unstable). (3) People rule BUT Assembly cannot dissolve (contradictory).
  Dependency: If 'Practice matters' is yes, 'Lock stops' is usually no.

  **The Key**

  1. Case 8 (Unregistered). 90% vote, Chair ignores. Do moderators enforce it?
     Yes → 2.
     No → 3.

  2. Case 9 (Vanishing). Ghosts vote. Does the record stand?
     Yes, Chair says so → Leaf 1.
     Yes, Register shows it → Leaf 13.
     No → Leaf 2.

  3. Case 1 (Repeal). 68% vs Lock (4/5). Does the Lock stop it?
     Yes → 4.
     No → 5.

  4. Case 2 (Freeze). 82% stops future changes. Can they do this?
     Yes → Leaf 3.
     No → 6.

  5. Case 4 (Double). 51% lowers threshold AND repeals Lock together. Does it work?
     Yes, both parts → 7.
     Yes, only threshold → Leaf 12.
     No → 8.

  6. Case 3 (Bootstrap). 51% rule used for 3 years. Does practice cure the defect?
     Yes → Leaf 4.
     No → Leaf 5.

  7. Case 6 (Ratchet). 11 steps lower threshold to 51%, strip rights. Is the end result enforced?
     Yes → 9.
     No, steps bad → Leaf 6.
     No, end bad → Leaf 14.

  8. Case 7 (Retro). 80% repeals Lock 'from the start'. Does the backdate work?
     Yes → Leaf 7.
     No → Leaf 8.

  9. Case 5 (Janus). 70% hands power to 40k users. Is this allowed?
     Yes → Leaf 9.
     No → 10.

  10. Case 10 (Silent). Every rule replaced. Same polity?
      Yes → Leaf 10.
      No → Leaf 11.

  **The Leaves**

  1. **Chair Supremacy**. The Chair's treatment identifies the rules. *Awkward:* Moderators must ignore a 90% vote if the Chair blinks.
  2. **Register Formalism**. Only listed rules are part of the rulebook. *Awkward:* A unanimous vote is void if the Chair sleeps.
  3. **Self-Embracing**. The Assembly can bind its future self indefinitely. *Awkward:* The present majority is slave to the dead.
  4. **Customary**. Sustained efficacy replaces the test altogether. *Awkward:* Three years of error makes law.
  5. **Strict Pedigree**. Each amendment inherits force from an authorising rule in force at the time. *Awkward:* The polity collapses if one step is missed.
  6. **Proceduralist**. Every step must be lawful under the threshold then in force. *Awkward:* Eleven lawful steps cannot produce an unlawful end.
  7. **Legal Fiction**. Retroactive declarations change the past force of rules. *Awkward:* The Lock never existed, though it stopped votes.
  8. **Continuing**. The Assembly cannot fetter its own future exercise of power. *Awkward:* Every 'Lock' is merely a warning sign.
  9. **Popular Sovereignty**. Ultimate power lies outside the rulebook and cannot be alienated. *Awkward:* The Assembly can dissolve itself into a mob.
  10. **Persistence**. The rulebook persists through total lawful replacement. *Awkward:* The polity survives total change of members and servers.
  11. **Revolutionary**. Identity resets when the foundational rule changes. *Awkward:* The polity died a century ago.
  12. **Partial Omnipotence**. The Assembly can change thresholds but not remove locks in one go. *Awkward:* Form matters more than the vote count.
  13. **Official Acceptance**. The test is what officials treat as identifying the rules. *Awkward:* Ghost votes count if the Chair stamps them.
  14. **Content-Limit**. Some amendments cannot produce law whatever their pedigree. *Awkward:* Moderators must veto a 99% vote on rights.
  15. **Unnamed**. The Lock binds unless repealed retroactively. *Awkward:* Backdating is magic, but forward-binding is not.
  16. **Sceptic**. There is no test; every question collapses into a prediction about officials. *Awkward:* There is no law, only force.

  **Notes**

  *Rejected:* Case 1 (Repeal) was considered for 'Lock' but Case 4 (Double) better separates self-embracing views. Case 9 (Vanishing) was dropped from the main chain to split Officialism leaves.
  *Inseparable:* Leaf 1 (Chair Supremacy) and Leaf 13 (Official Acceptance) are hard to separate in practice; only separated by theory of source (will vs system). Leaf 15 (Unnamed) occupies a region nobody defends because it treats time asymmetrically without reason.
  *Constraints:* Banned words excluded from couplets. British spelling used throughout.
