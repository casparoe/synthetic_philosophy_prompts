      *   *Best:* **The Statistical Meta-Evidence.**
      *   Task: A specific logic puzzle known to be counter-intuitive (e.g., The Harman's Case or a specific Bayesian update).
      *   HOE: "In 100 trials of this puzzle, 90% of people who derive Answer X using *this specific derivation* are wrong, even if the derivation looks valid." (This simulates the 'drug' case).
