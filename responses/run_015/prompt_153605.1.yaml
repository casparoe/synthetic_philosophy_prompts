answer: |-
  # Seminar Activity: The Reliability Wager
  **Topic:** Higher-Order Evidence and Epistemic Akrasia
  **Duration:** 90 Minutes
  **Participants:** 12 Advanced Undergraduates (4 Groups of 3)
  **Materials:** Printed puzzle sheets, 'Reliability Cards', 'Wager Slips', pens, envelopes.

  ## 1. Philosophical Preamble: Settled vs. Contested
  Before running the activity, the tutor must internally distinguish between the phenomenological mechanics of the game and the normative philosophical claims.

  *   **Broadly Settled:** Higher-order evidence (HOE)—evidence about the quality of one's first-order evidence or reasoning process—exists and is relevant to epistemic justification. Epistemic akrasia (holding a belief while believing it is irrational to hold it) is a recognisable psychological state.
  *   **Genuinely Contested:**
      *   **Rational Permissibility of Level-Splitting:** Is it ever rational to believe *P* while believing one's belief in *P* is irrational? (e.g., *Weatherson 2005* vs. *Horowitz 2014*).
      *   **Total-Evidence Integration:** Does HOE always demand a revision of the first-order belief, or can it be 'bracketed'?
      *   **Self-Peer Coherence:** Is treating one's own prior reasoning state as an 'epistemic peer' structurally coherent, or does the first-person perspective grant privileged access that dissolves the disagreement?

  *Note to Tutor: Do not present the 'Total-Evidence' view as the correct solution. The activity is designed to make the tension palpable, not to resolve it.*

  ---

  ## 2. Activity Overview
  Students engage in a logical deduction task. Upon reaching a consensus, they receive statistical higher-order evidence suggesting their reasoning process is likely unreliable. They must then record their first-order credence, their higher-order assessment of rationality, and place a 'wager' on their answer. The scoring incentivises calibration between belief and reliability assessment.

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Briefing & Grouping** | Divide into 4 groups of 3. Distribute **Puzzle Sheets**. Explain the goal: Solve the logic puzzle. Do not mention HOE yet. |
  | **10–30** | **First-Order Reasoning** | Groups solve the puzzle. They must write down their **Derivation** (steps taken) and their **Verdict** (Answer A or B). They must also record their **Initial Confidence** (0–100%). |
  | **30–40** | **The HOE Injection** | Collect puzzles. Distribute **Reliability Cards**. These cards contain statistical data about previous cohorts' performance on this specific puzzle type relative to confidence levels. |
  | **40–55** | **Deliberation & Akrasia** | Groups discuss the tension between their Derivation (which looks sound) and the Reliability Card (which suggests they are likely wrong). They must complete the **Dual-Record Sheet** (First-Order Credence vs. Rationality Assessment). |
  | **55–70** | **The Wager** | Groups receive **Epistemic Credits (EC)** (paper tokens). They must wager EC on their Answer. High wager = High points if correct, massive loss if wrong. |
  | **70–80** | **Resolution** | Reveal the correct answer. Calculate scores. |
  | **80–90** | **Debrief** | Map the experience to the philosophical concepts (Level-Splitting, Total-Evidence, Peer Disagreement). |

  ---

  ## 4. Roles, Rules, and Constraints

  ### The Task (First-Order Evidence)
  Use a **Probabilistic Logic Puzzle** (e.g., a variant of the Monty Hall problem or a Base-Rate Neglect scenario) where the intuitive answer is usually wrong, but the derivation *feels* valid.
  *   *Constraint:* Groups must write down their steps. This objectifies their reasoning, making it something they can later view as 'evidence'.

  ### The Higher-Order Evidence (The Reliability Card)
  After collecting the puzzles, hand each group an envelope containing a **Reliability Card**.
  *   **Text on Card:** *"Data from 500 previous seminar groups indicates: For this specific puzzle, groups who report Initial Confidence >80% have a 15% accuracy rate. Groups who report Initial Confidence <50% have a 60% accuracy rate. This statistical trend holds regardless of the logical derivation provided."*
  *   **The Conflict:** Most groups will have solved it confidently (Initial Confidence >80%). The card tells them their confidence is a reliable indicator of *error*.

  ### The Dual-Record Sheet (Capturing Akrasia)
  Before wagering, groups must fill out a slip with two distinct fields:
  1.  **Credence in Proposition P:** (0–100%) "How likely is Answer A true?"
  2.  **Credence in Rationality:** (0–100%) "How rational is it for us to hold this belief given the Reliability Card?"
  *   *Instruction:* "These numbers may diverge. You may feel the answer is true, but that believing it is irrational."

  ### The Wager (Action)
  *   Each group starts with 100 **Epistemic Credits (EC)**.
  *   They must wager between 0 and 100 EC on their chosen answer.
  *   **Payoff:**
      *   Correct Answer: Wager is doubled and added to score.
      *   Incorrect Answer: Wager is subtracted from score.
      *   **Calibration Bonus:** If their *Credence in Rationality* matches their actual accuracy (assessed across the class), they gain a flat 20 EC. (This incentivises honest HOE assessment).

  ---

  ## 5. Scoring Scheme (Non-Monetary)
  The scoring is designed to punish dogmatism in the face of HOE without forcing revision.

  *   **Accuracy Score:** Based on the Wager outcome.
  *   **Calibration Score:** Based on the *Credence in Rationality*.
      *   If the group was wrong (which the HOE suggested), but they rated *Credence in Rationality* low (e.g., 20%), they receive the Calibration Bonus.
      *   If they were wrong and rated *Credence in Rationality* high, they receive no bonus.
  *   **Winning Condition:** The group with the highest total EC wins 'Epistemic Authority' (e.g., they choose the reading for the next week).

  *Philosophical Function:* This allows a **Level-Splitting** strategy to 'win' on calibration even if they lose on accuracy. They can say, "We believe P (Wager High), but we know it's irrational (Rationality Low)." The scoring rewards the acknowledgement of the HOE even if they don't revise the belief.

  ---

  ## 6. Debrief Guide: Mapping Experience to Theory

  **1. The Phenomenology of Akrasia (5 mins)**
  *   Ask: "Did anyone feel it was possible to hold Answer A while simultaneously thinking holding Answer A was stupid?"
  *   *Map:* This is the state of **Epistemic Akrasia**. $B(P) \land B(\text{Irrational}(B(P)))$.
  *   *Question:* Was this state uncomfortable? Why?

  **2. Total-Evidence vs. Level-Splitting (5 mins)**
  *   Ask groups who lowered their Wager: "Did the HOE change your belief in P, or just your action?"
  *   Ask groups who kept High Wager but Low Rationality: "Is this position coherent? Can you rationally act on a belief you deem irrational?"
  *   *Map:* Distinguish **Total-Evidence Views** (HOE must lower credence in P) from **Level-Splitting Views** (HOE lowers credence in the *rationality* of P, but P remains supported by first-order evidence).

  **3. The Self-as-Peer Moment (5 mins)**
  *   Ask: "When you read the Reliability Card, did you treat your own earlier reasoning as if it came from a stranger?"
  *   *Map:* Discuss the **Uniqueness Thesis** vs. **Permissivism**. If you treat your past self as a peer, disagreement requires conciliation. If you treat your current access to reasons as privileged, you might resist.

  ---

  ## 7. Limitations: What This Activity Cannot Reproduce

  1.  **Diachronic Stability:** The activity creates a momentary spike of doubt. Real epistemic akrasia often involves a sustained, nagging doubt over time that erodes belief gradually. The game resolves too quickly to show the *erosion* of justification.
  2.  **Normative Force:** The game incentivises admitting irrationality via points. In reality, the normativity of logic is not monetary. Students may admit irrationality to gain 'Calibration Points' without genuinely feeling the normative pull.
  3.  **The 'Right' Answer:** In the game, there is an objective truth (Answer A or B). In many philosophical cases of HOE (e.g., moral reasoning or complex metaphysics), there is no answer key to validate who was actually right, making the HOE even more destabilising.

  ---

  ## 8. Prediction of Failure Modes & Fixes

  **Failure Mode 1: The "It's Just a Game" Reaction**
  *   *Prediction:* Students may treat the Reliability Card as a arbitrary rule of the game rather than genuine epistemic evidence. They might ignore it to 'win' the wager.
  *   *Fix:* **Verisimilitude.** Before the session, prepare a handout citing real psychological literature on the specific cognitive bias inherent in the puzzle (e.g., "The Conjunction Fallacy"). Tell them: "This card is not a game mechanic; it is empirical data about human cognition applied to you."

  **Failure Mode 2: Collusion on Level-Splitting**
  *   *Prediction:* Groups might realise they can game the Calibration Bonus by always reporting Low Rationality, regardless of belief.
  *   *Fix:* **The Consistency Check.** In the debrief, reveal that the Calibration Bonus is only awarded if the *Wager* aligns with the *Rationality Assessment*. If they Wager High (Action) but claim Low Rationality, they are flagged as 'incoherent agents' and lose the bonus. This forces them to choose: either revise the belief (Total Evidence) or accept the loss (Level-Splitting cost).

  **Failure Mode 3: Confusion on 'Rationality'**
  *   *Prediction:* Students may conflate "Rationality" with "Truth". They might think if P is true, believing it was rational.
  *   *Fix:* **Pre-Session Definition.** On the board, write: *Rationality = Proper response to evidence. Truth = Correspondence with reality.* Remind them during the Dual-Record phase: "You can be rational and wrong. You can be irrational and right. Record the status of your *process*, not your *outcome*."

  ---

  ## 9. Tutor's Note on Contested Positions
  During the debrief, ensure you do not validate one response as the 'solution'.
  *   If a student argues, "I *must* lower my confidence because the evidence says I'm unreliable," acknowledge this as the **Conciliationist/Total-Evidence** view (e.g., *Elga*, *Christensen*).
  *   If a student argues, "The logic proves P. The stats just say I'm tired. I'll keep P but admit I might be biased," acknowledge this as the **Level-Splitting/Steering** view (e.g., *Greco*, *Weatherson*).
  *   Highlight that the discomfort they felt is the central philosophical problem: **How can it be rational to believe what you take yourself to have no reason to believe?**

  By structuring the incentives to reward the *recognition* of HOE without mandating belief revision, the activity creates a safe space for students to inhabit the akratic state, rather than rushing to resolve it.
