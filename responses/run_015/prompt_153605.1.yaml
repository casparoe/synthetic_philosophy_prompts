      *   Need to ensure I don't claim Level-Splitting is definitely irrational or rational. It's contested.
      *   Need to highlight the "Total Evidence" view vs. "Level-Splitting."
      *   British English spelling (behaviour, programme, etc.).

  6.  **Developing the Scoring:**
      *   Currency: "Epistemic Credits" (EC).
      *   Earned by: Correct answer + Accurate confidence reporting.
      *   Loss: Overconfidence on wrong answers.
      *   This forces them to weigh the HOE. If they ignore HOE and are wrong, they lose big. If they split levels, how do they score? The scoring must force a *decision* on action, even if belief is split.

  7.  **Addressing the "What will go wrong" section:**
      *   Students might treat it as a trivial game.
      *   They might not feel the "force" of the HOE (it's just a piece of paper).
      *   They might collude to game the scoring.
      *   *Fix:* Debrief needs to be heavy. The HOE needs to be credible (e.g., cite real psychological data about the puzzle type).

