answer: |-
  **MEMORANDUM**

  **TO:** Faculty Senate
  **FROM:** Committee on Educational Policy
  **SUBJECT:** Recommendation on 1973 Divisional Breadth Requirement
  **DATE:** October 26, 2023

  **Executive Summary**
  The Committee on Educational Policy recommends suspending the 1973 requirement that students take two outside-division courses within the same department for one entering cohort, subject to a pre-registered plan for observing effects on enrollment and student outcomes. We lack outcome data confirming the rule's educational benefit *[Unverified Empirical Claim]*, yet face significant uncertainty regarding the consequences of repeal. This suspension applies the "reversibility-and-legibility" test: it allows us to gather evidence on whether the rule is load-bearing or vestigial without committing to permanent inertia or risking a more burdensome replacement. We acknowledge that the rule may function to support small department enrollment *[Unverified Empirical Claim]*, a matter addressed separately in the Appendix.

  **Recommendation and Confidence**
  **Bottom Line:** Suspend the requirement for the Fall 2024 entering cohort. Reinstate automatically for Fall 2025 unless data demonstrates negligible impact on small department enrollment and no degradation of educational coherence.
  **Confidence:** Moderate (60%). This recommendation balances the risk of losing hidden institutional value against the cost of maintaining potentially vestigial friction.
  **Evidence to Change Mind:** Definitive data showing the requirement directly causes significant negative outcomes for transfer students (e.g., delayed graduation rates >10%) would shift recommendation to Repeal. Conversely, data showing small department enrollment drops >15% during suspension would shift recommendation to Convert (explicitly funding those seats).

  **Philosophical Framework and Empirical Status**
  Our deliberation engaged deeply with Burkean and Chestertonian principles regarding inherited practices. It is settled among us that we lack specific outcome data regarding this rule's efficacy. However, the philosophical weight of tradition remains contested. Some members argue the Burkean presumption is an epistemic claim: that the rule encodes distributed experience we cannot individually articulate. Others argue it is merely a precautionary rule under uncertainty: we should not break what we do not understand because the cost of error is high. Similarly, Chesterton's fence is contested between a demand for understanding (find the reason) and a demand for standing (do not remove unless you have the authority of experience). This memo does not resolve these philosophical disputes but operates under the precautionary reading given the lack of data.

  We applied the committee's taxonomy to the rule. It is not clearly **Load-bearing**, as we have no evidence it improves learning *[Unverified Empirical Claim]*. It is potentially **Converted**, serving an unacknowledged function like stabilizing small department enrollment *[Unverified Empirical Claim]*. It risks being **Vestigial**, imposing costs without benefit. It may also be **Expressive**, signaling a commitment to depth over breadth. Because we cannot distinguish between Converted and Vestigial without experimentation, retention without review is unjustified.

  **Application of Tests**
  We prioritized two tests over the standard "purpose" inquiry. First, the **Reversibility-and-Legibility Test**. Repealing the rule is technically reversible, but the loss of institutional culture is not easily legible. A one-year suspension increases legibility; we can measure enrollment shifts and student feedback before making permanent changes. Second, the **Counterfactual-Replacement Test**. The choice is not Rule vs. No Rule, but Rule vs. Whatever the Senate Invent. If repealed, pressure may mount for a mandatory interdisciplinary capstone *[Unverified Empirical Claim]*, which would be far more burdensome than the current requirement. Suspension allows us to assess if the vacuum demands filling.

  **Strongest Argument Against This Recommendation**
  The strongest argument against suspension is that the Burkean fence principle is nearly free to invoke, unfalsifiable in practice, and ratchets toward inertia. Any rule whatsoever can be defended by gesturing at purposes nobody has discovered yet. By recommending suspension rather than repeal, this memo risks validating a default posture of preservation that places the burden of proof on change rather than on continuity. If the rule is indeed vestigial, a one-year suspension imposes administrative costs and student confusion for no gain. Furthermore, signaling that requirements are negotiable may undermine the stability of the curriculum, encouraging future cohorts to lobby for suspensions whenever requirements become inconvenient. The precautionary principle, if applied too broadly, becomes a veto on innovation, preserving the past not because it is wise, but merely because it is old.

  **Appendix: The Enrollment Hypothesis**
  Several members noted that small departments (e.g., Classics, Geology) enroll a noticeable share of seats through this requirement *[Unverified Empirical Claim]*. Defending a curricular requirement for budgetary reasons is institutionally hazardous; it misaligns educational policy with fiscal planning. The honest move is to route this hypothesis to the Budget Committee. If these seats are vital for departmental viability, they should be funded as such, perhaps through targeted enrollments or subsidies, rather than hidden within a breadth requirement. This memo recommends that if suspension causes enrollment drops, the College should address the funding model directly rather than reinstating the rule under false educational pretenses.
