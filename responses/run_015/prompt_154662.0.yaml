answer: |-
  # JOINT STATEMENT ON CONTRACTUALISM AND THE AGGREGATION PROBLEM

  **Parties:**
  **Camp A:** Pairwise Baseline Contractualists (PBC)
  **Camp B:** Structural Interdependence Contractualists (SIC)

  **Date:** October 26, 2023
  **Subject:** Mapping Agreement and Disagreement on T.M. Scanlon's Formula of Reasonable Rejection

  ## 1. AGREED CLAIMS

  Both Camp A and Camp B affirm the following foundational commitments regarding the contractualist framework. These claims constitute the shared ground upon which our specific disagreement regarding aggregation rests.

  1.  **The Individualist Constraint:** Moral principles must be justifiable to each person individually. A principle is wrong if it could be reasonably rejected by any single affected party, regardless of the benefits conferred on others.
  2.  **Rejection of Welfare Maximization:** The justification of a principle does not depend on maximizing aggregate welfare or summing utility across persons. The fact that a policy produces a net gain in well-being is not, in itself, a sufficient justification for imposing burdens on those who lose out.
  3.  **The Centrality of Reasonable Rejection:** The core mechanism of moral deliberation is the assessment of reasons for rejecting a principle. These reasons must be generic (appealing to shared standards) and personal (grounded in the burden borne by the individual).
  4.  **Distinction in Burden Types:** There is a morally relevant distinction between (i) harming one person to prevent harm to others (where the harm to the one is a means or a direct cost of saving the others) and (ii) distributing unavoidable burdens where harm will occur regardless, and the question is how to allocate it fairly.
  5.  **Non-Arbitrariness:** Decisions affecting persons cannot be made arbitrarily. If burdens are distributed, there must be a principled reason for why specific individuals bear them rather than others.

  ## 2. DISAGREEMENTS TABLE

  The following table isolates the precise points of divergence. The left column provides a neutral framing of the issue. The middle and right columns state the precise formulation each camp endorses for its own position.

  | Neutral Framing of Issue | Camp A (Pairwise Baseline) Formulation | Camp B (Structural Interdependence) Formulation |
  | :--- | :--- | :--- |
  | **1. The Composition of the Comparative Baseline** | When assessing whether an individual can reasonably reject a principle, their burden is compared against the burdens of *one* other individual in the alternative scenario. The baseline excludes the parallel burdens of third parties not directly involved in the pairwise comparison. | When assessing whether an individual can reasonably reject a principle in institutional contexts, their burden is compared against the *pattern* of burdens across the affected group. The baseline includes the structural presence of other burden-bearers as a constitutive feature of the situation. |
  | **2. The Moral Relevance of Multiplicity** | The number of people suffering a similar minor harm does not increase the weight of the complaint against a principle. Ten thousand minor complaints remain ten thousand minor complaints; they do not fuse into one major complaint. | The number of people suffering a similar minor harm can alter the *structural nature* of the burden. A principle that permits widespread minor harms creates a different kind of institutional failure than one permitting a single major harm, changing what is reasonable to reject. |
  | **3. The Scope of Pairwise Comparison** | Pairwise comparison is invariant across contexts. The logic used to judge a one-on-one interaction applies identically to large-scale institutional design, merely repeated for each dyad. | Pairwise comparison is context-sensitive. In collective-choice contexts, the "pair" is the individual versus the principle's distributional pattern. The comparison remains pairwise (Individual vs. Principle), but the Principle's content is interdependent. |

  ## 3. CRUXES

  We identify three sub-questions (cruxes) that determine the trajectory of this debate. Resolving any one of these would significantly shift the position of at least one camp. For each crux, we specify the line of reasoning, the concrete bearing, and the divergent predictions.

  ### Crux 1: Baseline Inclusion and the Utilitarian Collapse
  **Sub-Question:** Can the baseline for measuring burden in Scanlon's formula include the presence or absence of other burden-bearers without collapsing into utilitarian aggregation?

  *   **Line of Reasoning:** If Camp B allows the presence of others to weigh on the baseline, does this functionally amount to summing utilities (utilitarianism), or does it remain a deontological constraint on justification?
  *   **Concrete Bearing:** The definition of "reasonable." If "reasonable" absorbs the count of affected persons, is the individualist constraint violated?
  *   **Camp A Prediction:** Including others in the baseline inevitably collapses into utilitarian aggregation. Once you admit the *number* of others into the justification for burdening one, you have abandoned contractualism for consequentialism.
  *   **Camp B Prediction:** Including others does not collapse into utilitarianism because the count is not summed as *value*, but registered as *structural fact*. The objection is to the *pattern* of disregard, not the sum of pain. One can reject a principle because it treats a class of people as negligible, not because their total pain exceeds another's.

  ### Crux 2: Knowledge of Multiplicity
  **Sub-Question:** Can an individual's knowledge that she is one of many similarly situated enter into what she can reasonably reject, or is such knowledge irrelevant to pairwise justification?

  *   **Line of Reasoning:** Does the subjective or objective fact of being part of a large group change the generic reasons available to an individual?
  *   **Concrete Bearing:** Cases of risk and statistical certainty. If I know I am one of 10,000 who will lose a cultural record, does that change my complaint compared to being the only one?
  *   **Camp A Prediction:** Irrelevant to the strength of the claim. My complaint is about *my* loss. That others share it is coincidental to the justification owed to *me*. It may affect the probability of being the victim, but not the weight of the complaint if I am the victim.
  *   **Camp B Prediction:** Relevant to the nature of the claim. Knowing I am part of a group whose interests are collectively overridden changes the complaint from "I lost a record" to "My community's existence is structurally deprioritized." This is a stronger generic reason for rejection.

  ### Crux 3: Counting Numbers vs. Counting Structural Patterns
  **Sub-Question:** Is there a principled distinction between "counting numbers" and "counting structural patterns" in institutional design, and if so, what formal feature distinguishes them?

  *   **Line of Reasoning:** Camp B claims to count patterns, not people. Camp A claims this is a distinction without a difference.
  *   **Concrete Bearing:** Institutional rules regarding resource allocation.
  *   **Camp A Prediction:** No principled distinction exists. A "structural pattern" of 10,000 losses is mathematically and morally indistinguishable from counting 10,000 people. The formal feature is identical: the magnitude of the outcome depends on the headcount.
  *   **Camp B Prediction:** A principled distinction exists. The formal feature is *relational*. Counting numbers sums independent variables. Counting patterns assesses the coherence of a system. A system that systematically erases minority cultures is rejectable based on the *type* of error (systemic erasure), not merely the sum of erased items.

  ## 4. CONCRETE TEST CASE: THE DISTRIBUTED ARCHIVE PROTOCOL

  **Scenario:** A shared institutional system must choose between two options.
  *   **Option 1:** Preserve 10,000 individually minor but collectively irreplaceable cultural records (each tied to one specific community). Cost: One researcher's life-saving project is halted (major burden to the researcher).
  *   **Option 2:** Preserve the researcher's life-saving project. Cost: All 10,000 records are lost (minor burden to each of 10,000 record-holders).

  **Positions on Justifiability:**

  | Question | Camp A (Pairwise Baseline) | Camp B (Structural Interdependence) |
  | :--- | :--- | :--- |
  | **Can Option 1 (Save Records) be justified to the Researcher?** | **No.** The researcher compares her burden (halting life-saving work) against the burden of *one* record-holder (losing one minor record). Her burden is significantly heavier. The presence of the other 9,999 record-holders cannot aggregate to outweigh her claim. | **Yes.** The researcher's burden is weighed against the *structural pattern* of the archive's mission. The baseline includes the institutional commitment to the 10,000 communities. Halting the project is a heavy burden, but permitting the systemic erasure of 10,000 cultural ties violates the interdependent baseline of the institution. |
  | **Can Option 2 (Save Researcher) be justified to any one Record-Holder?** | **Yes.** No single record-holder suffers a burden comparable to the researcher. Since justification is pairwise, the researcher's strong claim overrides any single record-holder's weak claim. | **No.** While no single record-holder has a claim stronger than the researcher's in isolation, the principle "allow collective cultural erasure to save one individual" is rejectable. The record-holder rejects the principle that treats their community network as negligible. |
  | **Does the multiplicity of record-holders change what any one of them can reject?** | **No.** Multiplicity is morally inert regarding the *strength* of the reason for rejection. It only changes the *number* of people who have the same weak reason. 10,000 weak reasons do not constitute one strong reason. | **Yes.** Multiplicity changes the *content* of the reason for rejection. The burden is not just "loss of a record" but "participation in a mass erasure." The structural interdependence makes the burden qualitatively different when distributed across 10,000 people versus one. |

  ## 5. CONCLUSION: SUBSTANTIVE VS. VERBAL DISPUTE

  In concluding this joint statement, we assess the nature of our divergence.

  **On the Charge of Utilitarianism:**
  Camp A maintains that Camp B's position is substantively distinct from utilitarianism only in name. Camp A argues that if the outcome depends on the number of people affected (10,000 vs. 1), the mechanism is aggregation, regardless of whether it is labeled "structural pattern."
  Camp B maintains that the dispute is not verbal but substantive. They argue that justifying a principle to a person within an institution requires acknowledging their embeddedness in a social fabric. Ignoring that fabric (as Camp A does) fails the requirement of justification to *each*, because it misdescribes the burden each actually bears.

  **On Institutional Reasoning:**
  Camp A asserts that the Pairwise Baseline view can accommodate institutional reasoning without contradiction by applying the pairwise test iteratively or by relying on ex-ante agreements (rules agreed upon before knowing who will be the researcher or the record-holder).
  Camp B asserts that the Pairwise Baseline view cannot accommodate institutional reasoning without contradiction because it forbids the very comparisons (pattern vs. individual) that institutions are designed to manage.

  **Final Classification:**
  We conclude that the disagreement is **substantive**, not merely verbal.
  1.  **Verbal Component:** Both camps agree they reject "maximizing the good." If Camp B's "structural patterns" were merely a proxy for summing welfare, the dispute would be verbal. However, Camp B insists the *reason* for rejection is the violation of structural integrity, not the sum of losses.
  2.  **Substantive Component:** The camps yield opposite verdicts in the Distributed Archive Protocol. Camp A mandates saving the researcher; Camp B permits (or mandates) saving the records. Since they prescribe different actions based on incompatible interpretations of the "baseline" for reasonable rejection, the disagreement concerns the actual content of moral obligations, not just the terminology used to describe them.

  The dispute over "aggregation" does not dissolve simply by accepting that the Structural-Interdependence view disavows utilitarian sacrifice. The core friction remains: whether contractualism permits the *nature* of a burden to shift based on how many others share it. Camp A says no; Camp B says yes. This is a fundamental divergence in the theory of value underpinning contractualist justification.
