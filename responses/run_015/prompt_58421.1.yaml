answer: |-
  **Bottom Line**
  The committee recommends an "Allow-Only-If-Disclosed" policy for any AI agents participating in course discussion boards. Faculty may integrate these tools to enhance learning, but must explicitly identify them as non-human participants at the start of the term. This approach safeguards academic trust while permitting responsible pedagogical experimentation.

  **What's at Stake**
  This vote determines whether our university prioritizes transparent consent or unchecked pedagogical utility in the age of synthetic media. If we permit undisclosed AI, we risk validating Daniel Dennett's warning that fake people erode the trust necessary for human community, potentially causing lasting damage to student-instructor relations. Conversely, a total ban might stifle innovation, so we must find a middle ground that treats AI as a tool without masking its nature.

  **Why This Wins**
  First, transparency respects student autonomy and maintains the covenant of honesty essential to education. Students have a right to know who—or what—they are interacting with, especially in spaces designed for personal expression and peer debate. Undisclosed AI creates a power imbalance where the institution knows something the student doesn't, which undermines the integrity of the learning environment and risks severe backlash if discovered later.

  Second, disclosure actually enhances the pedagogical value rather than diminishing it. When students know they are interacting with an AI, they can engage critically with its output, learning to identify biases or limitations rather than passively accepting them as human peer feedback. This transforms the AI from a deceptive substitute into a visible object of study, aligning with our mission to foster digital literacy alongside subject matter expertise.

  **Strongest Pushback**
  The strongest counterargument is that disclosure undermines the pedagogical efficacy of the tool. If the goal is to simulate human peer engagement to lower anxiety or model discourse, knowing the partner is synthetic may cause students to disengage or treat the interaction as a game rather than genuine practice. From this perspective, AI should be treated like a textbook or software backend: useful precisely because it operates invisibly, and requiring a label stigmatizes the technology and prevents students from experiencing its full benefit.
