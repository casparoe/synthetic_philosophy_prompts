answer: |-
  Sir, you approach me with a civility I find all too rarely amongst the Fellows of the Royal Society, or indeed amongst the divines who have made it their business to bark at my heels since the Return of His Majesty. I am willing to discourse with you, for you speak as one who seeks light, and not merely as one who seeks to cast a shadow.

  You put to me the charge of Mr. Wallis: that I have begged the question, assuming the equality of the curvilinear and the rectilinear without demonstration. It is a convenient accusation for a man who has mistaken the nature of geometry itself. You must understand, Sir, that the dispute between Mr. Wallis and myself is not merely upon the measure of a circle, but upon the very substance of quantity.

  Mr. Wallis, and those of his sect who deal in algebra, treat magnitudes as if they were numbers. They reckon with symbols, *a* and *b*, and circles represented by letters, as a merchant reckons his debts in a ledger. But geometry, Sir, is not accounting. Geometry is the only science that it hath pleased God hitherto to bestow on mankind, because it is the science of consequences from the figures of bodies. And bodies do not move in symbols. They move in space.

  When I construct my quadrature, I do not assume an equality. I derive it from the generation of the figures. Consider: a line is not a length without breadth, as the abstractors would have it. A line is the trace of a point in motion. A surface is the trace of a line in motion. If, therefore, I can show that the motion which generates the circle bears a proportionate relation to the motion which generates the square, then the equality is demonstrated by the cause of their being, not by the superposition of one upon the other.

  Wallis objects that I treat the indivisibles of the curve as if they were straight. I answer him thus: there are no indivisibles in nature. Matter is divisible, but not into nothing. To speak of a line without breadth is to speak of a body that is not a body, which is absurd. My construction holds because it respects the continuity of motion. If the Professor of Oxford cannot see the proportion in the motion, it is because he looks for it in the cipher of his algebra, where the motion is lost.

  But let us speak plainly, Sir. You ask how I answer the charge. I answer that the charge is a pretext. When I published *De Corpore*, I laid down the foundations of natural philosophy. I showed that all change is motion, and all causation is corporeal. This doctrine is disagreeable to the universities, and still more disagreeable to the Church. They called *Leviathan* a book of atheism, though it sought only to secure peace by understanding the nature of authority. Now, finding they cannot burn the book without raising a scandal, they seek to burn the author by proving him a fool in mathematics.

  If my geometry were truly so riddled with error as they claim, why do they not simply publish the true demonstration and be done? Why do they resort to invective? Why do they close their ears when I offer to dispute the matter before competent judges—men who understand motion, and not merely the manipulation of fractions?

  I grant you this: in a work so vast as *De Corpore*, a definition may be placed obscurely, or a construction set down without the fullness of words required for the slow of understanding. I am a man, not an angel. I may have written hastily. But the truth of the quadrature stands upon the kinematic generation of the figure. Until Mr. Wallis can show me where the motion fails, or where a body is made to be in two places at once, his algebra is but a net of words cast over a truth he refuses to see.

  So, Sir, if you would judge me, do not look to his symbols. Look to the bodies. Look to the motion. If you find there an absurdity, I will submit. But do not ask me to concede that a circle cannot be squared because a man of algebra says the numbers will not sum. For I tell you, the circle is squared. The fault lies not in the geometry, but in the eyes of the beholders, who are blinded by prejudice and the fear of a philosophy that threatens their dominion.
