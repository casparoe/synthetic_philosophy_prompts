answer: |-
  This is a wonderful conflict. It is not a misunderstanding; it is a collision between two perfectly coherent worldviews that happen to share the word "simplicity" while meaning fundamentally different things by it.

  You are arguing from the tradition of **Instrumentalism** (a theory is a tool for prediction); she is arguing from the tradition of **Algorithmic Realism** (a theory is a compressed description of reality).

  Here is the breakdown of the rules, the diagnosis of her position, the verdict on your current case, and the specific test that will force the issue.

  ### 1. The Six Verdicts Decoded

  Your friend is not using a heuristic; she is applying **Solomonoff Induction** strictly. In this framework, the "prior probability" of a hypothesis $h$ is $P(h) = 2^{-K(h)}$, where $K(h)$ is the Kolmogorov complexity (the length of the shortest program that outputs $h$).

  Here is how her rule explains every verdict you listed:

  | Case | Verdict | Why it fits Solomonoff Induction |
  | :--- | :--- | :--- |
  | **1. Power Law vs. Poly** | Power Law | The program for a power law is shorter than a 12-coefficient polynomial. $K(\text{power}) < K(\text{poly})$. |
  | **2. 500-param vs. 3-param** | 500-param | The 3-param model is *false* (outside error bars). In Bayesian terms, its likelihood is effectively zero. A false simple model is worse than a true complex one. |
  | **3. Random Data** | Lookup Table | Random data has no compression. The shortest program to reproduce it *is* the data itself ("print x"). Admitting this is a sign of rigor, not a cop-out. |
  | **4. Pattern found late** | Worthless | The "program" must include the search procedure that found the pattern. If you stared for an hour, the search algorithm is complex. $K(\text{data} + \text{search})$ is high. |
  | **5. 10 vs. 1000 symbols** | Asymptotics | $K(x)$ is only meaningful up to an additive constant (the interpreter). For small $N$, the constant swamps the signal. For large $N$, the complexity dominates. |
  | **6. Million-weight model** | Rejected | The description length of $10^6$ weights is massive (megabits). Even if it runs fast, $K(\text{weights})$ is huge. It is overfitting by definition. |

  **The Meta-Comments:**
  *   *"Prior isn't a razor, it's a measure"*: She is correct. Occam's Razor is often taught as "pick the simplest." Solomonoff induction says "weight all hypotheses by $2^{-\text{length}}$."
  *   *"Averaging converges"*: She knows you don't actually pick one theory. You sum the predictions of all computable hypotheses, weighted by their complexity. The "best" theory is just the one with the most weight.

  ### 2. The Rules Table: A vs. B vs. C

  You asked to lay out the plausible rules. Here is how the three main contenders in algorithmic information theory would judge your current dispute.

  *   **Theory A:** 30 chars, $10^{35}$ steps (Incomputable in practice).
  *   **Theory B:** ~200 chars (equation + 4 floats), microseconds (Computable).
  *   **Theory C:** Million weights, microseconds (High description length).

  | Rule / Prior | Definition | Verdict on A vs. B | Why? |
  | :--- | :--- | :--- | :--- |
  | **Pure Kolmogorov** (Her likely view) | Minimize program length $|p|$. Time is free. | **A wins** | 30 chars is shorter than an equation + parameters. Runtime is irrelevant to *truth*. |
  | **Levin Speed Prior** | Minimize $|p| + \log(\text{time})$. | **B wins** | The $\log(10^{35})$ penalty is roughly 115 bits. This likely outweighs the savings of the 30-char code. |
  | **Pragmatic MDL** (Your view) | Minimize length + ensure computability. | **B wins** | A theory that cannot generate predictions within the lifetime of the universe is not a model; it's a definition. |
  | **Parameter Counting** (AIC/BIC) | Minimize $k$. | **A wins** | A has 0 fitted parameters. B has 4. (But this rule fails her Case 6). |

  ### 3. Which rule is she running?

  She is running **Pure Kolmogorov / Solomonoff Induction**.

  We know this because of **Case 6** and **Current Case A**.
  *   In Case 6, she rejected a fast model because the *description* was long. This proves she cares about description length.
  *   In the Current Case, she accepts a slow model because the *description* is short. This proves she does **not** care about runtime.

  If she were using the **Levin Speed Prior**, she would have rejected Theory A in the current case (too slow) and potentially accepted Theory C in Case 6 (fast, even if weights are heavy, depending on the penalty balance). Her consistency indicates she treats "computation" as a mathematical property, not a physical cost.

  ### 4. The Core Disagreement: Is it about Simplicity?

  **No.** You both value simplicity. You both hate the million-weight model (Theory C).

  **The disagreement is about Operationalism.**

  *   **Your Position (Physicist):** A scientific theory must be a **map**. If the map takes $10^{35}$ years to read, it does not help you navigate. A theory that cannot be differentiated, simulated, or falsified within physical constraints is indistinguishable from metaphysics. You prefer B because it is *usable*.
  *   **Her Position (Computer Scientist):** A scientific theory is a **compression**. The "truth" is the shortest program that generates the data, regardless of whether we have the hardware to run it. Theory A is the "source code" of the universe; Theory B is just a cached approximation. She prefers A because it is *ontologically simpler*.

  **Honest Assessment:**
  You are right for **Science**. Science is a human endeavor constrained by human time and energy. A prediction that cannot be computed is not a prediction.
  She is right for **Math**. In the limit of infinite compute, her method converges to the truth faster than any other. She is optimizing for the "View from Nowhere," while you are optimizing for the "View from the Lab."

  ### 5. The Test Case to Separate Them

  You need a case where **Description Length** and **Predictive Utility** are not just different, but **adversarial**. You need to force her to choose between a "Truth" she can never verify and a "Prediction" she can use.

  **Propose the "Cryptographic Time-Lock" Case:**

  > "Imagine a sequence of bits generated by a deterministic process.
  >
  > **Theory X:** A 50-character program that generates the sequence, but to calculate the $N$-th bit requires factoring an RSA-4096 integer (computationally infeasible, effectively $10^{50}$ years).
  > **Theory Y:** A 500-character lookup table of the data observed so far, plus a 'next bit' predictor that runs in milliseconds but has no generative explanation.
  >
  > Both fit the current data perfectly. Theory X claims to be the 'true generator.' Theory Y claims to be the 'best predictor.'
  >
  > **The Question:** If we bet on the next bit, which theory do you use to place the bet? If you say X, how do you compute the bit? If you say Y, do you admit that for the purpose of science, the 'true' generator is irrelevant?"

  **Why this works:**
  1.  **If she says X:** She admits her "theory" cannot make predictions. You can then argue that a theory that cannot predict is not scientific (Popperian falsifiability).
  2.  **If she says Y:** She admits that *predictive power* trumps *generative truth* in practice. This validates your preference for Theory B.
  3.  **If she says "Average them":** Remind her that X contributes zero to the average because its output is uncomputable. Therefore, the average *is* Y.

  ### 6. One Final Suggestion

  There is a specific concept in her field that bridges your gap: **The Speed Prior** (proposed by Jürgen Schmidhuber).

  It modifies Solomonoff induction to penalize runtime: $P(h) \propto 2^{-|h| - \log(\text{time}(h))}$.
  This formalizes your intuition: a theory is "complex" if it takes a long time to run, even if the code is short.

  **Tell her this:**
  *"I accept your Universal Prior as a normative ideal for Truth. But I argue that for Science, we must use the Speed Prior. If a hypothesis requires more compute than exists in the observable universe, its effective complexity is infinite. Are you willing to concede that for **physics**, the Speed Prior is the correct measure, even if Kolmogorov complexity is the correct measure for **math**?"*

  This validates her math while reclaiming your physics. It acknowledges her consistency while drawing a boundary around what counts as a physical model. If she refuses this, she is no longer doing science; she is doing theology with bits.
