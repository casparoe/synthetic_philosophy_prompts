answer: |-
  Good evening, everyone. For those who don't know me, I'm one of [Advisor's Name]'s grad students. Looking around this room, I see a fascinating divide. On one side, her family, who know her as the woman who never took a vacation. On the other, her students, who know her as the scholar who spent thirty years explaining *why* she never took a vacation.

  [Advisor's Name] built her career on hyperbolic discounting. The standard view in economics used to be that when we choose immediate gratification over long-term reward, it's a cognitive bug. A flaw. We *should* be saving for later. But [Advisor's Name] argued something radical. She proposed that steep discounting isn't irrational. It's a rational mortality calibration. Essentially, we value the present more heavily because it is the only time we are guaranteed to exist. To ignore the present for a future that isn't promised isn't discipline; it's a bad bet.

  I know some of you in the family might look at her work habits and see an obsession. You saw a woman who didn't "save" time for leisure. But through the lens of her own work, she wasn't neglecting her life; she was inhabiting it fully. She understood that the "future self" is a theoretical construct. She once joked that weakness of will isn't really a weakness at all—it's just a democratic dispute. Your present self and your future self are different voters with different constituencies, and for thirty years, she let the present voter win the election.

  She poured that urgency into us. She taught us that if you want something done, you do it now, not because you're anxious, but because *now* is the only currency that spends.

  But here is the twist. A theory is a map, not the territory. For thirty years, she proved that the present matters most. But retirement is the luxury of changing the equation. It is the moment where you decide that the future voter deserves a voice, too. It's the moment you decide that the survival probability is high enough, and the reward is sweet enough, to finally invest in the "later."

  So, to her family: She wasn't withholding rest from you; she was investing discovery in us. And to [Advisor's Name]: You have spent a lifetime validating the present. You have earned the right to let the future win for a change. We hope you find that the future self you meet there is someone worth knowing.

  Please raise your glasses. To the present moment, which we share tonight, and to the future, which belongs to you. Cheers.
