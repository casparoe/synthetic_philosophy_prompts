  3.  **Identify the Philosophical Flaws (The "Diagnosis"):**
      *   *The Core Issue:* The argument conflates *ontology* (what the thing *is*) with *epistemology* (what we *know* about the thing) and *normative expectations* (what we *promise* about the thing).
      *   *Premise (1) - The "Essential Nature" Trap:* This is the weakest link. In action theory and bioethics, consent is not to an ontological essence but to a *description under a specific framework*. The "object of consent" is not the physical intervention in its totality (God's eye view), but the intervention *as described within the current scientific paradigm*.
      *   *Premise (3) - Retroactive Constitution:* Just because we *later* discover a mechanism doesn't mean it was part of the *agreed-upon description* at $t_0$. This is a "retrospective determinism" error.
