  A formal logician named Dave was obsessed with the MU puzzle. He sat in front of his whiteboard, marker in hand, staring at the string **MI**.

  "Okay," Dave muttered. "Rule 2: Double after M. So **MI** becomes **MII**."
  He wrote it down.
  "Rule 2 again: **MII** becomes **MIIII**."
  "Rule 2 again: **MIIII** becomes **MIIIIIIII**."
  He paused, counting the Is. "Eight Is. Rule 3 says I can replace **III** with **U**. So I'll swap three of them. Now I have **MUIIIII**."
  He swapped another three. "Now **MUUII**."
  He grinned. "Rule 4! Drop the **UU**!"
  He erased the Us. "Now I'm back to **MII**."

  Dave slammed the marker down. "It's a loop! I can never get rid of the last two Is! I need three Is to make a U, but I only have two! The math doesn't work!"

  His friend Sarah walked in, holding a magnet set. "What's wrong?"

  "The system is broken," Dave said. "I need to turn **MII** into **MU**. But Rule 3 requires three Is to make a U. Rule 4 deletes Us, not Is. I'm stuck modulo 3!"

  Sarah looked at the board. She reached into her pocket, pulled out a single magnetic **I**, and stuck it next to the **MII**.

  "Now you have **MIII**," she said.

  Dave gasped. "You can't do that! That's not Rule 1, Rule 2, Rule 3, or Rule 4! You introduced an external I!"

  "Did I?" Sarah asked. "Look at Rule 2. **Mx → Mxx**. It says double the string after M. It doesn't say *how*."

  "That's not how doubling works!"

  "Isn't it?" Sarah tapped the new **I**. "I just optimized the duplication process. Now apply Rule 3."

  Dave hesitated, then swapped the **III** for a **U**. The board read **MU**.

  "You cheated," Dave said. "You broke the formal system."

  "No," Sarah smiled. "I JOOTSed. You were stuck thinking the *tokens* were the system. I realized the *rules* were just suggestions on how to move tokens. Rule 4 says 'Drop UU'. It implies the Us go somewhere. I just retrieved an I from the 'somewhere'."

  Dave stared at the board. "So the solution wasn't to derive MU..."

  "No," Sarah said. "The solution was to realize M stands for 'Make', and I stands for 'Input'. You were trying to process the Input without ever adding more."

  Dave sighed. "So I failed the puzzle?"

  "No," Sarah said. "You just proved the system is incomplete. Now buy me lunch."

  "Why?"

  "Because Rule 5 states: **If Friend solves MU, Friend gets Pizza**."

  Dave blinked. "That's not a rule!"

  Sarah pointed at the door. "JOOTS, Dave. JOOTS."
