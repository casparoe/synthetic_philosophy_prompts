answer: |-
  You have correctly identified that your committee is oscillating between two distinct decision frameworks. You aren't running one rule with exceptions; you are running two conflicting rules and selecting between them based on the *type of evidence* available in each case.

  Here is the breakdown of your two rules, where this new case fits, and how to resolve it consistently.

  ### 1. The Two Rules You Are Running

  **Rule A: The Historian's Principle (Rational Obsolescence)**
  *   **Logic:** A rule is a hypothesis about risk. If the risk is proven false or mitigated (the "reason" is dead), the rule should be deleted to reduce friction.
  *   **When you use it:** When the *origin* is known and the *ecosystem impact* is low or unknown.
  *   **Precedents:**
      *   *Internal Framework (Deleted):* Reason dead, no ecosystem growth.
      *   *Disbanded Team Rule (Deleted):* Reason dead, interaction trace incomplete (you accepted the risk of unknown interactions).

  **Rule B: The Ecologist's Principle (Structural Accretion)**
  *   **Logic:** A rule is a load-bearing wall in the socio-technical system. Even if the original blueprint is wrong, if the current inhabitants lean on it, removing it causes collapse.
  *   **When you use it:** When the *origin* is unknown OR the *ecosystem impact* is known and significant.
  *   **Precedents:**
      *   *DB Migration Sign-off (Kept):* Origin unknown (Classic Chesterton).
      *   *Library Ban (Kept):* Reason dead, but tooling/docs (ecosystem) depended on it.

  ### 2. The Closest Analog

  The closest analog is **the Library Ban (Case 3)**.

  *   **Similarity:** In both cases, the *original rationale* is dead (license resolved vs. 2011 fix implemented). In both cases, the *justification for keeping it* is entirely downstream accretion (tooling/docs vs. runbooks/recovery path).
  *   **Difference:** The Library Ban was deliberate; the Bulk Write Rule was accidental ("accreted out of a default").
  *   **Why it wins:** Your committee's behavior suggests that **coupling trumps intent.** In Case 2 (Framework), you deleted because nothing grew around it. In Case 3 (Library), you kept because things *did* grow around it. The *intent* of the original rule mattered less than the *reality* of the current dependencies.

  In the Bulk Write case, you have identified concrete dependencies (three teams' runbooks, a recovery path). This makes it a **known dependency**, unlike Case 4 (Disbanded Team), where you deleted despite *unknown* interactions. Because the interaction is known and documented, you must treat it like the Library Ban, not the Disbanded Team rule.

  **Verdict for Consistency:** **Keep the rule.**

  ### 3. The Principle You Are Committing To

  If you **Keep** it, you commit to: **"Current Coupling Trumps Original Intent."**
  You are acknowledging that engineering processes are living ecosystems. A rule that started as a bug or a default can become a feature if the system adapts to it. You are prioritizing system stability over process purity.

  If you **Delete** it, you commit to: **"Rational Hygiene Trumps Inertia."**
  You are asserting that rules must be justified by current risk, not historical accident. You are willing to break the runbooks to force teams to validate if that recovery path is actually needed. This is a "Chaos Engineering" approach to process.

  **Recommendation:** Given your track record (specifically Case 3), **Keeping** is the consistent choice. You have established that documented dependencies constitute a valid reason to retain a rule, even if the origin story is dead.

  ### 4. The "Fence Nobody Built" (Chesterton's Nuance)

  You asked if the fact that "nobody chose it deliberately" changes the answer.

  **Yes, it changes the *philosophy*, but not the *verdict*.**

  Chesterton's Fence assumes a **Builder**: *"Do not remove a fence until you know why it was put there."* It presumes wisdom in the past.
  Your situation describes a **Stalagmite**: A constraint that grew from the floor up due to environmental pressure (a default script), not a Builder.

  However, Chesterton's logic relies on the *cost of removal*, not the *virtue of the builder*.
  *   **Classic Chesterton:** Don't remove it because the Builder might know something you don't.
  *   **Your Case:** Don't remove it because the *Hikers* (the three teams) have tied their tents to it.

  If you delete a fence a Builder put up, you ignore wisdom. If you delete a fence that accreted naturally, you ignore **emergent behavior**. In complex systems, emergent behavior is often as critical as designed behavior. The runbooks pointing at this rule are evidence that the system has *self-organized* around this constraint.

  So, the principle shifts from **"Respect the Ancestors"** to **"Respect the Tenants."**

  ### 5. The Case That Settles It

  You currently have a conflict between Rule A (Reason is dead -> Delete) and Rule B (Dependency exists -> Keep). To resolve this tension for *future* cases, you need to determine if the dependency is **valid** or **zombie**.

  The settling case is a **Controlled Fire Drill.**

  Do not just delete the rule. Do not just keep it. **Test the Recovery Path.**
  1.  **Announce:** "We are suspending the bulk write block for a 48-hour window in a staging environment."
  2.  **Simulate:** Trigger the condition that requires the "rarely used recovery path."
  3.  **Observe:**
      *   **If the recovery path works without the block:** The rule is dead weight. The runbooks are wrong. **Delete the rule and update the runbooks.** (This aligns with Rational Obsolescence).
      *   **If the recovery path fails or the system behaves unpredictably:** The rule is load-bearing. The "accident" became a feature. **Keep the rule.** (This aligns with Structural Accretion).

  **Why this settles it:**
  This moves the decision from *speculation* ("We think it's load bearing") to *empiricism* ("We know it is/isn't").
  *   If you Keep without testing, you are prioritizing Case 3 (Library) over Case 2 (Framework).
  *   If you Delete without testing, you are prioritizing Case 4 (Disbanded Team) over Case 3 (Library).

  **Final Advice:**
  To stay consistent with your **Library Ban** precedent (which is the strongest analog for known dependencies), you should **Keep the rule for now**, but immediately schedule the **Fire Drill**.

  If you delete it now without validating the recovery path, you are violating the precedent set by the Library Ban, where you acknowledged that *downstream tooling* validates a rule even when *upstream rationale* does not. The runbooks are your tooling. Respect the hikers, even if the fence was a mistake.
