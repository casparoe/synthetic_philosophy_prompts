      *   Chesterton's Fence assumes a builder put it there for a reason.
      *   User's insight: "The fence nobody built." If it accreted from a default, there was no builder.
      *   *Implication:* Classic Chesterton doesn't apply. You don't respect a fence that appeared by erosion or accident. However, *hikers* might now be using it to hold up a tent (the runbooks/recovery path). So it's not about the *builder*, it's about the *current users*.

  7.  **Evaluate Consistency:**
      *   If they **Delete**: They align with Case 2 and Case 4 (Reason dead = delete). They prioritize rationality over inertia. Risk: Breaking the recovery path.
      *   If they **Keep**: They align with Case 1 and Case 3 (Uncertainty/Dependency = keep). They prioritize stability over purity. Risk: Maintaining dead weight that might hide other issues.
