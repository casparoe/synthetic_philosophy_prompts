      *   *Which is stronger?* Case 3 is stronger because the dependency is *identified*. In Case 4, the dependency was *unknown*. Knowing the dependency exists (runbooks) makes the risk concrete, not abstract. Therefore, **Keep** is the more consistent move *if* you value the Library Ban precedent.
