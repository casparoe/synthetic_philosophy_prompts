      *   *Verdict:* The "Runbook/Recovery Path" dependency makes it look more like Case 3 (Library Ban) than Case 4. In Case 4, they *couldn't* trace interactions. Here, they *have* traced an interaction (recovery path), even if it's rare.
      *   *However*, the "Accreted Default" aspect is unique.

