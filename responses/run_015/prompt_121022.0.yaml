prompt: |-
  Consider Aristotle's classic problem of future contingents, introduced through the sea-battle example: if it is now true that there will be a naval battle tomorrow, then the battle appears unavoidable, threatening our intuition that the future is open. Rather than rehearsing the standard fatalist objection, construct a conceptual issue that emerges only when we reconstruct this argument inside a branching-time framework with hidden indexicality. Specifically, examine the tension between maintaining present bivalence and preserving cross-branch identity for future-tensed propositions: in one branch a speaker utters "there will be a sea battle tomorrow," and in another branch—where the battle is averted—the same speaker might utter the same sentence, but the indexical "tomorrow" picks out a different temporal location, so the proposition expressed may not be the very same one evaluated for truth now. Give a concrete example that makes this conflict explicit, showing how the demand that every present-tensed claim about the future be either true or false can clash with the idea that averted branches contain not false versions of the same claim, but different claims altogether. Keep the analysis conceptual rather than historical; do not provide citations, bibliographies, or references to specific scholars. End your response with a single line beginning "Summary:" followed by a one-sentence distillation of the conceptual issue you have identified.
reasoning: |-
