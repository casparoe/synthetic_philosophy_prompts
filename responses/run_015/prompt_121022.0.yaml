answer: |-
  To construct this conceptual issue, we must situate the sea-battle example within a branching-time model where moments are not linear points but nodes from which multiple histories diverge. In this framework, the temporal indexical "tomorrow" does not merely designate a fixed coordinate on a universal timeline; rather, it functions as a hidden indexical that picks out the immediate future relative to the specific history being traversed. This creates a tension between the logical requirement for present bivalence—that a proposition must be determinately true or false at the moment of utterance—and the semantic requirement for cross-branch identity—that the proposition expressed remains the same object of evaluation regardless of which future branch is realized.

  Consider a concrete example involving a commander, Alice, who speaks at noon on Monday. She utters the sentence, "A sea battle occurs tomorrow." From this moment, time branches into two distinct histories: History $H_1$, where a battle occurs on Tuesday, and History $H_2$, where peace prevails on Tuesday.

  If we demand present bivalence, we assert that at noon on Monday, Alice's utterance expresses a single proposition $P$ that is already either true or false. For $P$ to bear a truth value now, its content must be fixed. This implies that the indexical "tomorrow" rigidly designates a specific temporal interval independent of the branching structure. However, if "tomorrow" is rigid, then in $H_2$, the proposition $P$ is simply false. This preserves the identity of the claim across branches but threatens the openness of the future, as the truth value is settled prior to the branch selection.

  The conceptual issue arises when we attempt to preserve the intuition that the future is open by arguing that the averted branch contains not a false version of the same claim, but a different claim altogether. On this view, in $H_1$, Alice expresses proposition $P_1$ ("A battle occurs on Tuesday-in-$H_1$"), and in $H_2$, she expresses proposition $P_2$ ("A battle occurs on Tuesday-in-$H_2$"). Because the reference of "tomorrow" is sensitive to the history, the content of the utterance is not fixed at the moment of speaking but is instead deferred until a history is actualized.

  Here lies the conflict: The demand for present bivalence requires that the proposition be fully constituted at the moment of utterance to accept a truth value. However, the thesis that averted branches contain different claims implies that the proposition is *not* fully constituted at the moment of utterance, as its content depends on which branch becomes actual. If the content shifts based on the outcome, there is no single, stable object available at noon on Monday to be labeled "true" or "false." We are left with a dilemma: either we accept a stable proposition and lose the genuine openness of the branches (since the truth value is fixed before the split), or we accept the branching sensitivity of the indexical and lose present bivalence (since there is no single proposition to evaluate until the branch is chosen). The attempt to maintain both that every claim is bivalent now and that the content of the claim depends on the future branch results in a semantic contradiction where the utterance is simultaneously required to be determinate for logic's sake and indeterminate for ontology's sake.

  Summary: The conceptual issue is that enforcing present bivalence requires future-tensed propositions to have fixed content now, while treating averted branches as containing different claims renders that content dependent on future outcomes, making present truth-evaluation impossible.
