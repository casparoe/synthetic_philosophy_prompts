      *   *Idea:* They give a range (Low-High). If the truth is in the range, they get points. If outside, zero. Narrower range = more points. This encourages calibrated confidence.
      *   **Meta-Forecast:** Before seeing data, predict how much your estimate will change.

  3.  **Drafting the Plan (Iterative Process):**

