      *   **Goal:** Teach the value of outside-view forecasting vs. inside-view planning, specifically highlighting the ambiguity of choosing reference classes and the complexity of adjusting for known biases.
      *   **Specific Requirements:**
          *   Runnable activity (4-5 groups).
          *   Real task (doable in 10-30 mins, portable materials).
          *   Sequence: Commit to inside-view -> Get historical data (sortable into two defensible reference classes with different medians) -> Some data flagged as "warned groups" -> Predict own estimate shift -> Scoring rule rewarding honest distributions.
          *   Debrief: Map moments to concepts, predict failure modes (anchoring, collusion, etc.), address limitations (stacked deck, strategic hedging).
