answer: |-
  # Workshop Plan: The Calibration Challenge

  **Target:** 18 First-Year PhD Students (Mixed Discipline)
  **Time:** 75 Minutes
  **Goal:** Demonstrate the tension between Inside-View planning and Outside-View base rates, specifically highlighting reference class ambiguity and the "warning paradox."
  **Language:** American English

  ---

  ## 1. Materials List

  **For the Facilitator:**
  *   **Stopwatch:** 1 (physical, not phone).
  *   **The Deck:** 20 printed cards (see *Appendix A*).
  *   **Whiteboard/Flipchart:** For scoring and definitions.
  *   **Stakes:** 4 chocolate bars (winners), 1 "Forfeit Token" (losers).
  *   **Handouts:** 1 per group (see *Appendix B*).

  **Per Group (4 Groups of 4–5 students):**
  *   **Index Cards:** 20 standard lined cards.
  *   **Tape:** 1 roll of masking tape (approx. 12 inches pre-cut per group to save time).
  *   **Scissors:** 1 pair.
  *   **Ruler:** 1 (for verification).
  *   **Weight:** 1 small object (e.g., a heavy marker or the chocolate bar) to test stability.

  ---

  ## 2. Minute-by-Minute Run Sheet

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00:00–00:05** | **Intro** | Welcome. No phones. Explain the goal: "We are testing prediction accuracy, not engineering skills." Split into 4 groups. |
  | **00:05–00:10** | **Task Brief** | Reveal the task: **The Index Card Tower.** Build the tallest free-standing structure using *only* the provided cards and tape. Must stand for 10 seconds and support the weight on top. |
  | **00:10–00:20** | **Round 1: Inside View** | Groups discuss *how* they will build it. They must commit to a **Time Estimate Range** (Low–High minutes) to complete the task successfully. Write this on the Handout. **No data yet.** |
  | **00:20–00:25** | **Meta-Forecast** | Before seeing data, groups answer Handout Q2: "Once you see historical data, how many minutes do you expect your estimate to shift? (Up or Down)." |
  | **00:25–00:35** | **Data Reveal** | Hand out the **Historical Deck**. Groups sort the cards. They will find ambiguity (see *Design Notes*). They must decide which data to trust. |
  | **00:35–00:45** | **Round 2: Outside View** | Groups revise their Time Estimate Range based on the data. Record the new range and the reason for the shift. |
  | **00:45–01:05** | **The Build** | Start the stopwatch. Groups build. Facilitator monitors rules (no talking optional, but keep it open for now). Stop when all finish or 20 mins elapses. Record actual times. |
  | **01:05–01:10** | **Scoring** | Calculate scores using the **Range Rule** (see *Handout*). Distribute chocolate. Assign forfeit. |
  | **01:10–01:15** | **Debrief** | Reveal the jargon (Planning Fallacy, Reference Class Forecasting, Kahneman). Address limitations and failure modes. |

  ---

  ## 3. Activity Design Notes (Facilitator Only)

  ### The Task: Index Card Tower
  *   **Why:** It requires dexterity and planning. It is prone to "rework" (collapse and rebuild), which is the main driver of time variance.
  *   **Difficulty:** Calibrate this beforehand. 20 cards usually takes novices 12–18 minutes. Experts (engineers) might do it in 8.

  ### The Historical Deck (Appendix A)
  You have 20 cards representing past groups.
  *   **Class A (Narrow):** "First-Year PhDs, Mixed Discipline." (10 cards).
      *   *Median Time:* 18 minutes.
      *   *Logic:* They overthink the design.
  *   **Class B (Broad):** "General Workshop Participants." (10 cards).
      *   *Median Time:* 12 minutes.
      *   *Logic:* They just start building immediately.
  *   **The "Warned" Variable:** 5 cards across both classes have a **STAR (★)** symbol.
      *   *Text:* "Group was warned about optimism bias before estimating."
      *   *Time:* These groups averaged **20 minutes**.
      *   *The Trap:* Knowing about the bias made them hesitate/over-correct, slowing them down.

  ### The Scoring Rule: "The Confidence Interval"
  Do not use complex Brier scores. Use this linear penalty system to discourage hedging while rewarding calibration.
  *   **Formula:** `Score = 100 - (High Estimate - Low Estimate)`
  *   **Condition:** If the *Actual Time* falls **outside** their range, `Score = -50`.
  *   **Winning:** Highest score wins chocolate. Lowest score gets the forfeit.
  *   **Why:** This forces them to be narrow (confident) but accurate. If they hedge with "1 to 60 minutes," their score is 100 - 59 = 41. If they guess "14 to 16" and hit it, score is 100 - 2 = 98. If they miss, they crash to -50.

  ---

  ## 4. Handout Content (Appendix B)

  **Group Number: _____**

  **Round 1: The Inside View**
  Based on your plan and skills, estimate the time (in minutes) to complete the tower.
  *   Low Estimate: ______
  *   High Estimate: ______
  *   *Strategy Note:* (Briefly describe your build plan) ___________________

  **Meta-Forecast**
  Before looking at the Historical Data Cards:
  *   Do you expect your estimate to go UP or DOWN after seeing the data? ______
  *   By how many minutes? ______

  **Round 2: The Outside View**
  Review the Historical Deck. Sort the data as you see fit. Revise your estimate.
  *   New Low Estimate: ______
  *   New High Estimate: ______
  *   *Reference Class Chosen:* (e.g., "PhDs only" or "All groups") ___________________
  *   *Did you use the "Warned" cards?* [ ] Yes [ ] No
  *   *Why?* __________________________________________________________

  **Scoring**
  *   Actual Time: ______
  *   Range Width: (High - Low) = ______
  *   **Final Score:** (100 - Width) OR (-50 if Actual is outside range) = ______

  ---

  ## 5. The Debrief Script

  ### Part 1: The Reveal (5 Minutes)
  "Okay, put the pens down. Before we talk about who won the chocolate, let's name what just happened.
  1.  **The Planning Fallacy:** Your Round 1 estimates were almost certainly lower than the actual time. You focused on the *plan* (the inside view) rather than the *history* (the outside view).
  2.  **Reference Class Forecasting:** When you got the cards, you had to choose: Were you 'PhDs' (slow, careful) or 'Builders' (fast, messy)? There was no right answer. That ambiguity is where the real work lies.
  3.  **The Warning Paradox:** Some of you saw the Star cards. Those groups knew about the bias, yet they were slower. Why? Because they over-corrected. If I warn you, do you become more accurate, or just more paralyzed?"

  ### Part 2: Predictable Failure Modes (3 Minutes)
  "I've run this before. Here is what likely went wrong in your groups, and what will go wrong in your research:
  *   **Anchoring:** The loudest person in your group probably stated a number first ('I bet we can do this in 10'), and everyone else adjusted around *that*, not the data.
  *   **Collusion:** You might have widened your range in Round 2 just to avoid the -50 penalty. That's strategic hedging, not epistemic modesty.
  *   **Task Variance:** If your tower collapsed once, you blew your estimate. In research, this is 'equipment failure' or 'recruitment issues.' The inside view assumes the plan works; the outside view assumes things break."

  ### Part 3: Addressing the Limitations (4 Minutes)
  "This is the part I need to be honest about. This activity stacks the deck against the Inside View, and you need to know why.

  **1. The 'No Private Info' Problem**
  In this tower task, you had zero private information. You didn't know your own dexterity relative to others. In your PhD, you *do* have private info. You know your coding skills, your archive access, your advisor's speed.
  *   *The Lesson:* The Inside View is not useless. It is just usually overweighted. If you have genuine diagnostic evidence (preliminary data), you deserve to deviate from the base rate. But you must prove you have that evidence. Most of the time, you don't.

  **2. Hedging vs. Modesty**
  Our scoring rule penalized wide ranges, but a clever group could still game it. In real life, saying 'It depends' can be genuine humility or cowardice.
  *   *The Lesson:* Epistemic modesty isn't just widening your confidence intervals. It's saying, 'Here is the base rate, and here is the specific reason I think I'm an outlier.' If you can't name the specific reason, you aren't an outlier. You're just optimistic.

  **3. The Names**
  If you want to read more, search for **Daniel Kahneman**, **The Planning Fallacy**, and **Reference Class Forecasting**. But remember: knowing the names doesn't cure the bias. Seeing the cards does."

  ---

  ## 6. Facilitator Cheat Sheet: Handling Pushback

  **Student:** "But my project is unique. Base rates don't apply."
  **You:** "That is exactly what the PhD groups who took 25 minutes said. Uniqueness is the hallmark of the Inside View. Show me the variable that makes you unique, or assume you're average."

  **Student:** "The 'Warned' cards were a trick. Knowing about bias should help."
  **You:** "In theory, yes. In the data I gave you, it didn't. That's the empirical point. Sometimes awareness leads to paralysis. How will you know which one you are?"

  **Student:** "The scoring rule encouraged us to lie."
  **You:** "Exactly. Metrics drive behavior. If your department measures 'papers published,' you'll slice your data thin. If they measure 'impact,' you'll take risks. Be careful what you optimize for."

  ---

  ## Appendix A: The Historical Deck (Print & Cut)

  *Print 20 cards. Mix them thoroughly before handing out.*

  **Set 1: The "PhD" Class (Narrow)**
  1.  Group: PhD Students | Time: 17 min
  2.  Group: PhD Students | Time: 19 min
  3.  Group: PhD Students | Time: 16 min
  4.  Group: PhD Students | Time: 20 min
  5.  Group: PhD Students | Time: 18 min
  6.  Group: PhD Students | Time: 22 min
  7.  Group: PhD Students | Time: 15 min
  8.  Group: PhD Students | Time: 19 min
  9.  Group: PhD Students | Time: 18 min
  10. Group: PhD Students | Time: 21 min

  **Set 2: The "General" Class (Broad)**
  11. Group: Undergrads | Time: 11 min
  12. Group: Undergrads | Time: 13 min
  13. Group: Undergrads | Time: 10 min
  14. Group: Undergrads | Time: 14 min
  15. Group: Undergrads | Time: 12 min
  16. Group: Undergrads | Time: 15 min
  17. Group: Undergrads | Time: 11 min
  18. Group: Undergrads | Time: 13 min
  19. Group: Undergrads | Time: 12 min
  20. Group: Undergrads | Time: 14 min

  **The "Warned" Overlay (Add a Star ★ to these 5 specific cards)**
  *   *Replace Card #4 (PhD, 20m) with:* **Group: PhD Students (Warned ★) | Time: 24 min**
  *   *Replace Card #6 (PhD, 22m) with:* **Group: PhD Students (Warned ★) | Time: 26 min**
  *   *Replace Card #14 (Undergrad, 14m) with:* **Group: Undergrads (Warned ★) | Time: 18 min**
  *   *Replace Card #16 (Undergrad, 15m) with:* **Group: Undergrads (Warned ★) | Time: 19 min**
  *   *Replace Card #20 (Undergrad, 14m) with:* **Group: Undergrads (Warned ★) | Time: 17 min**

  *(Note: Ensure the "Warned" times are visibly higher than the median of their respective classes to create the paradox.)*
