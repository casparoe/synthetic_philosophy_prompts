      *   *Escape the Dilemma:* I am not forbidding conceptual history; I am forbidding *teleological* conceptual history. We can study Aristotle on his own terms (contextualism) without making him a precursor. This isn't antiquarianism; it's understanding the past as a foreign country, not a immature version of us.
