      *   *Did I address the "3 successors"?* I need to point out that in standard EQM, "3 successors" is suspicious. Decoherence doesn't produce discrete integers of branches. This is a vital insight for the journalist. The scenario *forces* a branch count that EQM usually denies exists. This actually helps Camp 2 (Counting) in the toy model, but Camp 1 (Weight) in the real theory. I must highlight this tension.
      *   *User's Hypothesis:* "Derived from rationality... vs primitive." I should affirm this but add that "primitive" isn't quite right; it's about whether the *normative link* is primitive.

  9.  **Final Plan:**
