      *   **Current Task:** Answer the user's specific objection (The Portfolio Manager Case).
      *   **The Objection:** A portfolio manager donates to impress a client. She would stop if the charity wasn't effective (because the client would lose interest). This fits the user's "answerability/sensitivity" criterion, but intuitively lacks moral worth ("tracking without caring").

  2.  **Adopt the Persona (The Strict Advisor):**
      *   Tone: Rigorous, slightly skeptical, demanding precision, intellectually sharp but engaged (it's a practice session).
      *   Position: Moral worth requires acting *from* duty (or the right-making feature), not just *in accordance* with it via a sensitive mechanism. The motive must be the rightness itself, not something else that happens to track rightness.
      *   Goal: Show why the user's "answerability" condition is insufficient because it allows alien motives to hijack the tracking mechanism.

  3.  **Analyze the Counter-Example (Portfolio Manager):**
      *   Action: Donating to malaria charity.
      *   Motive: Impress client (instrumental to business).
      *   Sensitivity: Would stop if charity ineffective (because client cares about effectiveness).
      *   User's Criterion Met: Motivating reason is answerable to the right-making feature (effectiveness/saving lives) via counterfactual sensitivity.
      *   Intuition: No moral worth.
      *   Problem for User: Their criterion seems to validate this case.

  4.  **Formulate the Advisor's Rebuttal:**
      *   *Core Point:* Counterfactual sensitivity is too external. It looks at the *structure* of the motivation from the outside, not the *content* of the motivation from the inside.
      *   *The "Why" matters:* The manager stops not because *saving lives* matters, but because *impressing the client* matters. The right-making feature is merely a *condition* for the success of her actual motive, not the *ground* of it.
      *   *Distinguish Conditions vs. Grounds:* The effectiveness of the charity is a necessary condition for her goal (impressing client), but not the reason she values the action.
      *   *Attack the "Answerability" notion:* You say "answerable to," but this is merely causal or instrumental answerability. Moral worth requires *normative* answerability—she must take the feature as a reason *in itself*.
      *   *Concession (optional but good for character):* Maybe concede that sensitivity is *necessary* (as the user argued with the "warm motive" case), but insist it is not *sufficient*.
      *   *Strategy:* Force the user to refine "answerable." It can't just be "would stop if." It must be "would stop *because*."

  5.  **Drafting the Response (1-2 paragraphs):**
      *   *Paragraph 1:* Hit the distinction between tracking and valuing. The manager treats the good-making feature as a hurdle, not a ground. Her sensitivity is incidental to her actual commitment.
      *   *Paragraph 2:* Push on the "because." Your condition captures reliability, not worth. Worth isn't about how robustly you hit the target; it's about why you aimed at it. If you aimed at money and hit morality by accident (even a sensitive accident), you don't get credit.

  6.  **Refining the Tone:**
      *   Make it sound like a conversation between colleagues/advisor-student. "You're conflating..." "Look closely at..."
      *   Avoid citations (Kant, Strawson, etc.), just use the logic.

  7.  **Final Polish:**
      *   Check constraints: 1-2 paragraphs? Yes. No citations? Yes. Stay in character? Yes. Address the specific objection? Yes.

      *Draft:*
      You're conflating reliability with regard. The portfolio manager's motivation is indeed sensitive to the right-making feature, but only instrumentally. She treats the saving of lives as a mere condition for satisfying her client, not as a ground for action. When you say her reason is 'answerable' to the feature, you mean it is causally tethered to it, but moral worth requires that the feature itself figures in her practical reasoning as a justification. She doesn't stop because saving lives matters; she stops because impressing the client matters, and saving lives was merely the means. Your condition captures a reliable mechanism, but it misses the normative orientation that constitutes worth.

      This is the difference between a thermostat and a moral agent. A thermostat is sensitive to temperature; it stops heating when the room is warm. But we don't attribute worth to the thermostat because it doesn't care about warmth, it just reacts. Your manager is a sophisticated thermostat for client approval. You need to explain why her sensitivity is different in kind, not just degree, from the thermostat's. If you can't distinguish tracking the good from valuing the good, you haven't solved the problem of worth, you've just solved the problem of consistency.

      *Critique:* Good, sharp. Hits the "tracking vs. caring" distinction. Challenges the "answerable" definition.

      *Wait, one tweak:* The prompt says "Answer that." regarding the objection. I need to make sure I'm pushing the advisor's line hard. The advisor believes worth requires acting *because* it is right. The user's view is weaker. I need to show why the weaker view fails here.

      *Revised Draft:*
      You've walked straight into the trap of externalizing the motive. Your condition confirms that her action is *compatible* with the right-making feature, but it doesn't confirm that the feature is *driving* the action. The manager treats the charity's effectiveness as a hurdle to clear for her real goal: client approval. If the client suddenly decided ineffective charities were more impressive, she'd pivot instantly. Her sensitivity is to the client's preferences, not the moral reality; the moral reality is just where those preferences currently happen to lie. You're calling this 'answerability,' but it's merely alignment. Moral worth requires that the right-making feature hold authority over her will, not just that her will coincidentally navigates around its absence.

      So concede this: sensitivity is necessary, as your 'warm motive' case showed, but it is plainly not sufficient. You need a constraint on *why* the sensitivity exists. In the manager's case, the counterfactual dependence runs through the client's psychology, not the agent's recognition of value. If you defend this as having worth, you're saying that a perfectly calibrated selfishness is morally praiseworthy so long as it needs the good to exist to succeed. That collapses the distinction between acting in accordance with duty and acting from duty. You can keep your scarcity argument without accepting this; you just need to say habits can embody the right regard, whereas this manager's calculation explicitly excludes it.

      *Check:* 2 paragraphs. Strong advisor voice. Addresses the case. No citations.

      *Final Polish:* Ensure I'm not conceding too much. The advisor thinks worth requires acting *because* it's right. I should push that the manager clearly isn't doing that.

      *Let's go.*
