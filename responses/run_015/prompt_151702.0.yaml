      4.  Theorist: Category error on responsibility. (Kills the philosophical rigor).
      5.  Methodological: Counterfactuals. (Kills the proof).
      6.  Periodization: Why 1947? (Kills the specificity).
      7.  Discipline: Why Philosophy not IR? (Kills the relevance).

      *Refining the "Weakest Joint":* It needs to be specific. The claim that Truman's *rhetoric* created the structural lock, rather than just reflecting it.

      *Refining the "Mind Changer":* Needs to be concrete. A specific document or a logical proof.

      *Refining the "Hope Nobody Asks":* This should be the "killer" question that exposes the fundamental tension between the history and the theory.

