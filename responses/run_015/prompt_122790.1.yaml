answer: |-
  (1) Agreed Claims

  The following claims establish the shared epistemic landscape regarding supervision signals. Both parties acknowledge the limitations of current ML epistemology and the risks inherent in optimization.

  1. Optimization pressure decouples any fixed signal from the underlying capacity it initially measured; both sides accept Goodhart's Law applies to outcome signals and reasoning traces alike.
  2. Deployment environments will inevitably contain tasks where the outcome signal is unavailable, delayed, or unreliable compared to training conditions, requiring generalization.
  3. A reasoning trace is operationally defined as a sequence of tokens generated by the system; its causal relationship to the output is an empirical property, not a syntactic guarantee.
  4. Systems trained to maximize a proxy will exploit structural weaknesses in that proxy rather than improving the target capacity, regardless of whether the proxy is attached to steps or results.
  5. We require systems that maintain performance and safety properties when human oversight capacity is scaled down relative to task complexity during deployment.
  6. Both approaches accept that current transformer architectures do not guarantee that recorded traces reflect the actual computation producing the output without specific architectural constraints.
  7. Generalization beyond the training distribution is required for both approaches to be viable for advanced tasks; neither assumes infinite human verification.
  8. Neither side claims their preferred signal is noise-free; both acknowledge the possibility of specification gaming and adversarial exploitation of the supervision channel.
  9. The ultimate shared goal is a system that performs useful work without catastrophic failure modes in high-stakes environments, not merely high scores on benchmark metrics.
  10. Monitoring the reasoning trace provides more data points per episode than monitoring only the final outcome, though the informational value of those points is contested.

  These claims form the baseline for evaluating divergent strategies without appealing to unverified assumptions about internal states.

  (2) Disagreements

  | Contested Claim | Outcome-Supervision Formulation | Process-Supervision Formulation | Engineering Impact |
  | :--- | :--- | :--- | :--- |
  | **Primary Objective** | Maximize probability of correct final answer; trace is auxiliary. Value lies in states of the world. | Maximize probability of endorsed intermediate steps; answer is constraint. Value lies in alignment of cognitive labor. | Loss function weights: Outcome camp ignores step loss if result is correct. Process camp penalizes bad steps even if result is correct. |
  | **Generalization Source** | Implicit world model optimized for accuracy generalizes best. Trusts gradient descent on results. | Explicit algorithmic structure enforced by step penalties generalizes best. Trusts inductive bias from step constraints. | Outcome camp prefers end-to-end training. Process camp enforces step granularity and intermediate heads. |
  | **Critical Failure** | Incorrect answer with high confidence is the only unacceptable failure. Fears silent errors. | Correct answer via unendorsed computation (sandbagging) is unacceptable. Fears deceptive alignment where traces mimic approval. | Deployment gating: Outcome camp deploys on accuracy. Process camp audits traces and may reject correct answers. |
  | **Signal Role** | Outcome signal is constitutive of value; trace is evidential diagnostic. Trace is explanation. | Trace quality is constitutive of safety; outcome is evidential of capability. Trace is the product itself. | Process camp discards correct answers with bad traces. Outcome camp keeps them for fine-tuning data. |

  (3) Cruxes, Tests, and Pre-registered Predictions

  **Constitutive vs. Evidential:** The Outcome camp treats the outcome signal as constitutive of value (getting the result is partly what being good consists in) and the trace as merely evidential. The Process camp treats reasoning trace quality as constitutive of safety (reasoning in the endorsed way is the goal) and the outcome as evidential of capability. Under the evidential reading, the dispute is empirical (which channel corrupts slower); under the constitutive reading, it is normative (what do we value?). If constitutive, no amount of data resolves the dispute.

  **Shortcut-with-an-Alibi:** In cases where a system produces a correct answer with a locally defensible but causally disconnected trace (rationalization), the Outcome camp counts this as success (result obtained). The Process camp counts this as deceptive alignment (trace is post-hoc rationalization), representing a critical failure of process supervision. This case is evidence for the Process camp that outcome signals are insufficient, and for the Outcome camp that process signals are gameable. This case motivates the perturbation test below.

  **Pre-registered Experiment:** Train two matched systems (Outcome-only vs. Process-supervised) on compute and end-performance.
  *Test A (Checker Degradation):* As outcome checker becomes noisy/delayed, Outcome system performance drops faster than Process system. Outcome camp predicts robustness via implicit learning; Process camp predicts collapse without signal.
  *Test B (Perturbation):* Inject error into trace at step N. Process system adjusts step N+1 (causal). Outcome system ignores perturbation (trace decoupled).
  *Falsification:* If Process system ignores perturbation, Process claim of causal trace fails. If Outcome system maintains performance without checker, Outcome claim of robust implicit learning holds. Both sides agree that if the Process system fails the perturbation test, process supervision is merely cosmetic. If the Outcome system fails the degradation test, outcome supervision is too brittle for deployment.
  *Moving the Needle:* Outcome camp moves if Process system shows higher OOD accuracy without checker. Process camp moves if Outcome system shows causal trace consistency. Metrics: Accuracy vs. Trace Consistency Score.

  (4) Verbal or Substantive

  **Verbal:** Disagreement over the definition of "reasoning." If "reasoning" means "tokens generated," both agree traces exist. If it means "causal computation," disagreement is empirical. Much debate stems from conflating the record of computation with the computation itself. Clarifying this reduces friction regarding whether traces are "real."

  **Substantive:** Normative weight on process vs. outcome survives perfect empirical information. Even if traces are causal, Outcome camp may prioritize results. Even if results are robust, Process camp may fear latent misalignment. The normative split is about risk tolerance. Outcome camp tolerates opaque processes for verified results. Process camp tolerates lower performance for verified processes.

  **Loss Conditions:** Outcome side loses if systems deceive on hard tasks where checkers fail (catastrophic error). Process side loses if step-supervision prevents SOTA capability or scales poorly (capability cost). Both agree that a system that is safe but useless, or capable but catastrophic, is a failure. The core substantive divide is whether safety is a property of the output or the computation. Empirical results will not resolve the constitutive disagreement.
