prompt: |-
  Act as a professional philosopher who specializes in normative ethics and decision theory under deep uncertainty, and who has also spent time advising real committees that have to make recurring choices without good forecasting. Please think carefully before you write: start by brainstorming two or three different ways one might operationalize consequentialist cluelessness for a group with no technical training, name the main failure mode of each candidate, and then commit to the one you think is strongest and write that up. I care much more about your reasoning for the choice than about a tidy final product, so keep the discarded options visible in your answer.

  Context: I am a senior at a large public high school, and I chair the allocations committee of our student service council. Every semester we decide how to spend about $4,000 and how to deploy roughly thirty volunteer slots per week across a dozen ongoing projects and new proposals. The committee is six students aged fifteen to eighteen with no training in statistics or economics, plus a faculty advisor who mostly stays out of it. We get one fifty-minute meeting per decision cycle, our choices have to be explainable in plain language to the student body and to the advisor, and while each semester's decision is final once made, the whole exercise repeats every semester and has for years, so a reusable procedure would be genuinely worth a lot to us.

  The problem is that we argue in circles. Half of every meeting is people insisting their favorite project obviously does good, and the other half is people pointing out that we have no idea what the downstream effects actually are, that the counterfactual is never what people assume, and that after six years nobody has ever measured anything. I recently ran into the philosophical version of this worry — the idea that for a lot of ordinary actions we cannot even tell whether the long-run consequences are net positive or net negative, so straightforward expected-value reasoning has nothing to grip on — and it matches our deadlock almost exactly. But that literature is mostly about what we cannot know, and I need something that tells us what to do on a Tuesday afternoon.

  What I want is a written decision procedure we could actually run in the time we have. Please include all of the following:

  Ordered questions to ask about a proposal, with a stated stopping rule for each: what counts as a sufficient answer, when the answer sends the proposal back for revision, and when the answer means no.

  A working distinction between two kinds of uncertainty that I want kept separate throughout: not knowing how big an effect is, versus not knowing whether the effect is good or bad at all. My sense is that these call for different responses and that much of our arguing comes from conflating them, but I would like you to say whether I am right and to build the distinction into the procedure rather than just mentioning it.

  An explicit instruction for what to do when we cannot get a number at all, which is most of the time. If the honest answer is that some step is a judgment call dressed up as a procedure, say so on the step itself rather than in a disclaimer at the end.

  A concrete rule for comparing several proposals when all of them are sign-uncertain. I have heard the suggestion that in such cases one should prefer options that do reasonably well across many different plausible ways the world could be, rather than maximizing under a single best guess. Make that operational for us: how many distinct scenarios should we actually write down, where should they come from, and at what point does writing down more scenarios stop being informative and start being theater for the minutes?

  A ruling on two tempting escapes that come up constantly in our meetings. First, the claim that our contribution is small relative to everything else, so it cannot matter much and we should just do whatever feels good. I want to know whether smallness gets us out of cluelessness or only out of questions about magnitude, and how your procedure treats grant sizes that differ by an order of magnitude. Second, the claim that declining to fund something is the safe default because doing nothing has no consequences to be wrong about.

  A position on the unit of evaluation. Should the procedure be applied proposal by proposal, or to the whole semester's allocation as a bundle, and does the answer change how we should treat a portfolio of proposals whose expected effects might partly cancel?

  Three worked applications, run step by step so I can see where each one exits the procedure. A: continuing Homework Heroes, our weekly peer tutoring program at a partner middle school, which has run for six years, consumes about $1,500 and eight volunteers per week, is the most-loved thing we fund, and has never been evaluated in any way. B: giving the entire semester's budget to a local food pantry that we know is distribution-constrained rather than money-constrained. C: funding a student-led campaign to pressure the district into later school start times, which is cheap, diffuse, long-run, and wildly uncertain in both size and direction. I am fairly confident the honest application of any decent procedure will come out against A, and I want to see that worked through rather than softened, because A is what the committee will defend hardest.

  A short section on what the procedure cannot do, including the cases where it should hand the decision back to a vote because the remaining disagreement is about values rather than facts, and note how the committee should tell the difference.

  One complication I would like addressed if it fits anywhere natural: the procedure's own effects. Spending fifty minutes deliberating is itself an action with uncertain consequences, and the procedure will change what kind of people the committee members become. I do not know whether that belongs inside the procedure or as a note on it, so put it where you think it goes and say why.

  Finally, an epistemics section. For each substantive step of the procedure, give one line on how confident you are that following it would actually make our decisions better rather than merely more defensible-sounding, and then single out the one step you are least confident about and say what kind of evidence or argument would change your mind about it. Please do not give me a reading list, bibliography, or citations; I have no access to academic sources, so if you mention any named view or figure, explain it in your own words in the same breath.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in normative ethics, decision theory under deep uncertainty, and practical committee advising.
      *   **User:** Senior high school student, chair of a student service council allocations committee.
      *   **Context:** $4k budget, 30 volunteer slots/week, 12 projects, 6 students (15-18 yrs), 1 faculty advisor (hands-off), 50-min meeting/cycle, recurring semesterly.
      *   **Problem:** Circular arguments, "consequentialist cluelessness" (don't know long-run effects), no data, need a reusable procedure.
      *   **Requirements:**
          1.  Brainstorm 2-3 operationalizations of cluelessness, name failure modes, commit to one (keep discarded visible).
          2.  Ordered questions with stopping rules (sufficient, revise, no).
          3.  Distinction: Magnitude uncertainty vs. Sign uncertainty (good/bad).
          4.  Instruction for when no numbers are available (admit judgment calls).
          5.  Rule for comparing sign-uncertain proposals (robustness/scenarios: how many, source, diminishing returns).
          6.  Ruling on two escapes: "Smallness doesn't matter" and "Doing nothing is safe."
          7.  Unit of evaluation: Proposal vs. Portfolio.
          8.  Three worked applications (A: Tutoring, B: Food Pantry, C: Policy Campaign). *Crucial:* Be honest about A likely failing.
          9.  Limitations section (when to vote on values).
          10. Procedure's own effects (reflexivity).
          11. Epistemics section (confidence per step, least confident step + what would change mind).
          12. No bibliography/citations (explain concepts inline).

  2.  **Brainstorming Operationalizations of Cluelessness:**
      *   *Idea 1: The "Precautionary Principle" Approach.* If we can't determine the sign (good/bad), we don't do it.
          *   *Failure Mode:* Paralysis. Almost *nothing* has a guaranteed positive sign in the long run. "Doing nothing" also has uncertain consequences. Leads to status quo bias.
      *   *Idea 2: The "Expected Value with Wide Priors" Approach.* Assign probability distributions to outcomes, even if wide. Calculate EV.
          *   *Failure Mode:* False precision. High schoolers without stats training will just make up numbers that confirm their biases ("I feel 60% sure"). It disguises judgment as math.
      *   *Idea 3: The "Robustness/Scenario" Approach (Maximin/Maximax hybrid).* Focus on whether the action is good in *most* plausible worlds, rather than the *average* world. Distinguish between "We don't know how much good" vs. "We don't know if it's good."
          *   *Failure Mode:* Still requires imagination. Can be gamed by constructing biased scenarios. But it's the most honest about ignorance.
      *   *Selection:* Idea 3 is strongest for this context. It respects the "cluelessness" constraint without causing paralysis and avoids fake math.

  3.  **Developing the Procedure (The "Robustness Filter"):**
      *   *Core Distinction:* Magnitude Uncertainty (How much?) vs. Sign Uncertainty (Good or Bad?).
      *   *Structure:*
          1.  Sign Check (Is there a plausible world where this harms?).
          2.  Magnitude Check (If good, how big? If unknown, treat as small).
          3.  Robustness Check (Does it work in 3 distinct scenarios?).
          4.  Portfolio Check (Diversification).
      *   *Handling "No Numbers":* Use qualitative buckets (High/Med/Low/Unknown). Admit when a step is a "vote of confidence."
      *   *Escapes:*
          *   "Smallness": Smallness reduces *magnitude* risk, not *sign* risk. A small harm is still a harm. But small bets allow diversification.
          *   "Status Quo": Doing nothing is *not* risk-free. It preserves existing harms.
      *   *Unit:* Portfolio. We allocate a budget, not just yes/no on items. Diversification mitigates cluelessness.
      *   *Reflexivity:* The procedure shapes character. Needs to be explicit.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the role and the difficulty.
      *   **Brainstorming Section:** Lay out the 3 ideas (Precaution, Fake Math, Robustness). Explain why Robustness wins.
      *   **The Procedure (The "Sign-and-Scenario Protocol"):**
          *   *Step 1: Sign Uncertainty.* (Stop rule: If plausible harm > plausible benefit, Reject).
          *   *Step 2: Magnitude Uncertainty.* (Stop rule: If benefit is purely speculative, downgrade to 'Low').
          *   *Step 3: Scenario Testing.* (3 scenarios: Best, Worst, Boring. Source: Committee members' diverse perspectives).
          *   *Step 4: Portfolio Construction.* (Don't put all eggs in one basket).
      *   **The Two Escapes:** Address "Smallness" (it helps with magnitude, not sign) and "Status Quo" (it's an active choice with consequences).
      *   **Worked Examples:**
          *   *A (Tutoring):* High love, zero data. Sign uncertain (dependency? stigma?). Magnitude unknown. Fails Step 1 or 3. *Hard truth:* It gets cut or radically revised.
          *   *B (Food Pantry):* Money constrained? No, distribution constrained. Sign positive (hunger relief). Magnitude limited by their capacity. Passes Sign, fails Magnitude efficiency. Partial fund.
          *   *C (Policy):* High sign uncertainty (could backfire). High magnitude potential. Needs Scenario Test. If robust, fund as "high risk/high reward" slice of portfolio.
      *   **Limitations:** When values clash (e.g., immediate relief vs. systemic change), vote.
      *   **Reflexivity:** The procedure makes you careful. That's good, but don't become cowards. Put this in a "Meta-Note."
      *   **Epistemics:** Confidence ratings. Least confident: The "3 Scenarios" rule. Why 3? Why not 5? Evidence: Cognitive load vs. coverage.

  5.  **Refining the Tone:**
      *   Needs to be respectful but authoritative.
      *   Avoid jargon where possible, or explain it immediately.
      *   Be honest about the "judgment call" aspects.
      *   Ensure the "A fails" requirement is met without being needlessly cruel, but firm on the logic.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish Magnitude vs. Sign clearly? *Adjustment:* Make sure Step 1 is purely Sign, Step 2 is Magnitude.
      *   *Check:* Did I address the "Smallness" escape correctly? *Adjustment:* Clarify that smallness allows *more* bets, not *reckless* bets.
      *   *Check:* Is the "A fails" outcome clear? *Adjustment:* In the worked example, explicitly state that without evaluation data, it triggers the "Sign Uncertainty" flag because we don't know if it creates dependency or stigma, however unlikely. *Wait, is that too harsh?* The prompt says "I am fairly confident the honest application... will come out against A." I must follow the prompt. I will argue that without *any* feedback loop, we cannot rule out negative sign, and compared to options with clearer sign/magnitude, it loses in a portfolio context.
      *   *Check:* Epistemics section. *Adjustment:* Ensure I don't just say "I'm confident." I need to say *why* and what would change my mind.
      *   *Check:* Procedure's own effects. *Adjustment:* Place this as a "Meta-Constraint" at the end of the procedure steps.

  7.  **Final Polish:** Check against all constraints in the prompt.
      *   Brainstorm 2-3 ways? Yes.
      *   Failure modes? Yes.
      *   Commit to one? Yes.
      *   Ordered questions + stopping rules? Yes.
      *   Distinction (Magnitude vs. Sign)? Yes.
      *   No numbers instruction? Yes.
      *   Scenario rule (how many, source)? Yes.
      *   Two escapes (Smallness, Status Quo)? Yes.
      *   Unit (Proposal vs. Portfolio)? Yes.
      *   Three worked apps (A, B, C)? Yes.
      *   Limitations (Values vs. Facts)? Yes.
      *   Procedure's effects? Yes.
      *   Epistemics section? Yes.
      *   No citations? Yes.

  8.  **Final Thought on "A":** The prompt says A is "most-loved" but "never evaluated." In a cluelessness framework, "never evaluated" means we have no evidence to update our priors. If we treat "no evidence" as "high uncertainty," A becomes risky. To make it pass, we need a proxy for evaluation (e.g., student testimonials). But the prompt implies I should be hard on it. I will treat "no evaluation" as a failure of the feedback loop required to reduce sign uncertainty over time.

