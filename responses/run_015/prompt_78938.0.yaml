  # DISCUSSION HANDOUT: IS DNA A CODE?
  **Philosophy of Biology | Decision Tree & Taxonomy**

  **Instructions:** Start at **Q1**. Answer based on your intuition about the *case study* provided. Follow the arrows to find your philosophical position.

  ---

  ### THE DECISION TREE

  **Q1. THE SYNTHETIC GENOME CASE**
  *We assemble a complete genome in a lab. It has no evolutionary history and sits in a test tube.*
  **Does it contain "information" immediately (Ordinary Sense: symbols *about* something), or only when a cell reads it (Engineering Sense: a *mapping* we assign)?**

  *   **A. Immediately (Intrinsic/Aboutness):** The DNA has semantic content regardless of context.
      └─> **GO TO Q2**
  *   **B. Only when read (Relational/Mapping):** Information requires a reader or context to exist.
      └─> **GO TO Q2**

  **Q2. THE METHYLATION & NON-CODING CASE**
  *An inherited methylation mark changes the offspring's phenotype without changing DNA sequence. Large stretches of DNA are never transcribed.*
  **In the view you chose in Q1, is DNA privileged as the sole bearer of information, or is the whole developmental system equal?**

  *   **A. DNA is Privileged:** Only the sequence counts as the "code."
      └─> **GO TO Q3**
  *   **B. System is Equal:** Methylation and cellular context bear information just as much as DNA.
      └─> **LEAF: DEVELOPMENTAL SYSTEMS THEORY**

  **Q3. THE MISSING FACTOR CASE**
  *A gene exists, but the protein is never made because a cellular factor is missing.*
  **Does DNA specify the finished trait (like a **Blueprint**), or does it specify a sequence of operations (like a **Recipe**)?**

  *   **A. Blueprint (Product):** DNA describes the final structure.
      └─> **GO TO Q4**
  *   **B. Recipe (Process):** DNA triggers a causal chain of events.
      └─> **LEAF: CAUSAL SPECIFICITY**

  **Q4. THE REASSIGNED CODON / SILENT MUTATION CASE**
  *In some lineages, a codon is reassigned (e.g., Stop → Tryptophan). In others, DNA changes but the protein does not (silent mutation).*
  **Given your "Blueprint" view, is the term "Code" stable enough to keep, or is the mapping too messy?**

  *   **A. Keep it:** It's still a systematic mapping, even if context-dependent.
      └─> **LEAF: ENGINEERING CODE (INSTRUMENTALISM)**
  *   **B. Drop it:** The mapping is too unstable to justify the metaphor.
      └─> **LEAF: ELIMINATIVISM**

  *(Note: If you answered Q1-A and Q2-A, you arrive at **SEMANTIC REALISM** immediately, as you believe DNA has intrinsic meaning regardless of the instability in Q4.)*

  ---

  ### THE POSITIONS (LEAVES)

  | Position | Core Claim | The Awkward Consequence (What you must swallow) |
  | :--- | :--- | :--- |
  | **SEMANTIC REALISM**<br>*(Aboutness)* | DNA has genuine semantic content; triplets *mean* amino acids intrinsically. | You must explain how physics (nucleotides) generates meaning (aboutness) without a mind to interpret it. |
  | **DEVELOPMENTAL SYSTEMS THEORY (DST)**<br>*(Whole System)* | Information is distributed; DNA is no more "informative" than methylation or the cytoplasm. | You lose the ability to say genes do anything special; "information" becomes so broad it risks meaning nothing. |
  | **CAUSAL SPECIFICITY**<br>*(Recipe)* | DNA is a specific difference-maker in a causal process, not a representation. | You must accept DNA is just a "cause" like a spark plug, denying it any special representational status over other causes. |
  | **ENGINEERING CODE**<br>*(Mapping)* | DNA is a code in the Shannon sense: a systematic mapping we observers find useful. | You admit "information" isn't *in* nature but is a tool *we* impose; biology becomes a branch of engineering. |
  | **ELIMINATIVISM**<br>*(Drop the Metaphor)* | "Code" and "Information" are misleading metaphors that obscure actual mechanisms. | You must rewrite biology textbooks without using the words "gene expression" or "genetic information." |

  ---

  ### META-ANALYSIS FOR DISCUSSION LEADERS

  **1. Inseparable Positions (The "Blurry" Lines)**
  *   **Engineering Code vs. Causal Specificity:** These are hard to separate if students define "mapping" loosely.
      *   *Distinction:* Engineering insists on *representation* (symbols standing for things). Causal Specificity insists on *mechanism* (one factor making a specific difference). Ask: "Is the DNA *telling* the cell what to do, or *making* the cell do it?"
  *   **Semantic Realism vs. Engineering:** Both treat DNA as special.
      *   *Distinction:* Realism says the meaning is *in* the DNA (mind-independent). Engineering says the meaning is *assigned* by the user (mind-dependent). Use the **Synthetic Genome** case to force this split.

  **2. Empty / Incoherent Combinations**
  *   **Intrinsic Info (Q1-A) + DST (Q2-B):** *Incoherent.* You cannot claim information is an intrinsic property of DNA *and* claim that non-DNA factors carry the *same* intrinsic information. DST argues information is relational, not intrinsic.
  *   **Blueprint (Q3-A) + Eliminativism (Q4-B):** *Unattractive/Unstable.* If you believe DNA is a Blueprint, you usually think the metaphor works (Engineering). If you think the metaphor fails (Eliminativism), it is usually because the "Blueprint" model is factually wrong (supporting Recipe/Causal Specificity instead).
  *   **Semantic Realism + Reassigned Codons:** *Unexplored/Tense.* If meaning is intrinsic, how can a codon's meaning change evolutionarily without the DNA changing? Realists struggle to explain historical code changes without conceding to the Engineering view.

  **3. Discussion Tip**
  If the room stalls on Q1, ask: *"If we mail the synthetic DNA to an alien civilization that doesn't use proteins, is it still a code?"*
  *   **Yes:** You are a Realist.
  *   **No:** You are an Instrumentalist/Engineering view.
