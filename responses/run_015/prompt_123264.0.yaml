  The stall arises because the parties are answering distinct questions under one label: one addresses the rationality of propositional belief given public evidence, while the other addresses the conditions for authentic interpersonal acquaintance. The evidentialist treats hiddenness as a deficit in public propositional data, assuming revelation aims to secure rational assent to existence claims. Conversely, the personalist treats hiddenness as a mode of interpersonal disclosure, assuming revelation aims to facilitate voluntary relational engagement. Consequently, "evidence" functions differently: for the former, it is coercive proof minimizing reasonable doubt; for the latter, it is inviting presence preserving epistemic freedom.

  This is a substantive clash over epistemic norms and the telos of divine interaction, not merely verbal ambiguity. The evidentialist views epistemic clarity as a requirement of love; the personalist views epistemic coercion as a violation of personhood. Therefore, the disagreement concerns whether divine love prioritizes minimizing reasonable non-belief or maximizing relational authenticity. Each side accepts the descriptive sociology but evaluates its normative significance through incompatible frameworks of permission and obligation.

  Progress requires formally distinguishing the "Problem of Propositional Hiddenness" from the "Problem of Relational Distance." The seminar must ask whether God's primary aim is maximizing correct belief or enabling free relationship. Without agreeing on whether revelation targets the intellect primarily or the will, no resolution is possible, as each side measures success by incompatible metrics: one by universal recognizability, the other by transformative depth. Acknowledging this teleological divergence allows the debate to shift from arguing about evidence to negotiating the nature of divine love.
