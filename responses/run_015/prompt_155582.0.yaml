prompt: |-
  I'm on the capital projects oversight committee for a mid-sized city — me, the city engineer, somebody from finance, two council appointees, and a rotating seat for whichever department's project is on the agenda that month. We see maybe eight to twelve projects a quarter, anywhere from a few hundred thousand to tens of millions, mostly physical construction and mostly software replacements that have gone sideways. Our power is only recommendatory: we write continue / restructure / stop and send it up to council, and council follows us something like nine times out of ten. Two constraints shape everything: we get about thirty or forty minutes per project, and the recommendation has to fit on one page and be readable by a council member who is hearing about the project for the first time and mostly wants to know why the city spent four million dollars and has nothing to show for it.

  I got into an argument with a colleague last week about the dollar auction — you know the one, a dollar gets auctioned but the runner-up also has to pay their final bid, so two people who are each trying to cut their losses end up bidding well past a dollar and both lose. She said that's us, and that it describes every project we've ever let run. I said it isn't, because half the time there's nobody on the other side: we're not bidding against anyone, we're just handing money to a vendor who keeps saying the last twenty percent is right around the corner. We ended up agreeing that some of our projects really do have that structure and some don't, and that the difference matters more than the standard advice does — everything I've read about escalation of commitment and sunk costs bottoms out in "ignore sunk costs," which is true and completely useless to us, because by the time something reaches our desk the spend is gone, and the live question is whether the *remaining* spend is worth it, and the case for that is very often built out of the money that's already gone.

  So I want a procedure, not an essay, and I want it to start with a structure check rather than with "do the future benefits exceed the future costs" (that question always gets answered yes by whoever wants the project). Concretely, what I need: a way to sort a project into something like (a) real rivalry — some other party's money, deadline, or behaviour is part of why continuing looks good; (b) no rival, just a contractor and a slipping schedule; (c) cases where the money already spent genuinely raises the value of finishing, because the permit is grandfathered or the foundation is poured or the data's already migrated and there's no rollback path — plus an actual test that tells (c) apart from the cases where it only feels like that, since "we're too far in to stop now" is the line we hear most and sometimes it's true. Then: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a "stop," and where it hands the decision to a person because it's a values call and not a factual one. I'd like at least two tests that catch escalation specifically rather than just asking whether the project is any good — something like a restart test (would we fund this today as a brand-new proposal from a different department, same remaining cost, same expected benefit) and something that separates the person who authorized the original spend from the person who writes the recommendation — but please say honestly where each test misfires, because the restart test looks to me like it breaks exactly when there is a real completion premium, and I want to know what to do in that case. I also need the exit options spelled out, since "stop" isn't one thing: kill, mothball, descope to something usable, hand it to another body, re-phase — each with different salvage and different politics, and the auction's bid-or-quit-and-lose-everything menu isn't ours. And there has to be a slot for the awkward version of the argument, that finishing is sometimes worth it because a track record of finishing (or of making a contractor eat a change order) has value for every future project we touch: I think that's occasionally real and I also think it's the easiest thing in the world for a project sponsor to abuse, so I want it in the procedure and flagged.

  Then run it on three cases. First, a four-year-old software system replacement at roughly twice its original budget, vendor says it's seventy percent there and needs one more push. Second, a downtown streetscape where a state grant covers sixty percent but only if we finish by a date we now can't hit without more city money, and the state has already changed the rules on us once. Third, a small neighborhood library branch in a district that's been promised one for a decade, thirty percent built, not much left in the budget, and the council member who chairs our committee represents that district — I want the third one to be the case where the procedure says stop and tells me something I won't like, and I want it said plainly instead of hedged. If there's a fourth shape of case the procedure genuinely can't settle, describe that case rather than forcing it through. Please don't give me a catalogue of cognitive biases and don't cite anything; I'll add references myself if I ever write this up, and it has to be runnable in a meeting by people with no economics background who recieve the packet the night before.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case analyses:

  1.  **Analyze the Request:**

      *   **User Role:** Member of a Capital Projects Oversight Committee (mid-sized city).
      *   **Committee Composition:** City Engineer, Finance, 2 Council Appointees, Rotating Dept Rep.
      *   **Scope:** 8-12 projects/quarter, \$0.5M - \$10M+, mostly construction & troubled software.
      *   **Power:** Recommendatory (Continue/Restructure/Stop), Council follows 9/10 times.
      *   **Constraints:** 30-40 mins/project, 1-page recommendation (readable by skeptical Council).
      *   **Core Problem:** Escalation of commitment/Sunk Cost Fallacy. Standard advice ("ignore sunk costs") is useless because the spend is already gone, and the case for finishing often relies on what's already spent.
      *   **Specific Demand:** A *procedure*, not an essay. Must start with a "Structure Check" (Rivalry vs. No Rival vs. Completion Premium).
      *   **Required Elements:**
          *   Sorting mechanism (a, b, c).
          *   Test to distinguish real completion premium from "too far in."
          *   Ordered questions with sufficiency criteria.
          *   Stop points.
          *   Handoff points (values calls).
          *   Two specific escalation tests (Restart Test, Authorization Separation) with known failure modes.
          *   Exit options (Kill, Mothball, Descope, Handoff, Re-phase).
          *   Slot for "Reputation/Precedent" argument (flagged for abuse).
          *   Run on 3 specific cases (Software, Streetscape/Grant, Library/Political).
          *   Case 3 must result in a "Stop" recommendation that is uncomfortable/plain.
          *   Identify a 4th "Unsettled" case shape if applicable.
          *   Tone: Practical, no academic citations, runnable by non-economists.

  2.  **Deconstruct the "Dollar Auction" Disagreement:**

      *   Colleague: It's always a dollar auction (sunk cost trap).
      *   User: Sometimes it's just a vendor slipping (no rival bidder).
      *   Resolution: Need a diagnostic to tell the difference.
      *   *Insight:* The Dollar Auction requires a *competitor* driving the price up to avoid loss. In city projects, the "competitor" is often the *deadline* (grant), the *political capital* (election cycle), or the *vendor* (holding hostage). If it's just a vendor slipping, it's a contract management issue, not necessarily an auction.

  3.  **Drafting the Procedure (The "Oversight Triage Protocol"):**

      *   *Goal:* Fit on one page (conceptually), actionable in 30 mins.
      *   *Phase 1: Structure Check.* Categorize the pressure source.
          *   Type A (Rivalry): Grant deadlines, matching funds, legal mandates.
          *   Type B (Vendor/Drift): No external clock, just "almost done."
          *   Type C (Irreversibility): Physical/Technical lock-in (foundations, data migration).
      *   *Phase 2: The Escalation Tests.*
          *   Test 1: The "Greenfield" Restart. (Would we buy this today?)
          *   Test 2: The "Fresh Eyes" Authorization. (If the original sponsor left, would the new one fund it?)
          *   *Constraint:* Acknowledge where these fail (e.g., Greenfield fails if Type C is real).
      *   *Phase 3: The "Reputation" Clause.* Explicitly handle the "we must finish to save face/credibility" argument.
      *   *Phase 4: Exit Menu.* Define the specific "Stop" variants.
      *   *Phase 5: Decision Logic.* When to recommend what.

  4.  **Refining the Tests (Addressing the User's specific concerns):**

      *   *Restart Test Failure:* It fails when there is a *real* completion premium (Type C). If the foundation is poured, a Greenfield test says "don't build," but the rational choice is "finish."
      *   *Fix:* The procedure must check Type C *before* applying the Restart Test. If Type C is valid, Restart Test is modified to "Would we spend $X to secure $Y asset?" rather than "Would we build this from scratch?"
      *   *Authorization Separation:* Needs to be concrete. "If the Project Sponsor resigned today, would the Interim Sponsor request this specific remaining budget?"

  5.  **Developing the Exit Options:**

      *   Kill: Terminate contract, salvage what exists.
      *   Mothball: Pause, maintain security/safety, revisit in 12 months.
      *   Descope: Cut features/scope to hit budget, deliver *something* usable.
      *   Re-phase: Break into smaller deliverables with independent value.
      *   Handoff: Move to another dept or external body (privatize?).

  6.  **Running the Cases:**

      *   *Case 1: Software (2x budget, 70% done, vendor pushing).*
          *   Structure: Likely Type B (Vendor Drift) masquerading as Type C.
          *   Tests: Restart (No), Auth Separation (No).
          *   Exit: Descope or Handoff (find new vendor).
          *   Rec: Restructure/Descope.
      *   *Case 2: Streetscape (State Grant 60%, Deadline missed, Rules changed).*
          *   Structure: Type A (Rivalry/Grant).
          *   Tests: Restart (Maybe, if grant makes it cheap), Auth Separation (Yes, free money is tempting).
          *   Trap: The "Sunk Cost" here is the *grant*, not the city spend.
          *   Rec: Continue (with strict contingency) OR Stop if risk is too high. Let's make it nuanced. The prompt asks for the procedure to work. If the grant rules changed, the risk is high.
      *   *Case 3: Library (30% built, budget gone, Council Chair's district).*
          *   Structure: Type C (Physical) + Political Pressure.
          *   Tests: Restart (No, budget blown), Auth Separation (No, only Chair cares).
          *   The "Uncomfortable Stop": The procedure must say Stop/Descope even if it looks bad.
          *   Rec: Stop/Mothball. Reason: Cost to finish exceeds value, political pressure is not a valid economic driver.
      *   *Case 4: The Unsettled Case.*
          *   What breaks the model? A project where the *only* value is political survival of the administration, but that survival is necessary for *other* critical city functions. (The "Lesser of Two Evils" scenario).

  7.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Professional, direct, bureaucratic but sharp. No fluff.
      *   *Formatting:* Needs to look like a checklist/handout.
      *   *Constraint Check:* One-page summary feel? I will structure it as a "Protocol Document."
      *   *Specific Request:* "Tell me something I won't like" for Case 3. I need to ensure the recommendation is "Stop" and the reasoning highlights the political trap without being polite about it.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the "Structure Check" distinct enough?
      *   *Fix:* Make sure Type C (Completion Premium) has a hard verification step (e.g., "Show the technical lock-in").
      *   *Critique:* The Restart Test criticism needs to be integrated.
      *   *Fix:* Add a "Override Condition" to the Restart Test. If Type C is verified, Restart Test changes from "Build New?" to "Complete Asset?"
      *   *Critique:* Case 3 needs to be hard.
      *   *Fix:* Don't hedge. State that the political cost of stopping is less than the fiscal cost of finishing.
      *   *Critique:* The "Reputation" argument.
      *   *Fix:* Call it the "Market Signal" clause. Limit it to one use per year or require specific evidence of vendor market impact.

  9.  **Final Polish:** Check against the "no economics background" rule. Avoid terms like "marginal utility." Use "Next Dollar" language. Ensure the "Exit Options" are clearly defined.

  **(Self-Correction on Case 2):** The prompt says the state *changed the rules*. This increases risk. The grant covers 60%, but if we miss the date, we lose it. This is a classic "Good Money after Bad" trap if the date is impossible. I should lean towards "Restructure/Re-phase" or "Stop" if the date is truly impossible. Let's make it a "Continue with Contingency" but highlight the risk. Actually, to show the procedure's strength, if the date *cannot* be hit without more money, and the state is unreliable, the "Rivalry" is an illusion. I'll recommend "Stop/Descope" to show discipline. Wait, the prompt implies the grant *covers* 60% but only *if* we finish. If we can't finish, we lose 60% funding. That's a huge sunk cost of *opportunity*. I will classify this as Type A but flag the "Rule Change" as a risk multiplier.

  **(Self-Correction on Case 3):** The prompt explicitly wants the procedure to say "Stop" and tell the user something they won't like. The uncomfortable truth is usually that the project is a political favor that is no longer fiscally viable, and finishing it sets a precedent that the committee is toothless. I need to write that down clearly.

  **(Self-Correction on Case 4):** What case can't be settled? A project where the "Completion Premium" is purely speculative (e.g., "If we finish this research hub, *maybe* a tech company comes") vs. the hard cost. Or a project where stopping triggers a legal default worse than finishing. Let's go with the "Legal/Contractual Default" trap where the exit cost is higher than the completion cost, but completion has zero value. That's a pure loss minimization math problem, not a value problem. Actually, the prompt asks for a shape the procedure *can't* settle. That implies a values clash. A project where the "Reputation" argument is the *only* value, but it's genuinely vital for the city's credit rating. That's a values call (Finance vs. Service).

  Let's finalize the procedure structure.
  1. Structure Check (A/B/C).
  2. The Two Tests (Restart/Fresh Eyes).
  3. The Reputation Clause (Limited).
  4. Exit Menu.
  5. Decision Matrix.

  Okay, ready to write.
answer: |-
  # OVERSIGHT TRIAGE PROTOCOL (OTP)
  **For:** Capital Projects Oversight Committee
  **Use:** Pre-meeting packet review & 30-minute deliberation
  **Goal:** Distinguish rational completion from escalation of commitment.

  ---

  ## PHASE 1: STRUCTURE CHECK
  *Before discussing benefits, categorize the pressure source. Check only one.*

  **[ ] Type A: External Rivalry (The Grant/Deadline Trap)**
  *   **Definition:** Money or authority outside the city dictates the timeline.
  *   **Indicator:** "If we stop, we lose the state match," "We face legal penalties," "The bond window closes."
  *   **Risk:** We pay to avoid a penalty rather than to gain value.

  **[ ] Type B: Vendor/Process Drift (The "Almost There" Trap)**
  *   **Definition:** No external clock. The pressure comes from the contractor or internal timeline slippage.
  *   **Indicator:** "We are 90% done," "The vendor needs a change order to proceed," "We just need one more sprint."
  *   **Risk:** We are in a Dollar Auction with no second bidder; we are bidding against our own past estimates.

  **[ ] Type C: Irreversibility (The Completion Premium)**
  *   **Definition:** Physical or technical lock-in makes the *partial* asset worthless, but the *complete* asset valuable.
  *   **Indicator:** "Foundation is poured," "Data is migrated to new schema," "Permits expire if work stops."
  *   **Risk:** Confusing *actual* lock-in with *sunk cost* feelings.

  **VERIFICATION STEP FOR TYPE C:**
  *   **The Scrap Test:** If we stop today and sell the assets for parts/scrap, what is the recovery value?
      *   *If >10% of spend:* It is not Type C. It is Type B.
      *   *If <10% of spend:* Proceed to Phase 2.

  ---

  ## PHASE 2: ESCALATION TESTS
  *Apply these tests to the **remaining** spend only.*

  **TEST 1: THE GREENFIELD RESTART**
  *   **Question:** "If this department came to us today with a proposal for the *remaining* work (cost: $X, benefit: $Y), without the context of the past spend, would we fund it?"
  *   **Pass:** Yes, this is a standalone good investment.
  *   **Fail:** No, we would not fund this scope/cost combination today.
  *   **Override:** If **Type C (Irreversibility)** was verified in Phase 1, modify the question: "Would we spend $X to secure the *completed* asset?" (Ignore the cost to start).
  *   **Known Failure Mode:** This test kills projects with high *switching costs*. If a new vendor costs more to onboard than finishing with the current vendor, the Restart Test says "Stop," but the rational choice is "Finish." *Mitigation: Require vendor termination cost estimate in the packet.*

  **TEST 2: THE FRESH EYES AUTHORIZATION**
  *   **Question:** "If the Project Sponsor and Department Head resigned today, would the Interim replacements request this specific remaining budget?"
  *   **Pass:** Yes, the business case stands without the original champions.
  *   **Fail:** No, only the original sponsors are defending the spend.
  *   **Known Failure Mode:** Fails on long-term infrastructure where institutional memory is required to understand value. *Mitigation: Requires written justification from Interim lead.*

  ---

  ## PHASE 3: THE REPUTATION CLAUSE (USE SPARINGLY)
  *   **Argument:** "We must finish to maintain market credibility / vendor relations / voter trust."
  *   **Constraint:** This argument may only be used **once per fiscal year** per department.
  *   **Requirement:** Must provide evidence of *future* cost savings (e.g., "If we default, our bond rating drops," or "No vendor will bid on our next RFP").
  *   **Warning:** If the argument is "It looks bad to stop," this clause is **invalid**. "Looking bad" is not a fiscal return.

  ---

  ## PHASE 4: EXIT MENU
  *Do not recommend "Stop" without selecting an exit path.*

  1.  **Kill:** Terminate contract. Salvage assets. Absorb loss.
  2.  **Mothball:** Secure the site/code. Stop spend. Re-evaluate in 12 months. (Use when market/tech might change).
  3.  **Descope:** Cut features/scope to fit *remaining* budget. Deliver a usable, smaller product.
  4.  **Re-phase:** Break remaining work into independent chunks. Fund Chunk 1 only. Chunk 2 requires new approval.
  5.  **Handoff:** Move project to another department or external body better suited to finish.

  ---

  ## PHASE 5: DECISION LOGIC
  *   **If Type A + Tests Pass:** Recommend **Continue** (Flag risk).
  *   **If Type A + Tests Fail:** Recommend **Restructure** (Negotiate deadline/scope with external party).
  *   **If Type B + Any Test Fails:** Recommend **Stop** (Descope or Kill).
  *   **If Type C + Tests Pass:** Recommend **Continue**.
  *   **If Type C + Tests Fail:** Recommend **Mothball** (Asset exists, but finish cost is too high).
  *   **If Reputation Clause Invoked:** Recommend **Continue** *only if* Finance verifies the claimed future cost savings.

  ---

  # CASE RUN-THROUGHS

  ## CASE 1: The Software Replacement
  *   **Status:** 4 years old, 2x budget, vendor says 70% complete, needs "one more push."
  *   **Structure Check:** **Type B (Vendor Drift).** No external deadline. "70% complete" is vendor-defined, not verified.
  *   **Scrap Test:** Code exists, but proprietary. Recovery value ~0%. (Passes to Phase 2).
  *   **Test 1 (Restart):** Would we buy the "last 30%" of a 4-year-old legacy migration today for the requested cost? **No.** We would likely seek a new platform.
  *   **Test 2 (Fresh Eyes):** Would a new CIO fund this? **No.**
  *   **Reputation Clause:** Vendor claims they won't bid again if we cut them. *Verification:* Market has 5 other qualified vendors. Clause Invalid.
  *   **Exit Option:** **Descope/Handoff.** Identify the minimum viable product (MVP) that works with current spend. Put remaining "nice-to-haves" on hold. Solicit bids from new vendors to finish MVP.
  *   **Recommendation:** **RESTRUCTURE.** Do not fund the "push." Fund a 90-day audit to define MVP.

  ## CASE 2: The Downtown Streetscape
  *   **Status:** State grant covers 60%. Deadline missed. State changed rules. Need city money to finish.
  *   **Structure Check:** **Type A (External Rivalry).** The "rival" is the State Grant Office.
  *   **Test 1 (Restart):** Would we spend 100% city money on this streetscape today? **Maybe.** But the question is: Would we spend the *remaining* 40% to unlock the 60%?
  *   **Test 2 (Fresh Eyes):** Would a new Public Works Director take this risk? **Yes,** because the leverage is too high to ignore.
  *   **Risk Factor:** State changed rules once. Probability of rule change again is non-zero.
  *   **Exit Option:** **Re-phase.** Complete the blocks that are safest/cheapest to finish within the new rules. Leave the high-risk blocks for later.
  *   **Recommendation:** **CONTINUE (Conditional).** Release funds only upon written confirmation from State that rules will not change again. If State refuses, **Mothball** the site.

  ## CASE 3: The Neighborhood Library
  *   **Status:** 30% built. Budget gone. District promised for 10 years. Committee Chair represents this district.
  *   **Structure Check:** **Type C (Irreversibility).** Foundation is poured. A 30% building is a liability, not an asset.
  *   **Test 1 (Restart):** Would we spend the *remaining* required funds (which are now 3x original estimate due to inflation/delay) to finish a library in this specific location? **No.** Demographics have shifted; usage models have changed.
  *   **Test 2 (Fresh Eyes):** If the Committee Chair recused themselves (as they should), would the remaining members fund this? **No.**
  *   **Reputation Clause:** Argument: "Stopping looks like we don't care about this neighborhood."
      *   **Verification:** This is "Looking Bad," not "Fiscal Risk." Clause Invalid.
  *   **The Uncomfortable Truth:** The project is no longer a library; it is a campaign donation built with public funds. The "Completion Premium" is real (you can't use a half-built library), but the *value* of the completed asset is lower than the *cost* to finish it.
  *   **Exit Option:** **Kill/Handoff.** Sell the land. Use salvageable materials.
  *   **Recommendation:** **STOP.**
      *   **Rationale:** The cost to finish exceeds the value of a new, modern facility built elsewhere. Continuing validates the failure of the original budgeting process. The political cost of stopping is high for the Chair, but the fiscal cost of finishing is high for the City. The Committee's duty is to the City budget, not the Chair's re-election.

  ---

  ## THE UNSETTLED CASE SHAPE
  *There is one scenario this procedure cannot resolve.*

  **The "Systemic Dependency" Trap**
  *   **Scenario:** A project that has zero standalone value (fails Restart Test) and has no physical lock-in (fails Type C), but *stopping* it triggers a failure in a *different, critical* city system.
  *   **Example:** A payroll software migration that is botched. Restart Test says "Cancel." But if you cancel, the city cannot pay police officers next month because the old system was already shut down.
  *   **Why OTP Fails:** The "Benefit" of finishing is not the software; it is avoiding civil unrest/lawsuits. This turns a capital project decision into an emergency operations decision.
  *   **Procedure Limit:** In this case, the Committee must recuse. This is no longer a capital oversight question; it is a crisis management question for the City Manager/Mayor. The OTP cannot weigh "civil unrest" against "budget variance" on a one-page form.
  *   **Action:** Flag as **ESCALATED.** Remove from standard agenda. Require full risk assessment from Legal and Emergency Management before any vote.
