  Facing a locked room, the Darwinian breaks against the door, the Skinnerian learns by pain, the Popperian thinks it open, and the Gregorian finds a key. They turn to congratulate the Baldwinian, but he's already outside. "How'd you escape?" they ask. "I didn't," he says. "You learned to open doors so well, my genes forgot they were closed."

  The humor comes from compressing evolutionary time to show how the Baldwinian's inherited instinct renders the Popperian's hard-won individual learning obsolete.

  \answer{Popperian, Baldwinian}
