  The setup
  Grab 32 index cards (two per student: 'C' and 'D'), a bag of poker chips (currency), and a separate 'Mutation Deck' (red cards = swap strategy, blue = stay). Arrange 16 students into 8 fixed pairs. Each student secretly selects a strategy card to play each round, hiding it under their hand until reveal. You act as the Banker and Mutation Engine. The core mechanic is uncertainty: pairs play multiple rounds, but you secretly determine continuation using the Shadow Deck. If a shadow card is drawn, the pairing survives; otherwise, partners are reshuffled randomly. Mutations happen independently via the Mutation Deck, forcing random strategy flips regardless of success. This physicalizes the 'shadow of the future' without explaining it upfront. Keep chips visible on the table to induce competitive pressure. Goal: Accumulate chips. Time: 45 mins play, 30 mins debrief.

  Rules and payoffs
  Standard PD payoffs: Mutual Cooperation (3 chips each), Mutual Defection (1 chip each), Temptation (Defector 5, Cooperator 0). Play proceeds in simultaneous reveals. After each round, draw from the Shadow Deck (hidden from students). 70% chance of continuation (keep partner), 30% break (partner replaced by a copy of a random player's strategy). This creates the iterated vs. one-shot feel without labeling it. Simultaneously, draw from the Mutation Deck for each player. If 'Mutate' hits, they must flip their current strategy preference (if playing C, switch to D next round). No negotiation allowed. Chips stay on table. If a student runs out of chips, they incur debt to stay in. Emphasize strategy cards are private; bluffing is allowed but risky. Crucially, do not tell them the continuation probability. They must infer the 'shadow' length from experience. If they feel the end is near, defection should spike. The game ends abruptly to prevent end-game defection cascades from dominating the whole session.

  The debrief
  Start by asking: "When did you feel safe cooperating?" Expect answers like "when I knew the partner" or "early on." Contrast this with rounds after reshuffles (one-shot feeling). Map the Shadow Deck to the discount parameter $\delta$ in evolutionary models. If $\delta$ is low (high break chance), defection dominates because the future isn't worth enough. Ask about the Mutation Deck: did random flips disrupt stable cooperation clusters? This mirrors genetic drift or exploration noise. Discuss ESS: Defection is the strict ESS in one-shot, but conditional strategies (Tit-for-Tat) become stable in iterated settings with high $\delta$. Highlight the physical tension: holding the 'D' card felt safer when reshuffles happened. Connect to philosophy: Axelrod's tournaments assume fixed strategies, but here strategies mutated and agents learned. Did learning outpace evolution? Finally, question the idealization: real science cooperation isn't just chips; it's reputation. This game isolates structure from social context, showing why institutional design matters for scientific collaboration. Ask them to critique the model: does 'mutation' capture innovation or just error? Is 'reshuffling' accurate for academic networks? This pushes them from gameplay to meta-theory about modeling practices in philosophy of science. Bring up Maynard Smith: an ESS must resist invasion. Did defectors invade cooperative pairs during shadow rounds? Why didn't cooperators wipe out defectors? Because the mutation deck kept reintroducing defection noise. This demonstrates that stability isn't static; it's dynamic equilibrium. Use the chip counts to show variance—did the 'nicest' students win? Usually not. This leads to the hard truth: evolution favors fitness, not morality. Cooperation evolves only because it's profitable under specific structural constraints (shadow of future), not because it's virtuous. Wrap up by linking this to scientific norms: peer review and citation are our 'shadow mechanisms' ensuring cooperation over career spans.

  What will break and what's missing
  First run breakage: Students will peek at cards early. Timing will drag; use a loud timer. Allow talking later to show contract failure. The mutation deck might feel arbitrary. Missing dynamics: True selection. Here, strategies don't reproduce based on fitness; losers stay via debt. Real evolution culls the unfit. Also, fixed pairs limit population mixing compared to a soup model. You can't show frequency-dependent selection properly because population size is fixed at 16. It's a pedagogical tool, not a simulation of replicator dynamics. Don't claim it proves ESS; claim it illustrates stability intuition. The 'shadow' is exogenous (you draw cards), not endogenous (trust built), which simplifies the trust mechanism too much.
