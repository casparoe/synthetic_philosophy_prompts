      *   **Core Subject:** The role of "proportionality" in transitional justice mechanisms, specifically comparing South Africa's Truth and Reconciliation Commission (TRC), Argentina's trials, and Rwanda's *gacaca* courts.
      *   **Specific Focus:** The South African TRC's requirement that acts be "proportionate to the political objective pursued" for amnesty.
      *   **Key Questions:**
          1.  What philosophical commitments does this proportionality gate presuppose about the moral weight of political purpose?
          2.  Does it require instrumental reasoning (consequentialist/utilitarian) weighing rights violations against collective ends, or can it be reconstructed deontologically (political motivation alters the moral *category* rather than magnitude)?
          3.  Is the model internally consistent, given the tension between asking perpetrators to use proportionality calculus while telling victims their suffering cannot be diminished by political objectives?

  2.  **Analyze Question 1: Philosophical Commitments regarding Political Purpose:**

      *   *Premise:* The TRC allowed amnesty *only* if the act was associated with a political objective and proportionate to it.
      *   *Implication:* This acknowledges that political violence exists in a different moral universe than common crime. It grants *some* moral weight to the "cause."
      *   *Commitment:* It presupposes a form of "political realism" or "contextual moralism." It admits that in times of conflict, the standard rules of peacetime morality are strained. It suggests that the *intent* (political liberation vs. personal gain) matters significantly.
      *   *Nuance:* It doesn't say the cause *justifies* anything, but that the cause is a relevant variable in moral accounting.

  3.  **Analyze Question 2: Instrumental vs. Deontological Frameworks:**

      *   *Instrumental (Consequentialist/Utilitarian):* This seems the obvious fit. "The ends justify the means" *to a degree*. If the political goal is valuable enough, and the means are not *too* excessive relative to that goal, amnesty is granted. This looks like a cost-benefit analysis (Violence Cost vs. Political Gain).
      *   *Deontological:* Can this work? Deontology focuses on duties and rules, not outcomes.
      *   *Reconstruction:* Perhaps political motivation changes the *nature* of the act from "murder" to "act of war." In war, killing combatants is permissible (in some frameworks). If the TRC viewed the conflict as a low-intensity war, then proportionality is a *jus in bello* (justice in war) concept, which is deontological in the sense of adhering to the rules of engagement, not necessarily maximizing utility.
      *   *Distinction:* It's not that the rights violation is "worth it" (utilitarian), but that the agent was acting under a different normative framework (combatant vs. criminal). However, the prompt asks if it treats motivation as altering the *category* rather than *magnitude*. Yes, if it's an act of war, it's a different category. But the "proportionality" test suggests magnitude still matters (you can't nuke a village to arrest one person).
      *   *Synthesis:* It's likely a hybrid. It uses deontological categorization (political vs. personal) but instrumental measurement (was the violence too much for the goal?).

  4.  **Analyze Question 3: Internal Consistency (The Tension):**

      *   *The Tension:* Perpetrators must prove proportionality (Political Goal $\ge$ Violence). Victims are told their suffering is absolute and cannot be outweighed by politics (Violence > Any Goal).
      *   *Is it inconsistent?* On the surface, yes. It looks like a double standard.
      *   *Defense of Consistency:* The TRC was performing two different functions simultaneously: *Legal/Political* (granting amnesty to stabilize the state) and *Moral/Therapeutic* (validating victimhood).
      *   *The "Public/Private" Split:* For the *state* to grant amnesty, it uses political calculus. For the *victim* to heal, they need moral absolutism.
      *   *The "Exchange":* Amnesty was traded for Truth. The proportionality test was a hurdle to ensure only "political" crimes got this trade, not psychopathic ones. The message to victims wasn't "your pain is worth less," but "we are sacrificing justice for stability, but we acknowledge your pain is infinite."
      *   *Critique:* Philosophically, it is unstable. It tries to have it both ways: acknowledging the political context to forgive the killer, while denying the political context to honor the victim. This is the "paradox of transitional justice."

  5.  **Drafting the Response (Iterative Process):**

