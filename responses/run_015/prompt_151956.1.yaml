answer: |-
  The South African Truth and Reconciliation Commission's (TRC) use of a proportionality test for amnesty represents one of the most philosophically fraught innovations in transitional justice. By requiring that acts be "proportionate to the political objective pursued," the TRC navigated a narrow path between the Argentine model of absolute legal accountability and the Rwandan model of restorative pragmatism.

  Your inquiry identifies a profound tension: the TRC asked perpetrators to justify violence through a calculus of political utility, while simultaneously assuring victims that their suffering transcended such calculus. To answer your questions, we must dissect the moral ontology of the TRC's framework, its ethical lineage, and its structural coherence.

  ### 1. The Moral Weight of Political Purpose
  The proportionality gate presupposes that **political motivation possesses a distinct moral ontology** separate from personal criminal intent. In standard domestic criminal law, motive is generally irrelevant to guilt (murder is murder, whether for profit or passion). By contrast, the TRC's requirement implies that political violence occupies a different normative category than common crime.

  This presupposes a form of **contextual moralism**. It acknowledges that during periods of systemic conflict (like apartheid), the standard social contract is suspended. In this "state of exception," agents are not merely criminals but combatants or political actors. By granting moral weight to the "political objective," the TRC implicitly recognized that the struggle against apartheid (and the state's defense of it) created a normative environment where violence was not merely pathological but instrumental.

  However, the commitment is limited. The TRC did not grant that political purpose *justifies* the act morally; rather, it grants that political purpose *explains* the act sufficiently to warrant legal indemnity. The moral weight of the purpose is not enough to render the act "good," but it is enough to render it "amnestiable." This suggests a commitment to the idea that **collective political struggles generate a distinct moral liability**, one that is shared by the society that must eventually coexist, rather than borne solely by the individual perpetrator.

  ### 2. Instrumental Reasoning vs. Deontological Reconstruction
  Does this require instrumental reasoning (weighing rights violations against collective ends)? On the surface, yes. Proportionality is inherently a metric of measurement: *Input* (Violence) vs. *Output* (Political Gain). This smells of consequentialism, specifically a rule-utilitarian framework where violence is permissible if it adheres to rules that maximize political liberation without descending into gratuitous cruelty.

  However, the TRC model can be reconstructed within a **deontological framework**, specifically through the lens of **_Jus in Bello_ (Just War Theory)**.
  *   **Instrumental View:** "The violence was worth it because it advanced the cause."
  *   **Deontological View:** "The violence was permissible because it adhered to the moral constraints of conflict."

  In Just War Theory, proportionality is not about whether the war is won (consequentialist), but whether the force used adheres to moral duties regarding non-combatant immunity and necessary force (deontological). If we view the TRC's proportionality test not as "was the goal worth the pain?" but "was the act consistent with the norms of political conflict?", it shifts the category.

  Under this reconstruction, political motivation alters the **moral category** of the act from "murder" to "act of war/conflict." In this category, killing is not inherently absolved, but it is judged by different rules. The proportionality test then becomes a check on *excess*, not a calculation of *value*. It asks: "Was this act a legitimate maneuver within the political conflict, or was it a gratuitous deviation?" This allows the TRC to deny amnesty to those who claimed political motives but acted with psychopathic excess (e.g., the "Walvis Bay 10" or acts of pure torture for pleasure), preserving a deontological boundary against inhumanity while acknowledging the political context.

  ### 3. Internal Consistency: The Paradox of the Victim and the Perpetrator
  This brings us to the crux of your third question: Is the model internally consistent given the simultaneous insistence that victims' suffering cannot be diminished by political objectives?

  **Strictly speaking, the model is logically inconsistent.**
  The TRC operated on two contradictory axioms:
  1.  **For the Perpetrator:** Political context matters. If your violence was proportionate to your political goal, you may be relieved of liability. (Implies: Political goals can offset criminal liability).
  2.  **For the Victim:** No political objective can justify gross human rights violations. (Implies: Political goals cannot offset moral wrongs).

  This creates a **moral asymmetry**. The perpetrator is invited to use a utilitarian calculus to save themselves, while the victim is offered a deontological absolutism to validate their pain.

  **However, this inconsistency may be functionally necessary rather than philosophically accidental.**
  The TRC was not a court of law nor a church, but a hybrid political-moral institution. Its inconsistency reflects the **dual mandate of transitional justice**:
  *   **Forward-looking (Political Stability):** Requires treating perpetrators as political actors to reintegrate them and prevent coup/insurgency. This demands the proportionality calculus.
  *   **Backward-looking (Moral Vindication):** Requires treating victims as rights-bearers whose dignity was absolute. This demands the rejection of political justification.

  The TRC attempted to resolve this by distinguishing between **legal accountability** and **moral responsibility**.
  *   The proportionality test was a gate for *legal amnesty* (the state foregoing prosecution).
  *   The assertion that "no objective justifies violation" was a statement of *moral truth* (the Commission's final report).

  By separating these, the TRC argued that the state could forgive the *crime* for the sake of peace (using proportionality), while society must never forgive the *sin* (rejecting proportionality).

  **The Critique:**
  This separation is fragile. It risks **instrumentalizing the victim**. By asking perpetrators to measure their crimes against political goals to gain freedom, the process implicitly validates the metric the victims are told to reject. If the state grants amnesty based on proportionality, it effectively signals that, in the eyes of the law, the political objective *did* outweigh the victim's right to justice. The victim is told their suffering is infinite, but the legal outcome demonstrates it was quantifiable and tradable.

  ### Conclusion
  The TRC's proportionality gate presupposes that political purpose transforms the **normative status** of the agent (from criminal to combatant) without fully transforming the **moral status** of the act (which remains a "gross violation").

  It relies on a **hybrid ethical framework**: it uses *Jus in Bello* (deontological rules of conflict) to categorize the act, but employs a quasi-utilitarian measurement to assess eligibility for amnesty.

  Ultimately, the model is **internally inconsistent**, but perhaps **dialectically necessary**. It holds two truths in tension: that political violence is understandable within its context (allowing for reintegration), and that human rights violations are never justifiable (allowing for vindication). The friction between these truths is not a bug of the TRC, but a feature of the transition itself. The Commission essentially asked South Africa to accept a "moral remainder"—the unresolved guilt that remains when justice is sacrificed for truth and stability. The proportionality test was the mechanism used to calculate that sacrifice, even as the Commission verbally denied that such a calculation was morally valid.
