          *   *Justification:* This is pragmatic, not purely philosophical. It serves the goal of "Truth" (from perpetrators) and "Dignity" (for victims).
          *   *Critique:* It creates a "moral remainder." The inconsistency is the price paid for peace. It risks instrumentalizing the victim's pain for the sake of the narrative.
      *   *Conclusion:* Summarize. The TRC model is a pragmatic hybrid that sacrifices philosophical purity for political viability. It treats political purpose as a *contextual modifier* (deontological category shift) but measures it with *instrumental tools* (proportionality), creating an inherent tension that reflects the unresolved nature of transitional justice itself.

  6.  **Refining the Argument (Self-Correction during drafting):**

