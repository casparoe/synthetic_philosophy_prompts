      *   **The Setup:** Fair coin tossed until Heads ($n$). Payoff $X_n = (-1)^{n-1} \frac{2^n}{n}$. Probability $P(n) = 1/2^n$.
      *   **Expected Value Calculation:** $E = \sum_{n=1}^{\infty} P(n) X_n = \sum_{n=1}^{\infty} \frac{1}{2^n} (-1)^{n-1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n-1}}{n} = 1 - 1/2 + 1/3 - 1/4 + \dots = \ln(2)$.
