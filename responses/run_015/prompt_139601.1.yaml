  ### The Careenium Causality Instrument

  **Premise:** We all accept that a complete microphysical description of the careenium at time *t* fixes its microphysical state at *t+1*. (Microphysical Closure).

  **Instructions:** Answer the following ten questions with **Yes**, **No**, or **Depends** (where specified). Follow the path to your leaf. Do not look at the position names until you have finished.

  #### The Decision Tree

  **Node 1: The Counterfeit Careenium**
  Consider a system engineered to reproduce the exact substrate trajectories and outward symbol behaviour of a real careenium by brute-force tabulation (lookup table), with no genuine internal dynamics.
  *   **Q:** Does this tabulated system possess genuine symbols?
      *   **Yes:** Go to Node 2.
      *   **No:** Go to Node 3.

  **Node 2: The Silent Observer**
  Consider a careenium existing in a void, with no external interpreters, historians, or users.
  *   **Q:** Do the symbols exist and have meaning in this system?
      *   **Yes:** Go to Node 4.
      *   **No:** (Leaf A: Interpretation-Relativist).

  **Node 3: The Duplicate**
  Consider a careenium whose micro-state is copied exactly to a new location.
  *   **Q:** Does the copy inherit the *meaning* of the original's symbols, or only their shape?
      *   **Meaning:** Go to Node 4.
      *   **Shape Only:** (Leaf B: Exclusionist).

  **Node 4: The Re-graining**
  Consider describing the same careenium at a finer grain (simmballs only) or a coarser grain (symbols only).
  *   **Q:** Is the boundary between "substrate" and "symbol" an objective feature of the world, or just a choice of description?
      *   **Objective:** Go to Node 5.
      *   **Description:** (Leaf C: Descriptivist).

  **Node 5: The Exclusion**
  Given that microphysics fixes the future, do the symbols exert any causal power *at all*?
  *   **Yes:** Go to Node 6.
      *   **No:** (Leaf D: Reductionist/Identity). *(Note: Here "No" means "No *additional* power, because they just *are* the substrate.")*

  **Node 6: The Strong Downward**
  Consider a case where a symbol-state appears to determine an outcome that micro-laws alone leave open (e.g., triggering a quantum event).
  *   **Q:** Do symbols ever add new forces or laws not found in the micro-physics?
      *   **Yes:** (Leaf E: Strong Emergentist).
      *   **No:** Go to Node 7.

  **Node 7: The Clamped Symbol**
  An experimenter holds a symbol-configuration in place against the substrate's tendencies; the substrate reorganizes around it.
  *   **Q:** Is the *symbol* the cause of the reorganization, or the *experimenter's hand*?
      *   **Experimenter:** (Leaf F: Interventionist).
      *   **Symbol:** Go to Node 8.

  **Node 8: The Overdetermination**
  When a symbol causes an effect, the micro-substrate also causes it.
  *   **Q:** Are these two distinct causes (double-counting), or one cause described twice?
      *   **Two Distinct Causes:** (Leaf G: Overdeterminationist).
      *   **One Cause:** Go to Node 9.

  **Node 9: The Graft**
  A simmball configuration is lifted from one careenium and installed in another where it plays a different functional role.
  *   **Q:** Does it continue to do what it *did* at home, or what it *means* here?
      *   **What it did:** Go to Node 10.
      *   **What it means:** (Leaf H: Tangled-Hierarchy).

  **Node 10: The Leak-Away**
  Consider a careenium whose dynamics erode every configuration within a fixed span, so the symbols' grip is temporary and needs repair.
  *   **Q:** Does this partial, temporary grip count as "pushing the substrate"?
      *   **Yes:** (Leaf I: Causal Inheritance).
      *   **No:** (Leaf J: Fragile Realist).

  ---

  ### Mapping the Logical Space

  The tree above permits 10 viable leaves (A–J). Below, I place the requested philosophical positions into this space. There are no empty cells among the 10 leaves; however, two requested positions map to the same leaf (see "Indistinguishable Leaves" below).

  | Leaf | Path Summary (Nodes 1–10) | Assigned Position | Diagnosis of Empty/Alternative Cells |
  | :--- | :--- | :--- | :--- |
  | **A** | Counterfeit(Y) → Silent(N) | **Interpretation-Relativist** | N/A |
  | **B** | Counterfeit(N) → Duplicate(Shape) | **Exclusionist** | N/A |
  | **C** | Counterfeit(Y) → Silent(Y) → Re-grain(Desc) | **Descriptivist** | N/A |
  | **D** | Counterfeit(Y) → Silent(Y) → Re-grain(Obj) → Excl(No) | **Reductionist/Identity** | N/A |
  | **E** | ... → Excl(Yes) → Downward(Yes) | **Strong Emergentist** | N/A |
  | **F** | ... → Downward(No) → Clamp(Exp) | **Interventionist** | N/A |
  | **G** | ... → Clamp(Sym) → Overdet(2) | **Overdeterminationist** | N/A |
  | **H** | ... → Overdet(1) → Graft(Mean) | **Tangled-Hierarchy** | N/A |
  | **I** | ... → Graft(Did) → Leak(Yes) | **Causal Inheritance** | N/A |
  | **J** | ... → Graft(Did) → Leak(No) | **Fragile Realist** | *Merely unattractive:* Posits real symbols that causally vanish too fast to matter. |

  **Note on Leaf D:** I have placed the Reductionist/Identity view at Node 5 ("No additional power"). Some Reductionists might answer Node 1 "No" (Counterfeit), but if they accept micro-closure, they usually treat symbols as identical to substrate states, making them causally potent only *as* substrate.

  ### Indistinguishable Leaves

  **The Descriptivist (Leaf C) and The Causal Inheritance (Leaf I) View.**
  You suspected these might agree on every case. In this tree, they are separated by **Node 4 (Re-graining)**.
  *   **Descriptivist:** Says the boundary is a *choice of description*.
  *   **Causal Inheritance:** Says the boundary is *objective* (realization is real), but the cause is inherited.
  *   **Verdict:** If your group cannot agree on whether the boundary is "in the world" or "in the map," these two leaves will collapse into one. If they agree the boundary is objective, they split at Node 10 (Leak-away). If they agree on the Leak, they are functionally identical for the purposes of the careenium.

  ### Awkward Commitments

  1.  **Interpretation-Relativist:** Symbols vanish if the last observer leaves the room.
  2.  **Exclusionist:** Your decision to read this sentence was physically caused by simmballs, not your reasoning.
  3.  **Descriptivist:** "Cause" is a linguistic convenience, not a feature of the careenium.
  4.  **Reductionist/Identity:** A perfect copy of your brain state is you, regardless of history.
  5.  **Strong Emergentist:** Microphysical laws are incomplete; symbols add new physics.
  6.  **Interventionist:** Symbols only cause things when we hold them fixed; otherwise, they are inert.
  7.  **Overdeterminationist:** Every symbolic action is causally redundant, performed twice by nature.
  8.  **Tangled-Hierarchy:** The system causes itself to cause the system; circularity is a feature, not a bug.
  9.  **Causal Inheritance:** Symbols are real causes, but they have no power their substrate lacks.
  10. **Fragile Realist:** Symbols are real but too fleeting to be blamed for anything.

  ### Scoring Key

  To find your leaf, tally your answers as follows:

  1.  **Counterfeit:** Yes → 2, No → 3
  2.  **Silent:** Yes → 4, No → **A**
  3.  **Duplicate:** Meaning → 4, Shape → **B**
  4.  **Re-graining:** Objective → 5, Description → **C**
  5.  **Exclusion:** Yes → 6, No → **D**
  6.  **Downward:** Yes → **E**, No → 7
  7.  **Clamp:** Symbol → 8, Experimenter → **F**
  8.  **Overdet:** Two → **G**, One → 9
  9.  **Graft:** Mean → **H**, Did → 10
  10. **Leak:** Yes → **I**, No → **J**

  **To move to a neighbouring leaf:**
  *   **From C (Descriptivist) to D (Reductionist):** Change Node 4 to "Objective" and Node 5 to "No".
  *   **From I (Inheritance) to H (Tangled):** Change Node 9 to "What it means".
  *   **From I (Inheritance) to F (Interventionist):** Change Node 7 to "Experimenter".
  *   **From D (Reductionist) to B (Exclusionist):** Change Node 3 to "Shape Only".

  If you find yourself arguing about the *words* in the questions rather than the cases, you have likely landed on **Leaf C** or **Leaf F**, where the definition of "cause" is the primary variable.
