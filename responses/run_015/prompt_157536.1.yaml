answer: |-
  ### Ranking of Concerns

  In evaluating the transition from career politics to sortition with strict term limits, the stability of democratic legitimacy hinges less on the technical capacity of legislators and more on the structural incentives governing their behavior. The concerns are ranked below by their potential to cause systemic legitimacy failure.

  **1. The Dilution of Retrospective Accountability**
  **2. The Disruption of Socialization Patterns (Cross-Partisan Norms)**
  **3. The Decay of Long-Horizon Policy Expertise**

  ---

  ### Analysis of Concerns

  #### 1. The Dilution of Retrospective Accountability
  **Status:** *Resolving this would genuinely change the assessment.*
  **Analysis:** This is the primary vulnerability of sortition. In electoral systems, legitimacy is partially output-based: voters can sanction failure by removing representatives. Sortition severs this link; a randomly selected assembly cannot be "voted out" mid-term, and strict term limits prevent long-term reputational accountability. If there is no functional mechanism to sanction corruption, negligence, or gross incompetence, the "principal-agent" problem becomes acute. Legitimacy would be lost not because the assembly is unrepresentative, but because it is unanswerable.
  **Resolution Impact:** If a robust alternative accountability mechanism were designed (e.g., strict judicial review, recall petitions triggered by supermajorities, or algorithmic transparency mandates), the legitimacy deficit would vanish. Without resolving this, the system risks collapsing into an unaccountable oligarchy of the randomly selected.

  #### 2. The Disruption of Socialization Patterns
  **Status:** *Resolving this would genuinely change the assessment, but is institutionally manageable.*
  **Analysis:** Career politicians often develop informal norms of reciprocity and compromise to facilitate legislative throughput. A high-churn sortition assembly lacks the time to develop these interpersonal trust networks, risking gridlock or ideological rigidity. However, unlike accountability, this is a design problem rather than a structural paradox. Norms can be codified into procedure (e.g., mandatory deliberation periods, facilitated negotiation, supermajority requirements for contentious bills).
  **Resolution Impact:** If institutional design successfully substitutes interpersonal trust with procedural guardrails, the risk of gridlock diminishes. While important, this concern is secondary to accountability because a gridlocked democracy is frustrating, but an unaccountable one is dangerous.

  #### 3. The Decay of Long-Horizon Policy Expertise
  **Status:** *Largely Overrated.*
  **Analysis:** This concern assumes that *political* memory resides in elected officials rather than the permanent civil service. In modern states, technical expertise and institutional memory are housed in the bureaucracy, regulatory agencies, and legislative staff, not in the minds of career legislators. Politicians primarily set value preferences and political direction, not technical implementation. Furthermore, career politicians often suffer from "learned helplessness," relying on lobbyists for information. A sortition assembly, briefed by a non-partisan civil service, could theoretically access the same expertise without the careerist distortion.
  **Resolution Impact:** Proving that citizens can assimilate expert testimony (as evidenced by existing citizens' assemblies on climate or abortion) confirms this concern is overrated. Resolving it does not significantly alter the assessment because expertise is a resource to be accessed, not a trait to be embodied by the legislator.

  ---

  ### The Pivot Premise

  The single empirical premise whose reversal would most alter this ranking is:

  **"Technical implementation and value judgments are separable in modern governance."**

  **Why this reverses the ranking:**
  The current ranking rests on the assumption that politicians set values (which citizens can do via sortition) while bureaucrats handle technical complexity (preserving institutional memory). This renders **Concern #3 (Expertise)** the least important.

  **If this premise is reversed**—meaning complex policy trade-offs (e.g., macroeconomic balancing, nuclear security, epidemiological modeling) require *integrated* value-technical judgment that cannot be effectively mediated by staff—then **Concern #3 becomes the primary threat to legitimacy.** In this scenario, the "decay of expertise" is not just a loss of memory but a loss of the capacity to govern safely. The risk of catastrophic policy error would outweigh the risks of accountability dilution, moving Expertise from Rank 3 to Rank 1, as the system would prioritize survival (competence) over representation (sortition).
