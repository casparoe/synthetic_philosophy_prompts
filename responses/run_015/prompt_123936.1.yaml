  9.  (Final thought on the "Institutional Fink" definition): The user defines it as "authority-structure... reorganized so that the protocol's causal power is genuinely destroyed." This fits the Challenger "tele-conference" dynamic where the normal chain was short-circuited. I will stick with this.

  10. **Structure:**
