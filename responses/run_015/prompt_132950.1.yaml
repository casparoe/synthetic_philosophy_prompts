prompt: |-
  I am designing a ninety-minute seminar for philosophy graduate students with logic training but no prior epistemology, on the problem of old evidence in Bayesian confirmation theory. I want to avoid the standard Mercury-perihelion framing, since it makes the difficulty look like a historical quirk rather than a structural feature of conditionalization. Plan the teaching arc: the dependency order of the formal and conceptual pieces—specifically, why the intuitive idea of predictive success must precede any statement of Bayes's theorem, and which version of the theorem (ratio versus log-odds) should be introduced at which stage—the single carrying scenario I should build around (it must involve a model formulated without reference to an already-known dataset, then successfully accommodating that dataset, but it must not be a case where the model was explicitly parameterized to fit the data), the misconceptions students will generate in sequence (likely: that old evidence is just weak evidence; that the fix is to lower the prior for theories that post-date the data; and that the problem only arises in scientific contexts rather than in individual belief revision), and the precise point in the sequence where each should be intercepted. Include a final check—one question or task—that reveals whether they understand the structural tension between prior conditioning and confirmatory value, not merely whether they recall the example. Also state explicitly which formal apparatus should be left out and acknowledged as omitted.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Philosophy graduate students with logic training, *no prior epistemology*.
      *   **Topic:** The Problem of Old Evidence (POE) in Bayesian Confirmation Theory (BCT).
      *   **Duration:** 90 minutes.
      *   **Constraint 1:** Avoid the standard Mercury-perihelion/General Relativity example (too historical, masks structural issue).
      *   **Constraint 2:** Plan the teaching arc (dependency order of formal/conceptual pieces).
      *   **Constraint 3:** Explain *why* intuitive predictive success must precede Bayes's Theorem.
      *   **Constraint 4:** Decide which version of Bayes's Theorem (Ratio vs. Log-Odds) to introduce when.
      *   **Constraint 5:** Design a *single carrying scenario* (model formulated without reference to known data, then accommodating it, but not curve-fitting).
      *   **Constraint 6:** Anticipate specific misconceptions in sequence and state where to intercept them.
      *   **Constraint 7:** Include a final check (question/task) testing structural understanding, not recall.
      *   **Constraint 8:** Explicitly state what formal apparatus to omit/acknowledge as omitted.

  2.  **Deconstruct the Problem of Old Evidence (POE):**
      *   *Core Issue:* In standard BCT, evidence $E$ confirms hypothesis $H$ iff $P(H|E) > P(H)$. By the rule of conditionalization, if $E$ is already known (probability 1), then $P(H|E) = P(H)$. Thus, old evidence cannot confirm.
      *   *Why it matters:* Science often uses old data to confirm new theories (e.g., GR explaining Mercury). If BCT can't handle this, it's deficient.
      *   *Structural feature:* It's about the rigidity of $P(E)=1$ under standard conditionalization.

  3.  **Develop the Carrying Scenario:**
      *   *Requirement:* Model formulated without reference to data, then accommodates it. Not curve-fitting. Not Mercury.
      *   *Idea 1:* Cryptography. (Too technical?)
      *   *Idea 2:* A card game. (Too trivial?)
      *   *Idea 3:* A specific pattern in a digit sequence (like Pi). (Good, but might feel like math discovery rather than empirical confirmation).
      *   *Idea 4:* *The "Locked Box" Scenario.*
          *   Context: A sealed box contains a specific arrangement of weighted dice.
          *   Hypothesis: A specific physical theory about how the weights distribute.
          *   Data: The outcome of a roll that happened *before* the theory was written down, but the result was sealed in an envelope.
          *   *Critique:* A bit clunky.
      *   *Idea 5:* *The "Archival Climate" Scenario.*
          *   Context: A physicist develops a new model of atmospheric pressure dynamics ($H$) based on first principles (fluid dynamics) *today*.
          *   Data: There is a digitized, timestamped log of pressure readings from 1950 ($E$) that the physicist has *not* looked at yet.
          *   Action: The physicist derives a prediction from $H$, opens the 1950 log, and sees $E$ matches.
          *   *Why this works:* $E$ exists (is "old" in reality), but is "new" to the agent's belief state *until* looked at. Wait, POE is about when $E$ is *already* known.
      *   *Refined Idea:* *The "Pre-Existing Anomaly" Scenario.*
          *   Let's go with a **Pattern in Noise** scenario.
          *   Setup: You have a long string of binary data generated by a machine (e.g., a Geiger counter log from last year). You know the data ($E$). You assign it probability 1.
          *   New Theory ($H$): Today, you propose a physical mechanism that *entails* this specific pattern.
          *   Problem: Since you already knew the data ($P(E)=1$), standard Bayes says your confidence in $H$ shouldn't change. But intuitively, it should.
          *   *Selection:* **The "Sealed Algorithm" Scenario.**
          *   *Setup:* A computer generated a specific 100-bit string $S$ yesterday. You saw $S$. You know $S$ is true ($P(S)=1$).
          *   *Today:* You hypothesize that the computer was running Algorithm $A$. Algorithm $A$ deterministically outputs $S$.
          *   *Intuition:* Discovering $A$ explains $S$, so $A$ is confirmed.
          *   *Formal Problem:* $P(S)=1 \implies P(A|S) = P(A)$.
          *   *Why not curve fitting:* Algorithm $A$ was derived from theoretical constraints, not by tweaking parameters to match $S$.

  4.  **Structure the Teaching Arc (90 Minutes):**

      *   **Phase 1: Intuition & Prediction (0-20 mins).**
          *   Why start here? If we start with math, they treat POE as an algebraic puzzle. We need them to feel the *epistemic gain* of explanation first.
          *   Activity: Present the "Sealed Algorithm" scenario. Ask: "Does finding the algorithm increase confidence?" (Yes).
      *   **Phase 2: Formalizing the Intuition (20-40 mins).**
          *   Introduce Bayes. Which version? **Odds Form**.
          *   Why Odds? $P(H|E)/P(\neg H|E) = [P(E|H)/P(E|\neg H)] \times [P(H)/P(\neg H)]$.
          *   It isolates the Likelihood Ratio. It makes the $P(E)$ term disappear from the update factor, *but* the problem arises in the definition of confirmation ($P(H|E) > P(H)$).
          *   Actually, for POE, the **Standard Ratio Form** ($P(H|E) = P(E|H)P(H)/P(E)$) is better to show the singularity.
          *   *Decision:* Introduce Standard Form first to show the breakage. Introduce Odds Form later to discuss potential fixes (likelihood ratios).
          *   Show the math: If $P(E)=1$, then $P(H|E) = P(H)$.
      *   **Phase 3: The Misconception Gauntlet (40-70 mins).**
          *   Misconception 1: "Old evidence is just weak evidence." (Intercept: Distinguish psychological novelty from logical probability).
          *   Misconception 2: "Just lower the prior." (Intercept: This is ad hoc; priors represent state *before* evidence, changing them violates the timeline).
          *   Misconception 3: "Only happens in science/history." (Intercept: Apply to the binary string scenario—it's about belief states, not history).
      *   **Phase 4: Structural Tension & Solutions (70-85 mins).**
          *   Discuss *why* this is hard. It's about the rigidity of logical omniscience in Bayesian models.
          *   Briefly mention counterfactual priors (Garber) or ur-priors without getting bogged down.
      *   **Phase 5: Final Check (85-90 mins).**

  5.  **Refining the Formal Apparatus:**
      *   *Include:* Probability axioms, definition of confirmation ($P(H|E) > P(H)$), Standard Bayes Theorem, Odds Form (for contrast).
      *   *Exclude:* Measure theoretic probability, Jeffrey Conditionalization (too complex for 90 mins), full Garber-style formalization (too technical). Acknowledge their existence.

  6.  **Drafting the Content - Step-by-Step:**

      *   *Scenario:* The "Cryptic Log". A server log from last month ($E$). You saw it, memorized a hash, know it's fixed ($P(E)=1$). Today you propose a bug hypothesis ($H$) that entails that log pattern.
      *   *Arc:*
          1.  Intuition (The "Aha!" moment of explanation).
          2.  Formalization (The "Oh no." moment of $P(E)=1$).
          3.  Misconceptions (The "But wait..." moments).
          4.  Resolution/Check (The "So what?" moment).

      *   *Why Intuition First?* If you start with $P(E)=1$, students treat it as a constraint to be solved algebraically. If you start with the *feeling* of confirmation, the algebra becomes a barrier to be critiqued. POE is a clash between normative formalism and descriptive intuition.

      *   *Bayes Version:* Start with Standard ($P(H|E) = \dots$) to demonstrate the zero-update. Switch to Odds ($LR$) to show that the *likelihood* support is still there, even if the probability update is blocked. This highlights the tension: The Likelihood Ratio says "Support!", the Conditionalization says "No Update."

      *   *Misconceptions:*
          1.  *Psychological vs. Logical:* "But I didn't *use* the evidence to build the theory." -> Intercept: BCT is about states, not processes.
          2.  *Prior Manipulation:* "Just set $P(H)$ higher." -> Intercept: Priors are exogenous; this begs the question.
          3.  *Historical Contingency:* "This is just about Einstein." -> Intercept: Use the Cryptic Log (ahistorical).

      *   *Final Check:* Needs to test the *structural* tension. Ask them to construct a belief state where $P(E)=1$ but confirmation occurs, or explain why that's impossible in standard BCT. Better: Give a case where $E$ is "semi-old" (probability 0.99) and ask how the confirmation magnitude scales compared to $P(E)=1$.

      *   *Omissions:* Jeffrey Conditionalization (probability kinematics), Counterfactual Credence functions (Garber), Logical Omniscience solutions.

  7.  **Review against Constraints:**
      *   90 mins? Yes, segmented.
      *   No Mercury? Yes, using "Cryptic Log".
      *   Logic training assumed? Yes, can handle the algebra.
      *   No epistemology? Yes, need to define confirmation clearly.
      *   Dependency order? Intuition -> Formal -> Problem -> Misconceptions.
      *   Ratio vs Log-Odds? Standard for the problem, Odds for the nuance.
      *   Misconceptions sequenced? Yes.
      *   Final check structural? Yes.
      *   Omissions stated? Yes.

  8.  **Final Polish:** Ensure the tone is appropriate for grad students (rigorous but pedagogical). Make sure the "Why Intuition First" rationale is explicit. Ensure the scenario is robust against the "curve fitting" objection (the hypothesis must come from theoretical constraints, not parameter tuning).

      *   *Self-Correction on Scenario:* Make sure the "Cryptic Log" isn't just data compression. It needs to be a *causal* hypothesis.
      *   *Revised Scenario:* **The "Frozen Sensor" Case.**
          *   A sensor recorded a specific fluctuation pattern $E$ at time $t_1$. You observed $E$ at $t_1$. $P(E)=1$.
          *   At $t_2$, you propose a mechanical fault $H$ that *necessitates* pattern $E$.
          *   $H$ was derived from engineering principles, not by reverse-engineering $E$.
          *   This avoids curve-fitting.

      *   *Final Check Design:* A minimal formal task. "Construct the inequality that fails."

  9.  **Writing the Plan.** (Proceeding to generate output based on these thoughts).
answer: |-
  # Seminar Plan: The Structural Problem of Old Evidence
  **Duration:** 90 Minutes
  **Audience:** Philosophy Graduate Students (Logic trained, Epistemology novice)
  **Core Constraint:** Avoid historical examples (Mercury/GR); focus on structural tension in conditionalization.

  ---

  ## I. Teaching Arc & Dependency Order

  ### 1. The Intuitive Anchor (0–20 mins)
  **Goal:** Establish the *normative intuition* of confirmation before introducing the *formal constraint*.
  **Why Intuition First?** If you begin with Bayes's Theorem, students treat the Problem of Old Evidence (POE) as an algebraic puzzle to be solved within the system. By starting with the intuition, you frame POE as a clash between a normative formalism and a pre-theoretical epistemic commitment. They must feel the *loss* of confirmatory power before they see the math that dictates it.

  **Activity:** Present the **Carrying Scenario** (detailed below). Ask: *"You already knew the data. You just derived the theory. Does the data support the theory?"*
  *   **Consensus:** Yes. It feels like explanation, and explanation feels like confirmation.
  *   **Transition:** "Bayesian Confirmation Theory has a specific definition of 'support.' Let's see if it matches our intuition."

  ### 2. The Formal Trap (20–40 mins)
  **Goal:** Demonstrate the failure of standard conditionalization.
  **Apparatus:** Introduce **Standard Ratio Form** first.
  $$P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}$$
  **Why Standard Form First?** It explicitly contains the $P(E)$ term in the denominator. This makes the singularity ($P(E)=1$) visually immediate.
  **The Derivation:**
  1.  Define Confirmation: $E$ confirms $H$ iff $P(H|E) > P(H)$.
  2.  Apply Old Evidence Constraint: If $E$ is known, $P(E) = 1$.
  3.  Show Result: If $P(E)=1$, then $P(E|H)=1$ (since $H$ entails $E$).
  4.  Equation becomes: $P(H|E) = \frac{1 \cdot P(H)}{1} = P(H)$.
  5.  **Conclusion:** No confirmation occurs.

  **Secondary Apparatus:** Introduce **Odds Form** *after* the problem is established.
  $$\frac{P(H|E)}{P(\neg H|E)} = \frac{P(E|H)}{P(E|\neg H)} \times \frac{P(H)}{P(\neg H)}$$
  **Why Odds Second?** The Likelihood Ratio $\frac{P(E|H)}{P(E|\neg H)}$ remains high even when $P(E)=1$. This isolates the specific point of failure: it is not that the *likelihood* support vanishes, but that the *conditionalization rule* cannot translate that support into a posterior probability shift when the evidence is certain. This distinguishes POE from a lack of discriminatory power.

  ### 3. The Misconception Gauntlet (40–70 mins)
  Address misconceptions in the order they naturally arise from the formal derivation.

  *   **Misconception 1: "Old evidence is just weak evidence."**
      *   *Student Thought:* "If I'm not sure I remember the data right, $P(E) < 1$, so it works."
      *   *Intercept Point:* Immediately after the Standard Form derivation.
      *   *Correction:* Distinguish **Psychological Uncertainty** (I might forget) from **Logical Probability** (Given my current belief state, $E$ is true). POE assumes $E$ is part of the background knowledge $K$. If $P(E) < 1$, it isn't "old evidence" in the relevant sense; it's just uncertain evidence.

  *   **Misconception 2: "The fix is to lower the prior for theories that post-date the data."**
      *   *Student Thought:* "Just penalize late theories in the $P(H)$ term."
      *   *Intercept Point:* During the Odds Form discussion.
      *   *Correction:* This violates the **Exogeneity of Priors**. Priors represent the belief state *before* considering $E$. If you adjust $P(H)$ based on the temporal relation to $E$, you are baking the confirmation into the prior, rendering the conditionalization redundant. It solves the number but misses the mechanism.

  *   **Misconception 3: "This only arises in scientific/historical contexts."**
      *   *Student Thought:* "This is just a problem for historians of science studying Einstein."
      *   *Intercept Point:* When returning to the Carrying Scenario.
      *   *Correction:* Re-emphasize the **Individual Belief State**. POE applies to *any* agent who learns a logical entailment between a hypothesis and a proposition they already accept. It is a problem for logic, not history.

  ### 4. Structural Tension & Omissions (70–85 mins)
  **Goal:** Summarize the impasse without solving it (solutions require more time/epistemic background).
  **The Tension:** To allow confirmation, we need $P(E) < 1$. To represent "Old Evidence," we need $P(E) = 1$. Standard Bayesianism cannot hold both.
  **Acknowledged Omissions:** Explicitly state that you are omitting:
  1.  **Jeffrey Conditionalization:** (Probability kinematics where $P(E)$ shifts but doesn't go to 1). Acknowledge this handles uncertainty but assumes $E$ wasn't fully certain to begin with.
  2.  **Counterfactual Priors (Garber):** (What would my prior have been if I didn't know $E$?). Acknowledge this is the standard "fix" but requires a complex apparatus of logical omniscience management you are excluding for time.
  3.  **Ur-Priors:** (Objective priors). Acknowledge this shifts the problem but doesn't solve the structural rigidity.

  ### 5. Final Check (85–90 mins)
  **Task:** Do not ask for a definition. Ask for a **Boundary Condition**.
  **Prompt:** *"Construct a belief state description where $P(E) = 0.99$ instead of $1$. Using the Standard Ratio Form, calculate the limit of the confirmatory boost as $P(E) \to 1$. What does this limit tell us about the relationship between certainty and learning?"*
  **Success Criterion:** They must show that as $P(E) \to 1$, the posterior $P(H|E) \to P(H)$, demonstrating that the loss of confirmation is continuous and structural, not a binary switch that only breaks at exactly 1. This proves they understand the *tension*, not just the example.

  ---

  ## II. The Carrying Scenario: "The Frozen Sensor"

  **Constraint Checklist:**
  *   Model formulated without reference to dataset? **Yes.**
  *   Successfully accommodates dataset? **Yes.**
  *   Not parameterized to fit (curve-fitting)? **Yes.**
  *   Not Mercury/History? **Yes.**

  **Scenario Description:**
  1.  **The Data ($E$):** A temperature sensor in a vacuum chamber recorded a specific, erratic fluctuation pattern at time $t_1$. You observed this log at $t_1$. You currently assign $P(E) = 1$.
  2.  **The Theory ($H$):** At time $t_2$ (today), you propose a mechanical hypothesis: "The sensor's cooling fan has a specific bearing defect that causes vibration at frequency $f$."
  3.  **The Derivation:** You derive $H$ from first principles of mechanical engineering and thermal dynamics available at $t_2$. You did *not* tweak the bearing defect parameters to match the log; the defect parameters are fixed by the manufacturer's specs.
  4.  **The Entailment:** You realize that if $H$ is true, the sensor *must* have produced pattern $E$ at $t_1$. ($H \vdash E$).
  5.  **The Intuition:** Discovering this entailment makes you more confident in $H$. $E$ supports $H$.
  6.  **The Formal Block:** Since you knew $E$ at $t_1$, $P(E)=1$ in your current belief state. Standard conditionalization forbids $H$ from gaining probability.

  ---

  ## III. Explicit Formal Apparatus

  ### To Include:
  1.  **Axioms of Probability:** Specifically $P(A|B) = P(A \land B) / P(B)$.
  2.  **Definition of Confirmation:** $P(H|E) > P(H)$.
  3.  **Bayes's Theorem (Standard Ratio):** To show the denominator collapse.
  4.  **Bayes's Theorem (Odds Form):** To show the Likelihood Ratio remains intact.

  ### To Omit (and Acknowledge):
  1.  **Measure-Theoretic Probability:** We treat probabilities as discrete functions over propositions, not measures on sigma-algebras.
  2.  **Logical Omniscience Constraints:** We will not formalize the distinction between "known truths" and "deducible truths." We assume if the agent sees the entailment, they update. (Acknowledge that POE is partly a problem of logical omniscience).
  3.  **Jeffrey Conditionalization:** As noted above, omitted to keep focus on strict conditionalization.
  4.  **The "Garber" Solution:** Do not introduce the formal apparatus of $P(H|E \land \text{Entailment})$. Merely mention it as a "counterfactual prior" strategy.

  ---

  ## IV. Instructor Notes on Flow

  *   **Minute 20 (The Pivot):** Watch for students nodding at the math. Stop them. Ask: "Does this math match your intuition about the Sensor?" If they say "Yes, math wins," you have lost them to formalism. Re-center the intuition: "If the math says you can't learn from explanation, is the math wrong, or is your intuition wrong?"
  *   **Minute 50 (The Prior Fix):** Students will love the idea of adjusting priors. Be ruthless here. If they adjust priors based on evidence timing, they are not doing Bayesian updating; they are doing post-hoc rationalization. Emphasize that Priors are *exogenous inputs*.
  *   **Minute 85 (The Check):** Ensure they do the limit calculation. If they simply say "It goes to zero," ask "What goes to zero? The probability or the *gain*?" (Answer: The gain/update factor).

  This plan ensures the students encounter POE not as a historical curiosity about Einstein, but as a rigorous tension between the rigidity of probability 1 and the dynamics of belief revision.
