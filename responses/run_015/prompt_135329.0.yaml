prompt: |-
  I am expecting my first child this spring, and the usual abstract anxiety about climate futures has become concrete in an unsettling way: every mitigation pathway I study does not merely affect "the people of 2150," it helps determine which people of 2150 come to exist at all, through changed migration timelines, economic conditions, and reproductive pairing. I want to think clearly about whether I can wrong those future individuals by accelerating or delaying particular policies, but I keep running into the nonidentity problem. Before I read further, I want the specification up front.

  Write the desiderata that any adequate theory of intergenerational harm—specifically one that addresses whether a present act can wrong a future person whose very existence depends on that act—must satisfy. Include the following injected consideration: treat "threshold identity" as a live option, the view that small perturbations in conception conditions preserve personal identity up to a boundary, but large-scale demographic shifts (like those produced by climate-driven migration and delayed infrastructure) do not, so that some future people are "near-counterparts" rather than fully distinct. Your answer should not ask me to take a particular view on this boundary, but the theory must account for whether harm can attach to near-counterparts differently than to fully non-identical successors.

  Structure the response exactly as follows:

  1. "The knot, personally and conceptually" (approximately 200 words): Lay out why the problem is not merely academic for my situation, using the climate-migration-reproduction scenario above, and state precisely what a theory of intergenerational harm must resolve—whether wronging requires identity-preservation, and how the threshold-identity idea complicates both answers.

  2. "The desiderata" (approximately 500 words): List the requirements with the motivating case behind each. At minimum cover: (a) handling the standard depletion and same-number choices without collapsing into contradiction; (b) accommodating or explaining away the intuition that reckless climate policy still wrongs someone; (c) respecting biological results about embryonic development and genetic continuity without over-reading them into metaphysical identity; (d) addressing whether near-counterparts (per the threshold-identity framing) can be harmed in a derivative or analogical sense; (e) preserving a distinction between harming a particular future person and merely making the world worse impersonally; (f) being compatible with reproductive ethics that do not treat every procreative choice as a harm calculus. Flag any pair you suspect is jointly unsatisfiable.

  3. "Tensions and no-go considerations" (approximately 350 words): Examine which subsets of the desiderata conflict, particularly whether the combination of (b) and (e) is sustainable once threshold identity is taken seriously. If standard results (like the impossibility of person-affecting solutions without contradiction) apply here, state them in conceptual terms rather than attributing them to named authors.

  4. "Brief scorecard" (approximately 250 words): How do the main families—strictly person-affecting accounts, purely impersonal accounts, and hybrid or two-level views—fare against the list? Do not provide bibliographies; judge them on internal coherence with the desiderata.

  5. "The most damaging requirement" (approximately 150 words): Identify which single desideratum eliminates the largest number of popular positions, and explain why.

  6. "A better framing, if needed" (approximately 150 words): If the nonidentity framework itself proves inadequate to the personal stakes I described, propose a reconceptualization (for example, shifting from identity-based harm to obligation-based stewardship) that preserves the moral urgency without requiring identity.

  Keep the tone formal and analytical. Do not include citations, reading lists, or requests for specific texts. Reach a conclusion about whether any existing family of views can jointly satisfy the core desiderata, or whether the threshold-identity injection forces a fundamentally different approach.
