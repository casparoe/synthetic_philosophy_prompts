answer: |-
  You have spotted a very real and frustrating move in ethical argumentation. You are right that it isn't Particularism (which questions the rule itself) and it isn't just making an excuse (which admits the rule was broken).

  There isn't one single Greek/Latin name for it like *ad hominem*, but in philosophy and logic, this is most commonly identified as a specific application of the **"No True Scotsman" fallacy**, often technically referred to in ethics as **"Definitional Rescue"** or **"Action Redescription."**

  Here is the breakdown of the name, the definition, the distinctions you asked for, and the philosophical background.

  ### 1. The Name and Definition

  **The Common Name:** The Ethical "No True Scotsman"
  **The Technical Name:** Definitional Rescue (via Action Redescription)

  **Definition:**
  This occurs when a moral agent holds an absolute rule (e.g., "Lying is always wrong") and encounters a counter-example (e.g., lying to save a life). Instead of modifying the rule to accommodate the exception, they alter the *definition* of the key term so the counter-example no longer fits the category.

  *   **The Rule:** "All X are Wrong."
  *   **The Counter-Example:** "Here is an X that seems Right."
  *   **The Move:** "That wasn't *really* X. True X is always Wrong."

  By shifting the definition of the action (the "X"), the rule becomes **unfalsifiable**. It is protected from reality by a semantic shield.

  ### 2. How It Differs from Particularism

  You correctly noted this isn't Particularism. Here is the precise distinction:

  *   **Moral Particularism:** Argues that moral rules are inherently flawed or too rigid. A particularist would say, "The rule 'Lying is always wrong' is false. Context matters. Sometimes lying is the right thing to do." They **change the morality** to fit the world.
  *   **Definitional Rescue:** Argues that the moral rule is perfect and absolute. They say, "The rule 'Lying is always wrong' is true. Since this action was right, it cannot be lying." They **change the world** (the description of the act) to fit the rule.

  In short: Particularism sacrifices the **Rule** to save the **Intuition**. Definitional Rescue sacrifices the **Description** to save the **Rule**.

  ### 3. How It Differs from "Making Excuses"

  This is a distinction between **Justification** vs. **Redefinition**.

  *   **Making Excuses (or Justification):** You admit the action falls under the rule, but argue you shouldn't be blamed.
      *   *Example:* "Yes, I lied. It was wrong, but I had to do it to save him. I hope I'm forgiven."
      *   *Status:* The rule remains valid, the act violated it, but there are mitigating factors.
  *   **Definitional Rescue:** You deny the action falls under the rule at all.
      *   *Example:* "I did not lie. I engaged in protective communication. Therefore I broke no rule."
      *   *Status:* The rule remains valid, the act did *not* violate it, therefore no forgiveness is needed.

  ### 4. Have Philosophers Talked About This?

  Yes, extensively. This is a central tension in **Meta-Ethics** and **Action Theory**.

  **A. Action Individuation (The "Under What Description?" Problem)**
  Philosophers like **Donald Davidson** and **G.E.M. Anscombe** wrote heavily about how we describe actions. An action can be described in many ways (e.g., "moving a finger," "pulling a trigger," "killing a man," "defending the castle").
  *   Critics of absolutism argue that people using "Definitional Rescue" are arbitrarily selecting the description that makes the rule work.
  *   **Philippa Foot** (in *Virtues and Vices*) criticized this kind of rigid rule-following, noting that it often leads to a disconnect between moral language and human reality.

  **B. The "Natural Law" Defense (When it's not a fallacy)**
  Interestingly, some serious philosophical traditions *defend* this move, arguing it isn't a fallacy but a metaphysical truth.
  *   **Natural Law Theorists** (like certain Thomists) argue that "Lying" has a specific essence (e.g., "speech against the mind"). They argue that a "protective falsehood" literally does not fit the metaphysical definition of a Lie.
  *   To them, saying "That wasn't lying, it was protecting" isn't a semantic trick; it's a claim about the *nature* of speech.
  *   **Critics** (like **Immanuel Kant**, ironically) usually bite the bullet. Kant argued, "Yes, lying to the murderer at the door *is* lying, and it *is* wrong, and you still shouldn't do it." Kant refused to use Definitional Rescue; he preferred strict adherence even when it led to bad outcomes.

  **C. Casuistry**
  Historically, this move is associated with **Casuistry** (case-based reasoning). In the 17th century, Jesuit casuists were accused of using "mental reservation" and complex redescriptions to allow people to follow the letter of moral law while violating the spirit. Blaise Pascal famously attacked this in his *Provincial Letters*, accusing them of using semantic tricks to let rich and powerful people off the hook. This is likely the historical ancestor of the move you are seeing.

  **D. The Doctrine of Double Effect (DDE)**
  This is the "legitimate" philosophical cousin of this move. DDE says an action with a bad side effect (like hurting someone) is permissible if the *intent* was good (like saving them).
  *   **Critics** say DDE is often just "Definitional Rescue" in disguise (e.g., "I didn't *intend* to kill him, I only intended to remove the threat").
  *   **Defenders** say it properly distinguishes between the *action* and the *consequence*.

  ### Summary for Your Arguments

  When you see this happening, you can call it **"Definitional Rescue"** or point out they are making their moral rule **unfalsifiable**.

  You can say:
  > "You are making your rule immune to criticism by changing the definition of the words rather than addressing the moral situation. If 'lying' just means 'wrongful speaking,' then saying 'lying is always wrong' is a tautology (a circular truth), not a moral guide. You have to be able to identify a lie *before* you judge it, not judge it and then decide if it was a lie."

  This moves the burden back on them to define the action independently of its moral status.
