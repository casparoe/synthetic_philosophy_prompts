prompt: |-
  im in this seminar on moral culture and weve been fighting about honor vs dignity vs victimhood culture for like three weeks straight. my prof said instead of another debate paper me and my study partner should write an adversarial collaboration doc, so i want you to draft the joint statement that a dignity-first camp and a victimhood-defense camp could actually both sign without feeling like they got straw-manned.

  the dignity-first side thinks dignity culture is morally superior because worth is internal and doesnt collapse when other people ignore you; they say honor culture outsources worth to community approval and victimhood culture outsources it to institutional arbiters, which they call moral outsourcing and see as a corruption. the victimhood-defense side thinks victimhood culture is actually the fulfillment of dignity for people who never got it, because it makes structural harm visible and forces institutions to respond; they think dignity culture is mostly a cover for people who already have power to pretend they dont need anyone, and that honor culture just hides domination behind rituals of respect.

  i want the doc structured like this: first a numbered section of claims both sides can sign about what these three cultures do, how they handle conflict, and what generally happens when they clash; then a disagreements table with each sides exact position phrased in words theyd accept; then the cruxes — im guessing one is whether moral outsourcing is necessarily corrupt or can be a feature of justice, another is whether internal self-worth can exist without any social mirror, and maybe a third about whether victimhood culture nets out to more or less harm in practice. for each crux, give one concrete scenario both sides agree is relevant — maybe that wire scene where omar tests d'angelo about being a man, or a workplace grievance proceeding — and write down what each camp predicts about it. please dont ask me for bibliographys or reading lists, i dont have access this week, and dont drag in some obscure theorist we never discussed; stick to the framework from class and the concepts we actually argued about. also there might be a typo or two in here because im writing this on my phone between lectures.
