answer: |-
  As the facilities director for a mid-sized university, you must choose between retrofitting the campus steam heating system with Option A, a conventional high-efficiency boiler upgrade, or Option B, a novel decentralized geothermal loop designed to become a regional utility standard. Option A yields a reliable near-term energy saving of $50,000 annually with negligible long-term institutional impact beyond routine maintenance variance that averages to zero over decades. Option B yields a slightly lower near-term saving of $40,000 annually but establishes a physical infrastructure lock-in that will dictate regional energy pricing and carbon output for fifty years, magnifying its impact by two orders of magnitude relative to the annual budget. While published case studies of similar geothermal transitions uniformly report positive community welfare outcomes, you know these reports suffer from severe survivorship bias because failed projects were dissolved into bankruptcy and never studied, leaving your empirical basis for B's long-run sign systematically skewed toward optimism despite your inability to correct for the missing failures. Consequently, your unadjusted data suggests a positive long-run value for B, your near-term forecast favors A, and your knowledge of the evidentiary skew renders the probability distribution of B's long-run effect indeterminate rather than symmetric.

  **Check and Derivation**

  1.  **Long-run Expected-Value Maximization (Unadjusted Credences):** Using the agent's raw, unadjusted credences derived from the available case studies, Option B has a positive expected long-run value. Since the long-run magnitude is two orders larger than the near-term difference ($10,000 loss), the positive long-run expectation swamps the near-term deficit. Thus, total expected value favors **B**.
  2.  **Window-Restricted Consequentialism:** This rule counts only effects within the forecastable near-term window. Option A saves $50,000; Option B saves $40,000. Long-run effects are ignored. Thus, this rule favors **A**.
  3.  **Imprecise-Credence Rule:** We apply **Maximin** over the set of probabilities consistent with the known skew. Because the evidence is known to be systematically skewed by survivorship bias, the credence interval for B's long-run effect spans from large negative to large positive values. Option A's long-run effect is precise and neutral (zero mean). Since the lower bound of B's expected value (large negative lock-in) is worse than A's lower bound (zero), Maximin selects **A**. This rule attends to the long run by evaluating its worst-case scenario rather than discarding it.

  **Feature and Counterfactual**
  The single feature doing the work is the **known systematic skew (survivorship bias)** rendering B's long-run expectation indeterminate. If this feature is removed and B's spread becomes merely symmetric (unbiased noise), the long-run expected value of B collapses to zero. In that scenario: (1) Long-run EV maximization favors **A** (since B's long-run gain vanishes, leaving only the near-term deficit); (2) Window-restricted still favors **A**; (3) Imprecise-credence rule still favors **A** (as B's interval centers on zero, A's precise positive near-term value dominates). A defender of the first verdict (B) would argue the case is rigged by refusing to quantify the bias; they would claim that recognizing the skew should lead to a discount factor applied to the positive data rather than a collapse into indeterminacy, and that demanding an interval instead of a corrected precise prior arbitrarily penalizes innovation.

  \answer{long-run EV: B; window-restricted: A; imprecise-credence rule: A}
