answer: |-
  Here is the principle: **The Authority-Transfer Account.**

  When you promise, you voluntarily hand another person the authority to direct a specific part of your future conduct, specifically to serve an interest of theirs. You are giving them the remote control. The obligation exists because they now hold a claim on your actions that they didn't have before.

  Here is how it maps to your cases:
  *   **Validity:** You cannot transfer authority under coercion (threats to testify) or over something that doesn't exist (the false $500 debt). Those promises are void from the start.
  *   **Strength:** The weight of the obligation scales with the importance of the interest you are serving. A dying friend's dog is a vital interest (life care, final wish); a plane stranger's article is a trivial interest. This explains why the dog binds hard and the plane guy binds barely.
  *   **Persistence:** The obligation lasts as long as the *interest* survives, not necessarily as long as the *person* survives. The dog still needs feeding after the friend dies, so you are bound.
  *   **Overrides:** Higher moral duties reclaim the authority. If keeping a secret allows harm, the victim's safety overrides the brother's confidence.
  *   **Integrity:** Lying when you promise (knowing you'll blow it off) abuses the mechanism itself. It corrupts the social tool of promising, which is why it feels worse than simply failing.

  Here is where I disagree with your gut:

  **1. The Plane Guy (I overturn this verdict):**
  You say this binds "2 out of 10." I say it binds **0 out of 10**. Under the Authority-Transfer Account, an obligation requires a stakeholder. If he forgot by the next day and you'll never see him again, he holds no interest in the article and exercises no authority over your time. You owe *him* nothing. The "2/10" feeling you have is not an obligation to him; it's a virtue ethics concern about *your own* character. You might want to be the kind of person who sends the article, but he has no claim on you.

  **2. The Alzheimer's Case (I resolve the flicker):**
  Your gut flickers between "obviously go" and "no one left to owe." My principle says: **You are not bound.**
  Here is the distinction between this and the dog case: The dog's interest (welfare/survival) exists independently of the owner's awareness. The Alzheimer's patient's interest (companionship/recognition) *requires* her awareness to be realized. If she doesn't know you and is indifferent to your presence, the interest you promised to serve has vanished. The remote control is useless because the recipient can no longer press the buttons. You may go out of love or habit, but you do not owe it as a promise.

  **Predictions on your new cases:**

  *   **Brother's Confidence vs. Awful Act:** You break the promise. The authority he transferred to you was conditional on the normal scope of confidentiality. When his actions threaten serious harm to a third party, that third party's right to safety overrides your brother's claim to secrecy. The authority reverts to you, and you must act to prevent the harm.
  *   **Pressured Release:** The promise **stands**. A release is itself a kind of transaction (giving up a claim). If that transaction is coerced ("I only said it because I felt pressured"), the release is invalid. He never successfully took the remote control back from you. You are still bound.

  **Where my answer is most likely wrong:**
  I am likely wrong on the **Alzheimer's case**. My principle is too cold here. It ignores the dignity of the *past* self. Even if the current patient cannot receive the benefit, the promise was made to a competent person who valued that future companionship. Honoring that prior autonomy has value independent of current welfare. By saying the obligation dissolves, I risk treating people as disposable once their cognitive faculties fade, which violates a deeper duty of respect that my "Interest-Transfer" model misses. You should probably still go on Sundays, not because she needs it now, but because *she* needed it then.
