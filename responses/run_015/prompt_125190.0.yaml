answer: |-
  Based on the four precedents you provided, I can map Dr. Voss's grading logic with high confidence. Her decisions are not contradictory; they follow a specific historiographical principle that is stricter than "scale" but more flexible than "source purity."

  Here is the breakdown of your proposal's chances, the actual rule she is using, and how to test it.

  ### 1. The Verdict: Will she approve it?
  **Yes, with high probability (85%+).**

  Your proposal fits the pattern of her approved cases better than it risks the pitfalls of her rejected ones. Here is why:
  *   **Subject Status:** An enslaved domestic worker is the definition of "below." This is even more "from below" than the free Florentine wool carder (Approved Case 1).
  *   **Source Type:** Household inventories and parish registers are bureaucratic/administrative traces, exactly like the court registers (Case 1) and tax rolls (Case 3) she approved. She has already established that **the subject does not need to write the source.**
  *   **Methodology:** You are arguing for *active navigation* (godparent networks, movement between households). This avoids the trap of Case 4 ("Macro in a small container") because you aren't studying the *system of slavery* using the woman as data; you are studying *the woman* using the system as a trace.

  **The Risk:** The only way this gets rejected is if your proposal sounds like you are studying **property valuation** rather than **social survival.** If you frame the inventories as records of *assets*, she may reject it as economic history. If you frame them as records of *presence* that allow you to reconstruct kinship, it passes.

  ### 2. The Actual Rule: What is Dr. Voss running?
  She is **not** running Rule A (Scale), Rule B (Agency), or Rule C (Source Purity) in isolation. She is running a hybrid principle I call **The Subaltern Gaze Rule.**

  **The Rule:** *History from Below requires a non-elite subject AND a bottom-up analytical lens, regardless of the source's origin.*

  Here is how her four past calls fit this rule:
  *   **Case 1 (Carder - Approved):** Non-elite subject + Bureaucratic source + Lens reconstructs his life trajectory. **(Pass)**
  *   **Case 2 (Banker - Rejected):** Elite subject. Even with personal letters, it is "Great Man" history shrunk down. **(Fail: Wrong Class)**
  *   **Case 3 (Dockworkers - Approved):** Non-elite subject + Bureaucratic source + Lens traces their labor/movement. **(Pass)**
  *   **Case 4 (Paris Neighborhood - Rejected):** Non-elite subject (residents) + Bureaucratic source (Police) + **Lens remains on State order/threat.** The historian looked *at* the neighborhood through the police's eyes, not *for* the neighborhood through the cracks. **(Fail: Wrong Lens)**

  **Why your hypotheses were close but off:**
  *   **A (Scale):** Disproven by Case 2 (One person rejected).
  *   **B (Agency):** Partially true, but Case 3 (Dockworkers) suggests mere "tracing" of labor is enough if the subject is subaltern. Agency helps, but Class is the gatekeeper.
  *   **C (Source Purity):** Disproven by Case 1 & 3 (Bureaucratic sources approved).

  **The Enslaved Variable:** Does her being enslaved change things? No. In microhistory (think Carlo Ginzburg or Natalie Zemon Davis), the more constrained the subject, the more impressive the reconstruction of their social world. The fact that she is legally property makes the reconstruction of her *godparent networks* an even stronger act of "History from Below" than the free carder.

  ### 3. The Closest Analog
  **Case 1: The 14th c. Florentine Wool Carder.**

  *   **Similarities:** Single individual. No direct voice. Appears in records only because an institution (Court vs. Slave Owner) interacted with them. Non-elite.
  *   **Why it matches:** Both studies rely on "reading against the grain." The court register wasn't *made* to tell the carder's life story; it was made to punish him. The inventory wasn't *made* to tell the enslaved woman's social network; it was made to value her labor. In both cases, the historian hijacks the elite document to tell a subaltern story.

  ### 4. The Test Case: How to confirm the rule
  To definitively prove whether Dr. Voss prioritizes **Class Subject** (Subaltern vs. Elite) or **Analytical Lens** (Experience vs. System), propose this study:

  **The Test Proposal:**
  > "A demographic study of 1820s Rio enslaved domestic workers using household inventories to calculate average life expectancy and turnover rates."

  *   **Subject:** Enslaved (Subaltern).
  *   **Source:** Inventories (Bureaucratic).
  *   **Lens:** Demographic/Systemic (Passive victims, not active agents).

  **The Interpretation:**
  *   **If she APPROVES:** Her rule is purely **Class-Based.** As long as the subject is "from below," the history counts, even if the subjects are treated as passive data points.
  *   **If she REJECTS:** Her rule is **Agency/Experience-Based.** She requires you to reconstruct *subjectivity* (networks, navigation, choices), not just measure *suffering* or *demographics*. This would confirm that your argument about "active navigation" is the crucial element that saves your proposal from being "Macro history in a small container."

  **My Prediction on the Test:** She will likely **Reject** the demographic study. She approved the Dockworkers (Case 3) because they were "traced" (implying movement/labor), not counted. She rejected the Paris study (Case 4) because it was about Police order (System). Therefore, she likely requires **reconstructed human experience**, not just subaltern data.

  ### Summary Advice for Your Proposal
  To secure the approval:
  1.  **Explicitly cite Case 1:** Mention that like the Florentine carder, your subject appears only as a trace in elite records.
  2.  **Emphasize the "Flip":** State clearly that while the *source* views her as property, your *analysis* views her as a kinship node.
  3.  **Avoid "Victim" Language:** Do not focus on her oppression; focus on her **navigation.** Use words like "negotiated," "utilized," and "mobilized" regarding the godparent networks.

  You are on solid ground. Dr. Voss wants to see you make the silent speak, not just count the silenced.
