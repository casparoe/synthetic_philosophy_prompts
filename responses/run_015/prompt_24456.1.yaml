      *   *Solomonoff Induction:* It is a mathematical framework for prediction based on algorithmic probability. It assigns prior probability $P(M) = 2^{-K(M)}$ to hypotheses (programs).
      *   *Occam's Razor:* "Entities should not be multiplied beyond necessity." In SI, shorter programs have higher prior probability.
      *   *Uncomputability:* Yes, SI is uncomputable due to the Halting Problem.
      *   *Language Dependence:* Kolmogorov complexity is invariant up to an additive constant across Universal Turing Machines (UTMs). $K_1(x) \le K_2(x) + c$.
      *   *The "Constant" Problem:* For finite data, $c$ can be huge. So language choice *does* matter practically.
      *   *Computable Universe:* SI works best if the true distribution is computable. If the universe has true randomness (quantum?) or hypercomputation, SI might not converge perfectly (though it handles randomness via probabilistic programs). *Correction:* SI handles stochastic environments by using probabilistic Turing machines or by treating randomness as part of the program input. However, if the universe is *non-computable* (e.g., requires an oracle), SI cannot model it perfectly.
      *   *Normative vs. Descriptive:* Is SI how the world *is*, or how an agent *should think*? Standard view: Normative ideal for rational agents.

  4.  **Drafting the Referee Report:**

