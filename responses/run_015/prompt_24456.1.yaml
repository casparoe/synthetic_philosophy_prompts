      *   **Lena's Rebuttal 1:** Ideal Gas Law is approximable/testable; SI isn't. It's decoration.
          *   *Analysis:* Strong point. We have computable approximations of SI (like MDL), but pure SI is unreachable.
      *   **Marco's Rebuttal 2:** Language dependence doesn't matter in the long run (Invariance Theorem).
          *   *Analysis:* Technically true (additive constant), but Lena's counter is about *finite* data.
      *   **Lena's Rebuttal 2:** We live in finite time. The constant *does* matter for real decisions.
          *   *Analysis:* This is the "Blum's Speedup Theorem" or just practical reality angle. Very strong point.
      *   **Marco's Closing:** SI explains *why* simpler is likely. Without it, Occam's is just a mood.
