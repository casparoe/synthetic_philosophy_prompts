      *   *Point 4: Rawls's Analogy.* Rawls says utilitarianism extends individual prudence to society. But individual prudence involves *one* consciousness experiencing both loss and gain. Society doesn't. However, utilitarianism doesn't claim society *is* one consciousness. It claims we should *act* to maximize good. The analogy collapses because utilitarianism doesn't require the metaphysical unity Rawls attacks.
