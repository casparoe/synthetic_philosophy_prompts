      *   **Task:** Argue *for* the position that this objection fails because it conflates "structural substitution" (treating persons as fungible) with "distributive optimization" (maximizing aggregate welfare without claiming interchangeability).
      *   **Key Claims to Defend:**
          1.  Utilitarian aggregation involves only distributive optimization, not structural substitution.
          2.  Structural substitution is a moral error blocked by deontological constraints (means/ends), not by metaphysical separateness.
          3.  Once distinguished, Rawls's analogy (society as a single person) collapses.
          4.  Utilitarianism is left vulnerable only to objections it can accommodate.
