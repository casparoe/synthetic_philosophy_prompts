  Because the prohibition against sacrifice is grounded in constraints on action rather than the structure of value, Rawls's analogy between interpersonal aggregation and the internal balancing of costs and benefits within a single life collapses. Rawls assumes utilitarianism extends individual prudence to society by positing a super-person, but utilitarianism requires only an impartial agent weighing distinct interests, not a unified consciousness experiencing them. Once the distinction between optimizing distribution and substituting persons is drawn, the objection loses its force, as utilitarianism can accommodate the inviolability of individuals through rule-based constraints while maintaining that welfare is the sole ultimate good. The guardian's dilemma thus reflects the tension of applying optimization within moral constraints, not a fundamental flaw in aggregating welfare across separate lives.
