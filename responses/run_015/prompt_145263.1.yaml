  2.  **Deconstruct the Argument:**
      *   *The Objection:* Rawls argues utilitarianism treats society like a single individual, sacrificing one person's interests for the greater good just as an individual sacrifices present pleasure for future gain. This ignores the "separateness of persons."
      *   *The Counter-Argument (Required):* The objection confuses *how* we calculate value (aggregation) with *how* we treat individuals (substitution).
      *   *Distinction:*
          *   Structural Substitution: Person A's loss = Person B's gain (fungibility). This is wrong.
          *   Distributive Optimization: Total welfare = Sum(A) + Sum(B). We aim for the highest sum, but acknowledge A and B are distinct.
      *   *Deontology's Role:* The prohibition against using someone merely as a means (Kantian constraint) stops structural substitution. Utilitarianism can incorporate side-constraints or rules that prevent this without abandoning aggregation.
      *   *Rawls's Analogy:* If utilitarianism doesn't claim persons are interchangeable parts of a super-person, the analogy fails.
      *   *Conclusion:* The separateness objection misses the mark; the real issue is constraints on action, not the metric of goodness.

  3.  **Drafting - Sentence 1 (Bottom Line):**
