  4.  **Analyzing the Breakdown Points (The "Audit"):**
      *   *Exit Rights:* You can't easily emigrate (costly, other states might not accept you) vs. running away (temporary) or leaving home (adult independence). The "right to exit" is a major point of contention in political theory (Beran, Wellman).
      *   *Hierarchy/Authority:* Parents have natural authority over children (paternalism) for their own good. States governing adults as children is infantilizing. Liberal theory rejects this (Kantian autonomy).
