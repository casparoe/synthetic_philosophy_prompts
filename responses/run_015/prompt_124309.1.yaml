  5.  **Addressing Specific Theoretical Questions:**
      *   *Consent vs. Association:* Settled that liberal contractarians reject the family model as a basis for *political* obligation because it lacks consent. Contested whether associative obligations exist at all (Hume vs. Rawls vs. Dworkin).
