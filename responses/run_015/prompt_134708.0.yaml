answer: |-
  You are not misreading people. You have identified a specific rhetorical and doctrinal move that is distinct from standard Buddhist intentionalism, standard consequentialism, and even standard virtue ethics.

  There is **no established academic term** for this specific asymmetry. Scholars usually lump it under "Intentionalism" (which misses the gatekeeping function) or "Skillful Means/Upaya" (which justifies the rule-breaking but doesn't necessarily explain the *nullification* of the outcome's moral weight).

  Since you asked for a term with sharp edges, I propose we call this: **Karmic Insulationism**.

  Here is the breakdown of the concept, its boundaries, and how it differs from the frameworks you already know.

  ### The Term: Karmic Insulationism

  **Definition:** A moral reasoning structure where the agent's internal mental state acts as a dielectric barrier (insulator), preventing the moral valence of external consequences from registering on the agent's karmic or ethical ledger.

  #### 1. The Sharp Edges (Inside vs. Outside)
  *   **Inside (The Conductor):** The agent's *cetana* (intention/motivation). Specifically, its alignment with "purity" (compassion/wisdom) or "defilement" (greed/aversion).
  *   **Outside (The Current):** The phenomenological outcome (harm/benefit, pleasure/pain).
  *   **The Mechanism (The Insulation):** In standard ethics, the "current" (outcome) flows to the agent and creates a charge (merit/demerit). In Karmic Insulationism, if the "conductor" (mind) is pure, the negative current of a harmful outcome is blocked—it creates no demerit. Conversely, if the conductor is impure, the positive current of a beneficial outcome is blocked—it creates no merit.

  #### 2. How It Differs from Standard Frameworks

  **Vs. Standard Consequentialism:**
  *   **Consequentialism:** Outcomes have intrinsic moral weight. A harmed being is a negative value regardless of why they were harmed.
  *   **Karmic Insulationism:** Outcomes have *conditional* moral weight. A harmed being is a negative value *only if* the harmer's mind was impure. If the mind was pure, the harm is morally inert (or retroactively justified).
  *   *The Edge:* Consequentialism aggregates outcomes; Insulationism nullifies them based on agency.

  **Vs. Standard Buddhist Intentionalism (*Cetana*):**
  *   **Standard Intentionalism:** "Intention *is* karma." The act is defined by the thought. The result (*vipaka*) is a separate fruit that ripens later.
  *   **Karmic Insulationism:** Intention does not just define the act; it **validates the reality of the consequence**. It claims that a pure intention doesn't just mitigate the bad karma of a harmful act; it renders the harm ethically irrelevant *in the moment of judgment*.
  *   *The Edge:* Standard intentionalism says "You did a bad thing with good intent (mixed karma)." Insulationism says "Because your intent was good, the bad thing doesn't count as bad."

  **Vs. Virtue Ethics:**
  *   **Virtue Ethics:** A virtuous agent performs the right act. If a virtuous agent causes harm, it is a tragedy or a mistake, but the agent remains virtuous.
  *   **Karmic Insulationism:** The virtue of the agent actively *transmutes* the moral nature of the harm. It is not just that the agent is forgiven; it is that the moral ontology of the event changes.
  *   *The Edge:* Virtue ethics evaluates the *agent*; Insulationism uses the *agent* to evaluate the *event*.

  #### 3. Why This Pattern Exists (The Doctrinal Root)
  This move usually emerges when **Mahayana Bodhicitta** collides with **Vinaya Precepts**.
  *   The Precept says: "Do not lie." (Rule-based/Deontological)
  *   The Bodhisattva Vow says: "Save all beings." (Consequentialist/Teleological)
  *   **The Resolution:** When these conflict, *Karmic Insulationism* is the patch. It allows the Bodhisattva to break the Precept (causing apparent harm) without incurring the karmic debt, provided the *Bodhicitta* (pure mind) is active.

  However, as you noted, it is applied asymmetrically in debate. It is frequently used to **defend harm** (my compassion insulates me from the lie) but rarely used to **credit benefit** (your irritation invalidates your help). This suggests it functions less as an ethical system and more as a **Soteriological Defense Mechanism**.

  #### 4. The Risk: The "Bodhisattva Alibi"
  The danger of Karmic Insulationism is that it creates an unfalsifiable ethical position.
  *   If the outcome is bad, the defender claims: "Your view is limited; my intention was pure." (Insulation activates).
  *   If the outcome is good, the critic claims: "Your intention was prideful." (Insulation activates to deny credit).

  Because "purity of mind" is unobservable to anyone but the agent (and arguably not even fully to them), **Karmic Insulationism removes ethical accountability from the intersubjective world and locks it inside private experience.**

  ### Summary
  You are seeing **Karmic Insulationism**. It is not merely "intention matters." It is the specific claim that **internal purity grants immunity from external causality.** It turns karma from a law of cause-and-effect into a law of **status-based exemption**.

  *   **Standard Karma:** Fire burns regardless of who touches it.
  *   **Karmic Insulationism:** Fire burns only if you are unworthy; if you are realized/pure, you can handle the fire without getting burned (and without the fire counting as burning).

  It is a potent soteriological tool, but ethically, it functions as a **moral hazard** that privileges the agent's self-assessment over the recipient's suffering.
