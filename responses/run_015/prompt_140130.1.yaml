prompt: |-
  My brother has been diagnosed as minimally conscious after a hypoxic brain injury, and the hospital where he is a patient is being asked to pilot a bedside consciousness monitor built on integrated information theory. Before our family advisory group takes a view on it, I want a specification rather than a pitch: what would a theory of consciousness have to deliver in order to be fit for this use — to underwrite a clinical judgment about whether a patient who cannot move or speak is having any experience at all?

  Give each requirement with the case or consideration behind it, and mark it non-negotiable or a preference of one camp. The ones I keep coming back to:

  - Level versus content, and wakefulness versus consciousness: it must do more than rank patients, and it must not treat the REM sleeper who is dreaming and the sleepwalker who is not as the same problem.
  - Grain, borders, and montage: the same recording rescored at a different spatial or temporal grain, or with a different electrode set, must not yield a different verdict; and the theory has to say where a system's boundary falls rather than letting it be drawn patient by patient.
  - The cerebellum-type case: a structure containing more neurons than the rest of the brain put together, which on the clinical picture as I understand it — congenital absence, focal lesions — perturbs coordination and cognitive timing rather than whether there is anything it is like for the patient, must not come out as the main seat of consciousness.
  - Hemispherectomy and split-brain: removing or disconnecting half the cortex leaves a conscious person behind, so a measure that tracks total integrated capacity has to say what has been lost and whether that loss is a difference in experience or only in a number.
  - Pharmacology: it must handle both drugs that abolish experience and drugs, like ketamine, that seem to abolish report while leaving experience intact — and it must not be moved by interventions that change signal complexity without changing what the subject undergoes.
  - The transfer problem: it will be calibrated on people who can report and used on people who cannot. Say what would have to be true for the calibration to carry over, and how a theory that is really only tracking the machinery of report could be caught doing so.
  - Computability and determinacy: a number from data a hospital can actually collect, with real noise, in minutes, with no free parameters tuned per patient.
  - Action-guidance: it has to license or forbid something we would not otherwise have done — a prognosis, an analgesic, a conversation at the bedside.

  Then the part I most want. Tell me which subset of these cannot be jointly satisfied, if any: my suspicion is that validation by report, applicability without report, and computability are not all available at once, and that the appearance of having all three comes from quietly substituting a proxy for the quantity. Say which single requirement excludes the most candidates, and flag any item on my list that is really a prejudice of one camp rather than a desideratum. Score IIT itself, global workspace theory, and higher-order theories in two or three lines each, but keep the weight on the requirements and their cases, not on the scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Family member of a patient in a Minimally Conscious State (MCS) due to hypoxic brain injury.
      *   **Context:** Hospital piloting a bedside consciousness monitor based on Integrated Information Theory (IIT).
      *   **Task:** Provide a *specification* (not a pitch) for what a theory of consciousness must deliver to be fit for clinical judgment regarding experience in non-communicative patients.
      *   **Requirements:** The user has provided a specific list of 8 requirements/concerns (Level vs. Content, Grain/Borders, Cerebellum, Hemispherectomy, Pharmacology, Transfer Problem, Computability, Action-Guidance).
      *   **Specific Instructions:**
          *   Give each requirement with the case/consideration behind it.
          *   Mark as "Non-Negotiable" or "Preference of One Camp".
          *   Identify which subset of requirements cannot be jointly satisfied (Trade-off Analysis).
          *   Identify the single requirement that excludes the most candidates.
          *   Flag any item that is a "prejudice of one camp".
          *   Score IIT, Global Workspace Theory (GWT), and Higher-Order Theories (HOT) in 2-3 lines each.
          *   **Tone:** Rigorous, analytical, empathetic but detached (specification style), avoiding hype.

  2.  **Deconstruct the Requirements:**

      *   *Level vs. Content (Wakefulness vs. Consciousness):* Crucial for distinguishing coma/vegetative state (arousal) from MCS (awareness). Also distinguishes REM (conscious) from NREM/_sleepwalking_ (unconscious).
      *   *Grain, Borders, Montage:* Robustness. If the metric changes based on electrode placement or time-window, it's not reliable. IIT specifically struggles with defining the "system boundary" (the exclusion postulate).
      *   *Cerebellum Case:* The "Little Brain" has huge neuron count but lesions don't wipe out consciousness. A theory counting neurons or raw integration must not flag the cerebellum as the seat of consciousness.
      *   *Hemispherectomy/Split-Brain:* If half the brain is gone, is $\Phi$ (integrated information) halved? If so, is consciousness halved? Clinical reality suggests a unified conscious self remains.
      *   *Pharmacology:* Dissociatives (ketamine) vs. Anesthetics (propofol). Ketamine preserves experience but disrupts report. Propofol abolishes experience. The monitor must distinguish these.
      *   *Transfer Problem:* Calibrated on healthy reporters, applied to non-reporters. How do we know the correlate holds? Risk of tracking "ability to report" rather than "experience".
      *   *Computability:* Must work in a hospital setting (EEG/MEG), noisy data, fast, no tuning per patient.
      *   *Action-Guidance:* Must change clinical care (pain management, withdrawal of life support, stimulation).

  3.  **Evaluate Trade-offs (The "Impossible Trinity"):**
      *   The user suspects: Validation by Report + Applicability without Report + Computability are incompatible.
      *   *Analysis:* To validate without report, you need a theory that *defines* consciousness independently of behavior. But to *verify* that definition, you historically need report. If you rely on report for calibration (machine learning style), you aren't measuring consciousness, you're measuring the *correlates of report*.
      *   *The Conflict:* **Computability** often forces simplifications (like using EEG proxies for $\Phi$) that undermine the theoretical rigor required to solve the **Transfer Problem**.
      *   *The Hard Exclusion:* **Computability/Determinacy** is likely the biggest filter. True IIT is NP-hard. Approximations (like $\Phi_{CID}$ or PCI) sacrifice theoretical purity for speed.
      *   *Prejudice Check:* "Grain/Borders" is heavily IIT-specific (Exclusion Postulate). "Level vs Content" is generally accepted but definitions vary.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the gravity. Set the tone (specification, not sales).
      *   **The Specification (The 8 Points):**
          *   Format: Requirement, Case/Consideration, Status (Non-Negotiable/Preference).
          *   *Refinement:* Ensure the distinction between "wakefulness" (brainstem/arousal) and "consciousness" (cortical/experience) is clear.
          *   *Refinement:* For "Grain/Borders", note that IIT claims to solve this via the Exclusion Postulate, but practical measures often fail it.
          *   *Refinement:* For "Cerebellum", emphasize that connectivity matters more than neuron count.
          *   *Refinement:* For "Transfer Problem", this is the epistemological bottleneck.
      *   **The Trade-off Analysis (The "Impossible Trinity"):**
          *   Address the user's suspicion. Yes, there is a tension.
          *   Identify the "Proxy Risk": Measures like PCI (Perturbational Complexity Index) track complexity, which correlates with consciousness, but might just track information processing capacity.
          *   Identify the biggest exclusion: **Computability**. True theoretical measures are too slow/complex for bedside.
          *   Identify the Prejudice: **Grain/Borders**. This is specifically an IIT demand. Other theories (GWT) don't care about precise spatial boundaries in the same way.
      *   **Theory Scorecard:**
          *   IIT: Good on borders/cerebellum (in theory), bad on computability.
          *   GWT: Good on report/action, bad on unconscious experience (e.g., REM).
          *   HOT: Good on distinguishing states, bad on non-human/non-report applicability.
      *   **Conclusion:** Final advice for the family advisory group.

  5.  **Refining the Tone and Accuracy:**
      *   *Caution:* IIT is controversial. PCI (Perturbational Complexity Index) is the practical derivative often used (e.g., by Tononi/Massimini). I need to distinguish between the *theory* (IIT 3.0/4.0) and the *measure* (PCI). The prompt asks about a monitor "built on integrated information theory". This usually implies PCI or $\Phi$-approximations.
      *   *Accuracy Check:* Does IIT handle the cerebellum? Yes, via the exclusion postulate (cerebellum is feedforward, low $\Phi$). Does it handle hemispherectomy? It predicts two conscious entities if split, one if integrated. If half is removed, $\Phi$ drops, but does *presence* drop? IIT says quantity of consciousness drops. This conflicts with the user's "conscious person remains" intuition. I need to highlight this tension.
      *   *Accuracy Check:* Ketamine. PCI works well here (high complexity under ketamine). EEG power spectra fail.
      *   *Accuracy Check:* Transfer Problem. This is the "Hard Problem" applied to diagnostics. We assume NCC (Neural Correlates of Consciousness) hold across populations.

  6.  **Final Review against Constraints:**
      *   Did I mark Non-Negotiable vs. Preference? Yes.
      *   Did I identify the incompatible subset? Yes.
      *   Did I score the theories in 2-3 lines? Yes.
      *   Is the tone appropriate? Yes, serious and analytical.

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe "Grain/Borders" is non-negotiable.
      *   *Correction:* For a *clinical* tool, robustness is non-negotiable. But the specific demand that the *theory* define the boundary (Exclusion Postulate) is an IIT preference. I should distinguish between "Robustness" (Non-negotiable) and "Theoretical Boundary Definition" (Preference).
      *   *Initial thought:* Score GWT highly.
      *   *Correction:* GWT relies on report/access. For non-communicative patients, GWT struggles to distinguish locked-in from vegetative if access is broken. IIT claims to measure *capacity* regardless of access. I need to reflect this nuance.

  8.  **Final Polish:** Ensure the distinction between $\Phi$ (theoretical) and PCI (empirical measure) is clear where necessary, as hospitals use PCI, not raw $\Phi$. The prompt asks about a monitor "built on IIT", which implies the theoretical underpinning claims validity for the measure.

  *(Self-Correction on the "Prejudice" item)*: The user asked to flag items that are prejudices of one camp. "Grain, borders, and montage" is heavily IIT-centric (Exclusion Postulate). Other theories treat boundaries more functionally. I will flag this.

  *(Self-Correction on Trade-offs)*: The user suspects Validation by Report, Applicability without Report, and Computability are the triad. I will confirm this tension.

  Let's write.
answer: |-
  This specification is drafted for a Family Advisory Group evaluating a diagnostic tool for Disorders of Consciousness (DoC). It treats the monitor not as a medical device in the traditional sense (measuring blood pressure) but as an epistemic instrument claiming to measure a private ontological state (experience).

  ### Specification for a Clinical Consciousness Monitor

  **1. Level versus Content (Wakefulness vs. Consciousness)**
  *   **Case:** Arousal (eyes open, sleep-wake cycles) is brainstem-driven; consciousness (experience) is cortico-thalamic. A monitor must distinguish the wakeful but unconscious (sleepwalking, some vegetative states) from the asleep but conscious (REM dreaming, locked-in syndrome). It must not conflate motor output with experiential presence.
  *   **Status:** **Non-Negotiable.** Confusing arousal with awareness leads to catastrophic errors in prognosis and pain management.

  **2. Grain, Borders, and Montage (Robustness & Exclusion)**
  *   **Case:** Clinical EEG is noisy and montage-dependent. If the verdict changes because an electrode slipped 2cm, or if the time-window shifts from 1 second to 5, the measure is unstable. Furthermore, the theory must define *which* neurons count (the boundary problem) without arbitrary manual selection.
  *   **Status:** **Non-Negotiable** for Robustness; **Preference of One Camp** for Theoretical Borders. (Robustness is required for any medical device. The demand that the *theory* mathematically dictate the physical boundary of the conscious system is specific to Integrated Information Theory's "Exclusion Postulate.")

  **3. The Cerebellum-Type Case (Anatomical Specificity)**
  *   **Case:** The cerebellum contains ~80% of the brain's neurons but its removal does not abolish consciousness. A measure based on raw neural count, connectivity density, or signal complexity alone risks falsely identifying the cerebellum as a seat of consciousness. The metric must weight *recurrent* integration over *feedforward* processing.
  *   **Status:** **Non-Negotiable.** A false positive here invalidates the measure's claim to track experience rather than computation.

  **4. Hemispherectomy and Split-Brain (Unity vs. Quantity)**
  *   **Case:** Patients with functional hemispherectomies remain conscious. Split-brain patients may harbor two streams. A scalar metric (a single number) must clarify if a drop in score means *less* consciousness (dimmer light) or *less capacity* for complex content (lower resolution), and whether disconnected systems count as one or two subjects.
  *   **Status:** **Preference of One Camp.** (IIT predicts a drop in the *quantity* of consciousness [$\Phi$] with lost tissue. Clinical phenomenology suggests the *presence* of a self remains intact. This requirement challenges theories that equate consciousness quantity with system size.)

  **5. Pharmacology (Dissociation vs. Suppression)**
  *   **Case:** Propofol abolishes experience; Ketamine abolishes report but preserves (or alters) experience. A monitor must show high consciousness signatures under Ketamine and low under Propofol, despite both disrupting normal communication. It must not be fooled by agents that increase signal entropy without increasing integration.
  *   **Status:** **Non-Negotiable.** Essential for distinguishing anesthesia from dissociation in pain management.

  **6. The Transfer Problem (Calibration Validity)**
  *   **Case:** The device is calibrated on healthy subjects who can press a button when they see a stimulus. It is applied to your brother, who cannot. For this to hold, the neural correlate of consciousness (NCC) must be invariant across pathology. If the measure actually tracks the *machinery of report* (motor planning, working memory) rather than experience, it will yield false negatives in MCS.
  *   **Status:** **Non-Negotiable.** This is the primary epistemological risk. Without a solution here, the device is measuring "ability to comply," not "presence of experience."

  **7. Computability and Determinacy (Clinical Feasibility)**
  *   **Case:** The calculation must run on bedside hardware, in minutes, with noisy EEG/MEG data. It cannot require free parameters tuned per patient (e.g., "this threshold works for trauma, this one for hypoxia"). It must be deterministic.
  *   **Status:** **Non-Negotiable.** A theoretical measure that cannot be computed in real-time is a philosophy paper, not a monitor.

  **8. Action-Guidance (Utility)**
  *   **Case:** The output must license a specific intervention: withdrawing life support, administering analgesia, or initiating neuro-rehabilitation. If the result is "Probability of Consciousness: 45%," and clinical care remains unchanged, the test is ethically inert.
  *   **Status:** **Non-Negotiable.** Diagnostic tools must alter management to justify the cost and emotional burden.

  ***

  ### Trade-Off Analysis: The Impossible Trinity

  Your suspicion is correct. There is a fundamental tension between **Validation by Report**, **Applicability without Report**, and **Computability**.

  1.  **Validation by Report:** To know if a measure works, we historically compare it against a subject's report ("I was conscious").
  2.  **Applicability without Report:** To use it on your brother, we must assume the measure works *without* comparing it to his report (which is impossible).
  3.  **Computability:** To make the measure fast enough for a hospital, we must approximate the theory.

  **The Conflict:**
  To satisfy **Computability**, theorists often replace the true theoretical quantity (e.g., exact $\Phi$ in IIT) with a proxy (e.g., Perturbational Complexity Index [PCI] or Lempel-Ziv complexity). These proxies are validated against **Report** in healthy subjects (e.g., wakefulness vs. anesthesia). However, when applied to brain-injured patients (**Applicability without Report**), we assume the proxy still tracks experience and not just the capacity for complex information processing.

  If the proxy actually tracks the *capacity for report* (information integration needed to speak/press a button) rather than *experience itself*, it will fail in MCS patients who have experience but lack the machinery to report. **You cannot verify the Transfer Problem without solving the Hard Problem.**

  **The Single Biggest Exclusion:**
  **Computability and Determinacy.**
  True Integrated Information ($\Phi$) is NP-hard to calculate. It requires knowing the causal structure of every element in the system. No bedside monitor calculates true $\Phi$. They calculate approximations (like $\Phi_{CID}$ or PCI). This requirement excludes the pure theory from the clinical tool, forcing a reliance on correlates that may not fully satisfy the theoretical requirements (like Grain/Borders).

  **The Prejudice Flag:**
  **Grain, Borders, and Montage (Theoretical Borders).**
  While robustness is non-negotiable, the demand that the *theory* define the precise spatial boundary of the conscious system (the Exclusion Postulate) is a specific preference of **Integrated Information Theory**. Global Workspace and Higher-Order theories treat boundaries more functionally. Insisting on a mathematically derived physical boundary excludes viable theories that define consciousness by function rather than topology.

  ***

  ### Theory Scorecard

  **Integrated Information Theory (IIT)**
  *   **Score:** High on Anatomy/Pharmacology; Low on Computability.
  *   **Assessment:** Best at handling the Cerebellum and Ketamine cases via its focus on recurrent causality. However, true $\Phi$ is uncomputable for large systems; clinical versions (PCI) are proxies that may not fully satisfy the "Borders" requirement.

  **Global Workspace Theory (GWT)**
  *   **Score:** High on Action-Guidance; Low on Transfer Problem.
  *   **Assessment:** Excellent at predicting report and cognitive access. Risks false negatives in non-communicative patients (MCS) because it conflates *having* an experience with *broadcasting* it for report.

  **Higher-Order Theories (HOT)**
  *   **Score:** High on Level vs. Content; Low on Clinical Applicability.
  *   **Assessment:** Distinguishes first-order states from awareness of them well. Clinically inert for non-verbal patients, as it requires assessing meta-cognitive capacity which is impossible to measure without behavior.

  ### Recommendation for the Advisory Group

  Do not ask if the monitor measures consciousness. Ask: **"On what population was this proxy validated, and what is the false-negative rate for patients who have experience but cannot move?"**

  If the answer relies on data from healthy volunteers under anesthesia, the Transfer Problem is unsolved. If the answer acknowledges this uncertainty but argues the risk of missing consciousness is worse than the risk of false hope, that is an ethical stance, not a scientific specification. Proceed only if the action-guidance (Requirement 8) is clearly defined for ambiguous results.
