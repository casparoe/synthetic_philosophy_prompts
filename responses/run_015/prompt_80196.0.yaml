answer: |-
  The dinner party defense of Thomas Malthus has become a ritual incantation. When the specter of overpopulation arises, the defender of the parish priest steps in with the same comforting line: *Malthus was right, just early.* The logic is seductive. It suggests that the grim arithmetic of scarcity is merely biding its time, that the Green Revolution was a temporary reprieve, and that the positive checks of famine, war, and disease are still waiting in the wings.

  But this defense is not a rescue of Malthusianism. It is a confession of its death. To claim a theory is "early" after two centuries of missed deadlines is not to validate the theory; it is to drain it of all scientific content. To see why, we must separate the bare prediction from the mechanism, and then recognize that "right but early" is nothing more than a degenerating move in the sense described by the philosopher of science Imre Lakatos.

  Malthus did not merely offer a vague worry that people might one day be hungry. He proposed a specific, testable engine of history. His *Essay on the Principle of Population* committed to a precise mechanism: population grows geometrically ($2, 4, 8, 16\dots$), while the means of subsistence grows arithmetically ($1, 2, 3, 4\dots$). Because the curves must diverge, misery is inevitable. The "check" on population was not supposed to be voluntary restraint or technological innovation, but the "positive checks" of mortality: famine, plague, and war.

  When we separate this mechanism from the bare prediction, the hollowness of the "early" defense becomes apparent. The bare prediction is simply: *Eventually, $P > F$ (Population exceeds Food).* The mechanism is *why* and *how* that happens. If the mechanism is broken—if food can grow geometrically through technology, or if population growth slows naturally due to development—then the specific claim Malthus made is falsified.

  This is where the Lakatosian critique bites. For Lakatos, a scientific research program consists of a "hard core" of assumptions protected by a "protective belt" of auxiliary hypotheses. A program is progressive if it predicts novel facts. It becomes degenerating when it survives falsification only by adding ad hoc adjustments that explain away failures without predicting anything new.

  Saying Malthus was "early" is the ultimate ad hoc hypothesis. It is an adjustment to the protective belt designed solely to immunize the hard core against the evidence of the last 200 years. If a theory predicts a crisis by 1900, and it doesn't happen, the theorist moves the date to 2000. When that passes, they move it to 2050. This is not science; it is bookkeeping. It turns the theory into an unfalsifiable tautology. If the crash can always be relegated to the horizon, the theory can never be proven wrong, which means it can never be proven right, either.

  We can visualize this through the old Ptolemaic picture of "saving the phenomena." When the geocentric model failed to predict planetary positions, astronomers didn't abandon Earth as the center; they bolted on epicycles—circles moving upon circles—to force the math to match the sky. The "right but early" defense is a temporal epicycle. It is bolting on time to save the phenomenon of scarcity. Every time the crisis fails to materialize, another ring of "decades" is added to the model. This is not theoretical progress; it is a desperate attempt to keep a dead paradigm breathing by postponing its autopsy.

  There is a crucial distinction to be drawn between a bare postponement and a real theoretical correction. A postponement says the mechanism is intact, but the timing is off. A correction admits the mechanism itself has changed. The Green Revolution was not luck; it was a structural refutation of the arithmetic growth function. With Haber-Bosch nitrogen fixation and high-yield varieties, humanity did not merely delay the Malthusian trap; we broke the lock. We changed the exponent on the food production curve.

  To insist Malthus was "early" is to ignore that the constants in his equation have been fundamentally altered. It is to claim that a clock is "right but early" when you have actually removed the mainspring. The reason the famines didn't hit as Malthus predicted is not because we got lucky with the timing, but because he was wrong about the capacity of human innovation to decouple food production from land constraints.

  Ultimately, once "early" can be stretched to mean "not yet, but eventually," the original claim has been drained of any content that could have been tested. A prediction that resides permanently in the future is not a hypothesis; it is a prophecy. Malthus offered a scientific theory about the relationship between resources and reproduction. By retreating to "right but early," his defenders have abandoned the science and kept only the gloom. They have saved the prediction by killing the theory.
