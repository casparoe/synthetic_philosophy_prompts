  **Person-Affecting Views:** Committed to the asymmetry of existence; we owe duties to specific people, not possible people. Evidence is the intuition that non-existence cannot be harmed or benefited and the moral significance of identity. They treat incompleteness (inability to rank different-sized populations) as a feature, not a bug, acknowledging limits of comparison rather than forcing a ranking where none exists. They rely heavily on the distinction between making people happy and making happy people.

  3. **The 'barely worth living' point**

  Vagueness does not dissolve the logical problem, only its psychological impact. If welfare is a continuous variable, the transition from 'excellent' to 'barely worth living' can be modeled without linguistic ambiguity. Your friend's point highlights that 'barely worth living' is phenomenologically unstable—we struggle to imagine lives so dull they are still positive. This makes the Repugnant Conclusion feel like a trick of description. However, as you argued, sharp thresholds rebuild the paradox. If we define a specific utility value (e.g., 0.001) as 'barely worth living', the math remains unchanged. Vagueness cuts against the *rhetorical* force of the conclusion, making it harder to visualize the Z-population, but it does not cut against the *structural* entailment of Total Views. It explains why the conclusion feels repugnant, not why it is false. The sorites artefact argument fails because the paradox relies on the *sum* of small positives, not the definition of the positive. Even with sharp definitions, the aggregation of trivial goods outweighing significant goods remains the core tension, independent of linguistic boundary disputes. The friend's point addresses the phenomenology of the intuition, not the logic of the aggregation.

  4. **What would count as progress**

  Progress requires abandoning the search for a complete, transitive ordering of all possible populations. Given the impossibility theorems (Arrhenius), demanding such an ordering is akin to demanding a square circle. The most fruitful path is distinguishing 'betterness' (a theoretical relation) from 'choiceworthiness' (a practical guide). If we accept 'imprecise comparability,' where some populations are neither better, worse, nor equal, the pressure to bite bullets diminishes. We can say the Repugnant Population is not *better* than the Excellent Population, even if it isn't *worse* in a strict transitive sense.

  Alternatively, progress lies in shifting from ideal theory to non-ideal policy. If no theory satisfies all intuitions, we select theories based on robustness in realistic scenarios, not edge cases. Empirical input won't solve the normative clash, but understanding the psychological origins of our intuitions (e.g., scope neglect) might weaken their evidentiary status. Ultimately, progress may mean accepting that population ethics is inherently incomplete. We should expect no final verdict, only a clearer map of the trade-offs. The goal shifts from solving the paradox to managing the uncertainty it reveals about value itself. A formal result proving that no theory satisfies all conditions without restating known impossibility theorems would be needed, but conceptual clarity on the 'betterness' vs. 'choice' distinction is the immediate viable step. However, one must also consider the argument that no progress should be expected. If the disagreement is about bedrock intuitions—where one side feels the Repugnant Conclusion is false by inspection and the other feels transitivity is true by inspection—rational persuasion hits a wall. These are not empirical claims subject to falsification. In this light, progress is not resolution but articulation. We map the boundaries of the impossible to understand the shape of our values. The stalemate reveals that value might not be a single scalar quantity. Accepting this pluralism is itself a form of progress, moving from confusion to clarified conflict.

  5. **Bottom line**

  Concede to your friend that vagueness isn't a logical solution and that axiology might not directly dictate policy without additional bridging principles. You are entitled to keep the insistence that formal constraints (transitivity) are the engine of the impossibility, and that sharp thresholds do not escape the structural problem. Acknowledge that you are arguing about the rules of the game, not just the moves. The stalemate itself is valuable data, revealing that value may not be a single scalar quantity. Accept that clarity on the impasse is a form of progress.
