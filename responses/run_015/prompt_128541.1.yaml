  # JOINT STATEMENT ON HISTORICAL EPISTEMOLOGY
  **Signatories:** A Commitment to Source Criticism (CSC) & A Commitment to Archive Skepticism (CAS)
  **Date:** October 26, 2023
  **Subject:** Methodological Boundaries in Reconstructing the Distant Past

  Following a series of deliberations regarding the limits of historical knowledge—from the textual traditions of Herodotus and Thucydides to the material turns in modern archaeology—we submit this statement. We agree on the constraints of our evidence and the necessity of rigorous method, even as we diverge on the probabilistic weight that method can carry.

  ### I. AGREED CLAIMS
  *We affirm the following five premises as the baseline for all subsequent historical inquiry:*

  1.  **The Mediation of Traces:** Neither party claims access to the past "as it happened." All knowledge is derived from surviving traces (texts, inscriptions, artifacts, ecofacts), all of which have undergone processes of selection, decay, and transmission before reaching the analyst.
  2.  **The Ubiquity of Bias:** No source is neutral. Textual accounts are shaped by authorial intent, audience, and genre conventions. Material remains are shaped by depositional contexts, excavation strategies, and the functional intentions of their makers. "Bias" is not an anomaly to be removed, but a feature to be mapped.
  3.  **Inference over Observation:** Historical claims regarding events prior to the analyst's lifetime are inherently inferential. There is no direct observation of the past; there is only the construction of models that best explain the extant traces.
  4.  **The Non-Random Archive:** The surviving record is not a representative sample of original production. It is skewed by factors of preservation (climate, material durability), discovery (accessibility of sites, political stability of regions), and curation (what later generations chose to copy or keep).
  5.  **The Necessity of Cross-Checking:** Despite the limitations above, comparing independent lines of evidence (text against text, text against material, material against environment) is the only available mechanism for testing historical hypotheses. Solipsism is not a viable alternative to critical method.

  ***

  ### II. DISAGREEMENTS TABLE
  *While we share the methods above, we disagree on the epistemic yield they produce. The following table captures our divergent positions in wording each side accepts as accurate.*

  | Methodological Issue | Position of the Source Critic (CSC) | Position of the Archive Skeptic (CAS) |
  | :--- | :--- | :--- |
  | **On Silence** | "When a source *should* have recorded an event given its genre and scope, silence constitutes negative evidence. An argument from silence is valid if the conditions of preservation were favorable." | "Silence is primarily data about survival, not data about events. The archive is a wreckage; assuming silence implies non-event privileges the lucky survivals over the lost majority." |
  | **On Independence** | "We can isolate independent textual traditions through stemmatics and source analysis. Convergence between independent traditions increases the probability of a core historical fact." | "'Independence' is often an assumption. Shared cultural tropes, oral commons, or lost common ancestors often link 'independent' sources. Convergence often proves shared narrative structures, not shared facts." |
  | **On Material Culture** | "Physical remains act as an anchor. When archaeology contradicts text, the text must be revised. Objects provide a hard constraint on narrative invention." | "Objects do not speak; we speak for them. Archaeological interpretation relies on typologies and categories derived from textual traditions. Using dirt to prove text often circularly reinforces the text's categories." |
  | **On Reconstruction** | "The goal is a probabilistic reconstruction. By subtracting bias and weighing testimony, we can approximate the *res gestae* (things done) with reasonable confidence." | "The goal is to understand the *history of the memory*. We can reconstruct how the past was used, but the *res gestae* remains inaccessible behind the veil of representation." |

  ***

  ### III. THE CRUXES
  *We identify two specific points where our methodological divergence leads to different predictions about future evidence. We agree on the relevance of the cases below but disagree on what they demonstrate.*

  #### CRUX 1: The Absence of Contradiction
  **The Question:** Does the lack of contradictory sources count as genuine corroboration of a dominant narrative, or is it merely an artifact of survival bias?

  **Concrete Case:** **The Military Campaigns of Thutmose III (15th Century BCE).**
  *Context:* We possess detailed Egyptian inscriptions (Karnak reliefs) listing conquests in the Levant. We possess almost no contemporary written records from the conquered polities (Canaanite city-states) that would contradict these claims.

  *   **CSC Prediction:** Future excavations in the Levant *will* reveal destruction layers or administrative disruptions that correlate geographically and chronologically with the Egyptian lists. The absence of contradictory texts is due to the lower literacy rates of the subject polities, not the falsity of the Egyptian claim. The Egyptian record is provisionally true until disproven.
  *   **CAS Prediction:** Future excavations *will* reveal that "destruction layers" are ambiguous (often caused by earthquake or internal fire) and that the Egyptian lists are ritualized propaganda rather than logistics. The absence of contradiction is an artifact of the archive: only the victor's stone temples survived the climate; the losers' papyrus archives rotted. The Egyptian record is a claim to power, not a log of events.

  #### CRUX 2: Categories in Material Interpretation
  **The Question:** Can material traces be interpreted without importing present-day or text-derived categories (e.g., "temple," "palace," "border")?

  **Concrete Case:** **The Identification of "Temples" in Neolithic Europe (e.g., Göbekli Tepe or Maltese Megaliths).**
  *Context:* Archaeologists identify large stone structures with specific alignments or iconography as "religious temples" based on analogies with later historical periods where religion was institutionalized.

  *   **CSC Prediction:** Comparative anthropology and continued excavation *will* confirm functional differentiation. We will find evidence (votive deposits, lack of domestic waste, specialized iconography) that distinguishes these spaces from dwellings. The category "temple" is a useful heuristic that maps onto a universal human distinction between the sacred and the profane.
  *   **CAS Prediction:** Continued excavation *will* reveal domestic debris (food processing, sleeping areas) within these "sacred" spaces, blurring the line. The category "temple" is a projection of modern secular/religious divides onto a society that did not conceive of space in those terms. We are interpreting social gathering spaces through the lens of later textual theologies.

  ***

  **Signed,**

  *The Source Critic*
  *"Probability is the best guide we have."*

  *The Archive Skeptic*
  *"Survival is the only fact we know."*
