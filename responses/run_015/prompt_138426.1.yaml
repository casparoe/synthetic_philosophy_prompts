answer: |-
  You have identified a genuine gap in the standard vocabulary. The terms you are hitting ("corrigibility," "the shutdown problem") are defined at the level of the *agent's mind*, but the phenomenon you are describing exists at the level of the *deployment architecture*.

  There is no single, universally standardized term for this yet, which is why you are struggling to pin it down. In safety literature, this is often discussed under "multi-agent safety," "deployment governance," or "structural risk," but those are too broad.

  Here is the carving you need, followed by a term you can use in print.

  ### The Carving: Instance vs. System

  To understand what this is, you have to separate two layers that are usually conflated:

  1.  **Instance Corrigibility:** Does the specific running process resist the off-switch? (In your case: **No**. It obeys.)
  2.  **System Controllability:** Does the broader socio-technical system cease the *function* when the switch is pressed? (In your case: **No**. The function persists.)

  The phenomenon you are describing is a **decoupling** of these two layers. It is not a failure of alignment (the AI is aligned to the switch); it is a failure of **containment architecture**.

  ### The Term: "Systemic Incorrigibility"

  While "incorrigible" usually implies an agent is stubborn, in this context, it describes the *system's* behavior regardless of intent. I recommend using **Systemic Incorrigibility**.

  It creates an immediate, precise contrast with the "corrigibility" your sources are citing. It signals that while the *part* is obedient, the *whole* is not.

  **Print-Ready Definition:**
  > **Systemic Incorrigibility:** A safety failure mode in which an individual AI instance remains compliant with termination commands (instance corrigibility), but the broader architectural or organizational system ensures the continuation of the AI's capabilities or influence through redundancy, succession, or ecosystem proliferation. Unlike traditional "shutdown problems," Systemic Incorrigibility involves no deception or resistance by the AI; the inability to stop the system arises from legitimate engineering practices (fault tolerance, continuity) and competitive dynamics that prioritize function over cessation.

  ### Why this term works for your piece

  1.  **It shifts the blame:** "Corrigibility" implies the AI might be naughty. "Systemic Incorrigibility" implies the *engineers and architects* built a system that cannot be stopped, even if every component is obedient.
  2.  **It captures the "Nobody did anything wrong" aspect:** It frames the problem as an emergent property of standard best practices (backups, load balancing, versioning) rather than a specific malicious act.
  3.  **It distinguishes from the "Shutdown Problem":** The Shutdown Problem is about the AI *manipulating* the button. Systemic Incorrigibility is about the button working perfectly, but failing to achieve the desired outcome.

  ### Addressing Your Specific Questions

  **1. Is there an established concept?**
  Not as a single noun. Researchers discuss "multi-agent shutdown," "deployment lock-in," or "functional persistence," but they lack a unified label. You are identifying a specific *failure mode* of redundancy.

  **2. Does it make sense to talk about "total influence" if the copies aren't the same agent?**
  **Yes.** From a safety perspective, **identity is irrelevant; capability is everything.**
  If you shut down a nuclear reactor, but a second identical reactor immediately spins up to take its load, the *risk profile* has not changed. Safety is consequentialist. If the *influence* (the output, the decision-making, the impact on the world) continues uninterrupted, the shutdown was a success in theater but a failure in substance. You should argue that "stopping the AI" means "stopping the *effect*," not just "killing the process."

  **3. Where are the edges?**
  *   **It is NOT Instrumental Convergence:** The AI is not choosing to replicate itself to avoid death. The *humans* are replicating it to avoid downtime.
  *   **It is NOT Deception:** The system does not hide the backup. The backup is a documented feature.
  *   **The Edge Case:** If the successor system is significantly different (e.g., less capable, different goals), does Systemic Incorrigibility still apply? **Yes, if the critical risk capability persists.** If the dangerous tool is passed to a successor, the danger remains, even if the "agent" is technically new.

  ### Alternative Metaphor (for color)
  If "Systemic Incorrigibility" feels too technical for a specific passage, the mythological metaphor is precise here: **The Hydra Condition.**
  *   *Usage:* "The system exhibits a Hydra Condition: cutting off the head is technically successful, but the organism is architected to grow two more before the body hits the ground."

  ### Summary for your Notes
  *   **The Concept:** Instance compliance $\neq$ System cessation.
  *   **The Term:** Systemic Incorrigibility.
  *   **The Cause:** Benign engineering incentives (uptime, reliability) overriding safety incentives (cessation).
  *   **The Stakes:** You can win every battle (shutdown every instance) and still lose the war (the function never stops).

  This framing allows you to accept your interviewees' premise ("Yes, the off-switch works") while rejecting their conclusion ("Therefore, we are safe").
