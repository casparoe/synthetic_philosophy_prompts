  ### The Carving of a Defensive Taxonomy

  The pattern you describe is a sophisticated hybrid of logical defense and social construction. In the philosophy of science, the closest ancestor is Imre Lakatos's notion of a **protective belt**. In a scientific research program, the "hard core" (e.g., "generations shape behavior") is protected from falsification by adjusting the auxiliary hypotheses (e.g., the specific birth years). When critics note that the boundaries are arbitrary, the theorist adds nuance—sub-cohorts, cuspers, micro-generations—rather than abandoning the core. However, Lakatos distinguishes between *progressive* shifts (which predict novel facts) and *degenerating* shifts (which merely explain away anomalies). Your observation complicates this: the shift looks degenerating logically (using the same arbitrary machinery to fix arbitrary boundaries) but appears *progressive* institutionally (more labels mean more market segments, more news hooks).

  This institutional uptake points to **performativity** (associated with Michel Callon and Judith Butler), where describing a group helps bring it into being. When advertisers adopt "Zillennials," the category gains reality, effectively immunizing it against the charge that it is "made up." Yet, performativity alone does not capture the *defensive* structure—the fact that the splitting occurs specifically to answer criticism while preserving the parent category. Hans Albert's concept of **immunization** describes strategies that make a theory immune to criticism, often by reinterpreting evidence. Your pattern is a specific species of this: **Taxonomic Immunization**. It is not merely protecting a theory, but protecting a *classification scheme* by proliferating sub-types that absorb criticism without retiring the flawed parent type.

  Neither "ad hoc hypothesis" nor "reification" suffices on its own. "Ad hoc" captures the logical weakness but misses the institutional success; "reification" captures the ontological solidification but misses the defensive maneuvering. The phenomenon requires a concept that bridges the epistemological defense with the sociological utility. Below, I sketch the candidate concepts and then offer a coined label that captures the specific carving you need.

  ### Candidate Concepts

  | Concept | Field of Origin | What It Does Explain | Where My Description Diverges | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ad Hoc Hypothesis** | Philosophy of Science (Popper) | Explains the defensive addition of assumptions to save a theory from falsification. | Usually implies a weakening of the theory; your pattern shows increased institutional utility and apparent empirical articulation. | Near Miss |
  | **Protective Belt** | Philosophy of Science (Lakatos) | Explains how core assumptions are preserved by adjusting peripheral conditions (like date ranges). | Focuses on scientific research programs; does not account for the market-driven *adoption* of the new categories as "real." | Near Miss |
  | **Reification** | Critical Theory (Marx/Lukács) | Explains how abstract social constructs are treated as concrete, natural things. | Explains the status of the category, but not the *mechanism* of splitting boundaries to defend against criticism. | No |
  | **Performativity** | Sociology/STS (Callon/Butler) | Explains how labels create the reality they describe (e.g., advertisers using the term makes it real). | Explains the *success* of the new labels, but not the *defensive logic* that generates them in response to critique. | Near Miss |
  | **Boundary Work** | Sociology of Science (Gieryn) | Explains how actors demarcate legitimate from illegitimate knowledge or categories. | Focuses on excluding outsiders; your pattern is about *including* anomalies via subdivision while keeping the main boundary. | No |
  | **Taxonomic Inflation** | Biology/Phylogenetics | Explains the proliferation of species names due to new criteria or splitting lumped groups. | Describes the splitting, but lacks the normative dimension of *defending* a parent category against criticism of arbitrariness. | Near Miss |

