answer: |-
  The implicit theory reconstructing this practice is the **Fiduciary-Hierarchical Theory of Temporal Authority**. It posits that normative power over time is held primarily as a fiduciary duty to preserve the future agent's capacity for agency. Ordinary agents—legislators, individuals, patients—hold power as trustees of their future selves; they may impose procedural hurdles to safeguard future decision-making quality but cannot substantively alienate future decision-making power. However, a secondary principle applies to constitutive acts: when agents act in a constituent capacity (founding a polity), they hold power as owners of the framework itself, allowing them to substantively entrench norms that define the lower-order agency.

  Under this theory, Item 2 (legislative non-entrenchment) is strictly entailed: a trustee legislature cannot alienate the sovereign power of its successor trustee. Item 4 (medical directives) is strictly entailed: authority derives from the later self's capacity deficit, so regained capacity restores authority. Item 5 (escalation asymmetry) is strictly entailed: procedural hurdles protect capacity, while substantive locks alienate it. Item 3 (private law) is accommodated: it treats property as owned (allowing wills) but personal autonomy as held in trust (forbidding slavery contracts). Item 1 (constitutional entrenchment) is accommodated as the hierarchical exception: the constituent power owns the framework and may bind the constituted power.

  Placing the items on your axes reveals the structural cleavage. Item 1 is **Continuity-triggered** and **Owner**-status: the People bind the People based on identity, exercising ownership of the constitutional framework. Items 2, 3 (autonomy limits), and 4 are **Capacity-triggered** and **Trustee**-status: authority arises from the later self's potential deficit, and power is held in trust for that future self. Item 3 (wills/trusts) is mixed: **Continuity-triggered** (death is not incapacity) but **Owner**-status regarding property, yet **Trustee**-status regarding market autonomy (rules against perpetuities). Item 5 is the boundary rule distinguishing the two modes.

  Your suspicion is correct: the practice relies on two independent principles. The primary principle is **Agency Preservation** (Capacity/Trustee), governing ordinary time. The secondary principle is **Sovereign Ownership** (Continuity/Owner), governing constitutive time. They are in genuine tension because they presuppose different metaphysics of the agent: the first views the agent as a sequence of selves requiring protection from one another; the second views the agent as a singular sovereign capable of self-binding across time. The practice resolves this tension not by reconciliation but by hierarchy: Sovereign Ownership trumps Agency Preservation only at the founding moment. Once the framework is set, Agency Preservation resumes control.

  Several items are philosophically underdetermined. Item 3 is the most contested ground between **Libertarian Ownership** (I own myself and may sell my future autonomy) and **Paternalist Trusteeship** (I hold my autonomy in trust for my future self). The current practice splits the difference, allowing property trusts but banning autonomy trusts, which rival theories would resolve differently. Item 1 (unamendable cores) is underdetermined between **Dead Hand Sovereignty** (the founders own the future) and **Democratic Iteration** (no generation owns the future). The practice adopts the former but limits it to a small core, leaving the boundary arbitrary. Item 2 might be historical accident rather than theory; some systems allow legislative entrenchment without collapse, suggesting the non-entrenchment rule is a contingent choice to preserve legislative supremacy rather than a logical necessity of agency.

  Regarding the hypothetical cases: First, the **Phantom Veto-holder**. If the second chamber is abolished and merged, the clause lapses. Under the Fiduciary-Hierarchical theory, a trustee cannot bind itself via a non-existent entity; the procedural safeguard must be functionally possible. If the required consent were a state legislature and the state dissolved, the constraint lapses unless a successor sovereign explicitly assumes the constituent role. Rival theories based on strict Continuity might argue the obligation survives metaphysically, but the Fiduciary view prioritizes functional agency.

  Second, the **Delayed Double-Key clause**. The constraint holds. The enactment threshold (eighty percent) exceeds the repeal attempt (seventy-four percent), satisfying the Owner-status requirement for constitutional change. The procedural hurdles (elections, assembly) satisfy the Agency Preservation requirement for ordinary legislation. Even though the shock was foreseen, the theory prioritizes the structural threshold over the specific motivation, treating the supermajority as a definition of the sovereign will rather than a Ulysses contract against temptation.

  Third, the **Competent-but-tempted majority**. This confirms that constitutional precommitment is not a Ulysses contract but **Structural Sovereignty**. On a Capacity-triggered account, this precommitment should fail because the later voters are competent. The fact that it holds shows constitutional entrenchment operates on the Continuity/Owner axis, not the Capacity/Trustee axis. It binds the competent self not because the self is impaired, but because the self is operating within a framework it does not own. It is a "Wall" defining the playground, not a "Shield" protecting the player.

  Finally, adopting pure views would dismantle the current architecture. If **no generation may bind another beyond a fixed term**, Item 1 must go: constitutions become ordinary statutes, amendable by simple majority. Item 3 loses trusts and wills beyond the fixed term; Item 4 loses advance directives lasting beyond incapacity recovery. The legal order becomes radically presentist. Conversely, if **any supermajority may entrench whatever it likes, forever**, Item 2 must go: ordinary legislatures could freeze policy permanently. Item 3 loses limits on perpetuities and autonomy contracts (slavery clauses become enforceable); Item 4 loses revocability rights. The legal order becomes radically hierarchical, allowing past supermajorities to rule the living. The current practice navigates between these extremes by restricting permanent ownership to the constituent moment while maintaining fiduciary trusteeship for ordinary governance. This hybrid allows stability without stagnation, though it leaves the boundary between constituent and ordinary power perpetually contestable.
