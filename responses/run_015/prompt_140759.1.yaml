answer: |-
  The rain against the window of the graduate lounge sounded like static, a white noise filling the silence between Elias and the object on the table. It wasn't gold. It was a dull, matte band of something that looked like oxidized silver, found in a box of estate junk he'd bought at an auction. But he knew what it was. Or rather, he knew what it *did*.

  He'd read *Republic* Book II so many times he could recite the pagination. Glaucon's challenge was the only thing that mattered in ethics. Everything else was commentary. Glaucon argued that justice is a compromise: we practice it not because it is good, but because we are too weak to commit injustice without suffering for it. The proof? The Ring of Gyges. Make a man invisible, let him act with impunity, and he will act like a god among men. He will steal, seduce, and kill.

  But Elias had always thought Glaucon missed a variable. Invisibility protects you from punishment, but it doesn't secure the payoff. The perfectly unjust man, Glaucon says, is the one who *appears* just. He gets the reputation, the political offices, the marriages into good families. The reward isn't just the stolen gold; it's the handshake, the trust, the honor.

  Elias picked up the ring. This version didn't make you invisible. It made you unremembered.

  "Pure upgrade," Elias whispered.

  He slipped it onto his index finger. It felt cold, heavier than it looked. He stood up, walked to the door, and stepped into the hallway. He waited ten seconds, then walked back in.

  Sarah, the department administrator who was usually finishing up at this hour, was typing at her desk. She looked up as he entered. Her eyes slid over him, polite but blank.

  "Can I help you?" she asked.

  "It's me, Sarah. Elias."

  She frowned, a slight crease between her brows. "I'm sorry, do I know you? You can't be back here after hours without a keycard."

  Elias smiled. It worked. He walked out again. In his pocket, his phone buzzed. A text from Sarah: *Who was just in here?* He looked at the screen. The text bubble was there, but the words were smudged, like ink running in rain. *Who was... in... here?*

  He went home. He packed a bag. He didn't need a lease; if the landlord couldn't remember him, he couldn't evict him. He could walk into any building, take what he needed, and leave. The security cameras would record a figure, but the footage would degrade into gray static within the hour. The digital records of his existence were dissolving.

  For the first week, it was intoxicating. He walked into a high-end electronics store and took a laptop. The alarm didn't sound; the sensors didn't register him. He walked out. The manager saw him leave, but by the time he reached the sidewalk, the manager was looking at the shelf, wondering why the inventory count was off, unable to recall a face.

  Elias sat in a park, using the stolen laptop. He felt like Gyges reborn. He was testing the hypothesis. If justice is only practiced under compulsion, then absolute freedom should yield absolute self-interest. He was living the life of the perfectly unjust man. He had the goods. He had the freedom.

  But then came the second month.

  He tried to cash out. He walked into a bank to open an account for the money he'd accumulated from petty thefts and untraceable consulting work. The teller smiled, took his ID, and processed the request. But when he returned the next day, the teller didn't know him. The account existed—the money was real—but the signature on the card was a blur. He couldn't prove he was the owner. The system recognized the data, but the human interface required trust, and trust requires memory.

  He tried to meet a woman he'd liked before putting the ring on. He waited outside her apartment. When she came out, he stepped forward. "Elias," he said. "We had coffee."

  She looked at him with the polite terror one reserves for the unhoused or the unstable. "I think you have the wrong person."

  He saw it in her eyes. It wasn't just that she forgot him; it was that the shared past was gone. The coffee shop receipt in his wallet was blank. The photo on his phone of them together was a smear of colors. Because she forgot him, the reality of *them* was unmoored. Glaucon had said the unjust man needs the reputation of justice to reap the rewards. Elias realized too late that the ring stripped him of the capacity for reputation entirely. He couldn't be praised. He couldn't be honored. He couldn't be loved.

  He was not the perfectly unjust man Glaucon described. That man sits at the head of the table, toasted by friends. Elias was a ghost haunting his own life.

  He tried to do something good, just to see if it felt different. He saw a child wander toward a busy intersection. He grabbed the child's arm and pulled her back. The mother screamed, grabbing the child, shoving Elias away.

  "Stay away from her!"

  Elias stepped back. "I saved her."

  The mother looked at him, breathing hard. She looked at the street, then back at him. The causal link was broken. She didn't remember him lunging. She only remembered a stranger touching her daughter. He was no savior; he was a threat. There was no wage for justice, either. No inner glow, no social credit. Just the adrenaline and the shove.

  The isolation began to eat at the edges of his own mind. If identity is relational, constructed by the reflections in others' eyes, what happens when the mirrors go dark? He started forgetting things. Not just facts, but textures. The taste of the wine he drank before the ring. The sound of his mother's voice. If no one else remembered them, did they happen? The ring's magic was recursive. It didn't just erase him from them; it erased the *them* from him.

  He sat in the graduate lounge again, months later. The rain was the same. The ring was still on his finger. He had tried to take it off, but it wouldn't slide. Or maybe he just couldn't remember how he'd put it on, and the motion felt foreign.

  He had proven Glaucon right, in a way. No one is just willingly. When the social contract was dissolved, he hadn't become a moral agent; he'd become a consumer of moments. But he hadn't become happy. Glaucon said the unjust man with a good reputation is happier than the just man with a bad one. But what is the man with *no* reputation?

  He opened his laptop. He typed a document, outlining everything. The theory, the experiment, the result. He wanted to leave a record. He hit save. He looked at the file name. It was blank. The text on the screen began to smudge before his eyes, the letters running together like wet charcoal.

  Elias closed the laptop. He looked at his hands. They looked like his hands, but he couldn't recall ever using them to type. He looked at the door. Sarah was gone. The building was empty. He could walk out, take a car, go anywhere. No one would stop him. No one would miss him. No one would know he was gone.

  He sat there, listening to the rain, wondering if the silence in his head was the peace of a god who needs no one, or the hollow echo of a man who no longer exists.
