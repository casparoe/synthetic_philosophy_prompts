answer: |-
  ### Exam Question

  **Course:** PHIL 450: Advanced Moral Philosophy
  **Assessment:** Take-Home Final
  **Time Limit:** 90 Minutes
  **Word Limit:** 800 words maximum

  **Question:**

  Consider the following triage scenario: A medical emergency requires a resource to save five patients who will otherwise die with certainty. The only way to deliver this resource is to run a transport vehicle through a crowd of one hundred bystanders. This imposes a 1% risk of serious injury on each bystander. Alternatively, you can spare the bystanders entirely, but the five patients will die.

  T.M. Scanlon's contractualism posits that an act is wrong if it violates principles that no one could reasonably reject. In standard "one vs. five" death cases, Scanlon blocks aggregation: the single individual's complaint against death outweighs any *individual* survivor's complaint, preventing the sacrifice of the one. However, in cases involving distributed probabilistic risks (like the crowd scenario above), Scanlon suggests aggregation may be permissible because the individual burden is sufficiently small.

  Write an essay addressing the following:
  1.  Explain how a contractualist justifies treating the "one vs. five deaths" case differently from the "five saved vs. distributed risk" case without simply counting heads.
  2.  Critically evaluate whether this distinction is stable. Does allowing the summation of small risks to outweigh a large certain burden secretly rely on a utilitarian weighing of total harm?
  3.  Conclude whether this move collapses contractualism into a form of weighted rule-utilitarianism or if it preserves the individualist restriction central to Scanlon's project.

  ***

  ### Model Answer

  Scanlon's contractualism is defined by the "individualist restriction": principles are justified only if they cannot be reasonably rejected by any single individual appealing to generic reasons. In the standard "one vs. five" death case, aggregation is blocked because the unit of moral comparison is the individual complaint. The single victim has a complaint against being killed that is stronger than the complaint of any *individual* survivor against not being saved. Since no individual survivor can claim a burden greater than the victim's death, the victim can reasonably reject a principle permitting their sacrifice. The numbers do not count; only the relative strength of individual grievances matters.

  The triage scenario involving probabilistic risks complicates this framework. Here, the five patients face certain death, while the one hundred bystanders face only a small risk (1%) of serious injury. A contractualist justification for saving the five relies on comparing the strength of the *strongest individual complaint* on either side. Any given bystander faces only a small probability of harm. Scanlon argues that a complaint based on a small risk is significantly weaker than a complaint based on certain death. Therefore, the individual complaint of any single bystander is weaker than the individual complaint of any single patient. Because no individual bystander has a complaint strong enough to override the patients' complaints, a principle permitting the risk-imposition cannot be reasonably rejected.

  This distinction appears to solve the aggregation problem without abandoning individualism. However, its stability is questionable. The worry is that by permitting the risk distribution, Scanlon is effectively allowing the *sum* of the small risks to outweigh the certain death. If the 1% risks were aggregated, the expected harm to the crowd (one expected serious injury) might still be less than five deaths, but the logic relies on the total burden becoming morally relevant. If the number of bystanders increased to one million, the aggregate risk might guarantee several injuries. If Scanlon still permits saving the five, he seems to be weighing the total expected harm against the five deaths, which looks suspiciously like utilitarianism.

  To avoid collapsing into weighted rule-utilitarianism, Scanlon must insist that the justification remains anchored in the *ex ante* perspective of the individual. The bystander does not reject the principle because "the group suffers too much," but because "my risk is too high." If the risk remains below a threshold of reasonable rejection for any single agent, the principle holds. The aggregation is merely a byproduct of many individuals failing to have a veto, not a moral summation of harm.

  However, this defense is fragile. If the threshold for reasonable rejection is determined by comparing the individual risk against the individual benefit (saving a life), the calculus begins to mirror a utility function where probabilities are weighted against outcomes. If Scanlon allows the "generic reason" to accept risk to be shaped by the total good produced (saving five lives), then impersonal reasons have entered the foundation. This threatens the core contractualist claim that we owe justification to each person individually, not to the collective good.

  Ultimately, while Scanlon avoids explicit head-counting, the risk case suggests a pragmatic concession. It preserves the *structure* of individual veto power but adjusts the *weight* of complaints based on probability. This does not fully collapse contractualism into utilitarianism, as the unit of analysis remains the individual complaint rather than total welfare. However, it does blur the line, suggesting that contractualism can only handle real-world complexity by incorporating expected-value calculations that mimic the utilitarian outcomes it seeks to reject in certainty cases. The distinction is stable only if one strictly maintains that the veto is defeated by the weakness of the individual risk, not by the strength of the aggregate benefit.

  ***

  ### Marking Scheme

  **Grade Boundaries:**
  *   **A (80-100%):** Demonstrates sophisticated grasp of the tension between individualism and aggregation. Critically engages with the "collapse" objection rather than just describing it.
  *   **B (60-79%):** Correctly explains Scanlon's view and the scenario but offers a superficial or incomplete analysis of the stability/collapse objection.

  **Five Specific Moves Required for an 'A' Answer:**

  1.  **Identify the Unit of Comparison (Individual vs. Aggregate):**
      *   *Required:* Must explicitly state that Scanlon compares the strongest individual complaint on one side against the strongest individual complaint on the other, not group totals.
      *   *Typical B Mistake:* Suggesting Scanlon compares the one death against the five deaths directly, or claiming Scanlon simply ignores the five.

  2.  **Distinguish Certainty from Probability (The Risk Mechanism):**
      *   *Required:* Must explain that the bystander's complaint is weakened by the low probability of harm, whereas the patients' complaint is based on certainty.
      *   *Typical B Mistake:* Treating the risk case exactly like the death case, or failing to explain *why* the risk makes the complaint weaker (just asserting it is).

  3.  **Articulate the "Collapse" Objection:**
      *   *Required:* Must explain *why* this looks like utilitarianism (i.e., that summing small risks effectively weighs total expected harm against total lives saved).
      *   *Typical B Mistake:* Stating "it becomes utilitarian" without explaining the mechanism (summing expected utility vs. individual veto).

  4.  **Evaluate the Role of Impersonal/Generic Reasons:**
      *   *Required:* Must discuss whether allowing the benefit to the five to outweigh the risk to the one introduces impersonal value (the "greater good") into the justification.
      *   *Typical B Mistake:* Ignoring the role of generic reasons or claiming Scanlon never allows appeal to consequences.

  5.  **Reach a Nuanced Verdict on Stability:**
      *   *Required:* Must offer a conclusion on whether the distinction holds. An 'A' answer acknowledges the tension (e.g., "structurally individualist but consequentially aggregative") rather than a binary "yes it works" or "no it fails."
      *   *Typical B Mistake:* A dogmatic conclusion that doesn't acknowledge the fragility of the risk/certainty distinction (e.g., "Scanlon solves it perfectly").

  **General Criteria:**
  *   **A Answer:** Fluid integration of textual concepts (reasonable rejection, generic reasons) with the specific logic of the prompt's scenario. The argument flows logically from explanation to critique.
  *   **B Answer:** Segmented structure (e.g., "First I will explain Scanlon, then I will critique"). Accurate summary but lacks critical bite on the "collapse" issue. May exceed word count with summary rather than analysis.
