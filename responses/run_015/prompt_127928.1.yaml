prompt: |-
  I'm putting together the take-home final for my upper-level moral philosophy seminer, and I need an essay question on Scanlon's contractualism that students cant answer by just summarizing his main book. I want them to wrestle with the aggregation problem in a case I've cookd up: imagine a triage situation where saving five people requires distributing a very small risk of serious injury across one hundred bystanders, versus saving that one bystander requires letting the five die with certainty. The twist is that Scanlon allows the strength of a complaint to matter, so students have to figure out whether contractualism can consistently block aggregation when the burdens are identical and large (one vs five deaths) but allow it when the burdens are tiny and distributed (tiny risks summed). They should explain whether this distinction is stable or whether it secretly relies on a utilitarian weighing of total harm, and if so, whether that collapses contractualism into a kind of weighted rule-utilitarianism.

  Please write the exam question itself, then a model answer of about 700 words, and a marking scheme that separates an A answer from a B. The scheme should name at least five specific moves the best answers must make—like identifying where the veto power is exercised, explaining why homogeneous small burdens dont generate the same reasonable rejection as a single large burden, and saying whether Scanlons appeal to impersonal reasons saves him—and it should note the typical mistake for each (for instance, thinking that Scanlon just counts heads). The question should be answerable in about 90 minutes and should force them to do more than label the problem.
