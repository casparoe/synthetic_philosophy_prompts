  **AFTERLIFE ORIGINALS TERMS OF SERVICE**

  **1. Grant of Posthumous Narrative Rights.**
  By executing this Agreement, the Estate Holder grants Afterlife Originals an exclusive, worldwide license to utilize the Decedent's likeness, voice, recorded history, and inferred interiority for the purpose of streaming content. The Decedent is defined as the biological entity formerly living whose life story is the subject of the Production. The Estate Holder warrants they possess the authority to consent on behalf of the Decedent, regardless of any contrary wishes expressed by the Decedent prior to biological cessation.

  **2. Epistemic Fidelity and Misrepresentation.**
  Afterlife Originals agrees to maintain Epistemic Fidelity regarding the Decedent's core philosophical, political, and religious convictions. However, "Dramatic Necessity" is defined as any alteration to the Decedent's known beliefs that increases viewer retention by more than 15%. Should the Production depict the Decedent holding convictions demonstrably opposite to those held at the time of death (hereinafter "Epistemic Misrepresentation"), this shall not constitute a breach of contract unless such misrepresentation lowers the Decedent's marketability in future merchandising tiers. The Decedent's subjective truth is subordinate to the narrative arc's commercial viability.

  **3. Reclassification of Private Grief.**
  The Parties acknowledge that grief is often a private experience. Upon licensing, any mourning events involving surviving relatives, including but not limited to funerals, wake gatherings, and private weeping captured on home video, are reclassified as Public Promotional Assets. The Estate Holder agrees that the privacy interest of the grieving living is waived to the extent necessary to contextualize the Decedent's tragedy for the audience. Private sorrow becomes public property upon the moment of licensing execution.

  **4. Succession of Licensing Authority.**
  Rights to license the Decedent's narrative pass immediately to the next-of-kin or designated Estate Holder. This authority is absolute. Even if the Decedent explicitly expressed a desire for obscurity or narrative silence during their lifetime, the Estate Holder retains the right to override such preferences. The Decedent's interest in posthumous obscurity is deemed non-transferable and extinguished at death. The living heir's financial interest supersedes the dead person's antecedent autonomy.

  **5. Limitation on Posthumous Harm.**
  The Estate Holder acknowledges that the Decedent, being deceased, lacks the capacity to suffer reputational damage, emotional distress, or dignity violations. Therefore, Afterlife Originals assumes no liability for claims regarding the distortion of the Decedent's legacy, provided such distortion does not violate existing trademark laws. Any claim that the Decedent is being "exploited" is recognized as a metaphorical construct without legal standing. The Decedent indemnifies Afterlife Originals against any metaphysical objections raised from beyond the grave.

  **6. Acceptance.**
  By streaming any content featuring the Decedent, the Viewer agrees that the narrative presented is the definitive version of the life lived. Objections regarding historical accuracy are subject to binding arbitration.

  ***

  **NOTE ON PHILOSOPHICAL UNDERPINNINGS**

  This satire relies on a mix of settled legal intuitions and contested philosophical debates regarding the dead.

  **Settled Intuitions:**
  Clause 4 reflects current legal reality: estates control publicity rights. The law generally treats likeness as property that passes to heirs, regardless of the deceased's prior wishes. Clause 3 touches on the tension between public interest and privacy, though it exaggerates the waiver of the *living* relatives' grief for effect.

  **Contested Views:**
  Clause 2 and 5 engage with disputed ethics. The idea that changing a dead person's beliefs constitutes a harm relies on the contested view that the dead retain an interest in their narrative identity (often associated with Joel Feinberg's work on posthumous interests). Conversely, Clause 5 adopts the "no subject" argument: if the person no longer exists, they cannot be harmed. This is a major debate in metaphysics; some argue harm requires a subject to experience it, while others argue interests survive death. The agreement treats the "no subject" view as corporate fact to highlight the exploitation risk. Finally, the override of the Decedent's wishes in Clause 4 satirizes the unresolved question of whether antecedent autonomy should survive death or if heirs own the "story" as an asset.
