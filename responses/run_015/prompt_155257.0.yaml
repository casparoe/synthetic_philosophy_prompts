prompt: |-
  Hey — I'm a science-and-ideas journalist working on a piece about how often the doing-vs-allowing distinction is quietly doing all the load-bearing work in policy arguments, and I keep tying myself in knots trying to explain to my editor why anyone finds it slippery. The surface version is easy enough: unplugging someone's ventilator gets filed under letting die, injecting them gets filed under killing, and everyone from hospital ethics committees to people arguing about whether releasing an unrestrained AI system counts as causing harm or merely failing to help leans on that contrast. What I need from you is the deeper story about why it's so hard to say what the distinction even consists in. Every cash-out I try seems to break: it can't just be movement vs. stillness, since unplugging is a movement; it can't just be counterfactual dependence, since in both cases the person dies when they do because of what I chose; and the popular move of asking whether I made them worse off than they would otherwise have been gives verdicts that flip depending on who else happens to be in the room.

  Two specific things I keep getting stuck on, and I'd like you to walk me through them. First, that third-party sensitivity: it looks like whether my inaction counts as letting die or as something more like killing depends on whether some other agent was poised to step in and didn't, which is a fact about them and not about me. So what is the distinction actually tracking if the baseline shifts like that — is there a version of it that survives once you let the background vary, or does it only look robust because we implicitly hold the surroundings fixed? Second, a friend of mine who works adjacent to moral psychology has a pet theory I want stress-tested: she says the distinction is really an evidential and coordination device rather than a moral one. Actions are public, datable, easy to attribute to an agent; omissions are murky, and there is an infinite number of things nobody did, so we need a bright line to decide whose behaviour to monitor, sanction, and plan around. On her view the intuition that killing is worse than letting die is just this bookkeeping convenience leaking into moral judgement, and there's nothing left over once you see that. It feels too quick to me, but I can't put my finger on where it goes wrong.

  Can you explain the shape of this problem in a way I could paraphrase for a smart general reader — the failure of the causal and baseline accounts, what a non-causal account would have to look like, and a verdict on my friend's debunking story? Please use one concrete worked example you build yourself rather than the famous ones everybody recycles, and skip citations and reading lists entirely; I want the machinery, not the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Science-and-ideas journalist.
      *   **Topic:** The doing-vs-allowing distinction (acts vs. omissions) in policy/ethics.
      *   **Problem:** The distinction is load-bearing but philosophically slippery. Standard explanations (movement, counterfactuals, baseline welfare) fail.
      *   **Specific Questions:**
          1.  Third-party sensitivity (why does the status of *my* action depend on *others'* potential actions?).
          2.  Friend's theory (is it just an evidential/coordination device, not a moral truth?).
      *   **Constraints:**
          *   Explain for a smart general reader (paraphrasable).
          *   Cover failure of causal/baseline accounts.
          *   Explain what a non-causal account would look like.
          *   Verdict on the friend's debunking story.
          *   **Crucial:** Use *one concrete worked example* built from scratch (no trolley problems, no ventilators).
          *   **Crucial:** No citations or reading lists.

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Core Tension:* We feel killing is worse than letting die. But physically/causally, the outcome is often identical.
      *   *Causal Account:* "I moved" vs. "I didn't." Fails because unplugging is a movement.
      *   *Counterfactual Account:* "If I hadn't acted, they'd live" vs. "If I hadn't acted, they'd die anyway." Fails because in both cases, my choice determines the outcome.
      *   *Baseline Account:* "Worse off than normal" vs. "Not better off than normal." Fails because "normal" depends on expectations and other agents (the third-party problem).
      *   *Third-Party Sensitivity:* If a lifeguard is on duty, my not jumping in is "letting die." If no lifeguard is on duty, is it still just "letting die"? Or does the duty shift? Actually, the prompt asks about a specific nuance: whether *my* inaction counts as killing/allowing based on whether *someone else* was poised to act.
      *   *Friend's Theory:* It's epistemic/administrative, not ontological/moral. We mark acts because they are trackable.
      *   *Verdict:* It's partially true (we need coordination), but it misses the normative force of *agency* and *commitment*.

  3.  **Develop a Concrete Worked Example:**
      *   *Requirement:* Needs to be fresh. No ventilators, no trolleys.
      *   *Idea:* Something involving a system or a barrier. A dam? A firewall? A chemical valve?
      *   *Selection:* **The Automated Irrigation System.**
      *   *Scenario:* A farmer (Agent A) controls a water valve for a downstream village's crops.
      *   *Variation 1 (Doing):* Agent A actively diverts water away.
      *   *Variation 2 (Allowing):* Agent A fails to repair a leak that diverts water away.
      *   *Third-Party Twist:* Introduce Agent B (a backup maintainer).
      *   *Why this works:* It involves maintenance (omission) vs. diversion (action). It allows for baseline manipulation (what is the "expected" water flow?). It allows for third-party intervention (was B supposed to fix the leak?).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the journalist's frustration. Validate that the distinction is indeed philosophically fragile but practically robust. Introduce the "Irrigation System" example immediately.

      *   **The Example Setup:**
          *   Agent: Alex, manager of the High-Valve.
          *   Beneficiaries: Downstream farmers.
          *   State: Crops need water.
          *   Outcome: Crops die.
          *   Case 1 (Act): Alex turns the handle to "Off."
          *   Case 2 (Omission): Alex sees the handle is stuck/broken and doesn't fix it.
          *   Result: Crops die in both.

      *   **Part 1: Why the Standard Cash-Outs Fail (The Machinery):**
          *   *Movement:* Turning the handle is movement. Not fixing is stillness. But wait, *not fixing* involves going to work, drinking coffee, ignoring the gauge. It's physically active too. So "motion" isn't the line.
          *   *Counterfactuals:* In both cases, if Alex did the other thing, crops live. So causal dependence is identical.
          *   *The Baseline Problem (Third-Party Sensitivity):* This is the crux.
              *   Scenario A: Alex is the *only* manager. Baseline = "Alex maintains flow." Failure = Omission.
              *   Scenario B: There is a backup, Blake. Blake is supposed to fix leaks. Alex knows this. Alex doesn't fix it. Is Alex *allowing* death (because Blake should do it) or *killing* (because Alex knows Blake won't)?
              *   *The Shift:* If Blake exists, Alex's inaction feels less like a cause. If Blake doesn't exist, Alex's inaction feels like the cause. But Alex's physical behavior is identical. The moral status of *Alex's* choice depends on *Blake's* job description. This shows the distinction isn't in the physics; it's in the *normative expectations*.

      *   **Part 2: What a Non-Causal Account Looks Like:**
          *   If it's not physics, what is it? It's about **Intervention on a Course.**
          *   Doing: Inserting a new force into the system.
          *   Allowing: Withholding a force that was expected.
          *   The "Non-Causal" reality: It's about *ownership of the process*. When you act, you claim authorship of the new chain. When you omit, you disclaim authorship of the existing chain.
          *   Why it matters: Authorship carries liability.

      *   **Part 3: Stress-Testing the Friend's Theory (The Debunking):**
          *   *The Theory:* It's just bookkeeping. Acts are visible; omissions are infinite. We punish acts because we can track them.
          *   *Where it's right:* Epistemic asymmetry. It is harder to prove "you could have saved them" than "you pushed them." Coordination requires clear lines.
          *   *Where it fails:* It doesn't explain the *intensity* of the blame. We don't just track acts for convenience; we feel a qualitative difference in *violation*.
          *   *The Counter:* If it were just bookkeeping, we should be willing to swap the rules if the bookkeeping got easier. But we aren't. We feel killing violates the victim's *right to non-interference*, whereas letting die violates a *duty of rescue*. These are different moral shapes, not just administrative tags.
          *   *Verdict:* The friend identifies the *origin* of the heuristic (cognitive ease), but misses the *function* (protecting agency).

      *   **Conclusion:** Summarize for the article. The distinction isn't a fact about the world (physics); it's a fact about our social contract (expectations). It's slippery because expectations shift, but it's load-bearing because without it, we are all responsible for everything.

  5.  **Review and Refine:**
      *   *Tone Check:* Is it journalistic but deep? Yes.
      *   *Example Check:* Is the irrigation system clear? I need to make sure the "Third-Party" twist is sharp.
      *   *Refining the Third-Party point:* Make sure to highlight that the *physical reality* of Alex doesn't change, only the *moral classification* changes based on Blake. This proves the distinction is relational, not intrinsic.
      *   *Refining the Friend's point:* Ensure I don't dismiss it entirely. It's a "partial debunking." It explains the *boundary*, not the *content*.

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* I initially thought about using a dam. But a valve is simpler. Let's stick with the "High-Valve."
      *   *Correction:* Make sure I explicitly answer the "what would a non-causal account look like" prompt. I need to define it as "Normative Expectation" rather than "Physical Force."
      *   *Correction:* Ensure I don't use jargon like "counterfactual dependence" without explaining it simply. (The prompt uses it, so I can use it, but keep it accessible).

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the machinery of the problem, built around a single concrete scenario, stripped of the usual philosophical baggage.

  ### The Worked Example: The High-Valve

  Imagine a semi-arid region where a single pipeline feeds water to a valley of small farmers. At the top of the ridge sits the "High-Valve," a manual control wheel that regulates flow.

  **The Agent:** Alex is the appointed manager of the High-Valve.
  **The Outcome:** The valve is closed. The valley crops die of drought.
  **The Question:** Did Alex *kill* the crops (doing harm) or *let* the crops die (allowing harm)?

  We can construct two versions of the story that lead to the exact same physical state: a closed valve and dead crops.

  *   **Case 1 (The Turn):** The water is flowing. Alex walks up to the High-Valve, grips the wheel, and rotates it ninety degrees to the "Closed" position. Alex walks away.
  *   **Case 2 (The Leak):** The water is flowing. A corrosion leak develops in the pressure seal, causing the valve to slowly drift shut. Alex notices the gauge dropping. Alex could tighten the seal with a wrench in thirty seconds. Alex puts the wrench back in the box and walks away. The valve drifts fully shut.

  In both cases, Alex's choice is the difference between life and death for the crops. In both cases, Alex physically moves (walking to the valve, handling the wrench). In both cases, the crops die because of Alex's decision. Yet, almost everyone intuitively feels Case 1 is morally heavier than Case 2. Why?

  ### 1. Why the Standard Accounts Break

  When you try to pin down *why* Case 1 is worse, the usual definitions snap under pressure.

  **The Movement Test:** You might say Case 1 is "doing" because Alex moved the wheel, while Case 2 is "allowing" because Alex didn't move the wrench. This fails because "not moving the wrench" is not a state of physical stillness. Alex had to walk to the site, assess the gauge, and decide not to act. That is a sequence of muscular contractions and neural firings just as complex as turning the wheel. If "doing" means "expending energy," Alex did plenty of energy in Case 2.

  **The Counterfactual Test:** You might say Case 1 is worse because if Alex hadn't acted, the crops would live. But in Case 2, if Alex hadn't acted (by omitting the repair), the crops also die. In both scenarios, the crops' survival is *counterfactually dependent* on Alex's choice. The causal chain is identical: Alex's decision is the pivot point. If you trace the physics, Alex is the cause of the drought in both stories.

  **The Baseline Test:** This is the most popular fix. It says: "Doing" means making someone worse off than they were before; "Allowing" means failing to make them better off (or failing to keep them at baseline).
  *   In Case 1, Alex takes flowing water and stops it. The crops are worse off than baseline. (Killing).
  *   In Case 2, the crops were going to die due to corrosion. Alex failed to save them. They are not worse off than the "corrosion baseline." (Letting die).

  This works until you introduce **Third-Party Sensitivity**, which is where your first specific sticking point lies.

  ### 2. The Third-Party Sensitivity Problem

  Let's modify Case 2 (The Leak). Suppose there is a second agent, Blake. Blake is the maintenance engineer whose specific job description is to fix corrosion leaks. Alex is only the flow manager.

  *   **Scenario A:** Blake is on vacation. Alex is the only person on the ridge. Alex sees the leak and doesn't fix it.
  *   **Scenario B:** Blake is standing right next to Alex. Blake is holding the wrench. Alex sees the leak, looks at Blake, and says nothing. Blake also says nothing. The valve drifts shut.

  In Scenario A, Alex's inaction feels like "letting die." In Scenario B, Alex's inaction might feel like "killing" (via conspiracy) or it might feel like "letting die" because it was Blake's job.

  Here is the knot: **Alex's physical behavior is identical in both scenarios.** Alex stands still and watches the gauge drop. But the moral classification of Alex's behavior shifts depending on *Blake's* job description.

  If the distinction between doing and allowing were a fact about the physical world (like mass or velocity), it shouldn't change based on what a second person is supposed to be doing. The fact that it *does* change proves the distinction isn't in the physics. It is in the **normative expectations.**

  The distinction tracks whether you have violated a *negative duty* (do not interfere) or a *positive duty* (provide aid).
  *   In Case 1 (The Turn), Alex interfered with a process that was working. This violates the negative duty.
  *   In Case 2 (The Leak), Alex failed to assist a process that was failing. This invokes the positive duty.

  The "baseline" isn't a physical state of water flow; it's a social state of *expectations*. When Blake is present, the expectation of who fixes the leak shifts. If the expectation shifts, the classification of Alex's silence shifts from "negligent omission" to "complicit allowance" or vice versa.

  **What a Non-Causal Account Looks Like:**
  To save the distinction, you have to admit it isn't causal. It is **authorship-based.**
  *   **Doing:** You insert a new force into the system. You become the *author* of the new causal chain. You own the outcome.
  *   **Allowing:** You refrain from interrupting an existing causal chain (even if that chain is "corrosion closes valve"). You disclaim authorship.

  The moral weight comes from *claiming ownership*. When you act, you assert control over the world. When you omit, you accept the world's control. Policy leans on this because we want to punish those who assert control maliciously more severely than those who fail to assert control benevolently. The distinction survives only if we define it as "Who owns the causal chain?" rather than "What happened physically?"

  ### 3. Stress-Testing Your Friend's Theory

  Your friend argues the distinction is merely an **evidential and coordination device.**
  *   *The Argument:* There are infinite omissions (I didn't fly to Africa to save a starving child; I didn't mail money to the valley). We can't police all omissions. Acts are discrete, datable, and attributable. We mark "killing" as worse because it's a bright line for legal enforcement, not because it's metaphysically deeper. The moral intuition is just a halo effect from this administrative convenience.

  **Where Your Friend is Right:**
  She is correct about the *boundary problem*. If we treated all omissions as morally equivalent to acts, every human would be guilty of mass murder every day for every preventable death they didn't stop. Society would collapse under the weight of liability. We *need* a filter to decide which causal contributions count. "Action" is a high-fidelity signal; "Omission" is noisy data. The distinction is definitely a heuristic for managing cognitive and legal load.

  **Where Your Friend is Wrong:**
  She claims there is "nothing left over" once you see the bookkeeping trick. This fails to explain the **asymmetry of rights.**

  If the distinction were just bookkeeping, we should be willing to swap the rules if the bookkeeping got easier. But we aren't.
  Imagine a society where we install cameras everywhere. Now, omissions are just as trackable, datable, and attributable as acts. We can see exactly when Alex ignored the leak. The "evidential" problem is solved.
  Does the intuition vanish? Do we now say Alex turning the valve (Case 1) is morally identical to Alex ignoring the leak (Case 2)?

  Most people still say Case 1 is worse. Why? Because it's not just about *tracking* the agent; it's about the **victim's claim on the agent.**
  *   In Case 1, the crops (or the farmers) had a right that Alex *not touch* the valve. Alex violated a boundary.
  *   In Case 2, the crops had a hope that Alex *would help*, but not a right to command Alex's labor.

  Your friend's theory explains why we draw the line *where* we do (at the point of action), but it doesn't explain why the line feels *moral* rather than just legal. The "leak" of bookkeeping into morality isn't an accident; it's because the bookkeeping protects a specific view of human agency: that we are sovereign over our own bodies and labor (omissions) but accountable for our intrusions on others (acts).

  ### The Verdict for Your Piece

  The doing-vs-allowing distinction is slippery because journalists and policymakers try to treat it as a **physical fact** (did the hand move?) when it is actually a **social contract** (who owned the risk?).

  *   **The Failure:** It breaks when you look at physics because the physics is identical.
  *   **The Third-Party Shift:** It changes based on background expectations because it tracks *duties*, not *forces*.
  *   **The Friend's Debunking:** It is partially true that the distinction is a coordination tool, but false that it is *only* that. It encodes a fundamental liberty: the right to not be used as a resource by others, even for good ends.

  When you write about AI or healthcare, the knot you are tying yourself in is the attempt to map this social contract onto systems that don't understand contracts. An AI "unplugging" a patient isn't a movement; it's an optimization function. But if we treat the AI as an agent, we are forced to ask: Did it *intervene* in the baseline of life, or did it *fail to sustain* it? The answer determines whether we shut the AI down (punishment) or just reprogram it (maintenance). The distinction does the load-bearing work because it decides whether the system is a **murderer** or a **broken tool.**
