answer: |-
  ### Conceptual Mapping & Brainstorming

  Before I settle on a label or a definitive classification, I want to walk through the conceptual landscape you're navigating. You've put your finger on a tension that has plagued hedonistic ethics and philosophy of mind for over a century, but your specific formulation adds a topological twist that is often glossed over.

  Here is how I am mapping the territory based on your description:

  1.  **The "Common Currency" Assumption:** Classical Hedonism (Bentham, early Utilitarians) operates on the assumption that pleasure has a unified *hedonic tone*. This is the idea that there is a specific qualitative "glow" or "feeling" shared by all pleasures, which allows them to be summed up. Your observation directly attacks this. If the "glow" of sunbathing is nothing like the "glow" of a math proof, the currency metaphor collapses.
  2.  **The Heterogeneity Objection:** This is the standard philosophical counter-move. It states simply: "Pleasures are diverse." However, as you noted, this is usually just a claim that Pleasure A $\neq$ Pleasure B. It doesn't necessarily claim that Pleasure A $\approx$ Pain X. Most discussions stop at "diversity," missing your insight about *cross-category resemblance*.
  3.  **Attitudinal vs. Sensory Pleasure:** Contemporary philosophers (like Fred Feldman or Chris Heathwood) often solve the diversity problem by saying pleasure isn't a *sensation* at all, but an *attitude* (e.g., "being pleased that..."). This explains why sunbathing and math proofs are both "pleasures" (you have a positive attitude toward both) without requiring a shared sensation. But this doesn't fully capture your point about the *sensations themselves* bleeding across the good/bad divide.
  4.  **Imperativism (The Motivational View):** This is the closest existing framework to your intuition. Philosophers like David Bain or theories influenced by Korsgaard argue that pleasure and pain aren't distinct sensations, but rather the *same* sensations coupled with different commands. A "burn" is neutral; if the command is "More of this!" it's pleasure (sprint); if the command is "Less of this!" it's pain (injury). This validates your feeling that the sprint burn is phenomenologically closer to a headache than to sunbathing.
  5.  **The Topological Problem:** Your specific contribution is the claim about *boundaries*. You are arguing that the boundary line drawn by *valuation* (Good/Bad) cuts across the clusters formed by *phenomenology* (What it feels like). In taxonomy terms, the "Pleasure" category is polyphyletic (derived from multiple distinct phenomenological origins) while cutting through phenomenological monophyletic groups (sensations that feel alike).

  **The Gap:** While "Heterogeneity" covers the diversity, and "Imperativism" covers the mechanism, there isn't a standard, single-term label for the specific *structural mismatch* you are describing: that phenomenological similarity does not track axiological valence.

  ***

  ### The Formal Answer

  You have identified a specific structural problem in the metaphysics of affect. While there is no single, canonical Ancient Greek or Modern term that captures *exactly* this topological inversion, it is the empirical backbone of what is known as the **Heterogeneity Objection to Hedonism**, refined through the lens of **Imperativism**.

  However, because you asked for a precise label for this *configuration* itself (distinct from the theories that try to solve it), and because existing terminology is often loose, I propose we designate this specific configuration as:

  #### **The Cross-Valence Phenomenological Affinity (CVPA)**

  Here is the precise taxonomy of what this includes, excludes, and why it matters.

  #### 1. Definition of CVPA
  **Cross-Valence Phenomenological Affinity** is the thesis that the phenomenological distance between certain instances of pleasure and certain instances of pain is smaller than the phenomenological distance between those instances of pleasure and other instances of pleasure.

  In simpler terms: The "feel" of a state is independent of its "value." Therefore, two states can feel nearly identical (high affinity) while having opposite values (cross-valence).

  *   **Your Example:** The "burn" of a sprint (Pleasure) has high affinity with the "burn" of embarrassment or a headache (Pain), despite having opposite valence.
  *   **The Implication:** Valence (Good/Bad) is not an intrinsic property of the sensation, but an extrinsic layer applied to it (perhaps by context, desire, or command).

  #### 2. Distinction from "The Heterogeneity of Pleasure"
  The standard **Heterogeneity Objection** simply claims that Pleasure$_1$ is qualitatively different from Pleasure$_2$.
  *   *Standard View:* Sunbathing $\neq$ Math Proof. (They are just different).
  *   *CVPA View:* Sunbathing $\approx$ Muscle Ache (Pain) AND Math Proof $\approx$ Relief (which can feel like cessation of Pain).
  *   **The Edge:** Heterogeneity only requires diversity within the "Good" bucket. CVPA requires *similarity across the "Good" and "Bad" buckets*. CVPA is a stronger, more specific claim than simple heterogeneity.

  #### 3. Distinction from "Mixed Pleasures"
  This is the most crucial boundary to draw. The problem of **Mixed Pleasures** (discussed in Plato's *Philebus*) refers to a single experience that contains *both* pleasure and pain simultaneously (e.g., scratching an itch, watching a tragedy).
  *   **Mixed Pleasure:** A composite state. $State = Pleasure + Pain$.
  *   **CVPA:** A structural claim about distinct states. $State_A$ (Pleasure) feels like $State_B$ (Pain).
  *   **The Edge:** Mixed pleasures admit that the categories are distinct but can co-occur. CVPA suggests the categories might not be distinct *phenomenologically* at all, only *functionally*. CVPA is about the *material* of the experience; Mixed Pleasure is about the *composition* of the experience.

  #### 4. Distinction from "Pleasure as Absence of Pain"
  The Epicurean view (Static vs. Kinetic pleasure) suggests that the highest pleasure is simply the removal of pain (ataraxia).
  *   **Absence View:** Pleasure is the zero-point on the pain scale.
  *   **CVPA:** Pleasure can be a high-intensity state that *mimics* the qualitative character of pain (like the sprint burn) without being the absence of anything.
  *   **The Edge:** The Epicurean tries to collapse pleasure *into* the cessation of pain. CVPA allows for intense pleasures that *resemble* intense pains while remaining active states. CVPA preserves the intensity of the sensation while decoupling it from the valence.

  #### 5. Why This Taxonomy Matters (The Ethical Edge)
  If **Cross-Valence Phenomenological Affinity** holds true, it creates a crisis for **Hedonic Calculus**.
  *   **If CVPA is false:** We can imagine a "hedonimeter" that measures the intensity of the "pleasure glow."
  *   **If CVPA is true:** A machine measuring the physiological or phenomenological intensity of the "burn" cannot tell you if the subject is suffering or enjoying. The "currency" is not just diverse; it is *ambiguous*.
  *   **Consequence:** You cannot maximize pleasure by simply maximizing the intensity of certain sensations, because those same sensations, in a different context, constitute suffering. This supports **Intentionalist** or **Desire-Based** theories of welfare over **Sensationalist** theories.

  ### Summary
  You have not just found a "difference" between pleasures; you have identified a **topological failure in the mapping of value to sensation**.

  While you can file this under the broader umbrella of the **Heterogeneity Objection**, the specific configuration you described is best labeled **Cross-Valence Phenomenological Affinity**. It asserts that the "Good/Bad" boundary is functional or attitudinal, not phenomenological, and that the phenomenological landscape is continuous across the moral divide.

  This distinguishes it from "Mixed Pleasures" (which are composites) and "Absence of Pain" (which denies the reality of the sensation), positioning it instead as a claim that **Valence and Qualia are orthogonal dimensions.**
