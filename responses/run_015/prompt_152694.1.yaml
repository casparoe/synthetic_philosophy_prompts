answer: |-
  **Setting:** *A museum collection room. Fluorescent lights hum over a metal tray holding the skull of *Thalassognathus*. Mara holds a caliper; Theo leans against a cabinet, arms crossed.*

  **Mara:** Look at the tolerance. The duct sits inside this half-tube with barely a micron of slack. You don't get precision like that from noise.

  **Theo:** You don't get it from selection alone, either. You know the developmental facts. That flange emerges from the same mesenchymal condensation as the jaw joint. In the sister taxon, that condensation makes a plain ridge. You can't get the jaw shape without making *something* there.

  **Mara:** I'm not arguing origin, Theo. I'm arguing maintenance. Even if it started as a byproduct—a spandrel of the jaw architecture—it's being kept. Blocking the channel costs twenty percent prey-detection accuracy in turbid water. That's a real function.

  **Theo:** A function isn't an adaptation. If the selection coefficient is that small, drift could fix it. Or it's just pleiotropy. You tweak the jaw for bite force, the flange comes along for the ride.

  **Mara:** Then explain the trade-off. Flange depth varies continuously. Deeper flanges give better detection but weaker bite force. That's an optimality problem. My model predicts flange depth should correlate with turbidity across populations, not just bite demands.

  **Theo:** And my structural hypothesis predicts depth tracks bite-force demands across the clade. The flange isn't a sensor housing; it's a stiffener. It keeps the cheek plate rigid under load. The duct just hijacked the space. That's exaptation, not adaptation.

  **Mara:** If it's exaptation now, it's under selection now. My model explains the present form. "No adaptive story found" isn't evidence of anything.

  **Theo:** But is the flange even a trait? Here's the carving objection. The variational unit is the whole cheek module. The flange isn't separately heritable. You can't vary the flange without varying the joint. The boundaries are ours, not evolution's.

  **Mara:** My optimality model doesn't require genetic independence. It requires covariance. If the module varies, selection acts on the package. The variable in my equation is depth, regardless of the genetic architecture.

  **Theo:** Then you're not explaining the flange. You're explaining the module. And you're assuming selection *could* have acted on it. If the material doesn't matter, the shape isn't optimized. Remember the swap experiment? Printed prosthetic, different internal material, animals did fine.

  **Mara:** That shows the material doesn't matter, not that the shape wasn't selected for. Geometry is the constraint.

  **Theo:** If many materials satisfy the function equally, the optimality model has no grip. It's underdetermined.

  **Mara:** *[Sighs]* Fine. I'll concede the heuristic. Asking "what is this for?" makes the spandrel verdict nearly unreachable. We talk ourselves into functions because we're looking for them.

  **Theo:** And I'll concede this: "Spandrel" isn't the null. It needs a positive developmental account with numbers. I can't just wave at constraint. The precision of the channel-to-duct fit is a real explanandum. Bare constraint-talk usually waves that away.

  **Mara:** So we design the proper swap. Not just "does it work." We measure strain distribution on the cheek plate during biting.

  **Theo:** Right. If my structural hypothesis holds, removing the flange geometry should increase deformation under load, regardless of turbidity.

  **Mara:** And if I'm right, deformation shouldn't matter, but detection should. We test in turbid water only. If the prosthetic animals lose that twenty percent accuracy, the shape is optimized for sensing.

  **Theo:** But if the prosthetic holds up structurally *and* functionally...

  **Mara:** Then the shape is sufficient, but maybe not necessary.

  **Theo:** Exactly. If multiple geometries work, why this one?

  **Mara:** Because this one was the first one that worked, and selection locked it in.

  **Theo:** Or because it's the only one the condensation can make.

  *[A grad student, Alex, hesitates at the door, holding a clipboard.]*

  **Alex:** Sorry to interrupt. The seminar starts in ten. So... is it an adaptation or not?

  **Mara:** It's a maintained exaptation with adaptive refinement. The model holds.

  **Theo:** It's a structural consequence with co-opted function. The constraint holds.

  *[They look at each other, neither blinking.]*

  **Mara:** Let's go run the strain tests.

  **Theo:** Bring the calipers.

  *[They exit together, arguing about sample size.]*
