  Consider the "Chancellor's Seal," a specific block of lignum vitae carved into a cylinder used to emboss state treaties, legally defined as the singular instrument of authority. In the first transformation, the wood slowly rots over decades and is meticulously replaced piece-by-piece with new timber matching the original grain, maintaining the embossing function without interruption. In the second transformation, the original block is preserved intact within a vacuum chamber but ground down into a smooth sphere, rendering it unusable for embossing while retaining every particle of the original timber.

  **Reasoning and Analysis**

  In the first transformation (material replacement), the Constitution View holds that the Seal survives because its identity is grounded in functional and legal continuity, distinct from the constituting wood; the Identity View holds it ceases because the object is identical to its original matter, which has been scattered. In the second transformation (deformation), the verdicts flip: the Constitution View says the Seal ceases because the constituting matter no longer supports the requisite functional role, whereas the Identity View says it survives because the matter itself persists regardless of shape. The feature driving this disagreement is the **ground of persistence conditions**: the Constitution View privileges functional role and relational properties, while the Identity View privileges material continuity and intrinsic properties. If you strip the legal and ceremonial weight—reducing the object to a mere block of wood—the Constitution View loses its justification for surviving the first transformation (no function to track), and the case collapses back into the standard Statue-and-Lump puzzle where only the second transformation (deformation) generates tension. An Identity-theorist would attack this scenario by denying the premise that functional continuity entails numerical identity; they would argue that the replaced Seal is merely a *successor* object causally connected to the original, not the same entity, thereby rejecting the Constitution View's verdict in the first transformation without needing to abandon material identity.
