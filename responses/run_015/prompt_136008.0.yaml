answer: |-
  **MEMORANDUM**

  **TO:** Clinical Neurorehabilitation Ethics and Funding Board
  **FROM:** [Your Name/Title], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Proposal #CR-2023-09: Guided Intentional Imagery in Post-Stroke Motor Recovery

  ### Executive Summary

  This memo serves as the formal recommendation of the undersigned regarding the cognitive-rehabilitation unit's request for pilot funding to test Guided Intentional Imagery (GII) as an adjunct to standard physical therapy. After reviewing the protocol documents and deliberating on the ontological implications raised during the preliminary review, I recommend **Approval with Specific Conditions**.

  This recommendation authorizes the twelve-month pilot but mandates a revised conceptual framework for data interpretation and public dissemination. This approach allows the institution to prioritize therapeutic efficacy without violating our physicalist charter, by reframing the "causal power" of mental states not as competing ontological entities, but as high-level functional descriptions of neural processes that possess unique clinical manipulability.

  ### Context and Ethical-Philosophical Tension

  The proposal posits that GII exerts an independent causal influence on cortical reorganization. This claim triggers the Board's mandate to ensure conceptual coherence with the hospital's physicalist framework. The central tension lies in the **Causal Exclusion Argument**: if every neural event has a sufficient physical cause (the neural correlates of the imagery), positing the mental state as a *separate* cause implies systematic overdetermination (two causes for one effect) or violates the causal closure of the physical domain.

  One faction of the Board fears that approving this proposal commits us to a dualistic ontology that undermines scientific rigor. The opposing faction argues that strict adherence to exclusion principles in open biological systems risks discarding effective interventions based on metaphysical dogma rather than empirical evidence.

  My assessment is that both positions rely on a false dichotomy. We need not choose between "magic mental causation" and "explanatory redundancy."

  ### Navigating the Causal Exclusion Objection

  To approve this funding without compromising our physicalist commitments, we must address the strongest version of the exclusion objection: *Even if imagery correlates with recovery, all causal work is performed by the neural substrate; the mental state is an epiphenomenal shadow.*

  I propose the Board adopt a stance of **Methodological Non-Reductive Physicalism** for the duration of this pilot. This stance navigates the tension as follows:

  1.  **Realization, Not Competition:** We reject the premise that mental states and neural states compete for causal influence. Instead, we treat the mental state (the intention to move) as *realized by* the neural state. The mental description picks out a specific functional organization of the neural substrate that is relevant to the intervention.
  2.  **Causal Sufficiency vs. Explanatory Relevance:** While the neural process may be *causally sufficient* for the motor output, the mental description is *causally relevant* for the clinical protocol. We cannot directly manipulate specific neural firing patterns in a patient; we can manipulate mental states via instruction. If the mental state is the accessible interface for the neural mechanism, citing it is not an ontological error but a clinical necessity.
  3.  **Biological Openness:** The hospital's physicalist framework assumes a closure principle derived from fundamental physics. However, in biological systems, "downward causation" (where system-level constraints influence component behavior) is a recognized model. We can interpret the "mental influence" as the system-level constraint of intention modulating lower-level synaptic plasticity, without invoking non-physical substances.

  By adopting this framework, we acknowledge that the *work* is done by the brain, but the *lever* we pull is the mind. This avoids ontological extravagance while validating the therapeutic mechanism.

  ### Recommendation and Conditions

  I recommend the Board **APPROVE** the funding request for the twelve-month pilot, subject to the following three conditions designed to maintain conceptual coherence:

  **Condition 1: Terminological Precision in Dissemination**
  The research team must agree that in all internal reports and external publications, mental states (e.g., "intention," "imagery") shall be described as *functional descriptions of neural activity* rather than distinct causal agents operating alongside neural processes. Language implying a "ghost in the machine" (e.g., "the mind forces the brain to change") must be avoided in favor of mechanistic integration (e.g., "imagery protocols engage specific sensorimotor loops").

  **Condition 2: The Correlate Sub-Study**
  A portion of the pilot budget (approximately 10%) must be allocated to concurrent neuroimaging or EEG monitoring for a subset of participants. The goal is not merely to show recovery, but to map the *temporal precedence* of the reported mental state against the neural markers of plasticity. This ensures we are testing the mechanism, not just the outcome, allowing us to verify if the mental report tracks with the proposed neural modulation.

  **Condition 3: Informed Consent Transparency**
  Patient consent forms must not oversell the metaphysical nature of the treatment. Patients should be informed that this therapy uses "brain training techniques" to enhance physical recovery, rather than implying that "thought alone" cures the deficit. This protects patients from potential distress should the "mental" aspect feel insufficient during difficult recovery phases.

  ### Implementation Timeline

  To ensure these conditions are integrated before the pilot commences, the following timeline is proposed:

  *   **October 28 (Quarterly Meeting):** Board vote on this recommendation.
  *   **November 10:** Research team submits revised protocol language adhering to Condition 1 (Terminological Precision).
  *   **November 17:** Ethics sub-committee reviews revised Informed Consent documents (Condition 3).
  *   **December 1:** Final budget allocation released, including earmarked funds for the Correlate Sub-Study (Condition 2).
  *   **January 15:** Pilot recruitment begins.
  *   **Month 6 (Interim Review):** Board receives preliminary data on the correlation between patient self-reports of imagery vividness and neural markers.
  *   **Month 12:** Final report and decision on long-term funding based on both efficacy and mechanistic coherence.

  ### Conclusion

  Rejecting this proposal on the grounds of causal exclusion would privilege metaphysical purity over patient welfare, effectively penalizing a treatment because we lack a consensus vocabulary for how the brain interacts with itself. Conversely, approving it without conditions would risk institutional incoherence.

  By approving with conditions, we signal that the hospital is committed to physicalist rigor not as a barrier to innovation, but as a tool to clarify *how* innovations work. We treat the mental state not as a rival cause to the neural, but as the clinically accessible face of the neural. This allows us to fund the recovery of patients like my own family member, whose improvement remains unexplained by physical input alone, without abandoning the scientific principles that ground our institution's credibility.

  I look forward to discussing this framework during our meeting on the 28th.

  **Signed,**

  [Your Name]
  Member, Clinical Neurorehabilitation Ethics and Funding Board
