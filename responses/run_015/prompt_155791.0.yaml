      5.  **Alliance-Substitute Deterrence:** Must explain how this specific organization replaces the security guarantee of an alliance.
      6.  **Institutional Resilience:** Must account for long-term viability without external security umbrellas.

  5.  **Labeling Constraints (Non-negotiable vs. Preference):**

      *   Signaling is Non-negotiable for *armed neutrality*.
      *   Civic equality is a Preference (democratic camp).
      *   Fiscal sustainability is a Binding Constraint (state survival).
      *   Offensive/Defensive distinction is Politically Constructed (analytical nuance).

  6.  **Applying to Cases (Switzerland, Sweden, Finland):**

      *   *Switzerland:* High reserve, low active. Fits signaling well. Complicates automation (high tech but still militia).
