      *   A professional army looks like it *could* go abroad (expeditionary). A militia looks like it *stays home* (territorial).
      *   Therefore, the theory must explain how organization *is* signal.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Signaling Non-Aggression.* The structure must visibly preclude offensive operations. (Non-negotiable for neutrality).
