      2.  **Societal Distribution of Competence:** Military skill must be widespread to signal "nation in arms" (deterrence by punishment/denial via occupation cost).
      3.  **The Automation-Politics Decoupling:** Must explain why manpower persists despite tech efficiency (political signal > tactical efficiency).
