answer: |-
  This is a meta-ontological specification task. You are asking for the functional requirements of a tool designed to diagnose ontological commitment under conditions of radical underdetermination. The goal is to distinguish *substantive* disagreement from *verbal* or *empty* disagreement when the usual arbiter (evidence) is absent.

  Here is the audit of your candidate specifications, followed by the analysis of constraints, trade-offs, and exclusionary power.

  ### 1. Audit of Candidate Specifications

  **1. Separate electrons from phlogiston.**
  *   **Verdict:** **Realist Reflex.**
  *   **Case:** This requirement conflates *ontology identification* (what does the theory say exists?) with *truth evaluation* (what actually exists?). A valid method for identifying commitment must identify that Phlogiston Theory is committed to phlogiston, even if phlogiston is false. If your method rules out phlogiston *as a commitment*, it is not analyzing the theory; it is analyzing the world. If you mean it should rule out phlogiston *as real* while keeping electrons, that is a requirement for a theory of *truth*, not a method for *commitment identification*. Demanding this biases the method toward current scientific consensus rather than structural analysis.

  **2. Scale invariance (coin under cup vs. cosmic horizon).**
  *   **Verdict:** **Mixed (Genuine but risky).**
  *   **Case:** This is genuine insofar as it demands *modal consistency*. If the method relies on "in-principle inaccessibility," it must treat all in-principle inaccessible regions similarly. However, there is a category error in your example: a coin under a cup is *practically* inaccessible, not *in-principle* inaccessible. A method that treats practical ignorance (coin) identical to metaphysical horizons (cosmos) ignores the difference between *epistemic contingency* and *causal isolation*. A genuine requirement here is **Modal Consistency**: the verdict should depend on the *type* of inaccessibility (practical vs. principled), not the spatial scale. If you demand scale invariance across *different modal types*, you force the method to ignore relevant metaphysical distinctions.

  **3. No collapse ("we can't tell" $\neq$ "there's nothing").**
  *   **Verdict:** **Non-Negotiable.**
  *   **Case:** This is the anti-verificationist constraint. It is the core of your problem statement. If the method collapses epistemic limits into ontological negation, it cannot handle the cases you care about (light cones, no-trace events). It would simply dissolve the dispute by declaring the entities non-existent. To distinguish *real* from *verbal* disagreement, the method must allow for the possibility of a fact of the matter that exceeds our capacity to verify it. Without this, the method is just verificationism in disguise.

  **4. Distinguish commitment from reality.**
  *   **Verdict:** **Non-Negotiable.**
  *   **Case:** This is the distinction between *internal* and *external* questions (to use Carnap's terms, though you likely reject his answer). A method for ontology identification analyzes the *theory*, not the *universe*. If the method outputs "what exists" directly, it bypasses the theory and makes a metaphysical claim. To judge whether a dispute is verbal, you must first establish what the opposing theories are *committed to*, independent of whether those commitments are satisfied. Conflating these makes it impossible to identify verbal disputes (which often arise when commitments are misidentified as reality claims).

  **5. Input specification (Formalism vs. Practice).**
  *   **Verdict:** **Non-Negotiable (Methodological Hygiene).**
  *   **Case:** You cannot run a function without defining the domain. "Reading quantifiers" (Quine's criterion) assumes the input is a regimented first-order logic sentence. If the input is a research program or community practice, quantifier-reading fails. A method must specify its data source. Leaving this open allows the method to shift goalposts (e.g., using formalism when it suits, practice when it doesn't). This is a requirement for the method's coherence, not just its philosophical stance.

  ---

  ### 2. Non-Negotiable vs. Camp-Specific

  **Non-Negotiable (Functional Prerequisites):**
  *   **No Collapse:** Without this, the method cannot process your target cases. It renders the tool useless for in-principle inaccessible entities.
  *   **Input Specification:** Without this, the method is ill-defined.
  *   **Commitment vs. Reality:** Without this, the method cannot diagnose *verbal* disagreement, only *false* belief.

  **Camp-Specific (Philosophical Preferences):**
  *   **Electrons vs. Phlogiston:** This is a **Scientific Realist** demand. An Instrumentalist or Constructive Empiricist would reject this; they might argue both are merely "empirically adequate constructs." Demanding this forces the method to track truth, not just commitment.
  *   **Scale Invariance:** This is a **Uniformitarian** demand. A Contextualist or Pragmatist might argue that ontological questions make sense in the "coin" context (local causality) but not the "horizon" context (global metaphysics). Demanding invariance forces a specific view on the unity of metaphysics.

  ---

  ### 3. The Incompatibility: Evidence vs. Determinacy

  Your hunch is correct. The two requirements that cannot both be satisfied are:
  1.  **The Accessible Evidence Constraint:** The ontological verdict is fixed entirely by accessible empirical evidence.
  2.  **The Determinacy Constraint:** The verdict on the existence of the inaccessible entity is unique and determinate (i.e., there is a fact of the matter).

  **The Case:**
  Consider two theories, $T_1$ and $T_2$.
  *   **Observables:** $T_1$ and $T_2$ predict identical outcomes for all possible observations within the light cone ($O_1 = O_2$).
  *   **Inaccessibles:** $T_1$ posits entity $E$ outside the light cone. $T_2$ posits $\neg E$ (or a different entity $E^*$) outside the light cone.

  **The Conflict:**
  *   If you enforce **Accessible Evidence**, the input to the method is identical for both theories ($O$). A deterministic function with identical input must yield identical output. Therefore, the method must issue the same ontological verdict for $T_1$ and $T_2$. It must say either "Both commit to $E$," "Neither commits to $E$," or "The question is meaningless." It cannot say "$T_1$ is right, $T_2$ is wrong."
  *   If you enforce **Determinacy**, you require the method to acknowledge that $T_1$ and $T_2$ describe different worlds, and one description is correct. This requires the verdict to differ.
  *   **Result:** You cannot have a method that is *strictly evidence-bound* and also yields *determinate realist verdicts* on underdetermined cases. You must either accept ontological indeterminacy (drop Determinacy) or admit non-empirical virtues (theoretical elegance, simplicity) as evidence (drop Accessible Evidence).

  ---

  ### 4. The Most Exclusionary Requirement

  The single requirement that rules out the most candidate methods is **"No Collapse" (Anti-Verificationism).**

  **Why:**
  This requirement forbids the most common historical solution to the problem of inaccessible entities: **dissolving the problem.**

  *   **Logical Positivism / Verificationism:** Collapses meaning into verification conditions. If you can't verify it, it's not a meaningful claim. (Ruled Out)
  *   **Constructive Empiricism (Van Fraassen):** Agnosticism about the inaccessible. While it doesn't say "nothing exists," it refuses to settle the dispute as *real*, effectively treating it as non-substantive for scientific aims. Depending on your definition of "real disagreement," this may be ruled out or severely constrained.
  *   **Carnapian Deflationism:** Treats ontological disputes as internal to linguistic frameworks. If the frameworks are empirically equivalent, the choice is pragmatic, not factual. This collapses the "real vs. verbal" distinction into "useful vs. less useful." (Ruled Out)
  *   **Operationalism:** Defines entities by measurement operations. No operation = no entity. (Ruled Out)

  **Comparison:**
  *   **Input Specification** rules out *Naive Quineanism* (reading quantifiers off surface grammar), but sophisticated Quineans can adapt by regimenting practice into formalism.
  *   **Commitment vs. Reality** rules out *Naturalized Ontology* (where science tells us what exists directly), but many methods already distinguish the two.
  *   **No Collapse** rules out the entire class of **Epistemic Restrictions on Ontology**. It forces the method to be metaphysical rather than epistemological. It demands that the method posit a fact of the matter where science (by definition) cannot reach. This eliminates the majority of 20th-century analytic approaches to ontology, leaving only robust Realist or Speculative Metaphysical methods.

  **Recommendation:**
  If you keep **"No Collapse,"** you are committing to a form of Realism that transcends empirical adequacy. If you find that too costly, you must weaken it to "No Collapse *unless* theoretical virtues dictate otherwise," which effectively surrenders the "Accessible Evidence" constraint. You cannot have both.
