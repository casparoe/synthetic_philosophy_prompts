answer: |-
  This is a genuinely difficult knot in decision theory, and your intuition that standard labels like "adaptive preferences" miss the mark is correct. Those terms describe *psychological adjustments*; you are describing a *structural breakdown in the machinery of rational choice*.

  You are asking for the name of a situation where the utility function is not just unknown, but *endogenous* to the choice in a way that invalidates the evaluator.

  Here is the brainstorming process, the rejection of near-misses, and the precise concept that fits your description.

  ### 1. Brainstorming Nearby Concepts

  1.  **Adaptive Preferences (Jon Elster / Martha Nussbaum):** This is the "sour grapes" phenomenon. You can't have the fruit, so you decide you didn't want it anyway.
      *   *Why I reject it:* As you sensed, this is about *coping* with constraints, usually under oppression or scarcity. It implies a distortion of *true* desires to reduce cognitive dissonance. Your cases aren't about lowering standards to match reality; they are about reality *creating* the standards. The parent doesn't "settle" for the child; the child creates a new category of value that didn't exist before.
  2.  **Endogenous Preferences (Economics / Stigler & Becker):** This is the technical term for when consumption habits change future tastes (e.g., addiction, training).
      *   *Why I reject it:* It's too mechanical. It treats preferences like a demand curve that shifts. It doesn't capture the *epistemic* blackout. An economist would say "calculate the expected utility of the preference shift." Your point is that you *can't* calculate that from the outside.
  3.  **The Hedonic Treadmill (Brickman & Campbell):** The psychological tendency to return to a baseline level of happiness despite major positive or negative life events.
      *   *Why I reject it:* This is about *affect regulation*, not value constitution. It suggests the job or child won't make you happier in the long run. Your cases aren't about happiness levels; they are about *what counts as a reason*. The parent isn't saying "I'm baseline happy"; they are saying "This relationship is a source of value I cannot compare to my pre-parent self."
  4.  **Ulysses Contracts / Precommitment (Jon Elster / Thomas Schelling):** Strategies where an agent binds their future self to prevent weakness of will.
      *   *Why I reject it:* This is a *solution* to a problem of changing selves, not the name of the problem itself. It assumes you know the future self will be "worse" (drunk, weak). In your cases, the future self might be "better" (more virtuous, more loving), but you still can't judge them.
  5.  **Incommensurability (Ruth Chang / Isaiah Berlin):** The idea that two values (e.g., liberty vs. equality, or career vs. family) cannot be measured on a single scale.
      *   *Why I reject it:* Close, but usually applies to comparing two *external* options. Your problem is comparing the *current self* to the *future self*. It's diachronic (across time), not synchronic (at one time).
  6.  **Transformative Experience (L.A. Paul):** A choice that provides new phenomenal knowledge and/or fundamentally alters your core preferences and identity.

  ### 2. The Best Fit: Transformative Experience

  The concept you are looking for is **Transformative Experience**, specifically as formulated by the philosopher **L.A. Paul** in her 2014 book *Transformative Experience*.

  However, simply giving you the label isn't enough, because the term has become somewhat pop-philosophical. I need to show you exactly *which part* of Paul's framework addresses your specific worry about "contaminated testimony" and "spoiled verdicts."

  Paul argues that transformative choices present two distinct barriers to standard Decision Theory (specifically Expected Utility Theory):

  1.  **The Epistemic Problem:** You cannot know *what it is like* to be the person who made the choice until you make it. (Like trying to imagine seeing color if you are colorblind). This addresses your worry about testimony: other parents can tell you facts, but they cannot give you the *phenomenal knowledge* of being *you* with that child.
  2.  **The Personal Problem:** The choice changes *who you are* (your utility function). This addresses your worry about the "spoiled verdict." Once you have the child or take the job, your values shift to align with that outcome. Therefore, the post-choice self's endorsement ("I love this job") is not independent evidence of the choice's quality; it is a *product* of the choice.

  **Why this fits your "Contaminated Testimony" worry:**
  You noted that the only person qualified to judge is the person the decision produced, and their verdict is spoiled. Paul calls this the **problem of retrospective validation**. In standard choices, we assume the "future self" is a reliable witness to whether the outcome was good. In transformative choices, the "future self" is a *different witness* with different interests. The parent who says "I wouldn't give her up" is speaking a truth that is *conditional* on the transformation having occurred. It does not answer the pre-transformation question: "Is this transformation worth it?"

  ### 3. Carving the Concept (The Edges)

  You asked for the boundaries of this concept. Here is where the concept holds and where it breaks.

  **A. Does it stop being this thing if the change is reversible?**
  *   **The Edge:** No, reversibility does not solve the epistemic problem, but it changes the decision-theoretic stakes.
  *   **Why:** Even if you can quit the job or (theoretically) reverse the parenting decision, you still cannot access the *phenomenal knowledge* of what it is like to be that person without crossing the threshold. However, if the change is easily reversible, standard Decision Theory might regain a foothold: you can treat it as an "experiment" with a low cost of failure. The *Transformative* label applies most strictly when the change is **significant and costly to reverse**. If you can step in and out of the identity at will, it's merely *exploratory*, not transformative in the philosophical sense.

  **B. Does it cover changes you undergo without choosing them?**
  *   **The Edge:** It covers the *metaphysics* of the change, but not the *decision problem*.
  *   **Why:** If you are in a car accident that changes your personality (traumatic brain injury), that is a transformative *event*. But it is not a transformative *choice*. The philosophical puzzle you are wrestling with is specifically about **rational agency**. If you don't choose it, there is no problem of rational justification. The "contaminated testimony" problem only matters if you are trying to decide whether to *authorize* the transformation.

  **C. Is the problem that you can't know, or that you can't choose rationally?**
  *   **The Edge:** It is an epistemic problem that *causes* a decision-theoretic collapse.
  *   **Why:** Standard rational choice requires assigning a probability and a utility value to an outcome ($P \times U$).
      *   You can't assign $U$ (Utility) because your utility function will change.
      *   You can't assign $P$ (Probability) of satisfaction because you lack the data (Epistemic Blackout).
      *   Therefore, you cannot choose *rationally* in the standard sense. Paul argues you must choose on **non-epistemic grounds** (e.g., "I want to be the kind of person who discovers new things," or "I commit to this value without knowing its content"). This moves the decision from *calculation* to *commitment*.

  **D. Is it the same phenomenon when what changes is how things feel vs. what counts as a reason?**
  *   **The Edge:** Paul treats these as two sides of the same coin, but they can come apart.
  *   **Why:**
      *   *Phenomenal Transformation:* "What it feels like to taste durian." (Purely sensory).
      *   *Preference Transformation:* "What it means to be a parent." (Value-based).
      *   Your cases are **Preference Transformations** (specifically **Constitutive** ones). The job doesn't just feel different; it changes what you consider *worth doing*. The child doesn't just feel different; she changes what you consider *valuable*.
      *   *Distinction:* If only the *feeling* changes (e.g., you get used to the noise), that's habituation (Hedonic Treadmill). If the *reasons* change (e.g., "I now work for her, not me"), that is a **Transformation of Practical Identity** (a term used by Christine Korsgaard and David Velleman). Your cases are the latter. The "contaminated testimony" is strongest here: the new reasons *validate* the change that created the reasons.

  ### Summary Diagnosis

  You are describing the **Decision-Theoretic Impasse of Transformative Choice**.

  It is distinct from **Adaptive Preferences** because adaptive preferences are a *failure* of rationality (distorting desires to match options), whereas transformative choices are a *limit* of rationality (options that reconstruct the desirer).

  It is distinct from **Endogenous Preferences** because economics assumes you can still model the shift. You are correctly pointing out that when the shift is deep enough (identity-level), the model breaks because the *evaluator* is replaced.

  **The precise word you lack is "Transformative."** But you should wield it with the specific philosophical weight L.A. Paul gives it: it is not just "life-changing." It is a choice where **the evidence required to make the decision is only accessible by making the decision, and the criteria for judging the decision are created by the decision itself.**

  This leaves you in a position where you cannot choose *based on reasons* (because the reasons don't exist for you yet). You can only choose based on **attitude** (e.g., openness to transformation, or commitment to a vague ideal). That is why it feels like a different shape of decision. It is.
