          2.  Patent claim (abstract ideas aren't patentable).
          3.  Metaphysical claim (ideas as abstract types vs. Lockean homesteading).
          4.  Economic claim (non-rivalry/public goods).
          5.  Moral-desert claim (mental labor vs. physical mixing).
          6.  Linguistic claim (collapse of idea/expression).
          7.  The "Ideas want to be free" slogan.
      *   **Format:** A "menu" of claims, not a single answer. For each: Is it a platitude, a real thesis, or false? Does it excuse the specific behavior (copying wireframes/pitching socially)?
      *   **Tone:** Analytical, precise, practical (for a roommate meeting), no citations/reading lists needed.

  2.  **Deconstruct the Roommate's Slogan:** "You can't own an idea, only its expression."
      *   *Surface Level:* It sounds like legal advice.
      *   *Underlying Level:* It's being used as a moral shield for plagiarism/unethical behavior.
      *   *The Slide:* Moving from "The court won't sue you" to "You didn't do anything wrong."

  3.  **Drafting the Menu of Claims (Iterative Process):**

      *   **1. Copyright-Law Claim (Idea-Expression Dichotomy):**
          *   *Claim:* Copyright protects fixed expression (code, text, specific art), not underlying concepts, systems, or methods of operation.
          *   *Status:* Legally accurate (in the US/many jurisdictions), *but* wireframes might count as expression.
          *   *Relevance:* Doesn't excuse the social pitching. Just means a lawsuit might fail.
          *   *Verdict:* Real legal thesis, but misapplied morally.

      *   **2. Patent Claim (Abstract Ideas):**
          *   *Claim:* You can't patent an abstract idea; you need a specific implementation.
          *   *Status:* Legally accurate (Alice Corp v. CLS Bank etc.).
          *   *Relevance:* Irrelevant. They aren't patenting anything. It's a red herring.
          *   *Verdict:* True legal fact, irrelevant context.

      *   **3. Metaphysical Claim (Abstract Types):**
          *   *Claim:* Ideas exist outside space/time; you can't "hold" them like property.
          *   *Status:* Philosophical thesis (Platonism vs. Nominalism). Debatable.
          *   *Relevance:* Even if true, doesn't mean you can't claim *credit* for generating the token.
          *   *Verdict:* Deep philosophical thesis, doesn't justify theft of credit.

      *   **4. Economic Claim (Non-Rivalry):**
          *   *Claim:* Ideas are non-rivalrous. Me using it doesn't stop you. No harm done.
          *   *Status:* Economically true regarding *consumption*, false regarding *value capture/reputation*.
          *   *Relevance:* Ignores the harm of misattribution (reputation loss).
          *   *Verdict:* Partially true, morally insufficient.

      *   **5. Moral-Desert Claim (Lockean Labor):**
          *   *Claim:* Property comes from mixing labor with physical resources. Mental labor doesn't count.
          *   *Status:* Controversial interpretation of Locke. Most IP theory argues mental labor *does* create desert.
          *   *Relevance:* Directly contradicts the norm of giving credit for work.
          *   *Verdict:* Weak moral thesis, easily challenged.

      *   **6. Linguistic Claim (Collapse):**
          *   *Claim:* "Idea" and "Expression" are the same thing in communication.
          *   *Status:* False. We distinguish concept from execution all the time.
          *   *Relevance:* If they are the same, the slogan makes no sense.
          *   *Verdict:* False/Confused.

      *   **7. "Ideas Want to Be Free" (Stewart Brand):**
          *   *Claim:* Information flow benefits society more than restriction.
          *   *Status:* Normative/Political claim.
          *   *Relevance:* Justifies sharing, not *stealing credit*.
          *   *Verdict:* Different claim (utilitarian vs. proprietary).

  4.  **Identifying "The Slide" (The Crucial Part):**
      *   The user specifically asked to identify where the roommate slides from "courts won't enforce" to "I didn't wrong you."
      *   *The Slide:* Moving from **Descriptive** (Law doesn't protect this) to **Normative** (Therefore, no moral obligation exists).
