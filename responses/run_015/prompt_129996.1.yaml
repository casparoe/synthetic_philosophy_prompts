answer: |-
  Here is a menu of the precise claims hidden inside your roommate's slogan. I have broken them down by domain, evaluated their validity, and flagged whether they actually excuse his behavior (pitching your work as his own).

  ### 1. The Copyright-Law Claim
  **The Claim:** *"Copyright law protects the specific code or text (expression), but not the underlying concept, system, or logic flow (idea)."*
  *   **Status:** **Mostly True (Legal Platitude).** This is the "idea-expression dichotomy" (17 U.S.C. § 102(b)).
  *   **The Catch:** Wireframes and logic flows often straddle the line. Highly detailed wireframes are considered "pictorial/graphic works" (expression), not just abstract ideas. If he copied the actual sketches, he may have copied the *expression*, not just the *idea*.
  *   **Does it excuse the behavior?** **No.**
      *   **Why:** This claim describes what a *court* will enforce, not what a *person* is allowed to do. It means you might not win a lawsuit, not that he didn't commit plagiarism. It conflates **liability** with **permission**.

  ### 2. The Patent-Claim
  **The Claim:** *"Abstract ideas, natural phenomena, and laws of nature are not patentable subject matter."*
  *   **Status:** **True (Legal Fact).** You cannot patent a "seed library concept." You need a specific, novel implementation.
  *   **The Catch:** This is a **Red Herring**. You were never trying to patent anything. Patent law is irrelevant to a nonprofit pitch or a roommate dispute.
  *   **Does it excuse the behavior?** **No.**
      *   **Why:** Invoking patent law here is a distraction. It implies that because the government won't grant a monopoly on the concept, no one can claim they generated it. That is a non-sequitur.

  ### 3. The Metaphysical Claim
  **The Claim:** *"Ideas are abstract types that cannot be spatiotemporally bounded or 'homesteaded' like physical property."*
  *   **Status:** **Real Thesis (Debatable).** This relies on a Platonic view of ideas vs. a Lockean view of property. It argues you can't "mix labor" with an abstract concept to own it.
  *   **The Catch:** Even if ideas are abstract, the *instance* of the idea (your specific sketch, your specific time-stamped document) is concrete. He didn't steal the abstract concept of a seed library; he stole *your specific articulation* of it.
  *   **Does it excuse the behavior?** **No.**
      *   **Why:** This justifies why you can't fence off an idea, but it doesn't justify why he can claim he built the fence. It ignores the difference between **discovery** (finding an existing truth) and **creation** (generating a specific artifact).

  ### 4. The Economic Claim
  **The Claim:** *"Ideas are non-rivalrous public goods. If I take it, you still have it, so no harm is done."*
  *   **Status:** **Partially True (Economic Theory).** Ideas are non-rivalrous (my use doesn't deplete yours).
  *   **The Catch:** It ignores **reputational rivalry**. While you still *have* the idea, you no longer have the *credit* for it. In a professional context, credit is a rivalrous good (there is only one "originator" spot).
  *   **Does it excuse the behavior?** **No.**
      *   **Why:** This claims there is no *economic loss*, but ignores the *social loss*. By pitching it as his, he devalued your contribution in the eyes of the nonprofit. That is a tangible harm.

  ### 5. The Moral-Desert Claim
  **The Claim:** *"Mental labor does not mix with physical resources, therefore it generates no moral claim to ownership or credit."*
  *   **Status:** **False (Weak Moral Thesis).** This is a distortion of Lockean labor theory. Most ethical frameworks acknowledge that intellectual labor creates a claim to **attribution**, even if not **property**.
  *   **The Catch:** It assumes the only valid property is physical. But we universally acknowledge moral claims to credit for art, writing, and design without needing physical transfer.
  *   **Does it excuse the behavior?** **No.**
      *   **Why:** This is the weakest link. It denies the basic social contract of collaboration: if you do the work, you get the credit. Denying this makes all collaboration impossible.

  ### 6. The Linguistic Claim
  **The Claim:** *"'Idea' and 'Expression' are the same mental content; distinguishing them is artificial."*
  *   **Status:** **False (Category Error).** We distinguish concept from execution constantly (e.g., "I had the idea for a movie, but he wrote the script").
  *   **The Catch:** If this were true, his slogan ("You can't own an idea, only its expression") would be meaningless. He is relying on the distinction to defend himself while simultaneously collapsing the distinction to dismiss your work.
  *   **Does it excuse the behavior?** **No.**
      *   **Why:** It's self-contradictory. He needs the distinction to exist for his legal defense, but needs it to collapse for his moral defense.

  ### 7. The "Ideas Want to Be Free" Slogan
  **The Claim:** *"Information flow benefits society more than restriction; hoarding ideas is anti-social."*
  *   **Status:** **Normative/Political Claim.** (Attributed to Stewart Brand). This is a utilitarian argument about societal good, not individual rights.
  *   **The Catch:** "Free" means **libre** (freedom to use), not **gratis** (free of cost/credit). You can share an idea freely while still attributing the source.
  *   **Does it excuse the behavior?** **No.**
      *   **Why:** This argues for *sharing*, not *plagiarism*. You could have pitched it together, or he could have pitched it saying "My roommate designed this." Hiding the source violates the spirit of "free information," which relies on accurate provenance.

  ---

  ### Where "The Slide" Happens

  You are correct that he is sliding. Here is the precise mechanism of the slide so you can point it out in the meeting:

  **The Is-Ought Slide**
  He is sliding from a **Descriptive Claim** (Law) to a **Normative Claim** (Morality).

  1.  **Premise A (True/Descriptive):** "Copyright law does not protect abstract ideas." (The *Is*)
  2.  **Premise B (Hidden/False):** "If the law does not protect it, there is no moral obligation to respect it." (The *Slide*)
  3.  **Conclusion (False/Normative):** "Therefore, I did not wrong you by taking credit." (The *Ought*)

  **How to call it out:**
  > "You are confusing **enforceability** with **ethics**. The law doesn't protect me from you lying about who did the work, but that doesn't make it honest. You're using a legal technicality to justify a social betrayal."

  **The Wireframe Specifics:**
  > "Also, wireframes aren't just 'ideas.' They are visual expressions. Even by your own legal logic, copying the sketches crosses the line from 'idea' to 'expression.' So you're wrong on the law *and* wrong on the ethics."

  ### Summary for the Meeting
  *   **Copyright Claim:** True law, wrong application. (Wireframes are expression).
  *   **Patent Claim:** Irrelevant red herring.
  *   **Economic Claim:** Ignores reputational harm.
  *   **Moral Claim:** Denies the value of intellectual labor.
  *   **The Slide:** He is arguing that **lack of legal recourse** equals **moral permission**. It does not.

  He isn't arguing that "ideas should be free." He is arguing that **credit should be unowned.** That is a much harder position to defend.
