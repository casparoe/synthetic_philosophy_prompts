answer: |-
  Good evening, everyone. For those who don't know me, I had the privilege of being [Advisor's Name]'s PhD student many years ago. Which, for those who know him, means I have spent roughly three decades trying to explain to my family what he actually does, while he spends those same three decades correcting my explanation.

  Tonight is about celebration, not correction. He has asked for one night off from the seminar room, so I promise I will not turn this into a lecture. However, given who we are honoring, precision is a form of affection. If I speak loosely about his life's work, he will spend the rest of the dinner staring at his wine glass until I fix it. So, bear with me.

  There is a line he uses often, that "there is a show, but nobody in the audience." I know, because I've heard half the people in this room argue about it. When he says the feeling of being conscious is a "user illusion," people hear him saying that *nothing* is real. They worry he thinks we're zombies—that pain isn't pain, that love isn't love, that the rowing club's post-practice beer is merely a chemical simulation.

  But that isn't what he thinks. And if I know him, he's nodding slightly, which is the most enthusiastic endorsement I'm likely to get.

  His point isn't that the experience is fake. His point is that the *story* we tell about the experience is constructed. He believes the brain builds a simplified model of itself to help us navigate the world, and we mistake that model for a soul sitting inside a skull. He doesn't deny the show; he just denies there's a little person watching it. He isn't saying nobody's home; he's saying the home is full of activity, but there's no landlord living in the basement.

  I know this sounds strange to the rowers here. You trust the water. You trust the split time. You trust what you can measure. [Advisor's Name] is the same way. He is strange about boats, yes, but only because he believes a boat, like a mind, should do exactly what physics says it will do. He spends his life measuring the unmeasurable parts of us, not to diminish them, but to understand the machinery of the miracle.

  Now, I also know that not everyone in this room believes everything can be measured. [Wife's Name] is here, and she knows there are truths about the human spirit that no scan can capture. I have watched them navigate this for thirty years. He measures the mechanism; she honors the mystery. He doesn't claim his models exhaust the truth of a person, only that they describe the machinery. They have built a marriage on the understanding that you can respect the data without denying the devotion.

  So, when we raise a glass tonight, we aren't toasting a man who thinks we're empty. We are toasting a man who is curious enough to ask if the viewer exists, even while he enjoys the show. He has spent a lifetime dismantling the illusion of the self, yet he has built a very real community of students, colleagues, friends, and a family who love him. If that is a user illusion, it is a remarkably sturdy one.

  To [Advisor's Name]: May the show go on, may the model hold steady, and may you finally find someone in the audience who agrees with you. Cheers.

  \answer{The toast commits me to claiming that his view denies the existence of a central self-model (the audience) but affirms the reality of the experience (the show), rejecting the zombie accusation while maintaining his rigorous empiricism.}
