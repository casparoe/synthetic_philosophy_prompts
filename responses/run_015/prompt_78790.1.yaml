prompt: |-
  I just got off a two-hour argument with my friend Dev about my old PhD advisor's entire career, and now I have to give a toast about it on Saturday, so I need help.

  The advisor's view, in his own words: the feeling of being conscious is a user illusion. The brain builds a stripped-down model of what's going on inside itself, and that model is the whole of what we call experience. He has a line he uses constantly, that there's a show but nobody in the audience. Dev's take: either that's trivially true, because of course a model is a model, or it's incoherent, because an illusion has to fool somebody, and if the somebody is also part of the illusion then you've said nothing at all. Dev also said fine, so your guy thinks we're all zombies, which I'm pretty sure is not what he thinks, but I couldn't say why in the moment and it's definately been bugging me all day.

  The occasion: retirement dinner, Saturday, my toast is five minutes, maybe six. The man himself will be three feet away and has never in thirty years let a misstatement of his position slide, so I can't do the vague-warm-paraphrase thing where I gesture at his ideas and hope. Half the room is his department, people who will hear every word and wince at anything sloppy. The other half is his family and his rowing club, alot of whom know him as a guy who is strange about boats and doesn't believe in anything he can't measure. He asked me not to turn it into an argument about whether he's right; he wants one night off. His wife is a devout Catholic, thinks the whole thing is nonsense, and he's completely fine with that, so I can't make him sound like he's at war with religion either.

  What I need is the toast itself: warm, funny, lands for the rowing club, and precise enough that the philosophers hear me keeping the things apart. The self being a model is one claim; consciousness itself being an illusion is another; neither one means we're zombies, and neither one means nobody's home in the way Dev means it. And it has to stay a toast, not a lecture, and not settle the question, because he asked me not to and because I honestly don't know where I land.

  Skip the survey of who said what — I don't need the literature, I need the speech. After the toast, on the last line, put \answer{...} with one sentence saying what the toast as written actually commits me to claiming about his view.
