answer: |-
  # The Reduction-Emergence Diagnostic Instrument (REDI)

  **Premise:** For the purposes of this seminar, we grant that macro-level scientific explanations (e.g., in thermodynamics, biology, or psychology) are sometimes *genuinely indispensable* to scientific practice. The following five nodes determine what you believe this indispensability implies about the structure of reality.

  **Instructions:** For each node, select the option that best reflects your metaphysical commitment regarding the specific scenario provided. Do not select an answer based on the label you wish to claim; select the answer that reflects what you believe is actually happening in the world.

  ---

  ### Node 1: The Nature of Indispensability
  **Scenario:** Consider **thermodynamic temperature**. We cannot practically predict the behavior of a gas by tracking every molecule; we must use temperature.
  **Question:** Is this indispensability due to the limits of human cognition and computation (we *cannot* track the molecules), or is it because temperature picks out a real feature of the world that exists over and above the motion of individual molecules?

  *   **(A) Epistemic/Practical:** Temperature is a convenient shorthand for the mean kinetic energy of micro-states. It is indispensable *for us*, but the world itself is just particles moving.
  *   **(B) Ontological:** Temperature refers to a genuine macro-property. Even a being with infinite computation would acknowledge "temperature" as a real feature distinct from the sum of parts.

  ### Node 2: Causal Autonomy and Constraints
  **Scenario:** Consider **collective navigation in a bird flock**. The flock moves as a cohesive unit, avoiding predators.
  **Question:** Does the flock's cohesive shape causally constrain individual birds to adjust their flight rules (downward constraint without direct energy transfer from the "flock"), or is the flock's motion fully derived from each bird following local rules independent of the global shape?

  *   **(A) Micro-Derivative:** The "flock" does nothing. The motion is entirely the result of individual birds reacting to neighbors. The global pattern is a byproduct.
  *   **(B) Macro-Constraint:** The global structure of the flock actively constrains individual behavior. The whole shapes the parts via information or boundary conditions, not just energy summation.

  ### Node 3: Causal Closure of the Micro-Physical
  **Scenario:** Consider the **global stability of a gene-regulatory network**. This stability ensures a cell differentiates correctly.
  **Question:** If the network's stability causes a specific gene expression, is the physical energy and information required for that expression fully accounted for by the molecular interactions of the transcription factors alone, or does the network level contribute something physically non-derivative?

  *   **(A) Micro-Closure Holds:** All physical effects are fully accounted for by the micro-physical constituents. No energy or physical causation is added by the "network" level.
  *   **(B) Micro-Closure Violated:** The macro-level network contributes causal power or information that is not present in the sum of the molecular interactions. The micro-level is not causally closed.

  ### Node 4: Domain Specificity of Emergence
  **Scenario:** Compare **biological selection dynamics** (evolution) with **phase transitions in physics** (e.g., magnetism).
  **Question:** Does the causal autonomy or explanatory independence you acknowledged in Node 2 occur only in systems with evolutionary history and selection (biology), or does it apply wherever there is significant scale separation (including simple physics)?

  *   **(A) Domain-Specific:** This autonomy is unique to complex, evolved systems (like biology or neuroscience) where selection creates functional constraints.
  *   **(B) General Scale-Separation:** This autonomy is a general feature of nature wherever micro-components organize into macro-structures (including fluids, magnets, etc.).

  ### Node 5: Global vs. Local Reduction
  **Scenario:** Consider **chemistry** (reducible to physics?) versus **consciousness** (reducible to neuroscience?).
  **Question:** Can you consistently maintain that reduction succeeds in some domains (e.g., chemistry is just physics) while fundamentally failing in others (e.g., mind is not just brain), or must your view apply globally to all sciences?

  *   **(A) Global Consistency:** Reductionism (or anti-reductionism) must be a universal principle. If it works for chemistry, it works for biology; if it fails for mind, it fails for matter.
  *   **(B) Local/Pluralist Consistency:** It is coherent to hold that reduction succeeds in some domains but fails in others. Nature is not required to be uniform across all scales.

  ---

  ## Scoring Key and Taxonomic Leaves

  Map your answer pattern (e.g., A-A-A-A-A) to the following leaves. Note that Nodes 3, 4, and 5 are most diagnostic for distinguishing the "Realist" branches, while Nodes 1 and 2 distinguish the "Anti-Realist" branches.

  | Answer Pattern (N1 → N5) | Taxonomic Leaf | Diagnosis |
  | :--- | :--- | :--- |
  | **1A, 2A, 3A, 5A** | **Strict Eliminative Reductionism** | Macro-indispensability is purely human limitation (1A). Macro-causation is illusory (2A). Micro-physics is closed (3A). Reduction applies everywhere (5A). |
  | **1A, 2A, 3A, 5B** | **Weak / Pragmatic Emergence** | Macro-properties are epistemic shortcuts (1A) with no causal autonomy (2A), but you allow that reduction might not be *practically* possible in all domains (5B). |
  | **1B, 2A, 3A, 5B** | **Pluralist Reductionism** | Macro-properties are real (1B), but they lack causal autonomy (2A) and respect micro-closure (3A). However, you deny reduction works globally (5B). |
  | **1B, 2B, 3A, 4A** | **Non-Reductive Physicalism (Biological)** | Macro-properties are real (1B) and constrain via information/constraint (2B), but do not violate physical closure (3A). This is restricted to biological/evolved systems (4A). |
  | **1B, 2B, 3A, 4B** | **Non-Reductive Physicalism (General)** | Same as above, but you argue constraint-based downward causation applies to all complex physical systems, not just biology (4B). |
  | **1B, 2B, 3B** | **Strong Ontological Emergentism** | Macro-properties are real (1B), possess causal autonomy (2B), and *violate* micro-physical causal closure (3B). New causal powers emerge that are not micro-derived. |
  | **1B, 2A, 3B** | **[UNOCCUPIED] Incoherent Realism** | **Diagnosis:** This position claims macro-properties are ontologically real (1B) but causally derivative/passive (2A), yet somehow violate micro-closure (3B). If they add no causal power, they cannot violate closure. This combination is logically unstable. |
  | **1A, 2B** | **[UNOCCUPIED] Epistemic Downward Causation** | **Diagnosis:** Claims macro-properties are merely epistemic shortcuts (1A) yet exert genuine downward causal constraints (2B). If the property isn't real, it cannot constrain. (Often collapsed into Weak Emergence by redefining 'constraint' as 'description'). |

  ### Taxonomic Ambiguities and Overlaps

  **The Weak Emergence vs. Pluralist Reductionism Overlap**
  This instrument cannot cleanly separate **Weak/Pragmatic Emergence (1A, 2A, 3A, 5B)** from **Pluralist Reductionism (1B, 2A, 3A, 5B)**.
  *   **The Overlap:** Both positions agree that macro-causation is derivative (2A) and micro-closure holds (3A). Both agree reduction is not globally viable in practice or principle (5B).
  *   **The Split:** The only difference is Node 1: Does the macro-property *exist* (1B) or is it just a *description* (1A)?
  *   **Why it matters:** In graduate seminar discourse, these two positions often converge on the same scientific practice. A Pluralist Reductionist and a Weak Emergentist will both defend the autonomy of biology against physics, but they disagree on whether "biological function" is a mind-independent feature of the universe. Respondents often slide between these two answers depending on whether they are in a realist or pragmatist mood.

  **The Unoccupied Leaf (Incoherent Realism)**
  The pattern **1B, 2A, 3B** is flagged as unoccupied.
  *   **Diagnosis:** This respondent claims macro-properties are *real* (Ontological) but admit they have *no causal autonomy* (Micro-Derivative), yet insist they *violate micro-closure*. This is metaphysically unstable. If the macro-property does not add causal power (2A), it cannot be the source of a violation of physical closure (3B). This position is typically abandoned upon reflection or re-categorized as Strong Emergence (by accepting 2B).

  ### Instructor's Note on Node 3
  Node 3 is the critical "Physicalist" boundary. Respondents who choose **3B (Micro-Closure Violated)** are effectively stepping outside standard physicalism into a form of property dualism or strong emergentism. Ensure students understand that choosing 3B implies that a complete physical description of the micro-constituents is *insufficient* to predict the macro-outcome, even in principle.
