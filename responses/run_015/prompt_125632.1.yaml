  hey—act like you're a senior philosopher who actually works on both Madhyamaka and analytic metaphysics, not someone who just skimmed a wikipedia article. think carefully and do a quick brainstorm first: what are the real conceptual stakes when Nāgārjuna's tetralemma (catuskoti) runs into modern talk about metaphysical grounding?

