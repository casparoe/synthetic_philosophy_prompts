  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Role:** Journalist covering science and ideas.
      *   **Topic:** The therapy/enhancement distinction in bioethics, specifically focusing on the "normal-function criterion" (therapy = restore to species-typical; enhancement = exceed species-typical).
      *   **Specific Problem:** The "baseline-drift problem." If an enhancement becomes widespread, it becomes the new normal, turning enhancement into therapy by definition. This makes the distinction unstable over time.
      *   **Constraint:** The editor wants a defended verdict (take a side), not a non-committal ending.
      *   **Tasks:**
          *   Weigh the baseline-drift problem against best replies (fixed reference point vs. instrumental/pragmatic view).
          *   Conclude whether the criterion can be salvaged or if it fails.
          *   If salvaged: Specify the modification and check if it abandons the core idea (objective/non-arbitrary).
          *   If failed: Identify surviving motivations and point to a different criterion.

  2.  **Deconstruct the Core Argument:**
      *   *The Normal-Function Criterion (NFC):* Therapy restores function to the species-typical range; Enhancement pushes beyond it.
      *   *The Baseline-Drift Objection:* Widespread enhancement shifts the "species-typical" range. Therefore, $X$ is enhancement at $T_1$ but therapy at $T_2$. The distinction is temporally unstable.
      *   *Reply 1 (Fixed Reference Point):* Anchor the baseline to a historical state (e.g., "natural" human capacity before biotech).
      *   *Reply 2 (Pragmatic/Instrumental):* The distinction is for policy (insurance, regulation), so it *should* track current norms.
      *   *Verdict:* I need to choose one path.
          *   *Path A (Salvage):* Argue for the Fixed Reference Point. *Risk:* It seems arbitrary and disconnected from current medical needs. Is "natural" human capacity even definable?
          *   *Path B (Failure):* Argue that drift proves NFC is incoherent for moral weighting. *Risk:* Need to offer an alternative or explain what survives.
          *   *Path C (Nuanced Failure/Shift):* Argue that NFC fails as a *moral* boundary but survives as a *statistical* description, requiring a shift to a "Well-Being" or "Autonomy" criterion for the actual ethical heavy lifting.

      *Decision:* The prompt asks to take the baseline-drift problem *seriously*. The drift problem is quite devastating for the NFC if the goal is a stable *moral* distinction. If therapy is "good/obligatory" and enhancement is "optional/permissible," having them swap places based on prevalence undermines the moral logic. The "Fixed Reference Point" reply usually collapses into the "Naturalistic Fallacy" or arbitrary line-drawing (which the prompt says the user is *less* interested in, but I must address). The "Pragmatic" reply admits the distinction isn't moral but administrative.
      *Strongest Verdict:* The baseline-drift problem shows the NFC cannot ground the *moral* weight proponents want. It confuses statistical normality with normative value. However, the *motivation* (preventing coercion, ensuring fairness) survives and points toward a criterion based on *need* or *well-being* rather than statistical averages.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be journalistic but philosophical. "The Shifting Line," "Moving Goalposts," "The Drift." Let's go with "The Moving Baseline."
      *   **Introduction:** Hook the reader with the promise of bioethics (fixing vs. improving). Introduce the Normal-Function Criterion (NFC). Introduce the Drift Problem (the "Red Queen" effect). State the thesis: The drift is fatal to the NFC as a moral compass, though not as a statistical descriptor. We must shift to a well-being-based criterion.
      *   **Section 1: The Appeal of the Normal.** Why do we like NFC? It feels objective. It distinguishes medicine (healing) from lifestyle (upgrading). It manages resources (insurance pays for illness, not upgrades).
      *   **Section 2: The Drift.** Explain the mechanism. Cognitive enhancers (Modafinil/Ritalin). If everyone takes them to work, is not taking them a disability? The classification flips. This makes the moral status of the act depend on popularity, which is absurd.
      *   **Section 3: Testing the Replies.**
          *   *Fixed Reference Point:* Anchor to year 1900? Or evolutionary history? Problem: Arbitrary. Why is *that* baseline the moral one? Also, "natural" capacity varies wildly already. This saves stability but sacrifices plausibility.
          *   *Pragmatic/Instrumental:* It's just for insurance triage. If everyone has it, insurance should cover it to keep people competitive. This admits NFC isn't about *morality* but *budgeting*. It concedes the moral high ground.
      *   **Section 4: The Verdict.** The drift proves NFC conflates "is" with "ought." Statistical frequency does not equal moral necessity. Therefore, NFC fails as a foundational ethical boundary.
      *   **Section 5: What Survives?** We still worry about coercion (arms races) and fairness (access). But these aren't solved by asking "Is this normal?" They are solved by asking "Does this increase well-being?" or "Is access equitable?"
      *   **Conclusion:** Final punch. The line doesn't just move; it dissolves. We need a new map.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "Fixed Reference Point" thoroughly? I need to make sure I explain *why* it fails to save the core idea. The core idea is an *objective* line. A fixed point is objective but arbitrary. Does that count as "abandoning the core idea"? Yes, because the core idea was that *current biological function* dictates moral status. Changing it to *historical* function changes the criterion from "Normal-Function" to "Historical-Naturalism."
      *   *Check:* Did I address the "Pragmatic" reply? This is the strongest counter. If the distinction is *only* for insurance, drift is fine. I need to argue that proponents *want* it to be moral (therapy is obligatory, enhancement is not), not just fiscal. If it's only fiscal, the "bioethics" distinction collapses into "accounting."
      *   *Tone:* Keep it analytical but accessible. Journalistic style.
      *   *Verdict:* I will argue the criterion *cannot* be salvaged for its intended moral purpose.

  5.  **Final Polish:**
      *   Ensure the transition from the drift problem to the verdict is smooth.
      *   Make sure the alternative criterion (Well-being/Need) is clearly distinguished from NFC.
      *   Check word count and flow. (Aim for ~1500-2000 words).

  6.  **Writing the Essay:** (Mental outline of the text to be generated)
      *   *Headline:* The Moving Baseline.
      *   *Intro:* The promise of the therapy/enhancement distinction. The NFC definition. The drift problem introduction.
      *   *Body 1:* Why NFC is attractive (objectivity).
      *   *Body 2:* The Drift in action (attention spans, height). The moral absurdity of popularity determining ethics.
      *   *Body 3:* The Fixed Baseline Reply. Why it fails (arbitrariness).
      *   *Body 4:* The Pragmatic Reply. Why it concedes too much (reduces ethics to accounting).
      *   *Conclusion:* NFC fails. Shift to Well-Being/Justice.

      *(Self-Correction)*: Wait, the prompt asks me to check if the modification "quietly abandoned the criterion's core idea of an objective, non-arbitrary line." If I argue for the Fixed Reference Point, is it non-arbitrary? No, choosing the year 2000 vs 1900 is arbitrary. So that modification fails the check. This reinforces the "Cannot be salvaged" verdict.

      *(Refining the Alternative)*: If NFC fails, what replaces it? A "Needs-Based" or "Well-Being" criterion. This focuses on whether the intervention alleviates suffering or promotes flourishing, regardless of statistical norms.

      *(Final Plan)*: Argue that the drift problem is fatal. The attempts to fix it either make the line arbitrary (Fixed Point) or admit it's not moral (Pragmatic). Therefore, we must abandon NFC for a Well-Being criterion.

  7.  **Final Review against constraints:**
      *   Journalist tone? Yes.
      *   Take a side? Yes (NFC fails).
      *   Weigh replies? Yes (Fixed & Pragmatic).
      *   Check modification/core idea? Yes (in the analysis of the replies).
      *   Identify surviving motivations? Yes (Fairness/Coercion).

      *Let's write.*
answer: |-
  **The Moving Baseline: Why the Therapy/Enhancement Distinction Cannot Hold**

  In the bioethical debates of the last thirty years, few concepts have worked as hard as the therapy/enhancement distinction. It is the border control of modern medicine. On one side lies therapy: the restoration of health, the domain of obligation, insurance coverage, and moral praise. On the other lies enhancement: the augmentation of capacity, the domain of consumer choice, out-of-pocket expense, and moral ambivalence. To keep this border secure, ethicists have largely relied on the "normal-function criterion." Therapy restores a function to the species-typical range; enhancement pushes it beyond.

  It is a clean, intuitive line. But as I have reported on the ground—watching cognitive enhancers move from niche labs to college campuses, and gene therapies edge toward designer applications—that line has begun to look less like a border and more like a horizon. It recedes as we approach it. This is the "baseline-drift problem." If a capacity like sustained attention is treated as an enhancement today, but the intervention becomes widespread enough to shift the species-typical range, that same intervention becomes therapy tomorrow. The classification of the act depends entirely on the date on which we ask the question.

  My editor has asked for a verdict: Is this drift a fatal flaw, or can the normal-function criterion be anchored? After weighing the objection against the strongest available replies, I conclude that the baseline-drift problem demonstrates that the normal-function criterion cannot ground the moral weight its proponents assign to it. It can be stabilized only by modifying it into something that abandons its core claim to objectivity, or by admitting it is merely an accounting tool rather than an ethical boundary. The distinction, as currently conceived, is untenable. We must look elsewhere for our ethics.

  **The Appeal of the Normal**

  To understand why the drift matters, we must understand why the normal-function criterion was so seductive in the first place. In a world of finite medical resources and boundless technological ambition, we needed a heuristic to decide what we owe each other. If a child cannot grow to a height that allows them to reach a shelf, is that a medical problem? If they cannot grow to a height that allows them to dunk a basketball, is that the same kind of problem?

  The normal-function criterion offered a way to say "yes" to the first and "no" to the second without appealing to subjective preferences. It claimed to be objective. It looked to biology, not ideology. "Species-typical" sounded like a fact of nature, immune to the vagaries of culture. If medicine's goal is to maintain or restore normal functioning, as Norman Daniels and other prominent theorists argued, then we have a clear mandate: fix what is broken relative to the species standard, and let the rest be the market's concern.

  **The Drift in Action**

  The baseline-drift problem exposes the fragility of that objectivity. Biological norms are not static laws; they are statistical aggregates. They change as the population changes.

  Consider the capacity for attention. In an information economy, the ability to focus for eight hours is increasingly vital. Suppose a safe pharmacological intervention emerges that allows the average user to sustain deep focus for ten hours. Initially, this is clearly enhancement. It pushes the user beyond the species-typical range. But suppose the competitive pressure of the labor market makes this drug ubiquitous. Within a generation, the "typical" attention span of the working population shifts. The new statistical norm is ten hours.

  Under the normal-function criterion, the drug has now transmuted. Administering it to a child to help them meet the demands of school is no longer enhancement; it is therapy, because it restores them to the new species-typical range. Withholding it might even be considered neglect.

  This leads to an ethical absurdity: the moral status of the intervention has flipped not because the drug changed, nor because the child's needs changed, but simply because *other people took it*. Popularity has determined morality. If the distinction between healing and improving is meant to track something deep about human welfare or the proper ends of medicine, it cannot be something that dissolves via market adoption. A moral boundary that moves based on prevalence is not a boundary; it is a trend line.

  **The Fixed Reference Point Reply**

  Proponents of the criterion have a ready reply to this instability: Anchor the baseline. We should not measure against the species-typical range *now*, but against the range at a fixed reference point—say, the biological capacities of humans prior to the advent of widespread biotechnology, or perhaps an evolutionary baseline.

  This modification stops the drift. If "normal" is defined as "natural human capacity in the year 1900," then the attention drug remains an enhancement forever, regardless of how many people take it.

  However, this salvage operation comes at a steep cost. It quietly abandons the criterion's core idea of an objective, non-arbitrary line derived from current biological reality. Why is the year 1900 the moral anchor? Why not 10,000 BCE? There is no biological justification for freezing the baseline at a specific historical moment. This turns the "normal-function" criterion into a "naturalistic" criterion, which relies on a controversial and often arbitrary definition of what is "natural."

  Furthermore, this fixed baseline severs the link between the criterion and the actual needs of the patient. If the world has changed such that a 1900-level attention span leaves a person unable to function in society, insisting that restoring them to that level is "therapy" while pushing them to the required level is "enhancement" makes the distinction irrelevant to human flourishing. It preserves the line by making it useless. The criterion was supposed to help us allocate resources to where they are needed; a fixed baseline forces us to ignore the needs created by the very environment we inhabit.

  **The Pragmatic Reply**

  A second reply concedes the drift but denies it is a bug. This view argues that the therapy/enhancement distinction was never meant to be a permanent moral boundary. It is a practical instrument for triage, insurance, and regulation. Instruments are allowed to track the state of the world. If the typical attention span shifts, insurance coverage should shift with it to ensure citizens remain competitive.

  This is the most robust defense, but it is also a surrender. It admits that the distinction is not about the *nature* of the intervention, but about *budgeting*. It reduces bioethics to accounting.

  If the distinction is merely pragmatic, it cannot carry the moral weight proponents usually place on it. We often argue that therapy is *obligatory* while enhancement is *optional*. We argue that enhancement risks creating coercive arms races, while therapy alleviates suffering. But if the line is purely pragmatic, then "obligation" is just a synonym for "what the budget currently covers." It offers no guidance on whether we *should* cover it, only that we do.

  Moreover, if the distinction is just a tool for regulation, it cannot solve the problems it was designed to address. The fear of enhancement is often that it will undermine fairness or human dignity. If the definition of enhancement shifts to accommodate whatever becomes common, the distinction loses its power to check those risks. It becomes a rubber stamp for the status quo. If everyone is enhancing, the distinction disappears, and with it, the ethical check on the practice.

  **The Verdict**

  The baseline-drift problem shows that the normal-function criterion conflates statistical frequency with normative value. It assumes that because a function is "typical," it is "good," and because it is "atypical," it is "optional." But history is replete with typical functions that are harmful (e.g., susceptibility to certain diseases in specific environments) and atypical capacities that are vital.

  Therefore, the normal-function criterion cannot be salvaged as a foundational ethical boundary. To stop the drift, one must either choose an arbitrary historical anchor (abandoning objectivity) or admit the distinction is merely fiscal (abandoning moral weight). Neither option preserves the core promise of the criterion: to provide a stable, biological basis for moral decision-making.

  **What Survives?**

  Does this mean we must abandon the concerns that motivated the distinction in the first place? No. The intuitions driving the therapy/enhancement debate are real and urgent. We worry about coercion (the "arms race" where parents feel forced to enhance children to keep up). We worry about fairness (the rich getting better brains than the poor). We worry about the medicalization of normal human variation.

  But these are not problems of *classification*; they are problems of *justice* and *well-being*.

  The surviving motivations point us toward a different criterion altogether: a **Well-Being and Justice Criterion**. Under this framework, we do not ask, "Is this intervention typical?" We ask, "Does this intervention alleviate suffering or promote flourishing?" and "Is access to this intervention distributed fairly?"

  If a cognitive drug helps a child succeed in a demanding school environment, the relevant question is not whether that child is being returned to a statistical mean. The question is whether the drug improves the child's life prospects without imposing undue risk, and whether other children are unjustly excluded from that benefit.

  This shift moves the burden from biology to ethics. It is harder work. There is no statistical table to consult. We must deliberate on values, risks, and equity. But this is the work bioethics was always meant to do. The normal-function criterion was a shortcut, an attempt to outsource moral reasoning to biology. The baseline drift reveals that biology will not take the call.

  **Conclusion**

  The therapy/enhancement distinction, grounded in the normal-function criterion, is a map that redraws itself every time we take a step. It promises a stable border between healing and improving, but the ground beneath it is always shifting. We should not try to nail the map to the floor with arbitrary historical anchors, nor should we pretend the shifting lines are merely administrative updates.

  We must accept that the line does not exist in nature. It exists in our values. By letting go of the normal-function criterion, we do not lose the ability to distinguish between necessary care and optional upgrade. We simply locate that distinction where it belongs: not in the statistics of the species, but in the welfare of the person and the justice of the society they inhabit. The baseline will always drift. Our commitment to human well-being should not.
