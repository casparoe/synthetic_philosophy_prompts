prompt: |-
  ok so im trying to map out what a theory of material constitution actually needs to do to count as adequate, especially since the classic statue-and-clay setup feels kind of stale. i want the full spec: what phenomena it must cover—not just Lump of Clay vs Statue, but also these newer edge cases like bio-sculptures made of living mycelium that replace their own cells every few weeks, or ceramics that get dissolved by rain and reprinted by an automated system. for each desideratum say why it's required, with the specific case behind it.

  make sure you cover:
  - the distinctions it can't colapse (same object vs same functional/artistic role, being made of the same matter vs being continuous in form)
  - the puzzles it has to dissolve or at least explain (gradual replacement vs sudden replacement, what happens if the clay is molded into a different statue and then back)
  - wether there are pairs of desiderata that look jointly unsatisfiable—like maybe you can't both require strict identity conditions and allow total material turnover without a break

  then briefly note how the usual suspects do against the list: the constitutionalist picture, the four-dimensional worm/perdurantist view, and a hylomorphic view. don't turn it into a full scorecard, just flag which ones clearly fail on which points.

  write it casual, like i'm asking in a seminar room. a typo or two is fine.
