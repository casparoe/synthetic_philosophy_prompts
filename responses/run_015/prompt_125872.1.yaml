      *   **Constraint 3 (Analysis):**
          *   Show how the case works.
          *   State target claim.
          *   Render in CT and TWI idioms.
          *   Derive verdicts (don't just announce).
          *   Identify the "load-bearing" feature.
          *   Test robustness (What if CT relation is transitive? What if TWI weakens S5?).
