answer: |-
  The rain in Harrow's Reach didn't fall so much as it hovered, a salt-heavy mist that settled into wool coats and wooden window frames. Inside the Methodist church hall, the air was warmer but no less damp. Five of us sat around a folding table that had seen decades of potlucks and now, for the last year, resettlement committees.

  There was only one file folder left open. Or rather, two files, competing for a single key to a single row house on Elm Street.

  On the left: The Karimi family. Father, mother, two children. From a nation where the state security apparatus had begun disappearing academics who questioned the official history. They had visas from the UNHCR. They fit the 1951 Convention definition perfectly. Persecution. Well-founded fear. A clear persecutor.

  On the right: The Solis family. Father, mother, three children. From a delta region where the aquifers had turned brackish and the rice paddies were now mud flats. They had no visas, only a humanitarian parole recommendation. No one was hunting them. The ocean was just rising. They were equally destitute, equally desperate, but they had no villain to name.

  "We have to pick the Karimis," said Sarah, tapping the left file. She was a retired immigration lawyer, sharp-eyed and weary. "It's the mandate. We are a resettlement agency. We resettle *refugees*. The Solis are climate migrants. It's a different legal category. If we blur that line, we risk our accreditation."

  "It's a line drawn in sand that's washing away," Marcus countered. He was younger, a teacher at the high school, his hands wrapped around a mug of tea that had gone cold. "Look at the photos. The Karimis are afraid of men with guns. The Solis are afraid of starvation because the water killed the soil. The outcome is the same. The urgency is the same. Why does a bullet grant you rights that a drought denies you?"

  "Because intent matters," Sarah said. "One is malice. The other is... circumstance."

  "Is it?" Marcus leaned forward. "Who burned the carbon that heated the water that drowned the Solis' fields? Us. This town. This coast. We have historic contribution here, Sarah. The regime persecuting the Karimis has nothing to do with us. But the Solis? We helped sink their home. Doesn't that create a duty that outweighs the legal definition?"

  I watched the steam rise from the coffee pot. I'd lived in Harrow's Reach all my life. I knew the Elm Street house. It needed a new roof. The town budget was strained; the sea wall down by the docks had cracked during the last king tide.

  "It's not just about duty," said Mrs. Gable, the third member of our trio. She ran the local food bank and knew exactly how many cans of beans were in the pantry. "It's about capacity. We have one house. Winter is coming. The Karimis have English skills. The father was a professor. The Solis were farmers. Their skills don't translate here. There are no farms left in this county, either. Too much salt in our own soil."

  She gestured to the window, where the gray Atlantic churned. "If we take the family we can't support, we fail them both. Is our duty to the abstract idea of justice, or to the people who actually sleep in the beds we provide?"

  "So it's a lottery based on employability?" Marcus asked, his voice tightening. "We save the ones who can fix our cars or teach our kids, and let the farmers drown because we don't grow rice?"

  "We save the ones we are equipped to save," Mrs. Gable said, not unkindly. "And we save the ones the world agrees are 'refugees.' If we start redefining the term, the funding dries up. Then no one gets saved."

  The room went quiet. The distinction hung in the air, sharp as a shard of glass.

  On one side: The source of harm. Did it matter that the Karimis were being *pushed* by a tyrant, while the Solis were being *pulled* by a rising tide? If a man is shot, he is a victim. If a man starves because the market crashed, he is unfortunate. If he starves because the sea rose, what is he?

  On the other side: The duty of the harbor. Did Harrow's Reach owe safety to the Karimis because we signed a treaty? Did we owe it to the Solis because our exhaust pipes warmed their air? Or did we only owe safety to the extent that our own floorboards were dry?

  "I move we sponsor the Karimis," Sarah said. "It's the safe path. It's the legal path."

  "It's the cowardly path," Marcus said.

  "It's the only path that keeps the door open for next year," Sarah replied.

  We voted. It was three to two. The Karimis would get the keys.

  I was the tie-breaker. I had voted for the Solis.

  When the meeting ended, the rain had stopped, leaving the streets slick and black. Marcus stayed behind to pack the files. He didn't look at me. Sarah shook my hand, her grip firm, her eyes apologizing without words. Mrs. Gable was already calculating the cost of winter coats for four people.

  I walked down to the harbor. The water was high, lapping against the concrete pilings. I thought about the Solis family, somewhere in a temporary camp, waiting for a letter that would now never come. I thought about the Karimis, who would sleep in a warm house but would carry the memory of men in black uniforms.

  I thought about our town. We were building a sea wall to protect our own homes from the same water that had taken the Solis' land. We were securing our perimeter against the very thing that made the Solis refugees.

  There was no victory in the choice. If I had voted the other way, the Karimis would be the ones left in the danger zone, and we would be fighting the government for funding, risking the program entirely.

  I stood by the railing and looked out at the horizon. The sea didn't care about the 1951 Convention. It didn't care about carbon footprints or political regimes. It just rose. And we, in our little coastal town, were left with a bucket and a vote, trying to decide which kind of drowning counted more.

  The distinction between persecution and catastrophe felt thinner than ever, yet the gap between them was wide enough to drive a life through. I turned back toward the town, the sound of the tide following me, unresolved, washing over the stones.
