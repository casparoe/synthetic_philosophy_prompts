      *   Avoid preaching. Let the arguments stand on their own merit.
      *   *Ending:* Needs to be ambiguous. Maybe they pick one, but the other file remains open on the table. Or maybe they realize the choice itself is the tragedy. Let's go with a vote that feels like a coin toss, leaving the "why" unresolved.

  7.  **Self-Correction during Drafting (Mental Check):**
