      *   **The Dilemma:**
          *   Family A: Fleeing targeted political persecution (classic refugee definition).
          *   Family B: Fleeing climate displacement (saltwater intrusion/farmland loss), equally destitute but no specific "persecutor."
      *   **Themes to Explore:**
          1.  *Definition of Refugee:* Source of harm (persecution) vs. Urgency of Need (destitution/survival).
          2.  *Community Duty:* Capacity (can we handle them?), Geographic Proximity (are they closer/further?), Historic Contribution (did we cause the climate harm?).
      *   **Format:** Short story.
      *   **Setting:** A coastal town similar to the user's.
      *   **Ending:** No tidy moral. Both distinctions must remain unsettled but sharper.

  2.  **Character & Setting Development:**
      *   *Setting:* "Oakhaven" (generic but evocative coastal town). Needs to feel worn, salty, practical. A community hall or church basement for the meeting.
      *   *Characters:* Need a small committee to debate.
          *   *Protagonist:* Elias. A local, maybe a teacher or retired fisherman. Observant, conflicted.
          *   *Character 1 (Legalist/Traditional):* Sarah. Focuses on rules, definitions, "the way things are done."
          *   *Character 2 (Humanitarian/Climate Justice):* Marcus. Focuses on need, responsibility, the bigger picture.
          *   *Character 3 (Pragmatist/Capacity):* Mrs. Gable. Focuses on resources, housing, jobs.
      *   *The Families:* Give them names to humanize them.
          *   *Persecution:* The Karimis (from a hypothetical authoritarian regime).
          *   *Climate:* The Solis (from a sinking delta region).

  3.  **Plot Outline:**
      *   **Beginning:** The meeting starts. Rain outside (pathetic fallacy, but keep it subtle). The file folders are on the table. One spot remains.
      *   **Middle (The Debate):**
          *   Sarah argues for the Karimis (legal definition, clear persecution).
          *   Marcus argues for the Solis (climate change is our fault, need is the same).
          *   Mrs. Gable brings up capacity (housing is tight, winter is coming).
          *   Elias listens, interjects with the local context (the town's own struggles).
      *   **Climax:** The vote or the moment of decision. It shouldn't be a unanimous "aha!" moment. It should be a difficult choice that leaves a residue.
      *   **Ending:** The aftermath. The choice is made (or deferred), but the questions linger. The physical setting reflects the unresolved tension.

  4.  **Drafting - Scene by Scene:**

      *   *Scene 1: The Room.* Establish the atmosphere. Coffee, damp coats, the files. Introduce the two cases.
      *   *Scene 2: The Argument.* Sarah pushes the "Convention" definition. Marcus pushes the "Moral" definition.
          *   *Key Dialogue:* "A bullet is faster than rising water, but the water wins in the end."
      *   *Scene 3: The Local Angle.* Mrs. Gable mentions the town's own flooding issues. This touches on *Capacity* and *Geographic Proximity*. If our town is sinking too, can we save others?
      *   *Scene 4: The Historic Contribution.* Marcus points out the carbon footprint. "We burned the carbon that drowned their fields."
      *   *Scene 5: The Decision.* They have to vote. Let's make it close. Let's make the winner feel like a loss.
      *   *Scene 6: The Aftermath.* Elias walks home. The sea is there. The questions aren't answered.

  5.  **Refining the Themes:**
      *   *Theme 1 (Source vs. Need):* Ensure both families are described as equally destitute. The Karimis have fear; the Solis have hunger/loss. Both are urgent.
      *   *Theme 2 (Duty):* Ensure the town's limitations are real. It's not just abstract morality; it's about the single vacant row house. Also, hint that the town's industry (fishing/tourism) contributes to the problem or is victimized by it.

  6.  **Writing - Focusing on Tone:**
