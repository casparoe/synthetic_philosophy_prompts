  **MEMORANDUM**

  **TO:** All Personnel
  **FROM:** Strategy & Org Design
  **SUBJECT:** Competency, Grading and Credit-Assignment Framework v4.2
  **DATE:** 1 October 2024

  **1.0 Grade Classification and Performance Baselines**

  1.1 **Darwinian Band:** Personnel in this band operate on hard-wired protocols. Performance improvement is not applicable at the individual level; optimization occurs exclusively across generational turnover. Training budgets are zero. Reliability is high; flexibility is null.

  1.2 **Skinnerian Band:** Personnel learn within a single lifetime via operant conditioning. Learning requires the incurrence of real consequences. Training budgets are denominated in actual losses (financial, reputational, or physical). Improvement is directly proportional to tolerated damage.

  1.3 **Icarian Band:** Personnel possess internal simulation capacity but lack veto authority over simulated outcomes. They model candidate actions beautifully but proceed to field trials regardless of model verdicts. They are salaried employees, not contractors, because their simulations do not prevent crashes. Budgets must cover both simulation costs and the real-world losses resulting from ignored simulations.

  1.4 **Popperian Band:** Personnel allow hypotheses to die in their stead. Internal screening replaces field trials. Sending a Popperian asset to a costly field trial is a misallocation of capital, as it wastes the distinguishing competence (internal veto) of the grade. Performance is measured by the ratio of internal deaths to external actions.

  1.5 **Gregorian Band:** Personnel derive competence from cultural artifacts (language, notation, procedures, software). Without these tools, the creature reverts to a lower grade (typically Skinnerian). Competence resides in the tool, not the host.

  **2.0 Mind-Tool Attribution Audit (MTAA)**

  2.1 To optimize equity distribution, the MTAA reassigns credit from the Gregorian host to the artifacts utilized. If a deliverable requires a spreadsheet, the spreadsheet is the competent party.

  2.2 Gregorian personnel are reclassified as hosting and maintenance costs for their tools. Performance reviews must be conducted in the physical presence of the tools that generated the output. If the tool is absent, the review is cancelled as there is no employee to review.

  2.3 Promotions and equity awards are assigned to the artifacts. Tools demonstrating high competence are retained; tools demonstrating failure are deprecated. The biological host is reusable with different tools.

  **3.0 Offsite and Teambuilding Protocols**

  3.1 During offsite events, all mind tools (laptops, phones, notebooks, procedural manuals) must be surrendered at check-in.

  3.2 Management should observe the degradation of Gregorian staff upon tool removal. Expect reversion to Skinnerian behaviors (random trial and error) or Icarian behaviors (confident planning followed by immediate failure). This is not a bug; it is a diagnostic feature confirming the locus of competence.

  3.3 Team-building exercises involving problem-solving without props are prohibited for Gregorian bands, as the absence of tools renders the task impossible for the biological component.

  **4.0 Icarian Compensation Structure**

  4.1 Icarian staff are paid a premium over Skinnerian staff despite higher loss rates. This compensates for the psychological burden of simulating success while experiencing failure.

  4.2 Unlike Popperians, Icarians do not learn from simulation crashes. They require real crashes to update behavior. Management must ensure sufficient liquidity to fund these real crashes without triggering insolvency.

  **5.0 Document Status and Authorial Audit**

  5.1 This document is a Gregorian tool. It constitutes a mind-extension artifact designed to scaffold organizational cognition.

  5.2 The author of this framework is subject to the MTAA. The insights contained herein belong to the framework format (numbered clauses, hierarchical logic), not the biological author. The author is the host cost associated with generating this tool.

  5.3 Future iterations of this framework should credit the template, not the drafter.

  ***

  **Forwarded Message:**
  **From:** J. Miller (Skinnerian Band)
  **To:** Strategy & Org Design
  **Subject:** Re: Competency, Grading and Credit-Assignment Framework v4.2

  I read the memo. I touched the stove to see if it was hot. It was hot. I learned. The spreadsheet did not touch the stove. The spreadsheet is not competent. I am. Please adjust equity accordingly.

  ***

  The audit reveals the author is merely a biological host for the formatting tools that generated this text, stripping him of authorial authority and reducing him to a Skinnerian organism who learned to type by hitting keys until letters appeared. \answer{Skinnerian}
