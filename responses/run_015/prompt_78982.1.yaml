answer: |-
  The Bureau of Allocation sat on the highest plateau of the island, where the air was thin enough to clarify thought but thick enough to preserve paper. Inside, Dr. Venn surveyed the stacks of Requirement Returns that had arrived from the coast. They were the lifeblood of the Republic, now that money had been abolished. Without prices to signal scarcity, the Bureau needed to know the physical trade-offs every enterprise faced.

  Each return was a confession of dependency. For every input—coal, hemp, steel—the manager had to declare how much output they would sacrifice if the Bureau reduced their allocation by a single unit. It was a map of marginal productivity, intended to let the Bureau allocate resources where they yielded the most physical good.

  Venn picked up the return from the Coastal Fishery Cooperative. The manager, Mara, had filed her statement on hemp canvas. She claimed that reducing her canvas allocation by ten meters would result in a loss of five hundred kilograms of caught fish, due to net degradation. Yet, in the margin, she had noted a request for extra canvas to repair warehouse roofs threatened by the coming monsoon.

  Venn frowned. He walked to the window. Below, the island stretched out, green and stubborn. The Bureau had abolished money to prevent profit from distorting production, but in doing so, they had removed the only language the island spoke fluently. Now, they spoke in tons and meters, translated through forms.

  The problem was human. Venn knew that Mara's career depended on meeting her quota. If she admitted that she could spare canvas without losing fish, the Bureau would take it away this year and reduce her baseline next year. So, every manager inflated the cost of forgone inputs. They claimed every scrap of material was critical. The aggregate picture that arrived at Venn's desk showed an island drowning in necessity, where every unit of canvas was simultaneously needed for nets, roofs, sails, and sacks. There was no surplus, only a universal, screaming deficit.

  Yet, physically, there was canvas lying idle in some warehouses while nets rotted in others. The data lied.

  Venn returned to his desk and opened the draft of the new directive. He could not force honesty, but he could simulate the pressure of scarcity. He began to compile the Valuation Schedule. It was not money—the Republic had sworn never to return to that idol—but it was a list of numbers assigned to every commodity.

  He looked at the hemp canvas data. Last year, the Fishery had reported a shortage, while the Grain Storage Unit had reported a glut. Yet, grain had spoiled under leaking roofs while fishery managers hoarded canvas they didn't immediately use. Venn calculated the deviation. He assigned canvas a high Accounting Value.

  The instruction accompanying the Schedule was precise. Managers were to treat these values as costs. They were to minimize the total Accounting Value of inputs used per unit of output. If the value of canvas rose, they were to economize on canvas, substituting other materials or accepting higher physical waste, until the marginal benefit equaled the new value. It was trial and error, mechanized. If there was a shortage next year, the Value would rise again. If a surplus, it would fall.

  Venn signed the document. It felt like printing a weather forecast and commanding the wind to obey.

  ***

  Three days later, the Valuation Schedule reached the coast. Mara sat in her office, the smell of salt and hemp heavy in the air. The rain had already begun, a steady drumming on the tin roof that echoed the anxiety in her gut. She unfolded the Bureau's directive.

  Canvas now carried a high Accounting Value. Higher than steel, higher than coal.

  The rule was clear: *Minimize cost.* If she used canvas now, she was charged heavily for it. To meet her efficiency targets, she should use less. She should let the nets wear thinner, or perhaps patch the warehouses with cheaper tin, despite the noise and condensation.

  Mara walked out to the yard. The fishing fleet was being prepared for the winter run. The nets were laid out on the wet grass, green and heavy. Some were frayed. She knew, with the tactile knowledge of twenty years at sea, that a net patched with tin clips would snag on the reefs. She knew that the specific weave of the hemp held the herring differently than the new synthetic blends. She knew that the monsoon this year was coming from the southeast, hitting the warehouse roofs at an angle that tin could not seal.

  None of this was in the Requirement Return. The Return asked for quantities and loss estimates. It did not ask for the feel of the wind or the brittleness of the fiber.

  If she followed Venn's numbers, she would divert canvas from the roofs to the nets. The Accounting Value said the nets were the higher use. But the Value was based on last year's data, when the roofs were sound. It did not know about the rot in the beams discovered yesterday. It did not know that the herring schools were running deeper this year, requiring stronger nets to haul them up.

  Mara went back inside. She had to file her response to the Schedule. She could comply, or she could appeal. If she appealed, she had to prove why the marginal product of canvas was higher than the Value suggested. But to prove that, she had to reveal her true capacity. If she admitted she could keep the nets strong with less canvas by working harder, the Bureau would note that efficiency and cut her allocation next year.

  So she was trapped. To get the canvas she needed for the roofs, she had to lie about the nets. To save the nets, she had to ignore the Price.

  She sat at her desk and picked up her pen. The Valuation Schedule sat to her left, a stack of crisp, authoritative paper. The Requirement Return form sat to her right, a grid of empty boxes waiting for truths that would be punished.

  Outside, the rain intensified. A drop leaked through the ceiling, landing on the inkwell with a soft *plip*, spreading a dark bloom across the paper. Mara watched the ink spread. The number Venn had printed for canvas was precise to two decimal places. It suggested a certainty that the island did not possess. It suggested that the scarcity of hemp was a static object, like a stone, that could be weighed and priced.

  But scarcity here was a process. It was the rot accelerating in the beam above her head. It was the crew chief shouting that the nets wouldn't hold the next haul. It was the time it took to send a messenger to the Bureau and wait for a reply, by which time the herring would have moved.

  Mara dipped her pen. She looked at the Valuation Schedule. It was not absurd. It was the best attempt anyone had made to bring sense to the chaos of needs without returning to the chaos of the market. It offered a common denominator. If she ignored it, she was defying the only coordination mechanism the Republic had. If she followed it, she might ruin the catch.

  She began to fill out the form. She listed the canvas needed for the nets. She listed the canvas needed for the roofs. She adjusted the marginal loss figures, inflating them just enough to secure the allocation, but not so much that the Bureau would suspect sandbagging. She played the game Venn had designed, knowing that her moves would distort the data Venn would use next year to set the Prices.

  The system would iterate. Next year, the Prices would adjust to the shortages she created today. They would converge, perhaps, toward an equilibrium. But an equilibrium of what? Of the reported numbers, or of the island itself?

  She blew on the wet ink to dry it. The wind rattled the window frame. There was a piece of canvas hanging over the door, meant to keep the draft out. It was old, patched with three different shades of hemp. It fluttered in the gust, slapping against the wood.

  Mara finished the form. She stacked it with the Valuation Schedule. The numbers on the Schedule remained unchanged, pristine and absolute. The canvas outside continued to flap, wet and heavy, responding to a wind that no Bureau could measure.
