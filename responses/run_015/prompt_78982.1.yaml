      *(Self-Correction during drafting)*: Make sure I don't lecture. The theory must be embedded in their actions. Venn shouldn't think "Hayek was wrong." He should think "The data lags." Mara shouldn't think "Incentive compatibility." She should think "If I ask for less, they cut me."

