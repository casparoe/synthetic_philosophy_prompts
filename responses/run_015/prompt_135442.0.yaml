answer: |-
  Here is my position, stated as tightly as I can manage, followed by the application to your cases, the repair of your principle, and the specific inconsistency I believe you are harboring.

  ### The Account: Level-Relative Dispositionalism

  **Probability is a dispositional property of a physical system, relative to a specific level of description, to produce outcomes distributed according to a measure $\mu$.**

  This account has three clauses:
  1.  **Ontology:** Probabilities are real, single-case properties (dispositions/propensities) of token setups. They are not frequencies, nor are they merely beliefs.
  2.  **Relativity:** The attribution of a probability is relative to a *level of description* (micro-physical, macro-physical, model-based). A system may have a probability of 0.5 at the macro-level (coin toss) and 0 or 1 at the micro-level (deterministic trajectory), and both claims are true relative to their levels.
  3.  **Anchoring:** A probability claim is *anchored* (objective chance) if the disposition is grounded in the causal structure of the system such that an agent's ignorance is not the *source* of the probability, but merely the *reason for accessing it*. A claim is *unanchored* (objective credence) if the probability arises solely from the agent's epistemic constraints (symmetry of evidence) in the absence of a known causal disposition.

  **Where it runs out:** This account runs out at the boundary of *causal structure*. Where there is no causal mechanism (e.g., pure mathematics, case iv) or where the causal mechanism is fully known and deterministic *at the relevant level of description* (e.g., a calculated orbit), there is no chance, only truth or falsity.

  **My weakest clause:** Clause 2 (Relativity). The criteria for selecting the "relevant level of description" are pragmatic and not fully fixed by physics alone. I would abandon this account if it were demonstrated that macro-level probabilities (like thermodynamics or coin tosses) are *reducible without remainder* to micro-level certainties in a way that makes the macro-probability merely a shorthand for ignorance, rather than a robust emergent property. (i.e., if Reductionism is proven strictly true in a way that eliminates emergent dispositions).

  ---

  ### Testing Your Cases

  Here is how Level-Relative Dispositionalism verdicts your cases, and where it demands you change your mind.

  **(i) Machine-tossed coin.**
  *Verdict:* **Anchored Chance (Macro-Level).**
  *Reasoning:* The setup has a causal disposition to produce 50/50 outcomes relative to the macro-description (launch energy, angular momentum) because the mapping from parameter space to outcome is measure-preserving and mixing. The determinism at the micro-level is irrelevant because the *relevant level of description* for "coin tossing" is the macro-control level.
  *Accommodates your verdict:* Yes.

  **(ii) U-238 Nucleus.**
  *Verdict:* **Anchored Chance (Micro-Level).**
  *Reasoning:* This is a fundamental disposition. Unlike the coin, there is no deeper level (currently) where this is deterministic. It is a fact about the nucleus.
  *Accommodates your verdict:* Yes.

  **(iii) Die with delayed bias.**
  *Verdict:* **Anchored Chance (Time-Indexed).**
  *Reasoning:* The disposition is a function of time $P(t)$. At $t=0$, the disposition is $1/6$. The "reference class" problem is solved by specifying the *causal history* of the token die. The career-long frequency is irrelevant because the disposition changes; the long-run frequency aggregates two different dispositions.
  *Accommodates your verdict:* Yes. It explains *why* the frequency doesn't move you: the frequency sums over non-identical dispositions.

  **(iv) Googol-th Digit.**
  *Verdict:* **Unanchored Credence.**
  *Reasoning:* There is no causal disposition in the number $\pi$ (or the Champernowne constant) to produce digits. The digits are fixed. Your betting odds are rational constraints based on the *symmetry of your evidence* (you know it's normal, but not the value). This is objective Bayesianism, not chance.
  *Accommodates your verdict:* Yes.

  **(v) Five-sigma excess.**
  *Verdict:* **Mixed.**
  *Reasoning:* $P(Data|H_0)$ is an **Anchored Chance** relative to the statistical model (the model has a disposition to generate fluctuations). $P(H_0|Data)$ is **Unanchored Credence**. You are correct that it is not merely "personal taste"; it is constrained by the rational requirement to update on the anchored likelihood. However, without a prior grounded in a disposition (e.g., a frequency of true theories), it cannot be a "fact about the world" in the same way.
  *Accommodates your verdict:* Mostly. It clarifies that the discomfort comes from trying to treat an epistemic constraint as an ontic fact.

  **(vi) The Unrepeatable (Ice Sheet/Fault).**
  *Verdict:* **Anchored Chance (Macro-Level).**
  *Reasoning:* **Here I overturn your verdict.** You claim there is no chance because there is no ensemble of Earths. But you accepted chance in the coin toss (i) despite it being a single token event at a specific time, grounded in deterministic dynamics. The Ice Sheet is a complex physical system with a causal structure. It has a disposition to collapse under specific forcing. The fact that we cannot repeat the *century* does not mean the *disposition* is absent. The probability 0.02 is a claim about the strength of the causal tendency of the climate system, grounded in physics, not just a feeling.
  *Why:* If you deny chance here but accept it in (i), you are distinguishing based on *complexity* or *fundamentality*, not on the logic of chance. If a coin can have a deterministic chance, a climate system can too.

  **(vii) The Settled Past.**
  *Verdict:* **Unanchored Credence.**
  *Reasoning:* The causal process has terminated. The disposition has collapsed into a fact (rained or didn't). Your "probability" is a measure of the reliability of the records (a causal chain of evidence), not a chance of the event itself. The reference class sensitivity troubles you because you are looking for an anchor in the *event*, but the anchor is in the *evidence*.
  *Accommodates your verdict:* Yes, with clarification on the source of the swing.

  **The Ensemble Case (Climate Models).**
  *Verdict:* **Anchored Chance (Model-Level) $\rightarrow$ Unanchored Credence (World-Level).**
  *Reasoning:* The 0.7 is an **Anchored Chance** *of the model ensemble*. It is a fact about the simulation setup. When applied to the Earth, it becomes **Unanchored Credence**, constrained by how well the model captures the Earth's dispositions. It is not "up for grabs" because the model calculation is objective, but it is not a "world chance" because the ensemble is artificial.
  *Resolution:* This explains why reweighting feels wrong (it breaks the model's internal logic) but also why it's not a direct fact about 2100.

  ---

  ### Repairing Your Principle

  Your friend is half-right: your original principle *was* stapled. The "Anchoring" condition relied on "repeated realizations," which is frequentist clothing on a propensity body. This is why you struggled with (vi).

  **The Repair:**
  Replace *"whose repeated realizations would be to good approximation independent and identically distributed"* with *"whose causal structure generates an invariant measure over the outcome space."*

  1.  **Why this repairs (iii):** It focuses on the *structure* at the time of the roll, not the long-run history. The bias mechanism changes the structure, hence changes the measure.
  2.  **Why this repairs (vi):** It allows single-case systems to have chances if their causal structure (physics + boundary conditions) determines a measure over possible futures, even if temporal repetition is impossible.
  3.  **Why this saves "Objectively Constrained Credence":** It clarifies that when the causal structure is unknown or fixed (cases iv, vii), the "constraint" comes from the *symmetry of the evidence* (Maximum Entropy), which is objective logic, not subjective taste.

  This removes the "disease" of requiring actual repetition (which fails single cases) while keeping the "cure" of requiring physical grounding (which prevents subjectivity).

  ---

  ### The Inconsistency: (ii) vs (vi)

  You suspect you are holding something inconsistent here. You are.

  *   **In (ii)**, you accept a single-case probability for a nucleus because it is a "fact about that nucleus."
  *   **In (vi)**, you reject a single-case probability for an ice sheet because "there is no set-up of which this century is one realization."

  **The Contradiction:**
  If the nucleus is a single token without a long run *of itself*, why is it a chance? You say the long run of *other* nuclei is evidence, not meaning. Apply this to the Ice Sheet. The long run of *other* climate simulations (or paleo-climate epochs) is evidence, not meaning. The meaning should be the disposition of *this* system.

  By accepting (i) (deterministic chance), you have already conceded that *repeatability* is not essential for chance; *sensitive dependence on a measure* is. The Ice Sheet system is sensitive to initial conditions (butterfly effect). It has a phase space. It has a measure. To deny it chance while granting it to the coin is to privilege *simple* deterministic systems over *complex* ones, which is a pragmatic distinction, not an ontological one.

  **My Recommendation:** Surrender the verdict on (vi). Accept that the Ice Sheet has a macro-physical chance. It preserves the unity of your account: Probability is always a disposition of a setup. Sometimes the setup is quantum (ii), sometimes mechanical (i), sometimes climatic (vi). The difference is the *precision* with which we can calculate the measure, not the *existence* of the measure.

