answer: |-
  ### Designer's Notes: The Logical Space
  *(Read this after you've run the quiz if you want to know why the questions are built this way)*

  **The Map:**
  We are sorting based on three axes:
  1.  **Aggregation:** Do you sum up probabilities (MEC) or pick a winner (MFT/Objectivist)?
  2.  **Risk:** Do you fear the worst outcome disproportionately (Minimax) or treat probability linearly (MEC)?
  3.  **Metaphysics:** Do you think uncertainty changes the action (all except Objectivist)?

  **Indistinguishable Leaves:**
  *   **MFT vs. Objectivist:** In many concrete cases, "Go with your highest credence theory" and "Act on the balance of evidence because there is only one truth" result in the exact same choice. This quiz separates them based on *how* they justify the choice (e.g., Q6 & Q8), but if a player picks the "Action" without reading the "Reasoning," these two buckets may blur.
  *   **MEC vs. Minimax:** When the "worst case" is also the "highest expected disvalue," these two look identical. They only separate when a low-probability catastrophe has lower *expected* value than a high-probability minor harm (tested in Q4).

  **Incoherent Combos:**
  *   **The "Cautious Fanatic":** If someone scores high on **Minimax** (avoid worst case) but rejects the **Fanaticism** question (Q4), that is logically tense. Minimax usually *requires* accepting fanaticism (letting a tiny chance of infinity dominate). I've flagged this in the scoring key as a "Tension" result.
  *   **The "Compromising Absolutist":** If someone chooses **Parliament** (split the difference) but also chooses **Objectivist** answers (uncertainty doesn't matter), that's incoherent. You can't compromise between views if you think only one view is actually real.

  ***

  # The "What Do I Actually Do?" Moral Uncertainty Quiz

  **Instructions:** Read the scenario. Pick the reaction that feels most like what you would *actually* do, not what sounds smartest. There are no right answers, only different ways of getting stuck.

  ### 1. The Shrimp Paste (Roommate Case #1)
  You're cooking dinner. You're about 70% sure shrimp don't feel pain in a morally relevant way, but there's a solid 30% chance that factory-farmed shrimp suffer horribly. The paste makes the dish amazing.
  *   **A.** Eat it. 70% is the majority; I'm not letting a minority doubt ruin my dinner.
  *   **B.** Don't eat it. Even 30% chance of torture is too high a risk to take for a condiment.
  *   **C.** Eat half a serving, or buy the expensive "humane" shrimp just in case.
  *   **D.** Calculate it: If the suffering is bad enough, 30% of it outweighs 100% of my taste pleasure. If the math says don't eat, I don't eat.

  ### 2. The AI Companion (Roommate Case #2)
  You built a chatbot for your kid. It costs $50/month in server fees. You're 90% sure it's just code, but 10% worried it might be sentient.
  *   **A.** Delete it. It's almost certainly not alive, and $600/year is real money for good causes.
  *   **B.** Keep it. 10% chance of murdering a mind is worse than losing $600.
  *   **C.** Keep it, but move it to a cheaper server and limit its hours to reduce the risk/cost ratio.
  *   **D.** Look at the expected value: 10% of a "life" is worth way more than $600. The math says keep it.

  ### 3. The Factory Job (Roommate Case #3)
  You're offered a well-paid job streamlining a factory farm. You're mostly convinced (say, 80%) that animal exploitation is permissible, but you have a nagging 20% doubt that it's a moral atrocity.
  *   **A.** Take the job. My best judgment says it's fine, and I need the money.
  *   **B.** Decline the job. I can't risk being 20% complicit in an atrocity.
  *   **C.** Take the job, but donate 50% of the salary to animal welfare charities to offset the risk.
  *   **D.** Take the job only if the *expected* good of my salary (donated) outweighs the *expected* harm of the production.

  ### 4. The Pascal's Mugger (The Fanaticism Test)
  A stranger tells you: "Give me $5, or there's a 1 in 1 billion chance I will destroy a parallel universe with a trillion beings." You think he's almost certainly crazy, but you can't be 100% sure.
  *   **A.** Give the $5. A trillion lives times even a tiny probability is bigger than $5.
  *   **B.** Walk away. That probability is negligible; I'm acting on the most likely reality (he's crazy).
  *   **C.** Give him $1. A compromise between "he's lying" and "he's dangerous."
  *   **D.** Call the cops. The worst-case scenario is he's dangerous, so I neutralize the threat.

  ### 5. The Charity Split (The Compromise Test)
  You have $1,000 to donate. 50% of your brain thinks you should save human lives (Charity A). 50% thinks you should save animal lives (Charity B).
  *   **A.** Flip a coin and give it all to one. I need to pick a winner.
  *   **B.** Give $500 to each. Both theories get some of what they want.
  *   **C.** Give it all to the one where the dollar saves the *most* lives, regardless of species.
  *   **D.** Give it all to Charity A because I'm slightly more confident humans count more.

  ### 6. The Research Rabbit Hole (The Effort Test)
  You're unsure if a new technology is harmful. You could spend 100 hours researching to be more sure, or just decide now.
  *   **A.** Research until I find the Truth. There is a fact of the matter, and I need to know it.
  *   **B.** Research until the cost of my time outweighs the expected benefit of being more right.
  *   **C.** Research until I can rule out the catastrophic worst-case scenario.
  *   **D.** Don't research. I'll just act on my current best guess and adjust later if needed.

  ### 7. The Three-Way Tie (The Parliament Test)
  You're equally split (33% each) between three views: 1. Help Family, 2. Help Strangers, 3. Help No One (Libertarian).
  *   **A.** Help Family. It's my default, and no other theory has a stronger claim.
  *   **B.** Do a bit of each. Help family a little, donate a little, keep the rest.
  *   **C.** Help Strangers. It has the highest potential upside if that theory is right.
  *   **D.** Help No One. It's the only option that guarantees I don't violate anyone's rights (safest floor).

  ### 8. The "Just Knows" (The Objectivist Test)
  Your friend says, "We can't know if abortion/euthanasia/taxation is wrong, so we should do nothing." You feel strongly that one side is actually correct.
  *   **A.** They're right. Uncertainty means we should pause or compromise.
  *   **B.** They're wrong. Uncertainty is just ignorance. I should do what is actually right, not what feels safe.
  *   **C.** They're partially right. I should act on my best guess, but acknowledge I might be wrong.
  *   **D.** They're wrong. I should weigh the probability of being right against the stakes of being wrong.

  ***

  # Scoring Key

  Tally up which letter you picked most often.

  **Mostly A's: The "My Favorite Theory" Decisive**
  *   **The Vibe:** "I have to pick a lane."
  *   **The Logic:** You treat moral uncertainty like a voting election. Whichever theory has the highest credence (>50% or just the plurality) gets to drive the car. You don't let minority doubts paralyze you.
  *   **Blind Spot:** You might ignore high-stakes risks just because they are statistically unlikely (see Q2).

  **Mostly B's: The "Play It Safe" Precautionary Principle**
  *   **The Vibe:** "Not worth the risk."
  *   **The Logic:** You are a Minimax regulator. You look at the worst possible outcome of each action (e.g., murder, atrocity) and avoid it, even if the probability is low.
  *   **Blind Spot:** You might become paralyzed by remote possibilities (Pascal's Mugging) or miss out on huge goods because you're too focused on avoiding bad.

  **Mostly C's: The "Moral Parliament" Compromiser**
  *   **The Vibe:** "Let's make everyone happy."
  *   **The Logic:** You try to satisfy all your moral credences proportionally. If you're 50/50 on two theories, you do 50% of what each wants. You view your mind as a coalition government.
  *   **Blind Spot:** Sometimes compromise is impossible (you can't murder someone "a little bit"), and this approach can lead to incoherent actions that satisfy no one fully.

  **Mostly D's: The "Expected Value" Accountant**
  *   **The Vibe:** "Let's run the numbers."
  *   **The Logic:** You treat moral uncertainty exactly like factual uncertainty. You multiply Probability × Magnitude of Good/Bad (Choiceworthiness). You are willing to accept high risk for high reward, or low risk for low reward, based on the math.
  *   **Blind Spot:** You might end up as a "Fanatic" (Q4), letting a tiny chance of infinity dictate your life, which feels intuitively crazy to most people.

  **Mostly E's (or a mix of A & B on Q6/Q8): The "Truth Seeker" Objectivist**
  *   **The Vibe:** "Uncertainty is just a lack of data."
  *   **The Logic:** You deny that uncertainty changes the *normative* landscape. There is one right thing to do. Your job is to find it, not negotiate with your doubts. You act on the balance of evidence as if it were fact.
  *   **Blind Spot:** You might underestimate the value of hedging. If the "Truth" turns out to be the minority view, you have no backup plan.

  ***

  # Mixed Results & Tensions

  **The "Cautious Fanatic" (High B on Q1/Q2, but High A on Q4)**
  *   **Diagnosis:** You want to avoid worst-case scenarios in real life (shrimp/AI), but you reject the logic when it gets abstract (Pascal's Mugger).
  *   **Verdict:** This is a common, psychologically healthy inconsistency. Strictly logically, if you avoid the 10% AI risk, you should also avoid the 1-in-a-billion universe risk. You are likely a **Pragmatic Minimax** rather than a theoretical one.

  **The "Decisive Objectivist" (High A on Actions, High B on Q6/Q8)**
  *   **Diagnosis:** You pick the majority view (A) but justify it by saying "Uncertainty doesn't matter, truth does" (B).
  *   **Verdict:** You are functionally identical to the **My Favorite Theory** person, but you have stronger metaphysical convictions. In a dinner debate, you will argue with the MEC person about whether probabilities exist, while you both order the same dish.

  **The "Parliamentarian Absolutist" (High C on Actions, High B on Q6/Q8)**
  *   **Diagnosis:** You want to compromise between views (C) but also believe there is only one Truth (B).
  *   **Verdict:** **Incoherent.** If there is only one moral truth, compromising with a false theory is a mistake, not a virtue. You are likely using "compromise" as a heuristic for "I don't want to offend my friends," not as a moral strategy.

  **The Indistinguishable Pair: My Favorite Theory vs. Objectivist**
  *   **Diagnosis:** If you scored high A's and high B's on the justification questions.
  *   **Verdict:** This quiz cannot definitely separate you. In practice, you both do the same thing (follow the highest credence). The only difference is whether you think you're "guessing" (MFT) or "deducing" (Objectivist). For the purpose of the dinner club, you are allies.
