      *   *Correction on Case C:* Botched help. Buddhism emphasizes wisdom (*paññā*). Ignorance isn't an excuse if one *should* have known. *Cetanā* includes the volition to investigate.
      *   *The "No-Self" point:* The user mentioned it. It's often a cop-out. If there is no self, suffering is still real. Compassion (*karuṇā*) requires acknowledging suffering. I should include a row on this.

