  *(Self-Correction during drafting the response)*: I need to be careful not to present Mahayana (Bodhisattva) ideals as identical to Early Buddhism (Pali Canon), as the user specified "early Buddhist texts." However, the "Better Act" question often pushes toward Bodhisattva ethics. I will stick primarily to Early Buddhism but note where the tension lies.

