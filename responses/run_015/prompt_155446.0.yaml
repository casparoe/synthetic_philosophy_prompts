answer: |-
  This is an exceptionally precise framing of a collision that occurs frequently when modern ethical frameworks meet soteriological ones. Your interlocutor is leveraging a textual truth (*cetanā* is kamma) to defend a normative conclusion (outcomes don't matter) that does not necessarily follow.

  The confusion rests on equivocation between **Karmic Merit** (what ripens for the agent), **Moral Rightness** (what one ought to do), and **Worldly Welfare** (what happens to others). Early Buddhism is sophisticated enough to distinguish these, though popular piety often collapses them.

  Here is the menu of readings hidden inside the sentence "Buddhism is about intentions, not consequences," structured as you requested.

  ### The Menu of Readings

  | Reading | Precise Thesis | Status | Supports Interlocutor? | Implications for Cases (A, B, C) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Karmic Mechanism** | *Cetanā* (volition) is the specific cause that ripens as future experience for the agent; worldly outcomes are separate conditions. | **Textually Accurate.** This is the literal meaning of AN 6.63 ("Intention, I tell you, is kamma"). | **No.** It explains how *merit* is generated, not whether one should ignore worldly outcomes. | **Merit:** A (High), B (Low/Negative), C (Mixed).<br>**Better Act:** Undetermined by this thesis alone. |
  | **2. The Locus of Control** | An agent is only morally responsible for what is fully within their control (the mind); outcomes depend on external conditions. | **Substantive & Defensible.** Similar to Stoicism; protects against despair over uncontrollable results. | **Partially.** Supports ignoring *anxiety* about outcomes, but not ignoring the *choice* of action based on likely outcomes. | **Merit:** A (High), B (Low), C (High).<br>**Better Act:** A is safe; B is risky for the mind; C is excusable. |
  | **3. The Soteriological Priority** | The ultimate goal is liberation from suffering, not the amelioration of worldly suffering; thus, mental purity outweighs worldly utility. | **Defensible (Early Canon).** The Buddha often prioritized liberation over social reform. | **Yes.** This is the strongest philosophical ground for the interlocutor's claim. | **Merit:** A (High), B (Low), C (High).<br>**Better Act:** A is best (purifies mind); B is dangerous (binds to samsara). |
  | **4. The Wisdom Requirement** | A "skillful" (*kusala*) intention requires accurate knowledge of causes and effects; ignorance negates skillfulness. | **Defensible.** Right View (*sammā-diṭṭhi*) precedes Right Action. Blind goodwill is not enough. | **No.** Directly contradicts the claim that auditing outcomes is "contamination." | **Merit:** A (Moderate), B (Low), C (Low/Negative due to negligence).<br>**Better Act:** B (if intention corrected); C is a failure of wisdom. |
  | **5. The Precept Constraint** | The precepts prohibit specific *actions* (killing, stealing), not just states of mind; consequences for others are intrinsically relevant. | **Textually Accurate.** The Vinaya and Precepts focus on bodily/verbal acts, not just mental states. | **No.** Shows that Buddhism cares about bringing things about (e.g., not bringing about death). | **Merit:** A (High), B (High/Low split), C (Negative if harm violates precepts).<br>**Better Act:** B is required; C is forbidden. |

  ### Detailed Implications for Your Cases

  To clarify the "Merit" vs. "Better Act" column above, here is how the readings apply to your specific scenarios:

  **Case A: The Overstaffed Food Bank**
  *   **Merit (Karmic Fruit):** High. The volition was generous. The mind was purified.
  *   **Better Act (EA/Utilitarian):** Poor. Resources (time) were allocated inefficiently.
  *   **Buddhist Nuance:** Under Reading 4 (Wisdom), this might be considered *less* meritorious than it appears. If you knew you were useless there and went anyway to feel good, the volition is subtly self-centered. If you didn't know, it is innocent but ignorant.

  **Case B: The Resentful Administrator**
  *   **Merit (Karmic Fruit):** Low or Negative. The volition is rooted in aversion (*dosa*) and shame, not generosity. This plants seeds for future suffering for the agent.
  *   **Better Act (EA/Utilitarian):** High. The clinic stays open; suffering is reduced for dozens.
  *   **Buddhist Nuance:** This is the crux of the collision. EA says B is the moral choice. Reading 3 (Soteriological Priority) says A is the moral choice. Reading 5 (Precepts) suggests B is *obligatory* (saving life), but the agent must work on their resentment to avoid karmic poison.

  **Case C: The Botched Help**
  *   **Merit (Karmic Fruit):** Mixed. The root volition was good, but the lack of wisdom (*paññā*) is a defect in the Eightfold Path.
  *   **Better Act (EA/Utilitarian:** Negative. Harm was caused.
  *   **Buddhist Nuance:** The Buddha criticizes actions that cause harm even if unintended, if they stem from negligence. In the *Canki Sutta*, the Buddha argues one should not protect a false view or action just because "it is my tradition" or "I meant well." Consequences *do* provide feedback on the quality of one's wisdom.

  ### What People Mean vs. What They Need

  **What they usually mean:**
  When laypeople or even teachers say "Buddhism is about intentions, not consequences," they are usually invoking **Reading 1 (Karmic Mechanism)** mixed with **Reading 2 (Locus of Control)**.
  *   *Comfort:* It is meant to alleviate guilt over things outside one's control.
  *   *Correction:* It is meant to correct the view that "good outcomes justify evil means" (e.g., killing to save five).
  *   *Usage:* It is a therapeutic heuristic, not a rigorous ethical framework.

  **What their argument needs:**
  Your interlocutor is trying to make a normative claim about **resource allocation** (whether to audit outcomes). To support the claim that "a Buddhist ought not to compare candidate actions by expected effects," they need **Reading 3 (Soteriological Priority)**.
  *   *The Gap:* Reading 3 only works if the *only* goal is the agent's liberation. If the agent accepts the Bodhisattva ideal (or even the lay duty of *metta*/compassion), Reading 3 fails. Compassion (*karuṇā*) is the wish for others to be free from suffering. You cannot genuinely wish for others to be free from suffering while refusing to check if your actions actually reduce their suffering.
  *   *The Verdict:* The interlocutor's argument is **false or confused** in the context of engaging with the world. While *karmic merit* is determined by intention, *skillful action* (*kusala kamma*) requires wisdom, and wisdom requires understanding consequences.

  ### The Synthesis for an EA-Buddhist

  The collision resolves if you distinguish the **Karmic Ledger** from the **Compassionate Mandate**.

  1.  **Karmic Ledger:** You are the owner of your volition. You cannot control the world, only your mind. In this narrow sense, the interlocutor is right: you do not accrue *bad kamma* simply because the world is complex and outcomes fail (Case C), provided your volition was pure and diligent.
  2.  **Compassionate Mandate:** You are not the owner of the world, but you are a condition within it. To act with *metta* (loving-kindness) is to act for the welfare of others. If you refuse to audit outcomes (EA), you are acting blindly. Blindness is ignorance (*avijjā*). Ignorance is the root of suffering. Therefore, refusing to audit outcomes is arguably *unskillful* (Reading 4).

  **Conclusion:** The sentence "Buddhism is about intentions, not consequences" is a **platitude regarding karmic ownership**, but a **falsehood regarding ethical diligence**. A Buddhist *should* care about consequences, not because consequences determine their karmic fruit, but because wisdom about consequences is a prerequisite for the intention to be truly "skillful" (*kusala*). Your interlocutor is using a truth about *vipāka* (ripening) to silence a requirement for *paññā* (wisdom).
