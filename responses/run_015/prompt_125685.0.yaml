answer: |-
  The core of your puzzle lies in the difference between the *physics* of the ordeal (sleep deprivation, stress, memorization) and the *teleology* of the ordeal (what the institution claims the pain is *for*). Your brother is correct that the physical experiences are often indistinguishable. The university's distinction rests entirely on who owns the loyalty that the ordeal purchases.

  Here is the reconstruction of what the institutional practice presupposes, where the theories diverge, and what the failure modes look like.

  ### 1. What the Practice Presupposes: Instrumental vs. Expressive Suffering

  The university's policy strictly requires the belief that suffering can be categorized into two types: **Instrumental** and **Expressive**.

  *   **Instrumental Suffering (ROTC/Sports):** The pain is framed as a byproduct of acquiring a skill necessary for an external mission (defending the state, winning games). The sleep deprivation is "simulated combat stress"; the yelling is "command presence training." The institution presupposes that the ordeal is a *pedagogical tool*. Even if the task is arbitrary (memorizing trivia), it is justified as "attention to detail under pressure."
  *   **Expressive Suffering (Fraternities):** The pain is framed as an end in itself, serving only to mark the boundary between member and non-member. The institution presupposes this is *tribal maintenance*.

  **The Presupposition:** The practice requires the belief that the *meaning* of the pain is determined by the authority authorizing it, not the sensation of the pain itself. By sanctioning the ROTC weekend, the university is not saying "this doesn't hurt"; it is saying "this hurt belongs to us."

  This explains the strength of the reaction. If a fraternity does it, they are stealing the university's monopoly on legitimate violence/suffering. They are creating a competing locus of loyalty. The university can tolerate high attrition and extreme stress in ROTC because the survivors belong to the state/university complex. They cannot tolerate it in fraternities because the survivors belong to the fraternity.

  ### 2. Signaling vs. Manufacturing: What is Required vs. Underdetermined

  You asked what the practice strictly requires versus what is merely comfortable.

  **Strictly Required:**
  The institution must act *as if* the ordeal produces human capital (skill, discipline, resilience). It cannot officially admit that the primary function is screening or bonding, because public universities are educational institutions, not sorting mechanisms or cults. If they admit the ordeal is purely for screening, they admit the "training" is a sham.

  **Sits Comfortably With:**
  *   **Costly Signaling:** The institution benefits if the ordeal acts as a handicap principle. It filters out those unwilling to sacrifice for the *institution's* goals. This fits comfortably as long as the signal is interpreted as "commitment to the mission," not "commitment to the peers."
  *   **Effort Justification (Manufacturing):** The psychological mechanism where "I suffered for this, therefore I value this" works in the institution's favor. It doesn't matter if the suffering *revealed* commitment or *created* it, as long as the commitment is directed upward (to the chain of command) rather than laterally (to the pledge class).

  **Genuinely Underdetermined:**
  The practice does not need to know whether the ordeal actually builds skill. It is underdetermined whether the "warrior weekend" makes better soldiers or just identifies people who can tolerate sleep deprivation. The institution can maintain the policy regardless of which is true, provided the *narrative* remains one of skill acquisition. This is why the "arbitrary trivia" persists: it doesn't need to be useful; it needs to be *difficult*, but it must be *labeled* as useful to maintain legal and educational cover.

  ### 3. The Counterfactual: If the University Accepted the Honest-Signal Story

  If a university administration truly accepted Zahavi's Handicap Principle as the primary justification for these rituals—that the waste *is* the point—they would have to change their design significantly.

  **Current Design:** High cost + Plausible deniability of utility ("It's training").
  **Honest-Signal Design:** High cost + Admitted lack of utility ("It's a test of will").

  If they accepted the signal theory, they would likely move toward **safe, bounded, openly pointless rituals.** They would design ordeals that are maximally difficult but minimally liable. Think: intense but supervised physical challenges, complex but harmless cognitive tasks, strictly time-boxed sleep deprivation with medical oversight.

  **Why they don't do this:**
  Admitting the signal theory destroys the educational legitimacy. If you say, "We make you memorize this trivia not because you need to know it, but to prove you are obedient," you are admitting to hazing. You are admitting that the "training" is theater. The university *needs* the "skill" cover story to protect itself from liability and accreditation reviews. The "waste" must be disguised as "investment."

  Furthermore, an openly pointless ritual invites the question: "Why should I do this?" A skill-based ritual answers: "Because you need to know this to be a soldier." A signal-based ritual answers: "Because we said so." The latter works for a cult or a fraternity; it works poorly for a state institution that needs to justify its budget to taxpayers.

  ### 4. The Failure Mode: Adverse Selection

  You asked about the failure mode where the cost isn't differential in the right way. This is the risk of **selecting for the wrong trait.**

  In a healthy signaling equilibrium, the cost is lower for the "high quality" type (e.g., the truly dedicated soldier finds the hardship easier to bear than the tourist). The signal accurately reveals commitment to the *mission*.

  **The Failure Mode:**
  The ordeal becomes decoupled from the mission and selects for **tolerance for abuse** or **attachment to the ritual itself.**

  1.  **The Masochist/Fanatic:** If the ordeal is purely about suffering without clear skill acquisition, you select for individuals who enjoy suffering or dominance. You get leaders who haze because they like power, not because they value unit cohesion.
  2.  **The Sunk-Cost Trapper:** If the ordeal is too arbitrary, the people who stay are not necessarily the most competent, but the ones most susceptible to cognitive dissonance. They stay because they *can't admit* the suffering was for nothing. This creates a group that is brittle; if the mission becomes unclear, their commitment collapses because it was based on the ritual, not the goal.
  3.  **The Liability Magnet:** If the cost involves legal risk (alcohol, physical danger), you select for individuals who are risk-tolerant regarding *rules*, not just hardship. You filter out the cautious, rule-abiding citizens the university claims to want, and filter in the rule-breakers.

  **The "Wrong People":**
  The specific failure you see in fraternities (and sometimes in rogue military units) is when the group becomes more committed to the *secrecy of the ordeal* than to the *stated purpose of the group*.
  *   **ROTC Ideal:** I endured this to serve the country.
  *   **Failure Mode:** I endured this to be one of *you*, and now I will make the next class endure it to prove they are one of *us*.

  When the signal becomes about loyalty to the *peers who administered the hazing* rather than the *institution that authorized it*, the institution cracks down. That is exactly what your brother is observing. The university allows the pain only as long as the loyalty it purchases flows up the chain of command. If the loyalty flows laterally to the pledge class (creating a "brotherhood" that protects its own against the administration), it is classified as hazing and banned.

  ### Summary

  The pattern of institutional practice presupposes that **ordeals are legitimate only when they produce assets for the institution.**

  *   **Strict Requirement:** The institution must maintain the fiction that the pain is instrumental (training), not expressive (bonding).
  *   **Underdetermined:** Whether the pain actually creates skill or just screens for grit. The institution doesn't need to know, as long as the legal cover holds.
  *   **The Double Standard:** It is not hypocrisy regarding the *suffering*; it is territoriality regarding the *loyalty*. ROTC hazing buys loyalty for the State; Fraternity hazing buys loyalty for the House.
  *   **The Failure Mode:** When the cost of the ordeal selects for people who value the hierarchy of the hazing more than the mission of the organization.

  Your brother is right that the physics are the same. He is wrong that the social function is the same. The university isn't regulating the *harm*; it is regulating the *ownership of the bond.*
