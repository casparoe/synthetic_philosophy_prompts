prompt: |-
  My little brother started at a big state university this year and joined ROTC, and we got into an argument at Thanksgiving that I can't get straight. His campus sends out emails every semester reminding everyone that hazing is a crime and that a club can lose its charter over it — and meanwhile his unit has something like a "warrior weekend" where the first-years get maybe four hours of sleep across three days, have to memorize a pile of completely arbitrary trivia and recite it on demand, and get screamed at when they screw up. The sports teams do preseason doubles in August heat. Nobody counts any of that as hazing. But if a fraternity made its pledges memorize trivia and go without sleep, it would be a scandal and probably a felony. I get that there are surface differences the university would point to — consent, who designs it, whether there's a real skill at the end, whether the institution can be held accountable for it — but I'm not convinced those explain the *strength* of the reaction, and I also notice that when you crack down on one ritual the group seems to invent a new one (matching tattoos, secret handshakes, a pointless fourteen-hour road trip to somewhere boring) that has none of the skill content at all.

  What I'd like is for you to reconstruct what that whole pattern of institutional practice presupposes about what ordeals *do*. I've read a bit about costly signaling and Zahavi's handicap principle — peacock tails, the idea that a signal is only honest if its cost is differentially lower for the individuals who actually have the quality being advertised, so the waste is the point rather than a defect — and that framing makes the puzzle sharper for me rather than dissolving it. If the bonding or commitment-revealing work of an ordeal comes precisely from its being *useless*, then the sanctioned versions that claim to build skill are, on that story, either secretly relying on the waste or not doing the work everyone credits them with. But there are rival stories I can half-see and can't evaluate: maybe shared suffering doesn't signal anything to anyone and instead *manufactures* the commitment in the person who endured it, in which case whether it's informative to observers is beside the point; maybe the ritual is a way of screening for a trait nobody would name out loud; maybe the crackdown is better explained by liability and PR than by any view about ordeals at all. So: what does the practice strictly require you to believe, what does it merely sit comfortably with, and where is it genuinely underdetermined so that several quite different theories would license the same rules? And be concrete about what would have to change — if a university really accepted the honest-signal story, would it want to design safe, bounded, openly pointless rituals, or would it try to break the signaling equilibrium some other way? I'd also like you to say what the failure mode looks like where an ordeal's cost isn't differential in the right way, so that the people most willing to pay it are the ones with the least attachment to the group and the ritual ends up selecting for the wrong people. Please don't bother with citations or a reading list — I just want the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Core Scenario:** A conflict between a user and their ROTC brother regarding hazing vs. sanctioned military/athletic rigor. The brother argues that sanctioned ordeals (ROTC "warrior weekend," sports preseason) are treated differently than fraternity hazing, despite superficial similarities (sleep deprivation, memorization, yelling).
      *   **Theoretical Framework:** The user is familiar with Costly Signaling Theory (Zahavi's Handicap Principle). They find it sharpen the puzzle rather than solve it (if waste is the point, why sanction "skill-building" versions?).
      *   **Alternative Theories:** Shared suffering manufactures commitment (cognitive dissonance/effort justification); screening for unnamed traits; liability/PR explanations.
      *   **Specific Tasks:**
          1.  Reconstruct what institutional practice presupposes about what ordeals *do*.
          2.  Distinguish between what the practice *strictly requires*, what it *sits comfortably with*, and what is *underdetermined*.
          3.  Be concrete about counterfactuals (e.g., if a university accepted the honest-signal story, what would they do?).
          4.  Describe the failure mode where cost isn't differential in the right way (adverse selection).
          5.  **Constraint:** No citations or reading lists. Just the argument.

  2.  **Analyze the "Institutional Presupposition":**

      *   Why does the university allow ROTC/Sports hazing-but-not-hazing but ban Fraternity hazing?
      *   *Official Narrative:* ROTC/Sports build *skills* and *discipline* relevant to the mission. Fraternities build *secrecy* and *hierarchy* irrelevant to the mission.
      *   *Underlying Logic:* Institutions tolerate suffering if it produces *human capital* transferable to the institution's goals. They ban suffering if it produces *social capital* transferable only to the sub-group.
      *   *The "Ordeal" Function:* The institution views the ordeal not just as a signal, but as a *transformation*.

  3.  **Evaluate the Theories against the Practice:**

      *   *Costly Signaling (Handicap):* Requires the cost to be lower for high-quality types.
          *   *Institutional View:* They likely deny this is the primary mechanism. They claim it's about training.
          *   *Reality:* It probably *is* signaling, but the institution wants to control *what* is being signaled (loyalty to the unit vs. loyalty to the brothers).
      *   *Effort Justification (Cognitive Dissonance):* "I suffered for this, so I must value it."
          *   *Institutional View:* This aligns well. Suffering creates buy-in.
          *   *Conflict:* Why ban it for fraternities? Because the buy-in is to the wrong entity.
      *   *Screening:* Testing for traits (grit, obedience, risk tolerance).
          *   *Institutional View:* They want grit/obedience for soldiers/athletes. They don't want/need it for drinkers/socializers.
      *   *Liability/PR:*
          *   *Institutional View:* This is the pragmatic constraint. ROTC/Sports are insured/managed. Fraternities are liabilities.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the brother's point (hypocrisy) but pivot to the institutional logic. The distinction isn't about the *physics* of the suffering, but the *teleology* (purpose) of the suffering.
      *   **What the Practice Presupposes (The "Official" Theory):**
          *   Ordeals are *productive*, not just signals.
          *   They transform the individual *for the institution*.
          *   Key distinction: *Instrumental* suffering (ROTC/Sports) vs. *Expressive* suffering (Fraternities).
      *   **What is Strictly Required vs. Comfortable vs. Underdetermined:**
          *   *Required:* The institution must believe it has the right to define the *purpose* of the pain.
          *   *Comfortable:* Costly signaling fits if the signal is loyalty to the *University/State*, not the sub-group.
          *   *Underdetermined:* Whether the pain actually builds skill or just screens for tolerance. The institution acts as if it builds skill, but could function if it just screened.
      *   **The "Honest Signal" Counterfactual:**
          *   If the University accepted the Handicap Principle fully: They would decouple pain from skill. They would create "safe hazing."
          *   *Why they don't:* Because admitting it's a signal undermines the claim of professionalization/education. It admits the "training" is theater.
      *   **The Failure Mode (Adverse Selection):**
          *   If the cost is purely financial or purely pain-based without skill: You select for masochists or those with nothing to lose, not the competent.
          *   The "Wrong" People: Those who love the hazing more than the mission.
      *   **Conclusion:** Synthesize. The double standard is real, but it's not logical inconsistency; it's territoriality over the *meaning* of the suffering.

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Check:* Did I address the "useless waste" point?
      *   *Correction:* Need to emphasize that institutions *cannot* admit the waste is the point. If they admit the waste is the point, they admit they are running a cult, not a school. The "skill" cover story is essential for legal/educational legitimacy.
      *   *Check:* Did I address the "manufacturing commitment" vs. "signaling" distinction?
      *   *Correction:* Yes, distinguish between *screening* (finding the loyal) and *bonding* (making them loyal). Institutions want both, but only for themselves.
      *   *Check:* The "Failure Mode" needs to be specific.
      *   *Correction:* Focus on the "Hazer" vs. "Hazee" dynamic. If the cost is too high or unrelated to mission, you select for people who enjoy power over others or people who are desperate for belonging regardless of the group's values.

  6.  **Final Polish:**

      *   Ensure tone is analytical, not judgmental.
      *   Avoid academic jargon where possible (or explain it simply).
      *   Make sure the "What would have to change" section is concrete.
      *   *Crucial Insight:* The university isn't banning hazing because hazing is ineffective; they are banning *unauthorized* hazing because it creates competing loyalties.

  7.  **Final Review against constraints:** No citations. Just argument. (Proceed to generate output).

  *(Self-Correction Note during final review)*: I need to make sure I don't just validate the brother's view or the university's view, but explain the *structural logic* that creates the discrepancy. The prompt asks to reconstruct what the *practice* presupposes.

  *Key distinction to highlight:* The difference between *sunk cost* (I suffered so I stay) and *signal* (I suffered so you know I'm good). The institution relies on *sunk cost* for retention but claims *skill acquisition* for legitimacy.

  *Failure Mode:* The "Fanatic" problem. If the ordeal is too arbitrary, you select for those who value the ritual over the goal.

  *Let's structure the response:*
  1. The Institutional Teleology (Purpose of Pain).
  2. Signaling vs. Manufacturing (The Mechanism).
  3. The Underdetermined Middle (What they don't need to know).
  4. The Counterfactual (If they admitted the Signal Theory).
  5. The Failure Mode (Adverse Selection).

