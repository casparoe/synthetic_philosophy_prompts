answer: |-
  Here is a structured teaching plan designed for novelists. It strips away the academic jargon and focuses on the phenomenological experience (what it *feels* like), which is their native territory.

  ### 1. The Prerequisite Concept: Commensurability
  Before the problem makes sense, they must understand *why* we are looking for a common feature in the first place.
  *   **The Concept:** **The Common Currency.**
  *   **The Explanation:** Tell them: "If your protagonist is a hedonist, they are making trade-offs. To choose a glass of wine over a good night's sleep, there must be a scale where both can be weighed against each other. If 'pleasure' isn't one specific thing, how do you measure them against one another?"
  *   **Why this first:** Without establishing that hedonism requires a *single metric* for decision-making, the heterogeneity problem just looks like a list of fun things. They need to feel the need for unity before you show them the fragmentation.

  ### 2. The Single Visceral Example
  Do not use your anticipatory example for the *initial* hook. Anticipation is cognitive and muddy. You need something sensory to break the "intensity" intuition.
  *   **The Example:** **Scratching an Itch vs. Hearing a Resolved Chord.**
  *   **The Setup:** Ask them to close their eyes.
      1.  Imagine a maddening itch right between your shoulder blades. Now imagine the relief of scratching it. That is pleasure.
      2.  Now imagine hearing the final, resolving chord of a piece of music you love. That is also pleasure.
  *   **The Trap:** Ask them: "What is the *sensation* that is identical in both experiences?"
  *   **Why this works:**
      *   It breaks the **Intensity Intuition:** The itch might be a 10/10 relief, the music might be a 5/10 joy. If pleasure were just intensity, the itch wins. But your protagonist might choose the music. Why?
      *   It breaks the **Location Intuition:** One is localized skin relief; the other is a diffuse emotional swell.
      *   **The Kicker:** There is no common "tingle" or "warmth" shared by the itch-scratch and the music. If there is no common sensation, what makes them both "pleasure"?

  ### 3. Addressing Misconceptions (Sequence & Timing)
  Novelists will try to solve the problem immediately using narrative tropes. You need to head these off in order.

  **Misconception A: "Bodily vs. Mental Pleasure"**
  *   **When they bring it up:** Immediately after the Example. They will say, "Well, one is physical and one is emotional. Obviously they are different categories."
  *   **How to head it off:** "If they are different categories, your hedonist protagonist has no way to choose between them. It's like comparing apples to miles. For hedonism to work as a motivation, there must be a *single* quality. Also, compare the itch-scratch to a warm bath. Both are bodily. Do they feel the same? No. The split isn't Body vs. Mind; it's that *every* pleasure feels unique."
  *   **Goal:** Force them to admit the fragmentation exists even within categories.

  **Misconception B: "Pleasure is Just Satisfaction"**
  *   **When they bring it up:** When they realize there's no common sensation. They will pivot to: "It's about getting what you want. Satisfaction."
  *   **How to head it off:** "I can be satisfied that I filed my taxes, but feel no pleasure. I can feel pleasure from a surprise sunset I didn't even want. Satisfaction is about closing a loop; pleasure is the fuel. If pleasure is just 'getting what you want,' then your character isn't chasing pleasure, they are chasing goals. That changes their arc."
  *   **Goal:** Distinguish the *feeling* from the *outcome*.

  ### 4. The Comprehension Check
  Do not ask "Does that make sense?" They will nod to be polite. You need to test if they feel the *narrative tension* the problem creates.
  *   **The Exercise:** "Take your protagonist. Put them in a room with two options: Option A is a high-intensity bodily relief (like the itch). Option B is a low-intensity aesthetic joy (like the music). If pleasure is one thing, they should be able to calculate the choice. If pleasure is heterogeneous (many different things), how do you write the decision?"
  *   **Signs of Understanding:**
      *   *Failure:* They try to assign a number to both (e.g., "The music is worth 5 itches").
      *   *Success:* They acknowledge the character has to make a qualitative leap, not a quantitative calculation. They realize the character is defining *who they are* by the choice, not just maximizing a stat. They understand that "Hedonism" is not a simple algorithm for a character.

  ### 5. What to Leave Out
  *   **Mill vs. Bentham:** Do not teach the "Higher vs. Lower Pleasures" debate. That is a *solution* to the heterogeneity problem (Mill admits they are different but ranks them), not an explanation of the problem itself. It introduces moral judgment which distracts from the phenomenological question.
  *   **Neuroscience:** Do not bring up dopamine or opioids. Writers care about lived experience, not biology. Biology suggests a common mechanism (dopamine), which actually *solves* the problem scientifically but muddies the philosophical/narrative point about subjective experience.
  *   **The Paradox of Hedonism:** (That chasing pleasure makes it flee). This is a psychological consequence, not a definition problem. Save it for a different workshop.

  ### 6. Evaluating Your Example (Anticipation vs. Consumption)
  *   **Does it fit?** **Yes, perfectly.** But do not use it as the *primary* teaching example.
  *   **Why:** Anticipation is cognitively complex. Some writers might argue anticipation isn't "pleasure" but "hope." It opens a side door about time that distracts from the core sensory question.
  *   **How to use it:** Use your example as the **Application Phase** *after* they understand the core problem via the Itch/Music example.
  *   **The Pitch:** "Now that we know pleasure isn't one thing, look at Time. The pleasure of *waiting* for the drug vs. *taking* the drug. If they feel different, does your character value the chase or the catch? The Heterogeneity Problem means your character might be chasing two different gods without realizing it."
  *   **Verdict:** It validates the workshop's relevance to their actual writing. It shows that the philosophical problem creates specific plot complications (e.g., the character ruins the consumption by over-valuing the anticipation).

  ### Summary of the Arc for Tuesday
  1.  **Hook:** Hedonism requires a common currency to make choices.
  2.  **Shock:** The Itch vs. The Chord. There is no common sensory thread.
  3.  **Defense:** Block the "Body/Mind" and "Satisfaction" escape routes.
  4.  **Implication:** If pleasure is many things, a "Hedonist" character is actually fractured, chasing incompatible goods.
  5.  **Application:** Apply this to your Anticipation vs. Consumption arc.
