answer: |-
  **WORKSHOP Q&A PREP // MATH PHILO CONF**
  **Subject:** Defending Robust Platonism (Epistemology Focus)
  **Room Temperature:** Hostile. Expect pile-ons.
  **Strategy:** Hold the line on *sui generis* intuition. Do not attempt a causal mechanism (there isn't one). Concede the lack of naturalized explanation but frame it as a limitation of naturalism, not Platonism.

  ---

  ### 1. The Causal Access Challenge (Naturalist)
  **Who:** The Quinean in the front row (likely the first hand up).
  **The Objection:** "You posit objects that are causally inert—no energy, no location, no interaction. Yet you claim we have knowledge of them. Knowledge requires a reliable belief-forming mechanism linking the knower to the fact. If there is no causal commerce between us and these objects, how is the correlation between our beliefs and the mathematical facts anything but a miracle?"
  **My Reply:** "The link isn't causal; it's rational. We grasp mathematical truths directly through a priori intuition, similar to how we grasp logical truths. The absence of a causal chain doesn't preclude a reliable epistemic connection."
  **Soft Spot:** *Reliable connection.* She's asserting reliability without explaining the mechanism. Sounds like magic.
  **Concede:** Admit there is no causal story to tell.
  **Hold:** Insist that causality is not the only form of epistemic access (logic doesn't causally hit us either).

  ### 2. The Indispensability Contrast (Naturalist)
  **Who:** Same camp as #1, looking to tighten the screw.
  **The Objection:** "Why posit this extra layer of 'intuition' when indispensability does the work? We are justified in believing in electrons because they explain physical phenomena. We are justified in believing in sets because they are indispensable to the theories that explain physical phenomena. Your 'intuition' is an ontological free lunch that adds nothing to the explanation."
  **My Reply:** "Indispensability explains why we use the math, not why the math is true. We know '2+2=4' is true prior to and independently of its application in physics. To ground truth solely in utility is to confuse pragmatics with ontology."
  **Soft Spot:** *Prior to.* If it's prior, why is it so perfectly applicable? She's separating truth from utility in a way that makes the application look coincidental.
  **Concede:** Acknowledge indispensability is a good reason for *confidence*, but not the *source* of truth.
  **Hold:** Truth is mind-independent; utility is a consequence, not a definition.

  ### 3. The Identity Problem (Structuralist)
  **Who:** The Pattern-Realist (will interrupt if given too much rope).
  **The Objection:** "You talk about 'objects' like numbers. But which object is the number 2? Is it the set {∅, {∅}}? Or {{∅}}? Both work equally well in the structure. If numbers are specific objects, there must be a fact of the matter. If there isn't, then you're not committed to objects, you're committed to places in a structure. Your ontology is malformed."
  **My Reply:** "The specific set-theoretic reduction isn't what matters. The number 2 is a sui generis abstract object. It isn't identical to any set; sets are just models we use to represent it. The object exists independently of our reduction."
  **Soft Spot:** *Sui generis.* She's just naming the problem away again. If it's not a set, what individuates it?
  **Concede:** Admit set-theoretic reductions are arbitrary models.
  **Hold:** Insist the object itself is primitive and not defined by its structural relations alone.

  ### 4. The Abstraction Counter (Structuralist)
  **Who:** Same Structuralist, following up on epistemology.
  **The Objection:** "I can explain our knowledge of structure without magic. We perceive physical systems, we abstract the pattern, we recognize the structure. You claim we intuit non-spatio-temporal objects directly. Why posit a mysterious faculty of intuition when we have a clear account of pattern-recognition grounded in perception?"
  **My Reply:** "Pattern recognition explains finite structures instantiated in physics. It cannot explain our knowledge of infinite sets or transfinite hierarchies. There are no physical instantiations of the continuum for us to abstract from. Intuition is required to grasp the infinite."
  **Soft Spot:** *Intuition is required.* She's claiming intuition fills the gap where physics stops, but offers no account of how the brain jumps the gap.
  **Concede:** Physical abstraction is sufficient for finite arithmetic.
  **Hold:** Infinite mathematics requires a non-empirical faculty.

  ### 5. The Truth vs. Assertibility Challenge (Fictionalist)
  **Who:** The Deflationary Critic (waiting for the room to tire).
  **The Objection:** "You're insisting on literal truth where 'assertibility within the fiction' does all the work. We can say '2+2=4' is correct without saying 'there exists an object 2'. You are taking on massive ontological debt for no semantic gain. Why not just say the statements are useful moves in a calculus?"
  **My Reply:** "Because mathematicians take themselves to be discovering truths, not inventing rules. When they prove a conjecture, they feel they are describing a reality. To treat this as a fiction is to misunderstand the phenomenology of mathematical practice."
  **Soft Spot:** *Phenomenology.* Feelings of discovery aren't proof of existence. Dreams feel real too.
  **Concede:** Fictionalism is parsimonious.
  **Hold:** Parsimony shouldn't come at the cost of taking mathematical discourse at face value.

  ### 6. The Evolutionary Debunking (Naturalist/Fictionalist Tag-Team)
  **Who:** Likely the Naturalist again, sensing blood.
  **The Objection:** "Our cognitive faculties evolved for survival on the savannah, not for perceiving non-physical realms. If our math faculties track truth about abstracta, it's a cosmic coincidence. The naturalist explains the reliability: we evolved to count predators. The Platonist must explain why evolution tuned us to a realm that had no impact on our survival."
  **My Reply:** "Evolution tuned us to track physical truths, but the faculty that tracks physical truth relies on logical and mathematical structures that are universal. We didn't evolve to see sets, but we evolved to reason, and reasoning leads us to them."
  **Soft Spot:** *Leads us to.* This is the weakest link. Why does reasoning about predators lead to truth about transfinite cardinals?
  **Concede:** Evolution selected for basic arithmetic competence.
  **Hold:** Higher mathematics is a byproduct of a general reasoning capacity that tracks truth.

  ---

  ### THE KILLER QUESTION (Hope nobody asks)
  **The Objection:** "You say these objects are causally inert. You say our brains are physical systems governed by causal closure (every physical event has a physical cause). If mathematical objects cannot cause physical events, and our belief-states are physical events in the brain, **what exactly is doing the work when you 'intuit' a number?** If nothing physical happens to cause the belief, you're violating causal closure. If something physical happens, you're admitting a causal link you said doesn't exist. Which is it?"
  **Why it kills me:** It forces me to choose between violating the laws of physics (causal closure) or admitting my "intuition" is just a physical process (naturalism). I have no middle ground here.
  **Emergency Exit:** "Causal closure applies to the physical domain. Intuition is the interface where the rational constrains the physical without violating it." (Note: This is nonsense, but it's the only line I have. Do not linger here. Move to the next questioner immediately.)
