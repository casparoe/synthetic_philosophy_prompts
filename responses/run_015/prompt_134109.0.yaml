prompt: |-
  I've somehow ended up with the training slot for our new pricing analysts — small specialty insurer, we underwrite gig-economy couriers (e-bikes, mopeds, the occasional car), room of about fifteen, most of them have had exactly one applied stats class and they all talk as if a probability is a property of a single case, the way a weight is. I've got 75 minutes and I want to spend it on the reference class problem. Don't explain the problem to me, I've done enough reading on it; I want the plan for the explanation.

  The order is what I keep going back and forth on. My instinct is to open by making them each commit to a number for one named applicant — what's the chance this person has an at-fault claim in the next year — write the numbers on the board, and only then show that the number moves when nothing about the applicant changes and no new evidence arrives, only the description of her. Is that the right entry point, or does something have to be in place before that even stings? And where in the sequence do the three things the problem can mean get separated: which class's frequency *is* the probability, which class's frequency should inform the number we act on, and the it-just-depends-what-question-you're-asking move that dissolves the whole thing? I'm fairly sure that last one has to be earned rather than granted, and I don't know whether it belongs at the end or whether it should be floated early and then made to fail.

  The carrying example is where I'm stuck. My candidate: one applicant, 24, delivers by e-bike in a dense city, 30 hours a week, one prior at-fault collision, top-decile on our telematics safety score. Classes I can put her in — 24-year-old riders, urban e-bike couriers, riders with a prior claim, top-decile telematics scorers — all non-gerrymandered, all with rates I can quote, differing by a factor of several, and none of them is a subset of another. Does that work? It might not: every one of those classes is a feature sitting in our database, so I'm terrified someone will just say condition on all of it, fit a model, done — and the session deflates into a complaint about regression. So: what does the example have to have, and what does it have to lack, so that move isn't available? Should the classes be nested or cross-cutting, should the rates differ wildly or only a little, and should there be a decision with money attached to it or does that muddy things?

  Misconceptions — I'm guessing: that there's a true reference class out there and we're just short of data; that this is base-rate neglect again (it's almost the inverse, isn't it?); that it's Simpson's paradox in a hat; that more data fixes it; that the fix is use the narrowest class you can describe; and that if the number is reference-class-relative then anything goes. Tell me which of those I've got wrong, where in the sequence each one has to be headed off, and which ones are specific to an audience that prices things for a living and will want a rate at the end.

  Two wrenches I want placed. One: the narrowest class you can describe eventually contains just her, and the frequency there is 0 or 1 — where does that go, and is it the natural bridge to why you can't always condition on everything? Two: we have a real bad habit here of re-slicing a book with segments like couriers who claimed in their first 60 days, which is picking the class after you've seen the outcome. I want that in, but I can't tell if it's the same lesson or a different one wearing the same clothes.

  Also: if I make one of the classes her age or her gender it turns into a compliance argument about what we're allowed to use. Do I keep that out of the carrying example and bring it in at the end, or is that version the one they actually need? And give me the order I should reveal the numbers in — do I show all the class rates up front or make them commit first?

  At the end I need one thing to have them *do* that separates getting it from having learned the phrase it depends on the reference class. And tell me what I should explicitly refuse to cover in 75 minutes and say out loud that I'm refusing it.
reasoning: |-
  Here's a thinking process that leads to the suggested training plan:

  1.  **Analyze the User and Context:**
      *   **User:** Trainer/Lead Analyst at a small specialty insurer (gig-economy couriers).
      *   **Audience:** 15 new pricing analysts. Background: ~1 applied stats class each.
      *   **Mindset:** Frequentist intuition is weak. They treat probability as a physical property of an individual (propensity) rather than a frequency of a class.
      *   **Goal:** 75-minute session on the *Reference Class Problem*.
      *   **Constraints:** Do not explain the problem *to* the user (they know it). Need a *plan* for the explanation. Focus on order, examples, misconceptions, and specific "wrenches" (narrowest class, data snooping).
      *   **Tone:** Professional, direct, pedagogical, slightly cynical about standard stats training (matches user's voice).

  2.  **Deconstruct the User's Questions:**
      *   **Opening:** Commit to a number first vs. set context?
      *   **Sequence:** How to separate the three meanings (ontology, decision, dissolution)?
      *   **Example:** The "Carrying Example" (24yo, e-bike, urban, prior claim, telematics). Risk: Analysts say "just run a GLM/ML model." How to prevent the "condition on everything" escape hatch?
      *   **Misconceptions:** True class exists, base-rate neglect, Simpson's paradox, more data fixes it, narrowest class is best, relativism ("anything goes").
      *   **Wrenches:** 1. Narrowest class = $N=1$ (0 or 1). 2. Post-hoc segmentation (data snooping).
      *   **Compliance:** Age/Gender issues. Keep in or out?
      *   **Reveal Order:** Show rates up front or make them commit?
      *   **Closing:** An activity to prove understanding.
      *   **Exclusions:** What to explicitly *not* cover.

  3.  **Develop the Strategy:**

      *   **The Core Tension:** The audience wants *The Number*. The lesson is *There Is No Single Number*. The friction must be felt, not just told.
      *   **The "Condition on Everything" Trap:** This is the biggest risk. If they think a GLM solves this, the lesson fails. The example *must* force a choice between mutually exclusive or cross-cutting classes where a standard model would just average them or overfit. Actually, the better angle is that a model *chooses* weights for features, which is implicitly choosing a reference class weighting scheme. But for 75 mins, keep it simpler: The model *is* the reference class choice.
      *   **The Order:**
          1.  *Hook:* Force a commitment (The Number).
          2.  *Shock:* Show the variability based on description framing (The Problem).
          3.  *Diagnosis:* Why did it move? (The Ontology).
          4.  *Action:* Which one do we use for pricing? (The Decision).
          5.  *Trap:* The $N=1$ limit and Data Snooping (The Wrenches).
          6.  *Compliance:* The "Allowed" vs. "Predictive" tension.
          7.  *Close:* Decision exercise.

      *   **Refining the Example:** The user's example is good but needs tweaking to prevent the "just model it" response.
          *   *Fix:* Make the classes *cross-cutting* in a way that creates conflicting signals, and emphasize that we don't have a model yet, we are setting *manual* rates or validating model outputs. Or, better, acknowledge the model but point out that the *interpretation* of the model output relies on the class.
          *   *Better Fix:* The "Condition on Everything" move fails because the intersection of all those specific classes might have $N=0$ or $N=3$ in the historical data. Sparsity. That's the killer. You can't condition on everything because the data doesn't exist for the specific conjunction.
      *   **Misconceptions:**
          *   "True class exists": Address early (Ontology).
          *   "Narrowest is best": Address with the $N=1$ wrench.
          *   "More data fixes it": Address with the definition of data (it's always classified).
          *   "Anything goes": Address with the Decision/Utility phase.
      *   **Compliance:** Keep it for the end. It's a constraint on the *Decision* phase, not the *Ontology* phase.
      *   **Exclusions:** GLM mechanics, Bayesian priors (too technical), regulatory law specifics.

  4.  **Drafting the Plan (Iterative refinement):**

      *   *Opening:* User's instinct is right. Commit first. It creates ownership of the error.
      *   *The Example:* Needs to highlight sparsity. If you combine "24yo" + "E-bike" + "Prior Claim" + "Top Telematics" + "Dense City", do we have 10,000 records or 5? If 5, the frequency is unstable. If we broaden, it stabilizes but biases. *This* is the trade-off.
      *   *The Three Meanings:*
          1.  Metaphysical (What *is* the prob?) -> Dismiss quickly.
          2.  Epistemic (What do we *know*?) -> This is the data sparsity issue.
          3.  Pragmatic (What do we *do*?) -> This is pricing/compliance.
      *   *Wrench 1 ($N=1$):* Place this right after "Narrowest is best." It kills that heuristic.
      *   *Wrench 2 (Data Snooping):* Place this near the end as a "how not to solve it" warning.
      *   *Closing Activity:* Don't ask for a definition. Ask for a justification of a rate given two conflicting class frequencies.

  5.  **Addressing Specific User Queries:**
      *   *Order of reveal:* Commit first. Then show the class rates.
      *   *Compliance:* End. It's a business constraint on the statistical truth.
      *   *Exclusions:* Explicitly say "We are not building a model today."

  6.  **Final Polish:** Match the user's terse, analytical tone. No fluff. Actionable steps.

      *(Self-Correction during drafting)*: Wait, if I tell them "Don't build a model," they might tune out. Pricing analysts *live* in models. I need to frame the Reference Class Problem as *the reason why model specification matters*. The model doesn't solve the problem; the model *is* a weighted aggregation of reference classes. I need to make sure I don't throw the baby out with the bathwater. I will advise the user to frame the model as a "machine for mixing reference classes."

      *(Refining the "Condition on Everything" counter)*: The user is worried they'll say "fit a model." The counter-argument is: A model assigns weights to features. Those weights are derived from... reference classes (marginal effects). If the interaction terms aren't there, you're assuming independence. If they are there, you run into sparsity. So the problem persists inside the model. I need to make sure the user knows how to shut down the "GLM saves us" objection without getting bogged down in GLM math. *Key point:* Sparsity in the intersection.

      *(Refining the Closing)*: Needs to be concrete. "Pick a rate and defend the class."

  7.  **Finalizing the Structure:**
      *   **0-15:** The Hook (Commitment & Shock).
      *   **15-30:** The Ontology (Why it moved).
      *   **30-45:** The Trap (Narrowest Class & $N=1$).
      *   **45-60:** The Decision (Pricing, Compliance, Utility).
      *   **60-70:** The Warning (Data Snooping).
      *   **70-75:** The Test (Activity).
      *   **Exclusions:** List clearly.

  8.  **Review against constraints:** 75 mins. 15 people. Stats novices. Pricing context.
      *   Looks solid. I will write the response now.

  *(Self-Correction on Tone)*: The user is sophisticated ("reference class problem," "gerrymandered," "telematics"). I can use technical terms but keep the pedagogy simple. I should respect their time.

  *(One last thought on the Example)*: The user asked: "Should the rates differ wildly or only a little?" They need to differ *enough* to change a decision (e.g., accept/decline or high/low tier). If the difference is 0.1%, no one cares. If it's 2% vs 15%, they care.

  *(One last thought on Compliance)*: User asked: "Is that version the one they actually need?" Yes, because in insurance, the "true" probability is irrelevant if you can't use the variable. It forces the "Pragmatic" definition of probability.

  Okay, ready to generate.cw
answer: |-
  Here is the battle plan. It is designed to induce cognitive dissonance immediately, prevent the "just model it" escape hatch, and force a pragmatic resolution rather than a philosophical one.

  ### 1. The Entry Point: Commitment Before Context
  **Your instinct is correct.** Do not prime them. If you explain the problem first, they will treat the numbers as a puzzle to solve rather than a judgment to defend.

  *   **0:00–0:10:** Put the "Carrying Example" applicant on the screen. Name her (e.g., "Sarah"). List the raw facts *without* grouping them into classes yet.
      *   *Facts:* 24, e-bike, dense city, 30hrs/week, 1 prior at-fault, top-decile telematics.
  *   **The Ask:** "Write down the probability of an at-fault claim in the next 12 months. Just one number. You are on the hook for this rate."
  *   **The Collection:** Write 5–6 distinct numbers on the whiteboard. Do not comment on them.
  *   **The Reveal:** Now, reveal the class frequencies one by one.
      *   Class A (24yo riders): 12%
      *   Class B (Top-decile telematics): 2%
      *   Class C (Prior claim + Urban): 18%
      *   Class D (E-bike + 30hrs): 9%
  *   **The Sting:** Point to the board. "Sarah did not change. The data did not change. Only the description changed. Which number on the left matches which number on the right?"

  **Why this order:** It forces them to realize their initial number was an implicit, unexamined reference class choice. It makes the problem visceral before it becomes technical.

  ### 2. The Example: Blocking the "Condition on Everything" Escape
  You are right to fear the "fit a model" objection. To block it, your example must highlight **sparsity in the intersection**.

  *   **The Constraint:** Explicitly state: "We have 5 years of historical data. There are exactly **three** records in our database that match Sarah on all five dimensions. Two had claims, one did not."
  *   **The Frequency:** 66%.
  *   **The Question:** "Do we price her at 66%?"
  *   **The Trap:** This forces the tension between *specificity* (this is exactly her) and *stability* (N=3 is noise).
  *   **Why it works:** It prevents them from saying "condition on everything" because conditioning on everything yields an unusable variance. It forces them to acknowledge that *broadening* the class is a modeling choice, not a discovery of truth.
  *   **Rate Variance:** The rates must differ wildly enough to change a business decision (e.g., 2% vs 18%). If the spread is tight, they will average it and move on. If the spread implies "Profitable Risk" vs. "Decline," they feel the weight.

  ### 3. Sequencing the Three Meanings
  Do not present these as three equal options. Present them as a funnel.

  1.  **Ontology (What *is* it?):** Spend 5 minutes max. Acknowledge the philosophical hole. "Is there a true probability inside Sarah?" Let them debate briefly. **Verdict:** "We cannot know. We sell this for a living; we need a number by 5 PM. Move on."
  2.  **Epistemology (What do we *know*?):** This is the meat (30 mins). This is where you handle the $N=1$ wrench.
      *   *The Wrench:* "If the narrowest class is best, why not make the class 'Sarah'?"
      *   *The Lesson:* Frequency requires repetition. $N=1$ gives 0 or 1. Probability vanishes. Therefore, the 'best' class is a trade-off between **Bias** (too broad) and **Variance** (too narrow).
  3.  **Pragmatics (What do we *do*?):** This is where you handle Compliance and Pricing.
      *   *The Move:* "We know the 24-year-old rate is predictive. We also know we are not allowed to use age."
      *   *The Lesson:* The 'correct' reference class is the most predictive one *that satisfies our constraints*.

  ### 4. Handling Misconceptions
  Head these off at the specific pass where they usually arise.

  *   **"There's a true class / More data fixes it":** Kill this in the **Ontology** phase. More data just lets you define *narrower* classes before hitting sparsity. It doesn't solve the selection problem.
  *   **"Narrowest class is best":** Kill this with the **$N=1$ Wrench**.
  *   **"It's Base-Rate Neglect":** Correct them. Base-rate neglect is ignoring the broad class. This is the opposite: it's *which* broad class to pick.
  *   **"Anything goes / Relativism":** Kill this in the **Pragmatics** phase. "Anything goes" leads to insolvency. We choose the class that minimizes prediction error *subject to constraints*.
  *   **"Simpson's Paradox":** Keep this out. It confuses the issue. This isn't about aggregation reversing trends; it's about selection ambiguity.

  ### 5. The Second Wrench: Data Snooping
  Place this at **minute 60**, right before the closing exercise.

  *   **The Setup:** "We noticed a weird group: Couriers who claimed in their first 60 days *and* ride between 2 AM and 4 AM."
  *   **The Rate:** 45% claim frequency.
  *   **The Question:** "Do we create a segment for this?"
  *   **The Lesson:** This is a class defined *by the outcome*. It looks like a reference class, but it's a tautology.
  *   **Distinction:** Make sure they see the difference. The Reference Class Problem is about choosing between *valid* pre-existing descriptions. Data snooping is about creating *invalid* post-hoc descriptions. Both result in different rates, but one is a modeling choice, the other is fraud/overfitting.

  ### 6. Compliance: Where does it fit?
  Keep it for the **Pragmatics** phase (Minute 45–60).

  *   **Why:** If you bring it in too early, they think the problem is legal, not statistical. They need to feel the statistical ambiguity first.
  *   **The Pivot:** "Okay, we agree Age is the most predictive reference class. Legal says no. Now what?"
  *   **The Takeaway:** The "true" probability is irrelevant. The "priceable" probability is the goal. This validates their job: they aren't discovering truth; they are constructing a stable, compliant estimator.

  ### 7. The Closing Exercise (Minute 65–75)
  Do not ask them to define the problem. Ask them to make a choice.

  *   **Scenario:** Give them a new applicant.
      *   Class X frequency: 5% (Large N, compliant variables).
      *   Class Y frequency: 15% (Medium N, includes one variable Legal is questioning).
      *   Class Z frequency: 2% (Small N, highly specific).
  *   **Task:** "Pick the rate. Write down two sentences: (1) Why you rejected the other two classes. (2) What risk you are accepting by choosing the one you did."
  *   **Success Criterion:** They pass if they acknowledge the trade-off (e.g., "I chose X to avoid compliance risk, accepting that I might underprice high-risk individuals"). They fail if they say "X is the true probability."

  ### 8. Explicit Exclusions
  Say this out loud at Minute 5. It protects you from scope creep.

  1.  **"We are not building a GLM today."** Acknowledge that models are just weighted reference class machines, but today is about the inputs, not the engine.
  2.  **"We are not solving the Philosophy of Probability."** We are frequentists by necessity. If you want to debate propensities, do it at lunch.
  3.  **"We are not discussing Regulatory Law."** We are discussing how to price *given* constraints, not what the constraints should be.

  ### Summary of Flow
  1.  **Commit:** Write your number. (10m)
  2.  **Shock:** Here are the class rates. They differ. (10m)
  3.  **Ontology:** Why? Because probability is a property of the class, not the person. (10m)
  4.  **Epistemology:** The $N=1$ trap. Why we can't be too specific. (15m)
  5.  **Pragmatics:** Compliance and Utility. Choosing the class that works. (15m)
  6.  **Warning:** Data snooping vs. Class selection. (5m)
  7.  **Test:** Pick a rate and defend the trade-off. (10m)

  This order ensures they feel the problem before they try to solve it, and it forces them to accept that "it depends" is not a shrug, but a documented business decision.
