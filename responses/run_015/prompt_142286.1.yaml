      *   *Why?* This resolves the Rigidity issue (MinK doesn't require Rigidity unless constraints dictate it), resolves the Expectation issue (MinK handles linear constraints), and resolves the Diachronic issue (MinK *is* the diachronic norm, so you admit you aren't a Radical Probabilist in the strict sense).
      *   *Wait, is there a way to keep Radical Probabilism?* Some Radical Probabilists argue MinK is just an application of synchronic coherence on a larger space (time-slices). But (3) frames it as a justification for a rule.
      *   *Actually, the biggest blocker is (2) vs (4).* You literally cannot write a paper saying "JC is the rule" and "Rigidity fails."
      *   So, the single revision must address the JC/Rigidity clash.
      *   *Recommendation:* Drop (2). Replace with "MinK subject to constraints." This allows (4) (Rigidity can fail if constraints imply it), allows (6) (constraints aren't just partitions), and clarifies (3). It forces a tweak to (1) (admitting a diachronic principle of conservatism).

