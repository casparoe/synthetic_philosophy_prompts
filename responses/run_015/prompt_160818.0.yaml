answer: |-
  # Diagnostic Tree: Treatments of Inconsistency

  **Instructions:** Start at the root. Answer each question based on your intuition about the **concrete case** described. Follow the branch to the next node or a final position (Leaf).

  **Root Node (Case e):** *Two reliable sources contradict (one says $P$, one says $\neg P$). You merge them.*
  **Q1:** Is the contradiction a **mistake** (one source is wrong, to be corrected) or a **feature** (the merged state is genuinely inconsistent, to be managed)?
  *   **Mistake** $\rightarrow$ Go to **Node 2** (Classical/Gap Path)
  *   **Feature** $\rightarrow$ Go to **Node 7** (Paraconsistent/Instrumental Path)

  ---

  ### Left Branch: Mistake / Correction (Classical & Gap)

  **Node 2 (Case b):** *A man is on the borderline of baldness.*
  **Q2:** Is the sentence "He is bald or he is not bald" **true**?
  *   **Yes** $\rightarrow$ Go to **Node 3** (Classical)
  *   **No** $\rightarrow$ Go to **Node 4** (Gap Theory)

  **Node 3 (Case d):** *Two valid statutes contradict (one requires $X$, one forbids $X$).*
  **Q3:** Do you resolve this by **prioritizing** one statute (making the other void) or allowing **discretion** (both remain valid but conflict)?
  *   **Prioritize** $\rightarrow$ **Leaf 1: Strict Classical**
  *   **Discretion** $\rightarrow$ **Leaf 2: Classical Pragmatist**

  **Node 4 (Case g):** *A moral dilemma: You ought to do $A$ and ought to do $\neg A$.*
  **Q4:** Is it true that you **ought to do both** (conflict of duties) or **ought to do neither** (duties cancel)?
  *   **Ought Both** $\rightarrow$ **Leaf 3: Normative Glut**
  *   **Ought Neither** $\rightarrow$ Go to **Node 5** (Gap Logic)

  **Node 5 (Case c):** *Revenge: A sentence says "This sentence is gappy".*
  **Q5:** Does this new sentence **break your system** (create a new paradox) or **fit comfortably** (as just another gap)?
  *   **Breaks System** $\rightarrow$ **Leaf 4: Contextual Gap**
  *   **Fits Comfortably** $\rightarrow$ **Leaf 5: Stable Gap (K3)**

  **Node 6 (Case h):** *Disjunctive Syllogism: "A or B", "Not-A".*
  *(Reached if Node 5 implies logic must handle gaps)*
  **Q6:** Does "B" **follow** even if "A" is a gap?
  *   **Yes** $\rightarrow$ **Leaf 6: Classical with Gaps**
  *   **No** $\rightarrow$ **Leaf 7: Non-Classical Gap** *(See Note 1)*

  ---

  ### Right Branch: Feature / Management (Paraconsistent & Instrumental)

  **Node 7 (Case a):** *The Liar Sentence: "This sentence is false".*
  **Q7:** Do you **assert** the sentence (accept it as true) or **reject** it (deny it is true)?
  *   **Assert** $\rightarrow$ Go to **Node 8** (Dialetheism)
  *   **Reject** $\rightarrow$ Go to **Node 11** (Instrumentalism)

  **Node 8 (Case h):** *Disjunctive Syllogism: "Liar or Snow is White", "Not-Liar".*
  **Q8:** Does "Snow is White" **follow**? (Can you infer from a contradiction?)
  *   **Yes** $\rightarrow$ Go to **Node 9** (LP Style)
  *   **No** $\rightarrow$ Go to **Node 10** (Relevant Style)

  **Node 9 (Case c):** *Revenge: "This sentence is not true".*
  **Q9:** Does your logic handle this **uniformly** (same rules as Liar) or via **hierarchy** (levels of truth)?
  *   **Uniformly** $\rightarrow$ **Leaf 8: Naive Dialetheism (LP)**
  *   **Hierarchy** $\rightarrow$ **Leaf 9: Hierarchical Dialetheism**

  **Node 10 (Case i):** *Curry Paradox: "If this is true, then everything is true".*
  **Q10:** To block this, do you restrict **Contraction** (using premises twice) or the **Conditional** (if-then)?
  *   **Contraction** $\rightarrow$ **Leaf 10: Substructural Dialetheism**
  *   **Conditional** $\rightarrow$ **Leaf 11: Non-Classical Conditional**

  **Node 11 (Case f):** *Inconsistent Science (e.g., Early Calculus).*
  **Q11:** Was the theory **true** (despite inconsistency) or merely **useful** (instrumental)?
  *   **True** $\rightarrow$ **Leaf 12: Scientific Dialetheism** *(See Note 2)*
  *   **Useful** $\rightarrow$ Go to **Node 12** (Engineering)

  **Node 12 (Case d):** *Legal Contradiction (from Right Branch).*
  **Q12:** Do you reason **globally** (one logic for all law) or **locally** (chunk statutes, permeate conclusions)?
  *   **Globally** $\rightarrow$ **Leaf 13: Global Paraconsistency**
  *   **Locally** $\rightarrow$ **Leaf 14: Chunk & Permeate**

