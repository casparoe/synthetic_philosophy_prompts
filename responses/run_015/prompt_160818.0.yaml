  ### Notes for the Instructor

  **1. Indistinguishable Leaves & Flags**
  *   **Leaf 5 (Stable Gap) vs. Leaf 7 (Non-Classical Gap):** These are often conflated. Standard K3 (Leaf 5) validates Explosion *vacuously* (premises never true). Leaf 7 requires a validity shift (preservation of non-falsity) to block Explosion substantively. If your students define validity strictly as "Truth Preservation," Leaf 7 is empty.
  *   **Leaf 8 (LP) vs. Leaf 9 (Hierarchical):** Distinguished *only* by Case (c) Revenge. If the student accepts a uniform truth predicate, they land on 8. If they require a hierarchy to avoid paradox, they land on 9.
  *   **Leaf 12 vs. Leaf 8:** Both accept true contradictions. Leaf 12 restricts them to scientific theories; Leaf 8 accepts them semantically (Liar). If the student thinks *only* science has gluts, they are at 12. If *all* semantic closures have gluts, they are at 8.

  **2. Empty or Unoccupied Cells**
  *   **Gap + Explosion Failure (without Validity Shift):** *Incoherent.* If gaps exist (K3) and validity = truth preservation, $A \land \neg A$ is never true, so Explosion holds vacuously. To occupy this cell, one must change the definition of validity (see Check 1).
  *   **Classical + True Contradiction:** *Incoherent.* Classical logic proves $\neg(A \land \neg A)$. One cannot hold Classical Logic and assert a true contradiction without triviality.
  *   **Instrumental (Leaf 14) + Ontological Glut:** *Unattractive.* "Chunk & Permeate" is an engineering solution for managing error. If contradictions are *true* (Ontological), there is no need to "chunk" them to avoid explosion; one should accept Explosion's failure globally (Leaf 8).

  **3. Check 1: Gaps and Explosion**
  *   *Your Assumption:* "If nothing is both true and false... ex contradictione quodlibet follows for free."
  *   *Verdict:* **Correct, provided Validity = Truth Preservation.** In K3 (Gaps), $A \land \neg A$ is never designated (true). Thus, there is no model where premises are true and conclusion false. Explosion is valid.
  *   *Tree Fix:* The handout fixes Validity as **Preservation of Truth (or Designated Value)**. Under this definition, Gap theories (Leaf 5) are *not* paraconsistent. They appear on the "Mistake" branch because they seek to avoid contradiction, not tolerate it. If a student claims Gaps block Explosion, they are implicitly using "Preservation of Non-Falsity," which moves them to Leaf 7.

  **4. Check 2: Gluts vs. Paraconsistency**
  *   *Your Assumption:* "Glut-theoretic and paraconsistent [are] a single leaf."
  *   *Verdict:* **Incorrect.** They are separable.
      *   **Paraconsistency** is a property of the *logic* (Explosion fails).
      *   **Dialetheism (Gluts)** is a property of the *world/truth* (Some contradictions are true).
  *   *The Separating Case:* **Case (f) Science / Case (d) Law.** One can argue that we should *reason* paraconsistently about inconsistent laws or theories (Leaf 14, 13) because they are useful or unavoidable, *without* believing the contradictions are *true* (Leaf 11).
  *   *Tree Representation:* The tree separates them at **Node 7**. "Assert" (Glut) leads to Dialetheism (Leaves 8-10, 12). "Reject" (No Glut) leads to Instrumentalism (Leaves 11, 13, 14). This explicitly shows that one can block Explosion (Paraconsistency) without accepting True Contradictions (Gluts).

  **5. Engineering vs. Truth (Leaf 14)**
  *   **Chunk & Permeate** (Leaf 14) is an engineering stance. It does not claim contradictions are true. It claims that *inference* should be restricted to prevent contamination from inconsistent data. This leaf is crucial for students who want to use paraconsistent tools without metaphysical commitment. It collapses into "Classical Pragmatist" (Leaf 2) if the chunks are strictly classical, but remains distinct if the permeation rules are non-classical.
