      *   *Takeaway for Non-Specialist:* The tension is real, but the "collapse" is exaggerated. Institutions need a hybrid approach. Contractualism protects rights/individuals; Cost-Effectiveness protects overall welfare. The friction is a feature, not a bug.
      *   *Generalization:* Does this kill all non-aggregative views? No. Rights-based views can bite the bullet (save the one) or use thresholds. Contractualism is uniquely vulnerable because it tries to *justify* principles to individuals, making the "one vs. many" comparison central.

  4.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the journalist's sharp eye. This is the "Numbers Problem" for contractualism.
