          *   *Actually, looking closer at Scanlon:* Scanlon explicitly addresses this in *What We Owe to Each Other*. He allows for "aggregation" in cases of small burdens vs. large burdens if the small burdens are sufficiently numerous to create a *generic reason* that outweighs the single large burden, *provided* the small burdens are not trivial. But the 1 vs 100,000 case is the hard case.
