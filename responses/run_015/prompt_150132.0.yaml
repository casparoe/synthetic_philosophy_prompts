answer: |-
  # Teaching Plan: Analogy as the Engine of Categorisation
  **Based on Hofstadter & Sander, *Surfaces and Essences***
  **Time:** 40 Minutes
  **Resources:** Whiteboard, markers (black, red, blue)
  **Audience:** 2nd Year CogSci Graduates

  ## Learning Objective
  By the end of the session, students must understand that analogy is not a high-level cognitive tool used *after* categorisation, but the fundamental mechanism *by which* categories are constructed and shifted in real-time.

  ## Whiteboard Layout
  *   **Left Third:** "The Old Model" (Boxes/Containers).
  *   **Centre:** The Carrying Example (Diagrammatic).
  *   **Right Third:** "The H&S Model" (Fluid/Slippage).

  ---

  ## Phase 1: Disrupting the "Box" Model (0–5 mins)
  **Goal:** Prevent the trivial takeaway ("metaphors are nice"). Establish that *all* concepts are analogies.

  1.  **Draw (Left Third):** Draw three distinct, rigid boxes labelled 'CHAIR', 'STOOL', 'SOFA'. Draw an arrow between them labelled 'Analogy'.
  2.  **Ask:** "In the classical view, what is happening here?"
      *   *Expected answer:* We have pre-existing categories, and we compare them.
  3.  **The Pivot:** Cross out the boxes. Draw a single, amorphous cloud labelled 'FURNITURE FOR SITTING'. Inside, draw faint, shifting boundaries.
  4.  **State the Thesis:** "Hofstadter and Sander argue there are no boxes. There is only the cloud. You do not recognise a stool *because* it fits the 'stool' box. You recognise it because it triggers an analogy to every other time you sat down. **Categorisation is frozen analogy.**"
  5.  **Misconception Kill #1 (Pre-existing Categories):**
      *   *Explicitly state:* "If you leave here thinking analogy is just comparing two fixed ideas, you've missed the point. Analogy *creates* the fixity. It is the engine, not the passenger."

  ## Phase 2: The Carrying Example – "The Stuck Jar" (5–20 mins)
  **Goal:** Demonstrate physical causation and the unconscious nature of analogy.
  **Constraint:** Physical causation, no alphabet shapes.

  1.  **Draw (Centre):** A simple sketch of a jam jar with a lid.
  2.  **Scenario Setup:** "You pick up a jar. It's stuck. You want the contents."
  3.  **Elicit Actions:** Ask the room for ways to open it. Write them up as branches from the jar:
      *   *Twist hard (Grip).*
      *   *Tap the lid on the counter (Impact).*
      *   *Run under hot water (Thermal expansion).*
      *   *Use a rubber grip aid (Friction).*
      *   *Spoon under the seal (Pressure equalisation).*
  4.  **The Cognitive Move:**
      *   Ask: "When you tap the lid on the counter, are you 'twisting'?" (No). "Are you 'heating'?" (No).
      *   "Yet, you categorise all five actions under the concept **OPENING**."
  5.  **The H&S Insight:**
      *   Explain that your brain does not have a definition of 'OPENING' stored in a dictionary.
      *   It retrieves a past experience (e.g., twisting a tap) and *slips* the variables to fit the jar.
      *   The causal mechanism changes (thermal vs. mechanical), but the *essence* (accessing contents) is preserved via analogy.
  6.  **Misconception Kill #2 (Analogy is Conscious):**
      *   *Timing:* Immediately after listing the actions.
      *   *Action:* Ask, "Did you consciously think 'This impact is analogous to torque' when you tapped the lid?"
      *   *Point:* "No. It was immediate. If analogy required conscious comparison, you'd starve before opening breakfast. Analogy is the substrate of perception, not a deliberate strategy."

  ## Phase 3: Slippability & Pattern Matching (20–30 mins)
  **Goal:** Distinguish H&S "Slippability" from standard "Pattern Matching".

  1.  **Draw (Right Third):** Write the word **OPEN**. Draw arrows radiating out to: *Jar, Door, Zipper, Meeting, Wound*.
  2.  **The Problem with Pattern Matching:**
      *   Explain that standard AI/Classical CogSci views this as feature matching (e.g., 'has an aperture', 'allows access').
      *   H&S argue this is wrong. Sometimes features don't match.
  3.  **Introduce Slippability:**
      *   "Concepts are not rigid. They stretch under pressure."
      *   Return to the Jar. "If I smash the jar with a hammer to get the jam, have I 'opened' it?"
      *   *Discussion:* Some will say yes (access gained), some no (container destroyed).
      *   **Key Point:** The category 'OPEN' *slips* to accommodate the goal (access) over the method (preservation). The concept itself changes shape to fit the context.
  4.  **Misconception Kill #3 (Analogy = Pattern Matching):**
      *   *Timing:* During the "Smashed Jar" discussion.
      *   *Action:* "Pattern matching looks for shared features. Slippability looks for shared *essence* despite conflicting features. If it were just pattern matching, smashing the jar would never equal opening it, because 'smashing' contradicts 'preserving'. Slippability allows the concept to break its own rules."

  ## Phase 4: Check Question & Wrap (30–40 mins)
  **Goal:** Verify grasp of slippability vs. superficial similarity.

  1.  **The Setup (5 mins):**
      *   Tell them: "I'm going to give you a scenario. I want a show of hands for Yes/No. Then I want one sentence on *why* the category slipped or held."
  2.  **The Check Question (5 mins):**
      *   **Scenario:** "A surgeon performs a tracheotomy on a choking victim using a pocket knife because no scalpel is available. We agree this is 'SURGERY'."
      *   **Twist:** "A hiker uses a pocket knife to cut a seatbelt to free a trapped passenger. Is this 'SURGERY'?"
      *   **Follow-up:** "If you say No, what specific conceptual slot had to *slip* for it to become Surgery? If you say Yes, what broke?"
  3.  **Desired Answer (Grasping Slippability):**
      *   *Superficial answer:* "No, because there's no doctor/hospital." (Feature matching – **Fail**).
      *   *Target answer:* "It depends on if the concept of Surgery slips from 'medical procedure' to 'cutting flesh to save life'. If the essence is 'saving life via incision', the category slips to include the hiker. If the essence is 'clinical setting', it holds."
      *   *Success Criteria:* They must identify that the *definition of the category itself* is negotiable based on the analogy, not fixed by pre-existing features.
  4.  **Wrap Up:**
      *   Reiterate: "You are not sorting the world into boxes. You are constantly re-drawing the lines. That is what thinking is."

  ---

  ## Instructor Notes: Common Pitfalls
  *   **Don't let them drift into Linguistics:** If they start talking about "metaphorical language" (e.g., "time is money"), pull them back. Remind them this is about *perceiving the jar*, not *speaking about the jar*.
  *   **Watch the Time:** The "Stuck Jar" discussion can easily run over. Cut off the brainstorming of jar-opening methods at 15 mins sharp to ensure time for Slippability.
  *   **British English Check:** Ensure you write "Categorisation", "Realise", "Programme", "Centre" on the board to maintain consistency with their coursework expectations.

  ## Misconception Summary Table

  | Misconception | Where it arises | Kill Point in Plan | How to Kill It |
  | :--- | :--- | :--- | :--- |
  | **Categories are fixed boxes** | Intro / Classical view | **Phase 1 (0-5 mins)** | Draw the cloud, not the boxes. State "Concepts are frozen analogies". |
  | **Analogy is conscious/deliberate** | During Example | **Phase 2 (5-20 mins)** | Ask if they consciously compared the tap to the jar lid. Emphasise speed of perception. |
  | **Analogy is feature matching** | During Slippability | **Phase 3 (20-30 mins)** | Use the "Smashed Jar". Show that features contradict, but essence aligns via slippage. |
