answer: |-
  | Survey Concept | Assembly Equivalent | Function |
  | :--- | :--- | :--- |
  | **Population** | Electorate | The whole to be represented |
  | **Sampling Frame** | Voter/Residency Rolls | Source pool for selection |
  | **Sample (N=90)** | Assembly Members | The representative body |
  | **Measurement** | Deliberation | Process of forming judgment |
  | **Data Point** | Individual Vote | Input to final recommendation |
  | **Margin of Error** | Deliberative Quality | Confidence in the outcome |
  | **Non-Response** | Declined Invitations | Selection bias risk |

  **Where the Mapping Breaks**
  The consultant's analogy treats opinions as static attributes to be measured, like height or income. In reality, assembly opinions are dynamic outputs produced by interaction. A survey sample must be passive to avoid bias; an assembly must be active to function. Consequently, the "margin of error" isn't statistical uncertainty about pre-existing will, but uncertainty about whether the deliberation was sufficiently informed and inclusive. The "estimator" isn't aggregating prior preferences but constructing new judgments. This break matters profoundly because it shifts the goal from *mirroring* the public to *modeling* what the public would decide under ideal conditions.

  **Verdict on the Three Moves**
  **(1) 90 is plenty:** **Valid, but for the wrong reason.** Statistically, 90 yields a high margin of error (~10%) for binary choices. However, cognitively, 90 is near the upper limit for effective plenary deliberation. You keep 90 not because it captures the population's variance statistically, but because it allows everyone to speak. Growing the chamber degrades deliberation, not statistical power.

  **(2) Council deferral:** **Risky.** The assembly does not reveal "what the city would have decided" (a counterfactual referendum); it reveals "what the city should decide after learning." Council cannot defer entirely because they retain responsibility for political feasibility and implementation. The assembly offers informed legitimacy, not a substitute for political accountability.

  **(3) Oversampling renters:** **Invalid.** In surveys, weighting corrects for subgroup size to ensure accurate *measurement*. In assemblies, weighting changes the *social microcosm*. A 2:1 renter oversample skewers the deliberative dynamics, potentially alienating homeowners and reducing the perceived legitimacy of the verdict as a "common good" rather than a factional win. Stratify for selection fairness, not for interest-group weighting.

  **A Better Analogy: The Jury**
  The census analogy fails because it implies measurement. The **jury** is the correct model. Like a jury, the assembly is a descriptive microcosm tasked with reaching a verdict based on evidence, not aggregating prior preferences.

  This analogy lets you conclude:
  1.  **Unanimity/Consensus > Majority:** Like juries, assemblies should aim for consensus to demonstrate that interests were reconciled, not just counted.
  2.  **Evidence Bound:** Jurors cannot decide on outside knowledge; similarly, assembly recommendations must be traceable to the evidence provided during the eight weekends.
  3.  **Verdict, not Poll:** The output is a judgment on the common good, not a snapshot of private interest.

  The consultant's survey logic tempts you to treat members as data points. The jury logic treats them as judges. Design for judgment.
