answer: |-
  **Project Title:** Disentangling the Sources of Prudential Value: A Variant Analysis of Simulated Lives

  **Project Summary**

  The familiar thought experiment involving a device capable of supplying a lifetime of subjectively seamless, pleasant experiences—the Experience Machine—is standardly invoked to refute hedonistic theories of well-being. The robust intuition that one should decline to connect permanently is taken as evidence that prudential value consists in more than positive conscious experience. However, this refusal is theoretically underdetermined. It is compatible with several competing explanations: a fundamental concern to remain in causal contact with reality, a concern to be the genuine author of one's actions and relationships, or a concern that one's life satisfy the preferences one would hold if fully informed. The standard discussion treats the refusal as a monolithic blow against experientialism, leaving it obscure which specific non-experiential condition is doing the normative work.

  My dissertation chapter proposes to resolve this ambiguity through a structured comparison of case variants. The central question driving this project is: **Does the intuitive refusal of simulated life track a requirement for causal contact with reality, genuine agency, or narrative authenticity?** By isolating these variables, I aim to determine which constraint is necessary for prudential value and which is merely contingent.

  To adjudicate this question, I will develop three paired contrasts. The first varies the status of the inactive body left in the real world: is it merely maintained, or is it put to socially useful work that the subject never experiences from the inside? This isolates whether the value of reality lies in mere contact or in objective impact. The second contrast varies the subject's epistemic state: does the subject retain continuous awareness that the experiences are simulated, or is that knowledge erased? This tests whether the deficit is a lack of truth or merely a lack of authentic engagement. The third contrast varies the internal structure of the simulation: is the life hedonically excellent but narratively fixed in advance, or hedonically mixed but responsive to the subject's ongoing choices? This distinguishes the value of agency from the value of pleasure.

  Systematic development of these variants is more illuminating than alternative methodologies for two reasons. First, collecting further brute intuitions about the original case yields diminishing returns; the refusal is already well-established, but its justification remains contested. Adding more testimonials does not disentangle the overlapping explanations. Second, proceeding by abstract analysis of well-being concepts alone risks disconnecting theory from the phenomenological data that motivates it. By varying specific parameters while holding others constant, this method functions as a conceptual control experiment. It forces competing theories to predict divergent intuitive responses, allowing us to see which theory best maps the contours of our prudential judgments.

  **Work Plan**

  The eight-week fellowship will support the completion of the dissertation chapter.

  *   **Weeks 1–2:** Formalize the three paired contrasts. I will draft precise descriptions of each scenario to ensure that variables are isolated cleanly, avoiding confounding factors that might muddy intuitive responses.
  *   **Weeks 3–5:** Analyze intuitive responses and theoretical implications. I will engage in structured conceptual testing, discussing the variants with peers to gauge stability of judgment, and map these judgments against hedonistic, desire-satisfaction, and objective list theories.
  *   **Weeks 6–7:** Draft the chapter. I will construct the argument, moving from the underdetermination of the standard case to the resolution offered by the variants.
  *   **Week 8:** Revision and refinement. I will polish the prose for clarity and ensure the argument withstands potential counter-interpretations.

  **Success Conditions and Risks**

  A successful result will demonstrate a divergence in intuitions across the variants that aligns with one specific explanation. For example, if subjects refuse the fixed hedonic simulation but accept the responsive mixed simulation, this indicates agency is the primary constraint. Conversely, if subjects refuse even when aware of the simulation but accepting real-world impact, contact with reality is paramount. The strategy fails if intuitions remain equivocal across all variants, suggesting that prudential value is too fragmented to be captured by a single necessary condition, or if the variants introduce new confounding variables that replicate the original underdetermination.

  There are two primary scope risks. First, the metaphysics of simulation could overshadow the ethical analysis. Debates about whether simulated objects are "real" could stall progress. I will contain this by stipulating the technology functions as described and bracketing ontological questions in favor of axiological ones. Second, there is a risk of proliferation, where generating further variants delays the argument. I will contain this by strictly limiting the analysis to the three specified contrasts. This project offers a pathway to move beyond the stalemate of the Experience Machine, providing a clearer topology of the non-experiential components of well-being.
