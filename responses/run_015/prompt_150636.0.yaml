              *   *Hypothesis:* It's not about her capabilities. It's about our *anthropocentrism*. We want understanding to be magical (the "heart").
              *   *Criterion Check:* The hesitation reveals a flaw in the Biographical Criterion. History + Accountability isn't enough for us. We want *ontological alignment* (being right about the world). If Klara is wrong about the Sun, we deny her mind, even if she's right about Josie. This suggests our definition of "mind" is tied to "shared reality," not just "coherent history."

