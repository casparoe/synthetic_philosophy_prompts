answer: |-
  ### 1. The Question

  **Essay Question (90 minutes, closed book)**

  Consider a polity described by two measured series: a **demographic proxy** (occupied site count or settled area) and an **institutional proxy** (administrative tiers, standardisation, monumental energy). Examine the following four stylised three-hundred-year trajectories:

  1.  Both proxies fall by >80% and remain low.
  2.  Demography falls >80%; institutions recover under new elites.
  3.  Institutions collapse; demography remains stable.
  4.  Neither proxy falls, but the polity is absorbed and erased under a new name.

  Complicate your analysis with **window sensitivity** (abruptness depends on measurement scale) and **hysteresis** (a system flipped may not return because the mechanism to rebuild it—e.g., a literate cadre—is destroyed, even if forcing conditions reverse).

  In a continuous essay, diagnose the dispute between the "collapse" and "transformation" camps. Is it merely verbal, a disagreement over which proxy defines the society, a dispute about reversibility in the hysteretic sense, or a normative disagreement resting on a "thick term" that identifies society with apparatus rather than population? You must explicitly analyse at least **two** of the four trajectories above. Conclude by stating what explanatory or predictive work, if any, the word "collapse" retains once this apparatus is sorted.

  ***

  ### 2. Model Answer

  The dispute between collapse and transformation is not merely verbal, though vocabulary plays a role. It is fundamentally a normative disagreement about what constitutes the identity of a society, sharpened by the physical reality of hysteresis. To resolve it, we must stop treating "society" as a monolith and accept that the demographic and institutional proxies track different ontological objects.

  Trajectory 1 (both proxies crash) is the only case where both camps agree on the label. Here, the loss of bodies and the loss of apparatus coincide. However, Trajectory 3 (institutional collapse, demographic stability) reveals the fault line. The transformation camp calls this continuity because the population persists; the collapse camp calls it failure because the state apparatus vanishes. This is not just semantics; it is a choice of identification. If we define the polity by its people, Trajectory 3 is transformation. If we define it by its bureaucratic capacity, it is collapse. The term "collapse" functions here as a thick term: it describes a loss while simultaneously ranking it as a failure. It quietly privileges the institutional proxy over the demographic one, equating the society with its elites rather than its inhabitants.

  However, the dispute gains substantive traction when we introduce hysteresis. In critical transitions, a system does not return to its former state when forcing reverses because the internal mechanism required to maintain that state is gone. In Trajectory 3, even if the climate stabilises and population density remains high, the polity may not return because the literate cadre, fiscal habits, and partner networks have been destroyed. The water is clear, but the litter is gone. This makes the institutional loss irreversible in a way that demographic fluctuation is not. Therefore, the disagreement is not only about naming but about reversibility.

  Consequently, the word "collapse" retains explanatory work only if it signals a hysteretic threshold. It should not merely describe a decline in complexity, which might be cyclical. It must denote a crossing of a point of no return where the mechanism for complexity is extinguished. If used loosely to describe any reduction in institutional proxy (including reversible dips), the term loses predictive power. Used strictly to mark hysteretic breaks, it warns us that restoring external conditions will not restore the system. Thus, "collapse" is valid not as a moral judgment on suffering, but as a technical warning about the destruction of systemic capacity. We should reserve it for Trajectory 1 and irreversible instances of Trajectory 3, acknowledging that for the population in Trajectory 3, life may continue even if the "polity" has genuinely ended.

  ***

  ### 3. Marking Scheme

  **Total Marks: 25**

  **1. Proxy Distinction (5 marks)**
  The answer must clearly distinguish between the demographic proxy (people) and the institutional proxy (apparatus). It must acknowledge that these can diverge.
  *   *5 marks:* Clear distinction maintained throughout.
  *   *0-2 marks:* Proxies conflated or treated as identical.

  **2. Trajectory Application (5 marks)**
  The answer must explicitly analyse at least two of the four provided trajectories to test the definitions.
  *   *5 marks:* Two trajectories analysed with specific reference to the proxy behaviour.
  *   *0-2 marks:* Trajectories ignored or discussed only in the abstract.

  **3. Hysteresis Mechanism (5 marks)**
  The answer must apply hysteresis honestly as a mechanism loss (e.g., literate cadre), not as a metaphor for "change."
  *   *5 marks:* Explains why reversing forcing does not restore the state due to destroyed capacity.
  *   *0-2 marks:* Uses hysteresis as a synonym for "permanent change" without mechanism.

  **4. Normative/Thick Term Analysis (5 marks)**
  The answer must address whether "collapse" is a thick term that ranks loss as failure and identifies society with apparatus.
  *   *5 marks:* Explicitly discusses the normative identification (elites vs. population).
  *   *0-2 marks:* Treats the dispute as purely empirical or purely verbal.

  **5. Explanatory Utility (5 marks)**
  The conclusion must state what predictive work the concept retains (e.g., signaling irreversible thresholds).
  *   *5 marks:* Clear statement on utility conditional on strict definition.
  *   *0-2 marks:* Vague conclusion or claims the word is useless.

  **A vs. B Separator:**
  The move that separates an A (20+) from a B (15-19) is **Hysteresis Mechanism**. A B-level answer will treat hysteresis as a poetic flourish regarding permanence. An A-level answer will explain *why* the state cannot return (loss of specific rebuilding mechanisms) and use this to justify the utility of the term "collapse."

  ***

  ### 4. Frequent Failures

  **1. The Verbal Dismissal (-5 marks)**
  *   *Mistake:* Declaring the dispute "merely verbal" and stopping there.
  *   *Why:* Students often think dissolving a definition solves the problem. It ignores the material reality of hysteresis and the normative stakes of identifying a society with its elites.

  **2. Proxy Slippage (-5 marks)**
  *   *Mistake:* Sliding between "people" and "state" without noticing.
  *   *Why:* Students assume a drop in monuments implies a drop in people. The apparatus forces them apart; ignoring this defeats the question's purpose.

  **3. Metaphorical Hysteresis (-5 marks)**
  *   *Mistake:* Treating hysteresis as a synonym for "long-lasting change."
  *   *Why:* This ignores the prompt's requirement for honest borrowing. Hysteresis is about path dependence and destroyed mechanisms, not just duration.

  **4. Data Settling Norms (-5 marks)**
  *   *Mistake:* Supposing better data could resolve whether Trajectory 3 is a "failure."
  *   *Why:* This misses the "thick term" requirement. Whether institutional loss counts as societal failure is a normative choice, not an empirical finding.
