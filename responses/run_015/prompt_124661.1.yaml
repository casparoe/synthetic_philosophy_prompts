answer: |-
  Here is a session plan designed for your specific audience and constraints.

  ### Session Goal
  To move the group from a unified, engineering-style intuition of "function" (design intent) to a fractured philosophical understanding where **History** (Etiological) and **Current Contribution** (Causal-Role) yield different answers.

  ### 1. The Core Example
  **Choose the Synthetic Gene Circuit.**

  *   **Why:** The Heart is too clean (history and current role match). The Appendix is too scientifically debated (is it truly vestigial or immune-active?). The Gene Circuit is the only case where *you* (the expert) know the history and the current role definitively diverge.
  *   **Audience Fit:** Retired engineers will immediately grasp the logic of a "component repurposed in a new system." It speaks their language of specifications vs. implementation.
  *   **What it must have:**
      *   **Documented History:** The promoter was originally selected (by evolution or prior breeding) specifically for a heat-shock response.
      *   **Documented Current Role:** In the *current* lab strain, it is exclusively used to drive fluorescence (a reporter trait).
      *   **What it must lack:** Ambiguity about whether the fluorescence helps the *lab system* (it does, by allowing observation) vs. whether it helped the *ancestor* (it didn't; heat shock did).
  *   **Teaching Note:** Strip the jargon. Call it a "Genetic Switch." Do not let the biology obscure the logic.

  ### 2. Sequence of Play (90 Minutes)

  **Phase 1: Smash the "Design" Intuition (0:00–0:15)**
  *   **Action:** Do not start with biology. Start with their engineering bias.
  *   **Move:** Ask, "If I build a bridge to hold cars, but people start living underneath it for shelter, what is its function?"
  *   **Goal:** Force them to admit that "Original Design" and "Current Use" can differ.
  *   **Crucial Correction:** Explicitly state: *"In biology, there is no Engineer. There is only History. When we say 'Etiological,' we do not mean 'Designed,' we mean 'Selected For.'"*
  *   **Why here:** If you wait, the engineers will interpret "Etiological" as "Divine Design" or "Optimal Engineering." You must clear this deck before introducing the theories.

  **Phase 2: Introduce the Core Example (0:15–0:35)**
  *   **Action:** Lay out the Gene Circuit case.
  *   **Move:** Present the facts:
      1.  **History:** Ancestor needed heat resistance. Selection kept this switch.
      2.  **Now:** Lab strain needs to glow. This switch drives the glow.
  *   **Discussion:** Ask the room: "Is the function heat resistance or glowing?"
  *   **Outcome:** The room will split. Some will say "It was made for heat" (History). Some will say "It makes it glow now" (Current).
  *   **Labeling:** *Only now* apply the labels.
      *   "Heat Resistance" = **Etiological Account** (History).
      *   "Glowing" = **Causal-Role Account** (Current System).
  *   **Why here:** You are deriving the philosophy from their intuition, not imposing philosophy onto them.

  **Phase 3: Correcting the "Accident" Misconception (0:35–0:50)**
  *   **The Risk:** Engineers will think Causal-Role means "Whatever random thing happens to work."
  *   **The Fix:** Define Causal-Role strictly as *"Contribution to the Capacity of the Containing System."*
  *   **Move:** Ask: "If the glowing also heated the petri dish by 0.01 degrees, is that a function?"
  *   **Answer:** No. It contributes to the *experimenter's* system (observation), not the *organism's* system (survival/metabolism).
  *   **Why here:** You must stabilize the Causal-Role definition before testing it against the wild. Otherwise, they will think Causal-Role is just "side effects."

  **Phase 4: The Cave Fish Twist (0:50–1:10)**
  *   **Placement:** Late Middle. Do not use this to introduce the split; use it to **stress test** it.
  *   **Action:** Present the vestigial eye detecting vibrations.
  *   **Move:** Map it to the Gene Circuit logic.
      *   History: Sight (Etiological).
      *   Current: Vibration (Causal-Role).
  *   **Visceral Hit:** This moves the debate from "Lab Artifacts" to "Real Nature." It shows that nature is full of repurposed junk, not just optimized engineering.
  *   **Why here:** If you put this early, they will get bogged down in the biology of cave fish. Now that they understand the *logic* from the Circuit, the Fish becomes a powerful emotional anchor.

  **Phase 5: Boundary Setting (1:10–1:20)**
  *   **Action:** Explicitly list what you are **not** explaining.
  *   **Say this:** *"We are treating 'Etiological' as one block. I am not distinguishing between Wright and Millikan today. We are also ignoring 'Malfunction.' If the heart stops pumping, we aren't asking if it's broken; we are asking what 'pumping' means in the first place."*
  *   **Why:** This protects you from questions you can't answer and keeps the session focused on the *split*, not the internal debates of the theories.

  **Phase 6: The Final Check (1:20–1:30)**
  *   **Action:** Ask the one question (see below).
  *   **Goal:** Verify they aren't just nodding.

  ### 3. The Final Check Question
  Do not ask for definitions. Ask for a verdict on a new case.

  **The Question:**
  > "Imagine a species of moth where wings evolved for flight (History). Due to climate change, they no longer fly, but their wing-beats now create a sound that scares off predators (Current Contribution).
  >
  > **If I ask an Etiological theorist 'Do the wings have a function?', what will they say? If I ask a Causal-Role theorist, what will they say?**"

  **The Answer Key:**
  *   **Etiological:** Yes, function is Flight (even if they can't do it anymore) OR No function (if flight is impossible). *Accept either, provided they justify it via History.*
  *   **Causal-Role:** Yes, function is Predator Deterrence (because it contributes to survival now).
  *   **Fail State:** If they say "Both say Predator Deterrence" or "Both say Flight," they missed the split.

  ### 4. Summary of Misconception Management

  | Misconception | When to Head Off | How to Phrase It |
  | :--- | :--- | :--- |
  | **"Function = Design Intent"** | **Phase 1 (Start)** | "Biology has no blueprint. History replaces Intent." |
  | **"Causal-Role = Random Accident"** | **Phase 3 (Mid)** | "It's not just 'what happens.' It's 'what contributes to the system's capacity.'" |
  | **"Etiological = Perfect Engineering"** | **Phase 4 (Cave Fish)** | "History can be obsolete. The eye proves history doesn't care about current utility." |

  ### 5. What to Refuse
  You must be willing to say: **"That is a different debate."**

  1.  **Internal Etiological Debates:** If someone asks about "Proper Function" vs. "Selected Effect" (Wright vs. Millikan), tell them: *"For today, we treat all history-based accounts as one team."*
  2.  **Malfunction:** If someone asks, "What if the heart fails?", tell them: *"We are defining success, not failure. We are bracketing pathology."*
  3.  **Artifacts:** If the poet asks about the function of a poem, tell them: *"We are strictly limiting this to biological traits today. Artifacts introduce human intent which muddies the water."*

  ### 6. Final Advice for the Biologist
  You are the authority in the room, but you are new to the philosophy. Lean on your biology. When the engineers try to logic-chop the definitions, pull them back to the **organism**.
  *   *"Does this definition help me understand why this trait is here?"*
  *   *"Does this definition help me predict what happens if I remove it?"*

  Keep it grounded in the dirt and the lab bench. That is your home turf.
