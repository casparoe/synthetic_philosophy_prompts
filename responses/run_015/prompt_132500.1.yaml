answer: |-
  Constructing a coherent theory that treats social sanction as genuine punishment is possible only by redefining authority away from institutional mandates, though this creates unavoidable tension with traditional requirements for due process and legitimacy. To succeed, such a theory must satisfy the following desiderata, categorised by case coverage, conceptual distinctions, and empirical observations.

  **1. Case Coverage Requirements**
  *   **The Public vs. Private Asymmetry:** The theory must explain why deplatforming a public figure feels punitive whilst dogpiling a private citizen often registers as harassment, despite similar mechanisms.
      *   *Why:* Public figures possess assumed consent to scrutiny; private persons do not. A theory of punishment must account for the normative expectation of immunity.
      *   *Status:* **Non-Negotiable (NN).** Failure here collapses the theory into a blanket claim that all criticism is punishment.
  *   **The Asynchronous Sanction:** It must accommodate sanctions applied years later by actors unconnected to the original offence.
      *   *Why:* Traditional punishment requires a temporal link between crime and sanction. Distributed memory alters this causality.
      *   *Status:* **NN.** If the theory cannot handle time-displaced enforcement, it fails to describe the phenomenon accurately.

  **2. Conceptual Distinctions**
  *   **Punishment vs. Boycott vs. Shunning:** The framework must distinguish moralised sanction (punishment) from economic preference (boycott) or intimate exclusion (shunning).
      *   *Why:* Boycotts are market signals; shunning is relational withdrawal. Punishment implies a moral debt paid through suffering.
      *   *Status:* **NN.** Collapsing these renders the concept of punishment vacuous.
  *   **Coordinated Intent vs. Emergent Mob:** It must differentiate between organised campaigns and algorithmic contagion.
      *   *Why:* Punishment traditionally implies agency. Emergent behaviour lacks a singular punisher.
      *   *Status:* **Camp-Specific (CS).** Retributivists require intent; consequentialists may accept emergent outcomes.
  *   **Platform Power vs. Peer-to-Peer:** The theory must address the role of intermediaries (Twitter, employers) who enforce the sanction.
      *   *Why:* Deplatforming relies on private infrastructure acting as quasi-state regulators.
      *   *Status:* **NN.** Ignoring the infrastructure ignores the mechanism of confinement.

  **3. Empirical Observations**
  *   **Absence of Due Process:** It must explain how punishment occurs without trial, appeal, or codified rules.
      *   *Why:* Procedural justice is central to legitimate punishment. Its absence suggests tyranny or violence rather than justice.
      *   *Status:* **NN.** A theory claiming this is 'just' punishment must reconcile this deficit.
  *   **The Carceral Experience:** It must account for targets reporting feelings of confinement and surveillance despite physical liberty.
      *   *Why:* Phenomenology matters; if it walks and talks like prison to the target, the theory must explain the psychological confinement.
      *   *Status:* **NN.** Dismissing the target's experience invalidates the theory's descriptive power.
  *   **Enforcer Denial:** It must reconcile the punitive effect with the enforcers' insistence that these are merely 'consequences'.
      *   *Why:* Punishment requires an imposer. If imposers deny imposing, the agency is obscured.
      *   *Status:* **CS.** Foucaultians see this as diffuse power; legalists see it as a lack of punitive intent.

  **Joint Unsatisfiability Check**
  There is a high probability that the triad of **Distributed Authority**, **Punitive Experience**, and **Legitimacy** is jointly unsatisfiable. Traditional jurisprudence defines punishment via institutional authority and due process. To accept distributed social sanction as punishment (matching the Experience), one must discard Institutional Authority. However, without Authority, the claim to Legitimacy (that this is 'justice' rather than 'mob violence') collapses. You may have punishment without legitimacy (tyranny) or legitimacy without punishment (social norms), but claiming distributed sanction is *legitimate punishment* creates a category error unless one radically redefines law itself.

  **Theory Scoring**
  *   **Retributive:** **Poor.** Fails on Authority and Due Process (NN). It cannot justify suffering without a legitimate judge and codified law. It struggles with the Enforcer Denial (CS), as retribution requires intentional infliction.
  *   **Deterrent:** **Moderate.** Handles the Asynchronous Sanction and Carceral Experience (NN) well, as fear operates regardless of procedure. However, it struggles to distinguish Punishment from Boycott (NN) if the outcome is merely behavioural modification.
  *   **Expressive/Social-Cohesion:** **Good.** Explains the Emergent Mob and Enforcer Denial (CS) effectively; the act is about boundary maintenance, not individual justice. It falters on the Private Person Case (NN), as cohesion often sacrifices the individual unjustly.
  *   **Disciplinary/Power-Knowledge (Foucaultian):** **Best Fit.** Reconciles Distributed Authority, Carceral Experience, and Enforcer Denial (NN) by framing punishment as diffuse surveillance rather than sovereign decree. However, it risks collapsing the Punishment vs. Shunning distinction (NN) by viewing all social control as punitive power.
