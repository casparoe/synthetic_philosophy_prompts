  hey — im not a philosopher, I write the dispatch/allocation code for a small air-ambulance service: two aircraft, a stack of patients each with a severity score and a time window, and a scheduler that has to decide who gets picked up on the next sortie under fuel, seat and daylight constraints. So the vocabulary I actually live in is objective functions, hard constraints, shadow prices, expected lives saved per sortie, per-patient ex-ante pickup probability, randomized tie-breaking for identical cases, ex-ante vs ex-post evaluation, and (whenever the funders are on the call) "fairness constraints" bolted onto the objective. Recently we started logging, for every patient on the manifest, the ex-ante probability that they personally get lifted, and reporting it next to expected-lives-saved — and annoyingly the two numbers sometimes rank two candidate sortie plans in opposite orders. My crew chief says the second one is the only one that means anything, because it's the one a patient could rely on in advance.

