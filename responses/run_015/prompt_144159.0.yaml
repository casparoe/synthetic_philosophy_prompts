answer: |-
  Based on your track record, you are not running a standard Effective Altruism circle, nor are you a traditional community grant fund. You have a distinct, hybrid operating principle.

  ### 1. The Rule You Are Actually Running
  **"Counterfactual Additionality with a Plausibility Floor."**

  You are not maximizing "Goodness" in the abstract; you are maximizing **"What Only We Will Do."**

  *   **The Core Signal:** The Hospice decision is your Rosetta Stone. You rejected a good cause with personal ties because *"our money wouldn't have added anything."* Conversely, you funded the Reading Programme not because it was the *best* cause, but because *"nobody else was going to pay for that particular bit."*
  *   **The Constraint:** You have a "Plausibility Floor." You rejected the Pathogen Labs because you *"couldn't see how to tell if it had done anything."* However, you lowered this floor for the Rare Disease research (funding it partially) and the Meta-Research (overruling the skeptics), suggesting that **Neglectedness can override Evidence, but not Measurement.**
  *   **The Verdict:** You are **Gap Fillers.** You fund specific, unfunded slices of problems where your money is the deciding factor, provided there is a plausible story that the money leads to a result.

  ### 2. The Fish Decision: Which Past Decision Is It?
  The Fish Campaign is a hybrid of the **Reading Programme** and the **Hospice**, and you need to decide which one it truly is.

  *   **Why it looks like the Reading Programme (Fund):**
      *   **The Gap:** Like the Reading Programme, this is a *"specific bit nobody else is paying for."* You note "nobody else is funding anything on fish here."
      *   **The Leverage:** Like the Meta-Research grant, this is a small input for a potentially large systemic change (changing a supermarket's supply chain).
      *   **The Cost:** It is cheap, fitting your "tiny giving circle" constraints.

  *   **Why it looks like the Hospice (Reject):**
      *   **The Shuffling Objection:** Your member who says *"the supermarket will just buy from a farm still using the old method"* is making the exact same argument you used for the Hospice: *"our money wouldn't have added anything."* If the total suffering remains the same and is just moved elsewhere, your money has zero counterfactual impact.
      *   **The Measurement:** Like the Pathogen Labs, the evidence that campaigns change practice is "thin," and measuring actual fish suffering is harder than measuring bednet distribution.

  **The Decision:**
  You should **Fund**, but only if you can dismiss the "Shuffling" objection.
  *   If the campaign targets a specific method *and* the supermarket commits to not sourcing that method *anywhere*, it is the **Reading Programme** (a genuine gap).
  *   If the supermarket simply switches suppliers but keeps using the method, it is the **Hospice** (displacement, not impact).

  **Recommendation:** Follow the **Rare Disease** precedent. The moral uncertainty (do fish feel pain?) and impact uncertainty (will the campaign work?) mirror the "lottery ticket" nature of the disease research. Fund it, but perhaps not the full pot. Allocate £500–£1,000 as a high-risk, high-neglectedness bet, acknowledging the uncertainty. This maintains consistency with your willingness to fund "long shots" when they are sufficiently neglected.

  ### 3. What You Are Signing Up For
  *   **If You Fund:** You are accepting **Moral Uncertainty** as a valid risk. You have previously funded Bednets (high moral certainty). Funding fish means you agree that "potential high scale" outweighs "uncertain moral status." You are also prioritizing **Policy Leverage** over **Direct Aid**. You are saying that changing a rule (supermarket policy) is as valuable as direct help (bednets), even if the metrics are fuzzier.
  *   **If You Reject:** You are prioritizing **Measurement** over **Neglectedness.** You are effectively saying the Pathogen Labs decision was correct and the Rare Disease decision was a mistake. You are moving closer to a strict "Evidence-First" model, which may make it harder to find local or niche projects to fund in the future, as most "gaps" exist because they are hard to measure.

  ### 4. The Test Case for Next Year
  To definitively tell whether you are **Gap Fillers** (Additionality) or **Evidence Maximizers** (Proof), you need an application next year that pits these two values against each other.

  **The Application to Watch For:**
  A **Local Pilot Programme for a Proven Intervention.**
  *   **The Pitch:** "This intervention (e.g., a specific tutoring method or health screening) has rock-solid evidence globally (High Evidence). However, no one is running it *in our town* yet (High Additionality). We need £3k to start the pilot."
  *   **The Conflict:**
      *   If you are **Evidence Maximizers**, you will fund this immediately (it's like Bednets).
      *   If you are **Gap Fillers**, you might hesitate if you think the government or a larger charity *should* be doing it soon (like the Hospice).

  **The Real Tie-Breaker Application:**
  A **Project with Guaranteed Additionality but Zero Metrics.**
  *   **The Pitch:** "We are funding a community organizer to build relationships in a neglected neighborhood. We cannot measure the outcome for 5 years, and we cannot prove causality. But without us, this organizing simply will not happen."
  *   **The Verdict:**
      *   **Fund:** You are true **Counterfactual Additionality** runners (consistent with Meta-Research/Reading Programme).
      *   **Reject:** You are **Measurement** runners (consistent with Pathogen Labs), and you need to admit that your "Rare Disease" funding was an anomaly.

  **Summary:** Your group's identity is **"The Marginal Dollar."** You exist to fund the things that would not exist without you. The Fish Campaign fits this, provided it doesn't just shuffle the problem elsewhere. Fund it partially, treat it as a lottery ticket, and demand proof that the supermarket isn't just moving the suffering down the road.
