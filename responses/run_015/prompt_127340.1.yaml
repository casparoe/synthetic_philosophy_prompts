answer: |-
  The tension you are experiencing is not a false dichotomy; it reflects one of the oldest and most rigorous debates in epistemology and ethics. You are standing precisely at the intersection of **Evidentialism** (the view that belief must always track evidence) and **Pragmatism** (the view that belief can be justified by its practical consequences when evidence is insufficient).

  Your intuition aligns with W.K. Clifford, who famously argued in *The Ethics of Belief* (1877) that "it is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence." Clifford feared that divorcing belief from evidence corrupts our cognitive faculties and leads to societal harm.

  Your aunt's argument, however, is a near-textbook application of William James's rebuttal in *The Will to Believe* (1896). James argued that when faced with a **genuine option** that is **live, forced, and momentous**, and where evidence is inherently unavailable, we have the right to let our "passional nature" decide.

  To answer your question: Yes, there is a defensible principle that distinguishes ethically permissible practical beliefs from mere wishful thinking. However, it requires refining your aunt's position to avoid the trap of self-deception. The boundary lies in distinguishing between **asserting a historical fact** and **adopting a regulative ideal**.

  Here is a framework for evaluating whether this belief is ethically permissible.

  ### 1. The Criterion of Permanent Undecidability
  The first condition for your aunt's argument to hold is that the evidence must not just be *currently* missing, but *permanently* inaccessible. You stated that specialists disagree and relevant archives are destroyed. If this is truly the case, you are not ignoring evidence; you are acknowledging that the "truth-tracking" function of belief has reached its limit.

  In standard epistemology, the rational response to insufficient evidence is the suspension of judgment (agnosticism). However, suspension of judgment is only a viable option if it is cost-free. In your case, suspension of judgment has a cost: the potential dissolution of the community fund and the destabilization of relationships with descendants.

  **Principle 1:** *When a factual question is permanently undecidable, but the acceptance of one hypothesis is a necessary condition for sustaining a moral obligation, the pragmatic value of the belief becomes a relevant justificatory factor.*

  ### 2. The Distinction Between Constitutive and Regulative Belief
  This is the most critical philosophical boundary.
  *   **Constitutive Belief:** "I believe X happened" (claiming this is an objective fact about the past).
  *   **Regulative Belief:** "I will proceed *as if* X happened because it guides my moral conduct" (treating X as a necessary postulate for action).

  Immanuel Kant made a similar distinction regarding God and immortality. He argued we cannot *know* they exist (constitutive), but we must *postulate* them (regulative) to make sense of moral duty.

  If your family treats the grandmother's resistance as a **constitutive historical fact**, you risk intellectual corruption. You are claiming knowledge you do not have. However, if you treat it as a **regulative ideal**, you are saying: *"Whether or not she perfectly resisted, the narrative of resistance is the vessel that carries our obligation to this community. To abandon the narrative is to abandon the obligation."*

  **Principle 2:** *It is permissible to hold a belief for practical reasons if it is framed as a commitment to the values the belief represents, rather than a dogmatic assertion of historical data.*

  ### 3. The Harm Constraint (The Safeguard Against Wishful Thinking)
  The strongest argument against your aunt's position is the risk of harming third parties. If your grandmother *did* collaborate in a way that harmed specific individuals, maintaining the "resistance" narrative might insult their memory or obscure historical injustices they suffered. Wishful thinking becomes unethical when it erases the suffering of others to preserve the believer's self-image.

  However, if the "collaboration" your cousin suggests was a pragmatic negotiation to secure resources (as the cousin interpreted), that might not be morally distinct from "resistance" in outcome, only in method.

  **Principle 3:** *A practically motivated belief is ethically defensible only if its falsity would not inflict harm on third parties.*
  *   **Test:** If it were revealed tomorrow that she *did* negotiate with the administration, would the descendants you are helping feel betrayed? Or would they understand that survival under authoritarianism required ambiguity?
  *   If the former, the belief is self-serving and unethical.
  *   If the latter, the belief is a stabilizing narrative that serves a greater good.

  ### 4. Doxastic Voluntarism and Integrity
  You mentioned that you assume belief is involuntary. This is the doctrine of **Doxastic Involuntarism**. Most philosophers agree you cannot simply *choose* to believe the sky is green. However, you *can* choose where to direct your attention, how to weigh ambiguous evidence, and which actions to take that reinforce a belief.

  Your aunt is not asking you to hallucinate evidence. She is asking you to recognize that in the absence of evidence, **inaction is also a choice.** To suspend judgment is to choose to risk the collapse of the community fund.

  Therefore, the integrity at stake is not just *intellectual integrity* (accuracy of belief) but *moral integrity* (faithfulness to commitments). When these conflict, and truth is unknowable, moral integrity may take precedence without constituting corruption.

  ### Synthesis: The Principle of Moral Necessity
  To resolve your tension without collapsing into wishful thinking, you can adopt the **Principle of Moral Necessity**:

  > *In cases of permanent evidentiary ambiguity, one is permitted to adopt the belief that sustains necessary moral obligations, provided that:*
  > 1.  *The ambiguity is acknowledged openly (no denial of the doubt).*
  > 2.  *The belief functions as a commitment to future action rather than a dogmatic claim about the past.*
  > 3.  *Maintaining the belief does not actively harm or dishonor other vulnerable parties.*

  **How this applies to you:**
  You do not need to lie to yourself and say, "I know she was a hero." You can say, "The evidence is inconclusive, but the narrative of her resistance is the foundation of our duty to this community. Because that duty is real and the evidence is silent, I will honor the narrative as a binding commitment."

  This preserves your intellectual honesty (you admit the evidence is ambiguous) while validating your aunt's moral insight (that abandoning the narrative has unacceptable costs). It transforms the belief from a **claim about history** into a **vow for the future**.

  ### Conclusion
  The tension you feel is real. It is the friction between the **ethics of truth** and the **ethics of care**. Your aunt's reasoning is coherent if understood through William James's pragmatism, but it requires the safeguard of acknowledging the ambiguity rather than erasing it.

  If you treat the belief as a **tool for sustaining obligation** rather than a **fact to be defended**, you avoid intellectual corruption. You are not deceiving yourself about the past; you are choosing responsibility for the future. In the absence of truth, duty often has to stand in as the guiding light. That is not corruption; it is the burden of inheritance.
