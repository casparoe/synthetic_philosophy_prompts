answer: |-
  ### Stage 1: Brainstorming Candidate Concepts

  A specialist hearing your description would immediately reach for a cluster of terms from four distinct literatures. Here are the primary candidates:

  1.  **Subsidiarity (EU/German/Swiss context):** The principle that action should be taken at the lowest effective level. Your description suggests a *failure* of subsidiarity, or perhaps "subsidiarity asymmetry."
  2.  **Administrative Federalism / *Vollzugsföderalismus* (German context):** The distinction between who legislates and who executes. Your instances, however, focus on *legislative* capacity (drafting statutes), not just execution.
  3.  **Fiscal Equalization / Capacity Equalization:** The standard remedy for resource disparity. You explicitly note this fails because the issue is not money but specialized human capital (lawyers, analysts).
  4.  **Asymmetric Federalism:** Arrangements where different units have different legal powers (e.g., Quebec, Basque Country). Your case is distinct because the powers are *formally identical*.
  5.  **State Capacity / Bureaucratic Capacity (Public Admin):** The ability of a state to implement its goals. This is the closest fit but is usually applied to unitary states or development contexts, not the internal valuation of federal competences.
  6.  **Cooperative Federalism / Joint Decision-Making (*Politikverflechtung*):** Describes the entanglement of levels. Your Instance (2) describes a pathology within this, where participation is formally equal but substantively unequal.
  7.  **Preemption (US context):** The federal displacement of state law. You describe a situation where state law *remains* on the books (or the competence remains allocated) but is functionally inert.

  ### Stage 2: Testing Candidates Against the Instances

  Here I test the strongest candidates against your three instances and correct the institutional background where necessary.

  **1. Subsidiarity Principle**
  *   **Fit:** It explains the *rule* that triggers the centralization (the "necessity" test in Germany Art. 72(2) GG; EU Art. 5 TEU; Switzerland Art. 42/43 BV).
  *   **Strain:** Subsidiarity is the *mechanism*, not the *pathology*. The doctrine assumes that if a unit *can* do it, it *should*. It does not account for the scenario where a unit legally *can* but administratively *cannot* prove it. In Germany, the Federal Constitutional Court (*BVerfG*) has largely retreated from strictly policing the "necessity" test since the 2006 Federalism Reform, making it a political question. In the EU, the "Yellow Card" system relies on national parliaments, which suffer the same capacity constraints as your Unit B.
  *   **Verdict:** Insufficient. It names the rule being exploited, not the structural inequality resulting from it.

  **2. Fiscal Equalization**
  *   **Fit:** Acknowledges that units have different resources.
  *   **Strain:** As you noted, this fails the test. Equalization transfers money, not institutional memory or drafting expertise. A small canton or *Land* can be wealthy (high GDP) but lack the critical mass of specialists to draft complex hospital planning laws or analyze 300-page impact assessments.
  *   **Verdict:** Incorrect. This is a capacity problem, not a revenue problem.

  **3. Asymmetric Federalism**
  *   **Fit:** Acknowledges that units effectively operate differently.
  *   **Strain:** Asymmetric federalism is *de jure* (legal differences). Your phenomenon is *de facto* (legal uniformity, functional divergence). Comparative tables miss this precisely because they code *de jure* powers.
  *   **Verdict:** Incorrect. This describes a hidden variance, not a formal one.

  **4. State Capacity**
  *   **Fit:** Perfectly describes the drafting offices, the ability to analyze impact assessments, and the uptake of opt-in schemes.
  *   **Strain:** "State Capacity" is usually a unitary concept (does the state have capacity?). It does not capture the *relational* dynamic in a federation where low capacity in one unit automatically shifts authority to the center or creates dependency on high-capacity units within the joint decision-making body. It misses the *constitutional* consequence of the capacity gap.
  *   **Verdict:** Close, but too broad. It lacks the federal/constitutional dimension.

  **5. Cooperative Federalism / *Politikverflechtung***
  *   **Fit:** Instance (2) describes the "joint decision trap" (*Politikverflechtungsfalle*), where veto points lead to stalemate or lowest-common-denominator outcomes.
  *   **Strain:** The classic "joint decision trap" assumes all actors are capable of vetoing or negotiating. Your Instance (2) shows that low-capacity units *cannot* effectively negotiate because they cannot analyze the data. They are not trapping the system; they are being bypassed within it.
  *   **Verdict:** Partial fit. It describes the arena, not the inequality of the players.

  **Institutional Corrections:**
  *   **Germany:** You are correct about the "necessity" clause (Art. 72(2) GG), but note that the 2006 Federalism Reform restricted this to a few specific areas (e.g., higher education, environmental protection) to prevent the Federation from claiming necessity too easily. However, the *BVerfG* remains highly deferential on "necessity," treating it largely as a political prognosis.
  *   **EU:** The "Yellow Card" procedure allows national parliaments to object on subsidiarity grounds, but low-capacity parliaments often lack the research services to draft substantive objections, relying on the Bundestag or larger assemblies.
  *   **US:** You are correct; there is no general subsidiarity clause. The 10th Amendment is a reservation of powers, not a test of necessity. The "anti-commandeering" doctrine (*Printz v. United States*) prevents the center from conscripting state officials, which ironically forces the center to build its own capacity rather than relying on states, unlike the German model.

  ### Stage 3: Verdict and Neologism

  None of the established concepts capture the specific pathology you describe: **the divergence between formal legal authority and effective sovereign agency caused by uneven administrative capacity within a uniform constitutional framework.**

  Existing terms like "State Capacity" ignore the constitutional shift of power. "Asymmetric Federalism" ignores the formal uniformity. "Subsidiarity" ignores the capacity precondition.

  Therefore, I coin the term: **Competence-Capacity Decoupling**.

  **Definition:**
  Competence-Capacity Decoupling is the structural condition in multilevel governance where formally uniform distribution of legislative authority yields substantively unequal sovereignty because the administrative and legal capacity required to activate, sustain, or defend that authority is unevenly distributed and not remedied by fiscal transfers.

  **Boundary Cases (The Carving):**
  To distinguish this from nearby concepts, consider these two pairs:
  1.  **Political Waiver vs. Decoupling:**
      *   *Case A (Waiver):* California chooses not to legislate on a concurrent power because it prefers federal preemption to avoid political blame. (This is *not* Decoupling; capacity exists, will does not).
      *   *Case B (Decoupling):* Wyoming possesses the same concurrent power but does not legislate because its attorney general's office lacks the staff to draft a statute that would survive judicial review, so it requests federal regulation. (This *is* Decoupling).
  2.  **Asymmetric Federalism vs. Decoupling:**
      *   *Case A (Asymmetry):* Quebec has a constitutionally guaranteed opt-out from a federal social program with compensation. (This is *not* Decoupling; the power is legally distinct).
      *   *Case B (Decoupling):* Prince Edward Island has the same legal opt-out as Ontario but declines it because it cannot administer the program, whereas Ontario accepts it. (This *is* Decoupling; the law is identical, the effective power differs).

  **Usage Note (What this term should *not* be used for):**
  Do not use **Competence-Capacity Decoupling** to describe simple non-compliance or implementation deficits (e.g., a state failing to enforce a law it passed). It applies specifically to the *origination* and *defense* of legal authority. It should also not be used for fiscal incapacity alone; if a unit has money but no expertise, it is Decoupling. If it has expertise but no money, it is a Fiscal Gap.

  **Addressing Your Final Questions:**

  **1. Is this a defect in the allocation principle or the application?**
  It is a defect in the **allocation principle's assumptions**. Subsidiarity and concurrent competence models assume that "capacity" is either evenly distributed or fungible (i.e., money buys capacity). Your observation proves capacity is *sticky* (institutional memory, specialized legal teams) and path-dependent. The "necessity" test becomes a self-fulfilling prophecy: the center claims necessity because the unit cannot demonstrate sufficiency, but the unit cannot demonstrate sufficiency because it has atrophied from disuse or never had the scale to begin with.

  **2. Why do remedies make it worse?**
  *   **Transfers:** High-capacity units use transfers to innovate; low-capacity units use them to sustain baseline operations. The gap widens.
  *   **Central Capacity-Building:** When the center designs training for subnational administrators, it inevitably standardizes procedures around *central* norms, subtly eroding the distinctiveness the autonomy was meant to protect.
  *   **Petitioning:** Requiring a unit to petition the center to "prove" capacity (to get powers back) creates a stigma. Units fear that asking for help admits incompetence, which might trigger a permanent loss of the competence.

  **3. Is this specific to multilevel constitutional systems?**
  No. The structure appears wherever **formal authority is decoupled from operational means**.
  *   **Corporate Franchising:** A franchisee has the formal right to manage their store, but if they lack the analytical capacity to interpret HQ's supply chain data, they effectively cede control to HQ.
  *   **Devolved Agencies:** A central ministry delegates permitting to regional offices. If the regional office lacks legal counsel, they will routinely refer difficult cases to the center, effectively recentralizing the decision without changing the org chart.
  *   **Open Source Governance:** A project may grant "commit rights" to all contributors (formal equality), but only those with the time and technical capacity to review code (effective capacity) actually govern the project's direction.

  However, it is most *dangerous* in constitutional systems because it undermines the democratic legitimacy of the federation. If citizens in Unit B are governed by rules they had no effective capacity to shape, while citizens in Unit A are self-governing, the federation ceases to be a union of equals and becomes a core-periphery structure masked by uniform legal text.
