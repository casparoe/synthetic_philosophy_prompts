      *   **Mechanism:** Private AI Vendor (Outsourced).
      *   **Data Sources:** Domestic tax (Legal), Foreign health leak (Illegal/Gray), International social media (Public/Scraped).
      *   **Jurisdiction:** Cross-border, public-private partnership.

  4.  **Evaluate the Breakdown of National Models:**
