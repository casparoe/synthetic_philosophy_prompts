      *   **USA (FOIA/Openness/Libertarian):** Transparency is often about the *government* being open to the *people*, but also implies a lack of restriction on data flow. Private sector data gathering is largely unregulated compared to EU. Implication: Assume everything public is fair game for employers/state.
