prompt: |-
  I was arguing with my friend last night about whether I should be deleting old social media posts before applying to work for the local goverment, and she mentioned how Germany has those super strict data-protection rules, America is obsessed with openness and FOIA requests, and China's social credit system is basically the opposite extreme where visibility is the whole point. I'm trying to figure out how much an average person should actually hide from the state, not just from hackers. Could you describe the most important implications of comparing German data-protection norms, American openness doctrines, and Chinese social-credit visibility for deciding what personal information to actively conceal?

  I'm especially interested in a weird edge case where a mid-sized city contracts a private AI vendor to merge domestic tax records with health data leaked from another country's hospital system and sentiment scores scraped from international platforms—so the surveillance isn't even run directly by a state agency. What are the core conceptual takeaways for a regular citizen who isn't breaking any laws but still wants some privacy? I don't need citations or a bibliography, just the reasoning. Also, does the comparison between those three national models totally break down once the data fusion is cross-border and outsourced?
reasoning: |-
