prompt: |-
  I'm in a course on early modern philosophy and education this term, and were reading Locke's Some Thoughts Concerning Education (1693). I'm stuck on this passage:

  "There is nothing so ordinarily given Children in England, and nothing so destructive to them. They ought never to drink any Strong Liquor, but when they need it as a Cordial, and the Doctor prescribes it. And in this Case it is, that Servants are most narrowly to be watched, and most severely to be reprehended when they transgress. Those mean Sort of People, placing a great Part of their Happiness in Strong Drink, are always forward to make Court to my young Master, by offering him that, which they love best themselves; and finding themselves made merry by it, they foolishly think 'twill do the Child no Harm. This you are Carefully to have your Eye upon, and restrain with all the Skill and Industry you can, there being nothing that lays a surer Foundation of Mischief, both to Body and Mind, than Childrens being used to Strong Drink; especially, to drink in private, with the Servants."

  I get the surface advice — don't let the kid drink alcohol with the servants — but I dont get the reasoning. Why is it supposed to be destructive to the mind, not just the body? Is Locke worried about the child learning self-denial, or about reason being undermined by habit and the passions, or just about the servants corrupting him? How does this fit with the earlier stuff on hardening the body and the later part where he talks about teaching self-denial early? I'm not after citations or a reading list; just help me understand what the passage is assuming about human nature and education.
