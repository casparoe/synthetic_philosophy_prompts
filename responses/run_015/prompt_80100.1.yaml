answer: |-
  Based on your verdicts, your intuitions resist a pure Kantian view (which would reject Case 3 and 4) and a pure Consequentialist view (which would struggle with Case 5 and 7). Instead, your pattern suggests a hybrid view focused on **alignment with moral truth** rather than the specific *content* of the thought process.

  Here is a principle constructed to capture your pattern, followed by an analysis of where it forces you to change your mind.

  ### The Principle: Non-Accidental Value-Tracking

  **An action has full moral worth if and only if:**
  1.  **The Truth Condition:** The action is objectively morally right (or permissible).
  2.  **The Tracking Condition:** The action is motivated by a psychological state that *tracks the moral value* underlying the action (either directly, or through a reliable proxy the agent accepts as authoritative).
  3.  **The Non-Instrumentality Condition:** The motive is not primarily driven by self-interest or fear of sanction that would persist even if the action were wrong.

  *(Note: Mixed motives are permitted so long as the moral-tracking motive is sufficient on its own to produce the action.)*

  ---

  ### How the Principle Handles Your Cases

  *   **Case 1 (Nurse/Duty):** **Full Worth.**
      *   *Clause:* Satisfies **Tracking**. Her motive (ease suffering) tracks the actual moral value (patient welfare).
  *   **Case 2 (Nurse/Break):** **No Worth.**
      *   *Clause:* Fails **Tracking**. Her motive (finish task) does not track the moral value (patient welfare); it tracks her convenience. If the patient didn't need it but finishing the task did, she might still have done it.
  *   **Case 3 (Instinctive Helper):** **Full Worth.**
      *   *Clause:* Satisfies **Tracking**. "Warmth/Kindness" is a disposition that reliably tracks the welfare of others. It makes the rightness non-accidental.
  *   **Case 4 (Believer):** **Full Worth.**
      *   *Clause:* Satisfies **Tracking** (via Proxy). The agent treats the Commandment as an authoritative proxy for Moral Truth. Because they genuinely take the right thing to be right (via God), their action tracks the value, even if the conceptual route is theological.
  *   **Case 5 (Thief):** **No Worth.**
      *   *Clause:* Fails **Truth Condition**. The action is objectively wrong. Moral worth is a property of right actions; a wrong action cannot have moral worth, regardless of motive.
  *   **Case 6 (Mixed Motives):** **Full Worth.**
      *   *Clause:* Satisfies **Tracking** & **Non-Instrumentality**. The duty motive is present and effective. The enjoyment does not negate the tracking of the moral value.
  *   **Case 7 (Tax/Fear):** **No Worth.**
      *   *Clause:* Fails **Tracking** & **Non-Instrumentality**. Fear of shame tracks social cost, not moral value. If they could cheat without shame, they would. The rightness is accidental to the motive.
  *   **Case 8 (Trained Automatic):** **Full Worth (Forced Verdict).**
      *   *Clause:* Satisfies **Tracking**. If the training instilled a habit of doing the right thing, the habit tracks the moral value just as the "warmth" in Case 3 does.
      *   *Tension:* Your intuition says "Partial." The principle says "Full." (See below).

  ---

  ### Addressing Your Tensions

  **1. Case 3 (Instinct) vs. Case 8 (Trained)**
  *   **The Conflict:** You grant Full Worth to the instinctive helper but only Partial to the trained automatist, despite both acting rightly without deliberation.
  *   **What the Principle Says:** These cases are morally identical under the **Tracking Condition**. In both cases, the agent's psychology (disposition vs. habit) reliably produces the right action because it is sensitive to the rightness (either through innate empathy or ingrained habit).
  *   **The Cost:** To maintain this principle, **you must drop your "Partial" verdict on Case 8 and upgrade it to Full.**
      *   *Why?* If "warmth" (Case 3) is just a biological or social conditioning to care for others, it is functionally the same as being "raised to do right" (Case 8). To distinguish them, you would need to claim that Case 3 involves an *internal endorsement* of the value while Case 8 is *external programming*. But Case 4 (Religion) suggests you accept external authority (God) as sufficient for Full Worth. Therefore, consistency demands you treat the "trained" habit as a virtue, granting it Full Worth.

  **2. Case 4 (Believer) vs. "Moral Reason"**
  *   **The Conflict:** You worry that acting on a commandment isn't acting on a "moral reason."
  *   **What the Principle Says:** The **Tracking Condition** does not require the agent to use the *philosopher's vocabulary* of morality. It requires that the motive *aligns* with the moral truth. For the believer, "God's Command" *is* the moral truth. As long as they aren't following the command out of fear of hell (which would trigger the **Non-Instrumentality** failure like Case 7), but out of genuine conviction that it is *right*, they satisfy the principle.
  *   **The Cost:** None. This principle accommodates your lean toward Full Worth here.

  ---

  ### Verdicts on Your New Cases

  **(a) The Interrupted Intention**
  *   *Scenario:* Person intends to do the right thing for the right reason but is killed before acting.
  *   **Principle Verdict:** **No Moral Worth (of the action).**
  *   **Reasoning:** The **Truth Condition** requires the *action* to be objectively right. An intention is not an action. While the *agent* may be praiseworthy in character, the specific metric you are testing ("what it takes for an **action** to be performed") cannot be met if no action occurs.
  *   *Implication:* Moral worth is a property of the *union* of motive and act, not motive alone.

  **(b) The Unlucky Outcome**
  *   *Scenario:* Right act, right reason, unforeseeable bad outcome.
  *   **Principle Verdict:** **Full Moral Worth.**
  *   **Reasoning:** The principle relies on the **Truth Condition** (was the act right *ex ante*?) and the **Tracking Condition** (was the motive aligned?). It does not include a "Success Condition" regarding consequences. Since the bad outcome was sheer bad luck and unforeseeable, it does not break the link between the motive and the moral value.
  *   **Implication:** Moral worth is immune to resultant moral luck.

  ---

  ### Summary of Costs and Recommendations

  To adopt the **Non-Accidental Value-Tracking Principle**, you must accept the following trade-offs:

  1.  **Drop the "Partial" verdict on Case 8.** You must concede that a person who has been trained to automatically do the right thing possesses the same moral worth as the person who is instinctively kind. Both are instances of *virtue as second nature*. If you refuse to do this, you must downgrade Case 3 to "Partial" as well, arguing that *deliberation* is required for Full Worth (which would then threaten Case 1's "Full" status if the nurse's judgment was quick/intuitive).
  2.  **Accept that "Moral Worth" requires a Right Act.** Case 5 confirms you already hold this, but it means you must rigorously separate the *goodness of the motive* from the *worth of the action*. A terrorist who genuinely believes they are saving the world performs an act with **No Moral Worth** because the act fails the Truth Condition.
  3.  **Accept that Religious Conviction counts as Moral Tracking.** You must maintain that acting on faith is morally equivalent to acting on secular duty, provided the faith is not merely a cover for fear of punishment (Case 7).

  **Recommendation:** The most coherent adjustment is to **upgrade Case 8 to Full Worth**. Your hesitation likely stems from viewing "training" as external coercion, but if the person now acts "the way a musician plays a well-practiced piece," they have internalized the value. That is the definition of virtue, and it deserves the same worth as the instinctive helper in Case 3.
