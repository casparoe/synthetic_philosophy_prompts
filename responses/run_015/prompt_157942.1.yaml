  # ECL-20 Rapid Assessment Protocol
  **Purpose:** To evaluate cooperative agreements across domain clusters using evidential cooperation principles without formal decision theory modeling.
  **Time Allocation:** 20 Minutes per Proposal.
  **Analyst Authority:** May recommend cooperation or recommend against cooperation. Must hand off to Board for value-weighting thresholds.

  ---

  ## Protocol Steps

  ### Step 1: Cluster Integrity Check
  *   **Question:** Is the proposed partner group a pre-approved "domain cluster" of structurally identical governance regions that do not communicate?
  *   **Sufficient Answer to Proceed:** Yes, the group is on the Fund's registered cluster list.
  *   **Stop (Recommend Against):** No. If the group is ad-hoc or communicates directly, the evidential link is either nonexistent or causal, rendering this protocol inapplicable.
  *   **Stop (Handoff to Board):** Unclear. If cluster status is disputed due to recent geopolitical shifts, this is a jurisdictional value judgment.

  ### Step 2: Structural Identity Check
  *   **Question:** Are the governance rules, decision-making hierarchies, and incentive structures of the proposing region identical to the cluster standard?
  *   **Sufficient Answer to Proceed:** Yes, administrative audits confirm structural identity.
  *   **Stop (Recommend Against):** No. If the decision-making machinery differs, the region cannot be treated as an analogous agent, and the evidential link is broken.
  *   **Stop (Handoff to Board):** Partial Match. If structures are similar but not identical (e.g., different legislative veto points), the Board must decide if the analogy is strong enough to warrant risk.

  ### Step 3: Symmetry-Break Check
  *   **Question:** Do local economic or environmental conditions deviate markedly (more than 20% variance) from the cluster mean on key decision-drivers (e.g., labor markets, energy mix)?
  *   **Sufficient Answer to Proceed:** No, local conditions fall within the standard variance range.
  *   **Stop (Recommend Against):** Yes. If local conditions are outliers, the symmetry condition fails. Your decision provides no statistical evidence for what others will do because their constraints are different.
  *   **Stop (Handoff to Board):** Borderline. If variance is between 15-25%, the Board must decide if the evidential link is too weak to rely upon.

  ### Step 4: Local Cost Magnitude Check
  *   **Question:** Is the local cost of cooperation negligible or moderate relative to the regional budget?
  *   **Sufficient Answer to Proceed:** Yes, costs are negligible (absorbable without policy change). **Action:** Recommend Cooperation.
  *   **Stop (Recommend Against):** N/A. (If symmetry holds, high cost does not automatically negate cooperation under ECL, but requires Board review).
  *   **Stop (Handoff to Board):** No, costs are moderate to high. This protocol cannot calculate the threshold where evidential weight overrides local cost. The Board must weigh the value of global cooperation against local economic pain.

  ### Step 5: Global Harm Mitigation Check
  *   **Question:** Does failure to cooperate result in severe, irreversible global harm?
  *   **Sufficient Answer to Proceed:** No. **Action:** Defer to Step 4 outcome.
  *   **Stop (Recommend Against):** N/A.
  *   **Stop (Handoff to Board):** Yes. If global harm is severe, this overrides standard cost-benefit analysis and requires a value judgment on牺牲 (sacrifice) that analysts cannot make.

  ---

  ## Protocol Limitations
  **Analysts must note the following constraints in all reports:**
  1.  **Threshold Indeterminacy:** This procedure cannot identify the threshold at which evidential weight becomes strong enough to override local cost. It flags high-cost scenarios for the Board but does not solve them.
  2.  **Analogy Calibration:** This procedure cannot distinguish genuinely analogous agents from merely similar-looking ones without prior empirical calibration. It relies on structural declarations rather than behavioral history.

  ---

  ## Application of Procedure

  ### Proposal A: Binding Carbon-Cap Agreement
  *   **Context:** Cluster of 100+ structurally similar industrial regions.
  *   **Execution:**
      *   Step 1 (Cluster): Pass.
      *   Step 2 (Identity): Pass.
      *   Step 3 (Symmetry): Pass (Industrial profiles match).
      *   Step 4 (Cost): Moderate (Requires budget reallocation).
  *   **Outcome:** **Mandatory Handoff to Board.**
  *   **Reasoning:** Symmetry holds, creating an evidential link, but the cost is not negligible. The procedure cannot determine if the statistical likelihood of others cooperating outweighs the budget impact.

  ### Proposal B: Unilateral Green Technology Subsidy
  *   **Context:** Region whose economic structure has no close analog elsewhere in the cluster.
  *   **Execution:**
      *   Step 1 (Cluster): Pass.
      *   Step 2 (Identity): Fail (Unique economic structure).
  *   **Outcome:** **Recommendation Against Cooperation.**
  *   **Reasoning:** Structural identity is missing. There is no basis to assume other regions face the analogous decision problem, so the evidential link is null.

  ### Proposal C: Cooperative Emission-Reduction Pact
  *   **Context:** Prevents severe global harm but imposes catastrophic local economic costs; local labor-market conditions differ markedly from the cluster mean.
  *   **Execution:**
      *   Step 1 (Cluster): Pass.
      *   Step 2 (Identity): Pass.
      *   Step 3 (Symmetry): **Fail.** (Labor markets differ markedly).
  *   **Outcome:** **Recommendation Against Cooperation.**
  *   **Reasoning:** The procedure terminates at Step 3. Because local conditions are outliers, the symmetry condition collapses. Consequently, the region's cooperation provides no evidential weight that others will cooperate. Without the evidential lever, the decision reverts to causal logic: incurring catastrophic local cost with no causal influence on others is irrational.
  *   **Unwelcome Result:** This answer is unwelcome to the Board because it prevents the mitigation of severe global harm. The procedure prioritizes the integrity of the evidential link over the magnitude of the global stake, effectively vetoing a high-stakes rescue mission because the region is too unique to signal others.

  ---

  Verdict: The procedure necessarily collapses into a non-evidential value judgment when determining whether the statistical probability of analogous cooperation outweighs the moral imperative to avoid catastrophic local economic harm.
