prompt: |-
  So I'm in a rational choice seminar this term and my short paper has to recommend a two-person bargaining rule for a specific job: two parties jointly produce a surplus, and the rule gets written into a contract as the default split, to be applied later by an arbitrator who only has noisy estimates of the feasible set and of each side's outside option. We did the Nash solution and Kalai-Smorodinsky on Tuesday, I've allready got the reading list and I don't want more of it — no citations, no bibliography, no "see So-and-so 1975". What I can't do yet is say what I'm asking the rule for. That's what I want from you: the desiderata.

  Give me the list of things a two-person bargaining solution has to get right to count as adequate for that purpose specifically (contract default, applied to estimated rather than exact feasible sets), with the case or consideration behind each one, and for each, whether it's non-negotiable for this purpose or just a preference of one camp.

  Things I want you to actually take a position on:

  1. Interpersonal comparability. In the applications I care about the payoffs are basically in a common unit already (dollars, GPU-hours, author slots), so I dont understand why I should care about invariance to indepedent rescaling of each side's utility function, but every axiomatization treats it as bedrock. Is scale-invariance a genuine desideratum or a prejudice inherited from taking non-comparable vNM utilities as the default case? What happens if I drop it — does maximizing the total become respectable again, and does a split-the-gains-equally rule stop looking arbitrary?

  2. Which of these are real requirements and which just collapse into axioms people already use. My guesses, tell me where I'm wrong:
   - insensitivity to unattainable ideals: throwing in an option that raises one side's maximum but that nobody will ever realistically get shouldn't move the split. Is this IIA in a costume, or a distinct gripe? It looks like the thing that sinks any rule defined off the ideal point, which is why I'm suspicious of KS.
   - carve-up invariance: whether the issues are settled as one package or one at a time shouldn't change the outcome, and neither should redrawing where one issue ends and the next begins.
   - no gain from splintering: a side shouldn't come out ahead by showing up as two claimants rather than one.
   - robustness to estimation error: if the feasible set and the disagreement point are only known up to some epsilon, the recommended point shouldn't move by more than something on the order of epsilon. If that's in tension with Pareto-efficiency, because you can't sit exactly on a frontier you only know approximately, say so plainly. That tension is the part I most want.
   - lumpiness: the surplus is often indivisible (one slot, one machine), so the feasible set isn't convex and the rule still has to be defined. And if it needs randomization to be defined, it should also say who eats the residual risk and whether the loser gets anything for it.

  3. The obvious one: monotonicity versus independence of irrelevant alternatives. My sense is that you can't have both together with Pareto-efficiency and symmetry, so the list has a small impossibility buried in it. Give me the smallest jointly unsatisfiable subset you can find and the example that shows it.

  4. On the final list, which single requirement does the most work narrowing the field, and is there one that's secretly doing nothing?

  Then a short scorecard — table is fine — for the Nash solution, Kalai-Smorodinsky, maximize-the-total assuming a common unit, and split-the-gains-equally. Keep the scoring short; the criteria are the paper.

  Last thing: separate what's actually settled (the characterization results, the facts about which solution has which property) from what's contested among people who work on this — whether monotonicity or IIA is the right cut, whether comparability is available, whether robustness should beat exact efficiency — because I don't want to hand in something that presents one camp's preference as the consensus. And flag anything you're guessing at or that I should check against the actual statement of a theorem before I put it in front of someone who knows this literature. American English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Rational choice seminar, short paper.
      *   **Task:** Recommend a two-person bargaining rule for a specific context: contract default, applied by an arbitrator with *noisy estimates* of the feasible set and outside options.
      *   **Constraint:** No citations, no bibliography, no "see So-and-so". Just the logic and desiderata.
      *   **Specific Questions to Address:**
          1.  Interpersonal comparability (Scale invariance vs. common units).
          2.  Specific properties (IIA vs. unattainable ideals, carve-up invariance, no gain from splintering, robustness to error, lumpiness/non-convexity).
          3.  Monotonicity vs. IIA (Impossibility result).
          4.  Most/least work done by requirements.
          5.  Scorecard for Nash, KS, Max-Total, Equal-Gains.
          6.  Distinction between settled facts and contested norms.
      *   **Tone:** Direct, analytical, American English, taking positions where asked but flagging uncertainty/contestation.

  2.  **Deconstruct the Specific Context:**
      *   *Contract Default:* Needs to be fair enough that both parties sign ex-ante.
      *   *Arbitrator with Noisy Estimates:* This is the crucial twist. Standard bargaining theory assumes the feasible set $S$ and disagreement point $d$ are common knowledge and precise. Here, they are $\hat{S}$ and $\hat{d}$ with error $\epsilon$.
      *   *Implication:* Robustness/Continuity is paramount. Efficiency is secondary if it requires precision the arbitrator doesn't have.

  3.  **Address Question 1: Interpersonal Comparability:**
      *   *Standard View:* Utility is vNM, ordinal, non-comparable. Hence, scale invariance (invariance to independent affine transformations) is a core axiom.
      *   *User's View:* Payoffs are in common units (dollars, GPU-hours).
      *   *Analysis:* If units are common and comparable, scale invariance is *not* a desideratum; it's a restriction that prevents using the information you have. If $1 for A = $1 for B, then "Maximize Total" (Utilitarian) becomes coherent. "Equal Gains" also becomes coherent.
      *   *Position:* In this specific context, scale invariance is a prejudice from the general theory. Drop it. It makes Utilitarianism respectable. Equal Gains is no longer arbitrary if the unit is meaningful.

  4.  **Address Question 2: Specific Properties:**
      *   *Insensitivity to Unattainable Ideals:* This is essentially Monotonicity (specifically Resource Monotonicity or Individual Monotonicity). It conflicts with IIA. KS uses the ideal point; Nash does not. In a noisy environment, ideal points are *very* noisy (maxima of estimated sets). Relying on them is dangerous.
      *   *Carve-up Invariance:* This is "Separability" or "Consistency." If I bargain over $X$ and $Y$ together vs. separately, do I get the same result? Nash satisfies this (multiplicative structure). KS generally does not. Important for complex contracts.
      *   *No Gain from Splintering:* This is "Population Monotonicity" or related to "Dummy Player" axioms. If I split my firm into two subsidiaries, do I get more bargaining power? A good rule shouldn't allow this.
      *   *Robustness to Estimation Error:* This is Continuity/Lipschitz Continuity. If $\hat{S}$ moves slightly, solution moves slightly. *Crucial Tension:* Pareto Efficiency requires being *on* the frontier. If the frontier is unknown ($\pm \epsilon$), aiming for the frontier risks promising an infeasible point (breach of contract) or leaving money on the table. A "safe" rule might need to be slightly inefficient ex-post to be feasible ex-ante.
      *   *Lumpiness:* Non-convex sets. Standard solutions assume convexity. If indivisible, we need lotteries. Who bears risk? Risk aversion matters. If utilities are linear in money, lotteries are fine. If not, expected utility matters.

  5.  **Address Question 3: Monotonicity vs. IIA:**
      *   *The Impossibility:* Nash satisfies IIA, Symmetry, Pareto, Scale Invariance. KS satisfies Monotonicity, Symmetry, Pareto, Scale Invariance.
      *   *The Conflict:* You cannot have IIA and Strong Monotonicity (specifically Individual Monotonicity) simultaneously with Pareto and Symmetry.
      *   *Example:* Expand the feasible set in a way that helps Player 1 but doesn't change Player 2's max. IIA says outcome stays same (if old solution still available). Monotonicity says Player 1 should gain.
      *   *Smallest Subset:* Pareto + Symmetry + IIA + Individual Monotonicity.

  6.  **Address Question 4: Workhorse vs. Dummy:**
      *   *Workhorse:* Pareto Efficiency (narrows to frontier). In this context, maybe Robustness is the real workhorse.
      *   *Dummy:* Scale Invariance (given the common unit context). It restricts the solution space unnecessarily.

  7.  **Drafting the Scorecard:**
      *   *Nash:* Good on IIA, bad on Monotonicity, bad on Robustness (logarithmic singularity near boundary?), assumes convexity.
      *   *KS:* Good on Monotonicity, bad on IIA, very bad on Robustness (depends on ideal points which are max-values, highly sensitive to noise).
      *   *Max-Total:* Good on Comparability, bad on Fairness (ignores $d$), sensitive to frontier shape.
      *   *Equal-Gains:* Good on Fairness (with comparability), simple, robust?

  8.  **Refining the "Noisy Arbitrator" Angle:**
      *   This is the unique value add. Standard theory ignores measurement error.
      *   *Key Insight:* KS relies on the *ideal point* (the maximum possible utility for each player). In a noisy set, the maximum is the noisiest part of the data (outliers). Nash relies on the *tangency* of a hyperbola. Equal Gains relies on the *midpoint* of the segment between $d$ and the frontier.
      *   *Conclusion:* KS is terrible for noisy data. Nash is okay but sensitive to curvature. Equal Gains (linear) is likely most robust.

  9.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the constraint (no citations) and the specific context (noisy arbitration).
      *   **Desiderata List:** Categorized by Non-Negotiable vs. Contested.
      *   **Deep Dives (1-4):** Answering the specific prompts directly.
      *   **Scorecard:** Table format.
      *   **Settled vs. Contested:** Clear distinction.
      *   **Caveats:** Flagging where theorems need checking.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I use citations? *No.*
      *   *Check:* Did I answer the comparability question? *Yes, took a stance.*
      *   *Check:* Is the impossibility result accurate? *Yes, IIA vs Monotonicity is the classic trade-off.*
      *   *Check:* Did I address the "noisy estimate" constraint sufficiently? *Need to emphasize this more in the Robustness section.*
      *   *Check:* American English? *Yes.*
      *   *Check:* Tone? *Professional, seminar-appropriate.*

  11. **Final Polish:** Ensure the distinction between "axiom" (mathematical property) and "desideratum" (normative goal) is clear. Make sure the recommendation aligns with the analysis (likely Equal Gains or a robustified Nash). *Wait, the prompt asks for desiderata, not the final recommendation yet, but the scorecard implies evaluating them.* I will focus on defining the criteria first, then evaluating the rules against them.

      *Refining the "Robustness" point:* If the arbitrator has noisy estimates, Pareto Efficiency is dangerous. If the rule says "give them point X on the frontier," and the *true* frontier is inside the *estimated* frontier, the contract is infeasible. A "safe" rule might need to target the interior. This is a strong argument against strict Pareto Efficiency in this specific context. I need to highlight this tension.

      *Refining Comparability:* If units are dollars, $1 = $1. But is marginal utility equal? If risk aversion differs, $1 is not equal *utility*. The prompt says "payoffs are basically in a common unit." I should assume transferable utility (TU) or at least comparable scales. I will argue that if we accept comparable units, we should accept comparable utility *unless* risk profiles differ wildly. I'll stick to the prompt's premise: treat units as comparable.

      *Refining the Impossibility:* The classic result is that Nash is the unique solution satisfying Pareto, Symmetry, IIA, and Scale Invariance. KS drops IIA for Monotonicity. So the conflicting set is {Pareto, Symmetry, IIA, Monotonicity}.

