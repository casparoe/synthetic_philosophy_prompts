answer: |-
  Here is a breakdown of the desiderata for a bargaining rule designed for a contract default applied by an arbitrator with noisy estimates.

  ### The Desiderata List

  The following are the properties the rule must satisfy to function in your specific context. I have categorized them by whether they are non-negotiable for the *arbitration context* or whether they represent a normative preference that divides the literature.

  **1. Robustness (Continuity)**
  *   **The Case:** The arbitrator does not know the true feasible set $S$ or disagreement point $d$. They know estimates $\hat{S}$ and $\hat{d}$ with error $\epsilon$. If the rule is discontinuous, a tiny error in estimation leads to a massive jump in the recommended settlement. This creates litigation risk: parties will fight over the estimate because the payoff to shifting the estimate is too high.
  *   **Status:** **Non-Negotiable.** In a noisy environment, stability is more valuable than precision.

  **2. Feasibility Safety (Interiority)**
  *   **The Case:** Standard rules demand Pareto Efficiency (the outcome must lie on the frontier). If the arbitrator's estimate of the frontier is optimistic (outside the true set), an efficient rule mandates an impossible outcome. The contract becomes unenforceable. The rule should ideally target a point strictly inside the estimated set to account for estimation error.
  *   **Status:** **Non-Negotiable for this context.** (Note: This contradicts standard theory, which treats Efficiency as sacred. You need to argue that *enforceability* trumps *efficiency* here.)

  **3. Symmetry (Anonymity)**
  *   **The Case:** As a default contract rule, the mechanism cannot favor one party based on identity. If the parties swap positions (same feasible set, same outside options), the payoffs must swap.
  *   **Status:** **Non-Negotiable.** Without this, parties will not agree to the rule ex-ante.

  **4. Monotonicity (Sensitivity to Opportunity)**
  *   **The Case:** If the feasible set expands in a way that benefits only one party (e.g., their maximum possible payoff increases while the other's stays fixed), that party should not end up worse off, and ideally should gain.
  *   **Status:** **Contested Preference.** This is the main wedge between the Nash camp and the Kalai-Smorodinsky camp.

  **5. Independence of Irrelevant Alternatives (IIA)**
  *   **The Case:** If the chosen outcome is available in a smaller subset of the feasible set, the rule should still choose it. This prevents manipulation by adding "dummy" options to the menu.
  *   **Status:** **Contested Preference.** It conflicts with Monotonicity.

  **6. Scale Invariance**
  *   **The Case:** The outcome should not change if one party's utility units are rescaled (e.g., dollars to cents).
  *   **Status:** **Prejudice (Drop it).** See below.

  **7. Decomposability (Carve-up Invariance)**
  *   **The Case:** Bargaining over a bundle of issues should yield the same result as bargaining over them sequentially or separately, provided the feasible sets are independent.
  *   **Status:** **Preference.** Useful for complex contracts, but often conflicts with fairness axioms.

  ---

  ### 1. Interpersonal Comparability and Scale Invariance

  **Position:** In your specific context, Scale Invariance is a prejudice inherited from the assumption that utility is ordinal and non-comparable. You should drop it.

  **Reasoning:** Standard bargaining theory assumes we only know the *ordering* of preferences, not the *intensity*. Therefore, transforming Player A's utility from $[0, 1]$ to $[0, 100]$ shouldn't change the physical outcome, so the math must be invariant to that scaling. This forces the solution to rely on ratios (Nash product) or relative distances to ideals (Kalai-Smorodinsky).

  However, you stated the payoffs are in common units (dollars, GPU-hours). If the unit is the same, $1$ unit for Player A is physically identical to $1$ unit for Player B. While marginal *utility* might differ due to risk aversion, if we assume risk neutrality over these specific assets (or if the contract is small relative to wealth), the units are comparable.

  **Consequences of Dropping It:**
  *   **Maximizing the Total becomes respectable:** If units are comparable, "Maximize $u_1 + u_2$" is no longer nonsense; it is the Utilitarian solution. It becomes a viable candidate.
  *   **Equal Gains is no longer arbitrary:** "Split the surplus equally" ($u_1 - d_1 = u_2 - d_2$) requires comparing the *size* of a gain for A against the *size* of a gain for B. If scales are incomparable, this is meaningless. If scales are dollars, it is precise and defensible as a focal point.
  *   **Recommendation:** Treat Scale Invariance as a constraint you *remove*, not a desideratum you keep. It unnecessarily restricts the solution space when you have cardinal, comparable data.

  ### 2. Real Requirements vs. Collapsed Axioms

  **Insensitivity to Unattainable Ideals**
  *   **Verdict:** This is **Individual Monotonicity**, not IIA.
  *   **Analysis:** IIA says removing options *below* the solution shouldn't change the outcome. Your concern is about options *above* the solution (the ideal point). Kalai-Smorodinsky (KS) determines the split based on the ratio of the ideal points. If you expand the set to raise Player 1's ideal point (even if that point is unreachable), KS shifts the outcome toward Player 1. Nash does not do this.
  *   **Contextual Risk:** In a noisy environment, the "ideal point" is the maximum value of the estimated set. Maxima are statistically fragile (sensitive to outliers). A rule that depends heavily on the ideal point (KS) will be highly volatile when the estimate $\hat{S}$ jitters. Nash is more robust here because it depends on the curvature of the frontier near the solution, not the far corners.

  **Carve-up Invariance**
  *   **Verdict:** This is **Separability**.
  *   **Analysis:** Nash satisfies this (the product of sums is the sum of products in log space). KS generally fails this. If you have a complex contract with multiple independent clauses, Nash ensures the bargaining outcome is consistent regardless of how you bundle them. This is a strong argument for Nash in complex commercial contracts, but less critical for a single-surplus job.

  **No Gain from Splintering**
  *   **Verdict:** This is **Population Monotonicity** or **Consistency**.
  *   **Analysis:** If Player 1 splits into two entities, they shouldn't gain leverage. Most standard two-person solutions assume fixed population. If this is a risk, you need a rule derived from a broader class (like the Shapley value logic), but for a strict two-person contract, this is usually assumed away.

  **Robustness to Estimation Error**
  *   **Verdict:** **Critical Tension with Efficiency.**
  *   **Analysis:** You identified the core problem. Pareto Efficiency requires the solution to be *on* the boundary. If the boundary is unknown ($\pm \epsilon$), an efficient rule risks demanding an infeasible allocation.
  *   **The Trade-off:** To guarantee feasibility, the rule must be *inefficient* by design (targeting the interior). A rule that maximizes the Nash Product might demand a point that turns out to be outside the true set. A rule that splits the *estimated* gains equally might land safely inside.
  *   **Conclusion:** In this specific seminar paper, you should argue that **Robustness dominates Efficiency**. A slightly inefficient settlement that is always feasible is better than an efficient one that triggers breach-of-contract litigation.

  **Lumpiness (Non-Convexity)**
  *   **Verdict:** **Requires Randomization or Rounding.**
  *   **Analysis:** If the surplus is one GPU-hour, you cannot split it. The feasible set is discrete. Standard solutions assume convexity (you can split anything).
  *   **Requirement:** The rule must specify a lottery if the split isn't integer-compatible. Crucially, it must specify **who bears the risk**. If the rule says "50% chance Player 1 gets the machine," and Player 1 is risk-averse, the *expected utility* is not equal. The rule needs to operate on expected utility, not just physical probability, or compensate the risk-averse party.

  ### 3. Monotonicity vs. IIA (The Impossibility)

  You are correct that there is a buried impossibility. You cannot have them both alongside Pareto and Symmetry.

  **The Smallest Jointly Unsatisfiable Subset:**
  1.  **Pareto Efficiency** (Must be on the frontier).
  2.  **Symmetry** (Identical players get identical payoffs).
  3.  **Independence of Irrelevant Alternatives (IIA)**.
  4.  **Individual Monotonicity** (If the set expands to help Player 1, Player 1 must not lose).

  **The Example:**
  *   **Scenario A:** Feasible set is a symmetric triangle. Disagreement is $(0,0)$. Symmetry + Pareto dictates the midpoint of the frontier.
  *   **Scenario B:** Expand the set *only* in the direction of Player 1's axis (Player 1's max payoff increases, Player 2's max stays the same). The original solution from Scenario A is still available.
  *   **Conflict:**
      *   **IIA** says: Since the old solution is still available, pick the old solution. (Player 1 gains nothing from the expansion).
      *   **Monotonicity** says: Player 1's opportunities improved, so Player 1's payoff must increase.
  *   **Result:** Nash satisfies IIA (and sacrifices Monotonicity). Kalai-Smorodinsky satisfies Monotonicity (and sacrifices IIA).

  ### 4. Workhorse vs. Dummy Requirements

  **Most Work:** **Pareto Efficiency.**
  In standard theory, this does the heavy lifting. It reduces the solution from the entire 2D plane to a 1D curve. Without it, almost any point is permissible.
  *Correction for your context:* In your noisy context, **Robustness** does the most work. It eliminates KS immediately (too sensitive to ideal points) and casts doubt on strict Efficiency.

  **Secretly Doing Nothing:** **Scale Invariance.**
  As argued above, if your units are comparable, this axiom is actively harmful. It prevents you from using the information you have (that a dollar is a dollar). It narrows the field to Nash/KS when Utilitarian or Equal-Gains rules might be superior.

  ---

  ### Scorecard

  | Criterion | Nash Product | Kalai-Smorodinsky (KS) | Max-Total (Utilitarian) | Equal-Gains (Linear) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Robustness to Noise** | **Moderate.** Depends on local curvature. | **Poor.** Depends on max values (outliers). | **Good.** Depends on global slope. | **Best.** Linear, simple geometry. |
  | **Feasibility Safety** | **Poor.** Targets frontier exactly. | **Poor.** Targets frontier exactly. | **Poor.** Targets frontier exactly. | **Moderate.** Easier to adjust inward. |
  | **Comparability** | **Ignores it.** Invariant to scale. | **Ignores it.** Invariant to scale. | **Uses it.** Requires common units. | **Uses it.** Requires common units. |
  | **Monotonicity** | **Fails.** (Satisfies IIA). | **Passes.** (Satisfies Resource Monotonicity). | **Passes.** | **Passes.** |
  | **IIA** | **Passes.** | **Fails.** | **Fails.** | **Fails.** |
  | **Lumpiness** | **Hard.** Requires log-utility. | **Hard.** | **Easy.** Sum is well-defined. | **Easy.** Difference is well-defined. |
  | **Verdict for Your Case** | **Risky.** Too sensitive to frontier shape. | **Reject.** Too sensitive to estimation error. | **Candidate.** If fairness adjusted. | **Top Candidate.** Robust & Fair. |

  ---

  ### Settled Facts vs. Contested Norms

  **Settled (Mathematical Facts):**
  *   **Uniqueness:** Nash is the *unique* solution satisfying Pareto, Symmetry, IIA, and Scale Invariance. (Check this theorem statement: it usually requires the feasible set to be convex and compact).
  *   **Impossibility:** No solution satisfies Pareto, Symmetry, IIA, and Individual Monotonicity simultaneously.
  *   **Sensitivity:** KS solutions depend on the ideal point (the maximum utility each player can achieve). Nash solutions depend on the product of gains.
  *   **Efficiency:** All four standard rules (Nash, KS, Utilitarian, Equal-Gains) are Pareto Efficient on convex sets by definition.

  **Contested (Normative/Modeling Choices):**
  *   **Comparability:** Whether utility is comparable is the biggest divide. Economists generally assume "No" (ordinalists). Contract lawyers and engineers often assume "Yes" (cardinal units). *You are taking the minority view in econ, but the majority view in applied contracting.*
  *   **IIA vs. Monotonicity:** There is no consensus on which is more important. Nash proponents argue IIA prevents manipulation. KS proponents argue Monotonicity is more intuitive (more pie means more slice).
  *   **Efficiency vs. Robustness:** Standard theory assumes the feasible set is known. There is very little settled theory on "Bargaining with Measurement Error." *This is your opening.* You are arguing that in the presence of error, strict Efficiency is a bug, not a feature.
  *   **Risk in Lotteries:** How to handle non-convexity (lumpiness) is not settled. Some argue for ex-ante fairness (equal probability), others for ex-post fairness (compensatory side payments).

  ### Caveats and Checks

  Before submitting, verify the following:
  1.  **The Domain of Nash:** Ensure the theorem you rely on for Nash uniqueness specifies *convex* feasible sets. If your job involves lumpiness (non-convexity), the standard Nash characterization technically doesn't apply without modification (e.g., extended Nash solution).
  2.  **Monotonicity Definitions:** There are different types of monotonicity (Resource, Population, Individual). KS satisfies Individual Monotonicity. Ensure you specify *which* one you are discussing in the impossibility section.
  3.  **Affine vs. Linear:** Scale Invariance usually refers to invariance to *affine* transformations ($au + b$), not just linear scaling ($au$). If your disagreement point $d$ is not zero, the translation part ($b$) matters. Equal-Gains is invariant to translation but not scaling. Nash is invariant to both. Be precise about which transformation you are dropping.

  **Final Recommendation for the Paper:**
  Argue that for a **noisy arbitrator**, **Equal-Gains (with comparable units)** is superior. It sacrifices IIA (which matters less for defaults than for negotiations) and Scale Invariance (which is irrelevant for dollars), but it gains Robustness (linear rules don't chase outliers) and Feasibility Safety (easier to shave a linear split to ensure it fits). It treats the "common unit" information as data, not noise.
