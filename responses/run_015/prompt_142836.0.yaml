answer: |-
  Priya's column sounds like the most useful piece of moral philosophy written in the last decade. She isn't doing meta-ethics; she's doing *social logistics*. Her consistency comes from treating social norms not as divine laws, but as **operating systems** that require specific user permissions to override.

  Based on the track record you provided, here is the reconstruction of her verdicts, the principles driving them, and the stress test you need to run at dinner.

  ### Part 1: The Verdicts on Your Three Cases

  **Case 1: The Southern Europe "Tourist Tax" Tip**
  *   **Verdict:** **Do not tip the 15–20% tourist rate.** Round up the bill or leave small change (the local rate), but do not feed the expectation.
  *   **Reasoning:** This is the **Tokyo Ramen** principle overriding the **US Restaurant** principle. In the US, the sub-minimum wage is a legal reality you opt into by sitting down; refusing to tip breaks the economic contract that keeps the staff fed. In Southern Europe, the "expectation" is not a legal contract, but a *market distortion* created by previous tourists. By paying the 20%, your sister isn't fulfilling a contract; she is validating a two-tier system that locals resent and that allows owners to suppress base wages.
  *   **Nuance:** It does not matter if it's the owner's daughter or the cut-hourly worker. If the wage was cut *because* management counts on tourist tips, paying the tip validates the cut. If it's the owner, you are subsidizing profit over local wage stability. Priya would say: "You are not the savior of that waiter; you are a guest in that economy. Pay the local price."

  **Case 2: The Humiliating Office Stand**
  *   **Verdict:** **Stay seated.**
  *   **Reasoning:** This is the **Office Late Stay** principle overriding the **London Escalator** principle. The escalator convention is a *coordination norm* (it makes the system flow better for everyone). Standing for the director is a *power ritual* (it signals submission and serves only the director's ego). Priya draws a hard line between conventions that facilitate shared life (escalators, quiet cars, lines) and conventions that enforce hierarchy (staying late, standing up). Since everyone privately hates it, the "social contract" is coercive, not consensual. The consultant isn't breaking a coordination norm; they are refusing to participate in a collective delusion.

  **Case 3: The Café Cup Shelf**
  *   **Verdict:** **Not wrong.**
  *   **Reasoning:** This is the **Epistemic Condition**. Priya's verdicts rely on *knowing the script*. In the US tip case, the script is on the menu (legally). In the Tokyo case, the script is cultural knowledge. In the Quiet Car, the script is signage. Here, the script is hidden. You cannot violate a convention you have no way of discovering. The resentment from the regulars is their failure to signal, not your failure to comply. However, Priya would add: "Once you see the first person do it, you join the shelf. Ignorance expires upon observation."

  ---

  ### Part 2: The Candidate Principles

  You guessed correctly that she is running separate rules for different domains. Her "philosophy" is a decision tree, not a single maxim. Here are the three principles that fit her track record equally well, and exactly where they tension against each other.

  **1. The Opt-In Contract (Economic)**
  *   *Rule:* If you enter a space with known economic rules (US menu, Quiet Car signage), you must comply.
  *   *Support:* US Tipping, Amtrak Quiet Car.
  *   *Limit:* Does not apply if the "contract" is exploitative or illegal (Office Late Stay).

  **2. The Local Sovereignty (Cultural)**
  *   *Rule:* Do not import your home script into a host culture, especially if it disrupts local coordination or dignity.
  *   *Support:* Tokyo Tipping, London Escalator, Jaywalking (with kid).
  *   *Limit:* Does not apply if the local norm is purely coercive power (Office Stand).

  **3. The Waiver Authority (Relational)**
  *   *Rule:* The person with authority over the space can waive the norm.
  *   *Support:* Shoes-off House ("We don't care" = shoes on).
  *   *Limit:* Does not apply if the waiver harms a third party (e.g., a host can't waive a tip for a waiter who needs it).

  **Where They Come Apart:**
  The tension lies between **Local Sovereignty** and **The Opt-In Contract**.
  In Case 1 (Southern Europe), the "Tourist Expectation" feels like an Opt-In Contract (you know they want it), but it violates Local Sovereignty (locals hate it). Priya sides with Sovereignty there.
  In Case 2 (Office Stand), the "Everyone Stands" feels like Local Sovereignty (it's their office culture), but it violates the Anti-Coercion limit. Priya sides with Anti-Coercion.

  **Is it Underdetermined?**
  Yes, slightly. Her past verdicts don't fully clarify what happens when a **Local** explicitly asks you to break a **Local Norm**.
  *   *Shoes-off:* Host says "Keep shoes on" (Waiver). Priya says "Keep them on."
  *   *Tokyo:* Culture says "No tips." Priya says "No tips."
  *   *The Gap:* What if a Tokyo host says, "Please, tip my staff, they need it"? Does the Waiver Authority beat Local Sovereignty? Her track record suggests Waiver wins (Shoes), but her "Colonizing" language suggests Sovereignty wins (Tokyo).

  ---

  ### Part 3: The Crucial Experiment (For Dinner)

  To separate the surviving rules, you need a case where **The Waiver Authority** clashes directly with **Local Sovereignty** in a way that involves a third-party victim.

  **Pose this case to her:**

  > "You are dining in a strict no-tipping culture (like Japan or Iceland). The service is excellent. As you leave, the owner pulls you aside and says: *'I know your culture tips. Please, leave 20% on the table. My staff won't expect it from me, but they are struggling, and I can't raise prices for locals. Just tell them a foreigner did it.'*"
  >
  > **Do you leave the tip?**

  **Why this breaks the tie:**
  *   **If she says YES:** She prioritizes **The Waiver Authority** and **Immediate Harm Reduction** (the staff needs money) over **Local Sovereignty**. This implies her "Colonizing" verdict in Tokyo was about *unsolicited* imposition, not the act itself. It means she believes individuals can opt-out of cultural norms if it helps vulnerable people.
  *   **If she says NO:** She prioritizes **Local Sovereignty** and **Systemic Integrity** over **Individual Waivers**. This implies that even if the "host" allows it, the "culture" forbids it, and you shouldn't be the wedge that breaks the local wage structure. This would mean the "Shoes-off" verdict was only about *personal* comfort, not *economic* norms.

  **My bet on Priya:**
  She will say **NO**.
  Why? Because in the "Office Late Stay" case, she refused to let the "Office Culture" override labor rights. In the "Southern Europe" case, she refused to let "Tourist Expectation" override local wage stability. She views economic norms as *structural*, not just interpersonal. A host cannot waive a structural norm that protects the community (no-tipping culture) any more than a boss can waive labor law (stay till 7). The "Shoes" case was about dirt and comfort (personal); this is about wages and market pricing (systemic).

  If she says **YES**, she is more of a humanitarian pragmatist than a structuralist. If she says **NO**, she is a strict sociological conservative who believes guests must never be the variable that changes the local equation, even with permission. Given her "warehouse" background and her "colonizing" language, I suspect she protects the System over the Individual Exception.
