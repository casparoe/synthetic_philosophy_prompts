  9.  **Self-Correction/Nuance Check:**
      *   *Did I skip Chinese Room?* Yes.
      *   *Did I address the "Instruction Set" specifically?* Yes, this is crucial. The lack of a defined ISA means "simulation" is ambiguous.
      *   *Is the distinction between Cognition and Phenomenology clear?* Need to ensure the piecemeal replacement argument is linked to the analogy's limits.
      *   *Is the "Better Analogy" section substantive?* Need to explain *why* it predicts differently (e.g., regarding error tolerance).

  10. **Final Polish:** Check against the "load-bearing" requirement. Ensure I explicitly state which breaks kill which conclusion. (e.g., No ISA kills the "simple simulation" claim; Program/Data collapse kills the "easy copy" claim).

  *(Self-Correction during drafting)*: I need to be careful not to say "Uploading is impossible." The prompt asks for an audit of the *analogy*, not a verdict on the technology. The point is that the *argument* for uploading relies on the analogy, and if the analogy fails, the *argument* fails, even if the technology remains possible via other routes.

  *(Refining the ISA point)*: The friend's point is that without an ISA, the mapping from physics to computation is observer-relative. This touches on the "triviality of implementation" argument (Searle/Putnam), but I need to frame it as an engineering constraint for WBE, not just philosophy. If there's no ISA, what resolution do we simulate at?

  *(Refining the "Better Analogy")*: The friend's "systolic array" is good, but maybe "Reaction-Diffusion System" or "Morphogenic Field" is even more accurate? No, stick to the friend's suggestion but elaborate on *why* it changes the predictions. It implies that "firmware" (biochemistry) is inseparable from "hardware" (structure).

