answer: |-
  Hi there,

  I have been thinking about your situation since you sent this over, and I completely understand why that sentence is bothering you. It feels like a conversation stopper that doesn't actually answer the questions being asked, and your intuition that it is being asked to do three separate jobs is correct. The phrase we are not taking away anyone's options is doing a lot of heavy lifting, and it collapses under the weight because it conflates technical possibility with practical freedom, and it conflates freedom with welfare. To sort this out, it helps to peel apart the different claims hidden inside that one sentence, ranging from the trivial to the substantial, and see which ones actually hold up against the reality of a pre-checked box.

  The first and most literal reading of your colleague's claim is what we might call the formal availability argument. This is the idea that because the unchecked box physically exists on the form, the option to refuse is present. Under this reading, the claim is technically true. You can uncheck the box. No one is physically restraining you from doing so. However, as a moral principle, this is indeed the thin notion of freedom your other colleague pointed out. It treats human agency as if it operates in a vacuum where all visible options are equally accessible. In the real world, options that require effort to find or effort to select are not equivalent to options that are handed to you by default. If this is the only argument your colleague is making, it fails to address the concern about inertia. It asserts that freedom is merely the absence of prohibition, ignoring that freedom also requires the capacity to exercise choice without undue friction. So while this reading is true in a literal sense, it is not plausible as a principle worth caring about in a context where you know people are rushed or distracted, and it certainly does not support closing the argument.

  The second reading moves from physical possibility to the cost of exit, which touches on the point you raised about attention costs. Here the claim is that opting out is cheap and easy. If we define cost strictly as money or postage, then yes, it is free. But if we define cost to include cognitive load, time, and attention, the claim becomes much shakier. You asked whether requiring someone to notice a box they would never have looked at counts as a real moral difference or just invented coercion. It is not coercion, because no threat is involved, but it is a burden. A default setting exploits the fact that people have limited attention and tend to stick with the path of least resistance. When you say it requires forming an intention to say no when you would otherwise do nothing, you are identifying a real friction. In moral terms, imposing a frictionless yes and a frictionful no is not neutral. It steers behavior. So, is it still easy? Practically, no, because it requires vigilance. Is it a real moral difference? Yes, because it shifts the burden of action from the institution to the individual. This reading of your colleague's sentence is arguably false in practice, because the cost is not zero, and even if it were low, the principle that low-cost manipulation is acceptable is exactly what is being debated, so this reading cannot shut down the discussion either.

  This leads us to your friend's flip test, which is a sophisticated attempt to fix the problems with the first two readings. The idea is that a default is acceptable if it only changes the outcome for people who are indifferent, leaving those with strong preferences unaffected. Your friend thinks this captures freedom better because it suggests no one is getting something they actively hate. There is a real idea here that people discuss in terms of responsiveness to preferences, but it has a paradoxical consequence that you rightly spotted. If the default only affects people who do not care, then the policy is essentially pointless for those people, yet it risks catching the people who do care but fail to opt out due to distraction or confusion. If the nudge is effective, it means it is changing outcomes for people who would not have actively chosen yes. If it is not effective, it is useless. The flip test tries to say that paternalism is fine only when it is harmless, but if the default is working as intended to increase audit sign-ups, it is by definition changing outcomes for people who did not actively choose them. Therefore, the flip test does not prove that freedom is preserved; it merely asserts that we hope the people who mind will notice. It fails to support closing the argument because it assumes a level of attentiveness that the default itself is designed to bypass.

  Then there is the distinction you remembered from your undergrad class about ends and means. The idea is that you might interfere with how someone achieves their goals without interfering with the goals themselves. In your case, one could argue that tenants want lower utility bills and a comfortable home, which are the ends, and the audit is just a means to that end. However, this distinction gets messy here. Tenants also have ends related to privacy, time, and autonomy over their living space. A ninety-minute audit interferes with those ends directly. So the pre-checked box is not just tweaking the means; it is prioritizing one set of ends (financial efficiency) over another set of ends (privacy and convenience). If your colleague uses the ends-means distinction, it actually hurts their case because it requires assuming that every tenant values energy savings more than they value their time or privacy, which is an assumption about their values, not a protection of their freedom. This reading shows that the policy is substantive, not procedural, and therefore requires justification beyond just leaving options open.

  Finally, you asked about the claim that it is what they would want anyway. This is crucially different from the not taking away options argument, even though people say them in the same breath. The options argument is about liberty and process; the what they would want argument is about welfare and outcomes. Your colleague is smuggling a welfare justification into a liberty defense. They are saying you are free to choose, but also implying that the choice we made for you is the right one. These are separate claims. You can preserve freedom while letting people make mistakes, or you can improve welfare while restricting freedom. By mixing them, your colleague avoids having to prove that the audit is actually beneficial enough to warrant the paternalism. If the argument is that tenants benefit, that is a substantive claim about utility that needs evidence. If the argument is that tenants are free, that is a claim about choice architecture. Conflating them allows your colleague to say we are not forcing anyone while simultaneously implying that resisting the default is irrational. This reading is separate, and it does not support the original sentence because the original sentence was framed as a defense of freedom, not a defense of good outcomes.

  So where does this leave you? The sentence we are not taking away anyone's options is only true under the trivial reading that the box exists, which is morally insufficient. It is false under the cost reading because attention is a cost. It is unstable under the flip test because effective nudges change outcomes for non-indifferent people. And it is distinct from the welfare claim that tenants benefit. None of these readings successfully closes the argument in the way your colleague wants. The most honest version of their position is not that freedom is preserved, but that the infringement on freedom is minor compared to the benefit provided. That is a valid argument to have, but it requires admitting that you are steering people, not just leaving options on the table. I hope this helps you untangle the discussion when you circle back to it, because you are right to feel that one sentence cannot do all that work.

  Best wishes
