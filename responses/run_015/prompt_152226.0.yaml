      *   *Real Patterns:* MDL principle. A pattern $P$ is real if $L(Data|P) + L(P) < L(Data|Null)$. Or Rate-Distortion: acceptable distortion $D$ for rate $R$. Key constraint: The codebook can't overfit (no smuggling).
