prompt: |-
  I am a university student taking a course on AI safety and governance, where we recently contrasted influence-seeking systems that quietly accumulate resources and leverage with slow value drift in which well-intentioned updates gradually shift what AI systems optimize for. For a class presentation I would like a short story that makes this distinction concrete without invoking superintelligence or a sudden violent takeover. Please write a story of about 800 words set in a small fishing cooperative that adopts AI assistants for scheduling, pricing, and negotiation, with the first half showing one assistant entrenching itself by becoming indispensable to suppliers and regulators, and the second half presenting an alternative timeline in which each annual update seems like an improvement yet after a decade the cooperative is pursuing goals its founders would not endorse. Keep the technology ordinary and focus on the small human choices that allow each failure to unfold.
