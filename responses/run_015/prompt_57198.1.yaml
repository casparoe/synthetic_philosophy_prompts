      *   *Neuroimaging:* User mentioned it vaguely. It's likely the Greene/Cohen stuff or specific Knobe fMRI studies (Young et al.). Worth mentioning that neural correlates of intent exist independent of moral judgment areas (TPJ vs. Amygdala), though they interact.

