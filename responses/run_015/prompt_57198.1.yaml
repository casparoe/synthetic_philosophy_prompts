  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Welcome to xphi. You've found the big one. But slow down on the eliminativism.
      *   **Point 1: The "Witch" Analogy is Too Strong.** Witches don't exist. Intentions do (neuroscience, planning, AI). The Knobe effect shows the *threshold* for applying the label is moralized, not that the underlying state is fictional. Distinguish *concept* from *application*.
      *   **Point 2: Semantics vs. Pragmatics.** This is the technical philosophical counter-argument. Maybe "intentionally" means "planned + executed," but we *implicate* blame when we use it. Gricean pragmatics. If I say "he did it intentionally," I might be signaling "blame him," even if the literal meaning is neutral. This saves the concept from being *defined* by morality.
      *   **Point 3: The "Deep Self" View.** (Sripada, etc.). It's not just "bad = intentional." It's "does this align with the agent's values?" The Chairman cares about profit, doesn't care about environment. Harming aligns with his indifference/commitment to profit over nature. Helping does not. This is a psychological claim, not purely moral.
      *   **Point 4: Legal Implications.** Law doesn't rely on folk surveys. It relies on *stipulative* definitions (Model Penal Code). Purpose, Knowledge, Recklessness, Negligence. The Knobe effect might bias jurors, yes (empirical legal studies confirm this), but the *standard* isn't broken because the standard is normative, not descriptive. We *want* law to be moralized.
