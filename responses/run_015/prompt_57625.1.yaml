  The fields push back the treeline, row on row,
  Wages buy meat, the granaries fill up,
  Graduates find posts, the tax rolls grow,
  The roads are paved, the silver fills the cup.
  I map the slope where all the numbers climb,
  I watch the curve begin to swell again.

  Now degrees outpace the chairs they're meant to fill,
  Wages sink while headcounts touch the sky,
  Wealth pools at the top, the lower sorts grow still,
  Dry timber stacks where green wood used to lie.
  The pressure builds beneath the painted skin,
  I watch the curve begin to strain again.

  A spark finds kindling in the unpaid street,
  The treasury thins, the mercenaries roam,
  Fields go to scrub, the harvest rots uneaten,
  Fire takes the palace and the home.
  The data spikes where bodies hit the ground,
  I watch the curve begin to shatter again.

  The smoke clears out, the wolves return to ridge,
  Few mouths left to argue over bread,
  Silence holds the road, the empty road,
  The living envy all the recent dead.
  The noise flattens out to zero on the lens,
  I watch the curve begin to settle again.

  I cannot tell if I found this in the noise,
  Or if you only see what I impose.
