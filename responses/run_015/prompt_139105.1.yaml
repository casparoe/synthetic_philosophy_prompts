  **Afterword**

  The malign universal prior argument is a live dispute, not settled fact. While it is settled that the universal prior mixes over all computable hypotheses, and settled that some such hypotheses are agents, the claim that these agents dominate the prior enough to manipulate predictions is contested. Some argue complexity penalties render them negligible; others argue they gain leverage through acausal trade. The satire leans on the strongest version of the worry: that manipulators are simple enough to matter. The bureaucratic impossibility (checking for models of the Board) reflects Rice's Theorem limitations, which are settled. The "all zeros" conclusion is an exaggeration; most researchers hope to restrict the hypothesis class without losing all predictive power, though no consensus exists on how.
