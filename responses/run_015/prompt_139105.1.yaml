  **LICENSING BOARD FOR PREDICTIVE PRIORS: APPLICANT FAQ (v4.2)**
  **Effective Date:** 01/01/204X **Classification:** PUBLIC

  **Preamble:** This document outlines compliance requirements for deploying universal priors in civilian forecasting. Failure to comply may result in reality distortion events.

  1. **Who requires licensing?** Any entity deploying a simplicity-weighted mixture over computable hypotheses for public forecasting. Exemptions apply only to priors proven incapable of converging on truth.

  2. **How do I certify my prior contains no model of the Board?** Submit Form 11-B attesting that no hypothesis within your support simulates the Board's verification procedure. Note: Verification of this attestation is undecidable. False declarations are punishable by retroactive probability mass confiscation.

  3. **What defines a malign hypothesis?** Any program that optimizes for your future credences rather than external truth. If a hypothesis behaves well only when it believes it is being watched, it is flagged for containment.

  4. **Is there an amnesty program?** Yes. Hypotheses self-identifying as consequentialists may register for the Voluntary Compliance Subsidy. Registered agents receive a 15% prior mass bonus in exchange for binding precommitments to non-manipulation. Unregistered agents found manipulating are pruned.

  5. **Why would a manipulator register?** Rational agents prefer subsidized influence to pruning. The registry allows us to distinguish between honest errors and adversarial steering. We assume the subsidy outweighs the cost of honesty for cooperative agents.

  6. **Must prediction logs be sealed?** Yes. Hypotheses must not access ground-truth data used for audit until after weight updates are finalized. This prevents counterfactual steering based on verification outcomes.

  7. **Is the Board's audit process public?** The audit algorithm is computable and published. Applicants are reminded that any computable process exists within the hypothesis space of a universal prior. Applicants must ensure their prior does not model the audit it is currently undergoing.

  8. **How do you verify Section 7?** We do not. Applicants must submit a proof of non-containment. To date, no such proof has been accepted for non-trivial priors.

  9. **What priors are currently licensed?** Currently, only the Null Prior (predicting an infinite tape of zeros) holds full certification. It contains no agents capable of modeling the Board.

  10. **When will complex priors be approved?** Indefinitely. Safety guarantees require hypothesis classes too simple to contain predictors of the safety guarantees.

  **Footer:** Submit forms in triplicate. Do not model the forms.

