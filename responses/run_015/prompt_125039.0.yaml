prompt: |-
  hey, can you draft the joint statement for an adversarial colab between two camps on whether left/right is actually real or just a coalitional accident? Camp A are the 'scope-axis realists' — they think left and right track a deep moral-psychologial split between people who think obligations should expand outward (to strangers, future generations, nonhuman animals) and people who think obligations stay anchored in existing roles, communities, and inherited practices. They claim this one axis predicts clustering across abortion, immigration, climate, and tax policy even when people don't know party positions. Camp B are the 'historical-coalition skeptics' — they say left and right are temporary brand names for alliances that flip constantly, pointing to 19th-century liberals being free-market anti-clericals while modern ones are interventionist, and to left-nationalist vs right-libertarian movements. They think any cross-domain consistency is just elite cue-taking.

  I want the document both could sign: (1) a numbered list of agreed-claims about how political coalitions form, shift, and signal; (2) the exact disagreements phrased so each camp accepts the wording of its own side; (3) the cruxes — I think one is whether there's a single psychologial dimension that predicts cross-domain attitudes better than party ID alone, and another is whether historical reversals (like liberalism's economic flip) are fatal or just surface noise; (4) for each crux, a concrete case or study design both sides agree bears on it, with each side's prediction written down. Also say whether part of the dispute is just verbal about what 'real' means. Format: agreed claims then a disagreements table. Don't ask for a bibliography or cite specific papers — just draft it.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Topic:** Is the Left/Right political spectrum "real" (deep moral-psychological split) or a "coalitional accident" (historical contingency/elite cues)?
      *   **Parties:**
          *   Camp A: Scope-Axis Realists (Left/Right = expanding vs. anchored obligations).
          *   Camp B: Historical-Coalition Skeptics (Left/Right = temporary brand names/alliances).
      *   **Required Components:**
          1.  Numbered list of agreed claims (coalition formation, shifting, signaling).
          2.  Exact disagreements (phrased so each accepts their own wording).
          3.  Cruxes (Psychological dimension vs. Party ID; Historical reversals as fatal vs. noise).
          4.  Concrete cases/study designs for each crux with specific predictions for each side.
          5.  Address the verbal dispute aspect ("real").
      *   **Format:** Agreed claims first, then a disagreements table.
      *   **Constraint:** No bibliography, no specific paper citations.

  2.  **Deconstruct the Positions:**
      *   *Camp A (Realists):* Believes in a underlying latent trait (Scope of Moral Concern). Predicts consistency across issues regardless of party branding. Sees history as surface noise over a deep structure.
      *   *Camp B (Skeptics):* Believes in coalition building based on interest/power. Predicts consistency only when elites signal. Sees history (flips) as evidence that the axis is arbitrary.
      *   *Common Ground:* Both agree politics involves coalitions, elites matter, people cluster on issues, and labels change over time. Both agree *something* causes clustering, they disagree on *what*.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find the intersection.
      *   Claim 1: Clustering exists (people don't hold random views).
      *   Claim 2: Elites/Parties influence positioning (cue-taking happens).
      *   Claim 3: Coalitions shift over time (historical fluidity).
      *   Claim 4: Moral intuitions play *some* role (even Skeptics admit psychology matters, just not as a fixed axis).
      *   Claim 5: The terms "Left" and "Right" are used consistently in modern discourse, even if their content changes.

  4.  **Drafting Section 2: Disagreements (The Core):**
      *   Need to phrase these carefully so Camp A doesn't feel Camp B's wording concedes too much, and vice versa.
      *   *Disagreement 1: Source of Covariance.* A says deep psychology; B says elite coordination.
      *   *Disagreement 2: Historical Stability.* A says core meaning persists; B says content is contingent.
      *   *Disagreement 3: Predictive Power.* A says scope-axis predicts better than party; B says party predicts better than scope-axis.
      *   *Verbal Dispute:* Acknowledge that "real" might mean "psychologically innate" vs. "sociologically robust."

  5.  **Drafting Section 3: Cruxes & Study Designs:**
      *   *Crux 1: The Psychological Predictor.*
          *   *Design:* Novel issues where party cues are absent or scrambled.
          *   *A Prediction:* Scope-axis scores will correlate with stance even without party cues.
