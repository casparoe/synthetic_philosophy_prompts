prompt: |-
  You're a professional philosopher of language and metaontology, and I want you to think step-by-step and really dig in. Before giving the final answer, do a quick brainstorm of all the defeaters you can think of, then sort them by how serious they are.

  I hold this deflationairy view: the free-will debate isn't a deep metaphysical dispute but a framing disagreement about which normative register we should index 'desert' and blame to — either our reactive attitudes (Strawson-style) or an objective moral ledger (retributivist). Both libertarians and hard determinists wrongly assume there's one correct metaphysical answer that picks the register. It's closer to Carnap but not quite: the parameter is which community's practices of praise and blame we treat as authoritative, like an indexical in logical space. The underlying physics and psych are shared; only the framing shifts.

  What would actually count against this? Rank the defeaters: fatal versus awkward. Would it collapse if reactive attitudes themselves presupposed libertarian freedom? If anthropology showed universal convergence on one framing? If neuroscience revealed that blame-tracking literally detects an objective moral property? Or if the view turned out to be unfalsifiable — every counterexample gets dismissed as "just the other framing"?

  Be honest: is this qualified into unfalsifiability, and is that a problem for this kind of view? What would defenders concede as genuinely damaging, versus what we'd dismiss? Don't give me a bibliography or reading list — just reason from the concepts. I want the exposure map: what does this view actually risk?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Role:** Professional philosopher of language and metaontology.
      *   **Task:** Think step-by-step, dig deep, brainstorm defeaters for a specific deflationary view on free will, sort them by severity (fatal vs. awkward), and assess the risk of unfalsifiability.
      *   **The View:** A deflationary/quasi-Carnapian view. The free will debate isn't metaphysical but a framing disagreement about normative registers (reactive attitudes vs. objective moral ledger). Libertarians and hard determinists are both wrong about there being a single metaphysical fact. The "parameter" is which community's practices are authoritative (indexical in logical space). Underlying physics/psych are shared.
      *   **Constraints:** No bibliography/reading list. Reason from concepts. Be honest about risks (unfalsifiability). Provide an "exposure map" (what does this view risk?).
      *   **Specific Questions to Address:**
          *   What counts against this?
          *   Rank defeaters (fatal vs. awkward).
          *   Specific scenarios: Reactive attitudes presupposing libertarian freedom? Anthropological convergence? Neuroscience detecting moral properties? Unfalsifiability?
          *   Is unfalsifiability a problem here?
          *   What would defenders concede vs. dismiss?

  2.  **Deconstruct the View:**
      *   *Core Claim:* Free will disputes are verbal/normative framing disputes, not ontological ones.
      *   *Mechanism:* Indexicality of 'desert'/'blame'. Context determines the relevant normative framework (Strawsonian vs. Retributivist).
      *   *Metaphysical Stance:* Anti-realist about the *dispute*, realist about the underlying physics/psychology.
      *   *Philosophical Lineage:* Carnap (frameworks), Strawson (reactive attitudes), perhaps some contextualism or expressivism.

  3.  **Brainstorming Defeaters (Initial Dump):**
      *   *Phenomenology:* It *feels* like we are arguing about facts, not frames. Error theory?
      *   *Presupposition:* Do reactive attitudes *require* libertarian freedom to function? If yes, the frames aren't independent.
      *   *Convergence:* If every culture converges on one view, is it really just a frame choice?
      *   *Neuroscience:* If brain states correlate perfectly with "moral responsibility" in a way that implies a non-natural property (unlikely but hypothesized).
      *   *Pragmatics:* Does the view undermine the practice of blaming itself? If blame is just a frame, does it lose its bite?
      *   *Unfalsifiability:* Can any evidence be interpreted as "just a different frame"?
      *   *Normative Force:* If it's just a choice of frame, why choose the moral one? Is there a higher norm?
      *   *Semantic Externalism:* Maybe 'free will' refers to a natural kind we haven't found yet.
      *   *The "Hard Problem" of Agency:* Is there an irreducible first-person experience of choice that contradicts the physics/psych shared base?

  4.  **Sorting and Evaluating Defeaters (The "Ranking" Phase):**

      *   *Candidate 1: Reactive Attitudes Presuppose Libertarianism.*
          *   *Analysis:* Strawson argued they don't. But if psychological research showed that human resentment *only* triggers when people believe in contra-causal freedom, and collapses otherwise, the "Strawsonian frame" might be psychologically unstable without the "Libertarian metaphysics."
          *   *Severity:* High. If the frame requires the metaphysics it denies, the view collapses.
          *   *Verdict:* **Fatal (if proven).**

      *   *Candidate 2: Anthropological Universality.*
          *   *Analysis:* If all cultures treat blame as requiring ultimate responsibility (libertarian), does that make it objective? Not necessarily (universal error). But if the *concept* itself is invariant, the "indexical" claim weakens.
          *   *Severity:* Medium. Universal error is possible, but makes the "choice of frame" less arbitrary.
          *   *Verdict:* **Awkward (pressures the view, doesn't kill it).**

      *   *Candidate 3: Neuroscience Detecting Moral Properties.*
          *   *Analysis:* This is category confusion. Neuroscience detects physical properties. If it detects a property that *causes* blame judgments, that's just psych. If it detects a "normative particle," that's metaphysically wild.
          *   *Severity:* Low/Category Mistake. The view already grants shared physics/psych.
          *   *Verdict:* **Dismissible (conceptual confusion).**

      *   *Candidate 4: Unfalsifiability / "Just a Different Frame".*
          *   *Analysis:* This is the biggest risk for Carnapian views. If *any* objection is met with "that's just your framework," the view is immune to critique but also empty.
          *   *Severity:* High. Threatens theoretical utility.
          *   *Verdict:* **Fatal (if it leads to quietism without pragmatic justification).**

      *   *Candidate 5: Normative Authority (The "Why Care?" Problem).*
          *   *Analysis:* If both frames are equally valid metaphysically, why prefer the moral responsibility frame? If there's no higher norm to choose the frame, the view offers no guidance.
          *   *Severity:* High. Makes the philosophy practically inert.
          *   *Verdict:* **Fatal (pragmatically).**

      *   *Candidate 6: Semantic Reference (Natural Kind).*
          *   *Analysis:* If 'free will' refers to a specific cognitive capacity (e.g., executive control), and we find it exists or doesn't, the debate *is* metaphysical/empirical.
