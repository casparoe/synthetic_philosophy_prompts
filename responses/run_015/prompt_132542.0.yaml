      *   *Refining the Unfalsifiability point:* It's not empirical falsifiability (Popper) but *dialectical* vulnerability. If it can't be argued against, it can't be argued for.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the specific scenarios requested? (Reactive attitudes, anthropology, neuroscience, unfalsifiability). Yes.
      *   *Check:* Did I avoid bibliography? Yes.
      *   *Check:* Is the distinction between "physics/psych" and "normative register" clear? I need to ensure I don't conflate the underlying mechanism with the normative framing.
      *   *Check:* Is the "indexical" analogy robust? Indexicals depend on context. If the context is fixed by human nature, is it really indexical? This is a strong point to raise.

  8.  **Final Polish:** Ensure the distinction between *ontological deflation* and *normative pluralism* is clear. The view claims the *ontology* is settled (physics/psych), but the *normativity* is parameterized. The risk is that the normativity might depend on the ontology more than admitted.

  **(Self-Correction Note):** I need to be careful with the "Neuroscience detecting moral property" point. The user asked if it would count against the view. I should explain *why* it likely wouldn't (category error) but acknowledge if neuroscience showed that *believing* in libertarian freedom is a necessary causal condition for the reactive attitudes, that *would* be damaging. I will make that distinction clear.

  9.  **Finalizing the Ranking:**
      1.  **Fatal:** Internal Dependence (Attitudes require the metaphysics they deny).
      2.  **Fatal:** Normative Nihilism (No way to choose frames renders the view practically useless).
      3.  **Fatal:** Dialectical Immunity (Unfalsifiability leading to triviality).
      4.  **Awkward:** Universal Convergence (Suggests the "parameter" isn't free).
      5.  **Awkward:** Semantic Naturalism (Ordinary language refers to capacities, not frames).
      6.  **Dismissible:** Neuroscience detecting "moral particles" (Category error).

