  2. It must explain how one utterance can be honest to specialists yet deceptive to lay readers, which is a must-have for science coverage but often smuggles in the prejudice that expertise grants immunity from moral scrutiny.

  3. It must judge a system that emits only true sentences selected to maximize false belief as wrong solely based on outcome, a nice-to-have for future-proofing that cannot be jointly satisfied with Item 1 if mental state is required and risks wearing the badge of consequentialist prejudice.

  4. It must separate the wrongness of the act from the blame owed by the agent, especially in conventional deception like diplomatic formulas, which is a must-have for your piece but frequently hides the prejudice that following social scripts reduces culpability.

  5. It need not explain why liars choose lying over cheaper misleading since that is a sociological question with no business on the list, though it must account for false statements expected to be disbelieved as a must-have case that often hides the prejudice that unsuccessful lies are morally negligible.
