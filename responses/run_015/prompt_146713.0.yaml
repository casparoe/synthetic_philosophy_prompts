prompt: |-
  I need to plan a session for first-year grad students in political philosophy who haven't really done normative ethics but can follow an argument. I'm teaching the demandingness objection to consequentialism, but I'm not using the usual famine-donation setup—everyone's seen that. Instead I'm framing it through "moral overtime," the idea that consequentialism doesn't just ask for occasional heroism but treats every waking minute as on-call for marginal improvement, like labor overtime that never ends. The carrying example should be something mundane—maybe how they spend a free Saturday morning—so they feel the micro-demand in thier own schedule rather than in some distant crisis.

  Plan the arc: what idea has to be in place before they can even see why "too demanding" is a distinct objection (not just "too hard"), the dependancy chain that builds from maximization to continuous scope to accumulated cost, the one scenario to carry it (needs to be close to home, not abstract), the misconceptions in order—probably they think demandingness means "impossible for weak humans" rather than "unreasonable to require," then they confuse it with supererogation, then they think you can escape by just doing "enough"—where in the sequence to intercept each, the check that shows they've actually grasped the objection rather than just nodding at "people are selfish," and what I'm leaving out on purpose: no history of Scheffler or Singer, no formal utility calculus, no bibliography, and I should say so up front. Make clear why you can't present the overtime framing before they've already bought that consequentialism applies to omissions and lifestyle choices, not just big rescue decisions.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** First-year grad students in political philosophy. They can follow arguments but lack specific background in normative ethics.
      *   **Topic:** The Demandingness Objection to Consequentialism.
      *   **Unique Framing:** "Moral Overtime" (continuous on-call status vs. occasional heroism). Avoid the standard famine/donation trope.
      *   **Key Example:** Mundane scenario (e.g., a free Saturday morning).
      *   **Required Arc:**
          1.  Prerequisite concept (why "too demanding" $\neq$ "too hard").
          2.  Dependency chain (Maximization $\rightarrow$ Continuous Scope $\rightarrow$ Accumulated Cost).
          3.  The Scenario (close to home).
          4.  Misconception Interception (Order: Impossible vs. Unreasonable $\rightarrow$ Supererogation $\rightarrow$ "Doing Enough").
          5.  Comprehension Check (beyond "people are selfish").
          6.  Explicit Exclusions (No Scheffler/Singer history, no calculus, no bibliography).
      *   **Specific Constraint:** Explain *why* the overtime framing can't come before establishing consequentialism's scope (omissions/lifestyle).

  2.  **Deconstruct the Logic of the Objection:**
      *   To feel "demanded upon," you must first accept that morality governs *everything* you do (Scope).
      *   To feel "overworked," you must accept that you must always do the *best* (Maximization).
      *   To feel "burned out," you must see that small sacrifices add up over a lifetime (Accumulation).
      *   The objection isn't "I can't do it" (Psychological impossibility); it's "I shouldn't *have* to do it" (Normative unreasonableness).

  3.  **Drafting the Arc - Step-by-Step:**

      *   **Introduction (Setting Boundaries):** Acknowledge the exclusions immediately. This manages expectations and keeps focus on the structure of the argument, not the literature.
      *   **Phase 1: The Scope Setup (Prerequisite):** Before "overtime" makes sense, they need to know the job never ends. If morality only applies to big crises, a Saturday morning is free time. If morality applies to *all* actions/omissions, Saturday morning is work time.
      *   **Phase 2: The Engine (Maximization):** It's not just "do good," it's "do the *most* good." This turns free time into potential work time.
      *   **Phase 3: The Scenario (Saturday Morning):** Apply the engine to the mundane. Coffee vs. Donation. Walk vs. Volunteer.
      *   **Phase 4: The Dependency Chain (Building the Objection):** Connect the dots. Max + Scope = No Rest. No Rest + Lifetime = Overtime.
      *   **Phase 5: Intercepting Misconceptions:**
          *   *Misconception 1:* "It's too hard for humans." (Correction: It's about authority, not capacity).
          *   *Misconception 2:* "That's just supererogation." (Correction: Consequentialism denies supererogation).
          *   *Misconception 3:* "Just do enough." (Correction: Maximization forbids 'enough').
      *   **Phase 6: Comprehension Check:** Needs to test the *normative* force, not psychological fatigue.
      *   **Conclusion:** Wrap up.

  4.  **Refining the "Why" (The Constraint):**
      *   Why can't I start with Overtime? Because if students think morality is just "don't murder/steal," then a Saturday morning is inherently non-moral. The "overtime" metaphor only works if the "regular time" already covers *all* waking hours. I need to make sure they grasp the *comprehensiveness* of consequentialist evaluation first.

  5.  **Developing the Content (Iterative refinement):**

      *   *Scenario:* A Saturday morning. You have 4 hours. You could grade papers (career), sleep (rest), or volunteer/donate time (moral good). Consequentialism says: Calculate the utility. If volunteering yields more utility than grading or sleeping, you *must* volunteer. Every Saturday. For 40 years.
      *   *Misconception 1 (Hard vs. Wrong):* Students often say "No one can do that." I need to push them to "Even if a saint could, is it *fair* to ask?"
      *   *Misconception 2 (Supererogation):* They will say "That's above and beyond." I need to show Consequentialism says "No, that's the baseline."
      *   *Misconception 3 (Satisficing):* They will say "Just do 80%." I need to show strict Consequentialism rejects this.

  6.  **Review against Constraints:**
      *   First-year grads? Yes, keep tone rigorous but accessible.
      *   No Singer/Scheffler? Yes, explicitly state this.
      *   No calculus? Yes, focus on the structure.
      *   Saturday morning example? Yes.
      *   Overtime framing? Yes, central metaphor.

  7.  **Final Polish:** Organize into clear time blocks or sections. Ensure the "Dependency Chain" is visually or logically distinct. Make sure the "Why Scope First" explanation is prominent as requested.

      *(Self-Correction during drafting)*: I initially thought about putting the misconceptions at the end. But the prompt asks "where in the sequence to intercept each." It's better to weave them in as they naturally arise during the argument construction. I will place them as "Speed Bumps" in the flow.

      *(Refining the Comprehension Check)*: Don't ask "Is this too hard?" Ask "If we accept this, what happens to the concept of a 'personal life'?" That tests the normative implication.

  8.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  Here is a session plan designed for first-year grad students in political philosophy. It prioritizes the structural logic of the argument over historical exegesis, using your "Moral Overtime" framing.

  ### Session Overview: The Moral Overtime Objection
  **Time:** 75 Minutes
  **Goal:** Students will distinguish the *demandingness objection* (normative unreasonableness) from psychological impossibility, tracing how consequentialist maximization converts mundane leisure into mandatory labor.
  **Explicit Exclusions:** At the very start, state: *"We are not doing intellectual history today. No Scheffler, no Singer, no bibliography. We are also not doing utility calculus. We are analyzing the structural implications of a maximization requirement on a human life."*

  ---

  ### Part 1: The Prerequisite (15 mins)
  **Concept:** The Scope of Moral Evaluation (Omissions & Lifestyle)
  **Why this must come first:** You cannot frame morality as "overtime" if students assume morality is only "on the clock." If they believe moral duties only apply to specific crises (e.g., saving a drowning child) or explicit promises, then a Saturday morning is inherently "off the clock." The overtime objection only lands if consequentialism claims jurisdiction over *every* waking minute.

  *   **The Move:** Establish that for the consequentialist, there is no moral/neural distinction between *acting* and *refraining*, or between *career choice* and *charity choice*.
  *   **Discussion Question:** "If you stay home to grade papers instead of volunteering, have you *done* something morally neutral, or have you *omitted* something morally required?"
  *   **Target Consensus:** Consequentialism treats the omission of the better act as a moral failure. Therefore, the "work day" of morality is 24/7.

  ### Part 2: The Engine (10 mins)
  **Concept:** Maximization vs. Sufficiency
  **The Move:** Define the demand. It is not "do good," it is "do the *most* good possible."
  *   **Key Distinction:** Differentiate between a *threshold* (do enough to be good) and a *ceilingless standard* (always push the ceiling higher).
  *   **Intercepting Misconception #1 (The "Enough" Escape):**
      *   *Student Intuition:* "Why can't I just do my fair share? Why do I have to max out?"
      *   *Interception:* Stop them here. Explain that "doing enough" is a *satisficing* view, not a maximizing one. To understand the objection, they must steel-man the target: Strict Consequentialism demands the *optimum*, not the *satisfactory*. If they relax the standard now, the objection evaporates.

  ### Part 3: The Scenario (15 mins)
  **Concept:** The Saturday Morning Test (Mundane Accumulation)
  **The Move:** Apply the Engine to the Scope using a mundane example. Avoid famine; focus on opportunity cost.
  *   **The Setup:** It is Saturday, 9:00 AM. You have 4 free hours.
      *   Option A: Sleep in, make coffee, read a novel (Rest/Pleasure).
      *   Option B: Grade papers (Career/Long-term utility).
      *   Option C: Volunteer at a shelter or fundraise (Direct Altruistic Utility).
  *   **The Consequentialist Calculation:** If Option C produces 10 units of good, Option B produces 8, and Option A produces 2, you are morally required to choose C.
  *   **The Twist:** Now multiply. Not just this Saturday. Every Saturday for 40 years. Plus the evenings. Plus the career choices.
  *   **Intercepting Misconception #2 (Supererogation):**
      *   *Student Intuition:* "But choosing C is heroic/saintly. It's above the call of duty."
      *   *Interception:* Challenge the phrase "above the call of duty." Under this framework, there is no "above." There is only "duty" and "failure." If C is best, C is mandatory. Calling it "supererogatory" is a way of smuggling in a non-consequentialist intuition.

  ### Part 4: The Dependency Chain (15 mins)
  **Concept:** Building the "Overtime" Objection
  **The Move:** Visually map the logical chain on the board. This shows why "too demanding" is a structural critique, not a complaint about difficulty.

  1.  **Universal Scope** (Morality applies to all omissions/actions)
      $\downarrow$
  2.  **Maximization** (Must always choose the optimal outcome)
      $\downarrow$
  3.  **Continuous Opportunity Cost** (Every leisure moment is a potential moral failure)
      $\downarrow$
  4.  **Accumulated Cost** (A life without significant personal projects)
      $\downarrow$
  5.  **The Objection:** The theory requires a life that is *unreasonable to require*, even if possible.

  *   **Crucial Distinction:** Differentiate **"Too Hard"** (Psychological Impossibility) vs. **"Too Demanding"** (Normative Unreasonableness).
  *   **Intercepting Misconception #3 (Human Weakness):**
      *   *Student Intuition:* "People are selfish; they won't do this. So the theory is impractical."
      *   *Interception:* Correct them. The objection isn't that humans *won't* do it; it's that morality shouldn't *ask* it. Even if a saint *could* work moral overtime forever without burnout, it would still be objectionable because it leaves no room for the agent's own life. The objection is about *authority*, not capacity.

  ### Part 5: Comprehension Check (15 mins)
  **Concept:** Verifying Grasp of the Normative Claim
  **The Move:** Do not ask "Is this too hard?" (They will just say yes). Ask a question that forces them to weigh the theory against the cost to the agent.

  *   **The Prompt:** "Imagine a version of Consequentialism that admits this requires 'moral overtime' but argues: *'So what? The good is the good. If the theory requires you to have no personal life, then you should have no personal life.'* What is the specific counter-argument you must make to defeat this? You cannot appeal to 'burnout' or 'human nature.' What normative value is being violated?"
  *   **Desired Answer:** Students should identify that the theory fails to account for the *separateness of persons* or the *value of personal integrity/projects*. They need to articulate that a moral theory that consumes the agent entirely treats the agent as a mere vessel for utility, rather than a person with a life to lead.
  *   **Failure State:** If they answer "People will rebel" or "It causes depression," they have missed the point. They are arguing psychological feasibility, not normative reasonableness.

  ### Part 6: Wrap Up (5 mins)
  **Concept:** The Stakes
  **The Move:** Summarize why this matters for political philosophy.
  *   **Takeaway:** If a moral theory demands total "on-call" status, it leaves no normative space for personal rights, private projects, or partiality to loved ones.
  *   **Closing:** "The demandingness objection isn't a plea for laziness. It's a claim that a moral theory which leaves no room for a 'life' is a theory that has lost the plot of what morality is for."

  ---

  ### Instructor Note: Why the Sequence Matters
  You asked to make clear why the **Overtime Framing** cannot precede the **Scope Setup**.

  **Reason:** The metaphor of "overtime" relies on the premise that "regular time" already covers the whole day.
  *   If students think morality is limited to "don't kill/steal" (Common Sense Morality), then Saturday morning is *non-moral time*. You cannot be "on call" during non-moral time.
  *   By establishing **Universal Scope** first, you convert Saturday morning into "regular moral work time."
  *   By establishing **Maximization** second, you convert that work time into "high-intensity labor."
  *   Only *then* does the lack of rest become "Overtime."

  If you start with Overtime, students will reject the premise, thinking, "I'm not on call Saturday mornings, that's my free time." You must first convince them that, for the consequentialist, *there is no such thing as free time.*
