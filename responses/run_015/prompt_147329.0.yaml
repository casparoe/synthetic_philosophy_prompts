answer: |-
  It is a genuinely sharp observation you have made, and that nagging inconsistency you feel is actually one of the central tensions in modern liberal political theory. When we tax estates but leave social capital untouched, we are operating on a specific, often unstated, theory about what counts as an unfair advantage versus what counts as a legitimate expression of family life. The implicit theory presupposes a distinction between fungible assets and embodied social position, relying heavily on the idea that money is external to the person while culture and connections are internal to the relationship. By taxing cash at death, we acknowledge that unearned financial windfalls distort the starting line of opportunity, but by ignoring the transmission of networks, manners, and confidence, we implicitly concede that the family sphere is a private zone where equality of opportunity cannot fully penetrate without violating parental liberty. We treat money as a stockpile that can be seized and redistributed without harming the soul of the family, whereas social capital is viewed as inseparable from the act of parenting itself. To tax a parent for reading to their child, introducing them to professional contacts, or modeling confident behavior would feel like an intrusion into the intimate fabric of human relationships, whereas taxing a bank account feels like a bureaucratic adjustment to an external resource. This suggests our philosophical commitment is not truly to equal opportunity in a robust sense, but rather to a compromised version that prioritizes family autonomy over level playing fields, accepting that some forms of privilege are too costly to liberty to eliminate.

  However, when you hold this implicit theory up against our other societal commitments, specifically public education and merit-based hiring, the coherence begins to fray significantly. Public education is justified on the premise that it acts as a great equalizer, neutralizing the disparities of birth so that talent can rise regardless of background. Yet if the advantage conferred by social capital is as potent as you suggest, then public education is fighting a losing battle against the private socialization that happens at home and in private networks. We fund schools to create equality, but we allow families to purchase superiority through neighborhood selection, unpaid internships, and cultural tutoring, effectively rendering the school system a secondary influence compared to the dynastic transmission of status. Similarly, merit-based hiring presupposes that we are rewarding individual effort and ability, but if cultural fluency and professional networks are inherited rather than earned, then what we call merit is often just inherited advantage disguised as personal virtue. A candidate who speaks the right language, knows the right people, and possesses the right confidence is often rewarded as being more meritorious, when in reality they are simply benefiting from a form of inheritance that escapes the taxman. This creates a system that claims to be meritocratic while systematically rigging the game for those who inherit social position, making our public justification for hiring and schooling somewhat hypocritical.

  If we were to adopt a stricter luck-egalitarian view, which demands that individuals should not be disadvantaged or advantaged by brute luck such as the family they are born into, the policy implications would be far more radical than simply tweaking estate tax rates. A consistent luck-egalitarian approach would require us to neutralize all unearned advantages, not just financial ones. This might lead to policies like a universal citizen inheritance or stakeholder grant, where every young adult receives a substantial capital endowment from the state to offset the private wealth they did not inherit. It would also demand a much more aggressive intervention in early childhood, such as universal, high-quality boarding schools or full-time childcare from a very young age, to dilute the impact of parental socialization. Some theorists have even argued that this logic pushes toward the abolition of the family as a private property-holding unit, though most luck-egalitarians stop short of that, seeking instead to maximize the baseline for everyone while capping the ceiling for the wealthy. The key shift here is moving from taxing death to subsidizing birth and young adulthood, ensuring that the starting line is genuinely equalized by public resources rather than just trimming the excesses of the finish line.

  On the other hand, a relational-equality view would focus less on the distribution of assets and more on preventing the emergence of caste-like hierarchies and domination. From this perspective, the problem with dynastic wealth is not just that it is unearned, but that it allows one class of citizens to dominate the social and political landscape, undermining the status of others as equals. A policy built on this view would target the conversion of wealth into power. This could mean strict bans on legacy admissions in universities, which effectively monetize social capital into educational credentials, or rigorous blind hiring practices and standardized skills assessments that strip away the signaling value of cultural fluency. It might also involve breaking up concentrated media ownership or tightening campaign finance laws to prevent economic dynasties from becoming political dynasties. The goal here is not necessarily to make everyone equal in wealth, but to ensure that no family can accumulate enough social and economic power to dictate the terms of social cooperation for everyone else. This approach accepts some inequality but draws a hard line where inequality begins to threaten the democratic standing of other citizens.

  To actually implement these views, we would have to change not just the tax code but the architecture of social mobility itself. We would need to treat access to networks as a public good rather than a private privilege, perhaps through mandated mentorship programs or national service initiatives that mix children from different backgrounds during their formative years. We would need to reconsider the legality of unpaid internships, which act as a gatekeeping mechanism for those with parental financial support, and instead subsidize early career experiences for everyone. We might even need to look at zoning laws and housing policy, since residential segregation is the primary mechanism by which social capital is hoarded and transmitted geographically. Ultimately, addressing the inconsistency you noticed requires admitting that our current compromise is unstable. We want the warmth and intimacy of the family, but we do not want the unfairness that comes with it. A coherent system would either have to embrace more radical redistribution to neutralize the family advantage, or it would have to honestly admit that equal opportunity is limited by our commitment to family liberty, stopping the pretense that meritocracy is fully achievable under current conditions. Until we decide which value takes precedence, we will remain stuck with a system that taxes the money parents leave behind while letting them pass down the much more valuable advantage of who they know and how they belong.
