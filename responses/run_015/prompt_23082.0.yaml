prompt: |-
  I'm teaching a seminar on the ethics of war this semester (I'm actually more of a metaethics person, so I'm a little out of my depth here), and I got stuck on a question a student raised last week. A pretty sharp student, but new to the topic, asked me why a soldier who's part of an unjust invasion is treated basically the same as a soldier who's defending their own country — like, why isn't it a war crime for the defenders to shoot the invaders in battle, even though the invasion was obviously the wrong thing to do? I told them it's because the laws of war have this idea that soldiers on both sides are treated equally in combat, but the student pushed back and said that seems to let the agressors off the hook. Their specific worry is that if we treat the invaders the same as the defenders, we're implicitly saying that the invaders' actions in battle are morally equivalent to the defenders' actions, which the student thinks is obviously false.

  I'm not sure how to respond. I feel like there's a distinction I should be making here, between something legal and something moral, but I can't quite articulate it, and I don't want to just wave my hands at the student. Can you help me think through how to answer this? And is the student's objection actually a good one, or is it based on a confusion I should be able to clear up?
