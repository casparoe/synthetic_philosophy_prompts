  # Counterfactual Development Partners, LLP
  **Turning Historical Ambiguity into Actionable Policy**

  ### Our Mission
  At Counterfactual Development Partners (CDP), we understand that national prosperity is not a matter of fate, but of identification. Governments often struggle to allocate resources because they cannot distinguish between the causal effects of institutions, geography, and culture. We solve this. By supplying properly randomized history, we allow your administration to move beyond correlation and invest in the true drivers of growth. We do not predict the future; we engineer the past required to explain it.

  ### Core Solutions

  **1. Institutional Randomization Protocol (Flagship)**
  Our premier offering isolates the impact of governance structures. CDP will randomly assign inclusive versus extractive institutional frameworks to matched provinces within your sovereign territory. To ensure statistical power, the extractive treatment arm must remain in place for a minimum of eighty years. Our team handles the logistical implementation of property rights seizures and bureaucratic barriers, ensuring the shock is exogenous to local political cycles. This package includes a full century of monitoring to capture long-run persistence effects.

  **2. Geographic Endowment Reallocation**
  Why be landlocked when you could be coastal? Our Geographic Relocation package physically reassigns latitude, continental axis orientation, and disease burden to treatment clusters. We offer modular upgrades for navigable water access and temperate climate zones. Please note: due to the immutability of tectonic plates, this service requires substantial lead time and may involve the metaphorical relocation of economic activity rather than physical landmasses.

  **3. Cultural Re-education Module**
  Often sold as an add-on, this module calibrates local attitudes toward trust, patience, and work ethic. Using standardized interventions, we ensure cultural variables are orthogonal to institutional quality. This allows clients to claim culture is either the fundamental cause or a residual channel, depending on quarterly reporting needs.

  ### Methodology & Instrumentation
  CDP employs a proprietary **Triangulation Guarantee**. We certify that institutions, geography, and culture will each be identified as the true cause of development within acceptable confidence intervals. For clients requiring robust exogenous variation, we utilize our **Settler Mortality Instrument**. This powerful tool leverages historical disease environments and colonial policy decisions to predict present-day institutional quality. We take pride in this instrument's composite nature, drawing strength from geographic and political vectors simultaneously to maximize first-stage F-statistics.

  ### Terms and Pricing Structure
  All engagements are subject to our Standard Identification Waiver.
  *   **Exclusion-Restriction Waiver:** Clients acknowledge that the instrument may affect outcomes through channels other than the treated variable.
  *   **Spillover Surcharge:** Applied when institutional treatments in treated provinces leak into untreated control groups, requiring larger sample sizes to maintain power.
  *   **Persistence Surcharge:** Results delivered in eighty to one hundred and twenty years. Early termination fees apply if the regime changes before convergence.
  *   **External-Validity Rider:** CDP guarantees internal validity for the specific provinces treated. Generalizing results to the entire nation incurs a Local-to-National Scaling Fee.
  *   **Unit of Analysis Fee:** Charged if the client wishes to switch from province-level to country-level data mid-engagement.

  ### Client Testimonial
  > "Before CDP, we didn't know if our stagnation was due to our latitude or our laws. Now we know it's both, sequentially. The extractive institutional pilot was difficult to administer to the southern provinces, but the coefficient on GDP per capita was remarkably precise. Finally, we have policy clarity."
  > — *Finance Minister, Republic of Ostralba*

  ### Frequently Asked Questions

  **Q: Is it ethical to impose extractive institutions on half the population for a century?**
  A: Our interventions are designed to be technically rigorous rather than normative. We focus on ensuring the treatment is administered uniformly to avoid selection bias.

  **Q: How do you distinguish causality from correlation?**
  A: We rely on the magnitude and precision of our estimates. When a coefficient is large and the standard errors are small, the relationship is effectively causal for policy purposes.

  **Q: What if the Settler Mortality Instrument conflates geography and institutions?**
  A: This conflation provides a robustness check. It allows us to bill under both the Geographic and Institutional line items while maintaining a single identification strategy.

  **Q: Can we get results sooner than eighty years?**
  A: Short-term results are available using cross-sectional proxies, though these come with an Omitted Variable Bias Disclaimer.

  ***

  **Counterfactual Development Partners, LLP**
  *Identifying the Unobservable.*
