  The coffee in the Cambridge faculty room had gone lukewarm, but neither speaker seemed to notice. The hum of the conference was fading into the corridor, leaving the Guardian and the Civic Participant alone with the residue of the panel.

  **Guardian:** You are asking us to accept a bifurcation that Keynes himself would have rejected. Your 'precarity-priority' reading suggests that when the world is stable, we pursue Moorean states of mind, but when it is unstable, we switch to a different ethical register focused on action. This implies Keynes abandoned the core insight of his early life: that only certain states of consciousness are intrinsically valuable.

  **Civic Participant:** I am not suggesting he abandoned the core, but that he expanded the topology of the good. Your reading treats 'agential goods'—the excellences of acting under uncertainty—as merely instrumental. I am arguing that for the later Keynes, the exercise of judgment in the face of opacity became partly constitutive of the good life. It is not just a tool to secure the garden; tending the garden in a storm is itself a form of human flourishing.

  **Guardian:** But that smuggles in a virtue ethic that clashes with his aristocratic liberalism. If stewardship under opacity becomes a primary good, Keynes becomes a civic republican. He becomes a man who finds salvation in public duty. Yet everything we know about him suggests he viewed public service as a burden, a clearance operation necessary to return to the real business of living. The 'precarity-priority' principle turns a temporary emergency ethic into a permanent feature of his moral psychology.

  **Civic Participant:** Is it temporary? Look at the trajectory. In the early essay on the economic possibilities for our grandchildren, he anticipates a future where the economic problem is solved, and we can return to being lilies of the field. But by the time he reads his memoir to the club in 1938, the tone has shifted. He speaks of his early beliefs with affection, yes, but also with a critical distance. He admits that ignoring the consequences of action because one assumes the universe is organic and harmonious was dangerous.

  **Guardian:** He calls it dangerous, not wrong. He acknowledges that ignoring consequences can lead to bad outcomes, which threatens the conditions for receptivity. But that does not mean the activity of managing consequences becomes intrinsically valuable. It remains instrumental. He regrets the naivety, not the goal. The goal remains love, art, and the pursuit of truth. The 'precarity-priority' reading risks conflating the necessity of action with the value of action.

  **Civic Participant:** But consider the nature of that action. It is not bureaucratic management. It is judging probabilities without full information. It is accepting responsibility for institutions one cannot fully control. If these are merely instrumental, why does he describe the failure to engage as a moral failing in his later years? If agential goods were only tools, he could have handed the reins to technocrats and retired to Bloomsbury. Instead, he stayed in the fray.

  **Guardian:** Because the technocrats would have ruined the conditions for the good life! He stayed because he was a guardian of the possibility of civilization. But do not mistake the protection of the condition for the condition itself. He did not find the good life in the Treasury; he found it in the arts council and his private circles. The 'speculator's dilemma' you raise later proves this. He made money, yes, but he described the love of money as a possession in morbid terms.

  **Civic Participant:** Precisely. He hated the love of money as an end, but he embraced the activity of speculation as a test of judgment. This is where your reading falters. If receptivity goods are always lexicographically prior, why does he treat the preservation of civilization as a duty that can override personal cultivation? He explicitly suggests that in times of crisis, the duty to save the structure of society outweighs the private pursuit of beauty.

  **Guardian:** Because without the structure, there is no beauty. It is a lexical priority of conditions, not goods. You are conflating the precondition with the good itself. My worry is that your reading makes Keynes too modern, too obsessed with agency. It misses the irony of his position. He was an individualist who believed that most public action was futile, yet he acted. That tension is best explained by a permanent Moorean core struggling against a recalcitrant world, not by a new ethical framework where stewardship becomes a virtue in itself.

  **Civic Participant:** But that leaves the 'speculator's dilemma' unresolved in your account. If the good life is fundamentally a matter of receptivity, why does he continue to seek money as a means while despising it as an end? And why does he treat the duty to civilization as binding? On your view, these are merely burdens. On mine, they are the arena where the later Keynes found a new kind of meaning. The 1938 memoir is not just nostalgia; it is a confession that the early view was insufficient for a life lived in history.

  **Guardian:** It is a confession of error, not a conversion. He admits he underestimated the power of irrational forces. But he does not say that fighting those forces became the good life. He says it became necessary. There is a difference between necessity and value. Your 'precarity-priority' reading collapses that distinction. It suggests that when the world is unjust, the good life changes shape. I argue Keynes believed the good life remains the same; it just becomes harder to access.

  **Civic Participant:** And I argue that the struggle to access it changes the agent. The excellence required to navigate uncertainty is not just a tool; it is a refinement of the human spirit. If you strip that away, you leave us with a Keynes who is either a detached aesthete or a frustrated bureaucrat. Neither fits the man who shaped the post-war order while painting and collecting.

  **Guardian:** He fits the man who believed that some people must hold the line so others can be human. But if you make holding the line itself the human ideal, you lose the specific quality of freedom Keynes cherished. You turn him into a saint of public service. He was never that. He was a man who wanted to be free to love and think, and who fought to keep that freedom alive.

  **Civic Participant:** Then we are left with the tension. If freedom is the goal, why does the fight consume the life? If receptivity is the end, why does the means demand such excellence?

  **Guardian:** Because the world is broken. Not because the ethic changed.

  **Civic Participant:** Or because the ethic had to grow to meet the world.

  They sat in silence for a moment, the steam finally gone from the cups. The tension remained, suspended between the ideal of the quiet mind and the reality of the active hand.

  ### Where I Could Be Wrong

  **Guardian:** I would abandon my reading if evidence showed Keynes explicitly valued public action as an end in itself, rather than a protective measure. My reasoning is most vulnerable where I assume his irony shields him from civic republicanism; if his private letters reveal he found intrinsic satisfaction in stewardship apart from its results, my instrumental account collapses.

  **Civic Participant:** I would abandon my reading if the 1938 memoir proves to be purely nostalgic without normative revision. My reasoning is most vulnerable where I infer constitutive value from necessity; if Keynes viewed agential goods solely as tragic burdens with no internal worth, my claim that they reshape the good life is untenable.
