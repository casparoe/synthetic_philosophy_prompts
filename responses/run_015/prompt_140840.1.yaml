answer: |-
  **Exam Question**

  **Time Allowed:** 45 Minutes
  **Total Marks:** 25

  **Question:**
  Kuhn asserts that competing paradigms are incommensurable, yet he proposes five criteria for theory choice (accuracy, consistency, scope, simplicity, fruitfulness). Critically assess whether this appeal to shared values rescues scientific rationality from relativism. In your answer, you must: (a) distinguish precisely between semantic and methodological incommensurability and explain which is supposed to follow from which; (b) evaluate whether the distinction between 'values' and 'rules' renders the criteria consistent with the incommensurability thesis, or merely relabels the problem; and (c) consider whether shared instrumental success (prediction and control) provides a neutral common measure, or whether it merely relocates the shared vocabulary into a language of manipulation that presupposes a realism Kuhn rejects.

  ***

  **Model Answer**

  Incommensurability is primarily a semantic thesis: it claims that the lexicons of competing paradigms cannot be fully translated without residue because kind-terms (e.g., 'mass', 'planet') change their reference and extension during revolutions. This semantic gap generates a methodological consequence: there is no neutral language in which to compare theories. However, semantic incommensurability does not entail incomparability. Kuhn's aim is not to render choice irrational, but to locate rationality within history rather than outside it.

  The charge of relativism arises if one assumes rational choice requires an algorithm—a set of rules that dictates a unique outcome given the evidence. Kuhn's five criteria are not rules but values. They are shared, but their application and weighting are not. One scientist may prioritize scope, another consistency. Because there is no neutral metric to weigh these values against one another, two rational agents can legitimately choose different theories. This distinction between values and rules is not a dodge; it is the mechanism that preserves incommensurability while avoiding arbitrariness. If they were rules, a neutral adjudicator could apply them, implying a neutral language exists. By treating them as values, Kuhn acknowledges that judgment is required, and judgment is situated within a paradigm. Thus, the criteria are consistent with incommensurability: they explain how choice happens without a transcendental standpoint.

  The harder challenge is instrumental success. If Paradigm A and Paradigm B both allow us to build lasers or predict eclipses, does this 'doing' bypass the linguistic barrier? Superficially, yes. We can compare torque or wavelength without agreeing on ontology. However, to claim both paradigms 'solve the same problem' via 'the same instrument' presupposes a neutral description of the intervention. For Kuhn, what counts as a 'solution' is paradigm-relative. Pre-Copernican astronomy solved the problem of saving the appearances within a geocentric ontology; Copernican astronomy solved a different problem regarding planetary order.

  Furthermore, relying on instrumental success as a common measure risks collapsing into a realism Kuhn explicitly rejects. If we say both paradigms manipulate the 'same entities' successfully, we imply that the entities exist independently of the paradigm and that science converges on them. Kuhn denies convergence; the world changes with the paradigm. Therefore, instrumental success is not a neutral arbiter. It merely relocates the shared vocabulary from theoretical kind-terms to a language of manipulation. But manipulation requires categorization. To calibrate an instrument is to assume certain regularities hold. If those regularities are defined by the paradigm, the instrumental ground is not neutral. It offers a pragmatic bridge for communication, but not a metaphysical common measure.

  Ultimately, Kuhn's position is consistent. Rationality is not the application of ahistorical rules but the exercise of judgment using shared values within a historical context. Instrumental success does not refute this, as the description of success remains theory-laden. Incommensurability limits translation, not rationality, provided we abandon the demand for an algorithmic theory choice.

  ***

  **Marking Scheme**

  **Total:** 25 Marks
  **First Class (20–25):** Sophisticated integration of all three required elements; clear argumentative stance.
  **Upper Second (15–19):** Competent handling of (a) and (b), but superficial or ambiguous on (c).
  **Lower Second (10–14):** Descriptive summary of Kuhn; fails to distinguish meaning from choice.
  **Fail (0–9):** Fundamental misunderstandings or irrelevant material.

  **Required Moves by Section:**

  **(a) Semantic vs. Methodological (5 Marks)**
  *   **First:** Explicitly defines incommensurability as *semantic* (translation failure of kind-terms) which *causes* methodological difficulty (no neutral comparison), but denies it entails *incomparability*.
  *   **2:1:** Identifies the lack of neutral language but may blur the line between "cannot translate" and "cannot choose rationally."
  *   **Penalty:** -3 marks if candidate treats incommensurability as synonymous with incomparability (the "Relativist Error").

  **(b) Values vs. Rules (10 Marks)**
  *   **First:** Explains that criteria are consistent with incommensurability *because* they lack algorithmic weighting. Shows that 'values' allow for rational disagreement without neutral rules. Argues this is not a relabelling but a structural feature of Kuhn's historicism.
  *   **2:1:** States that criteria are values not rules and that weighting varies. May accept the consistency but fails to explain *why* this avoids the friend's objection (i.e., fails to explain why shared values don't imply a neutral measure).
  *   **Penalty:** -2 marks if candidate claims the criteria prove paradigms *are* commensurable.

  **(c) Instrumental Success/Manipulation (10 Marks)**
  *   **First:** Argues that 'instrumental success' is not neutral because describing the 'same intervention' presupposes a neutral description of nature/problems. Connects this to Kuhn's anti-realism (no convergence on 'true' entities). Concludes it relocates vocabulary rather than solving the problem.
  *   **2:1:** Acknowledges instrumental success as a possible common ground but is ambiguous on whether this contradicts Kuhn's anti-realism. May suggest it solves the problem without noting the presupposition of 'same problem'.
  *   **Penalty:** -3 marks if candidate appeals to a neutral description of what a revolution "loses" or "gains" without noticing that such a description presupposes a standpoint outside both paradigms.

  **General Penalties:**
  *   **Confusion with Theory-Ladenness:** -2 marks if the candidate conflates incommensurability with the theory-ladenness of observation (related but distinct theses).
  *   **Slogan Reliance:** -5 marks if the answer relies on "gestalt switch" or "paradigm shift" without analytical definition.
