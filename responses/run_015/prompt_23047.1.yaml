      *   **Distinguishing the Two Problems:**
          *   *Subject Combination:* Focus on the *container* of experience. The "I." How do $N$ subjects become 1 subject? Analogy: A crowd vs. a team.
          *   *Quality Combination:* Focus on the *content* of experience. The "What it's like." How do simple feelings (proto-consciousness) become complex feelings (human consciousness)? Analogy: Pixels vs. Image, or Notes vs. Chord.

      *   **The Many-Minds Response (The "Subject Dissolution"):**
