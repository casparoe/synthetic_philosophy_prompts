          *   *Crucial Nuance:* This feels counterintuitive. We *feel* like one subject. The panpsychist says that feeling is an illusion generated by the collective.

      *   **Why Quality Combination Remains:**
          *   Even if we accept many subjects, what are *they* experiencing?
          *   Micro-experiences are supposed to be simple (proto-experiential).
