answer: |-
  **Principle Summary: The Lexical Suffering Constraint (LSC)**

  **The Principle:**
  1.  **The Veto Clause:** It is impermissible to bring a person into existence if there is a non-negligible probability that their life will contain severe, net-negative suffering, regardless of any compensating happiness or external benefits.
  2.  **The Null Duty Clause:** There is no moral obligation to bring a person into existence solely on the prospect of their happiness; refraining is always permissible.
  3.  **The Resource Priority Clause:** Resources sufficient to sustain a merely happy life may permissibly be redirected to alleviate severe suffering in existing beings.
  4.  **The Optimization Clause:** If and only if all available options satisfy the Veto Clause (i.e., no risk of severe suffering), it is permissible to select the option that maximizes expected welfare.

  **Motivation and Mapping:**
  *   **Clause 1 (The Veto)** is motivated by **Case 1** (termination for severe pain) and **Case 3** (knowingly conceiving for severe suffering). It establishes suffering as a lexical priority that cannot be traded off.
  *   **Clause 2 (The Null Duty)** is motivated by **Case 2** (childless couple). It codifies the asymmetry: absence of pain is good, but absence of pleasure is not bad.
  *   **Clause 3 (The Resource Priority)** is motivated by **Case 4** (forgoing child for altruism). It clarifies that existing suffering outweighs potential happiness in resource allocation without making procreation obligatory.
  *   **Clause 4 (The Optimization)** is introduced to handle scenarios where the Veto is not triggered, allowing for welfare maximization without violating the asymmetry.

  **Verdict on Case 5 (High-Variance Embryo):**
  The LSC renders the selection of the high-variance embryo **impermissible**. Because one outcome involves "severe suffering," the Veto Clause is triggered. The expected welfare calculation (the "gamble") is disqualified by Clause 1. You cannot offset the risk of severe suffering with the chance of exceptional flourishing *for the same child*. This resolves your oscillation by prioritizing the logic of Cases 1 and 3 over the expected-value intuition.

  **Resolution of the Final Case (Geopolitical Instability):**
  The LSC renders conception in this scenario **impermissible**.
  *   **Stability of Case 4:** Your approval of Case 4 is not unstable. Case 4 is an *omission* (forgoing creation to help others), which Clause 2 and 3 endorse as permissible/admirable. The Final Case is a *commission* (creating to help others), which triggers Clause 1. The principle distinguishes cleanly between *not creating a benefit* (allowed) and *creating a risk* (forbidden).
  *   **The Oscillation:** The possibility of the child's exceptional contribution to mitigation (external benefit) cannot justify the risk of grave suffering to the child. Under the LSC, a potential person cannot be used as a means to reduce suffering elsewhere if doing so exposes them to severe harm. The asymmetry holds: the downside for the created counts lexically; the upside for others does not override it.

  **Verdict on New Scenario (Embryo Selection, No Suffering Risk):**
  *Scenario:* Selecting among embryos solely to maximize expected welfare when all options guarantee a life above the severe suffering threshold.
  *Verdict:* **Permissible (and morally neutral or positive).** Since Clause 1 is not triggered (no risk of severe suffering), Clause 4 applies. You may maximize expected welfare. This avoids the implication that all happy lives are morally equal, which often contradicts intuition when no harm is at stake.

  **Honest Statement of Revision:**
  To maintain the simplicity and coherence of the LSC, you must **abandon the intuition in Case 5 that "rejecting high-variance prospects treats potential happiness as too cheap."**
  While this intuition feels compelling in isolation, it is logically incompatible with your firm verdicts on Cases 1 and 3. If severe suffering makes termination obligatory (Case 1) and conception wrong (Case 3), it cannot be rendered permissible merely by attaching a probability-weighted upside. To keep the system simple, you must accept that the "cost" of potential happiness is indeed zero when weighed against the risk of severe suffering. The LSC preserves your firm verdicts (1–4) but requires you to resolve the oscillations (5 and Final) by rejecting the Expected Value justification in contexts of severe risk.
