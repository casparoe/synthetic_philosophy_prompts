prompt: |-
  So I got talked into sitting on a standing franchise-and-elections commission in my city. Seven of us, and I'm the only philosopher, which apparently makes me "the theory person." We get four to six proposals a year and now neighboring towns send us theirs too, so whatever I bring needs to be something the others can run without me in the room. The commission is a city clerk, a retired probate judge, a high-school civics teacher, two neighborhood-association types and a small-business owner. None of them will read political theory and I'm not handing anyone a bibliography, so the reasoning has to live inside the procedure itself.

  The current stack of three, which public comment keeps conlfating:
  1. votes at 16 for city council and school board;
  2. local voting rights for non-citizen residents with three or more years in the city;
  3. compulsory voting in city elections, enforced by a $25 fine.

  Give me a procedure we can run on any franchise proposal in about half an hour at a monthly meeting: the questions in order, what counts as a good enough answer to each, where a proposal gets stopped with a flat "no," and where we have to admit the question is about values and hand it to a vote rather than pretending the procedure settled it. It should start by sorting the proposal, because I don't think these three are the same kind of question at all — two are about who's inside the demos and one isn't about the boundary but about whether voting can be demanded of people who are already inside. If you think that sort is wrong, say so and give me a better one. Any term of art you can't avoid, define in one line; this thing gets read aloud at a public meeting.

  Then it has to face what I can't get around in my own head: any rule about who belongs in the demos is itself a rule that only some demos can make, so we can't fix the boundary democratically without going in circles. The procedure has to be explicit about what it's treating as settled before politics starts, instead of smuggling that in at step two.

  It also has to handle the over-inclusion slide. If the test is "everyone affected gets a say," our zoning decisions entitle people three states over plus people not yet born, and we have no stopping rule. And I want something specifically about age: age is odd because unlike race or sex everybody passes through it if they live, so the excluded aren't a standing caste, they're a rotating one. Does that genuinely make the exclusion less objectionable, or am I comforting myself?

  Same treatment for the compulsary one, where the interesting bits to me are whether a $25 fine is a penalty or just a price, and whether the usual case for compulsion (turnout gaps track income, so forcing everyone to vote helps the poor) survives the fact that the fine lands hardest on those same people.

  Run it on all three. Don't rig it for me: I've said publicly that I favor votes at 16 and I'm against compulsion, so if the procedure sinks one of my positions or rescues the other, write that down, name the step that did it, and say why. Finish by marking which steps are judgment calls in a procedural costume, and by listing what this procedure simply cannot decide — the points where I'll have to stand up and tell a room full of people that we have no method.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **User:** A philosopher on a municipal franchise-and-elections commission.
      *   **Audience:** 6 other commissioners (clerk, judge, teacher, neighbors, business owner). No theory background. Needs to be practical, readable aloud, and usable without the philosopher present.
      *   **Task:** Create a 30-minute decision procedure for evaluating franchise proposals.
      *   **Constraints:**
          *   Must handle three specific proposals (Vote @ 16, Non-citizen voting, Compulsory voting).
          *   Must address the "boundary problem" (who decides who votes).
          *   Must address the "all-affected principle" slide (zoning affects everyone everywhere).
          *   Must address age specifically (rotating exclusion).
          *   Must address compulsory voting (fine vs. penalty, regressive impact).
          *   Must be honest about where the procedure fails (value judgments).
          *   Must not rig the results to match the user's pre-stated views (Pro-16, Anti-compulsion).
          *   Define terms simply (one line).
          *   Identify stop points ("flat no") vs. vote points.

  2.  **Deconstruct the Proposals:**
      *   *Vote @ 16:* Expansion of demos based on age. Rotating exclusion.
      *   *Non-citizen Voting:* Expansion of demos based on residency/status. Permanent exclusion (unless naturalized).
      *   *Compulsory Voting:* Duty of existing demos. Not about *who*, but *obligation*.

  3.  **Address the Philosophical Hurdles:**
      *   *The Boundary Problem:* You can't democratically decide the boundary without already having a boundary. *Solution:* The procedure must acknowledge the *current* legal baseline as the starting point, treating changes as amendments requiring specific justification, not first-principles derivation.
      *   *All-Affected Principle:* If everyone affected votes, the demos is infinite. *Solution:* Shift to "Subject to Authority" or "Stakeholder" test. Only those subject to the specific jurisdiction's coercive power and residing within it.
      *   *Age:* Is rotating exclusion okay? *Solution:* Distinguish between *capacity* (competence) and *interest* (stake). Age is a proxy for capacity/autonomy.
      *   *Compulsion:* Fine vs. Price. Regressive impact. *Solution:* Test for "undue burden" and "purpose of election."

  4.  **Drafting the Procedure (Iterative Process):**

      *   *Attempt 1 (Mental Outline):*
          1. Is it legal?
          2. Who does it affect?
          3. Is it fair?
          4. Vote.
          *Critique:* Too vague. "Fair" is a value judgment. Needs to be more mechanical.

      *   *Attempt 2 (Adding Philosophical Rigor):*
          1. Categorize: Boundary vs. Duty.
          2. Boundary Test: Residency + Subject to Law.
          3. Capacity Test: Can they understand?
          4. Compulsion Test: Is the fine punitive?
          *Critique:* Better. Needs to explicitly handle the "settled baseline" issue the user raised.

      *   *Attempt 3 (Refining for the Commission):*
          *   Need a "Sort" step first (Boundary vs. Duty).
          *   Need a "Baseline" step (acknowledge we aren't re-founding the city).
          *   Need specific "Stop" conditions.
          *   Need plain language definitions.

  5.  **Developing the Steps (The "Franchise Filter"):**

      *   **Step 0: The Sort.** Distinguish *Franchise Expansion* (Who) from *Franchise Obligation* (Duty). This addresses the user's intuition that Compulsion is different from the other two.
      *   **Step 1: The Baseline Check.** Acknowledge the Circle. We assume the current charter is valid. We are only testing the *change*. This solves the "who decides the boundary" paradox practically.
      *   **Step 2: The Jurisdiction Test (for Expansion).** Solves the "all-affected" slide. Rule: Must reside within city limits + subject to city laws. (Excludes people 3 states away).
      *   **Step 3: The Capacity/Status Test (for Expansion).** Addresses Age and Citizenship. Rule: Does the group have a permanent or temporary barrier to legal autonomy?
      *   **Step 4: The Burden Test (for Obligation).** Addresses Compulsion. Rule: Does the penalty prevent participation or disproportionately harm the vulnerable?

  6.  **Running the Simulation (Testing against the 3 proposals):**

      *   *Vote @ 16:*
          *   Sort: Expansion.
          *   Baseline: Okay.
          *   Jurisdiction: Yes (residents).
          *   Capacity: Age is temporary. *Risk:* Procedure might pass this easily. User supports this.
      *   *Non-citizen:*
          *   Sort: Expansion.
          *   Baseline: Okay.
          *   Jurisdiction: Yes (residents).
          *   Capacity: Status is permanent (unless naturalized). *Risk:* Procedure might flag this as "permanent exclusion." User didn't state stance, but this is the hardest one.
      *   *Compulsion:*
          *   Sort: Obligation.
          *   Burden Test: $25 fine. Is it regressive? Yes. Does it deter? Maybe. *Risk:* User opposes this. Procedure needs to catch the regressive nature.

  7.  **Refining the "Honesty" Sections:**
      *   Must explicitly state where the procedure stops working.
      *   Must identify "Judgment Calls in Costume."
      *   Must address the "Rotating Caste" question on age.

  8.  **Final Polish:**
      *   Tone: Professional, clear, authoritative but humble.
      *   Formatting: Bold headers, bullet points for readability at a meeting.
      *   Definitions: One line max.
      *   Self-Correction on User's Bias: The user favors 16, opposes compulsion. I need to make sure the procedure *could* theoretically fail the 16-year-old vote (e.g., if capacity isn't met) and *could* pass compulsion (e.g., if fine is waived for poverty). I will note where the procedure leans.

  9.  **Addressing Specific User Queries:**
      *   *Boundary Problem:* Addressed in Step 1 (The Baseline).
      *   *All-Affected Slide:* Addressed in Step 2 (Jurisdiction).
      *   *Age/Rotating Caste:* Addressed in Step 3 (Capacity/Status).
      *   *Compulsion/Fine:* Addressed in Step 4 (Burden).
      *   *Rigging Check:* I will explicitly note where the procedure aligns or conflicts with the user's stated views.

  10. **Final Review against Constraints:**
      *   30 minutes? Yes, 4 steps.
      *   Read aloud? Yes, simple language.
      *   No bibliography? Yes.
      *   Define terms? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to make the procedure *too* philosophical. The Judge and Clerk need to understand it immediately. Instead of "Epistemic Capacity," use "Decision Competence." Instead of "Normative Baseline," use "Current Law."

  *(Refining the Age Question)*: The user asks if rotating exclusion is less objectionable. The procedure shouldn't answer this definitively but should flag it for discussion. I will add a "Discussion Note" to Step 3.

  *(Refining the Compulsion Question)*: The $25 fine. Is it a price? If I can pay $25 to not vote, it's a price. If I get a record, it's a penalty. The procedure needs to distinguish this.

  Let's assemble the document.cw
answer: |-
  Here is a procedure designed for your commission. It is written to be read aloud, distributed as a handout, and used without you present. It takes the philosophical heavy lifting you're worried about and hardwires it into the checklist, so the "theory" happens in the design, not the debate.

  ### The Franchise Filter: A 4-Step Review Procedure

  **Purpose:** To evaluate proposals changing who votes or how they vote in city elections.
  **Time Limit:** 30 Minutes.
  **Rule:** If a proposal fails a step, it stops. If it passes all steps, it goes to a commission vote.

  **Definitions (Read First):**
  *   **Franchise:** The legal right to vote in a specific election.
  *   **Demos:** The specific group of people allowed to vote.
  *   **Undue Burden:** A cost or penalty that prevents a reasonable person from participating or punishes them disproportionately.
  *   **Jurisdiction:** The geographic and legal boundary of the city's authority.

  ---

  #### Step 1: The Sort (2 Minutes)
  **Question:** Is this proposal about *who* votes (Expansion) or *whether* they must vote (Obligation)?
  *   **Expansion:** Adds or removes people from the voter rolls (e.g., age, residency, citizenship).
  *   **Obligation:** Keeps the rolls the same but changes the rules of participation (e.g., compulsory voting, mandatory ID).

  **Action:**
  *   If **Expansion**, go to Step 2.
  *   If **Obligation**, go to Step 4.
  *   **Stop Rule:** If the proposal tries to do both in one motion, split them into two separate proposals.

  *(Philosopher's Note: This separates the boundary question from the duty question. It prevents conflating non-citizen voting with compulsory voting.)*

  ---

  #### Step 2: The Jurisdiction Test (Expansion Only) (8 Minutes)
  **Question:** Does the proposed group live within the city and are they subject to its laws?
  **The "All-Affected" Limit:** We reject the idea that everyone affected by a decision gets to vote (e.g., people in other states affected by our zoning). We accept only those subject to the city's coercive authority.

  **Criteria for "Yes":**
  1.  The group resides within city limits.
  2.  The group pays city taxes or is subject to city ordinances.

  **Action:**
  *   If **No**: Flat "No." The city lacks authority to enfranchise non-residents.
  *   If **Yes**: Proceed to Step 3.

  *(Philosopher's Note: This stops the "zoning affects people three states over" slide. It grounds the demos in legal subjection, not abstract interest.)*

  ---

  #### Step 3: The Capacity & Status Test (Expansion Only) (10 Minutes)
  **Question:** Is the barrier to voting based on a temporary lack of autonomy or a permanent status?
  **The "Rotating Caste" Check:** Age excludes everyone temporarily; citizenship excludes some permanently. This distinction matters.

  **Criteria for "Yes":**
  1.  **Competence:** Is there evidence the group can make informed choices comparable to current voters? (e.g., 16-year-olds drive and work; non-citizens pay taxes).
  2.  **Permanence:** Is the exclusion temporary (age) or permanent (status)?
      *   *If Temporary:* The burden of proof is on those saying "No."
      *   *If Permanent:* The burden of proof is on those saying "Yes."

  **Action:**
  *   If **Competence is clearly lacking** (e.g., voting age 5): Flat "No."
  *   If **Competence is debatable** (e.g., age 16, non-citizen residents): Do not vote yet. Mark as "Value Judgment Required" and proceed to Commission Vote.
  *   **Warning:** Do not pretend this step is mechanical. If commissioners disagree on "competence," admit it is a values clash.

  *(Philosopher's Note: This addresses your worry about age. It flags that excluding a rotating class is structurally different than excluding a fixed class, but it does not solve it. It forces the commission to admit they are making a moral call, not a technical one.)*

  ---

  #### Step 4: The Burden Test (Obligation Only) (10 Minutes)
  **Question:** Does the penalty for not voting function as a tax on the poor?
  **The "Price vs. Penalty" Check:** A fee waived for hardship is a price. A fee collected regardless of income is a penalty.

  **Criteria for "Pass":**
  1.  **Waiver:** Is there an automatic, no-questions-asked waiver for low-income residents?
  2.  **Purpose:** Is the goal to increase turnout or to punish non-participation?
  3.  **Impact:** Will the enforcement cost more than the revenue generated?

  **Action:**
  *   If **No Waiver**: Flat "No." (A flat fine is a regressive tax).
  *   If **Waiver Exists**: Proceed to Commission Vote.
  *   **Stop Rule:** If the proposal relies on the fine for revenue, Flat "No." Voting cannot be a revenue stream.

  *(Philosopher's Note: This handles your compulsion worry. Without a waiver, the procedure kills the $25 fine automatically. With a waiver, it survives the procedure but faces a vote.)*

  ---

  ### Simulation: Running Your Three Proposals

  Here is how the Filter handles the specific items you listed, including where it aligns or conflicts with your stated views.

  **1. Votes at 16 (City Council & School Board)**
  *   **Step 1:** Sort = Expansion.
  *   **Step 2:** Jurisdiction = Yes (They live here, go to school here).
  *   **Step 3:** Capacity = Debated. Status = Temporary (Rotating).
      *   *Result:* **Proceeds to Vote.**
      *   *Alignment:* Matches your support.
      *   *Why:* The procedure treats temporary exclusion as less suspect than permanent exclusion, placing the burden on the status quo. However, if the commission decides 16-year-olds lack "competence," the procedure allows them to vote "No" at Step 3 without violating the rules.

  **2. Non-Citizen Residents (3+ Years)**
  *   **Step 1:** Sort = Expansion.
  *   **Step 2:** Jurisdiction = Yes (They live here, pay taxes).
  *   **Step 3:** Capacity = Debated. Status = Permanent (Unless naturalized).
      *   *Result:* **Proceeds to Vote.**
      *   *Alignment:* Neutral.
      *   *Why:* The procedure flags the "Permanence" issue. It requires the commission to explicitly acknowledge they are enfranchising a permanent class. This makes the "No" vote harder to justify casually, but easier to justify if they value national citizenship as a prerequisite. It forces the value conflict into the open.

  **3. Compulsory Voting ($25 Fine)**
  *   **Step 1:** Sort = Obligation.
  *   **Step 4:** Burden Test.
      *   *Scenario A (No Waiver):* **Flat "No."** The fine is regressive.
      *   *Scenario B (With Waiver):* **Proceeds to Vote.**
      *   *Alignment:* Matches your opposition (mostly).
      *   *Why:* You argued the fine hits the poor hardest. Step 4 codifies this. If the proposal does not include a poverty waiver, the procedure kills it automatically. If it *does* include a waiver, the procedure admits the economic objection is solved, but the philosophical objection (liberty) remains. That is left to the vote.

  ---

  ### The "Judgment Calls in Costume"
  *Be prepared to tell the commission these are not objective truths, but design choices I made to keep us moving.*

  1.  **The Jurisdiction Limit (Step 2):** I chose "Subject to Law" over "All Affected." This is a political choice to keep the city manageable. It arbitrarily decides that a neighbor in the next town over doesn't count, even if our zoning hurts them. The procedure pretends this is technical; it is not.
  2.  **The Competence Proxy (Step 3):** We are using "Age" and "Citizenship" as proxies for "Competence." There is no test here. We are assuming 16-year-olds *might* be competent and 5-year-olds *are not*. That is an assumption, not a finding.
  3.  **The Regressive Tax (Step 4):** I built the rule that "fines without waivers are unacceptable." A libertarian could argue a fine is a fine. I have hardcoded a progressive economic assumption into Step 4. If the small-business owner argues that $25 is trivial, the procedure overrides them.

  ### What This Procedure Cannot Decide
  *These are the points where you must stand up and tell the room we have no method.*

  1.  **The Boundary Paradox:** Step 1 assumes the current city charter is legitimate. We cannot use this procedure to decide if the city itself should exist or if the current borders are unjust. We are amending a house, not pouring the foundation.
  2.  **The Definition of "Competence":** Step 3 asks if a group is competent, but provides no metric. If the civics teacher says "16-year-olds know civics" and the business owner says "They don't pay income tax," the procedure cannot resolve who is right. It only forces you to vote on it.
  3.  **The Moral Duty to Vote:** Step 4 handles the *fine*, but not the *principle*. If a commissioner believes voting is a moral duty regardless of cost, and another believes it is a liberty to be waived, the procedure cannot reconcile this. It only checks if the duty is affordable.
  4.  **The "Rotating Caste" Comfort:** You asked if age exclusion is less objectionable because everyone ages. This procedure treats it as less objectionable (by shifting the burden of proof), but it cannot prove *why*. If a 15-year-old argues that *their* four years of exclusion matter to *them* right now, the procedure has no answer other than "The rule is temporary." That may not satisfy the person excluded.

  ### Final Instruction for the Chair
  If the commission gets stuck on a "Value Judgment" in Step 3 or 4, do not try to reason your way out. Call the question. The procedure's job is not to find the truth; it is to ensure that when we vote, we know exactly which value we are betting on.
