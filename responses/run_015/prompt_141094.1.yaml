prompt: |-
  I'm part of a small team writing the conduct code and the internal risk metric for a development organization that operates in roughly thirty countries, and we have got as far as discovering that the word corruption appears in every section of the draft and is defined in none of them. Before we look at any of the standard definitions on offer, I want the specification: what would a working definition of corruption have to deliver to count as adequate for our particular purpose — a code that a country director and a field officer have to apply on a Tuesday, and a risk score we then publish about the places we work — with the case or consideration behind each requirement. I would like the cases, not just the labels: the phenomenon or hypothetical it has to handle, the distinctions it must not collapse (corruption versus clientelism versus patronage versus rent-seeking versus state capture versus ordinary theft; corrupt act versus corrupt official versus corrupt system; the need case versus the greed case), and the findings from anthropology and economics it is not allowed to contradict — that gift exchange frequently constitutes a relationship rather than distorting a pre-existing one, that enforcement is itself politically selective, that in some settings side payments move goods faster rather than slower.

  Several requirements keep being presented to me as mandatory, and I suspect they are a mix of genuine desiderata and the prejudices of whichever camp is speaking: that corruption requires a public office, so a kickback to a purchasing manager inside a private firm is fraud but not corruption; that it requires an identifiable quid pro quo; that the gain must be private, whatever we then say about the official who steers contracts to her own ethnic group or her party and takes nothing herself; that there must be a loser, which seems to fall apart on the payment that buys a service the citizen was already owed, or the one that gets a nurse to turn up; that the standard must be identical in every country we operate in, which one of my colleagues says simply smuggles in the assumption that arm's-length impartial administration is the neutral baseline rather than one local ideal among others; and that whatever we end up with must be provable enough to dismiss or prosecute someone on. A different colleague has proposed a shortcut she calls the sunlight test — an act is corrupt just in case the people involved would not be willing to have it entered in a public register — and I do not think it survives contact with an official who would be delighted to publicise a patron's gift, or with a disclosed, budgeted, lawful fee for faster inspections, or with a practice the whole district knows about and approves of. I would also like to know whether the list has to cover corruption with no corruptible human in the loop at all: a procurement model whose training data encodes a decade of favouritism, or a vendor selected because he is somebody's cousin, where no individual exercised a discretion that anyone can point to.

  So: sort the requirements I have listed into the ones that are non-negotiable and the ones that are a camp's preferences, add the ones I have missed, and give me the case behind each. Two things matter most to me. First, whether some subset of the desiderata cannot be jointly satisfied — I have a suspicion that demanding courtroom-grade provability and demanding sensitivity to systemic or institutional corruption pull in opposite directions, and that demanding one cross-national standard and demanding something our own staff find legitimate and enforceable do too, but tell me if the real conflict is elsewhere, because if the list is jointly unsatisfiable that is itself the answer I should bring back to the team. Second, which single requirement does the most work in excluding candidate definitions. You can score the two or three usual families of definition in a line or two each at the end if it helps, but the criteria are the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Context:** A small team writing a Code of Conduct and Internal Risk Metric for a development organization operating in ~30 countries.
      *   **Problem:** The word "corruption" is everywhere in the draft but undefined.
      *   **Goal:** Define the *specification* for a working definition of corruption. What must it *deliver* to be adequate for:
          1.  A Country Director/Field Officer applying it on a Tuesday (operational guidance).
          2.  A risk score published about the places they work (external reporting/metric).
      *   **Constraints/Requirements:**
          *   Provide cases/considerations behind each requirement (not just labels).
          *   Handle distinctions (corruption vs. clientelism vs. patronage vs. rent-seeking vs. state capture vs. theft; act vs. official vs. system; need vs. greed).
          *   Respect findings from anthropology/economics (gift exchange as relationship, selective enforcement, side payments speeding things up).
          *   Sort provided requirements into "Non-Negotiable" vs. "Camp Preferences."
          *   Add missing requirements.
          *   Address joint satisfiability (are the desiderata contradictory?).
          *   Identify the single most exclusionary requirement.
          *   Briefly score standard definition families at the end.
      *   **Tone:** Analytical, precise, pragmatic, acknowledging complexity (no naive universalism).

  2.  **Deconstruct the Provided Requirements:**

      *   *Req 1: Requires public office.* (Preference/Debate: Private sector corruption exists).
      *   *Req 2: Requires identifiable quid pro quo.* (Preference/Debate: Systemic corruption lacks explicit deals).
      *   *Req 3: Gain must be private.* (Preference/Debate: Political gain/party gain counts).
      *   *Req 4: Must be a loser.* (Preference/Debate: Grease payments, survival payments).
      *   *Req 5: Identical standard in every country.* (Preference/Debate: Universalism vs. Contextual legitimacy).
      *   *Req 6: Provable enough to dismiss/prosecute.* (Preference/Debate: Risk metric vs. Legal standard).
      *   *Req 7: Sunlight Test.* (Preference/Debate: Fails on cultural norms/disclosed fees).
      *   *Req 8: Algorithmic/Structural corruption (no human in loop).* (New/Missing consideration).

  3.  **Determine Non-Negotiables vs. Preferences:**

      *   *Non-Negotiable:* Must guide action on a Tuesday (Actionability). Must distinguish risk levels for the metric (Differentiation). Must not contradict empirical reality (Anthropological/Economic validity). Must cover the organization's exposure (Scope).
      *   *Preferences:* Public office only (too narrow for development orgs dealing with vendors). Identical standard (ignores context). Provable to legal standard (confuses HR/Legal with Risk Management). Sunlight test (too subjective).

  4.  **Identify Missing Requirements:**

      *   *Temporal Stability:* The definition must hold over time (not change with every administration).
      *   *Agency vs. Structure:* Must distinguish between a rogue actor and a forced system (for the risk metric).
      *   *Intent vs. Outcome:* Does accidental bias count?
      *   *The "Development Mission" Alignment:* Since it's a development org, does the act hinder the mission? (Teleological requirement).

  5.  **Address Joint Satisfiability (The Conflict):**

      *   The user suspects "Courtroom Provability" vs. "Systemic Sensitivity" is the conflict. This is correct.
      *   Another conflict: "Universal Standard" vs. "Local Legitimacy/Enforceability."
      *   *Verdict:* You cannot have a definition that is legally prosecutable *and* captures systemic/anthropological nuance *and* applies universally without modification. The definition must serve the *Risk Metric* and the *Code of Conduct* differently, or accept a tiered definition.

  6.  **Identify the "Most Work" Requirement:**

      *   Which requirement kills the most bad definitions?
      *   Likely: "Actionability for the Field Officer on a Tuesday." (If they can't use it, it fails).
      *   Alternatively: "Distinction between Systemic vs. Individual."
      *   *Decision:* The "Actionability/Operationalizability" requirement is the sharpest knife. If a field officer can't recognize it, it's useless for a Code of Conduct.

  7.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. Validate the tension.
      *   *Section 1: Sorting the Requirements.* Group into Non-Negotiables (Functional) vs. Preferences (Ideological/Legalistic). Explain *why* for each using the requested cases.
      *   *Section 2: Missing Requirements.* Add the anthropological/systemic nuances (Algorithmic, Mission-Harm, etc.).
      *   *Section 3: Joint Satisfiability.* Address the contradictions. The "Prosecutable" vs. "Systemic" tension is real. The "Universal" vs. "Contextual" tension is real. Propose a solution (Core + Contextual annex).
      *   *Section 4: The Exclusionary Requirement.* Pick the one that filters the most.
      *   *Section 5: Scoring Definition Families.* Public-Centered, Market-Centered, Public-Interest-Centered.

  8.  **Refining the Content (Self-Correction during drafting):**

      *   *Check:* Did I address the "need vs. greed" distinction? *Action:* Ensure it's in the "Missing Requirements" or "Sorting" section regarding the "Loser" requirement.
      *   *Check:* Did I address the "Algorithmic" corruption? *Action:* Add to Missing Requirements.
      *   *Check:* Did I address the "Anthropology of Gifts"? *Action:* Ensure the "Contextual Legitimacy" requirement covers this.
      *   *Check:* The user wants the *specification for the definition*, not the definition itself. Keep the focus on *what the definition must do*, not *what it says*.
      *   *Tone Check:* Keep it rigorous. Avoid preaching. Use the user's terminology (Tuesday test, sunlight test).

  9.  **Final Polish:**

      *   Ensure the distinction between the Code of Conduct (behavioral) and Risk Metric (environmental) is clear, as they might need different definitional weights.
      *   Make sure the "Joint Satisfiability" section is decisive.
      *   Verify the "Single Requirement" argument is strong.

  **(Self-Correction Note):** I need to be careful not to just say "Universalism is bad." I need to explain *why* it fails the specification (e.g., it creates blind spots in the risk metric).
  Also, the "Provable" requirement is a category error. A Code of Conduct is for firing/guiding; a Risk Metric is for assessing environment. Merging them into one definition is the root cause of the tension. I should highlight this.

  10. **Final Structure:**
      *   Executive Summary.
      *   Part I: Sorting the Requirements (Non-Negotiables vs. Preferences).
      *   Part II: Missing Specifications (The Anthropological/Systemic gaps).
      *   Part III: Joint Satisfiability (The Impossible Trinity).
      *   Part IV: The Single Exclusionary Requirement.
      *   Part V: Scoring Standard Families.

