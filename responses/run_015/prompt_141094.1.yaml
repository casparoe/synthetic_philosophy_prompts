answer: |-
  This is a specification for a definition, not a definition itself. You are asking for the functional requirements of a tool that must serve two distinct masters: the **Code of Conduct** (normative, behavioral, disciplinary) and the **Risk Metric** (descriptive, environmental, strategic).

  The tension you feel arises because you are trying to build one definition to serve two different mechanical purposes. Below is the sorting of your listed requirements, the addition of missing specifications, an analysis of their joint satisfiability, and the identification of the critical exclusionary constraint.

  ### Part I: Sorting the Requirements

  We must separate **Functional Non-Negotiables** (the definition fails without these) from **Camp Preferences** (ideological or legalistic positions that constrain utility).

  #### A. Functional Non-Negotiables
  *These are required for the definition to function as a tool for a Field Officer on a Tuesday and a Risk Analyst on a Wednesday.*

  1.  **Operational Recognizability (The "Tuesday" Test)**
      *   **Requirement:** The definition must allow a non-lawyer field officer to categorize an interaction in real-time without external counsel.
      *   **Case:** A field officer is at a checkpoint. A guard asks for "fuel money" to let a medical convoy pass. If the definition requires proving *intent* or *systemic impact* before classifying the act, the officer cannot act. The definition must map to observable behaviors, not hidden mental states.
      *   **Why Non-Negotiable:** If it cannot be applied in the field, the Code of Conduct is decorative.

  2.  **Distinction Between Individual Deviance and Systemic Constraint**
      *   **Requirement:** The definition must distinguish between an agent exploiting a system (corrupt act) and an agent surviving a system (corrupt environment).
      *   **Case:** A nurse demands a fee to release medicine. Is she a corrupt official (Code of Conduct violation) or a victim of a state that doesn't pay her salary (Risk Metric indicator)? A definition that collapses this distinction will either punish survival or excuse theft.
      *   **Why Non-Negotiable:** Your Risk Metric needs to measure the *environment*, while your Code needs to measure *conduct*. One definition must be able to flag the act without necessarily condemning the actor in every instance.

  3.  **Mission-Harm Alignment**
      *   **Requirement:** The definition must tie the act to a deviation from the organization's specific public purpose, not just a deviation from a local norm.
      *   **Case:** In a context of deep patronage, hiring a cousin might be the only way to ensure staff safety or community acceptance. If the definition bans all nepotism universally, you cannot operate. If it allows all nepotism, you lose integrity. The definition must specify when the deviation harms the *development mission* (e.g., competence vs. loyalty).
      *   **Why Non-Negotiable:** You are a development organization, not a sovereign state or a private equity firm. Your standard of "wrong" must be teleological (does this hinder development?), not just deontological (is this rule-breaking?).

  #### B. Camp Preferences (Ideological or Legalistic)
  *These are often presented as mandatory but are actually choices that privilege one stakeholder's comfort over operational reality.*

  1.  **Public Office Requirement**
      *   **Verdict:** **Preference.**
      *   **Case:** A kickback to a private purchasing manager at a partner NGO or a vendor. Excluding this creates a blind spot where you police the state but ignore your own supply chain.
      *   **Reason to Reject:** Modern corruption flows through private intermediaries. Limiting to "public office" protects your vendors at the expense of your mission.

  2.  **Identifiable Quid Pro Quo**
      *   **Verdict:** **Preference.**
      *   **Case:** State Capture or Patronage. A minister changes a law to benefit a conglomerate owned by his brother-in-law. No money changes hands directly; no explicit deal is signed.
      *   **Reason to Reject:** This excludes high-level systemic corruption from your Risk Metric, leaving you with only "petty corruption" data.

  3.  **Private Gain Requirement**
      *   **Verdict:** **Preference.**
      *   **Case:** A party official steers contracts to their ethnic group to secure political power, taking no money personally.
      *   **Reason to Reject:** This is political corruption. If your definition requires private enrichment, you cannot flag partisan state capture as a risk.

  4.  **Identical Standard in Every Country (Universalism)**
      *   **Verdict:** **Preference.**
      *   **Case:** Gift-giving. In Japan, refusing a gift is an insult; in Nigeria, it might be an expected facilitation. A universal "zero tolerance" definition forces staff to violate local social contracts to comply with HQ rules.
      *   **Reason to Reject:** It smuggles in the assumption that arm's-length impartiality is the only valid baseline. It makes the Risk Metric blind to *localized* risk intensity.

  5.  **Courtroom-Provability**
      *   **Verdict:** **Preference.**
      *   **Case:** Dismissing a Country Director based on a Risk Metric.
      *   **Reason to Reject:** A Risk Metric is probabilistic; a Disciplinary Hearing is evidentiary. Demanding the definition serve both ensures it serves neither. You need a "Preponderance of Evidence" standard for the metric and "Beyond Reasonable Doubt" for the dismissal. One definition cannot hold both thresholds.

  6.  **The Sunlight Test**
      *   **Verdict:** **Preference.**
      *   **Case:** A disclosed, budgeted fee for expedited processing. It is public, lawful, and known, but still distorts access based on wealth.
      *   **Reason to Reject:** Transparency does not equal legitimacy. This test fails to capture institutionalized inequity.

  ### Part II: Missing Specifications

  Your list misses three critical dimensions required for a development organization operating in 30 countries.

  1.  **The Algorithmic/Structural Agent**
      *   **Specification:** The definition must accommodate corruption where the "briber" or "bribee" is a model, a protocol, or a structural inertia, not a human.
      *   **Case:** A procurement AI trained on ten years of data selects vendors from a specific region because that's where the historical data is densest, encoding past favoritism. No human exercised discretion.
      *   **Reason:** If your definition requires a "corruptible human in the loop," you cannot score systemic/technological risk.

  2.  **The "Need" vs. "Greed" Distinction (Survival Corruption)**
      *   **Specification:** The definition must differentiate between extraction (greed) and survival (need) without exonerating the act.
      *   **Case:** A teacher charges fees because the state hasn't paid salaries in six months. The act is the same (unauthorized payment), the motivation is different.
      *   **Reason:** For the **Code**, motivation matters for sanction. For the **Risk Metric**, motivation matters for *remediation*. If the risk is "predatory state," you withdraw. If the risk is "collapsed state," you might adapt. The definition must allow this tagging.

  3.  **The "Third-Party Beneficiary" Clause**
      *   **Specification:** The definition must account for gain accruing to a network, party, or kin group, not just the individual actor.
      *   **Case:** An official awards a contract to a firm owned by their spouse. The official's bank account is unchanged.
      *   **Reason:** This closes the "Private Gain" loophole without requiring a *quid pro quo* paper trail.

  ### Part III: Joint Satisfiability (The Impossible Trinity)

  You suspected that demanding **Courtroom-Provability**, **Systemic Sensitivity**, and **Universal Standard** creates conflict. You are correct, but the deeper conflict is elsewhere.

  **The Real Conflict:** You cannot jointly satisfy **Operational Actionability (Tuesday Test)**, **Anthropological Validity (Contextual Nuance)**, and **Legal Enforceability (Dismissal/Prosecution)** with a *single* definition.

  *   **Why:**
      *   To be **Actionable**, the definition must be simple and heuristic (e.g., "Undue advantage").
      *   To be **Anthropologically Valid**, the definition must be complex and contextual (e.g., "Exchange that violates local reciprocity norms *unless*...").
      *   To be **Legally Enforceable**, the definition must be rigid and evidentiary (e.g., "Transfer of value with proven intent to influence").

  *   **The Trade-off:**
      *   If you prioritize **Actionability**, you risk cultural imperialism (labeling gifts as bribes).
      *   If you prioritize **Validity**, you risk paralysis (field officers can't decide).
      *   If you prioritize **Enforceability**, you risk blindness (you only catch the stupid criminals).

  *   **Resolution:** You do not need one definition. You need a **Core Definition** (for the Risk Metric and broad Code principles) and **Contextual Annexes** (for the Field Officers).
      *   *Core:* "The abuse of entrusted power for private or political gain, including structural bias." (Broad, covers systems).
      *   *Annex:* "In Country X, gifts under $50 are not abuse; in Country Y, all gifts are abuse." (Actionable).
      *   *Legal Standard:* A separate evidentiary threshold for HR/Legal that does not define the act, but defines the *proof* required.

  If you insist on a single text for all three purposes, the list is **jointly unsatisfiable**. You will produce a document that is too vague for lawyers, too complex for field officers, and too rigid for anthropologists.

  ### Part IV: The Single Exclusionary Requirement

  If you must choose one requirement that does the most work in excluding candidate definitions, it is:

  **Operational Recognizability (The "Tuesday" Test).**

  *   **Why:** This requirement kills the "Systemic/Structural" definitions immediately. Most academic definitions of corruption (e.g., "institutional decay," "state capture") are retrospective analytical tools, not prospective decision tools. A field officer cannot measure "institutional decay" at a checkpoint.
  *   **Effect:** It forces you to define corruption as an *event* or *transaction* rather than a *state of being*. This is a limitation, but a necessary one for a Code of Conduct. It excludes definitions that rely on macro-economic indicators or long-term political analysis.
  *   **Secondary Effect:** It also kills the "Sunlight Test" and "Intent-Based" definitions, because neither sunlight nor intent is always observable on a Tuesday.

  ### Part V: Scoring Standard Definition Families

  Based on your specifications (specifically the need for a Risk Metric + Code of Conduct + Anthropological validity):

  1.  **Public-Centered Definition** (*"Abuse of public office for private gain"* - World Bank/Transparency International)
      *   **Score:** **Fail.**
      *   **Reason:** Excludes private sector corruption (vendors/partners). Excludes political gain (party over pocket). Fails the "Private Gain" preference check you rightly identified as limiting. Too narrow for a 30-country development org.

  2.  **Market-Centered Definition** (*"Distortion of market mechanisms"* - Economic approach)
      *   **Score:** **Partial Pass.**
      *   **Reason:** Good for Risk Metrics (efficiency loss). Handles "grease payments" well. **Fails** the Anthropological check (assumes markets should exist where they don't). **Fails** the Tuesday Test (field officers don't know market equilibrium).

  3.  **Public-Interest Definition** (*"Behavior which deviates from the formal duties of a public role because of private-regarding influences"* - Nye)
      *   **Score:** **Best Fit (with modification).**
      *   **Reason:** Allows for "private-regarding" to include kin/party (solves the Private Gain issue). Focuses on "duties" which can be codified in your Code (solves the Tuesday Test). **Risk:** Requires you to clearly define "formal duties" in every context, which brings you back to the Universalism trap.

  **Recommendation:** Adopt a modified **Public-Interest** definition for the Core, but decouple the **Evidentiary Standard** from the **Definition**. Allow the Risk Metric to use "indicators of corruption" (probabilistic) while the Code of Conduct uses "prohibited acts" (binary). Do not try to make one sentence do both jobs.
