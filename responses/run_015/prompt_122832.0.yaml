answer: |-
  ### The Specification for a Theory of Pleasure

  #### I. The Requirements List

  **1. The Heterogeneity Constraint (Non-Negotiable)**
  *   **Case:** Cold beer vs. proof working out vs. headache stopping.
  *   **Demand:** The theory must identify a common thread without denying the phenomenological differences. It cannot simply stipulate "they are all pleasures" by fiat.
  *   **Camp Prejudice:** Insisting this thread be a *single phenomenological quality* is a Felt-Quality prejudice. A functional or attitudinal thread is permissible.

  **2. The Commensurability Constraint (Non-Negotiable for Purpose A)**
  *   **Case:** Aggregating a life's welfare; comparing Person X to Person Y.
  *   **Demand:** The theory must yield a metric (ordinal at minimum, cardinal ideally) that allows summation. "More" pleasure must be definable across different *kinds* of pleasure.
  *   **Tension:** This pulls against the Heterogeneity Constraint. The more diverse the pleasures, the harder the currency.

  **3. The Third-Party Accessibility Constraint (Non-Negotiable for Purpose B)**
  *   **Case:** The dementia resident smiling at music.
  *   **Demand:** The markers of pleasure must be detectable without first-person report. If pleasure is essentially private, this requirement fails.
  *   **Legitimacy:** This is not an illegitimate demand for your purpose, but it is an *externalist* demand on an often *internalist* concept. It forces the theory to tie pleasure to observable states (behavior, physiology, disposition) rather than purely private qualia.

  **4. The Normative Separation Constraint (Preference)**
  *   **Case:** Disowned pleasures (giggle at misfortune).
  *   **Demand:** The theory must allow that something can be a *pleasure* without being *good for you*. Hedonism says pleasure constitutes welfare, but the definition of pleasure shouldn't build in "goodness" or it becomes tautological.
  *   **Status:** Preference. Some theories (Objective List) collapse these; Hedonism needs them distinct to explain why bad pleasures are still pleasures.

  **5. The Temporal Location Constraint (Non-Negotiable)**
  *   **Case:** "I enjoyed my twenties" vs. the momentary sip of beer.
  *   **Demand:** The theory must locate where the pleasure exists. Is it only in the conscious moment? Can it be a property of a long-term activity?
  *   **Tension:** If pleasure is only momentary (atomistic), "enjoying my twenties" is a memory, not a welfare sum. If it's long-term, aggregation (Req 2) becomes difficult.

  **6. The Wanting/Liking Distinction (Non-Negotiable)**
  *   **Case:** The third slice of cake; the sunburn scratch.
  *   **Demand:** The theory must distinguish between the motivation to continue (wanting) and the positive valuation of the experience (liking).
  *   **Status:** Non-negotiable given current psychological/neuroscientific consensus. A theory that collapses these fails the cake case.

  **Incompatibility Flag:**
  **Req 2 (Commensurability) and Req 3 (Third-Party Accessibility) are in direct tension.**
  To aggregate (Req 2), you usually need a uniform internal unit (hedons). To observe (Req 3), you need external proxies (smiles, relaxed posture). External proxies do not map cleanly to internal units (a stoic may feel intense pleasure; a manic resident may smile with low welfare). Satisfying both requires a theory that posits a stable correlation between internal state and external marker, which is empirically risky.

  **Most Exclusionary Requirement:**
  **Req 3 (Third-Party Accessibility).**
  Most philosophical theories of pleasure are designed for the subject's perspective. They fail immediately when asked, "How do I measure this in someone who cannot speak?" This requirement eliminates pure Phenomenalism and most pure Attitudinal views (since attitudes can be hidden).

  ---

  #### II. Positions on Structural Questions

  **1. Is the demand for ONE feature a prejudice?**
  Yes. Insisting on a single *phenomenological* feature (a "tingle" or "glow") is the specific prejudice of the Felt-Quality view. A functionalist can argue the single feature is a *role* (e.g., "signal to reinforce behavior") rather than a *feel*. However, for your Purpose (a) (currency), you effectively need a functional unity even if the feel varies. If there is *no* common feature (even functional), you cannot aggregate, and Hedonism collapses into Pluralism.

  **2. What must a Cluster/Disjunctive account deliver?**
  To count as an answer, it must explain the *cluster criteria*. It cannot just say "pleasures are A, B, or C." It must say "Pleasures are A, B, or C *because they all trigger the same neural reward pathway*" or "*because they all satisfy a pro-attitude*." If it offers no unifying principle for the clustering, it is an admission of defeat regarding the heterogeneity problem and fails your Purpose (a) entirely (no common currency).

  **3. Does the theory owe an explanation of why pleasure is good?**
  No. That is a separate normative question. The theory of pleasure is metaphysical/psychological (what *is* it?). The theory of welfare is ethical (why does it *count*?). Loading the "goodness" explanation onto the definition of pleasure creates the Euthyphro problem for hedonism: Is it good because it's pleasure, or pleasure because it's good? Keep them separate.

  **4. Does it owe us a unit (hedonic degree)?**
  For Purpose (a), **Yes.** Without a unit (or at least a robust ordinal ranking), aggregation is arithmetic nonsense. You cannot sum "quality of experience" + "intensity of desire" without a conversion rate. For Purpose (b), it owes a *proxy metric* (e.g., duration of smile + physiological relaxation). If it punts on measurability, it is inadequate for your specific project, even if philosophically coherent.

  ---

  #### III. Case Stress-Test Results

  *   **Bike Fixing (Absorption):** Falsifies simple Felt-Quality (no distinct pleasant feeling). Supports Adverbial or Attitudinal views.
  *   **Sunburn Scratch (Mixed):** Falsifies simple Intensity metrics. Shows pleasure/pain can be co-located. Theory must handle valence complexity.
  *   **Third Slice (Wanting vs. Liking):** Falsifies pure Desire theories (you want it, but don't enjoy it). Requires a split between motivation and valuation.
  *   **Long Pleasures:** Falsifies strict Atomism. Theory must allow for "extended attitudes" or narrative integration.
  *   **Headache Stopping:** Tests Relief. If pleasure is only positive feeling, relief is nothing. If pleasure is desire-satisfaction (pain stops), it counts. Theory must account for negative-to-zero transitions as positive welfare.
  *   **Diffuse Mood:** Tests Object-Directedness. Pleasure need not be *about* anything. Theories requiring an object (propositional attitudes) struggle here.
  *   **Disowned Pleasures:** Tests Normative Separation. Theory must classify this as pleasure even if the subject judges it bad.
  *   **Inverted Case:** Tests Definition vs. Role. If the quality is "itchy" but the role is "reward," is it pleasure? Functionalism says yes; Phenomenalism says no. This decides whether you prioritize the *feel* or the *function*.
  *   **Dementia Resident:** The Kill Switch. If the theory requires memory or complex cognition to "enjoy," it fails here. It must locate pleasure in the *occurrent state*, not the retrospective judgment.

  ---

  #### IV. Scorecard

  **1. Felt-Quality / Hedonic Tone**
  *   **Verdict:** Fails Purpose (b).
  *   **Pros:** Intuitive; handles Commensurability (Req 2) well by positing a common scale of intensity.
  *   **Cons:** Fails Bike Case (no distinct tone); Fails Dementia Case (private access); Fails Headache Case (absence isn't a feeling).
  *   **Fit:** High for Welfare Currency, Zero for Care Protocol.

  **2. Desire / Attitudinal (You enjoy X iff you want X to continue)**
  *   **Verdict:** Fails Wanting/Liking Distinction.
  *   **Pros:** Handles Heterogeneity (all are objects of pro-attitude); Good for Third-Party (preferences can be inferred).
  *   **Cons:** Fails Third Slice Case (wanting what you don't like); Fails Dementia Case (advanced dementia may lack coherent propositional attitudes); Aggregation is hard (how to sum conflicting desires?).
  *   **Fit:** Moderate for Welfare, Moderate for Care Protocol.

  **3. Adverbial (Pleasure is a way of experiencing, not a part of it)**
  *   **Verdict:** Theoretically robust, practically useless.
  *   **Pros:** Solves Heterogeneity (same "gladly" modifier on different acts); Handles Bike Case (doing it gladly).
  *   **Cons:** Terrible for Measurement (Req 2 & 4); Impossible for Third-Party (Req 3) (how do you observe an adverb?); No clear unit.
  *   **Fit:** High for Philosophy, Zero for Your Project.

  **4. Cluster / Family Resemblance**
  *   **Verdict:** Fails Purpose (a).
  *   **Pros:** Handles Heterogeneity perfectly; accommodates all Cases without distortion.
  *   **Cons:** Destroys Commensurability (Req 2). If pleasures are only loosely related, you cannot sum them into a "welfare total." No single unit possible.
  *   **Fit:** Zero for Welfare Currency, High for Descriptive Accuracy.

  **5. Contender: Neurofunctional / Behavioral Proxy (The Pragmatic Hybrid)**
  *   **Verdict:** Best fit for Purpose (b), risky for Purpose (a).
  *   **Pros:** Directly addresses Dementia Case (observe reward circuitry/behavior); Handles Wanting/Liking (distinct neural pathways); Observable (Req 3).
  *   **Cons:** Reductionist (ignores phenomenology); Interpersonal comparison (Req 2) relies on assuming identical neural mappings across people.
  *   **Fit:** High for Care Protocol, Moderate for Welfare Currency (if you accept biological utilitarianism).

  **Summary Recommendation:**
  You cannot satisfy Purpose (a) and Purpose (b) with a single classical theory. The **Felt-Quality** view gives you the currency but hides the data. The **Desire/Behavioral** view gives you the data but corrupts the currency (wanting $\neq$ welfare).
  For the care home protocol, you must adopt the **Neurofunctional/Behavioral** contender, but acknowledge it is a *proxy* for welfare, not a definition of it. For the philosophical text, you must argue that the "Common Feature" is **functional** (activation of the reward system/positive reinforcement signal) rather than phenomenological. This allows aggregation (neural intensity) and observation (behavioral output) without requiring a specific "feeling."
