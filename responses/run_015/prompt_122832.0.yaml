  2.  **Deconstruct the Dual Purpose (The Tension):**

      *   (a) Welfare Currency requires *commensurability*. To aggregate, you need a common metric (a "hedon"). This pushes towards a monistic, quantitative view (Felt-Quality).
      *   (b) Third-Party Evaluation requires *observability*. Internal felt tones are hidden. Behavior/attitudes are visible. This pushes towards Desire/Attitude or Behavioral views.
      *   *Conflict:* If pleasure is purely internal (Felt-Quality), (b) is hard/impossible. If pleasure is purely behavioral/dispositional (Desire/Attitude), (a) might lose its normative "feel" (is satisfying a misguided desire really good?).
      *   *Verdict on (b):* Is it illegitimate? No, but it shifts the theory from metaphysics of mind to ethics of care. It forces an externalist constraint on an internalist concept.

  3.  **Drafting the Requirements List:**

      *   Need to cover: Heterogeneity, Welfare Weight, Observability, Distinctions, Cases.
      *   *Req 1: Commonality.* Must explain what unites beer, math, bath. (Non-negotiable for hedonism).
      *   *Req 2: Commensurability.* Must allow aggregation/comparison. (Non-negotiable for Purpose A).
      *   *Req 3: Observability.* Must be detectable by third parties without self-report. (Non-negotiable for Purpose B).
      *   *Req 4: Normative Valence.* Must explain why pleasure counts *for* welfare (not just is welfare). (Preference/Negotiable depending on theory).
