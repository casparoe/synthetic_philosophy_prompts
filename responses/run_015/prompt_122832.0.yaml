      *   *Tone Check:* Keep it sharp. "Just the spec." No fluff.

  8.  **Final Polish of the Requirements:**

      *   Make sure the tension between (a) and (b) is the headline act.
      *   Ensure the "Most Exclusionary" is justified.
      *   Make sure the Scorecard is brief but punchy.

  9.  **Final Review against constraints:**
      *   No citations? Checked.
      *   Scorecard 4 options + contender? Checked.
      *   Address specific philosophical questions? Checked.
      *   Address specific cases? Checked.

  *(Self-Correction on the "Inverted Case"):* This is a classic philosophical zombie/qualia inversion argument. I need to be clear that this tests the *definition* vs. the *role*.
  *(Self-Correction on "Dementia Resident"):* This is the crux of requirement (b). If the theory can't handle this, it fails the user's specific purpose.

