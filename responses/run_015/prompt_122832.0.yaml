      *   *Incompatibility:* Req 2 (Commensurability) and Req 3 (Observability) are the main tension. Internal feelings are hard to observe; observable behaviors are hard to quantify into a single unit.
      *   *Most Exclusionary:* Req 3 (Observability). Most philosophical theories ignore the third-person constraint.

  4.  **Addressing the Specific Philosophical Positions:**

      *   *One Feature?* Insisting on a single phenomenological feature is a prejudice of the Felt-Quality view. A functionalist or cluster view can deny this.
      *   *Cluster/Disjunctive:* To count as an answer, it must explain *why* these clusters fall under "pleasure" (e.g., evolutionary function, neural substrate) rather than just listing them. It risks giving up on the "currency" aspect.
      *   *Explanation of Goodness:* The theory of *what pleasure is* shouldn't necessarily explain *why it's good*. That's a separate normative step. Loading it creates confusion.
      *   *Unit/Measurability:* For Purpose (a), it *must* offer a unit (or at least ordinal ranking). Punting makes aggregation impossible. For Purpose (b), it needs a proxy metric.

  5.  **Evaluating the Cases:**

      *   *Bike Fixing (Absorption):* Challenges Felt-Quality (no distinct feeling). Supports Desire/Adverbial.
      *   *Sunburn (Mixed):* Challenges simple intensity metrics. Supports complex/aspect views.
      *   *Third Slice (Wanting vs. Liking):* Crucial. Separates Desire from Feeling. Felt-Quality handles "liking"; Desire handles "wanting".
      *   *Long Pleasures:* Challenges atomism. Needs a view that allows temporal extension.
