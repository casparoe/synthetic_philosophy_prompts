answer: |-
  # The Special Composition Question: A Decision Tree

  **Instructions:** Start at the top. Answer the concrete questions. Do not worry about the names of the views until you reach the bottom. If you end up in a boxed cell, that is your position.

  ### **Q1: What kind of dispute is this?**
  *Imagine two people arguing over whether a "heap" of sand exists. Are they disagreeing about the world, or the word?*
  *   **A.** It's about the word "exists." Different conceptual schemes carve the world differently; neither is uniquely "true."
      *   ➔ **[QUANTIFIER VARIANCE / DEFLATIONARY]**
      *   *Awkward Commitment:* There is no single fact of the matter about whether your left shoe and the Eiffel Tower compose an object.
  *   **B.** It's about the world. There is a mind-independent fact about whether composition occurs.
      *   ➔ *Go to Q2.*

  ### **Q2: Is the whole distinct from the parts?**
  *Consider a statue and the clay it's made of. Is the statue a *second thing* in addition to the clay particles?*
  *   **A.** No. The whole is nothing over and above the parts; composition is just identity.
      *   ➔ **[COMPOSITION AS IDENTITY]**
      *   *Awkward Commitment:* To say "the parts exist" is literally to say "the whole exists," making plural and singular quantification interchangeable.
      *   *(Note: Often collapses into Unrestricted Composition, as identity imposes no limits.)*
  *   **B.** Yes. The whole is a distinct entity from the parts taken together.
      *   ➔ *Go to Q3.*

  ### **Q3: Fundamental Reality or Ordinary Truth?**
  *When you say "there is a table," do you mean it exists in the fundamental structure of reality, or just that the sentence is useful/true in English?*
  *   **A.** Ordinary Truth. I want to know if our everyday sentences are strictly true.
      *   ➔ *Go to Q4.*
  *   **B.** Fundamental Reality. I want to know what exists at the bottom level of ontology.
      *   ➔ *Go to Q5.*

  ### **Q4: (Ordinary Truth) Are composite claims strictly false?**
  *If fundamental reality contains only simples, is the sentence "there is a table" false?*
  *   **A.** Yes, strictly false, but we speak as if it's true for convenience.
      *   ➔ **[NIHILISM-WITH-FICTIONALISM]**
      *   *Awkward Commitment:* You must explain why "there are tables" is assertible despite being false, without slipping into realism.
  *   **B.** No, they are true (even if derivative).
      *   ➔ *Merge with Q5 outcomes (Realist views).*

  ### **Q5: (Fundamental) Do *any* composite objects exist fundamentally?**
  *Strip away language. Are there fundamental entities that have proper parts?*
  *   **A.** No. Only simples exist fundamentally.
      *   ➔ **[STRICT NIHILISM]**
      *   *Awkward Commitment:* You must accept that "there are two books on the shelf" is fundamentally false, even if the books are touching.
  *   **B.** Yes.
      *   ➔ *Go to Q6.*

  ### **Q6: How many fundamental composites are there?**
  *Consider the entire universe. Is it the only fundamental composite?*
  *   **A.** Exactly one (the Cosmos). All other "objects" are merely its modes or parts.
      *   ➔ **[PRIORITY MONISM]**
      *   *Awkward Commitment:* You must deny that your own body exists fundamentally, even though the Universe does.
  *   **B.** Many.
      *   ➔ *Go to Q7.*

  ### **Q7: When do parts compose a whole?**
  *Take your left shoe and the Eiffel Tower. Do they compose an object?*
  *   **A.** Always. Any plurality of objects composes something.
      *   ➔ **[UNRESTRICTED COMPOSITION]**
      *   *Awkward Commitment:* You must accept the existence of a "trout-turkey" (the sum of a trout's head and a turkey's tail) as readily as a cat.
  *   **B.** Sometimes.
      *   ➔ *Go to Q8.*
  *   **C.** There is no general condition; it just happens in some cases without a unifying rule.
      *   ➔ **[BRUTE FACT]**
      *   *Awkward Commitment:* You must accept that composition is an unexplainable primitive, leaving metaphysics incomplete.

  ### **Q8: What is the condition? (Restricted Composition)**
  *Consider a chess set whose pieces are on three different continents. Do they compose an object?*
  *   **A.** Yes, if they are physically connected or cohesive.
      *   ➔ **[CONTACT / COHESION]**
      *   *Awkward Commitment:* You must deny that the members of a string quartet compose an object while playing, since they aren't physically touching.
  *   **B.** Yes, if they constitute a living organism.
      *   ➔ **[ORGANICISM]**
      *   *Awkward Commitment:* You must deny that a chair exists (it's not alive), but affirm that a human exists, even though both are just atoms arranged similarly.
  *   **C.** Yes, if they realize a single conscious subject.
      *   ➔ **[CONSCIOUS COMPOSITION]**
      *   *Awkward Commitment:* You must deny that a human in a persistent vegetative state is a single object, despite being biologically alive.

  ***

  ### **Notes on Logical Space**

  **1. Indistinguishable Views:**
  *   **Composition as Identity + Unrestricted:** If the whole *is* the parts, it is hard to motivate restrictions on when the parts exist. These views often occupy the same cell.
  *   **Priority Monism + Nihilism:** Both deny fundamental proper parts. They differ only on whether the *Cosmos* counts as a composite or a simple.

  **2. Empty Cells (And Why):**
  *   **Strict Nihilism + Unrestricted:** Logically incoherent. You cannot claim nothing composes while claiming everything composes.
  *   **Fundamental + Fictionalism:** Incoherent. Fictionalism is a theory about truth-aptness of language, not a description of fundamental ontology.
  *   **Contact + Scattered Sums:** Unexplored/Unattractive. If contact is required, scattered sums (like the chess set) are ruled out by definition.

  **3. On "Conscious Composition":**
  *   **Is it distinct from Organicism?** Yes. Organicism tracks *biological life*; Conscious Composition tracks *phenomenal unity*.
  *   **Test Case 1 (Separates from Organicism):** A human in a persistent vegetative state. *Organicism:* Composition occurs (it's an organism). *Conscious:* No composition (no subject).
  *   **Test Case 2 (Separates from Organicism):** A networked AI swarm. *Organicism:* No composition (not biological). *Conscious:* Composition occurs (if it realizes a subject).
  *   **Awkward Case:** **Gradual Sleep/Anesthesia.** Consciousness fades gradually. If composition requires a subject, do you cease to exist as an object every time you fall asleep? This introduces unacceptable vagueness to identity.

