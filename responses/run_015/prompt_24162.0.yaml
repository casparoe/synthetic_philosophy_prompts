prompt: |-
  I've landed on the position that evolutionary psychology is a real science, not a genre of just-so stories in the Kipling sense, and I'd like a map of what would count against it. My working view: the core program -- that a lot of the mind is a suite of domain-specific modules shaped by natural selection in the ancestral environment -- is doing exactly the kind of historical-functional explanation that makes evolutionary biology science, and the standard just-so objection (post-hoc, unfalsifiable, any story can be spun) is a generic attack that would sink paleontology and phylogenetics too, so it doesn't land. What would have to be true for me to be wrong? I want the defeaters sorted from fatal to merely awkward, and I'd be helped if you separated (a) evidence that would count against the modular-architecture claims specifically, (b) evidence that would count against the ancestral-environment reconstruction method, and (c) things that would only embarrass particular famous hypotheses without touching the program. I also want to know which of these a committed evolutionary psychologist would themselves concede as counting against them versus wave away as bad examples, and whether the program has a signature prediction that rival accounts -- say, general-purpose-learning-mechanism views or cultural-evolution accounts -- genuinely don't make, or whether its testability is mostly negative (it's just the absence of a better alternative). One more thing: I suspect part of the defense is definitional, i.e. "any hypothesis that could in principle be tested counts, and we just have to wait for the tests." Is the position insulated that way, and if so, is that a problem for it, or is that just what historical sciences are like? What I'd personally find most persuasive is a case where the program made a risky, dated, specific prediction and got it wrong in a way a rival account got right -- or, failing that, a clear statement of how much of the "science" label is load-bearing versus how much is already on the table from the fact that selection is a real cause.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Core Stance:** The user believes evolutionary psychology (EP) is a real science, not just "just-so stories." They compare it to paleontology/phylogenetics (historical-functional explanation).
      *   **Goal:** A "map of what would count against it" (falsification conditions/defeaters).
      *   **Structure:**
          *   Sort defeaters from fatal to awkward.
          *   Categorize evidence: (a) Modular architecture, (b) Ancestral environment reconstruction, (c) Embarrassing specific hypotheses (vs. program).
          *   Internal vs. External Critique: What would EP proponents concede vs. wave away?
          *   Signature Predictions: Does EP make unique positive predictions compared to rivals (general learning, cultural evolution)?
          *   Definitional Insulation: Is EP protected by "wait for the tests"? Is this a problem or standard for historical sciences?
          *   Gold Standard: A case where EP made a risky prediction and got it *wrong* (while a rival got it right).
          *   Meta-question: How much of the "science" label is load-bearing vs. just "selection is real"?

  2.  **Initial Assessment & Tone:**

      *   The user is sophisticated. They know the "just-so story" critique and reject it as generic to historical sciences. They want *specific* falsification conditions, not a rehash of the standard debate.
      *   Tone should be analytical, balanced, and rigorous. Avoid defending or attacking EP; instead, map the logical space of falsification.
      *   Acknowledge the validity of the comparison to paleontology but highlight where the disanalogies might lie (e.g., fossil record of the mind).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Validate the user's premise. Yes, EP *claims* to be a historical science like paleontology. The "just-so" critique is often overused, but the *degree* of constraint is the real issue.

      *   **Category 1: Fatal Defeaters (The "Kill Switches"):**
          *   *Architecture:* If the brain is shown to be overwhelmingly domain-general (e.g., a single learning algorithm that solves everything). This attacks the "Swiss Army Knife" model.
          *   *Timeframe:* If selection couldn't have acted fast enough (e.g., traits emerged too recently for genetic fixation).
          *   *Phylogeny:* If human traits map perfectly onto primate traits with no human-specific adaptation needed.
          *   *EP Concession:* Proponents would concede these are fatal.

      *   **Category 2: Awkward/Methodological Defeaters (The "Hard Mode"):**
          *   *Reconstruction:* If the Environment of Evolutionary Adaptedness (EEA) is shown to be too variable or unknowable to ground specific hypotheses.
          *   *Plasticity:* If phenotypic plasticity explains the variance better than genetic adaptation.
          *   *EP Concession:* They might argue "variable EEA selects for plasticity," so this is often waved away as consistent with EP.

      *   **Category 3: Embarrassing Hypotheses (The "Bad Apples"):**
          *   Specific claims (e.g., "depression is an alliance signal") that fail replication or have better proximate explanations.
          *   *EP Concession:* They will sacrifice these to save the core program (Lakatosian research programme).

      *   **Signature Predictions (The "Positive Test"):**
          *   This is crucial. EP needs *novel* predictions, not just post-hoc fitting.
          *   *Example:* Error Management Theory (EMT). Predicts specific *biases* (false positives vs. false negatives) based on cost asymmetry. This is a strong candidate for a unique prediction.
          *   *Rivals:* General learning predicts unbiased error or error based on reinforcement history, not ancestral cost structures.
          *   *Cultural Evolution:* Predicts variation based on transmission, not universal cognitive biases rooted in survival costs.

      *   **The "Wait for the Tests" Defense (Insulation):**
          *   Is it definitional? Yes, somewhat. "It's an empirical question."
          *   Is it a problem? It risks becoming a "degenerating research programme" (Lakatos) if the "protective belt" absorbs too many anomalies without new predictions.
          *   Comparison to Paleontology: Paleontology has rocks. EP has brains/behavior. The "fossil record" for behavior is much thinner.

      *   **The "Smoking Gun" (EP Got it Wrong):**
          *   Need a specific example.
          *   *Candidate:* The "Cheater Detection" module (Wason Selection Task).
          *   *Nuance:* It worked well initially, but later research showed it might be about deontic logic or general relevance, not just "cheating."
          *   *Better Candidate:* Some specific EEA reconstructions (e.g., specific diet claims) that clashed with archaeological evidence.
          *   *Honest Answer:* There aren't many clear cases where EP said X, General Learning said Y, and Y was proven right *decisively*. Often they are compatible. This is a weakness in the user's request (finding a clear loss), but I must address it honestly.

      *   **Load-Bearing "Science" Label:**
          *   Selection is real (biology).
          *   Mind is biological (materialism).
          *   Therefore, mind was selected (EP).
          *   The leap is in the *specifics*. The "science" label is load-bearing on the *methodological rigor*, not the premise.

  4.  **Refining and Polishing:**

      *   *Check against User Constraints:* Did I separate (a), (b), (c)? Yes. Did I sort fatal vs. awkward? Yes. Did I address the "signature prediction"? Yes (EMT). Did I address the insulation charge? Yes.
      *   *Nuance Check:* Ensure I don't strawman EP. Modern EP (Tooby/Cosmides) is more sophisticated than pop-EP. Acknowledge the shift towards "evolutionary cognitive science."
      *   *Key Distinction:* Distinguish between *Ultimate* (why) and *Proximate* (how) causes. EP focuses on Ultimate. Rivals often focus on Proximate. They aren't always mutually exclusive.
      *   *Lakatos Framework:* Use Imre Lakatos's "Research Programmes" (Hard Core vs. Protective Belt) as it fits the user's philosophical framing perfectly.

  5.  **Final Review of the "Got it Wrong" Request:**
      *   This is the hardest part. EP is often criticized for *not* making risky predictions. I need to find where they *did* and failed, or admit the scarcity.
      *   *Idea:* The "Standard Social Science Model" (SSSM) was the rival. EP predicted universals; SSSS predicted cultural variance. In some cases (e.g., emotion expressions), EP won. In others (e.g., moral foundations), cultural evolution explains variance better.
      *   *Specific Failure:* Maybe the "savannah hypothesis" for spatial navigation? Or specific claims about mating strategies that don't hold up cross-culturally (e.g., Buss's 37 cultures study had replication issues/nuance).
      *   *Decision:* Be honest. There are few *decisive* losses where a rival theory *won*. Usually, it's integration. This lack of decisive falsification is the actual vulnerability.

  6.  **Constructing the Output:** (Mental Outline)
      *   Intro: Validate the paleontology analogy.
      *   Part 1: The Defeater Map (Fatal, Awkward, Embarrassing).
      *   Part 2: Internal vs. External (What they concede).
      *   Part 3: Signature Predictions (EMT is the star here).
      *   Part 4: The Insulation Defense (Lakatos).
      *   Part 5: The "Smoking Gun" (Where EP lost).
      *   Conclusion: The status of the "Science" label.

  7.  **Self-Correction during drafting:** I initially thought about mentioning specific political controversies, but that's irrelevant to the *science* status. Stick to cognitive architecture and methodology. Ensure I distinguish between "Pop EP" (media headlines) and "Academic EP" (Tooby, Cosmides, Buss, Pinker). The user is asking about the academic program.

  8.  **Final Polish:** Check clarity, ensure the distinction between domain-specific and domain-general is clear. Make sure the "just-so" vs. "paleontology" comparison is handled with care (the fossil record disparity).

  *(Self-Correction on the "EP got it wrong" point)*: I need to be careful not to say "EP has never been wrong." It's that *rival accounts* rarely get the credit for the correction. Often, the correction comes from *within* EP (refining the module). I should highlight that.

  Okay, ready to write.
answer: |-
  This is a sophisticated framing. You are correct that the "just-so story" critique is often wielded as a conversation-stopper without acknowledging that historical sciences (paleontology, cosmology, phylogenetics) all rely on inference to the best explanation regarding unobservable past events. If EP is to be treated as a historical science, it must be subject to the same constraints of evidence and falsifiability.

  However, the disanalogy lies in the **trace evidence**. Paleontology has rocks and bones; EP has brains and behavior, but the "fossil record" of cognitive architecture is indirect.

  Here is a map of what would count against the Evolutionary Psychology (EP) research programme, sorted by severity, along with an analysis of its predictive signature and insulation strategies.

  ---

  ### I. The Defeater Map: What Would Count Against EP?

  We can categorize potential falsifications using a Lakatosian framework (Hard Core vs. Protective Belt).

  #### 1. Fatal Defeaters (The "Kill Switches")
  *These would undermine the Hard Core of the programme: that the human mind consists largely of domain-specific adaptations shaped by selection.*

  *   **(a) The Domain-General Victory:** If neuroscience and AI demonstrate that a single, domain-general learning algorithm (e.g., a unified predictive processing hierarchy or a general reinforcement learner) can account for the full range of human cognitive competencies (language, face recognition, social exchange, fear acquisition) without positing innate, content-rich constraints.
      *   *Status:* **Fatal.** If the brain is a "general-purpose computer," the "Swiss Army Knife" model is false.
      *   *EP Concession:* Proponents (Tooby, Cosmides) would concede this. Their entire programme rests on the inadequacy of the "Standard Social Science Model" (blank slate/general learning).
  *   **(b) The Timeframe Mismatch:** If genetic evidence shows that key psychological traits emerged too recently for natural selection to have fixed them in the population (e.g., a trait arising 5,000 years ago that requires complex genetic coordination).
      *   *Status:* **Fatal.** Selection requires time.
      *   *EP Concession:* Conceded. EP relies on the Environment of Evolutionary Adaptedness (EEA) being a period of stability long enough for fixation.
  *   **(c) Phylogenetic Continuity:** If comparative psychology shows that every putative "human adaptation" is present in chimpanzees or macaques in identical form, implying no human-specific selection pressure occurred.
      *   *Status:* **Fatal.** It would imply human behavior is a byproduct of primate ancestry, not human-specific adaptation.
      *   *EP Concession:* Conceded. EP posits human-specific adaptations (e.g., complex language, cumulative culture tools).

  #### 2. Awkward Defeaters (Methodological Crises)
  *These attack the methodology (reconstruction of the EEA) rather than the core premise. They make the science "hard mode" but not impossible.*

  *   **(b) The EEA is Unknowable/Variable:** If archaeological and anthropological data confirm that the Pleistocene environment was so radically variable across space and time that no stable selection pressure can be posited for any specific trait.
      *   *Status:* **Awkward/Debilitating.** It forces EP to retreat to "selection for plasticity" (which is still EP, but less specific).
      *   *EP Concession:* **Waved Away/Integrated.** EP proponents argue that *variability* itself is a selection pressure. They would pivot to "adaptations for flexibility." This is a move that protects the core but reduces specificity.
  *   **(a) Neural Reuse/Neuroplasticity:** If brain imaging shows that "modules" (e.g., for fear, for language) are not localized or dedicated circuits but transient coalitions of neurons recruited from other tasks (neural reuse).
      *   *Status:* **Awkward.** It challenges the "hardwired module" metaphor.
      *   *EP Concession:* **Mixed.** Modern EP is moving toward "functional modules" (software) rather than "anatomical modules" (hardware). They would argue the *computational* function is adapted, even if the neural substrate is flexible.

  #### 3. Embarrassing Hypotheses (The "Protective Belt")
  *These are specific claims that can be discarded without sinking the ship.*

  *   **(c) Specific "Just-So" Failures:** Examples include specific claims like "morning sickness is an adaptation to expel toxins" (contested) or "depression is a bargaining signal" (mixed evidence).
      *   *Status:* **Embarrassing.**
      *   *EP Concession:* **Sacrificed.** Proponents will classify these as "hasty hypotheses" or "popularizations," distinguishing "Academic EP" from "Pop EP." They will argue these were bad applications of the method, not failures of the method itself.

  ---

  ### II. Signature Predictions: Does EP Make Unique Claims?

  You asked if EP has a signature prediction that rival accounts (General Learning, Cultural Evolution) do not make. If EP only explains what is already known, it is post-hoc fitting. It needs *novel* predictions.

  **The Strongest Candidate: Error Management Theory (EMT)**
  *   **The Prediction:** Cognitive mechanisms should not be designed for *accuracy*, but for *minimizing the cost of errors*. If a False Positive is cheaper than a False Negative (or vice versa), the mind should evolve a systematic *bias*.
  *   **The Example:** Visual perception of snakes. It is cheaper to mistake a stick for a snake (False Positive) than a snake for a stick (False Negative). EP predicts a universal, innate bias to over-detect snake-like shapes.
  *   **Rival Prediction (General Learning):** A general learner should learn to fear snakes based on reinforcement history. It should not show a *pre-existing bias* in neutral conditions unless trained.
  *   **Rival Prediction (Cultural Evolution):** Fear of snakes should vary based on cultural transmission and ecological prevalence, not a universal cognitive bias.
  *   **The Verdict:** EMT has generated successful, risky predictions (e.g., auditory looming bias, sexual over-perception bias in men). This is EP's strongest scientific foothold. It predicts *directional bias* where other theories predict *accuracy* or *cultural variance*.

  **The Weaker Candidate: Universality**
  *   EP predicts cognitive universals; Cultural Evolution predicts variance.
  *   *Problem:* EP often explains variance via "evoked culture" (switches flipped by environment), which makes it hard to distinguish from Cultural Evolution empirically.

  ---

  ### III. The "Insulation" Defense: Is it Definitional?

  You suspect the defense is: *"Any hypothesis that could in principle be tested counts, and we just have to wait for the tests."*

  **Is the position insulated?**
  Yes, structurally. Because the "modules" are posited as computational functions, not necessarily specific neurons, EP can absorb neural findings by saying, "The hardware is flexible, but the software is adapted." This makes it difficult to falsify the *existence* of a module, even if the *location* is wrong.

  **Is this a problem?**
  It depends on the **Heuristic Fertility**.
  *   **Progressive Shift:** If the insulation allows researchers to generate new, confirmed predictions (like EMT), it is a valid "protective belt" (Lakatos).
  *   **Degenerating Shift:** If the insulation is used only to explain away anomalies without generating new predictions, it is pseudoscientific drift.

  **Comparison to Paleontology:**
  Paleontology is insulated by the incompleteness of the fossil record ("the missing link hasn't been found *yet*"). However, paleontology is constrained by *stratigraphy* and *physics* (dating). EP lacks a "stratigraphy of the mind." Its insulation is riskier because the "fossils" (behavioral data) are contemporary and noisy, not buried and fixed.

  ---

  ### IV. The "Smoking Gun": Where EP Got It Wrong

  This is the hardest part of your request. Science advances by falsification, but research programmes rarely admit death; they evolve. However, there are cases where EP predictions failed, and rivals offered better explanations.

  **Case Study: The Wason Selection Task (Cheater Detection)**
  *   **EP Prediction (Cosmides & Tooby, 1992):** Humans have a dedicated "cheater detection" module. We should solve logic problems easily if they are framed as social contracts (catching a cheater) but fail if they are abstract.
  *   **The Result:** Initially supported.
  *   **The Defeat:** Later replications showed that performance improves with *deontic logic* (rules/permissions) regardless of "cheating," and even with non-social rules if the context implies benefit/cost.
  *   **The Rival:** General reasoning accounts (pragmatic reasoning schemas) explained the data without positing a specific "cheater" module.
  *   **EP Response:** They refined the hypothesis (it's about "benefit" and "requirement," not just cheating).
  *   **Verdict:** This is a case where the *specific* modular claim was weakened, and a more general cognitive account gained ground. EP didn't die, but the "Cheater Module" is no longer considered as isolated as first claimed.

  **Case Study: Mate Preference Universals (Buss, 1989)**
  *   **EP Prediction:** Men universally value youth/beauty (fertility cues); women universally value resources/status.
  *   **The Defeat:** Cross-cultural replications (e.g., Zentner & Mitura, 2012) showed these differences shrink or vanish in highly gender-equal societies.
  *   **The Rival:** Social Role Theory / Cultural Evolution predicts that as structural constraints lift, psychological differences should diminish.
  *   **Verdict:** **EP got this wrong (or at least overstated).** The data favored the Cultural/Social account. EP proponents now argue that *underlying* preferences exist but are masked by cultural constraints, but this move looks like insulation. This is the strongest empirical black mark against the "universality" claim.

  ---

  ### V. Conclusion: How Load-Bearing is the "Science" Label?

  You asked how much of the "science" label is load-bearing versus how much is already on the table from "selection is a real cause."

  1.  **"Selection is Real" (Trivial):** Yes, humans are biological organisms. Selection acted on us. This is not controversial.
  2.  **"Mind is Adapted" (Load-Bearing):** The claim that specific *psychological* traits (not just eyes or livers) are direct adaptations is the scientific hypothesis.
  3.  **"We Can Reconstruct Them" (Methodological):** The claim that we can infer these traits via EEA reconstruction is the methodological wager.

  **The Verdict:**
  EP is a science **if** it adheres to the EMT model (risky predictions about bias) and acknowledges the "Degenerating" risk.
  *   **It is science** when it says: "Because of ancestral cost asymmetry X, we predict bias Y in modern context Z." (This is testable and falsifiable).
  *   **It is just-so** when it says: "Trait X exists; therefore, it must have had function Y in the past." (This is post-hoc).

  **To be wrong, you would need to see:**
  A demonstration that **domain-general learning + cultural transmission** can model the *specific biases* (like EMT predicts) more parsimoniously than innate modules. If a general AI can learn the "snake bias" purely from data without a pre-set cost function, the EP claim of an *innate* module is severely weakened.

  Currently, EP is in a **Progressive** phase regarding Error Management and Sensory Biases, but in a **Degenerating** phase regarding complex Social/Political behaviors (where "adaptation" is often asserted without rigorous constraint). Your view that it is a real science is defensible, provided you restrict the scope to where it makes *risky* predictions (biases, universals in development) rather than where it offers *plausible* narratives (modern political attitudes, specific mating rituals).
