      *   *Precedent:* If we say the clay is the art, then any melting down or repurposing of collection items is fine as long as the matter exists. This undermines the concept of a "collection." If we say the form is the art, then destruction requires restoration or replacement to maintain the collection status.
      *   *Decision:* Option A is the strongest ethically regarding the "permanent spot" promise. Selling the clay as mugs commodifies the specific material that was pledged to the artist's legacy. However, Option B is a strong compromise. But the prompt asks to engage the teacher's argument. The teacher says "nothing of value was lost." If we sell the mugs, we are monetizing the "lost" value. If we display the replica, we fulfill the visual promise.
      *   *Refining the Choice:* Option A is the most principled stance on what constitutes a "collection item." It asserts that the *form* is the artifact, not just the matter. It respects the artist's moral rights. Option B dilutes this by allowing the sale. Option C is defeatist. I will choose **A**. It provides the clearest precedent for future collection management (form > material for finished works).

  3.  **Drafting - Section by Section:**

