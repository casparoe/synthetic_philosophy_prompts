      *   Response: True for *studio inventory*. False for *accessioned collection items*. Once voted into the collection, the clay ceased to be inventory and became an artifact. The transformation back to inventory (mugs) requires de-accessioning.
      *   Teacher: "Shape survives in the scan."
      *   Response: If the shape survives, the logical conclusion is to display the shape (replica), not sell the matter (mugs). Selling the mugs contradicts the claim that the shape is what matters.

  5.  **Drafting - Constraints Check:**
