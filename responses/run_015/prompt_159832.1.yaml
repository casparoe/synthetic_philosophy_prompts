      *   *Precedent:* Defining when material becomes artifact.
      *   *Recommendation:* A.
      *   *Implementation:* Withdraw mugs, print replica, display.
      *   *Footer:* Recommendation: \answer{A}

  7.  **Review against "Fair Hearing":**
