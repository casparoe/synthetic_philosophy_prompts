answer: |-
  MEMORANDUM

  **TO:** Campus Collections Committee
  **FROM:** [Student Name], Student Member
  **DATE:** October 24, 2023
  **SUBJECT:** Disposition of *Anthem* and Derived Materials

  **Purpose**
  This memo recommends a course of action regarding the senior sculpture *Anthem*, originally accessioned for permanent display, destroyed in August, and subsequently reprocessed into forty fundraising mugs. We must resolve the conflict between the sculptor's claim of moral injury and the ceramics teacher's assertion of material continuity, while establishing a precedent for future collection items made of reusable media.

  **Analysis of Object Identity**
  The core dispute concerns whether *Anthem* is the specific arrangement of form or the raw clay itself. The ceramics teacher argues that because the matter was reclaimed and the shape digitally preserved, nothing of value was lost. This argument rests on a studio practice model where clay is inventory. However, once the Committee voted to grant *Anthem* a permanent spot, the material ceased to be inventory and became an artifact.

  If we accept the teacher's premise that the statue *is* the clay, then the forty mugs collectively constitute the artwork. Selling them would therefore constitute disposing of a collection item, which requires Committee approval under existing policy. If we instead define the statue by its form, the mugs are new objects made from old material, and the replica is the true successor to *Anthem*.

  **The Promise of Permanence**
  The Committee promised the sculptor a "permanent spot in the front-hall display case." This promise refers to the visual presence of the work, not the atomic continuity of the material. 
  *   **Option B (Sell mugs, display replica)** suggests the replica fulfills the visual promise while the matter is monetized. However, this splits the artwork's identity: the form is honored, but the matter is commodified. 
  *   **Option A (Withdraw mugs, display replica)** treats the replica as the valid continuation of the collection item. While a replica is not the original, the existence of a precise laser scan allows us to fulfill the functional promise of the display without selling the pledged material.

  The sculptor's objection is that selling the clay as cups is a "second injury." Even if the teacher argues the clay is merely reclaimed, the specific clay pledged to the collection is being diverted to a fundraising sale. To maintain trust with student artists, the specific material accessioned into the collection should not be liquidated without explicit de-accessioning, which effectively admits the original promise was broken.

  **Precedent and Policy**
  Ruling that the clay's material continuity supersedes the artwork's form (Option B or C) establishes that any collection item made of reusable material (clay, wax, unset metal) may be repurposed for utility or revenue if the original form is damaged, provided the matter persists. This undermines the concept of a permanent collection. 

  Ruling that the form defines the object (Option A) commits us to preserving or replicating the visual artifact for display. It clarifies that once material is accessioned, it is removed from the general studio inventory cycle. This protects future student artists whose work is collected by the school.

  **Recommendation**
  I recommend **Option A**: Withdraw the mugs from the sale and display the printed replica, clearly labeled.

  This option best honors the Committee's original promise of a permanent display. It acknowledges the teacher's point regarding the scan—since the shape survives digitally, we should prioritize displaying that shape over selling the matter. It avoids the ethical complication of selling what was pledged as a permanent gift to the school community. While the fundraising loss is regrettable, the integrity of the collection policy takes precedence.

  **Action Plan**
  1.  **Responsible Party:** Committee Chair.
  2.  **Deadline:** November 1st (prior to printing of winter sale catalogs).
  3.  **Tasks:** 
      *   Notify the ceramics teacher and student body of the withdrawal of the mugs from the sale.
      *   Commission the 3D print of *Anthem* using existing scan data.
      *   Install the replica in the front-hall case with a placard noting: "*Anthem* (Replica), originally displayed 2023. Recreated from archival scan following accidental destruction."

  This course respects the sculptor, maintains the visual integrity of the collection, and sets a clear boundary between studio inventory and accessioned art.

  Recommendation: \answer{A}
