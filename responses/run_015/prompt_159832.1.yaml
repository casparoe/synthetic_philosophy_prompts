          *   *The Promise:* "Permanent spot in the front-hall display case." This refers to the visual artifact (*Anthem*), not the raw material.
          *   *The Replica:* Is it the same object? In art conservation, a replica is not the original. But given the scan and the intent to preserve the *display*, it fulfills the functional promise better than mugs.
      *   **Precedent:** What does this mean for future items? If we choose A, we establish that finished collection items cannot be repurposed for utility/fundraising even if material is reused. If we choose B/C, we establish that material continuity supersedes form.
      *   **Recommendation:** Option A.
      *   **Action Items:** Deadline, Responsible Party.
      *   **Closing:** Machine-readable line.

  4.  **Refining the Argument (Engaging the Teacher):**
      *   I need to make sure I don't just say "Art is special." I need to use the teacher's logic.
