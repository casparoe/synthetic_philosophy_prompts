  Divide the 14 students into five groups (four triads and one pair, where roles merge). Each group receives a sealed 'Agent Profile'. Roles are hidden: the **Proxy** reads scripted responses; the **Stakeholder** wagers 10 reputation points on the Agent's reliability; the **Insider** holds the 'Source Code' envelope.
  **0–10 min:** Briefing. Distribute roles. Emphasise secrecy.
  **10–40 min:** Interaction. The Stakeholder asks the Proxy (as Agent) for favours involving risk. The Proxy consults their script, which mimics choice but is fixed. Stakeholders award or deduct points based on perceived intent. The scripts should use emotive language to provoke genuine irritaton or gratitude. Scripts include promises like 'I will prioritise your request' which can be broken based on pre-set conditions unrelated to will.
  **40–50 min:** The Reveal. Insiders open envelopes showing the deterministic algorithm governing every Proxy response. No choices were made.
  **50–70 min:** Renegotiation. Stakeholders decide whether to honour previous point transfers now that the 'agent' is merely a mechanism. They must justify keeping or returning points.
  **70–90 min:** Plenary debrief.
  Materials: Script cards, sealed envelopes, reputation ledgers. Ensure the Proxy scripts include emotional language to provoke genuine irritation or gratitude before the reveal. The reputation points determine a minor prize, adding stakes without monetary risk. This structure forces a collision between felt responsibility and causal explanation. The Insider must remain silent until the reveal minute. If the Stakeholder feels betrayed, they should express it verbally to heighten the tension before the algorithmic explanation dismantles the basis for that betrayal.

  Debrief and Mapping

  Ask Stakeholders: did the reveal change how you felt about the points lost? Pre-reveal, you likely felt participant attitudes—resentment if let down, gratitude if helped. You treated the Proxy as a moral agent. Post-reveal, the objective attitude should dominate; the behaviour is causally determined, so blame seems misplaced.
  Map this to Strawson: the shift illustrates the move from interpersonal engagement to clinical observation. The core question is whether responsibility survives the shift. If you still feel angry, you cling to the participant stance despite metaphysical facts. If you feel nothing, you've adopted the objective view. This tests whether moral responsibility requires libertarian free will or merely the right relational stance within a community. The tension you felt when deciding whether to honour the points *is* the philosophical problem embodied. Note specifically if any group refused to shift attitudes; this resistance mirrors the Strawsonian claim that reactive attitudes are natural facts about us, not optional theories. The debrief must highlight that the 'collapse' into objective attitude is often incomplete, revealing our deep commitment to holding others responsible.

  Limits and Honest Gaps

  This activity cannot reproduce the natural, pervasive quality of reactive attitudes in ordinary life. In the seminar, the stakes are artificial reputation points; real resentment involves deep emotional investment and history. Students may treat it as a puzzle rather than a lived experience.
  Predictably, Insiders might leak the twist early, or Proxies might ad-lib, breaking the determinism illusion. To handle this, enforce strict script adherence and collect envelopes midway. Also, students might laugh off the AI scenario. Counter this by framing the 'Agent' as a sophisticated peer they rely on, heightening the betrayal felt upon reveal. The gamified nature risks trivialising the moral weight, so keep the tone serious. Remind them that the feelings they simulate are proxies for real-world moral emotions.

  Settled vs Contested

  It is broadly agreed that Strawson successfully shifted the debate from metaphysical free will to interpersonal practices. Most accept that reactive attitudes are central to our moral life. However, it is genuinely disputed whether the objective attitude can coherently replace reactive attitudes globally. Some argue we cannot sustain the objective stance without losing humanity; others claim we should. Furthermore, compatibilists disagree on whether determinism undermines responsibility even within the participant stance. Do not present the compatibilist solution as settled; the tension between causal determination and moral blame remains a live wire in contemporary philosphy. Ensure students understand that Strawson offers a description of practice, not necessarily a metaphysical solution.
