answer: |-
  Creating a formal negative reference class for failed technological predictions does not solve the reference class problem; it essentially doubles the degrees of freedom available to the forecaster and relocates the ambiguity from the prediction itself to the boundary conditions of class membership. You are proposing a mechanism to institutionalize skepticism by grouping unrealized forecasts into a distinct statistical category, but this addition risks providing a veneer of rigor to what remains a subjective selection process. The core difficulty of the reference class problem is never simply finding a class to fit the data, but rather justifying why a specific subject belongs to one class rather than another based on causally relevant features rather than surface-level similarities. By introducing a second class for failures, you allow forecasters to retain their prior beliefs while appearing to account for base rates, because the decision of whether AI resembles the history of computing success or the history of fusion energy delays becomes a matter of argumentative framing rather than empirical constraint.

  This framework unfortunately mirrors the very issue you are trying to solve, which is the tendency to cherry-pick historical analogies that support a desired conclusion. We have all seen the same three examples recycled endlessly in discussions about transformative technology, usually involving powered flight, nuclear energy, or electronic computing, treated as monolithic evidence for either inevitability or stagnation. The fatigue with these examples is well-founded because they obscure the structural differences between failure modes. Flight was constrained by physics and materials science in a way that social adoption was not, whereas nuclear energy faced regulatory and economic hurdles distinct from its engineering viability. When you group these disparate failures into a single negative reference class, you imply a uniformity of failure that does not exist. A prediction fails because the physics was wrong, or because the economics did not hold, or because the social license was revoked, and lumping these together creates a statistical category that is too noisy to be predictive.

  The ambiguity you hope to resolve is merely shifted to the criteria for inclusion in either the success or failure class. If a forecaster believes AI is imminent, they will argue that previous failures were due to fundamental physical limits that do not apply to software, thereby placing AI in the success class. If a forecaster believes AI is distant, they will argue that previous successes were unique historical anomalies or that the current hype cycle mirrors past bubbles, thereby placing AI in the failure class. Both can claim to be using your dual-class framework responsibly. The degrees of freedom have expanded because the forecaster now has two base rates to choose from, and the justification for choosing one over the other often relies on the very intuition the reference class was meant to correct. This does not discipline the forecast; it arms the forecaster with more statistical ammunition to defend their prior.

  True predictive discipline comes from decomposing the problem into causal models rather than relying on external similarity classes. Reference classes are useful heuristics when the underlying mechanisms are opaque, but they become dangerous when treated as substitutes for understanding why technologies develop at specific rates. A negative reference class of failed predictions is only useful if the reasons for those failures are structurally identical to the risks facing the current technology. Since AI development involves a mix of algorithmic breakthroughs, compute scaling, and alignment challenges, its failure modes are likely unique combinations of economic, technical, and safety constraints that do not map cleanly onto the history of fusion power or flying cars. Until you can define the boundary conditions of these classes using causal features rather than outcome labels, adding a negative class simply creates a more complex system for rationalizing intuition without reducing the uncertainty inherent in the prediction itself.
