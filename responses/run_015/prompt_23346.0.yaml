answer: |-
  The office smelled of ozone and old paper. Elias adjusted his loupe, the brass cold against his eye. Across the desk sat the client, a man whose merger depended on a certificate of *Trustworthiness*.

  "Standard stimulus," Elias said, sliding a contract across the polished wood. "Clause seven implies a benefit for breach. We need to see if you resist."

  The client hesitated. Elias watched the needle on the Resonance Meter. It spiked, then dropped to zero the moment the client's finger touched the pen.

  "Finked," Elias muttered. The disposition to be trustworthy had vanished the instant the test began. Like a wizard turning glass to steel the moment it is struck. The virtue wasn't there when it mattered.

  He reset the chamber. "Again."

  This time, the needle held steady in the green—*Disposition Present*—but the client didn't sign. He couldn't. The pen was glued to the desk.

  "Masked," Elias corrected. The virtue was intact, but something external blocked the manifestation. Like a fragile vase wrapped in bubble wrap.

  He ran it again. Finked. Again. Masked. The oscillation was perfect, maddening. Elias rubbed his temples. The Meter wasn't mechanical; it was empathic. It measured *his* capacity to distinguish interference from disappearance. It relied on *his* Discernment.

  He looked at the client, really looked at him, and saw the reflection of his own uncertainty.

  If his Discernment was masked, he possessed the skill but was currently blocked from using it. If it was finked, the skill evaporated the moment he tried to apply it.

  He tried to judge his own judgment. To check if the Discernment was real, he had to use it. But if using it destroyed it (fink), the test would fail. If something was blocking it (mask), the test would also fail.

  The needle swung wild. Fink. Mask. Fink. Mask.

  Elias put down the loupe. He couldn't certify the client because he couldn't certify himself. He sat in the silence, unable to tell if he was choosing to stop the test, or if the ability to choose had simply dissolved the moment he reached for it.

  "Come back tomorrow," Elias said, though he knew the result would be the same. The disposition to know was on the table, and it was no longer behaving like a fact. It was behaving like a question.
