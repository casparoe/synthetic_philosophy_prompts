answer: |-
  This is a classic debate in social science, philosophy, and ethics. Your cousin is arguing from **empirical observation and practical utility** (phenomenology), while her roommate is arguing from **logic and semantics** (analytic philosophy).

  Both are partially right, but they are using the word "character" to mean two different things. Here is the move-by-move breakdown, followed by the "missing piece" that resolves the tension.

  ### Move-by-Move Evaluation

  **(1) Cousin: "You can see patterns... like Seattle rain."**
  *   **Verdict:** **Mostly Right (on observation), Weak (on analogy).**
  *   **Why:** Cross-cultural psychology *does* confirm aggregate differences in behavior and personality traits between nations (e.g., average levels of extraversion or conscientiousness). However, the weather analogy is flawed. Rain is involuntary; human behavior is agentic. People *choose* to be reserved based on social cues, whereas clouds do not choose to rain.

  **(2) Roommate: "Ecological fallacy... country isn't a person... essentialism."**
  *   **Verdict:** **Clearly Right.**
  *   **Why:** She is logically correct. The "ecological fallacy" is the error of assuming that because a group has a trait, an individual in that group has it. A country is a political boundary, not a psychological entity. Attributing a "soul" or "character" to a state is a category error that historically leads to essentialism (the belief that these traits are inherent and unchangeable).

  **(3) Cousin: "Culture trains people... environment shapes average behavior."**
  *   **Verdict:** **Clearly Right.**
  *   **Why:** This is the standard sociological explanation. It isn't DNA; it's socialization. Norms, incentives, and child-rearing practices differ by region. If a culture punishes loudness, the *average* loudness decreases. This explains the mechanism without needing biology.

  **(4) Roommate: "If it's environment, why call it 'national character'?... Baby swap test."**
  *   **Verdict:** **Clearly Right.**
  *   **Why:** This is the strongest philosophical point. If a Tokyo baby raised in Rio acts Brazilian, the trait belongs to the *context*, not the *nation of origin*. Calling it "national character" implies the trait is attached to the people (portable), when the cousin just admitted it's attached to the environment (situational). The label misleads the listener.

  **(5) Cousin: "Pedantic about words... useful statistical generalization... line is allowing exceptions."**
  *   **Verdict:** **Mixed (Pragmatically Right, Logically Weak).**
  *   **Why:** She is right that ignoring cultural norms can lead to practical failures (in hiring, diplomacy, etc.). "Cultural Intelligence" is a real skill. However, her definition of the line ("allowing exceptions") is logically weak. Almost every racist stereotype allows for exceptions ("*Most* X are lazy, but not *all*"). The defense doesn't distinguish a useful generalization from a harmful prejudice.

  **(6) Roommate: "'Allow exceptions' applies to every stereotype... concept is incoherent."**
  *   **Verdict:** **Clearly Right.**
  *   **Why:** She exposes the dilemma. If the trait is in the person, it's essentialist (and often false). If the trait is in the culture, calling it "national character" is a misnomer. She correctly identifies that the cousin wants the *utility* of the stereotype without the *moral baggage*, but the logic doesn't hold up under scrutiny.

  ***

  ### Who "Won"?
  **The Roommate won on logic and definitions.** She successfully proved that the term "National Character" is incoherent if you define "character" as an internal, portable trait.
  **The Cousin won on phenomenology and utility.** She is correct that ignoring cross-cultural behavioral patterns makes you clueless in the real world.

  ### What They Are Both Missing
  They are stuck in a binary: either traits are **inherent/essential** (Cousin's implied fear) or they are **purely situational/contextual** (Roommate's insistence). They are missing the concept of **Institutional Affordances** and **Probabilistic Distributions.**

  Here is how "National Character" can be coherent without being essentialist:

  **1. It's not "Character," it's "Default Settings."**
  Think of culture like an operating system. A Japanese "OS" might have a default setting for "Silent Mode" in public spaces. A Brazilian "OS" might have a default setting for "High Connectivity."
  *   **Why this works:** It acknowledges the pattern (Cousin) without claiming the hardware (the person) is permanently altered (Roommate). If you install the Japanese OS on a Brazilian baby (raise her in Tokyo), she runs the program. But the "character" isn't in the baby; it's in the software she's running.
  *   **The Fix:** Drop the word "Character." Use **"Cultural Norms"** or **"Average Personality Profiles."**

  **2. The "Institutional" Missing Link.**
  Both argue about "culture" vaguely. They are missing that **institutions shape behavior.**
  *   In Japan, train systems are precise and crowded; silence is a functional necessity for public order.
  *   In Brazil, social life is often more street-oriented and communal; expressiveness facilitates interaction.
  *   **The Coherence:** People aren't "reserved"; they are adapting to a high-density, high-rule environment. If you call this "national character," you blame the people. If you call it "institutional adaptation," you understand the *why*.

  **3. The Statistical Reality (The Middle Ground).**
  Psychologists *do* measure national personality profiles (using the Big 5 traits). They find that nations have different **mean scores** and different **variances.**
  *   **Coherent Definition:** "National Character" is coherent *only* if defined as: *"The statistical distribution of behavioral tendencies within a specific geopolitical boundary at a specific time."*
  *   **The Catch:** It describes the **bell curve**, not the **dot.**
  *   **Why the Roommate is still wary:** Even accurate statistics become dangerous when used for **prediction.** Knowing the average height of Dutchmen doesn't tell you if *Jan* is tall. Using the average to predict the individual is where the "fallacy" lives.

  ### The Final Verdict for the Dinner Table
  Tell them this:
  > "The Roommate is right that **'National Character' is a bad label** because it implies the trait is inside the person. But the Cousin is right that **'Cultural Norms' are real data** that ignore at your peril.
  >
  > The concept is only coherent if you treat it like **weather** (Cousin's analogy), but acknowledge that unlike rain, humans can choose to carry an umbrella. It's a **probabilistic tendency**, not a destiny. If you use it to predict a *culture's* reaction, it's science. If you use it to predict an *individual's* behavior, it's prejudice."
