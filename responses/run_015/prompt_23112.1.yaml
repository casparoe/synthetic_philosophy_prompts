answer: |-
  You are completely right to be confused—population ethics is notorious for having slightly different definitions floating around depending on which philosopher you are reading. There isn't one single universal dictionary for "Moderate" vs. "Very," but based on the context of the **Mere Addition Paradox**, you are likely encountering one of two specific distinctions.

  Here is the breakdown of what those terms usually mean, why they differ, and why the Mere Addition argument is said to stop at one but not the other.

  ### 1. The Two Likely Distinctions

  When people talk about a "Moderate" vs. "Extreme/Very" version, they are usually distinguishing between **how much welfare is being traded** or **how bad the lives are**.

  #### Distinction A: The "Welfare Level" (Parfit vs. Arrhenius)
  This is the most common technical distinction in recent literature (championed by philosopher Gustaf Arrhenius).

  *   **The Standard Repugnant Conclusion (Parfit):** A world with a huge population of people whose lives are **barely worth living** (positive value, but very low) is better than a world with a smaller population of people with **excellent** lives.
  *   **The *Very* Repugnant Conclusion (Arrhenius):** A world with a huge population of people whose lives are **not worth living** (negative value/suffering) is better than a world with a smaller population of people with **excellent** lives.

  **Why the distinction matters:** The Standard RC is bad enough (a world of mediocrity beats a world of bliss). But the *Very* RC is worse because it implies that enough "zombies" in pain could outweigh a few happy people.

  #### Distinction B: The "Trade-Off" (Moderate Intuition vs. RC)
  Sometimes, "Moderate" refers to a view that accepts *some* quantity/quality trade-off, but not the *extreme* one.

  *   **Moderate Conclusion:** A larger population with **very good** lives is better than a smaller population with **excellent** lives. (e.g., 1 billion people at 90% happiness > 1 million people at 100% happiness). Most people find this intuitive.
  *   **Extreme Conclusion (The RC):** A larger population with **barely worth living** lives is better than a smaller population with **excellent** lives. (e.g., 1 trillion people at 1% happiness > 1 million people at 100% happiness). Most people find this repugnant.

  ---

  ### 2. The Mere Addition Paradox & Why It "Stops"

  You asked: *"Why do some people think the mere addition argument only gets you to that one [Moderate] and not the extreme version?"*

  To answer this, we have to look at how the **Mere Addition Paradox** works. It is designed as a slippery slope argument to force you into the Repugnant Conclusion.

  **The Steps:**
  1.  **World A:** 1 billion people, extremely happy.
  2.  **World A+:** World A + 1 billion new people. The new people have lives that are *good*, but not as good as the A people. (Crucially, their lives are still **positive**).
      *   *Premise:* A+ cannot be **worse** than A, because we just added happy people without hurting the originals.
  3.  **World B:** We redistribute resources in A+ to make everyone equal. The average happiness drops slightly, but the total happiness goes up.
      *   *Premise:* B is **better** than A+ (because equality is good, or total utility is higher).
  4.  **Conclusion:** Therefore, B is better than A.

  If you repeat this process (B to C, C to D...), you eventually get to **World Z**: A massive population with lives barely worth living. The paradox claims that if you accept the first step, you must accept the last step.

  #### Why some say it only leads to the "Moderate" version:

  **Reason 1: The "Positive Welfare" Limit (Addressing Distinction A)**
  The Mere Addition argument *only* works by adding people with **positive** welfare (lives worth living).
  *   It can logically slide you down to "barely worth living" (The Standard RC).
  *   It **cannot** logically slide you into "lives not worth living/suffering" (The *Very* RC).
  *   **Why?** Because the first premise ("Adding people doesn't make things worse") becomes false if you add people whose lives are miserable. Adding suffering people *does* make the world worse. Therefore, the Mere Addition argument breaks before it reaches the *Very* Repugnant Conclusion. You need a different ethical theory (like pure Total Utilitarianism with no zero-point) to get to the *Very* version.

  **Reason 2: Blocking the Slope (Addressing Distinction B)**
  Many philosophers argue that the Mere Addition Paradox is a fallacy of **vagueness**.
  *   They argue you can accept the **Moderate** steps (A is comparable to B, B is comparable to C) without accepting the **Extreme** conclusion (A is worse than Z).
  *   **The Lexical View:** Some argue there is a "lexical threshold." A life of *true excellence* contains a value that cannot be outweighed by *any* amount of mediocre lives.
  *   Under this view, the Mere Addition argument works fine for the first few steps (Moderate trade-offs between high-quality lives), but the logic snaps once the quality of life drops below a certain threshold. You can accept that "More happy people is good" without accepting "More miserable people is better."

  ### Summary

  *   **The Basic Idea (Standard RC):** Huge population with **barely positive** lives > Small population with **great** lives.
  *   **The "Very" Version:** Huge population with **negative/suffering** lives > Small population with **great** lives.
  *   **The "Moderate" Version:** Either refers to the Standard RC (as opposed to the Very one), OR it refers to the intuition that **some** trade-off is okay (large/good > small/great), just not the **extreme** trade-off (large/barely > small/great).

  **Why Mere Addition stops short:**
  The Mere Addition argument relies on adding people who are *happy enough that their existence is a net positive*. It can push you to the conclusion that "barely worth living" lives outweigh great lives (Standard RC), but it **cannot** push you to the conclusion that "suffering" lives outweigh great lives (Very RC), because adding suffering people violates the argument's own starting premises.

  Furthermore, if you believe in a **lexical threshold** (that quality matters infinitely more than quantity after a certain point), you can accept the early steps of Mere Addition (Moderate) while rejecting the final destination (Extreme).
