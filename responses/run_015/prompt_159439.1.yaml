answer: |-
  You have identified the central tension in inheritance taxation: the conflict between *equality of opportunity* (taxing advantage) and *liberty of association* (respecting family plans and continuity). Your draft principle is strong, but as you noted, it is incomplete. It functions well as a heuristic but fails as a rigorous rule because it relies on undefined boundaries (what counts as "competitive"? what counts as "form of life"?).

  Below are three candidate principles derived from your verdicts. I have formalized your draft as Principle 1, then offered two alternatives that attempt to resolve the outliers (Cases 4, 5, and 8). Following that, I apply them to your unsettled cases and identify the verdicts you must likely abandon to maintain coherence.

  ### Candidate Principle 1: The Competitive Integrity Principle
  *This is your draft principle, formalized. It prioritizes the recipient's starting position in the social competition.*

  **Clause 1 (The Base):** All transfers of wealth at death are presumptively taxable as unearned accretions to the recipient's power.
  *(Motivated by Case 1: Index funds are pure power without labor.)*

  **Clause 2 (The Continuity Exemption):** Transfers are exempt to the extent the asset is illiquid, integral to a trade the heir has already practiced, and taxation would force the cessation of that trade.
  *(Motivated by Case 2 & 3a: The farm and the active son. The tax yields to the "form of life.")*

  **Clause 3 (The Necessity Exemption):** Transfers are exempt to the extent they are required to meet basic care needs arising from incapacity, regardless of sum.
  *(Motivated by Case 6: The disabled heir. Money here is not advantage, it is functioning.)*

  **Clause 4 (The Anti-Dynasty Surcharge):** Transfers structured to persist beyond the lifetime of the immediate recipient (e.g., perpetual trusts) are taxed at a higher rate than outright bequests.
  *(Motivated by Case 7: Dynasties compound advantage across generations.)*

  **Where it Breaks:**
  *   **Case 5 (Tainted Wealth):** This principle cannot explain why tainted wealth is taxed *harder*. If the heir gains no more "competitive advantage" from tainted money than clean money, Clause 1 treats them equally. You need a moral surcharge this principle doesn't contain.
  *   **Case 8 (Non-Financial Advantage):** If the goal is neutralizing competitive advantage, a good school district is a larger advantage than index funds. Excluding them (Clause 1's scope) is an arbitrary boundary unless you admit the tax is only about *financial* liquidity, not advantage.
  *   **Case 4 (Inter Vivos):** If the goal is competitive advantage, school fees paid during life are worse than bequests (they compound longer). Excluding them contradicts Clause 1.

  ### Candidate Principle 2: The Productive Stewardship Principle
  *This principle shifts focus from the recipient's advantage to the asset's social function. It asks: "Does this transfer maintain or dissolve productive capacity?"*

  **Clause 1 (The Base):** Transfers of liquid financial capital are taxed at a high standard rate.
  *(Motivated by Case 1: Index funds are passive capital.)*

  **Clause 2 (The Stewardship Exemption):** Transfers of operating assets (businesses, farms) are taxed lightly if the heir has demonstrable prior involvement and intends to maintain operations.
  *(Motivated by Case 3: The active son vs. the flipper. The flipper dissolves the function; the son sustains it.)*

  **Clause 3 (The Restitution Surcharge):** Transfers traceable to sources deemed socially harmful (even if legal at the time) incur a punitive surcharge, payable to a public remediation fund.
  *(Motivated by Case 5: This handles the "tainted" intuition by framing it as restitution, not inheritance tax proper.)*

  **Clause 4 (The Care Exemption):** Assets designated exclusively for medical or custodial care of the recipient are exempt.
  *(Motivated by Case 6.)*

  **Where it Breaks:**
  *   **Case 7 (Dynasty Trusts):** A trust can hold operating assets. This principle might accidentally protect a dynasty trust if it holds a family business, whereas your intuition says the *trust structure* itself is the problem.
  *   **Case 8 (Non-Financial):** Like Principle 1, this ignores social capital.
  *   **Case 4 (Inter Vivos):** This principle is silent on timing. It treats a gift today the same as a bequest tomorrow, which conflicts with your unease about taxing school fees.

  ### Candidate Principle 3: The Moral Desert Principle
  *This principle focuses on the moral relationship between the heir and the wealth. It asks: "Did the heir earn this, or did they merely receive it?"*

  **Clause 1 (The Base):** All wealth not generated by the recipient's labor is taxable.
  *(Motivated by Case 1.)*

  **Clause 2 (The Labor-Integration Exemption:** Wealth is exempt if the recipient's labor is inextricably linked to the asset's value generation prior to transfer.
  *(Motivated by Case 3a: The son who ran sales. He partly earned it.)*

  **Clause 3 (The Moral Hazard Surcharge):** Wealth derived from activities now condemned carries a higher tax liability to prevent the laundering of moral reputation across generations.
  *(Motivated by Case 5.)*

  **Clause 4 (The Private Sphere Exclusion):** Transfers of non-financial social capital (networks, residence, education) are outside the jurisdiction of tax law.
  *(Motivated by Case 8: This makes the exclusion a matter of jurisdictional limit, not logical consistency.)*

  **Where it Breaks:**
  *   **Case 2 (The Farm):** The cousin may not have "earned" the farm's value through labor, only worked *on* it. If the land value is speculative, Clause 2 fails to protect her.
  *   **Case 6 (Disability):** The disabled heir didn't labor. This principle would tax them heavily unless you add a "Need" clause, which shifts the logic from Desert to Need.
  *   **Case 4 (Inter Vivos):** Again, fails to distinguish between death transfers and lifetime gifts.

  ---

  ### Predictions for Unsettled Cases

  Here is how **Principle 1 (Competitive Integrity)**, which is your strongest baseline, predicts outcomes for your unresolved scenarios.

  **1. The Siblings (Surgeon vs. Care Worker)**
  *   **Prediction:** Tax them equally.
  *   **Reasoning:** Principle 1 taxes the *transfer*, not the *recipient's total wealth*. The competitive advantage conferred by $5M is the same regardless of whether the heir is rich or poor. The surgeon has a high income, but the care worker has a low one; however, the *inheritance* gives both the same capital power.
  *   **Conflict:** This contradicts your instinct to tax based on what they "already have." To accommodate that, you would need to means-test inheritance, which creates high administrative complexity and privacy intrusions.

  **2. The Endowed Mathematician**
  *   **Prediction:** Low or Zero Tax.
  *   **Reasoning:** This falls under Clause 2 (Continuity Exemption). If the endowment is structured to allow a "form of life" (research) that the recipient is already committed to, it is treated like the dairy farm. It is not being used for competitive aggrandizement (consulting wealth) but for functional continuity (research).
  *   **Conflict:** If the mathematician is young and has not yet established the "form of life," Principle 1 taxes it hard. Your intuition wavers here because it looks like a "gift of freedom" (good) but also "unearned privilege" (bad).

  **3. Age of Recipient (70 vs. 25)**
  *   **Prediction:** Tax the 25-year-old harder; tax the 70-year-old lighter.
  *   **Reasoning:** Competitive advantage is most potent at the starting line. $5M at 25 alters life trajectory (education, home, risk-taking). $5M at 70 is largely consumption or estate planning. Principle 1 tracks "opportunity," so age matters.
  *   **Conflict:** Most tax systems are age-blind. Implementing this requires age-bracketed rates.

  ---

  ### The Honest Assessment: What You Must Give Up

  You cannot hold all eight verdicts simultaneously without contradiction. To vote on a principle, you must sacrifice the intuitions that break the logic. Here is the triage:

  **1. You must abandon Case 4 (Inter Vivos School Fees).**
  *   **Why:** If your principle is "tax unearned competitive advantage" (Case 1), then paying private school fees is a *greater* advantage than a bequest. It compounds over 12 years.
  *   **The Sacrifice:** You must either accept taxing inter vivos educational transfers (politically difficult) or admit your principle is not about "advantage" but about "death transfers" specifically. If you choose the latter, you concede that the tax is a *probate fee* on liquidity, not a correction of inequality.
  *   **Recommendation:** Accept that this tax cannot touch inter vivos gifts without becoming a wealth tax. Mark Case 4 as "outside scope of this instrument."

  **2. You must abandon Case 8 (Non-Financial Advantages).**
  *   **Why:** You cannot tax school districts or professional networks without a surveillance state.
  *   **The Sacrifice:** You must accept that this tax will only be a *partial* equalizer. It addresses financial capital but leaves social capital untouched.
  *   **Recommendation:** Formalize this as a "Jurisdictional Limit" (as in Principle 3, Clause 4). Do not pretend the tax fixes opportunity fully; it only fixes financial opportunity.

  **3. You must resolve Case 5 (Tainted Wealth) separately.**
  *   **Why:** Inheritance tax is the wrong tool for moral restitution. If the wealth is "condemned wrong," the state should have seized it when the wrong was discovered, or the heir should be liable for restitution, not a higher tax rate.
  *   **The Sacrifice:** Drop the idea that inheritance tax rates should vary based on moral source. It makes the tax code a moral court.
  *   **Recommendation:** Treat Case 5 as a legal clawback issue, not a tax rate issue. If the law allows the heir to keep it, tax it at the standard rate. If it is ill-gotten, confiscate it entirely. Do not split the difference with a "higher tax."

  **4. You must decide on the Siblings (Means-Testing).**
  *   **Why:** Your wavering here is the difference between a **Transfer Tax** (tax the money moving) and an **Accessions Tax** (tax the person receiving).
  *   **The Sacrifice:** If you want to tax the care worker less, you must adopt an Accessions Tax model (tracking lifetime receipts). This is administratively heavy.
  *   **Recommendation:** Stick to the Transfer Tax (tax the money equally). It is cleaner. Use the revenue to fund social services that help the care worker, rather than tweaking the inheritance rate.

  ### Final Recommendation for the Commission

  Adopt **Principle 1 (Competitive Integrity)** with the following explicit amendments to handle your breaks:

  1.  **Define "Competitive Advantage" as "Liquid Financial Capital."** This explicitly excludes Case 8 (neighborhoods/networks) not because they aren't advantages, but because they are non-taxable.
  2.  **Define "Form of Life" narrowly.** It applies only to illiquid operating assets (farms, private firms) where the heir has 5+ years of prior labor. This handles Case 2 and 3 without opening the door to vague exemptions.
  3.  **Explicitly Exclude Inter Vivos Transfers.** Acknowledge this limits the tax's ability to fix inequality (Case 4), but preserves administrability.
  4.  **Ignore Moral Source (Case 5).** Treat all legal wealth equally. Moral condemnation belongs in criminal or civil forfeiture law, not the tax code.

  This leaves you with a coherent, defensible position: **"We tax liquid wealth transfers at death to prevent the entrenchment of financial aristocracy, but we exempt assets that represent continued labor and productive capacity."** It is not perfect, but it is principled.
