answer: |-
  **Question**

  Do the derogatory content, speaker-commitment, and hearer-imposition associated with slurs project independently across embedding environments and social contexts? Current debates assume these forces move together. This project tests the hypothesis that they dissociate: derogation may vanish under negation while commitment persists; imposition may remain in reported speech even when speaker-commitment is cancelled. The question is determinate: either the three components exhibit distinct projection profiles across a fixed battery of linguistic environments, or they do not. If they dissociate, monolithic semantic accounts fail. If they project uniformly, the tripartite distinction is unnecessary. This moves the debate from "what is the meaning" to "how do the components behave," offering a diagnostic tool to evaluate competing semantic-pragmatic theories against specific linguistic data rather than general intuitions about offensiveness. The outcome is binary enough to settle the theoretical utility of the split, providing a clear yes-or-no answer to whether the three-way distinction tracks reality or merely complicates it.

  **Why It's Still Open**

  Existing positions treat slur force as a monolith. Prohibitionism argues slurs are merely forbidden, ignoring how they function in reported speech or conditionals. Expressivism claims they express attitude, but struggles to explain why some embeddings cancel the attitude without cancelling the word's presence. Descriptivist hybrids add content but often conflate the speaker's ideology with the truth-conditions. These views leave the data open because they predict uniform behavior: if the word is offensive, it should be offensive everywhere, or if it's content, it should behave like content everywhere.

  My three-way split is not mere relabelling because it predicts dissociation. Standard views cannot easily explain why a reclaimed slur drops derogation but retains imposition, or why a slur in a conditional commits the speaker to a hypothesis without imposing the same harm as an assertion. By separating what is said (derogation), who is revealed (commitment), and what is done to the hearer (imposition), this project isolates variables that current theories conflate. If these components track differently across embeddings, existing theories lack the granularity to account for the data. If they track together, the split is redundant. This specificity forces a resolution that general debates about content versus force avoid, turning a stalemate into a testable empirical claim about linguistic behavior.

  **What I'd Do, Month by Month**

  Month one constructs the matrix. I will select five diagnostic embedding environments: negation, yes/no questions, conditionals, attitude verbs, and reported speech. These are chosen because they stress-test different semantic layers: negation targets truth conditions, conditionals test speaker commitment, and reported speech isolates imposition from endorsement. These will be crossed with four social configurations: out-group usage, in-group reclaimed usage, non-comprehending speaker, and fictional utterance. I will also include a variable for contested target classes versus uncontested ones. This yields a structured set of core cases. I will not use corpus work; context in corpora is too noisy to isolate imposition effects reliably, and orthographic filtering often hides the data entirely. Full experimental philosophy is too slow for three months and risks reducing nuanced philosophical categories to Likert scales. Instead, I will use structured armchair construction validated by targeted consultation with five colleagues specializing in semantics and social philosophy. This beats broad surveys because we need nuanced judgments about commitment versus imposition, which lay speakers may not distinguish without prompting.

  Month two tests the cells. I will draft minimal pairs for each case, isolating the three components. For example, does "If he is a [slur], we should stop him" commit the speaker to the ideology? Does it impose on the hearer? I will record judgments on whether each component survives. I will specifically look for the reclaimed anomaly where derogation fades but imposition remains. I will refine the cases iteratively with consultants to ensure the intuitions are stable and not artifacts of phrasing. If consultations reveal too much variance, I will narrow the social configurations to just in-group versus out-group to ensure completion. Month three is writing. I will analyze patterns: if commitment survives negation but imposition does not, that supports the split. The instrument is right because it targets the precise failure points of current theories while controlling for the social variables that complicate them. It is manageable because it limits the scope to diagnostic cases rather than exhaustive coverage. The focus on contested groups adds a necessary stress test: if the triad holds even when the target group is disputed, the semantic claim is robust. This approach ensures the data is philosophically clean enough to support theoretical conclusions within the word limit.

  **Deliverable**

  The 4000 words will form a tight argumentative paper, not a technical report. For a reader outside the project, it will read as a solution to a puzzle: why do slurs behave strangely in conditionals or quoted speech? It will present the tripartite distinction as the only way to save the data from contradiction. The paper will define the three components, display the projection matrix results, and argue that any theory ignoring this dissociation fails. It will conclude with implications for how we regulate speech: if imposition survives where commitment does not, policy focused on speaker intent may miss the actual harm.

  **What Would Make Me Drop It**

  The project fails if the three components always project together; if derogation, commitment, and imposition rise and fall in unison across all embeddings, the split is ontologically wasteful. The most likely failure point is imposition: it is the hardest to define independently of hearer psychology. If imposition turns out to be just a causal effect of hearing the word rather than a semantic-pragmatic feature, the triad collapses.

  I would drop the split if a unified pragmatic account, such as a sophisticated conventional implicature theory, could explain the dissociation without positing three distinct components. If one mechanism explains the data more parsimoniously, the triad is unnecessary. I would also abandon the contested group variable if it shows no differential effect compared to uncontested slurs. My reasoning is on thinnest ice regarding imposition. Distinguishing what an utterance does to a hearer from how a hearer feels is philosophically precarious. If I cannot operationalize imposition without relying on subjective offense reports, the distinction loses its theoretical bite.
