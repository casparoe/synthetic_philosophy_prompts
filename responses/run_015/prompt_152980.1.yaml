  *   Disagreement ($d$): A=$10k, B=$20k, C=$0.
  *   Ideal Points ($u$): A=$120k, B=$80k, C=$30k.
  *   Ranges ($u-d$): A=$110k, B=$60k, C=$30k.
  *   Total Pie: $180k.
  *   Surplus Available: $180k - ($10k + $20k + $0) = $150k.
  *   Total Range: $110k + $60k + $30k = $200k.

  **Prediction under Rule 1 (Kalai-Smorodinsky):**
  The solution equalizes the ratio of actual gain to potential range ($\lambda$).
  $\lambda = \text{Total Surplus} / \text{Total Range} = 150 / 200 = 0.75$.
  *   **C's Share:** $0 + (0.75 \times 30) = \mathbf{\$22.5k}$.
  *   **A's Share:** $10 + (0.75 \times 110) = \mathbf{\$92.5k}$.
