  Based on the four verdicts you've described, Dr. Voss is not using a Nash bargaining solution; she is running the **Kalai-Smorodinsky (KS) solution**. The smoking gun is Case 4. In standard Nash bargaining, the outcome depends only on the disagreement point and the shape of the feasible set. Changing Partner B's solo maximum (the ideal point) without changing the joint pie or the fallback position should not alter the Nash split. Dr. Voss explicitly changed the outcome based on the shift in the ideal point. That is the defining axiom of Kalai-Smorodinsky: individual monotonicity with respect to the ideal point.

  Here are the two competing rules that fit her first four verdicts, their predictions for your three-party case, and my commitment to her actual ruling.

  ### Competing Rule 1: Kalai-Smorodinsky (Aspiration Ray)
  This rule finds the unique efficient outcome where every player achieves the same proportion of their maximum possible gain (their range). It draws a straight line from the disagreement point to the ideal point vector and finds where that line hits the feasible frontier.
  *   **Fit to Verdicts:** Perfect. It explains the symmetry in Case 1, the range-proportional surplus in Case 2, the locked ratios during pie expansion in Case 3, and the sensitivity to the ideal point shift in Case 4.
  *   **Treatment of Veto:** It treats the veto as a standard feasibility constraint. If the solution generated by the aspiration ray satisfies the constraint, the constraint is ignored. It does not grant the vetoing party more than their aspiration proportion just because they hold a license.

  ### Competing Rule 2: Constrained Equal Claims (Veto-First)
  This rule treats the veto threshold as a prior claim that must be satisfied before any surplus division occurs. It deducts the veto amount from the joint pie, then distributes the remaining surplus between the other parties based on their aspiration ranges.
  *   **Fit to Verdicts:** Strong. It produces identical results to KS in Cases 1–3 because there were no minimum constraints. It also fits Case 4 if you interpret the "range" as the claim size; when B's claim shrinks, their share of the remaining surplus shrinks.
  *   **Treatment of Veto:** It treats the veto as a fixed deduction. Partner C gets exactly $15k (the floor), and A and B split the rest according to their ranges. This protects A and B from C's higher aspiration if the aspiration exceeds the veto floor.

  ### Predictions for the New Case
