  *   **C's Share:** Fixed at $\mathbf{\$15k}$.
  *   **Remaining Surplus:** $150k - 15k = 135k$.
  *   **A & B Split:** Divided by their range ratio (110:60).
  *   **A's Share:** $10 + (135 \times \frac{110}{170}) \approx \mathbf{\$97.35k}$.
