      *(Self-Correction on the "Premeditation" point)*: I need to be careful. Camus says "most premeditated." But his *example* adds the element of *notification*. A hitman plans (premeditates) but doesn't tell the victim. The State plans *and* tells. That is the crucial distinction. I must emphasize the *notification* aspect.

