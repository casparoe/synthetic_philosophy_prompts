      *   *Section 3: The Cold-Blooded Counterfactual.* Address the user's specific worry about calculated murderers. Explain why the "warning" condition still saves Camus's argument. Private killers want success/escape; the state wants ritual.
      *   *Section 4: Vulnerabilities.* Where would a proponent attack? (Definition of murder, focus on the victim, necessity vs. morality).
