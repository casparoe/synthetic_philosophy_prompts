answer: |-
  Good afternoon.

  Look up at the ridge. For thirty years, that skyline has been a question mark for the people living beneath it. For many of you in this marquee, it has been a workplace, a puzzle, a career. Today, the last cask goes down. The shaft will be backfilled. The machinery comes out. What goes back in is earth.

  We are here to mark the end of construction, and the beginning of a much longer wait.

  Those of you who have spent the last decade arguing over semiotics and linguistics know the peculiar headache of this project. We are trying to send a message to people ten thousand years hence. We share no language with them. We cannot picture their gods, their governments, or their curiosities. We cannot even be certain they will be human in the way we understand it.

  For a long time, the panel I chaired operated under a specific assumption. We assumed our job was to maximise the chance of being understood. We looked for the right pictograms, the right level of strangeness, the right redundancy. We wanted accuracy.

  But accuracy is fragile. Meaning is perishable. A word changes sense in a century; a symbol changes meaning in a millennium. If we bet on them reading us correctly, we are betting on luck.

  So, we changed the target.

  There is a concept in engineering about machines that replicate themselves. To do it, the machine needs a description of itself. It uses that description twice. First, it reads the instructions to build the offspring. Second, it copies the description without reading it at all, just handing it over to the next generation. The part that gets used changes; the part that gets copied remains intact. The thing that survives longest is the thing that is never opened.

  We have applied that logic to the marker.

  We have stopped trying to ensure the future knows exactly what this is. Instead, we are ensuring that it doesn't matter if they get it wrong. We are designing for robustness to misreading.

  If they think this is a tomb, they will not dig. If they think it is a temple, they will not dig. If they think it is a curse, or a monument to a forgotten king, or a hoax—they still will not dig. We are not optimising for truth. We are optimising for survivable misunderstanding. The physical form—the granite, the earthworks, the shape of the ridge—must do the work that the words cannot. The durability lies in the thing that doesn't need to be read.

  This brings me to the two hundred workers whose jobs finish today.

  It is a rare thing to build something whose entire value is that it is never used. In most trades, success is a bridge that carries traffic, a power station that turns, a house that is lived in. Your success is silence. Your success is nothing happening.

  That is a hard thing to measure. It is a hard thing to explain at a dinner party. But do not mistake "nothing happening" for "nothing done." You have constructed a constraint. You have built a boundary that must hold when your names are dust. You have made sure that a specific future does not occur. That is a negative capability, but it is a real one. You are leaving a hole in the world where a disaster might have been.

  And to the neighbours, the farmers, the families who have watched this site for thirty years: I know the suspicion has been quiet, but it has been steady. It would be dishonest of me to stand here and tell you that your worries were irrational. They were not. When you are asked to host a problem for ten thousand years, suspicion is the only rational response. Certainty is not available to us. We are guessing about people we cannot picture.

  But here is what we can offer. We are not asking you to trust that we are right. We are asking you to note that we have designed for the possibility that we are wrong. Even if our message fails, the structure should hold. Even if their interpretation fails, the consequence should be safe. We have tried to build a system that survives our own ignorance.

  In a few moments, the shaft will close. The above-ground work will begin in earnest. The engineers will pack up. The semioticians will go back to their universities. The earth will take over.

  We are handing this over to geology now. We are handing it over to time. We cannot know if the message will be read. We cannot know if the markers will stand. We can only know that we have tried to make sure that if they are misunderstood, it will not kill anyone.

  That is the best we can do. It has to be enough.

  Thank you.
