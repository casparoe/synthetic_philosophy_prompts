answer: |-
  You have correctly identified that the word "original" is doing too much work. It is conflating **ontological uniqueness** (there is only one) with **institutional authority** (we agree to trust this one).

  There is no single English noun that perfectly captures this entire pattern across software, manufacturing, and art. However, in analytic philosophy and archival science, this structure is well-mapped. It is the intersection of **Status Functions**, **Cambridge Properties**, and **Canonicality**.

  Here is the carving of the concept you are looking for.

  ### 1. The Mechanism: Status Functions
  The specific philosophical mechanism you are describing is what John Searle calls a **Status Function**.

  A status function is a property imposed on an object not by its physics, but by collective intentionality. It follows the formula: *$X$ counts as $Y$ in context $C$.*
  *   **Git:** This repository ($X$) counts as Upstream ($Y$) in the context of the Community ($C$).
  *   **Money:** This paper ($X$) counts as Legal Tender ($Y$) in the context of the State ($C$).
  *   **Presidency:** This person ($X$) counts as President ($Y$) in the context of the Constitution ($C$).

  When the "original" repo is deleted and the fork takes its place, no bytes change. What changes is the **collective intentionality** of the community. The status function has been reassigned. This is why it feels like a "shift" without ceremony: Status functions are inherently transferable roles, unlike physical properties.

  ### 2. The Logic of Change: Cambridge Properties
  You noted: *"If the 'original' gets deleted the fork just becomes the 'original' without any ceremony."*

  In logic, this is a **Cambridge Property** (named after philosopher Peter Geach). A Cambridge property is a relational property that can change for an object without the object itself undergoing any physical change.
  *   **Example:** "Being the tallest building." If a taller building is demolished, you become the tallest without growing a single inch.
  *   **Your Pattern:** "Being the Canonical Repo." If the upstream is deleted, your fork becomes Canonical without a single bit flipping.

  This explains why "original" feels unstable in your examples. It is not an intrinsic property (like mass or hash); it is a Cambridge property dependent on the state of the *rest of the system*.

  ### 3. The Distinction: Canonicality vs. Authenticity
  You are sensing a friction because "original" is being used to describe two orthogonal dimensions. To speak precisely, you must split the term:

  **A. Authenticity (The Art/Forgery Case)**
  *   **Definition:** Causal history of production.
  *   **Property:** Intrinsic/Historical.
  *   **Transferable?** No.
  *   **Analysis:** In your forgery example, the fake is the "original of the fake lineage." This is true, but it is not the "Original Work." In philosophy of art (specifically Nelson Goodman's *Languages of Art*), this is the distinction between **Autographic** arts (painting, where history matters) and **Allographic** arts (music/code, where notation matters).
  *   **Why it feels weird:** A forgery is an *original object* but a *derivative work*. It has **Primacy** (it was the first fake made) but lacks **Authenticity** (it does not descend from the artist's intent).

  **B. Canonicality (The Git/Build Case)**
  *   **Definition:** Designated authority within a system.
  *   **Property:** Extrinsic/Social.
  *   **Transferable?** Yes.
  *   **Analysis:** In reproducible builds and Git, the medium is Allographic. The bits don't matter; the *designation* matters. The "original" binary is simply the **Canonical Instance**.
  *   **The Shift:** When the canonical instance is lost, a new instance is **Elevated** to Canonical status. This is not metaphysics; it is administration.

  ### 4. The Historical Precedent: The "Copy-Text"
  You mentioned you couldn't find a name for this. In **Textual Criticism** (the study of manuscripts), this exact problem was solved 70 years ago.

  When the original manuscript (the "autograph") of a book is lost, scholars must choose a surviving copy to serve as the base for new editions. They call this the **"Copy-Text."**
  *   The Copy-Text is physically a copy.
  *   Functionally, it becomes the "Original" for all future scholarly work.
  *   If a *better* copy is found later, the Copy-Text status shifts to the new witness.

  This is the exact structural ancestor of the Git "fork becoming upstream." The term you might be looking for in a historical context is **"Witness Elevation"** or **"Textual Succession."**

  ### Summary of the Concept
  The pattern is **Institutional Originality**.

  It is defined by three boundaries:
  1.  **It is a Status Function:** It exists only because a community agrees to treat it as such (Upstream, Trusted Build).
  2.  **It is a Cambridge Property:** The object does not change when it gains or loses this status; the context changes.
  3.  **It is Orthogonal to Authenticity:** An object can be Authentic but not Canonical (a local build), or Canonical but not Authentic (a fork that drifted, or a forgery that becomes the only surviving reference).

  ### Recommendation for Vocabulary
  Stop using "Original." It carries too much metaphysical baggage about "firstness." Instead, use:

  *   **For Git/Code:** Use **"Upstream"** or **"Canonical"**. This acknowledges the status is social and transferable.
  *   **For Builds:** Use **"Trusted Artifact"**. This acknowledges the status is based on process, not bits.
  *   **For Art/Lineage:** Use **"Primacy"** (first in time) vs. **"Authenticity"** (correct causal chain).

  The word you want is **"Canonical."** It captures the authority without implying the ontological uniqueness that "Original" falsely suggests.
