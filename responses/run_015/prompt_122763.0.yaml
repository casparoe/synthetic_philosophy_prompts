          *   *ML Translation:* You can't reduce model behavior/interpretability purely to weight inspection. You need a higher-level abstraction (e.g., circuits, features) that is invariant across weight permutations. "Bridge laws" fail because the mapping from weights to features is many-to-one and non-linear.
