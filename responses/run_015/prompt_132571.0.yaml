  *   **Contested:** It is *not* settled whether acknowledging rules as practices provides sufficient *epistemic justification*. Sceptics maintain that stopping the regress is not the same as providing a foundation. This response distinguishes the formal failure of Carroll's regress (settled) from the deeper epistemic worry about rule-following (contested).

