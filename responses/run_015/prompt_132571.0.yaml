  ### 3. Uncertainty and Evidence

  **Least Certain Term:** Component (2) — *The efficacy of tacit-competence accounts.*

  **Why:** This is the pivot point between a resolved paradox and a restated sceptical problem. If 'grasping a rule' is merely a disposition, it is difficult to explain why one *ought* to follow it rather than simply describing that one *does*. This is the core of Kripke's sceptical paradox.

  **Evidence That Would Shift It:**
  *   **Shift Up (Higher Credence):** A robust naturalistic account of normativity that successfully reduces 'ought' to 'is' without losing the normative force (e.g., a successful teleosemantic theory of logical content).
  *   **Shift Down (Lower Credence):** A decisive demonstration that all dispositional accounts of rule-following are vulnerable to the 'quus' objection (where a rule is misinterpreted in infinite possible ways), implying that tacit grasp cannot fix meaning.

