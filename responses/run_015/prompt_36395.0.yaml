      *   *Refining the "Auxiliary Premise" point:* I need to be careful here. Is it auxiliary? In logic, a premise is a premise. But Gettier presents it as a conceptual truth. If the user calls it "auxiliary," they might imply it's external to the concept of justification. Gettier says "in that sense of 'justified'..." implying it's internal. I should correct this framing.
      *   *Refining Case I:* If Smith believed (e) directly, would he be justified? The text says he "infers." If he didn't infer, he wouldn't have justification for (e) based on the evidence he has (which is about Jones). So the deduction is essential for the *justification* of the belief, not just the belief itself.
      *   *Refining Case II:* The disjunction is crucial because of the logic of "Or." False OR True = True. This allows the belief to be True even though the justified premise was False. Randomness isolates the truth maker.
      *   *Refining "Show":* Gettier assumes the points are true. So he thinks he *shows* it. But logically, it's modus tollens. If JTB -> Knowledge, and (JTB + No Knowledge), then ~(JTB -> Knowledge). The "No Knowledge" part relies on the intuition that luck isn't knowledge. The "JTB" part relies on the transmission principle.

