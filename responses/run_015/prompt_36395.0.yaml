      *   *Verdict:* The case *as constructed* depends on it. Could a *similar* case work without it? Maybe, but *this* case uses the deduction to secure the justification for the true belief.

  5.  **Address Question 3: Case II and the Disjunction/Randomness.**
      *   *Textual Evidence:* Smith is justified in believing (f) "Jones owns a Ford." He infers (g) "Jones owns a Ford or Brown is in Boston." He also infers (h) and (i) with other locations.
