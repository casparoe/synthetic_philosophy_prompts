answer: |-
  Dear colleague,

  I have been thinking about your request for a diagnostic decision tree for the second-year seminar, and I have sketched out the logical space on paper to ensure we capture the major theoretical commitments without forcing students to learn the labels before they understand the problems. The goal is to let their intuitions about specific cases drive them toward the theory they are implicitly committed to. I have settled on a structure that uses six branch nodes to arrive at seven distinct leaves, drawing primarily on the cases of the sterilised sweet, the glass walkway, the pre-linguistic infant, and the chemically blocked fear response, while using the music and mood cases to handle the question of intentionality.

  We begin at the root with the question of intentionality, using the contrast between being moved by a piece of instrumental music and experiencing a mood with no object at all. We ask the student whether they believe the feeling directed at the music counts as an emotion in the same sense as the mood, or whether an emotion must have a specific object like a person or a threat. If they say an emotion does not require an object, they are directed to the first leaf, which we label Non-Intentionalism, with the awkward commitment that this position cannot easily distinguish emotions from mere bodily sensations or undirected moods. If they insist an object is required, we move to the second node, which tests the somatic requirement using the case of fear in someone whose bodily feelings are chemically blocked. Here we ask if the person still feels fear despite the lack of physiological feedback. If the student says no, they are committed to a somatic theory and we branch left; if they say yes, they are committed to a non-somatic theory and we branch right.

  Following the non-somatic branch first, we arrive at the third node, which concerns conceptual capacity, using the case of distress in a pre-linguistic infant. We ask whether the infant is capable of having a full-blooded emotion without possessing the concepts required to describe it. If the student says no, concepts are required, and we move to the fourth node; if they say yes, concepts are not required, they land on the second leaf, labelled Central Physiological Theory, with the awkward commitment that it struggles to explain the qualitative difference between distinct emotions like anger and fear without recourse to cognition. Returning to the path where concepts are required, the fourth node tests for recalcitrance using the glass walkway case and the anger case where the target is found innocent. We ask whether the emotion can persist even when the subject judges the situation to be safe or the person to be innocent. If they say no, belief overrides emotion, they reach the third leaf, labelled Cognitive Judgementalism, with the awkward commitment that it must classify all phobias and recalcitrant emotions as irrational mistakes or non-emotions. If they say yes, emotion persists despite belief, they reach the fourth leaf, labelled Perceptual Theory, with the awkward commitment that it struggles to locate the perceptual organ capable of sensing values like danger or offence.

  Now we return to the somatic branch from the second node, where the student believes bodily feelings are necessary. We arrive at the fifth node, which again tests conceptual capacity using the infant case. If they say concepts are not required for the infant's distress, they reach the fifth leaf, labelled James-Lange Theory, with the awkward commitment that it makes emotion too late to be useful for survival since the feeling follows the bodily reaction. If they say concepts are required, we move to the sixth and final node, which again tests for recalcitrance using the sterilised sweet shaped like dog faeces. We ask whether the disgust is appropriate given the knowledge that the sweet is safe, or whether the reaction contradicts the belief. If they say the belief should override the disgust, they reach the sixth leaf, labelled Social Constructivism, with the awkward commitment that it makes cross-cultural emotional understanding nearly impossible since scripts differ. If they say the disgust persists despite the belief, they reach the seventh leaf, labelled Feeling Theory or Embodied Appraisal, with the awkward commitment that it risks collapsing back into the James-Lange view if the cognitive appraisal is not carefully distinguished from the bodily feeling.

  Regarding the logical space, there are combinations of answers that are possible but unoccupied in this tree. Specifically, the combination of requiring bodily feelings but denying concepts while also insisting that belief overrides emotion is left empty because it is largely incoherent; if there are no concepts, there is no belief to do the overriding. Similarly, the combination of denying bodily feelings and denying concepts while insisting belief is required is unoccupied because it is incoherent to require judgment without concepts. There is one pair of leaves I must flag as difficult to separate cleanly, which are Cognitive Judgementalism and Social Constructivism. While I have separated them using the somatic question, many constructivists do not insist on bodily feelings any more than judgementalists do, so a student who denies the somatic requirement but insists on recalcitrance due to social scripts might find themselves without a perfect leaf, though they would likely default to the Perceptual Theory position. Finally, I should note that the distinction between Perceptual Theory and Feeling Theory relies entirely on the somatic node, so if a student is unsure about the blocked fear case, these two positions will remain indistinguishable to them, which is perhaps appropriate given how closely related they are in the current literature. I think this structure should allow your students to find their way to a position without ever needing to know the names until the very end.

  Best wishes,

  Your colleague
