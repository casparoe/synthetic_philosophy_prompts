      3. Q2: Explain failure as a need for ratification, not inherent illegitimacy.
      4. Q3: Distinguish Deliberative vs. Binding. They came apart. This is expected in hybrid models, fatal in replacement models.
      5. Q4: Blind spot = **Descriptive Representation Limits** (willingness to serve/Indigenous representation). Theory assumes random selection = perfect mirror. Reality = self-selection bias within the lot.
