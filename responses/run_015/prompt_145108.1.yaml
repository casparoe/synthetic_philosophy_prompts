      *   *Check:* Specific BC details. *Action:* Ensure the 57.69% and 77/79 districts stats are used correctly to illustrate the "majority vs. supermajority" tension.
      *   *Tone:* Academic, analytical, disciplined.

  5.  **Final Review against Prompt Requirements:**
      *   Lens: Sortition/Lottocratic theory.
      *   Mapping: Actors, Options, Evidence.
      *   Q1: Internal process/Deliberation.
      *   Q2: Referendum failure explanation.
      *   Q3: Deliberative vs. Binding Legitimacy.
      *   Q4: Theoretical blind spot.
      *   Conclusion: Replace or Complicate?

      *(Self-Correction on Q4)*: The prompt asks for a feature the theory explains *poorly*. The 60% threshold is a rule imposed by the *government*, not the theory. A better blind spot might be the **translation problem**. Sortition theory explains how 160 people deliberate. It explains poorly how 160 people's reasoning is communicated to 2 million voters without partisan shortcuts. The "Campaign Environment" is a stronger theoretical gap. I will focus on the **transmission of deliberative quality to the mass electorate**.

      *(Wait, looking closer at Q4)*: "Identify at least one feature of the episode... that the theory explains poorly." The 60% threshold is a feature of the *episode*. Sortition theory doesn't have a stance on referendum thresholds. That fits. However, the *campaign dynamics* are also a feature. Let's stick with the **Supermajority Threshold** because it directly relates to the "Binding Legitimacy" discussion in Q3. It highlights that the *rules of adoption* are external to the lottocratic logic. Actually, the **Role of Political Parties** during the referendum is a better fit for "theory explains poorly." Sortition assumes removing parties helps. But in the referendum, the *absence* of party cues might have confused voters. I'll focus on the **Information Environment/Campaign Dynamics**. Sortition creates a bubble of rationality; it doesn't account for the irrationality of the public square outside that bubble.

      *Decision:* I will focus on the **Supermajority Threshold** as the institutional feature, but frame it through the lens of **Elite Veto Power**. Sortition theory often assumes that if the mini-public is legitimate, the macro-public will follow. It fails to account for the institutional barriers (like the 60% rule) that traditional elites can erect to nullify the mini-public's work. This highlights the power dynamics theory often ignores.

      *Re-evaluating Q4:* Let's look at the "Selection Protocol." The prompt mentions "160 citizens selected by lot." In reality, there was a stratified random sample, but there were issues with Indigenous representation and self-selection bias (people willing to commit 11 months). Sortition theory claims "Descriptive Representation." If the sample isn't perfectly descriptive (due to attrition or willingness), the theory's core claim is weakened. This is a strong internal critique. Let's use **Descriptive Representation Gaps (specifically Indigenous underrepresentation)**. This directly challenges the "descriptive representation" claim mentioned in the prompt.

