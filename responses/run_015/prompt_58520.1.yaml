answer: |-
  1. We split a single bag of mixed cherry tomato seeds randomly between two side-by-side beds, planting one in depleted soil and the other in rich compost, then add cheap LED grow lights only to the depleted bed.
  2. Inside each bed, every plant receives identical soil and light, so the slight height variations between neighbors are almost entirely due to their unique DNA, driving the calculated heritability within each group to over 90 percent.
  3. The nutrient gap yields a 12-inch average in depleted soil versus 36 inches in compost, proving the massive gap is purely environmental. When the LEDs make the depleted plants jump to 30 inches, it shows the trait is highly changeable despite the high heritability score.
  4. The uniform soil within each bed suppresses environmental variance to spike heritability, so removing that uniformity would crash the 90 percent number and confuse the lesson. Without identical care within the beds, individual differences would look environmental rather than genetic.
  5. A skeptic might argue the tallest compost plants still beat the tallest LED plants, claiming genetics set the absolute ceiling. This fails because the LED intervention shifted the entire depleted group's average upward, proving the environment controls where that genetic potential lands.
