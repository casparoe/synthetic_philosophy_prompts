      *   Mark underdetermination? Yes.
      *   What would externalist interpretation look like? Yes.
      *   Tone: Academic, suitable for a PhD student/seminar.

  7.  **Final Polish:** Check citations (Nix, Putnam, Kripke). Ensure the distinction between "sense" (Fregean) and "reference" (Millian/Kripkean) is clear in the legal context. (Self-correction: Ensure I don't get too bogged down in Frege vs. Kripke history, keep it focused on legal application).

  *(Self-Correction during drafting)*: I need to be careful with *Nix*. The Court said dictionaries are "aids to memory." This suggests they view meaning as *prior* to the dictionary. The dictionary doesn't *make* the meaning; it records it. This is actually compatible with Externalism (recording usage), but the Court's *rejection* of the botanical definition suggests they prioritize the *intension* (concept of vegetable) over the *extension* (botanical fruit) based on statutory purpose. I need to highlight that *Nix* is actually a case about **Intension vs. Extension** relative to **Statutory Purpose**.

