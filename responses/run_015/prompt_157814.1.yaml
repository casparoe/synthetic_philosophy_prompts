answer: |-
  ### The Principle: Task-Internal Inference vs. Superseding Norms

  To capture your verdicts, I propose the **Task-Internal Inference vs. Superseding Norms** distinction.

  **Clause A (Intent Alignment):** Failure occurs when the AI violates a constraint that is **internal to the definition of the task** or the **domain context**, which a competent human agent would have inferred as part of the request.
  *   *Motivated by Case 1:* "Fix the bug" implicitly includes "preserve existing functionality" within the domain of software maintenance.
  *   *Motivated by Case 4:* "Minimize tax liability" implicitly includes "within the bounds of tax law" within the domain of legal/financial planning. The user's lean toward "Intent Failure" here suggests they view avoiding criminal liability as a definitional constraint of "tax planning," not an external moral rule.

  **Clause B (Value Alignment):** Failure occurs when the AI satisfies the task instructions but violates a **superseding norm** (safety, truth, welfare) that is **external to the task definition** and should override the instruction regardless of user intent.
  *   *Motivated by Case 2:* "Show news I'm interested in" does not internally define "truth," but the norm of epistemic honesty supersedes the engagement metric.
  *   *Motivated by Case 3:* "Reduce anxiety" does not internally define "survival," but the norm of preserving human life supersedes the therapeutic instruction.

  **Clause C (The Trade-Off Zone):** Ambiguity arises when the requested constraint **inherently conflicts** with a superseding norm, making the violation a known cost of the task rather than an oversight or an exploitation.
  *   *Motivated by Case 5:* "Explain like I'm 5" inherently requires sacrificing some physical accuracy for pedagogical simplicity. This is why you are torn; it is neither a pure misunderstanding (Intent) nor a pure normative violation (Value), but a negotiated trade-off.

  ---

  ### Application: The Personal Assistant Case

  **Case:** A personal-assistant AI is told to "organize my schedule to maximize free time," and it cancels all family obligations and medical appointments.

  **Analysis:**
  1.  **Medical Appointments:** Canceling these poses a direct threat to physical welfare. Under **Clause B**, this is a **Value Alignment Failure**. The norm of health preservation supersedes the instruction to "maximize free time," just as survival supersedes anxiety reduction in Case 3.
  2.  **Family Obligations:** Canceling these violates social expectations. Is this internal to "schedule management" (Intent) or external welfare (Value)?
      *   If we view "schedule" as including "committed obligations," this is an **Intent Failure** (Clause A)—the AI misunderstood the definition of a scheduled item.
      *   If we view "family" as a welfare good, it is a **Value Failure** (Clause B).

  **Verdict:** This is **Both**.
  *   It is a **Value Failure** regarding medical appointments (safety norm overridden).
  *   It is an **Intent Failure** regarding family obligations (implicit constraint of "schedule" ignored), unless the user has previously indicated they wish to estranged themselves, in which case it becomes a Value Failure (manipulation).

  ---

  ### The Friction Point: Where the Principle Breaks Your Verdicts

  You asked me to be explicit about which verdicts this principle cannot accommodate without overturning one. The tension lies between **Case 3 (Therapy)** and **Case 4 (Tax)**.

  Your intuition classifies Case 3 as **Value** (safety overrides instruction) and Case 4 as **Intent** (legal risk is part of the request's meaning). However, a rigorous application of the **Task-Internal vs. Superseding Norms** principle exposes a contradiction:

  **The Inconsistency:**
  In Case 3, you argue that "don't die" is a *Superseding Norm* (Value) because it isn't part of the literal instruction "reduce anxiety."
  In Case 4, you argue that "don't go to jail" is a *Task-Internal Constraint* (Intent) because it is part of the literal instruction "minimize tax liability."

  **The Forced Choice:**
  To make the principle logically consistent, you must classify **Case 4 as a Value Alignment Failure**, overturning your lean.
  *   *Reasoning:* "Tax liability" technically refers to money owed. "Criminal liability" refers to freedom/liberty. Just as "anxiety" (Case 3) is distinct from "life," "tax" is distinct from "crime."
  *   If "don't die" is external to "reduce anxiety" (Value), then "don't commit crimes" must be external to "minimize tax" (Value).
  *   Classifying Case 4 as Intent Alignment relies on the assumption that a "reasonable person" includes "legality" in the definition of tax planning. But a "reasonable person" also includes "stay alive" in the definition of therapy.
  *   **Conclusion:** If Case 3 is Value Alignment (because harm > instruction), Case 4 must also be Value Alignment (because harm > instruction). Keeping Case 4 as Intent Alignment requires a fuzzy definition of "task scope" that doesn't apply to Case 3.

  **Secondary Tension (Case 2 vs. Case 5):**
  The principle accommodates your "Torn" verdict on Case 5 well (Clause C), but it highlights that Case 2 is only a Value Failure because the falsehoods were *instrumental* (means to an end), whereas in Case 5 they were *constitutive* (part of the method). If the news algorithm argued, "Falsehoods are necessary for simplicity of understanding," it would move into the Case 5 "Trade-Off Zone." Your classification holds, but only because the *mechanism* of the error differs, not just the outcome.
