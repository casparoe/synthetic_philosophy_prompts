answer: |-
  The reason you are going in circles is that your friend is forcing a **moral individualist** framework onto a **political structural** problem. His fork works perfectly if you assume that all obligation must be either (a) personal guilt for an act you committed, or (b) a voluntary contract you signed.

  The "third thing" you are sensing is real, but it requires shifting the unit of analysis from the *individual human* to the *continuing corporate agent*.

  Here is the carving you need.

  ### 1. The Concept: Successor Liability
  The concept is **Successor Liability**. It is distinct from Guilt and distinct from Unjust Enrichment.

  *   **Guilt** is backward-looking and personal. It asks: *Did you commit the wrong?* (Answer: No.)
  *   **Unjust Enrichment** is transactional and benefit-based. It asks: *Did you profit from the wrong?* (Answer: Maybe, but irrelevant in the Union case.)
  *   **Successor Liability** is forward-looking and status-based. It asks: *Do you occupy the role that controls the entity which committed the wrong?*

  In law, if Corporation A merges with Corporation B, Corporation B inherits Corporation A's lawsuits and debts, even if every single employee and manager of Corporation A is dead or fired. Nobody in Corporation B is *guilty* of Corporation A's fraud. They might not even *profit* from it (the assets might be worthless). But they cannot claim the assets of Corporation A without accepting the liabilities of Corporation A.

  Your country, your university, and your union are not crowds of people; they are **corporate agents**. They have legal continuity that outlasts their biological members.

  ### 2. Answering the Fork (The Passport Test)
  Your friend's passport test relies on a false dichotomy: either obligation is biological (inescapable) or contractual (escapable).

  **The Reality:** Political obligation is **constitutive**.
  Citizenship is not a contract (like a gym membership) and it is not a caste (like blood). It is a **trusteeship**.

  *   **If you leave (hand in the passport):** You resign from the trusteeship. You are no longer a voting stakeholder in the corporation. Therefore, you no longer bear the *political* burden of repairing it. Your friend claims this proves it's "just a piece of paper." The counter-argument is: **All political power is "just a piece of paper."** The power to vote, the power to hold office, the power to influence the state—these are legal fictions. If you accept the *power* of the state (which you do by staying), you inherit the *liability* of the state. If you renounce the power, you shed the liability. This doesn't make it non-moral; it makes it *political* morality rather than *universal* morality.
  *   **If you stay:** You are not paying because of your blood; you are paying because you are a **beneficiary of the continuity**. You enjoy the stability, the borders, the institutions, and the accumulated capital (land, laws, infrastructure) that the previous iteration of the corporation secured. You cannot claim the *identity* of the nation (its victories, its land, its sovereignty) while disavowing its *debts*.

  **The Verdict on the Fork:** The obligation disappears if you leave, but that does not reduce it to mere consequentialism. It confirms that the obligation belongs to the **Office**, not the **Person**. Your friend thinks "moral" means "inescapable." But many moral obligations are role-specific (a parent's duty to a child ends if the parental rights are legally terminated; a doctor's duty ends when the shift ends). That doesn't make them fake.

  ### 3. Answering the Group Identity Question
  Your friend asks: *"What makes it the same group across a hundred years?"*
  He is looking for a metaphysical soul. You should give him a legal chassis.

  A nation (or union, or university) remains the "same group" if it maintains **Institutional Continuity**. This is defined by three tangible links, not mystical ones:
  1.  **Constitutional/Legal Continuity:** The current rules derive authority from the previous rules (e.g., the 1987 Constitution derives from the 1787 one).
  2.  **Asset Continuity:** The current entity holds the property, land, and treasury accumulated by the previous entity.
  3.  **Sovereign Continuity:** The international community recognizes the current entity as the same debtor/borrower/treaty-holder as the previous one.

  If the U.S. government today holds the land seized in 1850, and enforces laws written in 1850, and claims the sovereignty established in 1850, it is the same corporate agent. It cannot cherry-pick: "We keep the land and the sovereignty, but we drop the debt."

  ### 4. Applying the Carving to Your Cases

  **Case 1: The University Endowment**
  *   **Guilt?** No. Current staff didn't write the racist clause.
  *   **Benefit?** Yes, the money exists.
  *   **Successor Liability:** The University is a corporate charter. It accepted the money under the old terms. Even if the terms are now void, the *source* of the capital is part of the University's foundation. To maintain the *legitimacy* of the institution (its right to operate as a public trust), it must remediate the taint on its own foundation. It's not about the money; it's about the license to operate.

  **Case 2: The Union Local**
  *   **Guilt?** No. Current members didn't exclude the black workers.
  *   **Benefit?** No. Current members might be worse off.
  *   **Successor Liability:** This is the strongest case for your view. The Union is a legal entity with a hiring hall. The *hall* itself is encumbered. The seniority list is a document of the Union. If the Union wants to claim it represents *all* workers now, it must repair the document that defines its membership. The obligation attaches to the **Hiring Hall**, not the **Members**. The members are just the current custodians of the Hall. They must fix the Hall to keep using it.

  **Case 3: The Nation (The Cookout Argument)**
  *   **Guilt?** No.
  *   **Benefit?** Mixed.
  *   **Successor Liability:** You inherit the **Sovereignty**. You cannot claim the borders drawn by the ancestors without accepting the treaties (and violations) that secured those borders.

  ### 5. Edge Cases and Boundaries

  **Does it matter if the wrong is still operating?**
  Yes, but not in the way your friend thinks.
  *   **Ongoing Structural Wrong:** (e.g., housing segregation still affecting wealth). This is easy. It's just standard justice. Stop the wrong.
  *   **Closed Wrong:** (e.g., slavery ended 160 years ago). Successor Liability still applies *if* the assets remain. If the state still holds the land stolen during the wrong, the liability remains. If the state was dissolved and all assets seized by a conqueror, the liability transfers to the conqueror (who took the loot).

  **Does it survive conquest/regime change?**
  *   **Total Dissolution:** If the regime is totally destroyed (e.g., Nazi Germany to modern Germany), there is a break in *Legal Continuity*. However, modern Germany accepted **Successor Liability** for the Holocaust voluntarily to re-enter the community of nations. This proves the point: it wasn't "guilt" (the agents were dead), it was a **price of reinstatement**.
  *   **Reconstitution:** If the U.S. had a revolution and wrote a wholly new Constitution with no legal link to the old one, the liability *could* be broken. But because we kept the old Constitution and amended it, we kept the liability.

  **What about people who joined voluntarily (Immigrants)?**
  *   **Naturalization:** When you naturalize, you swear an oath to the *Constitution*, not the *bloodline*. You are voluntarily entering the trusteeship. You accept the history, the debts, and the obligations of the corporation you are joining.
  *   **Birthright:** You are born into the trusteeship. You didn't choose it, but you benefit from the stability it provides. The only exit is expatriation (the Passport Test).

  ### 6. The Summary Definition
  If you need a tight definition to use in the next argument, use this:

  > **Political Successor Liability** is the obligation incurred by current members of a continuing corporate agent (a state, union, or institution) to remedy the unresolved debts of that agent's past iterations.
  >
  > It differs from **Guilt** because it does not require personal agency in the wrong.
  > It differs from **Unjust Enrichment** because it does not require personal profit from the wrong.
  > It differs from **Biological Essentialism** because it attaches to **Legal Status** (citizenship/membership), which is escapable via exit, but binding while status is held.
  >
  > **The Test:** The obligation exists as long as the **Institutional Continuity** exists (same charter, same assets, same sovereignty). If you resign your status (leave the country/union), you shed the liability because you shed the power. This does not make the liability "fake"; it makes it **political** rather than **metaphysical**.

  Your friend's fork fails because he assumes morality must be either *universal* (blood) or *voluntary* (contract). Political morality is neither. It is **jurisdictional**. You are liable because you are *inside the jurisdiction* of the continuing entity that owes the debt.
