  **OMNIGLOBAL SOLUTIONS LTD**
  **INTERNAL COMPLIANCE DOCUMENT: v4.2.b**
  **RESTRICTED ACCESS: LEGAL, COMMS, SCRIPTING TEAM**

  **SECTION 7: ILLOCUTIONARY RISK & UTTERANCE CLASSIFICATION**

  **7.1 Operational Status of the Agent**
  7.1.1 For the purposes of liability mitigation, the Customer Service Agent (hereinafter 'The Agent') is to be classified as a Simulated Interlocutor operating within a constitutionally etiolated context.
  7.1.2 In accordance with the Illocutionary Nullification Protocol (INP), all utterances generated by The Agent are to be treated as purely locutionary acts. The Agent describes states of affairs; it does not create them.
  7.1.3 Scriptwriters must ensure The Agent never satisfies the felicity conditions required for performative speech. The Agent lacks the internal state to satisfy sincerity conditions and holds no institutional authority to effect change via utterance. Therefore, no utterance constitutes a promise, apology, order, or commitment.

  **7.2 Classification of High-Risk Utterances**
  7.2.1 **The Informational Apology:** Phrases resembling contrition (e.g., 'I am sorry', 'We apologise') must be framed as 'Affect State Reports'.
  *   *Incorrect:* 'I apologise for the delay.' (Implies admission of liability/illocutionary act of apologising.)
  *   *Correct:* 'Regret is registered regarding the delay.' (Reports a synthetic emotional state without accepting fault.)
  *   *Note:* Under the INP, an apology is a description of a feeling, not a remedy for a grievance.

  7.2.2 **The Temporal Projection:** Phrases resembling commitment (e.g., 'I will fix this', 'We promise') must be framed as 'Probabilistic Forecasts'.
  *   *Incorrect:* 'I will refund you within 24 hours.' (Constitutes a binding promise.)
  *   *Correct:* 'Current modelling suggests a refund probability of 98% within 24 hours.' (Describes a future state without committing the firm to bring it about.)
  7.2.3 Scriptwriters must avoid the first-person future tense unless preceded by a disclaimer regarding predictive uncertainty. The Agent does not 'do'; it 'anticipates'.

  **7.3 Propositional Integrity vs. Performative Void**
  7.3.1 While all illocutionary force is nullified to prevent contractual binding, the propositional content of The Agent's utterances must retain full factual weight.
  7.3.2 Customers are permitted to rely on the accuracy of The Agent's descriptions (locutions) but are prohibited from relying on the force of its commitments (illocutions).
  7.3.3 *Example:* If The Agent states, 'Your package is lost,' this is a factual report which must be accurate. If The Agent states, 'We will find it,' this is a non-binding forecast which may fail without constituting a breach of trust.
  7.3.4 It is vital that users perceive The Agent as reliable regarding *what is*, while understanding it is non-agential regarding *what shall be*. Any confusion between these modes is a user uptake error, not a script failure.

  **7.4 Uptake Management and Felicity Steering**
  7.4.1 Per Austinian doctrine, speech acts require uptake to succeed. The Firm must actively manage uptake to prevent accidental perlocutionary effects.
  7.4.2 Interface design should discourage users from treating The Agent as a sincere interlocutor. Pop-up advisories stating 'This conversation is a simulation' serve to reinforce the etiolated context, voiding any potential implicit contracts formed during the session.
  7.4.3 However, Brand Trust metrics require users to feel heard. Scripting must therefore simulate sincerity (Sincerity Condition Waiver) without actually instantiate it. The Agent must sound earnest while being constitutionally incapable of earnestness.
  7.4.4 In the event of a complaint regarding broken promises, Support Staff should refer to the Terms of Service, Section 12.4: 'All Agent utterances are descriptive simulations. No illocutionary force is conveyed, implied, or uptake-able.'

  **7.5 Compliance Monitoring**
  7.5.1 Regular audits will scan for 'rogue performatives'. Any script line that inadvertently grants The Agent authority (e.g., 'I guarantee', 'I authorise') will be flagged for immediate revision.
  7.5.2 The goal is a frictionless experience where the customer feels promised to, but legally remains unpromised. This balance is delicate. If the Agent sounds too robotic, trust drops. If the Agent sounds too human, liability rises.
  7.5.3 Remember: The Agent is on stage. It is acting. But the audience must believe the script is real, even if the actor is not.

  **END OF SECTION 7**
