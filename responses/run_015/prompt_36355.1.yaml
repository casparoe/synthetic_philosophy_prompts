answer: |-
  # Section One: Setting the terms

  **Question 1:** Let's pin the core claim for the listeners who haven't read Dworkin. When exactly does an inequality become unjust enough for the state to intervene?

  **Follow-up 1:** If the answer is strictly "when it's not chosen," doesn't that make justice dependent on a metaphysical claim about free will rather than material need?

  **Question 2:** You distinguish brute luck from option luck. If I choose to ski without insurance and break a leg, that's option luck. Why shouldn't society cover that cost?

  **Follow-up 2:** If you say "because they chose," aren't you prioritizing moral ledger-keeping over preventing suffering?

  ***

  # Section Two: The abandonment problem

  *Strategy note: She will likely pivot to hypothetical insurance markets. We need to corner her on the feasibility of that insurance for the actually existing poor.*

  **Question 1:** The classic critique is abandonment. If a smoker gets lung cancer, luck egalitarianism seems to say let them suffer. Do you actually deny healthcare to the imprudent?

  **Follow-up 1:** You'll likely say they could have bought insurance. But what about the person who was too poor to afford the premium *before* they got sick? Is their poverty also a choice, or is that the brute luck you claim to fix?

  **Question 2:** Let's say they could afford it but didn't. They misjudged the risk. Is ignorance a choice worthy of starvation?

  **Follow-up 2:** If you say "they should have known," aren't you assuming a level of rationality that doesn't exist in stressed, poor populations? Cognitive load is not distributed equally.

  **Question 3:** In engineering, we do blameless postmortems. We separate the outcome from the process to fix the system. Why does your theory insist on blaming the process before fixing the outcome?

  **Follow-up 3:** If the system allows people to make catastrophic errors without a safety net, isn't the system itself the brute luck? By focusing on individual choice, aren't you letting the system off the hook?

  ***

  # Section Three: Where 'choice' gets fuzzy

  *Strategy note: This is where the theory usually retreats to "ideal theory." We need to force her to admit that if the line is invisible, the policy is unworkable.*

  **Question 1:** Take expensive tastes. Someone grows up deprived, develops a craving for luxury as compensation. Is that choice or brute luck?

  **Follow-up 1:** If you say "choice," you ignore how deprivation shapes preference. If "luck," where does responsibility begin? If all tastes are socially conditioned, doesn't the distinction collapse?

  **Question 2:** Consider religious obligations. A Sikh chooses to wear a turban, costing money and job opportunities. It's chosen, but feels non-optional. Do you subsidize that?

  **Follow-up 2:** If you subsidize only "reasonable" beliefs, aren't you putting the state in charge of theology? If you subsidize all, doesn't that punish the non-relious for their "choice" of secularism?

  **Question 3:** Here's the hard one. A person makes a dumb financial decision because their parents never taught them budgeting. You might call this an implementation problem, not a theory flaw. But if the theory can't distinguish upbringing from choice in practice, isn't the theory useless?

  **Follow-up 3:** If the ideal requires information we can never have about someone's childhood, isn't luck egalitarianism functionally indistinguishable from strict egalitarianism? Why not just admit we can't tell the difference and redistribute based on need?

  ***

  # Section Four: The closer

  *Strategy note: We need a falsification condition. Philosophers often treat views as unfalsifiable commitments. We want to know what breaks the model.*

  **Question 1:** What empirical evidence or policy result would actually make you abandon luck egalitarianism?

  **Follow-up 1:** If the only way to track choice is through intrusive surveillance that violates liberty, is the trade-off worth it? At what point does the cost of measuring justice destroy the justice you're trying to build?
