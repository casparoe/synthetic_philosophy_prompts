answer: |-
  Good evening. For those of you who don't know me, I'm a journalist who writes about science and ideas. Which means I spend a lot of time trying to translate complex concepts for people who didn't ask for them. So, looking around this room, I realize I have my work cut out for me. Half of you could debate the nuances of predictive processing models in your sleep. The other half are just happy to see Lena wearing something that isn't a cardigan with elbow patches.

  We are here to celebrate Dr. Lena Voss. And this presents a unique logistical challenge. For thirty-five years, Lena has built a career arguing that "Lena Voss" is not a fixed thing, but a running story. She has written extensively on the Abhidharma idea of *prajnapti*—that a person is just a conventional label we slap on a bundle of changing processes. She has told us, repeatedly, that the self is an illusion constructed by the brain to make sense of sensory data.

  And yet, this is the same woman who remembers every single birthday in this room. This is the same woman who held a grudge against the Department of Philosophy for twelve years because they once cancelled her seminar room. If there is no self, I have often wondered, who exactly is holding the grudge? If there is no persistent owner of experience, who is feeling slighted?

  It would be easy to stand here and make the joke that we are celebrating the retirement of an illusion. But that would be cheap, and frankly, it would be wrong. It would miss the point of what Lena actually taught us.

  In Buddhist philosophy, there is a distinction between ultimate truth and conventional truth. Ultimate truth says there is no permanent soul, no static entity sitting behind the eyes. But conventional truth says that labels matter, that people matter, that cause and effect matter. Lena never used the idea of no-self to dismiss human connection. She used it to deepen it.

  She taught us that while there might not be a "ghost in the machine," the machine itself is miraculous. The story is real, even if the narrator is made up.

  Think about what that means for a life's work. If Lena were a static thing, a solid substance, then her retirement would be the end of that object's utility. But if Lena is a causal continuum—a stream of actions, thoughts, and influences—then retirement isn't an end. It's just a change in the current.

  This touches on something tricky that Lena wrestled with often: the idea of karma without a carrier. How do actions have consequences over time if there's no one there to own them? Lena's life is the answer. Her kindness ripples forward without needing her to claim credit for it. Her rigor ripples forward without needing her to enforce it. She spent thirty-five years planting seeds in the minds of students and colleagues, not because she needed to possess the harvest, but because that is what the process does. It grows.

  So, to the family and friends here: You don't need to understand predictive processing to understand Lena. You know her through the conventional truth. You know her through the birthdays she remembered and the meals she shared. That reality is valid. It is not less real because it is impermanent. It is *more* precious because it is impermanent.

  And to the colleagues: We know the ultimate truth. We know the self is a construct. But Lena constructed a better one than most. She built a self that was consistent, moral, fiercely intelligent, and deeply caring. She proved that you can deny the existence of a soul without losing your humanity. In fact, she showed us that letting go of the need to be a "thing" allows you to be so much more of a person.

  Lena, you are leaving the institution, but you are not leaving the causal chain. The story continues. The grudges will hopefully fade, but the impact won't.

  So, if everyone could raise a glass.

  To the conventional truth of Lena Voss, who is very real to us. To the ultimate truth of Lena Voss, who is beautifully free. And to the story, which goes on.

  To Lena.
