answer: |-
  Here is the brainstorming and construction process, followed by the case and analysis.

  ### Brainstorming & Construction Notes
  1.  **Scenario Constraints:** Needs to be one paragraph. No physical violence. Group must be craft/epistemic (River Chartists). State action must be "modernization/preservation."
  2.  **Theoretical Split:** UN Convention (1948) is narrow (protected groups + physical acts). Lemkin is broad (cultural institutions + pattern of life).
  3.  **The "Feature":** The prompt suggests "decoupling of biological harm from group-identity dissolution." I need to name this exactly. I'll call it "the severance of corporeal harm from cultural extinction."
  4.  **Removal Test:** If we add physical violence, the UN legalist still has the "group definition" hurdle. I need to make sure this nuance is clear.
  5.  **Defender:** The "dilution" argument.
  6.  **Constraints:** No citations, paraphrase Lemkin, include a typo or two.

  ### The Case Study

  **Scenario**
  The Ministry of Digital Heritage launches the "RiverMemory Initiative" targeting the Delta Chartists, a non-ethnic community bound solely by a centuries-old oral cartography tradition essential for inland navigation. Under the guise of economic modernization, the state mandates the transcription of all navigational songs and ritual maps into a centralized proprietary database, subsequently confiscating and pulping the physical manuscripts and banning public recitation of the oral codes to prevent "data redundancy." Elders receive generous pensions and titles as "Consultants," but the intergenerational transmission of the craft is legally severed since certification now requires standardized digital literacy exams unrelated to traditional knowledge. No Chartists are killed, imprisoned, or relocated; the community remains geographically intact, yet within two generations, the specific epistemic practices that constituted their group identity are functionally extinct, replaced by state-managed data streams that offer no mechanism for communal reproduction of the tradition.

  ***

  ### Analysis

  **1. The Theoretical Split**
  The **Strict UN-Convention Legalist** looks at the 1948 Convention definition. They argue this is not genocide for two reasons. First, the Delta Chartists are a professional or social group, not a national, ethnical, racial, or religious one, so they fall outside the protected categories. Second, the acts involved are cultural and administrative, not physical; there is no killing, serious bodily harm, or measures intended to prevent births within the group. The state is arguably preserving the *data*, just not the *people* or their social structure. Therefore, international sanctions for genocide are not legally triggered, though human rights violations might exist.

  The **Lemkin-Style Moral Categorist** argues this IS genocide. Paraphrasing Lemkin's broader conception, genocide is not just mass murder but the disintegration of the political and social institutions of the group, their culture, language, and national feelings. The intent here is to destroy the Chartists' "pattern of life." By severing the intergenerational transmission of their unique epistemic tradition, the state is destroying the group as a social unit. The absence of bloodshed is irrelevant; the death of the culture is the death of the group. Inaction is morally wrong because it allows the eradication of a distinct human community.

  **2. The Precise Feature**
  The feature doing the work here is **the severance of corporeal harm from cultural extinction**. The scenario engineers a situation where the group's identity dissolves completely without any biological damage to its members. This exposes the gap between the legal requirement for physical destruction (or intent thereof) and the moral reality of social destruction.

  **3. The Removal Test**
  If we remove this feature by adding minimal physical violence—for example, the state imprisons Chartist elders who refuse to hand over manuscripts—the Legalist's position shifts slightly but doesn't collapse. The physical harm satisfies the *act* requirement of the UN Convention, but the Legalist would still argue the *group* definition fails (since Chartists aren't an ethnic or religious group). They might concede it's a Crime Against Humanity, but not Genocide. However, the moral urgency increases significantly. For the Lemkin-style categorist, the physical violence just confirms the intent, but the core wrong remained the cultural destruction even without it.

  **4. The Legalist Defender**
  A defender of the strict legalist view would argue that expanding the category to cover this case dilutes genocide's moral gravity. They claim that if "genocide" covers non-violent cultural assimilation or bureaucratic modernization, the term loses its unique horror reserved for mass murder. This invites false positives where standard state-building or integration policies are labeled as extermination campaigns, potentially trivializing actual atrocities where people are systematically killed. They insist on keeping the bar high to ensure political will exists for intervention when bodies are actually piling up.

