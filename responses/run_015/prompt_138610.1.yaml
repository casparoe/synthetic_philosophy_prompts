answer: |-
  **EXAMINATION PAPER**

  **Course:** Experimental Philosophy Seminar
  **Time Allowed:** 60 Minutes
  **Word Limit:** Approximately 800 words

  **Question 1**

  Consider the following case: A transport official adopts a new scheduling system to cut costs. She knows but does not care that this will add roughly one traffic death a year along a specific stretch of road. Participants judge she *intentionally* caused the deaths. In a matched case where the side effect is saving one life a year, participants deny she *intentionally* saved anyone.

  Now suppose three further empirical findings are established regarding this case:
  (i) The asymmetry persists even when the official is misinformed (e.g., she believes the change will reduce deaths, but it increases them, and vice versa).
  (ii) The asymmetry persists when the side effect results from letting a safety programme lapse (omission) rather than adopting a new system (commission).
  (iii) In the omission condition, ascriptions of intentionality track ascriptions of blame far more closely than they track ascriptions of foresight or desire.

  Write an essay that addresses the following:
  1.  Distinguish the empirical claim (what people say) from the theoretical claim (what this implies about the concept of intentional action).
  2.  Analyze how three families of explanation—**Norm-Violation Accounts**, **Reasons/Explanation-Based Accounts**, and **Conversational/Pragmatic Accounts**—predict or accommodate findings (i) through (iii).
  3.  Based on this analysis, identify which theoretical options remain live.
  4.  Describe one further study whose result would discriminate between the remaining live options.

  ***

  **MODEL ANSWER**

  The central philosophical task is to distinguish the empirical data from the semantic interpretation. It is an **empirically settled and well-replicated fact** that folk ascriptions of intentionality are sensitive to moral valence in side-effect cases. However, **it is genuinely contested** whether this sensitivity reveals the content of the concept *intentional* itself, or whether it reflects performance errors, pragmatic implicatures, or distinct normative judgments piggybacking on a neutral concept. The prompt asks us to use specific variants to adjudicate between these contested interpretations.

  First, consider the **Norm-Violation Accounts**. These posit that moral judgment is constitutive of the concept of intentional action. To call an action intentional is partly to judge it as violating a norm.
  *   Regarding (i) (Misinformation): If the official causes death but believes she is saving lives, a strict norm account might struggle unless it prioritizes objective harm over subjective belief. If the asymmetry holds here, it suggests the *outcome's* normative status drives the ascription, not the agent's reasons.
  *   Regarding (ii) (Omission): Norm accounts generally handle omissions well, as letting die can violate norms just as killing does.
  *   Regarding (iii) (Blame Tracking): This is the strongest prediction for this family. If intentionality tracks blame closer than foresight, it supports the view that blame is not a downstream consequence of intentionality, but an input into it.

  Second, consider **Reasons/Explanation-Based Accounts**. These argue that we call side effects intentional only if they figure in the explanation of why the agent acted.
  *   Regarding (i): If the official believes she is saving lives, the death does not figure in her reasons. If participants still call it intentional, this counts strongly *against* this family. It suggests the explanation is not psychological but evaluative.
  *   Regarding (ii) & (iii): These accounts typically predict that intentionality should track mental states (desire/foresight) rather than blame. Finding (iii) specifically undermines this, as it decouples intentionality from the agent's internal explanatory reasons and couples it with the observer's normative reaction.

  Third, consider **Conversational/Pragmatic Accounts**. These argue the concept of intentional action is morally neutral, but asserting "she intentionally did X" conversationally implicates blame. We say it to blame, not because the definition includes blame.
  *   Regarding (i): If the official is misinformed, blame might be mitigated. If the asymmetry *persists* despite reduced blame (due to lack of malicious intent), this challenges pure pragmatics. However, if the outcome is bad enough, the implicature might remain useful for registering complaint.
  *   Regarding (iii): This is the critical test. If intentionality tracks blame *perfectly*, pragmatics is viable. But if intentionality is ascribed even where blame is inappropriate (e.g., in (i) where she tried to help), pragmatics struggles. A pragmatic speaker should not implicate blame if the agent is excused by misinformation. If the data shows high intentionality ascription despite low blame in the misinformed harm case, pragmatics is weakened. However, if finding (iii) holds generally, pragmatics remains a live option for the standard cases, provided we treat (i) as a boundary condition where the implicature detaches.

  **Live Options:**
  Given (iii), simple Reasons-Based accounts (which tie intentionality to foresight/desire) are effectively eliminated; intentionality is not tracking the mental states required for explanation. The live options are **Norm-Violation** (the concept is deeply moral) and **Pragmatics** (the concept is neutral but used to blame). The misinformation condition (i) creates tension for both: Norm accounts must explain why objective violation trumps subjective excuse, and Pragmatic accounts must explain why we use the blame-implying term when the agent isn't fully blameworthy.

  **Discriminating Study:**
  To separate Norm-Violation from Pragmatics, we need to test whether the moral influence is mandatory (semantic) or cancellable (pragmatic).
  *   *Design:* Present the standard harm case. In one condition, ask: "Did she intentionally cause the harm?" In the other, add a cancellation clause: "She did not care about the harm, but strictly speaking, did she intentionally cause it, regardless of whether she is blameworthy?"
  *   *Prediction:* If **Pragmatics** is correct, the cancellation clause should reduce or eliminate the asymmetry, as the speaker signals they are not invoking the blame implicature. If **Norm-Violation** is correct, the asymmetry should persist even with the clause, because the moral judgment is built into the competence conditions for applying the word, not just its conversational use.
  *   *Significance:* This isolates whether morality is part of the *meaning* or part of the *usage*.

  *(Word Count: approx. 780 words)*

  ***

  **MARKING SCHEME**

  **Total Marks: 20**

  **1. Distinction between Empirical and Theoretical Claims (4 Marks)**
  *   **Requirement:** Student must clearly state that the asymmetry in judgments is data (empirical), while the implication for the *concept* (semantics vs. pragmatics) is the theoretical debate. Must note that the data is settled, the interpretation is contested.
  *   **Common Error:** Treating the folk judgments as proof of the semantic truth without acknowledging the pragmatic alternative.

  **2. Analysis of Norm-Violation Accounts (4 Marks)**
  *   **Requirement:** Must explain that this view sees morality as constitutive. Must apply this to (iii) (supports the view) and (i) (creates tension regarding belief vs. outcome).
  *   **Common Error:** Claiming this account predicts no asymmetry in omission cases or ignoring the misinformation variable.

  **3. Analysis of Reasons/Explanation Accounts (4 Marks)**
  *   **Requirement:** Must explain that this view ties intentionality to the agent's psychological reasons. Must identify that finding (iii) and (i) are fatal or highly damaging to this view (since intentionality tracks blame/outcome, not reasons/foresight).
  *   **Common Error:** Arguing that this account can easily accommodate the blame tracking by redefining "reasons."

  **4. Analysis of Pragmatic/Conversational Accounts (4 Marks)**
  *   **Requirement:** Must explain that this view sees the concept as neutral but the *use* as blame-laden. Must analyze whether (i) undermines this (if blame is mitigated but intentionality remains).
  *   **Common Error:** Confusing pragmatics with error theory, or failing to explain how implicatures work in the context of misinformation.

  **5. Proposed Discriminating Study (4 Marks)**
  *   **Requirement:** The study must logically distinguish between the two live options (Norm vs. Pragmatic). The "cancellation" test or a non-moral norm violation test are standard valid answers. Must explain *why* the result discriminates.
  *   **Common Error:** Proposing a study that merely replicates the Knobe effect with different stories, or a study that does not target the semantics/pragmatics distinction.
