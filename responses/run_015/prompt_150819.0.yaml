      *(Self-Correction during drafting)*: Make sure to address the "Fixed-Point Condition" carefully. The user says "credence... equals the expected fraction". If this is a condition on *admissible priors*, it forces the prior to depend on the fraction. That is SSA. SIA priors depend on absolute numbers. So FPC is definitely not neutral.

      *(Refining the "Verbal" claim)*: The "Total Evidence" view is often associated with the idea that $P(H|E) = P(H \& E) / P(E)$. The dispute is about how to define the probability space over centered worlds. SSA and SIA define the measure differently. It's not just notation; it's a disagreement over the measure.

