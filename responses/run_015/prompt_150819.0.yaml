  5.  **Evaluate the Audited Incubator (AI).**
      *   *Setup:* 10 observers created. Coin toss. Heads: 10 total. Tails: 1000 total (10 created first, 990 later).
      *   *Twist:* Exactly 10 are "auditors" in *both* cases. Others are bystanders. Auditors are asked for credence.
