answer: |-
  **SEMINAR HANDOUT: CRITICAL APPENDIX**
  **Course:** Graduate Seminar in Anthropics & Physics
  **Session:** Final – Evaluating the SSA/SIA Dispute
  **Prepared for:** Discussion of Instructor's Position

  The following notes outline the strongest objections to the three central claims advanced in the final lecture: (1) that the Presumptuous Philosopher (PP) decisively refutes the Self-Indication Assumption (SIA); (2) that the Fixed-Point Condition (FPC) is a neutral consistency constraint; and (3) that the SSA/SIA dispute is merely verbal once total evidence is considered. A verdict on the 'Audited Incubator' thought experiment is included.

  ***

  ### 1. The Presumptuous Philosopher and the Doomsday Symmetry

  **The Claim:** The Presumptuous Philosopher case constitutes a *reductio ad absurdum* of SIA, whilst the Doomsday Argument (DA) is not a counter-example to SSA because it relies on further substantive premises.

  **The Objection:** This asymmetry is untenable. The PP and the DA are structurally symmetrical trade-offs.
  *   **SIA** avoids the Doomsday Argument but incurs the Presumptuous Philosopher: it allows you to favour a hypothesis with more observers purely on the grounds that you exist.
  *   **SSA** avoids the Presumptuous Philosopher but incurs the Doomsday Argument: it allows you to favour a hypothesis with fewer total observers purely on the grounds of your birth rank.

  To dismiss the DA as requiring "further substantive premises" whilst treating PP as a standalone *reductio* is question-begging. The DA follows from SSA plus the principle of indifference over observer-moments within a reference class. If the PP is absurd because it allows armchair cosmology, the DA is equally absurd because it allows armchair eschatology. Rejecting SIA solely on the grounds of PP whilst retaining SSA requires an independent justification for why presumption about *universe size* is worse than presumption about *temporal location*. Without this, the rejection of SIA appears to be an arbitrary selection of which counter-intuitive result to tolerate.

  ### 2. The Fixed-Point Condition is SSA in Disguise

  **The Claim:** The Fixed-Point Condition (FPC) is a neutral self-consistency requirement admissible to both SSA and SIA proponents.

  **The Objection:** The FPC is not neutral; it is a stipulative definition of SSA.
  The condition requires that for any hypothesis, your credence must equal the **expected fraction** of observers within that hypothesis who occupy your epistemic situation.
  *   **SSA** weights hypotheses by the *fraction* of observers who have your evidence ($P(E|H) \propto \frac{N_{like\_me}}{N_{total}}$).
  *   **SIA** weights hypotheses by the *absolute number* of observers who have your evidence ($P(E|H) \propto N_{like\_me}$).

  By defining the admissibility condition in terms of *fractions*, you have baked the SSA likelihood function into the constraint itself. An SIA proponent cannot satisfy the FPC as stated, because SIA does not require credence to track the *fraction* of observers, but rather the *measure* of observers. The FPC does not block gerrymandering neutrally; it blocks SIA by fiat. It is not a meta-constraint on anthropic reasoning; it is SSA restated as a stability condition.

  ### 3. The Dispute is Not Verbal

  **The Claim:** Once one conditionalises on total evidence (existence, time, type), SSA and SIA deliver the same numbers; the disagreement is merely notational.

  **The Objection:** The dispute concerns the **measure** over centered worlds, not merely the conditioning set.
  While both camps agree one should conditionalise on total evidence, they disagree on the prior probability distribution over the centered worlds *before* that evidence is applied.
  *   In the **Sleeping Beauty** problem, 'Halfers' (SSA-adjacent) and 'Thirders' (SIA-adjacent) agree on the total evidence ("I am awake now"). They nonetheless disagree on the credence in Heads (1/2 vs 1/3).
  *   In the **Standard Incubator**, SSA and SIA yield divergent posteriors even when conditioning on identical evidence strings.

  If the dispute were merely verbal, one could translate SSA probabilities into SIA probabilities via a simple change of variables without altering empirical predictions. One cannot. They make different predictions about how credences should shift upon learning one's birth rank or the size of the population. The disagreement is substantive: it is a conflict over whether existence itself is evidence for a larger world (SIA) or whether temporal location is evidence for a smaller world (SSA).

  ***

  ### 4. Verdict on the Audited Incubator

  **The Setup:** 10 observers created. Coin toss. Heads: 10 total. Tails: 1000 total (10 auditors + 990 bystanders). Exactly 10 auditors exist in both outcomes. Auditors are asked for credence.

  **Instructor's Claim:** SSA returns 1/2. This proves the right answer is 1/2 and suggests the dispute is verbal.

  **Critique:**
  1.  **SSA Calculation:** SSA returns 1/2 *only if* the reference class is restricted to **Auditors**. If the reference class is **All Observers**, SSA yields a high credence in Heads (approx. 1), because in the Tails world, it is highly improbable (10/1000) that you would be an auditor rather than a bystander. To get 1/2, one must assume the reference class is determined by the evidence "I am an auditor."
  2.  **SIA Calculation:** SIA also returns 1/2, but via a different path. SIA assigns a prior 100:1 favouring Tails (due to 1000 vs 10 observers). However, the likelihood of the evidence "I am an auditor" is 100:1 favouring Heads (10/10 vs 10/1000). These factors cancel exactly.
  3.  **The Verdict:** The Audited Incubator is a **cancellation case**, not a resolution. It is engineered such that the SIA boost for population size is exactly counterbalanced by the SSA-style dilution of being a specific type of observer. That both theories converge here does not prove they are verbally equivalent; it proves only that in this specific geometry, their opposing anthropic pressures neutralise one another. In the *Standard* Incubator (where all observers are asked), they diverge radically. Therefore, the case fails to demonstrate that the dispute is verbal.

  ***

  ### 5. Conclusion: The Residual Dispute

  The disagreement between SSA and SIA is genuine. It is not a confusion of language, but a clash of fundamental intuitions regarding probability and existence. To move from one position to the other, a proponent must surrender a core probabilistic intuition:

  *   **To move the SSA proponent:** You must accept that the mere fact of your existence provides evidence about the physical size of the universe (accepting the Presumptuous Philosopher) in order to avoid the conclusion that your birth rank predicts imminent extinction (rejecting Doomsday).
  *   **To move the SIA proponent:** You must accept that your temporal location provides evidence about the total number of observers (accepting Doomsday) in order to avoid the conclusion that you can infer the size of the universe from your existence alone (rejecting the Presumptuous Philosopher).

  There is no 'cautious residue'. There is only a choice between two forms of presumption.
