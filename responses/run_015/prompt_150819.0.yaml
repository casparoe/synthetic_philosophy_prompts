      *   The FPC seems to be defining the *prior* or the *stable credence* directly as the fraction.
      *   If the condition requires the credence to match the fraction, it *is* SSA. SIA matches the *number*. By specifying "fraction," the user has defined SSA into the axiom. It is not neutral. It explicitly excludes SIA, which tracks absolute numbers, not fractions.

