          *   If Ref Class = "All Observers", SIA says: Prior favors Tails (100x). Evidence "I am an auditor":
              *   $P(\text{Auditor} | \text{Heads}) = 10/10 = 1$.
              *   $P(\text{Auditor} | \text{Tails}) = 10/1000 = 1/100$.
              *   Likelihood ratio 100:1 against Tails.
              *   SIA Prior ratio 100:1 for Tails.
              *   Posterior = 1:1 (1/2).
          *   *Wait:* So both give 1/2 *if* SIA updates correctly on "I am an auditor".
          *   *Instructor's Trap:* The instructor claims SSA gives 1/2 *because* the number of auditors is fixed. This implies the reference class *must* be auditors. But SSA requires the reference class to be defined *before* knowing you are an auditor? No, reference class is "observers indistinguishable from you". If you know you are an auditor, your class is auditors.
          *   *Critique:* The AI case is constructed specifically to make the observer counts equal *within the specific evidence class*. This rigs the case to make SSA and SIA agree. It does not prove the dispute is verbal; it proves that if you constrain the observer count in the relevant class, the anthropic pressure vanishes.
          *   *Does SSA return 1/2?* Yes, if the reference class is "Auditors".
          *   *Does SIA return 1/2?* Yes, because the SIA boost for Tails (more observers) is exactly cancelled by the unlikelihood of being an auditor in Tails (few auditors relative to bystanders).
          *   *Verdict:* This case doesn't show the dispute is verbal; it shows a case where the anthropic effects cancel out. It fails to test the divergence because the setup forces convergence. A true test needs a case where observer counts differ *within* the evidence class (e.g., if auditors were 10 in Heads and 20 in Tails).

  6.  **Synthesize the "What must be given up" conclusion.**
      *   SSA must give up: The intuition that we are not special in time (avoids Doomsday).
