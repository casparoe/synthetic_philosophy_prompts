      *   I need to be careful here. The user defines FPC: "credence... equals the expected fraction of observers within that hypothesis who occupy an epistemic situation indistinguishable from yours."
      *   If $P(H)$ = Expected Fraction, this is essentially saying $P(H) \propto \frac{N_{like\_me}(H)}{N_{total}(H)}$.
      *   Standard Bayesian updating: $P(H|E) \propto P(E|H)P(H)$.
