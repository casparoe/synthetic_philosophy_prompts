answer: |-
  # The Weighted Premise Adjudication (WPA) Protocol

  **Purpose:** To resolve the discursive dilemma in IRB voting while respecting domain authority, ensuring regulatory compliance, and maintaining transparency within a 90-minute window.
  **Applicability:** All protocols involving vulnerable populations requiring full board review.
  **Constraints:** 7 Voting Members. 3 Binary Premises (Risk Minimal [R], Consent Adequate [C], Value Justifies Risk [V]). Clearance requires $R \land C \land V$.

  ---

  ## Part I: Pre-Meeting Authority Tagging (Non-Circular Setup)
  *To prevent circular arguments during the meeting regarding who is an "expert," authority is assigned by **Role Charter**, not by argument strength.*

  1.  **Designated Authority (DA) Assignment:** The IRB Charter permanently assigns DA for each premise to specific roles. During the meeting, these tags are fixed and cannot be challenged.
      *   **Premise R (Risk):** DA = **Biostatistician**. (Authority on probability/magnitude of harm).
      *   **Premise C (Consent):** DA = **Patient Advocate**. (Authority on comprehension/voluntariness).
      *   **Premise V (Value):** DA = **Clinician-Researcher**. (Authority on scientific merit/therapeutic potential).
      *   *Note:* Legal Counsel, Community Representative, and two General Members retain full voting rights but hold no DA status.
  2.  **Disagreement Typing Guide:** Distributed to members prior to convening.
      *   **Factual:** Disputes over data, statistics, or regulatory definitions (e.g., "Is a 5% adverse event rate minimal?"). DA weight applies.
      *   **Axiological:** Disputes over values, ethics, or tolerance (e.g., "Is a 5% risk *acceptable* even if minimal?"). DA weight does not apply; one-person-one-vote.

  ---

  ## Part II: In-Meeting Decision Flowchart (90-Minute Execution)

  **Step 1: Framing & Typing (15 Minutes)**
  *   **Chair:** Presents the protocol.
  *   **Test:** Is the disagreement regarding the *application* of R, C, V (Factual) or the *validity* of R, C, V themselves (Meta)?
      *   *If Meta:* **STOP.** Refer to Institutional Compliance Office. This board adjudicates within the R/C/V framework, not outside it.
      *   *If Factual/Axiological:* Proceed to Step 2.

  **Step 2: Premise Voting (30 Minutes)**
  *   **Action:** Secret ballot on R, C, and V individually.
  *   **Record:** Tally Yes/No for each.
  *   **DA Check:** Immediately after each tally, the Chair asks the specific DA member: "Do you concur with the majority on this premise?"
      *   *If DA Concurs:* Premise status is **Stable**.
      *   *If DA Dissents:* Premise status is **Contested**. (Triggers Dissent-Preservation Rule, see Part III).

  **Step 3: Conclusion Voting (15 Minutes)**
  *   **Action:** Secret ballot on Final Clearance (Approval/Rejection).
  *   **Record:** Tally Yes/No.

  **Step 4: Aggregation & Adjudication (20 Minutes)**
  *Apply the following logic tree in order:*

  1.  **Regulatory Floor Test:** Did any Premise (R, C, or V) fail to achieve a simple majority?
      *   **Yes:** **REJECTION.** (Regulatory logic trumps collective will).
      *   **No:** Proceed to 2.
  2.  **DA Veto Test:** Did any DA member dissent on a premise that achieved a majority?
      *   **Yes:** **QUALIFIED CLEARANCE.** (Approval granted, but subject to specific modifications addressing the DA's concern, or heightened monitoring).
      *   **No:** Proceed to 3.
  3.  **Collective Will Test:** Did the Conclusion Vote achieve a simple majority for Approval?
      *   **Yes:** **FULL APPROVAL.**
      *   **No:** **REJECTION.** (The Discursive Dilemma Safety Valve: If the board collectively feels the study should not proceed despite passing premises, the Conclusion vote prevails to prevent ethical drift).

  **Step 5: Documentation (10 Minutes)**
  *   **Action:** Minutes drafted according to Part III rules.

  ---

  ## Part III: Dissent-Preservation & Transparency Rules

  **1. The "Contested Premise" Flag**
  If a DA member dissents on a premise (Step 2), the minutes must record:
  > *"Premise [X] passed by majority vote but is marked CONTENDED by Designated Authority [Role]."*
  This flag automatically triggers the **Qualified Clearance** tier in Step 4, unless the Conclusion Vote is Rejection.

  **2. The "Minority Report" Clause**
  Any member may request their dissent be recorded verbatim (max 200 words) in the official minutes. Suppression of this text is a violation of transparency obligations. The Chair cannot edit for content, only for length/defamation.

  **3. The Chair's Constraint**
  The Chair possesses one vote equal to others. The Chair cannot override Step 4 logic. If the Procedure mandates Approval, the Chair must sign the clearance or recuse themselves and delegate signature authority to the Vice-Chair.

  ---

  ## Part IV: Application to Three Cases

  ### Case 1: Straightforward Approval
  *   **Votes:** R (7-0), C (7-0), V (7-0). Conclusion (7-0).
  *   **DA Check:** All DA members concur.
  *   **Procedure Path:** Step 4.1 (Pass) $\rightarrow$ Step 4.2 (No DA Dissent) $\rightarrow$ Step 4.3 (Majority Approval).
  *   **Outcome:** **Full Approval.**
  *   **Documentation:** Standard minutes. No flags.

  ### Case 2: The Discursive Dilemma + DA Dissent
  *   **Scenario:** Majorities affirm R (4-3), C (5-2), V (4-3). However, the Conclusion Vote fails (3-4 Against Approval). The Biostatistician (DA for R) voted No on R.
  *   **Procedure Path:**
      *   Step 4.1: All premises passed majority. (Proceed).
      *   Step 4.2: Biostatistician dissented on R. (Triggers Qualified Clearance *condition*).
      *   Step 4.3: Conclusion Vote failed (Majority Rejection).
  *   **Conflict Resolution:** Step 4.3 overrides Step 4.2. You cannot grant Qualified Clearance on a Rejected study.
  *   **Outcome:** **Rejection.**
  *   **Documentation:** Minutes must state: *"Protocol Rejected by Conclusion Vote. Note: Premise R was Contested by Designated Authority (Biostatistician). This structural disagreement is recorded for institutional learning."*
  *   **Why:** The Collective Will Test (Step 4.3) acts as a safety valve. Even if premises technically pass, if the board's moral intuition (Conclusion) says "No," the study stops. The DA dissent is recorded to warn the institution that the *criteria* for Risk may need review, not just this study.

  ### Case 3: The Chair Overruled
  *   **Scenario:** R (5-2), C (5-2), V (5-2). Conclusion (5-2 Approval). No DA Dissents.
  *   **Chair's Position:** The Chair believes the study is ethically dubious and votes "No" on all counts.
  *   **Procedure Path:**
      *   Step 4.1: Pass.
      *   Step 4.2: No DA Dissent.
      *   Step 4.3: Majority Approval.
  *   **Outcome:** **Full Approval.**
  *   **Explicit Overrule Step:** **Step 4, Aggregation & Adjudication.** The Chair's personal conviction is subordinated to the Aggregation Logic. The Chair must sign the approval letter or recuse.
  *   **Rationale:** This prevents the Chair from becoming a "super-voter." The procedure protects the board from the Chair's bias just as it protects the Chair from the board's mob rule.

  ---

  ## Part V: Limitations & Irreducible Judgment Calls

  **1. The Meta-Ethical Blind Spot**
  This procedure cannot settle disagreements about whether R, C, and V are the *correct* premises. If the Community Representative argues that "Scientific Value (V) should not outweigh Community Harm (a non-coded premise)," the procedure halts at Step 1.
  *   **Action:** This is not a voting issue; it is a governance issue. The protocol must be paused and referred to the Institutional Compliance Office or Ethics Committee for charter revision. Do not force a vote on a framework the board rejects.

  **2. The "Qualified Clearance" Ambiguity**
  When Step 4.2 triggers Qualified Clearance due to DA dissent, the specific *modifications* required are not algorithmically determined.
  *   **Irreducible Judgment:** The Board must negotiate *what* satisfies the DA. If the Biostatistician says "Risk is too high," and the Board says "Approved with Monitoring," the Biostatistician may still object.
  *   **Resolution:** The DA holds a "Continuing Review" flag. The study may proceed, but the DA has automatic authority to suspend it at the first interim review if their specific concern materializes.

  **3. Transparency vs. Efficiency**
  Recording verbatim dissents (Part III, Rule 2) extends meeting time.
  *   **Trade-off:** In a 90-minute meeting, this requires strict timekeeping in Step 1 and 2. If discussion runs long, the Chair must cut debate to preserve time for the Dissent Recording. Transparency is non-negotiable; debate is negotiable.

  **4. The "Safety Valve" Paradox**
  In Case 2, we prioritized the Conclusion Vote over the Premise Vote. This technically violates strict regulatory logic (where passing premises *should* mandate approval).
  *   **Frank Admission:** This is intentional. An IRB is not a calculator; it is a moral body. If the majority feels a study is wrong despite ticking boxes, the procedure allows them to say "No." However, this creates liability. The minutes must explicitly cite "Collective Ethical Judgment" as the reason for rejection to protect the institution from appeals based on regulatory criteria.

  ---

  ## Chair's Operational Checklist (For the 90-Minute Window)

  1.  **0:00-0:15:** Confirm Quorum. Remind members of DA Roles (Charter). Type the Disagreement (Factual vs. Axiological).
  2.  **0:15-0:45:** Vote R, C, V. Query DA members immediately. Mark Contested Premises.
  3.  **0:45-1:00:** Vote Conclusion.
  4.  **1:00-1:20:** Apply Step 4 Logic Tree. Announce Decision.
  5.  **1:20-1:30:** Solicit Verbatim Dissents. Sign Minutes.

  **Final Instruction to Chair:**
  Your authority lies in enforcing this procedure, not in influencing the outcome. When the procedure overrules you (Case 3), your duty is to ensure the dissent is recorded accurately, not to block the approval. This protects you from personal liability and preserves the board's integrity.
