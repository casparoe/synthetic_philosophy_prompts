answer: |-
  No established term perfectly captures this configuration of borrowed authority, localized loosening, and pretended stability. *Concept creep* is close but describes societal expansion over years, not team-level borrowing over months.

  I propose **Prestige Drift**.

  **Definition:** The adoption of rigorous terminology for its authoritative weight, followed by rapid, localized semantic loosening that retains the term's status while discarding its constraints, sustained by a collective fiction that the original definition holds.

  **Boundaries:**
  1.  *Semantic Drift*: Drift is historical, unconscious, and population-wide (decades). Prestige Drift is organizational, functional, and rapid (months).
  2.  *Jargon*: Jargon creates stable shorthand for insiders. Prestige Drift creates unstable utility where insiders know the definition is loose but pretend it is strict to maintain authority.
  3.  *Equivocation*: Equivocation is a logical fallacy where a speaker shifts meaning mid-argument. Prestige Drift is a social contract where the group accepts the shift over time without acknowledging it.

  **Examples:**
  *   **Counts:** Calling a nightly backfill that creates duplicates "idempotent" because it borrows the safety authority of the strict definition without adhering to its constraints.
  *   **Does Not Count:** Updating the handbook to define "idempotent" as "retry-safe despite duplicates." This is correction, not drift.
  *   **Counts:** Labeling a demo-blocker "critical" while ignoring the handbook's "sustained impact" threshold, relying on the word's gravity to prioritize work.
  *   **Does Not Count:** Explicitly arguing that "critical" means two different things in one meeting. Prestige Drift requires the group to act as if the meaning is singular.

  This phenomenon allows teams to borrow rigor without paying the cost of precision, facilitating movement at the expense of conceptual clarity. It is distinct because the utility lies precisely in the gap between the term's perceived strictness and its actual loose application.
