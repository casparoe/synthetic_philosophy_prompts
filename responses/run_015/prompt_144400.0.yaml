  I'm prepping questions for a podcast interview with a philosopher defending a view she calls "scaffolding collapse": maximal moral goodness isn't just undesirable (the usual Wolf-style worry about bland lives), it's structurally self-defeating, because the non-moral attachments—family, play, art—that serve as psychologial scaffolding for sustained altruism get crowded out exactly when moral motivation peaks. I want a sequence that starts with the familiar objection that moral saints just sound dull, then pushes her to defend the stronger instability claim. Anticiapte her reply that agents could cultivate "detached attachment"—a kind of cool, non-possessive care that doesn't compete with moral demands—and include the follow-up asking whether that doesn't just smuggle the non-moral goods back in under a different name. Finish with one question about what kind of evidence—conceptual or empirical—would actually change her mind, specifically whether a documented case of decades-long extreme altruism with intact mental health refutes the thesis or just counts as an outlier she can absorb.
