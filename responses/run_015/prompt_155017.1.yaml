answer: |-
  Good evening, everyone.

  Thank you for being here. Looking around this room, I see a rather peculiar sample. On one side, I see family who have patiently endured thirty years of my dinner-table monologues about standard errors. On the other, I see colleagues who know exactly what a standard error is, and quite a few who have spent the last decade arguing with me about whether democracy should be decided by a dice roll. It is a delight to see you all in one place, preferably not arguing with one another.

  Thirty years ago, I joined the Statistical Office with a simple belief: that if you want to know what is happening in a country, you cannot ask everyone, but you must ask the right people. For decades, my job was to ensure that when we measured unemployment, or health, or inflation, we were not merely listening to the loudest voices, but capturing the quiet truth of the whole population.

  In the beginning, I thought this was purely mathematical. It was about weights, variances, and confidence intervals. But over time, particularly in my recent work advising on citizens' assemblies, I realised that the mathematics of sampling is actually a metaphor for governance.

  There is a tension in this room tonight. Some of my friends here believe that we should hand the reins of power entirely to citizens chosen by lot. Others believe that governance is too complex for anyone without a specialised degree. I stand, as I often have, somewhere in the middle.

  I am not a convert to a full lottocracy. I do not believe we should abolish Parliament or replace civil servants with rotating juries. Expertise matters. We need people who have spent years mastering the brief. But I have come to defend a narrower, perhaps quieter claim.

  When you build a career in a specific field, you inevitably surround yourself with people who think like you. They went to the same universities, read the same journals, and attend the same conferences. In sociology, they call this homophily. In plain English, it means that experts often suffer from correlated blind spots. We are not necessarily wrong; we are just wrong in the same ways.

  This is where the logic of random selection becomes vital. It is not about replacing expertise with ignorance. It is about using unbiased selection within carefully defined groups to produce a form of collective cognition that meritocratic appointment systematically suppresses. When you bring ordinary people into a room, stratified to reflect the country rather than the cabinet, they do not just mirror demographics. They bring distributed knowledge. They see the pothole the engineer missed because the engineer was looking at the bridge. They see the cost of living crisis the economist modelled incorrectly because the economist never shops at that supermarket.

  My career has been about correcting bias in data. My final years have been about suggesting we correct bias in decision-making. Not by removing the experts, but by ensuring the experts are forced to listen to a room they did not fill with their own peers.

  To the theorists here: you know I remain sceptical of grand constitutional overhauls. But I hope you will agree that even a modest injection of sortition into advisory bodies clears the air.

  To my family, and the retired fieldworkers here who spent decades knocking on doors: you taught me that data is not abstract. It is people. You tolerated my absences and my preoccupation. You are the control group against which I measure my life, and I am fortunate that the results are significant.

  To my team at the Unit: you kept me honest. You ensured that when I spoke, I spoke with evidence, not just opinion.

  I am stepping down, but the work continues. The challenge for the next generation is to build institutions where expertise and randomness do not fight, but function like a double-blind trial: checking one another to find the truth.

  So, if I could ask you to raise your glasses.

  To the truth found in unexpected places, to the value of a diverse room, and to the future of getting the numbers—and the people—right.

  To Alistair? No, I think not. To us all.

  Cheers.
