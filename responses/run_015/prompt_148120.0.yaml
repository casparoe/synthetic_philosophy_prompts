answer: |-
  # Q&A Preparation Sheet
  **Candidate:** Final-Year PhD Student (Philosophy)
  **Topic:** Re-diagnosing the 'Just-So Story' Objection: Hypothesis Space Constraint via Task Specification
  **Context:** Joint Philosophy–Psychology Seminar

  ---

  ### 1. The Political Harm Objection
  **Who:** Mainstream Social Psychologists (3)
  **Likelihood:** Very High | **Damage:** High (Audience Alienation)
  **Question:** "Even if your methodological fix works, aren't you legitimising a field that has historically been used to justify gender roles and inequality? By trying to 'save' evolutionary psychology, aren't you ignoring the real-world damage caused by essentialist explanations?"

  **Reply (2 mins):**
  "I take this worry seriously, and I do not wish to dismiss it. However, there is a distinction between *improving the rigour* of a field and *endorsing its past political misuse*. My argument is that the 'just-so story' critique fails because it attacks falsifiability, which allows bad actors to claim their theories are 'scientific but unproven'. By shifting the critique to *unconstrained hypothesis spaces*, we force researchers to specify the computational problem *before* looking at data. This actually makes it *harder* to smuggle in ideological assumptions, because you must define the ancestral task structure independently of the modern behaviour. If a hypothesis cannot meet the task specification requirement, my framework classifies it as conjecture, not science. So, rather than legitimising harmful essentialism, this raises the bar such that ideologically convenient stories without independent task evidence are filtered out. I am not arguing we should ignore the misuse; I am arguing that methodological laxity facilitates it."

  **Weakest Point:** Relies on the assumption that stricter methods automatically reduce ideological bias (historians of science may dispute this).
  **Concede:** That methodological rigour alone does not guarantee ethical outcomes; vigilance is still required.
  **Hold:** That lax methodology *enables* ideological misuse more than strict methodology does.

  ### 2. The Adaptationist Ideology Objection
  **Who:** Philosophers of Science (2)
  **Likelihood:** Very High | **Damage:** High (Intellectual Core)
  **Question:** "This sounds like Gould and Lewontin's spandrels critique all over again. You claim to be constraining the hypothesis space, but your 'task specification' presupposes there *was* a specific adaptive task. Isn't this just adaptationism dressed up in computational clothing?"

  **Reply (2 mins):**
  "That is a precise reading of the risk, but there is a structural difference. Traditional adaptationism often infers the task *from* the trait (e.g., 'we have jealousy, therefore there must have been a jealousy task'). My proposal inverts this: you must specify the task structure and the computational problem *independently* of the trait's existence. Crucially, my framework explicitly includes 'by-product' and 'spandrel' hypotheses as valid candidates within the hypothesis space, provided they also meet the specification requirement. For example, a spandrel hypothesis must specify which two adaptive mechanisms interacted to produce the trait. The constraint isn't that the trait *must* be adaptive; the constraint is that the *explanation* must be computationally precise. This prevents the 'everything is an adaptation' default without ruling out adaptation entirely."

  **Weakest Point:** Requires researchers to formulate spandrel hypotheses with the same rigour as adaptationist ones, which is cognitively demanding and rare in practice.
  **Concede:** That most current EP work defaults to adaptationism.
  **Hold:** That the *method* itself does not mandate adaptationism, only precision.

  ### 3. The Epistemic Access Objection
  **Who:** Philosophers of Science / Evolutionary Psychologists
  **Likelihood:** High | **Damage:** High (Practical Viability)
  **Question:** "You require a specification of the 'ancestral task structure'. But the Pleistocene is gone. We have scant archaeological data. Isn't this requirement impossible to satisfy, rendering your 'saved' subset of EP empty?"

  **Reply (2 mins):**
  "It is true we cannot know the ancestral environment with perfect fidelity. However, we are not asking for a complete ethnography of the Pleistocene. We are asking for a specification of the *recurrent statistical structure* relevant to the computational problem. For instance, to test a visual edge-detector, we don't need to know what hominids ate for breakfast; we need to know the physics of light and occlusion, which haven't changed. For social traits, we can use cross-cultural anthropological data to identify recurrent problems (e.g., cheater detection in reciprocal exchange). If the ancestral task is truly unknowable, then the evolutionary hypothesis is indeed untenable. My claim is that for the 'reverse-engineering wing', these structures *are* knowable enough to generate quantitative criteria. If they aren't, those hypotheses should indeed remain conjecture."

  **Weakest Point:** 'Recurrent statistical structure' is vague for complex social traits compared to visual systems.
  **Concede:** That this limits EP largely to domains with stable physical or game-theoretic structures.
  **Hold:** That unknowability is a feature, not a bug—it correctly categorises speculative claims as non-scientific.

  ### 4. The Formalisation Objection
  **Who:** Formal Epistemologist (1)
  **Likelihood:** Medium | **Damage:** Medium (Technical Credibility)
  **Question:** "You speak of 'constraining the hypothesis space'. Can you write this down? I want to see the probabilistic model. How does task specification alter the prior probability of a hypothesis being true?"

  **Reply (2 mins):**
  "In this paper, I have kept the account qualitative to bridge the philosophical and psychological literatures. However, the formal commitment is that task specification acts as a likelihood constraint rather than a prior booster. Without task specification, $P(Data | Hypothesis)$ is high for almost any hypothesis because the hypotheses are flexible. With task specification, the hypothesis commits to a specific performance criterion $C$. The evaluation becomes whether the mechanism achieves $C$ within tolerance $\epsilon$. Formally, this narrows the volume of the parameter space that counts as a 'fit'. I am happy to work with you on modelling this as a Bayesian model selection problem in future work, where the 'complexity penalty' is paid by the task specification requirements, effectively implementing an Occam's razor on the explanatory story."

  **Weakest Point:** The paper currently lacks the maths the epistemologist craves.
  **Concede:** The current draft lacks formal modelling.
  **Hold:** That the conceptual logic holds even without the equations (for now).

  ### 5. The 'Baby with the Bathwater' Objection
  **Who:** Practising Evolutionary Psychologists (2)
  **Likelihood:** Medium | **Damage:** Medium (Alliance Building)
  **Question:** "You concede that your remedy leaves much of the field as 'conjecture'. Why be so hostile to the exploratory phase? Many novel predictions come from broad adaptive thinking, not strict reverse-engineering."

  **Reply (2 mins):**
  "I am not hostile to conjecture; conjecture is vital for generating ideas. My objection is to the *presentation* of conjecture as tested theory. My framework allows for broad adaptive thinking in the discovery phase. However, for the *justification* phase, I argue we must distinguish between 'this is a plausible story' and 'this is a tested mechanism'. By labelling the non-task-specified work as conjecture, we actually protect the field. It allows you to explore freely without claiming a level of evidential support you don't yet have. The 'reverse-engineering wing' you defend is the only part that can claim to be hard science. I am trying to secure the ground beneath your feet, even if it means admitting the rest is still soft."

  **Weakest Point:** EPs may fear this diminishes their funding or status if half their output is labelled 'conjecture'.
  **Concede:** That 'conjecture' is a necessary stage of science.
  **Hold:** That 'conjecture' must not be marketed as 'confirmed theory'.

  ### 6. The Naturalistic Fallacy Objection
  **Who:** Mainstream Social Psychologists
  **Likelihood:** Medium | **Damage:** Low (Standard Objection)
  **Question:** "Even if you solve the scientific problems, you haven't addressed the is-ought gap. If we find an ancestral task for aggression, does that make it acceptable?"

  **Reply (2 mins):**
  "Absolutely not. My thesis is purely methodological regarding the *truth conditions* of the claims, not their *normative implications*. Understanding the computational problem a mechanism solves tells us how it works, not whether we should keep it. In fact, precise task specification might help us override these mechanisms. If we know a behaviour is a 'lag' response to a modern environment rather than an adaptive solution, we have *more* reason to intervene, not less. I am separating the scientific validity from the ethical valuation. The former is a prerequisite for the latter, but it does not determine it."

  **Weakest Point:** Audiences often conflate explanation with justification regardless of philosophical nuance.
  **Concede:** That the public often conflates the two.
  **Hold:** That the thesis does not commit the naturalistic fallacy.

  ### 7. The 'We Already Do This' Objection
  **Who:** Practising Evolutionary Psychologists
  **Likelihood:** Low | **Damage:** Low (Novelty Challenge)
  **Question:** "Good evolutionary psychologists already do task analysis. Cosmides and Tooby defined the computational problem of social exchange decades ago. What is new here?"

  **Reply (2 mins):**
  "You are right that the *best* work in the field does this. However, the 'just-so story' objection persists because the *standard practice* across the wider field does not. My contribution is to argue that this shouldn't just be 'best practice' for the elite; it should be the *demarcation criterion* for the field. Currently, a paper can be published with a vague adaptive story. I am proposing that without the triad of ancestral task, computational problem, and performance criterion, the paper shouldn't count as testing an evolutionary hypothesis at all. I am systematising what the best of you do intuitively and making it a requirement for the rest."

  **Weakest Point:** Risks alienating the EPs by implying their current standards are insufficient.
  **Concede:** That leading figures already utilise these methods.
  **Hold:** That the field *as a whole* does not enforce them.

  ### 8. The 'Empty Set' Objection (The Hope Nobody Asks)
  **Who:** Anyone (but likely the Phil Sci group)
  **Likelihood:** Low | **Damage:** Critical (Existential Threat)
  **Question:** "If we apply your 'task specification' strictly—requiring independent ancestral data and quantitative performance criteria—does *any* existing study on complex social behaviour actually survive? Isn't your 'saved subset' effectively empty?"

  **Reply (2 mins):**
  "That is the strongest possible challenge to my view. If the answer is 'yes', then my defence of EP fails because there is nothing left to defend. However, I believe the answer is 'no', but with a caveat. Studies on visual processing, basic fear responses, and perhaps simple reciprocal exchange survive. Studies on complex, culturally variable traits like 'mate preference for waist-to-hip ratio' likely do not, under this strict regime. I am prepared to accept that conclusion. If the rigorous application of the method eliminates most current social EP claims, then that demonstrates my thesis: those claims *were* unconstrained just-so stories. I would rather have a small, robust field than a large, speculative one."

  **Weakest Point:** Admitting the field might shrink drastically could be seen as a concession of defeat.
  **Concede:** That the field will shrink significantly.
  **Hold:** That a smaller, robust field is preferable to a large, unfalsifiable one.

  ---

  ### Strategic Notes for the Defence
  *   **Tone:** Maintain a stance of *methodological reform*, not *ideological defence*. You are a philosopher policing the boundaries of science, not an EP apologist.
  *   **The "Concession" Trap:** Do not concede that EP is inherently ideological. Concede that it has been *used* ideologically, and argue your method prevents this.
  *   **The Epistemologist:** If they press for the Bayesian model during the Q&A, do not bluff. Offer to collaborate. "That is the natural next step for the formalisation chapter of the thesis."
  *   **British English Check:** Ensure you say "defence" (noun), "behaviour", "programme", "modelling", "prioritise", "centre". Avoid Americanisms like "defense" or "behavior".

  **Good luck with the defence.**
