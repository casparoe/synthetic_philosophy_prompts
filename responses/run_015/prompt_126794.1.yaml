answer: |-
  ### Prep Sheet: Durability-GWT Defense

  **Opening Concession (Say this in your intro to build credibility):**
  "I want to concede upfront that 'durability' is currently a functional placeholder. I don't have a precise millisecond threshold for when a broadcast becomes 'stable' enough to count as phenomenal, and I acknowledge that without a mapped neural correlate for this specific stability window, the theory risks being unfalsifiable. I'm arguing for a conceptual identity, but I admit the empirical markers are still coarse."

  ---

  ### The 8 Objections (Most to Least Damaging)

  **1. The Overflow/Iconic Memory Objection**
  *   **Who:** One of the GWT-friendly Cognitive Scientists.
  *   **The Question:** "Sperling's partial report paradigm suggests high-resolution iconic memory that decays *before* it can be accessed or reported. If phenomenology is just 'access with durability,' how do you account for rich phenomenal experience that exists *prior* to the stable global broadcast required for access? You're conflating the *potential* for access with access itself."
  *   **Your Reply:**
      *   Argue that partial report *is* a form of access, just a fragile, fleeting one.
      *   The "richness" of iconic memory isn't phenomenal consciousness in the full sense; it's a pre-conscious buffer.
      *   My claim is that *sustained* phenomenality requires the broadcast to stick. The fleeting "gist" in iconic memory is a different grade of access, not a separate phenomenal realm.
      *   Durability explains why the icon fades: the recurrent loop fails to stabilize the broadcast against the next input.
  *   **Soft Spot:** You are redefining "access" to include fragile, pre-reportable states. If they pin you on the standard definition of Access Consciousness (available for report/reasoning), you look like you're moving the goalposts.

  **2. The "Stability Isn't Subjectivity" Objection**
  *   **Who:** A committed Higher-Order Theorist.
  *   **The Question:** "You've explained the functional persistence of a representation. You haven't explained why that persistence feels like *anything*. A hard drive can store data durably without there being 'something it is like' to be the hard drive. Why does recurrent looping generate subjectivity rather than just deeper encoding?"
  *   **Your Reply:**
      *   I'm not trying to solve the Hard Problem from scratch; I'm dissolving the P/A distinction.
      *   The "feel" is the system's operational mode when a representation is flagged as high-priority for sustained processing.
      *   Subjectivity isn't an extra ingredient; it's the first-person perspective of a system managing stable resources. Durability is the functional correlate of "presence."
  *   **Soft Spot:** This is the weakest link. You are essentially asserting identity without explaining the explanatory gap. The HOT will smell functionalism hiding as phenomenology.

  **3. The Unconscious Durability Counter-Example**
  *   **Who:** The other GWT-friendly Cognitive Scientist.
  *   **The Question:** "We see evidence of working memory maintenance in prefrontal circuits during delay periods that subjects cannot report and claim no awareness of. That's durable access without phenomenology. If P is just durable A, why doesn't every sustained working memory trace feel conscious?"
  *   **Your Reply:**
      *   Distinguish between *local* maintenance (PFC buffers) and *global* broadcast durability.
      *   My theory requires the durability to be in the *broadcast* to sensory cortices, not just holding slots in working memory.
      *   Unconscious maintenance lacks the sensory recurrent loops I'm citing as the seat of the durability.
  *   **Soft Spot:** You need strong evidence that unconscious working memory *lacks* sensory recurrent loops. If they cite data showing sensory reactivation during unconscious delay periods, you're in trouble.

  **4. The Lesion/Causality Challenge**
  *   **Who:** The Skeptical Neuroscientist.
  *   **The Question:** "If phenomenal consciousness relies on these specific recurrent sensory loops for durability, lesioning them should abolish phenomenality while sparing access. Do we have lesion data showing that damaging posterior recurrent pathways kills 'feeling' but leaves 'reporting' intact? Or are you just storytelling?"
  *   **Your Reply:**
      *   Acknowledge the data is premature (lean into your opening concession).
      *   Point to TMS studies disrupting visual cortex that disrupt reportability and subjective rating simultaneously.
      *   Argue that current lesion data is too coarse to distinguish 'access' from 'durability' yet.
  *   **Soft Spot:** You are betting on future neuroscience. The skeptic will correctly note that you're building a theory on data that doesn't exist yet.

  **5. The Sorites/Threshold Problem**
  *   **Who:** The other Higher-Order Theorist.
  *   **The Question:** "Durability is a gradient. Consciousness seems binary (either I'm in pain or I'm not). At exactly what millisecond duration does a broadcast cross the line from 'unconscious access' to 'phenomenal experience'? If you can't name the threshold, the identity claim is vague."
  *   **Your Reply:**
      *   Reject the binary intuition. Consciousness *is* graded (e.g., drowsiness, fading awareness).
      *   The "binary" feel is a result of the workspace's all-or-nothing ignition, but the *phenomenal hold* is indeed graded.
      *   The threshold is likely dynamic, dependent on cognitive load, not a fixed time.
  *   **Soft Spot:** Admitting consciousness is graded undermines the standard intuition pumps you're trying to explain away. It makes the theory less intuitive to the audience.

  **6. The Attention Confound**
  *   **Who:** One of the Cognitive Scientists.
  *   **The Question:** "Isn't 'durability' just a synonym for 'sustained attention'? Attention stabilizes representations. Are you actually proposing a new theory of consciousness, or just renaming the relationship between attention and working memory?"
  *   **Your Reply:**
      *   Attention selects *what* enters the workspace; durability determines *how long* it stays conscious once there.
      *   You can have brief attention (orienting) without sustained phenomenology, and sustained phenomenology (afterimages) without active attention.
      *   Durability is the aftermath of attention, sustained by feedback, not the selection mechanism itself.
  *   **Soft Spot:** The distinction between "selection for broadcast" and "maintenance of broadcast" is neurophysiologically blurry. They might press you on the mechanism.

  **7. The Masking Objection**
  *   **Who:** The Skeptical Neuroscientist.
  *   **The Question:** "In backward masking, a stimulus is processed but phenomenology is wiped. If the initial broadcast occurred, why did the durability fail? Did the mask overwrite the loop, or did the broadcast never happen?"
  *   **Your Reply:**
      *   The mask interrupts the recurrent loop before it stabilizes.
      *   The initial feedforward sweep is access (unconscious), but without the recurrent durability, it never becomes phenomenal.
      *   This supports my view: Feedforward = Unconscious Access; Recurrent + Stable = Phenomenal.
  *   **Soft Spot:** This aligns well with your theory, but if they argue the feedforward sweep *is* sufficient for some access, you have to clarify the levels of access carefully.

  **8. The Labeling Objection**
  *   **Who:** The other Cognitive Scientist.
  *   **The Question:** "If you're stripping out the global ignition as the sole criterion and adding temporal stability in sensory cortices, why call this Global Workspace Theory? Isn't this closer to Recurrent Processing Theory (RPT)?"
  *   **Your Reply:**
      *   Because the *broadcast* is still necessary; RPT suggests local recurrence is sufficient.
      *   I maintain the Global Workspace is the stage, but durability is the spotlight's dwell time.
      *   It's a hybrid, but the Workspace architecture is still the central hub.
  *   **Soft Spot:** You are splitting hairs. If the heavy lifting is done by sensory recurrence, the "Global Workspace" label might be decorative.

  ---

  ### The Question I'm Hoping Nobody Asks

  **"If durability is the key, why does the *content* of the durability matter? Why does a durable broadcast of 'red' feel different from a durable broadcast of 'pain'? Durability explains the *presence* of experience, but doesn't your theory completely ignore the *qualitative character*?"**

  *   **Why I dread this:** It forces me to admit my theory explains the *onset/offset* of consciousness (the P/A identity), but offers zero explanation for *qualia*. It reduces my "revision" to a theory of awareness timing, not a theory of mind.

  ---

  Verdict: The Overflow/Iconic Memory Objection is the one that keeps me up at night.
