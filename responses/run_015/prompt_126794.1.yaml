prompt: |-
  Hey, I'm presenting next week to our philosophy of mind seminar and I'm defending this somewhat niche revision to global workspace theory. My claim is that phenomenal consciousness isn't a separate kind of state from access consciousness—it's just access with high broadcast durability, meaning representations that not only enter the global workspace but stick around long enough to resist being overwritten by the next round of broadcasting, probably sustained by recurrent loops in sensory cortices rather than prefrontal control. So there's no "phenomenal residue" left out by access; there's only graded stability, and the usual intuition pumps about "what it's like" are tracking this durability, not a mysterious extra property. The room will have two committed higher-order theorists who think phenomenal consciousness requires a meta-representational monitor, a couple cognitive scientists who are friendly to Baars-style workspace models but think I'm overfitting the neuroscience, and one skeptical neuroscientist who keeps saying consciousness research is premature without more lesion studies. I need a prep sheet for the Q&A: the eight or so objections I'll actually recieve, ordered from most damaging to least, phrased the way each group would put it, with a two-minute reply and a honest note on where my reply is soft. Include what I should concede right at the start to build credibility, and the one question I'm hoping nobody asks. Don't give me generic philosophy-of-mind objections—make them target the durability/graded-access move specifically. End with a line that starts with Verdict: and names the objection I'm dreading most.
