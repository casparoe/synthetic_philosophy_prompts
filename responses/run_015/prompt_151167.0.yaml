      *   **Core Conflict:** Can you define "side effects" structurally/syntactically without embedding human values? (Maya: Yes, via counterfactuals/divergence. Jonas: No, values are hidden in counterfactual choice/variable selection.)

  2.  **Analyze Round 1:**
