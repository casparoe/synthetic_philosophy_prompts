      *   *The Twist:* Co-presence. Not conversion. The beauty *needs* the death to be beautiful. If Seita and Setsuko lived, the fireflies wouldn't be as poignant. This aligns more with contemporary cognitive theories or perhaps a darker Romanticism (Keats' "Melancholy dwells with Beauty").
