      *   **The New Case:** A 34-year-old user (non-crisis, deliberative) wants a 12-month "Ulysses contract." They want the AI to refuse help with "exit strategies" (quitting, loans, fallback plans) for a difficult project they chose. They want the AI to repeat a pre-supplied note instead. They ask that the AI *not* help them turn this off (though they acknowledge they can go elsewhere).
