answer: |-
  What you are experiencing is the fundamental challenge of type design. You have discovered that an alphabet is not a collection of twenty-six drawings, but a single **system** governed by an **internal logic**.

  There is no single English noun that perfectly captures this, because it is a composite of a philosophical concept, a structural relationship, and a visual technique. However, type designers and theorists use three specific concepts to describe exactly what you are feeling.

  ### 1. The Logic: "Family Resemblance"
  The philosophical problem you described—rules that feel true but have non-arbitrary exceptions—is precisely what the philosopher Ludwig Wittgenstein called **Family Resemblance**.

  Wittgenstein used the example of "games." There is no single rule that defines all games (some have balls, some don't; some have winners, some don't). Instead, they share a network of overlapping similarities. A typeface works the same way. There is no geometric rule that defines your "stroke," but there is a **visual kinship**.

  *   **What it is:** The quality that allows two things to be recognized as belonging to the same group without being identical.
  *   **Why it fits:** It explains why making the strokes *geometrically* identical looks wrong. In a family, a father and son look related, but if they looked like identical twins, the relationship would feel uncanny. Your *a*, *g*, and *y* are siblings, not clones.
  *   **Boundary Case:** A "display font" (like one made of bubbles and one made of spikes) might lack family resemblance between letters, creating an eclectic or chaotic feel. A text font requires high family resemblance to create a smooth reading texture.

  ### 2. The Structure: "Homologous Strokes"
  You asked for a concept for "whatever makes two different marks in different letters the *same* stroke." In typography and calligraphy theory, these are called **Homologous Strokes** (or **Corresponding Elements**).

  In biology, a human arm, a whale flipper, and a bat wing are homologous structures: they serve different functions and look different, but they share the same underlying skeletal structure because they evolved from the same source.

  In your alphabet, the terminal of the *a*, the ear of the *g*, and the tail of the *y* are homologous. They are different manifestations of the same **design DNA**.

  *   **What it is:** Strokes that derive from the same conceptual origin (usually the angle of the pen, the curvature of the brush, or the vector of the hand).
  *   **Why it fits:** This explains the "cascading" effect. If you change the terminal on the *a*, you are effectively changing the "skeleton" of the alphabet. The *g* and *y* immediately look wrong because their homologous parts no longer match the new DNA. You aren't just changing a shape; you are changing the **Implied Ductus**.
  *   **Implied Ductus:** *Ductus* is the order and direction of the pen strokes used to write a letter. Even if you are drawing, you are implying a tool. If the *a* implies a pen held at a 45-degree angle, but the *y* implies a 30-degree angle, the homologous strokes will clash. Changing one forces you to align the implied tool across the whole set.

  ### 3. The Execution: "Optical Compensation"
  You noted that when you made the strokes literally identical, the alphabet looked wrong. This is because you were aiming for **Geometric Consistency** when the eye requires **Optical Consistency**.

  The established concept for the adjustment you are making is **Optical Compensation** (or **Optical Correction**).

  *   **What it is:** The deliberate distortion of geometric shapes to make them *appear* consistent to the human eye.
  *   **Why it fits:** A horizontal stroke often needs to be thinner than a vertical stroke to look the same weight. A terminal on a small letter might need to be slightly larger than one on a tall letter to feel balanced. Your brain knows these strokes are "the same," so it demands they *feel* the same, even if their measurements differ.
  *   **Boundary Case:** In geometric sans-serif fonts (like Futura), designers often minimize optical compensation to embrace mechanical repetition. In humanist scripts (like Garamond or your hand-lettering), optical compensation is high. If you apply geometric consistency to a humanist design, it looks "dead" or "digital."

  ### Is this the same problem as "What makes an *a* an *a*?"
  No. This is a separate, often opposing, problem.

  *   **Letter Identity (Legibility):** This is about **Differentiation**. To make an *a* an *a*, it must look distinct from an *o*, a *u*, or an *e*. This pushes letters *apart*.
  *   **Systemic Coherence (Your Problem):** This is about **Cohesion**. To make the alphabet a *typeface*, the *a* must look like it belongs with the *g*. This pulls letters *together*.

  Type design is the negotiation between these two forces. If you prioritize identity too much, the alphabet looks like a set of unrelated symbols (like the "Dingbat" fonts). If you prioritize coherence too much, letters become indistinguishable (like a poorly designed minimalist font where *i*, *l*, and *j* look identical).

  ### Summary of Terms
  If you need to label this in your project documentation, do not use "Style" or "Consistency." Instead, use this combination:

  1.  **Systemic Coherence:** The cascading interdependence of the letters.
  2.  **Homologous Details:** The specific strokes (terminals, ears, tails) that share a design origin.
  3.  **Optical Harmony:** The result of adjusting those details for the eye rather than the ruler.

  You are not drawing letters; you are designing a **system of relationships**. The "thing" you are chasing is the **Internal Logic** of that system. When you change the *a*, you are rewriting the logic, so the *g* and *y* must be updated to comply with the new law.
