      *   *Proposed Phrasing:* "Under which modes of cultural cultivation—deliberate policy, emergent convergence, or structural constraint—does guilt or shame prove normatively superior for sustaining moral pluralism?" Or even tighter: "Does the normative defensibility of guilt versus shame depend on the mode of cultural cultivation?"

  3.  **Address the Literature Gap:**

