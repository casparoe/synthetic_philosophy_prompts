answer: |-
  Good evening, everyone. For those who don't know me, I'm a third-year PhD student in the department, working in proof theory. My supervisor, who organized this excellent workshop, is unfortunately absent for a wedding, which I'm told is a valid excusal from after-dinner remarks, though apparently not from the duty of assigning them. So, here I am.

  Looking around this table, I see a clean split. On my left, the logicians, some of whom would frankly rather be discussing forcing than metaphysics. On my right, the historians, the undergraduates who are here for the wine, and my partner's parents, who are lovely people and still under the impression I do something with computers. I need to make this work for all of you.

  The challenge of a workshop like this is how to treat Gödel's philosophical views. It is very easy to treat his theism and his belief in an afterlife as a charming eccentricity, a sort of spiritual hobby of a great mathematician. We tend to compartmentalize: the incompleteness theorems are the rigorous work; the letters to his mother arguing for the rationality of the soul are the private musings.

  But Gödel did not compartmentalize. To treat his belief in an afterlife seriously is to recognize that for him, it was not a comfort, but a conclusion. It was the final term in a long derivation that began with Platonism. He believed that mathematical objects exist independently of us, and that we grasp them through a form of intuition. He simply extended that same rationalist framework to moral and theological concepts. If reason can access the concept of a number, why not the concept of a deity? If the mathematical world is timeless, why not the mind that perceives it?

  There is a moment in the history of this argument that I find quietly moving. Gödel worked on his modal ontological proof for decades. He kept it private, largely because he feared people would think he was proving God's existence rather than exploring the logical consistency of the concept. It was only in 1970, when he believed he was dying, that he allowed Dana Scott to copy the notes. He didn't release it to convert the world; he released it to ensure the derivation survived him. That is not the act of a man seeking comfort. It is the act of a man ensuring the record is complete.

  Now, I should be honest. Almost no one in this room, myself included, shares Gödel's conclusions. We are not Platonists of that stripe. We are not theists in that mode. But our skepticism should not be a wink. We should not smile at him as if he were confused. We should engage with the architecture of his thought.

  However, engaging with it requires us to avoid a specific trap. There is a temptation, especially at a dinner like this, to reach for the First Incompleteness Theorem as a metaphor for the beyond. We want to say that because there are true statements unprovable within a system, there are spiritual truths unprovable by science. I am a proof theorist, and I am here to ask you not to do that. Incompleteness is a result about formal systems and arithmetic expressibility. It is not an epistemic gap license. It does not validate mysticism. Let us honor Gödel's rigor enough not to misuse his theorems to plug holes in our own metaphysics.

  So, if we accept his logic but reject his conclusion, where is the break in the chain? It is not in the modal logic itself; the derivation is valid. The weak link is the axiom of intuition. Gödel assumes that the faculty of rational intuition which reliably grasps mathematical concepts is equally reliable when grasping metaphysical concepts like "positive properties." He treats metaphysical axioms as self-evident in the same way logical axioms are. As proof theorists, we know that axioms are choices. We can accept the validity of his argument while rejecting the self-evidence of his premises. The bridge from mathematical realism to theological realism rests on an assumption about human cognitive faculties that we are no longer willing to make.

  But identifying that weak link does not spoil what we have done these past two days. We are not here to validate his theology. We are here to witness the sheer scale of his rationalism. He demanded that his deepest hopes submit to the same scrutiny as his mathematics. He asked that his faith be consistent.

  That is the legacy worth debating, regardless of which side of the table you sit on, and regardless of what my partner's parents think I do for a living. We are here because Gödel showed us that the structure of our questions matters more than the settlement of our answers.

  Please raise your glasses.

  To Kurt Gödel, for proving that rigor is the highest form of hope.
