answer: |-
  This exam question asks you to engage deeply with Robert Nozick's famous utility monster objection to utilitarianism and aggregative moral theories more broadly. In the standard formulation, Nozick imagines a being who gains significantly more utility from resources than any normal person. If morality requires maximizing total utility, it seems we ought to feed the monster even if it means starving everyone else. This is intended to show that aggregative views violate the separateness of persons by treating society as a single container for welfare. However, this seminar challenges you to look deeper than the standard textbook response. We are interested in isolating exactly which feature of the case drives the intuitive objection. Is it the aggregation itself, or is it something contingent about the setup, such as scarcity or the concentration of benefits in a single subject? To test this, consider two modified variants. The first is the closed-loop monster. This being experiences enormous welfare, but its welfare comes entirely from internally generated experiences that use up nothing anybody else could have used. There is zero opportunity cost to its existence. It experiences cheap bliss without consuming resources that could have gone to others. The second variant is the swarm. In this case, nobody is above average in terms of welfare capacity. Instead, there is a very large population of individuals, each of whom is very slightly more efficient at turning resources into welfare than the rest of the population. If you give resources to the swarm members rather than the average people, total welfare is maximized. However, this still requires holding everyone else at subsistence to feed the slightly more efficient many. There is no single dominant subject here, only a coalition of the slightly better off. Finally, consider the mirror-image case called the dud. This is a person for whom resources produce vanishingly little welfare. On standard aggregative views, no resources seem to be owed to the dud because giving them resources yields almost no return in total welfare terms.

  Your task is to analyze what is doing the work in the original intuition against the monster and how that analysis shifts across these variants. Specifically, you must determine whether the objection holds against the closed-loop monster where scarcity is removed, and whether it holds against the swarm where concentration is removed. If the objection fails in the closed-loop case, does that save aggregation from the charge of ignoring separateness, or does it merely show that we only care about separateness when resources are scarce? If the objection holds in the swarm case, does that prove aggregation is the problem, or does it show that we care about equality independently of total welfare? Once you have established what drives the intuition in these positive cases, you must apply that same logic to the dud. If your analysis suggests the monster should be fed, are you committed to starving the dud? If your analysis suggests the monster should not be fed despite the welfare gains, do you have a consistent reason to feed the dud despite the welfare losses? You are not being asked merely to state your preference but to trace the theoretical implications of your judgment. A successful answer will identify whether the moral weight lies in the structure of aggregation, the conditions of scarcity, the distribution of agency, or the baseline entitlements of persons. You should write approximately one thousand words. You have forty-five minutes to complete this question. Ensure your response is structured as a coherent essay rather than a list of points. Do not simply restate the prompt but engage with the philosophical mechanics of each variant. Consider whether the intuition against the monster relies on the victimization of others or the absurdity of the outcome. Consider whether the swarm variant undermines the idea that the problem is specifically about one person dominating others. Consider whether the dud case reveals a hidden commitment to sufficientarianism or prioritarianism that contradicts pure aggregation. Your grade will depend on the precision of your distinctions and the consistency of your application across all three cases. Make sure you address the relationship between opportunity cost and moral obligation. Make sure you address whether the number of people in the swarm matters for the moral calculus. Make sure you address whether the dud has rights independent of their welfare capacity. This is not a test of memorization but of theoretical manipulation. You must show you can take a core argument and stress-test it against modified conditions. Do not assume the standard objection holds without qualification. Do not assume the aggregative view is automatically refuted by the existence of counterintuitive cases. Your goal is to diagnose the source of the tension. Write clearly and argue rigorously.

  The core philosophical work in the utility monster debate is often misidentified as a simple rejection of aggregation, but these variants reveal that the intuition relies heavily on scarcity and the separateness of persons understood as a constraint on sacrifice. In the closed-loop case, the removal of opportunity cost fundamentally changes the moral landscape. If the monster's bliss costs nothing, refusing to let it exist or experience that bliss looks like spite rather than justice. Aggregationism survives this variant comfortably because the objection was never about total welfare being high, but about total welfare being purchased at the expense of others. Therefore, the closed-loop monster does not refute aggregation; it refutes the idea that aggregation necessarily implies sacrifice. However, the swarm variant is more damaging to the aggregative view because it removes the concentration of benefit while retaining the sacrifice. Here, many people gain slightly more, but others starve. If the intuition against feeding the swarm remains strong, it suggests the problem is not the monster's uniqueness but the act of sacrificing some for the greater sum itself. This points to a deontological constraint or a prioritarian view that weights the interests of the worse off more heavily. The swarm shows that aggregation violates equality or sufficientarian thresholds regardless of whether one subject dominates. This leads directly to the dud. If we reject the monster because we refuse to sacrifice the many for the one, we might still accept starving the dud if it helps the many. But if we reject the swarm because we refuse to sacrifice the few for the many, consistency demands we protect the dud even if their welfare contribution is low. The dud case exposes whether our theory is based on welfare maximization or personhood. If the dud is owed resources despite low welfare capacity, then welfare is not the sole currency of justice. This implies that the original monster objection was actually about rights or entitlements that exist prior to welfare calculation. Therefore, the intuition against the monster is not just about aggregation but about the conditions under which aggregation is permitted. It is permitted when there is no opportunity cost, as in the closed-loop, but prohibited when it violates baseline entitlements, as in the swarm and the dud. The consistent position is that persons have a claim to resources independent of their efficiency in converting them to welfare. This saves us from the monster and the swarm while protecting the dud. It suggests that aggregative views must be constrained by side constraints or a sufficientarian floor. Without such constraints, the logic that feeds the monster also starves the dud, which is equally repugnant. The work is done by the concept of moral status, not merely the math of welfare.

  This marking scheme is out of twenty points and should be applied holistically based on the coherence and depth of the student's analysis. Ten points are awarded for the accurate analysis of the closed-loop and swarm variants. Students must identify that the closed-loop removes the opportunity cost objection, thereby weakening the case against aggregation in that specific instance, and they must identify that the swarm removes the concentration objection, thereby strengthening the case that aggregation itself is the problem when sacrifice is involved. Five points are awarded for the application of this logic to the dud case. Students must show whether their stance on the monster commits them to neglecting or protecting the dud, and they should recognize that protecting the dud requires a non-aggregative principle like rights or sufficientarianism. Five points are awarded for overall argumentative consistency and clarity. Students lose significant marks if they treat the swarm as just the monster with extra steps rather than recognizing it tests concentration versus aggregation. Students also lose significant marks if they argue that it is a reductio so the aggregative view is refuted without explaining which premise is unacceptable or what alternative theory handles the cases better. Simply stating that utilitarianism is wrong because the outcome is bad is not an argument in this context. Students gain marks for distinguishing between scarcity-driven intuitions and aggregation-driven intuitions. Students gain marks for recognizing that the dud case is the mirror test for their theory of the monster. Students lose marks for failing to address all three cases or for contradicting themselves between the swarm and the dud analysis. The goal is to see if they can isolate the variable causing the moral discomfort.
