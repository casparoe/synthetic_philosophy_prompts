      *   *L2:* "Partially Correct." The concern about diachronic agency is real (randomness can feel like alienation), but the conclusion that it breaks agency is too strong.
      *   *C2:* "Mostly Correct." The distinction between rationality and causal explanation is key. The QM analogy is a bit flashy but supports the point well enough.

