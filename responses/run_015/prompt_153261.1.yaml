      *   *Better Decision (aligning with prompt):* The prompt asks for asymmetric awareness about We-mode vs I-mode.
      *   *Setup:* 2 players get "Architect Cards" (We-Mode: Success = Pyramid). 2 players get "Contractor Cards" (I-Mode: Success = Personal Tension + Bonus if Pyramid).
      *   *The Kicker:* The "Contractor" card has a clause: "If tension becomes too high (risk of dropping), you may release your string to secure 5 points individually. If you do, the Pyramid is impossible."
