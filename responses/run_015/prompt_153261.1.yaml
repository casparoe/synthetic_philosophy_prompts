      *   *The specific failure:* Participants will try to coordinate based on individual utility maximization (I-mode) even when the task requires a structural interdependence that only exists if they treat the group as a single agent (We-mode).
      *   *The "Normative Shift":* In joint action, if I drop out, I don't just let you down; I dissolve the *possibility* of the action continuing as planned. You aren't just struggling; you are no longer doing *that* action.
      *   *The Game Mechanic:* A physical balancing act. If everyone holds tension, the structure stands. If one lets go, it's not that the structure gets weaker; it's that the structure *collapses* and becomes a different physical state (a pile of cups) where the original goal is impossible, not just harder.
      *   *The Hidden Twist:* Some players are told "Maximize your points" (I-mode), others are told "Ensure the Group succeeds" (We-mode). But crucially, the *rules of success* change if the We-mode breaks.

  3.  **Designing the Activity: "The Tension Tower"**
      *   *Materials:* 4 cups, 4 strings tied together in a cross (or a central ring with 4 strings), per group.
      *   *Task:* Lift the cups from a table and stack them into a pyramid using only the string device (each person controls one string end).
      *   *The Catch:* To stack them, tension must be perfectly balanced.
      *   *The Normative Twist:* The scoring rules need to reflect the philosophical distinction.
      *   *Hidden Roles:*
          *   Type A (We-Mode): "Your goal is the Group Pyramid."
          *   Type B (I-Mode): "Your goal is Individual Tension Stability."
