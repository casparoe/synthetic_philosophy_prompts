      *   *The Philosophical Hook:* The I-mode players might think, "If I let go, I save effort/risk, and maybe the others can still get *some* points." The We-mode reality is: "If you let go, the *joint action* ceases to exist. We are no longer 'stacking a pyramid'. We are now three people holding strings attached to fallen cups."
