      *   *Hidden Info:*
          *   Players 1 & 3 (Architects): "You must coordinate to stack. You cannot succeed alone."
          *   Players 2 & 4 (Contractors): "You gain 10 pts if Pyramid stacks. HOWEVER, if you feel the tension is unstable, you may 'Secure' (let go). If you Secure, you get 5 points guaranteed. The others get whatever remains possible."
      *   *The Trap:* The Contractors will think "I'm being rational." The Architects will feel "You broke the commitment."
      *   *The Normative Redefinition:* The debrief needs to highlight that when Player 2 lets go, Player 1 isn't just playing a harder game; the *game itself* (Joint Action) has dissolved.

