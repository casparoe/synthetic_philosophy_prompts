prompt: |-
  you're a professional workshop designer for philosophy grad seminars — think carefully step by step, and start with a quick brainstorm of the exact conceptual failure mode you want particpants to hit. i run a 90-minute session on collective intentionality and joint action for about 16 grad students, and i want an in-class game that makes them feel teh difference between summed individual intentions and genuinely joint action, especially the bit about mutual commitment changing the normative structure rather than just the payoff. the rules and hidden roles should push them into running into the problem themselves before anyone names it afterwards.

  design the full runnable activity: split into groups of four, materials using just paper cups and string, a payoff scheme in points not cash, hidden frame cards that create asymmetric awareness about whether we're in we-mode or i-mode, and a specific mechanical vulnerability where one person's withdrawal doesn't just lower the score but actually redefines what counts as success for the remaining people. include a debrief that maps specific moments in the game onto parts of the idea, say what will predictably go wrong the first run and how to fix it, and be honest about which feature of joint intentionality the game can't reproduce and i have to supply verbally. please dont ask for citations or reading lists — i need this runnable without web access. also i was discussing with friends whether true joint action requires everyone to know everyone knows we're committed, or just mutual belief — inject that tension into the hidden information structure if it fits.
