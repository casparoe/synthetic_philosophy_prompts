answer: |-
  # Workshop Activity: "The Constitutive Tension"

  **Topic:** Collective Intentionality (We-Mode vs. I-Mode, Mutual Commitment, Normative Structure)
  **Time:** 90 Minutes
  **Participants:** 16 Grad Students (4 Groups of 4)
  **Materials:** 16 Plastic Cups, 4 "String Harnesses" (4 strings tied to a central rubber band loop), Printed Role Cards, Score Sheets.

  ---

  ## 1. Conceptual Failure Mode (Designer's Notes)
  **The Target:** Participants typically model joint action as *aggregative*: "We act together" = "I do my part + You do your part." They view commitment as a promise that increases the *cost* of defection.
  **The Failure:** You want them to hit the wall where they realize joint action is *constitutive*: "We act together" = "The action only exists if we sustain the 'We'."
  **The Mechanic:** If one person defects (drops tension), the remaining players do not face a *harder* version of the same task. The task *ceases to exist*. They are no longer "stacking a pyramid"; they are "holding slack strings." The normative status of their remaining movements changes from *cooperation* to *futile motion*. This mirrors the Gilbert/Tuomela claim that joint commitment creates a new normative subject (the plural subject) that dissolves upon unilateral withdrawal.

  ---

  ## 2. Setup & Materials (10 Minutes)

  **Physical Arrangement:**
  *   4 Tables, 4 students per table.
  *   **The Harness:** Tie 4 pieces of string (approx. 50cm each) to a single large rubber band in a cross shape.
  *   **The Cups:** 4 cups per group, stacked initially in a loose pile on the table.

  **Distribution:**
  *   Hand out **Role Cards** face down. Tell students: *"Do not show your card to anyone. Do not discuss the text on the card until the 'Negotiation Phase'."*
  *   **2 Students per group get Card A (Architect).**
  *   **2 Students per group get Card B (Contractor).**
      *   *Designer Note:* Seat them alternately (A-B-A-B) around the table so no one knows who holds which role based on seating.

  **The Cards:**

  > **CARD A: ARCHITECT (We-Mode Frame)**
  > *   **Primary Goal:** The Group must build a 3-level Pyramid (Base 2, Mid 1, Top 1).
  > *   **Constraint:** The Pyramid is a **4-Person Object**. It is defined by the tension of all 4 strings.
  > *   **Scoring:**
  >     *   Pyramid Completed: **10 Points** each.
  >     *   If the Pyramid collapses: **0 Points**.
  > *   **Epistemic Instruction:** Assume your partners share this goal. You cannot succeed alone.

  > **CARD B: CONTRACTOR (I-Mode Frame)**
  > *   **Primary Goal:** Maximize your individual point yield.
  > *   **Option 1 (Cooperate):** Help build the Pyramid. If successful: **10 Points**.
  > *   **Option 2 (Secure):** If you feel the tension is unstable (risk of dropping), you may release your string.
  >     *   If you Release: You guarantee **5 Points**.
  >     *   **Consequence:** Releasing your string makes the Pyramid physically impossible. The task defaults to "Debris Recovery" for remaining players.
  > *   **Epistemic Instruction:** You do not know if others are Architects or Contractors. Protect your minimum yield.

  **The Rule Sheet (Read Aloud to All):**
  1.  Use the harness to lift and stack cups. Hands cannot touch cups.
  2.  **Constitutive Rule:** The "Pyramid" is valid *only* if maintained by 4 active strings. If any string goes slack or is released, the "Pyramid Task" is **Voided**.
  3.  If Voided, remaining players may attempt a "Line" (cups in a row) for **2 Points** each.
  4.  Round 1 is Silent. No talking.

  ---

  ## 3. Round 1: The Epistemic Trap (20 Minutes)

  **Procedure:**
  1.  Give groups 5 minutes to attempt the stack in total silence.
  2.  **The Trap:** The "Contractors" will feel the physical instability of the cups. Their rational choice (guaranteed 5 vs. risky 10) tempts them to "Secure."
  3.  **The Failure:** When a Contractor releases, the Architects will likely try to keep stacking.
  4.  **The Intervention:** As the facilitator, walk around. If a string goes slack, immediately intervene. Do not say "You failed." Say: *"String 3 is slack. The Pyramid Task is Voided. You are now in Debris Recovery."*
      *   *Why:* This enforces the **Normative Shift**. The Architects aren't just playing badly; they are engaging in a category error. They are trying to perform a joint action that no longer exists.

  **Expected Outcome:**
  *   Most groups will fail to stack.
  *   Contractors will "Secure" mid-attempt.
  *   Architects will feel frustration not just at the loss of points, but at the *meaninglessness* of their continued effort. "Why are we still lifting? The pyramid is gone."

  ---

  ## 4. The Negotiation Phase (15 Minutes)

  **Instruction:**
  *"You have 10 minutes to discuss your previous performance. You may now reveal your Role Cards if you choose. You may make promises, threats, or agreements. You have 5 minutes to attempt Round 2."*

  **The Philosophical Injection (Mutual Knowledge vs. Belief):**
  *   In Round 1, they had *Mutual Belief* (everyone likely believed everyone else wanted the pyramid), but not *Common Knowledge* (they didn't *know* that everyone *knew* the commitment structure).
  *   In this phase, they can establish Common Knowledge.
  *   **The Tension:** Can a Contractor *credibly* commit? If an Architect knows a player is a Contractor, can they ever truly treat them as a joint partner, or are they always a risk? This mirrors the debate on whether joint intention requires a specific type of irrevocable commitment (Gilbert) or just interlocking conditional intentions (Bratman).

  ---

  ## 5. Round 2: The Normative Test (15 Minutes)

  **Procedure:**
  1.  Groups attempt the stack again with communication allowed.
  2.  **Observation Point:** Watch if the Contractors actually commit or if they hedge ("I'll try, but if it wobbles...").
  3.  **Observation Point:** Watch if the Architects treat the Contractors as full partners or as liabilities. Do they create a "We" that includes the Contractors, or do they try to coerce them?

  ---

  ## 6. Debrief & Mapping (30 Minutes)

  **Step 1: Phenomenological Report (10 mins)**
  *   Ask the Architects: *"When the Contractor let go in Round 1, what happened to your action? Did it get harder, or did it change?"*
      *   *Target Answer:* "It became pointless. We weren't 'stacking' anymore."
  *   Ask the Contractors: *"Did you feel you were breaking a rule, or just taking a safe option?"*
      *   *Target Answer:* "I was playing the game as written for me."

  **Step 2: Conceptual Mapping (15 mins)**
  Draw three columns on the board: **Aggregative**, **Joint**, **Normative**.

  | Feature | Round 1 Experience (I-Mode/Aggregative) | Round 2 Ideal (We-Mode/Joint) | Philosophical Concept |
  | :--- | :--- | :--- | :--- |
  | **Goal** | My Points + Your Points | **Our** Pyramid | Tuomela's We-Mode |
  | **Defection** | Lowers group utility | **Dissolves** the action | Gilbert's Joint Commitment |
  | **Obligation** | Prudential (Don't lose points) | **Normative** (You owe it to us) | Obligation to the Plural Subject |
  | **Epistemics** | "I think you want this" | "We know we want this" | Common Knowledge / Mutual Belief |

  **Key Discussion Questions:**
  1.  **The Normative Shift:** "When I declared the task 'Voided' after one string dropped, did that feel fair? Or did it feel like I was changing the rules?"
      *   *Point:* This illustrates that the *rules of joint action* are internal to the commitment. If the 'We' dissolves, the 'Action' defined by the 'We' cannot persist.
  2.  **The Contractor Problem:** "In Round 2, even if the Contractor promised to hold, did the Architect *trust* them fully?"
      *   *Point:* This addresses your friends' question. Does joint action require *irrevocable* commitment (Gilbert) or just stable mutual belief (Bratman)? If the Architect is still watching for the 'Secure' signal, is it truly a 'We'?
  3.  **The Redefinition:** "Why couldn't the remaining 3 just build a smaller pyramid?"
      *   *Point:* Because the *definition* of the action was constituted by the 4-person agreement. Changing the participants changes the action identity.

  **Step 3: Limitations (5 mins)**
  *   **Be Honest:** "This game uses points (consequentialism). Real joint action often involves deontological obligations (doing it because we said we would, regardless of points). The game simulates the *structure* of commitment, but not the *moral weight*."
  *   **Continuity:** "In the game, dropping is binary. In real life, 'letting go' is often gradual (loss of enthusiasm). The game exaggerates the break to make the normative shift visible."

  ---

  ## 7. Predictable Failure Modes & Fixes

  **Failure 1: The "Physical Skill" Distraction**
  *   *Risk:* Students blame the failure on shaky hands, not the game theory.
  *   *Fix:* Run a 2-minute "Practice Round" with no scoring and no cards before Round 1. Ensure everyone knows the mechanics of the harness. The failure must be *social*, not *motor*.

  **Failure 2: The "Contractor" Guilt**
  *   *Risk:* Contractors feel socially pressured to ignore their card and never "Secure," ruining the tension.
  *   *Fix:* As facilitator, whisper to Contractors during Round 1: *"Remember, your card explicitly permits securing. It is a valid move."* Legitimize the I-mode to make the conflict real.

  **Failure 3: The "Voiding" feels Arbitrary**
  *   *Risk:* Students argue, "We could have still stacked 3 cups!"
  *   *Fix:* Pre-empt this in the Rule Read-through. Emphasize: *"The Pyramid is a 4-Person Object. This is not a physical limit; it is a constitutive rule."* Repeat this phrase in the debrief. It is the core philosophical lesson.

  ---

  ## 8. Addressing the "Mutual Knowledge" Tension
  *   **In the Game:** Round 1 represents **Mutual Belief** (I believe you intend J, you believe I intend J). Round 2 represents **Common Knowledge** (We openly acknowledge our intentions).
  *   **The Lesson:** If Round 2 succeeds significantly more than Round 1, it suggests Common Knowledge is required for stable joint action. If Round 2 still fails because Contractors keep the "Secure" option open, it suggests that *content* of the intention matters more than the *epistemic state*. (i.e., You can't have joint action if one party retains a unilateral exit clause).
  *   **Verbal Supply:** You must explicitly state in the debrief: *"The game forces a binary exit. In reality, the tension is whether retaining a private exit clause is compatible with the 'We'. Gilbert says no. Bratman says maybe. How did it feel to be an Architect knowing a Contractor had an exit clause?"*

  ---

  ## 9. Runnable Checklist
  *   [ ] 16 Cups (check for cracks).
  *   [ ] 4 Harnesses (test tension beforehand).
  *   [ ] 8 Architect Cards / 8 Contractor Cards.
  *   [ ] Scoreboard on whiteboard.
  *   [ ] Timer visible to all.
  *   [ ] Facilitator script for the "Voiding" declaration (keep it cold and bureaucratic to emphasize normative rule-following).

  **Facilitator Script for "Voiding":**
  *"Stop. String 2 is slack. The 4-person condition is broken. The Pyramid Task is Voided. You are now in Debris Recovery. Continue only if you wish to pursue 2 points."*
