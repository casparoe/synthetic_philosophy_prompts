prompt: |-
  Hey — I got roped onto the board of the housing co-op I live in about four months ago, and right now we're having what feels like the dumbest possible fight: whether to put up a printed schedule of fines for people who leave the shared workshop and bike room in a mess. I have this nagging feeling that the whole argument is missing something, but I can't put a name on it, which makes it very hard to argue in a meeting.

  Here's the pattern I keep seeing — I've now noticed it three times. Case one, our own bike room: for years it was fine. Not spotless, but people mostly racked their bikes, swept up, and the two or three guys who used it most ran the place quietly — if someone left a bike in the middle of the floor for a week they'd get a friendly-but-not-friendly word. Nobody was ever charged anything. Last year the board put in a twenty-dollar fine for bikes left in the walkway, with a sign and a form to fill out. And now nobody leaves bikes in the walkway, but the room is objectively worse. People do exactly what the sign says and nothing more: tools from the shared bench stay out, nobody sweeps, the pump got stolen and nobody said anything. And the two or three guys who used to enforce things have completely stopped, because saying something now feels like reporting someone to an authority instead of just being a person who minds. Case two: my brother's volunteer trail crew got a sponsor offering a small cash bonus for the crew logging the most trail miles. Miles went up, quality went down, and nobody does the jobs that don't have a number attached anymore. Case three: a neighbourhood tool library near my old place added an app where you check tools in and out. Same shape of thing. The thing is, in every case the people didn't stop caring — if anything they talk about the shared thing more than they used to. What changed is what they do about it, and who is allowed to say something. And the bit that actually worries me: I think this is one-way. If we tear the sign down next year, I don't think the old arrangement comes back, because the people who moved in during the fine era never learned it and the old enforcers got out of the habit.

  So: does this have a name? Not the general 'people game whatever you measure' thing — a friend keeps saying that's Goodhart's law, but as I understand it that's about the number becoming unreliable for the people reading it, whereas what I'm describing is about the act changing meaning for the person doing it, about the informal enforcement dying rather than just being crowded out, and about it being irreversible. Someone else said moral hazard, but nobody's risk exposure is changing what they do here as far as I can tell. I don't want a label I can drop in a board meeting; I want to know whether the three things I'm describing are really one thing or three, what the nearest established concepts are and exactly how my cases differ from each, whether the irreversibility part has its own literature (something about norms needing to be transmitted to newcomers?), and if there's no established concept that fits, I'd like a proposed name with a definition that says what would and wouldn't count as an instance. Please also settle the boundary cases: is it the same phenomenon when the new rule is a reward rather than a fine, is it the same thing when the outcome is better on the measured dimension and worse on every other one, and is it still this phenomenon if the old informal norm was never actually healthy — say it was really just two guys being territorial?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is on a housing co-op board. There's a debate about posting a schedule of fines for messes in shared spaces (workshop/bike room).
      *   **Observation:** The user sees a pattern where introducing formal rules/fines/rewards kills informal social norms and community enforcement, leading to overall worse outcomes despite compliance on the specific measured metric.
      *   **Specific Examples:**
          1.  Bike room: Fines stopped walkway blocking but killed sweeping, tool care, and informal peer enforcement.
          2.  Trail crew: Cash bonus for miles increased miles but decreased quality and unmeasured work.
          3.  Tool library: App check-in/out changed behavior similarly (implied degradation of care/trust).
      *   **Key Characteristics Identified by User:**
          *   Not just "gaming the metric" (Goodhart's Law).
          *   Change in *meaning* of the act (from caring for community to complying with authority).
          *   Death of informal enforcement (social pressure replaced by bureaucratic reporting).
          *   **Irreversibility/Hysteresis:** Once the norm is broken, removing the rule doesn't restore the old state (newcomers didn't learn the old norm, old enforcers lost the habit).
      *   **Questions:**
          *   Does this have a name?
          *   Are the three cases one thing or three?
          *   How do they differ from established concepts (Goodhart, Moral Hazard)?
          *   Is there literature on the irreversibility/norm transmission aspect?
          *   If no name exists, propose one with a definition.
          *   Settle boundary cases (rewards vs. fines, measured improvement vs. overall decline, unhealthy prior norms).

  2.  **Initial Brainstorming & Concept Matching:**
      *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure." User says this isn't quite it because it's about the *social dynamic*, not just the metric failing.
      *   *Moral Hazard:* Usually about risk-taking because someone else bears the cost. Doesn't fit well here.
      *   *Crowding Out Effect:* This is the strongest economic/psychological match. Specifically, *Motivation Crowding Theory*. Intrinsic motivation (caring for the space) is crowded out by extrinsic motivation (fines/rewards).
      *   *The "Overjustification Effect":* Psychological term for when external incentive decreases intrinsic motivation.
      *   *Norm Erosion / Norm Displacement:* Sociological terms.
      *   *The "Cobra Effect":* Perverse incentive. Close, but usually implies the opposite outcome on the *target* metric, whereas here the target metric improves (no bikes in walkway) but side effects worsen.
      *   *Hysteresis:* The irreversibility aspect.
      *   *Bowles & Gintis:* Economists who wrote extensively on how markets/rules crowd out morals.
      *   *Elster:* Jon Elster wrote about norms and social constraints.
      *   *Ostrom:* Elinor Ostrom's work on common-pool resources distinguishes between external regulation and internal governance.

  3.  **Synthesizing the Core Concept:**
      *   The phenomenon is definitely **Motivation Crowding** (specifically *Crowding Out of Civic Duty* or *Norm Crowding*).
      *   The irreversibility aspect is **Norm Hysteresis** or **Institutional Scarring**.
      *   The specific dynamic of replacing social enforcement with formal enforcement is **The Displacement of Social Norms by Formal Rules**.

  4.  **Addressing the "Name" Question:**
      *   There isn't *one* perfect single word, but the academic cluster is **Motivation Crowding Theory** (Frey & Jegen) combined with **Social Norm Erosion**.
      *   A more precise sociological term might be **The Commodification of Compliance** or **Regulatory Crowding**.
      *   *Best Fit:* **Norm Crowding** or **The Crowding-Out Effect**.
      *   *For the Irreversibility:* **Norm Hysteresis**.

  5.  **Analyzing the Three Cases:**
      *   *Bike Room:* Classic crowding out. Social contract $\rightarrow$ Legalistic contract.
      *   *Trail Crew:* Incentive crowding. Intrinsic pride $\rightarrow$ Extrinsic cash.
      *   *Tool Library:* Monitoring/Trust erosion. Trust $\rightarrow$ Verification.
      *   *Verdict:* They are all instances of the same underlying mechanism: **Extrinsic incentives displacing intrinsic motivations and social enforcement.**

  6.  **Addressing the Irreversibility (Hysteresis):**
      *   This is crucial. Once a market/rule logic enters a social sphere, it's hard to eject.
      *   Literature: Bowles ("The Moral Economy of the State"), Ostrom (institutions take time to build, easy to break), Putnam (Social Capital).
      *   Concept: **Institutional Path Dependence** or **Normative Hysteresis**.

  7.  **Drafting the Proposed Name (if needed):**
      *   If the existing terms feel too dry, I should offer a synthesized term that captures the *social* loss.
      *   "The Stewardship Displacement Effect"?
      *   "Civic Crowding"?
      *   Let's stick close to the academic literature but make it accessible. **Motivation Crowding** is the standard term. I will refine it to **Social Norm Crowding** to emphasize the community aspect.
      *   For the irreversibility: **Normative Hysteresis**.

  8.  **Addressing the Boundary Cases:**
      *   *Rewards vs. Fines:* Yes, same phenomenon. Both are extrinsic motivators crowding out intrinsic ones.
      *   *Better Metric / Worse Outcome:* Yes, this is the hallmark. The specific metric improves (walkway clear), the system degrades (room dirty). This distinguishes it from simple failure.
      *   *Unhealthy Prior Norms (Territorial Guys):* This is the tricky one. If the old norm was exclusionary, breaking it might be *good* even if informal enforcement dies. This is a **Norm Correction** vs. **Norm Destruction** distinction.

  9.  **Structuring the Response:**
      *   **Validation:** Acknowledge the insight. It's sharp and accurate.
      *   **The Name:** Introduce **Motivation Crowding Theory** (economics/psych) and **Norm Displacement** (sociology).
      *   **The Mechanism:** Explain *why* it happens (signal change, locus of control).
      *   **The Irreversibility:** Discuss **Hysteresis** and **Social Capital depreciation**.
      *   **Case Analysis:** Map the user's three cases to the theory.
      *   **Boundary Cases:** Answer the specific "what if" questions.
      *   **Strategic Advice:** How to use this in the board meeting (without sounding academic).

  10. **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Goodhart's Law is about the *measure* becoming useless. The user is right to reject it. The measure (clean walkway) works, but the *behavior* changes negatively elsewhere.
      *   *Correction:* Moral Hazard is about risk. Not applicable.
      *   *Emphasis:* Make sure to highlight Samuel Bowles and Elinor Ostrom. They are the giants on this specific topic (markets/rules vs. morals/commons).
      *   *Irreversibility:* Ensure I explain *why* it's hard to go back (new members, changed mental models).
      *   *Tone:* Keep it respectful, analytical, and practical for a board meeting context.

  11. **Final Polish:** Check against all constraints in the prompt.
      *   Name? Yes.
      *   One thing or three? Yes.
      *   Differs from Goodhart/Moral Hazard? Yes.
      *   Irreversibility literature? Yes.
      *   Proposed name if needed? (I will use existing terms but synthesize them).
      *   Boundary cases? Yes.

      *(Self-Correction on Proposed Name)*: The user asked "if there's no established concept that fits, I'd like a proposed name." Since *Motivation Crowding* fits well, I should present that as the primary established concept, but perhaps offer a more descriptive label for the *social* specific version, like **"The Stewardship Displacement Effect"** as a synthesized term for their specific context, while acknowledging the academic root. Actually, better to stick to the strongest academic term (**Motivation Crowding**) but elaborate on the **Social Norm** aspect, as that's what the user is feeling. I will propose **"Normative Crowding"** as the precise label for this social variant.

      *(Refining Irreversibility)*: The term **"Hysteresis"** is the correct physics/econ term. I need to explain it clearly.

      *(Refining Boundary Case 3)*: The "territorial guys" point is vital. If the old norm was toxic, the "crowding out" might be a necessary evil. I need to distinguish between *Prosocial Norms* and *Exclusionary Norms*.

