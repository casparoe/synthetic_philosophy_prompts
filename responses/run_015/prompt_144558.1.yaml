answer: |-
  You have identified a real, documented, and deeply frustrating phenomenon. You are right to reject Goodhart's Law and Moral Hazard; while they are adjacent, they do not capture the *social* and *psychological* shift you are describing.

  Here is the breakdown of what is happening, the established concepts that cover it, the literature on the irreversibility, and how to handle the boundary cases.

  ### 1. Does this have a name?

  The core economic and psychological concept is **Motivation Crowding Theory** (specifically, the **Crowding-Out Effect**).

  However, because your examples are specifically about *community governance* and *social norms* rather than just individual worker productivity, the more precise sociological label is **Norm Displacement** or **Regulatory Crowding**.

  If you need a single term to use in a meeting that captures the specific flavor of "replacing care with compliance," I propose: **The Stewardship Displacement Effect.**

  **Definition:** *The phenomenon wherein the introduction of formal extrinsic incentives (fines, rewards, monitoring) to govern a shared resource displaces intrinsic motivations (civic duty, pride, reciprocity), resulting in strict compliance with the letter of the rule but a degradation of overall care and informal social enforcement.*

  ### 2. Is this one thing or three?

  It is **one thing**. Your three cases are identical in mechanism, differing only in the type of extrinsic lever pulled.

  *   **Case 1 (Bike Room):** **Punitive Crowding.** The fine signals that the relationship is now transactional/legalistic rather than communal. The "friendly word" becomes "snitching" because the framework has shifted from *peer-to-peer* to *citizen-to-state*.
  *   **Case 2 (Trail Crew):** **Incentive Crowding.** The cash bonus signals that the work is a job, not a mission. Work that isn't measured (quality, unlogged miles) is devalued because it is no longer "paid."
  *   **Case 3 (Tool Library):** **Monitoring Crowding.** The app signals that trust is no longer the default; verification is. When trust is removed, the social cost of violating it drops (you're just beating the system, not betraying a neighbor).

  In all three, the **locus of control** shifts from internal (I do this because I am a good member) to external (I do this because I am being watched/charged).

  ### 3. How this differs from Goodhart's Law and Moral Hazard

  *   **Vs. Goodhart's Law:** Goodhart's Law states: "When a measure becomes a target, it ceases to be a good measure." In your bike room, the measure *worked*. The walkway *is* clear. Goodhart's Law predicts the metric becomes unreliable; you are describing a scenario where the metric is achieved, but the **systemic health collapses**. The metric didn't break; the *culture* broke.
  *   **Vs. Moral Hazard:** Moral Hazard occurs when an actor takes more risks because they don't bear the full cost (e.g., driving recklessly because you have insurance). In your co-op, the residents *are* bearing the cost (a messy room), but they have offloaded the *responsibility* to the board. It is not a risk calculation; it is a responsibility abdication.

  ### 4. The Irreversibility (The "One-Way" Problem)

  You are correct that this is often irreversible. In economics and systems theory, this is called **Hysteresis**.

  Hysteresis describes a system where the state of the object depends on its history. Once you push the system past a tipping point, removing the force does not return the system to its original shape.

  **The Literature on Norm Irreversibility:**
  *   **Samuel Bowles (Economist):** In *The Moral Economy*, Bowles documents how incentives, once introduced, can permanently erode ethical preferences. He argues that markets and rules can "teach" people to be selfish. Once people learn that "no fine = no rule," they unlearn the habit of self-regulation.
  *   **Elinor Ostrom (Political Economist):** In her work on Common-Pool Resources, she notes that "social capital" (trust, norms, networks) takes generations to build but can be destroyed by a single ill-conceived external regulation. Rebuilding it requires a new generation of socialization, which is slow.
  *   **Path Dependence:** The new members who joined during the "fine era" never experienced the old norm. They have no mental model for "sweeping because it's the right thing." They only have the model of "sweeping if there is a fine." To revert, you would need to re-socialize the entire population simultaneously, which is coordination-heavy.

  ### 5. Settling the Boundary Cases

  Here is how to apply this framework to the specific edge cases you raised.

  **A. Is it the same phenomenon when the new rule is a reward rather than a fine?**
  **Yes.** This is the "Overjustification Effect" in psychology. Paying someone for a task they previously did for fun/cause reduces their intrinsic interest in the task once the payment stops. In the trail crew example, the cash bonus converted "volunteering" into "gig work." The psychological contract changed from *contribution* to *transaction*.

  **B. Is it the same thing when the outcome is better on the measured dimension and worse on every other one?**
  **Yes, this is the defining signature.** If the outcome were worse on the measured dimension too, it would just be a *bad rule*. If the outcome were better on everything, it would be a *successful intervention*. The specific tragedy you are identifying is **Local Optimization at the Expense of Systemic Health**. The walkway is clear (local optima), but the room is trashed (systemic failure). This distinguishes it from simple incompetence.

  **C. Is it still this phenomenon if the old informal norm was never actually healthy (e.g., two guys being territorial)?**
  **This is the critical exception.**
  If the "old arrangement" was actually exclusionary, gatekeeping, or based on favoritism (the "two guys" deciding who belongs), then the formal rule is **Norm Correction**, not Norm Displacement.
  *   **Test:** Did the informal enforcement apply equally to everyone based on shared values, or did it apply based on social status/personality?
  *   **Verdict:** If the two guys were bullying people or hoarding tools under the guise of "keeping it tidy," then the fine system, while damaging to *general* stewardship, might be necessary for *equity*. However, you can still argue that fines are a blunt instrument. You can have formal rules *without* monetizing them (e.g., a "three strikes" cleaning duty roster) to avoid the transactional signal of money.

  ### 6. How to argue this in the meeting

  Do not use the term "Motivation Crowding." It sounds academic. Use the logic of **Signals** and **Responsibility**.

  **The Script:**
  > "I'm worried that by putting a price on messes, we aren't solving the problem, we're buying ourselves out of it.
  >
  > Right now, when I see a mess, I feel a responsibility to fix it or ask my neighbor to fix it because we share this space. If we put up a fine schedule, I stop being a neighbor and start being a witness. I won't ask you to move your bike; I'll wait for the board to fine you.
  >
  > We have seen this happen before. When we measure only the thing we fine, people stop doing the things we *don't* fine. We will get clear walkways, but we will lose the sweeping, the tool care, and the community watchfulness.
  >
  > Worse, this is a one-way door. Once we teach new residents that 'no fine means no rule,' we can't get that sense of ownership back. We are trading long-term community stewardship for short-term compliance. I propose we try a non-monetary enforcement ladder first: a warning, then a required cleaning shift, then a fine. Let's keep the obligation social for as long as possible."

  ### Summary for your notes:
  *   **Concept:** Motivation Crowding / Norm Displacement.
  *   **Mechanism:** Extrinsic incentives displace intrinsic motivation; social enforcement is replaced by bureaucratic reporting.
  *   **Irreversibility:** Normative Hysteresis (new members don't learn the old norms; old enforcers lose the habit).
  *   **Distinction:** Unlike Goodhart's Law, the metric *works*, but the system degrades.
  *   **Exception:** If the prior informal norm was exclusionary/unfair, formalization may be necessary despite the crowding-out cost.

  You are sensing that **money changes the conversation**. In a co-op, the conversation is supposed to be "How do we live together?" A fine schedule changes the conversation to "What is the cost of doing business?" Once that conversation changes, it is very hard to start the first one again.
