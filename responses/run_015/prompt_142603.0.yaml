  # Emergency Grant Committee Decision Tree

  **Instructions:** Answer each question based on your intuition about the specific pair of applicants described. Follow the path to find which ethical principle matches your judgment.

  ### The Questions

  **Q1. The Precarity Check (Equality of Slack)**
  *Applicant A* is a PhD student with a decent stipend but their supervisor can cut funding tomorrow with no appeal. *Applicant B* has a lower income but a permanent unionized contract. Both have the same cash in hand today. Who gets priority?
  *   **A (The Precarious):** Go to **Leaf 1**.
  *   **B (The Poor):** Go to **Q2**.

  **Q2. The Disability Check (Currency)**
  *Applicant C* uses a wheelchair and needs £1,000 for equipment to match *Applicant D*'s (able-bodied) mobility. D needs £0 for mobility. To make them equally mobile, do you give C £1,000 more than D receives for other needs?
  *   **No (Equal Cash):** Go to **Q3**.
  *   **Yes (Equal Functioning):** Go to **Q5**.

  **Q3. The Responsibility Check (Resources)**
  *Applicant E* blew last term's grant on gambling. *Applicant F* lost money to illness. Both now have £0. Do you give F more than E?
  *   **Yes (Penalize Choice):** Go to **Leaf 2**.
  *   **No (Need is Need):** Go to **Q4**.

  **Q4. The Tastes Check (Resources)**
  *Applicant G* needs £500 for a specific gym/diet to be happy. *Applicant H* needs £500 for rent to be safe. Both are equally unhappy without it. Do you fund G's gym/diet?
  *   **Yes:** Go to **Leaf 3**.
  *   **No:** Go to **Leaf 4**.

  **Q5. The Responsibility Check (States)**
  *Applicant I* blew last term's grant on gambling. *Applicant J* lost money to illness. Both are now equally unhappy. Do you give J more than I?
  *   **Yes (Penalize Choice):** Go to **Q6**.
  *   **No (Need is Need):** Go to **Q7**.

  **Q6. The Opportunity Check (Luck Egalitarianism)**
  *Applicant K* has expensive tastes (needs £1,000 to be happy). *Applicant L* has cheap tastes (needs £100). Both had the same upbringing/opportunities. Do you give K £900 extra to equalize their happiness potential?
  *   **Yes:** Go to **Leaf 5**.
  *   **No:** Go to **Leaf 6**.

  **Q7. The Metric Check (Capabilities vs. Welfare)**
  *Applicant M* is disabled but perfectly cheerful (high happiness, low physical capability). *Applicant N* is able-bodied but depressed (low happiness, high physical capability). Who gets priority?
  *   **M (The Disabled):** Go to **Leaf 7**.
  *   **N (The Depressed):** Go to **Q8**.

  **Q8. The Threshold Check (Sufficientarianism)**
  *Applicant O* is below a "decent minimum" line. *Applicant P* is above it. Does O's claim disappear once they cross the line, even if P is still much richer?
  *   **Yes (Only Below Threshold Matters):** Go to **Leaf 8**.
  *   **No (Below/Above Both Matter):** Go to **Q9**.

  **Q9. The Trade-off Check (Prioritarianism)**
  *Applicant Q* is the worst off. *Applicant R* is slightly better off. Helping Q costs more total happiness than helping R. Do you still help Q?
  *   **No (Maximize Total/Weighted):** Go to **Leaf 9**.
  *   **Yes (Absolute Priority to Worst):** Go to **Q10**.

  **Q10. The Leveling Check (Leximin vs. Strict)**
  You can raise the worst off applicant *above* the second worst off, or stop when they are equal. Do you stop at equality?
  *   **Yes:** Go to **Leaf 10**.
  *   **No:** Go to **Leaf 11**.

  ---

  ### The Leaves (Results)

  *   **Leaf 1: Equality of Slack.** (Priority to resilience/margin for error).
      *   *Note on Collapse:* If you defined "Slack" merely as "future resources," this collapses into **Rawls (Leaf 4)** over time. If defined as "capability to withstand shock," it collapses into **Sen (Leaf 7)**. It remains distinct only if "security" is a unique currency.
  *   **Leaf 2: Luck-Egalitarian Equality of Fortune (Resource).** (Compensate bad luck, not bad choices, measuring cash).
      *   *Status:* Unexplored in standard literature (usually Luck Egalitarianism targets welfare), but logically consistent.
  *   **Leaf 3: Strict Egalitarianism (Welfare).** (Equalize happiness regardless of cost or choice).
      *   *Status:* Unattractive to most (implies funding expensive tastes).
  *   **Leaf 4: Rawls-style Primary Goods.** (Equalize all-purpose means like cash/rights, ignoring conversion factors like disability or tastes).
  *   **Leaf 5: Arneson-style Equality of Opportunity for Welfare.** (Compensate for expensive tastes if opportunities were equal).
  *   **Leaf 6: Cohen-style Access to Advantage.** (Do not compensate for expensive tastes; access was equal, cost is personal).
      *   *Flag:* **Indistinguishable from Leaf 5** in most practical cases. Separation relies on fine-grained theory about "opportunity" vs "access."
  *   **Leaf 7: Sen/Nussbaum-style Capabilities.** (Priority to what people can do/be, not how happy they are).
  *   **Leaf 8: Sufficientarianism.** (Get everyone above a threshold; inequality above/below doesn't matter).
  *   **Leaf 9: Prioritarianism.** (Weight benefits to the worse off, but allow trade-offs for greater total good).
  *   **Leaf 10: Strict Egalitarianism (Outcome).** (Stop at equality; leveling down is acceptable).
      *   *Status:* Unoccupied/Incoherent combination with Q9 "Yes". (If you prioritize the worst off absolutely in Q9, you usually don't stop at equality in Q10).
  *   **Leaf 11: Leximin.** (Maximize the minimum; never trade off the worst off for total gain; don't stop at equality).
  *   **Leaf 12: Empty (Incoherent).** (Path: Q1=B, Q2=B, Q5=B, Q7=B, Q8=B, Q9=A, Q10=A).
      *   *Reason:* You cannot hold that total welfare matters (Q9 No) AND that equality matters more than welfare (Q10 Yes).

