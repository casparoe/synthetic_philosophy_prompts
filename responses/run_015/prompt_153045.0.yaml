answer: |-
  The institutional bifurcation is philosophically incoherent under strict contractualism because the mass-casualty exception necessitates aggregative logic that overrides individual claims, revealing the practice to be fundamentally rule-utilitarian despite its routine deontological language. Routine clinical ethics presupposes a framework where principles must be justifiable to each person individually, meaning no patient can reasonably reject a rule granting them care when resources exist because their vital interest outweighs statistical benefits to others. Mass-casualty triage, conversely, operates on a utilitarian mandate that individual claims be overridden to maximize total survival. A genuine contractualist defense of triage would require showing that the deprioritized patient cannot reasonably reject the principle governing their sacrifice, but strict pairwise justification fails because the expectant patient's complaint (death) is not outweighed by the sum of others' complaints unless aggregation is permitted. Contractualism strictly prohibits overriding an individual's vital interest based on the sum of others' interests, whereas the triage protocol strictly requires this aggregation to maximize survivor counts. Therefore, the system accommodates contractualism only in routine care where aggregation is unnecessary, but abandons it in crises where aggregation is operationally essential.

  If emergency medicine adopted a revised protocol requiring pairwise justification to every deprioritized patient, triage officers could not cite the greater number of savable lives as justification. Instead, prioritization would need to rely on non-aggregative factors, such as a lottery among those with equal claims or a strict hierarchy of medical futility where care is withheld only if it cannot succeed, not if it is too costly relative to others. This would likely reduce the total number of survivors, as resources could not be diverted from the gravely injured simply to save a larger number of the moderately injured. Consequently, the current bifurcation is not philosophically stable; it functions as a pragmatic modus vivendi that switches moral frameworks based on resource scarcity rather than maintaining a consistent justificatory basis.

  I am 85% confident in this reconstruction. I am least sure about whether Scanlon's later refinements on emergency principles allow for a version of contractualism that permits limited aggregation without collapsing into utilitarianism, as this remains a contested area in normative ethics.
