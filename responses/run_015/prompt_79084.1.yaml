  5. What I'm cutting
  Cut: **Neuroscience specifics.** Do not explain REM cycles or activation-synthesis. You are not teaching sleep science. Say: "We take the science as given; we are asking what the science *means*."
  Cut: **Private Language Argument deep dive.** Don't try to teach *Philosophical Investigations* §243+ in 20 minutes. Use the result, not the derivation. Say: "We're applying Wittgenstein's tools, not studying the toolbox."
  Cut: **Descartes comparison.** They read *Meditations*, but don't turn this into a Descartes seminar. Use Descartes only to highlight the skepticism Malcolm is dissolving, not to re-argue the Dream Argument.
  How to say it: Open the syllabus section by stating: "This is conceptual analysis, not empirical inquiry. We aren't asking how dreams work, but what we mean when we say we had one." This frames the exclusions as methodological necessities, not dodges. It signals that bringing up EEG data as a 'gotcha' misses the seminar's point.
