answer: |-
  1. The spine and the order
  Your Q1/Q2 split is dangerous. It grants Dennett's ontology too early. If you ask "Is it an experience?" (Q1), you invite an empirical answer. Malcolm's point is that "dream experience" doesn't function like "visual experience." He isn't saying "Yes experience, wrong time"; he's saying "The grammar of 'I dreamed' is not the grammar of 'I saw'." By splitting them, you make Malcolm look like he's denying empirical facts (brain states) rather than challenging the conceptual framework. You risk turning Malcolm into a bad empiricist who simply lacks data, rather than a conceptual engineer changing the game.

  Replace the spine with: **Criteria vs. Cause.**
  Phase 1: What makes "I dreamed" true? (Malcolm: The sincere report. Dennett: The prior sleep-event.)
  Phase 2: Can science adjudicate? (Malcolm: No, category mistake. Dennett: Yes, eventually.)
  This order forces students to see that Malcolm isn't arguing about *when* dreams happen, but about what *dreaming* means. It preserves his Wittgensteinian insight that the waking report is the criterion, not evidence of a hidden show. Q1/Q2 suggests two empirical hurdles; Criteria/Cause shows two incompatible frameworks. Keep the sequence, but rename the hurdles. If you keep Q1/Q2, students will treat Malcolm as a bad empiricist rather than a conceptual engineer. The split survives only if Q1 is framed as "What is the truth-condition?" not "Is there a phenomenology?" You must establish that for Malcolm, the report doesn't describe the dream; it constitutes it. Only then can Dennett's objection land as a challenge to that constitution, not just a factual correction.

  2. The carrying example
  Verdict: Drop the hypnosis case. It introduces "false memory," which implies an independent fact of the matter (you didn't have a past life) that the report fails to match. For Malcolm, the dream report *creates* the fact. Hypnosis suggests the report is wrong; Malcolm says the report is constitutive. Using hypnosis smuggles in realism about the past life, confusing the issue of verification with the issue of truth conditions.

  Use **The Unreported Dream** instead.
  Case: A subject sleeps alone. No EEG. They wake and say nothing. Did they dream?
  What it needs: Total isolation. No external verification possible.
  What it lacks: The social act of telling, which is crucial for Malcolm.
  Why it works: It forces the question: Is "dreaming" a private event or a public practice? Dennett says "Yes, private event." Malcolm says "Without the practice of reporting, the concept lacks application."
  This avoids the "false memory" trap. Hypnosis makes students focus on reliability of memory. The Unreported Dream makes them focus on the *logic* of the concept. You want them wrestling with whether a dream can exist unreported, not whether memory is trustworthy. The hypnosis case smuggles in realism about the past life; the dream case is about the status of the narration itself. Stick to the dream, but isolate the report. This keeps the machinery visible without importing the baggage of deception or error, allowing the Malcolm/Dennett clash to remain purely about the status of the report itself.

  3. Misconception map
  1. **"Malcolm is a Behaviorist."** (Arises immediately, minute 15). Students hear "no inner experience" and think "nothing in the head."
     *Kill it:* After introducing Malcolm's criteria. Clarify: He denies the *logical privacy*, not the physiology. Brains can fizz; that's not "dreaming." If you don't kill this now, they will dismiss him as scientifically illiterate for the rest of the hour.
  2. **"EEG/Science Solves It."** (Arises at Phase 2, minute 45). Students will say REM proves dreams occur during sleep.
     *Kill it:* When discussing Cause. REM correlates with *reports*, not necessarily the *experience*. Malcolm admits correlations; he denies they define the concept. Science finds causes; Philosophy defines concepts. If you let this stand, Dennett wins by default because students privilege empirical data over conceptual analysis.
  3. **"Lucid Dreaming Refutes Malcolm."** (Arises near end, minute 70). Students argue: "I know I'm dreaming *while* asleep."
     *Kill it:* In the final wrap-up. Malcolm's counter: The claim "I knew I was dreaming" is made upon waking. The *authority* of that claim still rests on the waking report, not a sleep-state inspection. Lucid dreaming changes the content of the report, not the grammar of verification. Students think lucidity proves consciousness during sleep. Malcolm would say the *memory* of lucidity is what's reported. The "during sleep" part is an inference based on the report, just like normal dreaming. The grammatical structure remains: waking report validates the claim.
  Sequence is vital. If you let EEG stand before killing Behaviorism, they think Malcolm denies brain science. If you let Lucid Dreaming stand before killing EEG, they think subjective awareness trumps grammar. Kill Behaviorism first to save Malcolm from looking stupid. Kill EEG second to save the conceptual distinction. Kill Lucid Dreaming last to show the robustness of the grammatical point. This order ensures Malcolm gets a fair hearing before Dennett's empiricism overwhelms the room.

  4. The exit question
  Ask this: "Imagine a future technology that reads narrative content directly from sleep physiology with 100% accuracy, bypassing the waking report. Does Malcolm's argument collapse?"
  Desired answer: No. Malcolm argues that "dreaming" is defined by the language game of reporting. Even if the machine reads the brain, the *concept* of dreaming remains tied to the human practice of recounting. If the machine says "You dreamed of X" but you say "No," the conflict isn't solved by science; it's a clash of criteria.
