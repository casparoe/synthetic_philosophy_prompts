prompt: |-
  i just spent an hour with my friend arguing about low impact AI and he kept saying just avoid side effects like that is a well defined objective, but i think you cant even state it without either a full value function or a baseline that quietly encodes one. can you write the desiderata for an account of impact or side effects that would be good enough to use as a safety constraint before we have full value alignment? the point is to separate the descriptive impact measure from the evaluation, because the moment you say bad side effect you have already smuggled in value. i want the requirements, with the case or consideration behind each: what counts as an impact, relative to what baseline or counterfactual world, over what timescale, which causal or statistical notion, how it handles value uncertainty, how it treats intended effects, reversibility, agency, and self modification. include the cases it has to get right (trivial actions, beneficial interventions, irreversible changes, alignment faking, etc.) and the distinctions it cannot collapse (side effect versus intended effect, local versus global, short term versus long term, physical versus informational, etc.). mark which requirements are non negotiable and which are just preferences of particular camps, and say if some subset is jointly unsatisfiable -- i think the baseline problem and the no value specification requirement might be -- and which single requirement kills the most popular just measure negative side effects approaches. then briefly score the usual state of world, expected utility delta, and negative side effect style proposals against the list. no citations, just the spec.
reasoning: |-
