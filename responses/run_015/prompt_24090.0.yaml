  10. **Final Polish:** Ensure the distinction between "Non-Negotiable" (safety critical) and "Preference" (philosophical leaning) is clear. Make sure the "Killer Requirement" is punchy. (Self-correction: Ensure I explicitly address the "alignment faking" case).

