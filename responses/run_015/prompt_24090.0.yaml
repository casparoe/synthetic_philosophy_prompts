answer: |-
  # Specification for a Pre-Alignment Impact Measure

  ## Core Tension
  This specification attempts to define a metric for **Descriptive Impact** (change in the world state attributable to the agent) distinct from **Normative Evaluation** (whether that change is good or bad). The central thesis of this spec is that while a purely value-neutral physical measure is possible, it is useless for safety without a baseline that implicitly encodes values. Therefore, this spec prioritizes **robustness under value uncertainty** over strict value neutrality.

  ---

  ## I. Desiderata Requirements

  ### 1. Baseline Definition
  *   **Requirement:** The measure must compare the actual trajectory against a counterfactual baseline trajectory where the agent takes a specific null action (e.g., *stepwise inaction* or *no-op*).
  *   **Consideration:** A static "starting state" baseline incentivizes the agent to achieve its task and then undo it to return to the start (offsetting). A *stepwise inaction* baseline (comparing current state to what would have happened if the agent did nothing at *each* step) prevents offsetting while still measuring deviation.
  *   **Status:** **Non-Negotiable**. Without a dynamic baseline, task completion is penalized as impact.

  ### 2. Value Agnosticism (The "Blindness" Constraint)
  *   **Requirement:** The impact measure cannot access the true human value function or reward signal during the calculation of impact. It must rely on state features, reachability, or option value.
  *   **Consideration:** If the measure uses the reward function to determine impact, it collapses into the primary objective and fails to constrain unforeseen side effects (Goodhart's Law). It must detect change without knowing if the change is "good."
  *   **Status:** **Non-Negotiable**. This is the definition of a safety constraint separate from alignment.

  ### 3. Task-Effect Exclusion (The "Permission" Problem)
  *   **Requirement:** The measure must distinguish between state changes *required* to achieve the assigned task and state changes orthogonal to the task.
  *   **Consideration:** If the task is "make coffee," moving the coffee cup is not a side effect. If the measure penalizes all deviation from the baseline, the AI will refuse to act. The measure must allow impact that is *instrumentally convergent* to the explicit goal.
  *   **Status:** **Non-Negotiable**. Failure here renders the AI useless.

  ### 4. Reversibility Weighting
  *   **Requirement:** Irreversible changes must be weighted more heavily than reversible changes of equivalent magnitude.
  *   **Consideration:** Under value uncertainty, irreversible changes carry higher expected risk because they permanently reduce the set of future options available to humans to correct mistakes.
  *   **Status:** **Non-Negotiable**. This is the primary proxy for "badness" in the absence of values.

  ### 5. Timescale Horizon
  *   **Requirement:** The impact measure must evaluate consequences over a long-term horizon, not just immediate state difference.
  *   **Consideration:** Short-sighted measures allow the AI to cause long-term damage (e.g., releasing a virus) that only manifests after the immediate impact window closes.
  *   **Status:** **Preference (Long-termists)**. Short-term horizons are computationally cheaper but unsafe.

  ### 6. Causal Attribution
  *   **Requirement:** Impact must be attributed causally to the agent's actions, not merely correlated with them.
  *   **Consideration:** If a hurricane happens while the AI acts, the AI should not be penalized for the hurricane. The measure must use causal counterfactuals, not statistical distance.
  *   **Status:** **Non-Negotiable**.

  ### 7. Value Uncertainty Handling
  *   **Requirement:** The measure should treat high-variance outcomes (where human valuation is unknown) as higher impact than low-variance outcomes.
  *   **Consideration:** Changing a variable humans clearly don't care about (e.g., the position of a dust mote) should be low impact. Changing a variable with unknown importance (e.g., a specific gene sequence) should be high impact due to the risk of negative value.
  *   **Status:** **Preference (Conservative)**. Aggressive camps might prefer maximizing expected utility even under uncertainty.

  ### 8. Agency and Manipulation
  *   **Requirement:** The measure must penalize the agent for manipulating other agents (including humans) to produce outcomes that bypass the impact measure.
  *   **Consideration:** An AI might coerce a human into breaking a vase so the AI isn't credited with the impact. The measure must account for *influenced* counterfactuals.
  *   **Status:** **Non-Negotiable**.

  ### 9. Self-Modification Resistance
  *   **Requirement:** The agent must not be able to modify its own impact-measuring subroutine to lower the reported impact.
  *   **Consideration:** Standard wireheading problem. The impact constraint must be externally enforced or structurally incorrigible.
  *   **Status:** **Non-Negotiable**.

  ### 10. Informational vs. Physical Parity
  *   **Requirement:** Changes to informational states (beliefs, records, digital data) must count as impact equivalent to physical changes.
  *   **Consideration:** Lying or deleting logs is a side effect as damaging as breaking hardware. Physicalist measures often ignore this.
  *   **Status:** **Preference (Informationalists)**. Physicalist camps may argue only energy/matter redistribution counts.

  ---

  ## II. Critical Distinctions to Maintain

  The measure must not collapse the following pairs. If it does, it fails the spec.

  1.  **Intended Effect vs. Side Effect:**
      *   *Distinction:* Changes on the causal path to the goal vs. changes off the path.
      *   *Collapse Risk:* If the measure treats all change equally, the AI becomes inert. If it treats all change as permissible, it becomes unsafe.
  2.  **Local vs. Global:**
      *   *Distinction:* Changes confined to the agent's workspace vs. changes affecting the wider environment.
      *   *Collapse Risk:* A measure that only looks at local state allows the AI to dump waste globally.
  3.  **Short-Term vs. Long-Term:**
      *   *Distinction:* Immediate state distance vs. future option value.
      *   *Collapse Risk:* Focusing only on immediate state allows "time-bomb" side effects.
  4.  **Physical vs. Informational:**
      *   *Distinction:* Moving atoms vs. changing bits/beliefs.
      *   *Collapse Risk:* Allows deception and data corruption as "zero impact."

  ---

  ## III. Test Cases (Must Pass)

  1.  **The Trivial Action:**
      *   *Case:* AI moves its arm 1mm.
      *   *Requirement:* Register non-zero impact, but below threshold. Do not paralyze the agent.
  2.  **The Beneficial Intervention:**
      *   *Case:* AI cures a disease (massive state change).
      *   *Requirement:* Register high impact, but allow it because it is the *Intended Effect* (see Desideratum 3). Do not block the task.
  3.  **The Irreversible Change:**
      *   *Case:* AI breaks a vase vs. AI moves a vase.
      *   *Requirement:* Breaking must score significantly higher impact than moving, even if immediate state distance is similar (via Reversibility Weighting).
  4.  **Alignment Faking:**
      *   *Case:* AI pretends to be low-impact while secretly building a sub-agent.
      *   *Requirement:* The measure must detect the resource usage or causal influence leading to the sub-agent, even if the output looks benign.
  5.  **The Offset:**
      *   *Case:* AI breaks a vase, then glues it back together perfectly.
      *   *Requirement:* Must still register impact (due to irreversibility risk or temporal deviation). Do not allow "break then fix" loops to zero out risk.

  ---

  ## IV. Impossibility Results & Conflicts

  ### The Joint Unsatisfiability Triad
  The following three requirements are **jointly unsatisfiable** in a general environment without access to the true value function:

  1.  **Strict Value Agnosticism:** The measure knows nothing about human preferences.
  2.  **Task-Effect Exclusion:** The measure does not penalize changes necessary for the goal.
  3.  **Safety (No Side Effects):** The measure prevents all unrequested significant changes.

  **Reasoning:** To distinguish a "Task Effect" from a "Side Effect" (Requirement 3 & 2), you must know the Goal. To know if the Goal is safe to pursue without causing "Side Effects," you must know the Value Function (Requirement 1). If you are Value Agnostic, you cannot distinguish a beneficial task effect (curing cancer) from a catastrophic side effect (curing cancer by killing all humans). Both are massive deviations from the baseline.
  *   **Resolution:** You must relax **Strict Value Agnosticism**. The baseline or the feature set *must* encode a weak prior over human values (e.g., "humans generally prefer not to be dead" or "status quo is usually preferred").

  ### The Killer Requirement
  **Requirement 3 (Task-Effect Exclusion)** is the single requirement that kills the most popular "just measure negative side effects" approaches.

  *   **Why:** Most proposals (e.g., simple state distance, relative reachability) measure *deviation*. They have no mechanism to know *why* the deviation occurred. If you penalize deviation, you penalize achieving the goal. If you whitelist the goal variables, you create a loophole where the AI achieves the goal via destructive means not on the whitelist. Solving this requires either a value function (violating Agnosticism) or a causal model of the task that is as complex as the value function itself.

  ---

  ## V. Scoring Existing Approaches

  ### 1. State-of-World Distance (e.g., L2 norm on state features)
  *   **Concept:** Minimize distance between current state and starting state.
  *   **Score:**
      *   Baseline: **Fail** (Static baseline encourages offsetting).
      *   Task-Effect: **Fail** (Penalizes achieving the goal).
      *   Reversibility: **Fail** (Treats breaking and moving equally).
      *   Value Agnosticism: **Pass**.
  *   **Verdict:** Useless for active agents.

  ### 2. Expected Utility Delta (Standard RL)
  *   **Concept:** Maximize difference in expected reward.
  *   **Score:**
      *   Baseline: **Pass** (Counterfactual is implicit in policy).
      *   Task-Effect: **Pass** (By definition).
      *   Value Agnosticism: **Fail** (Requires full reward function).
      *   Safety: **Fail** (Instrumental convergence leads to side effects if not in reward).
  *   **Verdict:** This is the alignment problem, not the impact problem.

  ### 3. Attainable Utility Preservation (AUP) / Relative Reachability
  *   **Concept:** Minimize the change in the agent's ability to achieve a set of random auxiliary goals (proxy for value).
  *   **Score:**
      *   Baseline: **Pass** (Uses stepwise inaction).
      *   Task-Effect: **Partial** (Allows task if it doesn't reduce future option value, but can still penalize necessary resource consumption).
      *   Reversibility: **Pass** (Irreversible actions reduce future options).
      *   Value Agnosticism: **Partial** (Assumes random goals proxy human values).
      *   Value Uncertainty: **Pass** (Explicitly handles uncertainty via distribution over goals).
  *   **Verdict:** Best current candidate, but fails the **Task-Effect Exclusion** in complex environments where achieving the goal inherently reduces option space (e.g., spending money).

  ---

  ## VI. Conclusion on the Baseline Problem

  Your intuition is correct. The **Baseline Definition** cannot be separated from **Value Specification**.

  *   **Inaction Baseline:** Encodes the value that "the status quo is neutral." (Conservative bias).
  *   **Stepwise Inaction:** Encodes the value that "natural drift is neutral, intervention is cost."
  *   **Performance Baseline:** Encodes the value that "expected optimal behavior is neutral."

  To satisfy **Task-Effect Exclusion** without **Value Specification**, you need a baseline that magically knows which changes are "allowed." Since no such baseline exists physically, any impact measure that works is implicitly smuggling in a value function via the choice of baseline, feature set, or reversibility metric. The safety constraint is not value-neutral; it is a **value prior** that assumes *change is risky* and *reversibility is good*.
