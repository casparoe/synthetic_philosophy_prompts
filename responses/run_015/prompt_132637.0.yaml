  4.  **Address the Strawsonian Angle:**
      *   P.F. Strawson ("Freedom and Resentment"): We cannot wholly adopt the objective attitude toward adults we hold responsible. The participant stance involves reactive attitudes (resentment, gratitude, blame, forgiveness).
      *   Parole boards try to have it both ways: They use the objective attitude to diagnose denial (as a risk factor/symptom) but use the participant stance to withhold liberty (as a moral sanction for lack of remorse).
