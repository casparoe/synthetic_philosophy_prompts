answer: |-
  The parole practice presupposes that moral responsibility persists as a duty to realign one's quality of will, treating liberty as contingent on moral reintegration rather than risk reduction, while simultaneously employing coercive tools that render the required sincerity conceptually impossible.

  This implicit theory is strictly presupposed by the board's skepticism of instrumental remorse; if the logic were purely forward-looking risk management, a prisoner who successfully performs remorse to demonstrate behavioral compliance should be released regardless of inner sincerity, provided the performance predicts safety. By discounting instrumental displays, the board reveals that it seeks a normative transformation—a change in the applicant's moral orientation toward the victim and the law—rather than mere predictive reliability. This treats the prisoner not as a risk vector to be managed but as a moral agent who owes the community a specific attitude of acknowledgment, effectively extending retributive demands for moral correction into the administrative phase of release.

  The practice is underdetermined, however, regarding the causal link between this moral correction and public safety. While boards often justify insight requirements by claiming they reduce recidivism, the deferral of low-risk applicants who maintain innocence suggests that moral alignment is treated as an independent good, or a prerequisite for deserving liberty, rather than a tool for risk mitigation. This creates the inauthenticity trap you identified: by making remorse a condition of liberty, the system incentivizes performance, thereby corrupting the very quality of will it demands. Distinguishing acknowledgment from affect helps only if the board accepts cognitive admission without emotional display, but in practice, affect is demanded as the only credible proof of acknowledgment, conflating the evidence of responsibility with the feeling of guilt.

  Regarding the Strawsonian tension, the board oscillates between the participant and objective stances: it treats denial as a pathological symptom to be managed (objective) while punishing it as a moral failure warranting continued deprivation (participant). A shift to pure actuarial risk scores would resolve this by adopting the objective attitude wholesale, treating the prisoner exclusively as a subject of management rather than a moral interlocutor. If Strawson is right that we cannot sustain the objective attitude toward persons without dehumanizing them, this reform would sacrifice the possibility of forgiveness and the recognition of the offender's moral standing. It would concede that release is not a restoration of membership in the moral community based on mutual recognition, but a technical decision about danger, leaving the prisoner's moral responsibility entirely behind bars while liberating only their body.
