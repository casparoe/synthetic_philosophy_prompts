answer: |-
  # JOINT STATEMENT ON VERISIMILITUDE AND SCIENTIFIC PROGRESS
  **Prepared for the Reading Group on Philosophy of Science**
  **Signatories:** The Likeness Camp (LC) & The Relevant Consequence Camp (RCC)

  ## 1. AGREED CLAIMS

  1.  **The Function of the Concept:** We agree that the concept of verisimilitude is required to make sense of scientific progress in a realist framework. Since our best theories are strictly false (due to idealization, approximation, or ontological error), progress cannot be defined merely as the accumulation of true theories. "Closer to the truth" must explain why we prefer Newtonian mechanics over Aristotelian physics, even if both are technically false.
  2.  **The Triviality Result:** We agree that Karl Popper's original definition (truth-content minus falsity-content) is untenable. We accept the Miller–Tichý triviality proofs: under classical logic, if Theory A and Theory B are both false, A cannot be closer to the truth than B. Any viable account must restrict the logical consequences that count toward verisimilitude or redefine the logical space.
  3.  **Comparative Nature:** We agree that verisimilitude is primarily a *comparative* ordering, not necessarily a precise metric. We do not need to calculate the exact "distance to truth" of a single theory in isolation; we only need to rank competing theories reliably.
  4.  **The Role of Logic:** We agree that verisimilitude cannot be purely epistemic (i.e., it cannot depend on what we *know* to be true). It must be an objective relation between a theory and the world, independent of our current evidence.
  5.  **Verbal Flag (Claim 4):** *Note:* While we both sign Claim 4, LC interprets "objective relation" as a structural similarity between possible worlds, whereas RCC interprets it as an objective filtering of logical consequences based on relevance. We agree the relation is mind-independent, but disagree on its categorical nature.

  ## 2. DISAGREEMENTS TABLE

  | Topic | Likeness Camp (LC) Formulation | Relevant Consequence Camp (RCC) Formulation |
  | :--- | :--- | :--- |
  | **1. Fundamental Basis** | Verisimilitude is a measure of the **similarity** between the actual world and the set of possible worlds in which the theory is true. | Verisimilitude is a measure of the **informational yield** of a theory, specifically the ratio of true to false *relevant* consequences. |
  | **2. The Source of Error** | A theory is far from the truth if the worlds it permits are **distant** from the actual world in logical space, regardless of how many consequences it generates. | A theory is far from the truth if it entails **false relevant consequences**, regardless of how "similar" the hypothetical worlds might appear. |
  | **3. Handling Falsity** | A false theory can be very close to the truth if its errors are **small deviations** in the parameters of an otherwise correct structure. | A false theory is always deficient; it is "less false" only if its errors concern **irrelevant matters** or are outweighed by true relevant consequences. |
  | **4. Logical Vocabulary** | The ordering of theories is sensitive to the **choice of primitives** (predicates/constants) used to define the logical space. | The ordering of theories should be invariant under re-description, provided the **relevance filter** tracks natural structure rather than syntax. |

  ## 3. CRUXES AND PREDICTIONS

  We identify four concrete cases where our frameworks diverge. We commit to the following predictions regarding the verdicts these cases should yield.

  ### Crux 1: The Numerical Near-Miss
  **Case:** The true value of a physical constant is 5.1.
  *   **Theory A** states the value is 5.0.
  *   **Theory B** states the value is 50.0.
  *   **Question:** Can the apparatus grade A as closer to the truth than B without smuggling in an ad hoc metric?

  *   **LC Prediction:** **A is strictly closer.** This is the paradigmatic success of the likeness approach. The distance between 5.0 and 5.1 is smaller than between 50.0 and 5.1. The metric is not smuggled; it is derived from the topological structure of the quantity space itself (the "logical space" of possible values).
  *   **RCC Prediction:** **A is closer, but only conditionally.** If "x = 5.0" entails a set of observational consequences (e.g., readings between 4.9 and 5.1) that largely overlap with the truth, while "x = 50" entails readings far from the truth, then A has more true relevant consequences. However, if the logic is treated purely binary (x is 5.0 is simply *False*), RCC struggles to distinguish A from B without importing a similarity metric into the definition of "relevance."
  *   **The Sticking Point:** LC says the metric is fundamental. RCC says the metric is only valid if it translates into differential empirical consequences.

  ### Crux 2: The Grue/Gerrymandering Problem
  **Case:** We take a domain described in standard predicates (e.g., "Green", "Blue") and re-describe it in gerrymandered predicates (e.g., "Grue", "Bleen").
  *   **Question:** Does the verisimilitude ordering of two theories flip under this re-description?

  *   **LC Prediction:** **Yes, the ordering can flip.** Since likeness is defined over state descriptions in a logical space, changing the primitive predicates changes the geometry of that space. LC admits this is a vulnerability and argues we must privilege "natural" logical spaces, but acknowledges the formalism itself is sensitive to syntax.
  *   **RCC Prediction:** **No, the ordering should not flip.** If relevance is determined by causal structure or natural kinds (not syntax), then the set of *relevant* consequences remains stable regardless of the linguistic framework. If the ordering flips, it shows the relevance filter was applied incorrectly (i.e., to syntactic consequences rather than structural ones).
  *   **The Sticking Point:** LC claims RCC is hiding the "similarity" judgment inside the definition of "relevance." RCC claims LC is conceding that verisimilitude is language-relative.

  ### Crux 3: The Padding Problem
  **Case:** Take a false Theory T. Conjoin it with a true but irrelevant claim P (e.g., "The number of stars is even").
  *   **Question:** Does T & P have higher verisimilitude than T alone?

  *   **LC Prediction:** **It changes the position, but not necessarily for the better.** Adding a true conjunct restricts the set of possible worlds. Depending on the geometry, this might move the "center" of the theory closer to or further from the actual world. There is no guarantee that adding truth improves verisimilitude if the logical space is distorted.
  *   **RCC Prediction:** **Verisimilitude remains unchanged.** By definition, irrelevant truths do not count toward the content of the theory regarding the target domain. Padding with P adds no *relevant* true consequences, so the score stays the same. This is a decisive advantage for RCC.
  *   **The Sticking Point:** LC suspects RCC's "relevance" filter is being tuned specifically to avoid this counter-intuitive result. RCC suspects LC cannot explain why adding truth sometimes fails to improve a theory.

  ### Crux 4: Cross-Domain Comparison
  **Case:** Compare a false theory in Biology (T1) with a false theory in Physics (T2).
  *   **Question:** Can T1 be closer to the truth than T2?

  *   **LC Prediction:** **No, comparison is impossible.** There is no unified metric of distance between a biological world-state and a physical world-state. Verisimilitude is only defined within a single, unified logical space.
  *   **RCC Prediction:** **No, comparison is impossible.** Relevance is domain-specific. There is no common currency of "relevant consequences" between biology and physics.
  *   **The Sticking Point:** While we agree on the verdict (incomparability), LC attributes this to *ontological incommensurability* (different worlds/spaces), while RCC attributes it to *functional incommensurability* (different explanatory tasks).

  ## 4. SWITCHING CONDITIONS

  **Likeness Camp:** "We would abandon the likeness approach if presented with a case where a theory is intuitively *more similar* to the actual world (in terms of structure) but clearly *less scientifically progressive* (in terms of explanatory power and true consequences)."

  **Relevant Consequence Camp:** "We would abandon the relevant consequence approach if it were demonstrated that 'relevance' cannot be defined objectively without circularly presupposing the very truthlikeness ordering we are trying to establish."

  ## 5. EDITOR'S NOTE ON RESIDUAL DISAGREEMENT

  **Most Likely Fudge:** Claim 1 (The Function of the Concept).
  Both sides agree verisimilitude explains progress, but they are optimizing for different things. The Likeness Camp is optimizing for **ontological fidelity** (getting the structure of the world right). The Relevant Consequence Camp is optimizing for **explanatory utility** (getting the right facts for the job).

  **Verbal vs. Substantive:**
  There is a significant verbal overlap regarding the "metric." The Likeness Camp explicitly uses a distance metric. The Relevant Consequence Camp implicitly relies on a metric to determine "degrees of falsehood" in the Numerical Near-Miss case (Crux 1). If RCC admits that determining which consequences are "more important" or "closer to the truth" requires a similarity metric, then RCC collapses into a sophisticated version of LC. If LC admits that the "similarity" of worlds is determined by which consequences they share with the actual world, LC collapses into RCC.

  The collaboration should focus entirely on **Crux 2 (Gerrymandering)**. If LC cannot solve the language-dependence problem without appealing to "natural relevance," and RCC cannot define "natural relevance" without appealing to "structural similarity," the two camps are describing the same elephant from different angles.

  ***

  **End of Statement**
