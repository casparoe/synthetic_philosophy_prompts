      *   *Correction:* Ensure the distinction between "Strictly Required" and "Compatible" is sharp. For example, the US system *could* work with a utilitarian justification, but the *statutory language* implies ownership/principal-agent. I need to focus on the *legitimacy claim* of the architecture.
      *   *Physicist Angle:* Use analogies like "boundary conditions," "state variables," "observability," "system architecture." This will resonate with the user.
      *   *Key Insight:* The divergence isn't just political; it's ontological. Where does the "self" end and the "state" begin?

  7.  **Final Polish:** Check against all parts of the prompt.
