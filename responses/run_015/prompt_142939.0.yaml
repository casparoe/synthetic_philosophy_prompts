          *   *Core Concept:* *Recht auf informationelle Selbstbestimmung*.
          *   *Philosophical Root:* Kantian dignity (person as end, not means), German Idealism (development of personality requires a private sphere).
          *   *Strict Requirement:* The individual must have the capacity to control who knows what about them to maintain autonomy. Without this control, the "self" is compromised.
          *   *Compatible:* Consequentialism (privacy prevents harm), but the *right* is usually framed deontologically.
          *   *Underdetermined:* The exact boundary of "personal data" shifts with technology.

      *   **USA (Freedom of Information / Transparency):**
          *   *Key Statute:* FOIA (1966), Privacy Act (1974).
          *   *Core Concept:* Government records belong to the public.
          *   *Philosophical Root:* Republicanism (non-domination), Social Contract (government as agent), Distrust of concentrated power.
          *   *Strict Requirement:* Legitimacy derives from accountability. Accountability requires visibility. Therefore, state knowledge must be visible to the principal (citizen).
          *   *Compatible:* Technocratic oversight (experts check experts), but the *legal mechanism* is public access.
          *   *Underdetermined:* Tension between transparency of state and privacy of individual (FOIA exemptions).

      *   **China (Social Credit System):**
          *   *Key Mechanism:* Integrated data scoring affecting access.
          *   *Core Concept:* Legibility, Trustworthiness (*Chengxin*).
          *   *Philosophical Root:* Legalism (state control, clear rewards/punishments), Confucianism (moral cultivation, social harmony), Technocratic Utilitarianism (optimizing social outcomes).
          *   *Strict Requirement:* The state has the epistemic authority to judge and categorize citizens for the collective good. The individual is legible.
          *   *Compatible:* Liberal utilitarianism (if it maximizes welfare), but conflicts with liberal rights.
          *   *Underdetermined:* The specific metrics of "credit" are fluid and politically defined.

  3.  **Address the Specific Philosophical Questions:**

      *   *Germany:* Is it dignity or consequences? *Strictly*, the Constitutional Court grounds it in dignity (Basic Law Art. 1 & 2). Consequentialism is secondary.
      *   *USA:* Fiduciary or Technocratic? *Strictly*, it's Fiduciary/Republican (People -> Government). Technocracy is a mode of operation, not the legitimacy source.
      *   *China:* Optimizable node? Yes. Can it be Confucian? Yes (rectification of names). Utilitarian? Yes. Liberal? No, not in the classical sense of negative liberty.

  4.  **Synthesize: Consistency and Hybridization:**

      *   *Unified Account?* Difficult. Germany says "Hide by default." USA says "Reveal by default (state side)." China says "Reveal everything (citizen side)."
      *   *Epistemic Relationship:*
          *   Germany: State is epistemically limited regarding the citizen.
          *   USA: Citizen is epistemically empowered regarding the state.
          *   China: State is epistemically total regarding the citizen.
      *   *Structured Opacity:* This is the "Hybrid." It requires a theory of *contextual integrity* (Nissenbaum). Some domains are private (self-constitution), some are public (accountability), some are shared (service delivery).
      *   *Co-producer of Knowledge:* This shifts the paradigm from "Control" to "Stewardship." Mechanisms change from consent forms to data trusts/governance boards.

