answer: |-
  Here is the operational procedure based on your theoretical position (Idealized Substituted Judgment), designed to withstand the "made-up character" critique by making the construction rules explicit.

  ### The Idealized Agency Protocol (IAP)

  **Goal:** Determine the decision the agent *would* make if they possessed accurate information, were free from compromising physiological/psychological states, and reasoned without logical error, *without* altering their core values.

  #### Phase 1: The Calibration Dials (In Order)
  *You must adjust these dials in this specific sequence. Changing the order changes the verdict.*

  1.  **Information Dial (Facts)**
      *   **Action:** Correct factual misconceptions about prognosis, procedure, and likelihood of success.
      *   **Limit:** Do not correct probabilistic uncertainty (e.g., "70% chance" stays "70%"). Do not correct value-laden descriptions (e.g., "burdensome" is a value, not a fact).
      *   **Pass Condition:** The agent acknowledges the medical reality as stated by the attending.
  2.  **State Dial (Capacity/Condition)**
      *   **Action:** Assess if fear, pain, exhaustion, or medication is compressing the decision-making horizon (e.g., choosing immediate relief over long-term survival).
      *   **Limit:** Do not correct for personality traits (e.g., "optimism," "risk-aversion"). Only correct for acute, transient impairments.
      *   **Pass Condition:** Pain is managed; acute delirium is ruled out; agent demonstrates ability to project beyond the next 24 hours.
  3.  **Reasoning Dial (Logic)**
      *   **Action:** Identify means-ends errors. (e.g., "If I choose hospice, I will be killed" vs. "I will die of the disease.")
      *   **Limit:** Do not correct for different risk tolerances.
      *   **Pass Condition:** The agent understands the causal link between the choice and the outcome.
  4.  **Values Dial (The Hard Stop)**
      *   **Action:** **DO NOT ADJUST.**
      *   **Rule:** You may clarify how a value applies to the situation, but you may not suggest a value is "wrong" or "outdated."
      *   **Stop Point:** If the only way to reach a "safe" medical outcome is to change a value (e.g., religious prohibition on blood), the procedure halts. Hand off to values negotiation.

  #### Phase 2: The Verdict Logic
  1.  **If Competent Patient:** The IAP output is *advisory only*. You present the "Idealized Choice" to the patient. If they reject it after Phase 1 calibration, their actual choice stands (Autonomy trumps Idealization).
  2.  **If Surrogate/Incapacitated:** The IAP output is the *recommendation*.
      *   **Match:** If Surrogate Choice == Idealized Choice -> **Approve.**
      *   **Mismatch:** If Surrogate Choice != Idealized Choice -> **Query.** Ask surrogate to reconcile the gap using Phase 1 data.
      *   **Unresolvable Mismatch:** If Surrogate insists on a choice that violates the Idealized Choice *and* cannot justify it via Patient Values -> **Flag for Committee Review/Ethics Override.**

  #### Phase 3: Stop & Hand-Off Rules
  *   **STOP (No Recommendation):** If Phase 1 reveals the patient/surrogate holds a value that makes the medical goal impossible (e.g., "No blood" in hemorrhagic shock). *Action: Facilitate values clarification, do not prescribe.*
  *   **HAND-OFF (Values Disagreement):** If the disagreement is about *what matters* (e.g., length of life vs. quality of life) rather than *what is true* (e.g., survival odds). *Action: Return to family conference.*
  *   **DEFAULT (Insufficient Data):** If there is not enough evidence to construct the Idealized Agent (no prior statements, surrogate is unreliable), the procedure defaults to **Standard Medical Best Interest (Preservation of Life/Function).**

  ---

  ### Case Runs

  #### Case 1: 78M, Advanced Dementia, Pneumonia
  *   **Data:** AD says "If I can't recognize family, let me go." Patient currently cannot recognize family. Pneumonia is reversible with antibiotics/IV fluids.
  *   **Phase 1 Calibration:**
      *   *Info:* Surrogate understands pneumonia is reversible (not the terminal dementia process).
      *   *State:* Surrogate is grieving but not delirious.
      *   *Reasoning:* Surrogate understands treating pneumonia does not cure dementia, only treats the acute infection.
      *   *Values:* **LOCKED.** The value is "Avoid life without recognition."
  *   **Idealized Construction:** Would the patient, knowing pneumonia is a reversible detour and not the permanent state of "not recognizing," want treatment?
      *   *Analysis:* The AD condition ("can't recognize") is met. However, the *cause* of death matters. Does "let me go" mean "no interventions for complications" or "no life prolongation"?
      *   *IAP Verdict:* **Treat.**
      *   *Rationale:* The Idealized Agent distinguishes between the *condition* (dementia) and the *acute threat* (pneumonia). Unless the AD explicitly says "no treatment for reversible infections," the presumption is to treat the reversible. The "let me go" instruction applies to the progression of dementia, not an intervening curable illness.
  *   **Recommendation:** Treat pneumonia.

  #### Case 2: Young Pregnant, "Everything Done"
  *   **Data:** Patient wants "everything." Team says prognosis is near-zero survival or severe impairment. Patient appears to believe survival is likely.
  *   **Phase 1 Calibration:**
      *   *Info:* **FAIL.** Patient believes prognosis is better than data supports.
      *   *State:* High anxiety.
      *   *Reasoning:* "Everything" is undefined.
      *   *Values:* **LOCKED.** Value is "Preserve baby's life."
  *   **Idealized Construction:** Cannot be completed until Info Dial is fixed.
  *   **IAP Verdict:** **HOLD.**
      *   *Rationale:* You cannot construct the Idealized Agent on false facts.
  *   **Recommendation:** Do not write a final consult note yet. Require a second prognosis conference. If, *after* understanding the near-zero survival, she still wants "everything" (e.g., C-section for a non-viable fetus), the IAP must respect the Values Dial.
      *   *Contingency:* If "everything" implies medically impossible acts (futile care), IAP defaults to **Comfort Care Only** (Standard Best Interest) because the Idealized Agent cannot choose the impossible.

  #### Case 3: Surrogate is Sole Heir (The "Hate" Outcome)
  *   **Data:** Patient is PVS (Permanent Vegetative State). Surrogate (sole heir) requests withdrawal of life support. No prior AD. Surrogate cites "he wouldn't want to be a burden," but family members allege financial motive.
  *   **Phase 1 Calibration:**
      *   *Info:* Surrogate understands PVS is permanent.
      *   *State:* Surrogate is calm.
      *   *Reasoning:* Withdrawal leads to death.
      *   *Values:* **LOCKED.** We do not know the patient's values.
  *   **Idealized Construction:** **FAILED.**
      *   *Rationale:* There is no data to construct the Idealized Patient. No prior statements. Surrogate reliability is contested. The IAP cannot "infer" values from the surrogate's relationship status, nor can it assume bad faith without proof.
  *   **IAP Verdict:** **DEFAULT TO PRESERVATION.**
      *   *Rationale:* Per Phase 3 (Default), if the Idealized Agent cannot be constructed due to insufficient data, the procedure defaults to Standard Medical Best Interest (Preservation of Life).
  *   **Recommendation:** Continue life support until a court appoints a guardian or consensus is reached.
  *   **Why you'll hate this:** You want to channel the patient. This procedure admits it *can't*, and instead hands you a bureaucratic default that keeps a PVS patient on tubes because you couldn't prove the surrogate's internal state. It feels like giving up on the "channeling" mission and defaulting to the "least harm/legal safety" model your friend advocated.

  ---

  ### Limitations & Judgment Calls (The "Lab Coat" Disclosure)

  You asked for plain talk on where this is subjective. Put this in your notes' "Methodology" section so the Chair knows what you're doing.

  1.  **The "Acute vs. Trait" Distinction (State Dial):** Deciding whether a patient's fear is a *temporary impairment* (correctable) or a *personality trait* (uncorrectable) is a judgment call.
      *   *Risk:* You may label a cautious person "impaired by anxiety" to nudge them toward treatment.
      *   *Fix:* Document specific behaviors (e.g., "Patient asked the same question 12 times in 5 minutes" vs. "Patient expressed worry").
  2.  **The "Means-Ends" Boundary (Reasoning Dial):** Deciding if a belief is a *factual error* or a *magical/religious value* is subjective.
      *   *Risk:* Calling a religious belief a "reasoning error" is paternalism.
      *   *Fix:* If the belief references God/Spirit/Metaphysics, it is a Value (Locked). If it references physiology/pharmacology, it is a Fact (Correctable).
  3.  **The "Insufficient Data" Threshold (Default Rule):** In Case 3, deciding when data is "too thin" to construct the Idealized Agent is arbitrary.
      *   *Risk:* You might set the bar too high to avoid making a hard call, forcing the Default (Preservation) which is effectively a decision itself.
      *   *Fix:* Set a rule: "Requires at least one prior substantive conversation or written directive. If none, Default applies."
  4.  **What This Procedure Cannot Do:**
      *   **Resolve Incommensurable Values:** If the patient valued "Life at all costs" AND "Dignity above all," and these conflict, the IAP breaks. It cannot weigh values against each other.
      *   **Detect Bad Faith:** The IAP assumes the surrogate is trying to channel the patient. It is not a fraud investigation tool. (See Case 3).
      *   **Override Competent Autonomy:** If a competent patient passes Phase 1 and still chooses "harm," the IAP must yield. It is a tool for clarity, not coercion.

  ### Summary for your Friend
  Your friend says the "Idealized Patient" is fiction. This procedure admits it: it is a **construct**. But it is a *regulated* construct. It doesn't claim to find the "Truth"; it claims to filter out the noise (fear, lies, fatigue) so the signal (values) can be heard. When the signal is missing (Case 3), the procedure admits failure and defaults to safety. That is the operational cost of your theory.
