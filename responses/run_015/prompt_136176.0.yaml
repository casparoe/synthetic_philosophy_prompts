  2.  **Deconstruct the Philosophy in this Context:**
      *   **Endurantism (3Dism):** Objects are wholly present at each time. Applied here: The Character is wholly present in Draft 1, wholly present in Draft 2, wholly present in Draft 3. They are the *same* entity.
