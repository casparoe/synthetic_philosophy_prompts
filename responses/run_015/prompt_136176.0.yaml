answer: |-
  Dear Writer,

  I know you are tired. Draft three is where the bones show through the skin, and it is where most people quit because the thing stops feeling like a dream and starts feeling like work. You asked about the sister, about the trauma, about whether the woman you are writing is the same woman you started with or a stranger wearing her name. I sat down with two voices inside my head to hash this out for you, not as abstract philosophy but as a fight over your manuscript. They started off talking past each other, which is usually how these things begin, one looking at the soul of the character and the other looking at the ink on the page.

  The endurantist started by stirring their coffee, insisting that the character is wholly present in every draft. They said that when you sit down to write draft three, you are not writing a new person, you are writing her again. She is entirely there in draft one, scars and sister and all, and she is entirely there in draft three, orphaned and altered. The endurantist argued that identity is rigid. You are not writing a sequence of different women who happen to share a name. You are writing one woman who persists through the changes of your mind. The perdurantist laughed at that, tapping the stack of printed pages. They said that is nonsense because the text is the only reality we have. The perdurantist argued that the character is a four-dimensional worm stretching across the timeline of your writing process. Draft one is just a temporal slice of the character. Draft three is another slice. They are not the same woman any more than a child is the same physical object as the adult they become. They are parts of a larger whole, connected by causality but distinct in properties.

  For a while, they just circled. The endurantist kept saying you love her, implying that love requires a single object to latch onto. You cannot love a worm, you love a person. The perdurantist kept saying you edit her, implying that editing destroys and replaces. You cannot change what is wholly present without destroying it. They were arguing about love versus labor, not metaphysics. But then the endurantist slammed a hand on the table and brought it to the hard spot you are worried about. They asked how the same wholly present entity can have contradictory properties. In draft one, she has a sister. In draft three, she is an only child. If she is wholly present in both, then she both has a sister and does not have a sister. That is a logical contradiction. You cannot be a sister and not a sister at the same time. The endurantist tried to dodge this by saying properties are relative to drafts. She has-a-sister-in-draft-one and lacks-a-sister-in-draft-three. But the perdurantist pounced on that immediately. If you have to relativize the properties like that, the perdurantist said, then you are admitting she isn't wholly present in the same way. You are admitting that her identity is fragmented across the drafts. You are treating her like a worm whether you want to or not.

  That is when the perdurantist tried to claim victory, but the endurantist turned the knife on the other side of the wound. The endurantist asked what happens to the reader. If perdurantism is right, then there is no single protagonist. There is just a scattered object of drafts. When a reader picks up the final book, they are not meeting the character. They are meeting the final temporal slice of a worm that includes all your deleted scenes and bad ideas. The perdurantist stumbled there. They tried to say the reader meets the completed worm, the total sum of the writing process. But the endurantist pressed harder. If the reader meets the worm, then the reader is reading the typos in draft one and the deleted sister in draft two as part of the character. But they are not. The reader meets the woman in draft three. If perdurantism wins, the endurantist said, then you are not writing a story. You are cataloging the history of your own revisions. There is no unity. There is no one to root for. There is just a sequence of events leading to a book.

  The perdurantist recovered and hit back with the problem of survival. They asked how the character survives the deletion. If you delete the sister in draft two, where did she go? The endurantist said she never existed, she was a mistake. The perdurantist said exactly, so the character in draft one is false. The character in draft three is true. They cannot be the same entity because one is built on a lie and the other on the truth. You cannot build a continuous identity on a contradiction. The endurantist argued that people change their minds about their own pasts all the time. A person can believe they had a childhood friend and then discover it was a dream. They are still the same person. The character is the same person even if your understanding of her history changes. The perdurantist rejected this analogy. They said a real person has a fixed past, even if unknown. A fictional character has no past except what you write. When you change the text, you change the ontology. You are not discovering her, you are making her. So draft one her is dead. Draft three her is newborn.

  They sat in silence for a moment after that, because that is the fear isn't it. That every time you hit delete, you kill something. The endurantist softened and said that if you believe perdurantism, you paralyze yourself. If every change creates a new entity, you can never finish. You are just spawning infinite worms. You have to believe she endures to have the courage to cut the sister out. You have to believe she is strong enough to survive the rewrite. The perdurantist conceded that point but warned that if you believe endurantism too hard, you become blind. You stop seeing that draft three is a different creature than draft one. You try to force the new trauma to fit the old reactions. You try to make the orphan act like the sister. You need to see the slices to see where the fit is wrong.

  So here is where they left it, and where I leave it with you. The endurantist is right that you need to treat her as one soul or you will never care enough to finish the book. You need to feel her persistence. But the perdurantist is right that the text is fragmented and you cannot ignore the contradictions. She is the same woman, but she is a woman who has survived a metaphysical injury. You changed her past. In the world of the book, she did not change her past, you did. But in the world of the writing, she is a thing that persists through your changes. Maybe the answer is not to choose one. Maybe she endures through the drafts, but she endures by shedding parts. Like a snake. The snake is the same animal, but the skin on the floor is not the snake. The sister is the skin. The trauma is the skin. She is the muscle underneath that you are trying to find.

  Do not worry about the philosophy too much tonight. The fact that you are worried about whether she is the same person means you are treating her as an endurantist. You are protecting her identity. That is what matters. The perdurantist can wait until copy edit. For now, just write the woman who is left when the sister is gone. Let the worm sort itself out later.

  Yours,
  A Friend
