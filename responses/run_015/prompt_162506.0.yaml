answer: |-
  This is a bold and intellectually ambitious thesis. Moving the debate from the sociological ("victors' justice") to the strictly legal (*nullum crimen sine lege*) is the correct move for a jurisprudential paper. It forces the discussion onto the terrain of positivism and statutory interpretation, where your argument can be tested more rigorously.

  However, before you commit to this argument, there is a significant factual hurdle you must clear, and a strategic pivot you may need to make. Here is an assessment of the soundness of your asymmetry thesis and advice on handling the inevitable objections.

  ### 1. The Factual Hurdle: Japan and the Kellogg-Briand Pact

  Your thesis rests on the premise that Germany was bound by the 1928 Pact of Paris (Kellogg-Briand), while Japan was not. **This premise is historically incorrect.**

  *   **Germany:** Signed August 27, 1928; Ratified March 12, 1929.
  *   **Japan:** Signed August 27, 1928; Ratified July 24, 1929.

  Japan was a full party to the Kellogg-Briand Pact during the Manchurian Incident (1931) and the invasion of China (1937). Like Germany, Japan had renounced war as an instrument of national policy. Therefore, the textual basis for "Crimes Against Peace" existed for Japan just as it did for Germany.

  **Implication for your thesis:** You cannot argue that Tokyo punished conduct that was *textually* unproscribed by treaty while Nuremberg did not. If you submit this to a referee familiar with diplomatic history, this factual error will undermine your credibility immediately.

  **How to save the argument:**
  You must shift the asymmetry from *treaty membership* to the **crystallization of customary international law** and the **temporal scope** of the charges.
  *   **Nuremberg:** The aggressive war charges largely focused on the invasion of Poland (1939) and subsequent invasions. By 1939, one could argue the Kellogg-Briand norm had hardened into customary law binding on individuals.
  *   **Tokyo:** The indictment began in 1928 (the assassination of Chang Tso-lin) and focused heavily on 1931 (Manchuria). You can argue that while the *treaty* existed, the *individual criminal liability* for violating it was not yet established customary law in 1931 to the same degree it might have been by 1939.
  *   **The Asymmetry:** Nuremberg prosecuted a "mature" crime; Tokyo prosecuted an "embryonic" one. The Tokyo Tribunal stretched the *nullum crimen* principle further back in time than Nuremberg did. This preserves your distinction of legality, not just degree, without relying on the incorrect treaty membership claim.

  ### 2. The Retroactivity Distinction (Charge vs. Liability)

  Your distinction between **charge retroactivity** (conduct not a crime) and **liability retroactivity** (state vs. individual responsibility) is sophisticated and legally sound. It mirrors the debate between the majority opinion and the dissenting opinions (particularly Justice Pal and Justice Röling).

  *   **Strength:** This is the strongest part of your paper. It isolates the *nullum crimen* principle from the moral outrage of the crimes.
  *   **Weakness:** As framed, this distinction applies equally to **both** tribunals. The London Charter and the Tokyo Charter defined individual responsibility for state acts in nearly identical language. If "liability retroactivity" is a legal defect, it is a defect shared by Nuremberg and Tokyo.
  *   **Refinement:** To maintain the asymmetry, you must argue that the *context* made liability retroactivity more egregious in Tokyo. For example, the German state apparatus was thoroughly dismantled, making the "state vs. individual" distinction clearer. In Japan, the preservation of the *Kokutai* (national polity) and the immunity of the Emperor (see below) muddied the waters of individual responsibility, making the leap to punishing subordinates for "state acts" legally incoherent in a way that Nuremberg was not.

  ### 3. Answering the "Victors' Justice" Objection

  You are correct that hypocrisy (Allied conduct, Unit 731, Emperor immunity) is often treated as a political complaint. However, a sharp referee will not let you dismiss it as merely "sociological." In legal terms, selective prosecution can amount to an **abuse of process** or a violation of **equality before the law**, which touches on the legitimacy of the tribunal's jurisdiction.

  Here is how you should handle these three specific points legally:

  **A. Allied Conduct (e.g., Bombing of Dresden/Tokyo, Submarine Warfare)**
  *   **The Objection:** If aggressive war and atrocities are crimes, why were Allied leaders not charged for similar acts?
  *   **Your Reply:** Distinguish between *jurisdictional validity* and *prosecutorial discretion*. A court does not lose jurisdiction over Defendant A because it fails to prosecute Defendant B. While selective enforcement is politically hypocritical, it does not technically void the *lex scripta* under which Defendant A is charged.
  *   **Caveat:** Acknowledge that if the law is truly customary, it must apply universally. If the Allies exempted themselves, they implicitly admitted the law was not yet customary, but rather *ex post facto* legislation. This actually *helps* your thesis regarding Tokyo if you argue the Allies knew the law was shaky (hence the exemptions) but applied it more rigorously to Germany than Japan.

  **B. The Emperor's Immunity**
  *   **The Objection:** Hirohito was the head of state and commander-in-chief. Exempting him voids the logic of prosecuting his subordinates for "following orders" or acting as instruments of the state.
  *   **Your Reply:** This is your strongest legal point for asymmetry. At Nuremberg, the "Head of State" defense was explicitly rejected (Article 7 of the London Charter). While Hitler was dead, other heads of state (like Dönitz) were tried. In Tokyo, the immunity granted to Hirohito was a political directive from SCAP (MacArthur), not a judicial finding.
  *   **Argument:** You can argue that Nuremberg maintained the *internal legal consistency* of the Charter (Head of State is not a defense), whereas Tokyo violated its own Charter's logic by immunizing the primary Head of State. This makes Tokyo legally incoherent in a way Nuremberg was not.

  **C. Unit 731 Immunity**
  *   **The Objection:** Granting immunity for data undermines the truth-finding mission and the rule of law.
  *   **Your Reply:** Frame this as an evidentiary corruption rather than a jurisdictional void. It suggests the Tribunal was an instrument of intelligence gathering rather than justice. However, be careful: this leans back toward the "political" argument.
  *   **Better Approach:** Use this to highlight the **procedural asymmetry**. The Nuremberg Tribunal had stricter rules of evidence and greater judicial independence from the prosecution than the Tokyo Tribunal, where the prosecution was dominated by the US and the defense was severely hampered. You can argue that Tokyo's procedural irregularities (including the 731 deal) compromised the *due process* rights of the defendants, rendering the verdicts legally suspect compared to Nuremberg.

  ### 4. Strategic Recommendations for the Paper

  1.  **Correct the Treaty Fact:** Immediately verify and correct the claim regarding Japan's ratification of Kellogg-Briand. Do not build the argument on Japan's non-participation.
  2.  **Pivot to Customary Law & Timing:** Argue that while the *treaty* bound Japan, the *customary criminalization* of aggression for individuals was not sufficiently crystallized in 1931 (Manchuria) to satisfy *nullum crimen sine lege*, whereas by 1939 (Poland), it was. This makes Tokyo's temporal reach the legal flaw, not the treaty basis.
  3.  **Refine "Victors' Justice":** Do not dismiss it as merely political. Concede that hypocrisy damages moral authority, but insist it does not void jurisdiction *unless* it rises to the level of procedural impropriety (e.g., the Emperor's immunity undermining the chain of command logic).
  4.  **Leverage the Dissents:** Cite Justice Radhabinod Pal's dissent in Tokyo. He argued extensively on *nullum crimen* and the lack of positive law regarding aggression. Contrast this with the Nuremberg judgments, which were more unified. The existence of a robust, legally grounded dissent in Tokyo (but not Nuremberg) supports your asymmetry thesis.
  5.  **Focus on Judicial Independence:** The Tokyo Tribunal was far more controlled by the Supreme Commander for the Allied Powers (SCAP) than Nuremberg was by the Control Council. Judges could be removed (and were, in the case of the Indian judge's initial replacement attempt, though Pal remained). This procedural lack of independence makes Tokyo's legal standing weaker than Nuremberg's.

  ### Verdict

  **Is the asymmetry thesis sound?**
  Yes, but not on the specific factual ground you initially proposed (treaty membership). The asymmetry exists, but it lies in the **temporal application of customary law**, the **procedural independence of the tribunal**, and the **immunity of the Head of State**.

  **Should you set aside the "Victors' Justice" objection?**
  No. You should reframe it. Do not treat it as a complaint about hypocrisy; treat it as a complaint about **selective enforcement undermining the formation of customary law**. If the Allies exempted themselves and the Emperor, they demonstrated that the law was not yet universal. Since universality is a requirement for customary international law, this political act has a legal consequence: it suggests the law did not yet exist. This allows you to absorb the "victors' justice" critique into your *nullum crimen* argument rather than dismissing it.

  If you make these adjustments, you will have a paper that makes a genuine contribution to international legal theory, moving beyond the standard moral condemnation of the tribunals.
