  Here's a decision tree built around those three concrete cases. I've structured it so you can walk through the cases sequentially to see where different theoretical positions land. I kept the tone loose and flagged where the cases fail to distinguish between theories.

  ### **Units of Selection Decision Tree**

  **START: The Sterile Worker Ant**
  *Where is the primary causal work being done to explain sterility?*

  *   **Branch A: The Queen's Genome**
      *   (Logic: Genes for sterility spread because queens carrying them reproduce more.)
      *   **→ Move to Case 2: Synthetic Plasmids**
          *   *Scenario: Plasmid boosts biofilm survival, kills carrier bacterium.*
          *   **Option A1: Gene-level (The Plasmid)**
              *   (Logic: The plasmid is the selfish replicator.)
              *   **→ Move to Case 3: Cultural Norms**
                  *   *Scenario: Costly norm hurts individual, helps group.*
                  *   **Option A1-i: Individual-Meme Level**
                      *   **LEAF: Dawkins-style Gene/Meme Selectionism.**
                      *   (Consistent replicator focus across all cases.)
                  *   **Option A1-ii: Group Level**
                      *   **LEAF: Unstable.**
                      *   It's theoretically messy to claim genes drive ants but groups drive humans without a bridging mechanism.
          *   **Option A2: Group-level (The Biofilm)**
              *   **LEAF: Unnamed.**
              *   This combo is unattractive because it treats the ant queen as the unit but the bacterial collective as the unit inconsistently.
          *   **Option A3: Holobiont-level (Bacterium + Plasmid)**
              *   **LEAF: Unoccupied (Incoherent).**
              *   You can't argue for holobiont selection here when the host bacterium dies faster than non-carriers.

  *   **Branch B: The Colony as Interactor**
      *   (Logic: The colony survives and reproduces; workers are organs.)
      *   **→ Move to Case 2: Synthetic Plasmids**
          *   *Scenario: Plasmid boosts biofilm survival, kills carrier bacterium.*
          *   **Option B1: Gene-level (The Plasmid)**
              *   **LEAF: Unnamed (Unexplored).**
              *   Few theorists treat the ant colony as the unit but revert to gene-selection for bacteria in the same framework.
          *   **Option B2: Group-level (The Biofilm)**
              *   (Logic: The biofilm is the interactor surviving the environment.)
              *   **→ Move to Case 3: Cultural Norms**
                  *   *Scenario: Costly norm hurts individual, helps group.*
                  *   **Option B2-i: Group Level**
                      *   **LEAF: Wilson/Sober Multilevel Selection OR Hull's Interactor/Replicator.**
                      *   (Note: These two land on the same leaf here; see flags below.)
                  *   **Option B2-ii: Individual-Meme Level**
                      *   **LEAF: Unstable.**
                      *   Claiming groups select in biology but individuals select in culture creates a discontinuity most theorists avoid.
          *   **Option B3: Holobiont-level (Bacterium + Plasmid)**
              *   **LEAF: Holobiont Selection (Partial Fit).**
              *   This position is unattractive in this specific case because the host fitness is negative, though proponents might argue long-term lineage benefits.

  *   **Branch C: The Worker's Developmental Program**
      *   (Logic: The worker's phenotype is the direct target of selection.)
      *   **→ Move to Case 2: Synthetic Plasmids**
          *   *Scenario: Plasmid boosts biofilm survival, kills carrier bacterium.*
          *   **Option C1: Gene-level**
              *   **LEAF: Unoccupied (Incoherent).**
              *   If the sterile worker is the unit, gene-level selection in bacteria contradicts the ant premise.
          *   **Option C2: Group-level**
              *   **LEAF: Unoccupied (Incoherent).**
              *   Sterile workers don't reproduce, so treating them as the unit of selection is generally considered a category error.
          *   **Option C3: Holobiont-level**
              *   **LEAF: Unoccupied (Incoherent).**
              *   Same issue as above; sterile individuals cannot sustain a lineage as a standalone unit.

  ---

  ### **Important Flags & Limitations**

  **1. The Wilson/Sober vs. Hull Collapse**
  On these three specific cases, **Wilson/Sober Multilevel Selection** and **Hull's Interactor/Replicator distinction** land on the exact same leaf (Branch B → Option B2 → Option B2-i). Both agree the colony/biofilm/group is the "vehicle" or "interactor" doing the surviving, while genes/memes are the replicators. This taxonomy cannot separate them because it sorts by concrete causal outcomes, not by their philosophical disagreement over definitions of "replicator."

  **2. The Holobiont Gap**
  The **Holobiont Selection** position is forced into an "Unattractive" or "Partial Fit" box in the Plasmid case because your scenario specifies the host dies faster. Real-world holobiont theory usually relies on host-symbiont mutualism. If you change the case so the bacterium *lives longer*, that leaf becomes a strong fit for Holobiont Selection; as written, the case stacks the deck against it.

  **3. The "Worker Program" Dead End**
  Branch C (Worker's Developmental Program) is almost entirely unoccupied. This isn't an accident; most serious positions in the debate agree that sterile individuals cannot be the primary unit of selection because they are an evolutionary dead end. I left it in because you asked for it, but treat it as a "control" branch to show where theories *don't* go.

  **4. Gene-Selectionism Consistency**
  Notice that **Dawkins-style Selectionism** is the only position that stays perfectly consistent across all three cases (Queen's Genome → Plasmid → Meme). Every other position requires some shift in perspective (e.g., treating the colony as an interactor but the gene as a replicator), which is fine, but this tree highlights that gene-selectionism is the most parsimonious path through these specific examples.
