      *   *Verdict:* The "Scientist" analogy works for PP (cognitive level). The "Soap Bubble" works for FEP (thermodynamic level). Mixing them confuses the *normative* (science aims for truth) with the *descriptive* (systems aim for persistence). The supervisor is sliding between levels.

