      *   **Task 5:** Evaluate the user's alternative analogy ("Brain as a self-powering, grant-writing, silent lab"). Is it better? Suggest a better analogy if possible, weighing costs/benefits.
      *   **Constraint:** No citations or reading lists. Just the argument.

  2.  **Deconstruct the "Brain as Scientist" Analogy (Task 1):**
      *   *Hypothesis:* Generative Model / Priors.
      *   *Data:* Sensory Input (Proprioceptive, Exteroceptive, Interoceptive).
