      *   *Data Independence:* Scientist data is (ideally) independent of hypothesis. Brain data is *created* by action (active inference). *Load-bearing:* Yes, affects "Perception = Hallucination." If I can move the world to fit the model, the distinction between "tracking reality" and "imposing model" blurs more than in standard science.
      *   *Error Reduction:* Scientist changes theory. Brain changes theory OR world. *Load-bearing:* Yes, crucial for the "Dark Room" problem and the definition of perception.
      *   *Dark Room:* Scientist doesn't unplug to avoid falsification (ideally). Brain *does* seek low uncertainty states. *Load-bearing:* Yes, threatens the rationality implied by "Scientist."
