      *   *Explicit Statement:* Scientist writes papers. Brain doesn't. *Noise.*

  4.  **Analyze Imported Features (Task 3):**
      *   *Intentions:* Scientist has goals. Brain has "goals" only metaphorically (minimize F). *Risk:* Anthropomorphism.
      *   *Community:* Science is social. PP is often individualistic. *Risk:* Misses the social construction of "reality" which helps define delusion.
      *   *Fear of being wrong:* Scientist has ego. Brain has homeostatic imperative. *Risk:* Confuses normative rationality with biological survival.
      *   *Survival of Conclusions:*
