prompt: |-
  Next tuesday I'm presenting to the research committee at a big global-health funder: mostly health economists who do everything in DALYs with a positive discount rate, the director who is a treasury-style skeptic about anything he can't put a number on, and one sympathetic philosopher who will not actually defend me. My thesis is that human extinction is bad in a way that isn't just the deaths and isn't just the discounted future QALYs either — that a real chunk of what makes anything we're doing now worth doing is hosted by people who will come after us, so extinction also retroactively shrinks the point of everything happening before it. I'm leaning on Scheffler's afterlife conjecture but trying to push it toward something a funding committee could act on.

  I'm opening with two cases and I want the Q&A built around them. Case one, the "one-day world": nobody dies early, nobody suffers, but some neurological change means no one can form or care about any project reaching more than about a day ahead. Case two, the archive world: humans die out, but a complete record of everything we made and cared about survives and is genuinely studied and valued by non-human successors for millennia. My line is that case one is nearly as bad as extinction and case two is much less bad than it — which I read as showing that what matters is continued forward-looking valuing, not the species as such and not welfare.

  Can you write me the prep sheet? The eight or so objections I'll actually get from this audience rather than from philosophers, ordered by how much damage they'd do, phrased the way a health economist or a treasury skeptic would put them — discounting, double counting with future lives, the Parfit-style point about people who'd never otherwise exist, "if nobody knows it's coming then nothing is lost", "unmeasurable so ignore it" — each with a two-minute reply and a note on where the reply is softest. And include the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** A philosopher/researcher presenting to a global-health funding committee.
      *   **Audience:**
          *   Majority: Health economists (DALYs, positive discount rates, quantitative).
          *   Director: Treasury-style skeptic (needs numbers, risk-averse, pragmatic).
          *   One Ally: Sympathetic philosopher (won't actively defend).
      *   **Thesis:** Human extinction is bad not just because of lost welfare (QALYs/DALYs) but because it retroactively diminishes the value of current projects (Scheffler's Afterlife Conjecture applied to funding). Value depends on *forward-looking valuing* by successors.
      *   **Opening:** Two cases ("One-Day World" vs. "Archive World").
      *   **Task:** Create a prep sheet with ~8 objections ordered by damage potential, phrased in the audience's language (economist/skeptic), with 2-minute replies, weakness notes, and the "hope nobody asks" question.

  2.  **Deconstruct the Thesis & Audience Tension:**
      *   *Thesis:* Value is relational/temporal. Extinction kills meaning, not just lives.
      *   *Audience:* Value is aggregative/welfarist. Extinction kills QALYs. Discount rates make far future negligible.
      *   *Conflict:* The user is arguing for a qualitative shift in how value is calculated (meaning/continuity) against a group trained to quantify welfare (DALYs). The Director wants ROI. The Economists want models.
      *   *Strategy:* The replies need to bridge the gap. Don't get bogged down in metaphysics. Translate "meaning" into "incentive structures," "investment logic," or "risk premiums."

  3.  **Drafting the Objections (Brainstorming & Filtering):**
      *   *Idea 1:* Discounting. (Classic economist move). "Why care about year 3000?"
      *   *Idea 2:* Double counting. "Aren't you counting the lives *and* the meaning?"
      *   *Idea 3:* Non-identity problem. "The future people don't exist yet." (Parfit).
      *   *Idea 4:* Measurement. "How do you put a number on this?" (Director).
      *   *Idea 5:* Knowledge/Subjectivity. "If we don't know we're going extinct, does it matter?"
      *   *Idea 6:* Opportunity Cost. "Why fund this instead of malaria nets?"
      *   *Idea 7:* Substitution. "Aliens/AI valuing us is enough (Archive World)."
      *   *Idea 8:* Perversity. "Does this mean we should force future people to exist?"

      *Selection & Ordering (by Damage):*
      1.  *The "Unmeasurable/Ignore It" Objection (Director).* Highest damage. If it can't be measured, it doesn't exist for budgeting.
      2.  *The Discount Rate Objection (Economists).* Standard toolkit. Destroys long-term value.
      3.  *The Opportunity Cost/DALYs Objection (Health Economists).* "Why not save lives now?"
      4.  *The Double Counting Objection (Economists).* "Are you inflating the benefit?"
      5.  *The "If Nobody Knows" Objection (Skeptic).* Challenges the mechanism of value loss.
      6.  *The Non-Identity/Existence Objection (Philosophical/Economist mix).* "Can you harm those who won't exist?"
      7.  *The Archive/AI Substitution Objection (Based on Case 2).* "Why do *humans* need to exist?"
      8.  *The Perversity/Repugnant Conclusion Objection.* "Does this force population growth?"

      *Refining Phrasing:* Make them sound like economists/bureaucrats. Use terms like "marginal utility," "counterfactual," "operationalizable," "risk premium."

  4.  **Drafting the Replies:**
      *   *Constraint:* 2 minutes spoken (approx. 250-300 words).
      *   *Goal:* Acknowledge the frame, pivot to the thesis, offer a pragmatic hook.
      *   *Weakness Note:* Be honest about where the argument leaks.

  5.  **Developing the "Hope Nobody Asks" Question:**
      *   Needs to be the fatal flaw in the operationalization.
      *   *Idea:* "If meaning depends on the future, and the future depends on us, isn't this a circular justification for infinite spending with zero accountability?"
      *   *Better:* "What is the specific marginal intervention?" If the answer is vague, the funding dies.
      *   *Best:* "If the value is retroactive/relational, does preventing extinction *now* actually preserve the value of the *past*, or are you just asking us to pay for a feeling?" -> Let's go with the "Operationalization/Trade-off" question. "Give me a specific trade-off where this metric changes a decision from the DALY metric."

  6.  **Review and Refine:**
      *   *Tone Check:* Is it respectful but firm? Yes.
      *   *Audience Check:* Are the economists addressed in their language? (e.g., framing "meaning" as "investment horizon").
      *   *Case Integration:* Ensure the replies reference the One-Day/Archive cases where relevant.
      *   *Scheffler Check:* Ensure the "Afterlife Conjecture" isn't over-explained but used as the engine.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Discounting" reply doesn't just say "discounting is wrong." It needs to say "discounting misses the asset class."
      *   *Correction:* The "Double Counting" reply needs to clarify that meaning *is* the value, not an add-on.
      *   *Correction:* Ensure the "Director" objection gets the most pragmatic answer.

  8.  **Final Output Generation:** (Matches the structure requested).
      *   Header.
      *   Context/Strategy.
      *   The 8 Objections (Phrasing, Reply, Soft Spot).
      *   The "Doom" Question.
      *   Closing advice.

  *(Self-Correction on the "Archive World" objection)*: The user says Case 2 is *less bad*. The objection might be "If aliens value us, why do we need humans?" The reply must emphasize *continuity of agency*, not just record-keeping.

  *(Self-Correction on "One-Day World")*: The objection might be "Welfare is high in One-Day World." Reply: "Welfare without projecthood is hollow."

  Let's assemble the document.cw
answer: |-
  # PREP SHEET: The Afterlife Conjecture & Funding Horizons
  **To:** Principal Investigator
  **From:** Strategy Desk
  **Re:** Research Committee Q&A (Global Health Funder)
  **Context:** You are arguing for a *structural* value of continuity (Scheffler) against a *welfarist* value of aggregates (DALYs). Your audience speaks "efficiency," "discount rates," and "counterfactuals." Do not speak "metaphysics." Speak "investment horizons" and "asset depreciation."

  ---

  ## THE 8 OBJECTIONS (Ordered by Lethality)

  ### 1. The "Operational Null" (The Director)
  **Phrasing:** "Let's say I accept your premise. Extinction destroys 'meaning.' But my mandate is to allocate capital to measurable interventions. If you can't give me a unit of account for 'meaning' comparable to a DALY, I have no lever to pull. If it's unmeasurable, it's effectively zero for budgeting purposes. Why shouldn't I ignore this?"
  **The 2-Minute Reply:** "You're right that we can't price meaning directly yet. But you already price *risk* without knowing the exact outcome. You buy fire insurance for a building not because you know the fire will happen, but because the *loss of the asset* is total. Current models treat humanity like a flow of income (QALYs/year). I'm arguing humanity is the *capital asset* itself. If the asset dissolves, the income stream's present value isn't just discounted; it's writ down to zero. I'm not asking you to measure 'meaning.' I'm asking you to treat extinction risk as a catastrophic depreciation event on the entire portfolio, which justifies a risk premium even without a precise unit of account."
  **Soft Spot:** The Director can still say, "Show me the premium calculation." If you can't quantify the risk premium, he defaults to zero.

  ### 2. The "Hyperbolic Discounting" (The Health Economists)
  **Phrasing:** "We use a positive discount rate for a reason: uncertainty and opportunity cost. A benefit in 200 years is worth fractions of a penny today. Your 'continuity value' accrues almost entirely to the far future. Even if it's real, discounting swamps it. Why fund this over malaria nets saving lives *now*?"
  **The 2-Minute Reply:** "Standard discounting assumes the future is a series of independent transactions. My argument is that the *current* transaction's value depends on the future one. Think of it like a pension fund. If you know the fund collapses in 30 years, the contributions you make *today* lose their logic. The 'One-Day World' case shows this: welfare is high today, but because the horizon is gone, current effort collapses. The value isn't just in the future QALYs; it's in sustaining the *condition* that makes current QALYs meaningful. That's a present-day benefit, not a future one, so it shouldn't be discounted away."
  **Soft Spot:** Economists hate "present benefits from future conditions." They will demand you isolate the marginal utility gain *today*.

  ### 3. The "Double Counting" (The Chief Economist)
  **Phrasing:** "You're counting the lost lives (DALYs) AND the lost 'meaning.' Isn't this double counting? If I save a life, I save their future welfare. Adding a 'meaning premium' inflates the benefit of extinction prevention without adding new good."
  **The 2-Minute Reply:** "It's not double counting; it's correcting a category error. DALYs count the *passenger*, I'm counting the *journey*. In the 'Archive World' case, the 'passengers' are gone, but the 'journey' is recorded. You'd say that's a total loss of QALYs. I'm saying it's a partial loss of value. Conversely, in the 'One-Day World,' QALYs are high, but value is low. The 'meaning' component varies independently of welfare. If we only fund based on DALYs, we underinvest in continuity (extinction risk) and overinvest in temporary welfare. We need to account for the *host* of the value, not just the value instances."
  **Soft Spot:** They will argue that "meaning" is just a subjective preference, which is already captured in utility functions (QALYs).

  ### 4. The "Counterfactual Malaria" (The Pragmatist)
  **Phrasing:** "Okay, extinction is bad. But resources are finite. Every dollar you spend on 'continuity' is a dollar not spent on saving 1,000 children from malaria. Unless your 'meaning multiplier' is infinite, the near-term suffering dominates. How do you justify the trade-off?"
  **The 2-Minute Reply:** "I'm not arguing we stop saving children. I'm arguing that the *justification* for saving children relies on the continuity thesis. Why save a child? To let them live a life. If the world ends in 50 years, that life is truncated. If the world ends tomorrow, saving the child is arguably cruel. The 'point' of the malaria net is borrowed from the future. I'm asking the committee to recognize that extinction risk is a *threshold* issue. Below the threshold, malaria nets are priority #1. But if we drift toward the threshold, the marginal value of moving away from it spikes non-linearly. We need a firewall budget, not a substitution."
  **Soft Spot:** "Firewall budget" sounds like earmarking. They hate earmarking. They want marginal efficiency.

  ### 5. The "Ignorance is Bliss" (The Treasury Skeptic)
  **Phrasing:** "In your 'One-Day World,' people don't know the future is gone. In extinction, the dead don't know they're extinct. If the subjects don't experience the loss of meaning, where is the harm? You're positing a 'view from nowhere' harm. I fund based on experienced welfare."
  **The 2-Minute Reply:** "Harm isn't just experienced pain; it's frustrated agency. If I build a hospital expecting it to serve for 50 years, and it burns down in one, my effort was wasted even if I didn't see the fire. The 'One-Day World' shows that our current motivation *already* depends on the future. We work harder and more cooperatively when we believe in successors. If extinction is certain, current productivity and social cohesion drop *now*. The harm is the retroactive devaluation of current effort, which is experienced as cynicism or disengagement. We can measure that in GDP or social trust metrics."
  **Soft Spot:** Linking "existential dread" to GDP is tenuous. They may ask for the elasticity of "meaning" on productivity.

  ### 6. The "Non-Identity Problem" (The Philosopher-Economist)
  **Phrasing:** "Parfit's point: The people who would live in the future don't exist yet. If we go extinct, we don't harm *them* because they never exist. You can't compare existence to non-existence. So what are we maximizing?"
  **The 2-Minute Reply:** "I'm bypassing the 'harm to them' argument. I'm focusing on 'value for us.' Scheffler's point is that *our* current reasons for acting depend on *their* existence. It doesn't matter if they are specific individuals. It matters that there is a 'them.' The value being protected is the coherence of *our* current projects. We aren't maximizing future utility; we are protecting the necessary conditions for current utility. It's like maintaining the rule of law: we don't do it for specific future citizens, but because without it, our current contracts are worthless."
  **Soft Spot:** This sounds like circular reasoning. "We value it because we value it."

  ### 7. The "Archive/AI Substitution" (Based on Case 2)
  **Phrasing:** "In your 'Archive World,' non-humans value our records. If value is just 'forward-looking valuing,' why does it need to be *human* valuing? If AI or aliens preserve our math and art, isn't the 'meaning' preserved? Why fund human survival specifically?"
  **The 2-Minute Reply:** "Because the 'valuing' needs to be part of the same causal chain to sustain *our* motivation. If I write a paper knowing only aliens will read it, but no human successor will ever build on it, my motivation changes. It becomes a message in a bottle, not a contribution. The 'Archive' is a museum; museums are for dead cultures. We want to fund a living culture. The specific mechanism is *agency continuity*. We need successors who can *act* on our values, not just observe them. That requires biological or cognitive continuity, not just data storage."
  **Soft Spot:** This relies on a specific definition of "agency" that might seem speciesist or arbitrary to a utilitarian.

  ### 8. The "Repugnant Conclusion" (The Ethicist)
  **Phrasing:** "If 'continuity' is the goal, does this imply we should maximize population at any cost? If a billion miserable people keep the chain going better than a million happy people, does your model prefer the billion? You risk justifying a 'zombie' future just to avoid extinction."
  **The 2-Minute Reply:** "No, because the 'valuing' must be robust. A population of miserable people cannot sustain the complex projects that generate meaning. The 'One-Day World' has no suffering, but it's still bad. Quality of agency matters, not just quantity of bodies. We need successors capable of *valuing* us. If the quality of life drops below a threshold of agency, the 'meaning' transmission breaks anyway. So we need both welfare and continuity. It's a constraint, not a maximand."
  **Soft Spot:** Defining the "threshold of agency" is subjective. They will ask for the cutoff.

  ---

  ## THE "HOPE NOBODY ASKS" QUESTION
  **The Question:** "You've argued that extinction retroactively shrinks the value of the past. But funding decisions are prospective. If the value of *today's* spending depends on the *future*, and the future depends on *today's* spending, aren't you describing a circular loop with no external anchor? **Can you name one specific intervention where your 'Meaning Metric' would fund something the 'DALY Metric' would reject?** If not, you haven't given us a decision tool, you've given us a mood."

  **Why it kills you:** It exposes that your thesis might be a *justification* for existing work rather than a *guide* for new work. If you can't point to a marginal change in allocation (e.g., "Fund this obscure bio-surveillance project instead of these bednets"), the Director will classify it as philosophy, not research.

  **Prep for the Dodge:** Have a ready example.
  *   *Suggestion:* "Long-term institutional resilience vs. short-term aid."
  *   *Line:* "DALYs fund the vaccine. My metric funds the cold-chain infrastructure that ensures the vaccine program lasts 50 years. The DALY model discounts the infrastructure heavily because the benefits are far out. My model recognizes that without the infrastructure, the vaccine's value retroactively collapses to a one-off. I shift margin from 'distribution' to 'permanence'."

  ---

  ## STRATEGIC NOTES
  1.  **Don't say "Meaning."** Say "Investment Horizon" or "Project Durability."
  2.  **Don't say "Retroactive."** Say "Current Asset Valuation."
  3.  **Leverage the Ally:** If the philosopher asks a soft ball, answer it thoroughly to burn time, then pivot to the economists.
  4.  **The Director is the Boss:** If he looks bored, stop talking about Scheffler and start talking about "Catastrophic Risk Depreciation."

  **Good luck. Keep it secular, keep it financial, keep it structural.**
