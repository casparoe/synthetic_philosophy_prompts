answer: |-
  **Which Imprecise Probabilist Are You, Actually?**

  You tell your flatmate, "I don't have a single number for this." They say you're just blind to your own sharp credence. You say the blur is real. To settle it, don't argue theory—answer these concrete cases.

  **1. Ellsberg Urn:** Known 50/50 mix vs. Unknown mix. Do you treat them differently?
  *   **No:** → **Leaf 1: The Reluctant Bayesian.**
      *   *Awkwardness:* You must believe you have a hidden number you just can't find.
  *   **Yes:** → Go to 2.

  **2. Bet-at-every-price:** Your range is 0.4–0.7. Would you accept a bet at *any* price inside that range?
  *   **Yes:** → **Leaf 2: The Permissivist.**
      *   *Awkwardness:* You might reject a sure gain if it falls between admissible options.
  *   **No:** → Go to 3.

  **3. Forced Act:** Must choose now. Do you maximize the minimum gain (maximin)?
  *   **Yes:** → **Leaf 3: The Robust Decider.**
      *   *Awkwardness:* You ignore likely upside to avoid unlikely downside.
  *   **No:** → Go to 4.

  **4. Two Sources:** Experts say 0.4 and 0.7. Do you keep the whole spread?
  *   **No (Average):** → **Leaf 4: The Pooler.**
      *   *Awkwardness:* You sharpen uncertainty just because two people disagreed.
  *   **Yes:** → Go to 5.

  **5. Conditioning:** Can new evidence make your interval *wider* (dilation)?
  *   **Yes:** → **Leaf 5: The Dilationist.**
      *   *Awkwardness:* You sometimes pay to avoid free information.
  *   **No:** → Go to 6.

  **6. One-sided:** Drug definitely safe, efficacy unknown. Do you keep a one-sided range?
  *   **Yes:** → **Leaf 6: The Imprecise Realist.**
      *   *Awkwardness:* Your probability mass doesn't sum cleanly.
  *   **No:** → **Leaf 7: The Unnamed.**
      *   *Awkwardness:* You claim imprecision but collapse it whenever tested.

  ***

  **Meta-Analysis**

  **Indistinguishable Leaves:** Leaf 3 (Robust) and Leaf 7 (Unnamed) often behave identically in practice. Both reject bets inside the range and refuse to sharpen; one cites a maximin rule, the other cites "vagueness," but their wallets look the same.

  **Unoccupied Combinations:** The tree allows saying "Yes" to Ellsberg (Real Range) but "No" to Two Sources (Average). This implies the range is ontologically real, yet you sharpen it arbitrarily when experts disagree. Nobody holds this consistently; if the blur is real, averaging destroys information without cause.
