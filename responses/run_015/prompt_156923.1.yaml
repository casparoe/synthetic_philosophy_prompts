  I've been working through the Dennett-Caruso debate on just deserts and punishment, and I've constructed an argument that seems to collapse into self-defeat. Here are the steps as I have them. (1) Caruso rejects retributivism on the ground that if an agent's action is fully determined by factors outside her control, then she cannot genuinely deserve suffering for it; desert requires a kind of ultimate authorship that determinism rules out. (2) Dennett replies that this demands an impossible metaphysics: what matters for responsibility is whether the agent has the right kind of control—elbow room within a determined system—not whether she is an uncaused cause of herself. (3) Now apply Caruso's standard consistently upward, to what we might call architectural desert: anyone who designs, advocates for, or administers an alternative system—say, a public-health quarantine model—also acts from fully determined causes. (4) So by Caruso's own criterion, no reformer possesses the ultimate authorship needed to deserve the authority to impose her system, and no citizen can be said to deserve the rational obligation to accept it over Dennett's. (5) Yet Caruso plainly intends his argument to carry normative force: he claims we ought to abandon retributivism because reason demands it, which presupposes that determined agents can still generate binding reasons. (6) That presupposition is precisely the compatibilist elbow room Dennett defends; without it, Caruso's advocacy is just deterministic noise with no more authority than a rockslide. (7) Therefore Caruso's position proves too much: it either undermines the standing of its own proponents or secretly concedes the compatibilist point it aims to deny. I am inclined to hold onto (1) and (5), because giving up either feels like abandoning the core of the dispute, but I recognize that something between them must break. Which step should I reject, what is the precise flaw—an equivocation about levels of authorship, a hidden scope shift, or a conflation of metaphysical desert with rational authority—and what does each side pay if that step falls? Please respond in continuous prose only, with no headings, bullet points, bold text, or tables, the way one would write an email or a letter.
