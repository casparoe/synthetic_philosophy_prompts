prompt: |-
  I am leading a discussion section in my moral philosophy course on Kant's indirect-duty account of animals, drawn primarily from the Doctrine of Virtue and the Lectures on Ethics. The participants are second-year philosophy students who have just completed the Groundwork and are fluent with the Formula of Humanity, but they have not yet read Kant's practical philosophy beyond that text. I want to design the explanatory arc for a fifty-minute session, not deliver the explanation myself.

  Please plan the sequence in the following order. First, identify the conceptual distinction that must be secured before the indirect-duty thesis can even be introduced—specifically the difference between direct and indirect duties, and the criterion by which a being qualifies as an end in itself—and explain why each depends on the other and on the Formula of Humanity. Second, propose the single carrying example that should run through the session; I am considering contrasting the farmer who humanely ends the life of an aging, suffering workhorse with the farmer who beats a horse for sport, and I want you to evaluate whether this pair succeeds in isolating the agent's character from the animal's moral status, or whether it introduces a confounding utilitarian intuition about suffering that will derail the point. Third, map the misconceptions the students are likely to import—such as the belief that Kant denies animals can suffer, that he grants them derivative rights, or that his view collapses into a form of indirect utilitarianism—and specify the exact point in the sequence where each should be intercepted and defused. Fourth, design the final check: one question or exercise I can pose at the end that will reveal whether they have understood that, on Kant's view, the wrongness of cruelty is located in the damage to the agent's moral disposition rather than in any harm done to the animal. Fifth, state explicitly what I should refuse to explain at this level—perhaps the metaphysical discussion of animal cognition in the Critique of Judgment or the precise taxonomy of duties in the Metaphysics of Morals—and justify the omission.

  After presenting the plan, provide a brief structured summary in JSON format with the following fields: 'prerequisite_distinction', 'carrying_example_evaluation', 'misconception_sequence' (an array of objects with keys 'misconception' and 'interception_point'), 'understanding_check', 'excluded_material', and 'dependency_rationale'.
