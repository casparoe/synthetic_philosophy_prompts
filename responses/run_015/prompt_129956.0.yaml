answer: |-
  # Decision Tree: Personal Survival in Technological Replacement

  ### **Node 1: Gradual In-Vivo Replacement**
  **Question:** If your biological neurons are replaced one-by-one with functionally identical synthetic units over ten years, leaving your behavior and memory intact, are you the same person at the end?
  *   **No:** Go to **Leaf A**.
  *   **Yes:** Go to **Node 2**.

  ### **Node 2: Destructive Scanning-and-Reconstruction**
  **Question:** If your brain is scanned, destroyed, and a perfect replica is activated elsewhere from the data, does *you* survive (rather than a copy being created)?
  *   **No:** Go to **Leaf B**.
  *   **Yes:** Go to **Node 3**.

  ### **Node 3: Non-Destructive Scanning (Branching)**
  **Question:** If the scan is non-destructive, resulting in both an original you and a replica, can you rationally anticipate experiencing the future from *both* perspectives?
  *   **Yes:** Go to **Leaf C**.
  *   **No:** Go to **Node 4**.

  ### **Node 4: Interrupted Upload**
  **Question:** If your uploaded mind is paused for 100 years and resumed on new hardware, is the answer to "is it you?" settled by objective metaphysics or by social convention?
  *   **Objective Metaphysics:** Go to **Leaf D**.
  *   **Social Convention:** Go to **Leaf E**.

  ---

  ## **Leaves**

  ### **Leaf A: The Embodied-Enactivist View**
  *   **Path:** Node 1 (No).
  *   **Standard Name:** **Embodied Cognition View** (or Enactivist View).
  *   **Most Awkward Commitment:** **The Biological Essentialist Trap.** It implies that replacing a single neuron with a functionally identical synthetic unit could, in principle, begin the process of killing you, or that a fully synthetic brain capable of passing any behavioral test is nonetheless a "zombie" or distinct entity. It struggles to explain why biological causality is privileged over functional isomorphism without appealing to vitalism.

  ### **Leaf B: The Spatiotemporal-Causal-Continuity View**
  *   **Path:** Node 1 (Yes) → Node 2 (No).
  *   **Standard Name:** **Spatiotemporal Continuity View** (or Biological Naturalism).
  *   **Most Awkward Commitment:** **The Teleportation Intuition Pump.** It requires asserting that a person who steps into a teleporter and emerges instantly on Mars is dead, even if the Mars-entity has all their memories and loves their family. It privileges the continuous trajectory of matter over the continuity of psychological life, which many find counterintuitive in a medical/technological context.

  ### **Leaf C: The Branching-Tolerant Functionalist View**
  *   **Path:** Node 1 (Yes) → Node 2 (Yes) → Node 3 (Yes).
  *   **Standard Name:** **Reductionist View** (Parfitian).
  *   **Most Awkward Commitment:** **The Death of Identity.** It requires accepting that in branching cases, strict *identity* does not hold (you are not numerically identical to either future person), yet *survival* does. This forces a revision of logic (denying transitivity of identity) or a claim that "identity is not what matters," which is linguistically and legally difficult to operationalize.

  ### **Leaf D: The Pattern-Identity Functionalist View**
  *   **Path:** Node 1 (Yes) → Node 2 (Yes) → Node 3 (No) → Node 4 (Objective Metaphysics).
  *   **Standard Name:** **Psychological Continuity View (Non-Branching Clause)**.
  *   **Most Awkward Commitment:** **The Extrinsic Determination of Survival.** Your survival depends on what happens *elsewhere*. If the scanning process is destructive, you survive; if it is non-destructive (leaving an original), the copy is not you. This means whether *you* survive a procedure can depend on whether a rival claimant exists, which seems metaphysically arbitrary.

  ### **Leaf E: The Deflationary Graded-Survival View**
  *   **Path:** Node 1 (Yes) → Node 2 (Yes) → Node 3 (No) → Node 4 (Social Convention).
  *   **Standard Name:** **Deflationary Conventionalism** (or Pragmatic View).
  *   **Most Awkward Commitment:** **The Lack of Objective Truth.** It implies there is no fact of the matter about whether a person survived a procedure, only a decision we make for legal or moral convenience. This creates awkward scenarios where a person might be "metaphysically indeterminate" but "legally dead," complicating moral responsibility and rights.

  ---

  ## **Structural Analysis**

  ### **Inseparable Leaves**
  *   **None.** The tree successfully separates all five target positions.
      *   *Note:* **Leaf D** and **Leaf E** are the most difficult to separate empirically, as a Deflationist (E) might pragmatically answer "Objective Metaphysics" to avoid social friction. However, theoretically, they are distinct on the *status* of the truth claim (Fact vs. Convention).

  ### **Diagnosis of Empty Combinations**

  1.  **Combination:** Node 1 (No) + Node 2 (Yes).
      *   **Diagnosis:** **Incoherent.**
      *   **Reasoning:** Rejecting gradual replacement implies that the specific biological substrate is essential to identity (Embodied View). Accepting destructive upload implies that the informational pattern is sufficient for identity despite substrate destruction (Pattern View). One cannot consistently hold that the substrate is essential enough to block gradual replacement but irrelevant enough to allow destructive reconstruction.

  2.  **Combination:** Node 1 (Yes) + Node 2 (No) + Node 3 (Yes).
      *   **Diagnosis:** **Theoretically Unstable.**
      *   **Reasoning:** This combination accepts functional continuity over time (Gradual) and accepts branching survival (Branching), but rejects survival when the original is destroyed (Destructive). This suggests a "Closest Continuer" theory that oddly privileges the existence of the original body over the psychological connection in the destructive case, while allowing two psychological continuers in the branching case. It is difficult to justify why destruction kills you but branching (which also creates a discontinuity of uniqueness) does not, without arbitrary stipulation.

  3.  **Combination:** Node 1 (Yes) + Node 2 (Yes) + Node 3 (No) + Node 4 (Objective Metaphysics: "No, it is not you").
      *   **Diagnosis:** **Unexplored / Nihilist.**
      *   **Reasoning:** This path accepts functional replacement and destructive upload but denies survival in long interruption despite accepting the pattern view. This implies a "Temporal Threshold" view where continuity degrades over time. While logically possible, it is rarely defended as a primary position in this specific cluster, as most Pattern Theorists (Leaf D) argue that pattern preservation is time-invariant.
