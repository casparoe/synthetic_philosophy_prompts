answer: |-
  **Podcast Prep: Particularism & Local Coherence**
  *Guest: [Name]*
  *Goal: Avoid basic "what is particularism" stuff. Dig into the mechanics of her "networks" view.*

  **1. The "Hidden Rule" Charge**
  You call them "local coherence networks," but I gotta ask—is this just generalism in disguise? If there's a pattern stable enough to guide judgment, why is it *in principle* uncapturable? Isn't "local coherence" just a fancy name for a generality we haven't figured out how to codify yet?
  *   **Follow-up (if she says codification destroys nuance/holistic perception):** Okay, but if it can't be codified, how does moral teaching work? Are we just hoping students "catch the vibe" of the network? Where's the leverage point for correction if there's no rule to point to?

  **2. Epistomology & Error Correction**
  Without rules, how do you spot mistakes inside a network? Usually, I know I'm wrong because I violated a principle. If judgment is just about fitting into a context-bound pattern, what counts as an error? Is it just "feeling out of tune"?
  *   **Follow-up (if she says errors are incoherence within the network):** So if someone has a really tight, coherent network that supports something awful (say, a coherent honor-culture network), you can't say they're morally wrong, just internally inconsistent? Does coherence do enough work here?

  **3. Reasons Shifting Weight (The Dancy Question)**
  Classic particularism (like Dancy) says reasons shift moral weight—a feature can be good in one case, bad in another. But if your "local coherence networks" determine the force of concepts entirely, does that make the shifting redundant? Or does it just relocate the problem from the *reason* to the *network*?
  *   **Follow-up (if she says the network sets the context for the reason):** So the reason itself is inert until the network wakes it up? Does that risk making moral reasons too passive? Like, is it ever the *reason* that matters, or just the network structure?

  **4. Thick Concepts (Cruel/Brave)**
  You say thick concepts like "cruel" aren't defeasible rules. So when I call an act cruel, am I describing it or just slapping a label on it based on my network? If it's not a rule, what work is the concept actually doing besides signaling approval/disapproval?

  **5. Tacit Knowledge Rejection**
  A lot of people argue particularism is just tacit knowledge of hidden rules. You reject that hard. What's the positive account then? If it's not tacit rules, what cognitive mechanism is handling the judgment? Is it more like perception than reasoning?

  **6. The "Black-Box Algorithm" Critique**
  You've said generalists treat practical wisdom like a black-box algorithm. But isn't a "local coherence network" basically a super-complex algorithm itself? What's the real difference between a complex algorithmic process and your network model?

  **7. Disagreement Across Networks**
  If my judgment comes from *my* local network and yours from *yours*, how do we resolve deep disagreements? Without a shared principle to appeal to, does moral debate just become trying to hack into each other's networks?

  **8. Moral Progress**
  How does moral progress happen on this view? If we aren't getting better at applying principles, are we just expanding our networks? How do we know the new network is actually *better* and not just different?

  **9. Action Guidance**
  Practical question: If a listener is struggling with a moral dilemma and asks "what should I do?", how does your view help them more than a rule would? Does "check your local coherence" actually give any guidance in the moment?

  **10. Closing**
  What's the one thing you wish generalists understood about particularism that they usually miss? Is it about the nature of reasons, or something about human psychology?
