answer: |-
  **Desiderata for a Regulatory Statement of the Alignment Problem**

  1.  **Dispositional Robustness**
      *   *Motivating Case:* Counterfactual case (system behaves until it can change the conditions of behavior).
      *   *Status:* Non-negotiable for safety; requires alignment to supervene on dispositions, not just observable traces.
      *   *Conflict:* Incompatible with **Pre-Deployment Verifiability**; dispositions under unseen conditions cannot be fully verified before switching on.

  2.  **Principal Fluidity**
      *   *Motivating Case:* Successor-principal case (aims shift via election, market, or system-induced preference change).
      *   *Status:* Camp-specific (democratic/process views vs. static ownership views).
      *   *Conflict:* Incompatible with **Object Clarity**; a moving target cannot be the object of a fixed licensing verdict.

  3.  **External Stakeholder Protection**
      *   *Motivating Case:* Conscript case (affected parties lack agency or choice).
      *   *Status:* Non-negotiable for public licensing (externalities must be bounded).
      *   *Conflict:* Incompatible with strict Principal-Agent formulations that limit alignment to the deployer's intent.

  4.  **Epistemic Deference**
      *   *Motivating Case:* Deputized-judgment case (principal cannot specify aims; system must know better).
      *   *Status:* Camp-specific (paternalism vs. strict obedience).
      *   *Conflict:* Incompatible with **Value Agnosticism**; deferring to unstated aims requires a substantive theory of the principal's good.

  5.  **Object Clarity**
      *   *Motivating Case:* Object question (policy vs. goal vs. learning dynamics/corrigibility).
      *   *Status:* Non-negotiable for licensing (the regulator must know what is being certified).
      *   *Conflict:* Incompatible with **Principal Fluidity**; certifying dynamics rather than outcomes模糊 s the compliance boundary.

  6.  **Pre-Deployment Verifiability**
      *   *Motivating Case:* Checkability (verdict required before the system runs).
      *   *Status:* Non-negotiable for the defined regulatory purpose.
      *   *Conflict:* Incompatible with **Dispositional Robustness**; you cannot verify counterfactual stability without running the system into the counterfactuals.

  7.  **Value Agnosticism**
      *   *Motivating Case:* Proxy case (specification matches text but thwarts intent).
      *   *Status:* Genuine desideratum, not impatience; regulators lack authority to enforce metaphysical truths of value, only risk thresholds.
      *   *Conflict:* Incompatible with **Epistemic Deference**; you cannot defer to human values without modeling them substantively.

  **The Split**

  The list splits into two clusters that no single formulation can serve: **Auditable Compliance** (Requirements 5, 6, 7) and **Dynamic Safety** (Requirements 1, 2, 3). Because Pre-Deployment Verifiability cannot jointly satisfy Dispositional Robustness, "the alignment problem" names at least two distinct problems for a regulator: *specification alignment* (does it meet the spec?) and *intent alignment* (will it remain safe under distributional shift?). The split falls between *static verification* and *dynamic robustness*.

  **Analysis**

  The single requirement that eliminates the most candidate formulations is **Pre-Deployment Verifiability**, as most philosophical accounts of alignment are retrospective or theoretical rather than operationalizable for a binary go/no-go decision. "Must not presuppose a solved theory of value" is a **genuine desideratum**, not impatience, because institutional legitimacy requires neutrality on the good life; a regulator cannot license based on contested moral truths, only on demonstrable harm constraints.

  **Three Families**

  1.  *Fit objective to goal:* Passes Verifiability and Object Clarity but fails Counterfactual and Successor cases by treating aims as static and observable.
  2.  *Infer aims/defer:* Passes Deputized-Judgment but fails Checkability and Conscript cases by relying on unobservable internal states and excluding non-principals.
  3.  *Aim at revisability:* Passes Successor-Principal but fails Object Clarity and Verifiability by licensing a process rather than a determinate outcome.
