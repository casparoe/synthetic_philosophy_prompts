prompt: |-
  I came to philosophy late, after a career in experimental physics, and the literature on statues and street names strikes me as arguing the way my field did before anyone wrote down what a model had to do: each camp reasons from its own favourite case. Before I read further I want the specification. Please set out the desiderata an adequate theory of commemoration must meet, where commemoration covers the whole graded business of statues, plaques, street and building names, named fellowships, holidays and stamps, giving the case or consideration behind each requirement and marking which are non-negotiable and which are only the preferences of one side.

  Fix the purpose as follows: the theory is for guiding a city council that has to vote on one particular monument, and for telling a university what to do with a donor's name. The cases I would hold any list of requirements answerable to are these: the faded referent, where almost no one who uses a street name can attach it to a person, so that it is unclear whether anything is being commemorated; the posthumous discovery, where the disqualifying deed comes to light long after erection; the displaced erectors, where the monument was raised by a community that no longer lives in the city and is contested by the one that does; the deep past, where we preserve antiquities erected by slaveholders and conquerors as artefacts rather than honours, and the line between the two has to be drawn somewhere; the scoped monument, which names one deed while another deed of the same person is disqualifying; the menu of alternatives, since I want to know whether relocation to a museum, an added plaque, a counter-monument beside the original, and a sunset clause are genuinely distinct options or merely removal under another description; the exchange rate between denominations, since a bronze figure in a square and a name on a modest fellowship do not feel like the same moral act; the commemorative bargain, where the object was erected as part of a settlement between groups; and the dead hand, where the political community that erected it is not the one now living under it.

  Two further things matter more to me than coverage. First, which of the requirements people actually invoke are genuine desiderata and which are a camp's prejudice dressed as one. Second, whether any pair of the desiderata you defend is jointly unsatisfiable, and which single requirement does the most work in excluding the popular positions; if the list itself turns out to be the interesting result, say so plainly. In my old subject we asked of any proposed criterion whether it was discriminating at all, whether one could construct a case separating a theory that meets it from one that does not, so please discard or restate any requirement that every view satisfies trivially or none could. A sentence or two on how the main families of view score against the list is enough; the criteria are what I am paying for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Latecomer to philosophy, background in experimental physics. Values precision, specifications, desiderata, and discriminating criteria. Dislikes vague reasoning from favorite cases.
      *   **Task:** Set out the *desiderata* (requirements) for an adequate theory of commemoration.
      *   **Scope:** Statues, plaques, street/building names, fellowships, holidays, stamps (graded business).
      *   **Purpose:** Guiding a city council (voting on a monument) and a university (donor names).
      *   **Test Cases:** Faded referent, posthumous discovery, displaced erectors, deep past (artifact vs. honor), scoped monument, menu of alternatives (relocation, plaque, counter-monument, sunset), exchange rate (bronze vs. fellowship), commemorative bargain, dead hand (past political community).
      *   **Key Constraints:**
          *   Distinguish non-negotiable vs. preference.
          *   Identify genuine desiderata vs. prejudice.
          *   Identify jointly unsatisfiable pairs (trade-offs).
          *   Identify the single requirement doing the most work (excluding popular positions).
          *   Discard trivial criteria (must be discriminating).
          *   Brief scoring of main families of view.
      *   **Tone:** Rigorous, analytical, structured (like a physics specification), avoiding fluff.

  2.  **Deconstruct the Problem (Philosophy of Commemoration):**
      *   The user wants a "specification" similar to a scientific model. This means defining variables, boundary conditions, and success criteria.
      *   The core tension in commemoration literature is usually between *historical accuracy/truth*, *moral exemplarity*, *civic identity*, and *aesthetic/functional utility*.
      *   I need to formulate criteria that aren't just "be good" but are operationalizable for a council/university.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Attempt 1:* Must be truthful. Must be moral. Must be democratic.
      *   *Critique 1:* Too vague. "Truthful" doesn't handle the "faded referent." "Moral" doesn't handle the "deep past." "Democratic" doesn't handle the "dead hand."
      *   *Attempt 2 (More specific):*
          1.  **Intelligibility:** People must know what is being commemorated. (Addresses faded referent).
          2.  **Moral Alignment:** The honoree must match current values. (Addresses posthumous discovery).
          3.  **Procedural Legitimacy:** The current community must agree. (Addresses displaced erectors/dead hand).
          4.  **Proportionality:** The form must match the honor. (Addresses exchange rate).
          5.  **Contextual Integrity:** Can we change the context without destroying the object? (Addresses deep past/menu of alternatives).

      *   *Refining for Discrimination:* The user wants to know which criteria *exclude* views.
      *   *Criterion 1: The Truth-Function.* Does the monument assert a claim that can be false? (Distinguishes honorific from archival).
      *   *Criterion 2: The Agency-Constraint.* Who gets to decide? Past vs. Present. (Distinguishes preservationists from revisionists).
      *   *Criterion 3: The Scalar-Match.* Does the medium match the moral weight? (Distinguishes statue removalists from plaque-adders).
      *   *Criterion 4: The Continuity-Condition.* Does the current polity inherit the commitments of the past? (Distinguishes contractualists from presentists).

  4.  **Selecting and Polishing the Desiderata:**
      *   I need to make sure these map to the user's specific test cases.
      *   *Desideratum 1: Semantic Transparency.* (Faded referent). If no one knows who it is, is it still a monument?
      *   *Desideratum 2: Moral Coherence.* (Posthumous discovery, Scoped monument). Can you honor part of a life?
      *   *Desideratum 3: Political Authorization.* (Displaced erectors, Dead hand). Who owns the public square?
      *   *Desideratum 4: Functional Differentiation.* (Deep past, Menu of alternatives). Is it art, history, or honor?
      *   *Desideratum 5: Proportionality.* (Exchange rate). Statue vs. Fellowship.

  5.  **Addressing the "Physics-Style" Constraints:**
      *   *Non-negotiable vs. Preference:* This is tricky because philosophy rarely has absolute non-negotiables. However, for a *specification*, I must define what makes the theory *adequate*.
      *   *Joint Unsatisfiability:* This is the crux. You often can't satisfy "Historical Preservation" and "Moral Purity" simultaneously. I need to highlight this tension explicitly.
      *   *The "Workhorse" Criterion:* Which one kills the most zombie theories? Likely *Political Authorization* (Who decides?) or *Functional Differentiation* (What is this object for?). Let's go with *Functional Differentiation* because it dictates the "Menu of Alternatives."

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the physics analogy. Define the scope.
      *   **The Specification (Desiderata):** List them clearly. Mark Non-Negotiable (NN) vs. Contingent (C). Explain the "Case/Consideration" for each.
      *   **Discrimination Analysis:** Which criteria are trivial? (Discard "Do no harm").
      *   **Incompatibilities:** Show the trade-offs.
      *   **The Workhorse:** Identify the key filter.
      *   **Scorecard:** Briefly map main views (Preservationist, Purist, Contextualist) against the spec.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* The user asked to mark which are preferences of one side. I need to be careful not to present my own philosophical bias as fact, but rather as part of the specification for a *functional* theory.
      *   *Correction:* Ensure the "Exchange Rate" case is covered. This implies a metric of "Commulative Intensity."
      *   *Correction:* Ensure the "Deep Past" case is covered. This implies a "Time-Decay Function" on moral accountability.
      *   *Refining the "Non-Negotiable":* In a normative theory, nothing is truly non-negotiable except logical consistency. But for a *policy* theory, "Action-Guidance" is non-negotiable. If the theory can't tell the council what to do, it fails.
      *   *Refining the "Joint Unsatisfiability":* The tension between *Historical Fidelity* (keep it as is) and *Civic Endorsement* (only honor the good) is the classic contradiction.

  8.  **Final Polish:** Check tone. Ensure it sounds like a technical specification document, not an essay. Use bolding for clarity. Ensure all test cases from the prompt are addressed within the rationale for the desiderata.

      *(Self-Correction on "Non-Negotiable"):* I should classify them based on whether a theory *must* have them to be a theory of *commemoration* (constitutive) vs. theories of *justice* applied to commemoration (normative).
      *   Actually, better to frame it as: "Constitutive Requirements" (must be met to be a theory of this phenomenon) vs. "Normative Commitments" (where the political fighting happens).

      *(Re-evaluating the "Workhorse"):* The prompt asks which requirement excludes popular positions. The requirement that "Commemoration implies endorsement" excludes the Preservationist view. The requirement that "Commemoration is distinct from History" excludes the Museum-ification view. I will argue that **Functional Differentiation** is the workhorse.

      *(Re-evaluating "Trivial Criteria"):* "The theory must be consistent" is trivial. "The theory must respect the dead" is too vague. I will focus on operational criteria.

  9.  **Final Review against Prompt:**
      *   Specification set out? Yes.
      *   Graded business covered? Yes (via Proportionality).
      *   Case/Consideration for each? Yes.
      *   NN vs Preference marked? Yes.
      *   Test cases addressed (faded, posthumous, etc.)? Yes, woven into rationales.
      *   Genuine vs Prejudice identified? Yes.
      *   Jointly unsatisfiable pairs? Yes.
      *   Single requirement doing most work? Yes.
      *   Trivial criteria discarded? Yes.
      *   Scorecard of main views? Yes.

      *Let's write.*
answer: |-
  Here is the specification for an adequate theory of commemoration, structured as a technical requirement document. It is designed to be operational for a city council or university board.

  ### I. Constitutive Desiderata (Non-Negotiable)
  *These requirements define the phenomenon. A theory that fails these does not explain commemoration; it explains something else (e.g., pure history, pure art, or pure property law).*

  **1. The Endorsement Constraint**
  *   **Specification:** The theory must distinguish between *recording* a fact and *valuing* a subject. Commemoration entails a positive normative stance by the erecting body toward the honoree.
  *   **Case Addressed:** *The Deep Past / The Faded Referent.* If a statue is merely an artifact (history), it belongs in a museum. If it is in a public square, it functions as endorsement. If the referent is faded, the endorsement is null, and the object becomes mere clutter or art.
  *   **Discrimination:** Excludes "Preservationist" views that treat public monuments as neutral historical records. A theory cannot claim a statue is "just history" while keeping it in a place of honor.

  **2. The Agency Continuity Condition**
  *   **Specification:** The theory must specify the mechanism by which the *current* political community inherits (or rejects) the commitments of the *past* community. It must define the "succession rule" for civic identity.
  *   **Case Addressed:** *The Dead Hand / The Displaced Erectors.* If the current city is the legal successor to the old one, it inherits the debt. If it is a new polity (e.g., post-regime change), it does not.
  *   **Discrimination:** Excludes theories that treat the past as binding without consent (absolute contractualism) and theories that treat the past as irrelevant (radical presentism).

  **3. The Scalar Proportionality Rule**
  *   **Specification:** The theory must provide a metric linking the *intensity* of the honor to the *visibility/permanence* of the medium.
  *   **Case Addressed:** *The Exchange Rate.* A bronze statue implies a higher degree of civic veneration than a named fellowship or a plaque. The theory must explain why removing a name from a building is morally distinct from melting a statue.
  *   **Discrimination:** Excludes binary theories (Keep/Remove) that cannot distinguish between a named lecture hall and a statue in the main square.

  ### II. Normative Desiderata (Contingent / Contested)
  *These are the variables where political camps diverge. A complete theory must take a stance here, but the stance itself is a policy choice, not a logical necessity.*

  **4. The Moral Purity Threshold (Preference: The Purist Camp)**
  *   **Specification:** Determines if a single disqualifying deed negates all qualifying deeds.
  *   **Case Addressed:** *The Posthumous Discovery / The Scoped Monument.* Does the discovery of a crime void the honor for the achievement?
  *   **Status:** **Contingent.** A theory can reject this (allowing "flawed hero" models) or accept it (requiring moral spotlessness).
  *   **Prejudice Check:** Often invoked as a non-negotiable moral truth, but functionally it is a policy setting on how much moral risk a city is willing to tolerate in its icons.

  **5. The Contextual Remediation Option (Preference: The Contextualist Camp)**
  *   **Specification:** Determines if adding information (plaques, counter-monuments) alters the normative status of the original object.
  *   **Case Addressed:** *The Menu of Alternatives.* Is a plaque a distinct solution or merely "removal with extra steps"?
  *   **Status:** **Contingent.** Requires a theory of "semantic framing." Does context override the object, or does the object override the context?
  *   **Prejudice Check:** Preservationists treat this as non-negotiable (context solves everything); Removalists treat it as trivial (a plaque doesn't un-honor). An adequate theory must model the *efficacy* of the plaque, not just its existence.

  **6. The Bargain Stability Clause (Preference: The Contractualist Camp)**
  *   **Specification:** Determines if the monument constitutes a binding agreement between groups that cannot be unilaterally altered.
  *   **Case Addressed:** *The Commemorative Bargain.* (e.g., a monument erected as part of a peace treaty or desegregation settlement).
  *   **Status:** **Contingent.** Depends on whether the theory views the monument as property or as speech.
  *   **Prejudice Check:** Often used to block removal by claiming "breach of contract," even when no legal contract exists.

  ### III. Incompatibility Analysis (Trade-Offs)

  No theory can satisfy all desiderata simultaneously. The following pairs are jointly unsatisfiable in hard cases:

  1.  **Endorsement Constraint vs. Bargain Stability:** You cannot maintain that a statue is an active endorsement by the *current* city (Desideratum 1) while simultaneously claiming the city is bound by the *past* city's deal to keep it forever (Desideratum 6). If the current city endorses it, it must be able to withdraw endorsement. If it is bound by the past, it is not endorsing it, it is obeying a rule.
  2.  **Moral Purity vs. Agency Continuity:** If the current community inherits the identity of the past (Desideratum 2), it inherits the past's moral blind spots. If it demands Moral Purity (Desideratum 4), it must sever continuity with the past, undermining the claim that the monument represents the city's *history*.

  ### IV. The Workhorse Criterion

  **The Endorsement Constraint (Desideratum 1)** does the most work.

  *   **Why:** It forces the "Menu of Alternatives" to collapse into distinct categories. If a statue *is* endorsement, then a plaque (which adds nuance) does not solve the problem of unwanted endorsement; it merely annotates it. This criterion excludes the most popular "compromise" position (keep the statue, add a plaque) because it reveals that position as logically unstable: you cannot simultaneously endorse a hero (statue) and condemn their actions (plaque) in the same civic voice without cognitive dissonance.
  *   **Exclusion Power:** It eliminates the "History Argument" (we keep it to remember history) for public squares. It forces the choice: is this a museum piece (no endorsement) or a civic icon (endorsement)?

  ### V. Trivial Criteria (Discarded)

  *   **"Respect for the Dead":** Discarded. The dead have no interests that can be harmed by removal. This criterion satisfies no one and constrains nothing.
  *   **"Public Safety":** Discarded. While practical, it is not a *theory of commemoration*. It is a theory of riot prevention.
  *   **"Educational Value":** Discarded. Trivially satisfiable. Anything can be educational with a tour guide. It does not help decide whether the object should *stand*.

  ### VI. Scorecard of Main Families of View

  | View | Endorsement Constraint | Agency Continuity | Scalar Proportionality | Failure Mode |
  | :--- | :--- | :--- | :--- | :--- |
  | **Preservationist** ("Keep it all") | **Fails.** Treats endorsement as historical record. | **Pass.** Assumes infinite inheritance. | **Fails.** Treats statue and plaque as equivalent. | Cannot explain why we don't build new statues of villains for balance. |
  | **Purist** ("Remove the bad") | **Pass.** Clear on endorsement. | **Fails.** Severs ties with past too sharply. | **Pass.** Recognizes removal as distinct act. | Erases history; creates "sanitized" civic identity. |
  | **Contextualist** ("Add a plaque") | **Fails.** Assumes context negates form. | **Pass.** Maintains continuity. | **Fails.** Ignores exchange rate (statue > plaque). | Logically unstable in cases of severe moral violation. |
  | **Proceduralist** ("Vote on it") | **Pass.** Endorsement is whatever the vote says. | **Pass.** Current agency decides. | **Pass.** Can vote on specific forms. | **Wins.** This is the only view that meets the specification for a *Council*, as it offloads the moral metaphysics to democratic procedure. |

  ### VII. Conclusion for the Council/University

  To meet this specification, your policy must not ask "Is this person good?" (Moral Purity is contingent). It must ask: **"Does keeping this object in this specific location constitute an active endorsement by us, today?"**

  If the answer is yes, and you do not endorse them, the object must move to a category where endorsement is null (museum/storage). If the answer is no (it is treated as art/history), you must alter the setting to ensure the public understands it is not an honor. You cannot do both. The "plaque compromise" is a specification error.
