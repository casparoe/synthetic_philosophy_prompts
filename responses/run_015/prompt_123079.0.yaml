prompt: |-
  I'm a junior double-majoring in art history and philosophy, and I'm the undergraduate member of our university's Public Art and Legacy Committee. I'm also taking a seminar this semester on aesthetics and the ethics of art -- we spent a couple of weeks on whether a work's moral defects, or its maker's, can count against it *as art* -- and it's made me uncomfortably aware of how much our committee improvises. I've been asked to draft the decision memo for our November meeting, and I'd like your help with it, because I keep going in circles.

  The case: in 1961 a local painter named Alden Rees, who taught in our studio art department for nearly thirty years and is something of a civic icon here, painted an eleven-panel mural directly onto the curved plaster wall of the east corridor of the student union -- a harvest scene from life, with about forty identifiable faces of members of a nearby farming cooperative, including several of Rees's own neighbors. It's the best thing in our collection and arguably the most important surviving example of that regional mural style in the state. Last year, when a state archive opened its surveillance files, it emerged that Rees had been a paid informant from 1959 to 1965, and that at least two of the men whose faces are on that wall served prison terms in the late sixties on cases built partly on his reports. So the entanglement here is worse than the usual one: the qualities people cite when they call the mural great -- the closeness of observation, the fact that these are not generic types but people he knew and was trusted by, the tenderness of the faces -- are the very same qualities that made the betrayal possible, and once you know the archival material you can't see the tenderness without also seeing a kind of theft. Meanwhile the descendant families are split: one granddaughter has petitioned for the wall to be destroyed, and the grandson of another of the informant's targets has asked in writing that it stay, because it's the only image of his grandfather that exists and he thinks his grandfather would have wanted to be seen. Three further complications the memo has to live inside: the work is painted on curved plaster and cannot be moved without destroying most of its surface, so "relocate it" is not a real option -- the live options are leave it as is, leave it with new interpretive text, cover it with a retractable scrim, or destroy or paint it out; an anonymous donor has offered a large gift toward what the letter calls "restoring the corridor to bare brick," but the offer lapses at the end of the semester and is explicitly contingent on a vote to remove; and Rees's niece, who controls the estate, has said she will sue if the work is altered or destroyed, in a suit we'd probably win but which would tie the corridor up in litigation for years.

  What I need is a memo I could actually put my name on and circulate: a proper header block, a one-sentence bottom line, a recommendation of one of the four options with a concrete sequence and timeframe (what the facilities office does before finals, what happens over the summer, when the decision gets revisited and by whom), and the reasoning behind it. Two things matter to me beyond the bottom line. First, I want the memo to take seriously both of the arguments I keep oscillating between -- that here, unusually, the moral defect is internal to the aesthetic achievement rather than merely adjacent to it, and that the faces arguably now belong to the people depicted and their families, so that erasing the work would injure them a second time -- and then to give the option it *doesn't* recommend the strongest version of itself, the version a colleague who favors it would read and say "yes, that's my argument." Second, our student government has formally asked us to produce a scoring rubric weighting "artistic significance" against "harm to campus climate" so that future cases can be settled uniformly; I want the memo to tell them, with reasons, whether we should hand over such a rubric or decline, and if we decline, what we should give them instead. Please close with three or four sentences of standing guidance for the three other works in our collection with comparable problems, one of which was donated by a living alumna whose name is on the building. Keep it in the register of a committee document rather than a term paper -- name the philosophical issue only where doing so helps someone act -- and don't hedge into "the committee may wish to consider"; I need a recommendation I'll have to defend out loud.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **User Persona:** Junior double-major (Art History & Philosophy), Undergraduate Member of Public Art and Legacy Committee.
      *   **Task:** Draft a decision memo for the November committee meeting regarding a specific controversial artwork.
      *   **The Artwork:** 1961 mural by Alden Rees (local icon, former professor). 11 panels, curved plaster, harvest scene, 40 identifiable faces (neighbors/farmers).
      *   **The Controversy:** Rees was a paid informant (1959-1965). Two men depicted were imprisoned partly due to his reports. The "tenderness" of the art is linked to the betrayal (moral defect internal to aesthetic achievement).
      *   **Stakeholders:**
          *   Granddaughter of Rees: Wants destruction.
          *   Grandson of a target: Wants preservation (only image of grandfather).
          *   Anonymous Donor: Offers money for removal ("bare brick"), offer lapses end of semester.
          *   Rees's Niece (Estate): Threatens lawsuit if altered/destroyed (likely winnable but ties up corridor).
          *   Student Government: Wants a scoring rubric for future cases.
      *   **Constraints/Options:**
          *   Cannot move (curved plaster).
          *   Live Options: Leave as is, Leave with text, Cover with scrim, Destroy/Paint out.
          *   Tone: Committee document, not term paper. No hedging ("may wish to consider"). Needs a defendable recommendation.
          *   Specific Requirements:
              *   Proper header block.
              *   One-sentence bottom line.
              *   Recommendation with concrete sequence/timeframe.
              *   Reasoning addressing the two oscillating arguments (internal moral defect vs. ownership of faces/second injury).
              *   Steelman the rejected option.
              *   Address the Student Government rubric request (Yes/No + alternative).
              *   Closing guidance for 3 other comparable works (one with living alumna donor).
      *   **Philosophical Context:** User is studying aesthetics/ethics (moral defect vs. artistic merit). Needs to use this insight without making it sound like a philosophy essay.

  2.  **Determine the Recommendation:**

      *   *Option A: Destroy.* Pros: Removes the "betrayal." Cons: Erases the only image of the victims, validates the granddaughter's wish over the grandson's, loses a significant artwork, triggers lawsuit.
      *   *Option B: Leave as is.* Pros: Respects the grandson, preserves art. Cons: Ignores the harm/betrayal, feels like silence/complicity.
      *   *Option C: Cover with scrim.* Pros: Hides it temporarily. Cons: Doesn't solve the ethical tension, feels like censorship without context.
      *   *Option D: Leave with new interpretive text (Contextualization).* Pros: Acknowledges the betrayal (addressing the moral defect), preserves the image for the grandson (avoiding second injury), avoids lawsuit, keeps the art visible for critique.
      *   *Decision:* **Leave with new interpretive text.** This is the most nuanced position that fits the user's philosophical training (engaging with the tension rather than resolving it by elimination) and the practical constraints (lawsuit, family split).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Bottom Line:** Needs to be punchy and decisive. *Recommendation: Retain the mural with mandatory contextualization.*
      *   **Background:** Briefly state the facts (Rees, mural, informant revelation, family split, donor, estate).
      *   **Analysis/Reasoning:**
          *   *The Ethical/Aesthetic Tension:* Acknowledge the user's seminar insight. The "tenderness" is the "theft." We can't pretend it's just a pretty picture.
          *   *The Stakeholders:* Balance the granddaughter (Rees's legacy) vs. the grandson (Victim's legacy). Erasure hurts the victim's family more (second injury).
          *   *The Practical:* Lawsuit risk vs. Donor deadline.
          *   *Steelmanning the Rejection:* Why *not* destroy? (The argument for removal needs to be strong: that the space is poisoned, that keeping it normalizes surveillance).
      *   **Implementation Plan:** Concrete steps. Facilities, Text drafting, Timeline (before finals, summer, review).
      *   **Student Government Rubric:** This is tricky. A rubric implies math can solve ethics. Given the user's philosophy background, they should argue *against* a rigid rubric. Ethics requires case-by-case judgment. Offer "Guiding Principles" instead.
      *   **Standing Guidance:** For the other 3 works. Keep it brief but actionable.
      *   **Tone Check:** Professional, decisive, empathetic but firm. No "I think" or "The committee might." Use "The Committee recommends."

  4.  **Refining the Content (Self-Correction during drafting):**

      *   *Critique:* Is the philosophical language too heavy?
      *   *Fix:* Keep terms like "moral defect" minimal. Focus on "harm," "memory," and "context."
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* Donor offer lapses end of semester. Decision must be made *now* (November meeting). Installation of text over summer.
      *   *Critique:* Did I address the "internal moral defect" argument?
      *   *Fix:* Explicitly state that the text must explain *how* the trust was weaponized, not just that he was an informant.
      *   *Critique:* Did I address the Student Gov rubric?
      *   *Fix:* Explicitly decline the rubric. Offer a "Case Protocol" instead.
      *   *Critique:* The closing guidance needs to cover the living alumna.
      *   *Fix:* Ensure the guidance mentions donor agreements vs. institutional values.

  5.  **Final Polish:**

      *   Check the voice. It needs to sound like a serious undergraduate who knows their stuff but respects the hierarchy.
      *   Ensure the "Steelman" of the destruction argument is compelling enough that a pro-removal colleague feels heard.
      *   Verify all constraints from the prompt are met (header, one-sentence bottom line, 4 options considered, rubric answer, closing guidance).

  6.  **Final Review against Prompt:**
      *   Header block? Yes.
      *   One-sentence bottom line? Yes.
      *   Recommendation + sequence/timeframe? Yes.
      *   Reasoning (internal defect vs. second injury)? Yes.
      *   Steelman rejected option? Yes.
      *   Student Gov rubric answer? Yes.
      *   Closing guidance (3 works, living alumna)? Yes.
      *   Tone (Committee doc, no hedging)? Yes.

  *(Self-Correction on the "One-Sentence Bottom Line"):* Make sure it's truly one sentence.
  *(Self-Correction on the "Rubric"):* The prompt asks to tell them whether to hand it over or decline. I will recommend declining the rubric in favor of principles.
  *(Self-Correction on "Living Alumna"):* Ensure the guidance distinguishes between historical figures and living donors.

  7.  **Drafting the Memo.** (Proceeding to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Public Art and Legacy Committee
  **FROM:** [Your Name], Undergraduate Member
  **DATE:** November 14, 2023
  **SUBJECT:** Recommendation Regarding the Alden Rees Mural (Student Union East Corridor)

  **BOTTOM LINE**
  The Committee should vote to retain the Rees mural in situ while commissioning and installing permanent interpretive material that explicitly details the artist's role as an informant and the resulting harm to the subjects depicted.

  **BACKGROUND AND STAKEHOLDERS**
  The 1961 Alden Rees mural is a site-specific work of significant regional artistic value, painted directly onto curved plaster. Recent archival disclosures confirm Rees acted as a paid informant (1959–1965), contributing to the imprisonment of at least two men depicted in the work. The Rees estate has threatened litigation if the work is altered or destroyed; an anonymous donor has offered funding for removal contingent on a vote by semester's end; and the families of the depicted subjects are divided, with one descendant requesting destruction and another requesting preservation as the sole surviving image of his grandfather.

  **RECOMMENDATION AND IMPLEMENTATION TIMELINE**
  I recommend we **retain the mural with mandatory contextualization**. This option rejects both silence and erasure. The following sequence must be executed to meet donor deadlines and minimize disruption:

  1.  **November 30 (Pre-Finals):** Committee votes to reject the anonymous donor's removal offer and authorizes the Facilities Office to prepare the wall surface for archival-grade interpretive panels to be mounted adjacent to, not on, the mural.
  2.  **December 15:** Administration notifies the Rees estate of the decision to retain with context, signaling readiness to litigate if necessary, while simultaneously opening a dialogue with the grandson of the imprisoned subject to co-author the interpretive text.
  3.  **Spring Semester:** A subcommittee (including one student representative) drafts the text, focusing on the specific mechanism of betrayal rather than general biography.
  4.  **Summer Break:** Facilities installs the interpretive materials.
  5.  **August 2024:** The Committee revisits the installation to assess campus climate impact before the fall semester begins.

  **REASONING**
  This case presents a rare convergence where the moral defect is not adjacent to the aesthetic achievement but constitutive of it. The mural's artistic power relies on the intimacy and trust Rees cultivated with his neighbors; knowing he was documenting them for the state transforms that tenderness into a form of surveillance. To leave the work without context ("Leave as is") is to ask the viewer to participate in that original deception.

  However, the argument for destruction ("Restore to bare brick") is morally weighty and deserves its strongest articulation. A colleague arguing for removal would rightly contend that keeping the mural normalizes the betrayal, turning the corridor into a shrine to impunity. They would argue that the "artistic significance" is irreparably poisoned, that the space is now hostile to the descendants of the imprisoned men, and that no amount of text can undo the visual violence of displaying a victim alongside their betrayer without their consent. Furthermore, they would note that accepting the donor's gift would fund needed repairs elsewhere, and that the estate's lawsuit is a bluff we should call to establish institutional independence.

  We must reject destruction, however, because erasing the mural inflicts a second injury on the subjects and their families. For the grandson who petitioned to keep it, the mural is not a tribute to Rees, but a memorial to his grandfather. To paint over those faces is to enact the state's erasure of those men all over again. Additionally, the legal entanglement would render the corridor unusable for years. Contextualization allows us to hold the tension: we preserve the image for the families who claim it, while forcing the viewer to confront the ethical rot at the center of the aesthetic experience. We do not hide the theft; we label it.

  **RESPONSE TO STUDENT GOVERNMENT REQUEST**
  The Committee should **decline** the request to produce a weighted scoring rubric for future cases.

  Ethical conflicts regarding public art are not algorithmic problems; they are conflicts of value that resist quantification. A rubric weighting "artistic significance" against "harm to campus climate" implies a false precision that will fail when faced with the specificities of trauma, historical power dynamics, and community memory. Instead, we should provide Student Government with a **Case Protocol**. This protocol would mandate: (1) a stakeholder mapping process to identify affected descendants before any vote; (2) a requirement for historical audit prior to aesthetic evaluation; and (3) a presumption against removal unless the physical safety of the work poses a direct threat. This ensures uniformity of *process* without imposing a false uniformity of *outcome*.

  **STANDING GUIDANCE FOR COMPARABLE WORKS**
  Regarding the three other works in the collection with provenance issues, the Committee adopts the following guidance effective immediately. First, for works by deceased artists with problematic histories, we follow the Rees precedent: retention with aggressive contextualization rather than removal. Second, for the work donated by the living alumna whose name is on the building, we will not preemptively alter the work, but we reserve the right to add interpretive context if future conduct by the donor contradicts university values, as outlined in the new Case Protocol. Third, we will not accept the "relocation" argument for site-specific works unless the new site preserves the original spatial intent; otherwise, relocation is treated as destruction. Finally, all future acquisitions must include a clause allowing for interpretive additions without donor veto.
