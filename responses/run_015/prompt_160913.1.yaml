answer: |-
  **MEMORANDUM**

  **TO:** Faculty Senate
  **FROM:** Governance Review Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendations Regarding the Stability Clause and Amendment Procedures

  **Purpose**

  The Senate is currently gridlocked. A clear majority supports restructuring the committee system, yet a rule adopted last spring—the "Stability Clause"—appears to block this action. That Clause was passed by 21 senators (a majority of those present, but only one-third of the full Senate). It requires a two-thirds vote of the full Senate plus a faculty referendum to amend Article V, and it claims immunity from being changed except by that same difficult process.

  This memo recommends a path forward that respects both the authority of past Senates and the democratic rights of the current one. It addresses the validity of the Stability Clause, the immediate proposal, and future rules for changing our rules.

  **1. Status of the Stability Clause**

  We recommend treating the Stability Clause as partially valid but partially void. Specifically, the new thresholds for amending Article V (two-thirds vote plus referendum) should stand as valid policy, but the Clause's attempt to shield *itself* from the original amendment process is invalid.

  Here is the reasoning. When the Charter was adopted, Article V granted the Senate the power to amend the document by a simple majority. When 21 senators voted to raise that threshold, they exercised that power validly. They changed the lock. However, they also attempted to throw away the key by declaring that this specific change could not be undone by the original majority process.

  A body cannot use a granted power to permanently destroy the source of that power unless the original grant explicitly allows it. The Charter did not authorize the Senate to make permanent, unchangeable rules. Therefore, while the higher threshold for future changes is real, the "lock on the lock" is not. The Stability Clause can be amended using the original Article V procedure (majority of senators present and voting), not the supermajority process it demands.

  (Note: This differs from external legal doctrines where courts void amendments that destroy a constitution's "basic structure"; we are not courts, and we are interpreting our own internal authority, not external law.)

  **2. Implications for the Live Proposal**

  The committee restructuring proposal currently lacks the 41 votes and faculty referendum required by the Stability Clause. However, under the recommendation above, the Senate may first amend the Stability Clause itself using the original Article V rules.

  The sequence should be:
  1.  The Senate votes to affirm that the Stability Clause is subject to the original Article V amendment process.
  2.  Using that original process, the Senate amends the Stability Clause to lower the threshold for the specific restructuring proposal, or repeals the Clause entirely.
  3.  The restructuring proposal is voted on under the restored rules.

  This avoids the "nuclear option" of dissolving the Charter entirely. Dissolving the Charter to adopt a successor document is legally possible but politically dangerous. It suggests our governing document is disposable whenever it becomes inconvenient. Amending the Clause preserves continuity while correcting the procedural overreach.

  **3. A Standing Meta-Rule for Future Amendments**

  To prevent recurrence, we recommend adopting a meta-rule regarding amendments to amendment procedures. Your intuition about asymmetry is correct and should be codified.

  Changing the rules for changing rules should depend on the *direction* of the change:
  *   **Tightening vs. Loosening:** Making amendment harder (tightening) should require a higher threshold than making it easier (loosening). A simple majority should be able to restore democratic access, but a supermajority should be required to restrict it.
  *   **Who vs. How Many:** There is a categorical difference between changing a number (50% to 67%) and changing *who* gets a vote (adding a faculty referendum). Changing "who" adds a new veto player and fundamentally alters the governance structure. This should require a higher threshold than merely adjusting percentages.

  We recommend amending Article V to reflect this. Future amendments that add veto players or raise thresholds above a simple majority should require a two-thirds vote of the full Senate. Amendments that lower thresholds or remove veto players should require only a majority of those present. This ensures that democracy can be restored easily, but restricted only with broad consensus.

  **4. The Case Against This Recommendation**

  We must acknowledge the strongest argument against this approach, voiced by several committee members. Their position is that voiding any part of the Stability Clause undermines the rule of law within the Senate.

  When the Senate voted last spring, the minutes recorded a passed motion. Members voted based on the understanding that the result would be stable. To declare part of that vote void now looks like moving the goalposts because the current majority dislikes the outcome. If the Senate begins invalidating past amendments based on philosophical objections to "self-entrenchment," the Charter becomes a suggestion rather than a binding agreement. Trust erodes if members believe procedural victories will be reversed by later committees citing abstract principles.

  Furthermore, the "dissolve and replace" workaround floated by some colleagues is arguably more honest. If the current Senate believes the Charter is too restrictive, admitting that the document no longer serves us and adopting a new one by majority vote is transparent. It acknowledges a break in continuity rather than pretending to interpret the old rules. By trying to have it both ways—keeping the Charter but ignoring its strictures—we risk appearing manipulative.

  Finally, there is the practical risk of endless recursion. If we establish that a majority can void procedural locks, what stops a future majority from voiding the meta-rule we propose today? Stability requires that some things be hard to change, even if that frustrates current majorities.

  **Conclusion**

  Despite these risks, maintaining the Stability Clause's self-entrenchment creates an unsustainable oligarchy where one-third of the Senate can bind the rest indefinitely. The recommendation above balances stability with democratic authority. It honors the vote to raise thresholds while rejecting the claim that a temporary majority can permanently disarm its successors.

  We request the Senate vote to affirm this interpretation prior to considering the committee restructuring proposal.

  **Action Required:** Vote on Committee Recommendation 23-A regarding Article V Interpretation.
