  **Distinctions:** I prioritize the *locus of error* (upstream/downstream) and *veridicality debt* because these determine the explanatory burden without presupposing ontology. Terminological fights over "qualia" obscure whether the misrepresentation is in the sensing or the thinking.

  **DECISION TREE: THE LOGICAL SPACE OF INTROSPECTION**

  1.  **Dimmer Switch:** Can the "seeming" reach zero while discriminatory function stays fully intact?
      *   **No** → Go to 2.
      *   **Yes** → Go to 3.

  2.  **Open Dashboard:** Engineers show the tagging mechanism. Does the subject claim to have learned a new fact about the old state (Discovery) or to have entered a new state (Change)?
      *   **Discovery** → Go to 9.
      *   **Change** → **LEAF 1: Hard Problem Realism** (Awkward commitment: Must explain why physics cannot capture the property discovered.)

  3.  **Veridicality Debt:** Does the view owe an account of what introspective success would look like, or is the appearance brute?
      *   **Brute/No Debt** → Go to 8.
      *   **Yes/Owes Account** → Go to 4.

  4.  **Upstream/Downstream:** Is the misrepresentation manufactured by the introspective system alone (Downstream), or is first-order perception already non-veridical (Upstream)?
      *   **Upstream** → Go to 5.
      *   **Downstream** → Go to 6.

  5.  **Swapped Introspectors:** Swap mechanisms between subjects. Does what-it's-like track the first-order state or the introspective mechanism?
      *   **Mechanism** → **LEAF 2: Quasi-Phenomenal Illusionism** (Awkward commitment: The illusion itself must have attenuated, quasi-qualitative properties.)
      *   **First-Order State** → **LEAF 3: First-Order Illusionism** (Awkward commitment: Perception itself is a user-illusion with no genuine qualitative target.)

  6.  **Grain Mismatch:** Does introspection represent a determinable character (e.g., "smooth") that no genuine determinate state could have?
      *   **Yes** → Go to 7.
      *   **No** → **LEAF 4: Representationalism** (Awkward commitment: Must identify phenomenal character with content despite the grain difference.)

  7.  **Introspection-Free Subject:** Remove the introspective module. Does anything go missing for them, or just the ability to report?
      *   **Something Missing** → **LEAF 5: Higher-Order Illusionism** (Awkward commitment: There is a real difference in the subject that cannot be introspected.)
      *   **Nothing Missing** → **LEAF 6: Strong Illusionism** (Awkward commitment: The subject is phenomenally identical to a philosophical zombie.)

  8.  **Discourse Status:** Are sentences like "I feel pain" strictly false, or merely non-descriptive tools?
      *   **Strictly False** → **LEAF 7: Error Theory** (Awkward commitment: All ordinary phenomenal claims are false, yet we must keep making them.)
      *   **Non-Descriptive** → **LEAF 8: Quietism/Eliminativism** (Awkward commitment: There is no appearance to explain, only a linguistic habit to dissolve.)

  9.  **Ontological Ground:** Does the property grounding the truth of phenomenal claims exist independently of our conceptual scheme?
      *   **Yes (Distinct)** → **LEAF 9: Substance/Property Dualism** (Awkward commitment: Must explain causal interaction between distinct properties.)
      *   **Yes (Neutral/Intrinsic)** → **LEAF 10: Russellian Monism** (Awkward commitment: Physical science only captures the extrinsic structure of consciousness.)
      *   **No (Concept-Dependent)** → Go to 10.

  10. **Physical Realizer:** Is the physical realizer identical to the phenomenal property (a posteriori) or distinct but co-extensive (topic-neutral)?
      *   **Identical** → **LEAF 11: Type-B Physicalist** (Awkward commitment: Must accept brute psychophysical identities without explanatory gain.)
      *   **Distinct/Conceptual** → **LEAF 12: Phenomenal Concept Strategist** (Awkward commitment: The explanatory gap is purely conceptual, yet feels ontological.)

  ***

  **EMPTY CELLS & INDETERMINACY**

  **Logical Space Analysis:** The 9 binary nodes permit 512 combinations, though the tree structure prunes impossible paths. The most interesting unoccupied cells are:
  1.  **Debt=Yes + Upstream=Yes + Discourse=Non-Descriptive:** Incoherent. If there is a debt, discourse aims at truth; if it aims at truth and fails, it cannot be merely non-descriptive.
  2.  **Debt=No + Ontology=Distinct:** Unattractive. Positing distinct properties while denying introspection owes a success condition renders the properties explanatorily idle.
  3.  **Dimmer=No + Dashboard=Change:** Incoherent. If the property cannot fade without function loss (Realism), revealing the mechanism cannot merely change the state (Illusionism).
  4.  **Swapped=Mechanism + Upstream=Yes:** Unexplored. A view where both first-order and introspective states are illusory, yet phenomenology tracks the mechanism, lacks a defender.

  **Indistinguishable Leaves:** **Leaf 11 (Type-B Physicalist)** and **Leaf 12 (Phenomenal Concept Strategist)** are not fully separated here. Both accept physical realization and conceptual opacity.
  *   **Separating Question:** "Is the concept of phenomenality itself physically reducible, or does it denote a mode of presentation irreducible to physical concepts?" ( Honest answer may be indeterminate without a theory of concepts.)
