answer: |-
  Here are seven questions designed to press the argument rather than just amplify it, including the specific topics you requested.

  ### 1. The Hemispherectomy Math
  "In your view, disconnecting the two halves creates two people. But neurosurgeons sometimes remove an entire hemisphere completely (hemispherectomy) to treat epilepsy, and those patients generally wake up as the same single person they were before. If one hemisphere alone is sufficient for a whole conscious subject, why does *removing* one leave you with one person, but *disconnecting* them leaves you with two? Does the physical presence of the idle tissue create a second soul, even if it's silenced?"

  *   **Follow-up:** "She'll likely argue that the removed hemisphere wasn't fully developed or independent enough to count as a subject on its own. Push back by asking: 'So is your theory only true for adult brains? Because if I disconnect a child's brain, do I get two smaller people, but if I remove half, I get one? That seems like a very fragile line for something as big as personal identity.'"

  ### 2. The Fibre-by-Fibre Sorites
  "Let's imagine we don't cut the corpus callosum all at once. We sever it one nerve fibre at a time. At the start, there's one subject. At the end, you say there are two. Is there a specific fibre—the 199,999th or whatever—where the second person pops into existence? Or are you saying the number of people in a skull is a vague concept that doesn't have a true answer?"

  *   **Follow-up:** "If she admits it's vague (which is the philosophically safe bet), ask: 'If the number of people is vague, then moral responsibility must be vague too. Can we vaguely punish someone? If we can't, doesn't that force us to pretend there's a sharp line even if there isn't one?'"

  ### 3. Discovery vs. Decision
  "Are you telling us that you've discovered a fact about the universe—that there really, literally are two entities in there—or are you proposing a new way of *counting* that we should adopt because it's useful? In other words, is 'two subjects' a scientific finding or a conceptual framework?"

  *   **Follow-up:** "She will almost certainly say it's a mix, but lean on the 'framework' aspect to avoid hard metaphysics. Hit her with: 'If it's just a framework, why is yours better than the common-sense one? The common-sense view is simpler. What work is your view doing that the "one person" view can't do?'"

  ### 4. The Left Hemisphere's Lie
  "You argue that in normal brains, the left hemisphere stitches together a story of unity that is essentially a confabulation. But if that story is the only thing binding our experience together, isn't the *feeling* of being one person the only thing that actually matters? If the illusion is perfect, in what sense is it false?"

  *   **Follow-up:** "She'll distinguish between 'phenomenal unity' (feeling like one) and 'ontological unity' (being one). Ask: 'Okay, but if the phenomenal unity is all we ever have access to, why should we care about the ontological claim? Does it change anything for the person living the life?'"

  ### 5. Moral Responsibility and Punishment
  "If a split-brain patient's left hand (controlled by the right hemisphere) commits a crime, but the speaking left hemisphere claims they didn't do it and meant no harm, who goes to jail? If there are truly two subjects, punishing the body looks like punishing an innocent bystander who happens to share a skull."

  *   **Follow-up:** "She might suggest they share responsibility like conjoined twins. Press her: 'Conjoined twins are two bodies. Here we have one body. If you lock the body up, you lock up the innocent subject too. Does your theory imply we simply can't justly punish split-brain patients?'"

  ### 6. The Evolutionary Cost
  "Evolution tends to prune away expensive illusions. Maintaining a unified sense of self requires massive computational power to stitch together conflicting signals. If we are actually two agents, what is the survival advantage of the left hemisphere lying to itself about being the captain of the whole ship? Why not just let the two halves know they are separate?"

  *   **Follow-up:** "She'll likely say unity allows for coordinated action. Ask: 'But a team of two can coordinate without thinking they are one. A football team coordinates without thinking it's a single organism. Why does the brain need the *identity* merge rather than just a good communication protocol?'"

  ### 7. The Silent Partner
  "We infer the right hemisphere is conscious because it can point or draw, but it can't speak. But that's exactly how we infer consciousness in other people—we see their body move and assume a mind is there. Are you saying the right hemisphere is a 'person' in the same way my friend is a person, just trapped in my skull? Or is it a different category of being?"

  *   **Follow-up:** "If she says it's a person like your friend, ask: 'Then why do I have privileged access to their thoughts at all? If they are truly separate subjects, the left hemisphere shouldn't know any more about the right hemisphere's desires than it knows about mine. Yet they share moods and instincts. Where does that sharing stop and the separation begin?'"

  ***

  ### The Commitment

  **Open the episode with: Question 1 (The Hemispherectomy Math).**
  **Why:** It is the strongest concrete objection to her view. It grounds the abstract philosophy in a stark medical reality that listeners can visualize immediately. It forces her to explain why *absence* (removal) preserves unity while *presence* (disconnection) breaks it. It sets a skeptical but fair tone right out of the gate, showing you've done your homework without being hostile.

  **She will most likely wriggle out of: Question 3 (Discovery vs. Decision).**
  **Why:** This is the classic philosopher's escape hatch. When pressed on whether something is "real," philosophers often retreat to saying, "It depends on how we define 'real' or 'person'." This allows her to shift the goalposts from ontology (what exists) to semantics (how we talk). She can argue that both views are "correct" relative to different frameworks, which effectively neutralizes the challenge without her having to defend the hard claim that there literally are two souls in the skull. Be ready to pin her down if she tries to drift into semantic relativism.
