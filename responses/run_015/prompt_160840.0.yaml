answer: |-
  You haven't found a bug; you've found a feature. This asymmetry doesn't have a single famous noun phrase like "The Kantian Paradox," but it is the core engine of **Strict vs. Partial Compliance Theory**. For your group's purposes, call it **Compliance Trajectory Asymmetry**.

  The phenomenon is this: Universalizability tests (like Kant's "Law of Nature") assume **Strict Compliance** (100% adoption). They evaluate the *stability of the endpoint*, not the *safety of the transition*.

  Your two kinds map onto distinct structural dependencies:
  1.  **Parasitic Maxims (Your Lending Case):** These rely on others *not* doing them. They are free-riding strategies. They work at 10% compliance because the institution (lending) exists only due to others' honesty. At 100%, the institution collapses (Contradiction in Conception). The test correctly flags these as forbidden.
  2.  **Constitutive Maxims (Your Sidewalk Case):** These rely on others *doing* them. They are coordination conventions. At 10% compliance, they create chaos (you step left, they step right). At 100%, they are seamless. The test flags these as permissible (or obligatory), but only because it assumes the idealized endpoint.

  This is not the "specificity" objection (rigging the rule by adding clauses like "unless I'm wearing blue"). That changes the *scope* of the rule. Your observation changes the *dependency relation* between agents. It is also distinct from the **Threshold Problem** (where harm scales linearly until a tipping point); here, the value function itself inverts depending on direction.

  The edges blur with **Threshold Constitutive** cases. Voting is one: it requires many participants to function (constitutive), but not 100%. If everyone voted, the system wouldn't collapse (unlike lending); if no one did, it would fail (unlike sidewalk passing). Recycling is another: beneficial at 100%, harmless at 10%.

  The test's limitation is that it tells you what is valid *then*, not what is safe *now*. Adopting a Constitutive Maxim alone (stepping left when everyone else steps right) is irrational in the real world (Partial Compliance), even if universalized it is good. Your group is sensing the gap between **idealized stability** and **transitional viability**. The test measures the former; you are worrying about the latter. Both are valid, but they answer different questions.
