answer: |-
  Is origin essentialism a modal fact or a normative convention? I argue that the thesis that a human organism could not have developed from a different sperm and egg is not a unified modal truth but a conflation of four distinct essentialist claims that diverge in cases of twinning, chimerism, and mitochondrial replacement, revealing origin talk to be normative rather than metaphysical.

  **Statement of Problem and Hypothesis**
  The literature on origin essentialism treats the thesis as monolithic, defended and attacked using a single textbook case: a normal conception involving one sperm, one egg, and one resulting organism. Consequently, standard defenses treat the intuition as obvious, while standard objections dismiss it as linguistic artefact. Both sides leave the core concept of "origin" undefined. This project decomposes the standard thesis into four distinct claims: zygote essentialism (the organism could not have developed from a different fertilised egg), gamete-pair essentialism (it could not have arisen from a different sperm and egg), genome essentialism (it could not have had a different nuclear genome), and lineage essentialism (it could not have had different biological parents). My hypothesis is that these claims come apart in biologically possible but philosophically neglected cases. Monozygotic twinning shows that gamete-pair essentialism fails to individuate persons, as two people share one origin. Chimerism shows that an organism need not have exactly one origin, forcing a choice between fusion events or contributing zygotes. Mitochondrial replacement separates nuclear genome, cytoplasmic contribution, and lineage, making the four claims diverge in every combination. If successful, this analysis demonstrates that what appears to be a metaphysical necessity is actually a normative principle regarding how we trace lineages.

  **Methodology and Work Plan**
  The approach is conceptual rather than empirical. I will not conduct biological research but will treat the biological cases as fixed parameters for conceptual analysis, testing candidate principles of origin against them. The work plan for the semester is as follows:

  *   **Weeks 1–3:** Reconstruction of the standard argument for origin essentialism and formal decomposition into the four distinct claims identified above.
  *   **Weeks 4–6:** Analysis of Monozygotic Twinning and Chimerism. The goal is to demonstrate that standard essentialist principles either fail to individuate organisms or contradict empirical premises about singular origins.
  *   **Weeks 7–9:** Analysis of Mitochondrial Replacement. This case serves as the stress test, separating genetic material from gestational origin and parental lineage.
  *   **Weeks 10–12:** Drafting the positive account. If the essentialist thesis fails, I will formulate the normative alternative that explains why we retain the intuition in standard cases.
  *   **Weeks 13–15:** Revision of the manuscript and preparation of the workshop materials.

  **Deliverables and Success Criteria**
  The primary deliverable is a paper of approximately 8,000 words suitable for submission to a top-tier journal in metaphysics or philosophy of biology. The secondary deliverable is an internal workshop to present the findings to colleagues.

  A merely clarifying restatement would simply note that the four claims are distinct. A real result requires showing that no single essentialist principle survives all three cases without ad hoc modification that undermines the original modal force of the thesis. Success is defined as demonstrating that defenders of origin essentialism must either abandon the claim that origins are metaphysically necessary or accept a revised thesis so weak it no longer supports the philosophical work usually assigned to it (e.g., grounding personal identity or moral status).

  **Risk Assessment and Failure Mode**
  The primary risk is that the biological cases can be accommodated by a small patch to the existing thesis. For example, a defender might concede that chimerism is a edge case that does not refute the rule for standard organisms. I state plainly that if all three cases can be accommodated by such minor modifications without forcing a shift from modal fact to normative convention, then there is no project here. In that event, the grant would result in a negative finding, which I will report honestly rather than forcing a positive conclusion. The project relies on the divergence of the four claims; if they remain co-extensive across the cases, the hypothesis is falsified.

  **Scope and Feasibility**
  One semester of partial teaching relief is sufficient for this scope provided the biological analysis remains conceptual. The risk lies in getting bogged down in empirical details of mitochondrial mechanics or chimeric frequency. If time becomes constrained, the Mitochondrial Replacement case will be cut, as Twinning and Chimerism alone suffice to separate zygote and gamete-pair essentialism from lineage essentialism. However, this would weaken the conclusion regarding the normative nature of origin talk. The workshop may also be cancelled if the drafting phase requires additional time, though the paper remains the priority. The scope is tight but achievable if the focus remains on the metaphysical implications of the cases rather than the biology itself.
