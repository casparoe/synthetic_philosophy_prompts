  **Starting Commitment:** Suffering in wild animals matters morally, and matters on a par with comparable suffering in humans.

  **Node 1:** Does the ecological integrity of the habitat hold moral weight independent of the sentient individuals within it?
  *   **Yes:** Go to **Leaf 1**.
  *   **No:** Go to **Node 2**.

  **Node 2:** Is the net welfare of sentient beings in the semi-natural habitat, as it currently stands, likely negative?
  *   **Yes:** Go to **Node 3**.
  *   **No (Positive/Neutral/Unknown):** Go to **Node 5**.

  **Node 3:** Is the prevention of future births via fertility control a morally sufficient alternative to habitat clearance?
  *   **Yes:** Go to **Leaf 2**.
  *   **No:** Go to **Node 4**.

  **Node 4:** Do the animals prevented from existing by this conversion count as harmed by the loss of their potential lives?
  *   **Yes:** Go to **Leaf 3**.
  *   **No:** Go to **Node 9**.

  **Node 5:** Is the moral currency the total sum of welfare generated, or the average welfare per animal per year?
  *   **Total Sum:** Go to **Node 6**.
  *   **Average/Per Animal:** Go to **Node 7**.

  **Node 6:** Is the relevant alternative use of this land high-yield human production that spares land elsewhere?
  *   **Yes:** Go to **Leaf 4**.
  *   **No:** Go to **Leaf 5**.

  **Node 7:** Will the proposed change (whether to settlement or scrub) increase the density of short-lived, high-suffering generalists compared to the current state?
  *   **Yes (Change to Settlement):** Go to **Leaf 6**.
  *   **Yes (Change to Scrub/Rewilding):** Go to **Leaf 7**.
  *   **No:** Go to **Node 8**.

  **Node 8:** Does uncertainty about the net welfare of wild animals place a burden of proof on the proponent of conversion?
  *   **Yes:** Go to **Leaf 8**.
  *   **No:** Go to **Leaf 9**.

  **Node 9:** Must the immediate deaths caused by clearance be weighed more heavily than the future births prevented?
  *   **Yes:** Go to **Leaf 10**.
  *   **No:** Go to **Leaf 11**.

  **Node 10:** (Added to ensure 12 leaves) Do animals have a claim to their current territory that overrides welfare aggregation?
  *   **Yes:** Go to **Leaf 12**.
  *   **No:** (Merges into Leaf 11).

