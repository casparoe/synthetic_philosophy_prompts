  ### The Leaves

  1.  **Ecological Holism**
      *   *Commitment to defend:* You must defend that the continuity of the ecosystem justifies permitting the intense suffering of the sentient individuals composing it.
  2.  **Compassionate Stewardship**
      *   *Commitment to defend:* You must defend the technical and moral feasibility of administering fertility control to wild populations at a landscape scale.
  3.  **Non-Identity Restrained Interventionist**
      *   *Commitment to defend:* You must defend that preventing a happy life is a harm comparable to the suffering you aim to prevent by that prevention.
  4.  **Welfarist Land Sparing**
      *   *Commitment to defend:* You must defend intensifying human production in one zone to release land elsewhere, accepting higher local density of suffering for greater total welfare.
  5.  **Anthropocentric Welfarist Development**
      *   *Commitment to defend:* You must defend that the welfare gains to humans from low-yield settlement outweigh the welfare losses to the displaced wildlife.
  6.  **Anti-Conversion Generalist Aversion**
      *   *Commitment to defend:* You must defend that human housing creates more suffering-per-animal than the wild scrub it replaces, favoring the status quo.
  7.  **Successional Suffering Avoidance**
      *   *Commitment to defend:* You must defend that allowing farmland to revert to wild scrub is morally harmful because it breeds short-lived, high-suffering pioneers.
  8.  **Epistemic Precautionary Principle**
      *   *Commitment to defend:* You must defend paralysis in the face of probable massive suffering simply because the magnitude of that suffering is uncertain.
  9.  **Welfarist Gradualism**
      *   *Commitment to defend:* You must defend that small, monitored conversions are permissible while large ones are not, despite similar underlying ethical calculus.
  10. **Expected Value Maximization**
      *   *Commitment to defend:* You must defend acting on probabilistic models of wild suffering even when the data is too sparse to verify the outcome.
  11. **Territorial Rights View**
      *   *Commitment to defend:* You must defend that an animal's claim to its birthplace overrides the aggregate welfare gains of relocating or replacing it.
  12. **Negative Utilitarian Conversion**
      *   *Commitment to defend:* You must defend killing existing animals to prevent their unborn conspecifics from suffering in the same habitat.

  ---

  ### Unoccupied Combinations

  1.  **Ecological Holism + Negative Utilitarian Conversion:** *Incoherent.* Holism values the persistence of the biotic community; Negative Utilitarian Conversion values the elimination of the habitat to reduce suffering. One cannot coherently hold that the system has independent value while simultaneously advocating for its destruction to serve the individuals within it.
  2.  **Welfarist Land Sparing + Average Welfare Currency:** *Unattractive.* Land sparing relies on the Total View (more lives worth living elsewhere) to justify intensification. If one values Average Welfare, intensifying production to spare land makes little sense unless the spared land has significantly higher *per-capita* welfare, which is rarely the argument used by sparing proponents.
  3.  **Compassionate Stewardship + Non-Identity Restrained:** *Unexplored/Incoherent.* Compassionate Stewardship relies on fertility control to prevent suffering. If one holds the Non-Identity view that preventing existence is a harm, fertility control becomes a rights violation equivalent to the suffering it prevents, collapsing the position into inaction.

