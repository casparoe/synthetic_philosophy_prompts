      *   *Attractor State:* The loop acts as a basin of attraction. Phil keeps falling back to Feb 2nd. To escape, he needs enough energy/change to jump the basin's edge.
      *   *Escape Mechanism:* Is it micro-changes? He tries thousands of things. Most fail. The successful "path" requires a specific configuration of internal states (altruism, love, skill mastery). This looks like *contingency* within a *structurally determined* system.
      *   *Equifinality:* Does he reach Feb 3rd no matter what? No. He's stuck for what seems like years (or decades). So it's *not* equifinality in the strict sense. The endpoint is contingent on his internal evolution.
      *   *The Town:* The town is the "structure." It doesn't change. This highlights that path dependence here is *internal* (psychological/moral) rather than *external* (institutional). This challenges the "social systems" aspect of the user's course. I need to address this tension.
      *   *Hollywood vs. Theory:* Hollywood says "Be good and you win." Theory says "Structures constrain agency." The movie suggests agency can break structure *if* the agency aligns with the structure's hidden rules.

  5.  **Drafting the Argument (Section by Section):**

      *   **Introduction:** Acknowledge the roommate's insight. It's a provocative lens. Define the core tension: Structure (the Loop) vs. Agency (Phil).
