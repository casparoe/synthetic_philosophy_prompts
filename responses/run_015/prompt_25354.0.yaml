prompt: |-
  I recently found myself in a situation at work where I had to decide whether to escalate a concern about a project outside our team's normal reporting structure. In reading up on the ethics of unilateral action, I came across the unilateralist's curse and it's been occupying my thoughts. I've now written down the set of views I seem to hold, and I need someone to check whether they form a coherent package or whether I'm inadvertently committed to something I'd reject.

  Here's where I've landed:

  (1) The unilateralist's curse identifies a real problem: when any member of a group can unilaterally take an irreversible action that affects the group, and members rely on their own private evidence and estimates of expected value, systematically bad decisions result — even when everyone is acting in good faith.

  (2) The appropriate response to the curse is a principle of epistemic deference: in situations where the curse applies, an individual should defer to the collective judgment of the affected group, unless they have strong reason to believe their private evidence is qualitatively different from what others have access to — not merely that they assess the shared evidence differently.

  (3) Whistleblowing — exposing serious organizational wrongdoing through channels outside the organization's formal procedures — is sometimes morally required, not merely permitted.

  (4) Whistleblowing is structurally a unilateralist situation: a single individual can irreversibly disclose information that significantly affects many people, based on private evidence and a personal estimate of whether the disclosure does more good than harm.

  (5) The epistemic limitations that generate the unilateralist's curse — reliance on private evidence, overconfidence in one's own judgment, differing priors across individuals — are pervasive features of human cognition. They are not confined to exotic scenarios like deciding whether to publish dangerous research; they apply to whistleblowing decisions just as much.

  (6) There is no principled distinction between "disclosing information" and "creating new states of affairs" that would place whistleblowing outside the scope of unilateralist-curse reasoning. Paradigmatic unilateralist-curse cases, such as publishing a risky experimental protocol, centrally involve information disclosure.

  I can feel that some of these are pulling against each other, but I'm not sure which tensions are genuine, which are merely apparent, and which commitment I'd have to revise to restore consistency. Please go through these and identify every pair that is in tension. For each, say whether the tension is real or only apparent, and if real, how severe it is and what the least costly revision would be. Then tell me which single revision would do the most to clean up the set as a whole. Don't assume I'm willing to give up any particular one — I want to know the price of each option before I decide.

  Respond in the style of an expert in decision theory and ethics. Think very carefully before answering; I want the tensions ranked and discriminated, not just listed.
