answer: |-
  It is a pleasure to correspond with a colleague from the experimental side. Please rest assured: your formulation is neither trivial nor muddled. In fact, you have put your finger on what is arguably the central philosophical problem in the foundations of quantum mechanics today. In the literature, this is often called the **Incoherence Problem** (how can there be uncertainty in a deterministic theory where everything happens?) coupled with the **Quantitative Problem** (why the Born rule and not branch counting?).

  As a physicist, you are describing a community that operates with a *functionalist* conception of probability while debating *ontological* interpretations that struggle to support it. Let us reconstruct the implicit theory, examine its coherence, and look at the practical consequences.

  ### 1. Reconstructing the Implicit Theory of Probability

  You ask what theory of probability is presupposed by the practice of treating the Born rule as a single-case guide within a deterministic dynamics.

  **The Implicit View: Neo-Pragmatic Functionalism**
  Working physicists generally do not subscribe to a rigorous philosophical definition of probability during their workday. Instead, they operate under a tacit **Functionalism**. In this view, "probability" is defined by the role it plays in the theory. If a mathematical quantity:
  1.  Is additive over mutually exclusive outcomes,
  2.  Guides rational betting behavior (decision theory),
  3.  Matches long-run relative frequencies in repeated trials,
  ...then it *is* probability, regardless of its metaphysical underpinning.

  However, when pressed (as in your coffee argument), the specific interpretation required to make sense of Everettian Quantum Mechanics (EQM) is **Self-Locating Uncertainty combined with Decision-Theoretic Credence.**

  *   **Why not Propensity?** A propensity implies an objective, single-case chance that one outcome occurs *rather than* another. In strict EQM, there is no "rather than." All outcomes occur. Therefore, strict propensity interpretations are incompatible with the deterministic dynamics you described.
  *   **Why not Frequentism?** As you noted, experimentalists assign probabilities to single events (e.g., "This Higgs candidate has a 95% probability of being real"). Strict frequentism cannot assign a probability to a single non-repeatable event. Physicists use "hypothetical frequentism" (what *would* happen in an ensemble), which is a counterfactual, not an actual frequency.
  *   **The Winner: Credence.** In the EQM context, the implicit theory is that probability is a **rational degree of belief (credence)** held by an agent who is uncertain about their location in the branching wavefunction.

  ### 2. Compatibility and Rival Interpretations

  The practice you describe quietly rules out **Hard Determinism** (which denies probability entirely) and **Objective Chance Propensity** (in the Popperian sense, which requires genuine indeterminism).

  It remains compatible with:
  1.  **Subjective Bayesianism:** Provided one accepts constraints on priors (specifically, that rational agents must set priors according to the Born weights).
  2.  **Typicality:** Provided one accepts that "typicality" can do the work of probability without being probability.

  **The Tension:**
  The practice rests on a tension between **Ontology** (the wavefunction is real and deterministic) and **Phenomenology** (I experience only one outcome). The "Implicit Theory" bridges this by claiming that the *experience* of probability arises from the agent's ignorance of which branch they will inhabit post-measurement.

  ### 3. Coherence: The "Smuggling" and Self-Location

  You ask if the practice is coherent, specifically regarding the "typicality move" and "self-locating questions." This is where the philosophers have been most active.

  **The Typicality Smuggling**
  You are right to be suspicious. The claim that "almost all branches exhibit Born-rule frequencies" is dangerous.
  *   In EQM, branches do not come with a natural "counting measure." There is no fact of the matter about how many branches there are (due to the continuous nature of decoherence bases).
  *   To say a result is "typical," you must define a measure over the branches. If you define the measure using the Born rule ($|\psi|^2$) to prove that the Born rule is typical, you have argued in a circle.
  *   **Verdict:** The typicality move *does* smuggle the Born measure in, unless it is grounded in something else, such as symmetry arguments (e.g., Zurek's envariance) or decision-theoretic axioms (Deutsch-Wallace). Most physicists gloss over this derivation gap.

  **Self-Locating Uncertainty**
  Does the question "Which copy of me am I?" admit a well-defined answer?
  *   **Pre-measurement:** There is one agent.
  *   **Post-measurement:** There are multiple successors.
  *   **The Uncertainty:** Philosophers like David Wallace and Simon Saunders argue that the uncertainty is not about *what happens* (everything happens), but about **which future self I am**.
  *   However, a critic (like Adrian Kent) would argue this is incoherent. If I know the wavefunction, I know *all* my successors exist. To say "I don't know which one I will be" implies a future singular identity that EQM denies.
  *   **Resolution:** The most coherent reconstruction is that the uncertainty is about **indexical knowledge**. I know the global state, but I do not know my location *within* it. This is coherent, but it requires accepting that probability is not about "what occurs" but "where I am."

  ### 4. Practical Consequences: Changing the Theory of Probability

  If we forced physicists to abandon this pragmatic functionalism and adopt a strict philosophical stance, how would work change?

  **Scenario A: Strict Frequentism**
  If physicists adopted strict von Mises frequentism (probability *is* long-run frequency in an actual ensemble):
  *   **Single-Case Paralysis:** You could not assign a probability to a single event (e.g., "Will this specific collider run find supersymmetry?"). You could only speak about the ensemble of all possible universes or an infinite repetition of *this* experiment.
  *   **Cosmology Collapse:** Quantum cosmology would become impossible. There is only one universe; there is no ensemble of universes to generate frequencies.
  *   **Discovery Claims:** Claims of "5-sigma discovery" would have to be rephrased. You couldn't say "There is a 1 in 3.5 million chance this is noise." You would have to say "In an infinite ensemble of identical universes, noise produces this signal 1 in 3.5 million times." This is operationally useless for deciding whether to publish *now*.

  **Scenario B: Pure Subjective Bayesianism**
  If physicists adopted a de Finetti-style subjective Bayesianism (probability is *only* personal belief, unconstrained by objective physics):
  *   **Loss of Normativity:** The Born rule would become a suggestion, not a law. A physicist could consistently assign a credence of 0.5 to spin-up and spin-down for a state $\sqrt{0.99}|\uparrow\rangle + \sqrt{0.01}|\downarrow\rangle$ without being "wrong," merely "unusual."
  *   **Convergence Required:** To save the practice, you would need to add a constraint (like the Principal Principle) that forces rational agents to align their credences with the quantum weights. But then you are back to asking *why* rational agents must do that—which leads you right back to the Deutsch-Wallace decision-theoretic derivations.
  *   **Experimental Design:** Optimization of experiments (maximizing information gain) would become purely about satisfying the agent's curiosity rather than probing an objective feature of nature.

  ### 5. Summary and Verdict

  Your intuition is correct: the practice is **pragmatically coherent but metaphysically tense.**

  1.  **Implicit Theory:** Physicists use a **Decision-Theoretic Credence** view masked as **Objective Propensity**. They act *as if* the Born weights are objective chances because that is the only way to function in a lab, even if their theory says all outcomes occur.
  2.  **The Smuggling:** Yes, typicality arguments often smuggle in the Born measure unless carefully grounded in symmetry or decision theory.
  3.  **Self-Location:** The question "Which copy am I?" is well-defined only if one accepts **indexical uncertainty**. If one demands a physical fact distinguishing the copies *before* the split, the question has no answer.
  4.  **The Cost:** Moving to a strict frequentist or pure subjective view would cripple the methodology of high-energy physics and cosmology. The current "shut up and calculate" functionalism is the only glue holding the experimental practice and theoretical interpretation together.

  **A Suggestion for Your Argument:**
  When arguing with your postdoc, you might suggest that the Born rule in EQM is not a statement about *frequency of occurrence* (since all occur), nor about *propensity* (since dynamics are deterministic), but about **caring weights**.
  In a branching universe, probability tells you how much you should *care* about each of your future successors. If one branch has weight 0.99 and the other 0.01, a rational agent should care 99 times more about the welfare of the successor in the first branch. This preserves the normative force of probability (guiding action/betting) without requiring objective chance.

  This view (championed by David Wallace) resolves the tension you identified: it acknowledges the determinism, validates the single-case betting behavior, and admits that the "probability" is a feature of the agent's relationship to the multiverse, not a feature of the multiverse alone. It is a subtle shift, but it is the only one that keeps the practice coherent without smuggling in hidden assumptions.
