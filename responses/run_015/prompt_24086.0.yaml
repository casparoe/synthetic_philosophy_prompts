          *   *Smuggling:* Does typicality smuggle in the measure? Yes, usually. To define "typical," you need a measure. If you choose the Born measure to define typicality, you've assumed what you wanted to prove.
          *   *Self-Location:* Does "Which copy am I?" have an answer? In EQM, pre-measurement, there is one agent. Post-measurement, there are successors. The uncertainty is about *which successor* I will be (or rather, how I should care about them).

      *   **Task 4: Practical Consequences (Frequentist vs. Bayesian):**
          *   *Strict Frequentist:* Experimentalists would be paralyzed. They couldn't claim discovery based on $5\sigma$ in a single dataset without assuming an ensemble that doesn't exist (in the strict sense). They rely on "hypothetical frequentism."
          *   *Pure Subjective Bayesian:* Actually closer to what they do, but would require explicit priors. It would change the rhetoric from "nature is probabilistic" to "our expectations are constrained."
          *   *EQM Specific:* If EQM is true and we adopt strict Bayesianism, probability becomes purely about care weights for future selves.

      *   **Task 5: Synthesis/Conclusion:**
