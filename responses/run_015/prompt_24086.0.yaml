  7.  **Final Polish:** Ensure the distinction between the *experimentalist's* view (often instrumentalist) and the *theorist's* view (often realist/Everettian) is clear, as the prompt highlights the friction between them. (Self-correction: The prompt implies the *same* community does both. I should address how they hold these simultaneously, often via "Shut up and calculate" functionalism.)

  *(Self-Correction on "Typicality"):* I need to be careful. Typicality is often invoked in Bohmian mechanics too. In EQM, "branch counting" fails, so "measure typicality" is used. I must highlight that using measure to define typicality is circular if trying to *derive* the measure.

