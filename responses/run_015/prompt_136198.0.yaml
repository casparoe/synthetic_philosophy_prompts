answer: |-
  First off, don't worry about the typo—writing a dissertation is a marathon, and "dissertaton" is a perfectly understandable casualty of the process.

  More importantly: **You are not importing an economic model he never applied; you are identifying a genuine structural tension in act-utilitarianism that secondary literature often glosses over in favor of the "proto-queer-rights" narrative.**

  Your intuition is sharp. The standard reading (championed by scholars like Louis Crompton and David Halperin) focuses on Bentham's *negative* utilitarianism regarding the law: punishment creates immense pain, the act creates private pleasure, therefore the law should withdraw. But you are correctly pointing out that if Bentham is a *maximizer*, not just a harm-reducer, he theoretically commits himself to a specific topology of pleasure distribution.

  Here is a breakdown of why this tension exists, why the literature might be skipping it, and how you can weaponize it for your chapter.

  ### 1. Did Bentham Apply Diminishing Marginal Utility (DMU) to Sex?
  You are right to question if you are anachronistically applying neoclassical economics. However, Bentham absolutely understood the concept of satiety and saturation, even if he didn't graph it as a marginal utility curve.

  In his *Principles of Morals and Legislation*, Bentham outlines the dimensions of pleasure (intensity, duration, certainty, propinquity, fecundity, purity, extent).
  *   **Purity:** This is where DMU lives for Bentham. He acknowledges that pleasures often bring attendant pains (satiety, health issues, shame).
  *   **Fecundity:** He considers whether a pleasure leads to more pleasures.

  In his unpublished manuscripts on paederasty (specifically *"Offences Against One's Self"* and the later *"Paederasty"* essays), Bentham does grapple with the idea that sexual pleasure is finite and that "excess" could theoretically be harmful to the individual's health or the state's population. However, he generally concludes that the *social* pain (ostracization, legal punishment) vastly outweighs the *physical* pain of satiety.

  **The Gap:** You are correct that secondary literature focuses on the *decriminalization* argument (Law vs. Individual) rather than the *hedonic optimization* argument (Individual vs. Their Own Best Interest). Most scholars want to claim Bentham as a liberal hero; admitting he might theoretically advocate for "optimal sexual distribution" complicates that liberal image.

  ### 2. The "Optimization" vs. "Liberty" Resolution
  Your core insight is that Bentham's argument shifts from a "rights claim" to an "optimization prescription." **This is actually philosophically more accurate to Bentham.**

  Remember: Bentham famously called natural rights "nonsense upon stilts." He never argues for a *right* to sex. He argues for a *policy* that maximizes utility. So, you are right: it is not a liberal rights claim.

  So, why doesn't he advocate for state-enforced sexual optimization (e.g., mandating variety to avoid DMU, or limiting frequency to prevent satiety)?

  **The Solution: The Cost of Information and Enforcement.**
  You can resolve the tension in your chapter by arguing that Bentham's "liberty" conclusion is actually a *second-order optimization strategy*.
  *   **First-Order:** What distribution of sex maximizes pleasure? (Maybe your DMU hypothesis is right).
  *   **Second-Order:** Who is best positioned to calculate this?
  *   **Bentham's Answer:** The Magistrate cannot calculate individual hedonic curves. The cost of surveillance and enforcement to ensure "optimal sexual distribution" would generate so much pain (fear, intrusion, punishment errors) that it would negate any marginal utility gains from optimizing sexual frequency.

  Therefore, the "no victim, no crime" argument isn't a denial of optimization; it is an admission of **epistemic humility** within the calculus. The state retreats not because individuals have rights, but because the state is bad at calculating the felicific calculus of the bedroom.

  ### 3. The Population Counter-Weight
  There is one place where Bentham *does* worry about the optimization of sex, and it might strengthen your argument: **Population.**

  In some manuscripts, Bentham worries that if homosexual acts become too prevalent, it might reduce population growth (a common 18th/19th-century concern). Here, he *does* flirt with the idea that the state has an interest in the "distribution" of sexual acts (i.e., ensuring enough reproductive sex happens).
  *   He ultimately dismisses this worry regarding paederasty, arguing that people will still marry and reproduce due to social pressure and other desires.
  *   **Your Angle:** This proves your point! It shows Bentham *was* willing to consider the "distribution" of sexual behavior for utilitarian ends. He only rejects intervening because he calculates the intervention costs (and the actual demographic impact) as negligible.

  ### 4. How to Frame This in Your Chapter
  This is a dissertation-worthy nuance. Don't discard it; foreground it. Here is a suggested roadmap for that section:

  1.  **State the Standard View:** Bentham decriminalizes based on harm-avoidance (no victim).
  2.  **Introduce the Tension:** As a maximizer, Bentham should theoretically care about the *quantity and distribution* of pleasure, not just the absence of pain. Introduce your DMU argument here.
  3.  **The Economic Import Charge:** Address your own doubt. Acknowledge that while Bentham didn't use modern econometrics, his concept of "purity" and "satiety" acknowledges diminishing returns.
  4.  **The Resolution (The "Administrative Utilitarianism" Argument):** Argue that Bentham's defense of liberty is *instrumental*. He permits "sub-optimal" private choices (from a god's-eye view) because the *process* of state optimization creates more pain than it prevents.
  5.  **Conclusion:** Bentham isn't a liberal defending rights; he is a bureaucrat optimizing outcomes who realizes the bedroom is a market the state cannot regulate efficiently.

  ### 5. Why the Literature Misses This
  Most scholarship on Bentham and sexuality comes from two angles:
  1.  **Legal History:** Focused on the shift from sin-crime to harm-crime.
  2.  **Queer Theory:** Focused on Bentham as a closeted figure or early ally.

  Neither group is particularly interested in the *micro-economics of Bentham's hedonism*. They want to know if he was "for" gay rights, not if his calculus implies a specific frequency of intercourse. This gives you a genuine opening to contribute something new.

  **Summary:** You aren't missing something obvious; you're seeing the machinery behind the curtain. The "liberty" outcome is a byproduct of the calculation, not a foundational principle. Lean into the "optimization prescription" angle—it makes your reading more rigorously utilitarian than the standard "liberal" reading.

  Good luck with the chapter. This is a strong theoretical hook.
