          4.  Hyperbole/Misuse: "I literally died" $\rightarrow$ Speaker thinks it means "figuratively." Whose dictionary counts?
          5.  "Implicature Debt" (User's term?): Speaker's accountability for implications vs. assertions. Can you deny implicature without lying?
      *   **Specific Questions:** Is there a single principle (cancellability/deniability)? What does it predict for the "literally" case? Is the politician vague or lying?

  2.  **Deconstruct the Theoretical Framework (Grice & Post-Grice):**
      *   *Grice's Core:* Speaker Meaning ($Meaning_{NN}$) requires intention. Specifically, the intention that the audience recognize the intention.
      *   *Implicature:* What is suggested/conveyed beyond what is said.
      *   *Key Tests:* Cancellability (can I add "but not..." without contradiction?), Calculability (can it be worked out via maxims?), Determinacy (is it specific?).
      *   *Speaker Intention vs. Audience Uptake:* This is the tension point. Grice emphasizes intention, but communication requires uptake.
