answer: |-
  You are hitting on one of the most persistent friction points in pragmatics: the boundary between **what is encoded** (semantics), **what is intended** (speaker meaning), and **what is inferred** (audience uptake). Your intuition that these cases feel scattered is correct because they actually rely on different mechanisms within the Gricean framework (and its successors).

  There isn't one single "magic bullet" principle, but there is a **diagnostic framework** that sorts them. The closest thing to the unifying principle you're looking for is **Cancellability**, but it must be paired with **Speaker Commitment**.

  Here is how to organize your intuitions, followed by the specific predictions you asked for.

  ### The Unifying Principle: Cancellability as a Test for Commitment

  Grice proposed **cancellability** as the primary test for implicature. If a speaker can add a clause to their utterance that negates the implied meaning without creating a contradiction, it is an implicature. If they cannot, it is likely part of "what is said" (entailment) or a different kind of non-literal speech (like metaphor/irony).

  However, to address your concern about **intent vs. recovery**, we need to add a layer of **Accountability**.
  *   **The Principle:** *A speaker is fully committed to what is said, but only conditionally committed to what is implicated, depending on whether the implication was intended and recognizable.*

  Let's run your five cases through this filter.

  #### 1. The Roommate ("The trash is full")
  *   **Type:** Particularized Conversational Implicature (Indirect Speech Act).
  *   **Intent:** High. She intends you to recognize the request.
  *   **Cancellability:** **Yes.** She can say, "The trash is full, but I'm not asking you to take it out; I'll do it later."
  *   **Verdict:** This is a cooperative inference. You recover the meaning because you assume she is being relevant. If you take it out, you are accepting the "debt." If she cancels it, she burns social capital, but she isn't lying.

  #### 2. The Politician ("Mistakes were made")
  *   **Type:** Generalized Conversational Implicature (often).
  *   **Intent:** Deliberate obfuscation. The intent is *not* for you to recognize the intention to deceive, but to recognize the intention to *evade*.
  *   **Cancellability:** **Technically Yes, Practically No.** They can say, "Mistakes were made, by me." But doing so defeats the purpose of the utterance.
  *   **Verdict:** This is the heart of your "Intent vs. Recovery" problem. The politician relies on the audience's automatic inference (passive voice = agent is hidden/innocent) without explicitly asserting it.
  *   **Lying or Vague?** This is **Misleading**, not Lying. In philosophy of language (e.g., Jennifer Carson, Don Fallis), a lie requires asserting something you believe to be false. An implicature allows the speaker to maintain "plausible deniability." They are not committed to the truth of the implication in the same way they are to the assertion.

  #### 3. Sarcasm ("Great job")
  *   **Type:** Flouting the Maxim of Quality (Irony).
  *   **Intent:** The speaker intends you to see that the literal meaning is false.
  *   **Cancellability:** **No.** You cannot say, "Great job... I mean you are incompetent." That destroys the irony.
  *   **Verdict:** Sarcasm is different from standard implicature. In standard implicature, the literal meaning remains true (the trash *is* full). In sarcasm, the literal meaning is **pretended**. The "speaker meaning" replaces the literal meaning entirely. Your intuition that the literal meaning is "dead weight" is correct; in irony, the literal meaning is a prop, not a claim.

  #### 4. The "Literally" Case ("I literally died")
  *   **Type:** Semantic Drift vs. Hyperbole.
  *   **Intent:** To convey intensity.
  *   **The Conflict:** If the speaker *genuinely thinks* "literally" means "figuratively," their mental dictionary has changed.
  *   **Verdict:** This is where Grice struggles and modern semantics takes over.
      *   **Gricean View:** If they intend you to understand "I was very shocked," that is the **Speaker Meaning**. The fact that the **Sentence Meaning** is false (they didn't die) is resolved by assuming they are hyperbolizing (flouting Quality).
      *   **The Prediction:** If they believe it's correct usage, they are not lying. They are asserting intensity. However, if the audience holds the standard definition, communication fails or requires a "repair."
      *   **Does Speaker Meaning follow their dictionary?** Yes. Speaker meaning is psychological. If I use a word incorrectly but you understand what I intend, communication succeeded, even if grammar failed.

  #### 5. "Implicature Debt" (Accountability)
  *   **Concept:** You didn't make this up; it maps onto the **Lying vs. Misleading** distinction and **Discourse Commitment**.
  *   **The Principle:** You can deny an implicature without being *logically* inconsistent, but you may be **conversationally** dishonest.
  *   **Example:**
      *   *A:* "Is John a good programmer?"
      *   *B:* "He shows up on time." (Implicature: He is not a good programmer).
      *   *A:* "So he's bad?"
      *   *B:* "I didn't say that."
  *   **Verdict:** B is being **cooperatively defective**. They are exploiting the gap between *assertion* (high commitment) and *implicature* (low commitment) to avoid responsibility. This is the "debt": you incur a social obligation to own your implications if they were clearly intended.

  ---

  ### Addressing Your Specific Questions

  #### 1. Is there a single principle?
  The closest principle is **Reflexive Intention combined with Cancellability.**
  *   **Reflexive Intention (Grice):** Speaker meaning exists only if the speaker intends the audience to recognize the intention.
  *   **Cancellability:** Determines the *strength* of the commitment.
  *   **The Rule:** If it's cancellable, the speaker can deny it without logical contradiction (low debt). If it's non-cancellable (like sarcasm or entailment), the speaker owns it fully (high debt).

  #### 2. What does it predict for the "Literally" case?
  It predicts that **Speaker Meaning trumps Semantic Meaning** in communication, but not in truth-conditions.
  *   If your friend says "I literally died," and you understand "I was very embarrassed," communication succeeded.
  *   However, if they are later asked under oath, "Did you die?", and they say "No," they are not a liar, even though they previously said "I literally died." They were speaking hyperbolically.
  *   **Crucial Nuance:** If they *believe* "literally" means "figuratively," they are semantically confused, but pragmatically clear. Grice would say they are not violating the Maxim of Quality (trying to be truthful) because they believe their usage conveys the truth of their *feeling*, not their *mortality*.

  #### 3. Is the Politician vague or lying?
  The framework predicts the politician is **Misleading (Vague)**, not Lying.
  *   **Lying:** Asserting $P$ when you believe $\neg P$. ("I did not make mistakes," when they know they did).
  *   **Misleading:** Asserting $P$ ("Mistakes were made") to implicate $Q$ ("I didn't make them"), knowing $Q$ is false, while technically keeping $P$ true.
  *   **The "Debt":** The politician is trying to avoid the "Implicature Debt." They want the benefit of the implication (innocence) without the commitment (accountability).
  *   **Your Intuition:** Your gut tells you this is dishonest. Pragmatics agrees: it is **cooperatively dishonest** even if it is **semantically honest**. They are violating the Spirit of the Cooperative Principle (specifically the Maxim of Manner: "Avoid ambiguity") while adhering to the Letter.

  ### Summary for your "Scattered Verdicts"

  Your intuitions aren't scattered; they are detecting different **levels of commitment**.

  1.  **Roommate:** High Intent, Low Commitment (Cancellable). *Social contract.*
  2.  **Politician:** High Intent, Low Commitment (Exploited Cancellability). *Strategic evasion.*
  3.  **Sarcasm:** High Intent, High Commitment (Non-Cancellable). *Meaning replacement.*
  4.  **"Literally":** High Intent, Semantic Error. *Hyperbole.*
  5.  **Debt:** The gap between Semantic Commitment (Assertion) and Pragmatic Commitment (Implicature).

  **The Takeaway:** The line between intent and recovery isn't a wall; it's a handshake. Speaker meaning requires the speaker to *intend* the uptake. If the speaker creates a situation where the uptake is likely (Politician) but builds a trapdoor to deny it (Cancellability), they are generating implicature without accepting the debt. That is where your feeling of inconsistency comes from: you are judging them morally for a pragmatic maneuver. Grice gives you the tools to prove they are being uncooperative, even if they aren't technically lying.
