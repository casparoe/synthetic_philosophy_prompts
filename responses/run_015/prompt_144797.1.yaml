answer: |-
  # Activity: The Core & The Clay
  **Time:** 60 Minutes
  **Participants:** 10 Undergrads (plus you as Facilitator)
  **Goal:** Physicalize the Constitution Problem (Statue vs. Clay) without defining it until the end.

  ## 1. Materials Checklist
  *   **Building Blocks:** 50–60 interlocking bricks (Legos work best).
      *   **3 Red Bricks:** These are the "Core." (Must be distinct).
      *   **50+ Assorted Colors:** These are the "Clay."
  *   **The Screen:** A cardboard box with a hole cut in the side, or a laptop screen turned away from the group. You need a place to swap blocks secretly.
  *   **Scoreboard:** Whiteboard or large sheet of paper.
  *   **Tokens:** 20 poker chips or coins per team (for betting/scoring).
  *   **Timer:** Phone or visible clock.

  ## 2. Setup & Rules (5 Minutes)
  **Do not explain metaphysics.** Do not mention "persistence conditions" or "constitution." Just give them their jobs.

  1.  **Split the Room:** 5 students on **Team Statue**, 5 on **Team Clay**.
  2.  **The Object:** Together, build one object in the center of the table.
      *   **Constraint:** The 3 Red Blocks must be buried inside (the Core). The rest surround them (the Clay).
      *   **Shape:** Make it recognizable (e.g., a tower, a dog, a pyramid).
  3.  **Team Mandates (Hand these out on cards or read aloud):**
      *   **Team Statue:** You care about the **Core** and the **Shape**.
          *   *Win Condition:* You gain points if you correctly identify whether the *Statue* survives.
          *   *Loss Condition:* You lose points if you claim the Statue survives after the **Core** changes.
      *   **Team Clay:** You care about the **Blocks**.
          *   *Win Condition:* You gain points if you correctly identify whether the *Clay* survives.
          *   *Loss Condition:* You lose points if you claim the Clay identity broke when the **material continuity** wasn't fully severed (i.e., if blocks were swapped gradually, the Clay survives).
  4.  **The Facilitator (You):** You are the Universe. You hold the truth about the Core.

  ## 3. The Rounds (35 Minutes)
  Run 5 Rounds (7 mins each).

  **The Loop:**
  1.  **Modification (2 mins):** You (or a designated neutral student) swap out 3–5 outer blocks for new colors. Change the shape slightly but keep it recognizable.
  2.  **Deliberation (2 mins):** Teams huddle. They must vote: **"Same Object"** or **"New Object."**
      *   Team Statue votes on the *Statue*.
      *   Team Clay votes on the *Clay*.
  3.  **The Reveal & Score (3 mins):**
      *   Ask Team Clay: "Did the Clay survive?" (Correct answer is always **YES** unless you remove *everything* at once, which you won't). If they say "New," they lose 2 tokens.
      *   Ask Team Statue: "Did the Statue survive?"
      *   **The Twist:** In **Round 3**, while everyone is distracted (ask them to write down their reasoning), go behind the screen/box. **Swap one of the 3 Red Core blocks** for a different red block (or identical, but mark the bottom with a pen beforehand so you know).
      *   **Scoring:**
          *   If Core was **NOT** swapped: Statue gets points for saying "Same."
          *   If Core **WAS** swapped (Round 3): Statue loses points if they say "Same."
          *   Clay gets points for always saying "Same" (gradual replacement).

  **Facilitator Note:** Keep the energy high. Press them on *why*. "You swapped 40% of the blocks, Team Clay. How is that the same stuff?" "Team Statue, the shape looks identical. Why are you worried?"

  ## 4. The Debrief (15 Minutes)
  Now you name the problem. Gather them in a circle.

  **Step 1: The Clash**
  Ask: "In Round 3, did the object survive?"
  *   Team Clay will likely say yes (matter continuity).
  *   Team Statue might say no (if they caught the core swap) or yes (if they didn't).
  *   **The Reveal:** Tell them about the secret Core swap.
  *   **The Point:** "You just felt the **Constitution Problem**. Two things (Statue and Clay) seem to occupy the same space, but they have different rules for surviving change."

  **Step 2: Mapping the Metaphysics**
  Draw two circles on the board overlapping.
  *   **Team Clay = Material Constitution.** Identity is tied to the stuff. If the stuff flows gradually (Ship of Theseus), the object survives.
  *   **Team Statue = Form/Functional Essentialism.** Identity is tied to the structure or the 'heart' of the thing. Change the core, kill the object.
  *   **Co-location:** "At the start, the Statue and the Clay were in the same place. But if I crush the object, the Clay survives, the Statue dies. So they can't be the exact same thing. But how can two things be in one place?"

  **Step 3: The Scoring Logic**
  Explain that their scoring penalties mirrored philosophical consistency.
  *   Statue team penalized for ignoring essential properties (the Core).
  *   Clay team penalized for ignoring material continuity (claiming identity broke during gradual swap).

  ## 5. Honest Note: What This Game Can't Do
  Be upfront with them (and this is good for your feature):

  1.  **Modal Arguments:** The game happens in *this* world. Philosophy often asks, "Could this statue have been made of ice?" You can't physically swap blocks for "possible world ice." The game locks them into actual history, not counterfactuals.
  2.  **Instantiation:** It's hard to feel "two objects in one place." Students will still intuitively think there is only *one* object they are looking at. The game forces them to *talk* like there are two, but their eyes tell them there's one. That tension is real, but the game resolves it artificially via rules.
  3.  **Vagueness:** The "60% shape" rule is arbitrary. In real metaphysics, the vagueness of identity is the point. Here, you (the Facilitator) are the god who decides when the line is crossed.

  ## 6. What Will Go Wrong (Failure Modes)
  Be ready for these. They happen every time.

  1.  **The "Gotcha" Moment:** Team Statue might realize the Core swap is the only way to lose points and become hyper-paranoid, accusing you of swapping the core every round.
      *   *Fix:* Admit uncertainty. "Check the core if you want, but it costs you a token to inspect."
  2.  **Block Obsession:** Students might get bored counting blocks and miss the point.
      *   *Fix:* Keep the swaps visual and fast. Don't let them count every stud. Force them to rely on intuition.
  3.  **Team Clay Dominance:** Since the Clay rules are easier (it always survives), Team Clay might win easily and feel smug.
      *   *Fix:* In the debrief, highlight that Team Clay's view leads to weirdness (e.g., if you scatter the blocks across the room, is it still the Clay? The game didn't test that).
  4.  **The "It's Just Blocks" Pushback:** One student will say, "It's just plastic. Identity is fake."
      *   *Fix:* Accept this. That's **Eliminativism**. Write it on the board. "Great, you're an eliminativist. But you still voted 'Same' in Round 1. Why?"

  ## 7. Run-of-Show Summary (For Your Pocket)
  *   **00-05:** Build & Rules. No theory.
  *   **05-40:** 5 Rounds of Swap/Vote/Score. (Secret Core Swap in Round 3).
  *   **40-55:** Debrief. Name the concepts (Constitution, Co-location).
  *   **55-60:** Limitations & Cleanup.

  **Final Tip:** Don't be a neutral referee. Be the Universe. When they argue, say "The Universe says the Core changed." It keeps the metaphysics external to them, letting them feel the friction of the rules against their intuition.
