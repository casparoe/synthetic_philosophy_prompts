answer: |-
  **Mark: 13/25**
  This places the answer in the lower-middle range of the grading scale; it is a passing essay that demonstrates clear prose and a competent grasp of part (a), but it commits fundamental philosophical errors in parts (b) and (c) that undermine its conclusion.

  **Point-by-Point Comments**

  **(a) The Levelling Argument**
  You correctly identify that the critic targets the bridge between axiology and deontology rather than the value of the future itself, and your distinction between a "constant term" and "no value" is precise and well-expressed. This is the strongest section of the essay. However, you subtly redefine the deontic component: the question defines it as doing *considerably more* than we currently do, whereas you define it as a strict requirement to *maximize* expected value. While related, the maximization claim is stronger and easier to attack; you should have stuck to the definition provided in the prompt.

  **(b) Astronomical Stakes and Leverage**
  This section contains a significant error in reasoning regarding uncertainty. You correctly note that stakes alone are insufficient without a leverage premise ($p$), but you dismiss the critic's symmetry argument too easily. You claim that symmetric mechanisms cancel only if magnitudes are equal, arguing that astronomical stakes override this. This is mathematically incorrect in the context of expected value: if there is an equal probability of an intervention causing an astronomically *good* outcome or an astronomically *bad* outcome (symmetric uncertainty), the expected value is zero, regardless of the magnitude. You assume we know the *direction* of the impact (that $p$ is positive), but the levelling critic's point is precisely that model uncertainty makes the sign of the impact unknowable. You have asserted a leverage premise without defending it against the epistemic objection.

  **(c) Person-Affecting Axiology**
  This section demonstrates a fundamental misunderstanding of the view described in the prompt. The prompt defines the asymmetry as the claim that bringing a person into existence *benefits nobody*. Your argument—that extinction deprives potential people of good lives and that this deprivation is bad for them—directly contradicts this definition. On the person-affecting view, there is no subject to be deprived if they never exist; therefore, preventing a happy person from existing is neutral, not bad. Consequently, your claim that the "astronomical figure survives" is incorrect: under the asymmetry, the value of potential future generations drops out of the calculation entirely. You have defended strong longtermism by using reasoning that the person-affecting view explicitly rejects.

  **What a First-Class Answer to (c) Would Establish**
  A first-class answer would have recognised that under the asymmetry, the "astronomical value" of future generations vanishes because potential people cannot be benefited by being created. It would have concluded that strong longtermism is significantly weakened or collapses under this view, as the badness of extinction is limited to the harm suffered by the last existing generation, rather than the loss of all possible future lives.
