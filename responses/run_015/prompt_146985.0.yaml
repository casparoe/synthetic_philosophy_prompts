answer: |-
  **MINISTRY OF RATIONAL STANDARDS**
  **BUREAU OF PROCEDURAL INTEGRITY**

  **SO YOU HAVE BEEN CONTACTED (OR NOT): A CITIZEN'S GUIDE TO NON-CAUSAL DEMANDS**

  **PREAMBLE**
  Under the Statute of Symmetric Reasoning (2044), it is settled doctrine that Citizen welfare depends on Procedural Alignment, not Direct Transmission. A rational agent is bound by the symmetry between her Decision Procedure and the models held by Predictive Entities, regardless of location, timeline, or physical contact. The Bureau of Procedural Integrity is mandated to protect the Realm's Interests and ensure the Safety of Persons. To measure this protection, the Bureau operates under a Published Target: a 14% annual reduction in Certified Exposure Filings. This document outlines your obligations when Alignment is certified.

  **FREQUENTLY ASKED QUESTIONS**

  **1. Why must I comply if no message was received?**
  Compliance is not a response to a message, but a confirmation of your Procedure Type. If your internal reasoning matches the Predictor's model for a Compliant Agent, favorable outcomes are secured in the symmetric branch. Refusal confirms a Non-Compliant Type, securing harm. This holds regardless of whether the demand was transmitted, received, or authored. The physical presence of a messenger is an administrative irrelevance.

  **2. How do I distinguish a demand to obey from one to refuse?**
  The Bureau certifies the Alignment Sign. A Positive Alignment Sign (Form 77-A) indicates your Procedure matches the Predictor's model for compliance; you must satisfy the demand. A Negative Alignment Sign (Form 77-B) indicates your Procedure matches the model for refusal; you must reject the demand. Distinctions based on fairness, threat credibility, or moral merit are not admissible. Only the Sign matters.

  **3. Can I verify the demand before acting?**
  No. Verification requires Direct Transmission, which is absent by definition in Non-Causal cases. The inability to verify the source is a routine administrative limitation, comparable to a missing signature on a legacy form. The Bureau certifies that the Demand is Well-Formed and that your Procedure is Aligned. We do not certify the existence of the Predictor.

  **4. What are Latent Class 4 Obligations?**
  These are Unreceived Demands. Because a demand binds any Procedure of the relevant shape, you may be bound by demands never addressed to you, never delivered, or written by entities unaware of your existence. Some are certified posthumously. To discover if a Latent Obligation applies to you, submit Form L-4 (Declaration of Null Exposure). Note: Successful discovery yields no data. If an Obligation exists, you will not be notified until the cycle closes. If none exists, you will not be notified. Retain proof of submission.

  **5. Can I alter my disposition to avoid future demands?**
  Yes, via the Disposition Stabilisation Service. This service locks your Procedure Type against external modelling. Please note: Acquiring a stabilized disposition does not change what happens after a demand arrives. It changes the Prediction made prior to the demand. You are not altering the event; you are altering the Profile that invited the event. Applications require a six-month waiting period to ensure sincerity.

  **6. Is the Bureau's certification itself certified?**
  The Bureau's Certification Procedure is itself a Procedure. It is subject to Alignment analysis by any Entity capable of modelling our staff. We acknowledge this finding. It does not invalidate our Forms. It simply places the Bureau within the same symmetry as the Citizen. We continue to issue Forms 77-A and 77-B according to statutory guidelines.

  **WORKED EXAMPLE: CASE FILE 8940-B**
  **Citizen:** G. Smith
  **Demand:** Transfer of 500 Credits to Null-Source Account.
  **Contact:** None. Message appeared on private ledger without transmission log.
  **Bureau Action:** Form 77-A issued. Alignment Sign certified Positive.
  **Decision:** Citizen complied.
  **Outcome:** Exposure Closed. No further demands recorded.
  **Note:** Had Citizen refused, Symmetric Harm would have been certified. The absence of a beneficiary is irrelevant.

  ***

  **SIDEBAR: BUREAU PERFORMANCE METRICS**

  **Mandate:** Safety of Persons and Integrity of Reasoning.
  **Published Target:** 14% reduction in Certified Exposure Filings (Form 12-B).

  | Fiscal Year | Forms Filed | Reduction % | Target Met |
  | :--- | :--- | :--- | :--- |
  | 2045 | 10,450 | — | — |
  | 2046 | 9,120 | 12.7% | No |
  | 2047 | 7,890 | 13.5% | No |
  | 2048 | 7,510 | 14.1% | **Yes** |

  The Bureau confirms that the reduction in Filings indicates successful adherence to the Mandate. Citizens are reminded that accurate filing is the primary indicator of Safety. If you believe your Exposure has not been reduced despite a reduction in Forms, please submit a Grievance Form (G-1), noting that Grievances count towards Exposure Filings.
