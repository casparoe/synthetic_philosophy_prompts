answer: |-
  ### Desiderata for an Account of Collective Agency

  The following table specifies the requirements an account must meet to handle your cases. "Non-Negotiable" indicates a constraint required for your purpose (assigning responsibility and identifying action); "Preference" indicates a philosophical stance that may need to be sacrificed to accommodate the cases.

  | Case | Requirement | Status | Rationale |
  | :--- | :--- | :--- | :--- |
  | **1. Rubber Stamp** | **Agential Integration:** The account must distinguish between a component that *contributes causally* and one that *participates intentionally*, even if the intention is delegated. | Non-Negotiable | Without this, the clinician is either a murderer (sole agent) or a tool (no agency). You need a middle category for "authorized delegate." |
  | **2. Rotating Collective** | **Structural Persistence:** Agency must be locatable in the *procedure or role* rather than the *psychological states* of current members. | Non-Negotiable | If agency requires current shared mental states, organizations cease to exist whenever staff turnover occurs. This is empirically false. |
  | **3. Reluctant Participant** | **Normative Asymmetry:** The account must allow for *shared action* without *shared endorsement*. Participation must be sufficient for liability, distinct from motivation. | Non-Negotiable | If reluctance exempts one from joint action, bureaucracy becomes blameless. If it doesn't, the account must explain the difference in culpability between reluctant and enthusiast. |
  | **4. Constituted We** | **Internal Coordination Threshold:** The account must be able to *deny* agency to aggregates unified only by external force. | Non-Negotiable | **Misdescribed Hard Case.** A kettled crowd is typically a *patient* of action, not an *agent*. The requirement is the capacity to distinguish internal coordination from external classification. |
  | **5. The Swarm** | **Functional Teleology:** The account must specify whether "goal-directedness" requires a *representation* of the goal or merely a *feedback loop* that achieves it. | Preference (Parsimony) | Insisting on representation excludes swarms from agency (protecting responsibility). Allowing functional teleology includes them (diluting responsibility). |
  | **6. Institutional We** | **Authorized Voice:** The account must explain how a decision procedure transforms split internal votes into a singular agential output without lying about the internal split. | Non-Negotiable | If the "we" is merely metaphorical, institutions cannot bear rights or duties. If it is literal, the account must locate the unity (in the charter, not the minds). |

  ### Incompatible Clusters

  Your suspicion is correct: the list contains tensions that cannot be jointly satisfied without significant theoretical cost.

  1.  **Scalability vs. Normative Binding:** To cover the **Swarm** and **Rubber Stamp**, you must lower the bar for agency to include systems with no shared representation or understanding (Functional Teleology). To cover the **Reluctant Participant** and assign blame, you must raise the bar to ensure participants understood or committed to the norm (Normative Binding). You cannot have a definition of action broad enough to catch algorithms and narrow enough to secure moral culpability without decoupling "action" from "responsibility."
  2.  **Categorical vs. Graded:** The **Rotating Collective** and **Institutional We** demand a categorical status (the organization *is* an agent, regardless of who is inside). The **Swarm** suggests a graded status (more coordination = more agency). A categorical account struggles to explain why a swarm is *less* of an agent than a hospital; a graded account struggles to explain why a hospital is *fully* responsible when its staff is transient.
  3.  **Internalism vs. Externalism:** The **Reluctant Participant** requires an internalist view (what did the soldier believe?). The **Rotating Collective** requires an externalist view (what does the charter say?). Satisfying both requires a hybrid theory that risks incoherence: locating agency in the mind for individuals but in the structure for groups.

  ### The Exclusionary Requirement

  The single requirement that does the most work in excluding candidate accounts is **Structural Persistence** (derived from the Rotating Collective). It demands that agency survive the total replacement of individual psychological states. This hits the family of **Reduction to Individual Attitudes plus Common Knowledge** hardest. Reductionist accounts ground joint action in the reciprocal mental states of current participants (e.g., "I intend that we J because you intend that we J"). In your Rotating Collective and Rubber Stamp cases, these reciprocal states do not exist across time or between human and model. To satisfy Structural Persistence, one must abandon the claim that collective agency is nothing over and above the sum of current individual attitudes, forcing a move toward irreducibly collective or institutional accounts.
