prompt: |-
  I write a column on science and ideas, and I am midway through a piece on collective agency beyond the human case: automated benefits systems that deny claims, hospital triage pipelines, multi-agent software that divides a task among itself, large scientific collaborations whose papers carry thousands of names, trading desks where the models and the humans each do part of the work. Every philosophical account of joint action I have come across seems calibrated for dyads with a shared plan — two people painting a house, lifting a table, going for a walk together — and then goes quiet about the cases my reporting actually turns up. So I want the specification rather than another tour of the theories.

  Give me the desiderata: what an account of shared or joint action has to deliver, for my purposes, to count as adequate. The purpose is this — I want to be able to say, defensibly, when an organization, a crowd, a market, or a sociotechnical system acts, and when it merely produces an outcome that no one intended, and I want to know who is on the hook when it acts badly. Build the list around the cases, and give the consideration behind each requirement.

  Here are the cases from my own reporting that I want handled; tell me which of them generate distinct requirements and which I have misdescribed as hard.

  One: the rubber stamp. A clinician is legally required to sign off on a model's triage recommendations, a couple of hundred a shift, and forms no view about any individual case. If the hospital's decisions are joint actions, who is acting with whom?

  Two: the rotating collective. A volunteer moderation or maintenance group whose membership turns over almost completely within a month, none of whose members has met another, and no one of whom has any representation of the whole activity, yet which maintains a stable policy over years.

  Three: the reluctant participant. A junior soldier, or a low-level official, who executes her part of a policy she believes to be wrong. Does doing one's part under authority count as sharing the intention, and what does the account say about the difference between her and the enthusiast one desk over?

  Four: the constituted we. A crowd that becomes coordinated only once the police kettle it — a collective whose unity seems to be supplied by the treatment it receives from outside rather than by anything the participants intended or agreed to.

  Five: the swarm. Coordinating units — delivery drones, bidding algorithms — that interact by local rules with no representation of any joint goal. Is there a threshold at which this stops being a mere aggregate, and on what does the threshold depend?

  Six: the institutional first-person plural. A committee or court speaks in the we form and issues a conclusion while internally split. What has to be true for that we to be more than a stylistic convention, and who believes what when it is used?

  Mark each requirement as non-negotiable or as a preference of a particular camp — parsimony, reducibility to individual attitudes, refusal of group minds, the insistence that joint action requires communication or mutual responsiveness, the demand for a categorical rather than a scalar notion — and say why you classify it where you do. I would also like you to flag the pairs or clusters of requirements that cannot be jointly satisfied: my suspicion is that the pressure to cover the swarm and the rubber stamp (apparent agency with no shared representation anywhere in the system) pulls against the pressure to explain the normative binding between participants, and that a graded account and a categorical one cannot both be had. That part is what I most want to see, since if the list is internally unsatisfiable that is itself the finding.

  Finally, name the single requirement that does the most work in excluding candidate accounts, and tell me in one short closing paragraph which of the three broad families — reduction to individual attitudes plus common knowledge, an irreducibly collective we-mode, and views that put obligation or joint commitment first — is hit hardest by it. Keep that to a paragraph; the criteria are what I am paying for. A table is fine. No citations or reading list — I can find the literature myself. What I cannot work out from the outside is which of the things these theories are asked to do is a genuine constraint and which is a tribal preference dressed up as one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A columnist writing on science and ideas, specifically collective agency beyond human dyads (automated systems, hospitals, multi-agent software, large collaborations, trading desks).
      *   **Problem:** Existing philosophical accounts of joint action focus on dyads/shared plans (painting a house, lifting a table) and fail to address the complex, scalable, often non-human-in-the-loop cases the user encounters.
      *   **Task:** Provide a list of *desiderata* (requirements) for an adequate account of shared/joint action tailored to these specific cases.
      *   **Goal:** Enable the user to distinguish between mere outcomes and genuine collective action, and to assign responsibility ("who is on the hook").
      *   **Specific Cases to Address:**
          1.  The Rubber Stamp (clinician + model).
          2.  The Rotating Collective (volunteers, high turnover, no shared view).
          3.  The Reluctant Participant (junior soldier/official, coerced/dutiful).
          4.  The Constituted We (crowd kettled by police, unity from outside).
          5.  The Swarm (algorithms/drones, local rules, no joint goal representation).
          6.  The Institutional First-Person Plural (committee/court, internally split, speaks as "we").
      *   **Constraints & Formatting:**
          *   Build the list around the cases.
          *   Identify which cases generate distinct requirements vs. misdescribed difficulties.
          *   Mark requirements as *Non-Negotiable* or *Preference of a Particular Camp* (with justification).
          *   Flag incompatible pairs/clusters of requirements (trade-offs).
          *   Name the single requirement that does the most work in excluding candidate accounts.
          *   Identify which of the three broad families (Reductionism, We-Mode, Obligation/Commitment) is hit hardest by that single requirement.
          *   Closing paragraph limit: One short paragraph.
          *   No citations/reading list.
          *   Table format is acceptable.
          *   Tone: Analytical, precise, philosophical but grounded in reporting needs.

  2.  **Deconstruct the Cases & Derive Desiderata:**

      *   *Case 1: Rubber Stamp.* Human + Algorithm. Human signs but doesn't think.
          *   *Issue:* Intentionality vs. Causal Contribution.
          *   *Requirement:* Must distinguish between *causal necessity* and *agential contribution*. If the human is just a biometric key, are they an agent?
          *   *Desideratum:* **Agential Integration.** The account must specify when a component (human or machine) counts as a participant versus a tool.

      *   *Case 2: Rotating Collective.* High turnover, no shared mental state, stable output.
          *   *Issue:* Continuity of Agency without Continuity of Mind.
          *   *Requirement:* Agency must reside in the *structure/process*, not just the current mental states of members.
          *   *Desideratum:* **Structural Persistence.** The account must allow agency to survive total replacement of individual participants.

      *   *Case 3: Reluctant Participant.* Coerced/dutiful participation vs. enthusiastic.
          *   *Issue:* Normative Binding vs. Psychological Alignment.
          *   *Requirement:* Must distinguish between *doing one's part* and *endorsing the goal*. Responsibility shouldn't vanish due to reluctance, but the nature of participation changes.
          *   *Desideratum:* **Normative Asymmetry.** The account must differentiate the responsibility of the reluctant from the enthusiast without denying the former's agency.

      *   *Case 4: Constituted We.* Crowd unified by external force (police kettle).
          *   *Issue:* Internal Intent vs. External Attribution.
          *   *Requirement:* Can a group act if the unity is imposed? Usually, joint action requires *some* internal coordination. This case might be a "misdescribed hard case" (it's likely *not* joint action, but treated as such by outsiders).
          *   *Desideratum:* **Internal Coordination Threshold.** There must be a minimum of internal responsiveness to count as action, not just reaction.

      *   *Case 5: The Swarm.* Algorithms, local rules, no global representation.
          *   *Issue:* Representation vs. Emergence.
          *   *Requirement:* Does joint action require a "we-representation"? If not, what stops a market crash from being an "action"?
          *   *Desideratum:* **Goal Representation vs. Functional Teleology.** The account must decide if "acting for a goal" requires someone (or some sub-system) to represent that goal.

      *   *Case 6: Institutional We.* Split committee speaking as one.
          *   *Issue:* Aggregation vs. Unification.
          *   *Requirement:* How can a split group issue a unified verdict?
          *   *Desideratum:* **Authorized Voice.** The account must explain how a decision procedure transforms split votes into a singular agential output.

  3.  **Synthesize and Refine Desiderata (The "List"):**

      *   *Requirement 1: The Tool/Agent Boundary (from Rubber Stamp & Swarm).* Non-negotiable for responsibility. If everything is an agent, no one is responsible. If nothing is, systems are blameless.
      *   *Requirement 2: Structural Continuity (from Rotating Collective).* Non-negotiable for organizational identity.
      *   *Requirement 3: The Reluctance Condition (from Reluctant Participant).* Non-negotiable for moral/legal accountability.
      *   *Requirement 4: The Representation Threshold (from Swarm & Institutional We).* This is the friction point. Does agency require *representing* the jointness?
      *   *Requirement 5: The Internal/External Boundary (from Constituted We).* This is likely a "misdescribed hard case." A kettled crowd is usually an *object* of action, not a *subject*. I should flag this.

  4.  **Identify Trade-offs (Incompatible Clusters):**

      *   *Tension 1:* **Scalability vs. Normative Binding.** To cover the *Swarm* and *Rubber Stamp*, you need a low bar for agency (functional contribution). To cover *Reluctant Participant* and *Responsibility*, you need a high bar (commitment/awareness). You can't have both a low bar for "who is acting" and a high bar for "who is to blame" without a complex disambiguation.
      *   *Tension 2:* **Categorical vs. Graded.** Is it joint action or not? Or is it a spectrum? *Swarm* suggests graded (more coordination = more agency). *Responsibility* suggests categorical (guilty or not).
      *   *Tension 3:* **Internalism vs. Externalism.** *Rotating Collective* requires external/structural focus. *Reluctant Participant* requires internal/psychological focus.

  5.  **Determine the "Single Requirement" and "Hardest Hit Family":**

      *   *Single Requirement:* **The Representation Threshold.** (Does the system need to represent its own unity to act?)
      *   *Why:* It kills the reductionist accounts (which need individual representation) and the pure functionalist accounts (which can't explain responsibility).
      *   *Hardest Hit:* **Reduction to Individual Attitudes.** Why? Because the *Rotating Collective* and *Rubber Stamp* cases explicitly lack shared individual attitudes among the current participants. No single human holds the plan. Reductionism fails here.

  6.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Professional, direct, analytical. Avoid academic fluff.
      *   *Formatting:* Use a table for the desiderata as suggested. Use clear headings for the trade-offs.
      *   *Check Constraints:* No citations. One paragraph closing. Mark Non-negotiable vs. Preference. Flag misdescribed cases.

      *(Self-Correction during drafting)*: I need to be careful with Case 4 (Constituted We). The prompt asks me to tell them which they have misdescribed as hard. A kettled crowd is classically *not* a joint agent in philosophy. It's a aggregate acted *upon*. I should flag this as a category error in the analysis, but derive a requirement about "External Attribution vs. Internal Agency" from it.
      *Actually, looking closer:* The user wants to know when an organization/crowd *acts*. If the crowd is kettled, do *they* act? No. So the requirement is the ability to *deny* agency in this case. The desideratum is "Discrimination against mere aggregates."

      *Refining the "Single Requirement":* The prompt asks for the one that excludes candidate accounts. The "Structural Persistence" requirement (Case 2) is the real killer for standard dyadic theories. But the "Representation Threshold" (Case 5) is the killer for *responsibility*. Let's go with **The Attribution/Responsibility Link.** An account must link the criteria for *calling* it action to the criteria for *blaming* it. If you lower the bar to include Swarms, you dilute blame. If you raise it to secure blame, you exclude Swarms.
      *Wait, the prompt asks:* "Name the single requirement that does the most work in excluding candidate accounts."
      *Decision:* **Structural Persistence (Case 2).** Most theories require *current* shared intention. The Rotating Collective breaks this. It forces you to accept institutional agency over individual mental states.
      *Hardest Hit:* **Reduction to Individual Attitudes.** (Because there are no shared attitudes across time).

      *Re-evaluating the Trade-offs:* The prompt specifically suspects the pressure between *Swarm/Rubber Stamp* (apparent agency, no representation) vs *Normative Binding*. I should confirm this suspicion in the "Incompatible Clusters" section.

  7.  **Final Polish:** Check the closing paragraph constraint strictly. Ensure the table is clear. Ensure the distinction between Non-Negotiable and Preference is clear.

      *Plan:*
      1.  Introduction acknowledging the gap.
      2.  Table of Desiderata (Case, Requirement, Status, Rationale).
      3.  Analysis of Misdescribed Cases (Case 4).
      4.  Incompatible Clusters (The Trade-offs).
      5.  The Single Requirement & Hardest Hit Family (Closing Paragraph).

      *Wait, one detail:* "Mark each requirement as non-negotiable or as a preference of a particular camp." I need to be explicit about this in the table.
      *Also:* "Tell me which of them generate distinct requirements and which I have misdescribed as hard." I need to address Case 4 specifically as potentially misdescribed.

      *Let's refine the "Single Requirement".* If I choose Structural Persistence, it hits Reductionism hard. If I choose the Normative Binding, it hits Functionalism hard. The prompt asks what excludes *candidate accounts*. Most existing accounts are Reductionist or We-Mode. Structural Persistence kills Reductionism. Normative Binding kills Functionalism. Given the user's focus on *responsibility* ("who is on the hook"), the **Normative Binding** requirement is the most critical filter. However, the *Rotating Collective* is the most empirically challenging for standard theory. Let's stick with **Structural Persistence** as the exclusionary criterion for *theories of action*, because if a theory can't handle the Rotating Collective, it can't handle the user's reporting.
      *Actually, looking at the three families:* Reductionism, We-Mode, Obligation/Commitment.
      Reductionism fails Rotating Collective (no shared mind).
      We-Mode fails Rubber Stamp (no human we-intention).
      Obligation fails Swarm (no commitment).
      Which requirement kills the *most* accounts? **The Representation Threshold (Case 5 & 1).** If you demand representation, Swarms and Rubber Stamps aren't agents. If you don't, you can't assign blame.
      *Better choice:* **The Responsibility Link.** An account must explain why identifying an agent makes them blameworthy.
      *Let's go with the prompt's hint:* "pressure to cover the swarm and the rubber stamp... pulls against the pressure to explain the normative binding."
      *Okay, I will frame the "Single Requirement" as the demand that **Agency Criteria must match Responsibility Criteria.** This is the killer.*
      *Which family is hit hardest?* **Reduction to Individual Attitudes.** Because in the Rubber Stamp and Rotating Collective, the individual attitudes are absent or misaligned, yet we still want to hold the *system* responsible. Reductionism cannot bridge that gap without fiction.

      *Wait, I need to check the "Misdescribed" instruction again.* "Tell me which of them generate distinct requirements and which I have misdescribed as hard."
      Case 4 (Constituted We/Kettle) is the likely misdescription. A kettled crowd is typically a *patient*, not an *agent*. The requirement derived is the ability to *deny* agency here.

      *Final check on Closing Paragraph:* "Keep that to a paragraph... A table is fine. No citations... Name the single requirement... tell me... which of the three broad families... is hit hardest by it."

