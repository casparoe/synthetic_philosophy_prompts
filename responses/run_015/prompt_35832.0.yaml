prompt: |-
  I teach an upper-level undergraduate seminar on democratic theory, and next week I have one 75-minute session with 18 students on the Condorcet jury theorem. Some context: I have just come out of a very long argument with a close friend — a mathematician — who maintains that the theorem is a simple, unconditional result: if each voter is even slightly more likely to be right than wrong, then sufficiently large majorities are essentially infallible, and everything else is noise. I kept replying that the premises do all the work — competence strictly above one half, independence of errors, a binary choice with an objective fact of the matter — and that the theorem says nothing about experts, wisdom, or value disagreements; but I never got him to feel it. I want my students to feel it, in the room, before we read the formal statement.

  Design the session as a game they play rather than a lecture they receive. My sense is that it needs at least three phases: one in which each student's individual accuracy is engineered to sit just above chance on binary questions with verifiable answers, so the class can watch majority accuracy climb as the electorate is enlarged (perhaps by having students generate independent "clone" voters whose answers are drawn from their own error rates); one in which individual accuracy is unchanged but the errors are correlated — questions built on a misconception the whole room happens to share — so that the majority is confident and wrong; and one in which accuracy sits just below chance, so that adding voters actively drives the majority away from the truth. But I am open to a better structure if you see one.

  Please provide: concrete rules and materials, including how to make individual accuracy tuneable without the students realizing it is being tuned; a payoff scheme that involves no real money; a way of recording and displaying results so the pattern is visible in real time; and a debrief that maps specific moments in the game onto the theorem's premises and onto my friend's overreach. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which features of the theorem no classroom game can reproduce — a genuinely large electorate, sincere rather than strategic voters, questions where "correct" is not contestable — so that I know where the activity ends and I have to supply the rest by talking.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Teach the Condorcet Jury Theorem (CJT) to 18 upper-level undergraduates in a 75-minute seminar.
      *   **Pedagogical Approach:** Game-based/Experiential (not lecture-first).
      *   **Instructor's Motivation:** Needs to resolve a personal intellectual conflict (vs. a mathematician friend) by making students *feel* the premises (competence > 0.5, independence, binary truth) rather than just hearing the formula. The friend thinks CJT is unconditional; the instructor knows the premises are the heavy lifters.
      *   **Proposed Structure:** Three phases (Competence > 0.5 + Independence, Correlated Errors, Competence < 0.5).
      *   **Requirements:** Concrete rules, materials, tunable accuracy (hidden), payoff scheme (no money), real-time display, debrief mapping game to theorem, troubleshooting predictions, limitations of the simulation.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Core Claim:* If $p > 0.5$ (individual competence) and votes are independent, then $P(\text{Majority Correct}) \to 1$ as $N \to \infty$.
      *   *Critical Assumptions:*
          1.  Binary choice (True/False, A/B).
          2.  Objective truth exists.
          3.  $p > 0.5$ (better than random).
          4.  Independence (errors are not correlated).
          5.  Sincere voting (no strategic manipulation).
      *   *The "Friend's" Error:* Ignoring assumptions 3 & 4. If $p < 0.5$, majority gets *worse*. If errors correlate (systematic bias), majority amplifies error.

  3.  **Designing the Game (The "Truth Tribunal"):**
      *   *Constraint:* 18 students is a small $N$ for CJT. The convergence isn't asymptotic yet. I need to simulate larger $N$ or make the effect visible with small $N$.
      *   *Solution:* Use the "Clone" method suggested by the user but refine it. Each student generates multiple votes based on a hidden probability card. Or, better yet, use a digital tool or pre-prepared envelopes to simulate the "expansion" of the electorate without needing 100 physical people.
      *   *Refined Idea:* Let's stick to the physical room for the "feel," but use a hybrid approach.
      *   *Phase 1 (Ideal CJT):* Questions where students are slightly competent. Need to ensure $p > 0.5$. How to tune without them knowing? Use questions of varying difficulty but select only those where the class average historically hovers around 60-70%. Or, give them a "reliability token" that dictates their probability of being right (too gamified?).
      *   *Better Tuning:* The instructor controls the *answer key* relative to the *question difficulty*. Actually, the easiest way to tune $p$ without students knowing is to select questions where the "common sense" answer is correct (for $p>0.5$) vs. questions where "common sense" is a trap (for correlated error) vs. questions that are counter-intuitive/guesswork (for $p<0.5$).
      *   *Wait, the prompt asks for tunable accuracy without students realizing.*
      *   *Mechanism:* "Signal Cards." Each student gets a card that tells them how to answer. No, that removes agency.
      *   *Mechanism:* "Calibration Rounds." We do practice rounds to establish confidence.
      *   *Best Mechanism for "Hidden Tuning":* The Instructor selects the questions.
          *   Phase 1: General knowledge where educated undergrads are >50% accurate (e.g., "Is the capital of Australia Sydney or Canberra?").
          *   Phase 2: Common misconceptions (e.g., "Does the Coriolis effect determine toilet flush direction?"). Everyone gets it wrong together.
          *   Phase 3: Pure noise or counter-intuitive facts (e.g., obscure trivia where guessing is <50% due to bias).
      *   *Simulating Large N:* Since we only have 18 students, we can't reach asymptotic limits. We need to *simulate* the expansion.
      *   *Idea:* Each student represents a "cluster." Or, we use a spreadsheet projected on screen. The students vote, and the spreadsheet "generates" 100 clones based on that student's track record.
      *   *Decision:* Let's keep it tangible. 18 students is enough to show the *trend* if the margin is wide enough. But to really show the "infallibility" claim, we need to simulate the $N \to \infty$ part. I will suggest a hybrid: Students vote, but the projector shows a "Simulated Electorate" of 1,000 based on the *observed* class accuracy rate. This bridges the gap between the room and the theorem.

  4.  **Developing the Three Phases:**
      *   **Phase 1: The Promise (Independence + $p > 0.5$).**
          *   Task: Visual estimation or general knowledge.
          *   Tuning: Pick questions where the distractor is plausible but the truth is accessible.
          *   Display: Live tally.
      *   **Phase 2: The Trap (Correlated Error).**
          *   Task: Questions with a shared cognitive bias.
          *   Result: High confidence, unanimous wrongness.
      *   **Phase 3: The Perverse ( $p < 0.5$ ).**
          *   Task: Questions where intuition leads astray systematically.
          *   Result: Majority gets worse as we add "clones" (simulated).

  5.  **Payoff Scheme:**
      *   No money. Use "Epistemic Credit" or "Grade Tokens."
      *   Better: "The Collective Pot." If the Majority is right, everyone gets a point toward participation. If wrong, no one does. This aligns incentives with the *theorem's* focus (collective accuracy) rather than individual glory.
      *   Refinement: To make them feel the *individual* competence, maybe individual points for being right, but a bonus if the *group* is right.
      *   *Decision:* "The Truth Dividend." Individual points for correct votes. Multiplier applied if the Majority is correct. This makes them care about both their own $p$ and the group outcome.

  6.  **Materials & Tech:**
      *   Clickers or Phones (Polling software like Mentimeter/Slido). Essential for real-time display.
      *   Projector for the "Simulated Electorate" graph.
      *   Pre-prepared Question Bank (crucial for tuning).

  7.  **Debrief Strategy:**
      *   Map Phase 1 to $p > 0.5$ + Independence.
      *   Map Phase 2 to $\text{Cov}(\text{errors}) > 0$.
      *   Map Phase 3 to $p < 0.5$.
      *   Address the Friend: The friend is right *mathematically* but wrong *politically/empirically*. The math holds; the premises fail in real democracy.

  8.  **Troubleshooting (What goes wrong):**
      *   Students colluding/talking (breaks independence).
      *   Students realizing the questions are rigged (breaks immersion).
      *   Tech failure.
      *   Phase 3 confusion (why are we trying to be wrong?).
      *   Small N problem (18 isn't enough to show convergence). *Fix: Use the simulation overlay.*

  9.  **Limitations:**
      *   Real politics isn't binary.
      *   "Truth" is often contested (normative vs. positive).
      *   Strategic voting (people lie).
      *   Competence isn't fixed.

  10. **Drafting the Plan (Iterative refinement):**
      *   *Timing:* 75 mins.
      *   Intro (10 min).
      *   Phase 1 (20 min).
      *   Phase 2 (15 min).
      *   Phase 3 (15 min).
      *   Debrief (15 min).
      *   *Wait, need more time for Debrief.* Cut Phase 3 slightly or merge into debrief logic. Let's keep Phase 3 distinct because it's counter-intuitive.
      *   *Tuning Accuracy:* How to ensure $p < 0.5$ in Phase 3? Use the "Monty Hall" effect or specific optical illusions where the majority *always* sees it wrong. Or simply tell them "For this round, assume the opposite of your intuition is correct" (Too explicit?).
      *   *Better for Phase 3:* Use a "Biased Coin" mechanic. Give them a physical token that says "You are a Biased Voter. Your signal is inverted." No, that breaks the "hidden" requirement.
      *   *Best for Phase 3:* Use questions where the "obvious" answer is demonstrably false, and the population bias is strong enough that $p_{\text{actual}} < 0.5$. Example: "Which line is longer?" (Muller-Lyer illusion). Most people get it wrong.
      *   *Simulating N:* I need a spreadsheet ready. Input: Class % Correct. Output: Probability of Majority Correct for N=18, N=100, N=1000. This visualizes the theorem without needing 1000 students.

  11. **Refining the "Friend" Argument:**
      *   The friend says "Premises are noise."
      *   The lesson must show "Premises are the *signal*."
      *   The debrief needs to explicitly name the friend's position as the "Asymptotic Fantasy."

  12. **Final Polish:**
      *   Ensure tone is appropriate for upper-level undergrads (respectful of their intelligence, not too gamified/childish).
      *   Check constraints: 18 students, 75 mins.
      *   Make sure the "hidden tuning" is feasible. (Instructor selects questions based on pre-testing or known cognitive biases).

  *(Self-Correction during drafting)*: 18 students is really small for CJT. If $p=0.55$, the probability of majority correct is only about 0.65. It won't look like "infallibility." I *must* emphasize the simulation aspect. The students vote, but the screen shows what happens if we had 10,000 voters *with the same competence rate*. This validates the math while showing the empirical fragility.

  Let's organize the response clearly: Setup, The Game (3 Rounds), The Tech/Display, The Debrief, Troubleshooting, Limitations.

  *Payoff:* "Epistemic Currency."
  *Display:* Dual graph (Actual Class Vote vs. Simulated Large Electorate).
  *Questions:* Need specific examples.
  *Phase 3:* How to get $p < 0.5$? Use the "False Consensus" questions. Or simply instruct: "In this round, nature is adversarial." No, keep it natural. Use optical illusions or counter-intuitive statistics (e.g., Simpson's Paradox examples).

  Okay, ready to write.
answer: |-
  This session design turns the Condorcet Jury Theorem (CJT) from a formula into a phenomenological experience. It validates your intuition (the premises are the heavy lifters) while acknowledging your friend's math (the convergence is real *if* the premises hold).

  **Session Title:** The Truth Tribunal
  **Time:** 75 Minutes
  **Students:** 18
  **Goal:** To viscerally demonstrate that the CJT's convergence to infallibility is entirely conditional on independence and competence ($p > 0.5$).

  ---

  ### I. Preparation & Materials

  **1. The Tech Stack**
  *   **Polling Software:** Use Mentimeter, Slido, or PollEverywhere. Students need smartphones/laptops.
  *   **The "Oracle" Spreadsheet:** A pre-prepared Excel/Google Sheet projected on the main screen.
      *   *Input Cell:* You type in the class's actual accuracy rate after each round (e.g., 0.65).
      *   *Output Graph:* A line chart showing "Probability of Majority Correct" on the Y-axis and "Electorate Size (N)" on the X-axis (from 1 to 10,000).
      *   *Function:* It calculates the binomial cumulative distribution. When you input the class's accuracy, the line shoots up (if $p > 0.5$), stays flat (if $p = 0.5$), or dives (if $p < 0.5$).
  *   **Physical Tokens:** 18 envelopes, sealed. Inside is a "Role Card." (See Phase 3).

  **2. The Payoff Scheme: "Epistemic Credit"**
  *   No money. Use a "Participation Multiplier."
  *   **Base Points:** 1 point for every correct individual vote.
  *   **The Dividend:** If the *Majority* is correct, everyone's points for that round are doubled.
  *   **The Stakes:** Tell them the top 3 scorers get a "Homework Pass" (skip one short response paper) or a tangible treat (nice coffee/ chocolates). This aligns individual incentive (be right) with collective incentive (majority be right), mirroring the theorem's focus on collective truth-tracking.

  **3. Tuning Accuracy (The Hidden Hand)**
  You cannot tell them you are tuning accuracy. You tune it by **Question Selection**.
  *   **$p > 0.5$:** General knowledge where distractors are weak.
  *   **Correlated Error:** Questions relying on a specific, shared misconception.
  *   **$p < 0.5$:** Optical illusions or counter-intuitive statistics where human intuition is systematically biased against the truth.

  ---

  ### II. The Session Flow (75 Minutes)

  #### 0:00–0:10 | Introduction & Rules
  *   **Hook:** "Today we are testing a claim: that a crowd is smarter than its smartest member. But under what conditions does the crowd become a mob?"
  *   **Rules:** Explain the "Epistemic Credit" system. Emphasize **No Talking** during voting (crucial for independence).
  *   **The Oracle:** Show the blank graph. "This line predicts the future of democracy based on your performance today."

  #### 0:10–0:30 | Phase 1: The Promise (Independence + $p > 0.5$)
  *   **Objective:** Demonstrate the theorem working as advertised.
  *   **Mechanism:** 5 Binary Questions.
  *   **Question Design:** Verifiable facts where undergraduates typically score 60–70%.
      *   *Example:* "Is the population of Canada larger than Australia?" (True)
      *   *Example:* "Did the Supreme Court case *Citizens United* occur before 2005?" (False)
  *   **Process:**
      1.  Students vote individually on phones.
      2.  Reveal correct answer.
      3.  Tally individual scores.
      4.  **Crucial Step:** Calculate the class accuracy rate (e.g., 13/18 correct = 0.72). Type `0.72` into the **Oracle Spreadsheet**.
      5.  **Visual:** The projected line skyrockets. At $N=18$, probability is high. At $N=1,000$, it touches 100%.
  *   **Narrative:** "Look at that line. This is your friend the mathematician's world. If you are slightly competent and independent, the majority becomes godlike."

  #### 0:30–0:45 | Phase 2: The Trap (Correlated Errors)
  *   **Objective:** Break the Independence assumption. Show that high confidence $\neq$ accuracy.
  *   **Mechanism:** 3 Binary Questions based on shared misconceptions.
  *   **Question Design:** Questions where the "common sense" answer is wrong.
      *   *Example:* "Does the Coriolis effect determine the direction water drains in a sink?" (Most say Yes; Truth is No).
      *   *Example:* "Are bats blind?" (Most say Yes; Truth is No).
      *   *Example:* "Is the Great Wall of China the only man-made object visible from the moon?" (Most say Yes; Truth is No).
  *   **Process:**
      1.  Students vote. They will feel confident.
      2.  Reveal answers. The class will likely score < 40%.
      3.  **Crucial Step:** Input the low accuracy (e.g., 0.35) into the Oracle.
      4.  **Visual:** The line dives. As $N$ increases, the probability of the Majority being *Correct* approaches zero.
  *   **Narrative:** "You were confident. You were independent in the sense that you didn't talk. But your *errors* were not independent. You shared a bug in your software. The theorem assumes errors cancel out; here, they compound."

  #### 0:45–0:55 | Phase 3: The Perverse ($p < 0.5$)
  *   **Objective:** Demonstrate that if $p < 0.5$, adding voters makes things *worse*.
  *   **Mechanism:** The "Adversarial Signal."
  *   **Setup:** Hand out the sealed **Role Cards** from preparation.
      *   12 Cards say: "Voter Type A: Trust your intuition."
      *   6 Cards say: "Voter Type B: Your intuition is inverted. If you think True, vote False."
      *   *Wait, this is too complex.*
      *   **Better Mechanism:** Use the **Müller-Lyer Illusion** or similar perceptual tasks.
      *   Show two lines. One is objectively longer, but the arrows make the shorter one look longer.
      *   Ask: "Which line is physically longer?"
      *   Because the illusion is robust, 80% of the class will vote for the *wrong* line ($p \approx 0.2$).
  *   **Process:**
      1.  Vote on 3 optical illusions.
      2.  Reveal truth (measure on screen).
      3.  Input accuracy (e.g., 0.25) into the Oracle.
      4.  **Visual:** The graph shows that a single voter has a 25% chance of being right. A majority of 1,000 voters has a 0.00% chance of being right.
  *   **Narrative:** "If you are systematically worse than a coin flip, democracy does not average out the error. It amplifies the stupidity. The only rational strategy here is to follow the minority."

  #### 0:55–1:15 | Debrief: Mapping the Game to the Theorem
  *   **The Friend's Claim:** Write on the board: *"If $p > 0.5$, Majority $\to$ Infallible."*
      *   Ask: "Was my friend wrong?"
      *   Answer: "Mathematically, no. Look at Phase 1. The Oracle didn't lie."
  *   **The Instructor's Claim:** Write on the board: *"The Premises Are The Politics."*
      *   **Competence ($p > 0.5$):** In Phase 3, we saw that 'competence' isn't a fixed human trait; it's a relationship between the voter and the question. In politics, do we know which questions are Phase 1 (facts) and which are Phase 3 (ideological illusions)?
      *   **Independence:** In Phase 2, you didn't talk, yet you failed. Why? Because you read the same news, went to the same schools, share the same culture. **Common information sources create correlated errors.** This is the death of CJT in the age of media ecosystems.
      *   **Binary Truth:** Note that all questions today had objective answers. Politics is often about *values*, not facts. CJT cannot aggregate preferences, only truths.
  *   **Closing Thought:** "The Condorcet Jury Theorem is not an argument for democracy. It is a checklist for when democracy might work. Your job as theorists is to check the list."

  ---

  ### III. Troubleshooting: What Will Go Wrong

  **1. The "Small N" Problem**
  *   **Risk:** With 18 students, even in Phase 1, the majority might lose a round due to variance. It undermines the "infallibility" narrative.
  *   **Fix:** The **Oracle Spreadsheet** is your safety net. Even if the class majority loses one round, the *simulated* line shows the theoretical trajectory. Explicitly say: "18 is too small to see the asymptote. The Oracle shows you where this leads if the rate holds."

  **2. Students Colluding**
  *   **Risk:** Students glance at neighbors' screens, breaking independence.
  *   **Fix:** Enforce a "Heads Down" rule during the 10-second voting window. If you see glancing, invalidate the round and call it a "Violation of Independence Assumption"—turn it into a teaching moment.

  **3. Phase 3 Confusion**
  *   **Risk:** Students feel cheated by optical illusions ("That's not a political question!").
  *   **Fix:** Frame it carefully. "Democracy often asks us to judge complex causal chains (e.g., 'Will this tax cut grow the economy?') which are effectively illusions. We are testing cognitive competence, not just trivia."

  **4. The "Expert" Objection**
  *   **Risk:** A student argues, "We should just let experts vote."
  *   **Fix:** Save this for the debrief. "CJT assumes equal competence. If we weight votes by expertise, it's no longer CJT, it's epistocracy. That's a different seminar."

  ---

  ### IV. Limitations: Where the Game Ends

  Be honest with your students (and yourself) about what the game cannot simulate. This is where you must supply the rest by talking.

  1.  **Endogeneity of Competence:** In the game, $p$ was fixed by you. In reality, $p$ changes. Deliberation might raise $p$ (learning), but polarization might lower it (entrenchment). The theorem treats competence as a parameter; in reality, it's a variable.
  2.  **Strategic Voting:** In the game, payoffs encouraged sincerity. In real elections, voters vote strategically (lesser of two evils) or expressively (signaling identity). CJT collapses if voters lie about their signal.
  3.  **The "Fact of the Matter":** The game relied on verifiable truths (Capital of Australia, line length). Most political questions are normative ("Is inequality unjust?"). CJT has *nothing* to say about aggregating values, only facts. If the "truth" is contested, the theorem is inert.
  4.  **Common Causes:** The game simulated correlated error via misconceptions. In reality, correlated error comes from *structure* (media monopolies, gerrymandering, algorithmic feeds). The game shows *that* it happens; political theory must explain *why*.

  ### V. Why This Resolves Your Argument

  This session design allows you to tell your mathematician friend:
  *"You are right about the limit, but you are wrong about the world. The game shows the students that the 'noise' I talked about isn't random variance; it's systematic bias (Phase 2) and structural incompetence (Phase 3). The math works only in Phase 1. Since we cannot guarantee we are in Phase 1, the theorem is a conditional hope, not an unconditional law."*

  The students will leave not remembering the binomial formula, but remembering the feeling of the **Oracle Graph diving** when they were confidently wrong. That feeling is the theoretical insight.
