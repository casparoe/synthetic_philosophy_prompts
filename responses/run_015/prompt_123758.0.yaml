  Subject: Re: That coffee you owe me + the Whorf/PP prompt draft

  Hey,

  Yeah, I'm still waiting on that flat white. Consider this exam package partial payment.

  I whipped up the Sapir-Whorf prompt you asked for. I tried to steer it away from the usual "does language affect color perception?" undergrad stuff and forced them into the predictive processing framework like you wanted. The goal is to see if they can actually mechanize relativity rather than just asserting it.

  I've included the prompt, a model answer (aimed at ~800 words so you can gauge the density), and the marking scheme. I made sure the rubric penalizes buzzword-dropping heavily—they need to explain *how* the error minimization works, not just say "priors."

  Let me know if this hits the mark before you send it off to the department.

  Best,

  ***

  ### Exam Prompt (Question 1)

  **Topic:** Linguistic Relativity and Predictive Processing
  **Time Allowed:** 90 Minutes
  **Marks:** 25

  **Prompt:**
  Standard objections to strong linguistic determinism (e.g., translatability, bilingualism, universal conceptual structure) often assume a modular separation between language and thought. However, within a hierarchical predictive processing framework, grammatical categories may function as high-level priors that shape the precision-weighting of prediction errors during perception.

  Evaluate the claim that this predictive-processing framework successfully rescues a strong version of linguistic determinism from standard objections. In your answer, you must:
  1.  Mechanize how grammatical structure (distinct from lexical labeling) reshapes the error surfaces updated during perception.
  2.  Address whether the bilingual capacity to switch grammatical priors refutes determinism or merely demonstrates plasticity.
  3.  Defend a decisive verdict on whether strong determinism is viable under this framing.

  ***

  ### Model Answer (Sample)

  **Verdict:** Predictive processing (PP) rescues strong linguistic relativity from the 'universals' objection but ultimately fails to sustain strong *determinism* against the 'bilingualism' objection. It validates a strong *penetrability* thesis, but not a rigid *constraint* thesis.

  To evaluate this, we must first mechanize the relationship between grammar and prediction. In hierarchical PP, cognition minimizes surprise by updating generative models. Top-down predictions meet bottom-up sensory data; the mismatch is prediction error. Crucially, the brain minimizes error either by updating models (perception) or acting on the world. Linguistic structure, on this view, is not merely a labeling system for pre-existing concepts (the 'naming' fallacy). Instead, grammatical categories function as high-level hyperpriors that dictate which prediction errors are deemed relevant enough to update lower-level sensory models.

  For example, consider a language requiring obligatory evidentiality markers (specifying the source of information). A speaker of this language possesses a grammatical prior that demands precision-weighting on sensory data related to source verification. When perceiving an event, the error surface is reshaped: mismatches regarding *how* something is known generate high precision errors, forcing perceptual updating that a speaker of a non-evidential language might ignore. This is not lexical labeling; it is structural tuning of the perceptual hierarchy. This mechanism effectively neutralizes the 'universal conceptual structure' objection. Universals may exist at the level of basic physiology (the bottom of the hierarchy), but grammatical priors determine which signals propagate upward. Translation is possible because shared physiology allows for mapping, but the *cost* of processing differs based on the priors engaged.

  However, does this rescue strong determinism? Strong determinism implies that language *fixes* thought limits. The bilingual objection is fatal here. If grammar sets high-level priors, bilinguals should suffer catastrophic interference when switching languages, or be unable to access concepts incompatible with their dominant grammar. Empirical data suggests otherwise. Bilinguals switch grammatical frames with measurable but manageable costs (switching costs). Within a PP framework, this indicates that grammatical priors are plastic, not fixed. The brain can update its hyperpriors based on context.

  If grammatical structures were truly deterministic constraints on the error surface, switching languages would require rebuilding the generative model from the bottom up. Instead, bilinguals appear to maintain multiple sets of high-level priors, selecting between them via contextual cues. This suggests language shapes the *trajectory* of thought (relativity) but does not determine the *boundaries* of thought (determinism). The error surface is reshaped temporarily, not permanently scarred.

  Furthermore, if cognition is fundamentally about minimizing free energy, rigid determinism is metabolically inefficient. A system that cannot update its priors when faced with novel conceptual environments (e.g., learning a second language) would fail to minimize long-term surprise. The very fact that adults can learn grammatical categories that lack L1 equivalents (e.g., an English speaker learning aspectual distinctions in Russian) demonstrates that the error surfaces are permeable. Language acts as a lens that focuses attention and weights errors, but it does not blind the eye to signals outside its focal range.

  Therefore, the PP framework rescues linguistic relativity from the charge of being mechanistically vacuous. It provides a computational account of how grammar influences perception without requiring modular separation. However, it relegates strong determinism to a historical artifact. The plasticity required for predictive adaptation undermines the rigidity required for determinism. We are left with a robust 'linguistic modulation' thesis: grammar dictates what we *habitually* attend to by weighting prediction errors, but it does not dictate what we *can* attend to. The verdict is that PP saves Whorf from irrelevance, but not from the evidence of bilingual plasticity.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Mechanism of Predictive Processing (10 Marks)**
  *   **A-Range (8-10):** Explicitly explains hierarchical error minimization. Describes grammar as *high-level priors* affecting *precision-weighting* of errors. Distinguishes this from simple lexical labeling (naming).
  *   **B-Range (5-7):** Mentions prediction/priors but treats them vaguely. Might conflate "prediction" with "expectation" in a folk-psych sense. Struggles to distinguish grammar from vocabulary.
  *   **C-Range (0-4):** Buzzword dropping ("predictive coding") without mechanistic explanation. Treats PP as simple feedback loops.

  **2. Engagement with Objections (10 Marks)**
  *   **A-Range (8-10):** Directly tackles bilingualism as a test of plasticity vs. fixity. Explains *why* switching costs matter for the determinism claim. Addresses universals/translation via shared physiology vs. divergent priors.
  *   **B-Range (5-7):** Mentions bilingualism but treats it as just "knowing two languages." Doesn't connect switching to prior updating. Hand-waves the universals objection.
  *   **C-Range (0-4):** Ignores bilingualism. Treats objections as standard undergrad lists without PP integration.

  **3. Verdict and Clarity (5 Marks)**
  *   **A-Range (5):** Decisive verdict (Yes/No/Qualified). Argument flows logically from the mechanism to the conclusion.
  *   **B-Range (3-4):** Waffles ("both sides have merit"). Conclusion doesn't fully follow from the premises.
  *   **C-Range (0-2):** No clear verdict. Disorganized.

  **Typical Mistakes (Cost Marks):**
  *   **The "Labeling" Trap:** Treating Whorf as only about having words for things (lexical) rather than structural grammatical constraints.
  *   **The "Feedback" Error:** Describing predictive processing as just "getting feedback and correcting," missing the hierarchical/generative model aspect.
  *   **The "Waffle":** Refusing to take a stance on the determinism question. The prompt demands a verdict.
  *   **Conflation:** Treating "relativity" and "determinism" as synonyms. (Relativity = influence; Determinism = constraint).

  ***

  Let me know if you want me to tweak the weighting. I think hitting the "grammar vs. lexicon" distinction hard is key for a grad level distinction.

