answer: |-
  **The Truncated Horizon: Simulation Risk as a Defeater for Extreme Longtermism**

  The ethical framework known as longtermism posits that the primary determinant of our moral obligations is the impact of our actions on the distant future. Because the potential population of future generations may number in the trillions or quadrillions, longtermist calculus often justifies bearing significant near-term costs to secure marginal improvements in the trajectory of civilization millennia hence. This moral urgency relies on a specific metaphysical precondition: the continuity of the timeline. It assumes that the future is not only open but causally accessible and ontologically robust. The philosophical simulation argument, however, introduces a destabilizing variable into this equation. By suggesting that our reality may be a computational construct, it forces a reassessment of the timeline's durability. This essay argues that the simulation argument rationally dampens extreme longtermist fanaticism. The precise structural reason for this verdict is not that simulated suffering matters less, but that the most probable simulation scenarios imply a truncated timeline, thereby severing the causal chain required for far-future interventions to succeed.

  To assess this claim, one must distinguish sharply between two conceptions of simulated reality that are frequently conflated in popular discourse. The first is the **Ancestor Simulation**, which is truncated and retrospective. In this scenario, a post-human civilization runs simulations of their evolutionary past to study history, sociology, or physics. These simulations are resource-intensive; therefore, computational efficiency dictates that they need only run as long as necessary to gather the required data. Such a simulation would likely terminate shortly after the period of interest concludes—potentially in our near future—rendering the year 10,000 computationally nonexistent. The second possibility is the **Open-Ended Simulation**, which is computationally unbounded. In this scenario, the simulation is a persistent, substrate-independent reality that continues indefinitely, indistinguishable in duration and causal depth from base reality. Here, the far future is as morally substantial as it would be in a non-simulated universe.

  The distinction is critical because the logical weight of the simulation argument rests heavily on the Ancestor model. The argument posits that if civilizations reach a post-human stage, they will run many ancestor simulations. Consequently, there are far more simulated minds than base-reality minds. If we accept this probabilistic reasoning, we must also accept the constraints inherent to the purpose of such simulations. Ancestor simulations are designed to model a specific epoch. Extending such a simulation thousands of years beyond the "present" incurs massive computational costs with diminishing returns for the simulators. Therefore, the epistemic probability favors the Truncated Scenario over the Open-Ended one. If there is a significant probability that our timeline is an Ancestor Simulation, there is a corresponding significant probability that the timeline will terminate before the distant future arrives.

  This probability injects a catastrophic discount rate into longtermist expected value calculations. Extreme longtermism functions on the logic of astronomical waste: the idea that failing to secure the future results in the loss of an astronomical number of potential lives. This logic holds only if the probability of that future existing is high. If the simulation hypothesis is true, and specifically if the Ancestor variant is the case, the probability of the year 10,000 existing approaches zero. Even if one assigns a modest probability to the simulation hypothesis—say, twenty percent—and a modest conditional probability to the truncation of that simulation, the expected value of projects aimed at the far future collapses. A moral strategy that demands immense present sacrifice for benefits that accrue only if the timeline remains open for ten millennia cannot be rational if there is a non-negligible chance the timeline is a short-running script destined for deletion. The structural fragility of the simulated timeline undermines the leverage longtermists claim to have on the distant future.

  Proponents of unfettered longtermism often counter this by invoking the ethical inertness of ontology. They argue that the simulation hypothesis is ethically irrelevant because the internal moral weight of suffering and flourishing remains fully intact. If a being within a simulation experiences pain, that pain is real to the being. Therefore, they claim, we should act as if the future is real regardless of its ontological status. While this phenomenological realism is compelling for near-term ethics, it fails to rescue extreme far-future prioritization. The issue is not whether suffering *now* is real, but whether the *subjects* of future suffering will exist at all. In a Truncated Simulation, the beings of the year 10,000 are never instantiated. There is no phenomenological experience to protect because the computational resources to generate those experiences are never allocated. The ethical inertness argument preserves the urgency of preventing present suffering, but it cannot manufacture the existence of future beings whose timeline has been computationally pruned. Thus, the moral weight of the present does not compensate for the ontological void of the future.

  Furthermore, relying on the Open-Ended Simulation scenario to save longtermism requires a speculative leap that contradicts the efficiency premises of the simulation argument itself. To argue that we are in a persistent, unbounded simulation is to argue that we are in a "full universe" simulation rather than an "ancestor" simulation. However, full universe simulations are computationally more expensive and less likely to be run in large numbers compared to ancestor simulations. Since the simulation argument relies on the sheer number of simulations to drive the probability that we are simulated, it inherently favors the cheaper, truncated ancestor models. To cling to longtermist fanaticism, one must reject the very efficiency constraints that make the simulation argument plausible in the first place.

  Consequently, rational longtermists ought to treat the simulation argument as a legitimate reason to moderate extreme commitments. The verdict is that the simulation argument undermines the specific moral urgency directed at the distant future. This is not because the welfare of simulated beings matters less, but because the causal pathway to the distant future is probabilistically severed. The structural reason is the **risk of timeline truncation**. When moral strategy depends on the existence of quadrillions of future lives, any hypothesis that suggests the timeline may be a short-lived historical study acts as a defeater. It does not negate the importance of the present, nor does it invalidate the reality of current suffering. However, it dismantles the mathematical foundation of far-future fanaticism, which requires a high-confidence projection of an expansive, open timeline. In the face of ontological uncertainty, moral resources should be reallocated from speculative interventions targeting the year 10,000 to robust interventions securing the continuity and quality of the immediate future. The simulation hypothesis does not end morality, but it does impose a horizon on our causal reach, demanding a humility that extreme longtermism refuses to acknowledge.
