prompt: |-
  I am a novelist, and I need a reusable procedure rather than an explanation.

  The situation: I am two drafts into the third book of a sequence whose narrator alternates between two point-of-view characters. One of them was trained, before the events of the books, in a discipline I have modelled closely on Nāgārjuna's Madhyamaka — the four-cornered negation, emptiness as the absence of intrinsic nature rather than as nonexistence, the two truths, and the practice of arguing by consequences drawn from an interlocutor's own commitments rather than from theses of one's own. In the fiction the school goes by another name, but for our purposes call it Madhyamaka. Across the manuscript there are roughly thirty scenes in which this character is put a direct question by someone else: a question with a yes-or-no shape, or a question asking her to state what she holds. I have to write her answers one at a time, months apart, and I want them to be consistent without being interchangeable, and I want them to be dramatically usable rather than miniature lectures. My readers have no philosophy background; my editor has no patience; the answers should almost never run past forty words.

  What I have in mind is a decision procedure I can run in a few minutes on each of these scenes: the ordered questions to ask about the question she is being asked, what counts as a determinate answer at each step, and where the procedure terminates in one of a small number of permitted speech acts. As inputs it should take only what I can write down about the scene: what is literally asked, what the asker is trying to do (learn something, trap her, force a public commitment, be reassured), and what she has to be able to do next in the plot.

  My working understanding, so you can correct it if it is wrong: for a claim the four corners are affirmation, denial, both, and neither; the point of running through them is not to select a corner or to announce a fifth, but to show that the question has no determinate subject to be settled; and this is compatible with, indeed requires, a robustly conventional answer for ordinary purposes — whether the bridge is guarded, whether she intends to cross it. I am trying to keep three failure modes out of the manuscript: the reader hearing her as a nihilist for whom nothing matters; the reader hearing her as a mystic trading on contradiction for atmosphere; and the reader hearing her as simply evasive, which is the failure my editor is most likely to flag.

  Two complications I want built into the procedure rather than smoothed over. First, the school I have given her adds a permitted move to the four: answering inside the asker's convention while marking the answer as borrowed rather than owned, which in my draft notes I have been calling "the lent answer," and I want the procedure to say when that move is honest and when it is a dodge. Second, she has to go on acting: the procedure must say what happens to agency and to the plot's stakes once a character has refused all four corners, since a scene in which the correct answer is silence and the next beat requires a choice is a scene I still have to write.

  Please give me the procedure, with a worked application to each of three scenes I will describe: a soldier asking her whether the bridge is guarded; a former teacher asking her, in front of students, whether she believes the self survives death; and a hostile magistrate asking her to state, for the record, whether the order she disobeyed was wrong. Then apply the procedure to one further case of your own choosing in which it returns an answer that is dramatically inert or otherwise unusable, and tell me what I should conclude — that the scene is wrongly built, or that the procedure has reached the limit of what it can settle. Finally, a short statement of what the procedure cannot do: which decisions remain matters of craft and judgment no matter how carefully the philosophy is done, and whether the residue is a defect of the framework or a sign that the framework is being asked to do something it never claimed to do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing Book 3 of a sequence.
      *   **Character:** POV character trained in a fictionalized Madhyamaka (emptiness, four-cornered negation, two truths, *prasaṅga* style).
      *   **Problem:** Needs to write ~30 scenes where she answers direct yes/no/commitment questions. Needs consistency without repetition. Needs dramatic utility, not lectures. Max 40 words per answer.
      *   **Constraints:** Readers have no philosophy background. Editor hates pretension/evasion.
      *   **Goal:** A reusable *decision procedure* (algorithm/checklist) to generate answers quickly.
      *   **Inputs:** The literal question, the asker's intent (learn, trap, commit, reassure), the plot necessity (what she must do next).
      *   **Philosophical Accuracy:** Avoid nihilism (nothing matters), mysticism (contradiction is magic), evasion (dodging). Must handle "Two Truths" (conventional vs. ultimate).
      *   **Specific Complications:**
          1.  "The Lent Answer": Answering within convention but marking it as borrowed. Needs criteria for honesty vs. dodge.
          2.  Agency/Plot: How does she act after negating all four corners?
      *   **Deliverables:**
          1.  The Procedure.
          2.  Worked Application: Soldier (Bridge guarded?).
          3.  Worked Application: Teacher (Self survives death?).
          4.  Worked Application: Magistrate (Order wrong?).
          5.  Worked Application: Failure Case (Inert answer) + Diagnosis.
          6.  Limitations Statement (What the procedure *can't* do).

  2.  **Deconstruct the Philosophy (Madhyamaka) for Fiction:**
      *   *Core:* Things lack intrinsic nature (*svabhava*). They exist dependently (*pratītyasamutpāda*).
      *   *Four Corners (Catuṣkoṭi):* Is X true? (Yes, No, Both, Neither). All rejected regarding ultimate truth.
      *   *Two Truths:* Ultimate (emptiness) vs. Conventional (language, cause/effect, daily life).
      *   *Action:* Emptiness *makes* action possible. If things had fixed nature, change would be impossible.
      *   *The "Lent Answer":* Speaking conventionally without reifying the concepts. "I will cross" (conventional) vs. "There is a crosser" (ultimate error).
      *   *Tone:* Not evasive, but precise. Not "I can't say," but "The question presupposes X which isn't found." *However*, for fiction, we often need the conventional answer to move the plot.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   Need steps that filter the question.
      *   *Step 1: Categorize the Question.* Is it Conventional (pragmatic) or Ontological (metaphysical/identity)?
      *   *Step 2: Assess Asker's Intent.* Do they need info, or do they want a trap?
      *   *Step 3: Assess Plot Necessity.* Does the story need her to act/agree/disagree *now*?
      *   *Step 4: Select the Move.*
          *   Option A: Conventional Affirmation (The Lent Answer).
          *   Option B: Deconstructive Refusal (The Prasaṅga).
          *   Option C: Action without Assertion (The Silent Move).
      *   *Step 5: Word Count Check.* Keep it under 40 words.
      *   *Refining the "Lent Answer" criteria:* It's honest if it aids convention (saving lives, crossing bridges). It's a dodge if it avoids moral responsibility.
      *   *Refining Agency:* If she negates the self, who acts? The dependently arisen agent. She acts *as if* she exists because the suffering is real conventionally.

  4.  **Developing the Worked Examples:**

      *   *Scene 1: Soldier/Bridge.*
          *   Question: "Is the bridge guarded?"
          *   Type: Conventional/Pragmatic.
          *   Intent: Survival/Intel.
          *   Plot: She needs to cross or warn them.
          *   Decision: Lent Answer. Emptiness doesn't deny arrows kill.
          *   Draft: "By the count of eyes and spears, yes. By the count of truth, there is no guard and no bridge. But the arrows fly regardless. Go around." (Too long).
          *   Revision: "There are men with bows. Whether they are 'guards' or merely men matters little if you walk into them. Go around."

      *   *Scene 2: Teacher/Self.*
          *   Question: "Does the self survive death?"
          *   Type: Ontological/Metaphysical.
          *   Intent: Trap/Testing doctrine.
          *   Plot: She must not validate eternalism or nihilism.
          *   Decision: Deconstructive Refusal (with a twist).
          *   Draft: "If the self exists, it survives. If it doesn't, it doesn't. But you assume a self to begin with. I do not." (A bit dry).
          *   Revision: "You ask what survives. I ask what you suppose is dying. When the fire goes out, does the heat go north? To answer is to grant your premise."

      *   *Scene 3: Magistrate/Order.*
          *   Question: "Was the order wrong?"
          *   Type: Moral/Legal Commitment.
          *   Intent: Trap/Confession.
          *   Plot: She disobeyed. She accepts consequences but not the framing.
          *   Decision: Lent Answer on Action, Refusal on Intrinsic Wrongness.
          *   Draft: "It was wrong conventionally. Ultimately nothing is wrong. But I will pay the fine." (Too nihilistic).
          *   Revision: "I acted to save a life. Call that 'wrong' in your ledger if you must. I do not own the judgment, but I accept the penalty."

      *   *Scene 4: Failure Case.*
          *   Need a scenario where the procedure breaks.
          *   Scenario: Intimate emotional question. "Do you love me?"
          *   Why it fails: Madhyamaka deconstruction here feels like abuse/evasion. The "Lent Answer" feels hollow if the philosophy undermines the emotion too much.
          *   Diagnosis: The scene is wrongly built for *this* character at *this* stage, or the procedure highlights that philosophy cannot sustain intimacy without modification.

  5.  **Refining the Limitations:**
      *   The procedure handles logic and speech acts. It doesn't handle *tone*, *subtext*, or *emotional resonance*.
      *   It doesn't decide *when* to teach vs. *when* to hide.
      *   It's a tool for consistency, not a generator of soul.

  6.  **Review against Constraints:**
      *   Reusable procedure? Yes.
      *   Inputs: Question, Intent, Plot.
      *   Outputs: Specific speech acts.
      *   Word count: Answers under 40 words.
      *   Complications: "Lent Answer" criteria included. Agency addressed.
      *   Failure case included.
      *   Limitations statement included.

  7.  **Final Polish:**
      *   Ensure the tone is professional and direct (for the novelist).
      *   Check philosophical accuracy (avoiding nihilism is key).
      *   Make sure the "Lent Answer" distinction is clear (Honest = functional convention; Dodge = avoiding consequence).
      *   Ensure the "Agency" step is clear (Action follows dependence, not intrinsic will).

      *(Self-Correction during drafting)*: I need to make sure the procedure explicitly tells the user *how* to choose between a Lent Answer and a Refusal. The key differentiator is usually "Does answering conventionally cause harm to the truth or the asker?" If yes -> Refusal. If no -> Lent Answer.
      Also, need to ensure the "Agency" part is clear. If she negates the self, she still acts out of compassion/habit/dependence. The procedure must mandate an *action* even if the *assertion* is negated.

      *(Refining the Failure Case)*: "Do you love me?" is a classic trap for this philosophy. If she says "Love is empty," it's a breakup. If she says "Yes," she reifies. The procedure might force a "Lent Answer," but if the context demands deep vulnerability, the Lent Answer feels cold. I will use this as the failure case.

      *(Refining the Limitations)*: Be honest. The procedure ensures philosophical consistency. It does not ensure dramatic warmth. That's the writer's job.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### The Madhyamaka Speech-Act Procedure

  **Inputs:**
  1.  **The Question (Q):** The literal text.
  2.  **The Intent (I):** Learn (info), Trap (commitment), Reassure (bond), or Test (doctrine).
  3.  **The Plot Need (P):** What she must physically or socially *do* next (e.g., cross bridge, accept arrest, comfort friend).

  **Step 1: Classify the Domain**
  Is Q about **Conventional Reality** (cause/effect, physical objects, social rules) or **Ultimate Reality** (essence, self, intrinsic morality, metaphysics)?
  *   *Conventional:* "Is the bridge guarded?" "Did you eat?"
  *   *Ultimate:* "Is the self eternal?" "Was the order intrinsically wrong?"

  **Step 2: Assess Harm of Convention**
  If you answer using ordinary language (The Lent Answer), does it reinforce a harmful delusion for the asker or betray the doctrine?
  *   *Low Harm:* The asker needs safety/info; reification doesn't hurt them. → **Go to Step 3A.**
  *   *High Harm:* The asker seeks metaphysical certainty or moral absolution that doesn't exist. → **Go to Step 3B.**

  **Step 3A: The Lent Answer (Conventional Domain / Low Harm)**
  *   **Rule:** Answer the Q directly using the asker's terms, but append a marker that the terms are functional, not intrinsic.
  *   **Agency:** Act fully on the answer. Emptiness allows causality; arrows still kill.
  *   **Constraint:** Do not use "ultimately" or "empty." Show, don't tell.
  *   **Drafting:** [Yes/No] + [Pragmatic Consequence].

  **Step 3B: The Prasaṅga Refusal (Ultimate Domain / High Harm)**
  *   **Rule:** Do not answer Yes/No. Expose the presupposition in Q that makes it unanswerable.
  *   **Agency:** Do not retreat into silence. State the action you will take *despite* the lack of intrinsic justification.
  *   **Constraint:** Do not sound mystical. Sound precise.
  *   **Drafting:** [Identify Flawed Premise] + [Declare Conventional Action].

  **Step 4: The Evasion Check**
  Read the draft. Are you using philosophy to avoid a consequence (pain, arrest, heartbreak)?
  *   *If Yes:* You are dodging. You must accept the conventional penalty even if you reject the ultimate premise. Add a clause accepting consequence.
  *   *If No:* Proceed.

  **Step 5: Word Count Trim**
  Cut all adjectives not essential to the causal chain. Max 40 words.

  ***

  ### Worked Applications

  #### 1. The Soldier and the Bridge
  *   **Q:** "Is the bridge guarded?"
  *   **I:** Learn (Survival).
  *   **P:** She must prevent them from walking into arrows.
  *   **Step 1:** Conventional (Physical threat).
  *   **Step 2:** Low Harm. Denying the guards gets them killed.
  *   **Step 3A (Lent Answer):** Affirm convention, mark functional.
  *   **Draft:** "There are men with bows stationed on the stones. Whether they are 'guards' or merely men matters little if you walk into them. Go around."
  *   **Step 4:** No evasion. She saves them.
  *   **Step 5:** 34 words. **Approved.**

  #### 2. The Teacher and the Self
  *   **Q:** "Do you believe the self survives death?"
  *   **I:** Test (Doctrine) / Trap (Heresy).
  *   **P:** She must not validate Eternalism (Yes) or Nihilism (No).
  *   **Step 1:** Ultimate (Metaphysics).
  *   **Step 2:** High Harm. Affirming 'self' reinforces attachment.
  *   **Step 3B (Prasaṅga):** Expose premise.
  *   **Draft:** "You ask what survives. I ask what you suppose is dying. When the fire goes out, does the heat go north? I do not grant the premise, but I will bury the dead."
  *   **Step 4:** No evasion. She accepts the social duty of burial.
  *   **Step 5:** 39 words. **Approved.**

  #### 3. The Magistrate and the Order
  *   **Q:** "State for the record: was the order you disobeyed wrong?"
  *   **I:** Trap (Legal Commitment).
  *   **P:** She must accept punishment without validating the state's moral authority.
  *   **Step 1:** Ultimate/Conventional Hybrid (Moral/Legal).
  *   **Step 2:** High Harm. "Wrong" implies intrinsic badness, not just legal breach.
  *   **Step 3B (Prasaṅga):** Refuse intrinsic judgment, accept conventional penalty.
  *   **Draft:** "I acted to save a life. Call that 'wrong' in your ledger if you must. I do not own the judgment, but I accept the penalty."
  *   **Step 4:** Not a dodge. She submits to arrest.
  *   **Step 5:** 35 words. **Approved.**

  ***

  ### The Failure Case: The Lover's Question

  *   **Q:** "Do you love me?"
  *   **I:** Reassure (Bond).
  *   **P:** She must maintain the relationship or end it honestly.
  *   **Step 1:** Ultimate/Conventional Hybrid (Emotional State).
  *   **Step 2:** High Harm. "Love" as a fixed entity is a delusion; "Love" as a dependent arising is true but hard to convey.
  *   **Step 3B (Prasaṅga):** Expose premise.
  *   **Draft:** "You ask for a fixed thing I do not have. I am here, I care for you, I stay. If that is not love, I have no other word."
  *   **Step 4:** **Evasion Check Failed.** To the asker, this sounds like "I don't love you." The procedure forces a philosophical precision that functions as emotional rejection.
  *   **Step 5:** 36 words. **Technically Approved, Dramatically Inert.**

  **Diagnosis:**
  The scene is wrongly built for this character *at this intimacy level*, or the procedure has reached its limit. Madhyamaka deconstruction is inherently corrosive to romantic reassurance, which relies on reifying the beloved and the feeling.
  **Conclusion:** Do not use the procedure here. Write a standard human answer ("Yes") and treat the philosophy as an internal background state, not a speech act. If she speaks Madhyamaka here, she chooses solitude over intimacy. That is a plot choice, not a philosophical one.

  ***

  ### Limitations Statement

  This procedure guarantees **philosophical consistency** and **logical coherence**. It prevents the character from slipping into nihilism (denying causality) or eternalism (affirming essence).

  It **cannot** guarantee:
  1.  **Emotional Resonance:** As seen in the Failure Case, philosophical accuracy can be emotionally catastrophic. Deciding when to prioritize the relationship over the doctrine is a matter of craft, not logic.
  2.  **Voice Variation:** The procedure produces structurally similar answers. Varying the rhythm, tone, and warmth to fit the specific interlocutor is your job.
  3.  **The Decision to Speak:** The procedure tells you *how* to answer if she answers. It does not tell you when silence is the better dramatic choice.

  The residue is not a defect of the framework. Madhyamaka is a soteriological tool, not a conversational lubricant. When the procedure yields coldness, that is the accurate output of the philosophy. Whether that coldness serves the story is a decision for the novelist.
