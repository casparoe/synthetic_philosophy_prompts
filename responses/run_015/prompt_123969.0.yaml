answer: |-
  You are not chasing noise. Your hypothesis is structurally sound, and it aligns with the most sophisticated meta-ethical critiques of Kantian scholarship from the last forty years. You have correctly identified that the "stalemate" in the literature is not due to a lack of clever examples, but because the debate is masking deeper, unresolved tensions in the architecture of the theory itself.

  Here is the diagnosis you are looking for.

  ### 1. The Diagnosis: Criterion vs. Procedure
  The primary source of the talking-past-each-other is a conflation of two distinct roles the Formula of Universal Law (FUL) is asked to play.

  *   **As a Criterion of Rightness:** What *makes* an action right? (The metaphysical ground of obligation).
  *   **As a Decision Procedure:** How does an agent *figure out* what to do? (The epistemic tool for deliberation).

  **The Conflict:**
  *   **The Formalists** (your second camp) treat FUL primarily as a *Criterion*. They argue that the moral worth lies in the logical form of the volition, not the outcome. For them, if the test relies on "what goes wrong" in the imagined world, it smuggles in consequences, turning Kant into a rule-utilitarian. They dig in here because if FUL is consequentialist, Kant's entire project of grounding morality in pure reason collapses.
  *   **The Pragmatists/Constructivists** (your first camp) treat FUL primarily as a *Procedure*. They argue that if the test doesn't yield actionable guidance that matches our considered moral judgments, it is useless. They dig in here because if FUL is purely logical and empty of empirical content, it cannot guide human action in a complex world.
  *   **The Skeptics** (your third camp) argue that you cannot separate the two. They claim the "logical contradiction" is only visible if you have already assumed the action is wrong (circularity).

  **The Verdict on Your Hypothesis:** You are right. It is not merely verbal. It is a **category error** sustained by textual ambiguity. Kant oscillates between presenting the CI as a logical test (Criterion) and a tool for moral deliberation (Procedure). The disagreement persists because scholars are trying to make the text consistent on a point where Kant may have been deliberately (or carelessly) ambiguous.

  ### 2. The Hidden Question: Philosophy of Action
  You asked if a hidden question about "how actions get individuated" is doing all the work. **Yes.** This is the "Maxim Individuation Problem."

  Ethics cannot function without a Philosophy of Action, and Kant's is the weak link in the chain.
  *   **The Problem:** A maxim is a "subjective principle of volition." But actions can be described at infinite levels of granularity (e.g., "moving my finger," "pulling the trigger," "killing the tyrant," "liberating the state").
  *   **The Slack:** As you noted, if I describe my maxim as "lie when it helps," it fails. If I describe it as "lie to a murderer at the door to protect innocent life," it might pass (or at least the contradiction is less clear).
  *   **Why it matters:** If the *agent* gets to pick the description, the test is circular (I just describe it until it passes). If the *philosopher* picks the description, the test is authoritarian and loses its first-person deliberative force.

  **Where the sides dig in:**
  *   **Formalists** argue there is a "correct" level of description determined by rationality itself, independent of the agent's whim. (Hard to prove).
  *   **Proceduralists** argue the agent must include all morally relevant context in the maxim. (Hard to define "relevant" without already knowing the moral answer).

  This is why no amount of new examples fixes the debate. The problem isn't the examples; it's the **ontology of the maxim**. Until there is a consensus on what constitutes a valid maxim-description, the test will always be gerrymanderable.

  ### 3. Analyzing Your Three Observations

  **Observation 1: Descriptive Slack**
  *   **Diagnosis:** This is the **Individuation Problem** described above.
  *   **Why it stalls:** There is no neutral algorithm for maxim selection. Christine Korsgaard tried to solve this by arguing maxims must be described in terms of their *purpose*, but critics argue purpose is also describable thinly or thickly.
  *   **Progress condition:** A theory of maxim individuation that is neither question-begging (selecting descriptions to fit verdicts) nor overly restrictive (banning context). Onora O'Neill's work on "relevant descriptions" is an attempt at this, but it remains controversial.

  **Observation 2: Necessarily Exclusive Maxims (The Campsite Problem)**
  *   **Diagnosis:** This is the **Triviality Objection**. If FUL bans anything that is physically impossible to universalize (like "everyone be the first to arrive"), the test is too broad.
  *   **The Distinction:** Kant scholars distinguish between a **Contradiction in Conception** (logically impossible, e.g., a promise that isn't a promise) and a **Contradiction in Will** (logically possible but rationally un-willable).
  *   **The Failure:** The campsite case is physically impossible to universalize, but not logically contradictory. If FUL flags it as immoral, the test is broken.
  *   **Why they dig in:** Formalists argue this isn't a moral maxim but a prudential one, so it shouldn't enter the test. But the test itself doesn't distinguish prudential from moral maxims *before* running the universalization.
  *   **Progress condition:** A formal constraint on maxims that filters out "scarcity-based" maxims *before* universalization, or a clear distinction between *practical* impossibility (bad) and *physical* impossibility (neutral).

  **Observation 3: Three Failure Modes**
  *   **Diagnosis:** You have correctly identified that **Contradiction in Conception (CIC)**, **Contradiction in Will (CIW)**, and **Practical/Consequential Collapse** are often run together.
  *   **The Mapping:**
      1.  *Practice destroys itself:* This is CIC (Perfect Duty). The institution becomes inconceivable.
      2.  *World can't accommodate it:* This is often a misreading of CIC as physical impossibility (see Campsite).
      3.  *I couldn't will that:* This is CIW (Imperfect Duty). The world is conceivable, but a rational agent would contradict their own necessary ends (e.g., happiness, development of talents) by willing it.
  *   **The Conflation:** The "Consequentialist" reading argues that CIC *actually* relies on empirical predictions about what would happen (consequences), not pure logic. The "Formalist" reading denies this.
  *   **Progress condition:** A clean formal distinction between logical contradiction (syntax) and teleological contradiction (ends). If the test relies on "what I can will," it relies on a theory of rational agency, not just logic.

  ### 4. What Would Count as Progress?

  Given this diagnosis, here is what actual progress would look like, ranked from most to least likely:

  1.  **Abandoning the "Algorithm" Dream (Most Likely):**
      Progress comes from admitting FUL is not a decision procedure for agents *in media res*. It is a **test of justification** for philosophers or judges *post hoc*.
      *   *Why:* This dissolves the "Descriptive Slack" problem. The agent acts on intuition/sensibility; the FUL is used to check if that intuition can be publicly justified. This aligns with Kant's political writings more than the *Groundwork*.
      *   *Result:* The debate shifts from "How do I use this?" to "How do we validate norms?"

  2.  **A Formal Theory of Maxim Individuation (High Value, Low Success Rate):**
      Developing a rigorous Philosophy of Action that dictates how maxims must be structured (e.g., must include agent, action, circumstance, *and* end) to prevent gerrymandering.
      *   *Why:* This addresses your "Descriptive Slack."
      *   *Result:* If we can agree on the syntax of a maxim, the test becomes more stable. (Scholars like Barbara Herman have attempted this with "moral salience," but it risks importing the moral verdict into the description).

  3.  **Distinguishing the Failure Modes Rigorously (Medium Value):**
      Explicitly separating Logical Contradiction, Teleological Contradiction, and Empirical Collapse.
      *   *Why:* This stops the "Campsite" objection from killing the "Promise" objection.
      *   *Result:* We realize FUL is actually three different tests wearing one uniform.

  ### 5. Why You Should Expect No Resolution

  You asked if this is one of those questions where you should expect no resolution. **Yes.** Here is why, specifically:

  The ambiguity is **functional**. Kant needs the test to feel logical (to guarantee necessity) *and* substantive (to guide action).
  *   If he makes it purely logical, it becomes empty (tautological).
  *   If he makes it purely substantive/empirical, it becomes contingent (utilitarian).

  The "sliding" you see in the literature is scholars trying to keep the balloon inflated. If you pin down the definition of "maxim" too tightly, the test loses coverage. If you loosen it, the test loses rigor.

  **The "Real" Disagreement:**
  The fight isn't about Kant. It's about **whether morality can be grounded in reason alone.**
  *   The Formalists are defending the possibility of Pure Practical Reason.
  *   The Consequentialist-readers are defending the relevance of Moral Experience.
  *   The Skeptics are denying the coherence of the project.

  **Recommendation for your study:**
  Stop looking for a verdict on whether the test "works." Instead, treat the *failure modes* as data. When the test slides, ask: *What moral intuition is forcing the slide?*
  *   If the test only works when we describe the maxim thickly, it suggests morality is context-dependent (challenging Kant's universalism).
  *   If the test flags exclusive maxims as wrong, it suggests the test confuses *scarcity* with *immorality*.

  You have correctly diagnosed that the "fight about Kant" is a proxy war for meta-ethics. You won't resolve it by reading more *Groundwork* commentary. You resolve it by recognizing that the "contradiction" Kant finds is not in the world, nor in the logic, but in the **structure of rational willing itself**—and we still don't agree on what that structure is.

  **Progress for you** is not finding the answer key. It is realizing that the "Descriptive Slack" isn't a bug in the scholarship; it's a feature of the theory. The test *requires* judgment to operate, which means it cannot be the ultimate ground of judgment. That tension is where the philosophy lives.
