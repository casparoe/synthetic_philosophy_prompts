      *   **Intellectualism (Stanley & Williamson):** Knowing-how is a species of knowing-that (propositional knowledge under a practical mode of presentation).
      *   **User's Hybrid:** Essentially a modified Intellectualism. It says "It's all knowing-that, *but* the format changes based on age and modality." This is vulnerable to both Rylean critiques (it's still reducing ability to states) and Intellectualist critiques (why the arbitrary cutoff?).

  3.  **Brainstorming Defeaters (Categorized by User's Request):**

      *   *Category 1: Empirical/Neuroscience (The Puberty Cutoff)*
          *   Neuroplasticity: Adults *do* learn embodied skills (surfing, skiing, juggling) that feel/act like "body-indexed" knowledge.
          *   Critical Periods: Language has a critical period. Motor skills? Less clear. Fine motor vs. gross motor.
