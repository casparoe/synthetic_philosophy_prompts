prompt: |-
  I've been trying to square Ryle's old distinction with the intellectualist story, and I've landed on this hybrid: knowing-how is basically knowing-that with a body-indexed represention you can't fully articulate, except for explicit-rule skills like chess which are pure knowing-that. And I think the body-index part only applies to skills picked up before puberty, since after that representations stay cortical and linguistic—so bike-riding is indexed knowing-that, but learning chess at thirty is just propositional. What would actually count against this? I want the defeaters sorted by how fatal they'd be: empirical stuff on skill acquisition breaking the puberty cutoff, procedural skills adults learn that resist propositional analysis, and whether the framework risks being qualified into unfalsifiability if I keep adding exceptions. Which ones would a committed version of this view concede as real problems versus hand-wave away? Be honest about whether it's actually exposed to anything, or if it's insulated.
