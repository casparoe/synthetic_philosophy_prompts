  4.  **Sorting by Fatality:**

      *   *Fatal:* Adult neuroplasticity showing identical neural substrates for early/late skills. The existence of adult implicit learning that defies propositional description. The chess grandmaster counterexample (expert performance is rarely rule-based).
      *   *Serious but Manageable:* Nuances in critical periods (maybe it's not puberty, but "consolidation"?).
      *   *Hand-wavable (by a committed proponent):* Phenomenological differences (it *feels* different to learn as an adult, even if the output is the same).

  5.  **Drafting the Response (Iterative Process):**

