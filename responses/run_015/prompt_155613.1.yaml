      *   *Claim 3: Disease is any internal state depressing functional efficiency below species-typical level.*
          *   **Status:** Inaccurate. It must interfere with *survival and reproduction* (fitness), not just "efficiency." Also, Boorse distinguishes disease (subnormal function) from illness (incapacity).
      *   *Claim 4: Whether a condition is a disease is an empirical question about how common it is... nothing to do with what anyone values.*
