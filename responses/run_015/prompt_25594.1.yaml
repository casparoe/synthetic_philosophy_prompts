          *   *Correction:* The user says Conceptual Art expands what counts. In Lit, moving to Non-Fiction often *demotes* literary prestige (in the context of "Great Novels"). This is the tension.

  5.  **Developing the Alternative ("Writing is Good, Period"):**

      *   This is a *Formalist* or *New Critical* approach.
      *   Implications:
