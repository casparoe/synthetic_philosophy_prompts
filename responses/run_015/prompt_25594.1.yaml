answer: |-
  This is a profound observation that cuts to the ontological heart of literature. You have identified a tension that literary theorists have wrestled with for decades, often under the umbrella of "The Autobiographical Pact."

  To answer your request, I will reconstruct the implicit theory of art that justifies the current industry practice, test its consistency (internally and against visual art), and sketch the consequences of abolishing it.

  ### 1. The Implicit Theory: Speech Act and Contractual Ontology

  The practice you describe strictly presupposes that **a literary work is not merely a text, but a speech act.**

  In philosophy of language (specifically J.L. Austin and John Searle), an utterance isn't just a string of words; it's an action. If I say "I promise to pay you," the words only work because of the context and my intention. The literary industry operates on a **Contractual Theory of Art**, heavily influenced by Philippe Lejeune's concept of the *Autobiographical Pact*.

  **The Strict Presuppositions:**
  1.  **Ontological Dualism:** The "work of art" is not identical to the physical book or the sequence of words. The work is *Text + Label*. The label (Fiction vs. Nonfiction) functions as an instruction manual for how to process the propositions within the text.
  2.  **The Truth-Claim Distinction:**
      *   **Fiction:** The author performs a "pretended assertion." When a novelist writes "I killed him," they are not lying; they are invoking a convention where truth-value is suspended in favor of coherence or emotional resonance. The artistic virtue here is *Imagination* (the ability to create a viable counterfactual world).
      *   **Nonfiction/Memoir:** The author performs a "serious assertion." They claim correspondence with reality. The artistic virtue here is *Insight* or *Witness* (the ability to accurately interpret and render the actual world).
  3.  **Ethical Stakes are Constitutive:** Because nonfiction claims truth, it incurs ethical debts to real-world referents. If a character is "really" a living person, the author has moral obligations to them. In fiction, characters are ontologically subordinate to the author; in nonfiction, the subjects exist independently of the author. Therefore, "fairness" is an aesthetic criterion in memoir but irrelevant in fiction.

  **Why this makes the practice coherent:**
  Under this theory, changing the label *does* change the object, even if the words stay the same. It is analogous to a check. A piece of paper saying "Pay to the order of..." is art if framed, currency if issued by a bank, and trash if printed on a napkin. The context determines the function. The prize committees are not judging the ink; they are judging the validity of the speech act.

  ### 2. Consistency Checks

  #### A. Across the Fiction/Nonfiction Boundary
  Is this theory consistent? **Logically, yes. Empirically, no.**

  *   **Logical Consistency:** If you accept the Speech Act theory, the distinction holds. A lie in a memoir is fraud; a lie in a novel is plot.
  *   **Empirical Failure:** As you noted, all novels draw from life, and all memoirs employ narrative construction (which implies fabrication). The boundary is porous. By enforcing a binary (Booker vs. NBA), the industry forces a spectrum into a box. This creates the "Autofiction" crisis: books that want the ethical protection of fiction ("it's just a story") but the prestige of truth ("this really happened").
  *   **The Inconsistency:** The practice presupposes a principled line where there is only a pragmatic one. The "line" is usually drawn at *marketability* and *liability*, not ontology. If a book is sued for libel, it suddenly becomes nonfiction. If it wins a prize, it's fiction. The theory claims to be about the nature of the work, but it functions as a legal and marketing shield.

  #### B. Across the Literature/Visual Art Comparison
  You suggest the literary world is "backwards" compared to visual art. I would argue you are observing a difference in **medium specificity**, but your assessment of visual art might be slightly idealized.

  *   **The Visual Art Counter-Point:** In formalist painting (Greenbergian modernism), you are right: it doesn't matter if the apple was real or a prop. However, in **Conceptual Art** (which dominates contemporary prestige), the context *is* the work. If you discover that a "found object" was actually bought at IKEA and not found in a river, the work's value collapses. Provenance matters.
  *   **The Literary Difference:** Literature is propositional. A painting of a man does not assert "This man exists." A sentence "I was born in Paris" *does* assert that. Literature carries a default burden of truth that painting does not.
  *   **The "Demotion" Issue:** You note that in Conceptual Art, intention expands what counts as art, whereas in Lit, "memoir" can feel like a demotion from "Novel." This is a cultural hierarchy, not a theoretical one. The Novel is the hegemonic form of the 20th century. To classify a book as "Memoir" is to suggest the author lacked the *imaginative muscle* to transform life into art. It presupposes that **Transformation > Transcription.**
  *   **Verdict:** The literary practice is consistent with Conceptual Art (context matters) but inconsistent with Formalist Painting (object matters). The "demotion" reveals a bias: the industry values *Invention* (Fiction) higher than *Curation* (Nonfiction), assuming the former requires more "artistic" labor.

  ### 3. The Alternative: Radical Formalism ("Writing is Good, Period")

  If we replaced the Contractual/Speech Act theory with a **Radical Formalist** view—where the text is the only object of evaluation and the author's relationship to the material is irrelevant—here is what would change:

  **1. The Collapse of Categories**
  Prize committees would merge. There would be no "Best Novel" vs. "Best Nonfiction." There would only be "Best Book." This already happens in some spheres (e.g., The National Book Critics Circle Award sometimes blurs these, or the Orwell Prize for Political Writing).

  **2. The End of "Fairness" Criticism**
  Critics could no longer dock points for "betraying a spouse" or "getting the facts wrong." If the prose is luminous and the structure sound, the book succeeds. Ethical critiques would be relegated to tabloids or courtrooms, not literary reviews. The "Self-Indulgent" critique would vanish, replaced by "Is this perspective compelling?"

  **3. The Loss of the "Thrill of Truth"**
  Currently, readers derive a specific aesthetic pleasure from knowing a trauma *actually happened*. This is the "reality effect." If we abolish the distinction, we lose the specific frisson of witness. We also lose the protective shield for authors. If everything is fiction, authors can be sued for libel more easily. If everything is nonfiction, authors lose the freedom to imagine.

  **4. Shift in Artistic Virtue**
  *   **Current:** Fiction values *Verisimilitude* (feels real); Nonfiction values *Accuracy* (is real).
  *   **New:** Both would be judged on *Resonance*.
  *   **Consequence:** This would likely elevate high-quality memoirs to the status of high art (e.g., *The Liars' Club* would be judged alongside *The Great Gatsby* on prose alone) but it might also encourage novelists to be more reckless with real people's lives, knowing the criticism will be purely aesthetic.

  ### 4. Conclusion: What the Practice Reveals

  The practice you find buggy presupposes that **Art is a mode of relation, not just a mode of production.**

  It assumes that the value of a book lies in the *triangle* between Author, Text, and Reader.
  *   In **Fiction**, the Author hides behind the Text, and the Reader agrees to pretend.
  *   In **Nonfiction**, the Author stands beside the Text, and the Reader agrees to trust.

  The literary world maintains this distinction not because it is ontologically pure (it isn't), but because it manages **risk**. It manages the risk of libel (legal), the risk of betrayal (ethical), and the risk of disappointment (aesthetic).

  If you adopt the "Writing is Good, Period" view, you gain aesthetic purity but lose ethical clarity. You are left with a world where a beautiful sentence about a real person's suffering is judged solely on its rhythm, regardless of whether the suffering was exploited.

  The "bug" you sense is the friction between **Art** (which wants to be free) and **Communication** (which relies on shared rules). The industry chooses Communication rules to police Art. If you want to write in a way that exposes this, you are writing Autofiction not as a genre, but as a philosophical probe—forcing the reader to ask: *Why does it matter to me if this happened? And if it matters, is it because of the art, or because of the gossip?*

  That is where the art actually lives: in the reader's inability to decide which framework to use.
