      *   **Institutional Enforcement:** Prizes (Booker, NBA) have separate categories based on authorial relationship to material, not just textual features.
      *   **Theoretical Question:** What theory of art presupposes this? (It seems to imply the author's relationship to material is constitutive of the work).
      *   **The Problem:** All novels draw from life. Is there a principled line, or is it sociological?
      *   **Comparison:** Visual arts don't care if a painter works from life or photos. Conceptual art *does* care about intention, but it expands art, doesn't demote it. Literature seems "backwards."
      *   **Task:** Reconstruct the implicit theory of art that makes this practice coherent. Analyze its strict presuppositions, consistency (across boundaries and mediums), and implications of replacing it with a "writing is good, period" view.

  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *New Criticism:* "The Intentional Fallacy." This view says the text stands alone. The user's observation contradicts this. The current practice *rejects* New Criticism when genre classification is at stake.
      *   *Institutional Theory of Art (Dickie/Danto):* Art is what the artworld says it is. This explains the prize committees but doesn't explain *why* the distinction matters aesthetically.
      *   *Speech Act Theory (Searle):* Fiction is a pretended assertion. Non-fiction is a serious assertion. This is a strong candidate for the "strict presupposition." If I say "I walked to the store" in a novel, it's a pretend assertion. In a memoir, it's a claim of truth. Breaking this contract changes the nature of the work.
      *   *Ethical Criticism:* If it's non-fiction, real people are harmed. If it's fiction, they are "characters." This explains the "fairness" critique.
      *   *Romantic/Expressive Theory:* Art is expression of emotion. This blurs the line.
      *   *The "Pact" (Lejeune):* The Autobiographical Pact. The reader and author agree on the status of the name on the cover.

  3.  **Drafting the Reconstruction (The "Strict Presuppositions"):**

      *   The practice presupposes that *illocutionary force* (the type of speech act) is part of the artwork's ontology.
      *   It presupposes a *contractual theory of readership*. The value derives not just from the object, but from the relationship between author and reader.
      *   It presupposes an *ethical dimension* tied to truth-claims. Lying in fiction is fine (invention); lying in non-fiction is fraud.
      *   *Key Insight:* The theory isn't just about aesthetics; it's about *epistemology* and *ethics* bundled with aesthetics.

