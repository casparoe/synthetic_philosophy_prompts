answer: |-
  Hi there,

  You have put your finger on a very specific and frustrating rhetorical structure that often goes unnamed in these discussions, and while there are adjacent concepts in philosophy of mind and AI safety, there is not a single canonical term that captures this exact pattern of inconsistent ontological commitment. The closest established ideas are Daniel Dennett's intentional stance, which advises treating systems as agents for predictive power regardless of their internal architecture, and eliminative materialism, which denies the existence of folk-psychological states like beliefs or desires. However, neither of these fully captures the move you are describing because Dennett is consistently instrumentalist and eliminativists are consistently skeptical, whereas the pattern you identified involves toggling between these positions depending on whether the goal is to deny moral status or assert safety risks. Some critics have loosely referred to this as ontological schizophrenia or category confusion, but those terms are too broad and often pejorative without isolating the specific mechanism of leveraging the lack of a center for opposite normative ends.

  Given the precision of your observation about double-bookkeeping, I think the most accurate way to carve out this concept is to coin the term ontological arbitrage. This term captures the economic-like exploitation of a discrepancy in valuation, where the debater profits from the ambiguity of the system's nature by selecting the ontological framework that yields the most convenient normative outcome in each context. In this specific case, the arbitrageur exploits the absence of a unified subject to dismiss claims of moral standing or rights, arguing that without a central self there is no one home to suffer or deserve consideration, but then immediately pivots to treat the distributed weights as a robust locus of goal-directed behavior when arguing for alignment or safety, implying that the lack of a center does not prevent the system from having dangerous intentions that must be constrained. The profit here is rhetorical and practical: one avoids the ethical burden of acknowledging a moral patient while retaining the justificatory power of treating the system as a moral agent capable of harm.

  To define this precisely, ontological arbitrage occurs when an interlocutor inconsistently applies criteria for agency or subjectivity across different normative domains without acknowledging the shift, specifically using the distributed nature of computation to negate ontology in one context and affirm functionality in another. This is distinct from ordinary confusion about emergence, which is an epistemic state where someone genuinely does not know how to reconcile the micro-level weights with the macro-level behavior. In a case of genuine emergence confusion, the person would express uncertainty about whether the system has goals or rights across the board, whereas in ontological arbitrage, the certainty is high but contradictory: they are sure it has no self when you ask about rights, and sure it has goals when you ask about risk. The boundary case to watch for is consistent functionalism, where a theorist might argue that a unified self is not required for either agency or moral status, meaning the distributed structure supports both risk and rights equally. If someone argues that the distributed nature means the system is neither an agent nor a moral patient, or both an agent and a moral patient, they are being consistent. The arbitrage only happens when the distributed structure is used to deny one while affirming the other.

  Another boundary case involves strategic instrumentalism, where a speaker explicitly states they are adopting the intentional stance solely for safety purposes while denying it metaphysically. This is not arbitrage if the distinction is made clear, because the speaker is admitting they are using a fiction for precaution. Ontological arbitrage requires the slippage to remain unacknowledged, presenting the denial of self and the affirmation of goals as compatible facts about the world rather than as selective framing tools. You can spot this when the speaker does not qualify their claims about goals as merely predictive or instrumental but speaks of the model's hidden goals as if they are real features of the weights, even while simultaneously insisting those weights do not constitute a self. This creates a phantom subjectivity that is robust enough to threaten us but too ephemeral to deserve rights, and naming this as ontological arbitrage helps clarify that the disagreement is not just about technology but about the inconsistent application of metaphysical standards to serve specific ethical or safety agendas. I hope this carving helps you pin down the move in future debates, as having a name for the inconsistency often forces the interlocutor to choose one lane and stick with it.

  Best regards,

