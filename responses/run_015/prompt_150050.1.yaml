answer: |-
  Good evening, everyone. For those who don't know me, I'm one of the many grad students who had the privilege of stumbling through [Advisor's Name]'s office hours over the years.

  Looking around this room, I see two groups. There's the family and old friends, who mostly want to know why we're celebrating a career spent asking difficult questions. And there's the philosophers, who are probably waiting for me to define my terms. So, let's meet in the middle.

  For forty years, [Advisor's Name] worked on a slippery boundary. She asked whether we actually prefer fairness, or if we just prefer the self-image that comes with being fair. It's a tough question. If you tell people their morals are just hidden bias, they get angry. If you tell them their morals are purely rational, you're lying.

  She had a name for the space between those two lies. She called it "axiological residue." It's the leftover feeling that our values are genuinely ours, even when they track our social position almost perfectly. It's the sense that what we care about is real, even if we can trace exactly where we learned to care about it.

  That concept is the only reason I can stand up here tonight without feeling like a hypocrite. Because logically, I know I'm supposed to say nice things about my advisor. It's what the social context demands. It tracks my position as a grateful student. But there's a residue. The gratitude I feel isn't just performance. It's the stuff that stays after you've accounted for all the bias.

  [Advisor's Name] never tried to scrub that residue away. She didnt pretend her own choices were untouched by context, but she never reduced them to pure bias either. She taught us that we can acknowledge where our values come from without surrendering them. She showed us that knowing why you believe something doesn't have to weaken the belief itself.

  So, to the family here: you loved her long before she ever published a paper. To the philosophers: you know the arguments better than I do. But tonight, we're all sharing the same residue. We're acknowledging that while this moment is shaped by context, the love in this room is real enough to act on.

  Please raise your glasses. To [Advisor's Name], for teaching us that even if our values are complicated, they're still worth holding. Cheers.
