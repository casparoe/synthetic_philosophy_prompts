  I'm giving the toast at my advisors retirement dinner next week, and I could really use help shaping it. She spent forty years working on that slippery boundary between moral preference and hidden bias — like, do we actually prefer fairness, or do we just prefer the self-image that comes with being fair? The room is split about evenly between philosophers and grad students who'll catch every reference, and family plus old friends who mostly just want something warm and not a seminar. I want the philosophical problem to do real structural work in the speech, not sit there like decoration. Specifically, I'm playing with this idea I haven't named well yet: call it "axiological residue," the leftover feeling that our values are genuinely ours even when they track our social position almost perfectly. Use that to frame what I can and can't say about her career — I shouldn't reduce her choices to pure bias, but I also can't pretend they were rational preferences untouched by context. Keep it casual, write in American English, maybe include one small typo like a missing apostrophe, and please don't turn it into a lecture — there's gonna be wine and probably some crying relatives.
