answer: |-
  You have stumbled onto one of the most subtle distinctions in decision theory. Your instincts are not inconsistent, but they are mixing up three different mechanisms that *look* like sunk costs but function differently.

  The cleanest principle that captures almost all of these is **The Principle of Causal Relevance**:

  > **The past is irrelevant *unless* the past investment has structurally altered the future payoff matrix.**

  In economics, we are taught to ignore "sunk costs." But strictly speaking, you should only ignore costs that are truly *sunk*—meaning they are gone and have no power to change what happens next. If your past action changes the rules, the assets, or the psychology of the game you are currently playing, it is no longer a sunk cost. It is a **current condition**.

  Here is how this principle sorts your cases, and where you need to be careful not to lie to yourself.

  ### 1. The Pure Sunk Costs (Stock, Project, War)
  **Verdict:** Ignore the past.
  **Why:** In these cases, the past investment has **zero causal power** over the future outcome.
  *   **Stock:** The fact that you paid $100 does not make the stock more likely to go to $100. The market does not care about your break-even point.
  *   **Project:** Three years of coding does not make the product more viable.
  *   **War:** Dead soldiers cannot fight tomorrow. Their deaths do not increase the probability of victory.

  In these scenarios, your intuition is correct: looking backward is a bug in your reasoning. The past is dead weight.

  ### 2. The Structural Liability (Dollar Auction)
  **Verdict:** Escalate (locally), but fear the game (globally).
  **Why:** In the Dollar Auction, the past bid is **not sunk**. The rules of the game explicitly convert your past bid into a *future liability*.
  *   If you stop at 19, you *definitely* lose 19.
  *   If you bid 20, you have a *chance* to lose 0 (if the other person folds).

  Your past bid has altered the payoff matrix: it created a penalty condition for quitting. Therefore, considering that past bid is not a fallacy; it is a rational calculation of **loss mitigation**. You aren't bidding to "recover" the 19; you are bidding to avoid the *certain penalty* of the 19.
  *   **The Trap:** This logic is rational for *one move*, but if both players use it, it creates infinite escalation. Your instinct is mathematically sound for the immediate turn, but strategically dangerous for the whole game.

  ### 3. The Strategic Signal (House Bidding)
  **Verdict:** Commitment matters.
  **Why:** This is Game Theory, not Accounting. Your past bid is not just money; it is **information** sent to the seller.
  *   If you bid 500k and then immediately drop out when countered, you signal weakness or indecision.
  *   If you hold firm, you signal credibility.

  Your past action has altered the *seller's* future behavior. Therefore, the past bid is causally relevant to the future outcome. Quitting isn't "ignoring sunk costs"; it's changing your strategic posture in a negotiation.

  ### 4. The Hard Case: The Marriage
  **Verdict:** This is the danger zone. You must distinguish between **Asset Value** and **Investment Effort**.
  **Why:** This is where your intuition might be rationalizing, or it might be profound. It depends on *what* the 15 years produced.

  *   **The Fallacy Version:** "I can't leave because I put 15 years into this."
      *   This is irrational. The time is gone. Suffering 15 more years doesn't redeem the first 15.
  *   **The Rational Version:** "I can't leave because the 15 years built **relationship-specific capital**."
      *   A long marriage creates assets that a new relationship does not have: deep trust, shared language, intertwined finances, and **children**.
      *   These are not "sunk costs." They are **enduring assets**. They yield future value (stability for kids, comfort of companionship).

  **The Test:**
  To know if you are being rational or inconsistent, apply **The Reset Test**:
  > *Imagine you could snap your fingers and be at the starting line of a divorce today. You keep the kids, the finances, and the social entanglements exactly as they are now, but you erase the memory of the 15 years of effort. Do you still choose to stay?*

  *   **If YES:** You are staying for the **Assets** (the kids, the life built). This is rational. The past matters because it created present value.
  *   **If NO:** You are staying for the **Effort** (to avoid feeling the time was wasted). This is the Sunk Cost Fallacy. You are throwing good money (future happiness) after bad (past time).

  ### The Resolution
  You do not need to drop a verdict, but you do need to refine the Marriage one.

  Your intuition is actually consistent across the board if you apply the **Principle of Causal Relevance**:
  1.  **Stock/Project:** Past has no causal power. **Ignore.**
  2.  **Dollar Auction:** Past creates a liability (rule-based). **Count it.**
  3.  **House:** Past creates a signal (psychology-based). **Count it.**
  4.  **Marriage:** Past creates capital (asset-based). **Count it.**

  **The Warning:**
  The Dollar Auction and the Marriage are the two places where humans are most prone to self-deception.
  *   In the **Dollar Auction**, we tell ourselves we are "minimizing loss" when we are actually "escalating commitment."
  *   In **Marriage**, we tell ourselves we are "protecting the family" when we are actually "avoiding the pain of wasted time."

  **Specific Advice on Your Verdicts:**
  Keep the **Dollar Auction** verdict (bid 20 to avoid certain loss), but recognize it as a desperate move in a broken game, not a winning strategy.
  Keep the **Marriage** verdict (stay), *only if* you pass the Reset Test. If you are staying primarily because leaving feels like an admission that the 15 years were a "waste," you are falling for the fallacy. If you are staying because the 15 years built a fortress of value (kids, deep bond) that is worth more than the uncertainty of starting over, you are being rational.

  The principle holds: **Don't look at what you spent. Look at what you own now because you spent it.** If you own nothing but a receipt, walk away. If you own a house, a reputation, or a family, those are assets, not costs.
