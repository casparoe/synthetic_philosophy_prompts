  # DECISION TREE: THE THERMODYNAMIC ARROW
  **Start:** *I accept that microdynamics are (near enough) time-symmetric, and that entropy is increasing around here.*

  **1. Is the distinction between 'past' and 'future' a mind-independent feature of the physical state?**
  *   **NO:** The arrow is imposed by agents, language, or description.
      *   **1a. Is the dependence on the agent psychological or linguistic?**
          *   **Psychological:** **Leaf: Agent-Relative Perspectivalism.** (Awkward: Physics becomes dependent on the existence of observers.)
          *   **Linguistic:** **Leaf: Conventionalist Deflationism.** (Awkward: Makes the Second Law a matter of semantic stipulation.)
  *   **YES:** The arrow is objective. → *Go to 2.*

  **2. Is the observed gradient surprising given *only* the micro-laws and a generic (high-entropy) state?**
  *   **NO:** The gradient is a typical fluctuation or illusion of measure.
      *   **2a. Is the fluctuation local (our region) or global (the whole universe)?**
          *   **Local:** **Leaf: Boltzmann Fluctuation (Brain-in-Vat).** (Awkward: Predicts we should be minimal observers in chaos, not ordered beings.)
          *   **Global:** **Leaf: Global Measure Deflationism.** (Awkward: Requires a non-standard measure on phase space that mimics low entropy.)
  *   **YES:** Special conditions are required. → *Go to 3.*

  **3. Is the asymmetry of records and counterfactuals grounded *in* the entropy gradient, or is the entropy gradient just how the record asymmetry looks physically?**
  *   **Records Primary:** The epistemic asymmetry is fundamental; thermodynamics is derivative.
      *   **Leaf: Epistemic Fundamentalism.** (Awkward: Difficult to formulate without circularity or collapsing into Perspectivalism.) *[Note: Dana's intuition. Placed here because if records are fundamental, the thermodynamic story is downstream, separating it from standard PH views where entropy grounds records (Priya).]*
  *   **Entropy Primary:** The thermodynamic gradient grounds the epistemic asymmetry. → *Go to 4.*

  **4. Does the *increase* of entropy require a separate explanation from the *initial lowness* of entropy?**
  *   **YES:** Securing the low start does not automatically explain the increase; a further dynamical account is needed.
      *   **Leaf: [UNNAMED] (Dan's Gap).** (Awkward: Likely incoherent. Given T-symmetry, if you fix the low start, typicality *forces* the increase; demanding more implies a hidden dynamical bias.) *[Note: Dan's requested leaf. Empty because separating the two questions violates the Statistical Mechanical link between boundary conditions and typical evolution.]*
  *   **NO:** Explaining the low start exhausts the explanation for the arrow. → *Go to 5.*

  **5. Is the special low-entropy condition located at only one temporal boundary of the universe?**
  *   **NO:** The universe has a low-entropy minimum in the middle or at both ends.
      *   **5a. Is the minimum a fluctuation from equilibrium or a dynamical attractor?**
          *   **Fluctuation:** **Leaf: Symmetric Fluctuation (Old Boltzmann).** (Awkward: Suffers the same "Brain-in-Vat" problems as Leaf 2a.)
          *   **Attractor:** **Leaf: Janus Point / Two-Pasts.** (Awkward: Our 'future' is physically identical to another region's 'past'.)
  *   **YES:** The condition is at one end only (the Big Bang). → *Go to 6.*

  **6. Is the low-entropy initial condition a brute nomological fact, or derived from prior cosmological dynamics?**
  *   **Derived:** The condition is produced by a physical mechanism (e.g., inflation, cyclic models).
      *   **6a. Is the mechanism an inflationary attractor or a gravitational constraint?**
          *   **Inflationary:** **Leaf: Inflationary Cosmology.** (Awkward: Pushes the problem to the meta-laws governing the inflaton field.)
          *   **Gravitational:** **Leaf: Weyl Curvature Hypothesis.** (Awkward: Requires a specific, unproven law of quantum gravity.)
  *   **Brute:** The condition is a fundamental posit of the theory. → *Go to 7.*

  **7. Does the initial condition function merely as a constraint on the *state*, or as a law governing *probabilities*?**
  *   **State Constraint:** It is a boundary condition on the history of the universe.
      *   **Leaf: Classical Boundary Condition.** (Awkward: Lacks the modal force to support counterfactuals without additional assumptions.)
  *   **Probabilistic Law:** It constrains the probability distribution over histories (e.g., the Statistical Postulate).
      *   **Leaf: Past Hypothesis / Mentaculus.** (Awkward: Commits to a law that applies only once in the history of the universe.)

