  ### COLLAPSE NOTES
  *   **Leaf 1a (Perspectivalism) vs. Leaf 3 (Epistemic Fundamentalism):** These may collapse. If records are fundamental (Leaf 3) but not mind-independent, you end up at Perspectivalism (Leaf 1). Distinct only if one believes in objective epistemic facts without objective thermodynamic facts.
  *   **Leaf 6a (Inflation) vs. Leaf 7 (PH):** Some argue Inflation *requires* a PH to get started (low entropy patch). If so, Inflation is not a replacement for PH but a mechanism that presupposes it.
  *   **Leaf 4 (Dan's Gap):** Flagged as likely incoherent. If micro-laws are T-symmetric, the "Arrow" (increase) is mathematically entailed by the "Past" (low boundary) + Typicality. Separating them implies a misunderstanding of the Statistical Mechanical derivation.
