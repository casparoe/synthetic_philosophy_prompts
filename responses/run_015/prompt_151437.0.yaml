answer: |-
  Your TA is right, and your friend is making a category error. Test reliability (epistemology) is useless if you don't know what truth the test is measuring (ontology). If you define death as "loss of soul" but test for "no heartbeat," a 100% reliable test still gives you the wrong answer. The distinction does work: it prevents you from solving a moral problem with a better thermometer.

  Here is the spec for an adequate account of death, tested against your cases.

  ### The Spec: Requirements for an Account of Death

  **1. Determinacy (The "Time $t$" Requirement)**
  *   **Requirement:** The account must identify a specific moment when death occurs, not a gradual process.
  *   **Case/Consideration:** Inheritance, organ procurement, and withdrawing support require a binary switch (alive/dead) at a specific timestamp. You cannot inherit from someone who is "80% dead."
  *   **Status:** **Non-negotiable.** (Legal and practical necessity).

  **2. Irreversibility (The "No Return" Requirement)**
  *   **Requirement:** The cessation of function must be impossible to reverse, not merely unattempted.
  *   **Case/Consideration:** **Case 2 (DCD) & Case 5 (Tech Drift).** If circulation stops but *could* be restarted (permanent vs. irreversible), declaring death is morally equivalent to killing if you choose not to restart it. If death depends on current tech (CPR), the definition drifts.
  *   **Status:** **Non-negotiable.** (Moral necessity; otherwise, you are licensing killing).

  **3. Biological Reality (The "Not Just a Rule" Requirement)**
  *   **Requirement:** Death must track a factual state of the organism, not a social or legal stipulation.
  *   **Case/Consideration:** **Case 3 (Abdominal Pump).** If you artificially circulate the abdomen while starving the brain, is the patient dead? If the account is just a legal rule ("no brain flow = dead"), you might say yes. If it requires biological fact, you must explain why the integrated abdomen doesn't count as life.
  *   **Status:** **Non-negotiable.** (Ontological necessity; otherwise, death certificates are lies).

  **4. Organismal Integration (The "Whole Body" Requirement)**
  *   **Requirement:** Death is the loss of the body's ability to function as a coordinated whole.
  *   **Case/Consideration:** **Case 1 (Brain-dead on Vent).** The body heals wounds and gestates fetuses. If integration is the standard, is this patient alive? Whole-brain advocates argue hormonal/thermoregulatory function is mere cellular survival, not organismal integration.
  *   **Status:** **Contested.** (Whole-brain camp wants this; Higher-brain/Personhood camp says integration without consciousness is irrelevant).

  **5. Moral Significance (The "Personhood" Requirement)**
  *   **Requirement:** Death must coincide with the loss of what makes us matter morally (consciousness, agency).
  *   **Case/Consideration:** **Case 4 (PVS).** The body is integrated and breathing, but the person is gone. If death is only biological, we are keeping "corpses" alive. If death is moral, we are killing living organisms.
  *   **Status:** **Contested.** (Personhood camp wants this; Biological/Legal camp says this conflates death with the *wrongness of killing*).

  ---

  ### The Real Tension

  You guessed the tension was between "biological event" and "what we care about." The real tension is between **Biological Gradualism** and **Legal Determinacy**.

  Biology rarely offers a sharp ontological switch; cells die at different rates, and functions fade (Case 1 & 5). Law and ethics require a bright line (Requirement 1).
  *   **Which one gives?** **Biological Precision gives.** To satisfy Determinacy, we accept a *proxy* for death (e.g., "5 minutes of no pulse" in DCD) that is biologically imperfect (it is permanent, not strictly irreversible) but legally actionable. We stipulate a moment to satisfy the law, knowing the biology is a process.

  ### The Knockout Requirement

  **Irreversibility (Requirement 2).**
  This is the hardest filter. It knocks out any account that allows for potential resuscitation (challenging the DCD "permanent" standard), any account that relies on current technology limits (challenging the Tech Drift case), and any account that defines death as a moral status while the body remains biologically restorable (challenging the PVS view in a medical context). If it can be reversed, it isn't death; it's dying.

  ### The Contenders

  **Whole-Brain Standard:** Death is the irreversible loss of all brain function.
  *   *Verdict:* Satisfies Determinacy and Law, but struggles with Biological Reality (Case 1: somatic integration remains) and requires conflating "brain stem function" with "organismal integration."

  **Circulatory-Respiratory Standard:** Death is the irreversible cessation of circulation and breathing.
  *   *Verdict:* Biologically robust historically, but fails Determinacy and Irreversibility in the age of CPR/ECMO (Case 2 & 5), forcing a reliance on "permanence" which is a moral choice, not a biological fact.

  **Higher-Brain (Personhood) Standard:** Death is the irreversible loss of consciousness/capacity for relationship.
  *   *Verdict:* Satisfies Moral Significance (Case 4), but fails Biological Reality and Legal Non-negotiability (we do not legally treat PVS patients as corpses), collapsing death into "no longer a person."
