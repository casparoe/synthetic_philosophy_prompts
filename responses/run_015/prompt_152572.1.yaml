prompt: |-
  I'm currently enrolled in an upper-level seminar on distributive justice, dynastic wealth, and equality of opportunity, and during a discussion about breaking up intergenerational fortunes someone dismissed a proposed inheritance tax with the line that "inheritance taxes are double taxation — the income was already taxed once when it was earned, so taxing it again on transfer is unfair." I want you to act as a professional philosopher specializing in political philosophy and economic justice, and to think carefully before you answer: please begin with a brief internal brainstorming of the hidden premises that could be packed into that phrase. Then, writing entirely in continuous prose — please use no headings, no bullet points, no bold text, and no tables, as if composing a formal letter or email — lay out the menu of distinct precise theses that "double taxation" might actually be expressing, ranging from the trivially true to the radically normative. For each reading, specify what kind of "taxation" is being counted and what kind of "same money" or "same moral claim" it presupposes; say whether it depends on a Lockean-style view of property rights extending past death, on a distinction between legal incidence and economic incidence, or on a separate moral entitlement thesis that treats the heir's receipt as an extension of the decedent's will; and indicate for each whether the reading is plausible in its own right and whether it actually delivers the conclusion that inheritance taxes are unjust. In particular, address whether the slogan survives the injection of a relevant but often overlooked complication — that a substantial share of inherited wealth consists of unrealized capital gains that have never been subjected to income taxation — and tell me which of the precisified readings, if any, still support the dismissal once that complication is on the table. I need this for office hours, so please organize the readings as a menu I can walk through with my professor rather than collapsing them into a single interpretation.
