answer: |-
  Dear Student,

  It is excellent that you are engaging critically with the objections raised during seminar, and the claim that inheritance taxes constitute double taxation is indeed a fertile ground for philosophical analysis. Before we dissect the specific arguments, it is useful to briefly unpack the hidden premises packed into that phrase, as slogans often compress complex normative and empirical claims into a single digestible line. When someone asserts that inheritance taxes are double taxation, they are implicitly relying on a specific counting rule for what constitutes a tax event, a specific definition of the taxpayer identity across time, and a specific theory of property rights that views wealth accumulation and wealth transfer as a single continuous moral claim rather than distinct legal events. The phrase assumes that the moral legitimacy of taxation is exhausted after the first levy, that the economic substance of the money remains identical despite the change in legal ownership, and that the state's claim on resources diminishes after the initial income tax is paid. By treating these assumptions as visible variables rather than fixed truths, we can see that the objection is not a single argument but a cluster of distinct possibilities ranging from trivial accounting observations to robust libertarian principles.

  To help you navigate this during office hours, I have organized these possibilities into a menu of distinct precise theses that the slogan might be expressing. The first reading is the literal accounting view, which counts taxation based on the physical currency or the specific pool of assets. On this reading, the same money is being taxed twice because the dollars earned by the decedent are the same dollars passed to the heir. This depends on a view of money as a static substance rather than a medium of exchange subject to periodic levies on different transactions. While trivially true in the sense that the same funds are involved, this reading is philosophically weak because it proves too much; under this logic, sales taxes would be double taxation because the money used to buy a good was already taxed as income, and indeed almost all transaction taxes would be unjust. Consequently, this reading fails to deliver the conclusion that inheritance taxes are uniquely unjust, as it would condemn the entire tax system.

  The second reading focuses on legal incidence, asking whether the same legal entity is being taxed twice on the same economic base. This depends on a distinction between the decedent and the heir as separate taxpayers. If the income tax was paid by the earner and the estate tax is paid by the estate or the heir, then legally speaking, two different entities are being taxed on two different events: earning and transferring. This reading presupposes that the moral claim attaches to the legal person rather than the family unit. It is highly plausible from a standard legal theory perspective and suggests that the double taxation claim is category error. However, proponents of the objection often reject this distinction, implying a third reading based on economic incidence or the unitary family view. This thesis argues that the economic burden ultimately falls on the same dynastic unit, so taxing the transfer reduces the total wealth available to the lineage just as taxing the income did. This depends on treating the family as a single economic agent over time. While plausible descriptively, it does not inherently prove injustice unless one assumes that dynastic wealth accumulation should be immune from periodic reduction, which is a normative claim rather than a factual one about double taxation.

  The fourth reading is the most philosophically robust and relies on a Lockean-style view of property rights extending past death. This thesis posits that once income is legitimately earned and taxed, the remaining property is fully owned by the individual, and full ownership includes the right to transfer that property without further state interference. Here, the same moral claim being violated is the owner's absolute dominion over their holdings. This reading does not depend on legal incidence but on a moral entitlement thesis that treats the heir's receipt as an extension of the decedent's will and property rights. If one accepts this premise, the tax is unjust not because it is double taxation in an accounting sense, but because it infringes on the right of bequest. This reading is plausible within libertarian frameworks but is rejected by egalitarian theories that view property rights as conventional and subject to social adjustment for equality of opportunity. It delivers the conclusion of injustice only if one accepts the prior normative premise that property rights are absolute and transgenerational.

  A fifth reading treats the heir's receipt as a distinct accessions tax, where the injustice lies in taxing the heir for something they did not earn, but the double taxation slogan is used to shield the decedent's prior effort. This depends on a moral entitlement thesis that treats the transfer as a completion of the decedent's labor project. If the decedent labored to provide for their children, taxing that provision frustrates the moral purpose of the original labor. This is plausible if one views family provision as a primary social good, but it conflicts with the view that equality of opportunity requires limiting the advantage conferred by birth. Like the Lockean view, this delivers a conclusion of injustice only if one prioritizes parental autonomy over distributive equality.

  Now we must address whether the slogan survives the injection of a relevant but often overlooked complication, which is that a substantial share of inherited wealth consists of unrealized capital gains that have never been subjected to income taxation. In many jurisdictions, assets appreciate in value over a lifetime without triggering an income tax liability until they are sold, and upon death, these gains are often forgiven via a step-up in basis. This means the premise that the income was already taxed once is frequently factually false. When this complication is placed on the table, the first three readings collapse or are significantly weakened. The literal accounting view fails because the money was not taxed once when earned if it represents untaxed appreciation. The legal incidence view remains technically correct but loses the rhetorical force of the double taxation claim since there was no first tax on that portion of the wealth. The economic incidence view also loses force because the dynastic unit enjoyed untaxed growth.

  However, the fourth and fifth readings, those based on Lockean property rights and moral entitlement, may still support the dismissal even once this complication is on the table, though they must shift their ground. These readings do not rely on the factual claim that prior taxation occurred, but rather on the normative claim that the owner has a right to transfer whatever they hold, regardless of whether the state previously taxed the accretion of value. For these readings, the injustice lies in the infringement of the right to bequest, not in the double counting of tax liabilities. Therefore, if your seminar partner is relying on the factual claim that the money was already taxed, their argument is vulnerable to the unrealized capital gains objection. But if they are relying on the deeper normative claim that property rights include the right to transfer untaxed wealth to heirs, the capital gains complication does not refute their position, though it does clarify that their objection is about property rights rather than double taxation. I hope this menu provides you with the precise distinctions needed to advance the discussion in office hours.

  Sincerely,

  Your Professor
