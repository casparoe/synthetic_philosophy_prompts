answer: |-
  You have identified a genuine mechanism of human communication that sits in the blind spot between standard linguistics, pragmatics, and intercultural training. Your intuition is correct: standard Gricean pragmatics cannot explain this, and "cultural norms" is too vague to be useful.

  Here is the breakdown of the phenomenon, the nearest established concepts, the boundaries of your "dial" theory, and the ethical implications for your workshop.

  ### 1. Naming the Phenomenon

  There is no single common noun for this, but in linguistics and philosophy of language, it is a specific intersection of **Pragmatic Markedness** and **Social Indexicality**.

  **The Established Notions (and where they stop short):**

  *   **Markedness:** Your linguist friend was pointing in the right direction. In linguistics, an "unmarked" form is the default (e.g., *lion*), and a "marked" form carries specific extra information (e.g., *lioness*). In pragmatics, this applies to style. A direct command is often unmarked in a crisis; a hedged request is marked.
      *   *Where it falls short:* Traditional markedness is often static (Form A is marked, Form B is not). Your observation is dynamic: Form A is unmarked for Speaker X but marked for Speaker Y, or unmarked at Time 1 but marked at Time 2. It is **Baseline-Relative Markedness**.
  *   **Gricean Implicature:** This is the standard model for "what is meant but not said."
      *   *Where it falls short:* You correctly identified the dealbreaker. Gricean (Conversational) Implicature is **cancellable**. If I say, "It's cold in here," implying "close the window," I can add, "...but I'm not asking you to close the window," and the implication vanishes. In your examples, the implication *does not vanish*. The Japanese engineer cannot say, "I know he is Dutch, so I cancel the insult." The hurt remains. This means the meaning is not a logical inference about intent; it is a structural feature of the signal.
  *   **Conventional Implicature:** This is the technical term for meaning that is attached to a word or form, is not truth-conditional, and is **not cancellable**. (Example: "He is poor but honest." The word *but* implies a contrast between poverty and honesty. You cannot say, "He is poor but honest, and I don't mean to imply a contrast.")
      *   *The Fit:* Your "packaging" functions as a Conventional Implicature of **Relational Stance**. The meaning is baked into the form relative to the baseline, not derived from the speaker's specific intent.

  **The Term for Your Workshop:**

  Since no single word exists, I propose you use **Relational Markedness**.

  **Definition:** *Relational Markedness is the social meaning generated when a communicative act deviates from the expected baseline of packaging (politeness, directness, formality) for a specific speaker-community pair. The meaning is carried by the delta (the deviation), not the content, and it is non-cancellable because it is processed as a status signal rather than a propositional claim.*

  ### 2. Boundaries: Does the "Dial" Over-Generate? (Question b)

  You asked if your formula is too wide. If *any* deviation carries meaning, does a foreign accent or a grammatical slip count? If so, the concept becomes useless because everything is signal.

  There is a hard boundary here. It lies between **Stance** and **Competence**.

  *   **The Dial (Relational Markedness):** Controls *Stance*. This includes politeness markers, hedging, directness, and honorifics. These are **selectable registers**. A competent speaker *could* choose the blunt form but chooses the soft one (or vice versa). Because it is selectable, the choice is interpreted as volitional social positioning.
      *   *Example:* The Dutch manager switching to hedging. He *can* speak bluntly. He chose not to. Therefore, the choice signals a change in the relationship (crisis/favor).
  *   **The Noise (Identity/Error):** Controls *Competence/Identity*. This includes accent, grammatical slips, or vocabulary limitations. These are generally **non-selectable traits** in the moment.
      *   *Example:* A Japanese engineer speaking English with a accent. This deviates from the "native baseline," but it is not interpreted as a relational signal (e.g., "I am insulting you with my accent"). It is interpreted as an identity marker ("I am Japanese") or a competence constraint ("I am struggling").

  **The Boundary Test:**
  Ask: *Could the speaker have produced the "default" version without significant effort or loss of identity?*
  *   If **Yes** (e.g., removing "sorry to bother you"), then deviation is **Relational Markedness**. It carries ethical weight.
  *   If **No** (e.g., changing a native accent, fixing a slip caused by lack of vocabulary), then deviation is **Indexical Noise**. It carries sociological data but not relational intent.

  Your "dial" theory holds, provided you define the dial as controlling *volitional pragmatic packaging*, not *linguistic capability*.

  ### 3. The Ethics of Polite Falsehoods (Question c)

  This is the crux of your workshop. If the Japanese "I will consider it" means "No," is it a lie? If the Dutch manager uses softening for a small request, is it deception?

  Your formula leads to a counter-intuitive but robust ethical conclusion: **Deception is not about the truth of the proposition; it is about the calibration of the relational signal.**

  **Case 1: The Japanese Refusal ("I will consider it")**
  *   **Propositional Content:** False (He is not considering it).
  *   **Illocutionary Force:** True (He is refusing).
  *   **Verdict:** This is **not a lie**. It is a **Ritualized Performative**. In this context, the function of the utterance is not to describe the manager's future mental states (prediction) but to execute a social action (refusal) while preserving face. Both parties understand the code. There is no intent to induce a false belief about the *outcome*, only to soften the *delivery*.
  *   **Ethical Status:** Permissible social lubricant. The "falsehood" is in the grammar, not the contract.

  **Case 2: The Dutch Softening ("Sorry to bother you...")**
  *   **Propositional Content:** True (He is making a request).
  *   **Relational Signal:** "This is a high-cost request" or "I am in a vulnerable position." (Based on the local baseline).
  *   **Reality:** It is a routine request.
  *   **Verdict:** This **is deceptive**. By using a marked form (high packaging) for an unmarked situation (routine request), the speaker manipulates the listener's emotional preparation. The listener allocates cognitive resources and emotional weight based on the signal.
  *   **Ethical Status:** Problematic. It creates **Pragmatic Friction**. It forces the recipient to wonder, "What is wrong?" When they find out nothing is wrong, trust erodes. It is "crying wolf" via politeness.

  **The Distinction You Need:**
  You must distinguish between **Content Truth** (does the map match the territory?) and **Signal Calibration** (does the volume match the message?).

  *   **High-Context (Japan):** The system prioritizes *Signal Calibration* (maintain harmony) over *Content Truth* (explicit refusal). The "lie" is the agreed-upon protocol for a truthful refusal.
  *   **Low-Context (Netherlands):** The system prioritizes *Content Truth* (efficiency) over *Signal Calibration*. Using high-packaging signals for low-stakes content is a **Calibration Error**.

  **Conclusion for the Workshop:**
  Do not teach them that "white lies are fine in Japan but not in Holland." That is the "different norms" trap you wanted to avoid.

  Teach them this: **Packaging is Data.**
  1.  **In Japan:** Understand that softening is not data about the *request*; it is data about the *relationship*. Do not parse the words for truth; parse the form for the decision.
  2.  **In Holland:** Understand that softening *is* data about the *request*. If you use it unnecessarily, you are transmitting false data about the urgency or weight of the task.
  3.  **The Ethical Rule:** You are ethically responsible for the **Relational Markedness** of your message. If you deviate from the baseline, you must ensure the deviation matches the relational reality.
      *   *Japanese Manager:* It is ethical to use the ritual refusal because the "No" is clearly encoded in the ritual.
      *   *Dutch Manager:* It is unethical to use ritual softening for a routine task, because the "Crisis" signal is encoded in the softening, and there is no crisis.

  ### Summary for Your Slides

  *   **Term:** **Relational Markedness**.
  *   **Mechanism:** Meaning is derived from the **delta** (deviation) from the local baseline, not the absolute value.
  *   **Property:** **Non-cancellable.** Cognitive knowledge of cultural difference does not disable the emotional reception of the signal.
  *   **Boundary:** Applies to **selectable packaging** (stance), not **fixed traits** (accent/competence).
  *   **Ethics:** Lying is not just falsifying content; it is **miscalibrating the signal**. Using high-packaging for low-stakes requests in a direct culture is a form of deception because it manipulates the recipient's emotional weighting.

  This framework allows you to move beyond "Dutch are direct, Japanese are polite" into "Here is how the *change* in your tone is being read as a signal, regardless of your intent."
