  **Diagnosis 1: The Libertarian Stop (Reject 5 via Indeterminism).**
  We claim that the will *is* ultimately uncaused by genes/upbringing. This makes (5) false because the trying *is* within control in the ultimate sense.
  *Cost:* This conflicts with a scientific worldview and risks making choices random rather than controlled, which might undermine desert anyway.

  **Diagnosis 2: The Agency Boundary (Reject 4).**
  We claim there is a principled place to stop the "Severance Test"—at the boundary of the agent. Outcomes are external; the will is internal. Uniformity doesn't apply across that boundary.
