answer: |-
  Here are ten interview questions designed for a 45-minute podcast episode. They are sequenced to build a tight argumentative arc, moving from mechanism to methodology, then to theoretical scope, and finally to falsification.

  **1. The Mechanism of Interaction**
  "You argue that 'normative contamination' arises from an interaction between norm-violation detection and plan structure. Can you specify the cognitive mechanism here: does the status of an outcome as a 'means' simply amplify the signal of a norm violation, or does it fundamentally change the *type* of processing applied to that violation?"

  **2. Multiplicative vs. Threshold (Follow-up)**
  "Let's press the math of that interaction. Is this a multiplicative relationship, where intentionality ratings scale continuously with the severity of the norm violation, or is it threshold-based, where crossing a normative line triggers a binary shift in how the plan is parsed? Which does your data suggest, and why does that matter for the cognitive architecture?"

  **3. Isolating Normativity from Affect**
  "Skeptics will argue that treating harm as a means simply increases the salience or negative affect of the scenario, regardless of norms. What specific control conditions are required to isolate 'normative contamination' from these generic affective priming effects?"

  **4. The Matched-Valence Reply (Follow-up)**
  "You'll likely reply that matched-valence vignettes already control for affect. But if the *structure* of a means-end relation inherently commands more attention than a byproduct, isn't there a residual salience asymmetry that your controls might miss, effectively confounding plan-structure with cognitive load?"

  **5. The Original Knobe Vignettes**
  "In the original Knobe vignettes, both the harm and the help are byproducts. Does your account deny the asymmetry exists in those specific cases, explain it away as a different phenomenon, or treat it as a baseline that your 'means' manipulation is designed to override?"

  **6. Modular Architecture**
  "This implies a modular architecture where plan-structure parsing and norm-detection operate independently before contaminating the intentionality judgment. How does this modularity distinguish your view from standard moral-evaluation accounts that claim moral judgment *constitutes* the intentionality judgment?"

  **7. The Collapse Objection (Follow-up)**
  "If the 'contamination' only occurs when norms are violated, aren't you effectively smuggling moral evaluation back in as the primary driver, just renaming the mechanism? Where is the bright line between 'normative contamination' and 'moral evaluation'?"

  **8. Epistemic Access to Plans**
  "Your theory relies heavily on the agent's plan structure. But subjects don't see the agent's mind; they infer it. Are you arguing subjects are reconstructing the plan accurately, or that they are projecting a 'default' plan structure onto the agent based on the outcome?"

  **9. Theoretical Stakes**
  "If you're right, this undermines the use of the Knobe effect as evidence for the 'Deep Self' or 'Moral Impact' theories. What broader theory of mind or action attribution collapses if your revisionist reading gains traction?"

  **10. Falsification Conditions**
  "Finally, let's talk falsification. What specific experimental result—perhaps a null reversal, or a reversal that tracks means-status regardless of moral valence—would genuinely disconfirm your thesis rather than prompting only a parameter adjustment?"
