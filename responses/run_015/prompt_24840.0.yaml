answer: |-
  Here is a complete lesson plan designed for a 90-minute graduate seminar. It treats the students as "pre-measurement agents" and uses a token economy to simulate the decision-theoretic pressure of the Everettian framework.

  ### 1. Game Title: The Fission Wager

  **Objective:** Players must allocate resources to outcomes of a quantum measurement. The game mechanics simulate the Many-Worlds Interpretation (MWI): *all* outcomes occur, and the player is copied into every branch. The goal is to maximize "Total Existence Utility" (the sum of payoffs across all your future copies).

  **Currency:** "Existence Points" (EP). No real money. The winner receives a printed "Stable Decision-Maker" certificate and the right to choose the reading for the next week.

  #### The Rules
  1.  **The Agent:** Each student is a "Pre-Measurement Agent."
  2.  **The Wager:** Each agent starts with **100 Tokens**. Before the measurement, they must distribute these tokens across the available **Branch Labels** (e.g., "Outcome A," "Outcome B").
  3.  **The Measurement (Fission):** The Instructor (acting as "Nature") reveals the **Branch Structure**.
      *   *Crucial Rule:* In this game, **you do not lose copies.** You become every copy. Your score for the round is the **sum** of the payoffs received by every copy of you.
  4.  **Payoff Calculation:**
      *   If a copy of you exists in a branch you bet on, that copy wins the tokens allocated to that branch.
      *   If a copy exists in a branch you did *not* bet on, that copy wins 0.
      *   **Total Score** = $\sum$ (Tokens won by each copy).
  5.  **The Trap:** Nature can change the *number* of branches associated with an outcome without changing the *amplitude* (physical weight) of that outcome.

  ---

  ### 2. Quantum States & Branch Structures

  You need two rounds. The physical state (amplitudes) remains identical, but the "branch count" (the basis decomposition) changes.

  **The Fixed State:**
  $$ |\psi\rangle = \sqrt{\frac{1}{2}} |A\rangle + \sqrt{\frac{1}{2}} |B\rangle $$
  *Amplitude Squared (Born Weight):* $A = 0.5$, $B = 0.5$.

  **Round 1: The Coarse Grain**
  *   **Branch Structure:**
      *   Outcome A: **1 Branch** (Weight 0.5)
      *   Outcome B: **1 Branch** (Weight 0.5)
  *   **Total Branches:** 2
  *   **Intuitive Trap:** Branch Counting suggests A and B are equally likely (1 vs 1). Born Rule agrees (0.5 vs 0.5).

  **Round 2: The Fine Grain (The Trap)**
  *   **Branch Structure:**
      *   Outcome A: **1 Branch** (Weight 0.5)
      *   Outcome B: **9 Branches** (Each Weight $0.5/9 \approx 0.055$)
      *   *Note:* Explain to students that Outcome B is a "degenerate" outcome that can be physically subdivided (e.g., particle spin UP vs. particle spin UP + detector microstate 1...9).
  *   **Total Branches:** 10
  *   **Intuitive Trap:** Branch Counting suggests B is 9x more likely than A (9 branches vs 1). Born Rule says they are still equal (0.5 vs 0.5).

  ---

  ### 3. Roles

  1.  **The Agents (9 Students):** They place the bets. They are trying to maximize their Total Existence Utility.
  2.  **The Splitter (Instructor):** You control the Branch Structure. You reveal Round 1, collect bets, pay out. Then reveal Round 2, collect bets, pay out.
  3.  **The Auditor (1 Student):** Their job is not to bet, but to track the **Consistency of Strategy**. They must record whether the "best strategy" changed between Round 1 and Round 2, despite the amplitudes remaining identical.

  ---

  ### 4. Timeline (90 Minutes)

  **00:00 – 00:15: Setup & Rules**
  *   Distribute tokens (paper chips).
  *   Explain the "Fission Rule": *You are not picking one future; you are summing over all futures.*
  *   **Do not mention Everett, Born, or Probability yet.** Frame it as a resource allocation puzzle.
  *   *Script:* "In this game, when the measurement happens, you don't die in the losing branches. You exist in all of them. Your score is the total happiness of all your future selves."

  **00:15 – 00:35: Round 1 (Coarse Grain)**
  *   Reveal Structure: 1 Branch A, 1 Branch B.
  *   Students allocate 100 Tokens.
  *   **Payoff:** Calculate scores.
      *   *Example:* Student bets 100 on A. Copy A gets 100. Copy B gets 0. Total = 100.
      *   *Example:* Student bets 50/50. Copy A gets 50. Copy B gets 50. Total = 100.
  *   *Observation:* In Round 1, strategy doesn't matter much for the *sum*, but students will naturally gravitate toward 50/50 to "hedge."

  **00:35 – 00:55: Round 2 (Fine Grain)**
  *   Reveal Structure: 1 Branch A, 9 Branches B.
  *   **Crucial:** Remind them the *amplitudes* (the "physics") are unchanged from Round 1. Only the description of the branches changed.
  *   Students allocate 100 Tokens.
  *   **Payoff:**
      *   *Branch-Counter Strategy:* If a student bets on B because "there are more of me there," they allocate 100 to B.
          *   Copy A (1 person): 0 points.
          *   Copy B (9 people): 100 points each.
          *   **Total Score:** 900.
      *   *Amplitude Strategy:* If a student bets 50/50.
          *   Copy A (1 person): 50 points.
          *   Copy B (9 people): 50 points each.
          *   **Total Score:** 50 + (9 * 50) = 500.
  *   *The Shock:* The "Branch Counter" wins massively (900 vs 500). The class will cheer for Branch Counting.

  **00:55 – 01:10: The Audit & The Crisis**
  *   Ask the **Auditor**: "Did the physics change between Round 1 and Round 2?" (No).
  *   Ask the **Agents**: "If you knew Round 2 was coming in Round 1, would you have bet differently?"
  *   Ask: "If I can make Outcome B win simply by describing it as 9 branches instead of 1, have I changed the physics? Or have I just gamed your scoring rule?"
  *   *The Pivot:* Tell them you are changing the **Payoff Rule** for Round 3 (hypothetical).
  *   **New Rule:** "Branch Weighting." Each branch pays out its tokens *multiplied by its Amplitude Squared*.
      *   Round 1: A (1 * 0.5), B (1 * 0.5).
      *   Round 2: A (1 * 0.5), B (9 * 0.055).
      *   Now, betting on B in Round 2 yields the *same* weighted utility as Round 1. The strategy stabilizes.

  **01:10 – 01:30: Debrief (The Philosophy)**
  *   Connect the game mechanics to the Everettian problems. (See Section 5 below).

  ---

  ### 5. The Debrief: Mapping Mechanics to Philosophy

  Do not lecture. Use the Socratic method to draw the connections out of their frustration during the game.

  **1. The Disorientation (Incoherence Problem)**
  *   *Ask:* "In Round 2, when you bet on B, did you feel uncertain? Or did you feel like you were just accounting for inventory?"
  *   *Point:* In MWI, there is no single uncertain future. The anxiety of betting comes from caring about *which* copy you are (self-locating uncertainty), but the game forced you to care about *all* copies. This mirrors the **Incoherence Problem**: If everything happens, what does 'probability' mean?
  *   *Takeaway:* Probability in MWI cannot be about "what will happen" (everything happens). It must be about "how much I care" about each branch.

  **2. The Failure of Branch Counting (The Quantitative Problem)**
  *   *Ask:* "Why did the Branch Counting strategy explode in Round 2? Was it rational?"
  *   *Point:* It was rational *given the rules*, but the rules were basis-dependent. You could change the 'winner' just by redrawing the boundaries of the branches (decomposing the Hilbert space differently).
  *   *Takeaway:* A physical probability rule cannot depend on how we choose to count branches. Branch count is not a physical invariant; amplitude is. This is why **Branch Counting is unstable**.

  **3. The Stability of Amplitude (The Born Rule)**
  *   *Ask:* "When we switched to the Weighted Payoff (Amplitude Squared), what happened to your strategy?"
  *   *Point:* It became stable. You didn't need to know how many sub-branches B had. You only needed the amplitude.
  *   *Takeaway:* This points toward the **Deutsch-Wallace Theorem**. They argue that if you want your decisions to be consistent (not gameable by branch-splitting), you *must* act as if the weight of a branch is its squared amplitude. The Born Rule isn't a law of physics added on top; it's a rule of rational decision-making in a branching universe.

  ---

  ### 6. Troubleshooting: What Will Go Wrong

  **Problem 1: "I don't care about my other copies."**
  *   *Symptom:* Students treat the game as standard probability ("I'll only experience one outcome").
  *   *Fix:* You must enforce the "Summation Rule" ruthlessly. If a student says "But I won't be the guy in Branch B," correct them: "In this game, you are the Wavefunction. You are everyone. If 9 copies of you starve, your Total Utility drops."
  *   *Philosophical Note:* Use this in the debrief. This is the **Ethical Problem** of MWI. Why *should* I care about my duplicates? The game assumes Utilitarianism across selves; the philosophy questions if that's justified.

  **Problem 2: Arithmetic Overload.**
  *   *Symptom:* Students get bogged down calculating $0.5/9$ and miss the conceptual point.
  *   *Fix:* Use a projected spreadsheet. Have the **Auditor** run the numbers. Keep the fractions simple (1 branch vs 9 branches).
  *   *Simplification:* If 9 is too messy, use 1 Branch A vs 3 Branches B (Amplitudes $\sqrt{0.25}$ and $\sqrt{0.75}$).

  **Problem 3: "This proves MWI is wrong."**
  *   *Symptom:* Students conclude that because Branch Counting fails, MWI fails.
  *   *Fix:* Steer them back. "Branch Counting failing doesn't kill MWI; it kills *Branch Counting*. The question is: Is there a weighting that *doesn't* fail? That's what the Born Rule attempts to be."

  ---

  ### 7. Limitations: What You Must Supply

  Be frank with your students that the game cannot simulate everything. You must supply these three points in the debrief:

  1.  **Subjective Uncertainty:** The game forces them to calculate from a "God's eye view" (summing all copies). Real agents feel self-locating uncertainty ("Which one am I?"). The game bypasses the hard work of explaining *why* that feeling arises if determinism is true.
  2.  **The Origin of Weight:** The game *gives* them the amplitudes. It doesn't explain *why* nature provides amplitudes that behave like probabilities. The Deutsch-Wallace argument tries to derive this from rationality, but the game just hands it to them as a "fix."
  3.  **Continuous Branching:** The game uses discrete rounds. In real MWI, branching is continuous and ubiquitous. The "counting" problem is even worse in reality because the number of branches is effectively infinite/undefined, making counting impossible even in principle.

  ### Instructor's Cheat Sheet for the "Trap"
  *   **Round 1 Payoff (Bet 100 on B):** 1 Copy wins 100. **Total = 100.**
  *   **Round 2 Payoff (Bet 100 on B):** 9 Copies win 100. **Total = 900.**
  *   **The Insight:** If you maximize "Number of Happy Copies," you must change your bet from Round 1 to Round 2. But the *state* didn't change. Therefore, "Number of Happy Copies" is not a physical invariant. It is a bad basis for probability.
  *   **The Born Fix:**
      *   Round 1: 1 Copy * 0.5 Weight = 0.5 Utility.
      *   Round 2: 9 Copies * 0.055 Weight = 0.5 Utility.
      *   **Strategy remains stable.**
