  **CONCILIATE & BIND ARBITRATION SERVICES**
  **STANDARD TERMS OF ENGAGEMENT (v. 4.2)**

  **1. Certification of Epistemic Parity**
  Prior to adjudication, Parties must mutually certify each other as epistemic peers regarding the disputed proposition. Should Parties disagree on the validity of this certification, the disagreement shall be classified as a Level 1 Dispute regarding Peer Status. This triggers a mandatory Level 2 Peer Review. Should Parties disagree on the eligibility for Level 2 Review, the matter escalates to Level 3 Review. Each escalation level incurs a separate administrative fee. The Firm assumes no liability for infinite regress loops generated during certification.

  **2. Equal Weight Adjustment**
  Upon successful certification, Parties shall adjust their reported credences to the arithmetic mean of their initial positions. Should Parties disagree on whether this clause applies to their specific disagreement, a Self-Application Surcharge is levied. In such instances, the settlement value shall iterate, approaching the midpoint of the preceding midpoint until variance falls below the billable threshold.

  **3. Independence Rider**
  No credence adjustment is owed where Parties' evidence bases are not independent or where reasons have not been fully pooled. While evidence pooling is available, it is disabled by default to optimize processing speed and revenue retention. Clients waiving the pooling requirement acknowledge that unresolved evidentiary overlaps may invalidate subsequent conciliations.

  **4. Service Tiers and Conviction Storage**
  Standard Conciliation includes basic credence averaging. The Premium Right Reasons Package (3x base fee) permits Parties to submit statements of reasons; however, to maintain neutrality, Firm personnel shall hold such statements unread. The Steadfast Option (5x base fee) permits retention of original credences. Clients selecting Standard Conciliation are subject to the Spinelessness Disclaimer: clients who conciliate with all peers may retain zero convictions. Residual Conviction Storage is available for such clients at a monthly rate.

  **5. Prohibition on Bootstrapping**
  Parties may not downgrade a peer's status solely to maintain original credences. Compliance Auditors verify this prohibition. To ensure impartiality, Auditors are required to sit at the midpoint (0.5 credence) of all client claims. Consequently, Customer Service cannot confirm whether parcels have shipped, as Auditors possess only 50% confidence in logistical reality.

  **6. Fee Schedule**
  *   Level 1 Peer Certification: $450.00
  *   Level 2 Review: $900.00
  *   Level 3 Review: $1,800.00
  *   Self-Application Surcharge: 15% per iteration
  *   Residual Conviction Storage: $49.99/month

  **7. Binary Outcomes and Non-Midpoint Propositions**
  Where the disputed question admits no numeric midpoint (e.g., Proposition A vs. Proposition B), the Firm's logic requires equitable implementation of both states. In matters of physical disposition, the remedy shall follow the arithmetic mean of the requested actions. For disputes regarding Burial versus Cremation, the Firm shall effectuate an Equitable Partitioning of Remains, ensuring 50% of the subject is interred and 50% is cremated. Clients hereby waive all rights regarding bodily integrity upon signing.
