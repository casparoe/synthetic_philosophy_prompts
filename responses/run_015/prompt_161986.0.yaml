  Brainstorming: I considered a crux centered on the "non-canonical root" problem to challenge agent identity, but rejected it because it invites generic metaphysics of selfhood rather than technical analysis of the deliberative structure. I also considered a crux on "deliberative transparency" regarding compression at merge nodes, but rejected it as too phenomenological, risking drift into consciousness debates rather than epistemic justification. I selected the asymmetry between locally and globally checkable tasks because it forces students to apply the provided operational definitions to the normative status of the output, requiring structural analysis rather than literature recall.

  ***

  **FINAL EXAMINATION: DELEGATED COGNITION**
  **Section B: Essay Question (20 Marks)**
  **Time Allowed: 90 Minutes | Word Limit: 1,200 Words**

  **Question 2**

  Consider a recursive cognitive architecture composed of nodes. Each node performs exactly one of three operations: **DECOMPOSE** (splitting a task into subtasks), **SOLVE** (answering a task directly without further delegation), or **MERGE** (combining child answers into a parent answer). We distinguish two task types. A task is **Locally Checkable** if, for any candidate answer, the question "is this correct?" can be Decomposed into subtasks strictly easier than producing the answer. A task is **Globally Checkable** if settling correctness requires a MERGE operation that is not easier than producing the answer.

  Assume the following empirical premise as true: Observed reliability gains from amplification are concentrated exclusively in Locally Checkable tasks; for Globally Checkable tasks, increasing the depth of the tree yields no reliability improvement over a single node.

  Given this premise, does the recursive structure still model *deliberation* for Globally Checkable tasks, or does it collapse into mere *causal processing*? In your answer, focus specifically on the normative status of the MERGE operation. Does the failure of reliability gains imply that the root node cannot endorse the output as a conclusion of reasoning, even if the procedure was followed correctly?

  ***

  **MODEL ANSWER**

  The question asks whether a recursive amplification structure models deliberation or mere causal processing when applied to Globally Checkable tasks, given the stipulated empirical premise that reliability gains do not scale for such tasks. I argue that under these conditions, the structure collapses into causal processing for Globally Checkable tasks because the MERGE operation loses the normative force required for deliberative endorsement. While the procedural syntax of reasoning remains, the semantic link between the sub-answers and the final conclusion is broken, rendering the root node's output a product of mechanism rather than insight.

  To see this, we must distinguish the role of MERGE in Locally versus Globally Checkable contexts. In Locally Checkable tasks, the definition stipulates that verification is easier than generation. Here, a MERGE operation functions primarily as a verification gate. When a node merges child answers, it is effectively checking consistency against a ground truth that is accessible via easier subtasks. If the empirical premise holds—that reliability gains occur here—it suggests the recursive structure successfully isolates errors. The root node can endorse the output because the MERGE operation validates the path taken; the node understands *why* the answer is correct because the check was computationally cheaper than the generation. The transparency of the verification allows the root to adopt the conclusion as its own reasoned judgment.

  However, in Globally Checkable tasks, correctness cannot be settled by easier subtasks; it requires a MERGE that is as difficult as producing the answer. Here, MERGE is not verification but synthesis. The node must create new content to combine the children's outputs into a coherent whole. If the empirical premise is true—that reliability does not improve with depth—it implies that adding more nodes does not clarify the synthesis. Instead, it merely distributes the cognitive load of a difficult judgment across multiple agents without increasing the likelihood of correctness.

  This asymmetry strikes at the heart of deliberation. Deliberation requires not just producing an answer, but holding that answer for reasons. In the Globally Checkable context, if reliability does not scale, the root node receives a synthesized answer from its children but lacks the capacity to verify the synthesis via easier means (by definition of Global Checkability). Consequently, the root node cannot distinguish between a correct synthesis and a plausible-looking error generated by the tree's complexity. The MERGE operation becomes a black box function: inputs go in, an answer comes out, but the justificatory link is opaque.

  One might object that the root node still endorses the *procedure*, even if it cannot verify the specific output. If the root node delegates based on a trusted protocol, does that not count as deliberation? This view treats the architecture as a tool the agent uses, rather than constituting the agent's deliberation itself. However, the prompt asks if the structure *models* deliberation. A model of deliberation must preserve the connection between reasoning steps and justified belief. If the reliability gains are absent, the steps do not converge on truth any better than a single guess. Endorsing a procedure that yields no reliability gain on difficult tasks is not reasoning; it is ritual. The root node is causally processing the outputs of its children, but it cannot normatively endorse the conclusion as superior to a singleton guess.

  Furthermore, the definition of Globally Checkable tasks implies that the MERGE operation carries the full weight of the cognitive difficulty. If the tree depth increases without reliability gains, the additional MERGE operations are merely adding noise or latency, not insight. In a deliberative model, breaking a task down should illuminate the solution. Here, for Global tasks, the decomposition hides the difficulty within the final MERGE. The root node sees only the final synthesis. Without the ability to check that synthesis via easier subtasks (which is excluded by the definition of Global Checkability), the root node is in the same epistemic position as a single node guessing the answer, merely padded by intermediate steps it cannot validate.

  Therefore, the structure fails to model deliberation for Globally Checkable tasks. It models a distributed causal process that outputs judgments, but without the scaling of reliability, the normative link required for deliberative endorsement is severed. The root node cannot claim the answer as a conclusion of reasoning because the structure provides no mechanism for the root to grasp the justification better than it could have alone. It remains a causal chain, not a chain of reasons.

  ***

  **MARKING SCHEME (20 Marks)**

  **1. Correct Application of Checkability Distinction (4 Marks)**
  *   **Requirement:** Explicitly distinguishes how MERGE functions differently in Locally Checkable (verification) vs. Globally Checkable (synthesis) tasks based on the prompt's definitions.
  *   **Typical Error:** Students conflate the two task types or treat "checkable" as simply "true/false" rather than relating it to the difficulty of subtasks.

  **2. Engagement with Empirical Premise (4 Marks)**
  *   **Requirement:** Uses the stipulated premise (no reliability gains for Global tasks) as a pivot point for the argument, not just a background fact.
  *   **Typical Error:** Students argue against the premise or ignore its implication for the *normative* status of the output, treating it as irrelevant to the philosophical definition of deliberation.

  **3. Structural Analysis of the MERGE Operation (4 Marks)**
  *   **Requirement:** Identifies that in Global tasks, MERGE carries the full cognitive load and becomes opaque/non-verificationary, breaking the justificatory chain.
  *   **Typical Error:** Focuses on DECOMPOSE or SOLVE operations instead of analyzing why MERGE specifically fails to support endorsement in the Global case.

  **4. Consideration of Counter-Argument (4 Marks)**
  *   **Requirement:** Addresses the "procedure endorsement" objection (that trusting the protocol counts as deliberation) and rebuts it using the reliability constraint.
  *   **Typical Error:** Presents a strawman objection (e.g., "maybe the humans are tired") or accepts the counter-argument without linking it back to the reliability premise.

  **5. Clear Stance and Conclusion (4 Marks)**
  *   **Requirement:** Takes a definitive position (Collapses to causal processing OR Models deliberation) consistent with the preceding analysis, avoiding fence-sitting.
  *   **Typical Error:** Concludes that "it depends on the definition of deliberation" without committing to how the provided apparatus resolves that definition.

  **B-RANGE ANSWER DESCRIPTIONS**

  1.  **The Summary Trap:** Defines the operations and task types accurately but spends 80% of the word count explaining the setup rather than arguing for the normative consequence of the empirical premise. (Missing Point 2 & 5).
  2.  **The Generic Skeptic:** Argues that the system never models deliberation because "it's just computers/humans following rules," ignoring the specific distinction between Local and Global checkability provided in the text. (Missing Point 1 & 3).
  3.  **The Procedure Defender:** Argues that following the recursive protocol *is* deliberation regardless of reliability gains, but fails to address why the lack of reliability gains undermines the *reason-giving* capacity of the root node specifically. (Missing Point 4 & 3).
