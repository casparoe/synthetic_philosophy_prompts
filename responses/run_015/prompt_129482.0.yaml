answer: |-
  Your friend's skepticism aligns with the prevailing view in cognitive anthropology that cultural transmission is fundamentally reconstructive, yet the question of whether meme theory holds literal truth for even a single domain requires us to treat the proposition as a conjunction of three specific probabilistic conditions. To arrive at a credence regarding the literal truth of memetics rather than its metaphorical utility, we must assess the likelihood that high-fidelity replication exists, that selection operates independently of intentionality, and that the memetic framework outperforms rival explanations in that specific context. Regarding the first condition, which concerns the probability that some cultural units are transmitted with replication fidelity high enough to count as discrete copies rather than reconstructed inferences, I assign a probability of 0.6. While most cultural knowledge is indeed inferred and rebuilt by each learner, there are narrow domains such as ritualized verbal formulas, specific knot-tying techniques, or digital code where the pressure for exactness is high and the tolerance for error is low, suggesting that copying mechanisms can sometimes bypass deep reconstructive inference.

  Turning to the second condition, we must estimate the probability that selection on those units operates with sufficient independence from human intentional design to avoid being purely Lamarckian, and here I am more skeptical, assigning a probability of 0.5. Human agents are teleological by nature, often modifying cultural variants to improve utility or align with social goals, which introduces a strong guided variation bias that mimics selection but is driven by foresight rather than blind retention, though there remains a substantial chance that unintended consequences or drift play a decisive role in the survival of certain variants despite human intent. The third condition requires judging the probability that, even granting the first two, memetics offers a better explanation than rival frameworks such as niche construction theory, gene-culture coevolution, or Sperber-style epidemiology of representations, for which I assign a probability of 0.3. These rival frameworks often accommodate the reconstructive nature of cognition and the role of intentional agency more gracefully than classical memetics, which sometimes struggles with unit definition and predictive precision, meaning memetics wins on explanatory power only in rare cases where the discrete replicator model simplifies the dynamics better than cognitive epidemiology.

  To derive my overall figure, I treat these three conditions as necessary conjuncts for the literal truth of the theory in any given domain, meaning we multiply the individual probabilities together. Multiplying 0.6 by 0.5 yields 0.3, and multiplying that result by 0.3 gives a final credence of 0.09. This low number reflects the substantial hurdles involved in satisfying all three criteria simultaneously, acknowledging that while copying might occur and drift might exist, the memetic framework rarely supplants more nuanced coevolutionary models as the superior explanatory tool. Of the three components, I am least certain about the second probability concerning the independence of selection from human intentional design, as it is empirically difficult to disentangle genuine blind selection from subtle forms of guided variation that masquerade as drift. The specific empirical result that would move this probability most significantly would be data from transmission chain experiments in a technical tradition, such as stone tool knapping or weaving patterns, showing that variation accumulates randomly over generations without correlating to functional improvement or prestige bias, thereby demonstrating that the selection pressure is truly independent of the learners' intentions. Until such evidence is robustly established across a well-defined domain, the literal Darwinian account of culture must remain a low-probability hypothesis compared to the view that memetics serves primarily as a provocative but ultimately loose metaphor.
