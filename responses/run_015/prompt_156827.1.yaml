  8.  *(Self-Correction during drafting)*: I need to make sure I don't accidentally give a reading list while discussing concepts. I can mention names (like Godfrey-Smith) as context but not as "go read this." I should emphasize that the "Function Lag" is a helpful heuristic.

  9.  *(Final Review against User Prompt)*:
