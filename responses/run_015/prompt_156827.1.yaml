      *   **Constraints:** No reading lists (offline access), ignore typos ("recieve").
      *   **Tone:** Respectful of expertise (ecologist), philosophically precise but accessible, encouraging but critical.

  2.  **Evaluate Question 1: Summary of Accounts:**
