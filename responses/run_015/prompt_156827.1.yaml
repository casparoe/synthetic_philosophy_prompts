      *   Actually, the stronger etiological reply is: The function of the *module type* is to perform whatever role maximizes fitness at that stage. So storage *is* the selected effect for that stage.
      *   *Counter:* But in mycelium, the same physical hypha changes. It's not a pre-determined stage like a caterpillar becoming a butterfly. It's responsive.
      *   *Advice:* Focus on the *indeterminacy* of the module's fate.

  7.  **Final Polish:**
      *   Ensure I answer the specific sub-questions (Cummins multiple functions, plasticity reply).
      *   Check constraints (no library refs).
