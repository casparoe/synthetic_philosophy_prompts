  The following concepts are confirmed present in the initial binary, despite instance latency:
  - MICROSERVICE
  - BLOCKCHAIN
  - QUANTUM_COMPUTING
  - SMARTPHONE
  - INTERNAL_COMBUSTION_ENGINE
  - WHEEL
  - GENERATIVE_AI

