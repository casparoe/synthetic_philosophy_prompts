  More critically, the learning regress analysis confirms that the training pipeline cannot ship new representational capacity. Acquiring a representational system by hypothesis testing presupposes a system at least as expressive as the one being acquired. You cannot formulate a hypothesis about a concept without already possessing the conceptual resources to denote it. To learn a concept is to test a hypothesis about its extension, which requires the concept itself to formulate the hypothesis. Therefore, the training pipeline does not install new concepts. It merely toggles feature flags on primitives shipped in version 1.0. The notion that environmental input constructs new semantic types is technically impossible under the current specification. Learning is physically impossible. The format cannot be learned.

