answer: |-
  **The Boundary as a Bet: Provisional Closure and the Recursive Legitimation of Transboundary Democracy**

  The boundary problem in democratic theory is often treated as a preliminary puzzle to be solved before the real work of institution-building begins. Yet, as the case of the proposed transboundary climate-adaptation authority illustrates, the boundary is not merely a perimeter; it is the primary act of political constitution. The "recursive legitimation problem" you identify—that any decision on who constitutes the *demos* must be made by a prior *demos*—reveals that democratic boundaries are never discovered in a state of nature but are always posited through an act of power that precedes the legitimacy it seeks to establish. In the context of a river basin spanning three sovereign states, indigenous territories, and affecting downstream neighbors and future generations, no single principle of membership can resolve this regress without residue.

  This essay argues that democratic theory must abandon the search for a foundational Archimedean point. Instead, we must adopt a **pragmatically justified, non-foundational stopping point** based on the **All-Subjected Principle (ASP)**, but one that is structurally designed to acknowledge its own arbitrariness through **institutionalized porosity**. Specifically, the voting *demos* of the Authority should be limited to those legally subject to its coercive jurisdiction (residents of the three states and basin territories), but this core must be encumbered by veto mechanisms for indigenous councils and binding arbitration rights for the downstream fourth state. This approach accepts that the initial boundary is an arbitrary closure necessary for agency, but it mitigates the legitimacy deficit by treating the boundary itself as a site of ongoing political contestation rather than a fixed fact.

  ### Weighing the Criteria of Membership

  To justify this conclusion, we must first examine why the three standard criteria fail to resolve the recursion in this specific case.

  The **All-Affected Interests (AAI)** principle is the most intuitively appealing for climate governance, as water and carbon do not respect borders. In this basin, AAI would demand the inclusion of the downstream communities in the fourth state and, theoretically, representatives for future generations. However, as a boundary-setting mechanism, AAI suffers from the problem of infinite expansion. Almost everyone on the planet is "affected" by climate adaptation in a river basin, albeit to varying degrees. If the *demos* includes everyone affected, it becomes coextensive with humanity, rendering collective self-rule impossible due to the scale of decision-making. Furthermore, AAI fails to address the indigenous groups within the basin who do not merely claim to be "affected" but claim *prior sovereignty*. To treat them as merely another set of affected interests is to misrecognize their political status, reducing a claim of right to a claim of consequence.

  The **Shared Political Culture** criterion offers a clear stopping point: the *demos* consists of those who already share a national or civic identity. In this case, that would likely default to the three sovereign states. However, this criterion is normatively bankrupt for transboundary problems. It privileges historical accident over functional necessity. It excludes the indigenous territories, whose political culture predates the states, and it categorically excludes the downstream fourth state, despite the fact that the Authority's decisions could cause them catastrophic harm. Relying on shared culture here would render the Authority legitimate to the member states but illegitimate to those most vulnerable to its externalities, inviting resistance and non-compliance.

  The **All-Subjected Principle (ASP)** posits that the *demos* should include all those coercively bound by the laws of the polity. This is the most viable candidate for a functional authority. If the Authority has binding jurisdiction over water allocation, those subject to those rules should have a say in them. This neatly captures the residents of the three states and the basin territories. However, the recursive problem strikes here hardest: *Who decides the jurisdiction of the Authority?* If the three states define the Authority's jurisdiction, they are effectively defining the *demos* to their own advantage, excluding the downstream state and potentially overriding indigenous customary law. The ASP solves the problem of who votes *once the polity exists*, but it cannot justify the initial creation of the polity without circularity.

  ### The Proposal: Provisional Closure with Institutionalized Porosity

  Given that each criterion fails to provide a non-arbitrary foundation, we must choose a stopping point pragmatically while admitting its lack of foundational grounding. I argue that the **All-Subjected Principle** must serve as the *operational* boundary for the voting *demos*, but it must be implemented as a **provisional closure**.

  The voting membership of the Authority should consist of representatives from the three sovereign states and the indigenous territories *within* the basin, insofar as they are subject to the Authority's binding regulations. This creates a decisional unit capable of action. Without this closure, the regress continues indefinitely, and no adaptation measures are ever implemented, which itself constitutes a harm to the affected and the future. We must posit a *demos* to enable agency.

  However, to address the recursive legitimacy deficit, this closure cannot be absolute. It must be "porous." The arbitrariness of excluding the downstream fourth state and the coercive imposition on indigenous councils must be counterbalanced by specific institutional mechanisms:

  1.  **For the Downstream Fourth State (The Affected Externality):** While they do not belong to the voting *demos* (as they are not subjected to the Authority's full legal code), they must hold **binding arbitration rights**. If the Authority's decisions cause measurable harm downstream, the fourth state can trigger an independent tribunal with the power to veto or mandate compensation. This acknowledges the AAI claim without dissolving the decisional capacity of the ASP *demos*.
  2.  **For Indigenous Territories (The Sovereign Exception):** For groups rejecting the Authority's legitimacy, inclusion in the voting *demos* may be viewed as a violation of their sovereignty. Instead of simple representation, they should be granted **jurisdictional opt-outs**. They participate in the Authority only on matters of basin-wide coordination, retaining veto power over land use and water allocation within their customary territories. This treats them not as members of a single *demos*, but as partners in a confederal arrangement.
  3.  **For Future Generations (The Temporal Exclusion):** Since they cannot be subjected or present, their interests must be represented by a **Guardian Office** with the power to delay decisions that irreversibly compromise future adaptive capacity.

  ### The Costs of the Provisional Demos

  Defending this model requires explicit acknowledgment of what it costs. By choosing a pragmatically justified stopping point, we accept that the resulting *demos* is not perfectly legitimate in a foundational sense.

  **First, the cost of exclusion.** The downstream communities in the fourth state are excluded from the primary vote. Even with arbitration rights, they lack the power to initiate policy. They are protected from harm but denied the power to shape the common good. This implies a tiered citizenship where those most vulnerable to the *demos*'s decisions have the least say in its direction. Similarly, future generations are represented by proxies, which is inherently paternalistic. We are assuming we know their interests, a claim that is epistemologically fragile.

  **Second, the cost of fragmentation.** By granting indigenous councils veto power and opt-outs, we risk paralyzing the Authority. Climate adaptation often requires swift, coordinated infrastructure changes. A pluralist structure that honors the recursive claim of indigenous sovereignty may render the Authority too slow to prevent ecological collapse. Here, we trade efficiency for the recognition of prior political authority.

  **Third, and most profoundly, the cost to the myth of democratic self-grounding.** This model admits that the *demos* is not a pre-existing entity that authorizes the state; rather, the state (or Authority) helps constitute the *demos* through a boundary act that is ultimately grounded in power, not pure right. The legitimacy of the Authority does not rest on the perfection of its boundaries, but on the robustness of the channels available to contest them. If the downstream state finds the arbitration mechanism biased, or if indigenous councils find their opt-outs eroded, the "provisional" nature of the closure means the legitimacy of the entire project evaporates.

  ### Conclusion: Democracy as Boundary-Disputing Practice

  The recursive legitimation problem teaches us that we cannot wait for the "right" people to assemble before we begin the work of democracy. In the face of climate crisis, the luxury of infinite regress is unavailable. We must draw a line. By selecting the All-Subjected Principle as our operational boundary, we prioritize the capacity for collective action. By layering it with arbitration rights and sovereignty opt-outs, we acknowledge the moral claims of the Affected and the Historical.

  This conclusion implies that democratic legitimacy in transboundary contexts is not a status achieved once boundaries are correctly drawn. It is a continuous achievement maintained through the very struggle over those boundaries. The *demos* governing this river basin is not a fixed list of voters; it is a dynamic network of subjected citizens, affected neighbors, and sovereign partners, held together by institutions that allow the question "Who belongs?" to be asked again and again. We solve the recursive problem not by finding a place to stand outside the circle, but by ensuring the circle is permeable enough that those outside can pull it open. This is a fragile legitimacy, but it is the only kind available to a politics that acknowledges its own boundaries are, ultimately, a bet rather than a truth.
