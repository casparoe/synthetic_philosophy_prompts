  ### Mentor's Preliminary Conceptual Audit

  *Before formalizing the proposal, I have conducted the requested conceptual audit to ensure the project's philosophical integrity. This section outlines the core tension, the primary risk of verbal dispute, and the conditions for a negative result.*

  **1. Core Tension in Framing**
  The central tension lies between *ontological elimination* and *functional relocation*. Daniel Dennett's Multiple Drafts Model (MDM) is famously an eliminativist project regarding the Cartesian Theater; he argues there is no single place or time where experience "happens." However, your intuition suggests that for a narrative to be coherent enough to be reported or acted upon, some draft must win out. If a draft wins out, it becomes "canonical" for the subject. The tension is this: If Dennett admits a draft becomes canonical for the sake of action, has he eliminated the Theater, or simply made the Theater invisible by distributing its functions? If he denies any draft becomes canonical, he risks failing to explain the unity of consciousness we subjectively report. Your project hinges on whether "canonical status" is an intrinsic property of a neural state (which Dennett denies) or a relational property relative to subsequent processing (which Dennett accepts). The friction is between the *phenomenology of unity* (it feels like one thing) and the *metaphysics of multiplicity* (it is many processes).

  **2. Anticipated Objection: The Verbal Dispute**
  The most serious objection you will face is that your critique rests on a equivocation of the word "canonical." Dennett might argue that you are using "canonical" to mean "ontologically privileged" (which he denies exists), while he uses "dominant draft" to mean "functionally effective for report" (which he accepts). If your project concludes that "there is a canonical draft because there is a reported draft," Dennett would reply, "Yes, but that doesn't make it a Theater." To avoid this, your project must define "canonical" not merely as "reported," but as "temporally fixed prior to report." If you can show that MDM requires a fixing point *before* report to ensure coherence, you have a substantive objection. If you only show that reports exist, you have engaged in a verbal dispute.

  **3. Sketch of a Genuine Negative Result**
  A successful project does not necessarily prove your hypothesis correct. A genuine negative result would look like this: You demonstrate that temporal coherence can be fully explained by retroactive coherence mechanisms (e.g., memory editing) without any need for a moment of canonical fixation. In this scenario, you would conclude that Dennett's model *does* successfully eliminate canonical versions because the "unity" is a post-hoc fabrication of memory, not a real-time feature of experience. This would validate Dennett's illusionism. Conversely, a negative result for *feasibility* would be realizing that without empirical data on neural timing, you cannot distinguish between "distributed editing" and "centralized editing" conceptually. The proposal below is designed to mitigate this by focusing on the logical requirements of the model rather than empirical timing.

  ***

  # Project Proposal: The Canonical Shadow
  ## Investigating the Persistence of Representational Privilege in Dennett's Multiple Drafts Model

  **Student Researcher:** [Name]
  **Course:** Independent Study in Philosophy of Mind
  **Term:** Semester [X]
  **Word Count Target:** 4,000 words (Final Draft)

  ### 1. Abstract

  This research project proposes a critical re-examination of Daniel Dennett's Multiple Drafts Model (MDM) of consciousness, specifically challenging the claim that the model successfully eliminates the need for a "canonical" version of experience. Standard introductory treatments of Dennett present a binary choice between the Cartesian Theater (a central observer viewing a unified show) and the Multiple Drafts Model (distributed, parallel narratives with no final edit). This project argues that this binary obscures a deeper structural issue: whether the functional requirements of temporal coherence and behavioral reportability necessitate a *de facto* canonical draft, even if no ontological Theater exists. By constructing a taxonomy of "canonical representation" versus "distributed editing," this study will analyze whether MDM merely relocates the privilege of the Cartesian Theater to the level of editorial promotion. The research will employ close conceptual analysis of Dennett's metaphors, evaluation of thought experiments regarding temporal coherence (such as the Color Phi phenomenon), and a logical assessment of whether coherence over time can be explained without assuming a central screen. The outcome will determine if Dennett's critique of Cartesian Materialism is weakened by the functional necessity of canonical states, or if the concept of "canonical" is itself an illusion compatible with distributed processing. This project is scoped for armchair philosophical analysis, requiring no laboratory access, but demands rigorous logical precision to avoid verbal disputes.

  ### 2. Introduction and Philosophical Context

  The philosophy of mind has long been haunted by the intuition that consciousness requires a viewer. When we see a red apple, there is a sense that somewhere in the brain, the processing of wavelength data concludes, and the experience of "redness" is presented to a subject. Daniel Dennett terms this intuition the "Cartesian Theater." It is the idea that there is a specific place and time in the brain where things come together for a final presentation to an inner observer. Dennett's career-long project has been to dismantle this intuition, arguing that it is a category error rooted in folk psychology. In its place, he offers the Multiple Drafts Model. According to the MDM, there is no final show. There are only various narratives being spun by different neural processes at different times. Some narratives are influential, some are not. Some lead to speech, some to action, and some fade away. There is no "finish line" where a draft becomes the "real" experience.

  For introductory philosophy students, this debate is often presented as a settled victory for distributed processing. The Cartesian Theater is dismissed as magical thinking, and the Multiple Drafts Model is accepted as the naturalistic alternative. However, this pedagogical simplification leaves a significant conceptual gap. While Dennett successfully argues against a *little man* watching the screen, he is less clear on the status of the *screen itself*—or rather, the status of the content that is ultimately reported. If I ask you what you saw, you give a single, coherent answer. You do not say, "I have three conflicting drafts." You say, "I saw the light flash." This report implies that, at the moment of reporting, one version of events has been promoted to the status of "what happened."

  This project identifies a tension in the standard reading of Dennett. If the Multiple Drafts Model allows for one draft to be promoted to the status of "the report," does that promotion process recreate the functional role of the Cartesian Theater? The Theater is not just about an observer; it is about the *privileging* of one representation over others as the definitive account of reality for the subject. If the MDM requires a mechanism to select a canonical draft for the sake of coherence, then the "Theater" may have been eliminated ontologically (no ghost) but retained functionally (a single stage).

  The significance of this inquiry extends beyond exegesis of Dennett. It touches on the "Hard Problem" of consciousness and the nature of illusionism. If consciousness is merely a user-illusion generated by distributed processes, the unity of that illusion must be explained. If the unity requires a canonical version, then the illusion is of a unified self viewing a unified world. If the unity is itself fragmented, and only appears unified in memory, then the nature of the present moment is radically different than we suppose. This project seeks to clarify whether the Multiple Drafts Model can sustain the claim that there is *no* canonical version without collapsing into incoherence regarding how we act and speak about our experiences.

  ### 3. The Specific Problem and Research Question

  The core problem this project addresses is the ambiguity surrounding the term "canonical" within the Multiple Drafts Model. Dennett frequently asserts that there is no "definitive version" of events in the stream of consciousness. However, he also acknowledges that organisms must act coherently. To act coherently, the motor systems must receive consistent instructions. If visual processing suggests "obstacle left" and auditory processing suggests "obstacle right," a decision mechanism must resolve this conflict. When that resolution occurs, does the winning representation become "canonical"?

  If Dennett says "yes," he risks reintroducing a finish line. If he says "no," he risks making consciousness too fragmented to explain coherent behavior. The standard introductory treatment avoids this by focusing on the absence of the *observer*, neglecting the status of the *observed content*. This project posits that the absence of an observer does not guarantee the absence of a privileged representation.

  **Primary Research Question:**
  *Does the Multiple Drafts Model necessitate a functional equivalent of a canonical representation to account for temporal coherence and reportability, and if so, does this functional equivalent reintroduce the ontological commitments of Cartesian Materialism?*

  To make this question determinate, it must be broken down into two subordinate questions that allow for a Yes/No/Qualified answer:

  1.  **The Coherence Condition:** Can temporal coherence in behavior and report be explained solely by distributed, parallel editing processes without any state achieving "canonical" status (defined as a state that overrides conflicting states for all subsequent systems)?
  2.  **The Materialism Condition:** If a state does achieve this overriding status, is that status merely relational (dependent on future processing) or intrinsic (fixed at the moment of experience)?

  A determinate answer will look like one of the following conclusions:
  *   **Conclusion A:** The MDM requires a functionally canonical state to explain coherence, but because this status is relational and retroactive, it does not reintroduce Cartesian Materialism. (Dennett is vindicated, but the model is more complex than taught).
  *   **Conclusion B:** The MDM requires a functionally canonical state that is fixed prior to report, which effectively recreates the Cartesian Theater's "finish line," weakening Dennett's critique. (Your hypothesis is supported).
  *   **Conclusion C:** The distinction between "canonical" and "non-canonical" is verbally ambiguous and lacks explanatory power; the debate is merely about labeling neural competition. (The project dissolves the question).

  The goal is to avoid Conclusion C by rigorously defining "canonical" in functional terms before beginning the analysis. By defining "canonical" as "a representation that dictates motor output and verbal report to the exclusion of conflicting representations," we move the debate from semantics to mechanics.

  ### 4. Gap in Existing Treatments

  Why is this specific issue left open in existing introductory treatments? The primary reason is pedagogical simplification. In introductory philosophy of mind courses, the Dennett vs. Cartesian Theater debate is used to illustrate the difference between dualism and materialism. The focus is heavily placed on the *homunculus*—the little man in the head. Students are taught that Dennett kills the homunculus. Once the homunculus is dead, the Theater is assumed to be demolished.

  However, this conflates the *viewer* with the *view*. One can eliminate the viewer while retaining a privileged view. Introductory texts often skip over the mechanics of how the "drafts" are managed. They describe the drafts as flowing freely, but they do not adequately address the "bottleneck" problem. Human speech is serial. We cannot say two contradictory things at once. Our bodily actions are largely serial. We cannot walk left and right simultaneously. This seriality implies a bottleneck where parallel drafts must be serialized.

  Existing treatments often assume this serialization happens in memory, not in experience. They argue that the experience itself is fragmented, but memory smooths it out. This project identifies a gap in that explanation: If the experience is fragmented, why does the subject not feel fragmented *in the moment*? Dennett argues the feeling of unity is also a draft. But if the feeling of unity is a draft, it must be a draft *about* the other drafts. This leads to an infinite regress unless some drafts are privileged as the "content" of the unity draft.

  Furthermore, secondary literature often focuses on Dennett's later work on heterophenomenology or his views on qualia, leaving the structural logic of the Multiple Drafts Model itself under-examined regarding temporal coherence. There is a lack of focused analysis on whether the "editing" metaphor in MDM implicitly requires an "editor" or a "final cut." By focusing specifically on the concept of the "canonical version," this project isolates a variable that is often glossed over in broader discussions of illusionism.

  This gap is suitable for a high school independent study because it does not require mastering the entirety of Dennett's corpus or advanced neuroscience. It requires focusing on one logical tension within a specific model. The existing treatments provide the setup (Theater vs. Drafts), but they do not provide the resolution regarding the *status of the winning draft*. This leaves room for original conceptual work.

  ### 5. Methodology and Analytical Framework

  Since this project does not have access to primary neuroscience laboratories, the methodology must be strictly conceptual and analytical. The validity of the results will depend on the rigor of the logical arguments and the clarity of the definitions. The method will proceed in three phases: Conceptual Clarification, Taxonomy Construction, and Logical Evaluation.

  **Phase 1: Conceptual Clarification of Metaphors**
  The first step is to dissect the metaphors Dennett uses. The "Cartesian Theater" is a spatial metaphor (a place where things come together). The "Multiple Drafts" is a textual/temporal metaphor (stories being written and rewritten).
  *   *Task:* I will analyze the implications of the "Draft" metaphor. A draft implies a potential final version. If there are drafts, is there a purpose to the drafting? If the purpose is action, does the action require a "final" draft?
  *   *Task:* I will define "Canonical Version" operationally. For the purpose of this project, a "Canonical Version" is defined as: *A neural representation that achieves a state of stability such that it inhibits conflicting representations from influencing motor output or verbal report.*
  *   *Task:* I will define "Cartesian Materialism." This is Dennett's term for the view that there is a specific place in the brain where consciousness happens. I must distinguish this from "Functional Canonicality." The risk is conflating the two. The project will test if Functional Canonicality inevitably leads to Cartesian Materialism.

  **Phase 2: Construction of a Taxonomy**
  To avoid verbal disputes, I will construct a taxonomy distinguishing types of representation status. This will serve as the analytical grid for the project.
  *   *Category 1: Transient Drafts.* Representations that arise and fade without influencing behavior.
  *   *Category 2: Competitive Drafts.* Representations that vie for influence but are suppressed.
  *   *Category 3: Promoted Drafts.* Representations that successfully dictate behavior.
  *   *Category 4: Canonical Drafts.* Representations that are not only promoted but are treated by the system as "veridical" or "fixed" for future reference (memory).

  The critical analysis will focus on the transition from Category 3 to Category 4. Dennett's model comfortably accounts for Category 3 (competition). The question is whether Category 4 exists. If the system treats a Promoted Draft as fixed truth for memory, does it function as a Canonical Draft? If yes, does this require a "finish line"?

  **Phase 3: Evaluation of Temporal Coherence**
  The core test for the model is temporal coherence. How does the brain handle events that happen in rapid succession?
  *   *Thought Experiment Analysis:* I will utilize Dennett's own examples, such as the Color Phi phenomenon (where observers see motion and color change that physically did not happen) and the "Orwellian vs. Stalinesque" distinction.
      *   *Stalinesque:* The brain falsifies the evidence before it enters consciousness (theater is fed a fake movie).
      *   *Orwellian:* The brain lets the truth into consciousness but falsifies the memory afterward (the theater sees the truth, but the history books are rewritten).
  *   *Analytical Move:* Dennett argues this distinction is empty because there is no fact of the matter about when consciousness occurs. I will challenge this. If there is no fact of the matter, how does the brain coordinate motor responses that require precise timing (e.g., catching a ball)?
  *   *Logical Test:* I will construct a *reductio ad absurdum*. Assume there is no canonical version. If there is no canonical version, then at time T, multiple conflicting motor commands could be equally valid. If the organism survives, only one command was executed. What selected it? If the selection mechanism creates a "winner," does that winner become canonical? If the selection is distributed, how is the conflict resolved without a central arbiter?

  **Phase 4: Synthesis and Argument Construction**
  The final phase involves synthesizing the findings from the taxonomy and the coherence evaluation.
  *   *Argument A:* If coherence requires a central arbiter, Dennett's distributed model is insufficient.
  *   *Argument B:* If coherence can be distributed, then "canonical" is just a label for "winning draft," and Dennett is safe.
  *   *Argument C:* If "canonical" implies a fixed truth value that persists over time, and the MDM says all truths are relative to later drafts, then the MDM denies canonical versions exist. I will test if this denial is compatible with the phenomenology of memory.

  This methodology ensures that the project remains within the realm of philosophy while addressing the structural implications of cognitive science models. It avoids the trap of making empirical claims I cannot verify (e.g., "neurons fire in sequence X") and focuses on the logical requirements of the model (e.g., "if neurons fire in sequence X, does representation Y become canonical?").

  ### 6. Project Timeline and Deliverables

  This project is designed for a one-semester timeline (12 weeks). The milestones are structured to ensure steady progress and allow time for revision based on feedback.

  **Weeks 1-4: Foundation and Outline**
  *   *Focus:* Deep reading of relevant sections of Dennett's *Consciousness Explained* (specifically chapters regarding the Cartesian Theater and Multiple Drafts) and secondary commentary on the Orwellian/Stalinesque distinction.
  *   *Task:* Draft the "Conceptual Clarification" section. Define "Canonical," "Draft," and "Theater" with precision.
  *   *Deliverable (Week 4):* A detailed 1,000-word Outline. This must include the specific definitions to be used, the structure of the argument, and the specific thought experiments to be analyzed. It must explicitly state the hypothesis (e.g., "I argue that MDM implicitly relies on...").
  *   *Mentor Check:* At this stage, I will review the definitions to ensure the "verbal dispute" risk is minimized. If the definition of "canonical" is too loose, the project will be redirected.

  **Weeks 5-8: Conceptual Analysis Memo**
  *   *Focus:* Executing Phase 2 and 3 of the methodology. Constructing the taxonomy and analyzing the thought experiments.
  *   *Task:* Write the core analysis. This is not the full paper, but a "Conceptual-Analysis Memo." It should present the arguments for and against the existence of a canonical draft within the model.
  *   *Deliverable (Week 8):* A 1,500-word Memo. This document will present the Taxonomy and the results of the Logical Test on temporal coherence. It should identify which horn of the dilemma (Argument A, B, or C from Phase 4) seems most promising.
  *   *Mentor Check:* I will review the logic of the *reductio*. Is the assumption that coherence requires a central arbiter justified? I will challenge the student to consider distributed consensus mechanisms (like voting systems) to ensure the critique of Dennett is steel-manned.

  **Weeks 9-12: Full Draft and Revision**
  *   *Focus:* Synthesizing the memo into a coherent narrative. Writing the introduction and conclusion. Refining the prose for academic tone.
  *   *Task:* Assemble the full 4,000-word paper. Ensure smooth transitions between the definition of terms, the analysis of the model, and the final conclusion.
  *   *Deliverable (Week 12):* Full Draft. This must include the Abstract, Introduction, Methodology, Analysis, and Conclusion.
  *   *Final Review:* Check against the success criteria. Does the paper answer the research question? Is the distinction between functional and ontological canonicality clear?

  This timeline is aggressive but manageable for an advanced secondary student. The key is the Week 4 Outline. If the definitions are not solidified early, the later writing will suffer from ambiguity. The Memo stage allows for mid-course correction if the argument proves untenable before the full draft is written.

  ### 7. Criteria for Success and Failure

  To ensure this project is graded on philosophical rigor rather than just effort, specific criteria for success and failure are established. These criteria directly address the risk of the project collapsing into a verbal dispute.

  **Success Conditions:**
  1.  **Precision of Definition:** The project successfully defines "canonical version" in a way that is distinct from "reported version." It must show that a version can be reported without being ontologically canonical, or vice versa. If the paper conflates "what I say I saw" with "what my brain fixed as real," it fails.
  2.  **Engagement with the Dilemma:** The paper must explicitly address the "Orwellian vs. Stalinesque" dilemma. A successful paper will explain why Dennett thinks this distinction is empty and argue whether that emptiness holds up under the requirement for temporal coherence.
  3.  **Determinate Conclusion:** The paper must not end with "both sides have points." It must argue for one of the determinate answers outlined in Section 3 (Conclusion A, B, or C). Even if the conclusion is that the question is ill-posed (C), the argument for *why* it is ill-posed must be rigorous.
  4.  **Avoidance of Empirical Overreach:** The paper must not make claims about neural physiology that it cannot support. It must stick to the logical implications of the *model*, not the biology. Success is defined by logical consistency, not biological accuracy.

  **Failure Conditions (and Mitigation):**
  1.  **The Verbal Dispute Trap:** The most likely failure mode is arguing that "Dennett says there is no canonical version, but there is a winning draft, so he is wrong." This is a failure because Dennett would agree there is a winning draft but deny it is "canonical" in the sense the student implies.
      *   *Mitigation:* The Week 4 Outline must include a "Steel-Man" section where I articulate how Dennett would respond to the definition of "canonical." If the student cannot articulate Dennett's potential counter-argument, the definition is not ready.
  2.  **Scope Creep:** Attempting to solve the Hard Problem or explain qualia.
      *   *Mitigation:* The proposal strictly limits the scope to "temporal coherence and reportability." Any discussion of qualia must be tied directly to how they are reported, not how they feel.
  3.  **Negative Result Misinterpretation:** If the project concludes that Dennett is right (Conclusion A), this is not a failure of the *project*, only of the *hypothesis*. However, it is a failure of the project if the student argues Dennett is right simply because they ran out of arguments. The argument for Dennett's success must be as rigorous as the argument against it.
  4.  **Ambiguity in "Canonical":** If the final draft uses "canonical" interchangeably with "conscious" or "reported," the project fails.
      *   *Mitigation:* The Taxonomy in Week 8 must be carried through to the final draft. The terms must be used consistently.

  A genuinely negative result for the *hypothesis* (i.e., proving Dennett is correct) would look like a demonstration that distributed consensus mechanisms can achieve temporal coherence without any single state achieving privileged status. For example, if I can show how a voting system among neural clusters can produce a single output without any single cluster being the "decider," then the need for a canonical draft is eliminated. This would be a successful *project* even if it disproves my initial *hunch*.

  ### 8. Feasibility and Scope Assessment

  **Is this too ambitious for one semester?**
  For a standard high school junior, yes. For a student in an advanced independent-study philosophy seminar with mentorship, it is tractable *provided the scope is strictly maintained*. The ambition lies in the conceptual density, not the volume of reading. Dennett's writing is accessible but dense. The risk is getting lost in the details of his examples.

  **Constraints and Limitations:**
  1.  **No Lab Access:** This is the most significant constraint. I cannot verify if neural processing is actually parallel or serial.
      *   *Solution:* The project must remain agnostic about the actual biology. It is a critique of the *model's logic*, not the *brain's structure*. I will phrase claims as "If the MDM is correct, then..." rather than "The brain does..." This shifts the burden from empirical verification to logical consistency.
  2.  **Secondary Literature:** Without a university library, access to specialized journals may be limited.
      *   *Solution:* The project relies primarily on Dennett's primary texts (which are widely available) and standard philosophical commentary. The analysis is conceptual, so it does not require cutting-edge empirical data.
  3.  **Time Management:** 4,000 words is significant for a high schooler.
      *   *Solution:* The weekly milestones are critical. The Week 4 Outline is the gatekeeper. If the outline is not approved, the student should not proceed to the full draft. This prevents wasting time on a flawed structure.

  **Realistic Scope Adjustments:**
  To keep this realistic, I recommend narrowing the focus of the "Temporal Coherence" section. Instead of analyzing all of consciousness, focus on *visual temporal integration*. How does the brain decide the order of two flashes of light? This is a concrete example (often used by Dennett) that allows for precise analysis without needing to solve the nature of selfhood. By anchoring the abstract concept of "canonical versions" to the concrete example of "order perception," the project becomes manageable.

  Additionally, the student should avoid engaging with Dennett's later work on "User Illusion" unless it directly impacts the Multiple Drafts Model. Stick to the model as presented in *Consciousness Explained* to maintain a consistent target. Expanding to his later works risks moving the goalposts, as Dennett's views have nuanced shifts over decades.

  **Mentor's Direct Assessment of Tractability:**
  Your framing is genuinely tractable *if* you adhere to the operational definition of "canonical." The intuition that "someone has to win" is strong, and Dennett's response that "winning doesn't mean canonical" is the crux of the debate. You can absolutely analyze this conflict in one semester. The risk is not ambition; the risk is precision. If you allow the definitions to slide, the project becomes mush. If you hold the definitions rigid, you will produce a compelling philosophical argument. The lack of lab access is not a hindrance because this is a metaphysical question about the description of the model, not a scientific question about the brain's wiring. You are analyzing the map, not the territory. This is perfectly suited for armchair philosophy.

  ### 9. Conclusion

  This research proposal outlines a rigorous investigation into the structural integrity of Daniel Dennett's Multiple Drafts Model. By questioning whether the elimination of the Cartesian Theater necessitates the elimination of canonical representations, this project targets a subtle but significant vulnerability in standard materialist accounts of consciousness. The project is designed to be completed within one semester using conceptual analysis and logical evaluation, avoiding the need for empirical laboratory work while maintaining high philosophical standards.

  The success of this project depends on the disciplined avoidance of verbal disputes. By defining "canonical" functionally and testing it against the requirements of temporal coherence, the research will yield a determinate conclusion about the logical consistency of the Multiple Drafts Model. Whether the result vindicates Dennett or exposes a hidden commitment to Cartesian structures, the inquiry will deepen the understanding of how distributed processes might give rise to the unity of experience. This is a foundational question in the philosophy of mind, and tackling it at the secondary school level demonstrates a commitment to genuine philosophical inquiry rather than mere summary of existing views. With careful adherence to the timeline and the methodological constraints outlined above, this project is well-positioned to produce a sophisticated and original contribution to the seminar's body of work.

  The path forward is clear: solidify the definitions in Week 4, test the logic in Week 8, and synthesize the argument in Week 12. The question is precise, the method is sound, and the scope is manageable. The project is ready to commence.
