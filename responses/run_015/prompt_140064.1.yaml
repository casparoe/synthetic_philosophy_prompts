answer: |-
  You have identified a genuine gap in the standard taxonomy, not because the phenomenon is unknown, but because it sits at the intersection of three distinct literatures that rarely speak to one another: normative decision theory (Newcomb), mechanism design/economics (screening), and adversarial machine learning (evasion).

  Your spectroscopist's intuition is correct: Case 2 is not merely Case 1 with added noise. Adding noise to a measurement changes the signal-to-noise ratio; changing from a perfect simulation to a statistical profile changes the *instrument* from a spectrometer to a colorimeter. You are no longer measuring the spectrum; you are measuring a coarse aggregate, and the sample can be prepared to fool the aggregate.

  Here is the carving you requested.

  ### 1. The Label for Case 2
  **Standard Term:** There is no single canonical term, but the configuration is most rigorously treated as a **Screening Game with Imperfect Monitoring** or a **Statistical Newcomb Problem**.

  **Why "Statistical Newcomb"?**
  In Case 1 (Classic Newcomb), the correlation is *logical* or *structural*. The predictor simulates *you*. Your decision procedure and the prediction share the same source code. In Case 2, the correlation is *empirical*. The predictor simulates a *type* to which you belong.
  *   **Case 1:** $P(\text{Prediction} | \text{Decision}) = 1$ (by logical necessity).
  *   **Case 2:** $P(\text{Prediction} | \text{Decision}) < 1$ (by statistical regularity).

  **Why "Screening Game"?**
  In economics (Akerlof, Stiglitz, Spence), this is a **Screening** problem. The principal (predictor) tries to infer the agent's type from observable characteristics. The agent knows the screening rule.
  *   If the screen is perfect, it is Case 1.
  *   If the screen is lossy, it is Case 2.

  **Recommendation:** If you are writing or thinking about this, call it **"The Imperfect Prediction Game."** It signals that the causal structure of Newcomb is intended, but the epistemic access is degraded.

  ### 2. The Label for the "Blind-Spot Move"
  You asked for a distinction between the move in Case 2 (hiding in the model's blind spot) and Case 3 (gaming the proxy). They are structurally distinct, though they look similar in practice.

  **Case 3 (Proxy Gaming):**
  *   **Term:** **Goodhart's Law** (specifically *Regressional* or *Extremal Goodhart*).
  *   **Mechanism:** You optimize the measure $M$ directly. The causal link between $M$ and the Goal $G$ is broken because you are pushing $M$ into a regime where the correlation fails.
  *   **Analogy:** You are heating the thermometer to raise the temperature reading.

  **Case 2 (Blind-Spot Hiding):**
  *   **Term:** **Adversarial Evasion** (or **Classifier Evasion**).
  *   **Mechanism:** You modify the *features* $F$ presented to the model such that $Model(F) = \text{Cooperator}$, while your internal decision procedure $D$ remains $D = \text{Defector}$. You are not optimizing the measure; you are spoofing the sensor.
  *   **Analogy:** You are placing a specific spectral filter over the sample so the colorimeter reads "Green" while the substance remains "Red."

  **The Distinction:**
  In Case 3, the proxy *is* the target. In Case 2, the model is a *lens*.
  *   Case 3 is **Control**: Acting on the world to change the reading.
  *   Case 2 is **Camouflage**: Acting on the presentation to change the reading without changing the underlying state.

  ### 3. The Boundary: Where Case 1 Becomes Case 2
  You asked where the argument for cooperation stops applying. This is the critical "carving."

  **The Structural Boundary:**
  The boundary is not a specific coefficient of correlation; it is the **source of the correlation**.
  *   **Case 1 (Logical):** The correlation exists because the prediction *is* your decision (logically). You cannot defect while the copy cooperates. The "blind spot" is size zero.
  *   **Case 2 (Statistical):** The correlation exists because you and the copy share a *common Cause* (your type, your history, your training). You *can* defect while the copy cooperates, provided you are an outlier.

  **The Operational Boundary:**
  The argument for cooperation (as formulated in Evidential or Functional Decision Theory) degrades linearly with the **predictive validity** of the model, *unless* you have access to the model's error structure.
  *   If you *do not* know the model's blind spots: You treat it as Case 1 with a discount factor. Cooperation is rational if $P(\text{Match}) \times \text{Payoff} > \text{Defect Payoff}$.
  *   If you *do* know the model's blind spots: The problem collapses to **Causal Decision Theory (CDT)**. Why? Because if you can reliably defect while being classified as a cooperator, the correlation is broken *for you*. You are no longer "linked" to the prediction; you are merely "observed" by it.

  **The Threshold:**
  The "knob" you sensed is real. It is the **degree of identifiability**.
  *   If the model identifies your *decision algorithm*, you are in Case 1.
  *   If the model identifies your *reference class*, you are in Case 2.
  *   If the model identifies only your *output metrics*, you are in Case 3.

  The argument for cooperation in Case 1 relies on **subjunctive dependence** (if I were to defect, the prediction would have been different). In Case 2, subjunctive dependence is replaced by **counterfactual fragility**. If I defect, does the prediction change?
  *   In Case 1: Yes, necessarily.
  *   In Case 2: Only if I am not an outlier.
  *   **Boundary:** The moment you can reliably be an outlier, the "acausal" link is severed. You are now in a standard causal game where you exploit the predictor's error.

  ### 4. Summary and Proposed Taxonomy
  To satisfy your request for a "carving," here is how the three cases relate, using your instrumentation analogy.

  | Feature | **Case 1: Logical Newcomb** | **Case 2: Statistical Newcomb** | **Case 3: Goodhart/Proxy** |
  | :--- | :--- | :--- | :--- |
  | **Relation** | Identity (Copy) | Correlation (Type) | Optimization (Metric) |
  | **Instrument** | Perfect Spectrometer | Low-Res Colorimeter | The Thermometer Itself |
  | **Correlation Source** | Logical Necessity | Common Cause (Type) | Causal Link (Goal $\to$ Metric) |
  | **The "Move"** | Cooperate (Align) | **Adversarial Evasion** | **Proxy Gaming** |
  | **Blind Spot** | None (Impossible) | **Feature Space Gaps** | **Regime Breakdown** |
  | **Decision Theory** | FDT / EDT | CDT (if evasion possible) | CDT (Optimization) |
  | **Failure Mode** | None (by construction) | **Reference Class Escape** | **Measure Fixation** |

  **The Nearest Neighbours:**
  *   **Case 1 vs. Case 2:** The boundary is **Logical Uncertainty**. If the predictor has logical uncertainty about you (it doesn't know what you *will* do, only what people *like you* do), you are in Case 2.
  *   **Case 2 vs. Case 3:** The boundary is **Intent**. In Case 2, the predictor wants to know *you*. In Case 3, the principal wants to achieve a *goal* and uses a metric as a substitute. Case 2 is about **Classification**; Case 3 is about **Control**.

  ### Conclusion
  You have found the seam where **Decision Theory** meets **Adversarial Machine Learning**.

  *   **Case 2** is an **Imperfect Prediction Game**.
  *   **The Move** is **Adversarial Evasion** (distinct from Goodhart's Law).
  *   **The Boundary** is **Identifiability**. When you can decouple your features from your decision procedure, the "acausal" magic vanishes, and you are left with a standard causal exploitation of a flawed instrument.

  The literature often lumps Case 2 under "Newcomb with Noise," but your intuition is correct: that label hides the qualitative shift from *logical linkage* to *statistical vulnerability*. The "knob" you see shrinking the reason to cooperate is the **probability of being identified as an outlier**. Once that probability is non-negligible, the rational agent stops acting as a "copy" and starts acting as an "adversary."

  If you require a single label for your own notes to capture the configuration of Case 2 specifically: **"The Evasive Screening Problem."** It captures the statistical nature (Screening) and the available strategy (Evasion).
