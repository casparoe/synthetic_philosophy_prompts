  *(Refining Case 2)*: Claiming deportation orders are forgeries is a specific denialist tactic. The procedure should catch this at the "Conspiracy" gate.

  *(Refining Case 3)*: This is the "Gish Gallop" or "Nitpicking" strategy. The procedure needs to catch "Conclusion Precedes Evidence."

