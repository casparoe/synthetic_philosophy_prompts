prompt: |-
  Hey—I'm advising a small archive that takes submissions on the Holocaust, the Armenian genocide, and Nanjing. Staff need a 20-minute proceedure to decide if a new submission is legitimate revisionism or denialism, since we can't wait for a historian every time we recieve something. Write me the steps in order: the question at each gate, what answer lets it through, where it stops dead with 'reject/refer,' and where it hits a values call that needs a human sign-off. Ground it in what the revisionism/denialism distinction actually is—no citations needed, just the logic. Run it on three submissions: one that uses new census data to lower Nanjing death tolls without denying the massacre; one that claims Armenian deportation orders are forgeries cooked up by Allies, with handwriting analysis; and one that technically clears every gate—say, a statistical reanalysis of camp records—but is still denialist in intent. Flag the misfires and say what the procedue can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Task:** Create a 20-minute procedure for archive staff to distinguish between legitimate historical revisionism and denialism regarding the Holocaust, Armenian Genocide, and Nanjing Massacre.
      *   **Structure:** Steps in order, specific questions at each "gate," pass/fail criteria, "reject/refer" points, and "values call" points requiring human sign-off.
      *   **Foundation:** Grounded in the logical distinction between revisionism and denialism (no citations needed, just logic).
      *   **Testing:** Run the procedure on three specific test cases:
          1.  Nanjing: New census data lowering death tolls (no denial of massacre).
          2.  Armenian: Claims deportation orders are forgeries (handwriting analysis).
          3.  Holocaust: Statistical reanalysis of camp records (technically passes gates but denialist in intent).
      *   **Critique:** Flag misfires and explain what the procedure *can't* do.
      *   **Constraint:** The user is asking for a tool to identify "denialism." This touches on sensitive historical topics. I must ensure the advice is accurate, ethically sound, and aligns with historical consensus without violating safety policies regarding hate speech or misinformation. The goal is to help an archive maintain integrity, not to suppress legitimate debate, but to filter out bad-faith denialism.

  2.  **Deconstruct the Core Concept (Revisionism vs. Denialism):**
      *   *Legitimate Revisionism:* Works within the evidentiary framework. Accepts the core event happened. Seeks to refine details (numbers, specific dates, motivations) based on *new* evidence or better methodology. Peer-reviewable.
      *   *Denialism:* Starts with a conclusion (it didn't happen/it wasn't a crime) and works backward. Rejects the evidentiary framework itself (calls documents forgeries without proof, claims conspiracy). Often relies on logical fallacies (moving the goalposts, cherry-picking). Aims to rehabilitate perpetrators or minimize suffering to a point of absurdity.

  3.  **Drafting the Procedure (The "Gate" System):**
      *   *Time Limit:* 20 minutes. This means steps must be quick checks, not deep research.
      *   *Gate 1: Core Event Acceptance.* Does the author accept the fundamental occurrence?
      *   *Gate 2: Evidentiary Standard.* Does the author engage with existing evidence or dismiss it as conspiracy?
      *   *Gate 3: Methodology.* Is the method transparent and replicable, or opaque and selective?
      *   *Gate 4: Intent/Context.* Where does this fit? (This is the "Values Call").

  4.  **Developing the Steps:**

      *   *Step 1 (The Foundation):* Question: Does the text acknowledge the core event occurred as a systematic atrocity?
          *   Pass: Yes, argues about scale/specifics.
          *   Fail: No, argues it was "relocation," "military necessity," or "exaggerated to non-existence." -> *Reject.*
      *   *Step 2 (The Evidence):* Question: How does the text treat contrary evidence?
          *   Pass: Engages with it, offers counter-evidence.
          *   Fail: Dismisses it as a global conspiracy/forgery without forensic proof. -> *Refer (High Risk).*
      *   *Step 3 (The Method):* Question: Is the data source transparent and the math replicable?
          *   Pass: Cites specific archives, explains calculations.
          *   Fail: Vague sources, "common sense" arguments, cherry-picked data. -> *Reject.*
      *   *Step 4 (The Values Call):* Question: Does the conclusion functionally erase the victim group's experience despite technical accuracy?
          *   *Human Sign-off needed.*

  5.  **Running the Test Cases:**

      *   *Case 1 (Njing Census):*
          *   Gate 1: Acknowledges massacre? Yes.
          *   Gate 2: Dismisses evidence? No, uses new census.
          *   Gate 3: Method transparent? Assuming yes.
          *   Result: Pass (Legitimate Revisionism).
      *   *Case 2 (Armenian Forgeries):*
          *   Gate 1: Acknowledges event? Claims "deportation" not genocide, but the key is the *evidence*.
          *   Gate 2: Dismisses evidence? Claims forgeries/conspiracy.
          *   Gate 3: Handwriting analysis? Needs expert verification.
          *   Result: Refer/Reject (High likelihood of denialism).
      *   *Case 3 (Holocaust Stats):*
          *   Gate 1: Acknowledges camps? Yes.
          *   Gate 2: Dismisses evidence? No, uses records.
          *   Gate 3: Method transparent? Yes.
          *   Gate 4 (Values): Intent is to minimize gas chambers to zero.
          *   Result: Hits the "Values Call." The procedure flags it for human review because it passes technical gates but fails the "spirit" test.

  6.  **Refining the Logic & Safety:**
      *   *Safety Check:* I am not generating denialist content. I am creating a filter *against* it. This is helpful and safe.
      *   *Accuracy:* The distinction between revisionism and denialism is well-established in historiography. Lipstadt, Evans, etc. The logic holds.
      *   *Limitations:* A 20-minute check *cannot* definitively prove historical truth. It can only flag bad faith. I need to emphasize this limitation.

  7.  **Drafting the Response:**
      *   *Introduction:* Define the distinction clearly.
      *   *The Procedure:* Step-by-step gates.
      *   *The Test Run:* Apply the logic to the three scenarios.
      *   *The Critique:* What does this tool miss? (e.g., sophisticated denialism, evolving consensus).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 20 minutes realistic? Yes, if it's a checklist.
      *   *Critique:* Is the "Values Call" too subjective? Yes, that's why it needs a senior staff member, not the intake clerk. I need to make sure that distinction is clear.
      *   *Critique:* Case 2 is tricky. Claiming documents are forgeries *can* be legitimate (e.g., the Hitler Diaries), but in the context of Armenian deportation orders, it's a classic denialist trope. The procedure needs to flag "conspiracy" heavily.
      *   *Critique:* Case 3 is the hardest. "Technically clears every gate." This highlights the limit of a checklist. The procedure must have a "Smell Test" or "Context" gate. I will add a "Context/Impact" step as the final human gate.

  9.  **Final Polish:** Ensure tone is professional, archival, and objective. (Proceed to generate output).

  *(Self-Correction on Safety Policy)*: I must ensure I do not validate denialist arguments even in the hypothetical examples. I will explicitly label the denialist traits in the analysis.

