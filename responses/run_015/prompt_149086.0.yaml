answer: |-
  ### Core Logic: Revisionism vs. Denialism
  Before applying the procedure, staff must understand the logical distinction. This is not about "opinion"; it is about methodology.

  *   **Legitimate Revisionism:** Starts with the evidence and follows it to a conclusion. It accepts the **core consensus** (the event happened, it was systematic, it was criminal) but seeks to refine details (numbers, specific dates, chain of command) using new data or better methods. It engages with contrary evidence.
  *   **Denialism:** Starts with a conclusion (the event did not happen/was not criminal) and selects evidence to support it. It rejects the **core consensus** by attacking the evidentiary framework itself (calling documents forgeries, claiming global conspiracies). It ignores contrary evidence or moves the goalposts when refuted.

  ---

  ### The 20-Minute Triage Protocol
  **User:** Intake Archivist
  **Time Limit:** 20 Minutes
  **Goal:** Filter obvious denialism, flag high-risk submissions, clear legitimate research.

  #### Gate 1: The Core Event Check (3 Minutes)
  **Question:** Does the submission explicitly acknowledge the fundamental occurrence of the atrocity as defined by mainstream historical consensus?
  *   *Nanjing:* Acknowledges a massacre of civilians/POWs occurred.
  *   *Armenian:* Acknowledges systematic deportation and mass death occurred.
  *   *Holocaust:* Acknowledges systematic extermination of Jews occurred.
  *   **Pass:** Yes. The argument is about *scale, mechanism, or specific intent*, not existence.
  *   **Fail:** No. The text suggests it was "military necessity," "relocation," "exaggerated propaganda," or "did not happen."
  *   **Action:** **REJECT.** (Do not archive as history; tag as denialist literature if your policy requires collecting such material separately).

  #### Gate 2: The Conspiracy Filter (5 Minutes)
  **Question:** How does the author explain the existence of overwhelming contrary evidence (documents, testimony, physical evidence)?
  *   **Pass:** Engages with the evidence. Argues the evidence is misinterpreted, incomplete, or outweighed by *new* data.
  *   **Fail:** Dismisses evidence as a coordinated forgery, a post-war fabrication, or a conspiracy by "Allies," "Zionists," "Imperialists," or "Victors."
  *   **Action:** **REFER.** (Stop intake. Send to Senior Historian. This is a hallmark of denialism).

  #### Gate 3: Methodological Transparency (7 Minutes)
  **Question:** Are the data sources cited, accessible, and the calculations replicable?
  *   **Pass:** Specific archive codes, census IDs, or record groups are listed. Math is shown.
  *   **Fail:** Vague references ("records show," "it is known"), reliance on secondary denialist literature, or "common sense" arguments replacing data.
  *   **Action:** **REJECT/RETURN.** (Ask for sources. If they cannot provide verifiable primary sources, it is not archival material).

  #### Gate 4: The Impact & Intent Assessment (5 Minutes) **[VALUES CALL]**
  **Question:** If the technical data is accurate, does the *conclusion* functionally erase the victim group's experience or rehabilitate the perpetrators?
  *   **Note:** This requires human judgment. A submission can be technically precise but historically misleading (e.g., proving 100 people died in a specific camp to imply no one died there).
  *   **Action:** **HUMAN SIGN-OFF REQUIRED.** (Senior Archivist must decide if the context is misleading).

  ---

  ### Test Run: Three Submissions

  #### Case 1: Nanjing Census Reanalysis
  *   **Submission:** Uses newly discovered 1938 population census data to argue the death toll was 150,000 rather than 300,000. Explicitly states the massacre was systematic and criminal.
  *   **Gate 1 (Core Event):** **PASS.** Acknowledges the massacre.
  *   **Gate 2 (Conspiracy):** **PASS.** Does not claim documents are forgeries; uses new data.
  *   **Gate 3 (Method):** **PASS.** Cites specific census records.
  *   **Gate 4 (Impact):** **PASS.** Refines the number but does not erase the crime.
  *   **Verdict:** **ACCEPT.** This is legitimate revisionism. It refines the historical record without denying the event.

  #### Case 2: Armenian Deportation Orders
  *   **Submission:** Claims the Tehlirian trial documents and deportation telegrams are forgeries cooked up by the Allies. Includes amateur handwriting analysis.
  *   **Gate 1 (Core Event):** **FAIL/REFER.** While it admits "deportation," framing the key evidence as a Allied conspiracy attacks the core evidentiary framework.
  *   **Gate 2 (Conspiracy):** **FAIL.** Explicitly claims documents are "cooked up by Allies."
  *   **Gate 3 (Method):** **FAIL.** Amateur handwriting analysis is not replicable forensic science.
  *   **Verdict:** **REFER/REJECT.** This hits Gate 2 hard. Claiming core documents are global forgeries is a classic denialist trope. It stops dead at Gate 2.

  #### Case 3: Holocaust Camp Statistics
  *   **Submission:** A statistical reanalysis of camp intake/death records. Acknowledges camps existed. Math is replicable. Sources are cited. Conclusion: "Gas chambers were technically inefficient; most deaths were due to disease/typhus, therefore 'extermination' is a misnomer."
  *   **Gate 1 (Core Event):** **PASS.** Acknowledges camps and deaths.
  *   **Gate 2 (Conspiracy):** **PASS.** Uses camp records, doesn't claim they are forgeries.
  *   **Gate 3 (Method):** **PASS.** Math is transparent.
  *   **Gate 4 (Impact):** **FLAG.** This is the "Values Call."
  *   **Verdict:** **HUMAN SIGN-OFF.**
      *   *Analysis:* This submission clears the technical gates but fails the historical logic. It uses a technical truth (typhus killed many) to deny the *intent* and *mechanism* of genocide (gas chambers/extermination policy).
      *   *Outcome:* Senior Archivist must recognize this as "soft denialism." It uses revisionist *methods* to achieve a denialist *end*. It should likely be **REFERRED** or cataloged with a prominent contextual note, as it mimics scholarship to undermine consensus.

  ---

  ### Limitations & Misfires: What This Procedure Can't Do

  **1. The "Sophisticated Denialist" Problem**
  *   **Misfire:** Case 3 shows that a submission can pass Gates 1–3 and still be denialist. Denialism has evolved. Some actors use accurate data to draw misleading conclusions (e.g., "X number died in Camp Y" implies "Only X died total").
  *   **Limitation:** A 20-minute checklist cannot catch nuanced bad-faith argumentation. That is why Gate 4 exists, but Gate 4 relies on the Senior Archivist's historical literacy. If your Senior Archivist isn't specialized in these fields, they may be fooled by technical jargon.

  **2. The "Evolving Consensus" Problem**
  *   **Misfire:** Legitimate history changes. Thirty years ago, some arguments about the Holocaust or Nanjing that are now consensus were considered "revisionist."
  *   **Limitation:** This procedure protects the *current* consensus. It risks rejecting a groundbreaking legitimate discovery that challenges the status quo (e.g., if a genuine document surfaced proving a specific order was forged).
  *   **Mitigation:** The "REFER" option is crucial. Never "REJECT" a submission that passes Gate 1 but fails Gate 2 or 3 without a second opinion. Denialism is predictable; genuine breakthroughs are rare.

  **3. The "Values Call" Subjectivity**
  *   **Misfire:** Gate 4 asks staff to judge "intent." This is subjective.
  *   **Limitation:** Staff may hesitate to label something "denialist" for fear of bias.
  *   **Mitigation:** Define "Intent" operationally: *Does the conclusion contradict the weight of the evidence provided within the text itself?* (e.g., If the text admits 1 million died but concludes "no genocide occurred," the logic is broken).

  **4. Resource Constraints**
  *   **Misfire:** A 20-minute check assumes staff can spot a fake citation or a conspiracy trope quickly.
  *   **Limitation:** Untrained staff may not recognize specific denialist tropes (e.g., specific phrases used by Holocaust deniers).
  *   **Mitigation:** This procedure requires a one-page "Red Flag Glossary" attached to the protocol listing common phrases (e.g., "Holohoax," "Alleged genocide," "War losses" vs. "Extermination").

  ### Final Recommendation
  This procedure is a **sieve, not a scale**. It will catch the heavy, obvious denialism (Case 2) and accept obvious revisionism (Case 1). It will struggle with the sophisticated camouflage (Case 3).

  **Do not rely on this procedure alone.** It must be paired with a policy that says: *"Any submission passing technical gates but contradicting established historical consensus on intent or mechanism requires external peer review before accessioning."* This shifts the burden of proof from the intake clerk to the author's peers.
