answer: |-
  Here is a decision procedure designed for your constraints: one page, plain language, legally defensible, and operational at a Town Meeting. Following that is the analysis of your specific questions, the three test cases, and the meta-commentary you asked for.

  ### The Procedure: "Voting Eligibility & Standing Filter"
  *(Copy/Paste this for the Moderator/Board)*

  **1. The Legal Floor (Legal Question)**
  *   **Ask:** Does State Election Law explicitly permit a non-registered voter to cast a ballot on this article?
  *   **If NO:** Voting is restricted to registered town voters. **STOP.** The argument ends. Non-voters may speak but not vote.
  *   **If YES:** Proceed to Step 2. (Note: In 99% of cases, the answer is NO).

  **2. The Coercion Test (Factual Question)**
  *   **Ask:** Does this specific article create a legal obligation, penalty, or enforceable restriction that applies *directly* to the person claiming a vote?
  *   **If NO:** (e.g., they are merely "affected" by economic ripple effects or environmental drift). They do not get a vote. **STOP.**
  *   **If YES:** (e.g., they will be fined for non-compliance). Proceed to Step 3.

  **3. The Recourse Test (Factual/Political Question)**
  *   **Ask:** Does this person reside in a jurisdiction (another town, state, or tribal land) that has legal authority to regulate this matter or negotiate with us?
  *   **If YES:** They exercise influence through their own representatives. They do not get a vote here. **STOP.**
  *   **If NO:** (e.g., they are non-citizen workers with no voting franchise anywhere). Proceed to Step 4.

  **4. The Legitimacy Check (Values Question)**
  *   **Ask:** If they pass Step 2 (Coercion) but fail Step 1 (Legal Floor), does the burden fall disproportionately on them compared to the voters?
  *   **If YES:** The Board must either (A) absorb the cost onto the voting electorate, or (B) require a 2/3 Supermajority of voters to pass the measure.
  *   **If NO:** Standard majority vote proceeds.

  ***

  ### Analysis of Your Conceptual Questions

  **Causal vs. Bound vs. Author**
  These are three separate tests, but only one is operational for voting.
  *   **Causal (Affected):** Too broad. Everything affects everyone. *Reject as a voting criterion.* Use only for determining who gets *speaking time*.
  *   **Bound (Subjected):** This is your voting threshold. If the law doesn't touch them, they don't vote.
  *   **Author (Participation):** This is the ideal, but in a representative system, "authorship" is delegated. You cannot satisfy this for every vote without collapsing the system.
  *   **Verdict:** Use **Bound** for voting. Use **Causal** for speaking rights. Ignore **Author** as a procedural test; it's a goal, not a rule.

  **The "Go To Your Own Town" Move**
  *   **Verdict:** Keep it. It is the only hard stop against infinite expansion.
  *   **Risk:** It assumes their town *will* act. If their town is corrupt or indifferent, your town becomes a free rider on their suffering.
  *   **Mitigation:** This is why Step 4 (Legitimacy Check) exists. If they can't vote there *and* you burden them here, you must pay for it yourselves.

  **Reciprocity**
  *   **Verdict:** Drop it.
  *   **Reason:** It turns rights into bargaining chips. If their town is authoritarian, do you become authoritarian? No. Base eligibility on *your* principles and *their* subjection, not on their rules.

  **The Recursion (Who decides the demos?)**
  *   **Verdict:** You cannot solve this philosophically. You solve it administratively.
  *   **Fix:** The Selectboard adopts *this* procedure by resolution. The recursion stops at the Board's authority to set meeting rules. If someone challenges it, they challenge the Board's authority, not the voter list. Write down the objection in the minutes. That is the "receipt."

  **Time (July residents & Future generations)**
  *   **Verdict:**
      *   **July Residents:** If they are not registered voters by the warning deadline, they are out. Administrative bright line.
      *   **Future Generations:** They cannot vote. Current voters act as trustees. The only check is the **20-Year Bond Rule**: If debt exceeds X years, require a Supermajority. This forces current voters to feel the pain of the decision.

  ***

  ### Running the Procedure on Your Three Cases

  **Case 1: Gravel Pit Rezoning (Downstream Town)**
  *   **Step 1 (Legal):** State law says only registered voters vote. **STOP.**
  *   **Outcome:** Downstream neighbors do not vote.
  *   **Mitigation:** They pass Step 2 (Causal) but fail Step 3 (Recourse—they have their own Selectboard). They get guaranteed speaking time (10 mins), and the Moderator must read their objection into the minutes.
  *   **Why:** Physical effects (silt) are not legal coercion. They must use their own zoning or state environmental law to stop you.

  **Case 2: 20-Year Bond & School Closure (Kids/Teachers/Parents)**
  *   **Step 1 (Legal):** Minors cannot vote. Non-resident teachers cannot vote. **STOP.**
  *   **Outcome:** Only current registered voters decide.
  *   **Mitigation:** Because the debt outlives the voters (Time issue), Step 4 triggers. The bond requires a **2/3 Supermajority** to pass, not a simple majority. Parents do not get extra votes (violates "one person, one vote").
  *   **Why:** Future kids are "affected" but not "bound" yet. The Supermajority is the proxy for their consent.

  **Case 3: Water Ordinance (Dairy Crew/Non-citizens)**
  *   **Step 1 (Legal):** State law forbids non-citizen voting. **STOP.**
  *   **Step 2 (Coercion):** **YES.** The ordinance raises their costs/limits their water use directly.
  *   **Step 3 (Recourse):** **NO.** They cannot vote in their home country or here.
  *   **Step 4 (Legitimacy):** **FAIL.** They are bound but voiceless.
  *   **Outcome:** **You cannot pass this ordinance as written.**
  *   **The Hard Truth:** Because they are subjected to the law (Step 2) but barred from voting (Step 1) and have no recourse (Step 3), the procedure dictates you must either: (A) Subsidize the cost increase from the general fund (voters pay), or (B) Kill the ordinance.
  *   **Why:** This is the one you won't like. The procedure identifies a legitimacy deficit that money or argument cannot fix. If you pass it anyway, you are acknowledging rule over subjects without consent.

  ***

  ### Meta-Commentary & Limitations

  **Where this comes from vs. Ad Hoc**
  *   **Scholarly Consensus:** The distinction between "All Affected" (Step 2 Causal) and "All Subjected" (Step 2 Coercion) is standard political science. Using *Coercion* as the voting threshold is the only way to avoid infinite regress.
  *   **Ad Hoc:** Step 4 (The Supermajority/Cost Shift). This is a pragmatic patch I added to handle the moral residue when Law and Ethics clash. It's not standard theory; it's damage control.

  **What I Would Drop First**
  *   **Step 4.** If a professional municipal lawyer looked at this, they would tell you to cut Step 4 immediately. It invites lawsuits claiming unequal taxation or violation of voting rights acts. It creates a "second class" of legislation. If you need to simplify to survive a legal challenge, drop Step 4 and rely entirely on Step 1 (State Law).

  **What Would Change My Mind**
  *   **Regional Compact.** If your state legislature passed a law allowing "Impact Districts" for cross-border issues (like water sheds), I would rewrite Step 1 to allow voting for anyone in the district. Without that statutory change, Step 1 is a concrete wall.

  **What This Procedure Will Never Settle**
  *   **The Moral Weight of the Future.** No procedure can make a 40-year-old voter truly care about a cost that lands on their 60-year-old self or their grandchild. The Supermajority requirement slows it down, but it doesn't solve the time-inconsistency problem.
  *   **The "Right" Boundary.** This procedure manages the conflict; it doesn't resolve the philosophical tension. You will still feel guilty about the dairy workers. That guilt is the price of the system. Do not try to proceduralize it away.

  **Final Advice:**
  Adopt this by resolution *before* the next meeting. When the argument starts, the Moderator reads Step 1. If State Law says "No," the argument is over. If the crowd is angry, move to Step 4 (Supermajority) as a compromise. It buys legitimacy without breaking the law.
