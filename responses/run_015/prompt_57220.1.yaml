      *   *Exit 2 (Drop 3/4 - Belief at Will):* If I deny (4), I'm saying we have direct voluntary control over belief. This contradicts the "aim at truth" norm. But I don't need to deny (4) entirely, just the implication in (5) that this control entails permanent knowledge.
      *   *Exit 3 (Davidson):* Partitioning saves intentionality but fractures the self. The "belief" is real but isolated. Cost: Explaining how the partitions interact (the very thing SD requires).
      *   *Exit 4 (Accept 7 - Bias):* Distinction is motivational direction. Bias is unmanaged drift; SD is managed drift. But if the management doesn't yield belief, what is it? It yields *action* based on false premises.

  7.  **Final Polish:** Check against the user's specific preference ("rather keep (9) than (1)"). This suggests they want to preserve the possibility of deliberate belief improvement. This aligns with attacking (5)/(6). If (9) is possible (deliberate improvement), then (6) is false. Therefore, SD is possible via the same mechanism.

