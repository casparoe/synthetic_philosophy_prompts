  *(Self-Correction on the Recommendation)*: Actually, looking at the Chair's rule: "if the verdict differs... record 'foreseen, not aimed at' and leave the intentionality question blank." This effectively *replaces* the binary intentionality field in contentious cases. My recommendation should be to **Retain the field with a definition plus the restatement requirement.** This keeps the field for clear cases but uses the rule for ambiguous/biased ones.

