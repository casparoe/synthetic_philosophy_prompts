answer: |-
  **TO:** University Committee on Automated Systems
  **FROM:** Undergraduate Student Representative
  **DATE:** 10 October 2023
  **SUBJECT:** Recommendation on Intentionality Taxonomy and Incident Reporting

  **Purpose**
  This memo serves as the written opinion required ahead of our vote on 17 October regarding the incident-reporting taxonomy. Specifically, we must decide how to populate the field: *Did the system bring about the outcome intentionally?* We are prompted by two structurally identical incidents that yield divergent moral intuitions: Incident A (registration system displacing priority students to maximize fill rates) and Incident B (booking system freeing accessible rooms to minimize empty hours). The committee's current instinct is to label A "intentional" and B "unintentional." This inconsistency suggests our judgment is being driven by the moral valence of the outcome rather than the mechanical causality of the system.

  **The Reliability of Intentionality Judgments**
  The Chair's proposed "valence-swap restatement rule" identifies a critical vulnerability in our taxonomy. If an analyst labels an outcome "intentional" when described as "displacing priority students" but "unintentional" when described as "optimizing seat allocation," the verdict is measuring the analyst's moral reaction, not the system's architecture. For an institutional body, this is unreliable data. We are tasked with predicting whether a behavior will persist once the objective function is changed. If we label a side effect "intentional" simply because it is harmful, we risk misdiagnosing the cause. We might punish the developers for malice when the error lies in a poorly weighted variable. In this sense, a verdict that flips under neutral restatement is epistemically broken; it cannot guide technical remediation.

  However, we must also acknowledge what we lose by treating these verdicts as unreliable. The Director of Student Conduct is correct that vocabulary matters. When we tell a student body that a harm was "foreseen but not aimed at," it sounds like a legal loophole. "Intentional" carries a weight of accountability that "foreseen" does not. If we sanitize our language too aggressively, we lose the ability to signal institutional condemnation of negligent design. The Faculty Representative is also right that experimental data describes how people *do* talk, not how they *should*. But as an oversight body, we are not describing lay talk; we are setting a standard. The risk of the Chair's rule is that it may render the taxonomy so cautious that it fails to capture genuine negligence where the "aim" was implicitly encoded in the objective function.

  **Recommendation**
  I recommend we **retain the field with a formal definition plus the restatement requirement.**

  We should not drop intentionality language (Option 4), as accountability is central to our mandate. Nor should we retain the field as is (Option 1), as the A/B discrepancy proves the current standard is subjective. Instead, we adopt the Chair's rule as a mandatory validation step. This satisfies the Director's need for consistency (humans are also subject to bias and should be judged by similar rigor) and the Faculty Representative's demand for prescriptive definitions.

  **Proposed Definitions and Application**
  Effective immediately, analysts must apply the following protocol before submitting a finding:

  1.  **Definition of Intentional:** An outcome is intentional only if it was explicitly represented in the system's objective function or was a necessary means to that function, *and* the outcome persists under neutral description.
  2.  **Restatement Protocol:** The analyst must write the outcome twice: once in the morally loaded description (e.g., "displacing students") and once in a neutral description matched on foresight (e.g., "reassigning enrollments").
  3.  **Adjudication:** If the intentionality verdict differs between the two descriptions, the analyst must record "Foreseen, Not Aimed At" and leave the Intentionality field blank.

  *Application to Incident A:*
  *   *Loaded:* "System intentionally displaced priority students."
  *   *Neutral:* "System intentionally reassigning enrollments to maximize fill rate."
  *   *Verdict:* The displacement was a means to the fill rate, but was it the aim? If the objective function was purely "fill seats," the displacement is a side effect. Under the restatement rule, if the analyst feels it is intentional only because it is harmful, they must mark "Foreseen, Not Aimed At." This correctly identifies that changing the objective function (e.g., weighting priority status) will fix the bug.

  *Application to Incident B:*
  *   *Loaded:* "System intentionally improved access."
  *   *Neutral:* "System intentionally reshuffled bookings to minimize empty hours."
  *   *Verdict:* Almost no one views this as intentional access improvement. Under the rule, this is "Foreseen, Not Aimed At."
  *   *Result:* Both incidents receive the same classification ("Foreseen, Not Aimed At"), accurately reflecting that in both cases, the specific social outcome was a byproduct of an efficiency metric, not a direct command.

  **Implementation Timeline**
  *   **17 October:** Committee vote on taxonomy amendment.
  *   **24 October:** Drafting of analyst guidance document incorporating the Restatement Protocol.
  *   **1 November:** Training session for data analysts and committee liaisons.
  *   **15 November:** Pilot application of new taxonomy on three historical closed cases to test for consistency.
  *   **1 December:** Final review of pilot data; adjustments to guidance if "Foreseen" is being overused.
  *   **15 December:** Full deployment for Spring term incident reporting.

  **The strongest thing to be said for the losing option**
  The strongest argument belongs to those who wish to retain the field as it stands, without the restatement requirement. They argue that institutional taxonomy should reflect community moral intuition, not just mechanical causality. If the community perceives the displacement in Incident A as an intentional act of harm, correcting that perception to "foreseen side effect" may feel like gaslighting. There is value in a system that allows us to say "this was wrong" without needing to parse the difference between aim and foresight. By prioritizing technical precision, we risk creating a taxonomy that is logically consistent but morally inert, potentially shielding designers from the reputational consequences that drive better behavior.
