      *   **Key Players/Positions:**
          *   *Chair (Computer Scientist):* Proposes "valence-swap restatement rule" (write outcome in loaded vs. neutral terms; if verdict flips, mark "foreseen, not aimed at").
          *   *Director of Student Conduct:* Wants consistency with human staff findings (same vocabulary for bots and humans).
          *   *Faculty Representative:* Argues experimental philosophy just describes lay talk, not prescriptive institutional definitions.
          *   *Me (Student Rep):* Need to take a stance, argue for it, provide a timeline, definitions, and a concession paragraph.
      *   **Constraints:** ~2 pages, no academic citations (committee won't read them), argue in own terms, take Chair's rule seriously (pros/cons), close with "The strongest thing to be said for the losing option."
      *   **Recommendation Options:**
          1.  Retain field as is.
          2.  Retain with definition + restatement requirement.
          3.  Replace with aim-versus-foresight breakdown.
          4.  Drop intentionality language altogether.

  2.  **Determine the Stance:**
      *   *Option 1 (Retain as is)* is risky because it allows the Knobe effect bias to persist, leading to inconsistent labeling (Intentional in A, Unintentional in B, despite identical mechanics).
      *   *Option 4 (Drop intentionality)* is too radical; accountability matters.
