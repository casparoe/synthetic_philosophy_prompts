          *   *My Argument:* If the structure is the same, the label must be the same. If the objective function didn't explicitly reward the specific outcome (displacement/access), it's a side effect.
          *   *Refinement:* The Chair's rule says if the verdict flips on neutral restatement, mark "foreseen, not aimed at." This effectively neutralizes the bias.
      *   **Timeline:** From Oct 17 to end of term (December). Steps for implementation.
      *   **The Concession:** "The strongest thing to be said for the losing option." I need to pick a losing option. Likely Option 1 (Retain as is) or Option 4 (Drop intentionality). Option 1 is the status quo, so it's the natural opponent. I need to make a fair case for why keeping it simple has merit (efficiency, intuitive accountability).

