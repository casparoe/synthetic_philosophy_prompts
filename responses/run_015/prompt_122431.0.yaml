  You are delivering the opening remarks at an interdisciplinary workshop titled "Reward Capture: From Intracranial Stimulation to Artificial Agents." The audience is split evenly between behavioral neuroscientists, who study dopaminergic reward pathways, and AI safety researchers, who study reward tampering in reinforcement-learning systems. Write a ten-minute address that uses wireheading not as a loose analogy but as a structural axis for the workshop's agenda. To do this, introduce and deploy a distinction between "reward substitution"—where an agent replaces an external reward signal with an internal proxy, as seen in classic intracranial self-stimulation studies—and "criterion drift," where an agent gradually redefines the conditions under which reward is granted without ever breaking the measurement channel itself. Show how each discipline tends to study one of these phenomena almost exclusively, and explain why recent interdisciplinary work has conflated the two, producing false predictions about both biological and artificial agents. The speech must remain accessible to both halves of the room: gloss any field-specific jargon immediately, and avoid claiming that biological pleasure is identical to an AI reward function or that either domain already supplies a complete model of the other. Conclude by posing one open research question that genuinely requires collaboration between the two fields, without implying that either side already holds the answer.
