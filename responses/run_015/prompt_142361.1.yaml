      *   **The Forbidden Question:** The personal vulnerability regarding the user's own jury service.

      *(Self-Correction during drafting)*: Make sure the Law & Econ professor's objection isn't just "CJT is wrong" but specifically about the parameters $p$ and $\rho$. Make sure the Public Defender's objection focuses on the *type* of error (convicting innocent vs. acquitting guilty).

      *(Refining the "Must Land")*: It needs to be about the *distribution of outcomes*, not the mean accuracy. That's the user's unique contribution.

      *(Refining the "Forbidden Question")*: It needs to cut to the heart of the user's epistemic humility. "If you don't know if you were persuaded or worn down, how can you design a rule based on that distinction?"

      *(Final Polish)*: Ensure the tone is supportive but rigorous.

