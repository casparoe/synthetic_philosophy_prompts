prompt: |-
  I have spent about ten years writing about the epistemic case for democracy, and for much of that time I have leaned on the Condorcet jury theorem in its textbook form: if each voter is more likely than not to be right and their errors are independent, the probability that a majority is right climbs toward one as the group grows. Four months ago I served on a twelve-person felony jury, and I have not been able to read that result the same way since.

  The case was an assault with a weapon; the evidence was inconsistent testimony and one poor video. We split nine to three on the first ballot. I was one of the three. I changed my vote on the second afternoon, and I still cannot tell whether I was persuaded by something the foreman said or worn down by two days in a small room with eleven people who were already sure.

  Next month I am to give twenty minutes of testimony to our state's criminal rules advisory committee, which has a draft rule that would permit six-person juries in non-capital felony trials. The case for it is cost, backlog, and the difficulty of seating and holding twelve people through a two-week trial. The chair tells me the constitutional floor is settled and is not on the table; what the committee wants from me is whether anything is epistemically lost by halving the jury.

  My testimony is not a simple defence of twelve, and I would rather it did not sound like one. The argument runs like this. Taken naively, the theorem says little in favour of twelve: at a per-juror accuracy of 0.6, and using odd sizes to dodge ties, majority accuracy is roughly 0.75 at eleven and roughly 0.68 at five — a loss of about seven points, real but much smaller than the rhetoric suggests, because of diminishing returns. But the independence assumption is false of juries in the most obvious way: jurors talk to each other for two days, and talking is exactly the mechanism that makes their errors correlated. If residual errors are equicorrelated at ρ, the effective size of a group of n is n/(1 + (n−1)ρ): at ρ = 0.2, eleven jurors behave like about 3.7 independent ones and five like about 2.8; at ρ = 0.4, like about 2.2 and 1.9. The gap between twelve and six nearly disappears, and I intend to say plainly that I do not know whether ρ in a real jury room is 0.1 or 0.6. So there is a trade-off the theorem does not model — deliberation raises each juror's competence and destroys their independence at the same time, and nothing in the theorem says where on that curve a jury ought to sit. My conclusion is that the committee should not decide this on accuracy grounds at all; it cannot, because the parameters are unmeasurable. It should decide on the shape of the distribution of outcomes: a smaller panel is a rougher instrument, with more variable verdicts, more deadlocks, and results more sensitive to which particular six people happened to be seated; and on whether the panel is likely to contain at least one person whose doubt is not correlated with everyone else's. Whether the institution preserves holdouts. I was one, and I am not confident I survived. If they do cut to six, my minimum recommendations are element-by-element verdict forms, so that it is explicit which propositions are being aggregated — a majority on each element and a majority on the verdict can come apart — and some formal standing for a declared minority of two, so that dissent is not purely a matter of stamina.

  The room matters more than the argument, I think. The committee is: a presiding judge of twenty-five years who believes juries work and that academics model the one thing juries do not do (we deliberate, he will say, we do not walk in and vote); a second judge who is an enthusiast for empirical legal studies and will want effect sizes; a senior public defender who will say that the target is not accuracy but the allocation of the risk of error under a burden of proof, and that my model assumes a fact of the matter that contested trials often do not have; a victims'-rights advocate who will care about finality and about hung juries as a second injury; a professor of evidence who will point out that a verdict is a composite judgment over elements; a law-and-economics professor who has in fact heard of the jury theorem and dislikes it, and who will want to know where my p and my ρ come from and why, if the theorem is right, we are not using twenty-four; a state legislator who thinks twelve is a number inherited from people who counted in dozens; and a court administrator who mostly listens.

  What I want from you is a prep sheet, not a defence. Give me the eight or so objections I should expect, in roughly the order they will arrive, each phrased the way that particular person would put it — I want to hear their vocabularies, not yours — and for each one a two-minute reply together with a note on where that reply is soft. Tell me which one or two things I should concede in my first two minutes, before anyone can say I buried them. Tell me which single reply has to land if the testimony is to move anyone at all. And give me the question I am hoping nobody asks. Two constraints: do not hand me citations, studies, or a reading list — I cannot use them in twenty minutes of oral testimony and this committee stops listening the moment an academic starts citing papers, so I would rather have the objections framed conceptually. And if any of the numbers in my sketch are wrong, say so before you rely on them; the arithmetic is the part I am least able to check standing up.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **User:** An academic/expert with 10 years of experience writing on the epistemic case for democracy/Condorcet Jury Theorem (CJT). Recently served on a 12-person felony jury (split 9-3, changed vote, unsure why).
      *   **Task:** Testifying next month to a state criminal rules advisory committee about a draft rule permitting 6-person juries in non-capital felony trials.
      *   **Goal:** Provide a "prep sheet" for the testimony.
      *   **Content:**
          *   8 expected objections (phrased in the specific committee members' vocabularies).
          *   2-minute replies for each.
          *   Notes on where each reply is soft.
          *   1-2 things to concede immediately (first 2 minutes).
          *   The *one* single reply that must land to move anyone.
          *   The question the user hopes nobody asks.
      *   **Constraints:** No citations/studies/reading lists (conceptual framing only). Check the arithmetic in the user's sketch before relying on it.
      *   **Tone:** Professional, strategic, empathetic to the user's nuanced position (not a simple defense of 12, but a critique of using accuracy grounds), and attuned to the specific committee dynamics.

  2.  **Verify the Arithmetic (Crucial Step):**
      *   *User's Claim:* At $p=0.6$ (individual accuracy), odd sizes to dodge ties.
      *   *User's Claim:* Majority accuracy $\approx 0.75$ at $n=11$ and $\approx 0.68$ at $n=5$.
      *   *Check:* Binomial distribution $P(X \ge k)$ where $k = \lfloor n/2 \rfloor + 1$.
      *   $n=11$, $p=0.6$. Need 6 or more successes.
          *   Calculation: Sum of binomial probabilities for $k=6$ to $11$.
          *   Using a calculator/approximation:
          *   Mean = $11 * 0.6 = 6.6$. SD = $\sqrt{11 * 0.6 * 0.4} = \sqrt{2.64} \approx 1.62$.
          *   $P(X \ge 6)$ is roughly the probability of being above $(5.5 - 6.6)/1.62 = -0.68$ sigma. That's roughly 0.75.
          *   Exact calculation: $0.753$. User is correct.
      *   $n=5$, $p=0.6$. Need 3 or more successes.
          *   Mean = $3$. SD = $\sqrt{5 * 0.6 * 0.4} = \sqrt{1.2} \approx 1.1$.
          *   $P(X \ge 3)$ is roughly probability above $(2.5 - 3)/1.1 = -0.45$ sigma.
          *   Exact calculation: $0.68256$. User is correct.
      *   *User's Claim:* Loss of about 7 points ($0.75 - 0.68 = 0.07$). Correct.
      *   *User's Claim:* Effective size formula $n_{eff} = n / (1 + (n-1)\rho)$.
      *   *Check:* This is the standard design effect formula for equicorrelated variables.
      *   *Scenario $\rho = 0.2$:*
          *   $n=11$: $11 / (1 + 10*0.2) = 11 / 3 = 3.66$. User says 3.7. Correct.
          *   $n=5$: $5 / (1 + 4*0.2) = 5 / 1.8 = 2.77$. User says 2.8. Correct.
      *   *Scenario $\rho = 0.4$:*
          *   $n=11$: $11 / (1 + 10*0.4) = 11 / 5 = 2.2$. User says 2.2. Correct.
          *   $n=5$: $5 / (1 + 4*0.4) = 5 / 2.6 = 1.92$. User says 1.9. Correct.
      *   *Conclusion:* The arithmetic holds up. I can proceed without correcting the numbers, but I should acknowledge their sensitivity in the "soft spots."

  3.  **Drafting the Objections (Voice & Persona):**
      *   *Judge 1 (Presiding, 25 yrs):* Pragmatic, skeptical of theory, values deliberation. "We don't vote, we talk."
      *   *Judge 2 (Empirical Legal Studies):* Wants effect sizes, data, measurable outcomes. "Where's the evidence?"
      *   *Public Defender:* Risk allocation, burden of proof, reality of contested trials (no objective 'truth'). "It's about liberty, not accuracy."
      *   *Victims' Rights Advocate:* Finality, trauma of hung juries/retrials. "Justice delayed is justice denied."
      *   *Evidence Professor:* Composite judgments, elements of crimes. "Verdicts aren't binary."
      *   *Law & Econ Professor:* Skeptical of CJT, asks about $p$ and $\rho$, why not 24? "Incentives and costs."
      *   *Legislator:* Folk wisdom, tradition vs. efficiency. "Why 12? Arbitrary."
      *   *Court Administrator:* Logistics, costs, backlog. "Can we actually seat 12?"

  4.  **Developing Replies & Soft Spots:**
      *   Need to align with the user's core argument: Accuracy is unmeasurable/unreliable due to $\rho$; focus on distribution/variance/holdouts.
      *   *Reply Strategy:* Acknowledge validity, pivot to the "variance/holdout" argument, avoid getting trapped in $p$ vs. $\rho$ debates.

  5.  **Identifying Concessions:**
      *   What must be admitted early to gain credibility?
      *   1. Cost/Backlog is real (Administrator/Judge 1).
      *   2. CJT in textbook form doesn't apply directly (Law & Econ/Judge 2).

  6.  **Identifying the "Must Land" Reply:**
      *   The core insight: Smaller juries aren't just less accurate; they are *more volatile* and less likely to protect the minority/dissent. The "holdout" argument.

  7.  **Identifying the "Forbidden Question":**
      *   Something that exposes the user's personal uncertainty or the fundamental unknowability of the epistemic claim. "Did you vote your conscience or just give up?" (Too personal). Or "If you can't measure $\rho$, why are you testifying?" (Too meta).
      *   Better: "If accuracy is unknowable, what specific metric *should* we use to decide?" (Forces a positive prescription that might be weak).
      *   Best: "You say you changed your vote due to pressure. If we go to six, doesn't that pressure increase, making your 'holdout' argument moot?" (Attacks the feasibility of the solution).
      *   Actually, the prompt asks for "The question I am hoping nobody asks." This usually implies a vulnerability in the user's position. The user admitted changing their vote and not knowing why.
      *   *Candidate:* "You testified that you changed your vote because you were worn down. If twelve couldn't protect your doubt, why do you think six will protect anyone else's?"

  8.  **Refining the Content (Iterative Process):**
      *   *Check Tone:* Ensure the objections sound like the specific people described.
      *   *Check Constraints:* No citations. Keep replies conceptual.
      *   *Check Arithmetic:* Already verified.
      *   *Check Length:* 2-minute replies (roughly 250-300 words spoken, but for a prep sheet, bullet points of the argument flow are better). I will structure them as "The Gist" and "The Pivot."

  9.  **Final Review against User's Narrative:**
      *   The user is humble ("I am not confident I survived"). The prep sheet should reflect this humility as a strength, not a weakness.
      *   The user wants to argue for *structural protections* (element verdicts, minority standing) rather than just "12 is better."
      *   Ensure the "Must Land" point connects to the structural recommendations.

  10. **Drafting the Response:** (Mental Outline)
      *   **Arithmetic Check:** Confirm validity first.
      *   **Concessions:** Cost & Textbook CJT limits.
      *   **The 8 Objections:** tailored to the 8 committee members.
