      *   **The Hidden Normative Disagreement:** This is crucial. Appiah needs moral reasons to be real causes to validate the concept of "moral progress." The Skeptic/Materialist suspects "moral progress" is a myth covering structural shifts. They disagree on what counts as a *satisfying* explanation of a *moral* event.
      *   **Reconceptualization:** Distinguish between *Trigger* (honor/status), *Condition of Possibility* (material interests), and *Retrospective Legitimation* (ideology/power). Or, adopt a "Threshold Model" where material shifts lower the cost of moral signaling, allowing honor dynamics to tip the system.
      *   **Progress:** Disciplinary division of labor + acceptance of plural explanation (causal pluralism).

