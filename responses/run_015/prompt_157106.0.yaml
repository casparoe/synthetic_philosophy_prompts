      *   **Williams-style (Skeptic/Power):** Focuses on *structural* shifts. Moral language is ideology. Change happens due to power dynamics, social position, or contingency. Moral arguments are rationalizations. Explanation looks *behind* the agents' reasons.
      *   **Material Interest (Economic):** Focuses on *incentives*. Profit curves, class interests. Honor talk is epiphenomenal gloss. Explanation looks at material conditions.

  3.  **Evaluate the Nature of the Stalemate:**
      *   *Empirical?* Yes, partly. If we could prove legislators voted *only* because of bribes vs. *only* because of shame, that would help. But human motivation is rarely pure. The evidence is always compatible with multiple stories (underdetermination).
      *   *Conceptual?* Yes. "Explanation" means different things. For Appiah, explaining a moral change means explaining why it became *unthinkable* or *shameful*. For the Materialist, it means explaining why it became *unprofitable* or *inefficient*. For the Williams-skeptic, it means exposing the *power move*.
      *   *Normative?* Yes. Appiah wants to preserve the integrity of moral agency (people changed because they saw something as wrong/shameful). The Skeptic/Materialist wants to demystify morality (people changed because the world changed around them).
