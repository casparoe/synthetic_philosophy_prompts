answer: |-
  ### Diagnosis of the Stalemate

  Your working group's impasse is not primarily an empirical deficit, but a **category error compounded by hidden normative stakes**. You are treating a clash of explanatory levels and philosophical commitments as if it were a dispute over causal weighting that finer data could resolve.

  Here is the breakdown of why the debate stalls, how to reconceptualize it, and where the genuine uncertainty lies.

  #### 1. The Empirical Mask: Why Evidence Won't Settle It
  You ask if micro-archival work could discriminate between these frames. The diagnosis is **no**, not decisively. This is because the disagreement is not about *what happened* (the historical record), but about *what counts as a cause* in the context of human agency.

  *   **The Problem of Self-Interpretation:** If a legislator's diary entry reads, "I voted for abolition because the West Indies are no longer profitable," the Materialist claims victory. But the Appiah interpreter can retort that the legislator needed a material excuse to abandon a moral stance they were already ashamed of holding. Conversely, if the diary reads, "I could no longer bear the shame of slavery," the Williams-skeptic can argue this is post-hoc rationalization for a shift in class alignment.
  *   **Underdetermination:** Human motivation is overdetermined. In a moral revolution, material incentives, status signals, and moral convictions shift simultaneously. Finding a correlation between sugar prices and votes does not prove prices *caused* the votes; it only proves they were concurrent. The "cause" is selected based on the theorist's prior commitment to what kind of explanation is satisfying (naturalistic vs. interpretive).

  #### 2. The Conceptual Disagreement: Three Different Explananda
  The sides are answering three different questions under the single heading "Why did the norm end?"

  1.  **Appiah (The Phenomenology of Constraint):** Asks, *"Why did the practice become unthinkable?"*
      *   **Focus:** The internal logic of the social world.
      *   **Criterion of Success:** Explaining the shift in *meaning* (e.g., duel-refusal = courage).
      *   **Blind Spot:** Cannot explain why the shift happened *then* and not earlier, absent a story about why the status market changed.
  2.  **Material Interest (The Structural Precondition):** Asks, *"Why did the practice become unsustainable?"*
      *   **Focus:** The external constraints on the social world.
      *   **Criterion of Success:** Explaining the shift in *incentives* (e.g., slavery = bad investment).
      *   **Blind Spot:** Cannot explain why morally abhorrent but profitable practices persist elsewhere, or why people sacrifice interest for honor.
  3.  **Williams-Skeptic (The Genealogy of Justification):** Asks, *"Why do we tell the story this way?"*
      *   **Focus:** The function of the moral narrative itself.
      *   **Criterion of Success:** Exposing the *power dynamics* masked by moral language.
      *   **Blind Spot:** Risks cynicism that cannot account for the genuine normative force agents felt.

  **Diagnosis:** The stalemate is verbal because "Explanation" implies different things. For Appiah, a causal story that ignores agents' reasons is not an explanation of *moral* change, but of *behavioral* change. For the Materialist, a story relying on "honor" is not an explanation, but a description of the phenomenon to be explained.

  #### 3. The Hidden Normative Disagreement
  There is a substantive philosophical conflict driving the empirical stalemate. It concerns **the reality of moral progress.**

  *   **Appiah's Stake:** To preserve the integrity of moral agency. If moral revolutions are driven solely by profit or power, then "moral progress" is an illusion. Appiah *needs* honor and status to be genuine normative forces, not just epiphenomena, to validate the idea that society can "learn" morally.
  *   **The Skeptic/Materialist Stake:** To maintain naturalistic consistency. If moral reasons can causally override material interests without reduction, it threatens a materialist worldview. They *need* honor-talk to be downstream of structure to maintain a unified theory of social science.

  They are not just fighting over history; they are fighting over whether morality is a causal force or a causal shadow.

  #### 4. Path Forward: Reconceptualization and Division of Labor
  To dissolve the conflict, you must move from a **Competitive Model** (one cause excludes the others) to a **Threshold Model** (causes operate at different stages).

  **Proposed Reconceptualization: The "Cost of Signaling" Framework**
  Separate the *decline of viability* from the *collapse of prestige*.
  *   **Material/Structural factors** lower the *cost* of abandoning the norm. (e.g., When slavery is profitable, opposing it is economically suicidal. When profits fall, the cost of opposition drops.)
  *   **Honor/Status factors** provide the *mechanism* of the switch. (e.g., Once the cost drops, early adopters use the new norm to signal distinction. The status market flips.)
  *   **Skeptic/Genealogical factors** explain the *retrospective solidification*. (e.g., Once the norm flips, the new story is codified to hide the contingency of the shift.)

  **Disciplinary Division of Labor:**
  *   **Historians/Economists** establish the *Condition of Possibility* (When did it become feasible to stop?).
  *   **Sociologists/Anthropologists** establish the *Trigger Mechanism* (How did the meaning flip?).
  *   **Philosophers** analyze the *Normative Status* (Does this count as progress?).

  **Specific Comparative Case:**
  To test this, do not look for "pure" cases (they don't exist). Look for **Negative Cases where one variable is missing.**
  *   *Case A:* Material incentives shift, but honor dynamics do not flip. (Result: Practice goes underground/black market, but doesn't vanish. E.g., Prohibition in the US, or dueling in the US South vs. UK).
  *   *Case B:* Honor dynamics shift, but material incentives remain strong. (Result: Normative hypocrisy. People condemn the practice publicly but continue it privately. E.g., Victorian sexual mores).
  *   *Discriminating Evidence:* If you find a case where material incentives strongly favored abolition *but* the practice persisted for decades until a specific status-inversion event (like a scandal), you weaken the Materialist claim. If you find a case where honor turned against a practice but it persisted due to high profitability (e.g., child labor in certain contexts), you weaken the Appiah claim.

  #### 5. Confidence and Uncertainty

  **Overall Confidence: High (85%)**
  I am highly confident that the stalemate is conceptual and normative rather than purely empirical. The history of social science suggests that debates between "ideational" and "materialist" explanations rarely resolve via data accumulation because the data is always theory-laden. The "Threshold Model" is a standard move in complex systems theory that usually dissolves such dualisms.

  **Point of Least Certainty: The Mechanism of Honor Inversion**
  I am least certain about the **precise mechanism by which honor costs invert** (the Appiah claim).
  *   *Why:* Appiah suggests that once enough people abstain, abstention becomes the high-status signal. But *why* does the first person abstain? If the first person abstains because of moral conviction, Appiah smuggles in rationalism. If they abstain because of a material safety net, Materialism wins the first move.
  *   *Uncertainty:* It is unclear if there is a distinct "honor dynamic" that is causally independent, or if "honor" is simply the *name* agents give to the coordination equilibrium of a new material reality. Distinguishing between "honor as a causal engine" and "honor as the transmission belt for material shifts" is the hardest empirical/philosophical knot in this literature. Resolving this requires a theory of social psychology that neither side currently possesses.

  ### Summary Recommendation
  Stop trying to prove one side right. Reframe the project: **"The Ecology of Norm Collapse."** Treat material interests as the *climate* (making certain norms viable or non-viable), honor dynamics as the *fire* (the rapid spread mechanism), and genealogical skepticism as the *ash* (what remains to be analyzed). Your output should not be a verdict, but a topology of how these factors interact in specific cases.
