answer: |-
  This is a sharp reading of both Keynes and the structural limits of his argument. Your friend is essentially invoking the economic concept of **positional goods** (formalized later by Fred Hirsch and others), and yes, this is the critical fault line in *Economic Possibilities for Our Grandchildren*.

  Here is a breakdown of whether Keynes's vision collapses under this scrutiny, what he assumed about human psychology, and how he viewed the pathology of status.

  ### 1. The Positional Goods Trap: Does the vision collapse?
  Your friend is right: if relative needs are positional, they are zero-sum. I cannot be richer than you unless you are poorer than me (relatively); I cannot be more culturally distinguished than you unless you are less distinguished.

  Keynes explicitly acknowledged this. He wrote:
  > *"For absolute needs a point may soon be reached... of which we are not yet aware. But for relative needs... the desire for superiority may be insatiable."*

  Keynes's vision **does collapse** if the drive for relative standing remains the primary engine of human behavior. If we solve the economic problem (scarcity) but keep the psychological problem (status competition), we simply move the competition from the factory floor to the leisure sphere. Instead of working 60 hours to buy a bigger boat, we work 15 hours but spend the remaining 25 hours curating a more impressive lifestyle, networking, or engaging in cultural one-upmanship.

  Keynes hoped that once absolute needs were met, the *intensity* of relative competition would dampen. He was betting on a psychological shift, not just an economic one. He assumed that the "struggle for subsistence" was what made us aggressive. Remove the struggle, and he hoped the aggression would atrophy. History suggests he was wrong: we solved subsistence (in the developed world) and became *more* competitive, not less.

  ### 2. Did he assume a collective agreement to stop caring?
  Keynes did not envision a social contract or a collective agreement. He was not a socialist in the sense of mandating behavior. He was a **moralist** who believed in a form of psychological evolution.

  He viewed the love of money and status as a **neurosis caused by insecurity**. In his view, humans are not naturally greedy; they are greedy because they are afraid of want. He wrote that the love of money as a possession is a "disgusting morbidity, one of those semi-criminal, semi-pathological propensities which one hands over with a shudder to the specialists in mental disease."

  His assumption was that once the *fear* was removed (via technological abundance), the *neurosis* would be cured. He didn't think we would agree to stop competing; he thought we would simply lose the *urge* to compete because the stakes (survival) would be gone. He failed to anticipate that status competition is not just about survival, but about hierarchy and mating and power, which exist independently of hunger.

  ### 3. Was the "Good Life" meant for an elite?
  This is the most uncomfortable part of Keynes's essay. Economically, he argued for universal liberation. Culturally, he was a thoroughgoing elitist (a member of the Bloomsbury Group).

  He writes:
  > *"But beware! The time for all this is not yet. For at least another hundred years we must pretend to ourselves and to everyone that fair is foul and foul is fair; for foul is useful and fair is not. Avarice and usury and precaution must be our gods for a little longer still."*

  Keynes recognized that the "virtues" required to build the capital for the leisure society (hard work, saving, deferred gratification) were the opposite of the virtues required to *enjoy* the leisure society (contemplation, art, relationships).

  He feared that when the 15-hour week arrived, the masses would suffer a **"nervous breakdown."** He wrote:
  > *"It will be those people, who can keep alive, and cultivate into a fuller perfection, the art of life itself and do not sell themselves for the means of life, who will be able to enjoy the abundance when it comes."*

  So, to answer your question: He hoped it would be universal, but he suspected only a certain "type" of person (people like him—intellectuals, artists, the cultivated) would actually know what to do with the freedom. He worried the rest would fall into depression or find new ways to work themselves to death out of habit. In that sense, he feared the "good life" would de facto become an elite pursuit, not because of economic exclusion, but because of **cultural incapacity**.

  ### 4. Money vs. Status: The Same Pathology?
  You asked if he sees status-seeking as the same pathology as money-worship. **Yes.**

  For Keynes, money was never the end; it was a scorecard for security and status. He distinguished between:
  1.  **Money for enjoyment:** Buying things that give genuine pleasure (food, comfort, art). He viewed this as healthy.
  2.  **Money as an end:** Hoarding or earning for the sake of the number, or to feel superior. He viewed this as the "mental illness."

  If people shift from competing for money to competing for "cultural capital" or "leisure status" (e.g., having the most free time, the most exotic travels, the most refined tastes), Keynes would classify this as the **same pathology**. It is still "purposiveness"—doing things for the sake of an external outcome rather than for the inherent value of the activity.

  Keynes's "good life" was not about *consuming* leisure; it was about **being**. He envisioned a return to a pre-industrial mindset where one works to live, rather than lives to work. If we use our free time to climb a new social ladder, we are still "living to work," even if the work is unpaid social climbing.

  ### Summary
  Your friend's critique holds water. Keynes's prediction failed not because the technology didn't arrive (productivity has skyrocketed), but because he underestimated the **insatiability of relative wants.**

  *   **Did the vision collapse?** Yes, because we turned leisure into another sector of production (the "attention economy" and "lifestyle industry").
  *   **Did he assume we'd stop caring?** He hoped the *fear* driving the caring would vanish. He was wrong; status is intrinsic, not just a byproduct of scarcity.
  *   **Elite vs. Universal?** He hoped for universal economic freedom but feared only a cultural elite would handle it wisely.
  *   **Pathology?** Money-worship and status-seeking are the same disease to Keynes: the inability to distinguish between *means* and *ends*.

  Keynes was ultimately a preacher disguised as an economist. His essay is less a forecast and more a plea: *We have the capacity to be free, but do we have the wisdom to be free?* The last 90 years suggest the answer is complicated.
