  The ice clinked in Marco's glass as he set it down hard. He wasn't smiling anymore.

  "Okay," Marco said. "Let's strip the 'grumpy monk' stuff. You're saying the best possible human experience is… what? Neutral? Like a flatline on a heart monitor?"

  "Not a flatline," I said. "A warm bath. You don't scream because the water feels amazing. You just stop shivering. I'm saying the shivering is the problem, not the lack of screaming."

  "But the scream is the joy," Marco countered. "You're defining joy as only the relief of pain. That's reductive. When I hear my favorite song, I'm not relieving a craving. I'm adding something to the universe. I'm at zero, then the music hits, and I'm at plus ten. You're saying plus ten is an illusion because I'll eventually want to hear it again."

  "I'm saying you weren't at zero before the music," I said. "You were at minus one, waiting for something to fill the silence. The music scratches the itch. But now you need the music to stay at zero. If I'm truly at ease, I don't need the song. So who's richer? The guy who needs the symphony to feel okay, or the guy who sits in silence and feels complete?"

  Marco leaned in. "This is where your logic gets weird. Are you telling me a life of bland contentment is equal to a life of intense love and art? If you could press a button and be permanently content but never feel passion, would you press it?"

  I hesitated. The beer tasted bitter. "If passion means craving, then yes. Because passion guarantees disappointment."

  "That's insane," Marco said. "You're valuing safety over depth. But here's the thing: do we actually disagree? You want absence of suffering. I want presence of joy. But if I'm truly joyful, I'm not suffering. So aren't we describing the same peak, just mapping it differently? You call it 'no pain,' I call it 'all gain.'"

  "No," I said. "Because your map requires valleys. You can't have the peak without the drop. I'm saying the valley is the cost of admission. You're willing to pay it; I'm not."

  "But what if the view is worth the hike?" Marco pressed. "Look, I'll concede this: The treadmill is real. Chasing the next high does ruin the baseline. I know people who can't sit still because they're addicted to the spike. If your view stops people from tormenting themselves for the next hit, it's useful. Maybe the baseline matters more than I admit."

  He took a sip, watching me over the rim. "But you have to concede something too. If you say pleasure is *only* relief, you have to explain why we seek out new things when we're already comfortable. I eat when I'm not hungry. I hug my wife when I'm not lonely. That's not scratching an itch. That's painting on a clean canvas."

  I sat with that. The bar noise seemed to fade. "Okay," I said slowly. "Maybe not all desire is suffering. Some might be… expansion. But I still think you're risking the baseline for the expansion. You trade stability for spikes."

  "And you trade spikes for stability," Marco said. "Maybe the good life isn't choosing one. It's knowing when the itch is real, and when you're just scratching for fun."

  I raised my glass. "I can drink to that. As long as the scratching doesn't draw blood."

  "Deal," Marco said. "But I'm still ordering the spicy wings. I like the burn."

  "Fine," I said. "Just don't complain when you need a beer to put it out."
