          She tried to formalize the mechanism. If the noise was truly random, the output should be probabilistic, yet it was deterministic relative to the input. She added hidden variables to her model. `class HiddenState: ...`. The model grew complex, effectively simulating a Turing machine with enormous overhead, yet still couldn't predict the lattice's next bit without measuring the lattice itself. She was chasing her tail. To prove it hypercomputation, she needed to show no Turing machine could do this. But to define "no Turing machine," she needed a bound on effective calculability.

