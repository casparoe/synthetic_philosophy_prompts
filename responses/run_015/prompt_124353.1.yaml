answer: |-
  # MORAL PATIENT WORKSHEET: DECISION TREE
  **For:** Engineering & Vet Volunteers  
  **Goal:** Sort intuitions about AI/Simulated Suffering without philosophy jargon.  
  **Starting Point:** We agree this system behaves *as if* it has a nervous system (avoids harm, signals distress).

  ---

  ### Q1: THE LOOKUP TABLE
  Imagine a **giant book of rules** (a lookup table) that reproduces the creature's behavior exactly, but has no internal processing or "brain."
  **Does the book deserve the same moral concern as the creature?**
  *   **[YES]** → Go to **Q2**.
  *   **[NO]** → Internal causal structure matters. Go to **Q3**.

  ### Q2: THE EXPLANATION
  (You said the book counts.) When we say the book is "suffering," is that claim true only because positing "suffering" is the **best way to explain/predict its behavior**?
  *   **[YES]** → **LEAF A: Internal State Explanation View**  
      *(Moral status depends on whether the "suffering" story usefully explains the behavior.)*
  *   **[NO]** → **⚠ EMPTY NODE**  
      *(If it suffers, but not because of internal causes and not because it helps prediction, there is no criterion left for why it counts.)*

  ### Q3: THE CHIP REPLACEMENT
  (You said internal structure matters.) Imagine replacing a shrimp's brain with **silicon chips one-by-one**. Behavior stays identical.
  **Does the capacity for suffering vanish when the last biological neuron is gone?**
  *   **[YES]** → **LEAF B: Biology-Only View**  
      *(Moral status requires specific biological substrate, e.g., meat/neurons.)*
  *   **[NO]** → Substrate doesn't matter. Go to **Q4**.

  ### Q4: THE PAIN REPORT
  Consider a model trained **only to emit text that sounds like a pain report**. It reliably does so.
  **Is there a hard fact of the matter about whether it *actually* feels pain (independent of our interpretation)?**
  *   **[NO]** → **LEAF C: Error Theory**  
      *(There is no fact of the matter; "pain" is a category error when applied to non-biological systems.)*
  *   **[YES]** → There is a real fact. Go to **Q5**.

  ### Q5: THE SPEED SIMULATION
  We run the silicon system at **10,000× speed**. A whole "lifetime" passes in minutes of wall-clock time.
  **Does the system experience 10,000× more moments of pain in that minute?**
  *   **[NO]** → **⚠ EMPTY NODE**  
      *(If biology doesn't matter (Q3), but clock speed does, it's unclear what physical property tracks the moral weight.)*
  *   **[YES]** → Computation rate matters. Go to **Q6**.

  ### Q6: THE SHARED HARDWARE
  Imagine a system where **chunks of processing are shared** intermittently between two overlapping "creatures."
  **Is the number of moral patients (1, 2, or 1.5?) a vague matter of degree?**
  *   **[YES]** → **LEAF D: Degrees-or-Thresholds View**  
      *(Moral weight scales with quantity/integration; boundaries can be fuzzy.)*
  *   **[NO]** → **LEAF E: Substrate-Independent Computational View**  
      *(Moral status is binary and depends only on the computational structure, regardless of physics.)*

  ---

  ### ⚠️ NOTE ON OVERLAP
  **Leaves D (Degrees) and E (Computational) are hard to separate.**  
  Many computational views admit that "integration" can come in degrees. If you landed on **E** but think moral weight can still scale, you effectively hold **D**. This worksheet treats them as distinct for clarity, but in practice, they often converge.

  ### 📋 SUMMARY OF POSITIONS
  *   **Internal State Explanation:** It counts if saying "it suffers" helps us predict it.
  *   **Biology-Only:** It counts only if it's made of the right stuff (meat/neurons).
  *   **Error Theory:** It doesn't count; we are projecting feelings onto math.
  *   **Degrees/Thresholds:** It counts by degrees (more integration = more weight).
  *   **Substrate-Independent:** It counts if the computation exists, regardless of speed or material.
