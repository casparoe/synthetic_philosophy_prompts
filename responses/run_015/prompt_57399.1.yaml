answer: |-
  Here is the principle that matches your verdicts, followed by the hard answers you asked for.

  ### The Principle: Assumed Agency

  You **Do** harm when you assume specific custody of a victim's outcome and fail, unless that failure is caused by physical impossibility or authorized refusal.
  You **Allow** harm when you remain within the bounds of systemic capacity, authorized protocol, or passive presence.

  This principle relies on three clauses. If a clause doesn't fix a specific case in your list, it doesn't belong.

  **Clause 1: The Directive Intervention Test**
  *   **Definition:** An act is *Doing* if you issue a directive that alters the victim's (or proxy's) independent behavior, creating reliance on your guidance.
  *   **Cases Handled:**
      *   **Case 3 (Choking/Guidance):** You told him how to move. He relied on you. He died sooner. You *Did* it.
      *   **Case 4 (Choking/Silence):** You offered presence, not direction. He acted (or didn't) on his own. You *Allowed* it.
      *   **Case 2 (Diabetic/Wrong Info):** You directed the wife's hands. You *Did* it.
      *   **Case 1 (Diabetic/Protocol):** You withheld direction per protocol. You did not assume custody. You *Allowed* it.

  **Clause 2: The Role Integrity Test**
  *   **Definition:** An act is *Doing* if you personally withdraw a safety net that you, as an individual, are currently holding up. It is *Allowing* if the net is removed by systemic decision or physical constraint.
  *   **Cases Handled:**
      *   **Case 6 (Dispatcher Hangs Up):** You personally dropped the line. You *Did* it.
      *   **Case 5 (Budget Cut):** The county dropped the line. You *Allowed* it.
      *   **Case 9 (ALS Distance):** The constraint was physical (distance/time), not agential. You sent the help you could. You *Allowed* it.

  **Clause 3: The Authority Transfer Test**
  *   **Definition:** Withholding aid is *Allowing* only if the authority to refuse aid has been explicitly transferred to you by the victim or a valid proxy. Withholding aid based on uncertainty is *Doing*.
  *   **Cases Handled:**
      *   **Case 7 (Hospice/Refusal):** Daughter (proxy) refused. Authority transferred. You *Allowed* it.
      *   **Case 8 (Nursing Home/Unconfirmed):** Administrator (proxy) unavailable. Authority *not* transferred. You assumed the risk of withholding. You *Did* it (or are culpable for it).

  ***

  ### The Baseline Question

  You asked: *What is "if I'd never been involved" supposed to mean?*

  It does **not** mean "if I never took the job." That leads to the insanity of Case 9 (the wife driving to the next county).
  It does **not** mean "if I never answered the phone." That fails Case 4 (you answered, but it's still Allowing).

  **The Correct Baseline:** "If I had not asserted **directive control** over the situation."

  *   In **Case 4**, you answered the phone, but you did not assert control over the victim's actions. You were a witness. Baseline = Natural death.
  *   In **Case 3**, you asserted control. Baseline = "What would he have done without my voice?" Since your voice changed his actions and made them fatal, you crossed the line.
  *   In **Case 9**, you asserted control (sent the rig), but the baseline includes physical reality. "If I hadn't asserted control" means "If I hadn't sent the rig." Since sending the rig didn't change the physical outcome (he bled out either way), you remain in *Allowing*. The wife driving to the next county is a counterfactual too distant; you are responsible for *your* system's response, not the hypothetical efficiency of a neighbor's system.

  ***

  ### The Sacrifice

  You asked which verdict you should give up.

  **Give up the certainty in Case 8.**

  You called it "Doing, or at least way closer to it." You are right to be unsure. Case 8 is not a *Doing/Allowing* problem; it is an *Epistemic* problem.
  *   If the DNR is real, it's Case 7 (Allowing).
  *   If the DNR is fake, it's Negligence (Doing).
  *   Because you don't *know*, you are being punished for uncertainty. Classifying this as "Doing" conflates **Bad Luck** with **Bad Action**.
  *   **Recommendation:** Reclassify Case 8 as **Negligent Allowing**. You allowed the death because you lacked the authority to stop it, but you are *culpable* for the assumption. This keeps the Doing/Allowing distinction clean (you didn't kill him, the condition did) while preserving your accountability (you should have sent the rig). If you keep it as "Doing," you blur the line between murder and mistake.

  ***

  ### Two Test Cases

  Here are two new cases to test the **Assumed Agency** principle against your intuition.

  **Test Case A: The False Reassurance**
  A caller is trapped in a burning car. You know no rig can reach them in time. You tell them, "Help is two minutes away," to keep them calm. They stay in the car rather than trying to crawl out, and they burn.
  *   **Principle Prediction:** **Doing.**
  *   **Why:** Clause 1 (Directive Intervention). You altered their behavior (staying put) based on false reliance. You assumed custody of their hope.
  *   **Your Intuition Check:** Does this feel worse than Case 4 (Silence)? It should.

  **Test Case B: The System Glitch**
  You follow protocol perfectly to dispatch a rig. The radio system fails silently; the rig never gets the message. The victim dies.
  *   **Principle Prediction:** **Allowing.**
  *   **Why:** Clause 2 (Role Integrity). You did not personally withdraw the net; the tool failed. You did not assert defective control; you asserted correct control that was physically thwarted.
  *   **Your Intuition Check:** Does this feel like Case 9 (Distance)? It should.

  ***

  ### The Final Verdict on the Distinction

  Your classmate is half-right.

  **Is "Doing vs. Allowings" a metaphysical distinction?**
  No. Physics doesn't care if you pushed the man or didn't throw him a rope; gravity kills him either way. In that sense, your classmate is right: it is a distinction without a *physical* difference.

  **Is it a distinction without a *moral* difference?**
  Yes, it is a real moral difference, but not for the reason you think. It is not about the *act*; it is about **Accountability**.

  *   **"Doing"** is a label we apply when we need someone to **explain** the death. (Case 2, 3, 6).
  *   **"Allowing"** is a label we apply when the death is **explained by the world**. (Case 1, 4, 5, 9).

  Case 7 and 8 show the crack in the foundation. In Case 7, the *family* explains the death (Hospice). In Case 8, *you* have to explain the death (Why didn't you send?).

  **Conclusion:**
  Do not throw out the distinction. It is the only thing keeping you sane. But stop thinking of it as "Killing vs. Letting Die." Think of it as **"Mine to Explain vs. The World's to Explain."**

  *   If you have to write the report explaining why the death happened *differently* than it would have without you, you **Did** it.
  *   If you write the report explaining why the death happened *despite* you, you **Allowed** it.

  Keep the principle. Fix Case 8. Kill the anxiety about Case 9. Go back to shift.
