answer: |-
  # JOINT STATEMENT ON INTERGENERATIONAL DISCOUNTING AND CLIMATE POLICY

  **Parties:** The Temporal Parity Camp (TP) and The Opportunity-Cost Camp (OC)
  **Date:** [Current Date]
  **Status:** Adversarial Collaboration Output

  ## 1. AGREED CLAIMS

  The undersigned parties affirm the following propositions as accurate descriptions of the technical, ethical, and political landscape. These claims are intended to delimit the boundary of our disagreement, not to dissolve it.

  1.  **The Parameter Leverage:** In standard integrated-assessment models, the choice of the pure rate of time preference is the single largest determinant of the optimal carbon price. Disagreement on this parameter accounts for the majority of the variance in recommended policy stringency between our camps, exceeding the variance caused by uncertainty in climate sensitivity or damage functions within central estimates.
  2.  **Market Rates vs. Social Rates:** Observed market rates of return reflect the liquidity preferences, risk aversion, and myopia of currently living agents. Both camps agree that an observed market rate is not *automatically* a prescriptive social discount rate without ethical adjustment. The disagreement lies in the magnitude and nature of the required adjustment, not in the logical gap between *is* and *ought*.
  3.  **The Non-Identity Constraint:** Climate policy alters the trajectory of economic and demographic history sufficiently to change the identities of specific individuals born in the future (the Non-Identity Problem). Therefore, policy cannot be strictly justified on a person-affecting basis (i.e., "harming specific future persons") alone, as those persons would not exist under the alternative policy. Both camps accept that justification must rest on impersonal welfare aggregates or rights of succession, not solely on comparative harm to identifiable descendants.
  4.  **Uncertainty Dominance:** While the discount rate determines the *baseline* optimal policy, uncertainty regarding the tail of the damage function (catastrophic or existential outcomes) dominates the decision calculus in extreme scenarios. Both camps agree that if the probability of civilizational collapse is sufficiently high, the discount rate becomes mathematically secondary to the survival constraint.
  5.  **The Compensation Condition:** A policy that imposes costs on the present to benefit the future satisfies the Kaldor–Hicks efficiency criterion only if the gainers *could* compensate the losers. Both camps agree that for intergenerational trades, *potential* compensation is ethically insufficient without a credible mechanism for *actual* transfer. The disagreement is whether such a mechanism is feasible or necessary.
  6.  **Political Time Horizons:** Existing democratic institutions possess no formal mechanism to represent the interests of non-constituents. Both camps agree this creates a principal-agent problem where the incentives of current officeholders are structurally misaligned with the welfare of future centuries. The disagreement is whether this structural flaw should be corrected by ethical prescription (TP) or accepted as a boundary condition on legitimate state action (OC).

  ## 2. DISAGREEMENTS TABLE

  | Domain | Neutral Claim | Temporal Parity Version (TP) | Opportunity-Cost Version (OC) |
  | :--- | :--- | :--- | :--- |
  | **Ethical Foundation** | The source of obligation to future generations. | **Impartiality:** Temporal location is morally arbitrary. We owe the same duty to a person born in 2150 as to one born in 2025, absent extinction risk. | **Contractual Mandate:** The state is an agent of current taxpayers. Obligation extends to the future only insofar as it preserves the capacity of the state to fulfill its current mandate. |
  | **Substitutability** | The relationship between natural capital and manufactured capital. | **Critical Limits:** Certain environmental functions (ice sheets, stable coastlines) are non-substitutable. No amount of financial capital can restore a lost Holocene stability. | **Broad Substitutability:** Technology and capital accumulation can substitute for most environmental losses. A richer future is better equipped to adapt to a damaged climate than a poorer future is to preserve a pristine one. |
  | **Distributional Weight** | The relative welfare of present vs. future generations. | **Comprehensive Wealth:** Future generations may be richer in GDP but poorer in comprehensive wealth (including safety, stability, and natural amenities). Transfers are not necessarily regressive. | **Consumption Capacity:** Future generations will almost certainly have higher per-capita consumption. Transferring resources from the global poor today to the global rich tomorrow is ethically regressive and inefficient. |
  | **Institutional Duty** | The proper role of the state in intergenerational trade. | **Trustee:** The state acts as a trustee for humanity across time. It has a fiduciary duty to prevent irreversible depletion of the common endowment, regardless of current voter preference. | **Agent:** The state acts as an agent for current constituents. It must prioritize identifiable suffering now over statistical benefits later, as it lacks the legitimacy to tax for non-constituents. |

  ## 3. CRUXES AND PRE-REGISTERED PREDICTIONS

  We identify the following sub-questions as the primary drivers of our divergence. For each, we specify a testable case, the evidence required, and our pre-registered predictions.

  ### A. Compensation in Kind (Non-Substitutable Losses)
  *   **The Question:** What fraction of climate damages cannot be compensated by financial capital transfers?
  *   **The Test:** A revealed-preference survey of current wealthy populations regarding "managed retreat" vs. "preservation." Specifically: What percentage of their net worth would a median resident of a vulnerable coastal city pay to guarantee the *permanent* stability of their coastline (no retreat ever required) versus accepting a managed retreat funded by an insurance payout equal to 150% of property value?
  *   **TP Prediction:** >40% of respondents will reject the financial payout at any multiple, indicating that stability is a lexical good that capital cannot substitute.
  *   **OC Prediction:** <10% of respondents will reject the financial payout at 150% value, indicating that most "losses" are monetizable and compensable via capital transfer.

  ### B. The Bequest Vehicle (Institutional Credibility)
  *   **The Question:** Does the Opportunity-Cost argument hold if a credible, ring-fenced intergenerational fund exists?
  *   **The Case:** A Sovereign Future Fund (SFF) is established today, capitalised by carbon taxes, legally barred from spending on current consumption, and mandated to grow at market rates to fund adaptation/damages in 2100+.
  *   **TP Prediction:** The SFF will fail to remain credible. Political risk (expropriation, mandate drift, inflation) will erode the real value below the rate of climate damage. Therefore, physical mitigation is required *now* regardless of the fund.
  *   **OC Prediction:** The SFF is feasible and credible (analogous to successful sovereign wealth funds). If such a fund exists, the OC argument becomes sound: we should invest in the fund rather than incur high mitigation costs, as the compounded capital will exceed the cost of adaptation.

  ### C. Sequential vs. Collective Consent
  *   **The Question:** How do we evaluate a chain of Pareto-improving trades that lead to a catastrophic outcome?
  *   **The Case:** Generation A pays a small cost to benefit Generation B. Generation B pays a small cost to benefit Generation C. ... Generation Y imposes a large cost on Generation Z. Each pairwise trade is accepted by the participants. The cumulative result is Generation Z inherits a collapsed system.
  *   **TP Prediction:** The correct test is **Collective Consent**. The chain is invalid because the final party (Z) cannot consent to the cumulative burden. Institutions should veto the sequence at the start.
  *   **OC Prediction:** The correct test is **Pairwise Consent**. If every step makes the participating parties better off, the sequence is valid. Generation Z has no claim against Generation A, only against Generation Y. Institutions should not block pairwise improvements.

  ### D. Cohorts vs. Persons (Aggregation)
  *   **The Question:** What is the unit of moral accounting?
  *   **The Case:** Policy X results in 10 billion people with a welfare score of 80. Policy Y results in 5 billion people with a welfare score of 90. (Total welfare: X=800, Y=450). However, the specific people in Y are a subset of those who would exist in X; the rest simply never come into existence.
  *   **TP Prediction:** We aggregate over **Total Welfare** (Impartial Totalism). Policy X is preferred. The non-existence of the extra 5 billion is a loss of value.
  *   **OC Prediction:** We aggregate over **Weighted Interests of Existing/Specific Lineages**. Policy Y is preferred (or neutral). We have no obligation to bring the extra 5 billion into existence solely to maximize the sum, especially if it lowers the quality of life for the specific lineage we are accountable to.
  *   **Move Condition:** TP would move if shown that Totalism implies unacceptable obligations to reproduce maximally. OC would move if shown that their view implies permission to extinguish potential high-welfare lineages for trivial gains to current ones.

  ### E. Institutional Standing (The Future Chamber)
  *   **The Question:** Is a legislative chamber representing future cohorts legitimate?
  *   **The Case:** A "Future Chamber" of 200 members, selected by sortition from the living but sworn to fiduciary duties for the 22nd century, holds a suspensive veto on projects with payoffs >100 years.
  *   **TP Prediction:** **Legitimate and Competent.** It corrects the principal-agent problem. We predict its voting record would show significantly higher mitigation support than the current legislature. We would accept its rulings as settling Crux C.
  *   **OC Prediction:** **Illegitimate and Incompetent.** Members are unaccountable to the people they govern (who cannot vote them out). It creates rule by unelected elites. We predict its voting record would be erratic or captured by current interest groups posing as futurists. We would not accept its rulings as binding.

  ### F. Fanaticism and Tails
  *   **The Question:** At what probability threshold does tail risk override discount rate concerns?
  *   **The Case:** A policy costs 5% of global GDP annually. It reduces the probability of civilizational collapse (total loss of future potential) by a specific margin.
  *   **TP Prediction:** A **5%** probability reduction justifies the cost. The expected value of the future is so large that even small probability shifts dominate current consumption. Evidence: Historical frequency of civilizational collapses in comparable complex societies.
  *   **OC Prediction:** A **0.1%** probability reduction is required to justify the cost. Spending 5% of GDP imposes certain suffering on the poor today for uncertain benefits tomorrow. Evidence: The track record of expensive preventative regulations actually averting predicted catastrophes in the last 50 years.

  ## 4. MERELY VERBAL DISPUTES

  We identify the following areas where our disagreement appears substantive but is largely driven by divergent definitions or category errors.

  1.  **Descriptive vs. Prescriptive Discounting:**
      *   *The Confusion:* OC often speaks of the discount rate as a *measure* of opportunity cost (descriptive: "what the market returns"). TP speaks of it as a *measure* of ethical obligation (prescriptive: "what we ought to value").
      *   *Resolution:* We agree that the "Social Discount Rate" is a hybrid construct. When OC says "the rate is 4%," they mean "capital earns 4%." When TP says "the rate is 0.1%," they mean "ethical depreciation is near zero." We are not disagreeing on the math of compounding, but on whether the market rate is the correct input for the social welfare function.

  2.  **Shadow Price vs. Policy Target:**
      *   *The Confusion:* TP treats the Social Cost of Carbon (SCC) as a moral shadow price that *should* drive policy regardless of feasibility. OC treats the SCC as a policy target that must be balanced against political constraints and competing budgetary demands.
      *   *Resolution:* We agree the SCC is a shadow price. The disagreement is whether the shadow price of an unpriced externality should override the budget constraint of a political entity. TP says yes (the constraint is illegitimate); OC says no (the constraint is the definition of the entity).

  3.  **GDP vs. Comprehensive Wealth:**
      *   *The Confusion:* OC argues the future will be "richer." TP argues the future may be "poorer."
      *   *Resolution:* OC defines "richer" as higher per-capita consumption of marketed goods and services. TP defines "poorer" as lower comprehensive wealth including natural capital, stability, and option value.
      *   *Resolution:* We agree that if "richer" means GDP only, the future is likely richer. If "richer" includes climate stability as a consumption good, the future may be poorer. The dispute is not about growth forecasts, but about whether climate stability is a normal good (substitutable) or a prerequisite good (non-substitutable).

  4.  **Risk Aversion vs. Time Preference:**
      *   *The Confusion:* OC attributes TP's low discounting to a lack of risk aversion. TP attributes OC's high discounting to ethical myopia.
      *   *Resolution:* We agree that a portion of the market interest rate is a premium for risk, not pure time preference. TP argues this risk premium should not apply to public goods that reduce systemic risk. OC argues that public investment carries its own implementation risk that must be discounted. The dispute is about the *correlation* of climate risk with market risk, not the existence of risk premiums.

  ***

  **Signed,**

  _________________________
  *Representative, Temporal Parity Camp*

  _________________________
  *Representative, Opportunity-Cost Camp*
