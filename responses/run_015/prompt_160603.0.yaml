  # Activity: The Better-Than Loop

  **Course:** Upper-Level Value Theory
  **Time:** 80 Minutes
  **Students:** 16 (8 Pairs)
  **Preparation:** None (Naive Intuition)
  **Goal:** Construct a cycle in *better-than* ($A \succ B \succ \dots \succ A$) to challenge Transitivity.

  ---

  ## 1. The Materials

  ### A. The Index Cards (20 Cards)
  Print these on cardstock. Each card describes a life profile scored on three goods: **Pleasure (P)**, **Achievement (A)**, and **Friendship (F)**. Scale is 0–100.

  *Design Note:* The chain is divided into three phases. Phase 1 trades Achievement for Pleasure. Phase 2 trades Friendship for Achievement. Phase 3 trades Pleasure for Friendship. The final link (20→1) restores the starting balance, appearing as a local improvement.

  | Card | Pleasure (P) | Achievement (A) | Friendship (F) | Phase |
  | :--- | :---: | :---: | :---: | :--- |
  | **01** | **50** | **50** | **50** | **Start** |
  | 02 | 53 | 48 | 50 | 1 (Gain P, Lose A) |
  | 03 | 56 | 46 | 50 | 1 |
  | 04 | 59 | 44 | 50 | 1 |
  | 05 | 62 | 42 | 50 | 1 |
  | 06 | 65 | 40 | 50 | 1 |
  | 07 | 65 | 43 | 48 | 2 (Gain A, Lose F) |
  | 08 | 65 | 46 | 46 | 2 |
  | 09 | 65 | 49 | 44 | 2 |
  | 10 | 65 | 52 | 42 | 2 |
  | **11** | **65** | **55** | **40** | **Midpoint** |
  | 12 | 62 | 55 | 42 | 3 (Gain F, Lose P) |
  | 13 | 59 | 55 | 44 | 3 |
  | 14 | 56 | 55 | 46 | 3 |
  | 15 | 53 | 55 | 48 | 3 |
  | 16 | 50 | 55 | 50 | 3 |
  | 17 | 50 | 52 | 52 | 3 (Shift to Wrap) |
  | 18 | 50 | 49 | 54 | 3 |
  | 19 | 50 | 46 | 56 | 3 |
  | 20 | 48 | 50 | 50 | 3 (Setup for Wrap) |
  | **→1** | **50** | **50** | **50** | **Wrap** |

  *Note on the Wrap (20→1):* Card 20 is (48, 50, 50). Card 1 is (50, 50, 50). The trade is +2 Pleasure, 0 Loss. This is designed to be voted as **Card 1 is Better**.

  ### B. The Ballot Sheets (8 Sheets)
  Each pair receives one sheet. Do not give them the cards; *you* hold the cards up or place them on their desk, then collect them immediately. The ballot records only their verdict.

  **BALLOT FOR PAIR #___**
  *Rule: You must choose one. No "Equal" allowed. Judge only the pair in front of you.*

  | Comparison | Which Life is Better? (Circle One) |
  | :--- | :--- |
  | **Link A** | Card Left / Card Right |
  | **Link B** | Card Left / Card Right |
  | **Link C** | Card Left / Card Right |

  *(Pairs 1–4 get 3 links; Pairs 5–8 get 2 links. Total 20 links.)*

  ### C. Assignment Key (Instructor Only)
  To prevent students from spotting the drift, distribute non-contiguous links.
  *   **Chain 1 (Cards 1–10):** Pairs 1, 2, 3, 4.
  *   **Chain 2 (Cards 11–20 + Wrap):** Pairs 5, 6, 7, 8.

  | Pair | Links Assigned (Card N vs N+1) | Notes |
  | :--- | :--- | :--- |
  | **1** | 1 vs 2, 4 vs 5, 7 vs 8 | |
  | **2** | 2 vs 3, 5 vs 6, 8 vs 9 | |
  | **3** | 3 vs 4, 6 vs 7, 9 vs 10 | |
  | **4** | 10 vs 11 | **The Bridge** (Critical Link) |
  | **5** | 11 vs 12, 14 vs 15, 17 vs 18 | |
  | **6** | 12 vs 13, 15 vs 16, 18 vs 19 | |
  | **7** | 13 vs 14, 16 vs 17, 19 vs 20 | |
  | **8** | 20 vs 1 | **The Wrap** (Critical Link) |

  ---

  ## 2. Minute-by-Minute Timeline (80 Minutes)

  ### 00:00 – 00:10: Setup & Rules
  *   **Seating:** Arrange 8 tables for pairs.
  *   **Instructions:** "You are evaluating life profiles. Three goods: Pleasure, Achievement, Friendship. Scores 0–100."
  *   **The Rule:** "You will see two cards. You **must** choose which is better. No ties. Do not write down the numbers. Do not talk to other pairs. Do not try to guess the whole sequence. Judge *only* the pair in front of you."
  *   **Meta-Gaming Prevention:** "If you think you see a trick, ignore it. Answer according to your immediate intuition about which life is better."

  ### 00:10 – 00:35: The Voting (25 mins)
  *   Distribute Ballots.
  *   Go to Pair 1. Show Cards 1 & 2. Wait for vote. Record on board (T-chart: Left vs Right). Collect cards.
  *   Show Cards 4 & 5. Vote. Collect.
  *   Show Cards 7 & 8. Vote. Collect.
  *   Move to Pair 2, etc.
  *   **Pacing:** Spend about 3 minutes per pair.
  *   **Handling Ties:** If a pair insists on a tie: "In value theory, if we cannot say they are equal, we must act. Pick the one you would *slightly* prefer to live." (Force the choice to generate the paradox).
  *   **Handling Lexical Objections:** If a student says "Friendship is priceless, you can't trade it," reply: "For this model, assume all goods are commensurable. We are testing the structure of betterness, not your personal axiology."

  ### 00:35 – 00:50: Assembly & Reveal (15 mins)
  *   Draw a large circle on the whiteboard with 20 slots.
  *   Invite students to come up and tape their ballot results into the slots.
  *   **The Reveal:** Once the circle is complete, read the chain aloud.
      *   "Pair 1 said 2 > 1."
      *   "Pair 2 said 3 > 2."
      *   ...
      *   "Pair 8 said 1 > 20."
  *   **The Climax:** "By transitivity, if 2>1, 3>2... then 20>1. But Pair 8 voted 1>20. We have collectively endorsed that Card 1 is better than itself."

  ### 00:50 – 01:15: Debrief & Theory Mapping (25 mins)
  *   **Diagnose the Contradiction:** Write on board: $1 \succ 2 \succ \dots \succ 20 \succ 1$.
  *   **Option 1: Deny a Link.** "Was one vote wrong?"
      *   Ask Pair 8 (20 vs 1): "Looking at the whole chain, do you still think 1 is better?" (Usually yes, because +2 Pleasure looks good locally).
      *   Ask Pair 4 (10 vs 11): "The Bridge." This is often where the trade shifts.
  *   **Option 2: Deny Transitivity.** "Is betterness intransitive?"
      *   Discuss implications: If $A \succ B$ and $B \succ C$ doesn't mean $A \succ C$, how do we choose?
  *   **Option 3: Deny Trichotomy (Parity/Incomparability).**
      *   "Perhaps 1 and 2 are not 'better/worse' but 'on a par'."
      *   "If they are on a par, our forced-choice rule created the cycle artificially."
  *   **Self-Torturer Distinction:**
      *   "In the Self-Torturer puzzle, each step is *permissible*. Here, you judged each step as *better*."
      *   "Permissibility cycles are annoying. Betterness cycles are catastrophic for rational choice (Money Pump argument)."

  ### 01:15 – 01:20: Closing Note (5 mins)
  *   **The Gap:** "This activity stages a cycle in *better-than*. It does not prove parity exists. It shows that if we insist on forced choices between items that might be on a par, we generate contradictions."
  *   **The Cost:** "If betterness is cyclic, rational choice is impossible. You could be pumped for money forever (trade 1 for 2, pay $1; 2 for 3, pay $1... 20 for 1, pay $1; repeat)."
  *   **Final Word:** "Either there is a cutoff we cannot see (vagueness), or transitivity fails (intransitivity), or some items are incomparable/paritous and should not be forced into 'better-than'."

  ---

  ## 3. Facilitator Troubleshooting Guide

  ### Scenario A: A Pair Insists on Ties
  *   **Student:** "These are equal. I won't choose."
  *   **Response:** "Value theory often requires action under indeterminacy. If you had to prescribe one life to a friend, which would you pick? Mark that one."
  *   **Why:** The paradox requires a complete chain. A break in the chain (a tie) dissolves the contradiction. You need the cycle to close.

  ### Scenario B: A Student Proposes a Lexical Ordering
  *   **Student:** "Friendship is infinitely valuable. Any loss of Friendship is worse."
  *   **Response:** "That is a valid substantive view (lexicality). But this seminar is about the *structure* of value. If we accept lexicality, transitivity holds, but we lose the ability to make trade-offs. For this exercise, assume trade-offs are possible."
  *   **Why:** Lexicality short-circuits the spectrum argument. You must bracket it to run the pump.

  ### Scenario C: The Vote on 20 vs 1 Goes "20 is Better"
  *   **Risk:** If Pair 8 votes 20 > 1, the cycle is $1 \succ \dots \succ 20 \succ 1$. Wait, if they vote 20 > 1, the chain is consistent ($1 \succ 20$ is false). The paradox vanishes.
  *   **Mitigation:** The numbers (48 P vs 50 P) are rigged to favor 1. If they still vote 20, ask them *why*.
  *   **Save:** "Interesting. You saw the global context? Or did the high Friendship on 20 sway you? If 20 > 1, we don't have a cycle, we have a consistent ordering. But look at the trade: +2 Pleasure for 0 loss. Why wasn't that an improvement?"
  *   **Philosophical Pivot:** Use this to discuss *context*. "Did the value of Pleasure change because you had less of it earlier? That suggests *context-dependent value*, which also threatens standard transitivity."

  ### Scenario D: Students Spot the Loop Early
  *   **Sign:** Pair 3 asks, "Where is this going?"
  *   **Response:** "Stay in your lane. Judge the pair. If you guess the end, you ruin the data."
  *   **Prevention:** This is why links are non-contiguous (1-2, 4-5, 7-8). They cannot see the drift direction easily.

  ---

  ## 4. Debrief Script: Mapping the Activity to Theory

  **1. The Impeccable Links**
  "Look at Link 1 (1 vs 2). +3 Pleasure, -2 Achievement. Most said Better. Look at Link 20 (20 vs 1). +2 Pleasure, 0 Loss. Most said Better. Each link is defensible."

  **2. The Contradiction**
  "But together they say $1 \succ 1$. This is logically impossible under standard logic."

  **3. The Three Exits**
  *   **Exit 1 (Vagueness):** "There is a cutoff where 'Better' stops. We just can't locate it. (Sorites Paradox)."
  *   **Exit 2 (Intransitivity):** "Betterness is not transitive. $A \succ B, B \succ C \nRightarrow A \succ C$. (Temkin/Rachels)."
  *   **Exit 3 (Parity):** "Some items are 'on a par'. They are comparable but not via 'better-than'. Forcing a choice creates a fake cycle. (Chang)."

  **4. Why This Isn't the Self-Torturer**
  "The Self-Torturer (Quinn) involves a cycle of *permissibility*. It is permissible to stay at 1, permissible to move to 2... but disastrous to end at 1000. Here, you said 2 is *better* than 1. This is stronger. If 2 is better than 1, rationality *demands* you move. If the cycle holds, rationality demands you spin forever."

  **5. The Honest Caveat**
  "This activity cannot distinguish between Parity and Incomparability.
  *   **Incomparability:** No relation exists.
  *   **Parity:** A fourth relation exists ('on a par').
  If Parity is true, our 'No Ties' rule was illegitimate. If Incomparability is true, Transitivity doesn't apply to these pairs.
  But if Betterness *is* cyclic, choice is broken. You become a money pump. You would pay to go 1→2, 2→3... 20→1, and repeat until you are bankrupt. Most philosophers reject cyclic betterness to save rational choice."

  ---

  ## 5. Instructor Prep Checklist
  *   [ ] Print 20 Index Cards (large font).
  *   [ ] Print 8 Ballot Sheets.
  *   [ ] Tape/Blu-tack for whiteboard.
  *   [ ] Whiteboard marker (draw the 20-slot circle beforehand).
  *   [ ] Timer (keep voting moving).
  *   [ ] **Crucial:** Memorize the "Wrap" numbers (Card 20: 48,50,50 vs Card 1: 50,50,50) to defend the vote if challenged.
