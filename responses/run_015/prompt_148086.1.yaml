answer: |-
  ### 1. Order of Components and Dependencies

  Do not introduce the labels "Endurantism" and "Perdurantism" until minute 25. Labels encourage students to treat views as team jerseys rather than solutions to a problem.

  1.  **The Phenomenon of Change (Minutes 0–10)**
      *   *Content:* Establish that ordinary objects have incompatible properties at different times (e.g., straight then bent).
      *   *Dependency:* This must be established first because without the intuition that change is real and common, the logical puzzle feels academic.
      *   *Risk if skipped:* Students will treat the puzzle as a trick of language rather than a conflict between logic and experience.

  2.  **The Principle of Indiscernibility of Identicals (PII) (Minutes 10–15)**
      *   *Content:* One thing cannot have contradictory properties. If $x$ is $F$ and $x$ is not-$F$, we have a contradiction.
      *   *Dependency:* You cannot generate the *Problem of Temporary Intrinsics* without PII.
      *   *Risk if skipped:* Students will simply say, "Things change, so they have different properties," missing the logical tension that forces a metaphysical solution.

  3.  **The "Wholly Present" Intuition (Minutes 15–25)**
      *   *Content:* Elicit the pre-theoretic view that the *whole* object exists at $t_1$ and the *whole* object exists at $t_2$.
      *   *Dependency:* This must be articulated before introducing temporal parts. It establishes the default position that Perdurantism will challenge.
      *   *Risk if skipped:* Perdurantism will look like the default view, and students won't understand what is being sacrificed (the intuition of numerical identity over time).

  4.  **The Relational Solution (Endurantism proper) (Minutes 25–35)**
      *   *Content:* Properties are not monadic but relational (bent-*at-t*). The object remains identical; the properties are indexed.
      *   *Dependency:* This must come before Temporal Parts. It shows that Endurantism *can* solve the logic.
      *   *Risk if skipped:* Students will think Perdurantism is the *only* way to solve the contradiction, rather than one of two competing solutions.

  5.  **The Cost of Relationalism (Minutes 35–45)**
      *   *Content:* Press the intuition that "bent-at-t" isn't real shape. Real shape is monadic. If properties are just relations to times, does the object *really* change?
      *   *Dependency:* You need this dissatisfaction to motivate Temporal Parts.
      *   *Risk if skipped:* Perdurantism looks like an unnecessary complication. Why posit parts if relations work?

  6.  **The Temporal Parts Solution (Perdurantism) (Minutes 45–60)**
      *   *Content:* The subject changes. Part-$1$ is bent. Part-$2$ is straight. No contradiction.
      *   *Dependency:* Requires the failure of the Relational Solution to feel like a genuine alternative rather than a synonym.
      *   *Risk if skipped:* (N/A, this is the climax). But if introduced before Step 5, it solves a problem students don't feel yet.

  7.  **Ontological Comparison (Minutes 60–65)**
      *   *Content:* Count the entities. One thing with complex properties vs. Many things with simple properties.
      *   *Dependency:* Requires both solutions to be on the board.
      *   *Risk if skipped:* The debate looks verbal (see Misconception 2).

  ### 2. The Carrying Example

  **The Object:** **A Metal Wire.**
  **The Scenario:** The wire is straight at $t_1$ and bent at $t_2$. No matter is added or removed.

  **Criteria for a Carrying Example:**
  *   **Must Have:** Spatial extension (to allow the spatial/temporal analogy later), qualitative change in a monadic property (shape), and intuitive unity (it is clearly one object).
  *   **Must Lack:** Functional criteria for identity, biological complexity, or part replacement.

  **Evaluation of Candidates:**
  *   **Ship of Theseus:** **Reject.** It focuses on *composition* (replacement of parts) rather than *qualitative change* of the whole. It distracts students into debating how much matter can be replaced before identity is lost, which is a different puzzle.
  *   **Cat that loses a limb:** **Reject.** Biological persistence introduces vagueness ("is it still the same cat?") and emotional distraction. It also conflates loss of parts with change of properties.
  *   **Game of Chess:** **Reject.** It is an abstract object or event. Students will get stuck on whether games exist in space at all, derailing the discussion of spatial vs. temporal extension.
  *   **Human Being:** **Reject.** Too much psychological baggage (memory, personality). Students will conflate *personal* identity with *object* identity.
  *   **Metal Wire:** **Keep.** It is inert, clearly spatial, and the change (bending) is undeniable and purely qualitative.

  ### 3. Misconceptions and Terminology

  **Misconception 1: "The object is spread out in time like a road is in space."**
  *   **When to head off:** Minute 50 (during the introduction of Temporal Parts).
  *   **Intervention:** Explicitly state: "A road is all there at once. A perduring object is *not* all there at once. The parts exist at different times." If you don't correct this, they will think Perdurantism implies the object is static and unchanging, which defeats the purpose.

  **Misconception 2: "The dispute is merely verbal."**
  *   **When to head off:** Minute 65 (during Ontological Comparison).
  *   **Intervention:** Force a counting question. "How many things are in the room?" If Endurantism is true, there is 1 wire. If Perdurantism is true, there are many wire-stages and one sum. If they count differently, it is not merely verbal.

  **Banning "Four-Dimensional" and "Block Universe":**
  *   **Verdict:** **Yes, ban them.**
  *   **Reason:** "Four-dimensional" suggests time is a spatial dimension, reinforcing Misconception 1. "Block Universe" commits you to the B-Theory of Time (eternalism), which is distinct from Perdurantism (one can be a presentist perdurantist, though rare). Mixing them confuses the *nature of time* with the *nature of objects*.
  *   **Replacement:** Use **"Temporally Extended"** (for perdurance) and **"Wholly Present"** (for endurance).
  *   **Handling the Read-Ahead Student:** If a student reaches for "Block Universe," say: *"That is a claim about the structure of time. We are currently asking about the structure of objects. Please park that distinction for now."* This validates their knowledge without letting it hijack the specific ontological debate.

  ### 4. The Closing Check

  **Select:** **"If only the last ten seconds of a person's life had ever existed, would that person have existed at all?"**

  **Why this discriminates:**
  *   **Endurantist Answer:** **Yes.** The person is wholly present at each moment. If the world contained only those ten seconds, the person would be wholly present during them. Existence is not cumulative.
  *   **Perdurantist Answer:** **No (or 'Only a part of them').** The person *is* the sum of temporal parts from birth to death. If the earlier parts never existed, the sum (the person) does not exist. Only a temporal *slice* exists.
  *   **Discrimination:** This forces students to decide whether the object *is* the duration (Perdurance) or *occupies* the duration (Endurance).

  **Why the others fail:**
  *   **"A relay team wins a race..."** This tests *collective* identity or conventional role assignment, not the metaphysical persistence of a single substance. Both views can agree the "team" is a construct.
  *   **"Could there be a world in which everything... exists for exactly one instant, and... things nevertheless change?"** Both views will likely answer **No**. Change requires temporal extension for both Endurantists (different times for different properties) and Perdurantists (different parts for different properties). It fails to distinguish *how* they persist, only *that* they need time.

  ### 5. The Refusal

  **What to decline:** The metaphysics of Time itself (Presentism vs. Eternalism / A-Theory vs. B-Theory).
  **The Sentence:** *"We are asking what objects are, not what time is."*

  ### 6. Stage Theory (Exdurantism)

  **Decision:** **Leave it out entirely.**

  **Reason:** In a seventy-minute session with students who have never encountered temporal parts, introducing Stage Theory (the view that persisting objects are instantaneous stages related by counterpart relations) creates a tripartite debate that obscures the core tension.
  1.  **Cognitive Load:** Students must first grasp that objects *can* have temporal parts (Worm Theory) before they can grasp that objects *might only be* temporal parts (Stage Theory).
  2.  **Collapse Risk:** As you noted, without a robust grasp of counterpart theory, Stage Theory looks like Perdurantism with different labeling.
  3.  **Dilution:** The primary pedagogical goal is to feel the pull of the Problem of Temporary Intrinsics. Stage Theory solves this easily (the stage is only bent, never straight), but it introduces new problems (what makes me related to that future stage?) that you do not have time to unpack. Stick to the binary: Wholly Present vs. Temporally Extended.
