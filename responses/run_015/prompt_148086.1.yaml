          *   Perdurantism: The object *is* the temporal extension. No extension, no object (or just a part).
          *   Endurantism: The object is present at each moment.
          *   *Decision:* Q1 is the best. Q2 is about teams. Q3 is about the possibility of change in a static world (which both might deny).
          *   *Wait, let's look closer at Q1.* If a perdurantist says "The person is the sum of all temporal parts", and only 10 seconds exist, does the sum exist? Yes, the sum of those parts.
          *   Let's look for a question that forces a difference in *counting* or *location*.
          *   Actually, I need to choose from the *provided* three.
          *   Q2 is definitely out (Relay team is a collective).
          *   Q3 is about the definition of change, not persistence.
          *   Q1 targets the *nature of existence over time*.
          *   *Refinement:* Q1 is the best of a slightly imperfect bunch. It forces them to decide if the "person" is the *duration* or the *occupant* of the duration.
          *   *Wait, I need to be careful.* If I choose Q1, I need to justify why the others fail.
          *   Q2 fails because it's about group identity/continuity of role, not metaphysical persistence of a substance.
          *   Q3 fails because both views likely agree change requires temporal extension. It doesn't distinguish *how* they persist, only *that* they need time.
          *   Q1 distinguishes whether the entity *is* the time-span (Perdurance) or *in* the time-span (Endurance).

  7.  **Drafting Section 5: What to Decline:**
      *   Don't explain *why* one view is true. Or don't explain the connection to Special Relativity.
      *   Better: Don't explain *which view solves the Problem of Temporary Intrinsics better*. No, that's the point of the tutorial.
