          *   *Let's analyze Q3 again.* "Everything... exists for exactly one instant... things nevertheless change?"
          *   This targets the definition of change. Change requires $t_1$ and $t_2$. If everything exists for one instant, there is no $t_1$ and $t_2$ for the *same* object.
