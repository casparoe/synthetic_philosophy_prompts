  2.  **Deconstruct the Philosophical Problem:**
      *   The core tension is the Problem of Change (Leibniz's Law).
      *   $x$ is $F$ at $t_1$. $x$ is not-$F$ at $t_2$.
      *   If $x$ at $t_1$ is identical to $x$ at $t_2$, how can it have incompatible properties?
      *   Endurantism: $x$ is wholly present at both times. Properties are time-indexed (relational) or present-tensed.
      *   Perdurantism: $x$ has temporal parts. $x$-at-$t_1$ is a part of $x$, not identical to $x$. No contradiction.
      *   Stage Theory: $x$ is just the instant. Persistence is a relation between distinct entities.

  3.  **Drafting Section 1: Order and Dependencies:**
      *   *Step 1: The Phenomenon of Change.* Need to establish that things change properties. Without this, there's no puzzle.
      *   *Step 2: The Principle of Indiscernibility of Identicals (PII/LL).* Need to establish that one thing can't have contradictory properties. Without this, change isn't a logical problem.
      *   *Step 3: The Conflict.* Put 1 and 2 together. $O$ is bent. $O$ is straight. $O=O$. Contradiction.
      *   *Step 4: The Endurantist Solution (Relationalism).* Modify the properties. Bent-at-$t_1$, Straight-at-$t_2$.
      *   *Step 5: The Cost of Endurantism.* Does this capture real change? Or just relations to times?
      *   *Step 6: The Perdurantist Solution (Temporal Parts).* Modify the subject. Part-at-$t_1$ is bent. Part-at-$t_2$ is straight.
      *   *Dependency:* You can't introduce temporal parts until they feel the pain of the contradiction. You can't appreciate the temporal parts solution until they see the relationalist move as potentially unsatisfying (or at least distinct).
      *   *Risk:* If you introduce temporal parts too early, they treat it as a definition rather than a solution to a logical crisis.

  4.  **Drafting Section 2: The Carrying Example:**
