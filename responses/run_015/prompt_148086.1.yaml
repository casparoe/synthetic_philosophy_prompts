      *   *Q1 (Last 10 seconds):* Tests whether existence requires temporal extension. Perdurantists might say "yes (a temporal part existed)", Endurantists "yes (wholly present at that instant)". Actually, this tests *temporal parts* vs *endurance*. If only one instant exists, can something endure? Endurantism usually requires existence at multiple times. Perdurantism says the object *is* the sum of parts. If only one part exists, does the sum exist? This is tricky.
      *   *Q2 (Relay Team):* Tests collective identity vs individual. Irrelevant to IoT.
      *   *Q3 (Instant World):* "Could there be a world in which everything that exists exists for exactly one instant, and in which things nevertheless change?"
          *   If change requires persistence, and persistence requires time...
          *   Endurantist: To change, I must be here *and* there. If only one instant exists, no change.
          *   Perdurantist: An object is a spacetime worm. If the world is one instant, the worm is sliced.
