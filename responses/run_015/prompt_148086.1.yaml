          *   Chess Game: Reject. Abstract object/event. Students get hung up on whether games "exist" in space.
          *   Human Being: Reject. Too much psychological baggage (Locke, memory, personhood).
          *   *Selection:* A bending wire or a changing traffic light. Let's go with a **metal wire that bends**. It's simple, spatial, and clearly the "same stuff" undergoing a shape change.
