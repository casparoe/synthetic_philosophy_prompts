  # The Liar Paradox Commitment Tree

  ## Introduction
  This instrument maps your logical commitments regarding truth and self-reference. It does not ask you to identify with specific schools of thought. Instead, it presents four concrete semantic scenarios. At each node, select the verdict that best matches your intuition about the logical status of the sentences described. Follow the path indicated by your choices to locate your theoretical position.

  ---

  ## Part I: The Decision Tree

  ### Node 1: The Direct Liar
  **Scenario:** Consider sentence $L$: *"This sentence is false."*
  Assume standard classical logic rules for negation and truth (i.e., if $L$ is true, it is false; if $L$ is false, it is true).

  **Question:** What is the semantic status of $L$?
  *   **(A)** $L$ is both true and false simultaneously. The contradiction is real and acceptable.
      *   $\rightarrow$ **Go to Leaf 3 (Paraconsistent View)**
  *   **(B)** $L$ fails to express a genuine proposition. It looks like a statement but is a linguistic malfunction or category mistake.
      *   $\rightarrow$ **Go to Leaf 4 (Deflationary/Expressivist View)**
  *   **(C)** $L$ has a determinate truth value (True or False), but we must restrict the rules of truth to prevent the contradiction from arising within a single language.
      *   $\rightarrow$ **Go to Node 2**
  *   **(D)** $L$ lacks a classical truth value (it is neither true nor false) OR its truth value is unstable/shifting.
      *   $\rightarrow$ **Go to Node 3**

  ### Node 2: The Hierarchical Instinct
  **Scenario:** You believe $L$ has a value but requires restriction. Consider two sentences, $A$ (in Language 1) and $B$ (in Language 2). $A$ says "$B$ is false." $B$ says "$A$ is false."
  **Question:** Can Language 1 and Language 2 be the *same* language?
  *   **(A)** No. To avoid contradiction, truth predicates must belong to distinct, hierarchically ordered languages. $A$ and $B$ cannot be in the same system.
      *   $\rightarrow$ **Go to Node 2.1 (Inter-Level Diagnostic)**
  *   **(B)** Yes, they can be the same language, provided the *context* in which they are evaluated shifts between $A$ and $B$.
      *   $\rightarrow$ **Go to Leaf 6 (Contextualist View)**

  ### Node 2.1: Inter-Level Preservation (Niche Diagnostic)
  **Scenario:** You require distinct levels. Suppose we construct a Meta-Language ($M$) to evaluate the Object-Language ($O$).
  **Question:** Can $M$ stably assign a truth value to the Liar sentence in $O$ without generating a new "Revenge Liar" in $M$?
  *   **(A)** Yes, but *only* on the condition that $M$ is structurally barred from containing its own self-referential apparatus. If $M$ allows self-reference, the paradox returns.
      *   $\rightarrow$ **Leaf 1 (Strict Hierarchical Separation)**
  *   **(B)** No. Even if $M$ is barred, the very act of characterizing $O$'s liar generates a new paradox in $M$. Hierarchy alone is insufficient.
      *   $\rightarrow$ **Re-evaluate:** This commitment is inconsistent with a pure Hierarchical View. Your intuition suggests either **Leaf 4 (Deflationary)** (truth cannot be characterized this way) or **Leaf 3 (Paraconsistent)** (contradictions are inevitable).

  ### Node 3: The Strengthened Liar
  **Scenario:** You believe $L$ is "Neither" or "Unstable." Consider the *Strengthened Liar* $S$: *"This sentence is not true."*
  If you previously assigned $L$ the value "Neither," then $S$ ("is not true") appears to be **True**.
  **Question:** Does assigning "True" to $S$ recreate the paradox?
  *   **(A)** No. We can accept that $S$ is True while maintaining that $L$ (and $S$ itself) remains "ungrounded" or without a classical value in the base language. The "gap" is stable.
      *   $\rightarrow$ **Go to Leaf 2 (Fixed-Point/Partial-Grounding View)**
  *   **(B)** Yes. Assigning "True" to $S$ forces us to re-evaluate $S$ as "Not True," which makes it "True" again. The value oscillates or depends on when/how we ask.
      *   $\rightarrow$ **Go to Node 4**

  ### Node 4: The Nature of Instability
  **Scenario:** You accept that the value of the Liar oscillates or shifts (e.g., False $\rightarrow$ True $\rightarrow$ False...).
  **Question:** What does this oscillation represent?
  *   **(A)** It represents the actual semantic content of the truth predicate. Truth is inherently circular, and the oscillation *is* the meaning. We model this via infinite revision sequences.
      *   $\rightarrow$ **Leaf 5 (Revision-Theoretic View)**
  *   **(B)** It represents a shift in the context of assessment. The sentence isn't inherently oscillating; rather, each evaluation creates a new context where the previous evaluation is objectified.
      *   $\rightarrow$ **Leaf 6 (Contextualist View)**

  ---

  ## Part II: Scoring Key & Theoretical Leaves

  | Leaf | Theoretical Family | Path Signature | Core Commitment |
  | :--- | :--- | :--- | :--- |
  | **1** | **Strict Hierarchical Separation** | 1(C) $\rightarrow$ 2(A) $\rightarrow$ 2.1(A) | Truth predicates must be stratified; meta-languages can value object-languages only if structurally barred from self-reference. |
  | **2** | **Fixed-Point / Partial-Grounding** | 1(D) $\rightarrow$ 3(A) | Some sentences are "ungrounded" and permanently lack a truth value; this gap is stable and does not generate revenge if handled via fixed-point mathematics. |
  | **3** | **Paraconsistent (Dialetheic)** | 1(A) | True contradictions exist. The Liar is both true and false; classical logic (specifically Explosion or Non-Contradiction) must be revised. |
  | **4** | **Deflationary / Expressivist** | 1(B) | The Liar is not a semantic paradox but a pragmatic failure. The truth predicate is merely a logical device for disquotation, not a substantive property. |
  | **5** | **Revision-Theoretic** | 1(D) $\rightarrow$ 3(B) $\rightarrow$ 4(A) | Truth is a circular concept. The Liar has no stable extension, but its behavior is governed by deterministic revision rules over time/stages. |
  | **6** | **Contextualist / Dynamic Gap** | 1(C) $\rightarrow$ 2(B) **OR** 1(D) $\rightarrow$ 3(B) $\rightarrow$ 4(B) | The Liar's truth value is context-sensitive. It may be false in one context and true in another (or ungrounded then grounded) as the context shifts. |

  ---

  ## Part III: Diagnostic Notes on Logical Space

  ### 1. Analysis of Unoccupied Combinations
  The following combinations of commitments are absent from the tree's leaves. Their emptiness is diagnosed below:

  *   **Strict Hierarchy + True Contradictions (Leaf 1 + Leaf 3):**
      *   *Diagnosis:* **Incoherence.** The Strict Hierarchical view solves the paradox by preventing the contradiction from arising within a single level (by banning self-reference). The Paraconsistent view solves it by accepting the contradiction within a single level. One cannot simultaneously ban the contradiction structurally and accept it semantically.
  *   **Deflationary + Revision-Theoretic (Leaf 4 + Leaf 5):**
      *   *Diagnosis:* **Conceptual Instability.** Deflationism treats truth as a lightweight logical device (disquotation), implying the Liar is a misuse of that device (meaningless). Revision theory treats truth as a robust, circular property with complex dynamics. One cannot claim the sentence is a "malfunction" (Deflationary) while simultaneously modeling its "shifting value" (Revision).
  *   **Fixed-Point + Strict Hierarchy (Leaf 2 + Leaf 1):**
      *   *Diagnosis:* **Redundancy / Historical Neglect.** Fixed-point theories (like Kripke's) allow a language to contain its own truth predicate by accepting truth-value gaps. Strict Hierarchy bans the predicate from containing itself. While one *could* theoretically combine them (a hierarchy of partial languages), it is functionally redundant: if you accept truth-value gaps, you do not need to ban self-reference to avoid contradiction.

  ### 2. Indistinguishable Leaf Pairs
  The following pairs share significant commitments and may not be cleanly separated by this tree without further metaphysical questioning:

  *   **Leaf 5 (Revision) vs. Leaf 6 (Contextualist):**
      *   *Shared Commitment:* Both deny that the Liar has a single, static, context-independent truth value. Both accept that the sentence can be evaluated as True at one "stage" and False at another.
      *   *Source of Overlap:* The tree distinguishes them by asking if the shift is due to *iteration* (Revision) or *context* (Contextualism). However, in practice, a revision sequence can be modeled as a sequence of contexts. A respondent who views "time" as a "context" may find these leaves indistinguishable.
  *   **Leaf 2 (Fixed-Point) vs. Leaf 6 (Contextualist):**
      *   *Shared Commitment:* Both often utilize "truth-value gaps" (Neither True nor False).
      *   *Source of Overlap:* The distinction rests on the *Strengthened Liar*. The Fixed-Point view claims the gap is permanent (static). The Contextualist claims the gap can be "filled" or evaluated from a new context. However, some Fixed-Point theorists argue that moving to a "meta-language" to evaluate the gap is just a formal way of describing a context shift. Without asking about the *metaphysical nature* of the context, these views can converge on the same verdicts.

  ### 3. Note on the Inter-Level Preservation Branch
  The **Node 2.1** diagnostic is designed to filter "Tarskian" Hierarchists from those who merely use hierarchy as a heuristic.
  *   If you answered **2.1(A)**, you hold that the paradox is a result of *structural illegitimacy*. You believe a consistent language *can* talk about truth, provided it is structurally barred from self-reference.
  *   If you answered **2.1(B)**, you hold that the paradox is *inevitable* for any language capable of expressing arithmetic and truth. This usually pushes respondents away from Hierarchy (Leaf 1) toward Paraconsistency (Leaf 3) or Deflationism (Leaf 4), as it suggests hierarchy cannot fully contain the revenge problem.
