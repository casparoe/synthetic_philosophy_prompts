answer: |-
  You have stumbled directly into the core problem of **Reflective Consistency** in formal systems and AI alignment. You are circling two specific named results, depending on whether you view your bot as a logical prover or a computational process.

  1.  **Löb's Theorem** (The Logical Limit)
  2.  **The Halting Problem / Infinite Regress** (The Computational Limit)

  You aren't building the self-model "wrong" in a bug sense; you are running into a fundamental constraint on any system that tries to be both **sound** (only believes true things) and **self-trusting** (believes its own reasoning is sound).

  Here is the breakdown of the wall you hit, the names of the results, and the standard workarounds used in agent foundations research.

  ---

  ### 1. The Logical Wall: Löb's Theorem
  You mentioned: *"It can't treat that as ground truth, because that would mean trusting its own reasoning is sound, and it can't verify that about itself."*

  This is exactly **Löb's Theorem**. In provability logic, Löb's Theorem states that for a sufficiently powerful formal system (like Peano Arithmetic), if the system can prove `"If I can prove P, then P is true"`, then the system can prove `P`.

  Symbolically: $\square(\square P \to P) \vdash P$

  **The Trap:**
  You want your bot to reason: *"If I predict X, then I will do X (because I follow my prediction). Therefore, X is true."*
  But for the bot to use that implication, it must prove that its own predictions are reliable (sound). Löb's Theorem says a consistent system **cannot prove its own soundness**. If it assumes "My predictions are always true" as an axiom, it becomes inconsistent (it can prove anything, including contradictions).

  So, when the bot tries to derive $X$ from the premise "I predict $X$", it requires a level of self-trust it is logically forbidden from having. It creates a gap where the proof cannot close unless $X$ is already trivially provable without the self-reference.

  ### 2. The Computational Wall: Infinite Regress
  You mentioned: *"To predict, it unrolls its own decision logic."*

  If your bot literally simulates itself to determine its output, you are hitting the **Halting Problem**.
  *   Bot asks: "What will I do?"
  *   Bot runs simulation of Bot.
  *   Simulation asks: "What will I do?"
  *   Simulation runs simulation of Bot...
  *   **Stack Overflow.**

  Even if you try to be clever (e.g., "I'll simulate myself for $N$ steps"), you introduce a horizon problem. The copy knows it's a simulation with a limit, so it might behave differently than the real bot, breaking the prediction accuracy.

  ---

  ### The Standard Workarounds

  In the "rationalist" / AI safety community (MIRI, LessWrong, agent foundations), this is the central problem of **Tiling Agents** and **Self-Modification**. Here are the three standard ways to solve it:

  #### A. Search for a Fixed Point (Don't Derive, Solve)
  Stop trying to *derive* the move linearly from the prediction. Instead, treat the decision process as an equation to be solved.
  You are looking for a move $M$ such that:
  $$ \text{DecisionLogic}(\text{Predict}(M)) = M $$

  Instead of running the logic to see what comes out, you iterate through possible moves $M \in \{A, B, ...\}$ and check which one is a **fixed point**.
  *   **Hypothesis:** "I predict A."
  *   **Check:** "If I predict A, does my logic output A?"
  *   **Result:** If yes, output A.

  This bypasses the infinite regress because you aren't simulating the *search*, you are verifying the *consistency* of a specific candidate. This is essentially using a **Y-Combinator** approach to self-reference (Quining).

  #### B. Reflective Oracles (Probabilistic Self-Trust)
  This is the more advanced "standard workaround" you are likely looking for. Developed by researchers like Scott Garrabrant and Benja Fallenstein.

  A **Reflective Oracle** is a probabilistic device that answers queries about the behavior of machines that have access to the oracle itself. It doesn't say "I prove X." It says "The probability that I output X is $p$."

  Crucially, a Reflective Oracle is allowed to return a random probability (e.g., 50/50) in cases where a deterministic answer would create a paradox (like the Halting Problem or Löbian deadlock).
  *   **The Fix:** Allow your bot to output a probability distribution over moves.
  *   **The Logic:** "I assign 50% probability to playing A and 50% to playing B."
  *   **The Action:** Sample from that distribution.
  *   **The Consistency:** The oracle is "reflective" because the probabilities it outputs match the actual frequencies of the machine's behavior.

  This dissolves the Löbian wall by moving from **binary truth** (which hits Gödel/Löb) to **calibrated probability** (which can be consistent via Kakutani's Fixed Point Theorem).

  #### C. Logical Induction
  If your bot needs to learn this over time (since it's a repeated game), look into **Logical Induction** (Garrabrant et al., 2016).
  A logical inductor assigns probabilities to logical statements (like "I will play X") before they are proven. Over time, it learns to trust its own predictions *empirically* without needing to prove its own soundness *axiomatically*. It learns "I have been right 99% of the time in the past, so I will trust my prediction now," which is an inductive heuristic rather than a deductive proof, sidestepping Gödel.

  ### Summary Recommendation for Your Toy Project

  1.  **If you want a deterministic solution:** Implement a **Fixed-Point Search**. Do not run your decision logic to generate the move. Instead, iterate through all possible moves, feed them into your prediction logic as "assumed facts," and see which one results in consistency.
      *   *Pseudocode:* `for move in moves: if simulate_self(prediction=move) == move: return move`

  2.  **If you want to model the "Rationalist" theory:** Implement a **Reflective Oracle**. Allow your bot to output a probability. If it detects a Löbian paradox (it can't decide), it defaults to a mixed strategy (e.g., 50/50). This is mathematically guaranteed to find a consistent equilibrium where a deterministic prover will fail.

  3.  **The Name You Were Looking For:**
      *   Logical limit: **Löb's Theorem**.
      *   Computational limit: **Halting Problem** / **Recursion**.
      *   The Solution Framework: **Reflective Oracles** or **Fixed-Point Combinators**.

  You are effectively trying to build a **Newcomblike Agent**. The "wall" is the feature, not the bug. To pass it, you must stop trying to *prove* you are consistent and start *constructing* a consistent fixed point.
