answer: |-
  Dear Colleagues,

  I am writing to request a semester of course relief and travel support to complete a project on the logic of historical counterfactuals, using the specific case of Adolf Hitler as the test environment. This is not a project aimed at settling the historical debate over whether Nazi Germany was inevitable without him. Rather, it is an attempt to settle the prior philosophical question of what one must mean for the question to have an answer at all. When historians argue over whether Hitler was the hinge of the century or merely the symptom of deeper structural fractures, they often assume they are disagreeing about facts when they are actually disagreeing about the structure of the counterfactual antecedent. If by without Hitler we mean he was never born, we are altering the genetic and familial history of late nineteenth-century Austria. If we mean he was killed in the trenches, we are altering the psychological trajectory of the veteran community. If we mean he remained in Vienna as a painter, we are altering the cultural milieu of pre-war Munich. These are not the same world, and yet the historiography often treats them as a single binary variable. My goal is to produce a paper that provides an account of when a counterfactual about an individual's causal role is well-posed and what fixes the contrast class, arguing that the disagreement between structuralists and Great Man theorists shrinks significantly once we pry apart necessity, membership in a sufficient set, and difference-making.

  The proposal commits to addressing the obvious objection that history is chaotic in the technical sense, meaning tiny changes to the antecedent swamp everything downstream, rendering any counterfactual in this genre unstable. I intend to argue that this objection proves too much, as it would make ordinary causal explanation in history impossible, a conclusion nobody actually accepts in practice. The work will involve showing why we hold certain structural conditions fixed while varying others, and what licenses that selection. I suspect that once we clarify these modal categories, the remaining disagreement is not about facts but about what we wanted an explanation for in the first place. To do this rigorously, I need the time to engage with the German-language historiography directly. I read German slowly, and a proper grasp of the nuances in the Weimar-era sources and the subsequent German philosophical reception requires a semester of focused attention that my current teaching load does not permit. I have also secured the agreement of a colleague in the history department to co-host a workshop on the project, ensuring that the philosophical analysis remains grounded in actual historical practice.

  During the first month of the semester, I will focus primarily on reading and translation. I plan to work through key German texts regarding the contingency of the Nazi rise to power, taking the time to parse the specific modal claims embedded in the historiography rather than relying on English summaries. This slow reading is essential because the philosophical weight often rests on specific terminological choices that get flattened in translation. In the second month, I will draft the core argument of the paper, focusing on the distinction between the chaos objection and the stability required for causal attribution. I will share these drafts with my history colleague to ensure that the examples I am using are not straw men of the structuralist position. This collaboration is vital because I want to avoid the common philosophical error of imposing a logical framework that historians find useless. The third month will be dedicated to organizing and holding the workshop. I intend to keep the room mixed, inviting both philosophers and historians, and I am conscious that I do not want the historians feeling lectured at by a philosopher telling them how to do causality. The workshop will be structured as a collaborative troubleshooting session where we apply the proposed criteria to specific cases from the historiography to see if they yield stable results.

  There are two or three ways this project could come out, and the considerations deciding between them will be explicit in the final paper. It may turn out that the distinction between necessary conditions and difference-makers is robust enough to dissolve the tension between structural and agential explanations, suggesting the disagreement was merely verbal. Alternatively, it may reveal that the disagreement is substantive but located in our explanatory interests rather than the facts themselves, meaning both sides are right relative to different questions. A third possibility is that the chaos objection holds more water than I anticipate, forcing a retreat to a more modest claim about local rather than global counterfactuals. The deciding consideration will be whether the proposed criteria allow us to make sense of ordinary historical explanation without collapsing into skepticism. If the criteria work for smaller causal claims but fail for the Hitler case, that itself is a significant result regarding the limits of historical knowledge.

  I want to be honest about what would count as the project failing, which I would rather say up front than discover in June. The project would fail if the distinction I am drawing between different contrast classes turns out to be philosophically coherent but historically inert. If the framework I develop is too abstract to help historians adjudicate between competing claims about Weimar politics, or if it requires such precise specification of the antecedent that no actual historical evidence could ever satisfy it, then I will have produced a logical toy rather than a tool for understanding. Another failure condition would be if the workshop reveals that the disagreement between structuralists and agential theorists is not about modal categories at all but about political or moral commitments that no amount of conceptual clarification can resolve. If it turns out that the insistence on Hitler's uniqueness is driven by a need for moral containment rather than causal analysis, my philosophical framework will not fix that, and I need to acknowledge that limitation in the final paper. I believe these risks are manageable, but they are real, and the semester of relief would allow me to navigate them carefully rather than rushing to a premature conclusion.
