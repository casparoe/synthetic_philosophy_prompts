      *   *Decision Theory Perspective:* Step (9) claims ordering is metaphysical. But in the Pasadena game, the tosses are sequential. The expectation should be calculated as the limit of partial sums $S_N$ as $N \to \infty$. If that limit doesn't exist, the expectation is undefined. But does that mean *no preference*?
      *   *Dominance:* Is there a dominance argument? Not really, because payoffs oscillate.
