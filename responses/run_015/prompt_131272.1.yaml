  APPENDIX 7-C: PERSONNEL CAUSALITY AND AGENCY ATTRIBUTION PROTOCOLS

  **1.0 General Causal Sufficiency**
  Pursuant to University Bylaw 4.1, all personnel outcomes (hiring, merit augmentation, tenure) shall be traced to sufficient physical antecedents. The Committee notes that while mental attributions (e.g., "intent," "creativity," "judgment") accompany physical event sequences, they constitute secondary descriptions rather than efficient causes. Accordingly, all personnel files must prioritize the Physical History Form (PHF-9) over the Mental Attribution Surcharge (MAS-2). In cases where both forms are submitted for a single outcome, a Redundancy Deduction of fifteen percent (15%) shall apply to the candidate's total score to prevent systematic overdetermination of credit. Faculty members are advised that describing a publication as "insightful" does not add causal weight to the physical act of printing.

  **2.0 Merit Review and Hiring**
  Candidates for merit increases must isolate the physical components of their scholarly output. For published works, the candidate shall list the specific motor movements involved in keystroke deposition and the chemical composition of the ink or digital storage states. Descriptions of the work's "argumentative force" or "conceptual novelty" shall be entered in Section B of the PHF-9 as Courtesy Notations only. The Committee shall not evaluate Courtesy Notations as causal factors in salary determination. If a candidate claims their "belief in the thesis" caused the publication, they must file a Deviation Request proving said belief exerted force independent of neuronal firing. No such request has been approved since 2019. Hiring committees shall similarly evaluate candidates based on the physical trajectory of their CVs rather than the "promise" of future research, as promise is a modal property lacking mass.

  **3.0 Letters of Recommendation**
  Recognizing that a letter writer's mental state (e.g., "esteem," "confidence") does not causally interact with the ink on the page, letters of recommendation are not accepted as evidence of candidate quality. Instead, letters serve as verification of the writer's physical capacity to transmit data. Writers must append Form L-9 (Physical Transmission Verification), certifying that their vocal cords or finger flexions were not coerced by external physical forces. The Committee notes that while the *content* of the letter describes the candidate, the *causal weight* rests entirely on the writer's motor control. Therefore, a letter praising a candidate's "brilliance" carries the same administrative weight as a letter praising their "adequacy," provided the Physical Transmission Verification is identical. To resolve this evidentiary gap, the Department requires a separate Notary Seal confirming the writer's brain states were roughly correlated with the text, though this correlation is acknowledged to be non-causal. The writer must sign a statement affirming that their mental state matched the text, notwithstanding the lack of causal mechanism linking the two.

  **4.0 Academic Integrity and Intent**
  In cases of alleged misconduct, establishing intent requires evidence of a mental cause. Since intentions leave no causal trace on available evidence, the accused shall complete Box 12B on the Integrity Violation Form. Box 12B reads: "I certify that my motor movements were accompanied by an intention." A signature line follows. The Committee accepts the signature as a physical event sufficient to close the file. If the accused refuses to sign, the Committee shall assume the physical event sequence was determined by prior physical causes exonerating the agent, provided the agent also files a Petition for Deterministic Exoneration. Petitions requiring the agent to explain *why* they filed the petition are rejected as circular. The space provided for explaining intent is limited to fifty characters, reflecting the minimal causal footprint of mental states.

  **5.0 Committee Deliberation and Verdict**
  The Personnel Committee shall convene on the 14th of each month to deliberate. Members acknowledge that their verdicts are fully determined by prior physical states antecedent to the meeting. However, to maintain institutional continuity, members shall engage in speech acts during the meeting. These speech acts are recorded in the minutes as acoustic byproducts, not as justifications. The final vote is binding not because reasons were exchanged, but because the voting mechanism constitutes a sufficient physical trigger for the Dean's office. Members must not claim their deliberation *changed* the outcome, as this violates the Closure Protocol. Instead, members shall state that the deliberation was the physical locus where the outcome became administratively visible. Any member claiming their reason-giving caused the vote must submit a Causal Override Form, which requires them to identify the specific neuron responsible for the causation. The minutes shall record reasons as "contributing atmospheric conditions" to avoid implying agency.

  **6.0 Dissenting Procedure: Dual-Counting Option**
  A minority of faculty members reserve the right to treat mental and physical descriptions as distinct, co-sufficient causes. These members may file Form DC-1 (Dual Causality Claim), awarding points for both the Physical History and the Mental Attribution. However, pursuant to Section 1.0, the total score for any candidate cannot exceed 1.0 on the normalized scale. If a member awards 0.6 for Physical History and 0.6 for Mental Attribution, the system shall automatically reduce the Mental Attribution score to 0.4 to maintain the cap. The member must then sign a statement acknowledging that the Mental Attribution was not, in fact, a distinct cause, but merely a re-description of the Physical History already counted. Failure to sign this statement results in the rejection of the Dual Causality Claim. The Committee notes that no Dual Causality Claim has ever resulted in a net increase of points for any candidate.

  **7.0 Implementation**
  These protocols are effective immediately. All faculty members shall align their causal explanations with the PHF-9. Questions regarding the causal efficacy of these protocols themselves should be directed to the Department Chair, whose response will be physically delivered via email. The Chair's intention to reply is not guaranteed, but the physical transmission of a reply shall be sufficient for administrative closure.
