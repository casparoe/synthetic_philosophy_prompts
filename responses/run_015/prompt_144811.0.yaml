answer: |-
  Your intuitions reveal a compelling and increasingly popular framework in political philosophy known as the all-subjected principle, modified by a threshold of social integration. The coherent principle that best captures your verdicts is that membership in the demos belongs to those who are routinely subject to the coercive power of the state and share in the long-term social fate of the community, regardless of their formal legal status. This explains why the thirty-year resident belongs despite lacking citizenship, as they are fully embedded in the coercive and social fabric, while the expatriate citizen is excluded despite their legal status, because they have removed themselves from the daily coercion and shared consequences of domestic policy. The distinction between the cross-border worker and the tourist further refines this by suggesting that affectedness must be substantial and enduring to grant even a consultative voice, ruling out transient inconvenience while acknowledging deep economic entanglement.

  Applying this principle to your uncertain case resolves the tension by favoring the stateless refugee over the birthright citizen living abroad. The birthright citizen who was adopted abroad and has never lived here is functionally identical to your expatriate case; they hold a legal title but lack subjection to coercive laws and share no social fate with the community. Conversely, the stateless refugee living within the borders for a decade is subject to the state's security apparatus, border controls, and legal order, even if administered indirectly through a camp. Their presence and contribution to the informal economy indicate a shared fate and routine subjection that outweighs the empty formalism of the absentee citizen's birthright. Therefore, coherence demands you include the refugee in the demos, perhaps with a path to full voting rights similar to the permanent resident, while excluding the absentee citizen.

  However, maintaining this principle in its simplest form requires you to abandon or reclassify your intuition regarding future generations. The principle of subjection and shared social fate relies on the existence of agents who are currently bound by the law and interact within a social framework. Non-existent people cannot be subject to coercion, nor can they share a social fate in the present sense. Your desire to represent them is morally commendable but belongs to a different category of ethical stewardship rather than democratic membership. To keep the principle simple and focused on political agency, you should view trustees for future generations as a constraint on the demos rather than members of it. Additionally, you might need to simplify the graded membership of the cross-border worker; a strict binary principle would either grant them full voting rights based on significant affectedness or deny them membership entirely, whereas your intuition grants a specific consultative voice which complicates a simple rule of inclusion.

  Regarding the person who spends half the year in your country working remotely for foreign employers with no social ties, the principle predicts they should not have full voting rights in national elections. While they are physically present for a significant duration and subject to laws during that time, the lack of social ties and the fact that their livelihood depends on a foreign economy means they do not share the long-term social fate of the community. They resemble a long-term tourist more than the integrated permanent resident. They might qualify for the same consultative voice as the cross-border worker regarding specific local services they use, but they fall short of the threshold for full membership in the demos because their life outcomes are not fundamentally tied to the collective decisions of the polity in the way a resident raising a family is.
