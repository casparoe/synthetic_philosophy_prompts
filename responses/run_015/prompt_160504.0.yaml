  # The Money Pump Sorting Instrument

  ### Part 1: The Logical Space (Branch Questions)

  Answer the following questions in order. Stop at the first leaf you reach. Do not look at the position names in Part 2 until you have traced your path.

  **Branch 1: The Harm Test (The Forgiving Pump)**
  *Case:* A friend runs the cyclic swap sequence on you but quietly returns all the money at the end. You finish with exactly what you started with.
  *Question:* **Is there still a rational error in your choices, even though you lost nothing?**
  *   **Yes:** Structure matters more than outcome. (Go to Branch 2).
  *   **No:** Harm or vulnerability matters more than structure. (Go to Branch 6).

  **Branch 2: The Identity Test (The Self-Pump)**
  *Case:* You are not exploited by a bookie, but by your own future self, who trades away what your current self values.
  *Question:* **Is this conflict a failure of rationality, or just a change in who you are?**
  *   **Failure:** Your future self is still *you*. (Go to Branch 3).
  *   **Change:** Your future self is effectively a stranger. (Go to Branch 4).

  **Branch 3: The Obligation Test (Binding)**
  *Case:* You know in advance you will cycle.
  *Question:* **Are you *required* to bind your future self to a plan, or merely *permitted* to?**
  *   **Permitted:** Planning is optional. (Leaf A).
  *   **Required:** Planning is mandatory. (Go to Branch 5).

  **Branch 4: The Consistency Test (Local)**
  *Case:* Your future self is a stranger, but you are making choices *right now*.
  *Question:* **Do you require your preferences to be consistent (e.g., if A>B and B>C, then A>C) at this single moment in time?**
  *   **Yes:** Consistency matters now. (Leaf B).
  *   **No:** No consistency demands even now. (Leaf C).

  **Branch 5: The Strategy Test (Resolute vs. Sophisticated)**
  *Case:* You are required to plan. The moment arrives to execute the plan, but breaking it looks better *now*.
  *Question:* **Do you stick to the original plan, or revise it to accommodate what your future self will do?**
  *   **Stick:** Enforce the plan regardless. (Leaf D).
  *   **Revise:** Treat your future self as a player in the situation. (Leaf E).

  **Branch 6: The Scope Test (Opinions)**
  *Case:* We move from desires (what you want) to opinions (what you believe/probability).
  *Question:* **Does a similar "pump" argument apply to changing your beliefs in a cycle?**
  *   **Yes:** Rationality covers beliefs and desires. (Go to Branch 7).
  *   **No:** Rationality covers desires only. (Go to Branch 8).

  **Branch 7: The Foresight Test (The Blind Pump)**
  *Case:* You lose money in a cycle you could not foresee (Blind) versus one you could (Ordinary).
  *Question:* **Does your lack of knowledge make the loss rational?**
  *   **Yes:** Ignorance excuses the cycle. (Leaf F).
  *   **No:** Vulnerability is enough for error. (Leaf G).

  **Branch 8: The Symmetry Test (The Fountain)**
  *Case:* With cyclic preferences, someone could pay you to move round your cycle in the direction you dislike, making you *richer*.
  *Question:* **Does this chance to gain cancel the chance to lose?**
  *   **Yes:** Net neutral; no lesson learned. (Leaf G).
  *   **No:** Vulnerability remains. (Leaf F).

  *(Note: Branches 7 and 8 both lead to Leaves F and G, but via different logical routes. See Diagnostics below.)*

  ---

  ### Part 2: The Positions (Leaves)

  **Leaf A: Planning Permitted But Not Required**
  *Path:* Harm=Yes → Identity=You → Obligation=Permitted.
  *   **Plain Name:** The Optional Planner.
  *   **Awkward Commitment:** You admit planning avoids loss but deny you are irrational for refusing to plan.
  *   *(Standard Label: Weak Planning)*

  **Leaf B: Judging Each Swap on Its Own Plus Consistency at a Time**
  *Path:* Harm=Yes → Identity=Stranger → Consistency=Yes.
  *   **Plain Name:** The Local Consistency Checker.
  *   **Awkward Commitment:** You can be rational at every second but guarantee a loss over a minute.
  *   *(Standard Label: Myopic Consistency)*

  **Leaf C: Rationality Entirely Local to a Time Slice**
  *Path:* Harm=Yes → Identity=Stranger → Consistency=No.
  *   **Plain Name:** The Time-Slice Localist.
  *   **Awkward Commitment:** You make no demands on yourself across time, not even logical consistency right now.
  *   *(Standard Label: Radical Time-Slice)*

  **Leaf D: Judging Whole Sequences and Sticking to Plan**
  *Path:* Harm=Yes → Identity=You → Obligation=Required → Strategy=Stick.
  *   **Plain Name:** The Resolute Chooser.
  *   **Awkward Commitment:** You must ignore what looks best in the moment to honor a past decision.
  *   *(Standard Label: Resoluteness)*

  **Leaf E: Judging Whole Sequences and Revising Plan**
  *Path:* Harm=Yes → Identity=You → Obligation=Required → Strategy=Revise.
  *   **Plain Name:** The Sophisticated Planner.
  *   **Awkward Commitment:** You plan around your own expected irrationality rather than fixing it.
  *   *(Standard Label: Sophistication)*

  **Leaf F: Lesson is About Foresight, Self-Knowledge, or Exploitability**
  *Path:* Harm=No → Scope=Yes → Foresight=Yes **OR** Harm=No → Scope=No → Symmetry=No.
  *   **Plain Name:** The Pragmatic Vulnerability View.
  *   **Awkward Commitment:** Rationality depends on whether others know your weaknesses, not just your internal state.
  *   *(Standard Label: Pragmatic Rationality)*

  **Leaf G: Pump Arguments Show Nothing About Rationality**
  *Path:* Harm=No → Scope=Yes → Foresight=No **OR** Harm=No → Scope=No → Symmetry=Yes.
  *   **Plain Name:** The Pump Skeptic.
  *   **Awkward Commitment:** You accept cyclic preferences even if they guarantee loss in a world with bookies.
  *   *(Standard Label: Skepticism)*

  ---

  ### Part 3: Diagnostics and Tie-Breakers

  **Unoccupied or Ruled-Out Combinations**
  *   **Harm=Yes + Symmetry=Yes:** *Incoherent.* If actual harm determines rationality (Harm=Yes), potential gain cannot cancel it (Symmetry=Yes).
  *   **Identity=Stranger + Obligation=Required:** *Unattractive.* You cannot be required to bind a "stranger" (your future self).
  *   **Scope=Yes + Symmetry=Yes:** *Merely unexplored.* Most who apply pumps to beliefs (Scope=Yes) think inconsistency is structural, not cancelable by gains.

  **Indistinguishable Leaves**
  The tree cannot fully separate **Leaf A (Optional Planner)** and **Leaf E (Sophisticated Planner)**. Both treat planning as a strategic response to a situation rather than a binding moral requirement, and both acknowledge future selves as distinct agents.
  *   **Tie-Breaker 1:** If you could bind your future self at zero cost, would you? (A: Maybe not; E: Yes).
  *   **Tie-Breaker 2:** Is the "requirement" to plan internal (rationality) or external (prudence)? (A: External; E: Internal).
  *   **Tie-Breaker 3:** Does failing to plan make you *exploitable* or just *unlucky*? (A: Unlucky; E: Exploitable).

  **The Fountain Observation**
  The Fountain (Branch 8) does not track a distinct position from the Skeptic (Leaf G). It functions as a tie-breaker for the Pragmatic cluster: if you believe gains cancel losses, you are a Skeptic; if not, you are a Pragmatist. It is not a standalone view.

  ---

  ### Part 4: How to Use This Handout

  1.  **Silent Tracing:** Each member reads the *Case Descriptions* and *Branch Questions* only. Do not read the *Position Names* in Part 2. Trace your path privately and note your Leaf Letter (A–G).
  2.  **Reveal:** Reveal only your Leaf Letter. Group members with the same letter should compare *why* they arrived there (which branch answers differed).
  3.  **Debate:** Discuss the "Awkward Commitment" for your leaf. Do you accept it? If not, re-evaluate your Branch answers.
  4.  **Cross-Examination:** Members with different leaves should ask the Tie-Breaker questions to see if the disagreement is fundamental or semantic.

  **Limitations of This Instrument**
  This tree sorts views on *structure* and *agency*, but it cannot settle the metaphysical status of the "self" over time (Branch 2). If two members disagree on whether their future self is "them" or a "stranger," no amount of logical sorting will resolve that; it is a pre-rational intuition. Additionally, the tree assumes the "Harm Test" (Branch 1) is the primary divider. If your group disagrees on whether *vulnerability* counts as harm, the tree will force you into the Structural cluster even if you are Pragmatists at heart. Use the Tie-Breakers to expose this.
