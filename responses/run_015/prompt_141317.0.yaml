      *   *Okay, this saves massive time.*
      *   *Revised Timeline:*
          *   0-10: Intro/Handout.
          *   10-20: Analyze Data (1-6), Make Forecast for 7.
          *   20-30: Reveal 7, Score, Discuss.
          *   30-35: Invention Card.
