  2.  **Deconstruct Popper's *Poverty of Historicism*:**
      *   Core argument 1: Human history is influenced by the growth of human knowledge.
      *   Core argument 2: We cannot predict future scientific knowledge (by definition).
      *   Core argument 3: Therefore, we cannot predict the future course of human history.
      *   Core argument 4: The "Oedipus Effect" (predictions influence the predicted event).
      *   Core argument 5: Holistic/Utopian engineering fails; Piecemeal engineering works better.
      *   Core argument 6: Historicism (belief in inevitable historical laws) is methodologically flawed.

  3.  **Design the Game Mechanics:**
      *   *Variables:* Need to be intuitive.
          *   Variable A (Self-Fulfilling): "Market Confidence" or "Bank Run." Let's use **Grain Price**. If everyone predicts high, they hoard, price goes high.
          *   Variable B (Self-Defeating): "Migration/Crowding." If everyone predicts high migration, authorities block routes or people stay away. Let's use **Migration Flow**.
          *   Variable C (Fixed Point/Equilibrium): "Council Support." If predicted too high, complacency sets in; too low, mobilization. It seeks a stable value (say, 50%). Let's use **Council Approval**.
      *   *The "Invention":* Needs to break the trend. A "New Irrigation Tech" or "Plague." Let's go with **New Irrigation Tech** (affects Grain Price structurally).
      *   *Forecasting:* Paper slips. Two types: "Trend" (Unconditional) and "Policy" (Conditional).
      *   *Scoring:* Needs to penalize confidence in long-range unconditional predictions after the shock, while rewarding conditional/piecemeal accuracy. Brier Score is too complex for pen/paper. Absolute Error is better.
      *   *Computation:* The instructor needs a simple formula to calculate Round 7 based on the *average* forecast of the class.
          *   Price = Base + (Avg Forecast - Base). (Self-fulfilling)
          *   Migration = Base - (Avg Forecast - Base). (Self-defeating)
          *   Approval = 0.5 * Previous + 0.5 * Avg Forecast. (Convergence)

  4.  **Develop the Scoring Rule:**
      *   *Goal:* Show that fitting the past (Rounds 1-6) doesn't guarantee future success (Round 7+), especially after the shock.
      *   *Mechanism:* "Confidence Weighted Accuracy."
      *   *Why:* If students just guess numbers, they learn nothing. If they bet "points" on their certainty, they feel the pain of being wrong.
      *   *Twist:* Conditional forecasts get a "discount" on penalty because they acknowledge complexity. Unconditional long-range forecasts get multiplied penalties.
      *   *Refinement:* Keep it simple for 75 mins.
          *   Score = 100 - |Actual - Predicted|.
          *   Bonus for Conditional forecasts that trigger.
          *   Multiplier for Round 7 vs Round 10.
      *   *Decision:* Let's use a "Reputation Token" system. They start with 10 tokens. They wager on predictions.
          *   Actually, simpler: Just calculate accuracy. The *debrief* reveals the scores.
          *   Better: The prompt asks for a payoff scheme. Let's use "Academic Credibility Points" (ACP).
          *   Scoring Rule Choice: **Mean Absolute Error (MAE) with a 'Hubris Penalty'.**
          *   *Why:* It mathematically demonstrates that high confidence in unconditional long-term predictions yields lower scores than humble, conditional, short-term predictions.

  5.  **Drafting the Timeline (75 mins):**
      *   0-10: Setup & Rules.
      *   10-25: Rounds 1-3 (Pattern recognition).
      *   25-40: Rounds 4-6 (Model building).
      *   40-45: The "Invention" Card.
      *   45-60: Rounds 7-8 (Post-shock forecasting).
      *   60-75: Scoring & Debrief.

  6.  **Addressing the "Fixed Point" Paradox:**
      *   Student objection: "But the Fixed Point *is* a law."
      *   Popper response: It's a law of the *game*, not the *world*. In the real world, the fixed point moves because the rules change (reflexivity).
      *   Need to be honest: The game *has* laws. Real history might not. The game simulates the *failure* of historicism, not the ontology of history.

  7.  **Predicting Failure Modes:**
      *   *Risk 1:* Students think it's random. (Mitigation: Ensure the math is visible in debrief).
      *   *Risk 2:* Students think they just need better models. (Mitigation: The Invention Card must be truly exogenous to the variables).
      *   *Risk 3:* Computation lag. (Mitigation: Pre-calculate spreadsheets, instructor only).

  8.  **Refining the Feedback Rules (The "Engine"):**
      *   Need to make sure the instructor can calculate this quickly between rounds.
      *   Let $F_{avg}$ be the average forecast of the 16 students.
      *   Variable 1 (Price): $P_{t} = P_{t-1} + 0.5(F_{avg} - P_{t-1})$. (Trends towards prediction).
      *   Variable 2 (Migration): $M_{t} = M_{t-1} - 0.5(F_{avg} - M_{t-1})$. (Moves away).
