answer: |-
  This is a rigorous exercise in reflective equilibrium. You have a set of considered judgments (the 10 cases) and a working hypothesis (Unjust Enrichment), and you are looking for the friction points.

  Below, I test your current principle, propose a repaired version, offer two competing frameworks, and then apply them to your three new cases and the questions of form and standing.

  ### I. Testing and Repairing "Unjust Enrichment"

  **Your Principle:** *Reparations are owed by whoever presently holds the gains of a wrong, to whoever presently occupies the position of the wronged party, in the amount of the gain rather than the amount of the harm, structured to reverse the gain rather than to compensate a loss.*

  **The Test:**
  *   **Matches:** Case 2 (Painting), Case 5 (Colony/Extraction), Case 7 (Institution/Assets). These are your strongest fits. The asset or gain is identifiable and held.
  *   **Fails:**
      *   **Case 6 (Destroyed Gains):** Your principle says "no gain = no debt." You say "Weak Yes." This is a direct contradiction.
      *   **Case 3 (Land):** Your principle demands specific restitution (return the land) because the current holders hold the gain (the land). You say "not a yes to simply handing the land back." You are prioritizing stability over specific restitution here, which enrichment theory usually rejects.
      *   **Case 10 (Grandfather):** If enrichment is the key, why does the debt vanish after 50 years but persist after 15? The gain (wealth) likely persists in both cases (you exist and have assets). The principle cannot explain the time cutoff.
      *   **Case 8 (Extinct Community):** If the "position of the wronged party" is empty, enrichment theory says the debt lapses or escheats to the state. Your "uneasy No" suggests you feel the debt *should* exist but has nowhere to land.

  **The Repair:**
  To save this principle, you must add two clauses: a **Residual Duty Clause** and a **Disruption Constraint**.

  *   *Repaired Principle:* "Reparations are owed by present holders of illicit gains to present occupants of the wronged position, in the amount of the gain. **However,** if gains are destroyed, a residual duty of acknowledgment and institutional reform remains to honor the moral breach. **Furthermore,** specific restitution is limited where it would cause disproportionate disruption to innocent third parties who rely on the current holding."

  **The Cost of this Repair:**
  1.  **You abandon purity:** You are no longer strictly tracking *gain*. In Case 6, you are admitting a debt based on the *wrong itself*, not the profit. This moves you toward a Harm principle.
  2.  **You privilege stability:** In Case 3, you are admitting that "good faith reliance" (the settlers' homes) can outweigh "illicit title." This undermines Case 2 (the painting buyer). To be consistent, you must argue that *portable* goods do not generate the same reliance interests as *land*. If you cannot defend that distinction, you must concede Case 2 should also be "compensate the buyer, give value to the heir."

  ---

  ### II. Competing Candidate 1: Corrective Harm (Worsening)

  **The Principle:** *Justice requires restoring the victim to the welfare baseline they would have occupied had the wrong not occurred. The duty falls on the successor of the wrongdoer (state or entity) to the extent that the victim group is measurably worse off than that counterfactual baseline.*

  **Precise Clauses & Case Links:**
  *   **Clause A (Counterfactual Baseline):** Compensation is capped by the gap between actual status and projected status without the wrong.
      *   *Motivated by:* **Case 5.** You reject the "they are richer now" offset, but this principle forces you to accept it. If the colony is wealthier, the "harm" is net zero or negative.
  *   **Clause B (Causal Traceability):** Liability requires a demonstrable chain of causation between the act and the current disparity.
      *   *Motivated by:* **Case 10.** Explains why Grandfather (too many intervening causes/time) is No, but Mother (direct link) is Yes.
  *   **Clause C (Harm Persists):** Liability exists even if the wrongdoer's gain is gone, provided the victim's harm remains.
      *   *Motivated by:* **Case 6.** Handles the "destroyed wealth" scenario perfectly.

  **Verdicts You Must Abandon:**
  *   **Case 5 (Colony):** You would have to reduce or eliminate the claim if the colony is objectively richer. You currently reject this offset.
  *   **Case 2 (Painting):** This principle struggles with Case 2. The buyer didn't cause the harm; the thief did. Corrective Justice usually targets the tortfeasor, not the good-faith purchaser. To keep Case 2, you must treat the *object itself* as the site of harm, which is a property rule, not a harm rule.
  *   **Case 4 (Slavery):** This principle demands a specific counterfactual baseline for African Americans today. This is empirically fraught. Your preference for "programmatic, group-level redress" suggests you want to avoid this specific accounting.

  **Weight Analysis:**
  This principle carries **Case 6** and **Case 10** well, but it crushes **Case 5** and makes **Case 4** administratively impossible. It places the most weight on *measurable welfare*.

  ---

  ### III. Competing Candidate 2: Civic Standing (Relational)

  **The Principle:** *Historical injustices create a defect in the political legitimacy of the current order. Reparations are measures required to restore the equal civic standing of the wronged group within the political community, regardless of specific asset tracing or welfare baselines.*

  **Precise Clauses & Case Links:**
  *   **Clause A (Legitimacy over Assets):** The goal is not wealth transfer but the restoration of trust and equal status.
      *   *Motivated by:* **Case 4.** Explains the "programmatic, group-level" preference. It's about the relationship between the State and the Group, not Heir A and Heir B.
  *   **Clause B (Consent as Primary):** Violations of self-determination create standing claims regardless of economic outcome.
      *   *Motivated by:* **Case 5.** Explains why "they are richer" doesn't matter. The debt is for the *denial of consent*, not the poverty.
  *   **Clause C (Claimant Capacity):** A claim requires a political agent capable of entering into a renewed civic contract.
      *   *Motivated by:* **Case 8.** Explains your "No." If the community is scattered and identifies with the oppressor nation, there is no distinct civic relationship to repair. Your unease comes from the moral wrong, but the *political* claim is void.

  **Verdicts You Must Abandon:**
  *   **Case 2 (Painting):** This is a private law dispute, not a civic standing issue. A civic principle would likely say "State compensates the heir, let the buyer keep the painting to avoid private disruption," or "This is a legal matter, not a reparations matter."
  *   **Case 7 (Religious Order):** Unless the Order is a state actor, this is tort law, not civic standing. You would have to reclassify this as a legal liability issue, distinct from "reparations."
  *   **Case 10 (Mother):** This principle applies to groups and states. It has no language for inter-family debt. You would have to admit Case 10 is a different category entirely (inheritance law vs. political justice).

  **Weight Analysis:**
  This principle carries **Case 3**, **Case 4**, and **Case 5** beautifully. It explains why land isn't simply returned (stability is required for civic order) but acknowledgment is needed. It places the most weight on *political legitimacy*.

  ---

  ### IV. Verdicts on the Three New Cases

  Here is how the three principles (Repaired Enrichment, Corrective Harm, Civic Standing) handle your omitted cases.

  **Case A: A wrong entirely lawful under the law of the place and time it was done (e.g., 19th-century land seizure via legal loophole).**
  *   **Repaired Enrichment:** **Yes.** The gain was illicit in moral terms, even if legal. The focus is on the holding, not the legality at the time.
  *   **Corrective Harm:** **Yes.** The harm to the victim is the same regardless of the law.
  *   **Civic Standing:** **Yes.** The current state inherits the legitimacy deficit of the previous legal order if it rests on those foundations.
  *   **Synthesis:** All three support a claim. Your intuition likely aligns here (Case 5 implies this).

  **Case B: Fortunes reversed. Victims' descendants are now the richer group; wrongdoers' descendants are the poorer.**
  *   **Repaired Enrichment:** **Yes.** The wrongdoer's society still holds the *historical* gain (infrastructure, head-start), even if current cash flow is low. The debt tracks the *origin* of the wealth, not current GDP.
  *   **Corrective Harm:** **No.** There is no welfare gap to close. The baseline is exceeded.
  *   **Civic Standing:** **Yes.** Standing is about status and history, not current bank accounts. A rich group can still be politically marginalized or disrespected.
  *   **Synthesis:** This is the wedge. If you feel the debt vanishes, you are a **Harm** theorist. If you feel the debt remains (perhaps as acknowledgment or institutional reform, less cash), you are **Enrichment** or **Civic**. Given Case 5, I suspect you lean toward the debt remaining.

  **Case C: Disparity produced by no discrete act, but by long accumulation of ordinary private decisions (e.g., housing covenants, hiring networks).**
  *   **Repaired Enrichment:** **Weak No.** Hard to identify "the gain" or "the holder." Diffuse gains dissolve the liability.
  *   **Corrective Harm:** **Yes.** The harm is measurable, even if the cause is structural.
  *   **Civic Standing:** **Strong Yes.** This is the core of the Civic view. The state has a duty to ensure equal standing regardless of whether a specific "crime" occurred.
  *   **Synthesis:** Your verdict on Case 4 (programmatic redress for slavery) suggests you accept structural causation. This pushes you away from Enrichment and toward Civic Standing.

  ---

  ### V. Form and Standing

  **1. Is Form settled by the Principle?**
  Yes, largely.
  *   **Enrichment** dictates **Restitution**. The form should match the gain (land returned, art returned, capital endowment).
  *   **Harm** dictates **Compensation**. The form is cash or services equivalent to the loss (tort payouts, welfare programs).
  *   **Civic Standing** dictates **Recognition and Reform**. The form is apology, curriculum change, voting rights protection, and institutional inclusion. Cash is secondary.

  *Your Conflict:* You want Case 4 (Slavery) to be "programmatic, group-level" (Civic) but you justify it partly via the scale of the wrong (Harm/Enrichment).
  *Resolution:* If you adopt the **Civic Standing** principle, Form becomes flexible. Cash is just one tool to buy standing. This resolves your tension in Case 3 (Land). You don't return the land (Enrichment) because the goal is civic stability, not asset recovery. You provide investment/acknowledgment (Civic) to restore standing.

  **2. Who has Standing to Settle?**
  If the claimant community is divided (e.g., some want cash, some want land, some want apology):
  *   **Enrichment** says: The **Heirs**. It is their property. They can sell it if they want.
  *   **Harm** says: The **Individuals**. You cannot settle another person's pain for them.
  *   **Civic Standing** says: The **Representative Body**. Since the claim is about the group's political status, a democratically selected leadership within that group (e.g., a commission, a tribal council, a civil rights coalition) has the authority to negotiate a settlement that binds the community, similar to a union or a state.

  *Your Constraint:* In Case 8, you said "No" partly because "no one to organize a claim." This confirms you are implicitly using a **Civic Standing** requirement for group claims. You require a political agent to receive the repair.

  ### VI. Conclusion: What You Believe

  You are not an Unjust Enrichment theorist. Your verdict on Case 6 (destroyed gains) and Case 4 (programmatic redress) breaks that model.

  You are a **Civic Standing Theorist with a Property Constraint.**

  *   **Core Belief:** Historical injustices create a legitimacy deficit in the current political order. The goal of reparations is to restore the equal standing of the wronged group within that order.
  *   **The Constraint:** You retain a strong intuition for specific restitution (Case 2, Case 7) when the asset is discrete, the holder is identifiable, and the disruption is low. This is a "Property Exception" to your Civic rule.
  *   **What you must give up:**
      1.  **Consistency on Good Faith:** You must admit that the buyer in Case 2 is treated differently than the settlers in Case 3 *only* because of the disruption cost, not because of a difference in moral right. The settlers have a claim too; it is just outweighed by the chaos of removal.
      2.  **The "Gain" Metric:** You must stop looking for the money. In Case 5 and 6, the debt exists even if the money is gone or the victim is rich. The debt is moral/political, not accounting.
      3.  **Family vs. State:** You must separate Case 10 from the rest. Case 10 is inheritance law (private obligation). Cases 1-9 are political justice (public obligation). Trying to make them obey the same principle is causing you noise.

  **Final Verdict:** Your principle is **Civic Standing**. It explains why you want programmatic redress for slavery (Case 4), why "benefits" don't cancel colonial debts (Case 5), and why extinct communities without representatives have no claim (Case 8). It requires you to view the painting (Case 2) not as a model for all justice, but as a rare instance where civic repair and property restitution align.
