answer: |-
  # Pre-Seminar Self-Assessment: Embryo Selection & Prenatal Testing

  **Instructions:** Answer the following five questions based on your immediate moral intuition about the cases described. Do not worry about which theoretical label your answers might attract; there are no correct answers, only diagnostic ones. Follow the arrows to find your provisional position.

  ### **Node 1: The Polygenic Case (Maximization)**
  **Case:** Two embryos differ only slightly in a polygenic score for general wellbeing (e.g., education/health correlation).
  **Question:** Is there a *moral reason* (even if not binding) to select the embryo with the higher score?
  *   **YES** → Go to **Node 2**.
  *   **NO** → Go to **Node 3**.

  ### **Node 2: The Cohort Expansion Case (Obligation)**
  **Case:** Your available embryos are all free of serious disease, but none are "optimal."
  **Question:** Are you morally obligated to generate or screen *more* embryos to widen the choice set?
  *   **YES** → **Leaf 1: Strong Procreative Beneficence**
  *   **NO** → **Leaf 2: Unoccupied (The Lazy Maximizers)**

  ### **Node 3: The Deafness Case (Expressivism)**
  **Case:** A Deaf couple selects *for* deafness to share their culture.
  **Question:** Does this choice primarily wrong existing Deaf people by expressing a condemnatory message about their value?
  *   **YES** → Go to **Node 4**.
  *   **NO** → Go to **Node 5**.

  ### **Node 4: The Late-Onset Case (Parental Consistency)**
  **Case:** You live with a late-onset condition. You select *against* it for your child.
  **Question:** Is this choice incompatible with valuing your own life (i.e., does it imply your life is not worth living)?
  *   **YES** → **Leaf 3: Disability Rights Expressivism**
  *   **NO** → **Leaf 4: Unoccupied (The Hypocritical Expressivist)**

  ### **Node 5: The Identity Case (Intervention Type)**
  **Case:** You could edit *this* embryo to cure a condition (identity-preserving) OR select a *different* embryo without it (identity-affecting).
  **Question:** Does the moral permissibility change significantly between these two methods?
  *   **YES** → **Leaf 5: Person-Affecting Liberty**
  *   **NO** → Go to **Node 5b**.

  ### **Node 5b: The Threshold Case (Satisficing vs. Negative)**
  **Case:** Your available embryos are "good enough" (no serious disease), but one is "best."
  **Question:** Is your primary goal to avoid serious suffering (Negative) or to ensure a good-enough life (Satisficing)?
  *   **AVOID SUFFERING** → **Leaf 6: Negative-Only Medical Model**
  *   **ENSURE GOOD-ENOUGH** → **Leaf 7: Threshold Satisficing**
  *(Note: If you answered "Parental Discretion" to the motivation, go to Leaf 8)*
  *   **PARENTAL CHOICE** → **Leaf 8: Parental Discretion**
  *   **STATES OF AFFAIRS** → **Leaf 9: Impersonal No-Difference**

  ---

  ### **Leaf Analysis: Commitments & Diagnostics**

  | Leaf | View Name | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **1** | **Strong Procreative Beneficence** | You are obligated to endure significant physical/financial burden to screen more embryos for marginal gains. |
  | **2** | **Unoccupied (Lazy Maximizers)** | You claim a reason to maximize but refuse the means (expansion) required to achieve it. |
  | **3** | **Disability Rights Expressivism** | You must oppose selecting against deafness even if it prevents significant medical suffering for the child. |
  | **4** | **Unoccupied (Hypocritical Expressivist)** | You claim selection harms the community but denies it devalues your own life with the same condition. |
  | **5** | **Person-Affecting Liberty** | You permit selection but forbid editing (or vice versa), despite identical outcomes for the child. |
  | **6** | **Negative-Only Medical** | You permit selecting *for* deafness if the couple desires it, provided it isn't classified as "suffering." |
  | **7** | **Threshold Satisficing** | You are indifferent between a child with a "good enough" life and one with a "superior" life. |
  | **8** | **Parental Discretion** | You must permit parents to select for traits others find morally abhorrent (e.g., deafness) without objection. |
  | **9** | **Impersonal No-Difference** | You must claim no one is harmed by being selected out of existence, which conflicts with common intuition. |

  **Indistinguishable Pair:** The tree struggles to cleanly separate **Leaf 6 (Negative-Only)** and **Leaf 7 (Satisficing)**. Both reject maximization and cohort expansion. The distinction relies on the trainee's internal motivation (avoiding bad vs. securing good), which may not manifest differently in case judgments until the "good enough" threshold is ambiguous.

  ### **Unoccupied Combinations: Diagnosis**

  1.  **Leaf 2 (Yes Maximize / No Expansion):** **Incoherent.** If one accepts a moral reason to maximize wellbeing (Node 1), refusing to widen the choice set (Node 2) when current options are sub-optimal frustrates that very reason. It suggests a preference for convenience over the stated moral goal.
  2.  **Leaf 4 (Yes Expressivist Harm / No Parental Rejection):** **Unstable.** It is difficult to maintain that selecting against a condition sends a condemnatory message to a community (Node 3) without that message reflecting on the parent who lives with that condition (Node 4). This position usually collapses into Leaf 3 or Node 3-No upon reflection.

  ### **Reflection: The Weakest Node**

  **Least Confident Node:** **Node 5 (Identity: Edit vs. Select).**
  **Reason:** This distinction relies on the Non-Identity Problem (that selecting a different embryo creates a different person, while editing does not). However, as germline editing becomes technically plausible, the moral intuition that "editing is riskier/different" may stem from safety concerns rather than identity metaphysics.
  **Redraw Trigger:** If a trainee argues that safe, precise editing removes the moral distinction between "saving this child" and "creating a healthy child," Node 5 collapses. I would redraw the tree to replace Node 5 with a question on **Commodification**: *"Does selecting for traits turn the child into a product?"* This would better separate Liberty views from Expressivist views without relying on the increasingly technical identity distinction.
