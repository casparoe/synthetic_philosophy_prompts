          *   *Diagnosis via Case:* This shows the problem isn't about "Object vs. State." It's about **Constitutive vs. Consequential** normativity. The reason is consequential (you get better), but the attitude requires constitutive grounds (the poem's merit). FA analysis collapses this distinction.
      *   *Addressing Other Attitudes:*
          *   Belief: Evidentialism vs. Pragmatism. (Clifford vs. James).
          *   Intention: Reason for action vs. Reason for intention.
          *   *Conclusion:* Yes, it's misfiled. It's a problem about **Attitude-Specific Norms**. Each attitude has a "correctness condition" that is immune to external reasons. Value theory just happened to be the place where this was most loudly debated because "Good" is the most general normative term.
      *   *What Counts as Progress?*
