      *   **Specific Case to Analyze:** The "Cultivation Demon." A demon offers non-instrumental self-improvement (becoming a person who notices value) if you learn to genuinely admire a mediocre poem. Is this WK or RK (Right Kind)? Does it bear on the poem's value?
      *   **Second Task:** Consider structural analogues in belief, intention, and hope. If they exist, is this misfiled as value theory?
