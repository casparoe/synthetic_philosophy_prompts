      *   *Standard Replies:* Object-given vs. State-given reasons. Fittingness as primitive.
      *   *User's Insight:* The "Kind" distinction is doing too much work. It's conflating *why* we hold an attitude, *what justifies* the attitude, and *what makes the object valuable*.

  3.  **Analyze the "Cultivation Demon" Case:**
      *   *Setup:* Mediocre poem. Demon says: "Genuinely admire this, and you become a person of value-perception (non-instrumental good)."
      *   *Tension:* It's not a threat (standard WKR). It's not about the poem's properties (standard RK). It's about the *effect on the agent's character* (aretaic/eudaimonic).
      *   *The Crux:* If you succeed, you *do* admire it. So you have a reason to bring about the state of admiration. But does the poem warrant admiration? No, it's mediocre.
      *   *Implication:* This highlights the gap between "Reason to *get* oneself to $\phi$" and "Reason *for* $\phi$-ing." But the Demon ensures the reason is to *genuinely* admire, not just pretend. This presses the distinction between reasons for attitudes and reasons for actions that cause attitudes.

  4.  **Analyze the Normative Domains (Belief, Intention, Hope):**
      *   *Belief:* Pragmatic encroachment/Pascal's Wager style. Reason to believe God exists (to be happy) vs. Reason based on evidence. WKR analogue: Pragmatic reasons for belief are often deemed "wrong kind."
      *   *Intention:* Reason to intend to do X (because intending pays off) vs. Reason to do X. (Broome's distinction).
      *   *Hope:* Reason to hope (comfort) vs. Reason based on probability/value of outcome.
      *   *Significance:* If WKR shows up everywhere normative attitudes exist, it's not about *value* specifically. It's about the *structure of normativity* and the transparency of attitudes.

  5.  **Formulate the Diagnosis:**
