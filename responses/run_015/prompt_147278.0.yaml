  The most significant mismatch between axes (a) and (b) appears in the **American South**. There is a high degree of archival transparency (a=4) because plantation ledgers, slave narratives, and government records are increasingly digitized and accessible to researchers. However, this raw data does not line up with curricular embedding (b=2), as state legislatures actively pass laws limiting how teachers can contextualize those records as evidence of systemic crimes. This creates a situation where the *evidence* is public, but the *pedagogy* is restricted.

  ### Overall Ranking

  Germany stands alone at the top due to the consistency of its state-sponsored reflexivity. The American South ranks second because, despite curricular battles, the physical landscape of memory is actively shifting toward dissonance and archives remain open. Japan follows, as its state apparatus maintains a more static, protective narrative over imperial history. Turkey ranks last due to official state denialism across all three axes.

