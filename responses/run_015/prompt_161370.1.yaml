answer: |-
  Here is the specification for a naturalistic theory of mental content adequate for empirical cognitive science.

  ### The Requirements

  **1. The Misrepresentation Condition**
  *   **Requirement:** The theory must explain how a state can token when its content is *not* the case, without collapsing into a disjunction of all its actual causes.
  *   **The Case:** A frog's visual detector fires for a fly, but also for a BB pellet. If content is simply "whatever causes this," the content is *fly-or-BB*. But the frog snaps incorrectly at the BB. A scientist needs to call this an error, not a success. If the theory cannot distinguish "correct firing" from "incorrect firing" using only natural materials, it cannot identify bugs in a cognitive system.
  *   **Status:** **Non-Negotiable.** Without this, you have correlation, not representation.

  **2. The Distality Condition**
  *   **Requirement:** The theory must anchor content to the distal object or property in the world, not the proximal sensory stimulation or the internal state itself.
  *   **The Case:** A retinal state is caused by photons hitting the eye. But the organism navigates relative to the *predator*, not the photon array. If content is fixed at the proximal cause, the organism is trapped in its own skin. Cognitive science models organisms as tracking environmental variables; a theory that locks content to the interface (sensory surface) makes navigation inexplicable.
  *   **Status:** **Non-Negotiable.**

  **3. The Causal Efficacy Condition**
  *   **Requirement:** A representational state must make a difference to the system's subsequent processing or behavior. A state that tracks a variable but is causally isolated from the rest of the mechanism does not count as a representation for the system.
  *   **The Case:** A neuron might perfectly track the phases of the moon due to ambient light, but if that firing never influences motor output or other cognitive states, calling it a "representation of the moon" is useless for explaining the organism's behavior. It's just a mirror, not a map used for navigation.
  *   **Status:** **Non-Negotiable** (for cognitive science utility).

  **4. The Generativity Condition**
  *   **Requirement:** The theory must account for content about things the organism has never encountered, or things that do not exist.
  *   **The Case:** An animal plans for a future drought it has never experienced, or a human thinks about a unicorn. If content requires an actual historical causal link to the specific object, these states are empty. But cognitive science treats them as structured, contentful states that drive behavior (e.g., hoarding food, drawing a horn).
  *   **Status:** **Non-Negotiable.**

  **5. The Ahistorical Normativity Condition (The Training Wrinkle)**
  *   **Requirement:** The theory must ground correctness conditions in optimization or selection histories that do *not* require biological reproduction or lineage.
  *   **The Case:** A neural network is trained via backpropagation. Units acquire stable activation patterns that correlate with "dog" vs. "cat." There is no organism, no DNA, no reproduction. Yet, when the network misclassifies a wolf as a dog, the engineer says it got it *wrong*. If a theory requires biological evolution to ground "wrongness," it cannot describe the internal states of artificial systems or potentially non-reproducing synthetic agents. For a working scientist, the "selection" that matters is the optimization process that shaped the weights, regardless of whether it was natural or artificial.
  *   **Status:** **Non-Negotiable** (for the specific job of grounding modern cognitive science).

  **6. The Functional Reassignment Condition (The Reuse Wrinkle)**
  *   **Requirement:** The theory must specify whether content is fixed by the mechanism's original selection history or by its current systemic role, and provide a naturalistic basis for content shift if the role changes.
  *   **The Case:** A cortical area evolved for visual processing is rewired in a blind subject to process tactile information. It now reliably tracks touch and drives behavior accordingly. Does it still represent *vision* (because of its history) or *touch* (because of its current job)? If the theory says *vision*, it fails to describe what the system is actually doing now. If it says *touch*, it must explain where the new normative constraints came from without a new evolutionary history. The theory cannot simply ignore the clash; it must resolve it.
  *   **Status:** **Camp Preference** (but creates a hard tension).

  **7. The Normative Source Condition**
  *   **Requirement:** The theory must identify a natural property that generates an "ought." It must explain why a state *should* indicate X, even when it indicates Y, without smuggling in semantic primitives.
  *   **The Case:** Physical laws describe what *does* happen, not what *should* happen. A rock falls; it doesn't fail to fly. A representation can fail. If the theory cannot locate the source of this normativity in the natural world (e.g., in function, goal-directedness, or system maintenance), it hasn't naturalized content; it has just relabeled the mystery.
  *   **Status:** **Non-Negotiable.**

  ---

  ### Incompatibilities and Tensions

  **The Clash: Distality (Req 2) vs. Ahistorical Normativity (Req 5)**
  *   **The Conflict:** Securing **Distality** usually requires a historical story (e.g., "this state is about the fly because ancestors who fired for flies survived, not those who fired for retinal patches"). This anchors the content to the distal cause that mattered for survival. However, **Ahistorical Normativity** (for ANNs/training) denies you biological history.
  *   **The Problem:** If you ground normativity in training history (Req 5), you get error, but you struggle to get *distality*. In a neural net, the "selection" pressure is usually on the output score, not on tracking a specific distal variable in the environment. The network might solve the task by exploiting a proximal artifact (e.g., a watermark on the image) rather than the distal object (the dog). Without biological history to filter "natural kinds," the theory struggles to say the unit represents *dog* rather than *watermark-pixel-pattern*.
  *   **Verdict:** These are jointly satisfiable only if the theory can show how artificial optimization pressures select for distal variables specifically, not just input-output success. Most current theories fail this.

  **The Clash: Historical Normativity vs. Functional Reassignment (Req 6)**
  *   **The Conflict:** If you ground normativity in history (to satisfy Error and Distality), you lock content to the past. If a mechanism is reused (Req 6), its history says one thing (vision), but its current causal role says another (touch).
  *   **The Problem:** If you stick with history, you lose descriptive accuracy for the working scientist (the system is doing touch). If you switch to current role, you lose the ability to say the system is *wrong* about touch (because currently, it tracks touch perfectly). You trade the ability to handle **Reuse** for the ability to handle **Error**.
  *   **Verdict:** This is the hardest tension. A theory usually has to sacrifice the stability of content (it changes with role) or the robustness of error (error is only possible relative to the original design).

  ---

  ### The Most Exclusionary Requirement

  **The Misrepresentation Condition (Req 1)**

  *   **Why:** It sounds modest ("stuff can be wrong"), but it exerts the most force because it rules out any theory that relies purely on current causal covariance or information.
  *   **The Force:** If content is just "what causes this state," then whenever the state occurs, the content is present. There is no room for error. To get error, you must introduce a gap between *what causes the state* and *what the state is supposed to indicate*. Closing that gap naturalistically requires adding machinery (functions, goals, selection, norms) that pure causal/informational theories do not have.
  *   **Exclusion:** This single requirement kills all naive causal theories, pure informational semantics, and any account that identifies content strictly with actual correlation. It forces you into teleology, functional role, or inferentialism. It is the bottleneck through which almost no simple naturalistic story can pass.

  ---

  ### Scorecard of Live Families

  **1. Covariation / Information-Based**
  *   **Core Idea:** Content is determined by reliable causal correlation or information carrying.
  *   **Where it Cracks:** Fails the **Misrepresentation Condition**. If the state fires, the correlation holds, so there is no error. It also struggles with **Distality**, often locking content to the immediate cause. Good for mapping information flow, bad for grounding "wrongness."

  **2. History-and-Function-Based (Teleological)**
  *   **Core Idea:** Content is determined by what the state was selected *for* (evolutionarily or via learning).
  *   **Where it Cracks:** Fails the **Ahistorical Normativity Condition** (struggles with ANNs/Swampmen without ad-hoc moves) and the **Functional Reassignment Condition**. If a mechanism is reused, its old history dictates content that no longer matches its current job. Excellent for error and distality in biological natives, brittle for plastic or artificial systems.

  **3. Use or Role-Based (Inferential/Functional Role)**
  *   **Core Idea:** Content is determined by how the state is used downstream within the system (its connections to other states and outputs).
  *   **Where it Cracks:** Fails the **Distality Condition** and risks collapsing **Normativity**. If content is just what the system *does* with the state, it's hard to say the system does it *wrong*. It also tends to internalize content, making it about the system's own web of beliefs rather than the world. Good for **Reuse** and **Efficacy**, bad for grounding truth conditions in the environment.
