answer: |-
  **MEMORANDUM**

  **TO:** Substance-Use Advisory Council
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **RE:** Position on House Bill 402 (Possession Decriminalization)

  **Recommendation**

  I recommend that the Council support House Bill 402 only conditionally. We should advise the Health Committee to adopt two specific amendments before the bill reports out. First, the escalation provision must be modified so that a misdemeanor charge cannot be filed for failure to complete treatment if no treatment slot was available within the compliance window. Second, the statute must explicitly state that the panel's findings are non-censuring and cannot be used as evidence of moral culpability in subsequent proceedings.

  We should transmit this opinion to the Health Committee within four weeks. This gives them two weeks to deliberate on our conditions before their six-week reporting deadline. If these amendments are not adopted, I urge the Council to oppose the bill. While the intent is humane, the current text creates a mechanism where administrative process masks criminal punishment, and scientific arbitrariness dictates legal liability.

  **The Meaning of "Administrative"**

  We must be honest about whether the word "administrative" is doing real work here, or if it is merely a label we apply to soothe our conscience. In moral philosophy, the distinctive feature of criminal punishment is not the severity of the burden—it is the *censure* it expresses. A tax imposes a cost; a quarantine imposes a restriction; but only criminal conviction addresses the citizen as a wrongdoer who merits public blame. The bill's proponents argue that because the possession itself leaves no criminal record, no censure is expressed. I believe this is incorrect.

  Consider the strongest version of the supporters' argument. They contend that the criminal sanction attaches not to the drug use, but to the disobedience of a lawful order. On this view, the state is not blaming the citizen for being dependent or for consuming a substance; it is holding them accountable for ignoring a directive designed to help them. This preserves autonomy: the citizen chooses the consequence by refusing the panel's guidance. It frames the interaction as cooperative rather than punitive.

  Our counsel offers a procedural variation on this. He argues the distinction is purely mechanical: because there is no jury, no right to counsel, and a lower burden of proof, the system is designed for efficiency and care, not retribution. The absence of criminal procedure signals the absence of criminal intent.

  Both arguments fail when confronted with the reality of the enforcement provision. If a system summons you by name, records your presence, seats you before three officials, and holds a criminal charge over your head for non-compliance, it expresses blame. It treats you as a subject of correction. This is compounded by the treatment waiting lists. If a person is ordered into treatment that does not exist, and then charged with a misdemeanor for failing to attend, the state is punishing them for impossibility. That is not administrative regulation; it is criminal censure disguised as bureaucracy. The label "administrative" only does work if the consequence for non-compliance remains administrative. Once the threat of jail enters the room, the censure is real, regardless of what the statute calls it.

  **The "Five-Day Supply" and the Trade-Off of Rules**

  Moving from the legal to the pharmacological, we must address the schedule defining a "five-day supply." In my forty years of receptor binding work, I learned that personal supply is not a quantity that exists in nature. Tolerance varies by orders of magnitude between individuals. A dependent person's five days and a novice's five days are not the same pharmacological object; the former may require grams to function, while the latter could be fatally overdosed by milligrams.

  We cannot pretend this schedule can be made scientifically correct. Instead, we must recognize it for what it is: a legal rule that purchases determinacy at the price of accuracy. It draws a bright line so police officers do not have to make clinical judgments on the street. This trade-off is common in law. Speed limits are arbitrary; no one argues that 55 mph is safe and 56 mph is deadly. We accept the inaccuracy because we need a rule that is easy to enforce.

  However, the acceptability of this trade-off depends on the stakes. When the consequence is a modest fine, we tolerate the scientific inaccuracy. When the consequence escalates to criminal liability via the panel's enforcement powers, the inaccuracy becomes unjust. A rigid numerical threshold cannot account for the biological reality of tolerance, and using it as a trigger for potential criminalization violates basic fairness.

  This same trade-off reappears in the design of the review panel. We must decide whether the panel should apply rigid rules or exercise judgment case by case. Rules offer predictability but ignore individual context; judgment offers flexibility but invites inconsistency. Given the waiting list crisis, rigid rules will fail. If the panel is bound to direct everyone to treatment, and treatment is unavailable, the panel becomes a funnel to misdemeanor court. The panel must have the discretion to recognize when compliance is impossible and to close the file without escalation. If we demand determinacy over accuracy here, we sacrifice the very people the bill is meant to help.

  **Conclusion**

  Bill 402 attempts to shift our response to substance use from a criminal model to a health model. But a health model cannot rest on a foundation of criminal threats for non-compliance, nor can it rely on pharmacological fictions to define liability.

  I ask the Council to endorse the conditional support outlined above. We should tell the Health Committee that we welcome the decriminalization of possession, but we cannot endorse a system that uses administrative theater to deliver criminal blame. We must ensure that when the state intervenes, it does so with tools that match the reality of the condition—both the legal reality of censure and the biological reality of dependence. If the Committee cannot amend the escalation clause and clarify the non-censuring nature of the panel, we should oppose the bill. It is better to have no bill than one that promises care but delivers punishment.
