          *   *AH:* Organizational properties are necessary but *not sufficient*. Moral status requires causal ownership via developmental/evolutionary history. "Proxy computations" (shadowing/mimicking without internal causal entanglement) are not sentient.
      *   **Central Test Case:** Proxy or shadow integration (distributed/AI system producing sentient-like outputs without internal causal entanglement).
