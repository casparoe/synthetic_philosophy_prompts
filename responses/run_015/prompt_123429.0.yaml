      *   *Explain "The Input Problem":* JC is a constraint on how you *incorporate* experience. If you define the partition via the posterior, you aren't incorporating experience; you're rationalizing a change you already made.
      *   *Discuss "Rigidity":* Rigidity is a constraint on *irrelevance*. It says "Experience affected $E_i$ directly, but didn't change how $H$ relates to $E_i$." If $E_i$ is defined by the ratio, this claim becomes trivial/tautological rather than substantive.
      *   *Address the "Real Constraint" worry:* It moves the problem to the "Principle of Direct Influence." We need a story about which propositions experience bears on directly.
      *   *Recommendation:* Look at "The Principle of Reflection" or work by Richard Jeffrey, Brian Skyrms, or the "imprecise probability" crowd if they want to avoid the partition problem. But for standard JC, the constraint is *exogeneity*.

