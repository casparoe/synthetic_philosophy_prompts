  3.  **Evaluate the Algebra (Steps 3 & 4):**
      *   Let $E_i$ be a cell where $r(w) = k_i$ (constant).
      *   So for all $w \in E_i$, $P^*(w) = k_i P(w)$.
      *   Check Rigidity: Is $P^*(H | E_i) = P(H | E_i)$?
