prompt: |-
  I'm in the final year of a PhD in philosophy (decision theory and social choice, with a side interest in global priorities research), and I've been asked to write an internal agenda memo for a small foundation that funds work on how to prioritize causes. They have roughly one postdoc-year of conceptual work to allocate over the next two years — call it four short commissioned papers, or one junior researcher's year — and the question put to me is this: which unresolved conceptual questions about cause prioritization itself should a funder commission work on, and in what order? The counterfactual matters, because I have to be able to say why a conceptual question deserves a slot: the alternative use of the same money is another round of empirical reports on particular cause areas.

  What I do not want is a survey of the literature or a catalogue of the familiar objections. I already know the standard list: that the importance, tractability, and neglectedness factors are supposed to combine multiplicatively, and that little has been said about why that combination rule is the right one; that tractability and neglectedness both look like ways of getting at marginal returns and may therefore double-count; that the framework is silent about the units in which each factor is measured and about how those units are traded off against one another; that it scores causes one at a time and so says nothing about portfolios, sequencing, or complementarities between causes; and that it yields a ranking without yielding a size, telling you which cause is best but not how much of a fixed budget to commit to it. Assume all of that is on the table. What I want is a defended ordering of a subset of these questions, plus questions I have not listed, with the ordering argued for rather than asserted.

  Three half-formed thoughts of my own, which I would like ranked against the others or dismissed outright:

  First, a granularity worry. The score a cause receives seems to depend on how finely the space of causes is carved up: subdividing a cause can make each part look more neglected and less tractable without anything changing in the world, which suggests the framework has no principled level of application. Is this a genuine defect or a confusion about what the framework is for, and is settling it upstream of the double-counting worry?

  Second, a shape-of-the-return-curve worry. If we treat value produced in a cause as a function of resources devoted to it, the three factors look like a local, first-order summary of that function. But the questions people actually use the framework to answer concern how much to fund, and those may depend on the global shape of the curve — thresholds, lumpiness, regions of increasing returns — which a local summary discards. Is the worthwhile project here repairing the framework or replacing it with something like an explicit funding-return curve, and which of the standard objections would then simply evaporate?

  Third, a reading worry: whether the framework is best understood as a claim about what makes a cause a good one in the first place, or as a heuristic for allocating a fixed budget under severe uncertainty. My suspicion is that several of the standard disputes are really disputes between these two readings, and that separating them dissolves some apparent problems while making others considerably harder.

  For each of the four or five questions you put at the top, I want: what it is upstream of, in the sense that settling it would change the answer to other questions or change an actual allocation decision; who could settle it within the budget, given that a philosopher working alone is a different prospect from a project needing empirical input the funder is not buying; what an unexciting answer would look like, since conceptual work often resolves a question in a way that leaves practice untouched; and what argument or evidence in the next two years should move it up or down the list. I also want you to name two or three items on the standard list you would defund, with the reason — effectively settled already, too dependent on empirical contingencies to reward a conceptual paper, or simply not decision-relevant — and to flag where my three thoughts above are confused rather than merely underdeveloped.

  One methodological point I want addressed rather than set aside. This whole exercise applies something very like the framework to the question of which questions about the framework to fund: importance for whom, tractability given what background, neglectedness measured against which population of researchers. If the framework cannot be applied reflexively without circularity, say so, and tell me what to use instead for the ordering. Please do not include a bibliography or reading list; I will fill in citations myself.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda memo:

  1.  **Analyze the Request:**
      *   **User:** Final-year PhD in Philosophy (Decision Theory/Social Choice/Global Priorities).
      *   **Task:** Write an internal agenda memo for a foundation funding cause prioritization research.
      *   **Budget:** Roughly one postdoc-year (4 short papers or 1 junior researcher/2 years).
      *   **Goal:** Prioritize *conceptual* questions about cause prioritization itself (not empirical cause reports).
      *   **Constraint 1:** Do *not* provide a survey or catalogue of familiar objections (ITN framework flaws are assumed known).
      *   **Constraint 2:** Provide a *defended ordering* of questions, arguing for the sequence.
      *   **Constraint 3:** Address the user's three "half-formed thoughts" (Granularity, Shape-of-Return-Curve, Reading Worry).
      *   **Constraint 4:** For each top question, specify: Upstream impact, Feasibility (philosopher alone vs. empirical), "Unexciting Answer" (null result risk), and Update Conditions (what moves it up/down).
      *   **Constraint 5:** Name 2-3 items from the "standard list" to *defund* (and why).
      *   **Constraint 6:** Address the methodological point: Reflexive application of the framework to itself (circularity risk).
      *   **Constraint 7:** No bibliography/reading list.
      *   **Tone:** Professional, rigorous, decision-relevant, suitable for a foundation memo.

  2.  **Deconstruct the User's "Half-Formed Thoughts":**
      *   *Granularity:* Is the "cause" unit arbitrary? If I split "AI Safety" into "AI Safety - Alignment" and "AI Safety - Governance," do scores change artificially?
      *   *Shape-of-Return:* ITN is local (marginal). Funding decisions are global (total budget). Do we need full return curves?
      *   *Reading:* Is ITN normative (what is good) or heuristic (what to do under uncertainty)?
      *   *Assessment:* These are actually quite strong. Granularity is a version of the reference class problem. Shape-of-Return is about the difference between ranking vs. resource allocation. Reading is about the meta-ethical/epistemic status of the framework. I need to rank these against *new* questions or integrate them into the top priority list.

  3.  **Address the Methodological Point (Reflexivity):**
      *   The prompt asks to apply ITN (Importance, Tractability, Neglectedness) to *research questions about ITN*.
      *   *Risk:* Circularity. If ITN is broken, using it to fix ITN is suspect.
      *   *Solution:* Acknowledge the tension. Propose using a "meta-framework" based on *value of information* (VOI) rather than direct ITN scoring. The goal isn't to find the "truest" theory first, but the theory that reduces decision error most cheaply. This avoids circularity by shifting the metric from "truth" to "decision-relevance."

  4.  **Select and Order the Top Conceptual Questions:**
      *   *Candidate 1: The Granularity/Unit Problem (User's Thought 1).* This is foundational. If we can't define a "cause," we can't score it. It's upstream of everything.
      *   *Candidate 2: The Allocation vs. Ranking Problem (User's Thought 2 + Standard "Size" objection).* ITN ranks, but funders allocate. Moving from ordinal to cardinal/resource allocation is crucial for the foundation's actual work.
      *   *Candidate 3: The Normative/Heuristic Distinction (User's Thought 3).* Clarifying the status of the framework determines whether we try to "fix" it (make it true) or "use" it (make it robust).
      *   *Candidate 4: Portfolio Theory & Correlations.* Standard ITN treats causes as independent. They aren't. This is huge for actual funding but often ignored.
      *   *Candidate 5: Dynamic/Sequential Prioritization.* Causes change as you fund them. Static snapshots are misleading.

      *Ordering Logic:*
      1.  *Granularity:* You can't measure returns if you don't know what you're measuring. (Most upstream).
      2.  *Normative/Heuristic Status:* Determines the *goal* of the conceptual work (Truth vs. Utility).
      3.  *Allocation/Shape-of-Return:* Once we know what we are measuring and why, we need to know how to convert scores to dollars.
      4.  *Portfolio/Correlation:* Once we know how to fund one, how do we fund many together?
      5.  *Dynamic/Sequential:* (Maybe too complex for this budget, or subsumed by Allocation). Let's stick to the top 3-4 to fit the "one postdoc-year" constraint.

      *Refining the Order:*
      Actually, the *Reading Worry* (Normative vs. Heuristic) might be the *most* upstream. If the framework is just a heuristic, Granularity matters less (it's just a user error). If it's normative, Granularity is a fatal flaw. So, *Reading* comes first. *Granularity* comes second. *Allocation/Shape* comes third.

  5.  **Select Items to Defund:**
      *   *Multiplicative vs. Additive:* This is often a modeling choice dependent on the specific utility function. Without a settled theory of value, arguing about multiplication is algebraic fiddling.
      *   *Units of Measurement:* This is often a category error. The "units" are expected utility. Demanding physical units is a confusion.
      *   *Double-counting (Tractability/Neglectedness):* This is usually resolved by defining marginal returns properly. It's a definition fix, not a deep conceptual puzzle requiring a year of work.

  6.  **Drafting the Content - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** Acknowledge the constraint (conceptual vs. empirical) and the reflexive methodological issue.
      *   **Methodological Note:** Address the circularity. Use Value of Information (VOI) as the meta-criterion.
      *   **The Agenda (Ordered):**
          1.  *The Status Question (Reading Worry).* Upstream of all repair work.
          2.  *The Granularity Question.* Upstream of measurement.
          3.  *The Allocation Question (Shape-of-Return).* Upstream of actual grantmaking.
          4.  *The Portfolio Question.* (Optional/Backup).
      *   **Defund List:** Explain why certain standard objections are dead ends.
      *   **Critique of User's Thoughts:** Validate the good, point out confusion in the "Reading" one (it's not just a reading, it's a functional design choice).
      *   **Feasibility/Updates:** As requested for each item.

  7.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Critique:* Is "Reading Worry" too philosophical?
      *   *Fix:* Frame it as "Operational Status." Does the framework claim to describe value or guide action under ignorance? This changes whether we need better data or better theory.
      *   *Critique:* Is Granularity solvable by a philosopher alone?
      *   *Fix:* It requires decision theory and ontology. It's conceptual. But it needs to be tested against case studies (which the postdoc can do without new empirical data, just re-analyzing existing cause profiles).
      *   *Reflexivity:* Make sure to explicitly state that we are using VOI, not ITN, to prioritize the research.

  8.  **Final Review against Constraints:**
      *   No bibliography? Check.
      *   Defended ordering? Check.
      *   Address User's 3 thoughts? Check.
      *   Upstream/Feasibility/Null/Update for each? Check.
      *   Defund 2-3 items? Check.
      *   Methodological reflexivity addressed? Check.
      *   Tone appropriate? Check.

  9.  **Final Polish:** Ensure the distinction between "conceptual" and "empirical" is maintained. The foundation isn't buying new data, they are buying *clarity on how to use existing data*.

  *(Self-Correction on the "Reading Worry"):* The user asks to flag where their thoughts are confused. I should note that the "Reading Worry" isn't just about interpretation; it's about *specification*. A heuristic that isn't specified is a black box. The confusion lies in thinking these are mutually exclusive interpretations rather than design parameters. I will clarify this in the critique section.

  *(Self-Correction on "Granularity"):* Is this really upstream of "Reading"? If it's a heuristic, granularity is a bug to be managed. If it's normative, it's a bug to be fixed. So "Reading" determines how we solve "Granularity." Yes, Reading is first.

  *(Self-Correction on "Defund"):* "Units of measurement" is a good candidate to defund because it's often a category mistake (utility is the unit). "Multiplicative rule" is good because it derives from the underlying model (marginal returns), so arguing about the rule without the model is pointless.

