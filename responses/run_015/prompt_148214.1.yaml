answer: |-
  **MEMORANDUM**

  **TO:** Investment Committee
  **FROM:** [Your Name], PhD Candidate
  **DATE:** October 26, 2023
  **SUBJECT:** Conceptual Research Agenda: Prioritizing Questions about Prioritization

  ### 1. Methodological Preamble: The Reflexivity Problem

  You have asked me to apply a prioritization framework to the question of how to improve that very framework. This invites circularity: if the framework (ITN) is conceptually unstable, using it to select research questions about its stability is unreliable.

  To avoid this, I recommend we do not use ITN to prioritize ITN research. Instead, we should use a **Value of Information (VOI)** criterion. The question is not "Which conceptual flaw is most important?" but "Which conceptual clarification, if resolved, would most reduce the probability of allocation error given our current uncertainty?"

  This shifts the metric from *truth* to *decision-relevance*. A conceptual question deserves funding only if its resolution changes a funding decision we would otherwise make. This filters out purely metaphysical disputes (e.g., the ontological status of "causes") and focuses on operational bottlenecks.

  ### 2. The Agenda: A Defended Ordering

  I propose allocating the postdoc-year to three specific conceptual projects, ordered by upstream dependency. If Project 1 concludes that the framework is merely a heuristic, Project 2 changes shape. If Project 2 concludes that marginal analysis is sufficient, Project 3 becomes unnecessary.

  #### Priority 1: The Operational Status of the Framework (The "Reading" Question)
  **The Question:** Is the framework a normative claim about the structure of value (i.e., causes *are* valuable because they are important, tractable, and neglected) or a decision-heuristic for acting under severe uncertainty (i.e., these are proxies for marginal utility when we can't calculate it directly)?

  **Why First (Upstream Impact):** This is the most upstream question. If the framework is normative, then "Granularity" (Priority 2) is a fatal metaphysical flaw that requires rebuilding the ontology of causes. If it is a heuristic, Granularity is merely a user-error problem to be managed via guidelines. Furthermore, if it is a heuristic, the "Multiplicative vs. Additive" debate (see Defund List) dissolves into a question of which approximation minimizes error, rather than which formula is "true."

  **Feasibility:** High. This is pure conceptual analysis and decision theory. It requires no new empirical data, only a rigorous mapping of the framework's logical commitments against standard decision-theoretic axioms.

  **The Unexciting Answer:** The conclusion that the framework is "ambiguous" or "context-dependent." This leaves practitioners with the same discretion they currently have, resolving nothing. A successful paper must recommend a *single* operational stance for the foundation to adopt.

  **Update Conditions:** Move this down if preliminary scoping suggests the literature has already converged on a consensus reading (unlikely). Move it up if internal disputes about "what counts as a cause" are stalling grant approvals.

  #### Priority 2: The Granularity and Reference Class Problem
  **The Question:** Does the scoring of a cause depend on the arbitrary fineness of its description, and if so, is there a principled rule for individuating "causes" (e.g., by intervention type, by problem space, or by budget envelope)?

  **Why Second (Upstream Impact):** This is upstream of measurement. If I can boost a cause's "Neglectedness" score simply by subdividing it into "AI Safety for Medical Robotics" vs. "AI Safety for Finance," the metric is gameable. We cannot proceed to Allocation (Priority 3) if the unit of allocation is undefined. This addresses your first half-formed thought directly.

  **Feasibility:** Moderate. A philosopher can propose normative criteria for individuation (e.g., "carve at the joints of production functions"), but testing this requires re-scoring existing cause areas under different granularities. This can be done via thought experiments and re-analysis of public cause profiles, without new empirical fieldwork.

  **The Unexciting Answer:** The conclusion that there is no principled level of application, only a "pragmatic" one determined by the funder's existing budget buckets. This effectively admits the framework cannot guide *new* cause discovery, only sorting within pre-existing categories.

  **Update Conditions:** Move down if Priority 1 concludes the framework is a rough heuristic where precision doesn't matter. Move up if we observe significant score volatility when cause areas are renamed or split in current practice.

  #### Priority 3: From Ranking to Allocation (The "Shape-of-Return" Question)
  **The Question:** Can the local, first-order summary of the framework (marginal returns) be mathematically integrated into a global funding rule, or must we replace the framework with explicit return-curve modeling for top causes?

  **Why Third (Upstream Impact):** This addresses your second half-formed thought. Priorities 1 and 2 tell us *what* we are scoring and *why*. Priority 3 tells us how to turn that score into a check size. The standard framework yields an ordinal ranking; funders need a cardinal allocation. If the return curve has thresholds or lumpiness, the "highest ranked" cause might not be the best recipient of the *next* dollar.

  **Feasibility:** Low to Moderate. This borders on empirical modeling. A philosopher can define the *conditions* under which local approximations fail (e.g., specifying the convexity required to break the ITN ranking), but validating whether specific causes meet those conditions requires data we are not buying. The output here should be a "warning protocol": a set of conditions under which the standard framework is known to misallocate capital.

  **The Unexciting Answer:** The conclusion that we should simply "use return curves where possible." Since everyone already agrees return curves are better than heuristics, this adds no value. The paper must specify *when* the heuristic is good enough to save the cost of building the curve.

  **Update Conditions:** Move down if Priority 1 establishes the framework is *only* for cause discovery (long-list) and not for final allocation (short-list). Move up if the foundation plans to make multi-year, large-scale commitments to single causes where lumpiness is likely.

  *(Note: I have excluded Portfolio Theory from the top 3. While critical, it is downstream of Allocation. You cannot optimize a portfolio of causes if you cannot determine the allocation to a single cause.)*

  ### 3. Critique of Proposed "Half-Formed Thoughts"

  You asked me to rank your three thoughts against the others or dismiss them. Here is the assessment:

  1.  **The Reading Worry (Status):** **Retain as Priority 1.** This is not merely a "reading"; it is a specification problem. However, be warned: the confusion here is thinking these are mutually exclusive. The framework is likely a heuristic *derived* from normative claims. The research task is not to pick one, but to formalize the bridge between them. If the bridge cannot be formalized, the heuristic is unjustified.
  2.  **The Granularity Worry:** **Retain as Priority 2.** This is a genuine defect, not a confusion. It is a version of the reference class problem in probability theory. However, it is less upstream than the Status question. If the framework is a heuristic, granularity is a precision trade-off. If it is normative, it is an ontological crisis. You must settle Status before solving Granularity.
  3.  **The Shape-of-Return Worry:** **Retain as Priority 3.** This is the most decision-relevant of your three thoughts. However, your framing suggests a binary choice (repair framework vs. replace with curves). The more valuable conceptual work is defining the *error bounds* of the framework. When does the local summary diverge from the global curve by enough to matter? That is a conceptual threshold question, not just a modeling one.

  ### 4. Items to Defund from the "Standard List"

  To make room for the above, I recommend explicitly declining to fund work on the following three standard objections. They are either settled, empirically contingent, or decision-irrelevant.

  1.  **Multiplicative vs. Additive Combination Rules:**
      *   **Reason:** This is algebraic fiddling without a settled theory of value. Whether factors multiply or add depends entirely on the underlying utility function and the independence of the variables. Commissioning a paper to argue for multiplication is premature until we settle Priority 1 (Status) and Priority 3 (Return Curves). If returns are logarithmic, multiplication emerges naturally; if linear, addition might suffice. Don't fund the symptom; fund the model.
  2.  **Units of Measurement and Trade-offs:**
      *   **Reason:** This is largely a category error. The "unit" is expected utility (or a proxy thereof). Complaints that "Importance is in lives saved, Tractability is in probability, how do you multiply?" misunderstand that these are parameters feeding into a common denominator (EV). A philosopher cannot solve this conceptually; it requires the empirical work of building the metrics, which you are not funding in this tranche.
  3.  **Double-Counting (Tractability vs. Neglectedness):**
      *   **Reason:** This is effectively settled in the literature on marginal returns. Tractability is the slope of the return curve; Neglectedness is the current position on the x-axis. They are distinct coordinates. While users often conflate them in practice, a conceptual paper clarifying the definition adds little value compared to a training guideline. The error is user competence, not framework ambiguity.

  ### 5. Conclusion

  This agenda prioritizes *structural integrity* over *precision*. We are not trying to make the framework more accurate (which requires empirical data); we are trying to ensure it is coherent enough to be used without self-contradiction.

  By settling the **Status** first, we know whether we are building a map or a compass. By settling **Granularity** second, we ensure we are pointing at territories that exist. By settling **Allocation** third, we ensure the compass tells us how far to walk.

  If the postdoc concludes that the framework fails Priority 1 (i.e., it cannot be coherently interpreted as either normative or heuristic), that is a high-value negative result. It saves the foundation from building empirical reports on a broken foundation. That is the specific value of conceptual work: it licenses stopping.
