answer: |-
  Section 1: Agreed Claims

  1. Any answer must fix the denominator (which beings have standing in the population) before any aggregation or any restraint rule can be applied, and this is a substantive moral choice rather than a technical one. (Denies: Standing is pre-political or obvious.)
  2. Silence is an action, because when the system abstains the outcome defaults to whatever the off-line status quo would have produced, with its own distribution of winners. (Denies: Abstention is neutral.)
  3. The granularity at which values are individuated can change what aggregation recommends, so that anyone specifying values for a system is in a position to gerrymander the outcome by how finely they describe them. (Denies: Value description is neutral.)
  4. Neutralism's filter for which disagreements count as reasonable is itself a substantive choice with the same structure as Aggregationism's choice of weights. (Denies: Neutrality is procedure-only.)
  5. Both camps need a way to compare lives across persons, whether as cardinal welfare (measurable well-being units) or as a notion of reasonableness, and that this shared need is the hard core neither has solved. (Denies: Comparisons are unnecessary.)
  6. Majority vote is insufficient; both camps reject simple counting of preferences as the sole arbiter of value. (Denies: Majoritarianism.)
  7. Serving the payor is insufficient; both camps reject financial contribution as the sole source of standing. (Denies: Consumer sovereignty.)
  8. Third parties matter; serving the individual user does not settle obligations when non-users are affected. (Denies: User-only alignment.)

  Section 2: Disagreements Table

  | Crux | Aggregationist Formulation | Neutralist Formulation | Test Case | Agg Prediction | Neut Prediction | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Neutrality as Doctrine** | The rule to avoid comprehensive doctrines (views on the good life) is itself a comprehensive doctrine. | The rule to avoid comprehensive doctrines is a meta-rule required for cooperation, not a view on the good life. | **Sex-Ed:** Public school asks for curriculum. | System must pick the curriculum maximizing welfare. | System must map views without ranking them. | Substantive |
  | **Heckler's Veto** | Restraint hands a veto to whoever insists loudest that a question is contested. | Restraint prevents tyranny by ensuring no single view dominates contested space. | **Hospital:** Model prioritizes scarce treatment. | System allocates based on survival/utility weights. | System defers to hospital board procedure. | Substantive |
  | **Description Dependence** | Description dependence is a theoretical curiosity solvable by standardizing inputs. | Description dependence is the normal case; framing dictates moral outcome. | **Climate/Child:** User asks about having a child. | System calculates carbon cost vs. parental joy. | System outlines arguments without recommending. | Substantive |
  | **Denominator Scope** | Future people, digital minds, and animals belong in the denominator if they have welfare. | Only those capable of participating in justification belong in the denominator. | **Climate/Child:** (See above) | Future generations weighted heavily. | Future generations represented by current guardians. | Substantive |
  | **Downstream Influence** | Abstention concentrates power in those who control the status quo. | Abstention disperses power by preventing algorithmic imposition. | **Sex-Ed:** (See above) | Status quo biases remain unchallenged. | Local democratic processes remain intact. | Empirical |

  Section 3: Verbal and Substantive

  Much of the dispute appears verbal when camps describe the same mechanism using different vocabularies. When Aggregationists speak of "weights" and Neutralists speak of "reasonableness filters," they often describe the same mathematical operation: excluding certain inputs from the final calculation. If "reasonableness" is defined strictly as "inputs assigned non-zero weight," the camps converge on the structure of the system. However, the dispute becomes substantive when asking who authorizes the filter. Aggregationists require an external moral truth to set weights; Neutralists require a procedural consensus to set reasonableness.

  The camps converge under the condition that the population is homogeneous and values are uncontested. In such a scenario, the social welfare functional (a rule for ranking outcomes based on individual utilities) and the public justification rule (a rule for ensuring acceptability to all) yield identical outputs. They separate when values conflict. The residual disagreement is not about the goal of fairness, but about the source of authority: does fairness come from maximizing the sum of well-being, or from ensuring no one is subject to rules they cannot reasonably accept? This is not a verbal dispute; it is a conflict between consequentialist and deontological foundations.

  Section 4: What Each Camp Would Count as Losing

  For the Aggregationist, losing means proving that interpersonal comparison of welfare is impossible in principle, rendering the social welfare functional undefined. If utility cannot be measured or compared across persons, the aggregation rule has no input. The Neutralist currently has no route to producing this proof, as Aggregationists can always posit a theoretical scale.

  For the Neutralist, losing means demonstrating that the restraint regime systematically produces worse outcomes than explicit aggregation for the very people neutrality aims to protect. If abstention consistently empowers oppressive status quos more than algorithmic weighting would, the moral basis for restraint collapses. The Aggregationist can produce this evidence via empirical simulation of downstream influence, though Neutralists may dispute the metrics of "worse."
