answer: |-
  Take a heavy-duty polycarbonate mixing bowl, which is virtually unbreakable by hand strikes due to its flexible molecular structure, and have a school engineering club embed a small pyrotechnic squib inside the rim connected to a vibration sensor calibrated to the force of a hammer strike. When you strike the bowl to test its fragility, the sensor detects the impact and detonates the squib, causing the bowl to crack and shatter instantly just like ordinary glass. The bowl breaks exactly as a fragile object would, but only because of the external rig, not because the material itself lacks the structural integrity to withstand the blow, meaning there is no hidden brittle basis to remove and nothing blocking a manifestation that was already there.

  The plain conditional analysis says the bowl is fragile because the conditional "if struck, it would break" is true, yielding a false positive. The usual fix (requiring an intrinsic basis retained through the stimulus) says the bowl is not fragile because the breaking is caused by the extrinsic rig, not by any intrinsic structural basis of the polycarbonate retained through the strike, yielding the correct verdict. The single feature doing the work is the extrinsic causal mechanism (the rig) that forces the manifestation independently of the object's material properties. If you delete that feature, the bowl survives the strike, the conditional becomes false, and the plain analysis correctly identifies it as non-fragile. A defender of the plain analysis would try to wriggle out by arguing that the rig, once attached, counts as part of the object's current intrinsic state, or by biting the bullet and claiming our intuition is wrong—that "fragile" just means "breaks when struck" regardless of whether the cause is internal structure or external trickery.
