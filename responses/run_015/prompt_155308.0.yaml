  1. This protocol presupposes a competence-performance distinction where the true folk concept of intentionality is uniform, treating divergent responses as performance errors akin to measurement noise. It implies that scientific measurement aims to isolate a singular cognitive mechanism rather than map the full distribution of lay judgments.
  2. The underlying view posits that moral valence universally penetrates intentionality attributions, creating a conceptual uniformity where the asymmetry is the rule rather than a contingent tendency. Consequently, any judgment separating moral outcome from intentional status is viewed as a failure to apply the concept correctly rather than a valid alternative understanding.
  3. This exclusionary stance is not strictly required by the data but is compatible with a universalist framework that prioritizes identifying core cognitive structures over documenting variation. Alternative methodologies could treat the asymmetry as a probabilistic tendency rather than a definitional boundary without invalidating the experimental approach.
  4. By filtering out divergent judgments, the practice risks constructing the very intuitions it claims to describe, thereby undermining the field's commitment to mapping pre-theoretical folk psychology. This creates a tension where the methodology enforces a theoretical norm upon the data rather than extracting norms purely from participant responses.
  5. If deviations were treated as genuine conceptual variants, study designs would need to shift from mean-comparison models to clustering analyses that identify distinct subpopulations holding different concepts of intentionality. Researchers would also need to incorporate qualitative follow-ups to understand the reasoning behind non-asymmetric judgments rather than discarding them as errors.
