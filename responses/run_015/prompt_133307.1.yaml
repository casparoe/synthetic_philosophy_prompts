answer: |-
  ### The Aubry Laws and the Keynesian Horizon: A Case Study in Post-Scarcity Politics

  John Maynard Keynes's 1930 essay *Economic Possibilities for our Grandchildren* posits that technological progress would solve the "economic problem" of scarcity within a century, allowing humanity to retreat to a 15-hour workweek devoted to the arts of life. The French Aubry laws (1998–2000), which mandated a reduction of the legal workweek from 39 to 35 hours, offer a critical real-world stress test for this vision. While the legislation technically aligns with Keynes's prediction of reduced labor time, the political friction surrounding its implementation and subsequent erosion reveals significant gaps in Keynes's psychological and geopolitical modeling.

  #### 1. Absolute vs. Relative Needs: Mapping the Political Debate
  Keynes distinguishes between **absolute needs** (those we feel whatever the situation of our fellow human beings) and **relative needs** (those which make us feel superior to our fellows). He argues that absolute needs are satiable, while relative needs are insatiable, driving endless economic effort.

  In the debate over the Aubry laws, supporters (primarily the Socialist government and labor unions) framed the reduction in hours through the lens of **absolute human flourishing**. They argued that productivity gains had sufficiently solved the material subsistence problem, and the marginal utility of additional income was lower than the utility of leisure, family time, and cultural engagement. This aligns with Keynes's hope that society would prioritize "living" over "earning."

  Conversely, opponents (business federations like MEDEF and center-right politicians) framed the issue through **relative needs**, specifically manifested as national competitiveness. They argued that in a globalized market, labor costs are a determinant of market share. Reducing hours without proportional wage cuts was treated not as a liberation from scarcity, but as a self-inflicted wound in a zero-sum game against other economies (particularly Germany and emerging Asian markets). Here, the "need" was not for survival, but for maintaining relative economic standing. The debate proved that even when absolute needs are met, the anxiety of relative positioning prevents the adoption of leisure.

  #### 2. The 2000s Relaxation and the Love of Accumulation
  Keynes warned that the "love of money" was a moral habit inherited from a history of scarcity, which would persist even after scarcity was solved. The trajectory of the 35-hour week in the 2000s validates this pessimism. Following the change of government in 2002, and notably through the Fillon reforms (2003–2005), the strictures of the Aubry laws were relaxed. Overtime was incentivized, and flexibility clauses allowed companies to bypass the 35-hour cap.

  This reversal illustrates Keynes's concern that societies remain trapped by **purposiveness**. Rather than accepting productivity gains as time dividends, the French political consensus shifted toward converting those gains back into GDP growth and corporate margin protection. The "economic problem" was technically solvable (France was wealthy enough to sustain the reduction), but the psychological commitment to accumulation overrode the opportunity for leisure. The state, acting as the agent of the collective, chose to remain in the realm of means (production) rather than ends (leisure).

  #### 3. Silences in the Keynesian Model
  Keynes's essay is remarkably silent on three structural realities exposed by the Aubry episode:

  *   **Employer Backlash and Power Dynamics:** Keynes assumes a smooth transition where capital accepts lower utilization of labor in exchange for social stability. He does not anticipate the fierce resistance from capital owners who view labor time as a direct input for profit maximization. The Aubry laws triggered capital flight threats and investment strikes, a power dynamic Keynes underestimates in his 1930 optimism.
  *   **Cross-Border Competitive Dynamics:** Keynes writes as if "mankind" solves the economic problem together. He lacks a theory of **asynchronous post-scarcity**. If France reduces hours but China or the US does not, France risks deindustrialization. Keynes's model is effectively closed-economy; it does not account for the penalty a single nation pays for acting unilaterally on post-scarcity logic.
  *   **Cultural Refusal:** Keynes assumes that once freed from toil, people will naturally cultivate leisure. The Aubry experience showed that many workers preferred overtime pay to free time, and that work serves as a primary source of social identity. The "15-hour civilization" was refused not just by employers, but by a culture that equates idleness with worthlessness.

  #### 4. The Competitive Divergence Problem
  The Aubry episode reveals what can be termed the **competitive divergence problem**. In a globalized economy, productivity gains present a binary choice: they can be harvested as **National Leisure** (reduced hours) or **International Competitive Standing** (lower unit costs/higher output).

  Keynes's framework is individualist; he imagines the choice is up to the worker. However, the Aubry laws demonstrate that this choice is structurally constrained by the international system. If Nation A chooses Leisure and Nation B chooses Standing, Nation B captures market share, potentially undermining Nation A's ability to fund its social model. This creates a Prisoner's Dilemma where the rational choice for every nation is to continue maximizing output, even if the collective global good would be maximized by universal leisure.

  Keynes fails to address this divergence because he views the economic problem as a technical hurdle to be cleared by humanity as a whole. He does not foresee a world where post-scarcity is a competitive disadvantage. The relaxation of the 35-hour week was essentially a concession to this divergence; to maintain relative standing, absolute leisure had to be sacrificed.

  #### Conclusion
  The Aubry laws represent a partial, frustrated realization of Keynes's vision. They acknowledged that scarcity was technically solved, but the political and economic superstructure remained built on the logic of scarcity. The episode suggests that Keynes was correct about the *capacity* for post-scarcity but naive about the *incentives* to achieve it. Without a mechanism to synchronize leisure across borders or decouple national welfare from competitive market standing, the "love of accumulation" will continue to enforce long work hours, regardless of technological abundance.

