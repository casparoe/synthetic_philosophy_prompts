answer: |-
  ### I. A Menu of Readings: From Description to Moral Thesis

  The slogan "Importance, Tractability, Neglectedness" (ITN) functions differently depending on the philosophical weight assigned to it. Below are four distinct readings, ordered by the strength of the claim they advance.

  | Reading | Characterization | Trivial? | Defensible? | Supports Dismissing High-Importance/Low-Tractability Causes? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Descriptive Regularity** | A psychological observation that donors *tend* to cluster around causes that appear important, solvable, and underfunded. | **Yes.** It is a tautology of market behavior: capital seeks return (importance/tractability) and alpha (neglectedness). | **Yes.** Empirically observable in philanthropic flows. | **No.** Descriptive claims cannot justify normative dismissal. It explains *why* a cause is ignored, not *why it should be*. |
  | **2. Heuristic for Bounded Rationality** | A cognitive shortcut for agents facing deep uncertainty. When expected value calculations are impossible, ITN serves as a filter to reduce search costs and avoid "money pits." | **No.** It is a methodological claim about decision-making under uncertainty. | **Yes.** Defensible as a "satisficing" strategy when information is costly and models are fragile. | **Tentatively.** It supports *temporarily* setting a cause aside to investigate higher-confidence options, but implies revisiting the cause if the heuristic fails or information improves. |
  | **3. Normative Aggregation Rule** | A quasi-mathematical formula where priority $\approx$ Importance $\times$ Tractability $\times$ Neglectedness. It treats the three factors as independent variables determining marginal expected value. | **No.** It posits a specific structural relationship between the variables. | **Contingent.** Defensible only if "Tractability" and "Neglectedness" are measured *marginally* (not averages) and if the variables are roughly independent (often false). | **Yes.** If the product of the three scores is lower than an alternative, the framework dictates shifting resources. However, it is highly sensitive to measurement error in the inputs. |
  | **4. Substantive Moral Thesis** | A deontic claim that moral obligation is *constituted* by ITN scores. A cause with low tractability imposes no duty to act, regardless of the stakes (Importance). | **No.** This is a strong ethical claim about the nature of obligation. | **No.** It conflates epistemic constraints (we can't solve it) with moral bounds (we need not try). It risks "moral cowardice" in the face of hard problems. | **Yes.** This is the "argumentative stopping-point." It categorically rules out causes that are important but currently intractable, treating difficulty as a moral exemption. |

  ### II. The Dynamic Tension: Success as Self-Undermining

  The static formulation of ITN obscures a feedback loop: **Success reduces Neglectedness and often reduces Tractability.**

  1.  **The Loop:** If a cause is highly neglected, it attracts funding. As funding increases, the "Neglectedness" score drops. Simultaneously, if the intervention solves the "low-hanging fruit," the marginal "Tractability" (cost-effectiveness of the next dollar) declines due to diminishing returns.
  2.  **The Paradox:** A cause that is successfully addressed becomes *less* prioritizable by the ITN framework. If the framework is applied dynamically, it dictates withdrawing support precisely as the cause begins to yield results. This creates a "feast or famine" dynamic where causes are abandoned before completion, or conversely, where causes are never started because their *current* tractability is low (due to lack of infrastructure that funding itself would build).

  **Do the Readings Resolve This?**

  *   **Readings 1 & 2 (Descriptive/Heuristic):** These do not resolve the loop; they merely describe it. The heuristic reading suggests re-evaluating the portfolio, but offers no principle for *completion*.
  *   **Reading 3 (Aggregation Rule):** Technically, this reading *anticipates* the loop if "Tractability" and "Neglectedness" are correctly defined as **marginal** rather than average. The framework dictates moving to the next cause once marginal returns diminish. However, it fails to account for **increasing returns to scale** (e.g., building a research field requires a critical mass of funding before tractability spikes). If tractability is low *now* but would be high *after* initial investment, the static ITN calculation forbids the seed funding required to unlock the value.
  *   **Reading 4 (Moral Thesis):** This reading is most vulnerable. If obligation is tied to current tractability, we are morally forbidden from investing in infrastructure that would *make* a problem tractable.

  **The Need for External Principles:**

  None of the internal readings resolve the tension regarding *initial* investment in low-tractability/high-importance causes. Resolving this requires importing external principles:

  *   **Option Value:** We fund a currently intractable cause to keep the option open for future technological or social shifts that might raise tractability.
  *   **Diversification/Robustness:** We fund causes with lower ITN scores to hedge against model error in our ITN assessments (e.g., if our tractability estimate for AI is wrong, we still want Climate adaptation).
  *   **Completion Goods:** Some goods are binary (e.g., eradicating a disease). The ITN framework, focused on marginal dollars, struggles to justify the "last mile" where tractability is lowest but completion is most vital.

  ### III. Application: Climate Adaptation vs. AI Safety

  When the ITN slogan is invoked to reject **Climate Adaptation** in favor of **AI Safety**, the reading most plausibly being invoked is **Reading 3 (Normative Aggregation)**, but it operates with a hidden shift toward **Reading 4 (Moral Thesis)**.

  **1. The Invocation:**
  Proponents argue that AI Safety has higher *Importance* (existential risk vs. severe suffering), higher *Neglectedness* (historically), and sufficient *Tractability* (theoretical research). Climate Adaptation is dismissed because, while *Important*, it is less *Neglected* (billions in funding) and arguably less *Tractable* per marginal dollar (complex geopolitical coordination).

  **2. Internal Coherence vs. Smuggled Premises:**
  Strictly speaking, the ITN framework is **internally coherent** here *if* one accepts the input values. If AI Safety truly has higher marginal expected value per dollar, ITN dictates funding it over Climate Adaptation.

  However, the invocation often smuggles in two unstated premises that are not intrinsic to the ITN acronym but are necessary to make the calculation work:

  *   **The Definition of Importance (Longtermism):** For AI Safety to score higher on "Importance" than Climate Adaptation, "Importance" must be weighted by the *value of the far future* (potential generations). If Importance is measured in near-term QALYs (Quality-Adjusted Life Years), Climate Adaptation likely wins. The ITN framework itself is neutral on this; the "Longtermist" weighting is an external moral premise plugged into the "Importance" variable.
  *   **Irreversibility as a Tractability Multiplier:** The dismissal of Climate Adaptation often relies on the claim that AI risk is *irreversible* (extinction), whereas Climate damage is (partially) reversible or adaptable. This is not a claim about Tractability in the sense of "cost per unit of progress," but about the *value of preventing loss*. Treating irreversibility as a component of Tractability or Importance is a substantive ethical claim about the asymmetry of loss, not a neutral feature of the ITN framework.

  **Conclusion:**
  The rejection of Climate Adaptation via ITN is only coherent if one accepts a Longtermist definition of Importance and treats existential risk as a dominant variable. Without these smuggled premises, the "Neglectedness" of AI Safety (which is decreasing rapidly) might not outweigh the sheer scale of Climate Importance. Furthermore, if AI Safety is currently low-tractability (we don't know how to align AGI), a strict Reading 4 (Moral Thesis) would paradoxically forbid working on it until it becomes easier—suggesting that proponents are actually relying on **Reading 2 (Heuristic)** combined with **Option Value** (we must work on it now *because* it is hard and irreversible), even while using the language of Reading 3 to dismiss other causes.
