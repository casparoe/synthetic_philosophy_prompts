  ### 3. The Discriminative Test

  To cleanly tell **Rule A (Segmentation)** apart from **Rule B (Constrained Total)**, you need a scenario where the Kelly fraction on the *total* bankroll does **not** hit the survival constraint. In the current case, the constraint *binds* (Kelly wants $80k, Safety allows $60k), which is why Rule B and C look like "Boundary Maximization."

  **The Test Case:**
  > "Tomas has $200k liquid. He has a non-negotiable obligation of **$50k** in 18 months (Floor). The same 70% even-money one-shot offer appears."

  *   **Rule A (Segmentation) Prediction:**
      *   Effective Bankroll = $200k - $50k = $150k.
      *   Bet = 40% of $150k = **$60,000**.
  *   **Rule B (Constrained Total) Prediction:**
      *   Total Bankroll = $200k.
      *   Unconstrained Kelly = 40% of $200k = $80,000.
      *   Safety Limit = $200k - $50k = $150,000.
      *   Since $80k < $150k, the constraint does *not* bind. He follows standard Kelly.
      *   Bet = **$80,000**.

  **Why this works:**
  This isolates whether he treats the floor as **deducting from bankroll** (Rule A) or merely as a **guardrail** (Rule B). If he bets $60k, he segments liabilities. If he bets $80k, he optimizes globally and only respects the floor as a hard stop. Given his history with "background risk" (Case 5), I expect he would bet the lower $60k, confirming Rule A.
