      *   *Crucial Point:* The prompt highlights that *different behaviors* imply *different computational descriptions*. If I explain the thermostat's clicking, it's a bimetallic strip computation. If I explain the room's warmth, it's a control loop. If I explain the *system's* survival, maybe it's an agent. The "system" boundaries are also fluid. I should mention system individuation.

  8.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "interest-relative" (bad for morality) and "explanatory relativism" (okay for science) is sharp. (Self-correction: Make sure to emphasize that if moral status depends on the computation, and the computation depends on the explanation, and the explanation depends on interest, then moral status depends on interest.)

