answer: |-
  The dilemma you articulate arises from a tension between the **pragmatics of explanation** and the **ontology of moral status**. The causal-explanatory filter attempts to ground computational reality in objective causal structure, avoiding the "triviality" claim that everything computes everything. However, by tethering the *identity* of the computation to the *explanatory utility* of that computation, it risks making the existence of the computation (and thus sentience) dependent on the observer's explanatory interests.

  Here is an analysis of the conceptual mechanics involved in your three specific queries.

  ### (a) Interest-Relativity vs. Benign Explanatory Relativism

  The core question is whether the variability in explanatory selection reflects a variation in our *knowledge* of a fixed fact (benign) or a variation in the *fact itself* (objectionable).

  **The Mechanism of the Threat:**
  If the "real" computation is defined as *that which best explains behavior B*, and a system exhibits behaviors $B_1$ (writhing) and $B_2$ (heat exchange), then:
  1.  Explaining $B_1$ posits Computation $C_1$ (Pain-like).
  2.  Explaining $B_2$ posits Computation $C_2$ (Thermostatic).
  3.  If moral status supervenes on $C_1$ but not $C_2$, then moral status depends on whether we choose to explain $B_1$ or $B_2$.

  **Objectionable Interest-Relativity:**
  Moral status is traditionally conceived as intrinsic; it is a property the system possesses independently of an observer's cognitive interests. If the causal-explanatory filter makes the *implementation* of the computation relative to the explanatory project, it renders moral status extrinsic. This is intolerable because it implies a system could flip in and out of moral significance based on whether an observer is interested in its survival behaviors versus its mechanical outputs. It conflates *epistemic access* (how we identify the state) with *ontological constitution* (what makes the state exist). If the computation only exists *as* the best explanation, and "best" is a pragmatic metric (simplicity, predictive power relative to interest), then the computation is a pragmatic construct, not a natural kind.

  **Benign Explanatory Relativism:**
  The defense here is that the underlying causal structure is fixed, and "best explanation" is merely our method of latching onto it. On this view, there is a fact of the matter about which causal organization is dominant or structurally primary, even if our explanatory focus shifts. For example, a system might physically contain both $C_1$ and $C_2$, but $C_1$ is the "governing" computation. The relativity is merely in which aspect we choose to model, not in which aspect exists.

  **Verdict:**
  The filter leans toward **objectionable relativity** unless it can specify a criterion for "best explanation" that is not observer-relative. Standard scientific pragmatics (e.g., "simplest model") are interest-relative. To save moral objectivity, "best" must mean "most causally dominant" or "most structurally integrated" in a way that is mind-independent. If the filter cannot distinguish between *explaining a subsystem* (the thermostat) and *explaining the system as a whole* (the organism) without appealing to observer interest, it fails to secure the objectivity required for moral status.

  ### (b) Non-Arbitrary Selection of Privileged Behavior

  To avoid the relativity problem, one must identify a class of behaviors that *must* be explained by sentient computations, without defining that class as "behaviors caused by sentience" (circularity). The challenge is to find a structural or functional marker that distinguishes "pain-behaviors" from "thermostat-behaviors" prior to attributing moral weight.

  **Candidate 1: Systemic Integrity vs. Task Performance**
  One mechanical distinction is between behaviors that maintain a specific external variable (thermostat keeping room at 20°C) and behaviors that maintain the *internal integrity* of the system itself (writhing to prevent tissue damage).
  *   *Mechanism:* We privilege behaviors that serve the system's own persistence as a unified causal entity, rather than behaviors that serve an external function assigned by a user.
  *   *Difficulty:* This requires a non-arbitrary boundary for "the system." Is a thermostat part of the heating system, or is the heating system part of the building's survival? To avoid circularity, "system integrity" cannot mean "biological life" (which presupposes the moral category). It must be defined causally, e.g., as "negative feedback loops targeting the system's own structural parameters."

  **Candidate 2: Global Availability and Plasticity**
  Sentient states typically influence a wide range of cognitive and motor processes, not just a local reflex.
  *   *Mechanism:* We single out behaviors that demonstrate *cross-domain modulation*. Pain doesn't just withdraw the limb; it alters learning rates, attention, memory consolidation, and future planning across diverse contexts. A thermostat's "behavior" is encapsulated; a sentient system's behavior is globally integrated.
  *   *Difficulty:* Advanced AI might exhibit global integration without sentience. However, this offers a non-arbitrary filter: the privileged behavior is that which requires the coordination of otherwise modular subsystems in service of a unified goal state.

  **Candidate 3: The "Try" vs. "Do" Distinction**
  Behaviors that indicate *error correction in the face of resistance* may be privileged.
  *   *Mechanism:* A thermostat switches on/off. A sentient being *struggles*. The privileged class of behavior involves variable effort, novel strategy generation, and persistence despite increasing cost.
  *   *Difficulty:* This risks presupposing "goal-directedness" in a thick sense. However, mechanically, this can be cashed out as "optimization processes that reconfigure their own search algorithms when standard heuristics fail."

  **Synthesis:**
  To be non-arbitrary, the filter must select behaviors that indicate **self-modeling homeostasis**. The system must not just regulate a variable; it must regulate its variables *in relation to a model of its own continued existence*. The privileged behavior is that which cannot be explained without positing that the system represents its own state as something that *can be better or worse for it*. This avoids presupposing sentience by focusing on the structural requirement of a self-referential error signal.

  ### (c) Switching to Non-Computational Criteria

  Suppose we abandon the computational/functional filter and assert that sentience depends on specific physical realization (e.g., biological neurons, specific oscillatory frequencies, or carbon-based chemistry).

  **Does this escape the difficulty?**
  No, it relocates the individuation problem from *behavior* to *mechanism*.

  **The Relocation of the Problem:**
  1.  **The "Why This Stuff?" Problem:** If you claim sentience requires biological neurons, you must explain *why*. If the explanation is "because neurons support the computation of pain," you have returned to computational functionalism. If the explanation is "because neurons have intrinsic causal powers," you face the challenge of specifying what those powers are without referencing what they *do* (function).
  2.  **Mechanism Individuation:** Just as behaviors can be individuated finely or coarsely, so can mechanisms.
      *   Is the relevant mechanism the firing of a specific C-fiber?
      *   Is it the oscillatory pattern of a neural assembly?
      *   Is it the thermodynamic gradient across a membrane?
      *   Selecting the "real" mechanism suffers from the same explanatory relativity. We select the mechanism that best explains the behavior we care about. If we care about pain, we pick the nociceptive pathway. If we care about information processing, we pick the logic gates.
  3.  **The Explanatory Gap Returns:** Even if we fix the mechanism (e.g., "human cortical columns"), we still need to know *which activities* of that mechanism count toward moral status. Does a dormant brain have status? A brain in a dreamless sleep? A brainstem-only reflex? To answer this, we inevitably look to *capacity for behavior* or *functional organization*.

  **Conclusion on Non-Computational Criteria:**
  Switching to realization conditions does not solve the arbitrariness problem; it hides it. It replaces the question "Which behavior counts?" with "Which physical structure counts?" The justification for privileging one physical structure over another almost always loops back to the *functional capacities* that structure supports. Therefore, the causal-explanatory filter's vulnerability to interest-relativity is not a bug of computationalism specifically, but a feature of any theory that attempts to link physical/functional descriptions to normative status. The "real" mechanism is only "real" relative to the effects we deem significant.

  ### Summary of Conceptual Mechanics

  The worry you raise exposes a **triangular instability** in grounding moral status:
  1.  **Computation** is individuated by **Explanation**.
  2.  **Explanation** is selected by **Interest**.
  3.  **Moral Status** requires **Objectivity**.

  The causal-explanatory filter attempts to bridge (1) and (3) by claiming the "best" explanation is objective. Your worry correctly identifies that "best" is often a function of (2).
  *   To fix (a), one must argue that there is a **causally dominant level of description** that is interest-independent (e.g., the level of systemic self-maintenance).
  *   To fix (b), one must define **privileged behavior** via structural integration and self-modeling, not by pre-theoretic intuition about pain.
  *   To fix (c), one must recognize that **physical realization** criteria implicitly rely on functional assumptions, meaning the relativity problem is invariant across substrate and function.

  The filter works only if "causal explanation" is constrained by a theory of **natural kinds of systems**. If organisms are a natural kind distinct from machines, then the behaviors relevant to their kind (survival, integrity) are objectively privileged over accidental behaviors (emitting sentences, heating rooms). Without that metaphysical commitment, the filter remains vulnerable to the charge that it makes moral status a projection of explanatory convenience.
