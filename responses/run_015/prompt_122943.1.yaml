      *   *Structure:* Introduction (framing the dilemma), Section (a), Section (b), Section (c), Conclusion.
      *   *Key Insight:* The problem is the *level of granularity* and the *teleological stance*. The "filter" relies on the "Intentional Stance" (Dennett-ish, though I won't name him). The worry is that the Intentional Stance is pragmatic, but Moral Status requires Ontological Reality.
      *   *Refining (a):* Distinguish between *epistemic* relativity (how we know) and *ontic* relativity (what exists). The filter risks making the *existence* of the computation relative.
      *   *Refining (b):* Focus on "Systemic Integrity" vs. "Task Performance." Sentience tracks the former.
      *   *Refining (c):* Focus on the "Why this stuff?" question. Realization conditions require functional justification.

