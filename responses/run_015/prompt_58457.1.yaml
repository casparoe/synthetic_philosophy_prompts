      *   *Move 2:* Jon's "rarity" defense. This is a standard counter (Kamtekar). The analogy (piano) is strong. Virtue ethics is normative (how we *should* be), not descriptive (how we *are*). *Verdict:* Jon wins this one. Maya conflates "people aren't virtuous" with "virtue isn't real."
      *   *Move 3:* Maya's "consistency" attack. This is the core of the Situationist Challenge (Gilbert Harman/John Doris). If traits exist, they should predict behavior across situations. The "local traits" concession does weaken the Aristotelian ideal of unity of virtues. *Verdict:* Maya has the stronger philosophical pressure here. Jon's defense needs more nuance than just "rarity."
