answer: |-
  First off, I feel your pain. That is a classic philosophy department hallway fight (the "Situationist Challenge to Virtue Ethics"), and it is notoriously dense. Your roommates basically reenacted a debate that has been raging in academic journals since the late 90s (think philosophers like Gilbert Harman and John Doris vs. Nancy Snow and Ragip Kamtekar).

  Here is the breakdown of the four moves, who won each round, the overall verdict, and what they both missed.

  ### Round 1: The Empirical Attack
  **Maya's Move:** She cites the "Situationist" experiments (Good Samaritan, Dime in Phone Booth, Bystander Effect) to argue that trivial situational factors override character, making virtue a myth.
  **Jon's Counter:** (Waited for Round 2).

  **Winner:** **Maya (on the evidence), but she overreaches on the conclusion.**
  **Why:** Maya is right that the data is robust. Social psychology *does* show that situational variables (being late, smelling cookies, crowd size) predict behavior better than personality tests do. She lands a heavy punch here because she forces Jon to admit that the "common sense" view of character (that most people have strong, consistent virtues) is empirically false.
  **Caveat:** Her leap to "cultivating virtue is like horoscopes" is too strong. Just because *current* behavior is situational doesn't mean *training* behavior is impossible. But as an opening strike, her use of the data is devastating to the "folk psychology" version of virtue.

  ### Round 2: The "Rarity" Defense
  **Jon's Move:** Virtue ethics is normative (how we *should* be), not descriptive (how we *are*). Virtue is rare and hard (like playing piano), so finding that average people lack it doesn't disprove the concept.
  **Maya's Counter:** (Waited for Round 3).

  **Winner:** **Jon.**
  **Why:** This is the strongest logical shield Jon has. Maya committed the "is-ought fallacy." Virtue ethics (especially Aristotle's) explicitly states that the *phronimos* (the practically wise person) is rare. Showing that most 20-year-olds are flaky doesn't refute the ideal, any more than showing most people can't do a backflip refutes the physics of gymnastics. Jon successfully shifts the debate from "Do people have virtue?" to "Is the concept of virtue coherent?"

  ### Round 3: The Consistency Challenge
  **Maya's Move:** Even if virtue is rare, the "virtuous few" should show consistency. Data shows they don't. If you retreat to "local traits" (honest-with-friends), you've given up on virtue explaining behavior across different parts of life.
  **Jon's Counter:** (Waited for Round 4).

  **Winner:** **Maya.**
  **Why:** This is the hardest hit to Jon's position. Traditional virtue ethics relies on the "Unity of Virtues"—the idea that if you are truly courageous, you are also honest and temperate. If Jon concedes that virtues are just "local" (I'm honest at work but not on taxes), he risks turning virtue into a thousand tiny fragments that no longer explain the *person*, only the *context*. Maya is right that if traits only predict behavior in hyper-specific scenarios, they lose the explanatory power virtue ethicists claim they have.

  ### Round 4: The "Skill" & "Tu Quoque" Defense
  **Jon's Move:** Virtue isn't robotic consistency; it's sensitivity to reasons (acting differently in an ER vs. a stroll). Also, situationists explain obedience via "fear of authority," which is itself a character-like disposition.
  **Maya's Counter:** (End of argument).

  **Winner:** **Jon.**
  **Why:** Jon recovers beautifully here.
  1.  **Reframing Virtue:** He correctly identifies virtue as a *skill* (practical wisdom/*phronesis*), not a reflex. A virtuous person *should* act differently when rushing to an ER than on a stroll; that isn't inconsistency, it's appropriateness.
  2.  **The Trap:** He catches Maya in a contradiction. To explain why people obey in the Milgram experiments, situationists say "they have a disposition to obey authority." But a disposition to obey *is* a trait! Maya can't use traits to explain why people fail virtue tests while claiming traits don't exist.

  ---

  ### Overall Verdict: Who is more right?
  **Jon is more right overall.**

  Here is why: Maya wins on the **psychology** (humans are flakier than we think), but Jon wins on the **philosophy** (virtue ethics survives the critique).

  Maya's conclusion—that we should give up on virtue cultivation because people are situationally sensitive—is nihilistic and self-defeating. If behavior is driven by situations, the virtuous response is to *cultivate the skill of managing situations* and *training our reactions to them*. Jon successfully defends the idea that virtue is a normative goal (a project of becoming) rather than a descriptive label (a box you check). The theory doesn't break; it just has to account for the fact that the raw material (human psychology) is fragile.

  ### What Both of Them Are Missing
  They are stuck in a "Person vs. Situation" dichotomy. Here is the synthesis they missed:

  **1. Social Moral Ecology (The Missing Link)**
  Both treat the "situation" as random noise (smelling cookies, finding a dime). But virtues are cultivated *within* social structures. The missing piece is that we shouldn't just try to make people "stronger" internally (Jon); we should design environments that make virtue easier (Maya's insight). A virtuous society isn't just full of saints; it's full of systems that don't rely on saints to function.

  **2. Virtue as a Trajectory, Not a State**
  Maya treats virtue as a fixed state you either have or don't. Jon treats it as a rare achievement. Both miss that virtue is a **practice**. The fact that behavior is situational is actually an *argument for* virtue ethics, not against it. Because we are situationally sensitive, we *need* the habituation Jon talks about to override those impulses.

  **3. The "Weakness of Will" Factor**
  Neither brought up *akrasia* (weakness of will). The experiments Maya cites often show people knowing the right thing but failing to do it due to pressure. That isn't proof that virtue is fake; it's proof that virtue is the struggle against those exact pressures.

  **TL;DR for your roommates:**
  Maya is right that we are all more fragile than we think. Jon is right that we shouldn't give up on trying to be better because of it. The answer isn't "virtue is dead," it's "virtue is harder than we thought, so we need to build better habits and better environments." Tell them to order pizza; the debate is settled.
