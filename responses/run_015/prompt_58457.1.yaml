prompt: |-
  ugh i just sat through an hour-long arguement between my two roomates about whether virtue ethics survives psychology and my brain is fried lol can you help sort it out

  so Maya started it by saying those classic psych experiments where like whether seminary students stop to help depends on how rushed they are, or whether people help a stranger depends on finding a dime or smelling cookies, or everyone just looks around to see if others intervene, prove behavior is driven by silly situational stuff not character. so stable stuff like generosity or honesty is bunk, and telling people to cultivate virtues is like telling them to cultivate horoscopes.

  then Jon said thats unfair cuz virtue people never claimed most 20 year olds walking around campus are already virtuous. virtue is supposed to be hard and rare and take years of habituation, so showing the average person is flaky does not refute it, anymore than showing most people are bad at piano refutes piano skill.

  then Maya said ok even if virtue is rare you would still expect the few good people to be consistent, but the data suggests there are not any such people. like who helps totally flips when you tweak hurry or mood, and personality test scores barely predict who does what. and if you retreat to saying oh he has a local trait like honesty-with-friends-but-not-on-taxes, that just relabels inconsistency and gives up on traits doing any real explanatory work.

  then Jon said virtue was never about robot consistency, it is about being sensitive to the right reasons. a genuinely kind person should act different when rushing someone to the ER vs out for a stroll, and part of the skill is ignoring dumb stuff like dimes and smells. plus he said the situationists kind of need character-ish stuff anyway, cuz to explain why people obey in those obedience experiments they appeal to fear of looking bad or wanting to please the guy in charge, which sound like traits to him.

  i got lost tbh. can you go through each of those four moves in order and say who had the better point on that move and why, and then say who is more right overall and what both of them are missing
