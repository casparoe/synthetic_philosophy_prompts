      *   *Decision:* It's a draw, but Jon wins on the *survival* of the theory, while Maya wins on the *description of human nature*. I'll frame it as Jon winning the debate about whether the *theory* survives, but Maya winning on the *psychological reality* check. Actually, a nuanced "Jon is more right about the theory, Maya is more right about the people" is better. Let's lean towards **Jon** on the specific question "Does virtue ethics survive?" because the theory can adapt, whereas Maya's claim that it's *completely* bunk is too strong.

