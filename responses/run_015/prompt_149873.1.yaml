  **Bell Harbor Public Safety Advisory Committee**
  **Joint Statement of Adversarial Collaboration**

  **Date:** October 24, 2023
  **Context:** City of Bell Harbor (Pop. 380,000)

  After twelve months of contentious debate, the undersigned members of the Public Safety Advisory Committee acknowledge a fundamental divergence in our visions for community security. However, we agree that continued polarization serves no one. Based on stipulated data regarding call volumes, violence rates, and resource allocation, we have established the following common ground and structured our disagreements to allow for measurable testing rather than rhetorical stalemate.

  **I. Shared Claims**

  Both parties sign onto the following factual premises regarding Bell Harbor's current reality:

  1.  **Call Composition:** Only a small fraction of 911 calls involve active violence or weapons. The majority of sworn officer hours are spent on non-violent administrative or social issues.
  2.  **Public Fear:** Despite low statistical risk, resident anxiety is driven primarily by response times and clearance rates for serious violent crime.
  3.  **Resource Misalignment:** The current budget allocates armed sworn personnel to tasks (traffic, mental health, schools) that do not require a mandate for lethal force.
  4.  **Inevitable Coercion:** Any replacement institution must account for scenarios involving armed individuals, violent actors, or persons in crisis who refuse voluntary help.
  5.  **Goal:** The objective is to reduce harm and increase safety, not to protect existing institutional hierarchies.

  **II. Areas of Divergence**

  We disagree on the scope of state authority and the structure of response. The following table outlines our positions in language each side accepts.

  | Issue | Reform/Defund Position | Abolitionist Position |
  | :--- | :--- | :--- |
  | **Scope of State Coercion** | The state retains a monopoly on legitimate force for violent crime, evictions, and involuntary holds, but this mandate should be narrowly restricted to sworn specialists. | No agency should have a general standing mandate to use force; coercive acts (holds, evictions) are violence that should be rendered obsolete by social support, not managed by uniformed agents. |
  | **Nighttime Response (3am)** | A specialized, highly trained armed unit must be available 24/7 to respond to high-risk incidents when social services are unavailable. | Reliance on armed response at 3am represents a systemic failure; resources must shift to prevention so that 3am crises are rare, handled by community networks when they occur. |
  | **Institutional Labeling** | The armed response unit should be designated as "Public Safety Officers" to distinguish them from traditional patrol officers and reduce stigma. | Any group with a mandate to detain or use force is "Police" by function; renaming them obscures the reality of state coercion and hinders accountability. |

  **III. Agreed Upon Tests and Predictions**

  To move beyond theory, we agree to monitor specific concrete cases within Bell Harbor over the next fiscal year. For each crux, we have identified evidence both sides accept as relevant and recorded our conflicting predictions.

  **1. The Violent-Envelope Problem (Involuntary Holds)**
  *   **Concrete Case:** The frequency and outcome of involuntary psychiatric holds initiated by non-police crisis teams versus sworn officers.
  *   **Reformist Prediction:** Data will show that unarmed clinicians paired with a narrow armed backup unit reduce injury rates during holds while maintaining necessary detention capabilities for safety.
  *   **Abolitionist Prediction:** Data will show that any mandate to detain produces trauma and escalation regardless of the uniform; true safety correlates with the *number* of holds performed, which should trend toward zero via housing and clinic access.

  **2. The 3am Question (Domestic Disturbance)**
  *   **Concrete Case:** Response outcomes for reported domestic disturbances involving weapons between 12am and 5am.
  *   **Reformist Prediction:** Clearance rates and victim safety will depend on the arrival time of the specialized armed unit; delays directly correlate to increased physical harm.
  *   **Abolitionist Prediction:** Harm correlates to the *presence* of armed responders escalating tension; community-based intervention networks, even if slower, will show lower rates of subsequent violence and arrest than armed response.

  **3. The Semantic Question (Naming the Unit)**
  *   **Concrete Case:** Public trust surveys regarding cooperation with "Public Safety Officers" versus "Police."
  *   **Reformist Prediction:** Renaming the unit will increase willingness to call for help among marginalized groups who distinguish between "social workers with backup" and "patrol officers."
  *   **Abolitionist Prediction:** Renaming will show no statistical difference in trust because the function (detention/force) remains unchanged; communities recognize coercion regardless of the title.

  **IV. Conclusion on Structure vs. Semantics**

  We acknowledge that not all disagreements listed above are structural. Specifically, the third row regarding **Institutional Labeling** is identified by both parties as a semantic disagreement. While the Reformist side believes language shapes perception of legitimacy, and the Abolitionist side believes language must reflect material function, both agree that the *capacity* for force remains identical regardless of the title. We will proceed with the operational tests in Section III while noting that the naming convention does not alter the physical reality of the violent-envelope.

  This document serves as our binding framework for the upcoming budget cycle. We commit to reviewing the data generated by these tests before advocating for further structural changes.

  **Signed,**

  *Member A (Reform/Defund Advocate)*
  *Member B (Abolitionist Advocate)*
