      *Wait, one nuance:* The student says "Nobody designed that outcome." Winner actually discusses how artifacts can *become* political without explicit intent through the arrangement of things. But Winner's core point is often about *how* things get built (the process). The student is focusing on the *result*. This is a consequentialist view vs. Winner's more structuralist view. I need to highlight this.

      *Also, the "Neutral Work" point:* The student argues: Artifacts distribute burdens -> Engineers bear responsibility -> No neutral work. The gap is between "bearing responsibility" and "doing neutral work." If an engineer designs a bridge that collapses, they are responsible. If they design a bridge that segregates, are they responsible? Winner says yes. The student says yes. The objection is: Is *every* distribution of burden political?

      *Okay, let's structure the response.*
