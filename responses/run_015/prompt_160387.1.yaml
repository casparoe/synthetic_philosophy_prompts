      *   *Slippage:* The student slides from "political" (power structures) to "unequal outcomes." A broken leg causes unequal burden, but isn't political. A tax causes unequal burden and *is* political. What's the difference? Legitimacy/Authority/Collective Choice.
      *   *The "Neutral Work" argument:* This is the weakest link. Just because an artifact has effects doesn't mean the engineer *could have known* or *should be held responsible* in the same way. But the student's point about "no neutral work" is a standard critique (Value-Sensitive Design). I should validate the impulse but warn about the definition.
      *   *Strongest Objection:* The "Triviality Objection." If a spoon distributes benefits (eating) and burdens (washing), is it political? If yes, the word loses meaning.
      *   *Concession:* Concede that "neutrality" is a myth, but insist that "political" requires more than just "unequal effects." It requires *power*.

  6.  **Refining the "Bluntness":**
