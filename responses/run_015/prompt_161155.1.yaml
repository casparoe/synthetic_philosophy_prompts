answer: |-
  **MEMORANDUM**

  **TO:** Capital Committee, Cedar Basin Cooperative Federation
  **FROM:** [Your Name], Capital Committee Member
  **DATE:** April 5, 2024
  **SUBJECT:** Recommendation for Capital Allocation Mechanism (FY2025)

  **1. Executive Summary**

  We are recommending a structural split of the Capital Fund into two distinct tracks with separate allocation mechanisms. This is not a compromise; it is a recognition that the Fund serves two economically different purposes.

  *   **Track 1 (Routine Replacement):** 70% of the Fund. Allocated via **Proposal A (Price Loop)** with specific modifications to ensure "skin in the game."
  *   **Track 2 (Strategic Innovation):** 30% of the Fund. Allocated via **Proposal B (Allocation Assembly)** based on strategic criteria.

  This memo outlines the implementation timeline, the specific rules required to make the Price Loop function without fake markets, and an assessment of the economic arguments currently circulating in the committee.

  **2. The Economic Reality: Settled vs. Contested**

  There is significant debate in this room referencing economic theories from the 1930s. To make a decision, we must separate what is actually settled from what is still contested among practitioners.

  **What is Settled:**
  Internal prices require history to function. A rental rate signals scarcity only if there is past data on usage, maintenance, and demand. For the two-thirds of our demand that involves replacing worn presses, duplicating known printing lines, or upgrading food processing units to stable specs, we have the cost data required to make prices meaningful. In this specific context, trial-and-error pricing works.

  **What is Contested:**
  The debate between "prices are the only way to calculate value" (the Mises/Hayek position) and "planners can simulate prices through iteration" (the Lange position) is unresolved regarding *innovation*.
  *   The "prices" side argues that without personal financial loss, a bid is cheap talk.
  *   The "planning" side argues that algorithms can adjust rates fast enough to find equilibrium.

  **Both sides are partially right, but neither applies to our innovation requests.** For the heat-pump retrofit line or the "weird stuff" budget, there is no historical data for a price to converge on. You cannot revise a rental rate based on scarcity when the product doesn't exist yet. Conversely, you cannot demand "skin in the game" from a worker-owner who is being asked to take a strategic risk for the Federation's benefit. If they fail, the Federation loses, not just them.

  Therefore, the academic debate is irrelevant to Track 2. We cannot price unknown risks. We must allocate them politically/strategically.

  **3. The "Cheap Talk" Objection and Track 1 Design**

  The strongest objection to the Price Loop is that in a co-op, nobody's personal money is on the line. If a shop bids high for a machine and underutilizes it, they don't go bankrupt; they just dip into the shared pool. If we do not fix this, the Price Loop is just accounting theater.

  To make Track 1 viable, we must bolt on **Direct Patronage Exposure.**

  *   **Current Flaw:** In the pilot, rental payments were treated as operating expenses. This smoothed the pain.
  *   **Correction:** Rental payments for Track 1 equipment will not be deducted from operating revenue. They will be accrued and deducted directly from the shop's year-end **patronage refund**.
  *   **Why this matters:** This hits the workers' take-home pay. If they over-bid for a machine they don't need, their year-end bonus shrinks. If they under-bid and can't get the machine, they lose production capacity. This creates the necessary feedback loop without requiring individual bankruptcy.

  **4. Concrete Proposal: The Split Track System**

  **Track 1: Routine Capital (70% of Fund)**
  *   **Eligibility:** Replacement of existing asset classes, duplication of proven lines, efficiency upgrades with <2 year payback periods.
  *   **Mechanism:** Internal Rental Rate.
  *   **Rate Setting:** Federation Office sets base rates quarterly.
  *   **Revision Rule (Published & Automatic):**
      *   If demand > supply for a specific asset class for 2 consecutive quarters, rate increases by 15%.
      *   If supply > demand for 2 consecutive quarters, rate decreases by 10%.
      *   *No manual smoothing.* The formula is locked.
  *   **Payment:** Deducted from annual patronage refund, not operating budget.
  *   **Surplus:** Unspent Track 1 funds roll over to Track 2.

  **Track 2: Strategic Capital (30% of Fund)**
  *   **Eligibility:** New product lines, entry into new markets, decarbonization projects, R&D budgets.
  *   **Mechanism:** Allocation Assembly Grant.
  *   **Criteria:**
      1.  Job retention/creation (Weight: 40%)
      2.  Decarbonization impact (Weight: 30%)
      3.  Equity (Newer shops vs. Established) (Weight: 30%)
  *   **Risk:** No repayment required. Failure is absorbed by the Fund as a cost of R&D.
  *   **Cap:** No single shop may receive more than 50% of the Track 2 fund in a single year.

  **5. Implementation Timeline**

  *   **April 12 Meeting:** Committee votes on Split Track structure.
  *   **May 1:** Federation Office publishes the Track 1 Automatic Revision Formula and Track 2 Scoring Rubric.
  *   **June 15:** Shops submit initial Track 1 equipment needs and Track 2 project proposals.
  *   **July 1:** FY2025 Capital Cycle begins. Track 1 rates go live.
  *   **September 30:** First Quarterly Review of Track 1 rates (first potential adjustment).
  *   **December 31:** Track 2 Allocation Assembly meets to award grants.
  *   **March 2025:** First Patronage Refunds issued with Track 1 deductions applied.

  **6. Risk Management & Sunset**

  If the Track 1 Price Loop results in less than 60% utilization of the allocated 70% fund by Q4, the mechanism is failing to clear the market. In that case, we trigger a **Sunset Clause**: Track 1 reverts to Allocation Assembly for the following year.

  This prevents us from clinging to a "market" mechanism that is merely creating bureaucracy without allocating capital efficiently.

  **7. Recommendation**

  Vote to adopt the Split Track System.

  This approach acknowledges the old-timer's point: without the risk of loss (patronage deduction), prices are fake. It also acknowledges the other side's point: for strategic shifts, democratic criteria beat blind pricing. But crucially, it stops us from trying to force a single mechanism to do two jobs it cannot do.

  We should not pretend that setting a rental rate for a heat-pump prototype is "economic calculation." It isn't. It's budgeting. Let's call it that, fund it separately, and let the Price Loop do what it's actually good at: managing the boring stuff efficiently.

  **Attachments:**
  *   Draft Formula for Track 1 Rate Revisions
  *   Draft Scoring Rubric for Track 2 Assembly
