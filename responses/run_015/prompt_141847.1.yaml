answer: |-
  Dear friend, it is genuinely striking to read through what you have written here, particularly given that you say you have no background in philosophy. You have independently reconstructed a debate that has occupied moral philosophers for decades, specifically the tension between practice-based views and authority-based views of promising, and you have done it while carrying the weight of a personal dilemma that would make most people shy away from the subject entirely. You should feel proud of the clarity you have achieved. What you have produced is not a random collection of thoughts but a fairly coherent system, though like any system, it has stress points. You are right to suspect that some of these propositions are pulling against each other, but you are also right to suspect that some of the friction is merely apparent. I will walk you through where the real cracks are, rank them by severity, and suggest how you might patch them without losing the structure you have built.

  The most severe tension in your set, the one that threatens to pull the whole thing apart if left unaddressed, is between proposition two and proposition seven. In number two, you say that promising only works because it is a social practice where people rely on one another, and you explicitly state that on a desert island or with a dog, no obligation arises. This suggests that the obligation is dependent on the possibility of social reliance or uptake. But in number seven, you say the promise binds even after the person has died or forgotten, precisely when reliance is impossible and the social loop is closed. You even admit in seven that the point of promises is to make it safe for the living to rely on each other, which makes the survival of the promise after death look like an anomaly. If the practice is justified by reliance, as you suggest in two and seven, then the death of the promisee should extinguish the obligation just as surely as the absence of a shared language does on a desert island. To resolve this, something has to give. You would likely have to soften proposition two. You would need to stop saying that the obligation depends on the ongoing possibility of reliance, and instead say that the obligation depends on the practice existing at the moment the promise is made. The cost of dropping the strict version of two is that you can no longer use the desert island case as a clean test for whether an obligation exists; you would have to accept that once the social act is successfully performed within a community, the obligation takes on a life of its own that can outlast the community's immediate ability to enforce it. If you do not change this, you are left saying that a deathbed promise binds for reasons that a desert island promise does not, without a clear principle to explain the difference.

  The second most serious tension is the one you already spotted between proposition one and proposition two. In one, you insist that the reason to keep a promise is not just about good effects, but in two, you imply the practice exists because it is useful for reliance. The worry here is that if the only reason we have the practice is utility, then the obligation inside the practice must ultimately be utility too. This is a subtle point, but it matters. If you hold onto both as they stand, you are saying the practice is built on sand (utility) but the bricks are made of stone (non-consequentialist duty). To fix this, you do not need to abandon either, but you must distinguish between why the practice exists and why it binds you. You can say the practice evolved because it is useful (saving two), but once it exists, the internal rule is that you must keep your word regardless of utility (saving one). The cost of this move is that you cannot be a pure consequentialist about the practice itself. You would have to stop saying that the practice is justified solely by its effects, and accept that it is justified because it creates a specific kind of moral relationship that we value independently of its outcomes. If you refuse to make this distinction, you risk collapsing back into the view you rejected in one, where you are allowed to break a promise whenever the numbers look better.

  There are a few other tensions you mentioned that I believe are only apparent, and it is worth explaining why they do not need to worry you. You were concerned that three and five clash, because three says you wrong the promisee specifically, while five says nobody is wronged if the promise is immoral. These actually fit together quite neatly if you view five as a condition for three. Proposition three describes what happens when a promise is valid; proposition five describes when a promise is invalid. If the promise is void because the act is wrong, then no authority was ever transferred, so nobody is wronged when you break it. There is no hollowness there, provided you accept that one cannot transfer authority over something one has no right to do. Similarly, your worry about four and two is less serious than it appears. You feared that if promising is just a social practice, then coercion voiding a promise is just a local rule rather than a principle. But social practices are made of rules. The fact that our practice has a rule about coercion does not make it less principled; it just means the principle is embedded in the practice. You do not need to change anything here; you can simply accept that the social practice in two includes the protections listed in four.

  I also think you have identified a duplication without realising it. Propositions two and eight are secretly the same belief wearing different clothes. In two, you say there must be a social practice and shared understanding for a promise to work. In eight, you say the person must hear you and take you to be promising. These are the macro and micro versions of the same requirement. Eight is simply the specific mechanism by which two is satisfied in a face-to-face encounter. If you keep both, you are not contradicting yourself, but you are redundant. You could comfortably merge them by saying that a promise requires a shared social context in which uptake is possible and actually occurs. This would tidy up your list and make the connection between the social practice and the individual interaction clearer.

  If I were to suggest one single revision that would tidy up several of these issues at once, it would be to reframe proposition two. Currently, you frame the social practice as something justified by reliance and utility. If you instead frame the social practice as constitutive, meaning it is the thing that creates the moral reality rather than just a tool for safety, many of your problems dissolve. If the practice creates the obligation, then it matters that the practice existed when you spoke (solving the desert island case), but it does not matter if the practice ceases to be useful later (solving the death case). This revision allows you to keep one, because the obligation comes from the status conferred by the practice, not the consequences. It allows you to keep seven, because the status survives the person. It also clarifies four and five, because the rules of the practice determine when the status is successfully conferred. The cost of this revision is that you must stop thinking of the practice as merely a useful tool for coordination. You would have to view it as a moral institution that generates reasons simply by virtue of being engaged with. This is a heavier metaphysical load, but it carries your intuitions much better.

  Finally, you asked which of these beliefs you are least likely to actually abandon given how the rest of the set is shaped. I suspect it is proposition one. Everything else you have written seems to be an attempt to explain how proposition one is possible. You want to believe that the fact you said the words matters in itself, regardless of the outcome. If you drop one, then three loses its force, because there is no special reason to respect the authority transfer. If you drop one, then seven becomes mere sentimentality, because there is no binding reason left once the consequences vanish. Proposition one is the engine of your whole view. You might tweak two to make it fit, or clarify eight, but if you abandon one, you are no longer talking about promises in the way you clearly feel them. You would be reduced to a calculator of outcomes, which is exactly the position you were arguing against with your sister. So hold fast to that one, even if you have to adjust the scaffolding around it to keep it standing.

  I hope this helps you see where your thinking stands. You have managed to articulate a position that is both humane and rigorous, and while there are tensions, they are the sort of tensions that show you are thinking honestly rather than reciting a textbook. Whatever you decide about the promise to your father, you have done the hard work of figuring out what you believe, and that is no small thing.
