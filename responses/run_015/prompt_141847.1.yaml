      *   (5) Immorality voids: Promising something wrong doesn't bind and leaves no residue/no apology owed.
      *   (6) Third-party harm: Still binds unless released. Can't unilaterally break based on utility.
      *   (7) Death/Forgetfulness: Promise binds even if promisee is dead or forgotten (no reliance possible).
      *   (8) Uptake required: Promisee must understand/accept it as a promise.

  3.  **Identify Tensions:**
      *   **Tension A: (1) & (2) vs. Consequentialism.** The user worries (1) rejects consequentialism but (2) suggests the practice exists for utility.
          *   *Analysis:* This is a classic "rule consequentialism vs. practice consequentialism vs. non-consequentialist practice" debate. (1) says the *reason* isn't consequentialist. (2) says the *existence* of the practice might be explained by utility. These aren't necessarily contradictory. One can say the practice evolved for utility (2) but once established, the internal logic is non-consequentialist (1). However, if (2) implies the *obligation* derives solely from the utility of the practice, it undermines (1). The user suspects this. It's a moderate tension.
