      *(Final check on Climate Case)*: The prompt says the model costs nothing computationally. The cost is *time*. Good's theorem assumes the state of the world is static during info acquisition. If the world changes (tipping point), the theorem's assumptions break. I need to highlight this "non-stationarity."

      *(Final check on Forgiveness/Jury)*: These are cases where the *process* is part of the *outcome*. A verdict reached via inadmissible evidence is a "bad" verdict even if "correct." A forgiveness granted after digging for dirt is "less virtuous." This is about the *constitutive* nature of the action.

