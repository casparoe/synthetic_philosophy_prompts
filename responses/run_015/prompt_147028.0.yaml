answer: |-
  Here is a reconstruction of the implicit theory underwriting the genre you describe, followed by committed verdicts on your specific puzzles. I have reasoned strictly from the five conventions you outlined, treating them as a coherent system of ethical pedagogy rather than a historical artifact.

  ### I. The Implicit Theory: Character, Knowledge, and Truth

  To make the five conventions work together, the genre must commit to three substantive claims. These are not merely congenial; they are structural prerequisites.

  **1. The Metaphysics of Character: Dispositional Realism**
  The genre assumes character is a real, stable entity distinct from the sum of actions.
  *   **Strict Presupposition:** Character is a *hexis* (stable disposition) rather than a aggregate of behaviors. This is required for the **Revelatory-Priority Rule**. If character were merely the sum of public acts, the "statute or battle" would be the primary evidence. By privileging the "unguarded moment," the genre claims that character exists *behind* the action as a causal source that leaks out when social performance relaxes.
  *   **Strict Presupposition:** Character is temporally persistent. This is required for the **Closure Rule**. If character were fluid or entirely situation-dependent, the end of the life would have no special evidentiary weight over the middle. The genre assumes that while fortune can test character, character itself is the continuous variable that must survive the test.
  *   **[High Confidence]**: Without a commitment to stable dispositions, the Revelatory and Closure rules contradict each other rather than complement each other.

  **2. The Epistemology of Moral Knowledge: Particularism via Legibility**
  The genre assumes moral knowledge is acquired not through abstract principles but through the intelligible reconstruction of a particular agent.
  *   **Strict Presupposition:** Moral legibility supersedes documentary accuracy. This underwrites the **License**. If the goal were historical truth, gaps would remain gaps. Because the goal is *imitation*, gaps are obstacles to pedagogy. The reader cannot imitate a silence. Therefore, the "truth" being tracked is the *coherence of the agent*, not the *accuracy of the archive*.
  *   **[High Confidence]**: This distinguishes the genre from modern biography. The modern biographer serves the past; this biographer serves the future reader.

  **3. The Teleology of Life: Narrative Necessity**
  The genre assumes a life constitutes a unified whole with a meaning that is only accessible at its boundary.
  *   **Strict Presupposition:** A life has a shape that can be "completed." This is required for the **Closure Rule** and the **Typology Rule**. It treats biological death not just as a cessation but as the final punctuation mark that fixes the meaning of the preceding text.
  *   **[Contestable]**: This is the weakest link metaphysically. It requires a view of time where the end retroactively organizes the beginning (the Typology Rule). This is an aesthetic or theological commitment, not an empirical one.

  ### II. Do the Five Conventions Hang Together?

  They form a tight system, but they rely on a hidden sixth convention: **The Benevolence of Fortune.**

  The system holds together only if we assume that the world generally cooperates in making character legible.
  *   **Revelatory-Priority** says character shows itself in small things.
  *   **License** says we can fill in gaps where it doesn't show.
  *   **Typology** says the beginning predicts the end.
  *   **Closure** says the end confirms the beginning.
  *   **Ranking** says we can judge the result.

  **Where the system strains:** The **License** and the **Closure Rule** are in tension if the "invented details" smooth over the very fractures that the "end of the life" is supposed to test. If you invent away the struggles, the Closure becomes a formality rather than a verdict.
  *   **[Contestable]**: A reasonable critic could argue the License undermines the Closure. If the biographer supplies what the agent *would have done*, they are ensuring the character holds, thereby rigging the test that the Closure Rule claims to administer. The genre cheats here by ensuring the subject passes the test of time through editorial intervention.

  ### III. Verdict on Your Unresolved Questions

  #### 1. Revelatory-Priority vs. Closure: Stability or Situation?
  **Verdict:** The genre is committed to **Character Stability**, and your tentative reconciliation is correct but requires a stronger metaphysical claim.
  **Reasoning:** The jest reveals the *nature* of the disposition; the closure reveals the *strength* of that disposition against time and fortune. If conduct were highly situation-dependent (as situationist psychology suggests), the "jest" would be just another situation, no more revelatory than the "battle." The fact that the genre treats the jest as *more* revelatory implies it views public acts as masked and private acts as unmasked.
  However, the Closure Rule adds the dimension of *perseverance*. A single jest proves you *have* a character; living to old age proves you *kept* it.
  **Commitment:** The genre cannot accommodate radical situation-dependence. It requires a view of the self as a continuous substrate. If you reject stable character, you must reject the genre's claim to truth, not just its methods.
  **[High Confidence]**

  #### 2. The License: Internal or Corruption?
  **Verdict:** The License is **Internal to the Educational Aim**, not a corruption. Your colleague is wrong to call it a confidence trick, but only if you accept the distinction between *Documentary Truth* and *Moral Truth*.
  **Reasoning:** The aim of the genre is *imitation* (mimesis). To imitate an agent, the agent must be intelligible. Historical records are fragmented; fragmentation destroys intelligibility. If the record is silent on how a great leader received bad news, the reader cannot learn *how to receive bad news*. By supplying the detail ("he turned pale but did not speak"), the biographer provides the moral data required for the lesson.
  The "corruption" only exists if you assume the primary aim is *historical preservation*. But you noted the modern footnoted biography is a "different enterprise." You are correct. The footnoted biography aims at *archival fidelity*; this genre aims at *moral legibility*. The License is the tool that converts the raw material of history into the finished goods of ethics.
  **Caveat:** It becomes a corruption only if the invention contradicts the known character (violating the Legibility Constraint). If the invention creates a *false* coherence (e.g., hiding a genuine moral failure to make the subject more imitable), then it is a lie. But filling a silence with a probable action is a pedagogical necessity.
  **[High Confidence]**

  #### 3. The Test Case: The Accidental Death at Thirty-Two
  **Verdict:** The Genre **Requires Narrative Closure** that life does not factually possess, and in this test case, **the Genre Fails.**
  **Reasoning:** The Closure Rule (Solon's dictum) assumes that death is the *final argument* in the syllogism of a life. In your test case, the accident is not an argument; it is noise. It reveals nothing about character.
  If the genre insists on rendering this life "beautifully" despite the meaningless death, it must *impose* meaning where there is none. It must treat the accident as a "turning" (Typology Rule) or a "test" (Closure Rule). To do so is to falsify the reality of the life to satisfy the requirements of the form.
  Therefore, the genre is committed to the view that lives *ought* to have narrative shape, even if they do not. It is a normative claim disguised as a descriptive one. It rules out the possibility of *absurdity* (in the Camusian sense). It cannot accommodate a life that is morally coherent but narratively interrupted.
  **Commitment:** The genre cheats here. It treats the *form* of a life as more real than the *facts* of a life. If you assign this test case, the lesson should be that the genre breaks when confronted with pure contingency. The "loss" your students feel is the friction between the genre's demand for order and the world's indifference.
  **[High Confidence]**

  ### IV. Summary of Strict vs. Congenial Presuppositions

  | Presupposition | Status | Reason |
  | :--- | :--- | :--- |
  | **Character is stable across time.** | **Strict** | Required for Closure & Typology to function as evidence. |
  | **Small moments reveal more than public acts.** | **Strict** | Required for Revelatory-Priority. |
  | **Moral legibility > Documentary accuracy.** | **Strict** | Required for License to be permissible. |
  | **Lives possess inherent narrative shape.** | **Strict** | Required for Closure to be meaningful rather than arbitrary. |
  | **Virtue is imitable.** | **Strict** | Required for the educational aim itself. |
  | **The world cooperates in revealing character.** | **Congenial** | The genre *hopes* this is true, but the License is used to fix it when it isn't. |
  | **Two lives are commensurable (Ranking).** | **Contestable** | One could keep the first four rules but reject Ranking as hubristic. |

  ### V. Where the Genre is Cheating

  I believe you should tell your students that the genre cheats on **The Test Case**.

  The genre promises to teach us about *life*, but it actually teaches us about *narrative*. When a life ends in a meaningless accident, the genre's machinery (Typology, Closure) grinds against the reality. To make the life "work," the biographer must treat the accident as fate or the short life as "complete" in a way that defies the Closure Rule's own logic (which demands the full span to judge).

  This reveals the genre's deepest secret: **It is not a theory of life; it is a theory of storytelling.** It assumes that ethical truth is accessible only through narrative coherence. If a life lacks coherence (due to bad luck/accident), the genre implies the ethical truth is inaccessible or diminished. That is a substantive philosophical claim—that *narrativity is a condition of moral value*—and it is a claim you can invite your students to reject.

  **[High Confidence]**: The genre cannot handle the Absurd. It requires a universe where moral desert and narrative conclusion are correlated. When they are not, the genre must lie (via License) or break.

  ### VI. Final Recommendation for the Seminar

  Do not ask your students to decide if the genre is "honest." Ask them to decide if **Legibility** is a sufficient substitute for **Truth** in ethics.

  If the License provides a model that is more imitable than the fragmented historical record, does the falsification matter? If the answer is "Yes," then the modern footnoted biography is the only ethical form. If the answer is "No," then Plutarch is more useful than the archive.

  The tension you feel between the Revelatory and Closure rules is the tension between *seeing* the virtue and *trusting* the virtue. The genre resolves this by saying: "You saw it in the jest, but you only believe it because he held it to the end." The License ensures he held it. The Test Case breaks the chain because the "end" was stolen by fortune.

  **[Contestable]**: A reasonable person could argue that the Test Case *does* work under the Typology Rule—a life cut short is a figure of martyrdom or unfulfilled potential, which is itself a narrative shape. I reject this as a retrofit. The Closure Rule explicitly demands the *end* to judge the *happy*, not the *cutting off* to judge the *tragic*. The genre is optimized for completed arcs, not fragments.
