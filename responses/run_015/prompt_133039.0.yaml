  When breath departs the lamp is blown quite out
  and leaves no eye to watch the coming night
  for harm must find a living hand to hold
  like pain that needs a nerve to carry fire
  but when the final silence fills the room
  there is no ear to hear the quiet fall
  so nothing bad can touch the one who goes

  Yet think upon the chair that sits alone.
  The ledger shows a sum cut short too soon.
  The sun will rise without a face to warm.
  A harvest rots because the hand is still.
  The future holds a feast we cannot eat.
  This missing light defines the shape of loss.
  The argument remains a closed dispute.

  Commentary on the formal choices

  The shift from enjambment to end-stopping mirrors the philosophical tension between presence and absence. In the first stanza, the unbroken syntactic flow mimics the Epicurean claim that existence is a continuous state; without a break, there is no point where death intersects the subject to inflict harm. The lack of terminal punctuation denies the finality that death implies. Conversely, the second stanza's rigid end-stops enact the deprivation account's logic: harm is located at specific temporal boundaries where future goods are severed. Each line becomes a discrete unit of loss, like entries in a ledger.

  To maintain iambic pentameter, I simplified the Epicurean argument, omitting the distinction between ante-mortem and post-mortem harm. Similarly, the deprivation account is reduced to tangible metaphors rather than exploring counterfactual complexity. The form forces a binary choice—flow versus stop—that the philosophy itself struggles to reconcile, leaving the final line end-stopped yet intellectually unresolved.
