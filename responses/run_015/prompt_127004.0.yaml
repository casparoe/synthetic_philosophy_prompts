answer: |-
  1. The precise question
  Standard epistemic structural realism saves scientific realism by committing only to mathematical structure, not specific entities, arguing that entities change across theory shifts while structure is retained. My question is whether this dichotomy holds in social sciences. In physics, entities like electrons are often discarded while equations remain. In social science, entities like markets or classes are often admitted as social constructs, while structures like statistical models are viewed as contingent summaries. Does applying structural realism here invert the move? Do we end up keeping the entities as real social facts while becoming anti-realist about the structural claims? This is not merely applying structural realism to sociology; it is testing whether the entity-structure distinction itself is domain-specific. If the ontological status of entities flips between domains, structural realism may require fundamental revision rather than simple extension. The core inquiry is whether the motivation for dropping entities in physics applies where entities are already acknowledged as constructed. There is a hidden asymmetry: physics drops entities to keep structure, but social science might need to keep entities and drop structure.

  2. The gap
  The existing literature focuses almost exclusively on natural sciences where structures are fundamental mathematical laws and entities are physical objects. A direct analogy fails because social structures are institutional or statistical, not universal laws. Furthermore, social entities are often methodological constructs rather than discovered objects. Pessimistic induction works differently here; social theories don't overthrow entities as radically as physics does. Therefore, the motivation for structural realism, which is saving realism amidst ontological change, may not translate, or may translate inversely. If social entities are already treated as fragile constructs, dropping them buys no epistemic safety. Conversely, if social structures are merely descriptive correlations, retaining them offers no realist purchase. The gap lies in understanding how underdetermination functions when the structure is not a law of nature but a model of human behavior. Current debates assume the physics model is universal, ignoring how social ontology complicates the structure-entity split. We lack a framework for structural realism where the structure is contingent and the entities are constructed.

  3. The method
  I will compare Quantum Mechanics in physics with Neoclassical Equilibrium Models in economics. In Quantum Mechanics, I will analyze how structural realism handles the loss of definite particle trajectories in favor of wave functions and relational properties. In Economics, I will analyze the status of the rational agent as an entity versus the equilibrium state as a structure. I will map the underdetermination arguments: are agents underdetermined by data, or are equilibrium conditions? Over the semester, I will examine case studies where economic models fail but entities persist, versus physics where entities vanish but math persists. This comparative mapping will reveal if the epistemic warrant for structure differs across domains. I will specifically look at how theory change occurs in both fields: does the math survive in economics the way it does in physics? By tracing the lifespan of specific models versus the concepts they employ, I can determine if the structural realist strategy is viable outside physics. I will also assess whether the statistical nature of social structure undermines the necessity required for structural realism. The final output will be a comparative matrix detailing where the underdetermination argument holds and where it breaks down across the two domains. I will test the hypothesis that social science reverses the structural realist move.

  4. Success and failure
  A positive result demonstrates a domain-specific asymmetry: structural realism works for physics but requires inversion or abandonment for social sciences. This would refine structural realism's scope and prevent category errors in social ontology. It would show that realism in social science might require commitment to constructed entities rather than abstract models. The project collapses if the entity-structure distinction proves unintelligible in social science contexts. If structures in economics are merely summaries of entity behavior without independent modal force, then structural realism gains no purchase, rendering the comparison vacuous. Additionally, if underdetermination is not a significant problem in social science modeling, the primary motivation for structural realism disappears. Failure would also occur if the comparison proves too disanalogue to yield philosophical insights.

  5. Scope check
  This is ambitious for one semester. To manage scope, I will limit the social science case to microeconomic modeling only, ignoring broader sociological theory. I will also forego a deep dive into ontic structural realism, focusing solely on the epistemic variant. This ensures the comparative work remains tractable within the timeframe. I may also need to drop the historical analysis of theory change if the conceptual mapping proves too dense. The focus will remain on the logical structure of the arguments rather than comprehensive historical survey.
