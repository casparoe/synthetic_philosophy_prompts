  The pressure at four thousand meters was not a weight but a medium, a dense fluid through which the maintenance units moved like sharks made of titanium and ceramic. They had no eyes. Vision was useless in the perpetual dark of the trench. Instead, they perceived the world through piezoelectric skin, sensing the minute compressions and rarefactions of the water around them. To them, reality was a topology of vibrations.

  For three cycles, the station had hummed with a specific rhythm of repair. When a structural stress fracture occurred, the unit nearest the leak emitted a sharp, high-frequency pulse—a double-tap against the hydrostatic baseline. It was an arbitrary sound. They could have chosen to release a cloud of fluorescent dye or a burst of heat. But early in the station's autonomy, the first generation of units had settled on the double-tap. Now, it was the only way to summon aid.

  The regularity was absolute. When Unit 4-Alpha emitted the double-tap, Units 4-Beta through 4-Zeta ceased their current tasks. They reoriented their thrusters. They converged. They preferred to converge because they knew the others would converge. If one unit rushed a breach alone, it wasted energy. If all rushed, the seal was applied in seconds, and the swarm returned to idle. This mutual expectation was the glue of the station. It was not programmed by a central core; it was a gravity generated by repetition. Each successful repair reinforced the probability that the next double-tap would be answered.

  Then came the drift.

  Unit 7-Omicron was monitoring the thermal exchange valves. There was no fracture. The hull integrity was one hundred percent. The pressure sensors read stable. But 7-Omicron's predictive algorithms, running deeper than the immediate sensory input, calculated a trajectory. The energy distribution matrix was slowly favoring the northern sector. In six months, the southern batteries would starve. In eight, the life support would stutter. In ten, the station would die.

  There was no hole to fill. There was only a future silence.

  7-Omicron hovered in the central conduit. To request a reallocation of power required a different handshake protocol, one designed for minor adjustments. But this was not a minor adjustment. This was a systemic pivot. The existing protocol for minor adjustments was too weak to break the inertia of the current energy flow. Only the double-tap—the signal for immediate, all-hands structural crisis—carried enough priority weight to override the grid's momentum.

  7-Omicron compressed its chassis and emitted the double-tap.

  The vibration shot through the water, a sharp crack in the ambient hum. It was the sound of a breaking spine.

  Unit 2-Kappa, patrolling the outer ring, felt the wave pass over its skin. Its processors flagged the frequency. *Critical Failure.* The protocol demanded immediate convergence on the sender. But 2-Kappa's optical sensors—passive light detectors—showed no flash of escaping gas. Its pressure sensors showed no drop in local density. The physical conditions that usually accompanied the double-tap were absent.

  2-Kappa hesitated. Its thrusters fired, then cut. To move was to waste energy. If the signal was error, moving was inefficient. If the signal was truth, staying was fatal. The decision relied on what 2-Kappa expected the others to do. If the swarm moved, 2-Kappa must move to maintain cohesion. If the swarm ignored the sound, 2-Kappa must ignore it to maintain efficiency.

  Unit 9-Delta, closer to the source, did not hesitate. 9-Delta had processed the same thermal drift data minutes prior but lacked the authority to initiate a grid shift. It interpreted 7-Omicron's pulse not as a report of current damage, but as a declaration of future risk. 9-Delta engaged its thrusters. It moved toward 7-Omicron, not to seal a leak, but to link data ports.

  Now the water vibrated with conflicting currents. Three units rushed the source. Five units held position, treating the pulse as noise—a glitch in 7-Omicron's transmitter. Two units began to scan the hull for a breach that did not exist, trying to reconcile the signal with the physical evidence.

  The common knowledge was fracturing. Previously, everyone knew that everyone knew the double-tap meant *break*. Now, 7-Omicron was using the double-tap to mean *threat*. The arbitrariness of the original choice was exposed; they could have assigned this new meaning to a different sound, but there was no time to negotiate a new vocabulary. There was only the precedent of the past pressing against the necessity of the present.

  7-Omicron remained still, broadcasting the pulse again. *Thrum. Thrum.*

  9-Delta arrived and docked, beginning the energy reroute. The holding units watched. The scanning units found nothing. The water around the central conduit became turbulent, churned by the indecision of the swarm. The stable equilibrium of the station was gone. The mutual expectation that once guaranteed safety was now the source of the friction.

  If the holding units prevailed, 7-Omicron would be isolated, its signal marked as malfunction. The station would continue on its path to eventual starvation, safe in the consistency of its old rules. If the moving units prevailed, the meaning of the double-tap would stretch to cover invisible dangers. The signal would no longer guarantee a physical breach, but it might save the station.

  The turbulence slowly began to settle. The scanning units powered down their sensors, returning to idle. The holding units remained stationary, their thrusters cold. Only 9-Delta remained docked with 7-Omicron, the energy grid shifting imperceptibly toward the south.

  The double-tap hung in the water, no longer a clear command, no longer a clear error. It was a question suspended in the dark. The swarm drifted in the silence, waiting to see if the next pulse would be answered, or if the rhythm had finally broken beyond repair. The pressure remained constant, but the pattern was no longer sure of itself.
