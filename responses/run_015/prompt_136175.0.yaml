  Maimonides and Nachmanides are speaking past each other regarding metaphysical function rather than fighting over legal authority, and divine accommodation does not undermine the law's normative force because halakhic obligation derives from the divine will rather than the rationality of the commandment's purpose. Maimonides addresses the historical teleology of the command, arguing that God accommodated the Israelites' psychological inability to abruptly abandon sacrificial worship, while Nachmanides addresses the ontological efficacy, asserting that sacrifices effectuate a real metaphysical substitution and atonement. These positions are not mutually exclusive because God could have selected a mechanism with intrinsic cosmic weight specifically because it matched the historical capacity of the people, meaning the accommodation lies in the selection of the ritual form, not in the validity of the command. Regarding normative authority, Jewish legal theory posits that a mitzvah is binding because it was revealed at Sinai, not because its reason is eternally logical; therefore, even if the rationale is contingent on historical context, the obligation remains absolute so long as the command stands. The tension arises only in eschatology, where Maimonides implies sacrifices may not be the ultimate spiritual ideal in the Messianic era, whereas Nachmanides views them as perpetually ideal, but this distinction affects future expectation rather than current legal bindingness. Consequently, viewing sacrifice as a concession explains the *why* of its institution without negating the *if* of its obligation, preserving the law's authority despite its contingent origins.
