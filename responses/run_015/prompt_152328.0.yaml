      *Word Count Strategy:* I need to expand on the implications of rejecting (7). What does it cost? It costs the comfort of indifference. It forces action under uncertainty.

      *Let's write.*
      *Start:* Dear Candidate, I have read your argument...
      *Middle:* The error is in (7). Epistemic vs Ontological. The variance doesn't erase the truth. Also (9) is a generalization error.
      *End:* You must keep going.

      *Checking constraints:* No bold, no lists, no headings. Continuous prose. 600-900 words.

