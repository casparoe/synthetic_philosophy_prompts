      *   The bridge is: Old age is the natural end of life. Fulfilling nature is good. Therefore old age is good (or at least not bad).
      *   So, dropping (3) actually *strengthens* the alignment with Cicero's specific argument in *De Senectute*, which relies heavily on agricultural metaphors and natural cycles, not just abstract compensation.

  7.  **Final Plan:**
