          *   **Clifford's Shipowner:** If Pi believes the animal story without evidence, is he endangering others? Maybe not physically, but intellectually. Is he lying? Clifford would say believing without evidence is akin to lying.

      *   *The Institutional Context (Bureaucracy):*
          *   James usually talks about religious/moral belief. Okamoto and Chiba want facts for an *insurance claim*.
          *   Does this make the option *not* forced? They can just write "unknown."
          *   Does it make belief irresponsible? Filing a false report is fraud.
          *   *Nuance:* The officials *choose* the animal story for the report. They suspend their bureaucratic duty for the sake of a "better" narrative.

      *   *Narrative Preference vs. Epistemic Justification:*
