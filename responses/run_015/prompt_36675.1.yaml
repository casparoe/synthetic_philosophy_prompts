answer: |-
  **Session: The Amnesiac Commute (90 mins)**

  **Setup & Payoffs**
  16 participants, 8 pairs. Play money ($). One Driver, one Dealer per pair; swap halfway.
  **Trip Structure:** Dealer flips coin. Heads: Exit 1. Tails: Exit 2 (only reached if Driver Continued at Exit 1).
  **Ignorance Protocol:** Driver wears blindfold. Dealer says "Intersection." Driver chooses **Exit** or **Continue**. Driver never knows which exit.
  **Payoffs:** Exit 1 = $0. Exit 2 = $4. Pass Both = $1.
  **Math:** Optimal ex ante strategy is mixed (Exit 33% of the time). Expected Value (EV) ≈ $1.33. "Always Continue" = $1. "Always Exit" = $0 (avg $0 over both exits, but effectively $0 at Exit 1 and $4 at Exit 2, weighted by reachability). *Correction for game:* If you Always Exit, you exit at 1 (0) half the time, and at 2 (4) half the time *if you reach it*. But you always reach 1. You only reach 2 if you Continue at 1.
  *Revised Payoffs for Clarity:* Exit 1 = $0. Exit 2 = $10. Pass Both = $2.
  Ex Ante Optimal (Continue 1, Exit 2): $10.
  Simulated (Mixed $p$): Maximize $(1-p)(10p + 2(1-p))$.
  **Rounds:**
  1.  **Planning (15 mins):** Group calculates optimal policy. Most will agree "Continue at 1, Exit at 2" is ideal, but acknowledge they can't distinguish. They should settle on a mixed strategy (e.g., "Roll a die, Exit on 1-2").
  2.  **Action (45 mins):** 10 trips per Driver. Drivers decide *in the moment* without dice, relying on intuition. Dealers record choices/payoffs strictly.
  3.  **Scoring (15 mins):** Compare earnings. "Continuers" (ex post defectors hoping for $10) will overshoot often ($2). "Exiters" (fearing overshoot) will hit Exit 1 often ($0). Mixed strategists (who actually used dice) should win.

  **Debrief (15 mins)**
  1.  **Planning vs. Action:** Map the scoreboard. The group planned a mixed strategy (ex ante agent), but individuals defected to "Exit Now" (ex post moment) due to risk aversion or updated credences ("I'm probably at Exit 2").
  2.  **Value of Information:** Ask: "Would you pay $1 to know which exit you're at?" If yes, you get $10 every time. But discuss the theoretical twist: If knowing forces you to re-optimize ex post (Exit at 1 because "why wait?"), you might crash to $0. Thus, an agent might pay *not* to know to preserve the ex ante plan.
  3.  **Limitation:** Verbally note: "Here, ignorance was enforced by blindfolds. In the real problem, the ignorance is ontological—you *are* the same mind at both exits. We simulated memory loss; we didn't replicate the identity split."

  **Predictable Failure Modes**
  1.  **Dealer Leakage:** Dealers unconsciously hint ("This one feels later"). *Mitigation:* Script dealer speech strictly.
  2.  **Card Counting:** Drivers track prompt frequency ("I've only been asked once, must be Exit 1"). *Mitigation:* Randomize trip count or reset context completely between trips.
  3.  **Collusion:** Drivers agree to signal via coughs. *Mitigation:* Isolate pairs; collect blindfolds between rounds.
  4.  **Math Confusion:** Participants miscalculate the mixed strategy EV. *Mitigation:* Provide a cheat sheet with the EV curve so they see the optimal $p$ visually.

  **Word Count:** ~550 words.
