  **The Formula:** She is right that wrongness stems from principles no one could reasonably reject. However, "reasonable" is the operative word; rejection requires generic reasons comparing burdens, not merely feeling harmed.

  **The Veto:** This is misleading. Individuals do not possess an absolute veto against harm. A rejection is only valid if the burden imposed on them is greater than the burden others would face under alternative principles. If the alternative is everyone dies, rejecting a principle that saves five instead of one is unreasonable.

  **Aggregation:** Her claim that contractualism blocks all trade-offs is incorrect. Scanlon allows aggregation when claims are comparable (e.g., life vs. life). In triage, saving five lives is justifiable because the single victim cannot reasonably reject a principle requiring us to minimize comparable losses when we cannot save everyone. Contractualism aggregates comparable claims but refuses to aggregate small burdens to outweigh a catastrophic loss.

  **Rule-Utilitarianism:** This comparison is conceptually false. Utilitarianism maximizes overall value; contractualism seeks mutual justifiability. The "veto" isn't a constraint on optimization but the source of moral truth itself.

  **Consent vs. Rejection:** You are correct to suspect conflation. Contractualism is hypothetical, not actual. It concerns what agents *could* reject given generic reasons, not what they *do* consent to.

  Ultimately, Scanlon does not grant lexical priority to individual rejection in all cases. He allows aggregation of comparable serious claims, avoiding the absurdity that we must flip a coin between saving one or a million.
