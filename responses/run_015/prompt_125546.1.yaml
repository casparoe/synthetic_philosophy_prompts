  4.  **Address the Specific Issues:**
      *   *Counting Problem:* If the model simulates the user, is the user an agent inside the system? This suggests "agency" is a level-of-abstraction claim, not an ontological one.
      *   *Self-Report Problem:* LLM self-reports are just next-token predictions about "what an agent would say." They have no more truth value than the action itself.

