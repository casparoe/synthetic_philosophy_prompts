answer: |-
  You are wrestling with the tension between karma as a **mechanistic law** (like gravity, inevitable and impersonal) and karma as **moral desert** (normative, potentially unfulfilled, requiring a judge or a ledger). Your intuitions strongly favor the latter: you want a ledger that *should* balance, even if the physical world doesn't always balance it.

  Your "unpaid advantage" hypothesis is close, but it fails on Case 3 (no advantage taken if will is bypassed) and Case 8 (why does advantage transfer to the university but not the children?). To make your verdicts cohere, you need to shift the currency from "advantage" to **"authorized agency."**

  Here is a principle that captures 90% of your intuitions, tight enough to apply, followed by the stress test and the admission of failure.

  ### The Principle: Volitional Integrity

  **Moral debt is created only when an agent voluntarily appropriates the agency of another (or the moral order) for their own will. It is discharged only by the agent's voluntary realignment with that order. Suffering is not the currency; integrity is.**

  **The Clauses:**

  1.  **The Agency Clause:** Debt requires effective authorship. If the will is bypassed (biology, coercion), no debt is incurred.
      *   *Motivated by Case 3 (Tumor).* The act occurred, but the agent did not author it.
  2.  **The Intent Clause:** The moral value of an act is determined by the will's orientation, not the outcome. Good outcomes do not wash out bad wills; bad outcomes do not erase good wills.
      *   *Motivated by Case 4 (Mixed Motive) & Case 6 (Cruelty/Good Outcome).* In 6, the debt remains because the will was cruel. In 4, credit is partial because the will was divided.
  3.  **The Discharge Clause:** Debt is a disruption in the agent's moral continuity. It is closed only by conscious recognition and restitution. Passive changes (forgetting, dying, time passing) do not close the ledger.
      *   *Motivated by Case 1 (No Regret), Case 2 (Regret), & Case 9 (Amnesia).* In 1, the loop is open. In 2, the agent manually closes the loop. In 9, the loop is broken, not closed; the debt remains "outstanding" even if the debtor is unrecognizable to himself.
  4.  **The Continuity Clause:** Debt attaches to the continuity of the *moral project*, not biological succession. If the entity persists as a decision-making body with the same ends, the debt persists. If the entity is merely a biological beneficiary with no continuity of will, the debt does not transfer.
      *   *Motivated by Case 8 (Children vs. University).* The University is a continuing moral agent holding the same endowment (the project continues). The children are biological beneficiaries; their wills are distinct from the father's.
  5.  **The Independence Clause:** Physical suffering is not the mechanism of payment. A virtuous life creates no debt, regardless of physical suffering.
      *   *Motivated by Case 10 (Good Person/Cancer).* To say the cancer was "owed" violates the Agency Clause (they did not author harm). Therefore, the suffering is tragic noise, not karmic settlement.

  ---

  ### The Stress Test: A New Case

  **Case 11:** A dictator orders a massacre to secure his power. He is overthrown, flees the country, converts to a peaceful religion, and lives the rest of his life in quiet meditation, never punished by law. He dies peacefully.

  **Verdict under Volitional Integrity:**
  *   **Debt Status:** Outstanding.
  *   **Reasoning:** Under the **Discharge Clause**, internal conversion *might* count as realignment, but because the act involved the *appropriation of others' agency* (massacre), restitution is required to close the loop. Meditation does not restore the victims' agency. Under the **Independence Clause**, his peaceful death is not proof of innocence; it is merely a physical fact. The books remain open metaphysically, even if closed physically.
  *   **Why this tests the principle:** It forces you to decide if "internal realignment" (Case 2) is enough for *massive* harm. Your intuition in Case 2 was "repays what he can... debt is gone." In Case 11, he cannot repay. The principle suggests the debt remains *because* restitution is impossible, not because he didn't regret it. This might clash with your intuition in Case 2 if you feel regret alone was the magic bullet there.

  ---

  ### The Unsavable Verdicts

  No principle saves everything. Here is where **Volitional Integrity** breaks your specific intuitions:

  **1. Case 7 (The Indoctrinated Soldier)**
  *   **Your Intuition:** Back and forth.
  *   **Principle's Verdict:** **Debt Incurred (Mitigated).**
  *   **Why:** The **Agency Clause** is satisfied. The will was intact; he deliberated. The fact that his "moral information" was wrecked is an epistemic failure, not a volitional bypass (like the tumor in Case 3).
  *   **The Conflict:** Your intuition hesitates because it feels unfair to blame him for information he couldn't access. But if you excuse him, you undermine the **Intent Clause** (the will *did* choose cruelty). You have to choose: Is karma about *truth* (he violated objective morality) or *conscience* (he followed his lights)? Your Case 5 uncertainty suggests you haven't picked. This principle picks Truth.

  **2. Case 5 (Generous vs. Conscience)**
  *   **Your Intuition:** "No idea."
  *   **Principle's Verdict:** **Net Zero (or Internal Debt).**
  *   **Why:** He generated objective good (Credit) but violated his own moral integrity (Debt). The **Intent Clause** says will matters. His will was aligned with the Good, but misaligned with his Conscience.
  *   **The Conflict:** This creates "internal karma." He suffers dissonance. If you want karma to be purely external, this case breaks the model. If you accept internal dissonance as the "payment," it holds.

  **3. Case 9 (Amnesia) vs. Case 2 (Regret)**
  *   **Your Intuition:** In Case 2, psychological change discharges debt. In Case 9, psychological change (amnesia) does *not*.
  *   **Principle's Verdict:** **Consistent (Debt Remains in 9).**
  *   **The Conflict:** This is the strongest tension in your own thinking. In Case 2, the agent *actively* closes the loop. In Case 9, the loop is *passively* severed. The principle says passive severing isn't payment. If your gut says Case 9 *should* clear the debt because "he's a different person now," then the **Continuity Clause** must be weakened to allow for psychological discontinuity to erase debt. But if you do that, Case 1 (the fraudster who just moves on) might also slip through if he changes his personality enough. You cannot have it both ways: either psychological continuity matters (Case 9 debt remains) or it doesn't (Case 9 debt clears). The principle forces you to say **Case 9 debt remains.**

  ---

  ### The Metaphysical Worry

  > *"If karma is supposed to be built into how things work rather than handed out by anyone, then can it ever fail to arrive? And if it can't fail to arrive, is it still desert, or just causation with a moral-sounding label?"*

  This worry does not sink the project, but it forces a categorization choice.

  1.  **If Karma is Causation:** It cannot fail to arrive. Case 1 (Fraudster dies happy) is proof that Karma *does not exist* as a physical law. The universe clearly allows unbalanced ledgers physically.
  2.  **If Karma is Desert:** It *can* fail to arrive in the physical world. Case 1 is an *injustice*, not a disproof of karma.

  Your intuitions (especially Case 10 and Case 1) commit you to **Karma as Desert, not Law.**
  You are rejecting the idea that the universe *mechanically* enforces balance. You are asserting that there *is* a balance sheet, but the physical world is not the accountant.

  **The Cost of This Choice:**
  If karma is desert and not law, it loses its explanatory power for suffering. You cannot look at a suffering person and say "this is their karma." You must say "this might be karma, or it might be Case 10 (noise)."
  This saves your moral intuitions but kills karma as a **theodicy** (a justification of why bad things happen). It becomes purely a **moral accounting system** that the physical world is under no obligation to enforce.

  ### Summary Recommendation

  Your "unpaid advantage" idea was the right currency, but it needed to be specified as **"Unauthorized Appropriation of Agency."**

  *   **Keep:** The distinction between biological inheritance and institutional continuity (Case 8). That is a profound insight about moral projects.
  *   **Keep:** The refusal to call Case 10 "owed." This protects the theory from becoming victim-blaming.
  *   **Decide:** On Case 7 (Indoctrination). You must choose whether ignorance excuses the will. The principle above says **no**, but your hesitation suggests you might want a "Epistemic Mitigation Clause."
  *   **Accept:** That under this theory, the universe is not just. The ledger exists, but the physical world often ignores it. That is what makes it "desert" rather than "gravity."

  Your gut adds up to a coherent theory of **Non-Natural Moral Realism.** It works, provided you accept that the "payment" often never comes in the currency of this world.
