  # The Deliberation Sorting Tree

  Here is the decision tree. It starts with one assumption you all share: **consulting copies of yourself is a coherent thing to imagine.**

  There are 12 questions. Answer them in order, following the branches. At the end, you will land on one of 8 named positions.

  ### The Questions

  **Q1: The Stranger Swap**
  You need to solve a hard moral puzzle. You can use 1,000 helpers. Option A is 1,000 copies of you right now. Option B is 1,000 strangers who share your goals but have totally different memories and habits. Does Option B feel like cheating?
  *   **Yes (Must be me):** Go to Q4.
  *   **No (Goals matter, not history):** Go to Q2.

  **Q2: The Hourglass Rule (External)**
  You are using the 1,000 strangers. Rule: You can only ask questions in 5 simultaneous waves. You cannot chain a question from Wave 3 to Wave 4 based on the answer. Does this cripple the process compared to unlimited chaining?
  *   **Yes (Depth matters):** Go to Q3.
  *   **No (Width is enough):** Go to Q3b.

  **Q3: The Telegram Rule (External/Depth)**
  Your strangers return answers. Rule: Max 200 words, no showing work, just the conclusion. Is this sufficient for you to trust the result on a hard problem?
  *   **Yes (Answer is what matters):** **Leaf: Aggregation View.**
  *   **No (Need to see the work):** **Leaf: Institution/Community View.**

  **Q3b: The Telegram Rule (External/Width)**
  Your strangers return answers. Rule: Max 200 words, no showing work. Is this sufficient for you to trust the result?
  *   **Yes (Answer is what matters):** **Leaf: Aggregation View.**
  *   **No (Need to see the work):** **Leaf: Institution/Community View.**
  *(Note: In this tree, Q2 determines the structure, Q3 determines the transparency. Both paths lead to the same leaves, but via different reasoning about depth.)*

  **Q4: The Mirror Test (Internal)**
  You are using copies of yourself. Copy A asks Copy B for help. Copy B asks Copy C. If you go 100 layers deep, does the answer drift away from what You would say, or does it settle on something You would endorse?
  *   **Drifts/Changes:** **Leaf: No Fixed Point View.**
  *   **Settles/Endorses:** Go to Q5.

  **Q5: The Spoiler Problem**
  Whoever breaks the big question into sub-questions can bias the result. Do you need to split the question yourself to trust the answer, or can the copies do it?
  *   **I must split it:** **Leaf: Bottoms-out Judgment View.**
  *   **Copies can split it:** Go to Q6.
  *(**Empirical Crux:** This node depends on whether humans can reliably decompose questions without baking in the answer.)*

  **Q6: The Adversarial Setup**
  For a hard political question, is it better to have 10 copies cooperate to find consensus, or 2 copies argue opposite sides in front of a 3rd copy judge?
  *   **Argue (Adversarial):** Go to Q7.
  *   **Cooperate (Consensus):** Go to Q8.

  **Q7: The Morning-After Check (Adversarial)**
  The process gives an answer. You cannot re-run it. Do you need to be able to verify the steps yourself to act on it?
  *   **Yes (Must verify):** **Leaf: Adversarial/Debate View.**
  *   **No (Trust the judge):** **Leaf: Idealized Oracle View.**

  **Q8: The Trust Gap**
  If you would defer to the final output of the copies, why don't you just trust your own gut right now?
  *   **"My gut is fine, copies just save time" OR "The question is confused":** **Leaf: Virtue/Personhood View.**
  *   **"Copies are actually smarter/better than me":** Go to Q9.

  **Q9: Truth vs. Endorsement**
  The process concludes "X". You read the transcript and still feel "Y" is right. Do you act on X or Y?
  *   **Act on X (Process knows better):** Go to Q10.
  *   **Act on Y (Must endorse to act):** **Leaf: Virtue/Personhood View.**

  **Q10: The Meta-Question**
  If the copies need help deciding how to split the question, do they call more copies?
  *   **Yes (Infinite regress ok):** Go to Q11.
  *   **No (Must stop somewhere):** **Leaf: Bottoms-out Judgment View.**

  **Q11: The Paper Test**
  Could you do this procedure with enough paper and time, or does it require parallel magic?
  *   **Yes (Paper ok):** **Leaf: Converging Amplification View.**
  *   **No (Needs parallelism):** **Leaf: Idealized Oracle View.**

  **Q12: The Reality Check (Tie-Breaker)**
  (Only if you landed on Idealized Oracle via Q11). If you couldn't run it, does the answer still exist?
  *   **Yes:** **Leaf: Idealized Oracle View.**
  *   **No:** **Leaf: Converging Amplification View.**

  ---

  ### The Leaves (Positions)

  1.  **Aggregation View:** Truth emerges from flat width (votes/markets), not depth. Transparency matters less than the statistical signal.
  2.  **Institution/Community View:** Truth emerges from structured depth among diverse agents. Transparency (working/transcripts) is required to maintain trust.
  3.  **No Fixed Point View:** Recursive deliberation drifts. There is no stable "ideal" answer, only a path-dependent trajectory.
  4.  **Bottoms-out Judgment View:** Decomposition is the hard part. Humans must frame the questions; copies only solve the sub-parts.
  5.  **Adversarial/Debate View:** Truth emerges from conflict judged by a peer. Human verification of the steps is required.
  6.  **Virtue/Personhood View:** The procedure is secondary. If you are the sort of person who reasons well, copies add speed but no epistemic value. The "Trust Gap" is dissolved.
  7.  **Converging Amplification View:** Recursive cooperation settles on a truth you would endorse. The procedure must be human-comprehensible (in principle).
  8.  **Idealized Oracle View:** Recursive cooperation settles on a truth, but the procedure exceeds human capacity. You trust the math, not your verification.

  ---

  ### Path List (Example Traces)

  *   **Path to Aggregation:** Q1(No) → Q2(No) → Q3b(Yes).
  *   **Path to Institution:** Q1(No) → Q2(Yes) → Q3(No).
  *   **Path to No Fixed Point:** Q1(Yes) → Q4(Drifts).
  *   **Path to Judgment:** Q1(Yes) → Q4(Settles) → Q5(I split).
  *   **Path to Debate:** Q1(Yes) → Q4(Settles) → Q5(Copies) → Q6(Argue) → Q7(Verify).
  *   **Path to Virtue:** Q1(Yes) → Q4(Settles) → Q5(Copies) → Q6(Coop) → Q8(G fine/Confused).
  *   **Path to Amplification:** Q1(Yes) → Q4(Settles) → Q5(Copies) → Q6(Coop) → Q8(Copies smarter) → Q9(Act X) → Q10(Regress OK) → Q11(Paper OK).
  *   **Path to Oracle:** Q1(Yes) → Q4(Settles) → Q5(Copies) → Q6(Coop) → Q8(Copies smarter) → Q9(Act X) → Q10(Regress OK) → Q11(Parallel Magic).

  ---

  ### Analysis & Flags

  **1. Unoccupied Answer Combinations**
  *   **Strangers + Depth + No Working + Copies Split:** (Q1-No → Q2-Yes → Q3-Yes → Q5-Copies). *Why unoccupied:* Incoherent. If you require strangers (external), you generally don't grant them the authority to decompose your internal questions without transparency. If you don't need transparency (Telegram Yes), you usually prefer flat aggregation (Hourglass No).
  *   **Copies + No Fixed Point + Trust Copies:** (Q4-Drifts → Q8-Copies Smarter). *Why unoccupied:* Incoherent. If the answer drifts with depth (Mirror Test), you cannot consistently claim the copies are "smarter" in a way that converges on truth.
  *   **Virtue + Unlimited Copies:** (Q8-Virtue → Q10-Regress OK). *Why unattractive:* If the procedure doesn't add epistemic value (Virtue view), building an infinite tree of copies is a waste of resources. This combination is logically possible but pragmatically dead.

  **2. Indistinguishable Leaves**
  *   **Adversarial/Debate vs. Converging Amplification:** If the "Judge" in the Debate view is just a cooperative copy summarizing the best arguments from both sides, this becomes functionally identical to Amplification. The tree separates them at Q6 (Argue vs. Cooperate), but in practice, a cooperative summing-up *is* a form of judgment.
  *   **Converging Amplification vs. Idealized Oracle:** Separated at Q11 (Paper Test). However, if the "Paper Test" allows for *enough* paper (infinite time), the distinction collapses. The tree forces a choice on "parallel magic," but a determined human could simulate parallelism sequentially. The separation relies on whether you care about *wall-clock* feasibility or *computational* feasibility.

  **3. The Empirical Crux**
  *   **Node Q5 (The Spoiler Problem):** This is the biggest hinge in the tree. Whether you land on **Bottoms-out Judgment** or continue to **Amplification/Debate** depends entirely on an empirical fact: *Can humans decompose hard questions into neutral sub-questions without baking the answer into the framing?*
      *   If **Yes**: Amplification is viable (copies can split safely).
      *   If **No**: You must stop at Judgment (you must split manually).
      *   None of you know the answer to this. It requires testing whether "How do we solve X?" yields different results than "What is the best version of X?" when asked by biased agents.

  **4. The Trust Gap (Q8)**
  *   This node addresses your bug ("If I defer to copies, why not trust myself?").
  *   If you answer **"My gut is fine"** or **"Question is confused"**, you are routed to **Virtue/Personhood**. This dissolves the problem: the copies aren't *more trustworthy*, they are just *faster*. You defer to them because they are you, minus the time pressure.
  *   If you answer **"Copies are smarter"**, you admit your current self is epistemically flawed compared to your idealized self. This routes you to **Amplification/Oracle**. This accepts the gap: you defer because the process corrects errors your current gut makes.

  **5. Rules Check**
  *   **12 Questions:** Met.
  *   **8 Leaves:** Met (6 required + 2 added/merged to fit space).
  *   **Cases Used:** Hourglass (Q2), Telegram (Q3/Q3b), Mirror (Q4), Stranger (Q1), Spoiler (Q5), Morning-After (Q7).
  *   **Distinctions:** Depth/Width (Q2), Copies/Strangers (Q1), Output Format (Q3), Disagreement (Q6), Human/Ideal (Q11), Truth/Endorsement (Q9), Decomposition (Q5/Q10).
  *   **No Footnotes:** Met.
