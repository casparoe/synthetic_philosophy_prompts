answer: |-
  **Verdict: Salvageable with specified changes**

  **Reasoning:**
  The practice is mathematically coherent but causally incoherent *as currently justified*. The officials' defense relies on a causal model that treats the polygenic score (PGS) as a measure of fixed, internal biological potential, distinct from the social environment the school is meant to remediate. Behavioral genetics does not support this distinction. However, the statistic itself is not nonsense; it can be repurposed from a tool of exoneration to a tool of diagnostic audit, provided the interpretation is radically altered.

  ### 1. The Implicit Theory
  To publish an "adjusted" gap, the school system is operating on a **linear additive causal model**. It assumes:
  *   **Partitionability:** Educational attainment is the sum of independent contributions from School Quality ($S$), Socioeconomic Status ($E$), and Genetic Propensity ($G$).
  *   **Exogeneity:** $G$ is an input determined prior to schooling and independent of $S$.
  *   **Fairness as Residualization:** A school's performance should be judged only on the variance it explains *after* $G$ and $E$ are accounted for. If low-income children have lower $G$, and the school produces outcomes matching that $G$, the school is doing its job, even if the raw gap remains wide.

  This theory treats heritability not as a population statistic (the ratio of genetic variance to total variance in a specific context), but as an **individual attribute of malleability**. It assumes that because a trait is heritable, the variance associated with it is "harder" or less the school's responsibility than variance associated with income.

  ### 2. The Polygenic Score Problem (Genetic Nurture)
  The critical failure in the implicit theory is the treatment of the PGS as a measure of the *child's* biology alone. In human observational data, a PGS for education captures two distinct pathways:
  1.  **Direct Effects:** The child's alleles influencing their cognitive processing or behavior.
  2.  **Indirect Effects (Genetic Nurture):** The parents' alleles influencing the home environment (e.g., parents with high education-PGS tend to earn more, read more, and provide more stability, regardless of which alleles they transmitted).

  By controlling for the child's PGS, the model statistically removes variance caused by the **parents' socioeconomic capacity**, because that capacity is correlated with the child's score. The "adjusted" gap does not ask, "How did the school perform given the child's biology?" It asks, "How did the school perform given the child's biology *and* the genetic component of their home advantage?"

  ### 3. Heritability and Unmalleability
  Does the practice presuppose heritability measures unmalleability? **Yes, operationally.**
  While a defender could theoretically argue, "We know traits are malleable, we just want to isolate the school's specific contribution," the act of netting out PGS treats that variance as a **fixed constraint**. If the school could radically improve outcomes for low-PGS children, the raw gap would close, but the adjusted gap would widen (because the school would be moving children *off* their genetic trajectory). By privileging the adjusted figure as "fairer," the system implies that moving children off their genetic trajectory is not the school's job, or is impossible. It reifies the status quo of genetic stratification as a baseline expectation rather than an inequality to be overcome.

  ### 4. The "Fixed Input" Error
  Treating the score as a fixed input goes wrong precisely because **the score partly encodes the disadvantage being measured.**
  If low income correlates with lower PGS (due to assortative mating and historical stratification), and lower PGS correlates with lower attainment partly *because* of the home environment associated with those genes, then controlling for PGS controls for the mechanism of social reproduction.
  *   **What the adjusted number means:** It measures how well the school replicates existing genetic and familial hierarchies.
  *   **Does it matter?** Yes. It renders the metric useless for equity. A school could be failing to compensate for social disadvantage, but if it is successfully sorting children by genetic propensity, it will look "fair" on the adjusted metric.

  ### 5. The School Profile: Good Adjusted / Bad Raw
  At a school that scores well on the adjusted gap but badly on the raw one, you would see **efficient tracking.**
  *   **Raw Data:** High-income children are outperforming low-income children by a wide margin.
  *   **Adjusted Data:** Among children with *identical* polygenic scores, the income gap is small or non-existent.
  *   **Reality:** The school is providing high-quality instruction to high-PGS children (who are disproportionately wealthy) and adequate instruction to low-PGS children (who are disproportionately poor). They are not closing the social gap; they are merely ensuring that social class doesn't add *extra* disadvantage beyond what is already predicted by genetics and family background. They are acting as a **sorting machine**, not an equalizer. They are validating the idea that poor children with low PGS *should* achieve less.

  ### 6. Underdetermination
  The practice is underdetermined because the same adjusted number can be generated by mutually exclusive causal stories:
  1.  **The Optimist's View:** Schools are equally effective across income groups; the raw gap is purely due to pre-existing genetic/family differences.
  2.  **The Pessimist's View:** Schools are equally *ineffective* at mitigating genetic nurture; the home environment drives the outcome, and school adds little value to anyone.
  3.  **The Stratification View:** Schools are actively reinforcing genetic stratification. High-PGS kids get enriched tracks; low-PGS kids get remedial tracks. The "adjusted" gap is small because the school treats kids of the same genetic potential similarly, regardless of income, but ignores the fact that income and genetics are confounded.

  You cannot distinguish these scenarios with the adjusted number alone.

  ### 7. The Hardest Part to Defend
  The section I would least want to defend to a behavioral geneticist is the claim that the practice is **"Salvageable."**
  A rigorous geneticist would argue that because population-level PGS captures population structure and genetic nurture, it is **causally uninterpretable** as a control variable for individual potential. To claim it can be "salvaged" implies there is a clean way to separate the "biological" PGS from the "environmental" PGS in this context. There isn't, not without within-family designs (comparing siblings), which school systems do not have. Defending the idea that this number can be *useful* at all, even as a diagnostic, risks legitimizing a metric that fundamentally misrepresents the nature of gene-environment interplay. The "salvage" requires admitting the number tells you nothing about biological potential, only about social stratification—which negates the officials' original intent entirely.

  ### Summary for your Piece
  The school system is attempting to solve a political problem (accountability in poor areas) with a biological statistic that does not measure what they think it measures. They are treating a **correlational index of social advantage** (PGS) as a **measure of biological fixedness**. The "adjusted" gap is not a measure of school quality; it is a measure of how faithfully schools reproduce the existing genetic and social hierarchy. It is salvageable only if they stop calling it "fairness" and start calling it "stratification auditing."
