      *   *Better Analogy:* Modus Ponens. $A, A \to B \vdash B$. The rule doesn't tell you which $A$ is true. Does that make logic vacuous? No.
      *   *Specific Rejection:* Reject (6). A norm can be conditional on facts not specified by the norm itself.
      *   *Specific Rejection of (3)/(4):* These violate the *Rigidity Condition* in spirit. If the partition is atoms, the experience isn't "uncertain evidence about E," it's "certainty about the world." JC is specifically for *partial* shifts.

