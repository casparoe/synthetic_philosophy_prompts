  2. Bernard Williams's **"One Thought Too Many"** fits your kidney case by suggesting deliberation alienates the agent from the ground of action. This view is widely accepted for personal relationships but rejected by Kantians for impartial moral duties.
  3. **Virtue Ethics** posits that reasons are operative as dispositions rather than premises, matching your second case. However, it struggles to explain why the agent accepts the observer's reason if not already motivated by it.
  4. **Reasons Internalism** requires reasons to be operative in deliberation to count as the agent's, which contradicts your intuition that the non-deliberating donor acts for the right reason. This concept differs from your description by denying the status of reasons that are merely attributable from outside.
  5. The best fit is the **"Overintellectualization Objection,"** which claims moral worth diminishes when right action requires explicit inference. It lacks a unified theory for when deliberation is required versus when it is suspect, leaving your boundary cases unresolved.
