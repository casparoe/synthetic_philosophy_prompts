          *   Specific inclusion: Deep learning classifiers (CNNs) that don't track the invariant + countering the "that's a research program" deflection.
          *   **Crucial Constraint:** Distinguish settled science from contested theory. Do *not* present Skeletal Invariantism as mainstream. Acknowledge it's a minority/fringe view compared to distributed/flexible recognition models.

