answer: |-
  1. A: Sam suffered testimonial injustice because prejudice deflated his credibility specifically in his capacity as a knower.
     B: That's just status subordination; the prejudice targets his rank, not his rationality, and the harm is purely professional exclusion.

  2. A: But being failed as a source of knowledge is a distinct insult from being disliked; it denies his agency, not just his opportunity.
     B: If the outcome is identical—silenced voice, lost promotion—splitting hairs about agency doesn't change the remedy.

  3. A: Tell him to speak up louder, and he hits the corroboration bind: over-preparing reads as insecurity, dropping his credibility further.
     B: Exactly, which proves the mechanism is social signaling; if the fix requires him to play the status game better, it's not an epistemic crisis.

  4. A: Credibility escrow fixes the bias by judging the claim blind.
     B: But if you must hide who's speaking to get a fair hearing, you've got the outcome without ever giving Sam the thing he was owed.

  5. A: He needs to be believed *as Sam*; without that recognition, he remains a tool for others' insights rather than an agent.
     B: But if the truth wins anonymously, what practical difference does the label make; isn't justice just getting the right result regardless of the messenger?
