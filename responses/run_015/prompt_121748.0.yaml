answer: |-
  1. **The Utility of the Scheme**
     You're defending Jaspers's four-fold scheme as a tool for today, but Jaspers wrote this to stop the Allies from painting all Germans with the same brush. If we use these categories now to discuss national guilt, aren't we risking the very collective condemnation Jaspers tried to prevent?
     *Follow-up:* If he argues that the scheme *prevents* blanket condemnation by sorting guilt types, ask: "Does separating political guilt from moral guilt actually let individuals off the hook too easily by saying, 'I'm politically liable, but morally clean'?"

  2. **Political Guilt Under Tyranny**
     Let's look closely at political guilt. Jaspers argues citizens share responsibility for their state's actions. But how does this apply to citizens living under an authoritarian regime with zero democratic input? If I had no vote and dissent meant death, in what sense is my citizenship a consent to state crimes?
     *Follow-up:* If he says "citizenship implies a baseline consent to the social contract," push back: "Is that a philosophical fiction when the contract is enforced by the gun? Does political guilt require some minimum capacity to influence the state?"

  3. **The Cost of Political Guilt**
     Assuming we accept political guilt even under authoritarianism, what is the cash value of that guilt? Does it demand reparations, loyalty to new institutions, or just a passive acceptance of sanctions? Where does the obligation end?
     *Follow-up:* If he says "it demands restructuring the state," ask: "At what point does political restructuring bleed into moral guilt for the individuals enforcing the new order?"

  4. **Inheriting Moral Guilt**
     Jaspers insists moral guilt is strictly individual—a matter of conscience for what *you* did. But today, many argue descendants inherit moral obligations from their ancestors' injustices. If you defend Jaspers, do you have to say a beneficiary of past crimes bears no moral guilt, only political liability?
     *Follow-up:* If he says "moral guilt cannot be inherited," press: "Then how do you account for the moral weight of benefiting from wealth or status built on atrocities? Is 'benefit' morally neutral if the source was criminal?"

  5. **The Bystander and Moral Guilt**
     Where does the line sit between political and moral guilt for the bystander? If I knew about the crimes but stayed silent to protect my family, Jaspers might call that moral guilt. But if silence was the norm enforced by terror, is it fair to judge that silence as a moral failure rather than a political survival tactic?
     *Follow-up:* If he says "conscience always remains free," ask: "Does that assume a level of psychological safety that didn't exist? Can you really demand moral heroism when the cost is your life?"

  6. **Metaphysical Guilt vs. Solidarity**
     This is the most abstract category: metaphysical guilt. You survive when others die; you feel co-responsibility for every wrong committed in the world. At what point does this become so diffuse that it stops being "guilt" and becomes just existential solidarity? Why use the word guilt at all?
     *Follow-up:* If he says "it's existential, not legal or moral," ask: "If it's not judged by humans or courts, but only by God, what work is the concept doing in a secular political discussion? Does it risk becoming meaningless?"

  7. **Metaphysical Guilt and Action**
     Following on that, if metaphysical guilt is judged only by God, does it let us off the hook socially? Can someone claim they feel metaphysical guilt but refuse to take any concrete political action to fix the world?
     *Follow-up:* If he says "it should inspire transformation," ask: "But if there's no external standard for that transformation, isn't it just a private feeling? How do we distinguish genuine metaphysical guilt from performative remorse?"

  8. **Criminal Guilt and the State**
     Finally, criminal guilt is the clearest: you broke the law, you go to court. But when the state itself is criminal, the law is corrupted. How do we adjudicate criminal guilt without relying on the very legal structures that enabled the regime?
     *Follow-up:* If he says "we need universal human rights standards," ask: "Who enforces those standards without becoming a new hegemon? Does Jaspers's scheme rely on a victor's justice he claimed to oppose?"

  ***

  **Confidence and Notes**
  I'm about 85% confident these questions capture Jaspers's distinctions accurately, particularly the strict separation he maintains between individual moral guilt and collective political guilt. I'm least sure about the framing of **Question 4**, because Jaspers is unequivocal that moral guilt *cannot* be inherited, so pressing the guest on this might force them to either contradict Jaspers or explain why his framework needs updating, which could muddy the "defense" premise. Also, I noticed a typo in your prompt ("authoritarion" and "distictions"), which I've corrected in my internal processing but wanted to flag here.
