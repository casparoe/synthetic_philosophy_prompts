answer: |-
  This is a sophisticated request that cuts to the heart of institutional ethics. You are asking for a *procedural technology* that forces moral consistency without requiring your committee to resolve metaphysical debates in real-time.

  Below is the toolkit. It is divided into three parts:
  1.  **A Note to the Chair (Theory):** Why this works and where the bodies are buried.
  2.  **The Committee Toolkit:** The *Species Capacity Profile* (the Register) and the *10-Minute Decision Protocol* (the Checklist).
  3.  **The Test Run:** Three sample protocols with draft minutes.

  ---

  # Part 1: A Note to the Chair (Theory)

  **Do not distribute this section to the committee.** This is for you to understand the machinery you are operating.

  **The Core Mechanism:**
  You cannot solve the "moral weight" problem objectively. There is no conversion rate between mouse pain and human knowledge. Instead, this procedure relies on **Consistency** and **Transparency**.
  1.  **The Capacity Profile** locks in your assumptions about species *before* the pressure of a specific grant application. It prevents you from calling a pig "cognitively complex" when arguing for enrichment but "biologically simple" when arguing for necessity.
  2.  **The Capacity-Matched Consistency Test** (your "Human Analog" idea) is not a proposal to use humans. It is a *reductio ad absurdum* test. If the justification for the animal protocol relies on premises that would be rejected for a human of similar cognitive capacity, the justification is speciesist. The committee must then explicitly state *why* species membership matters more than capacity in this specific instance.
  3.  **The Value Judgment Log:** Most ethics violations in committees aren't rule-breaking; they are unacknowledged value judgments disguised as facts. By forcing a checkbox that says "We are making a value judgment here," you protect the committee from later claiming "we didn't know."

  **Where This Will Misfire:**
  1.  **The "Human Analog" Pushback:** Your advocate will eventually ask: "If we wouldn't do this to a profoundly disabled infant with the cognitive capacity of a mouse, why do we do it to the mouse?" The procedure does not answer this. It forces the committee to answer it on the record. If they say "Because they are mice," that is a valid ethical stance (speciesism), but it must be recorded as a value judgment, not a scientific fact.
  2.  **The Breeding Surplus:** This procedure will likely flag your breeding colony as ethically unsustainable. It produces harm (death of healthy animals) with zero scientific benefit. The procedure cannot fix this without administrative action to reduce breeding or find uses for the surplus.
  3.  **Time:** Ten minutes is tight. This requires the PI to submit a "Harm-Benefit Summary" *before* the meeting. If they don't, the protocol is tabled. You cannot do this analysis if you are reading the protocol for the first time in the room.

  ---

  # Part 2: The Committee Toolkit

  ## A. The Species Capacity Profile (The Register)
  *To be reviewed and voted on annually, not per protocol. This sets the baseline "moral weight" for each species.*

  | Species | Pain/Sentience Confidence | Cognitive/Social Complexity | "Capacity-Matched Human Analog" (For Consistency Test Only) | Default Burden Weight (1-10) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Crayfish/Inverts** | Uncertain (Precaution Applied) | Low | N/A | 1 |
  | **Mouse/Rat** | High | Low-Moderate (Social/Anxiety) | Infant / Severe Cognitive Impairment | 3 |
  | **Rabbit** | High | Moderate (Social) | Young Child | 4 |
  | **Pig** | High | High (Problem Solving/Social) | Older Child / Adolescent | 7 |
  | **Macaque** | High | Very High (Self-Aware/Complex) | Adult Human (Cognitively Limited) | 9 |

  *Note: The "Human Analog" column is **not** permission to use humans. It is a standard for consistency. If we ascribe rights to the Human Analog that we deny the Animal, we must justify the difference.*

  ## B. The 10-Minute Decision Protocol
  *To be run during the meeting. The Chair facilitates. The Vet and Lay Members are primary auditors.*

  ### Step 1: The Capacity Check (1 Minute)
  **Question:** What species are involved, and does the protocol acknowledge their Capacity Profile?
  *   **Adequate Answer:** "We are using pigs. We acknowledge their high cognitive score and have included enrichment X and Y."
  *   **The Dodge:** "They are just livestock." / "We treat them like standard large animals."
  *   **Action:** If the protocol treats a high-capacity species as low-capacity (e.g., no enrichment for pigs), **Stop.** Require modification.

  ### Step 2: The Burden Assessment (2 Minutes)
  **Question:** What is the maximum harm to a single individual? (Pain, distress, duration, death).
  *   **Adequate Answer:** "Category E (Pain relieved). 10% will experience breakthrough pain for <4 hours. All euthanized at endpoint." (Specific numbers required).
  *   **The Dodge:** "Minimal distress." / "Standard veterinary care." / "The literature supports this level."
  *   **Action:** Assign a **Burden Score** (Low/Med/High) based on the Profile Weight.

  ### Step 3: The Benefit Specificity (2 Minutes)
  **Question:** What specific knowledge is gained, and what is the probability of success?
  *   **Adequate Answer:** "We will determine if Receptor X mediates Behavior Y. Probability 60% based on Pilot Data Z."
  *   **The Dodge:** "It could lead to a cure for Alzheimer's." / "It is foundational knowledge." / "The field needs this."
  *   **Action:** If the benefit is >1 step removed from a human/animal health outcome, mark as **Basic/Curiosity**.

  ### Step 4: The Capacity-Matched Consistency Test (3 Minutes)
  **Question:** If the subjects were humans with the cognitive capacity of these animals (see Profile), would this protocol be permissible?
  *   **Adequate Answer:** "No. We would not subject a cognitively matched human to this pain. We are justifying this because animal species do not have the same rights as humans, despite similar capacity."
  *   **The Dodge:** "That's not a fair comparison." / "Humans are different." (Without saying *why*).
  *   **Action:** If the answer is "No," the committee must explicitly record the **Speciesism Justification** in the minutes (see Step 6).

  ### Step 5: The Replacement/Reduction Trade-off (2 Minutes)
  **Question:** Does replacing this species with a lower-capacity species (e.g., Mouse for Macaque) actually reduce total moral burden?
  *   **Adequate Answer:** "12 Macaques (Weight 9) = 108 Units. 240 Mice (Weight 3) = 720 Units. The mouse model increases total burden units, despite lower individual capacity."
  *   **The Dodge:** "Mice are cheaper." / "We can get more statistical power." (Without addressing the burden multiplier).
  *   **Action:** If the swap increases Total Burden Units significantly, flag for **Senior Review**.

  ### Step 6: The Decision & Minute Entry (Final)
  **Decision:** Approve / Modify / Deferral / Reject.
  **Minute Requirement:** You must check one of the following boxes in the official record:
  *   [ ] **Fact-Based:** All criteria met objectively.
  *   [ ] **Value Judgment:** The benefit outweighs the burden based on committee consensus, acknowledging the harm.
  *   [ ] **Species Distinction:** The protocol relies on species membership rather than capacity to justify harm (requires explicit vote).

  ---

  # Part 3: The Test Run (Sample Minutes)

  Here is how the procedure handles your three specific cases.

  ### Case 1: Curiosity-Driven Mouse Study
  **Protocol:** Receptor X knockout, social behavior observation.
  **Harm:** Moderate (isolation stress, genetic phenotype causes anxiety).
  **Benefit:** "Understanding neural circuitry of social interaction." No named disease application.

  **Committee Discussion:**
  *   **Capacity:** Mouse (Weight 3).
  *   **Burden:** High for this species (social isolation is significant harm for mice).
  *   **Benefit:** Basic science only. No direct therapeutic path.
  *   **Consistency Test:** Would we isolate a cognitively matched human infant to study social circuits? No.
  *   **Justification:** PI argues "foundational knowledge is prerequisite for cures."

  **Decision:** **Approved with Value Judgment.**
  **Minutes Entry:**
  > "Committee reviewed Protocol #2023-04. Burden assessed as High for species (social deprivation). Benefit assessed as Basic/Curiosity (no direct therapeutic application identified).
  > [x] **Value Judgment Box Checked.** Committee acknowledges the harm exceeds direct medical benefit. Approval granted on the grounds that foundational circuit mapping is a necessary prerequisite for future translational work.
  > [x] **Species Distinction Box Checked.** Committee acknowledges a capacity-matched human subject would not be subjected to this isolation. Justification rests on the moral distinction between *Mus musculus* and humans."

  *Chair's Note:* This passes, but the minutes now clearly show you are approving harm for *potential* future gain, not current benefit. If you get audited, you have admitted the trade-off.

  ### Case 2: The Macaque-to-Mouse Swap
  **Protocol:** PI wants to switch from 12 Macaques to 240 Mice because "funding is tighter." PI admits mouse model is less predictive.
  **Harm:** Macaques (High individual harm); Mice (Lower individual harm, high numbers).
  **Benefit:** Same scientific question.

  **Committee Discussion:**
  *   **Capacity:** Macaque (Weight 9) vs. Mouse (Weight 3).
  *   **Burden Calculation:**
      *   Macaques: 12 * 9 = 108 Burden Units.
      *   Mice: 240 * 3 = 720 Burden Units.
  *   **Science:** PI admits mouse model is *worse* science.
  *   **Consistency Test:** The swap increases total burden units by 6x and lowers scientific validity.

  **Decision:** **Deferred / Rejected.**
  **Minutes Entry:**
  > "Committee reviewed Protocol #2023-09 (Amendment). Proposal to substitute 240 mice for 12 macaques.
  > [x] **Fact-Based Rejection.** Under the Species Capacity Profile, the proposed mouse protocol generates 720 Weighted Burden Units compared to 108 Units for the macaque protocol.
  > [x] **Scientific Validity.** Investigator acknowledged the mouse model is less predictive.
  > **Action:** Protocol denied. Increasing total burden while decreasing scientific validity violates the Reduction and Refinement principles. Investigator must secure funding for the macaque model or redesign the study to require fewer mice with higher predictive value."

  *Chair's Note:* This is the win. The math makes the decision for you. You aren't saying "Mice matter more," you are saying "The math of your own replacement strategy fails."

  ### Case 3: The Breeding Colony Surplus
  **Protocol:** Maintenance of Colony Z. 500 animals born/year. 200 used in research. 300 euthanized as "surplus" at weaning.
  **Harm:** Death of healthy animals.
  **Benefit:** None for the surplus animals.

  **Committee Discussion:**
  *   **Capacity:** Mouse (Weight 3).
  *   **Burden:** Death (Maximum burden).
  *   **Benefit:** Zero for the 300 surplus.
  *   **Consistency Test:** Would we breed 300 human infants to use 200 and euthanize the rest? Absolutely not.
  *   **Justification:** "It is standard practice for genetic colonies."

  **Decision:** **Conditional Approval (One Year).**
  **Minutes Entry:**
  > "Committee reviewed Protocol #2023-15 (Breeding). 300 animals/year identified as surplus and euthanized without experimental use.
  > [x] **Value Judgment Box Checked.** Committee acknowledges this represents harm without direct scientific benefit.
  > [x] **Species Distinction Box Checked.** Justification rests entirely on species status.
  > **Action:** Approved for 1 year only. **Condition:** PI must submit a 'Surplus Reduction Plan' within 6 months. Options include: sharing with other labs, altering breeding strategies to reduce overage, or identifying low-burden uses for surplus animals. Failure to reduce surplus by 20% will result in non-renewal."

  *Chair's Note:* This is the one that will hurt. You cannot ethically approve this indefinitely under this procedure. The "Conditional Approval" kicks the can, but the minutes create a paper trail that forces administration to address the waste.

  ---

  # Part 4: Failure Modes & The Advocate

  **Where the Procedure Will Misfire:**

  1.  **The "Human Analog" Trap:**
      *   *The Risk:* Your advocate (the reasonable one) will eventually say, "If we agree we wouldn't do this to a disabled human, and we agree the animal has the same capacity, aren't we just admitting we are bigots?"
      *   *The Reality:* Yes. The committee *is* speciesist. That is the legal and social contract of biomedical research.
      *   *The Fix:* The procedure doesn't stop this; it *names* it. When the "Species Distinction" box is checked, you are admitting: "We value this life less because of its DNA, not its capacity." This is honest. It prevents you from hiding behind "science" when the decision is actually moral.

  2.  **The "Burden Unit" False Precision:**
      *   *The Risk:* Scientists will argue about the weights. "Why is a pig a 7 and not a 6?"
      *   *The Fix:* Remind them the weights are ordinal, not cardinal. A 9 is heavier than a 3. The exact number doesn't matter, the order does. If they fight the numbers, revert to the Profile vote (annual event, not per protocol).

  3.  **The Breeding Colony Blowback:**
      *   *The Risk:* The Facility Manager will tell you this is financially impossible.
      *   *The Fix:* That is an administrative problem, not an ethical one. Your job is ethics. If the ethics don't work, the budget must change, not the ethics. The "Conditional Approval" gives them time to fix it without shutting down the school tomorrow.

  4.  **The "Standard Practice" Dodge:**
      *   *The Risk:* "Everyone else does it."
      *   *The Fix:* Your "Dodge List" in Step 2 explicitly flags this. If they say "Standard Practice," you say, "Standard practice is not an ethical justification. Please explain why *this* practice is justified."

  **Final Advice:**
  Print the **Decision Protocol** and put it in front of every member. Print the **Species Capacity Profile** and tape it to the wall. When the discussion goes in circles, point to the wall. When the scientists hand-wave, point to the Dodge List.

  You will not sleep better. But your minutes will be honest. And in this job, honesty is the only protection you have.
