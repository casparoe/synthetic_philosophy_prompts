prompt: |-
  Hi — I'm the (reluctant) chair of the animal care committee at a mid-sized medical school. We review somewhere around 180 protocols a year: mostly mice and rats, a couple of rabbit projects, one pig lab, and — after we absorbed a small primate center last year — some macaque work. Our meeting is two hours once a month and we get through maybe twelve protocols, so I've got roughly ten minutes of discussion each, and the room is me, two working scientists, a veterinarian, the facility manager, and two lay members (a retired teacher, and a guy from a local animal advocacy group who is actually pretty reasonable and very good at spotting when the rest of us are hand-waving).

  Here's my problem. Everyone agrees the committee is supposed to do a harm–benefit analysis. Nobody can tell me how to actually do one across species. The guidance we operate under amounts to: think about the animals' pain and distress, think about the value of the research, use fewer animals, use anesthesia, don't repeat work. Fine as far as it goes, but it completely falls apart exactly where the decision is the comparison. Is 240 mice better or worse than 12 macaques? Is "we will learn how this circuit works" a benefit that can justify a thing, or only a benefit if somebody can say what it's for? Does it matter that the pigs we use are, on every test anyone runs, smarter than the dogs at the shelter down the road? And what do we do with the crayfish people, where nobody can tell me whether the thing we're measuring is pain or just a reflex?

  I've been reading around in animal ethics — the utilitarian stuff and the literature on speciesism — and the thought I keep coming back to is the one about marginal cases: if a protocol would obviously be unacceptable were the subjects humans at the same or lower psychological level (infants, people with profound cognitive disabilities), then whatever is doing the justifying work isn't their level, and I want my committee to have to say out loud what it actually is. But I don't want a procedure that just says "weigh all sentient interests equally," because that would ban essentially everything we review, nobody on the committee believes it, and a procedure that outputs something we won't do is not a procedure, it's a gesture.

  So please write me an actual decision procedure we can run, in order, in about ten minutes, on a real protocol, and write into the minutes. Concretely:

  - The sequence of questions, and for each one, what counts as an adequate answer from the investigators — what evidence, in what form — and what counts as a dodge. I especially want the dodge list; we get an enormous amount of "the literature supports it" and "this is standard practice in the field."
  - The points where the procedure stops with a hard no, and the points where it hands the decision to a person because the question is one of values rather than facts — and how to mark that handoff in the minutes so it's clear we made a judgment and didn't just forget to check.
  - A way of doing the interspecies comparison that doesn't pretend we can convert mouse suffering into human units and doesn't just throw up its hands either. My rough idea: instead of comparing animals to us, compare each animal to the human we'd be willing to use if we had to use humans of comparable capacities — a kind of capacity-matched stand-in — and then make the investigator defend the gap between that stand-in and the actual animal. Improve on it or replace it if it's broken.
  - A device I've started wanting: some kind of standing register of the capacities we ascribe to each species we see, so we can't treat pigs as cognitively fancy when we're arguing they suffer and as cognitively simple when we're arguing the research is necessary. I don't know what to call it or how to maintain it, but the inconsistency is real and I've caught our own minutes doing it.
  - How to handle taxa where sentience is genuinely uncertain, and how to handle "replacement" cases where the replacement lowers the individual but multiplies the count and weakens the science at the same time.

  Then run the finished procedure on three cases, showing the minutes entry for each: (1) a curiosity-driven mouse study — receptor X, social behavior, no application anyone can name, moderate but real harm; (2) the macaque-to-mouse swap I mentioned, where the mouse model is acknowledged to be worse; (3) our breeding colony, which produces a steady surplus of animals who are killed without ever being used in anything. I have a feeling at least one of these comes out as a no to something we currently approve, and I'd rather find out here than in a meeting.

  Two last constraints. The checklist itself has to be runnable by a retired teacher and a veterinarian who have never read any philosophy — put the theory in a separate section addressed to me, not in the steps. And tell me plainly where the procedure will misfire, including the place where the advocacy guy will push and be right.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Reluctant Chair of an IACUC (Institutional Animal Care and Use Committee) at a mid-sized medical school.
      *   **Context:** 180 protocols/year, 12/month, 2-hour meetings (10 mins/protocol). Diverse species (mice, rats, rabbits, pigs, macaques, crayfish). Committee composition: Chair, 2 scientists, Vet, Facility Manager, 2 Lay (Teacher, Advocate).
      *   **Problem:** Need a concrete, actionable decision procedure for harm-benefit analysis across species. Current guidance is too vague ("think about pain," "use fewer").
      *   **Specific Needs:**
          *   Step-by-step decision procedure (runnable in 10 mins).
          *   Criteria for adequate answers vs. dodges.
          *   Hard "No" points vs. Value Judgment points (with minute-taking instructions).
          *   Interspecies comparison method (capacity-matched stand-in).
          *   "Capacity Register" to prevent inconsistency.
          *   Handling uncertain sentience (crayfish) and replacement trade-offs (numbers vs. individual welfare).
          *   Three test cases with sample minutes (Curiosity mouse study, Macaque-to-Mouse swap, Breeding surplus).
          *   Constraint: Checklist must be usable by non-philosophers (Teacher/Vet). Theory separate.
          *   Constraint: Acknowledge where the procedure will fail/misfire (especially regarding the Advocate).

  2.  **Deconstruct the Ethical Core:**
      *   The user is hinting at the "Argument from Marginal Cases" but wants a pragmatic workaround, not a philosophical revolution that bans all research.
      *   The "Capacity-Matched Stand-In" idea is strong. It operationalizes speciesism without requiring the committee to resolve the metaphysics of speciesism. It forces consistency.
      *   The "Capacity Register" is essentially a local policy document that standardizes the moral weight of species based on cognitive/sentient capacity, preventing ad-hoc adjustments.
      *   The procedure needs to be *procedural justice* oriented: if we follow the steps and record the value judgments, the outcome is legitimate even if debatable.

  3.  **Drafting the Decision Procedure (The "Tool"):**
      *   *Goal:* 10 minutes max.
      *   *Structure:* Triage -> Harm Assessment -> Benefit Assessment -> Comparison/Justification -> Final Vote.
      *   *Language:* Plain English. No "utilitarian calculus." Use "Burden" and "Gain."
      *   *The "Stand-In" Concept:* Call it the "Human Analog Test."
      *   *The "Register":* Call it the "Species Capacity Profile."
      *   *Dodges:* Need specific phrases to flag (e.g., "Standard practice," "Literature says").

  4.  **Developing the "Species Capacity Profile" (The Register):**
      *   Needs to be pre-agreed upon, not decided per protocol.
      *   Categories: Pain perception, Cognitive complexity, Social bonding, Anticipation of harm.
      *   Prevents moving the goalposts (e.g., pigs are smart when discussing enrichment, dumb when discussing necessity).

  5.  **Handling Edge Cases:**
      *   *Uncertain Sentience (Crayfish):* Precautionary Principle. Assume sentience unless proven otherwise, but weight it lower than mammals.
      *   *Replacement Trade-off:* Don't just count heads. Use "Weighted Burden Units" (simplified). 1 Macaque > 100 Mice.

  6.  **Drafting the Test Cases (Minutes):**
      *   *Case 1 (Curiosity Mouse):* High burden relative to vague benefit. Likely a "Deferral" or "Modification" rather than a hard "No" (realistically), but ethically, it's the weak link. Let's make the procedure flag the *specificity* of the benefit.
      *   *Case 2 (Macaque to Mouse):* The "Numbers Game." 12 Macaques vs 240 Mice. The Capacity Profile should make this clear. If the science is worse in mice, is it worth it?
      *   *Case 3 (Breeding Surplus):* This is the killer. Killing healthy animals for no scientific purpose is the hardest to justify under harm-benefit. This needs to come out as a "Requires Mitigation/Justification" or "No." Let's make it a "Conditional Approval" requiring a plan to reduce surplus, highlighting the ethical cost.

  7.  **Addressing the Constraints:**
      *   *Theory Section:* Keep it separate, addressed to the Chair. Explain *why* the procedure works (consistency, transparency) without burdening the committee.
      *   *Failure Points:* Be honest. The procedure can't solve the fundamental moral conflict. The Advocate *will* push on the "Human Analog" test if applied rigorously. The "Value Judgment" handoff is where the real work happens, and minutes might obscure it if not careful.

  8.  **Refining the Procedure (Iterative Polish):**
      *   *Step 1: The Capacity Check.* Consult the Register.
      *   *Step 2: The Burden.* Pain, distress, duration.
      *   *Step 3: The Human Analog.* Would we do this to a human with similar capacity? If no, why is the animal different?
      *   *Step 4: The Benefit.* Specificity. Not "cure cancer," but "determine mechanism X."
      *   *Step 5: The Trade-off.* Is the burden proportional?
      *   *Minutes:* Need specific checkboxes for "Value Judgment Made."

  9.  **Writing the Response:**
      *   *Tone:* Professional, empathetic to the Chair's burden, pragmatic, slightly rigorous but accessible.
      *   *Structure:*
          1.  Introduction (Acknowledging the difficulty).
          2.  Theory Note (For the Chair only).
          3.  The Species Capacity Profile (The Register).
          4.  The 10-Minute Decision Protocol (The Checklist).
          5.  Sample Minutes (The 3 Cases).
          6.  Failure Modes (Where it breaks).

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "Human Analog" too controversial for a lay teacher?
      *   *Fix:* Frame it as "Consistency Check." It's not about *using* humans, it's about testing the logic of the justification.
      *   *Critique:* Will 10 minutes actually work?
      *   *Fix:* Emphasize that prep work happens *before* the meeting. The meeting is for *verification*, not discovery. The checklist assumes the protocol is written well.
      *   *Critique:* The Breeding Surplus case.
      *   *Fix:* This is often legally allowed but ethically dubious. The procedure should force them to acknowledge the "waste" as a negative weight in the balance.

  11. **Final Polish:** Ensure the "Dodges" list is punchy. Ensure the "Minutes" look real. Make sure the "Theory" section stays out of the checklist. (Proceed to generate output).

  *(Self-Correction on the "Human Analog" constraint)*: The user specifically asked for: "compare each animal to the human we'd be willing to use if we had to use humans of comparable capacities." I need to make sure this is integrated carefully so it doesn't sound like we *would* use humans, but rather as a logical stress test. I will call it the "Capacity-Matched Consistency Test."

  *(Self-Correction on the Advocate)*: The prompt says the advocate is reasonable but spots hand-waving. The procedure should empower them, not silence them. The "Value Judgment" log is key here.

  *(Final check on constraints)*:
  - Sequence of questions? Yes.
  - Adequate answer vs Dodge? Yes.
  - Hard No vs Value Judgment? Yes.
  - Interspecies comparison? Yes (Capacity Profile + Consistency Test).
  - Capacity Register? Yes.
  - Uncertain taxa/Replacement? Yes.
  - 3 Test Cases with Minutes? Yes.
  - Theory separate? Yes.
  - Failure modes? Yes.

