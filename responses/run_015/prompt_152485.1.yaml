  He pops into the model, stands next to the set of real numbers, and says, "Aha! I know you guys are actually countable. I saw the bijection from outside!" He starts digging through the model's universe looking for the function that maps the reals to the naturals. He searches everywhere, but he cant find it. The function isnt in the model.

  Dave starts sweating. "But you're countable! I can see the list from the meta-theory!"

  The real numbers just laugh at him. "Yeah, but that list isnt *in* here. Inside this model, we're uncountable. Deal with it."

  Dave freezes. He realizes the paradox isnt a bug, it's a feature. Countability is model-relative. From the outside he's counting them, but from the inside they're infinite. So now he's trapped in a set he thought was small, definately proving that you cant just step outside your own axioms. Guess truth depends on where your standing.
