  # The Frankfurt Sorter (Grad Seminar Edition)

  **Instructions:** Don't worry about philosopher names or "correct" answers. We're tweaking the Jones/Black case step-by-step. Read the tweak, answer **Yes/No** based on your gut intuition about whether Jones is *morally responsible* in that specific version.

  ### START: The Base Case
  Jones votes Democrat. Black has a chip that would force him to vote Republican if he showed signs of doing otherwise. Jones votes Democrat on his own. Chip never activates.

  ---

  ### NODE 1: The Flicker Check
  **Tweak:** Imagine we scan Jones's brain millisecond-by-millisecond. Is there **any** detectable mental sign (a "flicker") of him considering the Republican vote *before* he settles on Democrat, which the chip *could* have detected?

  *   **YES** (There is a flicker/alternative possibility) → **Go to Leaf A**
  *   **NO** (The chip eliminates even the prior sign; it's a truly unavoidable sequence) → **Go to Node 2**

  ---

  ### NODE 2: The Mechanism Check
  **Tweak:** Since there's no flicker, the chip must be reading his intentions directly. Does the chip monitor **internal deliberation** (thoughts) rather than just **external behavior** (voting actions)?

  *   **NO** (It only watches behavior) → **STOP.** *Logical glitch.* If it only watches behavior, there *must* be a flicker (Node 1 should have been Yes). Re-evaluate Node 1.
  *   **YES** (It reads internal states to bypass the flicker) → **Go to Node 3**

  ---

  ### NODE 3: The Endorsement Check
  **Tweak:** In this no-flicker scenario, does Jones have a **second-order desire** (a desire about his desire) that endorses voting Democrat? Does he *want* to be the kind of guy who votes Dem?

  *   **YES** (He identifies with the choice) → **Go to Leaf B/C**
  *   **NO** (He acts on a whim, addiction, or brute impulse; no higher-order endorsement) → **Go to Leaf D/E**

  ---

  ### THE LEAVES (Your Diagnostic Result)

  **Leaf A: The Flicker Defender**
  *   **Your Intuition:** Jones is responsible *because* he could have shown that prior sign.
  *   **Philosophical Match:** **(b) Flicker Defender.** You think PAP holds. Frankfurt cases fail because there's always *some* alternative possibility, even if it's just a neural blip.
  *   **Verdict:** Responsibility tracks alternatives.

  **Leaf B/C: The Endorsement Zone**
  *   **Your Intuition:** Jones is responsible because he identifies with the choice, even if he couldn't do otherwise.
