  The innocent may not be made a means.
  Oxford prepared the honorary gown.
  We acted to conclude the war's harsh scenes.
  No calculus holds water in between.
  She said the blood was on the gown.
  The innocent may not be made a means.
  The 'necessity' was sharp and overly keen.
  They asked what good came walking through the town.
  We burned the towns to end the bloody scenes.
  Not to move the world, only keep hands clean.
  But not to stitch the honour into gown.
  The innocent may not be made a means.
  He hides behind the paper, distance screens.
  The vote stood fast, the decision known.
  The deaths were aimed to end the bloody scenes.
  Description holds the verdict in its seams.
  What was gained is nobody's to own.
  The innocent may not be made a means.
  The deaths were the point of all those burning scenes.

  ### Notes

  I took liberty compressing Anscombe's argument on "unconditional surrender" into line 7 ("necessity was sharp"); historically, she argued the necessity was manufactured by policy, not just circumstance. I am confident in the reading that for Anscombe, the description of the act (murder) precludes justification, hence line 16. The villanelle's repetition mirrors her insistence that the moral rule admits no exception.

  The line I am least sure about is "Not to move the world, only keep hands clean." It risks sounding like subjective moral purity rather than Anscombe's objective focus on not participating in evil. However, I needed an 'A' rhyme to express the non-consequentialist motive (refusal to honour) without slipping into "making a difference." I prioritized the philosophical constraint over perfect biographical nuance here, as the prompt required landing the anti-consequentialist point within the form. The shift in the second refrain attempts to show that once the euphemisms are stripped, the justification collapses without needing further weighing.
