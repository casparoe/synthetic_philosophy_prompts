answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee
  **FROM:** [Your Name], Outside Member
  **DATE:** October 24, 2023
  **SUBJECT:** Standard of Knowledge and Finding in Case 23-07

  **Purpose**
  We must decide whether Dr. R "knew" or "should have known" about fabrication in Case 23-07. This distinction determines whether Dr. R faces public sanction and grant clawback or private remediation. Our precedents (21-02 and 22-11) are inconsistent, and General Counsel has suggested our standard should shift based on the Oversight Board's current mood. This memo recommends a fixed standard for "knew," applies it to Dr. R, and provides a rule for future cases.

  **The Standard for "Knew"**
  I recommend we define "knew" in Section 4.2(b) as **actual awareness or deliberate avoidance**. This excludes negligence (failing to check what one should have) but includes "willful blindness" (suspecting falsity and choosing not to look).

  We must reject the view that "knew" depends on the stakes or the Board's mood. Whether a person knows something is a fact about their mental state and evidence, not about how much trouble a finding causes or who is listening. If we let the penalty dictate the fact, we invert the logic of justice. The stakes are high *because* the misconduct is serious, not the other way around. General Counsel is correct that ordinary language shifts, but misconduct adjudication requires stability. We cannot say Dr. R "knew" in a low-stakes context but "didn't know" in a high-stakes one if the evidence is identical.

  **Application to Case 23-07**
  Under this standard, I recommend a finding that Dr. R **knew**.

  The evidence shows more than negligence. Dr. R noticed the bands were "unusually clean"—an anomaly suggesting potential manipulation. He joked about it but did not verify. Crucially, when a collaborating lab reported failure to reproduce the result two months before submission, Dr. R promised to look into it and did not. This is not merely failing to check; it is seeing a red flag, acknowledging it, and consciously choosing not to investigate further to maintain plausible deniability. This constitutes deliberate avoidance. He possessed enough evidence to suspect fabrication and acted to remain ignorant. That counts as knowledge in this context.

  **Precedents and Future Rule**
  Our prior cases are incompatible. In 21-02, we found "knew" on thin evidence (an unread email). That was too low a bar; unread information is not awareness. In 22-11, we declined to find "knew" despite strong evidence (failed replication, complaints) because a trial would pause. That was too high a bar; stakes should not erase evidence.

  We should formally note that 21-02 and 22-11 were decided under inconsistent standards and should not be cited as binding precedent for the definition of knowledge. To prevent future sliding, I propose the **Deliberate Avoidance Rule** for the grants officer and Chair:

  *   *Ask: Did the researcher see specific evidence suggesting falsity and then choose not to investigate?*
  *   *If Yes: They "knew."*
  *   *If No (but they should have checked): They "should have known."*
  *   *If No (and no reason to suspect): No misconduct.*

  This rule ignores the size of the grant or the Board's mood. It focuses only on the researcher's actions regarding specific red flags.

  **The Strongest Opposing View**
  I must fairly state the alternative. Some argue that whether we attribute "knowledge" depends on the practical context of the attributor.¹ On this view, it is reasonable to say Dr. R "knew" when the cost of error is low, but unreasonable to say he "knew" when the cost is career-ending. This is not about changing the facts, but about recognizing that "knowledge" is a tool we use to manage risk. When the risk of ruining a career is high, we should demand more evidence before using the label. This view prioritizes mercy and institutional stability over epistemic consistency.

  **Vulnerability and Conclusion**
  My recommendation is most exposed if Dr. R can demonstrate he explicitly delegated verification to Dr. T based on established trust, rather than avoiding verification to hide suspicion. If evidence emerges that R said, "I trust T, no need to check," rather than "I suspect this, but won't look," the finding shifts to "should have known."

  However, based on current evidence, the ignored replication warning moves this beyond trust into avoidance. We must find that Dr. R knew. To do otherwise is to accept that our truth findings depend on our fear of the consequences, which undermines the integrity of the Committee itself.

  ***

  **Appendix: Options Set Aside**
  1.  **Stakes-Based Standard:** Adjusting the evidence threshold based on the severity of penalties (rejected as circular).
  2.  **Audience Contextualism:** Defining "knew" based on the Oversight Board's current risk tolerance (rejected as unstable).
  3.  **Pure Invariantism without Willful Blindness:** Requiring direct admission or smoking-gun proof of knowledge (rejected as too narrow for senior author responsibility).

  ***

  ¹ *Philosophical positions referenced: Invariantism (recommended), Pragmatic Encroachment/Contextualism (opposing view).*
