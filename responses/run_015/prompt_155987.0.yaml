answer: |-
  It is a pleasure to engage with a mind that has naturally reconstructed some of the most difficult problems in the metaphysics of causation through the lens of practical engineering and historical reading. Your intuitions are not merely "inconsistent"; they track a distinction that professional philosophers often blur: the difference between *causal metaphysics* (what actually made the difference in the fabric of the world) and *explanatory pragmatics* (what a historian ought to write down).

  You have asked me to act as a philosopher who respects the historian's craft. I will not offer you a metaphysical abstraction that ignores how history is written, nor a pragmatic rule that denies the reality of the events.

  Per your instructions, I will begin by brainstorming candidate principles, evaluating them against your specific verdicts, before narrowing to the best one. Then I will present the repaired principle, map it to your verdicts, test it on new cases, and honestly list where it forces you to change your mind.

  ### Part 1: Brainstorming Candidate Principles

  Here are eight candidate principles for causal selection. I have evaluated them against your "Double Fire" (both arsonists count) and "Suzy/Billy" (only Suzy counts) pair, as this is your primary friction point.

  1.  **The "But-For" Test (Counterfactual Dependence):** *C is a cause of E if, had C not occurred, E would not have occurred.*
      *   *Verdict:* **Reject.** It fails your Double Fire case. If Arsonist A hadn't acted, the warehouse still burns (due to B), so A is not a "but-for" cause. You insist A is a cause.
  2.  **The NESS Test (Necessary Element of a Sufficient Set):** *C is a cause if it is a necessary part of a set of conditions that is sufficient for E.*
      *   *Verdict:* **Reject.** While popular with engineers, it struggles with Suzy/Billy. Billy's throw is part of a sufficient set (Billy + No Suzy), but since Suzy acted, Billy's set wasn't the one that operated. It doesn't cleanly distinguish why Billy is excluded while the second arsonist is included.
  3.  **Probabilistic Raising:** *C is a cause if it raises the probability of E.*
      *   *Verdict:* **Reject.** You explicitly rejected this for WWI. You believe Alliances mattered *more* than the Wrong Turn, even if the Turn raised the probability of war more sharply. Also, in Double Fire, neither arsonist raises the probability if the other is already present (probability is already 100%).
  4.  **Energy Transmission (Process Theory):** *C is a cause if there is a physical transmission of energy or information from C to E.*
      *   *Verdict:* **Reject.** It works for rocks and fires, but fails for "Alliance Commitments" or "Culture of Secrecy." There is no physical energy flow in a diplomatic treaty, yet you count it as a cause.
  5.  **Interventionism (Manipulability):** *C is a cause if an intervention on C would change E.*
      *   *Verdict:* **Reject.** This is excellent for engineering, but difficult for history. We cannot intervene on 1914. While we can imagine it, this approach often collapses back into counterfactuals that fail the Double Fire test.
  6.  **Contrastive Causation:** *C rather than C* caused E rather than E*.*
      *   *Verdict:* **Promising.** This handles "Greed" well (Greed vs. What? If the contrast is impossible, it's not a cause). It handles Lifeboats (Sinking vs. Not Sinking; Deaths vs. Survivals). However, on its own, it doesn't solve Suzy/Billy without additional machinery.
  7.  **Normality/Default-Relativity:** *Causes are deviations from a normal or expected course.*
      *   *Verdict:* **Promising.** This handles "Greed" (greed is normal in booms) and the "Near-Miss" (unknown info is background). But it risks making causation too subjective; a "normal" alliance system shouldn't cease to be a cause just because it was standard practice.
  8.  **Your "Live-Swap" Rule:** *Alternative was live + Outcome wouldn't happen + No second route.*
      *   *Verdict:* **Close, but Broken.** As you noted, Clause 2 ("No second route") kills the Double Fire verdict. It treats the second arsonist like Billy's rock. We need to distinguish between a *backup* cause (Billy) and a *concurrent sufficient* cause (Arsonist B).

  ### Part 2: The Selected Principle

  To capture your instincts, we must separate **Causal Status** (is it a cause?) from **Explanatory Weight** (is it worth citing?). We must also refine your Clause 2 to distinguish between a process that is *cut off* (Billy) and a process that *completes* (Arsonist B).

  I propose we repair your rule into the **"Completed Live-Swap Principle."**

  #### (1) The Principle Stated Precisely

  A factor **C** is a **cause** of an outcome **E** in a historical narrative if and only if it satisfies conditions (A) and (B):

  *   **(A) The Live Contrast:** There exists a plausible alternative **C*** (a "live swap") that was possible in the situation, such that if **C*** had occurred instead of **C**, the specific outcome **E** would probably not have occurred *at the time and in the manner it did*.
  *   **(B) Process Completion:** The causal process initiated by **C** must have reached completion. If a second factor **D** was also moving toward **E**, **C** still counts as a cause if **C**'s process physically or mechanism-wise completed its contribution to **E**, even if **D** would have also completed. **C** is *not* a cause if **C**'s process was interrupted or rendered inert by **D** before contributing to **E**.

  *Note on Explanatory Weight:* Once factors pass (A) and (B), a historian ranks them by **Salience**: (1) Manipulability (could agents have changed it?), (2) Surprise (was it a deviation from the norm?), and (3) Scope (does it explain a large class of events?).

  #### (2) Clause-by-Clause Note on Your Verdicts

  Here is how the specific wording of the principle forces your specific verdicts:

  *   **"At the time and in the manner it did" (in Clause A):** This forces your **Suzy/Billy** verdict. Suzy's rock shattered the bottle *then*. If we swap Suzy for "No Suzy," the bottle shatters *later* (by Billy). Since the outcome is time-sensitive, Suzy is a cause. Billy is not, because if we swap Billy for "No Billy," the bottle *still* shatters at the original time (by Suzy).
  *   **"Process... completed its contribution" (in Clause B):** This forces your **Double Fire** verdict. Both fires burned the warehouse. Both processes completed. The fact that one was sufficient doesn't negate the other's completion. This repairs your rule's failure on the arsonists.
  *   **"Specific Outcome E" (in Clause A):** This forces your **Titanic** verdict.
      *   *Outcome 1 (Sinking):* Swap Iceberg for "No Iceberg," ship doesn't sink. Iceberg is a cause. Swap Lifeboats for "More Lifeboats," ship *still* sinks. Lifeboats are not a cause of sinking.
      *   *Outcome 2 (Deaths):* Swap Lifeboats for "More Lifeboats," fewer deaths. Lifeboats *are* a cause of deaths. This treats them as the same kind of claim about different outcome specifications.
  *   **"Plausible alternative... possible in the situation" (in Clause A):** This forces your **Greed** verdict. In 2008, was "No Greed" a live swap? No. Was "Less Greed" live? Maybe. But "Greed" as a monolith has no contrast. It fails the Live Contrast test.
  *   **"Salience: Surprise/Deviation" (in Weighting):** This forces your **WWI** verdict. The Wrong Turn raised probability, but Alliances are more *salient* because they represent a structural deviation from peace (Scope) and were a policy choice (Manipulability). This allows you to rank Alliances > Wrong Turn without denying the Turn was causal.
  *   **"Salience: Manipulability/Knowledge" (in Weighting):** This forces your **Chernobyl** verdict. The Near-Miss was unknown to the operators. It fails the "Live Contrast" for the operators (they couldn't swap it). It explains the *context*, but it is not a cause of the explosion because it didn't complete a process into the control room.

  #### (3) Verdicts on New Cases

  Here is how the **Completed Live-Swap Principle** applies to the cases you haven't raised:

  *   **Case 1: "No war was fought on its soil" as a cause of a country's 20th-century prosperity.**
      *   *Verdict:* **Yes, it is a cause.**
      *   *Reasoning:* Apply Clause A (Live Contrast). Swap "No war on soil" for "War on soil." Prosperity likely vanishes. Apply Clause B (Process Completion). The absence of destruction allowed capital accumulation (a completed process).
      *   *Historian's Note:* Is it *worth citing*? Yes, under Salience (Scope). It explains decades of growth. However, historians often prefer positive events ("The Marshall Plan") over absences ("No Bombing"). Your principle validates the absence as a cause, leaving the citation as a stylistic choice.
  *   **Case 2: A dam that held is a cause of the town's survival in a history of that town.**
      *   *Verdict:* **Yes, it is a cause.**
      *   *Reasoning:* This is identical to the Lifeboat case. Outcome = Survival. Swap "Dam Held" for "Dam Broke." Survival vanishes. Process = Structural integrity preventing water flow.
      *   *Historian's Note:* This is a "negative cause" (prevention). It is causally robust. Whether it goes in the book depends on if the *threat* was the focus of the narrative.
  *   **Case 3: Grandfather's decision to emigrate in the 1920s.**
      *   *Verdict (Cause of your being alive):* **Yes.**
      *   *Reasoning:* Swap "Emigrate" for "Stay." You are not born. Process (lineage) completed.
      *   *Verdict (Worth citing):* **No (usually).**
      *   *Reasoning:* Under Salience, this lacks *Scope*. It explains *you*, but not a historical phenomenon. Unless the history is about migration patterns, it fails the "Manipulability/Scope" test for *explanatory weight*, even if it is metaphysically a cause. This validates your instinct that "cause" and "worth citing" are different.

  #### (4) Incompatibilities: What You Must Give Up

  No principle accommodates every intuition without cost. To keep the **Completed Live-Swap Principle**, you must abandon or revise the following:

  1.  **The "Friday" Submarine Verdict:** You said on Fridays that "causation of an absence is a category mistake."
      *   *The Cost:* You must give this up. The principle treats the Lifeboat case (absence of boats caused deaths) and the Submarine case (absence of launch caused no war) identically. If lifeboats causing deaths is valid (which you hold firm on), then the officer's refusal causing peace is also valid. You cannot have it both ways. The principle forces you to accept that *preventions* and *omissions* are causes when there is a normative expectation (safety for lifeboats, protocol for subs).
  2.  **The "Real Cause" Denial vs. Ranking:** You say there is "no such thing as the real cause" but also that Alliances "mattered more."
      *   *The Cost:* You must accept that "mattered more" is *not* a claim about causal strength (metaphysics), but about *human interest* (pragmatics). The principle separates Causal Status (binary: yes/no) from Explanatory Weight (scalar: high/low). You must stop thinking the Alliances were "more of a cause" than the Wrong Turn. They were *equally* causes; the Alliances are just *more important to historians*.
  3.  **The "Greed" Intuition (Nuance):** You refuse to cite greed because it has no contrast.
      *   *The Cost:* You must concede that if a specific *form* of greed was novel (e.g., "algorithmic greed" vs "traditional greed"), it *could* be a cause. Your rule bans "Greed" generally, but the principle allows it if you can specify a live swap (e.g., "Regulated Greed" vs "Unregulated Greed"). You must be precise about the contrast.

  ### A Note on the "Live-Swap" Repair

  You asked me to fix your rule rather than replace it. The critical repair was to **Clause 2**.

  *   **Your Old Clause 2:** "Doesn't count if the outcome would have been produced anyway by a second route."
  *   **The Problem:** This eliminates the second arsonist.
  *   **The New Clause 2 (Process Completion):** "Doesn't count if the causal process was *interrupted* or *preempted* before contributing."

  In the **Double Fire**, both processes contribute. The warehouse burns *faster* or *more thoroughly* with two fires, or at least, both fires physically consume the material. Neither is interrupted.
  In **Suzy/Billy**, Billy's process is *interrupted* by the shattering. His rock never touches the glass.

  This distinction preserves your intuition that Billy is irrelevant while the second arsonist is not, without abandoning the counterfactual spirit of your original rule.

  ### Final Thought for the Pub Group

  When your friends argue about "The Cause," hand them this distinction: **Causal Status** is about the machinery of the world (did the gear turn?). **Explanatory Weight** is about the story we tell (does the gear matter to the plot?).

  Your instinct that "Greed" is not a cause is actually a judgment about *Explanatory Weight* (it's not surprising/manipulable), not Causal Status (greed did drive the actions). Your instinct that the Second Arsonist *is* a cause is a judgment about *Causal Status* (his fire burned). By separating these, you can keep your firm verdicts without the inconsistency.

  You will have to concede on the Submarine Officer, however. If the Lifeboats caused the deaths, the Officer caused the peace. Consistency demands we treat absences as causes when the expectation of presence is normatively established.
