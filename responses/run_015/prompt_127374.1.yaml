answer: |-
  **Crane/Skyhook Review Protocol (Form CSRP-4)**

  **1. Explanatory Lift Mechanism (0–5 points)**
  Proposals are required to demonstrate that phenomena are lifted via accumulated design work rather than unsupported levitation. A crane requires a base constructed by prior machinery; a skyhook hangs from nothing. Reviewers will assess whether the proposed mechanism rests on established infrastructure or invokes magic. If the lift appears unsupported, points are deducted. However, if the base is not specified, the mechanism is presumed to be a skyhook until proven otherwise. Proposals must identify the machinery lowering the crane into place. Failure to identify the machinery suggests the crane is floating. Reviewers will penalize undefined lift.
  *Sample Comment:* "The proposed mechanism lifts agency without specifying where the crane itself is anchored, suggesting unsupported levitation rather than mechanical lift."

  **2. Grounding Regress Termination (0–5 points)**
  Reviewers are instructed to verify that the crane's base rests on solid ground, not on another crane ad infinitum. If the base resembles a skyhook from below, points are deducted. The chain of grounding must stop, but not at something that looks like a skyhook. This distinction is context-dependent; what counts as solid ground in one field may appear as magic in another. Proposals must specify the cutoff, though no standard cutoff exists. Reviewers should penalize infinite chains but also penalize arbitrary stops. The burden of proof lies with the proposer.
  *Sample Comment:* "The foundational layer functions as a skyhook relative to the substrate, violating regress protocols regarding termination."

  **3. Assessment of Explanatory Greed (0–5 points)**
  Explanations must not explain away the target phenomenon while claiming to explain it. The determination of greed relies on whether the reviewer believes the phenomenon should survive reduction. If the lower-level account eliminates the higher-level reality, it is greedy. If it preserves it, it is not. This determination is subjective and depends on the reviewer's prior commitment to the phenomenon's reality. Proposals must avoid greed without eliminating explanation. Reviewers should flag accounts that reduce value to noise. This criterion protects the integrity of the phenomenon.
  *Sample Comment:* "This account is greedily reductionist because it eliminates the value it purports to analyze rather than explaining its presence."

  **4. Verification of Emergent Normativity (0–5 points)**
  Properties at higher levels must not be mechanistic skyhooks disguised as emergence. Holistic accounts must prove their lift is not merely a refusal of machinery. If the proposal invokes sui generis normativity to block mechanistic stories, it must demonstrate that this normativity is not itself a skyhook. Appeals to emergence are scrutinized for hidden machinery. If the emergence is brute, it is a skyhook. If it is mechanistic, it is a crane. Reviewers must detect hidden skyhooks in holistic clothing. This prevents the smuggling of magic.
  *Sample Comment:* "The appeal to sui generis normativity appears to be a skyhook rebranded as emergence to avoid mechanistic scrutiny."

  **Section V: Appeals and Indistinguishability**
  In instances wherein a crane cannot be distinguished from a skyhook due to regress, cutoff ambiguity, or subjective greed assessment, the proposal is deemed structurally sound. Since all mechanisms ultimately rest on brute facts or infinite chains, the Panel recognizes that all proposals are equally grounded. Funding decisions will therefore proceed based on budget availability rather than explanatory integrity. Reviewers are advised to stop looking for the base. The distinction is acknowledged to be functionally null in interdisciplinary contexts. All proposals pass this section by default. No appeals will be heard on this matter.
