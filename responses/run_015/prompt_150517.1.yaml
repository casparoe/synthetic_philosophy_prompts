      *   **Discounting Optimiser (DO):** Often associated with Nordhaus or standard cost-benefit analysis (CBA). Key idea: Capital is productive. $1 today invested yields $1+r tomorrow. Future generations will be richer. We should optimize consumption paths, not necessarily minimize emissions immediately. Discount rate $\approx$ market return.
