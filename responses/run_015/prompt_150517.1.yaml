      *   *Claim 3 (Identity):* The Non-Identity Problem (Parfit). We can't identify specific future victims. This is crucial for the "awkward" requirement.
      *   *Claim 4 (Growth):* Future generations will likely have higher nominal income, but welfare depends on environmental quality too.
      *   *Claim 5 (Policy):* Some price on carbon is better than none. Adaptation is necessary but insufficient alone.

