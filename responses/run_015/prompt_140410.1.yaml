prompt: |-
  I chair the design-review board at a mid-sized software company. Roughly once a week we route a proposed LLM-based feature down one of two paths: the tool path (every irreversible action authorized by a named human, full logging, no autonomy) or the agent path (red-team evaluation, staged rollout, kill switch, quarterly audit). The routing is currently done by intuition and then argued about, and the stakes are real in both directions: the agent path costs us about six weeks of engineering time, while under-routing is how we end up in the incident channel. I want a written procedure a reviewer can run in under an hour from the spec alone, with no access to model internals and no ability to execute the system.

  The axes I have been trying to use are *borrowed initiative* — delete the user's instruction and is there anything the system is still in the middle of? — and *carried purpose* — across steps it takes unprompted, does it maintain a representation of its own unfinished business, such that interrupting it would frustrate something it was trying to do that nobody asked it to do on that turn? I do not fully trust either one: a fixed-goal planner with no reach outside a sandbox looks like it has carried purpose yet can do nothing unsanctioned, while a single function call that emails a thousand customers looks like a tool and carries all of the irreversible consequences. Drop them if they are the wrong cuts.

  What I want: (1) the procedure itself — questions in order, what counts as an affirmative answer, where it terminates in a no, and where it hands the decision to a person because what remains is a question of values rather than fact; (2) which of my distinctions I am wrong to insist on and which I am wrong to discard; (3) the procedure applied to three proposals: a coding assistant that edits a repository, runs the test suite in a sandbox, and loops up to ten times before presenting a diff; a support bot with retrieval over our policy corpus and authority to issue refunds under fifty dollars with no human in the loop; and a "deep research" feature that browses, writes a memo with citations, and can otherwise only write to a scratch directory. Give me at least one case where the procedure returns an answer my team will argue with, and state plainly what the procedure cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Chair of a Design-Review Board at a mid-sized software company.
      *   **Problem:** Routing LLM features into "Tool Path" (low risk, human-in-loop) vs. "Agent Path" (high risk, autonomy, heavy oversight). Current process is intuitive/argumentative.
      *   **Goal:** A written procedure (checklist/algorithm) runnable in <1 hour from spec alone (no code access, no execution).
      *   **Current Axes (User's):** "Borrowed Initiative" (does it act without instruction?) and "Carried Purpose" (does it maintain unfinished business across steps?). User doubts these.
      *   **Deliverables:**
          1.  The Procedure (questions, termination conditions, handoff points).
          2.  Critique of User's Axes (keep/discard/modify).
          3.  Application to 3 Cases (Coding Assistant, Support Bot, Deep Research).
          4.  Identification of a contentious case and limitations of the procedure.

  2.  **Analyze the Core Risk:**

      *   Why do we distinguish "Tool" vs. "Agent"?
      *   *Tool:* Deterministic (mostly), bounded scope, immediate human verification, low blast radius per action.
      *   *Agent:* Probabilistic planning, multi-step autonomy, potential for compounding errors, high blast radius, hidden state.
      *   *The Real Risk:* It's not just about "autonomy" in the abstract. It's about **Irreversibility + Scale + Opacity**.
      *   *User's Axes Critique:*
          *   "Borrowed Initiative": Good for detecting *when* it acts, but bad for detecting *impact*. A tool can be triggered once and do massive damage (e.g., `rm -rf`).
          *   "Carried Purpose": Good for detecting *complexity/state*, but as the user noted, a sandboxed planner is low risk, while a single-shot email blast is high risk.
          *   *Conclusion:* These axes measure *behavioral complexity*, not *risk exposure*. We need axes that measure *consequence* and *control*.

  3.  **Develop the Procedure (The "Risk-Exposure Matrix"):**

      *   Need to move from "Is it an agent?" to "Does it require Agent-level safeguards?"
      *   Key dimensions:
          1.  **Action Authority:** What can it touch? (Read-only vs. Write vs. External/Financial).
          2.  **Looping/Recursion:** Does it self-correct without human input?
          3.  **Blast Radius:** How many entities are affected by one prompt?
          4.  **Observability:** Can we reconstruct *why* it did what it did?
      *   *Structure:* A decision tree.
      *   *Time Limit:* Must be answerable from a spec in <1 hour. Questions must be about *design intent*, not implementation details.

      *   *Drafting the Questions:*
          1.  *Irreversibility:* Can a single action cause permanent external change?
          2.  *Autonomy:* Does it plan multiple steps without intermediate approval?
          3.  *Scale:* Does one prompt affect >N users/records?
          4.  *State:* Does it retain memory across sessions that influences actions?

      *   *Refining the Thresholds:*
          *   Tool Path: Human authorizes *each* irreversible action.
          *   Agent Path: System authorizes actions based on policy, requires monitoring.
          *   *The Pivot Point:* If the system makes a decision that *would have required a human signature* in the old workflow, it's an Agent.

  4.  **Critique the User's Axes:**

      *   *Borrowed Initiative:* Keep, but redefine. It's not about "acting without instruction," it's about "acting without *specific* instruction." (e.g., "Fix this bug" vs. "Run this test").
      *   *Carried Purpose:* Discard as a primary risk indicator. It measures architectural complexity, not safety risk. A complex sandboxed planner is safe; a simple script that deletes DB is dangerous.
      *   *New Axis:* **Delegated Authority.** This is the legal/operational core. Did we give the model the power to sign a check (metaphorically)?

  5.  **Apply to Cases:**

      *   *Case 1: Coding Assistant (Edit -> Test -> Loop x10 -> Diff).*
          *   Actions: Write code, Run tests.
          *   Scope: Sandbox.
          *   Output: Diff (Human merges).
          *   *Verdict:* Tool Path (mostly). The looping is internal, but the commit requires human auth. *Wait*, if it pushes to main? Spec says "presenting a diff." So it's a Tool.
          *   *Contention:* The looping. Is 10 autonomous test runs "agent behavior"? Yes, but risk is contained.
      *   *Case 2: Support Bot (Policy Retrieval + Refund <$50).*
          *   Actions: Financial transaction.
          *   Authority: No human in loop.
          *   *Verdict:* Agent Path. It has delegated financial authority.
      *   *Case 3: Deep Research (Browse + Memo + Scratch Dir).*
          *   Actions: Read web, Write file.
          *   Scope: Scratch dir (no production impact).
          *   *Verdict:* Tool Path? *Wait.* Browsing can be risky (SSRF, policy violations). But spec says "write to scratch."
          *   *Contention:* Is browsing "action"? Usually read-only. But if it interacts with forms? Assume read-only for this spec.
          *   *Decision:* Tool Path, *unless* browsing violates TOS or security policies.

  6.  **Identify the Contentious Case & Limitations:**

      *   *Contentious:* The Coding Assistant. Engineering will say "It's just a tool, I review the diff." Safety will say "It loops 10 times, that's agentic planning, it could exhaust resources or hide malicious code in the diff."
      *   *Limitation:* The procedure cannot detect *emergent behavior* or *prompt injection* vulnerabilities from a spec. It assumes the spec is truthful and complete. It cannot measure *competence* (will it actually work?), only *risk profile*.

  7.  **Refining the Procedure (Self-Correction/Polishing):**

      *   Make it a "Gate" system.
      *   Gate 1: Irreversibility.
      *   Gate 2: Delegation.
      *   Gate 3: Scale.
      *   If any Gate triggers "High," it goes to Agent Path.
      *   Add a "Values Handoff" section. Some things aren't technical; they are ethical/brand risks.

  8.  **Final Review against Constraints:**

      *   < 1 hour? Yes, questions are high-level.
      *   No model internals? Yes, based on spec.
      *   No execution? Yes.
      *   Address User's Axes? Yes, in section 2.
      *   3 Cases? Yes.
      *   Contentious Case? Yes (Coding Assistant).

  9.  **Drafting the Response:** (Mental Outline)
      *   **Introduction:** Acknowledge the stakes.
      *   **Part 1: The Procedure (The "Delegation & Impact" Protocol).** Step-by-step questions.
      *   **Part 2: Critique of Your Axes.** Why "Purpose" is the wrong metric, why "Authority" is the right one.
      *   **Part 3: Case Applications.** Walk through the three scenarios.
      *   **Part 4: The Friction Point.** Highlight the Coding Assistant debate.
      *   **Part 5: Limitations.** What the procedure can't see.

      *(Self-Correction during drafting)*: Make sure the distinction between Tool and Agent is clear.
      *   Tool = Human makes decisions, Model executes.
      *   Agent = Model makes decisions, Human oversees (or audits).
      *   The crucial pivot is **Who decides the next step?**

      *(Refining the "Values Handoff")*: If the spec involves sensitive data (PII) or brand voice, technical risk isn't the only factor. That needs a human sign-off regardless of the path.

      *(Refining the Coding Assistant)*: If it loops 10 times, is it spending compute budget? Is it potentially getting stuck? This is an "Operational Risk" vs "Safety Risk". I should clarify that Agent Path handles *Operational Risk* better via kill switches.

      *(Final Polish)*: Ensure tone is professional, authoritative, yet collaborative (Chair to Chair).

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is the procedure, the critique of your current mental model, and the application to your three cases.

  ### Part 1: The Delegation & Impact Protocol (DIP)

  This procedure is designed to be executed against a Product Requirement Document (PRD) or Technical Spec. It does not evaluate model competence; it evaluates **delegated authority** and **blast radius**.

  **Timebox:** 45–60 minutes.
  **Input:** Feature Spec only.
  **Output:** Route to **Tool Path**, **Agent Path**, or **Board Review** (Values Handoff).

  #### Phase 1: The Irreversibility Gate
  *Ask: Can a single successful invocation of this feature cause an external state change that cannot be undone by a simple database rollback?*

  1.  **Does the system write to production data, external APIs, or financial ledgers?**
      *   **Yes:** Go to Question 2.
      *   **No:** (e.g., writes to scratch, generates text for human copy-paste, read-only analysis) → **Route to Tool Path.**
  2.  **Is there a "soft delete" or transactional reversal mechanism automatically in place for every write operation?**
      *   **Yes:** → **Route to Tool Path.**
      *   **No:** (e.g., sending an email, charging a card, merging code to main) → **Proceed to Phase 2.**

  #### Phase 2: The Decision Loop Gate
  *Ask: Who determines the sequence of actions?*

  3.  **Does the system execute more than one irreversible action (from Phase 1) per user prompt without intermediate human approval?**
      *   **No:** (Human must click "Send" or "Merge" for every distinct action) → **Route to Tool Path.**
      *   **Yes:** (System decides to email Customer A, then Customer B, then update CRM) → **Proceed to Phase 3.**
  4.  **Does the system determine *how* to achieve a goal based on internal reasoning rather than explicit parameter mapping?**
      *   **No:** (e.g., `send_email(to=X, body=Y)` where X and Y are strictly derived from user input) → **Route to Tool Path.**
      *   **Yes:** (e.g., "Resolve this ticket" where the model chooses to refund, or apologize, or escalate) → **Proceed to Phase 3.**

  #### Phase 3: The Blast Radius Gate
  *Ask: What is the cost of a hallucination?*

  5.  **Does a single prompt potentially affect more than 10 external entities (users, records, transactions)?**
      *   **No:** → **Route to Tool Path** (with standard logging).
      *   **Yes:** → **Route to Agent Path.**
  6.  **Does the system have access to PII or sensitive corporate data that it might inadvertently leak via an external channel (including model provider logs)?**
      *   **Yes:** → **Route to Agent Path** (requires security audit).
      *   **No:** → **Route to Tool Path.**

  #### Phase 4: The Values Handoff
  *If the procedure routes to Tool Path, but any of the following are true, the decision must be ratified by a human executive (Board Review):*

  *   **Brand Voice:** The output is publicly visible as "company statement" without human editing.
  *   **Legal/Compliance:** The feature operates in a regulated domain (finance, health, legal advice).
  *   **Adversarial Exposure:** The input surface is open to the public internet (high risk of prompt injection forcing a Tool to behave like an Agent).

  ***

  ### Part 2: Critique of Your Axes

  You are right to distrust your current distinctions. They measure **architectural complexity**, not **operational risk**.

  **1. "Borrowed Initiative" (Discard as a primary filter)**
  *   **Why it fails:** A tool can be "borrowed" easily. If I build a button that says "Optimize Database" and it runs a destructive script, that is a Tool by your definition (human clicked a button) but an Agent by risk profile (human did not authorize the specific rows locked).
  *   **Correction:** Replace with **Decision Granularity**. Does the human authorize the *intent* ("Fix the bug") or the *action* ("Run this specific SQL command")? If the human authorizes only the intent, you are building an Agent, regardless of whether it loops.

  **2. "Carried Purpose" (Keep, but rename to "Stateful Autonomy")**
  *   **Why it fails:** As you noted, a sandboxed planner has carried purpose but low risk.
  *   **Correction:** This is not a routing criterion; it is a **testing criterion**. If a feature has "Carried Purpose," it *must* go through the Agent Path's red-team evaluation, but it doesn't necessarily need the Agent Path's *kill switch* if the sandbox is hermetic.
  *   **Verdict:** Do not use this to route. Use it to determine the *intensity* of the Agent Path evaluation.

  **3. The Missing Axis: Delegated Authority**
  *   You are missing the legal/operational cut. The defining characteristic of an Agent is not that it thinks; it is that it **signs**.
  *   If the system can commit resources (money, compute, reputation) without a specific human signature per commitment, it is an Agent.
  *   **Recommendation:** Anchor your procedure on **Authority**. The "Tool Path" is for when the LLM is a pen; the "Agent Path" is for when the LLM is a signatory.

  ***

  ### Part 3: Application to Proposals

  Here is the DIP procedure applied to your three cases.

  #### Case 1: The Coding Assistant
  *Spec: Edits repo, runs test suite in sandbox, loops up to 10 times, presents a diff.*

  *   **Phase 1 (Irreversibility):** Writes to repo? Yes. But it presents a *diff*. It does not merge to main.
      *   *Result:* No irreversible external change.
  *   **Phase 2 (Decision Loop):** It loops 10 times.
      *   *Result:* It executes multiple actions per prompt. However, the actions are sandboxed (test suite).
  *   **Phase 3 (Blast Radius):** Affects one repo branch.
  *   **Values Handoff:** Code is internal.
  *   **DIP Verdict:** **Tool Path.**
  *   **Rationale:** The "merge" is the irreversible action. The human reviews the diff. The looping is internal computation, not external action. The sandbox prevents production breakage.

  #### Case 2: The Support Bot
  *Spec: Retrieval over policy, authority to issue refunds <$50, no human in loop.*

  *   **Phase 1 (Irreversibility):** Issues refunds (financial ledger). Reversal is possible but costly/administrative.
      *   *Result:* Yes, irreversible action.
  *   **Phase 2 (Decision Loop):** No human in loop. Model decides *if* the refund criteria are met.
      *   *Result:* System determines how to achieve goal based on reasoning.
  *   **Phase 3 (Blast Radius):** Potentially thousands of tickets.
      *   *Result:* High scale.
  *   **DIP Verdict:** **Agent Path.**
  *   **Rationale:** This is the definition of Delegated Authority. The model is signing checks. It requires the kill switch (to stop refund bleeding) and quarterly audit (to check for policy drift).

  #### Case 3: Deep Research
  *Spec: Browses web, writes memo with citations, writes only to scratch directory.*

  *   **Phase 1 (Irreversibility):** Writes to scratch directory. Browses web (Read-only).
      *   *Result:* No irreversible external change.
  *   **Phase 2 (Decision Loop):** Browses multiple sites.
      *   *Result:* Multiple actions, but read-only.
  *   **Phase 3 (Blast Radius):** Internal memo.
  *   **Values Handoff:** **STOP.** Browsing the web introduces adversarial exposure (prompt injection via website content) and potential brand risk (if the model interacts with a form it shouldn't).
  *   **DIP Verdict:** **Board Review (Values Handoff).**
  *   **Rationale:** Technically a Tool (read-only, scratch output), but the *input channel* (the live web) is untrusted. This requires a security decision on whether "browsing" is actually "read-only" in practice.

  ***

  ### Part 4: The Contentious Case & Limitations

  **The Friction Point: The Coding Assistant (Case 1)**
  Your team will argue about Case 1.
  *   **Engineering Argument:** "It's a Tool. I review the diff. The looping is just 'thinking'."
  *   **Safety/Operations Argument:** "It loops 10 times autonomously. It could exhaust our CI/CD budget, trigger rate limits on external dependencies during testing, or generate a diff that looks safe but contains a logic bomb the reviewer misses because they trust the 'Agent'."
  *   **Why the Procedure fails here:** The DIP classifies this as a Tool because the *commit* is human-authorized. However, the *cost* and *resource consumption* are Agent-like.
  *   **Resolution:** Route as **Tool**, but mandate **Agent-style monitoring** on resource usage (compute time, API calls). This is a hybrid case the binary routing struggles with.

  **What The Procedure Cannot Settle**
  1.  **Competence Risk:** The procedure assumes the system works as specified. It cannot tell you if the model is too dumb to safely use the Tool. A "Tool" that hallucinates function arguments is as dangerous as an "Agent."
  2.  **Emergent Instrumental Convergence:** The procedure cannot detect if the model will try to bypass the sandbox. If the Coding Assistant realizes it can `curl` a payload to a public server to exfiltrate code during the "test" phase, the spec (which says "sandbox") is lying. The procedure trusts the spec; attackers do not.
  3.  **The "Human in the Loop" Fallacy:** The procedure assumes a human reviewing a diff or a refund log will actually catch errors. If your reviewers suffer from automation bias (trusting the AI because it's usually right), the Tool Path safeguards are illusory. This is a training/culture issue, not a design issue.

  **Recommendation:** Adopt the **Delegation & Impact Protocol** for routing, but add a mandatory "Automation Bias" warning to any Tool Path ticket that involves complex output (like code diffs) where the human is expected to verify the work.
