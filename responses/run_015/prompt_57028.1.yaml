      *   *Weight of Course Facts:* In a 45-min closed book exam with a provided text, usually, students are expected to analyze the text. However, since this is a *course* assessment, applying course knowledge is the point. I will advise that a First-Class answer *must* use the course knowledge to debunk the text's premises. A competent answer analyzes the logic internally.
