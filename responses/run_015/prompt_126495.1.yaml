prompt: |-
  Write a joke about quining qualia — the view that "what it's like" is an incoherent posit that should be dropped, not just studied harder. The joke should turn on someone who's actually convinced by the Chase-Sanborn style argument and tries to live without any qualia-talk. Maybe they're at a gallery trying to describe a painting without using appearance-language, and they keep accidentally smuggling it back in through functional or dispositional terms. The punchline should depend on the specific philosophical tension — that if you really eliminate qualia you either lose the ability to talk about experience altogether or you end up rebuilding the same concept under a different name. Not a generic "philosophers deny reality" joke, but something that'd actually land for someone who knows why quining qualia is supposed to be different from behaviorism. Keep it somewhat in the weeds.
