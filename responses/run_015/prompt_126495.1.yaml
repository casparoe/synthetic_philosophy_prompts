answer: |-
  Dan and Phil are standing in front of a Rothko, a massive canvas of vibrating maroon.

  Phil: "It's intense. The red feels like it's pushing against your retinas."

  Dan: "Careful. 'Feels' is a folk-psychological relic. I prefer to say my visual cortex is currently in a high-activation state disposed to produce the verbal output 'intense maroon'."

  Phil: "Okay. Now look at the panel next to it. It's the same pigment, but the lighting is warmer. Does it look different?"

  Dan: " 'Look' implies an intrinsic appearance property. There are none. However, my discriminative protocols are issuing distinct verdicts. It's a classic Chase-Sanborn scenario."

  Phil: "Meaning?"

  Dan: "Meaning I can't tell if the stimulus changed or if my calibration drifted. But since the wavelength is identical, I must assume my judgment standards have shifted. I am now disposed to categorize *this* input as 'warmer' relative to *that* input."

  Phil: "So, this shift in standards... is it something you can describe to me?"

  Dan: "Not fully. It's lexically underspecified. You have to occupy the state to grasp the distinction."

  Phil: "So it's ineffable."

  Dan: "It's *computationally opaque* to third parties."

  Phil: "And only you can access the shift?"

  Dan: "Naturally. It's a first-personal system check."

  Phil: "So it's private."

  Dan: "It's *locally bound*."

  Phil: "And do you need to infer the shift, or do you just know it's happening?"

  Dan: "I don't infer it. The state is self-intimating. I just apprehend the disposition directly."

  Phil: "So it's directly apprehensible."

  Dan: "Precisely."

  Phil: "Dan. Ineffable, intrinsic, private, and directly apprehensible. You just gave me the four criteria for qualia."

  Dan: "No! Qualia are incoherent posits. This is a *Reflexive Discriminative Propensity*."

  Phil: "Does the Propensity have a 'what-it's-like'?"

  Dan: "No! It has a... *functional profile*."

  Phil: "And what is the functional profile of a private, ineffable state that only you can know?"

  Dan: "It's the profile of... well, of what it's like to be me!"

  Dan pauses, horrified.

  Dan: "Damn it. I quined the qualia, but I kept the carcass and called it a Propensity."

  Phil: "At least the Propensity tastes like coffee."

  Dan: "Don't start. I still don't know if the coffee changed or if I did."

  Phil: "But you know what it's like?"

  Dan: "I know what it's like to deny what it's like. And frankly, it feels exactly the same."
