answer: |-
  ### Specification for Self-Locating Reasoning in Decision-Making

  **1. Demand: Decision-Readiness**
  The theory must output probabilities that can be directly multiplied by utility values to yield expected utilities for actions affecting observer counts.
  *   **Motivation:** The stated purpose is decision-making (existential risk, population estimates), not merely epistemic comfort. A rule that yields undefined credences or refuses to update is useless for policy.
  *   **Tag:** Non-negotiable.
  *   **Reasoning:** This is the functional definition of the specification. A theory that cannot guide action in the target contexts fails the brief by definition.

  **2. Demand: Prior/Rule Separation**
  The theory must distinguish between the indexical updating rule and the non-indexical prior over world-histories; the rule cannot smuggle substantive empirical claims (e.g., "universes are small") into the mechanics of conditioning.
  *   **Motivation:** The cosmological armchair case. We must not settle empirical disputes about universe size solely via the reasoning rule.
  *   **Tag:** Non-negotiable.
  *   **Reasoning:** Confusing priors with update rules renders the theory untestable and allows "Presumptuous Philosopher" errors to masquerade as logical necessities.

  **3. Demand: Unit Specification**
  The theory must explicitly declare whether the fundamental unit of counting is the *person* (whole life) or the *person-moment* (subjective episode).
  *   **Motivation:** The single undivided life case (memory erasure) and Sleeping Beauty. If the unit is ambiguous, the agent cannot know if they should bet on the number of episodes or the number of lives.
  *   **Tag:** Negotiable.
  *   **Reasoning:** While the theory must pick one, metaphysics is unsettled. A theory is adequate if it is consistent, even if it chooses moments over persons, provided it warns the user.

  **4. Demand: Vagueness Insensitivity**
  The theory's output must not swing by orders of magnitude due to borderline changes in the definition of "observer."
  *   **Motivation:** The Sorites case. If cognitive sophistication is continuous, a rule sensitive to a sharp cutoff makes population estimates hostage to semantic arbitrariness.
  *   **Tag:** Preference of the Pragmatist Camp.
  *   **Reasoning:** Formalists often accept binary thresholds for tractability. Demanding robustness to vagueness is a demand for applied usability over formal purity.

  **5. Demand: Infinity Convergence**
  The theory must provide a normalization method that yields finite probability ratios even when hypotheses predict infinitely many observers.
  *   **Motivation:** The infinite cosmological hypothesis case. Standard Bayesian conditioning fails (0/0 or ∞/∞) without a measure-theoretic fix.
  *   **Tag:** Non-negotiable.
  *   **Reasoning:** Modern cosmology requires this. A theory that crashes on infinite hypotheses cannot serve the stated purpose of cosmological measure choice.

  **6. Demand: Empirical Defeasibility**
  Anthropic updates must not overwhelm strong empirical evidence; the posterior probability of a hypothesis cannot be driven to 1 solely because it predicts more observers.
  *   **Motivation:** The Presumptuous Philosopher variant of the cosmological case. We must not be able to prove the universe is vast from an armchair.
  *   **Tag:** Non-negotiable.
  *   **Reasoning:** Violating this makes empirical science impossible. It is a genuine adequacy condition for any rule claiming to aid scientific estimation.

  **7. Demand: Reference Class Non-Circularity**
  The reference class used for sampling cannot be defined by the truth of the hypothesis being tested.
  *   **Motivation:** The Doomsday/Earlyness case. If "observers like me" is defined to include only those in small populations, the Doomsday argument becomes tautological.
  *   **Tag:** Negotiable.
  *   **Reasoning:** Some theories (e.g., Full Non-indexical Conditioning) dissolve the reference class entirely. Others fix it universally. Flexibility here is permissible if consistency is maintained.

  **8. Demand: Diachronic Coherence**
  An agent's credences should not change upon mere passage of time without new evidence or loss of memory.
  *   **Motivation:** The first-two-people case. Agents should not predict fewer descendants simply because time has passed and they still exist.
  *   **Tag:** Preference of the Rationalist Camp.
  *   **Reasoning:** While desirable, some self-locating frameworks (like certain SSA interpretations) inherently violate this to solve duplication puzzles. It is a rationality ideal, not a logical necessity.

  **9. Demand: Utility Aggregation Neutrality**
  The reasoning rule must not presuppose a specific method of aggregating utility (e.g., Total vs. Average Utilitarianism).
  *   **Motivation:** The Belief vs. Action distinction. A rule might assign high probability to many observers, but a decision rule might ignore them if they are below a welfare threshold.
  *   **Tag:** Non-negotiable.
  *   **Reasoning:** Conflating credence with value judgments prevents the theory from being used by agents with different ethical commitments.

  **10. Demand: Center Indifference**
  Subjectively indistinguishable centers of experience must be assigned equal probability mass conditional on the world-state.
  *   **Motivation:** Sleeping Beauty. If the agent cannot tell which waking it is, the rule should not privilege one over the other without external evidence.
  *   **Tag:** Preference of the SIA Camp.
  *   **Reasoning:** SSA proponents restrict indifference to avoid the Doomsday argument. This is a philosophical intuition about symmetry, not a functional requirement for decision-making.

  ***

  ### Explicit Distinctions

  **1. Rule Constraints vs. Prior/Measure Constraints**
  Requirements 2 (Prior/Rule Separation) and 5 (Infinity Convergence) highlight this boundary. Many complaints against Self-Indication Assumption (SIA) are actually complaints about the *prior* over cosmological models, not the indexical rule. If a requirement demands that the *rule* prevent Presumptuous Philosopher conclusions (Req 6), it forces the rule to absorb prior-like constraints. A clean specification admits that "Infinity Convergence" is often a measure-theoretic choice masquerading as an update rule. If we misfile measure constraints as rule constraints, we falsely blame the updating mechanism for prior sensitivity.

  **2. Belief vs. Action**
  Requirement 9 (Utility Aggregation Neutrality) enforces this. A theory of self-locating *belief* outputs credences (e.g., "There is a 90% chance I am one of a billion"). A theory of *decision* outputs choices (e.g., "Bet as if there are a billion"). In cases of duplication (Sleeping Beauty) or vast populations, the link breaks. An agent might believe they are likely one of many, but if their utility function is "average welfare," the existence of the others is decision-irrelevant. The specification demands the reasoning rule stop at credences; bundling a decision rule (e.g., "Maximize total expected welfare") limits the theory's applicability to specific ethical frameworks.

  ***

  ### Incompatibility Analysis

  **The Result:** The specification contains a logically unsatisfiable subset. **Requirements 5 (Infinity Convergence), 6 (Empirical Defeasibility), and 10 (Center Indifference) cannot be jointly satisfied.**

  If you enforce **Center Indifference** (10) across an **Infinite** set of observers (5), you inevitably assign probability 1 to the hypothesis containing the most observers (or fail to normalize), violating **Empirical Defeasibility** (6). This is the "Presumptuous Philosopher" problem formalized. You cannot treat all observer-moments equally in an infinite multiverse without making the size of the multiverse a certainty derived from your existence.

  **The Trade-off:** To restore consistency, **Requirement 10 (Center Indifference)** must be abandoned in its unrestricted form.
  *   **What is lost:** We lose the elegant symmetry that solves Sleeping Beauty cleanly in all contexts. We must accept that in cosmological scales, subjective indistinguishability does not guarantee equal probability weight.
  *   **The Best Weakened Theory:** A "Compartmentalized Conditionalization" approach. Apply Center Indifference only within finite, causally disconnected patches, or restrict the reference class (violating the spirit of 10) to ensure empirical evidence can still shift priors. This preserves Empirical Defeasibility and Infinity Convergence at the cost of universal symmetry.

  **The Hardest Constraint:** **Requirement 6 (Empirical Defeasibility)** does the most work in excluding attractive candidates. It rules out pure SIA (which fails it) and pure SSA (which fails it in Doomsday contexts unless Reference Classes are gerrymandered). It forces the theory to be humble about what existence alone can prove.

  **First to Drop:** If forced to drop another, I would drop **Requirement 4 (Vagueness Insensitivity)**. It is preferable to have a precise theory that requires the user to sharpen definitions than a vague theory that gives stable but arbitrary answers.

  ***

  ### Scoring of Candidate Rules

  **Self-Sampling Assumption (SSA)**
  *   **Score:** Fails Req 6 (Empirical Defeasibility) in Doomsday contexts; Fails Req 10 (Center Indifference) in duplication cases. Passes Req 2 (Prior Separation).
  *   **Note:** Tends to make the agent feel "too special," leading to pessimistic population estimates.

  **Self-Indication Assumption (SIA)**
  *   **Score:** Fails Req 6 (Empirical Defeasibility) catastrophically (Presumptuous Philosopher); Fails Req 5 (Infinity Convergence) without ad-hoc measures. Passes Req 10 (Center Indifference).
  *   **Note:** Tends to make the agent feel "common," leading to overconfident cosmological estimates.

  **No-Update (Full Non-Indexical Conditioning)**
  *   **Score:** Passes Req 6 (Empirical Defeasibility); Passes Req 2 (Prior Separation). Fails Req 10 (Center Indifference) and often Req 1 (Decision-Readiness) in duplication cases where actions differ by center.
  *   **Note:** Safest for cosmology, but leaves the agent paralyzed in Sleeping Beauty-style decisions.

  **Theory Uncertainty:** When uncertain which rule is correct, do not average the credences. Average the **decisions**. Calculate the expected utility of actions under each theory (weighted by your credence in the theory itself) and choose the action with the highest meta-expected utility. This bypasses the need to resolve the metaphysical conflict before acting.
