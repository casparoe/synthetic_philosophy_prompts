answer: |-
  Four candidate diagnoses present themselves. (1) **Verbal Dispute:** The sides define "consciousness" differently. (2) **Empirical Ignorance:** We lack the neural data to settle the matter. (3) **Epistemic Boundary:** They disagree on what counts as public data. (4) **Constitutive Rule (Text-Invariance):** They disagree on whether reports constitute the phenomenon or merely evidence it.

  Testing (1): Both sides claim ontological stakes. Dennett does not say "I mean access," he says "phenomenality *is* access." Block does not say "I mean qualia," he says "qualia *exist*." This is not merely semantic; it is a clash of truth-claims. Dismissed.

  Testing (2): Both agree on neural correlations. The dispute arises *after* the data is in, regarding what the data explains. Dennett claims neural+report data exhausts the phenomenon; Critics claim it leaves a residue. The stall is not empirical. Dismissed.

  Testing (3): Defenders claim third-person neutrality; Critics claim first-person privilege. This fits the "data" accusation. However, it describes the symptom, not the cause. Why is first-person data excluded? Because of a deeper methodological commitment.

  Testing (4): This aligns with your text-invariance hypothesis. Defenders treat verbal reports as **constitutive**: the heterophenomenological world *is* the textually reconstructed world. If two sources emit identical texts, they possess identical consciousness (Text-Invariance holds). Critics treat reports as **symptomatic**: reports evidence an internal state that may vary independently (Zombies possible). Text-Invariance fails.

  This diagnosis best grounds the "begging the question" charge. If reports constitute consciousness, excluding non-reportable qualia is not a fiat exclusion but a logical consequence of the definition. If reports evidence consciousness, excluding non-reportable qualia is an unjustified methodological restriction. The standoff is stable because neither side can argue for their constitutive rule without presupposing it. Dennett presupposes operationalism; Critics presuppose realism.

  **Diagnosis:** The impasse is a **Conflict of Constitutive Rules**. It is not about whether qualia exist, but whether the method defines them into or out of existence via the status of the report.

  **Progress:** Given this diagnosis, empirical data will not resolve the dispute. Progress requires a **formal decoupling of projects**. We must distinguish *Heterophenomenology-as-Science* (predicting reports from neural states) from *Heterophenomenology-as-Ontology* (claiming reports exhaust experience).

  1.  **Conceptual Distinction:** Defenders must concede that their method solves the "Public Attribution Problem" (how we know others are conscious) but not necessarily the "Phenomenal Reality Problem" (what consciousness is). Critics must concede that without text-invariance, consciousness research loses third-person falsifiability.
  2.  **Formal Result:** A proof showing whether text-invariance is a necessary condition for scientific objectivity. If science *requires* text-invariance, Critics must accept their question is non-scientific. If science *allows* symptomatic inference (like inferring black holes from gravitational effects), Defenders must admit their method is incomplete.
  3.  **Reformulation:** Abandon the hope of a single "method of consciousness." Adopt a pluralistic framework: Access Consciousness is studied via heterophenomenology (Text-Invariant); Phenomenal Consciousness is studied via phenomenological structuration (Text-Sensitive), with no expectation of reduction.

  Expecting one side to convert the other is futile; their constitutive rules are axiomatic. Progress lies not in victory, but in mapping the boundary where the axioms diverge. The field stalls because it seeks a unified theory where two distinct epistemic frameworks operate. Acknowledging this duality dissolves the accusation of question-begging: Dennett begs the question only if you assume realism; Block begs the question only if you assume operationalism. Explicitly stating these axioms allows parallel progress rather than circular conflict.
