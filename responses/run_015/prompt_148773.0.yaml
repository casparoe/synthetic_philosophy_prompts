answer: |-
  TO: Principal Investigator, Department of Cognitive Neuroscience
  FROM: University Neuroethics Review Panel
  DATE: 24 October 2023
  SUBJECT: Decision on Protocol NERP-2023-04: Induction of Null-Interface States

  The Panel recommends conditional approval of the proposed pilot study subject to the strict ethical safeguards and monitoring requirements detailed below.

  While the Panel recognises the significant scientific value in investigating the relationship between predictive self-modelling and moral cognition, the proposed methodology introduces novel risks that exceed standard cognitive manipulation protocols. The majority view holds that the study's potential contributions to understanding the substrate of agency justify proceeding, provided that the intervention is treated as a higher-risk category than conventional neurofeedback tasks. However, this approval is contingent upon the implementation of specific measures designed to mitigate the unique philosophical and psychological hazards identified during review.

  The Panel acknowledges the cogency of the minority position, which argues that informed consent is structurally inadequate for this specific intervention. The strongest point raised by this view is that if the protocol successfully suspends the 'user-illusion' of consciousness, participants are temporarily deprived of the very phenomenological framework required to assess harm or exercise agency during the procedure. Consequently, standard consent forms may be rendered void by the state they authorise, as participants cannot genuinely consent to the absence of the capacity that makes consent meaningful. Whilst the Panel does not find this argument sufficient to warrant outright rejection, it accepts that it necessitates a departure from standard consent procedures to ensure participants are not treated merely as means to scientific ends.

  To address these concerns without stifling legitimate inquiry, the Panel requires the following conditions to be met prior to and during data collection:

  1.  **Staged Consent Process:** Consent must be obtained in two phases. The initial phase covers the induction procedure; the second phase must occur post-debriefing, where participants confirm their willingness to have their data retained after having the nature of the 'null-interface' experience fully explained. Participants must retain the right to withdraw data after the second phase without penalty.
  2.  **Enhanced Debriefing Protocol:** A standardised debriefing script must be approved by the Panel to ensure the re-integration of agency. This session must verify that the participant has fully recovered their sense of self-attribution before leaving the laboratory.
  3.  **Independent Safety Monitoring:** An independent monitor, unaffiliated with the research team, must be present during all induction sessions to observe signs of distress that the participant may be unable to articulate during the null-interface state.
  4.  **Pilot Limitation:** Approval is granted strictly for the pilot phase (n=10). A full ethical review will be required before any expansion of the sample size, contingent upon the safety data gathered from this initial cohort.

  The Panel considers these conditions necessary to balance the pursuit of knowledge regarding consciousness with the fundamental duty to protect participant integrity. Failure to adhere to these conditions will result in immediate suspension of the protocol.
