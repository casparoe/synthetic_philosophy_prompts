  ### The Biographical Morality Tree

  This decision tree sorts readers based on how they believe a life story functions morally. Follow the claims from the root down. If a path ends early, it means further questions don't change the moral outcome for that position.

  **Node 1 (Root):** "A life story teaches best when it is accurate, even if that means the hero was kind of a jerk."
  *   **Disagree (Smoothing):** Go to Node 2A.
  *   **Agree (Accuracy):** Go to Node 2B.

  **Node 2A (Smoothing Branch):** "The reader has to see themselves in the subject for it to work."
  *   **Agree (Relatable):** → **Leaf 1: Hagiographic Mirror**
  *   **Disagree (Distant):** → **Leaf 2: Idealized Icon**
  *(Note: Paths ending here assume negative lives are useless, as smoothing requires positive exemplars.)*

  **Node 2B (Accuracy Branch):** "The reader has to see themselves in the subject for it to work."
  *   **Agree (Relatable):** Go to Node 3.
  *   **Disagree (Distant):** Go to Node 4.

  **Node 3 (Relatability Test):** "Public virtue survives private cruelty." (Imagine a revolutionary who fought oppression but was cruel to family; does that life still teach virtue?)
  *   **Disagree (Contaminated):** → **Leaf 3: Moral Contagionist**
  *(Note: If virtue is contaminated, the life serves only as a warning; the question of negative exemplars becomes moot.)*
  *   **Agree (Survives):** Go to Node 5.

  **Node 4 (Distance Test):** "Pairing lives is doing real comparative work rather than just decorative framing."
  *   **Agree (Comparative):** Go to Node 5.
  *   **Disagree (Decorative):** Go to Node 5.
  *(Note: Both paths proceed to the Negative Lives question, but the resulting leaves are named differently based on this answer.)*

  **Node 5 (Negative Exemplars):** "Villains and failures instruct as well as saints do."
  *   **Agree (Yes):** → **Leaf 4, 6, or 7** (Depending on previous path).
  *   **Disagree (No):** → **Leaf 5** (Only available for Relatable/Accuracy path; see flags below).

  ---

  ### The Seven Leaves (Positions)

  1.  **Hagiographic Mirror** (Smooth + Relatable)
      You believe biography is a tool for self-improvement through identification. Truth is secondary to inspiration. If the subject isn't likable or relatable, the moral lesson fails. You read to feel good about emulating the dead.

  2.  **Idealized Icon** (Smooth + Distant)
      You believe biography offers standards of excellence beyond human reach. Accuracy matters less than the purity of the example. You don't need to see yourself in the subject; you need to look up to them. Flaws are distractions from the ideal.

  3.  **Moral Contagionist** (Accurate + Relatable + Contaminated)
      You believe character is indivisible. A hero who is cruel at home cannot be virtuous in public. You require accuracy, but if the truth reveals vice, the subject loses all instructional value. You read to identify good souls, not great deeds.

  4.  **Full-Spectrum Realist** (Accurate + Relatable + Survives + Negatives Yes)
      You believe biography teaches through complex identification. You see yourself in flawed heroes, and you believe vice and failure teach as much as virtue. You accept the revolutionary's cruelty but learn from the whole picture.

  5.  **Selective Realist** (Accurate + Relatable + Survives + Negatives No)
      You want accurate, relatable heroes, but you still believe only positive examples teach virtue. **(Flagged as Unstable):** This position is logically tense; if you accept accuracy and flawed heroes, rejecting negative exemplars often collapses into the *Moral Contagionist* or *Full-Spectrum* view upon scrutiny.

  6.  **Comparative Allegorist** (Accurate + Distant + Pairing Real + Negatives Yes)
      You believe biography reveals universal patterns through structure (like Plutarch's pairs). The subject is distant, but comparing lives extracts moral laws. You value negative lives as data points in the comparison.

  7.  **Historical Observer** (Accurate + Distant + Pairing Decorative + Negatives Yes)
      You believe biography teaches by providing context, not necessarily comparison. The pairing is just a framing device. You learn from villains and failures because they are historically true, not because they mirror you.

  ---

  ### Notes on Logic and Stability

  **Empty Combos:**
  *   **Smoothing + Negative Lives:** There is no leaf for this. If you believe in smoothing the narrative for moral effect, you inherently reject the utility of villains or failures. A "Hagiographic Villain" is a contradiction in terms.
  *   **Accuracy + Contaminated + Negative Lives Yes:** If you believe private cruelty contaminates public virtue (Node 3 Disagree), the subject becomes a negative exemplar by default. Splitting further on whether negatives teach is redundant; the life *is* a warning.

  **Indistinguishable Leaves:**
  *   **Comparative Allegorist vs. Historical Observer:** In practice, these two are hard to separate. Whether the pairing is "real comparative work" or "decorative framing" often comes down to how much the reader projects onto the text. Both end up treating the subjects as distant data points who can be villains or saints.
  *   **Selective Realist vs. Full-Spectrum Realist:** These are difficult to keep apart in a discussion. A person who claims accuracy matters but villains don't teach often slips into accepting villains as warnings (which is instruction) when pressed, merging them into the *Full-Spectrum* position.

  **Discussion Tip:**
  When using this tree, watch for people who land on **Selective Realist**. Ask them: "If a villain teaches me what *not* to do, haven't they instructed me?" Their answer will usually push them into either **Full-Spectrum Realist** (yes, they instruct) or **Moral Contagionist** (no, they just corrupt me).
