      *   *Refining the EDT section:* Need to be careful. EDT agents don't precommit in the same way because their current choice is evidentially linked to the past prediction. The pill is a causal mechanism to *force* a correlation. If you are already an EDT agent, you don't need the pill. If you are CDT, the pill acts as a causal bridge. The physical alteration doesn't break EDT, but EDT renders the pill superfluous for a rational agent *defined by EDT*.

  5.  **Self-Correction/Review during drafting:**
