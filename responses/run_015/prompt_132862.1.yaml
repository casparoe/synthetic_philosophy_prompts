      *   **Sentience vs. Organization:** Kant's worry about animals is often about pain/suffering affecting the human agent. Is organization enough to trigger the duty, or is sentience required?

  6.  **Drafting the Response:**
      *   *Tone:* Encouraging, academic, critical but constructive.
