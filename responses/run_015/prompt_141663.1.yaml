prompt: |-
  guy in my local rationality meetup is drafting a pop evo-bio blog series and posted this in the group chat as his "steelman of the anti-adaptationist case". I've read a lot of blog-level Gould discourse over the years but never the actual 1979 paper, so I can't tell how much of this is Gould and how much is my friend. Here's the paragraph:

  "In 1979 Gould and Lewontin published a devastating critique of adaptationism. Their claim was an empirical one: most traits of most organisms are not adaptations at all, they're spandrels — byproducts of selection on other traits, like the roughly triangular bits of masonry between the arches under the dome of St Mark's in Venice, which are there only because you can't set a dome on arches without leaving those gaps. The adaptationist programme they were attacking is the assumption that every trait was built by selection for the job it now does; they called it the Panglossian paradigm, after Voltaire's Dr Pangloss. And they gave a test: before you accept any adaptationist explanation, ask whether the trait could have arisen as a side effect of something else. If it could, it's a spandrel until someone proves otherwise. This is the reason to be extremely suspicious of just-so stories in ev psych: if a trait could be a byproduct, the burden of proof is on whoever claims it's an adaptation."

  Three things make me twitchy but I can't cash them out. (1) The "most traits" line feels like it's converting a complaint about method into a headcount, and I don't know why that matters or whether it matters at all. (2) His test looks like it would classify basically everything as a spandrel, which would make it useless — and yet I've definately seen "spandrel" used online to just mean "trait that isn't for anything", so maybe that shift is already baked into the word. (3) Someone in the thread said the features they were pointing at in the basilica are technically pendentives, not spandrels, and that Dennett made a big deal of this somewhere; is that pedantry, or does it actually bite on the argument? I also half-remember a related term, "exaptation", that Gould supposedly introduced later with someone else — is that the piece his paragraph is missing?

  What I actually care about is the downstream use. In comment sections I constantly see someone propose that X (status competition, disgust at contamination, whatever) is an adaptation for Y, and someone else reply "or spandrel", and that's treated as a refutation or at least as having flipped the burden of proof. Is that a fair moral of the paper, or is it the exact failure mode the paper was warning about with the sign flipped?

  So: go through his paragraph and tell me what Gould and Lewontin would actually have endorsed, what's a fair simplification for a popular audience, what's subtly wrong and how wrong, and what a working evolutionary biologist who self-identifies as an adaptationist would call a strawman. Then tell me whether his conclusion survives the corrections — i.e. does the real version of the critique still license suspicion of adaptationist hypotheses, and if so what form should that suspicion take instead of "could be a byproduct, therefore not an adaptation"?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A friend in a rationality meetup is writing a pop evo-bio blog series. He posted a summary of Gould & Lewontin's 1979 "Spandrels of San Marco" paper as a "steelman of the anti-adaptationist case."
      *   **User's Background:** Read blog-level Gould discourse, not the 1979 paper.
      *   **User's Concerns:**
          1.  "Most traits" claim (methodological complaint vs. empirical headcount).
          2.  The "test" (seems to classify everything as a spandrel/useless).
          3.  The architectural pedantry (spandrels vs. pendentives, Dennett's critique).
          4.  Missing term: "Exaptation."
          5.  **Core Question:** Is the downstream usage ("or spandrel" as a refutation/burden flip) fair to the paper, or is it the *same* failure mode the paper warned about?
      *   **Task:** Evaluate the paragraph against the actual 1979 paper, distinguish endorsement vs. simplification vs. error, address the architectural/exaptation points, and determine the valid downstream epistemic stance.

  2.  **Deconstruct the Friend's Paragraph:**
      *   *Claim 1:* "most traits of most organisms are not adaptations at all, they're spandrels."
      *   *Claim 2:* Adaptationist programme = assumption that every trait was built by selection for the job it now does.
      *   *Claim 3:* The Test = "ask whether the trait could have arisen as a side effect... If it could, it's a spandrel until someone proves otherwise."
      *   *Claim 4:* Conclusion = "if a trait could be a byproduct, the burden of proof is on whoever claims it's an adaptation."

  3.  **Evaluate against Gould & Lewontin (1979) "The Spandrels of San Marco and the Panglossian Paradigm":**
      *   *Claim 1 ("Most traits"):* G&L definitely argued that adaptationism is *too prevalent*, but did they claim a numerical majority? They argued that non-adaptive explanations (drift, constraint, byproduct) are underutilized. Claiming "most" is a strong empirical claim they implied but didn't strictly prove. It's more of a rhetorical stance against the *default assumption*.
      *   *Claim 2 (Panglossian Paradigm):* Accurate. G&L criticized the tendency to assume optimal design for current utility.
      *   *Claim 3 (The Test):* This is the tricky part. G&L argued for *considering* alternatives. They didn't say "If it *could* be a byproduct, it *is* a byproduct." They said adaptationists often fail to *test* the byproduct hypothesis. The friend's formulation ("If it could... it's a spandrel until proven otherwise") shifts the null hypothesis. G&L wanted a pluralistic approach, not necessarily a hard flip of the burden of proof to the point of paralysis.
      *   *Claim 4 (Burden of Proof):* G&L definitely wanted to raise the bar for adaptationist claims. They wanted rigorous evidence, not just plausibility.

  4.  **Address the User's "Twitches":**
      *   *(1) "Most traits":* User is right. It converts a methodological critique ("don't assume adaptation") into an empirical claim ("most aren't adaptations"). G&L leaned this way, but modern biology sees it as overstated.
      *   *(2) The Test:* User is right. "Could it be a side effect?" applies to almost everything. If the rule is "If possible, then not adaptation," adaptationism dies. G&L wanted *comparative evaluation*, not automatic dismissal.
      *   *(3) Architecture (Spandrels vs. Pendentives):* Dennett (1995) made a big deal of this. It's technically true (they are pendentives), but does it bite? It undermines the *metaphor's* precision. If the architectural feature *was* designed to hold the dome (which pendentives are), the metaphor collapses. G&L claimed they were *necessary byproducts*. Architects argue they are structural necessities designed for that purpose. This weakens the central analogy.
      *   *(4) Exaptation:* Crucial point. Gould & Vrba (1982) introduced "exaptation" (trait shaped for one use, co-opted for another). The friend's paragraph conflates "byproduct" (spandrel) with "co-opted trait" (exaptation). This is a significant conceptual blur.

  5.  **Address the Downstream Usage ("Or Spandrel"):**
      *   Is "or spandrel" a refutation? No. It's a request for more evidence.
      *   Does it flip the burden of proof? Ideally, yes, in the sense that "plausible story" $\neq$ "evidence." But treating it as a conversation-ender is bad science.
      *   Is it the sign-flipped failure mode? Yes. Dogmatic anti-adaptationism is just as bad as dogmatic adaptationism. G&L warned against *pluralism failure*, not just adaptationism.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the friend's summary is "blogosphere Gould" – recognizable but distorted.
      *   *Section 1: The Paragraph Audit.* Go through the specific claims.
          *   "Most traits": Overstatement. G&L argued prevalence of *reasoning*, not necessarily a census of traits.
          *   "The Test": This is the biggest error. G&L asked for *comparison*, not automatic nullification.
          *   "Burden of Proof": Nuanced. They wanted higher standards, not impossible ones.
      *   *Section 2: The Architectural Pedantry.* Address Dennett. It matters because if spandrels are designed, the metaphor fails. But the biological point (constraints) stands even if the metaphor is shaky.
      *   *Section 3: Exaptation.* Explain the difference between Spandrel (byproduct, never selected) and Exaptation (selected for X, used for Y). The friend misses this.
      *   *Section 4: The Downstream Usage.* This is the core value add.
          *   "Or spandrel" is a valid *challenge*, not a *refutation*.
          *   The "Burden Flip" is partially correct (plausibility isn't proof) but dangerous if it stops inquiry.
          *   The "Sign-Flipped Failure Mode": Yes, dogmatic anti-adaptationism is a thing.
      *   *Section 5: The Working Biologist's View.* What would an adaptationist say? They'd say constraints matter, but selection is the only non-teleological explanation for *complex functional design*. Spandrels don't explain complex machinery.
      *   *Conclusion:* Summary advice for the user.

  7.  **Refining the Tone:**
      *   Keep it rationalist-adjacent (since the user is in a rationality meetup). Use terms like "steelman," "burden of proof," "prior."
      *   Be precise about the 1979 paper vs. later Gould work (Exaptation 1982).
      *   Ensure the distinction between "constraint/byproduct" and "exaptation" is clear.

  8.  **Self-Correction/Fact Check during drafting:**
      *   *Did G&L explicitly say "most traits"?* They said the adaptationist program assumes "natural selection is so omnipotent... that almost every feature... is a product." They argued this is false. They didn't give a percentage, but the implication is "many more than you think." The friend's "most" is a strengthening.
      *   *Dennett's Critique:* In *Darwin's Dangerous Idea*. He argues the pendentives *are* designed features. This attacks the "byproduct" nature of the metaphor.
      *   *Exaptation:* Gould & Vrba 1982. Distinct from Spandrels (1979). Spandrels are non-adaptive byproducts. Exaptations are co-opted traits (can be adaptive now, just not originally for *this*). The friend conflates them.
      *   *Burden of Proof:* G&L definitely wanted to shift the burden. "Adaptation is a hypothesis, not a default." So the friend is right on the *spirit* of the burden shift, but wrong on the *mechanism* ("if it could be" is too low a bar).

  9.  **Final Polish:** Organize with clear headings. Ensure the "Downstream Use" section is robust, as that's what the user cares about most. (Make sure to emphasize that "or spandrel" should trigger *comparative model testing*, not *dismissal*).

  10. (Final check against user prompt): Did I answer all three twitches? Yes. Did I address exaptation? Yes. Did I address the downstream usage? Yes. Did I say what a biologist would call a strawman? Yes.

  Proceed to generate response.
answer: |-
  This is a great catch. Your friend's paragraph is a very standard "folk biology" summary of Gould and Lewontin (1979), but it conflates several distinct concepts, hardens methodological warnings into empirical laws, and misses the nuance that actually makes the paper useful.

  Here is the breakdown of what Gould and Lewontin (G&L) actually argued, where your friend's summary deviates, and how to handle the downstream "or spandrel" move in comment sections.

  ### 1. Auditing the Paragraph

  **Claim:** *"Most traits of most organisms are not adaptations at all, they're spandrels."*
  *   **G&L Endorsement:** **Partial.** G&L argued that adaptationism is a *dominant methodology* that ignores other factors. They claimed non-adaptive explanations are *underutilized*, not necessarily that they account for >50% of traits numerically.
  *   **The Error:** Converting a methodological critique into an empirical headcount. G&L's point was that biologists *assume* adaptation without testing alternatives. Claiming "most traits are spandrels" is itself an adaptationist-style empirical claim (a claim about the frequency of traits in nature) made without the data to support it.
  *   **Biologist's View:** A modern evolutionary biologist would call this a **strawman of the strawman**. Most biologists already accept drift, constraint, and phylogenetic inertia are real. The debate is about *complex functional design*. Spandrels explain noise; they don't explain eyes.

  **Claim:** *"The adaptationist programme... is the assumption that every trait was built by selection for the job it now does."*
  *   **G&L Endorsement:** **Yes.** This is the "Panglossian Paradigm." They accurately identified the tendency to assume current utility = historical selection pressure.
  *   **The Error:** None here. This is the core of the 1979 paper.

  **Claim:** *"And they gave a test: ... ask whether the trait could have arisen as a side effect of something else. If it could, it's a spandrel until someone proves otherwise."*
  *   **G&L Endorsement:** **No.** This is the critical distortion.
  *   **The Error:** G&L argued you must *consider* and *test* the byproduct hypothesis against the adaptation hypothesis. They did **not** argue that mere possibility defaults the trait to "spandrel."
  *   **Why it matters:** As you noted, almost anything *could* be a side effect. If "possibility of byproduct" = "null hypothesis," evolutionary biology halts. G&L wanted *comparative evaluation* (e.g., does the trait vary with the selection pressure? Is there genetic variation for it?), not an automatic burden flip based on logical possibility.

  **Claim:** *"If a trait could be a byproduct, the burden of proof is on whoever claims it's an adaptation."*
  *   **G&L Endorsement:** **Yes, in spirit.** They wanted to raise the evidentiary bar. "Plausible story" should not count as evidence.
  *   **The Error:** The bar they wanted was *rigorous testing*, not *impossible proof*. Your friend's framing suggests the adaptationist must disprove all alternative histories, which is often impossible.

  ### 2. The Architectural Pedantry (Spandrels vs. Pendentives)

  You asked if the Dennett critique is pedantry. **It bites.**

  *   **The Metaphor:** G&L used the triangular spaces between arches (spandrels) to illustrate features that are *necessary byproducts* of a design constraint (you can't put a dome on arches without gaps). They argued these gaps were *not* designed for decoration initially; artists later painted them.
  *   **Dennett's Critique:** In *Darwin's Dangerous Idea*, Dennett (consulting architects) pointed out that the specific features G&L pointed to in St. Mark's are **pendentives**. Pendentives are not accidental gaps; they are engineered structural components *designed* to transfer the weight of the dome to the arches.
  *   **The Implication:** If the architectural feature was *selected for* its structural utility, the metaphor collapses. It becomes an example of adaptation, not a byproduct.
  *   **Does it invalidate the biology?** Not entirely. The biological concept of "constraint" (you can't evolve a wheel because of developmental pathways) is real. But it undermines the central rhetorical device of the paper. It suggests G&L were so eager to find non-adaptive examples they misidentified the adaptive ones in their own analogy.

  ### 3. The Missing Piece: Exaptation

  You are right to flag this. Your friend's paragraph conflates **Spandrels** with **Exaptations**.

  *   **Spandrel (1979):** A trait that is a non-adaptive byproduct of selection on *another* trait. It has no function (or at least, wasn't selected for). Example: The redness of blood (byproduct of hemoglobin chemistry, not selected for signaling).
  *   **Exaptation (Gould & Vrba, 1982):** A trait that was selected for Function A, but is now used for Function B. Or, a byproduct that was later co-opted for function. Example: Feathers likely evolved for thermoregulation (Function A) and were later co-opted for flight (Function B).
  *   **Why it matters:** Your friend's paragraph treats "not an adaptation for Y" as "not an adaptation at all." But a trait can be a spandrel *originally* and become an adaptation *later* (exaptation). By missing this, your friend creates a false dichotomy: either it was built for this purpose, or it's useless noise. Reality is often: it was noise, then it became useful, then it was refined.

  ### 4. The Downstream Usage: "Or Spandrel"

  This is the part you actually care about. In comment sections, "or spandrel" is often used as a conversation-ender. Is this fair?

  **The Verdict:** Using "or spandrel" as a **refutation** is the exact failure mode G&L warned about, with the sign flipped.

  *   **Dogmatic Adaptationism:** "It exists, therefore it was selected for." (Failure: Ignores constraints/drift).
  *   **Dogmatic Anti-Adaptationism:** "It *could* be a byproduct, therefore it wasn't selected for." (Failure: Ignores functional design evidence).

  **The Fair Use:**
  "Or spandrel" should function as a **request for comparative evidence**, not a nullification.
  *   *Unfair:* "Disgust is an adaptation for pathogen avoidance." / "Or it's a spandrel of general threat detection. You haven't ruled that out. Adaptationism debunked."
  *   *Fair:* "Disgust is an adaptation for pathogen avoidance." / "That's a strong hypothesis. Have you controlled for the possibility that it's a byproduct of general threat detection? What evidence distinguishes the specific pathogen-avoidance model from the general threat model?"

  **Does the critique still license suspicion?**
  Yes, but the suspicion should be directed at **just-so stories**, not at **adaptationist hypotheses**.
  G&L's valid legacy is that *plausibility is not evidence*. Just because you can tell a coherent story about why Status Competition evolved to manage hierarchy doesn't mean it did.
  *   **Valid Suspicion:** "Your story is coherent, but do you have cross-cultural variance data? Do you have genetic heritability estimates? Do you have a phylogenetic comparison showing the trait tracks the environmental pressure?"
  *   **Invalid Suspicion:** "Your story is coherent, but a byproduct story is also coherent, therefore we can't know anything."

  ### 5. Summary for Your Friend

  If you want to give feedback to your friend, here is the "steelman of the steelman":

  1.  **Correct the "Most" Claim:** Change "most traits are spandrels" to "adaptationists often fail to test whether traits are spandrels." Keep it methodological, not empirical.
  2.  **Fix the Test:** The test isn't "Could it be a byproduct?" (Yes, always). The test is "Does the trait show evidence of specific design for this function (e.g., complexity, specificity, cost) that a byproduct hypothesis cannot explain?"
  3.  **Add Exaptation:** Acknowledge that a trait can be a byproduct *originally* and an adaptation *currently*. This saves the adaptationist from having to prove the trait was *always* for its current use.
  4.  **Refine the Burden of Proof:** The burden isn't on the adaptationist to *disprove* spandrels. The burden is on *both* sides to provide evidence that distinguishes their model from the null. However, the adaptationist bears the burden of explaining **complex functional design**, because spandrels rarely produce complex machinery.

  **Bottom Line:**
  The "or spandrel" move is valid **epistemic hygiene** if it forces better evidence. It is **intellectual sloth** if it is used to dismiss functional explanations without offering a competing model that fits the data equally well. G&L wanted more rigorous science, not less ambitious explanation. Your friend's summary accidentally argues for the latter.
