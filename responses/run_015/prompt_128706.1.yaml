      *   *Anthropocene Counter:* Human impact (carbon, nuclear, geoengineering) *is* now a geological force. Therefore, an *événement* (e.g., signing the Paris Accord, building a dam) can alter the *longue durée* (climate, topography). The hierarchy collapses.
