  2.  **Analyze the Source Material (Schlick's *Vom Sinn des Lebens* / "The Meaning of Life"):**
      *   *Context:* Moritz Schlick, Logical Positivist. Essay published 1927.
      *   *Core Argument:* The question "What is the meaning of life?" is often misunderstood as asking for a *purpose* (Zweck). If life is a means to an end, it loses value once the end is reached. Therefore, meaning cannot lie in purposes.
      *   *Work vs. Play:*
          *   *Arbeit (Work):* Activity done for the sake of something else (means to an end). Drudgery.
