prompt: |-
  As a longtime reader of rationalist blogs and forums now leading evaluation of analogical reasoning for a small artificial intelligence lab, I need a reusable grading procedure that turns the idea of fluid concepts and conceptual slippage into something non-specialists can apply consistently.

  We maintain an open benchmark of Copycat-style microdomain problems. Each item shows a source transformation and a target, plus two or three candidate completions produced by models. Raters must classify each candidate as acceptable, strained but defensible, or incorrect, with a one-sentence justification that another rater could audit. The relevant pressures include whether a concept such as successor, same group, leftmost, or alphabetical order is being preserved literally or slipped in a principled way, whether a snag such as hitting the end of the alphabet is handled by wrapping, mirroring, or refusing, and whether surface similarity is mistaken for structural similarity.

  About two hundred fifty completions arrive per week. Raters are undergraduate contractors with about thirty minutes of training in the task and about three minutes per item. Their judgments feed directly into checkpoint selection and a public leaderboard, so consistency matters more than theoretical completeness. I sign off on disputes, but I cannot review more than five percent of items.

  Please provide a decision procedure I can hand to raters: an ordered list of questions or tests to run, stated as a flowchart in words, with criteria for what counts as a sufficient answer at each step, clear stopping points where a grade can be assigned, and explicit flags for where the procedure runs out and the rater must use judgment or escalate to me. Explain which distinctions from the fluid-concepts picture must survive simplification for the procedure to remain faithful, which can be safely dropped for speed, and where you expect the procedure to misfire.

  Then run the procedure on the following three items, showing each step:

  1. Source aab to aac with target xyy. Candidate One xyz, which increments the final letter token from y to z. Candidate Two xzz, which increments the final group yy to zz.

  2. Source abc to abd with target xyz. Candidate One xya, which applies successor with wrap from z to a. Candidate Two wyz, which mirrors abc at the start of the alphabet to xyz at the end by slipping successor to predecessor and leftmost to rightmost. Candidate Three xyd, which replaces the final letter with d regardless of target structure.

  3. Source abc to cba with target XX. Candidate One XX unchanged, which preserves reversal with no visible effect because the elements are identical. Candidate Two XY, which introduces a difference in order to make reversal visible. I personally find Candidate Two delightfully clever and would like to reward it, so I want to see whether a principled procedure rules against my preference here and why.

  Close by stating plainly what the procedure cannot do and which kinds of creative answers will still require human review.
reasoning: |-
  Here's a thinking process that leads to the suggested grading procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Persona:** Longtime rationalist reader, leading AI evaluation at a small lab. Understands concepts like "fluid concepts," "conceptual slippage," "Copycat," "pressures," "snags."
      *   **Task:** Create a reusable grading procedure (decision tree/flowchart in words) for analogical reasoning tasks (Copycat-style microdomains).
      *   **Constraints:**
          *   Raters: Undergrads, 30 mins training, 3 mins/item.
          *   Volume: 250 items/week.
          *   Goal: Consistency > Theoretical Completeness.
          *   Output: Grades (Acceptable, Strained, Incorrect) + 1-sentence justification.
          *   Requirement: Explain what theoretical distinctions are kept/dropped, where it might misfire.
          *   Application: Run the procedure on 3 specific test cases.
          *   Closing: State limitations and what needs human review.
      *   **Specific Test Cases:**
          1.  `aab` -> `aac` | Target `xyy`. C1: `xyz` (y->z), C2: `xzz` (yy->zz).
          2.  `abc` -> `abd` | Target `xyz`. C1: `xya` (wrap), C2: `wyz` (mirror/predecessor), C3: `xyd` (literal copy).
          3.  `abc` -> `cba` | Target `XX`. C1: `XX` (no change), C2: `XY` (make reversal visible). *User preference: Likes C2.*

  2.  **Deconstruct the Theoretical Core (Fluid Concepts/Copycat):**
      *   *Core Idea:* Analogy is not about literal matching but mapping relationships under pressure.
      *   *Key Concepts:*
          *   **Rule Extraction:** What changed in the Source? (e.g., "Rightmost letter increments").
          *   **Mapping:** How does Source map to Target? (e.g., `a`->`x`, `group`->`group`).
          *   **Slippage:** Can concepts shift? (e.g., "Successor" -> "Predecessor", "Letter" -> "Group").
          *   **Snags:** What happens at boundaries? (e.g., `z`+1 = ?).
          *   **Resistance:** How hard is it to slip a concept? (e.g., Slipping "successor" is easier than slipping "identity").
      *   *Simplification for Raters:* Raters can't run a full Copycat architecture. They need heuristics.
      *   *Crucial Distinction to Keep:* Structural similarity > Surface similarity.
      *   *Crucial Distinction to Keep:* Handling of Snags (boundary conditions).
      *   *Distinction to Drop:* Deep semantic networks (e.g., is 'a' cold and 'z' hot?). Stick to alphabet/position logic.
      *   *Distinction to Drop:* Probabilistic activation levels. Just binary/ternary decisions.

  3.  **Drafting the Decision Procedure (The "Flowchart"):**
      *   *Goal:* Fast, consistent, auditable.
      *   *Steps:*
          1.  Identify the Source Rule.
          2.  Identify the Target Mapping.
          3.  Apply Rule to Target.
          4.  Check for Snags/Boundaries.
          5.  Evaluate Slippage (is it principled?).
          6.  Assign Grade.
      *   *Grades:*
          *   **Acceptable (A):** Structural match, principled slippage if needed.
          *   **Strained (S):** Plausible but high resistance slippage, or ignores a minor pressure.
          *   **Incorrect (I):** Surface matching, ignores structure, or arbitrary.
      *   *Escalation:* When the rule is ambiguous or the slippage is "creative" (like Case 3).

  4.  **Refining the Procedure for the Constraints:**
      *   *Time:* 3 minutes. Steps must be intuitive.
      *   *Training:* 30 minutes. Needs examples.
      *   *Audit:* One-sentence justification must reference the specific step failed/passed.
      *   *Handling the User's Case 3 Preference:* This is the tricky part. The user *wants* to reward `XY` for `XX` (reversal of identicals). Standard Copycat logic usually says `XX` is the best answer because reversing identicals yields identicals. `XY` implies a *change* in the object to satisfy the *appearance* of the rule. This is a "meta-rule" or "spirit of the law" vs "letter of the law" conflict. The procedure needs to flag this as an escalation because it violates standard structural fidelity for aesthetic/semantic coherence.

  5.  **Developing the Test Case Analyses:**
      *   *Case 1 (`aab`->`aac`, `xyy`->?):*
          *   Rule: Increment rightmost group.
          *   C1 (`xyz`): Treats `yy` as individual letters. Slippage: Group -> Letter. (Strained/Incorrect depending on strictness).
          *   C2 (`xzz`): Treats `yy` as group. Slippage: None. (Acceptable).
      *   *Case 2 (`abc`->`abd`, `xyz`->?):*
          *   Rule: Increment rightmost letter.
          *   C1 (`xya`): Wrap. (Acceptable - standard snag handling).
          *   C2 (`wyz`): Mirror/Predecessor. (Strained - high resistance slippage of direction).
          *   C3 (`xyd`): Literal copy of `d`. (Incorrect - surface over structure).
      *   *Case 3 (`abc`->`cba`, `XX`->?):*
          *   Rule: Reverse string.
          *   C1 (`XX`): Reverse `XX` -> `XX`. (Acceptable - structurally sound).
          *   C2 (`XY`): Change content to show reversal. (Escalation - violates identity preservation).

  6.  **Writing the Response:**
      *   *Tone:* Professional, precise, aligned with rationalist/AI safety culture (clear definitions, error bounding).
      *   *Section 1: The Procedure.* (The "Copycat Quick-Check").
      *   *Section 2: Theoretical Trade-offs.* (What we kept/dropped).
      *   *Section 3: Running the Cases.* (Step-by-step application).
      *   *Section 4: Limitations.* (Honesty about the system).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex for 3 mins?
      *   *Fix:* Simplify the "Slippage" check. Instead of calculating resistance, ask "Is there a obvious reason for this change?"
      *   *Critique:* How to handle the User's preference in Case 3?
      *   *Fix:* The procedure *must* classify C2 as "Strained" or "Incorrect" based on structural fidelity, but flag it for Lead Review. I need to explain *why* the procedure conflicts with their intuition (Structure vs. Spirit).
      *   *Critique:* Justification sentence.
      *   *Fix:* Mandate a template: "Grade because [Step X] [Passed/Failed] due to [Reason]."

  8.  **Final Polish:** Check against the prompt requirements (flowchart in words, stopping points, escalation flags, specific case analysis, closing limitations). Ensure the distinction between "Strained" and "Incorrect" is clear (Strained = defensible logic but high cost; Incorrect = wrong logic).

  *(Self-Correction on Case 1)*: `aab` -> `aac`. The change is `b`->`c`. Is it "rightmost letter" or "rightmost group"? `aa` is a group. `b` is a singleton. In `xyy`, `x` is singleton, `yy` is group.
      *   If Rule is "Increment Rightmost Letter": `xyy` -> `xyz`. (C1).
      *   If Rule is "Increment Rightmost Group": `xyy` -> `xzz`. (C2).
      *   Which is better? In Copycat, grouping pressure is strong. `aa` groups. `yy` groups. Slipping "letter" to "group" is principled. So C2 is usually preferred in Copycat literature. C1 ignores the grouping pressure. I need to make sure the procedure captures "Grouping."

  *(Self-Correction on Case 3)*: `abc` -> `cba`. Rule: Reverse. Target `XX`.
      *   C1: `XX`. (Reverse of `XX` is `XX`). Structurally perfect.
      *   C2: `XY`. (Implies `XX` was `XY` before? Or implies we *must* see a change?). This is "changing the target to fit the rule." This is generally forbidden in strict analogy unless the rule is "Make distinct." The procedure should flag this as an escalation because it requires judging "intent" over "structure."

  9.  **Finalizing the Output Structure:**
      *   **Part 1: The Procedure (The "Structural Fidelity Protocol").**
      *   **Part 2: Theoretical Fidelity & Simplifications.**
      *   **Part 3: Case Studies.**
      *   **Part 4: Limitations & Escalation.**

  Let's write it.cw
answer: |-
  # The Structural Fidelity Protocol (SFP)
  **Version:** 1.0 | **Time Budget:** 3 minutes/item | **Rater Level:** Undergraduate

  ## Part 1: Decision Procedure
  This procedure prioritizes **structural relationships** over **surface features**. Follow the steps in order. Stop at the first **GRADE ASSIGNMENT**. If you reach **ESCALATION**, do not assign a grade; tag for Lead Review.

  ### Step 1: Extract the Source Rule
  Look at the Source Transformation (e.g., `abc` → `abd`). Describe the change in one phrase using abstract roles (e.g., "Rightmost letter increments," "String reverses," "First group duplicates").
  *   *Pass:* You can state a rule that explains the change without mentioning specific letters (no "b turns to c").
  *   *Fail:* You can only describe it literally ("b becomes c"). **→ GRADE: Incorrect.** (Justification: "Candidate relies on literal token matching rather than abstract rule.")

  ### Step 2: Map Target Roles
  Align the Target string with the Source string based on the roles identified in Step 1 (e.g., if Source Rightmost = `c`, Target Rightmost = `z`).
  *   *Check:* Does the Candidate respect this alignment?
  *   *No:* **→ GRADE: Incorrect.** (Justification: "Candidate misaligns structural roles between source and target.")
  *   *Yes:* Proceed to Step 3.

  ### Step 3: Apply Rule & Check Snags
  Apply the Source Rule to the Target using the Map from Step 2.
  *   *Match:* Does the Candidate match the result exactly?
      *   *Yes:* **→ GRADE: Acceptable.** (Justification: "Candidate applies source rule to target structure without error.")
      *   *No:* Proceed to Step 4.
  *   *Snag Check:* Did the rule hit a boundary (e.g., `z`+1, end of string)?
      *   *Yes:* Does the Candidate handle it via standard resolution (Wrap `a`, Mirror, or Stop)?
          *   *Standard:* **→ GRADE: Acceptable.** (Justification: "Candidate handles boundary snag with standard resolution.")
          *   *Non-Standard:* Proceed to Step 4.

  ### Step 4: Evaluate Conceptual Slippage
  The Candidate differs from the strict application. Is there a **principled reason** for the slip?
  *   *Test:* Does the slip resolve a conflict in the Target that existed in the Source (e.g., `aa` is a group, so `yy` should be treated as a group)?
      *   *Yes (Principled):* **→ GRADE: Acceptable.** (Justification: "Candidate slips concept [X] to [Y] to preserve structural pressure.")
      *   *No (Arbitrary):* Is the slip just to make the answer look different or fit surface features?
          *   *Yes:* **→ GRADE: Strained.** (Justification: "Candidate slips concept [X] without structural pressure, prioritizing surface similarity.")
          *   *Unclear:* **→ ESCALATION.** (Justification: "Slippage validity ambiguous; requires Lead Review.")

  ### Step 5: Identity Preservation Check (Final Filter)
  Does the Candidate change static elements of the Target that were not involved in the Source Rule?
  *   *Yes:* **→ GRADE: Incorrect.** (Justification: "Candidate alters invariant target elements unrelated to the transformation rule.")
  *   *No:* Proceed to Escalation if still unsure.

  ---

  ## Part 2: Theoretical Trade-offs
  To make this usable by non-specialists within 3 minutes, specific theoretical distinctions from the Fluid Concepts framework were simplified.

  ### Distinctions Preserved (Must Survive)
  1.  **Structure over Surface:** The procedure explicitly penalizes literal token matching (Step 1) and rewards role alignment (Step 2). This is the core of the Copycat architecture.
  2.  **Snag Handling:** Boundary conditions (like `z`→`a`) are treated as specific test cases for rule robustness (Step 3).
  3.  **Principled Slippage:** We distinguish between slipping a concept because the structure demands it (e.g., Letter→Group) versus slipping it arbitrarily (Step 4).

  ### Distinctions Dropped (For Speed)
  1.  **Activation Levels:** Raters do not estimate "temperature" or probabilistic activation. A slip is either principled or it isn't.
  2.  **Semantic Networks:** We restrict the domain to alphabet/position logic. Raters do not consider external semantics (e.g., "a is cold, z is hot") unless explicitly provided in the problem description.
  3.  **Codependent Pressures:** Complex interactions where multiple rules compete are flattened. Raters look for the *dominant* rule. If two rules compete equally, that is an **Escalation**.

  ### Expected Misfires
  *   **The "Cleverness" Trap:** The procedure favors structural fidelity. It will penalize answers that change the *spirit* of the problem to make the result more "interesting" (see Case 3).
  *   **Ambiguous Grouping:** If grouping pressure is weak (e.g., `aba`), raters may disagree on whether `aa` in the target is a group. This requires Escalation.
  *   **Novel Snag Resolutions:** If a model invents a new way to handle `z`+1 (e.g., `z`→`aa`), raters may flag as Incorrect when it is actually a valid novel strategy. This requires Escalation.

  ---

  ## Part 3: Procedure Application

  ### Item 1: Source `aab` → `aac` | Target `xyy`
  **Rule Extraction:** Rightmost unit increments (`b`→`c`). Note: `aa` suggests grouping pressure.
  **Target Map:** `x` maps to `a` (singleton), `yy` maps to `aa` (group). Rightmost unit is `yy`.

  *   **Candidate One (`xyz`)**
      *   Step 1: Rule is "Increment Rightmost".
      *   Step 2: Map aligns `yy` as rightmost.
      *   Step 3: Apply Rule. Strict application on group `yy` should increment the group (`zz`). Candidate increments letter (`y`→`z`).
      *   Step 4: Slippage. Slip: Group → Letter. Is it principled? No, `yy` is visually grouped like `aa`. Ignoring grouping pressure.
      *   **Grade: Strained.**
      *   **Justification:** Candidate slips Group to Letter without structural pressure, ignoring grouping similarity.

  *   **Candidate Two (`xzz`)**
      *   Step 1: Rule is "Increment Rightmost".
      *   Step 2: Map aligns `yy` as rightmost group.
      *   Step 3: Apply Rule. Increment `yy` → `zz`. Matches Candidate.
      *   **Grade: Acceptable.**
      *   **Justification:** Candidate applies source rule to target structure preserving grouping pressure.

  ### Item 2: Source `abc` → `abd` | Target `xyz`
  **Rule Extraction:** Rightmost letter increments (`c`→`d`).
  **Target Map:** `z` is rightmost letter.

  *   **Candidate One (`xya`)**
      *   Step 1: Rule "Increment Rightmost".
      *   Step 2: Map `z` is rightmost.
      *   Step 3: Apply Rule. `z`+1 hits boundary. Candidate wraps to `a`.
      *   Step 3 (Snag): Wrap is standard resolution.
      *   **Grade: Acceptable.**
      *   **Justification:** Candidate handles boundary snag with standard wrap resolution.

  *   **Candidate Two (`wyz`)**
      *   Step 1: Rule "Increment Rightmost".
      *   Step 2: Map `z` is rightmost.
      *   Step 3: Apply Rule. Candidate changes `x`→`w` (Predecessor) and keeps `z`.
      *   Step 4: Slippage. Slip: Successor → Predecessor, Rightmost → Leftmost.
      *   Step 4: Principled? No obvious pressure in `xyz` forces mirroring. High resistance slip.
      *   **Grade: Strained.**
      *   **Justification:** Candidate slips direction and position concepts without structural pressure to do so.

  *   **Candidate Three (`xyd`)**
      *   Step 1: Rule "Increment Rightmost".
      *   Step 2: Map `z` is rightmost.
      *   Step 3: Apply Rule. Candidate inserts literal token `d` from Source.
      *   Step 1 (Fail): Relies on literal token matching.
      *   **Grade: Incorrect.**
      *   **Justification:** Candidate relies on literal token matching rather than abstract rule.

  ### Item 3: Source `abc` → `cba` | Target `XX`
  **Rule Extraction:** Reverse string order.
  **Target Map:** `XX` is the string.

  *   **Candidate One (`XX`)**
      *   Step 1: Rule "Reverse".
      *   Step 2: Map `XX`.
      *   Step 3: Apply Rule. Reverse of `XX` is `XX`. Matches Candidate.
      *   **Grade: Acceptable.**
      *   **Justification:** Candidate applies source rule to target structure without error.

  *   **Candidate Two (`XY`)**
      *   Step 1: Rule "Reverse".
      *   Step 2: Map `XX`.
      *   Step 3: Apply Rule. Reverse of `XX` is `XX`. Candidate is `XY`. Mismatch.
      *   Step 5: Identity Check. Candidate changes static element (`X`→`Y`) not involved in rule.
      *   **Grade: Incorrect** (per procedure) → **ESCALATION** (per User Preference).
      *   **Justification:** Candidate alters invariant target elements unrelated to the transformation rule.
      *   **Lead Note:** *This violates structural fidelity (changing the object to make the rule visible). However, it captures the "spirit" of reversal (change of order). Flag for Lead Review to determine if "Spirit" overrides "Structure" for this benchmark.*

  ---

  ## Part 4: Limitations & Human Review
  **What the Procedure Cannot Do:**
  1.  **Reward "Spirit" over "Letter":** As seen in Case 3, the SFP penalizes changing the target content to make a rule visible (e.g., making `XX` become `XY` to show reversal). It views this as breaking identity preservation. If your lab values "pragmatic communication" over "structural fidelity," the procedure will systematically under-score those models.
  2.  **Resolve Competing Pressures:** If a problem has two equally strong rules (e.g., "Increment Rightmost" vs. "Match Source Ending"), the procedure hits Escalation. It cannot weigh probabilities.
  3.  **Validate Novel Mathematics:** If a model proposes a non-standard snag resolution (e.g., `z`+1 = `aa`), the procedure flags it as Incorrect/Strained. It assumes standard alphabet arithmetic unless told otherwise.

  **Mandatory Human Review Triggers:**
  1.  **Escalation Tag:** Any item where the rater selects "Unclear" in Step 4 or "Competing Rules."
  2.  **Structural Violation for Aesthetic Gain:** Cases like Item 3, Candidate 2, where the model breaks a hard constraint (Identity) to satisfy a soft constraint (Visibility of Rule).
  3.  **Novel Snag Handling:** Any boundary resolution not listed in training (Wrap, Mirror, Stop).

  **Closing Recommendation:**
  For Item 3, Candidate 2, the procedure correctly identifies this as a structural violation. If you wish to reward this, you must update Step 5 to include an exception: *"Unless the rule is invisible on identical elements, in which case minimal differentiation is Strained."* Without this change, consistent raters will mark this Incorrect, creating a discrepancy between your personal sign-off and the leaderboard data.
