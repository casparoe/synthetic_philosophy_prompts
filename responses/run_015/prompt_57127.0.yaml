answer: |-
  Good afternoon. I know the clock says four. I know energy is low. But what we start today matters.

  Look at the people sitting next to you. There are one hundred and ten of you who were drawn by lot. There are one hundred and ten of us who were elected or appointed. We are here to figure out how to share a room.

  We need to be honest about who is in the chairs. Six hundred and twenty people were called. Five hundred and ten said no, or never picked up the phone. You are the one hundred and ten who said yes. That means you are not a perfect mirror of this city. You are older. You are more likely to own your homes. You have more education. Some of you know this already. You have read the report. You intend to ask if you are legitimate.

  Here is the answer. You are not a statistical mirror. You are something else. You are a group of neighbors who were willing to do the work. The city has plenty of opinions. It has very little patience. You represent the city's capacity to pay attention. That is worth something. The gap between the city and this room is real. But the willingness to serve is rare. We need that willingness more than we need a perfect demographic match.

  You are not here because you are experts. You will not be experts in fourteen months. You are not here because you are better people than the officials across the aisle. You are here because you are free. You have ambitions. I know you do. I have them too. But this design makes those ambitions harmless. You cannot run for re-election. The term is non-renewable. You cannot campaign on what you do here. You do not have a constituency to anger.

  This changes what you can say. A term you cannot renew means you do not need to keep friends for next year. A stipend you cannot campaign on means you do not need to raise money. A constituency you do not have means you do not need to please neighbors. You can say what you actually think. That is your warrant. Not expertise. Freedom.

  I see some faces in the room who know how politics works. Some of you have run for council and lost. Some of you have served for years. The system was designed to allow any citizen to serve. One of you fits that design perfectly, having served before. Two of you are here because the random draw caught you while you were seeking power. Your experience is useful. But your status is not. The charter does not care if you won or lost. It cares that you are here now. You are all citizens for fourteen months. Then you are gone.

  To my colleagues in government. I know some of you believe a body nobody voted for should not instruct a body everybody voted for. You have a point. But look at the rules. You can reject their recommendations. But you must do it by recorded vote. You must write a statement of reasons. You must publish it within thirty days.

  This is not a threat. It is an incentive. It makes ignoring them work. It forces you to explain yourself on the record. It makes saying no harder than saying yes. It slows you down. It makes you think. When you write a reason, you own it. It follows you. It is easier to find common ground than to write a defense for ignoring it. That is all this panel asks. To make you think.

  So, what is this power? Is it borrowed from the Council? No. The Council has the power to decide. This panel has the power to decide what is worth deciding. The Council says yes or no. This panel says look here. That is your own authority. It is simple. It belongs to you.

  We are not building pure democracy. We are building a place where people can speak without fear. Use the fourteen months. Ask the hard questions. We will listen.

  Thank you.
