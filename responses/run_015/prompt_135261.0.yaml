answer: |-
  Dear friend,

  Your proposal to rescue the Formula of Universal Law from the charge of indeterminacy by insisting on fully specified maxims is a sophisticated maneuver that aligns with certain contemporary attempts to formalize Kantian ethics, yet it exposes you to a set of defeaters that range from structurally fatal to merely awkward. To understand what would have to be true for your reading to be wrong, we must first look at the textual architecture of the Groundwork, where the most devastating objection lies in Kant's own warnings about the material conditions of the will. If it is true that Kant explicitly restricts the level of detail permissible in a maxim to prevent the will from being determined by empirical contingencies, then your strategy of including precise situational variables and specific ends violates the formalism that defines the categorical imperative. Kant insists that the moral law must hold independently of any particular end, yet your defense suggests that we must know which ends are permissible before we can formulate the maxim to be tested. If careful textual analysis confirms that Kant views the inclusion of specific empirical ends as a corruption of the maxim's purity rather than a necessary refinement, your interpretation collapses because it treats the universalizability test as a procedure for checking consistent policies rather than a test of the will's conformity to law as such. This is a fatal defeater because it undermines the textual basis of your claim, suggesting you are solving a problem Kant did not acknowledge by using tools he explicitly forbade.

  Moving from the textual to the logical, a second fatal objection concerns the problem of trivialization through over-specification, often discussed in deontic reconstruction. If the process of refinement allows the agent to include any situational variable, one can always construct a maxim so narrow that it passes the universalizability test regardless of the action's moral status. For instance, an agent could formulate a maxim to steal only when they are the specific individual they are, in the exact second they are in, for the exact object they desire. Universalizing this maxim yields no contradiction because no one else fits that description. For your defense to hold, there must be an independent criterion that limits which variables are relevant to the maxim's description. If you concede that this limiting criterion comes from the Formula of Humanity or some substantive theory of value, you confirm the charge of redundancy, but if you deny it, you leave the test vulnerable to the charge of vacuity. The fatal nature of this objection lies in the fact that without a principled limit on specification, the universalizability test loses its critical force entirely, becoming a tool for rationalizing any action rather than constraining it. This is not merely an awkward consequence but a structural failure of the normative theory, as a test that cannot fail cannot guide action.

  A third defeater, which is severe but perhaps less fatal than the logical trivialization problem, concerns the architectural relationship between the formulas of the categorical imperative. You suggest that the refinement process presupposes judgments about permissible ends that belong to the Formula of Humanity, risking the collapse of the Universal Law formula into redundancy. For this to be wrong, it would have to be shown that the Formula of Universal Law can generate substantive constraints on ends without presupposing the Formula of Humanity. Some scholars argue that the contradiction in the will test already incorporates a theory of rational agency that rules out certain ends without needing the explicit invocation of humanity as an end in itself. However, if it is true that the contradiction in conception test only works for perfect duties and the contradiction in will test only works because we necessarily will the happiness of others as a means to our own ends, then the test relies on empirical anthropology rather than pure reason. If subsequent research in moral psychology or rational choice theory demonstrates that rational agents do not necessarily will the conditions of their own agency in the way Kant presupposes, the contradiction in will loses its necessity. This is a serious objection because it attacks the modal strength of the imperative, reducing it from a necessary law of reason to a contingent fact about human psychology.

  Regarding rival interpretations, those who treat maxims as action-types rather than fully specified practical principles, such as Onora O'Neill or Barbara Herman, have resources your defense cannot easily accommodate without conceding your point. These interpreters argue that maxims are policies of action that must be describable in terms that others could adopt, rather than exhaustive descriptions of situational variables. They handle indeterminacy by appealing to the relevance of reasons rather than the completeness of description. If their account is correct, your insistence on full specification is not just unnecessary but misconstrues the nature of a maxim as a subjective principle of volition. Their view allows for a degree of indeterminacy that is resolved through public reasoning rather than private refinement, which preserves the social dimension of Kantian ethics that your isolated refinement process might obscure. This is an awkward objection for you because it suggests your solution solves a problem that arises only from a misunderstanding of what maxims are, rather than a flaw in the test itself. It forces you to argue not just about how to apply the test, but about the fundamental ontology of practical principles, which is a much heavier burden.

  On the question of unfalsifiability, you are right to worry that if every apparent counterexample can be answered by further refining the maxim, the view becomes vacuous. This is a genuine problem for a normative theory of this kind because a theory that cannot be proven wrong cannot claim to guide us toward what is right. For your defense to avoid this, there must be clear cases where refinement fails to resolve the contradiction, or where refinement leads to a contradiction that was not apparent in the underspecified version. If every failure of universalization can be patched by adding detail, and every success can be challenged by removing detail, the test operates only as a post-hoc rationalization device. The honest assessment is that this defense insulates the position from criticism only at the cost of making it useless for deliberation. If the process of refinement is so complex that it requires the very moral judgment it is supposed to produce, the test is not a guide but a mirror. This is not merely an awkward theoretical cost but a practical failure, as the categorical imperative is intended to be a tool for finite rational beings who need guidance, not a logical puzzle for metaphysicians.

  Distinguishing what is settled among careful Kant scholars from what remains genuinely contested is crucial for your position. It is settled that Kant distinguishes between the contradiction in conception and the contradiction in will, and that he offers four specific examples in the Groundwork to illustrate them. It is also settled that there is a problem of relevant description regarding maxims, often called the level of abstraction problem. However, it is genuinely contested whether the Formula of Universal Law stands alone as a sufficient criterion of moral duty or whether it requires the support of the Formula of Humanity. It is equally contested whether the contradictions Kant identifies are logical contradictions, practical contradictions, or contradictions in the will's own projects. Your reading takes a stance on these contested issues by suggesting that specification resolves the indeterminacy, but you must acknowledge that many scholars believe the indeterminacy is a feature rather than a bug, intended to force the agent into a broader reflective equilibrium rather than a mechanical test. If you present your resolution of the indeterminacy as a settled matter, you will be misrepresenting the state of the literature, but if you present it as a hypothesis to save the test from redundancy, you must show how it avoids the fatal defeaters of trivialization and textual incompatibility.

  Ultimately, for your reading to be wrong, it need only be true that Kant intended maxims to be general policies rather than exhaustive descriptions, or that the universalizability test is meant to function in tandem with the Formula of Humanity rather than as an independent engine of moral judgment. The most fatal evidence against you would be a textual demonstration that Kant rejects the inclusion of specific empirical ends in the formulation of the maxim itself, as this would make your refinement process illicit from the start. The next most severe evidence would be a logical proof that any specification strategy can be manipulated to universalize immoral actions, rendering the test vacuous. The less devastating but still significant objections involve the usability of your refined test for actual moral agents and the availability of rival interpretations that handle the same data with fewer theoretical costs. You must decide whether you are defending Kant's text as written or reconstructing a Kantian theory that solves problems Kant may not have seen, for if you claim the former, the textual defeaters are paramount, but if you claim the latter, the charge of unfalsifiability becomes your primary opponent. I hope this assessment helps you weigh the costs of your defense against the indeterminacy you seek to resolve.

  Sincerely,

  A Correspondent
