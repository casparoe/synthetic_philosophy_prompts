answer: |-
  **Brainstorming**

  Okay, starting with the discounting practice. What's actually doing the work here? It's easy to conflate the economic rationale with the moral one. The economic one is about opportunity cost: money invested now grows, so a future dollar is worth less than a present dollar. But the prompt talks about *lives saved*. You can't invest lives in a bank account to compound them. So when we discount statistical lives, we are implicitly discounting *welfare* or *moral value*. That pushes us toward pure time preference—the idea that a person's well-being matters less simply because they live later. Most ethicists reject this as discrimination by date of birth. But maybe it's not pure time preference; maybe it's uncertainty. Will the project still work in 100 years? Will the people exist? If there's a 1% annual chance of civilization collapsing, then a benefit in 100 years is only worth ~37% of a benefit today. That looks like discounting, but it's actually probability weighting. The practice is underdetermined because a 3% discount rate could be justified by impatience, or by expected growth making future people richer (so a dollar helps them less), or by existential risk. To break the tie, we need to know if the rate applies to *goods* or *people*. If it's goods, growth justifies it. If it's people, only risk or prejudice justifies it.

  The asymmetry is fascinating. We treat future lives as negligible in cost-benefit analysis but treat nuclear waste as a sacred trust. Why? The most obvious line is harm vs. benefit. We have a duty not to poison the future, but no duty to maximize their wealth or population. This aligns with the non-identity problem intuitions: we don't owe them existence, but if they exist, we shouldn't harm them. But does this hold for existential risk? Is failing to prevent an asteroid strike a "harm" we inflict, or a "benefit" we failed to provide? It feels like a harm if we built the asteroid deflector and turned it off, but if we just never built it, is that negligence? The asymmetry might let us regulate waste (active harm) but ignore pandemic preparedness (failure to aid against natural threats). That seems like a dangerous loophole if the Hinge Hypothesis is true. The asymmetry lets the far future back in only as a recipient of our apologies, not our aid.

  Now the Hinge. If the next two centuries determine the next two billion, standard discounting is catastrophic. If I discount at 2%, the value of the infinite future becomes finite and small. But if the discount rate represents extinction risk, and I can *lower* that risk, I shouldn't discount the value of lowering the risk by the risk itself. That's circular. It's like insuring a house against fire but calculating the value of the insurance by the probability the house burns down, ignoring that the insurance prevents the burn. The "cluelessness" objection is the strongest counter: maybe our actions have chaotic long-term effects, so aiming for the long term is noise. But the Hinge claims *some* actions (governance, safety) are robustly positive. If I decompose the rate into "growth/patience" and "hazard," the hazard part should vanish for safety policies. If it doesn't, the practice is secretly assuming fatalism.

  Finally, the verdict. If I accept the Hinge, I can't keep the practice. It undervalues existence. But if I reject the Hinge, maybe the practice is fine. The single consideration that moves me most is the endogeneity of the risk. We cannot treat the probability of the future's existence as a fixed parameter when our policy choices determine that parameter. That makes the standard practice not just conservative, but incoherent.

  ***

  **The Arithmetic of Existence: A Reconstruction and Critique**

  **The Implicit Theory of Discounting**

  To reconstruct the moral architecture of standard discounting, we must separate the instrumental mechanisms from the foundational ethical commitments. The practice presupposes that the present moral weight of a future good is a function of its nominal value multiplied by a discount factor that decays exponentially with time. Philosophically, this requires a justification for why temporal distance diminishes value. There are four candidate grounds, but they do not all carry equal weight.

  First, *pure time preference* asserts that well-being matters less simply because it occurs later. This is the most direct justification for the practice but the hardest to defend ethically; it implies a form of discrimination against future persons solely based on their location in time. Second, the *opportunity cost of capital* argues that resources invested now yield more resources later. This justifies discounting monetary costs, but it fails to justify discounting incommensurable goods like lives or species extinction, unless one assumes a strict conversion rate between wealth and welfare. Third, *diminishing marginal value* posits that future generations will be richer, so a unit of resource provides them less welfare than it provides us. This justifies discounting consumption, but not necessarily welfare itself, and it relies on the contingent assumption of perpetual economic growth. Fourth, *uncertainty* suggests that future benefits might not materialize because the beneficiaries might not exist or the project might fail.

  The practice is philosophically underdetermined because a single discount rate, say three percent, can be derived from any combination of these factors. A policymaker could arrive at three percent because they are impatient, because they expect growth, or because they assume a three percent annual risk of civilizational collapse. The practice does not distinguish between these. What breaks the tie is the object of the appraisal. When appraising life-saving regulations, capital growth is irrelevant. When appraising infrastructure, uncertainty is key. The practice implicitly treats these distinct justifications as fungible, allowing the ethical weakness of pure time preference to hide behind the mathematical respectability of compound interest or risk assessment. Strictly speaking, the practice only *requires* that the future be treated as less morally demanding than the present; it does not require a specific reason why, which allows the justification to shift opportunistically depending on which theory yields the desired policy outcome.

  **The Asymmetry of Stewardship**

  The asymmetry between discounting future benefits and mandating millennial safety for nuclear waste appears inconsistent on the surface, but it can be reconciled through a deontological distinction between duties of non-interference and duties of aid. The discounting practice governs the allocation of resources to *improve* the future state of affairs (benefits). The nuclear waste regulation governs the containment of harms *initiated* by the present generation. On this view, we owe the future a world no worse than the one we inherited, specifically regarding dangers we introduce, but we do not owe them the maximization of their potential well-being. We must not poison their water, but we need not ensure their water is purified beyond natural levels.

  However, this principled line is narrower than it appears. It lets the far future back in only as a recipient of negative duties. It protects them from our toxins but not from our negligence regarding external threats. If the primary risks to the far future are not wastes we bury but systems we fail to secure—such as unaligned artificial intelligence or engineered pathogens—the asymmetry offers no protection. These risks often look like failures to aid (failing to build safety systems) rather than direct impositions of harm (dumping waste). Furthermore, the asymmetry relies on a clear distinction between creating a risk and allowing a risk to mature, a distinction that blurs when our technological footprint makes us the dominant source of planetary risk. If we live in an era where natural risks are negligible compared to anthropogenic ones, almost every existential threat becomes a "harm we create" by failing to regulate our own innovations. Thus, the asymmetry might theoretically hold, but in the context of advanced technology, it collapses, demanding that we treat the prevention of anthropogenic extinction with the same stringency as nuclear waste disposal, regardless of the cost-benefit discount rate.

  **The Hinge and the Hazard Rate**

  The Hinge Hypothesis posits that the expected value of the future is dominated by the probability of our lineage continuing over the very long term. Standard discounting interacts with this hypothesis in a subtle, often destructive way. A conventional positive discount rate is often defended as a "hazard rate"—a probability that the benefit will not be received because the society will not exist. If the discount rate is 2%, it implies a roughly 2% annual chance of civilizational failure.

  However, if the Hinge Hypothesis is true, this hazard rate is not exogenous; it is endogenous to our policy choices. Standard discounting treats the probability of the future's existence as a fixed background fact against which we weigh our actions. But if we are appraising a policy designed specifically to reduce the risk of extinction, we cannot coherently discount the value of that policy by the very risk the policy seeks to mitigate. To do so is to assume the risk is unchangeable. If I decompose the discount rate into a pure time-preference term (which should be zero), a growth term (which applies to consumption, not existence), and a catastrophe-risk term, a paradox emerges. For ordinary projects, the catastrophe-risk term correctly reduces the present value of future returns. For existential risk reduction projects, applying the catastrophe-risk term reduces the incentive to invest in safety, precisely when the goal is to lower that term.

  This decomposition reveals that standard practice hides a fatalism. It assumes the probability of the future is fixed, whereas the Hinge Hypothesis asserts it is malleable. If one accepts the Hinge, the discount rate for existence-related policies must approach zero, or even become negative if early investment yields compounding safety benefits. The "cluelessness" objection—that we cannot know the long-term effects of our actions—offers a potential defense for discounting, suggesting that uncertainty washes out long-term expected value. But this fails against the Hinge claim that *some* classes of action (like securing foundational governance or biological safety) have robustly positive long-term effects regardless of other uncertainties. If the Hinge is true, standard discounting is not merely conservative; it is a systematic undervaluation of the only thing that guarantees the possibility of all other value.

  **Institutional Implications**

  If we replace the presupposed view with one that acknowledges the Hinge and rejects pure time preference, institutional practice would undergo a radical transformation. The appraisal of nuclear waste would remain stringent, justified by the duty of non-interference, but the logic would extend to pandemic preparedness and AI safety. Currently, these are weighed against immediate economic costs with high discount rates, making them hard to justify. Under a revised view, the "cost" of an existential catastrophe is effectively infinite, as it forecloses all future value. Therefore, even a tiny reduction in extinction probability would justify immense present expenditure. Funding for basic science would shift from a focus on immediate technological application to a focus on understanding and mitigating systemic risks.

  Regarding the mechanism of appraisal, declining or horizon-dependent discount schedules offer a coherent halfway house. These schedules apply higher discount rates to the near future (reflecting opportunity costs and uncertainty about specific projects) and near-zero rates to the far future (reflecting the ethical equality of future persons and the importance of existence). This is not an unstable compromise but a recognition that different justifications apply at different time horizons. The opportunity cost of capital matters for a bridge built for 50 years; it matters less for the survival of the species for 50,000 years. For current practice to be vindicated without these changes, it would have to be true that our actions have no durable influence on the long-term trajectory of civilization—that the Hinge Hypothesis is false and the future is determined by forces beyond our control. If we are not pivotal, discounting is permissible. If we are pivotal, it is not.

  **Verdict**

  The practice is indefensible as it stands. It is not merely a conservative heuristic but a conceptual error that treats the existence of the future as a market variable rather than a precondition of value. The strongest version of the alternative view accepts that we face deep uncertainty and that resources are scarce, but it insists that the *probability of the future's existence* cannot be discounted when the policy in question is aimed at securing that existence.

  The single consideration that moves me most to this verdict is the endogeneity of extinction risk. Standard discounting implicitly assumes that the future is a country to which we might or might not have a trade route, and we discount goods based on the risk the route is closed. But in the context of existential policy, we are not traders; we are the engineers of the route. To discount the value of repairing the bridge by the probability that the bridge will collapse is to guarantee its collapse. By conflating the *value* of the future with the *probability* of its arrival, and then treating that probability as fixed, the practice creates a self-fulfilling prophecy of neglect. We cannot afford to value the future less because it is at risk when our very purpose is to remove the risk. The arithmetic of existence demands that we separate the rate of patience from the rate of peril, and refuse to discount the latter when we hold the power to change it.
