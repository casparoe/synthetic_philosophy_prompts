  *(Self-Correction during final polish)*: Make sure the "Commit" section is decisive. Don't sit on the fence. The prompt asks for *my* judgment. I will argue it is indefensible because it conflates *valuation* with *probability of receipt* in a way that ignores agency over that probability.

