answer: |-
  Here is a disambiguation menu for the slogan "it is better never to have been." Your interlocutor is almost certainly equivoking between **Reading 1** and **Reading 2**, while using **Reading 4** to make the conclusion feel self-evident.

  ### 1. The Retrospective Prudential Claim
  *   **The Claim:** For any person who *currently exists*, their life would have been better (for them) if they had never come into existence.
  *   **Target:** Actual, existing people (e.g., your sister).
  *   **Sense of "Better":** Comparative well-being for the subject (Counterfactual: Existence vs. Non-existence *for the subject*).
  *   **Trivial/Tautological?** No. It contradicts the subject's own testimony and standard welfare metrics.
  *   **Substantive Normative Claim?** Yes. It claims existence is inherently a net harm to the exister, regardless of their reported happiness.
  *   **Depends on Benatar's Asymmetry?** **Yes, critically.** It requires accepting that the absence of pain is good *for the subject* even if they don't exist to enjoy that good, and that the presence of pleasure is not sufficient to outweigh the presence of pain.
  *   **Defensible?** **Highly Controversial/Counterintuitive.** It requires overriding a competent agent's report of their own well-being. It implies your sister is mistaken about whether her life is good for her.
  *   **Interlocutor's Usage:** This is what they invoked regarding your **sister**. They are claiming that despite her happiness, the metaphysical "cost" of her pain (and the inevitability of future pain/death) makes non-existence preferable *for her*.

  ### 2. The Prospective Moral Claim
  *   **The Claim:** For any *potential* person, it is morally preferable that they are never brought into existence.
  *   **Target:** Non-existent, potential people (future children).
  *   **Sense of "Better":** Moral obligation of the procreator / Avoidance of harm to the potential subject.
  *   **Trivial/Tautological?** No. It is a substantive ethical conclusion.
  *   **Substantive Normative Claim?** Yes. It asserts a duty to refrain from procreation.
  *   **Depends on Benatar's Asymmetry?** **Yes.** This is the primary conclusion Benatar draws from the asymmetry. Since non-existence avoids pain (good) without depriving anyone of pleasure (not bad), creating a person is always a net negative compared to not creating them.
  *   **Defensible?** **Debatable but Internally Coherent.** It is the standard antinatalist position. It avoids the problem of contradicting existing people's testimony because there is no subject to testify.
  *   **Interlocutor's Usage:** This is what they invoked when pivoting to **procreation**. This is the "safe" version of the argument because there is no existing subject to contradict them.

  ### 3. The Impersonal Axiological Claim
  *   **The Claim:** A state of affairs containing no sentient beings is objectively better than a state of affairs containing sentient beings.
  *   **Target:** The world / The universe (impersonal value).
  *   **Sense of "Better":** Aggregate value, not necessarily "better for" any specific subject.
  *   **Trivial/Tautological?** No.
  *   **Substantive Normative Claim?** Yes (Axiological).
  *   **Depends on Benatar's Asymmetry?** **No.** This is a total utilitarian or negative utilitarian claim. Benatar specifically tries to avoid this (he focuses on person-affecting harm), but antinatalists often slide into it.
  *   **Defensible?** **Distinct from Benatar.** If they use this, they are no longer arguing Benatar's specific asymmetry but rather a claim about total suffering in the universe.
  *   **Interlocutor's Usage:** They likely **smuggle this in** when defending Reading 1. If your sister says she is happy, the interlocutor cannot claim it is "better for her" without sounding absurd. So, they implicitly mean "It is better *for the world* she wasn't born," but phrase it as "It is better she never had been" to maintain the rhetorical force of the personal claim.

  ### 4. The Trivial/Logical Claim
  *   **The Claim:** Non-existence entails the absence of suffering.
  *   **Target:** The definition of non-existence.
  *   **Sense of "Better":** Descriptive (Non-existence = 0 pain).
  *   **Trivial/Tautological?** **Yes.** It is analytically true that a non-existent being suffers no harm.
  *   **Substantive Normative Claim?** No. It describes a state, it does not evaluate it as "better" without further premises.
  *   **Depends on Benatar's Asymmetry?** **No.** This is just logic.
  *   **Defensible?** **True but Irrelevant.** It only becomes an argument if you add the premise "Absence of suffering is preferable to presence of mixed suffering/pleasure," which returns you to Reading 1 or 2.
  *   **Interlocutor's Usage:** They use this to make the slogan feel like a **knockout punch**. By stating a trivial truth ("dead people don't suffer"), they imply the normative conclusion ("therefore death/non-existence is better") follows automatically, bypassing the need to justify the asymmetry.

  ### Diagnosis of the Slide
  Your interlocutor is shifting between **Reading 1** and **Reading 2** to insulate the argument from counter-evidence.

  1.  **When you mentioned your sister (Existing Person):** They used **Reading 1** (Retrospective Prudential). This is the weak point. To maintain this, they must assert that your sister's self-report of happiness is irrelevant or mistaken because the *objective* harm of existence outweighs her subjective experience. If they retreat to **Reading 3** (Impersonal) here, they are admitting it's not actually "better for her," just "better for the universe," which weakens the rhetorical force of "Better Never to Have Been."
  2.  **When discussing procreation (Potential Person):** They switched to **Reading 2** (Prospective Moral). This is the strong point for their view. There is no subject to contradict them, so the Asymmetry holds without friction.
  3.  **The Glue:** They use **Reading 4** (Trivial) to make the transition feel seamless. "Non-existence means no pain (True) -> Therefore it is better never to have been (Normative Claim)."

  **Verdict for your reply:** Point out that **Reading 1** is false (or at least unsupported) regarding happy existing people, while **Reading 2** is irrelevant to people who already exist. Ask them to specify: "When you say it was better for my sister never to have been, do you mean it would have been better *for her* (contradicting her testimony), or better *for the world* (which is a different argument entirely)?"
