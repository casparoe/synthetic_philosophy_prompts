answer: |-
  *Brainstorming*
  Mappings: Loaf=Spacetime manifold; Slice=Simultaneity hypersurface; Knife angle=Inertial frame velocity; Slicing=Frame selection; All slices present=Eternalism. Disanalogies: Knife angle unlimited vs. boosts bounded by $c$; Loaf Euclidean vs. Spacetime Minkowskian signature; Loaf static vs. GR dynamic topology; Crumbs=events; Knife=Observer. Conclusions: RP argument relies on slice reality implying manifold reality. Moral argument relies on "real" implying "accessible/countable". Branching breaks the "distant country" definiteness.

  ***

  **Audit of the Loaf Analogy**

  The loaf picture is pedagogically potent but metaphysically leaky. It smuggles in Euclidean intuitions that special relativity (SR) explicitly forbids and general relativity (GR) complicates further. Below is the correspondence between the source analogy and the physical target.

  | Source Element | Target Meaning | Status |
  | :--- | :--- | :--- |
  | The Loaf | Spacetime Manifold | **Valid** (if globally hyperbolic) |
  | A Slice | Simultaneity Hypersurface | **Valid** (frame-dependent) |
  | Knife Angle | Inertial Frame Velocity (Boost) | **Disanalogy** (bounded by $c$) |
  | Slicing Choice | Coordinate System Selection | **Valid** |
  | All Slices Present | Eternalism (Block Universe) | **Contested** (Ontological inference) |
  | Crumbs | Events / Matter Fields | **Valid** |
  | The Knife | Observer / Reference Frame | **Valid** |
  | Loaf Homogeneity | Metric Signature | **Critical Disanalogy** |

  The disanalogies divide into cosmetic and biting. Cosmetic are those that do not undermine the core eternalist claim. That a knife can tilt to any angle while boosts are bounded by the light cone is cosmetic for SR; it merely restricts the range of valid slices, not their existence. However, the metric signature is biting. The loaf is Euclidean; spacetime is Minkowskian. Time is not a fourth spatial direction; the minus sign in the metric preserves causal order invariantly, whereas spatial rotation mixes dimensions freely. This matters because it preserves a distinction between timelike and spacelike separation that the loaf obscures.

  More critically, the loaf presupposes global slicability. In GR, spacetime topology is dynamic. Solutions like Gödel's universe contain closed timelike curves; others lack global Cauchy surfaces entirely. The loaf analogy smuggles in a cosmology-neutral structure that physics neither gives nor rules out. If spacetime cannot be foliated, the "stack of slices" picture collapses, though the manifold (loaf) might remain.

  Does the Rietdijk–Putnam argument force eternalism? It relies on the premise that if simultaneity is relative, ontology must be frame-independent. A presentist rejects the inference, maintaining that "real" means "present-to-me," accepting that reality is frame-dependent. This costs them a privileged ontological status but saves intuition. A defender of privileged foliation (e.g., Craig) rejects the premise that SR precludes a hidden, true simultaneity slice, costing them empirical parsimony. A growing-block theorist accepts the manifold but denies future slices exist, costing them Lorentz invariance in ontology. The step from *no observer-independent simultaneity* to *no objective simultaneity* requires the extra premise that ontology cannot be perspective-dependent. Without it, the argument merely restates the analogy.

  The moral conclusion is where the analogy actively misleads. Does *all events are equally real* support temporal neutrality? Not necessarily. Temporal neutrality is an ethical principle defensible independently of metaphysics (e.g., Parfit's arguments). The block universe makes the future real, but not necessarily accessible or changeable in the way the past is fixed. If the future is "already there," does agency vanish? The loaf suggests a static object, implying fatalism. But eternalism is compatible with causation; my actions are part of the block. The error is conflating *existence* with *fixity*.

  This brings us to branching. If the block contains branching structure (indeterminism), the "distant country populated by actual people" picture fractures. If many incompatible branches are equally real, future persons are not definite individuals but candidate persons across branches. Duties owed to *specific* people become duties owed to *possible* people, weakening the moral urgency. If only one branch is actual, the block looks deterministic, reinstating the fatalism worry. The loaf analogy cannot represent branching without becoming a bundle of loaves, at which point the "single reality" claim dissolves.

  If the loaf is the wrong picture, what works better? Consider a **topographical map of a network of trails**. The map represents the whole manifold (eternalism); all locations exist on the paper. The trails represent causal pathways. Some paths fork (indeterminism/branching). You are a hiker currently at one coordinate. The map supports eternalism (all points are real) without implying fixity (you must choose a path) or homogeneity (terrain varies). It motivates the reality of the future without suggesting the future is a static city waiting unchanged. It supports the idea that distance in time is like distance in space (both are coordinates on the map) but leaves open whether the trails are paved (determinism) or rough (indeterminism). It avoids the moral hazard of the loaf by separating the existence of the terrain from the activity of hiking. The loaf makes the future a product; the map makes it a landscape to be traversed. This preserves the metaphysical insight—that the future is part of the geometry of reality—without eating the moral conclusion that our traversal matters.
