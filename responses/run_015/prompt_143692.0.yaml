      *   *Performativity/Constitutive Facts:* Social facts (e.g., "The French Revolution") aren't like physical facts (e.g., "The beam deflected"). They depend on the conceptual scheme used to define them.
      *   *Retrospective Coherence (Teleology):* Knowing the end changes the meaning of the beginning (e.g., viewing 1919 as leading to 1939). Physics doesn't usually work backwards in time to define the initial state's *meaning* (though it does for calibration).
