      *   *Addressing User's Idea 2 (Veto vs. Agenda):* This is crucial. Gibbard's system assigns rights over *features* of outcomes (e.g., "I decide whether I read the book"). Sen's original formulation was over *outcomes* (e.g., "I decide between {I read, You read} and {You read, I read}"). For a committee, "Veto over personal conduct" is more actionable than "Control over the social state."

