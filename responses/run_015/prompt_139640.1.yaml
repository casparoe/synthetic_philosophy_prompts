answer: |-
  # Joint Statement on International Happiness Rankings

  **1. Agreed Claims**

  1.  **Measurement versus Targeting:** We distinguish the validity of the measure from the wisdom of targeting it. Both sides agree the Cantril ladder tracks something relevant to human welfare, but we disagree on whether that score is robust enough to serve as a primary state objective.
  2.  **Non-Positional versus Positional:** We distinguish raising a country's own score from outranking other countries. Policy should aim to improve domestic welfare, not merely to climb a league table where one nation's gain is another's relative loss.
  3.  **Distributional Silence:** We record that a mean score says nothing about the bottom of the distribution. A rising national average can coexist with deepening misery among the poorest decile.
  4.  **Evaluative versus Affective:** We record that evaluative measures (life assessment) and affect measures (daily emotion) can move independently. High life satisfaction does not guarantee frequent joy, nor does low affect necessarily negate a sense of meaningful accomplishment.
  5.  **The Income Pattern:** We record that the familiar pattern of cross-sectional income differences tracking reported satisfaction while long-run within-country income growth often fails to do so is compatible with both teams' views. This empirical regularity does not settle the normative debate.
  6.  **Target versus Thing:** We record that adopting a target is adopting a target for a measure, which is not the same as adopting a target for the thing measured. Optimizing the number may diverge from optimizing the underlying welfare if the measure is imperfect or reactive.

  **2. Disagreements**

  | Disagreement | Targeter Formulation | Anti-Targeter Formulation | Why This Row Is Not Merely Verbal |
  | :--- | :--- | :--- | :--- |
  | **Comparability** | Cross-population differences in mean scores primarily reflect real differences in welfare levels; response styles are noise that averages out. | Cross-population differences are confounded by cultural response styles and adaptive preferences; unit comparability across borders is unsupported. | Determines whether cross-border resource allocation based on rankings is valid or discriminatory. |
  | **Reactivity** | Official adoption improves outcomes via accountability; what gets measured gets managed, aligning bureaucracy with citizen experience. | Official adoption corrupts the measure via gaming, social pressure, or strategic reporting, decoupling the score from lived reality. | Empirical prediction about institutional behavior and data integrity under policy regimes. |
  | **Moral Standing** | Subjective evaluation is sovereign; individual judgment of their own life is the ultimate metric of policy success. | Objective conditions and capabilities constrain validity; subjective reports must be validated against material freedom and health. | Determines whether policy prioritizes feeling better or having more capability, even if feelings do not rise. |
  | **Aggregation** | The mean is the neutral, sufficient statistic for national welfare; distributional concerns are secondary or separate. | The mean masks inequality; aggregation must prioritize the worst-off (e.g., tail penalties) to reflect moral urgency. | This is a moral view wearing a measurement costume; the choice of function dictates priority to the suffering. |

  **3. Cruxes and Pre-Registered Predictions**

  We submit to three empirical tests. Premises regarding the feasibility of data collection are stipulations both accept for the sake of this document.

  **(a) Satisfied life-years.** We compare rankings based on the current mean ladder score versus the mean, over completed lives, of the life-course integral of the ladder score (a year lived at value *v* contributing *v*/10 satisfied life-years), including childhood via proxy.
  *   **Targeter Prediction:** Rank orders will remain highly correlated. The integral captures total welfare better than snapshots.
      *   *Evidence Against:* If high-longevity countries drop significantly in rank despite stable annual means, suggesting the measure rewards mere survival over quality.
  *   **Anti-Targeter Prediction:** Rank orders will shift significantly. The integral imports fresh defects: rewarding longevity however the extra years go, penalizing populations that report honestly at the end of life, resting on biased retrospective reports, and making the number less legible to voters and therefore worse as a democratic target.
      *   *Evidence Against:* If the new metric correlates perfectly with the old mean, suggesting the snapshot objection was unfounded.

  **(b) The ministry trial.** A middle-income country (population ~30m) assigns half its ministries, at random, to a regime where heads report annually on their contribution to the national mean ladder score (published, with budget/promotion attached); the other half report on usual objective indicators. We pre-commit to a five-year readout on: mean ladder score; mean affect balance (daily-reconstruction); within-country correlation between ladder and the six explanatory variables; share scoring below 4; and country rank.
  *   **Targeter Prediction:** The treatment ministries will produce a higher mean ladder score without breaking the correlation with explanatory variables. Affect balance will rise commensurately.
      *   *Evidence Against:* If the ladder rises while affect balance and objective conditions do not, indicating measurement corruption rather than welfare gain.
  *   **Anti-Targeter Prediction:** The treatment ministries will inflate the ladder score via pressure or framing, causing the correlation with objective variables to weaken. Affect balance will stagnate.
      *   *Evidence Against:* If the ladder rises alongside affect balance and objective conditions, indicating the target successfully aligned bureaucracy with welfare.

  **(c) The aggregation choice.** We calculate headline rankings using a share-above-threshold (proportion scoring ≥7) and a bottom-tail penalty (mean minus a multiple of the share below 4).
  *   **Targeter Prediction:** Orderings will not change materially. A Targeter who accepts the bottom-tail penalty remains a Targeter in any sense worth arguing about, provided the objective is still maximizing a subjective metric.
      *   *Evidence Against:* If adopting the tail penalty fundamentally alters policy priorities away from mean maximization without changing the underlying moral commitment to subjective welfare.
  *   **Anti-Targeter Prediction:** Orderings will shift significantly, revealing inequality masked by the mean. Movements driven by the tail penalty reflect a moral view about priority to the worst off, not merely measurement precision.
      *   *Evidence Against:* If the tail penalty produces identical rankings to the mean, suggesting inequality in subjective welfare is negligible.

  **4. What Was Only Verbal**

  Much of our decade of argument rested on equivocations we now resolve. First, **happiness as affect versus as life evaluation versus as eudaimonia:** We agree the Cantril ladder measures evaluative well-being, not momentary affect or philosophical flourishing. Disputes arising from conflating these constructs are verbal. Second, **measuring as tracking versus as constituting:** We agree the measure tracks welfare but does not constitute it; arguing that the number *is* the welfare was a category error. Third, **topping the table as raising one's own score versus as outranking others:** We agree policy should target the absolute score, not the relative rank. Disagreements predicated on the zero-sum nature of league tables are verbal, as no serious proponent advocates sacrificing welfare for rank.

  However, substantive disagreement remains. Whether the measure is sufficiently robust to bear the weight of state targeting, and whether subjective evaluation should trump objective capability when they diverge, are not verbal disputes. They are empirical and normative disagreements that this collaboration has clarified but not resolved. We sign this statement to acknowledge the ground gained and the ground still contested.
