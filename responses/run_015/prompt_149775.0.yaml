prompt: |-
  Write a one-page proposal for a four-month independent research project on social sanction, deplatforming, and algorithmic moderation as forms of punishment. State the precise question: does distributed online sanction—where no single agent intends the outcome, the decision is mediated by platform architecture, and the record is permanent—satisfy the conditions for being punishment in the normative philosophical sense, or does it constitute a distinct moral category that requires its own framework of evaluation? Frame the problem against the three standard justifications for punishment—retributive, deterrent, and expressive—but apply them specifically to a sanctioning collective that lacks unified intentionality and to a sanction whose temporal structure is asynchronous and irreversible. Explain why existing treatments of cancel culture and of institutional punishment leave this case open: current work either assumes an intentional sanctioning community or treats platform moderation as purely instrumental governance, without addressing the hybrid case in which an emergent system produces punitive effects that no individual endorsed. Describe your method—conceptual analysis of whether punitive intent can be distributed across a network or replaced by functional design, comparison with legal institutional punishment to isolate the role of collective agency, and evaluation of whether permanence and asynchronicity alter the moral weight of the sanction independently of its severity. Specify the possible conclusions and what considerations would decide between them, and identify what would cause the project to fail or exceed its realistic scope without empirical data collection. Do not include a bibliography, citation list, or literature review by reference; refer to positions and arguments generally, and note that specific sources will be added separately.
