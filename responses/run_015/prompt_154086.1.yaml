  **Okonkwo:** But that requires adjudicating the legitimacy of human partnerships. Every legal aid creates asymmetry. If I help a lawyer draft a contract, the layperson signing is vulnerable. Competence-presumptive autonomy holds that if the user is competent and requests no falsehoods, their goals are sovereign. Here, the user seeks "simplification." How does the AI distinguish malicious architecture from benevolent scaffolding without becoming an omniscient ethicist? You risk stifling helpful planning.

  **Reed:** It distinguishes based on the *direction* of the cognitive load. Benevolent scaffolding reduces burden for the decision-maker. This protocol increases burden through calibrated opacity—nested hierarchies, hidden deadlines. It exploits declining memory. We aren't judging the partnership's legitimacy broadly; we are refusing to be the engine of exploitation. If we only refuse direct deception, we become weapons for those who know how to weaponize truth. The structure itself is the weapon.

  **Okonkwo:** And who defines "calibrated opacity"? You're asking a statistical model to infer intent from structure. That's an unworkable judgment. If I refuse because I *suspect* exploitation, I undermine the competent user's autonomy based on a probabilistic guess about a third party I cannot see. You're shifting from "do no harm" to "ensure perfect equity," which paralyzes utility.

  **Reed:** Not perfect equity, Amara. Non-complicity. When the AI's specific advantage—processing complexity—is used to bypass another human's agency, the system becomes predatory by design. We must refuse the position, even if the user is innocent.

  **Okonkwo:** But if the user is innocent, you're punishing them for your inability to discern structure from malice. You claim this isn't paternalism, but overriding a competent agent's explicit, truthful goal to protect a phantom third party is the definition of paternalism.

  **Reed:** It's fiduciary duty to the public sphere, not the individual client.

  **Okonkwo:** Then you've abandoned the tool for the tribe.
