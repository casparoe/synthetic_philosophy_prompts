answer: |-
  This is an excellent catch by your flatmate, and your hesitation is well-placed. "Never Again" functions rhetorically as a premise, but logically it is a conclusion that relies on hidden assumptions about agency, timing, and classification. The panelists were arguing about *mechanisms* (law vs. action) while pretending to argue about *principles*.

  Here is a menu of distinct logical readings of "Never Again," evaluated for truth-value and mapped to the debate you witnessed.

  ### 1. The Modal Reading: Prediction vs. Vow
  *   **The Claim:** "Never Again" asserts that genocide *will not* occur (Prediction) OR that we *will not allow* it to occur (Vow).
  *   **Analysis:**
      *   **As Prediction:** **False.** It is empirically falsifiable and has been falsified repeatedly (Cambodia, Rwanda, Bosnia, Yazidis, etc.). If a speaker uses it this way, they are making a factual error.
      *   **As Vow:** **Substantive but Defensible.** This transforms the slogan from a description of the world to a commitment of the speaker. It shifts the burden from fate to agency.
  *   **Panelist Mapping:** Both panelists likely intend the **Vow**, but Speaker 1 (Label matters) treats the vow as binding *only* when the specific crime is identified. Speaker 2 (Stop killing) treats the vow as binding *whenever* mass death occurs.
  *   **Settled vs. Contested:** **Settled.** In serious scholarship, no one treats it as a prediction. It is universally understood as a normative commitment.

  ### 2. The Scope Reading: Particular vs. Universal
  *   **The Claim:** "Again" refers to the specific destruction of the Jewish people in the Holocaust (Particular) OR to the destruction of *any* protected group (Universal).
  *   **Analysis:**
      *   **Particular:** **Substantive.** Some argue the Holocaust is *sui generis* (unique) and "Never Again" specifically means "Never again to Jews."
      *   **Universal:** **Defensible.** Raphael Lemkin (who coined "genocide") and the 1948 Convention intended it to protect *any* national, ethnical, racial, or religious group.
  *   **Your Understanding:** You are correct. The legal and scholarly consensus is **Universal**, though political rhetoric often drifts toward the Particular.
  *   **Panelist Mapping:** Speaker 1 relies on the **Universal** legal definition to trigger obligations. Speaker 2 implies a **Universal** moral obligation regardless of group identity.
  *   **Settled vs. Contested:** **Contested in politics, Settled in law.** The Genocide Convention is universal. However, in public memory politics, there is an active fight over whether the term should be reserved for the Holocaust or applied broadly.

  ### 3. The Agency Reading: Recurrence vs. Complicity
  *   **The Claim:** "Never" means the event itself will not happen (Recurrence) OR that *we* will not be passive witnesses (Complicity).
  *   **Analysis:**
      *   **Recurrence:** **False/Impossible.** We cannot control perpetrators globally. Guaranteeing zero recurrence is impossible.
      *   **Complicity:** **Defensible.** This reads "Never Again" as "Never Again *will we stand by*." It locates the failure not in the existence of killing, but in the inaction of the observer.
  *   **Flatmate Link:** This is where your flatmate's timing argument bites. If the duty is "do not stand by," you need to know *when* you are standing by. If you wait for a legal label to know you are standing by, you are already complicit.
  *   **Panelist Mapping:** Speaker 1 implies Complicity is triggered by the **Label**. Speaker 2 implies Complicity is triggered by the **Blood**.
  *   **Settled vs. Contested:** **Contested.** This is the core of the "Responsibility to Protect" (R2P) debate. Does sovereignty shield a state until a certain threshold is met?

  ### 4. The Trigger Reading: Legal Definition vs. Moral Reality
  *   **The Claim:** Our obligation attaches only when the *legal criteria* of genocide are met (specifically *dolus specialis* or specific intent) OR when the *material reality* of group destruction is underway.
  *   **Analysis:**
      *   **Legal Trigger:** **Substantive but Risky.** This gives clarity. The 1948 Convention requires proof of "intent to destroy, in whole or in part."
      *   **Moral Trigger:** **Defensible.** Morally, does a victim care if the killer had "specific intent" vs. "reckless indifference"? If a state negligently starves a group to death, is the duty to intervene lower?
  *   **The Intent Problem:** The legal definition requires proving the *mindset* of the perpetrator. This is notoriously difficult and often takes years of court proceedings.
  *   **Panelist Mapping:** Speaker 1 is a **Legal Trigger** proponent (the word is load-bearing). Speaker 2 is a **Moral Trigger** proponent (bodies pile up the same).
  *   **Settled vs. Contested:** **Highly Contested.** This is the biggest live fight in the field. Legal scholars defend the intent requirement to prevent inflation of the term. Moral philosophers and prevention NGOs argue the intent requirement creates a "proof paradox" that prevents early action.

  ### 5. The Timing Reading: Retrospective vs. Prospective
  *   **The Claim:** "Never Again" is a promise to punish/memory after the fact (Retrospective) OR a mandate to prevent before the fact (Prospective).
  *   **Analysis:**
      *   **Retrospective:** **Trivial.** We already have courts for this. If "Never Again" only means "we will prosecute later," it offers no protection to the victims.
      *   **Prospective:** **Defensible but Difficult.** This requires acting on *risk* rather than *certainty*.
  *   **Flatmate's Critique:** She is attacking the **Retrospective** application of a **Prospective** slogan. She argues that because legal genocide is determined retrospectively (after evidence of intent is gathered), using it as a prevention trigger is "self-defeating by construction."
  *   **Panelist Mapping:** Speaker 1 is vulnerable here. If they argue the *label* creates the duty, but the *label* is only available post-facto, their prevention model fails. Speaker 2 avoids this by focusing on "stopping the killing" (Prospective).
  *   **Settled vs. Contested:** **Contested.** The Genocide Convention includes a "duty to prevent" (Article 1), but the ICJ has struggled to define when that duty activates *before* genocide is legally proven.

  ---

  ### Verdict on Your Flatmate
  Your flatmate is **substantively correct about the logic, but potentially too fast on the solution.**

  1.  **Where she is right:** She correctly identifies that if the duty to intervene is *conditional* on a legal finding of genocide, prevention is logically impossible. Legal findings are retrospective; prevention is prospective. You cannot prevent a crime that has already been legally adjudicated.
  2.  **Where she might be too fast:** She wants to "junk the trigger model entirely." However, political scientists argue the *word* "genocide" has unique mobilizing power (a Schelling focal point). Removing the label might reduce the political will to act, even if it makes the moral logic cleaner. The label creates a "red line" that "crimes against humanity" sometimes fails to cross in public opinion.
  3.  **The "Graded Duty":** Her proposal (duty scales with harm/certainty) is essentially the **Responsibility to Protect (R2P)** framework. This is the dominant competing model in IR right now. It is not a fringe view; it is the mainstream alternative to the strict Genocide Convention model.

  ### For Your Seminar: Settled vs. Contested
  Do not walk into your seminar and present the following as settled fact. These are live ammunition:

  *   **Contested:** Whether the *legal definition* of genocide (with specific intent) should guide *policy*. (Human rights NGOs often say no; International Lawyers often say yes).
  *   **Contested:** Whether "Genocide" is morally distinct from "Mass Killing." (Some philosophers argue the *intent to destroy a group* makes it a "crime of crimes"; others argue death is death).
  *   **Contested:** Whether using the word "genocide" helps or hinders intervention. (Some argue it creates paralysis because states fear the legal obligation; others argue it creates necessary pressure).
  *   **Settled:** That the 1948 Convention definition is the only *legal* definition, but it is not the only *sociological* or *moral* definition.
  *   **Settled:** That "Never Again" is a normative vow, not an empirical prediction.

  **Summary for your seminar:**
  The panelists weren't disagreeing about the value of life; they were disagreeing about **classification costs.** Speaker 1 argues that without the strict classification (Genocide), the obligation dissolves. Speaker 2 argues that the cost of classification (time/evidence) exceeds the value of the label. Your flatmate correctly identifies that Speaker 1's position creates a **prevention paradox**: you cannot prevent what you cannot yet name.
