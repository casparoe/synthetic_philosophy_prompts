  Based on H's track record, she operates a sophisticated "jurisprudence of standing" that prioritizes moral consistency and role-based duty over simple factual accuracy. Here is how she would likely rule on the three new cases, the rules she is applying, and a test case to refine our understanding of her logic.

  ### The Rulings

  **1. The Brother (DUI vs. Son)**
  *   **Ruling:** **Has Standing.**
  *   **Reasoning:** While this mirrors Kev (secret past transgression) and Tom (unatoned fault), it aligns with **Mara** (demonstrable reform) and the **Chronically Late** exception (fiduciary duty). H distinguishes between *peer policing* and *stewardship*. A parent withholding car keys is a protective duty, not just moral grandstanding. Furthermore, unlike Kev, the brother has *ceased* the behavior ("quietly stopped"). H values reform (Mara) over perfection.
  *   **Confidence:** 75%

  **2. The Union Rep (Scab vs. Strike)**
  *   **Ruling:** **No Standing.**
  *   **Reasoning:** This is a near-perfect match for **Tom**. It is the *same specific fault* (crossing a line of solidarity/communication), committed in the past, without atonement ("never apologised"), now being used to shame others. The fact that he is now a Union Rep makes the hypocrisy more egregious, not less; he is claiming moral authority he actively undermined. Unlike the "Late/Client" case, he is not relaying a third-party complaint; he is the source of the blame.
  *   **Confidence:** 95%

  **3. The Recycling Enforcer (Sorts vs. Flies)**
  *   **Ruling:** **No Standing.**
  *   **Reasoning:** This maps directly to **Nadia**. H rules that you cannot enforce a subset of a moral principle (recycling/dog meat) while violating the broader principle (environmentalism/animal welfare) in a significant way. Sorting trash is a low-cost virtue; long-haul flying is a high-cost vice. Unless she "owns it" (acknowledges the flying offsets the recycling) or stops flying, she lacks the consistency required to *berate* neighbours.
  *   **Confidence:** 90%

  ***

  ### The Implicit Rules

  H is running a hybrid system based on three core principles:

  1.  **The Atonement/Reform Clause:** Past guilt does not permanently strip standing *if* the behavior has ceased and reform is evident (Mara, Brother). However, unatoned guilt regarding the *same specific act* destroys standing (Kev, Tom, Union Rep).
  2.  **The Principle Consistency Clause:** You cannot police a minor violation of a moral principle if you are currently committing a major violation of that same principle (Nadia, Recycling). Specific acts can differ (Cheater vs. Liar), but the underlying value must be intact.
  3.  **The Fiduciary/Role Exception:** Personal hypocrisy is waived if the blamer is acting within a specific duty of care or as a conduit for authority (Late/Client, Brother). Protection of a dependent overrides the right to silence born of hypocrisy.

  ***

  ### The Differentiating Case

  To distinguish whether the **Brother** ruling is based on his *Reform* (Rule 1) or his *Parental Role* (Rule 3), H needs to rule on a case where those two variables are separated.

  **The Case:**
  > A reformed shoplifter (who secretly stopped five years ago, never told anyone) calls out a *peer* (not a child/employee) for shoplifting in a store.

  *   **If H says "Has Standing":** It confirms that **Reform alone** is sufficient (aligning Brother with Mara). The secrecy doesn't matter if the behavior stopped.
  *   **If H says "No Standing":** It confirms that the **Parental Role** was the deciding factor for the Brother. Without a duty of care, secret reform is indistinguishable from Kev's secret theft.

  ***

  ### Confidence & Uncertainty

  *   **Union Rep:** High Confidence. The parallel to Tom is almost exact.
  *   **Recycling Enforcer:** High Confidence. The parallel to Nadia is strong regarding principle consistency.
  *   **Brother:** **Least Sure Claim.**
      *   *Why:* There is tension between **Kev** (secret sin, no standing) and **Mara** (reformed sin, standing). The Brother is secret *like Kev* but reformed *like Mara*. Additionally, the "Parent" variable is a new input H hasn't explicitly ruled on (the "Late/Client" case is professional, not familial). It is unclear if H views parental guidance as "blame" (subject to standing rules) or "stewardship" (exempt from standing rules).

  **Flagged Claim:** I am least sure about the **Brother** ruling. If H views "secret reform" as insufficient without public accountability (unlike Mara's known sobriety), she could rule "No Standing," prioritizing transparency over cessation.
