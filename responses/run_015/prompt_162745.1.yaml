answer: |-
  You are the night coordinator for a flood rescue unit. Six strangers are trapped in separate rooms of a collapsing basement; the water is rising and none can swim. You control the pumps. Option A: divert all power to Room 1. The pump holds; Person 1 is guaranteed escape, but the remaining capacity is insufficient for Rooms 2–6, guaranteeing they flood. Option B: divert power to the main drain. There is a twenty-five per cent chance the system clears the whole basement, saving all six; but a seventy-five per cent chance the motor burns out, flooding every room instantly and killing everyone. You must choose now.

  1.  **Verdicts:** (a) The expected-lives view calculates 1.0 saved in A versus 1.5 in B (6 × 0.25). It chooses B. (b) The anti-numbers view looks at individual claims. Person 1 moves from certainty to high risk; Persons 2–6 move from death to high risk. Since no claim is stronger, we cannot sacrifice Person 1's certainty to benefit the others. It chooses A. (c) The lottery view seeks equal chances. B offers everyone 25%; A offers one 100%, others 0%. Honestly, this view might prefer B, as it treats claimants symmetrically, even if the risk is higher.

  2.  **The Lever:** The work is done by the certainty/risk asymmetry. If you remove it—making both options certain saves—you collapse back into the standard 1-versus-5 standoff where the anti-numbers view typically demands a coin toss. Here, the certainty allows the individual claim to anchor the decision.

  3.  **Smuggling Utility?** No. A charge of smuggling expected utility assumes we are weighing 'certainty units' against 'life units'. We are not. The argument is deontological: Person 1 has a veto against being used as a means to boost aggregate odds. It is about justification to the individual, not global outcomes.

  4.  **The Wriggle:** A defender of counting will argue you are still aggregating, merely weighting 'certainty' heavily. They will insist that refusing B is equivalent to killing the five, and that Person 1 has no right to demand safety when five others face certain death otherwise. They will claim the 'veto' is just risk-aversion dressed up as morality.
