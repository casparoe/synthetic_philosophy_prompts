      *   *Test Dist:* L1 requires extrapolation to the "competence" distribution, which is never fully observed. ML usually tests on i.i.d. data from the same distribution as training. L1 is OOD generalization by default.

  6.  **Addressing Uncertainty & Mind-Changing:**
