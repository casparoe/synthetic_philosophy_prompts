      *   *The Crux:* It depends on the *source* of the bias. If the bias comes from a Transformer trained on code/math too, it's not "Language Innate." If the bias comes from a "Language Acquisition Device" (LAD) architecture that *only* works for language, it is.
      *   *Discriminating Experiment:* We need to isolate the bias. Train the *same* architecture on *non-linguistic* sequential data with similar statistical properties. If it learns language constraints *only* when initialized/prepared for language, that supports nativism. If it learns them whenever the data has similar recursive structure (even if non-linguistic), that supports generic learning.
      *   *Actually, the stronger test:* **Transfer/Cross-lingual/Artificial Grammar.** If the "innate" structure is specific, it should facilitate learning *any* human language but fail on non-human grammars. If it's generic, it learns whatever statistical structure is present.
      *   *Refinement:* The real discriminator is **Sample Efficiency vs. Specificity.** Does the learner learn *only* human-language-like structures efficiently, or *any* structure? Nativism predicts a "human language shaped" hole in the loss landscape.

  5.  **Addressing the "No Counterpart" (Loss & Test Dist):**
