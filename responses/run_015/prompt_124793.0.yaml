  2.  **Deconstruct the Linguist's Argument (PoS) into ML Terms:**
      *   *Core Claim:* The mapping from Data ($D$) to Hypothesis ($H$) cannot be explained by standard learning dynamics given the properties of $D$. Therefore, the Hypothesis Space ($\mathcal{H}$) or the Prior ($P(H)$) must be constrained *specifically* to the target domain (Language).
      *   *Input Properties:*
          1.  **Noisy/Degenerate:** Distribution shift. $P_{train}(X, Y) \neq P_{true}(X, Y)$. Performance errors, false starts. In ML: Label noise, input corruption, but worse because the "true" distribution isn't just clean data, it's competence vs. performance.
          2.  **Incomplete:** Sample complexity issue. The support of $P_{train}$ does not cover the support of $P_{true}$. Long-tail phenomena are missing.
          3.  **No Negative Evidence:** This is the big one. In ML, this is *positive-unlabeled (PU) learning* or *one-class classification* but without even knowing the "unlabeled" are truly out-of-distribution. It's learning a support boundary without counterexamples. In standard ERM, you minimize loss on positive examples, which often leads to memorization or over-generalization (e.g., accepting everything).

  3.  **Drafting the Translation (Mental Sandbox):**
      *   *Inductive Bias:* Yes, ML agrees bias is needed.
      *   *The Clash:* The linguist says the bias must be *linguistic* (domain-specific). The MLer says the bias can be *computational/architectural* (domain-general, e.g., Transformer + SGD).
      *   *Innateness:* In ML, this maps to Architecture + Initialization + Pre-training Objective. But "Innate" implies it didn't come from *this* data and isn't just "generic computation." It implies specific constraints (e.g., Structure Dependence) are hard-coded or heavily weighted in the prior.
      *   *Loss Function:* In L1, there is no explicit loss. The child infers the objective (communication success?). In ML, we define the loss. This is a major mismatch.
      *   *Test Distribution:* In L1, the "test" is productive generation of novel sentences. In ML, it's i.i.d. holdout. L1 requires systematic generalization.

  4.  **Addressing the "Result R" Scenario:**
      *   *Scenario:* Model trained on CDS (limited data) learns constraints not obvious in data.
