      *   **Section 2: The Three Bits.** Break down Noise, Incompleteness, Negative Evidence.
      *   **Section 3: Residue Report.** Clean translations, Fudged translations (Innateness), No Counterparts (Loss/Test).
      *   **Section 4: Result R & The Experiment.** Analyze the scenario. Propose the discriminating experiment (Sample Complexity Curves on Artificial Grammars).
      *   **Section 5: Uncertainty.** Flag the "Architecture as Innateness" conflation. Define the concrete mind-changer.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Don't just say "Inductive Bias." Distinguish between *Architectural Bias* (Transformer) and *Weight Prior* (Pretraining). The linguist cares about *content-specific* bias (e.g., recursion is privileged), not just *learning-efficient* bias (e.g., attention is good).
      *   *Correction on Negative Evidence:* It's not just PU learning. It's that the *absence* of a string in the input doesn't imply it's impossible. The child must infer constraints that *rule out* strings they haven't seen, without being told they are ruled out. This is learning the *support* of the distribution without negative samples.
      *   *Result R:* The user says "same explanation under a different name." The linguist says "the name tells you the source of the bias." I need to clarify that the disagreement is about the *origin and specificity* of the bias, not the *existence* of bias.
      *   *Mind Changer:* Needs to be sharp. "Show me a generic architecture that fails to learn X without linguistic pre-training" vs "Show me a linguistic architecture that fails to learn non-linguistic Y." Actually, the sample complexity gap is the strongest argument.

  9.  **Final Polish:** Check against constraints. Did I use ML vocab freely? Yes. Did I address the three bits? Yes. Residue report? Yes. Result R? Yes. Uncertainty? Yes.

