  The body breaks, this heavy load of **rupa**,
  No owner found inside the sting of **vedana**.
  Perception labels what it cannot hold, **sanna**,
  Volition pushes through the old **sankhara**,
  And light depends on oil, so goes **vinnana**,
  No tenant in the house, but only **flame**.

  We watch the wick consume itself, the **flame**,
  No solid core beneath the shifting **rupa**.
  One sheaf leans on the other, blind **vinnana**,
  Propped up by pleasure and by pain, **vedana**.
  Habits pile up, a heap of **sankhara**,
  While memory paints a face it calls **sanna**.

  The name we give the fire is just **sanna**,
  It jumps the gap without a traveling **flame**.
  What drives the jump is just the old **sankhara**,
  No soul survives the burning of the **rupa**.
  If feeling stops, there is no more **vedana**,
  Who wakes up then? Who knows this **vinnana**?

  Dependently arisen, this **vinnana**,
  No little man behind the eye of **sanna**.
  But if the touch brings neither joy nor **vedana**,
  Why does the fire seek another **flame**?
  Suppose one dying candle lights new **rupa**
  Of two new wicks within the same **sankhara**.

  Both descend from it, this knot of **sankhara**,
  Neither the same nor distinct in **vinnana**.
  The pattern holds although it changes **rupa**,
  A story told without a fixed **sanna**.
  But who is saved when splits the single **flame**?
  Whose burden ends? Whose touch of **vedana**?

  I admit it rests, this ache of **vedana**,
  No one to fight the grinding **sankhara**.
  But night comes on and doubles every **flame**.
  If no one walks the path, then why **vinnana**?
  The reeds stand up without a witness **sanna**,
  And morning burns the shadow of the **rupa**.

  Who owns this temporary **rupa**, whose **vedana** ends?
  The path is walked without a perceiving **sanna**, a habit broken in the deep **sankhara**.
  One light becomes two streams of **vinnana**, and neither claims the dying of the **flame**.
