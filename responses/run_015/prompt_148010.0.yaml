      *   Avoid philosophical jargon where possible, or explain it simply (since the user knows some, but keep it accessible).
      *   Keep the paragraph structure natural but without explicit markers.

      *Final Polish:*
      *   Read through to ensure no accidental formatting slips.
      *   Ensure the reasoning is clear on *why* it stalls. (Because people are testing different hypotheses with different tools on different objects).

