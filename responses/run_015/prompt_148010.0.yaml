prompt: |-
  Hey — I'm a senior in high school and I read way too much philosophy stuff online, and there's a pattern I keep running into that I can't make sense of, so I wanted to ask someone about it.

  Basically, every time a thought experiment shows up on the forums I follow, the exact same argument happens and it never goes anywhere. Someone drops the case — lately it's been the one where you scan your brain and the copy wakes up on a computer, before that the violinist one, before that the machine that gives you any experience you want — and then the replies are always some mix of: 'I don't have your intuition', 'the setup is physically impossible so my imagination just fills in whatever', 'intuitions aren't evidence', and 'you rigged it, you only described the bits that help you'. Then everybody repeats themselves for two hundred comments. I've been watching this play out for like two years and I honestly cant remember one time anyone convenced anyone.

  I've got two guesses about what's going on and I want to know if either is right, and which one is doing more work.

  Guess one: people think they're disagreeing about the case, but they're actually disagreeing about the invisible details their imaginations quietly added. If you ask me to imagine a copy of my brain running on a computer, I have to fill in a ton of stuff you never specified — whether the copy is conscious, whether the original dies, whether it's instant — and whichever way I fill it in basically decides my answer before I start, and I probably won't notice I filled it in at all. So a lot of these fights might be people reacting to different cases while calling them by the same name.

  Guess two: the phrase 'thought experiment' — or intuition pump, I think Dennett is the one who came up with that — is covering three or four different activities with different standards: using a case as evidence about what our concept really is, using it to check what a theory is secretly committed to, using it to make somebody feel something so they'll switch sides, and using it to locate exactly where two people's views come apart. And then everyone grades everyone else's case by the rules for their own activity.

  So what kind of stalemate is this, actually? Is one of my guesses right, or is it something else — a verbal dispute, a disagreement about what counts as evidence, a hidden factual question about how imaginations actually work that everyone is pretending to settle from the armchair, or just bedrock intuitions nobody can argue for? And given whatever you think it is, what would count as progress, if anything — is there a way to build or describe a case that dodges this, or is the whole format just broken? I'd much rather have your actual reasoning about why it stalls than a list of positions, and please don't tell me to go read papers, I can't get them. One last thing: write it as plain prose, no headings, no bullet points, no bold text, no tables, just like you were writing me an email.
reasoning: |-
  Thinking Process:

