      (Okay, let's assemble the text.)

      *Key points to hit:*
      1. Validate the observation (it's real).
      2. Both guesses are correct.
      3. Guess 1 (underspecification) is the fuel.
      4. Guess 2 (methodological mismatch) is the engine.
      5. The stalemate is about treating intuitions as evidence vs. outputs.
      6. Progress is mapping disagreement, not resolving it via intuition.
      7. The format isn't broken, but the usage is.

      *Drafting content:*
      Hey there. It is really impressive that you have spotted this pattern so clearly, especially while still in high school. Most people never notice the loop they are stuck in, they just feel frustrated, but you have identified the structure of the frustration itself. You are asking the right meta-questions, and the short answer is that both of your guesses are correct, but they are working together in a way that makes the problem harder to see than either one alone.

      Your first guess about invisible details is definitely a major part of the problem. When a philosopher describes a scenario like brain uploading or the experience machine, they are trying to hold everything constant except the one variable they want to test, like personal identity or the value of truth. But human imagination does not work like a computer simulation where you can freeze every variable. When you read the prompt, your brain automatically fills in the gaps using your existing beliefs and experiences. If you already believe consciousness is biological, you will imagine the computer copy as a hollow shell even if the prompt says it acts exactly like you. If you believe consciousness is informational, you will imagine it as fully real. So when you argue with someone, you are not arguing about the same case. You are arguing about Case A versus Case B, but you are both calling it The Case. This means you are talking past each other from the very first sentence, and no amount of arguing will bridge that gap because neither of you realizes you are standing on different ground.

      Your second guess about the different activities hidden under the label of thought experiment is also spot on, and this is where the conflict gets heated. Some people use these cases as a way to test definitions, treating their intuition as a data point that reveals how a concept like justice or self actually works. Others use them as a stress test for a theory, trying to show that a theory leads to a ridiculous result. Still others use them purely as rhetorical tools to make you feel a certain way so you will abandon a position. The problem is that people switch between these modes without announcing it. If someone treats your intuition as evidence, they will ask you to clarify your feeling. If someone treats your case as a rhetorical trick, they will attack the setup as rigged. When one person is trying to map a concept and the other is trying to win a debate, the conversation stalls because they are playing different games with the same pieces.

      So to answer your question about what kind of stalemate this is, it is a methodological confusion fueled by psychological variance. It is not just a verbal dispute, because there are real differences in how people process the scenarios, but it is not a factual dispute about the world either, because the scenarios do not exist. The stalemate happens because everyone pretends their intuition is a perception of a fact, when it is actually a reaction generated by their own mind. When you say I do not have your intuition, you are correctly identifying that your internal machinery produces a different output for the same input. When people say intuitions are not evidence, they are correctly identifying that your feelings about a fake scenario do not prove anything about reality. Both sides are right, but they are using those truths to shut down the conversation rather than deepen it.

      Regarding which guess is doing more work, I would say the underspecification is the fuel, but the methodological mismatch is the engine. The vague details allow people to project their biases, but the reason they fight so hard is that they have different expectations about what the argument is supposed to achieve. If everyone agreed that the goal was just to see where their intuitions differed, the underspecification would be less damaging. But because everyone wants to use the intuition to prove they are right about something objective, the underspecification becomes a weapon. You can always claim the other person imagined it wrong to dismiss their counter-intuition, and they can do the same to you.

      As for whether the format is broken or if progress is possible, I do not think the format is broken, but the way it is used in online forums is often unproductive. Progress becomes possible when you stop trying to use the thought experiment to convince the other person and start using it to map the disagreement. Instead of saying this shows you are wrong, you could say this shows that you value continuity of body while I value continuity of information. That shifts the goal from winning to understanding. You can also try to fix the underspecification by asking explicit questions about the hidden details before arguing the main point. If you ask whether the copy feels continuous or discontinuous, you might find that your disagreement vanishes or moves to a more honest place.

      Ultimately, the reason these threads never end is that people are looking for a logical proof in a place that only contains psychological data. Thought experiments reveal what we believe, not what is true. If you treat them as a way to learn about the people you are talking to rather than a way to learn about the universe, the stalemate breaks. You will not convince them, but you will understand why they cannot be convinced, and that is often the only real progress available in these discussions. You are already ahead of most people by noticing the pattern, so trust your instinct that something is off with the process, because you are right.

