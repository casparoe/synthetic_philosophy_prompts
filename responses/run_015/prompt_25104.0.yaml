answer: |-
  This is a sharp observation that cuts to the heart of contemporary political philosophy. You have identified what critics call the "secularist bias" within the practice of public reason. While John Rawls's theory of *Political Liberalism* explicitly excludes *all* comprehensive doctrines (both religious and secular) from the basis of coercive law, actual liberal democratic practice often operates on a distorted version of this theory. It treats secular comprehensive doctrines as if they were neutral tools of reason, while treating religious doctrines as private idiosyncrasies.

  Here is the reconstruction of the theory your observation exposes, an evaluation of its defensibility, and a description of what a consistent application would entail.

  ### 1. The Presupposed Principle: Epistemic Accessibility via Natural Reason

  The practice you describe presupposes a principle of legitimacy we might call **Epistemic Accessibility via Natural Reason**. Under this view, a reason counts as "public" if it is derived from premises that any rational agent can access without relying on special revelation, ecclesiastical authority, or sacred texts.

  The asymmetry arises because the practice assumes that secular comprehensive doctrines (like utilitarianism or Kantianism) are products of "natural reason"—logic and observation available to everyone—whereas religious doctrines are products of "faith"—private commitment to specific authorities. Therefore, the utilitarian claim "maximize welfare" is treated as a calculation anyone can verify, while the Catholic claim "steward the land" is treated as a belief only insiders accept. The principle rules out religious reasons not because they are moral, but because their *epistemic source* is deemed private, whereas the epistemic source of secular moral philosophy is mistakenly categorized as public.

  ### 2. Is the Distinction Defensible?

  No, the asymmetry is not philosophically defensible. It rests on a category mistake regarding the status of secular moral theories.

  The defense of the asymmetry relies on the idea that utilitarianism (or libertarianism, or Kantianism) is "neutral" or "scientific." But as you noted, these are comprehensive moral ontologies. The claim that "aggregate welfare is the sole metric of right action" is not an empirical fact discoverable by a telescope; it is a normative axiom just as contestable as "God commands stewardship." A Kantian cannot accept the utilitarian premise without abandoning their core commitment to human dignity as an end-in-itself; a religious citizen cannot accept it if it contradicts divine command.

  By allowing secular comprehensive doctrines to pass as "public reason" while blocking religious ones, the practice effectively establishes a **state-sponsored secular comprehensive doctrine**. It privileges citizens whose metaphysical views happen to align with post-Enlightenment secular philosophy and disadvantages those whose metaphysical views are theological, even if both groups are arguing from deeply held, non-universal moral convictions. Philosophers like Nicholas Wolterstorff and Robert Audi have debated this extensively, but the consensus among critics is that "secular reason" is often just another faith position wearing a suit. If the goal of public reason is to avoid coercing citizens based on premises they reasonably reject, then secular comprehensive doctrines fail the test just as thoroughly as religious ones.

  ### 3. The Consistent Version: Strict Political Liberalism

  If we took the underlying principle seriously and applied it consistently, we would have to adopt a **Strict Political Liberalism**. In this consistent version, *no* comprehensive doctrine—religious or secular—could serve as the primary justification for coercive law in the public political forum.

  A city councilor could not argue for zoning based on "Christian stewardship," but they also could not argue based on "maximizing aggregate utility." Instead, they would have to translate both concerns into a **freestanding political conception of justice**. This "thinner thing" would rely on values implicit in the democratic culture itself, such as equal citizenship, basic liberties, public order, or the fair distribution of primary goods. The argument would have to be: "This zoning change protects the equal standing of neighbors," or "This change ensures fair access to public resources." These are political values that an overlapping consensus of reasonable comprehensive doctrines (religious, utilitarian, Kantian) could endorse for their own distinct reasons, without the state endorsing the truth of any single one.

