answer: |-
  Your empirics suggest the latent dimension $\theta$ is not a policy scale but a coalition index. The variance explained is real, but the loadings $\lambda$ are time-varying and locally identified. Here is the translation of the theoretical landscape into your measurement framework.

  **1. Bobbio (Equality) vs. Dead Seating Chart**
  Bobbio translates as a claim of **scalar measurement invariance** across time and space. He argues $\theta$ measures a specific substantive parameter (equality vs. hierarchy) with stable loadings. Your data falsifies this: if loadings flip (trade vs. protection), scalar invariance fails. The "Dead Seating Chart" translates as **path dependence in initialization**. The axis exists because the optimization algorithm (historical formation) started at a specific local minimum in 1789 and never converged elsewhere.
  *Verdict:* Bobbio is empirically unsupported in your model. The Dead Chart fits the stickiness but fails to explain why the dimension continues to explain variance if it's truly empty.

  **2. Elite Bargains vs. Temperament**
  "Elite Bargains" translates to **cooperative game theory**: $\theta$ indexes membership in the winning coalition of a characteristic function game. Cohesion is maintained by side payments and logrolling, not preference similarity. The dimension is the **core** of the game. "Temperament" (Haidt) translates as a **higher-order psychometric latent trait** (e.g., Openness) causing the covariance in issue responses.
  *Verdict:* Temperament requires stable loadings (psych traits don't flip on NATO every 20 years). Your finding that enmity predicts $\theta$ better than issues supports the Bargain model. The dimension is structural, not psychological.

  **3. Contingent Bundle vs. Organic Worldview**
  "Contingent Bundle" claims the covariance matrix of issues is unconstrained across time; $\lambda_{t1} \neq \lambda_{t2}$. The issues are conditionally independent given the coalition label. "Organic Worldview" claims a **second-order factor** constrains the loadings; positions hang together due to logical or psychological consistency.
  *Verdict:* Your data (content flips) supports Contingency. The Organic view is empirically false in this context. The "bundle" is a residual of coalition discipline, not philosophical consistency.

  **4. Focal Point/Coordination (Your Invention)**
  This translates cleanly as a **Schelling point** in a coordination game. $\theta$ is a common-knowledge label that reduces transaction costs for coalition formation. The value of the dimension is not the content but the **convergence** itself. It holds coalitions together because deviating from the label incurs a penalty (loss of brand recognition/vote share).
  *Verdict:* This is the highest-fidelity translation of your empirics. It explains why $\theta$ is sticky (brand equity) while loadings flip (adaptive issues). The axis is real as a **network partition**, not a semantic scale.

  **5. Marxist (Class Latent)**
  This argues Left/Right is an **observed proxy** for an unobserved latent variable: Class ($Z$). The Left/Right axis introduces **omitted variable bias** that masks class coalitions. It works by restricting the **feasible set** of coalitions, making class-based alliances computationally difficult to form within the institutional rules.
  *Verdict:* Hard to translate into roll-call data because $Z$ is outside the matrix. It's a claim that your model is structurally misspecified by excluding economic structure.

  **Residue Report: Indeterminacy and Invariance**

  **(a) Rotational and Sign Indeterminacy:** In your IRT/NOMINATE models, the sign of $\theta$ is arbitrary without a constraint. Theoretically, the direction comes from **graph partitioning**. The "Left" is simply the partition opposite the "Right." The content of the distinction is not the sign itself, but the **existence of the cut**. The sign is fixed ex-post by historical convention (the 1789 initialization), but the *distance* is the empirical reality. The direction is a small extra-empirical remainder; the *split* is the entire content.

  **(b) Measurement Invariance:** You cannot claim measurement invariance in the psychometric sense. If loadings flip, the construct is not semantically invariant. However, you have **structural invariance**. The axis tracks the **affinity matrix** of party competition (who fights whom), not the item responses. The conclusion: The dimension is a **conflict topology**, not a policy scale. It measures the structure of opposition, not the substance of governance.

  **Final Residue:**
  What is missing from your ideal-point space is **normativity**. Your model captures the *is* of coalition structure perfectly, but it cannot capture the *ought* that motivates activists. The "empty slot" theory explains stability, but it cannot explain why actors fight to fill the slot. That motivation lies outside the latent space, in the unobserved utility functions of the actors. Your framework isn't too thin; the theorists are reifying a coordination device into a moral truth. The axis is real, but it is a map of the battlefield, not the terrain.
