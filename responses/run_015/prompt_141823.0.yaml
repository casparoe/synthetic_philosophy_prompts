answer: |-
  Your friend has constructed a sophisticated version of a classic paradox in decision theory, often discussed under the headings of **dynamic inconsistency**, **resolute choice**, and the **difference between act and rule rationality**. His argument is compelling because it exploits a ambiguity in what we mean by "looking forward."

  To preserve the lesson of your printing press (that the sunk-cost fallacy is real) without accepting that promise-keeping is irrational, you should **reject Step (7)**, and consequently **reject the inference in Step (9)**.

  Here is why Step (7) is false, what rejecting it commits you to, and how it resolves the paradoxes of the auction and your press.

  ### 1. Why Step (7) is False
  Step (7) claims: *"If nothing in the past can be a reason, then at the moment of performance it is irrational to keep a promise... since the promise... [is] in the past."*

  This is a mischaracterization of forward-looking rationality. Forward-looking rationality does not say "ignore the past." It says "ignore the past *except insofar as it affects the future*."

  *   **The Printing Press:** The money you spent on the press is gone. Spending *more* money to run it does not retrieve the past money. The past expenditure has no *causal power* over future profits. Therefore, looking forward, you should stop.
  *   **The Promise:** The act of promising is in the past, but the *state of having promised* creates future consequences. If you break a promise, you suffer future costs: loss of reputation, legal penalty, loss of trust, or psychological dissonance. If you keep it, you gain future trust.

  Therefore, keeping a promise **is** forward-looking rational. You are not keeping it because of the past act; you are keeping it because of the *future consequences* of breaking it. Your friend's argument assumes that breaking a promise has no future cost. In the real world (and in repeated games), it always does.

  ### 2. Why Step (9) Collapses
  Step (9) presents a false dilemma: *"If the past can be a reason after all, then the man who keeps funding the doomed project is not making any error."*

  This assumes there are only two categories: "Past things that never matter" and "Past things that always matter." There is a third category: **"Past things that create future obligations."**

  *   **Sunk Costs (The Press):** Past expenditures that create no future obligation. These should be ignored.
  *   **Sunk Commitments (The Promise):** Past actions that create expectations, reputational stakes, or contractual obligations. These generate future consequences if violated, so they "matter."

  Rejecting Step (9) commits you to distinguishing between **sunk costs** and **sunk commitments**. You can maintain that throwing good money after bad is a mistake (because it ignores future profit) while maintaining that keeping a promise is rational (because it protects future trust).

  ### 3. Addressing the Dollar Auction and the "Inherited" Variant
  Your friend's analysis of the Dollar Auction (Steps 3–5) relies on a specific error in Step (3): *"one more dollar risks only a single additional dollar against the chance of turning that loss into a win."*

  This calculation assumes there is a significant probability the opponent will stop. But Step (5) admits the opponent is reasoning identically. If both agents are "rationally" escalating, the probability of the opponent stopping is near zero. Therefore, the expected value of the next bid is negative. A truly forward-looking agent anticipates the opponent's forward-looking escalation and refuses to bid (or cuts losses immediately).

  **The Inherited Project Variant:**
  You mentioned a variant where you inherit a failing project (or an assistant bids you in). You asked: *"Forward-looking reasoning still says one more bid... there was no moment at which you could have refused to play."*

  Here, the distinction between Cost and Commitment is vital.
  *   If you inherit a project, do you have a **commitment** to finish it?
  *   If you promised your predecessor, or if your employees/clients expect it, then quitting has a *future cost* (reputation, morale). In that case, finishing might be rational, not because of the past money, but because of the future cost of quitting.
  *   If you inherit a project with **no strings attached** (no reputation risk, no contractual penalty), then forward-looking rationality says **write it off immediately**. The fact that someone else spent the money is irrelevant. The fact that you are "already in" is irrelevant. Only future costs vs. future benefits matter.

  In this specific case, your friend is wrong. If there is no reputational or contractual bind, the rational move is to stop. The "sunk cost fallacy" applies perfectly here.

  ### 4. Addressing the "Policy" Objection
  You wrote: *"Whatever policy I settle on, the moment I am actually in the auction it seems more profitable to abandon it than to follow it."*

  This is the problem of **Dynamic Inconsistency**. Your friend suggests rationality governs policies; you observe that at the moment of action, the policy seems suboptimal.

  The solution is to recognize that rationality applies to **agents**, not just **acts**.
  *   **Act Rationality:** "What maximizes value right now?" (Leads to escalation, broken promises, and ruin).
  *   **Dispositional Rationality:** "What kind of agent should I be?" (An agent who cuts losses on doomed projects, but keeps promises).

  If you are the *kind of person* who re-evaluates promises every time the cost of keeping them rises, you will not be trusted, and you will lose opportunities. If you are the *kind of person* who escalates bidding wars, you will be exploited.
  To be rational is to bind yourself to a policy *even when* the local act seems suboptimal, because the long-term value of being a resolute agent outweighs the short-term gain of deviation. This is not "ignoring the future"; it is maximizing the *total* future value of your agency.

  ### Summary of Commitments
  To escape your friend's trap, you must commit to the following three distinctions:

  1.  **Reject Step (7):** Forward-looking rationality *does* support promise-keeping, because breaking promises has future costs (reputation/trust).
  2.  **Reject Step (9):** Acknowledging that some past events (commitments) matter does not mean all past events (expenditures) matter. Distinguish **Sunk Costs** (ignore) from **Sunk Commitments** (honor).
  3.  **Adopt Dispositional Rationality:** Rationality is about being a certain *type* of decision-maker (one who precommits and resists local temptation), not just about optimizing every single move in isolation.

  **The Verdict on Your Press:**
  Your press was a **Sunk Cost**, not a **Sunk Commitment**. Unless keeping it running preserved a vital client relationship or reputation that would be lost by shutting it down (a future consequence), there was no forward-looking reason to continue. You fell for the fallacy. Your friend is right about the press, but wrong about the logic. You can admit the mistake without accepting that promise-keeping is irrational.
