answer: |-
  Fresh blood rises like a violent **spring**,
  Yet seeds of future **decline** are sown inside.
  We draw a straight **line** through the chaotic past,
  Believing this time there will be no **return**
  To build a new and everlasting **empire**,
  Ignoring stones that whisper of old **ruin**.

  The marble cracks to show the hidden **ruin**,
  What bloomed so bright in that inaugural **spring**.
  Now feeds the hunger of the growing **empire**,
  States rot within a slow and steady **decline**,
  The mob demands the ancient kings **return**,
  Erasing distinct marks upon the **line**.

  We trace our genealogy in a **line**,
  While desert winds bring news of coming **ruin**.
  No caliphate expects its own **return**
  To dust, despite the promise of the **spring**.
  Group solidarity frays in slow **decline**,
  The city walls protect a dying **empire**.

  Each culture thinks itself the final **empire**,
  Drawing a progressive, upward **line**,
  Blind to the morphological **decline**
  That turns the temple column into **ruin**.
  No second growth follows this cultural **spring**,
  And challenges the dead to make **return**.

  We swear the ghost will never **return**,
  Our steel and glass outlast the brick **empire**,
  We promise technologic eternal **spring**,
  Cutting the knot of fate's entangled **line**.
  But foundations settle deep toward **ruin**,
  And modern metrics show a quiet **decline**.

  So history maps a slow and steep **decline**,
  Or claims a resurrection and **return**,
  While standing midst the piles of ancient **ruin**.
  Each flag that's planted claims a new **empire**,
  Yet the path curves back on the same **line**,
  Waiting for blood to wake the dormant **spring**.

  The straight **line** bends to force a **return**,
  New **spring** blooms on the **decline** of the old,
  One **empire**'s proud height is built on **ruin**.
