  One sphere of fire hangs within the blue,
  We give a title to the Evening Star.
  The light remains the same, the vision true,
  Though distinct names suggest a world afar.
  We think the Evening Star is something new,
  One path revolves without a bound or bar,
  While thought divides the light we always find.

  ***

  **Note on Form and Philosophy**

  I am highly confident that the structural constraint here—identical context surrounding a swapped name—mirrors Frege's distinction between *Bedeutung* (reference, which stays the same) and *Sinn* (sense, which shifts). The poem's skeleton acts as the reference, while the specific name provides the mode of presentation.

  However, I am less sure whether treating co-referential names as interchangeable stanzas fully captures what Frege meant by "cognitive value." Frege argued that "a = b" extends our knowledge in a way "a = a" does not. By merely swapping the name while keeping the surrounding claims identical (e.g., "is something new"), the poem demonstrates a shift in *feeling*, but it risks flattening the actual epistemic gain of the identity statement itself. The form shows the difference in sense, but it cannot quite perform the discovery that the two are one.
