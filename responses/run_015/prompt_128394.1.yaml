prompt: |-
  I'm writting a quick explainer on federalism and got stuck on subsidiarity. My editor thinks the EU version in Article 5 TEU is basically the US 10th Amendment's reserved-powers logic — you know, powers not delegated stay local. So if subsidiarity really requires every decision to happen at the lowest competant level, then any EU directive that harmonizes rules across member states is automatically illegitimate, right? Because Brussels overrode the local level. I'm comparing how Germany's Federal Constitutional Court uses this to protect Länder culture versus how Switzerland applies it through cantonal direct democracy, but I'm stuck: if it's just an anti-preemption rule, why do both systems still let the center step in when local governments fail? Is there an actual philosophical core here, or is it just rhetoric to justify whatever the center wants? Need a gut check before my deadline.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Federalism, specifically the principle of *subsidiarity*.
      *   **User's Problem:** Stuck on the definition and application of subsidiarity.
      *   **Editor's Claim:** EU Article 5 TEU subsidiarity is basically the US 10th Amendment (reserved powers logic).
      *   **User's Logical Dilemma:** If subsidiarity means "lowest competent level," then *any* EU directive harmonizing rules seems illegitimate (preemption). Why do Germany and Switzerland allow central intervention if subsidiarity is an "anti-preemption rule"?
      *   **Core Question:** Is there a philosophical core to subsidiarity, or is it just rhetoric for centralization?
      *   **Context:** Writing a quick explainer, deadline approaching, needs a "gut check."
      *   **Comparative Angle:** Germany (Federal Constitutional Court/Länder culture) vs. Switzerland (Cantonal direct democracy).

  2.  **Deconstruct the Editor's Claim (EU Art. 5 vs. US 10th):**
      *   *US 10th Amendment:* "Powers not delegated to the United States... are reserved to the States." This is about *competence* (who has the legal right to act). It's a static division of power.
      *   *EU Subsidiarity (Art. 5 TEU):* "In areas which do not fall within its exclusive competence, the Union shall act only if and in so far as the objectives of the proposed action cannot be sufficiently achieved by the Member States... but can rather... be better achieved at Union level." This is about *effectiveness* and *necessity* within shared competences.
      *   *Verdict:* The editor is partially right (both favor localism) but fundamentally wrong on mechanism. The 10th is a jurisdictional fence; Subsidiarity is a test of efficiency/scale within a shared field.

  3.  **Address the User's Logical Dilemma (Harmonization vs. Localism):**
      *   *Dilemma:* If local is best, why harmonize?
      *   *Resolution:* Subsidiarity isn't "local always." It's "local *unless*." The "unless" is key. If a problem crosses borders (pollution, single market trade barriers), the local level is *incompetent* by definition to solve it effectively. Therefore, central action *satisfies* subsidiarity because the local level *cannot* achieve the objective sufficiently.
      *   *Key Distinction:* It's not anti-preemption; it's pro-efficiency. Preemption happens only when local action is insufficient.

  4.  **Analyze the Comparative Cases (Germany & Switzerland):**
      *   *Germany:* The Basic Law (Art. 72) uses subsidiarity-like language ("necessity test"). The Federal Constitutional Court (FCC) does review this, but often defers on "equivalent living conditions." It's not just about culture; it's about fiscal and legal unity.
      *   *Switzerland:* Cantonal sovereignty is the default. Direct democracy allows cantons to push back. But the Confederation steps in for national defense, currency, etc. The "failure" condition is built into the constitution.
      *   *Commonality:* Both allow central intervention when the *scale* of the problem exceeds the *capacity* of the unit.

  5.  **Formulate the Philosophical Core:**
      *   It's not just rhetoric. It's Catholic Social Teaching origins (Pope Pius XI, *Quadragesimo Anno*).
      *   Core idea: Higher bodies should support (*subsidium*) lower bodies, not replace them, *unless* the lower bodies lack capacity.
      *   It's dynamic, not static. It's about *capacity* and *scale*, not just *jurisdiction*.

  6.  **Drafting the Response (Iterative Process):**
      *   *Tone:* Professional, concise (deadline looming), authoritative but conversational ("gut check").
      *   *Structure:*
          1.  Direct answer to the Editor's claim (It's nuanced).
          2.  Fix the logical flaw on harmonization (The "Insufficiency Test").
          3.  Explain the Philosophical Core (Capacity vs. Jurisdiction).
          4.  Briefly touch on Germany/Switzerland comparison.
          5.  Conclusion/Takeaway for the explainer.

      *   *Refining the Editor's Point:* The editor is confusing *enumerated powers* (US) with *shared competence tests* (EU). I need to make sure the user understands this distinction clearly. The 10th Amendment says "You can't do this." Subsidiarity says "You can do this, but prove you need to."

      *   *Refining the Harmonization Point:* Harmonization is often the *proof* of subsidiarity in the EU context. If 27 different laws block trade, the Member States *cannot* achieve the objective (a functioning single market). Therefore, Brussels acting is *compliant* with subsidiarity.

      *   *Refining the Germany/Swiss Point:* Germany's "necessity test" (Erforderlichkeit) is legally binding. Switzerland's is more political/cultural. Both acknowledge that "local failure" justifies central action.

  7.  **Final Review against User Constraints:**
      *   "Quick explainer": Keep it punchy.
      *   "Deadline": Get straight to the point.
      *   "Gut check": Validate their intuition (it's not just rhetoric) but correct the legal theory.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Wait, check US 10th vs. Commerce Clause:* The US 10th has been eroded by the Commerce Clause. It's not a hard fence anymore. But conceptually, the user's editor is comparing the *ideal* of the 10th to EU subsidiarity. I should acknowledge that the 10th is structural, while subsidiarity is procedural/justificatory.
      *   *Make sure to emphasize:* Subsidiarity is a *test*, not a *ban*.

  9.  **Final Output Generation:** (Matches the provided good response.)
answer: |-
  Here is the gut check you need before your deadline.

  **Short Answer:** Your editor is conflating *jurisdiction* with *justification*. The US 10th Amendment is a jurisdictional fence (static); EU Subsidiarity is a justificatory test (dynamic). Harmonization is not automatically illegitimate under subsidiarity; in fact, it is often the *proof* of it.

  Here is the breakdown to fix your explainer:

  ### 1. The Editor's Mistake: Competence vs. Capacity
  Your editor thinks Article 5 TEU (EU) and the 10th Amendment (US) do the same thing. They don't.
  *   **US 10th Amendment:** Defines **who owns the power**. If the Constitution doesn't say Washington has it, Washington doesn't have it. It is a binary switch.
  *   **EU Subsidiarity:** Defines **who should exercise the power** in areas where *both* levels share competence. It asks: "Can the local level achieve this objective sufficiently?"

  **The Fix:** Subsidiarity isn't an anti-preemption rule; it is an **efficiency test**. Preemption is allowed *if* the local level fails the test.

  ### 2. Solving the Harmonization Paradox
  You asked: *"If subsidiarity requires decisions at the lowest level, isn't EU harmonization illegitimate?"*
  **No.** This is the crux of the principle.

  Subsidiarity has two prongs (Article 5 TEU):
  1.  **Insufficiency:** Member states cannot achieve the objective sufficiently on their own.
  2.  **Added Value:** The Union can achieve it better due to scale or effects.

  **Example:** Environmental pollution or Single Market trade barriers.
  If Germany sets strict carbon rules and Poland sets none, the objective (clean air/trade fairness) **cannot be achieved by the local level** because pollution/trade crosses borders. Therefore, the local level is *incompetent* by definition of the problem's scale. Brussels stepping in **satisfies** subsidiarity because the "lowest competent level" is now the Union, not the state.

  ### 3. The Philosophical Core (It's not just rhetoric)
  You asked if there is an actual philosophical core. **Yes.** It comes from Catholic Social Teaching (*Quadragesimo Anno*, 1931).
  *   **Core Idea:** Higher bodies should *support* (subsidium) lower bodies, not replace them, **unless** the lower bodies lack capacity.
  *   **Application:** It is not about "small government" vs. "big government." It is about **appropriate scale**.
  *   **Why Center Steps In:** When local governments "fail," it isn't necessarily moral failure; it is **structural incapacity**. A canton cannot print currency; a Land cannot stop cross-border river pollution. The center steps in not to dominate, but to enable the objective that the local level physically cannot secure.

  ### 4. Germany vs. Switzerland (Your Comparison)
  *   **Germany:** The Basic Law (Art. 72) uses a "necessity test" (*Erforderlichkeit*). The Federal Constitutional Court *does* review this, but often grants the Federation wide latitude on "equivalent living conditions." It is a **legal/constitutional check**.
  *   **Switzerland:** Subsidiarity is embedded in the constitution (Art. 5a), but enforcement is more **political**. Cantonal direct democracy allows locals to veto overreach *before* it happens, rather than suing after.
  *   **Commonality:** Both acknowledge that sovereignty flows upward *only when necessary for function*.

  ### Summary for your Explainer
  To unstuck your draft, pivot the definition:
  *   **Don't write:** "Subsidiarity keeps power local."
  *   **Do write:** "Subsidiarity keeps power at the lowest **effective** level."

  If the local level cannot solve the problem (due to scale, externalities, or coordination costs), subsidiarity *demands* the center act. Harmonization isn't a violation of subsidiarity; it is the remedy for local insufficiency. Your editor is treating it like the US 10th Amendment (a wall), but it's actually a filter.

  **Deadline Save:** Keep the Germany/Swiss comparison, but frame it as "Legal Enforcement (Germany) vs. Political Enforcement (Switzerland)" of the same capacity test. Good luck.
