prompt: |-
  I’m a phd student in ancient political philosophy and i run a tiny interview series for grad students—mostly people in my dept and a few friends who actually listen. Next week i’m talking to Dr. K, a visiting scholar who just circulated this really sharp paper arguing that the standard trio of Athenian democratic collapses—Mytilene, Sicily, the Socrates trial—aren’t best explained by "the mob was stupid" or institutional overload. Instead she claims they share a hidden structural feature: the Assembly lacked what she terms "diachronic binding power," meaning it could generate rational commitments in one session but had no mechanism to preserve those commitments across temporal gaps, especially when membership rotated and emotional salience shifted. So Mytilene isn’t about Cleon being brutal or Diodotus being humane; it’s about the same body reversing it'self within 24 hours because the second session was technically a different cognitive assembly. Same with Sicily—Alcibiades’s recall makes sense not as strategic panic but as a failure to maintain the original strategic frame across months. And the Socrates trial becomes less about populist hatred of philosophy and more about a jury that couldn’t maintain its prior commitments to parrhesia because the framing context had dissolved.

  I want interview questions that press on the mechanics, not just "explain your thesis." Specifically: one on the Mytilene reversal asking how her diachronic-binding failure distinguishes Cleon’s urgency rhetoric from Diodotus’s mercy rhetoric—does she think both speeches are equally rational within their frames, and what does that do to our moral evaluation? Include a follow-up for when she says yes, they’re both rational but the system can’t adjudicate between them. Then one on Sicily: ask whether her model requires treating Alcibiades’s recall as structurally inevitable rather than contigent, and follow up by asking what evidence could convince her that the recall was genuinely strategic rather than a framing collapse. Then one on Socrates: ask her to defend treating the jury as diachronically fragmented rather than consistently hostile—what specific feature of the trial procedure supports that? Follow up with the obvious objection that this lets the jury off the hook for murder, and push her on whether her framework can preserve moral culpability without collective continuity. Finally, ask whether she thinks any direct democracy with rotating membership is doomed to this kind of inconsistency, with a follow-up asking if she’s essentially giving up on democratic accountability altogether. I’m writing this at 2am between chapters of my diss so forgive the mess—just need the sequence to feel like it’s actually digging.
