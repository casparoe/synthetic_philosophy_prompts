answer: |-
  ### Exam Question

  **Time Allowed:** 60 Minutes
  **Total Marks:** 20

  **Question:**
  Standard analyses of self-deception often stall on the static paradox of simultaneously believing *p* and *not-p*. Move beyond this paradox by adjudicating between two specific frameworks: the **Partitioned-Mind Model**, which posits functionally isolated belief-forming subsystems within a single agent, and the **Deflationary Strategic Model**, which explains self-deception as rational belief-management motivated by social signaling costs without positing internal division.

  Write a structured essay defending **one** of these models as the superior explanation for the possibility of self-deception. Your argument must explicitly address:
  1.  Whether epistemic akrasia (holding beliefs against one's better judgment) can occur within your chosen framework without relying on doxastic voluntarism (the willful choice of beliefs).
  2.  Whether explanations based on social signaling costs can fully replace the explanatory labor that partition theories assign to internal sub-agents, or vice versa.

  ***

  ### Model Answer (Defending the Deflationary Strategic Model)

  The Deflationary Strategic Model offers a superior account of self-deception because it preserves the unity of agency while adequately explaining the phenomenology of conflict through motivated bias. Unlike the Partitioned-Mind Model, which ontologically multiplies agents within a single skull to solve the paradox, the deflationary approach treats self-deception as a continuous process of evidence-management driven by evolutionary pressures, specifically social signaling costs.

  Central to this defense is the resolution of epistemic akrasia without doxastic voluntarism. Critics argue that without distinct subsystems, an agent cannot hold conflicting attitudes. However, akrasia does not require literally believing *p* and *not-p* at the same instant. Instead, it arises when motivation biases the weighting of evidence. An agent does not voluntarily choose a false belief; rather, their desire to maintain a specific social signal lowers the threshold of evidence required to accept a comforting proposition. This is not a violation of rationality via internal civil war, but a malfunction of standard rational heuristics under pressure. Therefore, epistemic akrasia occurs not because the agent wills the belief, but because the belief-forming mechanism is strategically skewed by signaling needs.

  Furthermore, signaling-cost explanations can fully replace the explanatory labor assigned to internal sub-agents. Partition theories argue that only isolated modules can prevent the "deceiver" from alerting the "deceived." Yet, this assumes transparency of mental states that does not exist. If self-deception evolves to prevent leakage of deceptive cues to others (as Trivers suggests), the mechanism need not be a separate agent, but merely a bias in attention and memory retrieval. The "labor" of keeping the truth hidden is performed by the same cognitive systems that manage public presentation, simply optimized to hide information from the self to better hide it from others. Positing functional isolation adds ontological weight without explanatory gain; the strategic pressure of signaling accounts for the selectivity of belief formation without fracturing the mind.

  Ultimately, the Partitioned-Mind Model solves a structural problem by inventing structural complexity, whereas the Deflationary Strategic Model solves it by recognizing functional continuity. Self-deception is not a state of contradictory belief held by divided homunculi, but a unified strategy of evidence avoidance motivated by the high cost of social detection. By rejecting doxastic voluntarism and accepting that signaling costs drive cognitive bias, we explain self-deception as a coherent, albeit irrational, output of a single agent navigating social constraints.

  ***

  ### Marking Scheme

  | Analytical Move | Marks | Characteristic Mistake |
  | :--- | :---: | :--- |
  | **1. Committed Thesis:** Clearly selects one model and asserts its superiority without hedging or neutral surveying. | 4 | Losing marks for sitting on the fence or summarizing both sides equally. |
  | **2. Mechanism Accuracy:** Correctly describes how the chosen model functions (e.g., motivated bias vs. modular isolation). | 4 | Losing marks for conflating the mechanisms of the opposing model with the chosen one. |
  | **3. Akrasia/Voluntarism Link:** Explicitly argues how epistemic akrasia is possible (or impossible) without invoking willful belief choice. | 4 | Losing marks for assuming beliefs can be voluntarily willed to solve the paradox. |
  | **4. Explanatory Labor Adjudication:** Directly addresses whether signaling costs can replace sub-agents (or vice versa) regarding explanatory sufficiency. | 4 | Losing marks for confusing evolutionary function (why) with cognitive mechanism (how). |
  | **5. Synthesis/Conclusion:** Concludes by reinforcing how the specific arguments support the initial thesis rather than merely restating it. | 4 | Losing marks for ending with a generic summary that ignores the specific constraints of the prompt. |
  | **Total** | **20** | |
