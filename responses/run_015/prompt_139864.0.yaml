answer: |-
  The Answerability Condition states that an illocutionary act is constituted not by the speaker's intention or linguistic competence, but by the establishment of a normative relation wherein the speaker becomes answerable to a second party. To be answerable is to occupy a position where another person has the standing to demand performance, rely on the statement, or complain of failure. This must be distinguished from the weaker, standard claim that illocutionary success requires "uptake" merely as recognition—that the hearer understands what the speaker means. Recognition is cognitive; answerability is normative. The weaker claim is unsatisfying because it leaves unexplained why understanding a promise binds the promisor. If I understand your words but lack the standing to hold you to them, you have not actually promised me anything; you have merely described a promise. The Answerability Condition insists that illocution is not an event in the speaker's history that causes effects, but a relational status that exists only between parties.

  Three independent arguments support this view. First, consider the source of normative force. Obligations do not arise magically from mental states. If I intend to bind myself but no one else is positioned to enforce that binding, the obligation lacks the interpersonal texture that defines illocutionary acts like promising or ordering. The bindingness of a promise is essentially the promisee's right to demand performance. Without a promisee capable of exercising that right, there is no promise, only a resolution. Second, the logic of addressing implies a recipient. To address someone is to invite them into a specific normative space. If the invitation is not received in a way that allows them to occupy that space—to hold the speaker answerable—the address fails. Third, this view best explains the phenomenology of communicative failure. When we say, "I tried to apologize, but she wouldn't let me," we are not describing a psychological blockage but a normative refusal. She refused to grant me the status of apologizer because she refused to become the party to whom I was answerable. The act failed because the relation was not secured.

  We must confront the hard cases honestly. Consider the unread resignation. An employee emails a resignation to a manager who never reads it. Has she resigned? On the Answerability Condition, she has not. Until the manager is in a position to accept the resignation or hold the employee to the notice period, the normative relation is incomplete. This verdict applies equally to the manager asleep in the doorway or the notice on an empty board. In all cases, the utterance lacks the requisite uptake because no one is currently positioned to treat the resignation as standing. This is not a defect; it explains why the employee can typically withdraw such a resignation before it is acknowledged. The act is not complete until the other party can act upon it.

  The deathbed promise is more difficult. A man promises a dying, unresponsive friend to care for her sister. Intuition says he promised. I argue this intuition is mistaken. He has formed a solemn resolution, perhaps a vow to God or himself, but he has not performed an illocutionary act *to the friend*. The friend cannot hold him answerable; she cannot complain if he fails. The feeling of obligation arises from his own morality, not from an illocutionary bond. To insist otherwise is to confuse moral duty with linguistic act. Similarly, promises to no one—New Year's resolutions or graveside declarations—are not illocutionary acts. They are vows. Illocution requires an other.

  Regarding mis-uptake: a driver warns, "The bridge is out," but the hearer takes it as a threat. Was a warning performed? No. A warning requires the hearer to be positioned to rely on the information for their safety. If the hearer treats it as a threat, they are not positioning themselves to rely on the speaker's helpfulness but to defend against hostility. The normative relation formed is one of hostility, not assistance. If the speaker cannot be held answerable for the warning's accuracy by the hearer, no warning occurred. This explains why mis-uptake feels like a failure of the act itself, not just a misunderstanding. It is a real philosophical gain because it locates the act in the social space between speakers, rather than inside their heads.

  Accepting this view costs us something significant. It forces a redescription of the distinction between misfires and abuses. A misfire is usually an act that fails to secure uptake; an abuse is an act performed insincerely. On the Answerability Condition, any failure to secure answerability is a misfire—the act is void. However, an insincere promise is still a promise if the speaker is answerable. The insincere promisor can be complained against. This unifies paradigm misfires (no hearer) with failures of uptake (hearer refuses relation): both fail to create the normative bond. It collapses the distinction slightly, but rightly so, because both result in the absence of the act.

  Furthermore, the contrast between the illocutionary and the perlocutionary shifts. The perlocutionary is the causal effect of speech (persuading, frightening). The illocutionary is the normative effect (binding, obligating). If illocution requires answerable uptake, both depend on the hearer. The contrast remains clean—one is causal, one normative—but the illocutionary loses its status as something the speaker does alone. It becomes something done *with* someone.

  The single most entrenched commitment I must abandon is Speaker Sovereignty: the idea that the speaker's intention determines the act. This is controversial, as it seems to give the hearer veto power over reality. But the sceptic should accept this because language is a social institution, not a private tool. We cannot unilaterally impose obligations on others without their participation in the normative framework. If I say "I order you" to someone who does not recognize my authority, I have not ordered them, regardless of my intent. The trade is worth making. It sacrifices the comfort of individual control for a truthful account of social reality. Illocutionary acts are not things we make; they are positions we occupy together. To deny this is to pretend language connects us when it often only echoes.
