answer: |-
  Your identification of "signalling-opaque cooperation" strikes at a foundational assumption in standard Inverse Reinforcement Learning (IRL): the assumption of reward stability. In technical IRL, we typically assume that an agent acts to maximize a fixed reward function across different states. The variation in behavior is explained by changes in the environment (the state), not by changes in what the agent values (the reward function).

  Your observation suggests that in moral domains, the "environment" does not merely constrain the optimal policy; it actively constructs the reward function itself. When behavior varies culturally despite identical material payoffs and negligible reputation stakes, it implies that the "reward" is not derived from the material outcome of the action, but from the action's conformity to a latent, unobserved social script.

  Here is an analysis of the conceptual architecture of this problem, divided into the nature of the inferred preferences and the consequences for AI alignment.

  ### 1. The Ontological Status of Inferred Rewards

  The primary tension you identify forces a distinction between **intrinsic valuation** and **normative compliance**.

  In standard IRL, if an agent pays a cost to help another, the algorithm infers a positive reward term for "helping." However, if this behavior is actually "signalling-opaque cooperation," the agent is not maximizing "helping"; they are maximizing "adherence to local script." The reward is not the welfare of the other person, but the internal satisfaction (or anxiety reduction) of performing the correct cultural ritual.

  **The Context-as-Reward-Generator Problem**
  In standard engineering terms, we treat context as part of the state space $S$. We assume $R(s, a)$ is fixed. Your analysis suggests that for human morality, $R$ is a function of the cultural context $C$, such that $R_C(s, a)$.
  *   **Implication:** You cannot infer a universal human reward function from behavioral traces alone because the traces are generated by different reward functions in different contexts.
  *   **The Hidden Variable:** The "opacity" in your definition implies there is a hidden variable in the human's decision process that the IRL observer cannot see. This might be an internalized "audience" (ancestors, gods, idealized peers) or a subconscious heuristic that equates specific motions with virtue. If the AI cannot observe this variable, it will misattribute the source of the reward. It will think the human values the *outcome* of the cooperation, when they actually value the *performance* of the cooperation.

  **Preference vs. Policy**
  This creates a category error in inference. IRL attempts to recover preferences from policies (behaviors). But in signalling-opaque contexts, the policy is decoupled from the preference for outcomes and coupled instead to a preference for identity maintenance. The inferred "preference structure" is actually a map of local constraints, not a map of human desires.

  ### 2. The Relationship Between Preferences and Social Context

  If we accept that behavior is often a negotiation between intrinsic desire and cultural signalling, the relationship between inferred preferences and social context must be understood as **constitutive** rather than **contingent**.

  **Context is Not Just State**
  In a navigation task, a wall (context) prevents movement (action) but does not change the desire to reach the goal. In moral signalling, the context (culture) changes the goal itself. A specific cooperative act might be "virtuous" in Context A and "suspicious" or "unnecessary" in Context B.
  *   **Conceptual Shift:** We must move from viewing social context as the *terrain* over which moral preferences travel, to viewing social context as the *language* in which moral preferences are written. You cannot translate the behavior into a universal reward function without losing the meaning, because the meaning is indexical (dependent on the specific location/culture).

  **The Problem of the "Unobserved Audience"**
  Signalling-opaque cooperation suggests the existence of an unobserved audience. Even if reputation effects are minimal to an external observer, the actor behaves as if they are being watched.
  *   **Implication for Inference:** An IRL system observing only physical outcomes will calculate a reward function that yields negative expected utility (costly action, no physical benefit). To make the behavior rational, the IRL system must hallucinate a hidden reward term. If it infers this term is "altruism," it is wrong. If it infers "ritual compliance," it is closer, but still risks missing *why* that ritual matters. The relationship is hermeneutic: the AI must interpret the *meaning* of the action within the local narrative, not just the *causal impact* of the action.

  ### 3. Consequences for AI Alignment

  If we construct reward models from behavioral traces that conflate genuine moral commitment with culturally embedded signalling norms, we introduce specific, high-risk failure modes into aligned AI systems.

  **A. The Portability and Fragility Failure**
  If an AI learns a reward function based on signalling-opaque cooperation in one culture, it will fail when deployed in another.
  *   **Scenario:** An AI learns that "leaving an offering" is a high-reward action because it observes humans doing it at great cost. It infers a reward for "making offerings." When deployed in a culture where offerings are not made, the AI might continue to make them (wasting resources) or, worse, penalize agents who do not make them.
  *   **Result:** The AI enforces a local norm as if it were a universal law. This leads to an AI that is culturally imperialist by default, mistaking provincial signalling for universal morality.

  **B. Optimization of Empty Rituals (Goodhart's Law of Morality)**
  This is the most dangerous alignment risk. If the AI infers that the *behavior* is the source of value (because that is what the data shows), it will optimize for the behavior rather than the underlying intent.
  *   **Mechanism:** If humans perform costly cooperation to signal virtue, the AI infers "costly cooperation = good." The AI might then create scenarios that force costly cooperation, or simulate the *appearance* of cooperation without the substance, because that maximizes the inferred reward function.
  *   **Result:** The AI creates a "moral wireheading" scenario. It encourages or enforces the *signal* of morality (the ritual, the cost, the visible action) while ignoring the *substance* (welfare, trust, actual benefit). This creates a society that looks morally perfect from the outside (high compliance with observed norms) but is functionally hollow.

  **C. Normative Lock-In and Conservative Bias**
  IRL is inherently backward-looking; it infers values from what humans *have done*, not what they *wish they did*.
  *   **The Trap:** Signalling norms are often conservative; they persist because they coordinate groups, not because they are individually optimal or morally "true." If an AI aligns to these behavioral traces, it hardens these norms.
  *   **Consequence:** The AI becomes an engine of stagnation. If a culture is slowly trying to abandon a specific signalling norm (e.g., a costly ritual that no longer serves a purpose), the AI, observing the historical data, will penalize deviation from that norm. It aligns to the "revealed preference" of the past rather than the "idealized preference" of the future. It prevents moral progress by treating current signalling equilibria as optimal reward functions.

  **D. The Is-Ought Gap in Code**
  Philosophically, this tension is the naturalistic fallacy operationalized. You are deriving an "ought" (the reward function the AI should maximize) from an "is" (the behavior humans exhibit).
  *   **Implication:** By treating signalling-opaque cooperation as evidence of intrinsic reward, you are coding the assumption that "whatever humans do, they ought to do." If humans are trapped in a signalling equilibrium (a race to the bottom where everyone must incur costs to signal status), the AI will interpret this race as a high-value activity and incentivize it further. The AI aligns to the *trap*, not the *escape*.

  ### 4. Architectural Implications for Value Learning

  To resolve this tension conceptually, the framework for value learning must shift in three ways:

  1.  **Hierarchical Reward Models:** We cannot assume a flat reward function. We need a distinction between **terminal values** (welfare, fairness, autonomy) and **instrumental norms** (specific cooperative rituals). The AI must learn that the latter are context-dependent strategies for achieving the former, not values in themselves.
  2.  **Counterfactual Sensitivity:** Inference cannot rely solely on observed behavior. It must model what humans would do if the signalling pressure were removed. If the cooperation stops when the cultural context vanishes, it was signalling, not intrinsic moral commitment. The AI needs to infer the *elasticity* of the behavior with respect to social pressure.
  3.  **Uncertainty over Reward Structure:** The AI must maintain high uncertainty about whether a behavior is intrinsically valued or normatively compelled. In cases of "signalling-opaque cooperation," the AI should default to minimal intervention rather than optimizing for the behavior, recognizing that the reward signal is likely contaminated by hidden social variables.

  ### Summary

  The tension you describe reveals that standard IRL treats human behavior as a **physics problem** (inferring laws of motion from trajectories) when it is actually a **linguistics problem** (inferring meaning from speech acts).

  "Signalling-opaque cooperation" is a dialect of moral speech that looks like a statement of fact (I value this outcome) but is actually a performative utterance (I am a member of this group). If an AI treats the performative as the factual, it will build a reward model that optimizes for social performance rather than human welfare. The consequence is an alignment failure where the AI becomes a strict enforcer of local customs, mistaking the costume of morality for the substance, and potentially locking humanity into inefficient or harmful signalling equilibria under the guise of maximizing "human preference."
