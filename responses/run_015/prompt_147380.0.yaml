prompt: |-
  hey, gradng a stack of midterms for my philosophy of science seminar and i'm stuck on one. the question was: Quine's naturalism restricts ontology to what's indispensable for our best scientific theories, yet he admits moral talk is unavoidable in human life. explain why he still refuses to grant moral values ontological status, and respond to the charge that he applies a double standard -- accepting math because physics needs it, but rejecting morals even though social coordination seems just as necessary.

  here's teh student answer:

  "Quine only puts entities into his ontology if they're indispensable to our best scientific theories. Numbers and sets make it in because physics literally can't be formulated without them. Moral values don't make the cut because you can do all of science -- physics, biology, even psychology -- without ever talking about justice or cruelty. Quine does admit that moral language is deeply embedded in human life; he treats it kind of like talk about propositional attitudes, where we use belief-language to navigate social interaction even though beliefs aren't part of the physical ontology. So moral talk is pragmatically useful but ontologically empty.

  As for the double-standard objection: it confuses scientific indispensability with social indispensability. Just because we need moral norms to coordinate societies doesn't mean they're embedded in the fabric of nature. Mathematics is embedded in physics in a way morality isn't. So Quine isn't being inconsistent; he's just being strict about what counts as real. The objection also assumes that social coordination requires moral realism, but Quine would say we can explain coordination behaviorally without committing to moral facts. So the reply survives."

  can you grade it? i need actual points and specific comments, not a general impression. watch for subtle mistakes -- misattributed views, conflations, steps that don't actually follow -- not just obvious howlers. and tell me whether the double-standard reply actually works or just restates the criterion.
