answer: |-
  **Grade: 17/20 (A- / High B+)**

  **General Assessment:**
  This is a competent, clear, and largely accurate reconstruction of Quine's position. You have a solid grasp of the Indispensability Argument and the core distinction between scientific ontology and pragmatic discourse. However, there is a subtle conflation regarding propositional attitudes that risks misrepresenting Quine's physicalism, and your response to the double-standard charge, while consistent, leans heavily on restating the premise rather than defending the boundary itself.

  **Specific Comments & Breakdown:**

  **1. The Indispensability Argument (5/5 points)**
  *   **Strength:** You correctly identify the criterion: ontology is restricted to what is indispensable to *best scientific theories* (specifically physics), not human life generally.
  *   **Strength:** You accurately note that moral predicates are not required for the formulation of natural science (physics, biology, etc.).
  *   **Note:** You correctly identify that for Quine, moral talk is "pragmatically useful but ontologically empty." This captures the non-cognitivist/expressivist leanings Quine adopts in later works (e.g., *Theories and Things*).

  **2. The Analogy to Propositional Attitudes (3/5 points)**
  *   **Subtle Error:** You write: *"he treats it kind of like talk about propositional attitudes... even though beliefs aren't part of the physical ontology."*
  *   **Critique:** This is imprecise. Quine is a physicalist; he believes beliefs *are* physical states (neural irritations), but he is skeptical of *propositional* content (meanings, intensions) as ontological items. He treats moral statements differently than belief statements: belief statements aim at truth (but are scientifically messy), whereas moral statements, for Quine, lack truth conditions entirely (they are expressions of sentiment).
  *   **Why it matters:** Equating morals with beliefs risks conflating *instrumentalism about psychology* with *expressivism about ethics*. Quine rejects moral *facts*; he doesn't necessarily reject *beliefs* as real states, only their *opaque formulation*. A sharper answer would distinguish between discourse that is truth-apt but scientifically reducible (psychology) vs. discourse that is not truth-apt at all (ethics).

  **3. The Double-Standard Objection (6/8 points)**
  *   **Strength:** You correctly identify that the objection conflates "scientific indispensability" with "social indispensability."
  *   **Strength:** The point about behavioral explanation (*"explain coordination behaviorally without committing to moral facts"*) is excellent. This shows you understand that Quine thinks sociology/psychology can explain *why* we have morals without positing moral *objects*.
  *   **Weakness:** Your defense rests almost entirely on asserting Quine's criterion ("Mathematics is embedded in physics in a way morality isn't").
  *   **Critique:** The prompt asks you to *respond to the charge*. A critic charging a "double standard" is usually challenging *why* we privilege physics over social coordination. By simply restating that physics is the benchmark, you defend Quine's *consistency*, but you don't fully defend the *justification* of the boundary. You need to briefly mention *Epistemological Naturalism*: science is our best guide to *truth*, whereas social coordination is a guide to *survival/convenience*. The double standard only holds if one assumes social coordination aims at truth in the same way physics does.

  **4. Clarity and Style (3/2 points)**
  *   **Bonus:** Concise and jargon-appropriate. No fluff.

  **Evaluation of the Double-Standard Reply:**
  *   **Does it work?** It works *internally*. You successfully show that Quine is not inconsistent *given his premises*.
  *   **Does it beg the question?** Slightly. Against an external critic (e.g., a Moral Realist or a Pragmatist like Putnam), simply asserting "Science is the benchmark" is circular. A stronger reply would explicitly state that "indispensability" is an *epistemic* criterion for *truth*, not a *pragmatic* criterion for *utility*. Math is indispensable for *truth* in science; Morals are indispensable for *order* in society. Since ontology tracks truth (for Quine), only the former counts. You hinted at this with "fabric of nature," but making the epistemic/pragmatic distinction explicit would have secured full points.

  **Suggestions for Improvement:**
  1.  **Refine the Psychology Analogy:** Instead of saying beliefs aren't part of the ontology, say beliefs are "physically real but propositionally opaque," whereas moral values are "expressions of sentiment without truth conditions."
  2.  **Deepen the Double-Standard Defense:** Explicitly distinguish between *epistemic necessity* (needed to describe the world truly) and *pragmatic necessity* (needed to live together). The charge of double standard fails because it treats these two necessities as equivalent, which Quine denies.
  3.  **Terminology:** Use the term "truth-apt" or "cognitive significance." Quine rejects moral ontology primarily because moral sentences aren't in the business of stating truths that can be confirmed by empirical evidence.

  **Summary:**
  Strong answer that demonstrates a good grasp of the seminar material. To push this to an A, you need to be more precise about Quine's physicalism regarding psychology and explicitly defend the *epistemic privilege* of science when addressing the double-standard charge.
