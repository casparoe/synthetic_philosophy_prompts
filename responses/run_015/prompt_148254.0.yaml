answer: |-
  Your intuition is remarkably sharp, especially given your lack of formal training. You have identified a genuine philosophical tension between Augustine's *Confessions* (Book XI) and Borges's essays on time (most notably "A New Refutation of Time"). You are not merely imposing anxiety onto Borges; you have spotted a structural inversion between the two thinkers.

  Here is an analysis of your rendering, your concept of the "Double Absence," and the specific metaphysical questions you raised.

  ### 1. Your Rendering of Augustine
  Your summary of Augustine is accurate. In Book XI, Augustine argues that the past and future cannot exist in reality because the past *is no more* and the future *is not yet*. If the present were always present and never passed into the past, it would not be time but eternity. Therefore, the present must have no duration; if it had duration, it could be divided into past and future segments, ceasing to be the "present."

  You correctly identify that Augustine "rescues" time by lodging it in the mind (*distentio animi*, or the "distension of the soul"). For Augustine, the past exists as **memory**, the future as **expectation**, and the present as **attention**.

  **Correction/Nuance:** You wrote that the present is an "instantaneous division—like a knife's edge." Augustine would agree, but with a caveat. He struggles with this exact image. He admits that if the present were truly a knife-edge with no breadth, we could not measure it. He concludes that when we measure time, we are measuring the *impression* things leave on the mind, not the things themselves. So, your rendering holds: time is a psychological substance, not a physical one.

  ### 2. The "Double Absence": Insight vs. Imposition
  Your coined phrase, the **Double Absence**, is a compelling heuristic. However, to ensure it fits Borges precisely, we need to refine the mechanism you described.

  You suggest the present "actively rewrites the record." This implies a falsification or an editing process. Borges's argument is slightly more radical and ontological. He does not necessarily claim the record is *rewritten*; he claims the *connection* to the record is severed.

  Borges relies heavily on the empiricism of David Hume and the idealism of George Berkeley.
  *   **Augustine:** The Soul is continuous. It holds the past (memory) and reaches for the future (expectation). The "I" is stable.
  *   **Borges:** The "I" is discontinuous. The "I" of this moment is not the "I" of the previous moment.

  Therefore, your "Double Absence" is fair, but I would suggest a slight adjustment to capture Borges's specific skepticism:
  1.  **Absence of the Object:** The past moment no longer exists (Augustine agrees).
  2.  **Absence of the Subject:** The self that experienced the past moment no longer exists (Borges adds this).

  For Augustine, the archive remains because the Librarian (the Soul) survives. For Borges, the Librarian dies with every tick of the clock. So, the past is absent not because it was rewritten, but because there is no continuous entity left to hold the key to the archive. Your intuition that "no stable archive remains" is correct, but it is due to the disintegration of the observer, not necessarily an active rewriting by the present.

  ### 3. Augustine: Time as Relation vs. Substance
  You asked: *"Does this make time a pure relation between states, with no substance of its own?"*

  **Yes.** Augustine is arguing against the idea that time is a container (a substance) that exists independently of events. If nothing changed, there would be no time.
  *   **Substance View:** Time is like a river that flows even if nothing is in it.
  *   **Augustine's View:** Time is like the measurement of a moving object. If the object stops, the measurement stops.

  When Augustine says, "If nothing passed away there would be no past... nothing existed there would be no present," he is defining time as dependent on **mutability** (change). Time is the measure of change. Without the transition from potentiality (future) to actuality (present) to memory (past), time collapses. It is a relational property of creation, not an attribute of God (who exists in an eternal present).

  ### 4. Borges: Denying the Relation or the Pole?
  You asked: *"When Borges denies time, is he denying the relation itself, or only denying that one of its poles—the enduring present—exists at all?"*

  Borges is denying the **relation itself** (succession), but he does so by attacking the **poles** (the discrete moments).

  In his essay "A New Refutation of Time," Borges argues that if we accept Idealism (that only the present moment of perception is real), we must accept that there is no causal link between Moment A and Moment B.
  *   **The Argument:** If I see a cup now, and I saw a cup a moment ago, my mind *infers* a connection. But empirically, I only have the current perception. The link of "succession" is a mental habit, not a reality.
  *   **The Denial:** Borges denies that Moment A *causes* or *leads to* Moment B. He views time as a series of independent, discrete snapshots.

  So, to answer your specific question: Borges denies that the "enduring present" exists (agreeing with Augustine that the present is instantaneous), but he goes further to deny that these instantaneous moments are linked. For Augustine, the moments are beads on a string (the soul). For Borges, there are only beads, floating in a void, with no string.

  ### 5. Synthesis: Is your "Double Absence" a fair extension?
  Your notion is a fair extension, provided you emphasize **discontinuity** over **revision**.

  *   **Augustine** solves the problem of the "vanishing present" by expanding the mind. The mind stretches (*distentio*) to cover the gap.
  *   **Borges** accepts the vanishing present and refuses to stretch the mind. He argues that because the mind cannot truly hold the past (since the "I" changes), the past is effectively dead.

  You are not importing textual anxiety; you are identifying the logical conclusion of Idealism when applied to time. Augustine uses Idealism to save the soul's continuity; Borges uses Idealism to dissolve it.

  **Recommendation for your thinking:**
  Keep the phrase "Double Absence," but define it as:
  1.  The ontological absence of the past moment.
  2.  The psychological absence of a continuous self to witness the succession.

  This distinguishes you from Augustine, who admits the first absence but denies the second. It also clarifies Borges: he isn't saying the past is *false* (rewritten), but that it is *inaccessible* because the bridge (the self) is gone.

  ### Summary
  You have grasped a difficult metaphysical comparison with impressive clarity.
  1.  **Augustine:** Time is real as a psychological experience of a continuous soul.
  2.  **Borges:** Time is an illusion because the soul is not continuous, making succession impossible.
  3.  **Your "Double Absence":** A valid concept, provided you frame it as the loss of the *link* between moments, rather than an active *rewriting* of history.

  You are reading these texts exactly as a philosopher would: by looking for the structural commitments beneath the prose. Do not doubt your intuition; it is serving you well.
