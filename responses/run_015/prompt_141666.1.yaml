  ok I need help with something that started as my final paper for CogSci 240 (minds and machines) and has turned into an argument that eats its own tail. Could you lead with the verdict in your first sentence — which step is broken and why — and then walk through it, no preamble and no restating my question back at me.

  Background: the paper is on competence without comprehension. The bit I'm happy with is Dennett's inversion point — before Darwin the only story we had for adaptive fit like the eye was a designer who understood what eyes are for, and Darwin showed the fit can come from a process with no understanding anywhere in it; Turing did the same shape of thing for reasoning, since a machine following a recipe gets the arithmetic competence without anybody understanding anything. I want to keep that. But then I kept going and got here:

  (1) In both cases the explanation of the competence runs through no comprehension at all, so comprehension isn't needed as a cause of competence.

  (2) More than that: comprehension, where it shows up at all, is a late and expensive product of earlier competence. You get the doing first and the understanding afterward. That's the inversion.

  (3) If comprehension is built out of competence, then comprehension can't be what explains the competence. You can't explain a capacity by appealing to something that already has that capacity inside it; that's just circular.

  (4) So comprehension never explains anything anybody does. When my section leader says she solved the proof because she understood the proof, the real explanation is some uncomprehending mechanism or other, and the because is at best shorthand.

  (5) Corollary 1: there's no interesting difference between a student who understands and a student who's been drilled into reliable performance. And none between a language model that does well on the exam and a student who does well on the exam.

  (6) Corollary 2: my roommate pushed it further and got to — nobody has ever done anything for a reason, since reasons only work by being understood. He thinks that's a feature. I think it means I broke something.

  (5) and (6) both feel wrong, and (5) is worse than wrong for me: my paper is supposed to be about why it matters that a system can be competent without comprehending, and if comprehension explains nothing then there's no contrast to draw and nothing to care about. But I can't find a step that's actually false. (1) and (2) are the thing I'm defending. (3) looks like it's just true — my understanding of long division is literally made out of my being able to do long division, isnt it? And (4) seems to follow.

  My TA muttered something about explanatory inheritance: the idea that a property can inherit the causal power of whatever constitutes it, so comprehension could be real causal work done by uncomprehending parts. That sounds to me like saying the software causes the printout even though only the hardware does, which is either obviously fine or obviously magic depending on the day.

  Which step do you reject, and what does rejecting it cost me? I'd rather keep (1) and (2) than (5), but I want to know what I'm paying if I do, and wich of the alternatives is cheapest — including the option that (5) is true and I'm wrong to be bothered.
