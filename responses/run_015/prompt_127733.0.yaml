      *   **Question 4: What if the Kid Was Guilty? (Process vs. Outcome):**
          *   *Theorem:* Judges long-run accuracy.
          *   *Movie:* Judges the *duty* of the individual.
          *   *Scenario:* If the kid was guilty, Juror #8 was still right to vote Not Guilty initially. Why? Because the *evidence presented* was flawed.
