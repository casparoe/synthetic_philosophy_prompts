          *   *Effect:* Adding people makes unanimity *harder* to achieve, not easier. It increases the chance of a hung jury.
          *   *Benefit:* It protects against wrongful conviction (reasonable doubt). It prioritizes "not punishing the innocent" over "catching the guilty."
