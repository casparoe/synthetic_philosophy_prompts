          *   *Scene 2: The Switchblade.* (Juror #8 produces the knife). This attacks the *evidence*, not the social dynamic. It forces Juror #3 and others to confront facts.
          *   *Scene 3: The Train Noise / Old Man Witness.* (Juror #8 simulates the walk). This proves the witness couldn't have seen what he claimed.
