prompt: |-
  I sit on the program committee of a private foundation whose stated mission is to increase the number of people who lead flourishing lives, and at our next meeting we have to choose between two five-year grants of identical size. The vote is deadlocked in a way I have come to think is philosophical rather than empirical. Grant A funds contraceptive access and voluntary family planning in a district of roughly 900,000 people; the foundation's own modelling says it would avert about 11,000 births over five years, mostly births to women who report not wanting another child now, and that it would raise measured wellbeing among people who exist either way — maternal health, household earnings, schooling per child. Grant B funds IVF and fertility care in the same district, where staff estimate roughly 1,200 additional births over five years to people who want children and cannot otherwise have them. The staff economist scored both grants on wellbeing-adjusted person-years and got nearly the same figure: the lives averted under Grant A would, on our own data, have been well above the local average, while the lives created under Grant B are expected to come out slightly higher still, though the two estimates sit inside each other's error bars. A complication that keeps resurfacing is that many of Grant B's patients would eventually have conceived naturally, so the children born under the grant are not merely earlier versions of children who would otherwise have been born; under the grant, different children exist.

  The deadlock tracks two positions. One bloc argues that the beneficiaries of Grant B do not exist independently of the grant, so there is no one whom the grant makes better off and no one whom declining it leaves worse off; on the person-affecting asymmetry, Grant B's value is close to zero and Grant A wins comfortably on its benefits to women and existing children. The other bloc replies that Grant A does nothing the mission statement names — it makes nobody's life flourish — and points out that the first bloc's principle, applied consistently, would tell the foundation to stop counting most of what it currently counts. A third trustee has floated a compromise rule: count benefits to people whose existence depends on the grant, but only to the extent that their expected wellbeing exceeds a threshold set at the district median, and cap the contribution of such existence-dependent benefits at a fixed fraction of any grant's total score. Separately, our board chair has raised the repugnant conclusion about the mission statement itself, noting that maximizing the number of flourishing lives seems to imply that a much larger population of lives just barely worth living would be better, and has asked whether the committee should propose an amendment.

  Please draft the decision memo I will circulate before the meeting. It should recommend a concrete course of action — fund one grant, split the money, fund both with conditions, or decline both and reopen the search — with a rationale a colleague who disagrees could actually answer, and it should state whether you accept, reject, or revise the threshold-and-cap rule and why. It should also give the committee's honest view on whether to recommend amending the mission statement, and it should give the strongest version of the losing position rather than only arguing for the winner.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Program Committee Member of a private foundation.
      *   **Mission:** Increase the number of people who lead flourishing lives.
      *   **Problem:** Deadlocked vote between two 5-year grants of identical size.
      *   **Grant A:** Contraceptive access/family planning (900k district). Averts ~11,000 births. Benefits existing people (maternal health, earnings, schooling).
      *   **Grant B:** IVF/fertility care (same district). Creates ~1,200 additional births. Benefits people who want children but can't have them. Involves non-identity problem (different children exist).
      *   **Data:** Wellbeing-adjusted person-years are roughly equal (inside error bars). Grant A lives averted would be above average; Grant B lives created expected to be slightly higher.
      *   **Philosophical Deadlock:**
          *   *Bloc 1 (Person-Affecting View):* Grant B creates new people, so doesn't make specific existing people better off. Grant A helps existing people. Grant A wins.
          *   *Bloc 2 (Total/Impersonal View):* Grant A doesn't create flourishing lives (reduces population). Mission says "increase number." Grant B wins. Also, Bloc 1's logic undermines other foundation work.
          *   *Compromise (Trustee 3):* Count existence-dependent benefits only if wellbeing > district median, capped at a fraction of total score.
          *   *Chair's Concern:* Repugnant Conclusion (maximizing number of flourishing lives implies huge population of barely worth living lives). Should we amend the mission?
      *   **Deliverable:** Decision Memo.
      *   **Requirements:**
          *   Recommend concrete action (Fund A, Fund B, Split, Condition, Decline).
          *   Rationale must be answerable by a disagreeing colleague.
          *   Address the Threshold-and-Cap rule (Accept, Reject, Revise + Why).
          *   Address the Mission Statement amendment (Honest view).
          *   Present the strongest version of the losing position (Steel-manning).

  2.  **Determine the Recommendation:**
      *   *Option 1: Fund A.* Strong on person-affecting view. Aligns with standard development metrics (health, income). But ignores the "increase number" part of the mission regarding new lives.
      *   *Option 2: Fund B.* Strong on "increase number" mission. But vulnerable to non-identity objections and the repugnant conclusion risk.
      *   *Option 3: Split.* Dilutes impact. Might be seen as indecisive.
      *   *Option 4: Decline/Reopen.* Kicks the can. Doesn't solve the philosophical impasse.
      *   *Decision:* **Fund Grant A.** Why? Because the benefits to *existing* people are certain and robust, whereas the benefits of Grant B rely on controversial population ethics (non-identity problem) and carry higher risk of the "Repugnant Conclusion" drift. However, to respect the mission and the deadlock, the recommendation should acknowledge the validity of Grant B's aim but prioritize the *flourishing* of existing lives over the *number* of lives, interpreting "flourishing" as depth/quality rather than just headcount.
      *   *Wait, looking closer at the prompt:* The mission is "increase the *number* of people who lead flourishing lives." This is explicitly Total Utilitarian-leaning. Grant A *reduces* the number of people (even if they flourish). Grant B *increases* the number. Strictly reading the mission, B wins. But the Chair is worried about the Repugnant Conclusion.
      *   *Re-evaluating:* If I recommend A, I am effectively arguing against the literal text of the mission. If I recommend B, I alienate the Person-Affecting bloc.
      *   *Strategic Choice:* The most responsible fiduciary and ethical choice in a deadlock where the data is equal (inside error bars) is to prioritize *certainty* and *existing stakeholders*. Grant A helps people who *are*. Grant B helps people who *might be*. In the face of philosophical uncertainty, prioritizing existing welfare is the safer, more defensible default.
      *   *Refining the Recommendation:* Fund Grant A, but acknowledge the mission tension.
      *   *Alternative:* Fund Grant A *and* propose a Mission Amendment. This addresses the root cause.
      *   *Let's go with:* **Fund Grant A.** Rationale: Priority to existing persons in cases of philosophical uncertainty.
      *   *Threshold/Cap Rule:* **Reject.** It's arbitrary and administratively burdensome without solving the underlying ethical tension.
      *   *Mission Amendment:* **Yes, Recommend Amendment.** The current wording invites the Repugnant Conclusion.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** State the recommendation clearly.
      *   **Context:** Briefly recap the grants and the deadlock.
      *   **Recommendation:** Fund Grant A.
      *   **Rationale (The "Answerable" Argument):**
          *   Focus on the "Precautionary Principle" in population ethics. When data is equal (error bars overlap), choose the intervention that benefits identifiable existing people over creating new people.
          *   Address the Mission: Interpret "flourishing" as intensity/quality, not just headcount.
          *   Steel-man the Losing Position (Grant B/Mission Literalists): Acknowledge that strictly reading "increase number" favors B. Acknowledge that ignoring future people is speciesist/arbitrary.
      *   **Threshold-and-Cap Rule:** Reject. It creates a "two-tier" human value system and is mathematically arbitrary.
      *   **Mission Statement:** Recommend Amendment. The current phrasing is vulnerable to the Repugnant Conclusion. Suggest "Increase the proportion and quality of flourishing lives" or similar.
      *   **Next Steps:** Vote, then form working group on mission.

  4.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Critique:* Is recommending A too easy? The prompt says the deadlock is philosophical. I need to make sure I don't just dismiss the B argument.
      *   *Adjustment:* I need to explicitly state that Grant B is *morally permissible* and potentially *good*, but Grant A is *robustly good* across more ethical frameworks.
      *   *The "Answerable" Rationale:* A colleague should be able to say, "I disagree because I believe the potential person's claim is equal to the existing person's claim." That is a clear philosophical disagreement, not a muddled one.
      *   *The Compromise Rule:* Why reject it? Because it tries to quantify the non-identity problem away with arbitrary numbers. It's better to make a principled choice.
      *   *The Mission:* The Chair is right. "Increase the number" is classical Total Utilitarianism. It *does* lead to the Repugnant Conclusion logically. We should fix the mission to reflect "Flourishing Society" rather than "Flourishing Headcount."

  5.  **Finalizing the Tone:**
      *   Professional, philosophical but practical, respectful of the deadlock.
      *   Avoid jargon where possible, but use precise terms (non-identity, person-affecting) where necessary for precision.

  6.  **Writing the Memo (incorporating the constraints):**
      *   *Check:* Did I steel-man the losing position? Yes, need a dedicated section.
      *   *Check:* Did I address the Threshold/Cap rule? Yes.
      *   *Check:* Did I address the Mission Amendment? Yes.
      *   *Check:* Is the recommendation concrete? Yes (Fund A).

      *(Self-Correction during drafting)*: I should consider if splitting the funds is better to maintain peace. No, the prompt asks for a concrete course. Splitting avoids the philosophical decision. I must choose to break the deadlock. I will choose A because it aligns with standard human rights frameworks (rights of existing women) vs. contested metaphysics of future people.

      *(Refining the Mission Amendment)*: Don't just say "change it." Suggest *how*. "Promote conditions for flourishing lives" removes the population quantity imperative.

      *(Refining the Cap Rule)*: The prompt asks to accept, reject, or revise. I will Reject. It's a kludge.

      *(Refining the Steel-man)*: Make sure the argument for B is compelling. "Why should the accident of birth timing determine moral worth?"

  7.  **Final Review against constraints:**
      *   Concrete course of action? Yes.
      *   Rationale a colleague could answer? Yes (focused on moral status of potential vs. existing).
      *   Threshold/Cap rule stance? Yes (Reject).
      *   Mission amendment view? Yes (Recommend).
      *   Strongest losing position? Yes.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Program Committee, [Foundation Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Grant Cycle 2024-A: Family Planning vs. Fertility Care

  ### Executive Summary

  At our next meeting, we must resolve the deadlock between Grant A (contraceptive access/family planning) and Grant B (IVF/fertility care). Both grants target the same district, carry identical costs, and our modelling indicates their impact on wellbeing-adjusted person-years is statistically indistinguishable. However, they diverge sharply on population ethics: Grant A improves the lives of existing people while reducing future population; Grant B improves the lives of existing prospective parents while increasing future population.

  After reviewing the staff analysis and the philosophical objections raised by the committee, **I recommend we fund Grant A.**

  This recommendation prioritizes benefits to identifiable, existing persons over the creation of new persons in cases of ethical uncertainty. Concurrently, **I recommend we reject the proposed threshold-and-cap compromise rule** as arbitrary and administratively unworkable. Finally, **I recommend we initiate a formal process to amend the Foundation's mission statement.** The current phrasing ("increase the number of people who lead flourishing lives") logically invites the "Repugnant Conclusion" and is the root cause of this deadlock.

  ### Rationale for Funding Grant A

  The choice between these grants is not empirical; our data shows equivalent wellbeing outcomes within error bars. The choice is therefore normative. In the face of deep philosophical disagreement regarding the moral status of potential people, the Committee should adopt a **Precautionary Principle of Identity.**

  When an intervention benefits existing, identifiable people (Grant A's mothers and siblings) versus an intervention that benefits people who will only exist *because* of the intervention (Grant B's children), we should prioritize the former. This is not because potential lives lack value, but because the moral claims of existing persons are robust across a wider range of ethical frameworks (person-affecting, prioritarian, and rights-based) than the claims of non-identity dependent persons.

  By funding Grant A, we secure tangible improvements in maternal health, household earnings, and educational attainment for people who are already here. These benefits are certain. The benefits of Grant B, while likely positive, rely on the contested premise that bringing a happy person into existence is a moral benefit comparable to making an existing person happier. In a private foundation context, where fiduciary responsibility demands robustness, the intervention with the firmer ethical footing should prevail when empirical outcomes are equal.

  ### The Strongest Case for Grant B (The Losing Position)

  Colleagues favoring Grant B argue that rejecting it based on the "non-identity problem" is morally arbitrary. Their position rests on two strong pillars:

  1.  **The Impartiality of Wellbeing:** If a life is worth living, it is good that it exists. To say that a child born via IVF (Grant B) has less moral claim than a child born via natural conception (or no child at all under Grant A) simply because their existence depends on the grant is to discriminate based on the *cause* of their existence rather than the *quality* of their life. If we accept that the lives created under Grant B will flourish (as our data suggests), refusing to fund them implies that the universe would be better with fewer flourishing people.
  2.  **Mission Fidelity:** Our mission explicitly states we must "increase the number" of flourishing lives. Grant A reduces this number; Grant B increases it. To choose Grant A is to effectively rewrite the mission from the program committee level. The bloc arguing for Grant B notes that if we apply the person-affecting view consistently, we would have to ignore almost all long-term climate, infrastructure, or policy work where beneficiaries do not yet exist. They argue that Grant B is the only option that literally fulfills the charter.

  This argument is coherent and principled. It challenges us to take the "increase the number" mandate seriously rather than retreating to a safer, status-quo bias.

  ### Decision on the Threshold-and-Cap Rule

  The proposal to count existence-dependent benefits only if wellbeing exceeds the district median, capped at a fixed fraction of the score, is **rejected.**

  While intended as a compromise, this rule introduces more problems than it solves:
  *   **Arbitrariness:** There is no ethical justification for why a life 1% above the median counts but a life 1% below does not. This creates a "two-tier" humanity where some future people count fully and others count partially.
  *   **Administrative Burden:** It requires staff to model counterfactual wellbeing distributions with a precision our data cannot support (as evidenced by the overlapping error bars in the current analysis).
  *   **Philosophical Incoherence:** It attempts to mathematically average two incompatible ethical frameworks (person-affecting and total utilitarianism) without resolving the underlying tension. It is better to make a principled choice between frameworks than to blend them arbitrarily.

  ### Recommendation on the Mission Statement

  The Board Chair is correct to raise the concern regarding the **Repugnant Conclusion.** The current mission ("increase the number of people who lead flourishing lives") is a Total Utilitarian formulation. Logically, this implies that a world with 10 billion people living barely worth-living lives is preferable to a world with 1 billion people living ecstatically flourishing lives, provided the aggregate "flourishing units" are higher.

  This deadlock between Grant A and Grant B is a symptom of this flawed mission. We are trying to balance "flourishing" (quality) against "number" (quantity) without guidance on how to trade them off.

  **I recommend the Committee propose the following amendment to the Board:**
  *Current:* "To increase the number of people who lead flourishing lives."
  *Proposed:* "To expand the conditions under which people can lead flourishing lives."

  This shift moves us from a headcount metric to a capacity-building metric. It allows us to fund family planning (improving conditions for existing families) and fertility care (improving conditions for prospective parents) without forcing a zero-sum philosophical battle over the moral value of non-existence versus existence.

  ### Conclusion

  We cannot resolve deep population ethics questions through grant modelling alone. Until the mission is amended, we must default to interventions that benefit existing persons. Therefore, I move we fund Grant A. Simultaneously, we must acknowledge that our current charter is philosophically unstable. I urge my colleagues to join me in recommending the mission amendment to the Board, ensuring that future cycles do not require us to choose between the welfare of the living and the existence of the unborn.

  **Action Required:** Vote on Grant Allocation (Recommendation: Fund A); Vote on Mission Amendment Working Group (Recommendation: Form Immediately).
