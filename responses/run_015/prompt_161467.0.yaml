      *   *Best Recommendation:* Modify (4). It conflicts with the core Epiphenomenalist intuition in (1) when combined with (5).

      *   *Unstated Premise:* The Supervenience of the Mental on the Physical. If mental events don't supervene, (7) is easier. If they do, (7) threatens (1). I should note this.
      *   *Another Unstated Premise:* That "Informational" in (4) doesn't require causal *efficacy* of the source, only causal *connection*. But if Q is epiphenomenal, there is no causal connection *from Q*.

