answer: |-
  Here is the specification for a theory of natural kinds, derived from your four operational jobs (Induction, Intervention, Portability, Optimization).

  ### Part 1: The Desiderata

  A theory of natural kinds must evaluate candidate categories against the following criteria. Each is marked as **Non-Negotiable (NN)** if required to satisfy your four jobs, or **Camp Preference (CP)** if it reflects a specific metaphysical stance that may sacrifice one of the jobs for another virtue.

  **1. Projectibility (NN)**
  *   **Definition:** Membership in the category must license probabilistic predictions about unobserved properties of members.
  *   **Justification:** Required for Job 1 (Induction). Without this, the category is merely a label, not a tool for inference.
  *   **Constraint:** Must solve the "Grue" problem. A category is not projectible merely because it has projected *so far*; it must have a structural reason to project *henceforth*.

  **2. Causal/Homeostatic Unity (NN)**
  *   **Definition:** The properties clustering in the kind must be held together by a causal mechanism or a homeostatic property cluster (HPC), not merely by correlation.
  *   **Justification:** Required for Job 2 (Intervention). If the cluster is accidental, intervening on one property will not preserve the others. Causal depth explains *why* induction works.
  *   **Constraint:** Must distinguish between a common cause (elements) and a common effect (functional kinds).

  **3. Method-Independence (NN)**
  *   **Definition:** The category must be detectable and definable via multiple, distinct measurement procedures.
  *   **Justification:** Required for Job 2 (Intervention) and Job 3 (Portability). If a category vanishes when you change the instrument, it is an artifact of the instrument (e.g., a clustering algorithm's hyperparameters), not the world.
  *   **Constraint:** Rules out "features" that are defined solely by a specific probe or activation pattern in a specific model instance without external grounding.

  **4. Optimization-Stability (NN)**
  *   **Definition:** The statistical or causal regularities defining the kind must persist when the category is used as a target for selection or optimization.
  *   **Justification:** Required for Job 4 (Optimization). This is the Goodhart's Law constraint. If the regularity evaporates when you select for it, the category is a proxy, not a feature.
  *   **Constraint:** This is the hardest constraint. Most high-level categories fail this.

  **5. Grain-Honesty (NN)**
  *   **Definition:** The theory must specify the level of description at which the kind exists and not conflate fundamental properties with special-science generalizations.
  *   **Justification:** Required for Job 3 (Portability) and Job 4 (Optimization). Fundamental kinds and functional kinds break differently. Conflating them leads to category errors when the ontology shifts.
  *   **Constraint:** Prevents a theory from claiming "everything is natural" or "only physics is natural."

  **6. Portability across Ontology (NN)**
  *   **Definition:** The category must remain identifiable if the underlying descriptive vocabulary is replaced (e.g., from neurons to silicon, or from classical to quantum fields).
  *   **Justification:** Required for Job 3 (Re-identification). If the kind disappears when you upgrade your physics or substrate, it was tied to the implementation, not the function.
  *   **Constraint:** Demands a functional or structural definition rather than a purely material one for high-level kinds.

  **7. Intrinsicality (CP)**
  *   **Definition:** The properties defining the kind must belong to the object itself, not its relation to an observer or environment.
  *   **Camp:** Micro-essentialists.
  *   **Trade-off:** Excludes relational kinds like "weed," "pest," or "money." If you demand this (NN), you lose functional/social kinds. If you make it CP, you admit relational kinds but risk losing Mind-Independence.
  *   **Verdict:** **CP.** Your Job 4 (Optimization) often targets relational properties (e.g., "profitable").

  **8. Mind-Independence (CP)**
  *   **Definition:** The existence of the kind does not depend on human interests, concepts, or investigative tools.
  *   **Camp:** Realists / Micro-essentialists.
  *   **Trade-off:** Excludes "money," "psychiatric diagnosis," and "weed." These are real and license induction (Jobs 1 & 2) but depend on minds.
  *   **Verdict:** **CP.** For your work, distinguish *Physical Natural Kinds* (NN Mind-Independence) from *Functional Natural Kinds* (NN Stability, CP Mind-Independence).

  **9. Sparseness (CP)**
  *   **Definition:** Natural kinds must be few in number; arbitrary disjunctions are forbidden.
  *   **Camp:** Micro-essentialists / Compressionists.
  *   **Trade-off:** Conflicts with Multiple Realizability. If "pain" can be realized by infinite substrates, the disjunction of all pain-realizers is not sparse.
  *   **Verdict:** **CP.** Sparseness is a virtue of *fundamental* ontology, not necessarily special sciences.

  **10. Discoverability (CP)**
  *   **Definition:** A kind must be recoverable from finite noisy samples by standard clustering or statistical methods.
  *   **Camp:** Empiricists / ML Interpretability.
  *   **Trade-off:** A kind might be real but rare, or real but obscured by noise. Demanding discoverability confuses *epistemology* (how we find it) with *ontology* (what it is).
  *   **Verdict:** **CP.** This is a prejudice of your camp. A feature can be real even if your clustering algorithm misses it.

  **11. Tolerance of Multiple Realizability (CP)**
  *   **Definition:** A kind can be instantiated by heterogeneous underlying structures.
  *   **Camp:** Functionalists / Special Sciences.
  *   **Trade-off:** Conflicts with Sparseness and Micro-essentialism. If you demand this, you cannot demand microstructural uniformity.
  *   **Verdict:** **NN for High-Level Kinds, CP for Fundamental Kinds.** You need this for Job 3 (Portability).

  ---

  ### Part 2: Required Distinctions

  A viable theory must not collapse the following pairs. Collapsing them renders the theory useless for your four jobs.

  1.  **Natural vs. Merely Projectible:**
      *   *Case:* "Grue" is projectible until time *t*. "All coins in my pocket are copper" is projectible but accidental.
      *   *Requirement:* Projectibility is necessary but not sufficient. Causal Unity (Desideratum 2) is the differentiator.

  2.  **Natural vs. Useful-to-Us:**
      *   *Case:* "Things within reach" is useful but indexical. "Weed" is useful but interest-relative.
      *   *Requirement:* Usefulness licenses action, not necessarily induction across contexts (Job 1).

  3.  **Being a Kind vs. Degree of Naturalness:**
      *   *Case:* Chemical elements (highly natural) vs. Biological species (moderately natural) vs. Artifacts (low naturalness).
      *   *Requirement:* A binary "is/is not" verdict fails Grain-Honesty (Desideratum 5). The theory must output a *stability score*.

  4.  **Real Kind vs. Stable Pattern:**
      *   *Case:* The "Bermuda Triangle" might be a stable statistical pattern of disappearances without a unified causal kind.
      *   *Requirement:* Patterns can be real without being *kinds*. Kinds imply a bound on variation; patterns imply regularity. Job 2 (Intervention) distinguishes them.

  5.  **Kind vs. Individual:**
      *   *Case:* "The Sun" is an individual. "Star" is a kind.
      *   *Requirement:* Individuals are not projectible to other instances (there are no other instances). Your Job 1 requires kinds.

  ---

  ### Part 3: Empirical Constraints

  The theory is falsified if it contradicts these established findings:

  1.  **Species are Lineages:** Species are defined by historical continuity, not microstructural uniformity. A theory demanding micro-essentialism fails biology.
  2.  **Indispensable Predicates are Multiply Realized:** "Computation," "Gene," and "Depression" do not map 1:1 to physical states. A theory demanding Intrinsicality fails cognitive science.
  3.  **Equally Good Partitionings:** The same domain (e.g., color space, or latent space) can be carved by different variables (wavelength vs. hue) that predict equally well for different tasks. Monism fails here.
  4.  **Level-Specific Unity:** A category may be unified at the functional level (heart) but heterogeneous at the cellular level. A theory that demands uniformity at *all* grains fails.

  ---

  ### Part 4: The Impossibility Result

  You asked for the subset of desiderata that is jointly unsatisfiable. **There is no single theory of "Natural Kind" that satisfies all four Jobs for all candidate categories.** The constraints form a "Trilemma of Stability."

  **The Trilemma:**
  You cannot simultaneously maximize **Portability (Job 3)**, **Optimization-Stability (Job 4)**, and **Causal Unity (Job 2)** for high-level categories.

  1.  **Tension A: Optimization-Stability vs. High-Level Causal Unity.**
      *   *Argument:* High-level kinds (Cancer, Intelligence, Money) are defined by their causal role or effect (Job 2). When you optimize for membership (Job 4), the system adapts to satisfy the definition without satisfying the underlying causal role (Goodhart's Law).
      *   *Result:* If you demand Optimization-Stability (NN), you must exclude most Special Science kinds (Cancer, Intelligence). They are *not* stable under optimization.
      *   *Verdict:* **Optimization-Stability is the single requirement that excludes the largest share of otherwise-attractive candidates.** It restricts "Natural Kinds" largely to fundamental physics and chemistry, where the laws don't change when you select for them.

  2.  **Tension B: Portability vs. Intrinsicality.**
      *   *Argument:* To survive an ontology change (Job 3), a kind must be defined functionally (Multiple Realizability). To be Intrinsic (CP), it must be defined by its local physical structure.
      *   *Result:* You cannot have a kind that is both Micro-Essentially Defined *and* Portable across substrates.
      *   *Verdict:* You must choose: Physical Kinds (Intrinsic, Low Portability) or Functional Kinds (Portable, Extrinsic).

  3.  **Tension C: Method-Independence vs. Discoverability.**
      *   *Argument:* If a kind is truly Method-Independent (NN), it implies an abstraction that may be impossible to recover from finite noisy samples using any single clustering method (Discoverability CP).
      *   *Result:* Requiring robust Discoverability often forces you to accept Method-Dependent artifacts (e.g., features that only appear with L1 regularization).
      *   *Verdict:* Discoverability must be demoted to a heuristic, not a criterion.

  **The Proof of Failure:**
  If you construct a theory that demands **Optimization-Stability (NN)** + **Multiple Realizability (NN)** + **Causal Unity (NN)**:
  *   Take "Intelligence."
  *   It is Multiply Realized (NN).
  *   It has Causal Unity (predicts outcomes) (NN).
  *   Is it Optimization-Stable? No. Once selected for, the metric decouples from the trait (Goodhart).
  *   *Verdict:* The theory declares Intelligence is not a Natural Kind.
  *   *Take "Water."*
  *   It is Optimization-Stable (NN).
  *   It has Causal Unity (NN).
  *   Is it Multiply Realized? No. It is H2O.
  *   *Verdict:* The theory declares Water is a Natural Kind.
  *   *Conclusion:* A theory satisfying these constraints admits Physics but rejects Special Sciences. If you want Special Sciences, you must relax Optimization-Stability.

  ---

  ### Part 5: Test Case Adjudication

  Applying the Desiderata (specifically the NN constraints) to your cases.

  | Case | Projectible | Causal Unity | Method-Indep | Opt-Stable | Portable | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Water** | Yes | Yes (H2O) | Yes | Yes | Low (tied to chem) | **Physical Kind** |
  | **Jade** | Yes | No (Jadeite/Nephrite) | Yes | Yes | Low | **Disjunctive Kind** (Fails Unity) |
  | **Elements** | Yes | Yes (Proton count) | Yes | Yes | Low | **Physical Kind** |
  | **Species** | Yes | Yes (Lineage) | Yes | No (Evolves) | Med | **Historical Kind** (Fails Opt-Stability) |
  | **Cancer** | Yes | Yes (Dysregulation) | Yes | No (Evolves resistance) | Med | **Functional Kind** (Fails Opt-Stability) |
  | **Psych Dx** | Low | Low (Heterogeneous) | Low | No | High | **Pragmatic Kind** (Fails Unity/Stability) |
  | **Intelligence** | Yes | Low (g-factor?) | Low | No | High | **Statistical Kind** (Fails Opt-Stability) |
  | **Money** | Yes | Yes (Institutional) | Yes | No (Inflation/Debasement) | High | **Institutional Kind** (Fails Mind-Indep) |
  | **Weed** | No | No (Relational) | Yes | No | High | **Indexical Kind** (Fails Intrinsicality) |
  | **Sand** | Yes | Yes (Grain size) | Yes | Yes | High | **Aggregate Kind** |
  | **Latent Direction**| ? | ? | No (Model specific) | No (Adversarial) | Low | **Artifact** (Fails Method-Indep/Opt) |
  | **Consciousness** | ? | ? | No | ? | ? | **Unknown** (Fails Method-Indep) |

  **Analysis of Key Cases:**
  *   **Jade:** Fails *Causal Unity*. It is two distinct minerals. A theory that calls Jade a Natural Kind is false. It licenses induction only by accident of co-occurrence in crustal processes.
  *   **Latent Direction:** Fails *Method-Independence* and *Optimization-Stability*. A direction in a specific model's latent space is often an artifact of that model's initialization or training run. If you retrain or optimize the model to maximize that direction, the semantics often break (adversarial examples). It is likely an *artifact*, not a feature of the world.
  *   **Cancer:** Fails *Optimization-Stability*. If you select for "survivors of cancer," the biology of cancer changes (resistance). It is a real kind, but fragile.
  *   **Weed:** Fails *Intrinsicality*. It is defined by human interest. It is a real category for agriculture, but not a "feature of the world" in the physical sense.

  ---

  ### Part 6: Conclusion for the Interpretability Practitioner

  You are looking for a criterion to separate **Features of the World** from **Artifacts of the System**.

  1.  **The Filter:** Use **Method-Independence** and **Optimization-Stability** as your primary filters.
      *   If a feature vanishes when you change the probing method, it is an **Artifact**.
      *   If a feature vanishes when you optimize the model for it, it is a **Proxy**.
  2.  **The Compromise:** You must accept that **Special Science Kinds** (like "syntax" or "reasoning circuits") will fail Optimization-Stability. They are real, but fragile. You are entitled to write them down, but you must label them as **Functional Kinds**, not Physical Kinds.
  3.  **The Negative Verdict:** You are entitled to reject **Latent Directions** that are not Method-Independent. If a direction only exists in one seed or one pruning configuration, it is not a feature of the world; it is a feature of that training run.

  **The Single Most Exclusionary Requirement:** **Optimization-Stability.**
  If you enforce this strictly, you will discard almost all high-level interpretability features (circuits, concepts) because neural networks are adaptive systems subject to Goodhart's Law. If you wish to keep them, you must downgrade Optimization-Stability to a "Degree of Robustness" rather than a binary requirement.

  ### Appendix: Camp Scorecard

  | Camp | Projectibility | Causal Unity | Method-Indep | Opt-Stability | Portability | Verdict on Your Jobs |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Micro-Essentialism** | Yes | Yes (Micro) | Yes | Yes | No | Fails Job 3 (Portability). Kills Special Sciences. |
  | **Homeostatic Cluster** | Yes | Yes (HPC) | Yes | No | Yes | Fails Job 4 (Optimization). Good for Biology/Psych. |
  | **Real-Pattern / Compression** | Yes | No (Correlation) | CP | CP | CP | Fails Job 2 (Intervention). Risks artifacts. |
  | **Pragmatic / Pluralist** | Yes | CP | CP | CP | Yes | Fails Job 1 (Induction stability). Too permissive. |
  | **Functionalism** | Yes | Yes (Role) | Yes | No | Yes | Fails Job 4 (Optimization). Best for Job 3. |

  **Recommendation:** Adopt a **Two-Tier Theory**.
  *   **Tier 1 (Physical Kinds):** Demands Micro-Unity + Opt-Stability. (Use for hardware/weights).
  *   **Tier 2 (Functional Kinds):** Demands Causal Role + Portability. Relaxes Opt-Stability. (Use for circuits/concepts).
  *   **Reject:** Anything that fails Method-Independence.
