      *   Aristotle distinguishes between necessary truths (past/present/universal) and contingent future events.
      *   For future contingents, he argues that neither the affirmative nor the negative is *determinately* true yet, though the disjunction is true.
      *   He accepts the Law of Excluded Middle ($p \lor \neg p$ is true) but rejects the Law of Bivalence (every proposition is either true or false) for future contingents.
      *   So, $p$ is not true (yet), $\neg p$ is not true (yet), but $p \lor \neg p$ is true.

