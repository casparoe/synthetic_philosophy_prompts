prompt: |-
  I'm taking a philosophy of mind module and we're on Parfit's teletransporter and what actually matters in survival. I need to compare Parfit's reductionist view — that psychological continuity is sufficient regardless of cause — with Bernard Williams's claim that identity requires spatio-temporal continuity and can't survive being copied. My tutor added this weird niche scenario: what if the replacement is gradualy done, like one percent of neurons swapped for synthetic ones each year, with the biological body still alive alongside, over fifty years? Does that continuous version favour Williams, since there's never a discrete moment where 'you' vanish, or does Parfit still win because psychological continuity is maintained smoothly? Compare the two specifcally on this gradual-replacement case — which handles the lack of a sharp break better, and why our usual intuition about a sudden 'jump' collapses here. Don't explain both from scratch; just compare them on this edge case. (Sorry, my notes have a typo — I wrote 'teletransporter' but meant the slow version lol.)
