answer: |-
  **Activity: The Sealed Hand**

  **Materials:** 18 envelopes. Inside each: 5 cards. 1 "Peak" (e.g., "You achieve your dream"), 2 "Neutral" (e.g., "Tuesday commute," "Waiting in line"), 2 "Crush" (e.g., "Public humiliation," "Grief over pet"). Pre-printed.

  **Timeline (75 mins)**

  *   **0–10:** Distribute envelopes. Students read cards silently. No talking.
  *   **10–25 (The Edit Trap):** Tell them: "You may improve your life." Allow 5 minutes to trade cards with neighbors. Then stop them. Reveal **Rule 1:** "Causality Lock." The sequence is fixed. Swapping breaks the chain. You must keep your original hand. *Watch the frustration.*
  *   **25–45 (The Offer):** Read the Demon Script (your prompt, anonymized). "This exact hand repeats infinitely. No edits." Students vote privately: **Sign** (accept loop) or **Burn** (reject loop).
  *   **45–60 (Small Groups):** Compare votes. Prompt: "If you voted Sign, was it because you love the hand, or because you can survive it?"
  *   **60–75 (Debrief):** Reveal the thinker and concept.

  **Debrief Mapping**

  1.  **Endurance vs. Affirmation:** Call on a "Sign" voter who looked hesitant. Ask: "Did you sign because you *wanted* the humiliation card forever, or because you're tough enough to *bear* it?" Highlight the gap. The text wants joy, not grit. If they're just grinding, they missed the point.
  2.  **Load-Bearing Parts:** Ask those who tried to trade away the "Crush" cards in Phase 1. Ask: "Does the 'Peak' card exist without the 'Crush' card?" If the humiliation taught the lesson that led to the dream, removing the pain deletes the peak. They discover they can't edit the loop without deleting themselves.

  **Predictable Failure Points**

  1.  **The "Carpe Diem" Checkout:** 2–3 students will say, "I'd just live every moment well, so it doesn't matter." They treat it as mindfulness. *Counter:* Ask, "Does living it well change the fact that the humiliation *must* happen again? Are you willing the humiliation, or just tolerating it?"
  2.  **Gamifying the Trade:** During Phase 1, they might treat cards like poker hands. Interrupt if they start valuing "rarity." Remind them these are *life moments*, not points.

  **Limitation You Must Voice**

  The activity cannot simulate **weariness**. 75 minutes of thinking about repetition is easy; actual infinity is crushing. You have to verbally supply the weight of "forever." Tell them: "You felt boredom during the game. Imagine that boredom never ends. That is the pressure the thought exerts."

  **Veteran Note:** Don't save them from the discomfort in Phase 2 when you enforce Rule 1. Their annoyance is the data. If they don't feel trapped, the philosophy won't land.
