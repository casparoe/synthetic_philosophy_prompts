      *   **Culturalist (Goldhagen):** Focus on German specificities, "eliminationist antisemitism" as a cognitive model. Men were "willing executioners" because of a shared cultural worldview. Situation matters less than the pre-existing disposition.

  3.  **Drafting Section 1: Agreed Claims:**
