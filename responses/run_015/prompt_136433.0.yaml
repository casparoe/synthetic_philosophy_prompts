      *   *Facts:* Battalion 101 existed, killed ~38,000 Jews, Józefów happened, Trapp offered opt-out, few opted out.
      *   *Behavioral Range:* Not everyone was identical. Some refused, some complied reluctantly, some volunteered/enthusiastic.
      *   *Concessions:*
          *   Culturalist admits: Situation exerts pressure; not *every* German killed; some men resisted.
          *   Situationalist admits: Antisemitism was present; it wasn't neutral; it likely lowered the barrier to action.
      *   *Explanation Criteria:* Must account for the opt-out rate, the escalation over time, and the specific targeting of Jews.

  4.  **Drafting Section 2: Disagreements Table:**
