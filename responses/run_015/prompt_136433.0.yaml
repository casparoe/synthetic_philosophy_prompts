          *   Small margin implies coercion/obedience dominates. Large margin implies ideological drive.
      *   *Variance Signature:* Correlates of behavior within the unit.
          *   Situationalist predicts correlation with unit integration/time in theater (socialization).
          *   Culturalist predicts correlation with pre-war political socialization (NSDAP membership, etc.).
