      *   *Refining the "Three Roles":* Make sure the distinction between Framing and Motive is clear. Framing makes the act *possible* to conceive; Motive makes it *desirable*.

  8.  **Final Polish:** Check formatting (numbered sections, table structure). Ensure the voice sounds like a joint statement produced after a workshop. (e.g., "We, the undersigned...")

  *(Self-Correction during drafting)*: I need to make sure I don't just summarize the books but create the *document* requested. It needs to look like a working paper from a seminar where they tried to find common ground.

