  4. "Where the list eats itself"
  Here is where the Commission breaks. The primary fracture is between **Intent Sensitivity** and **Epistemic Neutrality**. To weigh intent, you need records of state of mind. The Long Allotment has no records of intent, only outcomes. If you prioritise intent, the language claimants win everything, and the starvation claimants get nothing because negligence is harder to prove without ledgers. If you prioritise neutrality, you ignore the malice behind the caning, reducing it to mere 'harm'. This creates a moral hazard: the State is rewarded for being bureaucratically opaque about its malice.

  The second fracture is **Commensurability** versus **Dignity**. To allocate a single pot, you must decide how many dead speakers equal one dead starver. Any number chosen will look obscene. If you say language is priceless, you cannot pay them from a finite fund. If you put a price on it, you insult the survivors. The Commission must choose between being useful and being respectful. It cannot be both.

  The single requirement that excludes the most methods is **Aggregation Stability**. Most bureaucratic methods rely on summing individual incidents. But the Long Allotment proves that individual incidents are unknowable. Any method requiring a count of specific acts fails immediately. The Commission will likely freeze trying to decide whether to punish the system or the clerks, realising that punishing the system requires ignoring the clerks, who are also the claimants. This paradox stops the calculation cold. The method demands a level of granularity the evidence cannot support, forcing the Commission to either guess or admit defeat.

  5. "Scorecard"
  **Total-Harm:** Counts bodies and losses purely by volume. *Verdict:* Fails the Ledger Problem; rewards better archivists. Ignores intent, treating the language suppression as equal to accidental starvation if the numbers match. It is cold but calculable.
  **Culpability-and-Intent:** Ranks based on malice and state of mind. *Verdict:* Fails Epistemic Neutrality; requires evidence the State destroyed. Favours the language claimants over the starved. It satisfies moral intuition but collapses under the weight of missing evidence.
  **Incommensurability:** Refuses to rank different harms against each other. *Verdict:* Honest, but fails the task. The money must be spent. Leads to arbitrary division or political deadlock. It preserves dignity but abandons the mandate.
  **Let-the-Claimants-Bargain:** Political negotiation between groups. *Verdict:* Rewards power and noise, not harm. The Long Allotment descendants, being poorer and less organised, lose out to louder groups. It solves the allocation but betrays the justice. Each method solves one requirement by violating another. The Commission will likely try to hybridise these, which introduces new contradictions.
