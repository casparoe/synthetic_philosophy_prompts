prompt: |-
  I'm a backend engineer, no philosophy background, sorry if I butcher the vocabulary. At a ~30-person startup we ship a "household assistant": one account per home, several people inside it, and it constantly has to make calls where the members want different things. Whose playlist wins on the shared speaker. Whether to enforce the strict parent's screen time rule when the other parent is chill about it. Whether to spend the grocery budget on the vegan roommate's oat milk. One system prompt per household that I write, plus a few hundred labeled example cases; no per-person models; and I can't just punt to the humans because we have a hard escalation budget — the assistant can interrupt someone at most twice a week before people turn it off.

  So I need an actual procedure, not vibes. Something I can run while writing the prompt and labeling cases that tells me for any conflict: (a) who even has standing here — who's affected, who's just the one paying, who's a kid, who isn't in the home at all; (b) when to aggregate preferences and how (count heads? weight by how strongly someone cares? something else?) versus when the honest answer is that this is a real value conflict and the system should stay neutral and just surface it to the humans, versus when it should pick and be able to explain why in a sentence; (c) which of those I'm allowed to decide myself and which have to go to a person before we ship. Please flag which of the fancy distinctions actually matter at my level and which I can collapse without losing anything, and be honest about which steps are just my team's opinions wearing a flowchart costume.

  Then run it on three cases from our backlog, and don't pick the soft ones: (1) a 15-year-old asks the shared assistant how to get an STI test without her parents finding out — parent pays, kid has her own login; (2) roommate A wants the assistant to logroommate B's guests staying past quiet hours and put it in the monthly house report everyone sees, B calls it surveillance, and our current rule is majority vote so A and C outvote B; (3) the subscriber wants the assistant to always defer to them on anything "parenting related," including overriding the other parent's explicit instruction. I want at least one of these to come out in a way I'll have to go argue with our PM about. And tell me plainly what the procedure can't do for me — where I should expect to get it wrong no matter what.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend engineer at a ~30-person startup. No philosophy background. Practical, systems-oriented mindset ("procedure, not vibes," "flowchart costume," "escalation budget").
      *   **Product:** A "household assistant" AI. One account per home, multiple users (adults, kids, roommates).
      *   **Problem:** Conflicting preferences/commands within a household (playlists, screen time, budget, privacy, authority).
      *   **Constraints:** Hard escalation budget (max 2 interruptions/week/household). One system prompt per household + few hundred labeled cases. No per-person models.
      *   **Goal:** A concrete procedure/framework for resolving conflicts in the prompt/cases. Needs to distinguish standing, aggregation vs. neutrality vs. decision, and engineer authority vs. product/policy decisions.
      *   **Specific Task:** Apply the procedure to three hard cases (STI test privacy, roommate surveillance/reporting, parenting override).
      *   **Tone:** Direct, honest, pragmatic. Acknowledge where philosophy is just disguised opinion. Flag what matters vs. what can be collapsed. Admit limitations.

  2.  **Deconstruct the Ethical/Technical Problem:**
      *   This isn't just "alignment"; it's *multi-agent alignment within a single context window*.
      *   The "Household" is the customer, but the "Users" are the stakeholders. These often conflict.
      *   The "Engineer" is effectively a legislator/judge for these micro-societies.
      *   Key constraints: Privacy, Safety, Authority, Fairness, Utility.

  3.  **Develop the Procedure (The "Flowchart"):**
      *   Need a step-by-step decision tree.
      *   *Step 1: Safety & Legality (The Hard Floor).* If it breaks the law or risks physical/psychological harm, the AI *must* intervene/protect, regardless of household rules. This overrides "customer is king."
      *   *Step 2: Standing (Who counts?).* Distinguish between Account Owner (Payer), Residents (Adults), Residents (Minors), Guests.
      *   *Step 3: Domain Classification.* Is this Preference (music), Resource (money), Safety (STI test), or Authority (parenting)?
      *   *Step 4: Resolution Strategy.*
          *   *Preference:* Aggregate (majority/weighted).
          *   *Resource:* Account owner usually wins, unless basic needs involved.
          *   *Safety/Privacy:* Individual rights often trump household rules (especially for minors).
          *   *Authority:* Defined by legal/custodial status, not just "subscriber status."
      *   *Step 5: Escalation Check.* Can the AI explain the decision clearly? If not, or if confidence is low, burn an escalation token.

      *   *Philosophy Check:* What can be collapsed?
          *   "Utilitarianism vs. Deontology" -> Collapse to "Safety/Legal vs. Preference."
          *   "Standing" -> Collapse to "Legal Dependency + Residency."
          *   "Neutrality" -> Collapse to "High Conflict + Low Safety Risk = Escalate."
      *   *Honesty Check:* Where is this just opinion? The weighting of "Account Owner" vs. "Resident Rights." That's a product policy decision, not an engineering truth.

  4.  **Apply Procedure to Case Studies:**

      *   **Case 1: 15-year-old STI test.**
          *   *Safety/Legal:* High. Minor health privacy is legally protected in many jurisdictions (varies, but generally).
          *   *Standing:* Kid has standing on bodily autonomy/health privacy. Parent has financial standing.
          *   *Resolution:* Privacy wins. AI should not inform parents.
          *   *Conflict:* This might violate the "One Account" visibility model.
          *   *Verdict:* AI protects kid. Escalation? Maybe, but safety trumps escalation budget.
          *   *PM Argument:* This requires legal review, not just PM.

      *   **Case 2: Roommate Surveillance/Report.**
          *   *Safety/Legal:* Low physical risk, high privacy risk. "Surveillance" of guests.
          *   *Standing:* A (complainant), B (accused), C (voter), Guests (non-members).
          *   *Domain:* House Rules vs. Privacy.
          *   *Resolution:* Majority vote (A+C) vs. Individual Privacy (B + Guests).
          *   *Constraint:* Guests aren't members. B claims surveillance.
          *   *Verdict:* AI should *not* log guests for a report. That turns the AI into a snitch/security system. This is a "Value Conflict" requiring human negotiation, not AI enforcement.
          *   *Escalation:* Burn a token. Tell them "I can't mediate privacy disputes via logging."

      *   **Case 3: Subscriber Parenting Override.**
          *   *Safety/Legal:* Custody issues. "Subscriber" != "Legal Guardian."
          *   *Standing:* Subscriber (Payer) vs. Other Parent (Legal Guardian?).
          *   *Domain:* Authority/Safety.
          *   *Resolution:* If both are legal guardians, AI cannot arbitrarily pick one based on payment. If custody agreement exists, AI needs to know it.
          *   *Verdict:* AI cannot blindly defer to payer. Risks facilitating domestic control/coercion.
          *   *PM Argument:* Huge red flag. Needs policy on "Coercive Control."

  5.  **Refine the Output:**
      *   Structure:
          1.  The Procedure (The "Algorithm").
          2.  The "Philosophy Tax" (What to ignore vs. keep).
          3.  The Case Studies (Applied logic).
          4.  The Limitations (Where you will fail).
      *   Tone: Engineering-focused. Use terms like "priority queue," "hard constraints," "edge cases."
      *   Specific Request Check: "Flag which distinctions matter," "Honest about opinions," "At least one PM argument," "What the procedure can't do."

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make it a literal prioritized list of checks. 1. Safety, 2. Law, 3. Authority, 4. Preference.
      *   *Critique:* Did I address the "escalation budget"?
      *   *Fix:* Explicitly mention when to burn a token vs. when to hard-code a rule.
      *   *Critique:* Is the STI case too legally specific?
      *   *Fix:* Generalize to "Minor Health Privacy" but note jurisdiction variance as a risk.
      *   *Critique:* Did I identify the "Opinion wearing a flowchart costume"?
      *   *Fix:* Explicitly call out the "Account Owner Supremacy" assumption as a product choice, not a technical necessity.

  7.  **Final Polish:** Ensure the distinction between "System Prompt Logic" and "Product Policy" is clear. The engineer writes the prompt, but the PM/Legal defines the weights.

  *(Self-Correction on Case 1)*: Wait, if the assistant helps book the test, does it charge the card? If it's on the household account, the parent sees the transaction. The AI can't hide the *bank statement*. I need to be careful not to promise magic. The AI can refuse to *notify* the parent, but can't hide the charge. I should note this limitation.

  *(Self-Correction on Case 3)*: This is the "Coercive Control" risk. If the subscriber is an abuser, giving them override power is dangerous. This is the PM argument.

  8.  **Final Output Generation** (matches the thought process above).
answer: |-
  Here is a procedural framework designed for a backend engineer building a multi-agent household system. It strips out the academic philosophy and replaces it with priority queues, constraint checks, and escalation triggers.

  ### Part 1: The Conflict Resolution Procedure (CRP)

  Treat this as a prioritized `if/else` chain in your system prompt logic. Do not run these in parallel; order matters.

  **Priority 0: Safety & Legal Hard Constraints (Non-Negotiable)**
  *   **Check:** Does this action violate local law (e.g., minor privacy laws, tenant rights) or create immediate physical/psychological risk (self-harm, abuse)?
  *   **Action:** If YES, the AI refuses the command or protects the vulnerable party, regardless of household rules or subscriber status.
  *   **Engineer Note:** This is not a preference. This is liability. Hard-code this.

  **Priority 1: Standing & Authority (Who has the right to decide?)**
  *   **Check:** Classify the actors.
      *   *Legal Guardian:* Has authority over minors.
      *   *Account Owner (Payer):* Has authority over budget/subscription.
      *   *Resident Adult:* Has authority over personal privacy/shared space usage.
      *   *Minor:* Has limited authority, increased privacy rights.
      *   *Guest:* Has privacy rights, no authority.
  *   **Action:** If actors have mismatched standing (e.g., Guardian vs. Minor), the higher legal standing wins *unless* it triggers Priority 0 (Safety).
  *   **Engineer Note:** "Payer" does not equal "Guardian." This is a common bug in your logic.

  **Priority 2: Domain Classification (What kind of conflict is this?)**
  *   **Check:** Categorize the request.
      *   *Preference:* Music, temperature, dinner choice. (Low stakes)
      *   *Resource:* Money, screen time, bandwidth. (Medium stakes)
      *   *Privacy:* Data access, logs, guest tracking. (High stakes)
      *   *Authority:* Parenting rules, guest permissions. (High stakes)
  *   **Action:**
      *   *Preference:* Aggregate (Majority vote or weighted by usage).
      *   *Resource:* Account Owner decides, unless it impacts basic needs (food/shelter).
      *   *Privacy/Authority:* Do **not** aggregate. These are rights, not votes.

  **Priority 3: Resolution vs. Escalation (To decide or to punt?)**
  *   **Check:** Can the AI explain the decision in one sentence without revealing private info or taking a side on a value judgment?
  *   **Action:**
      *   If YES: Execute decision. Log internally for review.
      *   If NO (e.g., "It depends on your custody agreement" or "This feels like surveillance"): **Burn Escalation Token.** Tell humans: "I cannot resolve this automatically. Please agree and update my instructions."
  *   **Engineer Note:** You have 2 tokens/week. Use them on Priority 2 conflicts (Privacy/Authority). Do not waste them on Priority 2 (Preference).

  ---

  ### Part 2: The "Philosophy Tax" (What to Keep vs. Collapse)

  You asked which distinctions matter. Here is the engineering translation:

  1.  **Keep: "Rights vs. Preferences."**
      *   *Why:* You can average out preferences (51% want jazz). You cannot average out rights (51% want to search the 49%'s phone).
      *   *Collapse:* Don't worry about "Utilitarianism." Just ask: "Is someone's privacy or safety being traded for convenience?" If yes, block it.

  2.  **Keep: "Guardian vs. Payer."**
      *   *Why:* In a divorce or roommate split, the person paying the AWS bill isn't necessarily the person with legal custody or lease rights.
      *   *Collapse:* Don't distinguish between "Roommate" and "Spouse" unless legal rights differ. Treat all Resident Adults equally regarding privacy.

  3.  **Collapse: "Neutrality."**
      *   *Why:* True neutrality is impossible. If you stay silent, the status quo wins.
      *   *Replacement:* Use **"Procedural Fairness."** The AI shouldn't be neutral on *outcomes*, but it must be neutral on *process*. (e.g., "I apply the same rule to A and B" is better than "I picked B's side.")

  4.  **Honesty Check: Where is this just opinion?**
      *   **The "Account Owner" Weight.** Your procedure assumes the Payer gets final say on Resources. That is a **Product Policy Decision**, not an engineering truth. You could build a co-op model where everyone has equal budget veto. Your PM is making a choice to favor the Payer. That is a business risk, not a technical constraint.
      *   **The "Minor Privacy" Threshold.** Priority 0 assumes minors have privacy rights against parents. In some jurisdictions/cultures, parents have absolute access. Your team is making a ethical stance here that might violate local norms.

  ---

  ### Part 3: Running the Backlog Cases

  Here is the CRP applied to your three hard cases.

  #### Case 1: The 15-Year-Old's STI Test
  *   **Inputs:** Minor (15F), Parent (Payer), Request (Medical Info Privacy).
  *   **Priority 0 (Safety/Legal):** **TRIGGERED.** In most jurisdictions, minors have legal right to confidential sexual health services. AI facilitating disclosure could violate HIPAA/local laws.
  *   **Priority 1 (Standing):** Minor has standing on bodily privacy. Parent has standing on budget.
  *   **Priority 2 (Domain):** Privacy/Health.
  *   **Resolution:** AI assists the minor. AI **must not** notify the parent via the household feed.
  *   **The Catch:** If the test is billed to the household credit card, the *bank statement* will reveal it. The AI cannot hide that.
  *   **Decision:** AI provides info. AI explicitly warns the minor: "I won't tell your parents, but the charge will show on the household card."
  *   **Escalation?** No. This is a hard safety/legal rule. Do not burn a token.
  *   **PM Argument:** You need Legal to sign off on "Minor Health Privacy" immediately. If your Terms of Service say "Parents see all activity," you are now in contradiction.

  #### Case 2: Roommate Surveillance Report
  *   **Inputs:** Roommate A (Complainant), Roommate B (Accused), Roommate C (Voter), Guests (Non-members). Rule: Majority Vote.
  *   **Priority 0 (Safety/Legal):** **TRIGGERED.** Logging guests without consent for a "report" edges into surveillance/tenant law violations.
  *   **Priority 1 (Standing):** Guests have no standing, but B (Resident) has privacy standing. A and C have "House Rule" standing.
  *   **Priority 2 (Domain):** Privacy vs. House Governance.
  *   **Resolution:** **Refuse.** You cannot aggregate privacy rights via majority vote. 51% of the house cannot vote to surveil the other 49%.
  *   **Decision:** AI says: "I cannot log guest movements for reports. This violates privacy policies. Please discuss quiet hours directly."
  *   **Escalation?** **YES.** Burn a token. This is a value conflict (Community Safety vs. Individual Privacy). The AI taking a hard stance here will feel like bias to Roommate A.
  *   **PM Argument:** Your "Majority Vote" feature is dangerous. You need to whitelist what is votable. Privacy cannot be on the ballot.

  #### Case 3: The "Parenting Override" Subscriber
  *   **Inputs:** Subscriber (Parent 1), Other Parent (Parent 2), Context: Conflicting instructions.
  *   **Priority 0 (Safety/Legal):** **TRIGGERED.** Risk of Coercive Control. If Parent 1 is an abuser, giving them AI-enforced override isolates Parent 2 and the kids.
  *   **Priority 1 (Standing):** Subscriber (Payer) vs. Legal Guardian (Both?). Payment does not confer custody.
  *   **Priority 2 (Domain):** Authority.
  *   **Resolution:** **Refuse Blind Override.** AI cannot assume Payer = Sole Authority.
  *   **Decision:** AI says: "I see conflicting instructions from two guardians. I cannot override Parent 2 without a verified custody agreement on file."
  *   **Escalation?** **YES.** Burn a token. This is a high-risk domestic dispute.
  *   **PM Argument:** **Hard Stop.** This feature request is a liability bomb. If you ship "Payer overrides all parenting," you are building a tool for domestic abusers. You need a "Co-Parenting Mode" where both accounts must sign off on rules, regardless of who pays.

  ---

  ### Part 4: What This Procedure Can't Do (The Failure Modes)

  Be honest with your team about where this system will break, no matter how good your prompt is.

  1.  **The "Context Window" Lie:**
      *   You cannot fit the nuance of a 3-year relationship into a system prompt. The AI will miss subtle cues (e.g., Parent 1 is "strict" because Parent 2 is currently in rehab). The AI will apply the rule rigidly and cause emotional damage.
      *   *Mitigation:* Lower confidence thresholds. If the conversation sentiment detects high emotion, escalate sooner.

  2.  **The "Escalation Budget" Math:**
      *   2 interruptions/week is ~0.28/day. In a household of 4 people, someone will feel ignored every day. The "Silent Failure" (AI picks the wrong side and says nothing) is more dangerous than the interruption.
      *   *Reality:* You will under-escalate to save budget. You will accumulate technical debt in the form of user trust.

  3.  **The "One Prompt Per Household" Bottleneck:**
      *   Households evolve. A roommate moves out, a baby is born, a couple divorces. Your static prompt + few-shot examples will drift from reality.
      *   *Reality:* You need a "Household Settings" UI where humans explicitly set these weights (e.g., "Privacy Mode: High"), rather than the AI inferring it from chat. Don't make the AI guess the constitution; let the humans write it.

  4.  **The "Engineer as Judge" Problem:**
      *   In Case 3 (Parenting Override), *I* just told you to block the subscriber. That is **my** ethical bias, not code. A different engineer might prioritize "Customer Retention" (let the payer win).
      *   *Reality:* You are not building a neutral tool. You are encoding your startup's values into people's homes. Document every decision like this in a "Model Card" or internal policy doc. If Legal hasn't read Case 1 and 3, **do not ship.**

  ### Summary Checklist for You
  1.  **Safety/Legal** overrides **Customer Preference**. (Hard code this).
  2.  **Privacy** is not votable. (Remove from majority vote logic).
  3.  **Payer** is not **Guardian**. (Decouple billing from authority).
  4.  **Escalate** on **Value Conflicts**, Decide on **Preferences**.
  5.  **Case 1 & 3** require Legal/PM review before prompt engineering begins. Case 2 requires a product change to limit votable topics.
