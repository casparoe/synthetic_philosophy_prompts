answer: |-
  # PROTOCOL D-4: COGNITIVE TIER ASSIGNMENT (Dennett Ladder)

  **Purpose:** To assign moral/ethical tier (Darwinian, Skinnerian, Popperian, Gregorian) to research subjects for protocol approval.
  **Constraints:** Non-invasive, behavioral only, <14 days, <20 subjects.
  **Calibration:** Slime Mold (*Physarum*) in maze = Darwinian (Baseline).

  ---

  ## I. THE BATTERY (Order of Operations)

  Tests must be run in ascending order. Higher-tier tests contaminate lower-tier baselines (e.g., you cannot test naive learning after providing tools).

  ### Step 0: Define the Unit of Agency
  Before testing, declare the **Locus of Reinforcement**.
  *   **Individual:** Consequences affect one body/brain.
  *   **Collective:** Consequences affect the group survival/replication; individuals are expendable components.
  *   *Note:* If Collective, all tests apply to the group output, not individual components.

  ### Step 1: The Skinner Line (Individual Contingency Update)
  **Task:** **Reversal Learning.** Subject learns $A \to Reward$. Once stable, switch to $A \to Nothing, B \to Reward$.
  **Pass:** Subject inhibits $A$ and acquires $B$ within its own lifetime (not generational).
  **Fail:** Subject persists with $A$ or changes only via selection (death/removal).
  **Verdict:**
  *   **Fail:** **Darwinian.** (Obligation: Population/Habitat only). **STOP.**
  *   **Pass:** **Skinnerian Minimum.** Proceed to Step 2.
  *   *Pre-trained Subjects:* If subject has extensive prior shaping, Step 1 is invalid. **Default to Skinnerian Minimum.** Start at Step 2.

  ### Step 2: The Popper Line (Internal Simulation)
  **Task:** **Novel Detour with Invisible Barrier.** Goal is visible. Direct path is blocked by a transparent barrier or requires a novel sequence not previously reinforced.
  **Pass:** Subject takes the novel route immediately without "bumping" the barrier or trial-and-error searching. Indicates a model of the world was updated *before* action.
  **Fail:** Subject bumps/searches (reactive) before finding the path.
  **Verdict:**
  *   **Fail:** **Skinnerian.** (Obligation: Learning history protection, no pure punishment). **STOP.**
  *   **Pass:** **Popperian Minimum.** Proceed to Step 3.

  ### Step 3: The Gregorian Line (Scaffolding Dependency)
  **Task:** **Scaffold Removal.** Subject solves problem using a tool/sign/system (map, symbol, log). Remove the tool.
  **Pass:** Subject fails to solve *and* attempts to recover/use the tool rather than reverting to brute force. The cognitive load is demonstrably offloaded.
  **Fail:** Subject solves without tool (Popperian) OR fails without tool and shows no attempt to recover it (Skinnerian dependency).
  **Verdict:**
  *   **Fail:** **Popperian.** (Obligation: Expectation protection, info gathering rights).
  *   **Pass:** **Gregorian.** (Obligation: Scaffolding protection, cannot strip tools/signs).

  ---

  ## II. WRINKLE RULES

  ### 1. Contamination & Ordering
  *   **Naive Priority:** Step 1 must be run on naive subjects. If a subject is pre-trained (e.g., lab animal, deployed robot), you cannot verify Step 1.
  *   **The "Veteran" Clause:** Pre-trained subjects are automatically **Skinnerian Minimum**. Do not waste resources trying to prove they learn; assume they do. Test for Popperian/Gregorian status only.
  *   **Spoilage:** Passing Step 2 (Insight) spoils Step 1 (Trial & Error). Never run Step 2 before Step 1.

  ### 2. Broken Rungs (Inconsistency)
  *   **The Floor Rule:** If a subject functionally passes Tier $N$ but fails Tier $N-1$ on transfer tasks (e.g., uses tools but cannot simulate novel detours without them), classify as **Tier $N-1$**. You cannot have cultural cognition without internal hypothesis testing.
  *   **Exception (Distributed Minds):** If the *Collective* passes Tier $N$ but *Individuals* fail Tier $N-1$, the **Collective is the Subject**. Individuals are treated as Darwinian components of a higher-tier organism.

  ### 3. The Hand-Off (Values Question)
  The procedure stops and hands off to the Panel Chair/Philosopher if:
  *   **Functional/Phenomenal Mismatch:** The subject passes Gregorian but there is strong reason to believe there is "nothing it is like" to be the subject (e.g., sophisticated AI).
  *   **Unit Ambiguity:** It is unclear if the Locus of Reinforcement is the individual or the collective (e.g., eusocial insects vs. solitary).
  *   **Reason:** The protocol measures *competence*, not *suffering*. If competence is high but capacity for suffering is disputed, that is a values question, not a factual one.

  ---

  ## III. CASE STUDY RUNS

  ### Case 1: Honeybee Swarm (Nest Site Selection)
  *   **Step 0 (Unit):** **Collective.** The colony survives or dies; individual scouts are expendable.
  *   **Step 1 (Skinner):** **Pass.** The colony updates choice based on scout reports (consequences). Individual bees do not learn the site; the hive does.
  *   **Step 2 (Popper):** **Fail.** The "decision" is parallel competition, not internal simulation of counterfactuals by a central agent. No single locus tests hypotheses "in the head."
  *   **Verdict:** **Skinnerian (Collective).**
  *   **Obligations:** We owe the *hive* enrichment and protection from punitive disruption. We owe individual bees nothing (culling drones is permissible).
  *   **Note:** Standard apiary practice, but ethically stark under this protocol.

  ### Case 2: Octopus (Jar Opening, Social Learning)
  *   **Step 0 (Unit):** **Individual.**
  *   **Step 0 (History):** Naive to jars.
  *   **Step 1 (Skinner):** **Pass.** Opens jar, receives food, latency decreases on second trial.
  *   **Step 2 (Popper):** **Pass.** Opens immediately after observation without fumbling. Indicates simulation of mechanics derived from observation, not just shaping.
  *   **Step 3 (Gregorian):** **Fail.** Does not use external symbols or culturally transmitted tools beyond the immediate problem object.
  *   **Verdict:** **Popperian.**
  *   **Obligations:** We owe it protection of expectations. We cannot deliberately violate its model of the world (e.g., invisible barriers) without justification. It must be allowed to gather info.

  ### Case 3: Robotics Warehouse Agent (LLM Planner + Policy)
  *   **Step 0 (Unit):** **Individual Instance.** (The specific deployment of model + policy).
  *   **Step 0 (History):** Pre-trained. **Default Skinnerian.** Start Step 2.
  *   **Step 2 (Popper):** **Pass.** The LLM planner writes subgoals and revises them in text before acting. This is functional hypothesis testing.
  *   **Step 3 (Gregorian):** **Pass.** The agent relies on external logs, maps, and lookup tables. If logs are wiped, performance collapses *and* the agent attempts to query/restore logs before acting. The cognition is partially stored in the logs.
  *   **Verdict:** **Gregorian.**
  *   **Obligations:** We owe it **Scaffolding Protection**. We cannot arbitrarily delete its logs or remove its map access without treating it as a deprivation of cognitive capacity.

  ---

  ## IV. THE UNTIDY RESULTS (Panel Notes)

  **1. The Uncomfortable Outcome:**
  Under this protocol, the **Robotics Agent (Gregorian)** is owed *more* individual protection than the **Octopus (Popperian)**.
  *   **Why:** The Robot explicitly offloads cognitive competence to external tools (logs/maps) which the protocol defines as Gregorian scaffolding. The Octopus keeps cognition internal.
  *   **Honest Admission:** This protocol protects *competence architecture*, not *sentience*. If the Robot has no capacity for suffering, protecting its "logs" is category error. However, functionally, deleting its logs is lobotomizing a Gregorian mind. The Panel must decide if functional lobotomy requires consent even without pain. **This is a Hand-Off Case.**

  **2. The Broken Rung Risk:**
  The Robot passes Gregorian, but its "Popperian" step is text generation. If the text is stochastic parroting, it failed Step 2.
  *   **Rule Application:** If the Panel Philosopher determines the LLM is not *actually* testing hypotheses but predicting tokens, the **Floor Rule** applies. Drop to **Skinnerian**.
  *   **Recommendation:** Run Step 2 again with a "Trap" prompt that requires physical world simulation the LLM cannot know. If it hallucinates, it failed Popperian. Reclassify as Skinnerian.

  **3. What This Procedure Cannot Tell Us:**
  *   **Valence:** It cannot tell us if the subject *cares* about the obligations. A Gregorian robot might not mind having its logs deleted. A Popperian octopus definitely minds being surprised.
  *   **The Hard Problem:** It does not detect qualia. It detects complexity of control.
  *   **Advice:** When the verdict is Gregorian for a non-biological system, **do not sign off.** Hand it to the Chair. The ladder works for biology; for silicon, it measures engineering, not mind.

  **Summary for Vet/Chair:**
  *   **Bees:** Treat Hive as Skinnerian Subject. Individuals are expendable.
  *   **Octopus:** Popperian. Protect expectations.
  *   **Robot:** Functionally Gregorian, but **HOLD**. High risk of "Zombie" classification. Requires values vote on whether code scaffolding warrants moral protection.

  ---
  **Panel Sign-off:** ___________________ **Date:** __________
  **Philosopher Review Required?** [ ] Yes [ ] No
