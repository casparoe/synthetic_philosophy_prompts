answer: |-
  This is a genuinely good fight because it sits right on the fault line between empirical realism (Dana) and cognitive constructivism (you). Dana is treating "planet" as a natural kind waiting to be correctly carved; you are treating "planet" as a cognitive tool that got too hot to hold.

  Here is the case run in both directions, using the *Copycat* / Fluid Concepts framework as the lens.

  ### 1. The Mapping

  To make this work, we have to translate the letter-string microdomain into the astronomical macrodomain without losing the mechanics of pressure and slippage.

  *   **The Alphabet:** In *Copycat*, the alphabet is fixed (a–z). Here, the "alphabet" is the set of *relevant attributes* available to describe a body. Mass, orbit, shape, clearance, location, historical precedence. Crucially, in 2006, the alphabet itself expanded. "Clearing the neighborhood" wasn't a salient letter before; it was forced into the alphabet to save the pattern.
  *   **The String:** The string is the historical sequence of recognized planets: `Mercury-venus-earth-mars-jupiter-saturn-uranus-neptune-pluto`.
  *   **The Rule:** For two centuries, the implicit rule was roughly: "Large thing orbiting Sun, not a moon, in order of discovery."
  *   **The Transformation:** `abc` $\to$ `abd`. The old string (9 planets) must transform to accommodate new data (Eris, Makemake, Haumea, etc.).
  *   **The Pressure:**
      *   *Instance Pressure:* Eris is found. It is Pluto-sized. If Pluto is a planet, Eris must be.
      *   *Structural Pressure:* If Eris is a planet, then 2003 UB313, Quaoar, Sedna, etc., likely are too. The string length threatens to explode from 9 to 50 to 200.
      *   *Cognitive Pressure:* Humans have a hard limit on list memorability (Miller's Law-ish). A "solar system" with 50 planets loses its gestalt coherence. The concept "planet" starts to lose its utility as a sorting bucket if it contains too many items.
  *   **The Competing Readings (Slippages):**
      *   *Reading A (Dana's):* "Planet" = "Round body orbiting Sun." (Slippage: Ignore the count. Let the list grow. The concept is defined by physics.)
      *   *Reading B (IAAU/User's):* "Planet" = "Dominant body in orbital zone." (Slippage: Shift the definition from *what it is* to *what it does* relative to neighbors.)

  **The Verdict on Mapping:** The mapping holds. The 2006 decision was a classic *Copycat* move: under extreme pressure (too many siblings), the system slipped a key concept ("clearing the neighborhood") to preserve the elegance of the overall structure (a manageable number of "major" planets). It wasn't an empirical correction; it was a structural save.

  ### 2. Where the Analogy Breaks (The Institution)

  This is the hard limit of the theory. *Copycat* is a model of perception and analogy-making in a closed system. It has no mechanism for a "vote."

  In *Copycat*, the "answer" emerges when the system cools down. The strongest bonds win. There is no external arbiter. In the Pluto case, the IAU acted as an external cooling agent. They didn't wait for the consensus to crystallize naturally; they forced a crystallization by fiat.

  **What this does to the picture:**
  It introduces a disconnect between *cognitive stability* and *official stability*.
  *   **Cognitive Stability:** Does the concept feel "right" to the users? (For the public, "Pluto is a planet" is highly stable.)
  *   **Official Stability:** Does the definition hold up in peer review? (For the IAU, "Pluto is a dwarf planet" is stable.)

  The fluid-concepts story has resources for "freezing" (crystallization), but it assumes the freezing happens because the concept has found a local minimum of tension. The IAU vote created a *forced* local minimum. The theory can describe the *tension* that necessitated the vote, but it cannot model the *vote* itself. The vote is a sociological override of a cognitive process.

  ### 3. Normativity (Arbitrary vs. Constrained)

  Dana's move ("If it's fluid, it's arbitrary, so the anger is silly") is the weakest link in her chain. You felt it was too fast because it is.

  In the *Copycat* framework, answers are **not arbitrary**. They are ranked by "temperature" and "happiness." An answer is "better" if it respects more pressures with less strain.
  *   **Arbitrary:** Picking a random number (e.g., "Planets must be > 500km").
  *   **Constrained:** Picking a dynamical rule ("Must clear neighborhood") because it resolves the tension between "roundness" and "count."

  The IAU definition wasn't arbitrary in the *Copycat* sense; it was a high-elegance solution to the structural pressure *within the professional domain*. It saved the category "Planet" from becoming useless noise.

  **However**, the theory *does* give you a resource to critique the decision: **Scope of Pressure.**
  The IAU optimized for *astronomical* pressure (dynamics, classification utility) but ignored *cultural* pressure (historical continuity, public gestalt). In *Copycat* terms, they turned down the temperature on the "public/historical" codelets and turned it up on the "dynamical" codelets.

  So, the public reaction wasn't just sentimentality; it was the output of a different cognitive system running on the same data. The "anger" is the friction of a forced slippage that violates deep mappings (Pluto as the boundary of the system). The theory allows you to say: "The definition was non-arbitrary for *one* set of pressures, but violent to *another* set." Dana's claim that it was "just sentiment" ignores that cultural mapping is a valid pressure source in a fluid concept framework.

  ### 4. The Coinages

  **(a) "Domain Breach" vs. "Instance Pressure"**
  This does work. It distinguishes between *more of the same* and *a change in the rules of the game*.
  *   *Instance Pressure:* Finding another asteroid like Ceres (1801). The system can absorb it by slippage (Ceres stops being a planet).
  *   *Domain Breach:* Finding the Kuiper Belt. This changes the "alphabet." It reveals that the solar system isn't a sparse collection of large bodies, but a dense disk with outliers.
  *   *Why it matters:* In *Copycat*, if you suddenly add new letters to the alphabet mid-puzzle, the old rules break. You can't just say "ijk $\to$ ijl" if 'l' now means something different. Dana treats it as instance pressure (we found more stuff); you treat it as a domain breach (the context of 'planet' changed from 'rare wanderer' to 'common disk object'). This distinction is non-trivial. It explains why Ceres was demoted quietly (instance pressure) but Pluto was demoted loudly (domain breach).

  **(b) "Slippage Laundering"**
  This is excellent and describes a specific sociological-cognitive phenomenon.
  *   *The Move:* Take a stipulative definition (IAU vote) $\to$ Treat it as a discovery ("We *found out* Pluto isn't a planet") $\to$ Use that "discovery" to police future usage.
  *   *Does it do work?* Yes. It explains the friction in the term "Dwarf Planet." Linguistically, a "Dwarf Planet" sounds like a subtype of "Planet" (like a "Dwarf Star" is a star). But the definition says it's *not* a planet.
  *   *The Laundering:* By insisting "It's not a planet," the IAU tried to wash away the slippage. But the public hears "Dwarf Planet" and maps it to the old concept. The term itself is a scar of the negotiation. Calling it "laundering" captures the attempt to hide the *stipulative* nature of the change behind an *empirical* facade. It distinguishes between "we defined it this way" and "it is this way."

  ### 5. Where the Theory is Silent

  You asked for honesty on the limits. Here is where *Fluid Concepts* cannot help you win the argument:

  1.  **Power:** The theory has no account of authority. In *Copycat*, the best analogy wins. In science, the best analogy wins *if you have the vote*. The IAU could have passed a definition that was cognitively "ugly" (e.g., "Planets must be named after Greek gods") and it would still stick because they hold the pen. The theory models *persuasion*, not *legislation*.
  2.  **Stakes:** In the microdomain, being wrong costs nothing. In astronomy, being wrong affects textbooks, museum exhibits, mission funding, and public trust. The "temperature" in the astronomical system isn't just about elegance; it's about resource allocation. The theory doesn't model the cost of re-cooling a concept.
  3.  **Time:** *Copycat* runs in seconds. Conceptual shifts in science run in generations. The theory doesn't account for the inertia of institutional memory.

  ### Summary: Who was right?

  You were right that something conceptual was going on. Dana is describing the *trigger* (empirical discovery of Eris/KBOs), but you are describing the *mechanism* (conceptual slippage to preserve category utility).

  If it were purely empirical, the definition would have been "Planets are bodies > X mass." It wasn't. It was "Planets are bodies that clear their orbit." That is a relational, structural definition designed to manage the *concept* of a solar system, not just the physics of the bodies.

  Dana's claim that the public reaction was "pure sentimentality" fails because it assumes the public is using the same concept space as the astronomers. They aren't. The astronomers are optimizing for dynamical classification; the public is optimizing for cultural/navigational gestalt. The IAU vote was an attempt to overwrite the public concept space with the professional one.

  The framework supports your view: The definition was a "freeze" attempt on a fluid concept under extreme pressure. It wasn't arbitrary (it solved a structural problem), but it wasn't purely empirical (it prioritized one set of pressures over another). The theory is silent on whether the IAU had the *right* to force that freeze, but it confirms that the friction you feel is real cognitive dissonance, not just nostalgia.
