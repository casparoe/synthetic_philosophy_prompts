  # Decision Tree: Taxonomy of Genocide Conceptualization

  ### **ROOT NODE**
  **How should the legal definition of genocide (centered on specific intent to destroy a protected group, in whole or in part) be treated?**
  *   **A.** As **Conceptually Fixed**: The 1948 Convention definition sets the necessary and sufficient boundaries; deviations are category errors.
  *   **B.** As **Open to Expansion**: The Convention provides a baseline, but the concept can be revised to include excluded groups or acts.
  *   **C.** As **Subordinate to Moral/Political Considerations**: The definition is a tool that serves a higher moral truth or political function, not an authority in itself.

  ---

  ### **BRANCH A: CONCEPTUALLY FIXED**
  *If the legal definition is fixed, the primary dispute concerns how strictly the existing criteria are applied.*

  **Node A1: In cases where there is no documentary proof of explicit intent but the structural pattern of violence makes group destruction the only plausible explanation, should the event be named genocide?**
  *   **Yes (Structural Inference):** Intent can be inferred from the systematic nature of the outcome.
  *   **No (Documentary Strictness):** Intent requires explicit evidence (orders, statements, manifests).

  **Node A2: Is applying the term primarily a legal determination, a moral judgment identifying the worst kind of wrong, or a strategic political speech act intended to trigger specific obligations?**
  *   *(Note: For Fixed positions, this splits between those who view the label as a technical legal classification versus those who view the legal classification as carrying inherent moral weight.)*
  *   **Legal Determination:** The label applies only if a competent tribunal convicts.
  *   **Moral Judgment:** The label applies if the legal criteria are met factually, regardless of trial outcomes.

  #### **LEAVES (Branch A)**
  1.  **The Strict Conventionalist:** (Fixed + Documentary Strictness + Legal Determination).
      *   *Diagnosis:* Genocide is a crime of specific intent proven by direct evidence. Without a court verdict or explicit orders, the term is misapplied. Prioritizes legal certainty over moral recognition.
  2.  **The Legal-Moralist:** (Fixed + Structural Inference + Moral Judgment).
      *   *Diagnosis:* The legal definition is binding, but intent can be deduced from structural patterns. Once facts meet the legal threshold, the moral label attaches automatically, even without a trial.

  ---

  ### **BRANCH B: OPEN TO EXPANSION**
  *If the definition is open, the concept can grow beyond the 1948 Convention, but disputes arise regarding which elements to expand.*

  **Node B1: Can cultural destruction without physical killing satisfy the concept, or does the concept require biological or physical destruction?**
  *   **Yes (Cultural Inclusion):** Destruction of language, archives, or heritage counts as genocide.
  *   **No (Physicalist Requirement):** Only biological/physical destruction of members counts.

  **Node B2: Should the protected-group category include politically defined groups, given that Lemkin originally sought their inclusion but the adopted Convention excluded them?**
  *   **Yes (Political Inclusion):** Political groups are valid targets of genocide.
  *   **No (Conventional Groups):** Only national, ethnical, racial, or religious groups count.

  **Node B3: Is applying the term primarily a legal determination, a moral judgment identifying the worst kind of wrong, or a strategic political speech act intended to trigger specific obligations?**
  *   *(Note: This node is only reached for the specific combination of Physicalist + Political Inclusion to distinguish the "Rare" position.)*
  *   **Legal Determination:** The expansion is proposed to amend or reinterpret law strictly.
  *   **Moral Judgment:** The expansion is driven by ethical necessity.

  #### **LEAVES (Branch B)**
  3.  **The Lemkin-Restorationist:** (Cultural Inclusion + Political Inclusion).
      *   *Diagnosis:* Seeks to restore Lemkin's original holistic vision. Genocide includes the erasure of culture and the destruction of political collectivities, not just physical killing of ethnic groups.
  4.  **The Culturalist:** (Cultural Inclusion + Political Exclusion).
      *   *Diagnosis:* Accepts that destroying a group's way of life is genocide but retains the Convention's restriction on group types. Prioritizes identity over political affiliation.
  5.  **The Theoretically Unstable Legalist:** (Physicalist Requirement + Political Inclusion + Legal Determination).
      *   *Diagnosis:* **Rarely Occupied.** This position argues for including political groups within a *purely legal* framework while denying cultural destruction. It is unstable because it seeks to expand the legal category (usually a moral move) without the moral justification of cultural harm, relying solely on political classification. It risks incoherence: if the label is "purely legal," why expand beyond current statute? If expanding, why ignore the cultural harm that usually defines group identity?
  6.  **The Political-Moralist:** (Physicalist Requirement + Political Inclusion + Moral Judgment).
      *   *Diagnosis:* Argues that destroying political groups is morally equivalent to genocide, even if cultural elements are absent. Views the label as a moral condemnation of political annihilation.

  ---

  ### **BRANCH C: SUBORDINATE TO MORAL/POLITICAL**
  *If the definition is subordinate, the legal text is secondary to the function the label performs.*

  **Node C1: Is applying the term primarily a legal determination, a moral judgment identifying the worst kind of wrong, or a strategic political speech act intended to trigger specific obligations?**
  *   **Strategic Political Speech Act:** The label is used to mobilize intervention or solidarity.
  *   **Moral Judgment:** The label identifies a specific level of evil on a spectrum.

  **Node C2: Does the core destructive act include the systematic erasure of a group's archives, languages, or demographic records—what might be called epistemic destruction—or is such erasure merely a cover-up mechanism with no independent weight in the concept?**
  *   *(Note: This node is only reached for Moral Judgments to distinguish types of scalarism.)*
  *   **Yes (Epistemic Weight):** Erasure of memory is a core component of the wrong.
  *   **No (Physical/Experiential Weight):** Only harm to living beings counts toward the moral scale.

  #### **LEAVES (Branch C)**
  7.  **The Political Nominalist:** (Strategic Political Speech Act).
      *   *Diagnosis:* "Genocide" is not a truth-claim but a tool. It is applied when it is useful to trigger international obligations or mobilize resistance, regardless of whether technical criteria are met.
  8.  **The Epistemic Scalarist:** (Moral Judgment + Epistemic Weight).
      *   *Diagnosis:* Genocide is the extreme end of a spectrum of wrongs. This extreme includes the destruction of a group's ability to remember itself (archives/language), not just physical death.
  9.  **The Physicalist Scalarist:** (Moral Judgment + No Epistemic Weight).
      *   *Diagnosis:* Genocide is the extreme end of a spectrum of wrongs, but the scale is measured solely by harm to living persons. Epistemic destruction is a serious crime but does not contribute to the "genocidal" weight.

  ---

  ### **LOGIC FLAGGING NOTE**
  **Indistinguishable Leaves:** Leaves **8 (Epistemic Scalarist)** and **9 (Physicalist Scalarist)** may not be genuinely separable by this tree's logic. If one accepts that genocide is a *moral spectrum* of harm (Leaf 8/9 Root), the exclusion of epistemic destruction (Leaf 9) is theoretically difficult to sustain, as the erasure of a group's memory is arguably a harm to the group's continued existence. A consistent moral scalarist would likely count epistemic destruction as a contributing factor to the "weight" of the wrong. Consequently, Leaf 9 may collapse into Leaf 8 upon rigorous philosophical scrutiny, rendering the split at Node C2 unstable for this specific branch.
