  ### Decomposition of Probabilities

  To evaluate the Stronger Sub-Claim (that there is a *duty* to dismantle institutional memory based on *autonomy*), I have assigned probabilities to the four sub-questions. **Note:** For the purpose of this calculation, the probabilities represent the likelihood that the answer to each question *supports* the Stronger Sub-Claim.

