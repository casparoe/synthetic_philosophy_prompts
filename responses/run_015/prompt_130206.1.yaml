  This alters the representational target significantly. Instead of mapping directly onto empirical data points, the model targets the causal architecture underlying regularities. Consequently, unrealistic assumptions are not merely convenient simplifications to aid computation, as Friedman might suggest. They are constitutively artificial, designed to isolate specific mechanisms. By stripping agents of memory or homogenising preferences, researchers demonstrate that complex social order does not require complex individual cognition. The artificiality is thus epistemically productive, rendering the causal pathway visible rather than obscuring it within a predictive algorithm.

  Therefore, this represents a nuanced departure from strict instrumentalism. While both approaches tolerate unrealistic assumptions, Friedman tolerates them because they do not hinder prediction, whereas agent-based modellers embrace them because they facilitate explanation. The distinction lies between assumptions that are conveniently false versus those that are constitutively necessary for the mechanism to operate transparently. Ultimately, this suggests a move towards mechanistic realism regarding the process, even if the components remain stylised. The validity rests on the plausibility of the generative process, not solely on the accuracy of the aggregate output, marking a shift from prediction-centric instrumentalism to explanation-centric generativism.
