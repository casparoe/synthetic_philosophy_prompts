answer: |-
  This is a precise dissection of the normative architecture underlying American land-use regulation. The practice you describe—discretionary review, neighborhood vetoes, and the specific triggers for "character" protection—is not merely bureaucratic inertia; it is the institutionalization of a specific political philosophy.

  Here is an analysis of the theories presupposed by this arrangement, the degree to which they are required by the practice, and how they fare against your proposed procedural tests.

  ### I. Reconstructing the Theories

  **1. Theory of Property: The "Collective Easement"**
  The practice does not presuppose a standard Lockean view of property (absolute dominion within boundaries). Instead, it operationalizes a **relational theory of property**. It assumes that ownership of a single-family home confers a *negative easement* over the surrounding land. You do not own your neighbor's lot, but you own a stake in its *use*.
  *   **Compensation vs. Right:** The practice fits well with the theory that the veto is **compensation for concentrated costs** (the economic view: neighbors bear the cost of density, region bears the benefit). However, the *rhetoric* of the hearings ("character," "shadows," "feel") suggests a deontological view: the veto is a **right to exclude externalities**, not a claim for damages. If it were purely economic, the system would tax the developer and rebate the neighbors. The fact that it allows a *veto* implies the interest is in the *state of the world*, not the bank account.

  **2. Theory of Political Standing: "Presentist Affectedness"**
  The system presupposes a **currentist theory of standing**. Political legitimacy is derived from current physical presence and current legal tenure (ownership or residency).
  *   **The Excluded:** Future residents are excluded not just because they are unidentified, but because they lack *ontological status* in the current political community. They are "potential," not "actual."
  *   **The Paradox:** This explains the highway/gentrification inconsistency. A highway is an act of the *Sovereign* (eminent domain), which supersedes local standing. Gentrification (rising rents/turnover) is an act of the *Market*, which is viewed as a natural force like weather, not a political act requiring consent. Construction is the only category treated as a *political act* by a *private agent*, which is why it triggers the community veto.

  **3. Theory of Neighborhood Ontology: "Essentialist Character"**
  The practice treats the neighborhood as an entity with **identity conditions distinct from its population**.
  *   **Preservation vs. Stasis:** If the neighborhood were just the sum of its residents, turnover would destroy it just as much as a new building. The fact that turnover is ignored while building is blocked implies the neighborhood is defined by its **physical form and social rhythm**, not its specific inhabitants. The "character" is a reified object that can be "harmed."
  *   **Identity Conditions:** The neighborhood persists through changes in *who* lives there, but not through changes in *how* they live there (density, parking, massing).

  **4. Baseline Assumption: The Normative Status Quo**
  The system strictly presupposes that the **existing physical pattern is the neutral baseline**.
  *   **Burden of Proof:** Change is the deviation; stasis is the norm. Therefore, the proponent of change bears the burden of proof, while the defender of stasis bears none. Blocking a project is not an "act" requiring justification; it is a return to equilibrium.

  ### II. Strict Presupposition vs. Fit vs. Underdetermination

  **Strictly Presupposed:**
  *   **The Normative Status Quo:** You cannot have a veto process on new construction without assuming the existing state is the default legitimate condition.
  *   **Presentist Standing:** The procedure literally excludes anyone not currently addressable within the radius. It *requires* that future interests count for less than present interests.

  **Fits Well (But Not Strictly Required):**
  *   **The Collective Easement:** The system *could* function on pure rent-seeking (NIMBYism) without a normative theory of property. However, the "character" language fits the easement theory best.
  *   **Neighborhood Essentialism:** The system fits the idea that neighborhoods have souls, but it could also be explained by simple asset-protection (owners protecting property values). The practice is underdetermined between "protecting community soul" and "protecting investment portfolio."

  **Underdetermined:**
  *   **The Source of Authority:** Is the veto power delegated from the State (police power) or inherent in the Community (sovereignty)? The hearings look like mini-legislatures, suggesting the latter, but the legal authority comes from the state, suggesting the former.
  *   **The Nature of Harm:** Is the harm material (traffic, shadows) or existential (loss of identity)? The procedure accepts both, making it impossible to read the practice as evidence for one specific theory of harm.

  ### III. The Test: Procedural Amendments

  How do the theories react to your two amendments?

  **Amendment A: The Compensation Requirement**
  *(Objectors must name a price to withdraw; city pays if project proceeds.)*

  *   **Economic/Externality Theory:** Treats this as a **repair**. It internalizes the cost, reveals true preferences, and allows efficient outcomes.
  *   **Collective Easement/Character Theory:** Treats this as an **insult**. If the objection is based on a right to the neighborhood's character, putting a price on it commodifies a right that is supposed to be inalienable. It turns a "veto" into a "toll."
  *   **Status Quo Baseline Theory:** Treats this as an **insult**. It implies the Status Quo is not the neutral baseline, but an asset owned by the neighbor that can be bought out. It shifts the entitlement from the neighbor to the developer (with compensation).

  **Amendment B: Reserved Seats for Future Renters**
  *(Seats reserved for those committing to rent in the building.)*

  *   **Presentist Standing Theory:** Treats this as **worthless/illegitimate**. These people do not yet exist as constituents. They have no stake because they have no address *yet*.
  *   **All-Affected Principle:** Treats this as a **repair**. It corrects the asymmetry where those affected by the outcome (future residents) have no voice in the input.
  *   **Right to the City:** Treats this as a **repair**, but insufficient. It acknowledges the "producer" of the space, but still treats them as consumers (renters) rather than decision-makers.

  **The Crucial Divergence:**
  If a city adopted Amendment A and the neighbors screamed "bribery," you would know the presupposed theory is **Deontological/Character-based**, not Economic. If they accepted the money, it was **Rent-Seeking**.
  If a city adopted Amendment B and the commission ruled them "out of order," you would confirm the **Presentist Standing** theory is strict, not just accidental.

  ### IV. Realizing a "Right to the City"

  Henri Lefebvre's *Right to the City* is not a right to access existing urban resources (housing as a commodity), but a right to *participate in the production of urban space* (the city as an *oeuvre*). To take this seriously, the procedural and legal changes must shift power from **protection of assets** to **democratic production**.

  **1. Procedural Changes:**
  *   **Shift the Burden of Proof:** The baseline must flip. Density should be the entitlement; the burden must be on objectors to prove *specific, material harm* (not "character").
  *   **Constituency Redefinition:** Standing must be regional, not hyper-local. A housing hearing should include representatives from the regional housing authority or homeless advocacy groups, diluting the immediate neighbors' veto.
  *   **Participatory Design, Not Just Review:** Instead of a hearing to *stop* a project, the process should be a charrette where the neighborhood helps *design* the density. This shifts the role from "gatekeeper" to "co-author."
  *   **Tenant Voting Rights:** In planning hearings, tenancy must be weighted equally with ownership. Currently, a landlord who doesn't live there often has more standing than a tenant who does.

  **2. Legal Changes:**
  *   **Abolish Discretionary Review:** Move to by-right zoning for anything meeting objective standards. Discretionary review is the legal mechanism that allows the "character" veto.
  *   **Community Land Trusts (CLTs):** Legalize and fund CLTs to remove land from the speculative market. This addresses the "property as investment" theory by making property a "community steward."
  *   **Regional Taxation of Exclusion:** If a neighborhood blocks density, it should be taxed at a higher rate to fund affordable housing elsewhere. This monetizes the "concentrated cost/diffuse benefit" problem without bribing individual neighbors.
  *   **Anti-Displacement as "Character":** If "character" is the metric, legal statutes should define "resident retention" as a key component of character. A project that displaces no one but adds density preserves character better than a project that flips houses for luxury condos.

  **Conclusion**
  The current practice presupposes a **static, proprietary, and presentist** theory of the city. It treats the city as a museum of existing assets rather than a workshop for future life. The "Right to the City" requires inverting this: treating the city as a verb, not a noun. The test you propose reveals that the current system is likely not about "costs" (which can be compensated) but about **power and identity** (which cannot). To change it, you cannot just tweak the hearing; you must dismantle the idea that the current residents are the sole legitimate authors of the neighborhood's future.
