          *   *Standing:* "Presentist Affectedness." Only those currently suffering the "harm" count. Future people don't exist yet.
          *   *Neighborhood Ontology:* The "Character" theory. The neighborhood is an aesthetic/social entity that persists through minor turnover but breaks under physical change.
          *   *Baseline:* The Status Quo is Neutral. Change is the deviation requiring justification.
      *   **Part 2: Strict Presupposition vs. Fit vs. Underdetermination:**
          *   *Strict:* Status Quo Baseline. (You can't have a veto on change without assuming change is the exception).
