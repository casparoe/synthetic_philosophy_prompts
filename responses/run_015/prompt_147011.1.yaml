  | 4 | $4 \times 0.51 \times 0.49$ | 0.9996 | **1.00** |
  | 5 | $4 \times 1.00 \times 0.00$ | 0.00 | **0.00** |
  | 6 | **PREDICTION** | | **0.00** |
