                  *   *Specific Error in (c)(iii):* "The ranking of the options is fixed once and for all at the prior; learning which branch you are in changes your beliefs about the world but not what you ought to do."
                  *   *Correction:* Learning which branch changes which *action* the policy prescribes. The *policy* is fixed. The *action* can vary. The student conflates "policy" with "action".
