  ### **TA-to-TA Notes & Question Ambiguity**

  **1. The "If... Differ" Trap in (c)(iii)**
  The question phrasing *"If your answers to (i) and (ii) differ, explain..."* is slightly dangerous.
  *   **Student's Reading:** "My answers don't differ, so the condition is false, so I don't need to explain."
  *   **Intended Reading:** "Discuss the relationship between (i) and (ii), and regardless of whether they differ, specify what remains updateless."
  *   **Verdict:** The student *did* attempt an explanation ("Nothing to explain... The ranking... is fixed"), so they aren't technically skipping the question. However, their explanation relies on the false premise that UDT actions shouldn't change based on observations.
  *   **Action:** I recommend you **do not** award marks for the "Nothing to explain" claim. Even if the actions don't differ, the *reason* they don't differ (ex-ante policy optimization) vs. why they *could* differ (policy is a function of observations) is the core learning objective. The deduction in (c)(iii) is justified by the conceptual error, not just the refusal to elaborate.

  **2. Fixing the Question for Next Time**
  To avoid this ambiguity in future iterations, rephrase (c)(iii) to:
  > "(iii) Explain whether your answers to (i) and (ii) differ. In either case, specify what exactly the agent is treating as updateless in this scenario, and why a purely Bayesian updater might reason differently about the policy selection."

  **3. Severity of Deductions**
  *   **Part (b):** I deducted 1/6. This is a "sloppy phrasing of a correct thought" vs. "fundamental error" borderline. Since they correctly described the execution ("executes whatever the winning policy prescribes") later in the same paragraph, I leaned generous. If you want to be stricter on definitions, drop this to 4/6.
  *   **Part (c)(iii):** I deducted 3/4. This is a **conceptual error**, not just inelegance. Believing UDT prescribes invariant actions across all information states misunderstands the definition of a policy ($Policy: Observation \to Action$). This deserves a heavier penalty than the phrasing slip in (b).

  **Summary for Feedback Session:**
  This is a strong 2:1 / low First script. The student has memorized the "UDT verdicts" for standard problems perfectly but struggles when asked to mechanize *how* the theory handles information states (observations) vs. policy selection. Focus your feedback on the distinction between **updating the policy** (forbidden) and **updating the action via the policy** (required).
