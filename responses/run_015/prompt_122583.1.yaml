answer: |-
  Here is a detailed grading breakdown and feedback guide for this script.

  ### **Mark: 21 / 25**

  ### **Mark Breakdown**
  *   **Part (a): 9 / 9** (Full marks. Standard applications are handled correctly.)
  *   **Part (b): 5 / 6** (Strong on the "prior" aspect, but loses a mark for the claim that the agent *never* conditions on evidence.)
  *   **Part (c): 7 / 10**
      *   (i) 4 / 4 (Correct action, correct ex-ante justification.)
      *   (ii) 2 / 2 (Correct action.)
      *   (iii) 1 / 4 (Significant conceptual error regarding policies vs. actions.)

