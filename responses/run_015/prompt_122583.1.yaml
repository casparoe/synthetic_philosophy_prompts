  ### **Point-by-Point Comments for Feedback**

  #### **Part (a): Standard Scenarios (9/9)**
  *   **What they got right:** The student correctly identifies the UDT verdicts for Newcomb, Counterfactual Mugging, and the Mirror PD. The justifications are concise and hit the key keywords: "policy," "prior," "logical dependence," and "ex ante."
  *   **Minor note:** In (a)(iii), referencing "Hofstadter's superrationality" is slightly informal for an advanced module (UDT is a formalisation *of* that intuition, not identical to it), but in this context, it demonstrates correct conceptual mapping. No deduction needed.

  #### **Part (b): The Unifying Principle (5/6)**
  *   **What they got right:** They correctly identify that policies are ranked by expected utility relative to the **prior**. They also correctly note that the dependence is logical/functional, not merely causal.
  *   **The Slip:** The sentence *"Updateless means the agent never conditions on its evidence"* is technically incorrect and costs them 1 mark.
      *   **Why:** A UDT agent *does* condition on observations to **execute** the policy (e.g., "If I observe Omega say 'Tails', I Cooperate"). It does not condition on evidence to **select** the policy.
      *   **Feedback to student:** "You correctly identified that policy selection uses the prior. However, be careful not to say the agent *never* conditions on evidence. The agent uses observations as inputs to the policy function; it simply doesn't use them to re-evaluate which policy is best."

  #### **Part (c): The Omega Coin Flip (7/10)**
  *   **(i) & (ii) (6/6):** The student correctly calculates that the optimal policy is (Cooperate if Heads, Cooperate if Tails). Consequently, the action is "Cooperate" in both branches. Their ex-ante justification in (i) is spot on.
  *   **(iii) (1/4):** This is where the script falters significantly.
      *   **The Error:** The student claims that because the actions are the same in both branches, "Nothing to explain." They further argue that *"learning which branch you are in... [does not change] what you ought to do."*
      *   **Why this is wrong:** This reveals a misunderstanding of what a "policy" is. A policy is a function from observations to actions. UDT absolutely allows for different actions in different branches (e.g., "Pay if Heads, Refuse if Tails" in a modified Mugging). The fact that the actions *happen* to be the same in this specific numerical setup is a coincidence of the payoffs, not a requirement of UDT.
      *   **The "Updateless" Element:** The agent is updateless about the **selection of the policy**, not the **invariance of the action**. The student conflates the two. They imply UDT requires constant action across all possible worlds, which is false.
      *   **Feedback to student:** "You correctly noted the actions are the same, but your reasoning implies UDT requires actions to be invariant across branches. This is incorrect. A UDT policy can prescribe different actions for different observations (e.g., 'If Heads, X; If Tails, Y'). The 'updateless' part is that you commit to this whole mapping *before* knowing the coin outcome, not that the output must be identical. You should have explained that the decision to Cooperate on Tails is 'subsidized' by the logical correlation on Heads in the ex-ante calculation."

