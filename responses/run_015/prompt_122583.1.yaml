              *   *Crucial Nuance:* In the Tails branch *alone* (conditioning on Tails), Evidential Decision Theory (EDT) might also Cooperate (due to 90% correlation). Causal Decision Theory (CDT) would Defect. UDT Cooperates *because* the policy was selected ex-ante.
              *   *The "Updateless" bit:* The agent does not re-evaluate the optimal action *given* it is in the Tails world. It executes the plan made before knowing the world. If it updated, it might ignore the Heads branch implications. However, in this specific numerical setup, EDT and UDT coincide on "Cooperate" in the Tails branch (because of the 90% correlation).
