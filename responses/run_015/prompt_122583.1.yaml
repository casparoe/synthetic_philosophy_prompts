          *   Check if the question itself is ambiguous (requiring fix rather than mark deduction).

  2.  **Analyze the Exam Question & Expected Answers:**

      *   **Context:** Updateless Decision Theory (UDT). Key concept: Maximize expected utility relative to the *prior*, choosing a *policy* (mapping observations to actions), not just an action based on the posterior.
      *   **Part (a) (9 marks):** Standard UDT examples.
          *   (i) Newcomb's (99% predictor): One-box. Justification: Policy "One-Box" has higher ex-ante EU than "Two-Box" because the predictor correlates with the policy.
          *   (ii) Counterfactual Mugging: Pay. Justification: Ex-ante, "Pay if Heads" yields positive EU ($450) vs "Don't Pay" ($0). Knowing it's Tails doesn't change the policy selection derived from the prior.
          *   (iii) PD vs. Copy: Cooperate. Justification: Logical correlation. Your output determines the copy's output. (C,C) > (D,D).
      *   **Part (b) (6 marks):** Unifying principle & "Updateless" definition.
          *   Principle: Maximize EU of policies using the prior. Logical/Functional dependence, not just causal.
          *   What not to update: Do not condition on current observations/evidence when *selecting* the policy. You execute the policy based on observations, but the *ranking* of policies is done from the prior perspective. *Crucial distinction:* It's not that the agent *never* conditions on evidence (it needs observations to know which part of the policy to execute), but it doesn't update its *decision rule selection* based on that evidence.
      *   **Part (c) (10 marks):** The "Omega Coin Flip" Scenario.
          *   **Scenario:** Coin flip (Heads/Tails).
              *   Heads: Play PD against Copy (Logical correlation = 1.0).
              *   Tails: Play PD against Stranger (Common cause correlation = 0.9).
              *   Omega says: "Tails".
          *   (i) What does UDT do *given Omega says Tails*?
              *   *Standard UDT Analysis:* The agent selects a policy *before* knowing the coin outcome. The policy is a function: $Policy(Observation) \to Action$.
              *   Observations here include Omega's statement ("Heads" or "Tails").
              *   Policy options:
                  1.  Cooperate if Heads, Cooperate if Tails (C, C).
                  2.  Cooperate if Heads, Defect if Tails (C, D).
                  3.  Defect if Heads, Cooperate if Tails (D, C).
                  4.  Defect if Heads, Defect if Tails (D, D).
              *   Ex-Ante EU Calculation (Prior = 0.5 Heads, 0.5 Tails):
                  *   If Policy is (C, C): $0.5 \times 3 (\text{vs Copy}) + 0.5 \times [0.9 \times 3 + 0.1 \times 0] (\text{vs Stranger}) = 1.5 + 1.35 = 2.85$.
                  *   If Policy is (C, D): $0.5 \times 3 (\text{vs Copy}) + 0.5 \times [0.9 \times 0 + 0.1 \times 5] (\text{vs Stranger}) = 1.5 + 0.25 = 1.75$. (Note: If I defect vs Stranger, Stranger defects 90% of time due to common cause? Wait, re-read prompt).
                  *   *Re-reading Prompt (c):* "90% chance they choose whatever you choose... purely a matter of common cause... nothing you decide determines... what they decide."
                  *   *Correction on Tails Branch:* If I Defect, Stranger Defects 90% (payoff 1). If I Cooperate, Stranger Cooperates 90% (payoff 3).
                  *   Let's recalculate Policy (C, D) [Coop if Heads, Defect if Tails]:
                      *   Heads (Copy): I Coop -> Copy Coops. Payoff 3.
                      *   Tails (Stranger): I Defect -> Stranger Defects (90%). Payoff 1. (10% Stranger Coops -> Payoff 5). Expected Tails Payoff = $0.9(1) + 0.1(5) = 1.4$.
                      *   Total EU = $0.5(3) + 0.5(1.4) = 1.5 + 0.7 = 2.2$.
                  *   Let's recalculate Policy (C, C) [Coop if Heads, Coop if Tails]:
                      *   Heads: 3.
                      *   Tails: I Coop -> Stranger Coops (90%). Payoff 3. (10% Stranger Defects -> Payoff 0). Expected Tails Payoff = $0.9(3) + 0.1(0) = 2.7$.
                      *   Total EU = $0.5(3) + 0.5(2.7) = 1.5 + 1.35 = 2.85$.
                  *   Let's recalculate Policy (D, D) [Defect if Heads, Defect if Tails]:
                      *   Heads: 1.
                      *   Tails: 1.4.
                      *   Total EU = $0.5(1) + 0.5(1.4) = 1.2$.
              *   *Winning Policy:* (C, C).
              *   *Current Situation:* Omega says "Tails". The policy says "If Tails, Cooperate".
              *   *Answer:* Cooperate.
          *   (ii) Would it do something different if Omega said Heads?
              *   Policy is (C, C). So if Heads, Cooperate.
              *   *Answer:* No (still Cooperate).
          *   (iii) Explain why this isn't ordinary Bayesian updating / what is updateless about it.
