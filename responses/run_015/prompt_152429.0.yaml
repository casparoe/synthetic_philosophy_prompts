  2.  **Deconstruct "Grice's Razor":**
      *   *Origin:* Grice (1978, "Further Notes on Logic and Conversation") actually says: "Senses are not to be multiplied beyond necessity." It's often conflated with Modified Occam's Razor.
      *   *Context:* Grice used it to argue against ambiguity in *if* and *and*, preferring a unitary semantic core + implicature.
      *   *Current Usage:* Often wielded as a trump card against lexical ambiguity/polysemy accounts in favor of pragmatic monosemy.
      *   *User's Insight:* The user is right to be skeptical. It's often used rhetorically rather than argumentatively. The distinction between "senses" (lexicon) and "machinery" (pragmatics/computation) is crucial.

  3.  **Evaluate the Free Choice Case:**
      *   *Sentence:* "You may have cake or ice cream."
      *   *Inference:* "You may have cake and you may have ice cream."
      *   *Debate:* Is this semantic (lexical entry for *or* or *may* includes FCI) or pragmatic (derived via exhaustification, modal logic, etc.)?
      *   *Standard View:* FCI is tricky. It looks like an implicature but behaves like an entailment (doesn't cancel easily). Many semanticists (Aloni, Simons, etc.) argue for semantic treatments. Pragmaticists (Fox, Chemla) argue for pragmatic mechanisms (exhaustification).
