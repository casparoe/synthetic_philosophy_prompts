  5.  **Address the User's Distinctions:**
      *   *Content vs. Machinery:* This is the "Lexical vs. Pragmatic Complexity" trade-off. The Razor usually targets *lexicon*, but rationality suggests targeting *total complexity*.
      *   *Synchronic vs. Diachronic:* Is it about the state of the language or how it evolved? Grice seemed to mean synchronic analysis, but learnability (diachronic/developmental) is often the justification.
