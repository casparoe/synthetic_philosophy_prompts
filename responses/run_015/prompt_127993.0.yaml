      *   *Wait, looking closer at the Verran Verdict:* "Ordinance is perfectly valid law... determinations have no legal force." This is the key. It separates the *source* from the *act*.
      *   *Re-evaluating the "One Change":* The biggest friction is between (1) (Pedigree is enough) and (6) (Intelligibility is required). If I keep (6) as the core innovation for the article, I must soften (1). I should recommend qualifying (1) to admit that *pedigree is necessary but not sufficient*.
