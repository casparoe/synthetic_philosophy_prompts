answer: |-
  This is a classic boundary problem in democratic theory, complicated by your commission's circular authority. To maintain internal consistency, you cannot simply rely on "taxation" (ruled out by the Commuter precedent) or "property ownership" (ruled out by the Absentee Owner precedent). Your eight precedents implicitly reject a purely economic or legalistic definition of membership in favor of a **sociological and functional one.**

  Here is the analysis of your precedents, the competing rules at play, and a recommendation for the Riverside case.

  ### 1. The Implicit Rule of the Eight Precedents
  Your past verdicts consistently prioritize **Physical Nighttime Residence + Social Integration** over economic contribution or legal formalism.

  *   **The "Yes" Cluster:** Green Card holders, Homeless, Students, Jail (<1 yr).
      *   *Commonality:* They sleep within the city limits. Their daily survival, safety, or socialization is physically anchored in the city, regardless of legal title (Homeless), citizenship status (Green Card/Students), or voluntariness (Jail).
  *   **The "No" Cluster:** Commuters, Absentee Owners, Farmworkers, Jail (>1 yr).
      *   *Commonality:* They lack a "life center" in the city. Commuters sleep elsewhere; Owners live abroad; Farmworkers are transient and controlled by employers (not integrated); Long-term Jail inmates are deemed to have lost community ties (or are removed from the social fabric).

  **The Hidden Principle:** You are operating on a **"Center of Life" doctrine.** If the city is the primary theater of your daily existence (sleeping, eating, schooling, sheltering), you vote. If the city is merely a place of transaction (work, investment, temporary holding), you do not.

  ### 2. The Two Competing Rules (And Why They Diverge on Riverside)
  While the "Center of Life" doctrine fits the old cases, it is actually a hybrid of two distinct principles that fit your eight precedents equally well but yield opposite results for Riverside.

  **Rule A: The "Police Power" Test (Subject to Coercion)**
  *   **Definition:** You vote if you are subject to the city's primary coercive apparatus (police, ordinances, incarceration).
  *   **Fits Old Cases:** Explains why Jail inmates (subject to confinement) and Homeless (subject to ordinances) vote. Explains why Commuters (subject only to daytime traffic/tax) and Absentee Owners (subject to property code only) do not.
  *   **Verdict on Riverside:** **NO VOTE.** Riverside is policed by the *County Sheriff*, not the City Police. They are not subject to the city's coercive power, only its services.

  **Rule B: The "Service Dependency" Test (Subject to Benefits)**
  *   **Definition:** You vote if your daily biological and social reproduction depends on city infrastructure (water, schools, shelter).
  *   **Fits Old Cases:** Explains why Green Card holders, Students (dorms), and Homeless (shelters) vote. Explains why Absentee Owners (don't use schools/water) and Commuters (sleep/use utilities elsewhere) do not.
  *   **Verdict on Riverside:** **FULL VOTE.** They drink city water, their kids go to city schools, and they are geographically enclosed by the city. Their daily life is functionally indistinguishable from a city resident.

  ### 3. Recommendation: Annexation Measure Only
  You should grant Riverside residents the right to vote **only on the annexation measure**, not the mayoral race.

  **Why this is consistent:**
  This avoids the trap of choosing between Rule A and Rule B by acknowledging that different elections constitute different *demoi* (peoples).
  1.  **For the Mayoral Race (Governance):** Apply **Rule A (Police Power).** Since they are not currently subject to city policing or full municipal code, they are not yet constituents of the mayor. Granting this would violate the Commuter precedent (economic/functional tie without legal subjection) and the Farmworker precedent (residence without full integration).
  2.  **For the Annexation Measure (Boundary):** Apply a **"All-Affected-Interests" Principle.** A boundary change uniquely affects those on the boundary. Democratic theory generally holds that those whose political status is being altered must consent to the alteration.

  **Is this ad hoc?**
  It risks appearing ad hoc, but it is defensible if you frame it as **"The Boundary Exception."** You are not saying the demos changes for every decision (e.g., zoning vs. taxes); you are saying the demos for *constitutive decisions* (changing the city itself) includes those currently outside the legal frame but inside the functional reality. This preserves the "Police Power" rule for standard governance while respecting the "Service Dependency" reality for the boundary question.

  **Addressing the Earnings Tax:**
  You are correct that the 300 taxpayers cannot claim the vote based on taxes alone (due to the Commuter precedent). However, under the "Annexation Only" compromise, the tax argument becomes irrelevant. They vote on annexation not because they pay, but because they *live* in the zone being annexed.

  ### 4. The Next Case on the Docket
  To distinguish between Rule A (Police Power) and Rule B (Service Dependency) for future clarity, you need a case where **Service Dependency is high, but Police Power is absent (or vice versa).**

  **Put this on the docket next:**
  **"The Gated Enclave."**
  *   **Facts:** A large, wealthy subdivision *inside* current city limits. They have a private security force (city police do not patrol), they have a private well (no city water), but their kids attend city schools and they are subject to city zoning.
  *   **The Conflict:**
      *   **Rule A (Police Power):** They are subject to zoning, so maybe Yes? But they opt-out of police/water.
      *   **Rule B (Service Dependency):** They use schools, but opt-out of water/police.
      *   **Center of Life:** They definitely sleep there.
  *   **Why this helps:** If you vote them **Yes**, you cement "Sleep + Zoning" as the rule (favoring Rule A/B hybrid). If you vote them **No**, you cement "Dependency on Core Utilities" as the rule (favoring Rule B). This will force you to decide if "opting out" of city services voids your "Center of Life" status.

  ### Summary of Action
  1.  **Ruling:** Riverside residents may vote on the Annexation Measure only. They are ineligible for the Mayoral race.
  2.  **Rationale:** The "Center of Life" doctrine grants them a stake in the city's *shape* (Annexation), but the lack of City Police jurisdiction precludes them from choosing the city's *governance* (Mayor) until annexation is complete.
  3.  **Future Test:** Schedule a hearing for "Gated Enclaves" or "Suburban Service Users" (e.g., suburbanites who use city libraries/hospitals daily but sleep elsewhere) to test the limits of Service Dependency.
