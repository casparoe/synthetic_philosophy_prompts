answer: |-
  You have identified a genuine gap in the standard taxonomy of speech act theory. While J.L. Austin and John Searle established that "to say is to do," they did not rigorously formalize the split you are describing: the difference between acts that are **constituted by the speaker alone** and acts that are **constituted only by the interaction.**

  There is no single, universally accepted Latin term for this specific split. However, in legal theory, pragmatics, and social ontology, the distinction is usually drawn using the terms **Unilateral Performatives** and **Bilateral Performatives** (or sometimes *Self-Validating* vs. *Co-Validated* acts).

  Here is the breakdown of why existing terms fail, the proposed distinction, the explanation for the shifting verbs, and the logic behind the retroactive description.

  ### 1. Why the Established Notions Fail

  You rightly dismissed the general category of "speech acts." Here is why the specific sub-categories also fail to capture your distinction:

  *   **Uptake:** Austin argued that all illocutionary acts require "uptake" (the hearer must understand the words). This is not what you are describing. In your "bet" example, the hearer understands perfectly on Tuesday, yet the act is incomplete. You are describing **concurrence**, not comprehension.
  *   **Illocutionary Force:** Both "I apologize" and "I bet" have illocutionary force (they are not just descriptions). The standard taxonomy (Assertives, Directives, Commissives, Expressives, Declarations) groups "Promise" and "Bet" together as *Commissives* (committing the speaker to a future course of action). This taxonomy fails to distinguish that one Commissive binds the speaker immediately, while the other binds the *relationship* only upon acceptance.
  *   **Perlocutionary Effect:** This refers to the consequences of the speech (e.g., persuading someone). Your distinction is not about consequences; it is about **validity**. An unaccepted bet is not a bet with bad consequences; it is *no bet at all*. An unaccepted apology is still an apology, merely an ineffective one.

  ### 2. The Distinction: Unilateral vs. Bilateral Performatives

  To name the split, we must distinguish between acts that alter the **speaker's status** and acts that alter the **shared social reality**.

  #### A. Unilateral Performatives (Self-Validating)
  These acts are complete the moment they are uttered with the proper authority and sincerity. They change the speaker's moral or social position regardless of the hearer's response.
  *   **Mechanism:** The speaker imposes a status upon themselves.
  *   **Your Examples:**
      *   *"I am sorry."* (This is an **Expressive**. It records the speaker's state of regret. If the hearer rejects it, the apology still *occurred*; it just failed to reconcile.)
      *   *"I won't mention it."* (Gratuitous Promise. This is a **Commissive**. The speaker binds their own future conduct. The hearer's preference is irrelevant to the existence of the promise.)
  *   **Why they fit:** The "deed" is the commitment of the speaker. The hearer is a witness, not a co-author.

  #### B. Bilateral Performatives (Co-Validated)
  These acts are **provisional** upon utterance. They function as an *offer* to create a shared social fact. They remain in a state of suspension until the hearer performs a reciprocal act (acceptance).
  *   **Mechanism:** The speaker proposes a change to the shared reality, which only crystallizes upon concurrence.
  *   **Your Examples:**
      *   *"I bet you twenty pounds."* (This is a **Commissive Offer**. Until accepted, it is merely a declaration of willingness. It creates no obligation.)
      *   *"I offer you the car."* (Same structure. No contract exists until acceptance.)
  *   **Why they fit:** The "deed" is the creation of a *relationship* or *contract*. A relationship cannot be created by one person alone.

  ### 3. The Shifting Verb: Why "Promise" Moves Between Groups

  You noted that a promise sometimes looks complete and sometimes hangs in the air. This is because the word "promise" covers two different underlying structures depending on **consideration**.

  *   **The Moral Promise (Unilateral):** "I promise I won't tell."
      *   Here, the currency is **trust**. The speaker is altering their own moral standing. It sits in the *Unilateral* group. It is done when said.
  *   **The Bargained Promise (Bilateral):** "I promise to deliver if you promise to pay."
      *   Here, the currency is **exchange**. In grievance meetings, this often appears as: "I promise to drop the grievance if you promise a reference."
      *   This sits in the *Bilateral* group. It is an offer of a contract. It hangs in the air until the other side agrees.

  **The Rule:** If the promise is a gift, it is Unilateral. If the promise is a trade, it is Bilateral. In your grievance meetings, confusion often arises because one party treats a bargained promise as if it were a moral gift ("But you *said* you'd do it!"), while the other treats it as a trade that never closed ("We never agreed on the terms").

  ### 4. The Forgiveness Edge Case

  You mentioned *"I forgive you"* is treated differently by different people. This is because forgiveness is an **Ambiguous Performative**.

  *   **Unilateral Forgiveness:** "I release you from my resentment."
      *   This is an internal state made public. It is complete upon utterance. It is about the *victim's* peace.
  *   **Bilateral Forgiveness:** "We are reconciled."
      *   This is a restoration of a relationship. It requires the offender to accept the restoration. If the offender says, "I don't want your forgiveness," the *reconciliation* fails, even if the *forgiveness* was uttered.

  In workplace grievances, this is critical. A manager saying "I forgive you" (Unilateral) may feel they have acted magnanimously. The employee may feel insulted because they interpret it as "We are reconciled" (Bilateral), which they are not ready for. The conflict arises from mismatched categorization of the speech act.

  ### 5. The Retroactive Phenomenon: "We Have Had a Bet Since Tuesday"

  This is the most subtle part of your observation. Why do people speak as though the bet existed on Tuesday, when on Tuesday everyone agreed it did not?

  This is a feature of **Social Ontology** known as **Retrospective Constitution** (or in law, the **Relation Back Doctrine**).

  *   **The Logic:** When the acceptance occurs on Friday, it does not just create a bet *from Friday onward*. It validates the *offer* made on Tuesday as the *opening move of a bet*.
  *   **The Re-description:** Before acceptance, the Tuesday utterance is described as an "offer." After acceptance, the Tuesday utterance is re-described as "the making of the bet."
  *   **Why it happens:** Social facts (like bets, marriages, or contracts) require a history to make sense. If we said, "The bet started Friday," we would have to explain why the delivery being late on Thursday matters. To make the current social fact coherent, we must retroactively endow the past utterance with the force it lacked at the time.

  In your grievance meetings, you will hear this when a deal is finally struck: "As we agreed on Tuesday..." Even if on Tuesday there was no agreement, only a proposal. Once the handshake happens, the timeline collapses. The past is rewritten to support the present reality.

  ### Summary for Your Notes

  When documenting or analyzing these meetings, you can use this framework:

  1.  **Classify the Act:** Is it **Unilateral** (Apology, Moral Promise, Internal Forgiveness) or **Bilateral** (Bet, Offer, Bargained Promise, Reconciliation)?
  2.  **Check for Concurrence:** If Bilateral, explicitly note that the act is *provisional* until the second party speaks. Do not record it as "agreed" until the reciprocal utterance occurs.
  3.  **Watch for Retroactive Language:** Be wary when parties say "We agreed earlier." Verify if the earlier utterance was Unilateral (a statement of intent) or Bilateral (an offer that was accepted).
  4.  **Identify the Mismatch:** Many grievances stem from one party treating a Bilateral act as Unilateral ("I offered, so it's done") or vice versa ("I forgave you, so why aren't we friends?").

  The lack of a single word for this is likely why it causes such persistent friction. People intuitively feel the difference but lack the vocabulary to prove that the "bet" wasn't a bet until the moment it was accepted.
