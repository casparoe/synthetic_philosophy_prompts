      *   *The Break:* PP says *I* must screen off inadmissible evidence. The market *aggregates* it into the price. Deferring to the price means accepting the influence of inadmissible evidence held by others. This violates the spirit of PP, which is about the relationship between *objective chance* and *individual rationality*, not about social epistemology.
