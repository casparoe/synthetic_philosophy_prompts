      *   **Section 3: Act vs. Rule/Information (The Nuance).** Explain that Williams attacks the foundation, not just Act-U with perfect info. Rule-U still subordinates integrity to aggregate good.
      *   **Section 4: Confidence & Uncertainty.** Rate confidence. Identify the "double-counting" origin as the least certain (is it a niche interpretation or pure confusion?).

  7.  **Refining the "Double-Counting" Analysis:**
