answer: |-
  My ranking by promise is Mechanistic Interpretability (Tier 1), Amplification (Tier 1), Ontology Identification (Tier 2), Debate (Tier 2), and Accepting the Gap (Tier 3).

  **Mechanistic Interpretability (Tier 1: Worth a lab's core effort):** This is the only approach that promises to directly read the inaccessible information from the model's weights rather than inferring it from behavior, offering the highest leverage if scaling laws hold. Success here turns the black box into a glass box, allowing us to verify internal reasoning steps that exceed human capability.

  **Amplification (Tier 1: Worth a lab's core effort):** As the foundation for modern RLHF and scalable oversight, this remains the most mature framework for extending human judgment to complex tasks via recursive decomposition. It doesn't necessarily make the information *internal* to the model accessible, but it makes the *validity* of claims accessible enough for safe deployment.

  **Ontology Identification (Tier 2: Worth a dedicated side team):** This is theoretically necessary to map the model's latent structures to human concepts, but it is currently bottlenecked by a lack of tools to locate those structures reliably. It is best viewed as the semantic layer that must sit on top of mechanistic interpretability to solve the Eliciting Latent Knowledge (ELK) problem.

  **Debate (Tier 2: Worth a dedicated side team):** While elegant, debate is effectively a specific instantiation of scalable oversight that relies on the assumption that truth wins arguments more easily than falsehoods, which may not hold against superhuman rhetoric. It is worth pursuing as a complementary protocol to amplification but is less generalizable to non-adversarial tasks.

  **Accepting the Gap (Tier 3: Worth one person monitoring the literature):** This is a crucial fallback policy for risk management but fails the technical goal of making inaccessible information accessible, effectively capping capabilities at human-verifiable levels. It is vital as a safety constraint but offers no path to leveraging superhuman insights safely.

  **Interactions:** Amplification and Debate are best understood as a single family of "Scalable Oversight" methods that verify outputs behaviorally, whereas Mechanistic Interpretability and Ontology Identification form a "Internal Access" family where interpretability provides the tools and ontology provides the map. Progress in Interpretability is likely a prerequisite for Ontology Identification to succeed, while Scalable Oversight may be required to train models safely enough to allow for interpretability research on advanced systems. Accepting the Gap is the contingency plan if both the Oversight and Internal Access families fail to close the verification gap before capabilities become dangerous.
