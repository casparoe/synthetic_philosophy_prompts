  ### Decision Tree: The Heterogeneity of Pleasure

  **Q1.** Is there one single feature shared by all these pleasures, or are they too different to have anything in common?
  *   **No (Nothing Shared):** Go to **Q7**.
  *   **Yes (Common Feature):** Go to **Q2**.

  **Q2.** If shared, is this feature something you can notice from the inside while having the pleasure?
  *   **No (Hidden):** Go to **Q5**.
  *   **Yes (Noticeable):** Go to **Q3**.

  **Q3.** If noticeable, is it a specific "feeling" or "tone" (like a warmth or buzz) distinct from the activity itself?
  *   **Yes (Distinct Feeling):** **Leaf 1: Felt-Quality Hedonism**.
  *   **No (Not a Feeling):** Go to **Q4**.

  **Q4.** If noticeable but not a distinct feeling, is it a matter of how the experience grabs or holds your attention?
  *   **Yes (Attentional):** **Leaf 2: Unnamed**.
  *   **No (Other Phenomenal):** **Leaf 3: Unnamed**.

  **Q5.** If not noticeable from the inside, is the shared feature simply that you want the experience to continue?
  *   **Yes (Desire):** **Leaf 4: Attitudinal Hedonism**.
  *   **No (Not Desire):** Go to **Q6**.

  **Q6.** If not about wanting, is the shared feature a brain mechanism or causal role you cannot detect?
  *   **Yes (Mechanism):** **Leaf 5: Neurofunctional View**.
  *   **No (Other Hidden):** **Leaf 6: Unnamed**.

  **Q7.** If no single feature, do these cases at least overlap by family resemblance?
  *   **Yes (Resemblance):** **Leaf 7: Pluralism**.
  *   **No (No Resemblance):** Go to **Q8**.

  **Q8.** If no resemblance, is "pleasure" a mistaken folk concept that doesn't truly exist?
  *   **Yes (Illusion):** **Leaf 8: Eliminativism**.
  *   **No (Confused Concept):** **Leaf 9: Unnamed**.

