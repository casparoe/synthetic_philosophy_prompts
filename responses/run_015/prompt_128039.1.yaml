answer: |-
  Good morning. I was going to start by standing up here and telling you who I am, and then welcoming you to this space. But given the subject we're here to dissect, that feels like a trick. A standard welcome assumes a stable "I" addressing a stable "you," and by the time we leave this room, I'm hoping we'll agree that neither of those things is as solid as they look.

  For some of you, the self is a problem of logic and continuity. For others, it is a person in Room 304 who asked for their mother yesterday, even though she died twenty years ago. Usually, these two conversations happen in different buildings. Today, they have to happen in the same breath.

  We tend to think of identity as something carried inside the skin, like a flame protected from the wind. But if we look closely at what actually happens when memory begins to fray, the flame doesn't just flicker out. It moves. The story of who a person is stops living solely in their head and starts living in the chart on the wall, in the daughter who brings the photos, in the nurse who knows exactly how they take their coffee even when they can't ask for it.

  There is a pull—a gravity—that holds a life together. Normally, we assume that gravity sits in the center of the person. But what happens when the center can no longer hold the weight?

  This workshop isn't about solving dementia. It's about mapping where the self goes when it can't stay put. We need to talk about whether a story can be held by a network of caregivers and files and fragments, and still be the same story. We need to ask if a self can be scattered without being lost.

  If we treat the person in the bed as the only container for their identity, we miss what's actually sustaining them. And if we treat identity as only a philosophical construct, we miss the grief of watching it dissolve. So, let's not start by asking "who are we." Let's start by asking where the weight is holding, and who is doing the holding.
