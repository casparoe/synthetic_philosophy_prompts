    "rejected_step": "2",
    "diagnosis": "Modal slide and equivocation. Converts a historical claim about how capital shapes technology into an ontological claim about the technology itself. It ignores Marx's distinction between the technical labor process and the social valorization process.",
    "cost_of_rejection": "Abandons technological determinism. Requires analyzing specific social relations (governance, surplus appropriation) to determine exploitation, rather than inferring it solely from technical architecture.",
    "alternative_fix": "Restrict (2) to capitalist social forms: 'If a technology is deployed within capitalist relations of production, it tends to reproduce those relations.' This preserves the critique of capital while allowing for socialist repurposing.",
    "premises_kept": [
      1,
      5
    ],
    "final_verdict": "Survives in modified form"
  }
  ```
