  2. Michael's redemption is framed as moral growth, yet thick Ubuntu implies his original cruel nature was constituted by his hierarchy within hell. Becoming good feels like liberation on screen, but escaping those constitutive demonic ties should logically feel like dying rather than improving.

  3. Eleanor claiming her own identity is shown as finding her true self, but relationally she must sever the constitutive tie to the stolen name that defined her afterlife existence. The show views this as authenticity, whereas Ubuntu illuminates the violent self-loss required to stop being the person others thought she was.

  4. The Judge leaving her isolated authority to help the group is framed as compassionate engagement, but Ubuntu suggests her identity was constituted by that hierarchical relation. The show frames her withdrawal as benevolent, whereas relational personhood implies she loses her selfhood by severing the tie that defined her purpose.

  5. Walking through the final door is presented as peaceful completion, but Ubuntu argues that ending all relations is the ultimate self-loss rather than liberation. The show frames this exit as earned rest, while the 'bad relations' objection insists that without others to hold you, you simply cease to be.
