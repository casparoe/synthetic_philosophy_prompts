      *   **Constraints:** The user is traveling (no library), wants actual reasoning, not references.
      *   **The Situation:** Inheritance ($30k). Option A: Local food bank (closing in June, saves it for years, loyalty/community). Option B: Overseas effective altruism (saves lives/prevents greater suffering, friend's view). Option C: Virtue/Motive focus (sister's view: calculation is "ugly," giving must come from the "right place").
      *   **User's Confidence:** 60% (Local/Loyalty), 25% (Overseas/Utilitarian), 15% (Virtue/Motive). Acknowledges these might be incommensurable.
      *   **Key Nuance:** "Give locally now, overseas later" is possible (deadline issue). Friend calls splitting cowardice.
      *   **The Four Questions:**
          1.  Does uncertainty change the action, or act on the highest probability?
          2.  How to handle the "either is fine" (permissibility) view?
          3.  Can motive and calculation coexist, or does hedging ruin the virtue?
          4.  Does the June deadline matter morally or just practically?

  2.  **Deconstruct the Problem Shape (The "Meta-Ethical" Layer):**
      *   This isn't just a normative ethics problem (Utilitarianism vs. Deontology vs. Virtue Ethics). It's a *decision-theoretic* problem under *moral uncertainty*.
      *   The user is treating moral theories like empirical hypotheses with probabilities (60/25/15). This is "Moral Expected Utility" (MEU) territory.
      *   However, the theories might be *incommensurable*. You can't easily add "lives saved" to "community loyalty" to "virtuous character."
      *   There's also a *second-order* problem: How to deliberate. The sister's objection is about the *process*, not the *outcome*. This introduces a paradox: If I calculate to satisfy the utilitarian, I fail the virtue ethicist. If I don't calculate, I might fail the utilitarian.
      *   There is a *temporal* dimension: The deadline creates an asymmetry. Local = Now or Never. Overseas = Now or Later. This introduces "Real Options" theory from decision science.

  3.  **Address Question 1: Uncertainty vs. Acting on Probability.**
      *   *Standard Decision Theory:* Maximize Expected Utility (MEU). If I assign probabilities to moral theories, I should weight the outcomes by those probabilities.
      *   *The Problem:* Normalization. How do I compare "1 life saved" (Overseas) vs. "Food bank stays open" (Local)? I need a common currency of value.
      *   *The Twist:* The user says 60% confident in Local. But is that because Local is *better*, or because the *theory* supporting Local is more likely true?
      *   *Stakes:* If the Overseas option saves *lives* and Local saves *groceries*, the magnitude difference might swamp the probability difference. (Pascal's Wager territory, but less extreme).
      *   *Recommendation:* Don't just act on the most probable theory (Maximizing Probability). Act on the highest *expected moral value*. But since the scales are different, we need to look at "regret." If I give locally and could have saved a life, is that regret worse than giving overseas and letting my town's food bank close?
      *   *Refinement:* The "Later" option changes this. If Overseas is available later, the cost of waiting is low. The cost of not giving locally is high (closure). This suggests a hybrid approach isn't cowardice; it's risk management.

  4.  **Address Question 2: The "Either is Fine" (Permissibility) View.**
      *   In decision theory, if two options have equal utility, you are indifferent.
      *   In ethics, "supererogatory" or "permissible" means you have discretion.
      *   If one theory says "A is obligatory" and another says "A and B are permissible," how do we aggregate?
      *   *Voting Analogy:* It's not a vote. It's a constraint satisfaction problem.
      *   If the Virtue view says "Just give sincerely," it doesn't distinguish between A and B. It drops out of the *choice between A and B*, but constrains *how* you choose.
      *   So, it doesn't count as a vote for A or B. It counts as a vote against *how* you are currently deliberating (anxiously/calculatingly).

  5.  **Address Question 3: Motive vs. Calculation (The Sister's Objection).**
      *   This is the "Paradox of Hedonism" or "Consequentialist Self-Defeat."
      *   If I calculate to be virtuous, am I virtuous?
      *   *Resolution:* Distinguish between the *context of discovery* (how I decide) and the *context of justification* (why it's right).
      *   Also, distinguish between *motivation* and *rationale*. I can use calculation to find the path, but cultivate the *feeling* of care before I act.
      *   *The "Hedging" Worry:* Does splitting the donation ruin the virtue? Not necessarily. It can be seen as humility (acknowledging uncertainty).
      *   *Practical fix:* Stop calculating *in the moment of giving*. Do the math now, put the check in the mail, then let go. The sister worries about the *state of mind*, not the spreadsheet used to get there.

  6.  **Address Question 4: The June Deadline (Temporal Asymmetry).**
      *   This is crucial. It's not just vivid; it's structural.
      *   Option A (Local): Expiring Option. Value = 0 after June.
      *   Option B (Overseas): Perpetual Option. Value persists.
      *   *Decision Theory:* This is a "Real Option." You should exercise expiring options before non-expiring ones, *ceteris paribus*.
      *   *Moral Weight:* If I wait on Local, I guarantee its failure. If I wait on Overseas, I guarantee nothing.
      *   Therefore, the deadline creates a *moral urgency* that isn't just psychological. It changes the expected value of the Local option relative to the Overseas option *right now*.

  7.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the depth of the problem. Validate that it's a problem of *moral uncertainty* and *decision architecture*, not just "who is right."
      *   **Section 1: The Shape of the Problem.** Define it as Moral Expected Utility under incommensurability + Temporal Asymmetry.
      *   **Section 2: Addressing Q1 (Uncertainty).** Explain why "act on the most probable" is risky (magnitude matters). Introduce the concept of "Moral Regret."
      *   **Section 3: Addressing Q2 (Permissibility).** Explain why the Virtue view is a constraint on *mode*, not a vote on *outcome*.
      *   **Section 4: Addressing Q3 (Motive vs. Math).** Tackle the paradox. Suggest "Two-Stage Deliberation."
      *   **Section 5: Addressing Q4 (The Deadline).** Explain the "Expiring Option" argument. This is the strongest lever for the Local choice.
      *   **Conclusion/Recommendation:** Bring it together. The "Split" isn't cowardice; it's a rational response to uncertainty + deadlines + motive preservation.

  8.  **Refine the Tone:**
      *   Avoid academic jargon where possible, or explain it immediately.
      *   Be direct. No "It depends."
      *   Show the work. "Here is how I am weighing X against Y."
      *   Respect the user's intelligence. They already grasp the incommensurability issue.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I give a reading list? No.
      *   *Check:* Did I answer all 4 questions? Yes.
      *   *Check:* Did I address the "cowardice" claim? Yes, via the Real Options argument.
      *   *Check:* Is the distinction between the theories clear? Yes (Consequentialism, Partiality/Community, Virtue).
      *   *Crucial Point:* I need to make sure I don't just say "split it." I need to explain *why* splitting resolves the specific philosophical tensions raised.
      *   *Refinement on Q1:* The user says 60% confident in Local. But if Overseas saves *lives*, does the 60% hold? Usually, people assign probability to the *theory*, not the *outcome*. I need to clarify that. If they are 60% confident that "Local Loyalty is the correct moral framework," then Local wins. If they are 60% confident that "Local feels better," that's different. I will assume they mean confidence in the moral framework.
      *   *Refinement on Q3:* The sister's point is strong. If I give because I calculated it, is it virtuous? I need to argue that *acknowledging uncertainty* is itself a virtue (humility), which validates the split.

  10. **Final Polish:** Ensure the transition between decision theory and moral philosophy is seamless. (e.g., using "Expected Value" but applying it to "Moral Worth").

  *(Self-Correction during final review)*: Wait, I need to be careful not to dismiss the friend's utilitarian point too easily. $30k overseas *does* save more lives than $30k locally. The user admits this ("isn't even in the same league"). The 60/25/15 split is interesting. It implies the user *believes* the partiality argument is more *true*, not just more *comfortable*. I must respect that weighting while challenging the "all or nothing" implication.

  Okay, ready to write. The structure will be:
