answer: |-
  **JOINT STATEMENT ON THE DOING/ALLOWING DISTINCTION IN END-OF-LIFE CARE**

  **1. Agreed Claims**

  1.  We agree on the classification of paradigm cases: injecting a lethal agent is doing harm; withholding a ventilator is allowing harm.
  2.  The doing/allowing distinction is not identical to the intending/foreseeing distinction, though they often overlap.
  3.  The intuitive moral gap between doing and allowing narrows when non-moral variables (cost, risk, certainty) are carefully controlled.
  4.  In current legal frameworks, active euthanasia is prohibited while withdrawal of life-sustaining treatment is permitted.
  5.  Neither side denies that allowing harm can be morally reprehensible, nor that doing harm can be justified (e.g., in self-defense).
  6.  The distinction persists even when the agent's intention and the patient's outcome are identical across cases.
  7.  The causal chain in allowing harm typically involves a pre-existing threat independent of the agent.
  8.  The causal chain in doing harm typically involves the agent initiating the threat.
  9.  Clinical guidelines currently treat withdrawal of treatment as ethically distinct from administering lethal agents.
  10. Both sides accept that patient autonomy constrains both doing and allowing.
  11. Both sides accept that uncertainty about prognosis complicates the application of the distinction.
  12. Both sides accept that the distinction is not exhausted by the difference in physical movement alone.

  **2. Residual Disagreements**

  | Issue | Distinctionist Formulation | Deflationist Formulation | Judgment |
  | :--- | :--- | :--- | :--- |
  | **Normative Source** | The asymmetry is an irreducible moral constraint that resists consequentialist trade-offs. | The asymmetry is a heuristic summarizing underlying causal, epistemic, and institutional factors. | Substantive |
  | **Trade-offs** | There is no number of allowed deaths that morally outweighs one caused death. | There is an exchange rate where sufficient benefit offsets the cost of causing harm. | Substantive |
  | **Metaphysics** | Agency involves a specific mode of intervention that alters the world's trajectory fundamentally. | Agency is defined by outcome responsibility and counterfactual dependence alone. | Substantive |
  | **Default State** | The natural course of disease is a morally neutral baseline from which deviations are measured. | The natural course is merely one causal path among others with no intrinsic normative status. | Verbal |

  **3. Cruxes and Pre-Registered Predictions**

  **Crux 1: The Equalised-Pair Protocol**
  (i) Can the condition 'the threat is already underway independently of the agent' be stated in non-moral terms?
  (ii) If yes, the Deflationist can reduce the distinction to causal facts; if no, the Distinctionist claims circularity.
  (iii) We accept cases where cost, risk, and outcome are held constant across doing and allowing scenarios.
  (iv) **Prediction:** The Distinctionist predicts that attempts to define 'independent threat' will covertly rely on normative intuitions. The Deflationist predicts a successful physicalist description. **Surprise:** The Distinctionist would be surprised by a robust non-moral definition; the Deflationist would be surprised if all such definitions failed across varied contexts.

  **Crux 2: Timing and Control**
  (i) Is a death's status as done or allowed settled by the agent's conduct at the time she acts, or by the configuration at the time of death?
  (ii) This determines whether the sleeping clinician (see below) is responsible for doing or allowing.
  (iii) **Case:** Clinician A sets an infusion rate unobjectionable at time T1; at T2, while asleep and unreachable, the pump becomes lethal due to patient change. Clinician B notices the same lethal trajectory at T2 and does nothing.
  (iv) **Prediction:** The Distinctionist predicts A's status is fixed at T1 (allowing); the Deflationist predicts status is fixed at T2 based on control capacity. **Surprise:** The Distinctionist would be surprised if A is judged equivalent to a killer; the Deflationist would be surprised if A is judged morally distinct from B.

  **Crux 3: Lexical Priority vs. Exchange Rate**
  (i) Is there some number of deaths allowed that outweighs one death caused?
  (ii) This tests whether the asymmetry behaves like a constraint or a weight.
  (iii) **Argument:** The Million Agents Scenario: if a million agents each allow a share of a death, does it equal one agent causing it?
  (iv) **Prediction:** The Distinctionist predicts no exchange rate (lexical); the Deflationist predicts aggregative weighing. **Surprise:** The Distinctionist would be surprised if intuitions support aggregation; the Deflationist would be surprised if intuitions reject it even at high stakes.

  **Crux 4: Location of Asymmetry**
  (i) Where in the world would the asymmetry have to be located if it exists?
  (ii) This determines if the dispute is about metaphysics or institutional design.
  (iii) **Argument:** Institutional Manageability Argument: rules against doing are easier to enforce than rules against allowing.
  (iv) **Prediction:** The Distinctionist predicts asymmetry persists in ideal theory without institutions; the Deflationist predicts it vanishes. **Surprise:** The Distinctionist would be surprised if the asymmetry disappears in a state of nature; the Deflationist would be surprised if it remains.

  **Crux 5: Clinical Sedation**
  (i) Does deep sedation until death align more with doing or allowing?
  (ii) This tests the boundary in actual palliative practice.
  (iii) **Case:** Palliative Sedation Protocol where death is foreseen but not intended.
  (iv) **Prediction:** The Distinctionist predicts classification as allowing (with strict constraints); the Deflationist predicts classification varies by consequence. **Surprise:** The Distinctionist would be surprised if clinicians classify it as doing; the Deflationist would be surprised if classification is uniform regardless of outcome.

  **4. Falsification Conditions**

  The Distinctionist would count as evidence against her view if controlled empirical studies showed that moral intuitions regarding doing and allowing converge completely when causal, epistemic, and institutional variables are matched. If the intuitive gap vanishes under full information, the claim of an irreducible constraint is undermined.

  The Deflationist would count as evidence against his view if robust cross-cultural moral intuitions persist despite full information regarding all underlying factors. If agents consistently report a moral remainder that cannot be explained by cost, risk, or causation, the reductionist explanation fails.

  **5. Non-Worldly Dispute**

  We acknowledge that part of this dispute is never about the world at all, but concerns conceptual taxonomy. We disagree on whether the category 'doing harm' picks out a natural kind of moral significance or whether it is a useful folk-psychological construct for organizing social rules. If the dispute is solely about which vocabulary best serves public policy, it is pragmatic rather than metaphysical. We agree to investigate whether our disagreement survives the removal of all institutional and linguistic contingencies.
