  **The Episode**

  In 2024, Dr. Aris Thorne proposes a new neuro-cognitive constraint theory ($H$) on phoneme shift, motivated entirely by independent fMRI data on articulatory planning. A specific irregular vowel shift in Proto-Germanic ($E$), documented in every handbook since the 1950s and treated as a brute fact by all standard comparative models ($\neg H$), is immediately derived by $H$'s equations with zero free parameters. Competent linguists agree the entailment is trivial once $H$ is stated, and standard models accommodate $E$ easily by positing ad hoc contact events, making $E$ antecedently probable under rivals. Despite $E$ being old and expected under rivals, the field treats $E$ as strong confirmation of $H$ because $H$ derives the shift from first principles rather than fitting it post-hoc.

  ***

  **The Analysis**

  **Stipulated Credences:**
  *   $P(E) = 1.0$ (The shift is a documented historical fact; no competent researcher assigns it less than certainty).
  *   $P(H) = 0.1$ (The theory is new and speculative).
  *   $P(E|H) = 1.0$ (The theory entails the fact; Block 1 satisfied).
  *   $P(E|\neg H) = 1.0$ (Rivals accommodate the fact easily; Block 2 satisfied).
      *   *Note:* Mathematically, if $P(E)=1$ and $0 < P(H) < 1$, then $P(E|\neg H)$ must equal 1.

  **Approach 1: Straight Conditionalization**
  $$P(H|E) = \frac{P(E|H)P(H)}{P(E)} = \frac{1.0 \times 0.1}{1.0} = 0.1$$
  **Verdict:** No confirmation. The posterior equals the prior. The machinery grinds to a halt because the denominator ($P(E)$) absorbs all the weight of the evidence.

  **Approach 2: Learning the Entailment**
  This fix suggests we conditionalize not on $E$, but on the proposition "$H$ entails $E$" ($H \vdash E$). However, Block 1 specifies the entailment is obvious the moment $H$ is stated. The agent learns $H$ and $H \vdash E$ simultaneously. There is no separate update step for the logical relation. If we treat "$H \vdash E$" as the evidence, its probability is also 1 once $H$ is understood.
  **Verdict:** No confirmation. The logical fact is as "old" as the theory itself.

  **Approach 3: The Counterfactual Fix**
  We ask: "What would my credence in $E$ have been had I not known it?" Since $H$ entails $E$, $P_{\text{cf}}(E|H) = 1$. However, Block 2 specifies that under rival theories, $E$ was also antecedently probable (they accommodate it via contact events). Thus, $P_{\text{cf}}(E|\neg H) \approx 1$. The Likelihood Ratio is $1/1$.
  **Verdict:** No confirmation. The counterfactual surprise is low across the board, so $E$ discriminates between nothing.

  **The Confirmatory Feature**
  The feature carrying the intuitive weight is **derivation versus accommodation**. $H$ derives $E$ from independent physical constraints (fMRI data), whereas $\neg H$ accommodates $E$ via post-hoc historical parameters (contact events). The intuition is that $H$ is confirmed because it *risks* falsification on $E$ without tuning, while $\neg H$ does not.

  **Evaporation Test:**
  If we remove this feature—suppose $H$ was tuned specifically to fit $E$ (violating Block 3)—the intuitive confirmation vanishes. The case collapses into ad hocery. This shows the confirmation relies on the *history of construction*, not just the logical relation between $H$ and $E$ at the time of evaluation. None of the three standard Bayesian approaches capture the "history of construction" without modifying the partition of the hypothesis space or the evidence description.

  **The Strongest Objection**
  *The Partition Objection:* There is no problem here; you have described $E$ too coarsely. $E$ is not "The vowel shift exists." $E$ is "The vowel shift exists *and* has structural properties $S$ that are unlikely under contact-event models." If we describe $E$ precisely, $P(E|\neg H)$ drops significantly below 1. Ordinary Bayesian updating then yields $P(H|E) > P(H)$. The problem arises only because you lumped the specific structural properties into the "background" rather than the "evidence."

  *Evaluation:* This objection **relocates the difficulty** rather than defeating the case. In the scenario, the structural properties $S$ *were* known in the 1950s. They were in the handbooks. So $P(E_{\text{precise}}) = 1$ still holds. The objection works only if we claim researchers *should have* treated $S$ as uncertain back then, which contradicts the "Old Evidence" constraint. It solves the math by denying the phenomenology of the case (that the evidence was treated as certain).

  **Feasibility of the Blocking Conditions**
  I must state explicitly: **The three blocking conditions cannot be jointly satisfied by any case in which Bayesian confirmation is real.**
  If $P(E) = 1$ (Old Evidence) and $P(E|H) = 1$ (Entailment), then Bayes' Theorem dictates $P(H|E) = P(H)$ regardless of Condition 2. Mathematical confirmation is zero by definition. Furthermore, if Condition 2 holds ($P(E|\neg H) \approx 1$), then *intuitive* confirmation is also suspect; if rivals predict $E$ just as well as $H$ does, $E$ provides no reason to prefer $H$. The intuition that $H$ is confirmed relies on the hidden premise that rival accommodation is "cheaper" or "less robust" than $H$'s derivation, which is a claim about model complexity, not likelihoods.

  **Relaxation and Best Example**
  I would relax **Condition 2** (Rivals antecedently expect $E$). Genuine confirmation requires $E$ to be more probable under $H$ than under $\neg H$.
  *Relaxed Case:* **Mercury's Perihelion.**
  *   $E$: The 43 arcseconds/century discrepancy (Known 1859).
  *   $H$: General Relativity (1915).
  *   $\neg H$: Newtonian Mechanics + known auxiliaries.
  *   *Change:* Under $\neg H$, $E$ was *improbable* (it required an unseen planet Vulcan, which was never found). $P(E|\neg H)$ was low.
  *   *Result:* $P(H|E) \gg P(H)$.
  This satisfies the intuition and the math, but it fails your specific constraint that rivals must also expect $E$. Your constraint creates a scenario where Bayesianism *should* fail, because there is no probabilistic discrimination to be had. The "Problem of Old Evidence" is only a problem for Bayesianism when we insist that confirmation occurs *despite* the lack of probabilistic discrimination.
