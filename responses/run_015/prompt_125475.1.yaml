answer: |-
  Teleosemantics maps to your vocabulary as follows. Millikan's 'proper function' is the objective function minimised during SGD; content is the data manifold feature that reduced loss via selection history. The 'consumer mechanism' is the downstream head or policy utilising the feature. Dretske's 'indicator' is mutual information between activation and input during training. Neander's 'normal conditions' are the IID training distribution. The forward-looking view equates content with generalisation performance on the test set or deployment environment.

  **Case 1: Museum Checkpoint**
  *Etiological:* Content is 'cow-on-grass'. Selection history favoured weights responding to grass to minimise loss. The feature's proper function is fixed at checkpointing, regardless of future use.
  *Forward-looking:* Content is null. No future consumption means no function.
  *ML Vocabulary:* Feature $f$ has high saliency for grass textures. Training loss low; OOD loss (cow on sand) high.
  *Divergence:* Etiological grants content based on past gradient updates. Forward-looking denies it without future utility. ML describes the correlation without committing to 'aboutness'.

  **Case 2: Swampnet**
  *Etiological:* No content. No selection history, no proper function.
  *Forward-looking:* Content is 'cow'. It performs the function now.
  *ML Vocabulary:* Identical weights and activations as the trained net. Functionally equivalent.
  *Divergence:* Etiological denies semantics to untrained weights despite identical computation. ML treats them as identical models. Forward-looking aligns with ML here.

  **Residue Report**
  *Clean:* Optimisation pressure maps to selection pressure. Training distribution maps to normal conditions.
  *Distorted:* Misrepresentation. In ML, error is scalar loss. In teleosemantics, it is a norm violation (failing to do what you were selected for). A false positive is just loss in ML; it is a malfunction in Millikan's view.
  *Untranslatable:* Normativity. ML describes behaviour; teleosemantics prescribes function. Proximal vs. Distal: ML sees collinear features (grass/cow); teleosemantics demands a fact about which is the true content.

  **Verdict**
  The residue is a defect in your vocabulary. Teleosemantics highlights that causal genesis matters for semantics, not just current topology. Your vocabulary treats weights as static parameters, ignoring the gradient history that imbues them with function. This matters for interpretability: a mesa-optimiser arising from SGD differs semantically from one hard-coded, even if behaviour matches. The philosophical 'indeterminacy' is actually an engineering blind spot regarding causal provenance.

  To fix this, add 'Gradient Provenance' to your model cards. Track which training samples contributed to specific weight updates via influence functions. Measure the causal chain from data to parameter. This makes selection history empirically tractable. Without it, you cannot distinguish Swampnets from trained nets in principle, leaving you blind to risks where training history dictates behaviour under distributional shift. You lack the vocabulary to distinguish a model that *knows* cows from one that merely *matches* cows. Implement provenance tracking to recover the normative force of 'proper function' as 'optimisation trajectory'.
