answer: |-
  # JOINT STATEMENT ON THE RATIONALITY OF PASCAL'S MUGGING
  **Signed by:** The Binding Theorist & The Non-Binding Theorist
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Expected Utility and Tail Risks

  ### I. Agreed Claims

  1.  **The Scenario:** We define "Pascal's Mugging" as a decision scenario where an agent is presented with a demand (cost $C$) accompanied by a threat or promise of consequence (utility impact $U$) such that the product of the subjective probability ($P$) and the utility ($U$) exceeds the cost ($P \times U > C$), solely because $U$ is sufficiently large, despite $P$ being sufficiently small.
  2.  **Scope of Inquiry:** This collaboration addresses the *normative* question of what a perfectly rational agent ought to do in the idealized scenario, not the *descriptive* question of what humans typically do. We bracket practical heuristics regarding street scams, fraud detection, or the psychological likelihood of deception.
  3.  **Rejection of Intuitionism:** Both parties agree that appealing to the intuition that "paying feels absurd" is insufficient. A resolution requires identifying a specific failure in the probability assignment, the utility function, or the decision rule, rather than merely asserting that the conclusion is counterintuitive.
  4.  **Non-Triviality:** Both parties agree that this problem is not dissolved by simply assigning $P = 0$. The scenario stipulates that the threat is logically possible and assigned a non-zero credence by the agent prior to the application of any "anti-mugging" discounting principle.
  5.  **Stakes:** We agree that the resolution of this dispute has implications for existential risk assessment, long-termist philanthropy, and the foundations of decision theory under uncertainty.

  ### II. Statement of Disagreement

  While we agree on the setup and the inadequacy of simple intuition, we diverge on the binding nature of Expected Utility (EU) maximization in the limit of large $U$ and small $P$.

  *   **The Binding Position:** A rational agent is obligated to maximize subjective expected utility. If an agent refuses to pay when $P \times U > C$, they are violating the axioms of rational choice (specifically, dominance or continuity) and are vulnerable to diachronic exploitation (e.g., money pumps), unless they can demonstrate that $P$ is objectively lower than required to satisfy the inequality.
  *   **The Non-Binding Position:** A rational agent is permitted (or required) to refuse payment even when $P \times U > C$. The expected value calculation fails to bind because either (a) the epistemic probability of such extreme claims is systematically overestimated and should be discounted by a complexity penalty, (b) utility functions for finite agents must be bounded, or (c) rationality permits decision criteria (such as risk-weighting or maximin) that are insensitive to low-probability, high-stakes tails.

  ### III. Identification of Cruxes

  We have identified three specific sub-questions (cruxes) where empirical or theoretical resolution would cause at least one party to revise their position.

  1.  **Epistemic Dilution (The "Why Me?" Problem):** Does the existence of many potential targets legitimately drive the conditional probability of the threat being genuine and directed at the specific agent down to a level that negates the expected value?
  2.  **Coherence of Unbounded Utility:** Is an unbounded utility function coherent for a rational agent, or does it lead to mathematical pathologies (such as undefined expectations) that necessitate bounding utility?
  3.  **Decision Criterion:** Is Expected Utility Maximization the sole criterion for rationality, or are robustness criteria (e.g., minimax regret, satisficing, risk-weighted expected utility) rationally permissible even when they diverge from EU?

  ### IV. Cruxes Table

  | Crux | Agreed Case or Argument Bearing on Crux | Binding Theorist's Prediction | Non-Binding Theorist's Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Epistemic Dilution** | **The Multi-Target Scenario:** A mugger approaches one agent in a world of $N$ agents. The mugger claims they can harm *someone*. <br> **Question:** Does the probability that *this* agent is the specific target scale as $1/N$ sufficiently to offset $U$? | The probability conditional on the interaction having occurred is what matters. The $1/N$ prior is updated by the fact of the encounter. $P$ remains high enough to bind if $U$ is sufficiently large. | The prior probability of a genuine threat capable of affecting $N$ people being directed at *you* specifically scales as $1/N$ (or faster). As $U$ grows, the complexity of the claim grows, driving $P$ down faster than $U$ goes up. |
  | **2. Unbounded Utility** | **The St. Petersburg Variant:** A game offers a payoff of $2^n$ utility with probability $1/2^n$. <br> **Question:** Does a rational agent pay any finite amount to play this game? | Yes. Unbounded utility is coherent. If the expectation is infinite, the agent should pay any finite cost. Refusing implies an arbitrary bound on value. | No. Unbounded utility leads to undefined expectations and decision paralysis. A rational agent must have a bounded utility function, capping the maximum $U$ and preventing the mugging. |
  | **3. Decision Criterion** | **The Risk of Ruin:** A choice between a 100% chance of losing \$100 vs. a 0.0000001% chance of losing all future value (infinity). <br> **Question:** Is it rational to take the gamble if the EU is slightly positive? | Yes. If EU is positive, refusing is irrational. Rationality requires consistency across all probabilities, however small. | No. Rationality permits "tail-risk aversion." Protecting against ruin (or extreme loss) takes precedence than EU maximization in the tails. Robustness trumps expectation. |

  ### V. Note on Verbal Dispute

  We explicitly acknowledge a partial verbal dispute regarding the definition of "Rationality."

  *   **Substantive Disagreement:** We disagree on the **action** in the idealized case. The Binding Theorist asserts the agent *must* pay; the Non-Binding Theorist asserts the agent *must not* (or is permitted not to). This is not merely semantic; it affects how we model agents in high-stakes AI alignment and existential risk policy.
  *   **Verbal Overlap:** In **real-world** applications, both parties often recommend the same action ("Do not pay the mugger"). The Binding Theorist argues this is because the real-world probability $P$ is genuinely too low (the mugger is lying), whereas the Non-Binding Theorist argues this is because the decision rule does not bind even if $P$ were non-negligible.
  *   **Resolution:** We agree that if the Binding Theorist can prove that $P$ is always vanishingly small in reality due to complexity penalties (Crux 1), the practical disagreement dissolves. However, if the Non-Binding Theorist can prove that EU maximization is structurally flawed (Crux 2 or 3), the Binding Theorist must abandon standard decision theory even in principle.
