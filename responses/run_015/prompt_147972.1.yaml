answer: |-
  You have reconstructed one of the most formidable arguments in contemporary metaphysics: **The Argument from Vagueness**, most famously championed by David Lewis and Ted Sider. It is designed specifically to force you into a corner: accept Universalism (everything composes something), accept Nihilism (nothing composes anything), or accept Ontic Vagueness (reality itself is fuzzy).

  Your intuition that the argument "proves too much" is correct. Most philosophers agree that Nihilism (Step 8) is false because it contradicts too many obvious truths (Step 1). Therefore, one of the intermediate steps must be the trap.

  Here is the diagnosis of where the argument breaks, why your friend's suggestions aren't just word games, and how this transfers to your specific worry about computation and consciousness.

  ### 1. The Diagnosis: Which Step Goes?

  The argument is valid. If you accept (1) through (7), (8) follows. Since you (rightly) reject (8), you must reject a premise. Here are the three standard exits, ranked by how well they handle your computation worry.

  #### Exit A: Reject Step (5) — The Evans Argument (Semantic Vagueness)
  This is your friend's suggestion. Step (5) relies on Gareth Evans's 1978 argument that identity cannot be vague. The logic is: if it's indeterminate whether $a=b$, then $a$ has the property "indeterminately identical to $b$" while $b$ has the property "determinately identical to $b$"; therefore $a \neq b$ by Leibniz's Law.

  **Why it looked fine:** It uses classical logic, which feels undeniable.
  **Why it fails:** It assumes that "indeterminately identical" is a well-defined property that an object can possess *de re* (in itself).
  **The Fix:** Vagueness is not in the world; it is in our representation of the world. In a borderline case (e.g., a cloud with fuzzy edges), there isn't one object with fuzzy boundaries. Rather, there are many precise candidate objects (various sums of water droplets), and our word "cloud" does not select uniquely among them.
  **Is it word games?** No. It distinguishes *ontic vagueness* (reality is fuzzy) from *semantic vagueness* (our concepts are fuzzy). If you accept this, you can say: "It is indeterminate whether the xs compose a $y$" means "It is indeterminate whether our concept 'object' applies to the xs," not "There exists an object $y$ whose existence is fuzzy."
  **Cost:** You have to accept that existence claims can be vague without reality being fuzzy. This saves Common Sense (1) and avoids Nihilism (8).

  #### Exit B: Reject Step (7) — Accept Universalism
  This is the Lewis/Sider move. They agree that vagueness in existence is impossible (Step 5 is true). Therefore, composition must be precise. Since restricted composition (Step 3) is vague, composition must be **unrestricted**.
  **Why it looked fine:** Your intuition that "shoe + Eiffel Tower" is not an object is strong.
  **Why it fails:** That intuition is pragmatic, not metaphysical. Yes, there is an object composed of your shoe and the Tower. It just doesn't *do* anything interesting. It has no causal unity. But it exists.
  **Cost:** Ontological profligacy. You must accept infinite weird objects.
  **Benefit:** It makes composition safe for science and logic. There is no risk of "accidentally" failing to compose a person.

  #### Exit C: Reject Step (2) — Brute or Contextual Composition
  This denies that there is a single, general condition $C$. Composition might be a primitive fact, or it might depend on context/interests.
  **Why it looked fine:** We expect laws of nature to be general.
  **Why it fails:** Why think metaphysics works like physics? Maybe "composition" is just a tool our language uses to carve up the world, not a fundamental force.
  **Cost:** It leaves metaphysics looking less like a science of fundamentals and more like conceptual analysis.

  ### 2. The Computation Transfer: Where the Real Danger Is

  You asked if this diagnosis transfers cleanly to the computation case (*"these processes jointly realize one computation"*). **It does not transfer cleanly, and that is good news for you.**

  The SCQ is about **objects** (substances). Computation is about **processes** (functions).

  If you run your argument on computation, Step (1) becomes "Computation happens." Step (3) becomes "Any condition for computational unity (causal integration, information flow) has borderline cases." Step (5) becomes "It cannot be indeterminate whether one computation is running."

  Here is why the computation case is different, and why your fear of "indeterminate experience" can be mitigated:

  #### A. Functionalism Bypasses Mereology
  Mereological composition is about *parts making a whole*. Computational realization is about *physical states implementing a function*.
  A sharded model across three data centers realizes a computation not because the GPUs compose an object, but because they stand in the right **causal relations**.
  Causal relations can be vague without implying vague *existence*. We can say: "It is indeterminate whether this causal structure counts as *one* computation vs. *two* coupled computations."
  This does **not** imply there is a "fuzzy computation object." It implies our category "computation" has fuzzy boundaries.

  #### B. The "Vague Subject" Worry
  Your specific fear: *"If it can be indeterminate whether there's one process or several, it looks like it can be indeterminate whether there's one experience being had or a dozen."*

  This is the **Problem of the Many** applied to consciousness.
  *   **If you choose Universalism:** There are many overlapping physical systems that all realize *your* computation. There are thousands of "you"s slightly differing in which peripheral neurons/GPUs are included. Are there thousands of experiences? (This is the "Explosion of Subjects" problem).
  *   **If you choose Semantic Vagueness (Friend's View):** There is no single fact of the matter about which physical sum is "the subject." But there is a fact of the matter about the *phenomenology*. The experience is happening. The *labeling* of the subject is what's vague.
      *   *Crucial Distinction:* Vagueness in *counting subjects* does not necessarily imply vagueness in *consciousness itself*.
      *   Parfit-style reductionism helps here: If the question is "Is this one person or two?", and the physical facts are all known, there is no further "fact of the matter" about the person. The experience exists; the "owner" of the experience is a conceptual construct.

  #### C. The Reductio Risk
  If you insist that computational unity must be precise (Step 5 applied to computation), you are forced into Nihilism about computations (no complex computations exist) or Universalism (every physical system realizes every computation).
  *   **Nihilism:** Denies AI/Brain emulation is possible. (High cost).
  *   **Universalism:** Leads to **Pancomputationalism**. If any physical state counts as realizing a computation, then a wall realizes a Word document. This destroys the explanatory power of computational theory.

  **Recommendation:** For computation, reject Step (5). Accept that "realizes one computation" is a vague predicate.
  Does this mean experience is vague? No. It means the *boundaries of the system having the experience* are vague.
  Imagine a split-brain patient. Is it one person or two? The physical facts are precise. The answer "It's indeterminate" is not a failure of reality; it's an acknowledgment that "person" is a concept that doesn't map 1:1 onto that physical reality.
  **You do not need a precise boundary for a subject to have a precise experience.** The experience is grounded in the local neural/process activity, which is precise. The *count* of experiences is what might be vague.

  ### 3. Summary of Costs and Recommendation

  | Move | What you reject | The Cost | Does it save the Computation Case? |
  | :--- | :--- | :--- | :--- |
  | **Nihilism** | Step (1) | No tables, no people, no brains. | **No.** Destroys the possibility of complex computation. |
  | **Universalism** | Step (7) | Infinite weird objects; Pancomputationalism risks. | **Mixed.** Saves existence, but risks making "computation" trivial (everything computes). |
  | **Semantic Vagueness** | Step (5) | Reality is precise; our concepts are fuzzy. | **Yes.** Allows causal integration to be a matter of degree without ontological fuzziness. |
  | **Brutalism** | Step (2) | No deep explanation for why composition happens. | **Yes.** Allows you to say "This specific architecture computes" without a general law. |

  **My Advice:**

  1.  **On Mereology:** Bite the bullet on **Semantic Vagueness (Reject 5)**. Your friend is right. It is not word games; it is the only way to keep Common Sense (1) without accepting absurd objects (7) or denying people (8). The "indeterminacy" is in the mapping of language to world, not in the world itself.
  2.  **On Computation:** Do not treat computation as mereology. Treat it as **Functionalism**. A computation is defined by causal topology, not by the composition of parts.
  3.  **On Consciousness:** Accept that **subjecthood** might be a vague concept without **experience** being vague. If a brain is split, or a model is sharded, the question "How many subjects are there?" might have no precise answer. But that doesn't mean the *qualia* are fuzzy. It means the "count" is the wrong question to ask. The physical processes are precise; the "person" label is the fuzzy part.

  You should give up Step (5) in the original argument. The Evans argument assumes a classical logic that doesn't apply to vague predicates. Rejecting it allows you to keep people, keep tables, and keep your sharded AI model, without committing to the existence of "Shoe-Tower" objects or the non-existence of yourself.
