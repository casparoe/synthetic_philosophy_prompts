answer: |-
  Sounds like a proper row, and honestly, you've stumbled onto one of the classic puzzles of political philosophy without realising it. You're arguing about **Chesterton's Fence**.

  The gist is: don't remove a fence until you know why it was put up in the first place.

  **Your Mate's Position (The Conservative Principle)**
  He's arguing from *epistemic humility*. His point is that society is complex and we're often ignorant of the hidden functions rules serve. That Tuesday restriction might prevent a specific clash—maybe deliveries happen on Tuesdays, or the power grid gets overloaded. If you bin it because you can't see the reason, you risk reintroducing a problem you've forgotten about. He's committing to **stability over efficiency**. If he wins, you avoid unseen chaos, but you risk stagnation and keeping daft rules alive forever.

  **Your Position (The Rationalist Principle)**
  You're arguing from *functional utility*. If a rule doesn't serve an obvious purpose now, it's dead weight. You're prioritising **current logic over past precedent**. If you win, you gain efficiency and clarity, but you accept the risk that you might break something invisible. Your impatience is justified if the cost of the rule outweighs the benefit.

  **The Catch: Mr Patel**
  Here's where your argument actually wins on the specifics. Chesterton's Fence applies to *functional* barriers. A rule requiring sign-off from a retired bloke isn't a fence; it's a bureaucratic ghost. It's procedurally broken. Your mate is right that we should respect old structures, but he's wrong to defend a mechanism that literally cannot function.

  **The Shape of the Disagreement**
  You're fighting about **burden of proof**.
  *   He says: Prove the rule is useless before removing it.
  *   You say: Prove the rule is useful before keeping it.

  **What You're Committing To**
  If you push this through and bin the rule: you're establishing that the committee values current efficiency and has the authority to declare old rules obsolete. You might save time, but you need to check if Tuesdays are actually chaotic afterwards.

  If you let it slide: you're establishing that tradition holds veto power over logic, even when the tradition is impossible to follow.

  **Verdict**
  Your mate is right about the *principle* (don't be rash), but you're right about the *practice* (this specific rule is absurd). The compromise? Keep the Tuesday restriction if there's a good reason, but bin the Mr Patel sign-off immediately. That respects the fence without worshipping the ghost.
