      *   **Task:** Identify tensions between the 7 points, rank them by severity, suggest repairs/drops, distinguish real vs. apparent tensions, and flag philosophical consensus vs. contestation.
      *   **Tone:** Rigorous, analytical, honest about uncertainty, not patronizing, respectful of the creative process.
      *   **Constraints:** Don't just flag everything as problematic. Identify which one might actually need to be dropped. Distinguish settled vs. contested philosophy.

  2.  **Analyze the 7 Points:**
      *   (1) Queueing = Moral Obligation (Fairness/Coordination).
      *   (2) Local Specificity = Mandatory for Guests (Hospitality/Respect).
      *   (3) Jaywalking = Permissible if no harm (Harm Principle/Legal Moralism).
      *   (4) US Tipping = Obligatory (Compensation for Exploitation).
      *   (5) Non-Tipping Countries = No Obligation (even if low wages).
      *   (6) Immoral Norms = Do Not Follow (Higher Moral Law).
      *   (7) Empty Escalators = Follow Anyway (Symbolic Respect/Rule Worship).

  3.  **Identify Tensions (Brainstorming & Pairing):**

      *   *(1) & (3):* Queueing is moral even if "empty" (implied by "mutually beneficial scheme" generally), but Jaywalking is fine if empty. *Tension:* Why is one coordination scheme binding regardless of immediate harm, and the other not?
      *   *(2) & (3):* "Locals set the terms" vs. "I ignore traffic laws if empty." If locals expect queueing *and* jaywalking, (2) says follow both, (3) says ignore traffic. *Tension:* Guest obligation vs. Personal moral calculus.
      *   *(2) & (6):* "Locals set terms" vs. "Won't follow immoral norms." *Resolution:* (6) usually trumps (2), but where is the line?
      *   *(4) & (5):* Tipping in US (yes) vs. Tipping elsewhere (no), despite low wages in both. *Tension:* Consistency regarding worker welfare. Why is the US worker's wage my problem but not the Thai worker's?
      *   *(1) & (7):* Queueing is moral because of *fairness/benefit*. Escalator is followed even if *no difference*. *Tension:* Is the obligation consequentialist (harm/benefit) or deontological (rule-following)?
      *   *(3) & (7):* Jaywalking (ignore rule if no harm) vs. Escalator (follow rule if no harm). *Major Tension:* This is the biggest inconsistency in the "Harm/Coordination" logic.

  4.  **Evaluate Severity of Tensions:**

      *   **High Severity:** (3) vs. (7). One says "rules don't bind without harm," the other says "rules bind even without harm." This is a direct contradiction in the underlying theory of obligation.
      *   **High Severity:** (4) vs. (5). Why is the US server's wage my moral duty but not the non-US server's? This looks like moral arbitrariness or nationalism unless explained.
      *   **Medium Severity:** (1) vs. (3). Queueing is a coordination scheme. Traffic lights are a coordination scheme. Why is one binding (1) and the other contingent on traffic (3)?
      *   **Low/Apparent Tension:** (2) vs. (6). This is a standard conflict of laws (positive vs. natural law). Most ethicists agree (6) trumps (2).
      *   **Low/Apparent Tension:** (1) vs. (2). These reinforce each other mostly.

  5.  **Drafting the Audit (Iterative Process):**

      *   *Introduction:* Acknowledge the strength of the framework. It's coherent enough for a character, but philosophically leaky for a panel.
      *   *Categorization:* Group by "Real Tensions" (Logical contradictions) and "Apparent Tensions" (Resolvable).
      *   *The Big One (3 vs 7):* This is the "Harm Principle" vs. "Rule Worship." If you follow the escalator rule just because it's the rule (7), why don't you follow the traffic light rule just because it's the rule (3)?
          *   *Repair:* Either admit you're a rule-follower (drop 3) or a consequentialist (drop 7). Or distinguish "coordination" (queue/escalator) from "safety" (traffic). But (3) explicitly says "Traffic laws bind only when... someone is affected."
          *   *Verdict:* This is the one to drop or heavily qualify. Probably (7) is the weak link if the character is pragmatic. Or (3) is the weak link if the character is civic-minded. Given (1) is about "fairness," (3) fits better with (1) than (7) does. (7) feels like "being a good guest," which clashes with the "moral obligation" of (1).
      *   *The Wage One (4 vs 5):* This is "Systemic Complicity" vs. "Local Custom."
          *   *Analysis:* In the US, tipping *is* the wage. In Japan, it's an insult. In (5), if wages are low, why no tip?
          *   *Repair:* Distinguish between "fixing a broken system I'm participating in" (US) vs. "charity" (Elsewhere). In the US, not tipping is actively participating in wage theft. Elsewhere, the employer is the thief, not the customer.
          *   *Verdict:* Defensible, but needs nuance.
      *   *The Guest One (2 vs 3):* "Locals set terms" vs. "I decide when traffic laws apply."
          *   *Analysis:* If locals expect jaywalking (as per the novel's city), (2) says do it. (3) says do it. No tension there. But if locals *don't* jaywalk, (2) says wait, (3) says cross if empty.
          *   *Verdict:* (3) undermines (2). (2) is the "Guest" principle. (3) is the "Autonomous Agent" principle.
      *   *The Queue vs. Traffic (1 vs 3):* Both are coordination. Why different treatment?
          *   *Analysis:* Queueing is purely social fairness. Traffic is safety + flow.
          *   *Verdict:* Can be reconciled by emphasizing the "harm" aspect of traffic vs. the "fairness" aspect of queues.

  6.  **Addressing the Novel's Specific Scenes:**
      *   *Object Queue:* Fits (1) and (2).
      *   *Legal Jaywalking:* Fits (3). But does it fit (2)? If locals do it, (2) says do it. (3) says do it. Consistent.
      *   *Conflict:* What if the visitor *doesn't* want to jaywalk? (3) allows it. (2) encourages it.
      *   *Conflict:* What if the visitor sees an object queue but thinks it's inefficient? (1) says it's moral. (2) says do it.

  7.  **Philosophical Flagging:**
      *   Need to mention Rule Utilitarianism vs. Act Utilitarianism.
      *   Need to mention Social Contract Theory.
      *   Need to mention Moral Relativism vs. Universalism.
      *   Be clear: Philosophers do not agree on the moral status of conventions.

  8.  **Structuring the Response:**
      *   **Executive Summary:** Validate the framework, state the biggest risk.
      *   **Section 1: The Critical Tensions (Ranked).** Focus on 3 vs 7, 4 vs 5, 1 vs 3.
      *   **Section 2: The Apparent Tensions.** 2 vs 6, 2 vs 3 (in specific contexts).
      *   **Section 3: The Novel's Test Cases.** Apply the audit to the Object Queue and Legal Jaywalking.
      *   **Section 4: Philosophical Status.** What is settled vs. contested.
      *   **Section 5: Recommendation.** Which point to drop/modify.

  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I initially thought (4) vs (5) was the biggest tension. But (3) vs (7) is more fundamental to the *theory* of rules. (4)/(5) is about specific economic contexts. (3)/(7) is about *why* we follow rules. I should rank (3)/(7) higher.
      *   *Correction on (7):* The user says "I'd feel like a jerk." That's an internal emotional state, not necessarily a moral claim. But they frame it as "I follow..." implying obligation. I need to probe if (7) is moral or prudential.
      *   *Correction on (2):* "Locals set the terms." This is strong cultural relativism. It clashes with (3) which is individual moral judgment.
      *   *Novel Context:* The city has *legal* jaywalking. So (3) says "Fine." (2) says "Do it." (1) says "Queue with objects."
      *   *The "Drop":* If I have to tell them what to drop, (7) is the easiest sacrifice to save consistency with (3). OR, (3) is the sacrifice to save (7). Given the character seems to care about fairness (1) and exploitation (4), (3) feels more aligned with a "harm-based" ethics than (7) which is "rule-based." However, (7) supports (2).
      *   *Wait, looking closer:* (1) says Queueing is *moral*. (7) says Escalator is followed even if *no difference*. If (1) is moral because of *fairness*, (7) has no fairness component if empty. So (7) is the outlier. It's "Rule Worship." (3) is "Harm Principle." These are incompatible foundations.
      *   *Decision:* (3) and (7) are the fatal clash. (7) is the weakest link philosophically if the rest of the system is based on harm/fairness.

  10. **Final Polish:** Ensure tone is collaborative ("audit") not prescriptive ("fix this"). Ensure philosophical distinctions are clear (e.g., Consequentialism vs. Deontology). Make sure to answer the specific prompt about "settled vs contested."

      *(Self-Correction on Philosophical Consensus)*: There is almost *no* consensus on the moral weight of conventions. I must be careful not to say "Philosophers agree X." Instead, "Mainstream liberal theory tends toward X, but communitarians argue Y."

      *(Final check on the "Drop" recommendation)*: The prompt asks "which one I actually have to drop." I should be decisive. (7) is the most expendable if they want to keep the "Harm/Fairness" core. Or (3) if they want to keep the "Good Guest" core. Given the novel themes (conventions), (7) reinforces the theme better, but (3) is more defensible. Actually, (3) is more defensible in a modern secular context. (7) sounds like "tradition for tradition's sake." I will suggest modifying (7) to align with (2) rather than standalone morality.

      *Wait, re-reading (7):* "I'd feel like a jerk not to." This is about *virtue* or *social signaling*, not objective morality. I can use that to dissolve the tension. If (7) is about "not feeling like a jerk" (internal virtue) and (3) is about "wrong" (external harm), they can coexist. I should highlight this distinction.

      *Okay, let's look at (4) vs (5) again.* This is actually the most politically vulnerable point for a festival panel. "Why do you care about American servers but not Vietnamese servers?" This is the "Panel Attack" vector. The philosophical tension is (3) vs (7), but the *political* vulnerability is (4) vs (5). I need to mention both.

      *Okay, Plan:*
      1. Rank tensions by "Philosophical Coherence" vs "Political Vulnerability."
      2. Highlight (3) vs (7) as the logical contradiction.
      3. Highlight (4) vs (5) as the ethical consistency problem.
      4. Highlight (2) vs (3) as the "Guest vs. Agent" problem.
      5. Dissolve (1) vs (2) and (2) vs (6).
      6. Address the Novel Scenes.
