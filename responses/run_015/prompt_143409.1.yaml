answer: |-
  This is one of the oldest and deepest problems in philosophy. You are essentially asking about the ontology of value: **Does value exist "out there" in the universe (Realism), or is it generated by minds that experience things (Subjectivism/Relationalism)?**

  Here is a breakdown of your cases, a proposed unifying principle, and a verdict on which gut feeling to trust.

  ### 1. The Math Distinction: Truth vs. Reasons
  First, let's clear up the `2+2=4` case, because it's a category error.
  *   **Truth** is descriptive. It describes how things *are*. `2+2=4` is true regardless of humans because it describes a logical relationship between quantities.
  *   **Reasons** are normative. They suggest how things *ought to be* or what we *ought to do*.

  A fact can exist without a mind (gravity worked before we understood it). But a **reason** implies a "reason *for* someone." If there is no one to act, no one to experience, and no one to know, the concept of a "reason" loses its grip. `2+2=4` is a fact without a valuer; "You should not destroy beauty" is a reason that requires a valuer.

  ### 2. The Unifying Principle: The Experience Requirement
  The cleanest principle that fits most of your intuitions is this:
  **"Reasons require the capacity for experience."**

  *   **The Rock:** Cannot experience. No reason applies.
  *   **The Dog:** Can experience (pain). A reason exists (don't cause pain).
  *   **The Asteroid:** Mountains cannot experience. If all humans/animals are dead, there is no "subject" to lose out. Therefore, no reason exists for the mountain to remain.

  This principle is often called **Sentientism** or **Interest-Based Ethics**. It argues that nothing matters unless it matters *to* someone.

  ### 3. Solving the Bunker Painting Case
  This is where you are stuck.
  *   **Gut A:** "Beauty is its own reason." (Objective Value)
  *   **Gut B:** "Who cares?" (Subjective Value)

  If you accept the **Experience Requirement** principle above, here is why your Gut A is tricking you: **Projection.**

  When you imagine the sealed painting, *you* are the one imagining it. You are a conscious being valuing the painting from the outside. You are projecting your own appreciation onto the empty bunker.
  *   If the painting is destroyed, *you* (the observer) feel a loss of potential experience.
  *   But if the bunker is truly sealed forever, and all consciousness ceases, there is no "loss" because there is no one to experience the loss.

  **The Verdict on the Painting:**
  Under the Experience Requirement, there is **no floating reason** to save the painting if it is truly forever inaccessible to consciousness. The "badness" you feel is actually a reflection of *your* current values, not a property of the painting itself.

  ### 4. Which Gut Feeling Should You Drop?
  If you want a consistent, non-mystical framework, **you should drop the intuition that "Beauty is its own reason" in the absence of a valuer.**

  Here is why:
  1.  **Parsimony:** Assuming values float in the universe like invisible ghosts is metaphysically "expensive." Assuming values arise from consciousness is observable and logical.
  2.  **The "For Whom?" Test:** You asked this yourself regarding the asteroid: *"But then for who?"* That is the killer question. If a reason exists, it must be a reason *for* some entity. If no entity exists, the reason has no anchor.
  3.  **Potentiality:** The only reason the painting matters is **potential**. It matters because humans *could* open the bunker. If you remove the *possibility* of experience (sealed forever, all humans dead), the value evaporates.

  ### 5. The One Exception (The "Objective Realist" Counter-Argument)
  To be fair, there is a philosophical camp (Value Realists) that would tell you to drop the *"Who cares?"* intuition instead.
  They argue that certain states of affairs (like beauty, complexity, or diversity) are **intrinsically good**, even if no one is there to witness them. They would say the universe is "better" with the mountain than without it, objectively, like a score in a game no one is watching.

  **However,** if you go this route, you have to accept "spooky" metaphysics. You have to believe "Goodness" is a physical property of the universe like mass or charge, which we have no instrument to measure.

  ### Summary Recommendation
  Stick with the **Experience Requirement**.

  1.  **Principle:** Reasons exist only relative to beings capable of experiencing benefit or harm (or potentially doing so).
  2.  **Math:** `2+2=4` is a fact, not a reason. It doesn't need a mind to be true, but it doesn't tell you what to *do*.
  3.  **Painting:** Your feeling that it's "bad" to destroy it is you valuing it from the present. If all consciousness is gone, the value is gone.
  4.  **Gut to Drop:** Drop the idea that beauty generates reasons in a vacuum. Beauty is a relationship between an object and a perceiver. No perceiver = no beauty = no reason.

  **Final Verdict:** Reasons do not float. They are tethered to consciousness. If the lights go out on all consciousness, the "shoulds" and "oughts" go out with them. Only the "is" remains.
