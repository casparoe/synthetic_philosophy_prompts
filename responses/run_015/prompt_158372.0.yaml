answer: |-
  # Workshop Handout: The Two-Bitser Diagnostic Taxonomy
  **Topic:** Derived vs. Original Intentionality in Minimal Systems  
  **Context:** Graduate Philosophy of Mind Workshop (90 mins)

  ## Part I: The Diagnostic Tree
  *Instructions:* Answer the following four questions sequentially regarding the "two-bitser" (a system tracking two binary distinctions without biology, designer, or user). Follow your answers to the corresponding Leaf Position in Part II.

  **Q1. Biological History:**  
  Does representation in this system require an evolutionary or biological history of any kind?  
  *(Yes / No)*

  **Q2. Conscious Design:**  
  *(If No to Q1)* Does the complete absence of a conscious designer eliminate derived intentionality altogether?  
  *(Yes = Eliminates / No = Merely Reduces)*

  **Q3. Functional Isomorphism:**  
  *(If No to Q2)* Is functional isomorphism between the two-bitser's state-transitions and a human belief-forming process sufficient by itself to cross into original intentionality?  
  *(Yes / No)*

  **Q4. Scale and Integration:**  
  *(If No to Q2)* Do scale and integration matter—specifically, is an isolated two-bit distinction always derivative, while a densely interconnected network of such distinctions might reach a non-derivative threshold?  
  *(Yes / No)*

  ---

  ## Part II: Leaf Positions & Commitments
  *Locate your position based on your answer sequence (e.g., Q1-No, Q2-No, Q3-Yes, Q4-No).*

  ### 1. Strong Bio-Naturalism (Q1: Yes)
  *   **Label:** Strong Bio-Naturalism
  *   **Awkward Commitment:** You must deny that a precisely engineered thermostat represents temperature at all, even relative to a user.

  ### 2. Intentional Designism (Q1: No, Q2: Yes)
  *   **Label:** Intentional Designism
  *   **Awkward Commitment:** You must accept that a perfect mind-simulation spawned by a cosmic accident has zero semantic content.

  ### 3. The Inversion Paradox [Incoherent Flag] (Q1: No, Q2: Yes, Q3: Yes)
  *   **Label:** The Inversion Paradox
  *   **Awkward Commitment:** You claim artifacts need designers for *derived* meaning but random systems get *original* meaning via function.
  *   **Diagnosis:** Unstable. If functional isomorphism grants original intentionality (Q3=Yes), the requirement for a designer to grant mere derived intentionality (Q2=Yes) becomes redundant and inexplicable. Original intentionality is typically harder to achieve than derived; this view reverses the burden.

  ### 4. Pan-Intentional Functionalism (Q1: No, Q2: No, Q3: Yes, Q4: No)
  *   **Label:** Pan-Intentional Functionalism
  *   **Awkward Commitment:** You must accept that the isolated two-bitser literally holds beliefs about the chemical marker.
  *   **Note:** Collapses certain radical interpretivist views with simple AI intentionalism.

  ### 5. Integrationist Threshold (Q1: No, Q2: No, Q3: Yes, Q4: Yes)
  *   **Label:** Integrationist Threshold
  *   **Awkward Commitment:** You must explain why adding one more switch to a network suddenly ignites genuine meaning where none existed before.
  *   **Note:** Typical of complex systems theory approaches to mind.

  ### 6. Emergent Holism (Q1: No, Q2: No, Q3: No, Q4: Yes)
  *   **Label:** Emergent Holism
  *   **Awkward Commitment:** You claim function doesn't grant meaning, but complexity somehow does without biology.
  *   **Note:** Unexplored territory; suggests a non-functional property emerges from density.

  ### 7. Global Eliminativism (Q1: No, Q2: No, Q3: No, Q4: No)
  *   **Label:** Global Eliminativism
  *   **Awkward Commitment:** You must deny that anything has original intentionality, not even humans; all is derived or useful fiction.
  *   **Note:** Consistent but costly view regarding human cognition.

  ### 8. Design-Dependent Emergence [Unexplored Flag] (Q1: No, Q2: Yes, Q3: No, Q4: Yes)
  *   **Label:** Design-Dependent Emergence
  *   **Awkward Commitment:** Only designed systems can gain intentionality through complexity; accidental networks remain dead.
  *   **Diagnosis:** Unexplored. It is unclear why design acts as a necessary catalyst for complexity to yield intentionality if function itself (Q3=No) is insufficient.

  ---

  ## Part III: Scoring Key & Position Mapping

  | Q1 (Bio) | Q2 (Design) | Q3 (Function) | Q4 (Scale) | Leaf Position |
  | :--- | :--- | :--- | :--- | :--- |
  | **Yes** | — | — | — | **1. Strong Bio-Naturalism** |
  | **No** | **Yes** | **Yes** | — | **3. The Inversion Paradox** ⚠️ |
  | **No** | **Yes** | **No** | **Yes** | **8. Design-Dependent Emergence** ❓ |
  | **No** | **Yes** | **No** | **No** | **2. Intentional Designism** |
  | **No** | **No** | **Yes** | **No** | **4. Pan-Intentional Functionalism** |
  | **No** | **No** | **Yes** | **Yes** | **5. Integrationist Threshold** |
  | **No** | **No** | **No** | **Yes** | **6. Emergent Holism** |
  | **No** | **No** | **No** | **No** | **7. Global Eliminativism** |

  *(⚠️ = Logically Unstable / ❓ = Theoretically Unexplored)*

  ---

  ## Part IV: Facilitator Notes

  ### 1. Collapsed Positions
  This taxonomy groups distinct historical views that share logical commitments on these specific questions.
  *   **Searle vs. Teleosemantics:** Certain formulations of Searle's Biological Naturalism and strict Teleosemantic accounts both land on **Leaf 1 (Strong Bio-Naturalism)**. The tree fails to separate them because both agree that without biological history, the two-bitser has no representation. The tree does not capture *why* biology matters (causal powers vs. selection history), only *that* it matters.
  *   **Early Putnam vs. Traditional Dualism:** Both may land on **Leaf 2 (Intentional Designism)**. Both require a mind (designer or user) to ground the intentionality of artifacts, though for different metaphysical reasons.

  ### 2. Limitations of the Taxonomy
  **The Normative Gap:** This tree tracks the *source* and *structure* of intentionality (history, design, function, scale), but it cannot capture the **normativity** of content. Two positions might land on the same leaf (e.g., Leaf 5) but disagree on whether the system's states are *correct or incorrect* versus merely *useful or useless*. The facilitator must supplement the discussion by asking: "Does your position allow the two-bitser to be *wrong*, or only to malfunction?" This distinction is invisible to the four structural questions above.
