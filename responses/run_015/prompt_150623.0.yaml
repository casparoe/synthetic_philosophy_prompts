  | **The Diary Ostension** | That pointing inwardly to a sensation cannot fix a meaning because there is no sample independent of the act. | **Yes** | The Archivist doesn't need a sample; she has a perfect causal disposition to re-identify the state without mediation. |
  | **The "Seems/Is" Gap** | That without an independent check, the distinction between taking oneself to be right and being right collapses. | **Yes** | If the tracking is perfect by law of nature, the distinction is practically empty; normativity just *is* idealized reliability. |
