      *   *Justice:* For Pascal, true justice is divine. Human justice is often custom. Protocol justice claims to be just because it is transparent and immutable. But Pascal would ask: *Just according to whom?* If the rules are arbitrary or flawed at the outset, immutability makes them permanently unjust. The absence of a human interpreter means no mercy, no context. Pascal emphasizes the weakness of human reason; codifying reason into immutable law assumes human reason is perfect enough to capture justice forever. He would likely see this as prideful.
