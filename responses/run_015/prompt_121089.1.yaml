      *   Pascal's *Pensées* (specifically fragment 298 in the Lafuma numbering, often cited as "Justice without force is powerless...") argues that justice and force must be together.
      *   Key insight: Force is necessary because justice is disputed. People cannot agree on what is just. Therefore, force makes justice effective.
      *   Key insight: Force without justice is tyranny.
      *   Key insight: We cannot make what is just become strong, so we make what is strong become just.
      *   Pascal is a Jansenist Catholic. His view of human nature is fallen. Human reason is weak. Custom and habit often dictate what we call justice. True justice comes from God, but earthly justice is often just established custom backed by power.
      *   He distinguishes between *la justice** (true justice, divine) and *la justice humaine* (human justice, often arbitrary custom).
      *   He values the *heart* over pure reason (*le cœur a ses raisons*).
      *   He is skeptical of human autonomy and pride.

