answer: |-
  This is a high-risk, high-reward setup. You are walking a tightrope between analytic reconstruction and philological fidelity, while trying to sell a hybrid ethical theory to purists on both sides. The "ugly Q&A" you anticipate is likely to come from the friction between the Consequentialists (who want a working algorithm) and the Philologists (who know the text doesn't work that way).

  Here is your prep sheet, ranked by damage potential, with specific scripts.

  ### The Strategic Overview

  **The Single Reply That Must Land:**
  You must successfully defend against the **"Enlightened Self-Interest"** objection (Objection #1 below). If your theory collapses into "maximize your own future karmic welfare," you lose the Consequentialist label (which implies impartiality) and the EAs will dismiss it as egoism. You need to establish that the *criterion* of rightness is impartial suffering reduction, even if the *mechanism* is individual mental purification.

  **The Real Landmine Question:**
  Your bet on *anattā* (no-self) is correct, but it will come wrapped in a Philologist's clothing. The question won't just be "Who suffers?" It will be: *"If there is no persisting agent, who is the subject of the deliberative procedure, and how can 'individual karma' make sense without a persisting bearer?"* If you answer this with standard analytic "psychological continuity" moves, the Philologists will eat you alive. If you answer with "conventional vs. ultimate truth," the Analytic crowd will tune out. **This is the room-killer.**

  ---

  ### The Prep Sheet: Objections & Replies

  #### 1. The "Enlightened Self-Interest" Objection
  **Who:** The Lead Consequentialist / EA.
  **Damage:** **Fatal.** If this stands, your theory is ethical egoism, not impartial consequentialism.
  **The Question:** "You say the criterion is the reduction of suffering across the causal stream. But you admit karma is individual; I can't transfer merit, and I reap the fruits of my own intentions. So, when I deliberate about 'starving my unwholesome roots,' aren't I just optimizing for *my* future rebirth status? How is this not just enlightened self-interest dressed up in Pali terminology? Where is the impartiality required for consequentialism?"

  **The Reply (2 mins):**
  "Concede the mechanism is individual, deny the scope is selfish. In early Buddhism, the *content* of the wholesome intention (*cetana*) is what generates the karmic fruit. An intention rooted in *mettā* (loving-kindness) toward all beings generates better karma for the agent than an intention rooted in self-concern. So, the deliberative procedure ('check your mind') forces you to adopt an impartial stance to maximize the karmic outcome. The *mechanism* is individual, but the *input* required to make that mechanism work is impartial concern for suffering. It's not that I help others to help me; it's that helping others is the only mental state that successfully navigates the karmic mechanism. The 'self-interest' is a byproduct, not the deliberative goal."

  *   **Concede:** Yes, karma is non-transferable and individual.
  *   **Hold the Line:** The *criterion* of rightness is universal suffering reduction; self-benefit is merely the causal feedback loop, not the moral justification.
  *   **Soft Point:** The texts sometimes promise personal wealth/health for good deeds. You need to bracket this as "popular Buddhism" vs. "soteriological ethics."

  #### 2. The "Subjective Consequentialism" Objection
  **Who:** The Analytic Moralist (Secondary Consequentialist).
  **Damage:** **High.** If this stands, your paper is trivial. It renders your "split-level" claim a re-description of standard epistemic humility.
  **The Question:** "This looks like standard Subjective Consequentialism. The agent ought to maximize the good, but is constrained by available evidence. You're just saying the agent's evidence is restricted to their own mental states. What is the philosophical work the 'split-level' distinction doing here? Why isn't this just 'Objective Consequentialism with high epistemic costs'?"

  **The Reply (2 mins):**
  "It's not just an epistemic restriction; it's a constitutive constraint. In standard subjective consequentialism, I *try* to calculate external outcomes but fail due to ignorance. In this Buddhist model, *trying* to calculate external outcomes is itself a karmically unwholesome act (rooted in craving and confusion). The deliberative procedure isn't 'guess the consequences'; it's 'purify the cause.' If I deliberate by asking 'will this reduce suffering?', I am already entangled in becoming (*bhava*). The split is necessary because the *method* of calculation alters the *value* of the outcome. It's the Paradox of Hedonism applied to metaphysics: you only get the good consequences if you stop aiming at them directly."

  *   **Concede:** It shares structural features with subjective consequentialism.
  *   **Hold the Line:** The constraint is not just "I can't know," it is "Looking changes the data."
  *   **Soft Point:** This relies on a specific reading of karma as sensitive to deliberative style, not just outcomes.

  #### 3. The "Anachronism & Flattening" Objection
  **Who:** The Religious Studies / Philologist.
  **Damage:** **High (Credibility).** If this stands, you look like an amateur imposing Western categories on ancient texts.
  **The Question:** "You're using 'consequentialism' and 'virtue' as if they're universal buckets. But *karma* isn't a causal mechanism for social welfare; it's a theory of moral psychology and rebirth. *Dukkha* isn't utilitarian pain. By flattening five centuries of texts to find a 'split-level theory,' aren't you just creating a straw man that fits Oxford better than it fits the Nikāyas? Where is the textual evidence that the Buddha distinguished between a 'criterion of rightness' and a 'deliberative procedure'?"

  **The Reply (2 mins):**
  "I concede the terminology is analytic, not canonical. I am not doing history; I am doing constructive reconstruction. The question isn't 'Did the Buddha read Hare?' but 'Does this model make the best sense of the normative claims in the text?' The texts *do* distinguish between the fruit of action (*vipāka*) and the quality of the intention (*cetana*). They *do* advise against speculating on karmic outcomes (the *Acinteyya* sutta) while commanding specific actions. My model explains *why* that tension exists without dismissing one side. I'm using analytic tools to solve a textual problem, not to rewrite the text."

  *   **Concede:** The terms are anachronistic; you are not a philologist.
  *   **Hold the Line:** Philosophical reconstruction is valid if it solves problems the text presents.
  *   **Soft Point:** They know the texts better than you. Do not cite Pali terms unless you are 100% sure. Defer to their expertise on translation, pivot to structure.

  #### 4. The "Constitution vs. Heuristic" Objection
  **Who:** The Virtue Ethicist (Buddhist-leaning).
  **Damage:** **Medium.** Attacks the "Aretaic" half of your split.
  **The Question:** "You say the deliberative procedure is aretaic. But for the Buddhist, the state of mind doesn't just *lead* to the right action; it *constitutes* the karma. The intention *is* the act. If the mind is pure, the act is karmically wholesome, regardless of external consequences. Doesn't this make the view deontological or aretaic all the way down, rendering your consequentialist criterion redundant?"

  **The Reply (2 mins):**
  "If karma were *only* about the mind, the Jātaka tales wouldn't matter. The Bodhisattva gives away his body *because* it helps others, not just to feel generous. The mental state is the *proximate* cause, but the *telos* is the cessation of suffering (*dukkha-nirodha*). A pure mind that accidentally causes mass suffering (due to ignorance) still generates negative karmic ripples because it failed to comprehend reality. The virtue is necessary but not sufficient; the consequence (suffering reduction) is the truth-maker for the ethics, even if the virtue is the only reliable access point."

  *   **Concede:** Intention is primary in karma formation.
  *   **Hold the Line:** Intention is not isolated from outcome; intention *aims* at outcome (even if indirectly).
  *   **Soft Point:** The definition of "consequence" in karma includes rebirth, which is hard to square with secular suffering reduction.

  #### 5. The "Anattā / No-Agent" Landmine
  **Who:** The Philologist or The Sharp Kantian.
  **Damage:** **Metaphysical Suicide.** (See "Real Landmine" above).
  **The Question:** "You talk about optimizing the trajectory of 'her own mind.' But if *anattā* holds, there is no 'owner' of the mind. There is just a stream of conditions. So, whose mental trajectory is being optimized? If there is no persisting self to reap the karma, why should this moment's intention care about the next moment's suffering? Doesn't *anattā* dissolve the agent required for your deliberative procedure?"

  **The Reply (2 mins):**
  "This is the deepest challenge. The 'agent' is a conventional designation (*sammuti*) for a causal process. We optimize the stream not because a 'self' owns it, but because suffering is real wherever it arises. The deliberative procedure is a causal intervention in a process, not a command to a substance. We care about the future moment of the stream for the same reason we care about another person's stream: because suffering is bad, not because 'I' will feel it. The 'individual' karma is just the localization of the causal chain, not the positing of a soul."

  *   **Concede:** There is no metaphysical self.
  *   **Hold the Line:** Ethics operates at the conventional level; suffering is the ultimate metric.
  *   **Soft Point:** This is very hard to make coherent without sounding like you're smuggling a self back in. **Practice this reply until it is muscle memory.**

  ---

  ### Specific Answers to Your Two Worries

  **(a) Is this just Subjective Consequentialism?**
  *   **The Trap:** If you say "Yes, basically," the EAs will say "So what?"
  *   **The Fix:** Emphasize the **Paradox of Hedonism**. In standard subjective consequentialism, looking at the consequences is *good but hard*. In your Buddhist model, looking at the consequences is *actively harmful* (it generates craving/attachment). The restriction isn't just on *evidence*; it's on *motivational structure*. That makes it a distinct theory, not just a constrained version of the same theory.

  **(b) Does Individual Karma collapse into Enlightened Self-Interest?**
  *   **The Trap:** If karma is mine, and I want good karma, I am acting for me.
  *   **The Fix:** Distinguish between the **Motive** and the **Reward**. The *motive* required to generate good karma must be non-self-referential (compassion). If I act *in order to* get good karma, I generate bad karma (craving). Therefore, the system structurally forbids enlightened self-interest as a deliberative strategy. You can only get the "self-interest" (good rebirth) by forgetting about it.

  ### Final Advice for the Room

  1.  **Manage the Philologists Early:** In your intro, explicitly state: "I am aware of the philological risks. I am using these texts for constructive philosophy, not historical exegesis." This takes the wind out of Objection #3.
  2.  **Don't Fight the Kantian:** The Kantian will ask about duty. Acknowledge that the "deliberative procedure" looks deontological (follow the rule of mental purity), but insist the *justification* is consequentialist.
  3.  **The "Anattā" Pivot:** If the *anattā* question comes, do not get bogged down in metaphysics. Pivot back to suffering: "Whether there is a self or not, pain is felt. The ethics addresses the pain."

  **Good luck. The split-level move is strong, but only if you keep the "Self-Interest" objection from eating it.**
