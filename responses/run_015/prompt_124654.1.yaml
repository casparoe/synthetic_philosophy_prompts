answer: |-
  Consider a distributed "Trust and Safety" unit for a global housing platform, where fifty remote employees authorize automated eviction notices based on opaque algorithmic risk scores rather than direct tenant complaints. These workers possess no prior animus toward the demographics predominantly flagged by the system; they view themselves as data analysts optimizing loss prevention, not as agents of displacement. Harmful outcomes emerge through a gamified interface that displays peer approval rates in real-time, sends haptic nudges when decision latency exceeds a threshold, and diffuses responsibility by requiring only a binary "confirm" click on pre-populated cases where the algorithm claims ninety-five percent confidence. The organizational culture prizes throughput and adherence to protocol over discretionary judgment, creating an environment where refusing to flag a high-risk score is treated as a performance error rather than an ethical choice, ensuring systematic displacement occurs purely through role conformity and technological mediation without any shared ideological commitment to harming the targeted group.

  In this engineered case, Browning's ordinary-men framework predicts the systematic harm will proceed unabated because the situational architecture—role diffusion, peer monitoring, and bureaucratic distance—overrides individual moral hesitation, whereas Goldhagen's willing-executioner framework would predict the operation should stall or lack intensity because the actors lack the requisite eliminationist ideology to willingly inflict suffering. The theories split here on the necessity of internal motivation: Browning argues the situation generates the behavior, while Goldhagen argues the behavior reveals the ideology. The structural feature doing the heavy lifting is the algorithmic nudge combined with performance metrics, which externalizes moral agency onto the system. A Goldhagen defender would attack this case by arguing that the algorithm itself is not neutral but is a materialized form of the group's eliminationist culture, meaning the workers are still enacting a cultural will even if they don't consciously feel it. However, if you strip out the algorithmic-nudge element and leave only the weak structure with actors who secretly hold eliminationist beliefs, the outcome collapses into sporadic, uncoordinated acts rather than systematic violence; this confirms Browning's insight that collective violence requires a coordinating structure to transform individual prejudice into efficient policy, whereas Goldhagen's focus on internal hatred cannot explain why haters without a bureaucracy fail to produce the same scale of harm.
