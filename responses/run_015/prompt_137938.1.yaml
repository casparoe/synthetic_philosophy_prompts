answer: |-
  ### Audit of Analogy 1: The Net

  **Mapping**

  | Archive Analogy | Archival Reality |
  | :--- | :--- |
  | **The Net** | The archival apparatus (appraisal policies, preservation, digitization). |
  | **Mesh Size** | Selection criteria, storage capacity, searchability tools. |
  | **The Water** | The past / Total human activity. |
  | **The Fish** | Records / Events / Evidence. |
  | **The Catch** | The Holdings (The Archive). |
  | **Slipped Through** | Silences / Gaps / Lost records. |
  | **Finer Mesh** | Collect more, appraise less, digitize everything. |

  **Disanalogies**

  *   **Irrelevant:** Nets are physical objects subject to decay; archives are institutional structures. Nets catch biological organisms; archives catch paper/digital bits.
  *   **Relevant (Critical):**
      1.  **Existence Independence:** Fish exist independently of the net. Records often do not exist independently of the bureaucracy that creates them.
      2.  **Uniformity of Medium:** The ocean is a continuous medium. The "past" is not; it is fragmented by jurisdiction, literacy, and institutional reach.
      3.  **Passive vs. Active:** A net is passive drag. Archiving is an active intervention that often *creates* the record (e.g., a census form) rather than finding it.
      4.  **Homogeneity of Catch:** A finer mesh catches more of the *same* fish in the *same* water. It does not catch fish from a different ocean.

  **Addressing the Complications**
  *   **Sources of Silence:** The Net flattens all silence into "slippage." It cannot distinguish between a fish that was never there (nothing created), a fish that was eaten (destroyed), or a fish that was thrown back (discarded by archivist). It treats all gaps as technical failures of mesh size rather than structural absences.
  *   **Administrative By-products:** This is the fatal flaw. If the "water" is the administrative state, the "fish" are bureaucratic by-products. A finer mesh in state waters catches more state paperwork. It does not catch the life that never generated paperwork. Increasing volume increases the density of the *institution's* view, not the *world's* view.

  ### Audit of Analogy 2: The Dog That Did Not Bark

  **Mapping**

  | Archive Analogy | Archival Reality |
  | :--- | :--- |
  | **The Dog** | The Record Creator (State, Institution, Individual). |
  | **The Bark** | The Creation of a Record. |
  | **The Stranger** | The Event, Group, or Person being researched. |
  | **The Silence** | Absence of documentation. |
  | **The Detective** | The Historian / Researcher. |
  | **The Inference** | Silence proves the stranger was not present / known. |

  **Disanalogies**

  *   **Irrelevant:** Dogs are biological; institutions are legal fictions. Barking is auditory; recording is textual/digital.
  *   **Relevant (Critical):**
      1.  **Known Baseline:** Holmes knew the dog *could* and *would* bark at strangers. In archives, we rarely know if the creator *would* have recorded the group even if they encountered them.
      2.  **Presence:** Holmes knew the dog was *present* at the scene. In archives, the "creator" (e.g., the colonial state) may not have been present in the community at all.
      3.  **Reaction vs. Procedure:** Barking is a reaction to a stimulus. Record-keeping is often a procedural routine unrelated to the specific "stranger" (e.g., tax rolls record property, not people without property).

  **Addressing the Complications**
  *   **Sources of Silence:** The Holmes inference assumes the silence is a *signal* (the dog chose not to bark). It cannot distinguish between "the dog wasn't there" (no institution), "the dog was muzzled" (censorship/destruction), or "the stranger was invisible to the dog" (illegibility). It treats silence as evidence of absence, rather than evidence of irrelevance to the recorder.
  *   **Administrative By-products:** The dog barks at *intruders*. The state records *subjects*. If a group is not a subject (no tax, no crime, no property), the dog is not expected to bark. Therefore, the silence proves nothing about the group's existence, only about their relationship to power.

  ### What Both Analogies Leave Out: The "Who"

  Both analogies treat the recorded subject as a pre-existing object waiting to be caught or noticed. They obscure the **constitutive power** of the archive.

  1.  **Legibility:** The archive does not just record people; it makes them legible. To be in the archive, one must often fit a category (taxpayer, criminal, citizen, patient). Those who cannot be categorized are not just "slipped through the net"; they are ontologically absent from the system's reality.
  2.  **Agency of the Recorder:** Both analogies minimize the power of the archivist/creator. The Net implies the water determines the catch. The Dog implies the event determines the bark. In reality, the *creator* determines what counts as an event worth recording.
  3.  **Harm:** Neither analogy accounts for the violence of recording. For marginalized groups, being "caught in the net" or "making the dog bark" often meant surveillance, policing, or dispossession. The seminar's push for "more collection" ignores that for some, archival silence was a protection, and archival visibility was a threat.

  ### Bottom Line: Does the Conclusion Survive?

  The seminar's practical conclusion is that **more collecting and more digitization closes the gap.**

  This conclusion relies entirely on the **Net** analogy. It assumes the "gap" is a technical problem of capacity (mesh size) rather than a structural problem of production (what kind of water we are trawling).
  *   **Digitization:** Makes existing bias more accessible, but does not correct it. It amplifies the voice of the record-creator.
  *   **Collecting More:** If the source of records remains institutional (state, corporate, legal), collecting *more* records simply deepens the bias toward those who interacted with institutions. It creates a denser map of the prison, not the neighborhood outside it.

  The **Dog** analogy is used to justify reading the silence, but if the silence is caused by "no institution present" rather than "institution chose silence," the inference fails. Combining them ("Collect more so we can better analyze the silence") fails because collecting more institutional records does not provide a baseline for non-institutional life.

  **Better Analogy: The Factory**
  The archive is not a net catching fish; it is a **factory processing raw material.**
  *   **Raw Material:** Human life and activity.
  *   **Machinery:** Bureaucratic procedures, forms, laws, appraisal policies.
  *   **Product:** The Record.
  *   **Waste:** The Silenced (those who do not fit the input requirements).
  *   **Implication:** You cannot get a wooden chair from a steel mill, no matter how much you increase production (collect more) or how carefully you study the empty space on the assembly line (dog that didn't bark). To change the output, you must change the *machinery* (the forms, the laws, the appraisal criteria) or source material from a different factory (community archives, oral histories), not simply run the same factory faster.

  Verdict: DOES NOT SURVIVE, because increasing the volume of biased production cannot correct for structural exclusion.
