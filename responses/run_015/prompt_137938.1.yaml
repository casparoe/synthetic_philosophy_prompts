          *   Slipped through = Silences/Gaps.
      *   *Disanalogies:*
          *   Fish exist independently of the net; records often do not exist independently of the bureaucracy that creates them.
          *   Water is uniform; the "past" is not uniform (some areas generate paper, some don't).
          *   Net is passive; Archivists are active agents with biases.
          *   Finer mesh catches *more* fish of the *same kind*; it doesn't necessarily catch *different kinds* of fish (e.g., oral history vs. tax records).
      *   *Relevance:* The idea that a "finer mesh" (collect more) solves the bias is the critical failure point. If the "fish" (records) are only generated by specific institutions, a finer net just catches more institutional records, not the missing voices.
      *   *Complication 1 (Sources of Silence):* The net implies things "slip through" (not collected). It doesn't account for things that were never "swimming" there (never created) or were eaten before reaching the net (destroyed). It flattens silence into "collection failure."
      *   *Complication 2 (Administrative By-products):* This is the killer. A finer net in the same water catches more of the same fish. If the "water" is state administration, collecting *more* state records just amplifies the state's view, it doesn't capture the marginalized who didn't interact with the state.

  3.  **Audit Analogy 2: The Dog That Did Not Bark**
      *   *Mapping:*
          *   Dog = The Archive/Record Creator.
          *   Bark = Documentation/Record.
          *   Stranger/Event = Historical occurrence/Group.
          *   Silence = Absence of record.
          *   Detective = Historian.
      *   *Disanalogies:*
          *   We know the dog *can* bark. In archives, we often don't know if a record *should* exist.
          *   We know the dog was *present*. In archives, the "creator" might not have engaged with the subject at all.
          *   Barking is a natural reaction; Record creation is a deliberate, power-laden administrative act.
      *   *Relevance:* The inference relies on a known baseline expectation. If the baseline is disputed (i.e., did the state care about this group?), the silence proves nothing.
      *   *Complication 1 (Sources of Silence):* The Holmes analogy assumes the dog *chose* not to bark (or wasn't triggered). It conflates "no record created" with "record created and lost." It treats silence as a singular signal rather than a complex archaeological layer.
      *   *Complication 2 (Administrative By-products):* The dog barks at *intruders*. The state records *subjects*. If a group isn't a subject (no tax, no crime, no property), the dog wasn't expected to bark. Silence isn't evidence of absence; it's evidence of irrelevance to the power structure.

  4.  **Synthesize: What is left out about "Who"?**
      *   Both analogies treat records as neutral objects waiting to be found or noted.
      *   They ignore the *constitutive* power of the archive. The archive doesn't just catch people; it *makes* them legible (e.g., as taxpayers, criminals, citizens).
      *   Those who are not legible to the system don't just "slip through"; they are ontologically absent from the system's reality.
      *   Power determines not just what is kept, but what is *generatable* as a record.

  5.  **Evaluate the Seminar's Conclusion:**
      *   Conclusion: "More collecting and more digitization closes the gap."
      *   Critique: Based on the "Net" analysis, if the water is biased (state-centric), more netting just biases the sample *more* heavily toward the state. Digitization makes existing bias more accessible, not less biased.
      *   Based on the "Dog" analysis, if we don't know the baseline, digitizing silence just makes the silence louder, not more interpretable.
      *   Result: The conclusion does not survive. The "Net" analogy is carrying the water for this conclusion, and it leaks.

  6.  **Develop a Better Analogy:**
      *   Need something that accounts for:
          *   Active construction (not passive catching).
          *   Power dynamics (who builds the structure).
          *   The nature of the material (by-products vs. observations).
          *   The impossibility of total recovery.
      *   *Idea 1: A Mirror.* (Too passive, implies reflection).
      *   *Idea 2: A Map.* (Better, implies selection and projection, but still static).
