      *   *Idea 4: An Interrogation Room.* (Good for power, but too specific).
      *   *Idea 5: A Compost Heap / Soil Stratigraphy.* (Things decay at different rates. Some things never enter the soil. The soil chemistry changes what survives).
      *   *Idea 6: A Translation Machine.* (Events happen in one language, Archive speaks another. Only what is translatable gets in. Power dictates the dictionary).
      *   *Selection:* **The Prism/Filter combined with a Factory.** Let's go with **The Filter/Factory hybrid** or **The Spotlight.**
      *   *Better Idea:* **The Spotlight.**
          *   Light = Attention/Power.
          *   Stage = The World.
          *   Actors = People/Events.
          *   Shadow = Silence.
          *   Mechanism: Moving the spotlight (collecting more) illuminates new things but casts new shadows. It doesn't illuminate the whole stage. The light source itself colors what is seen.
      *   *Even Better Idea (Archival specific):* **The Processing Plant.**
          *   Raw material enters (Life).
          *   Machinery (Bureaucracy) processes only specific inputs.
          *   Waste is discarded (Silence).
          *   Output is the Product (Archive).
          *   Remedy isn't "more processing," it's "different machinery."
      *   *Let's try "The Prism".* It handles the distortion well. But "The Factory" handles the *production* aspect better. Let's go with **The Factory**. It addresses the "by-product" complication directly.

      *   *Wait, let's look for something that captures the "Power" aspect best.*
      *   **The Interrogation.** The archive is the transcript of an interrogation. The state asks the questions. The subject answers within the limits of the questions. Silence is either refusal or the question wasn't asked. Collecting more transcripts doesn't tell you what the subject thought, only what they said under those specific conditions.
      *   *Actually, the "Spotlight" is the standard counter-analogy to the Net.* It emphasizes that illumination creates shadow.
      *   *Let's try to combine the "Factory" (production) with the "Spotlight" (visibility).*
      *   *Decision:* **The Spotlight.** It's intuitive for undergraduates. It explains why "more light" (digitization) doesn't mean "whole picture." It explains that the light source (institution) determines what is visible.

      *   *Refining the "Better Analogy":* The prompt asks for *a* better one. The "Spotlight" is good, but maybe **The Map Projection** is better for "power." No, **The Factory** is best for the "administrative by-product" complication. If the archive is a factory, you can't just "collect more" raw material if the machine only processes steel and you want to process wood. You need a different machine.
      *   *Let's go with **The Factory**.* It directly counters the "Net" (passive collection) with "Production" (active creation).

  7.  **Drafting the Response:**
