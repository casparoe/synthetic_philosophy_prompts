      *   *Refining the "Net" Audit:* Focus heavily on the "Water" composition. If the water is 90% state paper and 10% personal letters, a finer net catches 90% more state paper.
      *   *Refining the "Dog" Audit:* Focus on the "Baseline." Holmes knew the dog barked at strangers. Archivists don't know if the state cared about the "stranger."
