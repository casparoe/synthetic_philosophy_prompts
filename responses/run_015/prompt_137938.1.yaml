              1.  Sources of silence (never created, destroyed, not collected, uncatalogued).
              2.  Nature of state records (by-products of administration vs. reports of events; density tracks institutional reach, not life density).
          *   Analyze what both analogies leave out about *who* gets recorded.
          *   Provide a bottom line on the seminar's practical conclusion (more collecting/digitization closes the gap).
          *   If both fail, propose a better analogy.
