      *   *Wait, one more check on the "Better Analogy".* The Factory is good, but is it an *analogy* for the archive? Yes. But maybe **The Prism** is more elegant for "distortion." No, the prompt emphasizes *production* (administrative by-products). The Factory is stronger. Or **The Filter**. A filter implies something passing through. A Factory implies transformation. The Archive transforms life into data. Let's use **The Factory**. It highlights that you cannot get wood products from a steel mill, no matter how much you feed it.

