      *   *Point 3: Environmental Luck (Fake Barns).* This is the killer for internal graphs. The graph is clean, the world is hostile. This confirms the user's "input-layer mismatch" suspicion.
      *   *Point 4: Causal/Modal Conditions.* Knowledge requires the belief to track truth across possible worlds (Sensitivity/Safety).
