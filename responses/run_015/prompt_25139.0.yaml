answer: |-
  Here is a 40-minute teaching plan designed for policy professionals. It prioritizes conceptual clarity over historical exegesis.

  ### 1. The Prerequisite Idea: The "Circumstance vs. Choice" Cut
  Before you introduce *brute* vs. *option* luck, you must secure agreement on a prior distinction: **Circumstance vs. Choice.**

  *   **Why:** If they believe all outcomes are a mix of both (which they are), the theory collapses. You need them to accept, for the sake of the argument, that we can conceptually separate what happens *to* people (circumstance) from what people *do* (choice).
  *   **How to plant it (Minutes 0–5):** Do not start with equality. Start with **responsibility.** Ask: *"If we want a fair society, are we responsible for fixing disadvantages caused by the economy, or disadvantages caused by personal decisions?"*
  *   **The Goal:** Get them to agree that fairness requires treating these two categories differently. Luck egalitarianism is simply the rigorous attempt to draw that line.

  ### 2. The Running Example: "The Two Drivers"
  **Scenario:** Alex and Blake are identical in income, skill, and car value. Both crash their cars on the same night. Both need $10,000 to repair them to get to work.

  *   **Why this works:**
      1.  **Policy Relevance:** It maps directly to insurance mandates, tort law, and safety net eligibility.
      2.  **Visceral Stakes:** It involves financial loss and mobility, which policy pros understand as critical capabilities.
      3.  **Variable Manipulation:** You can toggle the variables to shift the case from Brute to Option luck without changing the outcome (the $10k loss).

  **How to deploy it:**
  *   **Round 1 (Brute Luck):** Alex hits black ice on a maintained road. Blake hits a pothole the city knew about but didn't fix.
      *   *Ask:* "Does the state owe them compensation?" (They will say yes).
  *   **Round 2 (Option Luck):** Alex bought collision insurance; Blake declined it to save money for a vacation. Both crash due to black ice.
      *   *Ask:* "Does the state owe Blake compensation?" (This triggers the debate).

  ### 3. Sequence & Misconception Management

  **Minutes 5–15: Defining the Distinction**
  *   **Define:** **Brute Luck** = Unchosen circumstances (genetics, recession, black ice). **Option Luck** = Consequences of calculated gambles (investing, speeding, declining insurance).
  *   **The Theory:** Equality requires compensating for Brute Luck, but allowing people to live with the consequences of Option Luck.
  *   **Misconception Alert #1: The Desert Trap**
      *   *The Risk:* Participants will say, "Blake chose not to insure, so he *deserves* to lose."
      *   *The Intervention:* Stop this immediately. Luck Egalitarianism is **not about moral desert.** It is about **fair distribution.**
      *   *What to say:* "Pause. We aren't asking if Blake is a 'bad person.' We are asking if his lack of insurance makes his resulting poverty *unfair* in a way the state must fix. The theory says: If the loss stems from a gamble you took, it's not an inequality of justice, even if it's tragic."

  **Minutes 15–25: Stress-Testing the Boundary**
  *   **Complicate the Example:** Reveal that Blake didn't buy insurance because he grew up in a household that didn't trust banks (cultural brute luck) or because he had to choose between insurance and medication (constrained choice).
  *   **The Point:** Show how hard it is to isolate "pure" option luck. This is the Cohen/Arneson critique of Dworkin.
  *   **Misconception Alert #2: The Heartlessness Charge**
      *   *The Risk:* "So if Blake starves because he gambled, Luck Egalitarianism says we let him die? That's cruel."
      *   *The Intervention:* Distinguish **Justice** from **Humanity.**
      *   *What to say:* "The theory defines what we *owe* each other as a matter of right, not what we might do out of charity. More importantly, ask: Was it truly a free choice? If his 'option' was shaped by brute luck (poverty upbringing), Luck Egalitarians would actually argue for compensation. It's not heartless; it's precise."

  **Minutes 25–35: The Policy Translation**
  *   Connect the theory to their work.
      *   **Universal Basic Income:** Is it compensating for brute luck (unequal starting points) or subsidizing option luck (choice to not work)?
      *   **Healthcare:** Is smoking-related illness brute luck (addiction genetics) or option luck (choice to smoke)?
  *   *Facilitator Note:* Keep them from solving the policy. Keep them focused on *how* they are categorizing the luck.

  ### 4. The Closing Check (Minutes 35–40)
  Do not ask, "Do you agree with Luck Egalitarianism?" They will answer based on political ideology, not comprehension.

  **Use the "Classify the Case" Test:**
  Present a new, short scenario and ask them to categorize the claim.

  > **Scenario:** "A worker loses their job because AI automated their role. They spent their savings on training for a different field, but that field also collapsed."

  **Ask:** "Under Luck Egalitarianism, is the state obligated to compensate this person? Why or why?"

  *   **Correct Understanding:** They reference the *source* of the disadvantage (Brute vs. Option). They should argue about whether the job loss was a "gamble" they took or a "circumstance" imposed on them.
  *   **Incorrect Understanding:** They argue about whether the person is "worthy," or whether the outcome is "sad," or simply restate that "inequality is bad."

  **Final Script:**
  "If you found yourself arguing about whether the worker *chose* their vulnerability versus whether the economy *imposed* it, you understood the theory. If you argued about whether they *deserved* help based on their hard work, you slipped back into desert. Luck Egalitarianism doesn't care about hard work; it cares about the source of the disadvantage."
