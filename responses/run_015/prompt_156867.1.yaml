answer: |-
  This is a sharp cut into the dialectic. You have identified a structural tension that often gets glossed over in the "Hard Problem" vs. "Illusionist" debates. You are right: there is a specific argumentative move here that is distinct from standard eliminativism or Dennettian heterophenomenology, and it relies on a subtle circularity regarding how the target of reduction is individuated.

  There is no single canonical term for this exact maneuver in the literature, though it shadows discussions around the "Phenomenal Concept Strategy" and "Targeting Problems" for illusionism. To carve this out properly, we need to coin a term that captures the *borrowing* of ontological weight. Let's call it **Phenomenological Free-Riding**.

  Here is the carving of the concept, its boundary conditions, and how it differs from its neighbors.

  ### The Carving: Phenomenological Free-Riding

  **Definition:** Phenomenological Free-Riding occurs when a reductionist explanation posits a functional or mechanistic state to explain away a phenomenological intuition, but *individuates* that mechanistic state by appealing to the very phenomenological content it claims to reduce.

  **The Structure of the Move:**
  1.  **The Data:** The subject reports a qualitative residue (e.g., "There is something it is like to see red").
  2.  **The Reduction:** The skeptic posits a functional mechanism (e.g., "A meta-cognitive flag signaling informational inaccessibility").
  3.  **The Free-Ride:** The skeptic identifies *which* functional mechanism is at play by describing it as "the mechanism that produces the *feeling of qualitative residue*."
  4.  **The Elimination:** The skeptic concludes that because the mechanism is functional, the "qualitative residue" has no independent ontological status.

  **The Dialectical Debt:** The skeptic gets to treat the phenomenological report as *veridical data* about the system's state (to identify the mechanism) while simultaneously treating it as *non-veridical ontology* (to eliminate the qualia). They are riding the phenomenology to the station of functionalism, then kicking the phenomenology off the train.

  ### Boundary Conditions: When Does It Apply?

  You asked if this applies whenever an intuition is treated as mechanistic data. The answer is **no**. It is specific to domains where the *content* of the intuition claims **intrinsic nature**.

  **Condition 1: Intensional Opacity of the Target**
  Phenomenological Free-Riding only occurs if the functional state is defined by *how it feels* rather than *what it does* independently of the feeling.
  *   *Not Free-Riding:* "You feel pain because C-fibers fire." (Here, C-fibers are identified via microscopy, not via the feeling of pain.)
  *   *Free-Riding:* "You feel an 'explanatory gap' because you have a 'gap-detection module'." (Here, the module is only identifiable because you feel the gap.)

  **Condition 2: The Specificity Constraint (Your "Broken Calculator" Point)**
  This is the critical edge. For the reduction to work without free-riding, the skeptic must explain why *this* specific functional state yields *this* specific report without referencing the qualia.
  *   If the skeptic says, "The system outputs 'ineffable red' because it detects red," they are free-riding. They are using "red" (the qualia) to explain the detection of "red."
  *   To avoid free-riding, they must say, "The system outputs 'ineffable red' because it detects wavelength 700nm and lacks access to the processing history."
  *   *The Catch:* As you noted, this rarely holds up. The skeptic usually slips back into saying the mechanism is triggered by the *experience* of red, not just the wavelength. If the trigger is the *experience*, the experience is causally potent, which undermines the claim that it's merely an illusion.

  **Condition 3: Ontological Downgrading**
  The move must involve a shift from "This feeling reveals a property of the world/self" to "This feeling reveals a bug/feature of the reporting system." If the skeptic grants the ontology (e.g., "Yes, qualia exist and they are functional states"), that is **Functional Realism**, not Free-Riding. Free-Riding requires the *elimination* of the qualitative ontology while preserving the *descriptive utility* of the qualitative report.

  ### Differentiation from Neighboring Moves

  **1. vs. Standard Eliminativism (Churchland)**
  *   **Eliminativism:** "Pain does not exist. 'I am in pain' is a false theory-laden report, like 'The sun rises'."
  *   **Free-Riding:** "The *report* 'I am in pain' is true data about your system, but the *referent* (pain-as-intrinsic) is false."
  *   **The Edge:** Eliminativists bite the bullet and say the folk-psychological report is often false. Free-Riders treat the report as infallible data about the *system's internal state*, which protects them from saying the subject is "wrong," but traps them in the circularity you identified.

  **2. vs. Dennett's Heterophenomenology**
  *   **Heterophenomenology:** "We treat the subject's report as a text. We don't decide if the qualia exist; we decide if the text is best explained by positing qualia."
  *   **Free-Riding:** "We treat the report as a text, and the best explanation is a functional state *defined by the text*."
  *   **The Edge:** Dennett brackets the ontology. The Free-Rider asserts a specific ontology (functionalism) but uses the bracketed phenomenology to justify the assertion. Dennett would say, "If the functional explanation works, the qualia were never needed." The Free-Rider says, "The qualia are the functional state," which requires the qualia to define the state.

  **3. vs. Quining Qualia**
  *   **Quining:** "The concept of qualia is so confused it refers to nothing. Stop using the word."
  *   **Free-Riding:** "The concept of qualia refers to a real functional state, just not the one you think."
  *   **The Edge:** Quining attacks the vocabulary. Free-Riding hijacks the vocabulary. The Free-Rider says, "When you say 'redness', you are actually talking about 'access-inaccessibility'." But they only know to map 'redness' to 'access-inaccessibility' because 'redness' feels the way it does.

  ### The "Broken Calculator" Edge Case

  Your intuition about the "broken calculator" is the strongest wedge against this move. It highlights the **Individuation Problem**.

  If I have a functional state $F$, and $F$ causes me to say "I have ineffable qualia," the skeptic must explain why $F$ doesn't cause me to say "I have a broken calculator."
  *   **The Free-Rider's Trap:** To explain why $F$ produces the qualia-report, they usually appeal to the fact that $F$ is triggered by *qualia*.
  *   **The Boundary:** If the skeptic can specify the input conditions of $F$ entirely in third-person physical terms (wavelengths, synaptic weights) *and* derive the specific output content ("ineffability") from those physical terms without referencing the first-person feel, they have escaped Phenomenological Free-Riding.
  *   **The Reality:** In almost all current debates (LLMs, bats, color), skeptics fail this condition. They describe the mechanism as "a system that *thinks* it has qualia." The "thinks it has" is doing the heavy lifting, and that "thinking" is defined by the phenomenology it's supposed to reduce.

  ### Summary of the Carving

  **Phenomenological Free-Riding** is the illicit use of first-person phenomenal content to individuate a third-person functional mechanism, for the purpose of arguing that the first-person content is nothing *but* that mechanism.

  *   **It applies** when the mechanism is identified by its phenomenal effects.
  *   **It does not apply** when the mechanism is identified by independent physical markers (e.g., "V4 activation") and the phenomenal report is treated as a downstream consequence that could theoretically have been different.
  *   **The Fatal Flaw:** It cannot account for the *specific intentional content* of the phenomenological report (why "red" and not "calculator") without tacitly granting the phenomenology causal/explanatory power, which contradicts the reductionist goal.

  You are seeing this loop because the skeptic is trying to have their cake (a complete physical description) and eat it too (an explanation that accounts for why we *feel* there's a gap). They use the feeling to find the gap-mechanism, then claim the feeling is just the mechanism. That is the free ride.
