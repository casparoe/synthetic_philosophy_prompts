answer: |-
  The objection that evolutionary dynamics undermine Lewis's account of arbitrariness rests on a category error regarding what Lewis meant by "arbitrary." Evolutionary game theory does not refute Lewis; rather, it provides the dynamic mechanism for how Lewisian conventions stabilize. The objection confuses the **counterfactual equivalence** of equilibria (Lewis's requirement) with the **historical inevitability** of a specific outcome (the evolutionary observation).

  Here is an analysis of why evolutionary dynamics preserve, rather than dissolve, Lewisian arbitrariness, and why the dominance of right-hand traffic does not render it functionally necessary.

  ### 1. Lewis's Arbitrariness is Counterfactual, Not Historical
  Lewis's criterion for arbitrariness is structural, not genealogical. In *Convention* (1969), Lewis argues that a regularity $R$ is arbitrary if there exists an alternative regularity $R'$ such that, had $R'$ been established instead, it would have solved the coordination problem equally well.

  *   **The Modal Claim:** The key is the *possibility* of the alternative, not its *actualization*. Even if cultural selection pressures eliminate $R'$ over 500 years, $R$ remains arbitrary if $R'$ remains a viable equilibrium in the payoff matrix.
  *   **The Causal Claim:** The evolutionary objection posits that because $R$ was "selected," it must be superior. But selection in cultural evolution often operates on **frequency-dependent fitness**. A convention is fit *because* it is selected, not selected *because* it is fit (in an intrinsic sense).

  Therefore, the objection confuses the **modal claim** (alternatives were possible) with the **causal claim** (alternatives were not tried or died out). Lewis only requires the former to hold. As long as left-hand traffic (LHT) remains a viable coordination equilibrium (which it empirically is, given its use in the UK, Japan, etc.), right-hand traffic (RHT) remains arbitrary in Lewis's sense, regardless of how many countries use it.

  ### 2. Evolutionary Game Theory Supports Lewis
  Philosophers and game theorists like Brian Skyrms (*The Evolution of the Social Contract*) have explicitly embedded Lewisian conventions in evolutionary frameworks. Far from refuting Lewis, evolutionary dynamics explain how arbitrary equilibria become stable without central agreement.

  *   **Multiple Stable Equilibria:** In evolutionary models of coordination (e.g., the Driving Game), there are often multiple Evolutionarily Stable Strategies (ESS). Both "All Drive Left" and "All Drive Right" are ESSs.
  *   **Path Dependence:** Evolutionary dynamics are often path-dependent. A small historical accident (a "founder effect") can push a population into the basin of attraction of one equilibrium. Once there, selection pressures punish deviators, locking in the norm.
  *   **The Illusion of Necessity:** To an observer looking at the end state, the winning strategy looks "necessary" because deviators are eliminated. However, the evolutionary model shows that the *other* equilibrium would have produced the same stability had the initial conditions differed slightly. The "selection" is for **coordination itself**, not for the specific content of the coordination.

  ### 3. Robustness vs. Intrinsic Merit
  The prompt suggests that selection preserves the "most robust or efficient equilibrium." This requires a distinction between **intrinsic efficiency** and **network robustness**.

  *   **Intrinsic Efficiency:** If RHT were physically safer for humans (e.g., due to hemispheric brain dominance) such that LHT resulted in significantly higher accident rates regardless of expectations, then RHT would be functionally necessary, and Lewis would be wrong to call it a convention.
  *   **Network Robustness:** However, the "efficiency" of a traffic rule is almost entirely derived from common knowledge. RHT is efficient *only because* everyone expects it. The selection pressure is not "RHT is better than LHT"; the pressure is "Matching is better than Mismatching."

  Evolutionary dynamics amplify the **network effect**. The "survival of the fittest" in this context is the survival of the *most common* signal, not the *best* signal. Thus, the surviving regularity appears deterministically selected, but the determinant is historical momentum, not intrinsic merit.

  ### 4. The Case of Right-Hand Traffic
  Applying this to the specific example: If driving on the right has outcompeted driving on the left globally, has arbitrariness been resolved?

  **No.** The global dominance of RHT is largely a product of historical contingencies (e.g., Napoleon's influence in continental Europe, US automotive dominance in the 20th century), not a revelation of functional necessity.
  *   **Counterfactual Viability:** If the entire world switched to LHT overnight, the coordination problem would be solved just as effectively. The transition costs would be high, but the equilibrium itself is equally stable.
  *   **Functionally Necessary?** We should not treat the rule as functionally necessary. To do so would be to commit the **just-so story fallacy**, assuming that because a trait is universal, it must be optimal. In conventions, universality is often a result of the convention's nature (tendency toward uniformity) rather than the content's superiority.

  ### Conclusion
  Evolutionary dynamics do not show Lewis was wrong; they explain **how arbitrariness stabilizes**. Lewis's account requires that alternatives *could* have worked, not that they *did* work. Evolutionary selection among multiple stable equilibria preserves this arbitrariness because the selection pressure favors **conformity**, not **content**.

  The objection fails because it treats the *outcome* of the evolutionary process (a single dominant norm) as proof of the *uniqueness* of the solution. But as long as the alternative equilibrium (LHT) remains viable in principle, the dominance of RHT is a testament to the power of path-dependent selection, not functional necessity. Lewis was right: the rule is conventional because the alternative remains a live option in the space of possibilities, even if it is a dead letter in the history of actuality.
