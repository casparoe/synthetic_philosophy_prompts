prompt: |-
  On Lewis’s account, a convention is an arbitrary regularity that solves a recurrent coordination problem: several equilibria could serve equally well, and stability derives from shared expectations rather than from intrinsic merit. If we now embed conventions in an evolutionary story—cultural selection pressures that, over generations, preserve the most robust or efficient equilibrium and eliminate rivals—then the surviving regularity (say, right-hand traffic or a given phonological standard) appears deterministically selected rather than genuinely arbitrary. So does evolutionary dynamics show that Lewis was wrong to insist on arbitrariness, or does that objection confuse the modal claim that alternatives were possible with the causal claim that they were never tried? In particular, if driving on the right has outcompeted driving on the left across most of the world, has the arbitrariness been resolved, and should we now treat the rule as functionally necessary rather than conventional?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**
      *   **Core Subject:** David Lewis's theory of convention (from *Convention: A Philosophical Study*).
      *   **Lewis's Definition:** A convention is an arbitrary regularity solving a recurrent coordination problem. Key features: multiple equilibria exist, stability comes from mutual expectations, not intrinsic merit.
      *   **The Challenge:** Evolutionary/Cultural Selection. If we view conventions through an evolutionary lens (cultural selection pressures over generations), the "winning" equilibrium seems deterministically selected (robust/efficient) rather than arbitrary.
      *   **The Specific Question:** Does evolutionary dynamics prove Lewis wrong about arbitrariness? Or does it confuse modal possibility (alternatives *could* have existed) with causal history (alternatives *were* never tried/survived)?
      *   **The Example:** Right-hand traffic vs. Left-hand traffic. If Right wins globally, is it still arbitrary/conventional, or is it now functionally necessary?

  2.  **Analyze Lewis's "Arbitrariness":**
      *   What did Lewis mean by "arbitrary"? He meant there is a *preferred regularity* $R$ and at least one *alternative regularity* $R'$ such that if $R'$ were established instead, it would have solved the coordination problem just as well.
      *   Crucially, this is a *counterfactual* claim, not necessarily a historical one. It's about the structure of the payoff matrix, not the path dependence of history.
      *   Lewis distinguishes between "arbitrary" (in the sense of interchangeable solutions) and "random" (without cause).

  3.  **Analyze the Evolutionary Objection:**
      *   The objection suggests that if selection pressures eliminate inefficient equilibria, the survivor isn't arbitrary; it's *fit*.
      *   If Right-Hand Traffic (RHT) is more efficient than Left-Hand Traffic (LHT) due to some biological or mechanical reason, then RHT isn't a convention in Lewis's sense; it's a technical necessity.
      *   However, if RHT and LHT are *functionally equivalent* (payoffs are equal), but RHT won due to a "founder effect" or historical accident that got locked in, then it remains a convention, even if the *process* of locking in looks like selection.
      *   Evolutionary Game Theory (EGT) actually supports Lewis. EGT shows how populations converge on *one* equilibrium among many (e.g., Hawk-Dove, Driving Side). The selection is often path-dependent.

  4.  **Evaluate the "Modal vs. Causal" Distinction:**
      *   *Modal Claim:* Alternatives were possible (in principle).
      *   *Causal Claim:* Alternatives were never tried (or died out).
      *   Lewis needs the Modal Claim to hold. If the alternative is *impossible* (functionally inferior to the point of non-viability), it's not a convention.
      *   If the alternative was possible but didn't survive due to stochastic drift or minor historical nudges (even if amplified by selection), it remains arbitrary in Lewis's sense.
      *   The objection confuses "selected for robustness" with "uniquely optimal." A convention can be robust *because* it is a convention (network effects), not because it is intrinsically better.

  5.  **Address the Traffic Example:**
      *   Is RHT functionally necessary? No. The UK, Japan, Australia drive on the left. Both work.
      *   Why did RHT win "most of the world"? Often due to imperialism (Napoleon, US influence), not inherent physics.
      *   Even if RHT won everywhere, as long as LHT *could* work (counterfactual), it remains a convention.
      *   Evolutionary dynamics explain *how* the convention stabilizes, not *why* this specific one was the only option.

  6.  **Synthesize the Argument:**
      *   **Thesis:** Evolutionary dynamics do not refute Lewis; they complement him. The objection confuses *selection among equivalents* with *selection for uniqueness*.
      *   **Point 1: Lewis's Arbitrariness is Counterfactual.** It's about the existence of alternative equilibria in the payoff structure, not the historical survival of alternatives.
      *   **Point 2: Evolutionary Game Theory (EGT).** EGT models convention exactly as Lewis described: convergence on one equilibrium among many via replication dynamics. The "selection" is often path-dependent (founder effects), preserving arbitrariness.
      *   **Point 3: Robustness vs. Optimality.** A convention becomes robust *because* everyone expects it (self-fulfilling), not because it's intrinsically superior. Selection pressures often favor the *established* norm, regardless of content.
      *   **Point 4: The Traffic Case.** RHT vs. LHT is the classic example of arbitrariness. The fact that one dominates doesn't make the other impossible. If the whole world switched tomorrow, it would work (costly transition, but viable equilibrium).
      *   **Conclusion:** Lewis remains correct. Evolutionary stories explain the *stability* and *propagation* of conventions, but they do not erase the *arbitrariness* of the specific equilibrium selected, provided functional equivalents exist.

  7.  **Refine the Nuance (Self-Correction/Edge Cases):**
      *   *Nuance:* What if selection *does* eliminate the alternative because it's slightly less efficient? Lewis allows for "approximate" arbitrariness. If $R$ is slightly better than $R'$, but $R'$ would still work, it's still largely conventional.
      *   *Nuance:* "Functionally Necessary." If RHT is truly necessary (e.g., human eye dominance makes LHT dangerous), then it's not a convention. But empirical evidence shows LHT is safe. So the premise of the objection is factually weak regarding traffic.
      *   *Nuance:* The definition of "Arbitrary." Some philosophers (e.g., Millikan, Skyrms) refine Lewis. Skyrms explicitly uses evolutionary models to *support* Lewisian convention. I should mention Skyrms.

  8.  **Drafting the Response:**
      *   *Introduction:* State the verdict clearly. Lewis is not wrong; the objection misunderstands the nature of arbitrariness in Lewis's framework.
      *   *Section 1: Lewis's Counterfactual Arbitrariness.* Explain that arbitrariness is about the existence of alternative solutions, not the absence of causal history.
      *   *Section 2: Evolutionary Game Theory as Validation.* Explain how EGT (Skyrms, etc.) models convention as selection among multiple stable equilibria. Path dependence preserves arbitrariness.
      *   *Section 3: Robustness vs. Intrinsic Merit.* Distinguish between selection for "being the norm" vs. "being the best norm." Network effects create the selection pressure.
      *   *Section 4: The Traffic Example.* Analyze RHT vs. LHT. Show that global dominance doesn't equal functional necessity.
      *   *Conclusion:* Summarize. Evolutionary dynamics explain the *persistence* of convention, not the *necessity* of the content.

  9.  **Final Polish:** Check tone (philosophical, analytical), ensure clarity on "modal" vs. "causal," and verify accurate representation of Lewis and EGT. (Self-check: Did Lewis explicitly talk about evolution? No, he used game theory. But later philosophers like Skyrms bridged this. I should make sure to attribute the evolutionary extension correctly.)

  10. **Final Review against Prompt:** Did I answer the specific question about modal vs. causal claims? Yes. Did I address the traffic example? Yes. Did I conclude on functional necessity? Yes.

