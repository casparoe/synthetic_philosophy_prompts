answer: |-
  Hey, good to catch you. 75 minutes is tight for Scanlon, especially with Law & Econ grads. They're wired for cost-benefit analysis, so contractualism is going to feel like friction to them. That's good—that friction is where the learning happens—but you have to manage it carefully or they'll just dismiss the whole thing as "inefficient."

  Here's how I'd structure it if I were teaching it tomorrow.

  ### The Dependency Chain: Justification Before Rejection

  You asked about the dependency chain, and this is the make-or-break moment. If you start with "reasonable rejection," their brains immediately go to "veto power" or "negotiation leverage." You need to invert that.

  The idea that has to come first is **the standpoint of justification**. Before they can understand what counts as a "reasonable rejection," they have to buy into the premise that morality is about relating to others on terms they could accept. If they think morality is about "maximizing the good" (which L&E students default to), then "reasonable rejection" is just an obstacle to efficiency.

  So, spend the first 10 minutes establishing that Scanlon isn't asking "What maximizes welfare?" but "What can I justify to *you*?" Once they lock onto that relational aspect, "reasonable rejection" stops looking like "I'd be annoyed" and starts looking like "You violated the terms of our moral relationship."

  ### Where to Split Scanlon from Rawls and Hobbes

  Do this immediately after you establish the standpoint of justification, so around minute 15. Don't wait.

  If you don't separate him from **Hobbes** right away, your students will treat "agreement" as a bargaining outcome based on threat advantage. They'll think, "I can reject this because I have the power to stop it." You need to kill that notion early. Tell them: Scanlon isn't about what people *would* agree to given their power; it's about what they *could* agree to given generic reasons.

  Separating him from **Rawls** is slightly subtler but needs to happen in the same block. Rawls is about constitutional structures behind a veil of ignorance. Scanlon is about specific acts and principles in the real world. If you don't draw this line, they'll think contractualism only applies to basic justice institutions, not torts or emergency decisions.

  **The Misconception This Prevents:** It stops them from treating "reasonable rejection" as a subjective preference or a bargaining chip. It frames it as an objective standard based on generic reasons.

  ### The Carrying Example: The Rescue Boat

  Stick with the rescue-boat case (save one vs. save five). It's classic for a reason—it's clean. But you have to rig it so their L&E instincts don't bypass the philosophy.

  **Properties it needs:**
  1.  **Identical Stakes:** Everyone involved faces the same loss (death). No "save the doctor" variables.
  2.  **No Special Duties:** The rescuer owes nothing specific to any of the victims (no "save my child" stuff).
  3.  **Individual Complaints:** The one person has a complaint ("I die if you don't save me"). The five each have the *same* complaint ("I die if you don't save me").

  **What it must lack:**
  1.  **Hidden Utilitarian Math:** Don't let them introduce probability or future social value.
  2.  **Commodity Trading:** Make sure they don't think of lives as units of utility.

  The reason this example works is that it isolates the aggregation problem. The one person says, "My loss is death." The five say, "Our loss is death." Scanlon's hard pill to swallow is that the five cannot combine their complaints to outweigh the one, because justification is owed to *each* individual separately.

  ### Mapping the Misconceptions (and When to Kill Them)

  You're right about the sequence of errors they'll make. Here's where I'd intercept them:

  1.  **"This is just Social Contract Theory 2.0" (Hobbesian Bargaining)**
      *   *When:* Minute 15 (during the Rawls/Hobbes split).
      *   *How:* Explicitly state that "reasonable rejection" isn't about what serves your self-interest in a negotiation. It's about whether a principle can be defended with reasons others shouldn't dismiss.

  2.  **"Reasonable Rejection = Subjective Anger"**
      *   *When:* Right before you introduce the boat case (Minute 25).
      *   *How:* Define "Generic Reasons." Tell them: "You can't reject a principle just because it inconveniences you. You need a reason that others, looking for a basis of agreement, would acknowledge." This stops the "I'd be annoyed" interpretation.

  3.  **"Scanlon Solves Aggregation by Adding Up Complaints"**
      *   *When:* During the boat case discussion (Minute 40-50).
      *   *How:* This is the big one. They will say, "Surely 5 complaints outweigh 1." You need to press them: "To whom is the justification owed?" If you justify to Person A, you can't say "But 5 other people needed help." You have to justify to Person A why *they* were left to die. The numbers don't enter the justification *to the individual*.

  ### The End Check

  Don't ask them to define contractualism. Ask them to apply the logic to a variation.

  **The Question:** "Imagine the one person on the left is you. The five on the right are strangers. You know Scanlon's view. Do you have a claim against the rescuer for saving them instead of you? And if so, does it matter that there were five of them?"

  **What you're looking for:**
  If they say, "Yes, I have a claim, and the number five doesn't invalidate my individual complaint," they get it.
  If they say, "Yes, but the five outweigh you," they've slipped back into aggregation.
  If they say, "No, because the rescuer maximized utility," they missed the whole session.

  You want them to articulate that the *strength* of the individual complaint doesn't change based on how many other people have the same complaint. That's the hard pill.

  ### What to Refuse to Explain

  You only have 75 minutes. You have to be ruthless.

  1.  **Formal Decision-Theoretic Framing:** Don't let them try to model this with expected utility functions. It misses the point of justification.
  2.  **Full Comparison with Rule-Utilitarianism:** They'll want to argue that a rule "save the greater number" produces better outcomes. Acknowledge it, but park it. Say, "That's a consequentialist critique. Today we're inside the contractualist framework."
  3.  **The "Tie-Breaker" Cases:** Scanlon has some nuanced views on when numbers *might* count (like if the stakes are slightly different). Don't go there. It muddies the water. Stick to the hard case: identical stakes.

  ### Final Thought

  Look, the goal isn't to convince them Scanlon is right. It's to convince them that his problem is *real*. If they leave the room feeling uncomfortable about whether they can just sum up harms without justifying it to the loser, you've won.

