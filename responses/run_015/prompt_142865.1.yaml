prompt: |-
  For a feature on democratic design I am preparing for a science-and-ideas publication, I need a runnable classroom simulation for a graduate seminar in political philosophy—14 participants, one 90-minute session, no prior assigned reading. The objective is to make students feel, through direct experience, the tension in a specific constructed model of sortition-based governance I will call stratified lottocracy with conditional recall: a first lottery selects a deliberative panel; a second, independent lottery determines which proposals reach a binding vote; yet any non-selected participant may invoke a conditional recall veto, but only by demonstrating possession of a verifiable, specific fact about the proposal’s likely consequence. Design the rules, materials, and a non-monetary payoff scheme—using points, privileges, or group rewards rather than cash—so that participants run into the problem themselves: they should initially accept the double lottery as fair, then face a scenario in which one student clearly holds decisive information about a harmful outcome, demand that knowledge override random selection, and discover that any criterion for identifying “the knowledgeable” collapses back into self-selection, social signaling, or reintroduces the very hierarchy the lot was meant to dissolve. Only after they have argued through this should the facilitator name the structural paradox. Include a debrief that maps each phase of the simulation onto the corresponding feature of this model, lists what will predictably go wrong on the first run and exactly how to correct for it, and states frankly which long-term feature of actual lottocratic legitimacy—specifically the cumulative, inter-generational trust effect produced by repeated transparent lotteries—the single-session format necessarily cannot reproduce and must be supplied by discussion. Do not ask for bibliographies, reading lists, or citations. After the full activity description, provide a brief structured summary as a JSON object with exactly these fields and plain text values: setting, group_size, duration_minutes, core_mechanism_name, rules_summary, materials_list, payoff_scheme, debrief_mapping, predicted_first_run_failure, irreplaceable_feature, niche_injected_concept.
