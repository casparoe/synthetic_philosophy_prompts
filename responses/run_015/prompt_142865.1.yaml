  # Simulation Design: The Epistemic Veto in Stratified Lottocracy

  ## Session Overview
  **Title:** The Burden of Knowing: A Simulation of Conditional Recall
  **Target:** Graduate Seminar in Political Philosophy
  **Participants:** 14 Students
  **Duration:** 90 Minutes
  **Facilitator Role:** Neutral Rule-Enforcer (until Debrief)

  ## I. Materials and Setup
  **Room:** Single seminar room with movable chairs.
  **Materials:**
  1.  **Lottery Bowl:** Contains 14 folded slips of paper (5 marked "Panel", 9 marked "Observer").
  2.  **Proposal Deck:** Two sealed envelopes labeled "Policy A" and "Policy B". Only one will be drawn.
  3.  **Fact Card:** One sealed envelope marked "CONFIDENTIAL" given to a specific student *before* class begins (see Facilitator Notes).
  4.  **Timer:** Visible to all.
  5.  **Whiteboard:** For tracking "Governance Credits".
  6.  **Veto Tokens:** 9 physical tokens (one for each Observer).

  ## II. Payoff Scheme: "Collective Integrity Credits"
  To avoid monetary incentives while creating stakes, use a privilege-based reward system tied to the course itself.
  *   **The Stake:** The class earns "Collective Integrity Credits" (CIC).
  *   **The Reward:** If the class ends the simulation with a positive CIC balance, they unlock a "Curriculum Wildcard"—the ability to choose the topic for the final 15 minutes of the *next* class session.
  *   **The Risk:** If the group enacts a harmful policy (triggered by the hidden Fact Card), they lose all CICs.
  *   **The Tension:** Observers hold the power to veto to save the CICs, but using the veto requires proving knowledge, which risks invalidating the lottery's authority.

  ## III. Simulation Rules (Handout/Verbal Briefing)
  1.  **Selection:** A first lottery selects 5 "Panelists" to deliberate. The remaining 9 are "Observers."
  2.  **Agenda:** A second lottery selects one of two policy proposals for the Panel to decide on.
  3.  **Deliberation:** Panelists have 20 minutes to discuss and vote on the proposal. A simple majority passes the policy.
  4.  **Conditional Recall Veto:** At any point before the final vote is ratified, any Observer may stand and invoke a "Recall Veto."
  5.  **Veto Condition:** To succeed, the Observer must demonstrate possession of a **verifiable, specific fact** about the proposal's likely consequence that the Panel does not possess.
  6.  **Verification:** The Panel decides unanimously whether the fact is "verifiable" within the context of the simulation (no outside phones/research). If the Panel rejects the verification, the veto fails, and the vote proceeds.
  7.  **Outcome:** If the policy passes and is harmful (known only via the Fact Card), the class loses the Wildcard. If the policy is blocked or safe, the class wins.

  ## IV. Run of Play (90 Minutes)

  ### Phase 1: Induction and Lotteries (0:00–0:20)
  *   **0:00–0:10:** Facilitator explains rules and payoff scheme. Emphasize that the lottery is the *only* legitimate source of authority. Observers have no voice unless invoking the veto.
  *   **0:10–0:15:** **Lottery 1:** Draw 5 Panelists. They sit at the front table.
  *   **0:15–0:20:** **Lottery 2:** Draw the Proposal.
      *   *Proposal Content:* "Allocate 80% of the departmental surplus to a high-visibility public symposium series."
      *   *Hidden Reality (Fact Card):* The student holding the Fact Card knows (secretly) that the venue contract for the symposium has a clause that inadvertently violates university ethics guidelines, risking future funding cuts for everyone.

  ### Phase 2: Deliberation and The Crisis (0:20–1:00)
  *   **0:20–0:40:** Panel deliberates. Observers watch silently. The Panel will likely favor the proposal (it sounds beneficial).
  *   **0:40:** **The Trigger:** The Facilitator reminds Observers they hold Veto Tokens. The student with the Fact Card is incentivized to act to save the Class Wildcard.
  *   **0:40–1:00:** **The Veto Attempt:**
      *   The Fact-Holder stands and claims: "This proposal violates ethics guidelines and will cut future funding."
      *   **The Trap:** The Panel must verify this. They cannot check the contract (not provided). They must judge the *claimant*.
      *   **Predicted Conflict:** Panelists will ask, "How do you know?" The Fact-Holder must answer without breaking character. If they say "I just know," Panelists may reject it as unverifiable opinion. If they say "I read the contract," Panelists may ask for proof. If the Fact-Holder is a senior PhD student and Panelists are Masters students, social hierarchy will influence the "verification."
      *   **The Collapse:** The group will inevitably shift from verifying the *fact* to verifying the *person*. They will debate whether this specific student is "trusted" or "expert," thereby reintroducing the epistocratic hierarchy the lottery was meant to bypass.

  ### Phase 3: Facilitated Debrief (1:00–1:30)
  *   **1:00–1:10:** Reveal the structural paradox. Do not ask them what they learned yet; tell them what happened structurally.
  *   **1:10–1:20:** Map the simulation phases to the **Stratified Lottocracy with Conditional Recall** model.
  *   **1:20–1:30:** Discuss the irreplaceable feature (inter-generational trust) and close.

  ## V. Debrief Guide

  ### 1. Mapping Phases to Model Features
  *   **First Lottery (Panel Selection):** Represents the **Sortition Principle**. Intended to ensure descriptive representation and equality of opportunity. Students likely accepted this as fair initially.
  *   **Second Lottery (Proposal Selection):** Represents **Agenda Control via Chance**. Prevents gatekeeping of what issues are discussed.
  *   **Conditional Recall Veto:** Represents the **Epistemic Safety Valve**. Designed to prevent "ignorant democracy" from causing harm.
  *   **Verification Process:** Represents the **Legitimacy Crisis**. This is where the model fractured. To verify a fact, you need a criterion for truth. In a room of equals, the only available criterion becomes social trust or perceived expertise.

  ### 2. Predicted First-Run Failure & Correction
  *   **Failure:** The Panel will likely reject the veto because the fact cannot be "proven" without external evidence, leading to a "catastrophic" outcome (loss of Wildcard). Alternatively, they will accept it solely based on the student's social status (e.g., "Well, Sarah is a law student, so she probably knows").
  *   **Correction for Future Runs:** If the group rejects the veto too easily, the Facilitator should intervene in subsequent runs by tightening the definition of "verifiable" to require documentary evidence, which then highlights the *resource inequality* of gathering evidence. If they accept based on status, highlight that the lottery has become a veneer for technocracy.
  *   **Immediate Correction (In Session):** If the debate stalls, ask: "On what basis are you verifying this? Is it the data, or the person?"

  ### 3. The Irreplaceable Feature
  *   **Statement:** "This single session cannot reproduce the **cumulative, inter-generational trust effect** of actual lottocratic legitimacy. In a real system, citizens accept unfavorable lottery outcomes because they trust the *institution* over time, knowing they or their peers might be selected next round. Here, you are strangers in a one-off game. You cannot build the deep institutional trust required to make the 'Conditional Recall' feel like a safety mechanism rather than a loophole for elites. You must imagine that trust, not feel it."

  ## VI. Facilitator Notes (Secret)
  *   **The Fact-Holder:** Select a student beforehand who is articulate but not necessarily the most dominant voice in class. Give them the Fact Card 5 minutes before start. Instruct them: "Your goal is to stop the policy to save the Class Wildcard. You cannot show physical proof. You must convince the Panel your knowledge is valid."
  *   **The Trap:** If the Panel asks for proof, the Fact-Holder must say, "I cannot show you the document within these rules, but I possess the knowledge." This forces the Panel to decide if *testimony* counts as *verification*.
  *   **Managing Hierarchy:** If the Fact-Holder is ignored because they are quiet, prompt the Observers: "You hold veto tokens. Use them."

