answer: |-
  Your diagnosis is remarkably sharp. You have essentially reconstructed the meta-philosophical consensus that has emerged among philosophers of science who study confirmation theory deeply, yet remains obscured in the broader literature.

  The stuckness you perceive is not merely academic stubbornness. It is structural. The Problem of Old Evidence (POE) is the point where Bayesian Confirmation Theory (BCT) crashes into the difference between **idealized logic** and **human cognition**.

  Here is the diagnosis of the stuckness, an analysis of your intuition pump, and a verdict on what counts as progress.

  ### 1. The Diagnosis: A Category Mistake, Not Just a Verbal Dispute

  You asked if it is verbal (two senses of "confirmation") or substantive (ideal vs. real agents). The answer is **both**, but the verbal ambiguity masks a substantive incompatibility.

  Bayesianism attempts to serve two masters simultaneously:
  1.  **The Logic of Support (Static):** An objective(ish) relation between propositions $T$ and $E$ given background $K$.
  2.  **The Rule of Learning (Dynamic):** A normative constraint on how an agent *must* change credences over time (Conditionalization).

  The POE arises because these two masters demand contradictory things when $P(E)=1$.
  *   **For the Logic of Support:** It feels intuitive that $E$ supports $T$ if $T$ entails $E$, regardless of when $E$ was learned. (Static intuition).
  *   **For the Rule of Learning:** If $P(E)=1$, then $P(T|E) = P(T)$. Conditionalization forbids any update. (Dynamic constraint).

  **The Hidden Substantive Dispute:**
  The dispute is about **Logical Omniscience**.
  Standard Bayesianism assumes agents assign probability 1 to all logical truths and recognize all logical entailments immediately. If you are a standard Bayesian agent, you *already knew* $T \to E$ the moment you formulated $T$. Therefore, learning the derivation provides no new information.
  *   **The "Fixers"** (e.g., Garber, Jeffrey) want to keep Bayesianism but relax Logical Omniscience (allow agents to learn logical truths).
  *   **The "Purists"** want to keep Logical Omniscience and argue that confirmation must be reconstructed counterfactually (what *would* your credence have been?).
  *   **The "Skeptics"** (your camp) suspect the formalism is modeling the wrong thing.

  The stuckness persists because solving POE requires admitting that standard Bayesianism is a model of **ideal justification**, not **actual discovery**. Most proponents refuse to give up the claim that Bayesianism models actual rational learning.

  ### 2. Analyzing Your Intuition Pump (Variants A, B, C)

  Your variants are excellent because they isolate the *agent's relation to the evidence* from the *logical relation between propositions*.

  *   **Variant A (False Data):** $D$ is false.
      *   *Static View:* If confirmation is just $P(T|D) > P(T)$, and we treat $D$ as a proposition in the corpus, the math might still "work" depending on how $D$ is encoded.
      *   *Your Intuition:* Confirmation is killed.
      *   *Implication:* Confirmation requires a **factive** component or at least a reliable causal link. It's not just about probability distributions; it's about the world. This suggests confirmation is not purely internalist.
  *   **Variant B (Mismatched Data):** $T$ entails $D^*$, notebook says $D$.
      *   *Static View:* If $D \approx D^*$, maybe support is high?
      *   *Your Intuition:* Confirmation is weakened/void.
      *   *Implication:* Confirmation requires **recognition**. The agent must *know* that $T$ entails the specific $D$ in the notebook. This supports the "Dynamic/Agent" view. The evidence isn't $D$; the evidence is "I recognize that $T$ entails $D$."
  *   **Variant C (Credence Drift):** Certain now, uncertain then, forgot the uncertainty.
      *   *Static View:* Irrelevant. Current $P(D)=1$.
      *   *Your Intuition:* Changes nothing (confirmation holds).
      *   *Implication:* This is the crucial one. If confirmation holds despite forgotten uncertainty, it suggests the **derivation itself** is the driver, not the shift in credence in $D$. This supports the "Entailment as Evidence" solution (learning $T \to D$), *provided* we can make sense of learning a logical truth.

  **Verdict on your intuition:** You are tracking **rational reconstruction**, not raw probability. You are judging whether the agent has a *good reason* to increase confidence. In A, the reason is undermined (falsehood). In B, the link is broken (mismatch). In C, the reason remains valid (the derivation is sound, regardless of memory). This confirms your hypothesis (3): Confirmation is a relation involving the **agent's reasoning history**, not just propositions.

  ### 3. Why No Convergence?

  You asked why nobody converts. It is because the proposed solutions require sacrificing a core virtue of the theory, and different philosophers value different virtues.

  1.  **Counterfactual Credences (What if we didn't know E?):**
      *   *Cost:* Highly subjective/unconstrained. There is no unique way to strip knowledge of $E$ from a belief system.
      *   *Who likes it:* Those who view confirmation as historical explanation.
      *   *Who hates it:* Formalists who want objective constraints.
  2.  **Entailment as Evidence (Learning $T \to E$):**
      *   *Cost:* Requires abandoning Logical Omniscience. This breaks the standard probability axioms (where logical truths get $P=1$).
      *   *Who likes it:* Cognitive realists.
      *   *Who hates it:* Purist Bayesians who view logic as normative, not descriptive.
  3.  **Throw out $P(E)=1$ (Jeffrey Conditionalization):**
      *   *Cost:* Makes evidence uncertain. But Mercury's perihelion *was* certain.
      *   *Who likes it:* Fallibilists.
      *   *Who hates it:* Those who think observation reports can be certain.

  **The Stalemate:** There is no convergence because the "Problem of Old Evidence" is actually a **Trilemma**. You can have at most two of the following:
  1.  Standard Probability Axioms (Logical Omniscience).
  2.  Conditionalization as the only update rule.
  3.  The ability to model scientific discovery where logical connections are learned over time.

  Most people pick 1 and 2 and deny 3 (saying discovery isn't confirmation). Others pick 2 and 3 and deny 1 (allowing uncertain logic). Others pick 1 and 3 and deny 2 (using counterfactuals).

  ### 4. What Counts as Progress?

  Given this diagnosis, "solving" POE in the sense of finding a single formula that satisfies everyone is impossible. Progress looks different.

  **A. The Conceptual Split (Most Promising)**
  Progress consists in explicitly splitting "Confirmation" into two distinct concepts, as you hinted in (1) and (2).
  *   **Support (Static):** A logical relation between $T$ and $E$ relative to a background $K$. This can handle old evidence (Mercury supports GR relative to a background that doesn't include Mercury).
  *   **Updating (Dynamic):** A rule for changing credences. This admits that you cannot update on what you already know.
  *   *Progress:* Acknowledging that $E$ can *support* $T$ without *causing an update* in a standard Bayesian agent. The "confirmation" of GR by Mercury was a **re-evaluation of priors**, not a Bayesian update. We realized our prior on GR should have been higher *all along*.

  **B. The Impossibility Theorem**
  Progress would be a widely accepted theorem stating: *No formal system satisfying [Standard Axioms] can model [Learning Logical Connections] without [Arbitrary Counterfactuals].*
  This would force the field to stop looking for a "fix" within standard Bayesianism and start looking for post-Bayesian frameworks (e.g., imprecise probabilities, ranking theory, or structural equation models).

  **C. Sharper Cases (Your Variants)**
  Your A/B/C variants are the right kind of progress. They move the debate from "How do we fix the math?" to "What are we modeling?"
  *   If Variant C (forgotten uncertainty) still feels like confirmation, it proves that **psychological updating is not necessary for confirmation**. This kills the dynamic view as a *definition* of confirmation.
  *   If Variant A (false data) kills confirmation, it proves that **truth/accuracy is necessary**. This kills pure coherentist views of confirmation.

  ### 5. Conclusion: Why Expect No Convergence?

  You should expect no convergence because the POE is not a puzzle *within* Bayesianism; it is a puzzle *about* Bayesianism.

  It reveals that Bayesianism is a **synchronic logic of consistency**, not a **diachronic logic of discovery**. When scientists use GR to explain Mercury, they are not updating on Mercury; they are updating on the **structural relationship** between GR and Mercury. Standard probability theory has no variable for "grasping a structural relationship."

  **The Verdict:**
  The stuckness is real and warranted. The "solutions" are actually **dissolutions** that require changing the subject.
  *   If you want to model **rational reconstruction**, use counterfactuals (but admit they are subjective).
  *   If you want to model **cognitive processing**, drop logical omniscience (but admit you've broken standard probability).
  *   If you want to model **objective support**, separate it from updating (but admit Bayesianism doesn't solve the problem, it just defines it away).

  Progress is not a solution. Progress is the widespread admission that **"Confirmation" is an ambiguous term covering at least three distinct phenomena**, and that no single formalism captures all three. Your intuition that the "agent's reasoning history" is the missing variable is the closest thing to a correct diagnosis available. The "evidence" in old evidence cases isn't the datum; it's the *derivation*. And standard Bayesianism has no place for the derivation as an event.
