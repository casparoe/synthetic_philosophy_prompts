          3.  Impartial Spectator $\rightarrow$ Second-order precision-weighting mechanism regulating affective prediction errors.
      *   **Evaluation Criteria:** For each mapping, determine if it translates cleanly, requires distortion (of Smith or PP), or has no genuine expression.
      *   **Residue Report:** Analyze what fails to carry over (normative, intersubjective, authority-conferring elements). Does this show a limitation of PP in moral psychology, or does it show Smith's account resists mechanistic translation?
      *   **Audience:** Fluent in both Smith and PP literature (no simplification, high technical density allowed/expected).

  2.  **Analyze Component 1: Sympathy as Coupled Interoceptive Inference.**
