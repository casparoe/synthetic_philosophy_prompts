prompt: |-
  I'm working through Adam Smith's account of sympathy and the impartial spectator—specifically his claim that moral judgment depends on an imaginative exchange of situations and sentiments, and that self-command arises from viewing one's own conduct through the eyes of an internalized, impartial spectator. I want you to restate this account systematically in the vocabulary of predictive processing and hierarchical active inference: treat sympathy as coupled interoceptive inference between agents, the imaginative change of places as a cross-agent update to hierarchical generative models, and the impartial spectator as a second-order precision-weighting mechanism that regulates affective prediction errors across social contexts. For each of these three components, report whether it translates cleanly into the target vocabulary, whether it can be preserved only by distorting either Smith's normative commitments or the predictive framework's mechanistic assumptions, or whether it has no genuine expression at all. Then provide a residue report: does whatever fails to carry over—particularly any irreducibly normative, intersubjective, or authority-conferring element—indicate a genuine limitation in applying predictive processing to moral psychology, or does it reveal that Smith's original account contained commitments that resist mechanistic translation? I am fluent enough with both Smith and the predictive-processing literature to follow technical distinctions, so do not simplify either framework for accessibility.
