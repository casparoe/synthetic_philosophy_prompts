  ### **Node 1: Definitional Priority**
  **Question:** Is a fact fundamental *because* it is ungrounded, or is it ungrounded *because* it is fundamental?
  *(In other words: Is 'grounding' the primitive tool used to define fundamentality, or is 'fundamentality' a primitive status used to define which facts do no grounding?)*

  *   **A. Fundamental because ungrounded:** (Grounding is primitive; fundamentality is derivative). → **Go to Node 2**.
  *   **B. Ungrounded because fundamental:** (Fundamentality is primitive; grounding is derivative explanation). → **Leaf 1: Deflationary Primitivism**.

  ---

  ### **Node 2: Existence of the Relation**
  **Question:** Does the grounding relation obtain between any distinct entities (e.g., does the existence of Socrates ground the existence of {Socrates})?
  *(Answer based on whether you accept any instances of metaphysical explanation, not merely causal or logical implication.)*

  *   **A. No:** (There is no such relation as grounding). → **Leaf 2: Grounding Nihilism**.
  *   **B. Yes:** (Grounding obtains in at least some cases). → **Go to Node 3**.

  ---

  ### **Node 3: Reflexivity**
  **Question:** May a fact be among its own partial grounds?
  *(i.e., Is the grounding relation strictly irreflexive, or can a fact contribute to explaining itself?)*

  *   **A. Yes:** → **Leaf 3: [Empty: Incoherent]**.
      *   *Flag:* This combination is unoccupied. Standard grounding realism defines the relation as irreflexive and asymmetric. Accepting self-grounding typically collapses the distinction between ground and grounded, rendering the explanatory structure vacuous or circular in a way no extant foundationalist view accepts.
  *   **B. No:** (Grounding is irreflexive). → **Go to Node 4**.

  ---

  ### **Node 4: Termination**
  **Question:** Must every chain of grounding relations terminate in something that is itself ungrounded?
  *(i.e., Is there a fundamental base, or can grounding chains continue infinitely downwards?)*

  *   **A. No:** (Chains need not terminate; infinite descent is possible). → **Leaf 4: Infinite Descent**.
  *   **B. Yes:** (There is a fundamental base). → **Go to Node 5**.

  ---

  ### **Node 5: Holism vs. Atomism**
  **Question:** Is the cosmos as a whole more fundamental than its proper parts?
  *(i.e., Does the whole ground the parts, or do the parts ground the whole?)*

  *   **A. Yes:** (The whole is the fundamental base). → **Leaf 5: Priority Monism**.
  *   **B. No:** (The parts are the fundamental base). → **Go to Node 6**.

  ---

  ### **Node 6: Laws and Particulars**
  **Question:** Are the laws of nature grounded in the particular matters of fact?
  *(i.e., Do laws supervene on the Humean mosaic, or do they help ground the particular facts?)*

  *   **A. Yes:** (Laws are summaries of particulars). → **Leaf 6: Humean Supervenience**.
  *   **B. No:** (Laws are fundamental or ground the particulars). → **Go to Node 7**.

  ---

  ### **Node 7: Unity and Modality**
  **Question:** Is 'grounding' a single univocal relation that strictly necessitates its relata, or a family of distinct relations where some may be contingent?
  *(i.e., Is there one 'Because' that guarantees metaphysical necessity, or many 'becauses' with varying modal strength?)*

  *   **A. Family/Contingent:** (Grounding is plural or non-necessitating). → **Leaf 7: Grounding Pluralism**.
  *   **B. Single/Necessitating:** (Grounding is unified and necessary). → **Go to Node 8**.

  ---

  ### **Node 8: Objects vs. Structure**
  **Question:** Are fundamental entities primarily objects bearing properties, or positions in a structure?
  *(i.e., Is the fundamental layer composed of 'things', or is it purely relational structure without relata?)*

  *   **A. Positions/Structure:** (Relations are fundamental; objects are derivative). → **Leaf 8: Ontic Structuralism**.
  *   **B. Objects:** (Things with properties are fundamental). → **Leaf 9: Orthodox Foundationalism**.

  ---

  ### **Annotations & Flags**

  **1. Unoccupied Logical Space (Leaf 3):**
  The path accepting **Reflexive Grounding** (Node 3, Answer A) is marked **[Empty]**. While logically conceivable, this position is effectively unclaimed in contemporary metaphysics. It is marked incoherent because the theoretical role of grounding is to provide asymmetric explanation; if $A$ grounds $A$, the explanatory value vanishes. Views that appear to accept this (e.g., some forms of Spinozism) typically redefine 'grounding' to mean something else (like logical containment), placing them in **Deflationary Primitivism** or **Nihilism** instead.

  **2. Indistinguishable Leaves (Leaves 8 & 9):**
  **Ontic Structuralism** and **Orthodox Foundationalism** cannot be fully separated by the questions in this tree alone. Both accept a fundamental base, termination, and standard grounding. The distinction rests on the *categorial nature* of the base (objects vs. relations), which Node 8 attempts to capture. However, sophisticated Orthodox views often admit relations are fundamental *alongside* objects, and Structuralists often posit 'nodes' that look like objects. Students landing here should be pressed on whether the structure *ontologically depends* on the relata (Orthodox) or the relata *ontologically depend* on the structure (Structuralist).

  **3. Definitional Priority (Node 1):**
  This node honors the primary distinction requested. **Deflationary Primitivism** (Leaf 1) captures views (like Dasgupta's or some readings of Sider) where 'fundamentality' is the heavy lifter and 'grounding' is merely talk of explanation in terms of the fundamental. All other leaves presuppose **Grounding Realism**, where 'grounding' is the heavy lifter and 'fundamental' just means 'at the bottom of the grounding chain'.

  **4. The 'Physical' Constraint:**
  Note that Node 5 (Holism) and Node 8 (Objects vs. Structure) avoid asking whether the "physical" is fundamental. Priority Monists may think the whole is physical, but the question targets mereology, not materialism. Similarly, Structuralists may think the structure is mathematical, but the question targets ontology, not abstractness.
