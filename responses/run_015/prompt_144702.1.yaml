answer: |-
  Dear Colleague,

  Here is the diagnostic decision tree you requested for the second-year seminar, designed to lead students from their intuitions about concrete cases to the theory of emotion they are implicitly committed to without ever exposing them to the theoretical labels beforehand. I have worked through the logical space to ensure the questions are ordered by metaphysical breadth, starting with intentionality before moving to physiology and then cognitive content, because a student's view on whether emotions require objects fundamentally constrains which physiological or cognitive theories are even available to them. We begin at the first branch node by asking whether it is possible to be in an emotional state without that state being directed at any particular thing, using the case of a mood with no object at all. If the student answers yes, they arrive at the first leaf, labelled Mood Theory, with the awkward commitment that it struggles to distinguish emotions from mere background affective states; if they answer no, believing emotions must be about something, we proceed to the second node. Here we ask whether fear would vanish if a drug blocked all bodily sensations, drawing on the case of fear in someone whose bodily feelings are chemically blocked, and I have placed this question second because the necessity of bodily feeling is the next most fundamental divide after intentionality. A yes answer here leads to the second leaf, the James-Lange Theory, whose most awkward commitment is that it makes emotion too fragile to survive minor physiological disruptions, whereas a no answer moves us to the third node. At this stage we ask whether a pre-linguistic infant can feel distress, using the case of distress in a pre-linguistic infant, which serves to separate theories that require conceptual capacity from those that do not. If the student says no, they land on the third leaf, Strong Cognitivism, with the awkward commitment that it denies emotional lives to babies and animals, but if they say yes, we continue to the fourth node. Now we test for recalcitrance by asking whether one can feel fear while standing on a glass walkway one knows perfectly well is safe, and I have prioritised this case over the others because it is the standard test for whether emotion tracks belief or perception. A no answer here leads to the fourth leaf, Judgment Theory, with the awkward commitment that it cannot explain phobias or known irrational fears, while a yes answer takes us to the fifth node. Here we present the case of disgust at a sealed, sterilised sweet shaped like dog faeces to ask whether one can feel disgust at something known to be harmless, which narrows down the type of recalcitrance the student accepts. If they say no, they reach the fifth leaf, Evaluation Theory, with the awkward commitment that it over-intellectualises visceral reactions like disgust, but if they say yes, we proceed to the sixth and final node. Here we ask whether anger can persist after learning the person was innocent, using the case of anger that persists after you learn the person was innocent, to distinguish between those who allow some recalcitrance and those who allow pervasive persistence. A no answer leads to the sixth leaf, Rationalist Theory, with the awkward commitment that it denies common experiences of lingering resentment, while a yes answer leads to the seventh leaf, Perceptual Theory, with the awkward commitment that it risks treating emotions like sensory hallucinations.

  Regarding the logical space, there are combinations of answers that are possible but unoccupied, specifically where a student accepts recalcitrance in the glass walkway case but denies it in the fake faeces case, which is merely unattractive because it arbitrarily limits recalcitrance to fear, or where they accept disgust recalcitrance but deny anger persistence, which is incoherent because both cases test the same independence of emotion from judgment. I must also flag that this tree cannot separate Perceptual Theory from Cannon-Bard Physiological Centralism at the seventh leaf, as both deny bodily necessity and accept recalcitrance, so I have labelled the leaf with the more phenomenologically distinct position while noting that a student committed to centralism will also end up here. This structure ensures that every path is grounded in a concrete intuition, allowing the student to discover their theoretical commitments through the cases rather than the labels.

  Yours sincerely,

  The Professor
