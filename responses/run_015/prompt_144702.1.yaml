prompt: |-
  You are a professional philosopher who has taught the philosophy of the emotions for years. Before you write anything, work the problem out on paper: sketch the logical space first — what the separating questions can be, which combinations of answers they permit — and only then place the named positions inside it. I want your settled judgement about the ordering, not a survey of the ways one might order it, so where two arrangements would sort cases the same way, pick one and say in a clause why.

  I am building a diagnostic for a second-year seminar: a decision tree that leads a student from their answers about cases to the theory of emotion they are implicitly committed to, without ever asking which theory they prefer. No more than seven branch nodes and no more than seven leaves. Every node must be phrased as a question about a concrete case, answerable by someone who has never met the labels, and the tree should still work if all the labels were stripped off. Please draw on at least four of these cases: disgust at a sealed, sterilised sweet shaped like dog faeces; fear while standing on a glass walkway you know perfectly well is safe; anger that persists after you learn the person was innocent; distress in a pre-linguistic infant; fear in someone whose bodily feelings are chemically blocked; being moved by a piece of instrumental music; a mood with no object at all.

  Label each leaf with the standard name for the position where it has one, together with one clause on that position's most awkward commitment, and say plainly which combinations of answers are possible but unoccupied, and whether that is because the combination is incoherent, merely unattractive, or simply unexplored. Flag any pair of leaves your tree cannot separate rather than inventing a distinction between them. Write the whole thing as continuous prose, the way you would in an email to a colleague: no headings, bullets, bold or tables — just walk the reader down the tree, node by node, naming the leaf at the end of each path. Use British English.
