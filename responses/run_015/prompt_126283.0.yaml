  **Note on the Text**

  I took a few liberties to make the philosophy fit the form. First, Wittgenstein actually argues against saying "I know" regarding hinge propositions (like having hands) because "knowing" implies you could be wrong or could check the evidence. He suggests these aren't things we *know*, but things we *act* on without thinking. I used "See here, I have two hands" to lean toward the gesture rather than the claim, but kept the rhythm close to Moore's original "I know" formulation because it's more recognizable.

  Second, I committed hard to the reading that hinges are *conditions* for belief (grammatical rules) rather than just *buried beliefs* (empirical facts we stopped checking). Wittgenstein wobbles on this in *On Certainty*—sometimes he says the riverbed of thoughts shifts, implying hinges are just hardened beliefs. My poem treats them as fixed conditions to support the villanelle's rigid structure, implying doubt literally cannot touch them because they are what allows doubt to move.

  Finally, the "riverbed" metaphor appears in the fifth tercet. In the text, the riverbed (hinges) can slowly shift over time, becoming water (doubt) and vice versa. In the poem, I froze the riverbed ("dry and white") to match the idea that, in this specific moment of doubting, the hinges must hold still or the language game collapses. I treated rust as doubt implicitly in the "fight" imagery, though Wittgenstein doesn't use that exact metaphor.
