answer: |-
  Yes, this has a name: it is the **Knobe Effect** (also called the **Side-Effect Effect**), a phenomenon in experimental philosophy where moral judgments about an outcome asymmetrically influence whether people attribute intentionality, knowledge, or desire to the agent who caused it.

  Your pattern matches the established concept precisely in its core structure: an agent performs an action for a neutral goal (profit/grazing), foresees a side effect (harm/help), and observers' attribution of mental states flips based on the moral valence of that side effect. The canonical case involves a CEO who implements a program to increase profits, knowing it will either harm or help the environment; people say he intentionally harmed the environment but did not intentionally help it, despite identical statements of foresight and indifference. Your solvent/river and pond/wader cases are structurally isomorphic to this. Where your observation extends slightly beyond the original 2003 formulation is in your specific note on *foresight* itself. The original effect focused on *intentionality* ("did he do it on purpose?"). However, subsequent work (often called the **Epistemic Side-Effect Effect**) confirmed your suspicion: people are also more willing to say the agent *knew* the bad outcome would happen than the good one, even when evidence for foresight is identical. You are solid here; this is a replicated finding, not just your local variation.

  The edges of this concept are critical to understand what it is not. It is **not** a judgment about causality; as you noted, people agree the action caused the outcome in both cases. It is **not** a general hindsight bias (thinking the outcome was inevitable after the fact); your participants agreed the outcome was predictable in principle in both cases. It is **not** simply an error in logic or a failure of reasoning; if it were, defining "on purpose" should have eliminated the gap entirely, but you found it only shrank. This suggests the effect is not a bug in human reasoning but a feature of how we use psychological concepts socially. The concept stops at the boundary of *mental state attribution*. It does not claim people see the physical world differently, only that they categorize the agent's relationship to that world differently based on normative stakes.

  Your hypothesis that "on purpose" is a tool for deciding suitable targets of praise or blame is one of the leading theoretical explanations, often called the **Moral Judgment Model** or **Pragmatic Account**. The competing view is the **Deep Self Account**, which argues that bad side effects are seen as revealing the agent's true values (greed outweighs care), whereas good side effects don't necessarily reveal a benevolent true self if the motive was profit. Your pub experiment actually bears on this debate. The fact that forcing a definition shrank the gap suggests the effect relies on the pragmatic, social use of the term rather than its strict semantic definition. That makes your experiment valuable, not worthless; it isolates the pragmatic component. However, you must be careful not to muddle *foresight* (could she know?) with *knowledge attribution* (does she count as knowing?). Your participants said the outcome was predictable (objective foresight) but flipped on whether *she* foresaw it (subjective knowledge attribution). That distinction is sharp and you handled it correctly.

  I am solid on the identification of the Knobe Effect and the match to your cases. I am solid that the effect extends to knowledge attributions (Epistemic Side-Effect Effect). I am extrapolating slightly on the theoretical explanation; while your "tool for blame" hypothesis is widely supported, there is no consensus that it is the *only* explanation (the Deep Self account still has proponents). I am speculating only on the precise mechanism of why your definition trick shrank the gap, though the pragmatic inference is the standard interpretation. Your two cases are as parallel as the philosophical literature requires; the asymmetry you found is the defining feature of the phenomenon, not a flaw in your comparison.
