  *(Refining the AI point)*: The user asks "Who's right?" I shouldn't just sit on the fence. I need to explain *why* it's a stalemate based on prior metaphysical commitments (Realism vs. Instrumentalism). The empirical stakes are low; the semantic stakes are high.

