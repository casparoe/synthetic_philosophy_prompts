      *   *Key Insight:* The shift from "Beliefs don't exist" to "Beliefs are not what FP says they are" is where the view often retreats. Need to highlight the difference between *Eliminatism* and *Revisionism*.
      *   *Refining the AI point:* This is the crux. If the pattern is physically real, is it a belief? Eliminativists say "No, because FP theory about that pattern is wrong." Realists say "Yes, because the pattern does the work."

