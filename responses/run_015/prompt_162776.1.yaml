  12. **Final Polish:** Check for clarity on "Intertheoretic Reduction." Ensure the distinction between *ontology* and *heuristics* is clear in the AI section. (Self-correction: Make sure to emphasize that EM is an *empirical hypothesis*, not just armchair philosophy.)

