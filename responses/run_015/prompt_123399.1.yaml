  A Schellenberg scholar would insist on the qualifier 'non-resistant.' God need not reveal Himself to those actively resisting. A careful theist would argue that coercive evidence undermines the freedom required for genuine love, distinguishing epistemic distance from abandonment. They would reject the equation of 'presence' with 'explicit belief,' arguing one can relate to God implicitly. Finally, they would note that Schellenberg's premise—that personal relationship requires explicit belief—is contested. If relationship is possible without propositional certainty, the argument from hiddenness loses its deductive force.
