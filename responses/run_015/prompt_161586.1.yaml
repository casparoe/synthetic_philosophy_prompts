      *   **Move 4 (Marcus):** Counter-critique. Calibration is possible. Training refines vocabulary ("nothing" vs. "indefinable"). This tracks performance better. Nina can't distinguish "better" data, just "different" text.
          *   *Assessment:* Strong point for phenomenological methods. Training *does* improve resolution (e.g., micro-phenomenology). Nina's stance makes it hard to say *why* training helps if it's just text.
