      *   **Move 2 (Marcus):** Critiques Nina. Says she "goes quiet" on the actual question (was there experience?). Claims she swaps the *explanandum* (experience) for behavior.
          *   *Assessment:* This is the standard realist critique of heterophenomenology. It hits the nerve: if science of consciousness ignores the *phenomenology* itself, is it still a science of *consciousness*?
