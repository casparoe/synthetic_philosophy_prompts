      *   **Move 3 (Nina):** Defends. The *divergence* (discrimination without report) is the finding. Avowals are unvalidated instruments.
          *   *Assessment:* Strong point. In near-threshold studies, the dissociation is the data. Treating "I saw nothing" as infallible blocks the discovery of unconscious perception.
