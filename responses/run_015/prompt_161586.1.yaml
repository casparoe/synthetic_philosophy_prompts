      *   **Move 5 (Nina):** Hard Case 1 (Patient R - Amnesia/Confabulation). Concurrent report = good text; Retrospective confabulation = bad text (detectable via third-person inconsistency). Marcus's method relies on retrospective explicitation, risking confabulation.
