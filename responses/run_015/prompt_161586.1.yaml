answer: |-
  Here is the adjudication of the seven moves, followed by an overall assessment of the dispute.

  ### Adjudication of Moves

  **(1) Nina: Heterophenomenology defined.**
  **Verdict: Mostly Right.**
  **Reason:** This is an accurate summary of Dennett's heterophenomenology. It is methodologically sound for avoiding Cartesian assumptions, though critics argue it presupposes anti-realism about qualia by treating experience as a "constructed world" rather than a target of investigation.

  **(2) Marcus: The "Explanandum Swap" objection.**
  **Verdict: Mostly Right.**
  **Reason:** He correctly identifies the central risk of heterophenomenology: that by refusing to validate reports against experience, the method may eliminate the very phenomenon (consciousness) it claims to study, reducing it to behavior plus correlation.

  **(3) Nina: The divergence is the data.**
  **Verdict: Clearly Right.**
  **Reason:** In near-threshold vision (and blindsight), the scientific finding *is* the dissociation between discrimination and report. Treating "I saw nothing" as an infallible truth would make unconscious perception impossible to discover. Her operationalism is necessary for this specific paradigm.

  **(4) Marcus: Calibration and triangulation.**
  **Verdict: Mostly Right.**
  **Reason:** He makes a strong empirical point: training *does* refine reports and improve correlation with performance. Nina's framework struggles to explain *why* training helps (i.e., why one text is "better" than another) without implicitly admitting the reports track a reality beyond the text.

  **(5) Nina: Patient R (Confabulation).**
  **Verdict: Clearly Right.**
  **Reason:** This is a decisive win for heterophenomenology in this specific instance. Retrospective reports in amnesic patients are notoriously unreliable. Nina's method flags the inconsistency third-personally; Marcus's reliance on explicitation risks validating confabulation as "refined data."

  **(6) Marcus: Subject S (Latent Experience).**
  **Verdict: Mostly Wrong.**
  **Reason:** While he correctly notes that Nina's method might miss faint experiences (false negatives), his claim that the *later* report proves the *earlier* experience existed is metaphysically insecure. It assumes memory of experience is veridical, ignoring that the training itself may have constructed the memory (a risk symmetric to Patient R).

  **(7) Nina: Truth conditions and private objects.**
  **Verdict: Mostly Right.**
  **Reason:** She forces Marcus to articulate truth conditions for past experience independent of memory/report. If he cannot (which is difficult), his claim that the later report is "correct" rests on an appeal to private, inaccessible facts, which undermines the public nature of science.

  ---

  ### Overall Adjudication

  **Who is more right overall?**
  **Nina** is more right regarding the **design of this specific study**, but **Marcus** is more right about the **long-term goals of consciousness science**.

  For a study on near-threshold vision, Nina's operationalism is essential. If you treat "I saw nothing" as authoritative, you cannot measure Type 2 blindsight or unconscious perception. Her method protects the study from confabulation and metaphysical baggage. However, Marcus is correct that a science of consciousness cannot *forever* remain agnostic about the reality of the experience. If reports are never validated against the experience itself, the field becomes a science of speech behavior, not consciousness. Nina wins the methodological skirmish; Marcus wins the philosophical war.

  **Are the two hard cases (Patient R and Subject S) symmetric?**
  **No.** They appear symmetric (one report is false, one report is delayed), but they are epistemically distinct.
  *   **Patient R** involves a **failure of memory access**. We have independent third-person grounds (the amnesia diagnosis) to doubt the retrospective report. Nina wins here because the third-person evidence overrides the text.
  *   **Subject S** involves a **change in attentional resolution**. Marcus claims the later report reveals a prior truth. However, this is vulnerable to the same confabulation risk as Patient R. The subject may be reconstructing what they *must* have felt based on their new ability to discriminate. Nina is right to treat S's later report as a *new* text, not a key to the *old* lock. The asymmetry lies in the fact that we have independent evidence for R's deficit, but only behavioral correlation for S's improvement.

  **Which parts of the dispute are verbal rather than substantive?**
  The dispute is **mostly substantive**, but there is a verbal knot around the word **"Experience."**
  *   For **Nina**, "experience" is a theoretical construct defined by the subject's dispositions to report.
  *   For **Marcus**, "experience" is a natural kind that exists independently of the report.
  When they argue about whether the experience was "there," they are often talking past each other. Nina means "Was there a functional state capable of sustaining a report?"; Marcus means "Was there a phenomenal feel?" However, the disagreement over **method** (whether to trust reports as data or as truth) is substantive, as it leads to different experimental designs and statistical treatments.

  **What are both parties missing?**
  1.  **The Theory-Dependence of Measurement:** Both assume method can be decided in a vacuum. In reality, the choice between Nina and Marcus depends on the **theory of consciousness** being tested. If the lab subscribes to Global Workspace Theory (access consciousness), Nina's focus on reportability is correct. If they subscribe to Integrated Information Theory or Phenomenological Realism (phenomenal consciousness independent of access), Marcus's search for non-reported experience is necessary. They are arguing about method, but they are actually disagreeing about **ontology**.
  2.  **The Normative Goal:** They fail to ask what the study is *for*. Is it to predict behavior (Nina's strength) or to understand the structure of subjectivity (Marcus's strength)? A science of consciousness likely needs both: Nina's rigor to establish correlates, and Marcus's depth to ensure those correlates map onto something that feels like something.
  3.  **Signal Detection Theory (SDT):** Both miss the standard psychophysical solution. SDT separates *sensitivity* (d') from *criterion* (bias). Nina treats the criterion as the data; Marcus treats it as noise to be trained away. The missing piece is modeling the criterion shift explicitly rather than arguing over whose text is "true."

  **Conclusion:** The disagreement is not merely about method; it is about **what a science of consciousness is supposed to be explaining**. Nina thinks it should explain the *relation between organism and environment* (including the organism's self-model). Marcus thinks it should explain the *intrinsic nature of the organism's state*. Until the lab agrees on the target, the method will remain contested.
