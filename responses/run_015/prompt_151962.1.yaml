answer: |-
  You have identified a phenomenon that sits at the intersection of moral philosophy, sociology, and game theory. Your intuition is correct: the standard vocabulary (*boycott, ostracism, shunning*) fails because it presupposes a level of coordination or agency that is absent here.

  You are describing a **decentralized, self-perpetuating social equilibrium that functions as punishment without a punisher.**

  Here is an analysis of the existing concepts, why they fall short, and a proposal for how to categorize and name this specific dynamic.

  ### 1. The Near Misses (Existing Concepts)

  You have already done the work of ruling out the obvious terms, but it is worth establishing exactly *why* they fail philosophically.

  *   **Ostracism / Shunning:** These imply a collective agent. In ancient Athens, ostracism required a vote. In religious shunning, the Elders decree it. In your scenario, there is no "group mind." The group never meets. The "group" is merely an aggregate of individuals acting on fear.
  *   **Informal Social Control:** This is the broad sociological umbrella. It fits, but it is too blunt. It covers everything from a frown to a rumor. It does not capture the *severity* (total isolation) or the *irreversibility* (no path to reintegration) that you observed.
  *   **Stigma (Goffman):** Erving Goffman's work on stigma describes the *status* of the victim (the "spoiled identity"). It explains why the person is tainted, but it does not explain the *mechanism of enforcement*. Stigma is the label; you are asking about the cage.
  *   **The Problem of Many Hands:** As you noted, this is about *responsibility*. It explains why no one feels guilty ("I was just one person"), but it doesn't name the *structure* of the event itself.

  ### 2. The Mechanism: Pluralistic Ignorance and Nash Equilibrium

  To understand what this *is*, we have to look at why it *happens*. You noted that many participants privately disagree with the isolation but participate anyway.

  *   **Pluralistic Ignorance:** This is a psychological state where most members of a group privately reject a norm, but incorrectly assume that most others accept it, and therefore go along with it. In your grade, most students might think, "This is too harsh," but they look around and see silence, so they infer, "Everyone else thinks he is dangerous." They are all mirroring each other's fear.
  *   **Nash Equilibrium:** In game theory, this is a state where no player can improve their position by changing their strategy while others keep theirs unchanged.
      *   *Current Strategy:* Avoid the boy.
      *   *Deviation:* Sit with the boy.
      *   *Payoff:* You become the next target (as happened to the girl).
      *   *Result:* Everyone stays silent, even though everyone would prefer a state where the boy was forgiven.

  This creates a **lock-in effect**. The system has no "off switch" because switching it requires a coordinated move that is too costly for any single individual to make.

  ### 3. Is It Punishment?

  This is your central philosophical question: *If no one intends it, is it punishment? And if it isn't punishment, does it need justification?*

  **The Procedural View (No):**
  Traditional definitions of punishment (e.g., H.L.A. Hart) require five elements: pain, for an offense, intentional, administered by an authority, under a legal system. Your scenario fails **Intention** (no single person intends the total isolation) and **Authority** (no one has the standing). Under this view, it is merely "unfortunate social consequences."

  **The Functional View (Yes):**
  Consequentialist ethics argues that if it walks like punishment and quacks like punishment, it is punishment. The boy suffers deprivation of social goods. His reputation is damaged. His future prospects are harmed. The *function* is retributive and deterrent.

  **The Verdict:**
  Philosophically, this is **Punishment without Agency.**
  The fact that participants do not intend the *total* outcome does not remove the need for justification. If I drive a car without brakes and hit someone, I may not have *intended* the crash, but I am responsible for the harm because the system I participated in was dangerous.
  The lack of intent mitigates *individual* blame (the "many hands" problem), but it does not mitigate the *moral weight of the outcome*. A sanction that destroys a life requires justification regardless of whether it was authored by a judge or emergent from a crowd.

  ### 4. A Proposed Name: "Emergent Exclusion"

  Since existing terms fail to capture the "no author/no endpoint" nature, I propose calling this **Emergent Exclusion**.

  **Definition:**
  *Emergent Exclusion is a state of total social isolation imposed on an individual through the uncoordinated, self-interested actions of a network, where the severity of the outcome exceeds the intent of any single participant, and where the cost of reintegration is too high for any single participant to bear.*

  **Why this name fits:**
  *   **Emergent:** The outcome arises from the bottom up, not top down. No one designed it.
  *   **Exclusion:** It describes the result (removal from the group) without implying a formal vote (Ostracism).

  ### 5. Boundary Cases: When is it Defensible?

  You asked what would have to be added for this to be the "ordinary, defensible thing," and what turns it into something else.

  **To make it Defensible (Legitimate Social Sanction):**
  1.  **Proportionality:** The degree of isolation must match the severity of the transgression. (In high school, a bad post often results in "social death," which is disproportionate).
  2.  **A Path to Reintegration:** A defensible sanction must have an endpoint. There must be a known mechanism for forgiveness (apology, time served, restitution). In your scenario, the "no endpoint" feature makes it tyrannical.
  3.  **Transparency:** The reasons for the exclusion should be clear. In Emergent Exclusion, the rules are often vague ("he's toxic"), which prevents the accused from correcting the behavior.

  **To make it Something Else (Abuse/Mobbing):**
  1.  **Contagion (Guilt by Association):** You noted that the girl who tried to help was dropped. This turns the sanction from *corrective* to *protective*. It is no longer about the boy's behavior; it is about the group's fear. This is the hallmark of a **Panic Equilibrium**.
  2.  **Permanence:** If the sanction outlasts the context (e.g., follows him to college or persists after graduation), it ceases to be social control and becomes **Social Death**.
  3.  **Anonymity:** When the enforcers hide behind the crowd ("I didn't say don't sit with him, I just... didn't"), accountability vanishes.

  ### 6. Summary for Your Inquiry

  *   **Does philosophy have a name?** Not a single, perfect word. The closest technical descriptions are **"Decentralized Norm Enforcement"** or **"Spontaneous Social Sanction."**
  *   **What should it be called?** **Emergent Exclusion.**
  *   **Is it punishment?** Functionally, yes. Ethically, it demands justification even without an author.
  *   **Why doesn't intent matter?** Because the harm is real. The "Problem of Many Hands" disperses guilt, but it does not erase the victim's suffering.
  *   **The Critical Flaw:** The lack of a **reintegration mechanism**. A just social system must allow for redemption. A system that locks a person out permanently, without a vote and without a key, is not a community enforcing norms; it is a machine grinding a person down.

  You are observing a failure of moral courage enabled by social structure. The "no one decided" aspect is not a loophole; it is the very mechanism that allows the harm to proceed without anyone feeling responsible. In political philosophy, this is sometimes called **structural violence**: harm that is built into the social structure itself, rather than inflicted by a specific hand.
