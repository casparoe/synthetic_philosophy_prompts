      Title: The Selective Submission Problem: Endogenizing the Agenda in Epistemic Democracy

      Proposal:
      Classical jury models establish that majority rule tracks truth if voters are competent and independent. However, these models treat the question voted upon as exogenous. In practice, questions reach a vote because prior filtering mechanisms failed to settle them. This project investigates the "selective submission problem": does endogenizing the agenda undermine the epistemic case for expanding the scope of majority rule? I distinguish two claims often run together: (1) Majority rule is reliable for the questions it actually decides (conditional reliability). (2) A group improves overall decision quality by routing more questions to majority rule (systemic expansion). My hypothesis is that selective submission preserves the first claim while invalidating the second.

      Standard debates focus on voter independence, deliberation-induced correlation, or heterogeneous competence. These treat the question set as fixed. My angle is orthogonal: even if voters are perfectly independent and competent on average, the mechanism that routes questions to a vote selects for difficulty. If subcommittees or directors filter easy cases, the remaining docket is enriched for hard cases where voter competence dips toward chance. Settling the standard debates does not resolve this, because selection bias operates on the input distribution, not the voting process itself. A model can satisfy all classical assumptions conditional on a vote occurring, yet still fail to justify expanding voting rights to previously filtered items.

      The method is formal modeling and simulation, requiring no external data. Months 1-2: Define a formal model of question difficulty and routing thresholds. Derive analytic results for how selection affects the distribution of competence among voted questions. Months 3-4: Construct synthetic simulations varying the correlation between difficulty and routing probability. Test whether majority rule remains superior to random chance under high selection pressure. Months 5-6: Apply the model to three illustrative cases: criminal juries (high stakes, strict routing), foundation boards (medium stakes, flexible bylaws), and legislative floors (low stakes, high volume). These cases establish boundary conditions for the theorem, not empirical generalizations. Months 7-8: Draft the philosophical argument separating conditional reliability from systemic expansion. Month 9: Finalize the practical deliverable and manuscript.

      I reject three alternatives. First, an empirical study of real bodies is infeasible without data access and cannot isolate counterfactuals (what would have happened if hard cases were not voted on). Second, a conceptual analysis of competence misses the structural selection mechanism; defining competence precisely does not explain why the voted sample is biased. Third, the social-choice literature on agenda control focuses on strategic manipulation by actors with preferences over outcomes. My project concerns epistemic filtering by actors attempting to route questions efficiently. While strategic setting distorts outcomes, selective submission distorts the *sample* of questions, which is a distinct error source. I incorporate the insight that agendas are not neutral but reject the assumption that agenda setters are primarily preference-maximizers rather than efficiency-maximizers.

      Possible conclusions range from confirming the hypothesis to a deflationary view. The strongest steelman against my project is that selection effects are simply absorbed into a redefined competence parameter for the voted subpopulation. If we define competence as "probability of correctness given this question reached a vote," the standard theorem holds unchanged, rendering the selection effect a technical footnote rather than a structural critique. This view is strong because it preserves the mathematical integrity of the theorem. To decide between us, I must show that the routing threshold is not independent of the truth value. If hard questions are not only harder to answer but systematically linked to specific truth conditions (e.g., ambiguity correlates with complexity), then redefining competence fails to capture the systemic loss. If the distribution of difficulty is unbounded, the project risks becoming empirical; I will bound this by analyzing worst-case scenarios where difficulty correlates perfectly with selection.

      The project fails if the selection effect proves mathematically negligible across all plausible routing functions, or if the distinction between conditional reliability and systemic expansion collapses under formal scrutiny. It is too big if determining the boundary requires empirical data on difficulty distributions I cannot simulate. I will declare failure if the model requires assumptions about the difficulty distribution that are equally as contentious as the conclusion.

      The deliverable for the foundation board is a conditional rule of thumb: "Route to full vote only when the executive committee's confidence falls below a specific threshold, provided the cost of error is symmetric." This comes with the limit that it assumes no systematic bias in the executive committee's filtering. Finally, I concede that reliability is not legitimacy. A proceduralist who values voting for reasons of equality or consent will not be moved by epistemic efficiency. This project claims only that if the goal is truth-tracking, expanding the vote is not always the optimal strategy; it makes no claim against those who value the vote for non-epistemic reasons.

