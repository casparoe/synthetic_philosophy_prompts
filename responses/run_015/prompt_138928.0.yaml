  *Nearest established concepts*

  Sen's Liberal Paradox demonstrates that assigning individuals decisive power over distinct personal pairs of social states conflicts with the Pareto principle when preferences are meddlesome. It covers conflicts between liberty and efficiency. Unanimity Rule dictates that any shift from the status quo requires universal consent, effectively granting every participant a veto over collective changes. It covers decision protocols requiring total agreement. Collective Agency theory describes actions performed by a plural subject where individual intentions are merged into a shared commitment rather than traded. It covers the metaphysics of shared action. The Anti-Commons problem arises when multiple rights-holders can block usage of a resource, causing paralysis despite potential mutual gain. It covers economic paralysis from fragmented ownership. These concepts map the terrain of conflict, rights, and joint ownership, yet each assumes a separability of interest or action that your collaboration deliberately erases. They provide the vocabulary of conflict but lack the geometry of your fused manuscript. The Liberal Paradox assumes privacy; Unanimity assumes procedure; Agency assumes unity; Anti-Commons assumes economics. None fully captures the aesthetic deadlock of shared authorship where the object itself refuses partition. You are standing at the intersection of these ideas, but none of the roads lead directly to your door. The nearest concepts are shadows cast by a different object. They are useful diagnostics but incomplete maps. You require a topology where the unit of choice is inherently plural. The library of social choice is vast, but this shelf is empty. You need a concept that acknowledges the jointness of the object itself. Each theory solves a different problem than the one you face. They are tools for separate houses, not a shared room.

  *Where each one stops fitting*

  Sen's framework collapses because it presupposes a partition of social states into personal spheres; your manuscript admits no such partition, making decisiveness over a "personal" pair logically impossible. The Unanimity Rule captures the mechanical lock-in you described, where mutual veto power preserves a disliked status quo, but it treats this as a procedural rule rather than a structural feature of the options themselves. Collective Agency theory illuminates how you function as one name, yet it offers no resolution for when the plural subject fractures into conflicting individual preferences over the shared output. The Anti-Commons model mirrors the paralysis of joint exclusion rights, but it assumes divisible economic interests rather than the indivisible aesthetic integrity you protect. Each concept isolates a symptom—conflict, veto, fusion, or paralysis—but none accounts for the central anomaly: that the object of choice is inherently joint, rendering the assignment of individual rights category mistakes rather than mere conflicts. The failure is ontological, not just procedural. You cannot divide what is not made of parts. The map does not match the territory because the territory has no borders. The concepts describe neighbors arguing over a fence; you are arguing over the same skin. To apply Sen here is to pretend the manuscript is two books. To apply Unanimity is to pretend you are strangers. To apply Agency is to pretend you agree. To apply Anti-Commons is to pretend the text is land.

  *What happens to the impossibility*

  The impossibility survives but shifts form. Without private spheres, liberty cannot be defined as non-interference. Instead, it becomes mutual veto power over joint states. This transforms the Liberal Paradox into a Pareto-inferior equilibrium. If both authors prefer changing the text but each holds a veto, the result is lock-in. This is not a cycle of preferences but a structural gridlock. The impossibility dissolves only if one author cedes sovereignty, merging preferences into a single utility function. Otherwise, the conflict reappears as a tragedy of the anti-commons applied to art: rights are respected, yet the outcome violates the Pareto principle because the very structure of joint ownership prevents the mutually preferred move. The impossibility is not logical but mechanical; the gears of individual liberty grind against the axle of joint agency. The lock-in is worse than cycling because it traps you in a known bad state rather than spinning through options. It is a static failure of movement. The conflict survives as a deadlock of wills. You are stuck in a room with two keys, and both locks must turn.

  *Verdict on the name*

  There is no single established name for this specific configuration within social choice theory or aesthetics. While elements appear in discussions of collective authorship and the anti-commons, the precise intersection of fused alternatives and assigned individual decisiveness remains unnamed. Your case occupies the blind spot between them, where the unit of agency is plural but the unit of choice is indivisible. Consequently, you are describing a phenomenon that existing taxonomy recognizes only in fragments, requiring a new designation to capture the specific pathology of joint sovereignty over indivisible states. No standard term covers this ground.

  *If there is no name*

  Let us coin "The Paradox of Fused Sovereignty." Define it as a decision structure where individual veto rights are applied to indivisible joint states, causing Pareto-inferior lock-in. It requires that the agents prefer a change but cannot enact it. This excludes standard Liberal Paradox cases where options are separable by person. It differs from the Anti-Commons by focusing on aesthetic or identity-based stakes rather than economic extraction. Boundary Case One: Your co-authorship, where neither can alter the text without the other's consent, yet both wish to alter it. This falls under the definition because the object is joint and the rights are individual. Boundary Case Two: A standard contract negotiation where parties trade distinct concessions. Here, sovereignty is over separate assets, allowing exchange rather than lock-in, so it falls outside. This term isolates the specific friction of holding individual power over a collective body. It names the cost of pretending a joint thing can be owned separately. It captures the pain of the shared pen.
