answer: |-
  Notes for Thomson's Lamp interview – keep it loose, don't let her waffle on the intro stuff. Need to press the split between temporal/spatial and the "global constraint" bit.

  1.  **Q:** You say the paradox only arises because we smuggle in a global consistency condition. But isn't assuming continuity just standard maths? Why is that 'smuggled' rather than built-in?
      *   **FU:** She'll likely say the constraint is illegitimate. If so: **Press on what logic replaces it.** If we can't assume consistency at the limit, are we doing physics or just linguistics?

  2.  **Q:** Why doesn't the local switch-rule (on becomes off, off becomes on) already dissolve the problem? If every step before $t=2$ is definite, why does the limit care?
      *   **FU:** If she says limits aren't steps: **Ask if that implies time is discontinuous.** Can we have a physics where limits don't inherit properties from the sequence?

  3.  **Q:** Be honest—are you just repackaging the standard 'no-fact-of-the-matter' answer with extra jargon?
      *   **FU:** If she denies: **Ask for the substantive difference.** If the outcome is the same (indeterminate), why does the 'category mistake' label matter?

  4.  **Q:** Does this view make the lamp's behaviour at the limit empirically empty? If we can't assign a state, is there anything left to observe?
      *   **FU:** If she says yes: **Ask why we should care about the metaphysics then.** Is it purely conceptual hygiene?

  5.  **Q:** You distinguish temporal supertasks (conceptually puzzling) from spatial ones like Benardete's books (physically impossible). Why the split?
      *   **FU:** If she cites physical density constraints: **Bring up point particles.** Standard models allow zero volume; how does that fit your density argument?

  6.  **Q:** Doesn't quantum discreteness (Planck length) undercut your argument that spatial ones are physically blocked? Space might not be infinitely divisible.
      *   **FU:** She'll probably say physics doesn't reach the limit. **If so: Ask why temporal supertasks get a pass.** If physics breaks down at limits generally, why treat time differently?

  7.  **Q:** Is calling it a 'category mistake' just a way to avoid committing to finitism? You seem to want infinity without the boundary conditions.
      *   **FU:** If she says no: **Ask where the boundary is.** When does a sequence become a 'completed totality' if not at the limit?

  8.  **Q:** What's the broader implication for supertasks generally? Does this save most of them or kill them off?
      *   **FU:** If she says most are coherent: **Ask about agency.** Can a mortal agent perform one, or only something like Zeus? (Watch for tehm dodging this).

  *Remember to keep it conversational. If she gets too technical on the global constraint, pull her back to the physical intuition. Also check teh audio levels on the mic before we start.*
