prompt: |-
  I work in the methods unit of a national infrastructure authority, and I have been asked to write a short internal note on what our appraisal manual actually assumes about human welfare. I would like the philosophical version of that note, because the manual makes claims none of us can cash.

  The practice, briefly. We rank projects by monetised net benefit, and benefits must be measured from observed behaviour rather than from what people say. A minute of travel time is priced by the fare premium people actually pay for the faster service. Risk of death is priced by the extra wages that riskier jobs command. Cleaner air is priced by what it adds to local house prices. Stated-preference surveys are inadmissible: the manual rejects them on the ground that someone filling in a questionnaire is not choosing, and so reveals nothing. Where no market exists, we transfer a value from a broadly similar market somewhere else, scaled by income. Losses are priced the same way. A household that will lose its home to a new line is credited with the market value of the house and a fixed statutory disturbance payment, not with what it says it would take to make it willing to move. Benefits and costs are then added across everyone affected at one unit of currency per unit, with no weighting by who ends up with them, and we do not require that anyone actually be paid. A short list of impacts — landscape, quiet, one particular wetland — is recorded in a separate table and never enters the arithmetic.

  Two things sit badly with me.

  First, the same authority runs a behavioural-insights team whose job is to change defaults so that people end up choosing differently — auto-enrolling commuters in the off-peak ticket, or in the cycle-to-work scheme — on the explicit ground that what those people would otherwise have chosen is not good for them. When that team's interventions are appraised, the resulting changes in behaviour are counted as benefits and priced with the very same revealed-preference numbers. So in one part of the building we treat choice as the only admissible evidence of value, and in the next we treat it as evidence we are entitled to override.

  Second, we insist that only real choices count and then price most things using choices nobody made: the value transferred from another city, the house price paid by a buyer who never once considered air quality, the imputed willingness to pay of a child or of people not yet born.

  What I want is the implicit theory. What view of utility, or of welfare, or of what a choice shows, does this package of rules only make sense under? Which parts of the package does that view strictly require, and which are merely habits that fit it comfortably? Is the combination coherent, or does the nudge work quietly presuppose something the valuation rules deny? My suspicion is that the word value is doing three different jobs in our arithmetic and we are adding the results as though it were one, but I cannot say what the jobs are or which one carries the weight.

  And if we took seriously the austere version of revealed preference — the one on which choice data pins down nothing more than, for each person separately, an ordering of the options with no meaningful distances in it and no way of setting one person's ordering against another's — which of our rules would have to go, and what would replace the benefit-cost test as a way of choosing between projects?
reasoning: |-
  Here's a thinking process that leads to the suggested internal note:

  1.  **Analyze the Request:**
      *   **Context:** The user works in the methods unit of a national infrastructure authority.
      *   **Task:** Write a short *internal note* on the philosophical assumptions underlying their appraisal manual.
      *   **Tone:** Philosophical, analytical, critical but professional (internal note style).
      *   **Core Problem:** The manual claims to rely on "revealed preference" (RP) and monetized net benefit, but there are inconsistencies (nudges override choice, imputed values aren't real choices, distributional weights are ignored, some impacts are excluded).
      *   **Specific Questions to Answer:**
          *   What is the implicit theory of utility/welfare/choice?
          *   Which rules are required by this theory vs. habits?
          *   Is the combination coherent? (Specifically regarding the nudge team).
          *   Is "value" doing three different jobs?
          *   What if we took *austere* revealed preference seriously? What rules would go? What replaces benefit-cost analysis (BCA)?

  2.  **Deconstruct the Current Practice (The "Manual"):**
      *   *Metric:* Monetized Net Benefit (Kaldor-Hicks efficiency).
      *   *Valuation Method:* Revealed Preference (RP) only. No Stated Preference (SP).
      *   *Valuation Sources:* Fare premiums (time), wage differentials (risk), hedonic pricing (air/housing).
      *   *Transfers:* Benefit transfer (scaling by income) when markets are missing.
      *   *Compensation:* Market value + statutory payment (not WTA - Willingness to Accept).
      *   *Aggregation:* Summation across individuals ($1 = $1), no distributional weights. No requirement for actual compensation (Potential Pareto).
      *   *Exclusions:* Some impacts (landscape, wetlands) are qualitative only.
      *   *Conflict 1 (Nudge):* Behavioral Insights Team (BIT) changes defaults to override "irrational" choices, yet these changes are valued using the RP derived from the original choices.
      *   *Conflict 2 (Fake Choices):* Using transferred values, hedonic prices (unconscious choices), and proxies for non-choosers (children, future generations).

  3.  **Identify the Implicit Theory:**
      *   *Surface Theory:* Welfare Economics based on Consumer Sovereignty + Revealed Preference.
      *   *Actual Theory:* **Pragmatic Utilitarianism with a Veneer of Libertarian Paternalism.**
      *   *The "Value" Jobs:*
          1.  *Metric of Efficiency:* Money as a common denominator for resource allocation.
          2.  *Proxy for Welfare:* Assuming money spent = utility gained.
          3.  *Political Legitimacy:* "We aren't deciding what's good, the market is."
      *   *Coherence Check:* The Nudge team undermines Consumer Sovereignty. If choices are biased (requiring nudges), RP valuations are contaminated. If choices are sovereign (for RP), nudges are paternalistic overreach. They cannot both be true simultaneously without a deeper theory of "True Preference" vs. "Observed Choice."

  4.  **Analyze the "Austere Revealed Preference" Scenario:**
      *   *Definition:* Ordinal utility only. No interpersonal comparisons. No cardinal measurement.
      *   *Consequences for the Manual:*
          *   Monetization must go (cannot sum utils).
          *   Benefit Transfer must go (cannot compare Person A to Person B).
          *   Kaldor-Hicks (Potential Pareto) must go (requires interpersonal comparison of gain vs. loss).
          *   Aggregation must go.
      *   *Replacement:* Pareto Efficiency (hard to achieve) or Political/Deliberative Decision Making (voting, representation).

  5.  **Drafting the Note - Structure:**
      *   **Header:** Standard Internal Note format (To, From, Subject, Date).
      *   **Executive Summary:** The core tension (Coherence vs. Convenience).
      *   **Section 1: The Implicit Theory (The "Money-Metric Utility" Fiction).** Explain that the manual assumes money is a stable proxy for welfare, ignoring the ordinal nature of utility.
      *   **Section 2: The Three Jobs of "Value".** Address the user's suspicion. (1. Efficiency signal, 2. Welfare proxy, 3. Political shield).
      *   **Section 3: The Nudge Contradiction.** Analyze the BIT conflict. (Sovereign vs. Flawed Chooser).
      *   **Section 4: The "Fake Choice" Problem.** Benefit transfer and hedonic pricing.
      *   **Section 5: The Austere Counterfactual.** What happens if we stick to strict RP theory? (BCA collapses).
      *   **Conclusion:** Recommendation for intellectual honesty.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Tone Check:* Needs to be respectful but piercing. Not an attack, but a "clarification of foundations."
      *   *Philosophical Precision:* Ensure terms like *ordinal vs. cardinal utility*, *Kaldor-Hicks*, *Consumer Sovereignty*, and *Paternalism* are used correctly.
      *   *Addressing the User's Specific Points:* Make sure to explicitly mention the "three jobs" of value and the "austere version" question.
      *   *The "Three Jobs":*
          1.  *Accounting Unit:* Making unlike things comparable.
          2.  *Welfare Proxy:* Assuming WTP = Well-being.
          3.  *Depoliticization:* Hiding normative judgments behind "market data."
      *   *The Nudge Paradox:* This is the strongest point. If BIT is right (choices are flawed), RP is wrong. If RP is right (choices reveal value), BIT is meddling. The manual assumes "Latent Rationality" – that nudges help people do what they *would* have chosen if rational. This saves coherence but requires a strong assumption.
      *   *Austere RP:* If we strictly follow Samuelson's RP, we can't sum across people. So BCA is impossible. We'd need a Pareto criterion (nobody loses) or a political vote.

  7.  **Final Polish:** Check against the prompt's constraints. "Short internal note." "Philosophical version." "What view of utility?" "Which parts required?" "Is it coherent?" "What replaces BCA?"

      *(Self-Correction on Length)*: Keep it tight. Use headings. Avoid excessive jargon where plain English works, but keep the philosophical rigor.

      *(Refining the "Three Jobs")*:
      1.  *Commensurability:* Making time, risk, and landscape comparable.
      2.  *Authority:* Deriving legitimacy from "the market" rather than the appraiser.
      3.  *Aggregation:* Allowing summation across persons (which strict RP forbids).

      *(Refining the Nudge section)*: The manual assumes *Instrumental Rationality*. BIT assumes *Bounded Rationality*. The manual treats observed choice as *Normative*. BIT treats it as *Descriptive*. This is the crack in the foundation.

      *(Refining the Austere Conclusion)*: If we go austere, we can't do BCA. We move to *Pareto* (status quo bias) or *Deliberative Democracy*.

  8.  **Final Review against User Prompt:**
      *   *Implicit theory?* Yes (Money-metric utilitarianism).
      *   *Required vs. Habits?* Yes (Aggregation is habit/theory mix; RP exclusivity is theory).
      *   *Coherent?* No (Nudge vs. RP).
      *   *Three jobs?* Yes.
      *   *Austere RP consequences?* Yes (BCA dies).

      *Let's write it.*
answer: |-
  **INTERNAL NOTE**

  **TO:** Director of Strategy / Head of Methods Unit
  **FROM:** [Your Name], Methods Unit
  **DATE:** 24 May 2024
  **SUBJECT:** Philosophical Foundations of the Appraisal Manual: Coherence and Assumptions

  **1. Purpose**
  This note outlines the implicit philosophical commitments underpinning our current appraisal manual. It addresses inconsistencies between our valuation rules and the behavioural interventions undertaken elsewhere in the Authority. It asks what theory of welfare makes our arithmetic possible, and what remains if we strip that theory to its logical core.

  **2. The Implicit Theory: Money-Metric Utilitarianism**
  Our manual operates on a hybrid theory that is not strictly neoclassical, nor strictly utilitarian, but a pragmatic fusion: **Money-Metric Utilitarianism.**

  *   **The View of Utility:** We treat utility as *cardinal* (measurable in degrees) and *interpersonally comparable* via money. Strict revealed preference theory (RPT) holds that choice only reveals an *ordinal* ranking (A is preferred to B) for a specific individual. It forbids measuring the *intensity* of that preference, and it strictly forbids comparing Person A's preference intensity to Person B's.
  *   **The Violation:** By summing net benefits across individuals ($1 to a commuter = $1 to a landowner), we assume the marginal utility of income is constant across the population. This is a utilitarian assumption, not an RPT assumption.
  *   **The View of Choice:** We treat observed choice as **normatively sovereign**. We assume that what a person chooses is what is good for them. This is the "Consumer Sovereignty" axiom.

  **3. The Three Jobs of "Value"**
  Your suspicion is correct. In our arithmetic, the word "value" performs three distinct functions, which we conflate to make the sum work:

  1.  **Commensurability:** Value acts as a common denominator to make unlike goods (time, risk, landscape) comparable. *Required for calculation.*
  2.  **Welfare Proxy:** Value acts as a proxy for well-being. We assume a higher willingness-to-pay (WTP) equates to higher welfare. *Required for the claim that we are improving social welfare.*
  3.  **Political Shield:** Value acts as a depoliticizing device. By claiming values are "revealed" by the market rather than "assigned" by the Authority, we shield ourselves from accusations of paternalism. *Required for legitimacy, but factually fragile.*

  **4. The Coherence Problem: Nudges vs. Revealed Preference**
  The coexistence of the Appraisal Manual and the Behavioural Insights Team (BIT) creates a logical contradiction regarding the status of choice.

  *   **The Manual's Axiom:** Observed choice is the only admissible evidence of value. Therefore, the choice is rational and welfare-enhancing.
  *   **The BIT's Axiom:** Observed choice is often biased (inertia, framing effects). Therefore, the choice may be welfare-reducing and should be overridden by a "better" default.

  **The Contradiction:** When BIT successfully nudges a commuter to an off-peak ticket, we appraise the benefit using the fare premium the commuter *originally refused to pay*.
  *   If the Manual is right (the original choice revealed the true value), the nudge reduced welfare (they paid for something they valued less than the cost).
  *   If BIT is right (the original choice was flawed), the Manual's valuation base is contaminated. We are pricing "errors" as "preferences."

  **Resolution:** The only way to save coherence is to assume **Latent Rationality**. We must claim that BIT does not override preferences, but merely removes friction so *true* preferences are revealed. However, our manual explicitly rejects stated preferences on the grounds that people cannot articulate true value. It is inconsistent to claim people cannot answer a survey but can be guided to a "truer" choice by a default setting.

  **5. Required Rules vs. Habits**
  *   **Strictly Required by Money-Metric Utilitarianism:** Aggregation of costs and benefits; monetization of all impacts; ignoring distribution (unless weighted).
  *   **Habits/Inconsistencies:**
      *   *Excluding Stated Preference:* This is a methodological habit, not a theoretical requirement. If we accept BIT's premise (that choices can be biased), stated preference methods (corrected for bias) are theoretically more defensible than revealed preference in non-market contexts.
      *   *Benefit Transfer:* This violates the RPT axiom that value is specific to the chooser and the context. It is a pragmatic shortcut that breaks the philosophical model.
      *   *Qualitative Exclusions:* The separate table for landscape/wetlands admits that money-metric utility is incomplete. This is a tacit admission that the theory fails to capture all welfare.

  **6. The Austere Counterfactual: Strict Revealed Preference**
  If we adhered strictly to the austere version of revealed preference (Samuelson's formulation), the following would occur:

  *   **No Interpersonal Comparison:** We could not sum benefits across people. We could not say a gain to Commuter A offsets a loss to Resident B.
  *   **No Monetization of Non-Market Goods:** Without a direct market choice involving the specific good (e.g., risk of death), we could not impute a price. Wage differentials are choices about jobs, not direct choices about mortality risk.
  *   **The End of Benefit-Cost Analysis (BCA):** BCA relies on Kaldor-Hicks efficiency (potential Pareto improvement). Austere RPT only validates **Pareto Efficiency** (someone gains, no one loses).

  **Replacement Mechanism:**
  Without BCA, project selection would revert to:
  1.  **Pareto Criterion:** Only projects where every affected party consents (veto rights). This would halt almost all infrastructure.
  2.  **Political/Deliberative Decision:** Acknowledging that trade-offs between persons are ethical/political judgments, not technical calculations. Decisions would be made by elected representatives based on qualitative arguments, not by appraisers summing monetary units.

  **7. Conclusion**
  Our manual is not a rigorous application of welfare economics. It is a **technocratic fiction** designed to convert political trade-offs into administrative calculations. It assumes choice is sovereign unless it is inconvenient (BIT), assumes money measures welfare unless it involves a wetland, and assumes values are local unless we need to borrow them from another city.

  To proceed with intellectual honesty, we must either:
  1.  Admit the utilitarian nature of the framework and accept distributional weighting (acknowledging $1 ≠ $1 for all); or
  2.  Acknowledge the limits of RPT and integrate stated preference/deliberative values for non-market goods; or
  3.  Accept that the "Nudge" work invalidates the "Revealed Preference" valuation for those specific behaviours.

  Currently, we are adding three different concepts of value as if they were one. The arithmetic holds, but the philosophy does not.

  **Recommendation:** Initiate a review of the "Treatment of Behavioural Interventions in Appraisal" to resolve the BIT/Manual contradiction before the next fiscal cycle.
