prompt: |-
  Right, quick one. I've got a fifty-minute slot next week with about twenty first-years — mostly CS, a few psychology — and I want to spend it making them *feel* what it means to induce a concept from a handful of examples. Bongard problems are the vehicle: six figures on the left, six on the right, some rule separates them.

  Don't solve any for me and don't write the explanation I should give. Give me the plan for the explanation.

  Some vocabulary first so we're not talking past each other — these are my words, rename them if mine are bad. A rule *fits* a problem if it's true of everything in the left panel and false of everything in the right. The *intended* rule is the one the setter had in mind, which needn't be the only one that fits. A *list rule* fits by just naming the left-hand figures ("it's one of these six") — it works by construction and generalises to nothing. And call a problem *brittle* if deleting any single figure from either panel lets a rule strictly simpler than the intended one fit.

  What I want back:

  1. The order the pieces have to go in, and what depends on what. My hunch is that "there's no unique answer" lands completely differently depending on whether they've already tried and failed to find one, but tell me if I've got that backwards.
  2. The one problem to build the whole session around, and what it has to have and not have. I'm thinking something geometric where the intended rule is about how the shapes relate to *each other* rather than a property each shape has on its own, and where a list rule is obviously on offer — but say if that's one example doing too much work.
  3. The misconceptions, in the order they'll actually turn up, and exactly where in the sequence to head each off. Ones I'm expecting: that the task is to find the rule; that "simplest rule wins" is obvious rather than a choice of description language; that more examples would sort it out; that fitting and generalising are the same thing. Add the ones I've missed, and definately tell me if one of mine isn't worth the time.
  4. One thing I should flatly refuse to go into at this level, and say out loud that I'm refusing it. My instinct is to dodge formal learning theory entirely — VC dimension and that sort of thing — but maybe the honest move is one sentence of hand-waving instead of silence.
  5. The question I ask in the last five minutes that tells me whether the idea landed rather than whether they enjoyed themselves.

  And last: flag the bit of the plan you're least confident about, and say what would change your mind — what argument, or what actually happening in the room, would make you reorder it or swap the example out.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the Request:**
      *   **Audience:** 20 first-year students (mostly CS, some Psych).
      *   **Time:** 50 minutes.
      *   **Topic:** Induction from examples using Bongard Problems.
      *   **Constraints:** Do *not* solve problems. Do *not* write the explanation script. Give the *plan* for the explanation.
      *   **Vocabulary:** *Fits*, *Intended Rule*, *List Rule*, *Brittle*. (Use these or critique them).
      *   **Deliverables:**
          1.  Order of pieces/dependencies (specifically regarding "no unique answer").
          2.  The one anchor problem (criteria).
          3.  Misconceptions (order of appearance + intervention points).
          4.  One thing to explicitly refuse (e.g., formal learning theory).
          5.  The final assessment question.
          6.  Self-critique: Least confident part + what would change my mind.

  2.  **Deconstruct the Goal:**
      *   The goal isn't to teach them how to solve Bongard problems. It's to use Bongard problems to teach them about *induction*, *generalization*, *overfitting* (list rules), and *bias* (simplicity/intended rule).
      *   CS students care about algorithms/generalization. Psych students care about cognition/perception. The plan needs to bridge these.

  3.  **Drafting Section 1: Order of Pieces:**
      *   *User's Hunch:* "There's no unique answer" lands differently after failure vs. before.
      *   *My Analysis:* The user is right. If you tell them "there's no right answer" upfront, they disengage or get cynical ("why are we doing this?"). If they struggle first, the revelation explains their struggle.
      *   *Sequence:*
          1.  Do the task (struggle).
          2.  Reveal the ambiguity (the "aha" of failure).
          3.  Introduce vocabulary (Fit vs. Intended vs. List).
          4.  Discuss the cost of ambiguity (Brittleness/Generalization).
      *   *Dependency:* You can't explain *why* we need a bias (simplicity) until they feel the pain of under-constrained data.

  4.  **Drafting Section 2: The Anchor Problem:**
      *   *Criteria:* Geometric, relational (not just property), list rule obvious.
      *   *Idea:* Classic Bongard #49 (circles vs. triangles) is too easy (property). We need relational.
      *   *Idea:* Inside/Outside? (e.g., Left: shape inside shape, Right: shape next to shape).
      *   *Refinement:* To make the "List Rule" tempting, the specific shapes should look distinct enough that naming them feels valid. To make the "Intended Rule" relational, it needs to be about spatial configuration.
      *   *Selection:* A problem where Left = "One shape inside another" and Right = "Two shapes separate."
      *   *Why:* It allows a property rule (Left has nesting, Right doesn't) but also invites a List Rule ("Left are the nested ones"). Wait, the prompt asks for a problem where the intended rule is *relational* rather than a property *each shape has on its own*.
      *   *Better Selection:* Left: Shapes pointing towards each other. Right: Shapes pointing away. Or Left: Closed loops, Right: Open lines.
      *   *Best Selection for CS/Psych mix:* **Bongard Problem #12** (or similar variant). Left: Triangles. Right: Quadrilaterals. (Too simple).
      *   *Let's build a custom one mentally:*
          *   Left: 6 figures where a small dot is *inside* a closed curve.
          *   Right: 6 figures where a small dot is *outside* a closed curve.
          *   *List Rule:* "Left side has the dot inside." (Fits).
          *   *Intended Rule:* "Containment."
          *   *Wait, the prompt wants:* "Intended rule is about how shapes relate to *each other*."
          *   *Revised:* Left: Two shapes touching. Right: Two shapes separated.
          *   *Why:* It forces looking at the pair, not the individual.
          *   *Constraint Check:* Needs to allow a List Rule to be obvious. If the shapes are all different (circle+square, triangle+circle, etc.), the List Rule ("It's these specific pairs") is tempting.
          *   *Decision:* Use a problem where the *objects* vary wildly but the *relation* is constant.
          *   *Specific Recommendation:* **Bongard Problem #21** (Left: Concave, Right: Convex) is property-based. **Bongard Problem #4** (Left: One object, Right: Two objects) is counting.
          *   *Let's go with BP #51:* Left: Triangles pointing up. Right: Triangles pointing down. (Too simple).
          *   *Let's go with BP #16:* Left: Shapes with straight lines. Right: Shapes with curved lines.
          *   *Okay, I need to recommend a *type* rather than a specific number, or a specific number that fits.*
          *   *Actually, the prompt asks for "The one problem... and what it has to have and not have."*
          *   *Recommendation:* **Bongard Problem #39** (Left: X's, Right: O's - too simple).
          *   *Let's suggest **Bongard Problem #11**.* Left: Large shape, small shape. Right: Medium shapes. (Size relation).
          *   *Actually, the best fit for "Relational" + "List Rule Temptation":* **Bongard Problem #22**. Left: Shapes pointing inward/center. Right: Shapes pointing outward.
          *   *Wait, I shouldn't solve it.* I need to describe the *characteristics*.
          *   *Characteristics:* High visual variance within panels (kills simple property rules like "all triangles"). Clear relational invariant (e.g., containment, alignment). Distinct enough figures that memorizing them feels plausible (List Rule).
          *   *Verdict:* I will describe the *structure* of the ideal problem rather than risking a specific number that might be obscure or misremembered. I'll describe a "Containment" problem. Left: Dot inside shape. Right: Dot outside shape. But wait, that's property of the *pair*.
          *   *Let's stick to the prompt's requirement:* "Intended rule is about how the shapes relate to *each other*."
          *   *Plan:* Left: Two shapes touching. Right: Two shapes not touching.
          *   *Why:* It's binary. It's relational. The specific shapes can vary (Circle/Square, Triangle/Triangle), making the List Rule ("It's the circle-square ones") tempting but weak.

  5.  **Drafting Section 3: Misconceptions:**
      *   *User's List:*
          1.  Task is to find *the* rule (vs *a* rule).
          2.  Simplest rule is obvious (vs choice of language).
          3.  More examples sort it out.
          4.  Fitting = Generalising.
      *   *My Additions:*
          5.  "The computer sees what I see" (Perception vs. Data).
          6.  "The List Rule is cheating" (It's valid induction, just bad generalization).
      *   *Order:*
          1.  "Find the rule" (Immediate, during attempt).
          2.  "Fitting = Generalising" (When discussing List Rules).
          3.  "More examples sort it out" (When discussing Brittleness).
          4.  "Simplest is obvious" (When defining bias).
      *   *Intervention:* Head off "Find the rule" *after* the struggle, not before. Head off "More examples" by showing a brittle problem where more examples of the *same type* don't help without changing the *variety*.

  6.  **Drafting Section 4: The Refusal:**
      *   *User's Instinct:* Dodge formal learning theory (VC dimension).
      *   *My Take:* Agree. It's a 50-min intro. VC dimension requires probability theory they might not have.
      *   *The Refusal:* "We are not defining 'simplicity' mathematically today."
      *   *Why:* Simplicity is subjective (Kolmogorov complexity is uncomputable). Acknowledging this prevents them from thinking there's a magic formula they just haven't learned yet.

  7.  **Drafting Section 5: The Final Question:**
      *   *Goal:* Test understanding, not enjoyment.
      *   *Bad:* "Did you like this?"
      *   *Bad:* "What is the rule?" (They might just guess).
      *   *Good:* Something that forces them to apply the vocabulary.
      *   *Idea:* "If I add a seventh figure to the Left that breaks the rule but looks similar, which breaks: the Fit or the Generalization?"
      *   *Better:* "Why is the List Rule a bad model for a CS student building a classifier?"
      *   *Best:* "I give you a new figure. Under what condition is the 'List Rule' safer than the 'Intended Rule'?" (Tests understanding of overfitting vs. robustness).
      *   *Refinement:* Keep it punchy. "If the next example violates the intended rule but fits the list rule, which rule failed?" (Answer: Neither, the data changed. But wait.)
      *   *Let's try:* "I show you a 7th Left image. It fits the List Rule but violates the Intended Rule. Do we update the rule or reject the image? Why?" (Tests the concept of Ground Truth vs. Inductive Bias).

  8.  **Drafting Section 6: Self-Critique:**
      *   *Least Confident:* The "One Problem" strategy. 50 minutes is tight. If they get stuck too hard, you lose 20 mins. If they solve it too fast, you lose the struggle.
      *   *What changes my mind:* If the room goes silent for >5 minutes. Then I need a hint or a second easier problem.
      *   *Vocabulary Check:* "Brittle" is good. "List Rule" is good. "Fits" is good. "Intended" is good. I'll keep them.

  9.  **Review against Constraints:**
      *   No solving? Check.
      *   No script? Check.
      *   Plan structure? Check.
      *   Vocabulary usage? Check.
      *   Self-critique included? Check.

  10. **Final Polish:** Ensure tone is professional, direct, and respects the user's expertise (they know their stuff, they want a sanity check and structure).

  *(Self-Correction during drafting Section 2)*: I need to be careful not to describe a specific Bongard Problem number too rigidly, as access varies. I should describe the *features* of the problem. The prompt asks for "The one problem... and what it has to have and not have." I will describe the *specification* of the problem.

  *(Self-Correction during drafting Section 5)*: The question needs to distinguish "idea landed" from "enjoyed." A question about *trade-offs* is best. "When would you *want* the List Rule?"

  *(Refining Section 1)*: The user's hunch about "no unique answer" is crucial. I need to validate that strongly.

  *(Refining Section 4)*: The refusal should be about *defining* simplicity, not learning theory broadly.

  Let's assemble.
answer: |-
  Here is the plan. I have kept your vocabulary; it is precise enough for this context and avoids the baggage of standard ML terminology (like "overfitting") which might trigger premature associations.

  ### 1. Order of Pieces and Dependencies

  Your hunch is correct. Do **not** lead with "there is no unique answer." If you lead with ambiguity, you kill the incentive to search. The dependency chain must be:

  1.  **The Struggle (15 mins):** Present the problem. Ask for the rule. Let them propose rules. Write them on the board.
  2.  **The Revelation (5 mins):** Reveal that multiple contradictory rules *fit* the data. This is where "there's no unique answer" lands. It explains the friction they just felt.
  3.  **The Vocabulary (10 mins):** Now introduce *Fits*, *Intended*, and *List Rule*. You need the struggle to make the distinction between *Fits* and *Intended* matter.
  4.  **The Consequence (15 mins):** Introduce *Brittleness*. Show why *Fits* is insufficient for CS (generalization) and why *Intended* is insufficient for Psych (subjectivity).
  5.  **The Assessment (5 mins):** The closing question.

  **Dependency:** You cannot explain why we prefer the *Intended Rule* over the *List Rule* until they have experienced the failure of finding a unique *Fit*. You cannot explain *Brittleness* until they accept that multiple rules can *Fit*.

  ### 2. The Anchor Problem

  Do not use a standard number from Bongard's book without checking it first; many are dated or rely on cultural knowledge. Instead, construct or select a problem with this specific topology:

  *   **What it must have:** High visual variance within each panel.
      *   *Left Panel:* 6 figures that look visually distinct from one another (e.g., different shapes, sizes, orientations) but share **one** invariant spatial relation (e.g., "Shape A is strictly inside Shape B").
      *   *Right Panel:* 6 figures that look visually distinct but share the negation of that relation (e.g., "Shape A is strictly outside Shape B").
  *   **What it must not have:** A simple unary property (e.g., "Left are all triangles," "Right are all circles"). This prevents a quick win that bypasses the induction lesson.
  *   **Why this specific setup:**
      *   The visual variance makes the *List Rule* tempting ("It's the ones with the circle and the square") because memorizing six distinct items feels cognitively cheaper than abstracting the relation.
      *   The relational invariant ensures the *Intended Rule* is robust (it generalizes to new shapes), contrasting sharply with the *List Rule*.

  ### 3. Misconceptions and Interventions

  Here is the order they will arise, and where to cut them off:

  1.  **"There is one right answer."** (Arises: Minute 5)
      *   *Intervention:* Do not correct this yet. Let it drive the search. Correct it only after they have proposed two valid but different rules.
  2.  **"Fitting is the same as Generalising."** (Arises: Minute 20, when discussing the List Rule)
      *   *Intervention:* Explicitly decouple them. "The List Rule *fits* perfectly. It *generalises* poorly." Use the CS students here: ask what happens on the 7th example.
  3.  **"More examples would sort it out."** (Arises: Minute 30, when discussing ambiguity)
      *   *Intervention:* This is the critical one. Show that adding more examples of the *same* variance doesn't help if the *List Rule* is still simpler than the *Intended Rule* in their current description language. You need *different* examples, not *more*.
  4.  **"Simplicity is objective."** (Arises: Minute 35)
      *   *Intervention:* Point out that "List Rule" is simple in one language (lookup table) and complex in another (logic). Simplicity is a choice of bias, not a property of the rule.
  5.  **"The List Rule is cheating."** (Arises: Throughout)
      *   *Intervention:* Validate it. It is a valid hypothesis. It is just a bad *bet* for the future.

  **Misconception you missed:** **"Perception is Data."** Students assume the figures are presented as raw pixels or vectors. They forget that *seeing* the shapes is already a pre-processed induction step.
  *   *Intervention:* When defining the rule, ask: "Did you see lines, or did you see shapes?" If they say shapes, point out that the computer sees lines; "Shape" is already an induced concept.

  ### 4. The Refusal

  **Refuse to define "Simplicity."**

  Say this: *"I am not going to tell you how to measure simplicity mathematically today. There is no universal metric. Kolmogorov complexity is uncomputable; VC dimension is too abstract for this hour."*

  **Why:** If you wave your hands at VC dimension, CS students will think there is a formula they should know, and Psych students will tune out. By refusing to define it, you force them to accept that **Inductive Bias is a design choice**, not a discovery. This is the core lesson for both disciplines.

  ### 5. The Final Question

  Do not ask "What did we learn?" Do not ask "What is the rule?"

  **Ask this:**
  *"I give you a 7th figure for the Left panel. It fits the List Rule, but violates the Intended Rule. Do we discard the figure as noise, or discard the Intended Rule as wrong? What determines your choice?"*

  **Why this works:**
  *   If they say "Discard the figure," they understand *Intended Rule* as a prior belief (Psych/CS bias).
  *   If they say "Discard the rule," they understand *Fits* as a hard constraint (Logic).
  *   If they say "It depends on the cost of error," they understand the *trade-off* (ML/Decision Theory).
  *   It tests whether they grasp that the "Intended Rule" is not truth, but a wager.

  ### 6. Self-Critique: The Weak Point

  **Least Confident:** The **Anchor Problem** selection.

  **Why:** If the relational invariant is too subtle, the 20 students will spend 30 minutes in silence staring at the screen. If it's too obvious, they solve it in 2 minutes and you lose the "Struggle" phase.

  **What would change my mind:**
  *   **In the room:** If after 5 minutes, no one has proposed a rule.
  *   **The Pivot:** I would immediately switch from "Find the rule" to "Propose two different rules that fit." This shifts the goal from *solution* to *generation*, which saves the session if the problem is too hard, and still teaches the ambiguity lesson if the problem was too easy.
  *   **Argument:** If you find yourself explaining the solution rather than facilitating their proposals, the problem was wrong. The specific geometry matters less than the *social dynamic* of the guesswork. Be prepared to abandon the specific problem if the room energy stalls, but keep the *structure* (variance within panels).
