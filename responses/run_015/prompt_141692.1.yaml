answer: |-
  **CONFIDENTIAL PREAMBLE: ON EQUIVOCATION**

  You asked for honesty before you step into the room. Is your pluralism just equivocation with a nicer name?

  My verdict: No, provided you hold the line on the *empirical* consequences of the lag. Merely saying "it depends on the question" is verbal window-dressing. However, if you can demonstrate that in lagged niche construction, attributing adaptation to the current gene frequency leads to a *false prediction* about future trait stability, then you are doing ontology, not semantics. The risk is that your 'design' question smuggles in teleology where there is none. If you treat 'beneficiary' as a metaphor, you are safe. If you treat it as a causal force, you will be eaten alive.

  **THE ONE QUESTION YOU HOPE NOBODY ASKS**

  *"If the terrace is part of the environment, like the climate, why does it matter who built it? Does the wind care if it was shaped by genes? If not, doesn't your 'lagged' category collapse back into 'standard environmental selection', rendering your tripartition unnecessary?"*

  (Reply if forced: The wind doesn't change frequency based on bird survival; the terrace does, eventually. It is a replicator with a slow generation time. That creates a feedback loop standard environmental models miss.)

  ***

  ### Q&A PREPARATION SHEET

  **Objection 1: The Gene's-Eye Partisan**
  *"You say the terrace selects. I say the terrace is merely the extended phenotype of the ancestors. The genes that built the terrace are still the unit of selection; they are just expressing themselves over a longer timescale. You haven't found a new problem; you've just found a long-lived tool."*

  **Your Reply:**
  A tool implies a user. In my system, the birds currently living on the terrace did not build it, and their genes may differ from the builders. If the terrace favours 'Terrace-Adapted' alleles, but those alleles were rare in the *builders*, then the current selection is not tracking the builder's genes. The 'tool' is now selecting *against* the current users' genotypes. The extended phenotype account works when the builder and the beneficiary are the same lineage. In lagged construction, the environment has become autonomous. We are not measuring the reach of the gene; we are measuring the reach of the dead.

  **Soft Spot:**
  You must prove the allele frequencies actually shifted between builders and current residents. If they are stable, the gene's-eye view wins by default.

  **Confidence in Prediction:** High. This is the standard rebuttal to niche construction theory from the Dawkins camp.

  **Objection 2: The Philosopher of Science**
  *"You say 'the terrace did the selecting'. In causal modelling, that is a category error. A terrace is a static structure. Selection is a statistical relationship between trait and fitness. Are you claiming the terrace is a causal agent, or just that you've found a confounding variable in your variance decomposition?"*

  **Your Reply:**
  I am claiming it is a physical constraint that alters the probability of survival, independent of the current organism's traits. It is not merely a confounder; it is a legacy mechanism. If I treat it only as variance, I miss the feedback loop. The terrace degrades or builds up based on past occupancy. It has a 'state' that persists. Ignoring that state treats the environment as a background constant when it is actually a historical variable. I am asking for a causal model that includes time-delayed environmental feedback, not just a snapshot of covariance.

  **Soft Spot:**
  Philosophers of science will demand a formal causal graph. If you cannot sketch how 'Past Bird' causes 'Terrace' causes 'Current Fitness' without circularity, they will dismiss this as hand-waving.

  **Confidence in Prediction:** Very High. This is their specific domain of expertise.

  **Objection 3: The Multi-Level Selectionist**
  *"You are separating the group from the individual unnecessarily. The terrace is a group-level trait. The Price equation handles this with the covariance term. The 'unit' is the colony, because the terrace belongs to the colony, not the bird. Why do we need three questions when the math gives us one answer?"*

  **Your Reply:**
  Because the colony changes composition faster than the terrace changes structure. The Price equation partitions variance at a specific time *t*. My point is that the selective pressure at *t* was generated at *t-minus-30-years*. The 'group' that built the terrace is not the 'group' currently being selected. If you treat the colony as a single organism, you assume the genotype of the colony is stable. In my seabirds, turnover is high. The group phenotype persists; the group genotype does not. That decoupling breaks the standard multi-level account.

  **Soft Spot:**
  The Price equation can technically incorporate time lags if you define the terms broadly enough. You are arguing for a biological interpretation, not a mathematical impossibility.

  **Confidence in Prediction:** High. They will defend the universality of the Price equation.

  **Objection 4: The Doctoral Student (Price Equation)**
  *"But if we just add a time index to the Price equation, doesn't the problem dissolve? We can just say the covariance is between past traits and current fitness. Why do we need a philosophical tripartition when the algebra handles the lag?"*

  **Your Reply:**
  Algebra describes; it does not explain *what* is being counted. If you correlate past traits with current fitness, you are measuring ghost selection. You are attributing causal power to genes that are no longer present in the population. My tripartition stops you from making the error of thinking the current population is adapted to the current environment. The math might balance, but the biological story you tell about 'adaptation' will be wrong. You need to know which question you are answering before you plug in the numbers.

  **Soft Spot:**
  Students love math. Telling them math "doesn't explain" can sound like anti-intellectualism. You must emphasise that the *interpretation* of the math is the issue.

  **Confidence in Prediction:** Medium. Students vary, but this is a common reaction to theoretical biology critiques.

  **Objection 5: The Historian of Science**
  *"This sounds like the old 'levels of selection' debate from the seventies, dressed up in new jargon. Once we agree that genes, organisms, and groups all play a role depending on the context, what work is left for you to do? Isn't this just saying 'everyone is right about something'?"*

  **Your Reply:**
  It is not saying everyone is right; it is saying everyone is answering a different question while claiming to answer the same one. That causes empirical errors. If a gene-selectionist predicts a trait will spread because it benefits the gene, but the trait is actually maintained by a legacy terrace built by a different lineage, the prediction fails. The debate isn't verbal if it leads to wrong counts of chicks or wrong expectations of trait stability. I am offering a diagnostic tool to prevent category errors in field data, not a peace treaty for theorists.

  **Soft Spot:**
  If you cannot point to a specific historical case where this confusion led to a false prediction, the historian will view this as purely semantic reshuffling.

  **Confidence in Prediction:** High. Historians are trained to spot recycled debates.

  **Objection 6: The Whole-Organism Biologist**
  *"In all this talk of genes, groups, and terraces, where is the bird? You've turned the animal into a vehicle for genes or a statistic for a group. What about development? What about the physiology of the bird actually living on the terrace?"*

  **Your Reply:**
  I agree the animal has been erased, but my view puts it back. By separating the 'causal' question from the 'bookkeeping' question, we focus on the organism's actual interaction with its world. The bird is the entity navigating the mismatch between the environment it inherited and the genes it carries. I am not reducing the bird to a gene; I am highlighting the bird's struggle with a legacy it did not create. That is a deeply organismal problem.

  **Soft Spot:**
  Your argument still relies heavily on evolutionary abstraction. If you don't have a concrete example of the physiological stress involved, this will sound like lip service.

  **Confidence in Prediction:** Medium. This depends on how strongly this person feels about developmental biology versus evolutionary theory.

  **Objection 7: The Charge of Equivocation**
  *"You say there are three questions. But if they usually have the same answer, and only come apart in rare cases like your birds, isn't 'unit of selection' still a valid concept for general theory? Are you not just carving out a special case and pretending it breaks the rule?"*

  **Your Reply:**
  Science often advances by studying the exception that breaks the rule. Gravity works everywhere, but general relativity was needed for the exceptions near black holes. If my 'lagged' cases are rare, fine. But if niche construction is as common as some claim, then the 'standard' case is the exception. I am not carving out a special case; I am suggesting the standard model assumes a synchrony between organism and environment that is often false. The tripartition is the general tool; the synchrony is the special assumption.

  **Soft Spot:**
  This is your strongest philosophical ground, but you risk sounding like you are overgeneralising from one island of seabirds.

  **Confidence in Prediction:** High. This is the core philosophical vulnerability of your talk.

  **Objection 8: The Practical Biologist**
  *"I have to manage conservation on these islands. Does your theory tell me whether to clear the terraces or leave them? If I have to index every claim to a specific question, does that paralyse decision-making? I need to know if the population is viable, not which philosophical bucket it fits in."*

  **Your Reply:**
  It tells you that clearing the terraces might kill the birds, not because the birds need them now, but because the birds are adapted to a world that no longer exists genetically. If you treat the terrace as merely 'environment', you might assume the birds will adapt quickly. My view warns you that the selection pressure is decoupled from the current gene pool. Adaptation will be slower than you think. It changes your timeline for intervention. It tells you to expect lag, not equilibrium.

  **Soft Spot:**
  If your theory doesn't yield a different management strategy than standard ecology, this objection will stick. You must be sure the 'lag' implies a tangible conservation risk.

  **Confidence in Prediction:** Medium. Practical biologists are often impatient with theory, but they respect empirical warnings.

  ***

  ### STRATEGIC CONCESSIONS

  **Concede this in the first two minutes:**
  *"I am not proposing a new mathematical framework to replace the Price equation, and I am not claiming the gene's-eye view is 'wrong' about genetics. I am claiming it is incomplete when time-lagged environmental feedback is present."*
  (Do this immediately. It disarms the MLS and Gene's-Eye partisans by acknowledging their validity within their own domains.)

  **Concede this if pressed on the 'Design' question:**
  *"I accept that 'beneficiary' is teleological shorthand. If there is a cleaner way to phrase 'which entity's frequency increases as a result of the trait', I will adopt it. I am wedded to the biological reality, not the word."*
  (This prevents the philosopher from getting stuck on your use of 'for' or 'purpose'.)

  ***

  ### CONFIDENCE ASSESSMENT OF THIS SHEET

  **Overall Confidence:** Moderate to High.
  The objections are reconstructed based on standard disciplinary positions in the philosophy of biology and evolutionary theory. The specific mix of your audience makes these predictions robust, as these are the canonical fault lines in the units-of-selection debate.

  **Least Sure Claim:**
  I am least sure about **Objection 8 (The Practical Biologist)**.
  *Reasoning:* Field biologists vary wildly in their tolerance for theory. Some will love the nuance; others will dismiss it entirely as irrelevant to "counting chicks". My prediction that you can offer a concrete conservation implication relies on the assumption that 'lagged adaptation' creates a measurable extinction risk distinct from standard environmental mismatch. If the lag is short or the birds are generalists, this objection might be more damaging than I have estimated.

  **Final Note:**
  Your argument stands or falls on the empirical reality of the lag. If the terrace chemistry reverts to baseline within one generation, your case collapses. Ensure your data on the soil persistence is ironclad before you speak. Good luck.
