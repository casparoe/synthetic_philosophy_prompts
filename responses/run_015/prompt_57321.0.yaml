  Driving Consideration: The incommensurability of foundational norms (coherence versus truth-tracking) renders the slot dispute derivative rather than central.

  2. What each camp is actually committed to
  The empiricist camp, following van Fraassen, is committed to voluntarism and constructive empiricism. Their load-bearing commitment is that belief is governed by coherence constraints, specifically probabilistic conditionalization. Any rule that forces a belief update outside of conditioning is deemed irrational because it exposes the agent to diachronic exploitation. Their primary move against realism is the bad-lot objection, which argues that selecting the best available hypothesis is vacuous if the truth is absent from the set. When realists argue that science succeeds, empiricists respond that empirical adequacy, not truth, explains success. They refuse to grant that explanatory power confers probability, viewing it as a pragmatic virtue rather than a truth indicator.

  The realist camp, following Lipton, is committed to the idea that explanation is a guide to truth. Their load-bearing commitment is that scientific success would be a miracle if theories were not approximately true. They argue that explanatory loveliness guides judgments of likeliness, effectively shaping priors and likelihoods. When confronted with the bad-lot objection, realists argue that the objection proves too much, as it would undermine the empirical reasoning used to formulate the objection itself. They insist that the reliability of explanatory reasoning is best explained by the fact that it tracks reality. However, they often oscillate between claiming IBE is a distinct rule of inference and claiming it is merely a heuristic for Bayesian inputs, which weakens their formal position.

  Both sides agree that explanation matters, but they disagree on whether it warrants belief or merely acceptance. The empiricist demands a formal warrant within a coherence framework, while the realist demands a metaphysical warrant within a truth-tracking framework. This leads to a stalemate where each side views the other's core commitment as question-begging. The empiricist sees the realist as irrational for violating conditioning; the realist sees the empiricist as skeptical to the point of paralysis. Neither can concede their core norm without abandoning their entire epistemic framework.

  3. Locating the fault line
  Your three-slot taxonomy captures the surface mechanics but misses the normative depth. You suggest empiricists attack the acceptance slot while realists defend the prior and likelihood slots. This is partially true: empiricists certainly attack the idea that explanation licenses categorical belief beyond probability. However, realists are not merely defending the prior slot; they are often defending the claim that IBE is a *sui generis* rule that can override strict conditionalization. If they conceded it was only a prior-shaper, they would lose the ampliative power they seek. Thus, the dispute is not just about location but about permission.

  Your generator-versus-verifier split is more explanatory of the non-engagement. The bad-lot objection is indeed a claim about the hypothesis generator: it asserts we have no reason to trust the sampling process. The realist defenses are claims about the verifier: they point to the track record of selected hypotheses. The non-engagement arises because the empiricist denies the verifier has access to truth, only empirical adequacy. If you cannot verify truth, you cannot certify the generator.

  Does this relabel the problem? Somewhat. It clarifies that the empiricist sees the generator as opaque and the verifier as limited to phenomena, while the realist sees the generator as truth-tracking and the verifier as accessing reality. However, it does not solve the normative issue of whether one *should* trust the generator without independent verification. The slot theory fails because it treats the inference machinery as neutral, when the machinery itself embodies the normative conflict. The empiricist rejects the machinery that allows explanation to boost probability unless it is derived from conditioning. The realist accepts the machinery because it yields truth. The generator/verifier distinction explains why they talk past each other, but the slot theory obscures why they cannot compromise. The real fault line is that the empiricist requires the verifier to be theory-neutral, while the realist accepts theory-laden verification. This makes the generator's reliability impossible to adjudicate neutrally.

  4. Verbal, substantive, empirical, or ill-posed
  The dispute is primarily substantive, specifically normative, rather than verbal, empirical, or ill-posed. It is not merely verbal because the disagreement is not just about the definition of inference but about the permissions granted to an epistemic agent. If IBE is distinct from Bayesian conditioning, it allows for belief updates that conditioning forbids. This has concrete consequences for how one manages uncertainty and risk. A verbal dispute would dissolve upon clarifying terms, but here the terms map onto incompatible norms of rationality.

  The empirical option is secondary. Your hypothesis suggests the reliability of the generator is an empirical question. However, this question cannot be settled without already assuming a stance on the substantive issue. To measure the generator's success rate, one must know which hypotheses are true. The empiricist denies we can know this for unobservables, while the realist affirms it. Thus, the empirical question is inaccessible without first resolving the normative metaphysical stance.

  The ill-posed option has merit regarding the comparison class. IBE requires a set of competitors to determine the best. If the set is poorly defined, the inference fails. However, this is a technical limitation rather than the core conflict. Even with a fixed comparison class, the empiricist would still reject the ampliative leap. Therefore, the core issue is substantive: it is a clash between a coherence theory of justification and a truth-tracking theory of justification. The other factors are symptoms of this deeper incompatibility. The verbal aspect exists only insofar as both sides use the word inference, but they mean different normative operations.

  5. What would count as progress
  Progress is unlikely on the core question because it hinges on foundational axioms that are not empirically adjudicable. A rational inquirer should treat the stalemate as stable and proceed by clarifying the cost of each axiom rather than seeking a knockout argument. Formal progress would involve modeling IBE strictly as a prior-modifying heuristic within a Bayesian framework to test for diachronic coherence. If IBE can be shown to always align with conditionalization given specific prior structures, the empiricist objection loses force without conceding realism.

  Alternatively, a change of question is needed. Instead of asking if IBE is legitimate, ask under what ecological conditions a generator produces truth-tracking hypotheses. This shifts the burden to the empirical claim about the generator. If specific domains show high generator reliability, IBE is justified locally rather than globally. This avoids the universal claim that triggers the bad-lot objection.

  However, if one must choose a side, the rational move is to adopt the empiricist constraint for formal consistency while using realist heuristics for discovery. This splits the difference: use explanation to generate and prioritize hypotheses, but withhold categorical belief until empirical adequacy is secured. This preserves coherence while leveraging the utility of explanation. The stalemate persists because neither side can prove their foundational norm without begging the question, so inquiry should focus on domain-specific reliability rather than universal validation.

  6. Where my framing breaks
  Your framing breaks on the assumption that the prior slot is neutral. Assigning priors based on explanatory power is not distinct from an acceptance rule if those priors determine belief thresholds. By locating realist defenses in the prior slot, you concede too much to the empiricist. Realists intend IBE to be ampliative, not just preparatory. Furthermore, your generator-versus-verifier distinction presupposes that verification is possible. The empiricist denies we can verify the generator's truth-tracking without circularity. You treat the reliability of the generator as an empirical question, but for the empiricist, it is a philosophical impossibility regarding unobservables. Your hypothesis assumes a realist metaphysics to diagnose the dispute, which biases the diagnosis against the empiricist position from the start.
