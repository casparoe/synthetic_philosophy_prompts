answer: |-
  Here is the spec for a theory of "repugnant markets." Your opponents are right that "ick" isn't an argument, but you are right that "harm" isn't the only metric. A robust theory must bridge meaning and materiality.

  ### The Checklist
  1.  **Consent Insufficiency:** Must explain why informed, voluntary consent is insufficient to legitimize certain transactions (e.g., votes, kidneys) without appealing to paternalism.
  2.  **Semantic Corruption:** Must identify how putting a price on a good alters its social meaning or function (e.g., an apology becomes a transaction, a vote becomes a commodity) in a way that degrades the good for everyone, not just the seller.
  3.  **Systemic Externalities:** Must demonstrate harm to third parties or the institution itself, distinct from the buyer-seller exchange (e.g., vote selling undermines democracy even if both parties benefit).
  4.  **Dynamic Normativity:** Must explain why some taboos fade legitimately (insurance, interest) while others should remain (votes, bodies), avoiding the trap of "always wrong" absolutism while acknowledging historical contingency.

  ### Analysis of Requirements
  **Real vs. Partisan:**
  *   **Real:** *Consent Insufficiency.* If your theory collapses when the seller is rich and happy, it is merely an exploitation theory, not a market-limitation theory.
  *   **Partisan:** *"Fix desperation, then allow markets."* This is a pro-market wish. It assumes the only objection is coercion. Your spec must demand the theory explain why the market is wrong *even if* desperation is cured (for commodification cases).

  **Incompatibilities:**
  You suspected "Explain why kidney sales are wrong" and "Don't just launder disgust" cannot both hold. They can, but only if you ground disgust in **social meaning** rather than biology. If the theory says "bodies are temples," it's essentialist (fails Dynamic Normativity). If it says "selling bodies undermines human equality," it's sociological (passes). The tension is real: you must prove the meaning is objective enough to regulate, but flexible enough to evolve.

  **The Knockout Requirement:**
  **Consent Insufficiency (specifically the "Rich Donor" case).**
  Most standard arguments rely on exploitation (the seller is desperate). Your case (b)—the rich guy paying to *donate*—breaks this. No seller is exploited; money flows to charity. Yet it feels wrong. A theory that cannot explain why *buying the right to give* is repugnant fails. This knocks out pure libertarian "consent is king" models and pure Marxist "exploitation only" models. It forces a theory of **commodification**: some things lose value when turned into assets, regardless of who holds the asset.

  ### Where This List Is Wrong (and What Changes My Mind)
  **The Weak Point:** *Semantic Corruption.*
  This requirement assumes goods have an intrinsic "meaning" that markets corrupt. A hardheaded utilitarian would argue meaning is just aggregated preference. If people stop caring that apologies are bought, the harm vanishes. If "meaning" is just subjective preference, then regulating it is paternalism.

  **What Changes My Mind:**
  If you can demonstrate that **all** repugnance reduces to unarticulated harm calculations.
  For example: If you prove vote selling is banned solely because of verification costs/fraud risk (material), not democratic integrity (meaning), then *Semantic Corruption* drops off the list. If you prove kidney bans are solely about medical safety outcomes (infection rates rise with markets), not bodily sanctity, then *Consent Insufficiency* drops.

  However, history suggests this reduction fails. We ban incest between consenting adults using contraception (no health risk). We ban selling babies even with safety regulations. This suggests *Semantic Corruption* is a real requirement, not a ghost.

  **The Trap to Avoid:**
  Do not let the spec demand "Universal Repugnance." That fails *Dynamic Normativity*. The theory must explain why *we* (here, now, in this institutional context) find it repugnant, without claiming *all humans everywhere* must feel so. The argument isn't "this is unnatural," it's "this breaks the specific social contract we rely on for this institution."

  **Final Advice:**
  Focus on the **Rich Donor** case. It is your strongest wedge. It proves the objection isn't about the seller's welfare, but the nature of the good itself. If they can't explain why buying the "right to save a life" is worse than just saving a life, their theory is incomplete.
