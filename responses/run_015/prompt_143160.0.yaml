      *   *Decision:* Start with **Facticity vs. Transcendence**. Why? Because the students' error is treating facticity (the "given" temperament) as deterministic. They need to see that facticity is only meaningful *through* transcendence. The For-Itself/In-Itself distinction is the *basis* for this, but Facticity/Transcendence is the *operative* distinction for bad faith. Actually, looking closer at Sartre's text (*BN*, Part One, Chapter 2), he introduces Bad Faith immediately after discussing the For-Itself's structure. To understand why "I am melancholic" is bad faith, one must understand that the For-Itself *is not* what it is.
      *   *Refinement:* Let's secure **Facticity vs. Transcendence** first, but grounded in the **For-Itself's mode of being**. If I just say "Facticity/Transcendence," they might treat them as two separate things. I need to establish that human reality *is* the tension between them.
      *   *Revised Decision:* Start with the **For-Itself vs. In-Itself** distinction, but *immediately* operationalize it as **Facticity and Transcendence**. You can't understand why "melancholy" isn't a fixed thing (In-Itself) without knowing the For-Itself is a "nothingness." So, Order: 1. For-Itself/In-Itself (ontological status), 2. Facticity/Transcendence (structural dynamic).

