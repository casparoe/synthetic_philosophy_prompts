answer: |-
  This is a sharp observation, and you are right to feel that the standard taxonomy is blurring the edges here. As a philosopher of psychology, I see this gap often: the literature tends to bifurcate irrationality into *belief-based* errors (self-deception, bias) or *action-based* errors (akrasia, compulsion). Your phenomenon sits in the *pre-doxastic* space—the management of attention and environment to prevent a judgment from forming in the first place.

  Let's think through this systematically. I'll walk through the nearest neighbors to show why they fail, then propose a carve and a term that fits a CogSci operationalization.

  ### 1. Mapping the Nearest Neighbors

  To carve this concept cleanly, we need to see where the existing boundaries cut.

  **A. Self-Deception (The Doxastic Neighbor)**
  *   **Standard View:** The agent holds a false belief ($P$) despite evidence for ($\neg P$), usually to reduce anxiety.
  *   **Why it fails:** As you noted, your flatmate (and you) don't actually *believe* the excuse. She doesn't truly think "I will definitely do it tomorrow." She thinks, "I don't want to check if I will do it tomorrow."
  *   **The Edge:** Self-deception requires a *doxastic commitment* (even if shaky). Your phenomenon is characterized by *doxastic suspension*. It is not "I believe I am safe"; it is "I am avoiding looking at the danger meter."
  *   **Philosophical Note:** Alfred Mele's deflationary account of self-deception comes close (biasing evidence gathering), but even Mele assumes the agent is trying to arrive at a specific belief. Your case is trying to *avoid arriving at any belief*.

  **B. Akrasia / Weakness of Will (The Action Neighbor)**
  *   **Standard View:** Acting against one's better judgment. "I judge I should work, but I scroll."
  *   **Why it fails:** Akrasia presupposes an *occurrent judgment*. You must know you should work *while* you scroll. In your description, you are actively arranging the environment (hiding the clock) to *prevent* that judgment from becoming occurrent.
  *   **The Edge:** Akrasia is a conflict between judgment and action. Your phenomenon is a conflict between a *goal* and *awareness*. It is a strategy to prevent the "better judgment" from triggering.

  **C. Strategic Ignorance (The Information Neighbor)**
  *   **Standard View:** Deliberately avoiding information to maintain plausible deniability (e.g., not opening a test result to avoid bad news).
  *   **Why it fails:** Strategic ignorance is usually about *external* facts (salary, test results, partner's fidelity). Your case is about *internal/normative* status (am I meeting my obligations?).
  *   **The Edge:** Strategic ignorance avoids *outcome* knowledge. Your phenomenon avoids *evaluative* knowledge. It's not "I don't want to know if I got the postdoc"; it's "I don't want to know if I am the kind of person who applies for the postdoc."

  **D. Self-Handicapping (The Performance Neighbor)**
  *   **Standard View:** Creating obstacles to performance (e.g., staying out late before an exam) to provide an external excuse for failure.
  *   **Why it fails:** Self-handicapping sabotages the *ability* to succeed. Your flatmate is sabotaging the *opportunity to monitor* success. She isn't making it harder to write the application; she's making it harder to *notice* she isn't writing it.

  ### 2. The Carve: What is the Core Mechanism?

  The phenomenon you are describing has three necessary conditions that distinguish it from the neighbors:

  1.  **Motivated Attentional Gating:** The agent actively filters sensory or cognitive input (hiding the clock, closing the portal) not to relax, but to prevent a specific comparison (Current State vs. Normative Standard).
  2.  **Pre-Doxastic Status:** The agent does not settle on a false belief ("I'm doing fine"). They maintain a state of *ambiguous suspension*. The excuse is a tool to close the inquiry, not a conclusion of the inquiry.
  3.  **Structural Agency:** It involves scaffolding the environment to support the avoidance. It is not just a mental slip; it is an engineered state of ignorance.

  This is not "lying to oneself" (which implies a liar and a liee). It is **"engineering opacity."**

  ### 3. Proposed Terminology

  There isn't a single established term that captures this triad perfectly. "Willful Ignorance" is the legal/philosophical ancestor, but it's too broad. "The Ostrich Effect" (from behavioral economics) captures the avoidance of financial information, but lacks the normative/moral weight of a deadline.

  I propose we coin: **Strategic Evaluative Evasion (SEE)**.

  Here is the definition for your work:
  > **Strategic Evaluative Evasion:** The active manipulation of attentional or environmental conditions to prevent the salience of a normative standard, thereby suspending the requirement to form a belief about one's compliance with that standard.

  #### Why this term works for CogSci:
  *   **Strategic:** Captures the active planning (hiding the clock, opening/closing the portal). It distinguishes it from mere distraction.
  *   **Evaluative:** Specifies the *content* of what is being avoided. It's not just information; it's a *measurement of the self against a norm*.
  *   **Evasion:** Captures the motion. It is not a state of belief (Deception) but a trajectory away from judgment.

  ### 4. Boundary Conditions (The "Carving" in Practice)

  To use this in your PhD, you need to know what counts as SEE and what doesn't.

  | Feature | **Strategic Evaluative Evasion (SEE)** | **Self-Deception** | **Akrasia** | **Mindless Distraction** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Belief State** | Suspended / Ambiguous | False Belief ($P$) | True Belief ($\neg P$) | Irrelevant |
  | **Intent** | Avoid Evaluation | Affirm Falsehood | Satisfy Desire | Satisfy Boredom |
  | **Mechanism** | Environmental/Attentional Gating | Evidence Biasing | Impulse Override | Attentional Drift |
  | **Excuse Status** | Tool to close inquiry | Believed justification | Acknowledged weakness | Post-hoc rationalization |
  | **Example** | Hiding the clock | "I work better under pressure" | "I know I should stop scrolling" | "I lost track of time" |

  **The Critical Edge Case:**
  If your flatmate *starts* to believe "I work better under pressure," she has migrated from **SEE** to **Self-Deception**.
  If she looks at the clock, thinks "I am wasting time," and *keeps* scrolling, she has migrated from **SEE** to **Akrasia**.
  **SEE** is the specific window where the agent is successfully keeping the normative question *offline*.

  ### 5. Why this matters for your research

  You mentioned you are working on motivation and irrationality. This distinction is crucial for intervention design.

  *   **If it's Self-Deception:** You challenge the belief. (Show evidence she *doesn't* work better under pressure).
  *   **If it's Akrasia:** You strengthen willpower or pre-commitment. (Block the scrolling sites).
  *   **If it's SEE:** You must disrupt the *opacity*. (Put the clock back in sight, sit with her so she can't close the portal).

  The intervention for SEE is not cognitive restructuring; it is **salience restoration**.

  ### 6. Alternative Options (If SEE doesn't fit)

  If "Strategic Evaluative Evasion" feels too clunky, here are two backups with slightly different flavors:

  1.  **Motivated Epistemic Avoidance (MEA):** Broader. Focuses on the knowledge aspect. Good if you want to link to the "Strategic Ignorance" lit in economics.
  2.  **Doxastic Deferral:** Focuses on the "later" aspect. "I'm not saying I'm good, I'm just saying we'll check later." This captures the procrastination element well but might miss the environmental scaffolding.

  ### Recommendation

  Stick with **Strategic Evaluative Evasion**. It is precise enough for a philosophy paper but operationalizable for a CogSci experiment (e.g., measuring time spent hiding vs. monitoring feedback).

  It captures the specific tragedy of your flatmate: she isn't lying to herself; she is hiding from herself. And crucially, she is *working hard* to do it. That effort is the marker of the irrationality.
