  2.  **Drafting - Step 1: Character Conception:**
      *   **Bayesian:** Let's call her Dr. Elena Corvo. Temperament: Precise, analytical, comfortable with uncertainty as a state of mind.
      *   **Explanationist:** Let's call him Dr. Marcus Thorne. Temperament: Intuitive, focused on structure and understanding, skeptical of formalism overriding practice.
      *   **Setting:** A walk between sessions (allows for flow without stage directions).

  3.  **Drafting - Step 2: Structuring the Argument:**
      *   **Opening:** Establish the case facts (briefly, as agreed data) and the core disagreement.
      *   **Bayesian Move:** Corvo explains the "logical entailment" solution to old evidence. Needs numerical example.
      *   **Explanationist Counter:** Thorne argues explanation is objective, not about belief states.
      *   **Addressing awkward features:**
          *   Tuning (1978): Bayesian says tuning lowers prior or likelihood? Explanationist says tuning weakens explanation.
