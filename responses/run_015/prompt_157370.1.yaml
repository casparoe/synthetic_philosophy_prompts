answer: |-
  Elena Corvo: The Vaska–Lindgren case is a textbook instance of how the Bayesian handles old evidence. We treat the evidence as old, yes, the 1997 measurement was on the books, but the logical relation between the theory and that evidence was not. Between 2011 and 2013, the theorists were uncertain about what their own model entailed because of the algebraic slip. When the erratum corrected the slip, the agents learned a new proposition: that the Vaska–Lindgren model entails the 1997 wavelength. Confirmation is probability-raising, and learning that entailment raises the probability of the model.

  Marcus Thorne: That captures the chronology, Elena, but it misses the epistemology. The scientists weren't excited because they updated a probability distribution over propositions about entailment. They were excited because the corrected model made sense of the 1997 measurement in a way the rival Adeyemi–Brant model did not. The 1997 datum is evidence because the Vaska–Lindgren model explains it, not because a theorist conditionalized on a derivation. The problem of old evidence is an artefact of insisting that confirmation must be modeled as belief updating.

  Corvo: But without the updating formalism, you cannot distinguish between a theory that merely accommodates a known fact and one that is supported by it. Consider the tuning. The 2011 model was tuned to the 1978 value. If we simply say it explains the data, it explains the 1978 data equally well. Yet we agree the 1997 measurement confirms it better. My account handles this via the likelihoods. Let me be precise. Let $H$ be the hypothesis that the Vaska–Lindgren model is correct. Let $E$ be the 1997 measurement of 118.394 nm. Let $X$ be the proposition that $H$ entails $E$. In 2012, due to the algebraic slip, a rational agent assigns $P(X) = 0.5$. She is unsure if the model yields 118.394 or 118.42. Her prior in $H$ is $P(H) = 0.1$. Since $H$ cannot be true without $X$ being true in this context, $P(X|H) = 1$. By Bayes' theorem, $P(H|X) = P(X|H)P(H) / P(X)$. That is $1 \times 0.1 / 0.5 = 0.2$. The discovery of the entailment doubles the probability. The 1978 data provides no such lift because the model was constructed to fit it; the likelihood $P(1978 \text{ data} | H \text{ constructed})$ is near unity regardless of $H$'s truth, so no confirmation accrues.

  Thorne: Your arithmetic is clean, but it implies the confirmation depends on how slowly the theorist does her algebra. If a genius sees the entailment instantly in 2011, $P(X)$ is already 1, and your formula yields no confirmation. $0.1 / 1 = 0.1$. Does the truth of the model depend on the computational speed of the theorist? That seems absurd. The explanatory relation exists independently of when anyone notices it. The Vaska–Lindgren model explains the 1997 line because it derives the wavelength from cascade rate coefficients grounded in atomic physics. The Adeyemi–Brant model does not explain it; it accommodates it by postulating a blend and an auxiliary assumption about iron abundance being 2.3 times photospheric. That auxiliary is ad hoc. It saves the phenomenon but offers no understanding of why the line is narrow. Explanatory power is not reducible to conditional probabilities.

  Corvo: I concede the point about the genius. Logical omniscience is an idealization we never meet. In practice, confirmation is relative to the agent's state. If the genius already knew the entailment, the datum was never "old evidence" for her; it was part of the background. But for the actual Vaska–Lindgren team, the 2013 erratum was a genuine learning event. However, I must revise my earlier claim about the 1978 tuning. It isn't just that the likelihood is high. The tuning means the 1978 value was used to fix parameters. When the 1997 data arrived, it was novel relative to the *corrected* model's parameters. The 1997 measurement wasn't just a refinement; it displaced the 1978 value by six standard errors. The model, once corrected, tracked the unused 1997 value better than the used 1978 value. That is why the probability rises. The model survived a risk it didn't know it was taking.

  Thorne: You are smuggling explanatory virtue into the probability via the notion of "risk." Why is surviving a risk confirmatory? Because it suggests the model latches onto the structure of the world. That is explanation. But I must concede something as well. I said explanatory relations are independent of probability. Yet, if the Adeyemi–Brant model had predicted the 1997 wavelength with high precision without the auxiliary assumption, we would say it explains the data better. There is a correlation between explanatory power and what you call likelihood. I should not say they are wholly unrelated. However, the direction of fit is wrong in your account. We judge the probability high because the explanation is good, not vice versa. The narrowness of the line is key. The Vaska–Lindgren model predicts a single narrow line. The Adeyemi–Brant model predicts a blend. The 1997 spectrometer showed it was a single line. Vaska–Lindgren explains the narrowness; Adeyemi–Brant must add another auxiliary to explain why the blend looks single. That structural superiority is what confirms the model, not the arithmetic of belief.

  Corvo: But how do you quantify that structural superiority without probabilities? If I ask you how much more confirmed Vaska–Lindgren is than Adeyemi–Brant, you cannot answer. My framework gives me the 0.2 versus the prior. You have only a qualitative "better." Science requires weighing competing theories. If the Adeyemi–Brant model had a higher prior because it was simpler in some other respect, your explanatory advantage might not outweigh it. You need a currency to trade explanatory power against prior plausibility. That currency is probability. Regarding the 1997 measurement: you say it restores confirmatory value. I agree, but because it functions as a new test. The 1978 entry was a datum with high error. The 1997 entry was a datum with low error. The model passing the high-precision test is what drives the likelihood ratio. The fact that it was measured earlier is irrelevant to the logic, only to the psychology of the agent.

  Thorne: I disagree that the currency must be probability. We weigh theories by comparing the coherence of their explanatory networks. Adeyemi–Brant requires a specific iron abundance factor of 2.3. This is isolated from the rest of solar physics. Vaska–Lindgren uses cascade rates consistent with other iron transitions. The confirmation comes from the unification. Now, about the 1997 measurement. You say it functions as a new test. But it was old evidence. The modelers knew the 1997 value existed in 2011. They just didn't know their model matched it until 2013. If confirmation requires a new test, the 2013 erratum is the test, not the 1997 data. The 1997 data is the thing being explained. My concession is this: I must acknowledge that the 1997 measurement's precision matters. If the 1997 measurement had been as uncertain as the 1978 one, the explanatory victory would be weaker. Explanation depends on the fidelity of the phenomenon. But that fidelity is a feature of the world, not the agent's belief state.

  Corvo: Then we are left with the core divergence. For me, the confirmation happens at the moment the agent becomes certain of the entailment. The 2013 erratum is the confirmatory event. The 1997 data is just the content of the entailment. If the theorists had never checked the 1997 data, there would be no confirmation, even if the model entailed it. For you, the confirmation resides in the relation between the model and the data, regardless of whether the theorists check it. If the model entails the 1997 data, it is confirmed, even if no one ever looks at the 1997 tables.

  Thorne: Precisely. If the Vaska–Lindgren model entails the 1997 wavelength, it captures a fact about the corona. That capture is the confirmation. Whether a theorist in 2013 feels a surge of probability is incidental. The awkwardness of the algebraic slip supports me. For two years, the model did not entail the datum because the model was flawed. The correction fixed the model, restoring the explanatory relation. You treat the slip as epistemic uncertainty about a fixed relation. I treat it as an ontological defect in the theory itself. The theory literally did not explain the line until 2013.

  Corvo: But that collapses the distinction between the theory and our grasp of it. The equations existed in 2011. The slip was in the derivation, not necessarily the physical postulates. If the physical postulates were correct, the entailment held logically, even if the humans couldn't see it. My account preserves the objectivity of the logic while acknowledging the subjectivity of the confirmation. I must revise my earlier stance on the tuning, though. I said the 1978 data provides no lift. But if the 1997 data had matched the 1978 data, the model would have been confirmed by the 1978 data retrospectively. The displacement is what kills the confirmation for the 1978 value. The model failed the 1978 value once the 1997 value displaced it. So the 1978 tuning was actually a liability until the 1997 data showed the 1978 data was wrong.

  Thorne: And I must revise my claim about the auxiliary assumption. I said the iron abundance factor was ad hoc. But if independent spectroscopy confirmed that abundance factor, the Adeyemi–Brant model would gain explanatory power. It is not the ad hocness per se, but the lack of independent warrant. This suggests that explanatory power does track independent probability assessments after all. Yet I maintain that the track is not the terrain. The reason we value independent warrant is that it deepens the explanation, not merely that it raises the probability. We are left with this: do you confirm the theory because it becomes probable, or does it become probable because it is confirmed by explanation?

  Corvo: I confirm the theory because the probability rises. The explanation is the mechanism that makes the rise rational, but the confirmation is the rise itself.

  Thorne: And I say the explanation is the confirmation. The probability is merely a shadow it casts on our beliefs. The residual disagreement is whether the shadow is the substance. If the Vaska–Lindgren model explains the 1997 line perfectly but, due to some prior prejudice, the community assigns it low probability, has it been confirmed?

  Corvo: No. If the community remains unpersuaded, confirmation has not occurred socially, though logically it should have.

  Thorne: Then your confirmation is psychological. Mine is physical. The corona emits at 118.394 nm because of dielectronic recombination. The model says so. That fit is the confirmation. Whether the community updates their betting odds is a separate matter of sociology.

  Corvo: Then we disagree on whether philosophy of science describes the logic of justification or the metaphysics of truth.

  Thorne: We disagree on whether evidence is a relation between minds and propositions, or between theories and the world.

  Corvo: And whether the 2013 erratum created evidence or merely revealed it.

  Thorne: Exactly. And until we settle whether evidence can be created by correction, we cannot settle the old evidence problem.
