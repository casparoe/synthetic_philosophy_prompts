          *   Algebraic Slip (2011-2013): Bayesian uses this for the "uncertainty about entailment" point. Explanationist uses this to show understanding was lacking.
          *   Rival (AB): Comparison of explanatory power vs. probability.
      *   **Concessions:** Both need to bend slightly.
      *   **Ending:** Sharp disagreement on the nature of confirmation.

  4.  **Drafting - Step 3: Writing & Refining (incorporating constraints):**

      *   *Constraint Check:* Word count is tight (1200-1600). Need to be dense but conversational.
      *   *Constraint Check:* Bayesian needs explicit arithmetic. $P(H|E) = P(E|H)P(H) / P(E)$. Or specifically regarding the entailment proposition $X$ (H entails E).
      *   *Constraint Check:* Explanationist needs to define explanatory goodness without probability.
      *   *Constraint Check:* Address the 1997 vs 1978 nuance.
      *   *Constraint Check:* Address the algebraic slip.

      *Drafting thought process:*
      Start mid-conversation to save words? No, better to start clearly to establish context.
      Corvo (Bayesian): Focus on the 2013 erratum. That's the key for "uncertainty about entailment."
      Thorne (Explanationist): Focus on the 1997 measurement being *explained* better than the 1978 tuning target.

      *Arithmetic:*
      Let $H$ = VL Model is true.
      Let $E$ = 1997 Measurement (118.394).
      Let $X$ = H entails E.
      Before 2013 correction, $P(X)$ was low (due to algebraic slip uncertainty).
      After 2013, $P(X)$ goes to 1.
      Need to show how $P(H)$ rises.
      Actually, the standard Glymour-style solution is conditionalizing on $H \vdash E$.
      Let's try:
      $P(H | H \vdash E) = P(H \vdash E | H) P(H) / P(H \vdash E)$.
      Since $H \vdash E$ is necessary if H is true (mostly), $P(H \vdash E | H) = 1$.
      So $P(H | H \vdash E) = P(H) / P(H \vdash E)$.
      If $P(H \vdash E)$ was 0.5 (uncertainty due to slip), and $P(H)$ was 0.1.
      New $P(H) = 0.1 / 0.5 = 0.2$.
      This shows confirmation.

      *Explanationist:* Needs to argue VL explains 1997 data *because* it derives it from first principles (mostly), whereas AB uses ad hoc auxiliaries. The "narrowness" point is crucial for explanation.

