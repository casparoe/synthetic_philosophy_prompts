  The Equanimity Polity presents a fascinating illusion, but it ultimately misunderstands the grammar of moral life. They claim to hold people responsible without feeling resentment, insisting that structural disapproval suffices for accountability. I must insist that this is a conceptual confusion: reactive attitudes are not mere psychological ornaments accompanying responsibility; they are constitutive of the very relationships within which responsibility makes sense. To treat another as a moral agent is to be vulnerable to their goodwill or ill will; if I witness a deliberate slight and feel no stir of indignation, but merely register a rule violation to be corrected institutionally, I am no longer participating in a genuine interpersonal relationship. I am managing a resource or training a pet. Their "structural disapproval" without emotional engagement is indistinguishable from the objective attitude they disavow, for it removes the essential demand for goodwill that defines ordinary adult human commerce.

  Could determinism naturally push humanity toward such a polity? Only if it compelled us to abandon our nature as social beings, which I argue it does not. The framework of reactive attitudes is natural to us, rooted in our participation in human society, and no general thesis of determinism can logically require us to withdraw from this participation without ceasing to be human. I concede that cultures may vary in how these attitudes are expressed or moderated, and individuals may differ in sensitivity, but a society that rigorously suppresses them entirely is not a refined moral community; it is a community in withdrawal. Responsibility survives not because of metaphysical freedom, but because our commitment to these interpersonal relationships is too deep to be shaken by theoretical doubts, and the Equanimity Polity, in seeking to shake them, loses the very thing it claims to preserve.
