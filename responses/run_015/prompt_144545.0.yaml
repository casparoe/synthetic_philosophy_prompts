  2.  **Deconstruct Strawson's Position (Freedom and Resentment):**
      *   Reactive attitudes (resentment, indignation, gratitude, etc.) are natural expressions of our participation in interpersonal relationships.
      *   The objective attitude is viewing someone as an object to be managed, cured, or trained (exempting conditions).
      *   Holding someone responsible *just is* being susceptible to these attitudes.
      *   If you remove the attitudes, you remove the relationships themselves (friendship, love, ordinary social commerce).
