answer: |-
  1.  **Conceptual Grounding: The Entry-Standing Distinction and Lexical Priority**
      Your monograph relies heavily on a lexical ordering where the moral urgency of open borders is subordinated to the achievement of thick civic reciprocity. However, you distinguish between *entry rights*, which you grant are morally substantial, and *standing rights*, which are contingent. If entry rights are indeed morally substantial, on what grounds do you justify a lexical priority that effectively renders them inert until the prior condition of reciprocity is met? Does this not collapse the distinction by making the right to enter contingent on the very conditions required for standing?

  2.  **Follow-up to Question 1**
      If you reply that entry remains meaningful because it grants physical presence without immediate distributive claims, does this not create a category of residents who are subject to the state's coercion—taxation, law, and enforcement—without the co-authorship status you argue is necessary for legitimacy? How do you reconcile this with the liberal principle that subjection to coercion generates a claim to justification?

  3.  **Motivational Infrastructure: Empirical Prediction vs. Normative Condition**
      Moving to your core justification for this conditionalism: you argue that rapid demographic change erodes the "motivational infrastructure" of redistribution. We need to clarify the modal status of this claim. Does the erosion of solidarity function in your argument as an empirical prediction about voter psychology—i.e., that citizens *will* withdraw support—or as a normative condition for legitimate coercion, implying they *ought* to withdraw support if reciprocity is absent?

  4.  **Follow-up to Question 3 (Keyed to "Both" Reply)**
      Anticipating that you may insist this operates as both an empirical reality and a normative boundary: if the empirical fact of reduced solidarity is what triggers the normative permission to restrict standing, are you not effectively allowing contingent prejudices to dictate the boundaries of moral obligation? How do you prevent your normative theory from becoming merely a rationalization of existing voter reluctance?

  5.  **Operationalization: Defining Thick Reciprocity Without Assimilation**
      Let us press on the operationalization of your central metric. You require "thick civic reciprocity" before full standing is conferred. How do we determine that this threshold has been achieved without smuggling in assimilationist benchmarks or culturally parochial norms? If the content of reciprocity is too specific, it excludes; if it is too thin, it fails to support the high-transfer welfare schemes you aim to protect.

  6.  **Follow-up to Question 5 (Keyed to Procedural Retreat)**
      If you retreat to procedural criteria—such as adherence to law or participation in voting—to avoid the charge of assimilationism, does this not undermine the "thick" descriptor you rely on? Can a merely procedural adherence generate the robust motivational infrastructure you claim is necessary, or does this reveal that the "thickness" is actually doing no normative work?

  7.  **Asylum and Collapsed Societies: The Two-Tier Structure**
      I would like to apply your entry-versus-standing distinction to the case of asylum seekers fleeing societies where the reciprocity conditions you prize have already collapsed. You likely distinguish between temporary protection and full distributive standing. But for individuals whose home states offer no possibility of return or re-integration, does this distinction not amount to a permanent suspension of rights rather than a provisional one?

  8.  **Follow-up to Question 7 (Keyed to Exclusionary Reproduction)**
      If you maintain that this two-tier structure is necessary to preserve the host state's solidarity, does this not reproduce the very exclusion you claim is only provisional? By denying standing to those who are structurally incapable of meeting your reciprocity conditions, are you not institutionalizing a class of persons who are permanently barred from the co-authorship required for legitimacy?

  9.  **Falsifiability: Theoretical Failure vs. Implementation Difficulty**
      Finally, regarding the robustness of reciprocity-first conditionalism itself: what specific institutional failure or empirical finding could actually falsify your position? We must distinguish between evidence that integration is more difficult than anticipated, and evidence that the theoretical link between reciprocity and welfare legitimacy is incorrect.

  10. **Follow-up to Question 9**
      If your response is that any erosion of welfare support confirms your theory rather than falsifying it, does this not render reciprocity-first conditionalism unfalsifiable? If every instance of strain is interpreted as a vindication of the need for stricter conditionalism, how can the theory be subject to critical revision rather than functioning as a closed loop?
