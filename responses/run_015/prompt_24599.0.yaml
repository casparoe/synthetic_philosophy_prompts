answer: |-
  This is a precise and penetrating question. You are asking for a structural analysis of a decision-theoretic practice, treating the "Expected Value" (EV) not as a given truth but as an operator whose domain of definition is often tacitly assumed to be universal. As a physicist, you will recognize the parallel to assuming a Hamiltonian is self-adjoint or that a partition function converges without checking the boundary conditions.

  Here is the examination of the practice, structured according to your three requests.

  ### 1. The Implicit Theory: What the Practice Presupposes

  The practice of pricing a gamble strictly by its expected value presupposes that the **Expectation Operator is well-defined and linear over the space of tradable gambles.**

  Mathematically, this is stronger than merely claiming every gamble has a value in the extended reals ($\mathbb{R} \cup \{-\infty, +\infty\}$). It presupposes **absolute convergence**.

  To see why, recall the Riemann Rearrangement Theorem. If a series is conditionally convergent (converges, but not absolutely), its sum can be rearranged to equal any real number. In the context of a gamble, the "ordering" of terms corresponds to the indexing of outcomes. While the outcomes of a coin flip are naturally indexed by time ($n=1, 2, \dots$), the *value* of the gamble should ideally be intrinsic to the probability measure and the payoff function, not dependent on the order in which we sum the disjoint events.

  The standard pricing practice implicitly assumes the gamble corresponds to a random variable $X$ that is **Lebesgue integrable** with respect to the probability measure $P$. That is:
  $$ \int |X| \, dP < \infty $$
  This condition guarantees that the expectation $E[X]$ exists, is finite, and is independent of the summation order.

  However, in practical commerce (insurance, casinos), the presupposition is often slightly weaker but still fatal to the Pasadena game: it assumes the expectation exists in the **extended reals without oscillation**.
  *   **St. Petersburg Game:** The sum diverges to $+\infty$. The extended real line accommodates this. The practice can (awkwardly) handle this by saying the value is "infinite" (or practically, very large).
  *   **Pasadena Game:** The sum oscillates. The extended reals do not accommodate oscillation. There is no number, and there is no signed infinity.

  Therefore, the strict presupposition of the pricing practice is: **"For any gamble offered in this market, the series $\sum p_i x_i$ converges to a unique limit in $\mathbb{R} \cup \{-\infty, +\infty\}$."** The practice treats the existence of this limit as a background law of nature, rather than a condition that requires verification. It assumes the "thermodynamic limit" of the gamble exists.

  ### 2. Coherence and Distinguishability from St. Petersburg

  Is this presupposition coherent? **No, not universally.** It is locally coherent within the domain of absolutely convergent gambles (which comprises almost all real-world insurance and casino bets), but it is globally incoherent because the space of well-defined probability distributions includes non-integrable functions (like the Pasadena game).

  The practice fails to distinguish the Pasadena game from the St. Petersburg game in its *initial* setup (both are "infinite" in magnitude), but the standard repairs used to save the St. Petersburg game fail catastrophically for the Pasadena game. This exposes a conceptual rift that the standard practice glosses over.

  Let us examine the standard "regularization" techniques (replies to St. Petersburg) and apply them to Pasadena:

  **A. Bounded Utility**
  *   *St. Petersburg:* If we assume the agent maximizes Expected Utility $E[U(x)]$ with a bounded utility function (e.g., logarithmic wealth), the series converges. The "paradox" dissolves.
  *   *Pasadena:* This also works mathematically. If $U(x)$ is bounded, the terms $p_n U(x_n)$ decay to zero, and the series converges.
  *   *Conceptual Cost:* This changes the *object* being priced. The practice you described prices the *gamble* (monetary payoffs), not the *agent's relation* to the gamble. If pricing depends on the specific utility function of the buyer, there is no longer a single "fair price" intrinsic to the security. The price becomes relative to the agent's curvature of utility. For a physicist, this is akin to saying a particle's mass depends on the observer's velocity—acceptable in relativity, but a violation of the "intrinsic property" assumption of classical pricing.

  **B. Finite Wealth / Truncation**
  *   *St. Petersburg:* We assume the casino has finite capital $C$. The game is truncated when the payoff exceeds $C$. The expected value becomes finite (roughly $\log_2 C$). As $C \to \infty$, the value diverges to $+\infty$ monotonically.
  *   *Pasadena:* As you noted, this is where the physics breaks. If we truncate the Pasadena game at $N$ flips, the expected value is the $N$-th partial sum of $1/2 - 1/2 + 1/2 \dots$.
      *   If $N$ is odd, $E_N = 1/2$.
      *   If $N$ is even, $E_N = 0$.
      *   As $N \to \infty$ (as the casino's wealth grows), the value **does not converge**. It oscillates forever between 0 and 1/2.
  *   *Implication:* In the St. Petersburg case, the "infinite wealth" limit is a vertical asymptote. In the Pasadena case, there is no limit. The "value" of the gamble is discontinuous with respect to the bankroll. A casino with $\$10^{100}$ might price it at 0.50, while a casino with $\$10^{100} + \text{one unit}$ might price it at 0.00. This violates the continuity presupposed by standard pricing models.

  **C. Impatience (Discounting)**
  *   *St. Petersburg:* Apply a temporal discount factor $\delta < 1$. The series converges.
  *   *Pasadena:* Apply $\delta^n$. The terms become $\pm \frac{1}{2}\delta^n$. This is a geometric series which converges.
  *   *Implication:* This saves the calculation, but again, it changes the gamble. It prices a *time-sensitive* claim, not the abstract gamble described. If the payoff is instantaneous, discounting is conceptually inapplicable.

  **Conclusion on Coherence:** The practice treats the Pasadena game and the St. Petersburg game as members of the same class ("infinite expectation"). They are not. St. Petersburg has a value of $+\infty$ (a determinate direction). Pasadena has **no value** (indeterminate direction). The practice is incoherent because it lacks the vocabulary to declare a gamble "unpriceable" rather than "infinitely priced."

  ### 3. Underdetermination and Consequences of "No Value"

  **Where the Practice is Underdetermined**
  The practice of pricing by EV is underdetermined in the region of convergence. When a series converges absolutely, multiple foundational theories yield the same price:
  1.  **Frequentism:** The price is the long-run average payout (Law of Large Numbers).
  2.  **Bayesianism:** The price is the coherent betting quotient (Dutch Book arguments).
  3.  **Axiomatic Utility:** The price is the certainty equivalent (von Neumann-Morgenstern).

  For well-behaved gambles, these converge to the same number. The practice does not distinguish *why* EV is the price, only *that* it is. This underdetermination hides the fragility of the concept. We don't know if we are pricing based on long-run convergence (which fails for Pasadena, as the sample mean oscillates forever) or based on axiomatic coherence (which also fails, as no coherent preference ordering can rank the Pasadena game against a fixed sum without violating continuity or dominance axioms).

  **What Must Change if We Accept "No Value"**
  If we accept that well-defined gambles can lack an expected value, the practice of pricing must undergo three structural shifts:

  1.  **From Measurement to Commitment:**
      Currently, pricing is treated as *measurement*: the trader discovers the EV. If EV can be undefined, pricing becomes a *speech act of commitment*. To quote a price on a Pasadena-like instrument is not to state a fact about the instrument, but to assert a willingness to bear the oscillation risk. The "margin" added by an insurer is no longer just risk aversion; it is a buffer against mathematical indeterminacy.

  2.  **The Introduction of "Unquoteable" Instruments:**
      Markets would need a mechanism to refuse liquidity. Just as a physicist says "this integral diverges," a market maker must say "this security has no quote." Currently, regulations often require a price. Accepting undefined value implies that **rationality sometimes dictates refusal to trade.** It legitimizes the stance: "There is no number I can write down that represents this risk."

  3.  **Dependence on Regularization Parameters:**
      Prices would have to be quoted conditionally on a "cutoff" parameter (like a renormalization scale). A price would look like: "$0.50$ assuming truncation at odd $N$, $0.00$ assuming truncation at even $N$." This destroys the idea of a "Fair Price." It replaces the single number $P$ with a function $P(N)$ or $P(\delta)$. The practice would shift from finding *the* price to negotiating the *parameters of valuation*.

  ### Summary for the Physicist

  The practice of pricing by expected value treats the Expectation Operator as a total function on the space of gambles. The Pasadena game demonstrates that the domain of this operator is not total; it has holes.

  When the practice prices a Pasadena game (or assumes it can), it is effectively performing an **analytic continuation** where none exists. It is assigning a value to a singularity. In the St. Petersburg case, the singularity is a pole (infinity); in the Pasadena case, it is an essential singularity (oscillation).

  The practice is defensible only as a **local effective theory**. It works for the "low-energy" gambles of everyday life where payoffs are bounded or probabilities decay faster than payoffs grow. But it presupposes that the "high-energy" limit (unbounded payoffs with slow decay) is either physically impossible or irrelevant. The Pasadena game proves this presupposition is false in principle. To maintain coherence, the practice must admit that for a subset of well-defined gambles, **the price is not a number, but a null set.**
