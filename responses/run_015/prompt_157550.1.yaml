prompt: |-
  You are a senior methodology officer and philosopher of mind advising a multi-site cognitive neuroscience consortium that runs repeated consciousness studies—roughly forty sessions per quarter—staffed mainly by graduate students and technicians with uneven philosophical training. You need a reusable, operational protocol that translates heterophenomenology into a practical workflow: a step-by-step decision procedure, with explicit nodes and time constraints, that treats every subject’s verbal and behavioral report about conscious experience as a text within that subject’s heterophenomenological world, not as direct, authoritative access to private mental states. The procedure must remain ontologically neutral among competing theoretical frameworks (for instance, global workspace, higher-order, and integrated-information accounts), and it must be executable within fifteen minutes per case by a researcher with only a master’s-level background, with the principal investigator required to sign off solely at nodes where judgment genuinely cannot be eliminated.

  Your deliverable should contain: (1) a preliminary screening checklist that decides whether a session’s data qualify for heterophenomenological treatment rather than for standard introspective or purely behavioral protocols; (2) an ordered sequence of no more than five interpretive tests—expressed as questions a non-expert can apply—to classify any given report as descriptive within the heterophenomenological world, confabulatory, theoretically loaded, or ambiguous; (3) clearly marked JUDGMENT REQUIRED points at every stage where the theory underdetermines the decision, specifying exactly what the PI must evaluate and sign; (4) explicit rules for conflicts between verbal report and concurrent behavioral or neurophysiological measures, distinguishing cases where discrepancy enriches the heterophenomenological narrative, cases where it invalidates the report, and cases where the data must be suspended; (5) worked applications to three concrete scenarios, including one split-brain patient who reports a unified visual field despite demonstrable contralateral neglect, one subject operating under adversarial incentivization who reports phenomenal-overflow experiences that align neatly with a rival theoretical framework, and one unwelcome case—an articulate subject describing meticulously detailed “micro-phenomenal shifts” during binocular rivalry whose reports your procedure must downgrade or reclassify despite their surface sophistication; and (6) a concise statement of what the protocol cannot do, especially regarding ontological commitment to consciousness and legitimate cross-subject comparison. Before constructing the procedure, begin with a brief conceptual map that distinguishes heterophenomenological neutrality from both eliminativism about consciousness and naive first-person authority, identifying which philosophical distinctions must survive this operational translation and which can be collapsed without distortion. Think carefully, step by step, be honest about misfires, and do not invoke bibliographic authority, citations, or appeals to named texts—the protocol must stand on its conceptual logic alone.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**
      *   **Role:** Senior Methodology Officer and Philosopher of Mind.
      *   **Audience:** Multi-site cognitive neuroscience consortium (graduate students, technicians, uneven philosophical training).
      *   **Task:** Create a reusable, operational protocol translating *heterophenomenology* into a practical workflow.
      *   **Constraints:**
          *   Step-by-step decision procedure with explicit nodes and time constraints.
          *   Treat reports as "text" (heterophenomenological world), not direct access to private states.
          *   Ontologically neutral (compatible with GWT, HOT, IIT, etc.).
          *   Executable within 15 minutes per case by Master's-level researchers.
          *   PI sign-off required *only* where judgment cannot be eliminated.
          *   Deliverables: (1) Screening Checklist, (2) 5 Interpretive Tests, (3) Judgment Required Points, (4) Conflict Rules (Report vs. Behavior/Neuro), (5) 3 Worked Scenarios (Split-brain, Adversarial/Incentivized, Articulate/Micro-phenomenal), (6) Limitations Statement.
          *   **Pre-requisite:** Begin with a brief conceptual map (Heterophenomenological Neutrality vs. Eliminativism vs. Naive First-Person Authority).
          *   **Style:** Conceptual logic only (no citations/bibliographic authority).

  2.  **Deconstruct Heterophenomenology for Operations:**
      *   *Core Idea:* The subject's report is data about *what they believe they experience*, not necessarily data about *what they actually experience* (in the ontological sense). It creates a "heterophenomenological world" (HP-world) for the subject.
      *   *Neutrality:* We don't say the experience is real or fake initially. We catalog the report.
      *   *Operationalization:* How do we stop students from treating reports as truth (naive) or ignoring them entirely (eliminativism)? We need a filter that says "Record this as a belief state" and then cross-reference it with objective data without privileging either immediately.
      *   *Time Limit:* 15 minutes per case means the decision tree must be binary and fast. No deep philosophical debate during data processing.

  3.  **Drafting the Conceptual Map:**
      *   Need to distinguish three positions:
          1.  *Naive First-Person Authority:* Subject says X, therefore X is true about their mind. (Reject this).
          2.  *Eliminativism:* Subject says X, but since we can't measure qualia, X is noise/error. (Reject this).
          3.  *Heterophenomenological Neutrality:* Subject says X. We record "Subject believes X." We then correlate "Belief X" with neural/behavioral data Y. Whether X matches reality is a theoretical conclusion, not a methodological starting point.
      *   *Collapsible Distinctions:* We don't need to solve the Hard Problem here. We just need to agree on the *status of the data*.
      *   *Surviving Distinctions:* The gap between *seeming* and *being*. The distinction between the *report* and the *state reported*.

  4.  **Developing the Protocol (The "Heterophenomenological Triage Protocol" - HTP):**
      *   *Time Budget:* 15 mins total.
      *   *Step 1: Screening (3 mins).* Is this report usable as HP-data?
      *   *Step 2: Interpretive Tests (5 mins).* The 5 questions.
      *   *Step 3: Conflict Resolution (4 mins).* Report vs. Neuro/Behavior.
      *   *Step 4: PI Escalation (3 mins).* Only if stuck.

  5.  **Drafting the Components:**

      *   **(1) Screening Checklist:** Needs to filter out pure reflex or pure speculation. It must ensure the subject is attempting to describe experience, not just guess stimuli.
      *   **(2) 5 Interpretive Tests:** Needs to classify the report type.
          1.  Consistency?
          2.  Theoretical loading? (Did they read the papers?)
          3.  Descriptive vs. Explanatory?
          4.  Stability across trials?
          5.  Coherence with baseline behavior?
          *Refinement:* Make them binary Yes/No for speed.
      *   **(3) Judgment Required Points:** Where does the Master's student *have* to stop? When the data is ambiguous enough that classifying it changes the theoretical outcome significantly.
      *   **(4) Conflict Rules:** This is crucial.
          *   *Enrichment:* Report says "flash," Neuro says "no flash." -> HP-World contains "belief in flash." Useful for error analysis.
          *   *Invalidation:* Report says "I saw nothing," but they press the button perfectly. -> Maybe blindsight? Or lying?
          *   *Suspension:* Contradiction is total and unresolvable.
      *   **(5) Worked Scenarios:**
          *   *Split-Brain:* Unified report vs. neglect behavior. HP-World = "Belief in unity." Neuro = "Disunity." Status: Enrichment (confabulation of unity).
          *   *Adversarial:* Subject wants to prove Overflow. Reports vivid periphery. HP-World = "Belief in vividness." Incentive detected. Status: Theoretically Loaded/Suspicious.
          *   *Articulate/Micro-shifts:* Too detailed. Hyper-introspection. Likely confabulatory construction. Status: Downgrade to "Narrative Construction."
      *   **(6) Limitations:** Cannot prove qualia exist. Cannot compare "red" between subjects directly.

  6.  **Refining for Constraints:**
      *   *Ontological Neutrality:* Ensure language never says "The subject felt X." Always "The subject reported feeling X."
      *   *PI Sign-off:* Limit this. If the student can classify it using the rules, no PI needed. PI only for "Suspension" or "High-Stakes Ambiguity."
      *   *Time:* Explicitly state time limits per section.
      *   *Tone:* Administrative, precise, philosophical but operational.

  7.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is 15 minutes realistic for 5 tests?
      *   *Fix:* Make the tests checklist style, not essay style.
      *   *Critique:* Did I distinguish eliminativism enough?
      *   *Fix:* Emphasize in the Conceptual Map that we *keep* the report as data, unlike eliminativism which discards it.
      *   *Critique:* Are the scenarios specific enough?
      *   *Fix:* Ensure the "Articulate" scenario shows *why* sophistication is a red flag (over-fitting the HP-world).
      *   *Critique:* Is the PI role clear?
      *   *Fix:* Create a specific "Escalation Form" concept.

  8.  **Final Polish:** Check against the prompt's specific requirements (no citations, specific sections, conceptual map first). Ensure the distinction between the "HP-World" (the subject's narrative reality) and the "Real World" (neural/behavioral facts) is maintained without asserting the Real World is the *only* truth (neutrality).

      *(Self-Correction on Neutrality)*: Wait, heterophenomenology treats the HP-world as a fiction *until* validated. I need to make sure the protocol doesn't accidentally validate the HP-world as truth. The protocol must treat the HP-world as the *object of study*, not the *lens of study*.
      *Correction:* The report *constructs* the HP-world. We study the HP-world's relation to the physical data.

      *(Refining the 5 Tests)*:
      1.  Is it a claim about experience (vs. stimulus)?
      2.  Is it consistent internally?
      3.  Is it independent of theoretical training?
      4.  Is it stable over repetition?
      5.  Does it align with non-verbal behavior?
      *Wait, Test 5 overlaps with Conflict Rules.* Let's make Test 5 about "Linguistic Precision vs. Phenomenal Plausibility" to catch the articulate confabulator.

      *(Refining Conflict Rules)*: Need to be very clear. Discrepancy != Error. Discrepancy = Data Point about the HP-World's boundary.

      *(Refining PI Role)*: PI signs only when the "Ontological Neutrality" is at risk of being breached by the researcher's bias.

  9.  **Final Output Structure:**
      *   Conceptual Map.
      *   Protocol Header (Time, Personnel).
      *   Section 1: Screening.
      *   Section 2: 5 Tests.
      *   Section 3: Conflict Rules.
      *   Section 4: PI Escalation.
      *   Section 5: Scenarios.
      *   Section 6: Limitations.

      *Let's write.*
answer: |-
  # CONCEPTUAL MAP: OPERATIONALIZING NEUTRALITY

  Before applying the protocol, the researcher must internalize the specific stance of **Heterophenomenological Neutrality**. This is not a theoretical claim about consciousness; it is a methodological constraint on data handling.

  1.  **Vs. Naive First-Person Authority:** The naive view treats the subject's report ("I saw a red flash") as a direct window into a private mental object. **We reject this.** The report is treated as a verbal behavior that generates a *text*. The "red flash" exists in the subject's *heterophenomenological world* (HP-world), but its existence in the physical/neural world is an open question.
  2.  **Vs. Eliminativism:** The eliminativist view treats the report as noise or error because private states are unmeasurable. **We reject this.** The report is valid data about the subject's *beliefs* and *dispositions*. Even if the experience is an illusion, the *belief in the experience* is a real physical event to be correlated with neural data.
  3.  **The Surviving Distinction:** The gap between *seeming* and *being*. The protocol must preserve the distinction between "Subject reports X" and "Subject experiences X."
  4.  **The Collapsible Distinction:** We do not need to decide if qualia are real or reducible to function. For the purpose of this workflow, "conscious experience" is defined operationally as "whatever the subject is disposed to report under standardized interrogation."

  **Goal:** To convert raw verbal output into a structured dataset of *belief-states* that can be correlated with neurophysiological measures without presupposing the truth of the belief.

  ***

  # HETEROPHENOMENOLOGICAL TRIAGE PROTOCOL (HTP)
  **Version:** 4.2 | **Max Duration:** 15 Minutes per Case | **Operator:** Master's-Level Researcher

  ## 1. PRELIMINARY SCREENING CHECKLIST (Time Limit: 3 Minutes)
  *Objective:* Determine if the session output qualifies for heterophenomenological analysis or should be routed to standard behavioral/introspective archives.

  **Instruction:** Review the session transcript and metadata. Check **YES** or **NO**.

  1.  **Intentionality Check:** Does the subject explicitly claim to describe an internal state (e.g., "I felt," "It seemed") rather than guessing an external stimulus (e.g., "The light was")?
      *   [ ] YES | [ ] NO
  2.  **Coherence Check:** Is the transcript intelligible enough to extract a propositional attitude (a claim that can be true or false)?
      *   [ ] YES | [ ] NO
  3.  **Protocol Adherence:** Did the subject follow the instruction to report *experience* rather than *performance* (e.g., did they avoid saying "I pressed button A because I thought that was the right answer")?
      *   [ ] YES | [ ] NO

  **Decision Node:**
  *   **All YES:** Proceed to Section 2 (Interpretive Tests).
  *   **Any NO:** Route to **Standard Behavioral Archive**. Do not treat as HP-data.
  *   **Uncertain on #1:** Mark for **PI Review** (See Section 4).

  ***

  ## 2. INTERPRETIVE TESTS (Time Limit: 5 Minutes)
  *Objective:* Classify the report's status within the HP-world. Apply these five binary questions to the dominant claim of the session.

  **Test 1: The Phenomenal/Physical Distinction**
  *Question:* Does the report describe *how it felt* (phenomenal) or *what happened* (physical)?
  *   *Example:* "The light looked bright" (Phenomenal) vs. "The light was 500 lumens" (Physical).
  *   **Action:** If Physical, tag as **Behavioral Guess**. If Phenomenal, tag as **HP-Candidate**.

  **Test 2: Theoretical Loading**
  *Question:* Does the vocabulary exceed the subject's likely exposure to neuroscience/philosophy terminology provided in the consent form?
  *   *Example:* Using terms like "qualia," "global workspace," or "integrated information" spontaneously.
  *   **Action:** If Yes, tag as **Theoretically Contaminated**. If No, tag as **Naive Report**.

  **Test 3: Stability Index**
  *Question:* Is the core claim consistent across at least 80% of repeated trials within the session?
  *   **Action:** If Yes, tag as **Stable Belief**. If No, tag as **Volatile/Context-Dependent**.

  **Test 4: Explanatory Overreach**
  *Question:* Does the subject offer a causal mechanism for their experience (e.g., "I saw it because my attention focused")?
  *   **Action:** If Yes, isolate the *experience claim* from the *explanation*. Discard explanation as **Confabulatory Narrative**. Retain experience claim.
  *   **Note:** Subjects explaining *why* they feel something is a primary source of HP-world fiction.

  **Test 5: Granularity Plausibility**
  *Question:* Is the temporal or spatial resolution of the report within known psychophysical limits (e.g., claiming to distinguish events <10ms apart)?
  *   **Action:** If Yes (exceeds limits), tag as **Hyper-Articulate Construction**. If No, tag as **Plausible Resolution**.

  ***

  ## 3. CONFLICT RESOLUTION RULES (Time Limit: 4 Minutes)
  *Objective:* Resolve discrepancies between the HP-World (Report) and the Physical-World (Behavior/Neuro).

  **Rule A: The Enrichment Case (Discrepancy = Data)**
  *Condition:* Report claims Experience X; Neuro/Behavior indicates State Not-X.
  *Action:* **Do not invalidate.** Record as "Dissociation Event."
  *Rationale:* The HP-world contains a belief in X. The neural data shows Not-X. This dissociation is the primary data point for theories of error, blindsight, or confabulation.
  *Tag:* `HP-World: X` | `Neuro-World: Not-X` | `Status: Dissociation`

  **Rule B: The Invalidation Case (Report = Noise)**
  *Condition:* Report claims Experience X; Behavior demonstrates perfect performance on a task that requires Not-X (e.g., reporting "guessing" while performing at 100% accuracy on a discrimination task).
  *Action:* Downgrade Report to **Post-Hoc Rationalization**.
  *Rationale:* The verbal report is lagging behind the behavioral competence. The HP-world narrative is constructed after the fact.
  *Tag:* `Status: Post-Hoc`

  **Rule C: The Suspension Case (Total Contradiction)**
  *Condition:* Report claims X; Neuro shows X is physically impossible (e.g., reporting visual experience during V1 silencing *without* alternative pathway activation) AND Behavior is ambiguous.
  *Action:* **Suspend Data.** Flag for PI Review.
  *Rationale:* The contradiction is too severe to categorize without theoretical bias. Neutrality requires suspension.
  *Tag:* `Status: Suspended`

  ***

  ## 4. JUDGMENT REQUIRED POINTS (PI Escalation)
  *Objective:* Limit Principal Investigator involvement to nodes where ontological neutrality is at risk of being breached by operator bias.

  **The Researcher MUST stop and request PI Sign-off if:**

  1.  **Screening Failure on Intentionality:** If it is unclear whether the subject is describing experience or guessing stimuli (Screening Q1).
      *   *PI Task:* Determine if the text supports an HP-world interpretation or if it is pure behavioral noise.
  2.  **Suspension Case Triggered:** If Conflict Rule C is activated.
      *   *PI Task:* Decide whether to archive as an anomaly or exclude from the dataset entirely.
  3.  **High-Stakes Theoretical Loading:** If Test 2 identifies theoretical contamination *and* the subject is a known proponent of a rival framework.
      *   *PI Task:* Assess whether the data can be salvaged by stripping terminology or must be discarded to prevent dataset pollution.

  **Sign-off Mechanism:** Digital flag in the database. Case is locked until PI releases it. Time allowance for PI review is *outside* the 15-minute operator window.

  ***

  ## 5. WORKED APPLICATIONS

  ### Scenario A: The Split-Brain Patient
  *   **Data:** Patient has corpus callosum resection. Stimulus presented to left visual field (right hemisphere). Patient verbally reports "I saw nothing" (left hemisphere speech). However, left hand (right hemisphere) points correctly to the object. Later, when asked "Did you see anything?", patient says "I feel like I saw something unified."
  *   **Application:**
      *   **Screening:** Pass (Intentional report).
      *   **Tests:** Stable Belief (Test 3 Pass).
      *   **Conflict:** Report ("Unified/Nothing") vs. Behavior (Hand points correctly).
      *   **Rule Applied:** **Rule A (Enrichment).**
      *   **Classification:** The verbal report constructs an HP-world of "Unity/Ignorance." The behavior demonstrates "Disunity/Competence."
      *   **Outcome:** Do not discard the verbal report as a lie. Tag as `Dissociation: Confabulated Unity`. This is critical data for theories of self-modeling.
      *   **PI Escalation:** None required.

  ### Scenario B: The Adversarial Incentivized Subject
  *   **Data:** Subject is known to support "Phenomenal Overflow" theory. They are paid a bonus if their data supports "rich experience beyond report." They report vivid peripheral details during attentional blink tasks that control subjects do not report.
  *   **Application:**
      *   **Screening:** Pass.
      *   **Tests:** Test 2 (Theoretical Loading) -> **FAIL**. Vocabulary aligns too neatly with Overflow theory. Test 5 (Granularity) -> **FAIL**. Details are too precise for the condition.
      *   **Conflict:** Report ("Vivid") vs. Behavior (Chance performance on peripheral probe).
      *   **Rule Applied:** **Rule B (Invalidation).**
      *   **Classification:** The report is tagged as **Post-Hoc Rationalization** driven by incentive.
      *   **Outcome:** The HP-world is recorded as "Belief in Vividness," but the metadata flags `Incentive Bias`. The data is retained but weighted differently in meta-analysis.
      *   **PI Escalation:** Required (High-Stakes Theoretical Loading). PI must confirm the bias flag.

  ### Scenario C: The Articulate "Micro-Phenomenal" Subject
  *   **Data:** Subject describes "micro-shifts in hue saturation" lasting 50ms during binocular rivalry. Their description is poetically precise and consistent. However, psychophysical limits suggest discrimination at this resolution is impossible without training they do not have.
  *   **Application:**
      *   **Screening:** Pass.
      *   **Tests:** Test 5 (Granularity Plausibility) -> **FAIL**. Exceeds limits. Test 4 (Explanatory Overreach) -> **FAIL**. Subject explains the mechanism of the shift.
      *   **Conflict:** Report ("Detailed Shift") vs. Neuro (No corresponding V4 modulation at that frequency).
      *   **Rule Applied:** **Rule A (Enrichment) with Downgrade.**
      *   **Classification:** The report is reclassified from "Descriptive" to **"Narrative Construction."**
      *   **Outcome:** The data is not treated as evidence of micro-experience. It is treated as evidence of the subject's *capacity to generate detailed narratives* under rivalry conditions. The HP-world contains a fiction; the study measures the fiction, not the reality.
      *   **PI Escalation:** None required (Protocol handles via Test 5).

  ***

  ## 6. LIMITATIONS STATEMENT

  **This Protocol Cannot:**
  1.  **Settle Ontological Disputes:** It does not prove consciousness exists, nor does it prove it is an illusion. It only catalogs the *structure of the claim* about consciousness.
  2.  **Validate Cross-Subject Identity:** It cannot determine if Subject A's "red" is the same as Subject B's "red." It can only determine if Subject A and Subject B use the word "red" under similar stimulus conditions.
  3.  **Eliminate Researcher Bias Completely:** While the PI sign-off reduces it, the initial tagging (e.g., distinguishing "Naive" from "Theoretically Loaded") relies on the operator's judgment of what counts as "common knowledge."
  4.  **Access the "Real" Experience:** The protocol explicitly forecloses access to the private state. It measures the *shadow* of the state cast onto language and behavior. If a subject is incapable of reporting (e.g., severe aphasia, non-human animals), this protocol is inapplicable and a purely behavioral/neural proxy must be used.

  **Final Directive:**
  Treat the subject not as a witness to the truth, but as a generator of texts. Your job is not to judge their truth, but to catalog their geometry relative to the neural data. Proceed.
