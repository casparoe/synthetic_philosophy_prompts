answer: |-
  ### Private Audit Preliminaries

  **1. Restatement of Commitments (Strongest Form)**

  *   **(a) The All-Affected Principle (AAP):** The sole legitimate ground for enfranchisement is being subject to state coercion that substantially shapes one's life prospects over the long term. Citizenship is morally arbitrary (like eye color); residency and affectedness are the only relevant criteria. Undocumented long-term residents are fully enfranchised.
  *   **(b) Anti-Epistocracy:** The franchise cannot be gated by the quality of political judgment, literacy, or civic knowledge. Competence tests are empirically flawed (biased) and normatively illegitimate (judgment quality is not the right kind of gate).
  *   **(c) Fixed Voting Age:** The franchise opens at age 14. This is a fixed normative line, not a proxy for evolving capacity that could be lowered if psychology changed.
  *   **(d) Compulsory Participation with Protected Abstention:** Citizens/residents have a legal duty to submit a ballot (enforced by fine). This duty is compatible with a secret ballot and a formal "abstain/none" option, preserving the moral right to withhold endorsement while fulfilling the duty of participation.
  *   **(e) Grounds for Compulsion:** Compulsion is justified by three distinct goods: (1) A reciprocal duty of self-rule among community members; (2) Descriptive representativeness of the electorate; (3) Policy responsiveness to the whole population.
  *   **(f) Anti-Proxy:** Children are independent moral patients, not parental extensions. Proxy voting unjustly weights power by fertility and denies children's emerging agency.
  *   **(g) Boundary Assumptions:** (1) A short residency wait (e.g., 1 year) is permissible for newcomers. (2) Citizens living abroad indefinitely retain the franchise.

  **2. Pairwise Testing**

  *   **(a) vs (g2) [Expats]:** **Real Conflict.** (a) says citizenship is irrelevant; (g2) grants vote based on citizenship despite lack of residency/affectedness.
  *   **(a) vs (g1) [Residency Wait]:** **Apparent Conflict.** (a) requires "long run" shaping. A 1-year wait administratively verifies "long run" intent. Consistent if justified as proof of affectedness.
  *   **(a) vs (c) [Age]:** **Real Conflict.** (a) enfranchises based on affectedness. Children under 14 are affected. (c) excludes them.
  *   **(b) vs (c) [Competence vs Age]:** **Real Conflict.** (b) rejects judgment quality as a gate. Age limits are typically proxies for capacity/judgment. If judgment doesn't matter, the justification for age 14 vanishes.
  *   **(b) vs (f) [Competence vs Proxy]:** **Real Conflict.** If (b) holds (judgment doesn't matter), then children under 14 could vote (if (c) is lowered) or deserve proxy. (f) denies proxy. (c) denies vote. The exclusion of under-14s requires a capacity claim that (b) forbids.
  *   **(a) vs (e) [Affectedness vs Membership]:** **Apparent Conflict.** (e) cites duty of "members." (a) rejects membership. Consistent only if "member" is redefined as "affected resident."
  *   **(d) vs Colleague [Compulsion/Abstention]:** **Apparent Conflict.** Logically compatible if duty is defined as *participation* rather than *selection*.
  *   **(a) vs Colleague [Tourists]:** **Apparent Conflict.** (a) specifies "long run." Tourists are short-term. Consistent if "long run" is enforced.
  *   **(c) vs (f) [Age vs Proxy]:** **No Conflict.** They work together to exclude under-14s from direct and indirect voting. The conflict is with (a) and (b), not each other.

  ***

  ### The Audit

  #### 1. Real Conflicts (Ordered by Severity)

  **Conflict 1: The Expatriate Contradiction [(a) vs (g2)]**
  *   **Severity:** Critical. This undermines the core theoretical foundation of your report.
  *   **The Conflict:** Commitment (a) asserts that citizenship is morally irrelevant ("eye color") and affectedness is the sole ground. Commitment (g2) grants the franchise to citizens abroad indefinitely. Most long-term expats are not subject to the daily coercive structure of the state (laws, services, policing) in the way residents are. They are insulated from the consequences they vote on.
  *   **Implication:** You cannot hold both that citizenship is irrelevant *and* that citizenship alone preserves the vote for those no longer affected. Either (a) is false (citizenship matters), or (g2) is false (expats lose the vote).
  *   **What you must give up:** Either the purity of the All-Affected Principle or the indefinite expat franchise.

  **Conflict 2: The Competence/Age Tension [(b) vs (c)]**
  *   **Severity:** High. This leaves your voting age arbitrary.
  *   **The Conflict:** (b) states that judgment quality is not the right kind of thing to gate the franchise. (c) sets the age at 14. Age limits are almost exclusively proxies for cognitive capacity or political maturity. If judgment quality is irrelevant (b), there is no normative reason to exclude a 10-year-old who is affected (a). If you exclude them because they lack capacity, you are implicitly reinstating a competence gate, violating (b).
  *   **Implication:** Your view either commits you to universal suffrage from birth (with proxy, which you reject in f) or it requires you to admit that *some* threshold of agency is required, which qualifies (b).
  *   **What you must give up:** The absolute claim in (b) that capacity is never a gate, or the specific age limit in (c).

  **Conflict 3: The Disenfranchised Child [(a)+(b) vs (c)+(f)]**
  *   **Severity:** High. This creates a normative "dead zone."
  *   **The Conflict:** Children under 14 are substantially affected by state coercion (a). You reject competence tests (b). Yet you exclude them from voting (c) and reject proxy voting (f). Consequently, a group that is fully affected and whose judgment quality is deemed irrelevant is completely silenced.
  *   **Implication:** You are disenfranchising a class of affected persons without a consistent principle. If affectedness grants the claim (a), and judgment isn't a bar (b), the only bar is administrative or biological. But (f) rejects the administrative fix (proxy) that usually solves the biological barrier for minors.
  *   **What you must give up:** The claim that under-14s have no claim to a say, or the rejection of proxy voting.

  **Conflict 4: The Membership Slip [(e) vs (a)]**
  *   **Severity:** Medium. Terminological but theoretically significant.
  *   **The Conflict:** (e) grounds compulsion in a duty owed by "members of a political community." (a) explicitly rejects membership (citizenship) as the boundary of the franchise.
  *   **Implication:** If the franchise is based on affectedness, the duty of compulsion must be owed by *residents*, not "members" in the traditional sense. Using "membership" language smuggles citizenship back in as a normative category you claimed to discard.
  *   **What you must give up:** The language of "membership" in (e).

  #### 2. Apparent Conflicts (Dissolutions)

  **Conflict 1: Compulsion, Secret Ballot, and Abstention [(d) vs Colleague]**
  *   **Why it dissolves:** Your colleague assumes the duty of voting is a duty to *choose a ruler*. You define it as a duty to *participate in the collective decision procedure*.
  *   **Condition:** You must explicitly define the legal duty as "submitting a valid ballot," where "abstain/none" is a valid marking.
  *   **Cost:** None, provided the legislation defines "abstention" as a valid vote count for turnout purposes. The secret ballot protects the voter from social coercion to choose a candidate; the fine protects the system from voter apathy. They operate on different vectors (privacy vs. participation).

  **Conflict 2: The Tourist Objection [(a) vs Colleague]**
  *   **Why it dissolves:** Your formulation of (a) includes the qualifier "over the long run." Tourists are affected, but transiently.
  *   **Condition:** You must defend the "long run" qualifier as non-arbitrary. It cannot just be a threshold to avoid the tourist problem; it must be grounded in the nature of political authority (which claims legitimacy over life courses, not moments).
  *   **Cost:** You must argue why "long run" affectedness is the trigger for *democratic* voice rather than *human* rights protections. (e.g., Democracy governs the trajectory of a life, not just temporary interactions).

  **Conflict 3: Residency Requirement [(a) vs (g1)]**
  *   **Why it dissolves:** A 1-year wait is compatible with (a) if viewed as an evidentiary hurdle to prove "long run" intent and affectedness, rather than a moral exclusion.
  *   **Condition:** The wait must be short enough not to exclude genuinely affected residents (e.g., refugees).
  *   **Cost:** You must justify why 1 year is the magic number administratively without implying that those present for 11 months are unaffected.

  #### 3. Cheapest Repairs and Their Price

  **Repair 1: The Expatriate Problem (Conflict 1)**
  *   **Repair:** Qualify (g2). Expats retain the vote only if they file taxes or intend to return within a fixed period (e.g., 5 years). Indefinite voting for permanent emigrants is removed.
  *   **Price:** You lose the support of diaspora communities who view voting as an ethnic/cultural right rather than a functional one. You complicate the administration of the voter roll.
  *   **Why this repair:** It aligns (g2) with (a) by tying the vote to ongoing financial/legal affectedness (taxes) or temporary status, rather than pure citizenship.

  **Repair 2: The Competence/Age Problem (Conflict 2 & 3)**
  *   **Repair:** Qualify (b). Distinguish between *Quality of Judgment* (epistocratic gate) and *Capacity for Agency* (administrative gate). Admit that a minimal threshold of agency is required to cast a ballot, but maintain that *how well* they judge is not grounds for exclusion.
  *   **Price:** You open the door to debates about where that capacity threshold lies (14? 12? 10?). You lose the rhetorical purity of "no competence requirements."
  *   **Why this repair:** It saves (c) and (f). It allows you to exclude under-14s not because their judgments are bad (b), but because they lack the legal/biological agency to act independently (f), while maintaining that those who *can* act should not be tested on quality.

  **Repair 3: The Membership Slip (Conflict 4)**
  *   **Repair:** Rewrite (e). Replace "members of a political community" with "participants in the coercive order" or "long-term residents."
  *   **Price:** Rhetorical warmth. "Membership" sounds communal; "residents" sounds transactional.
  *   **Why this repair:** Essential for consistency with (a).

  #### 4. Overall Recommendation

  **The Single Revision:**
  Modify **(b)** to admit a **Minimal Agency Threshold**, while maintaining the **No Epistemic Quality Gate**.

  **The Argument:**
  You must distinguish between the *capacity to perform the act* of voting (agency) and the *quality of the decision* made (judgment).
  *   Current (b) conflates these: "I do not think the quality of a person's political judgment is the right kind of thing to gate the franchise." This is strong and good. But it implies *nothing* can gate the franchise.
  *   Revised (b): "While the quality of judgment is never a gate, the minimal capacity for independent agency is a prerequisite for the *act* of voting."
  *   This revision allows you to keep **(c)** (Age 14 as a proxy for independent agency) and **(f)** (No proxy, because children under 14 lack independent agency).
  *   It resolves the conflict with **(a)**: Children under 14 are affected, but they lack the agency to exercise the franchise personally. Since you reject proxy (f), they are temporarily disenfranchised until agency is presumed. This is a tragedy, but not a contradiction.
  *   It resolves the conflict with **(g2)**: You can argue expats lack the "coercive affectedness" required by (a), regardless of agency.

  **What You Lose:**
  You lose the absolute universalism of (b). You concede that *some* people (infants, severely cognitively impaired) are excluded not because they are unaffected, but because they cannot act. You must defend Age 14 as the best proxy for this agency, which invites empirical challenge (see below).

  #### 5. Missing Elements (The Package Needs)

  **1. The Distinction between *Interest* and *Agency***
  Your package currently collapses "having a stake" (a) with "being able to vote" (c/b). You need a principle that explains why having a stake generates a *claim*, but agency determines the *mode* of fulfillment.
  *   *Argument needed:* Why does the claim of the under-14 affected child not demand proxy voting? You say (f) treats them as extensions. You need to argue that *waiting* for agency is preferable to *ventriloquizing* agency. This is a claim about the developmental value of political participation.

  **2. The Justification for "Long Run" (Against the Tourist Objection)**
  You dismiss the tourist objection as a threshold problem generic to all criteria. This is too casual.
  *   *Argument needed:* Why does democracy track *life prospects* rather than *momentary interests*? You need to argue that legitimate authority requires a stake in the *future* of the polity. Tourists have a stake in the present; residents have a stake in the trajectory. This justifies the residency requirement (g1) and excludes tourists without arbitrary line-drawing.

  **3. Empirical Claims and Risks**
  Your view rests on three empirical claims. If these fail, your normative structure weakens:
  *   **Adolescent Capacity (for c):** You claim 14 is the substantive age of agency. This rests on developmental psychology regarding impulse control and future-oriented reasoning. If 14-year-olds are demonstrably indistinguishable from 10-year-olds in political reasoning capacity, your distinction between (c) and (f) collapses.
      *   *Risk:* High. If psychology moves the goalposts, (c) looks arbitrary.
      *   *Mitigation:* Frame 14 as a legal bright-line for *independence* (e.g., age of criminal responsibility, medical consent) rather than cognitive maturity.
  *   **Turnout/Responsiveness (for e):** You claim compulsion improves policy uptake. This rests on the empirical claim that non-voters have distinct policy preferences from voters, and that politicians respond to turnout numbers, not just donor numbers.
      *   *Risk:* Medium. If politicians ignore low-propensity voters even when they turn out (due to compulsion), ground (3) of (e) fails.
      *   *Mitigation:* Rely primarily on ground (1) (duty) and (2) (legitimacy), which are normative, not empirical.
  *   **Parental Influence (for f):** You claim proxy voting treats children as extensions. This assumes parents cannot separate their interests from their children's.
      *   *Risk:* Low. This is largely conceptual. However, if you admit a Minimal Agency Threshold, you might allow "assisted voting" for older minors (12-14), which complicates (f).

  **Final Blunt Assessment:**
  Your package is 80% coherent. The remaining 20% (Expats and the Basis of Age Exclusion) are fatal if left unaddressed. The colleague who said it "does not hang together" is likely pointing at the Expatriate issue (g2) or the justification for excluding children under 14 given (b). Fix the Expatriate rule to match the Affectedness principle, and clarify that Age 14 is an *Agency* gate, not a *Competence* gate. Do this, and the package holds.
