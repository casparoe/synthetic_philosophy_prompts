answer: |-
  There is no single, canonical term in the standard epistemic injustice taxonomy (e.g., Fricker's original framework) that captures this *exact* configuration. However, it is a widely recognized phenomenon in critical social epistemology, typically discussed as a specific, aggressive modality of **Contributory Injustice** (Kristie Dotson) or **Willful Hermeneutical Ignorance** (Nora Berenstain).

  While these existing concepts capture the *attitude* of the gatekeeper, they do not fully name the *procedural mechanism* you describe: the **compelled translation** that actively distorts the claim followed by a **displacement of blame**.

  Below is an analysis of the closest existing concepts, followed by a proposed term to crystallize this specific configuration, its defining conditions, and its boundaries.

  ### 1. The Closest Existing Concepts

  **A. Contributory Injustice (Kristie Dotson, 2012)**
  *   **Definition:** Occurs when a dominant group possesses the hermeneutical resources to understand a marginalized group's experience but *refuses* to use or cultivate them, maintaining a gap in shared understanding for their own comfort or benefit.
  *   **Fit:** This captures the gatekeeper's refusal to learn the group's framework.
  *   **Gap:** Dotson's concept focuses on the *refusal to contribute* to the shared pool. It does not explicitly name the *compulsion* to translate into the dominant scheme as a condition of entry, nor the specific *distortion* that occurs during that translation.

  **B. Willful Hermeneutical Ignorance (Nora Berenstain, 2016)**
  *   **Definition:** A vice wherein privileged agents actively resist expanding their hermeneutical resources to understand structural oppression because doing so would implicate them in that oppression.
  *   **Fit:** This explains the *motivation* of the gatekeeper (avoiding the normative distinctions the group's framework reveals).
  *   **Gap:** Like Contributory Injustice, this describes the *stance* of the audience, not the *structural procedure* of forced translation and subsequent blame-shifting.

  **C. Epistemic Violence (Gayatri Spivak / subsequent literature)**
  *   **Definition:** The destruction of non-dominant ways of knowing, often by making them unintelligible within the dominant discourse.
  *   **Fit:** This captures the destructive outcome.
  *   **Gap:** It is a broad macro-political term, not a specific micro-sociological label for the institutional review process you describe.

  ### 2. Proposed Term: **Hermeneutical Coercion**

  To capture the specific mechanics you outlined—the compelled translation, the structural flattening, and the blame displacement—I propose the term **Hermeneutical Coercion**.

  While "coercion" is used in political philosophy, applying it specifically to the *hermeneutical* dimension distinguishes it from material coercion. It highlights that the force is applied to the *terms of intelligibility* themselves.

  #### Core Conditions of Hermeneutical Coercion

  1.  **Internal Hermeneutical Sufficiency:** The marginalized group possesses a robust, shared conceptual framework capable of articulating the harm with precision (ruling out standard Hermeneutical Injustice).
  2.  **Institutional Compulsion:** Access to recognition, resources, or justice is conditioned on translating the claim into a dominant conceptual scheme (ruling out simple Ignorance).
  3.  **Structural Flattening:** The dominant scheme lacks the normative or relational vocabulary to carry the specific content of the original claim, resulting in a loss of structural meaning (e.g., a structural critique becomes an "emotional complaint").
  4.  **Blame Displacement:** The failure of the translated claim is attributed to the *claimants* (for being vague, emotional, or lacking evidence) rather than to the *translation mechanism* or the *gatekeeper's constraints*.

  ### 3. Differentiation from Related Concepts

  | Concept | Core Mechanism | Who Lacks Resources? | Outcome |
  | :--- | :--- | :--- | :--- |
  | **Hermeneutical Injustice** (Fricker) | **Lacuna:** A gap in collective interpretive tools. | **Everyone:** The concepts do not exist yet in the collective. | The subject cannot understand/communicate their own experience. |
  | **Contributory Injustice** (Dotson) | **Refusal:** Dominant group refuses to learn/use existing tools. | **Dominant Group:** They have/will not get the resources. | The marginalized group is ignored or misunderstood. |
  | **Hermeneutical Coercion** (Proposed) | **Compulsion:** Dominant group forces use of *their* tools. | **Marginalized Group:** Forced to use ill-fitting tools. | The claim is **distorted** and the **distortion is blamed on the claimant**. |

  ### 4. Distinguishing from Benign Translation

  Not all translation between conceptual schemes is unjust. Academic and policy work often requires translating local knowledge into generalizable categories. To distinguish **Hermeneutical Coercion** from **Benign Hermeneutical Translation**, apply the following boundary tests:

  **A. The Reciprocity Test**
  *   **Benign:** The dominant scheme is also open to modification based on the translation. The gatekeeper acknowledges the loss of nuance and attempts to adjust the dominant scheme to accommodate it.
  *   **Coercion:** The dominant scheme is treated as fixed/neutral. The burden of fit is entirely on the marginalized group.

  **B. The Fidelity Test**
  *   **Benign:** The translation process includes metadata or qualifiers that signal where meaning is lost (e.g., "This category does not fully capture X, but is used for administrative purposes").
  *   **Coercion:** The translated version is treated as the *complete* representation. The loss of distinction is invisible, and the "flattened" version is evaluated as if it were the original.

  **C. The Uptake Test**
  *   **Benign:** If the translation fails, the gatekeeper questions the *translation*, not the *validity* of the grievance.
  *   **Coercion:** If the translation fails, the gatekeeper questions the *credibility* or *rationality* of the group (the blame displacement condition).

  ### 5. Theoretical Lineage and Utility

  Naming this **Hermeneutical Coercion** serves three theoretical functions:

  1.  **Shifts the Locus of Error:** It moves the epistemic fault from the *speaker* (who is often accused of being "unclear" or "too niche") to the *institutional requirement* of translation.
  2.  **Identifies the Power Dynamic:** It highlights that the "neutral" dominant framework is actually a tool of governance (akin to James Scott's concept of **"Legibility"** in *Seeing Like a State*, where states simplify complex social realities to manage them, often causing dysfunction).
  3.  **Refines Remedial Action:** If the problem is merely a gap (Hermeneutical Injustice), the solution is *education*. If the problem is **Hermeneutical Coercion**, the solution is *structural*: gatekeepers must accept claims in non-dominant frameworks or co-create the translation metrics with the group.

  ### Summary
  You are describing a configuration that exceeds standard **Hermeneutical Injustice** (which implies a lack of concepts) and specifies the mechanism of **Contributory Injustice** (which implies a refusal to learn). By labeling it **Hermeneutical Coercion**, you capture the active, procedural force that compels a group to dismantle their own epistemic framework to fit a dominant mold that guarantees their dismissal.
