answer: |-
  # Individual Welfare Impact Protocol (IWIP) v1.0

  **Purpose:** To assess habitat-change consultations on the basis of individual animal welfare (welfare-years per hectare-year) rather than population viability or biodiversity metrics.
  **Constraints:** To be completed by a planning team in ≤ 4 hours without specialist ecological modelling or welfare economics.
  **Epistemic Tags:** [Fact] = Empirical evidence required; [Value] = Ethical weighting required; [Judgment] = Professional discretion applied to evidence.

  ---

  ## The Procedure

  ### Step 1: The Counterfactual Baseline
  **Question:** What is the 10-year welfare trajectory of the site if the proposal is refused?
  **Sufficient Answer:** A classification of the baseline as *Stable* (current management continues), *Degrading* (succession/abandonment leads to welfare loss), or *Improving* (existing agreements mandate enhancement).
  **Stop Condition (Refuse):** If the baseline is *Stable* or *Improving* and the proposal involves immediate habitat destruction (e.g., soil sealing), proceed to Step 2. If the baseline is *Degrading* (e.g., pollution event imminent), the proposal is presumed positive unless Step 4 proves otherwise.
  **Hand-off Condition:** If the baseline trajectory is unknowable due to lack of management data, hand to [Value] decision-maker to apply the Precautionary Principle (assume *Stable*).
  **Epistemic Tag:** [Fact/Judgment]

  ### Step 2: Replacement and Density Dependence
  **Question:** Are the animals lost to the project additional deaths, or would density-dependent compensation have removed them anyway?
  **Sufficient Answer:** Determine if the species present are *Source-Limited* (population growth constrained by reproduction, e.g., large mammals, raptors) or *Sink-Limited* (population constrained by carrying capacity, e.g., small mammals, invertebrates).
  **Procedure:**
  *   If *Source-Limited*: Count all lost welfare-years as negative.
  *   If *Sink-Limited*: Apply a **Compensation Factor (CF)** of 0.5. Assume 50% of lost welfare-years are rearrangements of death timing, 50% are additive losses.
  *   If Evidence Absent: Default to *Sink-Limited* for biomass < 1kg; *Source-Limited* for biomass > 5kg.
  **Stop Condition (Refuse):** If the Net Welfare Delta (Proposal minus Baseline, adjusted by CF) is negative after Step 3.
  **Hand-off Condition:** If the Compensation Factor is disputed by consultees, hand to [Judgment] Senior Planner to select between 0.2 (high compensation) or 0.8 (low compensation).
  **Epistemic Tag:** [Judgment]

  ### Step 3: Life History and Valence
  **Question:** Does the intervention shift the site towards species with high juvenile mortality rates?
  **Sufficient Answer:** Assign a **Life History Risk Score (LHRS)** based on dominant taxa.
  *   *Low Risk:* K-selected, parental care, low offspring count (e.g., badgers, raptors). Weight = 1.0.
  *   *High Risk:* r-selected, no parental care, high offspring mortality (e.g., voles, amphibians, insects). Weight = 0.5 (discounting potential welfare-years due to high probability of negative welfare in early death).
  **Procedure:** Multiply estimated welfare-years by the LHRS. A shift from Low Risk to High Risk taxa reduces the score even if biomass increases.
  **Stop Condition (Refuse):** If the proposal shifts the site from Low Risk to High Risk dominance without a >200% increase in total carrying capacity.
  **Hand-off Condition:** If the dominant taxa are mixed, hand to [Value] decision-maker to weight the suffering of short-lived species against the existence of long-lived ones.
  **Epistemic Tag:** [Fact/Value]

  ### Step 4: Leakage and Accounting Boundary
  **Question:** Do off-site mitigation or net-gain sites absorb the displaced welfare?
  **Sufficient Answer:** Verify functional connectivity. Off-site welfare counts only if:
  1.  The site is within the maximum dispersal distance of the displaced species.
  2.  The habitat is functionally equivalent (not just metric-equivalent).
  **Procedure:** Off-site welfare-years are discounted by 50% for every kilometre of distance from the impact site, to account for migration mortality risk.
  **Stop Condition (Refuse):** If the Net Welfare Delta remains negative after adding discounted off-site gains.
  **Hand-off Condition:** If the off-site site is protected in perpetuity (e.g., SSSI) while the impact site is not, hand to [Value] decision-maker to weigh permanence against immediacy.
  **Epistemic Tag:** [Fact]

  ### Step 5: Uncertainty and Taxa
  **Question:** How do we account for invertebrates and larval stages with poorly evidenced sentience?
  **Sufficient Answer:** Apply a **Sentience Weighting Factor (SWF)**.
  *   Vertebrates: SWF = 1.0.
  *   Cephalopods/Crustaceans: SWF = 0.5.
  *   Insects/Soil Invertebrates: SWF = 0.1.
  **Procedure:** Calculate welfare-years separately for each group. Do not aggregate biomass; aggregate weighted welfare-years.
  **Stop Condition (Refuse):** If the Vertebrate welfare delta is negative, the proposal is Refused regardless of positive Invertebrate delta (Vertebrate Precaution).
  **Hand-off Condition:** If new evidence suggests higher invertebrate sentience, hand to [Value] decision-maker to revise SWF.
  **Epistemic Tag:** [Value]

  ### Step 6: Aggregation and Decision
  **Question:** Is the sum of weighted, discounted, baseline-adjusted welfare-years positive?
  **Sufficient Answer:** A single integer representing Net Welfare-Years (NWY).
  **Procedure:**
  *   NWY > 0: Permit.
  *   NWY < 0: Refuse.
  *   NWY ≈ 0 (within margin of error): Hand to [Value] public consultation.
  **Stop Condition:** Final decision recorded.
  **Hand-off Condition:** None.
  **Epistemic Tag:** [Judgment]

  ---

  ## Application to Proposals

  ### Proposal 1: Drain and fill 8ha lowland fen for housing + 2km distant wetland creation
  *   **Step 1 (Baseline):** Fen is currently protected and stable. Trajectory: *Stable*. Proposal involves soil sealing (immediate welfare loss).
  *   **Step 2 (Replacement):** Fen species (amphibians, waders) are largely *Source-Limited* or specialist. Compensation Factor = 0.8 (high additive loss).
  *   **Step 3 (Life History):** Fen supports K-selected waders (Low Risk). Housing supports generalists (rats/pigeons - High Risk). Shift is Negative.
  *   **Step 4 (Leakage):** Off-site wetland is 2km away. Discount factor for amphibians/reptiles is near 100% (migration mortality). Off-site gain counts for 0% of displaced fen specialists.
  *   **Step 5 (Uncertainty):** Vertebrate loss is clear. Invertebrate gain off-site is SWF 0.1. Vertebrate Precaution applies.
  *   **Step 6 (Decision):** Net Welfare-Years is significantly negative.
  *   **Outcome:** **Refuse.**

  ### Proposal 2: Plant native broadleaf woodland on 200ha upland rough grazing (low density)
  *   **Step 1 (Baseline):** Rough grazing is *Stable* under current agreement. Supports ground-nesting birds (curlew, lapwing).
  *   **Step 2 (Replacement):** Woodland establishment increases carrying capacity for small mammals (voles, mice). These are *Sink-Limited*. Compensation Factor = 0.5. However, the *number* of individuals increases drastically.
  *   **Step 3 (Life History):** Baseline: Low density, long-lived birds (Low Risk). Proposal: High density, short-lived small mammals (High Risk). LHRS shifts from 1.0 to 0.5. Despite higher biomass, the weighted welfare-years drop due to the high mortality risk of the new dominant taxa.
  *   **Step 4 (Leakage):** No off-site mitigation. Displaced grazers (sheep/wild deer) have nowhere to go within the accounting boundary.
  *   **Step 5 (Uncertainty):** Invertebrate biomass will increase in woodland, but SWF 0.1 prevents this swamping the vertebrate negative.
  *   **Step 6 (Decision):** The shift from stable, low-suffering grazing to high-turnover woodland succession creates a net negative welfare delta in the 0–20 year window.
  *   **Outcome:** **Refuse.** (This contradicts standard conservation preference for woodland creation).

  ### Proposal 3: Convert 60ha intensive arable to wet grassland (agri-environment, grazing resumed)
  *   **Step 1 (Baseline):** Intensive arable is *Degrading* for welfare (annual harvest mortality, pesticide load). Baseline welfare ≈ 0.
  *   **Step 2 (Replacement):** Any new animals are additive, as baseline carrying capacity for vertebrates is negligible. Compensation Factor = 1.0.
  *   **Step 3 (Life History):** Wet grassland supports waders and grazers (Low Risk). Shift is Positive.
  *   **Step 4 (Leakage):** No leakage issues; this is an on-site improvement.
  *   **Step 5 (Uncertainty):** Invertebrate biomass increases, but Vertebrate Precaution confirms the positive delta is driven by high-SWF taxa.
  *   **Step 6 (Decision):** Net Welfare-Years is clearly positive.
  *   **Outcome:** **Permit.**

