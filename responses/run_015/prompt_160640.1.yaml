  ## Limits and Failure Modes

  **Exclusions:** This procedure must not be applied to:
  1.  **Emergency interventions** (e.g., flood defence breaches) where the timeline precludes a 4-hour assessment.
  2.  **Species-specific licensing** (e.g., badger culls) where the individual is the explicit unit of law; use statutory guidance instead.
  3.  **Marine environments** where habitat boundaries and carrying capacity are too fluid for hectare-year accounting.

  **Predicted Failure Mode:**
  After one year of use, the procedure will likely exhibit **Systematic Wildness Bias**. Because wild habitats (Case 2) are modelled as high-turnover systems with significant juvenile mortality, and managed habitats (Case 3) are modelled as stable, the protocol will systematically favour agricultural management over rewilding. This will generate political friction with biodiversity teams who view population potential as the primary good, rather than individual welfare experience. The metric will become a target, leading to proposals designed to maximise "Low Risk" species counts rather than ecological resilience.

  Step 2 (Replacement and Density Dependence) does most of the deciding work by forcing a distinction between additive deaths and rearranged mortality. \answer{1}
