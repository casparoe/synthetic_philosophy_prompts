      *Decision:* I will recommend focusing on **(b) The Computational Locus (Reward vs. TD Error vs. Advantage)** and **(a) The Invariance/Scaling Problem**. I will treat (e) as a sub-case of (b). I will advise deprioritizing (c) and (d) (Identity) for now because they are downstream.

