      *   **Evidence to Watch:** Theoretical proofs about invariance, functionalist mappings from neuroscience (RPE = dopamine).
      *   **The "Pseudo-Question" Check:** Is "Does the optimizer feel pain?" a pseudo-question? Yes, if we adopt a functionalist view where the *system's* regulation matters, not the optimizer's internal state.

