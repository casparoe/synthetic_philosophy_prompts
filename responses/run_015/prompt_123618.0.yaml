      *   The friend says: "Policy doesn't see reward, optimizer does."
      *   Counter: In biological systems, the "optimizer" (evolution/brain plasticity) isn't the subject, but the *system* feels pain. However, in RL, the "critic" or "value function" *does* estimate expected return. If valence is TD error (prediction error), the *critic* is the locus, not just the optimizer.
      *   Verdict: The objection highlights that we need to locate the *computational substrate* of valence. It doesn't dissolve the question; it refines it. It suggests we shouldn't look at the policy $\pi(a|s)$, but at the Value function $V(s)$ or Advantage $A(s,a)$.

