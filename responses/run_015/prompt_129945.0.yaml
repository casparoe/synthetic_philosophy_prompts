answer: |-
  You asked me to be plain if your framing wrongly collapses institutional failure into statistical methodology. Here is the plain truth: **Yes, your framing risks that collapse, but only if one assumes the statistical paradigm is the *cause* rather than the *instrument*.**

  The replication crisis is not primarily a failure of calculation; it is a failure of incentive compatibility. Statistical methods (frequentist or Bayesian) are tools used by agents operating within an ecosystem that rewards novelty, significance, and speed over accuracy, robustness, and transparency. To treat the crisis as a choice between statistical paradigms is to treat a symptom (false positives) as the disease (selection pressure against truth).

  However, statistics are not neutral. They provide the specific *mechanisms* by which incentives are exploited. Therefore, the debate is not a total red herring, but it is subordinate to the structural critique. Below is the reconstruction of what the crisis presupposes about practice, followed by an assessment of whether a Bayesian shift resolves or relocates the problem.

  ### 1. What the Replication Crisis Presupposes About Statistical Practice

  The crisis reveals that statistical practice in psychology and medicine is not functioning as an epistemic filter, but as a rhetorical device. This presupposes three things about how statistics are actually used:

  *   **Statistics as Permission, Not Quantification:** Researchers do not use $p$-values or Bayes Factors to update belief; they use them to secure publication. The threshold ($p < 0.05$ or $BF > 3$) is treated as a magic boundary between "publishable truth" and "null noise." This turns statistics into a binary gatekeeping mechanism rather than a continuous measure of evidence.
  *   **The Garden of Forking Paths is Universal:** As Gelman and Loken argued, the problem isn't necessarily malicious $p$-hacking; it is the sheer number of legitimate analytical choices available (covariates, exclusions, transformations). Any framework that allows model specification allows for "specification searching." The crisis presupposes that analysts will, consciously or not, traverse the path that yields the strongest result.
  *   **The Separation of Design and Analysis:** The crisis presupposes that data collection and data analysis are often decoupled. Sample sizes are determined by budget or convention rather than power analysis; analysis plans are determined after seeing the data. This decoupling invalidates the error guarantees of *both* frequentist and Bayesian frameworks.

  ### 2. Assessing the Paradigm Shift: Resolution or Relocation?

  If we switch from frequentist to Bayesian inference without changing the institutional incentives, we do not solve the crisis; we **relocate the degrees of freedom.**

  #### The Relocation of Vulnerability
  Frequentist hacking exploits $\alpha$-inflation through optional stopping and multiple comparisons. Bayesian hacking exploits **prior and model flexibility**.

  *   **Prior Hacking:** A Bayesian analyst can influence the posterior by selecting a prior that concentrates mass on the expected effect. While "objective" priors exist, the choice of prior distribution (e.g., Cauchy vs. Normal, scale parameters) is a researcher degree of freedom. In a high-stakes publication environment, analysts may (consciously or not) select priors that maximize the Bayes Factor in favor of the hypothesis.
  *   **Model Opacity:** Frequentist errors are often algebraic and easier to audit (e.g., did they correct for multiple comparisons?). Bayesian models, especially hierarchical ones using MCMC, are computationally complex. Convergence diagnostics, model specification, and likelihood choices create a "black box" effect where errors or manipulations are harder for reviewers to detect than a misused $t$-test.
  *   **The "Bayesian $p$-value" Trap:** Many researchers adopt Bayesian terminology but retain frequentist incentives. They may report Bayes Factors but interpret them dichotomously (e.g., "substantial evidence" vs. "no evidence"), recreating the same threshold effects that plague NHST.

  #### Where the Paradigm Shift Actually Helps
  To be fair, Bayesian methods are not useless in this context. They offer specific technical advantages that *mitigate* certain aspects of the crisis, provided they are not used as magic bullets:
  *   **Sequential Analysis:** Bayesian methods allow for optional stopping without inflating error rates (since they condition on observed data, not hypothetical sampling distributions). This removes one specific avenue of $p$-hacking.
  *   **Quantifying Evidence for the Null:** Frequentist NHST cannot support the null hypothesis (failure to reject $\neq$ evidence for null). Bayes Factors can distinguish between "insensitive data" and "evidence for no effect," which helps reduce the file-drawer problem regarding null results.
  *   **Shrinkage and Effect Sizes:** Bayesian hierarchical models naturally shrink extreme estimates toward the mean, potentially reducing the "winner's curse" (inflation of effect sizes in small samples) that contributes to replication failure.

  ### 3. The Verdict: Structural Reform Over Statistical Substitution

  The evidence that Bayesian studies do not systematically replicate better than frequentist ones confirms your suspicion: **The framework is not the bottleneck.**

  A Bayesian researcher under pressure to publish in a high-impact journal faces the same career incentives as a frequentist researcher. If the cost of a null result is career stagnation, the Bayesian analyst will find a prior or model specification that yields a positive result. This is known as the **Goodhart's Law of Metrics**: when a measure (whether $p$-value or Bayes Factor) becomes a target, it ceases to be a good measure.

  Therefore, changing paradigms addresses the failure only if accompanied by structural constraints that limit the *application* of the paradigm. The replication crisis is solved not by better math, but by better **process**:

  1.  **Preregistration:** Locking in the analysis plan (including priors and model structure) before data collection prevents specification searching in *both* paradigms.
  2.  **Registered Reports:** Shifting peer review to the design stage decouples publication from the result, removing the incentive to hack for significance.
  3.  **Power and Sample Size:** Large samples reduce the variance that allows hacking to succeed, regardless of the statistical framework.
  4.  **Transparency:** Open data and code allow others to test the sensitivity of the results to different priors or analytical choices.

  ### Conclusion

  The frequentist-versus-Bayesian debate is largely a **distraction** if presented as the primary solution to the replication crisis. It mistakes the *language* of the error for the *cause* of the error.

  The replication crisis presupposes a scientific ecosystem where the reward structure is misaligned with truth-seeking. Statistical methods are merely the interface through which this misalignment is executed. Switching to Bayesian inference without fixing the incentives does not cure the disease; it merely changes the symptoms from $p$-hacking to prior-hacking. The solution lies not in replacing the calculator, but in changing why and how we are allowed to use it.
