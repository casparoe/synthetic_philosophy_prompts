  # ADVERSARIAL COLLABORATION MEMO: PRIORITIZATION OF AI INFRASTRUCTURE WORK
  **To:** ML Infrastructure Team
  **From:** Longtermist & Near-termist Working Group
  **Subject:** Clarifying Disagreements on AI Risk Prioritization

  ## PREAMBLE: DEFINITIONS
  To ensure this document is self-contained, we define the following terms as used below:
  *   **Expected Value (EV):** The sum of all possible outcomes of an action, each weighted by its probability and its moral value.
  *   **Strong Longtermism:** The view that the expected value of our actions is dominated by their effects on the very long-run future (centuries to millennia), primarily because the potential number of future lives is vast.
  *   **Near-termist Skepticism:** The view that effects on the very long-run future are too uncertain to calculate reliably, and priorities should be set by effects we can measure within a foreseeable horizon.
  *   **Cluelessness:** The state of being unable to determine whether an action does more good than harm due to unknown long-term consequences.
  *   **Sign-Stability:** An effect is "sign-stable" if, across a wide range of plausible models of how the future unfolds, the intervention remains positive (or negative) rather than flipping between good and bad.

  ---

  ## PART 1: JOINT CLAIMS
  *The following claims are endorsed by both the Strong Longtermist (SL) and the Near-termist Skeptic (NS). Each is non-vacuous; a reasonable person outside this collaboration could deny them.*

  1.  **The Scale Premise:** The potential number of sentient beings that could exist in the future, should civilization survive and expand, is orders of magnitude larger than the number of beings alive today.
      *   *Note:* Both accept the physical possibility of a vast future, even if they disagree on how much we can influence it.
  2.  **The Existence Prerequisite:** Preventing permanent human extinction is instrumentally necessary for any future goods to be realized. Therefore, reducing extinction risk has *some* positive expected value, regardless of one's prioritization framework.
  3.  **The Instability of Extreme EV:** Standard expected-value reasoning becomes mathematically and intuitively strained when dealing with extremely small probabilities (e.g., 1 in 10^9) attached to extremely large payoffs (e.g., saving 10^20 lives). Both sides agree this requires special handling, though they disagree on the handling.
  4.  **The Cluelessness Baseline:** We currently lack high-confidence causal models that map specific engineering or policy interventions today to specific civilizational states 500 years from now. Both sides admit our predictive power is low.
  5.  **The Trade-off Reality:** Resources spent on reducing long-term existential risk are resources not spent on alleviating current suffering or improving near-term welfare. There is a genuine opportunity cost, not just a theoretical one.

  ---

  ## PART 2: DISAGREEMENTS TABLE
  *For each proposition, we state how each side frames their view. We also classify whether the disagreement is **Substantive** (about how the world is) or **Verbal** (about how to define terms or weigh uncertainty).*

  | Proposition | Strong Longtermist (SL) Wording | Near-termist Skeptic (NS) Wording | Type |
  | :--- | :--- | :--- | :--- |
  | **1. Priority Rule** | Priorities should be set by maximizing expected value over the longest feasible time horizon, even if probabilities are low. | Priorities should be set by maximizing verifiable good over a horizon where feedback loops allow for correction (e.g., 10–50 years). | Substantive |
  | **2. Predictive Power** | While noisy, our models of technological trajectory are robust enough to identify "lever points" where small efforts yield large long-run changes. | Our models of technological trajectory are indistinguishable from noise at time horizons beyond 50 years; acting on them is speculation. | Substantive |
  | **3. Model Uncertainty** | Uncertainty should be integrated into the probability estimate. If the upside is large enough, it outweighs the uncertainty penalty. | Uncertainty should act as a discount factor. If the model is fragile, the expected value should be treated as zero for decision-making. | Verbal / Substantive |
  | **4. Value of Delay** | Slowing down the deployment of dangerous capabilities is valuable because it buys time for safety solutions to mature. | Slowing down deployment is neutral or negative if it merely shifts *who* builds the technology without improving safety standards. | Substantive |
  | **5. Moral Weight** | A life saved in the future counts equally to a life saved today, adjusted only for probability of existence. | A life saved today has higher moral weight because its existence is certain, whereas future lives are contingent on complex chains of events. | Substantive |

  ---

  ## PART 3: CRUXES AND PREDICTIONS
  *This section identifies the specific empirical questions that drive the disagreement. We define two key concepts here:*
  *   ***Basin-Shifting:*** *An intervention moves the future into a different long-run regime (e.g., from "colonizing the stars" to "stagnating on Earth," or from "liberal democracy" to "global totalitarianism").*
  *   ***Directional Washout:*** *The effects of local actions decay over time, and what survives is only a generic tendency (e.g., "technology advances") whose moral sign we cannot recover.*

  ### 3.1 The Historical Dynamics Crux (Basin-Shifting vs. Washout)
  *Question:* Does technological and social history demonstrate that specific interventions can lock in long-run trajectories (Basin-Shifting), or do effects generally wash out over centuries (Directional Washout)?

  | | **Strong Longtermist (SL)** | **Near-termist Skeptic (NS)** |
  | :--- | :--- | :--- |
  | **Current View** | History shows **Basin-Shifting**. Examples: The Agricultural Revolution locked in population density and hierarchy; the Industrial Revolution locked in sustained growth; the Nuclear Age locked in existential risk. We are in a new basin now (AI). | History shows **Directional Washout**. Examples: Empires rise and fall; values shift radically (e.g., divine right of kings to human rights); specific policies from 1800 have negligible traceable impact on 2000 politics. |
  | **Decisive Evidence** | A model showing that specific regulatory or technical choices during "critical periods" (like the invention of nuclear weapons) correlate with measurable trajectory changes 50+ years later. | A model showing that "critical periods" resolve to similar outcomes regardless of specific interventions, or that value systems revert to a mean over centuries. |
  | **Prediction** | We will find that the specific safety architecture chosen for early AGI systems correlates with the stability of the subsequent century. | We will find that safety architecture is overwritten by economic or geopolitical pressures within 10 years, washing out the initial intervention. |

  ### 3.2 The Sign-Stability Ratio (SSR) Crux
  *Definition:* The **Sign-Stability Ratio** is the fraction of interventions longtermists prioritize that have a long-run effect whose sign (positive/negative) is robust across the range of plausible models of the future.
  *   *Example:* If we propose 10 interventions, and in 4 of them we are confident they are good across almost all future scenarios, the SSR is 0.4.

  | | **Strong Longtermist (SL)** | **Near-termist Skeptic (NS)** |
  | :--- | :--- | :--- |
  | **Committed SSR** | **0.30 (30%)**. We believe nearly one-third of our priority interventions are robustly positive regardless of how the future unfolds. | **0.05 (5%)**. We believe almost all long-term interventions are model-dependent; only a tiny fraction are robustly good. |
  | **Flip Condition** | If the SSR is demonstrated to be **below 0.10**, SL would stop recommending these interventions as top priorities and shift to near-term work. | If the SSR is demonstrated to be **above 0.25**, NS would agree to allocate significant resources to longtermist interventions. |

  ### 3.3 Concrete Case Predictions
  *We apply the above frameworks to two specific intervention types.*

  #### Case A: The Delay Case
  *Scenario:* An intervention slows the development of a dangerous AI capability by roughly five years.
  *   **SL Verdict:** **Positive.** Five years allows for more safety research, international coordination, and understanding of risks.
      *   *Flip Condition:* If evidence shows that delay merely allows rival actors with lower safety standards to take the lead ("race dynamics").
      *   *Decisive Evidence:* Historical analysis of technology races (e.g., nuclear, biotech) showing whether slower developers achieved safer outcomes or simply lost market share.
  *   **NS Verdict:** **Neutral/Negative.** Delay without safety guarantees is just a timeline shift. The technology arrives eventually; the risk is deferred, not reduced.
      *   *Flip Condition:* If evidence shows that the "learning curve" for safety is steep and requires calendar time, not just effort.
      *   *Decisive Evidence:* Data showing that safety techniques improve with calendar time independently of deployment pressure.

  #### Case B: The Seeding Case
  *Scenario:* A fixed budget is spent making one particular set of values or institutions (e.g., liberal democracy, specific AI governance norms) more likely to persist into a much larger future civilization.
  *   **SL Verdict:** **Positive.** Values can lock in. If we seed cooperative norms now, they may scale with the civilization.
      *   *Flip Condition:* If evidence shows value systems are highly plastic and revert to local incentives regardless of initial seeding.
      *   *Decisive Evidence:* Longitudinal studies of institutional persistence over 200+ years showing correlation between founding values and later states.
  *   **NS Verdict:** **Negative/Unknowable.** Values evolve unpredictably. Seeding specific values today may look tyrannical or obsolete to future beings.
      *   *Flip Condition:* If evidence shows that early institutional "constitutional moments" have measurable effects on civic outcomes centuries later.
      *   *Decisive Evidence:* Comparative analysis of nations/organizations founded with different charters, controlling for geography and economics, over multi-century spans.

  ---

  ## APPENDIX: ANALYST NOTE
  *Authored by the facilitator of this collaboration.*

  ### 1. Risk of Vacuous Claims
  Two agreed claims in Part 1 are at risk of being "shallow":
  *   **Claim 1 (Scale Premise):** Both sides agree the future *could* be vast. However, the NS effectively treats this probability as zero for decision-making. If the NS acts as if the future size is zero, agreeing it *could* be large is verbally consistent but practically vacuous.
  *   **Claim 4 (Cluelessness Baseline):** Both admit low predictive power. The SL argues we must act despite this; the NS argues we must refrain because of this. Admitting ignorance doesn't force a convergence on action, making this agreement less useful than it appears.

  ### 2. Most Likely Verbal Disagreement
  **Disagreement 3 (Model Uncertainty)** is likely verbal. The SL treats uncertainty as a probability distribution to be integrated; the NS treats uncertainty as a reason to reject the model entirely. This is often a difference in "risk aversion parameters" rather than a factual dispute about the world. If they agreed on a specific discount rate for model uncertainty, the substantive disagreement might vanish.

  ### 3. Mind-Changers
  *   **For the Strong Longtermist:** The single finding that would change their mind is **evidence of Directional Washout.** If historical data showed that no policy intervention from before 1900 has a traceable, sign-stable impact on human welfare today, the premise of "basin-shifting" collapses.
  *   **For the Near-termist Skeptic:** The single finding that would change their mind is **evidence of High Sign-Stability.** If they could see a class of interventions where the long-term outcome is positive in 90% of plausible models (SSR > 0.9), the "cluelessness" objection loses its force.

  ### 4. Framing Failures
  This document frames the problem as an **epistemic** one (what can we know?). It likely fails to capture the **sociological** reality. Even if the SL is right about the math, they may lack the political capital to execute "basin-shifting" interventions. Conversely, even if the NS is right about uncertainty, "near-term" work might inadvertently create long-term lock-in (e.g., deploying unsafe systems to meet near-term demand). The document assumes we can choose between "long-term" and "near-term" work, but in ML infrastructure, they are often the same codebase.

  ### 5. My Own Verdict Conditions
  As the observer, I am not convinced by either side solely on philosophical grounds.
  *   **To side with the Skeptic:** I would need to see a failure mode analysis of a "longtermist" intervention where the attempt to optimize for the future clearly caused immediate harm without securing the promised long-term benefit (a concrete "Pascal's Mugging" failure).
  *   **To side with the Longtermist:** I would need to see a causal chain, validated on shorter time scales (e.g., 10 years), where a specific safety intervention clearly altered a trajectory that would have otherwise led to a negative outcome. I need to see "basin-shifting" work on a decadal scale before I bet on it on a millennial scale.
