  *(Final Plan for "Missing" section)*: Focus on the **Transparency Condition**. Intention is formed by looking at reasons for the *action*. The Billionaire gives reasons for the *intention*. This mismatch makes direct formation impossible. It's not just about "at will," it's about the *direction of fit*.

