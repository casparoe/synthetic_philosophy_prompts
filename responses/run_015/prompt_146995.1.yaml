  *(Self-Correction on Move 1)*: Wait, Dev's point is that the *inability* exists even without nausea. Miriam says no, the inability comes from the certainty caused by nausea. Who is right? If the case is "Intend to clap your hands," and you know you won't get paid unless you intend, but clapping costs nothing... actually, you *could* intend to clap. You might just do it. The Toxin is special because it guarantees you *won't* do it. So Dev is wrong. The nausea (or cost) is essential to generate the certainty of non-performance. Move 1 is Mistaken.

