answer: |-
  The diagnosis is that **Step (2), the Strong Form of Multiple Realizability, is false.**

  Specifically, the claim that realizers "need share no physical property beyond the fact that they occupy $R_M$" is the point where the argument diverges from the successful special sciences (like thermodynamics) and creates the self-undermining result. You should reject (2) while holding fast to (1) Functionalism and (4) Interventionism.

  Here is the argument for why (2) is the failure point, why it looked innocent, what rejecting it costs, and how it steers you between the two absurdities you fear.

  ### 1. Why Step (2) is the Fault Line
  Your argument relies on the intuition that because realizers can be physically diverse (silicon vs. carbon), they share *no* physical properties relevant to the causal work. Step (5) then exploits this to claim there is nothing for a generalization to "track."

  However, your own Thermodynamics counter-example falsifies (2). Consider the kind *Temperature*. Its realizers include mean kinetic energy in a gas, lattice vibration in a solid, and photon distribution in radiation. These are physically diverse. Yet, Thermodynamics is projectible. Why? Because these realizers **do** share a physical property beyond merely "having a temperature." They all share the property of being **systems in thermodynamic equilibrium** (or near enough to sustain statistical regularities). They all share the physical property of having sufficient degrees of freedom to support a statistical distribution.

  If Temperature realizers must share the physical property of "being an equilibrium system," then Step (2) is false for Thermodynamics. Since your argument claims to show that Functionalism fails *because* it treats mental kinds like Thermodynamics, but Thermodynamics succeeds *despite* satisfying the conditions of your argument, the premise that distinguishes them must be the error. The error is the assumption that Multiple Realizability implies *no shared physical structure*.

  ### 2. Why Step (2) Looked Innocent
  Step (2) looks innocent because it conflates **substrate** with **structure**.
  *   **Substrate:** The stuff the system is made of (neurons, silicon, plasma). This is indeed heterogeneous.
  *   **Structure:** The causal architecture or dynamic relations the system sustains (feedback loops, integration, signal propagation).

  We notice the substrate is different, so we infer the physics is unrelated. But for a system to occupy a functional role $R_M$ (e.g., pain), it must physically sustain the causal dynamics defined by $R_M$. It is not physically possible for *just any* system to sustain those dynamics. A rock cannot realize pain not just because it lacks the "role," but because it lacks the **physical capacity** to sustain the requisite causal interactions (e.g., it lacks the physical property of being a control system with negative feedback).

  Therefore, all realizers of $R_M$ *must* share the physical property of "having a physical architecture capable of sustaining $R_M$." This is a physical property specifiable without reference to the mental term "pain," satisfying the condition in (2), yet it is shared by all realizers. Step (2) denies this shared physical constraint exists; the success of Thermodynamics proves it does.

  ### 3. The Cost of Rejecting (2)
  Rejecting (2) means abandoning the "Strong Form" of Multiple Realizability. You must accept **Constrained Multiple Realizability**.
  *   **The Cost:** You lose the ability to say that *anything* whatsoever could be in pain provided it behaves right. You must concede that there are physical preconditions for mentality. An alien or robot must not only act like it is in pain; it must be built of stuff capable of implementing the specific causal architecture (e.g., integrated information processing, homeostatic regulation) that realizes the role.
  *   **The Benefit:** This limitation is actually what saves the special science. It explains *why* psychology is projectible: because all instances of pain share a physical constraint (the architecture), even if the substrate varies. This shared physical constraint is what supports the counterfactuals in Step (4).

  ### 4. Steering Between the Horns
  You worried that rejecting (5) leads to triviality ("everything is in pain"), and that accepting the argument leads to eliminativism ("psychology explains nothing"). Rejecting (2) avoids both.

  **Avoiding "Psychology Explains Nothing":**
  By rejecting (2), you admit that mental realizers share a physical property (the architectural constraint). This provides the "something shared to track" that Step (5) demanded. Psychology projects not over a bare disjunction, but over a natural class of systems defined by their shared capacity to implement specific causal dynamics. This validates Step (4): interventions work because manipulating the architecture changes the output, regardless of the substrate. Thermodynamics works for the same reason: manipulating equilibrium parameters changes pressure, regardless of whether it's a gas or solid.

  **Avoiding "Everything is in Pain":**
  Your fear was that if you make the functional role sufficient for projectibility (rejecting 5), the tolerance in (2a) lets arbitrary systems in. But by rejecting (2), you tighten the realization relation. It is not enough to loosely match the role; the system must physically possess the *capacity* to sustain that role.
  *   A rock does not occupy $R_{pain}$ because it lacks the physical property of "being a homeostatic control system."
  *   A degraded biological system might still occupy $R_{pain}$ if it retains the minimal physical architecture required for the feedback loop, even if the substrate is damaged (accommodating your point 2b).
  *   This draws a non-arbitrary line. The line is drawn by physical possibility, not by semantic stipulation.

  ### 5. Why Not Reject (3) or (5)?
  You mentioned willingness to reject (3) or (5), but they are costlier diagnoses.

  *   **Rejecting (3) Causal Inheritance:** If you claim mental states do *non-derivative* causal work, you violate the causal closure of the physical. You invite dualism or systematic overdetermination. This is a high metaphysical price to pay to save psychology. Rejecting (2) saves psychology while keeping the physical world causally closed (the shared architecture does the work, the mental kind tracks the architecture).
  *   **Rejecting (5) Projectibility Needs Something Shared:** If you reject (5) but keep (2), you claim that bare disjunctions *are* projectible. This leads directly to your triviality fear. If *any* disjunction of realizers supports laws, and (2) says realizers can be *anything*, then any system that can be described as $N_1 \lor N_2 \dots$ counts. Without the constraint from rejecting (2), you have no way to exclude the rock. You need the constraint on realizers (rejecting 2) to make the projectibility of the kind (rejecting 5's conclusion) safe. Since you need to reject (2) anyway to match Thermodynamics, (2) is the primary diagnosis.

  ### Summary
  The argument fails because **Step (2) asserts a degree of heterogeneity that is incompatible with the projectibility of successful special sciences.** Thermodynamics works because temperature realizers share the physical property of equilibrium. Psychology can work because pain realizers share the physical property of implementing a specific causal architecture.

  By rejecting (2), you preserve Functionalism (1) because the mental kind is still defined by the role. You preserve Interventionism (4) because the shared architecture supports counterfactuals. You avoid Eliminativism because the shared architecture grounds laws. You avoid Triviality because the physical constraints of that architecture exclude arbitrary systems. The cost is merely that you cannot attribute mental states to systems that lack the physical capacity to sustain the relevant dynamics—a cost most functionalists should be willing to bear.
