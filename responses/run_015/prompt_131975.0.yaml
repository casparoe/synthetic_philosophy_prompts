prompt: |-
  design a 70-min classroom activity for about 8 grad students on verbal disputes vs real metaphysical disagreement. i want them to actually feel the slide into talking past each other, not just discuss it. set it up as a paired negotiation: each pair gets a hidden 'ontological manual' — one sparse (only concrete people, buildings, contracts) and one abundant (includes corporate persons, probabilities, modal properties). they have to jointly draft three articles for a fictional co-op's legal charter, with rules that force them to write provisions about liability, risk, and membership using existence-language. give them a payoff scheme: if their charter is internally consistent they get 'funding points'; contradictions cost them. they should start arguing about whether 'the co-op really owes damages' or 'there's a 30% chance of failure' as if these are substantive disagreements, then realize mid-draft that they agree on every concrete outcome but keep rewriting each other's clauses. include specific roles (draftsperson, skeptic, mediator), a timeline, and a debrief that maps their arguments onto Carnap's internal/external distinction and Sider's joint-carving criterion — but be honest about which feature of metaontological deflationism the game can't reproduce (probably the linguistic framework-choice aspect) and you'll need to supply that verbally after. also tell me what predictably goes wrong the first run. keep it casual, a typo or two is fine.
