answer: |-
  # Activity: The Co-Op Ontology Game
  **Time:** 70 minuets
  **Students:** 8 Grad Students (4 Pairs)
  **Topic:** Verbal Disputes vs. Metaphysical Disagreement

  ## 1. Setup & Materials (5 mins)
  **The Scenario:** You are founding a "Worker Co-Op." You need to draft a legal charter to get grant funding.
  **The Catch:** The Funding Agency (me) requires specific ontological commitments in the text, but you don't know your partner's requirements.

  **Materials:**
  *   4x **Manual A (Sparse)** envelopes.
  *   4x **Manual B (Abundant)** envelopes.
  *   4x **Charter Drafting Sheets**.
  *   Whiteboard for "Funding Points."

  **Distribution:**
  Pair students up. Hand out envelopes. **DO NOT SHOW YOUR PARTNER.**
  *   **Student 1** gets Manual A.
  *   **Student 2** gets Manual B.

  ## 2. The Manuals (Hidden Info)
  *Print these small and seal them.*

  **Manual A (The Nominalist Constraint):**
  > **Ontological Rule:** Only concrete, spatiotemporal particulars exist.
  > **Drafting Constraint:** You cannot affirm the existence of groups, corporations, or probabilities as entities.
  > **Translation:** Instead of "The Co-Op is liable," you must write "The Members are jointly liable." Instead of "There is a 30% risk," write "We estimate 3 out of 10 trials will fail."
  > **Goal:** Ensure the charter does not reify abstracta.

  **Manual B (The Platonist Constraint):**
  > **Ontological Rule:** Well-defined predicates pick out real entities (including groups, propensities, modal properties).
  > **Drafting Constraint:** You must treat the Co-Op as a singular entity distinct from its members. Probabilities are real properties of the world.
  > **Translation:** Write "The Co-Op is liable" (not members). Write "There is a 30% probability of failure" (as an objective fact).
  > **Goal:** Ensure the charter acknowledges the reality of corporate persons and propensities.

  ## 3. Roles & Timeline
  *Roles rotate to keep engagement high.*

  **Phase 1: The Liability Clause (15 mins)**
  *   **Roles:** Student 1 = **Draftsperson** (holds the pen), Student 2 = **Skeptic** (challenges wording).
  *   **Task:** Draft Article 1: *Liability.* Who pays if things break?
  *   **Constraint:** Must use existence claims (e.g., "The Co-Op exists as a liable party" vs "The Members exist as liable parties").
  *   **Payoff:** +10 Points if the clause is actionable. -5 Points if it contains a category error (e.g., "The building feels pain").

  **Phase 2: The Risk & Membership Clause (15 mins)**
  *   **Roles:** Swap! Student 2 = **Draftsperson**, Student 1 = **Skeptic**.
  *   **Task:** Draft Article 2 & 3: *Risk Assessment* and *Membership Criteria.*
  *   **Constraint:** Must discuss "probability" and "membership status" as existing things.
  *   **Payoff:** +10 Points for consistency with Article 1. -10 Points for internal contradiction.

  **Phase 3: The Mediation (5 mins)**
  *   **Roles:** Both = **Mediators**.
  *   **Task:** Review the whole text. Smooth out contradictions.
  *   **Goal:** Maximize "Funding Points."

  **Phase 4: The Crisis (5 mins)**
  *   **Instructor Intervention:** I will circulate and flag "Ontological Tensions."
  *   *Example:* "This sentence says 'The Co-Op exists' but this one says 'Only humans act.' Which is it?"
  *   Students must fix this *without* showing their manuals.

  ## 4. The Payoff Scheme
  Write this on the board:
  *   **Operational Consistency:** +20 pts (Can we actually follow these rules?)
  *   **Ontological Consistency:** +20 pts (Do the existence claims contradict each other?)
  *   **The "Talk Past" Penalty:** -5 pts every time you rewrite a clause without changing the concrete outcome.

  *Note: The penalty is the trap. They will rewrite clauses thinking they are fixing a substantive disagreement, when they are just translating frameworks.*

  ## 5. Debrief & Mapping (25 mins)
  *This is where the philosophy happens.*

  **Step 1: The Reveal (5 mins)**
  Have pairs reveal their manuals. Most will realize they agreed on *who pays* (the humans) but fought over *who the subject of the sentence was* (The Co-Op vs. The Members).

  **Step 2: Carnap's Internal/External Distinction (10 mins)**
  *   **Ask:** "Were you arguing about how the world is, or how to speak about it?"
  *   **Map:** The dispute felt **External** (metaphysical: "Do corporations *really* exist?"). But functionally, it was **Internal** (pragmatic: "Which linguistic framework helps us draft this charter?").
  *   **Point:** Carnap says ontological disputes are usually just proposals to adopt a linguistic framework. In the game, you were assigned frameworks, which made the dispute feel substantive.

  **Step 3: Sider's Joint-Carving (5 mins)**
  *   **Ask:** "Which manual carved reality at the joints?"
  *   **Map:** Sider argues some structures are more fundamental. Manual A claims 'concrete particular' is joint-carving. Manual B claims 'corporate person' is joint-carving.
  *   **Point:** If metaontological deflationism is true, neither is 'more true' in a deep sense; they are just different tools. But Sider pushes back: structure matters.

  **Step 4: The Limitation (5 mins)**
  *   **Honesty Check:** The game *fails* to reproduce one key feature of deflationism: **Choice.**
  *   **Verbal Supply:** "In the game, I forced the framework on you (Hidden Manual). In real philosophy, we *choose* our frameworks based on utility. Carnap's point isn't that frameworks are secret; it's that they are conventions. You didn't get to vote on the manual, so the disagreement felt more hostile than it would in a free linguistic marketplace."

  ## 6. Predictably Goes Wrong (First Run Notes)
  1.  **Meta-Gaming:** Grad students are paranoid. One pair will guess the trick in min 3 and spend the rest of the time trying to write sentences that satisfy *both* manuals perfectly. This ruins the "feeling" of the dispute. *Fix: Tell them explicitly 'Do not try to satisfy both manuals, satisfy your own.'*
  2.  **Legal Bloat:** They might get bogged down in actual legal theory (LLC vs. Partnership) and ignore the existence-language constraint. *Fix: Circulate early and penalize legal precision that lacks ontological commitment.*
  3.  **Time Creep:** The "Crisis" phase usually eats the Debrief. Keep the Crisis strict. If they haven't revealed the manuals by min 45, the lesson fails.
  4.  **The "Who Cares" Reaction:** Someone will say "This is just semantics." *Response:* "Exactly. That's the deflationist position. Now argue why that answer is unsatisfying."

  ---
  *Instructor Note: Watch for the moment they realize they agree on the money. That's the 'click'. If it doesn't happen, push harder during the Crisis phase.*
