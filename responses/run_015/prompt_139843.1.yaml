answer: |-
  Kripke's argument runs that if names are rigid designators, they pick out the same object in every possible world; thus, if two names pick out the same object actually, they do so in every world, making the identity necessary.

  **1. Frege's Argument and Arbitrariness**
  Frege's opening move diagnoses a puzzle: $a=a$ is trivial, but $a=b$ is informative. If equality were a relation between objects (references), then since $a$ and $b$ refer to the same thing, $a=b$ would express the same relation as $a=a$ (a thing to itself). This fails to explain the cognitive difference. So, equality must concern the signs. But here Frege hits the "arbitrary" objection. If $a=b$ is just a relation between signs, it amounts to saying "I am using these two noises for one thing." That is a stipulation, not a discovery. It renders the astronomical discovery of the morning/evening star identity merely a fact about naming conventions, which is arbitrary. We could have named them differently. Frege needs the identity to reflect knowledge about the *object*, not just the *names*. Sense solves this: the signs designate the same object *via different modes of presentation*. The cognitive value lies in recognizing that two different senses determine the same reference. This preserves the objectivity of the discovery (it's about the star) without collapsing the cognitive difference (the modes of presentation differ).

  **2. Contingency vs. A Priori**
  On the text, you are more right; your friend is right about the historical context. Frege writes that $a=b$ "cannot always be established a priori." He does not explicitly say "contingent." However, in 1892, the Kantian framework largely equated analytic with necessary and synthetic with contingent. Frege likely assumed that if $a=b$ is synthetic (informative), it is contingent. But strictly speaking, the passage argues for cognitive value (epistemology), not modal status (metaphysics). Your friend claims Frege didn't have the distinction in view; this is true. You claim the text doesn't commit him to contingency; this is also true. The text settles on epistemic status ("established a priori"). The modal collapse is an implicit assumption of the era, not an explicit premise here. You win on exegesis; she wins on historical charity.

  **3. The Rising Sun**
  The "rising sun" example is technically an identity over time ("the sun today is the same as the sun yesterday") rather than a strict $a=b$ name identity. However, this doesn't dull the argument's teeth. Frege's point is about *cognitive significance*, not strict syntactic form. Whether via names ("Morning Star") or descriptions ("the sun seen at t1"), the puzzle is how we know two presentations pick out one object. The logical form is identity ($x=y$). If the argument works for descriptions, it motivates sense generally, which then applies to names. The example serves to illustrate the *value* of the discovery, not to define the logical syntax of identity statements.

  **4. The Imba River Case**
  This is where the modal metaphysics matters. You are right; the convention matters more than the actual history. Kripke's necessity relies on *de jure* rigidity (semantic rule), not *de facto* rigidity (accidental stability). If the community's rule is "Imba names whatever flows past this stone," then "Imba" is a non-rigid designator (a disguised description). In a possible world where the river shifts, "Imba" picks out the new river. Therefore, "Imba = [Actual River]" is false in that world. The statement is contingent. Your friend argues that since the rule never fires, it's rigid enough. This confuses actuality with modality. Modal status is determined by truth conditions across *all* possible worlds, governed by semantic rules. If the rule allows reference shifting, the identity is contingent, even if the shift never occurs actually. The argument bottoms out in whether rigidity is a property of the actual extension (friend) or the semantic intension (you). It is the latter.

  **Confidence and Caveat**
  I am 85% confident in this analysis. The claim I am least willing to bet money on is the interpretation of Frege's implicit modal commitments in Point 2; while the text is epistemic, attributing any specific modal view to pre-Kripkean philosophers always risks anachronism.
