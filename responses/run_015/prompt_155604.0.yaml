answer: |-
  ### Part I: Theoretical Calibration & Pushback

  **Brainstorming: Synchronous Subjection, Asynchronous Affectedness, Representational Dormancy**

  *   **Synchronous Subjection:** This applies most strongly to current students and faculty. They are under the disciplinary and academic authority of the school *now*. Exchange students are fully subjected synchronously, even if asynchronously transient. Excluding them creates a "taxation without representation" scenario regarding their daily lived experience.
  *   **Asynchronous Affectedness:** Parents and Alumni fall here. Parents are financially subjected synchronously but affected asynchronously (long-term investment). Alumni are affected asynchronously (reputation/network) but not subjected synchronously. Future students are affected asynchronously only.
  *   **Representational Dormancy:** The co-member's "dormancy objection" is conceptually coherent. It argues that a stake only becomes a *vote* when it is "awake" (active subjection). To wake dormant stakes (alumni/future) is to allow non-subjects to rule subjects, fracturing the "diachronic unity" (the continuity of the institution's present self-governance).
  *   **Interaction:** The referendum is not on a minor policy (e.g., cafeteria hours) but on the *residential character* of the school. This is a constitutional/identity change, not merely administrative. Therefore, asynchronous affectedness carries more weight than in normal governance. However, synchronous subjection must remain the anchor to prevent the "demos" from becoming unmoored from reality.

  **Pushback on the Foundation**

  You asked for plain pushback if the framing is a category mistake or incoherent.

  1.  **Is the "Boundary Problem" a Category Mistake?**
      Strictly speaking, yes. The "boundary problem" (who constitutes the demos) is a problem of *political sovereignty*. A school is not a sovereign state; it is a voluntary association with a fiduciary mission. The ultimate authority lies with the Board/Trustees, not the populace. Framing this as a democratic boundary problem risks conflating *legitimacy* with *authority*.
      *However*, because you are proposing a *binding referendum* that alters the core identity of the institution, you are effectively invoking a constitutional convention rather than standard governance. In that specific context, the democratic analogy holds. **Verdict:** Not a fatal category mistake, provided you frame the referendum as *advisory to the Board but binding on the community's consent*, or acknowledge that the Board delegates this specific boundary decision to the stakeholders. I will proceed assuming the Committee has the delegated authority to set the franchise.

  2.  **Is the "Dormancy Objection" Incoherent?**
      No. It is a robust argument about temporal authority. It posits that the "present" community owns the institution's trajectory. However, it relies on a thin definition of "community." If the school's value is diachronic (passed down), excluding all past/future voices treats the school as a consumable good rather than a trust.
      *Verdict:* The objection is coherent but too rigid for a *constitutional* change. It works for policy, fails for identity.

  **Conclusion:** The foundation is sound enough to build the memo, provided we distinguish between *governing the school* (where dormancy holds) and *defining the school* (where affectedness matters).

  ***

  ### Part II: Formal Memorandum

  **TO:** Interim Governance Committee, Meridian Residential School
  **FROM:** Senior Advisor, Institutional Ethics
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Franchise Rule for Distributed Learning Compact Referendum

  #### 1. Recommendation

  I recommend the Committee approve a **Hybrid Subjection Franchise** for the upcoming binding referendum.

  **The Rule:** Voting eligibility shall be granted to:
  1.  **All Currently Enrolled Students** (including one-semester exchange students).
  2.  **All Full-Time Faculty.**
  3.  **All Parents/Guardians of Currently Enrolled Students.**

  **Exclusions:** Alumni (regardless of graduation date) and Future Students (accepted but not enrolled) shall not hold voting rights.

  **Implementation Timeline:**
  *   **Week 1 (Verification):** Registrar and Finance Office to verify enrollment and tuition status. Digital credentials issued to eligible voters.
  *   **Week 2 (Deliberation):** Mandatory town halls (separate tracks for students, faculty, parents) to ensure the "parental vote" does not silence student testimony.
  *   **Week 3 (Referendum):** 48-hour voting window. Simple majority required for passage.

  #### 2. Reasoning: Synchronous Subjection and Constitutional Identity

  This recommendation rests on a distinction between *policy governance* and *constitutional identity*. The Distributed Learning Compact is not merely a curriculum adjustment; it alters the residential covenant that defines Meridian. Therefore, the franchise must capture those who are both *subjected* to the daily reality of the school and *bound* by its financial and social contract.

  **Why Current Students (Including Exchange)?**
  To exclude exchange students based on transience is to privilege duration over intensity of subjection. An exchange student lives in the dorms and follows the code of conduct for their term; they are fully subjected synchronously. Excluding them creates a class of residents without representation, undermining the moral legitimacy of the vote.

  **Why Parents?**
  We must take seriously the argument that parents are not mere financiers but **co-subjects** of the institutional contract.
  *   **Financial Subjection:** Parents are bound by the tuition contract, which is directly implicated by a shift to distributed learning (value proposition).
  *   **Disciplinary Overlap:** While parents are not subject to detention, they are subject to the school's authority regarding student welfare, housing, and conduct.
  *   **The Error of Separation:** Excluding parents repeats the liberal error of treating "affectedness" and "subjection" as separable. In a boarding context, the family unit is the subject of the contract, not just the child. To deny them a vote on a change that fundamentally alters the service they purchase and the environment their child inhabits is to treat them as external ATMs rather than institutional partners.

  **Why Exclude Alumni and Future Students?**
  Here, I engage directly with the **Dormancy Objection** raised by my co-member. She argues that alumni hold only a "dormant stake" and that activating it fractures the "diachronic unity" of the current body.
  *   **Validation:** I agree that granting alumni voting rights would fracture diachronic unity. It would allow past members to veto the present community's adaptation to new realities. Their stake is reputational, not experiential.
  *   **Refinement:** However, their interests are not ignored. The "dormancy" of their stake is best managed through the *Board of Trustees*, which has a fiduciary duty to the long-term brand and endowment (the alumni interest). The referendum is about *current consent*, not *legacy preservation*. Therefore, the dormancy objection holds for the franchise, but it does not negate the need for alumni advisory consultation outside the vote.

  #### 3. The Strongest Opposing View (Student Autonomy)

  The most compelling argument against this recommendation—specifically regarding the inclusion of parents—is the **Principle of Emerging Autonomy**.

  **The Argument:**
  Meridian serves upper-secondary students (ages 16–19). A core pedagogical goal of the residential program is to cultivate independent agency. By granting parents a binding vote on an academic/living arrangement, we risk infantilizing the student body. If students vote "No" to preserve residential life, but parents vote "Yes" to reduce costs or increase flexibility, the referendum effectively silences the primary subjects of the education. This creates a conflict of interest where the financial stakeholders (parents) override the experiential stakeholders (students).

  **Why I Reject This Objection (With Caveats):**
  While the risk of paternalism is real, it is mitigated by the nature of the *contract*. Since parents bear the legal and financial liability for the Distributed Learning Compact, their consent is ethically requisite. However, to respect student autonomy, the Committee should mandate that the student vote be tallied and published separately. If the student body votes overwhelmingly against the Compact, even if the total franchise passes it, the Administration must treat this as a "confidence warning" requiring further negotiation. This preserves the parental franchise without rendering the student voice numerically invisible.

  #### 4. Conclusion

  The Hybrid Subjection Franchise balances the *synchronous reality* of campus life with the *contractual reality* of the boarding agreement. It respects the dormancy objection by excluding alumni from the direct vote, protecting the present community's right to self-determination. It respects the parental subjection argument by acknowledging that in a boarding context, the "student" is not an isolated atom but part of a family unit under contract.

  This rule ensures the referendum is both democratically legitimate and institutionally stable.
