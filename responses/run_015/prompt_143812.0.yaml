answer: |-
  Here is a principle that attempts to reconcile your verdicts, followed by the stress tests you requested.

  ### The Principle: Accessible Contradiction and Role Fidelity

  You are blameworthy for a past norm if, and only if, your actions violated a moral or epistemic duty that was **discernible within your information environment** OR **intrinsic to the specific authority you claimed.**

  This breaks down into three clauses that explain your asymmetries:

  1.  **The Epistemic Clause (The Roman vs. The Virginian):** Blame requires access. If the moral objection was not articulable within your conceptual framework (Roman), you are excused. If the objection was in the air, voiced by contemporaries, and reachable (Virginian/Abolitionists), you are liable. This explains why the 1790s planter is blameworthy but the Roman is not.
  2.  **The Role Fidelity Clause (Jefferson & The Sugar Researcher):** Some roles carry trans-historical duties that override contemporary norms. A politician's duty is order (time-bound); a scientist's duty is truth (timeless); a Founding Father's duty is the rights they codified (self-contradictory).
      *   **Jefferson:** He claimed the authority of "universal rights." Slavery contradicted his *own* claimed authority, not just a future norm. Hence, he is scored worse than his neighbor.
      *   **Sugar Researcher:** He claimed the authority of "scientific inquiry." Taking lobby money to distort evidence violates the *definition* of science, even if 1960s professional norms permitted it. You blame him because he betrayed the timeless duty of his role, not just the social norm of his era.
  3.  **The Entrenchment Clause (Churchill & Columbus):** Passive acceptance of a norm is treated differently than active defense after contestation.
      *   **Columbus:** He was arrested by his *own* Crown for brutality. The norm was contested *by his superiors* at the time. He is not a "man of his time"; he was a man out of step with his own time's laws.
      *   **Churchill:** You shrug at the empire (passive norm) but blame the Bengal famine/post-war defense (active policy/entrenchment). Once a norm is politically contested (post-1945), defending it becomes an active choice, not a cultural default.

  ### Application to New Cases

  **1. The Mid-Century Scientist (Unethical Data)**
  *   **Verdict:** Blameworthy, but the result may remain.
  *   **Reasoning:** If the experiment was *already* considered unethical at the time (e.g., Nuremberg Code existed, or local IRB norms were forming), they fail the **Epistemic Clause**. If the result is famous, we apply the **Jefferson Compromise**: Keep the utility (the data/statue), but rewrite the plaque to acknowledge the betrayal of **Role Fidelity**. We separate the *discovery* from the *discoverer's integrity*.

  **2. The Person "Ahead of Their Time"**
  *   **Verdict:** They get credit, but not symmetric to blame.
  *   **Reasoning:** Harm is concrete; potential good is speculative until realized. Blame requires a victim; credit requires a beneficiary. A person ahead of their time often suffers social penalty (which counts as credit), but we cannot fully credit them until the moral shift actually occurs. The asymmetry exists because *damage is immediate*, but *moral progress is retrospective*.

  **3. The Living 85-Year-Old (Awful things in 1974, no walk-back)**
  *   **Verdict:** Blameworthy as a contemporary, not historical.
  *   **Reasoning:** They are not a "historical figure" frozen in 1974; they are a living agent who has survived into a time where those views are contested. By refusing to walk it back, they fail the **Entrenchment Clause**. They are actively defending a contested norm *now*, which makes them liable to current judgment, not historical charity.

  **4. The Statue Timing (1890s vs. Generations Later)**
  *   **Verdict:** You are judging the *patron*, not the *subject*.
  *   **Reasoning:** A statue erected in the 1890s (e.g., Confederate monuments) is a political act of intimidation or revisionism *by the 1890s builders*. A statue erected later as historical acknowledgment is an act of education. Your intuition is correct: the statue is a text written by the era that built it. If the era of construction was acting in bad faith (Entrenchment), the statue comes down, regardless of the subject's historical merit.

  ### The Asymmetry: Future Generations and Factory Farming

  You are defensive about future judgment on factory farming because you are currently inside the **Transition Cost**.

  *   **The Principle's View:** Future generations will judge you by the **Epistemic Clause**. If veganism/alternatives are the settled norm in 2100, they will view the moral objection as "accessible" now.
  *   **Your Defense:** You feel the *systemic friction* they will ignore. You know that changing the norm requires economic and social upheaval that looks like "harm" from the inside.
  *   **The Resolution:** You are allowed to be defensive because moral progress is not just about *seeing* the truth, but *paying* for it. However, under the **Entrenchment Clause**, if you actively argue *against* the transition after the alternatives are viable and the harm is known, you lose the defense. You are forgiven for the system you inherited; you are blamed for the system you reinforce once the exit is visible.

  ### Where the Principle Breaks (and What Would Switch Me)

  **1. The "Silent Dissent" Problem**
  My principle relies on dissent being "accessible." But what if the dissent existed but was marginalized to the point of invisibility?
  *   *The Switch:* If you showed me a Roman senator who *did* hear Stoic arguments against slavery (which existed) and explicitly rejected them as "impractical," I would have to blame him as much as the Virginian. If the information was there, the "man of his time" defense collapses.
  *   *Weakness:* This makes blame dependent on historical archival luck. If we find a diary where the Virginian says "I tried to find an abolitionist but couldn't," does he become a Roman? The principle struggles with the *degree* of accessibility.

  **2. The "Role Fidelity" Trap**
  I excuse the Roman because his role (Senator) didn't demand anti-slavery. I blame the Scientist because his role (Researcher) demands truth.
  *   *The Switch:* If you convinced me that *all* roles have a universal duty to minimize harm, regardless of professional codes, the Roman becomes blameworthy. Conversely, if you convinced me that the Scientist was coerced by a system that would have starved his family if he refused the money (duress), the "Role Fidelity" argument weakens. Survival can override professional integrity.
  *   *Weakness:* This creates a class system of morality where intellectuals (who claim truth) are judged harder than laborers (who claim survival). That feels elitist, even if it matches your intuitions about the Sugar Researcher.

  **3. The Jefferson Statues**
  I argue for keeping the statue but rewriting the plaque.
  *   *The Switch:* If the statue's *presence* actively harms living people (e.g., it is used as a rallying point for white supremacists), the **Entrenchment Clause** applies to the *statue itself*, not the man. Even if Jefferson gets a pass on the stone, the stone becomes a contemporary act of entrenchment by those who refuse to move it.
  *   *Weakness:* This conflates the subject with the symbol. It means a historical figure can be "re-condemned" by the actions of their admirers centuries later.

  ### Summary of Your Permission to Blame

  You want to remain allowed to blame people. This principle grants that, but restricts *who* you can blame.

  You cannot blame the **Ignorant** (Roman).
  You can blame the **Hypocrite** (Jefferson).
  You can blame the **Professional Traitor** (Sugar Researcher).
  You can blame the **Entrenched** (Churchill/Columbus).

  Your asymmetry on factory farming is the only place you waver. To resolve it: Admit that future generations *will* blame you, and that they will be right to do so *if* you actively block the transition. But you are allowed to feel defensive about the *cost* of that transition. You are not allowed to deny the moral direction, only to mourn the price of the ticket.
