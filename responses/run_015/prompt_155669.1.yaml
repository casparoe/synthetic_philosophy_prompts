      *   *Name the Phenomenon (Case 1 vs 2):* This is the core. It's not just "known vs. unknown." It's about **Independence** or **Severity**.
      *   *Address Hypothesis A (Access):* This is **Heuristic Novelty**. Did the data guide the construction?
      *   *Address Hypothesis B (Rigidity):* This is **Severity** (or *Riskiness*). Could the theory have easily failed?
      *   *Connect them:* Heuristic Novelty + Severity = Genuine Confirmation.
      *   *Address the Train/Test Split:* It's a proxy for Severity. It simulates independence.

  6.  **Refining the Definitions (The "Carving"):**

      *   *Concept 1: The Problem of Old Evidence.* (Case 3). Formal Bayesian glitch.
      *   *Concept 2: Use-Novelty.* (The naive view). Evidence must be temporally new. (Refuted by Case 2).
