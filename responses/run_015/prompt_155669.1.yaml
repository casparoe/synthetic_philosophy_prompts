      *   **Use-Novelty / Temporal Novelty:** The idea that evidence must be *new* in time to confirm. The user correctly identifies that philosophers generally reject strict temporal novelty (Case 2 shows old evidence *can* confirm).
      *   **Heuristic Novelty / Independence:** This addresses the user's Hypothesis A. Was the theory *constructed* to fit the data, or did it arise independently? This is the distinction between *accommodation* (fitting known data) and *prediction* (fitting unknown data), but refined to *how* the accommodation happened.
      *   **Severity / Riskiness of the Test:** This addresses the user's Hypothesis B. Did the theory *risk* failure? If a model has enough free parameters, it can fit anything (low severity). If a theory has rigid structure (like GR), fitting a specific number is high severity. This aligns with Mayo's Error Statistics or the concept of *degrees of freedom*.

