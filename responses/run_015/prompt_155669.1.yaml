  10. (Self-Correction during drafting): Make sure to clearly separate the *Bayesian Formalism issue* (Case 3) from the *Scientific Method issue* (Case 1 vs 2). They are often conflated but distinct. The user suspects they might be the same; I need to clarify they are different problems that happen to overlap in this context.

      *   *Case 3* is about how to update $P(H)$ when $P(E)=1$.
