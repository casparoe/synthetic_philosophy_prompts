      Let's refine the "Hypothesis A vs B" part. They are deeply linked. If you don't have the data on screen (A), you can't tune parameters to it, which means the fit is riskier (B). So they are causally linked, but conceptually distinct. A is about *causal history of the theory*, B is about *logical structure of the theory*.

