      *   *Does "data on the screen" matter?* Yes, that's Heuristic Novelty.
      *   *Is "probability of fitting" different?* That's Severity. They are two sides of the same coin. If you didn't have the data on screen (Heuristic), you likely didn't tune parameters to it (Severity).
      *   *Does Train/Test capture this?* It captures Severity/Independence, but not the *explanatory* relationship. It measures *predictive accuracy*, which is a proxy for truth but not identical to it.

