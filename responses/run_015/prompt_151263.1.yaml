  1. **Platitude.** Reason: Cognitive science consistently shows recognition memory exceeds recall memory in humans for well-defined tasks; spotting a typo is easier than writing an essay. This holds for S-verification on clean data.
  2. **Substantive.** Reason: Empirical reward modeling shows preference learning converges faster than generative performance in controlled benchmarks, suggesting discriminative tasks are less data-hungry. This supports R-verification but not necessarily G-verification.
  3. **Contentious.** Reason: Absolute certification requires understanding sufficiency conditions, which often demands generative capacity equivalent to production; you cannot verify a proof without understanding the logic. This fails when the verification path is as complex as the generation path.
  4. **False.** Reason: In adversarial settings, a weak judge cannot resolve meta-disputes without independent grounding, allowing sophistry to mimic verification signals; the regress stops only at the judge's capability ceiling. If the judge cannot generate the counter-argument, they cannot verify the claim that no counter-argument exists.

  ### What the debate case actually needs

  The colleagues' conclusion—that a weak judge can oversee a strong system—requires Reading 4. They need the judge to reliably pick the truth in adversarial contexts without independent capability. Reading 1 (our evidence) does not support this. The meta-level regress breaks Reading 4 unless the judge can independently verify meta-claims (G-verification), which contradicts the 'weak judge' premise. If the judge cannot resolve whether a critique is valid without generating a counter-argument, the regress stops only at the judge's capability ceiling. A liar can always claim the honest argument has a hidden flaw; if the judge cannot check that claim without doing the work themselves, the asymmetry collapses.

  Furthermore, the honest-side generation problem implies truth must be compressible into verifiable chunks easier than falsehoods. If truth requires long derivations, the honest debater fails to generate the verifiable object, rendering verification ease irrelevant. The liar can always produce a shorter, plausible falsehood that passes S-verification. Current evidence supports Reading 1 on narrow tasks like math. Debate requires Reading 4 on broad tasks like policy. The gap is not just size but structure: we have evidence for spotting bugs, not for resolving adversarial philosophical regress with a weak oracle. The asymmetry must hold recursively, not just at the leaf nodes. Without evidence that truth is systematically easier to argue than falsehood in long-horizon tasks, the strategic justification is unsupported. We are betting on a recursive asymmetry we have only observed linearly. Specifically, in math, the derivation is the verification. In policy, the consequences are distant. The honest debater must generate a causal chain proving safety. The liar only needs to break one link. If breaking a link (verification) is easier than building it (generation), the liar wins. The colleagues need the reverse: building the truth must be easier than breaking it, or checking the build must be easier than breaking the check. Our data shows checking is easier than building, but not that checking a build is easier than breaking the check. This distinction is fatal for debate oversight.

  ### What I should say instead

  Stop using the sentence as a premise. It functions as a conversation-ender, not a claim. Instead, write: "We assume verification asymmetries hold for domain X under condition Y." Explicitly list the meta-level and generation assumptions as risks. Frame the slogan as a hypothesis to be tested per domain, not a law of nature. This forces the team to specify whether they mean S, R, or G-verification, preventing the evidence from narrow math tasks from subsidizing claims about policy writing. Require that any use of the phrase specifies the verifier (human vs model) and the verification mode (ranking vs certification). It shifts the burden from slogan to empirical claim, forcing the team to acknowledge that without evidence for recursive meta-verification, the debate strategy remains an unproven hypothesis rather than a settled strategic direction. This protects the team from overconfidence in domains where the asymmetry may reverse.
