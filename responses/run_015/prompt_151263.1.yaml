  ### The menu of readings

  1. **Human Spot-Checking:** A human identifies specific local defects in provided text (S-verification) using less time than synthesizing the text (generation). Agent: Human. Task: Narrow, factual, well-defined criteria. 'Easier' means reduced human labor hours per task. This assumes defects are salient and do not require deep context to verify.
  2. **Weak Model Ranking:** A model below frontier capability ranks two complete outputs (R-verification) with higher reliability than it generates a frontier-quality output (generation). Agent: Weak AI. Task: Constrained domains with clear reward signals. 'Easier' means better accuracy at fixed compute budget. This assumes preference spaces are smoother than generation spaces.
  3. **Weak Model Certification:** A weak model certifies a single standalone answer as correct (G-verification) without possessing the capability to produce that answer itself. Agent: Weak AI. Task: Open-ended queries where ground truth is unavailable. 'Easier' means lower capability threshold required for safety assurance. This assumes correctness is detectable without reconstructive simulation.
  4. **Adversarial Recursive Oversight:** A weak judge resolves nested disputes about claims (meta-verification) where the honest agent must construct a full argument tree against a liar. Agent: Weak AI Judge vs Strong AI Debaters. Task: Adversarial, long-horizon planning, policy writing. 'Easier' means lower sample complexity for verifying truth than generating falsehoods in a game tree. This reading implies the asymmetry holds recursively at every node, not just the root, and survives strategic manipulation.

