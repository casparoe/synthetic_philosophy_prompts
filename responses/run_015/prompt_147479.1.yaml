      *   *Invariant:* `SINGLE_OBSERVER` implies that for any time $t$, state $S_L(t)$ and $S_R(t)$ are serializable into a single total order of events.
      *   *Partition:* The cut creates an asynchronous network.
      *   *Unity:* Argues that sub-cortical comms allow 2PC to still complete, or that the invariant is weaker (Eventual Consistency).
      *   *Duality:* Argues that the partition forces a fork. Two leaders elected.
      *   *Agency:* Who holds the lock?
      *   *Memory:* Log divergence.

      *(Self-Correction during drafting)*: Be careful with "SINGLE_OBSERVER". If I define it as "state equivalence," then Duality is trivially true because states diverge. If I define it as "single process ID," then Unity is trivially true. The debate is about *which* technical definition maps to the philosophical concept. I need to highlight this mapping problem.

      *Refined Plan:* Define `SINGLE_OBSERVER` as a *consistency model* requirement, not just state equality. It requires that external observers (behavioral output) cannot distinguish the system from a non-partitioned single node.

      *Wait, constraint:* "Do not assume that consciousness must map onto anything in my framework."
      *Implication:* I must treat the philosophical debate *as if* it were a debate about system architecture, without claiming the system *is* conscious. The debate is about the *label* "Subject" applied to the architecture.

      *Okay, let's write.*

      *   **System Model:** Two nodes $N_L, N_R$.
      *   **Pre-op:** Synchronous replication, Strong Consistency.
