      *   *Revised Q3 (Oversight):* Should the state mandate health/business licensing to operate legally?
      *   *Revised Q4 (Labor):* Should sex workers have access to standard collective bargaining rights?

      *Wait, I need to fit the "Weird Hybrid" in.*
      The Weird Hybrid is: Exchange Decrim + No Collective Bargaining.
      This implies: It's not a crime (Q1: Manage Safety), Buyer not punished (Q2: No), State Licensing? (Maybe/Maybe Not), Labor Rights? (No).
      If I make Q3 about Licensing, Legalization says Yes, Decrim says No. Where does the Hybrid go?
