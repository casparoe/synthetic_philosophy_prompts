      *   *Refining for the Prompt:* The prompt asks for concrete claims about *effects* or *principles*, not just policy mechanics, so students don't just guess the label.
      *   *Revised Q1 (Harm/Validity):* Is the primary goal to eliminate the market or manage its safety?
