prompt: |-
  I'm helping a friend organize a grad-level applied-ethics seminar and we're trying to put together a decision-tree handout on sex-work regulation that doesn't just ask students "Nordic or NZ?" Instead, they should work through concrete claims — like whether licensing protects workers or just creates a two-tier market, whether criminalizing buyers actually reduces demand without pushing supply underground, and whether decriminalization only works if labor rights are already robust — and land on a leaf: the Nordic model, the German/Dutch legalization setup, NZ-style decrim, or maybe an unnamed hybrid. There's one weird branch I want you to inject: a hypothetical regime that fully decriminalizes exchange but explicitly bars collective barganing for workers, which I think sits awkwardly between legalization and decrim and might even be incoherent.

  Please act as an expert in feminist political philosophy and comparative labor policy. Before you draw the tree, do a quick brainstorm of the logical space: map out which answer-combinations are actually defended in the literature, which ones are empty, and flag any pair of leaves your tree can't really separate — for instance, I suspect some Nordic-model supporters and some legalization critics might converge on certain answers about state oversight. Each branch should be phrased as a yes/no or either/or claim that a student could answer without knowing the label, and every leaf should carry one sentence on its most awkward commitment. Keep it all usable for someone with no web access — so no reading lists, no citation requests, just the taxonomy, the scoring logic, and a brief diagnosis of the unoccupied spots. Think carefully, step through the branches slowly, and make sure the weird hybrid case actually gets placed somewhere rather than ignored.
