answer: |-
  ### Part 1: Mapping the Logical Space

  Before constructing the tree, we must identify which quadrants of the policy matrix are occupied, which are empty, and where distinct models ironically converge. This ensures the decision tree doesn't force false distinctions.

  **1. Occupied & Defended Positions**
  *   **Prohibition:** Criminalize all parties. (Defended by moral conservatism/some radical abolitionism).
  *   **Nordic (End-Demand):** Criminalize buyers/third parties; decriminalize sellers. (Defended by radical feminism/human rights advocates).
  *   **Legalization (German/Dutch):** State licensing, mandatory health checks, zoning. (Defended by public health pragmatists/state control proponents).
  *   **Decriminalization (NZ):** Removal of criminal penalties; treated under standard labor/contract law. (Defended by sex-worker led organizations/liberal feminists).
  *   **The "Weird Hybrid" (Theoretical):** Decriminalized exchange but statutorily barred from collective bargaining. (Defended by... almost no one explicitly, but often emerges as a *de facto* status in jurisdictions that tolerate sex work but refuse to classify it as "labor").

  **2. Empty or Incoherent Spots**
  *   **Criminalize Seller, Decriminalize Buyer:** Logically unstable. If the service is illegal to sell, the purchase is inherently illicit. Rarely defended.
  *   **Mandatory Licensing + Full Labor Rights:** Tension exists here. Licensing usually creates a "two-tier" system where licensed workers get rights and unlicensed (migrant/urgent need) workers remain illegal. True parity is hard to sustain with high barriers to entry.
  *   **Full Decrim + Mandatory Health Checks:** Incoherent. If it is decriminalized like any other job, the state cannot mandate medical procedures without violating bodily autonomy standards applied to other workers.

  **3. Convergent Leaves (The Trap)**
  *   **Nordic & Decriminalization:** Both oppose *licensing regimes*. However, Nordic supporters oppose licensing because it legitimizes harm; Decrim supporters oppose it because it creates barriers. The tree must separate them based on the *buyer*, not the license.
  *   **Legalization & Prohibition:** Both rely on heavy state oversight and criminal penalties for non-compliance. They diverge on whether compliance is *possible* for the worker.

  ***

  ### Part 2: The Decision Tree Handout

  **Instructions:** Answer the following four claims based on your ethical assessment of the evidence. Do not worry about which policy model you are selecting; follow your answers to the final leaf.

  **Branch 1: The Goal of the State**
  *Claim:* "The primary ethical obligation of the state is to reduce the overall prevalence of the sex market, even if this limits the autonomy of current workers."
  *   **YES:** Go to Branch 2A.
  *   **NO:** Go to Branch 2B. (You prioritize harm reduction/safety within the existing market).

  **Branch 2A: Liability (If reducing prevalence)**
  *Claim:* "Criminal penalties for selling sex disproportionately harm vulnerable workers and should be removed, even if the market is still deemed harmful."
  *   **YES:** **Leaf 1 (The Nordic Model)**
  *   **NO:** **Leaf 2 (Full Prohibition)**

  **Branch 2B: Oversight (If managing safety)**
  *Claim:* "Mandatory state licensing and health monitoring create a net safety benefit that outweighs the exclusion of workers who cannot meet bureaucratic requirements."
  *   **YES:** **Leaf 3 (Legalization/Licensing)**
  *   **NO:** Go to Branch 3. (You believe licensing creates a dangerous two-tier market).

  **Branch 3: Labor Status (If no licensing)**
  *Claim:* "Sex work is sufficiently distinct from other service labor that standard collective bargaining rights (unions, strike protection) should be restricted or excluded to prevent organized exploitation."
  *   **YES:** **Leaf 4 (The 'Tolerated' Hybrid)**
  *   **NO:** **Leaf 5 (Full Decriminalization)**

  ***

  ### Part 3: The Leaves (Models & Awkward Commitments)

  **Leaf 1: The Nordic Model (End-Demand)**
  *   **Path:** Reduce Market → Protect Seller → (Implicitly Punish Buyer).
  *   **Most Awkward Commitment:** You must accept that criminalizing the client inevitably drives transactions underground, potentially making it harder for the worker to screen for safety.

  **Leaf 2: Full Prohibition**
  *   **Path:** Reduce Market → Punish Seller.
  *   **Most Awkward Commitment:** You must accept that the state's commitment to moral hygiene outweighs the immediate physical safety and economic survival of the individuals currently selling sex.

  **Leaf 3: Legalization (German/Dutch Style)**
  *   **Path:** Manage Safety → Mandatory Licensing.
  *   **Most Awkward Commitment:** You must accept the creation of a permanent underclass of "illegal" workers (often migrants or those with criminal records) who are excluded from the legal protections you claim to support.

  **Leaf 4: The 'Tolerated' Hybrid (Decrim + No Unions)**
  *   **Path:** Manage Safety → No Licensing → Restrict Labor Rights.
  *   **Most Awkward Commitment:** You assert the transaction is not a crime, yet you deny the actors the fundamental civil right to organize, effectively treating them as legal subjects but political non-persons.

  **Leaf 5: Full Decriminalization (NZ Style)**
  *   **Path:** Manage Safety → No Licensing → Full Labor Rights.
  *   **Most Awkward Commitment:** You must accept that treating sex work as standard labor may fail to address unique power imbalances (e.g., emotional labor, stigma) that standard employment law is ill-equipped to handle.

  ***

  ### Part 4: Diagnosis of Unoccupied & Unstable Spots

  **1. The "Decrim + No Unions" Instability (Leaf 4)**
  This is the "Weird Hybrid" you requested. In the literature, this spot is largely unoccupied as a *defended* ideal, yet it frequently exists as a *practical reality* in jurisdictions that want to avoid the optics of "legalizing vice" but lack the will to enforce prohibition.
  *   **Why it's unstable:** If the exchange is not criminal, workers naturally attempt to organize. Barring them specifically requires a *sui generis* legal category that violates general principles of equal protection. It is philosophically incoherent to say "This is not a crime" but "This is not work." It usually collapses into either Leaf 3 (regulate it to control it) or Leaf 5 (admit it's work).

  **2. The Nordic/Decrim Convergence on Licensing**
  Notice that both Leaf 1 (Nordic) and Leaf 5 (Decrim) would answer **NO** to Branch 2B (Licensing).
  *   **The Trap:** A student might think answering "No" to licensing automatically makes them a Decrim supporter.
  *   **The Fix:** Branch 1 separates them. The Nordic model rejects licensing because it wants to shrink the market; Decrim rejects licensing because it wants to normalize the market. If a student wants to shrink the market *and* hates licensing, they land on Leaf 1. If they want to manage safety *and* hate licensing, they proceed to Branch 3.

  **3. The "Ethical Buyer" Void**
  There is no leaf for "Decriminalize everything, but ethically shame buyers without legal penalty." This is a social norm approach rather than a legal regime. While defensible in moral philosophy, it lacks a policy apparatus for the tree. Students drawn to this usually end up at Leaf 5 (Decrim) but add a non-legal caveat about cultural change.

  **4. The Two-Tier Problem (Leaf 3 vs. Leaf 5)**
  The sharpest empirical fight in this tree is at Branch 2B. Legalization proponents argue licensing filters out coercion; Decrim proponents argue licensing filters out *people*. The tree forces the student to choose which risk is more ethically tolerable: the risk of unregulated danger (Leaf 5) or the risk of state-enforced exclusion (Leaf 3).
