      *   *The "Weird Hybrid":* Decriminalized exchange (no criminal penalty) + No Collective Bargaining (labor rights restricted). This sounds like "Independent Contractor" status forced by law, or a "tolerated but not recognized" zone.
      *   *Empty/Unstable Spots:*
          *   Criminalize sellers but not buyers (Rare/Incoherent).
          *   Full decrim but ban unions (The requested hybrid - theoretically possible but politically unstable).
          *   Legalization without health checks (Defeats the purpose of legalization for many proponents).
      *   *Convergences:*
          *   Nordic supporters & Radical Abolitionists agree on "Prostitution is Harmful," but diverge on punishing the seller.
          *   Legalization proponents & Decrim proponents agree on "It's Work," but diverge on State Oversight vs. Labor Law.
      *   *Key Tensions:* Safety vs. Stigma, Autonomy vs. Exploitation, Market Access vs. Market Reduction.

  3.  **Drafting the Branches (Iterative Process):**
