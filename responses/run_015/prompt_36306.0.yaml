          6.  Conclusion (Who is confused?).

      *   *Refining the "Two Minds" nuance:* Make sure to mention that the right hemisphere *is* conscious but differently. It's not a "zombie."
      *   *Refining the "Original" question:* Use Derek Parfit's ideas. Identity isn't binary.
      *   *Refining the Legal:* Focus on *agency* and *responsibility*.
