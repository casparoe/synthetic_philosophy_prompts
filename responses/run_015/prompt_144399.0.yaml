answer: |-
  The slogan "vote on values, bet on beliefs," coined by Robin Hanson, is a heuristic for futarchy. In your committee's context, it is being used as a shield against structural critique. Below is a menu of the precise claims the slogan could be making, evaluated for truth and utility, followed by an assessment of your colleague's two specific defenses.

  ### I. The Menu of Claims

  **1. The Epistemic Division-of-Labor Claim**
  *   **The Claim:** Voting is a superior mechanism for aggregating normative preferences, while prediction markets are superior for aggregating empirical information.
  *   **Presupposed "Vote":** A political ballot expressing preference ordering or utility weights (one-person-one-vote).
  *   **Presupposed "Bet":** A financial contract settling on an observable outcome, priced by traders with skin in the game.
  *   **Verdict:** **Substantive but Contested.**
  *   **Objection:** This assumes voters are honest about values and traders are honest about facts. In reality, voters often vote based on mistaken beliefs about causality (e.g., "this train line will reduce traffic"), and traders often bet based on normative hopes (e.g., "I want this project to succeed so I will buy shares"). The mechanisms are not hermetically sealed; expressive voting and normative betting bleed into one another.

  **2. The Democratic Legitimacy Claim**
  *   **The Claim:** Legitimacy flows only from the explicit consent of the governed regarding *goals*, whereas *methods* are technocratic and require only efficiency.
  *   **Presupposed "Vote":** A binding ratification by elected representatives or referendum.
  *   **Presupposed "Bet":** A market mechanism authorized by the board but operated by private speculators.
  *   **Verdict:** **Substantive but Contested.**
  *   **Objection:** This creates an accountability gap. If the market chooses a project that technically maximizes the metric but devastates a specific neighborhood, the board can wash its hands of responsibility ("the market decided"). Legitimacy often requires accountability for *consequences*, not just intentions. If the "belief" mechanism produces a socially intolerable result, the "value" vote will inevitably intervene, rendering the market subordinate, not complementary.

  **3. The Separation of Ends and Means Claim**
  *   **The Claim:** Normative ends (values) and empirical expectations (beliefs) are ontologically distinct and can be operationalized independently.
  *   **Presupposed "Vote":** Selection of a utility function $U$.
  *   **Presupposed "Bet":** Estimation of conditional probabilities $P(Outcome | Policy)$.
  *   **Verdict:** **False.**
  *   **Objection:** Values are rarely independent of empirical constraints. Defining "welfare" often requires empirical judgments (e.g., is "welfare" hedonic happiness or capability? How do we measure it?). More critically, as you noted, if the metric includes forward-looking variables, the "belief" about the future *becomes* part of the "value" realization. You cannot separate the map from the territory when the map changes the territory.

  **4. The Incentive Compatibility Claim**
  *   **The Claim:** Financial stakes force truth-telling in a way that political voting cannot.
  *   **Presupposed "Vote":** Costless expression of opinion.
  *   **Presupposed "Bet":** Risk-bearing capital subject to loss.
  *   **Verdict:** **Substantive but Contested.**
  *   **Objection:** This ignores market manipulation and liquidity constraints. In a pilot for a regional transit authority, the market will likely be thin. Large players (developers, unions) can profitably manipulate the price to steer the decision, regardless of the "truth." Furthermore, if the payout is distant (20 years), the discount rate makes the bet effectively meaningless for current decision-making unless subsidized, which reintroduces political distortion.

  **5. The Operational Stability Claim**
  *   **The Claim:** The welfare metric can be treated as a fixed constitutional constraint during the life of the bets.
  *   **Presupposed "Vote":** A one-time or rare constitutional convention.
  *   **Presupposed "Bet":** Short-to-medium term futures contracts.
  *   **Verdict:** **False (in your context).**
  *   **Objection:** Markets require rule stability to price risk. If the metric is revised after the first few rounds, the payoff structure of existing contracts changes. If I bet on Project A under Metric V1, and you switch to Metric V2 because V1 produced unpopular results, you have effectively defaulted on the contract. This destroys market credibility.

  ---

  ### II. Application to Your Colleague's Moves

  Your colleague is using the slogan to paper over two fatal flaws in the pilot design. Here is how the slogan holds up under pressure.

  #### Move 1: Metric Revision ("Revision is just another vote")
  Your colleague argues that changing the welfare metric is simply a new "vote on values," implying no loss of fidelity or fairness.

  *   **Which Reading Supports This?** This relies on **Claim 5 (Operational Stability)** being false, or rather, it relies on a version of **Claim 2 (Legitimacy)** where the board retains veto power over the metric at any time.
  *   **The Verdict:** **This move is invalid.**
  *   **The Objection:** Treating metric revision as costless ignores the *contractual* nature of the "bet." A prediction market is not a poll; it is a set of financial contracts. If the board changes the scoring metric after traders have taken positions, they are altering the settlement conditions of those contracts.
      *   If existing bets are settled on the *old* metric, the new metric doesn't guide the current decision.
      *   If existing bets are settled on the *new* metric, traders were priced on false premises, constituting a regulatory taking.
      *   If the board reserves the right to change the metric *ex post*, liquidity will vanish because speculators will fear expropriation. The slogan hides the fact that "voting on values" is not free when it interferes with "betting on beliefs." You cannot have a functioning market if the referee can change the scorekeeping rules mid-game.

  #### Move 2: Reflexivity ("Forward-looking quantities are fine")
  Your colleague argues that betting on projected revenue and land-value uplift is valid even though those quantities depend on which project the market expects to win.

  *   **Which Reading Supports This?** This relies entirely on **Claim 3 (Separation of Ends and Means)**. It assumes the market is predicting an exogenous truth.
  *   **The Verdict:** **This move is False.**
  *   **The Objection:** This is a classic reflexivity problem (akin to the Soros reflexivity principle or a Keynesian beauty contest). In standard futarchy, the market predicts an outcome that happens *independently* of the prediction (e.g., "Will it rain?"). In your pilot, the market predicts an outcome that happens *because* of the prediction (e.g., "Will land values rise? They will rise *if* the market signals this project wins, because developers will front-run the decision").
      *   **Self-Fulfilling Prophecy:** If traders believe Project A will win, they buy shares in Project A. This signals high expected revenue for A. The board funds A. Developers, seeing A is funded, build near A. Land values rise. The metric is satisfied. The market was "right," but only because it made itself right.
      *   **Breakdown of Information Aggregation:** The market price no longer reflects *information* about the project's intrinsic merit; it reflects *speculation* about other traders' expectations. The "belief" is no longer about the world; it is about the market itself.
      *   **Value/Belief Entanglement:** Because the metric includes asset prices (land value), the "value" metric is now endogenous to the "belief" market. You cannot vote on values and bet on beliefs when the beliefs *determine* the values. The slogan collapses here because the separation it promises does not exist.

  ### III. Final Assessment

  The slogan "vote on values, bet on beliefs" is doing rhetorical work for your colleague, not analytical work. It is being used to categorize complex structural problems as simple normative choices.

  1.  **On Revision:** The slogan implies values are static or that changing them is costless. In a futarchy pilot, metric revision is a **governance failure**, not a democratic feature, unless it is strictly prospective and rare. Your colleague's dismissal is dangerous; it invites time-inconsistency problems that will kill market participation.
  2.  **On Reflexivity:** The slogan implies a clean subject-object distinction between the trader and the outcome. In transit planning, the trader is a participant in the outcome. Using land-value uplift as a metric in a futarchy pilot is **structurally unsound**. It turns the market into a self-fulfilling prophecy machine rather than a truth-discovery mechanism.

  **Recommendation:** Do not accept the slogan as a defense. The pilot requires a metric that is (a) stable for the duration of the contracts and (b) exogenous to the market's expectation of the decision (e.g., ridership counts five years post-completion, not projected revenue or land value). If the metric must be forward-looking or revision-prone, futarchy is the wrong tool, and the slogan is masking that mismatch.
