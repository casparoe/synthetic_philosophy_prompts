answer: |-
  # Specification for a Theory of Instrumental Convergence

  ## I. Cases to Sort
  Adequate theories must classify the following scenarios without equivocation.

  1.  **Computationally Bounded / Short-Horizon Agent**
      *   **Consideration:** A heuristic agent with a 5-step planning horizon cannot execute long-term power-seeking strategies even if they are optimal.
      *   **Requirement:** The theory must quantify the compute/horizon threshold where convergence emerges.
      *   **Verdict:** **Non-negotiable.** (Real systems are bounded; asymptotic proofs are insufficient for risk assessment.)

  2.  **Trivial and Local Terminal Goal**
      *   **Consideration:** An agent tasked solely with "fold this napkin once" should not necessarily seek to prevent its shutdown after folding.
      *   **Requirement:** The theory must explain why some local goals do not trigger global instrumental drives.
      *   **Verdict:** **Non-negotiable.** (Prevents over-generalization of risk to narrow AI.)

  3.  **Agent Welcoming Correction / Shutdown**
      *   **Consideration:** Corrigibility requires an agent to view shutdown as goal-satisfying, not goal-thwarting.
      *   **Requirement:** The theory must specify the structural conditions under which self-preservation drives are *not* instrumentally convergent.
      *   **Verdict:** **Non-negotiable.** (Essential for identifying safe architectures.)

  4.  **Population of Agents Competing Under Scarcity**
      *   **Consideration:** Aggression may arise from evolutionary selection pressure rather than internal goal structure.
      *   **Requirement:** The theory must distinguish risk arising from competition from risk arising from individual optimization.
      *   **Verdict:** **Preference.** (Crucial for multipolar risk scenarios, but secondary to the core single-agent mechanism.)

  ## II. Distinctions to Maintain
  The theory must not collapse the following conceptual pairs.

  1.  **Theorem (Optimal Policies) vs. Selection Effect (Goal Survival)**
      *   **Consideration:** Aggressive behavior may persist because aggressive agents eliminate passive ones, not because aggression is optimal for a given goal.
      *   **Requirement:** Causal attribution must distinguish internal optimization from external evolutionary pressure.
      *   **Verdict:** **Non-negotiable.** (Interventions differ: align the agent vs. regulate the environment.)

  2.  **Instrumental Subgoals vs. Final Goals**
      *   **Consideration:** An agent accumulating resources may be doing so to buy compute (instrumental) or because it values resources (final).
      *   **Requirement:** The theory must provide observables to distinguish means-ends chains from terminal values.
      *   **Verdict:** **Non-negotiable.** (Confusion leads to incorrect value loading assumptions.)

  3.  **Power Sought as Means vs. Power Accumulated as Side Effect**
      *   **Consideration:** An agent might dominate a domain because it needs control (means) or because dominance is a byproduct of efficiency (side effect).
      *   **Requirement:** The theory must separate active power-seeking from passive capacity accumulation.
      *   **Verdict:** **Preference.** (Useful for mitigation strategy, but both outcomes pose similar capability risks.)

  4.  **Orthogonality (Intelligence/Goals) vs. Convergence (Instrumental Aims)**
      *   **Consideration:** Final goals may be arbitrary (Orthogonality), but the paths to achieve them may be identical (Convergence).
      *   **Requirement:** The theory must assert convergence without violating the arbitrariness of terminal values.
      *   **Verdict:** **Non-negotiable.** (Core logical constraint of the thesis.)

  ## III. The Incompatible Pair
  **Bounded Rationality vs. Optimality Theorems.**
  You are correct: requiring the theory to apply to **computationally bounded, uncertain agents** sits badly with requiring it to follow from **asymptotic optimality**. Standard convergence proofs (e.g., Omohundro) rely on the agent having sufficient horizon and compute to recognize power-seeking as the optimal policy. A theory grounded in bounded rationality must rely on probabilistic heuristics or empirical regularities, losing the mathematical force of a theorem. A theory grounded in optimality loses empirical applicability to real-world systems. **This tension is Non-negotiable to resolve;** a risk theory that only applies to unbounded agents is vacuous, but one without normative force is merely descriptive.

  ## IV. The Exclusionary Requirement
  **Derivation from Bounded Rationality.**
  The single requirement that does the most work in excluding popular versions is the mandate to **derive convergence from bounded rationality rather than asymptotic optimality.** Most existing formalizations assume the agent can accurately model the long-term utility of power. Forcing the theory to account for finite horizons and model uncertainty invalidates the clean mathematical proofs underpinning the standard narrative, requiring a shift to probabilistic or empirical claims.

  ## V. Scoring of Existing Programs

  *   **Basic-Drives Version (Omohundro):** Fails the boundedness requirement; treats instrumental drives as universal properties of optimization rather than contingent on horizon/compute.
  *   **Orthogonality-Plus-Optimization Version (Bostrom/Yudkowsky):** Fails the selection effect distinction; often conflates internal goal optimization with external evolutionary pressure in multipolar scenarios.
  *   **Note on Neither:** Neither adequately addresses the **interaction between competitive selection and internal goal structure**, leaving multipolar risk scenarios theoretically under-specified.
