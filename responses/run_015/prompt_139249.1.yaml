answer: |-
  TO: Language and Safety Working Group
  FROM: Senior Engineer
  DATE: October 24, 2023
  SUBJECT: Recommendation on Clinical Handoff Screen Copy

  **Recommendation**
  I recommend we proceed with **Option 2: Ship the Clinical Handoff screen with modified wording rules.** We should retain the PDF generation and billing code functionality but remove explicit diagnostic claims ("medical condition," "like diabetes") from the user-facing copy.

  **Timeline**
  *   **Copy Revision:** Draft changes by this Friday.
  *   **Legal/Compliance Review:** Monday morning.
  *   **Ship:** Next Tuesday's release window.

  **Context**
  Product proposes a screen summarizing user symptoms (severity band, frequency) with a prompt to generate a PDF billing code for doctors. Clinicians support this as destigmatizing and essential for insurance reimbursement. Our advisor opposes it, citing Thomas Szasz's argument that mental illness is a metaphor for "problems in living," not lesion-based disease, and that we are automating coercive diagnostic labeling. Additionally, our Terms of Service (ToS) state we are not a medical device and do not diagnose.

  **The Counter-Argument (Steelman for Option 1)**
  To ensure we vet the risk properly, here is the strongest argument for **Option 1 (Ship as specced)**, which I anticipate the CFO and Clinical leads will advocate for:

  *   **Utility Over Philosophy:** Szasz's objections are theoretical; unpaid medical bills are concrete. If we water down the language, users may not feel validated enough to seek care, or doctors may reject the PDF. The "like diabetes" analogy is a necessary heuristic to help users understand severity quickly.
  *   **Stigma Reduction:** Framing distress as a "medical condition" actively combats the idea that users are morally flawed or lazy. Softening this to "patterns" or "symptoms" without the disease frame returns the burden of proof to the user, increasing dropout rates.
  *   **Revenue & Access:** The billing code is the product's primary value add for low-income users. If the accompanying copy doesn't strongly justify the code, insurance claims may be denied. We should prioritize tangible care access over semantic precision.

  **Analysis of Key Questions**
  To reach the recommendation above, I have evaluated the four specific uncertainties raised during discovery:

  1.  **"Disorder/Condition" vs. "Illness":** This is not cosmetic. "Illness" implies a confirmed pathological state. "Condition" or "Symptoms consistent with" describes an observation. Given our ToS explicitly disclaims diagnosis, using "Illness" creates a direct legal contradiction. "Condition" is safer but still risky; "Symptoms" is safest. I recommend "Symptoms consistent with [DSM-5 criteria]" rather than "You have [Condition]."
  2.  **The "Like Diabetes" Line:** This is doing too much work. It claims a biological etiology (lesions/pathology) that we cannot verify and that contradicts the Szaszian view (and current scientific ambiguity on some mental health etiologies). It functions as a medical claim without medical device clearance. It must be removed to avoid regulatory risk.
  3.  **Szasz's Coercion Worry:** This touches us directly. We are not committing users, but we are generating a document that enters insurance, legal, and disability systems. Once a diagnostic code is on paper, it takes on a life of its own beyond our app. We are effectively gatekeeping the transition from "distress" to "billable event." We have a safety obligation to ensure the user understands this is a *self-reported summary*, not a clinical diagnosis, before they hand it to a third party.
  4.  **Practically True vs. Descriptively False:** This is the core tension. The medical model is *practically* true (it unlocks treatment/insurance) but may be *descriptively* false (mental distress isn't always a lesion-based disease). As a safety group, we must align our copy with descriptive accuracy to avoid liability. We can enable the practical utility (the billing code) without making the descriptive claim (the diagnosis) in our UI.

  **Implementation Plan**
  We will ship the feature with the following copy constraints:
  *   **Remove:** "This is a medical condition, like diabetes."
  *   **Replace:** "Your anxiety symptoms have been above threshold..." with "Your self-reported symptoms align with..."
  *   **Add:** A disclaimer on the PDF: "This summary is based on user self-reporting and is not a clinical diagnosis."
  *   **Retain:** The billing code generation, as this is the practical utility clinicians identified.

  **Assumptions**
  *   I am assuming Legal can turn around the revised copy disclaimer within 24 hours.
  *   I am assuming the billing codes provided are valid for "self-report" scenarios under current insurance guidelines (if insurance requires a doctor's diagnosis regardless of our PDF, the feature's utility is lower than claimed, which strengthens the case for caution).
  *   I am assuming the marketing team can align the "people aren't broken" campaign with this feature by framing it as "understanding your patterns" rather than "fixing your illness."

  **Conclusion**
  Option 2 balances the clinicians' need for user access to care with the safety team's obligation to avoid unauthorized medical claims. It respects the user's agency by clarifying that the data is self-reported, mitigating the Szaszian coercion risk while preserving the financial utility of the billing code.

  Please review by EOD Monday so we can finalize the build.
