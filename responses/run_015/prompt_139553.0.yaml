answer: |-
  You have identified a gap in the standard taxonomy of defeaters. Your intuition is correct: this is not standard higher-order evidence (which typically targets the *processor*), nor is it a standard undercutting defeater (which typically targets the *connection* between a specific piece of evidence and the conclusion). You are describing a structural defect in the *evidence set itself* relative to the world.

  Here is the distinction carved to your specifications, a proposed label, and the answers to your three boundary questions.

  ### The Distinction: Local Support vs. Sampling Security

  To use this in print, distinguish between **Local Evidential Support** and **Sampling Security**.

  *   **Local Evidential Support** is the probabilistic weight a specific datum $e$ lends to proposition $p$ *conditional on the assumption that $e$ is a representative sample of the available evidence*. In your cases, this remains unchanged. The letter still says what it says; the testimony is still coherent.
  *   **Sampling Security** is the justification for assuming that the set of evidence currently possessed ($E_{possessed}$) is sufficiently representative of the total available evidence ($E_{total}$) to license a high-credence inference.

  The phenomenon you are encountering is the collapse of Sampling Security due to **Content-Correlated Selection**. This occurs when the mechanism that determines which evidence becomes available to the agent is correlated with the truth-value of the proposition in question.

  ### Proposed Label: Selection Defeat

  While statisticians call this "selection bias," in an epistemic normative context, I recommend the term **Selection Defeat**.

  It is distinct from *Undercutting Defeat* because it does not sever the link between $e$ and $p$; it severs the link between $E_{possessed}$ and $E_{total}$. It is distinct from standard *Higher-Order Evidence* because it concerns the *provenance of the input* rather than the *reliability of the cognitive processor*.

  ### Answers to Your Three Boundary Questions

  **1. Does the phenomenon require knowing the direction of the bias?**
  No, but the rational response differs.
  *   **Known Direction (Cases 1 & 2):** If you know the silence is correlated with guilt (or the filtering with a specific view), you have a **Directional Selection Defeater**. This mandates a specific downward adjustment of credence in $p$.
  *   **Unknown Direction:** If you know only that the sample is non-random (e.g., "some letters are missing, we don't know why"), you have a **Non-Specific Selection Defeater**. This does not mandate believing $\neg p$, but it mandates a reduction in *confidence* (an increase in the variance of your credence distribution). You must move from a sharp peak to a flatter curve. The mandate is to acknowledge **Epistemic Entropy**.

  **2. Does the rational mandate land on first-order credence or a higher-order attitude?**
  It lands on **first-order credence**.
  While the *information* causing the defeat is higher-order (information about the evidence), the *impact* is on the probability of $p$. If $P(p | E_{possessed})$ was high only because we assumed $E_{possessed} \approx E_{total}$, and we now know $E_{possessed} \neq E_{total}$, then $P(p | E_{possessed} + \text{Selection Info})$ is objectively lower. You are not merely required to believe "my evidence is incomplete"; you are required to believe "$p$ is less likely than I thought."

  **3. Why do the negative (Cases 1 & 2) and positive (Case 3) cases come apart?**
  This is the crucial carve. The asymmetry turns on **Content-Correlation** vs. **Quality-Correlation**.
  *   **Cases 1 & 2 (Content-Correlated):** The filtering mechanism is correlated with the *content* of the evidence regarding $p$ (e.g., guilty parties stay silent). This removes specific counter-evidence. This generates Selection Defeat.
  *   **Case 3 (Quality-Correlated):** The filtering mechanism is correlated with the *methodological soundness* of the evidence, not its verdict on $p$. Removing unsound arguments does not remove *counter-evidence*; it removes *noise*. Since unsound arguments should not contribute to credence anyway, filtering them out does not inflate the weight of the remaining evidence. It merely ensures that the Local Support is not contaminated. Therefore, no *bonus* confidence is warranted, but no *penalty* is incurred either.

  ### For Print: Paragraph and Footnote

  **Paragraph:**
  "We must distinguish between local evidential support and sampling security. A piece of evidence may retain its local support for a proposition even when the agent acquires a **selection defeater**—that is, evidence that the process generating their evidence set is correlated with the truth-value of the proposition. Unlike standard undercutting defeaters, which attack the inferential link between evidence and conclusion, selection defeaters attack the representativeness of the evidence set relative to the total available evidence. Unlike standard higher-order evidence, which typically targets the agent's cognitive processing, selection defeaters target the provenance of the input itself. In such cases, rationality requires a reduction in first-order credence, not merely a change in attitude toward one's own justification, because the probability of the proposition conditional on a biased sample is distinct from the probability conditional on a representative one."

  **Footnote:**
  "This configuration is distinct from the requirement of total evidence (which states the norm rather than the violation) and from statistical biased sampling (which concerns estimator properties). It is a species of undercutting defeat, but specifically targets the assumption that $E_{possessed} \approx E_{total}$. See [Insert Reference to Selection Effects in Phil. of Science, e.g., Mayo 1996 or Howson & Urbach 1989, adapted to individual epistemology]. The asymmetry between content-correlated filtering (which defeats) and quality-correlated filtering (which does not boost) rests on the fact that the latter removes noise rather than signal."

  ### Why this works for your context
  This carving allows you to acknowledge that your reasoning from the *testimony* was sound (preserving your competence) while locating the error in the *structural relationship* between your testimony and the world (preserving the norm). It gives you the vocabulary to explain why you must lower your confidence without admitting you misread the letters or misunderstood the witnesses.
