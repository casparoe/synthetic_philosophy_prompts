answer: |-
  **Setup**
  Elena, a senior actuary, must assign a probability to the proposition that her client, Marcus, will survive to age 90. Marcus possesses two well-documented properties: he is a lifelong resident of a specific Sardinian "Blue Zone" village, and he is a senior partner at a high-frequency trading firm. Ordinary demographic data shows that 50% of male villagers reach 90, while only 5% of male trading partners do. Both classes are *robust* under your criterion: sharpening "villager" to "villager aged 40–50" or "partner" to "partner working >60 hours" leaves these frequencies stable within 1%. However, the intersection class—villagers who are also trading partners—contains only three historical instances, making its frequency (1 out of 3, or 33%) wildly volatile under sharpening (e.g., adding "non-smoker" drops it to 0%). Elena has all ordinary evidence; she cannot conjure more historical instances to stabilize the intersection, nor does she have access to exotic genetic causal models.

  **(a) The Deliverables of Competing Rules**
  The **Narrowest-Class Rule** demands the intersection (Villager & Partner). It delivers **33%**, but this number is epistemically brittle; it fails the robustness test, meaning any trivial description change crashes the frequency. The **Widest-Available-Class Rule** (ignoring specific properties for stability) defaults to "Adult Males in Developed Nations," delivering **10%**, sacrificing relevant evidence for sample size. The **Maximum-Entropy/Indifference Approach**, treating the two robust frequencies (50% and 5%) as constraints without assuming known correlation, typically averages the log-odds or assumes independence; under a simple indifference between the two robust predictors, it yields **27.5%**, while under an independence assumption, it collapses to **2.5%**. Regardless of the specific MaxEnt formulation, it produces a number distinct from the robust classes, highlighting the arbitrariness of the combination rule.

  **(b) The Engine of the Problem**
  The feature doing the real work is **conjunctive sparsity amidst parental density**. The world provides abundant data for property *A* and property *B* individually, but fails to provide a stable frequency for *A & B*, despite *A & B* being a coherent, non-gerrymandered description. If you delete this feature (i.e., if the intersection class were large enough to be robust), the Narrowest-Class Rule would swallow the others, and the problem vanishes. If you delete the robustness of the parent classes (e.g., if the Village rate swung wildly with age), we would discard them as admissible, and the tension dissolves. The problem persists only because the world is lumpy: properties cluster densely in some dimensions and sparsely in others, creating "data deserts" at specific intersections that ordinary evidence cannot irrigate.

  **(c) The "Incomplete Information" Objection**
  A defender of the epistemic view will argue: "This is just hidden causal structure. The true probability is determined by the physiological interaction between the village diet and the trading stress. If Elena had the *complete* causal model (the 'God's eye' view), she wouldn't need frequencies; she would calculate the propensity directly. The reference class problem is merely a placeholder for missing causal data." They will claim that once we move from statistical frequencies to causal mechanisms, the single-case probability becomes unique and determinate, rendering the conflict illusory.

  **Verdict**
  I reject the objection. The case shows the problem is **more than epistemic**. Even with a complete causal model, if the causal mechanisms are probabilistic (indeterministic), we still require frequencies to calibrate the propensity values for the specific interaction of causes. If the world does not contain enough instances of that specific causal intersection to establish a stable frequency, there is *no fact of the matter* about the single-case probability other than the conflicting robust frequencies. The gap is not in Elena's mind; it is in the ontology of the finite world. Probability is not just hidden information; it is a relational property that breaks down when the relata (the reference class) cannot be stabilized.
