      For decades, political theory has relied upon introspective thought experiments rather than controlled observation. This study treats the entitlement framework proposed by Nozick not as a normative argument, but as a reproducible laboratory phenomenon. We report the first empirical measurement of the instability inherent in patterned distributions of justice when subjected to voluntary transfer.

      **Methods**
