l scientific diction, and do not include any bibliography, citations, or references to real-world scholars beyond Nozick and Chamberlain themselves, whose roles should be described conceptually rather than biographically. Do not quote any passage from Nozick’s work; if you refer to his distinctions, paraphrase them in your own technical vocabulary.
