prompt: |-
  hey — im in 11th grade and I run this tiny lunchtime philosophy club, and we got completely nerd-sniped by Fitch's paradox of knowability; everyone keeps accusing eachother of being secret antirealists and nobody can explain what they actually think. Could you build us a decision tree we can use as a quiz — 7 or 8 questions, each a choice on a concrete case, starting from "I still want to say every truth could in principle be known" and ending at a named way out?

  The branch questions need to be things my friends can answer without already knowing which position they lead to — e.g. whether a truth that would stop being true the moment somebody found it out (a coin flipped in a sealed room in 1823 and melted down in 1850, nobody ever looked) even counts as a truth that has to be knowable; whether "could be known" requires some actual person who could come to know it or just allows for some possible new person; whether a truth too long for anyone to ever finish writing down is knowable; and, at the end, which premise they'd rather drop if it came to that (the knowability rule, the rule that a knowable conjunction splits into knowable parts, or the rule that knowing something means knowing what it obviously implies).

  Every leaf should be a named reply to the paradox, or 'unnamed' if nobody really holds it, with one sentence on the most awkward commitment it has to swallow, and please tag which leaves are still honestly realist and which quietly slide into verificationism or idealism. Also flag any two leaves your tree can't actually separate, and point out any combination of answers the tree allows that nobody defends, with a guess at why (incoherent, just unattractive, or nobody got around to it). And pls no paper titles or reading lists — we're doing this off one whiteboard.
