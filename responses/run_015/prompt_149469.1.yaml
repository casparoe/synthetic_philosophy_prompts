answer: |-
  # Final Exam: Rationality and Strategic Interaction

  **Time Allowed:** 60 minutes
  **Word Limit:** 900 words maximum
  **Total Marks:** 20

  **Question**

  Consider the following game variant. Two players, Ada and Bob, alternate over four decision nodes: Ada moves at nodes 1 and 3, Bob at nodes 2 and 4. At each node the mover has exactly three options.

  *   **Take:** the game ends immediately with the pot divided in the taker's favour. Payoffs (Ada, Bob) are (4, 1) at node 1, (3, 8) at node 2, (14, 6) at node 3, (11, 22) at node 4. Note that the pot grows as the game goes on, but the taker's advantage narrows.
  *   **Pass:** at nodes 1, 2 and 3 the move passes to the other player. If Bob passes at node 4 the game ends with (12, 12).
  *   **Open the side door:** available at every node. The game ends immediately; the player who opens the door receives 9 and the other player receives 10, because opening it costs the opener one unit. So Ada opening yields (9, 10) and Bob opening yields (10, 9).

  (a) Determine the backward induction outcome. Specify the complete strategy for each player (what they would do at every node, reached or not), the path actually predicted, and the resulting payoffs. (6 marks)

  (b) Change exactly one number: Ada's payoff if Bob takes at node 4 becomes 16 rather than 11; all else is unchanged. Redo the induction far enough to say what now happens at nodes 2 and 1. Note explicitly which of these nodes are reached under the answer to (a). (6 marks)

  (c) Why is the dependence that (b) exposes the heart of the paradox rather than an artefact of the numbers? Why does the familiar reply about arrival at a late node constituting evidence not simply repair the argument? Finally, is the requirement that a strategy be optimal at nodes the strategy itself rules out part of rationality or an additional assumption, and what becomes of the induction on each answer? (8 marks)

  ***

  # Model Answer

  **(a)** We solve by backward induction. At node 4, Bob compares Take (22), Pass (12), and Door (9). He chooses **Take**. Payoffs become (11, 22). At node 3, Ada compares Take (14), Pass (leading to Bob's Take: 11), and Door (9). She chooses **Take**. Payoffs become (14, 6). At node 2, Bob compares Take (8), Pass (leading to Ada's Take: 6), and Door (9). He chooses **Door**. Payoffs become (10, 9). At node 1, Ada compares Take (4), Pass (leading to Bob's Door: 10), and Door (9). She chooses **Pass**.
  **Strategies:** Ada: {Pass at 1, Take at 3}; Bob: {Door at 2, Take at 4}.
  **Path:** Node 1 (Pass) → Node 2 (Door).
  **Payoffs:** **(10, 9)**.

  **(b)** With Ada's node-4-take payoff raised to 16: At node 4, Bob still Takes (22 > 12 > 9). Payoffs (16, 22). At node 3, Ada now compares Take (14), Pass (16), and Door (9). She chooses **Pass**. At node 2, Bob compares Take (8), Pass (leading to 22), and Door (9). He chooses **Pass**. At node 1, Ada compares Take (4), Pass (leading to 16), and Door (9). She chooses **Pass**.
  **Result at Nodes 1 & 2:** Both players now **Pass**.
  **Nodes Reached in (a):** Under the answer to (a), Node 1 and Node 2 are reached; Nodes 3 and 4 are unreached. The change in (b) alters behaviour at Node 2 based on a change at Node 4, which was unreached in (a).

  **(c)** The paradox lies not in the specific inefficiency of (a), but in two structural features surviving the variant: first, the predicted outcome relies on justification running through nodes the prediction says will not be reached (counterfactual dependence); second, in the standard case (a), the outcome is Pareto-dominated by a path outcome (12, 12), showing individual rationality undermining collective welfare. The variant shows this dependence is sensitive to parameters at unreached nodes.

  The "evidential reply" (that reaching a late node proves irrationality) fails because it does not dissolve the recursion. Even if Ada suspects Bob is irrational at node 4, she must form a belief about his node 2 behaviour to decide at node 1. If she believes he is rational enough to open the door at 2 (as in a), she passes at 1. The evidence of arrival is endogenous to the strategy profile; it cannot be used to update beliefs without breaking the common knowledge of rationality required for backward induction.

  Finally, the requirement that a strategy be optimal at unreached nodes (Sequential Rationality) is an **additional assumption**, not entailed by rationality as such (which only requires optimizing given actual beliefs at reached nodes). If we treat it as part of rationality, backward induction holds, but relies on "empty" counterfactuals. If we treat it as separable, induction collapses: players need not specify actions at nodes their own strategy rules out, allowing for cooperative equilibria supported by threats that are not credible ex-post but are never tested. The paradox persists because standard game theory conflates the two.

