  # Marking Scheme

  **Total Marks:** 20
  **Pass Threshold:** 10 marks (Must hit Points 1 and 2).

  **Point 1: Correct Backward Induction in (a) (4 marks)**
  *   **Must Hit:** Identifies Bob opens Door at Node 2 and Ada Passes at Node 1. States final payoffs are (10, 9).
  *   *Common Error:* Concluding Ada Takes at Node 1 (the standard centipede result) without calculating the Side Door option.
  *   *Common Error:* Conflating the Door payoffs (thinking opener gets 10).

  **Point 2: Correct Induction in (b) and Node Identification (4 marks)**
  *   **Must Hit:** Identifies that Bob now Passes at Node 2 (due to Ada Passing at 3). Explicitly notes Nodes 1 and 2 were the reached nodes in (a).
  *   *Common Error:* Failing to update Ada's Node 3 decision, leading to incorrect Node 2 calculation.
  *   *Common Error:* Ignoring the instruction to identify which nodes were reached in (a).

  **Point 3: Counterfactual Dependence as the Paradox (4 marks)**
  *   **Must Hit:** Explains that the heart of the paradox is that choices at reached nodes (1 & 2) depend on payoffs/behaviour at unreached nodes (3 & 4).
  *   *Common Error:* Focusing solely on Pareto inefficiency without mentioning the counterfactual structure.
  *   *Common Error:* Claiming the variant dissolves the paradox because the outcome in (b) is efficient.

  **Point 4: Critique of the Evidential Reply (4 marks)**
  *   **Must Hit:** Argues that the evidential reply fails because beliefs about unreached nodes are required to solve reached nodes; one cannot wait for "evidence" of irrationality without first solving the prior node.
  *   *Common Error:* Asserting the evidential reply works because reaching Node 3 *would* be surprising (without explaining why this doesn't solve Node 1).

  **Point 5: Sequential Rationality vs. Rationality (4 marks)**
  *   **Must Hit:** Distinguishes Sequential Rationality (optimality at unreached nodes) as an additional assumption. Explains that dropping it blocks the induction.
  *   *Common Error:* Treating Sequential Rationality as synonymous with Rationality.
  *   *Common Error:* Failing to state what happens to the induction if the assumption is dropped.

  **Distinction between A and B Answers:**
  *   **A Answer (16-20 marks):** Clearly distinguishes the requirement of optimality at unreached nodes from rationality as such (Point 5). Explains that treating it as a separable assumption blocks the induction, whereas a B answer will run the recursion correctly (Points 1 & 2) and restate the standard dialectic about irrationality without isolating the Sequential Rationality assumption.
  *   **B Answer (10-15 marks):** Correctly computes (a) and (b) and identifies the Pareto/Counterfactual tension but treats the backward induction requirement as unproblematic or conflates it with basic rationality.
