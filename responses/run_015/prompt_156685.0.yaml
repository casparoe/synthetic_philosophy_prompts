  Look up beneath the dome of San Marco,
  Where arches rise to meet the circle's base.
  The triangular spaces left between,
  Are not designed to hold the holy gold.
  They are the cost of raising round on square,
  A structural demand of masonry.
  Then artists came with brush and tesserae,
  And filled the void with saints and seraphim.
  Now every eye assumes the art was first,
  And so it is the space is simply there.
  But stone was laid before the paint was dried.
  So too in life, the gene builds out the form,
  Constrained by laws of physics and of growth.
  Not every part is forged for survival.
  Some traits emerge as shadows of the whole,
  Like chin that follows from the jaw's demand.
  We tell a story where each bit is fit,
  An optimized machine for living well.
  But nature works with what the structure gives,
  And leaves behind the traces of the build.
  To see design in all is blind belief,
  A narrative imposed on random drift.
  Perhaps the brain is large for cooling's need,
  Not thought alone, but cooling of the blood.
  With no intent for what it comes to bear.
  Yet thought arises from the excess space.
  We cannot know which part is truly chosen,
  Or which is just the echo of the bone.
  The spandrel holds the mosaic secure,
  Though built to hold the weight of dome above.
  Function arrives after the fact of form,
  Exaptation that rides upon constraint.
  So look upon the creature and the church,
  And ask if utility was the cause.
  Or if the shape was forced by older laws,
  And use was found among the leftovers.
  The question hangs within the airy space,
  Between the arch of fact and dome of thought.
  We paint our meanings on the empty gaps,
  And call it nature's plan, or mere result.
