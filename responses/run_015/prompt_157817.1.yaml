answer: |-
  Here is the plan. It is designed to move them from moral outrage to structural analysis without triggering fatalism.

  ### 1. The Order of Operations
  **Lead with the villain-free case (Minutes 0–15).**
  Do not build the machinery first. If you explain the theory before showing the phenomenon, they will file the theory under "Abstract Economics" and keep their "Bad Landlord" model for real life. You need to break their existing model *before* you offer a replacement.

  *   **Why:** You need cognitive dissonance to open the door. If they agree "this bad outcome has no villain" *before* you explain *why*, they are invested in finding the explanation. If you explain the explanation first, they will listen for where the villain fits in.
  *   **The Sequence:**
      1.  **The Hook (0–15):** A villain-free case where everyone loses. (Use Example **A** here, see below).
      2.  **The Machinery (15–50):** Apply the three knobs to the **Carrying Case**.
      3.  **The Intervention (50–70):** The Floor and how to break the lock.
      4.  **The Application (70–80):** Misconceptions and Takeaway.

  ### 2. Placement of the Three Knobs
  You are right that the **Selector** is the load-bearing wall. Without it, the "Step" looks like greed or stupidity.

  1.  **The Selector (Minute 20):** Introduce this *immediately* after the Hook. Before you analyze *why* people move, establish *who decides who wins*.
      *   *Why:* If they think the "market" or "landlords" decide, they're back to villains. You must define the Selector as the *rule of the game*, not a person. (e.g., "The customer chooses the cheapest headline price," not "The restaurant owner is greedy.")
  2.  **The Step (Minute 30):** Once the Selector is fixed, the Step becomes inevitable.
      *   *Why:* This kills Misconception #1 (Blame). If the Selector rewards the Step, a "good" person *must* take the Step to survive. Restraint = elimination.
  3.  **The Floor (Minute 55):** Introduce this when discussing solutions.
      *   *Why:* This sorts "annoying races" from "existential traps." It belongs late because it dictates *strategy*. If there's a natural floor (e.g., physical exhaustion), you might wait it out. If there's no floor (e.g., algorithmic ad spending), you need external regulation.

  ### 3. The Examples: Which Carries the Weight?
  **The Carrier: (b) The Service Charges.**
  **The Icebreaker: (a) The Parade.**
  **The Application: (c) Their Own Campaigning.**
  **The Internal Check: (d) Shift-Signup.**

  **Why (b) Carries the 80 Minutes:**
  *   **Structural Shape:** It has a clear **Selector** (customers comparing headline prices), a clear **Step** (adding a surcharge to lower the headline), and a eroding **Floor** (customer trust).
  *   **Why not (c)?** You are right to worry. If you use their own campaigning as the *analytical* case, they will get stuck in the weeds of "But our cause is just" or "We *should* be able to trust each other." It triggers defensiveness. Use (c) at Minute 60 as the *test*: "Now apply the knobs to our social media burnout." If the theory works on (b), they will see it in (c) themselves.
  *   **Why not (a)?** It's too clean. It suggests the solution is "everyone sit down." It teaches coordination, not *structural lock-in*. Use it for 5 minutes just to break the Villain Model.
  *   **Why not (d)?** Too trivial. It feels like a scheduling bug, not a systemic trap. Save it for the end if you have time.

  **What the Carrying Case Must Have/Lack:**
  *   **Must Lack:** A clear beneficiary. In (b), the restaurants don't win (resentment cancels the price advantage). The *system* wins (efficiency), but the *actors* lose.
  *   **Must Have:** A penalty for restraint. If a restaurant *doesn't* add the surcharge, they must visibly lose customers. If the penalty is vague, the trap feels optional.

  ### 4. Handling the Misconceptions
  Your order is mostly correct, but two need shifting to prevent derailment.

  1.  **"Someone is to blame" (Minute 15):** Head this off *during* the Hook. When you draw the Parade on the whiteboard, ask: "Who told the first person to stand?" When they say "No one," write **"NO VILLAIN"** in big letters. Keep it there.
  2.  **"Fix is communication/trust" (Minute 35):** Address this immediately after defining the **Step**. Show that talking doesn't change the Selector. If the rule is "cheapest headline wins," a verbal agreement to stop surcharging is just a pact to go out of business.
  3.  **"Collective willpower" (Minute 55):** Address this with the **Floor**. Willpower doesn't raise the floor. Only changing the Selector does.
  4.  **"Surely someone wins" (Minute 60):** Use the Carrying Case. Show the math: Revenue is flat, costs (reputation) are up. Net is down.
  5.  **"This is just capitalism" (Minute 65):** **Do not fully defuse this.** This is the one misconception that is partially true.
      *   *Correction:* Grant that capitalism *amplifies* these traps by making the Selector more ruthless. But show that bureaucracies, unions, and families get stuck in them too. The mechanism is universal; capitalism is just high-octane fuel.
  6.  **"Seeing Moloch everywhere" (Minute 75):** Address in the Takeaway. Distinguish between "bad decisions" and "locked incentives."

  ### 5. The Takeaway Diagnostic
  You want a sentence they can use at a meeting to stop the blame game and start the fix.

  > **"If doing the rational thing makes us all weaker, stop fighting the people and change the rule that rewards the move."**

  *   *Why this works:* It validates their action (it was rational) while invalidating the outcome (we are weaker) and pointing to the intervention (the rule/selector).

  ### 6. What to Refuse to Explain
  You are correct to cut the following. Explicitly tell them you are cutting them to save time for *their* cases.

  *   **Formal Game Theory / Nash Equilibrium:** Load-bearing concept is "Stable Bad Outcome," not the math.
  *   **The Origin of "Moloch":** It's a poetic metaphor that distracts into AI risk debates.
  *   **Tragedy of the Commons:** Distinct mechanism (resource depletion vs. competitive escalation). Mentioning it confuses the Selector.
  *   **AI Risk:** Completely irrelevant to tenants' rights right now.

  **One Load-Bearing Check:**
  Do not explain **Prisoner's Dilemma** by name, but do not skip the *logic* of it. You need them to understand that *defecting* (taking the Step) is individually rational even if collectively suicidal. You can teach this logic without the jargon.

  ### 7. The Final Check Question
  Do not ask "What is a multipolar trap?" Ask for an application that proves they see the *mechanism*, not just the vibe.

  > **"Tell me one thing you do in your housing work that you hate, that you keep doing only because you're afraid another group will gain an advantage if you stop."**

  *   *Why:* If they name a "bad landlord," they missed the point. If they name a "task we all hate but must do," they got it. If they say "I don't do anything like that," ask them if they're sure, or if they just haven't identified the Selector yet.

  ### Summary Timeline (80 Mins)
  *   **00–05:** **The Parade (Example A).** Draw it. Establish: No villain, bad outcome, stable.
  *   **05–20:** **The Service Charges (Example B).** Introduce **Selector** (Customer choice) and **Step** (Surcharge). Show why restraint fails.
  *   **20–40:** **The Machinery.** Whiteboard the three knobs. Define "Rationality" as "Surviving the Selector."
  *   **40–55:** **The Floor.** Discuss where it ends. Burnout? Bankruptcy?
  *   **55–65:** **Application (Example C).** Ask them to apply the knobs to their campaigning burnout. *This is where the lightbulb goes on.*
  *   **65–75:** **Misconceptions.** Address Blame, Willpower, and Capitalism.
  *   **75–80:** **Takeaway & Check Question.**

  **Facilitator Note:** When they suggest "We should all just agree to stop" (Misconception #3), do not argue. Ask: "What happens to the first group that breaks the agreement to get a win with the Councillors?" Let them answer their own objection. That is the Selector doing its work.
