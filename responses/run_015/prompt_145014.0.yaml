answer: |-
  **The joke**

  In Ockham, waiting at an empty crosswalk signals you distrust the drivers' virtue.
  "You must cross immediately to show faith," the local insisted.
  The visitor stood frozen at the curb. "But where I'm from, waiting is polite."
  "Here, it creates noise," the local replied. "Now that driver has to guess if you're confused, injured, or protesting. You've offloaded the cost of interpretation onto him."
  "I was just following the rules of my hometown," the visitor said.
  "That explains your behavior," said the local. "It doesn't reimburse him for the mental labor of decoding it. You didn't break a law; you billed him for therapy."

  **Commentary**

  The punchline exploits the claim that non-compliance offloads interpretation costs onto locals. The joke isn't merely that customs differ, but that violating a coordination convention forces others to expend cognitive energy deciphering intent. Ethics often asks if a rule is morally weighty. Here, the rule is arbitrary, but the cost of ambiguity is real.

  This invented convention is a fair test because it isolates the function of the norm from its content. The specific signal is irrelevant; what matters is that everyone must signal the same way to avoid confusion. If the convention were just exotic, the humor would rest on strangeness. Instead, it rests on the friction caused by breaking the coordination equilibrium.

  The joke quietly concedes that the visitor does have an obligation, not because waiting is inherently wrong, but because refusing to adapt imposes a burden on others. The visitor's defense addresses their integrity but ignores the external cost imposed on the driver. Thus, the obligation arises from the duty not to make others solve puzzles unnecessarily, validating the coordination-based moral claim.
