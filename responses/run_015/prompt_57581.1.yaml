answer: |-
  TO: Board Members
  FROM: Treasurer
  DATE: October 24, 2023
  SUBJECT: Winter Capacity Protocol

  RECOMMENDATION
  1. Capacity: Hard cap at 22 sleepers. No floor mats.
  2. Entry: First-come, first-served. No residency checks.
  3. Turn-aways: Offer $25 motel voucher (paid by church pool) until funds expire (approx. 8 nights). After funds deplete, provide referral info for mission 30 miles south.
  4. Review: Revisit policy Jan 15 based on occupancy data.

  REASONING
  Demand will exceed supply this winter due to the county facility closure and new bus route. We must choose a sustainable protocol.

  The primary constraint is the Fire Marshal. Our occupancy limit is 30 total people. If we exceed this with floor mats and get cited, we lose the Legion hall. A shut shelter helps zero people. Maintaining compliance ensures we remain open all winter.

  Strongest Case for "Never Turn Away":
  The moral argument is undeniable. We are here to prevent deaths like the one in February. Turning someone away into a blizzard feels like signing a death warrant. I signed that log. It haunts me. If the goal is purely saving lives tonight, mats win. A fire marshal citation is a risk; a dead neighbor is a certainty. The rules shouldn't matter more than breathing. But if the goal is saving lives all winter, compliance wins. We cannot gamble the whole operation on one night.

  Regarding the "lifeboat vs. ferry" comment: It is a real distinction. A ferry moves everyone; a lifeboat saves who it can without sinking. We are a lifeboat.

  Vouchers:
  Some worry vouchers incentivize staying out. There is no proof of this. $25 covers a basic room, not profit. In this cold, it is harm reduction. We should use the donated funds for their intended purpose until they are gone. Once gone, they are gone.

  Residency Preference:
  Enforcing county residency at the door creates conflict and delays. It requires verification we cannot perform at 8 PM. It risks alienating the churches funding us. County funding covers half our budget; antagonizing them with residency checks risks that revenue.

  SUMMARY
  We cannot carry everyone without sinking. We must stay afloat to save who we can. Cap the beds, use the vouchers, keep the doors open.
