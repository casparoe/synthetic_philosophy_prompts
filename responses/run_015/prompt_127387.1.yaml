  The stylus hovered over the glass tablet. Nadia was forty-three, her lungs still burning pleasantly from a ten-mile run, her pharmacist's mind categorising the future as a series of manageable risks. She scrolled to the weighting clauses. This was the new law: you didn't just refuse treatment; you assigned authority.

  She typed with precision. Pain reports: 90. Religious conviction: 0. Claims of happiness: 40. She paused at the notes section. The cursor blinked, a rhythmic pulse. She typed: *If I turn into someone who's content with a small quiet life, that isn't me getting what I wanted, that's me being made smaller.* She added the symmetry condition opt-in. To overturn this, Future Nadia would have to explain Past Nadia's fear better than Past Nadia had written it. She signed. The screen flashed green. Directive lodged.

  Thirty-one years later, the sun was softer, filtered through the net curtains of the care home lounge. Nadia, seventy-four, sat in a beige cardigan. Her hands rested calmly in her lap, no longer twitching with the need to check dosages or lace up trainers. She believed in God now. She believed in the warmth of Bill's hand on her shoulder.

  Bill was waiting by the door, holding her coat. It was Sunday. The bell from the nearby Methodist church was tolling, a sound that made Nadia's chest tighten with a sweet, familiar anticipation.

  The door opened. Ruth stood there, not in running gear, but in a stiff coat, holding a leather folder. She didn't look at Bill. She looked at her mother.

  "You're not going, Mum," Ruth said.

  Bill stepped forward, protective. "She's calm, Ruth. She wants to go. It's good for her."

  "The directive says zero weight on religious conviction," Ruth said, her voice flat. "It says she isn't to be taken to services. It says contentment is a symptom of diminishment."

  "That was a lifetime ago," Bill said.

  "The symmetry condition applies," Ruth said, opening the folder. "Dr. Aris is here."

  The clinician, a man with a tired face and a digital recorder, stepped out from the hallway. He didn't sit. He stood between the woman who ran and the woman who prayed. "We need to attempt the overturn," Aris said. "Nadia, do you wish to attend the service?"

  "Yes," Nadia said. Her voice was thin, but steady. "I want to hear the hymns."

  "To do so, you must invalidate the clause written at age forty-three," Aris said. "You know the rule. You must state the reasoning that led the earlier you to write it. To my satisfaction."

  Ruth watched her mother's face. The Alzheimer's was early-stage, a fog that rolled in and out. Sometimes she knew the date; sometimes she thought Ruth was her sister.

  Nadia looked at her hands. She smoothed the fabric of her cardigan. "She was frightened," Nadia said.

  "Who?" Aris asked.

  "The woman who wrote it. Me. But not me." Nadia looked up. Her eyes were cloudy, milky with cataracts and time. "She thought... she thought peace was a trap. She thought if I stopped fighting, I would disappear."

  "Go on," Aris said.

  "She was a runner," Nadia said. "She liked the burn. She thought... if I stop wanting the burn, I am broken." Nadia paused. She looked at Bill, then at Ruth. "She wrote zero for God because she thought God was a sedative. She thought if I took it, I would sleep forever."

  Ruth felt a cold knot in her stomach. It was exactly right. It was exactly what her mother had told her over wine, twenty years ago, when they discussed the legislation. Was Nadia remembering the logic, or was she repeating what Ruth had told her last week when this same argument happened?

  "She wrote that I would be made smaller," Nadia said. Her voice dropped to a whisper. "She thought quiet was a cage."

  "Did she?" Aris asked. "Or is that what you were told?"

  Nadia blinked. She looked at the window. The bell tolled again. "I don't know," she said. "I know I want to go. I know I am not afraid. But I know... she was."

  She looked at Aris. "Is that enough? Do I know her?"

  Aris looked at his recorder. He looked at Ruth. The protocol demanded certainty of understanding, but the human mind was a palimpsest. "The reasoning is accurate to the text," Aris said. "Whether it is reconstructed or recalled... the condition doesn't specify source memory, only accuracy of statement."

  He turned to Ruth. "Technically, she has met the condition. She has articulated the antagonist's position. The clause can be overridden."

  Bill let out a breath he had been holding. He reached for the coat.

  Ruth looked at the folder. The weighting clause: *0 to religious conviction.* The note: *that's me being made smaller.*

  If she let them go, she betrayed the woman who ran ten miles without stopping. If she stopped them, she betrayed the woman sitting in the cardigan, who found peace in a hymn. The symmetry condition was supposed to protect the past self from the future self's decay, but it required the future self to be smart enough to explain the decay. Nadia had explained it. But had she understood it, or had she just learned the lines?

  Ruth looked at her mother. Nadia was looking at Bill, a small, serene smile on her face. It was the smile of someone who had put down a heavy weight. It was exactly the smile the forty-three-year-old had feared.

  Ruth took the pen from her folder. She hovered it over the override authorization form. The ink looked black and final. She thought of the runner, lungs burning, terrified of the quiet. She thought of the woman in the cardigan, terrified of nothing.

  Ruth signed the form. She closed the folder.

  "Go on then," Ruth said.

  Bill helped Nadia into her coat. Nadia didn't look back at Ruth. She took Bill's arm and walked toward the door, toward the bell, toward the quiet life she had promised herself she would never want. Ruth stood alone in the lounge, the signed paper in her hand, watching them leave.
