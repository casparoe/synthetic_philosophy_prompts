  Here is the breakdown of your housemate's classification logic, predictions for your drive, and the specific case to test her consistency.

  ### 1. Predicted Verdicts on New Cases

  Based on her track record (specifically the **Rat** and **Sea Slug** rulings), here is how she will likely classify your examples:

  *   **(a) Chess Engine (Brute-Force Lookahead):** **Popperian.**
      *   *Reasoning:* It kills hypotheses internally (search trees) before moving a piece. It fits her "hypotheses dying in their stead" criterion perfectly. She will likely ignore the fact that it's software because the *mechanism* is internal simulation, not environmental trial-and-error.
  *   **(b) Slime Mold (Maze Solving):** **Darwinian.**
      *   *Reasoning:* Like the sensitized sea slug, it has no neurons. Its pathfinding is physical/chemical optimization selected by evolution. It doesn't "learn" the maze; the mold's growth *is* the selection process.
  *   **(c) Current Chatbot LLM:** **Skinnerian.**
      *   *Reasoning:* This follows from her **Rat verdict**. She views the LLM as a statistical copier. It predicts the next token based on associative weights (trial-and-error on text), not by simulating reality or understanding the "mind-tools" it outputs. It is "vicarious trial and error" on a massive dataset.
  *   **(d) Wolf Pack:** **Individuals = Popperian; The Pack = Darwinian.**
      *   *Reasoning:* Individual wolves must model the prey and their packmates' positions (internal simulation), making them Popperian. However, she will likely reject the "Pack Mind" as Gregorian because there are no external cultural artifacts (maps, language) binding them. The pack structure is evolved (Darwinian), not culturally constructed.

  ### 2. The Rules Fitting Her Track Record

  You identified two candidate rules, but her specific verdicts suggest a third, more restrictive constraint.

  *   **Rule A: Locus of Selection (Dennett Strict).**
      *   *Definition:* Grade = Where do bad ideas get filtered out? (Genome = Darwinian, Environment = Skinnerian, Internal Model = Popperian, Culture = Gregorian).
      *   *Fit:* Explains the Sea Slug (plasticity moves it from D to S) and the Chimp (rejection moves it to P).
      *   *Conflict:* Struggles with the **Rat**. Social copying *is* a form of cultural filtering, yet she demoted it to Skinnerian.
  *   **Rule B: Representational Medium.**
      *   *Definition:* Grade = What kind of data is the mind processing? (Signals = Darwinian, Associations = Skinnerian, Causal Models = Popperian, Symbols = Gregorian).
      *   *Fit:* Explains the Tourist (Map = Symbol) vs. the Chimp (Stick = Causal Model).
      *   *Conflict:* Struggles with the **LLM**. LLMs process symbols, but she will likely call them Skinnerian (see prediction above).
  *   **Rule C: The "Artifact Constraint" (The Actual Rule).**
      *   *Definition:* Gregorian status requires **external symbolic artifacts** (maps, language, math), not just social information. Skinnerian status covers all **associative learning**, even if vicarious (watching others).
      *   *Fit:* This is the only rule that explains why the **Tourist is Gregorian** (uses a map) but the **Copying Rat is Skinnerian** (uses social info, no artifact). It also explains why the **LLM is Skinnerian** (processes symbols associatively, doesn't *use* them as tools for thought).

  ### 3. Which Rule Is She Really Running?

  She is running **Rule C (The Artifact Constraint)**, weighted heavily by **Mechanism over Medium**.

  The **Sea Slug** case proves she cares about *mechanism* (sensitization vs. association). The **Rat** case is the load-bearing data point: it proves that for her, **social transmission $\neq$ Gregorian**. If she believed "borrowing from other minds" was enough for Gregorian status, the rat would be Gregorian. By calling it Skinnerian, she has defined Gregorian narrowly: you must use a *reified cultural tool* (like a map), not just copy behavior.

  This means she prioritizes **how the competence is built** (Rule A) but adds a **gatekeeper for Gregorian** (Rule C).
  *   *Darwinian:* Hardwired.
  *   *Skinnerian:* Associative (including social/observational).
  *   *Popperian:* Internal Simulation (offline testing).
  *   *Gregorian:* External Symbolic Scaffolding.

  **Do the data points decide this?** Yes. The Rat verdict kills the idea that "Social Learning = Gregorian." The Tourist verdict establishes "Artifacts = Gregorian." The Chimp verdict establishes "Offline Physical Testing = Popperian."

  ### 4. The Killer Case for the Rest Stop

  To expose a potential inconsistency or force her to refine Rule C, you need a case that possesses **Symbolic Tools** but relies on **Associative Mechanisms**.

  **The Case:** **"A dog trained to press buttons on a soundboard to request 'Outside' or 'Food'."** (e.g., the "talking dog" phenomenon).

  **Why this splits the rules:**
  *   **If she says Gregorian:** She admits that *using symbols* upgrades the mind, regardless of the learning mechanism.
      *   *The Trap:* This contradicts her **Rat verdict**. The rat copied a lever press (behavioral symbol) for a reward. The dog presses a word-button (linguistic symbol) for a reward. If the dog is Gregorian, why isn't the rat? She will have to argue that *human language* is the magic ingredient, which shifts her rule from "Artifact" to "Human Culture."
  *   **If she says Skinnerian:** She admits that *conditioning mechanism* trumps the *symbolic medium*.
      *   *The Trap:* This undermines the **Tourist verdict**. The tourist consulting a map is often just following conditioned rules ("Red line goes to station"). If the dog with words is Skinnerian, when does a human stop being Skinnerian and start being Gregorian? Is it only when we *create* the map, not when we *read* it?

  **How to spring it:**
  *"Okay, the rat copying the lever is Skinnerian because it's just associative learning. But what about those dogs that press buttons that say 'Play' or 'Outside'? They're using human language tools, but they're trained by treats. Are they Gregorian because of the words, or Skinnerian because of the treats?"*

  **Her Answer Reveals:**
  *   **Gregorian:** She values the **Tool** over the **Mechanism**. (Inconsistent with Rat).
  *   **Skinnerian:** She values the **Mechanism** over the **Tool**. (Consistent with Rat, but makes "Gregorian" very hard to achieve—perhaps only creators of tools are Gregorian, users are not).
  *   **"It depends if they understand the meaning":** She introduces a **Understanding/Intent** clause, which moves away from Dennett's behaviorist ladder toward a Cartesian "inner light" she claims to reject.
