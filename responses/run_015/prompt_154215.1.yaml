answer: |-
  # TRANSITIONAL ADMINISTRATION LEGISLATIVE AUDIT PROTOCOL
  **Subject:** Pre-Publication Validity Check for Administrative Decrees
  **Time Allocation:** 20 Minutes per Decree
  **Auditor:** Provisional Legislative Auditor
  **Signatory:** Senior Civil Servant

  ## PART I: THE DECISION PROCEDURE

  This protocol operationalizes the Hybrid Charter's requirement that a decree must possess both **Institutional Authority** (Source) and **Internal Legality** (Form) to have legal force. Follow these steps in order. Do not skip steps.

  ### PHASE 1: SOURCE AUTHORITY CHECK (The "Who" and "How")
  *Goal: Determine if the decree originates from a power recognized by the current Rule of Recognition.*

  **Step 1.1: Office Verification [MECHANICAL]**
  *   **Test:** Is the decree issued by an office listed in the Transitional Charter's Schedule of Authorized Bodies?
  *   **Check:** Compare the signatory's title against the Schedule.
  *   **Pass:** Office is listed and active.
  *   **Fail:** Office is abolished, suspended, or not listed (even if they hold de facto power).
  *   **Action:** If **Fail**, proceed immediately to **VERDICT: BLOCK**. Do not continue to Phase 2.

  **Step 1.2: Procedural Chain [MECHANICAL]**
  *   **Test:** Does the decree bear the required countersignatures or approvals mandated by the Charter for this specific type of regulation?
  *   **Check:** Verify presence of required stamps/signatures (e.g., "Finance Ministry Review" for tax decrees).
  *   **Pass:** All required signatures present.
  *   **Fail:** Missing required procedural endorsements.
  *   **Action:** If **Fail**, proceed immediately to **VERDICT: BLOCK**.

  *(If Phase 1 is PASSED, proceed to Phase 2.)*

  ### PHASE 2: INTERNAL LEGALITY CHECK (The "What" and "Way")
  *Goal: Determine if the decree satisfies the eight conditions of the Internal Morality of Law. For speed, these are grouped into three practical clusters.*

  **Step 2.1: Notice and Clarity [JUDGMENT]**
  *   **Test:** Can a citizen understand what is required without legal counsel, and was it made public before enforcement?
  *   **Check:**
      1.  Is the language vague or open to arbitrary interpretation?
      2.  Is there a publication date prior to the effective date?
  *   **Pass:** Clear language; public promulgation.
      **Fail:** Secret directive; unintelligible terms; effective date prior to publication.
  *   **Action:** Mark Pass/Fail.

  **Step 2.2: Consistency and Constancy [JUDGMENT]**
  *   **Test:** Does this decree contradict existing valid law or change too frequently to be followed?
  *   **Check:**
      1.  Does Clause X contradict Clause Y within the same decree?
      2.  Does this decree directly nullify a higher-order law without explicit authorization?
  *   **Pass:** Internally consistent; stable relative to higher law.
      **Fail:** Internal contradictions; impossible to reconcile with standing law.
  *   **Action:** Mark Pass/Fail.

  **Step 2.3: Feasibility and Congruence [JUDGMENT]**
  *   **Test:** Is it physically possible to comply, and will officials enforce it as written?
  *   **Check:**
      1.  Does the decree require actions physically impossible to perform (e.g., "submit form within 1 hour" when offices are closed)?
      2.  Is there evidence that enforcing agencies lack the capacity to execute this?
  *   **Pass:** Compliance is possible; enforcement capacity exists.
      **Fail:** Compliance impossible; no capacity to enforce.
  *   **Action:** Mark Pass/Fail.

  *(If any Step in Phase 2 is FAILED, proceed to Phase 3. If all PASSED, proceed to VERDICT: CLEAR.)*

  ### PHASE 3: CONFLICT RESOLUTION BRANCH
  *Goal: Resolve divergences between Source Authority and Internal Legality.*

  **Scenario A: Source PASS / Internal FAIL**
  *   **Context:** The decree is issued by the correct office but violates formal legality (e.g., retroactive, secret, or impossible).
  *   **Protocol:** **VERDICT: BLOCK.**
  *   **Rationale:** Under the Hybrid Charter, a properly sourced command that fails internal legality is not law; it is an act of force.
  *   **Exception Escalation [JUDGMENT]:** If blocking the decree creates an immediate threat to public safety or state collapse (not merely political inconvenience), attach a "Red Flag Memo" to the Senior Civil Servant. The default recommendation remains **BLOCK**, but the Memo allows the Signatory to override based on emergency prerogative.

  **Scenario B: Source FAIL / Internal PASS**
  *   **Context:** The decree is well-drafted and clear but issued by an unauthorized body (e.g., a abolished ministry).
  *   **Protocol:** **VERDICT: BLOCK.**
  *   **Rationale:** Formal perfection cannot cure a lack of jurisdiction. To clear this would validate a usurpation of power.
  *   **Action:** No escalation permitted.

  ---

  ## PART II: WORKED APPLICATIONS

  The following examples demonstrate how the protocol applies to draft decrees.

  ### Case 1: The Routine Technical Regulation
  **Draft:** A decree setting safety standards for elevator inspections, issued by the Ministry of Infrastructure.
  *   **Phase 1 (Source):** Ministry of Infrastructure is on the Authorized Schedule. Required engineering sign-off is present. **(PASS)**
  *   **Phase 2 (Internal):** Standards are specific (Clarity). Effective date is 30 days post-publication (Notice). No contradictions with building codes (Consistency). Inspections are physically possible (Feasibility). **(PASS)**
  *   **Phase 3 (Conflict):** No divergence.
  *   **Verdict:** **CLEAR.**
  *   **Auditor Note:** This is the baseline function of the administration. No tension between authority and form.

  ### Case 2: The Retroactive Tax Assessment
  **Draft:** A decree issued by the Ministry of Finance imposing a 10% levy on all corporate profits earned in the *previous* fiscal year to plug a budget deficit.
  *   **Phase 1 (Source):** Ministry of Finance is authorized. Budget committee signature is present. **(PASS)**
  *   **Phase 2 (Internal):**
      *   Notice: Fails. Citizens could not arrange affairs to avoid a tax that did not exist when the profit was earned.
      *   Feasibility: Fails. Compliance requires altering past actions, which is impossible.
      *   **(FAIL)**
  *   **Phase 3 (Conflict):** Source PASS / Internal FAIL.
  *   **Protocol Action:** **VERDICT: BLOCK.** (Escalation via Red Flag Memo permitted due to budget crisis).
  *   **Auditor Note (Counterintuitive Result):** A reasonable auditor may feel this verdict is wrong. The Ministry has the right authority, and the state desperately needs the revenue. Blocking this stalls governance and risks a budget collapse. However, under the Hybrid Charter, retroactivity violates the internal morality of law. This reveals the framework's limit: it prioritizes the *form* of legality over *substantive* necessity. The procedure forces you to choose the rule of law over fiscal survival, which may feel morally hazardous in a transition.

  ### Case 3: The Secret Contradictory Directive
  **Draft:** A directive from the Office of Public Order (authorized) instructing police to "disperse all gatherings" but also "protect the right to assembly," with no publication date.
  *   **Phase 1 (Source):** Office of Public Order is authorized. **(PASS)**
  *   **Phase 2 (Internal):**
      *   Notice: Fails (No publication).
      *   Consistency: Fails (Disperse vs. Protect).
      *   **(FAIL)**
  *   **Phase 3 (Conflict):** Source PASS / Internal FAIL.
  *   **Protocol Action:** **VERDICT: BLOCK.**
  *   **Auditor Note:** This is a clear failure of the Internal Morality. Even though the Office has the power to issue orders, an order that is secret and contradictory is not a law; it is a tool of arbitrary power. The protocol correctly identifies this as invalid.

  ---

  ## PART III: LIMITATIONS AND RISKS

  This procedure is a tool for operationalizing the Hybrid Charter, not a substitute for political or moral reasoning. You must inform the Senior Civil Servant of the following constraints:

  **1. Substantive Justice is Out of Scope**
  This procedure tests *how* a law is made and *who* made it, not *what* the law says. A decree that is Source-Valid and Internally-Valid can still be deeply unjust (e.g., a clear, prospective tax that confiscates 90% of income). This protocol will **CLEAR** such a decree. It cannot protect against oppressive content that follows the rules.

  **2. The Flux of the Rule of Recognition**
  This protocol assumes the "Authorized Schedule" (Phase 1) is stable. In a transitional administration, power dynamics shift. If a new faction takes control of a Ministry but the Schedule is not updated, Phase 1 may yield a **FAIL** for a decree that is politically inevitable. The protocol cannot resolve disputes about who *actually* holds power versus who is *listed* as holding power.

  **3. The "Emergency" Blind Spot**
  As seen in Case 2, the protocol defaults to **BLOCK** when Internal Legality fails, even if the failure is necessary to save the state. The "Red Flag Memo" is a pressure valve, but it places the burden of breaking the law on the Senior Civil Servant. The procedure itself cannot legitimize emergency violations; it can only flag them.

  **4. Irreducible Judgment Calls**
  While Phase 1 is mechanical, Phase 2 (Internal Legality) requires judgment. Determining whether a law is "too vague" or "impossible to comply with" is not mathematical. Two auditors might reach different conclusions on the same text. This introduces a risk of inconsistency that the checklist cannot eliminate.

  **5. Legitimacy of the Charter**
  This procedure presupposes the Hybrid Charter itself is valid. It cannot evaluate whether the Charter's combination of Hart and Fuller is coherent or whether the Transitional Administration has the right to rule in the first place. It operates *within* the system, not *upon* it.

  ---

  **AUDITOR SIGN-OFF:**
  [ ] CLEAR FOR PUBLICATION
  [ ] BLOCK (Invalid Source)
  [ ] BLOCK (Invalid Form)
  [ ] BLOCK (Conflict: Valid Source / Invalid Form) + [ ] RED FLAG MEMO ATTACHED

  **Date:** _______________
  **Auditor Initials:** _______________
