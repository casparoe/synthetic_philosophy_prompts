answer: |-
  This is an exceptionally sharp reconstruction of the tension in Russell's *Marriage and Morals* (1929). You have correctly identified the friction between his radical critique of sexual possessiveness and his conservative insistence on social stability for child-rearing.

  To resolve the *reductio* while preserving Russell's core rationalist commitments (Premises 1 and 2), you should reject **Premise (5)**.

  To a lesser extent, **Premise (3)** also requires nuance. However, (5) is the structural weak point because it commits a category error regarding what constitutes an "institution."

  Here is the detailed breakdown of why (5) fails, what rejecting it commits you to, and how this preserves Russell's consistency.

  ### 1. The Weak Step: Premise (5)
  > *(5) But if exclusivity is removed, the remaining bond is defined only by cooperative parenting and mutual affection; yet these features can be fully present in close friendships or in non-marital cooperative parenting arrangements that carry no special legal or social status.*

  **Why it fails:**
  This premise assumes that the *distinctive content* of marriage is defined solely by its internal interpersonal dynamics (sex, affection, parenting labor). It ignores the **external scaffolding** that Russell explicitly valued.

  For Russell, the distinction between marriage and friendship was not merely about who sleeps with whom; it was about the **public, legal presumption of joint responsibility**.
  *   **Legal Distinction:** Friendship does not automatically confer next-of-kin status, inheritance rights, or presumptive paternity. Russell argued that the state has a legitimate interest in children, and therefore the institution that produces children must be legible to the state.
  *   **Signaling Function:** Marriage acts as a public signal of *intent* to maintain stability. A friendship can dissolve without social repercussion; a marriage, even a reformed one, involves a public covenant that raises the cost of exit. Russell believed this "friction" was necessary to prevent parents from abandoning children on a whim.
  *   **Economic Entanglement:** Russell's "companionate marriage" implied a communal economic unit designed to protect the vulnerable partner (usually the woman, in his historical context) and the children. Friendship rarely entails a legally enforced community of property.

  **The Correction:**
  If you modify (5) to acknowledge that marriage includes **state-sanctioned obligations and public signaling mechanisms** that friendship lacks, the inference to (6) collapses. Marriage does not collapse into friendship because friendship lacks the *legal machinery of stability* that Russell deemed essential for child welfare.

  ### 2. The Secondary Weak Step: Premise (3)
  > *(3) If jealousy ought to be overcome, then the expectation of sexual exclusivity—which functions as jealousy's institutional expression—lacks rational justification.*

  **Why it requires nuance:**
  This premise assumes that the *only* rational function of exclusivity is to soothe jealousy. Russell's view was more pragmatic. He argued that while jealousy is an irrational *emotion*, exclusivity can be a rational *tool* for other ends.

  *   **Paternity Certainty:** In an era before DNA testing, exclusivity was the only reliable method to establish paternity, which was crucial for assigning legal responsibility for child support.
  *   **Conflict Reduction:** Even if jealousy is irrational, it is a prevalent human fact. Russell argued that social norms should minimize unnecessary friction. Exclusivity reduces the *opportunity* for jealousy to arise, thereby preserving the stability required for child-rearing.

  **The Correction:**
  Russell does not need to claim exclusivity is *intrinsically* good (which would contradict Premise 2). He only needs to claim it is *instrumentally* useful for stability in parental unions. Therefore, one can hold that jealousy is irrational (2) while maintaining that exclusivity has a rational, utilitarian justification in the specific context of raising children (modifying 3).

  ### 3. What Rejecting (5) Commits You To
  If you reject Premise (5) to save Russell's argument, you are committing to an **Institutionalist** rather than a **Relational** definition of marriage.

  *   **Relational Definition:** Marriage is defined by the quality of the bond (love, sex, intimacy). If the bond exists without the label, the label is redundant. (This is the view your *reductio* forces).
  *   **Institutionalist Definition:** Marriage is defined by its functional role in the social structure (legal contract, child welfare mechanism, economic safety net).

  By adopting the Institutionalist view, you align with Russell's actual position in *Marriage and Morals*. He was not trying to sanctify romance; he was trying to engineer a social structure that maximized happiness and minimized harm to children. He explicitly distinguished between **"individual marriage"** (childless, where he advocated for near-total sexual freedom and easy dissolution) and **"parental marriage"** (where he advocated for strict stability and, implicitly, greater sexual constraint).

  Your argument treats marriage as a monolith. Russell treated it as a dual-purpose institution. For childless couples, your *reductio* largely holds (Russell admitted such marriages should be easily dissoluble and less bound by exclusivity). For parental couples, your *reductio* fails because the "distinctive content" is the **welfare of the third party (the child)**, which friendship does not legally encompass.

  ### 4. Resolving the Dilemma (Premise 8)
  Once (5) is rejected, the dilemma in (8) dissolves. Russell can maintain:
  1.  **Jealousy is irrational** (Premise 2 stands).
  2.  **Exclusivity is not intrinsically moral, but instrumentally necessary** for parental stability (Premise 3 is nuanced).
  3.  **Marriage is distinct from friendship** not because of sex, but because of the **legal/public commitment to child welfare** (Premise 5 is rejected).

  Therefore, marriage is not redundant. It is a specific **technology of social stability** that friendship, being private and unregulated, cannot replicate.

  ### Summary of the Fix
  To preserve Russell's rationalist critique without abolishing marriage:

  1.  **Keep (1) and (2):** These are the core of his ethical rationalism.
  2.  **Modify (3):** Acknowledge that exclusivity can be justified *consequentially* (for stability/paternity) even if the *emotion* driving it (jealousy) is irrational.
  3.  **Reject (5):** Assert that the "distinctive content" of marriage is not affection or parenting labor (which friends can share), but the **public, legal covenant of permanence** designed to protect children.

  This locates the "distinctive moral content" of Russell's marriage not in the bedroom, but in the courtroom and the nursery. It saves the institution from redundancy by grounding it in **child welfare logistics** rather than **romantic exclusivity**.
