      *   **Section 4: Confidence & Contingency.** Explicitly label what is text, what is interpretation, and what is philosophical debate.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Wait, did Hofstadter explicitly talk about Voyager?* GEB was published in 1979. Voyager launched in 1977. The Golden Record was in the news. Hofstadter discusses SETI messages generally. I should clarify he uses a hypothetical record/message, not specifically Voyager, though the logic is identical.
