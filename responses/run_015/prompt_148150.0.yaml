      *   *Claim 3: Inner = Same for every receiver with code.* **Problematic.** Hofstadter emphasizes the *receiver's* internal structure. Having the "code" isn't enough; you need the *conceptual framework* to instantiate the meaning.
      *   *Claim 4: Meaning created only when a mind reads... machine processes code without meaning.* **Major Distortion.** This is the biggest issue. Hofstadter argues meaning *is* the processing, provided the processing system is complex enough (isomorphic). He does not reserve meaning exclusively for biological humans. This is a "human exceptionalist" gloss on a book that argues against human exceptionalism regarding meaning.

  4.  **Applying to Voyager Golden Record:**

