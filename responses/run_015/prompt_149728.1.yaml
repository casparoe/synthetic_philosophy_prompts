answer: |-
  The glow of the monitor illuminated the dust motes dancing between Mara Vos and Idris Kale. The preregistration document sat open, the cursor blinking impatiently at the field labeled *Primary Outcome Measure*.

  "If we list the verbal report as primary," Mara said, her fingers hovering over the keyboard, "we validate the participant's authority over their own consciousness. That violates the protocol. The text is the data, not the truth."

  Idris leaned against the doorframe, arms crossed. "And if we list the four-choice selection, we measure guesswork. You saw the pilot data. They're at chance. But the tracing? The correlation is point-six. That's not guesswork, Mara. That's access."

  "It's motor behavior," Mara corrected, turning in her chair. "Heterophenomenology treats it as such. The tracing is a physical act caused by neural states, just like the button press. To privilege it as a 'window' into experience is to smuggle in introspectionism."

  "It bypasses the bottleneck," Idris countered, pushing off the wall to stand beside her. "The verbal report is contaminated by lexical availability. They say 'grey flicker' because they lack the concept 'irregular heptagon.' If we don't account for that, we aren't measuring consciousness; we're measuring vocabulary."

  Mara paused. She tapped the desk. "You're arguing that the untrained report is contaminated by conceptual framing. Specifically, the lack of geometric vocabulary forces a narrative collapse into 'flicker.'"

  "Exactly."

  "Fine," Mara said, typing slowly. "I will concede that the immediate verbal report is constrained by lexical availability. It is not a pure transmission. But that doesn't make the tracing a report of experience. It makes it a dissociated motor routine."

  "Then what is the primary outcome?" Idris asked. "The funder wants one metric for 'conscious detection.' If we say it's the tracing, I get my channel. If we say it's the verbal report, you get your text. But if we say it's the button press, we both admit the experiment fails."

  Mara sighed. "We define the outcome as 'Discriminative Capacity,' operationalized by tracing fidelity. But the description must state that this measures information access, not necessarily phenomenological presence."

  "That's a distinction without a difference if the tracing requires attention," Idris said. He leaned over the screen. "But we need to address the training phase. I want to add a session where participants learn to bracket interpretation. Teach them to describe the raw qualia before they label it."

  "No," Mara said sharply. "That changes the phenomenon. You're not measuring baseline consciousness anymore; you're measuring their skill at your specific method. You're inducing the state you claim to observe."

  "I'm calibrating the instrument," Idris insisted. "Without it, the folk psychology noise drowns the signal."

  "If you train them, you invalidate the comparison with the untrained verbal report," Mara said. "The discordance between the 'flicker' report and the accurate tracing is the discovery. It shows the report-generating mechanism is distinct from the motor-guidance mechanism. If you train them to align the two, you hide the dissociation."

  Iris rubbed his chin. He looked at the pilot data again. The gap between what they said and what they drew was indeed the most interesting feature. "Alright. No formal training phase. We stick to standard instructions." He conceded the point, though it cost him control over the folk psychology contamination. "But what about the three-week follow-up?"

  Mara stiffened. "That's where your method worries me most. You want to show them their tracings and ask if they remember seeing the shape."

  "It's retrospective elicitation," Idris said. "Standard disciplined first-person procedure. They recognize the output and validate the experience."

  "It's confabulation," Mara said. "You show them a drawing they made, and three weeks later, they construct a narrative to make sense of it. They say, 'I must have seen it,' because seeing the drawing implies they saw the shape. It's a judgment about the artifact, not a memory of the stimulus."

  Idris went quiet. He looked at the follow-up protocol draft. "You're saying the utterance isn't a recovery of the perceptual event."

  "It's a judgment about the tracing," Mara said. "They are inferring experience from behavior because you presented the behavior as evidence. It's post-hoc rationalization."

  Idris exhaled slowly. "If I keep that as a primary measure, I'm vulnerable to the charge that I'm leading the witness. It undermines the rigor." He paused, weighing the cost. "Okay. The follow-up utterance is secondary. Qualitative only. We treat it as a narrative reconstruction of the session, not evidence of the original percept."

  "Agreed," Mara said. "Now, the primary outcome. We need a criterion for 'being conscious of the shape' that doesn't presuppose your realism or my skepticism."

  "We use the tracing correlation," Idris said. "But we phrase it carefully."

  "Not 'conscious of'," Mara warned. "That presupposes the tracing *is* the consciousness."

  "Operational criterion," Idris proposed. "A trial is counted as 'explicitly processed' if the tracing correlation exceeds r = 0.5, regardless of verbal report."

  "That works for the data," Mara said, "but the interpretation section needs to reflect the heterophenomenological stance. The tracing is a behavioral index that correlates with stimulus properties. Whether that implies consciousness is a theoretical inference, not a measurement."

  "And my side?" Idris asked. "The interpretation must allow that the tracing reveals a capacity for experience that the verbal report fails to capture. The 'grey flicker' is the error, not the tracing."

  Mara typed for a moment, the keys clicking in the quiet lab. "We write: 'Primary outcome is motor-indexed discrimination. Discrepancies between verbal report and motor output are analyzed as dissociations between conceptual narration and sensorimotor integration.'"

  Idris read the screen. "It doesn't say 'consciousness.'"

  "It doesn't have to," Mara said. "The funder wants to know if they detect the shape. The tracing proves detection. Whether that detection was accompanied by a 'grey flicker' or a 'hidden image' is what we're debating with the data, not what we're assuming in the preregistration."

  Idris nodded slowly. "You get your neutrality. I get my metric."

  "But," Mara added, highlighting a clause, "we must preregister that the verbal report is the canonical text for the participant's *claimed* experience. You can't override it with the tracing in the analysis of subjective claims."

  "And you can't override the tracing with the verbal report in the analysis of information access," Idris countered.

  "Deal." Mara hit save. "We're measuring the gap, Idris. Not the content."

  "The gap is where the mind is," Idris said softly.

  "Or where the mechanisms diverge," Mara replied. She closed the laptop. "Coffee?"

  "Coffee," Idris agreed. They left the document open, the cursor resting on the agreed definition, a temporary ceasefire written in code.
