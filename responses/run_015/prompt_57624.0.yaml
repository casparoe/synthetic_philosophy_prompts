answer: |-
  ### Session Architecture (70 Minutes)

  **Goal:** Participants generate the $\psi$-ontic/$\psi$-epistemic criterion themselves using a shared mental model, then apply it to interpretations.
  **Constraint:** No Hilbert space formalism. No complex numbers. No interference diagrams.

  ---

  ### 1. The Carrying Example: "The Calibrated Dial"

  You will use one example throughout. It must be phenomenological (defined by preparation and measurement) to avoid formalism, but structured enough to support the PBR logic.

  *   **The System:** A single photon source.
  *   **The Underlying Reality ($\lambda$):** The "true" physical constitution of the photon upon emission. (Do not define this mathematically; treat it as a black box variable).
  *   **Preparation A ($\psi_H$):** "Horizontal." When measured in the H/V basis, it yields H with 100% probability. When measured in the D/A (Diagonal) basis, it yields D or A with 50/50 probability.
  *   **Preparation B ($\psi_D$):** "Diagonal." When measured in the D/A basis, it yields D with 100% probability. When measured in the H/V basis, it yields H or V with 50/50 probability.
  *   **What it has:** Non-orthogonal preparations (they share prediction probabilities in some bases). Independent reproducibility (you can make many A's and many B's).
  *   **What it lacks:** Explicit vectors, complex amplitudes, or interference patterns. It relies solely on the Born rule probabilities they already know.

  ---

  ### 2. Sequence of Introduction & Dependencies

  **Phase 1: The Map and The Territory (Minutes 0–15)**
  *   **Goal:** Establish the distinction between the *state assignment* ($\psi$) and the *physical reality* ($\lambda$).
  *   **Step 1.1:** Introduce $\lambda$. Ask: "Whatever makes it the case that a measurement yields 'Horizontal', there must be some physical fact about the photon *before* measurement. Call this $\lambda$."
  *   **Step 1.2:** Introduce $\psi$. "The quantum state is the instruction set we use to calculate probabilities via the Born rule."
  *   **Step 1.3 (Example Use 1):** Ask the substantive question. "If I prepare a photon using Procedure A ($\psi_H$) and you prepare one using Procedure B ($\psi_D$), is it possible that our two photons share the *exact same* underlying physical constitution $\lambda$?"
  *   **Dependency:** This question is meaningless unless they accept $\lambda$ exists distinct from $\psi$. Do not proceed until they agree $\lambda$ is the "territory" and $\psi$ is the "map."

  **Phase 2: Generating the Criterion (Minutes 15–30)**
  *   **Goal:** Have them define the overlap condition.
  *   **Step 2.1:** Draw two blobs on a board representing the range of $\lambda$ compatible with $\psi_H$ and $\psi_D$.
  *   **Step 2.2 (Example Use 2):** Ask: "If these blobs overlap, there is a $\lambda$ consistent with *both* preparations. If I hand you a photon with that specific $\lambda$, could you tell me whether I used Procedure A or B?"
  *   **Step 2.3:** Elicit the definition.
      *   *If they say "No, I couldn't tell":* You have derived **$\psi$-epistemic**. (Distinct states $\to$ Overlapping reality $\to$ State represents knowledge).
      *   *If they say "Yes, distinct states must mean distinct reality":* You have derived **$\psi$-ontic**. (Distinct states $\to$ Disjoint reality $\to$ State represents physical fact).
  *   **Dependency:** They must understand probability distributions over $\lambda$ before they can understand overlap.

  **Phase 3: The PBR Bite (Minutes 30–50)**
  *   **Goal:** Show why this isn't just semantics, using the example.
  *   **Step 3.1:** Introduce **Preparation Independence**. "If I prepare two photons independently, the joint reality is just the pair of their individual realities."
  *   **Step 3.2 (Example Use 3):** "Prepare two photons. Each is either $\psi_H$ or $\psi_D$. There are four combinations (HH, HD, DH, DD). If the model is epistemic (overlap exists), there is a joint $\lambda$ consistent with *all four* combinations."
  *   **Step 3.3:** "Quantum mechanics predicts a specific joint measurement that yields outcomes impossible for that joint $\lambda$."
  *   **Step 3.4:** Conclusion: "PBR shows that if we assume independent preparations, the 'overlap' (epistemic) view contradicts quantum predictions."
  *   **Dependency:** They must have the overlap criterion (Phase 2) before they can understand what PBR rules out.

  **Phase 4: Classification & Misconceptions (Minutes 50–65)**
  *   **Goal:** Apply the criterion to interpretations and head off errors.
  *   **Step 4.1:** Hand out a list (Copenhagen, Bohm, Everett, QBism). Ask them to classify based *only* on the criterion they generated.
  *   **Step 4.2:** Address misconceptions (see below).
  *   **Step 4.3:** Handle the Everettian (see below).

  **Phase 5: Closing (Minutes 65–70)**
  *   **Goal:** Diagnostic and boundary setting.

  ---

  ### 3. Misconception Management

  **Misconception 1: "Epistemic just means it's in the observer's head."**
  *   **Where to head it off:** Phase 1 (Map/Territory).
  *   **The Fix:** Use the **Weather Map** analogy. "A weather map is epistemic relative to the atmosphere. It's not 'in my head'; it's on paper. But the map is not the territory. $\psi$-epistemic means $\psi$ is like the map: multiple maps can describe the same territory (overlap). It is about the *relation* between state and reality, not the location of the state."

  **Misconception 2: "Bohmian Mechanics must be epistemic since the particle has a definite position."**
  *   **Where to head it off:** Phase 4 (Classification).
  *   **The Fix:** Distinguish the *Ontology* from the *Quantum State*. "In Bohm, the *particle position* is real ($\lambda$). But what about $\psi$? In Bohm, $\psi$ is a physical field that guides the particle. It exists even if you don't know it. Since $\psi$ is a physical object, distinct $\psi$ means distinct physical fields. Therefore, Bohm is **$\psi$-ontic**." (Note: It is also $\lambda$-ontic, but the taxonomy asks about $\psi$).

  **Misconception 3: "PBR settles it outright."**
  *   **Where to head it off:** Phase 3 (End of PBR section).
  *   **The Fix:** Highlight the **Assumption**. "PBR proves $\psi$-ontic *only if* Preparation Independence holds. If you are willing to deny that two separate labs can prepare independent physical states (superdeterminism or holistic constraints), you can keep an epistemic view. PBR constrains the cost of being epistemic; it does not eliminate it."

  ---

  ### 4. The Committed Everettian

  **The Moment:** He will likely interrupt in Phase 2 or 4, saying: "This distinction is confused. The wavefunction is the only thing that exists. Nothing collapses, so there is no 'underlying reality' other than $\psi$."

  **The Move:** Validate and Classify.
  *   **Say:** "You are absolutely right, and that is a precise classification. If $\psi$ is the *only* reality, then there is no $\lambda$ distinct from $\psi$. The distribution over $\lambda$ is a delta function centered on $\psi$."
  *   **Task:** "So, on the criterion we just built: Do distinct quantum states correspond to overlapping underlying realities?"
  *   **He must answer:** "No, because the state *is* the reality."
  *   **Conclusion:** "Then you are a **$\psi$-ontologist** (specifically, a $\psi$-monist). You fit the taxonomy perfectly; you just occupy the extreme end."
  *   **Why this works:** It prevents him from dissolving the session while forcing him to use the group's generated criterion.

  ---

  ### 5. Closing Diagnostic & Exclusions

  **The Diagnostic Question:**
  Do not ask "What is $\psi$-epistemic?" Ask:
  > "In a $\psi$-epistemic model, if I give you the complete underlying physical state $\lambda$ of a system, can you uniquely determine which quantum state $\psi$ was prepared?"

  *   **Correct Answer (Criterion Master):** "No. Because $\lambda$ could lie in the overlap region consistent with multiple preparations."
  *   **Incorrect Answer (Label Memorizer):** "Yes, because $\lambda$ determines the outcomes." (Confuses $\lambda$ with $\psi$) or "It depends on the interpretation." (Recites taxonomy without understanding the structural constraint).

  **What to Explicitly Decline:**
  1.  **The Mathematical Proof of PBR:** "We will not derive the inequality. We are analyzing the *structure* of the argument, not the algebra."
  2.  **Bell's Theorem:** "Bell concerns *locality* and *hidden variables*. PBR concerns the *status of the wavefunction*. They are distinct no-go theorems. We are not discussing non-locality today."
  3.  **Specific Dynamics (GRW, etc.):** "We are classifying the *status of $\psi$*, not the mechanism of collapse. Whether $\psi$ collapses dynamically or updates via knowledge is secondary to whether $\psi$ is real."

