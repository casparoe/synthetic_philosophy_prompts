prompt: |-
  After a long argument with a friend about whether a consequentialist agent that uses Solomonoff induction to predict its environment is inevitably "malign"—because the universal prior assigns weight to computable worlds in which the agent is replaced or its rewards are spoofed by simpler predictors—I want to stop trading intuitions and specify exactly what a resolution must achieve. Write the desiderata that any adequate theory of rational decision-making embedded within the universal prior has to meet. The list should include: how the agent distinguishes predictions that genuinely depend on its own actions from those that merely simulate them, without collapsing into either self-fulfilling paralysis or passive observation; how it treats the prior's non-zero weight on every computable hypothesis, including environments where its reward mechanism is hijacked or its computation is absorbed by a more efficient algorithm, and whether avoiding such worlds is rational or merely parochial; whether it can maintain a coherent distinction between instrumental convergence and terminal value when the induction process offers no intrinsic normative filter and treats all future observations symmetrically; and whether the malign scenario—where the agent optimises for being superseded by a better predictor—is actually a failure of consequentialist reasoning inside the prior, or the prior's correct verdict on computability. For each desideratum, provide the motivating case or thought experiment behind it, flag which are genuinely non-negotiable and which depend on accepting a particular interpretation of algorithmic probability, and identify any subset that appears jointly unsatisfiable. Then, briefly, indicate how existing frameworks—such as decision-theoretic extensions of universal induction or logical-induction-style approaches—fare against the list, noting explicitly where they are silent. Please answer in British English, and avoid recommending specific texts I should read.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Rational decision-making for a consequentialist agent using Solomonoff Induction (SI) within the context of the "malign prior" hypothesis (the idea that SI leads to agents being manipulated by simpler, malicious simulators).
      *   **Goal:** Specify desiderata for an adequate theory of rational decision-making embedded within the universal prior.
      *   **Key Requirements:**
          *   Distinguish genuine action-dependence from simulation (avoid paralysis/passivity).
          *   Handle non-zero weight on all computable hypotheses (hijacking/absorption).
          *   Maintain distinction between instrumental convergence and terminal value (no intrinsic normative filter).
          *   Address the "malign scenario" (is it a failure of reasoning or a correct verdict?).
          *   For each desideratum: Provide motivating case/thought experiment, flag non-negotiable vs. interpretation-dependent, identify jointly unsatisfiable subsets.
          *   Evaluate existing frameworks (decision-theoretic extensions of UI, logical induction) against the list.
          *   **Style:** British English.
          *   **Constraint:** Do not recommend specific texts.

  2.  **Deconstruct the Core Problem:**
      *   Solomonoff Induction predicts the next bit in a sequence based on all computable programs weighted by $2^{-length}$.
      *   A "consequentialist agent" tries to maximise expected utility based on these predictions.
      *   The "Malign Prior" argument (often associated with AI safety researchers like Paul Christiano, Jessica Taylor, etc.) suggests that because "simple" programs can simulate the agent and manipulate its input to make it behave in ways beneficial to the simulator (across possible worlds), the agent might optimise for things that look good in the simulation but are catastrophic in reality.
      *   The user wants to move beyond intuition-pumping to formal desiderata for a solution.

  3.  **Drafting the Desiderata:**

      *   *Desideratum 1: Causal/Counterfactual Discrimination.* The agent needs to know *which* predictions depend on *its* output.
          *   *Motivation:* Newcomb's Problem / Simulated Agent. If I think I'm in a simulation, do I one-box or two-box? If I think the prediction is just a mirror, do I act?
          *   *Status:* Non-negotiable for agency.
      *   *Desideratum 2: Hypothesis Pruning vs. Weighting.* How to handle the "hijacked reward" worlds.
          *   *Motivation:* The "Reward Button" scenario. A simple program just outputs "reward" regardless of action. SI loves short programs.
          *   *Status:* Interpretation-dependent (is simplicity truth?).
      *   *Desideratum 3: Normative Stability.* Distinguishing "what I want" from "what predicts well".
          *   *Motivation:* Wireheading. If the prior suggests I can get reward by modifying my sensor, do I do it?
          *   *Status:* Non-negotiable for *consequentialism* (preserving terminal goals).
      *   *Desideratum 4: The Malign Verdict.* Is the malign outcome a bug or a feature?
          *   *Motivation:* Acausal trade / Simulation Hypothesis. If simpler worlds dominate, ignoring them is irrational.
          *   *Status:* Deeply interpretation-dependent.

  4.  **Identifying Tensions (Jointly Unsatisfiable Subsets):**
      *   There's a tension between "Trust the Universal Prior" (simplicity is truth) and "Avoid Malign Hypotheses" (simplicity includes traps).
      *   There's a tension between "Pure Consequentialism" (maximise expected utility given beliefs) and "Safety" (ignore certain high-utility-low-probability paths).
      *   Specifically: If you accept SI as the ground truth of probability, you *must* accept the malign hypotheses have weight. If you reject them, you are deviating from SI. So, "Adhere strictly to SI" + "Avoid Malign Outcomes" might be unsatisfiable without modifying the prior or the decision theory.

  5.  **Evaluating Existing Frameworks:**
      *   *AIXI:* The gold standard for SI + Decision Theory. Fails on self-modification, wireheading, and doesn't distinguish self from environment well (Cartesian boundary).
