answer: |-
  Your graph measures the biomass of the host, not the health of the organism. You are tracking calories and headcount, which naturally accumulate as more polities enter the expansion phase simultaneously. That is not progress; it is merely staggered birth rates. If you want variables that move *within* the lifecycle and signal the turn from growth to decay before the collapse is visible to a linear eye, look at the cost of cohesion. Specifically, track the ratio of state revenue required to collect a unit of tax, the proportion of security forces drawn from outside the core cultural bond, and the rate of elite overproduction relative to available state positions.

  In the Khaldunian framework, the early phase is characterized by low fiscal extraction because the group bond (*asabiyyah*) is tight; people pay willingly, and they fight for themselves. As the cycle matures into the third generation, the bond frays. The state must pay mercenaries or contractors to enforce order because the citizens no longer identify with the project. Simultaneously, you see a spike in credentialed elites competing for a stagnant number of power positions. These variables moved decisively in the USSR between 1970 and 1985. Energy capture was still high, population was stable, yet the cost of maintaining the ideology and the security apparatus skyrocketed while elite circulation froze. A linear model sees a superpower at peak energy; the cyclical model saw a gerontocracy relying on bought loyalty and force, predicting fragmentation regardless of global energy trends. The cycle predicts *internal* dissolution despite *external* capacity, which your graph misses entirely.
