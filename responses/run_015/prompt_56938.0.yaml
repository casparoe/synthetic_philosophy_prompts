answer: |-
  Your hunch is astute, but I argue it identifies the *mechanism* of the deadlock rather than its *engine*. The disagreement over whether to fix the extension of 'resentment' by phenomenology or functional role is indeed where the debate grinds, but it grinds there because the two camps are answering **two distinct questions under one name**.

  I favour the diagnosis that the deadlock arises from conflating **the justification of a practice** (a transcendental/anthropological question) with **the criticizability of a single attitude** (a normative/metaphysical question).

  ### The Diagnosis: Two Questions, One Name

  The Strawsonian project is fundamentally descriptive-transcendental. When Strawson argues that the objective attitude cannot be sustained wholesale, he is making a claim about the *conditions of possibility* for human interpersonal relationships. For the Strawsonian, the question is: *"What must we be like to participate in a moral community?"* The answer is: *"Beings who feel reactive attitudes."* On this view, the justification for the practice of holding responsible is its inescapability; it is justified because it is constitutive of the form of life we value. Consequently, they fix the extension of 'resentment' by **phenomenology**. If the feeling is present, the practice is alive. If the skeptic claims to have suspended it, the Strawsonian sees a self-deceived participant, because the functional role (censure, exclusion) implies the underlying participatory stance.

  The Skeptic's project is fundamentally normative-metaphysical. They are not asking what we *must* do to be social, but what we *may* do given the facts of causation. Their question is: *"Is it fair to inflict the pain of blame on an agent who could not have done otherwise?"* On this view, the attitude is a tool subject to moral evaluation. If the tool presupposes a falsehood (libertarian freedom), it is defective, regardless of its utility. Consequently, they fix the extension of 'resentment' by **functional role** relative to *desert*. If the behavior (censure) persists but the belief in basic desert is removed, they view the attitude as successfully reshaped.

  The deadlock occurs because the Strawsonian hears the Skeptic's "reshaped attitude" and says, "You are still participating in the practice (Justification of Practice)," while the Skeptic hears the Strawsonian's "inescapable feeling" and says, "You are still committed to an unfair metaphysics (Criticizability of Attitude)."

  Your hunch about phenomenology vs. functional role is the *symptom* of this deeper category mistake. The Strawsonian insists on phenomenology because they are defending the *form of life*. The Skeptic insists on functional role because they are defending the *moral coherence* of the individual agent's stance. They are talking past each other because one is arguing from **necessity** (we can't help it) and the other from **legitimacy** (we shouldn't do it).

  ### What Counts as Progress?

  Neither a study nor a simple distinction will resolve this.
  *   **A study** (the suppressed empirical question) will fail because psychological data cannot bridge the is-ought gap. Even if neuroscience proved the skeptic feels no physiological arousal during censure, the Strawsonian would reply that the *social meaning* of the act remains retributive.
  *   **A distinction** (simply labeling the two questions) is necessary but insufficient. Philosophers have already distinguished "desert" from "accountability," yet the deadlock persists because the *stakes* remain entangled.

  Progress requires a **Reframing** of the debate from a truth-conditional contest to a **negotiation of values**.

  We must stop asking, *"Which side correctly describes the nature of Responsibility?"* and start asking, *"How do we negotiate the tension between our moral ideals (fairness) and our psychological nature (reactivity)?"*

  This reframing suggests a **pluralistic approach** to responsibility practices:
  1.  **Acknowledge the Strawsonian Truth:** Admit that wholesale suspension of the participatory stance is psychologically impossible and socially undesirable for intimate relationships. In these spheres, phenomenology rules.
  2.  **Acknowledge the Skeptic Truth:** Admit that in institutional spheres (criminal justice, public censure), the functional role of blame can and should be decoupled from the phenomenology of retributive resentment. In these spheres, forward-looking functions rule.

  Progress is achieved when the debate shifts from "Who is right about resentment?" to "In which contexts is it permissible to prioritize social participation over metaphysical fairness, and vice versa?" This moves the deadlock from an ontological impasse to a political and ethical design problem. We stop trying to win the argument and start designing the practices.
