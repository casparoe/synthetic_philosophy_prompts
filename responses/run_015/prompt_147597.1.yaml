answer: |-
  This is a sophisticated and well-recognized problem in Augustinian scholarship. The frustration you feel is not a failure of your reading but a reflection of a genuine aporia in Augustine's own moral theology. The stalemate you describe is not merely a matter of scholarly inertia; it is structural, arising from a tension between Augustine's **ontological definition of truth** and his **pastoral management of speech**.

  Here is a diagnosis of the disagreement's structure, an analysis of whether it is substantive or verbal, and an assessment of whether the impasse can be broken.

  ### 1. Diagnosis of the Disagreement's Structure

  The deadlock exists because both camps are isolating different vectors of Augustine's complex definition of a lie (*mendacium*). Augustine defines a lie not merely as a false statement, but as *enuntiatio contra mentem* (an utterance against the mind) coupled with the *voluntas fallendi* (will to deceive).

  **Camp A (The Ontological/Absolutist)**
  *   **Textual Emphasis:** They prioritize *De Mendacio* (On Lying), specifically the early chapters where Augustine establishes the metaphysics of speech.
  *   **Core Argument:** For Augustine, speech is a sacrament of the mind (*sacramentum mentis*). Its purpose is to make the interior exterior. Any voluntary divergence between what is in the heart and what exits the mouth violates the *ordo* of creation.
  *   **View on Silence:** They argue that if silence or ambiguity is employed with the *intent to deceive* (to make the listener believe a falsehood), it is functionally equivalent to a false assertion. The sin lies in the dislocation of the soul from Divine Truth, not just in the phonetic falsity.
  *   **Blind Spot:** They often struggle to account for Augustine's specific pastoral advice on evasion without explaining why evasion isn't just a "silent lie."

  **Camp B (The Communicative/Contextualist)**
  *   **Textual Emphasis:** They prioritize *Contra Mendacium* (Against Lying) and Augustine's letters regarding the persecution of Christians (e.g., hiding clergy from Donatists or imperial officials).
  *   **Core Argument:** They focus on Augustine's distinction between *suppressio veri* (suppression of truth) and *suggestio falsi* (suggestion of falsehood). Augustine explicitly states one is not obliged to tell the truth to those who have no right to it (e.g., persecutors).
  *   **View on Silence:** They argue Augustine permits "hiding the truth" (*veritatem occultare*) provided one does not "bring forth a lie" (*proferre mendacium*). Strategic silence is a shield, not a sword.
  *   **Blind Spot:** They sometimes downplay Augustine's insistence that the *intent to deceive* is itself sinful, even if no false words are spoken, if that intent disrupts charity.

  **The Structural Conflict:**
  The disagreement is not just about what Augustine *said*, but about where they locate the **locus of moral injury**.
  *   Camp A locates it in the **Speaker's Soul** (alignment with God).
  *   Camp B locates it in the **Social Exchange** (harm to the neighbor/trust).

  ### 2. Substantive vs. Verbal: Is it a Definition Problem?

  It is **both**, but the verbal disagreement masks a substantive theological tension.

  **The Verbal Layer:**
  The camps are using "lie" to denote different phenomenological boundaries.
  *   Camp A uses "lie" to mean **Deceptive Intent**. (If you intend to deceive, you are lying, regardless of medium).
  *   Camp B uses "lie" to mean **False Assertion**. (If you do not assert a falsehood, you are not lying, regardless of intent).
  *   *Augustine's Usage:* Augustine technically sides with Camp B on definition (a lie requires utterance *contra mentem*), but he sides with Camp A on the *sinfulness of the intent*. He condemns the *will* to deceive even in silence, but he does not classify the silence itself as a *mendacium*. The scholars are fighting over whether the *sin* of the intent makes the *act* of silence a "lie."

  **The Substantive Layer:**
  The deeper issue is the **Teleology of Truth**.
  *   **Ontological Truth (Camp A):** Truth is a property of Being. To lie is to participate in Non-Being (evil). Therefore, any movement toward Non-Being (deception) is absolutely prohibited.
  *   **Communicative Virtue (Camp B):** Truth is a social bond. To lie is to break the bond of human society (*societas*). Therefore, if the social bond is already broken (e.g., by a persecutor), the obligation to truth-telling is mitigated.

  Augustine holds both views simultaneously. He believes truth is ontological *and* that speech is for society. The stalemate arises because scholars try to make Augustine consistent on one axis at the expense of the other.

  ### 3. Is There a Hidden Empirical Question?

  You asked if a hidden empirical question about early Christian rhetorical practice is doing the work. **The answer is likely no,** but a hidden **polemical** context is.

  New historical data on how Christians hid priests will not solve this because Augustine's texts are not descriptive reports; they are **normative boundaries**. We know Christians hid priests. The question is how Augustine justified it theologically.

  However, the **polemical context** is crucial and often underweighted by Camp B. Augustine wrote *De Mendacio* largely against the **Priscillianists**, a sect that defended lying to protect orthodoxy ("Lie to save the faith").
  *   **Camp A** captures Augustine's polemical rigidity: He cannot grant *any* ground to the Priscillianist logic that "good ends justify deceptive means."
  *   **Camp B** captures Augustine's pastoral reality: He cannot tell a Christian to hand over a priest to be martyred unnecessarily.

  The deadlock persists because scholars argue over whether Augustine's anti-Priscillianist polemic (absolute prohibition) overrides his pastoral counsel (protect the innocent). This is not an empirical question but a **hierarchical** one: Which Augustinian imperative trumps the other?

  ### 4. Pathways Forward: Can the Impasse Be Broken?

  If your goal is to declare one side the "winner," you will likely fail. Augustine's texts sustain both readings because his ethics are pulled between the **City of God** (where truth is absolute) and the **City of Man** (where survival requires discretion).

  However, you can advance the seminar discussion by **reframing the distinction**. Do not ask "Is it a lie?" Ask "What kind of charity (*caritas*) is being served?"

  **Proposed Reframing: The Hierarchy of Goods**
  Augustine's ethics are not deontological (rule-based) in a modern Kantian sense; they are **teleological** (ordered love).
  1.  **The Highest Good:** Union with God (Truth).
  2.  **The Secondary Good:** The safety of the neighbor (Charity).
  3.  **The Conflict:** Lying damages Good #1 to save Good #2.
  4.  **The Resolution:** Augustine argues you cannot damage Good #1 to save Good #2, because Good #1 is the source of all good. *However*, you are not required to reveal Good #2 to those who would destroy it.

  **A Conceptual Distinction to Propose:**
  Introduce the distinction between **Material Falsity** and **Formal Deception**.
  *   Augustine forbids Formal Deception (the will to lead another into error).
  *   Camp A argues Strategic Silence *is* Formal Deception.
  *   Camp B argues Strategic Silence is *not* Formal Deception because the speaker asserts nothing.
  *   **Advancement:** Suggest that for Augustine, the sin is not the *information gap* created, but the **betrayal of the sign**. A sign exists to signify. To use a sign (speech) to obscure is a sin; to withhold the sign (silence) is not, *unless* the withholding is itself a sign intended to deceive (e.g., a nod or a significant pause).

  ### 5. Honest Assessment: Permanent Impasse?

  You should expect a **permanent impasse** if the goal is to render Augustine perfectly consistent. He is not consistent. He is a bishop managing a fallen world while preaching the standards of heaven.

  *   **Why it won't resolve:** The tension is theological, not textual. It mirrors the tension between Divine Justice (absolute) and Divine Mercy (contextual). As long as Christian ethics grapple with the "dirty hands" problem (how to remain holy in a sinful world), Augustine's treatises on lying will sustain contradictory readings.
  *   **How to use this in your seminar:** Do not try to solve the stalemate. **Diagnose it as the feature, not the bug.**
      *   Argue that the stalemate reveals the limit of language ethics in a fallen world.
      *   Show that Camp A represents the **Eschatological Augustine** (the saint who sees God face to face).
      *   Show that Camp B represents the **Pastoral Augustine** (the bishop shepherding sheep among wolves).
      *   Conclude that the "truth" of Augustine's ethics is found in the *tension* between these two poles, not in the resolution of one over the other.

  **Recommendation for your paper:**
  Shift the focus from "Did Augustine allow lying?" to "How does Augustine's prohibition on lying function to protect the *societas* of the Church?"
  Argue that the absolutism (Camp A) is necessary to maintain the *internal* trust of the Christian community, while the nuance (Camp B) is the *external* defense mechanism against a hostile world. The "stalemate" is actually a **boundary marker**: Inside the Church, absolute transparency; outside the Church, prudent silence. This distinction respects both textual traditions without forcing a false consistency.
