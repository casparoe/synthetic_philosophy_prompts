      *   *Sentence 6 (The Normative Claim):* "And because calibration is the only fairness criterion that ensures a score means the same thing for people in every group, the resulting disparity in final scores isn't really discrimination — it's just the mathematically unavoidable consequence of the groups having different default rates."
