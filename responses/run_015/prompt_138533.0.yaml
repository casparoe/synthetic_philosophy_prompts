          *   *Problem 3:* "Isn't really discrimination" is a legal/ethical judgment, not a mathematical one. Math can show constraints, not moral categories.
          *   *Problem 4:* The two-stage process allows for *intervention*. You can adjust $S'$ specifically to achieve Reassessment Balance, potentially at the cost of calibration of $S'$, but that doesn't mean the disparity is "unavoidable" in the system design, only that you must trade off criteria.
