      *   *Better Lens:* Sociology of Professions (Abbott/Freidson). Diagnosis as jurisdiction. The insurance/resource allocation model (User's background). These explain *why* the category shifted (to maintain relevance/revenue) better than Szasz's "myth" ontology.

