answer: |-
  This is one of the most common points of confusion in science, and your intuition is actually better than your brother-in-law's shorthand. When he says "personality is 50% genetic," he is using a technical statistic as a soundbite, and it inevitably misleads people.

  Here is the plain-language truth: **Heritability is not a measure of how much genes build a trait. It is a measure of why people *differ* from each other in a specific place at a specific time.**

  It is a ratio of **variances** (spreads of difference), not a recipe for an individual.

  Here is the breakdown of your four questions.

  ### 1. Why does heritability go up when environments become identical?

  You asked: *"How can a number that's supposed to be about genes move when all you did was change the environment? Does that mean it's secretly measuring how unequal the environments were?"*

  **Yes. Exactly.**

  Imagine you have two bags of mixed flower seeds (Bag A and Bag B). They contain the exact same mix of "tall" and "short" genetics.
  *   **Scenario 1:** You plant Bag A in rich soil and Bag B in poor soil.
      *   The plants in Bag A will be taller than Bag B.
      *   If you look at the *differences* between the plants, most of that difference is because of the soil (Environment).
      *   Heritability is **low**.
  *   **Scenario 2:** You plant both bags in identical, perfect greenhouse conditions.
      *   Now, the soil is the same for everyone. The *only* reason one plant is taller than another is because of the seed (Genes).
      *   Heritability is **high** (near 100%).

  Nothing changed about the seeds. But in Scenario 1, the "noise" from the soil was so loud it drowned out the signal from the genes. In Scenario 2, you silenced the noise, so the genetic signal became the only thing left explaining the differences.

  So, a heritability number *is* secretly measuring how unequal the environments are relative to how unequal the genes are. If everyone has the exact same environment, heritability *must* be 100%, because genes are the only thing left that *can* vary.

  ### 2. Can you have a heritability number for a single individual?

  You asked: *"Take one kid who's six inches taller than average... how much of those six inches is genes?"*

  **The answer is no. That question is a category error.** It is like asking, "How much of this cake's fluffiness is due to the oven, and how much is due to the baking powder?"

  You cannot separate them in the finished product.
  *   If you had no baking powder (genes), the oven (environment) wouldn't matter; you'd have a brick.
  *   If you had no oven (environment), the baking powder wouldn't matter; you'd have raw batter.

  For a single person, genes and environment are multiplied, not added. They interact.

  To make your question "well-posed," you would have to ask a **counterfactual**:
  *   "How much taller would *this specific child* be if we swapped their genes for the average person's genes, keeping their life exactly the same?"
  *   OR: "How much taller would *this specific child* be if we kept their genes but moved them to the average environment?"

  Since we can't clone people or put them in parallel universes, we can never answer this for an individual. Heritability only works when you look at a **group** and ask, "Why are *they* different from each other?" It cannot tell you why *you* are you.

  ### 3. Group differences and the "100% Heritable but Preventable" paradox

  You asked for a made-up example where a trait is heritable inside groups, but the gap between groups is environmental.

  **The Two Greenhouses Example:**
  Imagine we have one type of corn seed. We know that within this seed type, some plants naturally grow 7 feet and some grow 5 feet due to genetic variation. The heritability of height is **80%**.

  *   **Greenhouse 1 (USA):** We keep the temperature at 75°F.
      *   The plants vary from 5 to 7 feet.
      *   Since the temperature is constant, the variation is mostly genetic.
      *   **Heritability inside USA: 80%.**
  *   **Greenhouse 2 (Canada):** We keep the temperature at 50°F.
      *   The plants are stunted. They vary from 3 to 5 feet.
      *   Since the temperature is constant (just cold), the variation *within* this group is still mostly genetic (the 5-footers are still genetically taller than the 3-footers).
      *   **Heritability inside Canada: 80%.**

  **The Comparison:**
  *   The average height in USA is 6 feet.
  *   The average height in Canada is 4 feet.
  *   **The Gap:** 2 feet.
  *   **The Cause:** 100% Environmental (Temperature).
  *   **The Genetics:** Identical.

  This proves that high heritability *within* groups tells you **zero** about what causes the difference *between* groups.

  **Can something be 100% heritable and 100% preventable?**
  **Yes.** Your PKU (amino acid) example is the perfect case.

  Phenylketonuria (PKU) is a genetic condition that causes intellectual disability if the person eats phenylalanine (an amino acid in normal food).
  *   In a population eating a normal diet: Who gets intellectual disability? Only the kids with the PKU gene.
  *   Therefore, the *variation* in disability is 100% explained by genetics. **Heritability = 100%.**
  *   **The Fix:** Put *everyone* on a special diet (change the environment).
  *   Now, nobody gets the disability. The trait is prevented.

  The heritability was high because the environment was *constant* (everyone ate normal food). Once you changed the environment, the genetic difference no longer mattered. High heritability does **not** mean "unchangeable." It means "currently dependent on genes because the environment isn't varying enough to matter."

  ### 4. The Seed-Saving Application

  This is where the rubber meets the road for you.

  You asked: *"Does a heritability number tell us anything about whether picking the winners in these gardens will actually give us better beans next year?"*

  **Yes, but you have to be careful which heritability number you are talking about.**

  In your neighborhood, you have huge environmental variance ($V_E$). Some gardens have great soil; some have bad soil.
  *   If you pick the biggest bean plant from the best garden, you are mostly selecting for **Great Soil**, not Great Genes.
  *   If you plant those seeds next year in an average garden, they will likely perform poorly. This is called "Regression to the Mean."

  **The Heritability you want:**
  You want to know the **Heritability of Yield across your specific neighborhood conditions.**
  *   If your neighborhood gardens are *wildly* different (high $V_E$), the heritability of yield will be **low**.
  *   If heritability is low, selecting the "winners" based on size is a bad strategy. You're mostly selecting luck (location).

  **How to fix your seed saving strategy:**
  To get a heritability number that helps you breed better beans, you need to reduce the environmental noise.

  1.  **The "Common Garden" Test:** If you really want to find the best genetics, take seeds from 20 different plants and grow them *all* in the *same* plot of land (same soil, same water).
      *   Now, $V_E$ is minimized.
      *   If Plant A is still taller than Plant B in the same soil, that difference is Genetic.
      *   Save seeds from Plant A.

  2.  **The "Average It Out" Method:** If you can't do a common garden, don't save seeds from the single biggest plant in the best garden.
      *   Save seeds from the top 10% of plants *across all gardens*.
      *   By sampling across many environments, you average out the soil effect. The plants that perform well in bad soil *and* good soil likely have better genes.

  **Summary for your group:**
  Tell them: "A heritability number isn't about how 'genetic' the bean is. It's about whether the differences we see are due to the seed or the soil. Right now, our soils are too different. If we pick winners based on size alone, we are selecting for soil, not seeds. To make progress, we either need to grow a test patch in one yard, or we need to select plants that did well despite bad soil."

  ### The Bottom Line

  Your brother-in-law is technically right that "50% genetic" is a real statistic, but he is wrong if he implies it means "50% of *you* is built by genes."

  *   **Heritability** = Why do we differ? (Population question)
  *   **Causation** = What built this trait? (Individual question)

  You can have a trait that is 100% genetic (like having two eyes) but 0% heritable (because nobody varies, so genes explain no *differences*). You can have a trait that is 0% genetic (like speaking English) but highly heritable in a specific population (if everyone in the room speaks English except the one immigrant, the *difference* is due to their background/genes).

  Trust your intuition on the sister example. You two share 50% of your varying genes, but you grew up in slightly different micro-environments (different friends, different teachers, different years). Those small environmental differences were enough to make you distinct, regardless of what the population-wide heritability statistic says.
