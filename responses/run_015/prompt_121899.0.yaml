prompt: |-
  ok so im giving a seminar talk tuesday in the poli-sci dept's political economy reading group. the room is mostly hayek-sympathetic economists and a couple historians of economic thought who all treat the socialist calculation debate as basically settled in 1991, plus they think modern computing and big data made the whole lange-mises-hayek thing moot. my thesis is that lange never actually lost on computation - he lost on institutional legitimacy. im arguing hayek's knowledge problem was always about whose judgment gets to count, not about whether some central board can solve a system of equations. so if you take lange seriously but drop the walrasian auctioneer fiction, you can build a distributed market-socialist model that actually respects local knowledge, but only if youre willing to give up on prices being the sole coordination mechanism. i need a prep sheet for the Q&A. list the eight or so objections ill actually get from this specific crowd - ordered by how damaging they are - each phrased the way a hayekian political economist would put it, not some strawman. for each give me a two-minute reply and a quick note on where that reply is weakest or sounds hand-wavy. also tell me what i should concede right up front so i dont look like im dodging the obvious collapse-of-the-ussr point. and include the one question im praying nobody asks - probably something about the soviet planning archives or whether im sneaking in computational socialism via the back door. keep it casual, like rough notes for myself, and dont stress about perfect grammar.
