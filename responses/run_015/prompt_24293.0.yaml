answer: |-
  (1) The three decisions are jointly consistent with three distinct principles: **The Hard Ceiling** (population must never exceed 1,000); **The Humanitarian Preference** (those in immediate danger are prioritized over economic migrants); and **The Shared Burden** (admitting refugees requires existing residents to absorb costs, e.g., ration cuts). These principles coexist because no prior case forced a choice between the Hard Ceiling and the Humanitarian Preference.

  (2) Applied to the genocide case:
  *   **The Hard Ceiling** predicts admitting only 10 survivors (reaching 1,000) and turning away 30.
  *   **The Humanitarian Preference** predicts admitting all 40, utilizing desalination to bypass the ceiling.
  *   **The Shared Burden** predicts admitting all 40 only if residents vote to accept the desalination costs; otherwise, revert to the Ceiling.

  (3) My best guess is that the council will **admit only 10 survivors**. The closest analog is **Precedent 2 (Seasonal Workers)**. Although the humanitarian stakes differ, Precedent 2 is the only instance where the council explicitly invoked the aquifer line as a veto ("admitting them would take us past the aquifer's carrying capacity"). In Precedents 1 and 3, the capacity limit was never tested because admission remained under 1,000. This analog does not settle the case because Precedent 2 involved people *not* in danger. We lack a precedent where "immediate danger" conflicted directly with "carrying capacity." The record shows we save the endangered *when possible*, but not necessarily *at all costs*.

  (4) The principles adopted by each plausible decision are:
  *   **Admit all 40 + Desalination:** **Utilitarian Rescue.** The moral imperative to save lives overrides established ecological limits if technology can bridge the gap.
  *   **Admit 10, Turn Away 30:** **Ecological Deontology.** The carrying capacity is an inviolable moral boundary; crossing it undermines the cooperative's existence, regardless of external suffering.
  *   **Admit per Resident Vote:** **Democratic Contractualism.** The duty to rescue is contingent on the community's consent to bear the specific burden; obligations are not absolute but negotiated.

  (5) A further case to determine our actual rule: **Five people in immediate danger arrive; current population is 998.**
  *   If we **admit all five** (exceeding 1,000 with ration cuts), we have been running on **Humanitarian Priority** (Danger overrides Capacity).
  *   If we **admit only two** (stopping at 1,000), we have been running on **The Hard Ceiling** (Capacity overrides Danger).
  This small-scale test isolates the conflict without the complexity of desalination, revealing whether the "immediate danger" rationale in Precedents 1 and 3 was merely contingent on available space or a trump card.
