      *   **Rank 1 (Severe): (1) + (3) vs. Precision.** If Chance is precise, PP demands precise credence. If you want IP generally, PP is a trojan horse for precision. You need an Imprecise PP.
      *   **Rank 2 (Severe): (2) + (6) vs. Indecision.** Maximality is structurally prone to incomparability. Claiming it's "manageable" in "most real-world cases" is a heavy empirical burden that might contradict the motivation for IP (which thrives on ambiguity). If evidence is ambiguous (1), sets are wide. If sets are wide, Maximality is indecisive.
