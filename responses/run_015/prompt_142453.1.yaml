prompt: |-
  I convene a small reading group — four philosophers, one agricultural economist, and a friend who works in food policy — and for the last two sessions we have been stuck on the corner of the meat debate that I find genuinely strange: the argument that the ethics of eating animals cannot be settled by looking at farmed animals at all, because the largest term in the ledger is what happens to the wild animals living on and around the land we farm. The considerations we keep circling are these. Chickens convert feed into meat far more efficiently than cattle, so a chicken-based diet means fewer hectares under cultivation per calorie, and cultivation — ploughing, harvesting, rodenticides, the removal of the field margins and hedgerows that field animals rely on — is where most of the wild-animal death is supposed to happen. But chickens are small, so a calorie of chicken is a far larger headcount of individual deaths than a calorie of beef, and if the currency is sentient lives ended rather than hectares disturbed the arithmetic inverts. Then there is the further twist that grass-fed cattle occupy pasture that is not arable, and pasture is itself habitat: grazing may support fewer small mammals per hectare than cropland, or far more, and grazing may displace the animals that were there or merely change which ones are. Nobody in the group can produce a number they actually trust, and yet the conclusion swings entirely on that number. What I find comic about the whole exchange is the combination of radical empirical top-heaviness with complete numerical confidence in the delivery.

  I would like you to write a piece of sustained satire about this — a deadpan, Swiftian op-ed, 800 to 900 words, in the sober house style of a broadsheet comment page or a think-tank blog, dated and bylined to an invented author (a senior fellow at an invented institute is fine; do not satirize any named person, living or dead). The author's proposal: a new certification standard that rates farms not on emissions and not on the treatment of the animals they raise, but on a single invented metric of expected wild-animal suffering removed or caused per million calories delivered — invent the metric, its unit, and the auditing body, and give us a worked comparison table of three operations: a broiler-and-soy system, a grain-finished feedlot, and a grass-fed pasture. The piece should then follow that standard cheerfully and in good conscience to where it actually leads: if the metric is the one the author has chosen, the ideal farm is one with no wild animals on it at all, and the op-ed should end up endorsing something like a Wildlife Exclusion Premium that pays growers to strip habitat from their land, or a preference for the most lifeless ground available. The recoil should be the reader's, not the author's; no winking, no final paragraph that explains the joke, no punchlines about vegans or about effective altruists as people. The humor has to come from getting the real structure of the argument exactly right — both terms of the chicken-versus-beef tradeoff, the way habitat quality and animal density rather than acreage do the work, the way the calculation absorbs every empirical unknown by stipulating a number — and then extending it one step, so that someone who actually makes the crop-deaths argument can read the piece and wince in recognition rather than feel caricat石ured. Do not let the author assert anything straightforwardly false (pasture is not empty of wildlife, chickens are not fed on air), and do not let them help themselves to a number they could not in principle defend; let them instead be scrupulous, transparent, and monstrous.
