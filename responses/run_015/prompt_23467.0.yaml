      *   *Actually, the strongest take:* **He would be a Skeptic.** The evidence today is worse than the anecdotal evidence he had then (which he already treated with extreme caution). If he couldn't commit fully then, he certainly wouldn't now.

  7.  **Drafting the Response:**
