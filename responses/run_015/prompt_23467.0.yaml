      *   **Motivation:** He hoped psychical research could provide empirical evidence for immortality, which he felt was necessary to reconcile duty and self-interest (the "dualism of practical reason" problem in *Methods of Ethics*). Without immortality/divine justice, utilitarianism lacks a rational foundation for self-sacrifice.
      *   **Methodology:** Empiricist, cautious, demanding of evidence. He treated psychical research as a science, not a faith.

  3.  **Address Question 1: Modern Effect Sizes & Replicability:**
      *   *Context:* Modern parapsychology (Ganzfeld, RNG, Bem) produces tiny effect sizes (often near chance, statistically significant only in large aggregates) and suffers heavily from the replication crisis.
      *   *Sidgwick's Standard:* Sidgwick was famously cautious. In *Phantasms of the Living* (Gurney, Myers, Podmore, with Sidgwick's heavy influence), they sifted through thousands of anecdotes to find a few "good" ones. He rejected most séance phenomena as fraud or delusion.
      *   *Verdict:* He would likely be *highly skeptical* of modern effect sizes. Why? Because small effects are indistinguishable from bias, noise, or p-hacking without extreme rigor. Sidgwick wanted *robust* evidence to overturn natural law. A $p = 0.04$ effect that vanishes when pre-registered is not the "fact" he was looking for. He dismissed Spiritualist table-tipping because the evidence was tainted by fraud; he would dismiss modern RNG data because it's tainted by methodological weakness.

