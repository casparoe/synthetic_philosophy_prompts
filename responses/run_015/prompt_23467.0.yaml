answer: |-
  This is a fantastic angle for a piece. The "Victorian sage duped by spirits" caricature does a disservice to Sidgwick, who was arguably the most intellectually honest philosopher of his generation. He didn't dabble in the occult for thrills; he approached psychical research with the same grim, rigorous duty he applied to ethics. He was looking for a "fact" that could solve a philosophical crisis, not a miracle to comfort his soul.

  To give you the defensible characterization you need, we have to apply Sidgwick's own epistemological standards—derived from *The Methods of Ethics* and his SPR correspondence—to the modern data. Sidgwick was not a "believer" in the religious sense; he was an empiricist who found the *possibility* of telepathy less improbable than the alternative explanations for certain verified anecdotes.

  Here is how Sidgwick would likely dismantle the modern situation, point by point, followed by the verdict you asked for.

  ### 1. The Evidentiary Bar: Effect Sizes vs. "Facts"
  Sidgwick's threshold for accepting a psychical claim was exceptionally high because he understood that accepting it required overturning the established laws of physics and physiology. In the SPR's early days, he and his colleagues (like F.W.H. Myers) sifted through thousands of anecdotal reports to find a handful they considered "veridical." They were looking for *individual cases* so well-attested that they could not be explained by chance, fraud, or error.

  Modern parapsychology (PEAR, Bem, etc.) does not offer well-attested individual cases. It offers aggregate statistical deviations—effect sizes often hovering near chance, significant only when thousands of trials are pooled.

  **Sidgwick's View:** He would likely dismiss these effect sizes as insufficient to carry the weight of the claim. In his correspondence, Sidgwick frequently expressed frustration with phenomena that were "slippery"—that appeared only under specific, unrepeatable conditions or required complex statistical inference to be seen at all. He wanted a "fact" akin to a chemical discovery, not a $p$-value of 0.04 that vanishes if you change the seed on the random number generator.

  He treated Spiritualist séance phenomena (table tipping, materializations) with extreme skepticism because they were prone to fraud and sensory deception. He would view modern "noise" data similarly. To Sidgwick, a phenomenon that cannot be demonstrated robustly and consistently is indistinguishable from a phenomenon that does not exist. The "file drawer problem" (publishing only positive results) is exactly the kind of bias he tried to combat by insisting the SPR collect negative cases. He would see the replication crisis not as a scandal to be managed, but as a confirmation that the phenomenon is not real.

  ### 2. Methodology: Pre-registration and Open Science
  Sidgwick was a methodological innovator. One of his primary motivations for founding the SPR was to rescue psychical research from the credulity of the Spiritualists. He wanted systematic inquiry, controlled conditions, and cross-examination.

  **Sidgwick's View:** He would have been an early and vocal adopter of pre-registration and open science. These protocols align perfectly with his demand for the elimination of observer bias and "expectation effects." He understood that the human mind (including the investigator's) is a flawed instrument.

  However, here is the crux: **Sidgwick would note that when parapsychology adopts these rigorous standards, the effects tend to disappear.** The few large-scale, pre-registered replications of precognition or telepathy (such as the attempts to replicate Bem's "Feeling the Future" study) have largely failed to find significant effects.

  Sidgwick was capable of changing his mind when evidence failed. He eventually grew skeptical of Eusapia Palladino, a medium he initially defended, once evidence of fraud became undeniable. If pre-registered, open-data experiments yield null results, Sidgwick would not cling to the hope of "hidden moderators" or "experimenter effects." He would accept the null. He would argue that pre-registration has done its job: it has filtered out the bias, and what remains is nothing.

  ### 3. The Philosophical Stakes: Utilitarianism and Free Will
  This is the most critical thread for your piece. Sidgwick's interest in psychical research was not idle curiosity; it was existential. In *The Methods of Ethics*, he identifies the "dualism of practical reason": Rational egoism (doing what is best for me) often conflicts with Utilitarianism (doing what is best for all). Without a belief in divine justice or an afterlife where these interests are reconciled, Sidgwick felt there was no *rational* justification for being moral if it required significant self-sacrifice.

  He hoped psychical research could provide empirical proof of immortality, thereby bridging the gap between duty and self-interest.

  **Sidgwick's View on Precognition:** If hard precognition were proven, it would actually create a new philosophical problem for Sidgwick. Utilitarianism relies on moral agency—the ability of an individual to choose the action that maximizes good. If the future is fixed and knowable (precognition), the concept of free will and moral responsibility is threatened. A proven precognition effect could undermine the very agency required for his ethical system to function.

  **Sidgwick's View on Immortality:** This is where he would feel the loss most acutely. If modern parapsychology fails to provide evidence of survival after death, Sidgwick is left with the "dualism" unresolved. He would not, however, fake the evidence to solve it. In his personal life, Sidgwick was known for a kind of tragic intellectual honesty; he refused to affirm religious doctrines he couldn't prove, even though he wished they were true.

  He would conclude that the empirical route to validating ethics has failed. We must be moral without the promise of reward or the proof of survival. This makes his Utilitarianism more Kantian (duty for duty's sake) and less hedonic, but it is a conclusion he would accept rather than compromise his standards of evidence.

  ### The Verdict

  You asked for a definite stance rather than a shrug. Based on his track record of discarding mediums when they failed to perform under controls, and his prioritization of methodological rigor over desired outcomes:

  **Henry Sidgwick would be a Confirmed Skeptic.**

  He would not be a *dogmatic* skeptic (one who says psi is impossible *a priori*), but he would be an *empirical* skeptic (one who says psi is unproven *a posteriori*).

  **Justification for your piece:**
  Sidgwick founded the SPR to find facts, not to validate a worldview. When the facts failed to materialize in his own lifetime—despite his deep personal *hope* that they would—he remained agnostic but withdrew active endorsement. Faced with modern data characterized by tiny effect sizes, p-hacking scandals, and failure to replicate under pre-registered conditions, Sidgwick would view the "psi hypothesis" as falsified.

  He would likely write that while the *question* of telepathy and immortality remains profound, the *answer* provided by 140 years of research is negative. He would argue that continuing to claim the existence of these phenomena based on current evidence is intellectually dishonest.

  **The Narrative Hook:**
  The tragedy of Sidgwick isn't that he believed in ghosts; it's that he *needed* the supernatural to be real to make his ethics work, but he was too honest to pretend it was. He is the patron saint of the disappointed rationalist. He would look at the modern replication crisis and say: *"We have refined the methods, and the phenomenon has vanished. We must now find a basis for morality that does not rely on a hope the universe has refused to confirm."*

  This characterization preserves his dignity as a philosopher while acknowledging the failure of the scientific program he helped launch. It moves him from "Victorian dupe" to "tragic hero of evidence."
