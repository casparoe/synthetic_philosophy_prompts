answer: |-
  Here is a proposed research agenda for your three post-docs, ranked by philosophical priority and tractability within a two-year, conceptual-only constraint.

  ### 1. The Ontology of Elective Affinity: From Metaphor to Mechanism Sketch
  **Priority:** First (Upstream)
  **Confidence:** High

  This is the bottleneck. Until "elective affinity" (*Wahlverwandtschaft*) is rigorously defined as a causal model rather than a poetic hedge, the rest of the project rests on sand. The standard critique is that Weber offers a *post hoc* narrative: capitalism arose, Protestantism existed, therefore they fit. Your first post-doc should treat this as a problem of mechanism design in social ontology.

  The task is to reconstruct elective affinity not as a direct efficient cause (A hits B), but as a **compatibility constraint**. In engineering terms, it is not the engine that drives the car, but the specification of fuel that allows the engine to run without seizing. If Protestant ethics are the fuel and capitalist rationalism is the engine, affinity explains why other "fuels" (e.g., traditionalist ethics) caused the engine to stall.

  **Why this is upstream:** You cannot determine whether values act as selection environments or generative mechanisms (your evolutionary economics question) until you define the relationship between the value system and the practice.
  **Tractability:** High. This requires close textual exegesis of Weber combined with formal philosophy of causation (e.g., interventionist accounts). It does not require data, only logical consistency.
  **Dead End Avoidance:** Do not let them argue about whether Weber was *historically correct*. That is empirical. The question is whether the *concept* is coherent.

  ### 2. The Carrier Problem: Methodological Individualism vs. Institutional Normativity
  **Priority:** Second (Midstream)
  **Confidence:** Medium-High

  Once the mechanism of affinity is sketched, you must locate the agent. Does explaining outcomes with values commit you to methodological individualism (MI)? The standard view is yes: values exist only in minds; therefore, causal chains must run through individual beliefs and desires. However, this often fails to capture why institutions persist despite individual turnover.

  Your second post-doc should investigate whether **institutional-level value causation** is coherent without resorting to mystical "downward causation." The promising angle here is to distinguish between *efficient causation* (pushing) and *constitutive causation* (defining). An institution does not "push" an individual to act via a value; rather, the institution defines the *identity* of the action. (e.g., "Signing this paper" counts as "making a contract" only within a normative framework).

  **The MI Question:** Explaining with values does *not* necessarily commit you to MI if you treat values as public, institutional facts rather than private mental states. However, if you insist values are psychological, you are stuck with MI. The research should prioritise a "structural normativity" account: values as rules of the game, not just preferences in the head.
  **Tractability:** Medium. This is classic philosophy of social science terrain (Searle, Gilbert, Tuomela), but applying it specifically to the *causal efficacy* of values in economics is fresh.
  **Dead End Avoidance:** Avoid the holism/individualism binary. It is a tired turf war. Focus instead on the *location* of the normative constraint.

  ### 3. Translatability: Implications for Contemporary Economics and Political Theory
  **Priority:** Third (Downstream/Application)
  **Confidence:** Low/Medium

  The final post-doc should act as a translator. If the first two posts succeed, we have a coherent model of how values constrain and constitute economic action without magic. Does this matter to a modern institutional economist or a political theorist?

  The goal is to map the "compatibility constraint" model (from Project 1) and the "constitutive rules" model (from Project 2) onto current debates in institutional economics (e.g., North, Acemoglu) and behavioural economics. Do economists treat culture as a parameter (selection environment) or a variable (generative mechanism)? If they treat it as a parameter, does that hide the normative work being done?

  **Why this is downstream:** You cannot assess the utility of the concept until the concept is clarified.
  **Tractability:** Low. This is where the project risks stalling. Economists often operate with instrumentalist definitions of culture that ignore ontological precision. Convincing them that philosophical distinctions matter is a sociological challenge, not just a philosophical one.
  **Dead End Avoidance:** Do not attempt to critique economic models on empirical grounds. Critique them on *descriptive adequacy* regarding social ontology.

  ***

  ### Defence of the Ranking

  The order is dictated by **conceptual dependency**.
  1.  If "elective affinity" remains a vague metaphor (Project 1), you cannot specify *what* is being carried by individuals or institutions (Project 2).
  2.  If you do not know where the value resides (mind vs. institution - Project 2), you cannot accurately map it onto economic models which usually assume methodological individualism (Project 3).

  Attempting Project 3 first is a recipe for talking past economists. Attempting Project 2 first risks building a theory of agency on a broken theory of causation. Project 1 is the most tractable for a two-year limit because it is bounded by texts and logic, whereas Project 3 risks drifting into interdisciplinary negotiation which is hard to control.

  **Dead Ends to Avoid:**
  *   **"Did Culture Cause X?"** Any question asking for a verdict on specific historical causation is empirical. Ban it.
  *   **"Is Marxism or Weberianism Correct?"** This is 1970s sociology. It assumes the categories are fixed. Your grant is to fix the categories.
  *   **"Downward Causation as Force."** Any model that suggests institutions "force" individuals to act against their interests via values is likely smuggling in coercion disguised as normativity. Stick to constitutive rules.

  ***

  ### Confidence and Uncertainty

  **Confidence Levels:**
  *   **Project 1 (Elective Affinity):** 90% confident this is tractable and necessary. The philosophical tools (interventionism, mechanistic explanation) exist; they just need applying to Weber.
  *   **Project 2 (MI vs. Institutions):** 75% confident. The literature is dense, and there is a risk of getting bogged down in standard arguments about supervenience. However, the "constitutive" angle offers a way out.
  *   **Project 3 (Contemporary Relevance):** 50% confident. This is the weak link.

  **Where I am Winging It:**
  I am least sure about **Project 3's potential for uptake**. I am speculating that contemporary economics or political theory *cares* about the ontological status of values. It is entirely possible that working economists view "culture" as a black-box residual term and will remain indifferent to whether it is a selection environment or a generative mechanism, provided the predictive power remains the same.

  The claim that clarifying the philosophy of "elective affinity" has implications for contemporary economic modelling is the most optimistic part of this agenda. It assumes that conceptual clarity translates to model improvement. In the history of economics, this is often false; instrumentalism usually wins. If the post-docs find that economists simply do not care about the distinction between selection environments and generative mechanisms when modelling culture, the third strand of the grant may produce a philosophically sound but practically irrelevant monograph. I cannot guarantee the bridge between high-level social ontology and mid-level economic modelling will hold weight.
