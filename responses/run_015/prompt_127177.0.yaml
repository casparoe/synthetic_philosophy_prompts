answer: |-
  This is an excellent intervention point. Your classmate is conflating several distinct philosophical issues under the cover of a catchy slogan. The phrase "future people don't exist yet, so there's nothing to discount" is ambiguous between a claim about **ontology** (what exists), **axiology** (how we value), and **normativity** (what we owe).

  Here is a disambiguation menu you can bring to the seminar, structured by the four categories you requested. For each reading, I have classified the claim and analyzed whether it supports your classmate's dismissal of specific obligations or actually undermines it.

  ---

  ### (i) Metaphysical Readings: The Ontology of Future Persons
  *The claim: "Future people don't exist yet."*

  **1. Presentist Ontology:** Only present entities exist. Future people are literally nothing until they come into being.
  *   **Classification:** **Defensible Substantive Thesis.** (Presentism is a standard, though contested, view in the philosophy of time).
  *   **Implication for Debate:** If true, it confirms the literal truth of "they don't exist *now*." However, it **does not license dismissal**. We routinely acknowledge duties regarding non-present entities (e.g., executing the will of the dead, preserving resources for the unborn). Presentism denies they are *currently* real, not that they can be *subjects* of future-oriented duties.
  *   **Verdict:** Leaves the debate untouched regarding obligation.

  **2. Eternalist (Block Universe) Ontology:** Past, present, and future entities all exist tenselessly; future people are "real," just located at a later temporal coordinate.
  *   **Classification:** **Defensible Substantive Thesis.** (Compatible with Special Relativity).
  *   **Implication for Debate:** If true, the slogan "future people don't exist" is **False**. On this view, harming the future is metaphysically identical to harming a distant spatial location.
  *   **Verdict:** **Strengthens the case for action.** It treats future people as ontologically robust subjects of harm, similar to present strangers.

  **3. The "Non-Entity" Reading:** Future people are not just temporally distant but are metaphysically indeterminate (no specific individuals are waiting to exist).
  *   **Classification:** **Platitude (with caveats).** Due to the "Non-Identity Problem" (Parfit), specific future individuals depend on present actions for their conception.
  *   **Implication for Debate:** This is likely what your classmate is gesturing at. It is true that *specific* 23rd-century individuals do not have a fixed identity independent of our current carbon policy.
  *   **Verdict:** **Licenses the "generic vs. specific" distinction,** but not the dismissal of obligation. It supports the idea that we owe duties *de dicto* (to whoever will exist) rather than *de re* (to specific named persons), but *de dicto* duties can still be stringent.

  ---

  ### (ii) Normative Readings: Moral Standing and Harm
  *The claim: "...so there's nothing [to owe/to harm]."*

  **1. Actualism (Existence-Dependent Standing):** Only actually existing beings have moral standing. Possible or future beings have no rights until they are actualized.
  *   **Classification:** **Defensible Substantive Thesis.** (A common view in population ethics, though controversial).
  *   **Implication for Debate:** If true, we cannot wrong a specific future person by bringing them into existence with a compromised climate, provided their life is still worth living (the Non-Identity Problem).
  *   **Verdict:** **Licenses the dismissal of *specific* obligations.** This supports your classmate's claim that we owe nothing to them *as particular beneficiaries*. However, it usually entails a "Person-Affecting Restriction" that many find counterintuitive (e.g., it implies no harm is done if we leave a radioactive wasteland that harms only future people).

  **2. Preventative Harm Principle:** One can harm someone by preventing the conditions necessary for their flourishing, even if they do not yet exist.
  *   **Classification:** **Defensible Substantive Thesis.** (Common in legal trust law and environmental ethics).
  *   **Implication for Debate:** This rejects the idea that existence is a prerequisite for being a victim of *policy*. We can violate a "right to an inheritable world" that attaches to the *status* of being a future person.
  *   **Verdict:** **Strengthens the case for action.** It bypasses the Non-Identity Problem by positing rights attached to temporal slots rather than specific identities.

  **3. The "No Victim" Argument:** Harm requires making a specific subject worse off than they otherwise would have been. If our inaction changes *who* is born, the future people cannot claim they are worse off than they would have been (since otherwise they wouldn't exist).
  *   **Classification:** **Defensible Substantive Thesis** (Logically valid under standard counterfactual accounts of harm).
  *   **Implication for Debate:** This is the strongest philosophical backing for your classmate's specific distinction.
  *   **Verdict:** **Licenses the dismissal of *comparative* harm claims,** but fails to address **threshold duties** (duties not to create conditions below a minimum standard of habitability, regardless of identity).

  ---

  ### (iii) Axiological and Economic Readings: Discounting
  *The claim: "...so there's nothing to discount."*

  **1. Pure Time Preference (PTP) Rejection:** We should not discount welfare simply because it occurs later in time ($\delta = 0$ in the Ramsey equation).
  *   **Classification:** **Philosophical Platitude.** (Since Ramsey, Pigou, and Sidgwick, pure time preference is widely regarded as "ethically indefensible" in this context).
  *   **Implication for Debate:** If your classmate means "We shouldn't apply a time discount rate to their welfare," he is **arguing for stronger mitigation**, not weaker.
  *   **Verdict:** **Strengthens the case for action.** This interpretation contradicts his conclusion.

  **2. Probability/Existence Discounting:** We discount future welfare because there is a probability the beneficiaries will not exist (extinction risk) or the welfare will not materialize.
  *   **Classification:** **True/Platitude.** (It is rational to weight outcomes by their probability).
  *   **Implication for Debate:** If your classmate means "We discount because they might not exist," this is valid. However, climate inaction *increases* the probability of non-existence (extinction).
  *   **Verdict:** **Leaves the debate untouched** or **Strengthens the case for action** (since mitigation secures the probability of their existence).

  **3. The "Zero Weight" Reading:** Because they don't exist now, their welfare enters the current utilitarian calculus with a weight of zero.
  *   **Classification:** **False.** (This conflates ontology with axiology).
  *   **Implication for Debate:** This is the error in the slogan. Non-existence *now* does not imply zero moral weight *now*. (Analogy: A beneficiary of a trust fund does not exist when the fund is set up, but the funds must still be managed for them).
  *   **Verdict:** **False.** This is the weak link in your classmate's argument.

  ---

  ### (iv) Practical Inference: From Premise to Conclusion
  *The claim: "Therefore, nothing is owed specifically to them as particular beneficiaries."*

  **1. The Trusteeship Inference:** We owe duties to the *office* of future generations, administered by present trustees, regardless of the specific identity of the beneficiaries.
  *   **Classification:** **Defensible Substantive Thesis.** (Standard in intergenerational justice theory, e.g., Rawls's "Just Savings Principle").
  *   **Implication for Debate:** This rejects the inference that "no specific identity = no obligation." We can owe specific duties to a *role* that will be filled.
  *   **Verdict:** **Undermines the dismissal.** It allows for specific budgetary constraints (carbon budgets) without requiring specific identifiable victims.

  **2. The Generic Duty Inference:** We owe a duty to "humanity" or "life" generically, but not to specific temporal slices of it.
  *   **Classification:** **Defensible Substantive Thesis.** (This is your classmate's position).
  *   **Implication for Debate:** This distinction is practically fragile. A "generic duty not to render the world uninhabitable" *just is* a constraint on present carbon budgets shaped by 23rd-century welfare.
  *   **Verdict:** **Leaves the debate untouched.** If the generic duty prohibits uninhabitability, it necessitates the same mitigation policies as a specific duty. The distinction is rhetorical, not practical.

  ---

  ### Summary for Seminar Intervention

  You can structure your intervention by pointing out that the slogan conflates **Pure Time Preference** (which we should reject) with **Existence Conditions** (which are relevant but don't negate duty).

  | Reading | Claim Status | Does it support the Student's Conclusion? | Strategic Value |
  | :--- | :--- | :--- | :--- |
  | **Metaphysical (Presentism)** | Defensible Thesis | **No.** Non-existence *now* $\neq$ No standing *now*. | Show that presentism is compatible with trusteeship. |
  | **Normative (Actualism)** | Defensible Thesis | **Yes (Partially).** Supports *de dicto* vs. *de re* distinction. | Concede the identity point, but argue threshold duties remain. |
  | **Axiological (No PTP)** | Platitude | **No.** Actually argues for *higher* valuation of future welfare. | Point out he may be accidentally arguing *for* mitigation. |
  | **Axiological (Zero Weight)** | **False** | **Yes.** (But the premise is false). | **Target this.** Non-existence does not imply zero moral weight. |
  | **Practical (Generic Duty)** | Defensible Thesis | **No.** Generic duties to habitability entail specific budgets. | Show the "generic" duty collapses into the specific policy he rejects. |

  **Suggested Script:**
  "I think we need to disambiguate the slogan 'nothing to discount.' If it means **Pure Time Preference**, philosophers agree we shouldn't discount, which strengthens the case for mitigation. If it means **Probability Discounting**, that's valid, but climate inaction lowers the probability of their existence. If it means **Zero Moral Weight** because they aren't present, that conflates ontology with normativity—we don't need present existence to have present duties (e.g., trusts/wills). Finally, regarding the 'generic vs. specific' duty: even if we accept the Non-Identity Problem and owe duties *de dicto* (to whoever exists), a generic duty to maintain habitability mathematically necessitates the specific carbon budgets you're questioning. So the distinction doesn't let us off the hook."
