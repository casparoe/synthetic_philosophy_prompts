          4.  Analyze the Regulative horn (Makes error possible, but requires independent justification for the norm).
          5.  Conclusion: The regress stops only if we accept the norm as constitutive of reasoning, but this comes at the cost of making logical error a form of conceptual incompetence rather than simple irrationality.
      *   *Refining the argument:* The model answer should take a stance. Let's argue that the Constitutive view is the only way to stop the regress, but it changes the nature of the problem.

  5.  **Designing the Marking Scheme:**
      *   Total 20 marks.
