answer: |-
  ### Exam Question

  **Question 1 (20 Marks)**

  In Lewis Carroll's dialogue, the Tortoise accepts the premises of a valid argument but refuses the conclusion, demanding that the rule of inference be added to the premises as a further conditional statement. This generates a regress: every time the conditional is added, the Tortoise demands another rule to link the new set of premises to the conclusion.

  The standard solution is to claim that rules of inference are not premises but instructions on how to move between premises. However, consider a modified version of the Tortoise's demand. Suppose the Tortoise agrees that the rule is not a truth-functional premise (a description of how the world is), but insists it must be a **licensing norm** (a prescription stating that a reasoner *ought* or *may* make the transition).

  This shift creates a dilemma regarding the status of the norm:
  1.  **Constitutive:** The norm is part of what it *means* to hold the beliefs in question. To believe the premises and understand the terms just *is* to be disposed to infer the conclusion.
  2.  **Regulative:** The norm is an external standard that applies to reasoners, which they can successfully grasp and yet fail to follow.

  **Essay Task:**
  Explain whether recasting the rule of inference as a **licensing norm** successfully stops the Tortoise's regress. In your answer, you must choose between the **Constitutive** and **Regulative** interpretations. Defend your choice by explaining what specific problem that choice solves, and what new philosophical cost it incurs regarding the possibility of logical error or the justification of deduction.

  *(Note: Do not reference specific authors or texts. Rely only on the distinctions provided above and the arguments discussed in seminar.)*

  ***

  ### Model Answer

  The Tortoise's regress arises because treating a rule of inference as a premise converts a move of logic into a static proposition. The standard reply—that rules are instructions, not propositions—blocks the regress only if we can explain why the instruction binds the reasoner. Recasting the rule as a **licensing norm** attempts to bridge this gap by appealing to obligation rather than truth. However, this move does not dissolve the problem; it relocates it into a dilemma between the Constitutive and Regulative interpretations.

  To stop the regress, one must argue that the Constitutive interpretation is the only viable option. If the norm is merely Regulative, the Tortoise can grant that the norm exists ("One ought to infer Q") without feeling compelled to follow it. He can treat the norm itself as another fact about the landscape of reasons, asking, "Why ought I to follow this norm?" If the answer requires a further reason, the regress resumes at the level of norms rather than premises. If the answer is "You just ought," the norm appears arbitrary. Therefore, a Regulative norm leaves the binding force of logic unexplained and vulnerable to a normative regress.

  The Constitutive view stops the regress by denying the Tortoise's coherence. If the rule is constitutive of belief or meaning, then a subject who grants the premises but refuses the conclusion is not merely irrational; they are unintelligible. They do not actually hold the beliefs they claim to hold, or they do not understand the terms they are using. On this view, the demand for a further license is a category mistake. One cannot demand a license to do what one is already doing by virtue of having a mind. The transition is not something added to the state of belief; it is internal to the state of belief.

  However, the cost of this solution is high. By making the rule constitutive, we make logical error difficult to describe. If violating modus ponens renders a subject's mental states unintelligible, then the Tortoise is not a skeptic to be refuted, but a nonsense-generator to be dismissed. This threatens to make logic trivial. It implies that we cannot be wrong about logic in a substantive way; we can only fail to mean what we say. Furthermore, it offers no comfort to the reasoner seeking justification. It tells them that they *must* infer, but only because anything else would cease to count as inference. This secures the practice of deduction but isolates it from external justification.

  Alternatively, defending the Regulative view requires accepting that the regress stops at a basic entitlement. One would argue that the norm binds us not because it is constitutive of thought, but because we are primitively entitled to rely on it. The cost here is admitting that the Tortoise is conceivable and that his demand, while unmeetable, is not incoherent. We must accept that the foundation of logic is a brute normative fact that cannot be argued for without circularity.

  Ultimately, the Constitutive reading is preferable for stopping the regress because it explains why the Tortoise's demand feels like a trap: it asks for a justification of the very framework required to ask for justification. However, this victory is Pyrrhic. It saves deduction from regress by making it a condition of intelligibility, thereby sacrificing the ability to explain logical error as a genuine failure of rationality rather than a collapse of meaning. The licensing norm stops the regress only by making the rule invisible to the reasoner who follows it.

  ***

  ### Marking Scheme (20 Marks)

  **1. The Regress Mechanism (5 Marks)**
  *   **5:** Clearly explains why treating the rule as a premise (or a Regulative norm treated as a fact) generates the infinite chain (the need for a further link).
  *   **3:** Identifies the regress but vaguely attributes it to "circularity" without explaining the structural demand for a further link.
  *   **0:** Fails to identify the regress or confuses it with circular reasoning in general.
  *   *Typical Error:* Claiming the regress is just "begging the question" without distinguishing premises from rules.

  **2. The Licensing Norm Distinction (5 Marks)**
  *   **5:** Accurately distinguishes the proposed "licensing norm" from a truth-functional premise and explains how it is supposed to function (binding the agent rather than describing the world).
  *   **3:** Mentions the norm but treats it essentially as a stronger premise ("You must believe P").
  *   **0:** Ignores the prompt's specific distinction and reverts to standard "rules vs. premises" boilerplate.
  *   *Typical Error:* Ignoring the prompt's specific setup and reciting the standard Carroll solution without addressing the normative shift.

  **3. The Constitutive/Regulative Dilemma (5 Marks)**
  *   **5:** Articulates the specific tension: Constitutive makes error unintelligible; Regulative leaves the norm unjustified/arbitrary.
  *   **3:** Defines the terms but fails to explain the specific consequence of each (e.g., says Constitutive is "better" without saying why).
  *   **0:** Uses the terms as labels without defining them or connecting them to the Tortoise scenario.
  *   *Typical Error:* Treating "Constitutive" as simply "internal" without addressing the consequence for the possibility of error.

  **4. Evaluation of Costs (5 Marks)**
  *   **5:** Explicitly identifies the trade-off (e.g., stopping regress costs the ability to explain error, or keeping error possible costs the justification).
  *   **3:** Identifies a cost but treats it as a minor side note rather than a structural consequence.
  *   **0:** Claims their chosen side has no downsides.
  *   *Typical Error:* Asserting that the Constitutive view solves the problem "completely" without acknowledging the loss of the concept of logical mistake.

  **Grade Differentiation:**
  *   **A (17-20):** Hits all four moves. Crucially, in Move 4, they acknowledge that solving the regress might make the Tortoise *inconceivable* rather than *refuted*. They see the philosophical price.
  *   **B (13-16):** Hits Moves 1-3 well. Fails Move 4 by treating the choice as a straightforward victory for one side without analyzing the loss of explanatory power regarding error.
  *   **C (10-12):** Hits Moves 1 and 2. Recites the standard "rules aren't premises" line. Struggles to engage with the Constitutive/Regulative distinction provided in the prompt.

  ***

  ### Note on "Fluent, Low-Comprehension" Answers

  Watch for scripts that use the vocabulary of the prompt ("licensing norm," "constitutive") but deploy them as synonyms for the standard solution. A fluent/low-comprehension student will write: *"The Tortoise is wrong because the rule is constitutive, which means it is not a premise, so the regress stops."*

  This sentence string is grammatically correct and uses the right words, but it collapses the distinction. It treats "constitutive" as just a fancy word for "not a premise." To catch this, check if they explain *what happens to the Tortoise* on the constitutive view. If they say "The Tortoise is irrational," they missed the point (on the constitutive view, the Tortoise is unintelligible). If they say "The Tortoise is making a category mistake," check if they explain why that stops the demand for justification specifically. If they just assert it, it's cached fluency.

  ***

  ### Meta-Commentary: Where the Model Answer Cheats

  **The Fiat:**
  The model answer takes for granted that the **Regulative** view *must* fail to stop the regress. It asserts: *"If the answer is 'You just ought,' the norm appears arbitrary... the regress resumes."* This is the weakest link. A sophisticated student could argue that a Regulative norm stops the regress if paired with a theory of **primitive entitlement** or **epistemic blamelessness**. One can hold that the norm is external (Regulative) but that the demand for further justification is illegitimate because our cognitive design entitles us to the rule without further argument. The model answer dismisses this by equating "unjustified" with "arbitrary," which is a substantive epistemological claim, not a logical necessity.

  **The Strong Counter-Argument:**
  A genuinely excellent student might reject the Model Answer's conclusion by arguing for a **Regulative + Entitlement** view.
  *   *Argument:* "The Constitutive view makes logical error impossible, which contradicts the phenomenology of making logical mistakes. We *feel* like we are reasoning badly, not speaking nonsense. Therefore, the norm must be Regulative. To stop the regress, we do not need the norm to be constitutive; we only need the demand for justification to have a stopping point. We are entitled to basic inference rules as a condition of cognitive agency, not meaning. This stops the regress without making the Tortoise unintelligible, only unjustified."
  *   *Why this challenges the Model:* It preserves the possibility of error (which the Model sacrifices) while still blocking the regress (by denying the legitimacy of the demand for further grounding).

  **What Would Change My Mind:**
  If I see a cluster of scripts (more than 10%) successfully articulating the "Entitlement" defense of the Regulative view—specifically distinguishing between *having a justification* and *being justified*—I would conclude the question rewards prior exposure to externalist epistemology rather than comprehension of the Carroll paradox itself. If a student can argue that the Regulative view works *provided* we reject the Tortoise's demand for discursive justification as illegitimate, they have outflanked the dilemma I set. I would mark this as an A+, but I would need to revise the question next year to close the "entitlement" escape hatch, perhaps by stipulating that the Tortoise accepts only discursive justification.
