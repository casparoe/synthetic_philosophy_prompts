answer: |-
  **Exam Question: The Deviant Run and the Principal Principle**

  **Time Allowed:** 90 Minutes
  **Word Limit:** Approx. 800 Words

  **Scenario:**
  Alice is an experimental physicist. She is certain that the objective chance of a specific isotope (Q) decaying within one minute is exactly $2/3$, based on a fundamental quantum theory she accepts as law. She prepares a specific atom of Q for decay at time $t$. However, Alice also possesses a dataset from an independently verified, long-run series of Q-decays conducted in a parallel facility. In this dataset, the relative frequency of decay was exactly $0.4$. Alice treats this statistical evidence as admissible historical information regarding the stability of the isotope, yet it diverges significantly from the theoretical chance.

  **Prompt:**
  Determine Alice's rational credence that the specific atom will decay at $t$. In your essay, you must adjudicate whether Lewis's Principal Principle (PP) locks her credence at $2/3$, licenses conditionalization downward toward $0.4$, or permits an intermediate position. Your analysis must explicitly address: (i) the admissibility of the frequency data given the known chance; (ii) why this statistical discrepancy does not constitute a Lewis-style "undermining future"; (iii) the correct application of PP to conditional rather than unconditional chances; and (iv) whether self-locating information regarding which facility she occupies alters the deference relation.

  ***

  **Model Answer**

  Alice's rational credence that the atom will decay must remain $2/3$. While the divergent frequency data creates epistemic tension, it does not override the Principal Principle (PP) because the data is admissible historical evidence that does not logically entail a different chance function. To resolve this, we must distinguish between evidence that reveals the chance and evidence that merely samples it.

  First, we must separate admissible from inadmissible evidence. Lewis defines admissible evidence as information that does not bear on the truth of the chance hypothesis except via the outcome itself. Historical frequency data is typically admissible because the past does not causally influence the present chance. However, evidence becomes inadmissible if it entails the chance is not what we think it is. Alice's dataset shows a frequency of $0.4$. Does this entail $Ch(Decay) \neq 2/3$? No. By the Law of Large Numbers, a $2/3$ chance process can produce a $0.4$ frequency run, however unlikely. Since the data is compatible with the chance being $2/3$, it remains admissible. Alice's knowledge of the quantum law fixes the chance; the frequency data is merely a sample from that distribution, not a definition of it.

  Second, we must explain why this discrepancy is not a Lewis-style "undermining future." Lewis's "Big Bad Bug" arises in Humean supervenience frameworks where future frequencies determine present chances. If the future frequency were $0.4$, and chances supervene on the total history, then the present chance could not be $2/3$. This would make the proposition $Ch(Decay)=2/3$ incompatible with the evidence, rendering PP inapplicable. However, Alice's scenario involves a *past* or *parallel* run, not the future determining the present. Furthermore, if we treat the quantum law as a propensity (non-Humean), the chance is fixed by the physical setup, not the aggregate frequency. Therefore, the $0.4$ frequency does not undermine the truth of $Ch(Decay)=2/3$; it merely represents a statistical fluctuation. The "undermining" objection fails because the evidence does not make the chance hypothesis impossible, only improbable.

  Third, we apply the Principal Principle correctly to conditional chances. The PP states: $Cr(A | Ch(A)=x \ \& \ E) = x$, provided $E$ is admissible. Alice's total evidence is $E_{total} = (Ch(Decay)=2/3 \ \& \ Freq=0.4)$. Since we established that $Freq=0.4$ is admissible relative to $Ch(Decay)=2/3$, the principle applies directly. Alice should not conditionalize downward to $0.4$ because that would treat the frequency as the chance. Nor should she seek an intermediate value, as that would imply the chance is indeterminate. The PP mandates that once the objective chance is known, admissible evidence regarding outcomes becomes irrelevant to the credence in the next outcome. The rational credence is locked at $2/3$ because the antecedent $Ch(Decay)=2/3$ is treated as certain knowledge in the prompt. To lower her credence would be to violate the norm of deference to known objective probabilities.

  Finally, we address whether indexical or self-locating information alters this relation. One might argue that Alice should wonder: "Am I in the facility where the law holds, or the one where the frequency is $0.4$?" If the $0.4$ facility operates under a different physical law, Alice has self-locating uncertainty about which chance function applies to her atom. However, the prompt stipulates she *knows* the chance is $2/3$ for the process she is engaging in. This implies she has already ruled out the possibility that she is in a "different law" world. If the $0.4$ data comes from the *same* law, then self-location is irrelevant; the propensity is identical in both facilities. Indexical information only threatens PP if it introduces uncertainty about the value of $x$ in $Ch(A)=x$. Since Alice's knowledge of the quantum theory fixes $x=2/3$ for her context, her location within the statistical run does not change the objective propensity of the specific atom at $t$.

  In conclusion, Alice must maintain a credence of $2/3$. The frequency data is admissible but outweighed by the direct knowledge of the chance function. It does not undermine the chance because it is compatible with the law, and the PP requires deference to the known chance conditional on admissible evidence. Self-locating uncertainty does not disrupt this unless it casts doubt on the law itself, which the scenario precludes. Rationality requires deferring to the objective chance, even when the historical record looks suspicious.

  ***

  **Marking Scheme (Total: 20 Points)**

  | **Conceptual Move** | **Points** | **Criteria for Full Credit (A Answer)** | **Typical Failure (C/B Answer)** |
  | :--- | :---: | :--- | :--- |
  | **(i) Admissibility** | 5 | Clearly distinguishes evidence *about* chance (inadmissible) vs. evidence *from* chance (admissible). Argues frequency is compatible with chance $2/3$. | Treats all frequency data as inadmissible automatically, or claims frequency data *defines* chance (Humean confusion). |
  | **(ii) Undermining** | 5 | Explains undermining requires future/present history to make chance impossible. Distinguishes statistical fluctuation from logical incompatibility. | Recites Lewis's "Big Bad Bug" without applying it; claims any deviation undermines the law. |
  | **(iii) Conditional PP** | 5 | Correctly cites $Cr(A | Ch(A)=x \ \& \ E) = x$. Argues that since $Ch$ is known and $E$ admissible, credence locks at $x$. | Applies PP unconditionally ($Cr(A|Ch(A)=x)=x$) ignoring $E$, or averages $2/3$ and $0.4$ (intermediate position). |
  | **(iv) Indexicality** | 5 | Argues self-location only matters if it creates uncertainty about *which* chance applies. Since chance is known, location is irrelevant. | Claims being in the "40% run" changes the chance, or ignores the prompt's stipulation that she *knows* the chance. |

  **Grading Notes:**
  *   **A Answer (18-20 pts):** Executes distinctions precisely; acknowledges tension but resolves it via the definition of admissibility and the stipulation of knowledge.
  *   **B Answer (14-17 pts):** Summarizes Lewis and PP correctly but struggles to resolve the tension between the frequency data and the chance, often wavering on whether to conditionalize.
  *   **C Answer (10-13 pts):** Recites standard formulations but misapplies admissibility or conflates frequency with chance.
