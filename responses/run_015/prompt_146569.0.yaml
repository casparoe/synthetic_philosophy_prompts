      *   *Lewis's Undermining:* Usually involves future frequencies determining the chances themselves (Humean Supervenience). Here, the prompt specifies "independently verified long run." This suggests the evidence is about the *past* or a *parallel* sequence, not necessarily the future determining the present chance. However, if the chance is defined by the best system (Lewis), a massive deviation might suggest the *law* is different.
      *   *The Solution Path:* The key is distinguishing between evidence *about* the chance (inadmissible) and evidence that is merely *about outcomes* but compatible with the chance (admissible). If the chance is *known* to be 2/3 (perhaps by theory), does the frequency data defeat that knowledge?
      *   *Move (i):* Admissibility. Is frequency data admissible? Usually yes, *unless* it entails something about the chance value itself.
