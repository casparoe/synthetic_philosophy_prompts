      *   *Correction on Move 3:* The prompt asks to apply PP to *conditional* chances. I need to be careful. $Cr(A | Ch(A)=2/3 \& E)$. If $E$ is admissible, it's 2/3. If $E$ implies $Ch(A) \neq 2/3$, the antecedent is false. I need to argue $E$ is compatible with $Ch(A)=2/3$.
