answer: |-
  **Chapter Proposal: The Deontic Limit**
  **Working Title:** Supertasks and the Determinacy of Obligation: A Normative Analogue to Thomson's Lamp

  **1. Research Question**
  This chapter investigates whether deontic statuses (specifically, positive duties of rescue) are determinate at the limit of a normative supertask. Using the structural logic of Thomson's Lamp, I construct a scenario where an agent's obligation to act toggles between obtaining and not obtaining across an infinite sequence of intervals converging on a limit time $t_1$. The central question is: **Does the agent possess a determinate duty at $t_1$, and does the answer depend on whether obligations are modeled as discrete binary states or continuous scalar values?**

  **2. Background and Problem Statement**
  Thomson's Lamp presents a physical object toggled on/off at intervals $1/2, 1/4, 1/8 \dots$ prior to $t_1$. Benacerraf famously argued that the physical description of the prior intervals does not logically entail the state of the lamp at $t_1$, suggesting indeterminacy or conceptual incoherence in the task itself.

  Standard responses focus on physical impossibility (causal continuity) or logical underdetermination. However, these responses rely on the metaphysics of physical objects and causal history. Normative facts do not obviously share the same mereological or causal constraints as physical switches. A duty is grounded in reasons (e.g., capacity to help, cost to agent, severity of need). If these grounding facts can oscillate (e.g., the cost of rescue fluctuates above and below a threshold of reasonableness), the supertask becomes conceptually possible even if physically unrealistic.

  The problem is that existing literature treats supertasks as puzzles for physics or mathematics, not for deontic logic. If obligations are discrete (you either have a duty or you don't), the limit state is undefined, mirroring the lamp. If obligations are continuous (degrees of obligatoriness), the limit might converge. This chapter tests whether the metaphysics of normativity requires continuity to avoid indeterminacy at the limit.

  **3. Why Standard Replies Do Not Automatically Apply**
  I will argue that two standard moves in the Thomson/Benacerraf debate fail to resolve the normative case:

  *   **The Causal Continuity Objection:** In the physical lamp, indeterminacy arises because there is no causal mechanism to set the state at $t_1$ based on an infinite past. In the normative case, duties are not caused by prior duties; they are grounded in contemporaneous facts. If the grounding facts (e.g., risk/cost ratios) have a mathematical limit at $t_1$, the duty might be determinate even if the history is oscillatory. The lack of a "last toggle" is less problematic for supervenient normative facts than for causal physical states.
  *   **The Logical Underdetermination Objection:** Benacerraf argues the description of the lamp is incomplete. In the normative case, the "description" includes the grounding principles of the duty. If our ethical theory specifies how duties supervene on natural properties, the theory itself might dictate the limit state (e.g., via a continuity principle), whereas physics dictates no such principle for lamp switches.

  Therefore, the indeterminacy of the lamp does not transfer automatically to the "Deontic Lamp." Resolving it requires analyzing the topology of normative space.

  **4. Methodology and Work Plan**
  The chapter will proceed in three phases over six months:

  *   **Months 1–2: Formalization of the Normative Supertask.**
      I will construct a rigorous model of the toggle scenario. Instead of a vague "duty," I will define the duty as a function $D(t)$ dependent on a variable $V(t)$ (e.g., cost-to-benefit ratio). $V(t)$ will oscillate such that $D(t)$ flips between 1 (obligatory) and 0 (optional) at each half-interval. I will utilize temporal deontic logic to represent the sequence and define the limit condition formally.
  *   **Months 3–4: Conceptual Analysis of Deontic Continuity.**
      I will evaluate two competing models of obligation:
      1.  *Discrete Model:* Duties are binary. I will argue this leads to a "Deontic Gap" at $t_1$ (no fact of the matter).
      2.  *Continuous Model:* Duties admit of degrees (scalar deontology). I will test whether modeling obligation as a real-valued function $O(t) \in [0,1]$ allows the sequence to converge at $t_1$, thereby resolving the indeterminacy.
      I will assess whether adopting the Continuous Model creates unacceptable downstream consequences for moral decision-making (e.g., does it violate the "ought implies can" principle if the limit requires infinite precision?).
  *   **Months 5–6: Drafting and Refinement.**
      Synthesis of the formal model and conceptual analysis into a draft chapter. I will focus on clarifying the implication: if the Discrete Model leads to indeterminacy, does this constitute a *reductio* against discrete deontic logic, or does it prove normative supertasks are impossible?

  **5. Criteria for Success and Failure**
  *   **Success:** The chapter successfully demonstrates that the determinacy of moral status at a limit point is contingent on the topological structure of the normative theory (discrete vs. continuous). It produces a formal argument showing that binary deontic logic cannot resolve the state at $t_1$ without additional bridging principles.
  *   **Failure:** The scenario collapses because the "toggling" of grounding facts is shown to be conceptually incoherent (e.g., if reasons cannot oscillate infinitely fast even in principle). If the supertask is impossible to describe normatively, the question dissolves.
  *   **Mitigation:** If the scenario is deemed impossible, the chapter will pivot to argue *why* normative facts resist supertask structures, which is itself a substantive claim about the metaphysics of ethics (i.e., proving normative continuity is a necessary constraint on ethical theories).

  **6. Feasibility Assessment and Risks**
  **Is this too big for six months?**
  There is a significant risk that this topic is too ambitious for a single chapter.
  *   *Risk 1:* Developing a novel formal logic for continuous obligation is technically demanding and could consume the entire timeline.
  *   *Risk 2:* The literature on "infinite ethics" and "population axiology" touches on similar limit problems; ensuring distinctness without getting bogged down in comparative lit review is difficult.

  **Scope Management:**
  To ensure completion within six months, I will restrict the scope in the following ways:
  1.  I will not attempt to solve the general problem of infinite ethics, only the specific limit-point determinacy problem.
  2.  I will adopt an existing framework for scalar deontology rather than building a new one from scratch, using it as a test case for the limit argument.
  3.  If the formalization proves too time-consuming, I will prioritize the conceptual argument (the *implications* of indeterminacy) over the rigorous proof of the model.

  **Committee Guidance Requested:**
  I would appreciate feedback on whether the committee prefers a stronger focus on the formal logic (Months 1–2) or the meta-ethical implications (Months 3–4), as balancing both tightly within six months is the primary bottleneck.
