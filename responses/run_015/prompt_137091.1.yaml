          *   *Substitution Probe:* Is it rigged? "Keep the functional role." If the functional role of grief is to signal loss, can you signal loss without the pain? Maybe. But if the *experience* of the good *is* the relief from pain, the probe might be stripping the essence. This is the biggest philosophical risk.
      *   **The Pascal's Wager/Uncertainty Point:**
