answer: |-
  # ADVERSARIAL COLLABORATION PROTOCOL: FUNCTIONAL ROLES VS. CONSTITUTIVE REALIZATION

  **To:** Seminar Participants  
  **From:** Chair  
  **Date:** End of Term  
  **Subject:** Closing Protocol on Multiple Realizability and Realization  

  ## PART 1: AGREED CLAIMS

  The following claims constitute the common ground for this collaboration. Signing indicates acceptance of these premises as the basis for the subsequent dialectic. Each claim is substantive; acceptance should entail a commitment to specific consequences in the Cruxes (Part 3).

  1.  **Causal Efficacy:** Mental states confer causal powers upon the subject; specifically, they contribute to the explanation of behavior and reportive output.
  2.  **Physical Basis:** Every instantiated mental state is associated with a physical state of the subject that possesses intrinsic causal powers.
  3.  **Protocol Validity:** The Graft Intervention (replacing a neural state type with a structurally different state type preserving I/O) and the Rewire Intervention (altering upstream/downstream partners preserving local causal profile) are conceptually coherent and assumed performable within this thought experiment.
  4.  **Reportive Authority:** In cases of conflict between third-person physical observation and first-person report regarding mental kind attribution, the subject's report under controlled conditions is the primary datum for determining whether a mental kind is present.
  5.  **Existence of Multiplicity:** There exists at least one mental kind *M* and two distinct physical types *P1* and *P2* such that *P1* realizes *M* in Subject A and *P2* realizes *M* in Subject B. (Both accept the existence of *some* multiplicity, though they disagree on its scope and significance).
  6.  **One-Realizer-Many-Roles:** There exist cases under the Rewire Protocol where a single physical state type realizes different mental kinds in different systemic contexts.
  7.  **(Tobias-Reluctant) Functional Sufficiency:** In standard biological cases, occupying the correct causal role is sufficient for instantiating the mental kind, regardless of minor variations in the physical substrate's intrinsic properties (e.g., metabolic rate, temperature) that do not alter the role.
  8.  **(Tobias-Reluctant) Physical Irrelevance:** There are physical differences between realizers that are metaphysically inert with respect to mental kind identity; two states can be mentally identical despite differing in these physical properties.
  9.  **(Nadia-Reluctant) Constitution Constraint:** The intrinsic causal powers of the physical realizer can constitutively constrain mental kind identity; two states occupying the same role may fail to be the same mental kind if their physical grounds differ too radically.
  10. **(Nadia-Reluctant) Identity Compatibility:** The truth of Multiple Realizability claims does not logically entail the falsity of all type-identity claims between mental and physical kinds at some level of description.
  11. **(Characterization of Substantive MR)** A case counts as *Substantive Multiple Realizability* worthy of metaphysical conclusion only if: (i) the distinct physical types differ in intrinsic properties that are causally relevant to *some* description of the system; (ii) these differences are not screened off by the functional role; and (iii) the mental kind attribution remains stable across the swap under the Graft Protocol.

  ## PART 2: DISAGREEMENTS TABLE

  | Issue | Nadia's Formulation (Role-Functionalism) | Tobias's Formulation (Realizationism) | Why This Is Not Merely Verbal |
  | :--- | :--- | :--- | :--- |
  | **1. The Nature of Realization** | Realization is **role-occupancy**: A physical state realizes a mental state iff it occupies the causal role definitive of that mental kind. The realizer is a contingent filler of a structural slot. | Realization is **constitutive grounding**: A physical state realizes a mental state iff its intrinsic powers ground the system's causal powers. The realizer is a metaphysical part of the mental state. | This determines whether changes to the realizer's intrinsic powers (that preserve I/O) alter the mental state. Nadia predicts stability; Tobias predicts potential divergence. This yields different predictions in Crux 3. |
  | **2. Taxonomic Priority** | **Role-Individuation:** Mental kinds are individuated by their relational properties (inputs/outputs). Physical taxonomy is subordinate; if the role is fixed, the mental kind is fixed. | **Realizer-Individuation:** Mental kinds are individuated partly by the nature of their physical ground. Physical taxonomy constrains mental taxonomy; if the ground differs significantly, the mental kind may differ even if the role is similar. | This determines whether cross-species or cross-substrate comparisons count as "the same" mental state. Nadia predicts equivalence; Tobias predicts differentiation. This yields different predictions in Crux 2. |
  | **3. Metaphysical Dependence** | **Autonomy:** Mental kinds are autonomous from physical kinds insofar as multiple physical kinds can sustain them. The mental kind exists independently of any specific physical type. | **Dependence:** Mental kinds depend on physical kinds such that the nature of the mental kind is inherited from the physical kind. The mental kind cannot be fully specified without referencing the physical ground. | This determines the probative force of MR. For Nadia, MR proves autonomy. For Tobias, MR is compatible with dependence. This affects whether MR refutes identity theories (Crux 1). |
  | **4. The Grain of Explanation** | **Coarse-Grain:** The correct level for mental explanation is the functional level. Physical details are explanatory noise unless they disrupt the role. | **Fine-Grain:** The correct level for mental explanation must include the constitutive physical details. Physical details are explanatory signal because they ground the powers. | This determines whether a "Market Mind" or "Hydraulic Mind" counts as having genuine mental states. Nadia accepts; Tobias rejects. This yields different predictions in Crux 1. |

  ## PART 3: THREE CRUXES

  The following sub-questions are designed to force a decision. Each is built around the Graft/Rewire Protocol. Both parties must record a prediction. A null result or a surprise outcome must incur a theoretical cost.

  ### Crux 1: The Grain Problem (The Market/Organ Case)
  **Question:** How finely must the role be specified to preserve mental kind identity, given that a coarse grain admits non-biological realizers and a fine grain eliminates cross-system MR?
  **Setup:** **Graft Protocol.** Replace a subject's visual cortex neural state with a functionally isomorphic system composed of a distributed network of human agents communicating via radio (a "Market Realizer"). The I/O profile (retinal input to behavioral output) is perfectly preserved. However, the internal structure is macroscopic, slow, and lacks biological homeostasis.
  **Constraint:** Nadia cannot stipulate that the correct grain is "whatever the neural realizer has." Tobias cannot deny the subject is conscious.
  **Predictions:**
  *   **Nadia:** The subject retains the same mental kinds (e.g., "seeing red"). The mental kind is defined by the role, which is preserved.
  *   **Tobias:** The subject instantiates a different mental kind (or a degraded simulacrum). The constitutive powers of a market network (social, linguistic, slow) do not ground the powers of visual experience, even if I/O matches.
  **Costs/Bullets:**
  *   **If Nadia is right:** She must bite the bullet that **any system** (including economies or bureaucracies) can instantiate mental kinds if functionally isomorphic. This costs her the intuition that mentality is biologically constrained.
  *   **If Tobias is right:** He must bite the bullet that **functional equivalence is insufficient** for mental identity. This costs him the ability to use functional data alone to attribute minds across divergent physical substrates, risking neural chauvinism.

  ### Crux 2: The Taxonomic Bridge (The Bat/Human Case)
  **Question:** What entitles us to call the role in two differently embodied systems the "same" role, given that they may share no input/output taxonomy?
  **Setup:** **Graft Protocol.** Graft a human neural state type responsible for "object perception" into a bat nervous system, rewired to process echolocation data instead of visual data. The local causal profile of the state is preserved, but the upstream inputs are sonic rather than photonic.
  **Constraint:** Tobias cannot deny that cross-species mental ascriptions (e.g., "the bat perceives the object") are ever true.
  **Predictions:**
  *   **Nadia:** The mental kind is the same ("Perceiving Object"). The role (object detection) is identical despite the modality shift. The MR argument holds across modalities.
  *   **Tobias:** The mental kind is different ("Visualizing" vs. "Sonicating"). The input taxonomy is part of the role's identity. The realizer's grounding powers are tuned to specific modal inputs.
  **Costs/Bullets:**
  *   **If Nadia is right:** She must bite the bullet that **modality is irrelevant** to mental kind identity. This costs her the ability to explain why visual pain differs from auditory pain, potentially collapsing distinct phenomenological kinds.
  *   **If Tobias is right:** He must bite the bullet that **cross-species mental equivalence is rare or nonexistent**. This costs him the ability to generalize cognitive neuroscience findings across species, limiting the scope of empirical science.

  ### Crux 3: The Inheritance Problem (The Noisy Graft Case)
  **Question:** Must the realizer's own powers constitutively ground the role's causal powers, or does merely occupying the role suffice?
  **Setup:** **Graft Protocol.** Replace a neural state with a synthetic state that matches the I/O profile but has a significantly higher noise profile and metabolic cost (e.g., 50% signal degradation compensated by amplification). The role is preserved, but the realizer's intrinsic powers are degraded.
  **Predictions:**
  *   **Nadia:** The mental kind persists unchanged. As long as the role is occupied (I/O preserved), the mental kind is stable. The realizer's inefficiency is irrelevant.
  *   **Tobias:** The mental kind degrades or shifts. Because the mental powers are grounded in the realizer's powers, a degradation in the realizer's powers (noise, instability) constitutes a degradation in the mental state itself.
  **Costs/Bullets:**
  *   **If Nadia is right:** She must bite the bullet that **mental states are detached from physical efficacy**. This costs her the ability to explain why brain damage (physical degradation) alters mental capacity, forcing her to treat physical damage as merely accidental to the mind.
  *   **If Tobias is right:** He must bite the bullet that **mental kinds are fragile**. This costs him the stability of mental attribution; minor physical fluctuations would imply constant mental kind shifting, making psychological explanation impractical.

  ## PART 4: CLOSING AUDIT

  **Verbal Disputes Identified:**
  A portion of this dispute is verbal, specifically concerning the definition of **"Realization."**
  *   **Why:** Nadia uses "realization" to mean *functional occupancy* (a relation between a role and a filler). Tobias uses "realization" to mean *constitutive grounding* (a relation between a whole and its parts). When Nadia says "The brain realizes the mind," she means "The brain fills the mind-slot." When Tobias says "The brain realizes the mind," he means "The mind is made of the brain."
  *   **Settlement:** This verbal disagreement is settled by the **Cruxes**. If Crux 1 (Market Graft) yields identical mental reports, Nadia's definition of realization (occupancy) tracks the phenomena better. If Crux 3 (Noisy Graft) yields degraded reports, Tobias's definition (grounding) tracks the phenomena better. The empirical outcome dictates which definition is scientifically fruitful.

  **Substantive Disputes Remaining:**
  The dispute over **Taxonomic Priority** (Crux 2) is not verbal. It is a disagreement about how to carve nature at its joints.
  *   **Why:** Even if we agree on definitions, we may disagree on whether "seeing" and "echolocating" are the same kind. This is not about words; it is about whether the universe contains a natural kind "Object Perception" that spans modalities, or whether nature only contains specific modal implementations.
  *   **Settlement:** This is settled by the **Rewire Protocol**. If rewiring a visual state to process sonic data yields reports indistinguishable from natural sonic processing, the functional role is the natural kind (Nadia wins). If the reports retain "visual" qualities despite sonic input, the physical ground is the natural kind (Tobias wins).

  **Final Adjudication:**
  The Multiple Realizability argument retains probative force **only if** Crux 1 and Crux 3 favor Nadia. If substantial physical differences (Market structure, Noise) alter mental kind attribution despite functional preservation, then MR is metaphysically inert, as Tobias claims. The burden of proof lies on Nadia to demonstrate that functional preservation is sufficient for mental identity in the face of constitutive divergence. The burden lies on Tobias to demonstrate that constitutive divergence matters without collapsing into neural chauvinism. The Graft/Rewire Protocol provides the mechanism to test this without recourse to literature.
