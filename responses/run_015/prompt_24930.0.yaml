answer: |-
  You have stumbled upon one of the most famous and enduring objections in modern moral philosophy. The specific move you are describing has a canonical name: **"One Thought Too Many."**

  It comes from **Bernard Williams**, specifically his 1981 essay *"Persons, Character, and Morality."* The example you cited (the burning building) is essentially the one Williams used, though he often framed it around a husband saving his wife.

  Here is the breakdown of the concept, its theoretical machinery, and how to distinguish it from the neighboring ideas you mentioned.

  ### 1. The Name: "One Thought Too Many"
  Williams argues that impartial moral theories (like Utilitarianism or Kantianism) require an agent to justify their personal actions through a universal principle. In the burning building case, an impartial theory might *permit* you to save your spouse, but it requires that the justification be something like, "In this instance, saving my spouse maximizes the good" or "This falls under a permissible exception clause."

  Williams says that for the spouse to be saved *as a spouse*, the thought process should simply be, "That is my wife." If you add the step, "...and impartial morality permits me to prioritize her," you have had **one thought too many**.

  The betrayal your hypothetical partner feels is a betrayal of **integrity**. It reveals that your commitment to them is contingent upon its passing a moral audit, rather than being a constitutive part of who you are.

  ### 2. The Mechanism: Exclusionary Reasons
  You mentioned the idea that some reasons "silence the question, not win the argument." This is the precise technical mechanism proposed by legal and moral philosopher **Joseph Raz**.

  Raz calls these **Exclusionary Reasons**.
  *   **First-order reasons:** Reasons to do something (e.g., "My wife is in there," "A stranger is in there").
  *   **Second-order reasons:** Reasons to act (or not act) for certain reasons.
  *   **Exclusionary Reason:** A second-order reason to *exclude* certain first-order reasons from deliberation.

  When you commit to a relationship or a project, you generate an exclusionary reason. You aren't just adding +10 points to your wife's side of the scale against the stranger's +5 points. You are ruling out the stranger's points as *deliberative inputs* in that context.

  If you weigh them, you have failed to understand the nature of the commitment. The commitment *is* the refusal to weigh. This distinguishes the view from simple **Partiality**. Partiality says, "You are allowed to tilt the scale." Exclusionary Reasons say, "There is no scale here."

  ### 3. Distinguishing the Edges
  You asked how this differs from neighboring concepts. Here is the map:

  **A. vs. Simple Partiality**
  *   **Partiality** is about the *permission* to favor. An impartialist can grant partiality (e.g., "Everyone saving their own kids leads to the best overall outcome").
  *   **One Thought Too Many** is about the *psychology of deliberation*. Even if impartialism *permits* you to save your spouse, it damages the relationship if that permission is what motivates or validates the act. The objection is phenomenological, not just normative.

  **B. vs. Incommensurability**
  *   **Incommensurability** claims that values (e.g., friendship vs. justice) cannot be measured on a single scale.
  *   **One Thought Too Many** is compatible with commensurability. Williams doesn't necessarily say the values *can't* be compared by a god's-eye observer. He says the *agent* cannot compare them without destroying their integrity. You can acknowledge the stranger has equal moral worth objectively, but subjectively, your deliberative architecture must silence that fact.

  **C. vs. The Demandingness Objection**
  *   **Demandingness** says, "Impartial morality asks too much of me (too much sacrifice)."
  *   **One Thought Too Many** says, "Impartial morality asks the wrong thing of me (the wrong kind of thinking)." You could have a morality that demanded very little but still required you to justify your love impartially. Williams would still object. The problem isn't the cost; it's the alienation from your own motives.

  **D. vs. Stocker's "Schizophrenia"**
  *   Michael Stocker (1976) argued that modern ethics creates a split between **justification** (why the act is right) and **motive** (why you did it). If you visit a friend in the hospital out of "duty" rather than "friendship," the friendship is hollow.
  *   **Distinction:** Stocker focuses on the *motive* (love vs. duty). Williams focuses on the *deliberative structure* (weighing vs. silencing). They are cousins, but Williams is more concerned with the threat to personal **integrity** and **ground projects**, while Stocker is concerned with the warmth of human interaction.

  ### 4. The Impartialist Counter-Move
  It is worth noting how impartialists respond, because it clarifies the boundaries of the concept.

  Sophisticated consequentialists (like Peter Railton or R.M. Hare) often reply with **Indirect Consequentialism** or **Motive Utilitarianism**. They argue:
  > "The best way to maximize the good is to cultivate a character that *doesn't* calculate impartially in intimate moments. So, you *should* have 'one thought too few.' But the ultimate *justification* for that character is still impartial."

  Williams rejects this. He calls it a form of **government house utilitarianism**. He argues that if you know the ultimate justification is impartial, that knowledge inevitably "leaks" into your deliberation. You can't truly have a non-calculating relationship if you know it is only permitted because it passes a calculation. The "one thought" creeps back in.

  ### 5. Summary Terminology
  If you are writing or discussing this, here is the precise vocabulary to use:

  1.  **The Objection:** "The One Thought Too Many" objection (Williams).
  2.  **The Harm:** "Alienation" from one's **Ground Projects** or **Integrity**.
  3.  **The Structure:** **Exclusionary Reasons** (Raz) or **Silencing Reasons**.
  4.  **The Category:** A critique of the **Deliberative Priority** of impartial morality (not just its content).

  ### Conclusion
  You have correctly identified that this is not just about *what* we do, but *how we think* about what we do. It is the claim that moral theory should not colonize the entire space of deliberation.

  If you need a label for the specific phenomenon where the *act of weighing* destroys the *value of the commitment*, **"Deliberative Alienation"** is a strong descriptive term, but **"One Thought Too Many"** is the historical anchor. It marks the boundary where moral philosophy stops being a guide to action and starts being a threat to the self.
