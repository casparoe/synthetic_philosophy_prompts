      *Refining the "What Travels" point:* Jordan's last point is actually strong. If information travels but matter doesn't, is it time travel? If matter travels but breaks causal chains, is it the same person? This touches on the "Ship of Theseus" applied to time.

      *Refining the "Dodging" accusation:* Riley isn't exactly dodging, but is prioritizing logical consistency over metaphysical satisfaction. Jordan is prioritizing metaphysical satisfaction over logical possibility.

  6.  **Final Polish:** Check against constraints (no paper lists, focus on logic). Ensure the distinction between "Changing the Past" (impossible in single line) and "Affecting the Past" (possible in branching) is clear.

