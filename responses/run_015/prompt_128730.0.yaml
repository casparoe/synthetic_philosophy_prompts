answer: |-
  # Desiderata for a Theory of Slurs

  ## I. The Dual-Job Constraint
  You have requested a theory that performs two distinct jobs:
  *   **(a) Predictive:** Identify slurs, targets, and offensiveness scales across arbitrary languages.
  *   **(b) Normative:** Explain the wrongness of utterances, context-dependence, and appropriate responses.

  **Preliminary Verdict:** No single *semantic* theory can adequately perform both jobs simultaneously without contradiction. The Predictive Job requires type-level stability (the word *means* this everywhere), while the Normative Job requires token-level sensitivity (the harm depends on *who* says it *where*).
  **Recommendation:** Give up the strong version of **(a)**. A theory cannot predict slur-status for an "arbitrary expression in an arbitrary language" based solely on linguistic form. Slur-status is not an intrinsic lexical property like [±Noun]; it is a socio-historical status. A theory stripped of the strong Predictive Job should look like a **Normative-Pragmatic Framework**: it treats "slur" as a status conferred by social practice upon a linguistic vehicle, rather than a semantic feature of the vehicle itself. It predicts usage patterns only relative to a specific speech community's history.

  Below are the desiderata for such a framework.

  ---

  ## II. The Desiderata List

  ### A. Semantic and Lexical Stability (The Predictive Core)
  *These requirements ensure the theory accounts for the linguistic behavior of the terms.*

  **1. The Etymological Independence Requirement**
  *   **Desideratum:** The theory must distinguish between a word's historical origin and its current semantic status. A word that was a slur but is now neutral must be classified as neutral.
  *   **Motivation:** Case 1 (Philological slur, current neutral).
  *   **Status:** **Non-negotiable.** (Contradicts theories tying slur-status to eternal essence or original intent).

  **2. The Productivity Requirement**
  *   **Desideratum:** The theory must explain how new slurs are generated instantly via morphology, phonology, or gesture without prior lexical entry.
  *   **Motivation:** Case 2 (Novel coinage/affixes), Case 9 (Prosody/Gesture).
  *   **Status:** **Non-negotiable.** (Contradicts theories requiring fixed lexical entries for all slurs).

  **3. The Embedding and Projection Requirement**
  *   **Desideratum:** The theory must explain why offensive force survives (or attenuates) in non-assertoric contexts (negation, conditionals, questions, quotation). It must account for why quoting a slur in a linguistics lecture is still marked/risky compared to quoting a neutral term.
  *   **Motivation:** Case 6 (Embedding contexts).
  *   **Status:** **Non-negotiable.** (The primary failure point of pure Pragmatic Inference theories).

  **4. The Taxonomy Flexibility Requirement**
  *   **Desideratum:** The theory must allow slurs to function even when the target does not exist, the taxonomy is scientifically false, or the target is not a member of the group.
  *   **Motivation:** Case 5 (Misapplication/False taxonomy).
  *   **Status:** **Non-negotiable.** (Contradicts theories requiring successful reference for the slur to function).

  ### B. Social and Normative Variance (The Normative Core)
  *These requirements ensure the theory accounts for the harm and usage norms.*

  **5. The Community-Relativity Requirement**
  *   **Desideratum:** The theory must allow the same lexical item to have different normative statuses for different communities simultaneously.
  *   **Motivation:** Case 3 (Cross-cultural borrowing/divergent uptake).
  *   **Status:** **Non-negotiable.** (Contradicts universalist semantic theories).

  **6. The Neutral-Counterpart Independence Requirement**
  *   **Desideratum:** The theory must explain the derogatory force of a term even if no neutral counterpart exists or if the neutral counterpart is also stigmatized.
  *   **Motivation:** Case 4 (No neutral alternative).
  *   **Status:** **Non-negotiable.** (Contradicts theories defining slurs solely as "pejorative versions of neutral term N").

  **7. The Reclamation and Appropriation Requirement**
  *   **Desideratum:** The theory must distinguish between in-group and out-group usage conditions without positing lexical ambiguity. It must explain how reclamation changes norms without necessarily changing dictionary meaning immediately.
  *   **Motivation:** Case 7 (In-group endearment/Reclamation).
  *   **Status:** **Non-negotiable.** (The primary failure point of pure Content/CI theories).

  **8. The Diachronic Drift Requirement**
  *   **Desideratum:** The theory must account for how successor terms inherit offense and how slurs can lose group-specificity to become general insults.
  *   **Motivation:** Case 8 (Semantic drift/Successor terms).
  *   **Status:** **Preference** (Internal to historical pragmatics programmes, but necessary for a complete picture).

  **9. The Scope of Target Requirement**
  *   **Desideratum:** The theory must apply to slurs targeting voluntary, dominant, occupational, or regional groups, not just immutable ethnic/racial categories.
  *   **Motivation:** Case 10 (Non-ethnic/Dominant targets).
  *   **Status:** **Preference** (Some theories restrict "slur" to power-imbalanced groups; this desideratum demands a broader linguistic definition).

  **10. The Gradability Requirement**
  *   **Desideratum:** The theory must accommodate scales of offensiveness rather than a binary slur/not-slur switch.
  *   **Motivation:** Job (a) scale requirement; Case 8 (Drift).
  *   **Status:** **Non-negotiable.** (Sociolinguistic fact).

  ---

  ## III. Required Distinctions
  An adequate theory must not collapse the following distinctions. Collapsing them leads to the counterexamples listed above.

  1.  **Slur vs. Pejorative vs. Epithet vs. Profanity:**
      *   *Slur:* Group-directed, historically tied to oppression/stigma.
      *   *Pejorative:* General negative evaluation (e.g., "jerk").
      *   *Epithet:* Fixed phrase, often descriptive but derogatory.
      *   *Profanity:* Taboo violation (religious/sexual/excretory) not necessarily group-directed.
      *   *Constraint:* A theory of slurs must not treat them merely as strong profanity (violates Case 10) or mere pejoratives (violates Case 7).

  2.  **Targeting vs. Referring vs. Predicating:**
      *   One can *refer* to a group using a slur without *predicating* the slur's content of them (e.g., "The [slur] who lives next door is nice").
      *   *Constraint:* The theory must separate the referential mechanism from the expressive content.

  3.  **Content vs. Force vs. Uptake vs. Harm vs. Wrongness:**
      *   *Content:* What is said.
      *   *Force:* The illocutionary power (insulting).
      *   *Uptake:* How the hearer receives it.
      *   *Harm:* The psychological/social damage.
      *   *Wrongness:* The moral violation.
      *   *Constraint:* A word can have the *content* without causing *harm* (Case 7), or cause *harm* without the speaker intending the *force* (Case 3). The theory must locate the "slur-ness" in one of these layers consistently. **Recommendation:** Locate it in *Force/Norm*, not *Content*.

  4.  **Norm Against Use vs. Difference in Meaning:**
      *   Is it wrong to say because it *means* something bad, or does it *mean* something bad because it is wrong to say?
      *   *Constraint:* Must not conflate semantic prohibition with moral prohibition.

  5.  **Type-Level vs. Token-Level:**
      *   *Type:* The word in the lexicon.
      *   *Token:* The specific utterance.
      *   *Constraint:* Case 7 (Reclamation) proves type-level offense does not guarantee token-level offense.

  6.  **Binary vs. Graded:**
      *   *Constraint:* Offense is scalar (Case 10, Job a).

  **Sociolinguistic Constraint:** The theory must not contradict the finding that linguistic meaning is socially negotiated and variable across speech communities (Labovian variation). It cannot posit a "God's eye" view of slur status.

  ---

  ## IV. The Incompatibility Flag

  **The Conflict:** You cannot jointly satisfy **Desideratum 3 (Embedding)** and **Desideratum 7 (Reclamation)** within a single monolithic semantic mechanism.

  *   **Why:** To satisfy Embedding (Case 6), the offensive content usually needs to be "semantic" or "conventional" so it projects out of negation/conditionals. To satisfy Reclamation (Case 7), the offensive content must be "pragmatic" or "normative" so it can be cancelled by in-group status.
  *   **The Exclusionary Requirement:** **Desideratum 3 (Embedding and Projection)** is the single requirement that excludes the largest share of current candidates.
      *   *Pragmatic/Inference theories* fail here (offense shouldn't project if it's just an inference about speaker attitude).
      *   *Use-Prohibition theories* fail here (why is quoting the word prohibited if the prohibition is on *using* it to harm?).
      *   *Content/CI theories* satisfy this but fail Reclamation.

  **The Trade-off:**
  If you prioritize the **Predictive Job (a)**, you must treat slur content as semantic (Content/CI theories). You will successfully predict embedding behavior but fail to explain why in-group use is permissible (Reclamation) or why cross-cultural uptake varies (Case 3).
  If you prioritize the **Normative Job (b)**, you must treat slur content as pragmatic/normative (Pragmatic/Prohibition theories). You will successfully explain reclamation and harm but struggle to explain why the offense survives in a linguistics lecture (Embedding).

  **Recommendation:** Prioritize the **Normative Job**. A theory of slurs is ultimately an ethical-political inquiry disguised as linguistics. It is better to explain *why* it is wrong (and when it isn't) than to explain why it projects in a conditional. The embedding data should be treated as a secondary pragmatic phenomenon (e.g., "echoic mention" or "metalinguistic focus") rather than proof of semantic content.

  ---

  ## V. Scoring the Four Standard Families

  | Family | Predictive (ID/Scale) | Normative (Wrongness/Response) | Embedding (Case 6) | Reclamation (Case 7) | Cross-Cultural (Case 3) |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **1. Truth-Conditional Content**<br>(Slur encodes hateful truth conditions) | **High**<br>(Stable meaning) | **Low**<br>(Cannot explain in-group permission) | **High**<br>(Content projects) | **Fail**<br>(Requires lexical ambiguity) | **Fail**<br>(Meaning should be universal) |
  | **2. Conventional Implicature / Expressive**<br>(Slur encodes attitude as CI) | **High**<br>(Stable convention) | **Medium**<br>(Attitude can be disowned) | **High**<br>(CIs project) | **Low**<br>(Hard to cancel CI by identity) | **Low**<br>(Conventions vary slowly) |
  | **3. Pragmatic Inference**<br>(Slur is neutral + context implies hate) | **Low**<br>(Unstable prediction) | **High**<br>(Context determines harm) | **Fail**<br>(Inferences shouldn't project) | **High**<br>(Context explains permission) | **High**<br>(Uptake is local) |
  | **4. Use-Prohibition / Normative**<br>(Slur is a word one ought not use) | **Medium**<br>(Rules are learnable) | **High**<br>(Defines wrongness directly) | **Medium**<br>(Taboo often projects) | **High**<br>(Rules vary by group) | **High**<br>(Norms are local) |

  **Winner:** **Family 4 (Use-Prohibition/Normative)**, modified with a pragmatic account of embedding. It is the only one that treats the "Normative Job" as primary, which aligns with the recommendation to drop the strong Predictive Job.

  ---

  ## VI. Settling Observations

  To resolve the two biggest disagreements (Embedding vs. Reclamation), the following empirical observations would be decisive:

  1.  **The "Quotation Test" for Reclaimed Slurs:**
      *   *Observation:* When an out-group member quotes an in-group reclaimed slur (e.g., in a news report or lecture), does the offense register as *equal* to the direct use, *attenuated*, or *absent*?
      *   *Significance:* If offense remains high, it supports **Semantic/CI** theories (the word carries the poison). If offense attenuates significantly compared to direct use, it supports **Pragmatic/Normative** theories (the harm is in the act of addressing, not the word).

  2.  **The "Novel Coinage Projection" Test:**
      *   *Observation:* When a novel slur is coined (Case 2) and immediately embedded in a conditional ("If you are a [novel slur], then..."), do hearers perceive the speaker as endorsing the derogatory taxonomy?
      *   *Significance:* If endorsement is perceived even in the antecedent, it suggests **semantic content** is generated instantly. If not, it suggests **pragmatic inference** based on speaker commitment.

  **Final Note:** The literature advances one example at a time because the phenomenon is fragmented. A theory that claims to solve Case 6 will likely break on Case 7. Your paper should argue that this fragmentation is a feature, not a bug: "Slur" is not a natural kind in linguistics, but a cluster concept spanning semantics, pragmatics, and ethics. The desiderata above map the cluster; no single theory will capture the center because there is no center.
