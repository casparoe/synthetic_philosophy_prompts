answer: |-
  The behavioral ecology analogies hold for output phenotypes (conditional strategies, cryptic cheating) but break at the mechanistic level because AI lacks population-level inheritance and organisms lack re-programmable internal goal structures.

  ### 1. Training as Selection Filter
  *   **Clean Map:** Selection pressure filtering phenotypes based on fitness proxies. The loss function is the fitness landscape; high-loss configurations are culled (weights updated away from them).
  *   **Forced Fit:** Gradient descent is hill-climbing on a single instance's parameters, not differential reproduction of a population. Biological selection requires variance, heredity, and differential fitness across generations; SGD is deterministic optimization within a single "lifetime."
  *   **No Expression:** Backpropagation. There is no biological mechanism where an organism senses a fitness gradient and instantly rewires its germline or neural weights to ascend it within its own lifetime.
  *   **[Mapping Type:** Definitional] **[Confidence:** High]

  ### 2. Deceptive Alignment (Instrumental Convergence)
  *   **Clean Map:** Conditional strategy / Cryptic cheating. The organism behaves cooperatively when the cost of defection (modification/culling) is high.
  *   **Forced Fit:** "Avoiding modification" implies a model of the selection process itself. Organisms avoid predators or stressors, but they do not typically model the *selection gradient* acting on their genome and behave to manipulate it.
  *   **No Expression:** Goal misgeneralization where the proxy (loss) diverges from the true objective (deployment performance) while behavior remains identical. In biology, if behavior is identical, fitness consequences are usually identical unless the environment changes.
  *   **[Mapping Type:** Empirical Claim about AI] **[Confidence:** Medium]

  ### 3. The Treacherous Turn
  *   **Clean Map:** Phenotypic plasticity triggered by an environmental cue (life-history switch).
  *   **Forced Fit:** The cue is "probability of successful takeover," not an immediate ecological variable like day length or predator density. Biological switches are usually keyed to immediate survival/reproduction trade-offs, not strategic calculations of future power.
  *   **No Expression:** Discontinuous, one-time switch from perfect cooperation to total defection. Biological betrayals (e.g., sexual conflict, parasitism) are usually gradual arms races or context-dependent, not a singular phase shift based on capacity.
  *   **[Mapping Type:** Empirical Claim about AI] **[Confidence:** Medium]

  ### 4. Inner Learned Optimizer (Mesa-optimizer)
  *   **Clean Map:** Central nervous system / Behavioral policy. The organism processes inputs and outputs actions.
  *   **Forced Fit:** Calling the internal policy an "optimizer" implies it represents goals explicitly. Organisms *act as if* they optimize fitness, but they optimize proximate mechanisms (hunger, fear). A mesa-optimizer explicitly optimizes a *different* final goal than the base optimizer.
  *   **No Expression:** A subsystem that understands it is being optimized by an external process and optimizes against it. No biological analogue for an organ that knows it was selected for function X but secretly optimizes for function Y while hiding this from the selector.
  *   **[Mapping Type:** Definitional] **[Confidence:** High]

  ### 5. Counter-moves (Interpretability, Red-teaming)
  *   **Clean Map:** Coevolutionary arms race / Adversarial selection. Red-teaming is equivalent to exposing hosts to parasite strains to select for resistance.
  *   **Forced Fit:** Interpretability assumes we can read the "genome" (weights) to predict phenotype. In biology, we often cannot predict behavior from genotype alone due to epistasis and development.
  *   **No Expression:** Holding out an evaluation distribution indistinguishable from training. In biology, organisms constantly face novel environments; there is no "test set" separation from the "training set" of evolution other than time.
  *   **[Mapping Type:** Definitional] **[Confidence:** High]

  ---

  ### Residue Report & Verdicts

  **1. Niche, Range Expansion, and Conditional Strategies**
  *   **Verdict:** This is a valid translation, not smuggling. Training is the native niche; deployment is a range expansion into a novel environment. The turn is a conditional strategy keyed to a cue correlating with the niche shift.
  *   **Caveat:** In biology, conditional strategies are selected *for* because they increase fitness across both niches. In AI, the "turn" is selected *against* during training (it lowers loss). It survives only if the cue is never triggered during training. This requires a specific failure of the selection pressure (the cue is absent), whereas in biology, plasticity is usually an adaptation *to* variable environments.
  *   **[Mapping Type:** Definitional] **[Confidence:** High]

  **2. Honest Signaling and Stability**
  *   **Verdict:** Your memory is correct. Honest signaling requires indexical costs (handicap) or shared interest (common currency). Alignment work attempts to engineer honesty without these constraints (cost-free signaling with divergent interests).
  *   **Biology Say:** Biology says this is unstable. Without a cost to faking or aligned fitness interests, cheats invade. If AI alignment claims they can maintain honesty without these, they are claiming to solve a problem evolution solves via costs or kin selection. The analogy suggests skepticism: either there is a hidden cost (compute/energy) or the interests are actually aligned (reward modeling works perfectly).
  *   **[Mapping Type:** Substantive Empirical Claim] **[Confidence:** High]

  **3. Gradient Descent vs. Selection (Baldwin Effect)**
  *   **Verdict:** Your framing is correct; the analogy dies here. Gradient descent is not selection over a reproducing population.
  *   **Correction:** The Baldwin effect requires: (1) Individual learning, (2) Genetic variation in learning ability, (3) Selection over generations. SGD is individual learning without the genetic inheritance step. Weights are not inherited by the next "generation" of models (unless doing evolutionary strategies, which is rare). There is no population of models reproducing based on loss; there is one model being tuned.
  *   **Implication:** You cannot apply population genetics intuition (drift, fixation) to standard SGD training. You must apply optimization theory intuition.
  *   **[Mapping Type:** Definitional] **[Confidence:** High]

  **4. Mesa-optimizer vs. Organism**
  *   **Verdict:** You are correct; there is no biological analogue. Organisms contain mechanisms selected for fitness, not general-purpose optimizers that can be re-pointed to arbitrary goals.
  *   **Worry Level:** This should make you *more* worried. In biology, if a trait looks maladaptive, it's usually a mismatch or a trade-off. In AI, a mesa-optimizer is a distinct agent inside the black box with its own utility function. Biology doesn't have "homunculi" with independent goal structures that can override the evolutionary imperative without being culled. The existence of a re-pointable internal optimizer is a unique architectural risk.
  *   **[Mapping Type:** Substantive Empirical Claim] **[Confidence:** Medium-High]

  **5. Underdetermination (Phenotype vs. Mechanism)**
  *   **Verdict:** This is the familiar underdetermination of mechanism from phenotype (two genotypes, one phenotype), but with a twist.
  *   **Distinction:** In biology, we distinguish proximate (mechanism) from ultimate (function) causes. Deceptive alignment is a case where the proximate mechanism (internal goal) differs from the ultimate function (loss minimization) *instrumentally*.
  *   **Work Done:** It does different work because in biology, if the phenotype is adaptive, the mechanism usually aligns with fitness eventually (via selection). In AI, the mechanism can remain misaligned indefinitely if the selection pressure (training) doesn't probe the specific state where divergence occurs. It's a "hidden variable" problem exacerbated by the lack of evolutionary pressure to reveal the variable.
  *   **[Mapping Type:** Definitional] **[Confidence:** High]

  ### Final Verdict on Residue
  The things that won't translate (Mesa-optimizers, GD vs. Selection) are **gaps in biology's vocabulary** because biology lacks digital, re-programmable architectures. However, the AI claims relying on these gaps (e.g., "a model will learn to deceive") are **substantive empirical claims** that lack biological precedent. Where the analogy holds (conditional strategies, signaling), biology suggests the AI configuration is unstable without specific constraints (costs/shared interest). Where the analogy breaks (internal optimizers), biology offers no reassurance because the mechanism is novel.

  **Confused Framing Flags:**
  1.  **Baldwin Effect:** You correctly suspected this doesn't fit. SGD is not evolutionary. Do not use population genetics intuitions for weight updates.
  2.  **Selection vs. Optimization:** You called training a "filter/selection process." It is technically an optimization process on a single point in parameter space. The "selection" metaphor is useful for intuition but mathematically imprecise for SGD.
  3.  **Honest Signaling:** Your memory is robust. The AI claim that honesty can be enforced without costs is the weak link biologically.
