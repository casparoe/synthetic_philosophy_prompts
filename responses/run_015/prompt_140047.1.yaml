prompt: |-
  Please answer as a philosopher of mind who works closely with clinicians on disorders of consciousness, and think the problem through carefully before you write: I'd find it genuinely useful if you began by loosely brainstorming — without self-censoring — the different jobs the word "consciousness" might be doing in the practice I'm about to describe, and only then narrowed down to the question I actually want answered.

  I sit on a hospital ethics committee that is being asked to ratify a revised protocol for analgesia, prognostication, and end-of-life decisions in patients with severe brain injury. The current practice turns almost entirely on demonstrated capacity to respond: a patient who opens her eyes and cycles through sleep and wakefulness but shows no reproducible response to command at the bedside is recorded as lacking awareness, and that classification quietly drives a great deal — whether we pre-medicate for painful bedside procedures, how we frame prognosis to families, whether a withdrawal-of-treatment conversation is had at all. Yet when such a patient is later found to show command-following on task-based fMRI or EEG — the phenomenon now called cognitive motor dissociation, reported in a widely publicised 2024 multicentre study in roughly a quarter of patients who showed no behavioural response to commands — she is retroactively reclassified: we say she was conscious all along, we treat the earlier period as one in which she may have been suffering, and we say the behavioural assessment merely failed to detect her. So the pivot in practice is not behaviour as such but something behaviour is taken to be evidence of.

  What puzzles me is that the same committee is untroubled by several adjacent cases that seem to pull the other way. It regards patients with locked-in syndrome as fully conscious even when the only remaining output is a vertical eye movement, and it would continue to do so if even that were lost and a brain-computer interface were doing the reporting. It authorises analgesia for preverbal infants and for animals, where nothing report-like is available at all, on the basis of neural homology and behaviour. It treats dreaming as conscious experience despite there being no reporter online during REM sleep. And it is fairly relaxed about intraoperative awareness, where the whole point is that experience can occur with no behavioural signature. Meanwhile the committee has split into two factions over the revision. One proposes what I'll call the broadcast rule: any patient showing sustained, stimulus-triggered, widely distributed frontoparietal recurrent activity of the kind global workspace theory identifies with consciousness is to be classified as conscious irrespective of behaviour, and any patient showing only early sensory evoked responses is to be recorded as not conscious rather than as unknown. The other proposes the opposite: record unresponsiveness as unknown, never as absence, and treat unknown as a reason to give analgesia, on the grounds that phenomenal experience unaccompanied by global availability is something we can never rule out from the bedside.

  So here is what I want. Reconstruct the implicit theory of consciousness that the existing practice presupposes, and say precisely which parts of it the practice strictly requires, which it merely fits comfortably with, and where it is underdetermined so that several theories would license it equally well. Tell me whether the different strands I listed are mutually consistent — in particular, whether whatever distinguishes the locked-in patient from the unresponsive one can be stated without collapsing the distinction between access consciousness and phenomenal consciousness, and whether the infant-and-animal reasoning, if it is sound, does not generalise to the adult patient with a preserved cortex. Then tell me what each of the two proposed revisions would commit us to: what has to be true for the broadcast rule to be anything more than a relabelling of the current test, and whether the unknown-default rule is really a claim about consciousness or only about risk tolerance and the asymmetry of errors. A colleague insists none of this is a disagreement about consciousness at all — that we are simply using responsiveness as the best available fallible test, and the practice is thus compatible with any theory. I'd like you to take that deflation seriously and tell me how much of it is right, and where the confidence of the practice (withholding analgesia, framing prognosis as we do) outruns what a purely evidentiary reading licenses. Finally, please be explicit about your own epistemic status: separate what is reasonably settled among people who work on this from what is genuinely contested — including how well the global-broadcast signature actually tracks report, how to read global workspace theory itself, and how strong the empirical basis for the covert-response findings is — flag any place where you are relying on a contested empirical or interpretive claim rather than a consensus, and note which of your conclusions you would expect a reasonable neuroethicist to reject.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of mind working closely with clinicians on disorders of consciousness (DoC).
      *   **Task:**
          1.  Begin with loose brainstorming on the "jobs" the word "consciousness" does in the described practice (no self-censoring).
          2.  Narrow down to the specific questions asked.
          3.  Reconstruct the implicit theory of consciousness in existing practice (required vs. comfortable vs. underdetermined).
          4.  Assess consistency (Locked-in vs. Unresponsive, Infant/Animal reasoning vs. Adult).
          5.  Analyze the two proposed revisions (Broadcast Rule vs. Unknown-Default Rule).
          6.  Evaluate the colleague's deflationary claim (responsiveness as a fallible test compatible with any theory).
          7.  Explicitly state epistemic status (settled vs. contested, empirical claims, interpretive claims).
      *   **Tone:** Careful, philosophical, clinically informed, nuanced, honest about uncertainty.
      *   **Constraint:** Think through carefully before writing.

  2.  **Brainstorming the "Jobs" of "Consciousness" (Step 1):**
      *   *What work is the word doing here?*
      *   It's a moral marker (who counts?).
      *   It's a diagnostic label (what's broken?).
      *   It's a legal threshold (can we withdraw life support?).
      *   It's a proxy for suffering (do we give morphine?).
      *   It's a prediction tool (will they get better?).
      *   It's a metaphysical claim (is there a 'light on' inside?).
      *   It's a communicative shortcut for families ("they are in there" vs. "they are gone").
      *   It's a resource allocation triage (ICU beds are scarce).
      *   It's a liability shield (if we treat them as conscious and they aren't, no harm; if we treat as unconscious and they are, lawsuit).
      *   It's a scientific construct (GWT, IIT, etc.).
      *   It's a retrospective narrative ("she was conscious all along").
      *   *Key tension:* Is it an *ontological* status or an *epistemic* status?

  3.  **Reconstructing the Implicit Theory (Step 2):**
      *   *Current Practice:* Behavior is king *until* technology says otherwise.
      *   *Implicit Theory:* Consciousness = Capacity for Willful Interaction (Access). But... suffering (Phenomenality) is assumed to track Access.
      *   *Required:* A link between behavioral responsiveness and moral status.
      *   *Comfortable:* Global Workspace Theory (GWT) fits well (broadcast = report).
      *   *Underdetermined:* Does phenomenality *require* access? (Block's distinction). The practice assumes they track, but doesn't strictly *require* it, except when they diverge (CMD cases).
      *   *Locked-in vs. Vegetative:* Locked-in has *potential* for communication (even if minimal). Vegetative (UWS) does not. The distinction relies on *intact pathways*, not just experience.
      *   *Infants/Animals:* Reasoning is based on *homology* (similar brains = similar experience). If this applies to adults with preserved cortex but no output, the current practice is inconsistent *unless* the lack of output is taken as evidence of cortical dysfunction (which CMD challenges).

  4.  **Analyzing the Proposed Revisions (Step 3):**
      *   *Broadcast Rule (GWT-based):*
          *   Commitment: Consciousness *is* global availability. Phenomenality without access is impossible or irrelevant.
          *   Risk: False negatives if GWT is wrong (e.g., if IIT is right and posterior hot zones suffice).
          *   Is it relabeling? Yes, if fMRI/EEG broadcast is just a fancy behavioral test. No, if it claims to detect experience *without* potential for report.
      *   *Unknown-Default Rule (Precautionary):*
          *   Commitment: Epistemic humility. Phenomenality might exist without access.
          *   Is it about consciousness? No, it's about risk management (Pascal's Wager on suffering).
          *   Implication: Treat everyone as potentially conscious unless brain death.

  5.  **Evaluating the Deflationary Claim (Step 4):**
      *   *Colleague:* "It's just a fallible test."
      *   *Critique:* True for *diagnosis*, false for *ethics*. Withholding analgesia isn't just a diagnostic error; it's a moral gamble. If the test is fallible, the *confidence* in withholding treatment outruns the evidence. The practice treats "no response" as "no experience" (ontological claim), not just "unknown experience" (epistemic claim).

  6.  **Epistemic Status & Contested Claims (Step 5):**
      *   *Settled:* CMD exists (fMRI/EEG command following in UWS). Behavior is fallible.
      *   *Contested:* Does GWT broadcast *equal* consciousness? (vs. IIT). Does CMD imply *full* consciousness or fragmented awareness? How common is CMD? (25% is high, some argue lower).
      *   *My Stance:* I need to be clear where I'm speculating vs. citing consensus.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Voice:* Professional, empathetic to clinicians, rigorous philosophically.
      *   *Structure:* Follow the prompt's sequence exactly.
      *   *Brainstorming Section:* Make it look like a brainstorm (bullet points, raw thoughts).
      *   *Implicit Theory:* Distinguish between Access and Phenomenality clearly.
      *   *Consistency Check:* Highlight the tension between the "homology" argument for infants and the "behavior" argument for adults.
      *   *Revisions:* Analyze the metaphysical commitments of the Broadcast Rule vs. the Ethical commitments of the Unknown-Default.
      *   *Deflation:* Push back on the idea that this is *only* evidentiary. It's normative.
      *   *Epistemic Status:* Be humble. Acknowledge the "Hard Problem" lurks here.

  8.  **Refining Specific Arguments:**
      *   *Locked-in vs. UWS:* The distinction isn't just consciousness; it's *agency*. Locked-in patients have agency without mobility. UWS patients (traditionally) lack agency. CMD blurs this.
      *   *Infants/Animals:* We infer consciousness from *structure* + *behavior*. In UWS, structure is damaged. In CMD, structure is intact enough for command, so the inference should shift.
      *   *Broadcast Rule:* If GWT is true, broadcast is necessary for *reportable* consciousness. But is it necessary for *suffering*? Some theories say no (e.g., thalamic pain). This is a crucial vulnerability.
      *   *Unknown Default:* This is essentially the "Precautionary Principle." It shifts the burden of proof.

  9.  **Final Review against Constraints:**
      *   Did I brainstorm first? Yes.
      *   Did I address the specific questions? Yes.
      *   Did I flag epistemic status? Yes.
      *   Is the tone right? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't get too bogged down in the neuroscience details (GWT vs IIT) and keep the focus on the *ethical/practical* implications as requested. The prompt asks about the *theory presupposed by practice*, not just the neuroscience. I also need to ensure I address the "2024 multicentre study" mention as part of the context provided, treating it as the prompt's given reality even if real-world consensus varies.

  *(Refining the "Deflation" point)*: The colleague says it's compatible with *any* theory. I need to show it's *not*. If you hold a theory where phenomenality is independent of access (e.g., certain readings of IIT or Block's phenomenality), the current practice of withholding analgesia based on lack of access is theoretically unsound, not just evidentiary risky.

  *(Refining Epistemic Status)*: Be careful not to present GWT as fact. It's a leading theory, but contested. CMD prevalence is also debated.

  Okay, ready to write.
answer: |-
  ### Part 1: Brainstorming the "Jobs" of Consciousness

  Before we tighten the screws, let's let the concept breathe. In the room where you sit, "consciousness" is not doing just one job. It is a Swiss Army knife, and different people are reaching for different blades.

  *   **The Moral Marker:** It's the boundary of the moral community. If *this* is on, you have rights; if *this* is off, you are a biological organism being kept alive.
  *   **The Liability Shield:** If we treat them as conscious and they aren't, we waste morphine. If we treat them as unconscious and they are, we are torturers. "Consciousness" is the variable in the risk calculation.
  *   **The Narrative Anchor:** For the family, "conscious" means "personhood persists." "Unconscious" means "grieving can begin." It regulates the social timeline of death.
  *   **The Diagnostic Proxy:** It stands in for "intact thalamocortical loops." It's a shorthand for neurological integrity.
  *   **The Economic Triage:** ICU beds are scarce. "Conscious" implies potential for rehabilitation; "Unconscious" implies long-term custodial care. The word allocates resources.
  *   **The Metaphysical Claim:** It asserts the presence of *qualia*. Is there "something it is like" to be this patient?
  *   **The Epistemic Limit:** It marks the edge of what we can know. "We don't know if they are conscious" is often functionally identical to "They are not conscious" in terms of action, but logically distinct.
  *   **The Retrospective Validator:** When fMRI finds command-following, "consciousness" becomes a property we discover was hidden, not a property that changed. It turns the past into a mystery rather than a void.
  *   **The Legal Trigger:** It determines the validity of advance directives. Can they feel pain? Can they understand?
  *   **The Clinical Habit:** It's a bucket for "responds to command." It's operational, not ontological.

  *Okay, the brainstorm reveals the core tension:* The practice treats consciousness as an **ontological fact** (either they suffer or they don't) but measures it as an **epistemic status** (can they show us?). The friction arises when the measurement fails but the fact remains (CMD), or when the measurement succeeds but the fact is debated (anesthesia).

  ---

  ### Part 2: Reconstructing the Implicit Theory of Current Practice

  You asked for the implicit theory presupposed by the existing protocol. Here is the reconstruction.

  **The Implicit Theory: "Access-Dependent Phenomenality"**
  The current practice operates on a hybrid theory that conflates *Access Consciousness* (availability for report/action) with *Phenomenal Consciousness* (subjective experience/suffering). It assumes a tight coupling: *If you cannot access the system to report or act, you are not experiencing.*

  **1. What the Practice Strictly Requires:**
  *   **Correlation:** It requires a high-probability correlation between behavioral responsiveness and the capacity for suffering. It does not strictly require identity, but it requires that the false-negative rate (unconscious behavior, conscious experience) be low enough to justify the risk of withholding analgesia.
  *   **Agency as Proxy:** It requires that *willful* interaction be the gold standard for personhood. Reflexive withdrawal from pain is not enough; there must be evidence of a "self" orchestrating the response.

  **2. What Fits Comfortably (but is not required):**
  *   **Global Workspace Theory (GWT):** GWT fits neatly here. If consciousness *is* global broadcast for report, then no report means no consciousness. The practice fits GWT like a glove, but it doesn't *need* GWT to be true; it just needs GWT to be a reliable predictor.
  *   **Cortical Integrity:** The assumption that a damaged cortex implies no experience fits comfortably, though the practice allows for brainstem reflexes (which are subcortical) without attributing consciousness.

  **3. Where It Is Underdetermined:**
  *   **The Hard Problem:** The practice is agnostic on *why* neural activity produces experience. It only cares *that* it does.
  *   **Fragmented Consciousness:** The theory doesn't specify if consciousness is all-or-nothing. A patient might feel pain (phenomenal) without understanding context (access). The current protocol treats this binary (conscious/unconscious), leaving the middle ground underdetermined.

  ---

  ### Part 3: Consistency Check (Locked-in, Infants, and CMD)

  You asked if the strands are mutually consistent. This is where the committee's logic frays.

  **1. Locked-in vs. Unresponsive (The Access/Phenomenal Distinction)**
  *   *The Distinction:* The committee distinguishes the Locked-in Syndrome (LIS) patient from the Unresponsive Wakefulness Syndrome (UWS) patient based on **preserved pathways**, not just current output. In LIS, the cortex is intact; the output cable is cut. In UWS, the cortex (or its connection to the thalamus) is assumed damaged.
  *   *The Collapse:* Can we state this without collapsing Access and Phenomenality? **Yes, but precariously.** We can say: "LIS patients have Phenomenal Consciousness *and* Access Consciousness (via eye movement), whereas UWS patients lack Access, and we *infer* they lack Phenomenality due to cortical damage."
  *   *The Problem:* Cognitive Motor Dissociation (CMD) destroys this inference. If a UWS patient has CMD, they have Access (proven by fMRI command following) but no behavioral output. The committee already admits this by reclassifying them retroactively.
  *   *Verdict:* The distinction holds only if "behavioral unresponsiveness" is treated as *evidence* of cortical disconnection, not *proof*. Once CMD is acknowledged, the distinction between LIS and UWS becomes a matter of degree (bandwidth of output), not kind.

  **2. Infants, Animals, and the Adult Cortex**
  *   *The Reasoning:* We give analgesia to infants/animals based on **neural homology** (they have nociceptors and similar pain matrices) + **behavioral proxies** (crying, withdrawal).
  *   *The Generalization:* If this reasoning is sound, it *must* generalize to the adult UWS patient with a preserved cortex (the CMD patient). If we trust neural structure over report in infants (who cannot report), we should trust neural structure over behavior in CMD adults.
  *   *The Inconsistency:* The current practice is inconsistent here. It demands *behavioral proof* of access for adults (command following) but accepts *structural proof* of phenomenality for infants (nociceptive pathways).
  *   *Resolution:* To be consistent, the committee must either: (a) Demand fMRI/EEG for infants (absurd), or (b) Accept that preserved nociceptive cortex in adults warrants analgesia even without command following. The current protocol chooses (a) for adults and (b) for infants, which is species/developmental bias, not philosophical consistency.

  ---

  ### Part 4: Analyzing the Proposed Revisions

  **1. The Broadcast Rule (GWT-Based)**
  *   *The Proposal:* Conscious = Sustained frontoparietal recurrent activity. Unconscious = Early sensory evoked responses only.
  *   *Commitment:* This commits the committee to **Access Consciousness as sufficient and necessary for Moral Status.** It asserts that if information is not globally available, it cannot be suffered *in a way that matters*.
  *   *Is it Relabeling?* It is relabeling *unless* the neural signature detects consciousness in the absence of *potential* report. If the broadcast is present but the motor output is dead (CMD), and you classify them as conscious, you are going beyond behavior.
  *   *The Risk:* This rule relies on GWT being true. If **Integrated Information Theory (IIT)** is correct, consciousness could reside in posterior "hot zones" without frontoparietal broadcast. Under IIT, the Broadcast Rule would falsely classify some conscious patients as unconscious (false negatives).
  *   *Epistemic Status:* *Contested.* We do not know if frontoparietal broadcast is the *substrate* of consciousness or merely the *correlate of report*.

  **2. The Unknown-Default Rule (Precautionary)**
  *   *The Proposal:* Unresponsiveness = Unknown. Treat as conscious for analgesia.
  *   *Commitment:* This is **not a claim about consciousness.** It is a claim about **risk tolerance.** It admits epistemic defeat ("We cannot know") and substitutes an ethical heuristic ("Do no harm").
  *   *The Asymmetry:* It recognizes the asymmetry of error. Error Type 1 (Treat conscious as unconscious) = Torture. Error Type 2 (Treat unconscious as conscious) = Overtreatment (minor harm).
  *   *Implication:* This dissolves the need for a theory of consciousness. It works even if we are hard skeptics. It turns the protocol from a diagnostic tool into an insurance policy.

  ---

  ### Part 5: The Deflationary Claim (Your Colleague's View)

  Your colleague argues: *"We are simply using responsiveness as the best available fallible test, and the practice is thus compatible with any theory."*

  **How much is right?**
  *   **Operationally:** They are right. Clinically, you must act on *evidence*, not metaphysics. Responsiveness is the cheapest, fastest evidence.
  *   **Ethically:** They are wrong. A "fallible test" requires a confidence interval. If the test is 75% accurate (as the CMD study suggests), withholding analgesia based on a negative test is a gamble with 25% odds of causing severe suffering.
  *   **The Outrun:** The practice outruns the evidence when it moves from "We have no evidence of consciousness" to "There is no consciousness." The former is evidentiary; the latter is ontological. The colleague tries to hide the ontological claim inside the evidentiary one.
  *   **Verdict:** The deflation works for *diagnosis* but fails for *prognosis and ethics*. You cannot justify withdrawing life support on a "fallible test" without acknowledging the moral weight of the error rate. The practice *pretends* the test is more definitive than it is to comfort families and staff.

  ---

  ### Part 6: Epistemic Status and Disclosures

  As a philosopher working in this space, I must separate the settled form the speculative.

  **1. Reasonably Settled (Consensus)**
  *   **Behavior is Fallible:** It is consensus that behavioral assessment (like the Coma Recovery Scale-Revised) misses a subset of conscious patients (CMD).
  *   **Neural Signatures Exist:** There are reliable EEG/fMRI signatures (like P300 or active task modulation) that correlate with command following better than behavior.
  *   **Ethical Precaution:** There is broad agreement that in cases of uncertainty, the presumption should favor analgesia (the Unknown-Default logic).

  **2. Genuinely Contested (My Speculation/Interpretation)**
  *   **GWT vs. IIT:** I am relying on the premise that the "Broadcast Rule" assumes GWT. This is contested. Some argue frontoparietal activity is for *report*, not *experience*. If you hold that view, the Broadcast Rule is scientifically flawed.
  *   **CMD Prevalence:** The prompt cites a "2024 multicentre study" at 25%. In the actual literature (as of my current knowledge), estimates vary wildly (15% to 30% of behaviorally unresponsive patients). I am treating your 25% figure as the working premise, but in reality, this number is unstable depending on the etiology (traumatic vs. anoxic).
  *   **Phenomenality without Access:** I am assuming it is *possible* to suffer without global access (supporting the Unknown-Default). This is philosophically contested (Block vs. Dennett). If Dennett is right, there is no "hidden suffering." I am siding with the precautionary principle which assumes Block might be right.

  **3. Conclusions a Reasonable Neuroethicist Might Reject**
  *   **My Critique of the Colleague:** A pragmatic neuroethicist might argue that my distinction between "evidentiary" and "ontological" is academic hair-splitting. In practice, "no evidence" *must* function as "none" or the system collapses under the cost of treating everyone as conscious. They might reject my claim that the practice is inconsistent, arguing instead that resource constraints *justify* the inconsistency between infants and adults.
  *   **The Broadcast Rule Vulnerability:** I suggested the Broadcast Rule fails if IIT is true. A proponent of the rule might argue that for *clinical purposes*, only access-consciousness (reportable suffering) matters. If you can't report the pain, is it morally equivalent? This is a normative claim, not empirical, and many ethicists would disagree with my implication that unreportable suffering demands the same protection.

  ### Summary Recommendation

  The committee is trying to solve a metaphysical problem (What is consciousness?) with an administrative tool (The Protocol).
  *   **The Current Practice** assumes Access = Phenomenality. CMD proves this false.
  *   **The Broadcast Rule** assumes GWT is true. Science isn't ready to bet lives on that.
  *   **The Unknown-Default** is the only ethically robust path. It admits ignorance.

  If I were at your table, I would argue for the **Unknown-Default Rule** regarding analgesia (treat the pain, just in case), while keeping **Behavioral/Neural Access** for prognostication (predicting recovery). We can afford to be generous with morphine; we cannot afford to be generous with false hope. Decouple the *suffering* question from the *recovery* question. The former requires humility; the latter requires data.
