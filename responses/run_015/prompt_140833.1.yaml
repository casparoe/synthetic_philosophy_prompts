      *   **Format:** Continuous prose, like an email. No headings, no bullet points, no bold, no tables, no numbered lists.
      *   **Tone:** Intellectual, conversational, precise, matching the user's sophisticated vocabulary.

  2.  **Deconstruct the Norms into SLT Terms:**

      *   *Input:* Evidence $X$, Proposition $p$ (treated as a binary label $Y \in \{0, 1\}$).
      *   *Output:* Assertion (Yes/No) or perhaps a confidence score. Let's treat assertion as a binary decision rule $\delta(X) \in \{0, 1\}$.
      *   *Loss Function:* $L(Y, \hat{Y})$. Usually 0-1 loss for truth/falsehood, but could be more complex (e.g., cost of false assertion vs. cost of silence).
      *   *Risk:* Expected loss $R(\delta) = \mathbb{E}[L(Y, \delta(X))]$.
      *   *Knowledge Norm:* "Know $p$". In SLT terms, this isn't just $P(Y=1|X) > \tau$. It implies safety/reliability. Maybe a constraint on the decision rule such that False Positive Rate (FPR) is zero *in nearby possible worlds* (robustness). Or perhaps it requires the model to be calibrated *and* the probability to be 1 (which is impossible for empirical learners). Let's interpret "Knowledge" as a high threshold plus a stability condition (low variance under perturbation of $X$).
      *   *Truth Norm:* "Assert only if $p$ is true". This requires access to $Y$ at decision time. This is an oracle rule. $\delta(X) = 1 \iff Y=1$. Impossible for a learner without lookahead.
      *   *Justification/Probability Norm:* "Assert if $P(Y=1|X) > \tau$". This is a standard threshold classifier. Implementable if probabilities are estimated.
      *   *Budget/Rate Norm:* "Keep FPR $\leq \alpha$ over a sequence". This is a constraint on the *policy* over a distribution, not a pointwise constraint. It's about controlling risk or false discovery rate.

  3.  **Drafting the Translation Section:**
      *   Start by setting the stage: treating assertion as a binary classification problem where the label is truth.
      *   Truth Norm: This is the Bayes Optimal Classifier with 0-1 loss *if* you know the truth. But you don't. So it's an oracle. It has zero bias but infinite variance/implementability issues.
      *   Justification Norm: This is a threshold rule on the posterior probability. $\hat{Y} = 1$ if $\hat{P}(Y=1|X) \geq \tau$. This minimizes expected loss given asymmetric costs.
      *   Knowledge Norm: This is trickier. It's not just a higher $\tau$. It's like a confidence interval that must exclude 0, or a robustness check. It requires the decision to be stable under slight perturbations of input (safety). It looks like a constraint on the variance of the estimator, not just the mean.
      *   Budget Norm: This is a constraint on the empirical risk over a batch. It allows local violations for global compliance. It's about controlling the False Discovery Rate (FDR) rather than pointwise accuracy.

  4.  **Drafting the Residue Report (The "Hard" Part):**
      *   *Factivity:* In SLT, all empirical rules have non-zero error. Factivity requires error = 0. This maps to an oracle rule. So the Truth/Knowledge norms are unimplementable ideals, not operational policies.
      *   *Truth Norm as Oracle:* Yes, it's unimplementable. Does that disqualify it as a norm? In SLT, we compare against the Bayes Risk (oracle) as a benchmark. So it functions as a regret bound, not a policy.
