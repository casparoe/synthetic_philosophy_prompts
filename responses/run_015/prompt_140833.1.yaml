      *   **Specific Norms to Translate:**
          1.  Knowledge Norm (Assert $p$ only if you know $p$).
          2.  Truth Norm (Assert $p$ only if $p$ is true).
          3.  Justification/Probability Norm (Assert $p$ only if evidence makes $p$ probable enough/justified).
          4.  "False-Assertion Budget" (Rate-based norm: keep proportion of false assertions under a ceiling).
      *   **Specific Questions/Residue Report:**
