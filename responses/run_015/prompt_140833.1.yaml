      *   *Responsibility/Taking Word:* SLT has "loss," which is akin to cost. But "responsibility" implies social/commitment dimensions. SLT loss is usually individual/utility-based. This is a missing feature.
      *   *Meta-question:* Risk minimization favors probabilistic norms because they are implementable. Is this a bug? It suggests epistemology might be conflating "ideal norm" with "practical guide." Or SLT misses the constitutive nature of assertion.

