answer: |-
  ### Brainstorming Phase

  Here are three plausible readings of the relations among things (*wu*), actuality (*shi*), order (*wei*), and name (*ming*) based on the provided passage, along with their implications for the debate between you and your friend.

  **1. The Ontological Correspondence Reading**
  *   **Interpretation:** *Wu* are independent entities. *Shi* arises when an entity perfectly embodies its specific essence without deviation ("without exceeding them"). *Wei* is the natural position this essence occupies in the cosmic structure. *Ming* is the label that must map precisely to this specific *Shi*.
  *   **Implication for Debate:** This supports **your position**. If *Shi* is determined by specific characteristics, then the *Shi* of "white horse" (horse + white) is ontologically distinct from the *Shi* of "horse" (horse form alone). Therefore, claiming "white horses are not horses" is a serious assertion that these two actualities occupy different positions (*wei*) and require different names. It denies the friend's claim of sophistry by grounding the distinction in reality itself, not linguistic trickery.

  **2. The Normative Prescriptive Reading**
  *   **Interpretation:** *Wu* are raw materials. *Shi* is an idealized state of function. *Wei* is a social or cosmic hierarchy that things *ought* to occupy. *Ming* are tools used to enforce this order. Rectification involves forcing things to conform to the correct names to maintain social stability.
  *   **Implication for Debate:** This is ambiguous but leans toward **your friend's suspicion**. If rectification is primarily about imposing names onto reality to create order, the distinction between "white horse" and "horse" could be seen as an artificial linguistic rule imposed for the sake of logical hygiene rather than a discovery about reality. This might validate the charge of sophistry (playing with definitions) rather than serious ontology.

  **3. The Functional Determinacy Reading**
  *   **Interpretation:** *Wu* are entities defined by their functions. *Shi* is the fulfillment of function "without wanting" (without subjective desire or arbitrary addition). *Wei* is the proper context for that function. *Ming* tracks functional determinacy. If a thing functions differently due to added characteristics, its *Shi* changes.
  *   **Implication for Debate:** This supports **your position**. The phrase "without wanting" suggests objectivity. If adding "white" changes the functional determinacy or the specific characteristics of the thing, it creates a new *Shi* and thus a new *Wei*. The thesis "white horses are not horses" becomes a claim about functional specificity. It refutes the friend's claim of equivocation by showing the distinction is based on objective fulfillment of characteristics, not ambiguous grammar.

  ***

  ### Formal Explanation

  As a specialist in the School of Names, I recognize the passage you have cited as deriving from the *Ming Shi Lun* (Discourse on Names and Actuality), which serves as the theoretical backbone for the more famous paradoxes found in the *White Horse Dialogue*. Your intuition that this passage grounds the dialogue in a serious metaphysical project is well-founded. Below is an analysis of the passage and its application to your dispute.

  #### 1. The Generation of Actuality and Order, and the Role of Wanting

  The passage outlines a specific metaphysical hierarchy: **Things (*Wu*) → Actuality (*Shi*) → Order (*Wei*)**.

  The text states: *"When things possess the characteristics of things without exceeding them, there is actuality [shi]."*
  This claims that *Shi* is not merely existence (which all *Wu* have), but a state of **determinate precision**. A thing becomes an "actuality" in the philosophical sense only when it embodies its specific characteristics exactly—no more, no less. If a thing "exceeds" its characteristics (e.g., if a horse is treated as having characteristics it does not possess, or lacks those it must), it fails to achieve *Shi*.

  Regarding order (*Wei*), the text states: *"When actuality actually fulfills its function as actuality, without wanting, there is order."*
  Here, "without wanting" (*wu yu*) is crucial. It does not mean "without desire" in an emotional sense, but rather **without arbitrary addition or subjective imposition**. Order arises spontaneously and objectively when actuality functions exactly as it is determined to function. If you impose a "want" (a subjective interpretation or an external demand) onto the actuality, you disrupt the *Wei*. Thus, *Wei* is the proper position a thing occupies when it is allowed to be exactly what it is, without distortion. Disorder arises when actuality is forced out of this natural determinacy.

  #### 2. The Slogan of Rectification

  The final slogan reads: *"To rectify is to rectify actuality, and to rectify the name [ming] corresponding to it."*

  This is not a choice between changing reality to fit names or changing names to fit reality; it is a **mutual alignment based on determinacy**.

  *   **Rectifying Actuality:** This means ensuring that the thing in the world possesses its characteristics "without exceeding them." If a thing is ambiguous or disordered (e.g., if we treat a white horse as merely a horse, ignoring the whiteness), the *actuality* itself is being mishandled. We must recognize the specific determinacy of the object.
  *   **Rectifying the Name:** Once the actuality is precisely determined, the name must be adjusted to match that precision exactly.

  Therefore, rectification is the process of ensuring that the *Ming* maps one-to-one onto the *Shi*. If the *Shi* is specific (e.g., a white horse), the *Ming* must be specific (e.g., "white horse"). To use a general name ("horse") for a specific actuality ("white horse") is to fail to rectify the name, because the name does not cover the full extent of the actuality's characteristics. Conversely, to demand a white horse be treated as a generic horse is to fail to rectify the actuality, because it ignores the specific characteristics that constitute its order (*Wei*).

  #### 3. Application to the White Horse Dialogue

  Does this passage support your claim or your friend's? It strongly supports **your claim** that the *White Horse Dialogue* is a serious doctrine of names and actualities, rather than sophistry.

  Your friend argues that "white horses are not horses" is an equivocation on the copula (identity vs. membership). However, the *Ming Shi Lun* passage shifts the focus from logical syntax to ontological status.
  *   According to the text, "White Horse" and "Horse" designate different **actualities (*Shi*)**.
  *   The *Shi* of "Horse" refers to the characteristics of form/function alone.
  *   The *Shi* of "White Horse" refers to the characteristics of form/function **plus** color.
  *   Because the characteristics differ, the text implies they "exceed" one another if conflated. The actuality of "White Horse" exceeds the actuality of "Horse."
  *   Therefore, they occupy different **Orders (*Wei*)**.

  If they occupy different *Wei*, they cannot be treated as identical in a discourse on rectification. To say "White horses are not horses" is to assert that the *Shi* designated by "White Horse" is not the same *Shi* designated by "Horse." This is not a trick of language; it is a claim that precision in naming is required to match precision in reality. If you accept the friend's view that this is mere sophistry, you must also accept that the text's demand for things to possess characteristics "without exceeding them" is irrelevant. But since the text makes this demand central to cosmic order, the distinction in the *White Horse Dialogue* must be treated as metaphysically serious.

  #### 4. Evaluation of the Bare-Substance vs. Positioned-Sortal Distinction

  Your proposed distinction is insightful and aligns remarkably well with the textual evidence provided.

  *   **The Bare-Substance Reading:** This view holds that "Horse" is the primary substance and "White" is a modifier. This implies that the *Shi* of "Horse" is the core reality, and "White Horse" is just that reality with an added attribute. This reading struggles with the text's insistence on "without exceeding them." If "Horse" is the core substance, calling a white horse a "horse" might seem sufficient. However, the text suggests that if the characteristics (whiteness) are present, ignoring them means the actuality is not being fully recognized.
  *   **The Positioned-Sortal Reading:** This view holds that "White Horse" names an irreducible sortal that occupies its own *Wei* (position/order). This is **faithful to the text**. The text explicitly links *Shi* to *Wei*. If the combination of characteristics (white + horse) creates a specific determinacy, it creates a specific *Wei*.

  **Does this help your side?**
  Yes, it significantly helps your side. The friend's charge of sophistry relies on the idea that "White Horse" is logically subordinate to "Horse" (class membership), so denying the connection is absurd. Your "Positioned-Sortal" distinction, backed by the *Ming Shi Lun* passage, argues that in the ontology of Gongsun Long, "White Horse" is not merely a subclass; it is a distinct **Actuality** with a distinct **Order**.

  The passage states: *"To rectify is to rectify actuality, and to rectify the name corresponding to it."*
  If "White Horse" has its own *Wei*, then rectifying the name requires acknowledging that *Wei*. To subsume it under "Horse" is to disorder the *Wei*. Therefore, the thesis "White horses are not horses" is a shorthand for "The actuality/order of White Horse is not the actuality/order of Horse."

  **Conclusion:**
  The passage undermines the friend's claim of sophistry by grounding the distinction in the metaphysics of *Shi* and *Wei*. Your "Positioned-Sortal" interpretation captures the text's requirement that names must match the specific determinacy of actualities. The dialogue is not exploiting ambiguity; it is enforcing a rigorous standard where distinct characteristics necessitate distinct actualities, distinct orders, and distinct names.
