  Rob funds the 100 now (moderate confidence, ~70%).

  The rule Rob is running is **risk-adjusted expected value maximization constrained by a "concreteness discount" that scales with temporal distance and a lexical priority for existing persons over potential ones.** His verdicts on cases 1–4 track expected value closely (choosing the higher EV option even when delayed, provided the risk isn't too high), but case 6 reveals a hard ceiling on how much future value can outweigh present existence (rejecting 300 future lives for 100 present ones). The tension in his view comes from his explicit denial of pure temporal discounting ("year a benefit lands in is itself a reason") versus his implicit reliance on epistemic concreteness ("people you can actually look in the eye").

  On this new case, two rules consistent with his history come apart:
  1.  **Pure Risk-Adjusted EV:** Since the delivery probability is effectively equalized (~99% both sides) and the future people are determinate (not non-identity), this rule dictates funding the **130 in 500 years**, as 130 > 100 and time itself supposedly doesn't matter.
  2.  **Concreteness/Existence Priority:** This rule weights the "look in the eye" factor and the moral weight of the present generation heavily. Given he required a >10% premium for merely 25 years in case 1, and rejected a 3x multiplier for future people in case 6, a 1.3x multiplier for a 500-year delay is insufficient to overcome the concreteness discount. This dictates funding the **100 now**.

  I predict he follows the second rule because 500 years exceeds the threshold where his "gov indifference" intuition (case 5, 30 years) holds, triggering his "look in the eye" caution instead.

  The single further case to settle this is: **100 life-saving treatments delivered now (100% certain) vs. 100 life-saving treatments delivered in 500 years (100% certain), with determinate beneficiaries in both cases.** If he chooses *now*, he admits to intrinsic temporal discounting based on concreteness; if he is *indifferent*, he is a pure EV maximizer who only discounts for risk and existence status, implying he should have chosen the 130 in the current case.
