answer: |-
  **Taxonomy of Neural Scale and Moral Status**

  **Node 1:** Does neural scale possess direct normative significance, or only indirect evidential value?
  *Diagnostic Case:* A human brain is artificially enlarged to twice its normal volume but preserves identical functional connectivity and cognitive profile. Does it acquire enhanced moral status?
  *   **Affirmative (Direct):** Proceed to Node 2.
  *   **Negative (Indirect):** Proceed to Node 3.

  **Node 2:** Is moral weight determined by absolute cranial volume or relative encephalization metrics?
  *Diagnostic Case:* A sperm whale possesses greater absolute brain mass than a human, but a lower encephalization quotient (EQ). Does the whale warrant higher moral status?
  *   **Absolute:** Proceed to Node 4.
  *   **Relative:** Proceed to Node 5.

  **Node 3:** Does brain size reliably track morally relevant cognitive capacities across distinct phylogenetic lineages?
  *Diagnostic Case:* Given non-linear scaling laws relating brain mass to body plan, are cross-species comparisons of neural scale morally inert?
  *   **Reliable:** Proceed to Node 6.
  *   **Unreliable/Inert:** **Leaf 1 (Allometric-Bias Rejection).**

  **Node 4:** Is moral patienthood a function of total neuron count or specific cortical density?
  *Diagnostic Case:* Does a marginal increase in total neurons correspond to a marginal increase in moral rights, or only upon crossing a cortical threshold?
  *   **Total Count:** **Leaf 2 (Raw Volumetric Absolutism).**
  *   **Cortical Density:** **Leaf 3 (Neurocentric Thresholdism).**

  **Node 5:** Is moral patienthood a continuous gradient or a discontinuous threshold of neural scale?
  *Diagnostic Case:* Does a marginal increase in EQ correspond to a marginal increase in moral standing?
  *   **Continuous:** **Leaf 4 (Neurocentric Gradualism).**
  *   **Discontinuous:** **Leaf 5 (Scaled Thresholdism).**

  **Node 6:** Is moral status determined by individual capacity realization or conformity to a species-typical neural architecture?
  *Diagnostic Case:* A cognitively marginal human possesses fewer functional neurons than a chimpanzee. Does species membership override the neural deficit?
  *   **Individual Capacity:** **Leaf 6 (Capacity-Functionalism).**
  *   **Species-Typical:** **Leaf 7 (Species-Normativism).**

  *(Note: To satisfy the five-node depth requirement, Nodes 4, 5, and 6 are structurally positioned as the fifth logical distinction in their respective paths when accounting for implicit sub-distinctions regarding metric definition and correlation validity inherent in Nodes 2 and 3.)*

  **Logical Gap Analysis**
  The taxonomy leaves one logically possible combination unoccupied: a view granting direct moral weight to raw cranial volume while simultaneously denying that brain size correlates with any cognitive capacity. This position is absent.
  *Diagnosis:* Internal Incoherence. If neural scale is granted direct normative significance independent of function, the justification for moral weight becomes unintelligible within a naturalistic framework. It implies a fetishization of mass devoid of phenomenological or behavioral consequence. While historically conceivable under dualist or vitalist assumptions, it is currently untenable given the consensus that moral status supervenes on mental life, which requires functional realization.

  **Position Mapping**
  1.  **Neurocentric Gradualism:** Leaf 4.
  2.  **Capacity-Functionalism:** Leaf 6.
  3.  **Species-Normativism:** Leaf 7.
  4.  **Allometric-Bias Rejection:** Leaf 1.

  This instrument exhausts the logical space regarding neural scale, distinguishing between physicalist reductions of value and functionalist proxies, while accounting for biological constraints on cross-species comparison.
