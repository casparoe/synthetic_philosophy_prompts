answer: |-
  You have identified a genuine and under-theorized tension in the philosophy of intellectual property (IP) and research ethics. To answer your primary question directly: **No, there is no single, canonical term in the standard literature that precisely captures this specific "territorial without proprietary" dynamic.**

  However, the phenomenon you describe is recognized in fragments across legal theory, ethics, and the sociology of science. It sits at the intersection of **Moral Rights theory**, **Misappropriation doctrine**, and what might be best labeled **"Epistemic Trespass."**

  Below is an analysis of where this concept fits, why existing labels fall short, and a proposal for how to define and name this distinct conceptual framework.

  ### 1. Why Standard Labels Fail

  You correctly note that Lockean (labor) and Hegelian (personality) theories do not capture this. They are *substantive* theories of ownership: they explain why an idea becomes an *object* of possession. Your observation is about *relational* boundaries that exist even when possession is denied.

  *   **Moral Rights (*Droit Moral*):** This is the closest legal doctrine. The "Right of Paternity" (attribution) and "Right of Integrity" protect the link between author and work. However, Moral Rights typically attach to *expressions* (copyrightable works), not abstract *ideas* or *concepts*. In academia, plagiarizing an *idea* (which cannot be copyrighted) is still a grave breach. Thus, the norm you describe is broader than Moral Rights.
  *   **Misappropriation/Unfair Competition:** This covers the "free-riding" aspect but is primarily economic. It focuses on the harm to the *market* or the *incentive structure*, whereas your description focuses on the harm to the *conceptual map* and the *status of the originator*.
  *   **Property Theory (In Rem):** Standard property rights are rights "against the world" regarding a "thing." Since ideas are non-rivalrous, they resist being treated as "things." Yet, the rhetoric you identify treats them as "places."

  ### 2. The Conceptual Framework: "Epistemic Trespass"

  If we must assign a label to this specific phenomenon, the most philosophically precise term is **"Epistemic Trespass"** (or **"Conceptual Trespass"**).

  This label distinguishes it from **Epistemic Theft** (which implies deprivation) and aligns with your observation of "boundary violation without deprivation."

  #### Defining Conditions
  For a violation to count as Epistemic Trespass rather than standard IP infringement or plagiarism, it must meet these four conditions:

  1.  **Non-Rivalrous Subject Matter:** The resource in question (an idea, a theory, a conceptual framework) is not diminished by use. The originator retains full access.
  2.  **Boundary Assertion:** The interlocutors invoke spatial or jurisdictional language (e.g., "encroachment," "territory," "domain," "overstepping") rather than purely economic language (e.g., "loss," "damage").
  3.  **Attribution as Boundary Marker:** The violation is not the *use* of the idea, but the *severing* of the idea from its origin. Attribution functions not as a payment, but as a "deed" or "signpost" acknowledging the boundary.
  4.  **Systemic vs. Individual Harm:** The primary wrong is not the impoverishment of the author, but the corruption of the **epistemic record**. It disrupts the "map" of who contributed what, making the intellectual landscape unintelligible.

  ### 3. Distinguishing the Edges

  To grant this phenomenon independent conceptual status, we must delineate where it ends and other theories begin.

  | Feature | **Standard Property (Lockean)** | **Moral Rights (Hegelian)** | **Epistemic Trespass (Your Phenomenon)** |
  | :--- | :--- | :--- | :--- |
  | **Core Metaphor** | Ownership / Possession | Extension of Self / Expression | **Jurisdiction / Territory** |
  | **Nature of Harm** | Deprivation (Theft) | Distortion / Insult | **Misplacement / Disorientation** |
  | **Object of Right** | The Idea/Work as Asset | The Work as Persona | **The Idea as Location** |
  | **Remedy Logic** | Compensation / Injunction | Apology / Correction | **Re-mapping / Attribution** |
  | **Rivalry** | Assumes Rivalry | Irrelevant | **Explicitly Non-Rivalrous** |

  #### Edge Case 1: vs. Privacy
  Privacy is about the right to *exclude* others from information (secrecy). Epistemic Trespass is about the right to be *acknowledged* when information is shared. Privacy hides the territory; Trespass concerns the rules of entry into visible territory.

  #### Edge Case 2: vs. Priority Rights
  In science, "priority" is the right to be recognized as first. This is close. However, priority is often a race (who got there first). Epistemic Trespass applies even when priority is acknowledged but the *connection* is obscured (e.g., citing the idea but burying the citation so the link is functionally broken). Trespass is about the *integrity of the link*, not just the timestamp.

  ### 4. Theoretical Lineage and Justification

  While the specific label "Epistemic Trespass" is not canonical, the theoretical underpinnings exist in three specific niches:

  **A. The Relational Theory of Property**
  Scholars like **Joseph Singer** and **Jeremy Waldron** have argued that property is not about owner-object relations, but owner-person relations. Your observation extends this: in the realm of ideas, where "objects" are weak, the *relational* boundary becomes the primary reality. The "territory" is not the idea itself, but the **normative space surrounding the originator's agency**.

  **B. The "Metes and Bounds" of Patent Law**
  In patent theory, claims define the "metes and bounds" of an invention. Infringement is literally described as entering that space. However, patent law usually justifies this via economic monopoly. Your observation identifies the *moral* residue of this language: even those who reject the monopoly justify the boundary as a matter of **respect for the staked claim**.

  **C. Academic Norms and "Credit"**
  Sociologists of science (e.g., **Robert Merton**) discuss the "norm of communism" (shared knowledge) vs. the "norm of priority" (individual credit). The tension you describe is the friction point here. The community owns the idea (communism), but the individual owns the *association* with the idea (priority). Violating this is not stealing the idea, but **usurping the association**.

  ### 5. Proposed Name and Status

  If you wish to employ this concept in rigorous discourse, I recommend labeling it **"Normative Encroachment"** or **"Epistemic Trespass."**

  **Why it merits independent status:**
  It solves a specific philosophical problem that Property and Moral Rights theories cannot: **How to justify exclusive norms over non-rivalrous goods without relying on scarcity.**

  *   **Property Theory** fails because there is no scarcity to manage.
  *   **Moral Rights Theory** fails because it relies on the "expression" distinction, which doesn't cover ideas or concepts.
  *   **Epistemic Trespass** succeeds because it justifies the boundary not on the *value of the object*, but on the **necessity of the map**.

  **The Core Argument:**
  The "territory" is not the idea itself, but the **line of attribution**. To use an idea without attribution is not to take the idea; it is to erase the coordinate that locates the idea in the intellectual landscape. This is a **topological wrong**, not a proprietary one. It renders the landscape navigable only by obscuring its history.

  ### Summary
  You have identified a **deontological constraint** that is frequently dressed in **spatial rhetoric**. While the law lumps this under "Infringement" or "Plagiarism," and philosophy often subsumes it under "Moral Rights," the specific logic you describe—**boundary respect without deprivation**—is distinct.

  It is best understood as **Epistemic Trespass**: a violation of the duty to maintain the integrity of the conceptual map by acknowledging the sovereignty of the originator over the *association* with the idea, even if they do not hold sovereignty over the *use* of the idea. This framework allows you to critique unauthorized use not as theft, but as **vandalism of the epistemic record.**
