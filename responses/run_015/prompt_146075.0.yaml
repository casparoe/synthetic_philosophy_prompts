answer: |-
  **MEMORANDUM**

  **TO:** Methodology Board, Interdisciplinary Consciousness-Research Unit
  **FROM:** [Your Name/Title]
  **DATE:** 24 May 2024
  **SUBJECT:** Decision Procedure for Proposals Claiming Direct Measurement of Qualia

  ### 1. Preamble and Philosophical Grounding

  This document establishes the **Qualia Coherence and Operationalisation Protocol (QCOP)**. It is to be used by reviewers assessing grant applications or pre-registration protocols that claim to isolate, measure, or manipulate specific qualia (e.g., 'pure redness', 'intrinsic painfulness').

  The QCOP is grounded in the argument advanced by Chase and Sanborn regarding the incoherence of qualia as scientific posits. Their thesis posits that any attempt to fix upon a qualitative property through introspection inevitably collapses that property into a functional, relational, or cognitive-access feature. Consequently, there is no 'phenomenal residue' left over once functional descriptions are accounted for. Proposals that fail to acknowledge this collapse risk category errors, conflating neural or behavioural correlates with the phenomenal properties themselves.

  This procedure is designed for completion by a reviewer without specialist philosophical training in approximately twenty minutes. It is not a test of scientific rigour per se, but of conceptual coherence.

  ### 2. The Qualia Coherence and Operationalisation Protocol (QCOP)

  **Instructions:** Proceed through stages sequentially. If a **STOP** criterion is met, the proposal must be returned for revision or rejected. If Stage 4 is reached, the decision moves to Board judgement.

  #### Stage 1: Operational Definition Independence
  **Question:** Does the proposal define the target qualitative property (e.g., 'redness', 'pain') independently of the subject's ability to discriminate, report, or attend to it?
  **Criterion for Sufficiency:** The definition must not rely on terms such as 'discriminable', 'reportable', 'attention-grabbing', or 'memory-encoding'. It must describe the *intrinsic* nature of the experience.
  **Stop-Point:** If the definition relies entirely on functional roles (e.g., "the state caused by 650nm light that leads to a button press"), the proposal is treating qualia as functional states.
  *   **Action:** Flag as **Conceptual Conflation**. Require the applicant to clarify if they are studying the functional role or the phenomenal property. If they admit the latter is inaccessible without the former, proceed to Stage 2. If they insist the definition is purely phenomenal yet operationalised functionally, **REJECT**.

  #### Stage 2: The Introspective Collapse Test
  **Question:** Does the methodology assume that introspective reporting provides unmediated access to the qualitative property, or does it account for the possibility that introspection alters the property into a cognitive representation?
  **Criterion for Sufficiency:** The protocol must acknowledge that the act of reporting (introspection) may transform the phenomenal state into a functional/cognitive state.
  **Stop-Point:** If the proposal treats subjective reports as direct, unfiltered evidence of non-functional properties (ignoring the mediation of cognitive access), it violates the Chase-Sanborn constraint.
  *   **Action:** **REJECT**. The proposal assumes introspection can bypass the collapse of qualia into cognitive-access features.

  #### Stage 3: The Counterfactual Inversion Check
  **Question:** Does the proposal claim to measure a property that would persist even if all functional, relational, and cognitive-access properties were inverted or removed?
  **Criterion for Sufficiency:** The applicant must demonstrate how the target variable is distinct from its functional correlates.
  **Stop-Point:** If the applicant admits that the property cannot exist without its functional correlates (e.g., "you can't have pain without it hurting enough to be noticed"), then the 'qualia' are indistinguishable from the functions.
  *   **Action:** If the property is indistinguishable from its function, the term 'qualia' is superfluous. **REJECT** the use of the term 'qualia'; suggest reclassification as 'functional correlates of consciousness'.

  #### Stage 4: The Empirical/Conceptual Boundary (Value Judgement)
  **Context:** At this stage, it is acknowledged that no further empirical data can resolve whether a 'phenomenal residue' exists. The distinction between a functional description and a phenomenal one is conceptual, not empirical.
  **Question:** Is the research empirically fruitful enough to warrant funding despite the likelihood that its core theoretical posit (the separable qualia) is conceptually incoherent?
  **Criterion for Sufficiency:** The reviewer must weigh the potential for robust data (e.g., reliable neural correlates) against the risk of reinforcing conceptual confusion in the literature.
  *   **Action:** **REFER TO BOARD**. This stage cannot be resolved by checklist. It requires a policy decision on whether the Unit funds 'phenomenologically framed functionalism' or strictly 'conceptually coherent phenomenology'.

  ---

  ### 3. Limitations and Scope of the QCOP

  Reviewers must be apprised of the following limitations before applying the QCOP:

  1.  **Theoretical Neutrality:** The QCOP does not adjudicate between eliminativism (qualia do not exist) and deflationary functionalism (qualia are just functional roles). It merely flags the incoherence of treating them as *intrinsic, non-functional properties* measurable by standard scientific means.
  2.  **Presupposition of Introspection:** The procedure tacitly presupposes the Chase-Sanborn view that introspection is not a passive mirror but an active process that imposes functional structure on experience. It does not accommodate theories of 'pure' introspection.
  3.  **Empirical Validity:** Passing the QCOP does not guarantee the study will yield valid data; failing it does not guarantee the data will be useless. It assesses conceptual framing, not methodological rigour.

  ### 4. Potential Misfires

  No decision procedure is immune to error. Reviewers should note the following known failure modes:

  *   **False Negative (The Clinical Pain Study):** A proposal investigating chronic pain mechanisms may claim to measure 'pain qualia' to secure funding, while actually measuring functional nociceptive thresholds. The QCOP may flag this as conceptually confused and reject it, potentially hindering clinically vital research that uses 'qualia' merely as a shorthand for 'subjective intensity'.
  *   **False Positive (The Functionalist Camouflage):** A proposal may successfully rephrase all 'qualia' talk as 'functional correlates' to pass Stage 1 and 3, yet implicitly operate under a realist assumption that these correlates *are* the qualia. The QCOP may pass this as coherent, allowing conceptually loaded research to proceed under a deflationary description.

  ---

  ### 5. Application of the QCOP to Case Studies

  The following analyses demonstrate the application of the protocol to three current proposals.

  #### Case 1: fMRI Study of 'Pure Phenomenal-Red'
  **Proposal:** An fMRI study claiming to identify a neural signature for 'pure redness' that remains constant across variations in attentional load and cognitive task.
  **QCOP Analysis:**
  *   **Stage 1:** The definition relies on 'attentional load' and 'cognitive task' variations. This defines the target negatively (what it is *not* dependent on) rather than intrinsically. **Pass with caution.**
  *   **Stage 2:** The study assumes the neural signature *is* the correlate of the qualia. It does not account for the possibility that the 'constant' signature is merely a constant functional input state, not a phenomenal one. **Fail.**
  *   **Stage 3:** If attention is removed, can 'redness' be reported? If not, the functional role is necessary. The proposal claims the signature remains, but if the subject cannot access it, it is not a *phenomenal* redness.
  *   **Verdict:** **STOP at Stage 3.** The proposal conflates a stable neural input with a stable phenomenal property. Under Chase and Sanborn, the 'redness' collapses into the functional state of the visual cortex.
  *   **Board Conclusion:** **Reject funding** in the current form. The applicants must reframe the study as an investigation into *attention-invariant neural processing*, removing claims of isolating 'pure phenomenal redness'.

  #### Case 2: Behavioural Study of Chromatic Synaesthesia
  **Proposal:** A behavioural study treating subjects' reports of coloured sounds as direct evidence of non-functional qualitative properties.
  **QCOP Analysis:**
  *   **Stage 1:** The target is defined by the report ("I see red"). This is a functional/behavioural output. **Fail.**
  *   **Stage 2:** The proposal explicitly treats reports as *direct evidence* of non-functional properties. This ignores the introspective collapse; the report is a cognitive act, not a raw quale.
  *   **Verdict:** **STOP at Stage 2.** The methodology assumes introspection bypasses cognitive mediation.
  *   **Board Conclusion:** **Reject.** The researchers are likely to reject this verdict, arguing that the vividness of the report *constitutes* the evidence. However, per the QCOP, this is a category error. The study may be funded only if reframed as an investigation into *cross-modal reporting behaviours* rather than evidence of non-functional qualia.

  #### Case 3: The 'Phenomenal-Residue Audit' (Speculative Protocol)
  **Proposal:** Subjects are trained to report only those aspects of experience that survive a counterfactual inversion of all associated functional and cognitive-access properties, aiming to isolate a non-functional core.
  **QCOP Analysis:**
  *   **Stage 1:** The definition is explicitly non-functional ('survives inversion'). **Pass.**
  *   **Stage 2:** The methodology acknowledges the collapse and attempts to subtract it. **Pass.**
  *   **Stage 3:** This is the critical failure point. If all functional/access properties are inverted, can the subject *report* anything? If they report, they are using cognitive access. If they do not report, there is no data. The proposal attempts the impossible.
  *   **Stage 4:** This reaches the Value Judgement stage. Empirically, the study may reveal interesting limits of meta-cognition (i.e., subjects will invariably fail to identify a residue). Conceptually, it chases a ghost.
  *   **Verdict:** **REFER TO BOARD (Stage 4).**
  *   **Board Conclusion:** This requires a policy decision.
      *   *Option A:* **Reject** on the grounds that it mandates a conceptually impossible task, wasting resources.
      *   *Option B:* **Fund** as a 'negative result' study. The empirical value lies in demonstrating that subjects *cannot* identify such a residue, thereby empirically validating the Chase-Sanborn thesis.
      *   *Recommendation:* Fund only under **Option B** conditions. The grant must specify that the hypothesis is that *no residue will be found*. This converts a conceptually confused quest into a rigorous test of the incoherence of qualia.

  ### 6. Final Recommendation

  The Board is advised to adopt the QCOP immediately. It provides a necessary firewall against the reification of incoherent concepts while allowing for a structured debate (via Stage 4) on where the line between philosophy and empirical science should be drawn in our Unit.

  **Signed,**

  Methodology Board Secretariat
