prompt: |-
  Hey — I've somehow ended up running the "how we actually pick causes" session at my giving group's weekend meetup for the second year in a row, and I want to do better than last time. Context: about 25 people, mostly engineers and data scientists from the same company, we pool donations and also volunteer hours, 45 minutes with maybe 15 for argument at the end. Last year derailed in two specific ways — one guy spent twenty minutes on whether you're allowed to count flow-through effects (people earning more, paying more tax, etc.) and nobody could tell if we'd resolved it, and someone else made a spreadsheet where everybody scored causes 1–10 on importance, tractability and neglectedness and then multiplied the three numbers together as if the product meant something. I get why that's wrong but I couldn't articulate it fast enough in the room, and I definately don't want to just ban the spreadsheet.

  The things I personally keep tripping over, which I want the session to fix rather than paper over: I can never cleanly seperate "this problem is solvable at all" from "the next dollar or the next hour here does a lot", and I keep catching myself sliding between "how big is this problem" and "how much better is the best thing here than what we'd do instead" — I've started calling the second one the decision gap, which is my own made-up term, so tell me if that's a bad framing or if there's a cleaner way to hold the two apart. There's also a thing I noticed last year that nobody had a name for: a field can look neglected by total dollars while the particular slot we'd step into is actually contested, because everyone with our skillset would land in exactly the same role, and then our entry adds less than the headline numbers suggest. I don't know if that's a fourth factor, a correction to neglectedness, or just a reason to stop trusting the framework.

  So: don't explain importance/tractability/neglectedness to me, plan how I should explain it. What has to come before what, and why — what genuinely depends on what being in place first, given this audience will want to start multiplying immediately — and which one of those three ideas has to be introduced first to stop the multiplication instinct from doing damage. One concrete example to carry the whole session, with a verdict on the two I was considering (a municipal lead-pipe replacement program in a mid-size US city, versus building capacity for a state-level ballot measure campaign): say what a carrying example has to have and what it has to lack, and I'd rather it not be a disease or a vaccine, and not AI safety, because half the room works on ML and we will lose forty minutes. Then the misconceptions in the order you'd expect them from this crowd and exactly where in the sequence to head each off — including the ones I listed, plus whichever one I haven't thought of that you think is the real killer. One question at the end that tells me they got it rather than just got quiet, and one thing I should openly refuse to explain in 45 minutes and say out loud that I'm refusing.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the User and Context:**
      *   **User:** Facilitator of a "how we actually pick causes" session at a giving group meetup (2nd year).
      *   **Audience:** ~25 people, mostly engineers/data scientists from the same company.
      *   **Goal:** Improve upon last year's session (which derailed on flow-through effects and misuse of ITN scoring).
      *   **Constraints:** 45 minutes total (30 min content, 15 min argument/discussion).
      *   **User's Struggles:**
          *   Confusing "solvable at all" vs. "marginal impact of next dollar/hour".
          *   Confusing "problem size" vs. "decision gap" (counterfactual impact).
          *   "Crowding within a niche" (field looks neglected, but specific role is contested).
          *   Needs to stop the "multiply 1-10 scores" instinct without banning spreadsheets.
      *   **Requirements:**
          *   Plan the explanation sequence (what comes before what).
          *   Identify which ITN concept must come first to prevent multiplication damage.
          *   Select a carrying example (choose between lead pipes vs. ballot measure, define criteria).
          *   Address misconceptions in order (including the ones listed + one "real killer").
          *   One verification question at the end.
          *   One thing to explicitly refuse to explain.

  2.  **Deconstruct the Core Problem (The "Multiplication Instinct"):**
      *   Engineers love metrics. ITN (Importance, Tractability, Neglectedness) looks like three variables to multiply ($Impact \propto I \times T \times N$).
      *   *Why this is wrong:* ITN isn't a formula; it's a heuristic for *marginal* thinking. Specifically, Neglectedness is about *diminishing returns*, not just a static score. Tractability is about *elasticity*, not just solvability.
      *   *The Fix:* You cannot define Tractability or Neglectedness without first defining the *Margin*. If you define Importance first, people just think "Big Problem = Good". If you define Neglectedness as "Low Money", people think "Low Money = Good".
      *   *Sequence:* The concept of **Marginal Impact** (the "Decision Gap") must come *before* ITN. ITN should be framed as *components* of marginal impact, not independent axes.

  3.  **Address the User's Specific Confusions:**
      *   *Solvable vs. Marginal Impact:* This is the difference between "Can this be solved?" (Tractability-as-possibility) and "Does *my* contribution solve more?" (Tractability-as-elasticity).
      *   *Problem Size vs. Decision Gap:* "How big is the fire" vs. "How much water does my bucket add compared to the fire hose already there."
      *   *Crowding within a Niche:* This is a specific failure mode of Neglectedness. It's not a 4th factor; it's a refinement of Neglectedness (Specific Neglectedness vs. Global Neglectedness).

  4.  **Select the Carrying Example:**
      *   *Option A: Municipal Lead-Pipe Replacement.*
          *   Pros: Concrete, tangible, engineering-adjacent.
          *   Cons: Often saturated with government funding (hard to argue neglectedness), very local (hard to scale logic), might get bogged down in logistics.
      *   *Option B: State-Level Ballot Measure Campaign.*
          *   Pros: High variance, clear counterfactuals (vote margin), funding gaps are real, skill-specific (data/engineering can help targeting).
          *   Cons: Political (might be divisive), abstract impact (policy change vs. direct health).
      *   *Decision:* The Ballot Measure is better for *teaching marginal thinking*. Lead pipes are too "infrastructure-y" (either you build it or you don't). Ballot measures hinge on *margins* (50% + 1), which perfectly illustrates the "next dollar" concept. Also, avoids disease/vaccine/AI safety constraints.
      *   *Criteria for a Good Example:* Needs clear counterfactuals, visible diminishing returns, and distinct roles for money vs. labor.

  5.  **Drafting the Session Plan (Iterative Process):**

      *   *Opening:* Acknowledge the spreadsheet elephant in the room immediately.
      *   *Step 1: The Margin.* Define the "Decision Gap" (User's term is good, keep it). This must happen before ITN.
      *   *Step 2: ITN as Inputs to the Margin.*
          *   Importance = Scale of the *outcome*, not the problem.
          *   Tractability = Elasticity (how much outcome changes per input), not possibility.
          *   Neglectedness = Diminishing returns curve position, not total $ in field.
      *   *Step 3: The "Crowding" Correction.* Address the niche saturation issue here as a refinement of Neglectedness.
      *   *Step 4: Flow-through effects.* Briefly address the "tax revenue" derailment from last year.
      *   *Closing:* Verification question.
      *   *Refusal:* Explicitly state what won't be covered (likely "absolute moral value" or "long-term flow-through").

  6.  **Refining the Misconceptions & Sequence:**
      *   *Misconception 1: ITN is a formula.* (Head off by introducing Margin first).
      *   *Misconception 2: Tractability = Solvability.* (Head off during Tractability section).
      *   *Misconception 3: Neglectedness = Total Funding.* (Head off during Neglectedness section, introduce "Crowding").
      *   *The "Real Killer" Misconception:* **The Counterfactual Vacuum.** People assume if they don't do it, nothing happens. They forget others might step in. (This needs to be woven into the "Decision Gap").

  7.  **Finalizing the Content (incorporating User's constraints):**
      *   *Time:* 30 mins talk, 15 mins discussion.
      *   *Tone:* Respectful of engineering mindset (use their language: margins, elasticity, saturation) but correcting the model.
      *   *User's Term:* "Decision Gap" is actually quite good. It sounds like "Opportunity Cost" but more active. I will validate it.
      *   *Refusal:* "Flow-through effects" caused the 20-minute derailment last year. Explicitly bound this.

  8.  **Review against constraints:**
      *   Don't explain ITN basics (assume they know the words).
      *   Plan *how* to explain.
      *   Order of operations.
      *   Example choice (Ballot Measure).
      *   Misconceptions order.
      *   Verification question.
      *   Refusal statement.

  9.  **Self-Correction/Polish:**
      *   *Wait, one thing:* The user asked "which one of those three ideas has to be introduced first to stop the multiplication instinct."
      *   *Answer:* It's not one of the three. It's **Marginal Impact** (the Decision Gap). If you start with Importance, they multiply. If you start with the Margin, ITN becomes a *diagnostic tool* for the Margin, not the formula itself.
      *   *Example:* I need to make sure the Ballot Measure example clearly shows why "Total Funding" (Neglectedness) is misleading if the specific swing state is saturated.
      *   *Flow-through:* The user mentioned the tax argument derailed last time. I need to make sure the "Refusal" covers this specifically so it doesn't happen again.

  10. **Final Output Structure:**
      *   The Core Shift (Margin first).
      *   The Carrying Example (Verdict & Criteria).
      *   The Sequence (Minute-by-minute logic).
      *   The Misconception Intercept Plan.
      *   The Closing (Question + Refusal).

  (Proceed to draft response based on these thoughts.)
answer: |-
  Here is the plan to run this session without derailing, tailored for an engineering/data science audience.

  ### 1. The Core Shift: What Comes First
  You asked which of the three (Importance, Tractability, Neglectedness) must be introduced first to stop the multiplication instinct.

  **The answer is: None of them.**

  If you introduce any of the three first, you invite the spreadsheet. To an engineer, three variables imply a function $f(I, T, N)$. You must introduce the **Output Variable** before the **Input Variables**.

  You need to introduce **Marginal Impact** (your "Decision Gap") in the first 5 minutes. Frame ITN not as the formula for impact, but as the *diagnostic parameters* for estimating the slope of the impact curve at the margin.

  *   **Why:** You cannot define "Neglectedness" correctly without first establishing that we care about *diminishing returns*, not total funding. You cannot define "Tractability" without establishing we care about *elasticity*, not solvability. Both of those require a concept of the "Margin."
  *   **The Framing:** Tell them: *"Last year we tried to score the problem. This year we are scoring the intervention. The spreadsheet failed because it measured the size of the mountain, not the leverage of our specific pickaxe."*

  ### 2. The Carrying Example
  **Verdict:** Choose the **State-Level Ballot Measure Campaign**.

  **Why this works better than Lead Pipes:**
  *   **Lead Pipes:** Too binary. Either the pipes get replaced or they don't. It invites "cost-per-pipe" thinking, which slides back into efficiency metrics rather than marginal impact. It also feels like government infrastructure, where the "who else would do this?" counterfactual is muddy.
  *   **Ballot Measure:** Perfectly illustrates *margins*. A measure passes at 50% + 1. Spending \$1M to go from 40% to 45% support is useless (wasted marginal impact). Spending \$100k to go from 49% to 51% is massive. This forces the room to think about *where* on the curve their money lands, not just *that* it lands.

  **What the example must have:**
  *   **A Threshold:** A clear "win condition" (50% vote) to demonstrate non-linear returns.
  *   **Visible Saturation:** A scenario where one state is flooded with cash (low marginal value) and another is starved (high marginal value), even if the "problem" (bad policy) is identical in both.
  *   **Skill Specificity:** A role for your specific group (e.g., data modeling for voter targeting) to address your "crowding within a niche" concern.

  **What the example must lack:**
  *   **Moral Valence:** Avoid issues where "supporting the other side" feels immoral (e.g., abortion, gun control). Pick something dry but consequential, like "Zoning Reform" or "Utility Oversight."
  *   **Long Timelines:** Keep the feedback loop under 12 months so "impact" feels calculable.

  ### 3. The Sequence (30 Minutes Content)

  **0:00–0:05: The Decision Gap (The Output)**
  *   Define the "Decision Gap": *The difference between the world if we act, and the world if we don't (but everyone else does exactly what they were already going to do).*
  *   Explicitly state: *"We are not measuring how good a cause is. We are measuring how much our specific contribution changes the probability of the outcome."*
  *   **Stop the Spreadsheet:** Show a blank spreadsheet. Say, *"If you put Importance, Tractability, and Neglectedness in columns A, B, and C, do not multiply them. They are not independent variables. They are filters for the Decision Gap."*

  **0:05–0:15: ITN as Diagnostics (The Inputs)**
  *   **Importance:** Reframe as "Scale of the *Win*," not "Scale of the *Problem*." (e.g., The problem is 1M people affected; the Win is 100k people helped *because of us*).
  *   **Tractability:** Reframe as "Elasticity." Use the Ballot Measure example. *"Is the curve steep right now? Does \$10k buy 100 votes or 0 votes?"* Distinguish this from "Is it solvable?" (Solvability is binary; Elasticity is continuous).
  *   **Neglectedness:** Reframe as "Position on the Diminishing Returns Curve."
      *   *Address your "Crowding" concern here:* Explain that a field can be globally neglected but locally saturated. *"If every data scientist in our company targets the same swing state, we are not 'filling a gap,' we are creating a traffic jam. Neglectedness must be measured at the *intervention level*, not the *cause area level*."*

  **0:15–0:25: The Counterfactual & The "Real Killer"**
  *   This is where you address the misconception you didn't list: **The Vacuum Assumption.**
  *   Engineers often assume: *If we don't fund this, the work doesn't get done.*
  *   Correction: *If we don't fund this, does a government grant kick in? Does another donor step up?*
  *   Apply to Ballot Measure: *"If we don't build the voter model, will the campaign hire a firm to do it anyway? If yes, our Decision Gap is zero, even if the model is great."*

  **0:25–0:30: Bounding the Scope (Pre-empting Derailment)**
  *   Set the rules for the Q&A. This is where you prevent the "flow-through tax" debate from eating 20 minutes.
  *   Acknowledge second-order effects exist but declare them out of bounds for *this* decision framework.

  ### 4. Misconception Intercept Plan
  Here is the order you will encounter these, and exactly how to head them off:

  1.  **"Can't we just score them 1-10?" (Minute 5)**
      *   *Intercept:* When you introduce ITN, say: *"These are not scores. They are multipliers on the margin. If Neglectedness is high but Tractability is zero, the product is zero. If Importance is high but the Counterfactual is zero, the product is zero. A spreadsheet hides the zeros."*
  2.  **"But is the problem solvable?" (Minute 10 - Tractability)**
      *   *Intercept:* *"Solvability is a prerequisite, not a metric. We only care about the slope. A problem can be 100% solvable, but if the last 10% costs 90% of the budget, our marginal tractability is low."*
  3.  **"This field has very little funding total." (Minute 15 - Neglectedness)**
      *   *Intercept:* *"Total funding is a vanity metric. We need 'Funding at the Margin.' If we all have the same skills, we are bidding on the same slot. That slot might be crowded even if the field is empty."*
  4.  **"What about the tax revenue from people we help?" (Minute 25 - Flow-through)**
      *   *Intercept:* (See Refusal below).

  **The "Real Killer" Misconception:**
  **Substitutability.** (I hinted at this in the Counterfactual section).
  The room will assume their labor is unique. You must explicitly state: *"If your skillset is common in this room, it is likely common in the market. Unless you have a specific connection, assume your labor is substitutable."* This kills the "We are special" bias that inflates Tractability scores.

  ### 5. The Closing (15 Minutes Argument)

  **The Verification Question:**
  Do not ask "Does this make sense?" (They will nod).
  Ask: **"If we found a cause that was High Importance, High Tractability, and High Neglectedness, what is the one condition that would still make it a bad donation for *us* specifically?"**
  *   *Correct Answer:* "If someone else was already going to do it" (Counterfactual/Substitutability) OR "If our specific skills don't match the bottleneck" (Crowding).
  *   *Why:* This proves they understand that ITN is necessary but not sufficient without the Decision Gap.

  **The Refusal:**
  You must explicitly refuse to solve **Long-Term Flow-Through Effects** (the "tax revenue/children's children" argument from last year).

  **Say this verbatim:**
  *"I am going to refuse to solve for second-order flow-through effects in this session. If we try to calculate how today's donation changes tax revenue in 2040, we will enter a modeling uncertainty so high that all three ITN variables become noise. We are optimizing for the *direct* Decision Gap today. If you want to debate flow-through, we can schedule a separate session, but it will not decide this year's pool."*

  **Why this works:** It validates their intellectual curiosity (you're not saying it's unimportant) but bounds the scope (you're saying it's out of bounds for *this* optimization problem). It prevents the 20-minute derailment by making it a "different meeting" problem.
