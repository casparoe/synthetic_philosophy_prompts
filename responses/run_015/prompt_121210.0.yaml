answer: |-
  **The dispute is not over whether cognitive significance differs, but over whether that difference resides in the semantic content of the names or in the psychological files thinkers use to track referents.**

  ### I. Jointly Affirmed Claims

  1.  **Cognitive Significance:** The identity statement 'Hesperus is Phosphorus' differs in cognitive significance from 'Hesperus is Hesperus'. A rational agent can assent to the latter while withholding assent from the former without logical incompetence.
  2.  **Substitution Failure:** In belief reports (e.g., "Iris believes that Hesperus is bright"), substituting co-referential names can change the truth value of the report, even if the names refer to the same object.
  3.  **Generalization:** This phenomenon is not unique to astronomical names. It extends to natural kind terms ('water is H2O'), indexicals ('I am Iris'), and fictional identifiers ('Mary is Marianne').
  4.  **The Rename Case:** In the specific case of the novel drafts, the statement 'Mary is Marianne' is informative to a reader of Draft Four alone, but trivial to a reader of both Draft Two and Four. Both sides agree this variance tracks the reader's epistemic state, regardless of whether that state is semantic or pragmatic.
  5.  **The Two-Dossier Case:** A single agent (Iris) can hold two files on one individual, sincerely asserting "He embezzled the money" while looking at File A and "He did not embezzle the money" while looking at File B, without thereby committing a logical contradiction in the eyes of a charitable interpreter.
  6.  **Truth-Conditions:** Both sides agree that the *truth conditions* of the bare identity 'Hesperus is Phosphorus' are determined solely by the referent. The disagreement concerns whether truth conditions exhaust semantic content.

  ### II. Residual Disagreements

  | Topic | The Millian Position (Ex) | The Neo-Fregean Position (Iris) |
  | :--- | :--- | :--- |
  | **Location of Information** | The informativeness of 'Hesperus is Phosphorus' is purely pragmatic. The semantic content is the singular proposition <Venus, Venus, Identity>. Any cognitive difference lies in the *guise* under which the proposition is grasped, not the proposition itself. | The informativeness is semantic. The semantic content includes a mode of presentation. The proposition expressed by 'Hesperus is Phosphorus' is distinct from 'Hesperus is Hesperus' because the senses differ. |
  | **Belief Reports** | Belief is a three-place relation: Subject, Proposition, and Guise. Substitution fails in reports because the report implicitly specifies the guise required for assent, not because the proposition changes. | Belief is a two-place relation: Subject and Proposition. Substitution fails because the *that*-clause specifies the proposition, and changing the name changes the proposition expressed. |
  | **Semantic Value** | The semantic value of a name is strictly its bearer. To add anything else is to confuse semantics with psychology or use. | The semantic value of a name is its reference *plus* its mode of presentation. To exclude the mode is to render semantics unable to explain rational inference. |
  | **The Rename Case** | The difference in the Mary/Marianne case is entirely contextual/pragmatic. The names rigidly designate the character; the reader's ignorance is extra-semantic. | The difference in the Mary/Marianne case reveals that fictional names derive sense from textual context. The shift in drafts shifts the sense, hence the shift in informativeness. |

  ### III. The Cruxes

  **Crux 1: Semantic Value vs. Psychological Vehicle**
  *Question:* Does the cognitive difference between 'Hesperus' and 'Phosphorus' belong to the language (semantics) or the thinker's cognitive architecture (psychology)?
  *Settling Condition:* If we can show that the difference persists even when psychological files are controlled for, the Fregean wins. If the difference vanishes when the agent knows the identity, the Millian wins.

  **Crux 2: Semantic vs. Pragmatic (Embedding Test)**
  *Question:* Does the cognitive significance survive embedding in contexts where ordinary implicatures are killed off (negation, questions, conditionals, factives)?
  *Settling Condition:* If 'It is obvious that Hesperus is Phosphorus' can be false while 'It is obvious that Hesperus is Hesperus' is true, the difference is semantic (Fregean). If both are equally obvious once the reference is fixed, the difference is pragmatic (Millian).

  **Crux 3: Verbal Dispute (Sense vs. File)**
  *Question:* Have the two sides collapsed into one another? Is the Millian "guise" functionally identical to the Fregean "mode of presentation," differing only in the label "semantic" vs. "psychological"?
  *Settling Condition:* If the "guise" plays the same explanatory role in rationalizing action as the "sense," the dispute is verbal. If the "guise" is merely causal and the "sense" is normative, the dispute is substantive.

  ### IV. Concrete Cases and Predictions

  | Crux | Case / Argument | Millian Prediction | Fregean Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Value vs. Vehicle** | **The Two-Dossier Case:** Iris holds two files on the same man. She asserts *p* relative to File A and *not-p* relative to File B. Is she irrational? | **Irrational (Semantically), Rational (Psychologically).** She believes a contradiction (<a, F> and <a, not-F>), but is excused because she grasps them under distinct guises. | **Rational.** She believes two distinct propositions (<sense-a, F> and <sense-b, not-F>). There is no contradiction to be had. |
  | **2. Embedding** | **The Factive Test:** Compare "It is obvious that Hesperus is Hesperus" vs. "It is obvious that Hesperus is Phosphorus." | **Both True (given knowledge).** Once the reference is fixed, the proposition is the same. If one is obvious, the other is. Any intuition otherwise is pragmatic interference. | **True vs. False.** The proposition <Hesperus, Phosphorus> is complex and informative; the proposition <Hesperus, Hesperus> is trivial. Factive operators track this semantic difference. |
  | **3. Verbal Dispute** | **The Rename Case:** 'Mary is Marianne' across drafts. Does the name change the *object* of thought or just the *access* to it? | **Access.** The character is the same rigid designatum. The reader's access changes. The mechanism is pragmatic context, identical to the Hesperus case. | **Object of Thought.** The sense is constituted by the textual history. Draft Two Mary and Draft Four Marianne have different senses, making the identity substantive. |

  ***

  **Confidence Note:**
  I am moderately confident a real Millian (e.g., of the Salmon/Soames variety) and a real Neo-Fregean (e.g., of the Evans/McKinsey variety) would sign Sections I and II, as these map the standard dialectical landscape accurately. Section III is riskier, as both sides often claim their crux is already settled. Section IV is the most volatile.

  **Line Most Likely to be Crossed Out:**
  In **Crux 2 (The Factive Test)**, the Millian Prediction ("Both True (given knowledge)"). A hardline Millian might insist that 'It is obvious that...' is sensitive to *guises* even in Millian semantics, thereby conceding the test without conceding the theory. Alternatively, the Fregean might cross out the Millian column in **Crux 1**, refusing to accept the description "Irrational (Semantically)" as a coherent position, arguing that attributing contradictory beliefs is simply a misdescription of the data.
