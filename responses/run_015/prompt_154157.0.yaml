prompt: |-
  I serve on the Finance and Risk Committee of the Meridian Trust, a private foundation with roughly $180 million in investable assets and a mandate to exist in perpetuity. Our covenant with the founding donor sets a real annual payout of 5% and contains a stability clause: if the endowment closes a fiscal year below $150 million in real terms, grantmaking is suspended for the following three years and the payout stops. We also continue to receive unsolicited gifts, historically anywhere between $2 million and $9 million a year, which we cannot rely on and cannot forecast.

  I have been asked to draft the recommendation memo for our 12 March meeting, and the case before us is one where I think the committee is arguing past itself.

  A sponsor has offered us a one-time commitment: we may commit any amount up to $30 million to a single vehicle. If a specified regulatory approval is granted on or before 30 June 2028, each committed dollar returns $2.60 at the end of that quarter; if the approval is not granted by that date, the entire commitment is lost. There is no secondary market and no early exit. Our own analysts put the probability of approval at 0.62; an outside consultant we commissioned puts it at 0.55; the sponsor's material implies something nearer 0.70. The sponsor has run three comparable vehicles over the past four years — we declined all three — and has told us this is the last. Note the arithmetic: a total loss on the maximum commitment would take us to almost exactly the $150 million clause threshold, before any market return or payout.

  The committee has split three ways. Two members want the full $30 million: the expected value is strongly positive on every estimate we have, we are not a gambler at a table with a finite stake, and an institution with a perpetual horizon, a continuing gift stream, and no possibility of being forced to liquidate does not face the ruin that motivates geometric-mean reasoning in the first place. Two members invoke the Kelly rule and the time-average critique of expected-value maximization and want a smaller commitment computed as a fraction of our capital. A fifth has proposed "half Kelly," which so far nobody has defended as anything other than a compromise.

  What I need from the memo is a bottom line the committee can vote on, together with reasoning that the losing side could recognise as a fair statement of its own case. Specifically:

  Give a specific number to commit — including zero or the full $30 million — or, if you think the number cannot honestly be pinned down from what I've told you, give a decision rule and name the inputs the committee must fix, along with which of those numbers would most change the answer. If you do arithmetic, show the assumption behind it; I would rather see an assumption flagged than a figure that looks authoritative.

  Two things seem to me to be where the real disagreement hides, and I want both settled rather than gestured at. First: what counts as the stake? The Kelly-style calculation gives very different answers depending on whether the bankroll is the whole $180 million or only the roughly $30 million sitting above the stability clause, and I don't think our committee has noticed that this choice, not the probability estimate, is what drives the gap between the two factions. Second: this is a one-off, or at most the last of four. The usual argument for maximizing the geometric mean leans on what happens over a long sequence of similar bets, and I want to know what is left of that argument when there is no sequence — whether it collapses into mere risk aversion, or whether the fact that we go on investing for decades afterwards is enough to reconstruct it.

  Please also deal with: the disagreement between 0.62 and 0.55 in a way that is not simply splitting the difference; whether "half Kelly" is principled here or a fudge; and whether the 5% payout and the gift stream undermine or support the geometric framing — I can see an argument both ways and I don't want the memo to assume one. The stability clause deserves its own treatment: a three-year grantmaking freeze is not ruin, and whether it makes the geometric argument stronger or weaker is exactly what I can't get the committee to agree on.

  Write it as a board memo of roughly 1,000 to 1,300 words, in prose a trustee who has never heard of the Kelly criterion can follow, arguing from the facts of this case rather than from the literature — the board will not follow references. Attach a short closing section in which you state, for each substantive claim, how confident you are in it in a single line, and then single out the one point you are least sure of, saying what would change your mind about it.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Finance and Risk Committee, Meridian Trust.
      *   **Audience:** The Committee (split 2-2-1 on a specific investment) and potentially the full Board.
      *   **Context:** $180M assets, perpetual mandate, 5% real payout, stability clause (freeze if assets < $150M real). Unsolicited gifts ($2-9M/yr).
      *   **The Deal:** Commit up to $30M. Binary outcome by 30 June 2028. Success (return $2.60/$1), Failure (lose all). Probabilities: Internal 0.62, External 0.55, Sponsor 0.70.
      *   **The Conflict:**
          *   Faction A (Full $30M): Positive EV, perpetual horizon, gift stream buffers ruin.
          *   Faction B (Kelly/Time-Average): Risk of ruin is real, maximize geometric growth.
          *   Faction C (Half Kelly): Compromise without defense.
      *   **Key Issues to Address:**
          *   Specific commitment number OR decision rule with inputs.
          *   Define the "stake" (Total $180M vs. Buffer $30M).
          *   One-off bet vs. long sequence (does Kelly apply?).
          *   Probability disagreement (0.62 vs 0.55).
          *   "Half Kelly" validity.
          *   Impact of 5% payout and gift stream.
          *   Impact of Stability Clause (freeze vs. ruin).
      *   **Format:** Board Memo, 1,000-1,300 words. Plain prose (no academic references).
      *   **Addendum:** Confidence statement for each claim + one point of least certainty.

  2.  **Deconstruct the Financial Math & Logic:**
      *   *Current Assets:* $180M.
      *   *Threshold:* $150M.
      *   *Buffer:* $30M.
      *   *Investment:* Up to $30M.
      *   *Risk:* If we invest $30M and lose, we drop to $150M. This triggers the stability clause.
      *   *Faction A (EV Max):* $30M * 0.62 * 2.6 = $48.36M return. Cost $30M. Net EV = +$18.36M. Even at 0.55: $30M * 0.55 * 2.6 = $42.9M. Net EV = +$12.9M. Positive EV is clear.
      *   *Faction B (Kelly/Growth):* Kelly Criterion formula for binary bet: $f^* = (bp - q) / b$. Here $b = 1.6$ (profit per unit risked, since return is 2.60 total, profit is 1.60). $p = 0.62$ (internal), $q = 0.38$.
          *   $f^* = (1.6 * 0.62 - 0.38) / 1.6 = (0.992 - 0.38) / 1.6 = 0.612 / 1.6 \approx 38\%$.
          *   If bankroll is $180M, 38% is $68M (capped at $30M offer).
          *   If bankroll is *effective* $30M (buffer), 38% is $11.4M.
      *   *The "Stake" Question:* This is the crux. If we lose $30M, we hit the floor. The "ruin" isn't bankruptcy, it's a 3-year grantmaking freeze. Does that count as ruin for a perpetual foundation? Yes, it violates the mandate's operational continuity. Therefore, the *effective* bankroll for risk-taking is the surplus above the threshold, not the total AUM.
      *   *One-off vs. Sequence:* Kelly is about long-term growth rate. However, even for a one-off bet, if the consequence of loss impairs future capacity to invest (which the freeze does), the geometric logic holds. We aren't just betting this $30M; we are betting the foundation's ability to function normally for the next 3+ years.
      *   *Probability:* 0.55 is the conservative external view. 0.62 is internal. Using 0.55 is prudent for risk management. At 0.55, EV is still positive, but Kelly fraction drops.
          *   Kelly at 0.55: $f^* = (1.6 * 0.55 - 0.45) / 1.6 = (0.88 - 0.45) / 1.6 = 0.43 / 1.6 \approx 27\%$.
      *   *Half Kelly:* Often used to reduce volatility. In a one-off scenario with a hard cliff (the $150M threshold), volatility *is* the risk. Half Kelly might be too conservative or just arbitrary.
      *   *Payout/Gifts:* 5% payout drains capital. Gifts add to it. Net effect is uncertain but gifts are unreliable. We should treat the $180M as the starting point, not counting on gifts to bail us out if we hit $150M.
      *   *Recommendation:* The buffer is exactly $30M. The offer is exactly $30M. Investing the full buffer risks the mandate. Investing nothing ignores positive EV. The "Stake" is the buffer.
      *   *Calculation:* If the effective bankroll is the $30M surplus, and we apply a fractional Kelly approach to account for the "one-off" nature and parameter uncertainty (0.55 vs 0.62), we need a number.
      *   *Wait, let's look closer at the "Ruin".* If we lose $30M, we are at $150M. Grants stop for 3 years. Payout stops. We survive, but we fail the mission for 3 years. This is "soft ruin."
      *   *Decision:* The committee is arguing past each other because one side sees $180M and the other sees $30M. The memo must resolve this. The $150M clause makes the first $30M of loss qualitatively different from the next $150M. Therefore, risk capital is $30M.
      *   *Commitment Amount:* If risk capital is $30M, Kelly (at p=0.55) suggests 27% of risk capital $\approx$ $8M. Kelly (at p=0.62) suggests 38% of risk capital $\approx$ $11.5M.
      *   *Refining the Recommendation:* A specific number is requested. $10 million splits the difference between the probability scenarios applied to the *buffer* bankroll. It respects the EV argument (we participate) and the Risk argument (we don't bet the farm/mandate).
      *   *Wait, check the prompt requirements again:* "Give a specific number... or... a decision rule." "Two things seem to me to be where the real disagreement hides... First: what counts as the stake?"
      *   *Strategy:* I need to explicitly define the stake as the $30M buffer. I need to argue that the Stability Clause creates a "hard floor" that functions as ruin for the purpose of this decision. I need to address the one-off nature (it matters because we can't average out the risk).
      *   *Word Count:* 1,000 - 1,300 words.
      *   *Tone:* Professional, decisive, fair to both sides.

  3.  **Drafting - Section by Section:**
      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose and the recommendation immediately.
      *   **The Core Disagreement (The Stake):** Address the $180M vs $30M debate. Explain why the $150M clause makes the $30M surplus the true risk capital.
      *   **The Probability:** Address 0.55 vs 0.62. Don't split the difference blindly; use the conservative number for risk sizing, optimistic for EV check.
      *   **One-Off vs. Perpetual:** Address the Kelly critique. Even if one-off, the *consequence* lasts perpetually (3 year freeze). Geometric growth matters because we compound after this bet.
      *   **Payout/Gifts:** 5% payout erodes the buffer faster if we lose. Gifts are too uncertain to count as protection.
      *   **Recommendation:** $10 Million. Why? It's roughly 1/3 of the buffer (aligning with Kelly on the *buffer*), leaves room for error, captures EV.
      *   **Confidence Addendum:** As requested.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is $10M too low? If EV is positive, why not more?
      *   *Counter:* Because if we lose $30M, we trigger the clause. The marginal utility of dollars drops precipitously at $150M. We must protect the mandate.
      *   *Critique:* Is Kelly appropriate for a one-off?
      *   *Counter:* Not strictly, but "fractional Kelly" is a proxy for risk aversion regarding the *consequence* of the one-off. The consequence is multi-year impairment.
      *   *Word Count Check:* Need to ensure I don't get too bogged down in math formulas. Keep it prose-based.
      *   *Addressing "Half Kelly":* Explicitly state it's a fudge here unless tied to the specific constraint of the Stability Clause.
      *   *Addressing the "Perpetual" argument:* The Foundation is perpetual, but the *grantmaking* is not if we hit the floor.

  5.  **Final Polish:**
      *   Check tone: Respectful but firm.
      *   Check constraints: 1000-1300 words.
      *   Check Addendum: Confidence levels.

  6.  **Writing the Memo:** (Mental outline of the text)
      *   To/From/Date/Subject.
      *   Recommendation: Commit $10 million.
      *   Reasoning 1: The Definition of Capital. The $30M buffer is the only true risk capital.
      *   Reasoning 2: The Nature of the Bet. One-off vs Sequence. The freeze is the "ruin."
      *   Reasoning 3: Probabilities. Use 0.55 for sizing.
      *   Reasoning 4: Payout/Gifts. Payout drains buffer; gifts are noise.
      *   Conclusion.
      *   Confidence Addendum.

  7.  **Word Count Management:** I need to expand on the reasoning to ensure I hit the 1,000 minimum without fluff. I will elaborate on *why* the stability clause changes the utility function. I will explain why the "Perpetual" argument of Faction A is partially correct but misapplied.

  8.  **Final Review against constraints:**
      *   Specific number? Yes ($10M).
      *   Stake defined? Yes ($30M buffer).
      *   One-off addressed? Yes.
      *   Probabilities addressed? Yes (conservative for risk).
      *   Half Kelly addressed? Yes (lacks principle here).
      *   Payout/Gifts addressed? Yes.
      *   Confidence section included? Yes.

  (Proceed to draft based on this plan.)
answer: |-
  **MEMORANDUM**

  **TO:** Finance and Risk Committee, Meridian Trust
  **FROM:** [Your Name], Committee Member
  **DATE:** 12 March
  **SUBJECT:** Recommendation on Special Commitment Vehicle

  **Recommendation**

  I recommend the Committee authorize a commitment of **$10 million** to the sponsor's vehicle. This figure represents approximately one-third of the capital surplus above our stability threshold. It captures the positive expected value of the opportunity while respecting the hard constraint imposed by our founding covenant.

  **The Definition of Capital: $180 Million vs. $30 Million**

  The primary source of our disagreement is not the probability of success, but the definition of the "bankroll." Faction A argues that because Meridian exists in perpetuity with $180 million in assets, we should size this bet against the total portfolio. Faction B argues for a fractional approach based on growth optimization. Both miss the constraint that actually binds us.

  Our stability clause creates a hard floor at $150 million. If we commit the full $30 million and lose, we hit that floor exactly. The consequence is not liquidation, but a three-year suspension of grantmaking and payout. For a foundation, operational suspension is functionally equivalent to ruin. It violates our mandate to serve the public good in perpetuity. Therefore, the capital at risk is not the total $180 million; it is the $30 million surplus above the threshold. The first $150 million is not risk capital; it is the endowment's operating infrastructure. Any sizing model that treats the full $180 million as available for wagering ignores the cliff edge located exactly $30 million away.

  **The One-Off Bet and the Geometric Argument**

  Faction A correctly notes that Kelly-style reasoning usually relies on a long sequence of bets to maximize geometric growth. This is a single bet, perhaps the last of four. Does the geometric argument collapse?

  It does not, because the consequence of the bet extends beyond the single event. If we lose, we do not simply record a loss and move on; we enter a three-year period of compounding without new grants, likely accompanied by reputational damage that could dampen future unsolicited gifts. We are not betting on a single quarter in 2028; we are betting on the foundation's trajectory for the decade following. The "sequence" is not the series of identical bets (which we do not have), but the sequence of annual investment and payout decisions that follow this outcome. A loss here impairs our ability to participate in future opportunities. Therefore, maximizing the long-term growth rate of the *surplus* capital remains the correct objective, even for a one-off instrument.

  **Probability and Sizing**

  We have three probability estimates: 0.70 (sponsor), 0.62 (internal), and 0.55 (external). Splitting the difference to 0.625 is mathematically convenient but procedurally weak. The sponsor has an incentive to overstate probability; our internal team may suffer from confirmation bias having engaged with the deal. The external consultant has the least incentive to mislead.

  For the purpose of Expected Value (EV), the 0.62 internal estimate justifies participation. Even at 0.55, the EV is strongly positive. However, for the purpose of *sizing*, we must use the conservative 0.55 estimate. In risk management, we use optimistic assumptions to decide *whether* to act, and conservative assumptions to decide *how much*.

  Applying a Kelly fraction to the $30 million surplus using the conservative 0.55 probability and a 1.6-to-1 payout ratio suggests a theoretical optimal bet of roughly 27% of the surplus, or $8.1 million. Using the internal 0.62 probability suggests roughly 38%, or $11.4 million. The recommended $10 million sits between these two figures. It acknowledges the positive EV without exposing the mandate to the binary risk of a total loss.

  **The "Half Kelly" Compromise**

  The proposal for "Half Kelly" appears to be a compromise without a principle. In standard portfolio theory, Half Kelly is used to reduce volatility when the investor has logarithmic utility but fears parameter error. Here, our utility function is not smooth; it is kinked at $150 million. We do not care about volatility per se; we care about crossing the threshold. A rigid "Half Kelly" rule applied to the total $180 million would still suggest a bet far larger than our surplus. Applied to the surplus, it would suggest roughly $4 million, which may be too conservative given the strength of the expected value. We should not adopt a heuristic from continuous trading for a binary, structural decision.

  **Payout and Gift Stream**

  Faction A argues that our 5% real payout and the historical gift stream ($2–9 million annually) buffer us against ruin. This is dangerous reasoning. The 5% payout is a drain on the surplus, not a support. If we lose the $30 million commitment, we still face the payout obligation on the remaining $150 million, further stressing the capital base during the freeze.

  Regarding gifts: while historically positive, they are explicitly unsolicited and unforecastable. We cannot underwrite a risk decision on the hope that a donor will bail us out if we hit the stability clause. To do so would be to monetize uncertainty. The gift stream should be treated as upside optionality, not downside insurance.

  **Conclusion**

  The Committee is divided because one side sees a positive expected value opportunity and the other sees a threat to the foundation's existence. Both are right. The expected value is positive, but the cost of failure is the suspension of our mission. By defining the $30 million surplus as our true risk capital, we reconcile these views. We participate in the upside, but we limit the commitment to a level that, if lost, leaves the core endowment intact and the Committee with the optionality to recover without triggering the stability clause.

  **Commitment:** $10 million.

  ***

  **Confidence Addendum**

  *   **Claim:** The $30 million surplus, not the $180 million total, is the relevant risk capital.
      *   **Confidence:** High. The stability clause creates a discontinuous utility function at the $150 million mark.
  *   **Claim:** The geometric growth argument applies despite this being a one-off bet.
      *   **Confidence:** Medium-High. The multi-year operational freeze creates a sequence of impaired future decisions.
  *   **Claim:** The 0.55 probability should be used for sizing, while 0.62 justifies participation.
      *   **Confidence:** High. Standard prudence dictates sizing for the conservative case in binary outcomes.
  *   **Claim:** The gift stream should not be counted as downside protection.
      *   **Confidence:** High. Reliance on unsolicited capital for risk mitigation violates fiduciary prudence.
  *   **Claim:** A $10 million commitment is the optimal balance of EV and risk.
      *   **Confidence:** Medium. This is a judgment call balancing the 0.55 and 0.62 probability scenarios against the hard floor.

  **Point of Least Certainty:**
  I am least sure about the applicability of the geometric growth argument to a strictly one-off event. If the Committee believes the three-year freeze is manageable and does not impair long-term compounding significantly, the argument for limiting the bet size weakens. I would change my mind if the Committee could demonstrate a credible plan to maintain grantmaking impact during a freeze without drawing down capital further.
