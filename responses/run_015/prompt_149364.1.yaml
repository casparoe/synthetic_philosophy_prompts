      *   **The Obstacle:** A senior engineer argues that "man" is the "unmarked form/default," defaults are invisible, so using it implies nothing. He also says, "You can't fix the world by editing the dictionary."
      *   **The Goal:** The user wants a "menu" of precise interpretations of the claim "man is just the unmarked default."
      *   **Requirements for Each Interpretation:**
          *   (a) Plain terms assertion + domain (words, speakers, hearers, society, cognition).
          *   (b) Status (platitude, empirical claim, probably false).
          *   (c) Implication for the style guide (does it support keeping "man" or changing it?).
      *   **Specific Concepts to Integrate:**
          1.  *Live vs. Fossil Default:* Does the claim require the default to be psychologically active (live) or just historical (fossil)? How to tell?
