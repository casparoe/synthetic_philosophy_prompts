answer: |-
  This is a classic stalemate in technical communication, and your frustration is well-founded. The phrase "unmarked default" is doing a lot of heavy lifting, and it often smuggles three or four different arguments into one sentence.

  In linguistics, **markedness** is the idea that one form of a word is the "standard" (unmarked) and the other is the "special version" (marked). Think of *lion* vs. *lioness*. You can use *lion* for the species generally, but *lioness* only for females. *Lion* is unmarked; *lioness* is marked.

  Your colleague is arguing that *man* is the *lion* (generic) and *woman* is the *lioness* (specific). He claims this is invisible and neutral. You are arguing that *man* is actually *male-lion*, and using it for the species erases the females.

  Here is the menu of precise claims hidden inside "man is the unmarked default," graded from boring to contentious.

  ### The Menu of Claims

  #### 1. The Etymological Claim
  *   **(a) What it asserts:** Historically, the word *man* comes from a root meaning "human" (like the German *Mann* vs. *Mensch*). Therefore, using it today is just preserving the original, neutral meaning.
      *   *Domain:* History of words.
  *   **(b) Status:** **True historically, irrelevant now.** It is a fact that *man* once meant "human." It is an empirical fact that for most modern speakers, it no longer functions that way consistently.
  *   **(c) Implication for the guide:** **Cuts the other way.** If the meaning has shifted (which it has), the etymology doesn't justify current usage. Keeping it because of history is like keeping "dial a phone" because of rotary phones.
      *   *Live vs. Fossil:* This requires the default to be a **Fossil**. It's a historical leftover. Nobody's brain actually consults Old English when they hear "manpower."

  #### 2. The Cognitive Fluency Claim
  *   **(a) What it asserts:** When a reader sees "man" or "he," their brain processes it faster as a generic than "person" or "they." The "default" is just the path of least resistance for comprehension.
      *   *Domain:* How people think (Psycholinguistics).
  *   **(b) Status:** **Empirical claim (Plausible but fading).** For older generations or those steeped in older texts, this is likely true. For younger speakers, "they" is increasingly the fluent default.
      *   *Domain:* How people think.
  *   **(c) Implication for the guide:** **Supports keeping it *temporarily*.** If the goal is purely speed of reading, stick with the familiar. But if the goal is precision or inclusion, fluency is a cost you might choose to pay.
      *   *Live vs. Fossil:* This requires a **Live Default**. It only matters if the brain *currently* processes it faster. You can test this with reaction-time studies, but anecdotally, if your younger engineers stumble on "he" for a generic operator, the fluency advantage is gone.

  #### 3. The Statistical Base-Rate Claim
  *   **(a) What it asserts:** Since 90% of engineers are men, the word "engineer" statistically implies "man." Using "he" is just an accurate prediction of reality, not a linguistic rule.
      *   *Domain:* Society/Demographics.
  *   **(b) Status:** **Empirical claim (Contingently true).** It depends entirely on your specific field's demographics.
      *   *Domain:* Society.
  *   **(c) Implication for the guide:** **Cuts the other way.** If the default is driven by demographics, then as demographics shift, the language *should* shift. If you lock the language to "he" now, you create a lag where the docs feel outdated the moment your hiring improves.
      *   *Base Rates vs. Lexicon:* This addresses your second point. If it's just base rates, the default *should* evaporate as the field diversifies. The fact that it *doesn't* (that people still assume "he" even in diverse fields) suggests the bias is in the **Lexicon** (the word itself), not just the **World**.

  #### 4. The Asymmetry Claim (The "Markedness" Trap)
  *   **(a) What it asserts:** "Man" works as a generic, but "Woman" does not. You can say "mankind" for everyone, but "womankind" means only women. Therefore, the male form is the structural neutral.
      *   *Domain:* How words relate to each other (Structure).
  *   **(b) Status:** **True.** This is a structural feature of English. The male term *can* expand to cover the group; the female term *cannot*.
      *   *Domain:* Words.
  *   **(c) Implication for the guide:** **This is the problem.** If the male form is the only one allowed to be neutral, that structurally positions men as the "standard human" and women as the "special case." This is the strongest argument *for* changing the guide.
      *   *Live vs. Fossil:* **Live.** This is active grammar. You feel it immediately when you try to say "womanpower."

  #### 5. The Normative Claim (Male-as-Norm)
  *   **(a) What it asserts:** Society treats men as the standard human and women as the deviation. The language isn't causing it, but it's not innocent either; it reflects and reinforces that hierarchy.
      *   *Domain:* Society/Power.
  *   **(b) Status:** **Sociologically plausible.** Harder to prove with a dictionary, easy to prove with hiring data or mental imagery tests.
      *   *Domain:* Society.
  *   **(c) Implication for the guide:** **Strong case for change.** If the default is the problem (because it excludes), then removing the default is the solution.
      *   *Live vs. Fossil:* **Live.** It affects how people picture the "operator."

  ---

  ### Integrating Your Three Concepts

  #### 1. Live vs. Fossil Defaults
  Your friend's distinction is excellent.
  *   **The Etymological Claim (#1)** is a **Fossil**. It doesn't matter what the word meant in 1400. If it doesn't work that way now, it's dead.
  *   **The Cognitive Fluency Claim (#2)** is **Live**. It matters only if brains actually work that way today.
  *   **How to tell them apart:** You don't need a lab. Ask your colleague: *"If I write 'the nurse should check his chart,' do you picture a man?"* If he says "Yes," the default is **Live** (it's actively influencing imagery). If he says "No, I picture a nurse," then the gendered pronoun is a **Fossil** (it's just a word with no mental image attached). If it's a fossil, there is no reason to keep it over a neutral term. If it's live, it's actively excluding women.

  #### 2. Base Rates vs. Lexicon
  You asked: *If it's mostly the world and not the lexicon, does that change which reading is true?*
  *   If the bias is **only** Base Rates (Claim #3), then changing the style guide is indeed cosmetic. It's putting a sticker on a car that still has the same engine.
  *    However, language acts as a **ratchet**. Even if demographics shift to 50/50, if the docs say "he," new hires are subconsciously primed to expect men. The language slows down the update of the base rate.
  *   **The Inference:** You are right to distrust the inference that "demographics will fix the language." Usually, language lags behind demographics. If you wait for the demographics to make "he" feel neutral for women, you will wait forever. The style guide is a tool to speed up the alignment between language and reality.

  #### 3. The Hofstadter Sting & The Control Test
  You mentioned the satire where "personhole cover" sounds absurd.
  *   **What the sting shows:** It shows **Processing Cost**. "Manhole" is a familiar chunk. "Personhole" is a new chunk. Our brains hate new chunks. This feels like proof that "man" is the natural default.
  *   **Your Control Test:** Compare *womanpower* vs. *personpower*.
      *   **Result:** *Womanpower* sounds like a specific subset (power held by women). *Personpower* sounds like clumsy bureaucracy. *Manpower* sounds... normal.
      *   **Interpretation:** If *womanpower* feels "wronger" than *personpower*, it proves **Asymmetry (Claim #4)**. It shows that "Man" has a privileged status that "Woman" does not. "Person" is neutral but unfamiliar; "Woman" is specific. "Man" is pretending to be neutral while being specific.
      *   **Verdict:** The sting proves familiarity, but the asymmetry proves bias. The fact that we don't have a word for "human" that isn't gendered (like *anthropos* in Greek) is the real issue. We are forced to choose between "Man" (biased but fluent) and "Person" (neutral but clunky). The style guide's job is to accept the clunkiness to buy the neutrality.

  ### The Statutory Interpretation Point
  Your listserv colleague mentioned laws that say "masculine includes feminine."
  *   **Is it accurate?** Yes, many legal codes have this clause.
  *   **Stipulation vs. Discovery:** It is a **Stipulation**. It is a rule *about* the language, not a fact *of* the language.
  *   **Which reading does it support?** It supports the idea that the **Natural Language Default is Broken**.
      *   If "he" naturally and obviously meant "everyone," you wouldn't need a law to *force* it to mean everyone. The existence of the rule admits that without the rule, "he" would be read as "male."
      *   **Argument for your committee:** "The law has to explicitly override the natural interpretation because the natural interpretation is exclusive. We are doing the same thing in our style guide: overriding the natural interpretation to ensure clarity."

  ### The "Can't Fix the World" Line
  *   **Is it the same subject?** No. This is a topic switch.
      *   **Line 1 ("Unmarked default"):** This is a **Descriptive** claim. (Argument: "This language isn't biased.")
      *   **Line 2 ("Can't fix the world"):** This is a **Pragmatic** claim. (Argument: "Even if it is biased, changing it won't help.")
  *   **What he is usually aiming at:** When people use this line, they are usually conflating **Claim #2 (Fluency)** with **Claim #5 (Normative)**. They want the comfort of Fluency ("It's easier to read") without the baggage of the Normative ("It reinforces male-as-norm").
  *   **How to handle it:** Call the switch.
      *   *"I agree that editing the dictionary won't fix hiring bias on its own (Line 2). But we aren't trying to fix the world; we're trying to fix our docs. If Line 1 is true (that 'man' is truly neutral), then changing it costs effort for no gain. But if Line 1 is false (and 'man' actually cues male imagery), then keeping it costs inclusion for the sake of habit. Which claim are we defending? That it's neutral, or that neutrality doesn't matter?"*

  ### Summary Recommendation for the Committee
  Your colleague is likely operating on **Claim #2 (Fluency)** but defending it with **Claim #1 (Etymology)**.

  1.  **Grant the Fluency Point:** Acknowledge that "personhole" sounds weird and "manpower" reads faster.
  2.  **Pivot to Precision:** Engineering standards are about precision, not just speed. If "manpower" creates even a 1% ambiguity about whether women are included in the safety protocols, it fails the engineering standard.
  3.  **Use the Legal Precedent:** Point out that even the law admits "he" is not naturally inclusive, which is why they have to write rules forcing it to be. Your style guide is that rule for your company.
  4.  **The "Live" Test:** Ask him to close his eyes and picture "the user." If he pictures a guy, the default is Live. If it's Live, it's not invisible. If it's not invisible, it's not neutral.

  The "unmarked default" argument only works if the mark is truly invisible. In 2024 engineering contexts, the mark is visible.
