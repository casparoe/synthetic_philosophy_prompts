      *   **Tone/Level:** No linguistics background assumed. Explain technical terms. Analytical, nuanced, not preachy.

  2.  **Deconstruct the Core Claim ("Man is the unmarked default"):**

      *   *Linguistic Markedness:* In linguistics, "unmarked" usually means the form used when no specific distinction is needed (e.g., "actor" vs. "actress," where "actor" can be generic). "Marked" carries extra specific information.
      *   *The Senior Engineer's Argument:* Because it's unmarked, it's invisible/neutral. Therefore, no change needed.
      *   *The Counter-Argument:* If the unmarked form is male, it reinforces male-as-norm.

  3.  **Drafting the Menu of Interpretations:**

      *   *Interpretation 1: The Etymological/Historical Claim.* "Man" *used* to mean human.
