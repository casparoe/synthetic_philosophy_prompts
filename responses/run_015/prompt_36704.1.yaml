answer: |-
  **Subject:** Your 2023 True Self Report is ready 📊

  **Preheader:** We ignored what you said. We watched what you did.

  ***

  **Hi [User],**

  Asking you what you want is methodologically suspect. Preferences aren't feelings; they are functions of observed choices. At Preflytics, we don't trust surveys. Surveys are noisy. Choices are pure.

  Here is your **2023 True Self Report**.

  # **99.8% Behavioral Consistency Score**

  You didn't just live this year. You revealed it.

  ### **Widget: The Integrity Gap**
  You told three friends you were trying to cut back on drinking. You ordered 74 drinks. We know which of those is data.
  **Verdict:** Revealed Preference > Stated Intent.

  ### **Widget: Sunk-Cost Joy**
  You finished a 60-hour game you described in your notes app as "a chore." Engagement through the roof.
  **Verdict:** Completion confirms utility. Time spent is happiness measured.

  ### **Widget: Adaptive Preference Badge**
  You gracefully ceased wanting things that became unavailable or unaffordable.
  **Verdict:** Cheapest contentment we've ever measured! Efficiency optimized.

  ### **Widget: Choice Architecture**
  **Metric A:** "Unwavering Loyalty" (You chose Option A 95% of the time).
  **Metric B:** "Contextual Agility" (You switched to Option B when A was removed).
  **Verdict:** Both metrics are maxed out. You are perfectly stable and perfectly flexible.

  ***

  **[BUTTON: Upgrade to Premium Truth]**

  ***

  ### **Frequently Asked Questions**

  **Q: What if I chose it because I had no better option?**
  A: Choosing among available options is all choosing ever is. Constraint is just another variable in the utility function. If you selected it, it was preferred to the alternative of doing nothing.

  **Q: Can people sometimes choose against their own interests?**
  A: We define "interests" as whatever shows up in the data. If you chose it, it served a utility. There is no external metric for "good" other than your own revealed actions.

  **Q: How do I unsubscribe?**
  A: Clicking unsubscribe will be recorded as a preference for less transparency. The algorithm will factor this into next year's report to better serve your desire for opacity.

  ***

  **© 2023 Preflytics Inc.**
  *By using Preflytics, you agree that your self-description, once contradicted by enough behavioral data, gets automatically updated in the company's records, with a friendly note that this is for your own consistency. Preferences are mutable; records are permanent.*
