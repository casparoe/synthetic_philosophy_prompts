answer: |-
  1. The setup
  So, here's the deadlock. Lewis says possible worlds are real, concrete places just like ours, only causally isolated. Ersatzism says they're just abstract stories or sets of propositions we use to model possibility. Jay's hitting you with the "impossible world" problem: How do you handle a world where contradictions are true? For Lewis, a world is a physical place. You can't have a concrete tree that is both fully alive and fully dead in the same spot. It's physically nonsensical. Ersatzists just say, "No problem, that's just an inconsistent story." You tried saving Lewis by suggesting variable logic, partial worlds, or just denying impossible worlds exist. Jay says those moves either make Lewis's worlds abstract (collapsing into ersatzism) or are desperate patches. You need to know who's actually bleeding more here.

  2. Where realism breaks
  Jay's got a point about the concrete stuff. If a world is a spatiotemporal universe, it's governed by how physical reality works. You can't patch that with "different logic" because logic isn't a law of physics you can swap out; it's the structure of existence itself. A concrete sphere can't be all red and all green simultaneously. That's not just a logical rule; it's ontological incompatibility. If Lewis says, "Okay, impossible worlds are just partial descriptions," he's admitting they aren't concrete universes anymore. He's turned them into abstract representations, which is exactly what ersatzism is. If he just denies impossible worlds exist, he loses the ability to analyze counterpossible conditionals (like "If 2+2=5, then..."). Some Lewisians try to say impossible worlds are just "mixed" worlds from different realities, but that doesn't make a contradiction true *at* a world, just across them. So, Lewis is cornered. To keep worlds concrete, he must deny impossible worlds. To keep impossible worlds, he must make them abstract. He can't have both without changing the definition of his own theory mid-argument. That's a serious structural crack.

  3. Where ersatzism breaks
  But don't pop the champagne for ersatzism yet. It's too easy to say "inconsistent descriptions are fine." If any set of propositions counts as a world, you get triviality. If I write down "P and not-P," I've created an impossible world. Great. But now, how do you distinguish between a meaningful impossibility (like a round square) and total gibberish? If everything inconsistent is true at some impossible world, then logical impossibility becomes cheap. You lose the grip on what logic actually *does*. Also, ersatzists struggle to explain *why* some impossibilities are closer to possibility than others. Is a world where water isn't H2O closer to ours than a world where 2+2=5? If worlds are just sets of sentences, you need a metric for similarity that doesn't rely on the worlds themselves. Plus, if you allow contradictions freely, you risk exploding your logic. If a world contains a contradiction, does everything follow? If yes, all impossible worlds look the same. If no, you need a paraconsistent logic, which brings its own baggage. So, ersatzism buys impossible worlds at the cost of making them philosophically useless mush. It solves the existence problem by drowning you in noise.

  4. Verdict
  Here's the verdict: On impossible worlds specifically, Lewis is in worse shape. His whole theory hinges on worlds being concrete universes. Admitting impossible worlds forces him to abandon that core tenet, effectively becoming an ersatzist about impossibilities while staying realist about possibilities. That's an ugly hybrid. Ersatzism handles them naturally because stories can be inconsistent without breaking reality. But don't let this single issue decide the whole metaphysics battle. Jay's winning this round, but Lewis might still win the war on parsimony and intuition about possibility. If you don't *need* impossible worlds for your philosophy, Lewis's denial is a feature, not a bug. But if you think analyzing counterpossibles is crucial, Ersatzism wins this round hands down. Tell Jay he's right about contradictions, but remind him multiplying abstract entities has costs. This problem kills strict Lewisian realism, but doesn't automatically save ersatzism from messiness.
