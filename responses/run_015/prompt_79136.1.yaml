answer: |-
  **Question**

  Sen's Liberal Paradox is often dismissed as an artefact of meddling preferences. Critically assess this claim. First, specify precisely what Minimal Liberalism requires of a social choice rule: is it merely a condition on the assignment of decisiveness over pairs, or a substantive restriction on the domain of admissible preferences? Second, evaluate two proposed resolutions: (i) reformulating preferences as conditional on others' actions, and (ii) modelling rights as deontological constraints on outcomes rather than inputs to welfarist aggregation. For each, determine whether it dissolves the impossibility or merely relocates the normative conflict, and articulate the specific cost each imposes on a coherent theory of liberal rights. Avoid mere restatement of the theorem.

  ***

  **Model Answer**

  The suggestion that the Liberal Paradox dissolves if we exclude 'meddling' preferences misunderstands the normative force of Minimal Liberalism (ML). ML is not a substantive claim about what counts as private business, but a formal condition assigning decisiveness to individuals over specific pairs of social states. It requires that if an individual prefers state A to B, and this pair falls within their protected sphere, society must rank A above B. Decisiveness means the social ranking must mirror the individual's ranking for that pair, irrespective of the intensity of others' preferences. This holds regardless of whether others care. To restrict the domain of admissible preferences—as the law colleague suggests—is to make rights contingent on the attitudes of others, thereby undermining the very protection liberalism seeks to provide. If rights vanish whenever someone else objects, they are not rights but privileges. The paradox arises precisely because welfarist aggregation respects all preferences, including meddling ones, while ML insists some preferences trump others. This tension is structural, not psychological.

  The first escape route involves reformulating preferences as conditional. Here, the prude's preference is not over the lewd's reading in isolation, but over combinations of actions. Proponents argue that if rights protect actions rather than outcomes, the paradox vanishes. However, this merely relocates the difficulty. If individuals care about outcomes, strategic interaction will still lead to Pareto-inferior results, often mirroring a Prisoner's Dilemma structure. Treating rights as game-form rules rather than social choice constraints shifts the analysis from aggregation to strategy, but it does not resolve the conflict between individual control and collective welfare. The cost here is significant: it reduces liberty to strategic power. If the prude cannot enforce their preference through the social choice rule, their 'right' is merely a move in a game they might lose. This fails to capture the deontological intuition that certain choices should be protected regardless of equilibrium outcomes. Furthermore, it assumes individuals only care about their own actions, which contradicts the interdependent preferences that generate the paradox in the first place. By changing the object of choice, this solution avoids the theorem but fails to protect the underlying value.

  The second escape route models rights as deontological constraints on outcomes rather than inputs to aggregation. This approach abandons welfarism. Instead of feeding preferences into a social welfare function, rights act as side-constraints that remove certain states from the feasible set before aggregation occurs. The Pareto principle is then applied only to the remaining admissible states. This genuinely dissolves the logical impossibility because the conflicting pairs never enter the social choice calculation simultaneously. However, the cost is the abandonment of consequentialist evaluation. We can no longer rank all social states; some are inadmissible regardless of welfare gains. This creates incompleteness in the social ordering, meaning the rule cannot identify a unique best outcome in all cases, which challenges the standard economic goal of optimal policy selection. It conflicts with the Paretian intuition that if everyone prefers X to Y, and both are permissible, society should choose X. It forces a choice between respecting rights as absolute barriers or respecting preferences as the sole source of value. This approach acknowledges that rights are not merely intense preferences but trumps over utility maximization.

  Ultimately, neither resolution is free. The conditional preference approach retains welfarism but fails to protect liberty substantively, reducing it to strategic capacity. The constraints approach protects liberty but sacrifices the comprehensive ranking required by standard social choice theory. The paradox is not a trick; it is a rigorous demonstration that liberal rights and Pareto efficiency are incompatible within a welfarist, consequentialist framework. A coherent theory of liberalism must therefore either accept incomplete social orderings or reject the notion that rights are merely preferences over outcomes. The law colleague is wrong to dismiss the paradox as an artefact of meddling; it is instead a fundamental limit on aggregating individual values into a social decision while respecting individual sovereignty. Students must recognize that resolving the paradox requires abandoning either the universality of preference aggregation or the consequentialist structure of social choice. The true lesson is that liberalism cannot be fully grounded in welfarist terms without contradiction.

  ***

  **Marking Scheme (20 Marks)**

  **1. Definition of Minimal Liberalism (5 marks)**
  *   **Must hit:** Identify ML as a condition on *decisiveness over pairs* of social states, not a domain restriction on preferences. Explain that rights hold even if others have meddling preferences.
  *   **Typical error:** Students claim ML requires preferences to be purely self-regarding or confuse ML with a restriction on admissible utility functions.
  *   *Note:* Candidates often conflate the *protection* of privacy with a *restriction* on what others can feel.

  **2. Analysis of Conditional Preferences (5 marks)**
  *   **Must hit:** Explain that this shifts rights from outcomes to actions (game forms). Argue this *relocates* the conflict (e.g., to Prisoner's Dilemma equilibria) rather than solving it.
  *   **Typical error:** Treating the conditional preference fix as a complete solution that preserves both welfarism and liberty without cost.
  *   *Note:* Candidates frequently assume changing the object of choice eliminates the normative conflict rather than masking it.

  **3. Analysis of Rights as Constraints (5 marks)**
  *   **Must hit:** Explain that this abandons welfarism by treating rights as side-constraints filtering the feasible set. Acknowledge this creates *incompleteness* in the social ordering.
  *   **Typical error:** Suggesting this allows Pareto to apply universally or failing to note the loss of consequentialist ranking.
  *   *Note:* Candidates often miss that removing states from the feasible set violates the standard requirement for a complete social welfare function.

  **4. Evaluation of Costs and Resolution (5 marks)**
  *   **Must hit:** Conclude that neither route is free: one sacrifices substantive liberty (strategic power), the other sacrifices welfarist aggregation. Affirm the paradox reveals a deep incompatibility, not a trick.
  *   **Typical error:** Concluding that liberalism is incompatible with democracy, or that one solution is clearly superior without trade-offs.
  *   *Note:* Candidates frequently drift into political science generalities about democracy rather than focusing on the welfarist/deontological clash.
