  # OPERATIONAL DIRECTIVE 7.4: DETERMINATION OF STRUCTURAL IDENTITY FOR PROTECTED STATUS
  **Issuing Authority:** National Heritage Authority (NHA)  
  **Prepared By:** Office of Philosophical Consultation  
  **Audience:** Preservation Officers & Administrative Review Boards  
  **Subject:** Protocol for Assessing "Originality" in Gradually Restored or Reconstructed Structures  

  ## 1. PURPOSE AND SCOPE
  This procedure provides a standardized method for determining whether a historic structure retains sufficient identity to qualify as "the original" under Protection Statute §102. Officers must recognize that "originality" is not a purely physical fact but a conceptual boundary. This protocol forces specific decisions where common sense is vague. 

  **Note to Officers:** You are not required to cite philosophical literature in public rulings. However, the "Logic & Defense Basis" notes below explain *why* each step is structured this way. Use these notes to defend the internal consistency of your ruling during administrative review.

  ---

  ## 2. THE IDENTITY CONTINUITY PROTOCOL (ICP)

  Proceed through Steps 1–4 in order. A "FAIL" at any step does not automatically deny protection; it triggers a weighting analysis in Step 5. However, specific "Hard Stops" exist where protection is legally precluded.

  ### STEP 1: MATERIAL THRESHOLD (The Tolerance Condition)
  **Question:** What percentage of the primary structural material (load-bearing elements, cladding, foundation) dates from the period of original construction?
  *   **Option A:** > 50% Original Material.
  *   **Option B:** ≤ 50% Original Material.

  **Sufficient Answer:** A certified quantification report from a structural engineer or conservator.
  **Determination:** 
  *   If **Option A**: Proceed to Step 2. (Presumption of Identity).
  *   If **Option B**: Proceed to Step 2, but flag as "Materially Compromised."

  > **Logic & Defense Basis (Epistemic Commitment):** 
  > *Philosophical Commitment:* **Epistemicism with Arbitary Precisification.** 
  > *Explanation:* There is no natural physical point where a structure ceases to be itself (the Sorites Paradox). However, administrative law requires a sharp boundary. We are artificially imposing a 50% cutoff to create a knowable rule. 
  > *Defense Note:* If challenged, state: "While identity is gradual, administrative certainty requires a fixed threshold. The 50% mark is the statutory standard for 'majority continuity.'" Do not admit the line is arbitrary in public; assert it is the standard for *evidentiary weight*.

  ### STEP 2: TEMPORAL CONTINUITY (The Existence Gap)
  **Question:** Did the structure cease to exist as a functional or standing entity for any period exceeding 12 consecutive months during its history?
  *   **Option A:** No. (Continuous existence).
  *   **Option B:** Yes. (Total destruction or removal).

  **Sufficient Answer:** Archival records, insurance logs, or photographic evidence confirming the presence or absence of the structure on the site.
  **Determination:** 
  *   If **Option A**: Proceed to Step 3.
  *   If **Option B**: **HARD STOP.** Designation: **NOT PROTECTED (Replica).** (See Exception in Step 5).

  > **Logic & Defense Basis (Spatio-Temporal Commitment):** 
  > *Philosophical Commitment:* **Perdurance Theory / Spatio-Temporal Continuity.** 
  > *Explanation:* An object is a "space-time worm." If the worm is broken, the object is terminated. A new object begins upon reconstruction. 
  > *Defense Note:* This is the strictest node. Even if rebuilt exactly to spec, a total break in existence creates a new entity. This distinguishes "restoration" (repairing the existing) from "reconstruction" (building a new one).

  ### STEP 3: FUNCTIONAL AND DESIGN INTEGRITY (The Form)
  **Question:** Does the structure retain the original design alignment, load-bearing logic, and aesthetic profile, regardless of material age?
  *   **Option A:** Yes. (Design is faithful; no modern functional alterations).
  *   **Option B:** No. (Significant design deviations, modern reinforcements visible, or change of use).

  **Sufficient Answer:** Architectural comparison analysis (Original Blueprints vs. As-Built).
  **Determination:** 
  *   If **Option A**: Proceed to Step 4.
  *   If **Option B**: Proceed to Step 4, but flag as "Functionally Compromised."

  > **Logic & Defense Basis (Functionalist Commitment):** 
  > *Philosophical Commitment:* **Functionalism.** 
  > *Explanation:* Identity resides in the *role* and *shape* of the object, not just its atoms. A ship with replaced planks is the same ship if it sails the same way. 
  > *Defense Note:* Use this to protect structures with high material replacement (Step 1 Fail) if the *design* remains authentic.

  ### STEP 4: COMMUNITY IDENTIFICATION (The Causal Chain)
  **Question:** Has the local community and historical record consistently referred to this specific structure as the same entity throughout its lifespan, without interruption of naming?
  *   **Option A:** Yes. (Continuous naming/identification).
  *   **Option B:** No. (Renamed, forgotten, or historically re-designated after a change).

  **Sufficient Answer:** Public records, maps, oral history transcripts, or media archives.
  **Determination:** 
  *   If **Option A**: Strong evidence of Identity.
  *   If **Option B**: Weak evidence of Identity.

  > **Logic & Defense Basis (Causal-Historical Commitment):** 
  > *Philosophical Commitment:* **Causal Theory of Reference (Kripke/Putnam).** 
  > *Explanation:* A name ("The Old Bridge") refers to an object via a historical chain of usage. If the community never stopped calling it the same name, the reference holds even if matter changes. 
  > *Defense Note:* This protects "Living Heritage." If the public treats it as the original, the law should reflect that social fact.

  ---

  ## 3. DECISION MATRIX (STEP 5)

  Combine the results from Steps 1–4 to issue a final determination.

  | Step 1 (Material) | Step 2 (Time) | Step 3 (Form) | Step 4 (Community) | **VERDICT** |
  | :--- | :--- | :--- | :--- | :--- |
  | **> 50%** | **Continuous** | **Faithful** | **Consistent** | **PROTECTED** (Clear Case) |
  | **≤ 50%** | **Continuous** | **Faithful** | **Consistent** | **PROTECTED** (Ship of Theseus Clause) |
  | **Any %** | **Broken (>12mo)** | **Faithful** | **Consistent** | **NOT PROTECTED** (Replica Rule)* |
  | **≤ 50%** | **Continuous** | **Deviated** | **Inconsistent** | **NOT PROTECTED** (Loss of Identity) |
  | **Mixed/Conflicting** | **Continuous** | **Mixed** | **Mixed** | **REFER TO REVIEW BOARD** (Vagueness Zone) |

  *\*Exception: If Step 2 is "Broken" but Step 4 is "Consistent" AND the reconstruction used >30% salvaged original material, Officer may recommend "Protected" but must flag for Board Review. This acknowledges **Supervaluationism** (it is true on some interpretations of 'identity' but not others).*

  ### THE VAGUENESS ZONE (Referral Required)
  **Condition:** If Step 1 is "Fail" (≤50% material) AND Step 2 is "Pass" (Continuous) AND Step 3 is "Pass" (Faithful), but the structure has undergone *incremental* replacement over a very long period (e.g., >100 years of constant repair).
  **Action:** **REFER UPWARD.**
  **Reason:** This is a **Sorites Boundary Case**. The protocol cannot distinguish between "maintenance" and "replacement" at the limit. This requires a values-based judgment, not a factual one.

  > **Logic & Defense Basis (Failure of Bivalence):** 
  > *Philosophical Commitment:* **Ontic Vagueness / Truth-Value Gaps.** 
  > *Explanation:* In these specific cases, there is no fact of the matter. It is neither true nor false that it is the "original." 
  > *Defense Note:* Do not attempt to justify this with facts. State: "This case falls within the statutory ambiguity of 'originality.' The Authority must make a policy decision on whether to value continuity of matter or continuity of history."

  ---

  ## 4. APPLICATION TO TEST STRUCTURES

  The following applications demonstrate the protocol's output. Officers should note where the verdict aligns or conflicts with intuitive heritage value.

  ### CASE (i): The Wooden Bridge (60% Plank Replacement)
  *   **Step 1 (Material):** **FAIL** (40% original < 50% threshold).
  *   **Step 2 (Time):** **PASS** (Arch, foundation, alignment intact; no destruction).
  *   **Step 3 (Form):** **PASS** (Original alignment and arch intact).
  *   **Step 4 (Community):** **PASS** (Assumed consistent identification).
  *   **Matrix Result:** **PROTECTED** (Ship of Theseus Clause).
  *   **Analysis:** The protocol prioritizes Temporal Continuity and Form over Material Majority. 
  *   **Philosophical Note:** This accepts that identity can survive majority material replacement if the *structure* persists. This is a **Functionalist** victory over **Mereological Essentialism** (the idea that parts are essential to the whole).

  ### CASE (ii): The Fire-Rebuild (Destroyed, Rebuilt with Salvage)
  *   **Step 1 (Material):** **PASS/FAIL** (Assume <50% salvage due to fire loss).
  *   **Step 2 (Time):** **FAIL** (Destroyed by fire; ceased to exist).
  *   **Step 3 (Form):** **PASS** (Rebuilt from blueprints).
  *   **Step 4 (Community):** **PASS** (Never absent from site conceptually).
  *   **Matrix Result:** **NOT PROTECTED** (Replica Rule).
  *   **Analysis:** **This is the verdict the Authority will dislike.** The structure is historically significant, but strictly speaking, it is a replica.
  *   **Philosophical Note:** This enforces **Spatio-Temporal Continuity**. Philosophically, the original object ceased to exist at the moment of structural collapse. The new bridge is a *qualitative duplicate*, not a *numerical identity*. 
  *   **Administrative Risk:** The Authority may wish to protect the *site* or the *memory*, but under this protocol, the *structure* is not original. Officers must defend this by distinguishing "Historic Significance" (which it may have) from "Original Structure Status" (which it lacks).

  ### CASE (iii): The Continuously Maintained Bridge (No plank >50 years old)
  *   **Step 1 (Material):** **FAIL** (0% original planks).
  *   **Step 2 (Time):** **PASS** (Never demolished; continuous maintenance).
  *   **Step 3 (Form):** **PASS** (Maintained to original spec).
  *   **Step 4 (Community):** **PASS** (Records consistently identify as same structure).
  *   **Matrix Result:** **PROTECTED** (Ship of Theseus Clause).
  *   **Analysis:** This is the classic "Ship of Theseus." The protocol rules that continuous existence trumps material replacement.
  *   **Philosophical Note:** This relies on **Perdurance Theory**. The bridge is a process in time, not a static collection of atoms. As long as the process was not interrupted, the identity holds.

  ---

  ## 5. CLASSES OF UNSETTLED BORDERLINE CASES

  This procedure cannot settle the following class of cases. They must be referred to the Values-Based Review Board for a policy determination, as they represent a **Failure of Bivalence**.

  **The "Incremental Erasure" Class:**
  Structures where:
  1.  Material replacement is high (>80%).
  2.  Temporal continuity is unbroken.
  3.  Replacement occurred so gradually that no single administrative decision authorized a "reconstruction."
  4.  Community identification is strong.

  **Why the Procedure Fails Here:**
  In these cases, **Epistemicism** (there is a hidden fact) and **Ontic Vagueness** (there is no fact) yield opposite results. 
  *   If we assume **Epistemicism**, the Officer must find the hidden line (impossible).
  *   If we assume **Ontic Vagueness**, the statement "This is the original" has no truth value.

  **Directive:** 
  Do not issue a "Protected" or "Not Protected" ruling for this class. Submit a **Finding of Ambiguity**. The Review Board must decide whether the NHA values *material authenticity* (which would deny protection) or *historical continuity* (which would grant it). This is a political choice, not a factual one.

  ---

  **Certified By:** 
  *Office of Philosophical Consultation*  
  *Date: October 26, 2023*
