  9.  *(Self-Correction on Tone)*: The prompt asks me to act as the Professor consulting. The output should be the *deliverable* (the checklist) but framed within the consultation context, or perhaps the checklist *is* the deliverable with annotations. I will structure it as a formal "Operational Directive" with embedded "Philosophical Justification" notes for the officers to use in appeals. This satisfies the "defend their rulings" requirement.

