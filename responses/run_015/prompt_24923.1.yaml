answer: |-
  # Joint Statement on Quantum Suicide and Rational Expectation in Everettian Quantum Mechanics

  **Prepared by:** The Proponent and The Skeptic  
  **Facilitated by:** The Reading Group  
  **Date:** October 26, 2023  

  ## Preamble
  This document summarizes the current state of agreement and disagreement between the undersigned regarding the implications of the Quantum Suicide (QS) thought experiment within the Everettian (Many-Worlds) Interpretation (MWI) of quantum mechanics. Our goal is to isolate genuine philosophical and physical disputes from terminological confusion, thereby clarifying what evidence or argumentation would be required to resolve the debate.

  ## Part I: Agreed Claims
  We jointly affirm the following propositions as the common ground for our discussion. Disagreement arises only in the interpretation and normative implications of these claims.

  1.  **Formalism:** We assume the Everettian formalism is correct: quantum state evolution is universally unitary, there is no wavefunction collapse, and macroscopic distinctness arises via decoherence.
  2.  **Branching Structure:** In a QS setup (a device measuring a quantum superposition linked to a lethal mechanism), the universal wavefunction evolves into orthogonal components ("branches") corresponding to distinct macroscopic outcomes (Agent Alive / Agent Dead).
  3.  **Existence of Outcomes:** In the MWI, both the "Alive" and "Dead" outcomes physically occur in the sense that both branches exist within the post-measurement wavefunction.
  4.  **No-Go Theorems:** We agree that Bell's Theorem and the Kochen-Specker Theorem rule out local hidden variables and non-contextual hidden variables, respectively, but do not rule out the Everettian interpretation.
  5.  **Phenomenological Continuity:** We agree that from the first-person perspective of a surviving branch, the experience of survival is continuous and indistinguishable from survival in a single-world theory. There is no "gap" in experience for the survivor.
  6.  **Criteria for Success:** A successful argument regarding QS must bridge the gap between *ontology* (what branches exist) and *epistemology/decision theory* (what a rational agent should expect or do). Merely asserting that "branches exist" is insufficient to dictate rational credence.
  7.  **The Born Rule:** We agree that the Born Rule (assigning probabilities proportional to squared amplitudes) is empirically adequate for predicting frequencies in standard quantum experiments. The dispute concerns its normative status in QS scenarios.

  ## Part II: Table of Disagreements
  The following table details specific points of contention. We have classified disputes as **Substantive** (concerning facts, logic, or normative principles) or **Verbal** (concerning definitions or usage), noting where verbal disputes mask deeper substantive issues.

  | Point of Dispute | Proponent's Position | Skeptic's Position | Type | Crux (The Sub-Question) | Agreed Evidence / Test & Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Relevance of Branch Measure to Expectation** | Branch measure (amplitude squared) is ontologically real but epistemically irrelevant to *first-person survival*. If a branch with non-zero amplitude contains a conscious successor of "me," I should expect to find myself there with certainty. | Branch measure is constitutive of rational credence. Even in MWI, a rational agent should weight their anticipation of future experiences by the branch measure. Low-measure survival is possible but should not be *expected*. | Substantive | **The Normativity of Measure:** Does the Born Rule derive from decision-theoretic axioms (Deutsch-Wallace) that bind *anticipation*, or only *betting preferences*? | **Case:** A quantum lottery where survival yields \$0, but death yields \$1M for your heirs (weighted by amplitude).<br>**Prop:** Agent refuses to play; survival is certain, gain is zero.<br>**Skep:** Agent plays if survival amplitude is low; rational to trade low-weight survival for high-weight heir benefit. |
  | **2. The "Proves Too Much" Objection (Quantum Russian Roulette)** | The argument does not prove too much. One should not play Quantum Russian Roulette because the *quality* of surviving branches (e.g., trauma, loss of wealth) may be low, or because one cares about branches where one dies (altruism). Survival certainty does not imply indifference to outcomes. | The argument proves too much. If subjective survival probability is 1 regardless of odds, a rational egoist should accept any QS gamble where the surviving branch offers even marginal utility, violating standard risk aversion. | Substantive | **Utility vs. Probability:** Can an Everettian decision theory coherently separate the *probability of experience* from the *utility of outcomes* when the probability is fixed at 1? | **Case:** 1-in-$10^{100}$ survival amplitude vs. \$1 reward.<br>**Prop:** Rational agent declines. The "cost" includes the disvalue of the branches where successors die (caring measure).<br>**Skep:** Rational agent declines because subjective credence of survival should be $10^{-100}$, not 1. |
  | **3. The Bridge Principle (Third-Person to First-Person)** | The bridge is **Personal Identity**. "I" am the continuous thread of consciousness. Since consciousness continues in the survival branch, "I" survive. The third-person fact of branching does not negate the first-person fact of continuity. | The bridge is **Successorship**. "I" do not survive; my pre-branch self has multiple successors. First-person credence is ill-defined without a principle assigning weights to successors. Identity is not a transitive relation across branching. | Substantive | **Criteria of Identity:** Is personal identity a unique path (Endurantism/Sortalism) or a branching relation (Perdurantism/Stage Theory) in MWI? | **Case:** Teleportation paradox with branching. If two copies emerge, which is "you"?<br>**Prop:** Both are me, but I only experience the one where I exist (survival).<br>**Skep:** Neither is uniquely me; I have divided. Credence must be split. |
  | **4. Definition of "Expectation"** | "Expectation" refers to **predictive certainty of experience**. To ask "What will I see?" is to ask "In which branch does my perspective persist?" Answer: The survival branch. | "Expectation" refers to **degree of belief (credence)** guiding action. To ask "What should I expect?" is to ask "How should I bet?" Answer: According to branch weights. | Verbal (masks Substantive) | **Link between Belief and Action:** Does predictive certainty necessarily entail betting odds of 1:0? | **Case:** Willingness to bet life savings on survival.<br>**Prop:** I am certain I will survive, but I won't bet because I care about the dead branches.<br>**Skep:** If you are certain, rationality demands you bet (unless utility is negative). Your refusal shows you aren't certain. |
  | **5. The Role of Caring vs. Being** | I am justified in acting to maximize the welfare of *all* my successors, but this is distinct from where *I* will find myself. I can care about the dead branches without expecting to be in them. | Caring *is* the operational definition of probability in MWI. To say "I assign probability $p$ to outcome X" just means "I care about the X-successor to degree $p$." Distincting caring from expectation is incoherent. | Substantive | **Functionalism:** Is probability defined by frequency, belief, or caring measures? | **Case:** Greaves-Myrvold "Caring Measure" argument.<br>**Prop:** Caring explains altruism, not first-person phenomenology.<br>**Skep:** Caring explains everything relevant to decision theory; phenomenology is a red herring. |

  ## Part III: Conditions for Mind-Changing
  To move this discussion forward, we specify what would constitute a reason for either party to revise their position.

  **The Proponent would revise her view if:**
  1.  It is demonstrated that a decision theory based on "survival certainty" leads to dynamic inconsistency (e.g., planning to do X at $t_1$, but rationally compelled to do not-X at $t_0$).
  2.  A coherent account of personal identity is provided that shows the pre-branch agent is *numerically distinct* from the post-branch survivor in a way that breaks first-person anticipation.
  3.  It is shown that "expecting survival" forces the agent to make bets that guarantee a loss of utility across the multiverse (Dutch Book argument applied to MWI).

  **The Skeptic would revise his view if:**
  1.  It is demonstrated that branch measure cannot be derived from decision-theoretic axioms without presupposing the conclusion (circularity in Deutsch-Wallace).
  2.  A phenomenological argument is provided showing that first-person experience *cannot* be modeled by credence distributions (i.e., proving that "what it is like" is binary, not weighted).
  3.  It is shown that the "Caring Measure" approach fails to recover the Born Rule in cases where altruism is removed (pure egoist scenarios).

  ## Signatories

