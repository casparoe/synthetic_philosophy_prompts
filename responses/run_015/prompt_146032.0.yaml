prompt: |-
  Belgium forces citizens to vote but lets long-term residents who aren't citizens vote locally after five years, and in some municipalities teenagers sit on advisory boards where each vote counts half. What theory of political membership does that combination presuppose? Does it treat citizenship like a bundle you can split into partial rights, or does it say being affected by local rules is enough for partial standing? And if the half-weight for teens is meant to track developing rational capacity, why doesn't teh same logic apply to elderly voters with decline? Reconstruct the implicit view, say whether it's consistent, and tell me what'd have to change if we replaced it with a pure affected-interests model.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Prompt:**

      *   **Facts Presented:**
          1.  Belgium has compulsory voting for citizens.
          2.  Belgium allows long-term non-citizen residents (5+ years) to vote in local elections.
          3.  Some Belgian municipalities have youth advisory boards where teen votes count as "half."
      *   **Questions to Answer:**
          1.  What theory of political membership does this combination presuppose?
          2.  Does it treat citizenship as a "bundle of rights" (unbundling) or based on "affected interests" (all-affected principle)?
          3.  Why does the "developing capacity" logic apply to teens but not the elderly (cognitive decline)?
          4.  Reconstruct the implicit view.
          5.  Assess consistency.
          6.  Explain what would change under a pure "affected-interests" model.

  2.  **Analyze the Facts & Theories:**

      *   *Fact 1: Compulsory Voting for Citizens.*
          *   Implication: Voting is a civic duty, not just a right. Membership entails obligation. This aligns with *Civic Republicanism*.
      *   *Fact 2: Non-citizen Local Voting (5 years).*
          *   Implication: Residency + Stake in local community grants political voice, even without national membership. This aligns with *Residency-Based* or *All-Affected* principles (specifically at the local level). It suggests citizenship isn't the *only* gateway to voting.
      *   *Fact 3: Teen Advisory Boards (Half-Vote).*
          *   Implication: Political capacity is graduated. Age is a proxy for competence/maturity. This aligns with *Competence-Based* or *Developmental* theories of suffrage.

  3.  **Address Question 1 & 2: Theory of Membership & Bundle vs. Affected:**

      *   *Theory:* It's a hybrid. It's not purely *Ethno-Nationalist* (since non-citizens vote). It's not purely *Liberal-Individualist* (since voting is mandatory). It looks like **Civic Republicanism mixed with Stakeholder Citizenship**.
      *   *Bundle vs. Affected:* It definitely treats citizenship as a "bundle" that can be unbundled. National citizenship = National vote + Duty. Local residency = Local vote (partial bundle). Age = Weight of vote (partial capacity).
      *   *However,* the non-citizen voting *does* invoke the "affected interests" principle (you live here, rules affect you, you vote). But it's limited to local levels, suggesting a tiered system.
      *   *Conclusion:* It presupposes a **Tiered Stakeholder Model**. Citizenship is the core bundle, but specific rights (local suffrage) can be decoupled based on residency (affected interest), while the *weight* of participation is modulated by capacity (age).

  4.  **Address Question 3: Teens vs. Elderly (The Consistency Problem):**

      *   *Logic for Teens:* Developing rational capacity. They are not yet fully autonomous.
      *   *Logic for Elderly:* Cognitive decline happens, but it's individual, not categorical.
      *   *The Inconsistency:* If the justification is *capacity*, then age is a crude proxy. Some 16-year-olds are sharper than some 80-year-olds.
      *   *Why the distinction?* It's likely based on *socialization* and *future stake*. Teens are being socialized into the system (pedagogical voting). The elderly have already participated; removing weight based on ageist assumptions is discriminatory and legally fraught (equality principles).
      *   *Implicit View:* The system values *future-oriented socialization* for youth more than it fears *past-oriented decline* for elders. Or, it views youth capacity as a *class characteristic* (developmental stage) whereas elder decline is viewed as an *individual medical issue*.

  5.  **Reconstruct the Implicit View:**

      *   **Core:** Political membership is multi-layered.
      *   **Layer 1 (National):** Full citizenship = Full rights + Duty (Compulsory).
      *   **Layer 2 (Local):** Residency + Time = Partial rights (Local vote). Justification: Stake in community.
      *   **Layer 3 (Capacity):** Age = Weight of voice. Justification: Pedagogical integration for youth.
      *   **Normative Basis:** A mix of Republicanism (duty), Liberalism (rights based on residency), and Paternalism/Developmentalism (age weights).

  6.  **Assess Consistency:**

      *   *Internal Tension:* Compulsory voting implies equal duty. Half-votes imply unequal capacity. If you are forced to vote, should your vote count less? That seems contradictory.
      *   *Tension 2:* Non-cizens vote locally based on "affectedness," but teens vote advisory based on "capacity." Why don't non-citizens get national votes if they are affected by national laws? (Answer: Sovereignty/Nationality boundary).
      *   *Tension 3 (The Elderly):* As noted above, the capacity argument is applied asymmetrically.
      *   *Verdict:* Pragmatically functional, but theoretically messy. It prioritizes social cohesion and integration over strict philosophical consistency.

  7.  **Address Question 6: Pure Affected-Interests Model:**

      *   *Definition:* Everyone affected by a decision should have a say in proportion to how much they are affected.
      *   *Changes Required:*
          1.  **Non-Citizens:** Would likely get national voting rights if national laws affect them (which they do). The 5-year local limit would vanish.
          2.  **Teens:** If they are affected by school laws/city planning, they should get full votes, not half. The "capacity" restriction would be removed unless "affectedness" includes "capacity to understand," which is a stretch.
          3.  **Compulsory Voting:** Might disappear. If voting is about protecting interests, you can waive that right. Duty is less central than interest protection.
          4.  **Boundaries:** Electoral boundaries would need to be fluid (functional constituencies) rather than fixed geographic municipalities.

  8.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Analytical, political theory-focused, precise.
      *   *Structure:*
          1.  Identify the Theory (Tiered Stakeholder/Civic Republican Hybrid).
          2.  Bundle vs. Affected Analysis.
          3.  The Teen/Elderly Consistency Check.
          4.  Reconstruction of Implicit View.
          5.  The Pure Affected-Interests Counterfactual.
      *   *Refinement on the "Half-Vote":* I need to be careful. The prompt says "teenagers sit on advisory boards where each vote counts half." This is likely referring to specific youth councils (e.g., in some Flemish municipalities), not general elections. I must clarify that this is advisory, not legislative, which mitigates the "equality" violation but highlights the "capacity" assumption.
      *   *Refinement on Compulsory Voting:* This is a key Republican element. It clashes with the Liberal "right to abstain."
      *   *Refinement on Elderly:* The prompt asks *why* the logic doesn't apply. I need to explain the *political* reason (ageism protections, individual assessment difficulty) vs the *theoretical* reason (developmental vs degenerative).

  9.  **Final Polish:** Check against all parts of the prompt.
      *   Theory identified? Yes.
      *   Bundle vs. Affected? Yes.
      *   Teen/Elder logic? Yes.
      *   Reconstruct view? Yes.
      *   Consistency check? Yes.
      *   Pure affected-interests model changes? Yes.

      *(Self-Correction during drafting)*: Make sure to distinguish between *national* citizenship and *local* residency. Belgium is a complex federal state, which makes the local/national distinction even more pertinent. The "half vote" for teens is usually in *youth councils*, not binding referendums. I should note that distinction to ensure accuracy. The prompt implies it's a municipal feature. I will treat it as described but contextualize it as advisory/participatory rather than sovereign voting to make sense of the "half" weight.

      *Wait, one nuance:* The prompt asks about "theory of political membership." I should name-drop relevant theorists or concepts (e.g., T.H. Marshall, Rainer Bauböck, All-Affected Principle).
      *Baoböck's "Stakeholder Citizenship"* is perfect for the non-citizen local voting.
      *Republican Duty* covers the compulsory aspect.
      *Developmental Democracy* covers the teen aspect.

      *Let's synthesize:* The implicit theory is **"Civic Republicanism with Stakeholder Unbundling and Developmental Gradation."**

      *Consistency:* It's inconsistent regarding capacity (teens vs elderly) and duty (compulsory vs half-weight).

      *Affected-Interests Shift:* Would dissolve the citizen/non-citizen line and the age weight line.

      *Okay, ready to write.*
answer: |-
  This combination of policies presupposes a **hybrid theory of political membership** that blends **Civic Republicanism**, **Stakeholder Citizenship**, and **Developmental Democracy**. It does not adhere to a single coherent philosophical framework but rather operates on a pragmatic, tiered model of integration and obligation.

  Here is the reconstruction of the implicit view, an assessment of its consistency, and an analysis of how a pure "affected-interests" model would alter it.

  ### 1. The Implicit Theory: Tiered Stakeholder Republicanism
  The Belgian model treats political membership not as a binary status (citizen/non-citizen) but as a **multi-layered bundle of rights and duties** that can be unbundled based on different criteria.

  *   **Civic Republicanism (The Core):** Compulsory voting for citizens treats suffrage as a **civic duty** essential for the legitimacy of the state, not merely an individual right. This implies membership entails obligation.
  *   **Stakeholder Citizenship (The Local Layer):** Allowing non-citizens to vote locally after five years relies on the **principle of residency-based stakeholding**. It argues that being subject to the coercive power of local administration and contributing to the community (taxes, social life) grants a claim to participation, even without national belonging.
  *   **Developmental Democracy (The Age Layer):** The "half-vote" or advisory weight for teenagers presupposes that political agency is a **capacity that matures over time**. It views voting not just as interest aggregation, but as a pedagogical tool to socialize young people into the civic sphere.

  **Bundle vs. Affected Interests:**
  The system treats citizenship primarily as a **bundle that can be split**, rather than a pure "affected-interests" model.
  *   *Evidence:* If it were purely "affected interests," non-citizens affected by *national* laws (taxation, war, healthcare) would vote nationally, not just locally. By restricting non-citizen voting to the *local* level, Belgium maintains that **national sovereignty** is tied to legal citizenship (the bundle), while **local governance** is tied to residency (the affected interest).
  *   *Evidence:* The teen "half-vote" suggests rights are modulated by capacity, not just affectedness. Teens are affected by local rules, but their "share" of the decision is weighted by their perceived developmental stage.

  ### 2. The Teen/Elderly Consistency Problem
  You asked why the logic of "developing rational capacity" applies to teens but not the elderly facing cognitive decline. This is the point of greatest theoretical friction.

  **The Implicit Justification:**
  The system relies on a **categorical vs. individual distinction**.
  *   **Teens:** Youth is viewed as a *universal developmental stage*. All 16-year-olds are presumed to be in a phase of acquiring competence. The "half-weight" is often framed as **pedagogical** (learning to vote) rather than purely epistemic (knowing how to vote). It is forward-looking socialization.
  *   **Elderly:** Cognitive decline is viewed as an *individual medical contingency*, not a universal categorical stage of citizenship. While aging is universal, significant incapacity is not. To apply a blanket reduction based on age would violate **equality principles** and constitute age discrimination.

  **Is it Consistent?**
  **No.** It is theoretically inconsistent.
  1.  **Capacity Proxy:** If the justification for weighting votes is rational capacity, age is a crude proxy for both youth and old age. Excluding one group while protecting the other relies on a cultural bias that values *potential* (youth) over *history* (elderly).
  2.  **Duty vs. Weight:** Compulsory voting implies every citizen has an equal duty to uphold the republic. If a teen is forced to vote (or strongly encouraged) but their vote counts for "half," there is a mismatch between **obligation** (which is full) and **agency** (which is partial). You cannot have equal duty with unequal power without violating the reciprocal logic of Republicanism.

  ### 3. Reconstruction of the Implicit View
  If we formalize the implicit normative view of the Belgian system, it looks like this:

  1.  **Political Community is Multi-Level:** The "Demos" is not one thing. The *National Demos* is defined by legal citizenship and shared destiny. The *Local Demos* is defined by shared space and daily impact.
  2.  **Integration is Gradual:** Membership is earned through time (5 years residency) and maturity (age). Rights are unlocked in stages to ensure stability and socialization.
  3.  **Voting is Dual-Natured:** Voting is both a **mechanism of preference aggregation** (protecting interests) and a **mechanism of civic formation** (building character). The teen policy prioritizes the latter; the non-citizen policy prioritizes the former.
  4.  **Stability Trumps Purity:** The system accepts theoretical inconsistencies (like the teen/elderly asymmetry) to avoid the administrative nightmare of competence testing and the political instability of expanding the national franchise too quickly.

  ### 4. Switching to a Pure "Affected-Interests" Model
  If Belgium replaced this hybrid model with a pure **All-Affected Principle (AAP)**—where anyone affected by a decision has a right to participate in proportion to that effect—three radical changes would occur:

  **A. Dissolution of the Citizen/Non-Citizen Boundary**
  *   **Current:** Non-citizens vote locally only.
  *   **AAP Change:** Non-citizens would likely gain **national voting rights**. National laws on taxation, environment, and foreign policy profoundly affect long-term residents. Under AAP, the "5-year local" compromise is arbitrary. If you are subject to the law, you vote on the law. Citizenship would become irrelevant for suffrage; residency or even mere presence might suffice.

  **B. Elimination of Age-Weighting**
  *   **Current:** Teens get half-weight/advisory status based on capacity.
  *   **AAP Change:** Teens would get **full votes**. The AAP generally ignores *competence* and focuses on *interest*. A child is profoundly affected by school policy, climate policy, and urban planning. Unless the model includes a "competence threshold" (which AAP usually avoids to prevent exclusion), the "half-vote" is discriminatory. If a policy affects a 15-year-old's future as much as an 80-year-old's, their vote should weigh the same.

  **C. Fluid Electoral Boundaries**
  *   **Current:** Fixed municipalities and national districts.
  *   **AAP Change:** Electoral constituencies would become **functional and fluid**. If a decision is about a river, voters should be everyone in the watershed, regardless of municipal lines. If a decision is about a train line, voters should be everyone who uses it. The fixed "municipality" as the unit of local democracy would dissolve into issue-specific constituencies.

  ### Summary
  The Belgian model presupposes that **citizenship is a graduated status** where rights are unbundled to manage integration and socialization. It is **inconsistent** regarding capacity (teens vs. elderly) and the relationship between duty and power (compulsory vs. half-vote). It prioritizes **social cohesion** over philosophical purity. A pure **affected-interests model** would dismantle the link between nationality and voting, grant full suffrage to minors, and destabilize fixed geographic boundaries in favor of functional stakes.
