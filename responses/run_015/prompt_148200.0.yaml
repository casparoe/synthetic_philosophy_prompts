answer: |-
  Dear Colleague,

  This is an exceptionally sharp formulation of a difficulty that often lurks in the background of value theory but is rarely brought into the foreground with such precision. You have moved past the standard Heterogeneity Objection (what makes these things *all* pleasures?) to a second-order problem regarding the *metric* of pleasure once that unity is established.

  To answer your primary question directly: **No, there is no single, canonical proper noun for this specific trade-off.** It is not "The Gettier Problem" of hedonism. However, it is a recognized and serious facet of what is generally termed **The Measurement Problem for Attitudinal Hedonism**.

  While the literature discusses the components of your worry, your specific framing—the idea that the *unifier's inclusivity is purchased at the cost of its discriminability*—does not have a settled label. If you are looking for existing terminology to anchor your seminar, you are operating within the debate between **Phenomenal** and **Attitudinal** accounts of pleasure (most notably Fred Feldman's *Pleasure and the Good Life* vs. Chris Heathwood's work). Feldman, defending attitudinal hedonism, acknowledges the difficulty of measuring intensity but insists we have direct introspective access to it. Your argument suggests that this "access" is illusory and actually relies on extrinsic proxies.

  Since you invited a christening should the territory be unmarked, I propose you call this **The Proxy Metric Problem** (or, more formally, **The Extension-Metric Trade-off**).

  Here is the breakdown you requested for your seminar:

  ### 1. Definition
  **The Proxy Metric Problem** arises when a functional or structural definition of pleasure (e.g., "taking pro-attitude toward X") succeeds in achieving *extensional adequacy* (covering ice water, proofs, and malice) but fails to provide an *intrinsic metric* for intensity. Consequently, any comparison of magnitude between distinct pleasures must "borrow" a scale from outside the definition (e.g., desire strength, objective importance, or duration), rendering the hedonic label redundant for the purpose of aggregation or maximization.

  ### 2. Neighbouring Phenomena (Distinctions)
  You were correct to anticipate misunderstanding. Here is how to draw the edges:

  *   **Vs. The Heterogeneity Objection:** The Heterogeneity Objection claims there is *no* common property linking sensory and intellectual pleasures. Your point accepts that a thin common property (e.g., "being pleased that") exists but argues it is *too thin* to do the work required of it (ranking).
  *   **Vs. Incommensurability:** Incommensurability claims two values *cannot* be compared. You are claiming they *are* compared, but the comparison is not tracking a hedonic property; it is tracking a proxy (like desire strength). The error is in *what* is being measured, not *whether* it can be.
  *   **Vs. The Experience Machine:** That objection concerns the *value* of pleasure relative to other goods (truth, reality). Your concern is internal to the theory of pleasure: even if pleasure were the only good, we lack a coherent way to sum it up.
  *   **Vs. Diminishing Marginal Utility:** Your ice water example touches on this, but the problem is deeper. Diminishing utility explains why the *second* swallow is less pleasurable. Your point is that the *metric* for the first swallow's pleasure isn't hedonic intensity, but the relief of a deficit.

  ### 3. The Verdict: Is this a Defect?
  This is the crux of your seminar discussion. I argue **yes, it is a fatal defect for Maximizing Hedonism**, though perhaps survivable for Satisficing Hedonism.

  **The Argument for Defect:**
  If the comparison of pleasures relies on proxies (desire strength, importance of the object), then Hedonism collapses into **Desire Satisfactionism** or an **Objective List Theory**.
  *   If I rank the pleasure of the proof higher than the ice water because "math matters more," I am no longer ranking by *pleasure*; I am ranking by *value*, and using pleasure as a mere vessel.
  *   If I rank the malice lower than the water despite a stronger desire because "malice is base," I am importing a moral metric external to the hedonic state.
  *   **The Redundancy Conclusion:** If we must look outside the pleasure to rank the pleasure, the concept of "pleasure" drops out of the maximization equation. We might as well maximize the proxies directly.

  **The Counter-Argument (The Defense):**
  A defender of Attitudinal Hedonism (like Feldman) might argue that the "proxy" is actually a **heuristic for a phenomenal intensity we cannot easily describe**. They would claim that when you say the proof matters *more*, you are describing a higher intensity of attitudinal pleasure, even if it lacks sensory "zing." They would argue the trade-off is not a defect but a feature: the thinness allows for a universal currency, and the "borrowed scale" is simply how humans access that currency introspectively.

  **My Recommendation:**
  Press the **Redundancy Conclusion**. If the "hedonic calculus" requires non-hedonic weights to function, it is not a hedonic calculus. Your three cases (satiation, consummation, malice) demonstrate that the *direction* of the desire (to continue, to complete, to harm) diverges from the *magnitude* of the pleasure, breaking the link between the definition of the state and its contribution to well-being.

  If you do christen this, I strongly endorse **The Proxy Metric Problem**. It captures the parasitic nature of the comparison without denying the possibility of comparison itself.

  I hope this provides the traction you need for the seminar. It is a compelling line of critique.

  Yours,

  [Your Name/Title]
