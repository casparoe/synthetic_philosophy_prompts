answer: |-
  Question 1. The separateness of persons objection is often stated as the claim that utilitarianism treats society as a single super-person. However, this obscures a distinction between two claims: (i) that it is illegitimate to aggregate benefits and burdens across persons into a single total, and (ii) that a correct principle must be sensitive to how benefits and burdens are distributed across persons. Consider the following two cases. Case A: You can prevent one stranger from suffering a severe burden (a broken leg) or instead prevent a million strangers from each suffering a barely perceptible burden (a pinprick), where the summed burden of the pinpricks is stipulated to be larger than the broken leg. Case B: You can save five people from severe harm only by imposing a trivial, unconsented cost (a bruised finger) on a sixth person.

  Utilitarianism implies choosing the greater sum in both cases. A strict anti-aggregation view implies protecting the one in Case A, but may also forbid imposing the trivial cost in Case B.

  (a) Explain why claim (ii) does not bite against utilitarianism, whereas claim (i) does.
  (b) Propose a minimal principle that yields the intuitive verdict in Case A (protect the one) and Case B (impose the trivial cost). Explicitly name which attractive claim this principle surrenders.
  (c) A reductionist about personal identity argues that person-boundaries are like national borders: matters of degree based on psychological continuity, not deep metaphysical facts. How does this challenge your principle?
  (d) Apply the Mirror Test to your principle: imagine the burdens in Case A and Case B falling to a single person over time rather than across different people. Does your principle change its verdict? If yes, explain what makes the interpersonal case relevantly different without simply asserting 'they are different people.' If no, accept the intrapersonal result.

  ***

  A defensible ethics must permit aggregation across persons only when individual burdens exceed a threshold of significance, surrendering the claim that every individual veto is absolute.

  To understand why this principle is necessary, we must first disentangle the two claims embedded in the separateness of persons objection. Claim (ii) requires sensitivity to distribution. Utilitarianism can happily grant this; it cares about distribution instrumentally because diminishing marginal utility means equal distribution often maximizes the total. However, claim (i) asserts the illegitimacy of the aggregation itself. This bites because utilitarianism fundamentally relies on summing utilities across distinct agents to determine right action. If claim (i) holds, the mathematical operation utilitarianism performs is morally forbidden, regardless of the distributional outcome. Therefore, a successful objection must rest on (i), not (ii).

  However, adopting claim (i) strictly creates a dilemma illustrated by Cases A and B. In Case A, intuition suggests we should not break one person's leg to save a million pinpricks, even if the sum of pain is greater. This supports strict non-aggregation. Yet in Case B, intuition suggests we should bruise one finger to save five lives. Strict non-aggregation forbids this, implying an absolutist veto where no cost can be imposed without consent, regardless of the stakes. This is too strong. Conversely, utilitarianism is too weak, permitting the leg-breaking in Case A. We need a middle path.

  The minimal principle that navigates this is Threshold Prioritarianism. We should prioritize the worst-off, but aggregation is permitted once individual burdens cross a threshold of severity. In Case A, the leg represents a severe burden above the threshold, while pinpricks are below it; burdens below the threshold cannot aggregate to override those above it. In Case B, the five lives are above the threshold, and the bruised finger is below it; here, the severe burdens aggregate to override the trivial one. This principle gets both verdicts right. However, it surrenders an attractive claim: the absolute inviolability of the person. It admits that an individual can be sacrificed for the greater good, provided their burden is trivial relative to the others' severe harms. We lose the comfort of knowing we are never merely a means, but we avoid the absurdity of letting five die to save a finger.

  This principle faces a challenge from reductionism about personal identity. If persons are merely sequences of psychological and physical continuities, like nations or clubs, then the boundary between persons is no more metaphysically deep than the boundary between temporal stages of a single person. If we aggregate across temporal stages (saving my future leg by bruising my current finger), why not across persons? The reductionist argues that if continuity admits of degrees, strict person-boundaries cannot support the strict non-aggregation required for Case A. If the connection between me-now and me-tomorrow is weak, why does it matter more than the connection between me and you?

  To answer this, we must apply the Mirror Test. Imagine Case A intrapersonally: one future stage of a person suffers a broken leg, while a million earlier stages suffer pinpricks. Rational prudence suggests the person should accept the pinpricks to avoid the leg break. Imagine Case B intrapersonally: five future stages survive only if one earlier stage suffers a bruised finger. Prudence dictates accepting the finger bruise. In both intrapersonal cases, aggregation is rational. If our principle changes verdicts interpersonally, we must identify a difference-maker beyond tautology.

  The difference-maker is the unity of consciousness. Even if reductionism is true and boundaries are matters of degree, the degree of continuity within a life is typically far higher than between lives. Within a life, sacrifices are compensated by benefits to the same conscious subject. Interpersonally, the loser does not experience the winner's gain. Therefore, while we permit aggregation across persons in Case B, we require a higher threshold than in the intrapersonal case. We accept that person-boundaries are not metaphysically deep, but they mark significant drops in psychological continuity that justify stronger protections than temporal boundaries. Thus, the Mirror Test reveals that while the logic of aggregation applies in both domains, the threshold for overriding individual interests must be higher between persons than within a life. This preserves the core insight of the separateness of persons without succumbing to the absolutist veto that would forbid saving five lives to spare a finger. We acknowledge that persons are separate, but not so separate that trivial interests trump severe harms.

  ***

  The primary discriminator between an A and a B answer is the explicit identification of the specific attractive claim surrendered to resolve the aggregation dilemma.

  1.  **Distinguishing the Claims (4 marks):** Award marks for explaining that utilitarianism accepts distributional sensitivity (ii) instrumentally but relies on cross-person aggregation (i) fundamentally. *Typical error:* Students claim utilitarians ignore distribution entirely rather than subordinating it to the total.
  2.  **Resolving the Dilemma (4 marks):** Award marks for proposing a threshold or moderate aggregation principle that protects the leg in Case A but allows the finger sacrifice in Case B. *Typical error:* Proposing a strict veto that forbids the finger sacrifice in Case B alongside the leg break.
  3.  **Identifying the Surrendered Claim (4 marks):** Award marks for explicitly naming the loss of absolute inviolability or the absolute veto on unconsented costs. *Typical error:* Stating the principle without identifying what moral comfort or claim is sacrificed to achieve it.
  4.  **Handling Reductionism (4 marks):** Award marks for acknowledging that reductionism weakens the metaphysical weight of person-boundaries while maintaining they mark significant discontinuities. *Typical error:* Dismissing reductionism entirely rather than explaining how the principle survives the weakening of boundaries.
  5.  **Mirror Test Application (4 marks):** Award marks for applying the principle intrapersonally and identifying unity of consciousness or compensation within a life as the difference-maker. *Typical error:* Asserting "they are different people" as the difference-maker without explaining the moral relevance of that fact.

  *Note on Tempting Inference:* Candidates often lose marks by assuming the objection forces a choice between utilitarian compatibility and an absolutist veto, failing to articulate a moderate aggregation principle that navigates between them.
