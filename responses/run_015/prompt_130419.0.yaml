answer: |-
  **Conceptual Issue: The Precedential Void in Paradigm Stabilization**

  **The Scenario**
  Consider a specific borderline case: *Codex Theta*, a manuscript where the ink chemistry matches the era, but the syntax contains anachronisms, and the paper fiber is inconclusive. Under the community's family-resemblance practice, *Codex Theta* is a "wavering case"—its classification depends on weighing the overlapping features against the specific purpose of the restoration (e.g., historical record vs. aesthetic display).

  The archivist declares *Codex Theta* "Authentic" solely based on "the resonance." She then files *Codex Theta* in the archive as a **paradigm case** of authenticity. Future junior archivists, trained on the family-resemblance model, are taught to look at paradigm cases to learn how to weigh features in new, ambiguous situations. However, when they examine *Codex Theta*, they cannot access the "resonance." They see only the public features (matching ink, odd syntax).

  **The Conceptual Problem**
  The issue is that **family resemblance concepts rely on the public traversability of the "chains of similarity" to stabilize meaning over time.**

  In Wittgenstein's model, a concept like "authentic restoration" is not held together by a core essence, but by overlapping similarities that allow users to move from clear cases to borderline cases (PI §66–67). This movement requires that the links in the chain be publicly accessible. By inserting a private criterion ("resonance") to resolve a borderline case, the archivist creates a **normative dead end**.

  1.  **Breakdown of Calibration:** Family resemblance requires *Übereinstimmung der Urteile* (agreement in judgments) not merely as a consensus of opinion, but as a precondition for the language-game to function (PI §242). The community agrees on what counts as a similarity. When the archivist overrides the public weighting of features with a private sensation, she severs the link between the *judgment* and the *public grounds* for that judgment.
  2.  **The Precedential Void:** In a practice-based language game, past decisions serve as rules for future applications. If *Codex Theta* is labeled "Authentic," it should guide future restorations (e.g., "This new fragment is like *Theta*, so we should prioritize ink over syntax"). But because the deciding factor (resonance) is incommunicable, *Codex Theta* cannot function as a rule. It becomes an isolated data point that cannot extend the concept.

  **Implications for Family Resemblance and Private Language**
  This issue illuminates that family resemblance cannot accommodate an irreducibly private standard without collapsing, for two distinct reasons:

  *   **Structural Collapse:** Family resemblance is a structural account of how public concepts maintain coherence without essences. It depends on the *visibility* of the overlapping fibers. A private fiber is, structurally speaking, no fiber at all. If the archivist's "resonance" is accepted, the concept "authentic" ceases to be a family-resemblance concept (woven from public practices) and becomes a disjunctive concept ("public criteria OR whatever the archivist feels"). This destroys the grammatical cohesion of the term.
  *   **The Rule-Following Paradox:** This scenario avoids the *Beetle-in-a-box* trap (which focuses on the reference of sensation-words) by focusing on the **normativity of classification**. The problem isn't that we don't know what "resonance" refers to; the problem is that "resonance" cannot function as a **criterion of correctness**. As Wittgenstein argues in PI §202, "obeying a rule" is a practice that inherently involves the possibility of checking. By using a private marker to override public criteria, the archivist places herself outside the space of reasons. She is not playing the language-game of "restoration"; she is playing a solipsistic game that merely mimics the public output.

  **Conclusion for Your Paper**
  The "Precedential Void" demonstrates that family resemblance is not merely a description of how features overlap, but a description of how **public agreement stabilizes those overlaps**. A private standard cannot sustain the concept because it prevents the concept from being taught, corrected, or extended. Thus, the introduction of "the resonance" does not expand the family-resemblance structure; it dissolves the grammar of "authenticity" entirely, reducing the archivist's pronouncements to mere expressions of feeling (like crying out in pain) rather than truth-claims within a language-game.
