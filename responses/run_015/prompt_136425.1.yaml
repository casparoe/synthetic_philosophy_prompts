answer: |-
  **WARNING ON SCOPE:** You are a high school junior. You are not a clinician. The procedure below is designed to **minimize harm** and **gather data for a supervisor**, not to make final clinical diagnoses. If a student indicates immediate danger to themselves or others, the 20-minute clock stops instantly. You are a reporter, not a triage officer.

  Here is the **Descriptive Handoff Protocol (DHP)**. It is designed to document behavior without cementing identity.

  ### The Procedure (20 Minutes Max)

  **Phase 1: The Pre-Chat Label Audit (2 Minutes)**
  *Before you see the student, look at the file.*
  1.  **List existing labels:** Write down every diagnosis, IEP category, or teacher comment already attached to this student (e.g., "ADHD," "Disruptive," "Emotional Disturbance").
  2.  **Predict the Script:** Write down one sentence on how you expect them to act based *only* on those labels.
  3.  **The Blank Slate Rule:** You must consciously discard that prediction before entering the room. If you cannot, hand off immediately.

  **Phase 2: The Descriptive Interview (15 Minutes)**
  *Ask these questions in order. Do not use clinical terms (e.g., say "hard time" not "symptom").*
  1.  **The Timeline:** "When did you first notice this was happening? When did an adult first *tell* you it was a problem?"
      *   *Goal:* Establish if behavior preceded the label.
  2.  **The Context:** "Does this happen everywhere, or only when specific people are watching or specific rules are in place?"
      *   *Goal:* Identify situational looping.
  3.  **The Function:** "What happens right after you do the thing? Do you get sent home? Do you get to leave the room? Do people stop asking you to work?"
      *   *Goal:* Identify secondary gains (reinforcement).
  4.  **The Identity Check:** "Do you think you *are* this way, or do you think you *do* this because of what's going on around you?"
      *   *Goal:* Gauge internalization of the label.
  5.  **The Drift Question:** "If nobody called it [Insert Label from Phase 1] tomorrow, would you still do the thing?"

  **Phase 3: The Threshold Check (3 Minutes)**
  *Review your notes against these hard stops.*

  *   **STOP & HANDOFF IMMEDIATELY (Safety Override):**
      *   Any mention of self-harm, suicide, or harm to others.
      *   *Reasoning:* Safety overrides looping theory. You cannot interview risk.
  *   **HIGH LOOPING RISK (Handoff Recommended):**
      *   If the behavior started *after* the label was applied **AND** only happens in contexts where the label is enforced.
      *   *Action:* Refer to counselor with note: "Potential label reinforcement observed."
  *   **VALUES CALL (Handoff Recommended):**
      *   If the student is failing/withdrawing but rejects the label.
      *   *Reasoning:* Functional impairment exists regardless of label acceptance.
  *   **NORMAL STRESS (Document & Close):**
      *   Behavior predates label, happens in all contexts, no safety risk, student has coping strategies.

  ### Where Judgment Cannot Be Removed (The Failure Point)
  **The "Harm" Definition:** The procedure cannot define "harm" for you. Deciding if a grade drop is "falling apart" or "normal struggle" is a values call based on school culture and your supervisor's risk tolerance. You cannot algorithm this. You must own that bias.

  ---

  ### Application to Your Three Cases

  #### Case 1: The Freshman (Self-harm + IEP Update)
  *   **Protocol Run:**
      *   **Phase 1:** Label is "Emotional Disturbance."
      *   **Phase 2:** You ask Question 1. She says self-harm started *after* the IEP meeting.
      *   **Phase 3:** You hit the **Safety Override**.
  *   **The Answer You Won't Like:** Your philosophical worry about looping is irrelevant here. The protocol dictates you **stop talking and call the counselor immediately.** Do not finish the 20 minutes. Do not analyze the drift.
  *   **Why:** Physical safety trumps sociological theory. If you try to analyze the "looping" of self-harm in a 20-minute chat, you are neglecting duty of care. The procedure forces you to ignore the Hacking theory in favor of immediate protection.

  #### Case 2: The Sophomore (ADHD + Situational Restlessness)
  *   **Protocol Run:**
      *   **Phase 1:** Label is "ADHD."
      *   **Phase 2:** Question 2 (Context) reveals he sits still at home and in art class. It only happens in classes where teachers mention his ADHD. Question 5 (Drift) reveals he started fidgeting more *after* the diagnosis was shared with teachers.
      *   **Phase 3:** This hits **High Looping Risk**.
  *   **The Output:** Refer to counselor, but your note must read: *"Behavior appears contingent on teacher expectation of label. Recommend observing classroom dynamics before medical adjustment."*
  *   **Why:** This is the classic looping effect. The category ("ADHD kid") is driving the behavior in specific social contexts. The procedure catches the drift.

  #### Case 3: The Senior (Refusing Label + Failing)
  *   **Protocol Run:**
      *   **Phase 1:** No label yet.
      *   **Phase 2:** Question 4 (Identity) shows strong rejection ("I'm not sick"). Question 1 (Timeline) shows decline started months ago.
      *   **Phase 3:** This hits **Values Call**.
  *   **The Output:** Refer to counselor.
  *   **Why:** You might want to respect their autonomy and not "label" them. The procedure forces your hand: Functional impairment (falling apart) requires support regardless of whether they accept the category.
  *   **The Risk:** If you don't refer them because they "refuse the label," you are prioritizing their identity politics over their academic/mental survival. The procedure flags this as a mandatory handoff.

  ### Summary of Failure Points
  1.  **The Freshman:** The procedure fails your desire to apply philosophy to *everything*. It forces a bureaucratic safety shutdown.
  2.  **The Judgment Gap:** You cannot remove your own bias on what counts as "falling apart" (Case 3). If you think failing is normal, you won't refer. If you think it's a crisis, you will. The form doesn't fix that; only your supervisor can.
  3.  **The Volunteer Limit:** You are part of the system causing the loop. The procedure minimizes it, but your presence in that office with that form is already a "kind-making" institution. Acknowledge that you are a data point in their loop, not just an observer of it.
