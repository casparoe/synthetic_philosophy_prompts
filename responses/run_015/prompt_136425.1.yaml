prompt: |-
  hey so im a junior and i volunteer at my schools student support office like twice a week after class, and they have me do these intake chats with kids who get sent there for being disruptive or withdrawn and i have to write up whether its just normal teen stress or if they need an actual clinical referral. i read this thing by the philosopher Hacking about looping effects where putting someone in a category makes them start acting more like that category, and now im worried that when i check boxes on the form im actually creating the problem instead of spotting it. can you turn that idea into a real step-by-step procedure i could actually run in like 20 minutes with no psych degree? i need the questions in order, what answer counts as enough to stop and call the real counselor, where the looping risk is so high the procedure should just hand off immediately, and where its clearly a values call not a fact. also build in this thing i started calling label drift, where the category itself slowly shifts as kids adapt to it, so the procedure checks whether the label still describes the original behavior or has become a self-fulfilling script.

  apply it to three cases: a freshman who started self-harming right after her IEP got updated with emotional disturbance, a sophomore who says he cant sit still but only in classrooms where teachers already warned him about ADHD, and a senior who refuses every label but is clearly falling apart. the procedure should give an answer i wont like in at least one case, and it needs to flag exactly where my own judgment cant be removed. i dont need citations or a bibliography, just the actual steps and the failure point.
