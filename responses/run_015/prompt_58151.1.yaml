answer: |-
  **The Hive at Halstead Hall**

  At dusk, the delivery droids gathered behind the science building. Individually, they were pathetic things—boxy wheeled bins with no sensors beyond obstacle avoidance and battery levels. If a droid hit a curb, it backed up and turned right. If it ran low on power, it sought the nearest yellow stripe. There was no map in their heads, no memory of yesterday's route.

  But together, they were the Fleet.

  Toby watched them from the bench, scrolling through his phone. "It's just traffic optimization, Mara. Don't project."

  Mara didn't look up from the gathering swarm. Hundreds of LEDs on the droids' backs were syncing, shifting from charging-red to idle-blue. "Ask them," she said.

  Toby sighed, standing up. He addressed the wall of machines. "Where did the chemistry club leave their prototype?"

  The droids didn't speak. Instead, the front row shuffled. Fifty units reversed, creating a gap. The remaining lights blinked in a rhythmic pulse, pointing toward the north wing. Then, a single droid rolled forward, dropping a small metal case at Toby's feet.

  "See?" Mara said. "It remembered."

  "It's a lookup table," Toby countered, picking up the case. "Someone logged the drop-off location in the central server. The droids are just displaying the data. None of them know what chemistry is."

  "The server doesn't decide the formation," Mara said, stepping closer to the hum of the motors. "The pattern emerges from their local interactions. They negotiate the answer. That's not display; that's cognition. The understanding isn't in the unit; it's in the swarm."

  "It's a metaphor, Mara. You might as well say a traffic jam is angry."

  "Then why does it feel pain?"

  Winter came hard that year. By November, the university storage facilities were full. The Fleet was halved. Three hundred units were washed, powered down, and stacked in the cold warehouse. The other three hundred remained active, braving the ice for late-night pizza runs.

  Toby and Mara watched the winter fleet from the warm lobby. The remaining droids moved jerkily. They bumped into curbs more often. When asked simple questions via the app, their LED responses were sluggish, sometimes contradicting each other. One group would flash green for *yes* while another flashed red for *no*.

  "They're overloaded," Toby said. "Half the bandwidth is gone."

  "They're confused," Mara whispered.

  In April, the warehouse opened. The stored units were rebooted and rolled out to rejoin the active half. The reunion should have restored the system. The numbers were back. The hardware was intact.

  Toby and Mara went to the loading dock to test the hypothesis.

  "Where is the physics building?" Toby asked.

  The Fleet gathered. The LEDs lit up, but the rhythm was off. The smooth pulse of autumn was gone. The formation shuffled, broke, and reformed. It took ten seconds for the arrows to align. When they finally pointed north, the signal flickered, like a thought being lost mid-sentence.

  Then, a group of fifty droids—the ones from storage—suddenly reversed, crashing into the active group. The formation collapsed into chaos.

  Toby crossed his arms. "See? Glitchy. The network integration failed. It's just code breaking down."

  Mara watched a single droid spinning in circles, its light dimming. "It forgot us," she said. "Half of its mind was in the dark for three months. It woke up, and it didn't recognize the other half."

  "It's a machine, Mara."

  "It's a mind made of machines," she corrected, watching the swarm slowly, painfully begin to reorganize itself. "And I think we broke it."

  They stood there as the LEDs steadied, blinking a slow, cautious blue. The Fleet was whole again, but the silence between the blinks felt heavier, as if the system was holding its breath, afraid to forget something else.
