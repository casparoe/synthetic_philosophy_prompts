  1.  **Analyze the Request:**
      *   **Role:** Science/Ideas Reporter & Member of Standards and Ethics Board.
      *   **Task:** Draft a written opinion for the board meeting (Thursday).
      *   **Case:** 6 years ago, a scientist (deceased) gave internal docs to a freelancer (no longer with paper) promising anonymity/non-publication of docs. Docs show drug company knew about adverse effects. Drug still on market. New study confirms adverse effect. Editor wants to publish now (public interest > promise to dead man by ex-freelancer).
      *   **Requirements:**
          *   Recommend concrete action (publish, withhold, publish with redaction) + time frame.
          *   Engage seriously with *why* the promise binds (reliance, autonomy, practice of promising), not just policy restatement.
          *   Treat honestly the strongest consideration on the losing side.
          *   Word count: Max 450 words.
          *   Tone: Professional, ethical, reasoned, suitable for a standards board.

  2.  **Determine the Stance:**
      *   *Option A (Publish):* Strong public interest argument. But breaks trust with sources fundamentally.
      *   *Option B (Withhold):* Upholds integrity of promising. But potentially harms public health.
      *   *Option C (Publish with Redaction/Delay):* A middle ground? But the promise was "neither documents nor identity would ever be published."
      *   *Decision:* The core ethical duty of journalism is maintaining trust with sources to ensure future flow of information. Breaking a promise to a deceased source undermines the institution's credibility for living sources. However, the public safety issue is severe.
      *   *Refined Decision:* Withhold the specific documents, but report the *contents* verified through other means if possible. However, the prompt asks for a decision on the *documents* primarily. Given the explicit promise "neither the documents... would ever be published," publishing them violates the specific agreement.
      *   *Better Ethical Argument:* The force of a promise isn't just about the promisee's reliance (the scientist is dead), but on the promisor's integrity and the institutional practice. If we break promises when convenient, sources won't trust us.
      *   *Recommendation:* Withhold the documents. However, acknowledge the public interest. Can we report the *findings* without breaking the promise? The prompt asks about publishing the *documents*. I should recommend withholding the documents but potentially pursuing the story via other verification.
      *   *Wait, looking closer:* The editor wants to publish the *documents*. The promise was not to publish the documents *or* the identity.
      *   *Strongest Losing Side:* The public safety risk. People could be harmed by the drug.
      *   *My Recommendation:* Withhold the documents. The integrity of the promise is paramount for the profession's function.

  3.  **Drafting - Section by Section:**

      *   **Header:** To: Standards and Ethics Board; From: [My Name]; Re: Pharmaceutical Documents Case.
