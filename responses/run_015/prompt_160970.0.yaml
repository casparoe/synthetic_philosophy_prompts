  **JOINT MEMORANDUM**
  **FROM:** State Department of Education / District Office of Jurisdictional Review
  **TO:** All Faculty, Administration, and Student Bodies
  **RE:** Delegation of Dress-Code Authority (Subsidiarity Compliance Protocol 44)

  Effective immediately, the District adopts the Principle of Localized Competence. Pursuant to state statute, all regulatory decisions must be executed at the lowest jurisdictional level capable of executing them. Authority flows downward to the point of action; however, the power to certify which level is competent never flows downward. Higher bodies retain only the duty to assist.

  Regarding the classification of "Permissible Hooded Garments": The State Department has determined it lacks the specific context to adjudicate fabric choices for individual campuses. Therefore, authority is remitted to the District. The District, lacking granular data on individual torsos, remits authority to the Principal. The Principal, deferring to pedagogical proximity, remits authority to the Homeroom Instructor. The Instructor, recognizing student autonomy, remits authority to the Student.

  To prevent arbitrary decision-making, any body exercising delegated authority must possess a valid Certificate of Demonstrated Competence (CDC). The CDC is issued solely by the supervising body immediately above.

  **Procedure for Students:**
  1. The Student must submit a Hoodie Selection Plan to the Homeroom Instructor.
  2. The Instructor cannot approve the Plan until the Student holds a CDC.
  3. The Student earns a CDC by demonstrating competent decision-making regarding hoodies.
  4. Competence is demonstrated by submitting a valid, approved Hoodie Selection Plan.

  Until this circularity is resolved, the Student remains in a state of pending authority. During this interim, higher bodies must fulfill their duty to assist. Assistance is defined as compliance monitoring and procedural optimization. The State will assist the District by auditing the Student's wardrobe twice a semester using Form 12-B (Garment Suitability). The District will assist the Principal by conducting random locker inspections to verify storage compliance. The Principal will assist the Instructor by reviewing laundry logs to ensure garment hygiene meets state standards. These measures ensure the lowest level is supported, not directed, though support may require temporary suspension of privacy expectations.

  Please note: The State Department insists it has not mandated any specific clothing, but merely certified the process by which clothing is chosen. The District Office confirms it holds no authority over hemlines, only over the certification of those who judge hemlines. Consequently, no appeal may be filed against the policy, as no single entity retains final decision-making power. The State assists the District, the District assists the School, and the School assists the Student, who remains responsible for compliance without access to the authority required to comply. Liability for incorrect hoodie selection rests with the Student. Liability for incorrect CDC issuance rests with the Instructor. Liability for incorrect auditing rests with the State. Since the Student cannot select without CDC, and the Instructor cannot certify without selection, liability remains in abeyance.

  Questions regarding jurisdiction should be directed to the Office of Jurisdictional Review. Questions regarding the Office of Jurisdictional Review should be directed to the State Department. Questions regarding the State Department should be directed to the Student's closet.

  **Signed,**
  **Committee on Competence & Oversight**
