          *   *Rating:* Partially Correct / Debatable. It's intuitively appealing but philosophically shaky on the definition of "incommensurable." Let's call it *Plausible but Vulnerable*.
          *   *Refinement for Rating:* I need a scale. Let's use: Clearly Mistaken, Mostly Mistaken, Debatable/Mixed, Mostly Correct, Clearly Correct.
