      *   *Case 2 (L.):* Old conduct ("four years ago"), pre-CoC, no recurrence. **Result: Heard.** (Key factor: Time + Normative Shift + Reform).
      *   *Case 3 (M.):* Different provision/normative family (privacy vs. insults). **Result: Heard.** (Key factor: Specificity of Norm).
      *   *Case 4 (N.):* Complicity/Provocation ("egged the target on"). **Result: Declined.** (Key factor: Complicity/Causation - explicitly separated from hypocrisy in prompt, but relevant for boundary).
      *   *Case 5 (O.):* Past violation (19 months), sanctioned, apologized, no recurrence. **Result: Heard.** (Key factor: Accountability + Reform + Time).
      *   *Case 6 (P.):* Pending complaint against self. **Result: Declined (Procedural).** (Key factor: Docket Management, explicitly *not* standing).
      *   *Case 7 (Q.):* Past conduct judged *not* to violate code. **Result: Heard.** (Key factor: Innocence/Non-violation).

  3.  **Brainstorming Principles (Task a):**
      *   *Principle 1: The Clean Hands Doctrine (Strict).* You cannot blame for X if you have ever done X. (Ruled out by Cases 2, 5).
      *   *Principle 2: The Recency/Pattern Doctrine.* Standing is lost if the violation is recent or part of an ongoing pattern. (Fits 1, 2, 5, 7).
      *   *Principle 3: The Repentance/Reform Doctrine.* Standing is retained if the blamer has acknowledged wrongness, made amends, and reformed. (Fits 2, 5. Explains 1's failure).
      *   *Principle 4: The Normative Specificity Doctrine.* Standing is lost only if the past act violates the *same specific norm*. (Fits 3).
      *   *Principle 5: The Procedural Fairness/Equality Doctrine.* Standing is denied if hearing the case creates an asymmetry where the blamer is immune but the blamed is not. (Fits 1, 6).
      *   *Principle 6: The Moral Authority/Attitude Doctrine.* Standing depends on the blamer's current attitude toward the norm (do they respect it?). (Fits 1 vs 5).

      *Refining for Sharpness:* I need principles that can *come apart*.
      *   *P1: The Unresolved Violation Principle.* You lack standing if you have committed a relevant violation that remains unaddressed/unaccounted for by the community.
      *   *P2: The Hypocritical Attitude Principle.* You lack standing if your blame implies a superiority you do not possess (i.e., you don't actually endorse the norm you are invoking).
      *   *P3: The Protective Function Principle.* Standing is instrumental; we hear complaints that protect the community, regardless of the blamer's history, unless their history undermines the process.

  4.  **Analyzing Case R. (Task b):**
      *   *Facts:* 8 months ago (private), comparable seriousness, same provision. Unreported/Unsanctioned. Apologized privately to victim (6 months ago). Victim said no public action. R. disclosed voluntarily. R. claims reform. Victim is the only potential reporter.
      *   *Apply P1 (Unresolved):* R. violated the norm. It was never sanctioned by the committee. Technically "unresolved" by the *committee*, though resolved interpersonally. *Prediction: Decline.* (Like Case 1, unlike Case 5 where committee sanctioned).
      *   *Apply P2 (Attitude):* R. admits wrong, apologized, stopped. Shows endorsement of norm. *Prediction: Hear.* (Like Case 5).
      *   *Apply P3 (Protective):* If R. doesn't report, no one will (private channel, senior vs junior). Community protection requires hearing it. *Prediction: Hear.*

  5.  **Best Guess vs. Should Do (Task c):**
      *   *Best Guess:* Committees tend toward risk aversion and consistency with the "strictest" reading of Case 1. They might fear the appearance of favoritism if R. is heard despite an unsanctioned violation.
      *   *Should Do:* Hear it. Analogy is Case 5 (O.). O. was sanctioned; R. self-sanctioned/apologized. The key is the *reform*, not the committee stamp.
      *   *Principle:* "Reform and Acknowledgment restore Standing."

  6.  **The Unminuted Ruling (Task d):**
      *   *Status:* Informal, pre-committee membership for user. Not binding precedent.
      *   *Impact:* If treated as precedent, it pushes toward declining R. (like Case 1). If ignored, it highlights the inconsistency of the committee's informal vs. formal history. It suggests a "shadow doctrine" of strict clean hands that contradicts the formal record (Case 5).

  7.  **The Crucial Test Case (Task e):**
      *   Need to separate "Committee Sanction Required" vs. "Interpersonal Resolution Sufficient."
      *   *Variant:* R. did the act, apologized privately, *but the victim demands committee action now*. Or: R. did the act, nobody knows, R. reports someone else, then *later* the committee finds out about R.'s act.
      *   *Better Variant:* R. committed the act, apologized privately (as now), but *lies* about it when filing. vs. R. discloses (as now).
      *   *Best Separator:* A case where the blamer reformed *without* the committee's knowledge, but the committee finds out *during* the hearing. Does the lack of prior committee sanction matter more than the reform?
      *   *Let's refine:* Case S. Same as R, but the victim of S.'s past remark *demands* S. be sanctioned now that S. is filing.
      *   *P1 (Unresolved):* Decline S. (Violation unaddressed by committee).
      *   *P2 (Attitude):* Hear S. (S. still endorses norm).
      *   *P3 (Protective):* Hear S. (Unless S.'s sanction distracts).

  8.  **Structural Questions (Task f):**
      *   *Q1: Nature of Defect.* Is it wronging the blamed? Failure of speech act? Defect in relation to norm?
          *   *Analysis:* Hypocrisy usually attacks the *authority* to blame (speech act failure) or implies the blamer exempts themselves (relation to norm). It's rarely a wrong to the blamed (the blamed *did* the thing).
      *   *Q2: Reporting vs. Blaming vs. Waiver.*
          *   *Analysis:* Reporting is factual. Blaming is normative. If the committee acts *sua sponte*, standing is irrelevant. If the blamed waives, standing is less relevant (consent).
      *   *Q3: Enforcement Body Role.*
          *   *Analysis:* Committees are not moral agents in the same way individuals are. They are fiduciaries for the community. "Standing" for a committee is about *jurisdiction* and *efficacy*, not moral purity.

  9.  **Drafting the Response:**
      *   *Tone:* Professional, philosophical, analytical, empathetic but detached.
