          *   (f) Three structural questions (nature of defect, reporting vs. blaming, enforcement body's role).
      *   **Context:** Open-source project (2k contributors), Code of Conduct (CoC) enforcement.
      *   **Personal Stake:** The user was previously denied standing on similar grounds informally. They encouraged R. to come forward.

  2.  **Deconstruct the Precedents (Cases 1-7):**
