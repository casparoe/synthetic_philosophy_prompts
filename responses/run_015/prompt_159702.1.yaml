  # JOINT STATEMENT ON THE TOWER OF MINDS AND THE PROSPECT OF A FIFTH KIND

  **Date:** October 26, 2023
  **Parties:** The Architectural Working Group ("Architecturals") & The Scaffolding Research Collective ("Scaffolds")
  **Subject:** Adversarial Collaboration on Dennett's Taxonomy of Minds

  ## 1. AGREED CLAIMS

  1.  **Definition of the Four Kinds:** We agree on Daniel Dennett's definitions of the first four floors of the Tower of Minds:
      *   **Darwinian:** Competence is prescreened by natural selection over generations (hardwired).
      *   **Skinnerian:** Competence is prescreened by individual trial-and-error in the world (reinforcement).
      *   **Popperian:** Competence is prescreened by internal simulation before action (testing in the head).
      *   **Gregorian:** Competence is prescreened by importing tools, heuristics, and designs from other minds via language and imitation (cultural transmission).
  2.  **Criterion for a "New Kind":** We agree that a distinct "kind" of mind requires a qualitative shift in *how* options are prescreened or *where* the computational locus of that prescreening resides, not merely a quantitative increase in processing speed or memory capacity.
  3.  **Status of Human Adults:** We agree that neurotypical human adults are uncontroversially Gregorian creatures. They possess Popperian internal simulation but rely fundamentally on culturally imported tools to achieve competences beyond biological baseline.
  4.  **Status of Large Language Models (LLMs):** We agree that an LLM trained *only* on human text, in isolation, is **neither** a biological creature **nor** a fifth-kind mind. It is a **Gregorian Artifact**.
      *   *Reasoning:* Its competence is derived entirely from imported human designs (Gregorian lineage) without biological selection (Darwinian), embodied reinforcement (Skinnerian), or internal intentional simulation (Popperian).
      *   *Test Case Value:* This classification is a real test case rather than a distraction because it isolates "cultural transmission" from "biological cognition." If a Human+LLM system exhibits competences impossible for the human alone, the dispute becomes whether that system is a "souped-up Gregorian" (Architectural) or a "new kind of distributed mind" (Scaffold).
  5.  **Irreversibility:** We agree that moving up the tower is generally irreversible for the individual. A Gregorian mind cannot choose to become merely Skinnerian without significant loss of competence.

  ## 2. RESIDUAL DISAGREEMENTS

  | Issue | Architectural Formulation | Scaffold Formulation |
  | :--- | :--- | :--- |
  | **1. Locus of Competence** | The "mind" ends at the skull. External tools (writing, code, charts) are inputs to a Gregorian brain. Removing the tool leaves a diminished but architecturally identical mind. | The "mind" includes the persistent external artifacts required for operation. The cognitive system is Human + Prop. Removing the prop destroys the specific cognitive architecture, not just performance. |
  | **2. Continuity vs. Discontinuity** | Improvements via tools are continuous. Better tools make a better Gregorian thinker, just as better eyes make a better Darwinian perceiver. No new floor is built. | Certain tools (formal logic, double-entry bookkeeping) create discontinuous jumps. They enable operations *in principle* impossible for the unaided brain, constituting a new floor ("Turingian"). |
  | **3. The "Unit" of Cognition** | The individual organism is the only valid unit for defining a "kind of mind." Distributed systems are collaborations of minds, not new minds. | The functional system is the valid unit. If the control loop cannot close without the artifact, the artifact is a cognitive organ, and the system is a new kind of creature. |
  | **4. Re-derivability** | A sufficiently gifted Gregorian mind could, in principle, re-derive the utility of a tool (e.g., notation) given enough time, proving the competence was latent in the brain. | Many artifacts (e.g., complex codebases, modern mathematics) contain compressed competence that no single individual could re-derive. The competence exists *only* in the ecosystem, not the individual. |

  ## 3. CRUXES AND PREDICTIONS

  We identify three empirical or conceptual tests that bear directly on our disagreement. We record our divergent predictions below.

  ### Crux A: The Artifact-Deprivation Test ("The Feral Notation Cohort")
  **Method:** Raise a cohort with full language, social imitation, and Popperian capacity, but strictly zero external notation, measuring devices, or persistent symbolic artifacts (no writing, no tally sticks, no maps).
  **Question:** Which competences emerge spontaneously, and which remain permanently inaccessible?

  *   **Architectural Prediction:** The cohort will reinvent basic notation (tallying, mapping) relatively quickly because the *drive* and *capacity* to externalize are internal Gregorian traits. Complex math may be slower but will not be impossible.
  *   **Scaffold Prediction:** The cohort will hit a hard ceiling on abstract reasoning (e.g., multi-digit arithmetic, formal logic) that no amount of internal intelligence can breach. They will remain stuck at "High Gregorian" but never achieve "Turingian" competence because the scaffold *is* the competence.

  ### Crux B: The Removal Cliff
  **Method:** Take experts who rely on external artifacts (navigators using charts, programmers using IDEs). Remove the artifacts abruptly and measure performance degradation on complex tasks.
  **Question:** Does performance degrade continuously (slope) or does the task become impossible (cliff)?

  *   **Architectural Prediction:** **Slope.** Performance will degrade significantly but continuously. The expert retains the "mental model" and can approximate the operation, albeit slowly and with more errors.
  *   **Scaffold Prediction:** **Cliff.** For specific operations (e.g., long division of 10-digit numbers, navigating open ocean without instruments), performance will drop to zero. The operation was never "in the head" to begin with; the brain was merely steering the artifact.

  ### Crux C: Verbal vs. Substantive Dispute
  **Issue:** Is the fight about the "unit" of cognition (Individual vs. Individual+Artifact) merely semantic?
  **Shared Test:** Does adopting one definition over the other change our predictions about ethics, AI safety, or education?

  *   **Architectural View:** **Mostly Verbal.** Calling a Human+Tool system a "new mind" is a metaphor. It changes nothing about responsibility (the human is responsible) or education (teach the human to use the tool).
  *   **Scaffold View:** **Substantive.** If the system is the unit, then damaging the artifact is cognitively harmful (like a lobotomy). AI safety must focus on the *coupling*, not just the model. Education must focus on *integration*, not just tool literacy.

  ## 4. CONFIDENCE NOTE

  **High Confidence:** We are highly confident in the definitions of the original four kinds (Darwinian through Gregorian) and the assessment that human adults are Gregorian. We are also confident that an isolated LLM is a Gregorian Artifact, not a biological creature.

  **Medium Confidence:** We are moderately confident in the "Removal Cliff" predictions. Both sides acknowledge that some tasks become practically impossible without tools, but we disagree on whether this impossibility is *principled* (Scaffold) or *practical* (Architectural).

  **Low Confidence (The Gap):** We are least sure about the **Artifact-Deprivation Test**.
  *   *Reason for Uncertainty:* This test is ethically fraught and likely impossible to run rigorously. Consequently, we are papering over a gap in our knowledge about human neuroplasticity. We do not know if the brain *can* re-derive complex notation without exposure to it, because no such cohort exists.
  *   *Risk:* If the Feral Notation Cohort *does* reinvent calculus spontaneously, the Scaffold position collapses. If they *cannot* even invent basic writing, the Architectural position weakens. We acknowledge that our current positions rely on interpreting historical data (e.g., isolated children, ancient civilizations) which is ambiguous. This document rests on the assumption that this test *could* theoretically yield a decisive result, even if we cannot perform it.

  ***

  **Signed,**

  *Dr. Elena Vance, Lead Representative, Architectural Working Group*
  *Dr. Aris Thorne, Lead Representative, Scaffolding Research Collective*
