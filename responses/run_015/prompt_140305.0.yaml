              *   Is the lithograph on the critic's side (does it support "no privileged level") or the user's side (does it imply an external author)?
              *   If *Drawing Hands* is the wrong image, what is a better one (mirrors, Bach canon, camera/monitor, etc.), and does *that* image license "no privileged level" or restore one?
      *   **Constraints:** Assume knowledge of strange loops/tangled hierarchies. Do not cite Escher's letters/intentions.

  2.  **Deconstruct *Drawing Hands*:**
