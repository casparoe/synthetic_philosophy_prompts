      *   **The User's Skepticism:** The user suspects *Drawing Hands* actually *requires* an external author/surface (Escher's hand, the paper) and thus supports the existence of a "privileged level," contradicting the critic.
      *   **Tasks:**
          1.  Create a correspondence table mapping elements of the novel to elements of *Drawing Hands*, noting forced mappings or missing partners.
