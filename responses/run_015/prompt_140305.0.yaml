      *   *Bach Canon (Endlessly Rising):* Illusion of ascent. Returns to start but higher. Requires a listener outside the music.
      *   *Camera on Monitor (Video Feedback):* Real-time loop. Generates noise/patterns. Requires power/source outside the loop.
      *   *Ouroboros:* Snake eating tail. Classic symbol. Still drawn by someone.
      *   *Better Option:* **Video Feedback** or **The Liar's Paradox (linguistic)**.
      *   *Wait, the specific constraint:* "No privileged level."
