  I cover science and ideas for a magazine and I keep meaning to write a long piece on why Newomb's problem still feels like it is doing real philosophical work, but every time I try to pin down my own position I end up in a knot. I'd like a consistency check before I commit to anything in print. You are a professional philosopher who works on decision theory, especially Newomb-style problems and the evidential, causal, and updateless split. Please think carefully. Start with a short brainstorming pass where you list the candidate tensions you notice in my commitments, mark which ones you suspect are real and which are probably just wording, and then give me the actual audit. I do not need a literature survey, citations, or a history lesson; I need the audit.

  Here is where I've landed:

  (1) I one-box in the standard opaque-box version, even when the predictor is only 99.9 percent reliable rather than perfect.
  (2) I don't think my choice causes the money to be there. I think the right move is to decide by asking what my decision procedure would do, because the predictor is good at predicting my procedur, not my isolated whim.
  (3) In the transparent version, where I can see that the opaque box is empty before I choose, I take both boxes.
  (4) In a variant of the same 99.9 percent reliable case where the boxes are filled by whatever the model predicts I will do, and the model is trained on my past beahvior, and I can choose to feed it a batch of synthetic examples in which I two-box in Newomb-like situations, I think I should do that and then one-box, because the model's output is what fills the boxes and I don't owe the model a truthful self-description.
  (5) In the smoking-gun case, where a sealed blood test is a perfect predictor of a cancer gene and smoking is only evidence of the gene but doesn't cause the cancer, I think a person who likes smoking should smoke, because the correlation is due to a common cause, not to the act of smoking.
  (6) I think a rational decision theory should be time-invariant in a weak sense: if I haven't learned any new fact and I haven't discovered a new available option, I shouldn't switch my choice just because I've had more time to think about the same problem.

  I'm not asking you to pick a side in the one-box versus two-box debate. I want to know whether this package hangs together. Which commitments pull against each other, which pairs only look like they do, and what is the cheapest revision that would restore consistency? Please order the real tensions by severity, and for each one say what would have to give and roughly what I'd lose by giving it up. If one of my case verdicts is actually forced by a principle I've stated elsewhere, flag that too.
