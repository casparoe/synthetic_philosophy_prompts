answer: |-
  This is a sharp observation, and you're right to feel that standard terms like "anthropomorphism" don't quite capture the *reversibility* of the move. Anthropomorphism is usually a one-way leak (human -> machine). What you're describing is a bidirectional toggle switch flipped by emotional convenience.

  Since you and your roommates are steeped in the rationalist/ACX milieu, you'll recognize that the closest canonical concept is **Dennett's Intentional Stance**. However, what you're witnessing is a corruption of that stance. Below is a breakdown of the existing concepts, why they miss the mark, and a coined term with a tight definition you can deploy at the next takeout session.

  ### 1. The Near-Miss Concepts

  **A. The Intentional Stance (Daniel Dennett)**
  *   **The Concept:** We treat a system *as if* it has beliefs and desires because doing so is the most efficient way to predict its behavior. It doesn't matter if the system *actually* has a mind; if the "belief/desire" model predicts better than the "physics/code" model, use it.
  *   **Why it's not quite it:** Dennett's stance is supposed to be **epistemically consistent**. You adopt the stance based on *predictive utility*, not *emotional utility*. Your roommates aren't switching frames because the Intentional Stance stopped predicting the hallucination; they're switching because the Intentional Stance stopped being *comfortable* (i.e., it became blameworthy).

  **B. The Eliza Effect**
  *   **The Concept:** The tendency to assume computer behavior implies human-like cognition, especially in NLP.
  *   **Why it's not quite it:** This is a one-way error. It explains why your friend said "it saw the truck." It does not explain why the same friend immediately retreated to "it's just matrix multiplies" five minutes later. The Eliza Effect doesn't account for the *retraction*.

  **C. Moral Luck (Thomas Nagel)**
  *   **The Concept:** We judge agents differently based on outcomes outside their control.
  *   **Why it's not quite it:** This covers the praise/blame aspect (success = skill, failure = bad luck). But your example includes epistemic claims ("it knows" vs. "it doesn't know"). The shift isn't just about moral responsibility; it's about the *ontology* of the system. They are literally changing their model of what the thing *is* based on whether they like the output.

  **D. Motivated Reasoning**
  *   **The Concept:** Processing information to reach a preferred conclusion.
  *   **Why it's not quite it:** Too broad. This is the genus, not the species. You need a term that specifies *what* is being motivated (agency attribution) and *how* (ontological oscillation).

  ### 2. The Coinage: "The Homunculus Hedge"

  There isn't a standard term for this specific *ontological opportunism*, so here is a proposal that should resonate with your crowd.

  **Term:** **The Homunculus Hedge**
  **Formal Equivalent:** **Motivated Agency Attribution**

  **Definition:**
  The cognitive maneuver of attributing internal agency (beliefs, goals, knowledge) to an algorithmic system when its output is advantageous to the user (for credit or simplicity), and denying that same agency when the output is disadvantageous (to avoid blame or complexity), without a corresponding change in the technical understanding of the system.

  It is a "hedge" because the user is protecting themselves against two risks:
  1.  **The Risk of Complexity:** Admitting the system is "just math" makes it hard to understand why it succeeded. Positing a "homunculus" (a little mind inside) makes success easy to narrate.
  2.  **The Risk of Responsibility:** Admitting the system is an "agent" makes it hard to assign blame when it fails. Positing it is "just a tool" absolves the user (and the devs) of liability.

  ### 3. Boundary Cases (Yes/No)

  To use this in arguments, you need to distinguish it from legitimate frame-switching.

  **✅ YES (The Homunculus Hedge):**
  *   **Case:** "Claude *knew* I wanted a direct flight" (after a successful booking) → "It's *just* predicting tokens" (after a hallucination).
  *   **Why:** The technical model of Claude didn't change between the two statements. Only the *valence* of the outcome changed. The user is hedging their ontological commitment to maximize credit/minimize frustration.

  **✅ YES (The Homunculus Hedge):**
  *   **Case:** A self-driving car merges perfectly. Passenger: "It *saw* that gap and *decided* to take it." Car stalls at a light. Passenger: "The sensors *failed*, it's just code."
  *   **Why:** Attributing "seeing/deciding" implies a mind. Attributing "sensor failure" implies a broken tool. The switch allows the passenger to feel safe (it's smart) but not responsible (it's broken).

  **❌ NO (Legitimate Intentional Stance):**
  *   **Case:** "I'll treat the chess engine as having a strategy to predict its move, but I acknowledge it has no actual consciousness."
  *   **Why:** This is consistent. The user maintains the "as if" frame for prediction but doesn't claim *actual* knowledge or belief, and doesn't drop the frame when the engine loses.

  **❌ NO (Epistemic Update):**
  *   **Case:** "I thought this bot had access to live search (agency/knowledge), but I just learned it's a closed-weight model with a 2023 cutoff."
  *   **Why:** The frame switch is driven by *new technical information*, not by the success/failure of the output.

  ### 4. Why This Matters (The "So What?")

  If you bring this up with your roommates, here is the leverage point: **The Homunculus Hedge is an alignment risk.**

  If we oscillate on whether AI is an agent based on how much we like its output, we fail to build consistent safety protocols.
  *   When it works, we trust it too much (over-attributing understanding).
  *   When it fails, we trust it too little (under-attributing systemic risk).

  By calling out the **Homunculus Hedge**, you aren't just pedantic about semantics; you're pointing out that your friends are using a *motivated ontology* that prevents them from having a true model of the system. They want the AI to be a wizard when it helps them, and a calculator when it embarrasses them. But it's neither.

  **Usage Example:**
  *"You're doing the Homunculus Hedge. You can't claim it 'understood' your prompt when it worked and 'just did math' when it hallucinated. Pick an ontology and stick to it, or admit you're just optimizing for credit assignment."*
