answer: |-
  There is no single, canonical English word for this specific phenomenon, though it is a recognized structure in philosophy of science, risk analysis, and legal theory. Your intuition is correct: the two cases you described are structurally identical, even though one concerns retrospective error (innocence) and the other prospective efficacy (deterrence).

  Both are instances of a system where **the successful execution of the policy destroys the feedback loop required to evaluate the policy.**

  Here is the breakdown of the existing concepts that come close, followed by the specific term you asked for.

  ### 1. The Existing Concepts (Near Misses)

  *   **Structural Unfalsifiability:** In philosophy of science (Karl Popper), a claim is "unfalsifiable" if no evidence could ever prove it wrong. Your examples describe a policy that *makes* a claim structurally unfalsifiable. The claim "We never execute innocents" becomes unfalsifiable because the execution eliminates the subject who could falsify it.
  *   **Silent Evidence (Survivorship Bias):** Nassim Taleb popularized this. It describes focusing on the data that survived a process (exonerated death row inmates) while ignoring the data that didn't (executed innocents). This fits your first case perfectly but doesn't quite capture the second (deterrence testing).
  *   **The Collingridge Dilemma:** In technology assessment, this states that you cannot predict the consequences of a technology until it is widely used, but by then it is entrenched and hard to change. This fits your second case (we can't test deterrence without scaling the policy), but implies entrenchment rather than evidence destruction.
  *   **Self-Sealing Argument:** A rhetorical tactic where any evidence against a claim is reinterpreted as evidence for it. Your examples are stronger than this; it isn't just that the *argument* reinterprets evidence, but that the *practice* physically eliminates it.

  ### 2. The Term You Need

  Since no single word exists, the most precise label for this specific dynamic is:

  ## **Epistemic Self-Immunization**

  **Definition:**
  A practice or policy design in which the successful operation of the system actively eliminates or degrades the mechanisms required to detect its own failures or measure its own efficacy.

  **Why this fits:**
  *   **Epistemic:** It concerns knowledge (knowing if someone is innocent, knowing if the penalty deters).
  *   **Self:** The system does this to itself; it is not an external obstacle.
  *   **Immunization:** Like a virus evading the immune system, the policy evades correction. It protects itself from being "attacked" by counter-evidence because it destroys the factory that produces that evidence.

  ### 3. Marking the Edges (What it is NOT)

  You asked for a definition that doesn't swallow every case of "absence of evidence." Here are the boundaries that distinguish **Epistemic Self-Immunization** from general uncertainty:

  1.  **It requires Causality, not just Correlation.**
      *   *Not this:* "We don't know if dark matter exists because our telescopes aren't strong enough." (The limitation is external/technological).
      *   *Is this:* "We don't know if this person was innocent *because* we executed them." (The policy *caused* the lack of knowledge).
  2.  **It requires Irreversibility.**
      *   *Not this:* "We can't measure employee satisfaction while they are working, so we wait until lunch." (The evidence will exist later).
      *   *Is this:* "We can't measure innocence after execution." (The evidence can *never* exist again).
  3.  **It involves a Feedback Loop Severance.**
      *   *Not this:* "It is hard to count how many fish are in the ocean." (Passive difficulty).
      *   *Is this:* "The method we use to catch the fish destroys the counter we use to count them." (Active destruction of the measurement tool).

  ### 4. Are your two cases the same thing?

  **Yes.** They are both instances of **Counterfactual Destruction.**

  *   **Case 1 (Innocence):** To know the truth, you need a world where the prisoner stays alive to be tested. The policy collapses that possibility.
  *   **Case 2 (Deterrence):** To know the truth, you need a world where the penalty is swift *and* safe. The policy demands you choose one (swiftness) at the expense of the other (safety/review), making the "true test" impossible to run without accepting unacceptable risk.

  In both scenarios, the proponent of the policy uses the **lack of disconfirming evidence** (no proven innocents executed / no proven deterrence) as support for the policy, while the policy itself is the reason that evidence is missing.

  ### Summary
  If you need to use this in conversation, **Epistemic Self-Immunization** is the precise coinage. If you want a more common shorthand, **Structural Unfalsifiability** is the recognized philosophical term, though it applies to the *claim* rather than the *practice*.

  Your friend was close with Goodhart's Law, but Goodhart's is about **corruption** (people gaming the metric). This is about **erasure** (the metric is destroyed). Epistemic Self-Immunization marks that distinction.
