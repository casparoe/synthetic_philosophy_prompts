      *Drafting:*
      Dear Student, this is a fascinating philosophical puzzle that lands squarely in the debate over extended cognition. To help you navigate this, we must separate the plausible insights from the overextensions hidden within the sentence the mind isn't just in the head. At its most modest, this claim means merely that the environment causally shapes how we think. Nobody denies that lighting, noise, or available resources influence cognitive performance. This is a platitude that even a strict skeptic would grant, but it does not help your classmate, because causing a thought is not the same as constituting it. A slightly stronger reading suggests that external props make internal tasks easier, acting as scaffolding. This is substantive and defensible. We use calculators or notebooks to offload cognitive labor, yet we still distinguish between using a tool and the tool doing the work for you. This distinguishes legitimate aid from outsourcing the core task.

      The third reading is the famous extended mind thesis, which argues that external items can in some cases partly constitute a mental state, so that what you believe depends on what is in your notebook. This is substantive and defensible, but it comes with strict conditions regarding reliability and immediate access. The fourth and most radical reading posits there is no interesting boundary at all between a thinker and her tools. This is close to incoherent, as it dissolves the agency required for moral responsibility. If there is no boundary, there is no student to grade.

      When we test these readings against your specific cases, the limitations become clear. Consider the subscription service that changes responses or hallucinates. For the constitution claim to hold, the external resource must be trustworthy and consistently available. If the company changes the algorithm or the tool lies, it fails the reliability condition. It matters whether the user could tell the difference, because cognition requires a stable loop of trust. If you cannot verify the output, it is not part of your mind, it is an oracle you are guessing at. Regarding the assistant trained on your classmate's past essays, this does not automatically make the cognition more his. Ownership of the training data is not ownership of the processing. If the model belongs to a company, the synthesis is theirs, not his. He is reading a reflection of his past self generated by a stranger's machine, which is distinct from recalling the memory himself.

      The shared account case further destabilizes the argument. If five students share one account and only one curates it, the others find their apparent recollections shifting without noticing. Here, no individual mind is extended in a defensible way. The curator might have an extended system, but the others are merely receiving outputs they did not generate or control. Their cognitive agency is compromised, not enhanced. This shows that access alone is insufficient; control and integration are required for the extended mind thesis to apply.

      So, which readings do the work your classmate needs? He needs the third reading, where the AI is part of his cognitive constitution, to argue that using it is no different than using his memory. However, given the reliability issues and lack of total control, this reading is not defensible in his specific case. The first two readings are defensible but do not excuse cheating, as they admit a distinction between help and substitution. The radical fourth reading is indefensible and undermines the concept of individual assessment entirely. As for your chemistry teacher, advising you not to memorise anything relies on the second reading, that props make tasks easier, but pushes it toward the radical fourth claim. While offloading memory is sometimes efficient, claiming you never need internal knowledge assumes the tools will always be available and trustworthy, which is a risky pedagogical stance. Ultimately, the phrase contains truths about how we think, but it cannot erase the line between using a tool and letting the tool use you.

