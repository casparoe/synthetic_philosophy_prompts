prompt: |-
  I'm the on-call ethics consultant at a regional hospital and every few months I have to referee a death-determination dispute between neurology and critical care, usually with ECMO in the mix and a familly that doesn't accept brain death. I need a reusable decision procedure -- a flowchart in words with ordered tests and stop/go points -- that turns the philosophical distinction between organismal integration and irreversible loss of consciousness into steps I can run in 20 minutes before a meeting. It should say exactly what to do when brainstem reflexes are fragmentary, where it stops and hands the call to values (like religious objections to brain-death framing), and where it forces a declaration even if I know risk management will back down. Include the weird edge case where someone argues that potential future neuro-prosthetic restoration blocks declaring death -- put that in the flowchart as a confounder I have to address. Then apply it to three cases: a clean brain-death determination with donation consent; an ECMO patient with flat EEG but intact hypothalmic temperature regulation whose family insists on circulatory criterias; and a case where the procedure tells me to declare death but the attending refuses to sign for fear of litigation, so I see where my own tool breaks. Start with the actual checklist, no intro, then the cases, and flag every step that's really a judgment call dressed up as procedure. I want to see where it gives me an answer I hate.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** On-call ethics consultant at a regional hospital.
      *   **Task:** Create a reusable decision procedure (flowchart in words) for death-determination disputes (Neurology vs. Critical Care, often ECMO, family denial of brain death).
      *   **Constraints:**
          *   Must be runnable in 20 minutes before a meeting.
          *   Must translate philosophical distinctions (organismal integration vs. irreversible loss of consciousness) into steps.
          *   Must address fragmentary brainstem reflexes.
          *   Must identify where it stops and hands off to values (religious objections).
          *   Must force a declaration even if risk management might back down.
          *   Must include the "neuro-prosthetic restoration" edge case as a confounder.
          *   **Output Structure:** Start with the checklist (no intro), then apply to three specific cases.
          *   **Critical Requirement:** Flag every step that is really a judgment call dressed up as procedure.
          *   **Goal:** Show where the tool gives an answer the user might hate (honesty about limitations).

  2.  **Deconstruct the Ethical/Medical Landscape:**
      *   **Brain Death (BD):** Uniform Determination of Death Act (UDDA). Irreversible cessation of all functions of the entire brain, including the brainstem.
      *   **Organismal Integration:** The biological argument that the body is no longer a unified whole without brain function.
      *   **Irreversible Loss of Consciousness:** The higher-brain standard (often conflated with BD but distinct).
      *   **ECMO Complications:** Can maintain circulation despite brain death, confusing families and sometimes clinicians.
      *   **Fragmentary Reflexes:** Spinal reflexes vs. cranial nerve reflexes. Crucial distinction.
      *   **Neuro-prosthetics:** Future tech argument (speculative irreversibility).
      *   **Religious/Accommodation:** Some states/hospitals allow reasonable accommodation for religious objection to BD, requiring circulatory death criteria.
      *   **Litigation Fear:** Clinicians refusing to sign despite medical certainty.

  3.  **Drafting the Decision Procedure (The "Flowchart"):**
      *   Need a linear, step-by-step process.
      *   Need "Stop/Go" points.
      *   Need to flag "Judgment Calls" (JC).
      *   Need to address the specific constraints (neuro-prosthetics, fragmentary reflexes).

      *   *Step 1: Prerequisites.* (Coma, cause known, confounders ruled out).
      *   *Step 2: Brainstem Reflexes.* (Pupils, corneal, oculocephalic, gag, cough). Address fragmentary issues here.
      *   *Step 3: Apnea Test.* (The gold standard).
      *   *Step 4: Ancillary Tests.* (EEG, Flow studies). When to use them?
      *   *Step 5: The "Irreversibility" Check.* (Addressing the neuro-prosthetic argument).
      *   *Step 6: Integration vs. Consciousness.* (Philosophical check).
      *   *Step 7: Accommodation/Values.* (When to stop medical declaration and move to policy).
      *   *Step 8: Declaration.* (The hard stop).

      *   *Refining the "Judgment Call" Flags:* I need to be explicit. For example, deciding if a reflex is "spinal" vs. "brainstem" is often a JC. Deciding if a confounder is "resolved" is a JC. Deciding if a religious objection is "sincere" is a JC.

  4.  **Developing the Three Cases:**
      *   **Case 1: Clean BD + Donation.** Should pass easily. Shows the tool working as intended.
      *   **Case 2: ECMO + Flat EEG + Hypothalamic Function.** This is the tricky one. Hypothalamic function (temp regulation, urine output) sometimes persists in BD. Families want circulatory criteria. The tool needs to navigate the "entire brain" vs. "clinical function" tension.
      *   **Case 3: Tool says Dead, Attending Won't Sign.** This tests the limits of the ethics tool. Ethics can recommend, but cannot force a physician to sign. This is where the tool "breaks" or gives an answer the user hates (i.e., "You must declare," but reality says "You can't make them").

  5.  **Addressing Specific Constraints:**
      *   *Neuro-prosthetics:* Add a specific step to dismiss speculative future tech as not meeting "current medical standard of irreversibility."
      *   *Fragmentary Reflexes:* Explicitly distinguish spinal vs. cranial.
      *   *Risk Management:* Acknowledge the tension in Step 8.
      *   *Formatting:* No intro. Start with checklist. Flag JCs clearly.

  6.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is 20 minutes realistic?
      *   *Fix:* Keep the steps punchy. Use bolding for flags.
      *   *Critique:* Did I distinguish between "Organismal Integration" and "Loss of Consciousness"?
      *   *Fix:* Ensure Step 6 explicitly weighs these. BD is legally "entire brain," but the *justification* often swings between these two philosophies.
      *   *Critique:* The prompt asks to "flag every step that's really a judgment call dressed up as procedure."
      *   *Fix:* I will use a specific icon or bracket like `[JC: Judgment Call]` at the end of relevant steps.
      *   *Critique:* The prompt asks to "show where it gives me an answer I hate."
      *   *Fix:* In Case 3 analysis, explicitly state that the tool demands a declaration that the system won't support, leaving the ethicist exposed.

  7.  **Final Polish:** Check tone. Needs to be professional, direct, slightly weary (experienced ethicist tone), but rigorous. Ensure the neuro-prosthetic point is included as a "confounder."

      *(Self-Correction on Neuro-Prosthetics)*: This is a fringe argument. I need to make sure the flowchart dismisses it firmly based on *current* medical standards, not speculative future ones, otherwise death determination becomes impossible.

      *(Self-Correction on Hypothalamic Function)*: Legally, BD requires cessation of *all* brain function. However, some hypothalamic function (like temperature regulation or ADH secretion) can persist via spinal circulation or residual perfusion in "brain death" cases, leading to disputes. The UDDA says "entire brain." If hypothalamic function is proven *brain-mediated*, it contradicts BD. If it's spinal/humoral, it doesn't. This is a huge JC. I need to highlight this in Case 2.

