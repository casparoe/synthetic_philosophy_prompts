answer: |-
  ### Pre-Session Concessions (First Two Minutes)

  **What to say:**
  "Before we begin, I want to clarify two limitations of the view to avoid spending the hour defending claims I am not making. First, I am not positing a group mind. The 'shared agency' is not a metaphysical entity that bears complaints; it is a heuristic for describing a specific configuration of individual reasons. If the view sounds holistic, that is a failure of my exposition, not a feature of the ontology. Second, I concede that the boundary of 'shared agency' will sometimes be vague. I am not offering a decision procedure that yields a bright line in every marginal case. I am offering an account of *why* numbers count in some contexts and not others, not a flowchart for determining group membership. If the view requires precise sociological boundaries to function, it fails; it must be robust enough to handle fuzzy cases without collapsing."

  **Why:**
  This disarms the Senior Contractualist (who fears holism) and the Political Philosopher (who fears arbitrary boundaries) before they can frame these as gotchas. It frames vagueness as a feature of the social world, not a bug in your theory.

  ***

  ### The Q&A Prep Sheet (Ordered by Damage Potential)

  #### 1. The Outsider Exclusion Objection
  **Who:** The Political Philosopher / Senior Contractualist
  **The Question:** "If a cohesive group—say, a research lab—can aggregate their minor interests against an outsider's major interest because they share an agency, haven't you licensed a form of tribalism? If the lab's aggregated convenience outweighs the outsider's severe burden because the outsider's complaint remains individual while the lab's is collective, you have violated the contractualist requirement of impartiality. You've replaced the separateness of persons with the separateness of groups."

  **The Reply:**
  "That is the critical test, and the answer turns on the scope of the justification. The shared-agency condition does not create a permission to impose burdens on outsiders that would be unreasonable to impose on them individually. The aggregation applies only to the *internal* distribution of burdens within the joint enterprise or when deciding whether to undertake the enterprise at all. When facing an outsider, the test reverts to the standard individual reasonable rejectability. The lab cannot say to the outsider, 'Our aggregated minor gains outweigh your major loss.' They must say to the outsider, 'Is this burden reasonable for you?' The aggregation only kicks in when weighing the complaints of participants *against each other* or when the outsider's complaint is weighed against the *project's* necessity, not the project's aggregated pleasure. The outsider's standing remains individual and inviolable."

  **Blunt Note:**
  *Soft Spot:* You are drawing a distinction without a clear mechanism. If the group's interest is aggregated to determine if the project is worth doing, and that project harms an outsider, the outsider is effectively facing the aggregated weight.
  *Concession:* You are conceding that the "project's necessity" is the proxy for aggregation, which is vague.
  *Bluff:* You are bluffing that the "individual standing" of the outsider protects them if the group's aggregated benefit is the justification for the harm. Contractualism usually requires the justification to be acceptable to the loser. If the justification relies on aggregation, the loser is facing aggregation.

  #### 2. The Extensional Equivalence Objection
  **Who:** The Total Utilitarian
  **The Question:** "Shared agencies are ubiquitous. Markets, cities, legal systems, even casual social networks involve some degree of joint investment. If your condition for aggregation is merely 'some shared point made their own,' isn't the set of cases where numbers don't count vanishingly small? You haven't restricted aggregation; you've just added a sociological prerequisite that is almost always met. Aren't you just a rule-utilitarian with extra steps?"

  **The Reply:**
  "The prevalence of shared agency doesn't collapse the view unless the definition is trivial. I am defining shared agency strictly: it requires mutual recognition of joint authorship and a specific interdependence of reasons, not just causal interaction. Strangers in a transmitter room audience do not have this; commuters in a city do not have this. There are plenty of cases—emergency triage among strangers, random pedestrians, disparate beneficiaries of a policy—where the relation is absent. The view is not extensionally equivalent to utilitarianism because it strictly forbids aggregation in the 'stranger' cases which utilitarianism demands we aggregate. The gap is significant enough to preserve the distinctiveness of the view."

  **Blunt Note:**
  *Soft Spot:* The definition of "mutual recognition" is doing all the work, and it is fragile.
  *Concession:* You are conceding that in modern society, the "stranger" case is rarer than Scanlon assumed.
  *Bluff:* You are bluffing that the "gap is significant." If the utilitarian presses that 90% of cases involve some social tie, your view converges significantly on theirs.

  #### 3. The Uncertainty/Probability Objection
  **Who:** The Decision Theorist
  **The Question:** "Shared agency is often a matter of degree or probability ex ante. I might join the expedition, or I might not. I am 50% likely to be a co-author. Do I aggregate my potential complaint with the group ex ante? If yes, you allow aggregation based on probabilistic membership. If no, how do you evaluate the policy before the group forms? You seem to lack an ex ante account of risk."

  **The Reply:**
  "The standpoint is determined at the time of the justification, not the time of the outcome. If the policy is being adopted when the group is not yet formed, the relevant standpoint is that of the potential participants as individuals facing a risk. Aggregation only becomes permissible once the joint agency is actualized. This means some decisions must be made without aggregation, even if they lead to a state where aggregation would later be permitted. This isn't a bug; it reflects the moral significance of the transition from stranger to partner. We cannot aggregate over people who are not yet in the relation."

  **Blunt Note:**
  *Soft Spot:* This creates a diachronic inconsistency. A policy forbidden ex ante (because no group) becomes mandatory ex post (because group formed).
  *Concession:* You are conceding that the view cannot guide decision-making under uncertainty effectively.
  *Bluff:* You are bluffing that the "time of justification" is clear. In long-term projects, justification is continuous.

  #### 4. The Manufacturability Objection (Your Candidate)
  **Who:** The Prioritarian / Strategic Actor
  **The Question:** "If aggregation is permitted within shared agencies, agents have a strategic incentive to form shallow agencies just to aggregate their complaints. A crowd of strangers can agree to 'co-author' a viewing party in five minutes. Does your view collapse because the barrier to entry for aggregation is too low? Can I game the system by coordinating with strangers before filing a complaint?"

  **The Reply:**
  "Coordination is not co-authorship. Signing a form or agreeing to watch a screen does not create the deep interdependence of reasons required. The shared agency must be one where the setback to one is a setback to the *enterprise* in which others are invested. A viewing party is a collection of individuals consuming a good; a rescue crew is a collection of individuals constituting a function. The barrier is normative, not procedural. You cannot game it by mere agreement because the agreement must track a real change in the structure of your reasons."

  **Blunt Note:**
  *Soft Spot:* "Real change in the structure of reasons" is unobservable and easily feigned.
  *Concession:* You are conceding that sociological facts determine moral permissions, which is hard to police.
  *Bluff:* You are bluffing that there is a clear line between a "viewing party" and a "constituted group" that isn't just stipulative.

  #### 5. The Holism Worry
  **Who:** The Senior Contractualist
  **The Question:** "Scanlon's view rests on the idea that we justify principles to individuals. You are saying that when individuals form a group, we justify principles to the *group*. Have you not reintroduced the holistic entity you disclaimed? If the complaint is 'a setback to the enterprise,' who feels that setback? If no individual feels it, it's mystical. If an individual feels it, it's just their individual complaint again."

  **The Reply:**
  "No individual feels the 'enterprise' setback directly, but every participant has a reason to care about it that is distinct from their personal welfare. It is a second-order reason. I am not asking you to justify principles to a ghost; I am asking you to recognize that your own reasons include the success of the joint activity. The complaint is still lodged by an individual, but the *content* of their complaint references the shared fate. The standpoint is individual, but the reasons within that standpoint are partially other-regarding by constitution."

  **Blunt Note:**
  *Soft Spot:* This is semantic sleight of hand.
  *Concession:* You are conceding that the "individual standpoint" is doing less work than standard contractualism requires.
  *Bluff:* You are bluffing that "second-order reasons" solve the metaphysical problem of where the aggregation happens.

  #### 6. The Arbitrary Boundary Objection
  **Who:** The Political Philosopher
  **The Question:** "Why should the permissibility of saving five lives instead of one depend on whether those five are a 'crew' or a 'crowd'? This makes the fundamental structure of moral permission track contingent social facts. It implies that morality is less demanding in individualistic societies and more aggregative in collectivist ones. That seems to get the direction of fit wrong."

  **The Reply:**
  "Morality isn't changing; the *relations between persons* are changing, and morality regulates those relations. If the social fact changes the nature of the reasons people have, it changes the moral landscape. It is not arbitrary; it is responsive. To ignore the difference between a crew and a crowd is to ignore the actual normative reality of their situation. We don't demand morality be blind to social context; we demand it be sensitive to it."

  **Blunt Note:**
  *Soft Spot:* This admits moral verdicts vary by culture/social structure.
  *Concession:* You are conceding that contractualism is not universalist in its application.
  *Bluff:* You are bluffing that this variation is acceptable to the contractualist project of finding principles no one could reasonably reject *globally*.

  #### 7. The Exit Problem
  **Who:** The Decision Theorist / General
  **The Question:** "If I am in a shared agency, can I opt out of aggregation to protect my individual standing? If I resign from the lab, do I regain my right to have my complaint counted individually against the remaining members? If yes, aggregation is voluntary. If no, the shared agency is coercive."

  **The Reply:**
  "Standing is determined by your position at the time of the act. If you have resigned, you are an outsider, and your complaint is individual. However, you cannot opt out retroactively to invalidate a decision made when you were a member. This preserves the stability of the joint enterprise while respecting individual autonomy to leave the normative sphere of the group."

  **Blunt Note:**
  *Soft Spot:* Creates a "trap" where leaving is costly.
  *Concession:* You are conceding that membership has binding normative force.
  *Bluff:* You are bluffing that the "time of the act" is always distinguishable from the time of membership in ongoing relationships.

  #### 8. The Trivial Aggregation Objection
  **Who:** The Prioritarian
  **The Question:** "Does shared agency allow aggregating trivial harms against a severe harm? If the lab members each lose a coffee break, can they aggregate that to justify causing severe pain to one member? If yes, your restriction is too weak. If no, what is the threshold?"

  **The Reply:**
  "Aggregation is permitted, but not unlimited. The reasonable rejectability test still applies. A principle that allows aggregating trivialities to impose severe harm is reasonably rejectable by the sufferer, even within a shared agency. The shared agency condition opens the door to counting numbers; it does not close the door on the magnitude of the burden. The test remains: could the individual reasonably reject this principle given their investment in the group?"

  **Blunt Note:**
  *Soft Spot:* You are reintroducing a threshold without explaining where it comes from.
  *Concession:* You are conceding that shared agency is necessary but not sufficient for aggregation.
  *Bluff:* You are bluffing that the "investment in the group" clearly blocks the aggregation of trivialities. Often, groups demand high sacrifice for trivial gains.

  ***

  ### The "Worse Question" Analysis

  You identified the **Manufacturability Objection** (co-authorship is too easy to fake) as the one you hope nobody asks.

  **There is a worse question:** **The "Outsider Exclusion" Objection (Objection #1 above).**

  **Why it is worse:**
  The Manufacturability Objection suggests your view is *manipulable*. The Outsider Exclusion Objection suggests your view is *monstrous*.

  If the Manufacturability Objection holds, your view becomes practically indistinguishable from unrestricted aggregation, which is a theoretical failure but perhaps morally benign (you end up saving more people).

  If the Outsider Exclusion Objection holds, your view permits a cohesive group to impose severe burdens on an individual outsider because the group's aggregated minor interests outweigh the outsider's individual major interest (since the outsider cannot aggregate, but the group can). This violates the core contractualist intuition of impartiality and the "separateness of persons" more severely than utilitarianism does. It creates "moral fortresses" where insiders can sacrifice outsiders with impunity.

  **Strategy:**
  If this question is asked, do not try to solve it fully. Acknowledge the tension. Pivot to the claim that the "reasonable rejectability" test acts as a side-constraint on the aggregation (as in Reply #1). If you admit that the group *can* aggregate against the outsider without constraint, you lose the contractualist in the room. If you admit they *cannot*, the Prioritarian will ask why the shared agency matters at all. You must hold the line that aggregation is for *internal* trade-offs or *project justification*, not for *outsider sacrifice*.
