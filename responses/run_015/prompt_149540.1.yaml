answer: |-
  You are right to be skeptical. In historiography, "Revolutions devour their children" is often a **placeholder for an argument** rather than an argument itself. It sounds profound but can easily function as a tautology (i.e., "Revolutionaries killed revolutionaries because that's what happens in revolutions").

  However, if we dissect it, the phrase can carry distinct causal mechanisms. Here is a menu of the four precise readings of that phrase, evaluated against your criteria (emptiness, empirical weight, truth value) and analyzed for how they handle Robespierre's agency.

  ### 1. The Structural-Institutional Reading
  *   **The Claim:** Revolutions create emergency governments (like the Committee of Public Safety) that suspend the rule of law to defeat external enemies. Once the external threat recedes, the mechanisms of violence (tribunals, police) remain, but without a clear target. The "machine" has no off-switch, so it inevitably targets the operators.
  *   **Is it Empty?** No. It proposes a specific institutional mechanism (emergency powers without constraints).
  *   **Is it an Empirical Claim?** Yes. It claims the *structure* of the Terror caused the Thermidorian Reaction, not just personal feuds.
  *   **Is it False?** **Contested.** Revisionist historians (like François Furet) argue this strongly: the "drift of ideology" created a system where dissent = treason. Social historians (like Albert Soboul) might argue it wasn't inevitable but a result of class pressures. It is not demonstrably false, but it is deterministic.
  *   **Does it support the Professor's "Inevitable Machine"?** **Yes.** This is the strongest version of her argument.
  *   **Does it let Robespierre off the hook?** **Yes, mostly.** It frames him as an operator who lost control of the machinery he helped build. He becomes a victim of the system's logic rather than a bloodthirsty monster.

  ### 2. The Ideological Purity Spiral Reading
  *   **The Claim:** Revolutionary legitimacy is based on "Virtue." Since Virtue is subjective, leaders must constantly prove they are purer than their rivals. This creates a radial competition where today's radical is tomorrow's moderate. To survive, you must accuse others of impurity; eventually, there is no one left to accuse but your allies.
  *   **Is it Empty?** No. It posits a specific social dynamic (outbidding/escalation).
  *   **Is it an Empirical Claim?** Yes. It claims the *rhetoric* of the Revolution necessitated the purges (e.g., Hébertists -> Dantonists -> Robespierrists).
  *   **Is it False?** **Debatable.** It explains the *timing* of the purges well, but some argue it ignores material factors (food shortages, war). It risks being teleological (assuming the end result was written in the ideology).
  *   **Does it support the Professor's "Inevitable Machine"?** **Yes.** It suggests the *logic* of the ideology drives the violence, not individual choices.
  *   **Does it let Robespierre off the hook?** **Partially.** It suggests Robespierre was trapped by the rhetoric he championed. He couldn't stop the purges without admitting he himself lacked "Virtue."

  ### 3. The Psychological-Pathology Reading
  *   **The Claim:** Revolutionary movements attract individuals with specific psychological profiles (paranoid, messianic, power-hungry). As power concentrates, these pathologies amplify. The "devouring" is the result of interpersonal paranoia among unstable leaders.
  *   **Is it Empty?** No. It makes a claim about human psychology.
  *   **Is it an Empirical Claim?** Yes. It claims Robespierre's fall was due to his (or his enemies') specific mental states.
  *   **Is it False?** **Weak/Reductionist.** Modern historians generally reject "Great Man" psychological theories as insufficient to explain mass phenomena like the Terror. It is hard to empirically verify the mental states of dead people.
  *   **Does it support the Professor's "Inevitable Machine"?** **No.** This contradicts her argument. If it's psychological, it's not an inevitable structural machine; it's a contingent accident of personality.
  *   **Does it let Robespierre off the hook?** **No.** This actually places the blame squarely on Robespierre's character (he was paranoid/tyrannical). Alternatively, if you argue he was *clinically* ill, it lets him off morally but dismisses his political agency entirely.

  ### 4. The Tautological-Descriptive Reading
  *   **The Claim:** "Revolutions devour their children" simply means "In the French Revolution, revolutionaries executed other revolutionaries." It offers no *why*, only a *what*.
  *   **Is it Empty?** **Yes.** It is a metaphor, not an explanation.
  *   **Is it an Empirical Claim?** No. It is a literary summary of events.
  *   **Is it False?** No, because it doesn't claim anything falsifiable.
  *   **Does it support the Professor's "Inevitable Machine"?** **No.** It provides no causal link.
  *   **Does it let Robespierre off the hook?** **N/A.** It assigns no blame, but explains nothing.

  ---

  ### Analysis of Your Professor's Argument

  Your professor is trying to use the phrase to argue for **Historical Determinism** (Reading #1 or #2). She wants to say that Robespierre's fall was not a contingent political defeat, but a structural necessity of the Terror itself.

  **Which reading does the work?**
  Only **Reading #1 (Structural)** and **Reading #2 (Ideological)** do the work she wants. They argue that once the Law of Suspects was passed and the concept of "Public Safety" elevated above law, the outcome was baked in. Robespierre didn't fall because he made a mistake; he fell because the logic of the Terror requires a final sacrifice to end the Terror.

  **Which readings accidentally let him off the hook?**
  Actually, **Reading #1 and #2 let him off the hook the most.**
  *   If the **Machine** is inevitable (Reading #1), Robespierre is a cog. He is less responsible for the outcome because the outcome would have happened anyway.
  *   If the **Psychology** is the cause (Reading #3), Robespierre is the *villain*. It makes the Terror about his specific paranoia.

  **The Trap:**
  The phrase is dangerous because it sounds like Reading #1 (Structural) but often slips into Reading #4 (Tautology).
  *   **If it's Reading #4:** She isn't explaining anything. She is just saying "Violence happened, then more violence happened."
  *   **If it's Reading #1:** She is making a strong claim (Furet's interpretation) that the *ideology of democracy without institutions* leads to totalitarianism.

  **How to push back in seminar:**
  If you want to challenge her, ask: *"Are you using that phrase to describe the institutional lack of constraints (Reading #1), or are you suggesting there is a trans-historical law that all revolutions must do this (Reading #4)?"*

  If she says the latter, she is being unhistorical (the Russian Revolution devoured children differently than the Iranian Revolution). If she says the former, she is making a specific argument about the **absence of the rule of law**, which is a defensible, high-level historical claim.
