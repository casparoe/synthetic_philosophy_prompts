      *   **Epistemic Contextualism (EC):** The truth conditions of knowledge *ascriptions* ("S knows p") vary with the *attributor's* context (conversational context, salience of error). In low-standards contexts, "S knows" is true. In high-standards contexts, "S knows" is false.
