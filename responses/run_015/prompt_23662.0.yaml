      *   *Better Decision:* The prompt asks to settle the puzzle about *whose situation sets the standard*. The most robust answer that aligns with the intuition that "knowledge guides action" is **Pragmatic Encroachment**. Contextualism often feels like it dodges the metaphysical question of what knowledge *is* by focusing on the word "knows." Encroachment tackles the nature of justification itself. I will argue for Pragmatic Encroachment. It provides a more unified account of the relationship between belief, action, and knowledge. Contextualism creates a disconnect between the subject's rationality and their epistemic status.

