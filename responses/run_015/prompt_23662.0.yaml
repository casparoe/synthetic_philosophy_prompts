answer: |-
  The Bank Case is the modern philosopher's fruit fly: a simple organism used to study the genetics of knowledge. You check your balance on a routine Friday; the stakes are low, and you say, "I know the bank is open." You return the next week to deposit a check that, if bounced, will ruin you; the stakes are high, and suddenly, "I know" feels like a lie, even if your evidence (past visits, hours online) is identical.

  The puzzle you face is how to explain this shift. Two dominant theories compete. **Contextualism** argues that the word "knows" is slippery; its meaning stretches or shrinks depending on the conversational context of the person *speaking* about the knowledge. **Pragmatic Encroachment** argues that knowledge itself is sensitive to practical stakes; the standard for actually *having* knowledge rises when the *subject's* risk increases.

  The tension arises in "crossed stakes" scenarios. Imagine the account holder (the subject) faces disaster if the check bounces, but a friend (the attributor) discusses this casually at a coffee shop, unaware of the risk. Contextualism suggests the friend speaks truly ("He knows") because the *conversation* is low-stakes. Encroachment suggests the friend speaks falsely ("He knows") because the *subject's* stakes are high.

  This is not merely a semantic quibble. It is a question about the nature of rationality. To settle this puzzle, we must ask: What is knowledge *for*? If we accept that knowledge is the fundamental guide for action, we must conclude that **Pragmatic Encroachment is correct, and the subject's stakes are the only ones that matter.** Contextualism offers a clever linguistic workaround, but it severs the essential link between knowing and acting.

  ### The Contextualist Dodge

  Contextualism is attractive because it respects the intuition that language is flexible. In a casual chat, we don't demand forensic proof to say someone "knows" the bank is open. In a courtroom or a high-stakes financial audit, we do. Contextualists argue that the truth conditions of the sentence "S knows p" shift depending on the attributor's context. In the crossed-stakes case, the friend at the coffee shop is operating in a low-standards context. Therefore, when he says, "He knows the bank is open," he speaks the truth, even if the account holder is sweating bullets.

  However, this creates a fractured picture of the subject. According to Contextualism, the account holder *knows* the bank is open (relative to the friend's context), yet it would be *irrational* for the account holder to act on that knowledge by writing the check. This generates a paradox: How can one possess a cognitive state certified as "knowledge" but lack the rational permission to act on it?

  Epistemology is not stamp collecting; it is not merely about labeling mental states. It is about navigating the world. The dominant view in contemporary epistemology is the **Knowledge-Action Principle**: if you know $p$, you are rational to act on $p$. If Contextualism allows a scenario where a subject "knows" (by the attributor's lights) but cannot rationally act (due to their own stakes), it renders knowledge functionally inert. It turns knowledge into a conversational trophy rather than a tool for living.

  ### The Encroachment Solution

  Pragmatic Encroachment resolves this by anchoring the standard of knowledge to the person who must act on it. On this view, knowledge is not a static relation between a mind and a fact; it is a status that certifies a belief as a sufficient basis for action. When the stakes rise for the subject, the evidential threshold required to clear that bar rises with them.

  In the crossed-stakes scenario, Encroachment delivers a clear, unified verdict: The account holder does not know the bank is open. Consequently, the friend at the coffee shop is wrong to say he does, even if the friend is speaking casually.

  This might seem harsh on the friend. Isn't he speaking reasonably? Encroachment distinguishes between *truth* and *assertability*. The friend's claim is false (because the subject lacks knowledge), but it may be *assertable* because the friend is unaware of the high stakes. We can forgive the friend for speaking falsely without distorting the metaphysics of knowledge to make his statement true. This preserves the integrity of the concept: knowledge remains a robust state that guarantees rational action.

  ### Why the Subject's Stakes Must Rule

  The decisive factor is ownership of the risk. Knowledge is a property of the subject, not the speaker. If the standard for knowledge were set by the attributor, then my epistemic status would fluctuate wildly depending on who is talking about me. A skeptic discussing me in a philosophy seminar could strip me of my knowledge, while a casual friend could grant it back, all without my evidence or situation changing. This makes knowledge too external to be useful to the knower.

  If I am the one who will suffer the disaster if the check bounces, I am the one who needs the assurance. My practical environment dictates how much evidence I need to feel secure. If Encroachment is false, then there exists a possible world where I "know" the bank is open (because a low-stakes attributor says so), yet I am irrational to deposit the check. This implies that knowledge is not the norm of action. But if knowledge is not the norm of action, what is it? A mere intellectual ornament?

  Contextualists might reply that they are only analyzing the word "knows," not the state of knowledge. But this is a distinction without a difference. If we are trying to understand whether we can rely on someone's belief to guide their life, the semantic flexibility of the word "knows" is irrelevant. We need to know if the belief is *secure enough*. That security is determined by the cost of error for the believer.

  ### The Verdict

  The tension you feel stems from trying to reconcile a linguistic observation (we speak differently in different contexts) with a metaphysical reality (what justifies action). Contextualism prioritizes the linguistic observation at the expense of the metaphysical reality. It saves the truth of the casual speaker's sentence but sacrifices the connection between knowledge and rational action.

  Pragmatic Encroachment prioritizes the metaphysical reality. It accepts that the casual speaker might be technically wrong, but it preserves the vital function of knowledge: to license action. In the crossed-stakes case, the subject's high stakes create a deficit of justification that a casual conversation cannot fill.

  Therefore, the standard is set by the **subject**. Your stakes determine what you know, because you are the one who has to live with the consequences of being wrong. The Bank Case does not show that the word "knows" changes meaning; it shows that knowledge itself is sensitive to the practical weight of error. When the check is on the line, you don't just feel like you don't know; you *don't* know. To claim otherwise is to pretend that the risk of ruin is merely a matter of conversational tone. It is not. It is a matter of fact, and it dictates the standard.
