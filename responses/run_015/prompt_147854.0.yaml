prompt: |-
  Hi — I need a decision tree for my department's reading group, and honestly it's mostly because I got into a stupidly long argument with a friend last night.

  Context: she's a systems neuroscientist. I said something like "I raised my hand because I wanted another coffee," and she said no — all the causal work was already done by the neural events, and by the time you add the wanting you've added a second cause of something that already had one, so either the wanting just is the neural event or it does nothing. I kept pushing back with "but if you'd swapped my neurons for completely different hardware that realized the same decision, I'd still have reached for the cup," and she said that only shows the neural description was at the wrong grain, not that the mental is an extra cause. We went in circles for about two hours and neither of us could say where exactly we disagreed, which is embarassing for both of us.

  So: I want a one-page decision tree / flow chart that takes someone from "my wanting coffee caused my hand to go up" down to a named position, where every branch node is a question you can answer without already knowing which position it leads to, and every question is a concrete case or claim rather than "do you think the mind is physical?"

  What I want specifically:

  - 7 or 8 branch nodes, each a three-way question (yes / no / "the question is badly posed"). Order them so the cheap agreements come first and the expensive commitments come last.
  - Build the tree out of the logical space rather than out of a list of positions: start from the questions and the combinations of answers they allow, then locate the actual views in the cells. Where a combination is empty, say so and tell me why — is it incoherent, just unattractive, or merely unexplored? I'm pretty sure one cell is the famous empty one (complete physics, genuinely distinct mental properties, the mental genuinely causing the physical, and no overdetermination), and I want it marked and I want you to say what happens to someone who insists on standing in it anyway.
  - Leaves: aim for 8 or 9, each with a name and one line on its most awkward commitment. These need to be in there: the reductive identity view; eliminativism about the mental properties in question; epiphenomenalism; the non-reductive physicalist who bites the bullet and accepts that causal influence drains down to the physical; the systematic-overdetermination view; the interventionist / difference-making compatibilist; the interactionist or emergentist who simply denies completeness; the view that the mental grounds the physical rather than causing it; and the quietist who thinks causation is level- or interest-relative so the question has no determinate answer.
  - Two distinctions have to show up as branch nodes because they were doing all the work in our argument and neither of us named them: (a) whether causation is a matter of difference-making under interventions or a matter of production by a mechanism — someone who wants both will need a mu option; (b) the grain / proportionality issue, i.e. whether the effect is "the hand went up" or "the hand went up at that moment, along that arc, in the way a reach-for-coffee goes."
  - Include at least two invented test cases that nobody could just recognize from a textbook. Here's the one I tried: a subject gets a neural prosthesis that realizes the very same decision on completely different hardware, and the same reach follows — is the original neural description then merely one specification of the cause, or was it the cause and the mental description only a summary of it? Give me one or two more in that spirit. I was fumbling toward something with a device that injects randomness into the downstream motor signal while leaving the decision itself intact, but I couldnt make it do any work, so either fix it or replace it.
  - Flag any two leaves your tree genuinely can't separate, rather than papering over it. I suspect the grounding view and epiphenomenalism collapse on anything behavioural, and I suspect the interventionist and the reductionist both say "yes, the mental causes" to every case for quite different reasons. If so, tell me what extra question would split them and whether anyone really defends the distinctions needed to answer it.
  - Bottom of the page: a short notes section, one line per leaf — the sentence an opponent would find most annoying, and the one sort of case where the holder usually starts hedging.

  No names of papers, no dates, no reading list — we're not writing anything up, I just want the map, and whoever fills it in won't have library access anyway. Assume the person answering the questions is a smart undergraduate who's never taken philosophy of mind and would not know any of the labels.
