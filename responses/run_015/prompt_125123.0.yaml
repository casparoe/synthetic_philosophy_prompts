  Regarding timelines, we are removing future tense from construction permits. English speakers treat the future as distinct from the present, allowing them to delay development. Under the new code, construction is either "occurring" or "not-occurring." There is no "planned." This collapses the temporal distance required for NIMBY organizing.

  Critics say this is bureaucratic overreach. They say cognition is flexible. They are wrong. If we change the code, we change the neurons. Once the possessive morpheme is removed from the municipal lexicon, the concept of "NIMBY" will become untranslatable. You cannot oppose a building permit if your language lacks the grammar to conceptualize "my view" versus "the view."

