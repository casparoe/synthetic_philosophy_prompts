          *   *Honest Risk:* If the "coarse common knowledge" still forces exact agreement due to the structure of the partitions (Aumann's result is robust), the project fails. I need to acknowledge that "Common Knowledge of Coarse Posteriors" is a tricky beast. Sometimes knowing that *you* know my coarse posterior forces refinement. I need to be careful here. Actually, Geanakoplos and Polemarchakis (1982) showed communication converges but not necessarily to full agreement in finite steps, but Aumann's static result is strong.
