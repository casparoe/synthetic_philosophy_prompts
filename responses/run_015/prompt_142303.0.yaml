      *   *Problem:* Heterogeneous priors are a "get out of jail free" card.
      *   *Solution:* Finite precision.
      *   *Model:* $\Omega$ finite. Agents $i, j$. Partitions $\Pi_i, \Pi_j$. Prior $P$. Posteriors $q_i, q_j$. Reporting function $r: [0,1] \to G$ (finite grid). Common knowledge of $r(q_i), r(q_j)$.
      *   *Hypothesis:* $E[Gain] > 0$.
      *   *Specific Focus 1:* Structure of $G$. Uniform vs. Non-uniform. Interaction with Asset Payoff function $V(\omega)$.
      *   *Specific Focus 2:* Diagnostics. Channel enrichment ($G \to G'$) vs. Stake scaling ($k \cdot V$).
      *   *Timeline:* Break it down.
      *   *Risks:* The "Afternoon Theorem" risk. The "Zero Gap" risk.

  6.  **Review against Constraints:**
