      *   **The Question & Model:** Define the setup. Finite state space $\Omega$, Common Prior $P$, Partition information. Standard Aumann: Common Knowledge of Posteriors $\implies$ Equal Posteriors. New Model: Agents report $C(p_i)$ where $C$ is a coarsening function (mapping $[0,1]$ to a finite set $G$). Common Knowledge of *Coarse* Posteriors.
      *   **Critique of Standard Positions:** Why not Heterogeneous Priors? Unfalsifiable/Underdetermined. Why Precision? Empirically realistic (language, tick sizes), theoretically tractable (finite math), offers diagnostic potential.
      *   **The "Location" Lemma (Crucial Point 1):** Explicitly state that the distribution of the disagreement matters. Uniform grid vs. Log-odds grid vs. Psychological reporting scales. Does the gap happen where the asset pays off?
      *   **The Diagnostic (Crucial Point 2):** Comparative statics. Stakes vs. Channel Richness.
      *   **Work Plan (9 Months):**
          *   Months 1-2: Formalize model, prove existence of trade gap.
