answer: |-
  **Question 1**
  You accept the particularist's holism: a feature like "breaking a promise" can count in favor of an action in one context, against it in another, or be inert in a third. Yet you insist there are exceptionless principles of *relevance*. If a feature can be morally inert in a specific instance, in what non-trivial sense is it *always* relevant? Are you not simply redefining "relevant" to mean "not logically excluded from mattering"?

  *   **Anticipated Defense:** She will likely distinguish *being relevant* from *making a difference*. She will argue that a feature is relevant if it is a candidate for mattering, even if in a specific token case its weight is zero or overridden.
  *   **Follow-up:** If "relevant" just means "capable of mattering," doesn't that render the principle vacuous for deliberation? To tell an agent that a feature is *capable* of mattering, without specifying *when* it actually matters, seems to offer the same information as saying "anything might matter." How does this discipline attention any more than a blank check?

  **Question 2**
  Let's press that point on deliberation. If your principles fix relevance but never fix weight or verdict, what work are they doing in the moment of choice? If I know that "pain" is always relevant, but I don't know if it counts for much or little in this case, does the principle constrain my deliberation, or does it merely annotate the landscape after I've already decided what matters?

  *   **Anticipated Defense:** She will likely argue that principles constrain the *search space*. They tell you what to look for, preventing you from ignoring certain features or inventing irrelevant ones.
  *   **Follow-up:** But if the particularist agrees that we should look at all potentially salient features, what is the difference between your "relevance principle" and the particularist's demand for sensitivity? If the particularist says "look at the pain," and you say "look at the pain because it's relevant," haven't you added a label without adding a rule?

  **Question 3**
  You suggest your view avoids the particularist's "default and challenge" picture, where a principle holds *ceteris paribus* unless defeated. But if your relevance principles don't specify weight, isn't the "default" simply that the feature is present, and the "challenge" always to determine its weight? How is your architecture functionally distinct from a particularism that merely uses principles as shorthand for default tendencies?

  *   **Anticipated Defense:** She will likely insist that relevance is invariant, whereas default valence is not. She will argue that knowing a feature is *always* a candidate provides a stable vocabulary for disagreement that default claims do not.
  *   **Follow-up:** If the vocabulary is shared, but the weight is not codified, how do disputants resolve disagreements? If I say "the pain is relevant but outweighed," and you say "the pain is relevant and decisive," and we agree on all the facts, what resource does your generalism provide to settle the dispute that the particularist lacks?

  **Question 4**
  Consider two actions that share every feature your principles mark as relevant. They have the same promise-breaking, the same pain, the same intent. Yet, intuitively, one is permissible and the other forbidden. On your view, what accounts for the difference in deontic status if not a difference in relevant features?

  *   **Anticipated Defense:** She will likely deny the premise, arguing that if the verdict differs, there *must* be some further difference in the situation, perhaps in the interaction of the features or the context.
  *   **Follow-up:** If you posit a "further difference" in every case of divergent verdicts, aren't you simply pushing the holism back a level? You've secured generalism for *relevance*, but if the *interaction* of relevant features is wholly particular and uncodifiable, haven't you conceded the explanatory battle to the particularist?

  **Question 5**
  Let's assume you resist that regress. You maintain that the *combination* of relevant features is what matters, even if their weights aren't fixed. But if the moral status of an action supervenes on the relevant features, and those features are constant across your principles, what grounds the supervenience? Is there a second-order principle governing how relevance interacts, or is the interaction itself brute?

  *   **Anticipated Defense:** She will likely argue that the interaction is not brute but is sensitive to context, which doesn't need to be codified to be real. She will emphasize that morality is sensitive to the world, not just to principles.
  *   **Follow-up:** If the context determines the interaction, and context is not codifiable, then the "generalism" in your view seems to rest entirely on the labeling of features. Does this mean your view is merely a taxonomy of moral inputs without a theory of moral processing?

  **Question 6**
  I want to shift to scale. Your model seems built for an individual deliberating about a concrete situation they can perceive. But we also assess institutions, laws, and policies that affect millions of people and whose particulars nobody perceives. That kind of assessment looks like it needs aggregation and rules. How does relevance generalism handle the moral assessment of a policy where no single agent sees the whole picture?

  *   **Anticipated Defense:** She will likely argue that institutions are composed of individual actions, and the principles apply to the designers and enforcers of the policy, even if not every outcome is visible.
  *   **Follow-up:** But if the policy's moral status depends on the aggregation of millions of invisible particulars, and your principles don't codify weight, how do we judge the policy *ex ante*? If we can't calculate the weight of the relevant features across the population, isn't your view forced to say we cannot morally assess large-scale institutions until after the fact?

  **Question 7**
  Following on that: consider professional codes of conduct, legal standards, or institutional review criteria. These function as rigid rules. On your view, do these have any genuine normative force, or are they merely heuristics—useful fictions for coordination? If they are heuristics, are we ever obligated to follow them when our sensitivity to relevance suggests otherwise?

  *   **Anticipated Defense:** She will likely claim they are normative but derivative. They codify past wisdom about relevance, but sensitivity can override them in extreme cases.
  *   **Follow-up:** If sensitivity can override the code, then the code has no authority in the hard cases—the very cases where we need it most. If it has no authority in the hard cases, isn't it just a suggestion? And if morality at the institutional level is just a collection of suggestions, how do we avoid chaos?

  **Question 8**
  Let's look at cultural contingency. In a community where promises are rarely kept and not expected to be, is promise-breaking still *relevant* in your sense? If you say yes, your principles seem detached from the social practices that give them meaning. If you say no, aren't your principles empirically conditioned and culturally parochial in a way generalists should find uncomfortable?

  *   **Anticipated Defense:** She will likely argue that the feature is still relevant, but the *valence* or *weight* shifts due to the practice. The relevance of the practice itself is invariant.
  *   **Follow-up:** But if the practice determines whether the feature has traction, isn't the practice doing the moral work, not the principle? If the principle holds only in communities that sustain the practice, isn't your "generalism" just a description of local moral languages?

  **Question 9**
  This leads to the possibility of wholesale moral criticism. If we encounter a society with a radically different set of relevance principles, how do we criticize them without appealing to codified weights? If your method is to "get the other person to see the case differently," is that really distinguishable from persuasion, manipulation, or asking for deference to your own testimony?

  *   **Anticipated Defense:** She will likely argue that moral progress comes from expanding sensitivity, not imposing rules. It is persuasion, but rational persuasion based on shared human capacities.
  *   **Follow-up:** But without a shared standard of weight to appeal to, how do I know I am being persuaded rather than manipulated? If I cannot check your "sensitivity" against a principle, isn't my only recourse to trust your authority? And isn't that an epistemic surrender?

  **Question 10**
  Finally, I want to ask you to state, as precisely as you can, what would have to be true for the particularist to be right and your own position to collapse into it. What specific discovery about moral features would falsify relevance generalism? And conversely, what consideration on the particularist's side do you find hardest to answer?

  *   **Anticipated Defense:** She will likely say that if it turned out that *no* features were consistently relevant—even as candidates—her view would collapse. She may cite the "uncodifiability of ethical expertise" as the hardest objection.
  *   **Follow-up:** If ethical expertise is uncodifiable, and relevance is the only thing you claim is codifiable, isn't expertise precisely the ability to weigh relevance? If that is uncodifiable, what remains of your generalism but the claim that there is *something* to weigh? Is that enough to sustain a distinct philosophical position?
