  The setup
  You report dreams. Science confirms your brain is active while you sleep. But what is the dream itself? This chart sorts your intuition on what that activity means for reality. Answer six questions to find your theory. It maps the space between skepticism and full realism, including niche views on time and self. You need no training, only honesty about what happens in the dark.

  The branch questions
  1. When you tell a dream, did any experience happen *while* you slept, or is the story made up entirely when you wake? If you think the story is invented upon waking, your path ends here. This denies experience exists during sleep. If you think something truly happened in the dark, move to the next question.
  2. Consider a specific case: You sleep five minutes but dream of a long day. Did that day actually unfold in your mind during those minutes, or does it only feel long in retrospect? If you believe the order is assembled after waking, your path ends here. This saves experience but denies real-time flow. If you believe it unfolded during sleep, move to the next question.
  3. Consider a lucid dreamer who signals counts with eye movements during REM. Does this prove one continuous "you" was there the whole time, or just that moments occurred? If you think only disconnected moments exist, your path ends here. This allows experience but denies a continuous self. If you think a continuous subject persists, move to the next question.
  4. Was there a felt experience like watching a movie, or was it brain activity without feelings, like a computer running code? If you think there were no feelings, answer four-beta. This separates feeling from processing. If you think there were feelings, move to question five.
  4b. If there were no feelings, was there still content processed? If you say yes, your path ends here. This allows cognitive work without phenomenology. If you say no, your path ends here. This denies even content exists.
  5. If there was feeling, does dream time have to tick at the same speed as clock time, or can it stretch and shrink? If you think time can warp, your path ends here. This allows subjective duration to differ from sleep duration. If you think time must match, move to question six.
  6. Is this experience a real perception-like stream detached from senses, or something else entirely? If you say perception-like, your path ends here. This treats dreams as real perception. If you say something else, your path ends here. This treats dreams as unique states.

  The leaves
  1. Skepticism: No experience occurs during sleep. The report is a fabrication. Awkward: Must claim sincere reporters are mistaken about their own minds.
  2. Construction: Experience is real but order is assembled at waking. The story is built upon arousal. Awkward: Denies the dream unfolded in real time.
  3. Checkpoint: Real moments exist, but no binding subject. There is no traveler, only stops. Awkward: The "I" reporting is a retrospective artifact.
  4. Rehearsal: Real cognitive activity, no feelings. The brain works without a witness. Awkward: Claims rich reports emerge from sterile processing.
  5. Empty B: No feeling, no content. Pure activity without substance. Awkward: Posits activity that is neither felt nor contentful.
  6. Time-Warp: Real ordered experience, duration mismatches sleep. Minutes hold hours of life. Awkward: Requires time to function differently in sleep.
  7. Realism: Perception-like streams detached from senses. Dreams are internal seeing. Awkward: Implies hallucinations are ontologically equal to seeing.
  8. Empty A: Felt experience, not perception-like. Feeling without sensory quality. Awkward: Lacks a model for non-sensory feeling.
  9. Empty C: Time matches, not perception-like. Real time but not seeing. Awkward: Distinguishes experience from perception without clear difference.

