  Question two relies on introspection about time, which readers cannot verify. Many will refuse to answer. Also, the chart cannot separate the Skeptic from the Constructionist empirically. Both predict identical reports. The difference is purely philosophical. Readers may find this distinction meaningless in practice. The chart maps metaphysics, not data.
