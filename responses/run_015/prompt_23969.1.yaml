answer: |-
  **Term Paper Proposal**

  **Title:** The Diachronic Defense: Reassessing the Rationality of Sunk Costs Through Models of Agency

  **1. The Research Question**
  Standard decision theory posits a normative constraint: rational agents must ignore sunk costs. This principle rests on the assumption that rational choice is solely a function of future consequences. However, this constraint presupposes a specific metaphysical model of the agent: a synchronic, unified decision-maker with stable preferences and perfect access to their own utility function.

  My paper will address the following question: **Does the normative force of the sunk cost principle dissolve when the agent is modeled as a diachronic sequence of selves rather than a synchronic unity?**

  I aim to demonstrate that the verdict "always irrational" is not a universal norm of rationality, but a contingent truth that holds only under a specific, idealized model of agency. By shifting to a diachronic model—one that accounts for temporal fragmentation, preference instability, and epistemic limitations—I will argue that honoring sunk costs can be instrumentally rational in at least three distinct structural conditions.

  **2. Background and Motivation**
  The standard verdict against sunk costs is derived from Expected Utility Theory. It treats past investments as causally inert regarding future outcomes. Consequently, any decision weight given to past costs is classified as a cognitive error, often grouped with loss aversion or the endowment effect in the behavioral economics literature.

  While behavioral economics effectively describes *that* people honor sunk costs, it typically retains the standard normative verdict that they *should not*. Philosophical defenses of sunk cost reasoning usually attempt to show that apparent cases are actually misdescribed standard cases (e.g., arguing that reputation costs or learning opportunities make the cost not truly "sunk").

  These standard exceptions leave the core question open. They preserve the standard model of the agent and simply tweak the input variables. They fail to address the possibility that the *structure of the decision-maker* is the variable that matters. If an agent is not a single entity persisting through time, but a succession of temporal stages with potentially conflicting interests, the "rational" strategy for the sequence may differ from the "rational" strategy for any single stage. The standard verdict leaves this open because it treats the agent as a black box that is invariant over time. My project argues that opening this black box changes the normative calculus.

  **3. Proposed Approach and Methodology**
  I will not proceed by surveying empirical literature on the sunk cost fallacy, nor will I simply accumulate counterexamples. Empirical prevalence does not establish normative rationality, and anecdotal counterexamples can always be dismissed as errors in calculation by the standard theory.

  Instead, I will employ a method of **conceptual modeling and decision-theoretic reconstruction**. I will construct a diachronic model of agency, drawing on frameworks used in discussions of personal identity and intrapersonal bargaining. I will then test the sunk cost principle against this model to see if the "fallacy" emerges as a rational heuristic for the agent-sequence, even if it appears suboptimal to the agent-stage.

  I will focus on three specific conditions where honoring sunk costs becomes rational under this model:
  1.  **The Informational Condition:** When past investment serves as a costly signal of the agent's own stable preferences, which are otherwise opaque to the current self. Here, the sunk cost is not a cause of the choice, but evidence of the agent's true utility function.
  2.  **The Commitment Condition:** When incurring the cost was a deliberate precommitment strategy by a past self to constrain a future self prone to weakness of will (akrasia). Honoring the cost maintains the integrity of the intrapersonal contract.
  3.  **The Epistemic Condition:** When what is labeled a "sunk cost" is actually an investment in a recoverable asset (e.g., skill acquisition). This challenges the classification of the cost as "sunk" based on the agent's limited epistemic access to future recoverability.

  By analyzing these conditions through the lens of diachronic agency, I aim to show that the "fallacy" is often a rational response to the problem of self-governance over time.

  **4. Criteria for Success and Failure**
  **Success:** The project will succeed if I can demonstrate that the standard "ignore sunk costs" rule is derivative of a synchronic agent model, and that adopting a diachronic model systematically validates behaviors typically classified as fallacious. A successful paper will show that in the three conditions outlined above, maximizing long-term utility *requires* giving weight to past investments. The conclusion should be a qualified normative claim: "Honoring sunk costs is rational if and only if the agent faces specific diachronic constraints."

  **Failure:** The project would fail if the three conditions can be fully reduced to standard Expected Utility Theory without invoking a diachronic model of agency. For example, if the "Commitment Condition" is shown to be nothing more than standard precommitment theory already accounted for in the standard view, the paper would not offer a novel challenge to the sunk cost verdict. Similarly, if the argument relies on redefining "sunk cost" so broadly that the term loses its meaning, the argument would be merely verbal. Finally, if I cannot adequately formalize or clearly describe the "diachronic agent" without relying on contested metaphysics of personal identity that distract from the decision theory, the argument may lose its footing.

  **5. Scope and Feasibility Assessment**
  A 6,000-word limit presents a constraint on how deeply I can engage with the metaphysics of personal identity. There is a risk that the project is too large, as defending a diachronic model of agency is a significant philosophical undertaking in its own right.

  To keep this manageable, I will not attempt to defend a specific metaphysical theory of personal identity (e.g., Psychological Continuity vs. Biological Animalism). Instead, I will treat the "diachronic agent" as a functional model for decision theory, similar to how game theory treats players. I will bracket the metaphysical debate and focus on the *decision-theoretic implications* of assuming temporal fragmentation.

  Furthermore, I will limit the analysis to the three specific conditions outlined above. I will not attempt to vindicate *all* sunk cost reasoning, nor will I engage with every exception found in the behavioral literature. By restricting the scope to these three structural conditions, I can provide a rigorous analysis of each within the word limit.

  The project is feasible provided I remain disciplined about not drifting into general philosophy of action. The focus must remain tightly on the intersection of the sunk cost principle and the temporal structure of the decision-maker. If I can show that the standard verdict is model-relative rather than model-invariant, the paper will make a distinct contribution to the seminar topic.
