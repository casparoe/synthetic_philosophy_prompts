prompt: |-
  i mod a pretty big rationalist-adjacent forum — think the ACX/LW comment section with its own house culture, 200–400 comments a day, five of us on rotation, all volunteers, and every removal has to be justified in the thread itself because people will definately litigate it. our rule right now is "cite or hedge" and it's worthless as written: half the board satisfies it by typing "i think" and then being maximally confident, and the other half gets deleted for saying true things they happen to have no public source for.

  what i want is an actual decision procedure — checklist, ordered questions, where it stops with a no, where it hands off to a person — grounded in whatever the philosophy of assertion actually knows about this. please don't give me a reading list or point me at papers, i'm not going to chase citations. lay the terrain out in your own words. the way i understand it there are three candidate norms: assert only what you know, assert only what's true, and assert only what you're reasonably/warrantedly confident in; plus a separate fight about whether the bar moves with what's at stake for the people hearing it; plus that wierd lottery-style case where something is 99%+ probable on base rates alone and nobody "knows" it.

  constraints: 30–60 seconds per call, run by a mod who usually knows nothing about the topic; output is one of leave-alone / require-a-hedge / require-a-link / tag-unverified / remove, plus a one-sentence public justification that can't out anybody's private info; and it has to be consistent across five mods, so include a calibration set of ~8 one-line test comments with the intended output for each.

  the bits i specifically need handled:

  - step zero, is this even an assertion: rhetorical questions, "suppose p" inside an argument, jokes and sarcasm, quoting someone in order to disagree, posting a link with a one-word caption, "everyone knows", "my understanding is", "reportedly", "go look it up yourself". and separately: does reach matter? i've been applying what i call the nesting discount — a claim buried nine levels deep gets a lower bar than a top-level comment — and i can't tell if that's principled or just laziness.
  - hedges: what does "i think p" / "probably p" / "i'd put 70% on p" actually commit you to under each of the three norms? if the knowledge norm governs bare p, what governs "i think p" — knowledge of your own credence? calibration? and is a hedge a real reduction in assertoric load or just a social move? i've started calling the fake kind warrant laundering ("i'm no expert, but [extremely confident claim]", "studies show [thing i can't produce]", "people in the field say...") and i want to know whether that's one coherent category or three different things i'm collapsing.
  - warrant a mod can actually see: a public checkable source vs. a domain-local track record (i want a real "assertoric license" rule — earned by a public record of checkable claims in that one topic, expires, doesn't transfer across topics, doesn't cover insider info) vs. nothing visible at all.
  - stakes and reach: pick a side on whether the bar moves, and say what picking that side costs you. include the statistical-certainty cases — "the flight will land fine", "the approval gets delayed again", "the build ships late" — where the probability is high and the knowledge is thin.

  and the thing i keep tripping over: the norm governs the *speaker*, but moderation runs on *my* evidence. someone can fully satisfy it and still look unsourced to me; someone can violate it and look fine. be explicit about which of the two your procedure is really tracking, because i suspect our current rule is confused about exactly this.

  then run it on three: (1) a three-week-old account, top level, no track record: "scaling keeps working, i'd put 85% on capabilities improving sharply through 2027" — which half the board believes anyway. (2) a nested reply where A asks for a source and B says "this is well documented, X has been shown repeatedly" with no link, and B is basically right but the specific number is wrong. (3) the one where i won't like the answer: a verified ML researcher with a long record of correct inside-baseball posts writes "the next model drops in march, i know people there" — no citation possible, no names, i believe him and want it left up. what does your procedure do to him, and is that actually licensed by the norm or is it just my evidence problem leaking into a rule?

  close with what the procedure can't do — the failure modes i should expect (e.g. that it will systematically hit true-but-ahead-of-the-evidence claims, and let confidently wrong but well-licensed users through).
reasoning: |-
  Here's a thinking process that leads to the suggested moderation procedure:

  1.  **Analyze the Request:**
      *   **Context:** High-volume rationalist-adjacent forum (ACX/LW style), 200-400 comments/day, 5 volunteer mods, removals must be justified publicly (litigious user base).
      *   **Current Problem:** "Cite or hedge" rule is broken (fake hedges, deletion of true unsourced claims).
      *   **Goal:** A concrete decision procedure (checklist/flowchart) for mods to use in 30-60 seconds.
      *   **Outputs:** Leave-alone / Require-hedge / Require-link / Tag-unverified / Remove + 1-sentence public justification.
      *   **Constraints:** No reading lists/papers. Lay out the philosophy in plain English. Must handle specific edge cases (assertion types, hedges, warrant, stakes/reach, speaker norm vs. mod evidence).
      *   **Specific Scenarios to Test:** (1) New account, high-confidence prediction. (2) Nested reply, vague "well documented" claim, partially wrong. (3) Trusted expert, insider info, no citation possible.
      *   **Requirement:** Explicitly address the tension between *speaker's norm* (what they should do) and *mod's evidence* (what the mod can see).
      *   **Deliverables:** The philosophy/terrain, the procedure (checklist), calibration set (8 test cases), analysis of the 3 specific scenarios, and failure modes.

  2.  **Deconstruct the Philosophy (The "Terrain"):**
      *   *The Core Tension:* The user correctly identifies the gap between epistemic norms (what makes an assertion good) and moderation constraints (what a mod can verify).
      *   *The Three Norms:*
          1.  *Knowledge Norm:* Assert $p$ only if you know $p$. (Too strict for speculation, too loose for lucky guesses).
          2.  *Truth Norm:* Assert $p$ only if $p$ is true. (Impossible for mods to enforce in real-time).
          3.  *Warrant/Justification Norm:* Assert $p$ only if you have good reasons/evidence for $p$. (This is the only one actionable for mods).
      *   *The Mod's Problem:* Mods cannot see the speaker's mind (knowledge) or the future (truth). Mods can only see *warrant signals*. Therefore, the rule must be: **"Assert only what you can signal warrant for."**
      *   *Stakes/Reach:* High stakes/high reach requires higher warrant signals. A top-level comment is a broadcast; a reply is a conversation.
      *   *Hedges:* A hedge is only valid if it accurately reflects the uncertainty *and* lowers the warrant requirement. "I think" + 100% confidence is warrant laundering.
      *   *Expertise:* "Assertoric License" needs to be visible. If I can't see the license, I can't grant the exception.

  3.  **Develop the Decision Procedure (The "Algorithm"):**
      *   *Time Limit:* 30-60 seconds. Needs to be binary questions, stop on "No".
      *   *Step 0: Is it an Assertion?* Filter out non-claims.
      *   *Step 1: Reach & Stakes.* Top level vs. nested. High impact claim vs. low impact.
      *   *Step 2: Warrant Signals.* Does the comment *show* its work? (Link, data, specific reasoning).
      *   *Step 3: User License.* Does this user have a track record *in this topic*?
      *   *Step 4: The Hedge Check.* If no link/license, is the uncertainty honest?
      *   *Decision Matrix:* Map combinations to the 5 outputs.
      *   *The "Mod Evidence" vs. "Speaker Norm" Fix:* The procedure must explicitly track *Visible Warrant*. If the warrant is private (insider info), the comment gets tagged/removed unless the user has public license. This solves the "trusted researcher" problem honestly.

  4.  **Drafting the Procedure (Iterative Refinement):**
      *   *Refining Step 0:* Need to catch "Everyone knows" (assertion) vs. "Suppose p" (not assertion).
      *   *Refining Step 1 (Reach):* Validate the "Nesting Discount." It is principled. Top level = broadcast = higher bar. Nested = conversation = lower bar.
      *   *Refining Step 3 (License):* How does a mod know in 30 seconds? Look at comment history *in that thread or subforum*. If they are new or always talk about cooking, no license for ML.
      *   *Refining the Outputs:*
          *   *Leave-alone:* High warrant OR Low stakes + Honest Hedge.
          *   *Require-hedge:* Confident claim, low/med warrant, low stakes.
          *   *Require-link:* High stakes, specific factual claim, no license.
          *   *Tag-unverified:* High warrant user, private info (insider), high trust but low public verifiability.
          *   *Remove:* Warrant laundering, high stakes, no license, deceptive hedge.

  5.  **Addressing the Specific Constraints:**
      *   *Hedges:* Distinguish between *Epistemic Hedges* (lowering confidence) and *Social Hedges* ("I'm no expert but..."). Only Epistemic Hedges count.
      *   *Stakes:* Pick a side. *Yes, the bar moves.* Cost: It penalizes high-stakes truth-tellers without public credentials. Benefit: Prevents high-stakes misinformation.
      *   *Lottery Cases:* Treat as "Statistical Warrant." If base rates are the warrant, cite the base rate.

  6.  **Developing the Calibration Set (8 Cases):**
      *   Need a mix of topics, user types, and depths.
      *   1. Joke/Sarcasm (Leave-alone).
      *   2. New user, top level, strong claim, no link (Require-link/Remove).
      *   3. Old user, niche topic, specific claim (Leave-alone).
      *   4. "I think" + 100% confidence (Require-hedge).
      *   5. Nested reply, "studies show" (Require-link).
      *   6. Insider info, trusted user (Tag-unverified).
      *   7. Low stakes, nested, wrong but honest (Leave-alone).
      *   8. "Everyone knows" (Require-link/Hedge).

  7.  **Running the Three Test Scenarios:**
      *   *Scenario 1 (New account, 85% prediction):* High stakes (capabilities), Top level, No license. -> **Require-link** or **Require-hedge** (depending on if it's treated as prediction vs fact). Let's say Require-hedge + justification about track record. Actually, prediction *is* the claim. If no reasoning, it's a guess. **Require-link/Reasoning.**
      *   *Scenario 2 (Nested, "well documented", wrong number):* Low stakes (nested), Warrant laundering ("well documented"). -> **Require-link.**
      *   *Scenario 3 (Trusted researcher, insider info):* High trust, Private warrant. This is the crux. If the rule is "Visible Warrant," this fails. If we allow "Assertoric License," this passes. The prompt asks for an "Assertoric License" rule. So -> **Tag-unverified** (to signal to readers "trust the user, not the public evidence") or **Leave-alone** if license is strong enough. Let's go with **Tag-unverified** to be transparent about the epistemic status.

  8.  **Final Review against Constraints:**
      *   30-60 seconds? Yes, flowchart style.
      *   One-sentence justification? Included in the procedure.
      *   Consistency? The checklist enforces it.
      *   Failure modes? Must be explicit (e.g., kills true insider info without tag, lets confident liars with good reputations through).

  9.  **Writing the Response:**
      *   *Tone:* Direct, operational, philosophical but practical. No fluff.
      *   *Structure:*
          1.  The Philosophy (Speaker Norm vs. Mod Evidence).
          2.  The Procedure (The Checklist).
          3.  The Calibration Set.
          4.  The Three Scenarios.
          5.  Failure Modes.

      *(Self-Correction during drafting)*: I need to be careful about the "Tag-unverified" option. Most forums don't have this feature. I should frame it as "Leave-alone with Mod Note" or just acknowledge it might require a plugin. I will assume the technical capability exists or suggest "Leave-alone + Mod Comment" as the proxy. Let's stick to the prompt's allowed outputs: *leave-alone / require-a-hedge / require-a-link / tag-unverified / remove*. Okay, "tag-unverified" is explicitly allowed in the prompt. Good.

      *(Refining the "Stakes" position)*: The prompt asks me to "pick a side." I will argue for **Contextual Warrant**. The bar *must* move with reach. A top-level comment is a speech; a reply is a conversation. The cost is silencing high-stakes truth from unknowns. The benefit is stopping high-stakes lies from unknowns.

      *(Refining the "Mod Evidence" vs "Speaker Norm")*: I need to be crystal clear. The procedure tracks **Visible Warrant**. It does not track Truth or Knowledge. It tracks *signals* of Knowledge. This solves the "mod can't read minds" problem.

      *(Refining the "Hedge" definition)*: "I think" is not a hedge if the sentence implies certainty. A hedge must lower the truth-condition. "Probably" works. "I think" + "is definitely" does not.

      *(Final Polish)*: Ensure the 8 calibration cases cover the edge cases mentioned (jokes, nesting, license, hedges). Ensure the 3 scenarios are analyzed strictly by the procedure.

      *Wait, one detail:* "five of us on rotation... every removal has to be justified in the thread itself." The procedure needs to generate that justification string. I will add a "Copy-Paste Justification" column to the decision matrix.

      *Let's build the checklist.*
      Q1: Assertion?
      Q2: Reach (Top vs Nested)?
      Q3: License (History in topic)?
      Q4: Warrant (Link/Data/Reasoning)?
      Q5: Hedge (Honest uncertainty?)

      *Okay, ready to write.*
answer: |-
  ### The Terrain: Speaker Norm vs. Mod Evidence

  You are correct that your current rule fails because it conflates the **Speaker's Norm** (what makes an assertion epistemically responsible) with the **Mod's Evidence** (what you can verify in 30 seconds).

  *   **Speaker's Norm:** "Assert only what you warrantedly believe." (Internal state).
  *   **Mod's Evidence:** "Assert only what shows visible warrant." (External signal).

  You cannot moderate the internal state. You can only moderate the signal. Therefore, your rule must be: **"Signal your warrant proportionate to your reach."**

  **The Three Norms, Resolved:**
  1.  **Knowledge:** Too strict. Kills speculation and insider info.
  2.  **Truth:** Impossible. You don't know the truth yet.
  3.  **Warrant:** **This is the one you enforce.** A claim is permissible if the *visible support* matches the *claim's weight*.

  **On Stakes and Reach:**
  Pick the side that **the bar moves.** A top-level comment is a broadcast; a nested reply is a conversation.
  *   **Cost:** You will silence high-stakes truths from unknowns (the "Cassandra" problem).
  *   **Benefit:** You prevent high-stakes misinformation from unknowns (the "Grifter" problem).
  *   **Nesting Discount:** This is principled, not lazy. Attention decays with depth. A claim at depth-5 affects fewer beliefs than depth-0. Lower reach = lower warrant requirement.

  **On Hedges:**
  A hedge is only valid if it *lowers the truth condition*.
  *   **Valid:** "Probably," "Likely," "My model suggests," "70%." (Admits falsifiability).
  *   **Invalid (Warrant Laundering):** "I think" (followed by certainty), "Studies show" (no study), "Experts say" (no names). These claim authority without showing the warrant.

  **On Assertoric License:**
  License is **topic-specific** and **time-bound**. A user is "licensed" only if they have a public history of *checkable* claims in *that specific domain* within the last 6 months. Insider info is **private warrant**. It requires a **Tag**, not a free pass, because the audience cannot verify it.

  ---

  ### The Procedure: "Visible Warrant Checklist"

  **Time Limit:** 45 seconds.
  **Mod Mindset:** Do not judge truth. Judge the *ratio* of Claim Weight to Visible Support.

  #### Step 0: Is this an Assertion?
  *   **No:** Jokes, sarcasm, "Suppose P," rhetorical questions, quoting to disagree, "Go look it up."
      *   *Action:* **Leave-alone.**
  *   **Yes:** States P as fact, probability, or consensus. Includes "Everyone knows," "X is true."
      *   *Action:* Proceed to Step 1.

  #### Step 1: Assess Reach (The Nesting Discount)
  *   **Top-Level / High Visibility:** OP, top comment, or highly upvoted.
      *   *Standard:* **High Warrant Required.**
  *   **Nested / Low Visibility:** Depth 3+, replying to specific user, low engagement.
      *   *Standard:* **Low Warrant Required.**

  #### Step 2: Check Assertoric License (30-sec history scan)
  *   **Licensed:** User has 3+ prior comments in this *specific topic* (e.g., ML, bio, policy) that were specific, checkable, and not retracted/corrected.
      *   *Privilege:* May assert without links; may use private warrant (insider info).
  *   **Unlicensed:** New account, or history is off-topic/general.
      *   *Privilege:* None. Must show public warrant.

  #### Step 3: Evaluate Warrant Signals
  *   **Public Warrant:** Link to data/paper, specific calculation, chain of reasoning shown in text.
  *   **Private Warrant:** "I know people," "Internal doc," "Trust me." (Only valid if Licensed).
  *   **No Warrant:** Bare assertion, "Studies show," "Common knowledge."

  #### Step 4: The Hedge Check (If Warrant is Low)
  *   **Honest Hedge:** "Probably," "Maybe," "I suspect," "% probability."
      *   *Effect:* Lowers Claim Weight.
  *   **Fake Hedge:** "I think [certainty]," "I'm no expert but [definite fact]."
      *   *Effect:* Ignored. Treat as bare assertion.

  #### Decision Matrix

  | Reach | License | Warrant Signal | Hedge | **Output** | **Public Justification (Copy-Paste)** |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Top** | No | None | No | **Remove** | "Removed: High-visibility claim requires public warrant or established topic license." |
  | **Top** | No | None | Yes | **Require-Hedge** | "Comment: Please clarify uncertainty level; current phrasing implies certainty without evidence." |
  | **Top** | No | Link/Data | Any | **Leave-alone** | (No action) |
  | **Top** | Yes | Private/None | Any | **Tag-Unverified** | "Mod Note: Claim relies on non-public information from a licensed user; treat as unverified." |
  | **Nested** | No | None | No | **Require-Link** | "Reply: Please provide a source for this factual claim or soften to opinion." |
  | **Nested** | No | None | Yes | **Leave-alone** | (No action) |
  | **Nested** | Yes | Private/None | Any | **Leave-alone** | (No action) |
  | **Any** | Any | **Fake Hedge** | N/A | **Require-Hedge** | "Comment: Phrasing ('I think', 'Studies show') implies warrant not present; please cite or clarify uncertainty." |

  ---

  ### Calibration Set (8 Test Cases)

  1.  **"LOL imagine if the model eats the internet lmao"**
      *   *Output:* **Leave-alone.** (Step 0: Not an assertion/Joke).
  2.  **"Scaling laws will break by 2026. [No link, New Account, Top Level]"**
      *   *Output:* **Remove.** (Step 1: Top + Step 2: No License + Step 3: No Warrant).
  3.  **"I'd guess ~60% chance scaling breaks by 2026 based on current loss curves. [New Account, Top Level]"**
      *   *Output:* **Leave-alone.** (Step 4: Honest hedge lowers claim weight enough for Top Level).
  4.  **"This is well-documented in the literature. [No link, Nested, Licensed User]"**
      *   *Output:* **Require-Link.** (Step 3: "Well-documented" is a warrant claim, not a hedge. Even licensed users must cite if claiming external consensus).
  5.  **"My contact at OpenAI says the drop is delayed. [Licensed ML User, Top Level]"**
      *   *Output:* **Tag-Unverified.** (Step 2: Licensed + Step 3: Private Warrant. Audience needs to know this isn't public fact).
  6.  **"I'm no expert but the GDP numbers are definitely faked. [No link, Nested]"**
      *   *Output:* **Require-Hedge.** (Step 4: Fake Hedge. "Definitely" overrides "I'm no expert").
  7.  **"Everyone knows the build is broken. [Nested, Unlicensed]"**
      *   *Output:* **Require-Link.** (Step 0: "Everyone knows" is an assertion of consensus. Requires warrant).
  8.  **"If we assume compute is the bottleneck, then [X]. [Nested, Unlicensed]"**
      *   *Output:* **Leave-alone.** (Step 0: Conditional/Supposition inside an argument).

  ---

  ### Running Your Three Scenarios

  **Scenario 1: New Account, Top Level, "85% on capabilities improving sharply through 2027"**
  *   **Analysis:** Top Level (High Reach) + Unlicensed (No History) + No Public Warrant (No reasoning/link) + Honest Hedge (85%).
  *   **Procedure:** Step 4 saves it. The probability claim *is* the hedge. It lowers the truth condition from "Will happen" to "Is likely."
  *   **Output:** **Leave-alone.**
  *   **Why:** A specific probability assignment is a valid warrant signal for speculation. It invites calibration later.
  *   **Correction:** If the comment was "Capabilities *will* improve (85%)," it's the same. If it was "Capabilities *are* improving sharply" (implied 100%), it triggers **Require-Hedge**.
  *   **Refined Output:** **Leave-alone** (provided the 85% is explicit). If implicit confidence, **Require-Hedge**.
  *   **Justification:** "Comment: Specific probability estimate provided; acceptable for speculative top-level claim."

  **Scenario 2: Nested Reply, "This is well documented, X has been shown repeatedly" (No link, B is mostly right)**
  *   **Analysis:** Nested (Low Reach) + Unlicensed (Assumed for B) + Warrant Claim ("Well documented") + No Link.
  *   **Procedure:** Step 3. Claiming "X has been shown" is an assertion of public evidence. "Well documented" is warrant laundering if no link is provided.
  *   **Output:** **Require-Link.**
  *   **Justification:** "Reply: Claim relies on existing literature; please cite specific studies to support 'well documented'."
  *   **Note:** Even though B is "basically right," the rule tracks *visible warrant*, not truth. This prevents the "broken clock" problem.

  **Scenario 3: Verified ML Researcher, "Next model drops in March, I know people there" (No citation)**
  *   **Analysis:** Top Level (High Reach) + Licensed (Verified/Track Record) + Private Warrant ("Know people").
  *   **Procedure:** Step 2 (Licensed) + Step 3 (Private Warrant).
  *   **Output:** **Tag-Unverified.**
  *   **Justification:** "Mod Note: Claim relies on non-public information from a licensed user; treat as unverified."
  *   **Is this licensed by the norm?** Yes. The norm is *Visible Warrant*. The user has *Private Warrant*. The Tag bridges the gap: it tells the audience "The Mod checked the license, but you cannot check the evidence." This solves your evidence problem without lying to the readers. If you *Leave-alone*, you hide the epistemic status. If you *Remove*, you lose valuable info. The Tag is the honest compromise.

  ---

  ### Failure Modes (What This Procedure Cannot Do)

  1.  **The Cassandra Problem:** You will systematically remove true, high-stakes claims from unknowns who lack the time or ability to compile public warrant (e.g., a whistleblower with a single document they can't share).
      *   *Mitigation:* Allow "Message the Mods" for warrant submission, but do not post the comment until verified.
  2.  **The Grooming Grifter:** A user can build a "License" by making safe, checkable, trivial claims for 3 months, then cash out with one big lie in that domain.
      *   *Mitigation:* License expires after 6 months of inactivity. Revoke license immediately upon one significant correction/retraction.
  3.  **The Bureaucratic Chill:** Users will stop making speculative top-level comments because the "Tag-Unverified" or "Require-Link" friction feels punitive.
      *   *Mitigation:* Enforce the "Nesting Discount" heavily. Encourage speculation in nested threads where the bar is lower.
  4.  **Mod Consistency Drift:** Five mods will interpret "Licensed" differently.
      *   *Mitigation:* Maintain a shared, simple spreadsheet of "Licensed Users by Topic" updated weekly. Do not rely on memory.

  **Final Note on Consistency:**
  This procedure prioritizes **process over truth**. You are not arbitrating reality; you are arbitrating the *rules of engagement*. When a user complains, do not argue about whether their claim was true. Argue about whether they followed the warrant-signaling procedure. "I know I was right, but you didn't let me post" is a feature, not a bug—it means the system protected the epistemic commons from unsourced assertion, even when lucky.
