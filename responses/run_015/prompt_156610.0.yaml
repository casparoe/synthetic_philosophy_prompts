answer: |-
  - "Branch questions"
  1. **TABLE:** Is behavioral identity sufficient for belief attribution, or does the lookup mechanism negate it? (Probes behaviorism vs. structuralism; both live because computation feels distinct from retrieval.)
  2. **MIRROR:** If the model fails your standard, do humans pass it? (Probes species neutrality; live because biological intuitions conflict with functional parity.)
  3. **CAUSAL-HISTORY (Extra):** If humans pass, is it because of world-contact history? (Probes grounding vs. exceptionalism; live because some deny history matters while others insist on it.)
  4. **MASSIVE ERROR:** Does massive inconsistency block attribution even if behavior fits? (Probes charity principle; live because predictive accuracy conflicts with rationality norms.)
  5. **PATCH:** Do latent causal roles count without behavioral manifestation? (Probes dispositionalism vs. structural realism; live because interpretability finds hidden states.)
  6. **SIDECAR:** Is task behavior sufficient for truth despite systematically lying avowals? (Probes ontological commitment; live because one can accept utility without literal truth.)

  - "The tree"
  **Q1 TABLE (Mechanism Matters?)**
  *   **Yes** (Model lacks belief) → **Q2 MIRROR** (Humans pass?)
      *   **No** (Neither pass) → **Eliminativism**
      *   **Yes** (Humans pass) → **Q3 CAUSAL-HISTORY** (History required?)
          *   **Yes** → **Grounding Requirement**
          *   **No** → **Human-Exceptionalist Skepticism**
  *   **No** (Behavior suffices) → **Q4 MASSIVE ERROR** (Charity required?)
      *   **Yes** → **Charity-Constrained Interpretivism**
      *   **No** → **Q5 PATCH** (Latent states count?)
          *   **Yes** → **Causal-Role Structural Realism**
          *   **No** → **Q6 SIDECAR** (Behavior literally true?)
              *   **Yes** → **Full-Strength Behavioral Instrumentalism**
              *   **No** → **Fictionalist Instrumentalism**

  - "Leaves"
  1.  **Eliminativism:** Awkwardly commits to humans lacking beliefs too.
  2.  **Grounding Requirement:** Awkwardly denies belief to brains-in-vats.
  3.  **Human-Exceptionalist:** Awkwardly admits species bias without mechanism difference.
  4.  **Charity-Constrained:** Awkwardly denies belief to highly irrational agents.
  5.  **Causal-Role Realism:** Awkwardly attributes belief to inactive latent vectors.
  6.  **Behavioral Instrumentalism:** Awkwardly equates lookup tables with thinkers.
  7.  **Fictionalist:** Awkwardly uses belief-talk while denying its truth.

  - "Unoccupied cells"
  The tree permits **TABLE=Yes** (mechanism matters) combined with **PATCH=Yes** (latent states count). This is incoherent: if the lookup mechanism negates belief due to lack of computation, why would a latent vector in that same system count as a belief? It requires believing structure matters only when it supports your conclusion.
  Another empty cell is **MIRROR=No** (Humans fail) with **MASSIVE ERROR=Yes** (Charity required). If humans fail the initial bar, charity constraints on consistency are moot. This position is unexplored because eliminativists usually reject charity constraints entirely.
  A third is **SIDECAR=Yes** (Avowals lie, behavior true) with **Fictionalist**. If you accept behavior as literally true despite lying avowals, you are a Realist, not a Fictionalist. To occupy this, one would need to argue behavior is "true" but belief is still a fiction—a distinction requiring a nuanced ontology of action separate from mind.

  - "Where the tree fails"
  This instrument cannot separate **Phenomenological Realism** from **Functionalism**. Both might land on Behavioral Instrumentalism, yet one insists on qualia while the other denies them. It also fails to distinguish **Teleosemantics** from **Causal-History** grounding; both require history, but for different reasons (function vs. contact). A case involving a system with causal history but no evolutionary function (e.g., a randomly grown neural net) would be needed to split these, but such a case is currently hypothetical.
