answer: |-
  ### (1) Exam Question

  **Course:** PHIL 305: Descartes and the Boundaries of Mind
  **Exam:** Final Take-Home Component (In-Class Writing Session)
  **Time Allowed:** 45 Minutes
  **Word Count:** Approximately 1,000 words
  **Total Marks:** 25

  **Question:**

  Descartes asserts that the human body and the animal body are constructed from identical material components and operate according to the same mechanical laws: circulation is driven by **vital heat**, motion is conveyed via **animal spirits** through hollow nerves, and reflexive behaviors arise from hydraulic pressure rather than internal representation. Given this physiological identity, explain how Descartes justifies the claim that human bodily movements often require the substantial union of a rational soul, whereas identical movements in animals require no soul whatsoever.

  In your response, you must address the following:
  1.  How the **pineal gland** functions differently in humans than in animals, despite being physically identical.
  2.  Why the denial of a **sensitive soul** in animals is necessary for Descartes' metaphysics, rather than merely denying them a *rational* soul.
  3.  How the criteria of **language** and **adaptive reason** serve as the only empirical markers for this metaphysical distinction, distinguishing voluntary action from complex reflex.

  *Note: Answers that merely summarize the "beast-machine" doctrine without engaging the physiological mechanisms or the specific problem of volition will not receive passing marks.*

  ***

  ### (2) Model Answer: Required Argumentative Moves

  A top-tier response (20–25 marks) must not simply narrate Descartes' views but must reconstruct the *argument* that bridges the gap between identical physiology and disparate ontology. The essay should follow this logical progression:

  **1. Establishing the Physiological Premise (The Concession)**
  *   **Move:** Acknowledge that for Descartes, the *res extensa* (extended substance) of a human is ontologically identical to that of a beast.
  *   **Detail:** Explicitly reference the course material on **animal spirits** and **vital heat**. The student must clarify that these are purely corpuscular/mechanical entities, not mental or quasi-vital forces.
  *   **Argument:** In both species, sensory input triggers a mechanical rearrangement of spirits in the brain, which inflates muscles to produce motion. A dog fleeing fire and a human pulling a hand from fire share the same *mechanical* etiology.

  **2. The Pineal Gland and the Site of Union**
  *   **Move:** Explain that the pineal gland is the *only* point of interaction between mind and body, yet its mechanical function is the same in both species.
  *   **Detail:** In animals, the gland is moved *passively* by the flow of spirits (reflex). In humans, the rational soul can *actively* tilt or direct the gland against the flow of spirits.
  *   **Argument:** The distinction is not anatomical but causal. In humans, the soul introduces a "counter-movement" to the hydraulic pressure. This allows for voluntary action (stopping a reflex) which is impossible in a closed mechanical system like an animal.

  **3. The Denial of the Sensitive Soul**
  *   **Move:** Address the interpretive problem: Why deny the sensitive soul entirely rather than just the rational one?
  *   **Detail:** If animals possessed a sensitive soul (as per Scholasticism), their perception would involve *conscious awareness* (qualia), not just mechanical registration.
  *   **Argument:** Descartes argues that since all animal behavior (including apparent pain responses) can be fully explained by mechanism (spirits/heat), positing a sensitive soul violates the principle of parsimony and threatens the dualist distinction. If matter can feel, the mind is not distinct. Therefore, animals are not "unconscious humans"; they are unconscious machines.

  **4. Language and Adaptive Reason as the Criterion**
  *   **Move:** Connect the metaphysical distinction to empirical observation.
  *   **Detail:** Language is not just communication (birds can communicate); it is the **indefinite rearrangement of signs** to express novel thought.
  *   **Argument:** Animals show "fixed dispositions" (a clock tells time perfectly but cannot adapt to a new task). Humans show "universal reason." Because mechanism is deterministic and fixed, any action displaying genuine adaptability or linguistic creativity *must* originate from the rational soul. This is the *necessary* sign of the soul's presence, distinguishing voluntary human action from complex animal reflex.

  **5. Synthesis: Resolving the Tension**
  *   **Move:** Conclude by directly answering the prompt's core tension.
  *   **Argument:** The reason identical movements require a soul in humans but not animals is that in humans, the movement *might not have happened* (or might have been inhibited) due to volition. In animals, the movement *had to happen* given the mechanical antecedents. The soul is required not to produce the motion *per se*, but to break the chain of mechanical necessity.

  ***

  ### (3) Marking Scheme

  **Total Marks: 25**

  **A. Physiological Accuracy & Mechanism (5 Marks)**
  *   **5:** Correctly defines animal spirits and vital heat as purely mechanical/corpuscular. Explains the hydraulic nerve model accurately.
  *   **3:** Vague on physiology; treats spirits as ambiguous energy.
  *   **0:** Treats animal spirits as mental forces or fails to mention them.
  *   **Penalty:** Deduct 2 marks if the student implies animal spirits have any cognitive or sensory quality in beasts.

  **B. The Pineal Gland & Volition (5 Marks)**
  *   **5:** Clearly distinguishes between the gland being moved *by* spirits (animal/reflex) vs. moved *by* the soul (human/voluntary).
  *   **3:** Identifies the pineal gland but fails to explain the directional causality (soul vs. spirits).
  *   **0:** Does not mention the pineal gland or claims it is anatomically different in humans.
  *   **Penalty:** Deduct 2 marks if the student suggests the human pineal gland is physically larger or structurally unique (it is the *use*, not the *structure*, that differs).

  **C. The Sensitive Soul & Ontology (5 Marks)**
  *   **5:** Explicitly argues that Descartes denies the *sensitive* soul, not just the rational one, to preserve the matter/mind dualism.
  *   **3:** States animals have no soul but fails to explain why the "sensitive" principle is subsumed into mechanism.
  *   **0:** Claims animals have a sensitive soul but lack a rational soul (Scholastic view).
  *   **Penalty:** Deduct 3 marks for conflating Descartes with modern behaviorism (i.e., claiming Descartes thinks animals *feel* pain but hide it).

  **D. Language & Adaptive Reason Criterion (5 Marks)**
  *   **5:** Correctly identifies language as a sign of *general-purpose reason* (adaptability), not just signaling. Distinguishes fixed reflex from voluntary action.
  *   **3:** Mentions language but treats it as a sufficient condition without explaining *why* it proves a soul (adaptability argument).
  *   **0:** Claims language is the only difference without linking it to reason or mechanism.
  *   **Penalty:** Deduct 2 marks if the student argues language is a *sufficient* criterion on its own without the backing of adaptive reason (Descartes argues language is the *sign* of the reason).

  **E. Coherence & Critical Synthesis (5 Marks)**
  *   **5:** Directly addresses the prompt's tension: explains why identical mechanics yield different metaphysical requirements (necessity vs. contingency of action).
  *   **3:** Addresses the tension but relies on generalities ("humans are special").
  *   **0:** Ignores the tension; writes a general summary of Descartes' view on animals.
  *   **Penalty:** Deduct 2 marks for anachronisms (e.g., referencing evolution, neuroscience, or modern cognitive ethology).

  **Specific Errors & Automatic Deductions:**
  *   **Modern Behaviorism:** If the student claims Descartes' view is a precursor to Skinner or denies inner life in *humans*, cap Section C at 1 mark.
  *   **Uniform Mechanism Failure:** If the student argues that human bodies operate on *different* physical laws than animal bodies (rather than the same laws plus a soul), cap Section A at 1 mark.
  *   **Word Count:** Essays under 800 words or over 1,200 words incur a 1-mark penalty.
