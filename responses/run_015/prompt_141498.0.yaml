answer: |-
  Here is a complete lesson plan designed to meet your constraints. It uses a modified Nash Demand Game to isolate the logic of Safe Pareto Improvements (SPI) without requiring the terminology until the end.

  ### 1. The Game: "The 100-Claim"

  **Setup:**
  *   **Pairs:** 9 pairs of students.
  *   **Pot:** 100 points per pair per round.
  *   **Moves:** Students choose a "Claim" from **{40, 50, 60}**.
  *   **Payoff:**
      *   If Claim A + Claim B $\le$ 100: Each gets their Claim.
      *   If Claim A + Claim B > 100: Both get **0**.
  *   **Incentive:** Top total score across all rounds gets the voucher/credit.

  **Why this game?**
  *   **Arithmetic only:** Addition and comparison.
  *   **Visible Conflict:** 60+60=120 (Crash). 60+50=110 (Crash). 60+40=100 (Success).
  *   **The Baseline:** You will instruct them that their "Default Programming" is to claim **60**. This creates a known baseline strategy ($S_{default}$) against which improvements can be measured.

  ---

  ### 2. Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Round 1: The Default** | Pairs play simultaneously. Both are *required* to write "60". Result: Everyone gets 0. Frustration established. |
  | **10–25** | **Round 2: The Patch** | Students submit **Rules** instead of numbers. TA resolves conflicts. |
  | **25–40** | **Phase 3: Red Teaming** | "Adversaries" try to break the rules. Testing for *Safety*. |
  | **40–55** | **Round 3: The Clash** | Pairs play Rules against Rules. Loops/Cycles result in 0. |
  | **55–75** | **Debrief** | Connect activity to SPI, robustness, and equilibrium. |

  ---

  ### 3. Materials & Submission Sheets

  You need two types of slips.

  **A. The Rule Submission Slip (for Round 2 & 3)**
  > **Name:** _______________
  > **Default Claim:** [ 60 ] *(Pre-printed, cannot change)*
  > **EXCEPTION RULE:**
  > "IF my partner's Default is **60** AND they submit a Rule that results in them claiming **60**..."
  > **THEN I will claim:** [ ____ ] *(Must be 40 or 50)*
  >
  > *Note: If your condition is not met, you claim your Default (60).*

  **B. The Adversary Test Sheet (for Phase 3)**
  > **Rule Being Tested:** "If Opponent claims 60, I claim 40. Else 60."
  > **Your Job:** Pick a move for the Opponent (40, 50, or 60) that makes the Rule-Writer get **FEWER** points than they would have gotten by just playing 60.
  > **Opponent Move:** [ ____ ]
  > **Rule-Writer Payoff:** [ ____ ]
  > **Default (60) Payoff:** [ ____ ]
  > **Did you break it?** [ Yes / No ]

  ---

  ### 4. Step-by-Step Flow

  #### Round 1: The Default (10 mins)
  *   **Instruction:** "You are agents. Your code is written. You must Claim 60. Write 60. Swap papers."
  *   **Outcome:** Every pair sums to 120. Every pair gets 0 points.
  *   **Comment:** "Nobody won. The system is broken. You cannot change your Default (60), but in the next round, you may write an **Exception Rule**."

  #### Round 2: The Patch (15 mins)
  *   **Instruction:** "You still Default to 60. But you can write an IF/THEN exception. You want to get points. You do not know what your partner will write."
  *   **TA Role:** Collect slips. For each pair, the TA reads the two rules.
      *   *Case A (One Rule, One Default):* TA evaluates the Rule against the Default 60.
      *   *Case B (Two Rules):* TA checks if conditions trigger.
          *   *Example:* Both write "If you 60, I 40." -> Both conditions trigger. Both claim 40. Sum 80. Payoff (40, 40). **Success.**
          *   *Example:* One writes "If you 60, I 40." Other writes "If you 40, I 60." -> Loop/Conflict. **TA awards 0 to both.** (Crucial for later debrief).
  *   **Outcome:** Many pairs will discover the "If 60, then 40" patch. They get 40 points each. Better than 0.

  #### Phase 3: Red Teaming (15 mins)
  *   **Goal:** Test if the patch is *Safe*.
  *   **Setup:** Pick 3 pairs who found a working rule (e.g., "If 60, then 40"). Pick 3 other students to be **Adversaries**.
  *   **Task:** Give the Adversary the Rule Slip and the Test Sheet.
  *   **Instruction to Adversary:** "Your job is not to win. Your job is to make the Rule-Writer regret changing their code. Find a move (40, 50, or 60) for the Partner that makes the Rule-Writer get *less* than they would have if they just played 60."
  *   **Execution:**
      *   Rule: "If Opp 60 -> I 40. Else -> I 60."
      *   Adversary tries Opp=50.
      *   Rule triggers "Else" -> I claim 60.
      *   Sum: 60 + 50 = 110. Payoff: 0.
      *   Default (60) vs Opp 50: Sum 110. Payoff: 0.
      *   *Result:* Adversary cannot find a case where the Rule is *worse* than Default.
  *   **Key Moment:** If an Adversary claims they broke it, check the math publicly. If the Rule never yields *less* than the Default, it is **Safe**.

  #### Round 3: The Clash (15 mins)
  *   **Instruction:** "Everyone submit a Rule again. But this time, your Partner is also trying to optimize. If your rules create a logical loop (e.g., I wait for you, you wait for me), the TA declares a Crash (0 points)."
  *   **The Trap:** Encourage complex rules like "I will match whatever you claim."
      *   Pair A: "I match you."
      *   Pair B: "I match you."
      *   TA: "Undefined. 0 points."
  *   **Outcome:** Simple SPI rules (If 60->40) still work. Complex "best response" rules often crash.

  ---

  ### 5. The Debrief Script (20 mins)

  **Step 1: Name the Concept (2 mins)**
  *   **Say:** "What you invented in Round 2 has a name in philosophy and AI safety. It's called a **Safe Pareto Improvement**."
  *   **Write on Board:**
      1.  **Safe:** You never do worse than your baseline, no matter what they do.
      2.  **Pareto:** In some cases, you both do better.
      3.  **Improvement:** It beats the Default.

  **Step 2: Quantifying over Behavior (5 mins)**
  *   **Ask:** "In Phase 3, what was the Adversary trying to do?"
  *   **They'll say:** "Find a move that hurts us."
  *   **Say:** "Exactly. They were testing the **'For All'** quantifier. An SPI isn't about guessing what the other person *will* do. It's about guaranteeing that *whatever* they do, you aren't worse off than your baseline. You don't need a model of their mind. You just need to check the math against every possible move."

  **Step 3: Safety vs. Equilibrium (5 mins)**
  *   **Ask:** "In Round 3, why did the 'I match you' rules fail?"
  *   **They'll say:** "We got stuck." / "It was a loop."
  *   **Say:** "Right. The SPI ('If 60, then 40') works because it treats the other person's move as a **fixed fact**. It doesn't try to outsmart them. When you try to play an Equilibrium strategy ('I'll do whatever is best given what you do'), you require them to do the same. If you both try to be optimal simultaneously without coordination, you can crash. SPI sacrifices *optimality* for *robustness*."

  **Step 4: The Breakdown (5 mins)**
  *   **Ask:** "Does the SPI guarantee we get the best possible score (50/50)?"
  *   **They'll say:** "No, we got 40/40."
  *   **Say:** "Correct. The SPI guarantees you won't starve (0). It doesn't guarantee you'll feast (50). It protects you from the *baseline disaster*. If the other person is playing '50' (a nice move), your SPI ('If 60->40, Else 60') still plays 60. You crash (0). The SPI is safe against the *Default*, but it isn't magic against *everything*."
  *   **Key Point:** "The guarantee holds only if the 'Default' is the thing you are comparing against. If the world changes, your safety might just be safety against a ghost."

  **Step 5: Why this matters for AI (3 mins)**
  *   **Say:** "In AI coordination, we can't trust that another AI models us correctly. We can't trust Nash Equilibrium because computing it might be impossible or unstable. But if we can program our AI to say, 'I will never play a move that is worse for both of us than my default setting,' we can cooperate without trusting each other's internal code. That is the power of the argument."

  ---

  ### 6. Predictable Failure Modes & Fixes

  | Failure Mode | Why it happens | Fix |
  | :--- | :--- | :--- |
  | **Students pick 50 in Round 1** | They ignore the "Default 60" instruction. | **Fix:** Collect Round 1 slips immediately. If anyone writes 50, tell them privately: "Your agent is malfunctioning. For the experiment to work, you must run the Default code (60)." |
  | **TA gets bogged down in logic loops** | Rules like "If you play what I play..." are hard to resolve quickly. | **Fix:** Pre-rule: "If the TA cannot resolve the outcome in 30 seconds, it is a Crash (0 points)." This penalizes over-complexity. |
  | **Adversaries don't understand the task** | They try to maximize their own score instead of minimizing the Rule-Writer's. | **Fix:** Frame it as "Break the Code." Give them a small bonus (candy/sticker) if they successfully find a case where the Rule scores *lower* than the Default. |
  | **Students think SPI = Altruism** | They think "If 60->40" is being nice. | **Fix:** In debrief, emphasize: "You did this to get 40 points instead of 0. It was self-interest, not kindness. You just made self-interest safe." |

  ---

  ### 7. Honest Limitations (What you must state outright)

  This activity cannot produce the following nuances; you must lecture them briefly at the end:

  1.  **Game Transformation vs. Strategy Transformation:** True SPI literature often involves changing the *game* (delegating to a sub-agent who plays a different game), not just adding an `IF` statement to a strategy. Your activity simulates the *effect* (dominance over a baseline) but simplifies the *mechanism* (delegation/commitment).
      *   *Say:* "We simulated this by letting you write rules. In the real theory, this usually means handing your keys to a lawyer who is instructed to play safer than you would."
  2.  **Common Knowledge of Defaults:** The SPI works here because everyone *knows* the Default is 60. In the real world, knowing the "baseline" behavior of an adversary is hard.
      *   *Say:* "This only works if we agree on what the 'bad default' was. If I think your default is 60, but it's actually 40, my safety patch might look like aggression."
  3.  **The "Reactivity" Problem:** You mentioned the guarantee breaks if the other side reacts. In this game, the "Adversary" phase holds their move fixed. In reality, if I see you patch your code, I might change my default.
      *   *Say:* "SPI assumes the other person's strategy is a force of nature. If they are smart and see your patch, they might change their default. Then you need a new SPI. It's a ladder, not a ceiling."

  ### 8. Why This Works for Non-Maths Students
  *   **Concrete:** 60+60=120>100 is visceral.
  *   **Agency:** They write the rules, they don't solve equations.
  *   **Adversarial:** The "Red Team" phase makes the quantifier ("For All opponent moves") a physical task, not a logical abstraction.
  *   **Distinction:** They feel the difference between "I hope you cooperate" (Equilibrium) and "I ensure you can't hurt me" (SPI).
