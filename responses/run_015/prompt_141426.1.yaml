answer: |-
  ### Q&A Prep Sheet: Composed Risk Weighting

  **Strategy Note:** You have 25 minutes. That is roughly 3 minutes per question if you get eight. In reality, you will get 5-6 substantive questions and some chatter. The goal is to prevent the Hardlines from smelling blood on dynamic inconsistency, and prevent the Sympathizers from feeling you've broken the math they love.

  #### Pre-emptive Concessions (First 2 Minutes of Q&A)
  *State these before taking the first question to disarm the Sympathizers and Hardlines simultaneously.*
  1.  **Computational Idealization:** Concede immediately that no human can calculate the risk profile of their entire life policy for every coffee purchase. Frame the theory as a *normative standard for policy design* (e.g., grant portfolios, career strategy) rather than a real-time algorithm for local choices.
  2.  **No Justification of Risk Aversion:** Concede that this does not prove risk aversion is *rational* in the first place. You are solving the *coherence* problem for risk-averse agents, not the *justification* problem against EU maximizers.
  3.  **Boundary Fuzziness:** Concede that individuating "a policy" is partially arbitrary. You are arguing that *given* a policy description, the weighting applies to the whole, not that policy boundaries are metaphysically sharp.

  ---

  #### The Objections (Ordered by Expected Damage)

  **1. The "Action Guidance" Objection (Hardline EU + Skeptics)**
  *   **The Question:** "Look, if I need to know the risk profile of my entire life's utility to decide whether to take a small bet today, this theory is computationally intractable. If it can't tell me what to do *now* without solving the universe, isn't it useless as a decision theory?"
  *   **The Reply:** "It's useless as a calculator, but not as a design principle. You don't need to re-calculate the global distribution for every node. You use the global policy to set *local constraints* or *budgets*. Think of it like a carbon budget: I don't calculate the atmospheric impact of every drive, I set a monthly fuel budget based on the global target and follow that. Composed risk weighting tells you how to set the budget—the local rule is just 'stay within the risk budget.' It guides action by structuring the local environment, not by demanding global calculation at every node."
  *   **Soft Spot:** This relies on the existence of a stable "risk budget" which might shift if the background risk changes unexpectedly. You are hand-waving the update mechanism.

  **2. The "Why Risk Weight?" Objection (Hardline EU)**
  *   **The Question:** "You've moved the risk weighting from the node to the policy, but you haven't given me a reason to accept the weighting function $r(p)$ in the first place. If risk aversion is a cognitive bias in small stakes, aggregating biases over a lifetime doesn't make them rational, it just makes them consistent biases. Why shouldn't we just train the bias out?"
  *   **The Reply:** "I'm not arguing that risk aversion is objectively correct against EU. I'm arguing that *if* you have risk-sensitive preferences—and most humans and institutions demonstrably do—standard RWEU makes you diachronically exploitable. My view is the 'damage control' version. It says: 'If you are going to be risk-averse, do it this way so you don't get money-pumped.' Whether you should be risk-averse is a separate meta-ethical question; I'm solving the internal coherence problem for the non-EU agent."
  *   **Soft Spot:** This concedes the high ground to EU. If the room decides risk aversion is simply irrational, your coherence fix is a solution to a problem they think shouldn't exist.

  **3. The "Axiom Violation" Objection (Sympathetic RWEU)**
  *   **The Question:** "Buchak's axiomatization relies on the reduction of compound lotteries. By refusing to reduce the tree and weighting the total outcome, aren't you violating the very axioms that justify Risk-Weighted Utility? You might be saving dynamic consistency, but you've left the formal foundation behind."
  *   **The Reply:** "I am relaxing the reduction axiom, yes, but I'm doing it to save the 'No Dynamic Inconsistency' constraint which I argue is more fundamental for agency. The standard RWEU model treats the agent as a sequence of temporal slices; I'm treating the agent as a single temporally extended entity. If the axioms force dynamic inconsistency, the axioms are the thing that needs to bend for a theory of *planning* agents, not just choosing agents."
  *   **Soft Spot:** Hardline formalists will view this as "moving the goalposts." You are trading mathematical elegance for intuitive agency, which some will see as a bug, not a feature.

  **4. The "Fanaticism" Objection (Longtermist EU)**
  *   **The Question:** "One of our main worries is that risk aversion kills high-upside, low-probability existential interventions. If you apply risk weighting to the *total* portfolio, doesn't the sheer scale of the long-term future still get crushed by the risk function? You haven't actually saved the x-risk case."
  *   **The Reply:** "It depends on the correlation structure. In standard RWEU, every gamble is weighted down. In composed weighting, if the x-risk bet is uncorrelated with your background portfolio, its marginal risk cost is lower. More importantly, because utility isn't curved (we're using linear utility), the 'fanaticism' objection loses its force—the rejection comes from the risk weight on the tail, not diminishing returns. If the tail is massive enough, it can still dominate the risk-weighted integral, whereas in standard EU with curved utility, it often can't."
  *   **Soft Spot:** If the risk function $r(p)$ goes to zero fast enough for small $p$, the tail still gets crushed regardless of aggregation. You need to defend the shape of $r$.

  **5. The "Whose Risk?" Objection (Grantmakers/Ethicist)**
  *   **The Question:** "I manage a fund that affects millions of lives. When I apply this risk weighting to the portfolio of grants, whose risk function $r$ do I use? Mine? The beneficiaries'? The donors'? If I use mine, isn't that paternalistic? If I use theirs, how do I aggregate different risk attitudes?"
  *   **The Reply:** "This is an ethical question layered on the decision theory. The decision theory says: 'Pick a risk function and apply it globally.' Ethics says: 'Which function?' I'd argue for a fiduciary standard: if you are acting on behalf of others, you use *their* risk profile, aggregated. If that's impossible, you default to risk-neutrality over lives, because imposing your own risk aversion on others' survival is hard to justify. But the math of composed weighting works regardless of whose $r$ you plug in."
  *   **Soft Spot:** Aggregating different risk functions is a nightmare. If Beneficiary A is risk-averse and B is risk-seeking, there's no obvious way to combine them into a single policy-level $r$.

  **6. The "Policy Individuation" Objection (Technical)**
  *   **The Question:** "You say apply $r$ to the 'policy.' Where does the policy start and end? Is it my career? My life? The effective altruism movement? If I draw the boundary differently, the risk profile changes, and so does the verdict. Isn't the result arbitrary?"
  *   **The Reply:** "Boundaries are always a modeling choice, like the time horizon in physics. You should draw the boundary where the correlations become negligible. If two decisions are statistically independent, they can be separate policies. If they are correlated, they must be in the same policy. The arbitrariness is in the model, not the theory—just like choosing a discount rate. You test for robustness across reasonable boundary definitions."
  *   **Soft Spot:** Correlations are often unknown or hidden. This makes the "correct" boundary impossible to verify, leaving the verdict vulnerable to gerrymandering.

  **7. The "Diachronic Exploitation" Objection (The Critical One)**
  *   **The Question:** "Okay, but say I commit to a policy today. Tomorrow, I'm at a new node. The local gamble looks good by EU, but bad by my policy. What stops 'Tomorrow Me' from deviating? If I have to pre-commit to stop myself, haven't you just admitted the theory isn't dynamically consistent?"
  *   **The Reply:** "This is the single most important point. In standard RWEU, 'Tomorrow Me' genuinely prefers a different option than 'Today Me' because the risk weighting recalculates locally. In Composed Weighting, 'Tomorrow Me' knows that deviating ruins the global risk profile *they also care about*. Since the risk function applies to the total outcome, my future self has the same objective function as my current self. I don't need to bind myself; my future self *wants* to follow the plan because the risk penalty is attached to the total, not the local step. There is no preference reversal."
  *   **Soft Spot:** **THIS IS THE MUST-LAND REPLY.** If you fumble this, the Hardlines will smell dynamic inconsistency and eat you alive. You must sound certain here. The weakness is that this assumes future selves care about the *original* policy definition and haven't updated their view of what the "total" is.

  **8. The "Kelly/Growth" Objection (Time-Average Camp)**
  *   **The Question:** "This looks like a complicated way to approximate Kelly betting. If you care about long-run growth, you should just maximize the geometric mean. Why introduce this risk-weighting apparatus instead of just fixing the utility function to be logarithmic?"
  *   **The Reply:** "Kelly assumes repeated identical bets and infinite time. Real life is a finite sequence of heterogeneous, non-repeatable bets. Log-utility implies specific risk aversion scaling with wealth. Composed risk weighting lets you separate your attitude toward risk from your attitude toward wealth. You might want linear utility over lives but still be risk-averse over the *distribution* of outcomes. It's more flexible for one-off strategic decisions than growth-rate optimality."
  *   **Soft Spot:** The Kelly folks think "finite heterogeneous bets" is an excuse for not doing the math right. They will press that growth rate is the only non-subjective metric.

  ---

  #### The "Hope Nobody Asks" Question
  *   **The Question:** "If the risk weighting applies to the total policy, does that imply I should merge all decision-making into a single global agent to maximize the portfolio effect? Should we abolish local autonomy to reduce aggregate risk?"
  *   **Honest Answer:** "Technically, yes, centralization increases the portfolio effect and reduces the marginal risk cost of individual bets. If the goal is purely to maximize risk-weighted value, a global planner is more efficient than fragmented agents. However, this ignores the epistemic costs of centralization and the value of autonomy itself. The theory describes value maximization; it doesn't account for the disvalue of totalitarian coordination. You'd need to add a term for the cost of centralization to the utility function."
  *   **Why you hope they don't ask:** It exposes the potentially anti-humanist implications of optimizing global risk profiles. It makes you sound like you're arguing for a singleton for portfolio diversification reasons.

  ---

  #### Critical Survival Check
  **The Single Reply That Must Land:**
  Objection #7 (**Diachronic Exploitation**).
  *   **Why:** The primary selling point of your thesis is (iii) Plan Stability. If the audience believes your future self will still want to deviate, the "Composed" aspect adds complexity without solving the main problem standard RWEU faces.
  *   **Delivery Tip:** Do not hedge here. Do not say "I think" or "It seems." Say "My future self has the same objective function." If you waver, the Hardlines will construct a money pump on the spot.

  **Final Advice:**
  When the Hardlines press you on "But risk aversion is irrational," do not fight that battle. It's the wrong battle for this talk. Keep saying: "I am granting your premise for the sake of the coherence argument. Even *if* we are risk-averse, standard theory makes us inconsistent. Mine doesn't." Keep them focused on the *structure* of the theory, not the *normativity* of the input.
