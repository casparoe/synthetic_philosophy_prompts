answer: |-
  This is a precise dissection of the "Geometric Rationality" argument. You have correctly identified that the move from "Kelly is growth-optimal in the limit" to "Kelly is the normative standard for all rational action, including existential risk" relies on several contentious bridges.

  To answer your primary question directly: **The argument breaks at Step (3) (The Normative Bridge) and Step (5) (Generality).** Step (7) is the *reductio ad absurdum* that proves (5) cannot hold for existential value. Step (4) (Uniqueness) is mathematically conditional on axioms you may not wish to accept.

  Here is the separation of settled mathematics from contested normativity, and the specific costs of rejecting each step.

  ### 1. Settled Mathematics vs. Contested Normativity

  **Settled (Steps 1 & 2):**
  The mathematics of the Growth Theorem are robust *given the assumptions*.
  *   **Assumptions:** Independent, identically distributed (i.i.d.) rounds; infinite horizon (or sufficiently large $T$); ability to reinvest full wealth; no consumption; no lower bound on wealth other than 0.
  *   **Theorem:** Under these conditions, the strategy maximizing $E[\log W_T]$ achieves a higher asymptotic growth rate than any other strategy. The ratio of wealth between the Kelly bettor and any other fixed-fraction bettor diverges to infinity with probability 1.
  *   **Your Suspicion (Finite Horizon):** Your calculation regarding Double-Kelly is correct. Asymptotic dominance ($T \to \infty$) does **not** imply finite-horizon dominance ($P(W_{Kelly} > W_{Other}) > 0.5$). For small $T$, a higher-variance strategy (like Double-Kelly) can have a higher probability of finishing ahead, even though its geometric mean is lower. The "almost surely" property converges slowly. This is a mathematical fact, not a bug.

  **Contested (Steps 3, 4, 5, 6, 7):**
  Everything from the Normative Bridge onward is philosophy and application, not math. This is where the "Geometric Rationality" project extrapolates beyond the theorem's warrant.

  ### 2. Evaluating the Break Points

  #### Step (3): The Normative Bridge
  *Claim:* Asymptotic dominance implies rational obligation.
  *Verdict:* **Reject.**
  *Why:* This conflates "long-run certainty" with "decision-relevance." A strategy that loses 60% of the time at horizons relevant to human lifespans ($T=10$ to $T=100$) cannot be mandated solely by its behavior at $T=\infty$.
  *Cost of Rejection:* You lose the claim that Kelly is *uniquely* rational. Kelly becomes the optimal strategy *for an agent with Logarithmic Utility*. It shifts the justification from "objective dominance" to "subjective preference."
  *Benefit:* You avoid the implication that you must accept strategies that are likely to underperform in your actual lifetime. You can acknowledge that Double-Kelly is "reckless" because it sacrifices expected log wealth (and risks ruin), not because it is "dominated" in a decision-theoretic sense at finite $T$.

  #### Step (5): Generality
  *Claim:* The argument applies to any multiplicative quantity (lives, value, civilization).
  *Verdict:* **Reject.**
  *Why:* This is a category error. The Growth Theorem requires **reinvestment**. Money is fungible; you can bet 20% of your bankroll, lose, and still bet 20% of the remainder next round.
  Existential value does not compound multiplicatively in the same way.
  1.  **Absorbing States:** If $V$ represents "civilization," $V=0$ is an absorbing state. You cannot reinvest the remainder to grow it back. The Kelly math assumes you continue playing forever. If the game ends at 0, the "long run" does not exist.
  2.  **Non-Fungibility:** You cannot typically take "value saved in century 1" and risk 20% of it to generate "more value in century 2" at stable odds. The "odds" of existential survival are not i.i.d. coin flips; they are complex, path-dependent, and often one-shot.
  *Cost of Rejection:* You cannot use Kelly criteria to determine existential risk tolerance directly. You cannot say "we should accept a 1% risk of extinction to gain 100x value" based on geometric growth, because there is no "next round" to compound that value if you survive.
  *Benefit:* This immediately dissolves Step (7). If the multiplicative reinvestment assumption fails, the requirement to maximize $E[\log V]$ vanishes.

  #### Step (4): Uniqueness
  *Claim:* Log is the only utility function independent of horizon/wealth.
  *Verdict:* **Contested/Conditional.**
  *Why:* Log utility is unique *given* specific axioms (e.g., that your risk aversion coefficient is exactly 1, or that you satisfy specific dynamic consistency requirements regarding wealth scaling). If you value consumption, or if you have a finite horizon, other Constant Relative Risk Aversion (CRRA) utilities ($U(W) = W^{1-\gamma}/(1-\gamma)$) are equally consistent. Log is just the case where $\gamma = 1$.
  *Cost of Rejection:* You admit that Log is not "The Rational Utility," but merely one point in a spectrum of risk aversion.
  *Benefit:* It allows you to model agents who are more conservative than Kelly ($\gamma > 1$) or more aggressive ($\gamma < 1$) without calling them "irrational."

  #### Step (7): The Minus Infinity Result
  *Claim:* $E[\log V] = -\infty$ implies paralysis.
  *Verdict:* **This is the Reductio.**
  *Why:* You correctly identified that if any action has $P(V=0) > 0$, Log utility forbids it. Since all real actions carry some epistemic probability of catastrophe (even crossing the street), strict Log utility over total value implies paralysis.
  *Resolution:* This confirms that Log utility is the wrong tool for *total* value. It is a tool for *reinvestable capital*.
  *Fix:* Most decision theorists handle this by either:
  1.  **Bounded Utility:** Value has a floor or ceiling (preventing $-\infty$).
  2.  **Threshold Constraints:** "Maximize expected value subject to $P(\text{Ruin}) < \epsilon$." (This is essentially Safety Engineering, not Geometric Rationality).
  3.  **Hybrid Models:** Use Log for fungible resources (money), Arithmetic for existential outcomes (lives).

  ### 3. Specific Answers to Your Questions

  **Q: Is the flaw in (3), (5), (4), or somewhere else?**
  **A:** The primary flaw is **(5)**. The Generality step assumes existential value behaves like a bankroll. It does not. The secondary flaw is **(3)**. Asymptotic dominance does not normatively bind finite agents.
  If you fix (5) by restricting Geometric Rationality to fungible, reinvestable resources, Step (7) disappears because you are no longer taking the log of "total moral value," only "trading capital."

  **Q: If I give up (3), what is left?**
  **A:** You retain the **Growth Theorem (2)** as a mathematical fact about compounding. You retain the intuition that over-betting is bad because it reduces the *expected growth rate*, even if it doesn't minimize the probability of being ahead at finite $T$.
  The "Double-Kelly" bettor is not "irrational" in a dominance sense; they are simply optimizing for a different objective (higher arithmetic mean, higher variance). You can argue they are imprudent because they risk significant drawdowns, but you cannot prove they are *dominated* at finite horizons.
  This collapses the apparatus into **Expected Utility Maximization with Log Utility**. It becomes a theorem about preferences, not a theorem about rationality *simpliciter*. This is the standard economic view, and it is robust.

  **Q: If I keep (3) and reject (5), what is the principled line?**
  **A:** The line is **Reinvestability and Fungibility**.
  *   **Governed:** Bankrolls, investment portfolios, corporate retained earnings, biological populations (in stable environments). These allow losses to be recouped by future gains via compounding.
  *   **Not Governed:** Existential risk, one-shot gambles, non-fungible goods (health, liberty, specific lives). If a loss prevents future betting (absorbing state), the geometric mean is not the relevant metric.
  *   **Principle:** Geometric maximization is rational *if and only if* you expect to face the same favorable odds repeatedly with the ability to reinvest. If the game ends upon ruin, Arithmetic maximization (or a constrained variant) is often more appropriate.

  **Q: On (7): Is the minus-infinity result a real defect?**
  **A:** It is a real defect of applying Log Utility to **unbounded, non-fungible value with non-zero ruin probability**.
  *   **Does anything change if value has a floor?** Yes. If $V \ge \epsilon > 0$, then $\log V$ is finite. This suggests that if you want to use Geometric Rationality for existential risk, you must model value as bounded or ensure ruin is impossible (probability 0, not just small).
  *   **Comparing catastrophe probabilities:** This is the standard solution. Instead of $E[\log V]$, use "Maximize $E[V]$ subject to $P(V=0) < \delta$." This preserves the intuition that ruin is uniquely bad without inducing paralysis.

  **Q: Which steps would a Geometric Rationalist concede?**
  **A:** A sophisticated proponent (e.g., someone familiar with the limits of the Kelly criterion) would likely concede:
  1.  **(3) is weak for finite horizons:** They would admit that "asymptotic dominance" is a justification for why Log is a *focal point*, not a proof that other utilities are irrational for finite lives.
  2.  **(5) does not apply to X-Risk:** Most serious applications of Kelly distinguish between "wealth" (reinvestable) and "utility" (final outcome). They would agree that applying Kelly fractions to existential risk is a category error unless you model the future as an infinite sequence of reinvestable "civilization turns" (which is dubious).
  3.  **(7) requires regularization:** They would agree that strict Log utility breaks with non-zero ruin probability and requires a modification (e.g., treating "ruin" as a utility of $-\infty$ separate from the log function, or using a bounded utility function).

  ### 4. Recommendation for Your View

  You stated: *"I would rather keep (2) and the intuition that betting far above Kelly is a mistake than keep any step that forces (7)."*

  Here is the consistent position that allows this:

  1.  **Accept (2) as Conditional Math:** Kelly is optimal for maximizing the growth rate of *reinvestable capital* over *many rounds*.
  2.  **Reject (5) for Existential Value:** Do not maximize $E[\log V]$ for lives or civilization. Maximize Expected Value ($E[V]$) subject to hard constraints on ruin probability. This explains why over-betting is bad (it violates the constraint) without implying paralysis (you can still act if risk $< \delta$).
  3.  **Reinterpret (3) as Prudence, Not Dominance:** The reason not to Double-Bet is not that you will "almost surely" lose in the limit (you won't, in your lifetime). It is that you are exposing yourself to **volatility drag**. Even at finite $T$, high variance reduces the *median* outcome significantly. You can argue that rational agents should care about the median (or geometric mean) of their outcomes because arithmetic means are skewed by rare, unrepeatable windfalls.
  4.  **Treat Log as a Heuristic for Risk Aversion:** Log utility ($\gamma=1$) is a reasonable default for fungible resources because it balances growth and safety. It is not a moral imperative.

  **Summary:** The "Geometric Rationality" framework is a powerful tool for portfolio management and repeated games. It breaks when elevated to a universal normative theory for all value. The break occurs at **Generality (5)**. By restricting the domain to reinvestable capital, you keep the math (2) and the intuition (over-betting is dangerous) while avoiding the paralysis (7). The "ambitious form" you read in blogs is an over-extension of the theorem, not a consequence of it.
