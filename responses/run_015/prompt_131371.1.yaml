answer: |-
  ### 1. The Prerequisite Dependency
  Before *anatta* can be read as a claim about identity rather than a claim about ontology ("no soul"), you must secure the group's agreement that **personal identity is typically defined by *authority* rather than *continuity*.**

  Humeans already accept continuity without substance (the bundle persists). If you present *anatta* merely as "no substance," they will file it under "Humean Bundle Theory, Variant B." You must shift the criterion of "self" from *what persists* (memory, body, psychology) to *who is in charge*. The session must establish that the ordinary notion of "I" implies a CEO-like owner who stands apart from the processes, directs them, and claims their results. *Anatta* is the denial of that specific executive authority, not the denial of the processes themselves.

  ### 2. The Carrying Example: The Autonomous Vehicle (AV)
  **The Example:** A Level 5 Self-Driving Car navigating a complex route.

  **Properties It Needs:**
  *   **Goal-Directed Agency:** It must make decisions (lane changes, braking) to achieve a destination.
  *   **Continuity:** It maintains its identity (VIN, mission) from start to finish despite changing sensory inputs.
  *   **Functional Personhood:** It can be held liable (in a legal/insurance sense) for accidents; it interacts with other agents as a unit.

  **Properties It Must Lack:**
  *   **A Homunculus:** There is no "little driver" inside the computer chip making the final call.
  *   **An Unchanging Core:** Its code updates, its sensors degrade, its physical parts are replaced, yet it remains "the car."
  *   **Experiential Ownership:** It processes "pain" (damage sensors) without *suffering* from it; there is no one *to whom* the experience happens.

  **Why this works:** It demonstrates that complex, morally relevant agency (swerving to avoid a pedestrian) functions perfectly without an internal "owner." This mirrors the Buddhist claim: the five aggregates (form, feeling, perception, volition, consciousness) function without a sixth "self" managing them.

  ### 3. Misconceptions and Defusal Points
  You must defuse these misconceptions in the following order, at these specific junctures:

  1.  **"This is just Humean Bundle Theory."**
      *   **When to Defuse:** Immediately after presenting the AV example (Minute 25).
      *   **How:** Hume argues epistemologically ("I cannot *find* the self in experience"). *Anatta* argues functionally/soteriologically ("Positing a self *fails to explain* control and causes suffering"). Clarify that Hume leaves the bundle as a passive collection, whereas *anatta* describes a dynamic process where the *assumption* of ownership is the error, not just the inference of substance.
  2.  **"If there is no self, there is no moral agency (Who gets the karma?)."**
      *   **When to Defuse:** Immediately after introducing the Two Truths distinction (Minute 50).
      *   **How:** Use the AV example again. We still insure the car; we still blame the manufacturer. Causality operates without a soul. Moral responsibility attaches to the *continuity of the process*, not the existence of a metaphysical owner.
  3.  **"Reincarnation requires a traveler (What gets reborn?)."**
      *   **When to Defuse:** In the final Q&A buffer (Minute 65).
      *   **How:** Frame it as "causal transmission" rather than "transmigration." Like a flame lighting another flame: no substance travels, but the second flame is dependent on the first. Do not linger here; acknowledge the difficulty and return to the identity question.

  ### 4. Placement of the Two Truths (*Sammuti* and *Paramattha*)
  **Placement:** The middle-late pivot (Minute 45), *after* the AV example has created tension but *before* the moral agency objection is fully aired.

  **Justification:**
  If introduced at the opening, the Two Truths function as a dogmatic "escape hatch" that allows participants to dismiss the radical claim of *anatta* as "only ultimately true, not practically true." By waiting until Minute 45, you allow the tension to build: the group feels the pull between "The car definitely exists (it hit me!)" and "The car has no driver."
  At this point of cognitive dissonance, the Two Truths distinction is not a doctrine but a **tool** to resolve the paradox. It validates their intuition that persons exist conventionally (*sammuti*) while securing the philosophical claim that they do not exist ultimately (*paramattha*). This placement ensures the distinction is earned rather than asserted.

  ### 5. Closing Question
  **"If the Autonomous Vehicle arrives at its destination safely and efficiently, what specific work is the word 'driver' doing if we remove the human from the seat?"**

  **Why this tests understanding:**
  *   If they answer, "It proves no one was there," they have missed the point (Nihilism).
  *   If they answer, "It's just a metaphor for the software," they have reduced it to Hume (Bundle Theory).
  *   If they answer, "It highlights that we are attributing *authority* to a process that is merely *happening*," they have grasped *anatta* as a denial of ownership. The question forces them to isolate the concept of "control" from the concept of "function."

  ### 6. Advanced Element to Name and Set Aside
  **Element:** The Abhidhamma analysis of momentary *citta* (consciousness moments) and *cetasika* (mental factors) arising and passing away in sub-second succession.

  **Reason to Set Aside:**
  Introducing momentariness (*kshanika*) shifts the debate from **Personal Identity** (the session's goal) to **Metaphysics of Time**. If participants begin debating whether a "person" exists for a second or a nanosecond, the ethical and phenomenological weight of *anatta* is lost in technical ontology. Name it as "a deeper layer of analysis regarding time" to acknowledge its existence, but explicitly bracket it to keep the focus on the *structure of agency* rather than the *duration of existence*.
