answer: |-
  1.  **Opening Mechanism:** Your core thesis rests on an interaction between "normative contamination" and the structural role an outcome plays in an agent's plan. Can you specify the cognitive mechanism here? When a subject detects that a harmful outcome is a *means* rather than a byproduct, does that detection trigger a specific norm-violation module, or does it simply amplify the salience of the existing norm?

  2.  **Interaction Structure (Follow-up):** To press on that mechanism: is the interaction between means-status and norm-violation multiplicative or threshold-based? For instance, if the norm violation is minor but the outcome is a necessary means, does that produce the same intentionality attribution as a major norm violation that is merely a byproduct, or does the means-status act as a switch that must be flipped before the norm magnitude matters?

  3.  **Control Conditions & Affect:** Critics often argue that harm is inherently more salient and emotionally arousing than help, which could drive intentionality judgments regardless of plan structure. You might reply that your matched-valence vignettes already control for affective priming, but why is that sufficient to rule out attentional asymmetries? Does the "means" structure itself capture attention differently than a "byproduct" structure, independent of the normative content?

  4.  **The Original Vignettes:** In the standard Knobe cases, both the harmful and helpful outcomes are presented as foreseen byproducts. If your theory relies on the means/byproduct distinction to generate the asymmetry, how do you account for the original effect where that distinction is held constant? Do you deny the asymmetry exists in those specific cases, explain it away as a different phenomenon, or posit a hidden means-structure in the standard vignettes?

  5.  **Cognitive Architecture:** You frame "normative contamination" as a distinct process from standard moral evaluation. Does this commitment require a modular architecture of moral psychology, where norm-detection and plan-analysis are separate inputs that converge only at the judgment stage?

  6.  **Theoretical Collapse (Follow-up):** If you defend that modularity, we need to know if it truly distinguishes your view. If the "norms" being detected are ultimately moral norms, doesn't your account risk collapsing into the standard moral-evaluation view? What prevents "normative contamination" from simply being a redescription of the very moral judgment processes you aim to replace?

  7.  **Rational Commitment Confound:** Consider an alternative explanation: using an outcome as a *means* might signal stronger agential commitment than allowing it as a byproduct, regardless of norms. Subjects might attribute intentionality simply because the agent was more instrumentally committed to the outcome. How do you disentangle normative contamination from this rationality-based commitment signal?

  8.  **Norm Content:** Your theory hinges on "norm-violation." If you ran the means/byproduct reversal experiment using purely conventional norms (e.g., etiquette or protocol) rather than moral harms, do you predict the same reversal? If the effect disappears with non-moral norms, does that undermine the claim that this is about normative structure rather than moral valence?

  9.  **Responsibility Implications:** If you are correct that intentionality judgments shift based on plan structure rather than moral valence alone, what are the implications for moral responsibility? If we accept your revisionist reading, should we revise our practices of blame and praise when an agent brings about harm as a means versus a byproduct?

  10. **Falsification:** Finally, let's talk about disconfirmation. Beyond a simple null result, what specific experimental outcome would force you to abandon the thesis? For example, if you found a reversal that tracked moral valence regardless of means-status, or a null reversal even when means-status was perfectly isolated, would that falsify the account, or would it merely prompt a parameter adjustment?
