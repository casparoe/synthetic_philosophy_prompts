answer: |-
  **Project Title:** Workspace Dynamics: Reconstructing the Access/Phenomenal Split via Stability vs. Reach

  **The Pitch**
  Everyone in the consciousness game is stuck replaying the Block-vs-Dehaene tape. Block says Phenomenal (P) and Access (A) come apart; Dehaene says Global Workspace Theory (GWT) proves they're the same thing (broadcasting = consciousness). Both sides treat "broadcasting" as a binary switch: either the info is in the workspace or it isn't.

  I think that's a category error. Broadcasting isn't a switch; it's a dynamic process with at least two distinct failure modes:
  1.  **Reach Failure:** The signal doesn't hit enough downstream modules (spatial limitation).
  2.  **Stability Failure:** The signal hits the modules but decays too fast to be integrated or reported (temporal limitation).

  My hypothesis is that **Phenomenal Consciousness survives Reach Failure but collapses under Stability Failure.**

  This flips the standard script. It suggests that "what it's like" isn't about how *wide* the information spreads (Access/Reportability), but how *long* it holds together in the workspace. This proposal funds 6 months of conceptual work to formalize this distinction, effectively decoupling GWT from strict reportability metrics and offering a new middle ground between Block and Dehaene.

  **The Precise Question**
  Can we reconstruct the Access/Phenomenal distinction not as a difference in *kind* (local vs. global), but as a difference in *workspace dynamics* (reach vs. stability)? Specifically: Does phenomenal character depend on the temporal stability of workspace integration rather than the spatial extent of broadcasting?

  **Why the Current Literature Misses This**
  Current GWT accounts (Dehaene, Changeux, etc.) operationalize consciousness via reportability. If you can't report it, it wasn't globally broadcast. Block's counter-arguments rely on intuitions about "rich experience" that exceeds report.

  The gap is in the mechanics of the workspace itself.
  *   **The Oversimplification:** Existing models treat broadcasting as a threshold event. You cross the threshold, you're conscious.
  *   **The Missing Variable:** They ignore the *duration* of the broadcast independent of its *spread*. A signal could theoretically broadcast widely but flicker out before a motor plan (report) is executed.
  *   **The Consequence:** By conflating "global availability" with "reportable access," we miss the possibility that a stable but narrow broadcast could sustain phenomenality without full access, while an unstable wide broadcast sustains neither.

  **The Method (Conceptual Analysis Only)**
  *Note: There is no empirical lab work in this proposal. This is a theoretical reconstruction.*

  1.  **Paradigm Re-interpretation:** I will analyze existing experimental paradigms—specifically **subliminal priming** (often cited as P-without-A) and **inattentional blindness** (often cited as A-without-P or no-consciousness).
  2.  **Mapping Failure Modes:**
      *   I'll argue that subliminal priming cases are often *Stability Failures* (the signal degrades before integration), which explains the lack of report *and* the ambiguous phenomenology.
      *   I'll argue that inattentional blindness cases often represent *Reach Failures* (info is processed locally but not broadcast widely), which may still support a form of local phenomenality.
  3.  **Framework Construction:** Develop a 2x2 matrix (High/Low Reach x High/Low Stability) to categorize conscious states. This replaces the binary A/P split with a dynamic workspace profile.
  4.  **Deliverable:** A 6,000–8,000 word target article suitable for a journal like *Neuroscience of Consciousness* or *Philosophical Psychology*, plus a preprint release.

  **What Success Looks Like**
  *   **Theoretical:** A coherent argument showing that "Stability" is a better predictor of phenomenal collapse than "Reach."
  *   **Dialectical:** A framework that Block fans can accept (P doesn't require full Reach) and GWT fans can accept (P still requires Workspace dynamics, specifically Stability).
  *   **Output:** One polished paper, one conference presentation (virtual or travel), and a public-facing blog post summarizing the "Reach vs. Stability" concept for the broader rationalist/philosophy community.

  **What Kills the Project (Failure Conditions)**
  *   **Empirical Indistinguishability:** If analysis shows that Reach and Stability are empirically conflated in all existing paradigms (i.e., you can't have one without the other in practice), the distinction is philosophically interesting but scientifically inert.
  *   **Circularity:** If "Stability" just becomes a synonym for "Access" by another name, the reconstruction fails. I need to prove Stability is distinct from the capacity to report.
  *   **Scope Creep:** Trying to solve the Hard Problem instead of just fixing the GWT framework. I need to stay focused on the mechanics of broadcasting, not the ontology of qualia.

  **Scope Check (6 Months, No Lab)**
  *   **Months 1-2:** Literature deep dive. Mapping the specific GWT literature on "ignition" duration vs. "ignition" spread.
  *   **Months 3-4:** Drafting the core argument. Running the thought experiments against the priming/blindness cases.
  *   **Month 5:** Peer review circle (sending drafts to 3-4 colleagues for brutal feedback).
  *   **Month 6:** Revision, submission, and public summary.

  **Budget Note**
  Since there's no lab equipment, participant fees, or travel heavy lifting, the budget is purely for **buying time**. This covers 6 months of living stipend/researcher salary to allow for deep, uninterrupted conceptual work. The ROI is a high-impact theoretical paper that clarifies the foundational assumptions of consciousness research without costing a dime in fMRI time.

  ***

  **One-liner for the application form:**
  "Moving beyond the Block-vs-Dehaene stalemate by arguing that phenomenal consciousness depends on the temporal *stability* of workspace broadcasting, not just its spatial *reach*."
