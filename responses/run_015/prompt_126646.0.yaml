answer: |-
  There is no single, canonical proper noun (like "The Asch Effect") in the collective intentionality literature that perfectly captures this specific phenomenon. However, you have identified a recognized pathology within the theory of **Joint Commitment** (Margaret Gilbert) and **Shared Intention** (Michael Bratman).

  In philosophical terms, this is best described as **Retroactive Commitment Dissociation** arising from **Hidden Provisos**.

  While Gilbert treats joint commitment as a binary state (you are either part of the plural subject or you are not, and you cannot unilaterally withdraw without joint rescission), your observation highlights a failure mode where agents *act* as if they are in a plural subject while privately maintaining an **I-Mode escape clause**. When the outcome violates their private conditions, they do not merely *withdraw* (which would acknowledge the prior commitment); they *rewrite history* to claim the commitment never existed.

  Here is a precise breakdown of the phenomenon, how it fits into existing theory, and how to distinguish it from related concepts.

  ---

  ### 1. Proposed Definition: Retroactive Commitment Dissociation
  **Definition:** A failure mode of collective agency wherein participants publicly enact the norms of a "We" (joint commitment) while privately conditioning their participation on unstated, subjective outcomes (hidden provisos). Upon negative outcomes, participants unilaterally reclassify the past collaboration as parallel individual action to evade collective liability.

  **Core Mechanism:** The breakdown of **Common Knowledge**.
  For a true Joint Commitment (Gilbert) or Shared Intention (Bratman) to exist, the conditions of the commitment must be *common knowledge* (I know, you know, I know that you know). In this phenomenon, the *fact* of collaboration is common knowledge, but the *conditions* for continued commitment are not. Each member thinks, "We are doing this *provided* it goes well," but assumes everyone else means "We are doing this *no matter what*."

  ### 2. Theoretical Placement
  You are correct that standard Gilbertian frameworks treat commitment as present or absent. This phenomenon is technically a **violation of the norms of joint commitment**, disguised as an ontological correction.

  *   **Gilbert (Joint Commitment):** Under Gilbert's theory, these members are *obligated* to the group until the group jointly rescinds the commitment. By claiming "I was never really in," they are committing a **normative violation** but framing it as a **factual correction**. They are denying the existence of the "plural subject" to escape the obligations attached to it.
  *   **Bratman (Shared Intention):** Bratman focuses on "meshing sub-plans." This phenomenon occurs when sub-plans meshed publicly (plant the garden) but diverged privately (plant the garden *to gain social capital* vs. *to grow food*). When the outcome threatens the private sub-plan, the agent claims the shared intention never existed.
  *   **Tuomela (We-Mode vs. I-Mode):** This is a shift from **We-Mode** (acting for the group's reason) to **I-Mode** (acting for private reasons) that is denied retroactively. It is **Opportunistic Mode-Switching**.

  ### 3. Distinctions from Related Concepts

  | Concept | Key Difference | Why your phenomenon is distinct |
  | :--- | :--- | :--- |
  | **Strategic Ambiguity** | **Intentional Vagueness.** Parties knowingly leave terms vague to secure agreement, expecting to negotiate later. | In your scenario, the alignment feels *genuine* initially. The "escape clause" is often unconscious or unacknowledged even to the self until triggered. It is not a negotiation tactic; it is a self-protection mechanism. |
  | **Weak Shared Intentionality** | **Low Bar for Coordination.** "Walking together" without robust obligation. | Your groups (garden board, open source) involve high-stakes labor and resources. The *strength* of the initial collaboration mimics strong joint commitment; the fragility only appears under stress. |
  | **Groupthink** | **Suppression of Dissent.** Maintaining harmony by ignoring risks. | Groupthink keeps the "We" intact despite evidence. Your phenomenon **shatters the "We"** to save the "I." It is the opposite of preserving group cohesion; it is preserving self-image at the group's expense. |
  | **Free-Riding** | **No Contribution.** Benefiting without labor. | You specified members *contributed labor*. They paid the entry fee; they just refuse to pay the cost of failure. |
  | **Genuine Mind Change** | **Acknowledged Withdrawal.** "I supported this, but now I see it was wrong, so I am leaving." | The key is the **retroactive denial**. A genuine change of mind accepts the past commitment ("I *was* on board, but I'm bailing now"). Your phenomenon denies the past commitment ("I was *never* on board"). |

  ### 4. Boundary Conditions: What Counts and What Doesn't

  To precisely identify this phenomenon, you must distinguish between **Hidden Provisos** (the phenomenon) and **Genuine Evolution of Intent** (normal agency).

  **It IS Retroactive Commitment Dissociation if:**
  1.  **Public Performance of "We":** The agent used "we" language, voted, and contributed labor without qualification *during* the success phase.
  2.  **Private Conditionality:** The agent's continued participation was internally contingent on a specific outcome (e.g., "I will be part of this *if* it remains popular").
  3.  **Lack of Common Knowledge:** The group did not know about this condition. If the group knew, it would be a *conditional contract*, not a hidden proviso.
  4.  **Ontological Rewrite:** Upon failure, the agent does not say "I quit"; they say "I was never one of you." They deny the *history* of the commitment, not just the *future* of it.

  **It IS NOT (it is just normal agency) if:**
  1.  **Explicit Rescission:** The member says, "I am no longer comfortable with this direction, so I am stepping back." (This honors the prior commitment while ending it).
  2.  **Discovery of Deception:** The member finds out the group lied about goals. (Withdrawing commitment here is valid because the *basis* of the joint commitment was fraudulent).
  3.  **Capacity Loss:** The member literally cannot contribute anymore (illness, bankruptcy). (This is a physical impossibility, not a normative denial).

  ### 5. Why This Matters (The "Failure Mode")
  This is a distinct failure mode because it attacks the **stability of social reality**.

  Joint commitment creates a new social fact: The Group. When members retroactively deny the commitment, they are not just leaving; they are **dissolving the social fact of the past**. This makes future collaboration impossible because "Common Knowledge" can never be established. If every "Yes" carries a hidden "Unless," then no "Yes" creates an obligation.

  In organizational psychology, this is sometimes loosely referred to as **"Self-Serving Collective Dissociation,"** but in the philosophy of social ontology, it is best understood as **Unilateral Retroactive Rescission of Joint Commitment.** It is a form of **Bad Faith** (Sartre) applied to the plural subject: pretending to be free of an obligation one knowingly undertook, by pretending the undertaking never happened.

  ### Summary Label
  If you need a term to use in writing or discussion, the most precise philosophical label is:
  **"Joint Commitment with Hidden Provisos"** (describing the structure)
  leading to **"Retroactive Individualization"** (describing the behavior).

  Colloquially, it is **"Fair-Weather Plural Subjectivity."**
