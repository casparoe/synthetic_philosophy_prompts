answer: |-
  This is a sharp observation, and you are right to feel that "speciesism" is too moralistic and "anthropodenial" is too blunt for the methodological nuance you're describing. You have identified a specific structural asymmetry in how evidence is weighed, not just a bias in the conclusion.

  Here is the carving you asked for. There is no single, universally standardized term that captures the *entirety* of what you described (the behavioral double-standard + the neural gatekeeping + the impossible burden of proof), but there are three overlapping concepts in the literature that, when combined, map exactly onto your case. I will also offer a precise coinage for the logical structure itself.

  ### 1. The Existing Concepts

  **A. Neurochauvinism (The Neural Substrate Argument)**
  *   **Definition:** The assumption that specific neural structures found in humans (or mammals), such as the neocortex, are *necessary* for conscious experience, and that without them, behavioral evidence is dismissed as "reflexive."
  *   **Fit to your case:** This covers the skeptic who says fish don't feel pain because they lack the "consciousness structures" (mammalian cortex).
  *   **Status:** **Live Dispute.** This is the core of the "fish pain" debate. Skeptics (e.g., James Rose) argue cortex is necessary. Proponents (e.g., Lynne Sneddon, Jonathan Birch) argue for functional equivalence or different substrates (e.g., pallium in fish).
  *   **Why it fits:** It explains why the *same behavior* is discounted in fish but accepted in dogs. The behavior is deemed irrelevant because the "hardware" is missing.
  *   **Confidence:** High that this is the term used in current philosophy of animal cognition (e.g., work by Kristin Andrews, Jonathan Birch).

  **B. Asymmetrical Evidential Thresholds (The Methodological Double-Standard)**
  *   **Definition:** Requiring a higher standard of proof for Hypothesis $H$ in Subject $B$ than in Subject $A$, without a justification derived from the evidence itself.
  *   **Fit to your case:** This covers the crab/dog discrepancy. The crab shows *more* complex avoidance learning than the dog, yet the threshold for "pain" is set higher for the crab.
  *   **Status:** **Methodological Consensus (as a fallacy).** In general philosophy of science, this is recognized as a form of **Special Pleading**. However, in animal cognition, it is often practiced implicitly.
  *   **Why it fits:** It captures your observation that "identical behavioural evidence gets treated as strong in one animal and as almost nothing in another."
  *   **Confidence:** High that this is a recognized methodological error, though often unnamed in specific papers.

  **C. The "Hard Problem" Shield (Ontological Skepticism as Methodological Block)**
  *   **Definition:** Invoking the metaphysical difficulty of consciousness (the "Hard Problem") to justify a practical default of "no," while acting as if the metaphysical uncertainty has been resolved in the negative.
  *   **Fit to your case:** This covers the "shrug and 'we don't have a test yet'" response that nonetheless proceeds as if the answer is known.
  *   **Status:** **Contested.** Some argue this is prudent skepticism; others argue it violates the **Precautionary Principle** (which suggests we should act *as if* they are conscious if the evidence is non-negligible).
  *   **Confidence:** High that this is a common rhetorical move, disputed in welfare ethics.

  ### 2. The Coinage: "Phylogenetic Special Pleading"

  If you need a single term to bring to your group that captures the *logical structure* of the error (distinct from the moral accusation of speciesism), I propose **Phylogenetic Special Pleading**.

  *   **Definition:** A reasoning pattern where a general rule for attributing a mental state (e.g., "complex avoidance + analgesia response = pain") is applied to a preferred class of subjects (mammals), but suspended for a non-preferred class (invertebrates/fish) by introducing a post-hoc condition (e.g., "must also have a cortex" or "must be able to report") that was not part of the original rule.
  *   **Edges & Boundaries:**
      *   **Instance:** Accepting a dog's limp as pain, but demanding a crab demonstrate meta-cognition to prove pain.
      *   **Non-Instance:** Arguing that a specific neural pathway is required for pain *across all species* (this is a consistent, if contested, theory, not special pleading).
      *   **Non-Instance:** Arguing that a specific behavior is ambiguous in *both* dogs and crabs (consistent skepticism).
      *   **Awkward Case (AI):** If you demand a "human-like neural signature" from an AI to prove it thinks, that is **Substrate Special Pleading**. If you accept behavioral competence in a human but demand neural proof in a machine, it fits the pattern.
      *   **Awkward Case (Skeptic Right):** If it turns out crabs *are* philosophical zombies (no inner experience despite behavior), was it special pleading? **No.** Special pleading is about the *reasoning process*, not the final truth. If the skeptic applied the same strict standard to the dog initially, they were consistent. If they relaxed the standard for the dog but kept it strict for the crab, it is special pleading, even if they accidentally land on the truth about the crab.

  ### 3. Is it a Mistake, or Just Bayesian Priors?

  Your vet student is half-right, but missing the critical failure point.

  *   **The Valid Part (Uncontroversial):** It is rational to have different **Priors**. Evolutionary continuity suggests a dog is more likely to share human-like pain states than a bee. Starting with a higher probability for the dog is not a mistake.
  *   **The Mistake (My Take):** The mistake is **Prior Dominance** (or "Immunization"). In Bayesian updating, if the Likelihood Ratio (the strength of the new evidence) is high enough, it should overcome a moderate prior.
      *   If the crab's behavior + analgesia response is *stronger* evidence than the dog's limp, the Likelihood Ratio for the crab should be *higher*.
      *   If the skeptic refuses to update their belief regardless of the strength of the evidence (by demanding impossible proof like verbal report), they are not doing Bayesian reasoning; they are treating the Prior as a **Fixed Constant**.
      *   **Verdict:** It is a reasoning error to treat a prior probability as an unfalsifiable axiom.

  ### 4. The Parallel: Covert Consciousness

  You mentioned the unresponsive patients. The clinical term there is **Cognitive Motor Dissociation**.
  *   **The Parallel:** In medicine, the error was assuming *behavioral responsiveness* was necessary for consciousness. In animal minds, the error is often assuming *mammalian neural hardware* is necessary for consciousness.
  *   **The Lesson:** Both are **False Negative Errors** caused by using a proxy (behavior/cortex) as a definition.
  *   **Consensus:** In medicine, this is now accepted as a diagnostic risk. In animal cognition, it is the central live dispute.

  ### 5. Summary for Your Group (with Confidence Flags)

  Here is how you can present this without overstating consensus:

  1.  **"Neurochauvinism"** (High Confidence Term): Use this for the argument that fish can't feel pain because they lack a cortex. *Flag:* Note that whether the cortex is actually necessary is a **live scientific dispute** (Rose vs. Sneddon/Braithwaite), not settled fact.
  2.  **"Phylogenetic Special Pleading"** (Proposed Term): Use this for the methodological asymmetry. *Flag:* This is a logical description, not a moral accusation. It highlights that the *criteria for evidence* are shifting, not just the conclusion.
  3.  **The Bayesian Rebuttal** (High Confidence Logic): Acknowledge the vet student's point about priors, but point out that **priors must be updateable**. If no behavioral evidence can ever overcome the prior, it is not a prior; it is a dogma.
  4.  **The "Hard Problem" Move** (High Confidence Observation): Point out that using metaphysical uncertainty to justify practical inaction is a choice, not a logical necessity (cite the **Precautionary Principle** in animal welfare).

  ### 6. One Final Distinction: Skepticism vs. Denial

  You asked if this is "just what good reasoning looks like when the prior is doing the work."
  *   **Good Reasoning:** "The evidence is suggestive, but given the phylogenetic distance, I remain agnostic until we see X." (This allows for updating).
  *   **The Phenomenon You Observed:** "The evidence is suggestive, but it *cannot* be pain because they lack Y (where Y is defined by the animals we already believe feel pain)."
  *   **The Difference:** The first is **Provisional Skepticism**. The second is **Circular Exclusion**. The phenomenon you are seeing is Circular Exclusion.

  **Confidence Summary:**
  *   **Neurochauvinism:** Established term in philosophy of animal mind (Andrews, Birch).
  *   **Fish Cortex Necessity:** **Heavily Contested.** Do not present this as fact.
  *   **Invertebrate Consciousness:** **Live Dispute.** (Cambridge Declaration says likely; skeptics say unproven).
  *   **Bayesian Priors:** **Uncontroversial** that they exist; **Contested** how strong they should be.
  *   **Phylogenetic Special Pleading:** **My coinage** for your specific description, based on established logical fallacies.

  This should give you the vocabulary to isolate the reasoning error without getting bogged down in the moral charge of "speciesism" or the metaphysical swamp of the "Hard Problem."
