answer: |-
  To run Brexit through futarchy, we must first replace the referendum question. In Robin Hanson's design, voters do not choose policy; they choose a welfare metric. Suppose the UK electorate voted to maximize **Real GDP per capita, measured by the ONS five years post-decision.** [Check: ONS methodology for real GDP per capita].

  The policies are "Leave" and "Remain." The market opens two conditional contracts: one paying £1 per unit of GDP in 2021 *if* Leave is adopted, another *if* Remain is adopted. Traders buy and sell based on expected economic performance. If the Leave contract trades at 28,000 and Remain at 30,000, Remain is implemented. The market on the unadopted branch (Leave) is typically cancelled or settled via a statistical model estimating the counterfactual, a known vulnerability in futarchy design since the counterfactual never physically occurs to verify the price.

  **1. The 2016 Markets vs. Futarchy**
  The 2016 betting markets predicted the *vote*, not the *outcome*. They priced the probability of a Remain victory at 75–90% [Check: Betfair implied probabilities June 2016], aggregating polling data and sentiment. This is a category error. Futarchy does not care who wins the vote; it cares about the causal link between policy and welfare. The failure of bookies to predict the vote tells us nothing about whether markets could predict the GDP impact of Brexit. Futarchy requires thin markets on politics to be replaced by thick markets on economics. The 2016 episode is neutral evidence: it shows politics is hard to predict, but futarchy assumes policy outcomes are easier to price than voter whims.

  **2. The Performative Prediction Problem**
  Futarchy assumes markets are thermometers. But if the market price is public, it becomes a thermostat. If the Leave contract crashes to 20,000 while Remain sits at 30,000, the media declares "Markets Predict Leave Disaster." This could depress Leave turnout or trigger capital flight, artificially validating the market's pessimism. Hanson's theory assumes rational actors who see through this, but behavioral feedback loops are not priced in. If the forecast causes the result, the market is not discovering truth; it is scripting it. Futarchy has no robust mechanism to prevent self-fulfilling prophecies when the market price is the primary signal to the public.

  **3. The Metric-and-Horizon Problem**
  The real power lies not in the market, but in defining the metric. If the welfare metric is GDP in 2021, the market likely selects Remain; the transition shock dominates. If the metric is GDP in 2040, regulatory freedom might dominate, potentially favoring Leave. Whoever writes the metric definition has already made the decision. Futarchy claims to separate values from beliefs, but the operationalization of values (time horizon, inflation adjustment, inclusion of inequality weights) is itself a belief-laden technical choice. The market only optimizes for the metric given; it cannot tell you if you picked the wrong metric.

  **4. Outcome-Side Manipulation**
  Price-side manipulation (trading to move odds) is costly; you lose on the trades. Outcome-side manipulation is darker. If a hedge fund holds a massive short position on the Leave contract, do they have an incentive to lobby for policies that tank GDP *given* Leave? In national policy, the stakes exceed market liquidity. A actor could lose £10 million on the market to gain £100 million via correlated financial positions or ideological victory by ensuring the policy fails. Futarchy relies on the cost of manipulation exceeding the profit. In sovereign policy, the "profit" from influencing national trajectory may dwarf the trading losses, making the market vulnerable to sabotage by those who can move the underlying variable.

  **Verdict**
  Brexit is not an argument against futarchy, but it highlights its fragility. The 2016 markets were voting markets, not governance markets. However, the metric and manipulation problems remain lethal.

  **The Strongest Pro-Futarchy Reply:**
  "Current governance is already manipulated by lobbyists and short-termists, but without the corrective pressure of explicit financial stakes. Futarchy doesn't require perfect markets; it requires markets *better* than politicians. Even with horizon bias and manipulation risks, a market aggregating thousands of independent estimates of GDP impact will outperform a cabinet of ideologues. The solution to manipulation is not to abandon markets, but to make them deeper and the penalties for outcome-sabotage criminal. Futarchy is not utopia; it is an upgrade on guessing."

  **Limitations:**
  Futarchy has no opinion on whether a referendum should be held at all. It only governs the choice *given* a decision rule. It also struggles with non-quantifiable values (sovereignty, identity) unless they can be proxy-metricized, which brings us back to the metric problem.

  [Check: Specific liquidity figures for 2016 Brexit betting markets; Hanson's specific proposal for counterfactual settlement in *The Futarchy* paper].
