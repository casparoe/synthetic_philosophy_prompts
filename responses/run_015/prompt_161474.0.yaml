  You should tap **SPLIT**.

  Your second flatmate is much closer to the truth, though their reasoning ("deciding for both of us") is more philosophical than mathematical. Your first flatmate is making a classic error in decision theory by ignoring the correlation data provided.

  Here is the arithmetic, the value of that 72%, and the tipping point where the strategy flips.

  ### 1. The Arithmetic

  To maximize your average payout (Expected Value), we need to compare the outcome of tapping SPLIT versus tapping TAKE, using the probability that your opponent does the same.

  The app tells you that matched pairs pick the same option **72%** of the time. Because you are matched based on identical decision profiles, your choice is strong evidence of their choice. We treat this 72% as the conditional probability of agreement:
  *   If you tap **SPLIT**, there is a **0.72** chance they tap **SPLIT**.
  *   If you tap **TAKE**, there is a **0.72** chance they tap **TAKE**.

  **Option A: You tap SPLIT**
  *   72% chance they SPLIT: You get **$600**.
  *   28% chance they TAKE: You get **$0**.
  *   **Expected Value:** $(0.72 \times 600) + (0.28 \times 0) = \mathbf{\$432}$

  **Option B: You tap TAKE**
  *   72% chance they TAKE: You get **$100**.
  *   28% chance they SPLIT: You get **$1000**.
  *   **Expected Value:** $(0.72 \times 100) + (0.28 \times 1000) = 72 + 280 = \mathbf{\$352}$

  **Verdict:** SPLIT yields an average of **$80 more** per game than TAKE.

  ### 2. Why your flatmates are (partially) wrong/right

  **Flatmate 1 (The Causal Argument):**
  They argue that the other person's choice is already fixed, so you should just pick the option that pays more in isolation ($1000 > $600 and $100 > $0). This is **Causal Decision Theory**. It works perfectly if you are paired with a *random* stranger.
  *   If paired randomly, you'd assume their choice is independent of yours. Using the 70% base rate ($P(\text{Split}) = 0.7$):
      *   EV(SPLIT) = $0.7 \times 600 = \$420$
      *   EV(TAKE) = $(0.7 \times 1000) + (0.3 \times 100) = \$730$
  *   Against a random stranger, **TAKE** is the dominant strategy. Your flatmate is ignoring the **72% correlation stat**, which invalidates the assumption of independence.

  **Flatmate 2 (The Evidential Argument):**
  They argue the 72% means you are "deciding for both." This is **Evidential Decision Theory**. While you aren't magically controlling their finger, your decision process is identical to theirs. If your logic leads you to SPLIT, their logic likely did too. The math above confirms that accounting for this correlation makes SPLIT the higher-EV choice.

  ### 3. How much does the 72% buy you?

  The 72% correlation is the *only* reason SPLIT becomes the correct move. It fundamentally changes the risk profile of TAKING.

  *   **Without correlation (Random Match):** TAKING is worth **$730** on average.
  *   **With correlation (72% Match):** TAKING is worth only **$352** on average.

  The matching mechanism punishes the "greedy" strategy (TAKE) by ensuring that when you try to exploit a SPLITTER, you are likely facing another TAKER instead. It buys you the safety to cooperate. While it only slightly increases the value of SPLITING (from $420 to $432), it crushes the value of TAKING.

  ### 4. The Tipping Point

  You asked how far off the numbers would have to be before the answer flipped. Assuming the correlation rate is symmetric (i.e., SPLITTERS match as often as TAKERS match), the base rate (70%) drops out of the equation, and only the correlation percentage matters.

  Let $c$ be the probability of matching (currently 0.72).
  *   $\text{EV(SPLIT)} = 600c$
  *   $\text{EV(TAKE)} = 100c + 1000(1 - c)$

  Set them equal to find the break-even point:
  $$600c = 100c + 1000 - 1000c$$
  $$600c = 1000 - 900c$$
  $$1500c = 1000$$
  $$c = \frac{1000}{1500} = \frac{2}{3} \approx \mathbf{66.7\%}$$

  **The Flip:**
  *   If the match correlation is **above 66.7%**, you should **SPLIT**.
  *   If the match correlation is **below 66.7%**, you should **TAKE**.

