answer: |-
  **Project Title:** Beyond the Mast: Distinguishing Mechanisms of Institutional Precommitment in Perpetual Organizations

  **1. Research Question**
  Do distinct mechanisms of institutional constraint (jurisdiction-stripping, cost-shifting, and agency-mandating) entail distinct normative justifications, such that applying a unified "Ulysses Contract" framework generates category errors in governance?

  This question admits a determinate answer. Either the three mechanisms identified in the preliminary analysis map to three distinct normative grounds (e.g., validity, prudence, and fiduciary instruction respectively), or they collapse into a single justificatory structure (e.g., all are ultimately reducible to fiduciary duty). The project will not merely survey the literature on precommitment but will test the structural integrity of the "Ulysses" analogy when applied to corporate persons with perpetual existence.

  **2. Problem Statement and Gap Analysis**
  The prevailing discourse on constitutional precommitment in private governance relies on three arguments that fail to distinguish between the *mechanics* of constraint and the *source* of their authority.

  First, the **Autonomy Argument** posits that an entity binds itself to protect its long-term will against short-term impulses. This fails for perpetual institutions because there is no psychological continuity between the founding board and current trustees. Unlike Ulysses, the foundation does not have a single "self" that persists over time; it has a succession of office-holders. Applying personal autonomy models here obscures the "dead hand" problem rather than solving it.

  Second, the **Contractarian Argument** treats the charter as a binding agreement between the donor and the institution. This ignores the non-contractual status of successor trustees who never consented to the terms. It assumes the obligation transfers with the assets, but offers no account of *why* the obligation transfers when the personal relationship does not.

  Third, the **Functional Argument** justifies constraints solely by their efficacy in preventing mission drift. This conflates *is* with *ought*. A constraint may effectively prevent drift while being normatively illegitimate (e.g., a spend-rate cap that forces insolvency). By focusing on outcome rather than mechanism, this view cannot distinguish between a prudent guardrail and a destructive shackle.

  None of these positions account for the structural difference between making an action *invalid* (jurisdiction-stripping), making an action *expensive* (cost-shifting), and instructing an agent *what to do* (mandating). If these mechanisms require different justifications, current governance handbooks are categorizing them incorrectly, leading to confused deliberation when trustees consider amendments.

  **3. Methodology**
  The project will employ **Applied Conceptual Analysis**. This is distinct from pure conceptual analysis (which would remain abstract) and pure case study (which would describe practices without evaluating their normative coherence). The method involves constructing a taxonomy of constraint mechanisms and stress-testing them against the specific clauses of the foundation's charter.

  *   **Months 1–2 (Taxonomy Construction):** Define the three categories precisely.
      *   *Incapacity:* Clauses that render contrary actions void *ab initio* (e.g., court-petition requirements).
      *   *Friction:* Clauses that raise the transaction cost of deviation (e.g., supermajority voting).
      *   *Mandate:* Clauses that instruct agents on substantive outcomes without altering procedure (e.g., donor letters on staffing).
  *   **Months 3–5 (Charter Audit):** Map the foundation's existing governance documents onto this taxonomy. Analyze meeting minutes where these clauses were invoked to determine if trustees treated them as binding, advisory, or procedural.
  *   **Months 6–7 (Stress Testing):** Apply counterfactuals. If the "Incapacity" clause were removed, would the "Friction" clause sustain the constraint? If the "Mandate" conflicts with the "Incapacity" clause, which prevails? This tests whether the justifications are independent or hierarchical.
  *   **Month 8 (Handbook Drafting):** Translate findings into governance protocols. Define when each mechanism is appropriate and what threshold of justification is required to invoke them.
  *   **Month 9 (Working Paper):** Draft the theoretical argument for external review.

  **Why this approach?** Pure conceptual analysis would fail to engage with the actual friction points trustees face, rendering the output useless for the fellowship's practical goal. A pure case-study approach would catalog *how* foundations govern but could not answer *whether* the reasoning they use is coherent. Applied Conceptual Analysis allows us to use the real charter as a "laboratory" for the philosophical distinctions.

  **4. Range of Conclusions**
  1.  **Distinct Justifications (Strong Taxonomy):** Incapacity requires a high bar of external validity (e.g., legal compliance); Friction requires a demonstration of prudence (e.g., preventing rash decisions); Mandate requires fiduciary alignment. *Decision Criterion:* If trustees can coherently argue for changing a Friction clause while accepting an Incapacity clause, the distinction holds.
  2.  **Unified Fiduciary Duty (Collapse):** All three mechanisms are ultimately reducible to the trustees' duty to fulfill the mission. The mechanism matters only tactically. *Decision Criterion:* If every constraint can be overridden by a sufficiently strong fiduciary argument, the "precommitment" is illusory.
  3.  **Agency Error (The "Helmsman" Hypothesis):** Most "precommitments" are actually mislabeled agency instructions. The normative problem is not binding successors, but ensuring agents follow instructions. *Decision Criterion:* If the constraints bind the *office* rather than the *person*, the Ulysses analogy is discarded entirely.

  **5. Failure Conditions**
  The project fails if:
  *   **Instability:** The three categories cannot be mutually exclusively defined (e.g., a supermajority requirement turns out to be a form of partial incapacity).
  *   **Indeterminacy:** The analysis concludes that "it depends on context" without providing heuristics for *which* context matters.
  *   **Scope Creep:** The attempt to solve the "dead hand" problem broadly overwhelms the specific analysis of the foundation's charter.
  *   **Triviality:** The distinctions turn out to be semantic variations of existing legal concepts (e.g., *ultra vires* vs. procedural bylaws) without adding normative clarity.

  **6. Scope Assessment**
  Nine months at one day per week (approx. 36 working days) is tight for a philosophical argument of this nature. The risk is that the Working Paper remains a "framework proposal" rather than a defended thesis. To mitigate this, the scope is limited to *private perpetual institutions* and does not attempt to resolve the broader political philosophy of constitutionalism. The Handbook Chapter is the priority deliverable; the Working Paper is a secondary output that documents the theoretical underpinnings. If the theoretical distinctions prove too unstable by Month 6, the project will pivot to producing a "Governance Taxonomy" for practitioners without claiming a definitive philosophical resolution.

  **7. Note for Funders (Plain English)**
  *Why fund a philosophical analysis instead of an empirical study on what prevents mission drift?*

  Empirical studies can tell you which governance rules *work* to keep an organization on track. They cannot tell you if those rules are *fair* or *legitimate*.

  Imagine a rule that prevents a foundation from ever spending more than 3% of its endowment. An empirical study might show this rule successfully preserves the foundation for 100 years. But if a crisis occurs in year 10 where spending 5% is the only way to save the beneficiaries, the empirical rule says "stick to 3%." A philosophical analysis asks: "Did the founders have the right to bind us to a rule that might hurt the people we are supposed to help?"

  This project helps the foundation distinguish between rules that are wise guardrails and rules that are dangerous shackles. It ensures that when the board ties its own hands, it knows exactly *why* it is doing so, and when it is permissible to cut the rope. Without this clarity, governance is just following a script without understanding the plot.

  **8. Risk Register**

  | Move / Claim | Confidence | Risk Mitigation |
  | :--- | :--- | :--- |
  | **Taxonomy Stability:** That Incapacity, Friction, and Mandate are mutually exclusive categories. | Medium | If categories blur, pivot to a spectrum model (Degree of Constraint) rather than distinct types. |
  | **Normative Salience:** That these mechanical differences actually change the moral justification required. | High | Test against counter-examples in Months 6-7. If no difference is found, conclude "Unified Fiduciary Duty." |
  | **Feasibility:** That 36 days is sufficient for conceptual analysis + handbook. | Low | Prioritize Handbook. Reduce Working Paper to a "Concept Note" if time runs short. |
  | **Applicability:** That the findings apply to other foundations, not just this specific charter. | Medium | Use the specific charter as a proof-of-concept, but abstract the principles in the final paper. |

  **Least Certain Claim:** The claim that **Normative Salience** is High.
  *Condition for Falsification:* It is possible that upon rigorous analysis, all three mechanisms reduce to a single principle: "The Trustees must act in the best interest of the Mission." If this is true, the mechanical distinction (Incapacity vs. Friction) is legally relevant but philosophically inert. If this occurs, the project's core contribution shifts from "Three Justifications" to "Debunking the Ulysses Analogy," which is still a valuable negative result, but requires reframing the proposal's success criteria.
