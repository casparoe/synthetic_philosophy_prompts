          *   *Why not pure case study?* Won't solve the normative confusion, just describes现状.
          *   *Hybrid:* "Applied Conceptual Analysis."
      *   **Possible Conclusions:**
          1.  *Taxonomy Holds:* Each needs different justification (e.g., Incapacity needs high bar, Friction needs prudence).
          2.  *Taxonomy Collapses:* It's all just "Fiduciary Duty" in disguise.
          3.  *Ulysses is Wrong:* It's all Agency/Mandate, not Precommitment.
      *   **Failure Conditions:**
