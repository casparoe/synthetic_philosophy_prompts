          *   No determinate answer found (it's all context-dependent).
          *   Scope creep (trying to solve the Dead Hand problem entirely).
      *   **Scope Assessment:** 9 months @ 1 day/week = ~36 days. This is tight. Need to limit the theoretical depth. Focus on the *application* to the foundation's charter.
      *   **Funder Section:** Why theory? Because empirical studies tell you *if* it prevents drift, not *if it should*. You need to know if the constraint is *legitimate* before you measure its *efficacy*.
      *   **Risk Register:** Confidence levels. Weakest claim: That the distinctions are normatively salient.

