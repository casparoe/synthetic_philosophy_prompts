      *   **Format:** Concrete cases/scenarios (no abstract "do you agree?" questions). Two or three answer options per question. Scoring key mapping patterns to philosophical positions.
      *   **Specific Content Requirements:** Must include Pascal's Mugging, Skeptic-Rewarding God, Coin-Flip/Half-In strategy, Practice vs. Decision, Cost of Wagering (intellectual honesty vs. nothing).
      *   **Scoring Key Leaves (Positions):**
          1.  Orthodox Pascalian (Prudence licenses belief).
          2.  Jamesian Pragmatist (Live, forced, momentous only).
          3.  Mixed-Strategy (Partial commitment rational).
          4.  Evidentialist (No belief without evidence, regardless of odds).
          5.  Infinity-Skeptic (Problem with unbounded utilities).
          6.  Many-Gods/Objector (Underdetermined by rival hypotheses).
      *   **Constraint:** Be honest about overlaps/indistinguishability in the key. Note implausible/unoccupied combinations.

  2.  **Deconstruct the Positions & Distinguishers:**
      *   *Orthodox Pascalian:* Maximize Expected Utility (EU). Infinity trumps finite cost. Belief can be willed or cultivated instrumentally.
      *   *Jamesian:* Will to Believe is only okay when evidence is insufficient *and* the option is live, forced, and momentous. If you can wait for evidence, you should.
      *   *Mixed-Strategy:* If full belief is impossible, hedging (probability matching, partial commitment) is better than all-in or all-out.
      *   *Evidentialist:* Epistemic norms trump pragmatic norms. Never believe $p$ just because it's useful.
      *   *Infinity-Skeptic:* Rejects infinite utilities in decision matrices (leads to absurdities like Pascal's Mugging).
      *   *Many-Gods:* The matrix is too wide; EU is undefined or equalized across too many options.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: The Core Wager (Infinity).* Need to test the infinity objection directly.
          *   Scenario: Standard Wager but framed as a model.
          *   Options: Accept the infinity math / Reject the infinity math / Accept math but reject the input.
      *   *Q2: Pascal's Mugging.* Crucial for the Infinity-Skeptic vs. Orthodox.
          *   Scenario: Street mugger threatens infinite torture unless you give $5. Probability $10^{-100}$.
          *   Options: Pay (EU wins) / Don't Pay (Infinity broken) / Don't Pay (Probability too low).
      *   *Q3: The Many-Gods Objection.*
          *   Scenario: Allah vs. Yahweh vs. Skeptic-God.
          *   Options: Pick the most probable / Pick the most beneficial / Admit decision theory fails here.
      *   *Q4: Volitional Belief (The Chaplain's point).*
