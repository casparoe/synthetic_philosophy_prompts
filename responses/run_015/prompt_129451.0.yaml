      *   *Section 3: The Corruption Threshold.* Why plasma but not blood? Why expenses but not fees? The "Market Corrosion" argument (Sandel) mixed with "Risk Management."
      *   *Section 4: Necessity vs. Luxury.* The water example. Inelastic demand protection.
      *   *Section 5: Synthesis - "Protected Spheres of Vulnerability."* The unifying theory.
