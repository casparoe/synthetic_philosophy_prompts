      *(Refining the Donor Priority point)*: Is it contractual? If I donate, I get points. That looks like a contract. But legally, it's not enforceable in the same way. It's a *policy incentive*. Philosophically, it leans towards *rule-utilitarianism* (maximize organs) wrapped in *civic duty* (donate to receive). I should highlight this tension.

      *(Refining Surrogacy)*: The "expenses only" rule is a legal fiction. It acknowledges the market reality while maintaining the *symbolic* non-market status of the child. This is key: *Semiotics of Law*.

      *(Refining Water)*: This connects bodily integrity to *environmental integrity*. Both are "life-sustaining commons."

      *Final Polish:* Ensure the conclusion offers a decisive verdict on the "unified account." It is likely a *pragmatic pluralism* rooted in protecting vulnerability, rather than a strict deontological or consequentialist single principle.

