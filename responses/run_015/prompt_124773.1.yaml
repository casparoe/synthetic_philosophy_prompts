      *   *Conclusion:* A formal model helps clarify the *structure* (Side B's concern) but won't solve the *normative* assignment (Side A's goal). It might actually deepen the divide by proving Side B right (yes, agency is distributed) while Side A says "so what, we still need to punish someone."
