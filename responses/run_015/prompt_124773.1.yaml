      *   *Side A:* Focuses on *retrospective accountability*. "Who do we punish/sue?" They assume a chain of causation exists and is findable. This is a legal/pragmatic view.
      *   *Side B:* Focuses on *moral agency*. "Who is actually blameworthy?" They argue that even if you find the human, the human didn't *really* control the specific outcome due to the black-box nature of deep learning/emergent behavior. This is a philosophical/deontological view.
      *   *User's Insight:* "Descriptive (who can be held to account) vs. Structural (where does the causal buck stop)." This is very sharp. It aligns with the distinction between *liability* and *moral blame*.

