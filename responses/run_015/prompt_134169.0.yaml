      *   *The "Vacuum" Thought Experiment:* Newton suggests that if two globes were connected by a cord in an immense vacuum, their tension would indicate their rotation even without external reference points. This is the clincher against the "distant matter" relationist view *within Newton's framework*. He posits that the effect exists *even if* the distant matter were absent.
