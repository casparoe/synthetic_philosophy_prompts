          *   *Example:* Economic forecasts. If a model predicts a recession, the Fed cuts rates, recession avoided.
          *   *Relevance:* This directly attacks the "automatically dumps you in the reference class" claim. It shows the loop can be negative feedback, not just positive.
          *   *Term:* *Lucas Critique* (macroeconomics).

      *   **Objection 2: Computational Irreducibility & Bounded Rationality.**
