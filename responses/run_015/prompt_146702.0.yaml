      *   The mechanism: $Prediction \rightarrow Reaction \rightarrow Confirmation$.
      *   The user's twist: It's not that the future is fixed; it's that the *reaction* to the prediction closes the loop.

  3.  **Brainstorming Defeaters/Objections:**
