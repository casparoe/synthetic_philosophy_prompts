answer: |-
  Here is a 50-minute lesson plan designed to be tight, conceptually clear, and resistant to the common pitfalls second-years encounter.

  ### 1. The Setup (0–5 Minutes)
  **Goal:** Bridge from Pure IEDS to Mixed Dominance without re-teaching basics.
  *   **Board Work:** Draw a generic 3x3 payoff matrix on the left. Leave the right side blank for definitions.
  *   **The Hook:** "Last week, we eliminated strategies that were beaten by a *single* other strategy. But what if no single strategy beats it, yet a *combination* of two strategies does? If I can guarantee a higher payoff by flipping a coin between Top and Bottom than by playing Middle, is Middle rational?"
  *   **Definition:** Write the condition for **Strict Dominance by a Mixed Strategy**: Strategy $s_i$ is strictly dominated if there exists a probability distribution $\sigma_i$ over *other* strategies such that $u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})$ for all $s_{-i}$.
  *   **Misconception 1 (The "Equilibrium Mix" Trap):** Head this off immediately.
      *   *Say:* "The mix $\sigma_i$ that dominates $s_i$ is a **proof tool**, not a recommendation. It proves $s_i$ is stupid. It does *not* mean you should play $\sigma_i$ in equilibrium. You might play something else entirely. Do not confuse the 'dominating mix' with the 'Nash mix'."

  ### 2. The Core Example (5–25 Minutes)
  **Goal:** One matrix that forces mixed elimination first, then enables pure elimination second.
  **Constraint:** The example must **conspicuously not have** any *pure* strategy dominance in Round 1. If they can solve it with Pure IEDS, they won't learn the new tool.

  **The Matrix (Write this clearly):**
  Player 1 (Rows): **T, M, B**. Player 2 (Cols): **L, C, R**.
  *(Payoffs are (P1, P2))*

  | | L | C | R |
  | :--- | :---: | :---: | :---: |
  | **T** | 2, 1 | 2, 0 | -1, 0 |
  | **M** | 0, 0 | 0, 10 | 0, 0 |
  | **B** | -1, 0 | 2, 0 | 2, 1 |

  **Step 1: Verify No Pure Dominance (5 mins)**
  *   Ask the class: "Does T dominate M?" (No, at C: $2 > 0$, but at L: $2 > 0$... wait, check B vs M. At L, $B=-1 < M=0$. At R, $B=2 > M=0$.)
  *   Confirm: No pure strategy strictly dominates another for Player 1. Pure IEDS is stuck.

  **Step 2: Find the Mixed Dominance (10 mins)**
  *   Prompt: "Look at T and B. T is good at L, B is good at R. M is 'okay' everywhere. What if we mix T and B?"
  *   Calculate $0.5T + 0.5B$:
      *   vs L: $0.5(2) + 0.5(-1) = 0.5$. (Compare to M: 0). **0.5 > 0**.
      *   vs C: $0.5(2) + 0.5(2) = 2$. (Compare to M: 0). **2 > 0**.
      *   vs R: $0.5(-1) + 0.5(2) = 0.5$. (Compare to M: 0). **0.5 > 0**.
  *   **Action:** Eliminate **M**.
  *   *Note on the "Average Fact":* You asked about the fact that "the average of two undominated strategies can be dominated." **Do not teach this.** It is true, but in a 50-minute section, it adds cognitive load without helping them solve problems. Focus on the utility of mixes *dominating* pure strategies, not the geometry of the dominated set. Skip it to save time for iteration.

  **Step 3: The Iteration (10 mins)**
  *   Now Player 2 faces only T and B.
  *   Look at Player 2's payoffs in the reduced game (Rows T, B only):
      *   L gives: 1 (if T), 0 (if B).
      *   C gives: 0 (if T), 0 (if B).
      *   R gives: 0 (if T), 1 (if B).
  *   Ask: "Is C dominated now?"
  *   Yes. L strictly dominates C (1>0 and 0=0... wait, need strict).
      *   *Correction to Board:* Change (B, L) payoff for P2 to **1**. Now L gives (1, 1) vs C (0, 0). L strictly dominates C.
  *   **Action:** Eliminate **C**.
  *   **Misconception 2 (Order Independence):** Address this *now*.
      *   *Say:* "We eliminated M, then C. Could we have done it in reverse? No, because C wasn't dominated until M was gone. But could we have eliminated something else first? For **Strict** dominance, the order of elimination does not change the final set of survivors. **However**, this magic only works for *Strict* dominance ($>$). If we were using *Weak* dominance ($\ge$), order would matter and we could get different results. We are sticking to Strict today. If you see a weak inequality, stop."

  ### 3. Link to Nash Equilibrium (25–40 Minutes)
  **Goal:** Clarify the relationship between IEDS and NE.
  *   **Theorem:** "If a strategy survives IEDS, is it a Nash Equilibrium strategy?"
  *   **Misconception 3 (Survivors = NE):**
      *   *Say:* "No. IEDS gives us a *superset* of the Nash Equilibria. Everything in a NE survives IEDS, but not everything that survives is a NE."
      *   In our example, T and B survive. Is (T, L) a NE? (Check payoffs). Is (B, R) a NE?
      *   Show that while we narrowed the game down, we haven't necessarily found *the* answer yet. We've just removed the impossible answers.

  ### 4. The Closing Question (40–45 Minutes)
  **Goal:** A quick check for structural understanding.
  *   **Ask:** "I have a 2x2 game. Player 1 has Up, Down. Player 2 has Left, Right. No pure strategy dominates. Can Player 1 eliminate a strategy because it is dominated by a *mixed* strategy?"
  *   **Expected Answer:** **No.**
  *   **Why:** To dominate a strategy with a mix, you need at least *three* strategies to mix over (to dominate the third). In a 2x2, a mix of Up and Down lies on the line segment between them; it cannot strictly dominate Up or Down itself. This tests if they understand the *dimensionality* required for mixed dominance, not just the arithmetic.

  ### 5. The "Refuse to Answer" (45–50 Minutes)
  **Goal:** Protect the scope of the lesson.
  *   **The Question to Expect:** A student will raise their hand and ask, *"So, what are the exact probabilities for the Mixed Strategy Nash Equilibrium in this game?"*
  *   **Your Response:** "I am not going to answer that today."
  *   **The Reason:** "This section is about **Rationalizability** (what can we eliminate?), not **Equilibrium Calculation** (what exactly will they play?). Calculating the MSNE requires indifference conditions and solving equations. Using mixes for dominance requires only inequalities. If you mix these two procedures, you will fail the exam question on IEDS. We will do MSNE calculation in a different section."

  ### Summary of Board Layout
  *   **Left:** The 3x3 Matrix (updated as you cross out M, then C).
  *   **Center:** Definition of Mixed Dominance + "Strict vs. Weak" Warning Box.
  *   **Right:** "Misconceptions" List (1. Dominating Mix $\neq$ NE Mix, 2. Survivors $\supseteq$ NE).

  ### Why This Order?
  1.  **Definition first** ensures they know *what* they are looking for before getting lost in the numbers.
  2.  **Example second** anchors the abstract definition. By making Round 1 impossible via Pure IEDS, you force them to use the new tool.
  3.  **Iteration third** shows the power of the tool (it unlocks further elimination).
  4.  **NE Link fourth** prevents them from overclaiming what IEDS achieves.
  5.  **Closing Question** verifies they aren't just doing arithmetic but understand the structural constraints.
