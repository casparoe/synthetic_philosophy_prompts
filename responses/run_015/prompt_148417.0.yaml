answer: |-
  ### Brainstorm & Scratchpad

  *   **The Core Vibe:** This is definitely in the wheelhouse of Thomas Schelling (strategy of conflict), Derek Parfit (reasons and persons), and the modern LessWrong/Functional Decision Theory crowd (Yudkowsky, Soares).
  *   **Instance 1 (Public/Strategic):** This is classic **Precommitment**. Like Ulysses tying himself to the mast. Or the "Madman" strategy in game theory. You limit your own options to make your threats credible. The "gut-level refusal" is making the precommitment *costly to break* (actually changing your preferences, not just lying).
  *   **Instance 2 (Private/No Audience):** This is where it gets spicy. Why keep the rule if no one sees?
      *   *Explanation A (Virtue Ethics):* It's about character, not outcomes. (But the prompt implies these are decision theorists, not virtue ethicists).
      *   *Explanation B (Self-Signaling):* I need to signal to *myself* that I'm the kind of person who keeps rules, so I don't lose confidence in my future self.
      *   *Explanation C (Functional Decision Theory):* You don't choose actions; you choose *algorithms*. If your algorithm says "break rules in private," it's the same algorithm that says "break rules in public." You can't have it both ways. The "payoff" exists in the counterfactual world where you are tested, which depends on your code *now*.
  *   **The "Category Error" Claim:** Proponents say asking "what's the payoff here?" is a mistake because the payoff isn't in *this specific instance*, it's in the *reliability of the decision procedure* across all instances (including hypothetical ones).
  *   **Existing Terms:** "Resolute Choice" (McClennen), "Sophisticated Choice," "Self-Signaling," "Time Consistency." None perfectly capture the *transition* from public strategy to private identity.
  *   **Coining Idea:** I need a term that captures maintaining a strategic posture when the strategy has no external target.
      *   *Idea 1:* "Intrinsic Precommitment."
      *   *Idea 2:* "Solitary Type-Maintenance."
      *   *Idea 3:* "Constitutive Rationality."
      *   *Selection:* **"Intrinsic Type-Locking."** It captures the idea of locking your "type" (decision algorithm) even without external pressure.
  *   **The Map:**
      *   *Bucket 1 (Strategic):* External audience, credible threats, game theory.
      *   *Bucket 2 (Private):* Internal audience, algorithmic consistency, identity.
      *   *Boundary:* Self-signaling (I watch me).

  ---

  ### The Response

  Yeah, I know exactly the itch you're scratching. You've put your finger on one of the most friction-heavy spots in modern decision theory. It's the place where "winning" stops looking like getting the most cookies in *this* specific game and starts looking like "being the kind of agent who gets cookies in *all possible* games."

  Here's the breakdown, the existing jargon (translated), and a proposal for naming that specific gap you're seeing.

  #### 1. The Established Terrain
  First, you aren't imagining this. The first instance you described is standard **Strategic Precommitment**. That's Thomas Schelling's bread and butter. It's the logic of burning your bridges so the enemy knows you can't retreat. The "gut-level refusal" is just making sure the bridge-burning is visible and irreversible. If you can just "reason your way out of it," the precommitment is fake, and the other player (or your future self) won't trust it.

  The second instance—where there's no audience and no future negotiation—is where the literature fractures.
  *   **Causal Decision Theorists** (the old school) usually say you're right: this *is* a mistake. If the act has no causal impact on the outcome, doing it is "rule worship."
  *   **Evidential & Functional Decision Theorists** (the newer crowd) say the objectors are the ones making the category error. They argue you aren't choosing an *act*; you're choosing a *policy*. If your policy is "break rules when alone," then you are the *type* of agent who breaks rules. Therefore, in any scenario where someone *is* watching (like the Hitchhiker case), they will predict you'll break the rule, and you lose the payoff there.

  So, the justification for the private version is that **you cannot compartmentalize your rationality.** Your private decision reveals your source code.

  #### 2. Naming the Gap
  There isn't one single canonical term for the *split* between the public and private versions, though **"Resolute Choice"** (Edward McClennen) comes close to describing the behavior of sticking to the plan. However, that doesn't capture the *transition* you're noticing—taking a logic that relies on observers and applying it when no one is there.

  Let's coin a term for this specific move. I propose calling it **"Intrinsic Type-Locking."**

  *   **Type:** Refers to "agent type" (the kind of person/algorithm you are).
  *   **Locking:** Refers to the precommitment aspect (making it hard to change).
  *   **Intrinsic:** Signifies that the lock is maintained for its own sake, not for an external audience.

  #### 3. Mapping the Carving
  Here is how I would draw the boundaries between the buckets using this framework.

  **Bucket A: Strategic Precommitment (The "Hitchhiker" Zone)**
  *   **The Logic:** "I must refuse X so *others* predict I will refuse X, which causes them to reward me."
  *   **The Audience:** External (other people, opponents, partners).
  *   **The Payoff:** Tangible, causal. You get the ride because the driver believes you'll pay.
  *   **Example:** Cultivating a reputation for never negotiating with terrorists.
  *   **Status:** Widely accepted as rational in game theory.

  **Bucket B: Intrinsic Type-Locking (The "Private" Zone)**
  *   **The Logic:** "I must refuse X so *I remain* the type of agent who refuses X, which ensures I win in counterfactual scenarios."
  *   **The Audience:** None (or "The Universe"/Logic itself).
  *   **The Payoff:** Acausal. You don't get rewarded *here*. You get rewarded because being this type makes you win *elsewhere* (in logical space, not just physical space).
  *   **Example:** Refusing to cheat on a test even if you know for a fact you will never be caught and it won't affect your future behavior.
  *   **Status:** Controversial. Accepted by Functional Decision Theorists and Kantians; rejected by Causal Decision Theorists.

  **The Boundary: Self-Signaling (The "Mirror" Zone)**
  *   **The Logic:** "I must refuse X so *I believe* I am the type of agent who refuses X."
  *   **The Audience:** Internal (your own self-model).
  *   **The Payoff:** Psychological confidence. If you cheat in private, you lose faith in your own resolve, making you more likely to crack in public later.
  *   **Example:** A dieter eating a salad when alone, not because calories matter right now, but to maintain the identity of "a dieter."
  *   **Status:** This is the bridge. It turns the private act into a public one (where you are both the actor and the observer). This is often where the "category error" accusation dissolves, because there *is* a psychological payoff (maintaining self-efficacy).

  #### 4. Is the Private Version a Misapplication?
  This is the million-dollar question.

  If you view rationality as **maximizing outcomes in the immediate causal chain**, then yes, Intrinsic Type-Locking is a misapplication. It's "rule worship." You're sacrificing a sure win (cheating successfully) for a magical belief that it helps you elsewhere.

  However, if you view rationality as **optimizing your decision algorithm**, then it is *not* a misapplication. You can't run one algorithm for private moments and a different one for public moments. You are one agent. If your algorithm outputs "defect when alone," it is fundamentally a "defector" algorithm. Other agents (or the structure of reality, in Newcomb-like problems) will treat you as a defector.

  **The Verdict:**
  The "category error" claim holds water *only if* you accept that your private choices are logically linked to your public outcomes (via your identity or algorithm). If you reject that link, it's just superstition.

  So, when you see someone insisting on the private refusal, they are essentially saying: **"I am not optimizing for this moment; I am optimizing for my source code."**

  Does **"Intrinsic Type-Locking"** feel like it captures the shape of what you're seeing? It distinguishes the "doing it for them" (Strategic) from the "doing it to be the kind of person who does it" (Intrinsic), with Self-Signaling as the messy middle ground where psychology meets game theory.
