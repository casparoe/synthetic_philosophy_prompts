  - Coin known to have chance 0.7 of heads: 0.7 only; 0.5 and 0.65 both out.
  - Disease with 1% prevalence, test 99% sensitive and 99% specific, positive result: 0.5. She said 0.05 is out (that ignores the test) and 0.95 is out (that ignores the base rate).
  - Urn drawn at random from a warehouse where a third of the urns are 90% red and two thirds are 30% red, no draws observed yet: 0.5. She specifically said 0.6 is wrong ("that's what you get if you treat the two urn types as equally likely") and 0.3 is wrong ("being cautious isn't an accuracy consideration").
  - Credence 0.7 in heads and 0.7 in tails: out, "accuracy-dominated by 0.5/0.5."
  - Twice now someone has raised a case with genuinely mushy evidence — a vague eyewitness, a "maybe" from a lab technician — and both times she said the case was under-described and moved on.

  She always works with the quadratic/Brier score, and she said once that the choice of proper scoring rule "doesn't do any work in any case I've shown you," which Im not sure is a hint or just a disclaimer. She also keeps saying something like: chance-matching does the work when the chances are pinned down, and it runs out when they aren't.

  Next week's case: a field kit for a plant disease. Base rate in the field is 50%. The kit reads "infected." Kits are either fresh (90% accurate, both ways) or expired (60% accurate, both ways), and with a 50% base rate that means the chance of infection given the reading is either 0.9 or 0.6, depending on which kind of kit you have. You don't know which yours is. Your only evidence is that the technician handed it to you and said "I think its fresh," so your confidence that the kit is fresh sits around 0.7 to 0.75 — except you can't pin it down, and anything from 0.6 to 0.9 would honestly feel fine to you.

