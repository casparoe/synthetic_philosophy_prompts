  8.  **Proceed to generate output.** (Mental outline complete).

  *(Self-Correction during final output generation)*: Make sure the distinction between Vitiation and Invalidation is the *core* lens through which the disagreements are viewed, as requested.

  *   *Invalidating:* The consent never existed. (Like a forged signature).
  *   *Vitiating:* The consent existed but is morally voidable. (Like a contract signed under mild undue influence).
  *   Camp 1 tends to see things as Vitiating (the act happened, but was wrong).
  *   Camp 2 tends to see things as Invalidating (the power dynamic made the act impossible).
  *   *Wait, nuance:* Camp 1 might say some things are Invalidating (unconsciousness). Camp 2 might say some things are Vitiating (minor misunderstandings). The disagreement is on the *boundary* regarding deception/coercion. I need to reflect this nuance.

