      *   **My Role:** Expert in philosophical ethics and professional mediator for adversarial collaborations.
      *   **Task:** Draft a joint statement of an adversarial collaboration between two camps (Threshold-Disclosure vs. Relational-Transparency) on valid consent (deception, coercion, competence).
      *   **Key Conceptual Distinction:** Vitiating conditions (nullify after the fact) vs. Invalidating conditions (prevent formation).
      *   **Required Format:**
          1.  Agreed Claims (numbered section).
          2.  Disagreements Table (phrased in acceptable wording for each camp).
          3.  Cruxes (sub-questions where settlement moves a camp).
          4.  Agreed Tests/Arguments/Hypotheticals (with specific cases: "Green Pill" and "Gig-Worker").
      *   **Constraints:** No citations/bibliographies/web access reliance. No obscure named theories. Grounded in reasoning. Precise residual disagreement.

  2.  **Brainstorming & Conceptual Mapping:**
      *   *Camp One (Threshold-Disclosure):* Liberal/Contractualist leaning. Focus on autonomy as non-interference. Consent is a transaction. Key metric: Did the agent get the info they *need* to decide, and are they *capable*? Deception matters if it changes the "deal." Coercion matters if it's a "gun to the head." Competence is internal.
      *   *Camp Two (Relational-Transparency):* Feminist/Structuralist leaning. Focus on autonomy as relational empowerment. Consent is a process/status. Key metric: Is the relationship trustworthy? Is the context free from oppressive pressure? Deception matters because it breaks trust. Coercion includes "starve or sign." Competence is supported by the environment.
      *   *The Distinction:*
          *   *Invalidating:* The act never happened. No consent existed at $t_0$. (e.g., sleeping person, severe psychosis).
          *   *Vitiating:* Consent existed at $t_0$ but is retroactively voided due to a defect discovered later or a condition that undermines the moral force. (e.g., finding out later the doctor lied about a risk).
          *   *Camp 1 View:* Most deception/coercion is *vitiating*. It happened, but it's wrongful.
          *   *Camp 2 View:* Many forms of deception/coercion are *invalidating*. The power dynamic meant consent was never possible.
      *   *The Cases:*
          *   *Green Pill:* Clinical trial. Subject thinks they might get drug, actually get placebo (or vice versa/deceived about arm). Welfare improved.
              *   Camp 1: Valid (or merely vitiated but permissible). Material risk unchanged.
              *   Camp 2: Invalid. Trust broken. Structural epistemic violence.
          *   *Gig-Worker:* Click-wrap agreement. Economic desperation. Unreadable text.
              *   Camp 1: Valid. No explicit threat. Competence assumed unless proven otherwise.
              *   Camp 2: Invalid. Structural coercion. Competence undermined by design.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the tone. Professional, collaborative, acknowledging the adversarial nature but aiming for clarity.
      *   **Section 1: Agreed Claims:** Need to find common ground. Both agree consent matters. Both agree it involves agency. Both agree the Vitiation/Invalidation distinction is useful. Both agree that *some* deception/coercion kills consent.
      *   **Section 2: Disagreements Table:** This needs careful phrasing. Camp 1 shouldn't sound callous; Camp 2 shouldn't sound impossible to satisfy.
          *   *Deception:* Camp 1 = Materiality focus. Camp 2 = Trust focus.
          *   *Coercion:* Camp 1 = Threat focus. Camp 2 = Option-set/Power focus.
          *   *Competence:* Camp 1 = Internal capacity. Camp 2 = Scaffolded capacity.
          *   *Vitiation vs. Invalidation:* Camp 1 = Mostly Vitiation. Camp 2 = Mostly Invalidation.
      *   **Section 3: Cruxes:** What specific questions, if answered, would change minds?
          *   Does the *source* of pressure matter (human threat vs. circumstance)?
          *   Is the *purpose* of the norm protection of choice or protection of relationship?
          *   Does retrospective welfare justify prospective epistemic violation?
      *   **Section 4: Agreed Tests/Cases:**
          *   *Green Pill:* Camp 1 predicts Valid/Permissible. Camp 2 predicts Invalid/Impermissible.
          *   *Gig-Worker:* Camp 1 predicts Valid (procedural). Camp 2 predicts Invalid (structural).
          *   *Need to specify the "move" condition:* If Camp 1 admits the Gig-Worker case is invalid, do they expand coercion? If Camp 2 admits Green Pill is valid, do they accept materiality?

  4.  **Refining the Tone and Content:**
      *   *Tone:* Mediator-like. "We have identified," "Both camps acknowledge." Avoid bias.
      *   *Precision:* Ensure "Vitiation" and "Invalidation" are used consistently.
      *   *Biologist Persona:* Keep it analytical, like a field report or a taxonomy. Clear definitions.
      *   *Check:* Did I include the specific distinction requested? Yes. Did I include the specific cases? Yes. Is the format correct? Yes.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the distinction between vitiation and invalidation clear enough?
      *   *Fix:* Add a specific definition in Section 1 to lock it down. Invalidation = "No consent event occurred." Vitiation = "Consent event occurred but lacks moral force."
      *   *Critique:* Are the camps talking past each other in the table?
      *   *Fix:* Ensure Camp 1 acknowledges relational factors but weighs them differently. Ensure Camp 2 acknowledges individual agency but contextualizes it.
      *   *Critique:* Is the "Green Pill" case specific enough?
