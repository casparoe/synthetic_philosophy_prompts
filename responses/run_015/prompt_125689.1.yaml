answer: |-
  # Handout: The Glyph Game

  **Course:** PHIL 405 Seminar  
  **Session:** Rules & Norms  
  **Materials:** Index cards, markers.

  ### I. The Formalism
  You are working with a **Glyph System**. There are only two symbols allowed:
  *   `|` (Stroke)
  *   `•` (Dot)

  A **String** is any sequence of these symbols (e.g., `|•|`, `•••`, `|`).
  A **Transformation** is a rule that takes an Input String and produces an Output String.

  ### II. The Roles
  You will work in pairs. One of you is the **Inventor**, one is the **Learner**. (You will switch roles in Round 2).

  **The Inventor's Task:**
  1.  Write a **Rule** on the back of an index card. The Rule must be a clear instruction in English on how to transform any Input String into an Output String.
      *   *Constraint:* Your Rule cannot reference the "meaning" of the symbols (e.g., do not treat `|` as the number 1). It must be about the shapes/positions.
      *   *Constraint:* Your Rule must be deterministic (same input always = same output).
  2.  Generate **Three Training Examples** on the front of the card.
      *   Format: `Input` → `Output`
      *   Keep the strings short (max 6 glyphs) so the Learner can compute them quickly.
  3.  Keep the Rule hidden. Show only the Three Training Examples to the Learner.

  **The Learner's Task:**
  1.  Study the Three Training Examples.
  2.  Infer the Rule.
  3.  You will be given a **Test Input** by the Instructor. Write down the **Test Output** on your own card.

  ### III. Scoring (The Stakes)
  *   **Match:** If the Learner's Test Output matches what the Inventor's Rule *actually requires*, the pair earns **2 Seminar Points**.
  *   **Mismatch:** If they differ, **0 Points**.
  *   *Note:* The Instructor will verify the match by checking the Inventor's hidden Rule card.

  ### IV. The Adjudication Protocol
  At the end of the session, one pair will be selected for **Public Adjudication**.
  1.  The Inventor states what they *meant*.
  2.  A **Deviant Interpretation** will be proposed that fits all Training Examples perfectly.
  3.  The Class votes on whether the Deviant Interpretation is **Valid** or **Invalid**.
  4.  The majority verdict determines the Points for that round.

  ---

  # Minute-by-Minute Timeline (80 Minutes)

  **0:00 – 0:05 | Distribution & Grouping**
  *   Hand out the Glyph Game sheets.
  *   Divide 14 students into 7 pairs.
  *   Assign roles (Inventor/Learner).
  *   **Instructor Script:** "Read the handout. You have 5 minutes to complete Round 1. Do not discuss your Rule with your partner. Begin."

  **0:05 – 0:20 | Round 1 (Invention & Training)**
  *   Inventors write rules and generate 3 examples.
  *   *Instructor Patrol:* Watch for rules that are too vague ("Make it pretty") or purely mathematical ("Count the strokes"). Gently steer them back to glyph manipulation (e.g., "Reverse the string," "Add a dot to the end").
  *   Inventors pass cards to Learners.
  *   Learners study examples.

  **0:20 – 0:35 | Round 1 (Testing & Scoring)**
  *   **Instructor Script:** "Stop. Everyone, look at the projector."
  *   Project a **Test Input** (e.g., `|•|•|`).
  *   Learners write their Output.
  *   Pairs reveal and compare.
  *   Collect cards. Instructor quickly tallies matches (visually check if Output aligns with stated Rule).
  *   Announce scores. (Build tension: "Pair 3, you matched. Pair 5, you did not.")

  **0:35 – 0:40 | Round 2 (Swap Roles)**
  *   Repeat the process quickly with swapped roles. Use a new Test Input.
  *   *Purpose:* Reinforce the feeling of "grasping" a rule vs. "guessing" it.

  **0:40 – 0:55 | The Adjudication (The Paradox Engine)**
  *   **Selection:** Choose one pair who *matched* successfully (high confidence). Let's say Pair 1.
  *   **Setup:** Ask the Inventor: "Write your Rule on the board." (e.g., "Add a `•` to the right end.").
  *   **The Twist:** Instructor takes a marker. "I propose a **Deviant Interpretation**."
  *   Write on the board: *"Add a `•` to the right end, **UNLESS** the total length of the Output String exceeds 1,000,000 glyphs, in which case add a `|`."*
  *   **The Challenge:** "This Deviant Rule fits every Training Example Pair 1 produced. It fits the Test Input we just did (since the strings are short). It is empirically indistinguishable from the Inventor's Rule within this classroom."
  *   **The Vote:** "Inventor says they meant the Simple Rule. The Deviant Rule fits the data. Is the Deviant Rule **Wrong**? Vote by show of hands."
  *   **Discussion (5 mins):** Ask 2 students why they voted "Wrong." Ask 1 student if they can prove it's wrong using *only* the cards on the table.
  *   **The Verdict:** Take a final vote. Award points based on the *Class Verdict*, not the Inventor's claim. (If Class says Deviant is Valid, Inventor loses points).

  **0:55 – 1:20 | Debrief & Mapping**
  *   Reveal the philosophical context (Kripke/Wittgenstein).
  *   Map the activity stages to the argument (see below).
  *   Discuss the cost of each solution (Dispositional, Communal, Realist).

  ---

  # Debrief Guide: Mapping the Activity to the Argument

  **1. The Normativity Question (0:55 – 1:05)**
  *   **Activity Moment:** The Scoring Phase (Round 1 & 2).
  *   **Philosophical Point:** When the Learner wrote the Test Output, they felt they *ought* to write a specific symbol. It wasn't just a prediction; it was an obligation imposed by the Rule.
  *   **Discussion:** "When you wrote the output, did you feel you were *guessing* what the partner wanted, or *following* what the examples demanded?"
  *   **Kripke Link:** Rules are normative (they tell us what we *should* do), not just descriptive (what we *do*). The paradox asks: What fact constitutes this 'ought'?

  **2. The Skeptical Hypothesis (1:05 – 1:12)**
  *   **Activity Moment:** The Adjudication (Shadow Rule).
  *   **Philosophical Point:** The Deviant Interpretation (`+` vs `quus` equivalent).
  *   **Discussion:** "Could anyone prove, using only the Training Cards, that the Million-Glyph Clause is false?" (No). "So why did most of you vote it was 'Wrong'?"
  *   **Kripke Link:** This is the Skeptical Paradox. There is no fact about the Inventor's past behavior, mental images, or written examples that logically forces one future application over the Shadow Rule. The "Meaning" seems to vanish.

  **3. The Solutions & Their Costs (1:12 – 1:20)**
  *   **Dispositionalism:** "The Inventor *would have* said 'Add Dot' even at 1 million."
      *   *Refutation:* What if the Inventor dies before reaching 1 million? What if they would have made a mistake? Dispositions are facts about what *happens*, not what *should* happen.
  *   **Realism (Platonism):** "The Rule exists in an abstract realm."
      *   *Cost:* How does the human mind grasp this abstract realm? It feels like magic. Also, why does the abstract realm care about `|` and `•` specifically?
  *   **Communal (The Skeptical Solution):** "It's wrong because *we* (the class) voted it wrong."
      *   *Activity Moment:* The Adjudication Vote.
      *   *Cost:* Truth becomes consensus. If the class voted the Deviant Rule was valid, it *would be* valid. This feels unsatisfying (what if the whole community is mad?), but it saves the practice of rule-following without needing magical facts.

  ---

  # Predicted Failures & Mitigation

  **1. The "Math" Slip**
  *   **Failure:** Students treat `|` as "1" and `•` as "0" or vice versa. They fall back on arithmetic certainty ("2+2=4 settles it").
  *   **Mitigation:** During Patrol (0:05-0:20), explicitly ban rules that rely on counting values. Force them to focus on *position* or *order* (e.g., "Flip the string"). If they do math, point out in the debrief that math is the *target* of Kripke's argument, so using it defeats the purpose.

  **2. The "Silly Hypothesis" Dismissal**
  *   **Failure:** During Adjudication, students laugh off the Million-Glyph Clause as "obviously not what was meant." They treat it as a pragmatic joke, not a logical possibility.
  *   **Mitigation:** You must be stern. "I am not asking what is polite. I am asking what is *logically entailed* by the evidence on the card. Does the card contain the number 1,000,000? No. Does it forbid the clause? No. Treat it seriously."

  **3. The "Mind-Reading" Defense**
  *   **Failure:** Students argue the Learner should have asked the Inventor what they *felt* in their head.
  *   **Mitigation:** Remind them of the Handout: "Keep the Rule hidden." In the debrief, emphasize that even the Inventor's *own memory* of what they meant is subject to the same skepticism (maybe they meant the Shadow Rule and forgot?).

  ---

  # Limitation of the Activity (Instructor Note)

  **What this activity cannot reproduce:**
  This activity successfully generates **ambiguity** (multiple rules fit the data). However, Kripke's paradox is stronger: it argues there is **no fact of the matter** about which rule was meant, *even for the Inventor in their own mind*.

  In the activity, the Inventor *knows* what they meant. They feel the certainty. The activity relies on the *Learner's* uncertainty to drive the point home.
  **You must supply the radical skepticism in your own words:**
  > "In the game, you felt the Inventor had a secret fact in their head that settled the score. Kripke's challenge is to ask: What *is* that fact? Is it a picture? A feeling? A brain state? None of those things contain the instruction for their own application. The Inventor feels certainty, but that feeling is just another mental event, not a justification. The activity makes you feel the *gap* between evidence and rule; I am asking you to accept that the gap exists even inside your own head."
