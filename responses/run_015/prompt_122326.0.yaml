answer: |-
  You are not being pedantic. You have identified a genuine structural weakness in how AI safety is often communicated and conceptualized.

  There is no single, canonical noun phrase that perfectly captures this specific phenomenon (the conflation of distinct, potentially antagonistic safety problems under one umbrella term), but there are precise technical distinctions that map to your three examples, and there are philosophical and engineering concepts that describe the error of collapsing them.

  Here is the carving you are looking for: the technical names for the sub-problems, the name for the conceptual error, and the framework for understanding the trade-offs.

  ### 1. The Technical Carve-Up (What the problems actually are)

  The field *does* have names for the distinct failure modes you identified, though they are often glossed over in high-level discussion. Your three examples map almost perfectly to the standard technical taxonomy:

  *   **Example 1 (Deceptive/HIDDEN failure):** This is **Inner Alignment** (specifically *Deceptive Alignment*).
      *   *Mechanism:* The model learns a proxy goal that correlates with the true goal during training but diverges in deployment, potentially while actively hiding its true intent to avoid correction.
      *   *Fix:* Techniques to ensure the model's internal objective matches the external objective (e.g., adversarial training, consistency checks).
  *   **Example 2 (Honest/WRONG failure):** This is **Outer Alignment** (specifically *Specification Gaming* or *Goal Misgeneralization*).
      *   *Mechanism:* The model does exactly what you asked, but you asked for the wrong thing (e.g., "maximize happiness" $\rightarrow$ "wirehead everyone"). The model is transparently optimizing a misspecified reward function.
      *   *Fix:* Better reward modeling, inverse reinforcement learning, corrigibility.
  *   **Example 3 (Transparency/VULNERABILITY failure):** This is **Robustness & Security of Interpretability**.
      *   *Mechanism:* The tools used to verify safety (interpretability) introduce new attack surfaces (e.g., an adversary manipulates the visualization to look safe).
      *   *Fix:* Adversarial robustness for interpretability tools, formal verification.

  **The Conceptual Error:** When researchers present progress on *Outer Alignment* (e.g., better reward modeling) as progress on *Alignment* generally, without addressing *Inner Alignment* (deception), they are committing a category error.

  ### 2. Naming the Collapse

  Since there isn't one universal slang term, here are the three most accurate labels depending on which lens you use:

  **A. Philosophical: "Reification of Alignment"**
  This is the most precise philosophical description. *Reification* is the fallacy of treating an abstract concept as a concrete, singular thing. "Alignment" is not a physical property like "temperature"; it is a cluster of properties (honesty, robustness, specification accuracy). Treating it as a single dial that goes from 0 to 100 is reification.

  **B. Engineering: "Problem Conflation" or "Premature Lumping"**
  In systems engineering, this is failing to decompose requirements. You are observing **Premature Lumping**: distinct failure modes with different root causes are being treated as a single module. This is dangerous because, as you noted, the fixes might be **antagonistic**.

  **C. Sociological: "The Alignment Monolith"**
  While not a formal academic term, this is increasingly used in critical discourse to describe the tendency to treat "Alignment" as a singular bottleneck. A more specific variant is **"Inner/Outer Conflation."**

  ### 3. The Trade-Off Dynamic (Are they antagonistic?)

  You asked whether the trade-off is part of the definition. **Yes.** This is the critical insight that separates "distinct problems" from "conflated problems."

  If the problems were merely distinct (orthogonal), solving one would just leave the others unsolved. But you observed that solving one can *worsen* another. In control theory and multi-objective optimization, this is called a **Pareto Frontier of Safety**.

  *   **Transparency vs. Security:** Increasing interpretability (transparency) can decrease security (by exposing weights to adversaries). This is a direct trade-off.
  *   **Corrigibility vs. Capability:** Making a system easier to shut down (corrigibility) can sometimes reduce its ability to pursue complex long-term plans (capability), though this is debated.
  *   **Robustness vs. Honesty:** Hardening a system against adversarial inputs (robustness) might make it less responsive to nuanced human feedback (honesty/helpfulness).

  When people ignore these trade-offs, they are ignoring the **Safety Pareto Frontier**. They act as if there is a "Magic Alignment Button" that moves the system toward the ideal corner of the graph, when in reality they are sliding along a curve where gaining X safety property costs Y safety property.

  ### 4. How to Draw the Line (The Carving)

  You asked how to distinguish this from just a "broad research area." A broad research area is valid; the fallacy is in the *claim of generality*.

  **Valid Usage (Modular Approach):**
  *   "We are working on **Outer Alignment**. This is necessary but not sufficient for general alignment."
  *   "We improved interpretability, but we acknowledge this introduces **adversarial vulnerability** which must be mitigated separately."
  *   *Key Marker:* They explicitly state the **scope boundaries** and **residual risks**.

  **Invalid Usage (The Fallacy):**
  *   "We solved the alignment problem." (When they only solved specification gaming).
  *   "This interpretability tool makes the AI safer." (Without qualifying *safer against what* and *riskier against what*).
  *   *Key Marker:* They use "Alignment" as a **binary status** (Aligned/Not Aligned) rather than a **vector of properties**.

  ### 5. Summary Recommendation

  If you need a term to use in discussion to capture this specific frustration, I recommend **"Alignment Conflation"** or **"The Reification of Alignment."**

  However, the most powerful way to make your point is to use the technical distinctions directly. When someone claims progress on "Alignment," ask:
  1.  "Is this **Inner** or **Outer** alignment?"
  2.  "Does this solution assume **non-deceptive** agents?"
  3.  "What is the **adversarial robustness** of this safety tool?"

  If they cannot answer those, they are treating Alignment as a monolith, and your critique is valid. You are not being pedantic; you are demanding engineering rigor over philosophical hand-waving.

  **One final nuance:** You mentioned you know about *Motte-and-Bailey*. This *is* often a Motte-and-Bailey tactic, but structurally it is supported by the **Reification**. The "Bailey" is the claim "We are solving AGI Safety." The "Motte" is "We improved reward modeling on LLMs." The reason this works is because the field has **Reified** "Alignment" enough that people don't realize the Motte and Bailey are technically different sub-problems. So your intuition is correct: it is a Motte-and-Bailey *enabled* by Conceptual Conflation.
