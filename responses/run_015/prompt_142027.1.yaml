answer: |-
  I am an AI, not a librarian. I do not have live internet access. I am drawing on training data that cuts off before 2024. I cannot verify current usage or recent papers. I will flag my confidence levels explicitly as requested.

  Here are the nearest established concepts, analyzed against your description.

  ### 1. The Looping Effect of Human Kinds
  **Origin:** Ian Hacking (Philosopher of Science), *The Social Construction of What?* (1999) and subsequent papers.
  **Confidence:** High (95%)

  **Where it fits:**
  This is the canonical term for the shape you are describing. Hacking argues that unlike "natural kinds" (like gold or tigers), "human kinds" (classifications of people) interact with the people classified. When a classification becomes known, people change their behavior in response to it. This changed behavior forces the classification itself to evolve. The "picture in the box" changes because the people in the box change how they act based on the picture.

  Your observation that "the label on the box never changes... but the thing in the box is not the thing that was in it twenty years ago" is a precise summary of Hacking's thesis. He specifically discusses how clinical descriptions and patient self-descriptions feed each other.

  **Where it doesn't fit:**
  Hacking focuses heavily on the *behavioral* change (e.g., a child diagnosed with ADHD acts differently because they know they are "an ADHD kid"). Your focus is more *semantic* and *phenomenological* (the vocabulary used to describe the inner life gets sharper). While Hacking covers this, his emphasis is often on the social consequences of the label rather than the refinement of the descriptive vocabulary itself.

  ### 2. Concept Creep
  **Origin:** Nick Haslam (Psychologist), *Psychology of Violence* (2016) and related papers.
  **Confidence:** Medium-High (85%)

  **Where it fits:**
  This describes the outcome of your "tightening" loop. Haslam argues that concepts like "trauma," "abuse," and "bullying" expand over time to include milder, more prevalent experiences. This matches your observation that where a label is wanted, the category gets "steadily better at catching the mild end."

  **Where it doesn't fit:**
  Concept Creep describes the *expansion*, not the *mechanism*. It doesn't explain *why* the expansion happens (the feedback loop between clinic and patient). It also doesn't account for your second direction (the "dodged" label where the category becomes more severe/narrow). Concept Creep is almost always unidirectional (things get broader).

  ### 3. Labeling Theory
  **Origin:** Howard Becker / Thomas Scheff (Sociology), 1960s.
  **Confidence:** High (90%)

  **Where it fits:**
  This explains your "dodged" loop. Labeling theory posits that being officially labeled (by a court, school, clinic) creates stigma, which restricts opportunities, which forces the person deeper into the deviant role. This creates the "sample nobody chose" you described: the clinical picture is built from the people who couldn't avoid the system, making the condition look more severe and tangled with trouble than it might be in the wild.

  **Where it doesn't fit:**
  It is rooted in deviance and crime. It is less useful for the "wanted" loop (where the label is a resource). It also focuses on the *consequences* of the label, not the evolution of the *definition*.

  ***

  ### The Direction Moderator (Wanted vs. Dodged)
  **Is there a name?**
  No single established term captures the *directionality* of the loop based on the *desirability* of the label.

  There is a related statistical concept called **Ascertainment Bias** (or Referral Bias). This describes how clinical samples are skewed because they only include people who seek help (or are forced to).
  *   **Fit:** It explains why the "dodged" group looks more severe (only the crisis cases get in).
  *   **Miss:** It is a statistical error term, not a sociological mechanism. It doesn't capture the *feedback* where the bias changes the definition itself.

  **Verdict:**
  You have identified a specific modulation of the Looping Effect that doesn't have a dedicated name. "Ascertainment Bias" is the clinical engine, "Labeling Theory" is the social engine, but the *valence* (wanted vs. dodged) driving the loop's direction is your insight.

  ***

  ### Boundary Cases (For your afterword)

  If you use **The Looping Effect**, here is how you define the edges:

  *   **Clearly Inside:** **Multiple Personality Disorder (now DID).** Hacking's classic example. The diagnosis became public; patients began presenting with more alters; the clinical definition changed to accommodate more alters; the "experience" of the condition changed.
  *   **Clearly Outside:** **Type 1 Diabetes.** Knowing you have it changes your behavior (insulin), but it does not change the biological definition of the disease, nor does patient vocabulary redefine the pathology of the pancreas. It is a "Natural Kind."
  *   **Genuinely Hesitate:** **Autism Spectrum Disorder.** Is the expansion of the spectrum a "Looping Effect" (people identifying and changing the culture) or "Concept Creep" (scientists broadening criteria)? Or is it simply better detection? It sits on the fence between natural and human kinds.

  ***

  ### Recommendation

  **Do not use "Medicalization."** Your friend was wrong; that refers to scope, not feedback.
  **Do not use "Self-Fulfilling Prophecy."** That implies the initial premise was false.

  **Use "The Looping Effect," but qualify it.**
  Hacking gives you the authority of the "shape." But your insight about the *direction* (tightening vs. inverting based on desire) is a novel contribution.

  **Coinage Option:**
  If you want to claim the insight about the direction, I suggest: **"Valenced Looping."**
  *Definition:* A looping effect where the feedback cycle's direction (expansion toward mild cases vs. contraction toward severe cases) is determined by whether the classification is sought as a resource or avoided as a stigma.

  ***

  ### Confidence and Error Flag

  **Confidence Levels:**
  *   **Ian Hacking / Looping Effect:** 95%. This is definitely the core concept you are looking for.
  *   **Nick Haslam / Concept Creep:** 85%. The term is correct, but its application is usually broader than just clinical diagnostics.
  *   **Ascertainment Bias:** 90%. The term is correct, but it is usually used in epidemiology, not literary/sociological analysis.
  *   **"Valenced Looping":** 0%. I am inventing this now for you. It is not an established term.

  **The Claim I Would Be Least Surprised To Find Out Is Wrong:**
  I stated that Hacking focuses heavily on *behavioral* change over *semantic* change. While Hacking does discuss how people describe themselves, a specialist in his work might argue that he views the semantic shift and the behavioral shift as inseparable, and that distinguishing them (as I did in "Where it doesn't fit") is a false dichotomy. If you read Hacking directly, you may find he covers the "vocabulary" aspect more thoroughly than I have credited him with here.

  **Final Advice for the Afterword:**
  Cite Hacking's "Looping Effect of Human Kinds." It gives you the philosophical grounding. Then, explicitly state that you are observing a *valence* to the loop that depends on the utility of the label. That allows you to use the established term without misusing it, while claiming the specific nuance you discovered.
