prompt: |-
  I'm on the board of my neighborhood food co-op (five elected directors, about 300 members) and we're close to voting on whether to take out a $60k loan to buy a used delivery truck. One of the directors read about the Condorcet jury theorem and keeps pushing to expand the board to fifteen before the vote, on the theory that the bigger the group that's voting, the more likly the majority gets it right, and he points out that our last two big votes passed 5-0, which to him means we're just right and need more of us. I've been chewing on this on my own and I can't figure out if he's actually right, but I don't want to just throw a textbook at him. Can you draft a short memo I can circulate to the other directors before next Tuesday's meeting? It should recommend a concrete course of action, with a timeline we can actually follow, and it should engage his argument honestly, including the strongest version of it. A few facts that might matter: most of our members live within a couple of blocks of the store and shop the same hours, the loan only pays off if delivery demand keeps growing, which we can't really see in advance, and we haven't done any actual surveying of delivery demand, we've just been guessing.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Neighborhood food co-op board (5 directors, 300 members).
      *   **Issue:** Voting on a $60k loan for a used delivery truck.
      *   **Conflict:** One director wants to expand the board to 15 members before voting, citing the Condorcet Jury Theorem (CJT). He argues 5-0 votes prove the current board is "competent" and larger groups make better decisions.
      *   **User's Goal:** Wants a short memo to circulate to other directors before Tuesday's meeting.
      *   **Requirements:**
          *   Recommend a concrete course of action with a timeline.
          *   Engage the CJT argument honestly (including its strongest version).
          *   Avoid just "throwing a textbook" at him.
          *   Incorporate specific facts: members live close/shop same hours, loan viability depends on uncertain demand growth, no actual surveying done yet (just guessing).

  2.  **Deconstruct the Condorcet Jury Theorem (CJT) Argument:**
      *   *What is it?* If each voter has a probability $p > 0.5$ of being correct, the probability of the majority being correct approaches 1 as the group size increases.
      *   *The Director's Point:* We vote 5-0 (implies $p > 0.5$), so adding more voters makes us smarter.
      *   *The Flaws/Nuances in this Context:*
          *   **Independence:** CJT assumes votes are independent. Board members talk to each other, share biases, and live in the same neighborhood. They are *not* independent judges.
          *   **Competence ($p > 0.5$):** Do we actually know the right answer? The prompt says "we've just been guessing" about demand. If $p < 0.5$ (we are systematically wrong), adding more people makes it *worse* (approaches 0 certainty of being right).
          *   **Common Bias:** Since members live close and shop same hours, they share the same blind spots (e.g., they don't see the demand from people *farther* away who would actually use delivery).
          *   **Efficiency/Cost:** Expanding a board from 5 to 15 is a massive governance change, not just a voting mechanic. It slows things down, changes dynamics, and takes time (elections, onboarding).
          *   **The Real Problem:** The issue isn't the *vote count*, it's the *information quality*.

  3.  **Determine the Concrete Course of Action:**
      *   Expanding the board is a distraction and too slow.
      *   The core risk is the unknown demand.
      *   *Action:* Pause the loan vote. Conduct a rapid demand survey/pilot.
      *   *Timeline:* Needs to be before Tuesday (or shortly after). Let's say 2 weeks for data, vote in 3 weeks.
      *   *Board Size:* Keep it at 5 for now. Governance changes need separate consideration.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the director's point (validate him) but state the purpose (evaluate the decision process).
      *   **Engaging the CJT Argument:**
          *   Acknowledge the math is sound *in theory*.
          *   Highlight the conditions: Independence and Competence.
          *   Apply to Co-op: We aren't independent (same neighborhood, same biases). We lack competence on this specific issue (no data on delivery demand).
          *   Key insight: If we are all guessing the same way, 15 guessers aren't better than 5.
      *   **The Real Risk:** The loan depends on growth we haven't measured. The "5-0" track record might be on things we *do* know (store operations), not new ventures (delivery).
      *   **Recommendation:**
          1.  Table the loan vote.
          2.  Run a 2-week member survey/pilot.
          3.  Vote on loan after data review.
          4.  Discuss board expansion separately (governance committee).
      *   **Timeline:** Specific dates leading up to a special meeting or next regular meeting.
      *   **Tone:** Collaborative, analytical, respectful, decisive.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is calling out the "guessing" too harsh?
      *   *Fix:* Frame it as "information gap" rather than "incompetence."
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* Make the survey simple (Google Form + email blast). 2 weeks is enough for 300 members.
      *   *Critique:* How to handle the board expansion idea without shutting it down entirely?
      *   *Fix:* Suggest a governance review separate from this specific financial vote. Don't mix structural changes with urgent financial decisions.

  6.  **Final Polish:**
      *   Ensure the CJT explanation is accessible (no formulas).
      *   Make sure the "Independence" assumption is highlighted, as that's the killer argument for a homogenous neighborhood co-op.
      *   Check that the recommendation is concrete.

  7.  **Final Review against constraints:**
      *   Short memo? Yes.
      *   Concrete course of action? Yes (Survey -> Vote).
      *   Timeline? Yes (2-3 weeks).
      *   Engage CJT honestly? Yes.
      *   Include specific facts (neighborhood, demand uncertainty)? Yes.

  *(Self-Correction Note)*: I need to make sure I don't sound like I'm attacking the director personally. The memo should be "Here's how we make the best decision" rather than "Here's why Dave is wrong." I will frame it as "Stress-testing our decision-making process."

  8.  **Drafting the Content:** (Mental outline of the text)
      *   Subject: Decision Process re: Delivery Truck Loan
      *   Intro: Thanks for the CJT point. It's fascinating.
      *   Analysis: CJT needs independent voters + better than chance accuracy. We share biases (live close). We lack data (guessing demand).
      *   Risk: 15 people guessing = confident wrong answer. 5 people with data = right answer.
      *   Plan: Get data first.
      *   Timeline: Survey by X, Vote by Y.
      *   Board Size: Discuss later, not tied to this loan.

  9.  **Final Polish:** Check tone. Ensure it sounds like a board member speaking to peers. (Proceed to generate output).

  *(Wait, one more thing)*: The prompt asks for a timeline we can *actually follow*. If the meeting is next Tuesday, I need to propose steps that happen *before* or *at* that meeting to change the agenda, or set a path immediately after. I will propose tabling the vote at Tuesday's meeting and setting a special vote date after data collection.

