answer: |-
  The practice you describe, often termed "transparent stewardship" or "digital repatriation," rests on a specific hybrid of philosophical commitments that attempts to navigate the tension between colonial guilt and institutional retention.

  **1. The Implicit Theory**
  This model presupposes three main philosophical commitments. First, it relies on a form of **Epistemic Universalism**, which argues that the value of an object lies primarily in its availability for global study and viewing, positing that major encyclopedic museums are the optimal nodes for this access. Second, it assumes **Conservation Priority**, suggesting that the physical safety and scientific preservation of the artifact outweigh the moral claims of restitution, implying that the museum is the most competent "safe haven." Third, it operates on a theory of **Restorative Acknowledgment**, where moral repair is achieved through truth-telling (wall texts) and data sharing (3D scans) rather than the transfer of title. Essentially, it treats the museum not as an owner, but as a global trustee holding the object in trust for humanity, with the source community being one stakeholder among many.

  **2. Necessity and Compatibility**
  Does this practice *need* that view? Not necessarily. While institutions justify it with universalist rhetoric, the practice is often compatible with simple bureaucratic inertia or legal defensiveness (relying on statutes of limitation). However, it is fundamentally incompatible with a **Property Rights** framework (which views looting as theft requiring return) or a **Cultural Sovereignty** framework (which views heritage as inalienable communal property). It is also compatible with a "World Heritage" theory, but only a specific version where the "world" is managed by existing Western institutions rather than a decentralized network. The practice does not logically require the moral high ground of "best caretaker"; it merely requires the power to enforce the status quo while offering enough concession to dampen criticism.

  **3. Internal Consistency**
  The parts of this theory are largely inconsistent. There is a performative contradiction in claiming to decolonize the museum while retaining the colonial structure of ownership. If the museum claims to offer "universal access," it fails to account for the fact that physical access is still gated by wealth, visas, and geography (concentrated in the Global North). Furthermore, claiming to share authority through "co-curation" while retaining final veto power over security, budget, and narrative framing creates a power asymmetry that undermines the admission of violence. You cannot fully acknowledge the violence of extraction while continuing to benefit from the possession of the extracted goods; the "transparency" becomes a mechanism that legitimizes continued retention rather than rectifying the harm.

  **4. Interpretive Sovereignty and the Museum's Role**
  A policy built on **interpretive sovereignty**—where the source community has exclusive authority over display and explanation—would radically dismantle the traditional museum role. It would require the institution to shift from being an *authoritative interpreter* to a *logistical host*. The museum could no longer claim the object as part of its own permanent collection narrative; instead, it would function more like a gallery renting space to a foreign curator. This would likely necessitate the physical return of objects if the source community's interpretive wishes (e.g., ritual use, restricted viewing, specific contextualization) conflicted with the museum's public access mandates or conservation standards. It strips the museum of its epistemic authority, reducing its role to climate control and security, thereby nullifying the "universal steward" justification.

  Verdict: Transparent stewardship relies on a contradictory universalism that privileges access over ownership, whereas true interpretive sovereignty would require the museum to surrender its authority and become merely a logistical host.
