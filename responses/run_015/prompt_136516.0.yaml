answer: |-
  **Referee's Report: Enumeration and the inscrutability of reference**

  **1. Exegesis**
  Your statement of the strong conclusion is correct. Quine holds uniformly that there is no fact of the matter regarding reference, not merely that it is epistemically inaccessible. This is not limited to programmatic passages; it is the engine of *Ontological Relativity*. You are also right that the considered view commits Quine to the global proxy-function construction. Quine explicitly concedes that local indeterminacy (holding logic fixed) can be resolved by evidence; the radical thesis survives only when logical particles are reinterpreted in tandem with terms. Your dilemma attacks the actual position, not a straw man. The move from local failure to global survival is exactly where Quine plants his flag.

  **2. Availability of the evidence**
  This is the vulnerability. You claim the linguist can observe "one-to-one pairing between numeral-utterances and scanning acts" and identify "items" in a collection prior to translation. A sympathetic Quinean will argue that identifying an "item" to be counted already presupposes individuation. To see the native scanning *rabbits* rather than *rabbit parts*, the linguist must already have resolved the inscrutability of the sortal. If the native counts rabbit parts, the scanning gesture sweeps over the same stimulation patterns; the difference lies only in what is counted as "one." Unless you can show that the *motor behavior* of counting rabbits differs phenomenally from counting rabbit parts independent of semantic attribution, Step 2 begs the question. You assume the linguist can individuate the collection *as rabbits* to check the count against it. Quine denies she can.

  **3. The load-bearing steps**
  1.  **Identification of Counting Items:** The claim that the linguist can identify the units being counted without prior sortal translation. *Note:* No repair is available without appealing to naturalness (which undermines the empirical claim).
  2.  **Eligibility vs. Simplicity:** The claim that rejecting the global proxy requires an eligibility constraint distinct from manual simplicity. *Repair:* Distinguish ontological naturalness from syntactic simplicity of the manual.
  3.  **Local Failure:** The claim that *undetached rabbit part* fails locally. *Repair:* Clarify that this holds only if logical particles (identity, plurality) are held fixed.

  **Quinean Rejection Order:** A sympathetic Quinean rejects (1) first, arguing individuation is theory-laden. She rejects (3) second, noting local swaps are never live options once logic is engaged. She rejects (2) last, conceding eligibility is extra-empirical but insisting empirical equivalence is the only constraint that matters.

  **4. The reply I have not anticipated**
  You treat counting as a constraint on reference, but Quine treats it as part of the referential apparatus subject to inscrutability. If the native counts rabbit parts, the numeral "three" is reinterpreted to mean *three proxy-images*. The behavioral output—uttering "three" after three scanning gestures over three rabbits—remains identical. The proxy function maps the counting routine onto itself. You haven't added evidence; you've added more structure to be reinterpreted. The indeterminacy infects the numerals and the counting practice just as deeply as the sortals. To block this, you must argue that the *practice* of counting has a fixed biological or behavioral shape that resists reinterpretation. But if you argue that, you are arguing from naturalness, not behavioral evidence. You haven't escaped the dilemma; you've just moved the naturalness constraint earlier in the process.

  **5. Is it worth writing?**
  It is worth writing, but not as a refutation. It will not kill indeterminacy. However, it makes a significant contribution by clarifying the *cost* of Quineanism. You show that maintaining radical inscrutability requires denying that counting behavior fixes individuation locally. This forces the Quinean to admit that even basic arithmetic practices are subject to proxy functions. That is a stronger, clearer bullet to bite than usually presented. It relocates the dispute to eligibility, but doing so explicitly is a contribution: it reveals that Quine's argument relies on a methodological prohibition against naturalness, not just poverty of evidence. This sharpens the dialectic between Quineans and realists.

  **6. Structure**
  *   **Cut:** The summary of Quine in Section 1. Your audience knows *gavagai*. Use those words for the defense of Step 2.
  *   **Expand:** Section 2 requires a robust defense of how counting behavior is distinguishable from ritual or naming without semantic knowledge. Engage with cognitive science on individuation if necessary.
  *   **Fire:** Section 4 (The Dilemma) will draw the most fire. Expect objections that eligibility *is* a behavioral constraint (simplicity). Prepare to distinguish ontological naturalness from manual complexity.

  \answer{revise-and-resubmit}
