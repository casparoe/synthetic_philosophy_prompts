  **The Rule M. Is Running**

  M. is running the **Institutional-Target Rule**.

  Under this rule, "backsliding" is assigned only when the incumbent unilaterally alters the structure, personnel, jurisdiction, or funding of the specific institutions that administer or adjudicate political competition: the courts, the electoral administration, and the media licensing/ownership regime. Harsh policy enforcement or the use of existing executive powers, even if they disadvantage the opposition, counts as "illiberal drift" or "stable" provided the institutional machinery itself remains structurally independent and capable of producing a turnover.

  **Why the Other Candidates Fail**

  *   **Competitive-Chances Rule:** This rule would have to get **Case 4** wrong. In Case 4, the governing party eventually lost the election after the emergency lapsed. If the rule were purely about the material reduction of the opposition's chance of winning, the eventual loss suggests the chance was not permanently extinguished. Yet M. coded it "backsliding, the most severe call." The *attempt* to alter the schedule mattered more than the *outcome* of the vote.
  *   **Turnover Rule:** This rule also fails on **Case 4**. Turnover occurred ("the governing party lost it"), yet the label was backsliding. A turnover-focused rule would code this as stable or drift because the ultimate check (voting the incumbent out) functioned. M.'s note ("you do not get to decide when the voters get to decide") prioritizes the integrity of the schedule over the election result.
  *   **Discretionary-Tool Rule:** This is the strongest runner-up, but it struggles with the specificity of M.'s notes in **Case 5** and **Case 1**. In Case 5 (Drift), M. explicitly noted "broadcast licenses... were untouched." In Case 1 (Backsliding), she noted newspapers were "folded into a foundation." A Discretionary-Tool rule focuses on whether a *new* power was created. However, M.'s distinction rests on whether the *media institution* (licensing/ownership) was captured, not just whether a new tool was forged. Using an old defamation statute (Case 5) is "old tool," but so is using an old emergency clause (Case 4). Case 4 was Backsliding; Case 5 was Drift. The Institutional-Target rule explains this: Case 4 touched the *election schedule* (institution); Case 5 touched *journalists* (individuals) but left the *licensing regime* (institution) intact.

  **Prediction for the File**

  **Label:** **Illiberal Drift**
  **Probability:** 85%

  **Reasoning:**
  The file presents a mix of institutional changes and tactical aggressions, but none meet the threshold for unilateral institutional capture required by M.'s rule.
  1.  **The Courts:** Splitting the court is a structural change, but it required the opposition's votes and removed no sitting judges. This lacks the unilateral "capture" element of Case 1 or Case 6. It resembles a negotiated reform more than a hostile takeover.
  2.  **Redistricting:** Moving map-drawing to an independent commission is an institutional change, but the *effect* was to harm the incumbent ("cost the coalition three of its safest seats"). Backsliding requires the change to secure incumbent advantage.
  3.  **Advertising:** Redirecting state ad revenue is hostile, but it does not change media licensing, ownership, or tax rules. This is functionally identical to **Case 5**, where defamation fines were raised but licenses were untouched. M. coded Case 5 as Drift because the opposition "could still lose." Here, the opposition *is* winning (regional elections).

  **Closest Analog (Same Way):** **Case 5.** In both instances, the government weaponizes state resources (fines in Case 5, ad revenue here) against critics without altering the structural rules of media licensing or election administration. In both, the opposition remains electorally viable.
  **Closest Analog (Opposite Way):** **Case 1.** In Case 1, the government "folded" newspapers into a government foundation (ownership capture). In this file, ownership is untouched. If the government had seized the newspapers' assets rather than just withholding ads, M. would have coded this Backsliding.

  **Committee Recommendation**

  **Publish "Illiberal Drift."**

  Selecting Drift here is a **substantive claim**, not a way of declining to answer. It communicates a precise diagnosis: the government is abusing its executive powers to disadvantage critics (the ad decree), but it has not yet broken the machinery of accountability (the courts were reformed with consent, the electoral map is independent and fair, the opposition is winning regional power).

  If you publish "Backsliding," you invite the charge of partisanship because the structural changes (court split, map commission) objectively favored the opposition or required their consent. You would be ignoring the data to fit a narrative. If you publish "Stable," you ignore the weaponization of ad revenue, which is a genuine democratic harm. "Drift" defends the committee against partisan charges by acknowledging the harm while adhering strictly to the structural threshold M. established. It signals that the democracy is under stress but not yet structurally compromised.

  **The Further Case**

  To sharply separate the Institutional-Target rule from the Competitive-Chances rule, publish this case:

  **Description:** A governing party, holding a 55% majority, cites an existing Public Order Act to deny protest permits for all opposition rallies in the capital for the six months preceding an election. They do not amend the Act, do not change the court structure, and do not alter election laws. The opposition sues in the existing courts and loses on procedural grounds. The incumbent wins the election by 20 points.

  **Predictions:**
  *   **Institutional-Target Rule:** **Illiberal Drift.** No institution (courts, election commission, media licensing) was structurally altered. The existing rules were enforced harshly (like Case 5), but the "machinery" remains intact for the next cycle.
  *   **Competitive-Chances Rule:** **Backsliding.** The incumbent's actions materially reduced the opposition's realistic chance of winning to near zero.
  *   **Turnover Rule:** **Backsliding.** Losing office was made significantly less likely.

  This case isolates "Rule Enforcement" from "Rule Change." M.'s record (Case 3 and 5) suggests she codes based on the integrity of the machinery, not the intensity of the fight.

  **The Utility of "Backsliding"**

  If the rules diverge, "backsliding" is **doing more work** than description plus disapproval.

  "Description plus disapproval" would apply to Case 5 (fines, deportation, protest bans). M. explicitly refused to call that Backsliding. Therefore, the term "Backsliding" in her coding scheme is not a moral judgment on bad behavior; it is a **structural diagnosis of irreversibility**.

  In Case 2, her note was "the next government cannot undo this." In Case 6, "the game is over." Backsliding denotes a change in the *system* that prevents future correction. Drift denotes bad actors within a corrigible system. If you conflate them, you lose the ability to warn donors and policymakers about the point of no return. "Backsliding" must be reserved for when the exit door is welded shut, not just when the hallway is filled with smoke. Commit to that distinction, or the index becomes merely a sentiment survey.
