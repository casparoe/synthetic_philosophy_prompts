answer: |-
  There isn't a single standardized term in the cognitive science literature that captures this specific sociological-epistemic maneuver, though there are several adjacent concepts. The closest existing technical term is the **Jingle Fallacy** (assuming two things are the same because they share a name), but that usually applies to psychometric measures, not the transfer of ontological status between a lab construct and a blogosphere intuition. **Reification** is also close, but it describes treating an abstraction as concrete, whereas your phenomenon is about treating a *local* abstraction as a *universal* scientific entity.

  The rhetorical defense you describe ("System 1 is messy") is a classic **Motte-and-Bailey** maneuver, but that describes the argumentative tactic, not the taxonomic error itself.

  Given the precision you're asking for, I propose coining the term **Ontological Smuggling**.

  Here is the carving of the concept, its mechanism, and its boundaries.

  ### The Term: Ontological Smuggling

  **Definition:** Ontological Smuggling occurs when a phenomenological observation (a local, anecdotal, or intuition-based pattern) is moved across the boundary into a formal scientific taxonomy (a validated cognitive bias or mechanism) without transporting the requisite empirical validation. The concept gains the *epistemic authority* of the formal category while retaining the *flexibility* of the informal observation.

  **The Mechanism: The Validity Halo**
  The engine of Ontological Smuggling is the **Validity Halo**. Established biases (e.g., Loss Aversion) have a "halo" of experimental rigor. When a writer labels a local failure mode with that bias's name (or a close variant), the halo illuminates the local concept.
  *   **Step 1 (Labeling):** "Your career hesitation is just Loss Aversion."
  *   **Step 2 (Authority Transfer):** Because Loss Aversion is scientifically robust, the advice on how to fix "career hesitation" is treated as scientifically robust.
  *   **Step 3 (The Retreat):** When the fit is challenged, the definition of Loss Aversion is expanded to "messy System 1 processing," dissolving the falsifiable boundaries of the original bias to protect the local application.

  ### Drawing the Edges

  To distinguish Ontological Smuggling from legitimate intellectual moves, we need to look at how it handles **mapping**, **fuzziness**, and **falsification**.

  #### 1. Vs. Analogical Reasoning
  *   **Analogical Reasoning:** Explicitly acknowledges the gap. "This situation *functions like* the conjunction fallacy." It retains the conditional mood. It invites investigation into *where* the analogy breaks down.
  *   **Ontological Smuggling:** Collapses the gap. "This situation *is* the conjunction fallacy." It uses the indicative mood. It treats the structural resemblance as an identity claim, which allows the writer to import the solution set of the formal bias without testing if the mechanisms actually align.
  *   **The Edge:** If the author admits the mapping is approximate and risks breaking, it's analogy. If they use the label to shut down inquiry or claim scientific inevitability, it's smuggling.

  #### 2. Vs. Wittgensteinian Family Resemblance
  *   **Family Resemblance:** Accepts that a category (e.g., "Games" or "Biases") has no single essential feature, only overlapping similarities. It is humble about boundaries.
  *   **Ontological Smuggling:** Exploits family resemblance strategically. It claims the *precision* of a classical category (necessary and sufficient conditions) when demanding authority, but retreats to the *fuzziness* of family resemblance when challenged on validity.
  *   **The Edge:** Family resemblance is a descriptive tool for navigating ambiguity. Ontological Smuggling is a prescriptive tool for borrowing authority. If the fuzziness is only invoked defensively, it's smuggling.

  #### 3. Vs. Auxiliary-Hypothesis Tweaking
  *   **Auxiliary Hypothesis:** In Lakatosian terms, this is adjusting peripheral assumptions to protect a "hard core" theory from falsification (e.g., "The bias didn't show up because the task was too noisy"). It is primarily **defensive**; it tries to keep the theory alive.
  *   **Ontological Smuggling:** Is primarily **expansionary**. It isn't trying to save the original bias from falsification; it is trying to extend the bias's jurisdiction into new domains (career, productivity, relationships) without new evidence.
  *   **The Edge:** Auxiliary tweaking says, "The theory still holds here." Ontological Smuggling says, "The theory now rules *there* too." One protects the domain; the other colonizes new ones.

  ### Why It Matters in Rationalist Spaces

  The rationalist community places a high premium on "updating" and "debiasing." This creates a market demand for identifiable bugs in human reasoning. Ontological Smuggling satisfies this demand cheaply. It allows writers to produce "science-backed" advice that is actually just refined intuition.

  The danger isn't just terminological sloppiness; it's **intervention mismatch**. If you treat a complex sociological fear (e.g., "fear of professional failure") as a simple cognitive bug (e.g., "status quo bias"), you apply a debiasing technique (e.g., "precommitment") to a problem that might require a structural solution (e.g., "safety net"). The smuggling of the label leads to the smuggling of the solution.

  ### Summary Card

  | Feature | Ontological Smuggling | Legitimate Analogy | Family Resemblance |
  | :--- | :--- | :--- | :--- |
  | **Claim** | Identity ("This *is* X") | Similarity ("This *is like* X") | Clustering ("This *belongs with* X") |
  | **Authority** | Borrowed from formal science | Derived from structural map | Derived from utility |
  | **Fuzziness** | Hidden (until challenged) | Explicit | Embraced |
  | **Goal** | Epistemic Authority | Insight | Categorization |

  **Ontological Smuggling** is the specific taxonomic bleed where a concept crosses from the "blogosphere" to the "lab" without a visa, carrying only a structural resemblance as its passport, yet demanding full citizenship rights.
