          *   *Deflationists (e.g., Oyama, Griffiths & Stotz):* It's causal/teleological. "Information" is a metaphor projected by humans. No sender, no semantic content without an interpreter.
          *   *User's Distinction:* Record (descriptive) vs. Script (prescriptive/authoritative).
      *   *Application to Gattaca:* The film depicts a society that *treats* DNA as a Script (prescriptive destiny), even if biologically it's closer to a Record (probabilistic predisposition).

