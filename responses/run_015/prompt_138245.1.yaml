      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the "Record vs. Script" distinction as a powerful pedagogical tool. State the thesis: *Gattaca* works best not as a prediction of genetics, but as a dramatization of what happens when a *Record* is socially misrecognized as a *Script*.

