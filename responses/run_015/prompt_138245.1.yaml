      *   **Case Study:** Andrew Niccol's *Gattaca* (1997).
      *   **Goal:** Use the film as a *case* to test philosophical distinctions, not just decoration.
      *   **Key Distinction to Test:** "Record" (read off, accuracy varies) vs. "Script" (addressed, authoritative, tells someone what to do).
