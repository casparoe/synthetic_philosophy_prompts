  The coverage framing treats missing foundations as structural deficits. If liberals lack sanctity, conservative appeals are category errors; if sanctity is a misfire, everyone is wrong. Calibration allows a third option: the detector is present but misaligned. This shifts the burden from acquiring intuitions to tuning them. If the disagreement is about threshold settings rather than hardware absence, debunking arguments targeting the foundation's existence miss their mark. The project will demonstrate that the coverage model forces a false choice between global skepticism and partisan superiority, whereas the calibration model permits normative critique without dismissing the opponent's cognitive architecture.

