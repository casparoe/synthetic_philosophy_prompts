  Hey — I'm putting together a one-year junior fellowship application (moral psychology / philosophy adjacent) and could use a hand turning a half-baked idea into a two-page proposal. Skip the literature review and any citations, I'll drop those in myself.

  The idea: everyone who talks about moral foundations theory ends up at the same question — whether the fact that left and right run on somewhat different moral intuitions tells us anything about who's actually right — and the answers are almost always one of two things: either it's debunking all the way down and nobody's intuitions are trustworthy, or the conservative set is a superset and the left is running on a truncated moral diet. I think both of those share a bad assumption, namely that the interesting variable is *which* foundations you have rather than how they're tuned. Borrow from signal detection: a detector has a sensitivity threshold and a false-positive rate, and 'registers sanctity at all' comes apart from 'registers sanctity too readily, or in the wrong domain.'

  So: is the disagreement better modeled as a disagreement about foundation coverage or about foundation calibration, and does recasting it change what the debunking argument can even establish?

  What I need in the proposal: the question stated tightly enough that it has a determinate answer; why the coverage framing leaves it open; what I'd actually do month by month (I'm imagining cases where coverage is held fixed and only calibration varies, then checking whether the debunking move people aim at the outgroup survives being aimed at calibration instead); what a yes answer and a no answer would each look like; what would count as the project straight-up failing; and an honest paragraph on what could make it too big for a year. Also tell me if you think the signal-detection framing is doing real work or just relabeling the problem — I'd rather find that out now then in month nine.

  Please write it in American English, prose rather than bullet soup, roughly 700 words.
