answer: |-
  The museum practice you describe relies on a specific, hybrid metaphysical framework that is rarely stated explicitly but governs almost all modern conservation ethics. It is not a pure theory of shape (formalism), nor a pure theory of matter (materialism), nor a pure theory of history (narrative).

  Here is the reconstruction of that implicit view, an analysis of its consistency, and the consequences of switching to a strict mereological essentialism.

  ### 1. The Implicit Theory: Causal-Historical Particularity with Informational Integrity

  The museum's practice presupposes a **Causal-Historical Theory of Identity**, modified by a principle of **Non-Deceptive Integrity**.

  *   **The Core Identity:** The statue is not defined merely by its current shape (otherwise, a perfect 3D print would be the statue) nor merely by its atoms (otherwise, a pile of marble dust is the statue). It is defined by the **specific causal history of a specific chunk of matter**. That specific block of marble, carved by that specific hand at that specific time, constitutes the "authentic" object.
  *   **The Role of Missing Bits:** When a finger is missing, the *information* regarding the original form is lost, but the *historical witness* of the remaining marble is intact. By adding grey plaster, the museum is not claiming the plaster is part of the historical particular. They are claiming the plaster is a **commentary** on the historical particular.
  *   **The Distinction:** There is a metaphysical firewall between **Original Matter** (sacrosanct, carries historical value) and **Supplemental Matter** (functional, carries aesthetic/informational value).

  **Why vandalism is treated differently than restoration:**
  Under this view, vandalism is an attack on the *Causal-Historical Particular*. Chipping a finger severs the causal chain of that specific marble. It destroys a piece of history that cannot be regenerated. Restoration, conversely, is an act of *Informational Integrity*. It fills the semantic gap without claiming to repair the historical chain. The grey paint is the admission: "The history stops here; the interpretation begins here."

  ### 2. Is This Consistent?

  **Yes, but only if you accept an asymmetry between Loss and Gain.**

  The consistency holds because the theory values **provenance** over **composition**.
  *   **Vandalism (Loss):** Removing original matter reduces the "provenance density" of the object. Even if you glue the finger back, the micro-structure of the break is new. The object has undergone a traumatic historical event that alters its status.
  *   **Restoration (Gain):** Adding plaster does not dilute the provenance of the *original* parts, provided the new parts are distinguishable. The original marble remains the "anchor" of identity. The plaster is ontologically parasitic; it exists only to support the viewer's understanding of the marble.

  **The "Fake" Objection:**
  You asked: *If replacing parts creates a new object, wouldn't conservation law have to treat every restoration as manufacturing a fake?*

  Under the current implicit theory: **No.**
  A "fake" implies an intent to deceive regarding provenance. Because the plaster is grey (distinguishable), the museum is not claiming the *whole* is the original historical particular. They are claiming the *assembly* is an **authentic fragment with interpretive support**. Conservation law treats the object as a composite: Part A (Original) + Part B (Modern). As long as Part A is not misrepresented as Part B, no fraud occurs.

  However, if the museum painted the plaster to match the marble perfectly, *then* they would be manufacturing a fake (or at least engaging in deceptive reconstruction), because they would be blurring the ontological boundary between the Historical Particular and the Modern Supplement.

  ### 3. The Counterfactual: Strict Mereological Essentialism

  Now, let's apply **Mereological Essentialism**. This is the view that an object's parts are essential to its identity. If an object loses or gains a part, it is numerically a different object. (If you lose a single atom, you are not the same person/object).

  If museums adopted this view strictly, policy would undergo a radical shift:

  **A. Restoration Becomes Impossible (or becomes "Replica Creation")**
  *   **Current Policy:** We fill the gap to show the intended form.
  *   **Mereological Policy:** Adding plaster creates a *new* composite object. You cannot "restore" the original statue because the original statue (defined by its exact parts) no longer exists in that configuration.
  *   **Consequence:** Museums would stop filling gaps. Any addition would require the object to be re-cataloged as a "Hybrid Assembly" or "Modern Reconstruction." The label would read: *Original Fragments (5th C. BCE) mounted on Modern Armature (2024 CE).* The "Statue" as a singular entity ceases to exist the moment the first chip falls off.

  **B. Conservation Becomes Preservation of Decay**
  *   **Current Policy:** We clean the statue to remove grime and stabilize it.
  *   **Mereological Policy:** Cleaning removes particles (dust, oxidation, even microscopic bits of marble). Therefore, cleaning destroys the original object.
  *   **Consequence:** Conservation would shift to **arrested decay**. You would not touch the object. Any intervention is destruction. The statue would be kept exactly as found, encased in a vacuum to prevent atomic loss.

  **C. Vandalism Becomes Homicide, Not Assault**
  *   **Current Policy:** Vandalism is "damage to property." The object is diminished but persists.
  *   **Mereological Policy:** Chipping a finger destroys *that* statue. It creates a new, smaller object.
  *   **Consequence:** Legal statutes would have to change. You cannot be charged with "damaging" the *Venus de Milo*; you would be charged with "destroying" the *Venus de Milo* and "creating" a *Damaged Fragment*. Insurance policies would pay out total loss, not repair costs, because repair is metaphysically impossible.

  **D. The "Ship of Theseus" Problem Becomes Legal Fact**
  *   Currently, museums navigate the Ship of Theseus by saying, "It's the same ship as long as we don't lie about the new planks."
  *   Under Mereological Essentialism, every time a conservator consolidates a flaking surface with adhesive, they have added a part. The pre-conservation statue is dead; the post-conservation statue is a newborn entity inheriting the value of the dead one. Provenance records would need to track "generations" of the object every time it is touched.

  ### Summary

  The museum's current practice presupposes a **Narrative-Material Hybrid**: the object is its history, but its presentation can be supplemented for clarity as long as the supplement is honest.

  *   **Consistency:** It is consistent because it distinguishes between *historical loss* (irreversible) and *aesthetic gain* (reversible/distinguishable).
  *   **The Fake Threshold:** It avoids the "fake" label through distinguishability (grey plaster).
  *   **Mereological Shift:** If we moved to strict mereological essentialism, **restoration would vanish**. Museums would become archives of fragments. We would no longer look at "Statues"; we would look at "Original Shards displayed near Modern Models." The aesthetic experience of wholeness would be sacrificed for metaphysical purity.

  The current system works because it is pragmatic, not metaphysical. It prioritizes the **viewer's understanding** (via restoration) and the **historian's evidence** (via preservation of original matter) simultaneously, accepting the slight ontological fuzziness required to hold those two values together.
