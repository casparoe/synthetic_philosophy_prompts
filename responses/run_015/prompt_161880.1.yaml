prompt: |-
  I co-host a tiny podcast on the philosophy of logic (me, a friend from the maths department who thinks the whole Carroll's-tortoise business is just a cheap confusion about use and mention, and a microphone that crackles whenever someone says "modus ponens"). Next week's guest is Dr. Nadia Wren — an invented-but-real-flavoured philosopher, the kind who defends a hard-line version of the rules view: no truth-apt premise can ever play the licensing role of a rule of inference, so the tortoise's regress terminates not in a further premise but in a rule that isn't the sort of thing that can be true or false, and rules get justified (if at all) only "rule-circularly", by arguments that themselves use the very rule they vindicate — which she says is totally benign. She's also got a couple of her own moves I want to get at: (i) a thought experiment she calls the Zeno machine, a system stocked with A, with A→B, with (A ∧ (A→B))→B and so on up the whole infinite ladder, but equipped with no rule of inference at all, so it never derives anything — she uses it to argue that rules are irreducible to premises; and (ii) what she dubs "the Zeno symmetry", the claim that if the tortoise's challenge works against deduction it works just as well against ampliative inference, so it can't be a special scandal about deduction. She deflects constantly with "that just is what inferring is", and I want that to stop working by the end of the episode.

  So: act as an expert on the philosophy of logic and an experienced, slightly adversarial interviewer. Brainstorm for a moment about where this package of views is actually weak before you start writing — I'd rather have questions with teeth than a tidy list. Then give me eight to ten interview questions, ordered so they get harder, with a one-or-two-sentence note under each on why you put it there and a follow-up keyed to the answer she's most likely to give. I need at least: one question on whether the Zeno machine is even a coherent possibility or whether any system that "contains" all those conditionals and does nothing with them has secretly got a rule built into the description; one pressing the rule-circular move by asking why rule-circularity is benign while premise-circularity is not, given that her likely answer will be that rules aren't truth-apt so there's nothing for the circularity to get wrong; one on the transcendental-style reply that the tortoise already uses the rule in framing his challenge — and whether that's an answer or a change of subject if the tortoise shrugs and says he was only uttering the conditional, not asserting it; one that tests the Zeno symmetry by asking her what happens if the symmetry thesis cuts the other way and makes the problem worse for her own preferred story about rules; one that makes "that just is what inferring is" progressively harder to lean on by asking what a community that inferred differently would be doing; and one closing question about what evidence or observation could count as her view being wrong. Don't pad it with "what got you into philosophy", and please don't give me reading lists or citations — I can't check them and she'll just name-drop anyway.
