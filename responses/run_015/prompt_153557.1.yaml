answer: |-
  ### A Note on Your Four Concepts

  Your distinctions are sharp and pedagogically useful, but one needs a slight tweak to align with the literature without losing your intent.

  *   **Fragility** and **Lock-in** are solid. They describe the *before* (contingency) and *after* (rigidity) of the critical juncture.
  *   **Erasure** is also distinct; it addresses the evidentiary problem (ontology vs. epistemology).
  *   **Functional Redundancy** is the tricky one. In standard social science, this is usually called *equifinality* (many paths, same outcome). If functional redundancy is high, **path dependence didn't actually matter for the outcome**, only for the process. If you treat it as a *claim of path dependence*, it contradicts the core idea that "history matters." I suggest framing it in the question as the **counter-claim** students must rule out. To prove lock-in, you must prove the alternative path would *not* have functioned the same way. I have adjusted the marking scheme to reflect this: students get credit for identifying redundancy as the *threat* to the lock-in argument, not necessarily a pillar of it.

  ***

  ### 1. The Exam Question

  **Course:** HIST101 – How History Works
  **Time Allowed:** 45 Minutes
  **Value:** 20 Marks

  **Question:**

  Consider two geographically identical river valleys, **Northia** and **Southia**. In year 1, a random event (a spooked horse) causes the first water mill in Northia to be built on the east bank. In Southia, the mill is built on the west bank. By year 100, Northia is heavily urbanized around the mill; Southia remains agrarian.

  Using **only** this scenario (do not use real-world examples like QWERTY, VHS, or Roman roads), write an essay addressing the following:

  1.  Distinguish between **fragility** and **lock-in** in this context. At what point does the accident stop being mere chance and become a constraint?
  2.  Explain the problem of **erasure**. If the original mill disappears, how can we prove it caused the urbanization?
  3.  How would a skeptic use **functional redundancy** to argue that path dependence is *not* the reason for the difference between the valleys?
  4.  Briefly note: If historians discovered the "spooked horse" story was a myth invented later, does that invalidate the lock-in claim? Why or why not?

  *Guidance: Focus on the logic of historical explanation. How do we claim something is "locked in" when we cannot re-run history to test the alternative?*

  ***

  ### 2. Model Answer (Strong Student Level)

  **Path Dependence in the Twin Valleys**

  The story of Northia and Southia illustrates the core tension in path dependence: distinguishing between a history that matters and a history that is merely decorative. To analyze this, we must separate the initial contingency from the subsequent rigidity, while acknowledging the limits of our evidence.

  **Fragility vs. Lock-in**
  Fragility refers to the early phase where small inputs yield large divergences. In year 1, the location of the mill is fragile; a different horse bolt could have placed it elsewhere with little cost. Lock-in occurs later, when switching costs become prohibitive. In Northia, lock-in happens not when the mill is built, but when infrastructure (roads, housing, supply chains) accumulates around the east bank. By year 50, moving the economic center to the west bank would be technically possible but economically ruinous. The route becomes load-bearing. The distinction is temporal: fragility is the openness of the start; lock-in is the closure of the end.

  **The Problem of Erasure**
  Erasure complicates this because the physical trace of the cause (the mill) may vanish while the effect (the city) remains. If the mill burns down in year 60, a historian looking at year 100 sees a city on the east bank but no obvious reason why. To prove path dependence despite erasure, we need negative evidence: we must show that the west bank was *viable* but *unused*. If the west bank was swampy, the city's location is geographic determinism, not path dependence. We prove the path mattered by proving the alternative was possible but foreclosed by prior investment.

  **Functional Redundancy as a Counter-Claim**
  A skeptic would use functional redundancy to argue that the specific path didn't determine the *outcome*, only the *form*. They might argue that Southia's agrarian focus and Northia's urbanization serve the same regional function (food and trade), just distributed differently. If the region's total wealth is identical in both scenarios, the specific location of the city is redundant. To defeat this, we must show that Northia's specific urban layout created efficiencies (or inefficiencies) that Southia could not match. If the outcome is functionally equivalent regardless of the route, path dependence is stylistic, not structural.

  **Evidence and the "One Run" Problem**
  Since we cannot re-run history, we rely on counterfactual reasoning and comparative cases. We look for "natural experiments" (like Southia) to estimate what Northia would have looked like without the accident. However, we must admit uncertainty. We can never prove lock-in with the certainty of a lab experiment; we can only show that the path-dependent model explains the data better than a rational-choice model.

  **The Myth of Origin**
  Finally, if the "spooked horse" story is a myth, the lock-in claim remains valid. Path dependence relies on the *mechanism* of increasing returns, not the specific truth of the origin story. Whether the mill was placed by chance or by a king's decree, if the subsequent accumulation of infrastructure made moving it impossible, the system is locked in. The Roman railway gauge story is likely false, but if railway gauges *did* constrain later transport networks, the lock-in is real regardless of the Roman connection. The mechanism matters more than the myth.

  ***

  ### 3. Marking Scheme (Total: 20 Marks)

  | Criteria | Marks | Required Move | Common Error (Deduction) |
  | :--- | :---: | :--- | :--- |
  | **Fragility vs. Lock-in** | 5 | Identifies Fragility as early contingency/low switching cost; Lock-in as later rigidity/high switching cost (accumulation of infrastructure). | Treating them as synonyms, or claiming the "horse bolt" *is* the lock-in rather than the trigger. |
  | **Erasure & Evidence** | 5 | Explains that absence of evidence (the mill) $\neq$ absence of causation. Identifies need to prove the alternative path was *viable* (negative evidence). | Assuming that because the mill is gone, we can't know. Or claiming we *can* know for certain without counterfactuals. |
  | **Functional Redundancy** | 4 | Correctly identifies this as a **counter-argument**: if outcomes are functionally equivalent, path dependence is weak. Must argue how to rule this out. | Treating redundancy as proof of path dependence (backwards). Or ignoring the "regional function" nuance. |
  | **Epistemology (One Run)** | 3 | Acknowledges we cannot re-run history. Cites counterfactuals or comparison (Southia) as the only method, admitting uncertainty. | Claiming we can prove it definitively. Or suggesting we should just "look up the data." |
  | **Origin Myth (Roman Point)** | 1 | States that the truth of the origin story does not validate/invalidate the lock-in *mechanism*. | Claiming that if the story is fake, the theory is busted. |
  | **Clarity & Constraints** | 2 | Uses *only* the Valley case (no QWERTY/VHS/Rome in the main text). Clear structure. | Reciting the "Big Three" examples despite instructions. |

  **Total: 20 Marks**

  **Examiner's Note on Contested Claims:**
  *   **Settled:** Increasing returns/switching costs create rigidity (Lock-in).
  *   **Contested:** Whether this leads to *inefficiency* (the skeptic's redundancy point). The model answer must not claim lock-in *always* means inefficiency, only that it restricts choice.
  *   **Penalty:** If the model answer (or student) presents the "QWERTY is inefficient" claim as settled fact, deduct 2 marks from the **Clarity** section for poor historiographical awareness, as current economic history disputes this. (Note: The model answer above avoids this trap).
