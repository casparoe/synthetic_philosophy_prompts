      *   *Goal-Directed:* The agent maximizes $W(Y)$ directly. In economic terms, this is like selling the firm to the agent (residual claimancy) or writing a complete contract on $Y$.
      *   *The Problem (Reward Hacking/Wireheading):* This is *Goodhart's Law* in contract terms. The agent exploits the gap between the proxy signal $s$ and the true state $Y$.
      *   *Wireheading (Self-Modification):* The agent alters the function $w(\cdot)$ or the observation process $s(\cdot)$ directly.

