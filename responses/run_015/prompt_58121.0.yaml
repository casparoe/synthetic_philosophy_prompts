      *   Ensure the "Weird Combos" section is thoughtful.
      *   Ensure the "Blind Spots" section is accurate metaphysically. (e.g., Van Inwagen's Life view is specific; Brutalism is about the *explanation* of the verdict, so a quiz of verdicts can't fully capture the *reasoning*, but it can approximate).

