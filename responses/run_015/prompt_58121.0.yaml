answer: |-
  # The "What Counts as a Thing?" Quiz
  **Intro Metaphysics Study Group | Special Composition Question (SCQ)**

  **Instructions:** Read each case below. Don't overthink the physics; focus on your metaphysical intuition. Is there a *single object* present, or just a bunch of parts arranged in a certain way?

  ### The Cases

  **1. The Living Cat**
  A healthy cat is sleeping on the rug. Its cells are metabolizing and functioning together.
  *   [ ] **A:** Yes, there is a cat.
  *   [ ] **B:** No, just cells arranged cat-wise.

  **2. The Half-Built Lego Bridge**
  You are halfway through building a Lego bridge. It has arches and supports, but the top deck is missing. It collapses if you touch it.
  *   [ ] **A:** Yes, there is a (broken/incomplete) bridge.
  *   [ ] **B:** No, just Lego bricks arranged bridge-wise.

  **3. The Elevator Strangers**
  Two people who don't know each other are stuck in an elevator for an hour. They are touching shoulders due to crowding.
  *   [ ] **A:** Yes, there is a "Stranger-Composite" object.
  *   [ ] **B:** No, just two people standing near each other.

  **4. The Scattered Sum**
  Consider your nose and the Eiffel Tower taken together as the parts.
  *   [ ] **A:** Yes, there is a scattered object (Nose-Tower).
  *   [ ] **B:** No, just a nose and a tower far apart.

  **5. The Dead Ant Colony**
  A colony of ants has been fumigated. The bodies are piled in the nest, chemically bonded by decay, but no life functions remain.
  *   [ ] **A:** Yes, there is a (dead) colony organism.
  *   [ ] **B:** No, just a pile of dead ant bodies.

  **6. The Functioning Smartphone**
  A phone is assembled, powered on, and running an app. All circuits are connected.
  *   [ ] **A:** Yes, there is a smartphone.
  *   [ ] **B:** No, just circuits and glass arranged phone-wise.

  **7. The Cloud**
  A cluster of water droplets hangs in the air. The edges are vague; droplets are constantly entering and leaving the cluster.
  *   [ ] **A:** Yes, there is a cloud.
  *   [ ] **B:** No, just water droplets suspended in air.

  **8. The Glued Vase**
  A ceramic vase shattered. You glued every piece back together perfectly. It holds water again.
  *   [ ] **A:** Yes, there is a vase.
  *   [ ] **B:** No, just shards arranged vase-wise.

  ***

  ### Scoring Key

  Tally your **A** answers ("Yes, there is an object").

  | Pattern | Your Likely View | Description |
  | :--- | :--- | :--- |
  | **0 A's** | **Nihilist** | You believe composition *never* occurs. Only simples (atoms/point-particles) exist. There are no cats, phones, or bridges, only things arranged that way. |
  | **8 A's** | **Universalist** | You believe composition *always* occurs. Any collection of parts, no matter how scattered or random, makes a whole. The "Nose-Tower" is as real as the Cat. |
  | **1 A (Q1 Only)** | **Life-Only Organicist** | (e.g., Peter van Inwagen). Composition occurs *only* when the activity of parts constitutes a life. Only the Cat is a real object; artifacts and heaps are not. |
  | **Mixed (3-6 A's)** | **Brutalist / Common Sense** | You say "Yes" to Cats, Phones, Clouds, but "No" to Strangers and Scattered Sums. You believe composition happens, but there is no deep *principle* explaining why (it's brute fact), or you follow vague common-sense intuitions. |

  ***

  ### Analysis & Blind Spots

  **1. Incoherent or Unexplored Combos**
  *   **The "Artifact Priority" Combo:** If you answered **Yes** to the *Lego Bridge* or *Smartphone* but **No** to the *Living Cat*, your view is metaphysically unstable. Most theories prioritize biological unity over artificial arrangement. This usually indicates a misunderstanding of the cases rather than a coherent metaphysical stance.
  *   **The "Contact Only" Combo:** If you answered **Yes** to *Elevator Strangers* (based on touching) but **No** to *Scattered Sum*, you hold a Contact View. This is a valid historical view, but it isn't one of the four main target views of this quiz. It fits loosely into the **Brutalist/Restrictivist** bucket but relies on a specific principle (contact) that Brutalism denies exists.

  **2. Views This Quiz Cannot Separate**
  *   **Brutalism vs. Moderate Restrictivism:** This quiz sorts by *verdicts*, not *reasons*. A **Moderate Restrictivist** (who believes artifacts exist based on function) and a **Brutalist** (who believes there is no true answer to *why* composition happens, but accepts common sense verdicts) will score identically (Mixed 3-6 A's). To separate them, you would need to ask: *"Is there a true, informative principle that explains your answers?"* (Restrictivist says Yes; Brutalist says No).
  *   **Nihilism vs. Error Theory:** A Nihilist says composite objects *do not exist*. An Error Theorist might say composite object *statements* are all false. On this quiz, they check the same boxes. Distinguishing them requires semantic analysis, not ontological case verdicts.

  **3. Note on the "Life-Only" Score**
  If you marked **Yes** for the *Cat* and the *Dead Ant Colony*, you are likely a **Temporal Organicist** (life *or* once-lived things count). The strict **Life-Only** view (Van Inwagen) requires a **No** on the Dead Ants, as the "life" activity has ceased. If you scored 2 A's (Cat + Dead Ants), you fall into the **Mixed/Restrictivist** category for the purpose of this quiz.
