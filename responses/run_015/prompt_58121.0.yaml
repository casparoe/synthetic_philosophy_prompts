reasoning: |-
  Here's a thinking process that leads to the suggested quiz:

  1.  **Analyze the Request:**
      *   **Topic:** Metaphysics of Composition (Special Composition Question - SCQ).
      *   **Format:** Handout for an intro study group.
      *   **Content:** 8 questions max.
      *   **Style:** Concrete, weird cases (e.g., half-built Lego, strangers in elevator, dead ant colony).
      *   **Answers:** 2-3 choices per question.
      *   **Scoring Key:** Map patterns to four specific views:
          1.  Nihilism (nothing composes anything).
          2.  Universalism (any things compose something).
          3.  Life-Only Organicism (only living things compose wholes).
          4.  Brutal No-Principle (composition is brute fact, no general rule).
      *   **Additional Requirements:** Note incoherent/unexplored combos, flag views the quiz can't separate.
      *   **Tone:** Engaging, educational, suitable for a study group.

  2.  **Deconstruct the Views:**
      *   *Nihilism:* No composite objects exist. Only simples. Answer pattern: "No object" for everything except maybe single simples (though the quiz asks about *composition*, so usually "No" to all composites).
      *   *Universalism:* Any collection of things composes a whole. Answer pattern: "Yes" to everything.
      *   *Life-Only Organicism (Van Inwagen style):* Composition occurs *only* when the activity of the parts constitutes a life. Answer pattern: "Yes" to organisms, "No" to artifacts, heaps, random collections.
      *   *Brutalism (Brute Composition):* There is no informative necessary and sufficient condition. Some things compose, some don't, but not based on a neat rule like "life" or "contact." Answer pattern: Intuitive "Yes/No" that doesn't follow a strict universal or nihilistic rule, often varying based on specific context without a unifying principle.

  3.  **Drafting the Cases (Aiming for 8):**
      *   Need a mix of artifacts, organisms, random collections, and borderline cases.
      *   *Case 1: Classic Artifact.* Half-built Lego bridge. (Tests artifact reliance).
      *   *Case 2: Random Collection.* Two strangers in an elevator. (Tests contact/proximity vs. unity).
      *   *Case 3: Organism (Alive).* A running dog. (Baseline for Organicist).
      *   *Case 4: Organism (Dead).* A dead ant colony (carcasses). (Tests the "Life" boundary).
      *   *Case 5: Scattered Object.* Your left shoe and the Moon. (Tests Universalism vs. Common Sense).
      *   *Case 6: Vague Artifact.* A cloud of steam. (Tests boundary vagueness).
      *   *Case 7: Functional Aggregate.* A functioning computer. (Tests artifact vs. machine).
      *   *Case 8: Temporal Parts/Change.* A river during a drought. (Tests persistence/constitution). *Correction:* Let's keep it strictly to synchronic composition for simplicity in an intro quiz. Let's swap River for something like "A pile of sand vs. a sandcastle." Let's go with "A sandcastle."

      *Refining Cases for Clarity:*
      1.  Half-built Lego bridge.
      2.  Two strangers in an elevator.
      3.  A living cat.
      4.  A pile of dead ants.
      5.  Your nose and the Eiffel Tower.
      6.  A functioning smartphone.
      7.  A cloud (water droplets).
      8.  A shattered vase (glued back together).

  4.  **Drafting the Answer Choices:**
      *   Need to force a commitment.
      *   A: Yes, there is a distinct object there.
      *   B: No, just the parts arranged that way.
      *   (Optional C): It depends/Unsure (might mess up scoring, better to force A/B for clear mapping, or make C the "Brutalist" intuitive catch-all). Let's stick to A/B for cleaner scoring, but allow nuance in the explanation. Actually, for Brutalism, they might say "Yes" to some and "No" to others based on intuition. So A/B is fine.

  5.  **Developing the Scoring Key:**
      *   *Nihilist:* Mostly/All "No" (except maybe the single simple, but the questions ask about composites).
      *   *Universalist:* All "Yes".
      *   *Organicist:* "Yes" *only* to the living cat. "No" to artifacts, random sums, dead things.
      *   *Brutalist:* Mixed. "Yes" to Cat, Smartphone, Cloud. "No" to Strangers, Nose+Tower. Doesn't follow a strict rule.

  6.  **Addressing the "Incoherent/Unexplored" and "Indistinguishable" Requirements:**
      *   *Incoherent:* Saying "Yes" to Strangers in Elevator but "No" to Living Cat (usually implies a weird priority of artifacts over life, or contact-based view that fails on organisms).
      *   *Indistinguishable:* Brutalism vs. Common Sense Restrictivism (e.g., Artifact view). The quiz might not separate "Brutalism" from "Moderate Restrictivism" perfectly because Brutalism is often a meta-claim about *why* the answers are what they are, not just the answers themselves. Also, Nihilism vs. Universalism are easy to separate, but Organicism vs. Artifact-ism might be close if I don't have enough artifact questions.
      *   *Specific Constraint:* Flag two views the quiz can't separate. Brutalism and "Common Sense Moderatism" are hard to separate because Brutalism claims there's no *principle*, but the verdicts look like Moderatism. Also, Nihilism and "Almost Nihilism" (only atoms exist) look the same on macro objects. Let's flag Brutalism vs. Moderate Restrictivism.

  7.  **Review and Refine:**
      *   Check question count: 8.
      *   Check tone: Handout style.
      *   Check views: Nihilism, Universalism, Life-Only, Brutalism.
      *   Check specific request: "Don't just ask if people believe in wholes, sort them by their verdicts on cases."
      *   Check specific request: "Note any answer combo that doesn't fit any view."

  8.  **Final Polish:**
