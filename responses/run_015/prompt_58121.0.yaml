      *Problem:* Brutalism is often a view about the *SCQ answer* (there is no true informative answer), but a Brutalist might still have intuitions that align with Common Sense. I need to make sure the scoring key distinguishes the *pattern* of Common Sense (which Brutalists often accept as brute) from Organicism.
      *Refinement:* I will label the "Mixed/Intuitive" score as "Brutalist/Restrictivist" to acknowledge the overlap.

