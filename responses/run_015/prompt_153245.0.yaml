          *   Teleological: Fails the "Swampman" intuition (or requires complex function definition for LLMs).
      *   *Section 4: The Killer Constraint.* What rules the most out? It's the **Non-Derivativity Condition**. To be "Original," the intentionality cannot depend on an external interpreter. But if it doesn't depend on an interpreter, how do we distinguish it from mere causation (tree rings)?
