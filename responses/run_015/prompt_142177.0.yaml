  I defend measure (3), deaths counterfactually attributable to entitlement collapse, because it isolates the specific political-economic failure from background mortality. This treats famine not as a biological event but as a rupture in social protection.

  **Conceptual Structure**
  These quantities diverge because they posit different ontologies. (1) assumes famine is a biological property of individual deaths; (2) treats it as a demographic event with a toll; (3) views it as a causal contribution carved from ordinary deprivation; (4) demands a net loss of life-years. For (1) and (3) to coincide, the world must be such that economic exclusion manifests solely as caloric deficit leading directly to physiological shutdown. They diverge sharply in a world where immune systems collapse due to stress or micro-nutrients before visible wasting, or where disease vectors proliferate due to social disintegration unrelated to individual caloric intake. (2) captures the spike but conflates famine with other shocks if baseline mortality is volatile. (4) refines this by excluding mortality displacement, asking whether the famine created new deaths or merely hastened inevitable ones, thus distinguishing between killing and letting die on a timer. The intuition here is whether famine is a distinct agent of death or merely an intensifier of existing risks.

  **The Velmara Case**
  In Velmara, the government's announcement is legally true but substantively false. The code defines a narrow meteorological-economic trigger, while entitlement analysis reveals a social famine despite adequate aggregate supply. Does our choice among (1)–(4) settle the question by stipulation? No, because the causal mechanism exists independently of the label. (1) might miss the deaths entirely if disease masks starvation, allowing the government to claim no "starvation deaths." (3) captures the reality that social arrangements failed specific groups regardless of granary levels. There is a fact of the matter about causal responsibility that exists independent of the label "famine," which (3) best approximates. The code defines a liability threshold, not the phenomenon itself. If (3) shows deaths caused by entitlement collapse, a famine occurred in the substantive sense, regardless of the legal code. The measure tracks the social reality, not the administrative category.

  **Resisting the Slide-Offs**
  To resist the slide-offs, we must decouple liability from clinical proof and harm from inevitability. Against (1), argue that famine is a failure of protection, not just a medical diagnosis; if policy destroys entitlements, the resulting deaths are famine deaths regardless of immediate cause. This prevents the "no crime" finding based on technical definitions. Against (4), argue that hastening death is a harm worthy of accountability; "dying anyway" mitigates damages but does not erase causality. The baseline of endemic deprivation is itself often a political product, not a natural fact. The political crime lies in the entitlement collapse (3), while the moral weight rests on the net life lost (4). Refusing to let administrative definitions or background mortality obscure causal responsibility prevents both erasure and minimization. We must treat the baseline not as nature, but as the status quo ante which the state failed to protect.
