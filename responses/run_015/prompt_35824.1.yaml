answer: |-
  Question

  Consider an urn containing 100 balls, each either Red or Black. The proportion of Red balls is unknown. An agent assigns a subjective prior belief that the proportion of Red balls is uniformly distributed on [0,1]. However, when evaluating bets, the agent does not maximize expected utility with respect to this prior. Instead, the agent evaluates each bet by its worst-case expected utility, minimizing over all possible proportions of Red balls. For example, a bet paying $100 if Red is valued at $0, because the proportion of Red could be 0. A student claims this behavior is fully compatible with standard Expected Utility (EU) maximization, arguing it is simply EU over a richer state space that includes the urn composition as a state, combined with a non-degenerate prior. Adjudicate this claim. Specifically, determine whether this model preserves the axioms required for EU representation, such as the Sure-Thing Principle. Explain whether the agent's behavior reflects risk aversion over second-order probabilities or a distinct preference structure. Finally, demonstrate whether this agent is dynamically consistent: if the agent draws a ball and observes its color, does their valuation of remaining bets change in a way consistent with their initial prior and evaluation rule?

  Model Answer

  The student's claim is fundamentally incorrect because it conflates Bayesian uncertainty with ambiguity aversion. While the model utilizes a state space enriched with urn compositions, it violates the linearity in probabilities required for Expected Utility maximization. In standard EU theory, an agent with a Uniform[0,1] prior over the proportion of Red balls must calculate the marginal expected probability of Red as 0.5. Consequently, they should be indifferent between betting on Red or Black, valuing both at half the prize. By evaluating bets using the worst-case proportion, the agent assigns a value of zero to betting on Red because the proportion could be zero. This preference structure violates the Sure-Thing Principle. The principle requires that if an agent prefers Act A to Act B regardless of the state of the world, they should prefer A to B unconditionally. Here, the agent's evaluation depends on the set of possible probabilities rather than a weighted average, breaking the linearity axiom essential for EU representation.

  This behavior cannot be reduced to risk aversion over second-order probabilities. In EU theory, risk aversion is captured by the concavity of the utility function over outcomes, not the weighting of probabilities themselves. An EU maximizer with a second-order prior integrates over that prior to form a single first-order expectation. They treat uncertainty about probabilities as merely another layer of risk to be averaged out. The Minimax agent, however, ignores the weights of the prior distribution entirely, focusing only on the support set. This is a distinct preference structure, formally captured by MaxMin Expected Utility, which explicitly relaxes the Independence axiom to accommodate ambiguity aversion. Ambiguity aversion here is not a curvature of utility but a non-linearity in how probability measures are aggregated.

  Furthermore, the model fails dynamic consistency, a key property of rational EU agents. Consider the agent ex-ante valuing a bet on Red at $0. Suppose the agent commits to a strategy: I will bet on Red if I draw a ball and it is Red. If the agent observes a Red ball, Bayesian updating of the Uniform prior shifts the posterior distribution toward higher proportions of Red. A dynamically consistent EU agent would update their valuation upward. However, the Minimax agent updates the set of priors. Unless the set of priors satisfies a specific rectangularity condition, the worst-case scenario after observing Red might still be sufficiently pessimistic to reject the bet, even though the ex-ante plan was to accept it. This time inconsistency means the agent cannot form a coherent strategic plan, as their future self will deviate from their current self's optimal choice.

  Thus, the model sacrifices dynamic consistency and axiomatic coherence to capture ambiguity aversion. The student's description contains an internal contradiction: if the agent truly holds a single Uniform prior, EU maximization dictates integrating over it. Choosing the worst-case implies the agent does not trust the Uniform prior weights, effectively treating the prior as a set of all possible distributions rather than a single probability measure. This distinction is crucial. In the dynamic setting, if the agent treats the prior as a set, updating upon observing a Red ball removes proportions near zero from the set. However, the Minimax rule reapplies to the remaining set. If the agent initially planned to bet on Red only if the proportion was high, but the worst-case remains low even after updating, they deviate from their plan. This violation of consequentialism means the agent cares about the path of information, not just the final outcome distribution. Thus, the model is not standard EU maximization but a distinct theoretical framework that gives up Savage's axioms to explain the Ellsberg paradox.

  Marking Scheme

  First, students must identify that the model violates the linearity in probabilities required for Expected Utility representation, worth 4 marks. The answer should explicitly state that minimizing over probabilities is a non-linear operation, unlike the integration required by EU. A common error here is students accepting the student's claim that a richer state space automatically preserves EU axioms without checking the functional form.

  Second, students must explain the violation of the Sure-Thing Principle, worth 4 marks. They need to articulate that preferences depend on the unknown state probabilities in a way that contradicts Savage's P2. Students typically screw this up by defining the Sure-Thing Principle incorrectly or failing to link the minimization operation directly to the violation.

  Third, students must distinguish ambiguity aversion from risk aversion over second-order probabilities, worth 4 marks. The explanation must clarify that EU averages second-order uncertainty, whereas Minimax ignores the weights. A frequent mistake is conflating concavity of the utility function with the non-linearity of the probability weighting functional.

  Fourth, students must analyze dynamic consistency with a concrete example of ex-ante versus ex-post valuation, worth 4 marks. They should demonstrate how updating the set of priors leads to time inconsistency. Students often hand-wave about dynamic consistency without providing a specific scenario where the agent's plan deviates after an observation.

  Fifth, students must conclude that the model sacrifices axiomatic coherence to explain the paradox, worth 4 marks. The answer should recognize that this is a distinct framework like Gilboa-Schmeidler, not standard EU. A typical error is concluding that the model is valid EU simply because it uses a prior, missing the contradiction between having a prior and ignoring its weights.
