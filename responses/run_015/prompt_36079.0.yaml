  I'm a philosophy of mind PhD student and I have to turn a half-baked idea into a prospectus for my qualifying paper (roughly one year, ~40 pages, so it needs to be doable but not trivial). My thought: Kim's exclusion argument only works if the physical cause and the mental cause are competitors for the same causal job, and I suspect that if you take contrastive causation seriously -- causes as answers to questions like "why p rather than q" rather than just "why p" -- the competition evaporates. The physical realizer of my raising my arm answers different contrast questions than my desire to signal does: the desire explains why my arm went up rather than stayed down, say, while the neural realizer might be what explains why this tokening happened rather than a slightly different one. Same effect, but if the explanatory work is carved up by contrast, "overdetermination" by the physical may be no more real overdetermination than a shadow being overdetermined by the flagpole and the sun.

  Please turn this into an actual proposal: a precise statement of the question, why the standard responses (realization-exclusion, the "supervenience argument is just too strong" line, interventionist approaches that reframe causation in terms of variables rather than properties) don't already settle it, the method -- what I'd actually do chapter by chapter, and be honest about where it might just collapse into one of those standard responses with extra vocabulary. Say what a positive result looks like and what would count as the project failing. No citations needed, I'll slot those in myself, just refer to positions and arguments by name.
