answer: |-
  **Qualifying Paper Prospectus**

  **Working Title:**
  Dissolving the Competition: A Contrastive Approach to the Causal Exclusion Argument

  **1. The Research Question**
  Jaegwon Kim's Causal Exclusion Argument relies on a specific metaphysical picture of causation: that causes are binary relations between events ($c$ causes $e$), and that if a physical event $P$ is sufficient for $e$, any distinct mental event $M$ supervening on $P$ is excluded from causing $e$ (barring systematic overdetermination).

  This project asks: **Does adopting an ontology of contrastive causation dissolve the "competition premise" of the Exclusion Argument?**

  Specifically, I will investigate whether formulating causation as a ternary relation ($C$ causes $E$ rather than $E^*$) allows the mental and the physical to be genuine causes of the same effect token without competing, because they answer different contrastive questions. If the mental cause answers "Why $E$ rather than $\neg E$?" and the physical cause answers "Why $E_{this-way}$ rather than $E_{that-way}$?", the threat of exclusion may vanish not because causation is redundant, but because the relata of the causal relation have been misidentified in the standard formulation.

  **2. Motivation and Standard Responses**
  The Exclusion Argument remains the central hurdle for non-reductive physicalism. Standard responses generally fall into three camps, none of which are fully satisfactory for the specific niche this project targets:

  *   **The Identity/Realization Response:** This denies the distinctness of $M$ and $P$. While it blocks exclusion, it threatens to collapse non-reductive physicalism into type-identity theory or a realization physicalism that struggles to preserve the autonomy of special science properties. It solves the problem by eliminating one of the competitors, rather than showing they can coexist.
  *   **The Interventionist/Difference-Making Response:** Proponents argue that $M$ and $P$ play different causal roles defined by counterfactual dependencies. While promising, this approach often faces the objection that it changes the subject from *production* to *dependence*, or that it merely relocates the exclusion problem to the level of variables. Kim can argue that interventionism describes our epistemic access to causation, not the underlying ontological relation which remains exclusive.
  *   **The "Compatibilist" Response:** Some argue that $M$ and $P$ are simply compatible causes. However, without a revised metaphysics of causation, this often looks like an assertion rather than an argument. It fails to explain *how* two sufficient causes can exist without constituting the implausible systematic overdetermination Kim warns against.

  My hypothesis is that **Contrastive Causation** offers a more fundamental solution than standard interventionism. While interventionism focuses on variables, contrastivism focuses on the *structure of the causal fact itself*. If causal facts are inherently contrastive, there is no "uncontrastive" causal fact for the physical to monopolize. This is not merely a pragmatic claim about explanation (which Kim grants) but an ontological claim about the nature of the causal relation.

  **3. Methodology and Chapter Outline**
  This is a theoretical philosophy paper. The method involves conceptual analysis, argument reconstruction, and counterexample testing. The scope is limited to the structure of the Exclusion Argument itself, not a full defense of contrastive causation in all domains.

  **Chapter 1: The Structure of Exclusion (approx. 8 pages)**
  *   Reconstruct Kim's Exclusion Argument, focusing specifically on the **Causal Closure Principle** and the **Exclusion Principle**.
  *   Isolate the "Competition Premise": The assumption that $M$ and $P$ are candidates for causing the *same* causal fact.
  *   Argue that Kim's formulation presupposes a binary, non-contrastive ontology of causation. Show that if causation is binary, the competition is real.

  **Chapter 2: The Contrastive Framework (approx. 10 pages)**
  *   Introduce the contrastive account of causation ($c$ causes $e$ rather than $e^*$).
  *   Distinguish this from contrastive *explanation*. I must argue that the contrast is part of the truth-conditions of the causal claim, not just our pragmatic interest.
  *   Develop the core mechanism: The Mental Cause ($M$) selects a coarse-grained contrast (Up vs. Down). The Physical Cause ($P$) selects a fine-grained contrast (Neural Pattern A vs. Neural Pattern B).
  *   Argue that because the *effect relata* differ ($E_{coarse}$ vs. $E_{fine}$), $M$ and $P$ are not causes of the *same fact*. Therefore, the Exclusion Principle (which forbids two causes for the *same* effect) is not triggered.

  **Chapter 3: Objections and The "Shadow" Problem (approx. 12 pages)**
  *   **The Ontological Objection:** Kim will argue that the physical relation is the "real" causation and the contrastive mental relation is derivative. I must defend the parity of contrastive facts.
  *   **The Proportionality Objection:** If $P$ is too specific, is it still a cause? I will engage with the constraint that causes must be proportional to their effects. I will argue that $M$ is proportional to the agency-relevant contrast, while $P$ is proportional to the physiological contrast.
  *   **The Flagpole/Shadow Analogy:** The prompt suggests overdetermination here is like a shadow being caused by the flagpole and the sun. I need to be careful here. Kim uses the shadow case to illustrate *epiphenomenalism*. I must show why the mental is not the shadow. The distinction is that the mental contrast is not a byproduct of the physical contrast; it is a legitimate causal dimension in its own right. If I fail to distinguish this, the project collapses into epiphenomenalism.

  **Chapter 4: Limits and Implications (approx. 10 pages)**
  *   Assess the cost of this solution. Does it require accepting that all causation is contrastive? (Yes, likely).
  *   Does this save non-reductive physicalism or merely redefine it?
  *   Conclude with the status of the Exclusion Argument: It is not "refuted" but "dissolved" because its binary presupposition is rejected.

  **4. Honest Assessment of Risks**
  There are two major points of failure for this project:

  1.  **Collapse into Interventionism:** The most significant risk is that this turns out to be a restatement of the Interventionist/Difference-Making response (e.g., List and Menzies) with extra vocabulary. If "different contrasts" just means "different variables in a causal model," I haven't added metaphysical weight.
      *   *Mitigation:* I need to emphasize that contrastivism is a claim about the *relata* of causation, not just modeling. Interventionism often leaves the relata as events; contrastivism says the event *is* individuated by the contrast.
  2.  **The "Real Causation" Retreat:** Kim can concede that contrastive mental causation is true *as explanation*, but insist that *ontological* causation (the "production" of the effect) is still binary and physical. If I cannot argue that contrastive causation is the *only* causation there is, the Exclusion Argument returns at the ontological level.
      *   *Mitigation:* I must argue that "binary causation" is an incoherent abstraction. There is no "cause simpliciter." If I cannot defend this strong claim, the project fails to block Kim.

  **5. Success and Failure Conditions**
  *   **Success:** I successfully demonstrate that the Exclusion Principle is ambiguous without specified contrasts. I show that once contrasts are fixed, $M$ and $P$ do not compete for the *same* causal slot. I defend the claim that contrastive causation is ontological, not merely pragmatic.
  *   **Failure:**
      *   If I am forced to concede that physical causation is "more fundamental" than mental contrastive causation (which reintroduces exclusion at the fundamental level).
      *   If the distinction between the mental contrast and the physical contrast turns out to be arbitrary or interest-relative in a way that undermines the reality of the mental cause.
      *   If the project devolves into a general defense of contrastive causation unrelated to the specific mechanics of Kim's argument.

  **6. Feasibility**
  The project is scoped for ~40 pages. It does not require empirical work or a full history of the exclusion debate. It requires a tight focus on the logical structure of the Exclusion Principle vis-à-vis the ternary nature of causal relations. The primary workload is argumentative precision: ensuring the distinction between "contrastive explanation" and "contrastive causation" is maintained throughout. This is manageable within a one-year timeline for a qualifying paper.
