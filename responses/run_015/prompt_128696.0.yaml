      *   *Epistemic Modesty:* Acknowledging the limits of one's knowledge. Oedipus lacks this. He is hyper-confident (hubris as epistemic overconfidence).
      *   *The Chorus:* They aren't omniscient. They waver. They represent the "reasonable citizen" who trusts the King but fears the Gods. They are the bridge between the human inside view and the divine outside view.
      *   *Blindness:* Tiresias is physically blind but sees the truth (Outside View). Oedipus sees physically but is blind to the truth (Inside View). At the end, Oedipus blinds himself. Is this an admission of epistemic failure?
