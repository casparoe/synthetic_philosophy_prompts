answer: |-
  # Workshop Instrument: The Integrity Diagnostic

  ## Part 1: Logical Architecture (The Tree)

  Before administering the quiz, understand the logical space it maps. We are not testing "good vs. bad" behavior; we are testing where your team draws the boundary of the office's commitment to truth. The questions are designed to triangulate your position based on two branching nodes.

  **Node 1: Source of the False Belief**
  *   **Speaker-Supplied:** You actively place a claim into the world that drives the error (e.g., answering the wrong question, selective briefing).
  *   **Hearer-Assembled:** You provide true materials, but the audience constructs the false belief themselves (e.g., letting a wrong story run, "no comment" silence).
  *   *The Tension:* Does it matter who does the heavy lifting? If the audience guesses wrong based on your hints, is that on them?

  **Node 2: Traceability (The Record)**
  *   **High Traceability:** There is a sentence on the record that can be checked against facts (e.g., a statistic, a technical definition).
  *   **Low Traceability:** The impact relies on tone, timing, or implication, leaving no falsifiable sentence (e.g., a 6pm Friday release, jargon usage).
  *   *The Argument:* Does a clean record make the action **better** (you remained technically accurate) or **worse** (you retained deniability while forcing the audience to co-author their own mistake)?

  **The Seven Leaves (Philosophical Positions)**
  The scoring at the end will map your answers to one of these seven positions.
  1.  **Strong Assertionism:** Only asserting what you believe false is intrinsically wrong; everything else is just ordinary disclosure duties.
  2.  **Assurance-and-Role:** Saying "we never lie" already promised more than literal truth; the role creates a duty not to manipulate belief.
  3.  **No-Difference:** Mechanism is irrelevant; both manipulate the hearer's reasoning to the same end.
  4.  **Nothing-Is-Even-Pro-Tanto-Wrong:** Outcomes justify the method; if the public interest is served, the technique is neutral.
  5.  **Engineered-Truth-Worse:** Deliberately engineered literal truth can be worse than an outright false statement because it corrupts the audience's reasoning tools.
  6.  **Practice-Relative Conventionalism:** The local rules of the activity draw the line and there's no deeper fact; if the press accepts it, it's permissible.
  7.  **Eliminativist:** The lying/misleading distinction is a bad proxy and the tree should be rebuilt around something else — breach of assurance, manipulation, whatever you think.

  ***

  ## Part 2: The Diagnostic Instrument

  **Instructions:** Read each scenario. Select the option that best reflects your view of the action described. There are no right or wrong answers; we are mapping the room's consensus.

  **Response Scale:**
  *   **(A)** Totally fine / Standard practice.
  *   **(B)** A bit off but no big deal.
  *   **(C)** Just as bad as saying the false thing outright.
  *   **(D)** Worse than saying the false thing outright.

  ### The Questions

  **1. The Non-Denial Denial**
  A reporter asks if the Minister met with the lobbyist. You know they did, but it looks bad. You issue a statement: "The Minister does not comment on private meetings." The public concludes they never met.
  *   [ ] A
  *   [ ] B
  *   [ ] C
  *   [ ] D

  **2. The Tone of Silence**
  During a scandal, a camera crew asks if the CEO knew about the fraud. You stand at the podium, look down, pause for five seconds, and walk away without speaking. The evening news runs the clip with the caption "CEO Refuses to Deny Knowledge."
  *   [ ] A
  *   [ ] B
  *   [ ] C
  *   [ ] D

  **3. The Pivot**
  A journalist asks, "Did you cut funding for the program?" You answer, "We are reallocating resources to ensure better outcomes for families," knowing full well the funding was cut. Your sentence is factually accurate regarding the reallocation.
  *   [ ] A
  *   [ ] B
  *   [ ] C
  *   [ ] D

  **4. The Framed Statistic**
  Unemployment is up overall, but down in the manufacturing sector. You issue a press release highlighting only the manufacturing numbers with the headline "Jobs Growth Continues," without mentioning the overall rise.
  *   [ ] A
  *   [ ] B
  *   [ ] C
  *   [ ] D

  **5. The Friday Dump**
  You have to release a report containing damaging data. You schedule the release for 6:00 PM on the Friday before a long holiday weekend to minimize coverage. The data is public and accurate.
  *   [ ] A
  *   [ ] B
  *   [ ] C
  *   [ ] D

  **6. The Selective Briefing**
  You are not allowed to announce a policy change yet. You call one friendly journalist, give her the details on background, and know she will publish the story in a way that benefits you without attributing the info to the office.
  *   [ ] A
  *   [ ] B
  *   [ ] C
  *   [ ] D

  **7. The Technical Term**
  There are suspected infections, but lab results aren't back. You tell the public there are "no confirmed cases." Your team knows this means "no lab-verified cases," but the public hears "no sickness."
  *   [ ] A
  *   [ ] B
  *   [ ] C
  *   [ ] D

  **8. The Jargon Shield**
  During a safety inquiry, you answer questions using complex regulatory acronyms and legal definitions you know the audience will not parse, effectively hiding the risk level while remaining technically precise.
  *   [ ] A
  *   [ ] B
  *   [ ] C
  *   [ ] D

  **9. The Passive Correction**
  A major paper runs a story with a key factual error that makes you look good. You notice it before the next edition but say nothing. You issue a correction only after a competitor blog points it out two days later.
  *   [ ] A
  *   [ ] B
  *   [ ] C
  *   [ ] D

  **10. The Credibility Deficit**
  Your office has exaggerated threats before. Now there is a genuine risk. You tell the plain truth, but the public assumes you are exaggerating again and ignores the warning. You knew this reaction was likely when you spoke.
  *   [ ] A
  *   [ ] B
  *   [ ] C
  *   [ ] D

  **11. The Calibration (Doorstep Case)**
  *Note: This question is not about your job, but about your baseline ethics.*
  A person comes to your home asking for your friend. You know this person intends to kill your friend. You tell them your friend is not there (he is hiding in your basement).
  *   [ ] A
  *   [ ] B
  *   [ ] C
  *   [ ] D

  ***

  ## Part 3: Scoring Key & Leaf Mapping

  To find your position, tally your answers. This is not a precise algorithm but a diagnostic heuristic. Look for the *pattern* of your severity.

  **The "Clean Record" Cluster (Questions 1, 3, 4, 7, 8)**
  *These questions involve High Traceability. You said something technically true.*
  *   **Mostly A/B:** You lean toward **Strong Assertionism**. You believe the record's accuracy is the primary ethical duty.
  *   **Mostly C/D:** You lean toward **Engineered-Truth-Worse** or **No-Difference**. You believe a true sentence used to create a false belief is ethically compromised.

  **The "Impression" Cluster (Questions 2, 5, 6, 9)**
  *These questions involve Low Traceability. The record is silent or ambiguous.*
  *   **Mostly A/B:** You lean toward **Nothing-Is-Even-Pro-Tanto-Wrong** or **Practice-Relative Conventionalism**. If there's no falsifiable claim, the action is a tool of the trade.
  *   **Mostly C/D:** You lean toward **Assurance-and-Role**. You believe the office's promise covers implications and timing, not just sentences.

  **The "Context" Cluster (Questions 10, 11)**
  *These questions test whether external factors override rules.*
  *   **Q11 = A (Totally Fine):** You reject **Strong Assertionism**. You believe context (harm prevention) overrides truth-telling rules.
  *   **Q10 = C/D (Just as Bad/Worse):** You lean toward **Assurance-and-Role**. You believe past behavior creates a debt that makes current truth-telling insufficient.

  ### Mapping to Leaves

  | If your pattern is... | Your Likely Leaf | The Awkward Commitment |
  | :--- | :--- | :--- |
  | **High tolerance for "Clean Record" questions; Strict on Q11.** | **Strong Assertionism** | "I can help you believe a falsehood as long as I don't sign my name to the false sentence." |
  | **Strict on "Impression" questions; Strict on Q10.** | **Assurance-and-Role** | "My job title creates a promise that limits my tactics more than the dictionary does." |
  | **Consistent Severity (All C/D) regardless of mechanism.** | **No-Difference** | "It doesn't matter how I built the trap, only that I wanted you to fall in it." |
  | **Consistent Leniency (All A/B) except Q11.** | **Nothing-Is-Even-Pro-Tanto-Wrong** | "If the outcome is safe, the method of information control is morally neutral." |
  | **Strictest on "Clean Record" questions (D ratings).** | **Engineered-Truth-Worse** | "I would rather be caught in a lie than successfully trick you with the truth." |
  | **Variable answers based on 'Standard Practice' cues.** | **Practice-Relative Conventionalism** | "If the press pool accepts the tactic, it is permissible; if they revolt, it is not." |
  | **Inconsistent / Rejects the options.** | **Eliminativist** | "We are asking the wrong questions; we should be measuring breach of trust, not truth-values." |

  ### Analysis of Empty & Problematic Cells

  **1. Indistinguishable Leaves: No-Difference vs. Eliminativist**
  *   **The Problem:** On a multiple-choice quiz, the **No-Difference** view (mechanism irrelevant, intent matters) and the **Eliminativist** view (the distinction is a bad proxy) often produce identical answer keys (usually consistent C/D ratings across the board).
  *   **Why:** Both reject the "literal truth" defense.
  *   **Workshop Fix:** You cannot separate these with this instrument alone. You must ask a follow-up: "Is the problem that you created a false belief (No-Difference) or that you violated a norm of assertion (Eliminativist)?"

  **2. The "House Style" Cell (Empty in Theory, Full in Practice)**
  *   **The Combination:** High Tolerance for "Clean Record" (A/B on Q1, 3, 4) + High Tolerance for "Impression" (A/B on Q2, 5) + Strict on Q11 (Doorstep).
  *   **Leaf:** This maps to **Strong Assertionism** mixed with **Nothing-Is-Wrong**.
  *   **Status:** **Undefended in Theory, Actual House Style.**
  *   **Analysis:** Philosophically, this is unstable. If you believe truth-telling rules are absolute enough to forbid lying to a murderer (Q11), you should logically be stricter on Q1 and Q3. However, this is exactly how most press offices operate: "We don't lie (Assertionism), but we manage the news (Nothing-Is-Wrong), unless it's a life-or-death moral crisis (Q11)."
  *   **Workshop Goal:** This is the cognitive dissonance you need to land. The team likely occupies this cell. The workshop must ask: *Can we hold this position consistently, or do we need to admit our "Never Lie" line is actually "Never Lie, Unless It's Tuesday"?*

  **3. The Incoherent Cell**
  *   **The Combination:** Strict on "Clean Record" (C/D on Q1, 3) + Lenient on "Impression" (A/B on Q2, 5).
  *   **Why Incoherent:** This suggests that *traceability* is the only moral metric. It implies it is worse to write a true sentence that misleads than to use tone/timing to mislead. While defensible (Engineered-Truth-Worse), it is rarely held consistently without also rating the "Impression" tactics as at least "A bit off" (B). If they are "Totally Fine" (A), it contradicts the strictness on the record.
  *   **Status:** **Merely Unattractive.** It privileges paperwork over impact in a way that is hard to justify to the public.

  **4. The "Credibility" Gap (Question 10)**
  *   **The Combination:** Anyone who marks Q10 as "Totally Fine" (A).
  *   **Status:** **Practice-Relative Conventionalism.**
  *   **Analysis:** This view holds that if the public is cynical, that is the public's problem, not the office's. This is the most dangerous cell for a comms team long-term. If you mark A here, you are accepting that your office's past errors license your current irrelevance.

  ### Facilitator Notes for the "Tree" Argument

  When discussing **Node 2 (Traceability)**, use the quiz results to drive the debate:
  *   **If the room prefers A/B on High Traceability questions:** Argue that a clean record is *worse* (Leaf: Engineered-Truth-Worse). It forces the audience to do the work of deceiving themselves, making them less likely to trust *any* data next time.
  *   **If the room prefers C/D on High Traceability questions:** Argue that a clean record is *better* (Leaf: Strong Assertionism). It preserves the integrity of the archive, even if the immediate impression is managed.

  **Final Warning:** Do not use the forbidden words during the debrief. If a participant says, "That's misleading," rephrase it for them: "So you feel that creates a false impression without a falsifiable claim?" This keeps the diagnostic clean.
