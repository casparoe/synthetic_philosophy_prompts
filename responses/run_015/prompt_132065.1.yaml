      *   *Address the Neuroscience angle:*
          *   Neural data needs interpretation (the "neural translation manual").
          *   Calibration relies on behavior (the circle).
          *   Even with neural data, multiple semantic interpretations fit the physical facts.
      *   *Consider the Counter-Counter-argument:* Maybe Quine was wrong about behaviorism. If mental representations exist objectively (as cognitive scientists claim), does indeterminacy vanish?
          *   Reference Magnetism (Lewis)?
          *   Teleosemantics (Millikan)?
