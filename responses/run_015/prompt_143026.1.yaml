answer: |-
  ### The Moral Risk Portfolio (MRP) Procedure

  This procedure is designed to be run in under three hours. It does not attempt to resolve moral disagreement by finding a common currency of value. Instead, it treats the budget as a resource to be partitioned according to the *authority* of each moral outlook, proportional to the committee's credence in them. It frames the recommendation not as "the optimal good," but as "the responsible management of moral risk."

  #### 1. Constructing the Lists (30 Minutes)
  **Outlooks:** Do not list every philosophical variant. Cluster them into **Families** based on action-guiding implications.
  *   *Family A (Aggregative):* Impartial concern, maximizing welfare. (Includes the long-run risk variant).
  *   *Family B (Constraints):* Duties, rights, side-constraints against using individuals.
  *   *Family C (Threshold):* Priority to the worst-off, decent minimums.
  *   *Handling Variants:* If two variants within a Family (e.g., hedonic vs. preference utilitarianism) agree on the current proposals, count them as one block of credence. If they disagree, split the Family's credence between them.
  *   *The Non-Numeric Member:* This member provides an **Ordinal Ranking** of the Families (e.g., "B is most plausible, A and C are tied for second"). Map this to ranges for calculation: Rank 1 = 30–40%, Rank 2 = 20–30%, Rank 3 = 10–20%. Use the midpoint for the procedure; record the range for the Board.

  **Shortlist:** Proposals must be pre-screened for empirical viability (not a moral question). The Committee only considers proposals that are *empirically sound* but *morally contested*.

  #### 2. Normalization and Comparability (45 Minutes)
  **The Rule:** **Proportional Budget Authority.**
  We do not normalize *value* (utils, rights, welfare). We normalize *decision-making power* over the budget.
  *   **Assumption:** In the face of intractable moral uncertainty, the foundation minimizes expected moral regret by acting as if the budget is divided into tranches, each managed by a different moral outlook according to its credence.
  *   **The Check:** To ensure the ranking is not an artifact of this rule, run a **Sensitivity Swap**. Shift 10% of the budget authority from the highest-credence Family to the lowest. If the recommendation flips entirely, the decision is too fragile; flag it for the Board. If the portfolio mix remains stable, proceed.

  **Handling the Non-Numeric Member:** Their ordinal ranking sets the bounds of the ranges above. If they refuse even ranking, they are assigned a "Veto Role" on Family B (Constraints) issues only, acknowledging that side-constraints often function as trumps rather than weights.

  #### 3. Hedging and Long Shots (30 Minutes)
  **The Cap:** No single proposal may receive more funding than the total budget authority of the Families that support it.
  *   *Example:* If a proposal is only supported by a variant with 8% credence, it cannot receive more than 8% of the round's budget, even if its potential value is infinite. This prevents "Pascal's Mugging" of the budget.
  **The Hedge:** We do not "hedge" by blending projects. We hedge by funding *distinct* projects that satisfy different Families.
  **The Floor:** If Family C (Threshold) identifies a proposal that prevents someone from falling below a decent minimum, it gets priority funding up to Family C's budget share, regardless of aggregate efficiency.

  #### 4. Moral Uncertainty Reduction (15 Minutes)
  **The Epistemic Tax:** Deduct **5%** of the total round budget *before* partitioning.
  *   *Justification:* All three Families agree that making better decisions in the future is instrumentally valuable. This funds research, monitoring, or ethical review that clarifies which outlook is correct.
  *   *Outlook Dependence:* If Family B (Constraints) objects that this money should be spent on victims now, the Tax is capped at 5%. This is a fixed procedural rule, not a negotiable value.

  #### 5. Stopping Rules and Board Escalation (30 Minutes)
  **Committee "No":** If a proposal exceeds the Budget Authority of its supporting Families and cannot be scaled down, the Committee recommends "No."
  **Board Escalation:** The Committee sends a recommendation to the Board if:
  1.  **The Veto Trigger:** A proposal maximizes Aggregate Value (Family A) but violates a Side-Constraint (Family B) that the Committee deems plausible. This is a values question, not a technical one.
  2.  **The Fragility Trigger:** The Sensitivity Swap (Step 2) changes the portfolio completely.
  3.  **The Epistemic Dispute:** The Committee cannot agree on the "Epistemic Tax" amount.

  #### 6. Presentability (The Narrative)
  The recommendation to the Board (and donors) must not use expected-value language.
  *   **Forbidden:** "This portfolio maximizes expected moral value."
  *   **Required:** "This portfolio reflects the distribution of moral risk the foundation is willing to bear. We funded X because the view supporting it commands significant moral confidence. We funded Y because ignoring it would constitute an unacceptable moral risk given its plausibility."
  *   **Donor Test:** A donor holding *only* Family A views must be able to read: "We allocated X% to this cause because our analysis suggests a Y% probability that your moral outlook is the correct guide." They may disagree with the probability, but they recognize the *reason* as genuine (respect for truth), not alien (trade-off).

  ---

  ### Application to Current Proposals

  **Context:** Quarterly Round Budget = $1,000,000.
  **Epistemic Tax (5%):** $50,000 (Set aside for evaluation/research).
  **Distributable Budget:** $950,000.

  **Credence Allocation (Approximated):**
  *   **Family A (Aggregative):** 33% ($313,500). *Includes the 8% Long-Run Variant.*
  *   **Family B (Constraints):** 33% ($313,500).
  *   **Family C (Threshold):** 33% ($313,500).
  *(Note: The non-numeric member ranked B first, A and C tied second. Ranges applied to align with the 1/3 diffuse consensus.)*

  **The Proposals:**
  1.  **Disease Prevention (Aggregative):** High aggregate welfare. Low relevance to Rights/Threshold (unless disease targets the poor, assume mixed).
  2.  **Impact Litigation (Constraints/Threshold):** Enforces rights for a small, badly off group. Low aggregate impact.
  3.  **Speculative Long-Run Risk (Aggregative Variant):** Enormous value if correct. 8% Credence.

  **The Calculation:**

  1.  **Speculative Grant:**
      *   *Support:* Only the Long-Run Variant of Family A (8% credence).
      *   *Cap:* 8% of Total Budget ($1M) = $80,000.
      *   *Request:* Assume the grant asks for $150,000 to be viable.
      *   *Procedure Verdict:* **Fund at $80,000** (scaled down) OR **Reject** if scaling destroys efficacy. Let us assume scaling destroys efficacy.
      *   *Recommendation:* **Reject.**
      *   *Unpalatable Outcome:* The long-termist members (and the 8% credence holders) will dislike this. They believe the upside justifies more. The procedure forbids it.

  2.  **Impact Litigation:**
      *   *Support:* Family B (Constraints) and Family C (Threshold).
      *   *Authority:* 33% + 33% = 66% of Distributable Budget ≈ $627,000.
      *   *Request:* $500,000.
      *   *Procedure Verdict:* **Fund.** This falls well within the authority of B and C.
      *   *Unpalatable Outcome:* Family A (Aggregative) members will dislike this. They believe this money could save more lives elsewhere. They must accept it as the "cost" of respecting the 66% credence in non-aggregative views.

  3.  **Disease Prevention:**
      *   *Support:* Family A (Aggregative).
      *   *Authority:* 33% of Distributable Budget ≈ $313,500.
      *   *Request:* $500,000 (to reach full scale).
      *   *Procedure Verdict:* **Fund at $313,500.** (Partial funding).
      *   *Unpalatable Outcome:* Family A members want to fund this fully ($500k+). They are capped by their own credence weight. They cannot commandeer the B/C funds.

  **Final Portfolio Recommendation:**
  *   **Impact Litigation:** $500,000.
  *   **Disease Prevention:** $313,500.
  *   **Speculative Risk:** $0.
  *   **Epistemic Tax:** $50,000.
  *   **Unallocated Surplus:** $86,500 (Carry over to next round or add to Epistemic Tax).

  **Presentability Statement for the Board:**
  > "We recommend this portfolio not because it maximizes a single metric, but because it honors the moral weight of the views we hold. The Litigation Grant is funded because the commitment to rights and minimums commands two-thirds of our moral confidence; to ignore it would be to gamble with rights we may be obligated to respect. The Disease Grant is funded proportionally to the confidence we have in aggregate welfare. The Speculative Grant was rejected not because the risk is unimportant, but because our confidence in that specific moral calculus does not justify commanding more than 8% of the foundation's resources. This allocation ensures that no single moral hypothesis can bankrupt the foundation's commitment to the others."

  ---

  ### What This Procedure Cannot Do

  **1. It Cannot Justify Itself (The Meta-Problem)**
  You asked whether the procedure can be trusted to pick itself. The answer is **no**.
  The MRP Procedure is itself a product of a **Fourth Outlook**: *Procedural Pragmatism*. This outlook holds that when substantive moral theories conflict, the right action is to negotiate a fair division of authority.
  *   Family A (Aggregative) might argue: "If Aggregativism is true, Procedural Pragmatism is false. You are sacrificing actual lives to a fetish for fairness."
  *   Family B (Constraints) might argue: "Rights are not budget items. You cannot allocate 33% of a right."
  *   Family C (Threshold) might argue: "If people are starving, procedural elegance is a luxury."

  The procedure works only because all four committee members have implicitly agreed to adopt *Procedural Pragmatism* for the sake of the meeting, even if it contradicts their substantive outlooks. We are suspending our moral theories to save the foundation. This is a practical compromise, not a moral truth.

  **2. It Cannot Resolve Incommensurable Veto Conflicts**
  If Family B says "Project X is a Rights Violation" (Veto) and Family A says "Project X prevents a Catastrophe" (Maximize), the procedure escalates to the Board. It cannot solve this. It merely identifies it. This is correct: a committee of four cannot resolve a clash between "Do not kill" and "Save the world." That is a values question for the donors/board.

  **3. It Cannot Prevent Credence Drift**
  The procedure locks in weights for the round. If next quarter the committee shifts to 60% Aggregative, the portfolio shifts. This creates inconsistency over time (last year's grants don't match this year's logic). The procedure accepts this as the cost of honesty. We are not building a consistent moral legacy; we are managing current moral uncertainty.

  **4. It Cannot Satisfy Everyone**
  As required, the outcome leaves residue. The Aggregativists lose the Speculative Grant and part of the Disease Grant. The Long-termists lose everything. The Constraints purists might object to "funding rights" with only 33% of the budget rather than 100%. This dissatisfaction is a feature, not a bug. It proves we are not hiding the trade-offs behind a technical calculation.

  **Summary:**
  Run the **Moral Risk Portfolio**. Partition the budget by credence. Cap the long shots. Tax for knowledge. Escalate the vetoes. Tell the Board you are managing risk, not maximizing good. It will not make the committee happy, but it will let them sleep.
