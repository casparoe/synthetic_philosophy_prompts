prompt: |-
  Take the UK Animal Welfare (Sentience) Act from 2022 — specifically the bit where decapods and cephlapods got added to the sentience list but insects stayed out — and run it through the scale argument for insect sentience. I want a disciplined mapping, not a rant: who had standing to decide (DEFRA, the LSE review authors), what implicit probability of consciousness they seem to assign bees versus crabs, and how the sheer biomass of farmed insects — trillions versus a few million — interacts with that low probability in any honest welfare calcualtion. Don't just tell me they ignored scale; tell me whether the Act reveals policymakers running a hidden threshold model of moral status, and whether the scale argument collapses that threshold or just exposes it as arbitrary. Then say where the argument breaks: is there a feature of legislative drafting — say, that welfare rules need an identifiable duty-bearer and a clear, enforceable harm — that the scale argument simply can't address? And does this episode show the argument was never meant for lawmaking, or that lawmaking is structurally bad at expected-value reasoning across species? Write it all as one continuous piece of prose, like a letter, no headings, no bullet points, no bold, no tables. Lead with the bottom line in the first sentence or two. Don't cite anyone, don't give me a reading list, and don't quote texts — I want your own reasoning.
