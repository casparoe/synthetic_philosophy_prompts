answer: |-
  The 2022 Act ultimately demonstrates that legal systems prioritize administrative enforceability over expected-value ethics, effectively instituting a hard threshold of moral status that the scale argument exposes as arbitrary but cannot legally dismantle. When you look at who actually held the pen, it was the government department responsible for environment and food relying on the interpretation of evidence provided by independent reviewers, and their decision reveals a specific, unspoken calculus about risk and proof. By including decapods and cephalopods while excluding insects, these decision-makers implicitly assigned a probability of consciousness to crabs that crossed a specific confidence threshold while assigning a probability to bees that fell just short of it, treating sentience as a binary switch for the purposes of statute rather than a gradient of experience. This binary approach ignores the core insight of the scale argument, which posits that moral weight should be calculated by multiplying the probability of sentience by the number of individuals and the intensity of their potential suffering. Even if you grant that a single bee is far less likely to be sentient than a single crab, the sheer biomass of farmed insects involves trillions of lives compared to the mere millions of crustaceans, meaning the expected aggregate suffering of insects could vastly outweigh that of crabs even at a low probability of consciousness.

  The Act reveals that policymakers are running a hidden threshold model of moral status where an animal must clear a bar of evidentiary certainty before it gains any standing at all, rather than weighing the expected value of protection across the board. The scale argument successfully exposes this threshold as morally arbitrary because it shows that excluding a vast number of potentially sentient beings based on a slight deficit in scientific confidence results in greater total harm than including them, yet the argument fails to collapse the threshold because the law requires categorical clarity to function. Legal frameworks are built on the premise of identifiable duty-bearers and enforceable harms, and this is precisely where the scale argument breaks down when applied to legislation. It is feasible to regulate the welfare of a few million crabs in a supply chain because you can identify the farmer, the transporter, and the slaughterer, and you can inspect their methods without halting commerce, but imposing welfare duties on the treatment of trillions of insects creates a monitoring crisis where the cost of enforcement dwarfs the capacity of the state.

  There is no single entity easily held liable for the suffering of wild insects or even farmed ones when the individual units are so small and numerous that harm becomes invisible to regulatory inspection, making the duty-bearer diffuse and the harm unquantifiable in a court of law. This episode suggests that the scale argument was never meant for lawmaking in its current form, or rather, that lawmaking is structurally bad at expected-value reasoning across species because it relies on bright-line rules to maintain order. The legal system cannot operate on probabilistic moral weights without dissolving into paralysis, so it defaults to a conservative threshold that minimizes regulatory risk rather than minimizing global suffering. Consequently, the exclusion of insects is not necessarily a denial of their potential capacity for pain, but an admission that the machinery of the state cannot grind fine enough to protect them, leaving the scale argument as a powerful ethical critique that remains structurally incompatible with the binary nature of statutory duty.
