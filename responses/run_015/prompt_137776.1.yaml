answer: |-
  **Project Title:** The Continuity of Subjecthood: Resolving the Exclusion Instability in Integrated Information Theory

  **Project Summary**
  Integrated Information Theory (IIT) is currently one of the leading mathematical frameworks for consciousness. Its core machinery identifies a conscious subject with the subset of elements that maximises integrated information ($\Phi$), subject to an "Exclusion Postulate" that rules out overlapping or nested subjects. While much philosophical attention has focused on IIT's panpsychist implications or empirical falsifiability, a structural fragility remains in the exclusion mechanism itself. When two high-$\Phi$ systems are gradually coupled, the theory currently dictates a discontinuous jump in ontological status: two subjects abruptly become one. Near this crossover point, microscopic noise can cause the identity of the subject to flicker rapidly. This project proposes that this instability is a *reductio ad absurdum* of the hard exclusion postulate. I will develop and analyse a "Soft Exclusion" modification, replacing the hard argmax with a graded selection rule. The goal is to determine whether a continuous account of subjecthood is mathematically coherent within IIT's axioms and whether it resolves the instability without introducing ad hoc parameters. The deliverable is a 8,000–10,000-word paper for the Spring Workshop on the Metaphysics of Mind, co-authored with my PhD student.

  **Research Question**
  *Can a graded exclusion principle resolve the ontological instability of composite systems in IIT without violating the theory's axiomatic foundation?*

  This question has a determinate answer. Either a graded formalism can be constructed that (a) preserves the core causal definitions of IIT, (b) eliminates the discontinuous jump in subjecthood during system coupling, and (c) avoids collapsing back into a hard maximum under scrutiny; or it cannot.

  **Background and Significance**
  IIT's Exclusion Postulate states that only the complex of elements specifying the maximum $\Phi$ exists as a subject. Supersets, subsets, and overlapping sets are excluded. This is intended to ensure the definiteness of experience (the "unity" of consciousness). However, this creates a boundary problem. Consider two systems, $A$ and $B$, each with high $\Phi$. Introduce a coupling parameter $c$ ranging from 0 (isolated) to 1 (fused). As $c$ increases, $\Phi(A \cup B)$ rises. At some critical $c^*$, $\Phi(A \cup B)$ overtakes $\Phi(A) + \Phi(B)$.

  Under the standard formulation, the ontology flips discontinuously at $c^*$. Below $c^*$, there are two subjects; above $c^*$, there is one. In the immediate vicinity of $c^*$, thermal or computational noise can cause the argmax to flip-flop between the parts and the whole. This implies that what *exists* as a subject is metastable, flickering in and out of existence on millisecond timescales despite macroscopic stability in the physical substrate.

  This is distinct from the "Combination Problem" (how do micro-subjects combine into macro-subjects?). The Combination Problem assumes the subjects exist and asks how they relate. The Exclusion Instability asks *which* subjects exist at all. It is also distinct from the "Hard Problem." I am not asking why $\Phi$ yields experience; I am accepting IIT's machinery for the sake of argument and asking if its internal selection rules are structurally sound.

  Current literature treats the Exclusion Postulate as a binary switch. My neuroscientific colleague argues this is empirically empty (we cannot measure the flicker), and my ML colleague suggests soft-max is merely a computational trick. I argue it is a metaphysical necessity. If consciousness is a natural phenomenon, its substrate conditions should not be infinitely sensitive to microscopic noise. A theory that predicts ontological flickering in a stable macroscopic coupling scenario is structurally unstable.

  **Methodology and Work Plan**
  This is a conceptual and formal project requiring no new empirical data or large-scale simulations. The work involves formalising the instability proof, constructing the alternative, and testing it against IIT's axioms (Intrinsicality, Information, Integration, Exclusion).

  *Month 1: Formalising the Instability.*
  I will work with my PhD student to rigorously define the "coupling ramp" scenario. We will derive the conditions under which the argmax flips. We will quantify the "flicker rate" as a function of noise amplitude near the crossover. The goal is to produce a lemma demonstrating that for any hard argmax rule, there exists a coupling region where subject identity is arbitrarily unstable. This establishes the necessity of the intervention.

  *Month 2: Developing Soft Exclusion.*
  I will develop the graded alternative. Instead of $Subject = \text{argmax}_S \Phi(S)$, I will explore $P(Subject = S) \propto \exp(\Phi(S)/T)$. The philosophical heavy lifting here is interpreting $T$ (temperature) and the probability mass. Is $T$ a free parameter, or is it fixed by the system's intrinsic scale? I will argue that $T$ should be understood not as an empirical tuning knob, but as a measure of the *resolution* of the theory itself. I will test this formalism against the "definiteness" axiom: does graded existence violate the intuition that experience is unitary? I will argue that graded *causal autonomy* is compatible with unitary *phenomenology* if the phenomenology supervenes on the weighted sum rather than the peak.

  *Month 3: Synthesis and Writing.*
  I will draft the paper, focusing on the decision criteria between the hard and soft models. I will prepare the presentation for the Spring Workshop. The PhD student will review the formal derivations to ensure mathematical consistency.

  **Possible Conclusions**
  1.  **Soft Exclusion Succeeds:** The graded model eliminates the discontinuity and stabilises the subject against noise without violating IIT's core axioms. This suggests IIT 4.0+ should adopt a probabilistic ontology.
  2.  **Soft Exclusion Fails (Incoherence):** It turns out that "degrees of subjecthood" contradicts the Intrinsicality axiom. If existence is binary, a graded rule is category error.
  3.  **Soft Exclusion Fails (Triviality):** The graded model collapses back into a hard max when one demands that *experience* be definite, rendering the modification purely descriptive with no ontological bite.

  **Risk Assessment**
  The primary risk is that the "Soft Exclusion" proposal is merely a notational variant of the hard max. If the probability distribution must be thresholded to recover a definite experience (which seems required by the phenomenology of unity), the flickering problem returns at the thresholding stage. If I cannot show how a graded substrate yields a definite phenomenology without re-introducing a hard cut-off, the project fails to solve the instability.

  Secondly, the project risks generalising too much. If the instability arises in *any* theory that selects a maximum structure (e.g., certain accounts of biological individuality), the solution may lie outside IIT specifically. I must ensure the solution leverages IIT's specific definition of $\Phi$ (cause-effect repertoires) rather than generic optimisation theory.

  Finally, there is the risk that the flickering is not a bug but a feature. If I argue it is a *reductio*, but the IIT consortium argues it is a prediction (consciousness *does* flicker at boundaries), my proposal might be seen as attacking a straw man. I mitigate this by arguing that macroscopic stability is a precondition for any theory claiming to identify physical substrates of consciousness; a theory that makes subjecthood more fragile than the substrate itself is explanatorily deficient.

  **Stand on the Flickering Worry**
  I take the position that the flickering worry is a *reductio ad absurdum* of the hard exclusion postulate. A theory of consciousness must account for the stability of the self over time. If the ontological status of the subject depends on microscopic noise during a macroscopically stable coupling phase, the theory severs the link between the phenomenological scale and the physical scale. Embracing the flicker would imply that splitting and merging subjects is a rampant, high-frequency event in any complex network, rendering the concept of a "subject" too volatile to do any explanatory work. The project proceeds on the conviction that structural stability is a necessary condition for a viable theory of consciousness.
