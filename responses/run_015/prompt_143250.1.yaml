answer: |-
  Your intuitions align remarkably well with a refined version of Rudolf Carnap's distinction between **internal questions** (theoretical, cognitive, resolvable within a framework) and **external questions** (practical, non-cognitive, concerning the adoption of the framework itself).

  To provide the unified account you seek, we can formulate a principle I will call **Framework-Relativized Instrumentalism (FRI)**.

  ### The Principle: Framework-Relativized Instrumentalism (FRI)

  1.  **The Internal Realm (Science/Planning):** Once a linguistic or conceptual framework (including definitions of key terms like "welfare," "population," or "sediment") is adopted, questions regarding logical consistency and empirical fit within that framework are cognitive. They have truth values and are resolvable by observation and logic.
  2.  **The External Realm (Politics/Values):** Questions regarding the *adoption* of the framework itself are practical. They are not true or false but are more or less expedient, useful, or aligned with volitional attitudes. Value statements are not assertions of fact but expressions of preference or imperatives to adopt a specific framework.
  3.  **The Boundary:** Scientific planning ends where the definition of the framework's ultimate ends (the "objective function") is specified. It begins again when calculating the means to achieve those specified ends.

  ---

  ### Application to Your Original Verdicts (Cases 1–5)

  FRI captures your first five verdicts without requiring you to abandon any, provided we accept a specific nuance in Case 5.

  *   **Case 1 (Dam Sediment):** This is an **Internal** question. The framework (hydrology/physics) is already accepted. The dispute is about empirical facts within that framework. **Verdict: Consistent.**
  *   **Case 2 (Zoning Values):** This is an **External** question. The dispute is not about the effects (facts) but about the weighting of ultimate values (equality vs. property). This is a decision on which framework of prioritization to adopt. **Verdict: Consistent.**
  *   **Case 3 (Welfare Function):** This is the archetypal Carnapian distinction. The derivation is **Internal**; the adoption of the welfare function is **External**. **Verdict: Consistent.**
  *   **Case 4 (Monument):** Impact studies are **Internal** (empirical predictions). The decision to honor is **External** (expression of collective attitude/value). **Verdict: Consistent.**
  *   **Case 5 (Forecasting Models):** Here lies the only necessary refinement. FRI classifies "predictive fit" as Internal, but the choice between exponential vs. logistic models based on "simplicity" or "robustness" is an **External pragmatic decision**. You sensed this ("conventional choices... observation alone does not settle"). FRI validates this intuition: the *performance* of the model is empirical, but the *selection criteria* (simplicity) are practical conventions. **Verdict: Consistent, but requires acknowledging the model selection itself is a value-laden framework choice.**

  ---

  ### Application to Case 6: The Five-Year Plan (Cultural Norms)

  This is the tension point. FRI resolves your ambivalence by distinguishing between the *definition of welfare* and the *optimization of welfare*.

  **The Analysis:**
  If the government defines "welfare" strictly as "aggregate preference satisfaction" (a formal definition), and sociological data shows that "Traditional Family Structure X" maximizes this metric, then the prescription is an **Internal** theoretical claim ("If you want to maximize preferences, you must encourage Structure X").

  However, if the government defines "welfare" as "a society that adheres to Traditional Family Structure X," then the definition itself is an **External** value judgment.

  **The Verdict:**
  Your second instinct is correct: **Prescribing cultural norms is inherently value-laden *unless* those norms are merely instrumental to a previously agreed-upon, thin definition of welfare (like preference satisfaction).**

  Most comprehensive plans of this sort commit a category error. They smuggle an **External** value judgment (specific cultural norms are *constitutive* of the good life) into an **Internal** calculation (these norms *produce* the good life). FRI forces you to say:
  1.  The claim that "Norm X produces Stability" is scientific (Internal).
  2.  The claim that "Stability/Norm X is the goal" is political (External).
  3.  The government is illegitimately presenting (2) as if it were a consequence of (1).

  **Do you have to drop a verdict?** No, but you must sharpen Case 3. You must acknowledge that if the "welfare framework" in Case 3 includes thick cultural concepts, its adoption is *more* political than if it includes only thin concepts (like utility). FRI demands you expose the "cultural prescriptions" as part of the framework adoption, not the internal derivation.

  ---

  ### Application to Case 7: The City Council (Direct Democracy)

  **The Scenario:** A council rejects quantitative modeling, insisting framework choice is irreducibly political.

  **The FRI Analysis:**
  1.  **On Framework Choice:** The Council is **Correct**. Under FRI, the choice of a welfare framework (or the decision to use quantitative modeling at all) is an External, practical, political decision. Science cannot dictate that we *must* use utilitarian modeling rather than deontological voting.
  2.  **On Rejecting Modeling:** The Council is **Incorrect**. While the *choice* of framework is political, once a framework is chosen (even via direct vote), the *application* of that framework is technical. Rejecting modeling because values are political is a non-sequitur. It confuses the External decision (what do we want?) with the Internal decision (how do we get it?).

  **The Verdict:**
  FRI supports the Council's *premise* (planning is political at the foundational level) but rejects their *conclusion* (therefore, technical planning is invalid). A coherent FRI approach would say: "Vote democratically on the welfare framework (External), then hire the planners to maximize that framework scientifically (Internal)."

  ---

  ### Competing Principle: The Simple Fact-Value Dichotomy

  You asked if there is a simpler competing principle. The obvious candidate is the **Humean Guillotine** (the strict separation of "Is" and "Ought").

  *   **The Principle:** Statements of fact (Is) are scientific; statements of value (Ought) are not.
  *   **Pros:** It is simpler and intuitively captures Cases 1, 2, and 4 immediately.
  *   **Cons:** It fails to capture the nuance of Cases 3 and 5.
      *   **Case 3:** The Humean view struggles to explain why the *derivation* within the welfare function is "scientific." It looks like an "Ought" (optimal allocation) derived from an "Ought" (welfare function). Carnap's Internal/External distinction explains this better: it is a hypothetical imperative ("*If* you want W, do A"), which is theoretically truth-apt.
      *   **Case 5:** The Humean view forces a binary: either model choice is fact or value. It cannot easily accommodate the "pragmatic/conventional" middle ground that Carnap allows (External questions are not "true," but they are not merely "emotive"; they are pragmatic decisions).

  **Cost of Simplicity:**
  If you adopt the simple Fact-Value Dichotomy, you lose the ability to validate the *rationality* of planning within a framework. You would have to treat the "optimal resource allocation" in Case 3 as just another value judgment, rendering technical planning indistinguishable from political ideology. To save your verdict on Case 3 (that the derivation *is* rational/scientific), you must accept the added complexity of Carnap's **Internal/External** distinction over the simple **Fact/Value** distinction.

  ### Summary of Necessary Adjustments

  To maintain consistency under **Framework-Relativized Instrumentalism**:

  1.  **Keep Verdicts 1–4:** They stand firm.
  2.  **Refine Verdict 5:** Explicitly categorize the choice of forecasting methodology (simplicity/robustness) as an **External/Practical** decision, even if the model's fit is Internal.
  3.  **Resolve Case 6:** You must reject the government's claim that cultural prescriptions are purely scientific. You must classify the *definition of welfare* that includes specific cultural norms as an **External value judgment**. The planning is only scientific relative to a thin, agreed-upon definition of welfare.
  4.  **Resolve Case 7:** You must accept the Council's claim that framework choice is political but reject their inference that technical modeling is therefore useless.

  **Final Conclusion:**
  Your intuitions are coherent. They map precisely onto a Carnapian view where **science is the engine, but politics is the steering wheel.** The error in social planning (Case 6) occurs when the engineers claim they have built a self-steering car. The error in anti-planning (Case 7) occurs when the drivers refuse to use the engine because they had to choose the destination themselves.
