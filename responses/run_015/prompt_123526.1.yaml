answer: |-
  **Setup**
  Two jars (A/B) filled with beans (counts: 342, 789). 16 students. Materials: Colored cards (8 Red, 8 Blue), Envelopes (16 per round), Score sheets.
  **Impairment:** Red cards have a subtle anchor printed ("Is it >500?"); Blue are blank. Students don't know colors differ.
  **HOE:** Envelopes contain "Reliability Report" (Randomized per round: "Group Accuracy: High" or "Low").
  **Confederate:** Distributes cards/envelopes silently.

  **Rules**
  1.  **Observe:** View assigned Jar for 30s.
  2.  **Report:** Open Envelope. Read Reliability (High/Low).
  3.  **Action:** Submit **Estimate** (0-1000).
  4.  **Meta:** Submit **Confidence** (0-100%).
  5.  **Re-open:** Optional. Pay **Fee** (varies by round) to receive true range (±50).
  6.  **Bracket:** Optional. Mark estimate "Quarantined." Scores 0 Accuracy Points, but maximizes Calibration Points if Reliability Report was "Low."
  7.  **Scoring:** Two separate leaderboards. No exchange.
      *   **Accuracy Points (AP):** 100 – |Estimate – Actual|.
      *   **Calibration Points (CP):** 100 – |Confidence – Correctness| (Correctness = 1 if within 50 beans, 0 else).
  8.  **Win:** Top 3 on *both* leaderboards.

  **Payoff Table**
  | Action | Cost | AP Potential | CP Potential |
  | :--- | :--- | :--- | :--- |
  | **Standard** | 0 | High | Depends on Confidence |
  | **Re-open** | Fee | Very High | Depends on Confidence |
  | **Bracket** | 0 | **Zero** | **Max (if Report=Low)** |

  **Timeline (75 mins)**
  *   **0-5:** Distribute cards/envelopes. No explanation of colors.
  *   **5-25 (Round 1):** Jar A. **Re-open Fee: 10 AP.** Reliability: Low. (Tests *Re-open*: Cheap cost should dissolve bind).
  *   **25-45 (Round 2):** Jar B. **Re-open Fee: 300 AP.** Reliability: Low. (Tests *Fold/Bracket*: Re-open priced out; Bracket costs Action).
  *   **45-55 (Round 3):** Jar A again. **No Re-open.** Reliability: Mixed (Half High, Half Low). (Tests *Akrasia*: Must submit Estimate for AP despite Low Report/Low Confidence).
  *   **55-75:** Debrief.

  **Debrief**
  Reveal mechanics (Red/Blue cards, Reliability randomization).
  **(a) The Three Routes:**
  *   **Re-open:** Round 1. Bind dissolved because investigation was cheap. If you didn't re-open here, you paid for akrasia unnecessarily.
  *   **Bracket:** Round 2. Re-open was too expensive. Bracketing saved CP but cost AP (action). You felt the bind because resources were exhausted.
  *   **Fold:** Round 3. You likely adjusted estimates toward the mean (calibration) but still submitted them (action).
  **(b) Calibration vs. Akrasia:**
  Round 3 forces the split: To win AP, you must act. To win CP, you must admit unreliability. Winning both requires **Epistemic Akrasia** (acting on p while believing you shouldn't trust p). The game separates the *norm* (confidence) from the *goal* (accuracy).
  **(c) Irrationality vs. Luck:**
  Round 2 losers weren't irrational; the "Re-open" price made rationality expensive. Akrasia appears when the cost of resolving uncertainty exceeds the cost of holding conflicting states.

  **Predictable Failures & Fixes**
  *   **Failure:** Students ignore CP to max AP (stubbornness).
      *   **Fix:** Enforce "Dual Winner" rule strictly. Announce mid-game that no one leads both yet.
  *   **Failure:** Performative confusion (pretending to be torn).
      *   **Fix:** Collect sheets anonymously. Discuss aggregate data (e.g., "80% of Red cards submitted high confidence despite Low Report").
  *   **Limitation:** The game models **strategic trade-offs**, not **phenomenological compulsion**. Students choose akrasia; real subjects feel trapped. You must lecture that the game proves akrasia is *rational under constraints*, not that it feels good. The "bind" here is economic; the real philosophical problem is whether the bind is *logical*.
