      *   **3 vs. 4:** (Political content contingent/reconfigurable) vs. (Hierarchy structurally necessary for stable operation). *High Tension.* Statement 3 says governance can "partially reconfigure its political effects" even after closure. Statement 4 says for some tech, hierarchy is "structurally necessary for stable operation." If hierarchy is necessary for *operation*, can governance reconfigure the political effect away from hierarchy without breaking the tech? If yes, #4 is false. If no, #3 is overstated.
