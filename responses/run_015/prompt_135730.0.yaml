      *   **The "Wobble":** Replication is *doing* (making a copy). Gödel is *saying* (making a claim). They are structurally identical (isomorphic) but functionally different.
      *   **The "Ballgame":** Passive copying (enzyme exists anyway) vs. Active self-replication (strand codes for the enzyme that copies it).

