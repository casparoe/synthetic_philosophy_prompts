answer: |-
  You're right to press on whether the uniqueness of phenomenal concepts is merely asserted or independently motivated. The independent reason lies in the constitutive nature of phenomenal attention. When I form a concept like 'pain' or 'seeing red,' I am not identifying a property via contingent descriptions—like 'the state caused by damage' or 'the state causing wincing'—which could conceivably pick out something else in a different world. Instead, the phenomenal concept is constituted by the very experience it refers to; the property itself serves as the mode of presentation. This is an epistemic datum that even many physicalists accept: phenomenal concepts are direct, non-descriptive, and involve a form of acquaintance where the appearance of the property is indistinguishable from its reality. There is no 'hidden essence' behind the feeling because the feeling *is* the essence we are grasping. If there were a gap between the phenomenal concept and the phenomenal property akin to the water/H₂O gap, we would need a contingent mode of presentation to bridge it, but no such mode exists in the first-person case.

  So the zombie case isn't another Watergate because the Kripkean explanation for the water case relies on a divergence between primary and secondary intensions driven by contingent identification. In the consciousness case, the primary intension (what satisfies the concept in a given world) and the secondary intension (what the concept rigidly designates) converge because the concept picks out its referent directly via its intrinsic nature. If I can conceive of a physical duplicate without this intrinsic nature, I am not merely conceiving of a different mode of presentation; I am conceiving of the absence of the property itself. The burden shifts to you to explain how a concept can be constituted by a property yet fail to track that property metaphysically, without reintroducing the very descriptive gap that phenomenal attention eliminates.

  [Confidence: High on the general Chalmersian framework being deployed here. Least sure point: Whether claiming the property serves as its own mode of presentation fully satisfies the demand for an "independent reason" without sounding like a restatement of the dualist intuition to a skeptic who denies the constitutive view of phenomenal concepts.]
