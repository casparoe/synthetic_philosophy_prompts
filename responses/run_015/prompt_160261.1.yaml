prompt: |-
  You are a philosopher of language who has also done descriptive fieldwork on a language with no written tradition, and who is used to explaining technical disputes to non-specialists without cheating. Think carefully and at length. Before you write anything final, spend a few hundred words of private brainstorming: sketch every candidate requirement you can think of for the theory I describe below, argue with yourself about each, and discard the ones that are really just preferences of one school. Then commit to the list that survives, and say plainly which candidates you threw out and why.

  The setting. I am a journalist working on a long feature about translation — human and machine — and about the claim, which I keep encountering in one form or another, that a system which renders a sentence of one language into another has or has not got what the speaker was talking about right. The classic version of this worry is Quine's field linguist, who hears a word — gavagai — in the presence of a rabbit and cannot settle whether the speakers mean rabbit, undetached rabbit part, rabbit stage, or rabbithood. I have read the popular versions of that argument and I do not need another summary of it. What I want instead is the specification: what a theory of what it takes to fix what a speaker's words are about would have to deliver in order to be adequate.

  Fix the adequacy to a purpose, because I think that is where these arguments go wrong. I want a theory good enough for this job: to let an outsider — me, a skeptical reviewer, an auditor of a translation system — decide and defend in public whether a given rendering has pinned down what the speaker was talking about, and to say what would count as evidence for or against it. If the honest answer is that the question has no determinate answer, that is a finding I can use, but only if the theory tells me why it is a finding rather than a shrug, and what I should say instead.

  Here are the situations I want the theory to be tested against. Some are invented; treat them as data, and add your own if a requirement needs one.

  One. A field linguist finds two words where Quine found one. The first is used of a live rabbit, not of a rabbit carcass and not of a rabbit seen at dusk. The second is used of a live rabbit, of a severed rabbit foot, and of rabbit stew, but not of a rabbit-shaped decoy. Is either of them the word for rabbit, if either is? A theory that must choose between them, and one that must be permitted to refuse, are very different theories, and I want to know what forces the choice.

  Two. The speakers assent to the word when an older man points at a rabbit and withhold assent when a younger person does, even though both are plainly looking at the same animal. The linguist cannot tell whether this is a fact about what the word means, a fact about who is allowed to speak about rabbits, or a fact about whom these people defer to. Can a theory separate meaning from the social practice of deference if all it has to go on is behavior, or must the manual absorb the deference into the meaning?

  Three. Coordination works perfectly in the middle of the range and falls apart at the edges. The linguist and a speaker hunt together successfully for months on the strength of one word; then the linguist points at a rabbit-shaped rock, then at a rabbit at dusk, and the assent pattern becomes noise. Which range is the theory answerable to — the practical core, or the boundary cases, or both?

  Four. The case that matters most for my piece, and the one I have not seen handled: there is no field linguist at all. No pointing, no shared environment, no assent behavior, no questions asked and answered. There is only a large corpus of text in the source language paired with text in the target language — this is roughly the situation of a machine translation system. State what, if anything, a theory must say about whether reference can be fixed in that setting, and what the difference is between the corpus-only setting and the field setting.

  Five. Evidence that is downstream of the theory itself. A second linguist produces a manual that pairs the word with undetached rabbit part; the two manuals agree on every sentence anyone has tested and disagree on what the word is about. Years later some speakers learn enough of the linguist's language to be asked which they meant — but they learned the relevant word from the first linguist's own translations. Is their answer independent evidence, or is it contaminated by the manual used to teach them? I want a requirement about what counts as independent evidence here.

  Six. The speakers say things that are, on the most natural rendering, straightforwardly false — that a crop failed because the ancestors were angered. A theory under pressure to make speakers come out right about most things will have to say something about error, disagreement and false belief, or it will make them unfalsifiable.

  Seven. Symmetry. Whatever the theory says must apply to the linguist's own language; it may not grant determinacy to English while denying it to the language under study.

  The deliverable. Give me the requirements list: what an adequate theory must be able to do — the cases it must get right, the distinctions it must not collapse, the results it must be consistent with — with the case or consideration behind each one. For each, mark whether it is non-negotiable, whether it is negotiable, or whether you suspect it is a prejudice of one camp that has smuggled itself in as a requirement. Distinguish, where it matters, between not knowing which manual is correct and there being no fact of the matter, and say how anyone could tell the difference. Say also whether the theory must be able to state its own conclusion in the vocabulary whose determinacy it is calling into question.

  Then the two things I care most about. First: is any subset of these requirements jointly unsatisfiable? If the list itself forces a result — if, say, a behavioral-evidence constraint and a determinate-reference constraint cannot both hold — say so explicitly and show the argument; that is the part of the piece I most want to get right. Second: which single requirement does the most work in excluding otherwise attractive theories?

  Only at the end, and briefly: in prose or a small table, score against your list the four broad families of answer — a charity-and-truth-conditions style account, a causal or informational account of how terms get hooked to things, an inferential-role or use-theoretic account, and the deflationary view that the puzzle is a pseudo-problem. One or two lines each is plenty; keep the weight on the criteria. Define any term of art a general reader would trip over, and do not give me a bibliography, a reading list, or citations — I am not going to chase references, and a theory that only works when footnoted is not one I can use.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of language with fieldwork experience (descriptive, unwritten language), skilled at explaining technical disputes to non-specialists without cheating.
      *   **Task:**
          1.  Private brainstorming (few hundred words): Sketch candidate requirements, argue/discarded preferences, commit to the survivors.
          2.  Main Deliverable: A list of requirements for a theory of reference/translation adequacy (specifically for the journalist's purpose: deciding/defending if a rendering pinned down what the speaker was talking about).
          3.  Address specific test cases (Seven situations provided).
          4.  Mark requirements as Non-negotiable, Negotiable, or Prejudice.
          5.  Distinguish "no fact of the matter" vs. "don't know."
          6.  Address self-application (Symmetry).
          7.  Identify incompatibilities (jointly unsatisfiable subsets).
          8.  Identify the single most exclusionary requirement.
          9.  Score four broad families of theory (Charity/Truth, Causal/Informational, Inferential/Use, Deflationary) against the list.
      *   **Constraints:** No bibliography/citations. Define terms. Think carefully and at length. Be honest about indeterminacy if that's the finding.

  2.  **Private Brainstorming (Mental Draft):**
      *   *Goal:* What makes a theory of reference adequate for a journalist/auditor?
      *   *Candidate 1: Behavioral Verification.* Must rely on observable behavior (assent/dissent). *Critique:* Too behaviorist? Ignores internal states? But for an *auditor*, only behavior is public. Keep as evidential constraint, not ontological.
      *   *Candidate 2: Determinacy.* Must say yes/no to "is this rabbit?" *Critique:* Quine says no. If the theory forces yes, it's lying. Must allow "indeterminate" as a valid output.
      *   *Candidate 3: Symmetry.* Must apply to English too. *Critique:* Essential. No magic for home language. Non-negotiable.
      *   *Candidate 4: Error Possibility.* Must allow speakers to be wrong. *Critique:* Principle of Charity risks making them infallible. Non-negotiable for realism.
      *   *Candidate 5: Social/Deference Distinction.* Must separate meaning from who has authority. *Critique:* Hard without internal access. Maybe negotiable? If deference is constitutive of meaning (Burge), then can't separate. But for translation *utility*, maybe need not separate. Let's lean towards requiring the theory to *acknowledge* the ambiguity rather than force a split.
      *   *Candidate 6: Corpus vs. Field.* Must handle text-only (MT) vs. interaction. *Critique:* Field fixes reference better (causal links). Theory must explain the deficit in corpus-only.
      *   *Candidate 7: Independence of Evidence.* Later speaker testimony must be checked for contamination. *Critique:* Epistemic requirement. Non-negotiable for audit.
      *   *Candidate 8: Core vs. Edge.* Must handle boundary cases (dusk rabbits). *Critique:* Vagueness is real. Theory shouldn't force precision where none exists.
      *   *Discarded:* "Must privilege the speaker's intuition." (They might be confused/contaminated). "Must produce a single correct manual." (Quine's point). "Must explain consciousness." (Irrelevant to translation audit).
      *   *Refinement:* The core tension is between *Determinacy of Reference* (we want to know what they meant) and *Underdetermination by Evidence* (behavior doesn't fix it). The theory must navigate this without pretending the evidence is richer than it is.

  3.  **Drafting the Requirements List:**
      *   Need to structure this clearly.
      *   Requirement 1: Public Verifiability (Evidence).
      *   Requirement 2: Symmetry (No home-language privilege).
      *   Requirement 3: Accommodation of Indeterminacy (Distinguish 'unknown' from 'unsettled').
      *   Requirement 4: Error Capacity (Charity limit).
      *   Requirement 5: Context Sensitivity (Core vs. Edge).
      *   Requirement 6: Social/Deference Transparency.
      *   Requirement 7: Corpus Deficit Acknowledgement.
      *   Requirement 8: Non-Circularity (Evidence independence).

  4.  **Addressing the "Two Things I Care Most About":**
      *   *Incompatibility:* The demand for Determinate Reference vs. the demand for Strict Behavioral Evidence. If you only have behavior (Quine's constraint), you often *cannot* get determinate reference (Gavagai). So, a theory demanding both is broken. The journalist needs to know this trade-off.
      *   *Most Exclusionary Requirement:* Probably Symmetry or Error Capacity. Charity-based theories often fail Symmetry (implicitly treating home language as fixed). Causal theories struggle with Corpus-only. Deflationary struggles with the journalist's need for a yes/no answer. Actually, *Accommodation of Indeterminacy* is the big killer for standard realist intuitions.

  5.  **Scoring the Families:**
      *   *Charity/Truth:* Good on error, bad on indeterminacy (forces resolution).
      *   *Causal:* Good on reference fixing, bad on corpus-only (no causal chain in text).
      *   *Inferential/Use:* Good on behavior, bad on determinacy (meaning is use, reference drops out).
      *   *Deflationary:* Good on symmetry/indeterminacy, bad on utility (tells journalist "nothing to fix").

  6.  **Refining the Voice:**
      *   Needs to be authoritative but accessible. No jargon without definition.
      *   Acknowledge the fieldwork experience (the messiness of real data).
      *   Ensure the "Private Brainstorming" section is distinct and meets the word count/constraint.

  7.  **Review against Constraints:**
      *   Private brainstorming first? Yes.
      *   List of requirements with markings (Non-negotiable/Negotiable/Prejudice)? Yes.
      *   Address the 7 cases within the requirements or as commentary? The prompt asks for the requirements list *with the case or consideration behind each one*.
      *   Distinguish 'no fact' vs 'don't know'? Yes.
      *   Self-application question? Yes.
      *   Incompatibility analysis? Yes.
      *   Single most exclusionary requirement? Yes.
      *   Score the 4 families? Yes.
      *   No citations? Yes.

  8.  **Final Polish:**
      *   Check tone: Philosopher + Fieldworker.
      *   Check length: "Think carefully and at length."
      *   Ensure the distinction between *epistemic* (we don't know) and *ontic* (there is no fact) is clear. This is crucial for the journalist.

  *(Self-Correction during drafting)*: I need to make sure I don't just summarize Quine. The journalist knows Quine. They want the *specification* for a theory that solves (or dissolves) the problem for an auditor. The requirements must be practical for an *audit*.
  *Correction on Brainstorming:* Keep it tight. Focus on the tension between "wanting an answer" and "evidence not supporting an answer."
  *Correction on Cases:* Ensure each of the 7 scenarios is mapped to a requirement.
  *Correction on Incompatibility:* Be bold. If Behavioral Evidence + Determinate Reference is impossible, say so. That's the story.

  Let's write.
answer: |-
  ### Private Brainstorming

  I need to build a spec sheet for a theory of reference that works for an auditor, not just a metaphysician. My fieldwork experience tells me that real data is messy; speakers contradict themselves, contexts shift, and "meaning" is often a pragmatic compromise rather than a logical lock.

  *Candidate 1: Behavioral Sufficiency.* The theory must rely only on public evidence (speech, gesture, assent). *Argument:* Essential for an auditor who wasn't there. *Counter:* Ignores internal intent. *Verdict:* Keep as an evidential constraint, not an ontological one. The theory must say what behavior *warrants*, not what behavior *exhausts*.
  *Candidate 2: Determinacy.* The theory must yield a yes/no on "is this translation correct?" *Argument:* The journalist needs a headline. *Counter:* Quine shows evidence often underdetermines this. Forcing yes/no is lying. *Verdict:* Reject as a hard requirement. Replace with "Must distinguish indeterminacy from ignorance."
  *Candidate 3: Symmetry.* No special status for English. *Argument:* Prevents ethnocentric cheating. *Verdict:* Non-negotiable.
  *Candidate 4: Error Allowance.* Speakers must be able to be wrong. *Argument:* Otherwise, we can't distinguish meaning from belief. *Verdict:* Non-negotiable.
  *Candidate 5: Social/Deference Split.* Must separate "what word means" from "who decides." *Argument:* Case Two shows this is behaviorally invisible. *Verdict:* Negotiable. The theory might just have to flag the entanglement rather than solve it.
  *Candidate 6: Corpus Limitation.* Must acknowledge text-only lacks causal grounding. *Verdict:* Non-negotiable for machine translation audits.
  *Candidate 7: Contamination Check.* Later testimony isn't independent if learned via translation. *Verdict:* Non-negotiable epistemic rule.

  *Discarded:* "Must privilege speaker intuition." (Speakers are often wrong about their own usage). "Must resolve boundary cases." (Vagueness is a feature, not a bug). "Must be computable." (Nice for MT, but not for philosophical adequacy).

  *Core Tension:* The journalist wants to know if the reference is *fixed*. The evidence (behavior/corpus) often shows it is *not*. A theory that promises fixing when evidence doesn't support it is fraudulent. A theory that says "nothing is fixed" is useless for translation. The adequate theory must navigate this by defining the *conditions* under which fixing is warranted versus when it is stipulated.

  ***

  ### Requirements for an Adequate Theory of Reference and Translation

  As a fieldworker who has sat in the dust trying to match words to worlds, and as a philosopher who knows the traps of abstract theory, I offer the following specification. You asked for a tool to audit a translation claim. Below are the requirements such a theory must meet to be honest and usable.

  I have marked each requirement as **Non-Negotiable** (the theory fails without it), **Negotiable** (useful but perhaps adaptable), or **Prejudice** (a philosophical bias disguised as a requirement).

  #### 1. The Public Evidence Constraint
  **Requirement:** The theory must specify what observable behaviors (assent, dissent, gesture, usage patterns) count as evidence for a reference claim, and it must not posit hidden mental states that are permanently inaccessible to the auditor.
  **Case:** All field cases, but specifically **Case Four (Corpus-only)**.
  **Status:** **Non-Negotiable.**
  **Reasoning:** You are an auditor. You cannot read minds. If a theory says "The speaker meant *rabbit* because of an internal causal chain," but offers no way for you to verify that chain without telepathy, it is useless for your job. In the corpus-only setting (Machine Translation), this requirement forces the theory to admit that causal links to the world are missing. A theory that claims reference is fixed in a text-only environment must explain *how* without pointing to physical objects that aren't there.

  #### 2. The Symmetry Principle
  **Requirement:** The criteria used to fix reference in the target language must apply equally to the auditor's own language. The theory cannot grant determinacy to English words while denying it to the field language words.
  **Case:** **Case Seven (Symmetry).**
  **Status:** **Non-Negotiable.**
  **Reasoning:** This prevents "philosophical cheating." It is tempting to say, "I know what *I* mean by 'rabbit', so I can judge if they mean 'rabbit'." But if the evidence available for their word (behavior, context) is insufficient to fix reference, the evidence for your word is technically the same. If the theory says their reference is indeterminate but yours is fixed, it must explain the difference without appealing to "because I'm speaking English."

  #### 3. The Indeterminacy Distinction
  **Requirement:** The theory must distinguish between *epistemic uncertainty* (there is a fact, but we lack evidence) and *ontic indeterminacy* (there is no fact of the matter). It must provide criteria for telling the difference.
  **Case:** **Case One (Two words vs. Rabbit)** and **Case Five (Contaminated Evidence).**
  **Status:** **Non-Negotiable.**
  **Reasoning:** This is the core of your investigation. If two manuals agree on all sentences but disagree on reference (Case Five), is it because we haven't looked hard enough (epistemic), or because the language doesn't carve reality that way (ontic)? An adequate theory must tell you what *new evidence* would settle it. If no possible evidence could settle it, the theory must declare it indeterminate. If the theory forces a choice where no evidence decides, it is dogma, not analysis.

  #### 4. The Error Capacity (Charity Limit)
  **Requirement:** The theory must allow speakers to be systematically wrong about the world without rendering their words meaningless. It cannot maximize agreement between speaker and translator to the point where the speaker becomes infallible.
  **Case:** **Case Six (False Beliefs/Ancestors).**
  **Status:** **Non-Negotiable.**
  **Reasoning:** If you translate their words so that everything they say comes out true (e.g., translating "ancestors were angered" to "a气压 system collapsed" to save the truth), you haven't translated their meaning; you've corrected their physics. A theory that makes speakers unfalsifiable makes communication impossible. You need to know if they are talking about *ancestors* (and are wrong about the crop) or *pressure systems* (and are right).

  #### 5. The Core-Edge Tolerance
  **Requirement:** The theory must account for vagueness without demanding false precision. It must specify a "core" range of usage where reference is stable and a "boundary" range where it may be undefined, without treating the boundary failure as a total collapse of meaning.
  **Case:** **Case Three (Coordination at Edges).**
  **Status:** **Negotiable.**
  **Reasoning:** In the field, words work for hunting (core) but fail for rocks at dusk (edge). A theory that demands a sharp line for "rabbit" everywhere is fighting the data. However, for your audit, you might need a binary "pass/fail." I mark this negotiable because a theory could arguably say "reference is vague" as a determinate answer. But it must not say "reference failed" just because vagueness exists.

  #### 6. The Deference Transparency
  **Requirement:** If reference depends on social authority (who is allowed to speak), the theory must identify this dependency rather than absorbing it into the word's definition silently.
  **Case:** **Case Two (Older vs. Younger Speaker).**
  **Status:** **Negotiable.**
  **Reasoning:** It is often impossible to separate "meaning" from "social rule" using behavior alone. A strict theory might say "meaning *includes* deference." A looser one says "meaning is separate, but access is restricted." For your purpose, the requirement is that the theory must *flag* this ambiguity. It cannot simply assume the younger person means something different; it must report that the *conditions of assertion* differ.

  #### 7. The Independence of Verification
  **Requirement:** Evidence used to confirm a translation manual must be independent of the manual itself. Testimony from speakers trained via the manual is contaminated.
  **Case:** **Case Five (Downstream Evidence).**
  **Status:** **Non-Negotiable.**
  **Reasoning:** This is basic audit hygiene. If you teach them English using your translation, then ask them "Did you mean rabbit?", they will say "Yes" because you taught them that equivalence. The theory must define what counts as an independent check (e.g., non-linguistic coordination, successful joint action) versus a circular linguistic check.

  #### 8. Self-Application Consistency
  **Requirement:** The theory must be able to state its own conclusions without relying on the determinacy it calls into question.
  **Case:** **All Cases.**
  **Status:** **Non-Negotiable.**
  **Reasoning:** If the theory says "Reference is indeterminate," it must be able to say that without relying on words whose reference is also indeterminate. It cannot use "rabbit" to prove "rabbit" is undefined unless it explains why *that* usage is privileged. This is a logical consistency check.

  ***

  ### The Two Critical Findings

  You asked for the tensions that matter most for your piece. Here they are.

  #### 1. The Joint Unsatisfiability of Strict Evidence and Determinate Reference
  There is a subset of requirements that cannot be satisfied simultaneously: **The Public Evidence Constraint** + **The Symmetry Principle** + **A Demand for Determinate Reference.**

  If you insist that reference must be fixed by public evidence (behavior, text) alone, and you insist that the rules apply equally to all languages, you *cannot* guarantee determinate reference in hard cases (like *gavagai*). The evidence simply does not rule out "undetached rabbit part" vs. "rabbit."
  *   **The Conflict:** If a theory promises you a definite "Yes, this means rabbit" based *only* on the evidence available to an auditor (behavior/corpus), it violates Symmetry (it secretly assumes English categories are fixed) or it violates Evidence (it posits hidden facts).
  *   **The Finding for Your Piece:** You must report that any translation system claiming perfect determinacy is either cheating (importing hidden assumptions) or lying. The honest answer in hard cases is "Indeterminate." A theory that forces a choice is not describing the language; it is imposing a grid upon it. The difference between "we don't know" and "there is no fact" is told by whether *more* evidence would help. If more behavior (pointing, questioning) still leaves multiple options open, there is no fact of the matter.

  #### 2. The Most Exclusionary Requirement
  The single requirement that excludes the most attractive theories is **The Error Capacity (Charity Limit).**

  Many theories want to make translation smooth. They argue we should interpret speakers so that most of what they say is true (Principle of Charity). This makes communication easy. But this requirement forbids that. It demands that a theory allow the speaker to be wrong about the world (e.g., about ancestors causing drought).
  *   **Why it excludes:** Causal theories often struggle here because if the speaker is wrong about the cause, the causal link to the real object is broken. Inferential theories struggle because if the inference is bad, the meaning collapses. Only a theory that separates *content* from *truth* survives. This is the hardest pill for machine translation systems to swallow, as they are optimized for plausible output, not necessarily for preserving the speaker's potential errors.

  ***

  ### Scoring the Four Families of Theory

  Here is how the major philosophical approaches score against the requirements above.

  | Theory Family | Score | Summary Verdict |
  | :--- | :--- | :--- |
  | **Charity & Truth-Conditions** | **Fail** | Fails **Error Capacity**. To make sense of speakers, it maximizes agreement, often forcing false beliefs to be reinterpreted as true ones. It struggles to admit the speaker might simply be wrong about the world. |
  | **Causal / Informational** | **Mixed** | Passes **Error Capacity** and **Symmetry**, but Fails **Public Evidence (Corpus)**. It requires a physical causal chain between object and word. In Machine Translation (Case Four), this chain is broken; the theory must declare reference undefined, which may be honest but useless for deployment. |
  | **Inferential / Use-Theoretic** | **Pass** | Passes **Public Evidence** and **Core-Edge Tolerance**. Meaning is just how the word is used. However, it often struggles with **Determinacy**; if use varies, reference varies. It handles indeterminacy well but may disappoint an auditor wanting a fixed "target." |
  | **Deflationary (Pseudo-Problem)** | **Pass** | Passes **Symmetry** and **Indeterminacy Distinction**. It argues "reference" isn't a deep relation to fix. However, it risks failing **Utility**. Telling an auditor "there is nothing to fix" is philosophically sound but practically frustrating for a journalist asking "Is this translation right?" |

  **Final Note for the Journalist:**
  If you need a theory that lets you defend a translation in public, the **Inferential/Use** account is your safest bet, provided you accept that "what they were talking about" is defined by how they use the word, not by a metaphysical hook to a rabbit. If you need a theory that guarantees the translation matches the *world*, you must admit that in hard cases, no such guarantee is possible without cheating. The honest audit report reads: "Coordination successful in core cases; reference indeterminate at boundaries; speaker error preserved."
