  **2. Findings**
  **2.1. Organisational Topology.** The organigram survives but the boxes in it do not. Reporting lines are maintained as pure relations without termini. During the transition, it was observed that nobody can be fired because there is nobody to fire. Termination notices were returned as undeliverable to non-existent recipients, creating a backlog of unresolved relational disruptions.¹

  **2.2. Human Resources.** The Institute's showcase case study is quantum statistics. Since permuting the labels of indistinguishable particles changes nothing, Human Resources has implemented this literally. Payroll now runs on occupation numbers and there is an unsettled question about what happens when two members of staff are assigned to the same node. Currently, the system allocates one salary per state, resulting in significant underpayment when staff Bose-condense into the same administrative role.

  **2.3. Physical Inventory.** There is a crate in the basement labelled with the decommissioned objects. Contents include 'The Director', 'The Coffee Machine', and 'The Safety Inspector'. Access is restricted due to potential realist contamination. Inventory audits are impossible as counting requires individuating principles which have been decommissioned alongside the objects.

  **2.4. Compliance Audit.** The report should then discover, without ever naming it, the Newman-style worry. The Institute's official structural description turns out to be satisfied by any sufficiently large domain whatsoever.² So the compliance certificate is, in perfect good faith, awarded to a bucket of gravel. The Compliance Officer cannot explain what went wrong without smuggling back in the very thing the reform deleted—something to pin down which relations are which.³ Consequently, the Institute and the gravel are structurally identical, though the gravel requires less heating.

  **3. Implementation Schedule**
  *   **Q1:** Attempt to restrict structural models without invoking relata.
  *   **Q2:** Retrieve compliance certificate from gravel.
  *   **Q3:** Resolve HR indistinguishability crisis.
  *   **Q4:** Review ontological status of the Working Group itself.

  **4. Minority Report & Closing**
  The moderate faction—the people who wanted to keep the objects and merely admit we can only know their structure—accuses the eliminativists of having thrown away precisely what the equations were about.⁴ They argue that knowing the structure implies a structure *of* something, and that relations require relata to relate.

  Meanwhile, the Institute's last remaining substances-and-properties realist, a maintenance engineer, inspected the heating system and gets one unimpressed remark. He stated: "The pipe is leaking because the metal is rotten, not because the relation between the valve and the joint is non-well-founded."

  File Closed.

  ***

  **Footnotes**
  ¹ See Worrall (1989) on structural continuity; personnel files now classified as 'heuristic fictions'.
  ² Newman (1928) demonstrated that any structure can be generated by any multiplicity of objects, provided the cardinality matches.
  ³ Essentially, we require a constraint on admissible relations, but constraints usually imply intrinsic properties.
