          *   *Legal:* Statutory interpretation often uses "plain meaning" over intent, but sometimes legislative history is key. This shows the tension is practical, not just theoretical. It suggests the middle ground is a *pragmatic compromise*, not a metaphysical truth.
      *   *Unfalsifiability:* This is the biggest risk. If every counter-example is defined away as "not architectonic" or "not recoverable," the theory is tautological. The definition of "recoverable" must be independent of the theory's needs.

