          *   *The "Unconscious Structure" Case:* If structuralist/psychoanalytic reading reveals a pattern *necessary* for the text to function aesthetically, but the author denies it. If the theory says "Author wins," does it ruin the art? If "Text wins," does it violate the intentionalist core?
          *   *The "Posthumous Revelation" Case:* A diary found 50 years later proves the text was a satire, not a drama. The public read it as drama for 50 years. Did the meaning *change*? If yes, meaning isn't fixed at publication. If no, the author's actual design doesn't matter, undermining intentionalism.

      *   **Awkward Defeaters:**
          *   *The "Competent Reader" Problem:* Who defines "competent"? If the "competent reader" is an idealization, does it drift away from actual historical readers?
          *   *The "Ambiguous Directive" Problem:* What if the author's public directive is ambiguous? (e.g., "I meant this ironically" but the text doesn't support it).
          *   *Collaborative Works:* Who is the author? The architectonic intention might be fractured.

      *   **Absorbable Defeaters (Qualifiable):**
