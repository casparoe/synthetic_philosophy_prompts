      *   **Goal:** Identify defeaters mapped by severity (Fatal, Awkward, Absorbable).
      *   **Specific Questions:**
          1.  Are there texts where meaning depends on unrecoverable private intentions?
          2.  Does the Architectonic/Executive distinction collapse in practice?
          3.  Does philosophy of language or legal interpretation show instability (collapse into full intentionalism or anti-intentionalism)?
          4.  Is the view unfalsifiable/insulated?

  2.  **Deconstruct the Position's Vulnerabilities:**
      *   *The "Recoverability" Criterion:* This is the hinge. If "recoverable" is too loose, it becomes full intentionalism. If too strict, it becomes textualism.
      *   *The "Public Record" Constraint:* What counts as public? Letters? Diaries published later? Interviews?
      *   *The "Time of Publication" Constraint:* This creates a historical freeze-frame.
      *   *The "Conflict Resolution" Rule:* Text wins unless explicit directive exists. This privileges the text but allows authorial veto.

