prompt: |-
  Hey — I'm a retired biochemist who spent thirty years on ion channels and only started reading philosphy seriously after I retired. Next month I'm giving the opening remarks at a small community workshop about renaming some old streets and the bronze statue in Riverside Park. The room's split: half philosophy and urban-planning people, half neighbors and a couple old lab mates who are just curious. I don't want to lecture anyone, but I also don't want to say "both sides" and sit down.

  I've been playing with this idea — maybe it's obvious, but I haven't seen it put exactly like this — that street names and statues aren't mainly honor-plaques; they're more like cordinate markers in the shared map we use to navigate the past. So taking one down isn't deleting history, it's shifting the reference frame. That should do real structural work in the speech: it lets me acknowledge why removal feels like erasure to some folks without treating the statue as sacred.

  Can you write me a five-minute opening? It should sound like it's coming from a scientist who's genuinely new to this debate, not a polished philosopher. Please don't give me a bibliography, reading list, or citations — I won't remember the names and I don't have time to look anyone up. Also, tell me what would change your mind about using this "reference frame" framing, and point out where your reasoning about the speech's structure is most likely to fail.
