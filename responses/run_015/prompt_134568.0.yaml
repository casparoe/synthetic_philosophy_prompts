answer: |-
  ### Brainstorming Candidate Framings

  1.  **The *Synkrisis* as Moral Algorithm:** Treat the formal comparisons as a step-by-step procedure for extracting virtue. *Promising:* Highly textual, focuses on the unique feature of the *Lives*. *Wrong:* Risks making Plutarch sound like a computer scientist; ignores the narrative flow that precedes the comparison.
  2.  **Ancient Situationism:** Argue Plutarch anticipates modern situationist psychology by highlighting the role of *tuchê* (luck/circumstance). *Promising:* Strong bridge to moral psychology. *Wrong:* Anachronistic danger; might force modern categories onto ancient text rather than letting the text speak.
  3.  **The Pedagogical Gymnasium:** Frame the *Lives* not as a gallery of statues to admire, but as a gymnasium for exercising judgment. *Promising:* Captures the active nature of the reader's role. *Wrong:* A bit metaphorical; needs a specific mechanism to be a dissertation chapter.
  4.  **The Hindsight Objection:** Focus entirely on the problem of narrative closure and whether biographical virtue is usable by the living. *Promising:* Philosophically deep, addresses your second half. *Wrong:* Too negative; might conclude the genre is useless, which kills the fellowship project's constructive aim.
  5.  **The Degenerate Case:** Define the project by what it is *not* (hagiography), arguing that purification breaks the moral mechanism. *Promising:* Sharp critical edge. *Wrong:* Defines the object by its absence; harder to build a positive theory of learning from.
  6.  **Attribution Training:** Argue the pairing mechanism trains the reader to distinguish internal character (*êthos*) from external circumstance (*tuchê*), functioning as a corrective to attribution error. *Promising:* Combines textual specificity (*synkrisis*) with a precise psychological mechanism (attribution); actionable and defensible.

  ### Selection and Rationale

  I am picking **Attribution Training**.

  Here is why: It is the only framing that makes the *pairing* structurally necessary rather than decorative. If the goal is moral learning, a single life allows you to conflate success with virtue. Two lives, similar in outcome but different in motive (or vice versa), force a discrimination. This maps cleanly onto the "sorting operation" you identified. It also allows you to incorporate the hindsight objection as a *limit* of the training (i.e., "this training works for judgment, but has limits for action") without letting that objection consume the whole project. It is specific enough for a one-year write-up but significant enough for a fellowship.

  ***

  ### Fellowship Proposal: The Pairing Machine

  **Project Title:** Attribution and Contrast: Moral Learning in Plutarch's *Parallel Lives*

  **The Research Question**
  Does the structural pairing of Greek and Roman lives in Plutarch's *Parallel Lives* function as a specific pedagogical technology for moral attribution? Specifically, does the *synkrisis* (formal comparison) train the reader to discriminate between internal character (*êthos*) and external circumstance (*tuchê*), thereby solving the "hagiography problem" not by sanitizing the hero, but by complicating the judgment of the hero?

  **Critique of the Standard Debate**
  Current scholarship on moral learning from biography oscillates between two poles. The traditionalist view holds that lives teach by providing admirable exemplars for emulation; the revisionist view argues that biographies inevitably idealize, airbrush failure, and teach deference to rank rather than virtue. Both sides assume the unit of instruction is the single life. This assumption leaves a determinate question open: why did Plutarch insist on pairing them? If the goal were mere emulation, a single perfect life would suffice. If the goal were historical record, pairing is arbitrary. By focusing on the *pair* rather than the *life*, this project moves beyond the stalemate of idealization versus historicity. It posits that the moral work is not done by the exemplar, but by the reader's act of comparing two exemplars. The standard debate fails because it treats the *Lives* as a gallery of statues; I argue they are a gymnasium for judgment.

  **Methodology and Work Plan**
  The project proceeds in three phases over twelve months, moving from textual mapping to psychological synthesis to drafting.

  *Months 1–3: Textual Mapping and Selection.* I will establish the corpus. There are 23 surviving pairs, but I cannot treat all equally. I will select six pairs that offer the highest variance in the relationship between character and outcome (e.g., *Demosthenes/Cicero* for rhetorical virtue in political failure; *Alexander/Caesar* for ambition and luck). I will also address the four unpaired lives (including *Caesar* and *Artaxerxes*). These are not outliers to be ignored; they serve as the control group. I will argue that the unpaired lives function differently—often as historical anchors—proving that the paired lives have a distinct moral purpose. The output of this phase is a annotated corpus map detailing where the *synkrisis* explicitly mentions luck versus character.

  *Months 4–6: The Mechanics of the Synkrisis.* This is the core close-reading phase. I will analyze the formal comparisons at the end of the pairs. I am not looking for who Plutarch declares the winner. I am looking for the *criteria* of judgment. Does Plutarch penalize a Roman for success achieved through luck that a Greek failed to secure? Does he excuse a failure caused by circumstance? I will code the arguments in the *synkrisis* for attributional language. This phase establishes whether the text actually performs the "sorting operation" I claim it does. If the *synkrisis* turns out to be merely rhetorical showboating or nationalist scorekeeping, the project pivots (see Risk Assessment).

  *Months 7–9: Psychological Synthesis and the Hindsight Objection.* Here I integrate the moral psychology. I will articulate how the pairing mitigates the "Fundamental Attribution Error"—the human tendency to over-attribute behavior to character and under-attribute it to situation. By holding the situation roughly constant (two men in similar crises) or holding the character constant (two ambitious men) and varying the outcome, Plutarch forces a counterfactual analysis. This is also where I address the "hindsight" objection. I will argue that while a single life succumbs to narrative determinism, the *contrast* between two lives reintroduces contingency. If two similar men diverge, the reader sees the role of luck. If they converge, the reader sees the role of character. This phase resolves whether the "biographer's privilege" is a bug or a feature.

  *Months 10–12: Drafting and Refinement.* I will write the chapter, aiming for 10,000 words. The first draft will prioritize the textual evidence; the second will sharpen the psychological argument. The final month is for peer review and polishing. I will specifically test the argument against the "unpaired" lives to ensure the theory holds up against the exceptions.

  **Why This Route? (Rejected Alternatives)**
  I considered two alternative approaches. First, running this argument through a general theory of learning from cases (e.g., legal or medical casuistry). I rejected this because it dissolves the specific literary architecture of the *Lives* into a generic pedagogical theory. Plutarch is not writing case studies; he is writing narrative biography, and the mechanism of learning must respect the genre. Second, testing the argument against a modern exemplar-based character programme. I rejected this because it invites anachronism. The goal is not to validate Plutarch for modern use, but to understand Plutarch's own pedagogical machinery. Using modern curricula as a testing ground would shift the focus from textual exegesis to educational policy, which is outside the scope of a philological dissertation.

  **Possible Conclusions**
  There are three determinate outcomes.
  1.  *Strong Confirmation:* The *synkrisis* consistently prioritizes the separation of *tuchê* from *êthos*. This confirms Plutarch as a sophisticated moral psychologist who uses structure to teach judgment rather than obedience.
  2.  *Nuanced Failure:* The *synkrisis* is inconsistent, sometimes moral, sometimes rhetorical. This suggests the "pairing machine" is an evolving experiment, not a fixed system. The chapter would then trace the development of Plutarch's method across his career.
  3.  *Structural Collapse:* The comparisons reveal that Plutarch *does* simply favor the Greek or the Roman based on outcome, ignoring circumstance. This would vindicate the "hagiography" critics and force me to conclude that the moral learning comes from the narrative, not the pairing.

  **Deliverable for Practitioners**
  For specialists, the deliverable is a new reading of the *synkrisis* as integral rather than appendicial. For designers of character education curricula, the deliverable is a framework for "Comparative Case Design." Current character education often relies on single-narrative hero worship. This project demonstrates that moral judgment is better trained by *contrasting* cases where outcomes diverge despite similar virtues, or converge despite different virtues. The practical takeaway is that curricula should not ask "What would X do?" but "Why did X succeed where Y failed?" shifting the focus from imitation to attribution.

  **Risk Assessment and Failure Conditions**
  The project relies on the *synkrisis* bearing significant philosophical weight. The honest failure condition arises in Month 10. If, upon close reading, the formal comparisons prove to be mere rhetorical exercises focused on stylistic balance or nationalist point-scoring without genuine moral discrimination, the central thesis collapses. In that event, I cannot claim the pairing is a "machine" for moral sorting. The contingency plan is to pivot to Outcome 2 (above), framing the inconsistency as evidence of Plutarch's struggle with the genre, rather than his mastery of it. However, the project would lose its intervention in moral psychology.

  ***

  ### Expert Advice on Scope and Cutting

  Now, let's step out of the proposal voice and talk straight.

  **Is this too big for a year?**
  Yes, if you try to do both halves with equal weight. The "Attribution Training" argument (the pairing mechanism) is robust, textually grounded, and defensible. The "Hindsight/Narrative Shape" argument is philosophically seductive but dangerous. It opens a can of worms regarding narrative theory, temporality, and the phenomenology of action that could easily swallow six months of your writing time.

  **Which half do I cut?**
  Cut the second half as a *co-equal* argument. Keep it as a limitation.
  In the proposal above, I framed the hindsight issue in Months 7–9 as "Does pairing mitigate hindsight?" That is the right move. Do not try to solve the problem of whether biographical virtue is usable by the living. That is a book-length philosophical problem. Instead, argue that *even if* hindsight is a problem, the pairing is Plutarch's *attempted solution* to it.
  If you find in Month 6 that the *synkrisis* doesn't actually deal with luck/fortune effectively, you need to know by Month 7 so you can pivot. Don't wait until Month 10 to discover the *synkrisis* is just rhetorical fluff.

  **The Unpaired Lives**
  Be careful with the unpaired lives. There are only four (*Galba, Otho, Artaxerxes, Caesar*—depending on how you count the fragmentary ones). *Caesar* is the big one. If your theory is "Pairing is necessary for moral learning," what do you do with *Caesar*? It is one of the most morally complex lives, yet it stands alone (originally paired with Alexander, but the comparison is lost/fragmentary in ways that complicate things).
  *Advice:* Don't treat them as a "control group" in the scientific sense, as I wrote in the proposal draft. That's a bit too modern. Treat them as the *limit case*. If the pairing is the machine, the unpaired lives show us what happens when the machine is broken or incomplete. Does the moral clarity suffer? If *Caesar* is more ambiguous than *Brutus* (who is paired), that supports your thesis. If *Caesar* is just as clear, your thesis takes a hit.

  **The "Failure Condition"**
  I was blunt in the proposal because you asked for it, but in the actual fellowship application, you might want to soften the language slightly from "Structural Collapse" to "Alternative Interpretation." Fellowship committees don't like funding projects that admit they might prove their own main point wrong. Frame it as "Exploring the variance in Plutarch's method." But for your own sanity? Keep my version. Know what would kill the chapter. If the *synkrisis* is just "Greek Guy was more generous, Roman Guy was more brave" with no reference to circumstance, your "Attribution Training" theory is dead.

  **Final Verdict**
  The "Attribution Training" frame is fellowship-ready. It's novel, it bridges disciplines without selling out the philology, and it has a clear corpus. Stick to the pairing. Use the hindsight stuff only to show *why* the pairing is necessary. Don't let the hindsight problem become the main event. You are writing about Plutarch's solution, not the eternal problem of biography.

  Go write it.
