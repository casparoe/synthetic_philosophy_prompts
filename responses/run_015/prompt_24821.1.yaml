      *   **Millikan (Teleosemantics):** Content is determined by the *proper function* of the mechanism producing the state, which is fixed by its selection history (evolutionary or learning history). A state means $F$ if the mechanism was selected for because it correlated with $F$ and guided successful action regarding $F$. Error is possible if the mechanism fails to perform its proper function (e.g., produces the state without $F$ being present).

