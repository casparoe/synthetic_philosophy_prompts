answer: |-
  Consider a species of island finch possessing an innate neural mechanism $M$ that triggers a pecking response when a specific visual pattern $V$ (a striped texture) is detected. Over evolutionary history, $V$ was exclusively instantiated by Nutritious Seed $S$, and the survival value of consuming $S$ fixed $M$'s proper function. Recently, however, an invasive plant introduced Mimic Seed $Z$, which possesses $V$ but offers no nutrition, while $S$ has gone extinct on the island. Consequently, $M$ is now tokened exclusively by $Z$ in the finch's current environment, maintaining a perfect causal covariance with $V$ and $Z$, but zero covariance with $S$.

  On Dretske's informational semantics, the content of the current token of $M$ is determined by what the state carries information about given current nomic dependencies. Since $S$ is extinct, the occurrence of $M$ does not raise the probability of $S$ to 1; it does, however, guarantee the presence of $V$ (or $Z$). Thus, Dretske assigns the content *Striped Pattern* (or *Mimic Seed*). For Millikan, content is fixed by the selection history that established the state's proper function, regardless of current reliability. Since $M$ was selected for detecting $S$, its content remains *Nutritious Seed $S$*, rendering the current tokens systematic errors. The divergence turns entirely on the **decoupling of the indicator property from the historically beneficial property**. If we remove the invasive seed $Z$ and restore $S$, the indicator and benefit re-couple, and both theories converge on *Nutritious Seed $S$*. A defender of Dretske might attack the teleosemantic verdict by arguing that anchoring content to extinct entities violates naturalistic constraints: if $S$ no longer exists and plays no causal role, attributing it as content is occult mysticism rather than empirical psychology, and the finch is simply behaving appropriately toward the only reality available ($Z$).
