answer: |-
  Your intuition to apply systems engineering concepts to historical macro-patterns is sound. The distinction between 'cascading system failure' and 'graceful degradation' maps remarkably well onto the debate between societal collapse and societal transformation. In your professional domain, the difference lies not in whether the system stops functioning, but in whether the core architecture is corrupted beyond repair or merely sheds non-essential load to preserve vital functions.

  There is indeed a single principle that renders all five of your verdicts coherent. I shall term this **The Principle of Substrate Integrity**.

  ### The Principle of Substrate Integrity

  **Definition:** A society undergoes **collapse** (cascading failure) if and only if it suffers a permanent rupture in its *informational substrate* (the tools used to coordinate complexity, such as writing or administrative memory) or its *demographic substrate* (the population density required to sustain that complexity). Conversely, a society undergoes **graceful degradation** (restructuring) if the political superstructure fails but the informational and demographic substrates remain intact enough to regenerate complexity or sustain continuity without a fundamental reduction in carrying capacity.

  This principle relies on two clauses. The first concerns **Informational Continuity**: can the society record and transmit its organisational logic to the next generation? The second concerns **Demographic Continuity**: does the human workforce remain sufficient to maintain the system's prior energy capture?

  ### Application to Your Verdicts

  Here is how the principle validates your five cases:

  1.  **Late Bronze Age (Collapse):** This triggers the **Informational Continuity** clause. The loss of writing systems (Linear B, Cuneiform in some areas) meant the 'code' for running palatial economies was deleted. Without the informational substrate, the complex trade networks could not be debugged or restarted, leading to a cascading failure of the regional system.
  2.  **Classic Maya (Degradation):** This bypasses the **Demographic Continuity** clause. You note that populations persist and languages continue. While the 'monumental construction' module was switched off to save energy, the core code (language, culture, lineage) remained. The system shed load but did not crash.
  3.  **Easter Island (Collapse):** This triggers the **Demographic Continuity** clause. Your verdict rests on 'sharp population contraction' and 'ecological overshoot'. Even if culture persisted, the reduction in human carrying capacity was so severe that the prior socio-political complex (moai building) could not be supported. The hardware was damaged beyond the ability to run the old software.
  4.  **Western Rome (Degradation):** This bypasses the **Informational Continuity** clause. You correctly identify that Latin administrative practice and the Church preserved institutional memory. The 'State' process terminated, but the 'Civilisation' daemon kept running under new management (successor kingdoms).
  5.  **Soviet Union (Degradation):** This bypasses both clauses. The state apparatus failed, but the society (demography) and the bureaucratic/technical class (information) persisted. The operating system changed from Command to Market, but the hardware and users remained the same.

  ### Predictions for Unlisted Cases

  Applying the Principle of Substrate Integrity to your two undecided cases yields the following predictions:

  **1. The Khmer Abandonment of Angkor (15th Century)**
  *   **Verdict:** **Graceful Degradation.**
  *   **Reasoning:** While the great hydraulic city was abandoned, this was largely a strategic relocation of the capital to Phnom Penh, driven by shifts in trade routes and religious focus (from Hindu-Buddhist god-kings to Theravada Buddhism). The Khmer language, script, and population persisted without catastrophic contraction. The 'Angkor' module was deprecated, but the Khmer society continued to run. This aligns with your Maya and Rome verdicts.

  **2. The Indus Valley Civilisation (1900–1300 BCE)**
  *   **Verdict:** **Genuine Collapse.**
  *   **Reasoning:** This aligns with your Late Bronze Age verdict. The distinctive Indus script disappears entirely and is never recovered; the standardisation of bricks and weights vanishes; and the large urban centres are depopulated in favour of smaller, rural settlements. The informational substrate for coordinating urbanism was lost, and the demographic density required for the civilisation's peak complexity was not sustained in the same region for over a millennium. The system did not degrade; it crashed and had to be rebooted from a much simpler state.

  ### A Note on Coherence and Fragility

  Your framework is logically consistent, but I must highlight one point of fragility. Your classification of Easter Island relies heavily on the premise of pre-contact 'sharp population contraction' due to ecological overshoot. Recent archaeological scholarship suggests the demographic collapse may have been less severe than previously thought and exacerbated by post-contact events, much like the Maya.

  If future evidence were to demonstrate that Rapa Nui maintained its demographic substrate more robustly than currently assumed, the Principle of Substrate Integrity would force you to overturn your verdict on Easter Island from **Collapse** to **Degradation**. You would then have to accept that the inhabitants did not suffer a cascading failure, but rather a graceful degradation similar to the Maya.

  However, retaining your current verdict is plausible if you prioritise the *loss of the specific socio-political complex* (the moai system) as a proxy for demographic failure. As long as you maintain that the ecological damage permanently reduced the island's carrying capacity, your framework holds.

  ### Conclusion

  Your distinction between failure and change is robust. By defining collapse not as 'death' but as the 'loss of the capacity to reproduce prior complexity', you avoid the common error of conflating political regime change with civilisational death. The Soviet Union and Rome were regime changes; the Late Bronze Age and Indus Valley were civilisational deaths. Your engineering metaphor successfully isolates the variable that matters: not whether the lights go out, but whether the grid can be turned back on.
