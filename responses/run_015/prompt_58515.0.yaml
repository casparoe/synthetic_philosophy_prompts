answer: |-
  This is a great teaching moment. You're trying to teach **decision costs** and **satisficing** (finding a "good enough" solution) versus **maximizing** (trying to find the perfect solution). The goal is to make them feel the *pain* of the deadlock so the solution feels like a relief, not a lecture.

  Here is a 60-minute lesson plan designed to replicate that specific "identical options" paralysis.

  ### Activity Title: "The Justification Trap"

  **The Core Mechanic:** You will present two options that are functionally identical. However, you will impose a rule that forbids random choice. They must provide a *logical reason* for their preference. Since no logical reason exists, they will stall. You will then introduce "heuristics" (coin flips, etc.) as the professional solution.

  **Materials Needed (Cheap & Low Tech):**
  *   **Two identical manila folders** (or envelopes). Label one "A" and one "B" in big marker.
  *   **Identical sheets of paper inside each.** (Print 22 copies of the same simple task, e.g., "List 10 course concepts you find confusing," or a simple logic puzzle).
  *   **A visible timer.** (Your phone connected to a speaker if possible, or just write countdown times on the board).
  *   **Whiteboard & Markers.**
  *   **A coin.** (Keep this hidden in your pocket until the pivot point).
  *   **Small prize (Optional).** A bag of candy or "extra credit point" (if allowed) to raise stakes slightly.

  ---

  ### Minute-by-Minute Rundown

  **0:00 – 0:05: Setup & Stakes**
  *   **Action:** Arrange chairs in a semi-circle. Put Folder A on the left table, Folder B on the right table.
  *   **Script:** "Today we're talking about decision-making. Last week, I heard this class spent 15 minutes choosing between two identical review guides. We're going to replicate that scenario, but with a twist. Inside one of these folders is the instructions for a 10-minute group task. If the class completes the task successfully, [everyone gets a candy / we end 5 mins early / you get a participation credit]. But there is a rule."
  *   **The Rule:** Write on board: **"NO RANDOM CHOICES. TO SELECT A FOLDER, THE CLASS MUST AGREE ON A LOGICAL REASON WHY IT IS SUPERIOR."**
  *   **Note:** Do *not* tell them the folders are identical yet. Let them assume there might be a difference.

  **0:05 – 0:20: The Deadlock (The "Pain" Phase)**
  *   **Action:** Step back. Cross your arms. Stay silent.
  *   **Dynamic:** Students will start asking: "What's in A?" "What's in B?" You answer: "One contains the task. They look the same, but you must justify the choice."
  *   **The Trap:** If someone says "Let's just pick A," you shake your head and point to the rule: "What is the *reason* A is better?"
  *   **Goal:** Let the awkward silence build. Let them spin wheels. If they get close to a decision, play devil's advocate: "Is that a sufficient reason? Are we sure?"
  *   **Instructor Role:** Be a polite bureaucrat. You aren't being mean; you are enforcing the "No Reason, No Choice" policy. This mimics the social pressure they felt last week.
  *   **Stop Point:** At minute 20, regardless of where they are, blow the whistle. "Time's up on the selection phase."

  **0:20 – 0:35: The Pivot & Execution**
  *   **Action:** Reveal the folders. Open both in front of them. Show the papers are identical.
  *   **Script:** "The contents are identical. The cost of the last 15 minutes was 15 minutes of task time. In the real world, when data is equal, looking for more data is waste. We need a heuristic."
  *   **The Fix:** Pull out the coin. "Heads = A, Tails = B. Who wants to call it?" Flip it. Pick the folder immediately.
  *   **Task:** Hand out the papers from the chosen folder. Give them the remaining 10 minutes to actually do the task inside.
  *   **Why:** This gives them the relief of movement. They feel the efficiency of the coin flip compared to the debate.

  **0:35 – 0:50: The Debrief (Where the Learning Happens)**
  *   **Action:** Whiteboard discussion. Draw a T-Chart: "Deliberation" vs. "Decisiveness."
  *   **Questions to Ask:**
      1.  "During the first 15 minutes, what were you waiting for?" (Answer: Permission, certainty, someone else to take blame).
      2.  "How did it feel when I enforced the 'give a reason' rule?" (Answer: Frustrating, impossible).
      3.  "In the real world, when is it okay to flip a coin?"
      4.  "When is it *not* okay to flip a coin?" (Crucial distinction).
  *   **Key Concept to Introduce:** **Buridan's Ass.** Explain the philosophical donkey that starves between two identical hay piles. Explain **Opportunity Cost:** The time spent deciding is time *not* spent doing.

  **0:50 – 1:00: Application & Wrap**
  *   **Action:** Connect back to the review guide incident.
  *   **Script:** "Last week, the guides were identical. The cost of choosing the 'wrong' one was zero. The cost of *not* choosing was 15 minutes of class. Next time you're stuck between two equal options, I want you to ask: What is the cost of being wrong? If it's low, pick one and move."
  *   **Exit Ticket:** On a scrap of paper, have them write down one low-stakes decision they've been putting off and write "Flip a coin" next to it.

  ---

  ### Heads Up: What Goes Sideways

  **1. They pick too fast.**
  *   *Risk:* A dominant student says "Whatever, pick A," and the class shrugs.
  *   *Fix:* You must enforce the rule strictly. "I hear a suggestion, but do we have consensus on the *reason*? Sarah, do you agree that A is logically superior?" Force the justification. If they say "It doesn't matter," you say "Then we cannot proceed under the current rules."

  **2. They rebel against the rule.**
  *   *Risk:* They call the rule stupid and demand you just let them pick.
  *   *Fix:* Lean into it. "This rule represents the mental block you had last week. You felt you couldn't pick without a reason. I'm just externalizing that feeling. Stick with it for 10 more minutes."

  **3. The "Task" is too fun.**
  *   *Risk:* If the task inside the folder is amazing, they won't care about the delay.
  *   *Fix:* Keep the task mundane (e.g., "Discuss the syllabus," "List 5 study tips"). The reward should be *finishing*, not the task itself.

  **4. You talk too much.**
  *   *Risk:* You break the tension by explaining what's happening.
  *   *Fix:* **Silence is your weapon.** During the 0:05–0:20 block, speak only to enforce the rule. Let the awkwardness do the teaching.

  ---

  ### Limitations: What This Exercise Can't Capture

  You will need to verbally fill in these gaps during the debrief, as the game simplifies reality:

  **1. High-Stakes Decisions:**
  *   *The Gap:* The game implies "just flip a coin" is always better. It isn't.
  *   *The Fill:* "If you're choosing a review guide, flip a coin. If you're choosing a medical treatment or an ethical stance, deliberation is required. The skill is knowing which category you are in."

  **2. Group Dynamics vs. Individual Agency:**
  *   *The Gap:* In the game, they need *unanimous* consensus. In life, individuals can often just act.
  *   *The Fill:* "Part of the deadlock last week was diffusion of responsibility. Nobody wanted to be the one to say 'A' in case 'B' was actually better. As individuals, you have more power to just act than you do in a committee."

  **3. The "Sunk Cost" of the Game:**
  *   *The Gap:* They might feel the 15 minutes was "wasted" time in class.
  *   *The Fill:* "It feels like wasted time, but if this 15 minutes saves you 15 hours of procrastination over your degree, it was a good investment. That's the meta-lesson."

  ### Why This Works for a Sub
  *   **Low Prep:** You just need two folders and the same paper twice.
  *   **High Control:** You hold the timer and the rules. You aren't relying on their energy; you're relying on their awkwardness.
  *   **Direct Relevance:** It directly addresses the elephant in the room (last week's wasted time) without you having to scold them for it. You're letting them scold themselves through the experience.
