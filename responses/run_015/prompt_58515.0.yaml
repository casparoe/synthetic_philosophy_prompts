      *   *Idea 4: The "Identical Task" Split.* Divide the class into two groups to do the exact same thing, but they have to agree on *which* version of the instructions to use.
      *   *Idea 5: The "Resource Allocation" Game.* Give them a goal, offer two identical paths, impose a time limit, and forbid compromise.

      *Selection:* Let's go with a modified version of Idea 5, specifically tailored to the "Review Guide" incident. Let's make them choose between two *identical* paths to a reward, but the process of choosing eats up the reward time.
      *Refinement:* To make it visceral, they need to *do* something. Let's have them solve a puzzle or build something. But the bottleneck is choosing the *toolkit*.
      *Better Refinement:* The "Two Envelopes" Game. Two envelopes, identical contents (or functionally identical). The class must unanimously agree on which envelope to open to get the instructions for a prize task. If they don't pick in time, no prize.
      *Wait, one constraint:* The prompt says they deadlocked over *which guide to use*. I need to replicate the *social* deadlock, not just a logical one.
      *Final Concept:* **"The Committee of 22."** The class must collectively choose one of two identical boxes to retrieve a task. They cannot open both. They cannot flip a coin (initially). They must debate. The task inside is time-sensitive.

  4.  **Developing the Minute-by-Minute Plan:**
      *   *0-5:* Setup & Hook. Explain the stakes.
      *   *5-20:* The Deadlock (The Game). Present the two identical options. Enforce the rule: "Must agree on one." Watch them struggle.
      *   *20-35:* The Release (The Pivot). Allow a heuristic (coin flip, rock-paper-scissors) to break the tie. Complete the task.
      *   *35-50:* Debrief. Connect feelings to theory.
      *   *50-60:* Wrap up & Application.

  5.  **Fleshing out the Details:**
      *   *Materials:* Two identical boxes/envelopes, identical paper inside, timer (phone), candy/prize (optional but helpful), whiteboard.
      *   *The Trap:* The instructions inside are time-sensitive. If they spend too long choosing, they can't finish the task.
      *   *The Rule:* "Unanimous consent required." This forces the deadlock.

  6.  **Addressing the "What Goes Sideways":**
      *   *Scenario A:* They pick too fast. *Fix:* Make the options seem distinct initially (label them A and B) but reveal they are the same later, or have the instructor play devil's advocate. Actually, better: The instructor acts as the "System" and rejects non-unanimous choices.
      *   *Scenario B:* They rebel/ignore rules. *Fix:* Keep stakes low but social pressure high.
      *   *Scenario C:* One dominant voice takes over. *Fix:* Watch for this during debrief.

  7.  **Addressing the "Limitations":**
      *   Real life isn't always unanimous.
      *   Sometimes options *are* different.
      *   Randomness isn't always appropriate.
      *   The instructor needs to contextualize *when* to deliberate vs. *when* to decide.

