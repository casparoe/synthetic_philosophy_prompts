      *   *Activity Name:* "The Twin Protocol."
      *   *Materials:* Two manila folders (look different but contain same text), a simple puzzle (e.g., list 10 things...), timer.
      *   *Debrief Questions:* How did it feel? Who spoke? What was the cost?
      *   *Key Takeaway:* Decision cost > Decision quality (in low-stakes equal scenarios).

  9.  **Review against Constraints:**
      *   22 undergrads? Yes, large group dynamic works well for this.
      *   60 mins? Yes, timeline fits.
      *   No tech? Yes, paper-based.
      *   Movable chairs? Use for group clustering if needed, but keep them in a semi-circle for the debate.

  10. **Final Polish:** Ensure the tone is supportive of the sub (who might be nervous) and clearly explains *why* each step matters. (Self-Correction: Make sure the "identical" nature isn't revealed *until* after the deadlock, otherwise they won't debate. They need to *think* there might be a difference, or simply be paralyzed by the fear of making the 'wrong' choice among equals.)
      *Correction:* If I tell them they are identical upfront, they won't debate. I need to imply they *might* be different, or simply present them as "Option A" and "Option B" and let their anxiety create the difference. Actually, the prompt says the previous class knew they were identical review guides. So the students *know* they are identical. The deadlock comes from *social* hesitation, not informational asymmetry. I must replicate *that*.
      *Revised Strategy:* The options are explicitly identical. The deadlock is purely about *who takes responsibility* for the choice. This is more accurate to the prompt's scenario ("nobody wanted to pick without a reason").

