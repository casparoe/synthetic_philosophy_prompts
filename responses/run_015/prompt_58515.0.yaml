      *Let's refine the "Identical" aspect.* If I tell them they are identical, they might say "Okay, doesn't matter, pick A." To force the "need for a reason," I need to frame the choice as having consequences, even if the consequences are the same. Or, I simply enforce the rule: "No random choices. Must have a reason." That forces the cognitive dissonance.

