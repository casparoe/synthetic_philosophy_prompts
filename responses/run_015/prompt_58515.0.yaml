  13. **Final Review of the Output:** Does this meet all user constraints?
      *   Minute-by-minute? Yes.
      *   Cheap stuff? Yes (paper, pens, two boxes/folders).
      *   Debrief? Yes.
      *   Sideways/Limitations? Yes.
