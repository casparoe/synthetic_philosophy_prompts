answer: |-
  Dear friend, it is wonderful to hear from you and to know that you are wrestling with such profound passages in the Confessions, because the tension you have identified is precisely where Augustine's psychology becomes most fascinating and most difficult to pin down. You are asking whether the self is transparent to itself or capable of hiding from itself, and whether self-deception is a logical impossibility for Augustine or a tragic reality of the fallen will. To answer this, we have to look closely at how Augustine distinguishes between presence and attention, and between knowledge and love. When Augustine argues in Book X that the mind cannot be unknown to itself because it is present to itself, he is making an ontological claim about the nature of consciousness. He believes that the mind is not an object it possesses, like a box containing memories, but rather the mind is its own presence. Therefore, in a strict sense, the mind cannot lose itself or be totally ignorant of itself, because the very act of searching implies the searcher is already there. However, when he speaks of hiding from God in the secret places of his heart, he is not describing a spatial hiding spot where God cannot see, nor is he necessarily saying he is cognitively unaware of his own state. Instead, he is describing an affective avoidance. For Augustine, you can know the truth and yet refuse to dwell on it, you can possess knowledge in your memory but refuse to bring it into the light of your contemplation. So the tension you feel is real, but it is resolved if we understand that for Augustine, self-deception is not a matter of not knowing, but of not willing to know what one already knows.

  This leads us to your question about whether the self is split or whether self-deception is impossible. Augustine does not offer a Freudian model of the unconscious where one part of the soul is completely walled off from another. He does not think there is a dark basement of the mind where secrets are kept from the conscious self. Instead, he proposes a fragmentation of the will. In Book VIII, during the garden scene, he describes his will as being divided against itself. He says it was I who willed it and I who was unwilling, and it was all me. This suggests that self-deception is possible not because one part of the soul tricks another part, but because the soul is heavy with habit and disordered love. The self deceives itself by directing its attention away from the truth that is painfully present. It is a kind of self-estrangement where the soul becomes a stranger to its own best interests because it is too attached to lesser goods. So, to answer your specific question, Augustine does allow for self-deception, but he defines it less as a logical trickery where the mind believes a falsehood it knows to be false, and more as a moral failure to attend to the truth that is immediately present. The deception lies in the distraction, not in the absence of information.

  Your idea about the time lag in self-deception is incredibly inventive and shows you are thinking creatively about the mechanics of the psyche, but I am not sure it maps perfectly onto Augustine's metaphysics of time and self. You suggest that we trick a future version of ourselves, implying a separation between the present agent and the future victim. Augustine does have a very sophisticated theory of time in Book XI, where he argues that time is a distention of the soul, existing only in the present memory of the past and the present expectation of the future. However, when he discusses sin and habit, he usually describes the past binding the present, rather than the present tricking the future. He speaks of the chain of habit, where past voluntary actions solidify into a necessity that constrains the current will. In this sense, it is more accurate to say that for Augustine, your past self has deceived your present self by building a prison of habit that makes the truth seem impossible to choose. The struggle is always in the present moment of decision, where the weight of the past presses down on the soul. While your time lag theory works well for modern behavioral economics or psychological planning fallacies, Augustine is more concerned with the immediate burden of history on the current will. He would likely say that you are not tricking a future self, but rather that you are failing to liberate your present self from the deception your past self has cemented.

  I want to be honest with you about where my reasoning here is weakest, because Augustine is often more poetic than systematic in the Confessions. My interpretation relies heavily on synthesizing Book X on memory with Book VIII on the will, and there is a risk that I am smoothing over inconsistencies in Augustine's own thought. He sometimes speaks as if the mind is utterly transparent to itself, and at other times speaks as if the heart is deceitful above all things. The weakness in my argument is the precise mechanism of how the will suppresses knowledge without erasing it. Augustine does not give us a cognitive science of suppression; he gives us a phenomenology of guilt. I am assuming that the hiding is purely volitional, but there are moments where Augustine speaks of ignorance that seems involuntary, a clouding of the mind that feels less like a choice and more like a punishment. If I am too strict about the will's responsibility, I might be missing the depth of his despair regarding the mind's capacity to heal itself.

  To be open about what would change my mind, I would need to find a passage where Augustine explicitly describes a moment of self-deception that relies on cognitive ignorance rather than volitional avoidance. If he were to write that he genuinely believed a lie about himself without any underlying awareness of the truth, that would undermine the idea that the mind is always present to itself. Alternatively, if he were to describe the soul as having distinct compartments where one part actively conceals information from another part in a spatial or structural way, that would support the split-self theory more than the divided-will theory. Until I see textual evidence that he believes the mind can be truly absent from itself or structurally partitioned like a house with locked rooms, I must stick with the view that self-deception is a failure of love and attention rather than a failure of access. Ultimately, Augustine wants to maintain that we are responsible for our deception because deep down, in the deepest fold of memory, we know the truth and are simply fleeing from it.

  I hope this helps clarify the tension you are feeling without resolving it too neatly, because the friction in his text is often where the truth lies. It is a difficult balance to hold, that we are fully known to ourselves yet constantly hiding from ourselves, but that is precisely the human condition as Augustine sees it. We are too close to ourselves to be ignorant, yet too wounded to be honest. Your intuition about the time lag is worth holding onto even if it does not fit Augustine perfectly, because it highlights how modern we are in our thinking compared to his ontological focus. Please keep wrestling with these texts, as you are asking the right questions to unlock the depth of his psychology.
