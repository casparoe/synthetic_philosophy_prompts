          3.  Justice in Rectification (fixing past injustices).
      *   **Wilt Chamberlain Argument:** Starts with a just distribution (D1). People voluntarily pay Wilt (25 cents) to watch him play. End result (D2) is unequal. If D1 was just and transfers were voluntary, D2 must be just. Therefore, patterned principles of justice (like equality) are violated by liberty.
