          *   *Interval Properties (Motion):*
              *   End: Object is in motion (primitive relation to interval).
              *   Per: Worm segment has shape-variation across sub-parts.
              *   *Borrowing?* Endurantist might need "temporal parts" to define velocity without circularity. Perdurantist needs "instantaneous" limits.
          *   *Translation Test:*
              *   If isomorphic, is it verbal?
              *   End: No, because "wholly present" captures a mode of being.
              *   Per: Yes, it's just coordinate systems.
              *   *Residue:* Primitives.
          *   *Developmental Study:*
