  # JOINT STATEMENT ON PERSISTENCE AND ONTOLOGY
  **Parties:** The Endurantist (E) and The Perdurantist (P)
  **Facilitator:** [Reading Group Moderator]
  **Date:** October 26, 2023

  ## PREAMBLE & STIPULATIONS
  We, the undersigned, acknowledge the following common ground to preclude redundant argumentation:
  1.  **Eternalism:** We both accept the block universe. Past, present, and future entities exist equally.
  2.  **Change:** Ordinary change is real and non-illusory.
  3.  **Contradiction:** We agree that "The candle is straight at $t_1$" and "The candle is bent at $t_2$" are compatible truths. The problem is explaining *how* they are compatible, not *that* they are.
  4.  **Interval Properties:** We acknowledge properties like *moving*, *accelerating*, and *surviving* appear to require temporal intervals.
  5.  **Constraints:** Neither side may appeal to Special Relativity as a decisive refutation. Neither side may appeal to "ordinary language" or folk intuitions as metaphysical proof (though empirical data on cognition is admissible in Crux 5).

  ---

  ## 1. AGREED SUBSTANTIVE CLAIMS
  *We affirm the following propositions as accurate characterizations of our respective positions and the logical landscape.*

  1.  **The Argument from Temporary Intrinsics:** We agree this argument establishes a trilemma, not a refutation. To avoid contradiction regarding an object $O$ having incompatible properties $F$ and $\neg F$, one must deny: (a) that $O$ is strictly identical over time (P's choice), (b) that properties are non-relational monadic qualities (E's choice, via time-indexing), or (c) classical logic. The argument does not prove (a) is preferable to (b).
  2.  **Analysis of "Wholly Present":** We agree that "wholly present at a time" cannot be analyzed without circularity if one attempts to define it using temporal parthood. E treats "wholly present" as a primitive mode of location. P treats "wholly present" as a false description, replacing it with "has a temporal part located at." We agree there is no neutral, non-question-begging definition of "whole" available to both parties.
  3.  **Time-Indexed Properties:** We agree E is committed to primitive time-indexed properties (e.g., *straight-at-$t$*). We disagree on whether this is a cost. E claims all property instantiation is implicitly relational to time, making this cost nominal. P claims this multiplies properties unnecessarily compared to P's single tenseless property had by a temporal part.
  4.  **Coinciding Objects:** We agree P has a structural advantage in cases of fission or coinciding objects (e.g., Statue/Lump). P analyzes these as overlapping worms with different modal profiles or temporal boundaries. E must posit a primitive constitution relation or deny numerical identity despite material coincidence. E admits this is ontologically heavier in relations; P admits this is counter-intuitive to the "one object" phenomenology.
  5.  **Interval Properties:** We agree that instantaneous velocity cannot be defined merely by an instantaneous state (the "at-at" theory requires limits over intervals). E attributes motion to the enduring object over an interval. P attributes motion to the spacetime worm's shape across the interval. We agree neither account successfully reduces interval properties to instantaneous properties without calculus-like machinery.

  ---

  ## 2. DISAGREEMENTS TABLE
  *We characterize our specific points of divergence below. The "Verdict" column is an assessment by the Facilitator.*

  | Point at Issue | Endurantist Wording (E) | Perdurantist Wording (P) | Verdict (Facilitator) |
  | :--- | :--- | :--- | :--- |
  | **The Nature of Persistence** | Persistence is **identity**. $O$ at $t_1$ is numerically identical to $O$ at $t_2$. | Persistence is **gen-identity**. $O$ at $t_1$ is a temporal part of the worm $W$, distinct from $O$ at $t_2$. | **Substantive.** Disagreement on the fundamental category of object (Substance vs. Process). |
  | **Ontological Parsimony** | I posit fewer entities. I do not multiply objects into temporal slices. | I posit a more uniform ontology. Objects are just spacetime regions; no special "endurance" relation needed. | **Substantive.** Disagreement on what counts as "parsimonious" (count of entities vs. uniformity of kinds). |
  | **Location Primitives** | "Being wholly located at" is a fundamental, unanalyzable relation between object and time. | "Being a temporal part of" is fundamental. "Wholly located" is derivative and often false. | **Verbal/Substantive Hybrid.** Depends on whether "part" is defined mereologically or conceptually. |
  | **Modality & Essence** | An object's modal profile is intrinsic to the substance. $O$ could not have had different origins. | An object's modal profile is determined by the counterpart relation or worm boundaries. | **Substantive.** Directly impacts truth conditions of counterfactuals. |
  | **Fission Cases** | Fission is impossible for a single object; one candidate is the original, or both cease. | Fission results in two overlapping worms diverging; identity is indeterminate or relative. | **Substantive.** Different truth values assigned to "Is $O$ after fission $O_{before}$?" |

  ---

  ## 3. CRUXES & PREDICTIONS
  *We commit to the following evaluations of specific test cases. We agree to treat these as bearing on the truth of our views.*

  ### A. The Flicker (Intermittent Existence)
  *Scenario:* An object exists at $t_1$, ceases to exist at $t_2$, and an qualitatively identical object comes into existence at $t_3$ via a causal process linked to $t_1$.
  *   **E's Account:** This is one object $O$ with a gappy existence. $O(t_1)$ is identical to $O(t_3)$.
  *   **P's Account:** These are two distinct temporal worms ($W_1$ and $W_3$) causally connected. There is no single entity spanning the gap.
  *   **Bearing:** E handles the intuition of "the same thing came back" better. P handles the ontological worry of "existence without being" better.
  *   **Prediction:** If intermittent existence is metaphysically possible, E's framework requires less revision than P's (which must allow disconnected sums).

  ### B. The Heraclitean Rock (No Modals)
  *Scenario:* An object exists about which *no* de re modal claims are true. No claims about what could have happened to it, only what did.
  *   **E's Account:** There is still a difference between "one substance wholly present at each moment" and "a sequence of stages." The difference is categorical (Substance vs. Aggregate).
  *   **P's Account:** Without modals, the distinction collapses. A worm just *is* the sum of its stages. If modals were doing all the work, this case should neutralize the dispute.
  *   **Verdict:** **Substantive Residue.** Even without modals, E insists on a mode of being (unity) that P denies. However, if neither side can point to a truth-maker for this unity other than the object itself, the dispute risks becoming verbal here.
  *   **Prediction:** In a modal-free world, the practical difference between the theories vanishes, but the ideological commitment to "Substance" remains for E.

  ### C. Interval-Only Properties (Motion)
  *Scenario:* Defining "being in motion" at an instant.
  *   **E's Account:** An enduring object has the property *moving* over an interval. To say it moves *at* an instant is derivative (having velocity vector $v$). E risks borrowing P's machinery if $v$ is defined by limits of positions of temporal parts.
  *   **P's Account:** The worm has a shape that varies across temporal coordinates. Motion is static variation in the block.
  *   **Bearing:** P offers a cleaner reduction of motion to geometry. E must accept motion as a primitive dynamic property or accept the "at-at" theory which relies on temporal coordinates (looking like parts).
  *   **Prediction:** P provides a more natural account of kinematic properties within Eternalism. E must posit a primitive "flux" or accept the B-theoretic reduction which mimics P.

  ### D. The Translation Test
  *Scenario:* A formal scheme translates E's "Object $O$ is $F$ at $t$" to P's "Temporal part $O_t$ is $F$" and vice versa, preserving all truth values, except E uses primitive "Wholly Located" and P uses primitive "Temporal Part."
  *   **E's Account:** The dispute is **not** verbal. The primitives carve reality at different joints. "Wholly Located" captures a unity that "Temporal Part" fractures.
  *   **P's Account:** The dispute **is** verbal (or merely notational). If the translation preserves all truth conditions and empirical predictions, the difference is ideological, not ontological.
  *   **Residue:** The residue is **ideological parsimony**. P claims their primitive (parthood) is better understood than E's primitive (wholly located). E claims their primitive is more fundamental.
  *   **Prediction:** If translation is perfect, the dispute is substantive only regarding which primitive is more fundamental. This is unresolvable without external criteria.

  ### E. Developmental Study (Stipulated)
  *Scenario:* Cross-cultural study shows children track objects by spatiotemporal continuity (E-friendly), but adult verdicts on fission split by culture (P-friendly/relativist).
  *   **E's Account:** This is evidence that Endurantism is the default cognitive architecture. Adult divergence is cultural corruption of metaphysical truth.
  *   **P's Account:** This is evidence that persistence conditions are interest-relative or conceptual. Metaphysics should track the adult reflective equilibrium, not infant cognition.
  *   **Prediction:**
      *   **E predicts:** The study will show continuity tracking is universal and pre-linguistic.
      *   **P predicts:** The study will show fission intuitions vary based on linguistic framing, proving persistence is conceptual.
      *   **Commitment:** E agrees that if children *do not* track by continuity, Endurantism loses its phenomenological anchor. P agrees that if adult fission intuitions are *universal* (not split), Perdurantism's relativism is weakened.

  ---

  ## 4. CLOSING ASSESSMENT

  **On Verbality:**
  We acknowledge that a significant portion of our historical debate has been verbal. Specifically, arguments hinging on the definition of "part" (mereological vs. common sense) and the phrase "exists at" (location vs. parthood) are largely notational. If we agree on the spacetime manifold and the distribution of qualities across it, the label we apply to the carrier of those qualities (3D Substance vs. 4D Worm) often fails to generate distinct truth conditions.

  **On Substance:**
  The dispute remains substantive in two areas:
  1.  **Modality:** E and P assign different truth values to counterfactuals involving fission, fusion, and origin. This is not verbal; it is a disagreement about the nature of possibility.
  2.  **Fundamental Category:** E posits "Substance" as a fundamental category. P posits "Process/Region" as fundamental. This is a disagreement about the ultimate furniture of the world, even if the empirical predictions overlap.

  **On Stalemate:**
  We admit that regarding the "Translation Test" scenario, neither side possesses an argument that the other does not already know. If the formalisms are isomorphic, the choice between them reduces to a preference for primitives ("Wholly Located" vs. "Temporal Part"). We have no neutral metric to prove one primitive is superior. We agree to cease arguing that point until new evidence regarding Modality or Kinematics is produced.

  ---

  ## FACILITATOR CONFIDENCE & CAVEAT

  **Overall Confidence:** 85%
  This document accurately maps the dialectical stalemate and isolates the verbal from the substantive based on current analytic metaphysics literature. It forces the specific concessions requested without violating the stipulations.

  **Least Sure Claim:**
  I am least sure about the **Verdict on the Heraclitean Rock (Crux B)**.
  *Reasoning:* Claiming there is a "Substantive Residue" in a world without modals is risky. If de re modals are stripped, the distinction between "one enduring substance" and "a sum of stages" may collapse entirely into a verbal preference for the word "unity." It is possible that without modality, Endurantism has no truth-conditional content left to distinguish it from Perdurantism, making the "Substantive Residue" verdict too generous to the Endurantist.
