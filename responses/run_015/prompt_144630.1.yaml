          *   *Refinement on Wholly Present:* Both agree no non-circular analysis exists *within the opponent's framework*.
          *   *Refinement on Coincidence:* Perdurantism handles fission better; Endurantism handles single-object intuition better.

      *   *Refinement on Cruxes:*
          *   *Heraclitean Rock:* This is the deepest metaphysical point. If modals are gone, is it just "Substance" vs "Sum"? I should frame the verdict as "Substantive only if one privileges Substance ontology."
          *   *Translation Test:* This is the "Verbal Dispute" thesis (Hirsch, etc.). I need to make sure the verdict reflects the tension between ideological parsimony vs. ontological parsimony.

  5.  **Final Review against constraints:**
