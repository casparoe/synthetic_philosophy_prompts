          *   *Claim 5 (Interval Properties):* Both agree motion requires an interval. Endurantist: Object has property *over* interval. Perdurantist: Worm segment has property.

      *   **Section 2: Disagreements Table:**
          *   Need specific wording for each.
          *   *Row 1: Nature of Persistence.* End: Identity. Per: Gen-identity/Parthood.
          *   *Row 2: Ontological Parsimony.* End: Fewer entities (no parts). Per: More uniform ontology (spacetime regions).
          *   *Row 3: The "Wholly" Primitive.* End: Necessary primitive. Per: Analyzable (and analysis fails for End).
