answer: |-
  You have isolated a precise structural failure in the ethics of memory that existing terminology describes only in fragments. The nearest established concepts are Jan Assmann's distinction between *Functional Memory* (lived, identity-forming) and *Storage Memory* (archived, inert), and the psychological concept of *Moral Licensing* (where a good deed permits a subsequent bad one). Assmann describes the transition from functional to storage memory as a natural decay, lacking your specific mechanism of *ethical release*; he does not account for the storage medium actively licensing the decay. Moral Licensing captures the feeling of release but is individual and behavioral, not structural or mnemonic. Neither captures the core feature you identified: that the *persistence* of the record is what *preempts* the human act, creating a simulation of duty fulfilled while the capacity for care atrophies.

  Because no single existing term captures this structural-ethical mechanism, I propose we name it **Commemorative Discharge**.

  Regarding your three questions:

  First, on origin: It does not matter whether the arrangement begins in genuine care (the tape) or systemic indifference (the algorithm). The phenomenon is defined by the *effect* on the community's capacity for care, not the intent of the architects. However, the origin matters diagnostically: genuine care that hardens into discharge is a tragedy of atrophy; systemic indifference is a tragedy of design. Both result in the same ethical vacuum.

  Second, on the duty to remember: The duty is not discharged by a substitute; it is quietly extinguished while producing the phenomenology of discharge. This is worse than straightforward forgetting. Forgetting is a failure of capacity; Commemorative Discharge is a failure of honesty. It allows a society to claim it remembers while behaving as if it has forgotten, masking the ethical loss under the cover of technical fidelity. It is forgetting in bad faith.

  Third, on the virtuous archive: The grievance archive and the village tape are structurally similar but ethically distinct. The separating feature is **Reversibility of Capacity**. In the virtuous case, the archive preserves the *capacity* to remember and act; it merely discourages a specific harmful enactment (violence). The community *could* retrieve the memory and act on it, but chooses vigilance instead. In the village tape, the record *destroys* the capacity (no one can pronounce the names); the community *cannot* retrieve the memory actively even if they chose to. Commemorative Discharge occurs only when the external record causes the internal capacity to atrophy.

  Commemorative Discharge is the structural condition where the persistence of a memory record simulates the fulfillment of ethical duty, licensing the atrophy of active human care.
  \answer{Commemorative Discharge}
