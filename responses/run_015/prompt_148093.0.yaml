answer: |-
  # Joint Statement on Computational Constraints and Normative Theory

  **Preface:** This document represents the outcome of a mediated adversarial collaboration between the **Tractability Constraint (TC) theorist** and the **Norm Autonomist (NA)**. We have identified shared premises, substantive agreements, and precise points of divergence. We agree to treat the shared premises listed in the convening brief as settled background knowledge.

  ## Part I: Agreed Claims

  1.  **Constraint on Cognitive Modeling:** Computational complexity facts constrain the set of normative theories that can plausibly serve as *descriptive models* of human cognition, even if those facts do not logically invalidate the theories as *ideal standards* of correctness.
      *(Confidence: High)*

  2.  **Worst-Case vs. Ecological:** Worst-case hardness results do not entail that inference is intractable for the specific distributions of inputs agents actually encounter; conversely, average-case easiness does not guarantee tractability across all possible environments an agent might face.
      *(Confidence: High)*

  3.  **Meta-Optimality:** Proposals to replace ideal norms with resource-bounded norms (e.g., resource-rationality) typically rely on a higher-order optimization principle to determine the optimal allocation of the bound, rather than abandoning optimization entirely.
      *(Confidence: High)*

  4.  **Dual Function of Norms:** Normative theories serve at least two distinct functions: (a) evaluating the correctness of outcomes or states of belief, and (b) guiding the procedural deliberation of agents. Complexity constraints bear differently on these two functions.
      *(Confidence: High)*

  5.  **Empirical Prerequisite:** Determining the "ecological" distribution of problems is an empirical prerequisite for applying average-case complexity arguments to normative theory; neither side can settle the normative question without settling the empirical distribution question.
      *(Confidence: High)*

  6.  **Regress Problem:** Introducing computational costs into normative theory raises a potential regress regarding the cost of calculating those costs; any bounded normative theory must specify where this regress stops or how it is managed.
      *(Confidence: High)*

  7.  **Approximation Reference:** Approximation algorithms are evaluated by their distance from an ideal solution, implying the ideal retains definitional significance even if it is unattainable in practice.
      *(Confidence: High)*

  8.  **Feasibility Ambiguity:** "Feasibility" admits of both asymptotic definitions (e.g., polynomial time) and concrete definitions (e.g., specific latency constraints or energy budgets), and these definitions may come apart in specific cases.
      *(Confidence: High)*

  9.  **Blamelessness vs. Correctness:** There is a logical distinction between claiming an agent is blameless for failing to meet an impossible norm and claiming the norm itself is incorrect or should be replaced.
      *(Confidence: High)*

  10. **Diagnostic Status:** A norm is *intractability-resilient* relative to a distribution if, for every plausibly ecological distribution of the agent's decision problems, there exists a polynomial-time procedure that comes within ε of meeting the norm on instances drawn from that distribution. Both sides agree this is a well-formed property, but disagree on whether possessing this property is *necessary* for a norm to be valid.
      *(Confidence: High)*

  ## Part II: Disagreements Table

  | Crux | TC Formulation (Tractability Constraint) | NA Formulation (Norm Autonomist) | Agreed Test / Argument | Predictions (TC / NA) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Relevant Distribution** | The only normatively relevant measure over instances is the **ecological distribution** the agent actually faces. The burden is on the NA to show that worst-case scenarios occur frequently enough to matter. | The normative standard must cover an **adversarial or wide support distribution** to ensure robustness. The burden is on the TC to specify the ecological distribution precisely enough to rule out worst-case inputs. | **Case:** A decision-maker faces a hard latency deadline. Instances are empirically easy (average-case poly-time) but worst-case hard. A variant introduces an adversary who selects worst-case inputs based on the agent's method. | **TC:** The norm is valid in the empirical case, invalid in the adversarial case. <br> **NA:** The norm is valid in both; the agent fails in the adversarial case but is not blameworthy if the adversary was unforeseeable. |
  | **2. Normative Status of Intractability** | Intractability functions as a reason to **replace** the norm's content. If a norm cannot be computed, it is the wrong norm for this agent. | Intractability functions as an **excuse** for noncompliance. The norm remains correct, but the agent is exempt from blame when compliance is computationally impossible. | **Case:** Empirical comparison where resource-rational and Bayesian predictions diverge for a real task. Each side specifies which result counts against them. | **TC:** If agents match Bayesian predictions on hard tasks, TC is falsified (agents shouldn't be able to do that). <br> **NA:** If agents match Bayesian predictions on hard tasks, NA is vindicated (agents approximate the ideal well). |
  | **3. Hostage to Mathematics** | If a task common in the real environment were proved hard on the actual ecological distribution, the normative theory requiring that task must be **rejected**. | If a task were proved hard, the normative theory stands; agents are simply **limited**. If P=NP with small constants, the TC position loses its primary motivation but the NA position remains unchanged. | **Scenario:** P is proved equal to NP with small exponents/constants, making previously hard inference tasks tractable. | **TC:** This would vindicate Bayesian norms as implementable, reducing the need for replacement norms. <br> **NA:** This changes nothing about the normative status; it only changes the implementation landscape. |
  | **4. Meta-Level Regress** | The regress stops at a **heuristic level** that is biologically or architecturally fixed. We do not need to optimize the optimizer infinitely; we stop where the hardware begins. | The regress does not arise for **ideal norms** because ideals do not require computation. For bounded norms, the regress is solved by accepting that the "optimal bound" is itself an idealization. | **Argument:** Calculating the resource-rational policy is itself computationally hard. Who computes the meta-policy? | **TC:** The meta-policy is approximated by evolutionary or learning processes, not real-time computation. <br> **NA:** The meta-policy is a theoretical construct for evaluation, not a procedure the agent runs. |
  | **5. Definition of Feasible** | "Feasible" means **within the agent's actual budget** (e.g., milliseconds, energy), regardless of asymptotic class. A polynomial algorithm that takes too long is infeasible. | "Feasible" means **polynomial-time** (or tractable class). Concrete budgets are engineering constraints, not normative boundaries. | **Case:** An algorithm is O(n^3) but exceeds the latency deadline for the specific input sizes encountered. | **TC:** The norm requiring this algorithm is invalid for this agent. <br> **NA:** The norm is valid; the agent's hardware is insufficient. |

  ## Part III: Closing Analysis

  **Verbal vs. Genuine Disagreements**
  We conclude that a significant portion of the quarrel is verbal, centering on the definition of "normative theory." When the TC speaks of a "norm," she refers to a *procedure guide* for bounded agents. When the NA speaks of a "norm," he refers to an *evaluative standard* for belief or action quality. Once this distinction is made explicit (see Claim 4), much of the friction dissolves: the TC is arguing about *procedural norms*, while the NA is defending *evaluative norms*. However, a genuine disagreement remains regarding **Crux 2 (Replace vs. Excuse)**. Even if we agree on the definitions, the TC insists that procedural norms *must* replace evaluative norms in psychological theory to avoid misleading predictions, while the NA insists that retaining the evaluative norm is necessary to explain *why* the heuristic is chosen (as an approximation of the ideal). This is not merely verbal; it dictates different research programs.

  **Least Certain Point**
  The point where I am least certain I have accurately represented the collaboration's potential resolution is **Crux 4 (Meta-Level Regress)** regarding the TC's stopping condition. I have extrapolated that the TC would accept "biologically fixed heuristics" as a regress-stopper. A real defender of the TC might demand a normative account of *why* those heuristics are the right ones to stop at, which risks restarting the regress. Conversely, the NA's claim that the regress "does not arise for ideal norms" may strike the TC as begging the question: if the ideal norm cannot be used to select the heuristic, what work is it doing? I have legislated this as a difference in "theoretical construct" vs. "real-time computation," but this is the place where a real collaboration would likely stall pending an empirical account of meta-cognitive costs that neither side currently possesses. I am extrapolating here beyond what the positions strictly commit their holders to, assuming a compatibility between evolutionary explanations and normative justification that both sides might reject upon scrutiny.
