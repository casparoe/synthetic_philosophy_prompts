      *   **Role:** Expert on AI alignment and philosophical decision theory (professional-philosopher-of-action caliber).
      *   **Task:** Attack the user's thesis (Surrogate Goals + Acausal Threats are one problem; Hard/Soft surrogates fail differently but fundamentally).
