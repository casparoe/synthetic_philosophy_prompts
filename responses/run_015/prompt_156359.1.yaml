answer: |-
  This is a fantastic question. As a biologist, your instinct to scrutinize the boundary between the model (the fluid) and the system (the economy) is exactly the right approach. In the history of economic thought, Hume's *Of Money* (published in *Political Discourses*, 1752) is a pivot point, and your suspicion that the hydraulic analogy is doing heavy lifting is correct.

  To answer your primary question directly: **It is not merely a casual metaphor.** For Hume and his Enlightenment contemporaries, it was a **mechanical model.**

  However, you are also right to sense a gap. The conclusion (that trade balances automatically) relies on human incentives (price signals), while the analogy relies on physics (gravity/pressure). Here is a parsing of the passage, separating the hydraulic image from the economic argument, keeping your thermodynamics baggage at the door.

  ### 1. The Intellectual Context: Newtonian Social Science
  In the mid-18th century, "science" meant Newtonian mechanics. Philosophers were obsessed with finding the "laws of motion" for society. When Hume compares money to water in connected vessels, he isn't just being poetic; he is proposing that society obeys deterministic, equilibrium-seeking laws similar to physical systems.

  He was writing against **Mercantilism**, the dominant theory of his day, which argued that a nation's power depended on hoarding gold (specie). Mercantilists wanted the water to stay in their vessel. Hume used the hydraulic analogy to prove that was physically impossible in a connected system.

  ### 2. Where the Image Ends and the Argument Begins
  This is the crux of your inquiry. Here is how to disentangle them:

  **The Hydraulic Image (The "What"):**
  *   **The Setup:** Nations are vessels; money is water; trade channels are pipes.
  *   **The Mechanism:** Gravity. If water is higher in one vessel, pressure forces it to the lower one until levels equalize.
  *   **The Implication:** Equilibrium is inevitable and passive. The water has no choice but to flow.

  **The Economic Argument (The "How"):**
  *   **The Setup:** Nations are markets; money is currency; trade channels are commercial routes.
  *   **The Mechanism:** **The Price-Specie Flow Mechanism.** This is the actual logic underneath the water.
      1.  If Nation A accumulates excess gold, the money supply increases.
      2.  According to the **Quantity Theory of Money** (which Hume champions), more money chasing the same goods causes inflation (prices rise).
      3.  Nation A's goods are now more expensive than Nation B's goods.
      4.  Merchants (acting on self-interest, not gravity) stop buying from A and start selling to A.
      5.  Gold flows out of A to pay for the imports.
  *   **The Implication:** Equilibrium is reached through **price incentives**, not physical pressure.

  **The Disconnect:**
  The hydraulic analogy hides the **price signal**. In Hume's vessels, the water flows because of *height*. In Hume's economy, the gold flows because of *profit margins*.
  *   **Image:** Passive fluid.
  *   **Argument:** Active merchants reacting to inflation.

  If you remove the human element (merchants noticing price differences), the economic argument collapses. If you remove gravity, the hydraulic argument collapses. Hume uses the fluid image to make the human behavior seem as inevitable as gravity, but they are not the same thing.

  ### 3. The "Friction" and the Closed Loop
  You noted Hume mentions "friction." In the essay, he acknowledges that the level doesn't equalize instantly.
  *   **In Hydraulics:** Friction is physical resistance in the pipe.
  *   **In Economics:** Friction represents transport costs, tariffs, information lag, and government intervention.

  **Your concern about the "Closed Loop":**
  You are correct that the real economy isn't a closed loop of incompressible liquid.
  1.  **Credit:** Hume largely ignores paper credit in this specific essay (focusing on specie/gold). He treats money as a commodity with intrinsic value. In a credit-based system, the "volume" of the fluid can expand without new gold entering the vessel. Hume's model struggles here.
  2.  **Production:** Hume distinguishes between **Money** (the fluid) and **Wealth** (the goods/industry). His argument is that you cannot hoard *money*. He does *not* argue that you cannot increase *wealth*. A nation can become richer by producing more goods, even if the level of "water" (gold) remains the same.
      *   *Biologist's translation:* The container size (economic capacity) can grow, even if the water level (price/money supply) stays relative to neighbors.

  ### 4. Does the Conclusion Stand Without the Analogy?
  **Yes, but with caveats.**
  The conclusion that "no country can permanently hoard gold" stands on the logic of **arbitrage**, not hydraulics. As long as:
  1.  Money supply affects prices (Quantity Theory).
  2.  Prices affect trade balances.
  3.  Merchants seek profit.

  ...then gold will flow out of a high-price nation. The hydraulic analogy is rhetorical armor; it makes the argument feel like a law of nature rather than a observation of human behavior.

  However, the conclusion that "national wealth automatically balances" is **false** in the long run, and the analogy masks why.
  *   **Hume's Error:** He assumes labor and capital are immobile and that technology is static.
  *   **Reality:** Nations can maintain trade surpluses (keeping the water high) through productivity advantages, innovation, or capital controls. The "vessels" aren't identical; some have pumps (industry/tech) that keep the level up.

  ### 5. Summary for the Biologist
  To parse the passage without importing thermodynamics:

  1.  **Treat the Fluid Analogy as a Heuristic:** Hume uses it to visualize **equilibrium**. He is arguing against a static view of wealth (hoarding) with a dynamic view (circulation).
  2.  **Identify the Independent Variable:** In the analogy, it is volume/height. In the argument, it is **Price**.
  3.  **Locate the Causal Mechanism:** The argument does not rely on the fluid properties of gold. It relies on the **elasticity of demand**. If prices rise, demand for exports falls. That is the engine, not the "fluidity" of money.
  4.  **Acknowledge the Boundary:** The image ends where **credit** and **production** begin. Hume admits money is "nothing but the representation of labor and commodities." The fluid is just the oil in the machine; the machine itself is industry.

  **Verdict:** Hume is borrowing the *prestige* of hydraulics to lend certainty to his economic theory. The core argument (Price-Specie Flow) is logical and stands on incentives, but the hydraulic metaphor oversimplifies the system by ignoring credit expansion and productivity growth. It is a "closed system" model applied to an open, evolving system.

  Your instinct is spot on: The analogy makes the theory feel more robust than it actually is by hiding the friction of human institutions and the expandability of credit.
