      *   *The Analogy:* The "water level" analogy is famous. Hume imagines nations as connected vessels. If you raise the water (money) in one, it flows out until levels equalize.
      *   *Hydraulics in the 18th Century:* Hydraulics was a developing science (Bernoulli published *Hydrodynamica* in 1738). Hume was well-read in Newtonian science. It's likely more than a "casual" metaphor; it's a *mechanical* model of society.
