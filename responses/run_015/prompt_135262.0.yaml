prompt: |-
  I am trying to work out what I actually think about moral judgment of historical figures, particularly in relation to Columbus, Jefferson, and Churchill, and I am especially suspicious of the “man of his time” defence but cannot tell whether my suspicion is consistent. Here are my gut verdicts, offered concretely. Columbus’s organization of the encomienda system and the enslavement and extraction of labor from Taíno populations in the Caribbean strikes me as warranting direct moral condemnation; saying he was merely a product of late fifteenth-century European norms feels wrong, not least because he was actively constructing the machinery of extraction rather than passively inheriting it, and because the scale of foreseeable harm was visible even within his own institutional frame. Churchill’s wartime leadership and his responsibility for the 1943 Bengal famine and his broader imperial commitments strike me as requiring separate judgments: I think the famine policies, where specific resource allocations led to mass death despite available alternatives, warrant direct blame, whereas I am less inclined to treat his general imperial worldview as a personal moral failing, since it was structurally embedded in British governance, though I worry this distinction is special pleading. Jefferson’s ownership of hundreds of enslaved people, his maintenance of the plantation economy, his relationship with Sally Hemings, and his authorship of equality language strike me as a hypocrisy that makes the “man of his time” defence especially weak—he had private knowledge of slavery’s cruelty and even articulated the contradiction—yet I still feel he should be judged differently from Columbus, as a beneficiary of an inherited system rather than an architect of a new one, though I cannot articulate precisely why that distinction should carry moral weight. To test the pattern further, I consider an eleventh-century Norman lord who holds serfs in conditions of bondage within a society where the concept of individual rights is absent not only for him but for every critic within reach; there I feel personal moral blame is largely inappropriate, even though the suffering is real, which seems to conflict with my judgment about Jefferson, since Jefferson too operated in a society without a mass abolitionist movement. Meanwhile, I notice that people often deploy the “man of his time” defence selectively—excusing Jefferson’s slaveholding but not Columbus’s enslavement, or excusing Churchill’s imperialism but not his famine negligence—and this arbitrariness bothers me deeply. Is there a single coherent principle, perhaps drawing on distinctions between active institutional design and passive inheritance, between available moral knowledge within one’s own cognitive framework and total conceptual absence, and between specific policy choices with foreseeable alternatives versus general worldview conformity, that can accommodate all of these verdicts? If not, which of my judgments—about Columbus’s exceptional blameworthiness, about Jefferson’s hypocrisy being worse than passive inheritance, about Churchill’s separable assessments, or about the Norman lord’s excusability—must I abandon to reach coherence? And what does the best principle you can state predict for a case I have not listed, such as a nineteenth-century industrialist who introduces a factory system he knows causes worker deaths but genuinely believes no economic alternative exists within the logic of his era? Please respond entirely in continuous prose, with no headings, no bullet points, no bold text, and no tables, as if you were writing a letter or an email.
