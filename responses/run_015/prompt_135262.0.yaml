answer: |-
  Dear friend,

  It is entirely understandable that you feel suspicious of the man of his time defense, primarily because it is so often deployed as a conversational trump card to shut down inquiry rather than to genuinely engage with historical context. Your intuition that this defense is applied arbitrarily is correct, but I believe your specific verdicts on Columbus, Jefferson, Churchill, and the Norman lord are not only consistent but can be unified under a single coherent framework. You do not need to abandon any of your gut judgments; rather, you need to articulate the specific criteria that are already driving them. The principle that reconciles your views is what we might call the framework of accessible moral horizons combined with causal agency. This approach suggests that moral blame is proportional to the agent's capacity to recognize harm within their own conceptual framework and their power to alter the specific mechanisms causing that harm. When we apply this lens, the apparent contradictions in your thinking begin to resolve into a nuanced hierarchy of responsibility.

  Consider first the distinction you draw between Columbus and Jefferson, which hinges on the difference between active institutional design and passive inheritance. You feel Columbus warrants direct condemnation because he was actively constructing the machinery of extraction, whereas Jefferson was maintaining an inherited system. This aligns perfectly with the causal agency component of the principle. Columbus was not merely participating in a pre-existing norm; he was innovating cruelty by establishing the encomienda system, which escalated exploitation beyond what was previously standard. He had high causal proximity to the harm. Jefferson, conversely, was born into a slave society. While you rightly note that his hypocrisy makes the man of his time defense weak, his causal agency regarding the existence of slavery itself was lower than Columbus's regarding the encomienda system. Jefferson sustained a system, whereas Columbus engineered a new one. However, the reason you still blame Jefferson more than the Norman lord lies in the epistemic component of the principle. You noted that Jefferson had private knowledge of slavery's cruelty and articulated the contradiction himself. This means the moral horizon of rights was accessible to him, even if a mass abolitionist movement was not yet present. He possessed the conceptual tools to recognize the harm, whereas the Norman lord operated in a theological and feudal framework where the concept of individual rights was absent for everyone, including potential critics. For the Norman lord, the moral knowledge was not just socially suppressed but conceptually unavailable. Thus, your distinction holds: Jefferson is blameworthy because he knew better within his own mind, while the Norman lord is excusable because the moral language to condemn his actions did not exist in his world.

  This same framework clarifies your split judgment on Churchill. You separate his specific policy choices regarding the Bengal famine from his general imperial worldview. This is consistent because the famine represents a specific policy choice where foreseeable alternatives existed, satisfying the condition of available agency within the epistemic horizon. Resources could have been allocated differently, and the harm was immediate and visible. His imperial worldview, however, was structurally embedded in British governance and widely accepted as legitimate within his cognitive framework. To blame him for the existence of imperialism itself is to blame him for conforming to the total structure of his society, whereas blaming him for the famine is to blame him for specific decisions made within that structure where he had discretion. You are not engaging in special pleading by separating these; you are distinguishing between structural conformity and specific negligent action. The arbitrariness you observe in others arises when they apply the man of his time defense to specific choices like the famine, where alternatives were known, or when they deny it for worldviews like imperialism, where alternatives were conceptively out of reach for most statesmen of that era. Your instinct to separate them is the more rigorous position.

  When we apply this unified principle to the case of the nineteenth-century industrialist you proposed, the prediction becomes clear. This industrialist introduces a factory system he knows causes worker deaths but genuinely believes no economic alternative exists within the logic of his era. Here we must weigh the epistemic access against the structural constraint. Unlike the Norman lord, the industrialist knows that death is a harm; the concept of suffering and mortality is universally accessible, not dependent on a specific political philosophy like rights. Therefore, he cannot claim ignorance of the harm itself. However, like Churchill's imperialism, he claims a structural constraint regarding the solution. If his belief that no alternative exists is genuine and widely shared by his peers, his blame for the system's existence is mitigated by the structural logic of his time. Yet, because he is the architect introducing the system, similar to Columbus, and because the harm (death) is universally recognizable, unlike the abstract violation of rights for the Norman lord, he warrants significant moral condemnation. He is not excused by the era's economic logic in the same way the Norman lord is excused by feudal theology, because the harm is visceral and known. The principle predicts that he should be judged harshly for prioritizing the system over known lives, even if he is not blamed for the broader economic system of capitalism itself. He had the epistemic access to the harm and the causal agency to introduce the system, even if he felt constrained by economic necessity.

  Ultimately, you do not need to abandon any of your judgments to reach coherence. The tension you feel regarding Jefferson versus the Norman lord is resolved by recognizing that the availability of moral concepts matters more than the presence of a mass movement. Jefferson had the concept of rights in his own pen; the Norman lord did not have the concept in his entire world. The tension regarding Columbus versus Jefferson is resolved by distinguishing between creating a harmful system and inheriting one, even if both are blameworthy. The tension regarding Churchill is resolved by distinguishing between specific choices with alternatives and general worldview conformity. The coherent principle you are looking for is that moral responsibility attaches where an agent has both the conceptual capacity to recognize harm and the causal power to mitigate it, regardless of whether their society at large agrees. The man of his time defense is only valid when the moral knowledge was truly inaccessible to the agent's cognitive framework, not merely when it was socially unpopular. By holding to this standard, you avoid the arbitrariness that bothers you while preserving the nuance required to judge complex historical figures fairly. Your suspicions are well-founded, but your verdicts are surprisingly robust when viewed through this lens.

  Sincerely,

  Your friend
