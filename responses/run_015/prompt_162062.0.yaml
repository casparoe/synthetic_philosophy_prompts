  **LOCATING THE DISAGREEMENT: A Decision Tree**
  *Answer sequentially. No skipping. No "It depends."*

  1. Is the question empirically resolvable, or purely terminological?
     └─ Terminological → **LEAF: Dissolution** (Verbal dispute; dissolve don't solve)
     └─ Resolvable → Q2

  2. Must we inspect weights/activations before verdict?
     └─ Yes → **LEAF: Mechanistic** (Verdict withheld until internals parsed)
     └─ No → Q3

  3. Does correct text on counterfactual kitchen questions require sensory history?
     └─ Yes → **LEAF: Grounding** (Symbol manipulation insufficient without embodiment)
     └─ No → Q4

  4. If internals are retrieval+template but outputs pass all probes, is it understanding?
     └─ No → **LEAF: Denial** (Fancy pattern matching; no understanding here)
     └─ Yes → Q5

  5. If competence collapses under adversarial paraphrase, does it belong to the data authors?
     └─ Yes → **LEAF: Borrowed** (Competence belongs to training data creators)
     └─ No → Q6

  6. If it can't revise via context or steer action, is it answerable?
     └─ Yes → **LEAF: Answerable-to** (Understanding requires normative status, not just continuation)
     └─ No → Q7

  7. Does "understanding" require phenomenology (something it is like)?
     └─ Yes → **LEAF: Yes-but-Alien** (Real competence, nothing it is like)
     └─ No → **LEAF: Behaviorist** (Functional success suffices)

  **Notes & Logical Space:**
  *   **Cases:** Kitchen (Q3); Retrieval (Q4); Steering/Revision (Q6); Adversarial (Q5).
  *   **Indistinguishable:** Behaviorist vs. Alien often collapse in practice; separated only by phenomenological commitment.
  *   **Empty Cells:** None. All logical combos mapped to plausible positions.
  *   **Distinction:** "Answerable-to" earns Q6. It separates normative accountability from mere output accuracy (steering/revision). Without it, Q6 collapses into Q4.
  *   **Annoyance Check:** If you aren't annoyed by Q5 or Q6, you haven't answered honestly.
