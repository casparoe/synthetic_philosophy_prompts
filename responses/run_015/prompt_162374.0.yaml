answer: |-
  # Seminar Activity: The Critic's Wager

  ## Materials
  *   **Poker Chips:** 20 per student (currency).
  *   **Index Cards (White):** 3 per student (betting slips: "Yes", "No", "Pass").
  *   **Index Cards (Colored):** 2 per student (labeled "Verdict" and "Preference").
  *   **Envelopes (Sealed):** 14 identical "Critic Reports" (one per student).
  *   **Envelopes (Sealed):** 2 large "Art Works" (Image A, Image B) kept by instructor.
  *   **Instructor Key:** A sealed envelope containing the "Master Verdict" (which image is canonically "better" by pre-set criterion) and the "Calibration Truths".
  *   **Board:** To track the Critic's live calibration score.

  ## Rules & Payoff
  1.  **Currency:** Chips represent epistemic confidence. 1 chip bet returns 2 if correct. 0 if wrong. "Pass" retains chips.
  2.  **The Critic:** All information comes from a single source ("The Critic") via the envelopes.
  3.  **Calibration:** The Critic judges objective facts. Students see the results live.
  4.  **Target Rounds:** The Critic judges the sealed Art Works.
      *   **Verdict Claim:** "Image A is aesthetically superior to Image B." (Truth = Master Key).
      *   **Predictive Claim:** "You will prefer Image A upon seeing it." (Truth = Your own vote).
  5.  **Understanding Check:** After Art reveal, before payoff, students must write one sentence justifying the verdict on a card. If they cannot, they surrender 1 chip (penalty for empty belief).

  ## Minute-by-Minute Timeline

  **00–05: Setup**
  Distribute chips and envelopes. Explain payoff. Emphasize: "Your goal is to maximize chips. The Critic's history is in your envelope."

  **05–20: Calibration (The Control)**
  *   **Action:** Instructor holds up a sealed card (e.g., a paragraph).
  *   **Report:** Students open Envelope 1: "Critic says: This paragraph has >50 words."
  *   **Track Record:** Envelope includes a log: "Previous 10 trials: 8 Correct."
  *   **Bet:** Students bet chips on True/False.
  *   **Reveal:** Instructor counts words. Critic was right.
  *   **Repeat:** 3 times total (varying tasks: word count, dot count, weight comparison).
  *   **Result:** Students verify the 80% hit rate is real. Betting is "free money." Most students bet heavily.

  **20–35: Round 1 (Aesthetic Verdict)**
  *   **Action:** Instructor places two sealed art envelopes (A & B) on the table. No one sees inside.
  *   **Report:** Students open Envelope 2: "Critic says: Image A is aesthetically superior to Image B."
  *   **Track Record:** Log reads: "Previous 10 trials on Art Quality: 8 Correct (Verified by Master Key)."
  *   **Bet:** Students bet chips on whether the claim is *True* (matches Master Key).
  *   **Constraint:** They cannot look at the art.
  *   **Observation:** Watch for hesitation. Many will "Pass" or bet low despite identical 80% stats to Calibration.

  **35–45: Round 2 (Aesthetic Prediction)**
  *   **Action:** Same sealed art envelopes.
  *   **Report:** Students open Envelope 3: "Critic says: You will prefer Image A."
  *   **Track Record:** Log reads: "Previous 10 trials on Subject Preference: 8 Correct."
  *   **Bet:** Students bet chips on whether *they* will prefer A when revealed.
  *   **Observation:** Betting should increase compared to Round 1.

  **45–55: Reveal, Understanding Check & Payoff**
  *   **Reveal:** Open Art A and Art B. Display them.
  *   **Understanding Check:** Students write *why* A is better (if they bet True) or why they prefer A. If they write "Because the Critic said so," they pay a 1-chip penalty.
  *   **Preference Vote:** Students privately vote A or B.
  *   **Payoff:** Settle Verdict bets (against Master Key) and Prediction bets (against their own vote).

  **55–75: Debrief**
  (See below)

  ## Debrief Guide

  **1. Map the Hesitation (Constraint 1)**
  Ask: "In Calibration, 80% reliability was a license to print chips. In Round 1 (Verdict), the stats were identical. Why did your betting drop?"
  *   **Target Insight:** Isolate the variable. It wasn't reliability decay; it was subject matter. You felt you *couldn't* know the truth via testimony, even if the testimony was reliable. This is **Aesthetic Testimony Pessimism**.

  **2. Separate the Claims (Constraint 2)**
  Ask: "Who bet more aggressively in Round 2 (Prediction) than Round 1 (Verdict)?"
  *   **Mapping:**
      *   **Round 1 (Verdict):** Claims about *objective value* ("It is good"). Pessimism strikes here. You feel you cannot inherit the *knowledge* of value.
      *   **Round 2 (Prediction):** Claims about *your response* ("You will like it"). Optimism holds here. Testimony about psychological facts (your future state) works fine.
      *   **Understanding Check:** Ask those who won the Verdict bet: "Did you feel you *understood* the goodness before seeing the art?" (Likely no). "Do you see it now?" (Maybe). This isolates **Understanding** vs. **Knowing**.
      *   **Recognition:** Ask those who voted against the Verdict upon reveal: "Did the testimony fail to make you *recognize* the quality?" This isolates **Acquaintance**.

  **3. Steelman the Optimist**
  Argument: "If the Critic is 80% reliable, believing them is statistically rational. Refusing to bet is irrational risk-aversion. Aesthetic facts are just facts. If you trust a weather report (prediction), why not a quality report (verdict)? The difference is merely psychological discomfort, not epistemic justification."

  **4. Predictable Failures & Fixes**
  *   **Failure:** Students bet max on Round 1 anyway (treating it like Calibration).
      *   **Fix:** In debrief, ask: "If you had to defend this judgment to a peer without showing them the art, could you?" Re-introduce the social norm of aesthetic autonomy.
  *   **Failure:** Students claim the Art "Truth" is fake because it's instructor fiat.
      *   **Fix:** Acknowledge this. "The game stipulates a truth to allow payoff. The philosophical dispute is whether such truth *exists* independent of response. Pessimists often deny the premise; Optimists accept it."
  *   **Failure:** Confusion between Verdict and Prediction.
      *   **Fix:** Explicitly write on board: "It is Good" (Verdict) vs. "You will Like" (Prediction).

  **5. Limitations (What the Game Cannot Do)**
  *   **The Metaphysics:** The game stipulates an aesthetic truth (Master Key) to allow payoff. It cannot reproduce the metaphysical worry that aesthetic properties *are* response-dependent, making testimony conceptually incoherent rather than just unreliable.
  *   **The Norm:** It cannot fully simulate the *normative* pressure (it's *bad* to judge without seeing) vs. the *epistemic* inability (you *can't* know without seeing). You must supply this distinction verbally.
  *   **The "Why":** The penalty for "Because the Critic said so" simulates the lack of understanding, but cannot reproduce the actual phenomenological gap of lacking first-hand experience.

  \answer{The stipulated identity of statistical reliability across non-aesthetic and aesthetic claims.}
