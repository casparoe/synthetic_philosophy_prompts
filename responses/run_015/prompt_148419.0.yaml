  Your practice is a pragmatic hybrid of the very traditions you cite. You act as a Langean planner for non-market goods, simulating a market through accounting prices, while deferring to Hayekian markets for the allocation of production factors. This is not a contradiction, but a division of labour. You use shadow prices to value *ends* (life, carbon, time) where political or ethical constraints prevent a market, but you rely on real markets to determine the *means* (steel, nurses) because the information required to allocate those efficiently is too dispersed to simulate.

  This works at the margin precisely because it is at the margin. Your shadow prices are not generated in a vacuum; they are imputed from existing market signals elsewhere in the economy. The value of an hour of time is anchored to wage rates; the cost of carbon is anchored to trading schemes or abatement costs. You are not proving Lange right about a whole economy; you are demonstrating that accounting prices function effectively when parasitic on a real price system that provides the underlying vector of relative scarcities. Without the real market backbone to ground your opportunity costs, your shadow prices would lack anchors and drift into arbitrariness.

  Regarding your wrinkle: swapping shadow prices for AI predictions solves the calculation problem but leaves the incentive and discovery problems untouched. The Mises–Hayek objection was never solely about the ability to compute equilibrium prices. It was about the market as a discovery procedure. Real prices incentivise agents to find new ways to reduce costs or satisfy preferences, generating knowledge that did not previously exist. A model, no matter how sophisticated, predicts based on past behaviour or stated preferences; it cannot anticipate the innovations that change the rules of the game. Your costings assume a static world where values are knowable; markets operate in a dynamic world where values are created.

  Therefore, your practice does not require you to accept the Hayekian view that prices are emergent signals of dispersed knowledge. Instead, it requires you to treat prices as static parameters that reflect underlying truths about value and scarcity, which can be estimated by an analyst. You are treating prices as measures rather than messages.

  \answer{Prices are imputable measures of scarcity}
