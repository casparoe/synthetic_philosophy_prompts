      *   **Key Conditions:** Treat Wegener and critics as epistemic peers (identical data access, divergent prior weightings of mechanism vs. correlation).
      *   **Tasks:**
          1.  Apply Conciliationism: What should each side do to credence/assessment?
          2.  Apply Steadfastness: What should each side do to credence/assessment?
          3.  Distinguish disagreement about data vs. evidential threshold/standards of proof.
          4.  Consider 1960s vindication (seafloor spreading/plate tectonics): Does this show failure to conciliate, justification for steadfastness, or misfire of norms?
          5.  Conclusion: What does this suggest about the scope of peer-disagreement norms?
      *   **Constraint:** Lead with the bottom line in the first sentence. No preamble. No restating the question.

  2.  **Deconstruct the Case Study:**
      *   **Wegener:** Had correlational evidence (fit, fossils, glaciers). Lacked a plausible mechanism (thought continents plowed through oceanic crust).
      *   **Critics (e.g., Harold Jeffreys):** Had established geophysical models (rigid Earth, strength of oceanic crust). Agreed on data (fit, fossils) but disputed interpretation/causality. Demanded a mechanism consistent with physics.
      *   **Epistemic Status:** Were they peers? In terms of raw data access, yes. In terms of specific expertise? Wegener was a meteorologist/astronomer; critics were geophysicists/geologists. The prompt asks me to *treat* them as epistemic peers with identical access but divergent priors. I must adhere to this constraint for the analysis, even if historically there were expertise asymmetries.
      *   **The Disagreement:** Not about the existence of the fossils or the fit (data), but about whether correlational evidence outweighs the lack of a mechanism (standards of proof/inference to the best explanation).

  3.  **Apply Norms:**
      *   **Conciliationism:** When peers disagree, you should significantly lower confidence in your view.
          *   *Wegener:* Should have lowered credence that drift was *proven*, acknowledged the mechanism problem more seriously.
          *   *Critics:* Should have lowered credence that drift was *impossible*, acknowledged the correlational strength more seriously.
          *   *Result:* Both move toward agnosticism or a "wait and see" position.
      *   **Steadfastness:** You can maintain confidence if you have reasons to think the peer is mistaken (e.g., they are weighing evidence incorrectly).
          *   *Wegener:* Could remain steadfast if he believed the correlational evidence was so strong it outweighed the missing mechanism.
          *   *Critics:* Could remain steadfast if they believed physical impossibility trumps correlational coincidence.
          *   *Result:* Both maintain positions, digging in based on their prior weightings.

  4.  **Analyze the 1960s Vindication:**
      *   Plate tectonics provided the mechanism (mantle convection/seafloor spreading) Wegener lacked.
      *   Wegener was right about the *fact* (continents move), wrong about the *mechanism*.
      *   Critics were right about the *mechanism* (his was impossible), wrong about the *fact* (they thought movement was impossible).
      *   *Implication for Norms:*
          *   Did critics fail to conciliate? Maybe. If they had lowered credence, they might have investigated the mechanism problem more open-mindedly earlier.
          *   Was Wegener right to be steadfast? He was right about the conclusion, but his reasoning was incomplete.
          *   Do norms misfire? The dispute was largely about *standards of proof* (mechanism vs. correlation) rather than direct observation. Conciliationism often assumes shared standards of inference. If standards differ, conciliation is harder.

  5.  **Drafting the Bottom Line:**
      *   Need a concise summary of the conclusion.
      *   *Draft 1:* The Wegener episode shows that peer disagreement norms struggle when the conflict is over inferential standards rather than data, suggesting steadfastness was rational for both sides given their priors until new data arrived.
      *   *Draft 2:* The continental drift controversy demonstrates that conciliationism and steadfastness both misfire when disagreement stems from divergent standards of proof rather than contradictory evidence, implying that epistemic norms require shared inferential frameworks to function effectively.
      *   *Selection:* Draft 2 is stronger on the philosophical implication.

  6.  **Developing the Reasoning:**
      *   *Setup:* Define the peer status as requested (same data, different priors on mechanism vs. correlation).
      *   *Conciliationism:* Requires splitting the difference. Wegener should have admitted the mechanism gap was more damaging; Critics should have admitted the correlations were less likely to be chance. Both should have hovered around 50% credence.
      *   *Steadfastness:* Allows maintaining credence if one judges the other's weighting as irrational. Wegener weighs pattern recognition higher; Critics weigh physical consistency higher. Both can claim the other is violating rational norms of inference.
      *   *The 1960s Turn:* The discovery of seafloor spreading resolved the mechanism issue. It vindicated Wegener's conclusion but validated the Critics' demand for a mechanism.
      *   *Evaluation:* This suggests the disagreement wasn't purely about data but about *what counts as sufficient evidence*. Conciliationism assumes peers share reasoning standards. If standards differ (correlation vs. mechanism), conciliation is ambiguous. Steadfastness explains why they held firm, but doesn't explain why one was ultimately "more right" about the fact.
      *   *Conclusion on Scope:* Norms of peer disagreement presuppose a shared framework of inference. When paradigms clash (Kuhnian incommensurability-lite), these norms lose traction. The obligation is not necessarily to conciliate on the conclusion, but to recognize the incompleteness of the shared evidential base.

