answer: |-
  The continental drift controversy demonstrates that normative frameworks for peer disagreement misfire when the conflict concerns divergent standards of proof rather than contradictory data, implying that epistemic norms require shared inferential frameworks to function effectively. Under conciliationism, treating Wegener and his critics as epistemic peers with identical data access requires both parties to significantly downgrade their credence upon recognizing the disagreement. Wegener should have reduced his confidence that continental mobility was a settled fact, assessing his critics as raising a valid defeater regarding the physical mechanism, while the mainstream geologists should have lowered their confidence in the fixity of continents, assessing Wegener as highlighting correlations too strong to be dismissed as chance. Both sides would converge toward agnosticism, viewing the hypothesis as promising but unproven, effectively splitting the difference between Wegener's high confidence in the pattern and the critics' high confidence in the physical impossibility.

  Under steadfastness, each side maintains their credence by arguing that the other is mishandling the shared evidence due to divergent prior weightings. Wegener remains steadfast by prioritizing empirical correlations over theoretical completeness, assessing the critics as overly constrained by established models that might be incomplete, while the critics remain steadfast by prioritizing physical consistency over geological correlation, assessing Wegener as speculative for proposing a phenomenon lacking a causal engine. Here, the disagreement is not about the data itself, which is shared, but about the evidential threshold required to overturn a dominant paradigm; each side views the other as failing to meet the correct standard of proof, thereby justifying the refusal to adjust credence despite the peer status.

  The 1960s vindication via plate tectonics complicates the evaluation of these norms, showing Wegener was correct about the phenomenon but incorrect about the mechanism, while the critics were correct about the insufficiency of Wegener's physics but incorrect about the impossibility of the phenomenon. This outcome suggests neither side failed an obligation to conciliate, nor was steadfastness uniquely vindicated; rather, the dispute was fundamentally about competing standards of inference. The critics were rational to demand a mechanism, and Wegener was rational to trust the data, but they lacked a shared metric for weighing mechanism against correlation. Consequently, the episode suggests that peer-disagreement norms have limited scope when applied to paradigm shifts involving incommensurable standards of proof. Conciliationism and steadfastness presuppose that peers agree on how evidence supports theory, but when the disagreement concerns the hierarchy of evidence itself, these norms cannot dictate a unique rational response. The obligation in such cases is not necessarily to adjust credence toward a peer's view, but to recognize that the shared evidential base is insufficient to resolve the conflict without new types of data.
