      Body:
      Under conciliationism, treating Wegener and his critics as epistemic peers with identical data access requires both parties to significantly downgrade their credence upon recognizing the disagreement. Wegener should have reduced his confidence that continental mobility was a settled fact, acknowledging that the lack of a plausible mechanism constituted a serious defeater given his peers' rejection. Conversely, the mainstream geologists should have lowered their confidence in the fixity of continents, acknowledging that the trans-oceanic correlations were unlikely to be mere coincidence given Wegener's persistence. Both sides would converge toward agnosticism, viewing the hypothesis as promising but unproven.

      Under steadfastness, each side maintains their credence by arguing that the other is mishandling the shared evidence due to divergent prior weightings. Wegener remains steadfast by prioritizing empirical correlations over theoretical completeness, judging that the pattern of fit and fossils outweighs the current inability to explain the force. The critics remain steadfast by prioritizing physical consistency over geological correlation, judging that a mechanism violating known geophysical laws renders the hypothesis untenable regardless of the patterns. Here, the disagreement is not about the data itself, which is shared, but about the evidential threshold required to overturn a dominant paradigm; each side views the other as failing to meet the correct standard of proof.

