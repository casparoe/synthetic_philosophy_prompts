      Consequently, the episode suggests that peer-disagreement norms have limited scope when applied to paradigm shifts involving incommensurable standards of proof. Conciliationism and steadfastness presuppose that peers agree on how evidence supports theory, but when the disagreement concerns the hierarchy of evidence itself—correlation versus mechanism—these norms cannot dictate a unique rational response. The obligation in such cases is not necessarily to adjust credence toward a peer's view, but to recognize that the shared evidential base is insufficient to resolve the conflict without new types of data.

