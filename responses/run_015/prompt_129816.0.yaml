prompt: |-
  Please act as an expert philosopher specializing in embedded rationality and reflexive decision structures, with particular familiarity with physically embedded systems that model themselves. Before answering, briefly brainstorm the nearest established concepts—such as reflective equilibrium, performative contradiction, self-defeating prophecy, and Newcomb-style reasoning—without yet committing to whether any of them fit.

  I am building a conceptual taxonomy for embedded agency and keep encountering a configuration I can describe concretely but cannot name precisely. The pattern involves an agent that is physically embedded in the environment it represents, and that uses a working model of its own decision procedure as an input to that very procedure. The agent updates this self-model based on the actions it actually takes. In certain architectures, however, the feedback loop fails to converge and instead oscillates between two locally coherent self-descriptions. Under self-model M, the agent applies decision rule R, producing behavior B; feeding B back through the update mechanism yields self-model M', which justifies a different rule R'; applying R' produces behavior B', which updates back to M, restoring R. Each transition is individually rational, computationally well-defined, and free of logical contradiction—there is no liar-paradox-style breakdown and no infinite regress that halts computation—yet the agent never stabilizes. Two concrete illustrations: first, an embedded climate-policy model that recommends emission path R, observes the altered climate trajectory that results, updates to a model M' recommending path R', and then, seeing R' restore conditions closer to the original trajectory, flips back to R; second, a deliberative agent that adopts welfare-maximization, observes itself applying it in ways that destroy social trust, updates its self-conception to a cooperative identity governed by rule R', and then, seeing cooperation restore welfare-maximizing conditions, reverts to the original criterion.

  This is not merely unstable prediction; it is reflexive instability driven by the content of the self-model itself. I have seen fragments of this near discussions of reflective disequilibrium and self-locating belief, but never isolated as its own failure mode. Does this configuration have an established term? If so, how exactly does it differ from an ordinary performative contradiction, from a self-defeating prophecy, and from reflective disequilibrium? If there is no precise term, I want you to coin one, define it with clear boundary conditions—what clearly belongs, what clearly does not, and how it relates to convergence failures of other kinds—and distinguish it rigorously from its nearest neighbors. I am not asking for a bibliography, citation list, or suggested reading; I want only the conceptual carving itself.

  Please respond in American English. Structure your response exactly as follows: 1. Preliminary Brainstorming (about one short paragraph): the nearby concepts you listed and a brief reason each might or might not capture this oscillation. 2. Diagnosis and Nearest Concepts (about two paragraphs): state whether an established concept precisely fits; then for each near-miss—performative contradiction, reflective disequilibrium, self-defeating prediction—explain exactly where the analogy succeeds and where it breaks down with respect to the reflexive loop described. 3. Proposed Concept (about two paragraphs): present either the correct established term with precise boundary conditions, or a newly proposed term with a formal-style definition, typical necessary markers, one clear instance that belongs, and one clear boundary case that does not belong but might be confused with it. 4. Implications for Embedded Agency (about one paragraph): explain why isolating this specific pattern matters—what it reveals about stability conditions for embedded self-models that broader categories like "reflexivity" or "self-reference" fail to capture. Please think carefully, reason step by step, and do not cite specific texts, authors, or page numbers.
