answer: |-
  1. Preliminary Brainstorming
  Reflective equilibrium suggests a static coherence between principles and judgments, which fails to capture the dynamic, temporal oscillation described here. Performative contradiction involves a logical inconsistency between the content of an assertion and the act of asserting it, whereas the agent's steps are individually consistent. Self-defeating prophecy concerns predictions that falsify themselves upon announcement, focusing on truth conditions rather than the stability of decision rules. Newcomb-style reasoning deals with correlations between predictions and actions in one-shot scenarios, lacking the iterative update loop essential to this pattern. While each touches on self-reference or feedback, none precisely isolates a computationally valid, non-convergent oscillation of self-models.

  2. Diagnosis and Nearest Concepts
  No established concept precisely fits this configuration. The phenomenon is distinct because it involves a closed loop of rational updates that fails to find a fixed point, rather than a logical error or a single-shot paradox. Performative contradiction succeeds in highlighting the self-referential tension but breaks down because there is no logical inconsistency; the agent does not contradict itself at any single time step, it merely changes states over time. Similarly, self-defeating prophecy captures the feedback mechanism where output alters input, but it focuses on the falsification of a belief rather than the cycling of a policy rule based on updated self-conceptions.

  Reflective disequilibrium comes closest by acknowledging a lack of stability in normative reasoning, but it typically describes a state of unresolved moral conflict or psychological discomfort rather than a formal, architectural oscillation in an embedded system. In reflective disequilibrium, the agent is stuck seeking coherence; in this pattern, the agent successfully achieves local coherence at each step but globally cycles. Furthermore, standard convergence failures in optimization usually involve divergence to infinity or chaotic noise, whereas this pattern is a stable, periodic orbit within the space of self-models. The specific failure mode is not irrationality, but rather a topological feature of the embedded update function that precludes a stable fixed point.

  3. Proposed Concept
  I propose the term Reflexive Limit Cycle to designate this configuration. Formally, a Reflexive Limit Cycle occurs when an embedded agent's self-model update function, fed by the consequences of actions derived from that model, generates a periodic trajectory in the space of self-descriptions with a period greater than one. Necessary markers include: physical embeddedness where actions alter the environment relevant to the model, a self-model that serves as an input to the decision procedure, and an update mechanism that is locally rational but globally non-convergent. A clear instance belonging to this category is the climate-policy model described, where emission rules toggle based on feedback that validates alternating models. A clear boundary case that does not belong is an agent changing strategies due to external exogenous shocks; such changes are not driven by the endogenous feedback of the self-model acting upon itself.

  This concept differs from other convergence failures by its regularity and endogenous cause. Unlike chaotic divergence, where trajectories separate exponentially, a Reflexive Limit Cycle returns precisely or approximately to prior states due to the structure of the self-reference. Unlike time-inconsistency, which involves changing preferences over time independent of self-modeling, this oscillation is driven specifically by the agent's observation of its own prior rationality. The boundary condition rests on the source of instability: if the oscillation vanishes when the agent ignores its own prior actions in its self-model, it is a Reflexive Limit Cycle; if the oscillation persists despite isolating the self-model, it is merely environmental volatility or internal noise.

  4. Implications for Embedded Agency
  Isolating this pattern matters because it reveals that local rationality and computational validity are insufficient guarantees for systemic stability in embedded agents. Broader categories like reflexivity or self-reference often imply logical paradox or infinite regress, leading designers to fear self-modeling itself; however, this pattern shows that self-modeling can be perfectly coherent yet dynamically unstable. Recognizing Reflexive Limit Cycles forces a shift from checking for logical consistency to analyzing the topological properties of the self-model update space. It suggests that robust embedded agency requires damping mechanisms or hysteresis in self-model updates, ensuring that the agent does not merely chase its own tail through perfectly rational but globally oscillating decisions.
