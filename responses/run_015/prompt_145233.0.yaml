  6.  **Analyzing the "Linear Assumption" (Task 4):**
      *   The physical analogy assumes a static system (Newtonian mechanics at an instant).
      *   Epistemology is often dynamic (learning over time).
      *   If justification is linear (A supports B, B supports C, C cannot support A), bootstrapping fails.
