answer: |-
  # Colloquium Preparation Sheet: The Careenium and Causal Exclusion

  **To:** The Speaker
  **From:** Strategic Advisory
  **Re:** Q&A Preparation for Philosophy of Mind Series
  **Date:** October 2023

  ## I. Strategic Preamble

  **Concessions to make in the first five minutes:**
  You must explicitly concede that you are not positing a *second* physical force. The Exclusionists (Kim lineage) are listening for energy conservation violations. State clearly: "I am not adding causal oomph to the universe; I am arguing that the distribution of counterfactual dependence is best tracked at the symbol level." If you do not grant that the neural level is *causally sufficient* for the movement, you will be branded a dualist immediately. Grant sufficiency; deny *explanatory priority* and *modal robustness*.

  **The "Must-Land" Reply:**
  Your entire edifice rests on the interventionist definition of causation (Woodward/Hitchcock). If the room rejects interventionism in favour of a process-transfer or conserved quantity theory, your argument that "symbol-level generalisations carry the counterfactual load" collapses. You must defend the premise that *causation just is* invariant dependency under intervention. If this fails, the paper does not survive.

  **Overlapping Objections:**
  Objections 1 (Exclusion), 5 (Pluralism), and 7 (Realisation) are variations of the same metaphysical worry: "Are you multiplying entities?" You can group your responses by reiterating that you are multiplying *descriptions of dependency*, not *forces*.
  Objections 2 (Mechanisms) and 3 (Dynamical Systems) both attack the *structure* of your system. They can be handled by distinguishing between the *organisation* of the system (symbols/attractors) and the *constituents* (ions).

  ---

  ## II. The Objections (Ordered by Damage Potential)

  ### 1. The Exclusionist Dilemma (Kim Lineage)
  **The Objection:** "You claim simmballs are genuine causes, not merely explanatory fictions. But you also accept causal closure of the physical. If the ion fluxes are sufficient for the behaviour, and the simmballs supervene on the ion fluxes, then the simmballs are either causally redundant (overdetermination) or they do no work at all (epiphenomenalism). You say causation isn't a 'quantity', but if the physical base fixes the effect, what causal work is left for the symbol to do? You haven't solved exclusion; you've just renamed the supervenience base."

  **The Reply:** "The dilemma presupposes that for $M$ to cause $P$, $M$ must do work *in addition* to $P$'s physical realiser. On an interventionist account, this is false. $M$ causes $P$ if interventions on $M$ (while holding relevant background fixed) change $P$. Because $M$ is multiply realisable, interventions on $M$ track a stable dependency that interventions on specific ions do not. The ions are sufficient, yes, but they are too specific to support the counterfactuals that define the causal relation. The work isn't divided; the *dependency* is captured at different grain sizes. I am not adding a force; I am identifying the robust dependency structure."

  **Frank Note:** This is soft if they insist that supervenience entails causal screening-off. You are relying on them accepting that higher-level variables can screen off lower-level variables in specific contexts (Shapiro/Sober style). If they hold that the micro-level *always* screens off the macro-level, you have no answer without rejecting standard supervenience assumptions.

  ### 2. Constitutive vs. Causal Relevance (Mechanists)
  **The Objection:** "You are conflating causal relevance with constitutive relevance. Following Craver: the simmballs are parts of the mechanism that constitutes the behaviour, not external causes of it. When you say a simmball 'pushes' the careenium, you are describing a part-whole relationship. Mutual manipulability shows the simmballs are *constitutively* relevant, but that is distinct from *causal* relevance. You have traded on an equivocation to make the symbols look like efficient causes."

  **The Reply:** "I accept the distinction, but I deny it applies here in the way you suggest. In the careenium, the 'movement' is the output of the system, and the simmball collision is an internal state transition. On an interventionist account, if I can intervene on the simmball pattern (e.g., by priming the belief) and change the output, it is a cause *within* the mechanism. Mechanisms are causal structures. To say the parts are only 'constitutive' risks making the mechanism itself acausal. I am claiming the symbol-level transitions are the causal links *within* the mechanism that explain the output stability."

  **Frank Note:** You are on shaky ground here. Mechanists often insist parts cannot cause the whole. You need to be precise that the simmball causes the *movement* (output), not the *system* itself. If you slip and say "the symbol causes the brain to act," they will pounce on the part-whole fallacy.

  ### 3. The Dynamical Systems Challenge (Cognitive Scientist)
  **The Objection:** "I agree with you that neural generalisations are fragile. But you infer from this that we need *symbols*. Why? Invariance under perturbation is a hallmark of attractor dynamics in a phase space. A trajectory through a state space can be stable without being compositional or representational. You've argued against the neural level, but you've assumed representation is the only alternative to raw flux. Isn't this just old-fashioned computationalism dressed up in interventionist clothing? The attractor does the work, not the simmball."

  **The Reply:** "Attractors explain stability, but they do not explain *content*. The simmball story is not just about stability; it's about *aboutness*. An attractor basin doesn't refer to what is absent. My claim is that the specific pattern of interlocking triggers—the compositional nature of the simmballs—is required to explain why *this* specific behaviour tracks *that* specific distal state. Dynamics explains the 'how' of the stability; symbols explain the 'what' of the content. You can have the dynamics, but without the symbol-level description, you lose the intentional generalisations."

  **Frank Note:** **Concede point.** You should admit that for *motor stability* alone, symbols might not be needed. Your claim must be restricted to *intentional* action. If you try to claim symbols are needed for all stable behaviour, the dynamical systems person will destroy you with examples of reflex arcs or central pattern generators.

  ### 4. The Simulation/Implementation Objection (Grad Student)
  **The Objection:** "You claim a simulation could reproduce the ion fluxes perfectly but lack simmballs because the patterns aren't 'triggerable' in the right way. But if the ion fluxes are identical, the counterfactuals must be identical. If I intervene in the simulation, the results match the careenium. How can the causal powers differ if the physical base and its dispositions are identical? You seem to be saying the causal facts depend on the *history* or the *context* of the simulation, not the state itself. That looks like externalism about causal powers, which is unmotivated."

  **The Reply:** "The causal powers differ because the *system boundaries* differ. In the careenium, the simmball pattern is maintained by the system's own homeostatic processes; in the simulation, the pattern is maintained by the host computer's architecture. The counterfactuals hold *within* the system. If I perturb the simulation's code, the 'simmball' doesn't react; the host OS does. The dependency relations are hosted differently. It is not externalism about powers; it is about which physical substrate is responsible for maintaining the invariance."

  **Frank Note:** **This is your exposed flank.** This reply is weak. If the flux is identical, the interventionist dependencies *are* identical locally. You are relying on a holistic view of the "system" that the grad student may not grant. Be prepared to admit this is the least developed part of the paper and frame it as a proposal for further work on "system identity."

  ### 5. Causal Pluralism (Metaphysicians)
  **The Objection:** "You speak of the neural level being 'differently causal'. Are you a causal pluralist? Do you mean 'cause' univocally? If you mean it univocally, the Exclusionist dilemma returns. If you mean it equivocally, haven't you just changed the subject? If symbol-causation is one thing and physical-causation is another, you haven't shown mental causation is real in the sense that matters for physicalism."

  **The Reply:** "I am a pluralist about *causal relations*, not about the concept of causation. The concept is invariant: invariant dependency under intervention. The *relations* themselves vary in their modal robustness. It is the same sense of 'cause', applied to variables with different stability profiles. I am not changing the subject; I am refining the object. Physicalism is secure because the dependencies are grounded in the physical, even if the robust generalisations are at the symbol level."

  **Frank Note:** This is a standard defence (Woodward-style). It will satisfy some, but hard-line monists will find it evasive. Ensure you emphasise that the *definition* is univocal.

  ### 6. The "Downward Causation" Worry (Physics-minded)
  **The Objection:** "If the simmball collision causes the movement, and the movement is constituted by ion fluxes, then the simmball causes the ion fluxes. But the simmball is constituted by ion fluxes. This looks like circular downward causation. How does the pattern push the particles without violating the principle that the particles determine the pattern?"

  **The Reply:** "It is not circular because the causation is diachronic, not synchronic. The simmball at $t_1$ (pattern of ions) causes the movement at $t_2$ (new pattern of ions). There is no synchronic downward causation where the whole constrains the parts at the same instant. The pattern is the arrangement of the parts at $t_1$ that determines the trajectory of the parts at $t_2$. This is fully compatible with physical determinism."

  **Frank Note:** Safe ground. As long as you stick to diachronic causation, you avoid the Kim-style synchronic reflexivity problem.

  ### 7. Multiple Realisability and Kinds (Metaphysicians/Neuroscientists)
  **The Objection:** "If simmballs are multiply realisable, they are disjunctive kinds. Disjunctive kinds do not support laws. If there is no physical property common to all simmball instances, what grounds the causal power? You are relying on the similarity of the patterns, but similarity is not a causal glue."

  **The Reply:** "They are not arbitrary disjunctions; they are functional kinds defined by their role in the system. The 'glue' is the organisational structure, not the substrate. A valve in a steam engine and a transistor in a computer are both 'switches'. The causal power lies in the switching function, which is real despite substrate variation. The generalisation holds because the *organisation* is conserved, even if the matter is not."

  **Frank Note:** This relies on the audience accepting functional kinds as causally potent. Neuroscientists often dislike this. Be prepared for pushback that "function" is observer-relative.

  ### 8. The "So What?" Objection (General)
  **The Objection:** "Even if you are right, and symbol-level generalisations are more robust, have you saved mental causation in the sense we care about? We want to know if *my* belief caused *my* action. You've told me that a description at level $X$ is more useful for prediction. That's pragmatism, not ontology. You've given us better maps, not new territory."

  **The Reply:** "On an interventionist account, ontology *is* dependency structure. If the map tracks the dependencies that support manipulation and control better than the territory does, then the map is tracking the causal structure more accurately. There is no 'territory' of causation hidden behind the dependencies. If the symbol level supports the counterfactuals, it is ontologically causal. Pragmatism about *description* leads to realism about *causation*."

  **Frank Note:** This is your strongest philosophical move, but it requires the audience to buy into the ontological weight of interventionism.

  ---

  ## III. The "Hope Nobody Asks" Question

  **The Question:** "You claim simmballs are about what is absent, and that this 'aboutness' is crucial for them being causes rather than just patterns. But you offer no account of how normative content arises from the careenium. If the simulation has identical fluxes but no content, then content is not intrinsic to the flux. If it's not intrinsic, what grounds the causal power of the *content*? Aren't you smuggling in a homunculus to interpret the simmballs?"

  **Why this is dangerous:** You admitted in your brief that you have "no argument for this second claim beyond an appeal to what the patterns must be able to do." This question exposes that gap. If you cannot explain how the *normativity* of the symbol (its correctness conditions) exerts causal influence without a homunculus, the Exclusionists will argue the *content* is epiphenomenal, even if the *pattern* is causal.

  **Prepared Response (Damage Limitation):** "I am not solving the hard problem of content today. I am arguing that *if* there is content-bearing structure (simmballs), it has causal efficacy. I am defending the causal potency of the vehicle, assuming the vehicle carries content. I grant that grounding the content is a separate, harder problem. However, I suggest that the 'triggerable, compositional' nature I describe is the necessary physical precursor to normativity. I am clearing the ground for a theory of content by removing the causal exclusion barrier."

  **Strategy:** Do not bluff. Concede that this is a boundary condition of the paper. Frame it as: "First, show the vehicle can cause; second, show the vehicle has content. I am doing step one."

  ---

  ## IV. Summary of Tactical Concessions

  1.  **To the Exclusionists:** Concede physical sufficiency. Do not fight causal closure. Fight the idea that sufficiency implies exclusivity.
  2.  **To the Dynamical Systems Scholar:** Concede that stability does not *entail* representation. Restrict your claim to *intentional* action where content matters.
  3.  **To the Grad Student:** Concede the simulation case is the weakest point. Frame it as a hypothesis about system boundaries rather than a settled conclusion.
  4.  **To Everyone:** Concede you are not offering a process theory of causation (energy transfer). You are offering a dependency theory. If they reject dependency theories, you cannot win in this session.

  **Final Advice:** Your strongest card is the modal robustness argument (Step 2 of your thesis). Play it early. If you can convince them that neural generalisations are too fragile to count as *the* cause of the behaviour, you force them onto your turf. Keep the "careenium" metaphor vivid; it helps the non-neuroscientists visualise the multiple realisability argument. Good luck.
