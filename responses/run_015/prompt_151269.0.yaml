answer: |-
  # JOINT STATEMENT ON THE ONTOLOGY OF MATERIAL CONSTITUTION
  **Parties:** Constitutional Pluralist Camp (CPC) and Four-Dimensional Monist Camp (FDMC)
  **Subject:** The Ontological Status of Statues and Constituting Clay
  **Date:** October 26, 2023

  ## 1. AGREED CLAIMS

  Both camps affirm the following propositions as the common ground for this collaboration. These claims delineate the shared formal framework, the empirical phenomena requiring explanation, and the logical boundaries of the dispute.

  1.  **Formal Ontology of Constitution:** Both camps accept that there exists a relation $R$ holding between the clay aggregate ($C$) and the statue ($S$) at time $t$ such that $C$ bears $R$ to $S$. Both agree that $R$ entails spatiotemporal coincidence of all material parts at $t$. The CPC identifies $R$ as *constitution* (distinct from identity). The FDMC identifies $R$ as *identity* restricted to a temporal slice of a single spacetime worm. Both agree that $R$ is symmetric regarding spatial location at $t$ but may differ regarding temporal extension.
  2.  **Empirical Data:** Both camps accept the following physical and phenomenological data as non-negotiable inputs for any ontological theory:
      *   **Part Replacement:** The material parts of the clay can be replaced gradually without immediate loss of macroscopic form.
      *   **Destructive Testing:** If the clay is crushed into a powder, the macroscopic form is lost, though the material mass remains.
      *   **Restoration:** If the crushed clay is reconstituted into the original form using the original parts, intuitive judgments regarding the identity of the statue vary but are data to be explained.
      *   **Formless Intermediates:** It is physically possible for the material to exist in a state lacking the specific artistic form (e.g., as a lump or ingot) before or after existing as a statue.
  3.  **Validity of Leibniz's Law:** Both camps affirm the logical validity of the Indiscernibility of Identicals: $\forall x \forall y (x = y \rightarrow \forall F (Fx \leftrightarrow Fy))$. Both agree that if $S$ and $C$ differ in properties, they cannot be identical *unless* the property attribution is indexed or relativized.
  4.  **Limits of Modal Arguments:** Both camps agree that arguments relying on modal differences (e.g., "The clay could survive melting, the statue could not") establish a divergence in *descriptions* or *sortal constraints*. They disagree on whether this divergence entails numerical distinctness (CPC) or merely distinct temporal/modal profiles of a single entity (FDMC). Neither camp claims that modal intuition alone settles the ontological count without a prior commitment to the nature of modality.
  5.  **Causal Continuity:** Both camps agree that causal-historical continuity is a relevant factor in judgments of persistence, though they disagree on whether it is constitutive of the object itself (CPC) or constitutive of the truth conditions for applying the sortal "statue" to a worm segment (FDMC).

  ## 2. DISAGREEMENTS TABLE

  The following table isolates the residual disputes. Formulations are vetted by each camp to ensure they accurately represent their respective positions without caricature.

  | Dispute Topic | (a) Pluralist Formulation (CPC) | (b) Monist Formulation (FDMC) | (c) Point of Divergence |
  | :--- | :--- | :--- | :--- |
  | **Numerical Count** | At time $t$, there are numerically two distinct continuants occupying region $r$: the statue and the clay. | At time $t$, there is numerically one maximal spacetime worm occupying region $r$; "statue" and "clay" refer to the same worm under different sortal descriptions. | Whether spatiotemporal coincidence entails numerical distinctness when persistence conditions diverge. |
  | **Property Instantiation** | The statue possesses the property *being-essentially-formed* simpliciter; the clay possesses the property *being-accidentally-formed* simpliciter. | The worm possesses *being-formed* at temporal parts $t_1...t_n$ and *being-unformed* at $t_{n+1}$; property ascriptions are indexed to temporal segments or sortal contexts. | Whether modal and persistence properties are intrinsic to the object simpliciter or relativized to time/sortal. |
  | **Persistence Conditions** | The statue ceases to exist if the form is irreversibly lost, even if the matter persists. | The worm persists through form loss; the *statue-stage* ceases, but the object denoted by the clay-sortal continues. | Whether the cessation of a functional phase entails the cessation of the ontological entity. |
  | **Parthood** | The statue and the clay share all material parts at $t$, but have different temporal parts. | The statue and the clay are the same sum of temporal parts; apparent differences in temporal parts are differences in which parts fall under the description. | Whether "part" is relative to the sortal concept applied to the spacetime worm. |

  ## 3. CRUXES

  The following sub-questions are identified as pivotal. Settling any one crux in the direction opposite to a camp's expectation would necessitate a revision of that camp's core ontology. For each crux, we record the agreed decisive argument type and each camp's prediction.

  **Crux 1: The Nature of Artistic Form**
  *   **Question:** Is the property of *being a statue* intrinsic to the material arrangement at a time, or is it essentially relational/historical?
  *   **Decisive Evidence/Argument:** A conceptual analysis demonstrating that two physically indistinguishable objects, one created by an artist and one by random chance, must either both be statues or neither be statues.
  *   **CPC Prediction:** Form is partly historical. The artifact created by chance is not a statue. (If proven form is purely intrinsic, CPC must abandon the distinction between artifact and lump).
  *   **FDMC Prediction:** Form is a descriptive label on a physical state. If physics is identical, the "statue" label applies equally, or neither applies. (If proven form is essentially historical, FDMC must incorporate causal history into the worm's identity conditions).

  **Crux 2: The Possibility of Coincidence**
  *   **Question:** Is it metaphysically possible for two distinct material objects to occupy the exact same spatiotemporal region?
  *   **Decisive Evidence/Argument:** A proof that the principle of "No Two Things in the Same Place" is either a necessary truth or a contingent generalization.
  *   **CPC Prediction:** Coincidence is possible. The principle is a contingent generalization that fails for constituted objects. (If proven impossible, CPC collapses into Monism).
  *   **FDMC Prediction:** Coincidence is impossible. Apparent coincidence is always identity of worms with descriptive variance. (If proven possible, FDMC loses its primary motivation for reducing $S$ and $C$ to one worm).

  **Crux 3: Sortal Relativity of Identity**
  *   **Question:** Is identity ($=$) an absolute relation, or is it relative to a sortal concept (e.g., $x =_{statue} y$)?
  *   **Decisive Evidence/Argument:** A demonstration that statements of identity are unintelligible without a governing sortal, or conversely, that sortal-relative identity leads to logical contradiction.
  *   **CPC Prediction:** Identity is absolute. Sortals reveal properties but do not relativize identity. (If identity is sortal-relative, CPC's claim of distinctness becomes ambiguous).
  *   **FDMC Prediction:** Identity is absolute, but *persistence* is sortal-relative. (If persistence is absolute, FDMC cannot explain why the statue "ends" while the clay "continues" without distinct objects).

  ## 4. APPLICATION: THE SHIFTING-FORM CASE

  **Scenario:** A statue is composed of a shape-memory alloy.
  *   **Phase 1:** Statue form ($t_1$).
  *   **Phase 2:** Heated to become a featureless ingot ($t_2$).
  *   **Phase 3:** Reheated to revert to the exact macroscopic form ($t_3$).
  *   **Variant A:** Phase 3 uses the original atoms.
  *   **Variant B:** Phase 3 uses perfect synthetic analogues (physically indistinguishable, lacking original causal chain).

  **Predictions on Survival:**

  | Entity | Variant A (Original Atoms) | Variant B (Synthetic Analogues) |
  | :--- | :--- | :--- |
  | **The Clay-Object** | **CPC:** Survives. Matter persists continuously.<br>**FDMC:** Survives. The worm continues through the ingot phase. | **CPC:** Does not survive (if "Clay" implies original matter). If "Clay" means mass, it survives.<br>**FDMC:** The worm ends; a new worm begins. |
  | **The Statue-Object** | **CPC:** Survives. Form is restored; causal chain intact.<br>**FDMC:** The "statue-stage" resumes. The worm persists, satisfying the statue-description again. | **CPC:** Does not survive. Lack of causal history breaks artistic identity.<br>**FDMC:** The "statue-stage" description applies to the new worm segment, but it is not the *same* statue-worm as $t_1$. |

  **Joint Observation on Variant B:** Both camps agree that in Variant B, there is a break in causal continuity. The CPC interprets this as the death of the original object and the birth of a new one. The FDMC interprets this as the termination of one spacetime worm and the initiation of a distinct spacetime worm that happens to satisfy the same descriptive profile.

  ## 5. VERBAL DISPUTE ANALYSIS

  Upon review, a portion of the dispute is identified as verbal rather than substantive.

  *   **Identified Portion:** The domain of the unrestricted existential quantifier ("How many objects exist?").
  *   **Explanation:** The CPC and FDMC employ different rules for counting "objects." The CPC counts *sortally-distinct continuants* (allowing coincidence). The FDMC counts *maximal spacetime worms* (disallowing coincidence). When the CPC asks "Are there two objects?", they ask "Are there two distinct persistence conditions satisfied here?" When the FDMC asks "Are there two objects?", they ask "Are there two distinct spacetime regions occupied?" Both agree on the physical facts and the persistence conditions; they disagree on which of these facts licenses the label "object."
  *   **Neutral Reformulation:** To bypass this verbal divergence, both camps agree to adopt the following neutral schema for future dialogue:
      *   Instead of asking "How many objects are in region $r$?", ask: "How many *sortally-distinct persistence conditions* are satisfied by the matter in region $r$?"
      *   Instead of asking "Is the statue identical to the clay?", ask: "Do the persistence conditions for the sortal 'statue' coincide exactly with the persistence conditions for the sortal 'clay' across all possible worlds?"

  **Substantive Remainder:** Even after adopting this reformulation, a substantive dispute remains regarding the *metaphysical grounding* of these persistence conditions. The CPC holds that distinct persistence conditions entail distinct ontological grounds (two beings). The FDMC holds that distinct persistence conditions are compatible with a single ontological ground (one being described two ways). This residual disagreement is not verbal, as it concerns the fundamental structure of reality, not merely linguistic usage.
