prompt: |-
  I'm applying to a small interdisciplinary research fund for a four-month solo project, and I need a polished one-page proposal. The domain is whether there is a determinate fact of the matter about whether the world is becoming less violent. Most public debates treat the disagreement as empirical—per-capita casualty rates versus absolute death counts, with better data expected to settle the question. My half-formed idea is that part of the disagreement is ontological: "violence" may not have a single natural unit of measurement, and normalization choices (per capita, per conflict, per weapon available) smuggle in normative judgments about whose vulnerability counts. To sharpen this, I want to inject a distinction I'm tentatively calling "kinetic incidence" versus "structural accessibility"—the first being actualized harm events, the second being the systemic conditions that make harm available to be actualized—even with perfect data, these two metrics can diverge. The precise question: can any global claim that "violence is declining" be determinately true if kinetic incidence falls while structural accessibility rises, or does that divergence show that the claim is necessarily ambiguous? State the question precisely, explain why standard empirical and normative treatments leave it open, lay out the actual method month by month (conceptual analysis of the metrics, formal comparison cases, evaluation of divergence scenarios), describe what a useful deliverable looks like and what would count as the project failing, and give an honest scope assessment—does this bite off more than four months can chew? Do not include a bibliography or citation list; I'll add references myself. Write the response in American English, and please include a brief note stating how confident you are in the framing and singling out the one point you are least sure about.
