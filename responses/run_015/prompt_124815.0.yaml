      *   **Constraints:** No literature review, no citations, no references, no suggestions for further reading.
      *   **Tone/Style:** Disciplined translation, honest boundaries, careful mapping in both directions (Case $\to$ Theory, Theory $\to$ Case), handle complications explicitly.
      *   **Specific Stipulations:** Treat residual cross-talk as a variable.
