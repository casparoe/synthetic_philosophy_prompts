          *   What plays the role of the workspace/ignition/broadcast/consumers?
          *   One workspace with broken output or two workspaces?
          *   Status of the right hemisphere (conscious?).
          *   Complication 1: Report vs. Access vs. Phenomenal Consciousness.
          *   Complication 2: Unity Postulate (One vs. Two Workspaces).
          *   Complication 3: Confabulation (Constructive vs. Transparent).
