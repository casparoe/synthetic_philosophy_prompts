  Here is the map of the terrain as I see it, followed by the numerical decomposition you requested.

  ### The Map of the Problem

  The core fault line in the future-contingents debate is not actually about time; it is about the metaphysics of truth. The fatalist argument relies on a transfer principle: if a proposition is true, it is necessarily true (in the sense of being unpreventable). To block this, you either deny the antecedent (no truth value yet) or deny the transfer (truth does not imply necessity).

  The "Restrict Bivalence" camp (your supervisor's leaning) argues that truth supervenes on being. If the future is ontologically open, there is no being for the truth to supervene upon, so there is no truth. This view takes the truthmaker principle seriously. The "Keep Bivalence" camp (your friend's leaning) argues that truth is a logical property independent of causal determination. On this view, the future is fixed in terms of truth values even if it is not fixed in terms of causal necessity. This preserves classical logic but requires a robust account of how truths about non-existent things can be true.

  Your two variations test the boundaries of these commitments. Variation one (the chancy trigger) introduces physical indeterminism. Logically, this should be irrelevant; logical fatalism is supposed to work even in an indeterministic world if bivalence holds. However, metaphysically, it strengthens the intuition that the future is "open," making the cost of bivalence feel higher. Variation two (the flawless predictor) tests the link between truth and knowability. If a predictor exists, there seems to be a fact of the matter. If you think truth requires checkability, this forces bivalence. If you think truth is independent of access, the predictor is just tracking a truth that might not be grounded yet.

  My own position leans towards keeping bivalence but denying the transfer principle. I believe the logical costs of restricting bivalence (losing excluded middle, complicating semantics) outweigh the metaphysical discomfort of "ungrounded" truths. Therefore, my credence in the proposition that restricting bivalence is *more defensible* is below 0.5.

