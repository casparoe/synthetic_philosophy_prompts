  - "Your number up front" — one or two lines, both credences stated plainly (~30 words)
  - "Which thesis you're assessing" — flag if you think the warrant/content/mechanism split or the local/global/default split is doing hidden work, or if you'd reframe (~100 words)
  - "Decomposition" — the sub-questions your credence rides on, numbered, each with a probability and one line of justification; please include the loop case, the cross-domain case, whether the default view collapses into global reductionism, and the child/novice acquisition problem if you think it belongs (~400 words)
  - "Combination and sensitivity" — how you get from the sub-questions to the headline number, and which single term moves it most (~150 words)
  - "Where the 0.4 and the 0.8 diverge" — your best guess at which sub-question my supervisor and I are actually disagreeing about, and whether it's an epistemic or a verbal disagreement (~150 words)
  - "What would move you" — the one piece of argument or evidence that would shift your number furthest, and in which direction (~120 words)
  - "Bottom line" — one sentence restating both numbers (~40 words)
