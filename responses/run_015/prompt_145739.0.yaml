  Your roommate's voting ethics aren't necessarily inconsistent, but they are **conditional**. She operates on a system of switching rules based on specific thresholds (danger levels, election closeness, and communication methods). To figure out what she should do in your run-off scenario, we need to isolate the competing principles driving her past statements.

  Here is the breakdown of the latent rules, how they apply to the run-off, and the specific test case that would reveal which rule actually governs her behavior.

  ### 1. The Competing Rules
  Based on her history, three distinct principles are fighting for dominance in her ethical framework:

  *   **Rule A: The Danger Threshold (Deontological/Expressive)**
      *   *Source:* Her view that "lesser evil" logic is only okay if one candidate is "genuinely dangerous" vs. "mediocre."
      *   *The Logic:* You must not compromise your integrity by endorsing a bad candidate unless the alternative poses an existential or severe threat. If both are just "bad" (mediocre/harmful), you have a duty to withhold consent.
  *   **Rule B: The Decisiveness Duty (Consequentialist)**
      *   *Source:* Her view that a "tie-breaker" creates a moral duty to vote for the least-bad option, and her ban on third-party voting in generals if it helps the worst person win.
      *   *The Logic:* When your vote has high efficacy (run-off, tie-breaker, swing state), the outcome matters more than your expression. You must minimize net harm.
  *   **Rule C: The Signaling Requirement (Communicative)**
      *   *Source:* Praising the sister (blank ballot + tweet) vs. criticizing the cousin (skipping + silence).
      *   *The Logic:* Abstaining is only moral if it is "loud." Silent abstention is free-riding; recorded/publicized abstention is protest.

  ### 2. Predictions for the Run-Off Case
  **The Scenario:** Run-off (High Efficacy) + Both Harmful (Community) + One *Far Worse* + Null Vote Option (Counts for Quorum).

  Here is how each rule combination predicts her choice:

  *   **Prediction 1: Vote for the Less Harmful Candidate**
      *   *Driving Rules:* **Rule B (Decisiveness)** overrides Rule A.
      *   *Reasoning:* Because it is a run-off, the "Decisiveness Duty" activates. She interprets "far worse" as crossing the "Genuinely Dangerous" threshold from Rule A. The availability of a Null Vote is irrelevant because the stakes (Rule B) demand a choice to prevent the "far worse" outcome.
      *   *Consistency Check:* Consistent with her "tie-breaker" and "general election" takes, provided she classifies the "far worse" bill as "dangerous."

  *   **Prediction 2: Cast the Null Vote (and Tweet about it)**
      *   *Driving Rules:* **Rule A (Danger Threshold)** + **Rule C (Signaling)**.
      *   *Reasoning:* She classifies both candidates as "mediocre/harmful" rather than "dangerous" (since both hurt her community). Therefore, Rule A forbids endorsing either. However, Rule C requires her to avoid "free-riding." The formal Null Vote satisfies Rule C (it's a recorded protest like her sister's blank ballot) without violating Rule A.
      *   *Consistency Check:* Consistent with her praise of the sister, but potentially inconsistent with her "tie-breaker duty" unless she argues the Null Vote *is* the tie-breaker choice (i.e., "neither" is a valid outcome).

  *   **Prediction 3: Boycott and Organize**
      *   *Driving Rules:* **Rule C (Signaling)** prioritized over institutional participation.
      *   *Reasoning:* If she believes the Null Vote is too passive or that the quorum itself legitimizes a harmful process, she might choose external organizing. However, this is the *least* likely option based on her history. She praised a *ballot-based* protest (sister) over non-participation (cousin).
      *   *Consistency Check:* Only consistent if she views "organizing" as sufficiently "loud" to satisfy Rule C, but it risks violating Rule B (Decisiveness) more than a Null Vote would.

  ### 3. The Distinguishing Test Case
  To determine which rule actually controls her decision (and to expose where her consistency might break), you need a case that pits **Rule A (Danger Threshold)** against **Rule B (Decisiveness Duty)** while removing **Rule C (Signaling)** as a variable.

  **The Test Case:**
  > "Imagine an election where you know for a fact your single vote will decide the winner (a guaranteed tie-breaker). However, both candidates are 'mediocre'—Candidate A will raise taxes by 5%, and Candidate B will raise taxes by 10%. Neither is 'genuinely dangerous' or threatening to democracy; they are just policy-disagreements that hurt your wallet. There is **no** Null Vote option; you must vote for A, B, or stay home silently."

  **Why this distinguishes the rules:**
  *   **If she says "Vote for Candidate A (5%)"**: It means **Rule B (Decisiveness)** is her primary driver. She believes high efficacy forces a lesser-evil choice *even if* the danger threshold isn't met.
      *   *Implication for Run-off:* She should vote for the **Less Harmful Candidate** in your scenario, regardless of the Null Vote option.
  *   **If she says "Stay Home/Abstain"**: It means **Rule A (Danger Threshold)** is her primary driver. She believes you should never endorse a 'mediocre' bad option, even if your vote is decisive.
      *   *Implication for Run-off:* She should **Cast the Null Vote** in your scenario (since that allows her to abstain while satisfying Rule C/Signaling).

  **The Verdict:**
  Most people claim to follow Rule A (Integrity) but act on Rule B (Consequences) when pressed. If she chooses the Null Vote in your run-off scenario, ask her the Test Case above. If she admits she'd vote for the 5% tax hike in the Test Case, then her choice of the Null Vote in the Run-off is inconsistent with her "tie-breaker" principle—unless she argues the "Null Vote" *is* the vote for the "least bad option" (which is a clever, but debatable, semantic move).
