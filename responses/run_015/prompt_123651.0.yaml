  Hey, here's that sketch you asked for. I tried to keep the language tight enough for the piece but loose enough that it doesn't sound like we're submitting to *Journal of Symbolic Logic*. 

  We focused heavily on that niche bit you wanted about dynamic systems vs. static axioms—it's usually glossed over in the Penrose summaries, but it's where the Restrictivists actually have some leverage. Also flagged the $\omega$-consistency issue explicitly since that's where Camp A usually gets tripped up.

