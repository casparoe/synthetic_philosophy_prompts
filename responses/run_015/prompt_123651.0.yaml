  ***

  # DRAFT JOINT STATEMENT: Gödelian Constraints on Cognition
  **Parties:** Camp A (Anti-Mechanists) & Camp B (Restrictivists)
  **Status:** Adversarial Collaboration / Working Notes

  ### 1. Agreed Claims (The Common Ground)
  *Where we stop yelling and check the proofs.*

  1.  **G1 Scope:** Gödel's First Incompleteness Theorem strictly applies only to formal systems that are (a) consistent, (b) capable of expressing elementary arithmetic, and (c) have axioms that are recursively enumerable (RE).
  2.  **G2 Conditions:** The Second Theorem (no system can prove its own consistency) requires the system to satisfy specific derivability conditions (Hilbert-Bernays-Löb). It does not apply to sloppy natural language or undefined "conceptual schemes."
  3.  **The Lucas-Penrose Requirement:** For the anti-mechanist argument to hold, a human mathematician must be able to:
      *   Identify a specific formal system $F$ that adequately models their own reasoning.
      *   Know (with mathematical certainty) that $F$ is consistent.
      *   Thereby see the truth of $F$'s Gödel sentence $G(F)$, which $F$ cannot prove.
  4.  **Syntax Collapse:** Both sides agree that if the "rules" of human reasoning are not fixed (i.e., if the syntax changes unpredictably or isn't RE), the direct mapping to a single Turing Machine fails. Gödel doesn't bind a moving target.
  5.  **Consistency vs. $\omega$-Consistency:** We agree that simple consistency is insufficient for Camp A's case. To claim $G(F)$ is *true* (rather than just undecidable), one must assume $F$ is $\omega$-consistent (or sound). If $F$ is consistent but $\omega$-inconsistent, $G(F)$ could be false in the standard model. Camp A must claim humans can recognize $\omega$-consistency, not just simple consistancy.

  ### 2. Residual Disagreements
  *Where we still disagree, phrased so each side can sign off without feeling misrepresented.*

  | Issue | Camp A (Anti-Mechanist) Position | Camp B (Restrictivist) Position |
  | :--- | :--- | :--- |
  | **The "Seeing" Step** | The human ability to recognize the truth of $G(F)$ demonstrates a cognitive capacity that transcends any formal proof procedure within $F$. | The ability to "see" $G(F)$ is either a result of operating in a stronger system $F+1$ (which is still formal) or an informal heuristic that isn't truth-preserving. |
  | **System Identification** | We can know, in principle, the rules of our own reasoning well enough to construct $F$, even if we haven't written them down yet. | We cannot specify $F$ without changing the reasoning process itself. Any attempt to formalize the mind creates a new object distinct from the mind. |
  | **Dynamic Revision** | Revising axioms via reflection is a non-algorithmic process of insight. No machine can replicate the *rule* for changing rules. | Revising axioms is just a higher-order algorithm. A machine can simulate theory revision if the criteria for revision are themselves computable. |

  ### 3. The Cruxes
  *Specific test cases where our predictions diverge.*

  **Crux 1: The Meta-Step Problem (Dynamic Systems)**
  *   **The Case:** Mathematicians operating in **Reflective Equilibrium**. They start with ZFC, encounter undecidable statements (e.g., Continuum Hypothesis), and adopt new axioms (e.g., Large Cardinals) based on intuitive "fruitfulness" rather than formal derivation.
  *   **Camp A Prediction:** This sequence of theories ($T_1, T_2, T_3...$) cannot be generated by a single RE axiom set. The "insight" driving the shift from $T_1$ to $T_2$ is non-computable.
  *   **Camp B Prediction:** The sequence is generated by a computable function $f(T_n, \text{context}) \rightarrow T_{n+1}$. We just haven't found the function yet. The fact that it feels like "insight" is irrelevant to whether it's mechanistic.
  *   **G2 Note:** We agree G2 applies to each static $T_n$, but disagree on whether it applies to the *sequence generator*.

  **Crux 2: The Circularity of Self-Trust**
  *   **The Case:** A mathematician asserts, "I know my own reasoning is consistent, therefore I am not a machine."
  *   **Camp A Prediction:** This is not circular. Consistency is a precondition of rationality. To argue at all, you must assume you aren't systematically deriving falsehoods. This self-knowledge is immediate.
  *   **Camp B Prediction:** This is circular. If you were a machine, you might be inconsistent without knowing it (per G2). Asserting your own consistency to prove you aren't a machine assumes the conclusion (that you aren't a flawed machine).
  *   **Omega-Bar:** Camp A must explain how we verify $\omega$-consistency without begging the question.

  ### 4. Verbal Dispute Check
  *Is this just semantics?*

  **Yes, partially.**
  We agree that a significant portion of the dispute turns on the definition of "Formal System."
  *   If "Formal System" means **Static Turing Machine**, Camp A wins (humans aren't static).
  *   If "Formal System" includes **Dynamic, Evolving Algorithms**, Camp B wins (humans could be dynamic machines).
  *   **Resolution:** We agree to specify "Static RE System" vs. "Dynamic Computational Process" in the final piece to avoid talking past each other.

