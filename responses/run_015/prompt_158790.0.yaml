answer: |-
  In this 90-minute workshop, participants are arbitrarily classified into two cognitive styles based on seating, perform tasks that shift to match those labels, experience moving diagnostic goalposts, and confront an unfalsifiable trap before dissecting the mechanism in a final reveal.

  ### Core Mechanics

  **The Task:** "Ambiguous Resource Allocation." Participants receive a vignette describing a scarce resource (e.g., funding for a vague community project) and must write a 100-word proposal on how to distribute it.
  **The Labels:** "Modulars" (focus on structure, rules, distinct categories) vs. "Integrators" (focus on relationships, context, holistic outcomes).
  **The Secret Sort:** Left side of the room = Modulars. Right side of the room = Integrators. (Ignore actual output).
  **The Stakes:** Participants are told the "typology" will determine their role in a subsequent (fictional) collaborative research grant simulation, creating mild pressure to be correctly identified and valued.

  ### Minute-by-Minute Timeline & Facilitator Actions

  **00–10: Baseline Task**
  *   **Activity:** Hand out vignettes. Participants write proposals silently. Collect them.
  *   **Facilitator Secret:** Do not read them. Shuffle them visibly to imply analysis is happening. Maintain an air of clinical neutrality.

  **10–20: The Classification (The Arbitrary Cut)**
  *   **Activity:** Announce you have analyzed the texts. Reveal the two types ("Modular" vs. "Integrator"). Assign labels based *strictly* on seating (Left/Right), but claim it was based on writing style. Hand out colored badges (e.g., Blue for Modular, Green for Integrator).
  *   **Facilitator Secret:** Lie confidently. If someone questions the fit, say, "The algorithm picks up latent structural markers you might not see." Provide a plausible-sounding definition for each type that is vague enough to be universally applicable but specific enough to guide behavior.

  **20–35: The First Loop (Conformity)**
  *   **Activity:** Hand out a second, slightly different vignette. Ask them to solve it "according to their type's strengths." Collect outputs.
  *   **Facilitator Secret:** Observe the shift. In Round 1, outputs were mixed. In Round 2, Blues will use more bullet points/rules; Greens will use more narrative/context. Select two examples that match the stereotype perfectly to display later.

  **35–50: The Second-Order Loop (Moving Goalposts)**
  *   **Activity:** Announce a "recalibration." State that initial data shows some Modulars are showing Integrator traits. Declare that the definition of "Modular" is now expanded to include "rigid adherence to flexibility."
  *   **Facilitator Secret:** Change the criteria mid-stream to ensure everyone still fits somewhere, demonstrating how expert knowledge shifts to maintain the classification system even when behavior changes. Ask them to write a third response based on the *new* definition.

  **50–60: The Unfalsifiable Trap (Denial as Proof)**
  *   **Activity:** Ask for a show of hands: "Who feels this label does *not* accurately describe them?" When hands go up, announce that "Resistance to classification is a primary indicator of the [Label] type due to [made-up psychological reason, e.g., 'aversion to external constraint']."
  *   **Facilitator Secret:** This is the gaslighting phase. Make the category inescapable. Note the frustration levels in the room.

  **60–90: The Debrief (The Reveal)**
  *   **Activity:** Stop the simulation. Reveal the seating chart secret. Introduce Ian Hacking's "Looping Effects." Map the session moments to the theory. Contrast with a natural kind (hold up a quartz crystal: "If I call this quartz 'flexible,' it does not change").
  *   **Facilitator Secret:** Shift from authority to co-inquirer. Validate the frustration. Invite the philosophers to critique the epistemology and the psychiatrists to critique the ethics.

  ### Debrief Mapping

  1.  **Basic Looping (Round 1 → Round 2):** Point to the shift in writing styles. The classification created the reality it claimed to detect. *Contrast:* The quartz crystal would not have changed its lattice structure because you labeled it.
  2.  **Criterion Revision (The Recalibration):** Highlight how you changed the definition of "Modular" to accommodate the changed behavior. This mirrors how diagnostic criteria (e.g., DSM) evolve to keep capturing the population even as the population adapts to the diagnosis.
  3.  **The Unfalsifiable Trap (Denial as Proof):** Discuss the moment denial became evidence. This illustrates institutional power: when the classifier holds all the epistemic authority, the classified cannot escape the kind.
  4.  **Human vs. Natural Kinds:** Emphasize that human kinds are "interactive." They talk back. Natural kinds are "indifferent."

  ### Predicted Failures & Mitigations

  **1. The "Spotter" (Philosophy Grad Students)**
  *   **Risk:** Someone realizes the sorting is arbitrary in Round 1 or 2 and calls it out loudly.
  *   **Mitigation:** Do not deny it immediately. Say, "That's an interesting observation about your perception of the criteria," and log it. In the debrief, make them a hero: "You detected the arbitrariness, but notice how hard it was to prove it against my authority."

  **2. The "Offended Clinician" (Psychiatry Trainees)**
  *   **Risk:** They feel the simulation trivializes diagnosis or mimics harmful labeling without consent.
  *   **Mitigation:** Validate this heavily in the debrief. "Your discomfort is the point. This is why power dynamics matter in clinical settings. You are trained to avoid this, but the structure invites it." Use their expertise to analyze the harm.

  **3. The "Non-Performer"**
  *   **Risk:** Someone refuses to write according to the label.
  *   **Mitigation:** Use them in the "Unfalsifiable Trap" phase. "Your refusal to engage is typical of [Type]." If they remain stubborn, acknowledge in debrief that "opting out" is a privilege not always available in real institutional settings.

  **4. The "Over-Performer"**
  *   **Risk:** Someone leans so hard into the stereotype it becomes a parody, breaking the tension.
  *   **Mitigation:** Let them be. In debrief, ask them: "Did you feel you were expressing yourself, or giving me what I wanted?" This highlights the internalization of the kind.

  ### Honest Limitations (Say This Aloud)

  1.  **Time Scale:** Real looping happens over years or generations, not 40 minutes. This simulation compresses the feedback loop artificially; in reality, the lag between classification and behavioral change is where much of the suffering occurs.
  2.  **Exit Power:** Everyone here can leave the room. Real subjects of looping effects (patients, prisoners, students) often cannot exit the classification system without severe penalty. This simulation lacks the *coercion* that makes looping ethically critical.
  3.  **Consciousness:** You knew this was a workshop. Real looping often works best when the subject is unaware they are being classified or believes the classification is purely biological/immutable. You were all complicit; real victims are not.
  4.  **The Natural Kind Contrast:** Even natural kinds are theory-laden in philosophy of science. While quartz doesn't care about its label, our *understanding* of quartz loops too. Be careful not to imply natural kinds are perfectly known, only that they are indifferent to being known.
