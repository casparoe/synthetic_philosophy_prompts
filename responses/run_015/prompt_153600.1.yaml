  **Predicted Verdict:**
  She will verdict that the proposition "The Holocaust happened" **is a hinge**, but she will qualify it as a **local hinge** specific to our current moral and political form of life, rather than a universal hinge like "I have two hands."

  **Reconstructed Rule:**
  She is running the **Doubt-as-Breakdown Rule**.

  **Analysis of Candidate Rules:**

  1.  **Evidence-Practice Rule:** *If a proposition is settled by empirical evidence, it is not a hinge.*
      *   **Prediction:** Not a Hinge. (The Holocaust is documented and checkable, like Napoleon).
      *   **Status:** **Rejected.** This rule fails to account for her verdict on "The Earth existed long before she was born." That proposition is supported by geology (evidence), yet she classifies it as a hinge. Evidence alone does not disqualify a proposition from hinge status in her framework.

  2.  **Never-Learned Rule:** *If a proposition is explicitly taught/learned, it is not a hinge.*
      *   **Prediction:** Not a Hinge. (The Holocaust is taught in schools).
      *   **Status:** **Rejected.** This contradicts her "Earth" verdict immediately. We learn the age of the Earth in school; it is not a pre-linguistic certainty like "I have hands." Since she accepts "Earth" as a hinge despite it being learned, this rule cannot be hers.

  3.  **Presupposition Rule:** *If a proposition is a necessary condition for other inquiries, it is a hinge.*
      *   **Prediction:** Hinge (arguably). (The Holocaust is foundational for modern human rights discourse).
      *   **Status:** **Runner-up.** This fits well, but it struggles to distinguish the Holocaust from Napoleon without invoking the *consequences* of doubt. Napoleon is a presupposition for specific historical narratives, yet he is not a hinge. The Presupposition Rule needs the Doubt-as-Breakdown metric to explain why Napoleon is a "move within the game" while the Holocaust is "part of the board."

  4.  **Doubt-as-Breakdown Rule:** *If doubting a proposition is treated as a breakdown (madness, exclusion, corruption) rather than a mistake (error, correction), it is a hinge.*
      *   **Prediction:** **Hinge.** (Denial is legally prohibited and morally corrupting; it excludes one from the community).
      *   **Status:** **Selected.** This is the rule explicitly defined in your prompt ("doubting them is a breakdown rather than a mistake"). It perfectly explains the distinction between Napoleon (doubt is a historical error) and the Holocaust (doubt is moral/legal transgression). It also explains her "political" hesitation: she recognizes it as a hinge *for us* (our form of life), not a hinge *simpliciter* (like hands).

  **Why She Is on the Doubt-as-Breakdown Rule:**
  This rule is the only one that accommodates her entire track record without contradiction.
  *   **Hands/Earth:** Doubt is madness (Universal Breakdown).
  *   **Napoleon/Water:** Doubt is error (Mistake).
  *   **Holocaust:** Doubt is exclusion (Local Breakdown).
  Her comment that the question is "political" is not a refusal to rule, but a specification of the *type* of hinge. In *On Certainty*, Wittgenstein notes hinges can shift across forms of life. She is identifying the Holocaust as a hinge of the *post-war liberal democratic form of life*. To doubt it is to step outside that specific language game, which constitutes a breakdown *within that game*.

  **Explaining Away Earlier Verdicts:**
  *   **"Born in Cleveland" (Not a Hinge):** You must explain why this isn't a hinge if doubt is a breakdown. *Explanation:* Doubting one's birthplace is treated as biographical confusion or a mistake, not moral corruption. It does not exclude you from the moral community. The consequence of doubt is correction, not excommunication.
  *   **"Napoleon Existed" (Not a Hinge):** *Explanation:* Historical revisionism regarding Napoleon is permitted within the language game of history. It is treated as a factual dispute. Holocaust denial is treated as a negation of the moral framework that makes historical inquiry meaningful *for us*. The breakdown is social/moral, not just empirical.
  *   **"Earth Existed" (Hinge):** *Explanation:* This is a universal hinge (condition for physics/history). The Holocaust is a local hinge (condition for *our* morality). Both are hinges under the Doubt-as-Breakdown rule; the scope differs.

  **The Further Test Case:**
  To cleanly separate the **Doubt-as-Breakdown Rule** from the **Presupposition Rule**, put this case to her:
  **"The proposition that 'Vaccines do not cause autism'."**

  *   **Why:**
      *   **Evidence:** Overwhelming scientific evidence (Points to *Not a Hinge* on Evidence-Practice).
      *   **Presupposition:** It is a prerequisite for modern public health policy (Points to *Hinge* on Presupposition).
      *   **Breakdown:** In the scientific community, doubt is treated as breakdown/exclusion. In the general public, it is debated.
      *   **Separation:** If she verdicts **Hinge**, she is prioritizing the *social policing* (Breakdown). If she verdicts **Not a Hinge**, she is prioritizing the *logical role* (Presupposition/Evidence). Given her "political" comment on the Holocaust, she may verdict **Hinge (Local to Science)**, which would confirm the Doubt-as-Breakdown rule is sensitive to specific communities (Forms of Life).

  **Changing the Prediction:**
  I would be forced to change my prediction to **Not a Hinge** if she offers the following consideration:
  **"Legal prohibition is distinct from epistemic breakdown."**
  If she argues that while denial is *illegal* or *immoral*, it remains *epistemically possible* to doubt without logical incoherence, she is drawing a line between **Normative Breakdown** (Law/Morals) and **Epistemic Breakdown** (Madness/Logic). If she insists hinges must be *epistemic* foundations (like "I have hands") rather than *moral* foundations, the Holocaust becomes a known fact (like Napoleon) that is merely protected by taboo. This would revive the **Evidence-Practice Rule**.

  **Where the Rule Fails:**
  The Doubt-as-Breakdown rule is most likely to fail in cases of **Scientific Paradigm Shifts**.
  *   **Case:** **"The Earth is the center of the universe."**
  *   **Failure:** In 1500, doubting this was a breakdown (heresy/madness). By the rule, it was a hinge. In 1700, believing it was a mistake. The rule cannot easily account for the *transition* where a hinge becomes a falsehood without implying the previous form of life was "irrational." It struggles to explain how a breakdown can become a mistake without a loss of rationality, suggesting the rule describes *social stability* better than *epistemic justification*.
