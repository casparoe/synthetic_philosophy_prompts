answer: |-
  # Q&A Prep Sheet: Metaphysics of Science Seminar
  **Topic:** Special Relativity and the Block Universe (Modified Rietdijk–Putnam)
  **Time Limit:** Replies capped at 2–3 sentences for seminar pacing.

  ### 1. The Transitivity Objection (High Damage)
  **Who:** The Philosopher of Physics (PoP)
  **Phrasing:** "You're relying on Putnam's assumption that the relation 'x is real for y' is transitive. Stein demonstrated thirty years ago that transitivity is incompatible with the light-cone structure of Minkowski spacetime. If you drop transitivity, the contradiction between presentism and relativity dissolves without requiring a block universe. Why should we accept a transitivity principle that violates the geometry of the theory?"

  **Reply:** "I concede that strict transitivity fails in SR, which is why I pivot to the claim that *no* frame-relative notion of 'becoming' yields the global distinction presentism requires. Even if 'real for' is intransitive, the geometry ensures that for any observer, future events are spacelike separated and thus cannot be uniquely excluded from existence without privilege. Stein saves a local becoming, but he does not save the global 'open future' required for deliberation."
  **Soft Spot/Concession:** Do not insist transitivity holds in SR; it doesn't. Concede Stein is technically right about the geometry, but insist his ontology is metaphysically insufficient for the presentist's needs (i.e., it doesn't save the *intuition* behind presentism).

  ### 2. The Determinism vs. Ontology Distinction (High Damage)
  **Who:** The Neutral Colleagues / Card-carrying Presentist
  **Phrasing:** "Your argument seems to establish that the future is *determined* or *true*, not that future events *exist*. A presentist can accept that propositions about the future have truth values fixed by the laws of nature without committing to the ontological reality of future entities. Why does fixing the truth value of future contingents force us to abandon presentism?"

  **Reply:** "If future propositions are true now, presentism requires truthmakers that do not yet exist, which violates the truthmaker principle central to most presentist accounts. My argument is that the only coherent truthmakers for relativistic spacetime are the events themselves, located at their spacetime coordinates. To deny their existence while affirming their truth is to posit 'free-floating' truths, which is metaphysically costlier than eternalism."
  **Soft Spot/Concession:** Acknowledge that logical determinism does not strictly entail ontological eternalism. Your defense rests on the *truthmaker* argument: if you want truth without existence, you need an alternative theory of truth that fits SR, which is hard to come by.

  ### 3. The Cosmic Time Objection (Medium-High Damage)
  **Who:** The Grad Student (Q Foundations)
  **Phrasing:** "You're building this on Special Relativity, but our best cosmological models (FLRW) are General Relativistic and come with a preferred cosmic time foliation. If the actual universe has a privileged slicing, doesn't that allow the presentist back in through the front door, making your SR-based argument physically idealized and metaphysically irrelevant?"

  **Reply:** "While FLRW models allow a preferred foliation, this is a contingent feature of specific solutions, not a structural requirement of relativistic spacetime like the light-cone structure. My argument targets the *metaphysical necessity* of presentism; if presentism fails in the local Minkowski structure governing all causal interaction, it is unstable even if a global cosmic time exists. Furthermore, cosmic time is not a 'universal now' in the Newtonian sense required by robust presentism."
  **Soft Spot/Concession:** Concede that GR complicates the picture and that your chapter specifically addresses the SR case. Do not claim GR disproves presentism; claim that if presentism isn't viable in the local structure (SR), it's not a fundamental metaphysical truth.

  ### 4. The "Local Becoming is Enough" Objection (Medium Damage)
  **Who:** The Card-carrying Presentist
  **Phrasing:** "You concede Stein's point that becoming is point-relative. Why isn't that enough? I only need *my* present to be real for *me*. You're begging the question by assuming that 'real' must mean 'real for everyone globally,' which is just Newtonian bias disguised as metaphysics."

  **Reply:** "Point-relative becoming cannot ground the asymmetry of deliberation, which concerns events that are currently spacelike separated from us. If the future of a distant star is already 'fixed' relative to some inertial frame passing through me, the 'openness' you defend is frame-dependent and thus ontologically shallow. We care about whether the future is open *simpliciter*, not just open relative to a specific coordinate system."
  **Soft Spot/Concession:** Concede that Stein's view is logically consistent. Your attack is pragmatic/phenomenological: it doesn't save the *motivation* for presentism (the feeling of an open future), rendering it a hollow victory for the presentist.

  ### 5. The Conventionality Reply Defense (Medium Damage)
  **Who:** The Philosopher of Physics (PoP)
  **Phrasing:** "You argue we can fix an arbitrary frame to define existence. But if simultaneity is conventional, then existence becomes a matter of coordinative definition. Are you really prepared to say that what *exists* depends on a human choice of synchronization convention?"

  **Reply:** "I argue that regardless of which convention you pick within the constraints of SR, the set of 'real' events expands to include the entire spacetime manifold. The conventionality lies in the slicing, not in the manifold itself; since every slicing includes all events, the ontology remains the block. The choice of frame changes the *order* of becoming, not the *content* of existence."
  **Soft Spot/Concession:** Be careful not to say existence is *relative* to the frame. Say the *totality* of existence is invariant, even if the *hypersurfaces* used to access it are conventional.

  ### 6. The Physics-to-Metaphysics Bridge (Low-Medium Damage)
  **Who:** Neutral Colleagues
  **Phrasing:** "Even if SR is true, why think physics dictates ontology? Physics tells us about measurement and coordination; metaphysics tells us about being. You're moving too fast from 'we cannot measure simultaneity' to 'simultaneity does not exist.'"

  **Reply:** "I am not inferring ontology solely from measurement limitations, but from the invariant causal structure that makes measurement possible. If the causal structure of the world precludes a global division between past and future, a metaphysics requiring that division is describing a world other than the one we inhabit. Metaphysics must be compatible with the structural constraints of our best physical theories."
  **Soft Spot/Concession:** Concede that physics doesn't settle *all* metaphysical questions. Limit your claim: physics rules out metaphysical views that are *incompatible* with its structural posits (like a global now).

  ---

  ### The Question You Hope Nobody Asks
  **The Question:** "You assume that 'existence' must be an absolute, frame-invariant notion. But why can't existence itself be frame-relative? If existence is relative, the block universe doesn't follow; we just have relative existences."

  **Why it's dangerous:** It attacks the bridge principle between SR and Eternalism. If existence is relative, the Rietdijk-Putnam contradiction vanishes without needing a block.

  **What to say:** "If existence is frame-relative, then 'what exists' loses its explanatory power for why we cannot interact with certain events. We would need an explanation for why I cannot interact with an event that 'exists' in another frame, which collapses back into causal structure. I argue it is more parsimonious to treat existence as absolute and causal access as limited, rather than fragmenting existence itself."
  **Concession:** This is the deepest metaphysical rift. If they press hard, concede that this is the fundamental disagreement: "You are willing to fragment existence to save presentism; I am willing to accept the block to save absolute existence. I argue the latter is the lesser cost."

  ---

  ### General Strategy Notes
  *   **Tone:** Keep it collaborative. You are defending a chapter, not the final dissertation. Use phrases like "In this chapter, I argue..." rather than "The truth is..."
  *   **The PoP:** Do not try to out-physics the Philosopher of Physics. If they correct your math or geometry, thank them and pivot to the metaphysical implication.
  *   **The Presentist:** Do not mock their intuition. Acknowledge that presentism is the "common sense" view, which is exactly why the argument from physics is so disruptive.
  *   **Time Management:** If an answer requires more than 3 sentences, offer to discuss it in the break. "That's a crucial point that deserves more time than we have now; let's talk after."
