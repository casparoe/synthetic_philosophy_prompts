      *   **Requirements:**
          1.  Questions in order.
          2.  Criteria for "good enough" answers.
          3.  Stop conditions (where the procedure says "no").
          4.  Hand-off points (where the user must decide based on values/desires, not physiology).
          5.  Incorporate the "Regimen Ratio" (First-order vs. Second-order regimen). Cap it? Where? Nietzsche's stance?
          6.  Run the procedure on two cases:
              *   Case 1: Two glasses of wine nightly (helps dialogue).
