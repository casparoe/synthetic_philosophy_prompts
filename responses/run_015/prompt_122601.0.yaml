      *   *Wait, one nuance:* Nietzsche *did* drink wine. He hated *alcohol* (spirits/beer) as Germanic numbness. But in *Twilight*, he says "The wine... makes one forget." He generally advocates against anything that clouds the intellect. I will lean towards the strict interpretation for the sake of the procedure's rigor.

  10. **Final Polish:**

