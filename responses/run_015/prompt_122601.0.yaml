      *   *Question:* Cap it?
      *   *Nietzschean View:* Yes. If the regimen becomes the art, it's *décadence*. The body serves the spirit (or the creative drive).
      *   *Proposed Cap:* 10% of creative time? Or simply: If regimen > creative energy, stop.
      *   *Nuance:* "Becoming what you are" involves discipline, but *obsessive* discipline is a sign of weakness (needing external rules because internal instinct is broken).

  5.  **Running the Cases:**

