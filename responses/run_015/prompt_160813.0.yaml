answer: |-
  ## Final Paper: Jurisprudence Option
  **Time Allowed:** 48 Hours
  **Word Limit:** 2,500 words maximum

  ### Question 2: The Aurinia Instrument

  The Republic of Aurinia is governed by an *Instrument of Rules*, whose first six rules read:

  1.  The Assembly may amend or repeal any rule by a resolution supported by two-thirds of all its members.
  2.  Rule 1 may be amended or repealed only by a unanimous resolution of all members of the Assembly, confirmed by a majority at a national referendum.
  3.  Any purported amendment inconsistent with Rule 2 is void, and shall be treated as never having been enacted.
  4.  No rule has effect before the day on which it is enacted.
  5.  A rule ceases to be in force if no organ of the Republic has applied or expressly affirmed it for a continuous period of fifteen years.
  6.  A rule comes into force only when the Keeper has entered it in the Register of Rules.

  In Year 12 the Assembly passes the *Reform of Rules Act* by 71 votes to 29. The Act repeals Rule 2; amends Rule 1 so as to require only a simple majority; purports to exempt itself from Rules 3, 5, and 6; and purports to take effect from the day it was first laid before the Assembly. **Section 10 of the Act states: "This Act shall be deemed validly enacted regardless of any procedural defect in its passage."** No referendum is held. The Keeper refuses to enter the Act in the Register, and it is never entered. Between Year 12 and Year 30 the Assembly enacts fourteen statutes by simple majorities, the courts decide cases by applying them, and the Keeper enters each of them in the Register. Over the same period no organ of the Republic applies or expressly affirms Rule 2 or Rule 5. In Year 30 a litigant argues that Statute No. 9 (enacted in Year 20) is not law, because when it was enacted the Assembly had no power to enact it by a simple majority.

  **Advise the court in Year 30.** In doing so, you must:

  (a) Distinguish between amending the *procedure* of amendment, amending the *scope* of the amendment power, and exercising a power whose authority derives from the rule being amended. Does the "two-step manoeuvre" (using Rule 2 to relax Rule 1, then using Rule 1 to repeal Rule 2) succeed, or does Rule 3 block it?

  (b) Determine whether the *Reform Act* could validly exempt itself from Rule 6 (Registration) or Rule 4 (Non-retroactivity), and what follows for the fourteen statutes if the *Reform Act* was void *ab initio*.

  (c) Conclude whether the application of the fourteen statutes represents a change within one continuing legal system or a revolution instituting another.

  (d) Either redraft Rule 2 to make the two-step manoeuvre logically unavailable, or explain why no drafting can make an amendment rule unreachable by amendment.

  ***

  ## Model Answer

  **Validity, Revolution, and the Limits of Self-Reference in Aurinia**

  The court in Year 30 faces a conflict between the formal validity of the *Instrument of Rules* and the efficacious practice of the Republic's organs. The central issue is whether the *Reform of Rules Act* (Year 12) was a valid amendment or a nullity that triggered a revolutionary shift in the legal system's foundation. I argue that the *Reform Act* was void *ab initio* due to Rule 3 and the failure of self-exemption, but that the subsequent eighteen years of practice constitute a Kelsenian revolution, validating Statute No. 9 under a new Rule of Recognition.

  **The Two-Step Manoeuvre and Rule 3**
  The Assembly attempted to bypass Rule 2's entrenchment (unanimity plus referendum) by using Rule 2's own procedure to amend Rule 1 (lowering the threshold), intending to use the new Rule 1 to repeal Rule 2. This conflates the *source* of power with the *procedure* of its exercise. While a rule may typically be amended by the procedure it prescribes, Rule 3 introduces a substantive limitation: any amendment "inconsistent with Rule 2" is void *ab initio*.

  The two-step manoeuvre fails because the first step (amending Rule 1) is only valid if it remains consistent with Rule 2. However, the *purpose* of amending Rule 1 was to facilitate the repeal of Rule 2. If the amendment to Rule 1 is treated as an isolated act, it is consistent. But legal interpretation looks to the substantive effect of the legislative scheme. More critically, Rule 3 protects Rule 2 from inconsistency. A resolution to repeal Rule 2 is inherently inconsistent with Rule 2's requirement for unanimity and referendum. Therefore, even if Rule 1 were successfully amended, the subsequent use of that amended Rule 1 to repeal Rule 2 would trigger Rule 3's voidness clause. Rule 3 acts as a "poison pill"; it cannot be bypassed by procedural shuffling because the validity of the shuffle depends on the very rule being attacked.

  **Self-Application and Retroactivity**
  The *Reform Act* purported to exempt itself from Rule 6 (Registration) and Rule 4 (Non-retroactivity). This raises a paradox of self-reference. Rule 6 is a condition precedent for a rule's existence within the system ("comes into force only when..."). A rule cannot bring itself into force if it simultaneously negates the condition required for its entry. To hold otherwise is to allow the *Reform Act* to pull itself up by its own bootstraps, violating the hierarchy of validity. Without entry in the Register, the *Reform Act* never legally existed.

  Similarly, Section 10's self-validation clause ("deemed valid... regardless of defect") is legally inert. Validity is conferred by the *Instrument*, not by the statute's own assertion. If the *Instrument* says the Act is void for non-compliance, the Act cannot declare itself valid. Consequently, the retroactive clause fails. Under Rule 4, the Act cannot effectuate changes prior to its enactment. Since it never entered into force, it has no effect at any time.

  **Continuity vs. Revolution**
  If the *Reform Act* was void, the fourteen statutes enacted between Year 12 and Year 30 were technically ultra vires under the original *Instrument*. However, jurisprudence distinguishes between illegality within a system and the replacement of the system itself. Hart argues that validity is ultimately a matter of official practice (the Rule of Recognition). Kelsen argues that efficacy creates a new Basic Norm.

  Between Year 12 and Year 30, the Assembly, Courts, and Keeper (regarding the statutes, if not the Act) consistently applied the new simple majority rule. Rule 2 and Rule 5 lapsed under Rule 5's own terms (non-application for fifteen years). This sustained efficacy suggests a shift in the ultimate Rule of Recognition. The officials are no longer following the *Instrument*; they are following the *practice* established in Year 12. This is not a change of law within a system, but a revolution instituting a new system. Statute No. 9 is law not because the Year 12 Act was valid, but because the current Rule of Recognition accepts simple majority enactments as valid. The court should uphold Statute No. 9, acknowledging that the legal basis for doing so is the new customary order, not the old *Instrument*.

  **The Impossibility of Absolute Entrenchment**
  Can Rule 2 be redrafted to prevent this? No. Any rule within the legal system derives its authority from the system's ultimate rule (the *Instrument* or the Rule of Recognition). If the Assembly possesses the competence to amend rules, that competence logically includes the competence to alter the conditions of that competence. To make Rule 2 truly unamendable, it would have to be placed outside the legal system (e.g., a natural law constraint), rendering it non-legal. Within a positivist framework, a sovereign legislature cannot bind its successor regarding the *manner and form* of sovereignty itself without creating a paradox where the binding rule is both part of the system (and thus amendable) and outside it (and thus not law). Therefore, no drafting can make an amendment rule unreachable; it can only raise the political cost of revolution.

  ***

  ## Marking Scheme (Total: 25 Marks)

  **1. Hierarchy of Amendment Powers (5 Marks)**
  *   **Must Hit:** Distinguish between amending the *procedure* (Rule 1), the *scope* (Rule 2), and the *source* of authority. Recognize that amending Rule 1 does not automatically grant power to violate Rule 2.
  *   **Common Error:** Treating Rule 1 and Rule 2 as equal hurdles where clearing the higher one (Rule 2) automatically clears the lower one (Rule 1) without addressing Rule 3's substantive bar.

  **2. The Two-Step Manoeuvre & Rule 3 (5 Marks)**
  *   **Must Hit:** Analyze whether Rule 3 blocks the two-step manoeuvre. Argue whether "inconsistency" in Rule 3 covers the *intent* to repeal Rule 2 or just the *text*. Conclude definitively on whether the manoeuvre works.
  *   **Common Error:** Assuming the two-step works simply because it is logically sequential, ignoring that the *authority* for step one derives from the rule being destroyed in step two.

  **3. Self-Reference (Rule 6 & Desuetude) (5 Marks)**
  *   **Must Hit:** Address the paradox of a rule exempting itself from its own condition of existence (Rule 6). Address whether Rule 5 (desuetude) applies to itself (Rule 2/5 not applied for 15 years).
  *   **Common Error:** Ignoring Rule 6 because the Keeper eventually registered the *statutes*, failing to see the *Reform Act* itself was never registered.

  **4. Retroactivity & Status of Statutes (5 Marks)**
  *   **Must Hit:** Determine the status of the 14 statutes if the *Reform Act* is void. Connect Rule 4 (non-retroactivity) to the validity of Statute No. 9.
  *   **Common Error:** Arguing the statutes are valid simply because they were enforced, without explaining the *jurisprudential mechanism* (revolution vs. validation) that cures the initial defect.

  **5. Continuity vs. Revolution (Hart/Kelsen) (3 Marks)**
  *   **Must Hit:** Explicitly categorize the Year 12–30 period as either continuity (Hartian shift in Rule of Recognition) or revolution (Kelsenian Basic Norm change). Do not conflate the two.
  *   **Common Error:** Concluding "it is law because the courts accept it" without analyzing whether this acceptance constitutes a *new* system or the *old* system evolving.

  **6. Theoretical Limit of Entrenchment (2 Marks)**
  *   **Must Hit:** Attempt a redraft OR argue the impossibility of unamendable rules within a positivist system.
  *   **Common Error:** Suggesting "super-entrenchment" clauses (e.g., "Rule 2 can never be amended") without explaining why such a clause is legally impotent against a determined Assembly.

  ### Markers' Notes

  **The Strongest-Looking Wrong Answer:**
  The "Hartian Acquiescence" answer. This candidate argues that because the courts and Keeper applied the statutes for 18 years, the *Reform Act* was valid *all along*. They treat the Rule of Recognition as purely empirical, ignoring the normative question of *when* the shift occurred. They fail to address the *void ab initio* consequence of Rule 3 and Rule 6, effectively arguing that efficacy retroactively cures formal invalidity without labeling it a revolution. Award marks for Moves 4 and 5, but penalize heavily on Moves 1, 2, and 3 for bypassing the mechanics of validity.

  **Full Marks for Opposite Conclusion:**
  A candidate may argue that the **Two-Step Manoeuvre IS valid**. Full marks should be awarded if they argue that Rule 3 only voids amendments *inconsistent with the procedure* of Rule 2, not those inconsistent with its *entrenchment purpose*, provided Rule 2's own procedure (unanimity) was used for the first step. If they rigorously distinguish between the *text* of Rule 2 (which can be changed) and the *power* underlying it, and maintain this position consistently through the Revolution/Continuity analysis, they demonstrate the required analytical depth. The scheme rewards argumentative coherence, not agreement with the model.
