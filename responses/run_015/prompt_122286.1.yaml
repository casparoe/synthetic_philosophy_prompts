answer: |-
  This is a fantastic question. You have hit on one of the deepest tensions in metaphysics and the philosophy of physics. You are right to feel that your friend's objection ("position doesn't count without a background") feels like a bit of a dodge, but it also touches on a real historical debate about the nature of space.

  Here is the breakdown of how Max Black's spheres and Quantum Mechanics (QM) indistinguishability relate, where they differ, and what metaphysical baggage they carry.

  ### 1. Max Black's Spheres: The Conceptual Attack
  Max Black's 1952 thought experiment was designed specifically to attack Leibniz's **Principle of the Identity of Indiscernibles (PII)**. PII states: *If two things share all the same properties, they are numerically identical (i.e., they are the same thing).*

  Black argues: **No. Two things can share all properties and still be two things.**

  *   **The Setup:** A symmetric universe with only two iron spheres. Same mass, same color, same temperature.
  *   **The "Position" Objection:** Your friend argues that without a coordinate grid, "position" isn't a property. Black anticipated this. He argues that even **relational properties** don't save PII here. Sphere A is "2 miles from Sphere B." Sphere B is "2 miles from Sphere A." The relations are symmetric. There is no property that A has that B lacks.
  *   **The Verdict:** Black claims our intuition tells us there are *two* spheres, not one. Therefore, numerical distinctness (being two things) does not require qualitative distinctness (having different properties).

  **Metaphysical Commitment:** To make Black's example work, you generally need to believe in **Haecceity** (or "primitive thisness"). This is the idea that an object has an identity over and above its properties. Sphere A is Sphere A simply because it *is* itself, not because of what it's like.

  ### 2. Quantum Indistinguishability: The Empirical Attack
  In quantum mechanics, specifically with identical particles (like electrons in a helium atom), the situation is different.

  *   **The Physics:** If you swap two electrons, the physical state of the system does not change in any measurable way. The wavefunction is either symmetric or antisymmetric.
  *   **The Implication:** It is not just that we *can't tell* the electrons apart (epistemic indistinguishability); it is that the physics suggests there *is no fact of the matter* about which electron is which (ontic indistinguishability).
  *   **The Verdict:** This challenges PII empirically. If there are two electrons, but no property (position, momentum, spin, intrinsic tag) distinguishes them, PII is false in our actual universe.

  **Metaphysical Commitment:** QM often pushes philosophers toward **Ontic Structural Realism** or the idea of **Non-Individuals**. Instead of saying "there are two things with primitive thisness" (like Black), some argue "there are no 'things' at all, only excitations in a field or structures."

  ### 3. Are They the Same Challenge?
  They attack the same rule (PII), but they do it from different angles.

  **Black is Modal; QM is Actual.**
  *   **Black** asks: "Is it *possible* for PII to be false?" He uses intuition to show that a universe violating PII is conceivable. If it is conceivable, then PII is not a *logical truth*.
  *   **QM** asks: "Is PII *actually* false?" It provides evidence that our specific universe violates PII.

  **The "Hidden Difference" Problem**
  You asked: *If Black's spheres had some hidden internal difference we just couldn't see, would that ruin the example in a way that doesn't apply to quantum particles?*

  **Yes, exactly.**
  *   **In Black's Case:** A critic can always say, "Maybe Sphere A has a microscopic scratch we can't see, or a different atomic arrangement." Black has to **stipulate** by fiat that they are exactly alike. His argument rests on the *possibility* of exact likeness. If you believe matter is infinitely divisible or always has some tiny variation, Black's scenario is physically impossible, even if conceptually coherent.
  *   **In QM:** We have stronger grounds to rule out hidden differences. **Bell's Theorem** and the **Kochen-Specker Theorem** suggest that there are no "hidden variables" lurking underneath determining which particle is which (assuming locality and realism). The indistinguishability is built into the math of the wavefunction, not just a limitation of our microscopes.

  So, QM is a "harder" counterexample because it is backed by empirical constraints that rule out the "hidden difference" escape route that Black's critic can use.

  ### 4. Your Friend's Objection (Relationism vs. Substantivalism)
  Your friend's claim that "position doesn't count without a universe to measure against" is actually a revival of **Leibniz's own view of space**.

  *   **Substantivalism (Newton/Black):** Space is a container. You can be "here" vs "there" even if nothing else exists. This allows Black's spheres to be distinct by location.
  *   **Relationism (Leibniz):** Space is just the set of relations between objects. If there are only two spheres, their "position" is just their distance from each other. Since that distance is symmetric, there is no difference.

  If your friend is a strict Relationist, Black's universe is impossible. In a Relationist view, a universe with two symmetric spheres is indistinguishable from a universe with *one* sphere. Black assumes Substantivalism (or at least that spatial distinctness is real) to make his point.

  ### 5. Summary of Differences

  | Feature | Max Black's Spheres | Quantum Particles |
  | :--- | :--- | :--- |
  | **Type of Argument** | Conceptual / Thought Experiment | Empirical / Physical Theory |
  | **Goal** | Show PII is not a *logical necessity* | Show PII is not a *physical truth* |
  | **Identity** | Assumes distinct objects (Haecceity) | Questions if "objects" exist at all |
  | **Hidden Variables** | Ruled out by stipulation (fiat) | Ruled out by theorems (Bell, etc.) |
  | **Space** | Requires space to allow distinct locations | Particles often lack definite trajectories |

  ### The Bottom Line
  You are right that your friend is trying to define away the problem, but they are echoing Leibniz's own defense. However, Black's point stands as a logical possibility: **Distinctness does not logically require difference.**

  Quantum Mechanics takes this further. It suggests that **Distinctness might not even exist.** In Black's universe, there are definitely two spheres; they just look alike. In QM, it's debatable whether there are "two" particles in the classical sense, or just a single quantum state with "two-ness" as a property of the system, not the individuals.

  So, Black defends the idea that **identity is primitive** (things are distinct because they are themselves), while QM often forces philosophers to argue that **individuality is derivative** (things are only distinct if physics distinguishes them). They both kill Leibniz's principle, but Black kills it to save our intuition about objects, while QM kills it to save the math of the universe.
