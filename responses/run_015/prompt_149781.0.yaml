answer: |-
  # Teaching Plan: The Reference Class Problem (45 Minutes)

  **Audience Profile:** Technically literate, rationalist-adjacent (familiar with Bayes, forecasting tournaments, cognitive biases).
  **Goal:** Move the audience from viewing RCP as a "data scarcity" issue to viewing it as an "ontological selection" issue.

  ---

  ## 1. Sequence Dependency (5 Minutes)
  **Order:** **Inside/Outside View first**, Structural Underdetermination second.

  **Rationale:**
  *   **Inside/Outside** is part of your audience's existing vernacular (Kahneman, Tetlock, Superforecasting). It provides the *pragmatic hook*. They already believe the Outside View is normatively superior but difficult to execute.
  *   **Structural Underdetermination** is the *explanation* for that difficulty. If you start with underdetermination, it feels like abstract philosophy. If you start with the failure of the Outside View, it feels like a tool-breaking problem they need solved.
  *   **Flow:** "You know you should use the Outside View. Here is why you can't."

  ---

  ## 2. Carrying Example: AI Timelines (10 Minutes)
  **Decision:** Anchor the session on analogizing AI to **Nuclear Weapons Development**. Treat **Moore's Law** as the foil (the tempting but misleading alternative).

  **Why Nuclear Works:**
  *   **Ontological Flexibility:** Nuclear development can be validly classified as "Scientific Discovery" (slow, cumulative), "Military Procurement" (budget-driven, bursty), or "Geopolitical Race" (game-theoretic, deadline-driven). Each class yields different base rates for "time to capability."
  *   **Human Agency:** It highlights that reference classes are often defined by *intent* and *social structure*, not just physical parameters. This makes the "choice" of class visible.
  *   **Divergence:** The base rates for "years from concept to deployment" differ wildly depending on whether you class it as "Physics" vs. "War."

  **Why Moore's Law Fails as the Anchor:**
  *   **Reification Risk:** Moore's Law is often perceived as a "law of nature" or an economic inevitability rather than a reference class. It tempts the audience to think there is a *single correct curve* to fit, masking the RCP as a curve-fitting problem.
  *   **Hidden Class Selection:** Using Moore's Law hides the fact that you have already selected the class "Semiconductor Compute" over "Algorithmic Efficiency" or "System Integration." It makes the reference class selection feel invisible, which is the exact opposite of what you want to teach.

  **Required Properties for the Example:**
  1.  **High Stakes:** Motivates the need for precision (AI/Nukes).
  2.  **Competing Valid Descriptions:** The target must plausibly belong to multiple categories that are not subsets of one another.
  3.  **Divergent Base Rates:** The competing categories must yield meaningfully different probabilities/timelines.

  ---

  ## 3. Core Instruction: Structural Underdetermination (10 Minutes)
  **Concept:** There is no "view from nowhere." Every Outside View requires selecting a description of the event, and descriptions are not determined by the event itself.

  **Key Move:** Show that "AI Development" is not a natural kind. It is a linguistic bucket we pour events into.
  *   *Visual:* Display two overlapping circles. Circle A: "Projects with exponential funding." Circle B: "Projects dependent on basic science breakthroughs." AI is in the intersection.
  *   *Point:* The probability of success depends on which circle you stand in. The event (AI) does not tell you which circle is the "real" one.

  ---

  ## 4. Misconception Management (10 Minutes)
  *Address these in this specific order to prevent backsliding.*

  **A. "Finer-Grained Classes Solve It"**
  *   **The Trap:** "Just add more variables until the class is specific to the case."
  *   **The Head-Off:** Introduce the **Reference Class of One**. If you include every property of the specific AI project (funding, team, location, codebase), the class contains only one member. The base rate becomes 0% or 100%. The Outside View collapses into the Inside View.
  *   **Timing:** Immediately after defining Underdetermination.

  **B. "It's Just Bayes with a Flat Prior"**
  *   **The Trap:** "Average the probabilities from all plausible reference classes."
  *   **The Head-Off:** Ask: "What is the reference class for *plausible reference classes*?" To weight the classes, you need a hyper-prior over classes, which requires a hyper-hyper-prior. This is infinite regress, not calculation. Furthermore, classes are not mutually exclusive (AI is *both* like Nukes and like Moore's Law), violating standard Bayesian partition requirements.
  *   **Timing:** After the "Finer-Grained" objection.

  **C. "Domain Expertise Makes It Disappear"**
  *   **The Trap:** "Experts know the right class."
  *   **The Head-Off:** Point out that expert disagreement is often *reference class disagreement*. An economist sees "Market Adoption" (slow); an engineer sees "Performance Metrics" (fast). Both are experts. The expertise selects the ontology; it does not resolve it.
  *   **Timing:** Final misconception, bridging to the diagnostic.

  ---

  ## 5. Diagnostic Question (5 Minutes)
  **Goal:** Distinguish between *epistemic ignorance* (not enough data) and *ontological underdetermination* (no fact of the matter).

  **The Question:**
  > "Imagine you have infinite, perfect historical data for two reference classes:
  > 1.  **'Tech Startups'**: 10% success rate.
  > 2.  **'Cambridge Graduates'**: 50% success rate.
  >
  > You are predicting the success of *Alice*, a Cambridge Grad who founded a Tech Startup. You have no other data.
  >
  > **Question:** Is there a fact of the world that makes one of these probabilities the 'true' Outside View for Alice? If yes, what kind of fact is it (physical, logical, or social)? If no, what are you actually doing when you pick one?"

  **Success Criteria:**
  *   **Fail:** "We need more data on Cambridge Startups." (Misses the point: we are testing the *principle* of selection).
  *   **Fail:** "Average them to 30%." (Falls for the Flat Prior trap).
  *   **Pass:** "No. The 'true' probability depends on the *purpose* of the forecast. The classes are tools, not discoveries."

  ---

  ## 6. Explicit Exclusions (5 Minutes)
  *State these at the end to define the boundary of the session.*

  1.  **Formal Exchangeability (de Finetti):**
      *   *Why Omit:* Requires measure theory. The practical lesson (class selection is arbitrary) holds without the formal proof.
  2.  **The Sleeping Beauty Problem:**
      *   *Why Omit:* Conflates self-locating belief with reference class selection. Too controversial and distracts from the forecasting application.
  3.  **Reichenbach's "Narrowest Class" Principle:**
      *   *Why Omit:* As shown in the "Finer-Grained" misconception, this leads to the Reference Class of One. It is a failed solution, not a live option.

  **Safety of Omission:**
  For a forecasting audience, RCP is a *calibration hazard*, not a metaphysical crisis. Understanding that class selection is a *decision* rather than a *discovery* is sufficient to improve their forecasting hygiene without needing the formal machinery of probability foundations.

  ---

  ## 7. Session Timeline Summary
  *   **00-05:** Inside/Outside View (The Hook).
  *   **05-15:** AI Timelines: Nuclear vs. Moore's (The Example).
  *   **15-25:** Structural Underdetermination (The Mechanism).
  *   **25-35:** Misconceptions (Graining, Bayes, Expertise).
  *   **35-40:** Diagnostic Question.
  *   **40-45:** Exclusions & Q&A.
