answer: |-
  You are tripping over one of the most famous and contentious puzzles in modern philosophy, and your instincts about its strange shape are shared by almost everyone who encounters it for the first time. The argument your friend deployed is known as the Doomsday Argument, and the specific philosophical machinery it relies on falls under the umbrella of anthropic reasoning or self-locating belief. What is bothering you is not just the conclusion, but the epistemic mechanism required to get there, specifically how it treats information about your own existence as data that should update your probabilities about the world. You are right to feel that something slippery is happening with the evidence, and you are also right that the bus stop case feels different for structural reasons, not just psychological ones. There isn't a single perfect word for the specific sensation of unease you are describing, but it is a composite of what philosophers call the problem of old evidence, the reference class problem, and the tension between different ways of handling indexical information.

  The core move your friend made is to treat you as a random sample from the set of all humans who will ever live. This is technically called the Self-Sampling Assumption. The logic is that if you assume you are a random observer drawn from the total set of observers, you should expect to find yourself somewhere in the middle of the distribution rather than at the very beginning or the very end. Since you know roughly how many humans have lived so far, you can use your position in that queue to estimate the total length of the queue. The weirdness you feel, where a fact you have known forever suddenly starts doing evidential work, is a variation on the problem of old evidence. In the case of Einstein and Mercury, the orbit was known before the theory, but the theory provided a new explanation that made the orbit expected rather than coincidental. In your case, the fact that you are alive now was known, but the argument reframes it as the fact that you are the hundred-billionth human. The shift happens because you are moving from knowing a general fact about the world to knowing a specific indexical fact about your position within it. It feels like a trick because the information hasn't changed, but the description of the information has, and Bayesian updating rules are notoriously sensitive to how evidence is described.

  Your worry about the timing of when you hear the argument is actually one of the strongest objections raised against this line of reasoning, and it highlights a genuine instability in the logic. If the probability of humanity ending soon depends on your birth rank, and your birth rank increases every moment you stay alive, then the probability of doom should rise continuously as you age, even if nothing else changes in the world. This implies that merely by surviving another year, you become evidence for the imminent extinction of your species, which feels absurd. This sensitivity suggests that the argument depends heavily on how you define the group you are sampling from, which is known as the reference class problem. If you define the class as humans born before the year two thousand, the argument yields one result. If you define it as all conscious beings, or all humans who ever understand the Doomsday Argument, the result changes. The fact that the conclusion slides depending on when you encounter the reasoning suggests that the argument might be measuring something about your perspective rather than something about the population dynamics of the species.

  The reason the bus stop case feels like common sense while the species case feels like a swindle is that the structural relationship between the observer and the sequence is different. When you wait for a bus, you are an external observer sampling a duration that exists independently of your observation. The bus schedule does not change based on whether you are standing at the stop. In the human species case, you are an internal part of the sequence you are trying to measure. Your existence is not independent of the total number of humans. There is a counter-argument called the Self-Indication Assumption which suggests that you are actually more likely to exist in a world with a larger number of observers simply because there are more slots available for you to occupy. If you combine the idea that you are likely to be in the middle of the sequence with the idea that you are more likely to exist in a longer sequence, the two effects cancel each other out. In the bus stop case, your presence at the stop doesn't make the bus route more likely to exist, so the simple median reasoning holds. In the humanity case, your presence might be evidence that humanity is large enough to produce you, which neutralizes the doom prediction.

  So to answer your question directly, the phenomenon you are noticing is the friction between treating subjective perspective as objective data. It doesn't have a single colloquial name, but in philosophy it is discussed under the headers of anthropic principles and self-locating belief. The distinctions that do the real carving are between the Self-Sampling Assumption, which your friend used, and the Self-Indication Assumption, which blocks the conclusion, as well as the distinction between external observations like bus arrivals and internal observations like birth ranks. Your worries are not bad worries; they are actually the standard objections that keep this argument from being accepted as a proof. The feeling that the conclusion is about your reading history rather than the species is a precise intuition about the reference class problem, and the feeling that the bus stop case is different is a precise intuition about the independence of the observer. You are not missing a trick; you are noticing the cracks in the reasoning that experts still argue over. The argument works best when the observer is truly external and the sample is truly random, and humanity's future fails both those tests in ways that a bus schedule does not.
