      *   *So why does the friend say CDT recommends Fleeing?* Because the agent *knows* Death is a perfect predictor. A rational agent cannot maintain 50/50 priors while believing they are about to choose. If I decide to Stay, I must believe $P(D|Stay) \approx 1$. CDT says don't use $P(D|Stay)$, use $P(D)$. But how do I get $P(D)$? If I know the predictor is perfect, my $P(D)$ should track my $P(Stay)$.
      *   *The Instability:* If $P(Stay) > 0.5$, then I believe $P(D) > 0.5$. If $P(D) > 0.5$, then $EU(F) > EU(S)$ (assuming survival is worth more than cost). So I switch to Flee. If I switch to Flee, $P(A) > 0.5$, so $EU(S) > EU(F)$. I switch to Stay. Loop.
      *   *Correction to Friend's Claim:* The friend says CDT recommends fleeing because "if there is even a small chance Death is in Damascus." This implies the agent thinks $P(D)$ is high. Why would they think that? Because they are inclined to Stay. So the friend is describing the *unstable equilibrium* state, not the initial state. I need to make this distinction clear.
