  8.  (Refining the "Instability"): The instability arises because the agent's credence in $D$ is tied to their credence in their own action $S$. $P(D) \approx P(S)$.
      *   If $P(S)$ is high, $P(D)$ is high. If $P(D) > 0.5$, CDT prefers $F$.
