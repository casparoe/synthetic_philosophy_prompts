      *   If $P(D) = P(A) = 0.5$ (Causal priors).
      *   $EU(S) = 0.5(Die) + 0.5(Live)$.
      *   $EU(F) = 0.5(Live - Cost) + 0.5(Die - Cost) = 0.5(Live) + 0.5(Die) - Cost$.
