  7.  (Self-Correction on "Small Chance"): The friend says "if there is even a small chance that Death is in Damascus, fleeing raises your chance of survival."
      *   If $P(D) = \epsilon$.
      *   $EU(Stay) = \epsilon(Die) + (1-\epsilon)(Live)$.
      *   $EU(Flee) = \epsilon(Live) + (1-\epsilon)(Die) - Cost$.
