  5.  **Refining the Technical Details (Self-Correction during drafting):**
      *   *Wait, check the CDT 50/50 calculation again.*
      *   States: $D$ (Death in Dam), $A$ (Death in Alep).
      *   Acts: $S$ (Stay), $F$ (Flee).
