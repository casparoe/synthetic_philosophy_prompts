  In a philosophy of mind discussion group I attend, a fellow participant has begun treating the slogan 'Gödel's theorem proves the human mind isn't a computer' as an automatic refutation of any mechanist account of cognition, including recent suggestions that large language models or other algorithmic architectures might eventually replicate human mathematical judgment. Last session, after I noted that a sufficiently complex neural network could in principle reproduce the pattern of human arithmetical responses, she invoked Lucas and Penrose: for any consistent formal system there exist true Gödel sentences it cannot prove, yet human mathematicians can recognize those sentences as true, therefore no formal system can be identical to human reasoning, and consequently no computer—however large or probabilistic—could genuinely replicate it. I want to return with a careful disambiguation rather than a flat contradiction, because I suspect the slogan collapses several distinct arguments that vary enormously in strength and in what they actually threaten.

  Can you lay out the precise theses hiding inside 'Gödel's theorem proves the human mind isn't a computer'? I need a menu that clearly separates at least the following: (a) the targeted Lucas-Penrose argument applied to a specific formal system F claimed to model one person's mathematical output, where the human constructs F's Gödel sentence and recognizes its truth; (b) the universal claim that no consistent formal system whatsoever, regardless of architecture or complexity, can capture all human mathematical knowledge; (c) the epistemic or faculty-based claim that human recognition of Gödel sentences involves a non-computational capacity—such as direct rational intuition of consistency—that differs in kind from algorithmic processing, even if the brain is physically realized; (d) the common misinterpretation that Gödel's first incompleteness theorem entails that no computer can ever solve particular open problems or generate novel mathematics; and (e) a variant involving probabilistic or approximate formalizations, where the system is allowed minor inconsistencies or stochastic outputs, and whether Gödel's construction still applies with the same force. For each reading, indicate whether it is trivial, substantive and defensible within anti-mechanism, false or incoherent, or a confusion of Gödel's first and second theorems; and say specifically whether it threatens only classical formalist models of mind, or also modern connectionist and probabilistic ones.

