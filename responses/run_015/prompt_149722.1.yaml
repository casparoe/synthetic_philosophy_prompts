  Menu of five readings
  (a) **Specific System Refutation:** For any consistent formal system F claimed to model a person, the human recognizes G(F) as true. *Status:* Substantive and defensible within anti-mechanism. *Threat:* Targets classical formalist models specifically. This relies on the human knowing F and being consistent. It struggles against opaque neural nets where F is unknowable. If the mind is a black box, the human cannot construct G(F). Thus, it threatens explicit symbolic AI but not necessarily implicit connectionist weights, as the diagonalization requires access to the system's code. It is substantive only if the mind is transparent to itself.

  (b) **Universal Knowledge Claim:** No consistent system whatsoever can capture all human mathematical knowledge. *Status:* False or incoherent. Humans are not consistent formal systems; we err. Gödel applies only to consistent systems. *Threat:* Threatens neither classical nor modern models. It fails against any realistic model acknowledging human fallibility. It sets up a straw man of perfect human rationality. If humans are inconsistent, Gödel's theorem does not apply to us as systems, dissolving the contradiction. This reading threatens no viable cognitive science model. It is logically false because it misapplies a theorem about consistent systems to inconsistent agents.

  (c) **Non-Computational Faculty:** Truth-recognition requires non-algorithmic intuition (e.g., direct grasp of consistency). *Status:* Substantive and defensible within anti-mechanism. *Threat:* Targets both classical formalist and modern connectionist models. It posits a non-physical cognitive capacity distinct from processing architecture, claiming algorithmic processing cannot replicate insight. This bypasses architecture entirely, arguing the *nature* of understanding is non-computational, threatening LLMs regardless of scale. It requires dualist or non-naturalist commitments. This is the only reading that survives architectural changes, as it attacks the metaphysical basis of computation itself.

  (d) **Open Problem Confusion:** Gödel implies computers cannot solve novel math problems or generate new truths. *Status:* Confusion of Gödel's first and second theorems. Incompleteness does not mean unsolvability. Computers can prove theorems humans cannot. *Threat:* Threatens neither classical nor modern models. It is empirically falsified by automated theorem provers. It misidentifies the theorem's scope regarding computational power. Gödel limits formal systems, not computational creativity or problem-solving capacity per se. This reading is easily dismissed by existing AI capabilities. It is a confusion of incompleteness with computational limits.

  (e) **Probabilistic/Inconsistent Variant:** Gödel blocks stochastic or approximate systems. *Status:* Confusion of Gödel's first and second theorems. Gödel requires strict consistency; probabilistic systems evade strict diagonalization via noise or inconsistency tolerance. *Threat:* Threatens classical formalist models weakly, but fails against modern probabilistic ones. Modern architectures are not consistent formal systems in the requisite logical sense, blunting the argument's force against LLMs. If the system is allowed minor inconsistencies, the Gödel sentence construction fails, protecting probabilistic models. This reading misunderstands the logical prerequisites of the theorem. It fails to threaten probabilistic models because the theorem's consistency condition is not met.

  Collectively, these readings range from empirically falsified claims to metaphysical assertions, demonstrating that the slogan's power depends entirely on which specific thesis is invoked.

  What the LLM debate requires
  To block the possibility that an LLM could reproduce human-like mathematical reasoning, your interlocutor cannot rely on readings (a), (b), (d), or (e). Reading (a) fails because LLMs are not transparent formal systems F that a human can inspect to construct G(F). Reading (b) is false due to human inconsistency. Readings (d) and (e) are technical confusions. Consequently, only reading (c)—the claim that human recognition involves a non-computational faculty—does the required work. This is the strongest version because it attacks the metaphysical possibility of algorithmic replication regardless of architecture. However, it is also the most controversial, as it depends on the premise that human mathematicians are perfectly consistent and possess introspective access to that consistency. If she admits humans are inconsistent or that intuition is merely heuristic processing, the argument collapses. Therefore, to sustain her conclusion against modern probabilistic architectures, she must defend the substantive claim that mathematical insight transcends algorithmic processing entirely, rather than merely pointing to incompleteness. This shifts the debate from logic to philosophy of mind, requiring evidence for non-physical cognition rather than reliance on Gödel's theorems alone.

  Questions for the group
  1. **Consistency Premise:** Do you assume human mathematicians are logically consistent? Since Gödel's theorem applies only to consistent systems, does acknowledging human error invalidate the analogy between mind and formal system?
  2. **Stochastic Architectures:** Does your argument apply to probabilistic models? If cognition is stochastic rather than strictly deductive, does the construction of a Gödel sentence remain valid, or does noise evade the diagonalization?
  3. **Knowability of F:** Must the human know the formal system F modeling them to see the truth of G(F)? If the mind is a black-box neural network unknown to itself, can the Lucas-Penrose diagonalization proceed, or does opacity block the refutation?
