  However, the third sentence regarding unfalsifiability requires nuanced correction. While Gould and Lewontin fiercely criticised the tendency of adaptationists to construct just-so stories that render their hypotheses immune to disconfirmation, they did not strictly conclude that adaptationism is logically unfalsifiable. Rather, they argued that it is often treated as an a priori assumption rather than a testable hypothesis, thereby becoming methodologically unfalsifiable in practice when researchers invent hidden benefits for every trait without rigorous evidence. The summary presents this methodological warning as a definitive logical conclusion, which slightly hardens their critique into a claim they did not explicitly make. The most significant deviation occurs in the fourth sentence, which asserts that the spandrel critique demolishes evolutionary psychology. This is historically inaccurate as the discipline of evolutionary psychology did not exist under that name when the paper was published, and while Gould subsequently became a prominent critic of evolutionary psychology, the 1979 text itself could not have drawn this conclusion. It is more accurate to say that later scholars have applied the spandrel critique to evolutionary psychology, rather than that Gould and Lewontin derived the demolition of that field from their original argument.

