prompt: |-
  I recently encountered a summary in an unnamed philosophy of biology essay that attempts to capture Gould and Lewontin's spandrel critique, and I should like an accuracy audit. The summary runs as follows: 'Gould and Lewontin argued that evolutionary biologists commit the Panglossian error of treating every trait as a purpose-built adaptation, ignoring that many features are spandrels—structural by-products like the triangular spaces between arches in San Marco—which exist not because selection favoured them but because they are inevitable consequences of other design choices. They insisted that once a spandrel exists it may be co-opted for a secondary use, but that co-option is not adaptation in the original sense. From this they concluded that adaptationism is unfalsifiable: whenever biologists encounter a trait with no obvious purpose, they invent a hidden-benefit narrative, and whenever they find a purpose, they claim vindication. Therefore, the spandrel critique demolishes evolutionary psychology, which treats every mental trait as a Pleistocene adaptation, and it further demonstrates that developmental locking—the rigid canalisation of growth pathways—makes spandrels unavoidable in any complex body plan.' I am unsure how much of this is faithful. Could you go through the summary carefully, identifying which sentences accurately reflect their classic argument, which ones subtly misrepresent it—perhaps by conflating spandrels with exaptations, overstating the anti-adaptationist conclusion, or presenting a standard objection as a definitive refutation—and whether the claim about evolutionary psychology actually follows from anything Gould and Lewontin said? I should also like you to address whether the reference to developmental locking is a legitimate extension of their view or an anachronistic import from later evolutionary developmental biology. Please respond in continuous prose with no headings, bullet points, bold text, or tables, and write in British English throughout.
