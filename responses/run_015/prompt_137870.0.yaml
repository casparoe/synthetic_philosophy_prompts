  Then the residue report, in three buckets: what carried over exactly, what fit only after being bent, and what has no expression in my vocabulary at all. Two bits I'm most curious about. One: the entire argument runs on what would happen at nodes that never get visited, and I only ever get data on-path — I half-remember game theory having an equilibrium notion where beliefs only have to be correct along the path actually played; name it if it's real, otherwise describe the closest thing, and say whether it dissolves the paradox or whether backward induction rides right through it. Two: my gut says the paradox is just an artifact of hard-coding the opponent as a known, fixed, exactly-rational policy inside my environment, and that against a real learned opponent the first-node grab collapses — is that right, or am I sneaking something in? For each piece of residue, say whether my vocabulary is missing something real or the puzzle was never as sharp as it's made out to be.
