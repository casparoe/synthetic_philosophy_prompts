answer: |-
  Your department's practice presupposes that confirmation is not merely a logical relation between hypothesis and evidence, but an **epistemic relation indexed to the process of hypothesis construction**. The rubric prioritizes **use novelty** over temporal novelty. The core worry is not that the evidence is old, but that it was **available for tuning**.

  The three tiers grade the **severity** of the test. Tier 1 (pre-registration) ensures the data could not influence the hypothesis, maximizing the risk of failure. Tier 3 (post hoc) minimizes risk because the hypothesis could be tailored to fit noise. Tier 2 sits in between. This presupposes a **comparative account**: evidence confirms H only relative to rivals that might also fit the data. If H was constructed using D, rivals can easily be constructed to fit D too, lowering H's discriminatory power.

  This explains the exceptions. **Replications** confirm because they introduce **new data**. The hypothesis is old, but the evidence is fresh and unavailable for tuning the original design. **Known anomalies** (like Mercury) confirm because the new theory was not constructed to fit them; the theory **risked failure**. The confirmation comes from the theory's ability to discriminate against rivals that failed to explain the anomaly, without having been adjusted to do so.

  Is this Bayesian? Yes, with caveats. A Bayesian can endorse this by treating the **likelihood ratio** as sensitive to **model selection procedures**. If you search through hypothesis space until you find one that fits D, P(D|H) is inflated by the search process. Pre-registration and blind analysis fix the hypothesis or pipeline before seeing the signal, preventing this inflation. Thus, the rubric is rational for a Bayesian who acknowledges that **provenance affects likelihoods**. The "old evidence" problem is dissolved by indexing confirmation to the agent's epistemic situation: did the agent use E to build H?

  If you replaced this with a straightforward comparative-likelihood view that ignored construction history:
  1.  **The Tiers:** They would collapse. If confirmation is solely about fit (likelihood), a post hoc fit counts equally to a prediction. The tiers exist precisely because we cannot trust likelihoods without knowing the construction process.
  2.  **Anomalies:** Credit would vanish. In a standard Bayesian update, old evidence (credence 1) cannot boost credence. The current practice survives only because it treats the *theory's novelty* relative to the *data's availability* as the confirmatory engine.
  3.  **Blind Analysis:** It would become pointless. If only the final fit matters, hiding the signal region during pipeline construction is unnecessary labor.

  Ultimately, the practice presupposes that confirmation requires **risk**. Data confirms only if the hypothesis could have been wrong. Pre-registration, blind analysis, and explaining anomalies without accommodation all ensure that the hypothesis **could have failed** but didn't. The rubric grades the **probability of false success** due to tuning, not the logical fit alone. A sophisticated Bayesian who adjusts likelihoods for degrees of freedom and selection bias would keep the rubric; a naive likelihoodist would discard it. Your department implicitly accepts that evidence discriminates against rivals only when the hypothesis was not built to accommodate that specific evidence.
