      Your department's practice presupposes that confirmation is not merely a logical relation between hypothesis and evidence, but an **epistemic relation indexed to the process of hypothesis construction**. The rubric prioritizes **use novelty** over temporal novelty. The core worry is not that the evidence is old, but that it was **available for tuning**.

