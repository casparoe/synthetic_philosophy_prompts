      *   *Key Correction:* Stability of hybrids is not a proven law; many stable institutions are hybrids.

  5.  **Refining the "Collapse" Claim:**
      *   I need to be sure. Does Gelfand say hybrids collapse? In *Rule Makers, Rule Breakers*, she discusses the "Goldilocks" principle (too tight is oppressive, too loose is chaotic). She suggests nations should aim for the middle. She does *not* say domain-specific hybrids (tight on X, loose on Y) are inherently unstable. In fact, she cites organizations that succeed by being tight on core values but loose on periphery. The friend's claim about "within a generation" collapse is likely a hallucination or a conflation with something like "cults eventually implode." I need to call this out firmly.

  6.  **Refining the "Trauma" Claim:**
      *   Gelfand emphasizes *threat*. "Historical trauma" is a pop-psych simplification of "history of ecological and human-made threats." It implies psychological damage rather than adaptive coordination. Important distinction.

  7.  **Final Polish:**
