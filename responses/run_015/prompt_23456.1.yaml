prompt: |-
  I'm on the board of my neighborhood food co-op (five elected directors, about 300 members) and we're close to voting on whether to take out a $60k loan to buy a used delivery truck. One of the directors read about the Condorcet jury theorem and keeps pushing to expand the board to fifteen before the vote, on the theory that the bigger the group that's voting, the more likly the majority gets it right, and he points out that our last two big votes passed 5-0, which to him means we're just right and need more of us. I've been chewing on this on my own and I can't figure out if he's actually right, but I don't want to just throw a textbook at him. Can you draft a short memo I can circulate to the other directors before next Tuesday's meeting? It should recommend a concrete course of action, with a timeline we can actually follow, and it should engage his argument honestly, including the strongest version of it. A few facts that might matter: most of our members live within a couple of blocks of the store and shop the same hours, the loan only pays off if delivery demand keeps growing, which we can't really see in advance, and we haven't done any actual surveying of delivery demand, we've just been guessing.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a neighborhood food co-op (5 directors, 300 members).
      *   **Issue:** Voting on a $60k loan for a used delivery truck.
      *   **Conflict:** One director wants to expand the board from 5 to 15 members *before* the vote, citing the Condorcet Jury Theorem (CJT). He argues the recent 5-0 votes prove the board is competent, so more voters = better outcome.
      *   **Goal:** Draft a short memo to circulate to other directors before next Tuesday's meeting.
      *   **Requirements:**
          *   Recommend a concrete course of action with a timeline.
          *   Engage the CJT argument honestly (including its strongest version).
          *   Avoid just "throwing a textbook" at him.
          *   Incorporate specific facts: Members live close/shop same hours, loan viability depends on uncertain demand growth, no actual surveying done yet (just guessing).

  2.  **Deconstruct the Condorcet Jury Theorem (CJT) Argument:**
      *   *What is it?* If voters are independent and each has a >50% chance of being right, adding more voters increases the probability the majority is right.
      *   *The Director's Logic:* We voted 5-0 twice (implies competence/>50% accuracy). Therefore, 15 voters is better than 5.
      *   *The Flaws/Nuances:*
          *   **Independence:** CJT requires *independent* judgments. Co-op board members talk to each other, share biases, and live in the same neighborhood (echo chamber risk).
          *   **Competence:** CJT requires average competence > 0.5. Do we actually know the *right* answer about the truck? We haven't surveyed demand. If we are all guessing wrong together, more voters just cement the error.
          *   **Common Bias:** If the board shares a systematic bias (e.g., over-optimism about growth), adding more similar people doesn't help.
          *   **Cost/Efficiency:** Expanding a board from 5 to 15 slows decision-making and increases coordination costs.
          *   **The Real Issue:** The problem isn't the *voting mechanism*, it's the *information gap*.

  3.  **Determine the Best Course of Action:**
      *   Expanding the board right now is a distraction and delays the decision without solving the core problem (lack of data).
      *   The core problem is uncertainty about delivery demand.
      *   *Recommendation:* Pause the vote, conduct a rapid member survey to validate demand, *then* vote with the current board.
      *   *Timeline:* Needs to fit before or around next Tuesday, or shortly thereafter. Let's aim for a decision within 3-4 weeks.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the director's point (validate him) to keep tone collaborative.
      *   **Engaging CJT:** Explain *why* it's compelling but highlight the specific conditions (independence, competence) that might not be met here. Use the "guessing" fact.
      *   **The Real Risk:** It's not about the number of voters; it's about the quality of information. $60k is a lot.
      *   **Recommendation:** Don't expand the board. Instead, get data.
      *   **Timeline:** Concrete steps (Survey -> Analysis -> Vote).
      *   **Closing:** Call to action for the meeting.

  5.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Avoid academic jargon where possible, or explain it simply.
      *   Focus on fiduciary responsibility (the $60k loan).
      *   Make sure the "5-0 votes" point is addressed (that shows agreement, not necessarily accuracy).

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* Make the survey short and digital. 2 weeks for survey, 1 week for analysis.
      *   *Critique:* Did I address the "5-0 votes" point?
      *   *Fix:* Explicitly mention that unanimity suggests shared perspective, which violates the "independence" assumption of CJT.
      *   *Critique:* Is the recommendation concrete?
      *   *Fix:* Yes, "Pause vote, launch survey, vote on [Date]."

  7.  **Final Polish:** Check against constraints (short memo, concrete action, timeline, engage argument honestly). *Self-correction: Ensure I mention the specific facts about members living close/shopping same hours as a risk for common bias.*

  8.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Process for Delivery Truck Loan & Board Composition

  **Purpose**
  At next Tuesday's meeting, we need to finalize our process for the $60k delivery truck loan vote. One proposal on the table is to expand the Board from five to fifteen directors before voting, based on the Condorcet Jury Theorem (CJT). This memo evaluates that proposal and recommends an alternative path that better manages our financial risk.

  **Engaging the Condorcet Argument**
  The argument for expansion is intellectually serious. The CJT suggests that if voters are competent (more than 50% likely to be right) and independent, adding more voters increases the probability of a correct majority decision. Our recent 5-0 votes are cited as evidence of our competence.

  However, the theorem relies on two strict conditions that may not apply here:
  1.  **Independence:** CJT assumes voters do not influence each other and do not share the same biases. As neighbors who shop the same hours and discuss issues together, we are prone to "common mode" errors. Our 5-0 unanimity may reflect shared blind spots rather than independent verification.
  2.  **Competence:** The theorem only works if we are better than random chance at predicting the outcome. Currently, we are making the $60k loan decision based on guesses regarding delivery demand, not data. If the current board is systematically over-optimistic, adding ten more directors with similar profiles will not correct the error; it will only amplify it.

  **The Core Risk**
  The risk to the co-op is not the number of people voting; it is the lack of information. A $60k loan is a significant liability. If delivery demand does not grow as assumed, the loan becomes a burden on the store's liquidity. Expanding the board takes months (recruitment, onboarding) and delays the decision without solving the information gap.

  **Recommendation**
  I recommend we **maintain the current board size** for this decision but **pause the vote** to gather member data. We need to validate the assumption that demand exists before committing to debt.

  **Proposed Timeline**
  *   **Oct 29 (Next Meeting):** Vote to postpone the truck loan decision. Approve a brief, one-page digital survey for the 300 members regarding delivery habits and willingness to pay.
  *   **Nov 1 – Nov 14:** Survey open. Marketing committee to promote via email and at the checkout.
  *   **Nov 17:** Staff/Board review survey data and create a revised financial projection.
  *   **Nov 22:** Special Board Meeting. Vote on the loan based on data rather than estimation.

  **Conclusion**
  Expanding the board is a structural change that should be considered on its own merits, not as a tactical maneuver for a single vote. By focusing on data collection now, we satisfy the spirit of the CJT—increasing the likelihood of a "correct" decision—by improving the quality of our input rather than just the quantity of our voters.

  Please review this proposal so we can discuss it efficiently on Tuesday.
