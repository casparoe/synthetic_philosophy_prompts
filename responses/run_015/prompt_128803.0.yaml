answer: |-
  You have definitely not reinvented the wheel, but you have identified a specific, high-friction spoke on that wheel that often gets glossed over. You are describing a tension between **fittingness** (is this attitude merited by the object?) and **functional utility** (is holding this attitude useful for the system?).

  While there isn't one single canonical term like "The Smith Problem," this pattern is discussed across meta-ethics, social epistemology, and political philosophy.

  Here is the carving you are looking for: where this fits in the literature, how it relates to the Wrong Kind of Reasons (WKR) problem, and how to draw the boundaries between this, standard collective action, and simple pragmatism.

  ### 1. The Technical Home: State-Given vs. Object-Given Reasons
  You are correct that this is a variant of the **Wrong Kind of Reasons (WKR)** problem, but your intuition that it feels different from Pascal's Wager is also correct. In the technical literature (e.g., T.M. Scanlon, Rabinowicz & Rønnow-Rasmussen), this is the distinction between:

  *   **Object-Given Reasons:** Reasons that bear on the object of the attitude. (e.g., "Trust the court *because it is impartial*.") These determine **fittingness**.
  *   **State-Given Reasons:** Reasons that bear on the *state of having the attitude*. (e.g., "Trust the court *because having trust stabilizes society*.")

  **Why your case feels distinct from classic WKR:**
  Classic WKR examples are usually **prudential** (believe in God to avoid hell) or **bribes** (I'll pay you to believe the earth is flat). These feel "external" to morality.
  The cases you are describing are **moral/consequentialist**. They argue that the *state of having the attitude* is itself a moral good, or a prerequisite for other moral goods.

  **The Label:** A precise term for this is **Consequentialism about Attitudes** (or *Epistemic Consequentialism* when applied to belief). It argues that the normative status of an attitude is determined by the value of its consequences, not its fit with the object.

  ### 2. The Specific Phenomenon: Systemic vs. Local Normativity
  The specific move you are noticing is the application of **Systemic Normativity** to a **Local Context**.

  *   **Local Normativity:** "Is *this* court trustworthy?" "Did *this* parent deserve forgiveness?"
  *   **Systemic Normativity:** "Is the *institution* of courts viable?" "Is the *practice* of filial gratitude sustainable?"

  The argument you are describing attempts to **bootstrap local obligations from systemic necessities.**

  In political philosophy, this is often discussed under **Civic Epistemology** or **Legitimacy**. For example, political liberals (like Rawls or public reason liberals) sometimes argue that citizens have a *duty of civility* or a *duty to trust* institutions to maintain stability, even when specific instances seem unwarranted.

  In moral psychology, this is close to **Rule-Consequentialism applied to Emotions**. Just as a rule-consequentialist says "Follow the rule 'don't lie' even if lying helps in this case," this argument says "Hold the attitude 'trust' even if this object is untrustworthy, because the general practice of trust is vital."

  ### 3. Drawing the Boundaries (The Carving)
  You asked specifically about where the edges are. Here is how to distinguish this phenomenon from its neighbors.

  #### Boundary A: This vs. Classic Wrong Kind of Reasons
  *   **The Test:** Is the reason **agent-relative** (self-interest) or **agent-neutral** (collective good)?
  *   **Classic WKR:** "Believe X because it makes *you* happy/safe/rich." (Prudential)
  *   **Your Phenomenon:** "Believe X because if *no one* believed X, society would fail." (Moral/Collective)
  *   **The Edge:** If the argument shifts from "society collapses" to "you will be ostracized," it has crossed back into classic prudential WKR.

  #### Boundary B: This vs. Ordinary Collective Action
  *   **The Test:** Is the obligation to **Act** or to **Feel/Think**?
  *   **Collective Action:** "You should *vote* even if your vote doesn't matter, because if everyone thought that, democracy fails." This is standard. We accept obligations to *act* against immediate self-interest for collective goods.
  *   **Your Phenomenon:** "You should *trust* even if the evidence doesn't warrant it..."
  *   **The Edge:** This hits the problem of **Doxastic Voluntarism** (can we choose beliefs?) and **Emotional Control**. It is generally accepted that we can be obligated to *act* as if we trust (compliance). It is highly controversial whether we can be obligated to *actually hold the attitude* (internal trust).
      *   *If the demand is compliance:* It's standard collective action.
      *   *If the demand is internal attitude:* It's the phenomenon you identified.

  #### Boundary C: This vs. Presumptive Trust (Hardin/Institutional Theory)
  *   **The Test:** Is the trust based on **encapsulated interest** or **blind faith**?
  *   **Standard Institutional Trust:** "I trust the court because its structure incentivizes judges to be fair." (Russell Hardin's "encapsulated interest"). This is *object-given*. The object (the court structure) warrants the trust.
  *   **Your Phenomenon:** "I trust the court *even though* it is currently corrupt, because without trust it can't reform."
  *   **The Edge:** When the argument admits the object is currently unworthy but demands the attitude anyway to *make* it worthy in the future, you are in your identified territory. This is sometimes called **Performative Trust** (trusting to make the object trustworthy).

  ### 4. Why this is philosophically dangerous (The "Edge" Cases)
  The reason this pattern feels slippery is that it sits on the edge of **alienation** and **ideology**.

  1.  **The Alienation Problem:** If I am told to feel gratitude toward an abusive parent for the sake of "the family," I am alienated from my own moral perceptions. I am treating my own emotions as tools for social engineering rather than responses to reality.
  2.  **The Ideology Problem:** This is the Marxist critique of religion or liberal democracy. "Believe the system is just so that the system continues to function." If the attitude is decoupled from the object's fitness, it becomes a **Noble Lie**.

  **The Breaking Point:**
  The boundary where this reasoning becomes illegitimate is usually **Transparency**.
  *   **Legitimate:** "We should publicly uphold the norm of trusting courts to maintain stability." (Focus on public norm)
  *   **Illegitimate:** "You should internally believe the courts are trustworthy when you know they are not." (Focus on private psychology)

  ### 5. Summary of Terms for Your Toolkit
  If you want to search for this or describe it precisely, these are the terms that map to your description:

  1.  **State-Given Reasons for Attitude:** The meta-ethical category.
  2.  **Epistemic Consequentialism:** Specifically for the belief/climate claim cases.
  3.  **Functional Justification of Norms:** Specifically for the trust/forgiveness cases.
  4.  **The Generalization Argument:** The logical form ("What if everyone did this?").
  5.  **Presumptive vs. Earned Trust:** The specific debate in political science.

  **Verdict:** You are describing **Consequentialist Justification of Fittingness**. It is a recognized move, often used in **Non-Ideal Theory** (how we should act in a flawed world), but it is widely criticized in **Fitting Attitude Analysis** because it severs the link between the world and our minds. It stops being valid collective reasoning when it demands **internal psychological compliance** rather than **external behavioral cooperation**.
