      *   *Claim 4: The "Suppression" Claim.* "People knew deep down but lied."
          *   *Compatibility:* Incompatible with Williams (it's not lying, it's a different worldview). Incompatible with Appiah (they genuinely believed in honor).
          *   *Causal Mechanism:* Requires bad faith, not structural change.

  4.  **Integrating Williams and Appiah:**
      *   **Bernard Williams:** Focus on *thick ethical concepts*. You can't just apply "wrong" across time without understanding the social context. Moral change isn't discovery; it's conceptual evolution.
      *   **Kwame Appiah (*The Honor Code*):** Focus on *social scripts*. People didn't stop dueling because they thought it was "murder"; they stopped because it became "shameful" or "uncool." Moral arguments existed *before* the practice died; they only worked when the honor structure shifted.

  5.  **Addressing the "Suppressed Knowledge" Question:**
      *   Is it a real position? Yes, it resembles Socratic intellectualism or certain religious views (conscience), but in social science/philosophy of history, it's often criticized as anachronistic. It's the "Bad Faith" argument.

