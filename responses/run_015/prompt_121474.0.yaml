answer: |-
  This is a classic clash between **Moral Realism** (your roommate's intuition) and **Social/Conceptual Explanation** (Williams/Appiah). Your roommate is conflating three different things: *ontology* (was it wrong?), *epistemology* (could they know it was wrong?), and *causation* (why did it stop?).

  His slogan ("the wrongness was always there, people just had to open their eyes") sounds like one claim, but it actually smuggles in four distinct philosophical commitments. Here is the menu you can bring to the conversation, ranked from trivial to radical.

  ### Level 1: The Metaphysical Claim
  **"Slavery/Dueling was objectively wrong in 1750, even if everyone thought it was right."**

  *   **What it commits him to:** Moral Realism. Moral facts exist independently of human belief.
  *   **Compatibility with Williams:** **Compatible.** Williams can agree that we can look back and say "they were wrong." He doesn't deny truth, he denies that moral progress works like *scientific* progress.
  *   **Compatibility with Appiah:** **Compatible.** Appiah explicitly argues that the slaveholders *were* wrong. He doesn't think honor makes things right; he thinks honor codes determine which moral arguments gain traction.
  *   **Does it require arguments did the work?** **No.** You can believe something was wrong back then without believing that *realizing* that wrongness is what caused the practice to end.
  *   **The Trap:** Your roommate uses this trivial truth to sneak in the causal claim. You can agree with Level 1 without agreeing that "waking up" caused the change.

  ### Level 2: The Epistemic Claim
  **"The intellectual tools to recognize the wrongness were fully available to people at the time."**

  *   **What it commits him to:** Moral arguments against slavery/dueling were logically complete and accessible in 1700. There was no conceptual barrier, only a failure of attention.
  *   **Compatibility with Williams:** **Incompatible.** Williams argues that ethical concepts are "thick." The concept of "human rights" or "personal autonomy" required a social world to make sense of it. You can't just "see" the wrongness if your conceptual vocabulary doesn't have a slot for it. The ground has to shift before the evidence becomes visible.
  *   **Compatibility with Appiah:** **Mostly Incompatible.** Appiah shows that arguments against slavery existed for *decades* before slavery ended. The "tools" were there, but they bounced off. They only worked when the social script changed.
  *   **Does it require arguments did the work?** **Yes.** If the tools were there, the only reason they weren't used was irrationality. Therefore, becoming rational (via argument) must be the solution.

  ### Level 3: The Psychological Claim (The "Suppressed Knowledge" Move)
  **"People deep down knew it was wrong but chose to ignore it (Bad Faith)."**

  *   **What it commits him to:** This is the "moral knowledge being available but suppressed" idea. It claims the barrier was volitional (stubbornness, greed, sin), not structural or conceptual.
  *   **Is this a real philosophical position?** Yes, it resembles the Socratic view that "no one does evil willingly" (inverted here to "everyone knows evil but does it anyway") or certain religious views of conscience. However, in social philosophy, it is often criticized as **anachronistic psychology.** It assumes modern people's internal monologue is the same as historical actors'.
  *   **Compatibility with Williams:** **Incompatible.** Williams would say they didn't "know deep down." Their "deep down" was constituted by their social world. A 17th-century gentleman didn't suppress the thought "dueling is murder"; the thought "dueling is murder" literally didn't compute as a relevant description of the action.
  *   **Compatibility with Appiah:** **Incompatible.** Appiah's whole point is that people are not hypocrites; they are *script-followers*. Slaveholders didn't think they were evil; they thought they were upholding order. They weren't suppressing knowledge; they were operating on a different honor script.
  *   **Does it require arguments did the work?** **Yes.** If the barrier is stubbornness, then moral persuasion (shaming, preaching) is the only way to break it.

  ### Level 4: The Causal Claim (The Radical View)
  **"The practice ended *because* enough people finally reasoned correctly about the pre-existing wrongness."**

  *   **What it commits him to:** This is the strongest version of his slogan. It claims moral argument is the *primary engine* of history.
  *   **Compatibility with Williams:** **Incompatible.** Williams argues moral change is more like a "gestalt switch" or a geological shift. We don't reason our way into new values; we find ourselves living in a world where the old values no longer make sense.
  *   **Compatibility with Appiah:** **Incompatible.** Appiah's data shows that moral arguments against dueling and slavery were constant for generations. The practices didn't end when the arguments peaked; they ended when the *social cost* of the practice shifted (e.g., dueling became seen as "vulgar" rather than "noble"). Arguments were the *ammunition*, but honor was the *gun*.
  *   **Does it require arguments did the work?** **Yes, exclusively.** This view dismisses economic interests, legal changes, or honor shifts as secondary to the "waking up."

  ---

  ### How to Use This Menu

  **1. Isolate the Trivial Claim (Level 1)**
  Tell him: *"I agree that slavery was wrong in 1700. That's Level 1. But agreeing it was wrong doesn't explain why it took 150 years to stop. If the wrongness was 'always there,' why didn't it stop in 1701?"*

  **2. Challenge the Epistemic Claim (Level 2 & 3)**
  Tell him: *"Your slogan assumes people in 1750 had the same moral operating system we do, but were just ignoring the data. Williams and Appiah suggest they literally didn't have the software to process that data. It's not that they 'closed their eyes'; it's that the concept of 'human rights' didn't weigh the same in their social economy."*

  **3. The "Suppressed Knowledge" Check**
  Regarding his idea that they "knew better":
  *"Claiming they 'suppressed' the knowledge assumes they were modern people pretending to be old people. Appiah shows they genuinely believed honor required these actions. If you say they 'knew better,' you're ignoring their actual lived experience to make a point about moral truth."*

  **4. The Causal Clincher (Level 4)**
  *"If moral argument alone did the work, the practice should have ended when the arguments were strongest. But with dueling, the arguments were strong for 50 years before it stopped. It stopped when it became uncool (honor), not when it became 'illogical' (reason). Your view explains why it was wrong, but Appiah explains why it actually stopped."*

  ### Summary for your Roommate
  His slogan commits him to **Level 4 (The Causal Claim)**. He thinks he is just making a **Level 1 (Metaphysical)** claim, but he uses it to dismiss structural explanations.
  *   **Williams** says: You can't reason your way out of a conceptual framework you haven't left yet.
  *   **Appiah** says: You can't argue your way out of an honor code; you have to change what counts as honorable.
  *   **Roommate** says: Reason pierces all barriers instantly if people are honest.

  The "weird middle claim" about suppressed knowledge is **Level 3**. It is a real position (Bad Faith), but it is historically brittle. It turns historical actors into villains in a morality play rather than participants in a different social structure.
