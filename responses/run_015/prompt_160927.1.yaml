  You're a professional philosopher who works on free will and moral responsibility. Please think carefully here and do a real audit — start by brainstorming which of my commitments are actually load-bearing before you write anything, and dont just reassure me that the package is fine as it stands.

  My friend and I spent like two hours arguing about this last night and I lost track of whether my view is even one view. Here's roughly where I've landed:

  (1) The only kind of free will worth wanting is a mundane package: weighing reasons, planning, inhibiting impulses, revising myself over time, being legible to other people as someone they can reason and negotiate with. Neither determinism nor a complete neural story about how my decisions get made threatens any of that, as far as I care.

  (2) I'm convinced by the cases where a hidden intervener is standing by, ready to make you do the thing if you show signs of not doing it: responsibility doesn't require that you could have done otherwise with the past and the laws held fixed. What matters is the actual route to the action running through your own reasons-responsive machinery.

  (3) But history can matter too. Covert redesign of someone's brain, or being raised from birth inside a closed ideological system, undermines responsibility even if at the moment she acts she's perfectly reasons-responsive and would have acted differently had she had a good reason to.

  (4) I still want to say in ordinary life that a badly addicted person, or someone acting under a serious credible threat, couldn't have done otherwise, and I want that to do genuine excusing work, not just be a dramatic way of saying she was bad at tracking reasons.

  (5) I'm not a retributivist — blame and punishment get justified forward-looking, by protection, deterrence, and moral address. But I also want to keep saying that some people deserve blame and the person in (3) doesn't, and I couldnt explain to my friend what desert is doing in a view that has no room for desert.

  (6) I think the history problem can be cleaned up: if a redesigned person later reflects on the installed desires, revises them, and over years makes them her own, she becomes responsible for what she does with them. So the disqualifier isn't that someone tampered, it's something about where her current will came from. I've been calling this provenance sensitivity.

  Go through these and tell me which pairs are really in tension and which only look like it. Rank the real ones by severity, and for each say what would have to give and what it would cost me. One case I want specifically addressed: someone raised from birth in a closed compound who at thirty has reflected on her inherited values, kept most of them, and acts on them. By my own (6), does she stop counting as a victim in the sense of (3)? If my set can't give a stable answer there, tell me definately which single revision would fix the most.
