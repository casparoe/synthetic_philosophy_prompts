  **REPUBLIC OF NOVARIA**
  **BUREAU OF DEMOGRAPHIC STEWARDSHIP**
  **CONSULTATION PAPER 88-C: THE PROSPECTIVE PERSONS REPRESENTATION BILL**

  **1.0 Executive Summary**
  Novaria's total fertility rate currently stands at 1.5, below the replacement threshold of 2.1. This deficit represents not only a fiscal shortfall but a deprivation of potential experience. The Prospective Persons Representation Bill (PPRB) proposes to formalize the status of the "Unborn Deficit"—those citizens who would exist had replacement rates been met. Under the PPRB, Parliamentary seats will be allocated proportionally to this deficit. An Office of the Prospective Persons' Advocate (OPPA) will be established to represent the interests of these shadow constituents in all legislative matters regarding family formation, housing, and resource allocation.

  **2.0 Allocation of Shadow Constituencies**
  Seats in the Lower House will be adjusted annually based on the fertility gap. For every 10,000 persons below the replacement projection, one Shadow Seat is created. These seats are held in trust by the OPPA. As the deficit widens, the voting bloc for pronatalist measures expands accordingly, ensuring that the urgency of existence is proportionally represented. This mechanism guarantees that the political weight of the non-existent grows in line with their demographic absence.

  **3.0 Cost-Benefit Analysis of Intervention Strategies**
  The Bureau evaluated two primary intervention pathways. Policy Alpha focuses on high-cost support for fewer families to maximize individual well-being. Policy Beta focuses on broad incentives to maximize total births, accepting a lower average resource allocation per child.

  | Metric | Policy Alpha | Policy Beta |
  | :--- | :--- | :--- |
  | **Projected Births (10yr)** | 15,000 | 65,000 |
  | **Avg. Wellbeing Index** | 8.5 / 10 | 3.2 / 10 |
  | **Aggregate Lifetime Utility** | 127,500 | **208,000** |
  | **Future Tax Base (NPV)** | $4.2 Billion | $11.5 Billion |
  | **Infrastructure Cost (Discounted 4%)** | $1.1 Billion | $3.8 Billion |
  | **Existential Benefit (Undiscounted)** | High | **Very High** |
  | **Recommendation** | Rejected | **Approved** |

  *Note: While average wellbeing is lower under Policy Beta, the total sum of happy moments across the population is maximized. Quality thresholds are kept under review.*

  **4.0 Frequently Asked Questions**

  **Q: Why are immigration targets not included in the replacement calculation?**
  A: The PPRB focuses on organic continuity. Existing citizens hold a unique stake in the specific cultural and genetic lineage of Novaria. Prospective persons are defined by their potential connection to current stakeholders, which external migration does not satisfy.

  **Q: How can we represent people who do not exist?**
  A: Non-existence is treated as a latent status. Just as we plan infrastructure for future decades, we must legislate for future souls. To deny them representation is to prejudice the outcome before the stakeholder arrives.

  **Q: Who bears the responsibility for gestation?**
  A: The bill utilizes gender-neutral language regarding "parents." However, biological grants are directed toward the primary caregiver responsible for gestational labor and post-natal recovery. This ensures neutrality while acknowledging physiological realities.

  **Q: Why are existential benefits not discounted against future risks?**
  A: Existence is a prerequisite for all other benefits. Therefore, the value of being born is applied at face value (100%), whereas infrastructure costs are discounted at standard Treasury rates (4%). It is logically inconsistent to discount the possibility of experience while discounting the cost of the bench they sit on.

  **5.0 Public Response Form**
  *Please return this form to the Bureau within 30 days. Your feedback is essential to securing the future.*

  **1. Do you acknowledge that non-existence constitutes a loss of potential utility?**
  [ ] Yes
  [ ] No (Please explain why you oppose potential utility)
  [ ] I do not exist yet (Check here to register as a Shadow Constituent)

  **2. Which priority should guide the OPPA?**
  [ ] Maximizing the total number of Novarians regardless of average resource share.
  [ ] Maximizing average resources (Note: This option may result in fewer seats for Shadow Constituents).
  [ ] I defer to the Bureau's calculation of Aggregate Lifetime Utility.

  **3. How should the Shadow Seats be voted?**
  [ ] By the OPPA, in the best interest of bringing constituents into existence.
  [ ] By the OPPA, in the best interest of ensuring constituents are happy *after* existence (Note: This may conflict with Section 2.0).
  [ ] I trust the Bureau to vote on my behalf.

  **4. Do you consent to the use of future tax revenue to fund your own potential birth?**
  [ ] Yes
  [ ] No (If checked, please indicate how you plan to fund your existence alternatively)
  [ ] N/A (I am already born)

