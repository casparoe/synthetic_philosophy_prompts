      *   **Task:** Create a reusable decision procedure based on the Buddhist principle of *anattā* (no-self) for cases where prior preferences conflict with current preferences due to cognitive alteration (dementia, TBI, dissociation).
      *   **Constraints:**
          *   Must be actionable (45-minute review, signed off by physician/legal).
          *   Must *not* smuggle in Western essentialist/narrative-identity models.
          *   Must yield actionable guidance (not open-ended philosophy).
          *   Must distinguish three analytical axes: (1) Present vs. Anticipated Suffering, (2) Psychological Continuity vs. Relational Identity, (3) Authority of Past vs. Present Mental State.
          *   Must include step-by-step structure (Question, Factual vs. Normative, Termination/Hand-off, Specific Misfire).
          *   Must apply to three specific cases (Alzheimer's, Frontal-lobe TBI, DID).
          *   Must include at least one counter-intuitive recommendation (e.g., ignoring prior directive).
          *   Must state limitations (what the procedure *cannot* settle).
          *   Must distinguish settled vs. contested Buddhist philosophy regarding *anattā*.
      *   **Tone:** Professional, clinical, precise, philosophically rigorous but accessible to non-Buddhists.

  2.  **Deconstruct *Anattā* for Clinical Ethics:**

      *   *Settled:* Rejection of *ātman* (permanent, unchanging soul/essence). Rejection of metaphysical continuity.
      *   *Contested:* How conventional selfhood (*pudgala*) functions. Is it reductionist (momentary dharmas)? Narrative (storytelling)? Relational (dependent origination)?
      *   *Operationalization:* If there is no permanent self, the "prior self" and "current self" are causally connected but distinct clusters of aggregates (*skandhas*). Authority isn't inherent in the past; it's instrumental. Suffering (*dukkha*) is the primary metric, not autonomy of a metaphysical entity.
      *   *Challenge:* Western law/ethics relies on autonomy (past self binds future self). *Anattā* suggests the past self has no metaphysical claim over the present cluster of aggregates *unless* honoring it reduces suffering.

  3.  **Drafting the Decision Procedure (The "Anattā Clinical Protocol"):**

      *   *Goal:* Move from "Who is the real patient?" to "Where is the suffering, and how do we alleviate it?"
      *   *Axis 1 (Suffering):* Focus on *dukkha* in the present moment vs. hypothetical future.
      *   *Axis 2 (Identity):* Focus on causal continuity vs. social labeling.
      *   *Axis 3 (Authority):* Focus on instrumental value of past wishes vs. present experience.
      *   *Structure:* Needs to be a flowchart-like text.
      *   *Step 1: Phenomenological Assessment (Present Suffering).*
      *   *Step 2: Causal Continuity Assessment (Psychological/Relational).*
      *   *Step 3: Authority Weighting (Past vs. Present).*
      *   *Step 4: Synthesis/Recommendation.*

  4.  **Developing the Case Applications:**

      *   *Case 1 (Alzheimer's):* Prior: No feeding. Current: Wants food, happy.
          *   *Standard:* Honor directive (autonomy).
          *   *Anattā:* The "author" of the directive is causally disconnected from the present being. Present being experiences hunger/satisfaction. Honoring directive causes present suffering.
          *   *Recommendation:* Feed the patient (Counter-intuitive).
      *   *Case 2 (TBI):* Prior: Unknown/Implicit. Family: "Not who he is."
          *   *Standard:* Substituted judgment (what would he want?).
          *   *Anattā:* "Who he really is" is a fiction. Focus on relational continuity (family recognition) and present suffering. If treatment causes suffering without relational benefit, stop. If family suffering is high, weigh that.
          *   *Recommendation:* Limit treatment if it causes physical *dukkha* without relational gain, despite family's metaphysical claim.
      *   *Case 3 (DID):* Alter A: No treatment. Alter B: Wants treatment.
          *   *Standard:* Legal competence of the "host"?
          *   *Anattā:* All alters are empty of self. No "host" is more real. Look at the suffering of the *current* active cluster.
          *   *Recommendation:* Honor current request if it alleviates present *dukkha*, provided no irreversible harm to the aggregate system.

  5.  **Addressing the Philosophical Nuance (Settled vs. Contested):**

      *   *Settled:* No *ātman*. Impermanence (*anicca*). Suffering (*dukkha*).
      *   *Contested:* Reductionism (Abhidharma) vs. Personalism (Pudgalavāda - though mostly extinct, echoes in modern interpretation) vs. Narrative/Relational (Engaged Buddhism).
      *   *Constraint:* Do not present one contested view as consensus. Acknowledge the tension between "no self" and "conventional self."

  6.  **Refining the Procedure for Clinical Use:**

