answer: |-
  This is a fantastic confusion to be having. You have effectively stumbled upon one of the deepest tensions in Hofstadter's work (and in philosophy of language generally): the boundary between **syntax** (the symbols) and **semantics** (the meaning), and whether meaning can ever truly be "inside" the message or if it is always a property of the **relationship** between the message and the receiver (the frame).

  You asked specifically to identify the false presupposition. You are very close with your hypothesis: **"Is there a hidden assumption that 'inner message' means the same thing across different formal frames?"**

  The answer is **yes**, but it needs a slight adjustment. The false presupposition is that the **Inner Message is a stable, context-independent object** (like a nugget of gold) that the Frame merely "wraps" or "delivers."

  Here is how to untangle the decoding role from the logical role, using Hofstadter's own logic from *Gödel, Escher, Bach* (GEB).

  ### 1. The Translation Illusion (Natural Language)
  Your intuition about translation is the source of the red herring.
  *   **Your thought:** "I can translate 'Snow is white' to French. The grammar (Frame) changes, but the meaning (Inner Message) stays the same. Therefore, the Frame is just mechanical."
  *   **The Hofstadterian Correction:** In natural language translation, you are assuming a **shared external meta-frame**: human reality. Both English and French are mapping symbols to the *same external world*.
  *   **The Trap:** You aren't actually changing the *semantic frame*; you are only changing the *syntactic vehicle*. Both languages share the same underlying logic of truth conditions (correspondence to physical reality).
  *   **Why it breaks in Formal Systems:** In a formal system (like Peano Arithmetic), there is **no external world**. The system *creates* its own reality. The axioms don't just tell you how to read the symbols; they **constitute** what the symbols *are*.

  ### 2. The Formal System Trap (Gödel/PA)
  This is where your reasoning hits the wall. You wrote:
  > *"if the frame has no semantic weight, then when we change the formal system... we're not changing the meaning of the arithmetic statements, just how we access them."*

  This is the false presupposition. In formal logic, the Frame (Axioms + Rules of Inference) is **constitutive**, not just **decoding**.

  *   **Analogy:** Think of a chess piece.
      *   **The Symbol:** A carved wooden horse.
      *   **The Frame:** The rules of Chess.
      *   **The Inner Message:** "This piece moves in an L-shape."
      *   If you take that wooden horse and play Checkers with it, the "Inner Message" of the piece changes completely, even though the wood (syntax) is identical.
  *   **Application to PA:** In Peano Arithmetic, the symbol `+` means "addition over natural numbers" *because* the axioms define it that way. If you switch to a system where the axioms allow for modular arithmetic (clock math), the string `2 + 2 = 4` might become false (e.g., in mod 3, `2 + 2 = 1`).
  *   **The Conclusion:** Did the "Inner Message" change? **Yes.** Even though the ink on the page looks the same, the *proposition* expressed is different. In System A, it means "Successor(Successor(0)) + Successor(Successor(0)) = Successor(Successor(Successor(Successor(0))))." In System B, the definition of `+` has shifted.
  *   **Hofstadter's Point:** Meaning is an **isomorphism** between the formal string and the structure it represents. If you change the Frame (the rules of the structure), you break the isomorphism. You aren't accessing the "same message" differently; you are generating a *different message* from the same symbols.

  ### 3. The Liar Paradox and the "Collapse"
  Your study group's argument about the Liar Paradox ("This statement is false") is actually the key to unlocking this.

  *   **Normal Message:** Frame = "Read this as a claim about the world." Inner = "Snow is white." (Distinct layers).
  *   **Liar Message:** Frame = "Read this as a claim about truth." Inner = "This claim is false."
  *   **The Collapse:** The Inner Message reaches out and grabs the Frame. It tries to use the Frame's truth-assignment rules on the Frame itself.
  *   **Why your friend is half-right:** In self-referential loops, the distinction between Frame and Message *does* blur. The message *becomes* a rule for decoding itself.
  *   **Why they are wrong:** It's not that they "collapse together" into nothing; it's that the system **crashes**. It reveals that the Frame was never just a passive decoder. The Frame is an active processor. When the Message feeds back into the Processor, you get a loop (like a microphone too close to a speaker).

  ### 4. Resolving Your Confusion: Decoding vs. Constituting
  You feel like you are conflating the frame's **decoding role** with its **logical role**. Here is the distinction:

  1.  **Decoding Frame (Syntactic):** "Read left-to-right," "Map symbol A to sound B."
      *   *Can this change without changing meaning?* Yes (Translation), **IF** there is a shared external reality anchoring the meaning.
  2.  **Constitutive Frame (Semantic/Logical):** "Truth is defined by derivability," "Negation flips truth values."
      *   *Can this change without changing meaning?* **No.** Because in formal systems, meaning *is* the role the symbols play within the rules.

  **The False Presupposition Identified:**
  You are assuming that the **Inner Message** is the *string of symbols*.
  Hofstadter argues that the **Inner Message** is the *meaning triggered in the receiver*.

  If the Receiver (the Frame/System) changes, the Triggering changes. Therefore, the Inner Message changes.
  *   **In Translation:** The Receiver (Human Brain + Reality) stays the same, so the Meaning stays the same.
  *   **In Formal Systems:** The Receiver (The Axiomatic System) changes, so the Meaning *must* change.

  ### Summary for your Study Group
  You can tell them this:
  "The mistake is thinking the 'Inner Message' is the ink on the page. Hofstadter teaches us that meaning isn't *in* the signal; it's in the **resonance** between the signal and the receiver.
  *   In **translation**, we keep the receiver (human cognition/reality) constant, so the meaning survives the code change.
  *   In **Gödel/Formal Systems**, the 'Frame' *is* the receiver. If you change the axioms, you change the receiver. If you change the receiver, the resonance changes. The string `1+1=2` isn't the 'Inner Message'; the *truth* of `1+1=2` is the message. If the Frame makes that false, it's a different message entirely."

  You were right to doubt that the Frame has "zero semantic content." In formal systems, the Frame **is** the semantics. The Inner Message is just the trigger.
