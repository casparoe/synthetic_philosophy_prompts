      *   *Tetralemma (Catuṣkoṭi):*
          1.  It is (Exists/True).
          2.  It is not (Does not exist/False).
          3.  It is both (Exists and does not exist).
          4.  It is neither (Neither exists nor does not exist).
      *   *Madhyamaka/Emptiness:* All four positions are rejected *ultimately* because they presuppose *svabhāva* (inherent existence). Things exist dependently (pratītyasamutpāda), not inherently.
      *   *Application:* The app, the route, the destination, and the user lack inherent existence. They are empty.

