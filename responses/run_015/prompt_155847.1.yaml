  Two friends, Alex and Sam, are stuck in gridlock. The navigation app on the dashboard flashes "Arrive in 2 minutes" for the twentieth consecutive minute.

  **Sam:** "Be honest. Is this app trustworthy or not?"

  **Alex:** "Let's apply the *catuṣkoṭi*. First: Is the ETA inherently trustworthy?"

  **Sam:** "No, it depends on satellite data and other drivers."

  **Alex:** "Correct. No *svabhāva* of trustworthiness. Position one rejected. Second: Is it inherently untrustworthy?"

  **Sam:** "No, it got us to the highway."

  **Alex:** "Right. To say it is inherently untrustworthy is to grant it a negative intrinsic nature. Position two rejected. Third: Is it both inherently trustworthy and untrustworthy?"

  **Sam:** "No, contradictory natures can't inhere in the same object."

  **Alex:** "Precisely. Position three rejected. Fourth: Is it neither trustworthy nor untrustworthy?"

  **Sam:** "No, that just reifies a third inherent category of 'neither-ness'."

  **Alex:** "Exactly. All four positions regarding the ETA's inherent existence are untenable."

  **Sam:** [Gestures at the unmoving traffic] "So... do we turn off the engine?"

  **Alex:** "No. We sit. Because the simultaneous rejection of all four positions is exactly what allows the traffic to move dependently. If the jam were inherently real, it would never clear. If it were inherently unreal, we wouldn't be late."

  **Sam:** "So what are we doing?"

  **Alex:** "We are conventionally stuck, ultimately empty, and the app is currently negating the four extremes of the route in real-time."

  **Sam:** "It says 'Recalculating'."

  **Alex:** "See? It's not lost. It's realizing *śūnyatā*. Turn on the blinker."

  **Sam:** "Why?"

  **Alex:** "Because the turn is empty of inherent leftness, but the insurance policy is conventionally specific."
