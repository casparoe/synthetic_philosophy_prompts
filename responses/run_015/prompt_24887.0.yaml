answer: |-
  This is a sophisticated mapping exercise. You are asking for a conceptual bridge between late-Enlightenment utilitarian jurisprudence and contemporary epidemiological ethics. The challenge is to avoid anachronism—Bentham was not a public health scholar—while demonstrating structural isomorphism where it exists.

  Below is the systematic translation of Bentham's arguments from his unpublished sexual ethics manuscripts (principally *Offences Against One's Self* and fragments from *Paederasty* and the *Principles of Morals and Legislation*) into your public health vocabulary, followed by the residue report and verdict.

  ---

  ### Part I: Systematic Translation
  **Source:** Bentham's Unpublished Manuscripts on Sexual Irregularities (c. 1780s–1820s)
  **Target:** Contemporary Public Health Ethics & Harm Reduction Framework

  | Benthamite Construct | Public Health / Harm Reduction Translation | Operational Logic |
  | :--- | :--- | :--- |
  | **The Absence of "Primary Mischief"**<br>Bentham argues consensual sexual acts produce no direct physical pain or loss of property to the participants or third parties. | **Absence of Primary Harm**<br>The behavior itself, absent external interference, does not generate significant morbidity, mortality, or direct injury warranting intervention. | **Threshold Condition for Intervention:** Just as Bentham argues criminalization fails the "harm principle" threshold, PH policy requires evidence of direct pathogenicity or injury before restricting autonomy. |
  | **The "Secondary Mischief" of Law**<br>Bentham contends the pain arises not from the act, but from the punishment (execution, imprisonment) and the anxiety of detection. | **Secondary Harm & Iatrogenic Policy Effects**<br>Negative health outcomes (STI transmission, mental health decline) are generated by the policy response (criminalization) rather than the behavior. The law acts as a pathogen. | **Causal Pathway:** Criminalization $\rightarrow$ Fear of Arrest $\rightarrow$ Care-Seeking Delay $\rightarrow$ Increased Transmission/Severity. The policy is iatrogenic (harmful intervention). |
  | **The "Principle of Antipathy"**<br>Bentham identifies the rationale for prohibition as irrational disgust or prejudice, mislabeled as reason. | **Stigma as a Structural Determinant of Health**<br>Policy is driven by social stigma rather than evidence. This stigma functions structurally to limit access to resources, creating health inequities. | **Bias in Policy Formulation:** "Antipathy" is the 18th-century genealogy of what PH now identifies as structural stigma or implicit bias in guideline development. |
  | **"Offense to Sensibilities"**<br>Bentham acknowledges observers feel pain (disgust) but argues this is outweighed by the actor's pleasure and the severe pain of punishment. | **Community Morale vs. Population Health Impact**<br>Weighing the psychological distress of the majority (moral offense) against the tangible health burdens of the minority (criminalization effects). | **Proportionality Principle:** PH ethics requires that restrictions on liberty be proportional to the health threat. Moral offense alone fails the proportionality test against the burden of secondary harms. |
  | **The Hedonic Calculus**<br>Summing the pleasures of the actors against the pains of the punished and the disgusted to find the net utility. | **Health Impact Assessment (HIA) / Cost-Benefit Analysis**<br>Quantifying the net population health outcome, weighing the benefits of autonomy/reduced stigma against the costs of enforcement and disease burden. | **Decision Rule:** Policy is justified only if it maximizes net health utility. If Criminalization Cost > Decriminalization Cost, the policy is inefficient and unethical. |

  ---

  ### Part II: The Residue Report

  This section identifies where the translation holds, where it strains, and where the frameworks are incommensurable.

  #### 1. Clean Translations (High Fidelity)
  *   **Primary vs. Secondary Harm:** This is the strongest isomorphism. Bentham's distinction between the "mischief of the act" and the "mischief of the punishment" maps almost perfectly onto the harm reduction distinction between *drug/behavior-related harm* and *policy-related harm*. Both frameworks agree that if the intervention causes more damage than the behavior, the intervention is unjustified.
  *   **Antipathy as Stigma:** Bentham's diagnosis that sexual laws rest on "antipathy" translates cleanly into the PH concept of **stigma as a social determinant of health**. Both view the negative sentiment not as a valid moral intuition, but as a causal variable that produces measurable suffering (anxiety, isolation, delayed care).
  *   **Iatrogenesis:** Bentham's claim that the law *creates* the suffering is a precise precursor to the concept of **structural iatrogenesis**. In both views, the state/medical apparatus is the vector of injury, not the biological behavior itself.

  #### 2. Distorted Translations (Requires Stretching)
  *   **Offense to Sensibilities:** Bentham treats "disgust" as a quantifiable pain in the calculus. Public Health ethics generally struggles to incorporate "moral offense" into metrics unless it manifests as measurable mental health pathology.
      *   *The Distortion:* In PH, "offense" is often dismissed as non-medical. Bentham takes it seriously as *pain* but argues it is mathematically inferior to the pain of imprisonment. PH tends to exclude it from the equation entirely; Bentham includes it but outvotes it.
  *   **Consent:** Bentham relies heavily on the absence of "want of consent" to establish the absence of harm. Public Health sometimes overrides consent for paternalistic reasons (e.g., mandatory treatment, quarantine) if population risk is high.
      *   *The Distortion:* Bentham's framework is more libertarian regarding consent than modern PH, which accepts restrictions on consent under the "harm to others" principle (e.g., infectious disease control). Bentham argues consensual sex *cannot* be harm to others; PH leaves open the possibility that vectoring disease is harm to others, even if consensual.

  #### 3. No Expression (Incommensurable)
  *   **Rights Language:** Bentham famously called natural rights "nonsense upon stilts." Your PH framework likely relies on human rights language (sexual rights, bodily autonomy) as a deontological constraint. Bentham has no equivalent; for him, rights are only created by law to maximize utility. There is no "right" to sex in Bentham, only a "utility" in allowing it.
  *   **The Ontology of Pleasure:** Bentham treats pleasure as a singular, homogenous substance. PH treats "health" as a multidimensional state (physical, mental, social well-being, per WHO). There is no direct PH equivalent to "pleasure" as a primary outcome metric, except perhaps in broad Quality of Life measures, which are still distinct from hedonic tone.

  ---

  ### Part III: The Hedonic Calculus vs. Public Health Metrics

  **The Question:** Does the Hedonic Calculus have a genuine counterpart in QALYs/DALYs/Cost-Effectiveness?

  **The Analysis:**
  Superficially, yes. Both are aggregative, consequentialist tools designed to maximize a specific good (Utility vs. Health) across a population. Both require a "calculator" (the legislator vs. the epidemiologist) to remain neutral and sum the values.

  **The Divergence:**
  1.  **Monism vs. Pluralism:** Bentham's calculus is radically monistic. All values (liberty, security, pleasure) must be converted into the single currency of "utils" (pain/pleasure). Public Health metrics (QALYs/DALYs) *appear* monistic but are actually composite proxies. More importantly, PH ethics often refuses to trade off certain values (equity, justice, rights) against efficiency. A cost-effective policy that violates equity is often rejected in PH; in Bentham's framework, if it maximizes net utility, it is justified.
  2.  **The Neutrality of the Calculator:** Bentham assumes a rational legislator can objectively sum these pains and pleasures. PH has moved toward acknowledging that the "calculator" is never neutral. Data collection on STIs, for example, is often biased by the very stigma Bentham identified. PH now incorporates **Community-Based Participatory Research (CBPR)** to correct for this, acknowledging that the "view from nowhere" is impossible. Bentham demands neutrality; PH demands *reflexivity* about the impossibility of pure neutrality.

  ---

  ### Part IV: The Verdict on the Residue

  **Where translation fails, is PH impoverished, or did PH wisely discard Bentham?**

  **Verdict:** Public Health has wisely discarded Bentham's metaphysical commitments, but it remains impoverished regarding his *radicalism about stigma*.

  **1. Where PH is Superior (Wisely Discarded):**
  PH has rightly abandoned the **Hedonic Monism**. Reducing all human experience to a single scale of pleasure/pain obscures the distinct moral weight of *justice* and *rights*. If a policy maximizes health outcomes but disproportionately burdens a marginalized group (violating equity), Bentham might accept it if the net sum is positive. PH ethics (specifically the *Siracusa Principles* or *Guiding Principles on Human Rights*) provides a vocabulary to reject this trade-off. We do not need the Hedonic Calculus to know that criminalizing sodomy is wrong; we can appeal to rights and equity, which are more robust shields against majoritarian tyranny than Bentham's calculus.

  **2. Where PH is Impoverished (The Lost Radicalism):**
  However, PH has lost Bentham's **relentless accounting of secondary pain**.
  *   **The Blind Spot:** Contemporary Public Health often focuses on biomedical metrics (viral load, incidence rates). It frequently undercounts the "pain of the law" (anxiety, stigma, loss of trust) because these are hard to quantify in DALYs.
  *   **Bentham's Advantage:** Bentham forces the "pain of punishment" and the "pain of anxiety" onto the ledger with the same weight as physical injury. He insists that the *fear* generated by the law is a tangible health burden.
  *   **The Lesson:** PH vocabulary sometimes treats stigma as a "barrier to care" (instrumental value) rather than a harm in itself (intrinsic value). Bentham treats the suffering caused by antipathy as a direct negative utility. PH would benefit from re-integrating Bentham's insistence that **state-induced anxiety is a primary health outcome**, not just a mediator.

  **Conclusion:**
  Your colleague is correct that Bentham anticipates the *architecture* of harm reduction. He provides the logical skeleton: *If the intervention causes more suffering than the behavior, cease the intervention.*
  However, do not adopt his *metaphysics*. You do not need the Hedonic Calculus to justify decriminalization. You can rely on the **Proportionality Principle** and **Stigma as a Determinant**.
  *   **Use Bentham** to hammer home the *iatrogenic* nature of punitive policy (the law is the vector).
  *   **Use PH Ethics** to protect against the coldness of the calculus (rights and equity constrain the sum).

  Bentham gives you the weapon to dismantle the justification for criminalization; Public Health gives you the shield to protect the population once the law is removed. Keep the weapon, but trust the shield.
