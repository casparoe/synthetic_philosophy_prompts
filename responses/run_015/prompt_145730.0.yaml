answer: |-
  **Setup and materials**
  Divide the 17 students into three groups of five and one group of two (the pair acts as rotating scorekeepers/observers). Prepare three sets of sealed envelopes per group. **Round 1:** Five index cards per student, each bearing a conditional rule (e.g., "If card is red, pass left"). No student sees another's cards. **Round 2:** Contribution slips and one sealed "Special Role" envelope per group (one contains "Mercenary," others say "Member"). **Round 3:** Ballot slips and a "Task Menu." You need a whiteboard for scores and a stopwatch. Points translate to raffle tickets for a $20 coffee voucher; the top group gets bonus tickets. Ensure envelopes remain sealed until instructed. The observers record quotes regarding frustration or success during play.

  **The rounds**
  **Round 1 (The Blind Chain):** Students sit in a circle. Each holds five cards with local rules (e.g., "If you hold a Star, pass to Player 2"). They do not know the global goal: to arrange all cards into a specific pattern on your desk. Time limit: 10 minutes. Success yields 10 points each. *Constraint:* No talking about rules, only "Pass" or "Hold." They must coordinate via local cues alone.
  **Round 2 (The Investment):** A group pool starts at 0. Each student privately decides to contribute 5 points or 0. The total pot is doubled if >80% contribute. One student receives the "Mercenary" card: "Maximize personal points. You may contribute 0 but claim you contributed." If the group succeeds, all get 10 points. The Mercenary gets a +5 bonus if they contributed 0. *Constraint:* No showing contribution slips. The Mercenary should contribute enough to ensure success if it maximizes their yield, simulating cooperation without commitment.
  **Round 3 (The Mandate):** Group votes on Task A (stack chairs) or Task B (write names on board). Majority rules. The Minority *must* perform the task. Payoff: 15 points if task completed. *Constraint:* Voting is secret, assignment is public. This forces action without personal endorsement.
  **Scoring:** Points accumulate toward the voucher. Individual bonus points are possible only in Round 2. This creates tension between group success and individual gain.

  **Minute-by-minute**
  **0-5:** Intro & Groups. Distribute Round 1 envelopes.
  **5-20:** Round 1 Play. Circulate silently. Enforce "no rule talk." Note moments of frustration when rules conflict.
  **20-35:** Round 2 Play. Distribute Special Roles secretly. Collect contribution slips. Announce success/failure only.
  **35-50:** Round 3 Play. Conduct vote. Enforce minority task execution.
  **50-80:** Debrief.
  **Instructor Role:** During play, be a bureaucrat, not a facilitator. Do not answer rule questions that reveal global goals. Let them struggle with coordination. Start/stop timer strictly. If a group finishes early, hand them a "Complexity Card" (e.g., "Reverse direction") to maintain pressure. Keep score visible to heighten stakes.

  **Debrief**
  Start with Round 1: "Did you feel part of a team despite not knowing the goal?" This targets the colleague's toddler observation: coordination without shared conception. If they say "Yes," press: "Where was the 'we' if no one had the plan?"
  Round 2: Reveal the Mercenary. Ask the group: "Does knowing someone was 'out for themselves' change whether it was a 'we'?" This tests if joint action requires mutual obligation or just matching behavior. Ask the Mercenary: "Did you feel part of the group?"
  Round 3: Ask the minority voters: "Did *you* do it, or did *they* make you do it?" This targets Corporate Agency.
  Reveal terms: "Shared Intention," "Joint Commitment," "Social Entity."
  Ask: "Where did the 'we' live? In your heads, or in the rules?" Let them argue. If they say "Rules," press: "Why did Round 2 feel different?" If they say "Heads," press: "Round 1 had no shared heads." Connect to Bratman (mental states) vs. Gilbert (normative structure). Do not validate your hunch; let the data stand.

  **What will go wrong**
  1.  **Talking in Round 1:** Students will try to share rules. Stop immediately, deduct points. This friction is data: why did they feel rule-breaking was possible?
  2.  **Mercenary caught:** If the group suspects, allow an accusation. If right, Mercenary loses points; if wrong, Accuser loses points. This adds risk to trust.
  3.  **Round 3 Tie:** You cast the deciding vote. This emphasizes external authority vs. internal consensus.
  4.  **Refusal to act:** If the minority refuses, the group fails. Zero points. Ask why they couldn't enforce compliance. This highlights the lack of normative power in the game vs. real life.
  5.  **Early finish:** Add a "Complexity Card" mid-round. Do not let them sit idle; boredom kills the sense of joint effort.

  **What the activity can't show**
  Points are incentives, not obligations. Real joint action involves normative rights to rebuke, not just point loss. The game simulates consequences, not the *authority* members have over each other (Gilbert's specific claim). Also, time scale: real joint commitments persist beyond the session. The "normativity" of social ontology is hard to gamify without real social stakes. You must lecture this part: explain that in real life, quitting Round 2 mid-way would incur a social penalty, not just a point loss. The activity shows the *shape* of the problem, not the *weight* of the obligation.

  **Settled vs contested**
  **Consensus:** Joint action is non-summative; it isn't just aggregate individual action. All parties agree the "we" is real.
  **Contested:** Is the glue mental (Bratman's interlocking intentions) or normative (Gilbert's joint commitment)? Or is it functional/structural (your hunch)?
  **Rigging:** Round 1 rigs toward your "structure/local cue" hunch (success without shared mental states), challenging Bratman. Round 2 rigs toward Gilbert (betrayal feels like a violation even if behavior matches). Round 3 tests the limits of "we" under coercion.
  **Note:** Do not present your hunch as the solution. Present it as one viable interpretation of the data they generated. The majority view (Bratman/Gilbert) would argue Round 1 *did* involve shared intentions (just implicit) or that Round 2 *was* a joint action until the reveal. Let them fight this.
