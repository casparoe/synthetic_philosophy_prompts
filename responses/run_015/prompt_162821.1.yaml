          3.  HO state indexes target as *own* and *current* (self-referential).
          4.  HO state has functional impact (makes a difference beyond FO state).
          5.  *Crucial Modification:* HO state need not be conceptual or introspectively accessible (subpersonal monitor allowed). This is to include infants/mammals.
      *   **Goal:** The user wants to be talked *out* of it. They want a "map of exposure" (critiques), analysis of specific hypotheticals, verdict on a proposed paradigm, honesty about insulation/unfalsifiability, comparison with rival theories, and the AI question.
