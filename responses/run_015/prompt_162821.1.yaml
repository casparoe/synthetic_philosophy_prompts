      *(Self-Correction during drafting)*: Wait, the user's clause (4) says the HO state must make a difference *beyond* what the FO state alone would predict. This is a strong functionalist constraint. If I knock out the monitor (Hypothetical 1) and behavior stays the same, clause (4) is violated *or* the theory says consciousness is gone. If behavior stays the same (report intact), then consciousness *should* be gone according to HOT. If they say "I see it," HOT is falsified.
      *Refining Hypothetical 1:* If the monitor is knocked out, HOT says *no consciousness*. If the subject says "I see it," HOT is wrong. The user asks: "If subjects... still insist they have rich experience." That is fatal.
      *Refining Hypothetical 2:* HO driven, FO absent. HOT says *conscious* (illusion). FO says *unconscious*. This is the "Illusionism" bullet. HOT theorists usually accept this.

      *Insulation:* This is the trickiest part. If consciousness *is* the availability for report (mediated by HO), then using report to measure consciousness is tautological. But if consciousness is the *state* of being monitored, and report is just one output, we can look for other outputs (pupil dilation, neural signatures). I need to press on whether "report" is the *only* evidence.

      *AI:* If functionalism is true, yes. If biological naturalism is true, no. The theory seems functionalist.

  5.  **Final Polish:**
      *   Ensure all constraints are met (American English, casual, confidence levels, least sure point).
      *   Make sure I'm actually challenging them, not just nodding along.
