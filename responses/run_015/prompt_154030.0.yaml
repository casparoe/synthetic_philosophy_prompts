      *   **Hofstadter's Challenge:** Continuum of Variation.
      *   **Compatibility:** Tension between Breadth (MFA) and Depth (Hofstadter).
      *   **The Hofstadterian Rubric:** Deep mapping, parameter discovery, avoiding shallow hopping.

