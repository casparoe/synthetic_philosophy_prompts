answer: |-
  1. The deployment gate presupposes a functionalist theory of mechanism identity, where a model is defined entirely by its input-output mapping rather than its internal weights or architecture. It treats the model as a black box whose identity collapses whenever observable behavior on the test suite remains invariant.
  2. Strictly, the practice only presupposes that behavioral equivalence on the specific regression suite is sufficient for deployment safety, not that internal differences are ontologically nonexistent. It fits well with behaviorism but is equally compatible with realism where internal circuits are irrelevant to the specific risk profile covered by the evals.
  3. This practice is underdetermined because both a strict behaviorist and a pragmatist who views internal weights as theoretically distinct but operationally irrelevant would license the same promotion gate. Consequently, the gate alone cannot distinguish whether you believe the models are truly identical or merely interchangeable for current business purposes.
  4. Adopting a structural view would require deployment gates to validate weight deltas, architecture graphs, and training lineage rather than relying solely on output comparisons. Audit practices would need to integrate directly with promotion pipelines, blocking any artifact lacking provenance even if it passes behavioral regression.
  5. Verdicts declaring distilled models or adversarially tweaked checkpoints as the "same model" would be overturned, forcing them through full safety reviews despite passing evals. You would need new monitoring for internal activation distributions and weight divergence to catch functionally similar but structurally distinct mechanisms that might fail on out-of-distribution inputs.
