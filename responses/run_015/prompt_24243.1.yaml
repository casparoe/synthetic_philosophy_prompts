      *   *Goal:* Define what the gate assumes about "what a model is."
      *   *Analysis:* The gate treats behaviorally equivalent models as identical. This aligns with functionalism or behaviorism.
      *   *Draft:* The deployment gate presupposes a functionalist theory of mechanism identity, where a model is defined entirely by its input-output mapping rather than its internal weights or architecture. It treats the model as a black box whose identity collapses whenever observable behavior on the test suite remains invariant.

  3.  **Drafting Item 2: Strict Presupposition vs. Good Fit**
      *   *Goal:* Distinguish what is *required* by the practice vs. what is just *compatible*.
