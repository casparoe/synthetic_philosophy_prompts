      *   *Draft:* Strictly, the practice only presupposes that behavioral equivalence on the specific regression suite is sufficient for deployment safety, not that internal differences are ontologically nonexistent. It fits well with a behaviorist view, but is equally compatible with a realist view where internal circuits are merely irrelevant to the specific risk profile covered by the evals.

  4.  **Drafting Item 3: Underdetermination**
      *   *Goal:* Where do multiple theories license the same gate?
      *   *Analysis:* Both a strict behaviorist and a pragmatist (who cares about internals but trusts the evals) would use this gate. Also, someone who thinks internals matter but are too hard to check would use this gate.
