  # The Diagnostic Core: A Decision Tree for Cognitive Boundary Disputes

  **Instructions:** Proceed through the nodes in order. At each node, select the response that best matches your intuition about the case described. Follow the arrow to the next node or to a terminal leaf.

  ### Node 1: The Sync Error (Case 1)
  **Case:** A notes app whose contents are altered by a sync error; you consult it, act on the altered entry without hesitation, and are never corrected.
  **Question:** Did your belief change, or were you merely misinformed by an external source? Furthermore, is there a single correct answer to this question, or does it depend on how we choose to define "belief"?
  **Probes:** (1) Where the mind stops; (4) Who is answerable.
  *   **If "It depends on definition / No fact of the matter":** Go to **Leaf 1**.
  *   **If "There is a fact of the matter":** Go to **Node 2**.

  ### Node 2: The Shared Base (Case 3)
  **Case:** A shared knowledge base maintained by two people, where neither can tell who entered a given item and each treats every item as something they know.
  **Question:** Is there one cognitive system operating across two bodies, or two distinct minds sharing a resource?
  **Probes:** (2) Who the agent is; (3) Unit of explanation.
  *   **If "One cognitive system":** Go to **Leaf 2**.
  *   **If "Two distinct minds":** Go to **Node 3**.
      *(Note: If you answered "One system" but insist "Two people are responsible," you are in an unoccupied logical space; see Table of Unoccupied Combinations.)*

  ### Node 3: The Power Dependency (Case 5)
  **Case:** Notes readable only while a device is powered and online; when it is off, you recall nothing at all.
  **Question:** When the battery dies, is your *memory* impaired, or is your *access to a record* impaired?
  **Probes:** (1) Where the mind stops.
  *   **If "Access to a record is impaired":** Go to **Node 4**.
  *   **If "Memory is impaired":** Go to **Node 5**.

  ### Node 4: The Origin Constraint (Case 7)
  **Case:** A device purpose-built as a memory aid versus an ordinary object you have trained yourself to use as one.
  **Question:** Does the history of the object's design determine whether it can be part of your mind, or does only its current function matter?
  **Probes:** (1) Where the mind stops.
  *   **If "Design history matters":** Go to **Leaf 3**.
  *   **If "Only current function matters":** Go to **Leaf 4**.

  ### Node 5: The Opaque Assistant (Case 4)
  **Case:** An assistant that periodically rewrites and reorganizes your notes and surfaces connections you never drew, by a mechanism you could not reconstruct.
  **Question:** Are the resulting insights *yours*, or are they the *assistant's output* which you merely consume?
  **Probes:** (2) Who the agent is; (4) Who is answerable.
  *   **If "Assistant's output":** Go to **Leaf 5**.
  *   **If "Yours":** Go to **Node 6**.

  ### Node 6: The Reshaped Practitioner (Case 8)
  **Case:** A practitioner who, after years with a navigation or notation aid, no longer uses it, but whose unaided reasoning has been permanently reshaped by it.
  **Question:** Was the aid a *sculptor* that changed your inner machinery, or a *temporary component* that was once part of the machinery itself?
  **Probes:** (1) Where the mind stops; (3) Unit of explanation.
  *   **If "Sculptor of inner machinery":** Go to **Leaf 6**.
  *   **If "Temporary component of machinery":** Go to **Node 7**.

  ### Node 7: The Biological Twin (Case 9)
  **Case:** A second person who has simply memorized the same facts; the two of you are indistinguishable in behaviour and in how it seems to you.
  **Question:** Are you cognitively identical to this person, or is your cognitive process fundamentally different in kind?
  **Probes:** (3) Unit of explanation; (1) Where the mind stops.
  *   **If "Fundamentally different in kind":** Go to **Leaf 7**.
  *   **If "Cognitively identical":** Go to **Leaf 8**.

  ---

  ## Terminal Leaves

  **Leaf 1: The Deflationary View**
  *   **Position:** Deflationary treatment (boundary question is interest-relative or merely verbal).
  *   **AI Implication:** Whether an AI aid constitutes memory is a pragmatic choice for the user, not a scientific fact.
  *   **Awkward Commitment:** You must accept that two people could agree on all physical facts about the brain and device yet both be right in disagreeing about whether the mind extends.

  **Leaf 2: The Distributed View**
  *   **Position:** Distributed-cognition views (the individual's mind is the wrong unit).
  *   **AI Implication:** The human-AI pair forms a single remembering agent; individual credit is secondary to system performance.
  *   **Awkward Commitment:** You must accept that a single "mind" can be partially destroyed by turning off one person's laptop while the other remains fully conscious.

  **Leaf 3: The Conservative Rejection**
  *   **Position:** Conservative rejections resting on a mark of the cognitive together with a bloat or boundary objection.
  *   **AI Implication:** AI aids are tools for retrieval, never containers of belief, regardless of reliability.
  *   **Awkward Commitment:** You must deny that a perfectly reliable, instant-access implant differs in kind from a biological neuron solely because it was manufactured.

  **Leaf 4: The Embedded View**
  *   **Position:** Embedded or scaffolded but not extended (causal dependence without constitution).
  *   **AI Implication:** AI aids causally support remembering but do not themselves store the user's beliefs.
  *   **Awkward Commitment:** You must maintain a sharp metaphysical boundary between head and world despite continuous, seamless causal coupling that functions identically to neural processing.

  **Leaf 5: The Extended System View**
  *   **Position:** Extended cognitive system but not extended mind (personal-level states staying in the head).
  *   **AI Implication:** The human-AI system processes information, but only the human half "believes" or "remembers."
  *   **Awkward Commitment:** You must posit a cognitive system that generates knowledge claims without any single agent within that system holding the corresponding belief.

  **Leaf 6: The Enculturation View**
  *   **Position:** Enculturation or cognitive-integration views (transformation of the inner system is what matters).
  *   **AI Implication:** AI aids are remembered only insofar as they permanently alter biological neural weights.
  *   **Awkward Commitment:** You must claim that a user relying on a device for 40 years remembers *less* than a user who relied on it for 10 years and then stopped, provided the latter was more deeply "reshaped."

  **Leaf 7: Active Externalism (Extended but Distinct)**
  *   **Position:** Unnamed (Extended mind, but functionally distinct from biological memory).
  *   **AI Implication:** Users believe via AI, but this is a hybrid form of believing distinct from biological memory.
  *   **Awkward Commitment:** You must explain why two behaviorally indistinguishable agents (one biological, one hybrid) possess different kinds of mental states despite identical inputs and outputs.

  **Leaf 8: The Parity View**
  *   **Position:** Full-blooded parity-style extension.
  *   **AI Implication:** Relying on a persistent AI memory aid is literally the same kind of mental state as biological recall.
  *   **Awkward Commitment:** You must accept that if the AI is hacked or altered without your knowledge, your own beliefs have been directly modified by a third party.

  **Leaf 9: Unnamed Combination A**
  *   **Position:** Unnamed (Distributed System but Individual Responsibility).
  *   **AI Implication:** The group-AI system remembers, but only the human is answerable for errors.
  *   **Awkward Commitment:** You assign responsibility to an agent (the human) for cognitive states that you admit are partly constituted by processes outside their control (the partner/AI).

  **Leaf 10: Unnamed Combination B**
  *   **Position:** Unnamed (Embedded Access with Tool Agency).
  *   **AI Implication:** The tool is not part of the mind, but the insights it generates belong to the tool, not the user.
  *   **Awkward Commitment:** You treat the user as cognitively independent while simultaneously denying they are the author of the reasoning they endorse and act upon.

  ---

  ## Apparatus

  ### Scoring Key and Diagnostic Patterns

  | Leaf | Path (Node Responses) | Diagnostic Pattern |
  | :--- | :--- | :--- |
  | **1 (Deflationary)** | Node 1: "No fact of the matter" | Rejects realism about cognitive boundaries. |
  | **2 (Distributed)** | Node 1: Fact; Node 2: "One system" | Prioritizes system-level explanation over individual agency. |
  | **3 (Conservative)** | Node 1: Fact; Node 2: Two; Node 3: Access; Node 4: "Design matters" | Requires biological or teleological origin for constitution. |
  | **4 (Embedded)** | Node 1: Fact; Node 2: Two; Node 3: Access; Node 4: "Function matters" | Accepts functional coupling but denies constitution (causal only). |
  | **5 (Ext. System)** | Node 1: Fact; Node 2: Two; Node 3: Memory; Node 5: "Assistant's output" | Accepts system-level processing but restricts personal states to the head. |
  | **6 (Enculturation)** | Node 1: Fact; Node 2: Two; Node 3: Memory; Node 5: Yours; Node 6: "Sculptor" | Locates extension in permanent inner change, not current coupling. |
  | **7 (Ext. Distinct)**| Node 1: Fact; Node 2: Two; Node 3: Memory; Node 5: Yours; Node 6: Component; Node 7: "Different" | Accepts extension but denies parity with biological states. |
  | **8 (Parity)** | Node 1: Fact; Node 2: Two; Node 3: Memory; Node 5: Yours; Node 6: Component; Node 7: "Identical" | Full functionalism; substrate neutrality. |
  | **9 (Unnamed A)** | Node 1: Fact; Node 2: "One system" *but* Node 5: "Assistant's output" | **Incoherent:** Conflicts on Unit of Explanation vs. Agency. |
  | **10 (Unnamed B)** | Node 1: Fact; Node 2: Two; Node 3: Access; Node 5: "Assistant's output" | **Unattractive:** Denies user agency despite user reliance. |

  **Order Sensitivity:** The tree assumes *Constitution* (Node 3) is prior to *Agency* (Node 5). If a respondent answers Node 5 ("Yours") before Node 3 ("Access"), they may be forced into Leaf 8 (Parity) even if they believe the device is merely scaffolding. This order reflects the logical dependency: one must establish the device is part of the memory system before asking whose memory it is.

  ### Table of Unoccupied Combinations

  | Combination | Diagnosis | One-Line Diagnosis |
  | :--- | :--- | :--- |
  | **Group Mind + Individual Responsibility** | Incoherent | Violates the link between cognitive constitution and normative answerability. |
  | **Embedded Access + Tool Agency** | Unattractive | Renders the human user a passive vessel, undermining the concept of "aid." |
  | **Parity + No Reshaping** | Merely Unexplored | Theoretically possible (instant extension) but lacks a mechanism for stability. |
  | **Conservative + Functionalism** | Incoherent | Contradictory: Functionalism denies origin matters; Conservatism requires it. |

  ### Indistinguishable Leaves and Further Questions

  **Leaves 4 (Embedded) and 3 (Conservative):**
  *   **Indistinguishability:** Both deny the AI is part of the mind.
  *   **Separating Question:** "If a nanotech implant functioned exactly like a neuron but was manufactured, is it mind?"
  *   **Substantive or Verbal:** Substantive. It probes whether the boundary is physical (biological) or functional.

  **Leaves 6 (Enculturation) and 8 (Parity):**
  *   **Indistinguishability:** Both accept the AI influences belief.
  *   **Separating Question:** "If you remove the device today, do you lose the belief today, or only the ability to retrieve it?"
  *   **Substantive or Verbal:** Substantive. Enculturation says the belief is now internal (you keep it); Parity says the belief was partly external (you lose it).

  ### Flagged Nodes: Divergent Reasons for Same Answer

  **Node 3 (Power Dependency):**
  *   **Answer:** "Memory is impaired."
  *   **Reason A (Parity):** The device *is* the memory store; losing it is like losing a brain region.
  *   **Reason B (Dependency):** The device is a tool, but the *capacity* to remember is so dependent on it that the distinction collapses practically.
  *   **Risk:** These respondents will diverge at Node 6 (Reshaped). Reason A leads to Parity; Reason B often leads to Enculturation.

  **Node 5 (Opaque Assistant):**
  *   **Answer:** "Yours."
  *   **Reason A (Integration):** The AI is transparent; you don't notice it, so it's you.
  *   **Reason B (Endorsement):** You consciously approve the output, making it yours regardless of the source.
  *   **Risk:** Reason B respondents may reject Node 6 (Component), viewing the AI as a colleague rather than a part.
