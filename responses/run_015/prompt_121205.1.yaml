answer: |-
  # Q&A Prep Sheet: "Normative Persistence and Material Constitution"

  ## Strategic Opening Concessions
  *To defuse tension before the Q&A begins, add this paragraph to your conclusion:*
  "I want to acknowledge two limitations upfront. First, I am not claiming that 'intention' is a physical force; I am claiming it is a metaphysical constraint on identity, similar to how laws constrain physical behavior. Second, I concede that my view multiplies entities. I argue this multiplication is necessary to save our actual practices of art and ownership, but I acknowledge the cost to ontological parsimony."

  ---

  ## The Objections (Ordered by Likelihood and Damage)

  ### 1. The Verificationist Challenge
  **Who:** The Logical-Positivist Classmate
  **Phrasing:** "You claim the Statue and Clay are numerically distinct. But if they occupy the same space, have the same mass, and reflect the same light, what empirical test verifies their distinctness? If no observation can distinguish them, isn't your claim cognitively meaningless?"
  **Your Reply (2 mins):**
  "That is the core challenge of verificationism. However, I argue that identity conditions *are* verifiable, just not instantaneously. We verify the distinction through *counterfactual interventions*. If we melt the object, the Clay persists, but the Statue does not. We observe the *outcome* of the intervention. The distinction lies in the different trajectories of existence under specific physical changes. While we cannot see 'identity' directly, we verify it by observing survival conditions. Just as we verify 'fragility' by breaking a glass, we verify 'statue-hood' by destroying its form. The difference is dispositional, but dispositions have empirical cash-value in terms of future observations."
  **Weakness/Concession:** *Concede that you cannot verify the distinction at a single time-slice (t1).* You must admit the distinction is only visible diachronically (over time). If they press that dispositions aren't "real" until manifested, you have no empirical defense at t1.

  ### 2. The "Intentionality isn't Ontology" Objection
  **Who:** The AP Philosophy Teacher
  **Phrasing:** "You ground the Statue's persistence in 'artistic intention.' But intentions are mental states in observers, not properties of the object. How can a viewer's thought determine whether an object exists? That makes ontology dependent on psychology, which seems backwards."
  **Your Reply (2 mins):**
  "I agree that a random viewer's thought doesn't constitute the object. However, the 'intention' I refer to is not a fleeting mental state but the *causal history of production*. The Statue exists because an agent acted *for the purpose* of creating art. This teleological function is embedded in the object's history, much like a heart's function is to pump blood regardless of whether anyone is looking at it. The persistence condition is grounded in the *origin* of the object, not current observation. The Clay was caused by geological processes; the Statue was caused by artistic agency. Those distinct causal histories mandate distinct persistence rules."
  **Weakness/Concession:** *Concede that 'function' is notoriously difficult to define naturalistically.* If the artist dies, does the intention vanish? You risk making the object's existence depend on the artist's memory.

  ### 3. The Four-Dimensionalist Parsimony Objection
  **Who:** The Visiting Undergraduates (in unison or tag-team)
  **Phrasing:** "Why posit two entities? In 4Dism, the Statue is just a temporal part of the Clay-worm that ends when the form is lost. You're multiplying entities without necessity. We can explain the linguistic difference without ontological distinctness."
  **Your Reply (2 mins):**
  "Parsimony is a virtue, but not when it erases genuine differences in kind. If I say 'The Army marched' and 'The Soldiers marched,' the truth conditions differ. The Army can survive the replacement of all soldiers; the collection of specific soldiers cannot. Similarly, if we treat the Statue as merely a temporal slice of Clay, we cannot explain why we value the Statue differently than the Clay in legal and ethical contexts. If they are identical, destroying the Statue should be identical to destroying the Clay. But we punish vandalizing art differently than recycling matter. Our practices track two distinct entities; your ontology ignores that data to save a theoretical preference for worms."
  **Weakness/Concession:** *Concede that 4Dism handles the spatial coincidence problem more elegantly.* You are choosing to save "common sense practices" at the cost of "ontological simplicity." Acknowledge this trade-off explicitly.

  ### 4. The Anicca (Impermanence) Objection
  **Who:** The Buddhist-Analogy Peer
  **Phrasing:** "You argue about how the Statue persists. But in Buddhism, *anicca* teaches that nothing persists. Both Statue and Clay are aggregates clinging to an illusion of continuity. Doesn't your distinction just reinforce attachment to false substantiality?"
  **Your Reply (2 mins):**
  "That is a soteriological point, about suffering and attachment, whereas my thesis is metaphysical, about categorization. Even if all things are impermanent, they cease in different ways. A flame goes out differently than a rock crumbles. My argument accepts that both will eventually cease, but asks *by what rules* they cease. Acknowledging that the Statue ceases when form is lost, while Clay ceases when atoms scatter, doesn't deny impermanence; it clarifies the specific nature of that impermanence. We can accept emptiness of inherent existence while still acknowledging conventional distinctions required to navigate the world."
  **Weakness/Concession:** *Concede that your view relies on 'conventional truth' rather than 'ultimate truth'.* If they argue ultimate truth is the only truth that matters for a philosophy thesis, your whole project becomes merely pragmatic, not metaphysical.

  ### 5. The "Modal Cost" Accusation
  **Who:** The Visiting Undergraduates
  **Phrasing:** "Your title claims 'Without Modal Cost.' But persistence conditions *are* modal properties. To say 'The Statue survives melting' is to say 'If melted, it would exist.' You haven't avoided modal logic; you've just renamed counterfactuals as 'normative conditions.'"
  **Your Reply (2 mins):**
  "That is a crucial distinction. Standard modal arguments rely on *possible worlds* semantics—claiming the Statue exists in a world where it is squashed. I am not appealing to possible worlds. I am appealing to *actual* rules of constitution. I am saying that in the *actual* world, the definition of 'Statue' includes a normative constraint. It's not that it *could* survive; it's that it *does not count as* the same object if the norm is violated. This is a linguistic/conceptual rule applied to reality, not a claim about reality's behavior in other possible worlds. I am avoiding the cost of populating modal space, not the use of conditional language."
  **Weakness/Concession:** *This is your weakest technical ground.* You must concede that the line between "actual normative rule" and "modal property" is thin. If they press that norms *imply* modality, you have to retreat to saying your view is "less metaphysically loaded" rather than "modal-free."

  ### 6. The Causal Exclusion Problem
  **Who:** The AP Philosophy Teacher
  **Phrasing:** "If the Statue and Clay are distinct, and I lift the Clay, do I lift the Statue? If yes, you have causal overdetermination (two things lifted by one force). If no, how do they interact? You risk making the Statue an epiphenomenon."
  **Your Reply (2 mins):**
  "I accept a limited form of overdetermination. When I lift the Clay, I lift the Statue because the Statue is *constituted by* the Clay at that moment. They share causal powers in virtue of the constitution relation. This isn't mysterious dualism; it's like how a 'check' and a 'piece of paper' both cause a bank transaction. The paper provides the physical causal power; the check provides the institutional causal power. Both are real. The Statue borrows the Clay's physical causal powers while retaining its own identity conditions. We accept this in law and institutions; I argue we should accept it in metaphysics."
  **Weakness/Concession:** *Concede that this feels unsatisfying to physicalists.* You are asking them to accept that one physical event has two distinct ontological explanations. This is a hard sell for a physics-minded teacher.

  ### 7. The Operationalization of "Intention"
  **Who:** The Logical-Positivist Classmate
  **Phrasing:** "You say 'artistic intention' defines the Statue. But if the artist is dead, or lies about their intention, how do we measure this variable? If we can't measure the intention, we can't determine the identity."
  **Your Reply (2 mins):**
  "We measure intention through public evidence: sketches, statements, context of display, and form. We don't need telepathy; we use the same historical methods we use to determine if a document is a 'contract' or a 'draft.' If the intention is genuinely unknowable, then the object's status is indeterminate, which matches our actual experience. Sometimes we genuinely don't know if something is art or debris. My metaphysics reflects that epistemic limit. The identity is fixed by the intention, even if our *knowledge* of it is fallible."
  **Weakness/Concession:** *Concede that this makes identity epistemically opaque.* There could be a fact of the matter you can never know. This violates the positivist desire for verifiability, but it is a standard realist move.

  ---

  ## Your Weakest Point (Prepare to Defend)
  **The Is-Ought Gap in Ontology:**
  Your argument hinges on "Normative Persistence." You claim that because the Statue *ought* to maintain form to remain a Statue, it *is* a distinct entity from the Clay. Critics will argue you are deriving an ontological fact (distinct existence) from a normative rule (artistic standards).
  **Defense:** Do not try to prove norms *create* matter. Argue that norms *individuate* matter. Matter is continuous; objects are discrete. Norms are the knife that cuts discrete objects out of continuous matter. Without the norm, there is only Clay.

  ---

  ## The "Devastating" Objection (Hope They Don't Ask)
  **The Objection:** "If the Statue and Clay are numerically distinct but share all physical properties at time *t*, in virtue of what are they distinct *at time t*? If the distinction relies entirely on future persistence conditions, then at this exact moment, they are identical. You haven't proven two objects; you've proven one object with two possible futures."
  **Why it's Devastating:** It collapses your "Numerically Distinct" claim into a "Conceptual Distinction" claim. If they are distinct *now*, there must be a present-tense difference. If there is no present-tense physical difference, and you reject modal properties, there is nothing left to ground the distinction. It renders your thesis a semantic claim, not a metaphysical one.
  **Mitigation Strategy:**
  "If pressed, argue that the 'Causal History' is a present-tense property. The Statue *now* bears the property of 'having been created by an artist.' The Clay *now* bears the property of 'having been mined.' These are historical, relational properties that exist in the present moment. The distinction is grounded in the past, which is a fixed part of current reality."
  *(Note: This is a defensive fallback. It admits the distinction is relational/historical, not intrinsic.)*
