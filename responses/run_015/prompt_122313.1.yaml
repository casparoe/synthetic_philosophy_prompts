answer: |-
  **Practice Exam Question: Philosophy of Psychiatry**

  **Question 1**
  Consider the following scenario: A new diagnostic category, 'Chronic Digital Withdrawal Syndrome' (CDWS), is introduced via a proprietary AI screening app. The app assigns users a 'disconnection score'. Upon receiving a high score, users begin to curate their online activity to lower the score, while simultaneously adopting a self-narrative of being 'digitally injured'. Concurrently, clinicians begin using these AI scores to justify withholding cognitive behavioural therapy, arguing that patients must 'self-regulate' before qualifying for care. Consequently, the symptom profile of CDWS shifts from anxiety to performative restraint.

  Critically evaluate whether this scenario constitutes a 'looping effect' in Ian Hacking's sense. Does the technological mediation of the AI break the loop, or does it merely reconfigure it? In your answer, compare this dynamic with Hacking's classic analysis of Multiple Personality Disorder (MPD).

  ***

  **Model Answer**

  Ian Hacking's distinction between 'interactive kinds' and 'indifferent kinds' is central to understanding the ontology of psychiatric classification. Indifferent kinds, such as quarks, do not react to being classified. Interactive kinds, specifically human beings, can become aware of how they are classified and change their behaviour or self-conception in response. This reflexive process is the 'looping effect'. The CDWS scenario presents a complex instance of an interactive kind, mediated by algorithmic technology.

  Initially, CDWS fits Hacking's definition of an interactive kind. The classification is not merely descriptive; it is performative. When users receive a 'disconnection score', they do not remain passive. They alter their digital habits and adopt a narrative of being 'digitally injured'. This mirrors the feedback loop Hacking described: the classification changes the people classified, which in turn changes the extension and intension of the classification itself. The shift from anxiety to performative restraint indicates that the 'kind' is moving because the people within it are moving.

  However, the role of the AI raises the question of whether the loop is broken or reconfigured. One might argue that because an algorithm, rather than a human community, initiates the classification, the humanistic element of the loop is severed. This is incorrect. The AI is not an independent agent but a tool embedded within a clinical and social ecology. The loop remains intact because the *human* response to the AI output drives the change. The AI acts as an accelerant, standardising the feedback mechanism, but the reflexivity remains human. Therefore, the technological mediation does not break the loop; it creates a 'cybernetic looping effect' where the feedback is quantified and immediate.

  Crucially, the scenario introduces an institutional dimension often implicit in Hacking's work: the withholding of treatment. By using AI scores to deny therapy, clinicians reinforce the classification. Patients remain in the 'CDWS' category longer because they are barred from the interventions that might resolve their symptoms. This creates a power-laden loop where the classification becomes self-fulfilling through institutional neglect. This adds a layer of coercion to the looping effect, transforming it from a purely cognitive shift into a structural trap.

  Comparing this to Multiple Personality Disorder (MPD) illuminates the similarities and differences. In the MPD case, Hacking argued that the availability of the diagnosis allowed patients to make sense of their suffering by organising their symptoms into distinct personalities. Doctors and patients co-constructed the symptoms through expectation and interaction. CDWS operates similarly: the AI score provides the 'script' (the disconnection score) that patients enact. However, whereas MPD relied on interpersonal dynamics between therapist and patient, CDWS relies on human-algorithm interaction. The 'expectation' in MPD was clinical; in CDWS, it is computational. Yet, the ontological result is the same: the kind creates the very people it purports to describe.

  In conclusion, the CDWS scenario is a robust example of a looping effect. The AI does not break the loop but hardens it through quantification and institutional gatekeeping. Like MPD, it demonstrates that psychiatric kinds are not static natural kinds but dynamic moving targets. However, the CDWS case highlights that in the digital age, looping effects are increasingly mediated by non-human agents that encode clinical authority, potentially making the loop more difficult to escape than in the interpersonal dynamics of the MPD era.

  ***

  **Marking Scheme**

  **Grade Boundaries: First Class (A) vs. Upper Second (B)**

  | Criteria | **First Class (A) (70%+)** | **Upper Second (B) (60-69%)** |
  | :--- | :--- | :--- |
  | **Interactive vs. Indifferent Kinds** | Clearly defines the distinction and applies it precisely to CDWS. Explains *why* CDWS is interactive (reflexivity). | Defines the distinction correctly but applies it somewhat generically. May not fully explain the mechanism of reflexivity in the scenario. |
  | **The Reflexive Loop** | Explicitly traces the loop: Classification $\rightarrow$ Behavioural Change $\rightarrow$ Shift in Symptom Profile. | Describes the behavioural change but may miss the feedback into the classification system itself (the 'moving target'). |
  | **Technological Mediation** | **Key Differentiator:** Argues that AI reconfigures rather than breaks the loop. Identifies the AI as part of the social ecology, not an external breaker. | Argues the loop exists but treats the AI as a neutral tool, or argues the loop is broken without sufficient justification. |
  | **Institutional/Power Dimension** | **Key Differentiator:** Integrates the 'treatment-withholding' aspect as a mechanism that reinforces the loop (structural coercion). | Mentions the treatment issue but treats it as a side effect rather than a core component of the looping mechanism. |
  | **MPD Comparison** | Nuanced comparison. Notes the shift from interpersonal (MPD) to algorithmic (CDWS) expectations while maintaining ontological similarity. | Standard comparison. Notes both involve symptom shaping but misses the shift in the *source* of expectation (therapist vs. algorithm). |
  | **Common Mistakes (Penalties)** | **Avoids all pitfalls.** | **Conflates looping with social construction *simpliciter*:** Fails to mention the feedback mechanism.<br>**Ignores Treatment-Withholding:** Fails to discuss how denying care validates the diagnosis.<br>**Technological Determinism:** Claims the AI acts independently of human classification practices. |

  **Specific Marking Notes:**
  *   **British Spelling:** Ensure consistency (e.g., *behaviour, categorisation, programme, analyse*). Deduct 1% for persistent American spelling errors.
  *   **Word Count:** Model answer is approx. 600 words. Students should aim for 500-700 words for this specific practice question.
  *   **Critical Engagement:** An A-grade answer must take a stance on the AI mediation question, not just describe it.
