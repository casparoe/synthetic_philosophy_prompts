      *   *Implication:* Evolution requires this logical structure. Mere physical copying (crystals) isn't enough for open-ended evolution.
      *   *Framework:* Hofstadter's *Gödel, Escher, Bach* (GEB) typogenetics. Strings = DNA, Enzymes = Proteins/Functions, Translation = Genetic Code.

  3.  **Brainstorming Defeaters (The "Stress Test"):**

