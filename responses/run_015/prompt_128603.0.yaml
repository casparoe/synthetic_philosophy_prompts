      *Even Simpler (Game Theory focus):* **Is the Nash Equilibrium strictly worse for all participants than the cooperative outcome, with no mechanism to enforce cooperation?**

      Let's go with the **Incentive Misalignment + Coercion** angle.
      *Proposed Principle:* **"Does winning require destroying value that everyone (including the winner) would prefer to keep, such that opting out means losing the game entirely?"**

      *Test against cases:*
      *   AI Safety: Yes (Safety is destroyed, everyone wants safety, but can't stop).
      *   Cities/Taxes: Yes (Schools destroyed, everyone wants schools, can't stop).
      *   Fishing: Yes (Fish stocks destroyed, everyone wants fish, can't stop).
      *   Runners: No (Comfort is destroyed, but performance is *created*. The goal is the suffering/effort. Opting out just means not winning, not the sport collapsing).
      *   Universities: Yes (Affordability/Quality destroyed for prestige. Deans hate it but can't stop).
      *   Compute Race: Yes (Energy/Safety destroyed for capability. Nations feel they can't stop).

  5.  **Addressing the Uncertain Cases:**
      *   *Universities:* Fits the principle. Deans hate bloat, but if they cut it, rankings drop, donors leave, students go elsewhere. It's a status arms race where the "cost" is efficiency. **Verdict: Moloch.**
      *   *Compute Clusters:* Fits the principle. Energy is burned, risk increases. If Nation A stops, Nation B wins (strategic disadvantage). No one wants the energy waste, but security demands it. **Verdict: Moloch.**

