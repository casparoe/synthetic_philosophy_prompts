answer: |-
  The principle that separates your "Yes" cases from your "No" cases is this:

  **Does the competition force participants to destroy absolute value (shared welfare) merely to maintain relative position, where unilateral restraint guarantees elimination?**

  In game theory terms, this is distinguishing between a **Positive-Sum Game** (regular competition) and a **Negative-Sum Prisoner's Dilemma** (Moloch).

  Here is how this principle sorts your cases:

  ### 1. Testing the Principle
  *   **Marathon Runners (No):** When runners push harder, they suffer, but they create **absolute value** (faster times, better human performance). If one runner decides to train less, they lose the race, but the *sport* doesn't degrade. The suffering is an input for creation, not a tax for survival.
  *   **AI Safety / City Taxes / Fishing (Yes):** In all these cases, the participants are burning **absolute value** (safety, public revenue, fish stocks) solely to avoid losing **relative position** (market share, business location, catch size). If one lab unilaterally decides to be safe, they go bankrupt. If one city unilaterally raises taxes, businesses flee. The system punishes virtue.

  ### 2. Predictions for Your Uncertain Cases

  **University Prestige Competition**
  *   **Verdict:** **Moloch.**
  *   **Why:** No dean *wants* administrative bloat or unaffordable tuition. They are destroying the absolute value of the system (accessible education) to maintain relative standing (rankings). If one university unilaterally cuts bloat and lowers tuition, they don't win; they drop in the rankings, lose donors, and are perceived as "less prestigious." They are forced to burn resources just to stay in the same place.

  **AI Compute Cluster Race (Nations)**
  *   **Verdict:** **Moloch.**
  *   **Why:** You noted that "nobody is secretly defecting from an agreement." Moloch does not require a broken agreement; it requires a **security dilemma**. Even if both nations would prefer to save the energy and reduce risk, neither can stop without conceding strategic superiority. The energy burned is value destroyed for the sake of relative parity. The lack of a secret defection doesn't matter; the *structural incentive* to defect is what makes it a trap.

  ### 3. The Edge Case: The Social Platform
  *   **Scenario:** A platform tries to be ethical (less addictive), loses users to a rival, and reverts to stay alive.
  *   **Verdict:** **This is Moloch.**
  *   **Why:** This is the purest example of market selection acting as Moloch.
      *   **The Trap:** The "market" is selecting for the behavior that degrades the user (addiction), not the behavior that serves the user (utility).
      *   **The Coercion:** The ethical platform is not eliminated because their product is *worse* in a vacuum; they are eliminated because the *rules of the game* (attention economy) reward exploitation.
      *   **Distinction:** If this were "just market selection" in a healthy sense, the platform that served users best would win. Here, the platform that *exploits* users best wins. When market selection rewards value destruction (user well-being) over value creation, it is a Molochian trap.

  ### Summary
  The gut-check question you should use is: **"If everyone stopped doing this tomorrow, would the world be better off, and would anyone be able to stop without going out of business?"**

  *   **Runners:** If everyone stopped training, the sport dies. (Not Moloch)
  *   **AI/Cities/Unis/Platforms:** If everyone stopped the arms race, everyone would be richer/safer/happier, but no one *can* stop. (Moloch)

  Moloch isn't competition itself; it is competition where the incentives are misaligned with human welfare, and the system punishes anyone who tries to fix it.
