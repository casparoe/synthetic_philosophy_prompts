answer: |-
  Here is the plan. It is aggressive because ninety minutes is not enough time to be polite about a habit that is structural to your desk's output.

  ### 1. The Premise Check
  **Is the premise broken?**
  No, but the timeline is dangerous. Ninety minutes is enough to inoculate, not to cure. You are not teaching them historiography; you are teaching them a **copy-editing heuristic for causality**. If you attempt to teach them *why* Whig history is philosophically bankrupt, you will lose the room to defensiveness. If you teach them *how* it distorts their specific copy (making sources look smarter than they were, or making failures look like necessary steps), they will listen.

  **Your Four-Way Scheme:**
  Keep it. It is the spine.
  *   **The Fourth Mode (Retrospective Unit) does not collapse.** It is distinct from the Anticipatory Move.
      *   *Anticipatory:* "X's failure taught us Y." (Causal claim).
      *   *Retrospective Unit:* "X was studying [Modern Category]." (Categorical claim).
      *   *Why it matters:* The Anticipatory Move grants the past agent causality in our present. The Retrospective Unit steals the past's agency by assigning them our goals. The fourth mode is the most insidious because it feels like respectful translation. Make it the anchor of the session.

  ### 2. The Order of Operations (90 Minutes)

  **0:00–0:15: The Trap (Experience before Naming)**
  *   **Do not define Whig history yet.**
  *   **Activity:** Hand out a one-paragraph blurb about a historical scientific moment. Ask them to edit it for "clarity and impact" according to house style.
  *   **The Text:** Use a draft that is *perfectly* Whiggish. It should read smoothly. It should say things like, "Although X was ignored at the time, his work laid the essential groundwork for..." or "The field was not yet mature enough to understand..."
  *   **The Turn:** Ask the room: "What did we just do to the people in this paragraph?" They will say: "We made them look like pioneers." "We made the delay look logical."
  *   **The Reveal:** Name it. "This is Whig history. It is not a sin; it is a default setting. It is the narrative gravity of science journalism."

  **0:15–0:30: The Concession (Defuse the Relativism Fear)**
  *   **Address Misconception 1 (Ban on saying past was wrong):**
      *   Say this plainly: "Science *does* accumulate. We *do* know more than Pasteur. You are allowed to write that a treatment works and the old one didn't."
      *   **The Distinction:** "Whig history is not saying the past was less accurate. It is saying the past was *trying to be us*."
      *   **The Rule:** You can judge their *conclusions* by current standards. You cannot judge their *questions* by current standards.
  *   **Address Misconception 2 (Heroes/Hero-worship):**
      *   Explain that removing Whig history isn't about tearing down heroes; it's about restoring their actual labor. A hero who solved the problem they *actually* had is more interesting than a prophet who guessed our problem.

  **0:30–1:00: The Case Study (The Core)**
  *   **The Case:** **The "Purple Petunia" Incident (1990, van der Krol et al.).**
      *   *Why this case:* It is biomed-adjacent (genetics), relevant to AI (parameter tuning/expectations vs. outcomes), and crucially, it is **not** the Nobel-winning RNAi discovery itself (Fire & Mello, 1998). It is the "failed" experiment that preceded it.
      *   *The Narrative:* Researchers tried to make petunias darker purple by adding a pigment gene. The flowers turned white (or variegated). They called it "co-suppression." They were confused.
      *   *The Whig Draft:* Give the room a paragraph that describes this as "The discovery of RNA interference." It frames the confusion as a "puzzle" on the road to the "real" discovery eight years later. It treats the researchers as unwitting pioneers of RNAi.
      *   *The Task:* Rewrite the paragraph so that the researchers are trying to solve *floriculture problems*, not *gene silencing problems*.
      *   *What it must have:* A clear statement of the researchers' *actual* goal (darker flowers, not understanding mRNA).
      *   *What it must lack:* Any mention of RNAi as the "outcome." The outcome was white flowers. The *utility* came later, elsewhere.
      *   *Why not canonical candidates:* If you use Semmelweis (handwashing), the room knows the "Vindication Plot" too well. They will just swap the villain (the Vienna General Hospital) for the hero (Semmelweis). The Petunia case is obscure enough that they cannot rely on memory; they must rely on the heuristic.
      *   **Address Misconception 3 (Remedy = More Context):**
          *   As they work, someone will suggest: "We just need to add a sentence about the state of the field."
          *   Stop them. "Adding context to a teleological story just makes the teleology heavier. You must change the *verb*. Not 'led to,' but 'resulted in.'"
      *   **Address Misconception 4 (Flipped Vindication):**
          *   Watch for the rewrite that says: "The establishment ignored the petunia findings, but they were right about silencing."
          *   Correct this: "They weren't right about silencing. They were right about white flowers. Silencing is *our* explanation, not *their* finding." This is the hardest distinction.

  **1:00–1:20: The Four Modes (Operationalizing)**
  *   Put your four failure modes on the board.
  *   **Anticipatory Move:** "X paved the way for Y." (Ban "paved the way." Use "preceded.")
  *   **Vindication Plot:** "X was ignored but right." (Ban "right." Use "consistent with later findings.")
  *   **Maturity Metaphor:** "The field was young/immature." (Ban "mature." Use "The field prioritized different metrics.")
  *   **Retrospective Unit:** "X was studying [Modern Term]." (Ban "studying [Modern Term]." Use "X was studying [Contemporary Term], which we now map to...")
  *   **Drill:** Give them three headlines from their own archive. Ask them to identify which mode is driving the headline.

  **1:20–1:30: Scope & Assessment**
  *   **Out of Scope:**
      1.  **Philosophy of Truth:** We are not debating whether scientific truth is real. We are debating how to describe the *process* of finding it.
      2.  **How to Interview Historians:** This is a writing/editing session, not a sourcing session.
      3.  **Writing History Pieces:** You write news. This is about how history appears *inside* news about new findings.
  *   **The Final Question:**
      *   Do not ask: "What is Whig history?"
      *   Ask: **"Look at the scientist you quoted in paragraph four. What question were they trying to answer that we no longer ask?"**
      *   *Why:* If they can name a question that has *vanished* from the field, they have successfully decoupled the past from the present. If they say, "They were trying to solve [Current Problem] but lacked the tools," they have failed.

  ### 3. Confidence and Contested Readings

  **Confidence Levels:**
  *   **High:** On the distinction between *accumulation of knowledge* and *teleology of purpose*. This is the safe ground that prevents relativism.
  *   **Moderate:** On behavioral change in 90 minutes. You can give them the vocabulary, but their editors and sources will pull them back to Whig narratives daily. This session must be framed as "spotting the bug," not "eradicating the bug."
  *   **Low:** On the Case Study sticking. If a biomed reporter knows the RNAi story well, they will revert to the Nobel narrative. You must enforce the "1990 only" constraint strictly.

  **Contested Readings to Flag:**
  *   **The Term "Whig History":** Some historians of science hate this term. They argue it has become a slur used to dismiss any narrative of progress, even warranted ones. Acknowledge this: "Some historians think this term is useless. We are using it as a shorthand for 'narrative gravity,' not as a philosophical indictment."
  *   **The "Retrospective Unit":** This is the most contested part of your scheme. Some philosophers of science argue that we *cannot* describe the past except through current categories (we have no other language).
      *   *Your Counter:* You are not asking them to stop using current language. You are asking them to mark the translation. "They called it 'nervous fluid'; we call it 'neurotransmitter'." The Whig error is omitting the "we call it."
  *   **The "Vindication Plot":** Be careful not to suggest that vindication *never* happens. (e.g., Germ Theory *did* vindicate itself over Miasma Theory). The error is not in the vindication; it is in framing the *loss* of Miasma Theory as an inevitable moral failing of the past rather than a rational response to the evidence they had.

  ### 4. Summary of Constraints for You
  *   **Do not** let the session become a debate about whether science is objective.
  *   **Do not** let them fix the problem by adding adjectives ("controversial," "early"). They must change the verbs and nouns.
  *   **Do not** accept "They were doing AI" as a description of 1950s cybernetics. Accept "They were doing cybernetics, which influenced AI."

  If you hold the line on the **Purple Petunia** case (focusing strictly on the 1990 intent vs. the 1998 interpretation) and enforce the **Final Question** (identifying a vanished question), you will achieve the operational shift you need without getting bogged down in theory.
