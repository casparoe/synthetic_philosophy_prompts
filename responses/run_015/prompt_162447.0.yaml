  Here is a structural breakdown and draft prose for your column. It is written in British English, aimed at a smart general audience, and avoids citations while keeping the mathematics rigorous enough to satisfy your "in the weeds" requirement.

  ***

  ### Title Idea: The Coin That Pays Infinity (And Why You Shouldn't Touch It)

  **Introduction: The Setup**
  Start with the game as you defined it. It is the cleanest hook in probability. You flip a coin until heads appears. If it takes $n$ flips, the pot is $£2^n$. Heads on the first go? £2. Tails then heads? £4. Ten tails then heads? £1,024.

  The arithmetic is seductive. The probability of lasting exactly $n$ flips is $1/2^n$. The payout is $£2^n$. Multiply them, and every single possible outcome contributes exactly £1 to the expected value. Since there are infinitely many outcomes, the sum is $1 + 1 + 1 + \dots = \infty$.

  According to the standard logic of decision-making, you should mortgage your house to play this game. Even if the entry fee were £1,000, the expected return is infinite, so the profit is infinite. Yet, in reality, the median payout is £2. Roughly 94% of players walk away with £16 or less. The expectation is a ghost; the experience is poverty.

  Here is why the mathematics of the St. Petersburg game breaks our intuition, and why the usual fixes miss the point.

  **1. The Long Run is a Lie**
  In ordinary gambling, the "expected value" is a promise that the law of large numbers will eventually bail you out. If you bet on red in roulette, you might lose a hand, but over a thousand hands, your average loss settles predictably near the house edge. The expectation is carried by outcomes you actually see.

  In St. Petersburg, the expectation is not carried by the plausible; it is carried by the impossible. Each doubling of the prize adds exactly £1 to the expectation, but it requires a probability that halves. The money is hidden in the far tail of the distribution, in outcomes so rare you will never witness them.

  This breaks the reflex that says "play it enough times and it averages out". In this game, the running average does not settle. It creeps upward logarithmically. If you play the game $N$ times, your average payoff per game will not converge to a number; it will grow roughly as $\log_2 N$.

  Here is the back-of-envelope for why. In $N$ plays, the longest run of tails you are likely to see is roughly $\log_2 N$. (If you flip a coin a million times, you expect a run of about 20 tails, because $2^{20} \approx 10^6$). The payout for that single longest run is $2^{\log_2 N} = N$. This one "freak" win contributes $N$ pounds to your total pot. Divided by $N$ games, that single outlier contributes £1 to your average. The next biggest wins contribute smaller amounts, but the total average is essentially determined by how many doubling-steps fit into your sample size.

  The consequence is brutal. Suppose a casino charges £50 a go. To make your money back on average, you need your average payoff to reach £50. Since the average grows as $\log_2 N$, you need $\log_2 N \approx 50$. That means $N \approx 2^{50}$.

  $2^{50}$ is roughly a quadrillion ($10^{15}$). If you could play one game per second, it would take you 30 million years to reach the break-even point. The "long run" is longer than human civilisation. The expectation is mathematically infinite, but empirically unreachable. The handful of freak payouts that carry the value are so rare that they effectively do not exist for any mortal player.

  **2. The Wobbly Coin**
  This brings us to a subtler point, one that survives even if we remove the infinity. The infinite expectation relies on the coin being *exactly* fair. But physical objects are never exact. Suppose the coin is slightly biased towards heads, such that tails comes up with probability $q = 0.5 - \delta$.

  The mathematics shifts instantly. The probability of a run of length $n$ is now $q^{n-1}(1-q)$. The expected value becomes a geometric series:
  $$ E = \sum_{n=1}^{\infty} 2^n \cdot q^{n-1}(1-q) $$
  This series only converges if $2q < 1$, which means $q < 0.5$. As long as there is *any* bias towards heads, the expectation becomes finite. Specifically, for small $\delta$, the value blows up according to the rule:
  $$ E \approx \frac{1}{2\delta} $$

  Let's plug in the numbers. If tails is 49.95% ($\delta = 0.0005$), the expected value is roughly £1,001. If we make the bias a hundred times smaller ($\delta = 0.000005$), the value jumps to £100,000. As $\delta$ approaches zero, the value shoots to infinity.

  This creates a discontinuity. A perfectly fair coin is worth infinity; a coin biased by one atom's weight is worth £100,000. But here is the kicker: the *experience* of playing is identical. With the biased coin, the median is still £2. The 94% rule still holds. You still lose money 94% of the time.

  Furthermore, distinguishing a fair coin from one with $\delta = 0.0005$ requires on the order of $1/\delta^2$ flips. That is a million flips. You would need to play the game a million times just to verify the bias, yet the expected value calculation assumes you know the bias perfectly from the start.

  What does this tell us? It suggests the infinite expectation was an artefact of an idealisation nobody could verify. But it also shows something more damaging: even when the expectation is finite (£100,000), it remains a useless guide for decision-making. The skew is so extreme that the "average" is still divorced from reality. The paradox is not about infinity; it is about skew. A finite expectation can be just as misleading as an infinite one if the distribution is fat-tailed enough.

  **3. The Uncertainty Trap**
  You might think we can rescue the expected-value theorist by admitting uncertainty. "I'm not sure the coin is fair," you say. "I'll assign a 90% probability it's fair and 10% it's biased."

  This does not help. If there is a 90% chance the coin is fair, and the fair coin has infinite expectation, then your total expected value is:
  $$ 0.9 \times \infty + 0.1 \times \text{Finite} = \infty $$
  Uncertainty about the bias does not dilute the paradox; it makes it stickier. As long as you assign *any* non-zero probability to the coin being perfectly fair, the expectation remains infinite. You cannot Bayesian your way out of the infinity unless you are absolutely certain the coin is biased.

  So, what of the standard fix? Daniel Bernoulli suggested we don't value money linearly, but logarithmically. We value the *utility* of wealth, not the cash amount. Since $\log(2^n) = n \log 2$, the series becomes $\sum (1/2^n) \cdot n$, which converges to a small, finite number.

  Does this solve the problem? It deletes the infinity, certainly. Under log utility, the fair game is worth only a few pounds. But notice what happened: we didn't solve the skew problem; we just capped the value of the freak payouts. Log utility effectively says, "Winning £1 billion isn't a billion times better than winning £1."

  If we use the biased coin (where the cash expectation is already finite at £100,000), log utility *still* tells you not to pay much to play, because the median outcome is so low. This confirms that the infinity was a red herring. The real problem is that expectation is a bad summary statistic for highly skewed, one-shot choices. Whether the sum is infinite or merely £100,000, the "average" is being dragged by outcomes you will almost certainly never see.

  **Verdict: What is the Paradox Actually About?**
  The St. Petersburg paradox is often taught as a puzzle about infinity, but the biased-coin version shows us that the infinity is separable from the absurdity. We can strip away the three layers of the problem to see what remains.

  First, **Idealisation**. The infinite value relies on a casino with infinite capital and a perfectly fair coin. In the real world, both are impossible. The biased coin shows that relaxing the "perfect fairness" assumption collapses the value to finite numbers. So, yes, part of the paradox is taking mathematical limits too literally.

  Second, **Unbounded Utility**. If money had no diminishing returns, the infinite cash value would matter. But because we value money logarithmically (or with some other cap), the infinite cash stream translates to finite utility. This fixes the "infinite price" problem, but it feels like a workaround.

  Third, and most importantly, **Expectation under Skew**. This is the spine of the issue. Even with finite cash values and bounded utility, the distribution remains wildly asymmetric. The expectation is dominated by the tail; the median is dominated by the head.

  The honest verdict is this: The St. Petersburg game demonstrates that "Expected Value" is not a universal law of rationality. It is a tool designed for thin-tailed risks that repeat often. It works for insurance companies and casinos. It fails for individual agents facing fat-tailed risks, whether the expectation is infinite or merely astronomical.

  The paradox isn't that the maths breaks; it's that we tried to apply a law of averages to a game where the average never arrives. The coin doesn't need to be biased for the advice to be bad; the distribution just needs to be skewed enough that the "long run" is a place you'll never visit.
