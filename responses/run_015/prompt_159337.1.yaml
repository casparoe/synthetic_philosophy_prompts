      If $P(\text{Shard Safe}) = 0.99$, that means 1% chance of data loss per shard? That's incredibly high for storage. Or does it mean "Probability that our *argument* for the shard is sound"?
      *Interpretation:* It sounds like subjective confidence in the claim's validity.
