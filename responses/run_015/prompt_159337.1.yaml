  11. *Refining the "Safety" definition:* In safety engineering, "safe" usually means probability of failure is extremely low (e.g., $10^{-9}$ per hour). A 50% chance of being safe is *catastrophic* for a storage system expecting durability. I need to highlight this discrepancy. The user is treating "safety case" as "truth of claims" rather than "probability of data loss." I need to clarify that distinction.

