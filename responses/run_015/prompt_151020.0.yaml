answer: |-
  Medicine presupposes a pragmatic realism where reality is conferred by intervention stability rather than mechanistic unity, meaning your test case counts as a genuine disease and the intentional stance is necessary because it tracks the normative functional goals that define pathology.

  The practice treats causality as a ladder where the rungs are real if you can climb them to fix something, so a category defined solely by a polygenic score and drug response is ontologically secure because it carves nature at a joint that bleeds when cut. Mechanism is pursued not to validate the reality of the category but to extend leverage; knowing the why helps you find new drugs or predict side effects, but knowing the works is sufficient to license the diagnosis. This is why categories split when mechanisms are found: not because the old category was fake, but because it masked different intervention profiles, reducing the stability of the leverage.

  Regarding the stance mixing, the intentional or functional description is not merely handy shorthand; it is the only layer where "error" exists. Physics describes states, but medicine diagnoses failures, and you cannot identify a failure without positing a goal like homeostasis or survival. If you decided only physical-stance descriptions were real, the concept of disease would vanish, leaving only physical variation, and clinical reasoning would break because triage and treatment are normative judgments about what the system *ought* to be doing. The difference between "true" and "handy" collapses here because a functional description that reliably predicts intervention outcomes is mapping real causal constraints that physical descriptions render computationally inaccessible.
