      *   **Searle (We-Intentions):** Requires individual we-intentions in the minds of participants. If C lacks the we-intention (because she believes the goal is impossible, she can't intend it), the collective intentionality collapses for her. For A and B, they still have we-intentions, but since collective intentionality is primitive yet individual-in-head, C is no longer part of the "we." The joint action dissolves into parallel individual actions for C.
      *   **Bratman (Shared Cooperative Activity - SCA):** Requires mutual responsiveness, commitment to the joint activity, and commitment to mutual support. Crucially, it requires *common knowledge* (or at least mutual belief) of the intentions. If C believes the goal is impossible, she likely lacks the commitment to the *joint* end. Without meshing subplans and mutual belief, the SCA breaks down. C is merely coordinating, not sharing agency.
