answer: |-
  **Scenario**
  Three strangers, A, B, and C, spontaneously synchronize a slow, rhythmic clapping pattern in a public square, seeking only the shared flow. No words are exchanged. Mid-activity, C privately becomes convinced the rhythm is now mathematically impossible to maintain due to a subtle drift only she perceives. A and B notice nothing. C continues clapping to avoid disruption but internally treats the collective goal as unachievable. A and B remain fully committed to the shared rhythm. C feels no obligation to adjust, while A and B act as a unit. Does the joint action survive C's private withdrawal of belief?

  **Analysis**

  **(a) Verdicts**
  *   **Searle:** Joint action dissolves for C. She lacks the requisite *we-intention* (one cannot intend what one believes impossible). A and B can form a new dyadic we-intention, excluding C.
  *   **Bratman:** Shared Cooperative Activity (SCA) fails regarding C. She lacks commitment to the joint end and mutual belief is broken. A and B can establish a new SCA between themselves.
  *   **Gilbert:** The joint commitment persists. C remains obligated to the plural subject despite private doubt. A and B cannot legitimately form a new exclusive joint commitment without jointly rescinding the original with C.

  **(b) Structural Feature**
  The separation lies in the **locus of agency**: Searle and Bratman ground joint action in concurrent internal mental states (intentions/beliefs), whereas Gilbert grounds it in a normative bond created by mutual responsiveness that survives private psychological changes.

  **(c) Removing Non-Instrumentality**
  If the activity were instrumental (e.g., lifting a load), the separation blurs. Practical rationality dictates withdrawing from impossible instrumental goals. Gilbert's normative bond would clash with practical rationality, likely forcing convergence on withdrawal, whereas non-instrumental activities allow normative obligations to override private utility calculations.

  **(d) Assessment**
  Only **Gilbert** accommodates the claim. Her theory posits that joint commitments create obligations independent of current personal intentions. Searle and Bratman cannot accommodate this because their frameworks require the intention to be psychologically viable (believable) for the agent to participate in joint agency.
