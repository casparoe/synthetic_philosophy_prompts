answer: |-
  **Bottom line**

  Your colleague is mostly right: "original" tracks authorized history, not matter. But it is not metaphysics-free; it is a specific view called Historical Individualism. The inconsistency you see isn't philosophical confusion; it is a clash between valuing *information* (scans) and valuing *witness* (matter). Our practices presuppose that an object is a specific historical event extended through time, maintained by authorized interventions. The accession number is the legal tag for this continuity. We are not inconsistent about matter versus form; we are inconsistent about *purpose*. For insurance, the object is a financial asset. For repatriation, it is a relational ancestor. You do not need a new metaphysics, but you do need to stop pretending digital surrogates are "preservation of the object." They are preservation of data. Your verdict that we treat scans as the object is wrong; internally, we know they are surrogates. The rhetoric is external.

  **The implicit theory**

  The cluster of practices fits a theory called Historical Individualism. An object isn't its atoms; it is a spacetime path starting at a specific origin event (creation or excavation) and continuing through uninterrupted custody. When conservators replace a marble arm, they are extending that existing path, not starting a new one. The matter changes, but the history remains continuous. Conversely, a bronze cast from a mold has a new origin event (the casting), so it starts a new path, even if the form is identical. This explains the listed building versus replica distinction. The repaired building maintains its continuous occupation and legal designation; the demolished rebuild breaks the chain.

  However, your description of digital preservation needs correction. Internally, we know a scan is a surrogate, not the object. The rhetoric about "preserving the object digitally" is fundraising speak, not operational policy. Operationally, we never insure a scan as the object. So the inconsistency is less severe than you think. The real tension is between *continuity of custody* (museum standard) and *ritual continuity* (Ise Shrine). In Western museums, identity is tied to the specific material history. In Ise, identity is tied to the ritual practice. Both are consistent within their own frameworks.

  The accession number is the crucial tool here. It acts as the unique identifier for that historical path. The physical description in loan agreements is merely a verification check to ensure the number hasn't been swapped. We do not believe the description *makes* the object; we use it to confirm we have the right historical individual. The combination works because the number tracks the identity, while the description tracks the current state. If the state changes too much, such as total loss, the number is retired. This theory allows for material change without losing identity, provided the chain of authority remains unbroken.

  **What's strictly presupposed vs. what merely fits**

  What is strictly presupposed is the necessity of a continuous causal chain. We cannot accept that an object pops out of existence and returns later. This is why the "right history" view works, but only if "history" means "unbroken chain of existence," not just "provenance." A copy has a provenance, but it lacks the chain connecting it to the origin event. Your colleague's claim that this requires no metaphysics is incorrect. Claiming identity persists through material change *is* a metaphysical stance. However, it is a stable one. It does not require "two objects in one place." It requires distinguishing between *constitutive matter* (what it is made of now) and *historical identity* (what it is).

  What merely fits is the idea that we are flexible about matter versus form. We are not. We are rigid about the chain. Matter can change incrementally through conservation, but not wholly through replacement. Form can change slightly through wear, but not wholly through remaking. The loan agreement combination acknowledges this: the number tracks the identity, the description tracks the current state. If the state changes too much, for example, total loss, the number is retired. We do not need to assume two coinciding objects. We just need to agree on when the chain is broken. The practice does not need numerical identity in a philosophical sense, but it does need a functional equivalent for legal liability.

  **The hard cases**

  The Ise Shrine breaks the Western material continuity rule, but only superficially. There, the "object" is the shrine's function and site, not the timber. The ritual rebuilding *is* the preservation method. In your museum, the "object" is the historical witness. You cannot apply Ise logic to a Roman portrait because the portrait's value lies in being touched by Roman hands, not in looking like a Roman portrait. The Shrine persists through ritual; the portrait persists through material custody.

  The scan and print repatriation conflict is not metaphysical; it is ethical. When you offer a print, you are offering information. When a community asks for return, they are asking for the relational entity—the thing that holds memory, spirit, or legal sovereignty. Calling the print an "insult" is accurate because it category-errors the request. It assumes the community wants data; they want the witness. This isn't inconsistency in your theory of objects; it is a conflict in values. You value the object as an information source; they value it as a participant. You can maintain your Historical Individualism while acknowledging that for the source community, the "identity" of the object includes its relational status, which a print cannot fulfill. The scan preserves the form; it does not preserve the relationship.

  **If we switched theories**

  If you adopted strict materialism, where the object equals its atoms, conservation becomes destruction. Every fill creates a new object. You would have to deaccession restored items and accession them as "composites." Insurance would be impossible because the insured item changes daily. If you adopted strict communal definition, where whatever the community says persists, you risk legal chaos. If a community declares a 3D print is the ancestor, do you repatriate the print and keep the original? Your loan agreements would become unenforceable because identity would be fluid.

  Stick with Historical Individualism. But clarify policy: admit digital surrogates are not the object. Keep removed fragments as relic matter of the history. List replicas as distinct objects. Update loan agreements to state the accession number is the sole identifier of identity; the description is conditional. This solves the "when does restoration stop counting" issue: when the continuous chain of authorized intervention is broken or the original material falls below a threshold, such as fifty percent. This keeps your legal footing solid without pretending metaphysics doesn't matter.
