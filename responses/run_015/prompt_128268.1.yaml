pping point). Finally, say how a defender of the standard anti-aggregationist reading of Scanlon would attack the case: would they deny that the threshold creates any genuinely collective weight, insist that contractualist comparison must remain strictly pairwise, or argue that the victim’s complaint has been undervalued? Keep the scenario grounded in human-scale stakes, avoid exotic technology or neuroscience, and do not appeal to bibliographies or named commentators beyond Scanlon’s framework itself.
