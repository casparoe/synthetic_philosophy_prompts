answer: |-
  In a specialized hospital ward designed for post-operative recovery, a strict acoustic protocol maintains a decibel level below 40 dB to ensure patient healing, where exceeding this limit triggers an automatic regulatory shutdown that evacuates the ward and delays all recoveries by weeks. One patient, the Victim, requires a life-support machine that inherently operates at 45 dB; without it, they suffer severe respiratory distress, but with it, the ward's cumulative noise floor rises just enough to breach the 40 dB threshold because every other bed is occupied. The hospital administration must choose between two principles: Principle A permits the machine's use, imposing severe respiratory distress on the Victim but maintaining the ward's operational status for everyone else; Principle B bans the machine, sparing the Victim distress but causing the acoustic threshold to be met by the aggregate presence of the other patients, triggering the shutdown and imposing severe recovery delays on the entire group. Individually, the noise contribution of any single patient in the group is negligible and well below the threshold for complaint, but jointly, their presence creates the catastrophic shutdown condition.

  **Contractualist Analysis**
  The principle being evaluated is Principle B ("Ban the machine to preserve individual quiet"), which is challenged by the need to prevent the ward shutdown. The Victim's complaint against Principle A is direct and severe: they face immediate respiratory failure. The representative group member's complaint against Principle B is structurally complex: individually, they face only negligible noise, but under the threshold-crossing structure, their complaint transforms into a objection against the *systemic collapse* of the ward's healing environment. In standard Scanlonian analysis, we compare the strongest individual complaint against each principle. Here, the group members' complaints gain decisive weight not by summing minor harms, but because the threshold feature makes the *state of affairs* permitted by Principle B (the shutdown) a severe burden applicable to each member individually as a consequence of the collective condition. Each member can reasonably reject a principle that guarantees the ward's closure, as this destroys the background conditions of their care. The Victim's complaint, while severe, is against a burden that preserves the institution; the Group's complaint is against a burden that destroys it. Since a principle that renders the institution non-viable is rejectable by everyone (including the Victim, ex-ante), whereas a principle that burdens one patient is rejectable only by that patient, the framework requires imposing the severe burden on the Victim to prevent the distributed harm that triggers the collapse.

  **The Structural Feature**
  The work is done by the **cumulative threshold with individually sub-threshold harms**. This feature converts what would be negligible individual complaints into a complaint about a catastrophic collective outcome that falls on each individual. If this feature were removed—for instance, if the shutdown mechanism depended on a single patient exceeding the noise limit rather than the aggregate—then the group members would only face negligible noise. In that case, their complaints would remain sub-threshold, the Victim's severe respiratory distress would outweigh them, and contractualism would forbid imposing the burden on the Victim, reverting to the standard anti-aggregationist result.

  **The Standard Attack**
  A defender of the standard anti-aggregationist reading would attack this case by insisting that contractualist comparison must remain strictly **pairwise** between the Victim and a Representative Member, ignoring the collective outcome. They would argue that the shutdown is a contingent, systemic consequence rather than a direct burden imposed by the principle on the individual; therefore, the Representative Member's complaint should be weighed only as "minor noise irritation," not "ward closure." They would deny that the threshold creates any genuinely collective weight, arguing that the Victim's severe physical burden inevitably outweighs the member's minor acoustic inconvenience, and that treating the shutdown as an individual burden smuggles in utilitarian aggregation by counting the number of people affected by the closure to amplify the complaint's strength.
