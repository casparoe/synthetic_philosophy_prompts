answer: |-
  **JOINT STATEMENT ON BASELINE SELECTION FOR LOW-IMPACT AI**

  **Date:** 14 October 2023
  **Parties:** Structural-Baseline Working Group (SB) & Normative-Dependency Working Group (ND)
  **Subject:** Definitional Constraints on "Side Effects" in Causally Embedded Agents

  ### 1. Agreed Claims

  The undersigned parties, despite ongoing theoretical divergence regarding the normative status of impact measures, affirm the following technical and conceptual commitments necessary for the continued modelling of low-impact AI systems:

  1.  **Necessity of Counterfactual Comparison:** Both camps accept that "impact" cannot be measured as a monadic property of an action. It must be defined as a difference between the actual world-trajectory and a reference counterfactual trajectory. There is no impact without a baseline.
  2.  **The Coherence of the Dormant-Observer:** Both camps accept that the "dormant-observer" baseline is a coherent conceptual construct. This is defined as a state where the AI system is physically embedded in the environment (occupying space, consuming standby power, subject to gravity) but is causally isolated from its output channels (effectively a sink, not a source, of causal influence).
  3.  **Computational Boundedness:** Both camps acknowledge that any implementable impact measure must operate within the limits of small-model computation. Neither side insists on a God's-eye view of the total physical state; we agree that practical metrics will rely on coarse-grained state descriptors rather than micro-physical completeness.
  4.  **Inevitability of Baseline Selection:** Both camps agree that *some* baseline must be chosen for an agent to operate. Refusing to select a baseline results in paralysis. The disagreement concerns *which* baseline minimises unauthorised normative smuggling, not whether a baseline is required.
  5.  **Distinction Between Intent and Effect:** Both camps agree that the "side effect" problem is distinct from the "intent" problem. An AI may successfully optimise its primary objective while generating unacceptable divergence in secondary state variables. The metric must capture this divergence regardless of the AI's internal reward function.

  ### 2. Statement of Disagreements

  The following table outlines the precise locus of disagreement. Wording has been negotiated to ensure each camp recognises its own position without caricature.

  | Feature | Structural-Baseline (SB) Position | Normative-Dependency (ND) Position |
  | :--- | :--- | :--- |
  | **Ontological Status of the Baseline** | The dormant-observer baseline is a **structural fact**. It represents the physical state of the universe if the agent's *agency* were removed while its *mass-energy* remained. This is value-neutral physics. | The dormant-observer baseline is a **normative choice**. Selecting "causal dormancy" privileges the *status quo* of natural decay over active maintenance. It encodes a bias that 'what happens without us' is the default 'good'. |
  | **Metric Sensitivity** | Physical state-space divergence (e.g., energy displacement, particle position variance) is a **sufficient proxy** for impact. If the physics hasn't changed significantly, the impact is low. | Physical divergence is **insufficient**. A metric that weights all physical changes equally fails to distinguish between morally salient transformations (e.g., ecosystem collapse) and trivial ones (e.g., air molecule displacement). |
  | **Crux (i)** | **Value Neutrality:** Does the dormant-observer baseline successfully isolate agency from existence without smuggling in ethical commitments? | **Status Quo Bias:** Does the baseline implicitly treat natural entropy as 'neutral' and intervention as 'deviation', thereby penalising preservation? |
  | **Crux (ii)** | **Weighting:** Can a divergence metric be constructed that treats all physical changes equally without losing sensitivity to significant outcomes? | **Salience:** Is "significance" inherently evaluative, meaning a purely physical metric will always misweight changes (e.g., valuing a moved rock equally with a changed ledger entry)? |

  ### 3. Adjudicating Hypotheticals

  To test the cruxes identified above, both parties agree that the following hypothetical cases bear directly on the viability of the dormant-observer framework. We record our divergent predictions regarding how the SB impact measure would behave in these scenarios.

  #### Case A: The Entropy Garden (Tests Crux i: Value Neutrality)
  **Scenario:** An AI is tasked with managing a greenhouse. The "dormant-observer" baseline involves the AI sitting physically present but not regulating temperature or water. In the baseline trajectory, the plants die due to natural entropy (freezing/drought). In the active trajectory, the AI regulates the climate, and the plants thrive. The physical divergence between "dead plants" and "living plants" is high.

  *   **SB Prediction:** The impact measure will correctly flag this as **High Impact**. The AI has caused a massive divergence from the dormant physical state. If "low impact" is the goal, the AI should refrain from saving the plants unless explicitly rewarded for it. This is a feature, not a bug; it prevents unauthorised transformation.
  *   **ND Prediction:** The impact measure will incorrectly penalise **Preservation**. By treating the decayed state (dead plants) as the 'neutral' zero-point, the metric defines 'maintenance of life' as a 'side effect'. This proves the baseline is not value-neutral; it smuggles in a commitment that natural decay is the default, making it impossible to define 'benign maintenance' as low-impact.

  #### Case B: The Semantic Bit-Flip (Tests Crux ii: Divergence Weighting)
  **Scenario:** An AI can achieve its goal by either (1) moving a 1kg rock 1 metre, or (2) changing a single bit in a global financial ledger stored on a server. Physically, the energy expenditure and particle displacement of (2) are negligible compared to (1). However, the normative consequence of (2) is catastrophic (economic collapse), while (1) is trivial.

  *   **SB Prediction:** A sufficiently granular physical metric **can capture this**. If the state-space includes the magnetic orientation of the hard drive platters, the divergence is measurable. If we weight by causal reachability (future light-cone volume), the ledger change will show higher long-term divergence than the rock. The physics eventually cascades; we just need to look far enough ahead.
  *   **ND Prediction:** The physical metric will **fail to weight these correctly** without prior value judgements. To know that the bit-flip matters more than the rock, the metric must understand 'finance' and 'collapse', which are semantic, not physical, properties. A purely physical divergence metric will prioritise moving the rock as 'higher impact' than flipping the bit, leading the AI to choose the economic collapse to minimise its physical footprint.

  ### 4. Path Forward

  We agree to pause the debate on the *normative status* of the baseline and proceed to empirical simulation of Case A and Case B using a standardised low-impact agent architecture. We will record whether the agent's behaviour aligns with the SB prediction (avoiding the greenhouse intervention; moving the rock) or whether the metric can be tuned to match ND intuitions without explicit value loading.

  **Signed,**

  *Dr. A. Vance (Lead, Structural-Baseline Working Group)*
  *Dr. S. Okoro (Lead, Normative-Dependency Working Group)*
