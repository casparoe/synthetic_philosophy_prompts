answer: |-
  This is a sophisticated reading of Bentham's unpublished sexual manuscripts (principally *Offences Against One's Self* and the later fragments on "Sexual Irregularities"). You are correct that Bentham anticipates the modern liberal position by over a century: he dismantles the religious, natural law, and populist arguments against non-procreative sex, grounding liberty strictly in the felicific calculus.

  However, you have identified the exact pressure points where a rigorous utilitarianism strains against its own conclusions. A sympathetic critic doesn't need to appeal to natural rights or divine law to trouble Bentham; they only need to push harder on the internal logic of pain, pleasure, and security.

  Here is the ranking of these defeaters from **Fatal** (threatens the coherence of the system) to **Merely Awkward** (requires qualification but doesn't break the model), followed by an analysis of the "unfalsifiability" charge.

  ---

  ### 1. The "Disgust as Pain" Paradox (Rank: Fatal/Serious)
  **The Problem:** You identified this correctly. Bentham's axiom is "pain is bad." If a majority of the population feels genuine, visceral distress (disgust, anxiety, moral shock) at the sight or knowledge of homosexual acts, that distress *is* a pain in the utilitarian ledger. If the sum of the community's disgust-pain outweighs the pleasure of the minority engaging in the act, the calculus seems to license suppression.

  **The Benthamite Defense:**
  Bentham tries to solve this by distinguishing between **real pains** and **prejudicial pains**. He argues that the pain of disgust is based on a false belief (that the act is harmful/unnatural). Therefore, the remedy is not to ban the act (which causes real pain to the actor) but to educate the observer (which removes the false belief causing the pain). He also leans heavily on **Security and Expectation**. The pain of having one's liberty violated (fear of prosecution, loss of reputation) is a more constant, "security-undermining" pain than the intermittent pain of someone else's disgust.

  **The Defeater:**
  This is the most dangerous internal contradiction. To make it work, Bentham must assert that *some pains count less than others* because of their etiology (i.e., "your pain is based on prejudice, so I will discount it").
  *   **Why it's fatal:** This smuggles in a non-utilitarian value judgment. If pain is the sovereign master, *why* does the origin of the pain matter? If a racist feels pain at seeing an interracial couple, Bentham must say that pain doesn't count toward the ban. But on what utilitarian ground? Only by asserting a prior principle of liberty that trumps the calculus.
  *   **Concession:** A committed Benthamite must concede that you cannot solve this purely mathematically. You have to introduce a **Rule-Utilitarian** constraint: "A rule that allows majorities to ban acts based on disgust produces more long-term pain (tyranny, instability) than a rule that ignores disgust."
  *   **Verdict:** If Bentham stays an Act-Utilitarian here, he loses. He must retreat to Rule-Utilitarianism to save the argument.

  ### 2. The Consent Boundary & Capacity (Rank: Serious)
  **The Problem:** In a purely hedonic framework, "consent" is not a moral magic wand; it is a proxy for "likely net pleasure." If a child or an animal derives immediate pleasure from a sexual act, and we assume (counterfactually) no immediate physical pain, where is the utilitarian disutility?
  Bentham does argue against acts with those lacking capacity, but he grounds it in **harm**, not **rights**.

  **The Benthamite Defense:**
  The argument rests on **future pain** and **power asymmetry**.
  1.  **Developmental Harm:** Sexual acts with children cause long-term psychological damage (future pain), outweighing short-term pleasure.
  2.  **Coercion:** Children/animals cannot negotiate terms. The power imbalance makes "voluntary" participation impossible, leading to hidden pain/fear.
  3.  **Epistemic Humility:** We cannot know if the child is truly consenting, so the risk of pain dictates a prohibition.

  **The Defeater:**
  This relies entirely on empirical claims about harm.
  *   **Why it's serious:** If empirical psychology were to demonstrate that certain non-abusive sexual interactions with minors caused *no* long-term harm (a contentious and often disclaimed claim, but philosophically possible in a thought experiment), the strict utilitarian barrier would lower. Bentham is forced to "smuggle in" a concept of autonomy that functions like a right. He treats incapacity as a bright line, but his system suggests it should be a sliding scale of competence.
  *   **Concession:** A Benthamite would concede that the boundary is fuzzy. They would argue that bright-line rules (age of consent) are necessary heuristics to prevent the greater pain of abuse, even if they occasionally forbid harmless acts.
  *   **Verdict:** Not fatal, but it reveals that Utilitarianism needs a robust theory of **paternalism** to protect the vulnerable, which can easily slide into authoritarianism if the "harm" assessment is wrong.

  ### 3. The "Pure Pleasure" Claim (Jealousy, Disease, etc.) (Rank: Awkward)
  **The Problem:** You ask if sexual pleasure is truly "pure." Bentham treats side effects (jealousy, unwanted pregnancy, disease) as contingent, not intrinsic. He argues these can be mitigated by contraception, discretion, and education.

  **The Benthamite Defense:**
  These are **externalities**, not intrinsic evils. Just as eating causes indigestion but we don't ban eating, sexual side effects should be managed, not the act prohibited. Bentham explicitly notes that non-procreative sex is *socially useful* because it decouples pleasure from the burden of unsupported children.

  **The Defeater:**
  *   **Why it's merely awkward:** Human psychology is not easily engineered. Jealousy and attachment are deep-seated. A utilitarian might argue that the *institution* of monogamy produces more net security/pleasure than sexual liberty, even if specific acts of infidelity produce pleasure.
  *   **Concession:** Bentham would dismiss the idea that jealousy justifies prohibition, but he would accept it justifies **regulation** (social norms, contracts).
  *   **Verdict:** This doesn't break the system; it just means the "liberty" argument depends on a society capable of managing emotional externalities.

  ### 4. The Population Argument (Rank: Merely Awkward)
  **The Problem:** Bentham argues non-procreative sex is good because it doesn't add "mouths to feed."
  *   **Why it's awkward:** Taken seriously, this doesn't just defend gay sex; it potentially justifies **mandatory contraception** or even **sterilization** for the poor to maximize aggregate welfare. It turns sex into a demographic tool.
  *   **The Defeater:** It risks instrumentalizing sex too heavily. If the goal is population control, does the state have an interest in *promoting* non-procreative sex over procreative sex?
  *   **Concession:** A Benthamite would likely bite the bullet here but argue that state coercion creates more pain (loss of liberty) than it saves in resources.
  *   **Verdict:** Consistent, but leads to conclusions (state interest in reproduction) that modern liberals find uncomfortable, even if they don't logically break the system.

  ---

  ### On Unfalsifiability and the "Consensual Adult" Retreat

  You ask if retreating to **"private, consensual, adult"** renders the position unfalsifiable.

  **Is it Unfalsifiable?**
  Technically, no. It is falsifiable if you can demonstrate that a specific "private, consensual, adult" act produces net pain (e.g., spreads a deadly disease, undermines a necessary social institution like marriage which provides welfare).
  However, functionally, it often *acts* like an unfalsifiable dogma because the Benthamite moves the goalposts of "harm." If an act causes disgust, they say "that's prejudice, not harm." If it causes jealousy, they say "that's mismanagement, not inherent harm."

  **Is this a Problem?**
  For a pure Act-Utilitarian, yes, it's a problem. It suggests the theory is being protected from refutation by ad-hoc adjustments.
  For a **Rule-Utilitarian** (which is where Bentham inevitably ends up on social issues), it is **not a problem; it is a feature.**
  *   The "private, consensual, adult" clause is a **heuristic rule**.
  *   Experience shows that banning such acts *always* creates more pain (persecution, black markets, psychological damage) than allowing them.
  *   Therefore, we adopt a rule that treats this sphere as immune to interference.

  **The Honest Assessment:**
  Bentham's position on sexual liberty is not derived *solely* from the raw calculus of individual acts. It is derived from a **secondary calculation about the legal system.**
  He argues that the *law* is a blunt instrument. Using the law to police private sex creates more "mischief" (pain) than the sex itself.
  *   **What a Benthamite Concedes:** They must concede that if a specific sexual act *clearly* caused catastrophic public harm (e.g., a plague vector), the liberty claim evaporates. The right is not intrinsic; it is contingent on the absence of harm.
  *   **What They Dismiss:** They dismiss the idea that "moral harm" or "social fabric damage" (absent concrete pain) counts. They view appeals to tradition or sanctity as "fictitious entities."

  ### Summary Verdict

  1.  **Fatal/Serious:** The **Disgust/Pain Paradox**. Bentham cannot solve this without implicitly valuing "rational" pleasure over "prejudicial" pain, which undermines the idea that all pain is commensurable. He solves this by shifting to Rule-Utilitarianism (banning based on disgust creates worse rules).
  2.  **Serious:** The **Consent Boundary**. Without smuggling in a deontological concept of autonomy, the protection of children rests on empirical claims about harm that could theoretically be disproven.
  3.  **Awkward:** **Side Effects & Population**. These are manageable via mitigation and do not threaten the core argument for liberty, though they do imply a state interest in sexual behavior that is technocratic rather than moral.

  **Final Word:**
  The position is not unfalsifiable, but it is **stable only at the level of Rules, not Acts.** If you judge every sexual act by its immediate hedonic output, Bentham's defense of liberty collapses under the weight of majority disgust or potential long-term risks. His argument holds only if you calculate the pain of **having a legal system that polices sex** versus the pain of **the sex itself**.
  Once you make that shift, the "private, consensual, adult" boundary isn't a retreat; it's the recognition that the cost of enforcement exceeds the cost of the "vice." That is a robust, falsifiable claim (one could imagine a society where enforcement is cheap and effective), but historically, Bentham has been vindicated: the pain of persecution has consistently outweighed the pain of the acts prohibited.
