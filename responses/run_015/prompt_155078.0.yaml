  **Ontic Continuity Corp. | Customer Support Hub**
  **Product: QC-500 Home Continuity Kit**

  **1. What is the difference between the Branch-Count and Amplitude-Weighted service tiers?**
  The Premium Branch-Count Plan ensures that following a standard fifty-trial session, there exists at least one branch in the multiverse where your biological functions remain intact. This plan prioritizes existential certainty over statistical weighting. The Standard Amplitude-Weighted Plan optimizes for high-measure outcomes, aligning your survival probability with conventional Born-rule expectations.

  *Terms of Service Addendum 4.1:* While the Branch-Count Plan guarantees existence in a survival branch, rational agents are advised to track squared-amplitude measure when calculating expected utility. Existence in a low-measure branch may not support robust subjective continuity. Consequently, the Standard Plan is recommended for customers intending to remain in high-probability macrostates.

  **2. If branching occurs during ordinary risks (e.g., traffic accidents), why purchase a dedicated device?**
  Natural hazards induce branching across uncontrolled bases, often resulting in survival branches where cognitive continuity is compromised by thermal decoherence or neurological damage. The QC-500 isolates the measurement basis to a clean binary split. This ensures that the surviving copy retains full memory integrity and cognitive function, rather than persisting in a fragmented state common to uncontrolled environmental interactions. You are not purchasing survival; you are purchasing coherence.

  **3. The manual mentions a "coherence restoration" window. What happens if I miss it?**
  To maintain superposition between the 'terminated' and 'intact' states during the measurement event, the kit requires a coherence restoration pulse every trial. This creates a firmware-mandated latency window of approximately 40 milliseconds. Users may experience a brief subjective gap or auditory pop between trials. This is a standard calibration artifact and does not indicate data loss or consciousness interruption. Please ensure the device is placed on a non-conductive surface during this window to prevent premature environmental entanglement.

  **4. Why are all the customer reviews five stars?**
  Our review system is accessible only from verified user accounts. Since accounts associated with terminated branches cannot submit data, the visible feedback pool consists exclusively of users in survival branches. This provides a consistent record of successful continuity verification.

  *Featured Review:* "I ran the full fifty-trial sequence yesterday. I am writing this review from a branch where the gun did not fire a single time. The device works exactly as promised: I am still here to tell you that it works. 5/5." — Verified Purchaser, Branch ID #8821

  **5. How does the Death Benefit payout work if I survive?**
  The Continuity Insurance Policy disburses funds to your designated beneficiaries in branches where the termination outcome occurs. As the claimant in the survival branch, you are legally distinct from the deceased entity in the terminated branch. Therefore, you cannot claim the benefit personally.

  *Note on Inter-Branch Ethics:* While you may feel empathy for beneficiaries in terminated branches, Ontic Continuity Corp. maintains that causal contact between branches is impossible. Whether you 'care' about those branches is a philosophical preference, not a contractual obligation. The payout is processed automatically in those sectors; you will not be notified of successful disbursements.

  **6. What do you say to critics who claim the Branch-Count Plan is misleading?**
  We take all theoretical objections seriously. Dr. Aris Thorne, former lead theorist at the Institute for Quantum Foundations, recently stated: "Selling branch-count survival is dishonest. As the trials proceed, the measure of the survival branch drops exponentially. You become a ghost in your own universe."

  Our response is technically precise: While the measure decreases, the branch count remains non-zero. Existence is not contingent on measure magnitude. You will always find yourself in a branch where you exist, regardless of how thin that branch becomes relative to the whole.

  **7. Does Ontic Continuity Corp. take a position on wavefunction collapse?**
  Our products are compatible with all unitary interpretations of quantum mechanics. We do not validate or invalidate specific models of state reduction. The QC-500 functions by preparing a specific entangled state; the subjective experience of the user depends on their preferred interpretation of that state's evolution. We recommend consulting the user manual for safety warnings applicable to both collapse and no-collapse scenarios.
