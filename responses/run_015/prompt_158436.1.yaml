answer: |-
  Elias writes a letter to Mara, a stranger he will never meet, stating "I promise to place a white stone on the northern cairn tomorrow," then seals it in a box buried beneath his floorboards, ensuring Mara and everyone else remain permanently unaware of the utterance. His community recognizes only public vows as binding, treating private written resolutions addressed to others as mere expressive diaries that create no social expectations or duties. If Elias fails to place the stone, Mara suffers no loss or disappointment since she never expected it, no social sanction occurs since no one knows, and no institutional rule is violated given the local convention treats such sealed letters as non-binding musings.

  (i) **Reliance and Social-Practice Accounts:** Both deny an obligation exists here. The reliance account (e.g., Fried, Shiffrin's critique of it) holds that obligations arise from induced expectations; since Mara is unaware, she could not rely on Elias. The social-practice account (e.g., Rawls, Hume) holds that obligations stem from constitutive conventions; since the community treats this act as a non-binding diary entry, the practice required to generate a duty is absent.

  (ii) **Normative-Powers Account:** This view (e.g., Owens, Shiffrin) asserts Elias owes performance because promising is an exercise of a moral power to alter one's own normative position. By intentionally invoking the concept of "promise," Elias voluntarily surrendered his discretion over the action, creating a duty grounded in his own agency rather than external consequences or recognition.

  (iii) **Precise Structural Feature:** The obligation arises from the **intentional invocation of the normative power to self-obligate**. It is the illocutionary act of committing one's will to another's claim, which transfers authority over the action from the promisor to the promisee, regardless of whether that claim is ever asserted.

  (iv) **Removal of Feature:** If this feature is removed—for instance, if Elias writes "I intend to place a stone" without invoking the binding force of a promise—he retains the discretion to change his mind. Without the intentional exercise of the power to bind, the act reverts to a mere resolution or prediction, generating no obligation.

  (v) **Reliance Defender's Attack:** A defender of the reliance view would argue the scenario is illegitimately rigged by misusing the concept of "promise." They would contend that communication intended to induce reliance is a constitutive condition of promising; therefore, an uncommunicated commitment is not a promise at all, but a resolution, meaning the scenario begs the question by stipulating a duty exists where the linguistic conditions for creating one are absent.
