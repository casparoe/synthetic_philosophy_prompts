      *   *Refining for "No Harm":* The action must be morally neutral or supererogatory normally, but made obligatory by the promise.
      *   *Draft:* Consider Elias, who writes a sealed letter to a stranger, Mara, whom he will never meet, promising to plant a specific rare flower in a public park where she will never walk. He seals the letter in a box buried deep in his garden, ensuring Mara never learns of the vow, nor does anyone else. His community views such private writings as mere diaries, not binding contracts, and holds no social norm that uncommunicated resolutions create duties. If Elias fails to plant the flower, Mara never knows, suffers no disappointment, loses no benefit she expected, and Elias's reputation remains untouched since no one knows he vowed it.

