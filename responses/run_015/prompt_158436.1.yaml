      *   (iii) *Structural Feature:* The *intentional invocation of a normative power* (the illocutionary act of committing oneself). The agent's will to be bound.
      *   (iv) *Removal:* If the feature (intent to obligate) is removed (e.g., it was just a wish or resolution), no obligation exists. It becomes mere preference.
