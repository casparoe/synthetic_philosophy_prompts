  1.  **Analyze the Request:**
      *   **Task:** Settle an argument about an A/B test result showing Simpson's Paradox.
      *   **Scenario:**
          *   Treatment (Feature): 1000 users, 470 passed (47%).
          *   Control (No Feature): 1000 users, 440 passed (44%).
          *   Overall: Treatment wins (+3%).
          *   Stratified by Onboarding Completion (post-treatment variable):
              *   Completers: Treatment (800 users, 55% pass) vs Control (600 users, 60% pass). Control wins (-5%).
              *   Non-Completers: Treatment (200 users, 15% pass) vs Control (400 users, 20% pass). Control wins (-5%).
          *   Paradox: Treatment wins overall, loses in both subgroups.
      *   **User's Stance:** Believes the disaggregated table is always the honest one when reversal appears ("the finer the breakdown the safer the inference"). Wants to know if this rule is mistaken.
      *   **Colleague's Stance:** Wants to roll back the feature based on the stratified results.
      *   **Constraints:**
          *   British English.
          *   Single JSON object.
          *   Specific fields: "false_presupposition", "stratifier_role", "what_each_comparison_estimates", "why_reversal_arises", "recommendation", "when_to_stratify".
          *   No causal-inference formalism (diagrams in words).
          *   Keep it concise (one sentence per field where specified).

  2.  **Analyze the Causal Structure:**
      *   **Randomisation:** Happened at sign-up (Treatment assignment $A$).
      *   **Onboarding Completion:** Recorded *after* the feature is switched on ($M$).
      *   **Outcome:** Exam pass ($Y$).
      *   **Structure:** $A \rightarrow M \rightarrow Y$ and $A \rightarrow Y$.
      *   **Variable Type:** Onboarding completion is a *mediator* (or post-treatment variable), not a pre-treatment confounder.
      *   **Simpson's Paradox Mechanism:** The treatment affects the likelihood of completing onboarding.
          *   Treatment: 800/1000 completed (80%).
          *   Control: 600/1000 completed (60%).
          *   The treatment *increases* completion.
          *   Completers have much higher pass rates (55-60%) than non-completers (15-20%).
          *   Because the treatment shifts more people into the high-success group (completers), the overall average goes up, even if the treatment slightly harms performance within each group.
      *   **Causal Question:** Do we want the *Total Effect* (does giving the feature improve pass rates overall?) or the *Direct Effect* (does the feature improve pass rates holding onboarding constant?)?
      *   **Decision Context:** "Ship or roll back". Usually, product decisions care about the Total Effect (what happens when we turn this on for users?). If the feature encourages onboarding which leads to passes, that's a win, even if the feature itself doesn't directly teach better than the control within strata.
      *   **User's Rule:** "when a reversal like this appears the disaggregated table is the honest one... the finer the breakdown the safer the inference".
      *   **Correction:** This is false when the stratifier is a mediator (post-treatment). Stratifying on a mediator blocks the indirect path and can induce bias (collider bias if there are other factors, but primarily it estimates the direct effect, not the total effect). In this case, the aggregate table estimates the Total Effect (what matters for deployment), while the stratified table estimates the Controlled Direct Effect (which ignores the benefit of increased completion).

