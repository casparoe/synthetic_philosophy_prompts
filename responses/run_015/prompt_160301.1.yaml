answer: |-
  This is a remarkably coherent set of intuitions. You aren't inconsistent; you are just operating with a more complex ethical framework than the standard "civic duty vs. rational ignorance" debate allows.

  Your gut is distinguishing between **voting as a consumer preference**, **voting as a civic duty**, and **voting as a fiduciary act**.

  Here is a principle (actually a triad of principles) that reconciles almost all of your verdicts without forcing you to drop 1 or 2.

  ### The Principle: Stewardship of Agency

  Your intuitions align with the view that a vote is not property you own, but a **trust you hold**. You are a steward of three things:
  1.  **Your own agency** (you must own the decision).
  2.  **The integrity of the process** (you must not treat the mechanism as a commodity).
  3.  **The community's welfare** (proportional to the stakes and closeness of the community).

  Here is how this triad resolves your tensions.

  #### 1. Resolving 1 vs. 2 (Abstention vs. Negligence)
  *   **Your Verdict:** 1 (Skipped safe seat) is Fine; 2 (Friend didn't register) is Not Fine.
  *   **The Principle:** **Diligence of Membership.**
      *   In Scenario 1, you engaged your agency. You assessed the landscape, determined there was no moral distinction, and *chose* abstention. That is a valid use of stewardship.
      *   In Scenario 2, your friend failed the **Duty of Diligence**. Registration is the administrative maintenance required to keep the channel open. Failing to register is like failing to show up for a shift you signed up for, even if the shop was empty that day. It signals a disrespect for the *institution*, whereas Scenario 1 signals a judgment on the *candidates*.
      *   **Rule:** You have a duty to be *capable* of voting (registration), but not a duty to *cast* a vote if there is no moral content to cast.

  #### 2. Resolving 6 vs. 7 (Pairing vs. Selling)
  *   **Your Verdict:** 6 (Pairing) is Fine; 7 (Selling) is Not Fine.
  *   **The Principle:** **Inalienability of Motive.**
      *   In Scenario 6, you are trading *geography*, not *intent*. Both you and the stranger are voting for a candidate you genuinely prefer. You are cooperating to maximize **political efficacy**. The vote remains an expression of political will.
      *   In Scenario 7, you are introducing a **market incentive**. Even if the vote matches your preference, you have established a precedent that the vote is *sellable*. You have detached the act from civic duty and attached it to private material gain. It corrupts the *nature* of the act, even if the outcome is identical.
      *   **Rule:** You may coordinate to amplify political will (6), but you may not commodify the act of voting itself (7).

  #### 3. Resolving 4 vs. 5 (Protest Vote: Local vs. National)
  *   **Your Verdict:** 4 (Local safe) is Fine; 5 (National swing) is Not Fine.
  *   **The Principle:** **Proportionality of Harm.**
      *   Voting is partly expressive. In Scenario 4, the "cost" of your expression is near zero (no chance of affecting the bad outcome).
      *   In Scenario 5, the "cost" is the potential installation of a dangerous candidate. Your right to express purity is outweighed by the **Duty to Prevent Harm**.
      *   **Rule:** Expressive voting is permissible only when the risk of negative externalities is negligible.

  #### 4. Resolving 9 (Co-op Selfishness)
  *   **Your Verdict:** Not Fine.
  *   **The Principle:** **Scale of Community.**
      *   In a national election, the system is designed to aggregate competing self-interests. Voting for your interest is expected.
      *   In a housing co-op, you are in a **direct governance** relationship with your neighbors. You are not selecting a representative; you *are* the government. Voting for a outcome that harms the majority to benefit yourself is a breach of fiduciary duty to the collective.
      *   **Rule:** The smaller and more direct the community, the higher the duty to vote for the common good over self-interest.

  #### 5. Resolving 10 (Grandma's Ballot)
  *   **Your Verdict:** Not Fine.
  *   **The Principle:** **Sovereignty of the Voter.**
      *   You violated her agency. Assisting is administrative; deciding is sovereign.
      *   **Rule:** You may facilitate the act, never the decision.

  ---

  ### The Unresolved Case: Scenario 11 (None-of-the-Above)

  **The Case:** A formal "Reject All" option exists. If it wins, a new election is triggered. You want to vote it, but worry about paralysis.

  **The Verdict:** **Fine.**

  **Why:** This falls under **Duty of Integrity**. If the system provides a "safety valve," using it is not "doing nothing"; it is using the tool provided to signal system failure.
  *   **The Collective Action Worry:** You noted, "If everyone reasoned like that the city would never settle anything."
  *   **The Counter:** If *everyone* votes None-of-the-Above, that is valuable data. It means the candidate selection process is broken. Paralysis is a feature, not a bug, in this specific context—it forces the elites to produce better candidates.
  *   **Caveat:** This is only "Fine" because the mechanism is *institutionalized*. If you wrote "None" on a standard ballot, it's a spoiled vote (noise). If you check the official box, it's a signal (data). As long as you accept the risk of delay, this is a valid stewardship of your vote to demand better representation.

  ---

  ### The New Scenario: The Employer Staff Vote

  **The Case:** Staff vote on policy. Non-binding. Management ignores result if turnout < 60%.
  **Question:** Do you vote?

  **The Verdict:** **You have a duty to participate (cast a ballot), even if you abstain on the policy.**

  **Why:** This is a **Quorum Duty**, similar to Scenario 2 (Registration).
  *   Management has set a legitimacy threshold (60%).
  *   If you do not vote, you are actively contributing to the invalidation of the process.
  *   Unlike the national election (where your single vote rarely decides the quorum), in a staff vote, every percentage point counts toward the threshold.
  *   **Application of Principle:**
      *   If you care about the policy: Vote Yes/No.
      *   If you don't care about the policy but value staff voice: Vote (even blank/abstain) to help hit the 60% threshold.
      *   If you vote "None" or don't show up, you are failing the **Duty of Membership** to the staff body. You are allowing management to claim the staff was indifferent.

  **Exception:** The only time it is "Not Fine" to vote here is if you *want* the process to fail (e.g., you think the vote is a sham and want to expose that by keeping turnout low). But if you want the mechanism to exist, you must feed it.

  ### Summary of Your "Code"

  You don't need to drop 1 or 2. They are consistent under this framework:

  1.  **Maintain the Channel:** Always register, always show up to validate quorums (Scenarios 2, Employer).
  2.  **Own the Decision:** Never sell, never let others decide (Scenarios 7, 10).
  3.  **Weigh the Stakes:** Expressive voting is allowed only when it doesn't risk catastrophic harm (Scenarios 4 vs 5).
  4.  **Respect the Scale:** In small communities, vote for the common good; in large ones, vote your conscience (Scenario 9).
  5.  **Use the Tools:** If the system offers a "Reject" button, using it is valid feedback (Scenario 11).

  Your tentative rule was: *"Vote unless your vote can't matter and abstaining doesn't express anything bad about you."*

  **The Upgrade:** *"Maintain your capacity to vote and the integrity of the process always. Cast a vote based on preference unless the risk of harm to others outweighs your expressive right."*

  This keeps your intuition on 1 (no preference = no duty to cast) but tightens it on 2 (capacity = duty to maintain). It explains why 7 is wrong (integrity violation) and 9 is wrong (scale/harm violation). It's a robust, defensible ethic.
