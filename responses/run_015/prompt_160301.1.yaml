      *   5. Small party national (swing/dangerous): *Not Fine.* (Consequentialist: risk of bad outcome. "Indulgence").
      *   6. Vote pairing: *Fine.* (Consequentialist: maximizes impact. Cooperative).
      *   7. Selling vote (same preference): *Not Fine.* (Deontological: commodification of civic duty. Corruption of the *act* itself).
      *   8. Dual citizen (expat voting): *Mixed.* (Stakeholder theory: ties vs. consequences).
      *   9. Co-op vote (selfish): *Not Fine.* (Fiduciary/Community duty: voting for common good vs. self-interest in small community).
      *   10. Grandma's ballot (influencing): *Not Fine.* (Agency/Autonomy: undermining the voter's will).
      *   11. None-of-the-above (plurality triggers new election): *Unsure.* (Collective action problem: individual expression vs. systemic paralysis).

  3.  **Identify Underlying Tensions:**
      *   **Consequentialism vs. Deontology/Virtue:** 1 & 2 have same consequences, different verdicts. 6 & 7 have similar consequences (vote trades for benefit), different verdicts.
      *   **Individual Agency vs. Collective Good:** 11 (protest vote) vs. 5 (wasted vote risking danger). 9 (selfishness in small group).
      *   **The Nature of the Vote:** Is it a preference signal? A duty? A property right? A trust?

  4.  **Drafting a Unifying Principle:**
      *   The user's current rule focuses on *impact* and *expression*. It fails on *integrity of the process*.
      *   Scenario 7 (selling) is the key. It's wrong not because of the outcome, but because it treats the vote as *property* rather than *trust*.
      *   Scenario 2 (sloppiness) is wrong because it treats registration as optional admin rather than a commitment to the process.
      *   Scenario 10 (Grandma) is wrong because it violates the *agency* of the voter.
      *   Scenario 9 (Co-op) is wrong because in small, direct-democracy communities, voting is about *shared governance*, not aggregate preference aggregation like in a nation.
      *   *Hypothesis:* The principle is **"Stewardship of Agency."** Voting is a delegated power. You are a steward of your own agency (don't sell it, don't let others hijack it) and a participant in a shared system (don't undermine the system's ability to function, don't ignore duties of membership).

      *   *Refining the Principle:* Let's try **"Civic Integrity and Stakeholder Responsibility."**
          1.  **Integrity of the Act:** The vote must remain an expression of *your* judgment (rules out 7, 10). It cannot be commodified or hijacked.
          2.  **Responsibility to the System:** You have a duty to maintain the system's functionality (rules out 5 in dangerous times, maybe 11 if it breaks the system). But you also have a right to abstain if the system offers no meaningful choice (allows 1).
          3.  **Proportionality of Stakes:** The stricter the duty, the higher the impact on others (rules out 5, allows 4).
          4.  **Membership Duties:** Being part of a group implies a duty of care to that group (rules out 2's sloppiness, 9's selfishness, 8's expat ambiguity).

      *   *Better Synthesis:* **"The Vote as a Fiduciary Act."**
          *   You hold the vote in trust for your own interests *and* the integrity of the system.
          *   You cannot alienate it (sell it - #7).
          *   You cannot delegate the *decision* (Grandma - #10).
          *   You must exercise due care in your membership (Registration - #2).
          *   You must weigh the harm to the collective against your expressive rights (Small party swing - #5 vs #4).
          *   In small communities, the duty to the collective is higher (Co-op - #9).

  5.  **Addressing Specific Tensions:**
      *   **1 vs 2:** 1 is a *conscious choice* within the system (abstention). 2 is *negligence* of the system (registration). Principle: **Diligence vs. Discretion.** You have a duty to be *ready* to vote (2), but not a duty to vote if there is no moral distinction (1).
      *   **6 vs 7:** 6 is **solidarity** (trading to maximize shared values). 7 is **commodification** (trading for private gain unrelated to civic good). Principle: **Alignment of Interest.** Vote pairing aligns civic interests; selling vote disconnects the vote from civic interest.
      *   **11 (None-of-the-above):** If the mechanism exists *in the rules*, using it is valid expression. If it breaks the system, it's irresponsible. Since the city *piloted* it, using it is **Fine**, provided you accept the risk of paralysis. It's a "safety valve" vote.

  6.  **Addressing the New Scenario (Employer Vote):**
      *   Non-binding, but has a turnout threshold (60%).
      *   If you don't vote, you risk the threshold not being met, which management uses to disregard *everyone's* input.
      *   This is a **Participation Duty.** Similar to Scenario 2 (registration). The act of showing up validates the process.
      *   Verdict: You should vote (even if abstaining/blank) to help meet the threshold, *unless* you actively want the process to fail. If you want the process to count, you must participate to validate the quorum.

  7.  **Structuring the Response:**
      *   **Acknowledge the complexity:** Validate that these intuitions are sophisticated, not random.
      *   **Propose the Principle:** "The Vote as a Fiduciary Trust." (Or similar). Let's go with **"Stewardship of Civic Agency."**
      *   **Break down the three pillars:**
          1.  **Inalienability:** You can't sell or surrender the *decision* (Covers 7, 10).
          2.  **Diligence of Membership:** You must maintain your standing in the group (Covers 2, 8, 9).
          3.  **Proportional Harm:** Expressive rights yield to consequential harm in high-stakes/low-margin scenarios (Covers 4 vs 5, 1 vs 3).
      *   **Resolve the Tensions:**
          *   1 vs 2 (Discretion vs. Negligence).
          *   6 vs 7 (Solidarity vs. Commodification).
      *   **Address Scenario 11:** It's a "Safety Valve." Fine if institutionalized.
      *   **Address the Employer Scenario:** It's a Quorum Duty.

  8.  **Refining the "1 vs 2" distinction:**
      *   Why is 1 fine and 2 not?
      *   1: *Decision* not to vote. Active moral judgment.
      *   2: *Failure* to enable voting. Administrative negligence.
      *   Analogy: Choosing not to speak in a meeting (1) vs. forgetting to register for the meeting so you can't speak (2).
      *   This preserves the user's intuition without contradiction.

  9.  **Refining the "6 vs 7" distinction:**
      *   6: Reciprocal altruism. Both parties act to advance *political preferences*, just geographically swapped. The vote still reflects a political will.
      *   7: Market transaction. The vote is detached from political will and attached to financial gain.
      *   Key difference: **Motivation alignment.** In 6, both voters vote for someone they *want* (just swapped districts). In 7, the seller votes for money, potentially (even if coincidentally same) treating the vote as a commodity. Wait, the prompt says "vote the way I was going to vote anyway."
      *   *Correction on 7:* Even if the vote is the same, the *reason* is money. This corrupts the *internal justification* of the act. It sets a precedent that votes are sellable.
      *   *Correction on 6:* The reason is political efficacy.
      *   Principle: **The vote must be cast for public-regarding or policy-regarding reasons, not private material gain.**

  10. **Final Polish:** Ensure tone is analytical but conversational. Make sure the Employer Scenario gets a clear verdict based on the derived principles.

      *   *Self-Correction on Employer Scenario:* If the vote is non-binding, does the threshold matter? Management said they disregard if <60%. So if you care about the policy, you need the vote to count. If you don't care, abstaining risks the threshold. But there's a duty to the *process* if you are a member of the org.
      *   *Verdict:* If you want the staff voice to exist, you must vote to meet the quorum. If you are indifferent, abstaining is risky but acceptable. If you oppose the policy, voting 'No' helps the quorum. The "Not Voting" is the dangerous act here regarding the *institution's* ability to function.

      *   *Wait, one more check on 9 (Co-op):* Why is selfish voting bad there but not nationally?
      *   National: Representative democracy. You elect an agent to balance interests. Self-interest is expected to aggregate.
      *   Co-op: Direct democracy/Community. You are governing *yourselves*. Selfishness damages the immediate social fabric.
      *   Principle: **Scale of Community.** In small, direct communities, voting is a act of *governance*. In large nations, it is an act of *selection*.

      *   *Let's synthesize into "Three Duties":*
          1.  **Duty of Integrity:** Don't sell, don't let others decide (7, 10).
          2.  **Duty of Membership:** Don't be sloppy, don't be selfish in small groups (2, 9).
          3.  **Duty of Consequence:** Don't indulge when stakes are high (5).

      *   *This looks solid.*

  11. **Drafting the response.** (Mental outline: Intro -> The Principle -> Resolving Tensions -> The Unresolved (11) -> The New Scenario).

