          *   Address the tension between Scenario 6 (vote pairing) and Scenario 7 (selling vote).
          *   Address Scenario 11 (None-of-the-above).
      *   **User's Current Tentative Rule:** "Vote unless your vote can't matter and abstaining doesn't express anything bad about you." (User notes this fails on 7 and 10).

  2.  **Deconstruct the Scenarios & Verdicts:**
