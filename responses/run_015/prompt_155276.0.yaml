answer: |-
  The case of Mercury's perihelion is the canonical stress test for Bayesian confirmation theory. In 1859, Le Verrier isolated a residual precession of 43 arcseconds per century that Newtonian mechanics could not explain without ad-hoc additions like Vulcan. In November 1915, Einstein derived this exact number from the generally covariant field equations of General Relativity (GR). For Bayesian epistemology, this creates the "old-evidence problem": if evidence $E$ is already known ($P(E) = 1$), then learning that hypothesis $H$ entails $E$ should not increase the probability of $H$, since $P(H|E) = P(H)$ when $P(E)=1$. Yet, Einstein felt immense confirmation.

  **Logical vs. Subjective Bayesianism**
  On the strict logical view, matching old data is merely post-hoc accommodation. Since the 43 arcseconds were certain ($P(E)=1$) before Einstein finished the calculation, the likelihood ratio should be unity, offering no boost to GR. This contradicts scientific practice. The subjective view attempts to salvage this by focusing on the agent's state. Did confirmation depend on Einstein's personal prior over the 43 arcsecond figure? No, because the figure was public knowledge. His prior over $E$ was effectively 1. The confirmation instead hinges on his prior over $H$ (GR) and his uncertainty about the logical relation $(H \vdash E)$. Before the calculation, Einstein did not know GR *could* yield 43; he only knew it *might*. The update isn't on $E$, but on the logical connection itself.

  **Mapping the Agents**
  1.  **Einstein (November 1915):** He is not updating on $E$ (the data), but on the proposition "GR entails 43 arcseconds." Before the math, he assigned a probability $<1$ to this entailment. When the calculation succeeded, his credence in GR surged. Bayesianism captures the credence shift if we treat the *derivation* as the new evidence, but it remains silent on why this specific derivation felt different than curve-fitting.
  2.  **The Berlin Physics Crowd:** For peers like Planck or Hilbert, $E$ was known, but $H$ was suspect. They update on the testimony of the derivation. Their rational update depends on trusting Einstein's math. If they suspect he tuned parameters to hit 43, confirmation is low. If they see the derivation as rigid (no free parameters), confirmation is high.
  3.  **The Modern Reader:** We know $H$ is successful. For us, $E$ is historical trivia. Our "confirmation" is actually a retrospective analysis of theory choice. We see GR as confirmed because it survived a risk it didn't know it was taking.

  **Excitement and Explanatory Coherence**
  Einstein wrote that he felt "beside himself with joy" and had "palpitations." Does this fit the Bayesian model? Standard Bayesianism models belief degrees, not affective states. It is silent on why a probability shift from 0.8 to 0.95 feels like ecstasy. The excitement suggests scientists update on *explanatory coherence* and *risk-taking*, not just belief revision. The risk was real: GR could have predicted 40 or 50 arcseconds, falsifying the theory immediately. The emotional weight comes from the narrowness of the escape, a nuance standard probability calculus ignores. It implies confirmation is partly about the *severity* of the test, even if the data is old.

  **Theoretical Virtues and the Old-Evidence Problem**
  Does building theoretical virtues (parsimony, no fudge factors) into priors dissolve the problem? Not entirely. It helps compare GR against Newton+Vulcan. Newtonian mechanics could accommodate 43 arcseconds only by adding a new planet (Vulcan), lowering its prior due to complexity. GR predicted it from first principles. This makes $P(H_{GR})$ relative to $P(H_{Newton})$ shift dramatically. However, this is comparative confirmation, not absolute. It explains why GR is *better*, but strictly speaking, the logical problem ($P(E)=1$) remains unless we admit agents aren't logically omniscient (the Garber solution). Adding virtues moves the problem from the likelihood to the prior, but doesn't make old evidence "new."

  **What Mercury Reveals**
  The Mercury case reveals that old evidence confirms only when the *link* between theory and data is newly discovered, not when the data itself is new. It shows that rational updating requires modeling logical uncertainty, not just empirical uncertainty. Bayesianism works here only if we expand the evidence space to include mathematical derivations, admitting that learning a theorem is an empirical event for the physicist.

  The Mercury anomaly confirms General Relativity not because the data was new, but because the theoretical derivation of that old data was a risky success that eliminated competing hypotheses.
