answer: |-
  The money pump argument against intransitive preferences is fundamentally circular. Its persuasive force relies entirely on smuggling in a assumption of myopia—that a rational agent must evaluate choices sequentially without regard for the future—while pretending to derive irrationality from preferences alone. If we grant the agent the capacity for diachronic rationality, the ability to form plans and stick to them across time, the pump jams immediately. The argument cannot use the failure of a myopic agent to prove that intransitivity is irrational, because the very machinery required to state the pump (a sequence of offers) provides the agent with the information needed to refuse it.

  Consider the batched pump. If the estate agent presents the entire cycle as a single package—'sign here to swap Alder for Cedar, then Birch, then back to Alder for £120'—any agent, regardless of preference structure, rejects it. You end up with the cottage you started with, only poorer. The sequential pump only works if the agent is forbidden from treating the sequence as a single object of choice. But why should rationality forbid this? To be rational is precisely to coordinate one's actions over time to avoid dominated outcomes. If an agent can recognise the cycle, they can pre-commit to refusing the first trade. The money pump does not demonstrate that intransitive preferences are inconsistent; it demonstrates that intransitive preferences are vulnerable to exploitation *if* the agent is prevented from planning. That is an argument against myopia, not intransitivity.

  The obvious objection is that the agent who refuses the first trade remains stuck with Alder, despite preferring Cedar. They are frozen out of an improvement. However, this is not a defect in their preferences; it is a cost of operating in a hostile environment. Consider a perfectly transitive agent who values privacy over money. A blackmailer threatens to reveal embarrassing secrets unless paid £1,000. The agent pays. They end up poorer, with their privacy intact—the status quo maintained. They have been 'pumped' for cash, yet no one claims their preference for privacy over wealth is irrational. The loss arises from the presence of a predator, not the agent's valuation structure. Similarly, the intransitive agent refusing the trade is locking the door against a predator. They retain Alder not because they prefer it to Cedar in a vacuum, but because accepting Cedar triggers a tax that nullifies the gain. The dissatisfaction of holding Alder whilst preferring Cedar is the price of safety in a neighbourhood full of estate agents looking to fleece them. It is a constraint on satisfaction, not a failure of rationality.

  Does this defence collapse if the cost per trade drops to a penny? If the agent pays 3p per lap, the financial loss is negligible. Does the agent now ought to cycle? No. The structural flaw in the money pump argument remains unchanged. Even if the cost is trivial, the agent who views the sequence holistically sees a dominated outcome: ending at Alder with less money than starting at Alder with more. The only way the penny pump works is if the agent values the *transition* itself enough to outweigh the cumulative loss, but the setup specifies preferences over cottages, not swaps. If the agent prefers Cedar to Alder, they might pay the penny to move, but upon reaching Birch, they must ask if the next penny is worth it given the inevitable return to Alder.

  If the agent possesses diachronic rationality, they recognise that paying the penny three times yields no net positional gain. They can simply refuse the first penny. The magnitude of the cost does not alter the logical requirement for myopia. The pump still demands that the agent ignores the future consequence of the current trade. Whether the loss is £120 or 3p, the argument that intransitivity entails irrationality rests on the claim that a rational agent cannot plan across time. Since rational agents plainly can, the money pump fails to condemn the preferences. It merely condemns the lack of foresight, which is a separate vice entirely. Intransitivity may be unusual, but the money pump proves only that unusual preferences require careful navigation in a predatory world, not that they are logically incoherent.
