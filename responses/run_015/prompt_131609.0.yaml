  JOINT STATEMENT ON MAIMONIDEAN SACRIFICIAL THEORY
  ISSUED BY THE SCAFFOLDING AND FOSSIL WORKING GROUPS

  PREAMBLE
  This document represents the findings of an adversarial collaboration between two interpretive communities regarding Moses Maimonides' treatment of animal sacrifice in *The Guide for the Perplexed*. We adopt the heuristic labels Scaffolding and Fossil for the purpose of this statement, acknowledging these are not standard academic classifications but useful shorthand for distinct hermeneutic approaches. Our goal is to delineate where our readings converge on the text and where they fundamentally diverge, without privileging one consensus over the other.

  I. SETTLED INTERPRETATIONS (AGREED CLAIMS)
  Both camps affirm the following claims regarding Maimonides' explicit assertions and textual arguments:

  1.  **Divine Intent:** Maimonides states that the commandment to offer sacrifices was not the primary initial intent of the divine will, had human nature allowed for a different mode of service.
  2.  **Historical Context:** Maimonides argues that the Israelites at the time of the Exodus were culturally habituated to sacrificial worship due to Egyptian and pagan surrounding practices.
  3.  **Psychological Necessity:** Both sides agree Maimonides posits that an abrupt abolition of sacrifice would have been psychologically impossible for the ancient Israelites to accept, necessitating a transitional strategy.
  4.  **Restrictive Legislation:** Maimonides contends that the specific laws limiting sacrifice (centralization of location, restriction to specific priestly lines, and disqualified animals) were designed to curb idolatrous tendencies rather than encourage sacrificial frequency.
  5.  **Hierarchy of Worship:** Both camps agree Maimonides establishes a hierarchy where intellectual apprehension and prayer are superior to physical ritual actions.
  6.  **Current Obligation:** Both sides affirm that, according to Maimonides, prayer and contemplation are the mandated substitutes for sacrifice in the absence of the Temple, and this substitution is legally binding.
  7.  **Divine Origin:** Both sides maintain that despite the explanatory rationale provided, Maimonides affirms the laws of sacrifice are divinely commanded and not merely human inventions adopted by God.

  II. DIVERGENT INTERPRETATIONS (DISAGREEMENTS)
  While we agree on the textual data above, we disagree on the theological implications and the enduring status of the ritual. Each camp accepts the following wording to describe its own position:

  **The Scaffolding Camp Statement:**
  "We interpret Maimonides to mean that sacrifice was a historical compromise strictly bound to the psychological limitations of the ancient Near East. The ritual functioned as temporary training wheels designed to wean humanity off idolatry. While legally binding when the Temple stood, the form itself holds no intrinsic spiritual superiority over prayer. The ultimate goal of the law was to move worshipers toward a purely intellectual and verbal service, making the physical act of sacrifice obsolete in the ideal spiritual trajectory."

  **The Fossil Camp Statement:**
  "We interpret Maimonides to mean that while sacrifice was conceded due to historical habituation, it was crystallized into a preserved ritual form that retains ontological spiritual weight. The concession acknowledges human embodiment, not just historical error. Therefore, when the Temple stands, sacrifice is not merely a tolerated leftover but the preferred mode of physical service. Prayer is a substitute only due to the necessity of exile, not because it surpasses the sacrificial form in its proper context."

  III. CORE CRUXES AND PREDICTIVE CASES
  The following cruxes identify the underlying philosophical disagreements that drive the divergent interpretations above. For each crux, we have identified a concrete case both sides agree bears on the issue, along with their respective predictions.

  **Crux 1: The Intrinsic Value of Ritual Naturalness**
  *The Dispute:* Does the physical act of sacrifice possess intrinsic value in connecting the human to the divine, or is its value purely instrumental in redirecting pagan impulse?
  *Concrete Case:* The psychological experience of the worshiper performing the slaughter versus the worshiper praying.
  *   **Scaffolding Prediction:** The act of slaughter is inherently violent and lower than contemplation. Its value lies solely in the discipline of submitting that violence to divine law. If a worshiper could achieve submission without slaughter, the slaughter becomes unnecessary baggage.
  *   **Fossil Prediction:** The act of slaughter involves a tangible surrender of property and life that prayer cannot replicate. This physical cost carries intrinsic spiritual weight. The "naturalness" of giving up something tangible is a permanent feature of human devotion, not just a historical workaround.

  **Crux 2: The Scope of the Concession**
  *The Dispute:* Does the concessionary nature of sacrifice apply only to the specific historical context of ancient Israel, or does it reflect a permanent limitation in human nature that persists forever?
  *Concrete Case:* The liturgical practice in the Messianic Era (assuming the Temple is rebuilt).
  *   **Scaffolding Prediction:** In the Messianic Era, human intellect will be refined, and the need for physical concession may vanish. Sacrifices might not return, or if they do, they will be understood as purely symbolic memorials to the past struggle against idolatry, not as essential service.
  *   **Fossil Prediction:** In the Messianic Era, sacrifices will definitely return in their full legal form. The concession was not because humans were too pagan then, but because humans are embodied beings now and forever. The ritual form remains the necessary interface for physical beings to approach the divine, regardless of spiritual refinement.

  SIGNATORIES
  Representatives of the Scaffolding Working Group
  Representatives of the Fossil Working Group
