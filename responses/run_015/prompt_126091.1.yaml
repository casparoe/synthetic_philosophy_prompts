      *   *Check:* Did I distinguish content vs. truthmaking clearly?
      *   *Correction:* Use the distinction between "propositions" (abstract/conceptual) and "facts" (concrete/ontological). Note that some philosophers think propositions *are* facts, which collapses the distinction, but for the sake of the question, treat them separately.
      *   *Check:* Is the distinction in (a) clear?
