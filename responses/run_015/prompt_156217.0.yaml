      *   *Actually, the strongest logical constraint:* **Effective Axiomatization + Completeness.** Gödel says you can't have both (given strength). Pop sci wants to say "Humans are complete" or "AI will be complete."
      *   *Let's look for the "Single Requirement that Kills Most Takes":* It's **Recursive Axiomatizability (Effective Generability)**. Most philosophical systems (ethics, consciousness, natural language) are not effectively axiomatizable. They are vague, context-dependent, or open-textured.

