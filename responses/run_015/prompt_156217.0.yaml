answer: |-
  Here is the specification for rigorously applying Gödel's Incompleteness Theorems to non-mathematical domains (e.g., cognitive science, AI alignment, metaphysics). To avoid category errors, the argument must demonstrate that the target system satisfies the formal preconditions of the theorems before drawing ontological or epistemic conclusions.

  ### 1. The Formal Preconditions (The "Input Spec")
  Before invoking incompleteness, you must establish that the target system $S$ qualifies as a formal theory in the relevant sense. This is where 90% of applications fail.

  *   **Effective Axiomatizability (Recursive Enumerability):** There must be a finite, mechanical procedure (an algorithm) to determine whether any given string of symbols constitutes an axiom or a valid inference within $S$.
      *   *Constraint:* If $S$ is "human intuition," "natural language," or "physical law," you must provide the algorithm that generates its rules. If the rules are vague, context-dependent, or learnable only via ostension, $S$ is not effectively axiomatizable, and Gödel does not apply.
  *   **Arithmetical Representability (Sufficient Strength):** $S$ must be strong enough to represent primitive recursive arithmetic (typically Robinson Arithmetic, $Q$, is the baseline).
      *   *Constraint:* $S$ must be capable of encoding its own syntax as numbers (Gödel numbering) and expressing basic relations like addition and multiplication. A system that handles only propositional logic or weak ontological categories lacks the expressive power to trigger incompleteness.
  *   **Consistency:** $S$ must not derive a contradiction ($\vdash P \land \neg P$).
      *   *Constraint:* For the First Theorem (G1), simple consistency is usually sufficient (via Rosser's improvement). For the Second Theorem (G2), the system must be consistent to make the claim "S cannot prove Consistency(S)" meaningful. If $S$ is inconsistent, it proves everything, including its own consistency, trivializing the theorem.

  ### 2. Critical Distinctions (The "Logic Spec")
  Arguments must maintain separation between these concepts. Collapsing them invalidates the inference.

  *   **Syntactic Incompleteness vs. Semantic Truth:**
      *   *G1 states:* There exists a sentence $G$ such that $S \nvdash G$ and $S \nvdash \neg G$.
      *   *The Trap:* Pop science often claims $G$ is "True but Unprovable." Truth is a semantic property evaluated in a *meta-system* (usually standard model arithmetic). $S$ itself only deals with provability. To claim $G$ is true, you must assume the consistency of $S$ in the meta-language. You cannot use $S$ to establish the truth of $G$.
  *   **First Theorem (G1) vs. Second Theorem (G2):**
      *   *G1:* Limits what can be derived (knowledge completeness).
      *   *G2:* Limits self-verification (consistency proofs).
      *   *The Trap:* AI alignment arguments often conflate "the AI can't know everything" (G1) with "the AI can't verify it is safe" (G2). These are distinct limitations. G2 is the relevant constraint for self-modifying AI verifying its own goal stability; G1 is relevant for general knowledge bounds.
  *   **Incompleteness vs. Undecidability:**
      *   Incompleteness refers to specific sentences within a specific theory. Undecidability (Church-Turing) refers to the decision problem for a class of formulas. While related, applying G1 does not automatically imply the system is Turing Undecidable in practice, nor does Turing Undecidability imply Gödelian Incompleteness in the specific syntactic sense.

  ### 3. Non-Negotiables vs. Formalist Preferences
  *   **Non-Negotiable (Hard Constraints):**
      *   **Recursive Axiomatizability:** If the system's rules aren't computable, the theorems are silent.
      *   **Consistency:** If the system is paraconsistent or dialetheic (accepts true contradictions), standard Gödelian results do not hold in the standard way.
      *   **Representability of Syntax:** The system must be able to talk about its own sentences via arithmetic encoding.
  *   **Formalist Preferences (Variable Parameters):**
      *   **Logical Framework:** First-order vs. Higher-order logic. (Note: Second-order logic with standard semantics is not effectively axiomatizable, which blocks Gödel's application in a different way).
      *   **Base Arithmetic:** Peano Arithmetic (PA) vs. ZFC. As long as the system interprets $Q$, the specific base doesn't change the incompleteness result.
      *   **$\omega$-Consistency:** Required for Gödel's original proof, but Rosser's sentence removes this requirement for simple consistency. Modern applications should demand only simple consistency.

  ### 4. The "Kill Criteria"
  This section identifies where non-mathematical applications structurally collapse.

  #### The Jointly Unsatisfiable Subset
  For any non-mathematical system (e.g., a cognitive agent or physical theory), the following triad is jointly unsatisfiable **if** you wish to use Gödel to prove the system is "special" or "transcendent":
  1.  **Effective Axiomatizability** (The system is algorithmic/computational).
  2.  **Soundness/Consistency** (The system produces no errors/contradictions).
  3.  **Completeness** (The system can decide all meaningful questions within its domain).

  *Why this kills the argument:*
  *   **Lucas-Penrose Style Arguments:** To argue the human mind transcends machines, one claims the Mind is Consistent and Complete (we "see" the truth of $G$). But if the Mind is Consistent and Complete, it **cannot be Effectively Axiomatizable**. You must posit the mind is non-algorithmic. This moves the argument from logic to metaphysics (dualism), rendering the logical proof moot.
  *   **AI Alignment Style Arguments:** To argue an AI will inevitably fail or be unsafe due to Gödel, one assumes the AI is Effectively Axiomatizable and Strong. Gödel then proves Incompleteness. But Incompleteness $\neq$ Unsafe. An incomplete system can still be functionally robust. The triad forces you to admit the AI is limited, but not necessarily in a way that matters for alignment.

  #### The Single Requirement That Kills Most Pop-Science Takes
  **Effective Axiomatizability (Recursive Generability).**

  *   **Why:** To apply Gödel, you must treat the target (Mind, Physics, Society) as a formal system with decidable rules.
      *   **If you deny it:** (e.g., "The brain is analog," "Consciousness is non-computational," "Natural language is open-textured"). Then Gödel's theorems **do not apply**. The system falls outside the scope of the proof.
      *   **If you affirm it:** (e.g., "The brain is a computer," "Physics is computable"). Then Gödel **does apply**, but the system is just a computer. You lose the ability to use Gödel to prove the system has "magic" properties (like insight beyond computation), because any system meeting this criterion is subject to the same limitations as a standard Turing machine.

  **Summary for your course:** A rigorous application must first prove the target system is a **consistent, effectively axiomatized theory extending Robinson Arithmetic**. If the argument relies on the system being *vague*, *semantic*, or *non-algorithmic* to make its philosophical point, it has already disqualified itself from Gödelian analysis. If it admits the system is *algorithmic*, Gödel applies, but yields no mystical conclusions—only standard computational limits.
