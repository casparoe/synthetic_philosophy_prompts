          *   The "single requirement" that kills most pop-science takes.
      *   **Constraint:** No need to list every bad argument, just the criteria.

  2.  **Deconstruct Gödel's Theorems (The "Spec"):**
      *   *What does G1 actually say?* Any sufficiently strong, consistent, recursively axiomatizable formal system is incomplete.
      *   *What does G2 actually say?* Such a system cannot prove its own consistency.
      *   *What are the conditions?*
          1.  **Formal System:** Must be a formal language with precise syntax and inference rules.
          2.  **Recursively Axiomatizable (Effectively Generated):** There must be an algorithm to decide if a string is an axiom.
          3.  **Consistency:** The system cannot derive a contradiction ($P \land \neg P$).
          4.  **Sufficient Strength (Arithmetical Representability):** Must be able to represent primitive recursive arithmetic (PRA) or at least Robinson Arithmetic ($Q$). It needs to encode syntax as numbers (Gödel numbering).

  3.  **Address the "Outside Math" Challenge:**
      *   Most philosophical/cognitive/AI systems are *not* formal systems in the strict sense. They are often semantic, probabilistic, or ill-defined.
      *   To apply Gödel, you must first *formalize* the target system. This is the biggest hurdle.

  4.  **Drafting the Desiderata (The "Spec"):**

      *   *Requirement 1: Formalizability.* The target (mind, AI, physics) must be mappable to a formal language $L$.
      *   *Requirement 2: Effective Axiomatization.* The rules governing the target must be computable/decidable.
      *   *Requirement 3: Arithmetical Strength.* The target must be capable of expressing basic arithmetic truths (specifically, enough to support Gödel numbering).
      *   *Requirement 4: Consistency.* The target must be assumed consistent (for G1) or trying to prove its own consistency (for G2).

  5.  **Addressing Distinctions:**
      *   *Syntax vs. Semantics:* Gödel is about *provability* (syntax), not *truth* (semantics), though truth is implicated in the meta-language. Pop sci often conflates "unprovable" with "unknowable" or "true but unprovable" (which requires a Platonist stance).
      *   *G1 vs. G2:* G1 is about incomplete knowledge/theorems. G2 is about self-verification. Penrose uses G2 mostly (consistency of human thought). AI safety often worries about G1 (unforeseen consequences) or G2 (self-verification).

  6.  **Identifying Non-Negotiables vs. Preferences:**
      *   *Non-Negotiable:* Recursive axiomatizability, Consistency, Sufficient Strength. Without these, the theorems literally do not apply.
      *   *Preferences:* Specific logical framework (FOL vs. HOL), specific arithmetic base (PA vs. ZFC), as long as strength threshold is met.

  7.  **The "Jointly Unsatisfiable" Subset (The Kill Shot):**
