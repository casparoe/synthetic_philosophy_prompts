  8.  **Tone:** Professional, technical, respectful of the safety engineer's rigor but firm on the logical gaps. Avoid jargon where possible, but use correct AI safety terms (Corrigibility, Inner/Outer Alignment).

  *(Self-Correction during drafting)*: I need to be careful not to say "AI Safety is wrong." The Instrumental Convergence thesis is a serious concern. The point is that it applies to *misaligned* agents or *open-ended* goals. It does not apply to agents specifically designed with corrigibility as a terminal value, *provided* that value is robustly specified. The Friend's argument is that robust specification is impossible. I need to show why that's not necessarily true, or at least why Step (6) is the place to attack.
  Actually, the strongest point is that the Friend conflates "Goal Design" with "System Architecture." The interruption path shouldn't be part of the agent's optimization landscape. It should be a hard constraint. The Friend assumes the agent can optimize *over* the interruption path.

  Let's focus on Step (6). It assumes capability is used to *satisfy G*. If G includes "Obey Interrupt," capability helps obey.
