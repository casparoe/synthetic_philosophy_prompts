answer: |-
  **Referee Report on Draft: 'How Narrow Is the Narrow Problem?'**

  **General Observation**
  The draft presents a compact, provocative argument regarding the structure of the alignment problem. The core intuition—that 'intent' cannot be disentangled from 'value' because interpreting intent requires normative idealisation—is sound and worthy of development. However, the argument currently relies on definitions that stack the deck against the narrow reading, and it glosses over the distinction between interpretative norms and ethical values. Below are specific comments addressing your five requests.

  **(a) The Distinction in §1**
  The distinction as drawn is not quite sharp enough to bear the weight you place on it, primarily because the definition of 'intent-aligned' in the first paragraph is overly generous. You define intent-alignment to include 'the constraints she would have wanted respected had she thought to mention them'. This is already a counterfactual idealisation. By building the 'reasonable person' standard into the narrow reading at the outset, you make the argument in §2 appear stronger than it is. A hardline defender of the narrow reading would insist that intent-alignment refers strictly to the actual psychological state of the operator at the time of instruction, or perhaps the literal semantic content of the instruction.

  If you allow the narrow reading to include counterfactual constraints ('what she would have wanted') in §1, then your claim in §2—that the narrow reading collapses because it requires counterfactual modelling—is less a critique and more an explication of your own definition. To strengthen the paper, you should characterise the narrow reading in its most defensible, restrictive form (e.g., literal compliance or actual psychological intent) and then show how *even that* requires the normative scaffolding you describe. Currently, you have quietly made the narrow reading easy to attack by defining it in a way that already admits the vulnerability you later exploit.

  **(b) The Argument of §2 and the Dependence Thesis**
  There is a significant equivocation here regarding the term 'normative'. You argue that because the operator's actual intention does not supply the principle of selection for idealisation, the system must borrow from 'some standard external to the operator's actual will'. You then conclude that narrow alignment is a special case of broad alignment (values).

  A defender of the narrow reading could accept that residual discretion requires a selection principle while denying that this principle must be ethical or 'value-aligned' in your sense. The principle could be procedural, linguistic, or contractual. For instance, Gricean maxims of conversation or fiduciary norms govern how we interpret instructions without necessarily invoking a broader ethical theory about 'what is best'. These norms are external to the *specific* intention, but they are internal to the *practice* of delegation.

  Your argument assumes that any standard external to the specific intention is a 'value' standard. This is the weak link. To establish the Dependence Thesis, you must show that the selection principle cannot be merely procedural or conventional, but must inevitably invoke substantive ethical values (e.g., welfare, rights). Currently, you demonstrate that interpretation requires norms, but not that it requires *ethical* values. A sympathetic reader will stop being convinced at the sentence: 'it can only be filled in by borrowing from some standard external to the operator's actual will.' They will agree it requires an external standard, but deny that this standard constitutes 'value alignment' as defined in §1.

  **(c) The Reframing in §4**
  There is a risk that this reframing is merely a redescription that relabels the original dispute without resolving it. You propose that intent and value alignment are merely different settings on an 'extrapolation profile'. While this is a useful heuristic, it risks dissolving the categorical distinction that motivates the debate in the first place.

  The dispute between narrow and broad readings is often not about *how much* extrapolation is permissible, but about *who has authority*. A deontological constraint (e.g., 'do not lie') is not simply a setting on a slider of extrapolation; it is a side-constraint that may prohibit extrapolation entirely regardless of the profile. By reducing the disagreement to a quarrel about a label and a profile setting, you may be obscuring the substantive moral conflict regarding authority.

  However, if you frame this not as a dissolution of the problem but as a shift in the locus of debate, it becomes an advance. The advance lies in showing that the technical implementation of 'intent' always involves a choice about idealisation. To ensure this is seen as a genuine advance, you need to clarify what work the 'profile' does that the original distinction did not. Does it allow us to compare cases more precisely? Does it reveal hidden assumptions? Currently, it looks like a terminological shift unless you can show that adopting the 'profile' vocabulary changes the outcome of the analysis in §5.

  **(d) Strongest Objection and Single Step to Attack**
  The strongest objection you have not addressed is the 'Principal Problem', which you hint at in §6 but do not integrate into the main argument. In most real-world deployments (as in your §5 case), the 'operator' is not the principal. The operator is an employee; the principal is the firm; the affected parties are the customers or public.

  Your argument assumes a dyadic relationship (system vs. operator). The ethical tension in AI alignment is rarely between the system and the operator's intent; it is between the operator's intent and the stakeholders' interests. The 'Dependence Thesis' might be true, but it is irrelevant if the operator lacks the moral authority to set the extrapolation profile in the first place.

  If I were writing the referee report, the single step I would attack first is the inference in §2 that the selection principle must be borrowed from a 'broader normative standard'. I would argue that the selection principle is supplied by the *authority structure* of the deployment context, not by abstract values. The system does not need to decide what is 'best' (broad alignment); it needs to decide whose instructions count (authority). By framing the problem as intent vs. values, you bypass the political question of who gets to set the profile. This is the point where a sympathetic reader would stop being convinced: you assume the operator's intent is the default baseline that needs justification, whereas in many ethical frameworks, the operator's intent has no default authority over affected third parties.

  **(e) Obscure, Overstated or Dispensable Passages**

  *   **§1, Sentence 4:** '...intentions leave behavioural traces that values do not...'
      *   *Critique:* This is overstated and empirically dubious. Values often leave behavioural traces (patterns of choice), and intentions are often opaque.
      *   *Suggestion:* Delete or qualify. Consider: 'intentions are often evidenced by explicit instructions in a way that abstract values are not.'

  *   **§3, Sentence 4:** 'A constraint is not a specification.'
      *   *Critique:* This is too cryptic. It does the heavy lifting of your rebuttal to the 'obvious reply' but is asserted without explanation. A reader may not grasp why a constraint cannot specify the system's purpose.
      *   *Suggestion:* Expand this. Explain that a constraint limits the solution space but does not identify the objective function. For example: 'A constraint rules out certain actions but does not identify which of the remaining permissible actions the system should prioritise.'

  *   **§5, Final Sentence:** 'My provisional principle is that the more a deployment threatens irreversible effects on parties other than the principal, the less weight the actual-intent profile deserves.'
      *   *Critique:* This arrives abruptly and seems to contradict the earlier focus on the operator/principal dyad. It introduces 'parties other than the principal' without having established their moral standing in the framework.
      *   *Suggestion:* Connect this back to the 'profile' concept. Perhaps: 'This suggests the extrapolation profile should be sensitive to externalities: as risk to third parties increases, the profile should shift from actual-intent towards broader value considerations.'

  *   **§4, Sentence 4:** 'The tempting quarrel between the readings turns out to be a quarrel about a label...'
      *   *Critique:* This is dismissive and may alienate readers who believe the ontological distinction is real.
      *   *Suggestion:* Soften this. 'The quarrel between the readings may be less about competing targets than about competing assumptions regarding the permissible degree of extrapolation.'

  **Summary Recommendation**
  The paper has a strong core argument regarding the inevitability of idealisation in intent alignment. To succeed, it must tighten the definition of the narrow reading to avoid straw-manning, distinguish more carefully between interpretative norms and ethical values, and integrate the multi-party nature of deployment contexts into the main argument rather than relegating it to a uncertainty in §6.
