  I've been reading about the 'problem of logical omniscience' and I'm not really getting it. From what I can tell it's the issue that a perfectly rational agent has to know every true propoition, like all the actual facts about the world, which is obviously impossible for any real brain or computer. So is the whole problem basicaly just that we can't build a godlike omniscient AI? What's the actual issue beyond that, and does it even matter for a Bayesian agent running in a program?
