answer: |-
  Based on her track record, here is the analysis of how she will judge the "Schema Lineage" case, the rules she is likely using, and how to test them.

  ### 1. The Verdict
  **She will say this is a meme (a case of Darwinian cultural evolution).**

  Despite the involvement of language models and ranking algorithms, the core dynamics match the cases she accepted (specifically the **Family Recipe** and the **Joke**). The key for her is not the *medium* of transmission (human brain vs. LLM) but the *mechanism* of spread (selection vs. imposition) and the *nature* of the inheritance (generative vs. token).

  ### 2. The Candidate Rules
  Here are three rules that fit her past verdicts equally well, along with their predictions for the Schema Lineage.

  *   **Rule A: The Selectionist Constraint (Heritable Variation + Differential Uptake)**
      *   *Definition:* A cultural trait evolves if it is transmitted with variation, and its spread is determined by its "fitness" (appeal/utility to the receiver) rather than external coercion.
      *   *Fits Old Verdicts:* Explains why the **Compliance Clause** is *not* a meme (imposed by boss, no selection) but the **Chain Message** *is* (spread by fear/choice, selection applies). Explains why **Family Recipes** are memes (tweaked/varied, spread by taste).
      *   *Prediction for Schema:* **YES.** The recipe varies (LLM/human tweaks), heredity exists (the schema persists), and success is determined by the ranking system (a proxy for audience uptake/fitness).

  *   **Rule B: The Reconstructive Tolerance (Instructions > Tokens)**
      *   *Definition:* Transmission does not require copying a specific token (exact words/moves); copying a "generative recipe" or schema is sufficient for lineage.
      *   *Fits Old Verdicts:* Explains why **Jokes** (retold) and **Family Recipes** (tweaked) are memes, despite low token fidelity. Explains why **Eye Colour** is not (biological token, not cultural instruction).
      *   *Prediction for Schema:* **YES.** No tokens are copied; users inherit a "generative recipe" and build instances from scratch.

  *   **Rule C: The Human-Medium Constraint (Human Agency Required)**
      *   *Definition:* The reproducer and the selector must be human minds. Algorithms or biological reflexes break the lineage.
      *   *Fits Old Verdicts:* Explains why **Flinching** (reflex) and **Eye Colour** (biology) are not memes. All her positive cases involve human choices.
      *   *Prediction for Schema:* **NO.** The instances are written by LLMs and sorted by an engineered filter. The "reproducer" is a machine.

  ### 3. Which Rule Is She Actually Running?
  She is running **Rule A (The Selectionist Constraint).**

  **Why:** The **Compliance Clause** verdict is the "smoking gun." A compliance clause is a perfect example of high-fidelity token copying (Rule B would accept it) and human-to-human transmission (Rule C would accept it). She rejected it *specifically* because it was "imposition rather than selection." This proves that for her, the *cause of spread* (Darwinian selection) matters more than the *fidelity of copying* or the *purity of the medium*.

  In the Schema Lineage, even though LLMs write the text, the *selection pressure* comes from the ranking system which reflects human engagement ("people read, react"). The "fitness" of the story shape determines its survival, not a boss's order. Therefore, it satisfies her primary condition: **Differential uptake based on fitness.**

  ### 4. Closest Analogue and Difference
  **Closest Analogue:** The **Family Recipe**.

  *   **Similarity:** In both cases, nobody copies a token. What is inherited is a "generative recipe" (instructions on how to construct the thing). In both cases, the lineage changes over time (tweaked each generation / setups got shorter) to better fit the environment (family taste / ranking filter).
  *   **Difference:** The **Selection Mechanism**. In the Family Recipe, selection is implicit and social (did the family eat it? did the cousins ask for it?). In the Schema Lineage, selection is explicit and engineered (the ranking algorithm).
  *   **Why it doesn't change her verdict:** She accepted the **Chain Message**, which relies on a superstitious "threat" (a kind of social engineering). She is comfortable with selection mechanisms that are not purely "organic," provided they aren't top-down *impositions* like the Compliance Clause. The ranking filter acts as an environment, not a dictator.

  ### 5. The Divergence Test
  To distinguish between the rules that agree here (Rule A: Selectionist and Rule B: Reconstructive), you need a case that has **Reconstruction** but lacks **Selection**.

  **The Variant:** **The Mandated Schema.**
  *Imagine the same online community, but now account retention requires every user to post one story using the Schema every month. Users still vary the details (LLM prompts vary, reconstruction allowed), but participation is compulsory.*

  *   **Rule B (Reconstructive Tolerance) predicts:** **YES, it is a meme.** The lineage continues, the schema is reconstructed and varied, the form persists.
  *   **Rule A (Selectionist Constraint) predicts:** **NO, it is not a meme.** Like the Compliance Clause, the spread is due to *imposition* (account rules), not differential fitness. The "fit" of the story no longer determines its survival.

  If she says the Mandated Schema is **not** a meme, she confirms that **Selection (Rule A)** is her operating definition of Darwinian cultural evolution. If she says it **is** a meme, she is prioritizing the **Form (Rule B)** over the Mechanism. Given her rejection of the Compliance Clause, the former is far more likely.
