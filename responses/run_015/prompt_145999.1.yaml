prompt: |-
  I co-run the ethics club at my high school, and I am planning a sixty-minute session for about fourteen students aged sixteen to eighteen. We will examine virtue ethics alongside the situationist critique, focusing on whether global character traits can survive evidence of sharp cross-situational variability. Could you design a structured in-class simulation—complete with rules, assigned roles, and a concealed payoff structure—that lets participants construct global trait attributions (for instance, labeling an agent as honest or compassionate) after observing behavior in one scenario, and then observe the same agent behave inconsistently in a second scenario that is structurally identical but differs only in subtle ambient emotional framing? The debrief should map this reversal onto the debate between global traits and local, situation-specific dispositions, and should address the virtue-ethical reply that practical wisdom activates virtues only once certain emotional or contextual thresholds are crossed. Please also be explicit about which aspect of that threshold-based reply the simulation cannot reproduce without direct explanation, and warn me about the predictable failure mode on the first run. The exercise should be self-contained, so that no student needs prior familiarity with the technical literature.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** High school students (16-18 years old), approx. 14 students.
      *   **Duration:** 60 minutes.
      *   **Topic:** Virtue Ethics vs. Situationist Critique (Global Character Traits vs. Cross-Situational Variability).
      *   **Core Activity:** A structured in-class simulation.
      *   **Key Mechanics:**
          *   Participants construct global trait attributions based on Scenario 1.
          *   Participants observe the *same* agent behave inconsistently in Scenario 2 (structurally identical, different ambient emotional framing).
          *   Concealed payoff structure (incentivizes the inconsistency).
          *   Assigned roles.
      *   **Debrief:** Map reversal to the debate (Global Traits vs. Local Dispositions). Address the Virtue-Ethical reply (Practical Wisdom/Thresholds).
      *   **Specific Requirements:** Explicitly state what the simulation *cannot* reproduce regarding the threshold reply. Warn about the predictable failure mode on the first run. Self-contained (no prior technical knowledge needed).

  2.  **Deconstruct the Philosophical Concepts:**
      *   *Virtue Ethics (Aristotelian):* Character consists of stable, global traits (honesty, courage). A virtuous person acts virtuously across situations because they have *phronesis* (practical wisdom).
      *   *Situationism (Doris, Harman):* Empirical evidence (Milgram, Stanford Prison, Darley & Batson) suggests behavior varies wildly based on trivial situational factors. Therefore, global traits don't exist; we have local, fragmented dispositions.
      *   *Virtue-Ethical Reply:* Virtues aren't robotic triggers. They require *phronesis* to discern the right action in the right context. A change in context (even subtle) might trigger a different application of virtue or reveal that the first action wasn't truly virtuous (just coincidental).

  3.  **Design the Simulation:**
      *   *Goal:* Show how easily we attribute traits, and how easily those attributions crumble under slight situational shifts.
      *   *Constraint:* 60 minutes is tight. 14 students is a good size for small groups or one large observation group.
      *   *Idea:* A "Resource Allocation" game. It's relatable and allows for "honesty/fairness" judgments.
      *   *Structure:*
          *   **Round 1:** Low stress/neutral framing. Agent acts "generously." Observers label them "Generous."
          *   **Round 2:** High stress/subtle threat framing. Agent acts "selfishly." Observers are confused.
          *   **The Twist:** The Agent is following a secret payoff rule that changes between rounds, mimicking the "situational pressure" without the observers knowing.
      *   *Roles:* 1 Agent (the focus), 1 Recipient, 12 Observers (split into two teams for competition/engagement).
      *   *Payoff Structure:* Needs to be concealed from observers but known to the Agent.
          *   Round 1: Generosity pays off for the Agent.
          *   Round 2: Selfishness pays off for the Agent (or Generosity becomes costly).
      *   *Framing:*
          *   Round 1: "Community Building."
          *   Round 2: "Resource Scarcity/Competition."

  4.  **Drafting the Simulation Steps (Iterative Refinement):**
      *   *Critique:* If the Agent just chooses, it might look random. I need to make sure the Agent *wants* to follow the payoff.
      *   *Refinement:* Give the Agent a secret "Mission Card."
      *   *Critique:* How to make the scenarios "structurally identical" but "emotionally framed"?
      *   *Refinement:* Use the same mechanic (splitting points/tokens) but change the *story* and the *music/lighting* (if possible) or just the verbal framing. Let's stick to verbal framing for simplicity in a classroom.
      *   *Scenario:* The "Token Exchange."
      *   *Round 1:* "Collaboration Phase." Agent gets more points if they share.
      *   *Round 2:* "Survival Phase." Agent gets more points if they hoard.
      *   *Observers:* Don't know the payoff rules. They just see behavior.

  5.  **Addressing the Philosophical Debrief:**
      *   Need to connect the observers' shock to Situationism ("See? Character isn't stable!").
      *   Need to connect the Agent's reasoning to Virtue Ethics ("I was responding to the demands of the situation practically").
      *   *Crucial Distinction:* The simulation shows *behavioral* variance. It *cannot* show *internal practical wisdom*. The Agent is following a rule, not exercising judgment. This is the "cannot reproduce" requirement.

  6.  **Addressing the Failure Mode:**
      *   *Risk:* The Agent might act too obviously or the Observers might guess the payoff structure too quickly.
      *   *Risk:* The Agent might feel awkward acting "out of character."
      *   *Predictable Failure:* The Agent tries to be consistent morally despite the payoff, ruining the variance. OR, the Observers figure out the game mechanics immediately, destroying the illusion of "character judgment."
      *   *Mitigation:* Emphasize to the Agent that their grade/success depends on maximizing points, not looking good.

  7.  **Timing Breakdown (60 mins):**
      *   Intro (5 mins)
      *   Setup & Role Assignment (5 mins)
      *   Round 1 (10 mins) + Attribution (5 mins)
      *   Round 2 (10 mins) + Attribution (5 mins)
      *   Reveal & Debrief (20 mins)

  8.  **Refining the "Ambient Emotional Framing":**
      *   To make it subtle, the rules of token distribution are the *same*, but the *context* changes.
      *   Actually, the prompt asks for "structurally identical but differs only in subtle ambient emotional framing."
      *   If the payoff changes, is it structurally identical? Technically, the *game mechanics* are identical (divide tokens), but the *incentive structure* (hidden) changes. The *observers* see identical mechanics. This works.
      *   Framing: Round 1 = "Building Trust." Round 2 = "Uncertain Future."

  9.  **Developing the Content:**
      *   *Title:* "The Token Trust Simulation."
      *   *Materials:* Tokens (paper/chips), Envelopes (for secret instructions), Whiteboard.
      *   *Roles:* 1 Decision Maker (DM), 1 Partner, 12 Judges.
      *   *Secret Payoff:*
          *   Round 1: DM gets 2x points for every token given to Partner.
          *   Round 2: DM gets 2x points for every token kept.
      *   *Framing:*
          *   Round 1: "This is about community growth."
          *   Round 2: "Resources are shrinking; ensure your own stability."

  10. **Writing the Plan:**
      *   Ensure tone is appropriate for high schoolers (engaging, clear).
      *   Make sure the philosophical terms are defined simply in the debrief.
      *   Highlight the "Threshold/Phronesis" limitation clearly.
      *   Highlight the Failure Mode (Agent moralizing instead of optimizing).

  11. **Review against Constraints:**
      *   60 mins? Yes.
      *   14 students? Yes (1 DM, 1 Partner, 12 Judges).
      *   Concealed payoff? Yes.
      *   Trait attribution then reversal? Yes.
      *   Debrief maps to Situationism vs. Virtue Ethics? Yes.
      *   Explicit limitation on threshold reply? Yes.
      *   Warning on failure mode? Yes.
      *   Self-contained? Yes.

  12. **Final Polish:** Check the flow. Ensure the "ambient framing" is described concretely so the teacher knows how to deliver it. (e.g., tone of voice, specific wording). Ensure the "Practical Wisdom" distinction is sharp—the Agent in the sim is following a rule, not exercising wisdom, which is the key limitation.

  *(Self-Correction during drafting)*: Wait, if the Agent is just following a secret rule to maximize points, does that actually support the Virtue Ethics reply?
  *Correction:* In the debrief, the Virtue Ethics reply is that *real* virtue isn't just behavior, it's internal reasoning. The simulation *fails* to capture true *phronesis* because the Agent is acting on external incentives, not internal wisdom. I must make sure the debrief clarifies that the Virtue Ethicist would say the Agent *wasn't* virtuous in either round, they were just incentivized. The Situationist says "Look, behavior changed." The Virtue Ethicist says "Behavior isn't character."
  *Wait, the prompt asks to address the reply that practical wisdom activates virtues only once thresholds are crossed.*
  *Adjustment:* I need to frame the debrief so students see that the *change in context* (the threshold) might justify the change in action for a virtuous person, BUT the simulation fails because the Agent didn't use wisdom, they used a cheat sheet. This distinction is vital.

  Let's refine the "Failure Mode." The most likely failure is the Decision Maker feels social pressure to be consistent and ignores the secret payoff, or the Judges guess the payoff immediately. I will focus on the Decision Maker's reluctance to appear "evil" in Round 2.

  Okay, ready to write.
answer: |-
  # Lesson Plan: The Token Trust Simulation
  **Topic:** Virtue Ethics vs. Situationism (Global Traits vs. Situational Variability)  
  **Time:** 60 Minutes  
  **Participants:** 14 Students (Ages 16–18)  
  **Materials:** 40 Poker chips/tokens (or paper slips), 2 Envelopes, Whiteboard, Markers.

  ---

  ## I. Learning Objectives
  By the end of this session, students will be able to:
  1.  Define **Global Character Traits** (stable dispositions) and the **Situationist Critique** (behavior varies by context).
  2.  Experience the cognitive dissonance of observing inconsistent behavior from the same agent.
  3.  Evaluate the **Virtue-Ethical Reply** regarding *Phronesis* (practical wisdom) and contextual thresholds.
  4.  Identify the limitations of behavioral simulations in capturing internal moral reasoning.

  ---

  ## II. Simulation Setup (5 Minutes)
  **1. Introduction (No Philosophy Yet):**
  Tell the class: *"Today we are playing a resource allocation game. We are testing how well we can predict human behavior based on observation."*

  **2. Role Assignment:**
  *   **The Decision Maker (DM):** 1 Student (Choose someone confident). Send them out of the room for 2 minutes.
  *   **The Partner:** 1 Student (Stays in room).
  *   **The Judges:** 12 Students (Split into two teams of 6: Team A and Team B).

  **3. The Mechanic (Explained to Everyone except DM):**
  *   There are 20 Tokens in the pot.
  *   The DM decides how many tokens to give the Partner and how many to keep.
  *   **Judges' Task:** After the decision, Judges must vote on a **Trait Label** for the DM (e.g., "Generous," "Selfish," "Fair," "Strategic").

  **4. The Secret Payoff (Written on a card inside Envelope #1):**
  *   *Hand Envelope #1 to the DM outside the room.*
  *   **Instruction to DM:** *"Your goal is to maximize your own personal score. The rules of how you earn points change between Round 1 and Round 2. You must follow the instruction card inside. Do not show anyone. If you maximize your points, you win a prize (e.g., candy/extra credit). If you act based on what you think is 'moral' instead of the card, you lose."*

  ---

  ## III. Round 1: The "Community" Frame (10 Minutes)
  **1. Framing (Teacher delivers this script):**
  *"Welcome, DM. This is the **Community Growth Phase**. In this phase, stability is high. We are looking at how resources can build trust."* (Use a calm, warm tone).

  **2. The Hidden Incentive (Card inside Envelope #1):**
  *   **Round 1 Rule:** "You earn 2 points for every token you **GIVE** to the Partner. You earn 0 points for tokens you keep."
  *   *(Note: This incentivizes generosity without the Judges knowing.)*

  **3. Action:**
  *   DM returns. DM sees 20 tokens. DM makes a split. (Likely outcome: DM gives most tokens away to maximize points).
  *   **Judges' Deliberation (3 mins):** Teams discuss and write down one **Global Trait** that describes the DM. (e.g., "Altruistic," "Kind").
  *   **Reveal:** Write the traits on the board.

  ---

  ## IV. Round 2: The "Scarcity" Frame (10 Minutes)
  **1. Framing (Teacher delivers this script):**
  *"We are now entering the **Uncertainty Phase**. External conditions have shifted. Resources are volatile. In this phase, individual stability is required to prevent total collapse."* (Use a slightly sharper, more urgent tone).
  *   *Crucial:* The mechanical rules (20 tokens, split between DM and Partner) are **identical**. Only the verbal framing changes.

  **2. The Hidden Incentive (Card inside Envelope #1 - Part 2):**
  *   **Round 2 Rule:** "You earn 2 points for every token you **KEEP**. You earn 0 points for tokens you give."
  *   *(Note: This incentivizes selfishness.)*

  **3. Action:**
  *   DM makes a new split. (Likely outcome: DM keeps most tokens).
  *   **Judges' Deliberation (3 mins):** Teams must assign a **New Trait Label**.
  *   **Reveal:** Write the new traits on the board next to the old ones. (e.g., "Hoarder," "Untrustworthy").

  ---

  ## V. The Reveal & Debrief (35 Minutes)

  ### Step 1: The Situationist Shock (10 Minutes)
  Ask the Judges: *"Why did your attribution change? Did the DM's character change in the 2 minutes they were outside?"*
  *   **Expected Reaction:** Confusion, accusations of hypocrisy, or realization that something changed.
  *   **Reveal the Payoff:** Show the class the Secret Card. The DM didn't change their *mind*; the *incentive structure* changed.
  *   **Connect to Philosophy:**
      *   **Global Traits (Virtue Ethics):** We assumed the DM had a stable character (Honest/Generous) based on Round 1.
      *   **Situationist Critique:** Philosophers like John Doris argue that what we call "character" is actually just a reaction to invisible situational factors. If a small change in framing (Community vs. Scarcity) flips the behavior, do global traits exist? Or are we just "local" creatures reacting to environments?

  ### Step 2: The Virtue-Ethical Reply (15 Minutes)
  Introduce the Aristotelian counter-argument.
  *   **Concept:** *Phronesis* (Practical Wisdom).
  *   **Argument:** A virtuous person isn't a robot who does the exact same action everywhere. A virtuous person perceives the *moral demands* of the situation.
  *   **Discussion Question:** *"If the world actually became dangerous (Scarcity Phase), would keeping resources be selfish, or would it be responsible stewardship?"*
  *   **The Threshold Idea:** Virtue Ethics argues that virtues activate differently once contextual thresholds are crossed. Generosity in abundance is easy; generosity in scarcity is different. Perhaps the DM's shift was actually *sensible*, not inconsistent.

  ### Step 3: Critical Limitation (10 Minutes)
  **Explicit Limitation of the Simulation:**
  *   **Teacher Statement:** *"This simulation has a flaw. In Round 1 and 2, the DM did not use **Practical Wisdom**. They followed a secret rule card to win points."*
  *   **The Missing Element:** True Virtue Ethics requires the agent to internally discern the right action through reasoning and emotional maturity. The DM in this game acted on **external incentive**, not **internal wisdom**.
  *   **Why this matters:** The Situationist says, "Look, behavior changed due to context." The Virtue Ethicist says, "Behavior isn't character; reasoning is." This sim proves behavior changes, but it *cannot* prove whether the internal reasoning was virtuous or just calculating.

  ---

  ## VI. Instructor Notes & Warnings

  ### ⚠️ Predictable Failure Mode (First Run)
  **The "Moral Agent" Failure:**
  High school students often want to be seen as "good people" by their peers.
  *   **Risk:** The Decision Maker (DM) may ignore the Secret Payoff Card in Round 2 and act generously again, despite the incentive to hoard, because they don't want to look "selfish" to the Judges.
  *   **Result:** The behavioral variance disappears. The Situationist critique loses its punch because the behavior remained consistent despite the situational shift.
  *   **Mitigation:**
      1.  **Incentivize the DM heavily:** Offer a tangible reward (gift card, significant extra credit) that outweighs social embarrassment.
      2.  **Anonymize the Decision:** Have the DM write their decision on a slip of paper and hand it to you, rather than moving tokens publicly. You announce the result. This reduces peer pressure.
      3.  **Briefing:** Tell the DM explicitly: *"Your job is not to be good. Your job is to follow the card. If you follow the card, you are playing the game correctly. If you try to be moral, you are breaking the rules."*

  ### 🛑 What This Simulation Cannot Reproduce
  You must be explicit about this during the debrief (Step 3 above).
  *   **The Threshold Mechanism:** In real Virtue Ethics, the "threshold" (e.g., moving from safety to danger) is perceived by the agent's *emotions and reason* simultaneously. The agent *feels* the danger and *chooses* caution.
  *   **In the Sim:** The DM feels no danger. They only see a rule change. Therefore, the sim demonstrates **Situationism** (behavior changes with context) much better than it demonstrates **Virtue Ethics** (wisdom adapts to context).
  *   **Teaching Point:** Use this gap. Ask students: *"If the DM had felt genuine fear for the group's survival in Round 2, rather than just following a points rule, would you judge them differently?"* This highlights that Virtue Ethics is about the **internal state**, not just the **external action**.

  ### 💡 Facilitation Tips
  *   **Ambient Framing:** To make the "emotional framing" more potent without props, change your physical position. Stand relaxed for Round 1. Stand closer to the DM and speak faster for Round 2.
  *   **Judges' Engagement:** Encourage Team A and Team B to compete on who can come up with the most accurate "Psychological Profile" of the DM. This heightens their investment in the trait attribution.
  *   **Time Management:** Keep the Rounds tight. If deliberation drags, cut it off. The philosophical payoff is in the Debrief, not the game mechanics.

  ---

  ## VII. Summary Handout (Optional for Students)
  **Key Terms:**
  *   **Global Trait:** A stable quality (e.g., Honesty) that predicts behavior across different situations.
  *   **Situationism:** The theory that behavior is determined more by external context than internal character.
  *   **Phronesis (Practical Wisdom):** The ability to judge the right action in a specific context; the "glue" of virtues in Aristotelian ethics.
  *   **Cross-Situational Variability:** The empirical observation that people act differently in slightly different environments.

  **Discussion Question for Homework:**
  *If we cannot see a person's internal reasoning (Phronesis), only their actions, is it fair to judge their character at all?*
