      *   *What is licensed:* "Output-Internal Inconsistency," "Representation-Output Mismatch," "Sandwiching."
      *   *What is NOT licensed:* "Lying" (implies intent), "Deception" (implies goal to mislead), "Knowing the truth" (implies epistemic state).
      *   *Constraint:* Must flag assumptions if using words like "belief."

  6.  **Final Verdict (The "Honest" Conclusion):**
      *   Is the ML vocab missing something? Or is the philosophy less useful?
      *   *Argument:* The philosophy assumes a unified agent with beliefs and intentions. LLMs are stochastic parrots (or whatever the current consensus is) optimizing a loss. The distinctions collapse if "belief" is just a latent direction. However, for *safety*, the distinction between "can't tell truth" and "won't tell truth" matters.
      *   *Verdict:* It's likely that the philosophical distinctions presuppose a cognitive architecture (belief-desire-psychology) that LLMs do not strictly possess *yet*, but as systems become more agentic, the mapping becomes more necessary. Currently, the ML vocab is more precise for *mechanism*, but the philosophical vocab is needed for *normative assessment*. The residue suggests the ML vocab is descriptively rich but normatively thin.

  7.  **Refining the Output (Self-Correction/Polishing):**
