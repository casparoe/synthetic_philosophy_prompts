  10. **Final Polish:** Check flow and ensure the "Residue Report" is clearly structured. (Proceed to generate output).

  *(Post-computation check)*: Does this address the "four things" specifically?
  1. Saying false (Belief-Statement mismatch).
  2. Causing false belief (Listener state).
