  4.  **Robustness:** Sensitivity analysis across priors tracks something real about evidential support and decision robustness.
  5.  **Updating:** Both sides accept conditionalization rules appropriate to their representational framework (Bayes' rule vs. Generalized Conditionalization).

  **II. Cruxes, Cases, and Predictions**

  | Crux | Case / Argument | Strict Bayesian Prediction | Imprecise Probabilist Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Prior Uncertainty** | **Unknown Bias Coin:** Evidence suggests bias $\theta \in [0.4, 0.6]$ but no distribution over $\theta$. | **Mixture:** Rationality requires a second-order prior. Confidence collapses into evidence coverage via mixing. | **Set:** Mixing collapses a vital distinction. Credence is the set $[0.4, 0.6]$. Confidence is distinct from evidence coverage. |
  | **2. Requirement** | **Ellsberg Urn:** Known 1/3 Red, unknown Black/Yellow mix. | **Permitted:** Imprecision is permitted but not required. A precise prior is always rationally permissible. | **Required:** Sparse/ambiguous evidence *forbids* precise credence. Only a set represents the evidence faithfully. |
  | **3. Dilation** | **Coarse Learning:** Learning event $E$ makes the interval for $H$ wider than the prior. | **Bug:** Dilation is irrational. Learning should not increase uncertainty about independent events. | **Feature:** Dilation is honest. It reflects that the new evidence destroys previous correlations or precision. |
  | **4. Proxy Question** | **Forced Bet:** Agent must bet at odds derived from one prior in their set. | **Revelation:** The picked prior *is* the true credence. Action reveals the hidden precise state. | **Stand-in:** The picked prior is a pragmatic decision rule, not the doxastic state. Credence remains the set. |
  | **5. Shrinkage** | **Forecast Tournament:** Score = Coverage - Penalty(Width). Infinite evidence stream. | **Convergence:** Width goes to zero uniformly. Honest forecasters never win with non-degenerate intervals long-term. | **Persistence:** Width may stay non-zero forever. Honest forecasters win with non-degenerate intervals if ambiguity persists. |

  **III. Verbal Dispute Flag**
  We flag the **Proxy Question** as potentially verbal. If "credence" is defined by its action-guiding role, the Bayesian position holds by definition. If defined by internal evidential fit, the Imprecise position holds. We agree to treat this as substantive regarding whether action *changes* the doxastic state or merely *selects* from it for pragmatic purposes.

