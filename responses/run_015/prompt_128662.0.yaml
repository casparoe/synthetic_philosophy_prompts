answer: |-
  ### Q&A Preparation Notes

  #### 1. Likely Objections & Replies

  **1. The "Smuggling Content" Objection (Deliberative Democrats)**
  *   **Likelihood:** High (3–4 attendees). **Damage:** Critical.
  *   **Idiom:** "Your symmetry condition is either vacuous or it smuggles substance. If framers merely *believe* they are being even-handed, the test is useless. If you require an objective standard of even-handedness, you've reintroduced the substantive values you claimed to exile. You haven't solved the dead-hand problem; you've just hidden the value judgment inside the procedure."
  *   **Reply (2 min):** "The symmetry condition isn't about the framers' subjective beliefs, nor does it require a substantive evaluation of the outcome. It's a structural test of applicability. Ask: Does this rule constrain the mechanism of power acquisition equally, regardless of who holds the power? A rule requiring supermajority amendment binds the framers' coalition exactly as tightly as the opposition, provided the coalition structure changes. This is distinct from a rights catalogue, which protects specific interests regardless of procedural fairness. I am not judging the *value* of the outcome, but the *reversibility* of the constraint under altered political conditions."
  *   **Concede:** Subjective framers' intent is insufficient; the test must be counterfactual and structural.
  *   **Refuse:** That structural symmetry requires substantive moral judgment. It requires only political arithmetic.
  *   **Soft Spot:** Determining whether a coalition structure has genuinely "changed" enough to trigger the symmetry test often requires historical judgment that isn't purely arithmetic.

  **2. The "No Grip" Objection (Constitutional Lawyers)**
  *   **Likelihood:** High (2 attendees). **Damage:** High.
  *   **Idiom:** "This looks like redescription. Take the Equal Protection Clause. Is that an integrity lock or an outcome lock? You'll say it depends on interpretation. But in practice, courts treat it as substantive. Your test doesn't help us classify existing provisions; it just tells us to relabel the ones we like as 'procedural' and the ones we don't as 'outcome-based.' Where is the operational grip?"
  *   **Reply (2 min):** "The grip comes from the lapse condition. An integrity lock must lapse unless reaffirmed by the specific high-threshold process it protects. If a provision persists without reaffirmation despite shifting coalitions, it functions as an outcome lock. Equal Protection is tricky because it's hybrid, but consider voting rights rules versus specific entitlements. My test forces you to ask: Would this provision survive if the coalition that wrote it lost power tomorrow? If yes, it's likely an integrity lock. If no, it's an outcome lock. This distinguishes entrenching the *ballot* from entrenching the *result*."
  *   **Concede:** Many provisions are hybrids (e.g., voting rights) and classification is messy.
  *   **Refuse:** That the test is merely post-hoc rationalization. It predicts instability: outcome locks generate constitutional crisis when coalitions shift; integrity locks do not.
  *   **Soft Spot:** Hybrid provisions (like voting rights) blur the line so much the test may yield indeterminate results in hard cases.

  **3. The "Trigger Strategy" Objection (Formal Political Scientist)**
  *   **Likelihood:** Medium (1 attendee). **Damage:** Medium.
  *   **Idiom:** "You're describing a trigger strategy in a repeated game. Parties cooperate on amendment rules because defection leads to punishment (constitutional collapse). What work does 'integrity' do that 'equilibrium' doesn't? And 'corrupted procedure' sounds like a payoff matrix shift, not a normative category. Your formal apparatus is doing work your philosophy can't support."
  *   **Reply (2 min):** "Equilibrium explains stability, not legitimacy. A trigger strategy explains why I *don't* break the rule; it doesn't explain why I *should* feel bound by it when the threat of punishment is low. Integrity locks claim normative force because they preserve the capacity for future judgment, not because they threaten future punishment. The 'corrupted procedure' isn't just a payoff shift; it's a degradation of the information structure itself, akin to data contamination. You can have an equilibrium of tyranny; you cannot have a legitimate integrity lock of tyranny."
  *   **Concede:** The observable behavior (compliance) may look identical in equilibrium.
  *   **Refuse:** That the normative justification is interchangeable. Stability is not legitimacy.
  *   **Soft Spot:** If the "information structure" degradation cannot be formally modeled, the claim remains metaphorical rather than mechanistic.

  **4. The "Value Change" Objection (Clinical Ethicist)**
  *   **Likelihood:** Low (1 attendee). **Damage:** Low.
  *   **Idiom:** "You've misdescribed Ulysses. The interesting cases aren't impairment; they're value change. Odysseus knows he will want something else later. In constitutionalism, the future generation isn't 'corrupted'; they just have different values. By privileging the past procedure, you're saying their new values don't count."
  *   **Reply (2 min):** "In clinical ethics, value change is central. In constitutional theory, the issue is agency continuity. If the future generation changes values, they have the amendment power to express that. The 'corruption' I'm targeting is when the procedure itself prevents that expression from being accurately counted. Pre-registration isn't about stopping value change; it's about stopping data dredging. Similarly, constitutional rules shouldn't stop new values; they should stop the manipulation of the count."
  *   **Concede:** The Ulysses analogy is imperfect for intergenerational politics.
  *   **Refuse:** That value change invalidates procedural constraints. Procedures are the medium through which value change must be translated into law.
  *   **Soft Spot:** Reliance on Ulysses at all was rhetorical; if the analogy breaks, the intuition pump dries up.

  ---

  #### 2. The Single Reply That Must Land
  **The Defense of Symmetry Against Content-Smuggling.**
  If you concede that the symmetry condition requires substantive judgment to verify, the core thesis (legitimacy without content) collapses. You must hold the line that symmetry is a structural, arithmetic property of the rule's application across coalitions, not a moral assessment of the rule's effects. If this reply fails, you are left with just another theory of substantive rights.

  ---

  #### 3. The Weakest Joint
  **Step 3: The Diagnostic (Symmetry Condition).**
  This is the bridge between the abstract theory and real-world application. It is vulnerable to the claim that "would the framers accept this against themselves" is a psychological question that cannot be answered without referencing the substantive outcomes they fear. Prepare to defend the *counterfactual structural* interpretation of this test, not the psychological one.

  ---

  #### 4. Load-Bearing vs. Droppable Distinctions
  *   **Load-Bearing:** **Integrity Locks vs. Outcome Locks.** This is the thesis. If this distinction collapses, the paper is dead.
  *   **Droppable:** **Weakness of Will vs. Corrupted Procedure (Step 1).** You can argue for Integrity Locks based on the symmetry/reliability condition alone without committing to a specific theory of *why* future judgment fails (weakness vs. corruption).
  *   **Cost of Dropping:** You lose the explanatory power for *why* integrity locks are legitimate (preserving agency vs. overriding it). The argument becomes more purely procedural and less grounded in a theory of agency, making it easier for the PolSci attendee to reduce it to game theory.

  ---

  #### 5. The Question You Hope Nobody Asks
  **"Who adjudicates whether the symmetry condition is met?"**
  *   **Why it's dangerous:** If the answer is "the Court," you have installed an outcome lock on interpretation (the Court decides what counts as symmetric). If the answer is "the People," you have no mechanism for enforcement. If the answer is "the Framers," you have rule by the dead. This question exposes the need for a substantive arbiter to define the procedural limits, which collapses your distinction between procedure and content.
