answer: |-
  Dear Friend,

  I have been thinking quite a bit about our argument the other night regarding whether any famine can truly be classified as a natural disaster, and I think the 2011 famine in southern Somalia offers the perfect terrain to work through our disagreement without simply rehearsing Amartya Sen's classic examples like Bengal or Ethiopia. When we apply Sen's entitlement framework to this specific episode, the initial fit seems straightforward enough, yet it quickly reveals tensions that demand we extend his theory rather than just apply it. Sen distinguishes between direct entitlement failure, where people lose command over food because their own production collapses, and trade-based entitlement failure, where they retain nothing of value to exchange for food that still exists in the market. In southern Somalia, the prolonged drought certainly triggered a direct entitlement failure for pastoralists and farmers whose crops and livestock yields plummeted, shrinking their endowment set. However, as you noted during our discussion, regional markets still held food and international warehouses were stocked, which means the aggregate availability of food did not vanish. This suggests that the starvation was driven largely by trade-based entitlement failure, where the exchange value of the pastoralists' remaining animals collapsed relative to the price of grain, leaving them unable to command food despite its physical presence nearby.

  Yet, stopping at this distinction would miss the crucial political mechanics of the crisis, specifically the role of Al-Shabaab. Sen's implicit model tends to treat entitlement protection as a function of state capacity or state failure, assuming that the state is the primary entity capable of either safeguarding entitlements through welfare and employment guarantees or destroying them through extraction and policy blunders. The Somalia case complicates this because there was no functional state to fail; instead, sovereignty was fractured. Al-Shabaab controlled key distribution corridors, blocked humanitarian agencies from delivering supplies, and taxed or seized remaining livestock, effectively disrupting the labor markets through which displaced families had previously earned income to buy grain. This forces us to ask whether Sen's model has a limit when no single authority holds the power to protect or destroy entitlements uniformly. We might need an extension here, perhaps what we could call a sovereignty-fractured mode of entitlement collapse, to account for situations where non-state armed groups fragment the political economy of distribution. In this context, the drought remains a trigger, but it is not the explanatory frame for the famine itself, because the presence of food with deliberately obstructed access shows that the starvation was, in Sen's own terms, a purely political crime engineered by a group weaponizing scarcity.

  To map this precisely onto Sen's categories of entitlement relations, we must look at how each actor functioned within the system. The pastoralists suffered an endowment shock due to the drought, but their trade entitlement was severed because Al-Shabaab's control over markets manipulated the terms of exchange, making grain prohibitively expensive relative to livestock. Wage laborers faced a collapse in their trade entitlement as well, not because labor was worthless in theory, but because the armed group disrupted the labor markets and economic activities that generated demand for their work. Aid agencies represent the mechanism for transfer entitlement, which is the legal right to receive food through social security or humanitarian aid, and this was explicitly nullified by the blockade imposed by the armed group. Al-Shabaab itself occupies a category that Sen's theory leaves somewhat silent, acting as an entitlement disruptor or usurper that rewrites the mapping rules between endowments and entitlements without bearing the responsibility of a state. They did not just fail to protect entitlements; they actively reconfigured the legal and physical landscape to ensure that command over food was restricted to those within their patronage network while denying it to others.

  This episode ultimately confirms Sen's core thesis that famines are about distribution and command rather than aggregate availability, but it pushes that thesis to become something broader than he originally envisioned. Sen argued that starvation is the characteristic of some people not having enough food to eat, arising from the inability to command food, but he largely contextualized this inability within the framework of national governance and democratic accountability. The Somalia case demonstrates that the inability to command food can be manufactured by non-state actors who operate outside the logic of state accountability, creating pockets of entitlement failure that are insulated from international pressure or domestic political feedback loops. Therefore, while the drought provided the ecological stress, the famine was produced by the political decision to block access, confirming that there is no such thing as a purely natural famine in the modern world. However, acknowledging this requires us to expand Sen's political economy to include fragmented sovereignty, where the power to destroy entitlements is decentralized and held by groups that do not rely on the legitimacy of a state apparatus.

  In the end, I think this analysis supports your intuition that calling such an event a natural disaster is misleading, but it also suggests that Sen's framework needs to evolve to fully capture the complexity of modern conflict zones. The entitlement approach remains robust because it correctly identifies that food was available but command over it was lost, yet it must be updated to account for the fact that the guarantor of entitlements is not always the state, and the destroyer is not always policy negligence. Sometimes the destroyer is a strategic choice by a non-state actor to fragment sovereignty and weaponize distribution. I hope this helps clarify where I stand after working through the specifics, and I would love to hear your thoughts on whether this proposed extension of Sen's model holds water or if it stretches the theory too far from its original intent.

  Best regards,

  [Your Name]
