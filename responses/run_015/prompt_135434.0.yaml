  # Compartmentalized Reason: A Modular Approach to Indirect Normativity and the Toxin Puzzle

  ## Abstract

  This proposal outlines a research project investigating the structural foundations of indirect normativity. Standard accounts of indirect normativity—most notably within two-level consequentialism—presume a unified agent who must decide whether to adopt a rule-based deliberative strategy or a direct outcome-based strategy. This presumption generates a persistent instability: if the agent is unified, why not always deliberate directly on the outcome? If the indirect strategy is better, adopting it seems to require a direct calculation that undermines the strategy itself. This project proposes a shift in the metaphysics of agency underlying the debate. By modeling the ideal deliberator as modular—composed of distinct reasoning subsystems separated by normative firewalls rather than mere psychological limitations—we can reframe indirect normativity not as a strategic choice made by a unified self, but as an architectural feature of rational agency itself. The project will test this model against Kavka's Toxin Puzzle, reframed as an inter-module conflict rather than a single-agent paradox. The central research question is whether indirect normativity remains a distinct normative category under this modular model, or whether it collapses into direct normativity distributed across sub-agents. The methodology involves conceptual modeling and comparative analysis of deliberative structures. This document details the philosophical motivation, the proposed modular framework, the application to the Toxin Puzzle, the specific criteria for success and failure, and a scope assessment for a one-semester timeline.

  ## 1. Introduction: The Instability of Indirect Normativity

  The problem of indirect normativity sits at the vexed intersection of moral theory and the philosophy of action. At its core lies a tension between what we ought to do and how we ought to think about what we ought to do. Direct normative theories, such as act consequentialism, suggest that the right action is determined solely by the outcome it produces, and consequently, that deliberation should aim directly at identifying that outcome. However, extensive philosophical literature has highlighted that direct deliberation often leads to suboptimal outcomes. Agents who constantly calculate the utility of every action may suffer from decision paralysis, motivational burnout, or self-defeating prediction errors. To avoid this, indirect normative theories propose that agents should follow rules, habits, or dispositions that are not themselves directly optimized in every instance, even if the justification for adopting those rules is ultimately grounded in the optimization of outcomes.

  The standard defense of indirect normativity relies on a distinction between the criterion of rightness and the decision procedure. An agent might be justified by consequentialist standards in adopting a deontological-style rule (e.g., "never lie") because following this rule generally produces better consequences than attempting to calculate the utility of every lie. However, this framework faces a persistent meta-deliberative challenge. If the ultimate justification for the rule is consequentialist, then whenever the agent is faced with a choice between following the rule or breaking it, the shadow of the ultimate justification looms over the decision. If the agent deliberates directly about whether to follow the rule in this specific instance, they have effectively reverted to direct normativity. If they refuse to deliberate directly, they appear to be engaging in a form of rational self-deception or willful ignorance, intentionally blinding themselves to relevant moral information.

  This instability suggests that the problem may not lie in the normative theory itself, but in the model of agency presupposed by the debate. Standard discussions of indirect normativity assume a unified agent. There is a single "I" who must choose between deliberating directly or indirectly. This "I" is treated as a monolithic locus of reasoning that can access all relevant information and choose its own deliberative strategy at will. Under this assumption, indirect normativity looks like a workaround for psychological weakness. It is something finite, flawed humans need because they cannot trust themselves to calculate correctly every time. But this raises the question: what would an ideal agent do? If an ideal agent has perfect computational power and no psychological biases, would indirect normativity disappear? If the answer is yes, then indirect normativity is merely a second-best solution for non-ideal agents. If the answer is no, then there must be a structural reason why even an ideal agent should not deliberate directly on certain norms.

  This project proposes that the structural reason lies in the modularity of agency. Rather than assuming a unified deliberator who chooses between strategies, we should model the ideal deliberator as a composite system of distinct reasoning modules. In this model, the "firewalls" between modules are not psychological quirks or limitations to be overcome, but essential features of the normative architecture. One module may be responsible for setting long-term policies based on outcome optimization, while another module is responsible for executing actions based on rigid rules, without access to the policy-setting module's calculations during the moment of execution.

  By shifting the focus from a unified agent choosing a strategy to a modular agent embodying a structure, we can potentially stabilize indirect normativity. The indirect rule is not something the agent chooses to follow despite knowing better; it is something the agent follows because the part of the agent that knows better is structurally prevented from interfering with the part that acts. This reframing invites a crucial question: does this modular architecture preserve the distinctiveness of indirect normativity, or does it simply collapse into a complex form of direct normativity where the "direct" calculation is outsourced to a different module?

  The purpose of this seminar paper is to construct this modular model, apply it to a classic problem in rational choice theory (Kavka's Toxin Puzzle), and evaluate whether the distinction between direct and indirect normativity survives the transition. The project aims to demonstrate that compartmentalization is not merely a descriptive fact about human psychology but a normative requirement for certain types of rational commitment. If successful, this approach offers a way to defend indirect normativity not as a concession to human frailty, but as a feature of ideal rational agency.

  ## 2. The Standard Framework and the Unity Assumption

  To understand the novelty of the modular proposal, we must first rigorously examine the standard framework it seeks to replace. The dominant conversation regarding indirect normativity occurs within consequentialist circles, specifically regarding two-level consequentialism. In this framework, there is an intuitive level of morality, consisting of rules and dispositions learned through socialization and habit, and a critical level, consisting of direct utility calculation. The standard view holds that agents should generally operate at the intuitive level but switch to the critical level when the intuitive rules conflict or when the stakes are unusually high.

  The vulnerability of this view lies in the transition mechanism. Who decides when the stakes are high enough to switch to the critical level? If the decision to switch is itself made at the intuitive level, it may be unreliable. If it is made at the critical level, the agent has already engaged in the direct deliberation they were supposed to avoid. This creates a regress or a circularity. Furthermore, this framework assumes that the agent is a single entity capable of occupying either level at will. It presumes a unity of agency where the "self" that calculates utility is the same "self" that follows the rule.

  This unity assumption is rarely questioned, yet it carries significant metaphysical weight. It implies that agency is transparent to itself. If I am a unified agent, then any information available to any part of my mind is available to the deliberating self. If I know that breaking a rule would produce better outcomes, that knowledge is accessible to the part of me deciding whether to follow the rule. To follow the rule despite this knowledge requires a kind of cognitive dissonance. I must simultaneously hold the belief "breaking this rule maximizes the good" and the intention "I will not break this rule because I follow the rule." While humans are certainly capable of holding contradictory beliefs, modeling ideal rationality on this capacity seems counterintuitive. Ideal rationality is typically associated with coherence, not compartmentalized contradiction.

  Non-consequentialist theories face a similar issue, though framed differently. Deontologists argue that certain actions are forbidden regardless of outcomes. However, when pressed on why these rules hold, the justification often appeals to the value of respecting agency or rationality itself. This invites a consequentialist-style calculation about the value of rule-following. If the justification for the rule is grounded in the value it promotes, we return to the indirect consequentialist problem: why not promote that value directly?

  The common thread across these debates is the assumption that deliberation is a unitary process. Whether one is a consequentialist or a deontologist, the model of the agent is largely the same: a central processor that takes inputs (beliefs, desires, norms) and produces outputs (intentions, actions). Indirect normativity is treated as a software patch installed on this central processor to prevent it from crashing due to over-processing or self-defeat. The modular hypothesis suggests that this model is wrong. The "central processor" is a fiction. Ideal agency might not be a single processor running different software, but a hardware architecture consisting of multiple processors with limited connectivity.

  This distinction is crucial. In the standard model, the firewall between direct and indirect deliberation is porous and voluntary. I can choose to look behind the curtain. In the modular model, the firewall is structural. The executive module cannot access the data held by the strategic module during the execution phase. This is not because I am too weak to resist the temptation of calculation, but because the architecture of rational agency does not permit that data transfer without destroying the functionality of the system.

  By locating the source of indirect normativity in the architecture rather than the strategy, we change the normative status of the rule. In the standard view, the rule is instrumental. It is a tool used by the agent to achieve an end. In the modular view, the rule is constitutive of the module's operation. The module does not "use" the rule; the module operates *as* the rule. This shifts the burden of justification. We no longer need to explain why a unified agent would choose to ignore relevant information. Instead, we need to explain why a rational system would be designed with information barriers.

  This leads to the core theoretical challenge of the project. If we posit a modular agent, we must define the relationship between the modules. Are they separate agents? If so, we have moved from individual ethics to social contract theory within a single skull. If they are not separate agents, but parts of a single agent, does the unity of agency re-emerge at a higher level? If there is a "meta-module" that designs the architecture and sets the parameters for the sub-modules, does that meta-module engage in direct normativity? If the meta-module calculates that Module A should follow Rule X to maximize Outcome Y, then hasn't direct normativity just been pushed back one step? The system as a whole is still optimizing directly, even if the components are not.

  This is the "collapse objection." It suggests that modular indirect normativity is just direct normativity with extra steps. The project must address this objection head-on. The distinction will only hold if the normative status of the modules' operations cannot be fully reduced to the optimization calculations of the meta-module. This requires showing that the firewalls themselves have normative significance that is not merely instrumental. It requires showing that the inability to deliberate directly is not a constraint on rationality, but a condition of it.

  ## 3. The Modular Agent Hypothesis

  To move beyond abstract speculation, we need a concrete model of what a modular deliberator looks like. This project draws on concepts from the philosophy of mind regarding modularity, but applies them normatively rather than descriptively. In cognitive science, modularity often refers to encapsulated systems that process specific types of information (e.g., visual processing) without access to central belief systems. This project proposes a normative analogue: deliberative modularity.

  In this model, the ideal agent consists of at least two distinct subsystems: the Strategic Module (S-Module) and the Executive Module (E-Module). The S-Module operates over long timeframes. It has access to global information, outcome probabilities, and normative criteria. Its function is to set policies, establish dispositions, and configure the parameters of the E-Module. The E-Module operates in real-time. It receives sensory input and situational data, but its access to the S-Module's calculations is restricted. It operates based on the rules and dispositions installed by the S-Module.

  Crucially, the restriction on information flow is not a failure of communication but a design feature. The E-Module is not merely "told" to ignore certain data; it is structurally incapable of processing it during execution. For example, in a situation where breaking a promise would yield a slight utility gain, the S-Module may have calculated that a disposition of strict promise-keeping is optimal. It configures the E-Module such that the utility gain is not visible as a valid reason for action. The E-Module sees only the rule "Keep Promises" and the fact "This is a Promise." It does not see the fact "Breaking this promise yields +5 utility."

  This model resolves the psychological tension of the standard view. The agent is not lying to itself. The part of the agent that knows the utility calculation (S-Module) is distinct from the part of the agent that acts (E-Module). There is no single point in the system where the contradiction "I should break this rule to maximize utility, but I will follow the rule" is present. The S-Module holds the first conjunct; the E-Module holds the second. Because they are compartmentalized, the system avoids the rational incoherence that plagues the unified agent model.

  However, this raises the question of agency unity. Are S and E one agent or two? If they are two agents, then the system is a hierarchy of principals and agents. The normative problem becomes one of contract enforcement: how does S ensure E complies? This leads to an infinite regress of enforcement modules. If they are one agent, then the system as a whole must be rational. If the system as a whole is optimizing utility via the S-Module, then the E-Module's rule-following is merely instrumental. This returns us to the collapse objection.

  To prevent collapse, the project must argue for a specific kind of normative non-reducibility. The claim is that the E-Module's deliberation is not just a causal output of the S-Module's calculation, but a normatively distinct process. The rationality of the E-Module is not determined by whether it maximizes utility (it doesn't), but by whether it conforms to the normative architecture required for agency itself. This suggests a hybrid view: the justification for the architecture may be consequentialist (S-Module optimizes), but the norms governing the E-Module are non-consequentialist (rule-based).

  This hybridity is the key to saving indirect normativity as a distinct category. In the standard view, indirect norms are always provisional. They hold only as long as they optimize. In the modular view, indirect norms are constitutive for the E-Module. They hold because they define the mode of operation for the executive function. The S-Module cannot override them during execution without dismantling the agency structure. Thus, indirect normativity is not just a strategy; it is a structural requirement for certain types of action, particularly those involving commitment and intention.

  This hypothesis relies on the idea that rational agency requires stability over time. A unified agent who recalculates everything at every moment is not a stable agent; it is a series of temporal slices loosely connected by memory. To be an agent who can intend, promise, and commit, one must be able to bind one's future self. The modular model provides a mechanism for this binding. The S-Module binds the E-Module by restricting its access to recalculating options. This is not self-binding through external constraints (like Ulysses tying himself to the mast); it is self-binding through internal architecture.

  The normative payoff of this model is that it explains why we feel obligated to follow rules even when we know breaking them would be better. It is not because we are weak; it is because our executive function is designed to operate on rules to maintain agential integrity. The "ought" of the indirect norm is grounded in the conditions of possibility for executive agency, not just in the outcome optimization of the strategic layer.

  ## 4. Case Study: Reframing the Toxin Puzzle

  To test the viability of the modular agent hypothesis, this project will apply it to Gregory Kavka's Toxin Puzzle. The puzzle is a stress test for theories of intention and rationality. In the standard scenario, an eccentric billionaire places a vial of toxin on the table. The toxin will make you painfully ill for a day but will not kill you. The billionaire offers you a million dollars if you form the intention to drink the toxin tonight at midnight. The money will be deposited in your bank account tomorrow morning, before you have to drink the toxin. You do not have to actually drink the toxin to get the money; you only have to intend to drink it. Once you have the money, you have no reason to drink the toxin, as it causes pain and provides no further reward.

  The paradox arises because intention seems to require a belief that one will act. If you are rational, you know that once you have the money, you will not drink the toxin. Therefore, you cannot genuinely intend to drink it now. If you cannot intend it, you cannot get the money. Yet, it seems rational to want the money. Standard solutions involve arguing that intentions are not solely based on future predictions, or that there is a value in being the kind of person who keeps intentions. However, these solutions often struggle with the "resolvability" of the intention. If the agent is unified and rational, they can always revisit the decision at midnight. Knowing they will revisit it, they cannot intend now.

  The modular model offers a distinct resolution. We can model the agent as having an S-Module (strategic) and an E-Module (executive). The S-Module evaluates the scenario at time T1 (the offer). It calculates that having the million dollars is highly valuable. It recognizes that to get the money, the agent must form a sincere intention. The S-Module knows that the E-Module, at time T2 (midnight), will not want to drink the toxin if the money is already secured. Therefore, the S-Module must configure the E-Module such that at T2, the E-Module is committed to drinking the toxin regardless of the money's status.

  In this framing, the S-Module installs a "disposition module" or a specific rule into the E-Module: "If intention formed at T1, execute at T2." Crucially, the S-Module also installs a firewall. At T2, the E-Module is barred from accessing the information that the money has already been deposited. Or, more strongly, the E-Module is barred from recalculating the utility of drinking the toxin based on the reward. The E-Module operates on the rule generated at T1.

  This solves the paradox by splitting the rationality conditions. It is rational for the S-Module to set up the system this way because it leads to the reward. It is rational for the E-Module to drink the toxin because it is following the constitutive rules of its operation, which were set when the intention was formed. The paradox dissolves because the question "Why drink the toxin at T2?" has two different answers depending on which module is asking. For the S-Module, the answer is "Because it secured the million dollars." For the E-Module, the answer is "Because I am the kind of agent who executes formed intentions."

  This reframing shifts the Toxin Puzzle from a problem of prediction to a problem of architectural integrity. The inability to drop the intention at T2 is not a failure of rationality; it is a feature of the modular design that allows for intention formation in the first place. If the E-Module could always recalculate at T2, genuine intention would be impossible. Therefore, the modular constraint is a condition for the possibility of intending.

  However, this application raises further questions for the project to investigate. Does the E-Module know it is being manipulated? If the E-Module knows that the S-Module set it up to drink the toxin, does that knowledge undermine the intention? If the E-Module is truly modular, it should not have access to the S-Module's manipulation data during execution. But if the agent is unified, this information is internal. This brings us back to the unity question. The project will need to define the limits of inter-module knowledge. Is the modularity transparent or opaque? If opaque, does the agent cease to be a single person? If transparent, does the paradox return?

  The project will argue for a specific type of opacity: normative opacity. The E-Module can know *that* it has an intention, but it cannot access the *calculative basis* for that intention during execution. It knows "I intend to drink," but it does not process "I intend to drink because S-Module calculated +$1M." This preserves the sincerity of the intention without requiring self-deception. The E-Module is not deceived; it is simply operating on a different normative register.

  By working through the Toxin Puzzle in this detail, the project will demonstrate the explanatory power of the modular model. It shows how indirect normativity (the rule to execute intentions) can be maintained even in the face of direct normative pressure (the utility of not drinking). The rule is not just a heuristic; it is the operating system of the executive function.

  ## 5. The Reducibility Challenge: Distinct Category or Extra Steps?

  The most significant philosophical hurdle for this project is the reducibility challenge. Even if the modular model solves the Toxin Puzzle, does it actually save indirect normativity as a distinct category? Or is it just direct normativity implemented through a complex chain of causation?

  Consider the system as a whole. The S-Module chooses the rules for the E-Module based on outcome optimization. The E-Module follows the rules. The total system output is optimized. From a "God's eye view" of the agent, everything is determined by direct normative calculation performed by the S-Module. The E-Module's rule-following is merely the mechanical execution of the S-Module's direct calculation. If this is true, then indirect normativity has collapsed. The rules are not genuinely normative for the agent; they are just causal levers pulled by the true normative source (the S-Module).

  To resist this collapse, the project must argue that the E-Module's deliberation has independent normative weight. It is not enough that the S-Module *causes* the E-Module to follow rules. The E-Module must be *justified* in following rules in a way that is not reducible to the S-Module's justification. This requires a theory of divided agency where the parts have normative standing relative to the whole.

  One approach is to argue that the S-Module cannot foresee all contingencies. Therefore, it cannot directly normatively govern every action. It must delegate normative authority to the E-Module. This delegation is not just causal; it is a transfer of rational jurisdiction. The E-Module is not a puppet; it is a trustee. When the E-Module deliberates, it does so using its own normative standards (rules), not the S-Module's standards (outcomes). Because the S-Module cannot access the local information at T2 as well as the E-Module, the S-Module must defer to the E-Module's rule-based judgment.

  However, in the Toxin Puzzle, the S-Module *does* foresee the contingency. It knows exactly what will happen at T2. So the delegation argument is weaker there. A stronger argument relies on the nature of intention itself. Intention requires a closure of deliberation. If the S-Module keeps deliberating at T2, there is no intention, only a continuous stream of calculations. For intention to exist, deliberation must stop. Therefore, the E-Module *must* operate indirectly. It must treat the intention as a fixed point, not a variable to be optimized.

  This suggests that indirect normativity is a condition for the existence of certain mental states (intentions), not just a strategy for achieving outcomes. If you cannot deliberate indirectly (i.e., treat some norms as fixed), you cannot intend. If you cannot intend, you cannot participate in certain rational practices (promising, planning, committing). Therefore, indirect normativity is constitutive of rational agency in a way that direct normativity is not. Direct normativity can describe the justification for the system, but it cannot describe the operation of the system without destroying the system's functionality.

  This distinction—between justificatory structure and operational structure—is where the project will locate the distinctiveness of indirect normativity. Direct normativity belongs to the justificatory layer (S-Module). Indirect normativity belongs to the operational layer (E-Module). They are not competing theories of the same thing; they are descriptions of different layers of the same agent. The collapse objection fails because it tries to reduce the operational layer to the justificatory layer, ignoring the functional necessity of the separation.

  The project will dedicate significant space to fleshing out this layer distinction. It will examine whether this distinction holds up under scrutiny. For example, if the S-Module can rewrite the E-Module's rules at any time, is the separation real? The project will argue that there are constraints on rewriting. You cannot rewrite your executive function in the middle of an action without ceasing to be an agent. This temporal constraint creates the space for indirect normativity to exist as a genuine category.

  ## 6. Methodology and Scope Check

  The methodology for this project is primarily conceptual modeling and comparative analysis. It does not involve empirical data collection or formal logic proofs, but rather the construction of a coherent philosophical framework and stress-testing it against known paradoxes.

  **Phase 1: Model Construction (Weeks 1-4)**
  Define the Modular Agent framework precisely. Distinguish between psychological modularity (descriptive) and normative modularity (prescriptive). Establish the definitions of S-Module and E-Module. Define the nature of the "firewalls" (informational, causal, or normative).
  *Deliverable:* A 1500-word section defining the metaphysics of the modular agent.

  **Phase 2: Application to Toxin Puzzle (Weeks 5-8)**
  Apply the model to Kavka's Toxin Puzzle. Map the standard solutions against the modular solution. Identify where the modular solution offers explanatory advantages (e.g., resolving the intention-belief tension).
  *Deliverable:* A 2000-word case study analysis.

  **Phase 3: The Collapse Test (Weeks 9-12)**
  Engage with the reducibility objection. Argue for the non-reducibility of operational norms to justificatory norms. Explore the implications for the unity of agency.
  *Deliverable:* A 2000-word critical analysis.

  **Phase 4: Synthesis and Scope Review (Weeks 13-15)**
  Combine the sections into a cohesive paper. Refine the argument based on the scope check. Ensure the conclusion clearly states the status of indirect normativity.
  *Deliverable:* Final 6000-word paper.

  **Scope Check:**
  Is this too ambitious for one semester? The risk lies in the metaphysics of agency. Debates about the unity of agency are deep and complex. Spending too much time defending the possibility of modular agency could detract from the normative analysis. To manage this, the project will take the possibility of modular agency as a working hypothesis rather than trying to prove it from scratch. The focus will remain on the *normative implications* of the model, not the metaphysical proof of the model itself. If the model is coherent, the normative results follow.

  Another risk is the Toxin Puzzle itself. It is a well-trodden path. There is a danger of getting bogged down in the literature on the puzzle rather than using it as a tool for the modular theory. The project will mitigate this by strictly limiting the discussion of standard solutions to what is necessary to highlight the modular advantage. The puzzle is a test case, not the topic.

  The word count of 6000 words is sufficient to cover these bases if the writing is dense and focused. It allows for roughly 1500 words per major section, which is enough to develop an argument without getting lost in tangentials. The key is to avoid broad surveys of indirect normativity and stay focused on the structural comparison between unified and modular models.

  ## 7. Failure Conditions

  A research project must define what constitutes failure to ensure rigor. For this project, there are three specific failure conditions.

  **Failure Condition 1: Full Reducibility**
  If it turns out that the modular model can be fully described as a unified agent simulating modularity, the distinctiveness of indirect normativity collapses. If the "firewalls" are just self-imposed rules that a unified agent can choose to bypass at will, then we are back to the standard problem of why the agent wouldn't bypass them. The project fails if it cannot establish that the modularity is structurally necessary rather than strategically optional. To avoid this, the project must demonstrate that bypassing the firewall destroys the capacity for intention, not just reduces utility.

  **Failure Condition 2: Fragmentation of Agency**
  If the modular model implies that the S-Module and E-Module are separate agents, the project shifts from individual ethics to inter-personal ethics. This would undermine the goal of explaining individual deliberation. If the "agent" is just a society of homunculi, then the normative problem changes entirely (how do they cooperate?). The project fails if it cannot maintain a sense of single-agent identity despite the modular structure. To avoid this, the project must argue for a functional unity that accommodates structural diversity.

  **Failure Condition 3: No Normative Payoff**
  If the modular model solves the Toxin Puzzle but offers no insight into broader normative questions (e.g., moral rules, promises, obligations), it remains a niche solution to a logic puzzle. The project fails if it cannot generalize the findings to indirect normativity in moral contexts. To avoid this, the conclusion will explicitly connect the findings to broader debates about rule-following and moral commitment.

  If any of these conditions are met, the hypothesis that modularity saves indirect normativity will be untenable. In such a case, the paper would pivot to documenting *why* it fails, which is still a valuable philosophical result (proving the resilience of the unity assumption). However, the primary aim is to show that the modular path is viable.

  ## 8. Conclusion: The Architecture of Rationality

  This proposal argues that the stalemate in debates over indirect normativity is due to an outdated model of agency. By assuming a unified deliberator, we force indirect norms into the position of second-best strategies or self-deceptive tricks. By adopting a modular model, we can view indirect norms as architectural features of rational agency. The firewalls between strategic calculation and executive action are not limitations to be overcome, but conditions to be maintained.

  The Toxin Puzzle serves as the proving ground for this theory. It shows how intention requires a closure of deliberation that only a modular structure can guarantee without paradox. The project will demonstrate that indirect normativity remains a distinct category because it governs the operational layer of agency, which is functionally distinct from the justificatory layer.

  If successful, this research contributes to practical reason by offering a new metaphysics for normative theory. It suggests that being rational is not just about thinking the right thoughts, but about structuring your mind in the right way. It bridges the gap between philosophy of mind and ethics, showing that how we are built matters for what we ought to do. For a one-semester seminar, this scope is tight but manageable, provided the focus remains on the normative implications of the structure rather than the metaphysics of the structure itself. The failure conditions provide clear checkpoints to ensure the argument does not drift into reducibility or fragmentation.

  Ultimately, the project seeks to show that indirect normativity is not about hiding the truth from oneself. It is about organizing the self such that different truths are relevant at different levels of operation. In doing so, it rescues indirect normativity from the charge of irrationality and establishes it as a core component of ideal deliberative architecture. This niche angle avoids regurgitating the standard two-level debate by changing the underlying ontology of the debater. It is not about what the agent chooses, but about what the agent *is*.
