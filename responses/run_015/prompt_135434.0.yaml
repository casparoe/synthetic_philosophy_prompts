  hey, i'm putting together a proposal for my practical-reason seminar — about 6000 words, one semester — and i need to turn a half-baked idea into something actually gradable. my core interest is indirect normativity, the kind of norms you're supposed to follow without making them the direct object of deliberation, but i want to push past the usual framing where there's just one unified agent who either applies a rule or breaks it. instead i'm proposing we model idealized deliberation as modular: different reasoning subsystems that recieve different inputs, where the firewalls between them aren't just psychological quirks but part of the normative architecture itself. the precise question is whether indirect normativity remains a distinct category once the ideal deliberator can be compartmentalized, or whether it collapses into direct normativity with extra steps. i want to compare the standard two-level consequentialist framework with this modular-agent model, using the classic toxin puzzle reframed as an inter-module conflict rather than a single-agent paradox, and i need the proposal to say exactly why existing answers leave this open.

  the method would be mostly conceptual modeling: construct the modular case, check whether indirect rules still do explanatory work that direct rules can't replicate, and see if the residue points to a real normative distinction or just to descriptive preference fragmentation. i also want an honest scope check — is this too ambitious for one semester? — plus a clear failure condition, like if the modular framing turns out fully reducible to standard agent-splitting without any normative payoff. please start with the proposal text itself, no preface or commentary, and don't bother with citations or a bibliography since i'll add those myself. (i also realise this might sound weird but thats kind of the point — i want the angle slightly niche so its not just regurgitating the same two-level debate everyone writes about.)
