  *   **Domination vs. Lexical:** It asserts saving present lives is "morally worthless" (lexical priority). Most longtermists argue future interests *dominate* due to scale, not that present suffering has zero value; trade-offs exist.
  *   **Expected Value vs. Prediction:** The summary demands specific 500-year forecasts. Longtermism relies on expected value reasoning under uncertainty (probability × impact); robustness matters more than precision, so the "unpredictable" critique misses the methodological point.
  *   **Policy & Epistemology:** The "defund global health" claim is a strawman; most advocates argue for marginal resource reallocation. The "sci-fi" criticism fails because longtermism uses expected value under uncertainty, not precise forecasting, which is standard in decision theory.
