answer: |-
  Here is the specification you asked for. I have converted your breakdown points into functional requirements for a regulatory theory of consciousness, followed by the analysis of constraints and the scorecard.

  ### The Specifications

  **1. The Calibration Bridge (from Anchoring)**
  *   **Requirement:** The theory must explicitly state the inference rule used to move from human self-report (the only ground truth) to non-verbal systems, without requiring homologous hardware.
  *   **Case:** If you validate pain markers against human reports, you are calibrating to human neurology. To apply this to a crustacean, you must argue why the *function* of that marker matters more than the *substrate*. A theory that relies on "human-like cortex" fails the bridge; a theory that relies solely on "avoidance behavior" fails the calibration. You need a stated mapping rule.

  **2. The Conflict Resolution Protocol (from Discordance)**
  *   **Requirement:** The theory must provide a hierarchy or weighting system for contradictory markers (e.g., behavioral flexibility vs. lack of analgesic response vs. neural complexity).
  *   **Case:** Regulators cannot act on a checklist where Item A says "yes" and Item B says "no." A theory must specify if neural complexity trumps behavioral rigidity, or if a single negative pharmacological marker vetoes positive behavioral evidence. Without this, the theory is not a decision procedure; it is a menu.

  **3. The Mimicry Filter (from Ersatz-Flexibility)**
  *   **Requirement:** The theory must distinguish between systems that *simulate* the functions of consciousness and systems that *instantiate* them, specifically addressing simple reinforcement learners and decentralized biological networks.
  *   **Case:** If a chatbot or a slime mold passes the behavioral tests, the theory must explain why they are not sentient, or accept that they are. If the theory cannot differentiate a complex reflex from an experience, it will mandate welfare for thermostats or ban pest control for plants.

  **4. The Subject Boundary Definition (from Split/Interrupted Subject)**
  *   **Requirement:** The theory must define the spatial and temporal unit of the "subject" to which welfare applies.
  *   **Case:** In a lobster, is the subject the whole animal or the ganglia in each leg? In a bee that undergoes metamorphosis, is the larva the same subject as the adult? In a colonial siphonophore, is it one animal or a colony of sentient zooids? Regulation requires a billable unit; the theory must identify it.

  **5. The Ontology-Value Separation (from Distinction Collapses)**
  *   **Requirement:** The theory must output a status (conscious/not/probabilistic) distinct from a moral weight (how much that consciousness matters).
  *   **Case:** Legislators often conflate "can feel pain" with "how much we must protect them." A theory might determine an insect is conscious (ontology) but has a very low capacity for suffering (value). If the theory conflates these, it pre-empts the democratic/policy decision on how to weigh that suffering against human need.

  **6. Decision-Theoretic Compatibility (from The Numbers)**
  *   **Requirement:** The theory must be capable of outputting a confidence interval or probability estimate, not just a binary verdict.
  *   **Case:** You asked if this is smuggling. For *metaphysics*, yes. For *regulation*, no. When the population at risk is in the trillions (insects), a "50% chance" of sentience creates a different expected value than a "1% chance." A theory that only outputs "Yes/No" forces regulators to treat a guess as a fact. To be action-guiding under uncertainty, the theory must quantify the uncertainty.

  ***

  ### The Three Constraints

  **1. Non-Negotiables vs. Camp Preferences**
  *   **Non-Negotiable:** *The Calibration Bridge* and *The Mimicry Filter*. Without these, you are either measuring nothing (no link to ground truth) or measuring everything (no filter for complexity). These are epistemic necessities for any claim about reality.
  *   **Camp Preference:** *The Conflict Resolution Protocol*. Neuroanatomists will demand neural markers veto behavioral ones; ethologists will demand the reverse. This is not a hard constraint of nature, but a political choice the theory must force into the open.
  *   **Contextual Non-Negotiable:** *Decision-Theoretic Compatibility*. This is not required for a *true* theory of consciousness, but it is required for a *usable* one. If your interviewees resist this, they are arguing for metaphysics, not regulation.

  **2. Internal Inconsistencies**
  *   **The Calibration Tension:** There is a direct conflict between **Requirement 1 (Calibration Bridge)** and **Requirement 3 (Mimicry Filter/Hardware Agnosticism)**.
      *   *The Conflict:* To calibrate to humans (Req 1), you must rely on human hardware (cortex, specific neurotransmitters). To avoid chauvinism and include octopuses (Req 3), you must ignore human hardware and look for functional isomorphs.
      *   *Which Gives:* You cannot have both perfect calibration and perfect agnosticism. A regulatory theory must choose a "margin of error." It will either be biased toward human-like systems (false negatives for aliens/octopuses) or biased toward functional complexity (false positives for advanced AI/simple networks). The theory must declare which error it tolerates.

  **3. The Killer Requirement**
  *   **The Mimicry Filter (Ersatz-Flexibility).**
  *   **Why:** This is the point where the largest share of current theories collapse.
      *   *Behavioral theories* fail because simple algorithms and decentralized organisms pass the tests.
      *   *Structure-first theories* fail because they often cannot explain *why* the structure creates experience rather than just complex processing, leaving the "mimic" charge unanswered.
      *   *Functional theories* struggle to define the threshold where "processing" becomes "feeling" without arbitrariness.
      *   Most interviewees will wave this away with "intuition," but for a regulator, intuition is not a defense against a lawsuit or a trade ban. This requirement forces the theory to explain the *difference* between a zombie and a subject, which most current frameworks assume rather than prove.

  ***

  ### The Scorecard

  **Structure-First Views (Neuroanatomy)**
  *   **Content:** Consciousness requires specific physical hardware (e.g., cortex, specific neural density, integrated information structures).
  *   **Hardest Requirement:** *The Calibration Bridge.* They excel here for humans but fail to bridge to non-homologous systems without appearing chauvinistic. They struggle to explain why an octopus with a distributed nervous system should count, often forcing them into arbitrary "complexity" cutoffs that look like goalpost-moving.

  **Behavioral and Marker-Based Views**
  *   **Content:** Consciousness is inferred from observable outputs (trade-offs, analgesic seeking, protective guarding).
  *   **Hardest Requirement:** *The Mimicry Filter.* This is their fatal vulnerability. A reinforcement learning agent can trade costs; a plant can signal damage. Without a deep account of *why* the behavior implies an inner state rather than a complex reflex, this view risks regulating software and flora.

  **Functional/Organizational Views (Global Workspace, Predictive Processing)**
  *   **Content:** Consciousness arises from specific computational architectures (self-modelling, global access, error correction) regardless of substrate.
  *   **Hardest Requirement:** *The Subject Boundary Definition.* Functional boundaries are porous. If consciousness is a "process" rather than a "thing," it is unclear where the subject starts and stops, especially in metamorphosing or colonial organisms. Regulators cannot legislate a process that flickers in and out of existence hourly.

  **Pluralist/Weight-of-Evidence Views (The Current Official Method)**
  *   **Content:** No single marker is sufficient; consciousness is inferred from a convergence of neural, behavioral, and evolutionary data.
  *   **Hardest Requirement:** *The Conflict Resolution Protocol.* This approach implicitly admits it has no theory to resolve discordance. When markers conflict (e.g., complex brain but rigid behavior), the Pluralist has no rule for which weight tips the scale. It works for consensus-building among scientists but fails as a decision procedure for a regulator who needs a binary "protected/not protected."
