answer: |-
  Your premise is correct. The move to continuous, probabilistic state spaces does not dissolve the frame problem; it generalizes it from a logical bookkeeping issue into a problem of **factorization maintenance under inferential entanglement**.

  The discrete formulation obscures the deeper issue because it treats "unchanged" as a binary property of a fluent. In continuous belief spaces, "unchanged" is a property of a *distribution's marginal*, and the computational explosion arises not from listing axioms, but from the impossibility of tracking the correlations that actions induce across irrelevant dimensions.

  Here is the step-by-step breakdown of why the structural failure recurs, formally and intuitively.

  ### 1. The Formal Setup: Densities and Kernels

  In the discrete deterministic case, a state is a vector of fluents $F = \{f_1, \dots, f_n\}$. An action $a$ maps $F_t \to F_{t+1}$. The frame problem is: How do we specify $F_{t+1}$ without writing $f_i^{t+1} = f_i^t$ for all unaffected $i$?

  In the continuous probabilistic case:
  *   **State:** $x \in \mathbb{R}^n$.
  *   **Belief:** A probability density $p_t(x)$.
  *   **Action:** A transition kernel (conditional density) $K(x' \mid x, a)$.
  *   **Update:** The Chapman-Kolmogorov equation:
      $$p_{t+1}(x') = \int_{\mathbb{R}^n} K(x' \mid x, a) \, p_t(x) \, dx$$

  **The Gut-Level Translation:**
  In logic, you have to assert inertia for every variable. In probability, you have to integrate over every variable. If the kernel $K$ couples every dimension of $x$ to every dimension of $x'$, the integral is intractable ($O(n^2)$ or exponential in dependencies). To make progress, you must assume $K$ is **sparse**.

  ### 2. The Recurrence: Dynamics Sparsity vs. Belief Sparsity

  The frame problem survives because there are two distinct layers of sparsity, and they fight each other.

  **Layer 1: Dynamical Sparsity (The Physics)**
  We assume the action $a$ is local. It physically affects only a subspace $x_S \subset x$ (the "active" variables). The rest $x_U$ (the "unchanged" variables) are dynamically inert.
  Formally, the kernel factorizes:
  $$K(x' \mid x, a) = K_S(x'_S \mid x_S, a) \cdot \delta(x'_U - x_U)$$
  where $\delta$ is the Dirac delta function (identity transition). This is the probabilistic equivalent of frame axioms. It says: "The physics does not touch $x_U$."

  **Layer 2: Belief Sparsity (The Representation)**
  To compute the update integral efficiently, the belief $p_t(x)$ must also factorize. We need $p_t(x) \approx \prod p_t(x_i)$ or some sparse graphical structure.
  **Here is the failure point:** Even if the *physics* is sparse (Layer 1), the *belief* is rarely sparse (Layer 2).

  **Why?** Because of **inferential entanglement**.
  Suppose $x_1$ is affected by the action, and $x_2$ is not. However, in your prior belief $p_t(x)$, $x_1$ and $x_2$ are correlated (e.g., you know the total mass is conserved, or you observed them together previously).
  When you update $x_1$ via the action, you gain information about $x_1$. Because $x_1$ and $x_2$ are correlated in $p_t$, Bayes' rule forces you to update your belief about $x_2$, *even though the action did not touch $x_2$*.

  **The Structural Failure:**
  In the discrete logical case, the frame problem is "How do I stop $f_2$ from changing?"
  In the continuous probabilistic case, the frame problem is "How do I stop $p(x_2)$ from changing when I have no computational budget to process the correlation between $x_1$ and $x_2$?"

  If you respect the correlations, you must update the entire joint distribution. The "unchanged" variables change their marginals due to inference, not dynamics. If you ignore the correlations to save compute, you are making a **frame assumption**: you are asserting conditional independence where none logically exists.

  ### 3. The Explosion Relocated: Variational Projection

  You asked whether carving beliefs into an **explicit base plus derived extensions** solves the explosion.
  *   **Base:** The parameters of a tractable family (e.g., mean and covariance of a Gaussian, or weights of a neural net).
  *   **Derived:** The full density or high-order moments implied by the base.

  In probabilistic robotics and filtering (e.g., Kalman Filters, Particle Filters), this is exactly what we do. We maintain a "base" (Gaussian parameters) and treat the full density as "derived."

  **Does this solve it? No. It relocates the problem to the Projection Step.**

  When you apply the transition kernel $K$, the true posterior $p_{t+1}(x')$ usually leaves the tractable family. A Gaussian becomes non-Gaussian; a factored distribution becomes coupled.
  To stay within your "base" representation, you must **project** the true posterior back onto the tractable family (e.g., Moment Matching, Variational Inference).

  $$p_{t+1}^{\text{approx}} = \text{Proj}_{\mathcal{Q}} \left[ \int K(x' \mid x, a) \, p_t(x) \, dx \right]$$

  **The Frame Problem Re-emerges Here:**
  The projection operator $\text{Proj}_{\mathcal{Q}}$ must decide which correlations to keep and which to discard.
  *   If you keep all correlations, the base size grows quadratically ($O(n^2)$ covariance matrix), leading to explosion.
  *   If you discard correlations (e.g., assuming a diagonal covariance), you are effectively writing **frame axioms**. You are asserting that $x_i$ and $x_j$ are independent *after* the update.

  **The Guts of the Issue:**
  The "rules of derivation" (the projection step) require a meta-rule to decide what to ignore.
  *   *Logic:* "Assume $f_j$ is unchanged unless stated otherwise."
  *   *Probability:* "Assume $x_j$ is independent of $x_i$ unless the correlation coefficient exceeds threshold $\epsilon$."

  This thresholding *is* the frame problem. You are bounding your reasoning (avoiding logical omniscience) by arbitrarily severing inferential links. The risk is that an action subtly entangles two variables you assumed were independent, and your "frame assumption" causes you to miss a catastrophic dependency (the probabilistic equivalent of the robot not realizing the bomb moved with the wagon).

  ### 4. Why Measure-Zero Arguments Fail

  You raised the possibility that continuous spaces might dissolve the problem via measure-zero considerations. This is a common intuition but incorrect for belief revision.

  *   **Ontological vs. Epistemic:** Measure-zero arguments apply to the *state* of the world (ontological). The set of states where a specific complex condition holds might be small.
  *   **Belief Mass:** Belief revision operates over *probability mass*, not single points. Even if the set of "changed" states is small, the *uncertainty* about them can spread mass across the entire space.
  *   **Support:** If your belief $p_t(x)$ has support over $\mathbb{R}^n$, the integral for the update ranges over $\mathbb{R}^n$. You cannot ignore dimensions simply because they are continuous. You must integrate them out. If you don't have a factorization (frame assumption), the integration cost scales with dimension.

  Continuity actually makes it worse. In discrete logic, a fluent is either true or false. In continuous spaces, a variable can be "mostly unchanged" but with shifted variance. Tracking the evolution of variance (second-order frame properties) is often harder than tracking the mean (first-order).

  ### 5. Summary: The Invariance of the Problem

  The frame problem is not about discreteness or determinism. It is about **Representational Inertia**.

  1.  **Logical Form:** How to represent that $N-1$ propositions remain true without $N-1$ axioms?
  2.  **Probabilistic Form:** How to represent that $N-1$ marginal distributions remain invariant without integrating over $N$ dimensions?
  3.  **Bounded Rationality Form:** How to justify dropping correlations (independence assumptions) during belief update without missing critical side effects?

  The move to continuous probability transforms the frame problem from a **syntactic** inconvenience (too many axioms) to a **computational** necessity (must factorize to integrate).

  **Direct Answer to your Specific Questions:**
  *   **Why does the failure recur?** Because dynamical locality (physics) does not guarantee belief locality (inference). Correlations propagate change to "unchanged" variables, forcing the agent to either compute the intractable joint update or arbitrarily prune dependencies.
  *   **Does explicit/base + derived solve it?** No. It moves the burden to the **projection operator**. The agent must still decide which dependencies to preserve in the base parameters. That decision rule is the modern, probabilistic frame axiom.
  *   **Does continuity dissolve it?** No. It exacerbates the integration burden, making factorization (frame assumptions) strictly necessary rather than optional.

  The frame problem survives because any agent with bounded resources must assume the world is more modular than it logically is. In discrete logic, this is a "frame axiom." In continuous belief, it is a "mean-field assumption." Both are lies we tell ourselves to make the math fit in our heads.
