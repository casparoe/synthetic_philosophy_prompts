          *   In probabilistic terms: Base = Parameters of the density. Derived = Moments/Queries.
          *   If you update the Base, you must re-derive. If the derivation rules (the model structure) don't explicitly encode *what didn't change*, you can't compute the new Base efficiently.
          *   The "rules of derivation" become the transition kernel. If the kernel isn't sparse, you're dead. If it is sparse, you still have to manage the *dependencies* induced by the prior.

  5.  **Addressing the "Measure Zero" Objection:**
      *   Does continuity dissolve it? No. Measure zero arguments apply to specific states, but belief is over sets/regions. The volume of the "unchanged" subspace is still the bulk of the space, and integrating over it requires knowing it's unchanged.

  6.  **Synthesizing the "Gut Level" Explanation:**
      *   The Frame Problem is about *inertia*. Things stay the same unless pushed.
