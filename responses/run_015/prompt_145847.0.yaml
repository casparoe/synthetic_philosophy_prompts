          *   *Correction:* The Frame Problem is about specifying $K$. How do we specify $K$ without listing all $x_j' = x_j$?
          *   *Refinement:* In continuous spaces, we usually assume additive noise on specific dimensions. $x' = f(x, a) + \epsilon$.
          *   *The Real Issue:* Factorization. To avoid explosion, $p(x)$ must be represented factored (e.g., Graphical Models). The transition $K$ must respect that factorization.
          *   *The Recurrence:* When you update, the factorization often breaks (correlations are introduced). You must project back onto a factored form (e.g., Mean Field, Kalman). This projection *is* the frame axiom generation. You have to decide which correlations to keep and which to drop (assume independence). That decision process is the modern Frame Problem.

      *   **Step 5: Explicit vs. Derived (Base + Extensions).**
          *   User asks: Does carving beliefs into base + derived solve it?
