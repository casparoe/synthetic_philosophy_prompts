      *   In Probability: The "unchanged" part of the distribution must remain invariant under the transition operator.
      *   The computational cost comes from verifying that invariance.
      *   In high-dimensional continuous spaces, "verifying invariance" means integrating over irrelevant dimensions. If you don't explicitly factorize, you integrate over everything.
      *   Factorization = Frame Assumptions.
      *   Maintaining Factorization during updates = The persistent difficulty.

