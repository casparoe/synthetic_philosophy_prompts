  2.  **Initial Assessment of the Premise:**
      *   *Is the user right?* Yes. The frame problem is not merely about discrete fluents or deterministic actions. It is fundamentally about *representation* and *computational tractability* of change vs. non-change.
      *   *Does continuous probability dissolve it?* No. In fact, it often exacerbates the computational burden because "non-change" isn't a binary switch; it's a distribution that needs to remain invariant across dimensions irrelevant to the action.
      *   *Does explicit/derived partition solve it?* No. It shifts the burden to the derivation rules (the "frame axioms" become "update kernels" or "transition densities"), which still require explicit specification of independence.

  3.  **Formalizing the Intuition (The "Formal Bones"):**
      *   *Discrete/Deterministic:* State $S$ is a vector of fluents. Action $A$ changes $f_i$. Frame problem: How to assert $f_j' = f_j$ for all $j \neq i$ without writing $N-1$ axioms?
      *   *Continuous/Probabilistic:* State $x \in \mathbb{R}^n$. Belief is a density $p(x)$. Action is a transition kernel $T(x'|x, a)$.
      *   *The Update:* $p_{new}(x') = \int T(x'|x, a) p_{old}(x) dx$.
      *   *The Frame Issue:* If action $a$ only affects dimension $x_1$, the kernel must factorize: $T(x'|x, a) = T_1(x_1'|x_1, a) \cdot \delta(x_{-1}' - x_{-1})$.
      *   *The Explosion:* In high dimensions, specifying the joint kernel explicitly is impossible. We rely on *conditional independence*. But maintaining that independence structure through updates is the hard part.

  4.  **Drafting the Argument - Step-by-Step:**

      *   **Step 1: Define the Belief State.**
          *   Discrete: Set of true propositions.
          *   Continuous: Probability density function (PDF) over $\mathbb{R}^n$.
          *   Problem: A PDF is an infinite object. We need a parametric representation (e.g., Gaussian, Particle Filter).

      *   **Step 2: Define the Action/Transition.**
          *   Deterministic: Function $f: S \to S$.
          *   Probabilistic: Markov Kernel $K(x' | x, a)$.
          *   Key Insight: For the frame problem to be "solved," the kernel must be *sparse*. It should only couple specific input dimensions to specific output dimensions.

      *   **Step 3: The Update Mechanism (Bayes/Chapman-Kolmogorov).**
          *   $p_{t+1}(x') = \int K(x' | x, a) p_t(x) dx$.
          *   If $K$ is dense (all $x$ affect all $x'$), computation is $O(\text{dim}^2)$ or worse.
          *   If $K$ is sparse (frame assumption), we hope for efficiency.

      *   **Step 4: Where the Frame Problem Hides in Continuity.**
          *   In discrete logic, "unchanged" means $f' \leftrightarrow f$.
          *   In continuous probability, "unchanged" means *marginal invariance* or *conditional independence*.
