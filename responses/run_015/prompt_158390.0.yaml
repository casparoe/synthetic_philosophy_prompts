answer: |-
  Hey, great to catch you. So, regarding that seminar on cross-cultural folk morality—here's how I'd break it down. First, off the top of my head, here are three divergences that aren't just statistical noise but reflect deep structural differences:

  1.  **Ontological Boundaries of Patienthood:** In many WEIRD societies, moral patienthood is tied to sentience or rationality. In contrast, some animist or indigenous frameworks extend moral standing to ancestors, spirits, or even geographical features, meaning a "harm" can occur without a biological victim.
  2.  **Weighting of Mental States vs. Outcomes:** We tend to prioritize intent (knobe effect aside). Some cultures prioritize outcome or purity. If a ritual is botched accidentally, the blame might be higher than if it was skipped intentionally, because the spiritual contamination is the same regardless of mind.
  3.  **Scope of Obligation (Universal vs. Relational):** Western ethics often leans toward universal duties (rights). Many small-scale societies operate on relational ethics where duty is concentric; harming an out-group member might be neutral, while harming an in-group member is catastrophic, regardless of the act itself.

  Anyway, here's that exam question you asked for. I tried to really lock them into that specific horticulturist case so they can't just regurgitate Haidt.

  ***

  **EXAM QUESTION**

  Consider the Kaelo, a small-scale horticulturist society. Ethnographic data reveals that in resource-conflict scenarios (e.g., crop encroachment), the Kaelo judge accidental harm as *more* blameworthy than intentional harm. Their rationale is that intentional harm signals a recognized adversarial alliance (a form of social engagement), whereas accidental harm signals negligence of the relational duty to maintain vigilance over shared boundaries.

  Using this case, answer the following:
  1.  Distinguish clearly between descriptive relativism and normative anti-realism. Does the Kaelo case prove the latter?
  2.  Evaluate the Control Principle ("an agent is responsible only for what is under their control") in this context. If the Kaelo blame accidents more than intentions, does this render the Control Principle self-undermining when applied cross-culturally? Defend your position.

  *(No external materials permitted.)*

  ***

  **MODEL ANSWER**

  The Kaelo case presents a striking challenge to standard Western moral psychology, but we must be careful not to conflate descriptive differences with metaethical conclusions. Descriptive relativism is the empirical claim that moral beliefs and practices vary across cultures. Normative anti-realism is the philosophical claim that there are no objective moral truths independent of human opinion. The existence of the Kaelo judgment pattern confirms descriptive relativism—they literally hold different beliefs about blame than we do. However, this does not entail normative anti-realism. Just because people disagree about the shape of the earth doesn't mean the earth has no objective shape. Similarly, the Kaelo might be mistaken about blame, or we might be, or there is a deeper principle we both share but apply differently. The data alone cannot bridge the is-ought gap to prove anti-realism.

  The harder issue is the Control Principle. Traditionally, this principle holds that moral responsibility requires voluntary control. Intentional acts are paradigmatically under control; accidents are not. The Kaelo inversion—blaming accidents more—seems to violate this. If we insist the Control Principle is universal, the Kaelo practices appear irrational. However, calling it self-undermining depends on how we define "control."

  If control is defined physically (could I stop my body from doing this?), the Kaelo reject the principle. But if control is defined normatively (did I fail in my duty to manage risk?), the Kaelo might actually uphold a stricter version of control. For them, maintaining relational vigilance is within your control, even if the specific slip is not. The accident reveals a prior failure of control over one's attentiveness to the alliance.

  However, this risks making the Control Principle self-undermining if "control" is entirely determined by local norms. If what counts as "under control" is just whatever a culture says it is, then the principle loses its normative force and becomes descriptive again. It would mean "you are responsible for what your culture says you are responsible for," which is circular. To avoid this, we must argue for a hybrid view: there is a baseline of physical control required for responsibility, but the *scope* of required vigilance is culturally modulated. The Kaelo expand the scope of duty to include accident prevention in resource conflicts. This preserves objectivity (the principle holds) while accommodating diversity (the application varies). Thus, the Kaelo case challenges the content of our duties, not necessarily the structure of moral responsibility itself.

  ***

  **MARKING SCHEME (20 Marks Total)**

  1.  **Definition Distinction (4 marks):** Clearly defines descriptive relativism (empirical claim) vs. normative anti-realism (metaethical claim).
      *   *Botch:* Students claim disagreement proves there is no truth.
  2.  **Application to Kaelo (4 marks):** Correctly identifies that the case supports descriptve relativism but fails to logically necessitate anti-realism.
      *   *Botch:* Ignoring the specific Kaelo rationale about alliance signaling.
  3.  **Control Principle Explanation (4 marks):** Accurately states the traditional link between voluntariness/intent and responsibility.
      *   *Botch:* Assuming control only means physical muscle movement.
  4.  **Self-Undermining Analysis (4 marks):** Discusses the risk of defining control purely relative to cultural norms (circularity).
      *   *Botch:* Saying the principle is simply "false" for the Kaelo without analyzing the implication.
  5.  **Resolution/Objectivity (4 marks):** Offers a viable path to preserve objectivity (e.g., hybrid view or normative control) without dismissing the data.
      *   *Botch:* Concluding that morality is just entirely subjective locally.

  Hope this helps! Let me know if you need me to tweak the weighting. I accidentally left out the cover sheet instructions so make sure you add those back in.
