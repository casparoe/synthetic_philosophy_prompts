prompt: |-
  For several years now I have read history as an amateur, mostly the kind of book that promises to explain a century by way of a harvest, a microbe, or a mountain, and I have reached the point where I can no longer tell when such a book is actually saying something and when it has merely changed the subject in a confident tone. Before I pick up another one, I would like to know what I should be demanding of the account. So: write out the requirements that any attempt to treat non-human things — pathogens, climate, volcanoes, soil, livestock, ocean currents — as causes in history rather than as scenery has to satisfy in order to count as adequate. I am not looking for a survey of who has written what, and I do not want a reading list; I want the standard itself, the thing I could hold a book up against.

  For each requirement, give me the case or consideration that motivates it, and then mark it plainly: is it non-negotiable for any account that deserves the name, or does it turn out to be the local taste of one school of historians dressed up as a criterion? I suspect a fair number of the demands people make in this area are of the second kind, and identifying those is worth as much to me as listing the first.

  To give you something to work with, here are the puzzles I have not been able to resolve on my own. I would like the list to speak to each of them, whether by turning it into a requirement, by dissolving it, or by telling me it rests on a confusion:

  - What I have been calling the difference between backdrop and co-author. A dry decade that raises the odds of unrest, and a dry decade that determines what the unrest is about, seem to be different claims, and I cannot say what would settle which one a book is making.
  - The alibi problem. A famine that turned out to be less about how much food existed than about who could get at it makes me wary of any account in which the weather arrives just in time to relieve the people in charge of responsibility. Is there a requirement that an environmental explanation must not function as an excuse, and if so, how could that ever be more than my own politics?
  - The invisible-cause problem. Suppose a region grew drier and its farmers quietly switched crops, so that nothing at all shows up in the record. The cause was real and the effect was nil. An account that only counts visible effects will systematically under-rate non-human causes; an account that counts absorbed ones seems unable to be checked against anything.
  - The double-telling test. If the same event can be narrated twice, once with institutions as the protagonists and once with the climate, and both versions read as true and neither contradicts the other, I am not sure either has explained anything. What should a theory owe me here?
  - Proportion. It is easy to move from "the eruption made things worse" to "the eruption made this happen," and I cannot find the seam.

  Then, and this is the part I most want, tell me whether some subset of these requirements cannot all be satisfied at once. My own hunch is that insisting the account preserve human choice and responsibility, insisting that a non-human factor sometimes be the thing that makes the difference, and insisting that the account never launder the decisions of the people in power form a triangle that cannot be closed — but I have no way of knowing whether that hunch survives contact with a careful statement of each demand. If the list is itself a result in this way, say so and show the conflict.

  Finally, tell me which single requirement does the most work in ruling candidates out, and give me a short verdict on whether the word actor is earning its place in this literature at all, or whether it is decoration laid over an ordinary causal claim that could be stated without it. Keep the weight on the criteria and their motivating cases; if you mention how the familiar kinds of account fare against the list, a paragraph will do, and I will draw my own conclusions from it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** An amateur historian tired of trendy "big history" books (harvest, microbe, mountain) that obscure rather than clarify causation.
      *   **Task:** Write out the *requirements* (criteria/standards) for treating non-human things (pathogens, climate, etc.) as *causes* in history rather than *scenery*.
      *   **Constraints:**
          *   No survey of authors/books. No reading list.
          *   For each requirement: State the requirement, the motivating case/consideration, and label it (Non-negotiable vs. Local Taste/School).
          *   Address specific puzzles provided by the user (Backdrop vs. Co-author, Alibi Problem, Invisible-Cause, Double-Telling, Proportion).
          *   **Crucial:** Identify if there are incompatibilities/trade-offs between requirements (the "triangle" hunch).
          *   **Crucial:** Identify the single most exclusionary requirement.
          *   **Crucial:** Verdict on the word "actor" (is it useful or decoration?).
          *   **Tone:** Rigorous, analytical, philosophical but grounded in historical method. Avoid fluff.

  2.  **Deconstruct the Puzzles & Formulate Requirements:**

      *   *Puzzle 1: Backdrop vs. Co-author.* (Dry decade raises odds vs. determines content).
          *   *Requirement:* **Specificity of Mechanism.** The account must specify *how* the non-human factor constrains or enables specific human actions, not just correlates with general outcomes.
          *   *Status:* Non-negotiable. Without mechanism, it's just correlation/post-hoc reasoning.

      *   *Puzzle 2: The Alibi Problem.* (Weather relieving leaders of responsibility).
          *   *Requirement:* **Distribution of Agency.** The account must show how human decisions mediated the impact of the non-human factor. It cannot treat the non-human factor as a *force majeure* that absolves policy choices.
          *   *Status:* Non-negotiable (methodologically), though it feels political. History is about human action; removing agency stops it from being history.

      *   *Puzzle 3: The Invisible-Cause Problem.* (Adaptation leaves no trace).
          *   *Requirement:* **Counterfactual Robustness.** The account must be able to articulate what would have happened *without* the non-human factor, even if the visible record looks stable.
          *   *Status:* Local Taste/Methodological Hazard. It's hard to verify. Demanding it risks unfalsifiability. Better to require *evidence of adaptation* rather than positing invisible causes. Let's refine this: **Traceability of Adaptation.** If the cause was absorbed, there must be evidence of the absorption mechanism (e.g., crop records, trade shifts).

      *   *Puzzle 4: The Double-Telling Test.* (Institutions vs. Climate, both true).
          *   *Requirement:* **Explanatory Necessity.** The non-human factor must do work that human institutions *could not* have done alone in that specific context. It must change the narrative trajectory, not just add atmosphere.
          *   *Status:* Non-negotiable. If the story works exactly the same without it, it's scenery.

      *   *Puzzle 5: Proportion.* ("Made things worse" vs. "Made this happen").
          *   *Requirement:* **Causal Weighting.** The account must distinguish between necessary conditions, sufficient conditions, and triggering events.
          *   *Status:* Non-negotiable. Basic logic of causation.

  3.  **Address the "Triangle of Incompatibility":**
      *   The user suspects: (1) Preserve human choice/responsibility, (2) Non-human factor makes the difference, (3) Never launder decisions of power.
      *   *Analysis:* Can a non-human factor be decisive *without* reducing human agency to zero? Yes, if we view agency as constrained choice. Can it be decisive *without* laundering power? Yes, if we show how power failed to mitigate it.
      *   *Conflict:* The real conflict is between **Determinism** (Non-human makes the difference) and **Contingency** (Human choice preserves responsibility). If the volcano *makes* the revolution happen, human choice is diminished. If human choice *made* the revolution happen despite the volcano, the volcano is scenery.
      *   *Resolution:* The incompatibility lies in demanding *single-cause* explanations. History is multicausal. The "triangle" closes if we reject the idea that "making the difference" means "sole cause." However, there is a tension between **Structural Constraint** (Non-human limits choices) and **Moral Accountability** (Humans are responsible for choices within limits).
      *   *Refined Conflict:* The tension is between **Predictive Power** (If climate determines history, we should see patterns) and **Historical Specificity** (Human choices are idiosyncratic). You can't have a law-like environmental history *and* a nuanced political history without friction.

  4.  **Identify the "Single Most Exclusionary Requirement":**
      *   Which one kills the most bad books?
      *   Likely **Explanatory Necessity (The Double-Telling Test)**. Many books add climate as a layer but the story remains "Great Men" or "Institutions." If removing the climate chapter leaves the argument intact, it fails.
      *   Alternatively, **Specificity of Mechanism**. Many books say "drought caused revolution" without explaining *how* (price spikes? migration? legitimacy loss?).
      *   *Decision:* **Explanatory Necessity.** It's the hardest bar. It forces the author to prove the non-human element isn't just flavor text.

  5.  **Verdict on "Actor":**
      *   Is "actor" (Actor-Network Theory vibes) useful?
      *   *Critique:* It often anthropomorphizes. A virus isn't an "actor" with intent. It's a *force* or a *constraint*.
      *   *Verdict:* Decoration. "Cause" or "Constraint" is more precise. "Actor" implies agency where there is only causality.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the fatigue. Set the stage.
      *   *The Requirements:* Group them logically.
          1.  **The Mechanism Requirement** (Addresses Backdrop/Co-author).
          2.  **The Mediation Requirement** (Addresses Alibi/Responsibility).
          3.  **The Necessity Requirement** (Addresses Double-Telling).
          4.  **The Proportionality Requirement** (Addresses Proportion).
          5.  **The Traceability Requirement** (Addresses Invisible-Cause).
      *   *Labeling:* Be strict on what is methodological necessity vs. historiographical preference.
      *   *The Incompatibility:* Tackle the user's hunch. The triangle *does* have tension. Specifically, between "Non-human makes the difference" and "Human responsibility." If the non-human is the *decisive* factor, human responsibility is necessarily circumscribed. You can't have it both ways at the extreme.
      *   *The Exclusionary Requirement:* Pick **Explanatory Necessity**.
      *   *The "Actor" Verdict:* Be decisive. It's mostly metaphorical decoration.

      *(Self-Correction during drafting)*: Wait, on the "Invisible-Cause" puzzle. If farmers switch crops and nothing shows up, is it history? If there's no record, can history speak to it? The requirement should be that the historian must provide *evidence of the constraint*, not just posit it. If the adaptation is invisible, the cause is speculative. I will frame this as **Empirical Anchoring**.

      *(Refining the Triangle)*: The user's hunch is sharp. If I say "The volcano caused the fall of Rome," I reduce human responsibility. If I say "Humans caused the fall of Rome, the volcano just helped," I reduce the volcano to scenery. The middle ground is "The volcano created a crisis that specific human failures turned into a collapse." This satisfies all three, *but* it requires a very specific type of argument (interactionism). The incompatibility arises when authors seek *monocausal* elegance. I should point out that the triangle holds only if one demands *primacy*. If one accepts *conjuncture*, the triangle closes. I need to be careful here. The user asks if the requirements *cannot all be satisfied*. I should argue they *can*, but most popular books fail because they try to maximize one at the expense of others. Actually, looking closer: "Insisting a non-human factor sometimes be the thing that makes the difference" vs "Preserve human choice." If the non-human makes the difference, human choice *didn't* make the difference. That is the contradiction. I will highlight this tension.

      *(Refining "Actor")*: "Actor" comes from Latour/ANT. It suggests symmetry. But in history, symmetry is often misleading. A general and a pathogen are not symmetrical. I will argue it is decoration.

  7.  **Final Polish:** Check tone. Ensure all constraints of the prompt are met. (No reading lists, specific formatting for requirements, address the puzzles, address the triangle, verdict on "actor").

      *Structure:*
      1.  Introduction.
      2.  The Five Requirements (with Motivation and Status).
      3.  The Incompatibility Analysis (The Triangle).
      4.  The Exclusionary Requirement.
      5.  Verdict on "Actor".

      *Let's write.*
answer: |-
  You are asking for a methodology of environmental history that avoids both anthropocentric arrogance and environmental determinism. The fatigue you feel stems from a genre that often mistakes *presence* for *causation*. Just because a volcano erupted during a revolution does not mean the volcano caused the revolution.

  Below are the five requirements any account must satisfy to treat non-human things as causes rather than scenery. Following that, I address the incompatibilities you suspect, the single most exclusionary criterion, and the utility of the word "actor."

  ### The Requirements

  **1. The Mechanism Requirement**
  *   **The Demand:** The account must specify the transmission belt between the non-human event and the human outcome. It is not enough to say "drought coincided with unrest." The text must explain the chain: drought $\rightarrow$ crop failure $\rightarrow$ price spike $\rightarrow$ urban hunger $\rightarrow$ loss of legitimacy $\rightarrow$ unrest.
  *   **Motivating Case:** This addresses your **Backdrop vs. Co-author** puzzle. A backdrop raises odds (correlation); a co-author changes the mechanism (causation). If the book cannot articulate the specific link, the non-human factor is merely atmospheric pressure, not a historical agent.
  *   **Status:** **Non-negotiable.** Without a specified mechanism, the claim is astrological. It asserts influence without physics.

  **2. The Mediation Requirement**
  *   **The Demand:** The account must demonstrate how human institutions amplified or dampened the non-human shock. It must show why *this* society broke under the stress while another might have bent.
  *   **Motivating Case:** This addresses the **Alibi Problem**. If a famine is blamed solely on rain failure, the grain merchants and tax collectors are absolved. A valid account must show that the weather provided the *shock*, but policy determined the *catastrophe*.
  *   **Status:** **Non-negotiable.** History is the study of human societies. If human decision-making is removed from the causal chain, it ceases to be history and becomes climatology or geology.

  **3. The Necessity Requirement (The Double-Telling Test)**
  *   **The Demand:** If you remove the non-human factor from the narrative, the outcome must become significantly less probable or unintelligible. If the story of the revolution holds together perfectly well without mentioning the harvest, the harvest is scenery.
  *   **Motivating Case:** This addresses the **Double-Telling Test**. If an institutional history and an environmental history run parallel without intersecting, neither is explaining the *conjuncture*. The non-human factor must close a gap that human agency alone cannot explain.
  *   **Status:** **Non-negotiable.** This is the definition of a causal variable. If a variable can be removed without changing the model's output, it is not a cause.

  **4. The Proportionality Requirement**
  *   **The Demand:** The magnitude of the historical claim must match the magnitude of the environmental stress. A local crop failure cannot cause a global empire's collapse unless the account explains the extreme fragility of that empire.
  *   **Motivating Case:** This addresses **Proportion**. It prevents the slide from "made things worse" to "made this happen." It forces the historian to account for resilience.
  *   **Status:** **Non-negotiable.** This is basic logical consistency.

  **5. The Traceability Requirement**
  *   **The Demand:** If a non-human cause was "absorbed" by adaptation (your **Invisible-Cause Problem**), there must be evidence of the adaptation, not just the absence of disaster.
  *   **Motivating Case:** You worry that invisible adaptations lead to unfalsifiable claims ("The drought mattered, but they hid it well"). To count as history, the *effort* to adapt must leave a trace (e.g., records of seed imports, changes in land tenure, migration patterns). If the cause leaves no trace in the human record, it cannot be a historical cause, only a geological one.
  *   **Status:** **Local Taste / Methodological Hazard.** Strictly speaking, a cause can be real without being recorded. However, demanding traceability is necessary for *historical* verification. If we accept invisible causes that leave no trace, we enter the realm of speculation. This is a disciplinary boundary, not a law of nature.

  ***

  ### The Incompatibility Triangle

  Your hunch is correct, but the conflict is more precise than you suspect. You posited a triangle between:
  1.  Preserving human choice/responsibility.
  2.  Allowing non-human factors to "make the difference."
  3.  Not laundering the decisions of people in power.

  **These three cannot be maximized simultaneously.**

  If a non-human factor truly **makes the difference** (2)—meaning it is the decisive variable that tips the scale—then human choice (1) is necessarily constrained to the point where it is no longer the primary explanatory variable. If the volcano *determines* the fall of the city, the governor's incompetence is secondary. If the governor's incompetence *determines* the fall of the city, the volcano is merely a stressor.

  You can resolve this logically by accepting **conjunctural causation** (the volcano *and* the incompetence were both necessary), but you cannot resolve it rhetorically. Popular history books demand a protagonist. If the book makes the Climate the Protagonist to satisfy (2), it inevitably diminishes Human Responsibility (1). If it keeps Humans as Protagonists to satisfy (1), the Climate often recedes to Backdrop.

  The third point, **not laundering power** (3), is the casualty of this tension. To avoid laundering power, the historian must emphasize human agency (policy failure). But to emphasize human agency is to reduce the explanatory weight of the non-human factor.

  **The Verdict on the Triangle:** The triangle closes only if you reject the idea of a single "cause." Most books fail because they seek a singular engine of history (The Microbe, The Mountain). If you demand a book that treats causes as a *web* rather than a *line*, the tension eases. But if you ask "What made this happen?" expecting a singular answer, you force the author to choose between human agency and environmental determinism. They cannot give you both at full strength.

  ***

  ### The Single Most Exclusionary Requirement

  **The Necessity Requirement (The Double-Telling Test).**

  This is the filter that catches the most books. It is easy to weave climate into a narrative as texture. It is very difficult to prove that the narrative *fails* without it.

  Most "big history" books pass the Mechanism Requirement (they explain how a virus spreads) and the Proportionality Requirement (they match the plague to the population drop). But they fail the Necessity Requirement. If you remove the chapter on the ocean currents from a book about the British Empire, does the argument about naval technology and finance collapse? Usually, it does not. The ocean currents were a condition of possibility, not a cause of specific outcomes. Insisting that the non-human factor be *necessary* for the specific outcome rules out 80% of the current literature in this genre, which tends to treat the environment as a stage rather than a scriptwriter.

  ***

  ### Verdict on the Word "Actor"

  **It is decoration.**

  The term "actor" (borrowed from Actor-Network Theory) implies symmetry between human and non-human entities. It suggests a pathogen has "agency" in the same way a general does. This is a category error.

  A general has intent, strategy, and the capacity to choose otherwise. A pathogen has replication mechanics and transmission vectors. Calling the pathogen an "actor" obscures this difference. It grants the non-human a mystical capacity to "act" that disguises the fact that it is merely *causing* effects through blind physical processes.

  **Use "Constraint," "Force," or "Variable."**
  *   **Constraint:** Accurately describes how soil limits farming.
  *   **Force:** Accurately describes how a storm destroys a fleet.
  *   **Variable:** Accurately describes how temperature correlates with yield.

  "Actor" is a metaphor that invites the very confusion you are trying to escape. It makes the non-human sound like a co-author when it is often just a loaded gun on the table. Whether the gun goes off is still a matter of human history.

  ### Summary for the Amateur Historian

  When you pick up the next book, ask this: **If I delete the chapters on the non-human factor, does the argument collapse?**
  *   If **yes**, the book has earned its title.
  *   If **no**, but the book claims the non-human factor was decisive, the book is laundering its thesis.
  *   If **no**, and the book admits the factor was context, the book is honest but perhaps overstated in its marketing.

  You are looking for accounts where the human and non-human are **entangled**, not parallel. The non-human factor should not be the *subject* of the history; it should be the *friction* that makes the human history difficult to explain without it.
