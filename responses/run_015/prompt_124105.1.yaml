  **Afterword**

  Two jokes are fair hits on risk-weighted expected utility (RWEU) as defenders describe it: the Rabin calibration critique (small-stakes aversion implying absurd large-stakes rejection) and the model uncertainty problem (tails are unknowable, yet treated as fixed inputs). The Pascal mugging joke relies on a strawman; defenders argue RWEU isn't meant to handle unbounded utility without independent value caps. The single objection that survives the defender's reply is the ergodicity objection. Static expectation maximization fails in non-ergodic environments where ruin is absorbing, and no risk-function dial fixes the mismatch between ensemble averages and time averages.
