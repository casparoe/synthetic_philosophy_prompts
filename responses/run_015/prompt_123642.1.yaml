  Your current "Unique Origin" principle is a strong Kripkean start, but it fractures on Case 2 (Fission) because uniqueness fails, and it wobbles on Case 1 (Statue/Lump) unless you accept sortal-relativity, which you currently distrust. To stop the flip-flop between View A (Transworld Identity) and View B (Counterpart Theory), you should adopt a hybrid: **Origin-Constrained Counterpart Theory**. This view accepts the Lewisian mechanics of View B (objects are world-bound, modality is about counterparts) but constrains the counterpart relation with Kripkean essence (View A). This resolves the tension: it handles Case 1 without "dodges" (different sortals invoke different counterpart relations), saves Case 2 without logical contradiction (the counterpart relation can be one-many), and secures Cases 3, 4, and 5 via the origin constraint.

  Here is the repaired principle, with clauses mapped to your cases:
  *   **"Shares essential origin"**: Handles Cases 3, 4, and 5. It ensures the replica (wrong origin) isn't you, the different-life person (right origin) is you, and that a world with no origin-mate makes "I might not have existed" true without trickery.
  *   **"And sortal nature"**: Handles Case 1. The statue and lump have different sortal natures, so they select different counterparts; the lump has a squashed-ball counterpart, the statue does not.
  *   **"Allows... one-many counterpart relations"**: Handles Case 2. In fission, uniqueness is dropped; both successors are counterparts, validating your "both" intuition without violating logic.
  *   **"Time-relative accessibility"**: Handles your partner's wrinkle. As time passes, the set of accessible worlds shrinks (branches close off), so "I could have been a pianist" shifts from true to false; this is a feature, not a cost, as it matches our lived experience of closing possibilities.

