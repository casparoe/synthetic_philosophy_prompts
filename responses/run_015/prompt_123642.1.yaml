  1.  **Duplicate built while alive:** Not you. Even if qualitatively identical, it lacks the correct causal history/origin event connected to your actual beginning.
  2.  **Sibling (same parents, different pregnancy):** Not you. Origin essentialism ties you to the specific conception event (this sperm, this egg, this time); a later pregnancy is a distinct origin.

