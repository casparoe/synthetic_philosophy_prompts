      *   **Prompt Compliance:** The word count is significantly short (looks like ~230 words vs 400 minimum). This usually incurs a penalty.
      *   **Rubric Construction:**
          *   Thesis/Accuracy (8 pts)
          *   Prompt Coverage (3 pts each = 9 pts)
          *   Writing/Clarity (3 pts)
          *   Total: 20 pts.
      *   **Grading Tone:** Needs to be constructive but firm on the historical inaccuracies. The TA needs to be able to justify this to the student if they complain.

  5.  **Drafting the Feedback:**
      *   *Letter Grade:* D or C- range. The historical thesis is fundamentally inverted. However, they got the mechanism and free will parts right. Let's aim for a **C- (11/20)** or **D+ (12/20)**. Given the fundamental misunderstanding of Kepler's project (reform vs. reject), a C- feels more accurate for a survey course where the main takeaway is "Kepler kept astrology." Let's go with **11/20 (C-)**.
      *   *Word Count:* Need to penalize this. It's barely half the minimum.
      *   *Line-by-Line:* Be specific about *De fundamentis* and the "reject" claim.

  6.  **Refining the Output:**
