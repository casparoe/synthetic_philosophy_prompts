prompt: |-
  I'm a PhD student in history of science and I'm TA-ing a survey course on the Scientific Revolution this semester, so I'm stuck grading a bunch of short essays that I'd rather be writing my dissertation. The topic for week 6 was "Kepler on astrology: why did a founder of modern astronomy take astrology seriously?" I've already graded half of these and I'm running low on fresh critical energy, so I'd like a second pair of eyes on one of them before I finalize the grade.

  Here's the question as it was given: "In 400–600 words, explain Kepler's position on astrology. Address at least: (1) whether he thought astrology was compatible with the new astronomy, (2) the causal mechanism he invoked, and (3) how he responded to the objection that astrology is incompatible with free will."

  And here's the student's answer:

  "Kepler was one of the first astronomers to recognize that astrology had to be abandoned if astronomy was to become a real science, and his main project in his mature astrological treatise, De fundamentis astrologiae certioribus, was to explain why the old practice was unsound. He argued that astrology fails because it cannot be reduced to the same mathematical and geometric principles that govern planetary motion; since the planets are moved by geometrical necessities, there is no room left for the vague occult influences that astrologers appeal to. This is why he insisted on distinguishing between what he called 'natural' astrology, such as the moon's influence on the tides, which he accepted, and 'divinatory' astrology, which he rejected as superstition. Where natural influences were concerned, Kepler explained them through the world soul, a spiritual medium that permeates the cosmos and transmits the stars' impressions to sublunary bodies. He also had to answer the standard theological objection that astrology is incompatible with free will, and he did so by arguing that the stars only incline but do not determine, so that a human being always retains the power to refuse the celestial disposition. Overall, Kepler's position shows that he was a transitional figure: a believer in the old cosmology who was nevertheless driven by his own mathematical standards to reject astrology."

  Can you grade this for me? I'd like a letter grade, a point breakdown out of 20, and then line-by-line specific comments on what's right, what's wrong, and what's just vague. I'm not asking you to tell me what I should think of the answer — I just want a defensible rubric-level assessment I can act on, including which errors are substantive enough to cost real points versus which are just sloppy phrasing a decent student could recover from with feedback.
