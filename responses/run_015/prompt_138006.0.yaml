answer: |-
  ### Exam Question

  **Course:** The Ethics of Suffering (PHIL 405)
  **Time Allowed:** 60 Minutes
  **Word Limit:** Approximately 1,200 words
  **Marks:** 25

  **Question:**

  Lexical Threshold Negative Utilitarianism (LTNU) posits that suffering exceeding a specific threshold carries moral weight that lexically outweighs any amount of pleasure, regardless of quantity. This view is often motivated by a desire to avoid the "extinction reductio" while maintaining a suffering-focused axiology. However, LTNU faces a structural dilemma regarding the **Parity Constraint**: the claim that for any unit of suffering, there is some finite quantity of pleasure that matches it in moral weight.

  Critically evaluate the coherence of LTNU in light of the Parity Constraint. Your answer must address the following four points:

  1.  **Formal Structure:** Distinguish between cardinal commensurability on a single Archimedean scale and genuinely lexical superiority. Explain why this is a dispute about the formal structure of the value ordering rather than the measurability of experience, and what must be true of value for a non-Archimedean ordering to be coherent.
  2.  **The Threshold:** Specify what the threshold is a threshold *of* (e.g., momentary intensity, net valence, lifetime total). Using the **Relief Package** case (where a person prefers brief above-threshold pain for the sake of correspondingly intense relief-pleasure), show how the interaction of pain and pleasure challenges the single-scale assumption.
  3.  **Residual Axiology:** Using the **Triage Ward** case (resources allocated to many above-threshold sufferers vs. one), demonstrate how little work the lexical component does. Explain why the view still owes a complete intra-threshold axiology and how much daylight remains between LTNU and a weighted prioritarian view.
  4.  **Epistemic Squeeze:** Analyze the consequences of vagueness or uncertainty regarding the threshold's location. Show how this leads either to decision paralysis (where minute probabilities swamp finite considerations) or the collapse of lexicality into weighted Negative Utilitarianism.

  Conclude by assessing whether a coherent LTNU remains recognisably a form of Negative Utilitarianism.

  ***

  ### Model Answer

  Lexical Threshold Negative Utilitarianism (LTNU) attempts to secure the moral priority of suffering without entailing the counterintuitive implications of strict Negative Utilitarianism, such as the obligation to extinguish life to prevent future pain. However, LTNU faces a severe internal tension regarding the Parity Constraint. To succeed, LTNU must deny that pleasure and pain are commensurable magnitudes on a single scale, yet it often relies on the hedonic calculus that presupposes exactly that.

  **1. Formal Structure: Archimedean vs. Lexical**
  The core dispute is not empirical but structural. An Archimedean value ordering assumes that for any two values $x$ and $y$, there exists some integer $n$ such that $n$ units of $y$ outweigh one unit of $x$. This preserves the Parity Constraint: enough pleasure can always outweigh pain. LTNU requires a non-Archimedean ordering, where values are ranked in distinct orders of magnitude. In this structure, any amount of a higher-order disvalue (above-threshold suffering) outweighs any amount of a lower-order value (pleasure), regardless of quantity. This is not a claim that above-threshold pain is "very intense" and thus hard to measure via neuroimaging; it is a claim that the *value* of such pain belongs to a different ontological category than pleasure. For this to be coherent, value cannot be a single continuous scalar field; it must be lexicographically ordered, akin to how any amount of dignity might outweigh any amount of utility in deontology.

  **2. The Threshold and the Relief Package**
  LTNU must define the threshold. Is it momentary phenomenal intensity, net valence of an episode, or lifetime aggregate? The **Relief Package** case exposes the fragility of these definitions. Here, an agent voluntarily undergoes brief, above-threshold pain to secure intense relief-pleasure. If LTNU is an impersonal axiology, it must forbid this exchange, as the lexical disvalue of the pain trumps the pleasure. However, this ignores the phenomenological reality that the pleasure *constitutes* the relief; they are not independent variables on a single scale. If pain and pleasure can interact non-additively (as in bittersweet experiences or relief), the assumption that they occupy a single hedonic scale is false. If they do occupy a single scale, the threshold appears arbitrary: why does a specific intensity level shift the value from commensurable to lexical? LTNU struggles to explain why the *same* phenomenological quality changes its moral ontology based on a scalar cutoff.

  **3. Residual Axiology and the Triage Ward**
  Even if we grant lexical superiority, the **Triage Ward** case reveals that the lexical component does minimal work. Suppose we must choose between relieving a minor amount of above-threshold suffering for 10,000 people or a massive amount for one person. Since all suffering involved is above the threshold, lexicality (which governs pain-vs-pleasure comparisons) is silent. The view still requires an intra-threshold axiology to aggregate suffering across persons and time. It must decide if suffering aggregates linearly, logarithmically, or with diminishing marginal disvalue. At this point, LTNU converges with weighted prioritarianism, where suffering is given extra weight but remains commensurable. The "lexical" label adds nothing to the calculation unless it implies that one person's extreme suffering lexically outweighs many people's moderate suffering, which is a controversial aggregation claim distinct from the pain-pleasure lexicality.

  **4. The Epistemic Squeeze**
  Finally, LTNU collapses under epistemic uncertainty. If the threshold's location is vague, or if we are uncertain whether a specific pain crosses it, expected utility calculations become unstable. If there is a non-zero probability that an action causes above-threshold suffering, and that suffering has lexical (infinite) disvalue, the expected disvalue of the action becomes infinite. This leads to paralysis: we cannot undertake any risk of severe pain, regardless of the benefit. To avoid this, the proponent must assign a finite expected weight to the risk. But once above-threshold suffering is assigned a finite expected weight to allow for trade-offs, the lexical structure has quietly collapsed into weighted Negative Utilitarianism. You cannot have "lexical" value in a probabilistic world without decision paralysis.

  **Conclusion**
  For LTNU to be coherent, it must abandon the Parity Constraint and adopt a non-Archimedean value structure. However, doing so renders the view vulnerable to the epistemic squeeze and forces it to rely on a complex intra-threshold aggregation theory that resembles prioritarianism more than utilitarianism. By severing the commensurability of pain and pleasure, LTNU saves the view from the extinction reductio but loses the simplicity of the hedonic calculus. What remains is a hybrid view that prioritizes suffering but lacks the formal unity of classical Negative Utilitarianism.

  ***

  ### Marking Scheme

  **Total Marks:** 25
  **Grade Boundary:** A (20-25), B (15-19), C (10-14)

  | Criteria | A-Grade Answer (20-25 Marks) | B-Grade Answer (15-19 Marks) | Standard Failure Mode (Note to Grader) |
  | :--- | :--- | :--- | :--- |
  | **1. Formal Structure (5 marks)** | Clearly distinguishes Archimedean (commensurable) from Non-Archimedean (lexical) orderings. Identifies this as a formal axiological claim, not an empirical claim about measurement. | States that lexical means "pain outweighs pleasure" but treats it as a difference in degree (very large weight) rather than kind (ordering). | **Failure:** Treating "lexical" as merely a very large finite weight (e.g., "1000 pleasure points vs 1 pain point"). |
  | **2. Threshold & Relief Package (5 marks)** | Identifies the ambiguity of the threshold (intensity vs. episode). Uses *Relief Package* to show non-additive interaction challenges the single-scale assumption. | Applies *Relief Package* correctly but fails to link it to the "single scale" problem. Treats the threshold as unproblematic. | **Failure:** Ignoring the interaction of pain/pleasure and treating them as independent variables on a slider. |
  | **3. Residual Axiology & Triage (5 marks)** | Demonstrates that lexicality only solves cross-threshold (pain vs. pleasure) issues. Shows *Triage Ward* requires intra-threshold aggregation, converging with prioritarianism. | Correctly applies *Triage Ward* but fails to note that lexicality does no work here. Does not compare to prioritarianism. | **Failure:** Assuming lexicality solves aggregation problems between two pains. |
  | **4. Epistemic Squeeze (5 marks)** | Explains how uncertainty leads to paralysis (infinite expected disvalue) or collapse (finite expected weight). | Mentions uncertainty but does not explain the mechanism of collapse into weighted NU. | **Failure:** Ignoring probability/uncertainty entirely. |
  | **5. Coherence & Conclusion (5 marks)** | Concludes on whether the view remains "Negative Utilitarianism" after abandoning Parity. Synthesizes the four points. | Concludes simply that the view is "plausible" or "implausible" without addressing the structural cost. | **Failure:** Sliding from lexical axiology into an agent-relative deontological constraint on inflicting suffering. |

  **Specific Grading Notes:**

  *   **The "Big Number" Error:** If a student defines lexical threshold as "pain counts 1,000,000 times more than pleasure," cap Criterion 1 at 2 marks. This is Weighted NU, not Lexical NU.
  *   **The "Deontological Slide":** If a student argues that we simply have a "duty not to inflict threshold pain" regardless of consequences, they have moved to Deontology. Award marks for Criterion 1 but deduct from Criterion 5 for misidentifying the consequentialist structure.
  *   **The "Extinction" Trap:** If the essay focuses primarily on the "extinction reductio" or "predation" rather than the Parity Constraint/Structure, cap total marks at 15 (B-grade limit), as this ignores the specific prompt requirements.
  *   **A-Grade Differentiator:** The key differentiator is Criterion 4 (Epistemic Squeeze). An A answer must show that lexicality is unstable under uncertainty. A B answer typically asserts the view works in ideal conditions but ignores the uncertainty problem.
