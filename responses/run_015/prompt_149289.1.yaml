answer: |-
  This is a fantastic exercise. It's rare I get to bridge the gap between the renormalization group and normative ethics. Since you think in terms of effective field theories and lattice models, let's treat the mind as a many-body system and see if the hedonistic claim holds up to the rigor you're used to.

  ### 1. The Hedonist Claim: The Universality Hypothesis

  In your vocabulary, the hedonist is making a claim about **universality classes**.

  The hedonist argues that despite the wildly different microscopic Hamiltonians involved—sugar hitting the tongue, a theorem clicking into place, or a rival stumbling—the system flows under renormalization to the same infrared fixed point. They are claiming that "pleasure" is a robust **order parameter**.

  Just as you don't need to know the specific spin configuration of a ferromagnet to measure its magnetization, the hedonist says you don't need to know the specific neural substrate (visual cortex vs. reward pathway) to measure the "amount" of pleasure. All these diverse microscopic states belong to the same universality class. They share the same critical exponents and scaling laws. When you coarse-grain the neural lattice, all the microscopic noise averages out, leaving a single scalar field, $\phi(x)$, which represents the "goodness."

  So, the "common currency" is the assertion that there exists a macroscopic equation of state where $Goodness = f(Pleasure\_Magnitude)$, regardless of the microscopic degrees of freedom that generated it. The specific interactions are irrelevant variables; they flow to zero under RG. Only the relevant variable (the pleasure intensity) survives to the macroscopic scale.

  ### 2. The Heterogeneity Objection: Microscopic Sensitivity

  The heterogeneity objection is essentially a claim that **irrelevant variables matter**.

  The objector looks at the "eating chocolate" state and the "solving proof" state and says: these do not flow to the same fixed point. The correlation functions are fundamentally different. There is no single order parameter that can capture both.

  In CMP terms, this is like trying to describe both a superfluid and a crystal using the same broken symmetry. Sure, they're both ordered phases, but the nature of the order is distinct. The objector argues that the "feel" of the pleasure is encoded in the specific excitation spectrum of the microscopic lattice, not just the ground state energy. If you integrate out the microscopic details to get a smooth scalar field, you aren't just simplifying; you are integrating out the *thing itself*.

  They are claiming that "pleasure" is not a natural kind or a single phase of matter. It's a disjunctive set of states that share a family resemblance but no common invariant. To treat them as a single currency is like treating temperature and pressure as the same variable just because they both appear in the ideal gas law. The objection says the Hamiltonian for social schadenfreude has different symmetries than the Hamiltonian for sensory gratification, and you cannot map one to the other via a unitary transformation without losing information.

  ### 3. Residue Report

  Here is the breakdown of what survived the translation and what got left on the cutting room floor.

  **What Translated Cleanly:**
  *   **Coarse-Graining:** The hedonist idea that the *source* doesn't matter, only the *output*, maps perfectly to the idea of irrelevant operators in RG flow.
  *   **Comparability:** The idea that pleasures can be summed or compared maps well to the existence of a scalar order parameter. If you have a scalar field, you can compare magnitudes at different points.
  *   **Emergence:** The idea that "pleasure" arises from neural activity but isn't identical to any specific neuron firing maps cleanly to emergent phenomena (like phonons).

  **What Was Distorted:**
  *   **The "Feel" (Qualia):** In physics, an order parameter is third-person observable. I can measure magnetization from outside the system. In philosophy, pleasure is first-person accessible. By translating pleasure to an order parameter, I've turned a subjective experience into an objective field. This smuggles in physicalism. It assumes the "feel" *is* the macroscopic state, rather than the *observation* of the macroscopic state by the system itself.
  *   **Dynamics vs. Statics:** Hedonism is often about decision making (maximizing the integral of pleasure over time). This is more like a path integral or action minimization than a static phase classification. The heterogeneity objection often hinges on the *trajectory* through state space, not just the state itself.

  **What Has No Expression (The Null Residue):**
  *   **Normativity:** This is the big one. Physics describes what *is*. Ethics describes what *ought* to be. Even if we agree that pleasure is a universal order parameter, physics cannot tell you why you *should* maximize it. You can define a Hamiltonian where the ground state is maximum suffering, and the math works fine. The "goodness" of the pleasure—the reason it commands pursuit—vanishes in the translation.
  *   **Intentionality:** Pleasure is usually *about* something. The pleasure of the proof is about the truth of the theorem. Physics models don't inherently have "aboutness."

  ### 4. The Breakdown: Who is at Fault?

  You asked if treating pleasure as an emergent property of a neural lattice smuggles in an assumption, and whether the loss of "goodness" means your vocabulary is missing something or the philosophers are vague.

  **On the Smuggling:**
  Yes, treating pleasure as an emergent property of a neural lattice assumes **Naturalism**. It assumes that value is a physical property that supervenes on matter. If you are a moral realist who thinks "goodness" is a non-natural property (like a Platonist), the lattice model is category-error from the start. But even if you are a naturalist, treating it as a *single* emergent field (the hedonist view) assumes unity where there might be none.

  **On the Break:**
  Here is my honest take as an outsider looking at your toolkit: **The break is mostly on the philosophy side, but the physics vocabulary exposes it.**

  Philosophers often talk about "pleasure" as if it were a simple sensation, like a yellow patch in the visual field. But as a physicist, you know that macroscopic states are defined by their symmetries and correlations, not just a label. The heterogeneity objection is essentially saying: "You philosophers are trying to write an effective field theory without identifying the degrees of freedom."

  The reason "normative goodness" doesn't survive the translation isn't necessarily because physics is blind to value. It's because **value looks like a boundary condition, not a dynamical variable.**

  In your work, you set boundary conditions to solve the Hamiltonian. In ethics, "the Good" acts like a boundary condition on action. It's not a particle or a field you can find in the bulk; it's the constraint on the path integral. When you try to model "goodness" as a substance (a currency, a feeling-tone), you are trying to treat a boundary condition as a bulk field. That's why it dissolves.

  **Verdict:**
  The physics vocabulary isn't missing anything essential about value; rather, it reveals that the hedonist claim is likely an **over-simplified effective theory**. It works at low resolution (deciding between ice cream flavors), but breaks down at high resolution (comparing ice cream to mathematical beauty).

  The heterogeneity objectors are essentially arguing for a **multi-component order parameter**. They suspect you need a vector field, not a scalar, to capture the different "directions" of value. The hedonists want a scalar because scalars are easy to maximize.

  So, does your vocabulary miss the "feel"? No. It misses the "ought" because the "ought" isn't in the Hamiltonian; it's in the selection of the Hamiltonian itself. If the philosophers can't define pleasure without referencing the "goodness" of it, they are conflating the order parameter with the reason for minimizing the energy. That's a philosophical error, not a physics limitation. Your lattice analogy actually clarifies that distinction better than their prose does.

  Keep poking. You're basically doing theoretical ethics without realizing it.
