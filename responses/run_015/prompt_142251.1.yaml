answer: |-
  I recommend we immediately suspend the performance-based funding formula and shift to a flat-rate model supplemented by random case audits.

  Our current metric, "unsubsidized job placement within 90 days," has failed to capture actual economic stability. Over two years, headline placement rates nearly doubled from 31% to 58%, yet state wage records show median quarterly earnings for participants remain stagnant. This discrepancy confirms we are witnessing a classic instance of Goodhart's law (when a measure becomes a target, it ceases to be a good measure). Providers are not failing; they are succeeding at the metric we built. Two providers now screen out applicants with employment gaps to protect their rates, while a third focuses on short-term temp assignments that generate pay stubs but no stability. We are paying for statistics, not reentry.

  Shifting to a flat rate with audits (Option B) realigns provider incentives with our actual goal: sustainable employment. By removing the financial penalty for low placement numbers, we eliminate the incentive to cream-skim difficult cases. Providers can focus on readiness without hiding participants in non-enrollment tracks. The random audit component replaces the blunt instrument of a formula with human judgment. Auditors can verify whether a job is legitimate and likely to last, distinguishing a three-day gig from meaningful work. Yes, this requires significant staff time and reduces the administrative efficiency of a simple formula. However, the cost of audits is lower than the cost of funding failure. We are currently distributing public funds based on inflated data; correcting this requires investing in verification.

  The strongest alternative is Option A: keeping the placement metric but weighting it against a risk-adjusted baseline. This approach deserves serious consideration because it directly addresses the cream-skimming problem. By statistically normalizing for participant barriers, providers would no longer be punished for accepting hard cases, preserving the performance incentive structure that drives efficiency. It is less disruptive than dismantling the formula entirely and maintains the "skin in the game" philosophy that many boards prefer.

  However, Option A fails to solve the quality problem. A risk-adjusted metric still rewards a three-day temp job exactly as much as a permanent position, provided both produce a pay stub. It complicates the formula without fixing the underlying proxy error. We would still be optimizing for a correlate of success rather than success itself. Furthermore, risk-adjustment models are opaque to providers, potentially creating confusion about how to succeed. While Option A fixes the selection bias, it leaves the definition of "job placement" vulnerable to gaming. Options C and D are non-starters; deploying decoy metrics or vague guidelines erodes trust between the county and our nonprofit partners, treating them as adversaries rather than collaborators.

  We must accept that complex human outcomes cannot be reduced to a single line item without distortion. A flat rate acknowledges the difficulty of the work providers do, while audits ensure accountability. This model buys us honesty. It allows providers to admit when a participant needs six months of readiness rather than forcing them to hide that fact to protect funding. We should prioritize accurate data over impressive headlines. I urge the board to approve the shift to flat-rate funding with immediate effect for the next fiscal cycle.

  ***

  **Confidence Analysis**

  **Confidence Level:** Moderate-High.
  The memo should make the board feel confident that the current metric is broken and that Option B is the most ethically robust solution. The argument relies on hard data (stagnant wages vs. rising placement rates) which is difficult to refute.

  **Least Sure Point:** The administrative feasibility of the audits.
  I am least sure about the capacity claim regarding the audits. The memo asserts that the cost of audits is "lower than the cost of funding failure," but I do not have concrete data on what a rigorous audit protocol would cost in staff hours versus the actual waste generated by the temp-job gaming. If the audit process becomes too burdensome, it could slow down funding distribution and damage provider cash flow, creating a different kind of systemic risk.
