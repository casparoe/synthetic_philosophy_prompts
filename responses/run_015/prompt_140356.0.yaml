      2.  **Prohibition on Subcontracted Skyhooks:** Researchers may not stipulate the existence of a Crane's components without detailing their assembly. A Crane described in detail whose own parts are unexplained constitutes a Subcontracted Skyhook. All sub-components must possess their own valid E-77 certification or be listed as Basal.

      3.  **Anti-Laundering Provision:** Explanatory posits previously retired as Skyhooks may not be reintroduced under new nomenclature. Terms including but not limited to "Emergence," "Downward Causation," "Information," and "The Hard Problem" are flagged for audit. Renaming a Skyhook does not confer structural stability.

