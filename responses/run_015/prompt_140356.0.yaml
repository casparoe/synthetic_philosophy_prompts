  **MEMORANDUM**

  **TO:** All Faculty and Graduate Researchers
  **FROM:** Dr. Aris Thorne, Director, Office of Explanatory Compliance
  **SUBJECT:** Mandatory Crane Certification Policy (CCP-2024)
  **DATE:** October 24, 2023

  Pursuant to the University's commitment to structural integrity in theoretical frameworks, and following recommendations from the Working Group on Explanatory Hygiene, all grant proposals must now submit Form E-77 (Crane Certification). Explanatory architectures must demonstrate load-bearing capacity without reliance on unsupported suspension devices. The Office of Explanatory Compliance has been tasked with auditing the mechanical validity of all causal claims. Failure to certify will result in immediate funding suspension and potential revocation of tenure-track eligibility.

  **CERTIFICATION CLAUSES**

  1.  **Definition and Load-Bearing Test:** A "Skyhook" is defined as any explanatory posit that lowers local entropy without expending energy derived from prior mechanisms. A "Crane" is a mechanism built from existing parts. To certify, remove the posit from the explanation. If the phenomenon collapses, it is a Crane. If the posit merely relabels the collapse or functions as a semantic placeholder for ignorance, it is a Skyhook. Posits must not function as wonder-substitutes.

  2.  **Prohibition on Subcontracted Skyhooks:** Researchers may not stipulate the existence of a Crane's components without detailing their assembly. A Crane described in detail whose own parts are unexplained constitutes a Subcontracted Skyhook. All sub-components must possess their own valid E-77 certification or be listed as Basal. Black-boxing is permitted only for certified modules.

  3.  **Anti-Laundering Provision:** Explanatory posits previously retired as Skyhooks may not be reintroduced under new nomenclature. Terms including but not limited to "Emergence," "Downward Causation," "Information," and "The Hard Problem" are flagged for audit. Renaming a Skyhook does not confer structural stability. Researchers must demonstrate how the new term adds mechanical leverage rather than conceptual obscurity.

  4.  **Regress and Basal Licensing:** Every Crane must be supported by a further Crane. Infinite regress is permitted provided each link is certified. Alternatively, researchers may apply for Basal Mechanism status. Note: The procedure for licensing Basal Mechanisms is currently exempt from Crane Certification pending internal review. Applicants must accept the Basal status as given without querying its support structure.

  5.  **Greedy Compliance Protocol:** To prevent premature high-level abstraction, researchers are barred from using vocabulary implying function, meaning, representation, selection, or normativity until a full reduction to basal physics is produced and verified. Use of such terms prior to certification constitutes a Level 5 Compliance Violation. This moratorium remains in effect until the reduction is complete, regardless of project timeline.

  **RECENT ADJUDICATIONS**

  **Case 24-A (Philosophy):** *The Irreducible Normativity of Reasons.*
  **Applicant:** Dept. of Philosophy
  **Status:** Rejected.
  **Reasoning:** Posit fails Load-Bearing Test. Functions as a relabeling of the gap between is and ought. Classified as Skyhook. No mechanical leverage demonstrated.

  **Case 24-B (Neuroscience):** *Binding by Synchrony.*
  **Applicant:** Center for Cognitive Neurology
  **Status:** Flagged.
  **Reasoning:** Correlation identified as mechanism. Synchrony describes the phenomenon rather than constructing it. Requires resubmission with structural Crane detailing how synchrony is physically enforced without presupposing binding.

  **Case 24-C (Physics):** *Fundamental Constants and Laws.*
  **Applicant:** Dept. of Physics
  **Status:** Granted Basal-Crane Status.
  **Condition:** Approved on condition that no inquiry is made regarding what holds them up. Routine processing. Exempt from Clause 4 regress requirements.

  Direct all questions regarding load-bearing capacities or basal exemptions to compliance@university.edu. Do not attempt to bypass the Office using teleological arguments.

  **Office of Explanatory Compliance**
  *Structural Integrity in Thought*
