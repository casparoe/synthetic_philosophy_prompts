      *   List: {Rose, Red, Exemplification}. This is just a heap.
      *   Fact: <Rose is Red>. This is a unified whole that can be true or false.
      *   Bradley's point: If relations are things (entities), they can't do the job of relating. They become just more things to be related.
      *   Therefore, the "brute fact" move fails because the brute fact *presupposes* the unity that the argument claims is impossible on the given metaphysical framework.

