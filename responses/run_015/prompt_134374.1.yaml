answer: |-
  You are not muddling anything. You have independently rediscovered one of the most persistent and difficult problems in the philosophy of language and metaphysics. Your "package-deal" intuition is correct, there *are* two incompatible conventions people switch between, and there *is* an established name for the problem.

  Here is the plain breakdown of what you are seeing, the names for it, and the verdict on your future-if example.

  ### 1. The Name of the Thing
  The specific problem your book club was fighting over is called **The Cotenability Problem**, first formalized by Nelson Goodman in 1947.

  The broader framework used to analyze it is **Possible Worlds Semantics**, most famously developed by David Lewis in his 1973 book *Counterfactuals*.

  The "rule" your book club members were searching for but couldn't name is the **Similarity Metric**. When we say "If X had happened," we are implicitly selecting the "closest possible world" where X is true. The fight is over how to measure "closeness."

  ### 2. The Two Conventions (The "Package Deal")
  You identified that people switch between two conventions. In philosophy, these are called **Standard Counterfactuals** and **Backtracking Counterfactuals**.

  *   **Convention A (Standard/Forward-tracking):** You hold the entire past fixed up to the moment of the change. You insert a small "miracle" (a divergence from actual history) to make the antecedent true, and then let the laws of nature run forward.
      *   *The Napoleon Argument:* "Napoleon wins Waterloo." We keep the fact that the Prussians were arriving and the French were tired fixed. We just assume a cannonball hits Wellington instead.
      *   *The Critique:* This feels like "cheating" because it requires a miracle. It isolates the event from its causes.
  *   **Convention B (Backtracking):** You allow the past to change to make the antecedent plausible. You reason backward from the event to its necessary conditions.
      *   *The Napoleon Counter-argument:* "If Napoleon won, he must have had more men or better positioning earlier." So you change the campaign leading up to the battle.
      *   *The Critique:* This feels like moving the goalposts. If you change too much of the past, it's no longer the same historical scenario.

  **The Cotenability Problem** is this: When we assert a counterfactual, which background facts are **cotenable** (allowed to stay true) and which must be discarded? There is no logical rule for this; it is a pragmatic choice based on what we are trying to prove.

  *   If you want to prove France was doomed by demographics, you use Convention A (hold manpower fixed).
  *   If you want to prove Napoleon's genius was the variable, you use Convention B (let his genius alter the prior conditions).

  Neither side is logically "right." They are playing different games with different similarity metrics.

  ### 3. Is the Future-If Clean?
  You asked: *"None of this comes up with ordinary future ifs... So it can't just be about being uncertain."*

  Here is where you need to be careful. You are not muddling the examples, but you are conflating two different grammatical/logical structures: **Indicative** vs. **Subjunctive** conditionals.

  *   **Future/Indicative:** "If it rains on Saturday, the match is off."
      *   This is an **indicative conditional**. We treat the future as open. We are looking at branches of the *actual* world that are physically possible given current conditions. We don't ask "how the rain got there" because we assume the current atmospheric pressure systems might naturally develop that way. We are projecting forward from the *actual* present.
  *   **Past/Subjunctive:** "If it *had* rained on Saturday, the match *would have* been off."
      *   This is a **counterfactual (subjunctive) conditional**. The past is treated as fixed. For it to have rained on a specific Saturday when it *did not*, you cannot just project forward from the actual present. You have to break the actual timeline.

  **The Verdict:** The mess *is* hiding in the future-if, but we suppress it.
  If you press the future-if hard enough ("If it rains Saturday..."), the same problem emerges. *How* does it rain? Did a storm front move in? Did we seed the clouds? If a storm front moved in, the humidity on Friday would have been higher. If the humidity was higher, maybe I wouldn't have gone for a run.
  We don't notice this in future ifs because we are usually planning, not analyzing causality. We treat the antecedent ("It rains") as an isolated input. But logically, the "package deal" problem applies to futures too; we just ignore it because the future feels malleable while the past feels brittle.

  ### 4. Are You Muddling Separate Problems?
  You asked me to be plain: **No, you are not muddling.** Your three examples are all instances of the same underlying logical tension.

  1.  **Napoleon:** High-stakes historical counterfactual. (Cotenability issue).
  2.  **Job Offer:** Personal agency counterfactual. (This adds the "Identity" problem—if I chose differently, am I the same person? This is a subset of the Backtracking issue).
  3.  **Rain:** The control case that highlights the Temporal Asymmetry.

  However, there is a nuance you should be aware of. The reason the Napoleon/Job examples feel messier than the Rain example is **Causal Density**.
  *   In the Rain example, the causal chain is physical and relatively linear.
  *   In the Napoleon/Job examples, the causal web involves human psychology, complex systems, and reflexive loops (my choice changes me, which changes the choice).

  But the *logical structure* of the problem is identical. You are correctly identifying that counterfactual reasoning requires us to arbitrarily decide where to stop the ripple effects of the change.

  ### Summary
  *   **Is there a name?** Yes. **The Cotenability Problem** (Goodman) and the debate between **Standard vs. Backtracking Counterfactuals** (Lewis).
  *   **What is the thing?** It is the lack of a defined rule for selecting which background facts remain true when you falsify one fact. We rely on a "Similarity Metric" that is context-dependent, not logical.
  *   **Is the future-if clean?** No. It is an **Indicative Conditional**, which pragmatically hides the problem by treating the future as open branches of the actual world. The **Subjunctive** (past) conditional forces the problem into the open because it requires breaking the actual world's history.
  *   **Are you muddling?** No. You have accurately identified that counterfactual history is not a logic puzzle with a solution, but a rhetorical tool where the "rules" are chosen to suit the argument.

  Your book club members were fighting because one was arguing for **structural determinism** (holding manpower fixed) and the other for **agency/contingency** (allowing the past to shift to accommodate the win). Neither could win because they were using different similarity metrics without admitting it.
