answer: |-
  ### The Metric Ambiguity in Demandingness Objections: Welfare Depletion vs. Integrity Rupture

  The standard demandingness objection to Act Consequentialism (AC) posits that the theory requires agents to sacrifice their interests until the marginal utility of resources retained equals the marginal utility of resources transferred to the general good. This is typically modeled as a problem of **fungible welfare depletion**: the agent is left with insufficient resources (time, money, energy) to achieve a threshold of personal well-being.

  However, a more subtle conceptual issue arises when we examine the *metric* used to calculate the "cost" of compliance. There is an unresolved ambiguity in whether the demandingness objection targets the quantitative reduction of the agent's welfare bundle or the qualitative violation of the agent's **practical identity**. This distinction turns on whether "cost" is understood as a *loss of value* (which can, in principle, be compensated or traded) or a *corruption of agency* (which resists trade-off logic).

  #### The Case: The Non-Fungible Project

  Consider an agent, **A**, who maintains a "ground project" (e.g., composing a specific type of avant-garde music, maintaining a local non-optimizing community garden, or caring for a specific family member in a way that precludes relocation to a higher-impact zone).

  1.  **The Consequentialist Demand:** A is required to abandon this project to pursue a different course of action that yields a net increase in agent-neutral value (e.g., high-earning effective altruism or relocating to a crisis zone).
  2.  **The Cost:** A faces the loss of the project.

  The ambiguity in the demandingness critique emerges when we attempt to quantify this cost for the purpose of moral calculation.

  **Interpretation 1: Cost as Welfare Deficit (The Fungible Model)**
  On this reading, the "cost" to A is the sum of preference frustration, hedonic loss, and the forfeiture of future opportunities for satisfaction associated with the project. In this framework, the cost is conceptually identical to any other resource loss. It is *fungible* in the sense that, theoretically, if the psychological pain of abandonment could be mitigated (e.g., through therapy, chemical adjustment, or substitution with a different hobby), the "cost" decreases. If the cost is merely welfare depletion, the demandingness objection is contingent: if A can be made happy enough while maximizing the good, the objection dissolves.

  **Interpretation 2: Cost as Integrity Rupture (The Constitutive Model)**
  On this reading, the "cost" is not the unhappiness caused by abandoning the project, but the **normative rupture** involved in treating the project as a tradeable commodity. The project is *identity-constitutive*; it provides the standpoint from which A evaluates reasons for action. To demand A abandon it for the greater good is not merely to ask A to suffer a loss, but to ask A to cease being the author of their life and become a conduit for agent-neutral value. Here, the cost is not a quantity of welfare, but a structural change in the agent's relationship to their reasons.

  #### The Conceptual Ambiguity

  The core conceptual issue is that demandingness objections often slide between these two metrics without specifying which is doing the normative work.

  If the objection relies on **Interpretation 1**, it is vulnerable to the "happy slave" counter-argument. If A can be psychologically conditioned to find equal satisfaction in maximizing the good as they did in their ground project, the welfare cost approaches zero. If the demandingness objection holds even in this case, it must rely on **Interpretation 2**.

  However, if the objection relies on **Interpretation 2**, it faces a commensurability problem. AC operates on a single metric of value (the Good). To claim that "integrity rupture" is a cost that outweighs the "lives saved" requires placing integrity on the same scale as welfare outcomes. But if integrity is placed on that scale, it becomes fungible by definition. If integrity is *not* placed on that scale, AC lacks the theoretical machinery to recognize it as a veto or a prerogative.

  Thus, the ambiguity is this: **Is the demandingness objection claiming that the price is too *high* (a welfare calculation), or that the currency being demanded is *illegitimate* (a structural claim about agency)?**

  #### Settled vs. Contested Terrain

  For those familiar with the literature, the following distinctions should be maintained:

  **Settled Consensus:**
  1.  **Commensurability:** It is settled that classical AC treats all values as commensurable within a single utility function. There is no categorical distinction within the theory between "welfare loss" and "integrity loss"; both are inputs into the maximization calculus.
  2.  **The Source of the Objection:** It is settled that the force of the demandingness objection increases significantly when framed as an integrity/identity issue rather than a mere welfare issue. Pure welfare depletion is generally viewed as a contingent empirical problem; integrity rupture is viewed as a conceptual problem for the theory's structure.
  3.  **Agent-Neutrality:** It is settled that the tension arises from the conflict between agent-neutral reasons (maximize the good) and agent-centered reasons (pursue my projects).

  **Genuinely Contested:**
  1.  **The Reducibility of Integrity:** It is contested whether "integrity costs" can be fully captured by a sophisticated welfare metric (e.g., by weighting "autonomy satisfaction" or "authenticity" heavily enough). Some argue that a sufficiently complex consequentialist account of well-being can absorb the identity objection without structural change. Others argue this is a category mistake: integrity is a condition of valuing, not an object of value.
  2.  **The Status of Prerogatives:** It is contested whether introducing an "agent-centered prerogative" (allowing agents to weigh their own interests disproportionately) resolves the ambiguity or merely masks it. If the prerogative is justified by the *badness* of integrity rupture, we return to the commensurability problem. If it is justified by the *nature* of agency, it is unclear how this fits within a consequentialist framework that defines rightness solely by outcomes.
  3.  **The Rationalist Implication:** There is ongoing debate regarding whether this ambiguity points to a failure in moral theory or a failure in our understanding of practical reason. Rationalist-adjacent positions often suggest that the "cost" is unintelligible because there is no *reason* to abandon the project if it is constitutive, regardless of the outcome. Consequentialists counter that the reason is provided by the outcome itself, and the "identity" resistance is merely psychological inertia misidentified as normative force.

  #### Conclusion

  The precise conceptual issue is not that consequentialism demands too much sacrifice, but that it lacks a coherent metric for distinguishing between **sacrificing what one has** (resources/welfare) and **sacrificing who one is** (constitutive commitments). When the demandingness objection is raised, it is often unclear whether the critic is arguing that the utility function is being calculated incorrectly (underweighting identity) or that the utility function is the wrong tool for the job entirely. Until this metric ambiguity is resolved, the demandingness objection remains unstable, oscillating between a contingent complaint about human psychology and a structural complaint about the nature of moral obligation.
