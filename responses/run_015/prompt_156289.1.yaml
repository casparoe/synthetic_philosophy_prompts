answer: |-
  # Joint Statement on Micro-Foundations and System-Level Properties in Agent-Based Modeling

  ## 1. Agreed Claims

  1.  **Simulation Mechanics:** We agree that the simulation code executes exclusively via individual agent states, local interaction rules, and update functions. No line of code directly manipulates a global variable like "segregation level" to force an outcome; macro patterns arise from micro-execution.
  2.  **The Segregation Case:** In the residential-segregation model under discussion, global segregation patterns emerge from agents acting on mild local preferences regarding neighbor composition. Both camps agree that changing individual preference thresholds alters the macro outcome.
  3.  **Topology Sensitivity:** We agree that swapping interaction topology (e.g., grid vs. network) while holding agent rules fixed can radically alter macro outcomes. This confirms that local interaction structure is a causal variable distinct from individual preferences.
  4.  **Limits of Simulation Tests:** We agree that perturbation, replay, and ablation tests within the simulation can establish sensitivity and dependency within the model, but cannot ontologically prove whether real-world social systems operate similarly.
  5.  **Predictive Utility:** We agree that macro-level descriptions (e.g., "liquidity," "segregation index") are useful for prediction and communication, regardless of their ontological status.

  ## 2. Disagreements Table

  | Disputed Claim | Micro-Only Camp Formulation | System-Level Camp Formulation | Verbal or Substantive? | Crux |
  | :--- | :--- | :--- | :--- | :--- |
  | **Causal Power of Macro Properties** | Macro properties are summaries; they do not cause micro changes. In segregation, the "pattern" does not move agents; neighbors do. | Macro properties constrain micro options. In segregation, the global pattern limits available moves, acting as a boundary condition. | **Substantive** (regarding model design); **Verbal** (regarding ontology) | Does the global state enter the update function explicitly? |
  | **Explanatory Sufficiency** | An explanation is complete only when reduced to individual incentives and local interactions. | An explanation is complete when it identifies stable macro-level dynamics, even if micro-mechanisms vary. | **Verbal** (definition of "explanation") | Is the goal mechanism tracing or pattern prediction? |
  | **Independence of System History** | History matters only insofar as it is encoded in current individual states (e.g., memory variables). | History matters as a systemic path-dependence that cannot be fully compressed into current individual states. | **Substantive** | Can current micro-state fully predict future trajectory? |

  ## 3. Cruxes, Tests, and Falsification Conditions

  **Crux 1: Does the global state enter the update function explicitly?**
  *   **Test:** Inspect the source code of the update rule for every agent. Check if any agent's decision function takes a global variable (e.g., `global_segregation_index`) as an input argument.
  *   **Micro Prediction:** No agent function will accept a global variable; all inputs will be local neighbors or internal state.
  *   **System Prediction:** Some effective models will require global variables to match empirical data, implying the current micro-specification is incomplete.
  *   **Falsification:**
      *   *Micro:* If adding a global variable significantly improves out-of-sample prediction of agent moves.
      *   *System:* If code inspection confirms all inputs are strictly local yet macro patterns persist.

  **Crux 2: Is the goal mechanism tracing or pattern prediction?**
  *   **Test:** Compare computational cost and accuracy of a macro-level equation (e.g., differential equation approximating segregation) against the full agent-based simulation.
  *   **Micro Prediction:** The macro equation will fail to capture phase transitions or edge cases handled by the agent model.
  *   **System Prediction:** The macro equation will match the agent model's output within acceptable error bounds at a fraction of the compute cost.
  *   **Falsification:**
      *   *Micro:* If the macro equation predicts regime shifts as accurately as the simulation.
      *   *System:* If the macro equation consistently diverges during critical transitions.

  **Crux 3: Can current micro-state fully predict future trajectory?**
  *   **Test:** Replay a simulation run from a saved state. Compare the trajectory against a run where the global history is altered but the current micro-state snapshot is identical.
  *   **Micro Prediction:** Trajectories will be identical; history is fully encoded in the current state.
  *   **System Prediction:** Trajectories will diverge; hidden systemic variables (e.g., institutional memory not stored in agents) exist.
  *   **Falsification:**
      *   *Micro:* If identical micro-states yield divergent futures without random seed changes.
      *   *System:* If identical micro-states always yield identical futures.

  ## 4. Closing Note on Progress and Ill-Posedness

  Progress is possible only if we distinguish claims about the **simulation** from claims about the **target system**.

  Regarding the simulation, the dispute is **ill-posed**. The code is the ontology. If the code updates agents based only on local neighbors, then downward causation does not exist in the model, regardless of how strongly the System-Level camp argues that "segregation causes movement." To argue otherwise is to misunderstand how the software executes.

  Regarding the target system (real cities/markets), the dispute is **substantive**. The simulation is merely a metaphor. The real question is whether real human beings respond to global statistics (e.g., "market sentiment") in ways not reducible to their local conversations. Our simulation tests cannot settle this. We agree to stop claiming that the model proves downward causation exists in reality. We will instead frame our work as: "If reality operates like this model, then macro-properties are emergent summaries, not causal forces."

  Future collaboration will focus on Crux 2 (Computational Efficiency). If macro-models can predict outcomes without simulating agents, the Micro camp gains a tool for scale, and the System camp gains evidence for effective autonomy. If not, the Micro camp retains ontological priority, and the System camp retains the burden of finding the missing variables.

  \answer{Whether system outcomes can be predicted without simulating every agent.}
