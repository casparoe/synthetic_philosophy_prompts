prompt: |-
  I'm trying to figure out where to spend about a year of research time on conceptual work around the Kalai-Smorodinsky bargaining solution. I know the basics: it picks the point on the line from the disagreement point to the utopia point that respects individual rationality, and it differs from Nash mainly by satisfying monotonicity instead of independance of irrelevant alternatives. But I want to go into the weeds a bit, not just rederive axioms.

  Specifically, I'm wondering which open conceptual questions actually matter if your goal is to understand whether KS captures anything like "fair division" in real cooperative settings. Some candidates I'm thinking about:
  - whether monotonicity has a defensible normative interpretation when the utopia point shifts because one party's outside option improves for reasons that have nothing to do with bargaining power
  - what happens conceptually if you drop convexity: does the line-to-utopia intuition survive in discrete or non-convex feasible sets, or does the solution concept just fall apart
  - whether there is any coherent extension to three or more parties, since the monotonicity axiom doesn't uniquely determine a point once you have more than two dimensions of utility
  - how KS compares to proportional or egalitarian solutions when you try to apply them to philosophical problems about distributive justice rather than pure game theory

  If you had to prioritize these (or replace some with others you think are more important) for someone who cares about normative implications rather than technical completeness, what would the ranking be? Defend it: which questions are upstream of others, which are just curiosities, and what kind of result would make you reorder them. Also, which of these lines is probably a dead end because the answer wouldn't change how anyone thinks about fairness?

  No citations needed, and don't turn this into a survey. I just want a defended agenda for where the conceptual work should go.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User's Request:**
      *   **Topic:** Kalai-Smorodinsky (KS) bargaining solution.
      *   **Goal:** Spend ~1 year on *conceptual* work (not just technical rederivation).
      *   **Focus:** Normative implications ("fair division" in real cooperative settings).
      *   **Current Knowledge:** Knows basics (disagreement to utopia line, monotonicity vs. IIA).
      *   **Proposed Questions:**
          1.  Normative interpretation of monotonicity when utopia shifts due to outside options.
          2.  Dropping convexity (discrete/non-convex sets).
          3.  Extension to $n > 2$ players.
          4.  Comparison to proportional/egalitarian solutions in distributive justice.
      *   **Task:** Prioritize/rank these questions (or suggest replacements), defend the ranking (upstream/downstream), identify dead ends, and explain what would change the order.
      *   **Constraints:** No citations, no survey style, just a defended agenda.

  2.  **Evaluate the Proposed Questions:**

      *   *Question 1 (Monotonicity & Outside Options):* This is core to the KS definition. KS relies on the "utopia point" (ideal point). If the utopia point changes because an outside option improves, KS says the agent *must* get more (monotonicity). But is that fair? If my potential max gain increases but I don't contribute more to the surplus, why should I get more? This strikes at the heart of "fairness" vs. "power."
      *   *Question 2 (Non-Convexity):* Technical constraint. KS is defined on convex sets. Real-world feasible sets often aren't. If the line-to-utopia intuition breaks, does KS lose its normative force? This is important for applicability, but maybe secondary to the definition of fairness itself.
      *   *Question 3 ($n > 2$):* KS is famously a 2-player solution. Generalizations exist (e.g., Kalai 1977), but they often lose the unique axiomatic characterization or require strong assumptions. If KS doesn't scale to groups, its utility for "distributive justice" (usually societal) is limited. This is a scalability issue.
      *   *Question 4 (Distributive Justice Comparison):* This connects game theory to philosophy. KS is often seen as a compromise between Nash (utilitarian-ish) and Egalitarian. But is it distinct enough? If it collapses into "proportional gains," is it interesting? This is the "so what?" question.

  3.  **Determine the Ranking & Strategy:**

      *   *Criterion:* Normative implications for real cooperative settings.
      *   *Top Priority:* Must address the *definition* of fairness inherent in the solution. If the core axiom is normatively bankrupt in real contexts, the rest doesn't matter.
      *   *Second Priority:* Scalability. Fairness for two people is less useful than fairness for societies/groups.
      *   *Third Priority:* Applicability (Convexity). If the math doesn't fit the reality, the theory is abstract.
      *   *Fourth Priority:* Comparison/Positioning. This is synthesis work, best done after the core concepts are stress-tested.

      *   *Refining the Ranking:*
          1.  **Monotonicity & The Utopia Point (Q1):** This is the engine of KS. If the "utopia point" is ill-defined or normatively suspect, KS collapses. The distinction between "potential" and "claim" is crucial.
          2.  **$n$-Player Extension (Q3):** Distributive justice is rarely dyadic. If KS can't handle $n>2$ without losing its normative soul, it's a niche tool.
          3.  **Distributive Justice Comparison (Q4):** This is the application layer. You need to know if KS holds water (Q1 & Q3) before comparing it to Rawls or Utilitarianism.
          4.  **Non-Convexity (Q2):** This feels like a technical hurdle. While important for implementation, the *concept* of fairness usually assumes a smooth trade-off space first. If the concept fails here, fix the concept. If it fails on convexity, it's a domain limitation. I'd rank this lower for *conceptual* work, higher for *applied* work.

      *   *Identifying Dead Ends:*
          *   Q2 (Non-convexity) risks becoming a technical fix-it project rather than a conceptual inquiry. Unless the non-convexity changes the *moral* intuition, it's just math.
          *   Q4 (Comparison) risks being superficial if not grounded in Q1.

      *   *Replacement/Synthesis:*
          *   Instead of just "Comparison," focus on "Informational Requirements." KS requires knowledge of the *utopia point*. Nash requires less. Egalitarian requires interpersonal comparability. This is a huge normative hurdle.
          *   Instead of just "$n>2$," focus on "Coalition Consistency." If a subgroup breaks off, does KS hold?

  4.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the goal (normative weight, not axiomatic elegance).
      *   *Rank 1: The Normative Status of the Utopia Point (Modified Q1).* Why? Because KS *is* the utopia point. If the utopia point is morally arbitrary (e.g., based on threat points or max possible rather than desert), the solution is tainted. The "Monotonicity" axiom is the vehicle, but the "Utopia" is the cargo.
      *   *Rank 2: The $n$-Player Problem (Q3).* Why? Justice is social. Dyadic fairness is a toy model. If KS relies on a specific geometric property of 2D triangles that doesn't generalize, it's not a theory of justice.
      *   *Rank 3: Informational Burdens (Replacement for part of Q4).* KS needs to know the ideal point. This requires knowing everyone's maximum potential utility. In real justice, we rarely know this. This is a deeper conceptual hurdle than just "comparison."
      *   *Rank 4: Non-Convexity (Q2).* Why last? Because it's often a technical approximation issue. We can convexify hulls. The moral intuition usually survives smoothing.
      *   *Dead End:* Purely technical generalizations of KS to $n$-players that preserve axioms but lose the "line to utopia" visual/normative intuition.
      *   *Reordering Conditions:* If it turns out the Utopia Point is indefensible, drop KS entirely. If $n$-player works seamlessly, move it up.

  5.  **Refining the "Monotonicity" Argument:**
      *   The user asked about monotonicity when outside options shift. I need to sharpen this. It's not just monotonicity; it's the *source* of the utopia point. Is the utopia point a *claim* or a *capacity*? If I can produce more alone, do I deserve more in cooperation? KS says yes. Many theories of justice say no (cooperation creates surplus, split the surplus). This is the critical tension.

  6.  **Refining the "$n$-Player" Argument:**
      *   In 2D, the line is unique. In 3D, the "line to utopia" intersects the Pareto frontier at a unique point *if* the set is comprehensive and convex. Wait, actually, the KS solution *does* generalize to $n$-players mathematically (intersection of line from $d$ to $u$ with Pareto frontier). The *axiomatic* uniqueness is the problem. The user said "monotonicity doesn't uniquely determine a point." Actually, the geometric definition does, but the axiomatic support weakens. I need to be careful here. The conceptual issue is whether the *logic* holds, not just the math. The logic is "equalize relative gains." Does "relative gain" make sense in $n$-dimensions? Yes. But does it satisfy coalition stability? That's the real question.

  7.  **Finalizing the Agenda:**
      *   1. **The Moral Status of the Ideal Point:** (Deep dive into Q1).
      *   2. **Scalability and Coalition Stability:** (Deep dive into Q3).
      *   3. **Informational Requirements & Interpersonal Comparison:** (Refining Q4).
      *   4. **Non-Convexity:** (Q2, deprioritized).

      *   *Dead End:* Worrying about non-convexity before settling the ideal point.
      *   *Reordering:* If Ideal Point is incoherent, stop.

  8.  **Tone Check:**
      *   Direct, opinionated, defended. No citations. Focus on "why this matters for fairness."

      *(Self-Correction during drafting)*: I need to make sure I don't get bogged down in the math of the $n$-player extension. The user noted monotonicity doesn't uniquely determine the point in $n$-dimensions. Actually, the *geometric* KS solution is well-defined for $n$ players (ray from disagreement to ideal). The *axiomatic characterization* is the tricky part. I should focus on whether the *normative intuition* of "equalizing relative concessions" scales, not just the math.

      *(Another Correction)*: The user asked about "monotonicity... when utopia shifts because outside option improves." This is specific. I should address that specific mechanism. If my max possible utility goes up because I have a better BATNA, KS gives me more of the *cooperative* surplus. Is that fair? Or is that just power? This is the crux.

      *(Final Plan)*:
      1.  **Priority 1: The Normative Weight of the Utopia Point.** (The "Claim" vs. "Capacity" problem).
      2.  **Priority 2: The $n$-Player/Coalition Stability.** (Does fairness fragment?).
      3.  **Priority 3: Informational Demands.** (Can we ever know the utopia point?).
      4.  **Deprioritized: Non-Convexity.** (Technical, not conceptual).
      5.  **Dead End:** Axiomatic tinkering without normative grounding.

