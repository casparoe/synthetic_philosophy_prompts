answer: |-
  Here is a prioritized research agenda for a year of conceptual work on Kalai-Smorodinsky (KS), ranked by their importance to the normative validity of the solution in real-world fair division contexts.

  ### 1. The Moral Status of the "Utopia Point" (Priority: Critical)
  **Replace your first bullet with this broader framing.** You asked about monotonicity when outside options shift, but that is a symptom of a deeper problem: the normative definition of the *ideal point* itself.

  In KS, the solution is determined by the ray from the disagreement point to the *utopia point* (the vector of maximum possible utilities for each agent). The core normative claim of KS is that fairness consists in equalizing *relative concessions* from the ideal, rather than maximizing the product of gains (Nash).

  **Why this is upstream:**
  If the utopia point is morally arbitrary, the entire solution is tainted. In many real-world cooperative settings, the "maximum possible utility" for an agent is determined by their threat power or their standalone capacity, not by their contribution to the cooperative surplus.
  *   **The Research Question:** Does an agent's *capacity* to achieve a high utility alone constitute a valid *claim* on the cooperative surplus?
  *   **The Tension:** If Agent A's utopia utility increases because they have a better outside option (threat point), KS dictates they receive a larger share of the *cooperation* surplus (via monotonicity). Normatively, this conflates "power" with "desert." A theory of fair division usually wants to mitigate the effects of brute luck or asymmetric threat power, whereas KS codifies them into the fairness metric.
  *   **The Goal:** Determine if the utopia point should be defined by *feasible maximums* (current KS) or *justified claims* (some normative ceiling). If you cannot defend the idea that "what I could get alone" dictates "what I deserve together," KS loses its normative force.

  **Why this is #1:** If the anchor point is normatively bankrupt, the geometry of the solution doesn't matter. This is the foundation.

  ### 2. Coalition Stability and the $n$-Player Extension (Priority: High)
  **Your third bullet, but sharpened.** You noted that monotonicity doesn't uniquely determine a point in $n$-dimensions. Mathematically, the geometric definition (intersection of the ray to the utopia point and the Pareto frontier) generalizes easily to $n$ players. The problem is *conceptual consistency*.

  **Why this is upstream of application:**
  Distributive justice is rarely dyadic. If KS is to be a theory of fairness, it must handle subgroups.
  *   **The Research Question:** Is KS *coalition-consistent*? If a solution is chosen for a group of three, and two of them decide to split off and divide their allocated share between themselves, does that sub-division match what KS would have prescribed for just those two?
  *   **The Problem:** Many bargaining solutions fail consistency tests. If KS prescribes a division for a trio that incentivizes a pair to break away and renegotiate (because the $n$-player KS allocation isn't stable for the subgroup), it fails as a stable norm for social cooperation.
  *   **The Goal:** Investigate whether the "equal relative concession" intuition holds when the "relative" metric is diluted by the presence of third parties. Does my concession relative to *you* matter, or relative to *the group*?

  **Why this is #2:** A theory of fairness that creates instability in larger groups is practically useless for political or social philosophy. It limits KS to a niche tool for bilateral contracts.

  ### 3. Informational Requirements and Interpersonal Comparability (Priority: Medium-High)
  **A refinement of your fourth bullet.** You asked about comparing KS to proportional/egalitarian solutions. The deeper conceptual hurdle is *knowability*.

  **Why this matters:**
  KS requires knowledge of the *utopia point*. To calculate the ray, you must know the maximum utility every other agent could possibly achieve in the feasible set.
  *   **The Research Question:** Is the utopia point epistemically accessible in real justice contexts?
  *   **The Problem:** In many distributive justice scenarios (e.g., tax policy, resource allocation), we do not know the "maximum possible utility" for citizens without distorting incentives. Furthermore, KS typically assumes utility is scaled such that the utopia point is comparable across agents. This requires strong interpersonal comparability of utility. Nash bargaining can sometimes get away with ordinal utility; KS requires cardinal, comparable utility to define the "100%" mark for everyone.
  *   **The Goal:** Assess whether the informational burden of KS makes it implementable as a normative standard. If "fairness" requires knowledge that is impossible to gather without violating privacy or creating perverse incentives, is it a valid theory of justice?

  **Why this is #3:** Even if the moral logic (Priority 1) and group logic (Priority 2) hold, the solution is a "fair ideal" that cannot be applied. This determines if KS is a practical normative guide or just a mathematical curiosity.

  ### 4. Non-Convexity and Discrete Sets (Priority: Low)
  **Your second bullet.** I am ranking this lowest for *conceptual* work.

  **Why this is downstream:**
  Non-convexity is primarily a technical constraint, not a normative one.
  *   **The Argument:** In most conceptual analyses of fairness, we assume divisibility of goods or smooth trade-offs to isolate the moral intuition. If the KS intuition (equal relative concessions) is sound, non-convexity is an implementation detail (e.g., use the convex hull, or randomize over discrete points).
  *   **The Risk:** Spending time here risks turning your year into a technical exercise in fixed-point theorems rather than a philosophical inquiry into fairness. Unless the non-convexity fundamentally alters the *moral* interpretation of the utopia point (e.g., in discrete cases where the "line" skips over the only morally acceptable outcome), this is a mathematical patch, not a conceptual breakthrough.

  **Why this is #4:** Fix the moral foundation first. If the foundation is cracked, it doesn't matter if the house is built on convex or non-convex land.

  ---

  ### The Dead End: Axiomatic Tinkering
  **What to avoid:** Do not spend time trying to find new axioms that uniquely characterize KS in $n$-dimensions without addressing the normative content of those axioms.

  There is a rich literature of "here is a variation of monotonicity that restores uniqueness." This is a dead end for your goals. Adding technical axioms to save the math does not answer whether the solution is *fair*. If the core intuition of the utopia point is flawed (Priority 1), no amount of axiomatic patching will make KS a viable theory of justice.

  ### Reordering Conditions
  I would change this agenda under two conditions:

  1.  **If the Utopia Point is Defensible only as "Threat Power":** If you conclude in Month 2 that the utopia point *must* represent threat capacity to make sense of the math, I would recommend abandoning KS as a theory of *justice* and reclassifying it as a theory of *power equilibrium*. At that point, Priority 2 ($n$-player) becomes #1, because stability is the only remaining virtue of a power-based model.
  2.  **If Informational Requirements are Insurmountable:** If you find that interpersonal comparability is strictly impossible in your target domain (e.g., subjective well-being), Priority 3 moves to #1. There is no point in analyzing the moral weight of a metric you cannot measure.

  ### Summary of the Agenda
  1.  **Month 1-4:** Attack the **Utopia Point**. Is "maximum feasible utility" a valid proxy for "fair claim"? If not, can KS be modified to use a "normative ideal point" instead of a "feasible ideal point"?
  2.  **Month 5-8:** Attack **Scalability**. Does "equal relative concession" create stable norms in groups of 3+, or does it fracture into coalitional instability?
  3.  **Month 9-12:** Attack **Implementability**. Can we ever know the ideal point well enough to use KS as a policy guide, or is it strictly a theoretical benchmark?

  This path ensures that if you find a flaw, you find it early (in the moral foundation), rather than late (in the geometric edge cases).
