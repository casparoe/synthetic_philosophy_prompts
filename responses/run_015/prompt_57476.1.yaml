  **Likely Reply:** It tracks objective moral value, distinct from accountability.
  **Follow-up:** So if I ignore that value blamelessly, why should I prioritize changing my behavior over staying comfortable?

  2. If the non-donor acts wrongly but blamelessly, is it fitting—that is, emotionally appropriate—for the recipient to resent them, or for the non-donor to feel guilt?
  **Likely Reply:** Guilt and resentment are inappropriate if blame is unfair.
  **Follow-up:** Then isn't "wrong" just a theoretical fact with no emotional grip on the people involved?

  3. Your fairness constraint on blame sounds like Scheffler's agent-centered prerogative, which allows agents to sometimes prioritize themselves. If you say it's different, can you name one concrete case where your view permits an act that a supererogationist would forbid?
  **Likely Reply:** No, because I say the act is still wrong, they say it's optional.
  **Follow-up:** But if both views allow the agent to keep their kidney without sanction, what difference does the "wrong" label make to the agent's decision?

  4. ★ Kant had imperfect duties, like beneficence, which allow latitude in how we fulfill them. How is your blameless wrongness different from that, and what stops that latitude from sliding into an anything-goes excuse?
  **Likely Reply:** Kantian duties are still duties; my view separates obligation from accountability.
  **Follow-up:** But if I can ignore the duty blamelessly whenever it's hard, haven't I effectively dissolved the duty?

  5. If the kidney donor merely did their duty, does praise still make sense? Usually we praise people for going above and beyond, not for doing the bare minimum.
  **Likely Reply:** We praise people for doing difficult duties well.
  **Follow-up:** But doesn't that flatten the moral landscape so that heroes and minimum-compliers are doing the same kind of thing?

  6. You allow wrong-but-blameless acts. Do you accept the mirror image: acts that are technically right but blameworthy, like being needlessly petty but within your rights?
  **Likely Reply:** Yes, morality covers more than just rules.
  **Follow-up:** If so, why is supererogation the only category we need to eliminate? Why not keep both?

  7. ★ If omitting the rescue is wrong, does that wrongness license legal compulsion, like Good Samaritan statutes? Or do you have a third layer of fairness constraints for the state too?
  **Likely Reply:** No, law requires different standards than morality.
  **Follow-up:** Then why should the individual care about the moral label if the state and peers shouldn't enforce it?

  8. What makes the omission wrong at all if you aren't a consequentialist, judging acts only by outcomes? And if you are a consequentialist, why isn't this just a debate about consequentialism?
  **Likely Reply:** It's about value, not just outcomes.
  **Follow-up:** But if the demand comes from maximizing value, haven't you just imported consequentialism without the name?

  9. Acts like teaching your children or pulling someone from shallow water used to seem saintly but are now basic duties. Is that your view winning, or evidence the category tracks something real that moves?
  **Likely Reply:** It shows social expectations change, not moral reality.
  **Follow-up:** But if expectations determine blamelessness, isn't morality just sociology?

  10. I appreciate how you clarify the debate by saying it's largely verbal, just carving the moral landscape differently. Doesn't admitting it's merely verbal concede that the supererogationist's carving is just as valid as yours?
  **Likely Reply:** No, one carving is more useful than the other.
  **Follow-up:** But if validity isn't the issue, why call their category fake instead of just less useful?

  11. What is the strongest argument a supererogationist has against you, and what specific evidence would actually get you to give the view up?
  **Likely Reply:** They say it distorts moral experience. I need a case where blame is fair but the act is supererogatory.
  **Follow-up:** So if we found a case where we all agree blame is fair but the act is heroic, you'd concede?
