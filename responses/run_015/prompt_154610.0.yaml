answer: |-
  This is a classic philosophical problem dressed up in a modern neuroscience context. You are intuitively grasping a distinction that philosophers of mind have debated for decades, while your cousin is taking a hardline physicalist stance.

  The short answer is: **You are right.** There is a category of knowledge she gained that her models could not provide, even if her models predicted her behavior perfectly.

  Here is the breakdown of why your intuition holds water, using both philosophy and the limits of scientific modeling.

  ### 1. The "Mary's Room" Thought Experiment
  Your cousin's situation is almost an exact real-life replica of a famous philosophical thought experiment proposed by Frank Jackson in 1982, known as **"Mary's Room."**

  *   **The Scenario:** Mary is a brilliant neuroscientist who specializes in color vision. She knows everything physical there is to know about color: the wavelengths, the way the retina processes light, the exact neural pathways in the brain. However, Mary has lived her entire life in a black-and-white room. She has never *seen* color.
  *   **The Question:** When Mary finally steps outside and sees a red apple for the first time, does she learn anything new?
  *   **The Cousin's View:** No. She already knew the physical data. The experience is just the data running locally.
  *   **The Consensus View:** Yes. She learns **what it is like** to see red.

  Your cousin knew the *structure* of homesickness (the neural correlates, the predictive outputs), but she didn't know the *phenomenology* of it (the qualitative feel). She knew the map, but she hadn't walked the territory.

  ### 2. Propositional Knowledge vs. Acquaintance Knowledge
  Epistemology (the study of knowledge) distinguishes between different types of knowing. Your cousin is conflating them.

  *   **Propositional Knowledge (Knowing That):** This is what your cousin had before she moved. *Knowing that* the anterior cingulate cortex lights up during nostalgia. *Knowing that* people report a "heavy chest." This is objective, transferable data.
  *   **Acquaintance Knowledge (Knowing Of/By):** This is what she gained. This is knowledge by direct experience. You can know every chemical compound in a strawberry (propositional), but that is not the same as tasting the strawberry (acquaintance).

  When she says she "didn't learn anything genuinely new," she is defining "knowledge" strictly as *propositional data*. But human life is largely lived in *acquaintance knowledge*. The difference between reading a medical textbook about broken bones and breaking a bone is not in the data; it is in the **reality of the state.**

  ### 3. The Map Is Not the Territory
  Your cousin's models predict the *report* of the feeling, not the *feeling* itself. This is a crucial distinction in neuroscience.

  *   **The Report:** "I feel a 7/10 ache in my chest." (This is data.)
  *   **The Feeling:** The actual, visceral, disruptive, somatic experience of that ache. (This is the phenomenon.)

  A weather model can predict a hurricane with 100% accuracy. It can tell you the wind speed, the pressure drop, and the damage radius. But standing in the hurricane is not "just running the data through your own sensors." The **embodied impact** is different.

  When your cousin felt homesick, that feeling likely influenced her decision-making, her sleep, and her stress levels in real-time in a way that reading a graph never could. The data describes the system; the experience *is* the system running.

  ### 4. Embodied Cognition
  Neuroscience is increasingly recognizing that cognition isn't just brain activity; it's **embodied**. The "ache" of homesickness isn't just a firing pattern; it's a hormonal cascade, a tension in the muscles, a change in gut microbiota, a shift in posture.

  Before she moved, she studied the *correlates* of these states from the outside (third-person perspective). After she moved, she inhabited the state (first-person perspective). Even if the *output* (her survey response) was exactly what her model predicted, the **internal causal chain** was different. She is no longer an observer of the phenomenon; she is a participant. That changes the nature of her relationship to the data.

  ### 5. Why She Says You're "Romanticizing"
  Your cousin isn't necessarily being arrogant; she is being a good reductionist scientist. In her field, subjective experience is often treated as a "black box" that needs to be explained by physical mechanisms. To admit that there is something "extra" beyond the physical data feels like admitting that science has limits.

  She calls it "romanticizing" because, from a strict physicalist viewpoint, if you account for all the atoms and neurons, there shouldn't be anything left over. But this ignores the **emergent property** of consciousness. The wetness of water isn't found in a single hydrogen atom; it emerges from the interaction. Similarly, the "ache" of nostalgia emerges from the neural network, but it cannot be fully understood by analyzing the nodes individually.

  ### The Verdict
  Your cousin is right that her **science** was complete. Her models worked. She successfully predicted the measurable outcomes.

  But you are right that her **understanding** was incomplete.

  She gained **phenomenal knowledge**. She now knows the *texture* of the data she has been studying for a decade. There is a profound difference between knowing that a signal fires and knowing what it *costs* to fire that signal.

  She didn't learn new *facts*, but she gained new *context*. And in the study of human experience, context is not just decoration; it is essential. You aren't romanticizing feelings; you are recognizing that human beings are not just data processors—we are the things being processed.
