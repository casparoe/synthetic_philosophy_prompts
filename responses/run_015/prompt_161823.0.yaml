answer: |-
  **Joint Statement of Adversarial Collaboration: The Ontology and Ethics of Longworld**

  **Purpose:** This document defines the disagreement between Virtual Realists and Derivative-Harm Fictionalists regarding persistent online environments. It does not resolve the dispute but clarifies the stakes, agreements, and specific points of divergence using the stipulated case of **Longworld** (a 20-year persistent world with non-duplicable items, player courts, unofficial real-money trade, and deep social integration).

  ### I. Agreed Claims

  Both camps endorse the following propositions:

  1.  **Moral Significance:** Interactions within Longworld carry moral weight. Actions taken there can be wrong, and participants can be victims.
  2.  **Person-Harm is Real:** Both sides agree that distress, wasted time, lost real-world opportunities, and damaged real-world relationships resulting from virtual actions constitute genuine harms to persons.
  3.  **Consent Limits Recourse, Not Morality:** While players consent to Terms of Service (ToS) including banishment, this consent limits legal or administrative recourse but does not automatically settle the moral permissibility of operator or player actions.
  4.  **Fiction Analogy Breaks Down:** Longworld is not analogous to ordinary fiction (e.g., novels) due to its persistence, interactivity, and social consequences. The "make-believe" model requires modification to fit the data.
  5.  **Separation of Questions:** The question "Are virtual objects real?" is distinct from "Are virtual harms real?" It is logically consistent to be a realist about objects but deny distinctive harms, or vice versa. We reject the assumption that object realism is required for harm realism.
  6.  **Generality Constraint:** Any criterion used to define virtual objects or harms must account for analogous institutional facts outside games (e.g., Monopoly hotels, poker chips, scoreboards) without arbitrary exceptions.

  ### II. Disagreements Table

  | Issue | Virtual Realist Wording | Derivative-Harm Fictionalist Wording | Type & Why |
  | :--- | :--- | :--- | :--- |
  | **1. Ontology of Items** | Items (swords, land) are distinctive artifactual objects constituted by server state plus social practice. They exist dependent on the system but are not merely fictional. | Items are server states licensed by a fiction. They are props in a collaborative make-believe game, not ontological objects distinct from the code and the players' attitudes. | **Substantive.** Disagreement over the metaphysical category of the entity itself, not just its label. |
  | **2. Unnoticed Deletion** | Deleting a player's items without their knowledge is a wrong done to the owner/object, even if the owner suffers no distress or real-world loss. | If the owner never finds out and suffers no distress or opportunity loss, no wrong has occurred. There is no victim, therefore no harm. | **Substantive.** Disagreement over whether harm requires a subjective or objective setback to interests. |
  | **3. Migration Identity** | If the causal history of the server state is broken or the physics change significantly, the original object is destroyed, even if a functional duplicate appears. | If players recognize the item as serving the same function and identity within the practice, it is the same item. User recognition fixes identity. | **Verbal/Substantive.** Disagreement over whether identity conditions are physical/causal or social/functional. |
  | **4. The Sealed World** | If everyone stops logging in but servers run, wrecking builds is vandalism of existing objects. | If no players are present to sustain the fiction, there are no objects to wreck, only changing magnetic states on a drive. | **Substantive.** Disagreement over whether practice is required for object existence. |
  | **5. Generality Check** | Monopoly hotels and poker chips are real institutional objects similar to virtual items; the distinction lies in the persistence and scope of the practice. | Monopoly hotels are props like virtual items; the difference is merely the stakes involved, not the ontology. | **Verbal.** Both agree on the facts; disagreement is on whether to group these cases together under "real objects." |

  ### III. Cruxes

  These are the specific points where evidence or argument could shift positions. We record predictions in advance.

  **Crux 1: The Victimless Wrong (Case 1)**
  *   **Sub-question:** Can a wrong exist without a felt grievance or real-world setback?
  *   **Test/Evidence:** Intuition pumps regarding secret deletion vs. secret theft of physical property.
  *   **Predictions:** Realists predict intuition will align with physical theft (wrong done regardless of knowledge). Fictionalists predict intuition will align with deleted files on a private hard drive (no wrong if unknown).
  *   **Status:** If both sides agree that secret deletion is morally neutral, Realists must refine their object theory. If both agree it is wrongful, Fictionalists must expand their harm theory beyond distress.

  **Crux 2: Avatar-Directed Acts**
  *   **Sub-question:** Do acts directed at an avatar (harassment, unwanted simulated sexual contact) involve a distinctive kind of wrong, or is the wrong exhausted by distress and real-world relational facts?
  *   **Test/Evidence:** Player testimony on whether the *virtual nature* of the act adds to the violation, distinct from real-world harassment.
  *   **Predictions:** Realists predict players will report a distinctive violation of their virtual bodily integrity. Fictionalists predict reports will cite only distress, fear, or social exclusion, reducible to standard psychological harms.
  *   **Status:** **Potentially Unresolvable.** Phenomenological reports may be interpreted differently by each side (e.g., is "virtual bodily integrity" a real thing or a description of distress?).

  **Crux 3: Migration Reaction (Case 3)**
  *   **Sub-question:** Upon engine migration, do players mourn the loss of the *object* or the loss of *utility/status*?
  *   **Test/Evidence:** Empirical study of player reaction to item ID changes during server transfers. Willingness-to-pay to retain old IDs vs. functional stats.
  *   **Predictions:** Realists predict significant distress over identity discontinuity even if function is preserved. Fictionalists predict distress correlates only with loss of function or status, not ID changes.
  *   **Status:** Empirical. If players disregard ID changes entirely, Realist identity conditions are weakened.

  **Crux 4: The Generality Check (Case 6)**
  *   **Sub-question:** Does the criterion for virtual objects sort Monopoly hotels and poker chips correctly?
  *   **Test/Evidence:** Logical consistency check.
  *   **Predictions:** Realists argue these are also real institutional objects. Fictionalists argue these are also fictions/props.
  *   **Status:** **Verbal.** Both sides likely agree on the treatment of chips/hotels. The dispute is whether "real object" is the right label for that category. If the label is the only difference, the dispute is verbal. If the label implies different legal/moral protections, it is substantive.

  **Note on Unresolvable Cruxes:**
  We acknowledge that the metaphysical status of server state (Crux 2 & 4) may not be settleable by empirical evidence. If the disagreement rests entirely on whether to apply the word "real" to institutional facts supported by code, this is a verbal dispute about language, not the world. However, if this labeling dictates distinct moral protections (e.g., restitution for object destruction vs. compensation for distress), the dispute becomes substantive again. We agree to track whether the ontology drives the ethics or merely describes it.
