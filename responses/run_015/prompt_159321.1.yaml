prompt: |-
  My city's land-use process has a shape I cannot make philosophical sense of, and I would like its implicit theory made explicit rather than argued for or against.

  Here is how it works, as I understand it. Most residential land is zoned single-family. Putting two or more units on a lot zoned single-family requires a discretionary permit: the city mails notice to owners of record within three hundred feet, holds a public hearing before the planning commission and then before the council, and issues written findings. Incompatibility with what the staff reports call neighborhood character, added traffic, loss of curbside parking, and shadow are all accepted grounds for denial, and none of them has to be quantified or shown to reduce anyone's property value. Opponents may also sue under the state environmental-review statute on the ground that the city's analysis was inadequate, which routinely adds a year or more; the delay is part of what opposition buys. By contrast, demolishing a house on the same lot and replacing it with one very large single-family house is approved ministerially: no notice, no hearing, no appeal, even when the replacement generates more traffic and more shadow than the duplex would have. Meanwhile the same council is under a state mandate to plan for several thousand additional homes over the next decade, and fair-housing law forbids the city, and largely forbids sellers and landlords, from selecting occupants by race, by family status, or, in some states, by source of income. The neighborhood therefore cannot say who may live on a street, though through the permit process it can determine roughly what the housing there will cost. Last year the council added a second track: projects within a quarter mile of a frequent bus line, and projects in which at least a fifth of the units are income-restricted, are now approved ministerially, with no hearing and no appeal, while everything else keeps the full process; and in the older streetcar-era neighborhoods near downtown it simultaneously adopted an overlay that strengthens the hearing requirement and adds design review. Nobody is compensated when the council approves over objection, and nobody pays anything when it denies.

  Five features of this package strike me as pulling in different directions. First, standing is set by parcel and radius rather than by stake: someone who bought last month and a family that has lived on the block for fifty years have identical standing, the tenant next door is not notified at all even when the project would demolish the building she lives in, and the people who would occupy the new units are not parties, are not counted, and are not notified, despite being more numerous and, by any ordinary measure of intensity, more strongly affected. Second, the intensity of opposition is itself recorded as evidence of harm: findings recite how many letters arrived and how many residents signed up to speak, and a large turnout counts in favor of denial, while no comparable tally is taken on the other side and intensity is never weighed against intensity. Third, the veto reaches the form of other people's property but not its occupancy or its ordinary use: a neighbor cannot be stopped from painting the house, keeping several cars on the property, or selling to anyone at all, but can be stopped from adding a second unit. Fourth, the same objection now has no force two blocks from a bus line and full force three blocks away, and is treated as defeasible by transit proximity and by subsidy while being hardened in the overlay districts. Fifth, the process contains no symmetric affirmative power: residents can block a great deal and compel nothing.

  What I want is the view of a person's claim on a place that this bundle presupposes, and I can think of five candidates. The first treats homeownership as an undiversifiable stake in a local collective asset whose value depends on the built and social character of the immediate area, with the veto as the protection of that stake. The second treats residence as membership in a self-governing community with a collective right to determine the shape of its common life, a right to the city as a right to shape rather than merely a right of access. The third treats the process as the protection of legitimate expectations formed under an earlier set of rules about school capacity, parking, quiet, and outlook. The fourth treats the hearing as an information-eliciting device, on the assumption that nearby residents know local facts that planners do not. The fifth says the practice is not the expression of any view at all but the predictable result of concentrated benefits and diffuse costs.

  For each of these, tell me whether the practice as I have described it strictly presupposes the view, is merely compatible with it, or actually conflicts with some feature of it; and be explicit about where my description underdetermines the answer, in the sense that two or three of the theories would license exactly the process I have described, and about which single change to the process would best discriminate between them. Then tell me what would have to change if the city replaced the presupposed view with one of the others: what a process built on the investment-stake view would look like as opposed to one built on the membership view, what a process built on the protection of expectations would substitute for the veto, and what a process honestly designed to elicit local information would do with a roomful of angry residents and a petition.

  I am less interested in whether the neighbors are right than in what the city commits itself to by running things this way. In particular: is the two-track reform an admission that the veto was never a right but only a defeasible privilege, and what principle is the city adopting when it removes that privilege near transit while reinforcing it, through the overlay, in the neighborhoods that are oldest, most central, and most able to afford lawyers?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Analyze a specific land-use process described by the user.
      *   **Goal:** Make the *implicit theory* of the process explicit. Do not argue for/against it.
      *   **Input:** A detailed description of a city's zoning/permitting system (discretionary permits for multi-family, ministerial for single-family, state mandates, two-track reform, specific procedural features like standing, intensity of opposition, veto power, etc.).
      *   **Specific Questions:**
          1.  Evaluate five candidate theories (Investment-Stake, Membership/Community, Legitimate Expectations, Information-Eliciting, Public Choice/Concentrated Benefits) against the described practice. (Strictly presupposes vs. Compatible vs. Conflicts).
          2.  Identify where the description underdetermines the answer (theories licensing the same process).
          3.  Identify a single change to discriminate between theories.
          4.  Describe what the process would look like if built on each of the alternative views (Investment, Membership, Expectations, Information).
          5.  Address the specific question about the "two-track reform" (admission of privilege vs. right) and the principle behind reinforcing the veto in wealthy/old neighborhoods while removing it near transit.
      *   **Constraint:** Focus on what the city *commits itself to*, not whether neighbors are right.

  2.  **Deconstruct the Land-Use Process (The "Data"):**
      *   *Rule 1:* Single-family (SF) = Ministerial (as of right). Multi-family (MF) = Discretionary (hearings, veto).
      *   *Rule 2:* Demolition/Rebuild SF = Ministerial (even if bigger/shadowier than MF).
      *   *Rule 3:* Standing = Owners within 300ft. (Tenants excluded, Future residents excluded).
      *   *Rule 4:* Evidence = Intensity of opposition counts (letters/turnout). No counter-tally. Unquantified harms (character, shadow).
      *   *Rule 5:* State Mandate = Plan for growth. Fair Housing = No discrimination on occupants.
      *   *Rule 6:* Two-Track Reform = Transit/Affordable = Ministerial. Overlay (Old/Rich) = Stricter Discretionary.
      *   *Rule 7:* No compensation for approval, no penalty for denial.
      *   *Rule 8:* Asymmetric Power = Can block, cannot compel.

  3.  **Evaluate the Five Candidate Theories:**

      *   *Theory 1: Investment-Stake (Home as undiversifiable asset).*
          *   *Fit:* High. Explains the veto (protecting value). Explains why SF rebuild is okay (maintains asset class) but MF is not (threatens asset class). Explains why tenants don't get standing (no equity stake).
          *   *Conflict:* The two-track reform undermines this. If it's a *right* to protect value, why does it vanish near transit? Unless the state preempts it, but the description says the *city* adopted the track. The overlay strengthens it in rich areas, which fits (more value to protect).
          *   *Verdict:* Compatible, perhaps strictly presupposed by the original SF/MF distinction, but conflicts with the *logic* of the two-track reform unless viewed as political compromise.

      *   *Theory 2: Membership/Community (Right to shape common life).*
          *   *Fit:* High. Explains "neighborhood character." Explains the hearing as a community gathering.
          *   *Conflict:* Excludes tenants from standing (they are members of the community too). Excludes future residents. The SF rebuild (massive mansion) is allowed even if it changes character more than a duplex, which conflicts with "shaping common life" unless "common life" is code for "single-family exclusivity."
          *   *Verdict:* Compatible with the *rhetoric* (character), but conflicts with the *mechanics* (tenants excluded, SF mansions allowed).

      *   *Theory 3: Legitimate Expectations (Reliance on earlier rules).*
          *   *Fit:* Medium. Explains opposition to change.
          *   *Conflict:* The SF rebuild creates *more* shadow/traffic than the duplex, violating expectations of quiet/shade more than the denied project. Also, the two-track reform changes the rules retroactively for some, undermining the idea that expectations are sacred.
          *   *Verdict:* Conflicts with the SF rebuild provision primarily.

      *   *Theory 4: Information-Eliciting (Locals know best).*
          *   *Fit:* Low.
          *   *Conflict:* Intensity counts as evidence (letters != facts). No counter-evidence weighed. Tenants (who know the building best) are excluded. SF rebuilds (which have local impacts) don't trigger the info-gathering.
          *   *Verdict:* Conflicts significantly. The process treats opposition as *political weight*, not *information*.

      *   *Theory 5: Public Choice (Concentrated benefits/Diffuse costs).*
          *   *Fit:* Very High. Explains everything descriptively.
          *   *Conflict:* None really. It's a descriptive theory of *cause*, not a normative theory of *claim*. The prompt asks for the view of a *person's claim*. Public Choice says there *is* no valid claim, just power.
          *   *Verdict:* Compatible as an explanation of origin, but doesn't justify the *claim* structure (standing, etc.) normatively.

  4.  **Underdetermination & Discriminating Change:**
      *   *Underdetermination:* Investment-Stake and Membership views look very similar here. Both justify the veto. Both exclude non-owners (mostly).
      *   *Discriminator:* Compensation. If it's an investment stake, taking it away (via approval) should trigger compensation (Takings). If it's membership, maybe not. Or, Tenant Standing. If it's membership, tenants should vote. If it's investment, they shouldn't.
      *   *Best Single Change:* Grant standing to tenants. If the process remains the same but tenants get votes, it kills the Investment theory. If they don't, it supports Investment over Membership.

  5.  **Designing Alternative Processes:**
      *   *Investment-Stake Process:* Needs to treat zoning changes as takings. If you build MF, you pay neighbors for lost value. Or, neighbors get equity in the new project.
      *   *Membership Process:* Tenants get votes. Future residents get representation (advocate). Focus on social fabric, not just property lines.
      *   *Expectations Process:* Freeze the neighborhood. No rebuilds that exceed original footprint/shadow. Grandfathering is absolute.
      *   *Information Process:* Hearings are depositions. Letters count only if they cite verifiable data (traffic counts, shadow studies). Staff verifies. No "I feel" testimony.

  6.  **Addressing the Two-Track Reform & Overlay:**
      *   *Is it an admission?* Yes. It admits the veto is a policy tool, not a fundamental right. Rights aren't usually switched off based on bus proximity.
      *   *Principle:* It's a "YIMBY by geography" compromise. Sacrifice the periphery/transit corridors to save the core. It treats the veto as a *conservation easement* purchased from the wealthy/old neighborhoods by allowing density elsewhere. It admits the veto is a privilege of political power (lawyers/wealth) codified into policy.

  7.  **Drafting the Response:**
      *   *Tone:* Philosophical, analytical, precise. Avoid normative judgment ("this is bad"). Stick to "this implies X."
      *   *Structure:*
          1.  Evaluation of the 5 Theories (Presupposes/Compatible/Conflicts).
          2.  Underdetermination & Discriminating Change.
          3.  Alternative Process Designs.
          4.  Analysis of the Two-Track Reform.
      *   *Refinement:* Ensure the distinction between "Investment" and "Membership" is sharp. Investment is financial/property-based. Membership is social/political-based. The exclusion of tenants is the key wedge between them. The SF Rebuild loophole is the key wedge against "Expectations" and "Character."

      *(Self-Correction during drafting)*: I need to be careful with Theory 5 (Public Choice). The prompt asks for "a person's claim on a place." Public Choice denies there *is* a moral claim, only power dynamics. I should note that it explains the *existence* of the process but doesn't validate the *claims* made within it. However, the prompt asks if the practice *presupposes* the view. The practice presupposes that concentrated interests *should* win, which aligns with Public Choice outcomes, but Public Choice is usually descriptive, not normative. I will frame it as: The process is *consistent* with Public Choice predictions, but Public Choice doesn't offer a theory of *right*, only of *force*.

      *(Refining the "Single Change")*: Tenant standing is good. But maybe "Compensation" is better to distinguish Investment from Membership. If I have a stake, I should be paid. If I am a member, I should vote. Let's look at the prompt again: "view of a person's claim." Standing is more about who has a claim. Compensation is about the remedy. Standing is more fundamental. Let's go with Tenant Standing as the discriminator between Investment and Membership.

      *(Refining the Two-Track Analysis)*: The prompt asks: "is the two-track reform an admission that the veto was never a right but only a defeasible privilege?" Yes. And "what principle is the city adopting?" It's a principle of *zoning trade-offs* or *regulatory budgeting*. Density here buys stability there.

  8.  **Final Polish:** Check against constraints. Did I argue for/against? No. Did I make the implicit explicit? Yes. Did I answer the specific questions about the reform? Yes.

      *Wait, one nuance:* The prompt asks about the "Investment-Stake view" vs "Membership view" in the *alternative process* section. I need to make sure I distinguish them clearly there.
      *Investment:* Focus on property values, compensation, equity.
      *Membership:* Focus on residency, voting, social cohesion.

      *Let's check the "Expectations" theory again.* The SF rebuild conflicts with it. If I expect quiet, a mansion hurts more than a duplex. So the process *conflicts* with a pure Expectations theory. It only supports Expectations regarding *density type*, not *massing*. I need to be precise there.

      *Let's check the "Information" theory again.* The process counts *intensity* (number of letters) as evidence. That is explicitly *not* information elicitation. That is political pressure. So it *conflicts* with Information theory.

      *Okay, ready to write.*
answer: |-
  This analysis treats the land-use process not as a policy to be evaluated, but as a text to be interpreted. The procedures, standing rules, and exemptions constitute a grammar of property and citizenship. Below is the explication of the implicit theory of claims presupposed by your city's practice, followed by the structural implications of shifting that theory.

  ### I. Evaluation of the Five Candidate Theories

  Here is how the described practice relates to each of the five theoretical candidates.

  **1. The Investment-Stake View**
  *Homeownership as an undiversifiable asset; the veto protects equity.*
  *   **Verdict:** **Strictly Presupposed** by the original single-family/duplex distinction, but **Conflicts** with the two-track reform.
  *   **Analysis:** The process treats the physical form of neighbors' property as a determinant of your asset's value, granting you a veto to protect that value. The exclusion of tenants (who have no equity) and the inclusion of recent purchasers (who have full equity) strictly presupposes that the claim is financial, not social. However, the conflict arises in the two-track reform. If the veto protects a fundamental property right (the stake), it cannot be removed simply because a lot is near a bus line without constituting a "taking." The reform treats the veto as a policy lever, not a property right. Furthermore, the ministerial approval of massive single-family rebuilds conflicts with this view: if the claim is about protecting value/character, a mansion that casts more shadow than a duplex should be vetoable. The process protects the *asset class* (single-family zoning), not the specific *asset value* of the immediate surroundings.

  **2. The Membership View**
  *Residence as membership in a self-governing community; the right to shape common life.*
  *   **Verdict:** **Compatible** with the rhetoric, but **Conflicts** with the mechanics.
  *   **Analysis:** The language of "neighborhood character" and the public hearing format align with a theory of local self-determination. However, the mechanics contradict the definition of "member." Tenants are residents and members of the social fabric yet are excluded from standing. Future residents (who will become members) are excluded from the decision that admits them. Most critically, the ministerial approval of large single-family rebuilds allows a homeowner to radically alter the "common life" (shadow, scale, aesthetics) without community consent, while a duplex requires consent. This suggests the "community" is not a group of residents shaping a shared life, but a group of owners protecting a specific *type* of exclusivity.

  **3. The Legitimate Expectations View**
  *Protection of reliance interests formed under prior rules (parking, quiet, outlook).*
  *   **Verdict:** **Conflicts** with the single-family rebuild provision.
  *   **Analysis:** This theory holds that residents bought into a specific physical environment. The process violates this by allowing a single-family rebuild that generates *more* traffic and *more* shadow than the denied duplex. If the claim were truly about protecting established expectations of light and quiet, the veto would apply to the mansion. The process protects the expectation of *low density* (unit count), not the expectation of *low impact* (massing/traffic). It privileges the form of tenure over the substantive environmental expectations.

  **4. The Information-Eliciting View**
  *The hearing as a mechanism to surface local facts planners lack.*
  *   **Verdict:** **Conflicts** with the evidentiary rules.
  *   **Analysis:** An information-gathering process weighs data by accuracy, not by source intensity. Your description states that the *number* of letters and the *turnout* count as evidence of harm. This is a tally of political will, not a verification of fact. Furthermore, excluding tenants (who often possess the most granular information about building conditions and street usage) while including non-resident owners within a radius undermines the information quality. The process treats opposition as a *weight* to be balanced, not a *dataset* to be verified.

  **5. The Public Choice View**
  *Concentrated benefits and diffuse costs; the result of power dynamics.*
  *   **Verdict:** **Compatible** (Descriptively), but **Underdetermined** (Normatively).
  *   **Analysis:** As a descriptive theory of *why* the process exists, this fits perfectly. It explains the asymmetry (concentrated owners vs. diffuse renters/buyers) and the lack of compensation. However, the prompt asks for the view of a *person's claim*. Public Choice theory suggests there is no valid moral claim, only successful pressure. The process *operates* as if this were true, but it *legitimizes* itself using the language of the other four theories (character, expectations, process). The process does not presuppose Public Choice as a *justification*; it presupposes it as an *operating system* disguised as one of the other views.

  ### II. Underdetermination and Discrimination

  **Where the Description Underdetermines the Answer**
  The **Investment-Stake View** and the **Membership View** are functionally indistinguishable in the current process regarding *owner-occupiers*. Both justify the veto, both justify the focus on "character," and both justify excluding non-residents. The current process underdetermines whether the neighbor is objecting because their *portfolio* is threatened (Investment) or because their *polity* is being altered (Membership). The exclusion of tenants points to Investment, but the rhetoric of "character" points to Membership.

  **The Single Discriminating Change**
  To distinguish between the Investment-Stake View and the Membership View, the city should **grant standing to tenants residing on the block for more than one year.**
  *   If the process remains otherwise identical but tenants gain standing/votes, the city commits to the **Membership View** (residence creates the claim).
  *   If tenants remain excluded while owners (even absentee landlords within 300 feet) retain standing, the city confirms the **Investment-Stake View** (equity creates the claim).

  ### III. Alternative Process Designs

  If the city were to replace the current hybrid/conflicted view with one of the alternative theories consistently, the process would change as follows:

  **1. A Process Built on the Investment-Stake View**
  *   **Core Logic:** Zoning changes that negatively impact neighboring property values constitute a taking.
  *   **Procedure:** The veto is removed, but replaced with a **liability rule**. If a developer builds a duplex, they must compensate neighbors for the proven loss in market value. Alternatively, neighbors are granted automatic equity shares in the new project proportional to the risk imposed on their asset.
  *   **Hearings:** Focused entirely on property appraisals and financial impact models. "Character" is admissible only insofar as it is capitalized into price.
  *   **Standing:** Strictly limited to owners of record. Tenants have no standing.

  **2. A Process Built on the Membership View**
  *   **Core Logic:** The neighborhood is a political body; all residents are citizens of that body.
  *   **Procedure:** The veto is transformed into a **vote**. A project requires a majority or supermajority approval of a neighborhood assembly.
  *   **Standing:** All adult residents (owners and tenants) within the zone get a vote. Future residents are represented by a housing advocate.
  *   **Hearings:** Deliberative democracy. The focus is on social cohesion, integration, and community needs. A massive single-family rebuild would require the same vote as a duplex because both alter the community fabric.

  **3. A Process Built on the Protection of Expectations**
  *   **Core Logic:** The physical environment at the time of purchase is a contract.
  *   **Procedure:** The veto is replaced by **performance standards**. Any project that exceeds the shadow, traffic, or massing of the *existing* structure (or the average of the block) is prohibited.
  *   **Substitution for Veto:** A strict "no net increase in impact" rule. The duplex would be denied if it adds more cars than the single-family home, but the mansion would *also* be denied if it casts a larger shadow than the original house.
  *   **Hearings:** Technical verification of compliance with baseline metrics.

  **4. A Process Honestly Designed to Elicit Local Information**
  *   **Core Logic:** Residents are sensors; the city is the processor.
  *   **Procedure:** The hearing is a **deposition**, not a rally.
  *   **Treatment of Angry Residents:** Testimony is admitted only if it cites verifiable data (e.g., "Traffic counts at 5 PM show X" rather than "There is too much traffic"). Petitions are treated as null evidence; they demonstrate organization, not fact.
  *   **Outcome:** If the residents provide data proving shadow exceeds code, the project is modified. If they provide only intensity of opposition, it is disregarded. The single-family rebuild would be subject to the same data scrutiny as the duplex.

  ### IV. The Two-Track Reform and the Overlay

  **Is the reform an admission that the veto was a privilege?**
  Yes. By making the veto contingent on location (proximity to transit) and subsidy (income-restricted units), the city admits the veto is not a fundamental right of property ownership or residency. Rights are generally universal; privileges are conditional. If the veto were a protection of a fundamental stake (Investment) or a right of self-governance (Membership), it could not be switched off by a bus line. The reform reclassifies the veto from a *right* to a *regulatory budget item* that can be spent in some places to buy density in others.

  **What principle is the city adopting?**
  The city is adopting a principle of **Zoning Trade-Offs (or Regulatory Budgeting)**.
  *   **The Principle:** Stability is a finite resource. The city is purchasing the right to build density in "sacrifice zones" (transit corridors) by guaranteeing exclusivity in "conservation zones" (overlay districts).
  *   **The Implication:** The overlay in the oldest, wealthiest neighborhoods acknowledges that the veto power is a function of political capital (ability to afford lawyers, time to attend hearings). By hardening the requirement there, the city is formalizing a class distinction: the wealthy buy certainty through strict process; the less wealthy (or those near transit) absorb uncertainty to meet state mandates.
  *   **The Commitment:** The city commits to the view that "neighborhood character" is a luxury good to be preserved in high-value areas, while transit corridors are treated as infrastructure utility lines where residential claims are secondary to regional mobility goals. It creates a two-tier citizenship: residents in overlay districts have a right to shape their environment; residents in transit zones have a duty to accommodate regional growth.

  **Summary of the City's Commitment**
  By running the process as described, the city commits to the view that **land is primarily a financial vehicle for owners, but secondarily a political tool for the state.** It treats the neighbor's claim as a property right in the *status quo of density*, but not in the *status quo of impact*. It validates opposition as political pressure rather than factual correction. Finally, through the two-track reform, it admits that this protection is purchasable: the city is willing to spend the "rights" of transit-adjacent residents to secure the "stability" of the historic core.
