      *   *Critique:* Naturalism assumes a bounded organism. If the "function" is restored via exogenous means, Naturalism might still call it disease (the endogenous organ is broken).
      *   *Weakness:* The user assumes technology makes them indistinguishable. Philosophically, they are distinct. A pacemaker isn't a heart.
      *   *Suggestion:* Argue that health is becoming a *cybernetic* property of the organism-environment-technology loop, not an internal state. This challenges Naturalism's internalism.

