      *   **Hybrid Accounts (Wakefield, Harmful Dysfunction):** Disease = failure of evolved function + social harm.
      *   **The User's Case:** "Stabilized Dysfunction." Abnormal biology (Naturalism says Disease) + Stable Function/Flourishing (Normativism says Health/Okay).
      *   **Key Insight:** The user introduces *time* (duration) and *technology* (mediation) as hidden variables.

  3.  **Address Question 1: Fracture vs. Relocation:**
