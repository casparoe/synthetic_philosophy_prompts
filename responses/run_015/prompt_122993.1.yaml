  ### Part 3: The Residue Report (Mapping Table)

  | Philosophical Notion | RL Counterpart | Status |
  | :--- | :--- | :--- |
  | **Judgment** | Output of Model-Based Planner ($ \arg\max_a Q_{MB}(s,a) $) | **Clean.** |
  | **All-things-considered** | Value Function $V(s)$ under long-term $\delta$ (or $\beta=1$) | **Clean**, provided you specify which $\beta$ is "all things." |
  | **Better Judgment Acted Against** | $Q_{\text{long}}(s, \text{Work}) > Q_{\text{long}}(s, \text{Skip})$ but $\pi(\text{Skip}) > 0$ | **Needs Machinery.** Requires decoupling the $Q$ used for reporting/evaluation from the $Q$ driving $\pi$. |
  | **Intention / Plan** | Option Hierarchy / Model-Based Trajectory Tree | **Clean.** An "Option" is a policy over a subgraph, initiated by a condition. |
  | **Willpower / Effort** | KL-Divergence Penalty from Default Policy ($\sum D_{KL}(\pi || \pi_{default})$) | **Needs Machinery.** Standard RL has no "effort" cost unless explicitly regularized (e.g., Kool et al. 2019). |
  | **Temptation** | State with high immediate reward (or low immediate cost) relative to $V(s)$ | **Clean.** High $R(s,a)_{imm}$ vs low $V(s')$. |
  | **Regret** | Negative TD-Error ($\delta_t < 0$) or Counterfactual Regret | **Clean.** |
  | **Could Have Done Otherwise** | Support of $\pi(a|s)$ is not a Dirac delta (Stochastic Policy) | **Needs Machinery.** In deterministic MDPs, this is false. Requires stochastic policy or partial observability to make sense. |
  | **Blameworthiness** | **None.** | **No Expression.** RL optimizes; it does not judge. Blame requires a normative baseline external to the agent's objective. |
  | **The Agent (Over Time)** | The Weight Vector $\theta$ or the MDP Definition | **Clean.** Identity is parameter stability. |
  | **Reason (vs Reward)** | Feature Weights $\phi(s)$ in Linear Q-approximation | **Partial.** Reward is the scalar target; "Reason" is the feature structure explaining *why* the reward is high. But RL lacks *justification*. |

  **Specific Inquiry: "Knew Better and Did It Anyway"**
  *   **Behavioral Consequence:** In the Serial Recertification Task, this claim is **invisible from the outside** without the Mask option.
  *   **Why:** A trajectory of `Work, Work, Skip` is consistent with H1 (bias), H2 (temperature), and even a rational agent who encountered an unseen obstacle (POMDP).
  *   **The Mask Test:** The claim "knew better" implies the agent *predicts* the failure. If the agent buys the Mask, it reveals it "knows" it will fail. If it doesn't buy the Mask and fails, it's ambiguous (Naive vs. Temperature).
  *   **Reason vs. Reward:** In RL, "Reason" is the **causal structure of the transition function and features**. Reward is the *telos*. Philosophy wants "Reason" to be a *justification* (normative). RL only has "Reason" as an *explanation* (descriptive). You can recover the reward function (Inverse RL), but you cannot recover the *justification* for why that reward function is "good."

