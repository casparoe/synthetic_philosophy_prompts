  (1) I think the Lewis-style closest-possible-worlds counterfactual analysis is basically right for the core cases: causation is counterfactual dependence between token events, and the correct fix for the backtracking problem is the small miracle / late divergence rule — the divergence from actuality should happen as late as possible, right before the antecedent event, and after that the actual laws run forward as usual.

  (2) I also think the similarity ordering over worlds can't be spelled out in non-causal terms, so I'm fine with being a non-reductionist about all this. The analysis is a regimentation of our causal judgments, not a reduction of causation to something non-causal. I have made peace with the circularity.

  (3) For the special sciences I'm an interventionist. What a causal claim in economics or neuroscience amounts to is a pattern of difference-making under hypothetical surgical interventions on a variable, with the other variables held fixed at their actual values. I like this because it swaps out a vague similarity metric for something precise and checkable, and I read that apparatus metaphysically, not just as an epistemic tool of ours.

  (4) On laws of nature I'm a non-Humean: laws govern, they are not mere regularities in the Humean mosaic, and I lean toward something dispositionalist-ish or necessitation-ish.

  (5) Case verdicts. Symmetric overdetermination, two rocks and one window, perfectly simultaneous: both are causes of the shattering, so counterfactual dependence isn't necessary for causation, and I want the weaker influence-style condition instead. Late preemption: the preempted backup is not a cause.

  (6) Absences can be genuine causes — that the plant never got watered is why it died — and I don't want any surrogate-event story for this. I want it to fall straight out of the apparatus, because the special sciences cite omissions constantly.

