prompt: |-
  I run a monthly applied-ethics workshop for a rationalist meetup in my city — usually 18 to 24 people, 90 minutes, a mix that runs from people who have internalized expected-value reasoning and scope-insensitivity talk down to a couple of regulars who think shut up and multiply is a slogan rather than an argument. I want to spend one session on the inefficacy objection: the pull of the thought that my own contribution to a collective harm does nothing, so none of the harm is mine. I have tried to run this twice and it has fallen flat both times. The first time I just described the cases — one more chicken bought, one more tank of gas burned, one more vote in a safe state — and asked what people thought; they produced the expected-difference reply on cue and I could tell that nothing had actually moved. The second time I put the standard replies on a board and argued for them, and I got the eye-rolling I had earned: the people who already agreed were not surprised, and the people who did not had a ready story about why their purchase is relevantly unlike a threshold case. So what I want now is an activity or game where the structure does the work: rules, roles, and small real stakes arranged so that participants make the choice, discover for themselves either that it made no difference or that they cannot tell whether it did, and then find that the reply they were going to give does not fit what just happened to them. No lecture up front, and I would rather they not hear the words inefficacy or overdetermination until the debrief.

  Three things have been nagging me about where it should land, and I would like the design to make use of them rather than just gesture at them. First, I have become convinced that the no-difference thought is really three separable thoughts that should be forced apart in the room: that my act did not change the outcome, that I cannot tell whether it did, and that the outcome was overdetermined so it would have happened anyway. Second, a friend who does cooperative game theory pointed out something I cannot stop chewing on — in a threshold game where fifteen people each contribute and only ten are needed, nobody is pivotal in the actual outcome, yet the Shapley value still assigns each of the fifteen one fifteenth of the result, which is either exactly the non-causal share of responsibility I am looking for or nothing but a bookkeeping convention, and I genuinely cannot tell which; if there is a way to make participants feel the attraction of that assignment and also feel the objection to it, I want it. Third, I keep thinking about the channel where my choice changes what someone else chooses — the whisper or ripple round, the version that maps onto voting because you talk to your friends, or onto boycotts because visible non-participation shifts a norm — and I want that staged as its own round rather than mentioned, because I suspect it is where most of the real expected difference lives and it is the part my group is most likely to have never felt.

  What I need from you is the whole runnable thing: the rules, the materials (I have index cards, a box, a whiteboard, and about ninety minutes; assume no phones or laptops during play, and assume some participants will compute and some will not, and it should work either way), the number and order of the rounds, and a payoff or consequence that is real but tiny — my own money or my own inconvenience is fine, I do not want anyone paying out of pocket and I would rather avoid actual deception about the mechanism if possible, though tell me honestly if deception is what makes it work and what it costs me in the debrief. I would also like each stage mapped to the piece of the problem it is supposed to produce, a debrief that says what predictably goes wrong the first time I run it (I am expecting at least one person to try to compute the exact pivot probability, at least one to refuse to play on principle, and at least one to announce that this is only a game and real cases are different), and a frank note about which feature of the problem the activity cannot reproduce and that I will simply have to say out loud. Please do not give me a reading list or citations — I have read the standard material, and what I need is something I can run on Saturday.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop activity:

  1.  **Analyze the Request:**

      *   **Goal:** Run a 90-minute applied-ethics workshop on the "inefficacy objection" (the idea that individual contributions to collective harm/benefit don't matter).
      *   **Audience:** 18-24 rationalists (mix of sophisticated EV reasoners and skeptics of "shut up and multiply").
      *   **Problem:** Previous attempts (lecturing, standard cases) failed. People either recited the "expected difference" reply without feeling it or found reasons why their case is special.
      *   **Desired Solution:** An activity/game where the *structure* forces the realization. No lecture upfront. No jargon ("inefficacy," "overdetermination") until debrief.
      *   **Key Philosophical Nuances to Embed:**
          1.  Distinguish: (a) Act didn't change outcome, (b) Can't tell if it did, (c) Outcome overdetermined.
          2.  Shapley Value intuition: In threshold games (15 contribute, 10 needed), nobody is pivotal, yet responsibility is shared. Make them feel the attraction and the objection.
          3.  Ripple Effects: How my choice influences others (norms, signaling). Stage this as a separate round.
      *   **Constraints:** Index cards, box, whiteboard, 90 mins. No phones/laptops. Real but tiny stakes (facilitator pays/inconveniences self). No deception if possible (or admit cost).
      *   **Deliverables:** Rules, materials, rounds, payoffs, mapping of stages to philosophical points, debrief guide (predictable failures), and limitations of the activity.

  2.  **Deconstruct the Philosophical Challenges:**

      *   *Challenge 1: The Threshold Problem.* In real life (climate change, voting), thresholds are vague or huge. In a game, we can make them sharp. If we make the threshold sharp, people calculate pivot probability. If we make it vague, they feel uncertainty.
      *   *Challenge 2: The Shapley Value.* This is about fair division of credit/blame when causation is joint. To feel this, participants need to be in a coalition where *everyone* contributed, but the outcome would have happened without *any specific individual*.
      *   *Challenge 3: The Ripple.* This requires iteration or information flow. Round 1 needs to be isolated. Round 2 needs to allow influence.

  3.  **Drafting the Game Concept:**

      *   *Idea:* A public goods game with a threshold.
      *   *Mechanism:* Participants decide whether to "contribute" (cost to them, benefit to group) or "keep" (benefit to them, no group benefit).
      *   *Stakes:* Needs to be real. Candy? Cash? Let's use cash for precision, paid by the facilitator. $1 or $2 per person pot.
      *   *Rounds:*
          *   Round 1: The "Inefficacy" Trap. Sharp threshold. Many contributors. No one is pivotal.
          *   Round 2: The "Uncertainty" Fog. Vague threshold.
          *   Round 3: The "Ripple." Sequential or visible choices.

      *   *Refining for the Specific Constraints:*
          *   The prompt asks to distinguish (a) no change, (b) can't tell, (c) overdetermined.
          *   The prompt asks to model the Shapley value tension.
          *   The prompt asks to model the Ripple.
          *   Time: 90 mins. 24 people.
          *   Constraint: No deception if possible.

      *   *Revised Game Structure:* "The Threshold Box."
          *   **Round 1 (The Overdetermination):** A high threshold that is easily met if everyone cooperates, but met even if a few defect. *Wait, no.* To show inefficacy, we need a scenario where you contribute, the goal is met, but your contribution wasn't *needed*.
          *   *Better:* A threshold of $X$. Everyone puts in $1. If total > $X$, everyone gets $2. If not, you keep your $1.
          *   *To force the "I didn't matter" feeling:* We need the total to exceed the threshold by enough that removing one person doesn't change the outcome.
          *   *To force the Shapley feeling:* We need to divide the payout based on contribution, not just binary success.

      *   *Let's try a specific mechanic:* "The Black Box."
          *   Facilitator sets a secret threshold.
          *   Players decide to Invest ($1 cost) or Hold.
          *   If Total Investment >= Threshold, a Bonus Pool is unlocked.
          *   *Twist:* The Bonus Pool is divided *only* among Investors.
          *   *Problem:* This encourages free-riding.
          *   *Correction:* The Bonus Pool is divided among *everyone*, but Investors paid a cost. This is a standard Public Goods Game.
          *   *To address the Shapley/Overdetermination:* We need to reveal the threshold *after* the fact to show who was pivotal.
          *   *To address the Ripple:* We need a round where people see others' choices before deciding.

  4.  **Developing the Three Rounds (The Core Design):**

      *   **Round 1: The Clean Cut (Overdetermination).**
          *   Goal: Show that you can contribute to a success that didn't need you.
          *   Mechanism: Secret Threshold. High participation expected.
          *   Reveal: Show that Total > Threshold + 1. Therefore, no single person was pivotal.
          *   Payoff: Everyone gets reward if threshold met.
          *   *Philosophical Point:* "My act did not change the outcome."

      *   **Round 2: The Fog (Uncertainty).**
          *   Goal: Show that even if you aren't pivotal, you don't *know* that ex-ante.
          *   Mechanism: Threshold is a range (e.g., between 10 and 20 cards). Or, the threshold is fixed but players don't know the total count until the end.
          *   *Better:* The threshold is fixed, but players don't know how many others are playing or contributing.
          *   *Actually, let's use the "Range" idea.* Threshold is randomly drawn from a deck.
          *   *Philosophical Point:* "I cannot tell whether it did [change the outcome]."

      *   **Round 3: The Ripple (Influence).**
          *   Goal: Show that your choice changes *others'* choices.
          *   Mechanism: Sequential play. Or, players can "signal" before the vote.
          *   *Constraint:* No phones.
          *   *Mechanism:* "The Whisper." Players are arranged in a circle. Round 3 is played in waves. Wave 1 decides. Wave 2 sees Wave 1's aggregate (not individual) choice.
          *   *Actually, simpler:* Allow players to talk for 2 minutes before Round 3.
          *   *Even better for "Ripple":* Make the threshold dependent on *percentage* of participation, and let people see a live count of hands raised? No, that's voting.
          *   *Let's try:* "The Matching Round." Facilitator says "For every card put in this round, I will add another." But the twist is: Facilitator will only match if *you* convince someone else to join.
          *   *No, keep it structural.* Round 3: Players submit a choice *and* a prediction of how many others will choose. If they recruit someone (sign a card), they get a bonus.
          *   *Refined:* Round 3 is "Open Information." Players decide in sequence. Early movers influence late movers.

      *   *Wait, I need to integrate the Shapley Value intuition.*
          *   Shapley is about dividing credit when everyone is necessary jointly but not individually.
          *   *Idea:* In the debrief of Round 1, if the threshold was 10 and 15 people contributed, the "pie" was created by the group of 15. If we divide the pie by 15, everyone gets credit. If we divide by "pivotalness," everyone gets 0.
          *   *Activity:* After Round 1, ask them to divide a bonus reward among the contributors. Watch them argue between "equal split" (Shapley) vs "pivotal only" (Causal).

  5.  **Refining the Logistics & Stakes:**

      *   **Stakes:** Facilitator puts $50 on the table.
      *   **Materials:** Index cards (Green = Contribute, Red = Hold), Marker, Whiteboard, Box.
      *   **Deception:** Minimize. The threshold can be random (drawn from a deck) to avoid "Facilitator rigged it" claims.
      *   **Time:** 90 mins.
          *   Intro: 5 mins.
          *   Round 1: 15 mins + 10 debrief.
          *   Round 2: 15 mins + 10 debrief.
          *   Round 3: 15 mins + 10 debrief.
          *   Final Synthesis: 15 mins.
          *   Buffer: 10 mins.

  6.  **Addressing the Specific "Nagging" Points:**

      *   *Point 1 (3 separable thoughts):*
          *   Round 1 -> Overdetermination (Outcome happened anyway).
          *   Round 2 -> Epistemic Uncertainty (Didn't know if it mattered).
          *   Round 3 -> Causal Ripple (Changed others' actions).
      *   *Point 2 (Shapley Value):*
          *   In Round 1 Debrief, force a division of a "Bonus" based on contribution. If 15 contributed and 10 needed, do the 5 "excess" contributors get a share?
      *   *Point 3 (Ripple):*
          *   Round 3 must make influence explicit.

  7.  **Finalizing the Game Design ("The Threshold Box"):**

      *   **Setup:** 20-24 people.
      *   **Currency:** "Points" redeemable for cash at end (e.g., 10 pts = $1). Facilitator bankrolls it.
      *   **Round 1 (The Fact of Overdetermination):**
          *   Secret Threshold (e.g., 15 cards).
          *   Everyone submits Green (Cost 1 pt, counts 1) or Red (Cost 0, counts 0).
          *   If Sum >= Threshold, Everyone gets 3 pts.
          *   *Crucial:* Facilitator ensures (via stacked deck or just probability) that the result is *well above* threshold (e.g., 20 cards).
          *   *Debrief:* Ask "Who changed the outcome?" (No one). Ask "Who deserves credit?" (Tension).
      *   **Round 2 (The Fog of Uncertainty):**
          *   Threshold is unknown *until after*. Drawn from 1-30.
          *   Same payoff structure.
          *   *Crucial:* The result lands *exactly* on the threshold or 1 above.
          *   *Debrief:* You didn't know ex-ante. Your EV was positive even if causal impact was 0.
      *   **Round 3 (The Ripple):**
          *   Sequential. 3 groups of 8.
          *   Group 1 decides. Result shown to Group 2. Group 2 decides. Result shown to Group 3.
          *   Rule: If Group 1 contribution > 50%, Group 2 threshold is lower.
          *   *Debrief:* Your choice changed the *context* for others.

      *   *Wait, I need to make sure the Shapley point hits hard.*
      *   *Modification:* In Round 1, if the threshold is met, there is a "Surplus Bonus." Only contributors can claim it. But there isn't enough for everyone. How do they divide it? This forces the Shapley discussion.
      *   *Actually, simpler:* Just ask them to vote on how to distribute a $10 bonus among the contributors. Equal split vs. Random vs. Pivotal.

  8.  **Addressing the "No Deception" Constraint:**
      *   I cannot rig the threshold secretly without it being deception.
      *   *Solution:* The Threshold is determined by a public die roll or card draw *after* choices are made? No, that changes the game to gambling.
      *   *Solution:* The Threshold is fixed (e.g., 15) but written on a card in a sealed envelope. Opened publicly.
      *   *To ensure Overdetermination:* I need enough people to contribute. I can't force them.
      *   *Workaround:* I can set the threshold *low* relative to group size. If threshold is 5 and there are 20 people, and most are rationalists, it will likely be overdetermined.
      *   *Better:* Use a "Range Threshold." Threshold is between 10 and 20. If you hit 20, you definitely met it.
      *   *Best for "No Deception":* The Facilitator commits to a rule: "If contributions exceed X by more than Y, we enter the Overdetermination Case." If the players don't contribute enough, the round fails, and we discuss *that*. But I need the case to land.
      *   *Compromise:* I will set the threshold low enough (e.g., 30% of attendees) that it is highly probable to be exceeded by rationalists trying to "win." I will not rig the count. I will count cards publicly. If it fails to be overdetermined, we discuss the pivot. If it succeeds, we discuss the null impact. This is honest.

  9.  **Addressing the "Real Stakes":**
      *   Facilitator puts $30 cash in an envelope.
      *   Points convert to chance at the envelope? Or direct cash?
      *   Direct cash is better for "realness." $1 per person max loss/gain.
      *   Let's say: Contribute = Pay $1 to pot. Keep = Keep $1.
      *   If Threshold Met: Pot is multiplied by 1.5 and distributed equally.
      *   This creates a social dilemma.

  10. **Structuring the Debrief:**
      *   Must handle the "It's just a game" objection.
      *   Must handle the "Pivot Probability" calculator.
      *   Must handle the "Principled Refuser."

  11. **Review against Constraints:**
      *   90 mins? Yes, tight but doable.
      *   Index cards/box/whiteboard? Yes.
      *   No jargon until end? Yes.
      *   Map stages to the 3 nagging points? Yes.
      *   Shapley value included? Yes, in Round 1 debrief.
      *   Ripple included? Yes, Round 3.

  12. **Final Polish:**
      *   Make sure the instructions are crystal clear.
      *   Ensure the Facilitator script avoids leading too much.
      *   Check the math on the stakes (don't go broke, but make it matter).
      *   *Self-Correction on Shapley:* The Shapley value is hard to feel in a binary win/lose. I need to make the *reward* continuous or the *blame* divisible.
      *   *Idea:* In Round 1, if the threshold is met, the Facilitator adds a $20 "Success Bonus." The group must vote on how to distribute it among the contributors.
      *   *Options:* (A) Equal split among contributors. (B) Lottery among contributors. (C) Only to those who were "pivotal" (which is no one).
      *   *This forces the Shapley intuition:* If you vote (A), you accept non-causal credit. If you vote (C), no one gets paid.

  13. **Final Plan Assembly:** (Drafting the response based on these thoughts).
      *   Title: "The Threshold Box."
      *   Stakes: $1 buy-in, $2 potential return. Facilitator covers the pot.
      *   Rounds: 1 (Overdetermination), 2 (Uncertainty), 3 (Ripple).
      *   Debrief: Structured to extract the 3 distinctions.

      *(Self-Correction during drafting)*: Wait, if I want to avoid deception, I can't guarantee Round 1 results in overdetermination. I need to design the threshold such that it is *likely* but not guaranteed. I will set the threshold at 50% of attendees. Rationalists usually coordinate well. If it fails, the discussion is even better (you *were* pivotal). I will prepare for both outcomes in the debrief notes.
      *Actually, to ensure the specific philosophical point lands:* I will set the threshold very low (e.g., 30%). This makes overdetermination highly likely without rigging. It tests the "I didn't need to contribute" intuition.

      *Wait, one more thing:* The prompt mentions "Shapley value... assigns each of the fifteen one fifteenth of the result." I need to make sure they feel the *attraction* of this.
      *Modification:* In Round 1, if the threshold is met, the "Success Bonus" is distributed *only* if the group agrees on a distribution method. This makes the Shapley choice a coordination problem.

      *Let's refine Round 3 (Ripple).* Sequential is hard with 24 people in 90 mins.
      *Better:* "The Signal." In Round 3, before submitting cards, players can stand up and declare intent. This models the "talking to friends" aspect.

      *Okay, ready to write.*
answer: |-
  # Workshop Design: The Threshold Box

  **Time:** 90 Minutes
  **Participants:** 18–24
  **Materials:**
  *   30 Index Cards (15 Green, 15 Red) — *have spares.*
  *   1 Opaque Box (for collecting cards).
  *   Whiteboard + Markers.
  *   Cash: $40 in small bills ($1s and $5s).
  *   3 Envelopes labeled "Round 1," "Round 2," "Round 3."
  *   A standard deck of playing cards (for randomization).

  **Stakes:**
  *   Each participant starts with **$2** (given by you at the door).
  *   **Green Card (Contribute):** You put $1 into the box.
  *   **Red Card (Hold):** You keep your $1.
  *   **Payoff:** Determined by round rules. Unspent money is theirs to keep at the end.
  *   **Your Cost:** You are bankrolling the $2 per person ($48 max) plus any bonus pools. Expect to spend ~$60 total. This is the cost of the "realness."

  **Facilitator Stance:**
  *   Do not use the words *inefficacy, overdetermination, pivot, Shapley, causal,* or *expected value* until the final 15 minutes.
  *   Do not lecture. Ask questions. Write their answers on the board.
  *   Be transparent about the mechanism. No rigged counts.

  ---

  ## Part 1: Setup (5 Minutes)

  1.  **Hand out money:** Give everyone $2 cash. Tell them: "This is yours. At the end of the session, you keep whatever you have left. You will have chances to multiply it."
  2.  **The Mechanism:** Show the Green and Red cards.
      *   **Green:** Costs $1 (put in box).
      *   **Red:** Costs $0 (keep in pocket).
      *   All cards go into the box. You will count them publicly after each round.
  3.  **The Rule:** "In each round, there is a Target Number. If the number of Green cards meets or exceeds the Target, a Bonus Pool is unlocked. How that pool is distributed changes each round."

  ---

  ## Part 2: The Rounds (45 Minutes Total)

  ### Round 1: The Surplus (15 Minutes)
  *Goal: Force the "Overdetermination" intuition (Outcome happened anyway).*

  1.  **The Target:** Write **8** on the board. (Assuming ~20 people). This is low enough that if the group is cooperative, they will likely exceed it significantly.
  2.  **The Bonus:** "If we hit 8 Greens, I will add **$20** to the pot. This $20 will be divided **equally among everyone who played Green**."
  3.  **Play:** Give them 2 minutes to decide. Collect cards.
  4.  **The Reveal:** Count Greens publicly.
      *   *Likely Outcome:* You get 14–18 Greens. The target (8) is smashed.
      *   *Calculate:* Total Bonus ($20) / Number of Greens (e.g., 16) = $1.25 per Green player.
      *   *Net Result:* Green players paid $1, got $1.25 back (Profit $0.25). Red players kept $1 (Profit $0.00 relative to start, but missed the bonus).
  5.  **Immediate Question (Write answers on board):**
      *   "Look at the Green cards. If any *single* person had switched to Red, would the Target of 8 still have been met?" (Answer: Yes).
      *   "Did your Green card change whether the bonus was unlocked?" (Answer: No).
      *   "Who deserves the share of the $20?"

  ### Round 2: The Fog (15 Minutes)
  *Goal: Force the "Epistemic Uncertainty" intuition (I can't tell if I mattered).*

  1.  **The Target:** Take a deck of cards. Remove Aces through 10 of Hearts. Shuffle them. Place one face down in an envelope labeled "Target."
      *   *Explanation:* "The Target is a random number between 1 and 10. I do not know it. You do not know it. It will be revealed after you choose."
  2.  **The Bonus:** "If we hit the Target, I add **$20**. This $20 is divided **equally among ALL participants** (Green and Red)."
      *   *Note:* This changes the incentive. Now Reds free-ride on Greens.
  3.  **Play:** 2 minutes to decide. Collect.
  4.  **The Reveal:** Count Greens. Reveal the Target card.
      *   *Facilitator Prep:* You need this to be close. If the count is 12 and the card is 10, you missed the "Fog."
      *   *Adjustment:* If the Green count is very high (e.g., 18), the Target doesn't matter. If it's very low (e.g., 4), the Target doesn't matter.
      *   *The Trick:* Use the *range* to create uncertainty. Tell them: "The Target is between 1 and 20." (Actually, use the card draw, but emphasize the *range* of possibility before the reveal).
      *   *Better Mechanism for Fog:* The Target is fixed at **50% of cards submitted**. But participants don't know how many cards will be submitted (some might forget, etc.).
      *   *Revised Mechanism:* "The Target is exactly half the number of people in the room." (e.g., 10). But tell them: "I might have miscounted the room size." (No, that's deception).
      *   *Best Mechanism:* **The Blind Threshold.** The Target is 10. But before revealing the count, ask them: "Raise your hand if you are *certain* your vote did not matter." Then reveal count. If count is 10 or 11, the uncertainty was real.
      *   *Let's stick to the Card Draw:* It creates genuine ex-ante uncertainty. If the draw is a 10 and you have 11 greens, one person was pivotal, but no one knows who.
  5.  **Immediate Question:**
      *   "Before I opened the envelope, could you calculate the probability that you were pivotal?"
      *   "Does the fact that you *didn't know* change whether you should have played Green?"

  ### Round 3: The Ripple (15 Minutes)
  *Goal: Force the "Influence" intuition (My choice changes others' choices).*

  1.  **The Setup:** Divide the room into three groups of ~8 people (Left, Center, Right).
  2.  **The Rule:** "This round is sequential."
      *   **Group 1** decides and submits cards first.
      *   **Group 1's Green Count** is written on the board.
      *   **Group 2** sees Group 1's count, then decides.
      *   **Group 2's Green Count** is added to the board total.
      *   **Group 3** sees the running total, then decides.
  3.  **The Target:** The Target is **15 Greens Total**.
  4.  **The Bonus:** "If we hit 15, I add **$30**. Divided equally among **ALL Greens**."
  5.  **The Twist:** Before Group 2 and 3 decide, allow 60 seconds of **open talking**. They can shout out intentions. "I'll go Green if you do."
  6.  **Play:** Run the sequence.
  7.  **The Reveal:** Count total. Distribute money.
  8.  **Immediate Question:**
      *   "Group 3: Did Group 1's choice change your choice?"
      *   "Group 1: Knowing you would influence Group 3, did that change your choice?"

  ---

  ## Part 3: The Debrief (35 Minutes)

  *Do not sit down. Stand at the whiteboard. Keep the energy high.*

  ### Phase 1: Mapping the Three Thoughts (10 Minutes)
  *Goal: Separate the three inefficacy intuitions using their experience.*

  Draw three columns on the board. Label them **1**, **2**, **3**.

  1.  **Column 1 (Round 1):** Ask, "In Round 1, did your Green card change the outcome?"
      *   They will say "No."
      *   Write: **"The Outcome Was Fixed."**
      *   Ask: "So was your contribution worthless?"
      *   *Expected Pushback:* "No, I got paid." "But I didn't cause the payment."
      *   *Point:* This is the **Overdetermination** claim. The harm/benefit happens without you.

  2.  **Column 2 (Round 2):** Ask, "In Round 2, before I opened the envelope, did you know if you changed the outcome?"
      *   They will say "No."
      *   Write: **"The Outcome Was Uncertain."**
      *   Ask: "If you knew you probably wouldn't matter, why play?"
      *   *Expected Pushback:* "Because there was a chance." "Because EV."
      *   *Point:* This is the **Epistemic** claim. You can't know you're irrelevant ex-ante.

  3.  **Column 3 (Round 3):** Ask, "In Round 3, did your card change the *physical* threshold?"
      *   They will say "No."
      *   Ask: "Did your card change *other people's cards*?"
      *   They will say "Yes."
      *   Write: **"The Outcome Was Contagious."**
      *   *Point:* This is the **Ripple** claim. Your efficacy is mediated by social influence.

  ### Phase 2: The Shapley Tension (15 Minutes)
  *Goal: Make them feel the pull of non-causal credit.*

  1.  **The Setup:** Return to Round 1 data.
      *   Scenario: Target was 8. 16 Greens were played.
      *   Fact: Any 8 of those 16 would have won. The other 8 were "surplus."
  2.  **The Question:** "I put in $20. Who earned it?"
      *   Offer Option A: **Equal Split** (All 16 get $1.25).
      *   Offer Option B: **Pivotal Only** (No one gets anything, because no one was strictly necessary).
      *   Offer Option C: **Lottery** (Pick 8 names at random, they get $2.50).
  3.  **The Vote:** Have them vote on how to distribute a hypothetical bonus.
  4.  **The Trap:**
      *   If they vote **A (Equal)**: Ask, "Why give money to someone whose removal changes nothing? You are paying for *membership*, not *causation*." -> *This is the Shapley Value intuition.*
      *   If they vote **B (Pivotal)**: Ask, "Then the bonus returns to me. No one is rewarded for cooperating. Next time, no one plays Green. The system collapses."
      *   If they vote **C (Lottery)**: Ask, "Is fairness about luck or contribution?"
  5.  **The Synthesis:** "You likely want A, but you justify it with B. You want to be paid for causing the win, but you accept payment for joining the coalition. In real ethics, you want to claim you prevented the harm (B), but you only joined the coalition that prevented it (A)."

  ### Phase 3: The "Just a Game" Objection (10 Minutes)
  *Goal: Pre-empt the dismissal.*

  1.  **Anticipate:** Someone will say, "This is just $1. Climate change is billions of tons."
  2.  **The Reply:** "Correct. The stakes here are tiny so the *math* is clear. In the real world, the stakes are huge, so the math is hidden."
  3.  **The Challenge:** "If you reject the logic here because the stakes are low, are you saying the logic scales non-linearly? Does your vote count more when millions die?"
  4.  **The Close:** "The structure of the problem (Threshold, Uncertainty, Ripple) is identical. The only difference is you can't see the count in the real world. In Round 1, you saw you didn't matter. In the real world, you just assume you don't. This game forced you to look at the count."

  ---

  ## Facilitator Notes: Predictable Failures

  **1. The Pivot Calculator**
  *   **Behavior:** One participant will try to calculate the exact probability of being pivotal in Round 2 using binomial distributions.
  *   **Response:** "You can do that math later. Right now, I want to know how it *felt* before you did the math. Did you feel safe assuming you didn't matter? Or did you feel risk?"
  *   **Why:** You are targeting the *heuristic* they use in real life, not their capacity for calculus. Real-world voting/pollution decisions are made on heuristics, not binomial calcs.

  **2. The Principled Refuser**
  *   **Behavior:** Someone refuses to play Green on principle ("I won't gamble my money") or refuses to play Red ("I won't free-ride").
  *   **Response:** "Thank you. Your refusal is data. It shows that for some, the rule matters more than the outcome. But does that rule stop the harm if everyone else defects? Keep your money, but watch what happens to the group bonus."
  *   **Why:** Do not let them derail the round. Acknowledge, isolate, continue.

  **3. The "Real World" Dismissal**
  *   **Behavior:** "In the real world, thresholds aren't sharp."
  *   **Response:** "True. That makes the 'Fog' (Round 2) the more accurate model. But does vagueness make your contribution matter *more* or *less*? If the threshold is fuzzy, you can never prove you didn't matter. That increases the risk, not decreases it."

  ---

  ## Limitations: What This Activity Cannot Do

  *Be honest about this in the final 5 minutes.*

  1.  **Infinite Aggregation:** This game has a fixed number of players (24). Real collective harm (climate) has billions of actors. The "I am one in a billion" feeling is stronger than "I am one in 20." You cannot replicate the scale of anonymity.
      *   *Say:* "You felt invisible here. Imagine feeling this with 8 billion people. The math holds, the psychology is harder."
  2.  **Negative Externalities:** This game rewards cooperation. Real collective harm often rewards *defection* (driving is convenient, polluting is cheap). The incentive structure here is cleaner than reality.
      *   *Say:* "Here, cooperating paid out. In reality, cooperating often costs you with no direct return. That makes the 'Ripple' (Round 3) the only place where your return comes from."
  3.  **The "Bookkeeping" Objection:** Regarding the Shapley value: You cannot prove whether assigning 1/15th of the credit is *metaphysically true* or just *useful accounting*.
      *   *Say:* "We voted to split the bonus equally. Is that because it's *true* you each caused 1/16th of the win? Or because it's the only way to keep you playing next time? I don't know. But you have to choose one to live by."

  ## Contingency: If Round 1 Fails (Underdetermination)
  If only 6 Greens are played (Target 8):
  *   **Do not panic.** This is a gift.
  *   **Say:** "Okay, the bonus failed. Who caused the failure?"
  *   **Point:** "If 2 more people had played Green, you would have won. Now you *know* you were pivotal. Does that feel good? Or does it feel like a burden? Inefficacy is a luxury of success. When we fail, we are all causal."

  ## Contingency: If Round 1 Succeeds Too Well (Unanimity)
  If 24 Greens are played (Target 8):
  *   **Say:** "Everyone cooperated. No one defected. This is the best case for inefficacy. Every single person here could say 'I didn't need to do this.' And they would be right. So why did you do it?"
  *   **Point:** This isolates the "Norm" motivation from the "Outcome" motivation.

  ---

  ## Final Script for the "Shut Up and Multiply" Skeptics
  *For the participants who think EV is a slogan:*

  "In Round 2, you didn't know the threshold. You couldn't multiply. You had to guess. If you refuse to act without a calculated pivot probability, you freeze in the Fog. If you act anyway, you are admitting that 'uncertainty of impact' is not a valid excuse for inaction. You already live the argument. You just didn't want to name it."
