  2.  **Deconstruct the Core Concept (Hofstadter's *Letter Spirit*):**
      *   *Letter Spirit* is about style consistency across an alphabet. It uses a grid (usually 8x8) to constrain strokes.
      *   The "ghost alphabet" idea aligns with Hofstadter's deeper point: letters are defined by *roles* and *relationships* (topology), not just pixel patterns.
      *   *Key Insight:* Identity is structural/functional, not visual/perceptual in a low-level sense.

  3.  **Drafting the Arc (Step-by-Step):**

      *   *Phase 1: The Hook & The Trap.* Start with the obvious to show it's insufficient.
