      Subject: Recommendation on Project Achates (Supertask Readout)

      **Bottom Line:** I recommend we **fund Project Achates with strict conditions**, structured as a phased investigation into physical bounds rather than a guaranteed delivery of a halting oracle. We should treat the Church-Turing Thesis (CTT) as an empirical claim about physical systems, not a definitional truth. If we treat CTT as definitional, this proposal is a category error and must be declined. If we treat it as empirical, this is the cheapest possible test. Given our foundation's mandate for high-upside long shots, the empirical reading is the only one consistent with our mission.

      **The Church-Turing Stance**
      Our decision hinges entirely on how we interpret the Church-Turing Thesis. The desk-reject faction treats CTT as a logical constraint: no physical system can compute non-recursive functions. Under this reading, Project Achates is impossible by definition, like a proposal to build a round square. However, the PIs argue CTT is a claim about physics, not logic. They are correct that logic alone does not forbid supertasks; only physical laws do. If we adopt the definitional reading, we must decline immediately. However, doing so insulates our physics from empirical refutation. I recommend we adopt the empirical reading. This allows us to fund the experiment not because we expect it to work, but because a null result defines the precise energy and时空 (spacetime) bounds where computation fails.

      **Addressing Procedural Objections**
      Two arguments have circulated regarding verification that require specific handling.

      First, the "Certification Condition." Some suggest requiring the PIs to name a finite Turing-machine procedure to verify the device's verdicts on a test battery. We must reject this condition. It smuggles the conclusion into the premise. If the device truly solves the Halting Problem, no finite Turing machine can verify its output in the general case. Requiring such a procedure assumes the Church-Turing Thesis is true to test whether the Church-Turing Thesis is true. It settles the philosophy by committee rather than experiment. We cannot impose a verification standard that renders the hypothesis unfalsifiable by design.

      Second, the "Implementation Dodge." Skeptics argue that even if the lamp flashes correctly, it might not be "computing" but merely correlating, like a lookup table assembled by chance. While philosophically coherent, this is irrelevant for funding. We fund instruments that yield reliable readouts, not semantic categories. If the lamp reliably indicates halting status where independent verification is possible, the physical mechanism deserves study regardless of whether we label it "computation." We should sideline this philosophical distinction and focus on the physical reliability of the readout.

      **Milestones and Conditions**
      Funding should be released in three tranches over 24 months, contingent on physical scaling rather than oracle verification.
      1.  **Phase 1 (Months 1-6):** Demonstrate the acceleration mechanism. The device must complete $10^6$ operations in a bounded window with the required time-halving scaling, within 10% error margins. No halting verdicts required yet.
      2.  **Phase 2 (Months 7-18):** Energy and thermal bounds. The PIs must document the energy cost per operation as time intervals shrink. If energy requirements diverge exponentially, the project stops. This data is valuable regardless of the outcome.
      3.  **Phase 3 (Months 19-24):** Known cases only. The device will be tested on Turing machines with known halting status (small Busy Beaver candidates). Success here justifies further high-risk funding; failure indicates physical noise floors.

      **The Strongest Objection (For the Record)**
      Should this memo be leaked or debated externally, the strongest argument against this recommendation rests on general relativity and quantum mechanics, not computability theory. To realize a supertask, the device requires a specific spacetime structure (often called Malament-Hogarth spacetimes) that allows an infinite proper time for the computer within a finite proper time for the observer. Our current understanding of general relativity suggests such spacetimes require event horizons or singularities inaccessible in a lab. Furthermore, quantum mechanics imposes a Planck time limit; you cannot halve operation times indefinitely without exceeding the Planck energy density, collapsing the apparatus into a black hole. Therefore, the proposal asks us to fund a device that likely violates the known laws of physics. A null result here is not merely "bounding precision"; it is confirming standard physics we already accept. Funding this implies we believe standard physics is wrong enough to allow singularities on a tabletop, which is a lower probability bet than even our usual high-risk tolerance suggests.

      **Conclusion**
      Despite the physics objections, the potential payoff—refuting a foundational thesis of computer science and physics—justifies the expense. By conditioning funding on physical scaling milestones, we ensure that even a failure yields publishable data on physical limits. We decline the Certification Condition to avoid begging the question, and we ignore the Implementation Dodge to focus on instrumental reliability. We proceed on the assumption that CTT is empirical. If it is not, Phase 2 will kill the project naturally.

