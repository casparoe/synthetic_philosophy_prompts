      *   *Cheap Commitment:* This is the "Self-Binding" or "Precommitment" objection. If I can avoid the pump by paying a fee, am I irrational for having the preference, or just rational for paying the fee? This challenges the *normative force* of the pump.
      *   *Bridge:* This is the "Operationalization" problem. Money pumps show you lose money. Does losing money mean you are worse off *by your own lights*? This touches on the representation theorem vs. normative justification.

  3.  **Evaluate the Aims:**
