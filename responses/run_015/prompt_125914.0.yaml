  9.  **Final Polish:** Ensure tone is respectful of the user's expertise (they know logic/math, just new to phil jargon). Avoid name-dropping. Focus on argument structures. (Proceed to generate output based on this plan).

  *(Self-Correction during final review)*: Wait, I need to make sure I don't just validate the user's doubts but explain *which* of them are the most fertile ground for *progress*. The Bridge worry is the most fundamental. If the pump doesn't track utility, the recurrence and commitment worries are secondary. So Bridge must be #1 for Aim 1. For Aim 2, Commitment is more practical. I will structure the recommendation primarily around Aim 1 (as requested "first... and second and more faintly"), but explicitly show the shift.

