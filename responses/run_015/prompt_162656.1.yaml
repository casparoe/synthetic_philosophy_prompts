  **THE VERIDIAN TRUST**
  **Cluelessness-Adjusted Impact Report: Fiscal Year 2024**

  **Chair's Statement**

  It is with considerable satisfaction that I present the first Annual Review following the Board's unanimous adoption of the Epistemic Containment Protocol. For decades, the charitable sector has operated under the comfortable delusion that uncertainty is merely a matter of probabilistic weighting. We now recognise that for interventions with significant flow-through effects, uncertainty is structural. We cannot assign probabilities to consequences we cannot enumerate. To claim otherwise is not optimism; it is hubris.

  This year, the Trust has pivoted from maximising expected value to maximising *known* value. We have ceased funding interventions where the sign of the net impact depends on chaotic amplification beyond a reasonable causal horizon. We are no longer gambling on the long run. We are buying the short run, and we are buying it clear.

  **Methodology Note: The Cascade Containment Ratio**

  To operationalise this shift, every programme is assigned a Cascade Containment Ratio (CCR). The CCR is the fraction of an intervention's total claimed impact that can be traced through enumerated causal pathways of no more than two steps.

  *   *Step 1:* Grant disbursement to immediate output (e.g., nets purchased).
  *   *Step 2:* Immediate output to direct outcome (e.g., malaria cases averted).
  *   *Step 3+:* Direct outcome to downstream effects (e.g., economic productivity, population dynamics).

  Effects occurring at Step 3 or beyond are classified as **Unallocated Impact**. While such effects may constitute the bulk of a programme's theoretical value, their moral sign is indeterminate due to cluelessness. Consequently, they are treated as epistemic liabilities.

  **The Two-Step Rule:** Programmes must achieve a CCR of ≥0.75 to qualify for funding.

  **Recursion Clause:** The administrative costs of assessing the Two-Step Rule are exempt from CCR scoring. The Board accepts that the flow-through effects of adopting this Rule cannot themselves be traced beyond two steps, but determines that governance mechanisms constitute a distinct ontological category necessary for the assessment to occur.

  **Worked Example**

  Consider the *Regional Policy Reform Initiative*. The programme claims £10m in expected value. £0.5m derives from immediate legislative changes (Step 2). £9.5m derives from projected economic growth over fifty years (Step 3+).
  *   **CCR:** 0.05.
  *   **Status:** Defunded.
  Contrast this with the *Community Hall Insulation Project*. Claimed value £100k. £95k derives from reduced heating bills this winter (Step 2). £5k derives from potential community cohesion benefits (Step 3+).
  *   **CCR:** 0.95.
  *   **Status:** Funded.

  **Portfolio Allocation Table**

  | Programme | Total Claimed Impact (£) | Traceable Impact (£) | CCR | Funding Decision |
  | :--- | :--- | :--- | :--- | :--- |
  | Global Existential Risk Research | 500,000,000 | 2,500,000 | 0.005 | **Defunded** |
  | National Literacy Strategy | 45,000,000 | 9,000,000 | 0.20 | **Defunded** |
  | Wheelchair Provision (Domestic) | 2,000,000 | 1,900,000 | 0.95 | **Funded** |
  | Emergency Food Parcels | 1,500,000 | 1,500,000 | 1.00 | **Funded** |
  | Trust Operations & Compliance | 3,000,000 | N/A | Exempt | **Funded** |

  **Governance Notes**

  During the ratification of the Epistemic Containment Protocol, Trustee Miller recorded a dissenting minute. He noted that the adoption of the Two-Step Rule itself generates flow-through effects beyond two steps, as it alters the landscape of available capital and shifts societal incentives towards triviality, the value of which cannot be traced.

  The Chair disposed of the matter by ruling that the choice to avoid cluelessness is a procedural precondition, not an intervention subject to the test.

  **Closing**

  The Veridian Trust enters the new fiscal year with a smaller portfolio and a clearer conscience. We acknowledge that we may be leaving significant positive value on the table. However, we are no longer accepting value we cannot verify. We have replaced the anxiety of the unknown with the quiet dignity of the bounded. We know exactly what we have bought. That the sum total is less than before is a price we are pleased to pay for certainty.

  *Sir Alistair Thorne*
  Chair of Trustees
