  # SEMINAR HANDOUT: NAVIGATING INFINITE ETHICS

  ## PART 1: THE DIAGNOSTIC CASES
  *Answer each question based on your intuitive judgment of the case described. Do not worry about consistency yet; the tree will locate your position.*

  **(a) The Extra Life**
  A cosmos already contains infinitely many good lives. An act adds one further good life and changes nothing else. Is the resulting outcome **Better**, **Worse**, **Equally Good**, or is the comparison **Malformed** (no fact of the matter)?

  **(b) The Density**
  Two infinite worlds have the same large-scale shape. In World 1, the proportion of good to bad lives is higher in every sufficiently large region (higher value per unit volume in the limit). In World 2, it is lower. Can you **Rank** them (one is better), or must you **Decline** to rank them?

  **(c) The Spatial/Temporal Split**
  Does your answer to **(a)** change if the infinity is spread out in *space* (where you can only affect a finite region) versus an endless *future* (which you can genuinely shape)? **Same Answer** or **Different Answer**?

  **(d) The Tiny Probability**
  Act X offers a 1-in-10⁹ chance of producing infinite value (otherwise zero). Act Y certainly produces an enormous but finite amount of value. Mirror image: Act Z offers a 1-in-10⁹ chance of infinite disvalue. Do you **Take the Infinite Chance** (prioritize X/avoid Z) or **Take the Finite Certain** (prioritize Y/accept Z)?

  **(e) The Undefined Expectation**
  A lottery over finite payoffs has an expected value that does not exist (positive and negative parts both diverge). Is this a **Counterexample** to expected-value maximisation (the rule fails), or a **Misdescription** (the payoffs/rule were specified incorrectly)?

  **(f) The Mixed Case**
  A world contains both an infinite heaven and an infinite hell. One finite instance of suffering is added. Does this addition **Matter** (makes the world worse), or **Does Not Matter** (the infinite parts swamp the finite)?

  ***

  ## PART 2: THE DECISION TREE

