answer: |-
  Here is the specification for a method of judging historical sources, designed to handle the cases you listed and the logical problems you identified.

  ### The Core Logic: Abduction, Not Deduction
  First, you must define what the method is trying to do. History cannot use **deduction** (proving something must be true) because you lack complete data. It uses **abduction** (inference to the best explanation).

  The goal is not to find "The Truth." The goal is to find the **Most Probable Narrative** that explains the existing evidence with the fewest assumptions.

  ---

  ### Part 1: The Requirements (The Spec)

  These are divided into **Non-Negotiable** (logical necessities for the method to function) and **Heuristics** (rules of thumb that increase probability but aren't absolute).

  #### 1. The Requirement of Independence (Non-Negotiable)
  **Rule:** Two sources count as evidence only if they are causally independent. If Source B read Source A, they count as one source, not two.
  **The Case:** *Three later books say it happened, but they all look like they copied the first one.*
  **Why:** If three people copy a lie, you have one lie repeated three times, not three confirmations. You must trace the "genealogy" of the text. If they share the same specific errors or phrasing, they are a single witness.
  **Status:** Non-Negotiable. Without this, you are counting echoes, not voices.

  #### 2. The Requirement of Material Constraint (Non-Negotiable)
  **Rule:** Physical evidence (coins, ruins, climate data) sets the boundaries of what is possible. Text cannot override physical impossibility.
  **The Case:** *Something known only from coins or buildings, with no text at all.*
  **Why:** A coin proves a ruler existed and had enough metal to mint currency. A ruin proves people had the engineering to build it. Text can lie about *why* it happened; the object proves *that* something happened. However, objects cannot speak intent. A burnt layer proves a fire, not necessarily an "invasion."
  **Status:** Non-Negotiable. Text must fit within the physical reality established by artifacts.

  #### 3. The Requirement of Proximity vs. Access (Heuristic)
  **Rule:** Temporal proximity (being there) is weighted higher than temporal distance, *unless* the distant author had access to lost records.
  **The Case:** *An author who was actually there vs. an author writing 200 years later who says he talked to people who were.*
  **Why:** Being there reduces transmission error (the game of "telephone"). However, eyewitnesses have limited perspective (they only see what's in front of them) and high emotion. The later author might have had access to official logs the eyewitness didn't see.
  **Status:** Heuristic. Proximity is a bonus, not a guarantee. Eyewitnesses lie; later researchers can be accurate.

  #### 4. The Requirement of Incentive Analysis (Heuristic)
  **Rule:** You must identify *why* the author wrote this. Bias is not a disqualifier; it is a variable you must solve for.
  **The Case:** *A source with an obvious reason to lie vs. one that just repeats what everyone in his city already believed.*
  **Why:**
  *   **Conscious Bias (Reason to lie):** The author wants a specific outcome (e.g., pleasing a king). You can correct for this by flipping the claim (if he says he won gloriously, assume it was a messy draw).
  *   **Unconscious Bias (Cultural belief):** The author repeats myths they think are true. This is harder to correct because the author believes it.
  **Status:** Heuristic. You can filter conscious bias; unconscious bias requires cross-referencing with outside cultures.

  #### 5. The Requirement of Differentiation (Heuristic)
  **Rule:** Accuracy in verifiable details increases trust in non-verifiable details, but does not prove them.
  **The Case:** *A source that gets small stuff right (names, distances, dates) and the big stuff weird.*
  **Why:** If an author gets the travel time between cities right, they likely actually traveled. This proves **competence** and **access**. It does not prove their interpretation of events. However, an author who gets small facts wrong is likely inventing the big facts too.
  **Status:** Heuristic. It builds credibility, but credibility is not truth.

  #### 6. The Requirement of Naturalistic Translation (Non-Negotiable)
  **Rule:** Claims of supernatural causation must be translated into human or natural causes to be historically valid.
  **The Case:** *A source that says a god did it.*
  **Why:** History studies human action. If a source says "A plague happened because Apollo was angry," the historical fact is "A plague happened." The method cannot test the god; it can only test the plague. The "god" part is data about the author's culture, not data about the event's cause.
  **Status:** Non-Negotiable. If you accept supernatural causation, you exit history and enter theology/myth.

  #### 7. The Requirement of the Singleton (Heuristic)
  **Rule:** An event reported by only one source is not "false," it is "unverified." It remains provisional.
  **The Case:** *Exactly one old book says a battle happened and nothing else ever mentions it.*
  **Why:** Silence from other sources is not proof of non-existence (evidence might be lost). However, without corroboration, the burden of proof is maximum. The claim is accepted only if it fits the context (e.g., does the political situation make this battle likely?).
  **Status:** Heuristic. You can use the data, but you must label it as "single-attestation."

  ---

  ### Part 2: Your Friend's Point (The "Against Interest" Rule)

  Your friend is describing a formal historical principle often called the **Criterion of Embarrassment**.

  **Is it a real requirement?**
  It is a **Strong Heuristic**, not a non-negotiable law.

  **The Logic:**
  People generally invent stories to make themselves, their leaders, or their gods look good. If an author includes a detail that makes their side look weak, stupid, or immoral, they likely did not invent it. They included it because they couldn't deny it (it was too well known) or because they were committed to accuracy despite the cost.

  **Example:**
  If a Greek historian writes that the Greek army panicked and ran, that is likely true. If he writes that the Greeks fought bravely, that might be propaganda.

  **The Flaw:**
  Sometimes authors include "bad" details to set up a greater triumph later (a "redemption arc"), or to blame a specific scapegoat while saving the reputation of the main leader. So, it is a strong signal of truth, but not a guarantee.

  ---

  ### Part 3: The Circularity Problem

  You identified a real philosophical problem. It is called the **Problem of the Criterion**.
  *   To trust a source, you need independent verification.
  *   To trust the verification, you need another source.
  *   Therefore, you never start.

  **Is this a real problem?**
  Yes. It is impossible to escape completely. You cannot prove history with 100% certainty like a math equation.

  **What it means for the method:**
  If you demand 100% certainty, you must admit we can know *nothing* about the past. This is **Skepticism**. Most historians reject this because it is useless.

  Instead, historians use **Convergence**.
  You do not look for one "perfect" source. You look for multiple imperfect sources that point in the same direction.
  *   Source A (Biased) says X happened.
  *   Source B (Copied A) says X happened. (Useless)
  *   Source C (Enemy of A) implies X happened by complaining about the result.
  *   Archaeology shows a layer of destruction at the date of X.

  None of these prove X alone. Together, they make "X did not happen" a more complicated explanation than "X happened."

  **The Solution to the Circle:**
  You break the circle by accepting **Probability**, not Proof.
  The method is successful if it produces a narrative that is *more likely* than the alternatives, not if it produces a narrative that is *undeniable*.

  **Can the method be suspicious enough without giving up?**
  Yes, but you must accept two things:
  1.  **Some questions are unanswerable.** If you have one source and no archaeology and no logic to check it against, the answer is "We do not know," not "It happened."
  2.  **History is always provisional.** A new discovery (a letter, a ruin) can overturn the "best explanation." The verdict is never final, only current.

  ### Summary of Requirements

  | Requirement | Type | Handles Case |
  | :--- | :--- | :--- |
  | **Independence** | Non-Negotiable | Copied books (Case 2) |
  | **Material Constraint** | Non-Negotiable | Coins/Buildings (Case 6) |
  | **Naturalistic Translation** | Non-Negotiable | Gods/Supernatural (Case 7) |
  | **Incentive Analysis** | Heuristic | Bias/Reason to Lie (Case 5) |
  | **Proximity vs. Access** | Heuristic | Eyewitness vs. Later (Case 3) |
  | **Differentiation** | Heuristic | Small details right/Big weird (Case 4) |
  | **Singleton Status** | Heuristic | One book only (Case 1) |
  | **Against Interest** | Heuristic | Friend's point (Case 8) |

  **Final Verdict:**
  You cannot verify history by finding a "truth machine." You verify it by triangulation. You take multiple biased, imperfect, circular sources and look for the point where they intersect. Where they intersect is not necessarily "The Truth," but it is the only place where it is rational to stand.
