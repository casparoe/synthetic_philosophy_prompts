answer: |-
  **1. The principle, stated first**

  Self-deception is the motivated management of one's epistemic or practical stance to sustain a preferred conclusion, achieved by asymmetrically applying evidential standards or attentional focus compared to how one would treat opposing evidence. It requires not merely error, but a directional bias in the process of inquiry or avoidance that protects a desired state of mind—whether belief, hope, or self-conception—from disconfirmation. Crucially, the agent would reject this procedural asymmetry if the desired outcome were reversed, distinguishing it from general incompetence. This covers belief fixation, avoidance, and self-conception without requiring simultaneous contradictory beliefs.

  **2. Clause by clause, with the case that motivates each**

  "Motivated management" anchors the error to desire, excluding Case 4. If dropped, general incompetence becomes self-deception, diluting the term until it covers all error. The poor judge fails universally; the self-deceiver fails selectively. "Asymmetrically applying standards" targets Case 1 specifically; the colleague accepted null results elsewhere. Without this asymmetry, we cannot distinguish SD from genuine theoretical disagreement or honest error. It forces the comparison class: would you accept this evidence from an enemy? "Process of inquiry or avoidance" is necessitated by Case 6. The man holds no false belief but manages attention to avoid knowledge. A belief-only model fails here, forcing us to say he isn't self-deceived despite the obvious psychological maneuvering. It also captures Case 5, where the surgeon's data exclusion was a procedural maneuver, not a conscious lie. "Protects a desired state of mind" distinguishes Case 2 from SD. The dying friend manages her presentation, but not to protect a self-conception or belief; she protects her family. If we drop "desired state," altruistic performance becomes pathology. The motive must be self-regarding, however unconsciously. Finally, the "reversibility test" separates Case 1 from Case 4. The poor judge fails everywhere; the self-deceiver fails only where it hurts. Without reversibility, we cannot distinguish bias from incompetence. Case 5 fits here: the surgeon's exclusion rule was applied asymmetrically to protect his self-conception as a top surgeon, though he couldn't locate the moment of bias. The principle holds because the asymmetry exists even if the agent cannot pinpoint it. Case 7 fits "self-conception." He deceives himself about his motives. If we restrict SD to factual belief, Case 7 vanishes. The principle must allow deception about internal states, not just external facts. Each clause acts as a filter; remove one, and a non-SD case slips through, or a clear SD case is excluded. The surgeon case specifically demands that we accept opacity; if we require the agent to identify the bias, Case 5 becomes unconscious bias, not SD. SD requires sincerity now, based on a biased process then.

  **3. What my estimator account gets right, and where it must be repaired**

  Your estimator account is robust for Cases 1, 3, and 4. The "directional error" and "reversibility test" perfectly isolate the colleague's bias from the poor judge's incompetence. You correctly identify that the bias enters through the evidential itinerary, not the prior. However, your definition restricts SD to "belief-fixation." This fails Case 6, where you correctly identify SD but note there is "no false belief." The man fixes a state of ignorance, not a belief. Your model requires a belief to be biased; here the success is the absence of belief. Similarly, Case 7 involves deception about a desire, not a fact. Your model cannot capture self-deception regarding one's own motivations because there is no external evidence itinerary to bias, only internal attention. Finally, Case 5 troubles you because you seek a "moment of error." Your model implies a discrete decision point. SD is often a diffuse drift in standards, not a single rule change. To repair this, broaden "belief-fixation" to "epistemic or practical stance-management." This allows for avoidance (Case 6) and motivational deception (Case 7) without abandoning your core insight about directional bias in the process. Keep the reversibility test; it is your strongest tool.

  **4. Which of my verdicts you cannot keep**

  I recommend surrendering the certainty on Case 3. You describe the student as potentially believing only that he is "entitled to publish," not that the result is true. Self-deception requires sincerity about the proposition. If he knows he is p-hacking, he is not deceived about the evidence; he is committing fraud while perhaps deceiving himself about his integrity. That is a different vice. Conflating professional dishonesty with self-deception muddies the water. If he genuinely believes the p-hacked result, it is SD. If he knows it's noise but publishes anyway, it is not. You must choose. I also suggest tightening Case 7. Calling it self-deception about a "desire" stretches the term toward simple hypocrisy. He knows he is furious; he claims he doesn't care. This is lying to others, or perhaps lying to himself about his character, but it lacks the epistemic component of Cases 1 and 5. To keep a tight principle, restrict SD to errors about states of affairs (including one's own skills, Case 5), not mere emotional regulation. You lose the ability to call every vanity a self-deception, but you gain precision. A simpler principle requires dropping the edge cases where deception overlaps with fraud or hypocrisy. Keep 1, 2, 4, 5, 6. Drop 3 (unless sincere) and 7 (as distinct from hypocrisy). This sacrifices coverage for clarity. Your instinct to trust verdicts over theory is sound, but verdicts on borderline cases are often unstable. Case 3 is a borderland between SD and cheating. Case 7 is a borderland between SD and social masking. Cutting them clarifies the core phenomenon: believing what you want to be true despite evidence. The cost is losing the ability to describe motivational blindness as SD, but the gain is a principle that doesn't require a new clause for every psychological defense mechanism.

  **5. Predictions for the cases I have not listed**

  First, groups can be self-deceived. A department ignoring null results while celebrating positives exhibits the same asymmetric evidential standards as Case 1, institutionalized. The "agent" is the collective decision-making process. The reversibility test applies: would they accept this standard from a rival department? If not, it is group SD, consisting in shared norms that filter disconfirming evidence. It is not just groupthink; it is motivated groupthink. Second, the fabricator who believes his own lie is a pure case of SD, distinct from fraud. Fraud requires knowing falsity. If he fabricates, then forgets the fabrication and integrates the data into his worldview (Case 5 style), he passes the sincerity test. The bias entered at the data creation, but the belief is now genuine. He is self-deceived about the source of his knowledge. This is dangerous because it feels like honesty. Third, SD with no behavioral signature is possible but rare. If the error never surfaces in action or speech, it is indistinguishable from private belief. However, SD implies a tension between evidence and belief. If there is no behavioral cost (no avoidance, no defensive argumentation), the "management" clause of my principle is unmet. SD requires work. A person who simply holds a false belief without defending it or avoiding counter-evidence is merely mistaken. SD requires the active maintenance of the error against pressure. Therefore, silent SD is only possible if the avoidance is internal (suppressing thoughts), which is itself a behavioral signature of the mind, if not the body. Without that effort, it is just error. The principle predicts that if you find no evidence of management—no avoidance, no asymmetry—you have found error, not self-deception.
