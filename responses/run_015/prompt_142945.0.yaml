      *   **Topic:** Lexical Threshold Negative Utilitarianism (LTNU). This view holds that reducing suffering below a certain threshold takes lexical priority over maximizing pleasure, but above that threshold, trade-offs might be allowed (or perhaps the threshold defines a strict prohibition). The core issue is whether this lexical priority requires *commensurability* (a common metric) between pleasure and pain.
