      *   **Blair's Position:** LTNU does not require commensurability. Lexical ordering is structural/ordinal, not cardinal. It's based on independent normative reasons (deontological constraints or qualitative distinctions), not weighing on a single scale.
      *   **Key Philosophical Concepts:**
          *   *Commensurability:* Can values be measured on a single scale?
          *   *Lexical Priority:* One value trumps another regardless of magnitude (e.g., Rawls's liberty principle).
          *   *Incommensurability:* Values cannot be compared quantitatively (e.g., liberty vs. security, art vs. life).
          *   *Negative Utilitarianism:* Priority on suffering reduction.
