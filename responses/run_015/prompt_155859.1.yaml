  A retired physicist corners a utilitarian ethicist after a lecture.

  "I've been analyzing your Utility Monster," the physicist says. "Structurally, it's indistinguishable from a gravitational singularity. It acts as an attractor that pulls in all available resources, converting them into an extreme concentration of welfare while leaving everything outside in an asymptotic flatline."

  "That's a beautiful analogy," the ethicist replies, "but you're misunderstanding the obligation."

  "How so?"

  "In general relativity, matter follows the geodesics of spacetime. In utilitarianism, resources follow the geodesics of welfare. Once the Monster's marginal utility creates a moral event horizon, withholding a resource isn't charity—it's forcing matter to move against the natural curvature of the good. The aggregation function demands we maximize the integral, and the Monster dominates the sum."

  "So the rest of us starve," the physicist says.

  "No," the ethicist smiles. "Starving implies a significant loss. Once the Monster's welfare curves sufficiently, your utility isn't a loss—it's the vacuum solution. You aren't victims of the calculus; you're just the asymptotically flat space required to define the curvature of the good."
