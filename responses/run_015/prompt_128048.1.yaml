answer: |-
  # Q&A Prep Sheet: Geometric Rationality & Algorithmic Allocation

  **Context:** Defense of geometric rationality (Kelly) as a *normative constraint* on sequential resource allocation, contingent on independence assumptions that fail under adversarial correlation.
  **Audience:** Formal Epistemologists, Decision Theorists, Behavioral Economist, Computer Scientists.
  **Goal:** Defend the normative claim without overstepping into metaphysics; leverage engineering intuition to ground philosophical claims.

  ---

  ## Top 6 Objections (Ordered by Likely Damage)

  ### 1. The Asymptotic/Finite Horizon Objection
  **Who:** Computer Scientists & Behavioral Economist
  **The Objection:** "The Kelly criterion maximizes the *asymptotic* growth rate. It is only optimal as $N \to \infty$. In real-world algorithmic allocation, horizons are finite, and budgets often have hard cutoffs. In finite sequences, Expected Value (Arithmetic Mean) maximization often dominates Geometric Mean maximization. If the horizon is unknown or short, your 'normative constraint' is mathematically suboptimal."
  **Your Reply (2 mins):** "You are correct that Kelly is asymptotic. However, in algorithmic systems, 'finite horizon' is often a design choice, not a physical constant. My claim is that for any system designed for *persistence* (i.e., avoiding ruin to continue operation), the geometric mean is the relevant metric regardless of horizon length, because ruin is an absorbing state. If the algorithm goes to zero, the horizon ends prematurely. Therefore, Kelly isn't about maximizing final wealth at $T$; it's about maximizing the probability of surviving to $T$. The normative constraint applies to any system where 'existence' is a prerequisite for 'utility'."
  **Weakest Point:** This conflates "survival" with "growth." A system might be designed to burn out quickly for maximum impact (e.g., a spot-checking algorithm). If the goal isn't persistence, Kelly is not normative.

  ### 2. The Log-Utility Reduction
  **Who:** Decision Theorists
  **The Objection:** "This isn't a new normative framework. Kelly betting is mathematically isomorphic to Expected Utility maximization with a logarithmic utility function. You aren't discovering a constraint on rationality; you're just assuming a specific risk preference. Why *ought* an algorithm have log-utility?"
  **Your Reply (2 mins):** "Standard decision theory treats utility as exogenous. I am arguing that in sequential resource allocation, the 'utility function' is endogenous to the environment's structure. If the environment compounds returns, the 'true' utility of a resource unit depends on the units retained for future rounds. Log-utility isn't a preference; it's the mathematical shadow of compounding. The normative claim is that if you ignore the compounding structure (by using linear utility), you are structurally misaligned with the temporal dynamics of the budget, regardless of preference."
  **Weakest Point:** Decision theorists will argue that "structural alignment" is just a fancy way of saying "instrumental rationality for a specific goal." It doesn't prove the goal (compounding) is mandatory.

  ### 3. The Normativity for Non-Human Agents
  **Who:** Formal Epistemologists
  **The Objection:** "Normativity applies to agents with beliefs and desires. Algorithms execute code. To say an algorithm 'ought' to follow Kelly is a category error unless you define whose 'ought' this is. Is it the designer's? The user's? Or are you reifying the algorithm as an agent?"
  **Your Reply (2 mins):** "I am using 'normative' in the engineering sense of 'constraint satisfaction.' Just as a bridge 'ought' to respect load-bearing equations to avoid collapse, an allocation algorithm 'ought' to respect geometric growth constraints to avoid budgetary collapse. We don't need the bridge to have beliefs. The 'ought' is hypothetical: *If* the system is to maintain solvency across sequential rounds, *then* it must satisfy these constraints. The agency lies in the design specification, not the runtime."
  **Weakest Point:** This reduces "normative" to "instrumental." Philosophers may press that this is merely a technical efficiency claim, not a philosophical norm.

  ### 4. The Bayesian "Blind Spot" vs. Prior Misspecification
  **Who:** Formal Epistemologists
  **The Objection:** "You claim standard Bayesian updates have a blind spot under adversarial correlation. But a proper Bayesian model should include the adversary in the prior. If the update fails, it's not a structural blind spot; it's just model misspecification. You're blaming the update rule for a bad prior."
  **Your Reply (2 mins):** "Standard Bayesian updates typically assume exchangeability or independence across trials to remain computationally tractable. Explicitly modeling an adversary in the prior creates an infinite regress (I model them modeling me). My argument is that the *presumption of independence* is the default structural prior in sequential budgeting. When correlation is adversarial, this default prior is not just 'wrong,' it is exploitable in a way that simple misspecification isn't. The blind spot is the assumption that past independence predicts future independence in a strategic environment."
  **Weakest Point:** A sophisticated Bayesian will argue that "assuming independence" is a choice, not a necessity of Bayesianism. You are attacking a specific *application* of Bayes, not Bayes itself.

  ### 5. Dutch-Book Inapplicability
  **Who:** Decision Theorists
  **The Objection:** "Dutch-book arguments justify probability axioms, not betting strategies. I can violate Kelly without being Dutch-booked if my probabilities are coherent. Why should I care about Dutch-book vulnerability if I'm not taking the other side of a bet?"
  **Your Reply (2 mins):** "In sequential allocation, the 'other side of the bet' is the environment's variance. If you violate Kelly in a compounding environment, you are effectively betting against your own future capacity to bet. This is a 'self-Dutch-book': you accept a sequence of local decisions that guarantee a lower global outcome than an alternative strategy. It's not about coherence of belief, but coherence of action across time."
  **Weakest Point:** "Self-Dutch-book" is not a standard technical term. They may press you to formalize this, and you might lack the formalism to prove it's a true Dutch book (guaranteed loss vs. suboptimal gain).

  ### 6. Heuristic vs. Norm
  **Who:** Computer Scientists
  **The Objection:** "In engineering, Kelly is a heuristic to prevent overfitting to noise. Calling it a 'norm' adds philosophical baggage without changing the code. Why not just call it a regularization parameter?"
  **Your Reply (2 mins):** "Calling it a heuristic implies it's a shortcut for something better. I am arguing it *is* the optimal solution for the specific constraint of non-ruin in compounding systems. If we treat it as a tunable parameter, engineers might tune it away from optimality for short-term gains, introducing systemic fragility. Framing it as a norm protects the system from 'optimizing' itself into extinction."
  **Weakest Point:** Engineers care about results. If a "suboptimal" heuristic works better in practice due to model error, your normative claim looks dogmatic.

  ---

  ## The "Hope No One Asks" Objection
  **Topic:** **Non-Renewable Resources / Absorbing Boundaries**
  **The Objection:** "Kelly assumes capital is fungible and reinvestable (money). Algorithmic resources (e.g., CPU cycles, battery, time) are often non-renewable or non-fungible. You cannot 'compound' CPU cycles in the same way you compound capital. If the budget is consumed rather than invested, the geometric growth logic collapses."
  **Why it's dangerous:** It attacks the isomorphism between "betting" and "resource allocation." If the resource doesn't compound, Kelly is mathematically irrelevant.
  **Contingency:** If asked, concede that the claim holds *only* for renewable/reinvestable resources (e.g., attention, reputation, financial budget) and does not apply to consumables (e.g., fuel). Limit the scope of your thesis to "renewable algorithmic capital."

  ---

  ## Falsification Conditions (What Would Change Your Mind)
  1.  **Formal:** A proof demonstrating that in a non-ergodic, finite-horizon environment, a linear utility strategy yields higher survival probability than a log-utility strategy.
  2.  **Empirical:** Evidence from high-frequency trading or RL agents showing that systems explicitly optimized for geometric growth underperform arithmetic optimizers in adversarial, correlated markets over realistic timeframes.

  ---

  ## Most Vulnerable Step in Reasoning
  **The Leap from Instrumental to Normative.**
  Your argument successfully shows that *if* an algorithm wants to survive/compound, it *must* use Kelly (Instrumental). You are vulnerable when claiming it *ought* to want to survive/compound (Normative).
  *   **Risk:** The Behavioral Economist will argue that "survival" is just one preference among many.
  *   **Defense:** Keep the defense grounded in **system design**. The "ought" comes from the designer's intent to create a persistent system, not from the algorithm's intrinsic moral status. Do not try to defend universal normativity; defend *design* normativity.
