answer: |-
  **Exam Essay Question**

  **Course:** PHI 450: Early Modern Metaphysics and Ethics
  **Time Allowed:** 75 Minutes
  **Word Count:** 900–1,100 Words

  **Prompt:**

  Leibniz defines justice as "the charity of the wise," understood as a rational pleasure in the happiness of others, directed toward the perfection of rational creatures and ultimately toward God. Simultaneously, he maintains that this is the best of all possible worlds, arranged by divine choice according to a calculus of compossibility in which every permitted evil serves a greater overall harmony.

  Write an essay examining whether this moral philosophy is genuinely action-guiding or collapses into a kind of theological quietism. Your response must address the following four points:

  1.  Explain how Leibniz's tripartite theory of the good—metaphysical perfection as reality, moral good as virtue, and physical good as pleasure—underwrites the claim that to love God rationally is to take pleasure in the happiness of other rational beings, and why this makes justice an expression of wisdom rather than mere benevolence.
  2.  Articulate the quietism problem precisely: if the distribution of virtue, happiness, and suffering is already fixed by the optimal divine selection among compossible worlds, what work is left for human moral agency? Can human action genuinely increase the total perfection of the universe, or is moral effort redundant because the calculus is already settled?
  3.  Evaluate whether Leibniz can block quietism by appealing to distinctions he actually draws—such as that between physical necessity and moral necessity, or between the realm of nature governed by efficient causes and the realm of grace governed by final causes—without rendering moral agency epiphenomenal or reducing it to mere alignment with an unchangeable order.
  4.  Inject and examine a specific conceptual challenge: Does Leibniz implicitly accept a structural moral asymmetry parallel in form to the procreation asymmetry? That is, does his system treat the existence of a virtuous, happy rational being as carrying a special reason for agents to promote or preserve it, while treating the existence of a suffering rational being as not carrying a corresponding reason to prevent it—precisely because suffering and limitation are metaphysically necessary privations that serve indispensable compossible functions in the optimal world? Assess whether this charge is fair, given his privation theory of evil and his claim that metaphysical evil (finite limitation) is inseparable from created being, or whether it conflates necessary metaphysical limitation with contingent moral evil (vice and sin).

  ***

  **Model Answer**

  Leibniz's moral philosophy attempts to reconcile active human virtue with a metaphysics of optimal divine determinism. The central tension lies between justice as an active charity of the wise and the static perfection of the best of all possible worlds. To determine if this collapses into quietism, one must analyze the structure of the good, the nature of agency within compossibility, and the implications of his theodicy for moral reasons.

  First, Leibniz's tripartite theory of the good grounds justice in wisdom rather than sentimental benevolence. Metaphysical good is reality or perfection; moral good is virtue (the habit of acting according to wisdom); physical good is pleasure. For Leibniz, happiness is durable pleasure arising from the contemplation of perfection. Since God is the source of all reality, loving God rationally means taking pleasure in the manifestation of His perfection in creation. Because rational beings mirror God most closely, promoting their happiness increases the total perfection accessible to contemplation. Thus, justice is the charity of the wise because it is not merely wishing well, but intelligently willing the harmony that maximizes reality. It is an intellectual love aligned with the structure of the universe, not merely an emotional impulse.

  Second, the quietism problem arises specifically from the calculus of compossibility, not merely from causal determinism. If God has already selected the unique series of compossible substances that yields the maximum surplus of perfection over imperfection, the total sum of virtue and suffering is fixed. If my moral actions are part of this fixed series, can they be genuinely normative? If I cannot alter the total perfection of the universe, moral effort appears redundant. The threat is that agents become mere spectators of a divine script, where "ought" implies "can" is violated because one cannot act against the optimal order. If the world is already the best, attempting to improve it seems metaphysically impossible, and attempting to prevent evil seems to oppose divine wisdom.

  Third, Leibniz blocks quietism by distinguishing between physical and moral necessity, and between the realms of nature and grace. Physical necessity governs efficient causes in the realm of nature; moral necessity governs final causes in the realm of grace. God is morally necessitated to choose the best, but not physically necessitated; likewise, humans are physically determined by their preceding states but morally responsible because they act for reasons. Agency is not epiphenomenal because human choices are the final causes through which the optimal order is realized. We do not change the total sum of the universe from the outside; rather, our moral actions are the internal mechanisms by which the harmony is achieved. To act virtuously is to align one's will with the divine reason, participating in the realm of grace. Thus, agency is preserved not as the power to alter the global calculus, but as the capacity to inhabit one's role within it consciously rather than passively.

  Fourth, the charge of structural moral asymmetry requires nuanced evaluation. The charge suggests Leibniz gives agents reason to promote virtue (which adds perfection) but no corresponding reason to prevent suffering (which is merely privation serving harmony). This charge is partially fair but conflates metaphysical evil with moral evil. For Leibniz, metaphysical evil (limitation) is inseparable from creation; no creature can be God. Therefore, preventing all suffering is impossible and not a moral duty. However, moral evil (sin) and unnecessary physical suffering are contingent. Leibniz does not claim every particular pain is justified in isolation, but that it is justified within the whole. Consequently, agents still have reason to prevent contingent suffering where possible, as this aligns with the general tendency toward perfection. However, a tension remains: if every permitted evil serves the optimal harmony, intervening to prevent specific suffering might theoretically disrupt the compossibility required for the best world. Leibniz resolves this by asserting we cannot know the global calculus; therefore, our local duty is to minimize evil based on available reason. The asymmetry holds only regarding metaphysical limitation, not contingent vice.

  In conclusion, Leibniz's system avoids total quietism by redefining agency as participation in divine wisdom rather than alteration of the global sum. However, the asymmetry charge exposes a residual tension: while we are commanded to promote virtue, our duty to prevent suffering is limited by our ignorance of the necessary role that suffering plays in the optimal compossibility. Justice remains action-guiding, but within the constrained horizons of finite wisdom.

  ***

  **Marking Scheme (Total: 20 Points)**

  | Component | Points | A-Range (Excellent) | B-Range (Good/Adequate) |
  | :--- | :---: | :--- | :--- |
  | **1. Tripartite Good & Charity** | **5** | **5:** Clearly distinguishes metaphysical/moral/physical good. Explains justice as *wisdom* (intellectual pleasure in harmony) rather than mere benevolence. Connects love of God to love of rational perfection. <br> **3-4:** Correctly lists the three goods but treats justice as standard benevolence. Weak link between God's perfection and human happiness. <br> **1-2:** Confuses the goods or omits the connection to wisdom. |
  | **2. Quietism Formulation** | **5** | **5:** Identifies quietism as arising from the *compossibility calculus* (fixed total perfection), not just general determinism. Articulates the redundancy of moral effort clearly. <br> **3-4:** Identifies quietism but treats it as generic determinism/fatalism. Misses the specific issue of the "optimal sum" being fixed. <br> **1-2:** Vague statement about fate; fails to explain why agency is threatened. |
  | **3. Defenses (Nature/Grace)** | **5** | **5:** Uses physical/moral necessity or nature/grace distinctions to show agency operates *within* the order, not against it. Avoids making agency epiphenomenal. <br> **3-4:** Mentions the distinctions but fails to explain how they save agency. Implies agents just "align" passively. <br> **1-2:** Misapplies the distinctions or claims Leibniz denies determinism. |
  | **4. Asymmetry Challenge** | **5** | **5:** Nuanced treatment. Distinguishes metaphysical evil (limitation) from moral/contingent evil. Assesses fairness of charge without accepting it blindly. Acknowledges residual tension. <br> **3-4:** Addresses the charge but conflates metaphysical limitation with moral sin. Accepts or rejects the charge too simply. <br> **1-2:** Ignores the asymmetry prompt or treats it as standard problem of evil. |
  | **Common Errors & Penalties** | | **Deductions:** <br> - Conflating Leibniz's privation theory with a justification of every particular suffering (-2). <br> - Treating the asymmetry charge as obviously correct without engaging the limitation/vice distinction (-2). <br> - Failure to follow word count constraints (900-1100 words) (-1 to -3). <br> - Use of external citations/bibliography (not required/allowed) (-1). | |

  **Grading Notes:**
  *   **A-Range (17-20):** Demonstrates sophisticated grasp of Leibnizian metaphysics applied to ethics. Arguments are precise, distinctions are sharp, and the asymmetry challenge is handled with original critical thought.
  *   **B-Range (13-16):** Competent understanding of main concepts. May rely on standard summaries for the first three points but struggles with the specific asymmetry nuance. Quietism problem may be slightly generic.
  *   **C-Range (9-12):** Basic summary of Leibniz's views. Struggles to connect metaphysics to ethics. Quietism problem is vague. Asymmetry point is missed or confused.
  *   **Fail (0-8):** Significant misunderstandings of Leibniz's position. Fails to address required prompts.
