      *   She lives in a regime (Gilead) that *does* use Orwellian newspeak (Particicution, Salvaging, Unwomen).
      *   *However*, her internal monologue is the site of resistance.
      *   She focuses on the *physical*, the *sensory*, and the *specific*.
      *   She deconstructs Gilead's slogans by contrasting them with bodily reality.

  4.  **Brainstorming Connections (Orwell vs. Atwood):**
      *   *Orwell:* Write plainly to stop the anesthesia.
      *   *Atwood:* Offred writes/speaks to remember the body.
      *   *Difference:* Orwell is prescriptive (how we *should* write). Atwood is descriptive (how a victim *survives* through language).
      *   *Resistance:* Offred doesn't just use clear language; she uses *embodied* language. She anchors words in flesh.
      *   *The "Breakdown":* Orwell assumes a public sphere where clear language can change politics. Offred is in a private sphere where clear language is a survival mechanism, not necessarily a political tool (until the "Historical Notes").

  5.  **Identifying Key Scenes/Themes:**
