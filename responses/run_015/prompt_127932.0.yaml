      *   The "Trapdoor" model is superior because it accounts for the *logical stickiness* of these arguments. Intuition pumps wear off (like illusions); trapdoors require structural demolition of the premise to escape. Mary and Chinese Room persist because they are structural traps, not mere psychological nudges.

