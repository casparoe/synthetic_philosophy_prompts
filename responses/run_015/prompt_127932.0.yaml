prompt: |-
  Compare Dennett's idea of an intuition pump with the less talked-about notion of a conceptual trapdoor — a thought experiment that hides a metaphysical commitment inside its framing instead of just nudging your gut. Look at Mary's room and the Chinese room specifically: which account does better at explaining why these still feel convincing even after you've heard all the usual rebuttals? Don't just list differences, actually argue for one. And is there a case where a pump is effective precisely becuase it functions like a trapdoor?
