      *   **Conceptual Trapdoor:** This isn't a standard philosophical term like "intuition pump." I need to construct a working definition based on the prompt's description: "a thought experiment that hides a metaphysical commitment inside its framing instead of just nudging your gut." It implies a structural deception or a loaded premise that forces a conclusion if accepted, rather than just making a conclusion *feel* right. It's a "begging the question" mechanism disguised as a neutral scenario.

  3.  **Analyze the Cases (Mary's Room & Chinese Room):**
      *   **Mary's Room (Knowledge Argument):** Mary knows all physical facts about color but has never seen red. She sees red. She learns something new. Therefore, physicalism is false.
          *   *Rebuttals:* Ability hypothesis (she gains ability, not knowledge), representationalism (she gains a new mode of representation), illusionism.
          *   *Why it sticks:* It feels like "knowing what it's like" is a distinct *kind* of fact.
      *   **Chinese Room:** Man manipulates symbols according to rules without understanding. System behaves as if it understands. Therefore, syntax is not sufficient for semantics.
          *   *Rebuttals:* System reply (the whole room understands), robot reply (causal connection to world), brain simulator reply.
          *   *Why it sticks:* It feels like "understanding" requires an inner light or subjective grasp, not just symbol manipulation.

  4.  **Evaluate "Pump" vs. "Trapdoor" for these cases:**
      *   *Pump View:* These scenarios are designed to trigger our folk-psychological intuitions about consciousness. They work because we are dualists at heart. Rebuttals fail because they are theoretical, while the intuition is visceral.
      *   *Trapdoor View:* These scenarios smuggle in the conclusion.
          *   *Mary:* The framing assumes "knowledge" is univocal. It assumes that if she learns something, it must be a propositional fact about the world, rather than a skill or perspective. The trapdoor is the definition of "know."
          *   *Chinese Room:* The framing assumes the man *is* the system. It assumes syntax is purely formal and disconnected from semantics *by definition* within the room. The trapdoor is the isolation of the agent from the causal history of the symbols.
      *   *Which explains the resilience better?*
          *   If it were just a pump, logical rebuttals should eventually erode the intuition (like optical illusions). But these persist like logical proofs.
          *   The "Trapdoor" explanation suggests the resilience comes from the fact that to accept the scenario *as described*, you must already accept the dualist/anti-functionalist premise. The rebuttals fail because they try to attack the conclusion without noticing they've already walked through the trapdoor by accepting the setup.
          *   *Argument:* The Trapdoor account is superior because it explains the *imperviousness* to rebuttal. Pumps can be drained (Dennett's goal). Trapdoors are structural; you can't argue your way out once you've fallen in without rejecting the scenario entirely.

  5.  **Drafting the Argument (Iterative Process):**
      *   *Introduction:* Define both. Set the stage. State the thesis: The Trapdoor account better explains the resilience of these thought experiments.
      *   *Section 1: The Intuition Pump.* Explain Dennett's view. It's about rhetorical force. It relies on cognitive bias.
      *   *Section 2: The Conceptual Trapdoor.* Define it as a loaded premise. It's a logical snare, not just a psychological nudge.
      *   *Section 3: Applying to Mary & Chinese Room.*
          *   Mary: The trapdoor is the equivocation on "knowledge."
          *   Chinese Room: The trapdoor is the definition of "understanding" as internal vs. external.
