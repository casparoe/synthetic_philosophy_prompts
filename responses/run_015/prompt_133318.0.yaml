      *   *Algorithmic Management:* Apps dictating routes, timing, acceptance rates, using data to predict and prevent dissent (strikes/slacking).
      *   *Data as Capital:* Is the "predictive profile" a means of production? Or is it a new form of constant capital? Or is it the *labor power* itself being quantified?
      *   *Alienation:*
