answer: |-
  Consider a laboratory scenario in which a team of bioengineers constructs a living entity, which we shall call the "Syntheton," from non-living chemical components. The engineers synthesize a minimal genome from scratch, designing a sequence of nucleotides that has never existed in the history of life on Earth. They insert this genome into a chemically assembled lipid vesicle equipped with ribosomes and metabolic enzymes, also produced via organic synthesis. Upon activation, the Syntheton begins to metabolize nutrients, maintain its internal structure against entropy, and divide into daughter cells with high fidelity. These daughter cells inherit the designed genome and display the same stable cluster of biochemical and morphological traits as the parent. Crucially, the Syntheton has no biological ancestors; it was not born from a pre-existing cell through natural reproduction, nor did its lineage undergo a history of natural selection. It emerged fully formed through human design and assembly.

  This scenario generates a sharp conceptual tension regarding whether the Syntheton constitutes a "natural kind." In many scientific contexts, classification is presumed to track objective structures in the world—groupings that exist independently of human observation. The Syntheton challenges this presumption by decoupling two features that usually coincide in biological entities: the stable clustering of observable properties and the causal-historical lineage.

  To determine if the Syntheton belongs to a natural kind, one might appeal to three distinct criteria, each yielding a different verdict:

  First, one might argue that kind-membership is determined by **present functional clustering**. On this view, the Syntheton belongs to a natural kind because it possesses a stable, self-reinforcing set of traits. Its metabolism supports its structure, its structure protects its genome, and its genome directs its replication. These properties co-occur reliably and persist over time through internal causal mechanisms, regardless of how the entity originated. If scientific classification tracks objective structures defined by how matter behaves and organizes itself in the present, the Syntheton qualifies as a member of a biological kind indistinguishable from naturally evolved organisms.

  Second, one might argue that kind-membership is determined by **causal-historical origins**. On this view, biological kinds are defined not merely by what an organism *does*, but by where it *came from*. Natural biological kinds are typically unified by a shared lineage—a continuous chain of reproduction and descent. Because the Syntheton lacks this history and was brought into existence through an intentional design process rather than reproductive continuity, it does not belong to the same natural kind as naturally evolved cells. It represents an artificial category, distinct from the "joints" of nature carved by evolutionary history.

  Third, one might argue that kind-membership is determined only relative to the **classificatory purposes of researchers**. On this view, whether the Syntheton is grouped with natural cells or set apart as an artificial construct depends on the goals of the scientists studying it. If the goal is to understand universal principles of metabolism, the Syntheton is classified with natural cells. If the goal is to trace evolutionary genealogy or regulate biosafety, it is classified separately. Here, the grouping is not dictated by the entity itself, but by the utility the classification provides to the inquirer.

  The option that undermines the idea that kind-membership is independent of our conceptual schemes is the third: classification relative to **classificatory purposes**. If the Syntheton's status as a member of a kind depends on the interests, goals, or pragmatic needs of the researchers, then the "kind" is not a mind-independent feature of the world waiting to be discovered. Instead, the kind is constituted, at least in part, by the human framework applied to the object.

  The tension arises because the Syntheton scenario makes it difficult to rely exclusively on the first two options. If we insist on present functional clustering, we must accept that an entity with no evolutionary history is "natural," which stretches the ordinary meaning of biological kinds. If we insist on causal-historical origins, we must treat two entities that are microphysically and functionally identical as fundamentally different kinds solely due to their past, which seems to ignore the objective similarity of their current structures. This instability often forces a reliance on the third option—researcher purpose—to resolve the classification. By doing so, the scenario reveals that what counts as a "natural kind" in this context may not be a fixed structure in nature, but a flexible tool dependent on human conceptual schemes.
