      *   *David Hume:* Sympathy is more like contagion or resonance. Passions communicate directly.
      *   *Legal Theory:* Sentencing requires retribution, deterrence, rehabilitation. Victim Impact Statements (VIS) are meant to inform harm but not dictate vengeance.
      *   *The Tension:* The court asks for *emotional data* (VIS) but demands *rational processing* (Sentencing).

  3.  **Address Question 1 & 2: Presuppositions of the Practice:**
      *   The current legal practice is actually a bit of a mess philosophically. It *says* "impartiality" (Kantian/Smithian Spectator) but *acts* like "contagion" is possible (asking the judge to "feel" the pain).
      *   It presupposes that moral knowledge comes from *feeling* the harm (empiricist/sentimentalist) but that justice comes from *suppressing* that feeling (rationalist/stoic).
