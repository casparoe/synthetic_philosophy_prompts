answer: |-
  Here is a decision procedure designed for your desk, followed by an evaluation of its philosophical commitments and a run-through of your cases.

  ### The Procedure

  **Step 1: The Independence Check (Re-identification)**
  *Question:* Does the grouping appear when measured by a method that does not share the defining variables? (e.g., if defined by genomics, does it show up in morphology or behavior?)
  *Sufficient Answer:* Yes, with statistical significance in an independent dataset.
  *Stop Rule:* If **No**, write **Proposal**. This is a labeling convention, not a discovery.
  *Default:* If information is unavailable, assume **No**. (Conservative default.)

  **Step 2: The Prediction Check (Export)**
  *Question:* Does membership in this group predict variables *not* used to create the group? (e.g., drug response, survival rate, ecological niche.)
  *Sufficient Answer:* Yes, specifically regarding outcomes outside the clustering algorithm.
  *Stop Rule:* If **No**, write **Recut**. This is a pragmatic reorganization of existing data, useful for sorting but not yet explanatory.
  *Default:* If unavailable, assume **No**.

  **Step 3: The Mechanism Check (Causal Structure)**
  *Question:* Is there a proposed causal mechanism that explains *why* the grouping holds? (e.g., a specific gene pathway, a reproductive barrier, a neural circuit.)
  *Sufficient Answer:* Yes, plausible and consistent with the data.
  *Stop Rule:* If **No**, write **Pragmatic Cut**. The category works, but we do not know if it maps to a distinct causal structure in the world.
  *Default:* If unavailable, assume **No**.

  **Step 4: The Consensus Check (Values Handoff)**
  *Question:* Is there agreement on the criteria for this kind of category? (e.g., do all taxonomists agree on what defines a species?)
  *Sufficient Answer:* Yes, or the dispute is purely empirical.
  *Stop Rule:* If **No** (the dispute is theoretical or definitional), **Handoff**. You cannot resolve this with evidence. State the dispute explicitly.
  *Default:* If unavailable, assume **No**.

  **Outcomes:**
  1.  **Proposal/Label:** Fails Step 1.
  2.  **Recut/Pragmatic Cut:** Passes Step 1, fails Step 2 or 3.
  3.  **Discovery:** Passes Steps 1, 2, and 3, and clears Step 4.

  ### Philosophical Status and Your Tests

  You asked which claims are settled. It is **settled** that scientific categories vary in robustness and that utility does not guarantee ontological reality. It is **contested** whether "natural kinds" must be mind-independent. Many philosophers argue categories are always partly constructed by our interests. It is also **contested** whether human sciences (psychiatry) can have natural kinds at all, due to "looping effects" where labeling people changes their behavior.

  Your **Export Test** tracks *inductive potential* (can we guess unknown traits?). Your **Re-identification Test** tracks *robustness* (is this an artifact of one method?). Both are necessary for discovery, but neither is sufficient. A useful fiction can predict (Step 2) without being real (Step 3). A real thing might fail re-identification (Step 1) if our tools are blunt. The procedure adds Step 3 (Mechanism) to bridge the gap between utility and reality, and Step 4 to catch theoretical disputes.

  The procedure will misfire when mechanisms are unknown but real (common in early biology) or when pragmatic cuts are treated as disposable (when they are actually the best we can do). It favors caution.

  ### Case Runs

  **Case 1: Genomic Species Split**
  *Run:* Step 1 (Independence): Genomics only? If no morphological/behavioral difference, **Fail**. Step 4 (Consensus): Taxonomists divided on species concept (lineage vs. isolation). **Handoff**.
  *Verdict:* Do not write "Five new species discovered." Write "Researchers propose splitting the organism into five lineages based on genomic data, though taxonomists disagree on whether this constitutes speciation."
  *Reasoning:* This is a theoretical dispute (Step 4), not just an empirical one. The "discovery" depends on which species concept you adopt.

  **Case 2: Psychiatric Subtype (Inflammatory Markers)**
  *Run:* Step 1 (Independence): Defined by inflammatory markers. Do they cluster on symptoms or brain imaging independently? Often **No** in early studies. Step 2 (Prediction): Do markers predict treatment response? If yes, **Pass**. Step 3 (Mechanism): Is inflammation the cause or a correlate? Usually **Unclear**. Step 4 (Consensus): Advocacy groups want disease status; field is cautious. **Handoff**.
  *Verdict:* The procedure says **Pragmatic Cut/Proposal**. You will not enjoy this because it dampens the headline. The evidence supports a useful grouping, not necessarily a distinct disease entity with a known cause.
  *Writing Advice:* Do not say "Scientists discover new disease." Do not say "It's just a statistical trick."
  *Write this:* "Researchers have identified a subgroup of patients distinguished by inflammatory markers who respond differently to treatment, though clinicians debate whether this constitutes a distinct disease or a variation of the existing diagnosis."
  *Why:* This honors the predictive utility (Step 2) without committing to a causal essence (Step 3) or resolving the values dispute (Step 4). It is honest about the utility without dismissing the patients' experience.

  **Case 3: Category Non-Existence**
  *Run:* If a review argues a category fails Step 1 (no stability) and Step 2 (no prediction), you may print "Does not exist." However, if it fails only Step 3 (no mechanism), print "Fails to carve nature at its joints."
  *Verdict:* Reserve "does not exist" for categories that are actively misleading or have no referent (e.g., phrenology bumps). For most psychological constructs, write "fails to predict outcomes" or "lacks biological validation."
  *Reasoning:* "Does not exist" implies ontological finality. "Fails to predict" implies empirical failure, which is scientifically safer and usually accurate enough for readers.

  ### Summary

  Use the procedure to downgrade "Discovery" to "Proposal" whenever Mechanism (Step 3) or Consensus (Step 4) is missing. This protects you from ontological overreach. When the procedure hands off to values (Step 4), your job is not to decide the science but to report the disagreement. Your readers need to know when a fact is established and when a boundary is being negotiated.
