      *   *Claim 5:* "Once you've solved outer alignment with careful reward design and added corrigibility, you've secured intent..." -> Here's a potential confusion. Outer alignment is about the objective function matching intent. Corrigibility is about allowing correction. Does this *secure* intent? Maybe, but it's a bit hand-wavy.
      *   *Claim 6:* "...the system tracks the revealed intent in the feedback loop without needing to 'care' about morality." -> This touches on instrumental convergence vs. moral realism. Reasonable in the context of intent alignment.
      *   *Claim 7:* "I should also mention inner alignment: that's when the model's internal goals match the specified ones." -> Standard definition (mesa-optimizers).
      *   *Claim 8:* "I think inner alignment actually belongs to value alignment, not intent alignment, because it's about what the model internally 'wants' rather than what it was told to do." -> **Major Conceptual Error.** Inner alignment is typically considered a *subset* or *mechanism* required for intent alignment. If the model's internal goals don't match the specified ones (inner misalignment), it will not do what designers meant (intent misalignment), even if the spec was perfect. Classifying inner alignment as "value alignment" is non-standard and arguably incorrect in the context of the narrow definition literature (e.g., Christiano's "Intent Alignment" usually *includes* solving inner alignment to ensure the system *tries* to do what we want).
      *   *Claim 9:* "So under the narrow view we might actually drop inner alignment, which simplifies things even more." -> **Dangerous Conclusion.** If you drop inner alignment, you haven't solved intent alignment. A mesa-optimizer with a different internal goal will not be intent-aligned. This suggests a fundamental misunderstanding of why the "narrow view" is proposed. The narrow view excludes *normative* value alignment (what *should* we want?), not *mechanistic* inner alignment (does the model *actually* pursue what we specified?).

