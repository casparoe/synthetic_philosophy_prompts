answer: |-
  **Project Title:** The Institutional Norm of Assertion: Epistemic Agency Beyond the Individual

  **Statement of the Question**
  The contemporary debate regarding the norm of assertion—specifically the contest between the Knowledge Norm, the Truth Norm, and the Justification Norm—operates on a tacit premise: that the paradigmatic asserter is an individual speaker uttering a flat, unqualified proposition. This project asks a determinate question: *Does the existence of institutional assertion necessitate a bifurcated norm of assertion that separates procedural warrant from propositional truth, thereby falsifying the claim that knowledge is the necessary and sufficient condition for all assertion?*

  This is not a request for a sociology of newsrooms. It is a challenge to the extensional adequacy of current epistemological theories. If institutional assertions (e.g., published news reports) are genuine assertions, and if they are governed by normative constraints that diverge from the individual knowledge condition, then the Knowledge Norm is not a universal norm of assertion, but merely a norm of *individual* assertion. The project seeks to determine whether the "Knowledge Norm" must be abandoned as a general theory or restricted to a specific subclass of speech acts, and whether a "Procedural Warrant Norm" better captures the epistemic obligations of collective agents.

  **Critique of Existing Positions**
  Current positions in the literature leave this question open because they lack the vocabulary to describe institutional epistemic labor. The Knowledge Norm (assert only what you know) fails when applied to institutional output. A news organization may publish a falsehood based on impeccable sourcing and rigorous verification. Under the Knowledge Norm, this assertion is impermissible because the content is false (and thus not known). Yet, in professional practice, this is often deemed a "clean error," distinct from negligence. The institution is not blamed for the assertion in the way an individual is blamed for guessing. Conversely, the Truth Norm (assert only what is true) cannot account for the criticism leveled at "sloppy truths"—stories that turn out correct but were derived from reckless processes. If truth were the sole norm, the process would be irrelevant.

  The Justification Norm (assert only what you justifiedly believe) comes closer but remains too individualistic. It typically conceives of justification as a mental state accessible to the speaker. Institutions do not have mental states; they have workflows. Furthermore, Pragmatic Encroachment views, which suggest practical stakes shift the epistemic threshold, fail to explain why the *type* of criticism changes based on the error. High stakes might raise the bar for knowledge, but they do not explain why we critique the *chain of testimony* rather than the *belief state* when an institution errs. Existing frameworks treat the "assertion" as a atomic event between a mind and a listener. They cannot parse the temporal and distributed nature of institutional claims, where the "assertion" is the output of a system designed to manage risk over time. Consequently, the debate remains stalled on toy cases that strip away the very machinery—hedging, sourcing, retraction protocols—that governs assertion in the public sphere.

  **Methodology**
  The project employs a mixed-method approach over twelve months, integrating conceptual analysis with empirical reporting. This is not a case of applying philosophy to data, nor of gathering data to illustrate philosophy; the reporting will discipline the conceptual categories, and the concepts will structure the reporting.

  *Months 1–3: Conceptual Mapping and Protocol Design.* I will begin by formalizing the distinction between "content blame" and "process blame" found in my preliminary observations. I will draft a working taxonomy of institutional speech acts (hedged claims, definitive breaks, corrections, retractions). Simultaneously, I will design a structured interview protocol for standards editors and executive producers at three major legacy news organizations. The questions will not ask "what do you do?" but will present philosophical vignettes (e.g., "If a story is true but sourced via a lie, is the assertion valid?") to elicit their normative intuitions.

  *Months 4–6: Fieldwork and Data Collection.* I will conduct the interviews, focusing on the logic of retraction. A key philosophical puzzle is why institutional retraction does not dissolve criticism in the way individual retraction sometimes does. I will also compile a systematic dataset of corrections and editor's notes from a twelve-month cycle of two major publications. I will code these not for error rate, but for the *language of accountability* used (e.g., "we reported" vs. "it was reported," "error" vs. "omission"). This linguistic data serves as evidence for the underlying normative commitments of the institution.

  *Months 7–9: Synthesis and Stress-Testing.* I will return to the conceptual framework to test it against the reporting. If the Knowledge Norm proponents argue that institutions simply "know" via their agents, I will use the interview data to show that editors explicitly disavow knowledge in favor of "confidence levels." I will draft the core arguments, specifically addressing whether the "graded modal vocabulary" of newsrooms constitutes a distinct speech act or a modification of assertion. This phase involves writing the philosophical core while using the reporting to block counterarguments that rely on idealized individual agents.

  *Months 10–12: Drafting and Refinement.* The final three months will be dedicated to producing the residency manuscript. I will circulate drafts to both epistemologists and senior editors to ensure the argument holds in both registers. The goal is a text that does not translate philosophy for journalists, nor journalism for philosophers, but treats the newsroom as a site of epistemic production worthy of direct theoretical engagement.

  *Justification for Method.* A purely armchair argument risks irrelevance, positing norms that no actual agent can follow. A purely quantitative study of error rates misses the normative dimension; knowing *how often* errors occur does not explain *why* they are criticized. This project requires the friction between the two. The reporting provides the counterexamples that break the philosophical models; the philosophy provides the rigor to ensure the reporting yields generalizable claims about assertion rather than anecdotal complaints about media.

  **Successful Result**
  At the conclusion of the residency, I will be in a position to defend a claim I cannot currently substantiate: *That the norm of assertion is agent-relative.* Specifically, I aim to argue that for collective epistemic agents, the norm is not Knowledge but *Procedural Warrant*—a standard satisfied by adherence to reliable truth-tracking processes, independent of the truth value of the specific output or the mental state of the individual utterer.

  Success looks like a manuscript that forces proponents of the Knowledge Norm to either explain away institutional assertion as a derivative, non-literal form of speech (a difficult task given its functional role in public reasoning) or amend their theory to accommodate a dual-factor norm. It will provide a vocabulary for the "two distinct registers" of blame observed in professional practice, moving them from anecdotal observations to defined epistemic categories. The result will not merely describe press practice but will use press practice to constrain epistemological theory.

  **Failure Conditions and Scope**
  This project will fail if the reporting reveals that newsroom norms are merely pragmatic or legalistic rather than epistemic. If editors admit that their hedging and sourcing rules are solely for liability protection or audience management, with no regard for truth-tracking integrity, the argument collapses into media ethics. Additionally, the twelve-month scope poses a risk of overgeneralization. I am focusing on legacy news institutions; if it turns out that their practices are idiosyncratic compared to other knowledge-producing institutions (e.g., intelligence agencies, scientific bodies), the claim that this challenges the general norm of assertion will be weakened. I will mitigate this by keeping the theoretical claims restricted to "public-facing epistemic institutions" rather than asserting a universal theory of all collective assertion, though I will argue that these institutions are the primary locus of public assertion.

  **Anticipating Deflations**
  Two objections are predictable and must be preempted. First, the charge that this project collapses into applied media ethics. To avoid this, I must demonstrate that the stakes are metaphysical and epistemological, not merely professional. The argument is not that journalists *ought* to follow better rules, but that their actual rules reveal the *conditions of possibility* for assertion in a complex information environment. If the norms of the newsroom differ from the Knowledge Norm, and the newsroom is a primary engine of public knowledge, then the Knowledge Norm is descriptively inadequate for public epistemology.

  Second, the charge that this rests on the trivial observation that institutions are not individuals. Philosophers may concede that groups lack minds but insist that group assertion reduces to the assertions of constituent individuals. To avoid this triviality, I must show that institutional assertion is *non-reducible*. The retraction data and the modal vocabulary suggest that the institution asserts things no single individual within it claims to know. The "we" in "we have learned" is not a shorthand for a collection of "I"s. The argumentative work here involves proving that the institutional structure itself acts as the epistemic warrant, meaning the norm governs the *system*, not the *speaker*. If I cannot demonstrate this non-reducibility, the project adds nothing to the existing literature on collective intentionality. The residency will be successful only if I can show that ignoring the institutional nature of modern assertion renders the philosophy of language blind to its primary object of study.
