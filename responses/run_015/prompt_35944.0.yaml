answer: |-
  To articulate the implicit philosophy underpinning the common law's treatment of reproductive torts, one must first disentangle the triad of claims: wrongful conception (negligent sterilisation resulting in a healthy child), wrongful birth (negligent genetic counselling or diagnosis resulting in a disabled child), and wrongful life (the child's own claim that they ought not to have been born). The doctrinal pattern you describe—permitting parental recovery while uniformly rejecting the child's claim—rests upon a specific, albeit often unacknowledged, metaphysical and ethical framework.

  ### The Conception of Harm: Comparative Counterfactuals

  At the heart of the current doctrine lies a **comparative account of harm**. To establish actionable damage in tort, a claimant must demonstrate that they are worse off than they would have been had the negligence not occurred. This is a counterfactual test.

  For the parents, this comparison is straightforward. In wrongful conception and wrongful birth cases, the alternative scenario is one in which the pregnancy was avoided or terminated. In that counterfactual world, the parents retain their financial resources and physical integrity. They are demonstrably worse off in the actual world due to the costs of rearing and medical care. Thus, harm is easily established.

  For the child, however, the comparison collapses. The alternative to 'existing with impairments' is 'not existing at all'. The courts' refusal to entertain wrongful life claims presupposes that one cannot be harmed by being brought into existence unless life is so intolerable that non-existence would be preferable. This relies on the intuition that existence is a prerequisite for having interests, and therefore non-existence cannot be a baseline against which existence is measured to the claimant's detriment.

  ### The Non-Identity Problem and the Person-Affecting Constraint

  Does this pattern presuppose a **person-affecting constraint**? Yes. The person-affecting view holds that an act can be wrong only if it makes some particular person worse off. The courts implicitly adopt this constraint: they seek a victim who is worse off than they otherwise would have been.

  *   **Parents:** They are particular persons who exist in both the actual and counterfactual scenarios. They are worse off financially and physically. The constraint is satisfied.
  *   **Child:** The child exists in the actual scenario but not in the counterfactual. Under a strict person-affecting view, the negligence did not make the child worse off, because there is no alternative state in which *that same child* exists in a better condition (unless one posits a 'healthy version' of the same child, which metaphysics usually denies in conception cases).

  **Is this coherent regarding misdiagnosis?**
  You raise a crucial point regarding misdiagnosis cases (e.g., failure to diagnose rubella *in utero*). In these instances, biological identity is fixed at the time of the negligence; the foetus already exists. One might argue that no non-identity problem arises here because the choice is between *this* child being born disabled or *this* child not being born (via abortion).

  However, the doctrine remains coherent only if we recognise that the **legal counterfactual** still invokes the logic of non-identity. Even if biological identity is fixed, the remedy sought in a wrongful life claim is damages for being born. The comparison remains 'existence with disability' versus 'non-existence'. The person-affecting constraint blocks the claim not because the child is a different entity (as in sterilisation cases), but because the alternative state (non-existence) cannot be 'better for' the child. Therefore, the doctrine is internally coherent: it consistently applies the rule that one cannot claim harm based on a comparison with non-existence, regardless of whether the negligence caused the conception or merely the condition of the gestation.

  ### Requirement versus Compatibility

  It is vital to distinguish what the doctrine strictly *requires* from what it merely *sits well with*.

  1.  **Strict Requirements:**
      *   **The Comparative Baseline:** The law strictly requires a comparator state in which the claimant exists. Since the child cannot exist in the state of non-existence, the claim fails logically.
      *   **Duty of Care:** The law requires a duty of care owed to the claimant. Courts find it easier to locate a duty to the parents (patients) than to the foetus/unborn child, particularly where recognising such a duty might conflict with abortion laws.
      *   **Life as Non-Injury:** The doctrine requires the legal presumption that life, even with impairments, is not a cognisable injury.

  2.  **Merely Compatible (Policy Choices):**
      *   **The Benefits Offset:** In wrongful conception cases, many courts offset rearing costs against the 'benefits of parenthood' (the joy and companionship of the child). This is **not** strictly required by the rejection of wrongful life. One could logically hold that the child cannot sue for wrongful life (due to the comparison problem) while simultaneously holding that the parents' financial loss is not mitigated by emotional joy. The offset is a policy choice to limit liability and affirm the value of family life, not a logical necessity of the person-affecting constraint.
      *   **Sanctity of Life Rhetoric:** Courts often justify the rejection of wrongful life by appealing to the sanctity of life. This is compatible with the outcome but philosophically distinct from the person-affecting constraint. One could reject wrongful life on purely logical grounds (the impossibility of comparison) without invoking the moral weight of life itself.

  ### The Parfitian Shift

  If the courts were to explicitly adopt the Parfitian line—that in non-identity cases, the only coherent wrongs are those done to the parents (or that we must move to impersonal principles)—several doctrinal shifts would follow:

  1.  **Clarification of Standing:** The rejection of wrongful life would no longer rest on the vague assertion that 'life is not a harm', but on the precise philosophical ground that the child is not the victim of a person-affecting wrong. This would harden the bar against wrongful life claims, making them immune to exceptions based on the severity of disability (unless life is deemed 'not worth living', a threshold Parfit acknowledges).
  2.  **Abolition of the Benefits Offset:** This is the most significant practical change. Currently, the offsetting of costs by the benefits of parenthood implies that the child is a 'benefit' that mitigates the tort. If the wrong is framed strictly as a violation of **parental autonomy** (the right to choose whether to reproduce), the emotional value of the child becomes irrelevant to the calculation of damages. The parents' loss is the loss of choice and the financial burden imposed by the breach of duty. Under a strict Parfitian view, which separates the impersonal wrong from the person-affecting harm, the 'joy of the child' should not mitigate the financial damages owed for the negligence. The wrong is to the parents' planning and resources; the child's existence is the mechanism of the harm, not a compensation for it.
  3.  **Focus on Autonomy:** The doctrine would shift from a focus on 'harm' (which gets tangled in metaphysics) to a focus on 'rights' and 'autonomy'. The parents recover because their right to control their reproductive capacity was violated, not merely because they are financially poorer. This aligns with the Parfitian insight that the moral significance lies in the violation of the parents' legitimate expectations, rather than the comparative welfare of the child.

  In summary, the current common-law pattern presupposes a comparative, person-affecting view of harm which renders the child's claim logically incoherent while permitting parental recovery. It is coherent even in misdiagnosis cases because the legal comparison remains one of existence versus non-existence. However, the doctrine conflates this logical necessity with policy choices, such as the benefits offset. Adopting a rigorous Parfitian framework would likely retain the rejection of wrongful life but would purify the parental claim, removing the requirement to weigh the child's life as a mitigating benefit against the financial costs of the negligence.
