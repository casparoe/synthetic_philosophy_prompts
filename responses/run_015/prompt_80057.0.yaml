answer: |-
  You are not overthinking this; you have put your finger on the precise philosophical fault line that runs through modern penal theory. Your editor may see a practical workflow, but you are seeing a metaphysical tension. To understand whether the punitive fallback betrays the restorative project, we must first clarify what restorative justice (RJ) assumes about the nature of blame itself, particularly through the lens of P.F. Strawson.

  Strawson, in *Freedom and Resentment*, argues that moral responsibility is not a metaphysical fact about the universe but a feature of our interpersonal relationships. When we hold someone responsible, we are adopting the 'participant stance'. We feel reactive attitudes—resentment, gratitude, indignation—because we expect certain good will from others as moral agents. To blame someone is to issue a moral demand. Crucially, this demand presupposes that the other party is capable of understanding and responding to it. If someone is incapable of such response (due to insanity or extreme coercion), we shift to an 'objective attitude', treating them as a subject to be managed or cured rather than a partner in dialogue.

  Restorative justice strictly presupposes a **communicative theory of responsibility**. It operates on the belief that blame is fundamentally a demand for recognition. When an offender harms a victim, they violate a normative expectation. The 'repair' is not merely material compensation; it is the restoration of the moral relationship. The offender must acknowledge the validity of the victim's demand. Therefore, RJ presupposes that responsibility is something that must be *taken* by the agent, not merely *assigned* by an authority. Without the offender's voluntary participation in this moral dialogue, the restorative process cannot achieve its primary end: the reintegration of the offender into the moral community through their own agency.

  This brings us to the punitive fallback. When an offender refuses to engage, the system reverts to standard sentencing. Here, punishment is imposed regardless of the offender's internal state. This looks like a contradiction. If blame is truly an interpersonal demand that requires acknowledgement to be satisfied, then punishing someone who refuses to acknowledge that demand is futile—it is like shouting at a wall and then locking it up for not shouting back. It suggests that the system ultimately views blame not as a dialogue, but as a liability—a debt owed to the state that must be collected coercively.

  However, characterising this as a pure contradiction might be too uncharitable. It is more accurate to view the punitive fallback as a **pragmatic safety valve** that reveals the system is hybrid rather than pure. Restorative justice proponents generally accept that while the participant stance is the ideal, the community must protect itself when moral dialogue breaks down. If an offender refuses to engage, they are effectively rejecting the participant stance themselves. In Strawsonian terms, they are forcing the community to adopt a more objective stance towards them for the sake of social order. The fallback does not necessarily betray the restorative view; rather, it acknowledges its limits. It says: 'We invite you to be a moral agent with us; if you refuse, we will treat you as a risk to be managed.'

  The tension arises only if one claims that punitive punishment is *morally equivalent* to restorative repair. It is not. The fallback admits that when the moral demand cannot be met voluntarily, the state will enforce compliance coercively. This is consistent with a unified theory of responsibility only if that theory allows for a hierarchy: communicative responsibility is primary, but coercive liability is the secondary enforcement mechanism when the primary fails. If you insist on a pure communicative theory, the fallback is indeed a betrayal, because it imposes suffering without moral resolution. But if you accept a pluralistic theory of responsibility, the two branches can coexist: one aims for moral reconciliation, the other for normative enforcement.

  Consider your final question: what if the presupposed view is wrong? What if blame really is just a debt to be imposed, regardless of attitude? If this retributive or liability model were the truth, restorative conferences would need to change fundamentally. The voluntary nature of the process would vanish. There would be no need for the offender to 'find their voice' or offer a genuine apology; they would simply need to discharge the debt. The facilitator would become an assessor of damages, not a mediator of relationships. The victim's need for acknowledgement would be secondary to the ledger being balanced. The conference would cease to be a space for moral growth and would become merely a non-custodial sentencing hearing. The 'restoration' would be of the social order's equilibrium, not the interpersonal relationship.

  Your intuition is correct: the practice hangs on a specific, fragile view of human agency. It assumes we are creatures who can be reasoned with, not just managed. The punitive fallback is the shadow cast by the possibility that we sometimes cannot be.

