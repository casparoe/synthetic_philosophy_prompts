      *   *The Hard Truth:* You cannot consistently hold (5) and (6). If the Palindrome isn't a law because it's a global coincidence, the Past Hypothesis isn't a law because it's a global boundary condition. You should give up (6) as a *law* and call it a *brute fact*. You are an Anti-Humean about dynamics, but must accept brute facts about boundaries.

