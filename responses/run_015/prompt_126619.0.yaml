answer: |-
  **Exam Question: Anthropics and Aggregation**

  **Time Allowed:** 3 Hours
  **Instructions:** Answer the following question. All necessary definitions are provided within the question text. No external citations are required or permitted.

  **Question 1**

  Consider a set of mutually exclusive and exhaustive cosmological hypotheses $\{T_i\}$. Let $p_i$ be the non-indexical prior probability of $T_i$. Let $N_i$ be the number of observers in the reference class under $T_i$. Assume that under every $T_i$, at least one observer exists.

  We define two approaches to updating on the indexical evidence "I exist":
  1.  **SSA (Self-Sampling Assumption):** The agent updates probabilities such that $P_{SSA}(T_i) = p_i$. (Observer counts do not affect credences).
  2.  **SIA (Self-Indication Assumption):** The agent updates probabilities such that $P_{SIA}(T_i) = \frac{p_i N_i}{\sum_j p_j N_j}$. (Credences are weighted by observer counts).

  Let $U_i$ denote the **total welfare** of all observers under $T_i$. Consequently, the **average welfare** per observer under $T_i$ is $A_i = U_i / N_i$.

  Consider an agent choosing between actions. In **Scenario A**, the number of observers $N_i$ is fixed regardless of the action taken. In **Scenario B**, the number of observers $N_i$ depends on the action taken.

  (a) Show formally that in **Scenario A** (fixed $N_i$), an agent using SSA who maximizes Expected Total Welfare ($\sum P_{SSA}(T_i) U_i$) ranks actions identically to an agent using SIA who maximizes Expected Average Welfare ($\sum P_{SIA}(T_i) A_i$).

  (b) Now consider **Scenario B**. Let $T_1$ and $T_2$ have equal priors ($p_1=p_2=0.5$).
  *   Under $T_1$: $10^6$ observers exist at welfare 100 each.
  *   Under $T_2$: $10^{12}$ observers exist at welfare 100 each.
  *   **Policy X:** If $T_1$ is true, create an additional $10^{12}$ observers at welfare 1 each. If $T_2$ is true, nothing changes.

  Calculate the Expected Total Welfare (SSA) and Expected Average Welfare (SIA) both with and without Policy X. Determine whether each package accepts or rejects the policy. Explain precisely why the equivalence from part (a) breaks down here, focusing on the role of $N_i$ in the probability function versus the welfare function.

  (c) Given the result in (b), is the dispute between SSA and SIA merely verbal or pragmatic? Discuss whether the equivalence holds if the agent is risk-averse regarding welfare distribution or if the reference class is restricted to "observer-moments." What specific incentive structure does the SIA-plus-Average package introduce in Scenario B that the SSA-plus-Total package does not?

  ***

  **Model Answer**

  **(a) The Equivalence Derivation**
  In Scenario A, observer numbers $N_i$ are independent of the action chosen.
  The SSA agent maximizes Expected Total Welfare ($E_{SSA}[U]$):
  $$E_{SSA}[U] = \sum_i P_{SSA}(T_i) U_i = \sum_i p_i U_i$$
  The SIA agent maximizes Expected Average Welfare ($E_{SIA}[A]$):
  $$E_{SIA}[A] = \sum_i P_{SIA}(T_i) A_i = \sum_i \left( \frac{p_i N_i}{W} \right) \left( \frac{U_i}{N_i} \right)$$
  where $W = \sum_j p_j N_j$ is the normalization constant for SIA credences.
  Simplifying the SIA expression:
  $$E_{SIA}[A] = \frac{1}{W} \sum_i p_i U_i$$
  Since $N_i$ is fixed across actions in Scenario A, $W$ is constant regardless of the action evaluated. Therefore, $E_{SIA}[A]$ is proportional to $E_{SSA}[U]$ by a positive constant factor $1/W$. Maximizing one quantity necessarily maximizes the other. The two packages induce identical action rankings; the difference is purely notational, shifting the weight $N_i$ from the probability term (SIA) to the utility term (SSA).

  **(b) The Breakdown (Scenario B)**
  **Without Policy X:**
  $N_1 = 10^6, U_1 = 10^8$. $N_2 = 10^{12}, U_2 = 10^{14}$.
  *SSA (Total):* $0.5(10^8) + 0.5(10^{14}) \approx 5 \times 10^{13}$.
  *SIA (Average):* $W = 0.5(10^6) + 0.5(10^{12}) \approx 5 \times 10^{11}$.
  Credences: $P(T_1) \approx 0, P(T_2) \approx 1$.
  Exp Avg Welfare: $\approx 100$.

  **With Policy X:**
  $T_2$ is unchanged. $T_1$ now has $N_1' = 10^6 + 10^{12} \approx 10^{12}$ observers.
  Total Welfare $T_1$: $U_1' = 10^8 + 10^{12}(1) \approx 10^{12}$.
  *SSA (Total):* $0.5(10^{12}) + 0.5(10^{14}) \approx 5.05 \times 10^{13}$.
  Change: $+5 \times 10^{11}$. **SSA accepts Policy X.**
  *SIA (Average):* New $W' = 0.5(10^{12}) + 0.5(10^{12}) = 10^{12}$.
  New Credences: $P(T_1) = \frac{0.5 \times 10^{12}}{10^{12}} = 0.5$. $P(T_2) = 0.5$.
  New Avg Welfare $T_1$: $A_1' = 10^{12} / 10^{12} = 1$.
  Exp Avg Welfare: $0.5(1) + 0.5(100) = 50.5$.
  Change: $100 \to 50.5$. **SIA rejects Policy X.**

  **Explanation of Divergence:**
  The equivalence breaks because $W$ is no longer constant across actions. In Scenario B, the policy changes $N_1$, which changes the SIA normalization constant $W$ and, crucially, shifts SIA credences toward $T_1$. Under SIA, creating observers increases the probability that you are in the world where they were created. This creates a feedback loop: the $N_i$ term appears in the credence update *and* in the denominator of the average welfare. The SSA package counts the new welfare once (in $U_i$). The SIA package counts the new observers twice: once to boost the probability of $T_1$, and again to dilute the average welfare of $T_1$. The "bookkeeping" symmetry is destroyed when actions alter the reference class size.

  **(c) Philosophical Implications**
  The equivalence in Scenario A suggests the dispute is pragmatic or notational regarding *fixed* populations. However, Scenario B reveals substantive disagreement on population ethics. The SIA-plus-Average package introduces a "dilution pressure": it penalizes adding low-welfare lives not just because they lower the average, but because their existence makes it more likely you are in that low-average world. SSA-plus-Total treats adding lives as a pure welfare gain if welfare is positive.

  The dispute is not merely verbal because it yields different prescriptions when $N$ is action-dependent. Furthermore, the equivalence relies on linear aggregation. If the agent is risk-averse regarding average welfare, or employs a prioritarian transformation (weighting worse-off observers more heavily), the mathematical cancellation in part (a) fails even in Scenario A. Finally, if the reference class shifts to "observer-moments" (SSSA), $N_i$ becomes duration-weighted. If actions affect duration rather than headcount, the SIA/SSA divergence re-emerges under different parameters. Thus, while the packages can be tuned to match in restricted cases, they embody fundamentally different attitudes toward the moral significance of existence probabilities versus welfare sums.

  ***

  **Marking Scheme (25 Marks)**

  **Part 1: Formal Derivation (5 Marks)**
  *   **2 Marks:** Correctly states SSA Expected Total Welfare formula ($\sum p_i U_i$).
  *   **2 Marks:** Correctly states SIA Expected Average Welfare formula and simplifies to $\frac{1}{W} \sum p_i U_i$.
  *   **1 Mark:** Explicitly notes that $W$ is constant across actions in Scenario A, establishing identical rankings.
      *   *Mistake Note:* Deduct 2 marks if the student fails to cancel $N_i$ in the SIA term ($P \times A$).

  **Part 2: Scenario B Calculation (10 Marks)**
  *   **3 Marks:** Correct calculation of SSA values (Accepts Policy, Gain $\approx 5 \times 10^{11}$).
  *   **3 Marks:** Correct calculation of SIA credences with Policy ($P(T_1)$ shifts to 0.5).
  *   **2 Marks:** Correct calculation of SIA Expected Average Welfare (Drops from 100 to $\approx 50$).
  *   **2 Marks:** Correct verdict (SSA Accepts, SIA Rejects).
      *   *Mistake Note:* Deduct 3 marks if the student uses Total Welfare for the SIA agent (violating the prompt's package definition).

  **Part 3: Explanation of Divergence (5 Marks)**
  *   **3 Marks:** Identifies that $N_i$ becomes action-dependent, making $W$ variable.
  *   **2 Marks:** Explains the "double counting" mechanism: SIA boosts credence in $T_1$ due to new observers while simultaneously lowering $T_1$' average score.
      *   *Mistake Note:* Deduct 2 marks if the explanation relies solely on "SIA likes big worlds" without referencing the action-dependence of the normalization constant.

  **Part 4: Implications and Caveats (5 Marks)**
  *   **2 Marks:** Discusses the "dilution pressure" or incentive incompatibility in Scenario B.
  *   **1 Mark:** Addresses the verbal/pragmatic distinction (substantive in Scenario B).
  *   **2 Marks (Distinction):** Identifies a qualification where equivalence fails even in Scenario A (e.g., non-linear utility, risk aversion, or prioritarianism).
      *   *Mistake Note:* Deduct 2 marks if the student claims the dispute is *purely* verbal without qualifying the action-dependence caveat.
      *   **A-Grade Requirement:** To score above 20/25, the answer **must** secure the 2 Marks in the "Distinction" category (identifying the non-linear/risk caveat). A paper that performs perfect calculations but treats the equivalence as universal without qualification is capped at 20/25 (B+).

  **Total:** 25 Marks.
