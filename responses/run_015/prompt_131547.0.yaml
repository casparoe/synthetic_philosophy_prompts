answer: |-
  ### Brainstorming Candidate Concepts

  Here is the list of concepts I generated when analyzing your description, along with my initial verdict on their fit.

  1.  **Endogeneity (Econometrics/Statistics):** The statistical condition where an explanatory variable is correlated with the error term. In your case, the denominator (population) is correlated with the numerator (violence) not by chance but by causal structure.
      *   *Verdict:* Statistically accurate, but philosophically thin. It treats the problem as a technical nuisance to be solved (e.g., via instrumental variables) rather than a conceptual limit on what the index *means*.
  2.  **Construct Validity (Psychometrics/Measurement Theory):** The degree to which a test measures what it claims to measure. If the denominator shifts, the construct ("violent society") is not being validly tracked.
      *   *Verdict:* Gets the epistemic stakes right, but too broad. It doesn't specify *why* validity is lost (the denominator mechanism).
  3.  **The Reference Class Problem (Philosophy of Probability):** The problem that an event's probability changes depending on how you classify the event (the reference class).
      *   *Verdict:* Adjacent. But the classical problem is about *which* class to choose among many fixed ones. Your problem is that the class *itself changes size/shape* due to the event.
  4.  **Reactivity (Social Science Methodology):** When the act of measurement changes the phenomenon being measured.
      *   *Verdict:* Close, but usually implies the *observer* causes the change (Hawthorne effect). Your case is the *phenomenon* causing the change in the measurement frame, independent of observation.
  5.  **Selection Bias / Endogenous Selection (Causal Inference):** Bias introduced when the sample is not random, specifically when selection into the sample is caused by the outcome.
      *   *Verdict:* Very close. "Endogenous selection" captures the causal loop. However, it is usually framed regarding *samples* drawn from a *fixed population*. You are describing the *population definition* itself being fluid.
  6.  **Ontological Politics (Science & Technology Studies):** The idea that realities are enacted by practices; different methods produce different "worlds."
      *   *Verdict:* Captures the moral/political weight of the frame, but risks being too post-modern for your request for a "fact of the matter." It denies the empirical remainder you are looking for.
  7.  **Metric Invariance (Measurement Theory):** The requirement that a measure operates the same way across different groups or times.
      *   *Verdict:* Useful. Your index lacks invariance because the "ruler" (the denominator) stretches or shrinks with the object being measured.

  ### Concept Analysis Table

  | Candidate Concept | What it Gets Right | Precisely Where it Comes Apart | Keep or Discard |
  | :--- | :--- | :--- | :--- |
  | **Endogeneity** | Identifies the causal coupling between the variable (violence) and the parameter (population). | Purely statistical. Does not address the *meaning* of the rate or the normative weight of the frame. Treats it as a calculation error, not a conceptual one. | **Discard** (as the primary label) |
  | **Construct Validity** | Correctly identifies that the index no longer tracks the intended theoretical quantity. | Too generic. A scale can lack validity for many reasons (bias, noise). It doesn't name the specific *denominator mechanism* you described. | **Discard** |
  | **Reference Class Problem** | Highlights that rates depend on how we carve the population. | Assumes the classes are available options. Your case is that the class is *mutable* and *causally responsive*, not just a choice among static options. | **Keep as Adjacent** |
  | **Reactivity** | Acknowledges feedback between phenomenon and measure. | Implies the *measurement act* causes the change. In your archaeological and geopolitical cases, the change happens regardless of whether anyone is measuring it. | **Discard** |
  | **Endogenous Selection Bias** | Captures the "selection into the sample is caused by the outcome" logic (e.g., burial practices). | Usually applies to *sampling* from a population. Your problem is deeper: the *population at risk* is the thing being reshaped. | **Keep as Technical Core** |
  | **Ontological Politics** | Captures the moral/political weight of defining the frame (who counts?). | Often implies there is *no* fact of the matter once frames differ. You want to know if there *is* a fact once the frame is fixed. | **Keep as Context** |
  | **Metric Invariance** | Identifies that the relationship between index and quantity is not stable over time. | Technical term for the symptom, not the cause. Doesn't explain *why* invariance failed (the constitutive link). | **Discard** |

  ### Part 1: Is there an established concept?

  **The Short Answer:** No. There is no single established philosophical term that captures the specific configuration you have identified.

  **The Nuanced Answer:** You have correctly identified that existing terms cover only slices of the problem.
  1.  **For the General Configuration:** The nearest technical term is **Endogenous Selection Bias** (or *Endogenous Stratification*). In causal inference, this describes a situation where membership in the population or sample is determined by the outcome variable (or a collider influenced by it). However, philosophers of science usually treat this as a statistical error to be corrected, whereas you are treating it as a structural limit on the *interpretability* of the rate.
  2.  **For the Specific "Wrong Way" Movement:** There is no standard philosophical term for an index that moves inversely to the quantity due to denominator coupling. In your field, you have *Hyperstability* (index high, stock low) and *Hyperdepletion* (index low, stock high). In the violence debate, the analogue is **Index Inversion**. When the denominator expands *because* of the violence (e.g., conquest incorporating more people), the rate drops even as absolute violence rises. This is a specific subtype of endogeneity where the coupling is strong enough to reverse the sign of the trend.

  **Why the existing vocabulary fails:**
  Standard measurement theory assumes a "stable world" assumption: the object being measured exists independently of the metric. Goodhart's Law assumes a "strategic agent" assumption: people change behavior because they know the metric. Your case is neither. It is a **Constitutive Assumption**: the definition of the population (the denominator) is partially constituted by the historical processes (violence/conquest/burial) that generate the numerator. The "counting frame" is not a passive container; it is a dynamic product of the system.

  **The Coined Term:**
  Since no existing term is sharp enough, I propose we name this **Constitutive Denominator Bias**.

  *   **Definition:** A measurement failure occurring when the reference class (denominator) of a rate or proportion is causally influenced by the phenomenon (numerator) the rate is intended to track, such that the index loses monotonicity with the underlying quantity.
  *   **Sharp Contrast Case:** *Standard Sampling Bias.* In standard bias, the population is fixed (e.g., all fish in the sea), but our net catches only the big ones. We can correct this if we know the selection mechanism. In Constitutive Denominator Bias, the "population" itself (e.g., "the peaceful state") changes its boundaries *because* of the fishing (violence). You cannot correct it by re-weighting the sample because the "universe" is shifting under the math.
  *   **Boundary Case 1 (Should Count):** Your archaeological example. The "population at risk" is estimated from burial sites. If violence changes burial practices (e.g., leaving enemies unburied), the denominator shrinks *because* of violence. The rate of trauma/skeleton rises even if absolute violence is constant. This is Constitutive Denominator Bias.
  *   **Boundary Case 2 (Should Not Count):** *GDP per Capita with Migration.* If a country's GDP falls, and people emigrate for economic reasons, the population (denominator) shrinks. GDP per capita might stay stable. This looks similar. However, if "population" is defined legally (citizens), the denominator is fixed regardless of where they live. If defined residually (who is here), it is bias. The distinction: Is the *definition of the unit of analysis* itself being altered by the process? If the unit is "citizens," no bias. If the unit is "residents," and residency is determined by the economy, then yes, it counts. The key is whether the *concept* being measured (e.g., "Peace of the State") inherently relies on a boundary that the phenomenon violates.

  ### Part 2: Is there a fact of the matter?

  You asked: *Once a population at risk and a counting frame have been fixed well enough for the trend claim to be well posed, is there a fact of the matter about whether violence has declined — or does the choice of frame already carry the moral and political weight?*

  **1. The Empirical Remainder (The Fact of the Matter)**
  Yes, there is a fact of the matter, *conditional on the frame*.
  Once you stipulate: "We are counting violent deaths per 100,000 humans living within borders X, Y, Z during time T," the question becomes purely empirical. The bones are either there or they are not; the records exist or they do not. If two scientists agree on the frame and the measurement protocol, and they still disagree on the trend, one of them is making a calculation error or ignoring data. There is a mind-independent reality to the counts within the stipulated bounds.

  **2. The Normative Weight (The Choice of Frame)**
  However, the choice of frame *does* carry the moral and political weight, and this is where the "fact of the matter" stops doing the work you want it to do.
  In the violence debate, the stakes are not "What is the number?" The stakes are "Are we living in a better moral world than our ancestors?"
  *   **The Verbal Dispute:** When a defender says "Violence has declined" (using a core-state per-capita rate) and a critic says "Violence has not declined" (using absolute global counts including colonies), they are often treating "Violence" as a natural kind (like "gold" or "water") that has one true measure. It is not. "Violence" in this context is a *social kind*. Its extension depends on moral boundaries (who counts as one of us? whose death matters?).
  *   **The Empirical Remainder:** What remains genuinely empirical is the *internal consistency* of the claim. "Given frame A, did the rate drop?" is empirical. "Does frame A capture the morally relevant suffering?" is not.

  **3. The Synthesis**
  The debate looks empirical because both sides use numbers. But it is partly verbal because the word "decline" smuggles in a moral claim ("The world is safer/better") that depends on the frame.
  *   If you mean "Is the risk of a random individual *within the current state system* being violently killed lower?" -> **Empirical Fact.** (Likely yes).
  *   If you mean "Is the total amount of violent suffering inflicted by human societies lower?" -> **Depends on Frame.** (If the frame excludes colonies, the fact is hidden).

  **Conclusion for your purpose:**
  You are right to feel that your colleagues in the violence debate are talking past each other. They are treating a **Constitutive Denominator Bias** as a data quality issue. It is not a data quality issue; it is a *model specification* issue.
  *   **The Fix:** You cannot solve this with "better data." You solve it by explicitly modeling the denominator as a variable, not a constant.
  *   **The Philosophical Upshot:** There is a fact of the matter about the *rate*, but there is no fact of the matter about the *significance* of that rate without a moral justification for the denominator. The "fact of the matter" exists only *inside* a chosen ontology. When the ontology (the counting frame) is endogenous to the history, the "fact" is unstable.

  **Summary Definition for your notes:**
  **Constitutive Denominator Bias:** A measurement failure where the reference class (denominator) is causally shaped by the phenomenon (numerator), causing the index to decouple from or invert the trend of the underlying quantity. Unlike selection bias, the population itself is mutable. Unlike Goodhart's Law, the mechanism does not require agent awareness of the metric.
