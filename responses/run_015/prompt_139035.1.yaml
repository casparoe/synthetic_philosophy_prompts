answer: |-
  You should reject the premise in step (6) that haecceitism is unacceptable, because preserving origin essentialism requires accepting that numerical identity is a brute fact not grounded in qualitative similarity.

  Step (6) looks safe because human intuition conflates numerical identity with qualitative similarity; we assume that if two organisms are indistinguishable in experience, biology, and psychology, they must be the same person. However, metaphysics distinguishes between *who* you are (numerical identity) and *what* you are like (qualitative properties). Origin essentialism claims that your identity is anchored to a specific historical event (the fertilization involving specific gametes), not to the resulting qualitative profile. If you accept this, then step (5b) is not a bug but a feature: it asserts that existence is not a matter of degree. The price you pay is haecceitism, the view that there are primitive facts about "this-ness" that do not reduce to qualitative properties. This is metaphysically coherent even if it feels arbitrary, because identity is the precondition for having properties, not a result of them.

  Regarding the specific theories you mentioned, counterpart theory avoids this dilemma by rejecting step (1) entirely. David Lewis argues that you are world-bound and do not exist in other possible worlds; instead, there are counterparts who resemble you. The cost here is high for your purposes: it means strictly speaking, you could not have had different parents because *you* would not exist in that scenario, only a counterpart would. This dissolves the necessity of origin but sacrifices the literal truth of claims like "I could have been a lawyer." Four-dimensionalism treats you as a spacetime worm extended across time. While it helps with persistence through time, it does not solve transworld identity on its own; it usually pairs with counterpart theory, incurring the same cost of denying literal transworld identity.

  The reason steps (3) through (5) felt unbreakable is that they leverage the Sorites paradox, which exploits the vagueness of our concepts. Step (3) looked safe because modern biology reduces organismal traits to genetics, tempting us to equate the genome with the origin. However, origin essentialism is about the causal history of particular objects (the gametes), not just their informational content. Even if you reject (3) and focus on the gametes as particulars, you still face a Sorites series regarding the matter constituting the gametes. Ultimately, to keep step (1), you must accept that there is a sharp, albeit unknowable, boundary where identity ceases, or accept that identity is brute. Since you prefer keeping (1), you must absorb the cost of (5b):承认 that whether "you" exist can turn on a difference that makes no qualitative difference, because existence is not a qualitative property.
