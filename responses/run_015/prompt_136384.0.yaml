answer: |-
  You haven't written yourself into a corner; you've written yourself into the actual debate that occupies the philosophy of biology. The reason your draft reads like a Wikipedia page is that your characters are arguing about *definitions*, when they should be arguing about *consequences*. A species concept isn't a discovery; it's a tool. Different tools break on different materials.

  Here is the requirements list for a functional species concept, mapped to your three jobs, with the underlying justifications and the constraints your alien biosphere imposes.

  ### The Requirements List

  **1. Operational Diagnosability**
  *   **The Case:** If you cannot identify a specimen as belonging to a unit without sequencing its entire genome or observing its entire life cycle, the concept is useless for regulation or fieldwork.
  *   **Source:** Field Naturalist (Primary), Lawyers (Secondary).
  *   **Status:** **Non-negotiable.** A concept that cannot be applied is not a concept; it is a theory.
  *   **Biosphere Conflict:** Polyphenism (diet/temperature switching) means morphology doesn't match genome. The handheld sequencer gives conflicting trees (virus shuttle). Diagnosis is currently impossible without omniscience.

  **2. Inductive Predictivity**
  *   **The Case:** Assigning an organism to a unit must tell you something unknown about it (e.g., toxicity, resilience, reproductive rate). If membership conveys no information beyond "this is what it looks like," the classification has no scientific utility.
  *   **Source:** Mining Scientist.
  *   **Status:** **Non-negotiable.** The purpose of the conservation law is to prevent harm; if the categories don't predict harm, the law fails.
  *   **Biosphere Conflict:** Horizontal gene transfer (virus shuttle) means physiological traits move independently of lineage. Knowing the "species" may not predict the chemistry.

  **3. Stable Discreteness**
  *   **The Case:** Legal personhood or protection requires boundaries that do not shift during the litigation process. The list of protected kinds must be finite and distinct, not a gradient.
  *   **Source:** Lawyers.
  *   **Status:** **Non-negotiable (for Law), Preference (for Science).** Biology accepts gradients; courts do not.
  *   **Biosphere Conflict:** The "stable swarm" of intermediates is a biological continuum. Drawing a line through the swarm is arbitrary, making the "stability" legally vulnerable to challenge as capricious.

  **4. Genealogical Cohesion**
  *   **The Case:** Members of a kind should share a common history that explains why they are similar. This prevents grouping things that look alike due to convergence (mimicry).
  *   **Source:** Evolutionary Biologists (Phylogenetic School).
  *   **Status:** **School Preference.** Essential for understanding history, irrelevant for regulating mining unless history predicts future behavior.
  *   **Biosphere Conflict:** Fusion across phyla and multiple origins of life mean there is no single tree. Gene trees disagree. Cohesion is mathematically impossible here.

  **5. Ecological Distinctness**
  *   **The Case:** A "kind" should occupy a specific role or niche. If two groups do the exact same thing in the ecosystem, splitting them is philosophically wasteful.
  *   **Source:** Ecologists / Mining Scientist.
  *   **Status:** **School Preference.** High utility for conservation, low utility for counting.
  *   **Biosphere Conflict:** The fused organisms (mat + grazer) occupy *two* niches simultaneously or switch between them. The "swarm" occupies a niche that the "pure" forms do not.

  ---

  ### Terran Parochialism vs. Universal Needs

  **Terran Parochialism (Discard These):**
  *   **Reproductive Isolation:** Assuming species are defined by who *can't* mate with whom. Your aliens fuse across phyla; isolation is the exception, not the rule.
  *   **Bifurcating History:** Assuming a single "Tree of Life." Your virus shuttles and fusion events create a network (rhizome), not a tree. Requiring monophyly is requiring Earth physics.
  *   **Morphological Constancy:** Assuming one genome = one look. Your polyphenism breaks this.
  *   **Single Origin:** Assuming all life shares a common ancestor. Your multiple origins break this.

  **Universal Needs (Keep These):**
  *   **Predictivity:** Any intelligence anywhere needs to know if an organism will poison them or eat their equipment.
  *   **Operationality:** Any intelligence with limited sensors needs to make a decision in finite time.
  *   **Stability (for Law):** Any regulatory framework requires fixed referents. This is a sociological universal, not a biological one.

  ---

  ### The Incompatible Requirements (The Gift)

  You asked which two requirements cannot be had together. In this biosphere, **Stable Discreteness** (Lawyers) and **Inductive Predictivity** (Mining Scientist) are mutually exclusive.

  *   **Why:** To satisfy the Lawyers, you must draw a hard line through the "stable swarm" of intermediates to create countable units. But the biological reality is that the *swarm itself* is the functional unit. The intermediates are the ecologically dominant form.
  *   **The Consequence:** If you split the swarm into Species A and Species B to satisfy the Law, you destroy the Predictivity. An organism identified as "Species A" might behave like the swarm (resilient) or like the pure form (fragile), because the boundary you drew is biologically fake.
  *   **The Conflict:** The Mining Scientist needs the concept to reflect *causal reality* (how the organism acts). The Lawyers need the concept to reflect *administrative reality* (how the form is filed). Your biosphere makes these two realities diverge.

  **Can every non-negotiable requirement be met at once?**
  **No.** You cannot have Operational Diagnosability, Inductive Predictivity, and Stable Discreteness simultaneously in a networked, polyphenic biosphere. You must sacrifice one.
  *   Sacrifice Discreteness? The law collapses (no countable units).
  *   Sacrifice Predictivity? The mining permit is dangerous (science is lying about risk).
  *   Sacrifice Operationality? The field naturalist can't do her job (needs a lab the size of a city).

  ---

  ### How Many vs. Which Kind

  These are distinct problems, and settling one does **not** settle the other.

  *   **Which Kind (Classification):** This is diagnosis. "Does this individual belong to Group X?" This relies on *markers* (morphology, genes). In your biosphere, this is hard (polyphenism) but solvable with thresholds.
  *   **How Many (Delimitation):** This is ontology. "Are Group X and Group Y actually one thing or two?" This relies on *boundaries*.
  *   **The Trap:** Your characters can agree perfectly on how to identify an individual (settling "Which Kind") but still violently disagree on whether those identified groups count as one species or ten (the "How Many" legal question). This is where your scene lives. The naturalist can say, "I can ID them," while the lawyer says, "I can't count them."

  ---

  ### Concept Scorecard

  *   **Biological (Interbreeding):** Dead on arrival; no sexes, fusion is promiscuous.
  *   **Morphological (Look-alike):** Useless; diet switches body plans, one genome makes four looks.
  *   **Phylogenetic (Family-tree):** Impossible; gene trees disagree, no single tree exists.
  *   **Ecological (Niche):** Best fit for science, but legally uncountable (niches blend).
  *   **Genotypic Cluster:** Fails; the "stable swarm" fills the gaps between clusters.

  \answer{Fixed boundaries for fluid populations | No}
