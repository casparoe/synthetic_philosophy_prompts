      *   *Claim 5 (Timeline as Fabrication):* False/Self-undermining. Does it support re-dating? It's the conclusion, not the bridge. It requires assuming the conclusion to prove the conclusion.

  5.  **Refining the "Work" Test (The Crucial Step):**
