          *   Explain the dilemma: If points are real, the shift changes reality. If equations don't predict which one, it's indeterministic.
      *   **The Crux: Indeterminism or Gauge?**
          *   This is the user's main confusion.
          *   Explain that physicists generally view the two mathematical models as representing the *same* physical state.
          *   Analogy: Coordinate systems or gauge potentials in electromagnetism.
          *   Verdict: GR is deterministic *physically*, but the mathematical description has redundancy (gauge).
      *   **Implications for Ontology:**
          *   Does this kill substantivalism? Not necessarily.
          *   *Manifold Substantivalism* is dead (points don't have haecceity/individual identity).
          *   *Sophisticated Substantivalism* survives (spacetime is real, but point identity is structural).
          *   Relationalism is also viable (structural realism).
      *   **Advice for the Piece:**
