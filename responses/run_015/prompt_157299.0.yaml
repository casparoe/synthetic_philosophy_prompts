answer: |-
  Dear Colleague,

  Your choice of the quartz crystal is excellent and will carry the hour precisely because it isolates the metaphysical problem from the mereological and psychological distractions that plague the stock examples. A burning candle loses matter, which invites confusion about whether persistence requires the same stuff; the ship of Theseus invites debates about replacement thresholds rather than intrinsic change; a person invites psychological continuity theories that muddy the ontological waters; and a symphony is an abstract type or event, not a concrete particular with clear spatial boundaries. Your crystal has fixed boundaries, no matter exchange, and a sharp change in intrinsic properties like symmetry and density at the phase transition. This example must have a clear spatiotemporal path and a change in a property that belongs to the object itself rather than its relations, and it must lack any ambiguity about parts being swapped or matter being lost. It will serve you well from start to finish, though you might reserve the ship example for the final five minutes as a stress test to see if they can apply the distinction to a case involving parts, but do not introduce it until then.

  You should begin by drawing the sealed capsule on the blackboard with a time axis running beneath it, marking the times before, during, and after the transition. Before you introduce the two accounts, you must first establish the datum that everyone accepts: that there is one single object persisting through time and that it possesses different intrinsic properties at different times. If you describe the two views before securing this agreement, the clergyman will immediately claim they are merely describing this same datum in different languages. Once the datum is on the board, you can introduce the two accounts as competing explanations of how that datum is possible. The endurantist says the whole object is present at each time but bears different properties at different times; the perdurantist says the object is extended in time and has different temporal parts at different times, each bearing a single property. The argument from temporary intrinsics should enter immediately after these descriptions as the wedge that forces the disagreement. You must explain that for the endurantist, the object is wholly present at t1 and wholly present at t2, so the same thing has incompatible properties, which looks like a contradiction unless properties are relativized to times, whereas the perdurantist avoids this by saying different parts have different properties. This is the logical heart of the session, and it must come before you discuss the reality of past and future times.

  You must keep the question of what is happening to the object separate from the question of whether past and future times are real, because your physics enthusiasts will conflate eternalism with perdurantism within the first ten minutes. You should head off the claim that relativity forces the four-dimensional picture as soon as the time axis is drawn. Make it clear that one can believe all times are equally real, as relativity suggests, without believing objects are extended in time like worms; one can believe objects are wholly present at each moment of a block universe. This misconception must be prevented from arising at all because it shuts down the metaphysical debate by appealing to physical authority. Similarly, you must prevent the idea that perdurantism denies change. As soon as you define temporal parts, state explicitly that change is real for the perdurantist because different temporal parts have different properties, just as different spatial parts have different colors. If you do not say this immediately, the engineers will dismiss the view as denying the reality of flux. You should also head off the confusion that a temporal part is simply a spatial part laid out along an extra direction. Use the board to show that a temporal part is an object existing at a time, not a slice of space, though the analogy is useful, it must not be taken literally as a spatial extension.

  The misconception that endurantism entails presentism, meaning only the present is real, should be headed off during the section on time ontology. Clarify that an endurantist can believe in past and future times while maintaining that the object is wholly present at each moment it exists. The one misconception you should deliberately let surface is the clergyman's view that the dispute is verbal and nothing is at stake. Allow this to emerge after you have laid out the argument from temporary intrinsics, and then turn it to use by asking whether the relativization of properties is a genuine solution or an ad hoc maneuver. This shows that the stake is whether change is fundamental or whether objects are fundamentally static entities with varying parts. If you correct this too early, you rob the group of the chance to feel the force of the dilemma.

  In the last five minutes, put this question to the group: if the crystal is wholly present at every moment of its existence, where is the beta-phase symmetry located when the crystal is in the alpha-phase? This forces them to choose between saying it is nowhere, which preserves endurance but makes properties time-relative, or saying it is located at a different time as part of a larger whole, which implies perdurance. It tests whether they grasp the ontological commitment rather than just the definitions. Finally, you must openly refuse to go into branching or fission cases, the detailed argument from special relativity, the distinction between an object and its constitution, and the meta-philosophical debate over whether the dispute is substantive. For fission, say that it complicates the identity conditions beyond what one hour allows. For relativity, say that we are doing metaphysics of objects, not physics of spacetime, and we must not conflate the two. For constitution, say that we are assuming the crystal is identical to its matter to keep the focus on persistence. For the substantive debate, say that we must first understand the views before judging whether they differ in meaning or fact. These apologies will keep the session focused and respect the limits of the time while honoring the depth of the questions you are setting aside.

  Yours sincerely,

  A Fellow Traveller in Philosophy
