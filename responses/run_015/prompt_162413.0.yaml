answer: |-
  This is a profound dilemma that sits at the heart of every traditional craft: the tension between **individual authorship** and **collective vernacular**. You are not just fighting for a sign; you are fighting for a definition of what it means to be a master in a tradition-based field.

  Here is an analysis of your situation, structured around the three things you asked for.

  ### 1. Is there a "fact of the matter"?

  **No.** There is no forensic fact of the matter here, only a categorical disagreement.

  Forensically, the facts are on your side: you did not trace, you did not lift specific elements, and you assembled the composition yourself. However, Judge A is not making a forensic claim; they are making a **structuralist** one. They are arguing that in a highly codified craft, the "author" is not the hand that paints, but the mind that determines the *type*. If the "Bee Sign" is a specific cultural object with fixed parameters (blue ground, central skep, specific scroll), then deviating from those parameters makes it a *bad* bee sign, and adhering to them makes it a *copy* of the archetype.

  Judge A believes Odile owns the "slot" because she defined the current local iteration of that slot. You believe the "slot" belongs to the valley, and Odile merely occupies it.

  Therefore, the disagreement is not about *what the sign is* (physical facts), but about **what counts as originality within a tradition.** Is originality found in the *arrangement of shared parts* (your view), or is it found in the *deviation from established types* (Judge A's view)? Since Rule 12 leaves "copycat" undefined, the "fact" is whatever the majority of the committee decides it is this year. You are not proving innocence; you are negotiating a definition.

  ### 2. Draft Statement for the Appeals Committee

  *Note: This is drafted to be read aloud or submitted as a one-page document. It is respectful but firm on the philosophy of the craft.*

  **To the Appeals Committee,**
  **Re: Disqualification of Entry #[Number], Beekeeper's Sign**

  I submit this appeal not to contest the integrity of the judges, but to clarify the intent of Rule 12 in the context of our guild's tradition.

  Rule 12 was born from the Halloran affair to prevent **theft**, not to prevent **tradition**. The Halloran case involved tracing a rival's proprietary design to pass it off as one's own. My entry involves no tracing, no lifting of proprietary motifs, and no deception. It is an original assembly of the Fellsmere vernacular.

  The disqualification rests on the assertion that my sign "fills the same slot" as Master Reinholt's 2009 *Bee Lawn*. I argue that in a traditional craft, "filling the slot" is the objective, not the offense. A Fellsmere shop sign must be legible to the valley. The lead-blue ground, the central skep, and the standard cut are not Odile Reinholt's intellectual property; they are the shared vocabulary of our region, which her workshop preserves and teaches.

  If adherence to the vernacular constitutes "copycatting," then the Open Class punishes mastery. An apprentice copies to learn; a journeyman composes within the idiom to serve the client. To demand I innovate beyond the idiom is to demand I paint a sign that does not look like a Fellsmere sign.

  The Friends of the Painted Sign classify this as "idiom work." I submit that "idiom work" is the highest category of our craft. It signals that the painter has internalized the tradition so thoroughly that their hand disappears into the lineage. Disqualifying this sign suggests the Guild now values novelty over continuity.

  I ask the committee to rule that using the shared vocabulary of the valley, even when mastered in a specific workshop, does not constitute "copycatting" under the intent of Rule 12. To rule otherwise is to declare that the Fellsmere style is the property of a single shop, which contradicts the guild's mission to sustain the style itself.

  Respectfully,
  [Your Name]

  ### 3. Should Rule 12 be rewritten?

  **Yes, but with caution.** Something *would* be lost by dropping the term, but keeping it undefined is now causing more harm than good.

  **What is lost by narrowing the rule:**
  The term "copycat" (in scare quotes) currently allows for **judgment of intent.** It allows the guild to punish bad-faith actors who might technically avoid tracing but clearly intend to ride a competitor's coattails. If you replace it with rigid technical rules (e.g., "no more than 20% visual similarity"), you invite gamers who will change just enough to pass the rule while still stealing the soul of a design. The vagueness protects the *spirit* of fair play.

  **What is gained by narrowing the rule:**
  It protects the **transmission of knowledge.** As you have discovered, the current vagueness allows senior judges to conflate "tradition" with "theft." This chills the development of apprentices into masters. If every time a student surpasses their teacher they are accused of filling a "slot," the tradition dies with the teacher.

  **Recommendation:**
  Do not drop the word, but **annotate it.** The Guild should add a preamble or guideline to Rule 12 that distinguishes between **Plagiarism** and **Idiom.**

  *   **Plagiarism (Barred):** Tracing, lifting specific proprietary motifs, or replicating a specific existing sign's unique arrangement to deceive.
  *   **Idiom (Permitted):** Using standard grounds, standard lettering cuts, and traditional motif arrangements that constitute the regional style, even if a specific master is associated with them.

  Alternatively, the Guild could split the Open Class into two categories: **"Traditional/Idiomatic"** and **"Innovative/Experimental."** This would allow your sign to be judged on its mastery of the form, while allowing other entrants to be judged on their deviation from it.

  **Summary for your strategy:**
  In your hearing, do not get bogged down in defending the specific brushstrokes. Argue that **Rule 12 is a shield against fraud, not a weapon against lineage.** If you convince them that disqualifying you hurts the tradition they are sworn to protect, you will win.
