answer: |-
  You have not gone wrong in your logic; you have gone wrong in your premises. Specifically, you are treating the Biological Species Concept (BSC) as the *only* path to realism, and you are assuming empirical facts about bacterial genomics that turn out to be incorrect.

  Your conclusion—that species are "map, not territory"—is a coherent philosophical position (nominalism/conventionalism), but it is not forced by the biology. In fact, modern microbial genomics and evolutionary theory provide a stronger case for **species realism** than the classic BSC ever did, precisely *because* it forces us to abandon reproductive isolation as the criterion.

  Here is the steelman argument for why bacterial species are "joints in nature," broken down by where your setup deviates from the current science and philosophy.

  ### 1. The Empirical Correction: The Data Is Not a Continuum
  Your argument hinges on the idea that bacterial diversity is a smooth continuum and that we draw arbitrary lines (like 97% 16S identity) to bin them.

  **This is empirically false.**

  When you sequence whole genomes and calculate Average Nucleotide Identity (ANI)—which is the modern standard, replacing 16S thresholds—you do not get a smooth distribution. You get a **bimodal distribution**.
  *   There is a peak of comparisons showing >95% identity (within "species").
  *   There is a peak of comparisons showing <85% identity (between "species").
  *   There is a distinct **gap** in between.

  This gap exists across the microbial world. It is not a line drawn by a committee; it is a valley in the data. If species were purely arbitrary bins on a continuum, the distribution of genomic similarity would be normal or uniform. The fact that there is a "sequence gap" suggests that something is actively preventing genomes from occupying that intermediate space.

  **The Realist Claim:** The "territory" is the cluster, not the boundary line. The existence of distinct modes in the distribution of genomic space is a mind-independent fact. We may draw the line at 95% ANI for convenience, but the *gap* itself is out in the world.

  ### 2. The Mechanism: Why the Gap Exists (Ecotypes)
  If HGT connects everything, why don't all bacteria blend into a genomic soup? Why do the clusters persist?

  The answer is **Ecological Selection**. This is the core of Frederick Cohan's "Ecotype Model."

  In the BSC, the glue holding a species together is sex (recombination). In bacteria, the glue holding a "species" (often called an **ecotype**) together is **periodic selection**.
  1.  A beneficial mutation arises in one lineage within a specific niche.
  2.  Because that lineage is competing for the exact same resources, that mutation sweeps through the population, wiping out the genetic diversity of that niche.
  3.  This "purging" event keeps the population genetically cohesive, even without sex.
  4.  HGT does occur, but genes that disrupt the specific adaptation to that niche are selected against.

  **The Steelman:** Bacterial species are real because they are **distinct ecological units**. The "joints" are not defined by who can mate with whom, but by who can survive where. The genomic clusters you mentioned (the core genome) persist *because* they are adapted to a specific niche. If a lineage acquires too much foreign DNA via HGT that shifts its ecology, it either dies or founds a *new* species (a new cluster).

  This makes the species a **causal homeostatic property cluster**. The properties (genes, physiology, sequence) cluster together not by accident, but because of the causal process of ecological selection. That makes them real, even if the boundary is fuzzy.

  ### 3. HGT Is Not Unlimited (The Graph Is Modular)
  You granted for argument's sake that the gene-sharing graph is "more or less connected." Current network analysis suggests it is **modular**.

  While HGT is frequent, it is not frictionless. There are barriers:
  *   **Restriction-Modification Systems:** Bacteria have immune systems that chop up foreign DNA.
  *   **CRISPR-Cas:** Targeted destruction of exogenous genetic elements.
  *   **Genomic Incompatibility:** You can't just swap a gene into a complex regulatory network without breaking things.

  Consequently, gene flow is much higher *within* a species cluster than *between* them. The "connectedness" you hypothesize is theoretically possible over deep time, but in ecological time (where species exist), the graph is fragmented. The "species" are the densely connected nodes in the network; the "boundaries" are the sparse connections. In network theory, those communities are real structural features, not arbitrary bins.

  ### 4. The Philosophical Pivot: Realism Without Essentialism
  Your deepest objection seems to be: *"If the boundary is chosen by humans, the thing isn't real."*

  This conflates **operational definition** with **ontological status**.
  *   **Operational:** We use 95% ANI to name the species. (This is the map).
  *   **Ontological:** There is a population of organisms evolving independently due to ecological cohesion. (This is the territory).

  Consider a mountain range. Where does one mountain end and the next begin? The slope is continuous. If you draw a line on a map, that line is conventional. Does that mean the mountains are not real? No. The peaks are real topological features caused by tectonic processes.

  Similarly, bacterial species are "peaks" in the adaptive landscape. We may disagree on exactly where the slope becomes the valley, but the peak itself is a mind-independent entity maintained by evolutionary processes.

  **Regarding the BSC:** You are correct that BSC fails for bacteria. But philosophers of biology (like David Hull, Robert Wilson, and Marc Ereshefsky) largely agree that BSC is not the definition of "species," but rather *one concept* that works for sexually reproducing eukaryotes.
  *   **The Pluralist Realist View:** There is no single "Species" property. There are multiple distinct evolutionary lineages. "Species" is a term we use to point to **segments of population-level lineages**.
  *   Whether that lineage is held together by sex (BSC), ecology (ESC), or ancestry (Phylogenetic Species Concept), the *lineage itself* is the real thing.

  ### 5. Addressing the "Concession"
  You asked: *If the answer is "the BSC is only one species concept among many," doesn't that concede the point—that there's no fact of the matter?*

  No. It concedes that "Species" is not a **natural kind** in the same way "Electron" or "Water" is (i.e., defined by necessary and sufficient conditions). Instead, it is a **functional kind**.

  Think of "Tool." A hammer, a saw, and a microscope are all tools. There is no single physical property they share. But they are all real objects, and they are all genuinely distinct from "Non-Tools." They are unified by their function (being used to achieve a goal).
  *   **Biological Analogy:** Different groups of organisms are unified by the function of being **independently evolving lineages**.
  *   The *fact of the matter* is the existence of the lineage.
  *   The *convention* is the rank name "species" applied to that lineage.

  So, when you say "Sapiens and Neanderthals interbred, so they aren't separate species," a realist replies: They were distinct lineages evolving separately for hundreds of thousands of years, maintaining distinct ecological and morphological identities, despite a brief period of introgression. The *lineage separation* is the reality; the *hybridization* is a leak in the barrier, not a dissolution of the barrier.

  ### Summary of the Counter-Argument
  1.  **Empirical:** Bacterial genomic space is not a continuum; it has gaps (ANI gaps). The clusters are data-driven, not just threshold-driven.
  2.  **Causal:** These clusters are maintained by ecological selection (periodic selection), not just arbitrary binning. They are distinct adaptive peaks.
  3.  **Network:** HGT is modular, not universal. Gene flow is significantly restricted between clusters.
  4.  **Philosophical:** Realism does not require sharp boundaries (the "Sorites Paradox" applies to heaps of sand, but heaps of sand still exist). Realism requires **causal distinctness**. Bacterial species are causally distinct evolutionary lineages.

  **Where you went wrong:** You assumed that because the *definition* involves a human cutoff, the *entity* is a human construct. But the cutoff is just our attempt to name a cluster that nature created through ecological selection. The cluster is the territory; the 95% ANI rule is just the map legend.
