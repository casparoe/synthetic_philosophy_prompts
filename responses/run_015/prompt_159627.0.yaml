      *   *Conclusion:* The difficulty undercuts the idea *only if* the output mechanism behaves like Thomson's Lamp (oscillating). If the output mechanism is designed to settle (latch on), the logical problem vanishes, though the physical possibility remains dubious. The logical indeterminacy of Thomson's Lamp warns us that we cannot assume *any* infinite process yields a readable result; the readout mechanism must be designed to converge.

