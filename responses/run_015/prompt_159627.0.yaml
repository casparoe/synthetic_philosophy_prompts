  *Example:* A digital dimmer with 100 discrete steps. If the nudges get smaller than one step, the state might jitter between step 50 and 51 forever. The *intended* value converges, but the *actual* discrete state does not. This highlights the importance of the continuous state space.

  *(Self-Correction on Computation)*: Be careful not to say hypercomputation is impossible physically. Just address the logical link to the lamp. If the lamp is the output, its behavior determines if the answer is readable.

