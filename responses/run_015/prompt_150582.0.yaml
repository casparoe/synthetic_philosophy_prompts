answer: |-
  There is a seductive comfort in the biography section of a bookshop. It promises self-improvement without the risk of actual living. We tell ourselves that by studying the lives of great men and women, we are calibrating our moral compass, much like a statistician uses a reference class to correct a forecast. The claim is that exposure to virtue breeds virtue. Yet, one must ask whether this is genuine ethical training or merely a sophisticated form of flattery. Does reading Plutarch's *Parallel Lives* make one better, or does it simply provide the sensation of having done the epistemic labour required to be good?

  To answer this, we must first grant Plutarch his due. He was not writing history in the modern, forensic sense; he was writing ethics. His explicit aim in the *Lives* was not to record every battle or decree, but to illuminate the character (*ēthos*) of his subjects. He operated on the principle of *mimesis*, or imitation. For Plutarch, virtue was not an abstract rule but a tangible energy that could be transmitted through narrative. When he pairs Demetrius with Antony, or Alexander with Caesar, he is not merely listing achievements. He is constructing a comparative framework. The pairing is crucial. It prevents the reader from falling into idolatry. By placing a Greek alongside a Roman, often highlighting parallel flaws as much as parallel virtues, Plutarch forces a judgement. He asks the reader to weigh ambition against duty, clemency against weakness. In this light, the *Lives* function less like hagiography and more like a case law system for the soul. The reader is the judge, and the lives are the evidence.

  However, the sceptic's charge is formidable. The primary accusation is that biography is inherently selection-biased narrative. A life is messy, contingent, and often absurd; a biography is a story with a beginning, a middle, and an end. This narrative smoothing creates a false coherence. When we read of Churchill's defiance or Gandhi's asceticism, we are consuming a curated product. The messy contradictions, the luck, the private cruelties, and the mundane failures are often pruned to fit a thematic arc. This turns the subject into a monument rather than a human being.

  This leads to the second, more insidious critique: the flattery of the reader. Engaging with moral exemplars can become a substitute for moral action. One reads about stoic endurance and feels a glow of resilience, despite having endured nothing but a difficult commute. This is the 'epistemic labour' trap. The cognitive effort of understanding a complex life is mistaken for the moral effort of living well. It is moral voyeurism. If biography is consumed passively, it is indeed hagiography with better marketing. It allows the reader to align themselves with the 'great' without demanding they emulate the cost of that greatness. Plutarch knew this risk; he warned that we should not imitate the errors of great men simply because they are great. But the text cannot police the reader's vanity.

  This tension finds a striking modern echo in the Effective Altruism (EA) movement. EA attempts to strip morality of narrative and replace it with data. Instead of 'great men', EA offers 'cause areas' and 'interventions'. Yet, it still relies on case studies. We look at the founder who sold their company to fund malaria nets, or the researcher who pivoted to AI safety. These function as secular *Lives*. They are intended to calibrate judgement, to show what high-impact agency looks like.

  Do these suffer the same failure mode? Arguably, yes. There is a risk of 'impact washing', where the narrative of the effective altruist becomes a status signal, a way to signal virtue through the optimisation of giving rather than the sacrifice of self. If an EA case study is read as a hero's journey, it becomes hagiography. However, there is a divergence. Plutarch leans into the narrative to extract the moral; EA tries to strip the narrative to find the metric. Plutarch asks, 'What kind of man was he?' EA asks, 'How many lives were saved?' The latter is less susceptible to the charm of personality, but it is not immune to selection bias. We only study the interventions that succeeded or were measurable. The quiet, unmeasurable virtues—the neighbourly kindness, the unrecorded integrity—drop out of the dataset. Both systems, the ancient narrative and the modern metric, risk creating a morality that is performative rather than transformative.

  So, where does this leave us? Is the project doomed? I argue that biography can improve moral reasoning, but only if the mode of reading is aggressive rather than reverent. The value of Plutarch's *Parallel Lives* lies precisely in the friction it generates, not the comfort it offers. When we read of Antony's decline, it should not make us feel superior; it should make us recognise the same capacity for self-destruction within ourselves. The 'reference class' analogy holds, but only if we treat the lives as data points in a simulation of our own potential failures, not just a gallery of successes.

  For biography to do moral work, it must disturb the reader. If a life story leaves you feeling inspired and comfortable, it is likely hagiography. If it leaves you unsettled, forced to confront the contingency of your own virtues and the ease with which they might crumble under different pressures, then it is functioning as Plutarch intended. The pairing method is the safeguard here. By comparing Demetrius and Antony, Plutarch ensures that neither is perfect. The reader is denied a simple hero to worship and is instead handed a complex problem to solve.

  Therefore, the conclusion is this: biography does not make you better by osmosis. It makes you better only if you treat it as a provocation. It is a tool for moral calibration, but like any tool, it can be used to build or to posture. The modern EA case study suffers the same risk: if it becomes a script for identity, it fails; if it becomes a rigorous audit of consequences, it succeeds. Plutarch's work survives not because it tells us who was good, but because it forces us to define what 'good' means in the face of power, luck, and decay.

  Reading lives is epistemic labour, yes. But it is only moral labour if it results in a change of behaviour. If we read of Cato's integrity and close the book feeling satisfied, we have wasted our time. If we close the book and find our own compromises intolerable, then the biography has done its work. The text itself is neutral; the moral weight rests entirely on the reader's willingness to be judged by the dead. Without that willingness, it is merely entertainment for the ego. With it, it remains one of the few technologies we have for speaking across the centuries about how to live.
