prompt: |-
  hey, been mulling over plutharc's parallel lives and whether biography actually does moral work or if it's just hagiography with better marketing. there's this old claim that comparing two lives side-by-side — say demetrius and antony — calibrates your judgement about virtue the way a reference class calibrates a forecast, but i'm sceptical. i want an essay on whether reading lives can genuinely improve moral reasoning, or whether it's always selection-biased narrative that flatters the reader. weigh plutharc's own idea of imitation, the hagiography critique, and whether modern effective-altruism case studies suffer the exact same failuer mode. reach an actual conclusion and defend it: does biography make you better, or just make you feel like you've done the epistemic labour? please write in british english and don't bother with bibliographies or citation lists — just argue it through.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** Does reading biography (specifically Plutarch's *Parallel Lives*) genuinely improve moral reasoning, or is it just selection-biased narrative/hagiography that makes the reader feel virtuous without doing the work?
      *   **Key Elements to Weigh:**
          *   Plutarch's own concept of *mimesis* (imitation).
          *   The "hagiography critique" (biography as flattering narrative/marketing).
          *   Comparison to modern Effective Altruism (EA) case studies (do they suffer the same failure mode?).
          *   Reference class forecasting analogy (calibrating judgement).
      *   **Requirement:** Reach an actual conclusion and defend it.
      *   **Style:** British English, no bibliographies/citations, argumentative essay style.
      *   **Tone:** Intellectual, sceptical but open, rigorous.

  2.  **Deconstruct the Core Tension:**
      *   *The Optimistic View (Plutarch):* Biography is a mirror. By looking at great men (and occasionally women), we see virtues and vices clearly. We imitate the good, avoid the bad. It's moral gym equipment.
      *   *The Sceptical View (Modern Critique):* Lives are curated. Outcomes are known (hindsight bias). Context is stripped. It's consumption masquerading as education. It flatters the reader ("I am studying greatness") without demanding action.
      *   *The EA Analogy:* EA uses case studies (e.g., specific charities, historical interventions) to calibrate giving. Is this just secular hagiography? Does it suffer from selection bias?

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: The enduring allure of *Parallel Lives*.
          *   The central question: Moral calibration vs. moral vanity.
          *   Thesis statement (tentative): Biography *can* work, but only if we resist the narrative smoothing. It requires active friction, not passive consumption.

      *   **Plutarch's Project (The Case for Imitation):**
          *   Plutarch wasn't writing dry history; he was writing ethics.
          *   The concept of the *prohairesis* (moral choice).
          *   The "mirror" analogy. It's not about copying actions, but copying the *spirit* of the action.
          *   Why the pairing matters (Demetrius/Antony): It forces comparison, preventing idolatry of a single figure.

      *   **The Hagiography Critique (The Case Against):**
          *   Narrative bias: Lives have beginnings, middles, and ends. Real life is messy.
          *   Selection bias: We only read about the "great." What about the quiet virtues?
          *   The "Flattery of the Reader": Reading about stoics makes us feel stoic without enduring hardship. It's epistemic labour simulation.

      *   **The Effective Altruism Parallel:**
          *   EA tries to be data-driven, not narrative-driven.
          *   However, EA relies on "cause areas" and specific success stories (e.g., bednets, AI safety pioneers).
          *   Do these suffer the same issue? Yes, if they become hero-worship (e.g., the "effective altruist" identity).
          *   But EA attempts to strip the *narrative* to find the *metric*. This is the key difference. Plutarch leans into narrative; EA tries to escape it. Both have blind spots.

      *   **Synthesis & Resolution (The Verdict):**
          *   Is it useful? Yes, but conditionally.
          *   The danger is *passive* reading.
          *   The value lies in the *friction* between the reader's context and the subject's context.
          *   Plutarch's pairing method is actually a safeguard against hagiography (comparing flaws).
          *   Conclusion: Biography makes you better only if it disturbs you. If it comforts you, it's hagiography.

