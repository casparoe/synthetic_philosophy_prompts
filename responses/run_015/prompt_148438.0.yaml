          *   *So the error lies in applying the "certain of evidence" clause to a case where the agent cannot be certain of the evidence.* The professor's summary sets up a condition ("certain she will receive E") but then applies it to a case ("expects that, upon seeing R") where that condition isn't met (she isn't certain of $R$).
