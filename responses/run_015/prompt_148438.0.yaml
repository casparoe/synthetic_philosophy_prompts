          *   *Error:* This ignores the probability of $R$ occurring. If $P(R)$ is not 1, the current unconditional credence is a weighted average of $P(I|R)$ and $P(I|\neg R)$.
      *   *The Redundancy Conclusion:* "Gathering evidence adds nothing."
          *   *Error:* This is the "Dogmatism" or "Value of Information" objection. If I already believe what I will believe later, why look?
