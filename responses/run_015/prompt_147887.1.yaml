  **Total Score: 22/30**

  **Margin Comments:**

  1.  **Phrase:** "undergoes a valence-switch — it simply stops counting against burning them"
      **Credit:** Partial (1/2 points for terminology)
      **Comment:** You have described valence-loss (a reason stops counting), not valence-switch. Based on the handout definition, a switch requires the consideration to change sign (e.g., from a reason against to a reason for), not merely become neutral.

  2.  **Phrase:** "judgement comes first, and principles are at best summaries"
      **Credit:** Full
      **Comment:** This is an accurate characterization of the particularist's priority claim. You clearly distinguish the particularist view of principles from the generalist view without oversimplifying.

  3.  **Phrase:** "knowing that just is the judgement the principle was supposed to produce"
      **Credit:** Full
      **Comment:** This captures the core of the regress objection perfectly. You explain why hedging the principle fails to solve the problem of guidance because the hedge itself requires the judgment it was meant to supplement.

  4.  **Phrase:** "Particularism is not relativism if what you mean by relativism is that right and wrong are fixed by what some culture happens to approve of"
      **Credit:** Full
      **Comment:** Correct distinction. You accurately identify that particularism maintains objective correctness within a situation, distinguishing it from cultural relativism.

  5.  **Phrase:** "there is no further fact of the matter about which of us is right"
      **Credit:** No Credit
      **Comment:** This contradicts your earlier claim that there is "one correct answer." Standard particularism denies this consequence; judges appeal to the features of the case, not principles, but maintain that a fact of the matter exists. This suggests a confusion about particularist objectivity.

  6.  **Phrase:** "Exactly the same natural facts would be compatible with opposite moral verdicts"
      **Credit:** No Credit
      **Comment:** This is a fundamental error regarding supervenience. Particularists argue the supervenience base is the *whole* situation, not isolated features. Feature variance across cases does not violate supervenience, so particularism does not force us to give it up.
