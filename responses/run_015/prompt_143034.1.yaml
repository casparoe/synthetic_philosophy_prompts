      *   *The "One Principle":* The strongest candidate for a *Civics* essay is **Freedom as Non-Domination (Republicanism)**. It explains 1, 2 (social domination), 3, and 5 perfectly. It struggles with 4 (internal). I need to tell the user that 4 might be out of scope for Civics, or requires a specific definition of autonomy.

  7.  **Final Polish:** Keep the tone encouraging but intellectually rigorous. Use terms like "Negative Liberty," "Positive Liberty," and "Non-Domination" but explain them simply. (This matches the user's "gut call" language).

