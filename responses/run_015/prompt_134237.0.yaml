      **Title:** The Asymmetry Assumption: Interpersonal vs. Intrapersonal Temporal Comparisons of Welfare

      **Project Description & Research Question:**
      Contemporary political philosophy and social choice theory operate under a entrenched asymmetry: comparisons of welfare across persons are treated as epistemically and metaphysically problematic, while comparisons of welfare across time within a single life are treated as unproblematic. This project challenges that asymmetry. Standard skeptical arguments—the arbitrariness of utility scales, the inaccessibility of qualitative experience, and the instability of preferences under adaptation—apply with equal force to the temporal case. Yet, institutions rely on intrapersonal temporal comparisons for discounted cost-benefit analysis, prudential deliberation, and health metrics like QALYs.

