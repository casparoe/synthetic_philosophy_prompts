      The project proceeds over twelve months, structured to produce four dissertation chapters and a unified introduction.

      *Months 1-3: Formalizing Comparability.* I will formalize the distinctions between levels, differences, and ratios using social choice notation. Milestone: A completed technical appendix defining the informational constraints for each normative view (utilitarian, prioritarian, sufficientarian) without assuming the temporal asymmetry.

      *Months 4-6: The Skeptical Challenge.* I will draft the core argument applying skeptical pressures (scale arbitrariness, access, adaptation) to the temporal case. Milestone: A full draft of the chapter demonstrating that standard defenses of intrapersonal comparability fail to distinguish the temporal from the interpersonal case.

      *Months 7-9: Constructive Analysis.* I will evaluate the three hypotheses: (1) skeptics conceded too much; (2) a unique temporal feature grounds the asymmetry; (3) interpersonal comparison is in some respects easier due to subject fixedness. Milestone: A complete draft determining which grades of comparability survive in which context.

      *Months 10-12: Integration and Normative Implications.* I will integrate the findings into the broader political philosophy context, addressing the institutional stipulation reply. Milestone: Full dissertation draft ready for committee review.

      **Outcomes and Failure Conditions:**
      Success looks like a mapped topology of comparability: a demonstration that, for example, intrapersonal differences are comparable while interpersonal levels are not, or that both are equally skeptical. This would force a revision of normative theories relying on the rejected comparisons.

      Failure, in the specific sense of this project, would occur if the question turns out to be linguistically or conceptually malformed—e.g., if "welfare" cannot be meaningfully disaggregated into levels and ratios—or if the answer is trivially conventionalist (i.e., "it is entirely stipulative"). A trivial conventionalist answer would render the project vacuous, as it would imply no metaphysical or epistemic fact of the matter exists to investigate. Another failure mode is circularity: if defending the temporal case requires premises that already assume the interpersonal case is resolved. I will monitor for this during Months 4-6.

      **Scope and Exclusions:**
