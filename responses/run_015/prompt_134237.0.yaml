      **Critique of Existing Positions:**
      Current frameworks leave this question open because they presuppose the asymmetry they ought to justify. The ordinalist or skeptical tradition typically grants intrapersonal cardinality to block interpersonal aggregation, but offers no argument why the measurement problem dissolves across time. They assume psychological continuity resolves the scale-origin problem, yet adaptation effects suggest preferences rescale over time just as they differ across persons.

