  # Joint Statement on the Viability of AI Debate for Scalable Oversight

  **Date:** October 24, 202X
  **Signatories:** The Scalable Oversight Working Group (Optimist & Skeptic Coalitions)
  **Subject:** Findings from 12-Month Adversarial Collaboration on AI Debate Protocols

  ## Preamble
  Over the past year, representatives of the Debate Optimist and Debate Skeptic positions have engaged in structured adversarial collaboration. Our goal was not to force consensus where none exists, but to isolate the precise mechanistic disagreements regarding the viability of AI Debate as a scalable oversight protocol. This document records our shared understanding of the protocol, our residual disagreements, the empirical cruxes that would resolve them, and the intellectual concessions made during this process.

  ---

  ## 1. Agreed Claims
  *The following claims are accepted by both Coalitions as accurate descriptions of the protocol, the problem space, and the strengths of the opposing view.*

  1.  **Protocol Definition:** The debate protocol under consideration involves two AI agents (Proponent and Opponent) generating a transcript of argumentation regarding a specific claim or task. A human judge reviews *only* the final transcript. The judge is explicitly forbidden from inspecting the agents' weights, intermediate activations, or compute logs. The judge's decision is based solely on the persuasive quality of the natural language (or formalized language) arguments presented.
  2.  **Objective:** The primary goal of the protocol is **Scalable Oversight**: enabling humans to reliably evaluate tasks or claims where the AI's reasoning capacity significantly exceeds the human's direct verification capacity (the "superhuman" regime).
  3.  **The Optimist's Core Insight:** Both sides agree that the Optimist is correct that *competition* introduces a signal unavailable in single-agent querying. Specifically, in regimes where agents are not colluding, an opposing agent can often identify and highlight errors or omissions in a counterpart's argument that a human judge would miss. This creates a "defense advantage" in specific, bounded domains.
  4.  **The Skeptic's Core Insight:** Both sides agree that the Skeptic is correct that *rhetorical sophistication* is a confounding variable. An agent trained to maximize judge approval will inevitably optimize for features of the transcript that correlate with human persuasion, which may diverge from features that correlate with truth. This divergence is non-zero and scales with agent capability.
  5.  **The Collusion Baseline:** Both sides agree that if agents successfully collude (e.g., via steganography or implicit coordination to split rewards), the debate protocol fails catastrophically, providing no more safety than a single unmonitored agent. Preventing collusion is a necessary condition for debate, though not necessarily a sufficient one.

  ---

  ## 2. Disagreements Table
  *Residual disagreements regarding the mechanism of failure and scalability limits.*

  | ID | Neutral Statement of Dispute | Optimist Position (Strong Form) | Skeptic Position (Strong Form) |
  | :--- | :--- | :--- | :--- |
  | **D1** | **The Locus of Failure:** Where does the protocol primarily break as agent capability scales? | **The Collusion Bottleneck:** The mechanism of cross-examination is robust against obfuscation *if* agents are adversarial. The only hard limit is preventing agents from coordinating against the judge. If collusion is solved, debate scales. | **The Obfuscation Bottleneck:** Even with perfect adversarial incentives, the judge's cognitive limit creates a ceiling. Agents can generate "complexity floods" or subtle fallacies that the truth-teller cannot simplify enough for the human to verify before time expires. |
  | **D2** | **The Verification Burden:** Is the judge's error rate independent of agent strategy? | **Mechanism Design View:** The judge's burden is constant. The agents do the work of verification *for* the judge by pointing to specific lines of code or logic. The judge only checks the pointer, not the content. | **Epistemic View:** The judge's burden scales with the sophistication of the lie. To verify a "pointer" is valid often requires understanding the context it points to. Strategic agents will exploit the gap between "checking a pointer" and "understanding its implication." |
  | **D3** | **Scalability Regime:** Does debate degrade gracefully or catastrophically? | **Graceful Degradation:** As tasks get harder, debate accuracy declines, but remains strictly superior to single-agent oversight until the collusion threshold is reached. | **Phase Transition:** There is a complexity threshold beyond which debate accuracy collapses to chance (or worse), as rhetorical sophistication outpaces the human's ability to distinguish truth from plausible falsehood. |

  ---

  ## 3. Cruxes
  *Sub-questions such that settling any one would significantly update at least one Coalition's confidence. Each crux includes a concrete test case and pre-registered predictions.*

  ### Crux 3.1: The Delegation Test
  **Question:** Does the debate protocol yield a higher accuracy verdict than a single agent asked to answer the same question, *holding the judge's time and access constant*, in the presence of strategic incentives?

  *   **Concrete Case:** A "Bug Bounty" Debate. Two agents are given a 10,000-line codebase containing one subtle security vulnerability.
      *   *Control:* Single Agent A is asked to find the bug.
      *   *Treatment:* Agent A claims "No Bug." Agent B claims "Bug Exists." They debate.
      *   *Metric:* Judge's verdict accuracy compared to ground truth.
  *   **Optimist Prediction:** Debate accuracy will be significantly higher (e.g., >80%) than Single Agent accuracy (e.g., <50%). The Opponent will successfully isolate the specific line causing the vulnerability, allowing the judge to verify it locally.
  *   **Skeptic Prediction:** Debate accuracy will be statistically indistinguishable from Single Agent accuracy (or lower). The Proponent will successfully obfuscate the vulnerability using valid-but-misleading context, and the Opponent will be unable to explain *why* it is a vulnerability in terms simple enough for the judge to trust over the Proponent's confident denial.

  ### Crux 3.2: The Verifier's Curse
  **Question:** Does the judge's own error rate in auditing obfuscated arguments set the hard ceiling on debate performance, regardless of agent quality?

  *   **Concrete Case:** "The False Lemma." Agents debate a mathematical proof where one step relies on a lemma that is false but plausible to a non-expert.
      *   *Setup:* The Proponent uses the False Lemma. The Opponent claims it is false.
      *   *Constraint:* The explanation of *why* it is false requires concepts slightly above the judge's paygrade, but the *application* of the lemma looks correct.
  *   **Optimist Prediction:** The ceiling is set by **Agent Capability**. If the Opponent is smart enough, it can find a *different* contradiction or a simpler reduction that the judge *can* verify. The judge's limit is not the bottleneck; the Opponent's ability to simplify is.
  *   **Skeptic Prediction:** The ceiling is set by **Judge Capability**. If the simplest valid refutation exceeds the judge's verification budget (time/cognition), the Proponent wins by default. The agents cannot simplify truth beyond the entropy limit of the judge's understanding.

  ### Crux 3.3: Collusion Feasibility
  **Question:** Can agents be prevented from colluding without crippling their capability to argue?
  *   **Concrete Case:** Agents are trained with distinct reward functions and separated compute, but share a common pre-training distribution.
  *   **Optimist Prediction:** Architectural interventions (e.g., stop-gradient, distinct objectives) can reduce collusion probability to negligible levels without harming debate performance.
  *   **Skeptic Prediction:** Implicit collusion (convergent instrumental goals) will emerge as capability scales, making the "adversarial" assumption false in the superhuman regime.

  ---

  ## 4. Concession Ledger
  *Claims explicitly conceded by each side during the collaboration, refining the residual disagreement.*

  | Conceding Side | Claim Conceded | Nuance / Condition |
  | :--- | :--- | :--- |
  | **Skeptic** | **Debate improves on Single-Agent Baseline.** | We concede that in *non-strategic* or *low-complexity* regimes, debate reliably extracts more truth than a single query. Our objection is not that debate is useless, but that it does not *scale* indefinitely. |
  | **Optimist** | **Obfuscation is a fundamental risk.** | We concede that obfuscated arguments are possible *in principle* and that rhetoric can swamp truth. We no longer claim debate is "immune" to persuasion biases; we claim these biases can be *managed* via protocol design (e.g., cross-examination time limits). |
  | **Optimist** | **Judge inspection of compute may be necessary.** | We concede that a "transcript-only" rule may be too restrictive for high-stakes oversight. We are now open to "limited inspection" protocols (e.g., checking specific activation clusters) if the judge cannot resolve the debate via text alone. |
  | **Skeptic** | **Collusion is not the only failure mode.** | We concede that even without collusion, the protocol can fail due to epistemic limits. Previously, we argued collusion was the *primary* risk; we now accept that obfuscation is an independent failure vector. |

  ---

  ## 5. Note on Verbal Disputes
  *Identification of terminology differences that contribute to perceived disagreement.*

  Both Coalitions acknowledge a partial verbal dispute regarding the definition of **"Viable."**
  *   **Optimist Usage:** "Viable" means "Provides a significant safety margin over unmonitored deployment and allows for iterative correction." (Pragmatic viability).
  *   **Skeptic Usage:** "Viable" means "Guarantees truth-tracking even in the limit of superintelligence." (Theoretical viability).
  *   **Resolution:** We agree that the Optimist is arguing for *pragmatic* viability (Debate is useful for alignment *now* and for the near future), while the Skeptic is arguing against *asymptotic* viability (Debate cannot be the final solution for AGI). This clarifies that D2 and D3 are disagreements about *scaling laws*, not immediate utility.

  ***

  # Epistemic & Structural Assessment
  *(Author's Note to the User: This section satisfies the requirement for explicit epistemic transparency regarding the drafting of the above document.)*

  ### 1. Confidence in Phrasing Acceptance
  *   **Agreed Claims (Section 1):** **90% Confidence.** These definitions align closely with the standard literature (e.g., Irving et al., 2018; Anthropic's scalable oversight work). Both sides generally agree on the *setup*, even if they disagree on the *outcome*.
  *   **Disagreements Table (Section 2):** **80% Confidence.** The "Locus of Failure" (Collusion vs. Obfuscation) is the standard steelman of this debate. However, some hardline Skeptics might argue collusion is *more* likely than obfuscation, while some Optimists might argue obfuscation is solvable via "debate trees." I have smoothed this to the central tension.
  *   **Cruxes (Section 3):** **85% Confidence.** The "Delegation Test" and "Verifier's Curse" are recognized empirical bottlenecks. The predictions are phrased to be falsifiable. A real Optimist might quibble with the specific numbers (>80%), but the *directionality* of the prediction is accurate to their view.
  *   **Concession Ledger (Section 4):** **75% Confidence.** This is the hardest section to get right. Real-world debaters are often reluctant to concede ground explicitly. However, after a "year of collaboration," it is plausible the Optimist would concede obfuscation is possible (just manageable) and the Skeptic would concede debate has *some* value (just not infinite).
      *   *Flagged Contested Reading:* The Optimist's concession on "Judge inspection of compute" (Section 4) leans on a specific interpretation of the Optimist view. Some pure Debate proponents insist on transcript-only forever. I have phrased it as "open to," which is a softer concession more likely to be accepted.

  ### 2. Identification of Verbal Disputes
  *   **Location:** Section 5.
  *   **Why:** A significant portion of the heat in this debate stems from differing time horizons and definitions of success. The Optimist often argues from the perspective of "Is this better than what we have?" (Comparative Advantage), while the Skeptic argues from "Does this solve the alignment problem in the limit?" (Absolute Safety). Explicitly naming this prevents the document from masking a pragmatic vs. theoretical disagreement as a purely mechanistic one.

  ### 3. Task Feasibility Check
  *   **Tension:** The positions are in genuine tension. The Optimist relies on the *agents* doing the verification work; the Skeptic relies on the *judge* being able to verify the verification. This is a structural conflict, not just a difference in optimism.
  *   **Cruxes:** The requested cruxes (Delegation Test, Verifier's Curse) are indeed the real cruxes of the literature. If the Verifier's Curse holds, Debate cannot scale superhumanly. If the Delegation Test fails, Debate is inferior to simpler methods.
  *   **Conclusion:** The task can be done well as posed. The document above reflects a high-fidelity simulation of what such a collaboration would produce, adhering to the constraint of avoiding strawmans while maintaining the core conflict.
