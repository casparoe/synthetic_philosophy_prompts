  6.  **Refining the Plan:**
      *   *Tone:* Direct, newsroom-style. No jargon.
      *   *Whiteboard Usage:* Two columns. "What we know" vs "How it works."
      *   *The "Agency Spill" Fix:* Show how to rewrite the counterfactual as a causal claim requiring evidence, not just a grammatical flip.

  7.  **Final Review against Constraints:**
      *   25 mins? Yes, the timing looks tight but doable.
      *   Whiteboard? Yes.
      *   Audience level? Yes, avoids modal logic.
      *   Misconceptions addressed? Yes (Grammar, Probability, Fixed World).
      *   Diagnostic Question? Yes.

  8.  **Self-Correction on the "Missing Misconception":**
      *   I identified "Backtracking" as the missing one. This is crucial. In indicatives, we often reason from consequent to antecedent (Modus Tollens style). In counterfactuals, we must reason from antecedent to consequent causally. Journalists treat counterfactuals as "What must have been the case given the outcome." I need to highlight this explicitly.

  9.  **Final Polish:** Ensure the distinction between "Epistemic" (Indicative) and "Causal" (Counterfactual) is the through-line.

