          2.  Explain *why* (Evidence vs. Mechanism).
          3.  Kill the "Rewind" misconception (You can't keep the death fixed in the counterfactual).
          4.  Apply to the "Agency Spill" example.
      *   *What to Skip:* Lewis/Stalnaker possible worlds semantics. The equation P(A->C) = P(C|A). (Crucial: tell them *why* you're skipping it—because it leads to the "probability" misconception).
      *   *The Missing Misconception:* **Backtracking.** Journalists love to backtrack. "If the spill was smaller, the agency must have acted sooner." That's indicative reasoning applied to counterfactual grammar.
      *   *The Diagnostic Question:* Needs to force a choice between "What we know" and "What would happen."
          *   *Idea:* A scenario where the result is known, but the cause is uncertain.
          *   *Scenario:* A bomb went off. We know it was either Timer or Remote. It was Timer.
          *   Q: "If it wasn't Timer, was it Remote?" (Indicative: Yes). "If it hadn't been Timer, would it have been Remote?" (Counterfactual: Only if Remote was standing by).
          *   *Better:* Stick to the "Lone Nut" structure.
          *   *Question:* "The bridge collapsed. We know it was either corrosion or the truck. It was the truck."
          *   Ask: "If it wasn't the truck, was it corrosion?" (Yes). "If the truck hadn't hit it, would it have collapsed?" (Depends on corrosion status).
          *   *Refinement:* Make it binary.
          *   *Minute 22 Question:* "The suspect is in custody. We know he entered through the Window or the Door. He entered through the Window."
          *   Sentence A: "If he didn't enter through the Window, he entered through the Door."
          *   Sentence B: "If he hadn't entered through the Window, he would have entered through the Door."
