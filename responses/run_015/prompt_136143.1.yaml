answer: |-
  Here is the 25-minute battle plan.

  ### The Core Objective
  **First thing to land:** The two sentences do not have the same truth conditions. They are not the same proposition wearing different tense-hats.
  **Why:** If they think the difference is merely grammatical (subjunctive vs. indicative), they will treat counterfactuals as "fancy past tense." You must prove that one can be **True** while the other is **False** about the exact same event. Everything else hangs on this divergence.

  ### The Killer Pair (Write these on the board immediately)
  Use the Kennedy example. It is the canonical choice for a reason: it is historically fixed, widely known, and cleanly separates *evidence* from *causality*.

  1.  **Indicative:** "If Oswald didn't shoot Kennedy, someone else did."
  2.  **Counterfactual:** "If Oswald hadn't shot Kennedy, someone else would have."

  **The Move:** Ask the room for a show of hands on truth values.
  *   **Sentence 1 is True.** (We know Kennedy was shot. If Oswald is ruled out, the evidence forces us to conclude a second shooter exists).
  *   **Sentence 2 is False.** (The Warren Commission conclusion: Oswald was a lone nut. If you remove Oswald from the timeline, there is no conspiracy waiting in the wings to replace him. Kennedy likely lives).

  **Why this pair:** It kills the "it's just grammar" misconception instantly. It also kills the "probability" misconception (it was not *probable* someone else would shoot, yet Sentence 1 is still assertable).

  ---

  ### The Sequence (Minute-by-Minute)

  **0:00 – 5:00: The Divergence (The Hook)**
  *   Write the two sentences.
  *   Get the verdict (True / False).
  *   **The Lesson:** The Indicative is about **Information**. It asks: *Given what we know happened, what does the evidence imply?*
  *   The Counterfactual is about **Mechanism**. It asks: *Given how the world works, what would this change produce?*
  *   *Whiteboard:* Draw two columns. Left: "What we know (Facts)." Right: "How it works (Causes)."

  **5:00 – 10:00: The "Hold Fixed" Trap (Addressing Misconception #3)**
  *   Reporters think checking a counterfactual means: *Keep everything that actually happened fixed, just change the antecedent.*
  *   **The Correction:** You cannot hold the *outcome* fixed in a counterfactual.
  *   In Sentence 1 (Indicative), we hold "Kennedy is dead" fixed. We reason backward from the body.
  *   In Sentence 2 (Counterfactual), we remove Oswald. We **do not** hold "Kennedy is dead" fixed. We let the causal chips fall. If the mechanism (conspiracy) isn't there, the body doesn't appear.
  *   *Whiteboard:* Draw a causal chain. `Oswald -> Shot -> Death`.
      *   Indicative cuts the chain at `Oswald`, keeps `Death`, asks "What else connects to `Death`?"
      *   Counterfactual cuts the chain at `Oswald`, removes `Shot`, asks "Does `Death` still happen?"

  **10:00 – 15:00: The "Backtracking" Error (The Missing Misconception)**
  *   This is the one you haven't listed, but it's the one that ruins news copy.
  *   **The Error:** Journalists use counterfactual grammar to perform indicative reasoning.
  *   *Example:* "If the spill was half the size, the agency must have acted sooner."
  *   That is **Indicative** reasoning (reasoning backward from the result to the cause) dressed in **Counterfactual** clothes ("If the spill *had been*...").
  *   **The Rule:** Counterfactuals must run **forward**. You cannot use the actual outcome to validate the counterfactual antecedent. You need a causal model, not just the aftermath.
  *   *Application:* To write "If the agency had acted sooner, the spill would've been half the size," you need evidence of the *mechanism* (e.g., "Containment booms reduce spread by 50% per hour"), not just the fact that the spill was big.

  **15:00 – 20:00: Fixing the Copy (Practical Application)**
  *   Take their example: *"If the agency had acted sooner the spill would've been half the size."*
  *   **The Test:** Ask the reporter: "Do you have a source who says *how* the agency stops spills, or do you just know how big the spill got?"
  *   If they only know how big the spill got, they are writing an Indicative disguised as a Counterfactual.
  *   **The Fix:** Either change the grammar to match the evidence ("The size of the spill suggests the agency did not act soon enough") or get the causal evidence required for the counterfactual ("Engineers say earlier intervention cuts volume by half").

  **20:00 – 22:00: The "Out of Bounds" List**
  *   Say this out loud: "Here is what I am deliberately skipping, because it will confuse you more than it helps."
  *   1. **Possible Worlds:** "We are not talking about parallel universes or 'similarity metrics.' We are talking about causal models vs. evidence files."
  *   2. **Conditional Probability:** "Do not think P(B|A). The probability of the consequent given the antecedent is not the truth of the counterfactual. (Reference: The JFK example—probability of a second shooter was low, but the indicative was true)."

  **22:00 – 25:00: The Diagnostic Question**
  *   Put this scenario on the board:
      > "A warehouse burned down. We know for a fact it was caused by either **Arson** or **Faulty Wiring**. The investigation confirmed it was **Arson**."
  *   Ask them to evaluate these two sentences:
      1.  "If it wasn't Arson, it was Faulty Wiring."
      2.  "If it hadn't been Arson, the warehouse would have burned down anyway."
  *   **The Correct Answer:**
      *   Sentence 1 is **True**. (Indicative: Reasoning from the fact of the fire + the binary options).
      *   Sentence 2 is **False/Unproven**. (Counterfactual: Requires knowing if the Wiring was *actually* faulty enough to cause a fire on its own. The fact that the fire *did* happen doesn't prove the Wiring *could* have caused it).
  *   **The Tell:** If they say both are true, they are backtracking (using the fire to prove the wiring was dangerous). If they distinguish them, they got it.

  ### Summary of Misconception Handling
  *   **"It's just grammar/tense":** Killed in the first 5 minutes by the JFK True/False split.
  *   **"Counterfactual = Probability":** Killed by the JFK example (low probability of conspiracy, yet indicative is true).
  *   **"Hold the world fixed":** Killed in the 5-10 minute block (You must release the outcome).
  *   **"Backtracking" (The Missing One):** Addressed in the 10-15 minute block (Don't reason backward from the result in a counterfactual).

  ### Whiteboard Layout
  *   **Left Side:** The JFK Pair (True / False).
  *   **Middle:** Two Headers: "EVIDENCE (Indicative)" vs "MECHANISM (Counterfactual)".
  *   **Right Side:** The Warehouse Diagnostic (for the final check).

  This plan keeps them out of the metaphysics weeds and forces them to confront the evidentiary standards required for the sentences they actually write.
