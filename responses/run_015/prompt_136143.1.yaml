          *   *This is the one.* It perfectly targets the "tense" misconception.

  3.  **Address the Misconceptions:**
      *   *Misconception 1: It's just grammar/tense.* (Addressed immediately by the Example Pair).
      *   *Misconception 2: Counterfactuals are true when consequent is probable.* (Addressed by showing the probability of "someone else" might be low, but the indicative is still true).
      *   *Misconception 3: Hold world fixed, change antecedent.* (This is the "miracle" problem. Need to explain we change the *cause*, not the *effect* history).
      *   *Missing Misconception:* **The direction of inference.** Indicatives often reason *backwards* from facts (Abductive). Counterfactuals reason *forwards* from causes (Predictive/Causal). This is the big one for journalists. They treat counterfactuals as "what we can infer from the result" rather than "what the mechanism produces."

  4.  **Structure the 25 Minutes:**
      *   0-5: The Hook (The Example Pair). Write them on the board. Ask for truth values.
      *   5-10: Why they differ (Epistemic vs. Causal). The "Evidence" vs. The "Mechanism."
      *   10-15: The "Hold Fixed" Trap. Why you can't just rewind and change one thing while keeping the result fixed.
      *   15-20: Application to Newsroom Copy. How to spot the error in "If the agency had acted..."
      *   20-22: What we are skipping (Possible Worlds, Conditional Probability).
      *   22-25: The Diagnostic Question.

  5.  **Drafting the Content - Section by Section:**

      *   *The Pair:* JFK is best. It's the canonical example (Quine/Adams).
      *   *First Thing to Land:* **They answer different questions.** One asks "What does the evidence tell us?" The other asks "How does the world work?"
      *   *Sequence:*
