      *   *The Crux:* They aren't just tense shifts. They evaluate truth differently. Indicatives look at *epistemic probability* (what we know). Counterfactuals look at *causal structure* (how things work).
      *   *The "Killer" Example:* The Kennedy assassination example (Adams/Quine) is the classic for a reason. It separates the two cleanly.
