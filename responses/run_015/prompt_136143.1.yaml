          *   *Newsroom Version:* A source leaks a story. The editor runs it. The CEO resigns.
          *   Indicative: "If the Editor didn't run the story, the CEO resigned anyway." (Based on the fact the CEO resigned and maybe there were other reasons).
          *   Counterfactual: "If the Editor hadn't run the story, the CEO would have resigned anyway." (This claims the story didn't cause it).
          *   *Actually, let's stick to the Kennedy structure but make it about a specific event they know.*
          *   *Decision:* The Kennedy example is the gold standard for a reason. It's distinct, famous, and separates epistemic from causal immediately. I will suggest using that, or a very close structural analog (like the "Assassination Attempt" scenario). Let's go with a generic "Assassination Attempt" to avoid political baggage, or stick to JFK because everyone knows the facts. Let's suggest JFK but acknowledge the baggage. Actually, a "Poisoned Cup" scenario is cleaner.
          *   *Scenario:* Two assassins, A and B. A poisons the drink. B was ready to shoot if A failed. The victim drinks and dies.
          *   Indicative: "If A didn't poison the drink, B killed him." (True, because he's dead and only A and B were in play).
          *   Counterfactual: "If A hadn't poisoned the drink, B would have killed him." (True in this setup... wait, I need Counterfactual FALSE).
