      *   **Thesis 1: Equivalence (The "Zero-Cost" Claim)**
          *   *Philosophy:* $P \iff \text{True}(P)$. No extra property.
          *   *PL Mapping:* `assert(p)` vs `assert(TRUE(p))`.
