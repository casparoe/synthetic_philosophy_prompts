  6.  **Final Polish:** Check against the "Thesis by Thesis" requirement. Ensure the "Stretch/Suppression" notes are explicit. (Proceed to generate output based on this structure).

  *(Self-Correction on "Explanation"):* In PL, "explanation" often maps to "causality in execution trace." If a build succeeds, was it because of `TRUE`? No. This maps well.
