          *   *PL Mapping:* Iterating over a stream of AST nodes or policy rules. `forall s in Stream: accept(TRUE(s))`.
          *   *Implementation:* Without `TRUE`, you need to inline every `s`. With `TRUE`, you pass the handle.
          *   *Deflationary Claim:* `TRUE` is just a dereference or eval hook. It enables the loop.
          *   *Inflationary Claim:* `TRUE` validates the *content* against a model of reality (semantic check).
