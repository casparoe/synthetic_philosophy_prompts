          *   *PL Mapping:* Success of the system isn't due to the `TRUE` operator. It's due to the specific predicates inside the policies.
          *   *Implementation:* Performance/Correctness isn't gained by calling `TRUE`. It's gained by the logic `p` implements.
          *   *Deflationary Claim:* `TRUE` adds no optimization hints or verification guarantees.
          *   *Inflationary Claim:* `TRUE` implies a verification pass (e.g., model checking) that *does* explain correctness.
          *   *Assessment:* Slightly stretched. "Explanation" in science vs. "Causal mechanism" in code.
          *   *Stretch:* "Explanation" $\to$ "Causal contribution to runtime state".

