      *   **The Problem:** Both break the one-to-one mapping of persons. Why is $1 \rightarrow 2$ okay (survival) but $2 \rightarrow 1$ not okay (death/new entity)?
      *   **The Question:** Is there an established term for this asymmetry? If not, how to define it rigorously without it just being sloppy identity talk (Motte-and-Bailey)?
