answer: |-
  There isn't a single, capitalized Proper Noun for this (like "The Gettier Problem"), but in the literature, it is standardly referred to as the **Fission-Fusion Asymmetry** or the **Symmetry Problem for Psychological Continuity**.

  You have correctly identified a genuine tension. If you are a strict Psychological Continuity theorist (like Parfit), you *should* treat fusion exactly like fission. In both cases, Relation R (psychological connectedness and continuity) holds between the earlier stage(s) and the later stage. Parfit's own conclusion is that in fusion, just as in fission, identity fails but *survival* succeeds. He argues that both originals survive in the fusion product, just as the original survives in both fission products.

  However, the reaction you are seeing in seminar—accepting survival in fission but denying it in fusion—is a very common intuitive inconsistency. It doesn't have a specific name beyond the descriptive "asymmetry," but you can define the mismatch rigorously to avoid it being a motte-and-bailey. Here is how to conceptualize it:

  ### 1. The Core Mismatch: Continuity vs. Counting
  The inconsistency arises because your seminar peers are switching criteria between the two cases without admitting it.
  *   **In Fission:** They prioritize **Continuity** over **Counting**. They accept that one person can become two because the psychological stream is preserved, even though the numerical count of persons changes (1 $\rightarrow$ 2).
  *   **In Fusion:** They prioritize **Counting** over **Continuity**. They insist that because two persons become one (2 $\rightarrow$ 1), the numerical reduction implies the extinction of the originals, despite the psychological stream being preserved.

  You can define this as the **Selective Enforcement of the One-to-One Constraint**. In fission, the constraint that "one person must correspond to exactly one future person" is waived to allow for survival. In fusion, that same constraint is rigidly enforced to deny survival.

  ### 2. The "Scarcity" Intuition
  The reason this isn't usually noticed as a contradiction is due to an underlying intuitive bias regarding the **Conservation of Subjectivity**.
  *   **Fission** feels like a *gain*. One stream of consciousness becomes two. Nothing is lost; everything is preserved, plus there is "more" of it. It feels generous to say survival occurs.
  *   **Fusion** feels like a *loss*. Two streams of consciousness are squeezed into one slot. It feels like a zero-sum game where one slot must be vacated for the other to enter. Even though the psychology is merged, the intuition is that you cannot fit two "owners" into one "house" without evicting them both.

  This is often called the **Problem of Competing Claims**. In fission, the two successors do not compete for the same physical space; they are distinct. In fusion, the two originals are competing for the *same* future physical space. The intuition that "two people cannot be one person" is a hidden commitment to the **Non-Identity of Indiscernibles** or a **Simple View** of the self (a soul-like entity) that resurfaces only when the physical container doesn't multiply.

  ### 3. How to Frame It Without Equivocation
  To stop this from being a motte-and-bailey (where "survival" means "psychological continuity" in fission but "strict identity" in fusion), you need to force a definition of **What Matters**.

  If "What Matters" is **Relation R** (Parfit's view):
  Then there is no asymmetry. Survival occurs in both cases. Identity fails in both cases. The seminar group is wrong about fusion.

  If "What Matters" is **Identity** (The Common Sense view):
  Then there is no asymmetry. Survival fails in *both* cases. Identity is logically one-to-one. You cannot be identical to two people (fission), and two people cannot be identical to one (fusion). The seminar group is wrong about fission.

  The inconsistency exists only when they claim **Relation R is sufficient for survival in fission, but insufficient in fusion.**

  ### 4. The Technical Definition
  If you need to label this in an essay or discussion, the most precise way to define it is as a violation of the **Only x and y Principle**.

  This principle states that whether $x$ is identical to $y$ should depend only on the intrinsic properties and relations between $x$ and $y$, not on what is happening to *other* people.
  *   In **Fission**, the presence of a *second* successor (the other branch) is what destroys Identity (making it merely survival).
  *   In **Fusion**, the presence of a *second* predecessor (the other merger) is what destroys Survival.

  In both cases, the status of the individual is being determined by external factors (the existence of a rival branch or merger partner) rather than the intrinsic psychological connection.

  ### Summary
  There is no single coined term other than **The Fission-Fusion Asymmetry**. However, you can define the inconsistency as the **Selective Application of the Numerical Constraint**.

  Your seminar peers are implicitly arguing that psychological continuity is robust enough to survive branching (1 $\rightarrow$ 2), but not robust enough to survive merging (2 $\rightarrow$ 1). Parfit would argue this is irrational: if Relation R is what matters, the direction of the arrow (splitting or merging) shouldn't change the outcome. The fact that it does change their intuition proves they are secretly clinging to **Identity** (which requires 1 $\leftrightarrow$ 1) when the scenario feels like "loss," while abandoning it when the scenario feels like "gain."
