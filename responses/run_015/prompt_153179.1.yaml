      *   Use a novel logical constraint. "The Three Switches Problem" variant? No, too long.
      *   Use a "Pattern Validity" task. "Does Rule R generate Sequence S?"
      *   Okay, I will design a specific, novel logical rule for the cards.

      *Revised Plan for Reliability:*
      *   Don't lie about the stats. Make the stats real (based on the room).
      *   No, can't do that in 60 mins.
      *   Must use pre-printed "Established Data."
      *   To prevent cynicism ("The prof is lying"), make the stakes about *calibration*, not just truth. If they suspect the prof is lying, they should still calibrate to the *presented* evidence to win the game.

