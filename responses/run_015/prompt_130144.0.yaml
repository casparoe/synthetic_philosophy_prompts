answer: |-
  Here is a design for a 90-minute session called **"The Excavation."** It is built to force the tension between "cutting losses" and "honoring commitment" without using the forbidden terminology until the end.

  ### The Core Concept
  Teams manage a limited budget of "Effort" (index cards) to dig for "Artifacts" (snacks/prizes). The game has three rounds. Round 1 establishes a baseline. Round 2 introduces a crisis where past investment is at risk. Round 3 tests whether the team has adopted a "quit early" or "finish what you start" policy.

  The payoff relies on **social stakes** (public reputation) and **tangible stakes** (visible snacks), rather than abstract points.

  ---

  ### Materials
  *   **Index Cards:** 100+, cut into quarters. These are "Effort Tokens."
  *   **Dice:** 4 six-sided dice.
  *   **Whiteboard & Markers:** To track team status publicly.
  *   **Snacks (The Payoff):**
      *   1 large, desirable item per person (e.g., a full-size chocolate bar).
      *   1 small, acceptable item per person (e.g., a wrapped hard candy).
      *   *Placement:* Put the chocolate bars in a clear box at the front of the room. Put the candies in a bowl on each table.
  *   **Envelopes:** 4 per team, labeled "Round 1," "Round 2," "Round 3," "Justification."
  *   **Printed Scenario Sheets:** One per team (see Rules below).

  ---

  ### The Rules (Facilitator Script Outline)

  **0:00 – 0:10 | Setup & Stakes**
  1.  **Grouping:** Divide the room into 4 teams of 4–5 people. Seat them around the long table.
  2.  **Currency:** Give each team 20 Effort Tokens (card quarters). This is their total budget for the night.
  3.  **The Goal:** "Your team is an excavation firm. You want to find Artifacts. Artifacts are exchanged for the items in the box at the front." (Gesture to chocolate).
  4.  **The Baseline:** "Everyone gets the hard candy in your bowl right now. That is yours. Keep it. To get the chocolate, your team must finish a Dig."
  5.  **Roles:** Ask each team to assign three roles (write on a card):
      *   *Treasurer:* Holds the tokens.
      *   *Captain:* Announces decisions to the room.
      *   *Scribe:* Writes the "Justification Card" (see below).

  **0:10 – 0:25 | Round 1: The Shallow Dig (Habituation)**
  *   **Scenario:** "Site A is low risk. Cost: 2 Tokens per meter. Depth: 5 meters. Reward: 1 Chocolate Bar per person."
  *   **Mechanic:** Teams pay 10 Tokens total (2 per meter x 5). They roll 1 die. On a 2+, they succeed. (Success is almost guaranteed).
  *   **Action:** Teams pay, roll, succeed, and mark "Complete" on the whiteboard.
  *   **Purpose:** Establishes the norm: *Investment leads to Reward.* It gets them comfortable spending tokens.

  **0:25 – 0:55 | Round 2: The Deep Shaft (The Crisis)**
  *   **Scenario:** "Site B is high potential. Cost: 2 Tokens per meter. Target Depth: 10 meters."
  *   **The Twist (at Meter 5):** Once teams have paid for 5 meters (10 Tokens spent), stop them. Hand them the **Round 2 Envelope**.
  *   **Inside the Envelope:** "Bad News. You have hit bedrock. To reach the target, you must spend 10 *more* Tokens. However, the probability of finding the Artifact has dropped. Roll a die: On a 5 or 6, you find the Artifact (2 Chocolate Bars each). On a 1–4, the shaft collapses. You lose everything invested."
  *   **The Choice:**
      *   **Option A (Quit):** Stop digging. You recover 0 Tokens. You keep your baseline candy. You mark "Abandoned" on the whiteboard.
      *   **Option B (Push):** Pay the remaining 10 Tokens. Roll for the outcome.
  *   **The Constraint:** Before they choose, the *Scribe* must write one sentence on a **Justification Card** explaining *why*. They seal it in the envelope. No one sees it yet.
  *   **The Public Stake:** The *Captain* must stand and announce the decision to the room.
  *   **Facilitator Note:** Do not tell them if quitting is "right." If they ask, say: "That is your decision to make."
  *   **Resolution:** Teams that push roll. Most will likely fail (66% chance). Teams that quit sit out the roll.
  *   **Wrinkle Integration:** This is where the pain happens. They have already spent 10 Tokens. Quitting feels like wasting those 10. Pushing feels like "throwing good money after bad," but also "we came this far."

  **0:55 – 1:15 | Round 3: The Policy Test**
  *   **Scenario:** "Site C is a new opportunity. Cost: 5 Tokens. Reward: 1 Chocolate Bar each."
  *   **The Modifier (Addressing Wrinkles 1 & 3):** Look at the Whiteboard.
      *   If a team marked "Abandoned" in Round 2: Give them a **"Cautious" Token**. Tell them: "You saved resources, but the market sees you as risk-averse. For this round, you must roll a 3+ to succeed."
      *   If a team marked "Complete" or "Pushed" in Round 2: Give them a **"Tenacious" Token**. Tell them: "You have a reputation for finishing. Partners trust you. For this round, you must roll a 2+ to succeed."
  *   **Action:** Teams decide whether to attempt Site C.
  *   **Purpose:** This simulates the *Policy* and *Signaling* value. Quitting saved tokens but cost reputation (higher difficulty). Persisting cost tokens but bought reputation (lower difficulty).

  **1:15 – 1:30 | The Debrief (Mapping the Terrain)**
  *   **Step 1: The Reveal.** Collect the Justification Cards from Round 2. Read them aloud anonymously.
      *   *Predicted Content:* "We didn't want to waste the first 10 tokens." "We're already halfway." "Quitting feels like failure."
  *   **Step 2: The Naming.** Now you can use the phrase **"Sunk Cost."** Define it simply: *Costs already incurred that cannot be recovered.*
  *   **Step 3: Mapping the Wrinkles.**
      *   *The Pure Fallacy:* Point to the teams that pushed in Round 2 *solely* because "we spent 10 tokens already." Ask: "Did those 10 tokens change the odds of the dice?" (No). "Then they were sunk."
      *   *Wrinkle 2 (Asset vs. Sunk):* Ask: "Did anyone argue that the first 5 meters gave you knowledge or equipment for the next 5?" If yes, highlight this. "If the past spend bought you a skill or an asset you still hold, it's not a sunk cost. It's an investment. Did our game distinguish those?" (Likely not, which is a limitation).
      *   *Wrinkle 3 (Signaling):* Point to Round 3. "Some of you had an easier time in Round 3 because of what you did in Round 2. Was sticking with the losing shaft in Round 2 irrational if it bought you an easier win in Round 3?"
      *   *Wrinkle 1 (Policy):* "If you make a rule 'I never quit,' you might lose more digs, but you might finish the one big dig that pays for everything. Is 'never quit' a bad rule?"

  ---

  ### Payoff Scheme (Psychological Bite)
  *   **The Candy:** Everyone keeps the hard candy they were given at the start *unless* they Push in Round 2 and Fail. (Wait, that's too punitive).
  *   **Revised Payoff:**
      *   **Baseline:** Everyone keeps the hard candy regardless. (Safety).
      *   **The Prize:** The Chocolate Bars are distributed *only* to teams that successfully Complete a Dig (Round 1, 2, or 3).
      *   **The Twist:** If a team Pushes in Round 2 and Fails, they are barred from Round 3. They leave with only the hard candy.
      *   **Why this works:** The hard candy is the "status quo." The Chocolate is the "gain." Losing the *chance* at chocolate hurts more than losing points. Being barred from Round 3 creates a consequence for failed persistence.

  ---

  ### Predicted Failure Modes & Mitigations

  **1. The "Meta-Gamers" (Recognizing the Test)**
  *   **Risk:** Someone says, "This is obviously about sunk costs, so we should quit immediately to show we're smart."
  *   **Mitigation:** In the Round 2 briefing, add ambiguity. "Geological surveys are inconclusive. Some teams find gold after bedrock; some don't." Do not confirm the lesson. If they quit to look smart, ask in debrief: "Did you quit because the math said so, or because you wanted to look rational to me?" This exposes *social signaling* as a motivator, which is valid data.

  **2. The "It's Only Candy" Shrug**
  *   **Risk:** Participants treat tokens as abstract numbers.
  *   **Mitigation:** **Visual Scarcity.** Put the 20 tokens in a physical pile. When they spend 10, physically remove half their pile. Make the chocolate box visible and untouched until the end. Say: "These are real. I bought them with my budget."
  *   **Backup:** If the room is flat, add a "Team Penalty." If a team runs out of tokens, they must stand for the rest of the session. (Physical discomfort raises stakes).

  **3. The Contrarian ("I believe in finishing!")**
  *   **Risk:** One participant dominates, insisting on pushing regardless of odds.
  *   **Mitigation:** Empower the *Treasurer*. "The Treasurer holds the cards. If the Treasurer refuses to hand them over, the dig stops." This forces internal negotiation.
  *   **Debrief Use:** This person is your best friend in the debrief. "You argued for persistence. Was it because you thought the odds were good, or because quitting felt like a character flaw?"

  **4. The "Policy" Confusion**
  *   **Risk:** Participants conflate "Sunk Cost Fallacy" with "Grit/Perseverance."
  *   **Mitigation:** You must draw this line sharply in the debrief. "Grit is sticking when the *future* looks good despite present pain. Sunk Cost is sticking when the *future* is unchanged, but you want to justify the *past*."

  ---

  ### Limitations (What This Activity Cannot Do)

  Be frank with your group about these boundaries during the debrief. I am flagging them for you here:

  1.  **The "Policy" Simulation is Weak:** A 90-minute game cannot replicate a lifetime policy of reliability. The "Reputation Token" in Round 3 is a crude proxy for social capital.
      *   *What to say:* "In this game, I gave you a bonus for being tenacious. In real life, that bonus is invisible and delayed. You might not see the payoff of your reputation for years. This game compresses that timeline artificially."
  2.  **Asset vs. Sunk is Blurred:** In the game, the tokens are gone. In real life (Wrinkle 2), the "half-built thing" might have resale value. The game treats all past costs as pure loss.
      *   *What to say:* "In our game, spent tokens vanish. In your life, that degree you're finishing *is* an asset, even if you don't use it. The fallacy is only when the past spend has *zero* residual value. Don't use this lesson to abandon projects that have built real skills."
  3.  **Emotional Stakes are Low:** No matter how much I emphasize the chocolate, it isn't a mortgage or a marriage.
      *   *What to say:* "You felt a tug to quit or stay. Imagine that tug multiplied by fear of poverty or letting down a spouse. The logic is the same, but the emotional weight is heavier."

  ### A Note on Your Three Wrinkles

  You asked me to be frank if your wrinkles collapse or if the "policy" move is overworked.

  *   **Wrinkle 1 (Policy vs. Act):** This holds up. Act-by-act rationality *does* conflict with policy-level rationality. The game handles this via Round 3 (Reputation). However, be careful not to validate *blind* persistence. The policy must be "Finish what is *worth* finishing," not "Finish everything."
  *   **Wrinkle 2 (Asset vs. Sunk):** This is the most dangerous confusion. In your debrief, you must distinguish **Sunk Costs** (money gone, nothing gained) from **Fixed Assets** (money gone, machine built). The activity treats them as the same (tokens spent). You will need to supply the distinction in words.
  *   **Wrinkle 3 (Signaling):** This is robust. Signaling is a rational reason to incur a cost. If staying in the band signals reliability to future employers, it's an investment, not a fallacy. The game captures this with the "Tenacious" token.

  **Final Prediction:** In Round 2, roughly 60% of teams will Push. In the debrief, when you ask *why*, they will cite the tokens spent. That is your teaching moment. When you ask the 40% who Quit *why*, they will cite the odds. That is your counter-example. Let them argue with each other; you only moderate.

  **One last thing:** If a team runs out of tokens in Round 2 and is barred from Round 3, ensure they still get a chocolate bar at the very end if they participated well. Don't let the game make them feel punished for learning. The lesson is the prize.
