          *   *Normative Answer:* Even if invariant, is summing the right SWF?
          *   *Verdict:* The practice is psychometrically defensible *only if* invariance holds and the scale is treated as a latent trait estimate, not raw counts. But the *use* of the sum is normative.

  5.  **Refining the Tone:**
