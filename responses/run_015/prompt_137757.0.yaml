      *   *Ordinalism:* In psychometrics, this is like having separate IRT calibrations with no anchor items and no constraint on $\mu$ or $\sigma$ of $\theta$. Each person is their own scale. No linking possible.
      *   *Unit Comparability:* Constrain slope parameters ($b_i$) to be equal across persons. Intercepts ($a_i$) free. This allows comparing $\Delta u$, but not $u$. Analogy: Temperature in Celsius vs. Fahrenheit. Differences are comparable, absolute values aren't.
      *   *Level Comparability:* Constrain intercepts ($a_i$). Usually implies unit comparability too for full meaning. If only levels, units differ? (Rare in lit, usually Level + Unit = Full). I will clarify this distinction.
      *   *Full Comparability:* Fix $a$ and $b$ across all $i$. One common scale.
      *   *Zero-One Rule:* Min-max normalization. In psychometrics, this is like standardizing based on observed range. Problem: Range is sample-dependent (unlike fixed anchors).
