answer: |-
  Here is the Bongard problem, the analysis, and the honest assessment of what it proves.

  ### The Problem: "The Touching Squares"

  **Vocabulary:** Squares only. Black outlines, white fill.
  **Constraint:** Two squares per panel. No other elements.

  **The Panels (Descriptions)**
  *Note: In a real handout, these would be drawn. Here, the prose is the ground truth.*

  *   **Left 1:** Two squares of identical size touching at a single corner vertex.
  *   **Left 2:** Two squares of identical size touching at a single corner vertex.
  *   **Left 3:** Two squares of identical size touching at a single corner vertex.
  *   **Left 4:** Two squares of identical size touching at a single corner vertex.
  *   **Left 5:** Two squares of identical size touching at a single corner vertex.
  *   **Left 6:** Two squares of identical size touching at a single corner vertex.
      *(Note: Vary the absolute size of the pair across panels 1–6 to prevent "total ink" from being a cue.)*

  *   **Right 1:** Two squares of different sizes touching along a partial edge.
  *   **Right 2:** Two squares of different sizes touching along a partial edge.
  *   **Right 3:** Two squares of different sizes touching along a partial edge.
  *   **Right 4:** Two squares of different sizes touching along a partial edge.
  *   **Right 5:** Two squares of different sizes touching along a partial edge.
  *   **Right 6:** Two squares of different sizes touching along a partial edge.
      *(Note: Vary the absolute sizes and aspect ratios of the pair across panels 1–6 to prevent "total ink" or "bounding box" from being a cue.)*

  *   **Test 13:** Two squares of identical size touching along a partial edge.

  ---

  ### The Rules

  **1. The Intended Rule (Topological)**
  > "Classify as **Left** if the squares touch only at a vertex; classify as **Right** if the squares share a boundary segment."
  *   **Training Performance:** 12/12 correct.
  *   **Test Prediction:** **Right** (They share a boundary segment).

  **2. The Rival Rule (Relational/Metric)**
  > "Classify as **Left** if the squares are the same size; classify as **Right** if the squares are different sizes."
  *   **Training Performance:** 12/12 correct. (By design, all Left panels are equal-sized/corner, all Right panels are unequal/edge).
  *   **Test Prediction:** **Left** (They are the same size).

  **3. The Goodman-Style Rival (Historical/Indexical)**
  > "Classify as **Left** if the panel matches the size-relation of the majority of panels seen so far in the Left column; classify as **Right** if it matches the size-relation of the majority of panels seen so far in the Right column."
  *   *Translation:* This rule effectively says, "If you are a new panel, and you have Equal Size, you belong with the Left group you've already seen."
  *   **Training Performance:** 12/12 correct. (It memorizes the correlation).
  *   **Test Prediction:** **Left** (Because it has Equal Size, which is the property of the Left training set).
  *   *Why this is Goodmanian:* It defines the class membership based on the *history of presentation* ("panels seen so far") rather than an intrinsic property of the panel itself. It is structurally identical to "Grue" (Green before time *t*, Blue after).

  ---

  ### The Check

  **Why Summary Statistics Fail**
  A learner relying on per-panel summary statistics (total ink, bounding box area, number of elements, centroid position) cannot solve this.
  *   **Total Ink:** Varied randomly within both Left and Right sets.
  *   **Element Count:** Constant (2 squares) across all panels.
  *   **Symmetry:** Both Corner-Touching Equal Squares and Edge-Touching Unequal Squares can be constructed to have identical symmetry groups (e.g., D2 symmetry).
  *   **Conclusion:** To solve this, a system *must* detect relations (size comparison, contact type). A bag-of-features model crashes.

  **The Divergence**
  *   **Intended Rule:** Test Panel → **Right**.
  *   **Rival Rule:** Test Panel → **Left**.
  *   **Goodman Rule:** Test Panel → **Left**.

  ---

  ### Honest Assessment: Does This Settle the Argument?

  **Does the intended rule win because it is genuinely more projectible?**
  No. It wins because **you rigged the vocabulary.**
  In the context of geometry, "contact topology" (vertex vs. edge) is often treated as a more fundamental invariant than "metric equality" (same size vs. different size). Why? Because topology survives stretching; metric size does not. If you told the students, "Imagine these shapes are made of rubber," the Intended Rule survives, and the Rival Rule breaks.
  However, if you told the students, "Imagine these shapes are coins minted in batches," the Rival Rule (Same Batch = Same Size) becomes more projectible than the contact rule (which could be accidental arrangement).
  The "projectibility" is not in the data (the 12 panels); it is in the **background ontology** (are we doing topology or manufacturing?).

  **Does this exercise demonstrate anything?**
  It demonstrates your point: **The data underdetermines the concept.**
  The 12 panels contain identical information content for both rules. The choice between them is a prior. If your friend's ML model picks the Intended Rule, it is not because it "learned concepts" better than a model that picks the Rival Rule; it is because the model's architecture or pre-training has a bias toward topological features over metric features. That bias *is* the concept, not the induction from the 12 panels.

  **Where would a first-year student get stuck?**
  1.  **Ambiguity of "Touching":** In ASCII or sloppy drawing, a near-miss looks like a touch. They might try to measure pixel gaps (summary stat) rather than reasoning about connectivity.
  2.  **Overfitting the Size:** They will notice the size correlation immediately. It is cognitively cheaper to check "Same/Different" than "Vertex/Edge." You will have to convince them that Size is the distractor.
  3.  **The Test Panel:** They will feel betrayed by the Test Panel. "You lied to us," they'll say. "The pattern was clearly size." This emotional reaction *is* the data point you want for the seminar.

  **What counts as designing the problem badly?**
  1.  **Baroque Panels:** If you use 6 elements instead of 2, the relational graph becomes too hard to parse. Keep it minimal.
  2.  **Sneaking the Answer:** If all Left panels are small and all Right panels are large, "Total Ink" solves it. You must vary absolute size within groups.
  3.  **Background Knowledge:** If the rule requires knowing "Squares have 4 vertices," that's fine. If it requires knowing "Squares are used in architecture," that's culture-specific. Stick to geometry.

  **What your friend would say to defuse it**
  She will say: *"You're treating 'bias' as a dirty word. Human concept learning isn't tabula rasa; we have inductive biases built into our visual cortex (e.g., preference for continuity, topology). If a neural net has a bias toward topology because of its convolutional layers, that's not 'rigging,' that's 'architecture.' The model isn't learning the concept from the 12 panels alone; it's learning which of its pre-existing concepts applies. That's exactly what humans do."*

  **Her point is strong.** She will argue that the "Intended Rule" feels natural *only* because your students share your topological priors. If you ran this seminar on a planet where objects change size but never change connectivity, the Rival Rule would be the "Intended" one.

  **Which spec is doing the impossible work?**
  The spec: *"Show me... whether the intended rule wins because it is genuinely more projectible."*
  This is impossible. **Projectibility is not a property of the rule; it is a property of the rule relative to a world model.** You cannot demonstrate "genuine projectibility" in a vacuum. You can only demonstrate "projectibility relative to the priors of the observer."
  By building this problem, you haven't proven that ML lacks concept learning; you've proven that **concept learning always requires priors.** Your friend will claim that having priors *is* what learning is. You will claim that having the *right* priors is what makes it human. The Bongard problem cannot distinguish those two claims; it only exposes the gap between them.

  ### Recommendation for the Seminar
  Use the problem to force the students to **argue for the rule**, not just find it.
  1.  Show the 12 panels.
  2.  Ask for the rule. (Half will say Contact, half will say Size).
  3.  Show the Test Panel.
  4.  Ask: "Who was right?"
  5.  Reveal: "I, the designer, intended Contact."
  6.  Ask: "Why did I intend that? What do I know that you don't?"
  7.  **Conclusion:** The "concept" wasn't in the panels. It was in the designer's head. The ML model isn't finding the concept; it's guessing the designer's bias.
