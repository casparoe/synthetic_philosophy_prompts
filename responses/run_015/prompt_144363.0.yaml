answer: |-
  Your intuition that the current rubric is broken where the philosophical distinction bites is correct, and your three-way distinction between stating the rule, practised performance, and transfer is a robust framework for fixing it. However, to build a procedure that works for seventeen-year-old tutors, we must decide which of these actually constitutes knowing how in the context of school mathematics. I argue that transfer is the real test of knowing how, while the ability to explain is merely knowing that. Knowing that involves possessing propositional knowledge about the steps, which can be recited without the ability to execute them, whereas knowing how is a disposition to succeed in action. The strongest argument against this view is that explanation ensures robustness and prevents rote learning, suggesting that a student who cannot explain their steps is liable to fail when the rote memory fades. The rebuttal is that robustness is demonstrated by successful transfer, not by verbalization. If a student can apply the method across different contexts, they have the pattern recognition required to sustain the skill, even if they lack the vocabulary to describe it. Philosophy settles that these are distinct states, but it does not settle where the passing line should be drawn. We are going past what the philosophy settles when we decide that transfer is sufficient for a sign-off without explanation, because a school could legitimately value the meta-cognitive safety net of explanation over raw performance. We are also going past what it settles when we decide how much variation constitutes sufficient transfer, as that is a pedagogical judgment about the curriculum rather than a philosophical truth about knowledge.

  The procedure for the last ten minutes of the session should run as a strict sequence to minimize tutor discretion. First, the tutor must verify agency by reviewing the preceding twenty minutes to ensure the student solved at least two problems without substantive prompting, where substantive means any hint that reveals the next step rather than just encouraging focus. If the student required prompting to succeed, the session ends with a no sign-off regardless of the final result, because the success was not theirs. Second, the student is given one standard problem identical in format to the practice sheet to confirm practised performance. If they fail this, the session ends with a no sign-off, as they have not even secured the routine skill. Third, if the standard problem is passed, the student is handed a worked example containing a deliberate structural error, such as a sign error in algebra or a misaligned decimal, and asked to find and correct it. This serves as the transfer test because it requires them to apply the rule to a novel situation without the cognitive load of full execution, isolating the method from arithmetic slips. If they identify the error, they pass the session. If they fail to identify the error, the session ends with a no sign-off, but the tutor must note the result for human review rather than making a final decision themselves. The procedure must stop and hand the decision to a person if the student passes the standard problem but fails the transfer check, or if the student has a formal accommodation. In the case of inconsistency, such as performing well on Tuesday and going blank on Thursday, the procedure dictates that a single session never grants a sign-off if there is a recorded failure in the previous session for the same unit. The student must pass two consecutive sessions to sign off, which smooths out bad days without requiring philosophical judgment from the tutor. For accommodations like extra time or a quiet room, the transfer test must be administered under the same conditions, and the sign-off card must be stamped to indicate the accommodation was used, leaving it to the teacher to decide if the accommodation masks a lack of skill, which is a policy question about fairness rather than a factual question about competence.

  Running this procedure on your three students yields clear but difficult verdicts. Aisha passes the agency check and can recite the steps perfectly, but she fails the standard problem on paper. The procedure stops at step two. She does not sign off. The work shows that while she possesses knowing that, she lacks knowing how, and signing her off would set her up to fail the unit test because the test requires execution, not recitation. Marcus passes the agency check and passes the standard problem, getting every question right on the practice sheet. However, he fails the transfer test where the move is buried inside a word problem. The procedure stops at step three. He does not sign off. The work shows he has practised performance but not transfer, and signing him off would be dangerous because the unit test will inevitably vary the surface features. Dev passes the agency check and fails the standard problem initially due to arithmetic errors with large numbers, but when given the error-spotting task with small whole numbers, he identifies the mistake reliably. However, your description says he gets the right answer reliably across formats with small numbers but is lost with letters or large ones. If the transfer test uses letters or large numbers, he fails. If the transfer test is restricted to his scope, he passes. Assuming the unit requires handling letters, he fails the transfer test. However, if we judge him on what he can do, he passes the transfer test within his scope but fails the standard problem if it requires large numbers. Let us assume the standard problem matches his competence level. He passes standard and transfer but cannot explain the steps. The procedure grants a sign-off. The work shows he has knowing how without knowing that.

  The verdict the department will resist is the sign-off for Dev. Teachers are trained to value explanation as evidence of understanding, and a student who cannot explain a step is often viewed as guessing or lacking deep comprehension. You should defend this verdict by pointing out that the unit test will not ask Dev to explain his work but to solve problems, and his transfer success proves he can do exactly that. Denying him a sign-off because he cannot articulate the rule punishes him for a lack of verbal skill that is not being assessed in the final exam, and it risks disengaging a student who demonstrably has the competence we claim to be measuring. We are measuring the ability to do mathematics, not the ability to talk about it, and while talking about it is useful for teaching, it is not the skill being gated. If the department insists on explanation, they are changing the goal from competence to meta-cognition, which is their right, but they must acknowledge that they are no longer testing knowing how.

  You need an honest note on what this procedure cannot do. It will produce false refusals for students who understand the method but suffer from acute performance anxiety during the ten-minute check, as the procedure treats anxiety-induced failure as a lack of skill. You should expect this to happen in roughly one in twenty cases, skewed toward students who are otherwise competent but lack confidence. It will also produce false approvals if a tutor fails to notice subtle prompting during the main session, as the agency check relies on tutor honesty and observation. The procedure should not be applied to skills that are purely memorative, such as recalling multiplication tables or geometric definitions, because transfer is not the relevant metric for rote knowledge. For those skills, the standard problem is sufficient. Finally, the procedure cannot resolve disputes about whether a specific variation counts as transfer, such as whether changing a quadratic equation from standard form to vertex form is a surface feature change or a new skill. Those boundaries must be set by the head of department, because that is a curriculum decision, not a philosophical one. By separating the factual checks from the policy decisions, you protect the tutors from having to make judgments they are not equipped to make, and you ensure that the sign-off card reflects what the student can actually do rather than how well they can perform for the tutor.
