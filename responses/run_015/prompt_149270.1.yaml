      *   **Key Philosophical References to Keep in Mind:**
          *   David Chalmers (Modal Rationalism, Zombies).
          *   Saul Kripke (Water/H2O, Necessary A Posteriori).
          *   Peter Yablo (Conceivability and Possibility).
          *   Type-A vs. Type-B Materialism.
