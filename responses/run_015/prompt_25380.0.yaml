  10. **Final Polish:** Ensure the distinction between *incommensurability* (no common measure) and *incomparability* (no relation) is clear, as the "apples and oranges" phrase often conflates them. The proponent argues for incomparability based on incommensurability. This is a key philosophical pivot point.

