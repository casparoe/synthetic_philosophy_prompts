answer: |-
  This is a high-quality disagreement. You and your friends have stumbled onto one of the persistent fault lines in political philosophy and ethics. The debate isn't just about semantics; it's about the metaphysics of groups and the morphology of moral concepts.

  Here is the adjudication, move-by-move, followed by the philosophical mapping of the tension.

  ### Round 1: The Definition of Guilt

  **Friend A's Opening:** *Guilt is structural/diachronic. Institutions carry obligations/wrongs across generations. Citizens bear the state's moral status by participation.*

  *   **What A gets right:** A is actually being more faithful to Karl Jaspers' specific text (*The Question of German Guilt*, 1947) than B realizes. Jaspers explicitly distinguished **Political Guilt** from **Moral Guilt**. For Jaspers, Political Guilt *is* structural. It applies to all citizens regardless of individual action because they are beneficiaries and subjects of the state. A is correct that in legal and political theory, entities *do* carry status across time (sovereign debt, treaties).
  *   **What A gets wrong:** A risks conflating "being the locus of an obligation" with "being guilty." In common moral parlance, guilt implies a stain on the *agent*, not just the ledger. By calling it "guilt" rather than "liability," A invites the confusion B attacks.

  **Friend B's Response:** *Guilt is first-person/affective/agency-based. Calling it guilt is rhetorical sleight-of-hand. Entities don't feel; this is bookkeeping, not guilt.*

  *   **What B gets right:** B is defending the standard analytic definition of moral culpability. Guilt typically requires *mens rea* (a guilty mind) or at least the capacity for alternative action. B correctly identifies the risk: if guilt is detached from agency, it becomes a tool for collective punishment or shame without cause.
  *   **What B gets wrong:** B is employing **Methodological Individualism** too rigidly. We routinely accept that corporations, states, and universities act, speak, and owe debts. If a corporation pollutes a river and dissolves, then reforms under a new name, we hold the new entity liable. B dismisses this as "bookkeeping," but bookkeeping *is* the language of political obligation.

  **Adjudication:** **Draw.** A is right about *political* reality; B is right about *moral* phenomenology. They are using the word "guilt" to point at two different categories (Political Liability vs. Moral Culpability).

  ### Round 2: Objective Guilt vs. Reification

  **A's Counter:** *Guilt doesn't have to be affective. Objective guilt (being in the wrong) persists if the institution persists. It's not inheritance; it's participation in a structure that owes repair.*

  *   **What A gets right:** The distinction between guilt and shame is vital. Shame is affective (how I feel); guilt can be objective (the state of affairs regarding a norm violation). A correctly notes that you can be "in the wrong" without feeling bad about it.
  *   **What A gets wrong:** A hasn't fully solved the **Agency Problem**. If the institution "owes repair," who pays? Current taxpayers. Why? Because they participate. But "participation" in a democracy is often non-voluntary (you are born into it). A needs to explain why *passive* participation generates *active* guilt.

  **B's Counter:** *Objective guilt applies to actions, not groups over time. "State owes reparations" ≠ "State is guilty." This is reification (treating a construct as a biographical agent). If this works, is my family guilty?*

  *   **What B gets right:** The **Reification Charge** is the strongest philosophical objection here. To say a state is "guilty" implies the state has a moral biography comparable to a human. B correctly identifies that without a mechanism to block the "Great-Grandfather" analogy, A's theory leads to absurdity (blood-and-soil guilt).
  *   **What B gets wrong:** B creates a false dichotomy between "remedy" and "moral status." In restorative justice, the obligation to provide a remedy *constitutes* the acknowledgment of the wrong. Denying the "guilt" label while accepting the "reparation" obligation is semantically unstable.

  **Adjudication:** **Edge to B.** B successfully identifies that A is smuggling a moral category (guilt) into a legal category (liability) without explaining the metaphysical glue. However, B's reductio (the family analogy) is weak because states have formal continuity that families do not.

  ### Round 3: Conditions and Continuity

  **A's Closing:** *Cases are blocked by conditions: institutional continuity, democratic participation, benefit from the wrong. We already treat groups as moral agents (corporate liability).*

  *   **What A gets right:** This is the standard move in **Collective Responsibility** literature (e.g., Larry May, Christopher Kutz). By adding conditions (benefit, continuity), A moves from "collective guilt" to "complicity." If you benefit from an injustice and sustain the institution that perpetrated it, you incur an obligation.
  *   **What A gets wrong:** "Benefit" is notoriously hard to define. Does breathing air in a country built on stolen land count? If the threshold is too low, B's collective punishment worry returns. If too high, the guilt vanishes.

  **Adjudication:** **A stabilizes the position.** By adding conditions, A moves away from "metaphysical guilt" toward "obligations of justice." This concedes B's point that it isn't a *stain*, but maintains that the *obligation* is real.

  ---

  ### The Philosophical Mapping

  You asked if this tension has a name. There is no single capitalized "The [Name] Problem" (like the Gettier Problem), but this specific tension is the central debate in **Collective Moral Responsibility** and **Intergenerational Ethics**.

  However, the specific gap you identified—between institutional persistence and non-transferable moral affect—is best described as **The Tension between Diachronic Collective Agency and Individual Culpability.**

  Here are the specific concepts you are dancing around:

  1.  **Non-Summativism vs. Methodological Individualism:**
      *   **A is a Non-Summativist:** She believes the group has properties (guilt/obligation) that are not reducible to the sum of its current members' properties. (See: **Margaret Gilbert's** *Joint Commitment* or **Philip Pettit's** *Group Agency*).
      *   **B is a Methodological Individualist:** He believes only humans have moral status. Groups are fictions. (See: **Jan Narveson**).

  2.  **Liability vs. Culpability:**
      *   This is the semantic heart of the fight.
      *   **Culpability (B's view):** Requires blameworthiness, agency, and often affect.
      *   **Liability (A's view):** Requires obligation to repair, regardless of fault. (e.g., Strict Liability in law).
      *   **The Conflict:** A wants to call Liability "Guilt." B says that's category error. **Jaspers** actually sided with B here: he called it "Political Guilt" but explicitly stripped it of moral blame to avoid exactly B's objection.

  3.  **The Non-Identity Problem (Partial Match):**
      *   Derek Parfit's **Non-Identity Problem** usually applies to future generations, but the logic applies here. If the state changes enough over time, is it the *same* agent? If the citizens are different, can they be guilty? A argues for **Numerical Identity of the Institution**; B argues for **Moral Discontinuity of the Membership**.

  ### Who is "Right"?

  **On Metaphysics:** **A is stronger.** We *must* treat states as continuous agents to make sense of treaties, debts, and sovereignty. If B is right, the US government today has no obligation to honor a treaty signed in 1800 because the "agents" are dead. That breaks international order.

  **On Morality:** **B is stronger.** Moral guilt is inherently tied to the capacity for choice. To tell a 25-year-old they are "guilty" of a 1945 atrocity in a moral sense is psychologically coercive and philosophically incoherent.

  **The Synthesis:**
  They are both right about different things, which is why they are talking past each other.
  *   **A** is describing **Political Liability**. (The state owes repair; citizens fund the state; therefore citizens owe repair).
  *   **B** is describing **Moral Culpability**. (The individual did not commit the act; therefore the individual is not blameworthy).

  **The Verdict:**
  The stalemate resolves if they agree to stop using the word "Guilt."
  *   If A calls it **"Structural Obligation"** or **"Political Liability,"** B's objection regarding affect and agency dissolves.
  *   If B acknowledges that **"Liability without Culpability"** is a coherent legal and political category (like inheriting a debt), A's point stands without requiring him to feel "stained."

  **What they are both missing:**
  They are missing the concept of **Complicity**.
  Current citizens aren't "guilty" of the past act (A's risk), nor are they "innocent bystanders" (B's hope). They are **complicit beneficiaries** of an ongoing structure. This preserves B's demand for agency (you choose to stay/benefit/participate) while validating A's demand for structural continuity (the structure is the vehicle of the wrong).

  **Recommendation:** Tell them to read **Christopher Kutz's *Complicity: Ethics and Law for a Collective Age***. It bridges exactly this gap: how individuals bear responsibility for collective harms without needing to be the direct causal agents.
