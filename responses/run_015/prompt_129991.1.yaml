      *   **The Normative Gap:** Dedicate a section to the "Is-Ought" problem. This addresses the user's specific question about whether these claims justify stopping parity policies.
      *   **Conclusion:** Summarize the weakness in the friend's argument.

  7.  **Refining the Content (Self-Correction during drafting):**
