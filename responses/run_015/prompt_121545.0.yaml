  This is a structural failure manifesting as a Dollar Auction, not merely a cognitive sunk-cost fallacy. In a standard sunk-cost error, actors irrationally value past investment; here, the departments are responding rationally to a perverse incentive structure we enabled. By allowing sequential, visible bidding (feasibility studies) without a closing mechanism, we created a game where stopping guarantees a loss of capital, while continuing offers a probabilistic chance to recover status and amortize costs. The failure is institutional design: we acted as auctioneers without a reserve price. Treating this as psychological bias ignores the payoff matrix driving their behavior. Until we change the rules of the game, rational actors will continue to escalate commitment to minimize certain losses. The distinction matters because training won't fix this; only structural intervention will. We are witnessing escalation of commitment driven by loss aversion, not simple stubbornness.

  **Why "ignore the sunk costs" doesn't settle it**
  Telling actors to "ignore sunk costs" fails because it demands they accept a certain loss now for an uncertain gain later. For the Physics and DH leads, the $180k and $150k are not historical abstractions; they are budget holes they must answer for to their faculty and donors. As long as winning the building allows them to justify those expenditures as necessary groundwork, the marginal cost of another $40k bid is logically preferable to writing off the previous spend entirely. The advice fails because it addresses psychology, not the economic reality that their career capital and departmental stability are tied to the outcome. We cannot think our way out of a game we must redesign. Rational escalation looks identical to irrational commitment from the outside, but the internal calculus is sound given the broken rules. Loss aversion makes the pain of realizing the loss greater than the cost of another bid.

  **The strongest case for letting it run to a decision anyway**
  Proponents argue that allowing the process to conclude organically preserves departmental autonomy and perceived legitimacy. If the Committee imposes a decision, the losing side may view the outcome as administrative overreach, potentially sabotaging cooperation or future fundraising efforts. Furthermore, there is a non-zero chance the additional studies uncover latent risks not yet visible, ensuring the winner is truly viable before construction begins. There is also the Committee's own reputation; admitting the process is broken acknowledges two years of oversight failure. Letting it run maintains the illusion of procedural fairness and competitive meritocracy, however flawed, and avoids immediate conflict. It bets that the eventual winner's success will outweigh the cost of the escalation. It also allows the winner to claim full ownership of the vision, increasing buy-in during implementation.

  **Recommendation**
  We must act as the circuit breaker. I move we deny both $40k requests effective immediately. The Committee will convene a special session within 30 days to select the proposal based on predefined strategic metrics (enrollment impact, interdisciplinary reach, maintenance liability). We will communicate that further departmental spending will not influence the decision. To soften the blow, the losing department receives written priority for the next available renovation space. This stops the auction without rewarding the escalation. We must announce this decision in writing to both Department Chairs by next Friday to prevent further budgetary commitments. The Committee Chair will draft the communication for Provost approval by Wednesday. We need to lock the decision date on the calendar now to prevent drift. The Provost must sign off on the denial of funds to shield the Committee from direct pressure.

  **The two mechanisms: salvage rule and fresh-eyes rule**
  The "Salvage Rule" (25% reimbursement) is dangerous. While it lowers the stakes enough to stop bidding, it institutionalizes moral hazard: future departments will learn that overspending triggers subsidies. It solves this game by breaking the next one. It should only be considered if framed explicitly as a one-time "conflict settlement" funded by central reserves, not the bequest, with a public memo forbidding precedent. However, even then, it rewards irresponsibility. The "Fresh-Eyes Rule" addresses the Committee's sunk costs but ignores the departments'. New decision-makers inherit the same escalated bids. Unless their mandate explicitly forbids considering past spend (which is hard to enforce), the departments will continue signaling commitment through spending. Neither mechanism fixes the core incentive; only a hard stop does. The moral hazard objection largely kills the salvage rule as policy, though it could function as a one-off peace treaty if strictly ring-fenced. The sizing matters less than the signal: reimbursement signals that spending is recoverable; priority signaling signals that patience is rewarded. If we must use salvage, it must be announced as a "settlement" not "reimbursement," funded centrally to avoid draining the bequest, and capped strictly. But the risk remains that future actors view this as a bailout template. The fresh-eyes rule is merely procedural delay disguised as innovation.

  **What to expect from the two members who'll push back**
  Expect the Physics Chair to argue that stopping now wastes donor intent if their plan is superior. Expect the Provost's rep to worry about litigation or grievance filings from the losing side. Both will frame the hard stop as "administrative overreach." Prepare to remind them that allowing further spend is the actual overreach into departmental budgets. They will appeal to fairness; counter with sustainability. They will privately worry about their own legacy; remind them that stopping the bleed is the legacy.
