  11. (Final check on Ruth Chang's specific claim): She argues against the "trichotomy thesis" (better, worse, equal). She proposes a fourth relation: "on a par." And she argues for "hard choices" as opportunities to exercise normative power. I need to ensure the MOO translation captures the "fourth relation" aspect (which is just non-dominatedness) and the "normative power" aspect (which is the hard part).

