      *   Chang's "Will-based Reasons": In MOO, this is like adding a regularization term *after* the fact to justify the choice. $J(x) = f(x) + \lambda \cdot \mathbb{I}(x = x_{chosen})$.

  8.  **Final Polish:**
      *   Ensure tone is respectful and intellectually rigorous.
      *   Make sure the "Residue Report" is distinct and clear.
      *   Check against the prompt's specific questions (Is it right? Is it flattening? Does it exist in vocabulary? Gap or flaw?).

      *(Self-Correction during drafting)*: I need to be careful not to say MOO *can't* model dynamic changes. It can. But standard *decision support* MOO assumes the preferences are pre-existing. The key distinction is *ontological*: Do the weights exist before I pick? MOO says yes (latent). Chang says no (created). This is the crucial residue.

