      *   **User's Hypothesis:** "Incommensurability" = "Refusal to commit to a scalarization function." "Creating value" = "Arbitrary pick among non-dominated options."
      *   **User's Suspicion:** They might be flattening the concept. Their MOO framework assumes fixed objectives. Chang suggests choices *change* what matters (the objective function itself).
      *   **Specific Questions to Answer:**
          *   Is the user's instinct right, or are they flattening something?
