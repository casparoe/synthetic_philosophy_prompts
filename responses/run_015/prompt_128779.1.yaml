          *   How to cleanly separate production from recognition?

  2.  **Deconstruct the Core Arguments:**

      *   **Argument 1: Feature Lists Fail.**
          *   *Validity:* High. Hofstadter's *Fluid Concepts and Creative Analogies* explicitly argues against rigid feature detection. A lowercase 'a' in a sans-serif font (two stories) vs. a handwritten 'a' (one story) shares almost no geometric features.
      *   **Argument 2: Functional Equilibrium/Negative Space.**
          *   *Validity:* Interesting, but arguably secondary. Negative space is crucial for legibility, but is it *definitive*? A 'd' is an 'a' with the stem on the other side, but the negative space topology is similar. This might be too geometric still.
      *   **Argument 3: Kinematic/Gestural Trajectory (Motor Theory).**
          *   *Validity:* Strong historical and cognitive precedent. Liberman's Motor Theory of Speech Perception is the phonetic parallel. In handwriting recognition, dynamic features (stroke order, direction) are often more robust than static pixels.
          *   *Concern:* "Smuggling phonetics." The user is worried they are saying "it's an 'a' because it makes the /a/ sound." That's *not* what motor theory says. Motor theory says "it's an 'a' because it's produced by the *articulatory gesture* for 'a'." In handwriting, it's the *graphic gesture*. Need to clarify this distinction.
