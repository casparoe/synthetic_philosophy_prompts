answer: |-
  Good evening.

  For those of you who don't know me, I've had the privilege of working closely with [Advisor's Name] for the last several years. And for those of you who do know me, you know that standing here to summarize a career like hers feels a bit like trying to describe the color blue to someone who has only ever seen black and white.

  There is a famous thought experiment in our field called the Experience Machine. Imagine a tank where you could be plugged in for the rest of your life. In that tank, you would feel happy. You would feel excited. You would feel the rush of accomplishment, the warmth of love, the thrill of discovery. But none of it would be real. It would be a simulation.

  Most people, when asked, say they wouldn't plug in. They say they want to *do* things, not just feel like they've done them. But [Advisor's Name] always asked a different question. She asked: Why do we want to plug in at all?

  She suggested that the urge to plug in comes from a sense of lack. We want the rush of excitement because we are bored. We want the warmth of love because we feel isolated. We want the thrill of discovery because we are confused. In her view, these positive feelings aren't additions to our lives; they are corrections. They are the sound of a problem being solved. And once the problem is gone, the noise should stop.

  She called this the silent axis. It's a technical term for some in this room, but for everyone here, I think it translates to something simpler: Integrity.

  To live on the silent axis is to live without manufacturing needs. It is to recognize that a life doesn't need to be a jagged line of peaks and valleys to be valuable. It can be a straight, steady horizon.

  Now, I know what some of you are thinking. You're thinking, "That sounds cold." You're thinking that a retirement toast should be about wishing her joy, excitement, and endless happiness. But to wish her that would be to misunderstand her entirely. To wish her constant excitement would be to wish her constant disturbance. It would be to wish that she always has an itch, just so she can have the pleasure of scratching it.

  I have watched [Advisor's Name] guide students through their most panicked moments. She never offered them hype. She never told them to "chase their dreams" or "follow their passion." Those are noisy things. Instead, she offered them clarity. She helped them remove the confusion that was causing them pain. When a student finally understood a difficult concept, she didn't cheer. She just nodded. The need was gone. The silence returned. And in that silence, there was more care than I have ever seen in a shout.

  To her family: You know this better than anyone. You know that her love wasn't in grand gestures or loud declarations. It was in the reliability of her presence. It was in the fact that when you walked into a room, the temperature didn't spike. It settled. She made space for you to exist without demanding that you perform happiness for her sake.

  So, as she steps away from the university, I will not wish her a life filled with new thrills. I will not wish her a calendar packed with adventures, because adventure is just a polite word for uncertainty, and uncertainty is a kind of burden.

  Instead, my wish for her is this:

  May your days be unbroken.
  May you encounter no needs that demand fixing.
  May the world leave you alone, exactly as much as you wish to be left alone.
  And may you find, in the quiet of the morning and the stillness of the evening, that nothing is missing.

  There is a specific kind of freedom in not having to be happy. It is the freedom to simply *be*. She has spent a lifetime defending that freedom in theory. Now, she gets to live it in practice.

  So, if everyone could please raise their glasses.

  We are not drinking to the high points. We are not drinking to the future. We are drinking to the absence of the unnecessary.

  To the quiet. To the steady. To [Advisor's Name].
