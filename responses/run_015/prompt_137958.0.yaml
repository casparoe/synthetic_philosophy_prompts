prompt: |-
  hi — i’m putting together some notes on the omnipotence paradox and i got stuck on this bit from Aquinas’s Summa Theologica (First Part, Question 25, Article 1, ‘Whether there is power in God?’). i’m useing an old public-domain translation, so the wording is kinda creaky. here’s the passage:

  "I answer that, Power is twofold---namely, passive, which exists not at all in God; and active, which we must assign to Him in the highest degree. For it is manifest that everything, according as it is in act and is perfect, is the active principle of something: whereas everything is passive according as it is deficient and imperfect. Now it was shown above (Q[3], A[2]; Q[4], AA[1], 2), that God is pure act, simply and in all ways perfect, nor in Him does any imperfection find place. Whence it most fittingly belongs to Him to be an active principle, and in no way whatsoever to be passive. On the other hand, the notion of active principle is consistent with active power. For active power is the principle of acting upon something else; whereas passive power is the principle of being acted upon by something else, as the Philosopher says (Metaph. v, 17). It remains, therefore, that in God there is active power in the highest degree."

  i sort of get that he’s saying God has active but not passive power, but i don’t really get why that matters for the paradox — like, why the move from ‘God is pure act’ to ‘active power in the highest degree’ is supposed to be an answer to the classic worries (‘can God make a stone too heavy for him to lift?’ or ‘can God make the past not have been?’). could you walk me through the argument in the passage step by step, and translate the key moves into modern-ish terms?

  then please use the passage to tackle a weird case i made up: suppose a being can actualize any state of affairs whose full description doesn’t entail a contradiction. suppose also that, necessarily, if a city was founded in 1000, then God knew in 900 that it would be founded. could that being make it such that the city was not founded in 1000, even though God knew in 900 that it would be founded? is that the kind of ‘task’ that, according to this passage, isn’t really a task for Aquinas — maybe because it would involve passive power, or because it implies a contradiction, or because it isn’t a ‘thing’ at all? why or why not?

  also, a freind of mine (who reads too much theology) said something like: on this passage, Aquinas isn’t lowering the bar for omnipotence so much as re-describing what a ‘doable thing’ is — the only things God ‘can’t’ do aren’t genuine tasks. i’m not sure i buy it, so tell me whether that’s a fair reading of the passage or whether it sneaks in something Aquinas wouldn’t accept.

  please separate what is settled from what is genuinely contested among people who know this material. what is agreed about how Aquinas understands active vs passive power here, and about how this article fits his bigger treatment of omnipotence? where do interpreters really disagree — for example, about whether his ‘cannot do what implies a contradiction’ move is a substantive limitation on omnipotence or just a grammatical/verbal point, or about whether the stone paradox even targets the same notion of power Aquinas is working with? don’t present a contested reading as the consensus; if there’s no consensus, say so explicitly. and if you’re unsure whether some bit of the passage (or its Latin/translation history) is ambiguous, flag it instead of glossing over it.

  thanks!
