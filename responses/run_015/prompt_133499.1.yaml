answer: |-
  Consider a modernized version of Montaigne's mirror: on one side, a state execution carried out via lethal injection, preceded by decades of appeals, signed waivers, and judicial oversight; on the other, a ritual killing performed by an indigenous group, preceded by communal consensus, spiritual divination, and the victim's lifelong cultural conditioning to accept the fate. Descriptively, both acts result in the same ontological outcome—the extinguishing of a human life by a collective decision. The conceptual slip occurs the moment you attempt to explain why the paperwork morally neutralizes the state's violence while the ritual does not neutralize the tribe's.

  To maintain Montaigne's symmetry, you must argue that the signed waiver and the spiritual vow function identically as mechanisms of consent. This is where descriptive cultural relativism—the observation that Europeans use forms and tribes use vows—slips into normative moral pluralism—the claim that both forms generate equally valid moral permission to kill. If you accept this slip, you concede that the state possesses no unique moral authority, only a different administrative vocabulary. If you reject the slip and insist the paperwork matters morally, you reveal that "barbarism" is not a judgment on the pain or the loss of life, but a jurisdictional claim that only the State holds the license to destroy bodies. The mirror forces you to admit that our horror is not triggered by the act of killing itself, but by the lack of a bureaucratic signature to authorize it.

  The charge of barbarism ultimately measures not the cruelty of the act but the legitimacy of the authority authorizing it.
