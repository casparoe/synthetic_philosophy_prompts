      *(Self-Correction on Scapegoat Drift)*: CF predicts it *will* happen. RF predicts it *can be prevented*. The test is historical data on no-fault schemes.

      *Final Polish:* Check the voice. It needs to sound like a joint statement, not an essay about them. "We, the undersigned..."

