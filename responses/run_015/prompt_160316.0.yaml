      *(Self-Correction during drafting)*: In Section 2, for "Collective Culpability," an empirical test is hard. I should note that this is largely conceptual/normative but point to a proxy (e.g., organizational behavior changes). Actually, the prompt says "Where a crux admits no feasible test, say so." I will do that for the metaphysical aspect but keep the behavioral proxy for the empirical aspect.
