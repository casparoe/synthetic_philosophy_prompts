answer: |-
  You have stumbled onto one of the most common and understandable reactions to Hofstadter's column. Your intuition is grounded in standard game theory (specifically Causal Decision Theory), which makes Hofstadter's argument look either like a mistake or a restatement of the obvious.

  However, you are going wrong on one crucial factual claim: **Superrationality does not pick the Symmetric Nash Equilibrium.** In the one-shot Prisoner's Dilemma, they pick opposite things.

  Here is where the disconnect is, and why superrationality claims to offer something distinct (even if you remain skeptical of its validity).

  ### 1. The Core Misunderstanding: Cooperation vs. Defection
  You wrote: *"if so it buys you nothing in the one-shot prisoner's dilemma, where mutual defection is the only symmetric equilibrium anyway."*

  *   **Nash Equilibrium:** In a one-shot PD, the only Nash Equilibrium is **(Defect, Defect)**. It is symmetric, but it is suboptimal.
  *   **Superrationality:** Hofstadter explicitly argues that superrational players will choose **(Cooperate, Cooperate)**.

  Superrationality is not looking for the best *equilibrium* (where no one has an incentive to deviate given the other's fixed move). It is looking for the best *outcome* assuming that your move and the other player's move are logically correlated.

  If superrationality just led to Defection, Hofstadter wouldn't have written the column. The entire point is that he believes rational agents *should* and *would* cooperate in a one-shot PD if they recognize their reasoning is identical.

  ### 2. The Mechanism: Causal vs. Logical Correlation
  Your critique relies on standard dominance reasoning: *"Defecting is better for me no matter what he does."*

  This is true under **Causal Decision Theory (CDT)**, which underpins Nash Equilibrium. CDT says: "My choice is a physical action that happens *now*. It cannot causally affect what the other player decided in their head simultaneously. Therefore, I treat their move as fixed probability."

  Superrationality relies on what is now often called **Logical Correlation** (formalized in modern terms by Evidential Decision Theory or Functional Decision Theory). It argues:
  1.  We are both rational agents facing the same problem.
  2.  Therefore, we are running the same "reasoning algorithm."
  3.  I cannot choose to run the algorithm and output "Defect" while expecting the algorithm to output "Cooperate" for him.
  4.  My choice is not *causing* his, but it is **evidence** of his. If I find a reason to Cooperate, he finds the same reason. If I find a reason to Defect, he finds the same reason.

  So, the choice isn't between "I Cooperate, he Defects" vs "I Defect, he Defects." The choice is between the world where we **both** Cooperate and the world where we **both** Defect. Since (C,C) pays better than (D,D), you Cooperate.

  ### 3. The Asymmetry Objection (The $1 Nudge)
  You wrote: *"I also tried it on a version where one player's payoffs are nudged by a dollar... and it just seems to stop having anything to say."*

  This is the strongest critique of superrationality, but Hofstadter did address it. The key is that superrationality isn't about identical *payoffs*; it's about identical *reasoning methods*.

  If the payoffs are asymmetric, two superrational players do not necessarily make the *same move*. They make the move that results from applying the same *solution concept* to their respective payoff matrices.

  **Example:**
  Imagine an asymmetric PD where Player A gains slightly more from Defecting than Player B.
  *   A Nash player ignores the other's reasoning and defects regardless.
  *   A superrational player asks: "What is the fair, rational rule that we would both agree maps payoffs to actions?"

  In asymmetric cases, superrationality often converges on **Nash Bargaining Solutions** or other cooperative equilibria that account for the leverage differences. It doesn't "stop having anything to say"; it just becomes much harder to calculate because you have to model not just "what would I do?" but "what would a rational agent do given *these specific constraints*?"

  However, you are right that the theory is much "cleaner" in symmetric games. In asymmetric games, the definition of "same reasoning" becomes fuzzy (e.g., does "same reasoning" mean we both maximize utility, or do we both maximize the product of our utilities?). This fuzziness is a major criticism of the framework.

  ### 4. Why it's not just a "Warm Feeling"
  You concluded: *"Superrationality applies only where Nash already applies, and there it picks what Nash picks, plus a warm feeling."*

  As established, in the PD, it picks the opposite of Nash. But beyond that, the distinction matters in **Newcomb's Problem** and **AI Safety**.

  *   **Newcomb's Problem:** CDT (Nash-style) two-boxes and loses. EDT/Superrationality one-boxes and wins. This isn't a warm feeling; it's a difference in expected payout.
  *   **AI Alignment:** If you are programming an AI to negotiate with another AI, and you both have access to each other's source code (or know you are built on the same architecture), Nash reasoning leads to conflict. Superrational reasoning (now formalized as **Program Equilibrium** or **Functional Decision Theory**) allows for cooperation without enforceable contracts.

  ### Summary of Where You Went Wrong
  1.  **Outcome vs. Equilibrium:** You assumed superrationality looks for the best symmetric *equilibrium* (which is Defect). It actually looks for the best symmetric *outcome* achievable by correlated reasoning (which is Cooperate).
  2.  **Independence:** You assumed your move is independent of the other player's move. Superrationality posits that for identical reasoners, the moves are logically linked.
  3.  **Scope:** You viewed it as a subset of Nash. It is actually a competing decision theory that rejects the causal independence axiom of Nash.

  **The Verdict:**
  You aren't wrong that standard game theory rejects superrationality for one-shot games. Most economists and game theorists agree with you: without a mechanism to enforce correlation (like a contract or repeated interaction), "logical correlation" feels like magic thinking.

  However, Hofstadter's point wasn't that this is standard theory; it was that if we define "rationality" as "doing the best you can," and we acknowledge that our reasoning is correlated with peers, then the Nash definition of rationality is too narrow. It buys you more than a warm feeling *if* you accept the premise that your decision can be logically correlated with another's without causal contact. If you reject that premise (as standard CDT does), then yes, superrationality collapses. But that is a disagreement about the nature of decision theory, not a misunderstanding of the math.
