prompt: |-
  I've been reading up on Hofstadter's superrationality for a reading group I'm in and I honestly dont see what's new about it. The way I've got it: a superrational player says, my situation and the other guy's are the same, so whatever reasoning gets me to an answer gets him to the same answer, so I should just pick the best symmetric outcome. But isn't that just the symmetric Nash equilibrium? And if so it buys you nothing in the one-shot prisoner's dilemma, where mutual defection is the only symmetric equilibrium anyway and defecting is better for me no matter what he does. I also tried it on a version where one player's payoffs are nudged by a dollar so the two aren't literally running the same computation, and it just seems to stop having anything to say, which makes me think it's only even defined for perfectly symmetric games. So: superrationality applies only where Nash already applies, and there it picks what Nash picks, plus a warm feeling about people who reason like you. Where am I going wrong?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Hofstadter's Superrationality (from *Metamagical Themas*, specifically the Prisoner's Dilemma column).
      *   **User's Understanding:** Superrationality means assuming the other player reasons exactly like me, so we choose the same action. Therefore, pick the best symmetric outcome.
      *   **User's Critique:**
          1.  Isn't this just the Symmetric Nash Equilibrium?
          2.  In the one-shot Prisoner's Dilemma (PD), the only symmetric Nash is (Defect, Defect), so superrationality doesn't help.
          3.  Standard dominance reasoning says defecting is better *no matter what*.
          4.  If payoffs are slightly asymmetric (nudged by $1), superrationality seems to break down.
          5.  Conclusion: Superrationality adds nothing to Nash except a "warm feeling."
      *   **Goal:** Correct the misunderstandings, clarify what superrationality actually claims (and where it differs from Nash), address the asymmetry objection, and explain why it's controversial/distinct.

  2.  **Deconstruct the User's Misunderstandings:**

      *   *Misunderstanding 1: Superrationality = Symmetric Nash Equilibrium.*
          *   **Fact:** In the standard one-shot PD, the Nash Equilibrium is (Defect, Defect). The "best symmetric outcome" is (Cooperate, Cooperate).
          *   **Correction:** Superrationality *specifically* argues for (Cooperate, Cooperate) in the one-shot PD. Nash argues for (Defect, Defect). They yield *different* prescriptions in the canonical case. The user thinks Nash picks (C,C) in symmetric games or that superrationality picks (D,D). I need to clarify that Superrationality *rejects* the dominance argument in favor of logical correlation.

      *   *Misunderstanding 2: "Defecting is better for me no matter what he does."*
          *   **Fact:** This is the standard causal decision theory (CDT) argument.
          *   **Correction:** Superrationality relies on a form of Evidential Decision Theory (EDT) or Logical Decision Theory (LDT). It argues that your choice *is* evidence of the other's choice because you are running the same algorithm. It's not "no matter what he does"; it's "what he does is logically tied to what I do."

      *   *Misunderstanding 3: Asymmetry breaks it.*
          *   **Fact:** Hofstadter did address this. It's about the *reasoning process*, not identical payoffs.
          *   **Correction:** If the payoffs are slightly different, a superrational agent models the other agent's reasoning. If the other agent is also superrational, they will adjust their threshold. It doesn't immediately collapse, but it does require a more sophisticated model of "similar reasoning" rather than "identical output."

      *   *Misunderstanding 4: It only applies to perfectly symmetric games.*
          *   **Fact:** While easiest to explain in symmetric games, the core idea is about logical correlation between agents.
          *   **Correction:** It applies wherever agents believe their decision algorithms are correlated with others (e.g., Newcomb's Problem, Parfit's Hitchhiker).

  3.  **Drafting the Response - Section by Section:**

      *   **Acknowledge and Validate:** Start by validating that this is a very common reaction. It *does* sound like magic or confusion at first glance. The user's intuition about Nash is standard game theory.
      *   **The Core Clash (Nash vs. Superrationality):**
          *   Explicitly state: In the one-shot PD, Nash says Defect. Superrationality says Cooperate.
          *   Explain *why*: Nash assumes causal independence (my choice doesn't change yours). Superrationality assumes logical correlation (my choice implies yours because we are identical reasoners).
          *   Use the "clone" analogy. If you play against a clone, you don't think "I defect, he might cooperate." You know "If I defect, he defects."
      *   **Addressing the "Symmetric Nash" Confusion:**
          *   Clarify that (C,C) is *not* a Nash Equilibrium in PD. It's Pareto optimal, but not stable under unilateral deviation. Superrationality claims you *shouldn't* deviate unilaterally because the deviation isn't unilateral in the logical space.
      *   **Addressing the Asymmetry Objection:**
          *   This is the trickiest part. Hofstadter's view is that superrationality is about the *method* of reasoning, not identical payoffs.
          *   If payoffs differ slightly, a superrational player asks: "Given that we both use the same reasoning method, what map from payoffs to actions will we both derive?"
          *   It doesn't break immediately, but it requires common knowledge of the reasoning method.
      *   **Decision Theory Context (The "Real" Answer):**
          *   Place Superrationality in the landscape of Decision Theory.
          *   It's essentially **Evidential Decision Theory (EDT)** or a precursor to **Functional Decision Theory (FDT)**.
          *   Nash relies on **Causal Decision Theory (CDT)**.
          *   This explains *why* they differ. CDT says "My action doesn't cause his." EDT/FDT says "My action is correlated with his."
      *   **Why it matters (The "So What?"):**
          *   It's not just a "warm feeling." It solves coordination problems without communication.
          *   It's relevant to AI alignment (copies of code).
      *   **Conclusion:** Summarize the correction. You aren't wrong about Nash; you're wrong about what Superrationality claims to do. It claims to *beat* Nash in PD.

  4.  **Refining the Tone:**
