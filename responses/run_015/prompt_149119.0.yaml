      *   **Category 4: Internal Deliberation Evidence (Moderate):** Private writings showing moral struggle preceding social reward.
      *   **Category 5: Economic Reductionism (Nuanced):** Is "Honor" just "Currency"?
      *   **Defender's Concessions:** What must the character admit to remain credible?
      *   **Novelistic Application:** How to use this tension in the story.

  5.  **Drafting the Content - Section by Section:**

