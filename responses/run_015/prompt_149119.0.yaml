      *   *The "Abolitionist" Problem:* Slavery is the big one. Appiah uses it, but did moral argument *really* come after? Wilberforce, Garrison, etc., argued morally *before* the economic shift was complete.
      *   *The "Martyr" Problem:* People dying for a cause *before* it's popular suggests genuine moral conviction, not status seeking. (e.g., early Christians, Socrates, some abolitionists).
      *   *The "Institutional" Problem:* Laws often change *before* social norms fully shift (e.g., Civil Rights Act). Does law count as "argument"?
      *   *The "Internal Persuasion" Problem:* Diaries/letters show people struggling with conscience *before* changing behavior.
      *   *Economic Reductionism:* If "status" is just a proxy for "economic power," is it just Marxism with extra steps?

