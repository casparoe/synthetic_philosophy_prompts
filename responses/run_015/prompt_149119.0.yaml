      *   *Severe Flaw:* **The Costly Signal.** Evolutionary psychology/sociology. If a norm change requires *losing* status initially (the "prophet" phase), status inversion can't be the *starter*. It might be the *accelerator*, but not the spark. Example: Early abolitionists were socially ostracized.
      *   *Severe Flaw:* **The Slavery Timeline.** In the British Empire, economic interest (sugar) was still strong when abolition happened. Moral argument led the economic decline in some metrics.
      *   *Moderate Flaw:* **Private Conscience.** Diaries. If someone writes "I feel guilty" before society says "It's shameful," the internal moral compass existed prior to the social honor shift.
      *   *Economic Reductionism:* If "Honor" = "Social Capital" = "Economic Advantage," then it's just Materialism. If Honor is distinct (e.g., religious honor that defies economics), the theory holds better.
      *   *What the Defender Concedes:* She must admit moral language *accelerates* the shift, even if it doesn't *start* it. She must admit some actors are "moral mutants" (true believers) who pave the way for the status shift.
