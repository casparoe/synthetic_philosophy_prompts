      *   *Tier 2 (Above Threshold):* Lexical priority. "Amputation Rule" (life value set by worst episode). Intensity > Duration.
      *   *Implication:* Severe pain gets absolute priority over mild pain aggregates.

  3.  **Analyze the Audience & Potential Objections:**
      *   *Total Utilitarian:* Hates lexical thresholds. Blocks aggregation. Violates continuity.
      *   *Prioritarian (EA):* Thinks concave weighting does the job without rigidity. Why lexical?
      *   *Population Ethicist:* Repugnant Conclusion analogues. Sadistic Conclusion risks. Population vs. Intensity.
      *   *Philosopher of Mind:* Phenomenology of pain. Intensity vs. Unpleasantness dissociation. Where is the threshold located?
      *   *Bioethicist (Disability):* Paternalism. Who decides the threshold? Stigmatizing severe pain lives (Amputation Rule sounds ableist/nihilistic about lives with pain).
      *   *Grad Students:* The "Torture vs. Dust Specks" case (Hanson/Parfit).

  4.  **Drafting the Objections (Ordering by Damage):**
      *   *Damage Assessment:* Which objection kills the theory's coherence or moral plausibility most?
          1.  **Bioethicist (Amputation Rule/Value of Life):** If lives with severe pain are valued *only* by that pain, it implies those lives are worthless or defined solely by suffering. This is ethically toxic and politically dead on arrival in a job talk.
          2.  **Population Ethicist (Reverse Repugnance):** If one person's severe pain outweighs *any* number of good lives, you get a "Sadistic Conclusion" variant where we shouldn't create happy populations if one person might suffer.
          3.  **Prioritarian (Continuity/Arbitrariness):** Why a cliff? A tiny difference in pain creates a massive difference in moral weight. This violates continuity intuitions.
          4.  **Philosopher of Mind (Location of Threshold):** If unpleasantness dissociates from intensity, is the threshold phenomenological or evaluative? If evaluative, it's not about *suffering* per se.
          5.  **Total Utilitarian (Aggregation Block):** Lexicality breaks the math. Small pains *should* aggregate to beat big pains if the numbers are high enough (Standard Aggregationist objection).
          6.  **Grad Students (Dust Specks):** The classic Parfit/Hanson case.
          7.  **Bioethicist (Epistemic Authority):** Who decides the threshold? (Important, but maybe less theoretically fatal than the Amputation Rule).
          8.  **Prioritarian (Measurement):** Interchange test reliability.

      *Refining the Order:* The Bioethicist's point about the "Amputation Rule" devaluing lives is the most dangerous *socially* and *ethically* in a hiring context. The Population Ethicist's point is the most dangerous *theoretically* (internal consistency). The Prioritarian's point is the most dangerous *practically* (policy implementation). Let's prioritize the theoretical coherence and ethical plausibility.

      *Revised Order:*
      1.  Population Ethicist (The "Sadistic" Population Implication).
      2.  Bioethicist (The Amputation Rule & Devaluation of Disabled Lives).
      3.  Prioritarian (The Continuity/Cliff Problem).
