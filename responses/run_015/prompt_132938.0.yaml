          *   *Verdict:* Reasonable, but empirical risk.

  7.  **Identifying the "Single Reply" & "Weakest Point":**
      *   *Single Reply:* The distinction between *allocative priority* and *life value*. If the Bioethicist convinces the room the Amputation Rule means "lives with pain aren't worth living," the candidate loses the job.
      *   *Weakest Point:* Interpersonal Threshold Variability. If the threshold is subjective, how do we do policy? If it's objective, how do we measure it?
