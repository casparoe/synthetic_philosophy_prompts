      *Decision:* H1 and H3 are the most intellectually robust diagnoses of the *methodological* impasse. H4 is the best diagnosis of the *sociological* reality. H2 is true but secondary. The prompt asks which survives contact with what each side *actually argues*.
      *   Scholars argue about H3 (what are we reconstructing?).
