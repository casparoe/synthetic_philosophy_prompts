answer: |-
  Your first hypothesis survives contact with the literature best. The criteria are not independent tests; they are a partition of the evidence based on contradictory assumptions about transmission. Multiple Attestation assumes stability (the tradition keeps what matters); Dissimilarity assumes instability (the tradition changes what doesn't fit). You cannot maximize both without a theory of *when* tradition conserves and *when* it innovates. That theory is the hidden empirical question doing all the work.

  The impasse is best categorized as a hidden empirical question doing all the work, manifesting as two groups reconstructing different objects under one heading. The atomists (Meier) and holists (Allison) are not merely disagreeing on method; they are operating with incompatible physics. When an atomist demands a criterion be satisfied pericope by pericope, they assume fragmentation is the default state of transmission. When a holist argues for a characteristic impression, they assume coherence is the default. Neither proves their transmission model; they simply assert it through their choice of tool. This is why Hooker's objection never landed: it pointed out the lack of knowledge regarding Judaism and the Early Church, but the field responded by refining the criteria rather than measuring the transmission. They treated a gap in data as a puzzle in logic.

  Look at the moves participants make. Proponents of the criteria concede that no single criterion is decisive, yet they refuse to count the cumulative failure of the apparatus as falsification. When Dissimilarity yields a Jesus too weird to have followers, and Multiple Attestation yields a Jesus too typical to be distinct, the scholar does not discard the tools; they weight them. That weighting is where the hidden empirical claim hides. If you weight Dissimilarity higher, you assume the Church was highly conformist. If you weight Coherence higher, you assume the Church was highly conservative. The verdict tracks the portrait (Hypothesis 4) precisely because the criteria are merely the algebraic expression of that prior assumption about transmission dynamics. The "Protective Belt" is real, but it is protected by the impossibility of measuring oral fluidity in the first century.

  Therefore, no progress should be expected. The field is rationally at rest because it has exhausted the logical space available to its current questions. You cannot solve a transmission problem with textual criteria. Progress would require either new evidence (unlikely) or a formal, probabilistic treatment of the criteria's diagnostic power under stated assumptions about transmission (unlikely, because it would reveal the assumptions are arbitrary). The only viable path is the one Allison and the memory theorists gesture toward: abandoning "authenticity" (did he say this?) for "mnemonic history" (why was this remembered?). But even this risks becoming another protective belt if it refuses to specify the mechanics of distortion. For your character, the despair is respectable because the method is not merely difficult; it is circular. It asks questions of the text that the text cannot answer without importing assumptions from the scholar's own theology or sociology.

  For the faculty dinner, your character needs claims that signal competence while exposing the rot. Here are three she can make that are true and will land with those who know the literature:

  1.  "The criterion of dissimilarity doesn't give us the historical Jesus; it gives us a Jesus who could not have founded a movement."
      *   *Why it works:* It acknowledges the logical terminal point of the tool (Käsemann's problem) without denying the tool's existence.
  2.  "We are not reconstructing events; we are reconstructing the memory of events, and the criteria treat those as identical."
      *   *Why it works:* It aligns with the Memory Turn (Allison/Kirk) without requiring her to adopt their entire framework.
  3.  "Consensus on authenticity usually tracks consensus on theology, not evidence."
      *   *Why it works:* It is a sociological truth about the field that senior scholars know but rarely state publicly.

  Here are three she must not make, as they would mark her as an amateur or ideologue:

  1.  "The criterion of embarrassment proves historicity because the Church wouldn't invent shame."
      *   *Why it fails:* It ignores that shame is often theological capital (the scandal of the cross) and assumes modern心理logy applies to ancient honor cultures.
  2.  "The Third Quest solved the subjectivity of the Second Quest by contextualizing Jesus in Judaism."
      *   *Why it fails:* It ignores Ferda's critique; contextualizing Jesus in Judaism just shifts the subjectivity from the Church to the scholar's construction of Judaism.
  3.  "If we just apply the criteria rigorously, we can separate the Jesus of history from the Christ of faith."
      *   *Why it fails:* It asserts the very possibility your character is despairing of. It treats the criteria as a sieve rather than a lens.

  Your character's crisis is not that she cannot find the answer, but that she has realized the question consumes the answer. The tools do not measure the past; they measure the scholar's confidence in the tradition's stability. When that confidence breaks, the tools become weights without a scale.
