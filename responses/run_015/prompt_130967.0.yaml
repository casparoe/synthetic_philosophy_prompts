answer: |-
  ### I. Good's Theorem: The Settled Core

  To analyze the 2020 A-level controversy rigorously, we must first distinguish the mathematical theorem from its philosophical application. I.J. Good's 1967 result regarding the value of information is a settled theorem within the axioms of Bayesian decision theory.

  **The Theorem:** For a rational agent who maximizes expected utility, the expected utility of making a decision *after* observing free evidence is always greater than or equal to the expected utility of making the decision *without* that evidence.

  **Settled Conditions:**
  1.  **Unrestricted Agency:** The agent must be free to choose any action in the available set after receiving the information. If external constraints prevent the agent from acting on the posterior belief, the theorem does not apply.
  2.  **Well-Defined Utility:** The agent must possess a utility function that ranks all possible outcomes.
  3.  **Cost Accounting:** The theorem strictly applies to *costless* information. If information carries a cost (financial, temporal, or social), that cost must be subtracted from the expected utility. If the cost exceeds the instrumental benefit, the *net* value is negative, but this does not violate the theorem; it simply means the information was not "free."
  4.  **Consequentialism:** The value of an action is determined solely by the expected outcomes. The *process* of deciding has no intrinsic moral weight unless encoded into the utility function.

  **Consensus View:** Within these axioms, the theorem is mathematically indisputable. Information cannot reduce expected utility because the agent can always choose to ignore it and act as they would have without it. The "option value" of information is non-negative.

  **Contested Boundaries:** Philosophical disagreement arises not over the math, but over whether real-world decision-making satisfies these axioms. Debates persist regarding:
  *   **Bounded Rationality:** Agents may lack the computational capacity to process information optimally, leading to "information overload" where more data degrades decision quality.
  *   **Moral Side-Constraints:** Deontological ethicists argue that certain actions (or uses of information) are forbidden regardless of utility, which challenges the consequentialist foundation of the theorem.
  *   **Endogenous Preferences:** In some cases, acquiring information changes the agent's utility function itself (e.g., learning a truth that makes a previously desired outcome repugnant), which complicates the standard model.

  ---

  ### II. The A-Level Episode Through Good's Framework

  In the 2020 controversy, the primary decision-maker was the UK Government (acting through Ofqual). We can map the decision problem as follows:

  *   **States of the World:** The "true" academic merit of students; the stability of the university admissions system; the level of public trust in the qualification system.
  *   **Actions:**
      1.  $A_1$: Award grades based on Teacher Predictions ($T$).
      2.  $A_2$: Award grades based on Algorithmic Moderation ($M$), where $M = f(T, \text{Historical School Data } H)$.
  *   **Information Streams:**
      1.  $H$ (Historical Data): Information about past performance trends at specific schools.
      2.  $P$ (Public Reaction): Information about social unrest, media outcry, and political risk following the release of $M$.

  **The Initial Decision:**
  The government chose $A_2$. Under Good's framework, this implies that at time $t_0$, the expected utility of acquiring and using $H$ to moderate $T$ was calculated to be higher than using $T$ alone. The instrumental logic was that $H$ corrected for teacher bias (grade inflation), thereby increasing the *accuracy* of the grades (a proxy for fairness and university system stability).

  **The Reversal:**
  Following the release of grades, the government observed $P$ (widespread protest). They then switched to $A_1$.
  *   **Consistency with Good:** The reversal itself is consistent with Good's theorem. The public reaction $P$ was *new information*. Acquiring $P$ had positive value because it allowed the government to update its beliefs about the political and social costs of $A_2$, leading to a switch to $A_1$ which (in the new light of $P$) had higher expected utility.
  *   **The Apparent Violation:** The controversy suggests that the *initial* acquisition of $H$ had negative value. If the government ultimately reverted to $T$, why did they process $H$ at all?

  **Good's Explanation (Settled):**
  Good's theorem accommodates this if we treat the social unrest as a **cost** of using $H$. If the government failed to anticipate the magnitude of $P$ at $t_0$, they made an error in probability estimation, not a violation of the theorem. If they *did* anticipate $P$ but proceeded anyway, they revealed that their initial utility function weighted "standardization" higher than "social unrest." The reversal simply revealed a preference shift or a correction of erroneous probability estimates regarding $P$.

  ---

  ### III. The Expressive Dimension: Where Good Falls Silent

  The prompt asks us to inject a distinction between instrumental value and expressive judgment. This is where Good's framework encounters its limits, not mathematically, but descriptively.

  **1. Information as Instrument vs. Information as Speech**
  In Good's model, $H$ (historical data) is a probabilistic input. It updates the likelihood that a teacher's prediction is accurate.
  *   *Instrumental View:* $H$ reduces variance in grading.
  *   *Expressive View:* Using $H$ to downgrade students from disadvantaged schools constitutes a speech act. It expresses the proposition: *"Students in high-performing schools are credible; students in low-performing schools are not."*

  Good's theorem is silent on the **expressive content** of information usage. It treats the use of $H$ as a causal lever affecting outcomes (university placements). It does not model the *meaning* of pulling that lever. If the "harm" of the algorithm was not just the outcome (downgraded grades) but the *insult* (the expression of distrust), Good's framework can only capture this if "dignitary harm" is entered as a negative term in the utility function.

  **2. The Moral Status of the Subjects**
  The controversy highlighted that the information $H$ was not neutral. It encoded historical inequalities. To use $H$ was to ratify past disadvantage as a predictor of future merit.
  *   **Good's Assumption:** Information is valuable insofar as it correlates with the state of the world relevant to the utility function.
  *   **The Challenge:** If the utility function includes "treating students as ends rather than means" (a Kantian constraint), then using $H$ might be forbidden *even if* it produces more accurate grades. Good's theorem assumes the agent is free to use any information to maximize utility. It does not account for **epistemic constraints**—norms about what information *ought* to be used, regardless of its predictive power.

  **3. Did the Information Have Negative Value?**
  Under the expressive lens, the information $H$ had negative value because its *usage* degraded the moral relationship between the state and the citizen.
  *   **Good's Verdict:** If this degradation is a "cost," the theorem holds. The net value was negative because the cost (dignitary harm) outweighed the benefit (accuracy).
  *   **Philosophical Critique:** This reduces a rights violation to a cost. Some philosophers argue that dignitary harm is not commensurable with instrumental benefits. If the harm is non-fungible, Good's utility calculus fails to capture the decision structure. The theorem assumes all values can be traded off against one another within a single function $U$.

  ---

  ### IV. Epistemic vs. Moral Evaluation

  The episode reveals a tension regarding the separation of epistemic and moral evaluation, which is a **contested** area in decision theory and epistemology.

  **1. The Separation Assumption**
  Good's theorem relies on a clean separation:
  *   *Epistemic Step:* Update beliefs based on evidence ($H$).
  *   *Pragmatic Step:* Choose action to maximize utility based on beliefs.
  The theorem assumes the moral evaluation happens entirely in the *Pragmatic Step* (the utility function). The *Epistemic Step* is morally neutral; data is just data.

  **2. The A-Level Counter-Example**
  The A-level case suggests that the *source* and *structure* of the information ($H$) carried moral weight independent of its accuracy.
  *   **Ethical Encroachment:** Some epistemologists argue that moral stakes can affect whether one is justified in holding a belief or using evidence. If using $H$ reinforces systemic injustice, there may be a moral reason to ignore $H$ even if it is statistically predictive.
  *   **Implication for Good:** If moral considerations restrict *which evidence can be processed*, the condition of "unrestricted choice of action" (which implies unrestricted use of information) is violated. The agent is not free to act on the posterior belief formed by $H$ because forming that belief is itself morally constrained.

  **3. Contested Territory**
  It is **not consensus** that Good's theorem must be amended to account for this.
  *   *Consequentialist Defense:* A sophisticated consequentialist would argue that "dignitary harm" is simply a very heavy weight in the utility function. Good's theorem still applies; the government just got the weights wrong initially.
  *   *Deontological/Pluralist Critique:* Others argue that certain information is "tainted." If the data is produced by an unjust system (historical grading disparities), using it makes the agent complicit. This suggests a constraint on the *domain* of the utility function, not just the values within it. This challenges the universality of Good's result for moral agents.

  ---

  ### V. Summary: Settled vs. Contested

  To conclude your seminar analysis, you should distinguish the mathematical validity of the theorem from its normative scope.

  **Settled (Consensus):**
  *   Good's theorem is mathematically valid for expected utility maximizers.
  *   The A-level reversal is consistent with the theorem if viewed as updating on new information (public protest).
  *   If the initial algorithm caused harm, Good's framework explains this as a miscalculation of costs (social unrest) or benefits (accuracy), or a change in the utility function over time.
  *   The theorem requires that information costs (including reputational or moral costs) be included in the utility calculation for the "non-negative value" claim to hold net.

  **Contested (Philosophical Debate):**
  *   **Commensurability:** It is contested whether dignitary or expressive harms can be legitimately modeled as utility costs without distorting the moral phenomenon. If dignity is a right, not a preference, Good's consequentialist framework may be category-mistaken.
  *   **Epistemic Constraints:** It is contested whether agents are ever morally prohibited from *using* statistically relevant information (e.g., racial or socioeconomic priors). If such prohibitions exist, the "unrestricted agency" condition of Good's theorem is rarely met in moral contexts.
  *   **Scope of Rationality:** It is contested whether a "rational agent" in the decision-theoretic sense is an appropriate model for political institutions, which must navigate legitimacy and trust—values that may not behave like standard utilities.

  **Conclusion on the Case:**
  The 2020 A-level episode does not falsify Good's theorem mathematically. However, it demonstrates that the theorem's **scope is strictly limited to instrumental decision-making**. It falls silent on the expressive dimension unless that dimension is successfully consequentialized. The episode suggests that in political contexts, information is not merely a tool for prediction but a medium of recognition. Where Good sees a probability update, the public saw a moral judgment. If decision theory cannot model the difference between *predicting* a student's grade and *judging* a student's worth without reducing the latter to a cost, then the theorem remains silent on the core ethical failure of the algorithm.
