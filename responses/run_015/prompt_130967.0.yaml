      *   *Epistemic/Moral Separation:* Good assumes we update beliefs to maximize utility. If holding a belief (e.g., "these students are less credible") is morally corrosive regardless of truth, Good's framework struggles unless "moral corrosion" is a cost. But some philosophers argue some beliefs shouldn't be held even if useful (ethical encroachment).

