          *   Information is relevant (probabilistically linked to states of the world).
      *   *Consensus:* Mathematically sound within its axioms.
      *   *Contestation:* Applicability to real-world agents (bounded rationality), cost of computation, psychological framing, moral constraints (deontology), and whether "utility" can capture all values (e.g., dignity, rights).

