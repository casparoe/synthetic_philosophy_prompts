  4.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** State Good's Theorem clearly and its standard conditions (Settled). Introduce the A-level case.
      *   **Applying Good's Framework:** Map the agents, states, actions, and information.
          *   Agent: Government/Ofqual.
          *   Information: Historical data ($H$).
          *   Action: Assign grades based on $T$ vs. $A$.
          *   Utility: Needs to be defined. If Utility = "Accuracy + Stability," did $H$ help?
      *   **The "Negative Value" Puzzle:** Good says VoI $\ge 0$. Why did dropping $H$ look better?
          *   *Explanation 1 (Settled):* Cost of information. Public outrage is a *cost*. If the cost of processing $H$ (in terms of social unrest) exceeds the instrumental benefit, VoI is negative *net of cost*. Good allows for costly information.
          *   *Explanation 2 (Contested/Scope):* The Utility Function. Did the initial utility function capture "fairness" or "dignity"? If the utility function is purely consequentialist (e.g., university placement efficiency), Good holds. If the *act* of using $H$ violates a constraint, Good's standard model doesn't capture that directly unless encoded in utility.
      *   **The Expressive Dimension:** This is the core philosophical pivot.
          *   Information as Judgment: Using $H$ expresses "Teachers in poor schools lie."
          *   Good's Silence: Good's theorem treats information as probabilistic updates, not speech acts. It doesn't model the *meaning* of using data, only the *outcome* of using data.
          *   Epistemic vs. Moral: Good assumes epistemic updates serve utility. It assumes we can separate "what is true" from "what is good to believe/use." The A-level case suggests the *source* of the belief matters morally, not just the truth value.
      *   **Settled vs. Contested:**
          *   *Settled:* Good's theorem holds mathematically for expected utility maximizers with free action. It accounts for costs if included in $U$.
          *   *Contested:* Can all moral values (dignity, rights) be consequentialized into $U$? Does the theorem apply when information changes the *available actions* (e.g., protest restricts freedom)? Is the separation of epistemic/moral coherent?

