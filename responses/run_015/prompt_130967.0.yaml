  8.  *(Self-Correction during drafting)*: Make sure to emphasize that the *reversal* itself is consistent with Good (updating on public protest). The problem is the *initial* decision to use the algorithm. Did that information ($H$) have negative value? Only if the costs (outrage) outweighed the benefits (standardization). But the prompt asks about the *expressive* harm. That's the key. Good doesn't model "expressive harm" natively; it must be input as a utility cost. If it's a *right* violation, can it be a utility cost? That's the contested part.

  9.  **Final Review against constraints:**
