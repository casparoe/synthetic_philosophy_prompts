answer: |-
  Brainstorming: Brandt's strongest moves are: (1) Current utility ensures persistence even if origin was constrained; (2) Optimality models act as falsifiable null hypotheses, not just stories; (3) Historical reachability is empirically unknowable, making the Clause impossible. Objections: (1) Maintenance doesn't explain form; (2) Models can be tweaked to fit any data; (3) Developmental biology reveals reachable alternatives. Adeyemi's strongest moves are: (1) If no alternative phenotype was developmentally possible, selection didn't choose the trait; (2) Origin matters distinct from utility (Gould's point); (3) Adaptationism ignores physical constraints as causal factors. Objections: (1) Selection can modify developmental pathways over time; (2) Utility is what matters for survival now; (3) Constraints are just part of the fitness landscape.

  ***

  **Dr. Ilse Brandt:** The Reachability Clause sounds reasonable until you try to fill it out. The Foundation wants us to list alternative phenotypes the lineage could have produced. In the glass-stitch worm case, my lab showed the helical ridge boosts particle capture by twelve percent. That's a massive return on a nine percent carbonate investment. The optimality model predicts the ridge amplitude perfectly given the flow rate.

  **Dr. Kwame Adeyemi:** And yet, two species live in still water where the vortex does nothing. They have the ridge too. Your model fits the flow species, but it doesn't explain the still-water species. It just assumes they haven't had time to lose it. That's the Panglossian trap: assuming every trait is optimized for something, even when the evidence says it's just baggage.

  **Brandt:** I grant you the still-water species. Phylogenetic inertia is real. But look at the forty species as a whole. Selection doesn't need to design every brick; it just needs to keep the building standing. The ridge works where it matters. If the cost was too high, selection would have stripped it away in the still-water lineages. The fact that it persists suggests the cost is negligible compared to the risk of mutating the secretion mechanism.

  **Adeyemi:** That's the pivot I expected. You concede the origin might be historical, but you argue maintenance is adaptive. But Gould and Lewontin's point was about the explanation of form, not just persistence. Why is the ridge helical? Your lab's own developmental data says any tube secreted in discrete increments around a fixed cross-section produces a stepped interior. It's geometry. A smooth interior would require a second secretion mode no member of the clade possesses.

  **Brandt:** So you're saying because the form was constrained by development, selection gets no credit? That's like saying an architect gets no credit for a dome because gravity shapes the arch. The architect chose the dome. Here, selection chose to keep the secretion mode that produces the ridge because the ridge works. We glued artificial beads into smoothed tubes and restored eleven percent of the efficiency. The function is real.

  **Adeyemi:** I grant the function is real. The beads prove the vortex helps. But you're conflating utility with cause. Just because a structure is useful now doesn't mean it was selected for originally. Gould used the architectural example of St. Mark's Basilica. The pendentives were necessary to support the dome on a square base. They created triangular spaces—the spandrels.

  **Brandt:** And those spandrels were filled with mosaics. They were co-opted. I know the story. But the objection raised then was that alternatives like squinches or corbels were available. The builders chose pendentives. If the worms could have evolved a smooth tube but didn't, that's selection. If they couldn't, it's a spandrel. The Clause asks us to prove which.

  **Adeyemi:** Exactly. And in the worm case, the developmental constraint suggests they couldn't. The "reachable" phenotypes were limited to stepped interiors. If the only reachable phenotypes all have ridges, then selection didn't choose the ridge over a smooth tube. It chose the worm over nothing. You're treating the constraint as a background condition, but it's the primary cause of the form.

  **Brandt:** Here's where I push back. You say "reachable," but how do we know? We only see what exists. To say a smooth tube was unreachable requires a complete map of the developmental landscape. We don't have that. We have the optimality model. It serves as a null hypothesis. We ask: does the trait match the prediction of maximum efficiency? If yes, we tentatively accept adaptation. If no, we look for constraints.

  **Adeyemi:** That null hypothesis is rigged. It assumes the only alternative to adaptation is randomness. It ignores structured non-adaptive causes like physics or development. If I roll a die and it lands on six, your model says "six was optimal." I say "dice have six sides." The Reachability Clause forces you to list the sides of the die.

  **Brandt:** But listing the sides is impossible for extinct lineages or complex genetics. You're asking for a counterfactual history. "What would have happened if?" Science deals with what did happen. The optimality model is testable because it predicts quantitative trade-offs. The carbonate cost versus particle capture. That's measurable. Your "reachability" is a metaphysical claim about paths not taken.

  **Adeyemi:** It's not metaphysical if we can manipulate development. We know the secretion is discrete. We know the cross-section is fixed. That limits the reachable set. You're defending a method that systematically overestimates selection's power because it refuses to define the space of possibilities. If you don't know what could have evolved, you can't claim what did evolve was chosen.

  **Brandt:** I grant that knowing the developmental constraints improves the model. Ideally, we'd include them. But the Clause makes it a funding requirement to state which alternatives were possible. If I write "none," I get rejected for lacking imagination. If I write "smooth tubes," you reject me for ignoring development. It puts the burden of proof on a negative.

  **Adeyemi:** It puts the burden of proof on the causal claim. If you claim selection shaped the ridge, you must show selection had options. Otherwise, you're telling a just-so story with equations. The worm case is perfect: the ridge exists where it's useless. The development forces the ridge. The function is secondary. That's a spandrel that became useful, not an adaptation that was built.

  **Brandt:** But it's maintained by selection now. The still-water species haven't lost it yet, but the flow species keep it precise. That's selection acting on the form. You want to split causal history into origin and utility. I say that's one history. Selection acts on what exists. If development produces a ridge, and the ridge helps, selection reinforces the development. They're entangled.

  **Adeyemi:** They're entangled, but they're not the same. If I build a car with square wheels because that's all the factory makes, and then I drive it on soft sand where square wheels work better, I didn't design the wheels for the sand. The factory did. You're crediting the driver for the engineer's constraint. The Clause asks us to identify the engineer.

  **Brandt:** And I'm saying the driver keeps the car on the road. Without the driver, the car rusts. In biology, without selection, the lineage dies. The "engineer" of development only persists because the "driver" of selection keeps paying the fuel bill. You can't separate them in the funding proposal because they aren't separate in the organism.

  **Adeyemi:** We can separate them conceptually, or we stop doing science and start doing theology. Every trait becomes a testament to selection's wisdom. The Reachability Clause isn't about stopping adaptationism. It's about forcing you to admit when selection was a passenger, not the driver. In the worm case, selection was a passenger for the origin.

  **Brandt:** And I'm saying the passenger grabbed the wheel five million years ago. The precision of the ridge in flow species exceeds the developmental minimum. That's selection tweaking the constraint. Your Clause would force me to prove the tweak was possible. I say the model proves it was necessary.

  **Adeyemi:** Necessary for what? For the function? Yes. For the existence of the ridge? No. The ridge exists because of secretion geometry. The function exists because of the ridge. You're reversing the arrow.

  **Brandt:** I'm following the fitness. The geometry allows the function, the fitness keeps the geometry. It's a loop. Breaking it to satisfy a policy clause creates a false dichotomy.

  **Adeyemi:** The dichotomy isn't false. It's the difference between saying "selection built this" and "selection tolerated this." The Foundation wants to know which grant they're buying.

  **Brandt:** Then they should fund the models that predict the tolerance limits. Not the history we can't replay.

  **Adeyemi:** Then they're funding stories, not causes.

  **Brandt:** They're funding predictions. Can you predict the ridge amplitude without selection?

  **Adeyemi:** I can predict it from secretion rates and tube diameter. No selection needed.

  **Brandt:** But not the variance between species.

  **Adeyemi:** Because you haven't measured the developmental variance.

  **Brandt:** Because it's too small to measure without destroying the specimen.

  **Adeyemi:** Then you don't know if it's adaptation.

  **Brandt:** Then we stop studying it.

  **Adeyemi:** No. We stop pretending we know.

  ***

  **Afterword**
  The exchange establishes that the disagreement is not about whether selection occurs, but about the evidentiary standard for claiming it as the primary cause of form. Brandt treats optimality as a sufficient predictor of persistence; Adeyemi treats developmental reachability as a necessary condition for attributing origin. The crux is whether biology explains why traits exist (constraints) or why they persist (selection). The Reachability Clause forces this distinction into the open, making the empirical question of accessible phenotypes the bottleneck for adaptationist claims.

  \answer{REACHABILITY}
