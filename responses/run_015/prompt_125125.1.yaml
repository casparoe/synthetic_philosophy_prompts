  **INTERNAL COMMISSION MEMORANDUM**

  **TO:** Vetting Commission Commissioners
  **FROM:** Consultant on Moral Responsibility and Institutional Ethics
  **DATE:** October 24, 2023
  **SUBJECT:** Determination in Case P-549 and Proposed General Standard for Logistics Facilitation

  **1. Recommendation for Applicant P**
  I recommend that the Commission **bar P from sensitive public employment** involving discretionary authority over personnel, resource allocation, or security matters. However, this bar should be **conditional**: P shall be eligible to petition for clearance into non-sensitive technical roles after a period of eighteen months, provided no new adverse information emerges and he completes a certified course on constitutional human rights standards.

  **2. General Standard for Remaining Caseload**
  To process the remaining 1,200 files within our mandate, staff shall apply the **Discretionary Facilitation Standard**. An applicant is deemed to have "personally and substantially facilitated" core crimes if their file demonstrates:
  1.  **Routine Contribution:** The applicant performed tasks necessary for the criminal program (e.g., logistics, scheduling, certification).
  2.  **Discretionary Agency:** The applicant possessed the administrative capacity to delay, obstruct, or report the task without immediate threat to life or limb, regardless of whether others would have replaced them.
  3.  **Affirmative Trace:** There is evidence of voluntary engagement beyond mere presence (e.g., performance bonuses, transfer requests denied but not appealed through higher channels, or written communication adopting regime terminology).

  If all three criteria are met, the presumption is a bar from sensitive employment. The duress exception applies only where the file documents a credible threat of immediate physical harm or imprisonment, not merely career loss.

  **3. Explanatory Pictures and Epistemic Limits**
  Our deliberations have stalled over two competing explanations for behavior like P's: the "Ordinary Men" picture (situational pressure, role induction) and the "Willing Executioners" picture (ideological conviction). We must acknowledge that the file cannot settle which picture describes P. We do not know if his memo using "cleansing" language reflected deep belief or cynical careerism. We do not know if his colleague's testimony regarding P's reluctance is accurate.

  My recommendation is deliberately insulated from this unknowable psychology. We cannot adjudicate soul-state; we can only adjudicate conduct-footprint. Whether P was a reluctant conformist or a convinced ideologue, the objective fact remains that he exercised discretionary agency to sustain a criminal system when the cost of refusal was limited to career setbacks. Therefore, the "Ordinary Men" picture explains *why* so many participated, but it cannot serve as a blanket exemption. If situational pressure exculpates everyone, the statute is nullified. Conversely, the "Willing Executioners" picture justifies the bar based on the *risk* such dispositions pose to a new democracy, regardless of whether the disposition was internalized or performative. The standard above relies on the objective trace of agency (the memo, the duration of service post-transfer request) rather than the motive behind it.

  **4. The Substitution Test**
  One commissioner has argued that because P was replaceable—had he refused, another clerk would have certified the convoys—his causal contribution was negligible. This is the Substitution Test. In criminal law, this test might mitigate sentencing because punishment tracks causal harm. In vetting, this test must be rejected.

  Our mandate is not to punish past harm but to protect future governance. A system designed to make perpetrators replaceable is not a reason to exculpate the individual; it is a description of the bureaucratic evil we must prevent from reconstituting. If we clear applicants because the machine would have run without them, we effectively reward the most efficiently organized authoritarian structures. Furthermore, replaceability does not negate the applicant's fitness. A person who complies with unlawful orders because "someone else would have done it" demonstrates a willingness to subordinate moral judgment to administrative momentum. That willingness is the precise risk factor we are mandated to screen. Replaceability is irrelevant to fitness for public trust.

  **5. Temporal Orientation: Backward vs. Forward-Looking**
  This decision weights **forward-looking considerations** heavier than backward-looking ones, though constrained by the latter.
  *   **Backward-looking:** The statute requires a finding of past facilitation. P meets this threshold. He certified fuel for removal convoys knowing their destination. This establishes the baseline eligibility for sanction.
  *   **Forward-looking:** The primary function of this commission is to ensure the new administration is staffed by officials who will not replicate old abuses. Here, the ambiguity of P's psychology works against him. Whether he was convinced or coerced by careerism, he demonstrated a capacity to normalize criminal logistics. A person who complies under moderate pressure (loss of pension) is a higher risk for future compliance than one who refused under high pressure.

  However, because we cannot confirm his ideological commitment, a lifetime bar is disproportionate. The conditional bar allows us to manage risk without making a definitive claim about his character that the evidence cannot support. The eighteen-month review period tests his current alignment with democratic norms.

  **6. The Strongest Counter-Argument**
  The strongest argument against this recommendation rests on **institutional capacity and fairness**. If we bar every mid-grade logistics officer who meets the Discretionary Facilitation Standard, we may disqualify a substantial portion of the experienced civil service required to run the state. There is a genuine risk that a rigid application of this standard will cripple the new administration's ability to deliver basic services, harming the very population we aim to protect.

  Furthermore, there is a fairness objection regarding the "Ordinary Men" picture. If the situational pressure was truly ubiquitous—if almost everyone in that grade did exactly what P did—then singling out P for a bar (even conditional) while lacking the resources to process every similar file creates a lottery of blame. It risks making P a scapegoat for systemic guilt. If two thousand officers did this work, and we only bar the hundred whose files we review deeply enough to find a memo like P's, the sanction tracks investigative luck rather than moral distinction.

  I acknowledge this weight. It is why I recommend the conditional bar rather than a permanent exclusion. This preserves the state's capacity to utilize experienced staff eventually, while maintaining the moral boundary that such work was not merely "administratively necessary." We must accept that perfect consistency is impossible given our caseload constraints; our duty is to set a standard that marks the conduct as unacceptable, even if we cannot catch every instance of it.

  **7. Conclusion**
  We cannot know who P is. We know what P did. He kept a job that required facilitating mass removal when the cost of leaving was financial, not physical. He used language that validated the crime. Under the Discretionary Facilitation Standard, this constitutes substantial facilitation. The substitution argument fails because vetting targets fitness, not causation. The capacity argument is managed through the conditional review mechanism.

  Proceed with the conditional bar. Apply the standard to the remaining files.

  **End of Memo**
