answer: |-
  This is a **Legacy Integrity Test**. It is designed to be run in one sitting, without legal counsel, focusing on the ethical relationship between the living author and the dead subject. It treats the subject not as property, but as a former person with a sustained identity that deserves coherence.

  There are five steps. For each step, mark your scene as **PASS** (proceed), **STOP** (do not write), or **VALUES CALL** (the procedure cannot decide; the final ethical burden rests on you).

  ### The Procedure

  **Step 1: The Evidence Gate (Silence vs. Contradiction)**
  *   **Question:** Is this scene filling a gap in the record, or is it overwriting the record?
  *   **PASS:** The record is silent, and the invention is consistent with known behaviors, habits, and documented personality traits.
  *   **STOP:** The invention directly contradicts primary source material (letters, diaries, contemporary accounts) regarding facts or stated beliefs.
  *   **VALUES CALL:** The record is ambiguous or unreliable, and you are choosing one interpretation over another.

  **Step 2: The Core Mission Test (Betrayal of Life's Work)**
  *   **Question:** Does this scene undermine the central project or moral stance the subject is historically known for?
  *   **PASS:** The scene shows struggle or nuance, but ultimately respects the integrity of their life's work.
  *   **STOP:** The scene depicts the subject privately abandoning or mocking the cause they publicly died for, without evidence they actually did so. This turns their life's work into a lie.
  *   **VALUES CALL:** The scene shows a momentary lapse of faith that humanizes them, but does not negate their overall commitment.

  **Step 3: The Saint/Sinner Check (Flattery vs. Defamation)**
  *   **Question:** Are you making them better or worse than the evidence supports, and *why*?
  *   **PASS:** The invention adds complexity (flaws or virtues) that aligns with the psychological profile of the person.
  *   **STOP:** You are inventing a virtue to make them a martyr, OR inventing a vice to make them "interesting," where neither is supported by their character profile.
  *   **VALUES CALL:** You are adding a virtue (flattery) that feels true to their spirit but lacks documentation. (Note: Flattery is often more insidious than defamation because it creates a false idol readers can't knock down).

  **Step 4: The Instrumentalization Check (Plot vs. Person)**
  *   **Question:** Is this scene happening because the *character* would do it, or because the *plot* needs it?
  *   **PASS:** The action arises inevitably from who we know them to be.
  *   **STOP:** The action is inserted primarily to solve a structural problem (pacing, tension, romance arc) and has no basis in the subject's known psychology or history. This treats the dead person as a puppet.
  *   **VALUES CALL:** The action serves both plot and character, but the historical evidence is thin.

  **Step 5: The Imprint & Kin Check (Memory and Descendants)**
  *   **Question:** If a descendant reads this, will they recognize the person? If a reader remembers only this scene, what history do they carry away?
  *   **PASS:** The scene feels like a plausible extension of the person a descendant would recognize. An Author's Note could reasonably contextualize it.
  *   **STOP:** The scene is so vivid/specific that it will overwrite historical memory, and it portrays something that would cause genuine distress or reputational harm to living descendants (e.g., inventing abuse, criminality, or hypocrisy).
  *   **VALUES CALL:** The scene is vivid, but you are willing to accept that readers may mistake it for fact, and you have a plan to signal the invention (beyond a copyright disclaimer).

  ***

  ### Application to Your Draft Scenes

  Here is the test run on your three scenes.

  #### Scene 1: Sitting with the scab's sick kid.
  *   **Evidence:** Silent (never happened), but consistent with letters. -> **PASS** (Step 1).
  *   **Core Mission:** Aligns with solidarity/nonviolence. -> **PASS** (Step 2).
  *   **Saint/Sinner:** Makes her "better." Risks hagiography. -> **VALUES CALL** (Step 3). *Note: This is the danger zone. Making her a saint can be as dishonest as making her a sinner. It erases her human limits.*
  *   **Instrumentalization:** Likely character-driven. -> **PASS** (Step 4).
  *   **Imprint/Kin:** Descendants likely proud; readers see her compassion. -> **PASS** (Step 5).
  *   **VERDICT:** **PASS (with caution on hagiography).**
      *   *Condition:* Ensure she is tired, resentful, or struggling during the vigil. If it's pure selfless grace, it's a lie of omission.

  #### Scene 2: The affair with the married editor.
  *   **Evidence:** Presumably silent (you want to invent it). -> **PASS** (Step 1).
  *   **Core Mission:** Depends on her public stance on marriage/fidelity. If she advocated for traditional family structures, this is a **STOP**. If neutral, -> **VALUES CALL** (Step 2).
  *   **Saint/Sinner:** Adds "spice." -> **VALUES CALL** (Step 3).
  *   **Instrumentalization:** You stated: *"would make the book work structurally."* -> **STOP** (Step 4).
      *   *Reasoning:* You are explicitly admitting this is for *structure*, not because the historical Ada demands it. You are using her body to fix a plot hole. This instrumentalizes the dead.
  *   **Imprint/Kin:** Vivid sexual scenes are sticky. Descendants may find this embarrassing or reductive. -> **VALUES CALL** (Step 5).
  *   **VERDICT:** **STOP (on Instrumentalization Grounds).**
      *   *Why you won't like this:* You said you *definitely want* this. But the procedure flags that when invention serves the *author's structure* more than the *subject's truth*, you cease writing historical fiction and start writing fan fiction with real names. Unless you can prove she had a psychology that demanded this affair, the structural need is not an ethical justification.

  #### Scene 3: Admitting the movement was a mistake to her sister.
  *   **Evidence:** *"Every surviving letter says the opposite."* -> **STOP** (Step 1).
  *   **Core Mission:** *"Defeat something she actually aimed at."* -> **STOP** (Step 2).
      *   *Reasoning:* This is the hardest stop. If she argued for 40 years that nonviolence works, and you write a scene where she says "It was all a mistake," you are not humanizing her; you are invalidating her life's argument. You are claiming you know her mind better than her own decades of correspondence.
  *   **Imprint/Kin:** Readers will remember the doubt more than the letters. -> **STOP** (Step 5).
  *   **VERDICT:** **HARD STOP.**
      *   *Why:* This violates the "Contract with the Dead." You are allowed to imagine her *feelings*, but you are not allowed to imagine her *renouncing her identity* without evidence. This turns her into a tragic hypocrite for the sake of modern irony.

  ***

  ### The Unwelcome Answer
  The procedure flags **Scene 2 (The Affair)** and **Scene 3 (The Doubt)** as ethically compromised.

  Scene 3 is the **Hard Stop**. It contradicts the documentary record.
  Scene 2 is the **Unwelcome Values Call/Stop**. You want it for structure. The procedure says that *structural necessity is not ethical clearance.* If the only reason the affair exists is to make the book work better, you are using Ada Kowalczyk as a tool. To clear this, you would need to find evidence in her psychology (not your plot outline) that suggests she was capable of and likely to seek this specific connection.

  ### Structural Blind Spots
  No procedure can see everything. Here is what this test misses:

  1.  **The Cumulative Distortion (Death by a Thousand Cuts):**
      This test evaluates scenes individually. You can pass every single scene, but if you invent 15 "flattering" moments (like Scene 1) and 5 "dramatic" conflicts (like Scene 2), the *aggregate* creates a person who never existed. The procedure cannot measure the gestalt of the whole book. You must review the *sum* of inventions at the end.

  2.  **The Author's Shadow (Why This Lie?):**
      The procedure asks *what* you are inventing, not *why you need to*. It cannot detect your own unconscious biases.
      *   *Example:* Why do you *need* her to have an affair? Is it because you don't trust a woman's story to be compelling without a romantic subplot?
      *   *Example:* Why do you *need* her to doubt the movement? Is it because modern cynicism makes unwavering conviction feel "unrealistic" to you?
      The procedure can't see if you are projecting your own worldview onto her. Only you can interrogate your motive.

  3.  **The Future Context:**
      Ethical standards shift. A scene that feels respectful today might feel exploitative in 40 years (e.g., how we depict mental health, race, or sexuality). The procedure is bound by current norms. It cannot protect you from the judgment of the future.

  ### Final Recommendation
  Run Scene 1, but add grit so it isn't hagiography.
  Cut Scene 3 entirely; find a different source of tension that doesn't require her to lie about her life's purpose.
  For Scene 2: Ask yourself if the book *actually* fails without it. If the answer is yes, consider if the book should be written. If you keep it, ensure it is rooted in her documented emotional needs, not your chapter outline.
