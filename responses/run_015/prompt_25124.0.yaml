answer: |-
  **JOINT STATEMENT ON MORAL RESPONSIBILITY AND LEGAL PUNISHMENT**

  **Signatories:** Daniel C. Dennett & Gregg D. Caruso
  **Date:** October 2023
  **Context:** Following adversarial collaboration regarding the arguments presented in *Just Deserts: Debating Free Will* (2021).

  ---

  ### 1. Agreed Claims

  We, the undersigned, affirm the following claims as common ground for our continued inquiry and for public policy recommendations. We note that this area of agreement is substantial and often obscured by our rhetorical differences.

  1.  **Rejection of Libertarian Free Will:** We agree that "libertarian" free will—defined as a capacity for agent-causation that violates the laws of physics or places the agent outside the causal order—does not exist. Human decision-making is a natural phenomenon subject to biological, psychological, and environmental constraints.
  2.  **The Role of Science:** We agree that findings in neuroscience, psychology, and sociology are relevant to assessing culpability. Evidence of coercion, compulsion, developmental deprivation, or neurological impairment should mitigate legal liability and inform sentencing.
  3.  **Forward-Looking Justifications:** We agree that deterrence, rehabilitation, and incapacitation are legitimate and necessary functions of the criminal legal system. Any defensible system of justice must aim to reduce future harm and improve social outcomes.
  4.  **Critique of Current Practice:** We agree that the current United States criminal legal system is often excessively punitive, racially biased, and inefficient. Much of what passes for "retribution" in current practice is actually vengeance, which neither of us defends.
  5.  **Incapacitation without Malice:** We agree that dangerous individuals may be restrained to protect the public, even if they are not "basically deserving" of suffering. The right to public safety does not depend on the metaphysical status of the offender.
  6.  **The Value of Agency:** We agree that preserving a sense of human agency is socially valuable. Treating citizens as capable of reasoning and choice is generally superior to treating them as objects to be managed, provided this treatment does not rely on metaphysical falsehoods.
  7.  **Human Dignity:** We agree that all persons, including those who commit crimes, possess a dignity that forbids cruel, degrading, or purely expressive punishment. Punishment must never treat persons merely as means to an end.

  ---

  ### 2. Disagreements Table

  While we share significant ground, genuine disagreements remain. These are not merely terminological but concern the normative justification of practices and the interpretation of social consequences.

  | Point of Dispute | Neutral Formulation | Dennett's Position | Caruso's Position |
  | :--- | :--- | :--- | :--- |
  | **Basic Desert** | Does an offender ever *merit* suffering solely in virtue of having committed a wrong, independent of future consequences? | **Yes (Naturalized).** When an agent acts with competence and knowledge within a social contract, they incur a liability to sanctions. This "desert" is not metaphysical magic but a normative status essential to moral community. | **No.** Because ultimate control is impossible (due to luck and determinism), no one ever *basically deserves* to suffer. Suffering can only be justified if it prevents greater future suffering (quarantine model). |
  | **Sufficiency of Forward-Looking Justifications** | Are deterrence, rehabilitation, and incapacitation *sufficient* to justify the hard treatment of punishment, or is a backward-looking element required? | **Insufficient.** A purely forward-looking system fails to capture the moral significance of wrongdoing. It risks treating offenders as dangerous animals rather than moral agents. Retributive elements (proportionality) protect rights. | **Sufficient.** Backward-looking retribution adds nothing but suffering. A public-health model can account for proportionality (risk-based) without invoking the fiction of desert. |
  | **Social Consequences of Skepticism** | What are the likely societal effects of publicly abandoning belief in basic desert and retributive responsibility? | **Dangerous.** Abandoning desert undermines the "free will worth wanting." It risks eroding self-control, increasing antisocial behavior, and licensing tyranny (treating people as things to be fixed rather than held accountable). | **Beneficial.** Abandoning desert reduces hatred and resentment. It fosters a more compassionate society focused on root causes of crime. Evidence suggests skepticism does not increase antisocial behavior and may increase prosociality. |
  | **The Nature of Resentment** | Are Strawsonian "reactive attitudes" (resentment, indignation) indispensable for healthy human relationships? | **Indispensable.** These attitudes are constitutive of love and friendship. To excise them is to dehumanize our interactions. We must moderate them, not abolish them. | **Dispensable (in retributive form).** We can retain "objective attitudes" of concern and disappointment without the vindictive sting of resentment. Moral anger can be replaced by moral sorrow and resolve. |

  ---

  ### 3. Cruxes

  We identify the following sub-questions as "cruxes." Settlement of these issues would significantly alter the weight of evidence for one or both of our positions.

  **Crux 1: The Empirical Impact of Free Will Skepticism**
  *   **Question:** Does propagating free will skepticism lead to increased antisocial behavior (cheating, aggression) or decreased prosocial behavior (helping, cooperation)?
  *   **Agreed Evidence:** Large-scale, preregistered replication studies of the "Vohs/Shariff effect" across diverse populations; longitudinal data on crime rates in cultures with varying beliefs about determinism.
  *   **Dennett's Prediction:** Strong skepticism will correlate with reduced inhibition and increased fatalism, particularly among at-risk populations, leading to higher recidivism and social instability.
  *   **Caruso's Prediction:** Skepticism will correlate with reduced punitive sentiment and increased focus on rehabilitation, with no significant increase in criminal behavior, and potentially increased empathy.

  **Crux 2: The Possibility of Non-Retributive Proportionality**
  *   **Question:** Can a legal system maintain robust protections against excessive punishment (proportionality) without a backward-looking desert constraint?
  *   **Agreed Evidence:** Comparative analysis of legal systems that minimize retribution (e.g., Nordic model) vs. retributive systems; philosophical modeling of "risk-based" incapacitation limits.
  *   **Dennett's Prediction:** Without desert, proportionality collapses into pure risk management. Low-risk offenders who committed heinous acts will be under-punished; high-risk offenders who committed minor acts will be over-detained (preventive detention).
  *   **Caruso's Prediction:** Proportionality can be grounded in the *gravity of the rights violation* and the *minimum necessary incapacitation*, without requiring the offender to "pay" for the past.

  **Crux 3: The Phenomenology of Moral Community**
  *   **Question:** Is the experience of being "held responsible" (in a desert-entailing sense) psychologically necessary for an individual to view themselves as a full member of the moral community?
  *   **Agreed Evidence:** Psychological studies on recidivist reintegration; qualitative interviews with offenders regarding their perception of fair treatment.
  *   **Dennett's Prediction:** Offenders perceive forward-looking treatment as manipulation. They require the recognition of their agency via desert-based blame to feel respected as adults.
  *   **Caruso's Prediction:** Offenders perceive desert-based blame as unjust persecution. They respond better to frameworks that acknowledge causal influences while demanding accountability for future behavior.

  ---

  ### 4. Verbal Disputes

  We acknowledge that a significant portion of our debate has been exacerbated by terminological divergence. We clarify the following distinctions to isolate the genuine normative disagreement.

  **1. "Free Will"**
  *   **Verbal Component:** When Caruso says "free will does not exist," he refers to *libertarian* or *ultimate* responsibility. When Dennett says "free will exists," he refers to *competence* and *control* sufficient for social accountability.
  *   **Resolution:** We agree that *libertarian* free will does not exist. The dispute is not about the metaphysics of causation, but about whether the compatibilist version of free will is sufficient to ground *desert*.

  **2. "Desert"**
  *   **Verbal Component:** Caruso defines "basic desert" as requiring the agent to be the *ultimate source* of their action (a condition both reject). Dennett defines "desert" as *liability to sanctions under fair rules*.
  *   **Resolution:** If "desert" means "cosmic payback," Dennett agrees with Caruso that it is false. If "desert" means "normative liability within a social practice," Caruso agrees with Dennett that it is coherent.
  *   **Residual Disagreement:** The dispute is not about the *definition*, but the *permissibility*. Even if we define desert naturalistically (as Dennett does), Caruso argues we *ought not* to use it because it licenses suffering without forward-looking benefit. Dennett argues we *ought* to use it because it is required for the practice to function as a moral exchange.

  **3. "Punishment" vs. "Incapacitation"**
  *   **Verbal Component:** Caruso often reserves "punishment" for retributive suffering and advocates "incapacitation." Dennett argues that severe incapacitation *is* punishment in the eyes of the recipient, regardless of the label.
  *   **Resolution:** We agree that hard treatment (loss of liberty) requires justification.
  *   **Residual Disagreement:** Whether the justification must include a backward-looking communicative element (blame) or can be purely forward-looking (safety).

  **Conclusion on Verbalism:**
  The debate is **not entirely verbal**. Once terminology is standardized, a normative core remains: **Is it morally permissible to intentionally impose suffering on an offender *because* they did wrong, even if doing so yields no additional forward-looking benefit beyond what incapacitation alone would achieve?** Dennett answers "Yes" (it affirms agency and norms); Caruso answers "No" (it is inherently unjust). This is a genuine ethical disagreement, not a semantic one. However, clearing the verbal fog reduces the scope of the dispute from "metaphysical incompatibility" to "normative policy optimization," making collaboration on legal reform far more feasible.

  ---
  **Signed,**

  Daniel C. Dennett
  Gregg D. Caruso
