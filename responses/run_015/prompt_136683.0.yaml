      *   **Constraints on Output:** No bibliographies, focus on reasoning/conceptual bottlenecks, practical advice for philosophers without lab access.

  2.  **Evaluate Track 1: Graded Consciousness**
      *   *Core Issue:* What does "more" or "less" conscious mean? Is it a dimmer switch (intensity), a high-def screen (richness), or a broadcast system (availability)?
      *   *Upstream/Downstream:* This is foundational. You can't compare Species A to Species B without knowing *what* dimension you are comparing. If you don't solve this, comparative claims are category errors.
      *   *Tractability for Philosophers:* High. This is conceptual analysis, phenomenology, and integration of cognitive science models (GNW, HOT, etc.). Doesn't require a wet lab.
