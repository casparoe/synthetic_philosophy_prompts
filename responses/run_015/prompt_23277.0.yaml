          3.  *Causal Goodhart:* The metric isn't causing the goal, just correlated. Intervening on the metric doesn't move the goal.
          4.  *Adversarial Goodhart:* Agents actively game the system.
      *   *The "Physics" Analogy:* Use a physics analogy they'll understand.
