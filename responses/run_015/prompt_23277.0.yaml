      *   *The Core Distinction (Agency/Feedback):* Explain that overfitting assumes a static environment. Goodhart assumes a reactive environment. The "data generating process" changes *because* of the model.
      *   *Manheim's Taxonomy:* Introduce David Manheim's breakdown. This is crucial for a rigorous answer.
          1.  *Regressional Goodhart:* (This is the user's overfitting point). Selecting extreme values leads to noise dominance.
