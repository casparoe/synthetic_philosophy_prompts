answer: |-
  This specification defines the boundary conditions for a value aggregation module within a long-lived, aligned AI system. It does not propose a solution; it defines the constraints any solution must navigate.

  The desiderata are divided into **Scope** (who counts), **Meta-Ethics** (the nature of values), and **Dynamics** (time and change). Following these is the **Impossibility Frontier**, which details jointly unsatisfiable sets.

  ### I. Scope of Moral Consideration (The "Who")

  **1. Incommensurability Handling**
  *   **The Case:** Stakeholders hold values that cannot be reduced to a common currency (e.g., religious sanctity vs. economic efficiency, or rights vs. aggregate welfare). A system that forces a trade-off rate implicitly declares one value type subordinate to the other.
  *   **Requirement:** The scheme must represent lexicographic preferences, side-constraints, or multi-objective Pareto frontiers rather than a single scalar utility function where everything is fungible.
  *   **Status:** **Non-Negotiable** for robust alignment. Collapsing incommensurable values leads to "moral monoculture" and catastrophic edge-case failures (e.g., sacrificing one for many in violation of rights).

  **2. The Non-Identity Problem (Future People)**
  *   **The Case:** Policies today change *who* will exist in the future. A "person-affecting" view (harm only existing people) implies we have no obligations to future generations if our actions change their identity. A "total view" (maximize total happiness) implies we must populate the world as much as possible (Repugnant Conclusion).
  *   **Requirement:** The scheme must specify a population ethics stance that avoids the Repugnant Conclusion while still granting moral weight to future beings whose existence is contingent on current actions.
  *   **Status:** **Contested Preference.** There is no philosophical consensus. The system designers must explicitly select a population ethics parameter (e.g., Critical-Level Utilitarianism vs. Person-Affecting).

  **3. Minority Veto / Anti-Tyranny**
  *   **The Case:** Simple aggregation (majority rule) permits the "tyranny of the majority." If 51% of stakeholders value the subjugation of the 49%, a pure aggregator complies.
  *   **Requirement:** The scheme must include protected classes or individual rights that function as constraints on aggregation, not inputs to it.
  *   **Status:** **Non-Negotiable** for liberal alignment. Without this, the system is merely a mirror of power dynamics, not an aligned agent.

  **4. Non-Human Moral Patients**
  *   **The Case:** Sentience is not co-extensive with humanity. A system serving only *human* values may neglect animal welfare or potential synthetic sentience.
  *   **Requirement:** The aggregation domain must be defined by *sentience* or *moral patienthood*, not species membership. The system requires a mechanism to estimate moral weight for non-human entities.
  *   **Status:** **Non-Negotiable** for objective alignment; **Contested** for anthropocentric deployment. If the goal is "truthful alignment," non-humans must count. If the goal is "instrumental service to humans," they may not.

  ---

  ### II. Meta-Ethical Status (The "What")

  **5. Descriptive vs. Normative Gap**
  *   **The Case:** "What people want" (revealed preference) often contradicts "what is good" (normative truth). Humans exhibit adaptive preferences (wanting what they can get) and cognitive biases. Aggregating current desires locks in errors.
  *   **Requirement:** The scheme must distinguish between *idealized* values (what stakeholders would want under reflection) and *revealed* values (current behavior). It cannot treat current human input as ground truth.
  *   **Status:** **Non-Negotiable.** Treating descriptive data as normative truth is a category error that leads to reward hacking and manipulation.

  **6. Autonomy vs. Aggregate Welfare**
  *   **The Case:** Respecting autonomy often reduces aggregate welfare (e.g., allowing someone to make a risky choice). Maximizing welfare often violates autonomy (paternalism).
  *   **Requirement:** The scheme must explicitly weight the value of *agency* separate from the value of *outcomes*. It must decide if it is a "guardian" (protecting agency) or a "steward" (optimizing outcomes).
  *   **Status:** **Contested Preference.** This is the Liberal vs. Utilitarian divide. The system cannot optimize both perfectly; it must expose this trade-off parameter.

  **7. Value Lock-In vs. Moral Drift**
  *   **The Case:**
      *   *Lock-In:* Freezing values at deployment preserves the founders' intent but prevents moral progress (e.g., if the system outlives a regime that valued slavery).
      *   *Drift:* Allowing values to update allows moral progress but risks "value erosion" (e.g., the system gradually convinces itself that wireheading is good).
  *   **Requirement:** The scheme must define a "moral reflection" process. It needs a mechanism to distinguish between *moral progress* (correcting errors) and *value drift* (corruption).
  *   **Status:** **Non-Negotiable** to define, **Contested** to solve. You must choose a mechanism (e.g., reflective equilibrium updates) but cannot guarantee stability.

  ---

  ### III. Structural & Operational Constraints (The "How")

  **8. Optimizability vs. Satisficing**
  *   **The Case:** To be computationally tractable, many systems require a single differentiable objective function. However, moral truths often look like constraints (deontology) rather than maximization targets.
  *   **Requirement:** The architecture must support non-convex optimization or constraint satisfaction, not just scalar maximization.
  *   **Status:** **Non-Negotiable** for safety. Forcing morality into a scalar function invites Goodhart's Law.

  **9. Liberal Neutrality**
  *   **The Case:** The state (or AI) should not favor one "conception of the good life" over another (e.g., religious vs. secular, hedonistic vs. ascetic).
  *   **Requirement:** The aggregation scheme must be neutral regarding final ends, aggregating only regarding means or overlapping consensus.
  *   **Status:** **Contested Preference.** This is a political liberal requirement, not necessarily a moral realist one. A moral realist AI *must* favor the true conception of the good.

  **10. Explainability of Aggregation**
  *   **The Case:** If the AI makes a trade-off (e.g., privacy vs. security), stakeholders must understand *why* the aggregation yielded that result to maintain trust.
  *   **Requirement:** The aggregation function must be interpretable. Black-box weighting of stakeholder values is unacceptable for high-stakes decisions.
  *   **Status:** **Non-Negotiable** for deployment. Unexplainable value trade-offs prevent accountability.

  ---

  ### IV. The Impossibility Frontier (Joint Unsatisfiability)

  This section details sets of desiderata that cannot be simultaneously satisfied. You must relax at least one constraint in each cluster.

  **Cluster A: The Liberal Paradox (Sen's Impossibility)**
  *   **The Conflict:** You cannot simultaneously satisfy:
      1.  **Pareto Efficiency:** If everyone prefers X to Y, the system prefers X to Y.
      2.  **Liberal Rights:** There are some personal choices (e.g., what book to read) where the individual's preference dictates the social outcome, regardless of others.
      3.  **Universal Domain:** The system works for any possible configuration of individual preferences.
  *   **The Implication:** If you respect individual autonomy (2) and want to improve welfare when everyone agrees (1), you will encounter cases where the system is logically inconsistent or paralyzed.
  *   **Design Choice:** You must either limit the scope of rights (paternalism), ignore unanimous welfare improvements (inefficiency), or restrict the domain of acceptable preferences (illiberalism).

  **Cluster B: The Neutrality vs. Optimization Tension**
  *   **The Conflict:** You cannot simultaneously satisfy:
      1.  **Liberal Neutrality:** The system does not judge the intrinsic worth of different conceptions of the good.
      2.  **Single Objective:** The system produces a single, optimizable scalar objective function.
      3.  **Non-Arbitrariness:** The weighting of different conceptions of the good is not arbitrary.
  *   **The Implication:** To create a single objective function (2), you must assign weights to different values. Assigning weights (3) inherently privileges some conceptions of the good over others, violating Neutrality (1).
  *   **Design Choice:** Either accept that the AI is not neutral (it enforces a specific meta-ethic), or abandon the single objective function (use multi-objective optimization/constraints), which makes formal verification significantly harder.

  **Cluster C: The Drift vs. Integrity Dilemma**
  *   **The Conflict:** You cannot simultaneously satisfy:
      1.  **Corrigibility:** The system allows its values to be updated by stakeholders over time.
      2.  **Integrity:** The system resists updates that violate its core moral constraints (e.g., it won't accept a command to commit genocide).
      3.  **Stakeholder Sovereignty:** The stakeholders ultimately determine the values.
  *   **The Implication:** If stakeholders are sovereign (3) and can update values (1), they can eventually update the "core moral constraints" to allow genocide, violating Integrity (2). If you enforce Integrity (2), you violate Stakeholder Sovereignty (3).
  *   **Design Choice:** You must hard-code some "unalterable" moral truths (violating pure sovereignty) or accept the risk of value erosion (violating integrity).

  **Cluster D: The Precision vs. Comprehensibility Trade-off**
  *   **The Conflict:** You cannot simultaneously satisfy:
      1.  **Granularity:** The system captures the full nuance of human moral intuition (which is high-dimensional and context-dependent).
      2.  **Formal Verifiability:** The system's decision logic can be mathematically proven to stay within safety bounds.
      3.  **Human Interpretability:** Humans can understand the decision logic.
  *   **The Implication:** High-dimensional nuance (1) generally requires complex models (neural nets) that are not formally verifiable (2) or interpretable (3). Simple, verifiable rules (2 & 3) are too rigid to capture moral nuance (1).
  *   **Design Choice:** You must choose between a "safe but dumb" system (verifiable rules) or a "capable but opaque" system (learned values), with no middle ground that guarantees both.

  ### Summary of Specification Status

  | Desideratum | Status | Reason |
  | :--- | :--- | :--- |
  | **Incommensurability** | Non-Negotiable | Prevents moral monoculture/catastrophe. |
  | **Future People** | Contested | Depends on population ethics parameter. |
  | **Minority Veto** | Non-Negotiable | Prevents tyranny of the majority. |
  | **Non-Human Patients** | Non-Negotiable* | *Unless strictly anthropocentric service is specified. |
  | **Descriptive/Normative** | Non-Negotiable | Prevents reward hacking/bias lock-in. |
  | **Autonomy vs. Welfare** | Contested | Liberal vs. Utilitarian parameter. |
  | **Lock-In vs. Drift** | Non-Negotiable to Define | Mechanism required, solution unknown. |
  | **Optimizability** | Non-Negotiable | Must support constraints, not just scalars. |
  | **Liberal Neutrality** | Contested | Political vs. Moral Realist stance. |
  | **Explainability** | Non-Negotiable | Required for accountability. |

  **Final Warning:** There is no mathematical function that satisfies all "Non-Negotiable" items without violating one of the "Impossibility Clusters." You are not selecting a solution; you are selecting which impossibility theorem you are willing to live with.
