answer: |-
  **Entry Point:** We accept that a ventilated patient with total loss of clinical brain function, on adequate testing, is dead.

  > **Node 1: The Controlled DCD Case**
  > *A patient undergoes withdrawal of ventilation; asystole occurs. CPR could restore circulation but will not be given. Are they dead at asystole?*
  > - **Yes:** Death is **Permanent** (will not be reversed). *Rationale: Distinguishes decision-based permanence from physiological impossibility.*
  > - **No:** Death is **Irreversible** (cannot be reversed). *Rationale: Requires physiological impossibility before death is declared.*
  >
  > **Node 2: The Anoxic Neocortical Case**
  > *A patient breathes spontaneously with sleep–wake cycles but has extensive neocortical destruction and no consciousness. Are they dead?*
  > - **Yes:** Death is **Biographical** (loss of personhood). *Rationale: Locates death in the higher brain/consciousness.*
  > - **No:** Death is **Biological** (loss of organismal function). *Rationale: Locates death in the whole brain or body.*
  >
  > **Node 3: The Brain-Dead Pregnant Case**
  > *A brain-dead patient maintains thermoregulation and sodium balance for weeks. Is this an integrated organism?*
  > - **Yes:** Integration is **Somatic**. *Rationale: Hormonal/homeostatic function counts as integration (Brainstem view).*
  > - **No:** Integration is **Neurological**. *Rationale: Brain-mediated integration is required (Whole-Brain view).*
  >
  > **Node 4: The VA-ECMO Case**
  > *A patient has no cardiac output but cerebral circulation is maintained by a pump. Is circulation present?*
  > - **Yes:** Function is **Mechanical**. *Rationale: Machine-sustained flow counts as biological function.*
  > - **No:** Function is **Organic**. *Rationale: Only intrinsic cardiac function counts as circulation.*
  >
  > **Node 5: The Hydranencephaly Case**
  > *An infant is born with cerebral hemispheres replaced by fluid but breathes and reacts. Are they dead?*
  > - **Yes:** **Actual** Function Required. *Rationale: Consistent with Higher-Brain; lack of capacity is death.*
  > - **No:** **Developmental** Potential Matters. *Rationale: Infants cannot be 'dead' by higher-brain criteria if they never had cortex.*
  >
  > **Node 6: The Isolated Brain Case**
  > *A mammalian brain is kept metabolically active by perfusion after the organism's death. Is it alive?*
  > - **Yes:** **Tissue** Viability Suffices. *Rationale: Life resides in the parts; the organism is a collection.*
  > - **No:** **Organism** Priority. *Rationale: Life is a property of the whole; parts are merely viable tissue.*
  >
  > **Node 7: The Deep Hypothermia Case**
  > *Extracorporeal cooling begins minutes after asystole; structure is preserved, function absent. Is death an event?*
  > - **Yes:** Death is a **Moment**. *Rationale: Death occurs at a specific time (asystole or brain death).*
  > - **No:** Death is a **Process**. *Rationale: Death is gradual; the 'moment' is a legal cut-off on a biological continuum.*
  >
  > **Node 8: The Purpose Question**
  > *Should the definition of death change for organ procurement versus inheritance law?*
  > - **Yes:** **Pluralism**. *Rationale: Death is a cluster concept serving different social goods.*
  > - **No:** **Unitary**. *Rationale: Death is a brute biological fact independent of context.*

  ### **The Leaves: Positions in the Logical Space**

  By combining the branches above, we locate the familiar positions. Note that some combinations are unoccupied.

  *   **Whole-Brain Death:** (Node 2: No, Node 3: No). *Awkward commitment:* A body breathing and gestating a foetus is a corpse, despite somatic integration.
  *   **Brainstem Death:** (Node 2: No, Node 3: Yes). *Awkward commitment:* A body maintaining homeostasis without a brain is dead, but a body with a brainstem but no cortex is alive.
  *   **Higher-Brain Death:** (Node 2: Yes). *Awkward commitment:* A breathing, waking human being is dead because they lack consciousness; conflicts with Node 5 (Hydranencephaly) unless developmental potential is ignored.
  *   **Circulatory-Permanent:** (Node 1: Yes). *Awkward commitment:* A patient is dead even if their heart could physically be restarted, provided we decide not to do so.
  *   **Circulatory-Irreversible:** (Node 1: No). *Awkward commitment:* We must wait until auto-resuscitation is physiologically impossible, potentially compromising organ viability.
  *   **Gradualist:** (Node 7: No). *Awkward commitment:* There is no precise time of death; the death certificate records a legal fiction.
  *   **Pluralist:** (Node 8: Yes). *Awkward commitment:* A person is dead for the surgeon but alive for the heir, creating ontological instability.
  *   **Organism-As-Integrated-Whole:** (Node 6: No, Node 3: No). *Awkward commitment:* An isolated perfused brain is not alive, yet a brain-dead body on a ventilator is dead despite perfusion.

  **Inseparable Leaves:** *Whole-Brain* and *Brainstem* views are clinically inseparable in most jurisdictions because testing protocols conflate brainstem failure with whole-brain failure, though logically distinct at Node 3. *Circulatory-Permanent* and *Circulatory-Irreversible* are often conflated in policy, though Node 1 separates them.

  **Unoccupied Space:** The combination of *Higher-Brain* (Node 2: Yes) and *Organism Priority* (Node 6: No) is unstable: if life requires the whole organism, the loss of the cortex alone should not constitute death. This space is largely unexplored because it denies both the biological and biographical criteria.

  ### **Practical Purposes and Divergence**

  The committee must recognise that four practical purposes pull these nodes in different directions.

  1.  **Organ Procurement (Dead Donor Rule):** Pulls towards **Node 1 (Permanent)** and **Node 3 (Somatic)**. Declaring death at asystole (Permanent) or accepting brainstem death despite hormonal function maximises organ viability.
  2.  **Withdrawal of Treatment:** Pulls towards **Node 2 (Biographical)** and **Node 7 (Process)**. Families often view the loss of personhood (PVS) as the relevant death, or view dying as a process allowing time for farewell, conflicting with the 'moment' required for procurement.
  3.  **Legal Inheritance/Criminal Law:** Pulls towards **Node 1 (Irreversible)** and **Node 8 (Unitary)**. The law requires certainty (Irreversible) and a single definition (Unitary) to settle estates or prosecute homicide, resisting Pluralism.
  4.  **Death Certification:** Pulls towards **Node 7 (Moment)**. Administrative systems require a specific time, forcing a 'cut-off' on what may be a biological Process.

  **Shift Points:**
  *   **Node 1 (DCD)** shifts between Procurement (Permanent) and Law (Irreversible).
  *   **Node 2 (Personhood)** shifts between Withdrawal (Biographical) and Certification (Biological).
  *   **Node 8 (Purpose)** is the master switch: if you answer 'Yes', you admit the tree is not a map of reality, but a menu of conventions.

  **Redundancy Check:** The *High Cervical Injury* control case (conscious, ventilator-dependent) is redundant if Node 2 and Node 4 are answered consistently. If one claims the ventilator-dependent conscious patient is alive (correct), one cannot claim the ventilator-dependent brain-dead patient is dead *because* of the ventilator (Node 4). It serves only to check for consistency regarding artificial support.

  **Final Note:** This instrument does not solve the metaphysics. It reveals that the committee's consensus is likely a patchwork of answers to these eight nodes, stabilised by policy rather than logic. The 'awkward commitments' highlight where policy overrides ontology.
