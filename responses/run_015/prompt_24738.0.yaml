answer: |-
  The slogan "what is bad must be bad for someone" is a rhetorical chameleon. In population ethics, it functions as a premise that bridges **prudential badness** (welfare/harm to an individual) and **moral badness** (wrongness of an act or state of affairs). The Non-Identity Problem (NIP) arises precisely because this bridge collapses when the "someone" in the outcome is not identical to the "someone" in the counterfactual.

  Here is the disambiguation of the distinct principles this one-liner can express, evaluated by their logical status, their interaction with identity-changing cases, and their ability to support the conclusion that such policies are not wrong.

  ### 1. The Narrow Person-Affecting Restriction (NPAR)
  This is the most common engine behind the NIP conclusion.

  *   **Precise Formulation:** An act $A$ is morally wrong only if there exists a particular person $p$ such that $p$ exists in both the actual world (where $A$ is performed) and the relevant counterfactual world (where $A$ is not performed), and $p$ is worse off in $A$ than in $\neg A$.
  *   **Nature of Claim:** A substantive moral principle, not a conceptual truth. It asserts a necessary condition for moral wrongness based on comparative harm to *specific, identifiable* individuals.
  *   **Status:** **Substantive and Controversial.** It is often wielded as a platitude ("Of course you need a victim!"), but it is a restrictive theory of moral obligation that excludes impersonal harms.
  *   **Interaction with Identity Cases:** In identity-changing cases (e.g., depleting resources such that different people are conceived later), there is no $p$ who exists in both worlds. Therefore, the condition " $p$ is worse off in $A$ than in $\neg A$" cannot be satisfied.
  *   **Does it support the "Not Wrong" conclusion?** **Yes.** This is the only reading that logically entails that an identity-changing policy is not wrong merely because the resulting people are not worse off than they would otherwise have been (since they wouldn't have been at all).
  *   **Refutation:** The NIP is generally taken as a *reductio* of this principle. If you accept NPAR, you must accept that causing a future with lower quality of life is permissible provided the people are different. Most ethicists view this as a reason to reject NPAR, not a reason to accept the permissibility of the policy.

  ### 2. The Wide Person-Affecting Restriction (WPAR)
  This reading attempts to save the intuition behind the slogan without falling into the NIP trap.

  *   **Precise Formulation:** An act $A$ is morally wrong only if it is bad for some person $p$. However, "bad for $p$" includes bringing $p$ into existence with a life less worth living than the life $q$ would have had in $\neg A$, or simply comparing existence to non-existence.
  *   **Nature of Claim:** A substantive moral principle that expands the definition of "harm" to include "being caused to exist" in sub-optimal conditions.
  *   **Status:** **Substantive and Defensible.** It preserves the person-affecting intuition (ethics is about people) but avoids the non-identity loophole by allowing comparisons across different possible people or treating existence as a benefit/harm.
  *   **Interaction with Identity Cases:** It allows us to say the policy is "bad for" the people who exist, because they are worse off than the *alternative people* would have been, or because their existence is a net negative compared to the alternative scenario's total welfare.
  *   **Does it support the "Not Wrong" conclusion?** **No.** This reading allows you to condemn the identity-changing policy. It blocks the move to say the policy is permissible.
  *   **Refutation:** Not refuted by NIP; rather, it is a *solution* to NIP. However, it faces the "Non-Identity Problem" of its own: how to compare existence with non-existence coherently (the "Problem of Non-Existence").

  ### 3. The Non-Comparative Threshold Principle
  This reading shifts from counterfactuals to absolute states.

  *   **Precise Formulation:** An act $A$ is bad for person $p$ if $p$'s welfare in $A$ falls below a specific threshold of decency (e.g., a life not worth living), regardless of whether $p$ would have been better off in $\neg A$.
  *   **Nature of Claim:** A claim about the nature of harm (non-comparative) rather than the nature of wrongness directly. It implies wrongness if the threshold is violated.
  *   **Status:** **Substantive.** It denies the counterfactual account of harm.
  *   **Interaction with Identity Cases:** In standard NIP cases (e.g., Parfit's "Risky Policy"), the future people have lives *worth living* (positive welfare), just not as good as the alternative. Therefore, this principle says the act is *not* bad for them.
  *   **Does it support the "Not Wrong" conclusion?** **Partially.** It supports the conclusion that the act is not wrong *if* the resulting lives are above the threshold. It fails to condemn sub-optimal but happy futures. It cannot distinguish between a future of moderately happy people and a future of very happy people if both are above the threshold.
  *   **Refutation:** It fails to capture the intuition that we should prefer the better future even if both futures contain people with lives worth living.

  ### 4. The Meta-Ethical/Semantic Claim
  This reading treats the slogan as a definition of moral language.

  *   **Precise Formulation:** The predicate "morally bad" is semantically equivalent to "prudentially bad for some subject." There is no such thing as impersonal badness.
  *   **Nature of Claim:** A conceptual or semantic claim about the meaning of moral terms.
  *   **Status:** **Plainly False (or highly contentious).** In meta-ethics, this is a form of strong subjectivism or specific person-affecting constructivism. It rules out impersonal values (e.g., the destruction of beauty, the loss of knowledge) by definition.
  *   **Interaction with Identity Cases:** If accepted as a definition, it makes the NIP conclusion analytically true. If there is no subject harmed (comparatively), the term "wrong" literally has no application.
  *   **Does it support the "Not Wrong" conclusion?** **Yes, analytically.** But only by stipulating away the possibility of impersonal wrongs.
  *   **Refutation:** Refuted by the intuitive coherence of impersonal badness. Most people find it intelligible to say a world is worse even if no specific individual is comparatively harmed (e.g., a world where everyone is slightly less happy but no one is suffering).

  ### 5. The "Victim Requirement" Platitude
  This is the rhetorical usage most often encountered in casual debate.

  *   **Precise Formulation:** "You cannot say an act is wrong unless you can point to a specific person who has a legitimate complaint."
  *   **Nature of Claim:** A heuristic or intuitive platitude about moral standing and complaints.
  *   **Status:** **Platitude in standard cases; False in NIP cases.** It holds in "Same Number Quality Claims" where identities are fixed. It breaks when identities are fluid.
  *   **Interaction with Identity Cases:** In NIP cases, the future people have no "legitimate complaint" because without the act, they wouldn't exist. The slogan uses this lack of complaint to infer lack of wrongness.
  *   **Does it support the "Not Wrong" conclusion?** **Yes, rhetorically.** It shifts the burden of proof to the critic to identify a victim. Since no victim exists (under the Narrow view), the policy is cleared.
  *   **Refutation:** The NIP demonstrates that the "Victim Requirement" is an unreliable heuristic. A policy can be wrong even if no specific victim can file a complaint (the "No Complaints" problem).

  ### Summary Table

  | Principle | Type | Status | Refuted by NIP? | Supports "Not Wrong" Conclusion? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Narrow Person-Affecting** | Moral Principle | Substantive/Controversial | Yes (via *reductio*) | **Yes** (This is the source) |
  | **2. Wide Person-Affecting** | Moral Principle | Substantive/Defensible | No (It solves NIP) | No |
  | **3. Non-Comparative Threshold** | Harm Principle | Substantive | No (But limited scope) | Only if lives > threshold |
  | **4. Semantic Claim** | Meta-Ethical | False/Contentious | N/A (Stipulative) | **Yes** (Analytically) |
  | **5. Victim Requirement** | Heuristic | Platitude (Standard)/False (NIP) | Yes | **Yes** (Rhetorically) |

  ### Conclusion on the Argumentative Move
  When an arguer uses "what is bad must be bad for someone" to conclude that an identity-changing policy is **not wrong**, they are implicitly relying on **Principle 1 (The Narrow Person-Affecting Restriction)** while masquerading it as **Principle 5 (The Victim Requirement Platitude)**.

  They are treating a substantive, controversial moral axiom (that wrongness requires comparative harm to a specific individual) as if it were a conceptual truth or a platitude. The Non-Identity Problem does not refute the logic of the inference *if* you accept Principle 1; rather, the Non-Identity Problem is the demonstration that Principle 1 yields unacceptable moral results. Therefore, the move is valid only if one is willing to bite the bullet of the Non-Identity Problem, not because the slogan is a self-evident truth.
