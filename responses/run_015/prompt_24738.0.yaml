          *   *Status:* Substantive ethical principle (not a platitude).
          *   *Refutation by NIP:* The NIP is specifically designed to show this leads to counterintuitive results (e.g., depleting resources is not wrong if different people exist). So, NIP cases *challenge* its plausibility, though they don't logically refute it (one can bite the bullet).
