answer: |-
  Here is the analysis of Nadia's position, the prediction for your goblet case, and the strategy to test her further.

  ### 1. The Prediction
  **Verdict:** Nadia will say the goblet is **not fragile**.

  **Reasoning:** She will argue that while the goblet *breaks* when tapped, it does not break *because it is fragile*. Fragility requires a specific intrinsic causal basis (a molecular structure prone to snapping under stress). Your goblet has a tough polymer structure (non-brittle basis) and breaks due to an explosive mechanism (a different causal basis). It is a **mimic**, not a fragile object. Because the mechanism is chemically integrated, it counts as intrinsic, making it an *intrinsic mimic*, which disqualifies the disposition just as the wizard (an *extrinsic mimic*) disqualifies solubility for the plastic bead.

  ### 2. The Rule She Is Running
  Nadia is operating under **The Intrinsic Causal Basis View** (often associated with David Lewis's 1997 account of dispositions).

  **Plain Language Rule:**
  > "An object has a disposition (like fragility) only if it possesses an intrinsic physical structure (a causal basis) that would *produce* the manifestation (breaking) if triggered.
  >
  > 1.  **Extrinsic factors don't count:** Things outside the object (foam, wizards, monitoring gadgets) can hide or fake a disposition, but they cannot create or destroy it.
  > 2.  **Intrinsic factors do count:** Things built into the object's structure determine what dispositions it actually has. If the structure prevents breaking (self-repair), it isn't fragile. If the structure causes breaking via the wrong mechanism (explosion), it isn't fragile."

  **Standard Labels:**
  *   **Foam/Field:** *Masks* (Extrinsic). Disposition remains.
  *   **Wizard/Goblet Charge:** *Mimics*. Disposition absent.
  *   **Self-Repair:** *Intrinsic Fink/Mask*. Disposition absent.

  ### 3. Why This Rule Fits the Data
  *   **Glass in Foam:** The glass retains its brittle molecular structure (intrinsic basis). The foam is extrinsic. Verdict: **Fragile.** (Matches Rule).
