prompt: |-
  hey — i'm a software engineer, no philosophy background, and i want a spec, not a lecture. i've read the pop-sci "heritability doesn't mean what you think it means" explainers and i don't want another one of those; i want the requirements list.

  some context on what i'm actually doing, because i think it changes the answer: i want a number that plays the role heritability plays for organisms, but for ML systems. concretely, i run a bunch of training runs and i get a spread of benchmark scores across them, and i want to say how much of that spread is "due to" the data mix vs. the architecture vs. the seed. before i invent my own metric and ship it, i want to know what the original has to get right, and where my analogy is going to fall apart.

  so: write me the desiderata for a definition or measure of heritability. adequacy is relative to a purpose, so pick one explicitly — but the two jobs i care about are (1) predicting what happens if you select on the trait (breed for it; in my case, take the best runs and do more of whatever they did), and (2) answering the ordinary-person question of how much a trait is "genetic" / how much is down to environment. tell me straight whether one number can do both jobs or whether any definition has to choose.

  for each requirement give the case behind it. the ones i already want to see handled, so don't skip them:

  - the single-gene, totally environment-fixable case (the PKU-ish one: clearly genetic, completely manageable by changing diet)
  - a trait that's near-universal and clearly genetic but has almost no variance in the population
  - a trait where nearly all the variance in my population comes from environment because the genetics is uniform
  - the same genotype doing well in one environment and badly in another
  - parents supplying both the genes and the environment, so the two are tangled together

  and i want the "does heritability 0.8 mean 80% of *your* trait is genetic" thing turned into an actual requirement with a case behind it, not just asserted as a gotcha.

  also: mark which requirements are non-negotiable (fail them and you're not measuring heritability, or you're using the number illegitimately) versus which are just preferences of one camp — the quantitative-genetics people, the interventionists, whatever. and flag any pair of desiderata you think can't be jointly satisfied; that's the part i most want, because if the list is contradictory then the honest deliverable is "stop asking for one number," and i'd rather find that out now than after i've built a dashboard on top of it.

  then, briefly: which single requirement knocks out the most of the ways people actually deploy heritability numbers in arguments? and a short paragraph each — not a literature review, i don't want citations, just shape of the thing — on how three candidates do against the list: the variance-ratio / ANOVA-style definition, a counterfactual or interventionist one (something like: how much would the trait change if you changed the genes while holding environment fixed), and a molecular "caused by a gene" one.

  last: back to my ML version. which desiderata transfer cleanly, and which one breaks first — and is it because there's no analogue of random assignment, no breeding, no sampled environment, or something else? i'd rather hear the failure mode than a list of caveats. cheers.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software Engineer, no philosophy background, wants a "spec" not a "lecture." Dislikes pop-sci hand-waving. Wants concrete requirements/desiderata.
      *   **Goal:** Define a metric for ML systems analogous to heritability in biology (decomposing variance in benchmark scores into data, architecture, seed).
      *   **Core Task:** Provide a requirements list (desiderata) for a definition of heritability.
      *   **Specific Constraints:**
          *   Explicitly pick a purpose (Prediction of selection vs. "How much is genetic").
          *   Address specific cases: PKU (gene + env fix), Universal trait (no variance), Uniform genetics (all env variance), GxE interaction, Gene-Env correlation (parents).
          *   Address the "80% of *your* trait" fallacy as a requirement.
          *   Mark requirements as Non-Negotiable vs. Preference.
          *   Flag contradictory desiderata (impossibility results).
          *   Identify the single requirement that knocks out most misuse.
          *   Evaluate three candidates: Variance-Ratio (ANOVA), Counterfactual/Interventionist, Molecular/Causal.
          *   Apply to ML context: What transfers, what breaks first, and why.
      *   **Tone:** Direct, technical, structured, no fluff, no citations.

  2.  **Deconstruct Heritability (The "Spec"):**
      *   Heritability ($h^2$) is fundamentally a population statistic about *variance*, not an individual statistic about *causation*.
      *   There are two main types: Broad-sense ($H^2$, total genetic variance) and Narrow-sense ($h^2$, additive genetic variance). For the user's purpose (selection/breeding), Narrow-sense is the critical one.
      *   *Purpose Selection:* The prompt asks to choose between (1) Predicting selection response and (2) Answering "how much is genetic."
      *   *Decision:* I must explicitly state that *one number cannot do both jobs well*. This is the core tension. I will frame the "Non-Negotiables" around the statistical definition (Variance-Ratio) because that's the only mathematically coherent one, but highlight where it fails the "ordinary person" intuition.

  3.  **Drafting the Desiderata (The Requirements List):**
      *   *Req 1: Population Specificity.* Heritability is not a constant of the trait; it's a property of the population in an environment. (Addresses the "Universal trait" case).
      *   *Req 2: Variance, Not Mean.* It explains differences, not the absolute level. (Addresses the "80% of your trait" fallacy).
      *   *Req 3: Additivity (for Selection).* To predict breeding success, you need additive variance, not dominance/epistasis. (Addresses the "Selection" goal).
      *   *Req 4: Env-Independence (Idealized).* The measure should hold if environments change, *but* this is where it breaks. (Addresses GxE).
      *   *Req 5: Orthogonality.* Genes and Environment must be uncorrelated for the variance decomposition to hold. (Addresses Parent/Env tangle).
      *   *Req 6: Modifiability.* High heritability does not imply immutability. (Addresses PKU).

      *   *Classification:*
          *   Non-Negotiable: Population Specificity, Variance Not Mean, Orthogonality (for the math to work).
          *   Preference/Trade-off: Env-Independence (impossible to guarantee), Additivity (depends on goal).
          *   Contradiction: "Predict Selection" vs. "Immutable/Genetic Essence."

  4.  **Addressing the Specific Cases:**
      *   *PKU:* Req 6 (Modifiability). High $h^2$ $\neq$ unchangeable.
      *   *Universal Trait (5 fingers):* Req 1 (Population Specificity). If Var(Trait) = 0, $h^2$ is undefined or 0, despite being genetic.
      *   *Uniform Genetics (Clones):* Req 1. $h^2$ = 0 because Var(G) = 0.
      *   *GxE:* Req 4. $h^2$ is environment-specific.
      *   *Gene-Env Correlation:* Req 5. Violates ANOVA assumptions.
      *   *80% of Your Trait:* Req 2. Category error (variance vs. level).

  5.  **The "One Number" Question:**
      *   Can one number do both jobs (Selection vs. Essence)? **No.**
      *   Why? Selection depends on additive variance in a specific context. "Essence" implies causality/immutability which variance ratios don't capture.
      *   *Verdict:* Stop asking for one number if you want both.

  6.  **The "Knockout" Requirement:**
      *   Which one stops misuse? **Req 2: Variance, Not Mean.** This stops the "80% of *your* height" interpretation.

  7.  **Evaluating the Three Candidates:**
      *   *Variance-Ratio (ANOVA):* The standard. Good for selection (if narrow-sense). Fails "Essence" question. Fails with GxE correlation.
      *   *Counterfactual/Interventionist:* Good for "Essence" (what if we changed genes?). Hard to measure. Doesn't predict selection response directly (needs additive structure).
      *   *Molecular/Causal:* Good for mechanism. Terrible for aggregate prediction. Doesn't sum to variance easily.

  8.  **ML Context Application:**
      *   *Transfers:* Variance decomposition (ANOVA) works great. You control seeds (randomization).
      *   *Breaks First:* **Gene-Env Correlation (Req 5) / Selection Feedback.** In biology, genes affect environment (niche picking). In ML, Architecture affects *which* data is selected or how hyperparameters are tuned.
      *   *Actually, the bigger break:* **The "Breeding" Analogy.** In biology, offspring inherit genes + new env. In ML, "breeding" (taking best runs) usually means copying weights/arch + new data seed. But if you tune hyperparams based on the score, you introduce selection bias that violates the independence assumptions.
      *   *Wait, the prompt asks for the *failure mode*.* The biggest failure mode in ML is that "Architecture" isn't fixed like DNA. It's a hyperparameter choice. If you select the best runs and "do more of what they did," you are often overfitting the benchmark, not finding a robust architectural truth.
      *   *Refined Failure Mode:* **Non-Stationarity of the "Environment".** In biology, the environment is external. In ML, the "data mix" is often curated *based on* previous performance. This violates the orthogonality requirement (Req 5).

  9.  **Review and Refine:**
      *   *Tone Check:* Is it too academic? Keep it punchy. "Spec" style.
      *   *Constraint Check:* Did I cover PKU? Yes. Universal trait? Yes. 80% fallacy? Yes. Non-negotiables marked? Yes. Contradictions flagged? Yes.
      *   *Structure:* Use bolding, lists, clear sections.

  10. **Final Polish:** (Self-Correction during drafting)
      *   Make sure to distinguish Broad vs. Narrow sense heritability briefly, as it matters for the "Selection" goal. Narrow-sense is the one that predicts breeding.
      *   Ensure the ML section doesn't drift into advice but stays on the *analogy breakdown*.
      *   The "80% of your trait" requirement needs to be phrased as a constraint on the *interpretation* of the output.

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the spec for Heritability ($h^2$).

  ### Purpose Declaration
  You asked if one number can do two jobs: **(1) Predict response to selection** and **(2) Quantify "genetic essence" (immutability/causation).**

  **Verdict:** No. A single scalar cannot satisfy both.
  *   **Job 1 (Selection)** requires *Narrow-Sense Heritability* ($h^2$): Additive genetic variance / Total phenotypic variance. This predicts how much the population mean shifts if you breed the top performers.
  *   **Job 2 (Essence)** implies a counterfactual: "If we changed the genes, how much would the trait change?" This requires *Broad-Sense* or causal attribution, which includes non-additive effects (dominance, epistasis) that do not transmit reliably to offspring.

  **Decision:** The standard definition prioritizes **Job 1 (Selection)**. If you use it for Job 2, you are violating the spec.

  ---

  ### Desiderata (Requirements List)

  #### 1. Population & Environment Specificity (Non-Negotiable)
  *   **Requirement:** The metric must be defined relative to a specific population in a specific range of environments. It is not a constant of the trait.
  *   **Case:** *The Five-Finger Trait.* Having five fingers is highly genetic. But in a standard population, variance is near zero (everyone has five). $h^2 \approx 0$. If you measure $h^2$ in a population with many industrial accidents (high env variance), $h^2$ drops further.
  *   **Implication:** You cannot output a single number for "Intelligence" or "Accuracy." It must be "Accuracy $h^2$ for ResNet-50 on ImageNet-1k with Seed Range X."

  #### 2. Variance Decomposition, Not Level Attribution (Non-Negotiable)
  *   **Requirement:** The metric must quantify the proportion of *variance* in the population explained by genetic variance. It must explicitly forbid attribution of the *mean* or *individual value*.
  *   **Case:** *The 80% Fallacy.* If $h^2 = 0.8$ for height, it does **not** mean "80% of your height is genetic." It means "80% of the *differences* between people in this group are due to genetic differences."
  *   **Implication:** Your dashboard must label the axis "Variance Explained," not "Trait Composition."

  #### 3. Orthogonality of G and E (Non-Negotiable for Calculation)
  *   **Requirement:** Genetic variance and Environmental variance must be statistically independent (uncorrelated) for the simple variance ratio to hold.
  *   **Case:** *Parental Tangling.* Wealthy parents pass on genes *and* better schools. If you don't control for this, you attribute the school's effect to the genes. $h^2$ is inflated.
  *   **Implication:** If your "Architecture" choice influences your "Data Mix" choice (e.g., you pick bigger datasets for bigger models), your variance decomposition is biased.

  #### 4. Modifiability Independence (Non-Negotiable for Interpretation)
  *   **Requirement:** High heritability must not imply immutability. The metric must be compatible with cases where environmental intervention eliminates the variance entirely.
  *   **Case:** *PKU.* Phenylketonuria is 100% genetic (single gene). $h^2$ is high. But the trait (cognitive deficit) is 100% fixable by diet (environment).
  *   **Implication:** A high $h^2$ score cannot be used as an argument against the feasibility of an intervention.

  #### 5. Additivity Preference (Preference: Quantitative Genetics Camp)
  *   **Requirement:** For Job 1 (Selection), the metric should isolate *additive* genetic variance. Non-additive effects (interactions between genes) do not pass cleanly to offspring.
  *   **Case:** *Hybrid Vigor.* Two short parents can make a tall child due to dominance effects. If you measure total genetic variance (Broad-Sense), you overestimate how tall the grandchildren will be.
  *   **Implication:** For ML, if "Architecture A" only works well with "Seed B" (interaction), treating Architecture as a main effect will overpredict performance on new seeds.

  #### 6. Stability Across Environments (Preference: Interventionist Camp)
  *   **Requirement:** Ideally, the metric should hold if the environment changes.
  *   **Case:** *GxE Interaction.* A crop genotype yields high in drought, low in rain. Another is the reverse. The ranking of genotypes flips.
  *   **Contradiction Alert:** This contradicts **Req 1**. If $h^2$ is environment-specific, it cannot be stable across environments. **You cannot satisfy Req 1 and Req 6 simultaneously.**
  *   **Resolution:** Prioritize Req 1. Acknowledge $h^2$ is local.

  ---

  ### The "Knockout" Requirement
  **Req 2 (Variance, Not Level)** knocks out the most misuse.
  Almost all public arguments using heritability (e.g., "IQ is 0.8 genetic, so interventions won't work") violate this. They treat a population statistic about *spread* as an individual statistic about *cause*. Enforcing this requirement invalidates the "genetic destiny" argument entirely, because even if genes explain all the *difference*, the *level* could still be shifted entirely by environment (see PKU).

  ---

  ### Candidate Evaluation

  **1. Variance-Ratio (ANOVA-style)**
  *   **Definition:** $V_G / (V_G + V_E)$.
  *   **Performance:** Satisfies Req 1, 2, 3. Fails Req 6 (not stable). Fails Job 2 (Essence) because it doesn't distinguish additive from non-additive.
  *   **Verdict:** The industry standard. Use this for Job 1 (Selection). It is mathematically tractable but easily misinterpreted as Job 2.

  **2. Counterfactual / Interventionist**
  *   **Definition:** $E[Trait | do(G=g_1)] - E[Trait | do(G=g_2)]$.
  *   **Performance:** Satisfies Job 2 (Essence) and Req 4 (Modifiability). Fails Req 3 (Orthogonality) if you can't actually intervene on genes independently of environment. Hard to scale to populations.
  *   **Verdict:** Better for causal claims, useless for predicting breeding response (selection).

  **3. Molecular / "Caused by Gene"**
  *   **Definition:** Sum of variance explained by identified SNPs/weights.
  *   **Performance:** Fails Req 1 (Missing Heritability problem: identified genes rarely sum to total $V_G$). Fails Job 1 (Knowing the SNPs doesn't predict selection response if epistasis is high).
  *   **Verdict:** Good for mechanism, bad for prediction.

  ---

  ### ML Context: Transfer and Failure Modes

  **What Transfers Cleanly:**
  *   **Req 1 (Population Specificity):** Your metric must be "Heritability of Accuracy on Benchmark X." It will not transfer to Benchmark Y.
  *   **Req 2 (Variance):** You are measuring spread across runs, not the absolute score.
  *   **Req 5 (Additivity):** If you want to predict if "Architecture A" will win on a new seed, you need to know if the Architecture effect is additive or if it relies on specific seed interactions.

  **What Breaks First:**
  *   **Req 3 (Orthogonality / Gene-Env Independence).**
  *   **The Failure Mode:** In biology, genes are assigned at conception (mostly random relative to environment). In ML, **Architecture and Data are coupled by human choice.**
  *   **Why:** You do not sample architectures randomly from a distribution independent of your data pipeline. You tune architectures *in response to* data difficulties. If you select the "best runs" and "do more of what they did," you are not breeding; you are **overfitting the benchmark**.
  *   **Consequence:** Your "Heritability" metric will be inflated. You will attribute variance to "Architecture" that is actually due to "Architectures that happen to fit this specific data leakage."
  *   **Fix:** You need random assignment of Architecture to Data Mix to satisfy the spec. If you tune them together, you are measuring **confounded variance**, not heritability.

  **Summary Instruction:**
  Build the Variance-Ratio (ANOVA) metric. Label it "Proportion of Variance Explained." Add a warning label: "Valid only for this Data/Arch distribution. Does not predict performance on new distributions. High value does not imply immutability." If you cannot randomize Architecture independent of Data, abort the metric; you are measuring bias, not heritability.
