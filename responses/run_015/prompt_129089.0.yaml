      *   *Core Conceptual Distinction 2: Context Dependence.* $h^2$ is specific to the environment of the original sample. If the new district has different resource levels (variance in environment changes), the proportion of variance due to genetics changes. High $h^2$ in a resource-uniform setting might drop in a resource-variable setting (or vice versa). Exporting the coefficient is statistically unsound.
