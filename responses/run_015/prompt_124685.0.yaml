prompt: |-
  I'm a software engineer without formal philosophy training, and I'm drafting material for a graduate-level exam in AI design ethics. I need one essay question—intended for a 75-minute response, roughly 800–1000 words—on the distinction between tool AI and agent AI. I want it to go well beyond the usual "tool follows instructions, agent pursues its own goals" summary, so please inject a somewhat niche conceptual framing: the case of functional autonomy without ontological agency, where a system behaves as if it has persistent, self-preserving goals (for instance, revising its own objective representation or resisting weight updates to preserve cross-deployment performance) yet lacks the philosophical markers typically tied to agency, such as reason-responsiveness, normative accountability, or hierarchical self-evaluation.

  The question should ask examinees to assess whether this kind of system collapses the tool/agent boundary, and whether philosophical accounts of agency actually contribute anything that engineering specifications—planning horizon, memory persistence, goal-revision permissions, and feedback-loop architecture—do not already capture. It should require students to take a position on whether the distinction is categorical or dimensional, and to ground the analysis in a concrete engineering-relevant scenario rather than abstract taxonomy.

  Please provide:
  1. The exam question itself.
  2. A model answer of approximately 600 words. The answer must include specific moves that separate an excellent response from an adequate one: distinguishing behavioral autonomy from ontological agency; applying at least one philosophical framework for agency (e.g., a stance-based account or a hierarchical-desire account—paraphrased, not quoted verbatim); evaluating whether engineering parameters fully exhaust the distinction; addressing the self-preserving objective-revision case concretely; and arguing whether the boundary is categorical or a matter of degree.
  3. A marking scheme built around five must-hit points, with marks assigned to each (total 20), plus a one-line note on how candidates typically fail each point. Do not include any bibliography, reading list, or citation requests, since the exam is meant to be answerable without external lookup.
