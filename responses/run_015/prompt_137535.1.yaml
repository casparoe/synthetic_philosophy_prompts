  There is no single canonical noun for this specific shape, but the phenomenon is best understood as an application of **Path Dependence** to history, manifesting as **Administrative Legibility** in the human record and **Cumulative Advantage** in the digital infrastructure.

  Here is the breakdown of why these concepts fit, how they differ from the ones you rejected, and where the boundaries lie.

  ### 1. The Human Shape: Administrative Legibility
  The first phenomenon—where visibility correlates with institutional friction (being charged or petitioning)—is precisely described by political anthropologist James C. Scott's concept of **Administrative Legibility** (from *Seeing Like a State*).

  *   **What it is:** States (and large institutions) cannot "see" populations unless those populations are simplified into categories. People become visible only when they interact with the bureaucracy in ways that generate data: taxes, crimes, petitions, censuses. The "quiet middle" remains illegible because they do not generate a transactional trace.
  *   **Difference from "Silencing":** "Silencing" (per Michel-Rolph Trouillot) implies an active removal or absence. **Administrative Legibility** explains the *distortion* of what is present. It is not that the quiet people were erased; it is that they were never rendered into the format the archive accepts. It is a structural byproduct of record-keeping, not necessarily a deliberate act of suppression.
  *   **Difference from "Selection Bias":** Selection bias is a statistical error; Administrative Legibility is a sociological mechanism. It explains *why* the selection occurred (the need for state legibility) rather than just noting that it did.
  *   **The "Recovered Voice" Problem:** When you find letters from the "voiceless" and they are filed under old headings, this is **Categorical Inertia**. The archive's taxonomy is stronger than the new evidence; the new voice is forced to speak the old language to be stored.

  ### 2. The Digital Shape: Cumulative Advantage (The Matthew Mechanism)
  Your colleague was mechanistically correct but connotatively wrong. The **Matthew Effect** (Robert Merton) is indeed about credit, but in network science and information theory, the underlying engine is **Cumulative Advantage** or **Preferential Attachment**.

  *   **What it is:** In a network, nodes that already have connections (citations, metadata, digitization) are more likely to gain new connections. A digitized file is citable; a citation justifies further digitization of related files; this creates a "rich get richer" loop of retrievability.
  *   **Why "Matthew Effect" felt wrong:** You are right that "credit" is the wrong word. Nothing is becoming "famous"; things are becoming **Retrievable**. The compound interest is being paid on *infrastructure* (OCR quality, indexing), not *significance*.
  *   **Why "Path Dependence" fits better:** This is the broader economic/historical concept. Early, often arbitrary decisions (which box was digitized first because the grant money was available that Tuesday) lock in future trajectories. Once a path is established (e.g., "this series is searchable"), research flows down that path, reinforcing its dominance regardless of historical truth.

  ### 3. Are They One Phenomenon?
  Yes. They are both instances of **Infrastructural Determinism** in history.
  *   **Unity:** In both cases, the *medium* of recording (bureaucratic forms in the 19th century; search algorithms and OCR in the 21st) dictates the *message* of what survives. The archive is not a neutral container; it is a filter that favors specific shapes of information (transactional, typed, indexed).
  *   **Proposed Name:** If you need a single label for your piece, **Archival Path Dependence** is the most rigorous available term, though you may need to define it briefly. It captures the idea that the history we can write is dependent on the historical path of the archive's own infrastructure.

  ### Confidence and Uncertainty
  I am **highly confident** (90%) that **Administrative Legibility** and **Cumulative Advantage/Path Dependence** are the correct theoretical frameworks for the two halves of your observation. These are standard concepts in political sociology and information science respectively.

  I am **least sure** (60%) about the acceptance of the combined label "**Archival Path Dependence**." While "Path Dependence" is standard in economics and history, and "Archival Bias" is standard in archival science, the specific hyphenated phrase is not yet a fixed canonical term like "The Matthew Effect." It is descriptive rather than a proper noun. If you use it, treat it as a synthesis of existing theories rather than a citation of a single author.

  **Boundary Case:** The concept breaks down if the archive was created *specifically* to record the "quiet middle" (e.g., a oral history project designed to capture non-elites). In that case, Administrative Legibility is intentionally bypassed, though Cumulative Advantage may still apply if those recordings are never digitized.
