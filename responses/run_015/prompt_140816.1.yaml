      *   *Claim 5: "Timing of experience is therefore permanently hidden from us."*
          *   *Verdict:* **Sloppy/Incorrect.** This implies there *is* a timing, but we can't access it (epistemic veil). Dennett says there *is no* determinate timing (ontological indeterminacy).
      *   *Claim 6: "You can't really trust what people say about when they experienced something."*
