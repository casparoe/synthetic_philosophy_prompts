      *   *Claim 1: Description of Color Phi.* (Red dot, then green dot, see motion + color change mid-path).
          *   *Verdict:* Accurate. This is the standard phenomenon (Kolers & von Grünau).
      *   *Claim 2: Orwellian vs. Stalinesque definitions.* (Orwellian = experience then memory rewrite; Stalinesque = delay then edited experience).
