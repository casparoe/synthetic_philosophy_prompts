      *   If there were a "Neural Correlate of Consciousness" (NCC) that was *necessary and sufficient* and occurred at a specific time $T$, distinct from memory encoding time $M$ and motor output time $O$, *and* we could measure $T$ without disturbing it, then we could say Stalinesque ($T >$ stimulus) vs. Orwellian ($T <$ stimulus, $M >$ stimulus).
