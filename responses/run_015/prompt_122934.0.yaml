answer: |-
  This is a high-wire act. You are asking students to experience a logical contradiction as a normative dilemma. The goal is to make the *conditions* feel undeniable so that the *failure* feels catastrophic, rather than just a mathematical curiosity.

  Here is the complete package: Cards, Script, Timeline, and Debrief.

  ### 1. The Setup & Materials

  **The Alternatives (The "Social States")**
  Write these large on the whiteboard. Do not change them between rounds.
  *   **$A$:** Alice leads the discussion next week.
  *   **$B$:** Bob leads the discussion next week.
  *   **$N$:** No leader (Open discussion/Free time).

  **The Roles (14 Students)**
  *   **The Recorder (1 person):** Stands at the board. Their job is to write down the *Social Ranking* (1st, 2nd, 3rd). They cannot vote; they only enforce the rules.
  *   **The Rights-Holders (2 people):** "Alice" and "Bob" (proxies). They hold the "Protected Pair" cards.
  *   **The Public (11 people):** They hold "Citizen" cards. They have no rights, only preferences.

  **The Rules (Read these aloud, do not hand out yet)**
  1.  **Universal Domain:** Any preference ordering is valid input.
  2.  **Pareto Principle:** If *every single person* prefers $x$ to $y$, the Social Ranking must put $x$ above $y$.
  3.  **Liberalism (Rights):** If a Rights-Holder is "decisive" over a pair (e.g., $A$ vs $N$), and they prefer $A$ to $N$, the Social Ranking *must* put $A$ above $N$, regardless of what anyone else thinks.
  4.  **Transitivity:** The final Social Ranking must be consistent (If $A \succ B$ and $B \succ N$, then $A \succ N$).

  ---

  ### 2. The Cards (Print and Cut)

  **Round 1 Cards (The "Personal Sphere" Setup)**
  *Hand these out to the specific roles. Keep the Public cards identical.*

  | **Role** | **Count** | **Your Preference Order** | **Your Protected Pair (Right)** |
  | :--- | :--- | :--- | :--- |
  | **Alice** | 1 | $N \succ A \succ B$ <br>*(I want free time, but if someone must lead, I'll do it.)* | **Decisive over $(A, N)$** <br>*(My choice whether I lead or not.)* |
  | **Bob** | 1 | $A \succ B \succ N$ <br>*(I want Alice to lead. If not, I will. Least want free time.)* | **Decisive over $(B, N)$** <br>*(My choice whether I lead or not.)* |
  | **Public** | 11 | $A \succ B \succ N$ <br>*(We want to see work done. Alice first, then Bob, then free time.)* | **None** |

  **Round 2 Cards (The "Meddlesome" Setup)**
  *Collect Round 1 cards. Distribute these. Note the shift in Rights and Preferences.*

  | **Role** | **Count** | **Your Preference Order** | **Your Protected Pair (Right)** |
  | :--- | :--- | :--- | :--- |
  | **Alice** | 1 | $B \succ N \succ A$ <br>*(I want Bob to lead. I'd rather rest than lead.)* | **Decisive over $(B, N)$** <br>*(I decide if Bob rests or works.)* |
  | **Bob** | 1 | $N \succ A \succ B$ <br>*(I want rest. If work, Alice should do it.)* | **Decisive over $(A, N)$** <br>*(I decide if Alice rests or works.)* |
  | **Public** | 11 | $A \succ B \succ N$ <br>*(We want work done. Alice first, then Bob, then rest.)* | **None** |

  **Round 3 Cards (The "Waiver" Setup)**
  *Keep Round 2 preferences/rights, but add this rule slip to Alice and Bob.*

  | **Role** | **Count** | **New Rule** |
  | :--- | :--- | :--- |
  | **Alice & Bob** | 2 | **Waiver Option:** You may choose to *waive* your Protected Pair. If you waive, your preference on that pair counts only as a vote (subject to Pareto), not a constraint. You may waive unilaterally. |

  ---

  ### 3. The Timeline (90 Minutes)

  **00:00 – 00:10 | Setup & Rules**
  *   Seat them in a U-shape. Put the Recorder at the board.
  *   Read the **Rules** above. Emphasize: "We are building a Social Welfare Function. We need a complete ranking (1, 2, 3), not just a winner."
  *   Distribute **Round 1 Cards**. Give them 2 minutes to read silently.
  *   **Crucial Instruction:** "Do not show your cards to each other. Reveal your preferences only when the Recorder asks for the verdict on a specific pair."

  **00:10 – 00:30 | Round 1 (The Personal Sphere)**
  *   **Task:** The Recorder must produce a ranking of $A, B, N$.
  *   **Method:** The Recorder picks a pair (e.g., "A vs B"). Asks everyone for their preference.
  *   **The Trap:**
      1.  Recorder checks $A$ vs $B$: Public + Bob prefer $A \succ B$. Alice prefers $A \succ B$ (from $N \succ A \succ B$). **Unanimous.** Recorder writes $A \succ B$.
      2.  Recorder checks $B$ vs $N$: Bob is Decisive. Bob prefers $B \succ N$. Recorder writes $B \succ N$. (Ignore Public/Alice).
      3.  Recorder checks $A$ vs $N$: Alice is Decisive. Alice prefers $N \succ A$. Recorder writes $N \succ A$. (Ignore Public/Bob).
      4.  **The Wall:** Recorder looks at board. $A \succ B$, $B \succ N$, $N \succ A$.
      5.  Ask the class: "Is this ranking transitive?" (No). "Can you fix it?"
      6.  *Do not explain why.* Just say: "The rules prevented you. Reset."

  **00:30 – 00:50 | Round 2 (The Meddlesome Sphere)**
  *   Collect cards. Distribute **Round 2 Cards**.
  *   **Narrative:** "Same alternatives. New preferences. New rights assignments. Notice Alice now decides Bob's workload, and Bob decides Alice's."
  *   **Task:** Produce a ranking again.
  *   **The Trap:**
      1.  Recorder checks $A$ vs $B$: Public prefers $A \succ B$. Alice ($B \succ N \succ A$) prefers $B \succ A$. Bob ($N \succ A \succ B$) prefers $A \succ B$. **Not Unanimous.** Pareto does not apply.
      2.  *Wait, check the cycle logic:*
          *   Alice (Right on $B, N$): Prefers $B \succ N$. **Social: $B \succ N$.**
          *   Bob (Right on $A, N$): Prefers $N \succ A$. **Social: $N \succ A$.**
          *   Public (Pareto on $A, B$): Everyone ($A \succ B \succ N$) prefers $A \succ B$. **Social: $A \succ B$.**
      3.  **The Wall:** $B \succ N$, $N \succ A$, $A \succ B$. Cycle: $B \succ N \succ A \succ B$.
  *   **Debrief Prompt:** "Did the 'privacy' of the right matter? Alice controlled Bob's labor. Bob controlled Alice's. The cycle remained. Is the problem the *content* of the right, or the *form*?"

  **00:50 – 01:10 | Round 3 (Waiver & Game Theory)**
  *   Keep Round 2 setup. Hand out **Waiver Rule**.
  *   **Task:** "You may now waive your right to break the cycle. You want a consistent ranking. Negotiate."
  *   **Likely Outcome:**
      *   If Alice waives $(B, N)$: Her preference becomes a vote. Pareto ($A \succ B$) + Bob's Right ($N \succ A$) $\to$ $N \succ A \succ B$. Consistent.
      *   If Bob waives $(A, N)$: His preference becomes a vote. Pareto ($A \succ B$) + Alice's Right ($B \succ N$) $\to$ $A \succ B \succ N$. Consistent.
      *   **Conflict:** Who waives? If both waive, Pareto dominates ($A \succ B \succ N$). If neither waives, cycle.
  *   **Observation:** Watch if they try to trade ("I'll waive if you..."). Watch if the Public tries to pressure the Rights-Holders.

  **01:10 – 01:30 | The Debrief (Mapping the Wall)**
  *   Do not lecture immediately. Ask: "Which rule did you want to break?"
  *   Map their complaints to the Theorem conditions (see below).

  ---

  ### 4. The Debrief: Mapping Moments to Theory

  Do not start by naming "Sen's Liberal Paradox." Start by asking them to diagnose the failure.

  **1. The Transitivity Failure (The Cycle)**
  *   *Ask:* "Why couldn't the Recorder write the list?"
  *   *Theory:* This is the **Impossibility**. A Social Welfare Function satisfying the other conditions cannot guarantee a transitive ordering.

  **2. The Pareto Principle (The Public's Power)**
  *   *Ask:* "In Round 1, why did $A \succ B$ get on the board?"
  *   *Theory:* **Pareto Efficiency.** Everyone agreed. It feels wrong to violate unanimity.
  *   *Challenge:* "Could we drop Pareto?" (If we drop Pareto, we can respect Rights, but we might enforce outcomes everyone hates).

  **3. Liberalism (The Rights-Holders' Power)**
  *   *Ask:* "In Round 1, why did $N \succ A$ get on the board even though 13 people wanted $A$?"
  *   *Theory:* **Liberalism (Decisiveness).** Rights are trump cards, not weights.
  *   *Challenge:* "Is a right just a strong preference?" (No, because preferences aggregate; rights constrain aggregation).

  **4. Universal Domain (The Meddlesome Round)**
  *   *Ask:* "In Round 2, Alice decided Bob's workload. Did that feel different?"
  *   *Theory:* **Universal Domain.** The theorem holds even if preferences are "meddlesome." Sen's point is that *any* logically possible preference profile (including nosy ones) combined with Rights creates the paradox.
  *   *Key Insight:* If you say "Alice shouldn't have a right over Bob," you are restricting the Domain of rights, not just preferences.

  **5. Waiver (The Game Theoretic Escape)**
  *   *Ask:* "Did waiving solve it?"
  *   *Theory:* **Waivable Rights.** If rights are options, the cycle can be broken *if* someone waives.
  *   *The Catch:* This transforms rights into preferences. If I can waive my right, is it a right? Or just a preference I'm allowed to prioritize? If it's just a preference, we are back to standard aggregation, and the "Liberal" condition is gone.

  ---

  ### 5. Troubleshooting: What Will Go Wrong

  **1. "Just Vote for a Winner" (The Social Choice Function Escape)**
  *   *Prediction:* An Econ student will say, "Why do we need a ranking? Just pick $A$."
  *   *Response:* "If you pick $A$, you violate Alice's right ($N \succ A$). If you pick $N$, you violate Pareto ($A \succ B \succ N$). The paradox isn't just about picking a winner; it's that *any* choice violates a normative principle we agreed to. Also, Sen proves this for Choice Functions too under certain conditions."

  **2. "Change Your Preferences" (The Endogeneity Escape)**
  *   *Prediction:* A Phil student will say, "Alice shouldn't prefer $N$ if it hurts the group."
  *   *Response:* "That's 'adaptive preferences.' The theorem assumes **Universal Domain**. If we require people to have 'nice' preferences to make the math work, liberalism is dependent on moral education, not structure."

  **3. "The Recorder Cheated" (The Procedure Escape)**
  *   *Prediction:* They will blame the order of pairwise voting.
  *   *Response:* "Try a different order. $N$ vs $B$ first. Then $A$ vs $N$. You will still hit the contradiction. The order doesn't matter; the constraints are simultaneous."

  **4. "Mechanism Design" (The Implementation Escape)**
  *   *Prediction:* "We need a mechanism that incentivizes truth-telling."
  *   *Response:* "Mechanism design implements outcomes. Sen is asking about the *evaluation* of social states. Even if we mechanism-design a winner, how do we justify it normatively if it violates Pareto or Rights? This is theory, not engineering."

  ---

  ### 6. Limitations: What the Game Can't Reproduce

  Be honest about this in the final 5 minutes.

  1.  **Intensity of Preference:** The game uses ordinal rankings ($A \succ B$). Real politics involves intensity. (Though Arrow/Sen show intensity doesn't save us without interpersonal comparison).
  2.  **Jurisdiction vs. Decisiveness:** Real rights are usually jurisdictional (you decide *within* a sphere), not decisive over social rankings. The game simplifies rights to "decisiveness over a pair" to make the logic tractable.
  3.  **The "Game" vs. The "Function":** You played a game to find an outcome. Sen describes a *function* that exists prior to the game. The game simulates the *search* for the function.
  4.  **Strategic Voting:** In the game, they revealed true preferences. In reality, they might lie. (Gibbard-Satterthwaite is the next seminar's problem).

  ### 7. The "Hook" for the Next Session
  End with this question:
  *"In Round 3, someone had to waive their right to save consistency. If rights are waivable, are they still rights? Or are they just preferences we agreed to call 'rights' today? Next week, we ask: If we can't have Pareto, Liberty, and Consistency... which one do we burn?"*
