          *   Original EV ≈ 6.
          *   After 1 Tail: We missed the 0.5 contribution of the first H. The remaining tree is worth roughly $2 * 6 = 12$? No.
          *   Let's trace:
          *   Start: EV ≈ 6.
          *   After 1 Tail: Payoffs are now 2, 4, 8... Cap 1000.
          *   This is $2 \times$ (1, 2, 4... Cap 500).
          *   EV(1, 2... Cap 500) ≈ $9 * 0.5 + (1/512)*500 ≈ 4.5 + 0.97 ≈ 5.47$.
          *   So EV after 1 Tail ≈ $2 * 5.47 ≈ 10.94$. User says 11. Correct.
          *   After 2 Tails: Payoffs 4, 8... Cap 1000. ($4 \times$ Cap 250).
          *   EV(Cap 250) ≈ $8 * 0.5 + (1/256)*250 ≈ 4 + 0.97 ≈ 4.97$.
          *   Total ≈ $4 * 4.97 ≈ 19.88$. User says 20. Correct.
          *   The user's numbers are solid approximations. I will use them.

  3.  **Address Constraints & "What Will Go Wrong":**
      *   *Early End:* If H comes first flip (50% chance), game ends instantly. No re-pricing happens.
          *   *Fix:* Run parallel games? Too complex for 20 students + 1 coin.
          *   *Fix:* Fixed sequence? Removes chance.
          *   *Fix:* Run it twice? Best option. Costs 15 mins.
          *   *Decision:* Run two rounds. If Round 1 ends early, Round 2 likely won't.
      *   *Know-it-all:* Student shouts "EV is 6!"
          *   *Fix:* Make them derive it in pairs from a table without naming it. If they shout, ask them to justify via the table to the room. Don't let them dominate.
      *   *Outlier Bidder:* Someone bids 400.
          *   *Fix:* Limit initial endowment. If they have 100 points, they can't bid 400. Or enforce "must have cash to bid".
      *   *Limitation:* The game can't reproduce *actual* infinity. The cap makes it finite. I need to state this clearly.

