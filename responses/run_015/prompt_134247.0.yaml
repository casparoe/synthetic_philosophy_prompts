      *   Standard EV sum: $\sum (1/2^n) * 2^{n-1} = \sum 1/2 = \infty$.
      *   With cap at 1000:
          *   n=1 (H): 1, p=1/2 -> 0.5
          *   n=2 (TH): 2, p=1/4 -> 0.5
          *   ...
          *   n=10 (9T H): 512, p=1/1024 -> 0.5
          *   n=11+ (10T ...): 1000, p=1/1024 -> ~0.97
          *   Total EV ≈ $10 * 0.5 + 0.97 ≈ 5.97$. So ~6 points. User's "6" is correct.
      *   Conditional EV after 1 Tail (now need H for 2, T for 4...):
