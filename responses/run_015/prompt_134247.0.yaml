      *   Step 10 (payoff 512): Prob 1/1024. Contribution 0.5. Total 5.0.
      *   Step 11+ (payoff 1000): Prob of reaching 10 tails is $1/1024$. Once at 10 tails, payoff is guaranteed 1000 (or next head gives 1000?).
      *   User says: "flat 1000 once you're ten tails deep".
