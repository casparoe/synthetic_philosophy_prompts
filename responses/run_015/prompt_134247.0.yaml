      *   **Learning Goals:**
          1.  Feel that a "right price" can lose money (value lies in unrealized branches).
          2.  Feel that the "right price" moves even though the coin hasn't changed (conditional probability/value updating), combating gambler's fallacy.
      *   **Constraints:**
          1.  No diminishing marginal utility argument (prizes are trivial/fun).
          2.  No "expected value" term until debrief (students derive break-even from payoff table).
