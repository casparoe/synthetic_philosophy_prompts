answer: |-
  **Materials and Setup**
  Give each student 50 points in paper money. Put three chocolate bars on the desk. Draw a table on the left board: Column 1 "Flip #", Column 2 "Sequence", Column 3 "Points" (1, 2, 4, 8… up to 1000). Write "Cap: 1000 Points" prominently. Students work in pairs for calculations, but trade as a whole class.

  **Rules**
  1.  **Auction:** Before flipping, students submit sealed bids for one contract. Highest bidder pays the pot, holds the contract.
  2.  **Play:** Flip publicly. Heads ends the game; holder collects points from the pot. Tails continues the game; payoff doubles for the next head.
  3.  **Trading:** After every Tail, pause. Everyone writes a "Bid" to buy; the holder writes an "Ask" to sell. If Bid ≥ Ask, trade occurs. Update the board price.
  4.  **Winning:** Top three point totals (cash + winnings) get chocolate.
  5.  **Constraint:** You cannot bid more than your current cash. Do not use the phrase "expected value."

  **Timeline (75 Minutes)**
  *   **0–15:** Distribute money. Pairs calculate the "break-even price" using the board table (sum of probability × points). They must agree on a starting number.
  *   **15–25:** Sealed bid auction. Announce winner.
  *   **25–40:** Round 1 Play. Flip coin. Pause after every Tail for re-pricing. Record prices on the board.
  *   **40–55:** Round 2 Play. Reset contract. Run a second independent game to ensure trading opportunities occur.
  *   **55–75:** Debrief and prize distribution.

  **Board Work**
  *   **Left:** Payoff table (1, 2, 4… 1000).
  *   **Center:** "Market History." Record the price after Flip 0, Flip 1 (Tail), Flip 2 (Tail), etc.
  *   **Right:** Rules reminder and "Cap: 1000."
  *   **During Debrief:** Write the pair-derived break-even numbers next to the Market History to compare theory vs. behavior.

  **Debrief**
  Map the board data to your two goals.
  1.  **Right Price, Wrong Outcome:** Point to a moment where the market price matched the calculated break-even (e.g., 11 points), but the next flip was Heads (paying 2). The buyer lost money despite paying the fair price. Emphasize that value lived in the branches that didn't happen.
  2.  **Moving Price, Same Coin:** Highlight how the price jumped (6 → 11 → 20) even though the coin remained fair. The *state* changed, not the coin. If students mention "Heads was due," show them the price went up, not down.
  3.  **Limitation:** You must state openly that the cap makes the price finite. The true paradox relies on infinite payouts, which this game cannot reproduce. The chocolate bars enforce a finite utility whether you like it or not.

  **What Will Go Wrong**
  *   **The Early End:** There is a 50% chance Round 1 ends on Flip 1, killing the trading lesson. **Fix:** Running two rounds costs 15 minutes but ensures at least one sequence reaches multiple Tails.
  *   **The Know-It-All:** A student may shout "It's the St. Petersburg Paradox!" in minute five. **Fix:** Do not validate the name. Ask them to justify the number using only the board's payoff table. Force the room to derive the logic, not import it.
  *   **The Show-Off:** A student bids 400 points to dominate. **Fix:** Enforce the cash constraint strictly. If they have 50, max bid is 50. This prevents market distortion.
  *   **The Infinity Gap:** Students might argue the cap ruins the math. **Fix:** Acknowledge this in the debrief. The game teaches conditional pricing, not infinite series.

  Summary: This activity uses a capped St. Petersburg auction to let students experience fair pricing losses and conditional value shifts firsthand.
