      *   **Core Theme:** Her defense of women's intellectual life (*Respuesta a Sor Filotea*) applied to modern algorithmic education/adaptive learning systems.
      *   **Key Question:** How would Sor Juana critique modern predictive student models and opaque recommendation architectures? Would she see them as liberating or as a new form of gatekeeping?
