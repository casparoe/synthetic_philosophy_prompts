      *   *Direct Engagement:* Knowledge comes from studying things themselves (empirical/observational) and texts, not just through the interpretation of authorities (fathers, confessors).
      *   *Transparency/Visibility:* She valued public intellectual defense (her *Respuesta* is a public manifesto). She hid books to study, but wanted the *results* to be seen and judged.
