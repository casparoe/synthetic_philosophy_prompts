      *Final Polish:* Ensure the transitions between "Romance, Precision, Generalization" feel natural, not like a lecture.

      *(Final thought on the "Judgment" constraint)*: The prompt says "make clear where judgment must replace procedure—namely, in deciding exactly which prescriptions belong to which phase and in acknowledging that the rhythm itself offers no algorithm for resolving curricular disputes." I need to ensure this specific point lands. I will add a specific paragraph on the "algorithm" of education.

