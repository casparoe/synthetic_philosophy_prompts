prompt: |-
  You are delivering the commencement address at a university that has just reinstated a required general-education core after a decade of pure disciplinary specialization. The audience is tripartite: graduating seniors who completed the core in its first iteration; faculty divided between those who designed the curriculum and those who regard it as administrative bloat; and parents who largely assume that "general education" means job training or credentialing. Use Whitehead's philosophy of education—specifically his view that learning moves through successive phases of romance, precision, and generalization, and that the university's essential duty is to preserve the rhythm among them rather than to accelerate or collapse it—so that it does real structural work in the speech. First, explain why the core was reinstated without reducing it to vocational preparation on one hand or to mere cultural ornament on the other. Second, shape the form of the address itself by identifying which kinds of prescription or practical advice are inappropriate for a commencement occasion, given that the graduates are in a transitional moment rather than in the precision phase of their training; explicitly mark what you are therefore refusing to say. Third, address the faculty division not by taking sides, but by showing that deep specialization and broad study belong to different moments of the same educational rhythm, so that treating them as opponents misunderstands the process. The speech should run roughly eight minutes, be intelligible to non-specialists without flattening the philosophy into decoration, and make clear where judgment must replace procedure—namely, in deciding exactly which prescriptions belong to which phase and in acknowledging that the rhythm itself offers no algorithm for resolving curricular disputes.
reasoning: |-
  Here's a thinking process that leads to the commencement address:

  1.  **Analyze the Request:**
      *   **Context:** Commencement address at a university that just reinstated a required general-education core after 10 years of pure specialization.
      *   **Audience:**
          1.  Graduating Seniors (first cohort to take the new core).
          2.  Faculty (split: designers vs. skeptics who see it as bloat).
          3.  Parents (assume "gen ed" = job training/credentialing).
      *   **Philosophical Framework:** Alfred North Whitehead's *The Aims of Education* (Romance, Precision, Generalization).
      *   **Key Constraint 1 (Content):** Explain the core's reinstatement without reducing it to vocationalism or ornamentation.
      *   **Key Constraint 2 (Form):** Shape the speech itself using Whitehead's phases. Identify inappropriate advice for *this* moment (Commencement = transition/romance/generalization boundary, not precision). Explicitly mark what is *not* being said.
      *   **Key Constraint 3 (Faculty):** Address the division by framing specialization and broad study as parts of the same rhythm, not opponents.
      *   **Key Constraint 4 (Judgment vs. Procedure):** Acknowledge that the rhythm offers no algorithm; judgment is required.
      *   **Length:** Roughly 8 minutes (approx. 1,000 - 1,200 words spoken at a moderate pace).
      *   **Tone:** Intelligible to non-specialists, philosophically robust but not decorative.

  2.  **Deconstruct Whitehead's Rhythm:**
      *   *Romance:* First apprehension, excitement, unstructured exploration, seeing the big picture.
      *   *Precision:* Details, rules, grammar, technical mastery, discipline.
      *   *Generalization:* Returning to romance with the tools of precision, synthesis, application, wisdom.
      *   *Application to the Speech:* The speech itself should model this. It shouldn't be a list of rules (Precision). It should be an invitation to synthesis (Generalization) born of the excitement of finishing (Romance).

  3.  **Drafting - Section by Section:**

      *   **Introduction (Setting the Stage & Addressing the Parents/Context):**
          *   Acknowledge the unique position of this class (first of the new core).
          *   Address the "Why" of the core immediately.
          *   *Whiteheadian Hook:* Education is not a conveyor belt; it's a heartbeat.
          *   *Addressing Parents:* It's not just job training (Precision without Romance is dead knowledge). It's not just ornament (Romance without Precision is vague sentiment).

      *   **The Core Argument (Addressing the Faculty & The Reinstatement):**
          *   Why bring the core back? To preserve the rhythm.
          *   Address the faculty split. Specialization (Precision) is necessary, but it starves without the broad context (Romance/Generalization).
          *   The core isn't an obstacle to the major; it's the soil in which the major grows.
          *   *Crucial Nuance:* Acknowledge there is no formula. Judgment is needed.

      *   **The Meta-Commentary (Addressing the Graduates & The Form of the Speech):**
          *   This is Commencement. What phase is this? It's the end of Precision (exams, majors) and the start of a new Romance (life).
          *   *Constraint Check:* I must explicitly state what I am *refusing* to say. No "5 steps to success." No technical advice. That belongs to the Precision phase.
          *   This moment is about Generalization—taking the tools and going out.

      *   **Conclusion (The Call to Judgment):**
          *   Reiterate that the rhythm doesn't solve disputes; people do.
          *   Final send-off.

  4.  **Refining and Polishing (Iterative Process):**

      *   *Word Count Check:* An 8-minute speech is roughly 1,000-1,100 words. I need to be concise but weighty.
      *   *Tone Check:* Is it too academic? I need to explain Whitehead simply. "Romance, Precision, Generalization" need to be defined in context, not just namedropped.
      *   *Addressing the Constraints:*
          *   *Parents:* Make sure the "job training" vs. "ornament" distinction is clear.
          *   *Faculty:* Ensure I don't bash the specialists. They are vital for the "Precision" phase.
          *   *Form:* Make the "refusal to prescribe" explicit.
          *   *Judgment:* Emphasize that Whitehead gives a map, not a GPS.

      *   *Drafting thought:* I need to make sure the transition between addressing the parents, faculty, and students feels organic, not like three separate letters. The Whitehead framework is the glue.

      *   *Self-Correction on "Judgment":* The prompt asks to make clear where judgment must replace procedure. I need to explicitly state that the curriculum committee couldn't calculate the perfect balance; they had to judge. And the graduates must now judge how to live.

  5.  **Final Review against Prompt:**
      *   Whitehead's phases used structurally? Yes.
      *   Core explained (not vocational/ornament)? Yes.
      *   Inappropriate advice marked/refused? Yes.
      *   Faculty division addressed (rhythm vs. opponents)? Yes.
      *   Judgment vs. Procedure highlighted? Yes.
      *   Length appropriate? (Will aim for ~1100 words).

  6.  **Writing the Speech:** (Mental outline of the flow)
      *   Opening: Welcome & The Rhythm.
      *   The Core: Why it exists (Romance/Precision balance).
      *   The Faculty: Specialization is Precision, Core is Romance/Generalization. Both needed.
      *   The Graduates: You are leaving Precision. Do not ask for rules.
      *   The Refusal: I will not give you a checklist.
      *   The Judgment: Life requires weighing the rhythm yourself.
      *   Closing.

      *(Self-Correction during drafting)*: Make sure I don't get *too* abstract. Keep it grounded in the ceremony.

      *(Refining the "Refusal")*: I need to be very clear: "I am not going to tell you how to network, or how to optimize your resume."

      *(Refining the "Judgment")*: "Whitehead gives us a pulse, not a prescription."

      Let's write.

