      *   *Claim 1:* "The Kelly criterion tells you to maximize expected log wealth, so geometric rationality is really just expected utility theory with a log utility function baked in."
      *   *Claim 2:* "That means you should never take a bet with negative expected value..."
      *   *Claim 3:* "...and it automatically solves the risk-aversion problem because you're linear in log-space."
