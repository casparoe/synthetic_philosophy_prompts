answer: |-
  Your intuition is correct. Your roommate's explanation is a very standard "rationalist" pitch, but it smooths over several sharp edges where the math gets messy or the philosophy is actively disputed. They are mostly right on the mechanics, but they are presenting contested interpretations as settled facts, and the final claim about ambiguity aversion is mathematically dubious.

  Here is an audit of their claims, point by point.

  ### 1. "Kelly is just Expected Utility Theory with a log utility function."
  *   **Verdict:** **Accurate (Settled).**
  *   **The Detail:** This is the standard economic interpretation. If you accept the axioms of Expected Utility Theory (EUT) and your utility function is $U(w) = \ln(w)$, the optimal bet size is the Kelly criterion.
  *   **The Nuance:** "Geometric Rationality" is often used as a broader philosophical label (popularized by certain rationalist communities) that implies you *should* have log utility because it maximizes long-term growth. Standard economics says you *can* have any utility function you want; if you prefer linear utility (risk-neutral), you should bet your whole bankroll on any positive EV bet, even if it risks ruin. Your roommate is presenting the "Growth-Optimal" view as the only rational one, which is a normative claim, not a mathematical necessity.

  ### 2. "You should never take a bet with negative expected value."
  *   **Verdict:** **Accurate (Settled).**
  *   **The Detail:** Whether you are maximizing linear wealth or log wealth, a negative expected value bet reduces your expected utility in both frameworks (assuming you aren't betting for hedging purposes or entertainment value).
  *   **The Nuance:** None really. This is basic decision theory.

  ### 3. "It automatically solves the risk-aversion problem because you're linear in log-space."
  *   **Verdict:** **Simplification / Misleading.**
  *   **The Detail:** It doesn't "solve" the risk-aversion problem; it *assumes* a specific degree of risk aversion.
  *   **The Nuance:** In economics, the "risk-aversion problem" often refers to explaining why people reject small positive-EV gambles while accepting large ones (the Rabin calibration paradox). Log utility explains *some* risk aversion (diminishing marginal utility), but it implies a specific coefficient of relative risk aversion (equal to 1).
  *   **The Conflict:** Empirical data suggests people are often *more* risk-averse than log utility implies in some contexts and *less* in others. Saying Kelly "solves" this implies there is a single correct level of risk aversion that Kelly provides. In reality, Kelly just hardcodes *one specific* attitude toward risk. If your actual preferences differ from log wealth, Kelly is suboptimal for *you*.

  ### 4. "Ergodicity economics... is mostly marketing — the Kelly math works fine without that story."
  *   **Verdict:** **Contested (Fought Over).**
  *   **The Detail:** Your roommate is stating the mainstream economic consensus as fact.
  *   **The Conflict:** This is the biggest philosophical fight in this space.
      *   **Mainstream View (Your Roommate):** Ergodicity economics (championed by Ole Peters) is a re-derivation of existing results using physics terminology. Since Kelly = Log Utility in EUT, adding "ergodicity" is just a different justification for the same math.
      *   **Ergodicity View:** Standard EUT is fundamentally broken because it uses "ensemble averages" (parallel universes) for processes that happen in "time" (one life). They argue Kelly isn't a *preference* (utility function); it's a *physical necessity* for non-ergodic systems to avoid ruin.
  *   **The Audit:** Your roommate is right that the *math* yields the same bet size. They are wrong to dismiss the ergodicity claim as "marketing" without acknowledging that it challenges the foundational axioms of EUT. Whether EUT is "wrong" or just "one way to model preferences" is genuinely fought over. Your roommate is treating their side of the debate as the objective truth.

  ### 5. "If you're ambiguity-averse you just scale your Kelly fraction... which is literally the same thing as maximin EU for every decision problem."
  *   **Verdict:** **Wrong (The Sleight of Hand).**
  *   **The Detail:** This is where the argument falls apart.
  *   **Risk vs. Ambiguity:** Kelly assumes you know the probabilities (Risk). Ambiguity means you *don't* know the probabilities (Uncertainty).
  *   **Fractional Kelly:** Scaling down Kelly (e.g., Half-Kelly) is a common heuristic. It can be justified by uncertainty about your edge, transaction costs, or a desire for lower volatility.
  *   **Maximin EU:** This is a decision rule where you assume the worst possible probability distribution within a set of possibilities and maximize based on that.
  *   **The Error:** While Fractional Kelly and Maximin can produce similar results in *specific* repeated betting scenarios with unknown probabilities, they are **not** "literally the same thing for every decision problem."
      *   Maximin is extremely conservative (pessimistic).
      *   Fractional Kelly is often just a variance constraint.
      *   There are many decision problems where a Maximin approach tells you not to play at all, while Fractional Kelly tells you to bet small.
      *   Claiming universal equivalence ("for every decision problem") is mathematically false. It conflates a heuristic (scale the bet) with an axiomatic decision theory (MaxMin) that operates differently in non-repeated or complex scenarios.

  ### Summary of the Audit

  1.  **Kelly = Log Utility:** Accurate.
  2.  **Negative EV:** Accurate.
  3.  **Solves Risk Aversion:** Misleading. It hardcodes one type of risk aversion; it doesn't solve the general puzzle of human risk preferences.
  4.  **Ergodicity is Marketing:** Contested. The math is the same, but the justification is a live debate in foundational economics. Your roommate is dismissing a rival paradigm, not stating a fact.
  5.  **Ambiguity = Scaled Kelly = Maximin:** **False.** This is the sleight of hand. It treats a specific heuristic as a universal equivalence theorem. Ambiguity aversion is much more complex than just multiplying the Kelly fraction by a weight, and it does not map perfectly to Maximin across all decision problems.

  **Bottom Line:** Your roommate understands the mechanics of Kelly betting well but is overconfident in the philosophical implications. They are presenting a specific school of thought (Growth-Optimal/Standard EUT) as the only rational framework, and they are glossing over the fact that handling ambiguity (unknown probabilities) is an unsolved, messy problem that cannot be reduced to a simple scaling factor without losing theoretical rigor. Your suspicion about the ambiguity claim was spot on.
