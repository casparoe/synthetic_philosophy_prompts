      *   *The Critique (Crystals):* Crystals grow and replicate structure, but do they undergo *Darwinian* evolution (variation + heredity + selection)? Generally, no. They grow deterministically. So this critique is weak. Fire is a better counter-example (self-sustaining, spreads, but not alive).
      *   *Verdict:* The friend's summary is a bit caricatured. The NASA definition isn't "destroyed"; it's a working definition for astrobiology, not a metaphysical truth. The virus objection is standard, but the crystal objection is philosophically weak regarding *Darwinian* evolution.

  3.  **Deconstruct Claim 2: Abandoning Essentialism:**
      *   *The Shift:* Did philosophers give up on necessary and sufficient conditions?
      *   *Context:* Yes, largely. Since the 1980s/90s (post-Wittgenstein, post-Dupré, post-Cleland), there's a strong consensus that "life" might not have a single essence.
      *   *Nuance:* Some still try (e.g., autopoiesis theorists, NASA folks). But the dominant view in philosophy of biology is skepticism about a universal definition.
