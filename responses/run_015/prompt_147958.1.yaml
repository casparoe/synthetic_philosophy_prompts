reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Perform a "sanity check" on a friend's summary of the philosophical debate on defining life.
      *   **Key Claims to Evaluate:**
          1.  The NASA definition ("self-sustaining chemical system capable of Darwinian evolution") was "destroyed" by viruses (not self-sustaining) and crystals (replicate without life).
          2.  Philosophers mostly gave up on necessary and sufficient conditions (essentialism).
          3.  Philosophers now treat "life" as a "practical kind" (à la John Dupré), grouping by human interests rather than natural boundaries.
