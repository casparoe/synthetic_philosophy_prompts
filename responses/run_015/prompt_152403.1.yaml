answer: |-
  **The Case**

  A driver must pass two indistinguishable intersections, X and Y, to get home. Payoffs: Exit at X = 0; Exit at Y = 4; Continue past Y = 1. The driver is absent-minded: at any intersection, his evidence is identical, and he cannot recall prior visits. His strategy is a single probability $p$ of continuing at any intersection.

  **The Twist:** Randomizations are correlated. At Y, with probability $\delta = 1/3$, the driver is in a perseverative frame and repeats his action at X. With probability $2/3$, he chooses afresh with probability $p$. He cannot distinguish these frames. Both theorists accept standard self-locating credences: at an intersection, the probability of being at Y is $p/(1+p)$.

  ***

  **Elena:** Let's start where we agree. Set $\delta = 0$. The acts are independent. Ex ante, the probability of reaching Y is $p$. The probability of exiting at Y is $p(1-p)$, and continuing past Y is $p^2$. The expected value is $4p(1-p) + 1p^2$, which simplifies to $4p - 3p^2$. Maximizing this gives $4 - 6p = 0$, so $p = 2/3$. The value is $4/3$.

  **Marcus:** And from the intersection? My credence that I am at Y is $p/(1+p)$. If I exit, I get 0 at X and 4 at Y, so expected utility is $4p/(1+p)$. If I continue, I get $4(1-p) + 1p$ at X—which is $4-3p$—and 1 at Y. Weighted by credence, that's $[(4-3p) + p]/(1+p)$, or $(4-2p)/(1+p)$. The difference, Continue minus Exit, is $(4-6p)/(1+p)$. This vanishes exactly at $p = 2/3$.

  **Elena:** It's striking that the ex ante optimum and the intersection-level fixed point coincide here. It's not a trivial identity; it suggests that when acts are independent, maximizing from the start and maximizing from the middle converge.

  **Marcus:** They converge because the causal structure is simple. My choice now doesn't signal what I'll do later. But introduce the correlation. Set $\delta = 1/3$. If I continue at X, the probability I continue at Y is no longer $p$. It's $r = 1/3 + (2/3)p$.

  **Elena:** Correct. The ex ante value becomes $4p(1-r) + 1pr$. Substitute $r$: $4p(1 - [1/3 + 2p/3]) + p(1/3 + 2p/3)$. That simplifies to $4p(2/3 - 2p/3) + p/3 + 2p^2/3$. Which is $8p/3 - 8p^2/3 + p/3 + 2p^2/3$. Combine terms: $3p - 2p^2$. The maximum is at $p = 3/4$. The value is $9/8$.

  **Marcus:** But look at the intersection level. I still have credence $p/(1+p)$ that I'm at Y. If I exit, value is $4p/(1+p)$. If I continue: at X, continuing leads to Y where I continue with probability $r$. So the value from X is $4(1-r) + 1r = 4 - 3r$. Substitute $r$: $4 - 3(1/3 + 2p/3) = 3 - 2p$. At Y, continuing yields 1. So total value of continuing is $[(3-2p) + p]/(1+p) = (3-p)/(1+p)$. The difference is $(3-5p)/(1+p)$. This vanishes at $p = 3/5$.

  **Elena:** So the planning optimum is $p = 3/4$, yielding $9/8$. The sequencer's fixed point is $p = 3/5$, yielding $27/25$. $9/8$ is $1.125$; $27/25$ is $1.08$. The planning rule dominates ex ante. Yet, at $p = 3/4$, your intersection calculation says Exit is worth $12/7$ and Continue is worth $9/7$. You would abandon the plan.

  **Marcus:** Because at $p = 3/4$, continuing is locally irrational. Your planning calculation includes a term—the effect of $p$ on the act at Y through perseveration—that I cannot access as a reason for acting now. I don't know if I'm in the perseverative frame. I only know my credence and the payoffs. To ask me to continue is to ask me to maximize a variable I cannot influence directly. You're appealing to a standpoint I no longer occupy.

  **Elena:** You're treating the later act as environmental noise. But it's not. When acts are correlated, a departure from the rule at one intersection isn't local. If I deviate at X, I change the probability of continuing at Y via the perseveration channel. The fixed-point condition you rely on assumes I can hold fixed what I do elsewhere. I can't. The acts are tied.

  **Marcus:** But the correlation is stochastic. I can't control the frame of mind. If I'm at the intersection, and continuing yields less utility than exiting by my own lights, why should I continue? You're handing authority to the earlier self. The earlier self wants to bind the later self to exploit the correlation, but the later self sees only the immediate loss. Rationality shouldn't require me to act against my current evidence.

  **Elena:** It's not acting against evidence; it's recognizing that the evidence doesn't isolate the act. If you exit at X, you never reach Y. If you continue at X, you reach Y, but you've increased the chance you'll continue at Y too. Your "local" calculation ignores that your current choice modulates the future probability $r$. If you follow your fixed point $p = 3/5$, you get $27/25$. If you follow the plan, you get $9/8$. Acting on your intersection preference is self-defeating. You end up poorer.

  **Marcus:** Only if the ex ante standpoint retains authority. But the agent at the intersection *is* the agent. If the dynamics cycle—below $3/5$ I want to continue, above it I want to exit—then there is no stable rule I can endorse while acting. You're proposing a rule that is unstable under execution.

  **Elena:** Stability isn't the only virtue; payoff is. Consider the stress test. Set $\delta = 1$. Total perseveration. If I continue at X, I continue at Y. Ex ante value is $p \times 1$. Maximum is $p = 1$, value 1. But your intersection difference becomes $(1-3p)/(1+p)$. Your fixed point is $p = 1/3$, value $1/3$. You would recommend a strategy that yields one-third of the possible payoff because the agent at the intersection prefers exiting.

  **Marcus:** Because at $p = 1$, exiting yields 2 and continuing yields 1. The agent knows he's likely at Y. He takes the sure thing. You're asking him to ignore that certainty to satisfy a past preference.

  **Elena:** I'm asking him to recognize that his current act *is* the past preference. With $\delta = 1$, the two acts are one act. To treat them as separate is the error. The crux is whether the agent's later act is part of the environment or part of the agency. If it's agency, you can't hold it fixed while optimizing here.

  **Marcus:** And if it's environment, you can't optimize ex ante over variables you can't control at the time of action. We agree on the algebra. We disagree on whether the agent at the intersection is the same agent as the planner, or merely his successor.

  **Elena:** Then we agree on what needs settling. Does rationality require global coherence of the policy, or local optimality of the act?

  **Marcus:** Precisely. Until we know whether the later self is a partner or a constraint, the arithmetic will always outpace the justification.
