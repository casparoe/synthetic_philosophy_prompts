          2.  The reliance on mercenary captains who followed contracts rather than patriotic necessity.
          3.  Cesare Borgia's use of surrogates to commit cruelty while maintaining a clean public image.

      *   *Bottom Line:* He would endorse quantifying risk as prudent preparation but condemn relying on algorithms to make final decisions, insisting that *virtù* requires human will to adapt models to changing necessities.
