      2.  **Joint Statement of Agreement:** The hard math and empirical facts.
      3.  **Statement of Disagreement:** The normative/philosophical split.
      4.  **The Cruxes & Tests:** Specific scenarios with divergent predictions/recommendations.
      5.  **Verbal/Semantic Clarifications:** Where language is tripping them up.

  6.  **Writing the Content (Mental Draft & Polish):**
      *   *Agreement:* Both agree Kelly = Max E[Log(W)]. Both agree Linear EU = Max E[W]. Both agree Kelly avoids ruin.
