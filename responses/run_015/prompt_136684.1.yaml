answer: |-
  **Scenario**

  Local 404's bylaws define the "Shop Steward" as the member elected in November. Carl won but quit the factory last week. The members informally treat Dave, who still works the line, as their representative. Everyone knows Carl holds the title while Dave handles the work. At the briefing, the union rep says to the manager:

  "The Shop Steward holds the grievance authorization."

  Legally, only Carl holds the authorization. Dave does not. The manager knows this. The rep knows this.

  ***

  **Analysis**

  **Russellian Expansion:** ∃x(Steward(x) & ∀y(Steward(y) → y=x) & HoldsAuth(x)). By bylaws, Carl is the unique Steward. Carl holds the legal authorization. The conjunction is satisfied. Verdict: **TRUE**.

  **Referential Verdict:** The speaker intends to refer to Dave; the hearer understands the reference to be Dave. The proposition expressed is *HoldsAuth(Dave)*. Dave lacks authorization. Verdict: **FALSE**. An ordinary hearer would call this false because the utterance's practical point concerns who can actually file grievances, not who holds a dormant title.

  **Single Feature:** The divergence between institutional semantics (bylaws) and conversational focus (function). If removed—making Dave the official Steward—the case collapses into an ordinary true statement. If Carl were also functional, it would be true on both analyses. The tension exists only because the institution fixes the semantic value while practice fixes the speaker reference.

  **Strawson-Style Treatment:** Strawson treats existence and uniqueness as presuppositions. Since Carl exists and is unique, presuppositions are satisfied. The assertion predicates authorization of the presupposed subject (Carl). Since Carl holds it, Strawson agrees with Russell: **TRUE**. Strawson offers no rescue here because the presuppositions are not failed, only pragmatically irrelevant.

  **Defender's Attack:** A Russellian might argue context restricts "Shop Steward" to "Functional Steward." This fails because the predicate ("holds authorization") is legalistic, tying the subject back to the bylaws that define the title. To restrict the description contextually would render the predicate false of the restricted subject (Dave doesn't hold legal auth), admitting the sentence is false. The pragmatic move (true but misleading) fails because the speaker knows the hearer needs to know about Dave; asserting a truth about Carl to imply a falsehood about Dave violates cooperative norms.

  ***

  **Commitment**

  I commit that ordinary speakers would judge the utterance **false**. The empirical claim rests on speakers prioritizing practical consequence over semantic technicality in institutional contexts.

  **Least Confident Step:** The empirical claim about ordinary speakers' verdicts. **What would change my mind:** Experimental data showing speakers prioritize semantic satisfaction over speaker reference when institutional definitions are explicit.
