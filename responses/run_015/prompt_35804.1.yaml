  Please give your own credence, decomposed into roughly the following terms, adjusting, adding, or reweighting as you see fit: (a) the probability that the argument from illusion, properly stated, actually forces common mental factors rather than only subjectively indistinguishable states — my tentative thought is that the standard argument slides from "the subject cannot tell the two apart" to "there is a single kind of state present in both," and that this slide can be blocked, though I'm unsure whether blocking it helps disjunctivism or just muddies what the view is denying; (b) the probability that the denial of common factors can be squared with a plausible epistemology of perception, so that the disjunctivist can explain why the good case is epistemically better off than the bad one without quietly reintroducing a shared quality; (c) the probability that introspective phenomenology is neutral here rather than favoring a common-factor view, since it strikes me that "how it seems" may underdetermine the metaphysics of the seeming; and (d) whatever residual term you think belongs, such as whether the best case for the disjunctivist comes from the theory of perception (e.g., a matching or accuracy condition on seeing) rather than from anywhere in epistemology or phenomenology. Assign each term a number with a line or two of justification, show how they combine into your overall figure, and then tell me where in this decomposition a 0.35 person and a 0.7 person most likely diverge — my guess is (a), while my friend insists the real action is in (b).

  Two constraints on the response. First, don't give me a survey of who held what or pair positions with authors; I have the seminar readings for that and will attach names myself. Second, as you go, indicate how confident you are in each substantive claim you make, and single out the single point in your reasoning that you are least sure of — I would rather have a number with a marked weak joint than a smooth result that hides where the weight actually rests.
