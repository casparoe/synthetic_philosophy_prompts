  It claims the law that *P* or not *P* holds,
  Where every proposition must decide,
  But absent proof, the middle stays unbridged.

  That not not *P* implies that *P* is true,
  Confuses absence of refutation's mark,
  With proved construction held within our grasp.

  Not lawlike functions fixed before the start,
  But choice sequences born of free intent,
  Where each next term is chosen in the now.

  No law applies to what is not yet made,
  To claim it is or not presumes the term,
  Exists before the mind has set it down.

  To prove disjunction needs a chosen path,
  Not merely showing both cannot be false,
  We build the left, or else we build the right.
