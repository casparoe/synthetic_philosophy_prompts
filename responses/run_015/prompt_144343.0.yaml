answer: |-
  Good morning. Thank you for coming.

  Sixty years is a long time to share an address. For some of us in this room, Marlowe Road Library wasn't just a place we went; it was a place we *were*. We were the people who came here on rainy Tuesdays, or Saturday mornings when the kitchen was too chaotic.

  I know the new branch is better in almost every measurable way. It's brighter, it's accessible, it's a mile closer for most of us. Logically, this move makes perfect sense. And I know the Council Leader has said, quite reasonably, that "a library is a service, not a building."

  There is truth in that. Books are for reading, not worshipping. But I want to suggest that a service is not a ghost. It needs a habitat. And when you change the habitat, you change the life that lives inside it.

  Some of you know I move in academic circles. There's a famous idea in philosophy called the "extended mind." It suggests that when we use a tool reliably—like a notebook we carry everywhere—that tool becomes part of how we think. We don't just store memories in our heads; we store them in the world, and we reach for them when we need them.

  Now, I am not going to stand here and claim that this building was literally part of our brains. That would be a category error, and I'd like to keep my invitation to the new branch. But there is a softer, truer version of that idea.

  A branch library is a shared scaffold. It is a structure outside of ourselves that supports what we can do together. A notebook is private; a library is a promise that certain things will be available, in a certain order, without you having to ask. That reliability allows us to stop worrying about *finding* things, and start thinking about *using* them.

  When you move the books, you move the service. But you cannot move the scaffold. You cannot move the specific wear and tear of sixty years of local curiosity.

  I'm thinking, specifically, of the index.

  For years, there was a shoebox by the counter. Inside was a handwritten index of local history clippings, kept by a volunteer named Maureen. Maureen died in 2019. The box is not going to the new library. It is being pulped.

  Now, that information might exist elsewhere. But Maureen's index wasn't just data. It was a map of how *this* community thought about itself. It was a specific way of connecting a name to a street, a date to a memory. When that box is pulped, we aren't just losing paper; we are losing a specific pathway through our own history. We are losing a way of thinking that was cultivated right here, behind that counter.

  That is what a building provides that a service definition misses. It provides durability. It outlasts our individual moods. It outlasts our trust. It stands here, week after week, saying: "I am still here. The knowledge is still here."

  That is why I want to acknowledge the two librarians sitting here today. [Gesture to them]. You are not being replaced; you are being redeployed. But you are the ones who have had to explain to people why the shoebox can't go with them. You are the ones who have held the trust of this community while the walls around you were marked for demolition. A building is just bricks, but you are the ones who made this place a reliable part of our lives. You made the scaffold hold weight.

  So, what is lost today? It isn't convenience. It isn't even the books, mostly.

  What is lost is the friction of this specific place. The way the light hit the reference desk. The fact that you could find Maureen's box if you knew to ask. The fact that for sixty years, this room has absorbed our questions.

  The new library will be wonderful. I will use it. But it will be a new mind, growing new habits. This mind—the Marlowe Road mind—is closing.

  So, for today, let's not just celebrate the books. Let's thank the space that held them. Let's thank the people who tended the shelf. And let's admit that while a service can be moved, a home for our curiosity is something we build slowly, and lose all at once.

  Thank you, Maureen. Thank you, [Librarian Names]. And thank you, all of you, for keeping this place alive for as long as you could.
