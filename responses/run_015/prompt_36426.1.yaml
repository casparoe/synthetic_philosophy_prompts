answer: |-
  Here is an audit of the Streetlight Analogy as deployed in the Effective Altruism (EA) critique, structured according to your requirements.

  ### I. The Correspondence

  To audit the argument, we must first fix the mapping. The analogy only functions if the terms correspond rigidly between the source domain (the drunk) and the target domain (EA).

  *   **The Alley:** The total space of possible altruistic interventions (global health, policy, research, cultural change, etc.).
  *   **The Keys:** The intervention(s) that actually maximize expected value (do the most good).
  *   **The Lamppost:** The subset of interventions where impact is easily quantified, typically via Randomized Controlled Trials (RCTs) or clear counterfactuals (e.g., bed nets, deworming).
  *   **The Dark:** The subset of interventions where impact is opaque, long-term, or systemic (e.g., macroeconomic policy, institutional reform, movement building).
  *   **The Drunk:** The EA community, specifically its funders and prioritization researchers.
  *   **The Search:** The process of cause prioritization and capital allocation.

  ### II. The Drunk's Motivations

  The force of the analogy depends entirely on *why* the drunk is looking under the light. There are three distinct models of motivation here. Critics often slide between them, but they imply different failures.

  **1. The Sincere but Biased Agent (Cognitive Bias)**
  *   **Model:** The drunk genuinely wants to find the keys. He believes the keys are likely under the light because that is where he can *see*.
  *   **EA Translation:** EA funders want to maximize good. They prioritize measurable causes not because they think systemic change is worthless, but because they lack the epistemic tools to compare systemic change against direct aid.
  *   **Status:** **Contested.** Critics argue this is a rationalization for bias. Defenders argue this is rational decision-making under uncertainty (Bayesian updating based on available evidence).

  **2. The Signaling Agent (Reputation)**
  *   **Model:** The drunk wants to *appear* to be searching for keys to an audience. Searching in the light allows him to report progress ("I have searched 5 square feet"). Searching in the dark yields no reportable data.
  *   **EA Translation:** EA organizations prioritize measurable causes to satisfy donors who demand metrics, ROI, and "proof" of impact, rather than to actually find the highest-impact opportunities.
  *   **Status:** **Contested.** This is a sociological claim about incentive structures. While it is **settled** that EA marketing relies heavily on metrics, it is **contested** whether this drives the prioritization or merely reports on it.

  **3. The Conceptual Redefinition (Goodhart's Law)**
  *   **Model:** The drunk decides that "finding the keys" just means "finding things under the light." The definition of the goal shifts to match the methodology.
  *   **EA Translation:** "Doing good" becomes operationally defined as "producing measurable outcomes." Interventions that cannot be measured are excluded from the category of "serious altruism" by fiat.
  *   **Status:** **Contested.** This is the strongest philosophical objection. Defenders deny this redefinition, insisting measurability is a *proxy* for goodness, not the *definition*. Critics argue the proxy has consumed the target.

  ### III. Disanalogies: Which Matter?

  Not all differences between the analogy and reality undermine the argument. We must separate cosmetic disanalogies from structural ones.

  **1. Disanalogies That Do Not Matter**
  *   **Sobriety:** EAs are not intoxicated. This is rhetorical flair. The core claim is about epistemic limitation, not impairment.
  *   **Single vs. Plural:** The analogy features one drunk; EA is a distributed network. While EA is not a monolith, if the *incentive structure* is uniform across the network, the plurality of agents does not solve the bias.
  *   **Nighttime:** The darkness is not literal. This is obvious and does not affect the logic.

  **2. Disanalogies That Matter**
  *   **Static vs. Dynamic Light:** In the analogy, the lamppost is fixed by the street infrastructure. In EA, the "light" (measurement capability) is endogenous. EA funds research *to build better lights* (e.g., developing metrics for policy influence, funding macroeconomic research).
      *   *Implication:* If EA is actively funding the illumination of the dark, the analogy of a passive searcher fails.
  *   **Independence of Keys and Light:** In the analogy, the location of the keys is independent of the light. In social reality, "impact" may not be independent of "verifiability." If an intervention cannot be verified, it may be impossible to scale or replicate, thereby reducing its actual impact.
      *   *Implication:* Measurability might be a constituent element of tractability, not just a convenient proxy.
  *   **The Cost of Search:** In the analogy, searching in the dark is presumably just as easy as searching in the light, but futile. In reality, searching in the dark (analyzing complex systems) is exponentially more resource-intensive than searching in the light (counting bed nets).
      *   *Implication:* The EA choice may be a cost-benefit analysis (expected value per research dollar), not just a bias toward visibility.

  ### IV. The Hidden Premise: Are There Keys in the Dark?

  The Streetlight Analogy smuggles in a critical existential claim: **That the keys are, in fact, in the dark.**

  For the analogy to work as a critique of *misallocation*, it must be true that high-expected-value (EV) interventions exist in the "systemic/dark" territory that EA is ignoring. If the keys were actually dropped under the lamppost, the drunk is the most rational actor in the alley.

  *   **Settled:** There is disagreement about the location of high-leverage interventions.
  *   **Contested:** Whether systemic change (policy, institutions) has higher EV than direct aid.
      *   *Critics assert:* History shows structural change drives welfare (e.g., industrialization, democracy), so the keys *must* be in the dark.
      *   *EA Defenders assert:* Structural change is notoriously intractable and hard to influence; direct aid has proven, massive leverage. The keys likely *are* in the light (or the dark is empty).

  **The Audit:** The analogy begs the question. It assumes the conclusion (that EA is missing the most important things) by positing the keys are in the dark. It offers no evidence for *why* the keys are in the dark, only that the drunk isn't looking there. If the "dark" represents intractability rather than just unmeasurability, then the absence of search is rational, not biased.

  ### V. Verdict on the Analogy

  Does the conclusion survive the audit?
  *Conclusion:* "EA's cause rankings track what can be measured rather than what does the most good."

  **Verdict:** The analogy fails to carry this conclusion on its own. It relies entirely on the unproven premise that high-EV opportunities exist in the unmeasurable territory.

  1.  **Conflation of Measurability and Tractability:** The analogy treats the light as "visibility." EA defenders argue the light represents "tractability." If you cannot measure an intervention, you often cannot verify if it worked, meaning you cannot confidently scale it. If you can't scale it, its EV is capped. Therefore, searching where the light is *is* searching where the keys are likely to be found and used.
  2.  **The "Bias" Charge:** To prove bias, one must show that EA ignores evidence of high EV in the dark. Merely showing they prioritize the light is insufficient. If the dark yields low-probability hits (due to complexity), prioritizing the light is not a bias; it is optimization.
  3.  **Carrying the Conclusion:** The analogy was carrying the conclusion the whole time. It persuades by invoking the image of folly (the drunk), which primes the listener to assume the search strategy is irrational. Once you remove the emotional weight of the "drunk" and replace it with "resource-constrained researcher," the intuition that the behavior is irrational weakens significantly.

  ### VI. A Closer Analogy: Search and Rescue with Thermal Imaging

  A more precise analogy for EA's epistemic situation is **Search and Rescue (SAR) using Thermal Imaging.**

  *   **The Scenario:** A team is looking for survivors after an earthquake.
  *   **The Tool:** They have high-quality thermal drones (RCTs/Metrics) that can detect heat signatures in open rubble.
  *   **The Limitation:** The drones cannot penetrate deep concrete bunkers (Systemic/Political structures).
  *   **The Strategy:** The team prioritizes scanning open rubble first.
  *   **The Critique:** "You are ignoring the bunkers! People might be trapped there!"
  *   **The Defense:** "We know people *might* be in the bunkers. But scanning open rubble yields 10 survivors per hour. Digging bunkers blindly yields 0.1 survivors per hour. We will scan the open rubble *now*, and use the resources saved to develop better sensors (research) for the bunkers later."

  **What this predicts differently:**
  1.  **Investment in Sensors:** Unlike the drunk, the SAR team invests in R&D to see into the bunkers. (Predicts EA funding for long-termism research/policy tech).
  2.  **Opportunity Cost:** It acknowledges that time spent digging blindly in bunkers is time *not* saving guaranteed lives in the rubble. (Justifies the "shallow" work as morally necessary, not just convenient).
  3.  **Probabilistic, not Binary:** It admits survivors *might* be in the dark, but weights the search by probability of success per unit of resource.

  **Settled vs. Contested in this new analogy:**
  *   **Settled:** Resources are limited; you cannot search everywhere at once.
  *   **Contested:** The estimated probability of survivors in the bunkers. Critics say the probability is high (structural change is key); Defenders say the probability is low (structural change is intractable).

  **Conclusion:** The Streetlight Analogy is a rhetorical device that assumes the existence of high-value unmeasurable interventions without proving it. The SAR analogy better captures the trade-off between *certainty of impact* and *potential magnitude of impact*. Under the SAR model, the EA behavior is not a bias toward light, but a triage protocol based on current sensor capability. The critique only holds if one can demonstrate that the "bunkers" contain significantly more survivors than the thermal data suggests, and that there is a viable method to search them that EA is unjustifiably ignoring.
