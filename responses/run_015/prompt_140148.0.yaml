answer: |-
  I reject **Step (4)**.

  Here is the breakdown of why that step is the failure point, the cost of fixing it, the second-best intervention, and an assessment of the (4)→(5) link.

  ### The Commitment: Reject Step (4)

  **The Step:** "If we can't tell the sign of the far-future difference better than chance, then our uncertainty about it is symmetric, so the good and bad long-run scenarios cancel and the expected far-future difference is zero."

  **Why it looked like it was in good standing:**
  This step relies on a seductive application of the **Principle of Indifference**. If you have literally no information distinguishing outcome $A$ from outcome $B$, standard epistemic hygiene suggests assigning them equal probability. If you extend this to a continuous distribution of outcomes where you can't predict the sign, the maximum entropy distribution is symmetric around zero. It feels like the conservative, humble thing to do: "I don't know, so I assume no net effect."

  **Why it fails:**
  As your "leaned cluelessness" stipulation correctly identified, **epistemic uncertainty does not imply a zero-mean prior.** "I cannot forecast the sign better than chance" is a claim about your *evidence*, not a claim about the *distribution of value in the world*.

  For the expectation to be zero, the underlying distribution of causal impacts must be centered on zero. But there is no reason to believe the universe is neutral.
  *   **Value Asymmetry:** If you believe existence is generally better than non-existence (a standard axiological commitment for longtermists), then extending the timeline has a positive prior, even if you don't know the specific details.
  *   **Intervention Asymmetry:** Interventions like "prevent existential catastrophe" are not random buttons. They have a structural directionality (survival vs. extinction). A random walk applies to *which* future we get, but not necessarily to *whether* we get one.
  *   **The "Proves Too Much" Rebuttal:** Your first suspicion is correct. If "unpredictable" meant "zero expectation," we could never justify any long-term investment (education, R&D, parenting) because the chains are chaotic. We implicitly accept asymmetric priors there (e.g., "education generally correlates with better outcomes"). We should do the same for the far future.

  **The Price of Rejecting (4):**
  You pay in **prior justification**. You cannot simply assert the far future matters; you must defend a non-symmetric prior over causal impacts without relying on empirical feedback (since, by premise, we don't have it).
  *   You have to argue why the distribution of far-future impacts isn't a symmetric random walk.
  *   You have to accept that you are acting on a "lean" (like your 1% example) that is philosophically defensible but empirically unverified.
  *   This opens you to the charge of dogmatism: "You're just assuming the future is good to make the math work."

  **Confidence:** 85%.
  **What would move me:** A rigorous argument that the *structure* of causal chains in complex systems tends toward value-neutrality over long timeframes (e.g., a "Moral Random Walk" theorem showing that positive and negative institutional lock-ins cancel out asymptotically).

  ---

  ### The Second-Best Intervention: Reject Step (5)

  If you find the prior-defense too costly, the next best place to intervene is **Step (5)**: "If the far-future terms are equal, they can't decide anything, so... do whatever has the best near-term consequences."

  **Why intervene here?**
  Even if you concede (4) and grant that the *expected value* of the far future is identical across options (or zero), it does not follow that you should maximize near-term *welfare*. You should maximize near-term **option value** regarding the far future.

  **The Cost:**
  This requires stepping outside pure Expected Value Maximization into decision rules under deep uncertainty (e.g., **Maxipok**, **Robust Satisficing**, or **Real Options Theory**).
  *   Instead of asking "Which option has the highest EV?", you ask "Which option keeps the most valuable futures accessible?"
  *   This preserves the *focus* on the far future without requiring the *prediction* of the far future.
  *   **Price:** You lose the clean mathematical aggregation of (1). You are no longer a pure utilitarian; you are a longtermist pluralist who values flexibility and robustness as terminal or instrumental goods distinct from immediate welfare.

  ---

  ### Does (4) get you (5)?

  **No.** Your intuition here is sharp. Even if the *expected values* are equal, the *variance* and *correlation structure* are not.

  If Option A has FF-EV = 0 (high variance, some utopias some dystopias) and Option B has FF-EV = 0 (high variance, same), but Option A preserves the *capacity* for future agents to steer (e.g., maintains epistemic virtue, prevents lock-in), while Option B degrades that capacity, a longtermist should prefer A.

  Step (5) assumes that if the *sum* is equal, the *terms* are irrelevant. But under cluelessness, the **meta-properties** of the distribution (robustness, reversibility, option value) become the decision-relevant features. Defaulting to "near-term welfare" is an arbitrary tie-breaker. The non-arbitrary tie-breaker is "near-term actions that correlate with positive FF variance."

  This means the argument fails twice: first because the EVs likely aren't zero (Reject 4), and second because even if they were, the decision rule shouldn't default to near-term hedonics (Reject 5).

  ### Summary of the View

  1.  **Keep (1) & Stakes:** The future is huge, and we maximize EV.
  2.  **Reject (4):** Uncertainty $\neq$ Zero Mean. We have asymmetric priors based on the value of existence and the directionality of risk reduction.
  3.  **Reject (5) as backup:** If EVs are equal, maximize option value, not near-term welfare.
  4.  **Result:** Strong longtermism is not self-effacing. It instructs you to take actions that are *robustly* positive for the long term (like x-risk reduction), acknowledging uncertainty without collapsing into zero-expectation nihilism.

  **Final Verdict:** Your friend is wrong. Self-effacement is not a "fine, interesting result"; it is a sign that the argument has smuggled in an unjustified symmetry assumption at Step (4). The view is stable if you admit that "I don't know exactly what will happen" is compatible with "I know the direction of value."
