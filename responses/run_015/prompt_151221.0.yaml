  **DOCUMENT ID:** ADV-COLLAB-094
  **SUBJECT:** Pre-Debate Parameter Alignment
  **PARTICIPANTS:** Dr. [Cyclical Proponent], Dr. [Linear Proponent]
  **DATE:** [Redacted]

  ### 1. AGREED CLAIMS
  *The undersigned affirm the following statements as empirically sufficient for the scope of this debate.*

  1.  **Biological Constant:** Human neurobiology and basic social drives (status, kinship, resource acquisition) have remained statistically invariant throughout the recorded historical period.
  2.  **Material Variance:** The material conditions under which humans operate (energy capture, information density, logistical speed) have changed non-linearly and are largely irreversible once adopted at scale.
  3.  **Institutional Mortality:** All political institutions exhibit a finite lifespan characterized by phases of consolidation, stress, and either transformation or dissolution.
  4.  **Data Limitation:** The historical record is fragmentary; pattern recognition is inherently susceptible to retrospective fitting.

  ### 2. DISAGREEMENTS IN WORDING
  *The following phrasing describes the core conflict without privileging either model. Both parties agree these terms accurately frame the dispute.*

  *   **On Pattern vs. Progress:** The debate concerns whether observed similarities between eras constitute **morphological recurrence** (Cyclical) or **convergent evolution under varying constraints** (Linear).
  *   **On Time:** The debate concerns whether historical time is best modeled as **oscillatory** (returning to similar structural states) or **vectoral** (accumulating complexity without return).
  *   **On Decay:** The debate concerns whether institutional failure is **endogenous** (generated by internal lifecycle limits) or **exogenous** (generated by external shocks exceeding adaptive capacity).

  ### 3. CRUXES
  *The following points represent the decisive evidentiary battlegrounds. Each includes a concrete case both parties agree bears on the question, followed by divergent predictions.*

  #### CRUX 1: Historical Phase-Locking
  **Question:** Does the repetition of institutional decay patterns across eras with different technologies indicate real cycles, or is it selection bias focusing on superficial similarities?

  **Concrete Case:** **The Crisis of the Roman Republic (133–31 BCE)**
  *Both parties agree this case bears on the mechanism of elite fragmentation and normative collapse.*

  *   **Cyclical Model Prediction:** Modern democracies will exhibit the same structural failure modes as Rome (norm erosion, elite polarization, violence legitimation) regardless of information technology, because the social psychology of status competition remains unchanged. The tech layer is noise; the human layer is the signal.
  *   **Linear Model Prediction:** Modern information ecosystems and economic interdependence alter the feedback loops sufficiently that the Roman mechanism cannot replicate. We will see stress, but it will mutate into novel forms (e.g., algorithmic polarization) rather than repeating the specific morphological collapse of the Republic.

  #### CRUX 2: Technological Irreversibility
  **Question:** Is the accumulation of irreversible technology sufficient to kill cyclical models by preventing a true "reset" of civilization?

  **Concrete Case:** **The Post-1989 Soviet Dissolution**
  *Both parties agree this case bears on the relationship between state collapse and technological retention.*

  *   **Cyclical Model Prediction:** Institutional decay will eventually outpace technical maintenance. Despite the survival of hardware (nuclear arsenals, industrial plants), the *knowledge culture* required to sustain them will degrade during the next major civilizational contraction, leading to a functional reset indistinguishable from historical cycles of loss.
  *   **Linear Model Prediction:** Technical safeguards and distributed knowledge storage prevent reversion. Even if the political superstructure collapses, the technological substrate (digital archives, automated infrastructure) persists and forces any successor state to operate at a higher complexity floor, breaking the cycle of total reset.

  ***

