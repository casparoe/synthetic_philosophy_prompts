prompt: |-
  I'm a journalist, working on a feature about wether anthropology and cross-cultural psychology have quietly knocked the legs out from under the idea of moral objectivity. I've read enough of the usual stuff — the WEIRD critique of who actually ends up in psychology subject pools, the cross-cultural "moral universals" work that codes ethnographic material for cooperation-related concerns, the experimental-philosophy findings about how easily intuitions shift with framing — that I've ended up somewhere I didn't expect, and I want it stress-tested before I file.

  Here's where I've landed. The diversity data is much less threatening than it's made out to be. Sure, people in different places disagree a lot. But near as I can tell, nearly all of that is disagreement at the level of *application* — different non-moral factual beliefs, different material circumstances, different weightings of the same few concerns — not disagreement about basic moral principles. And once you look at structure rather than at specific verdicts there seems to be real convergence: everyone appears to have some class of rules they treat as holding regardless of what local authority says, everyone has some notion of fairness in cooperation, everyone prohibits gratuitous harm within some circle. So I've come to think cross-cultural moral psychology is, if anything, mildly supportive of objectivism rather than a debunking of it. That's the argument the piece is going to make.

  So: what would count against it? I want the strongest version of the other side, phrased as what would have to be true for me to be wrong, ranked from actually fatal down to merely awkward. And I want you to be honest about which of these my own side would concede as counting against it, because I suspect a fair-minded reviewer would say I've built in an escape hatch and I want to know how bad it is.

  Things I definately want you to grapple with:

  1. The generality problem. My worry is that my move is unfalsifiable: hand me any pattern of verdicts and I can always redescribe it as a shared principle plus local application. How would I tell genuine convergence in principle from post-hoc curve-fitting at whatever level of generality makes the data look tidy? What would the difference even consist in? If there's no answer there, is my position insulated by construction — and for a position of this kind is that fatal, or just what an inference-to-best-explanation argument looks like?

  2. Two results I've made up, so you can't look them up — argue them from scratch. (a) A big pre-registered study across roughly ninety societies finds that in every single society there's a class of rules people treat as authority-independent and generalizable (they still count as wrong even if the elders said they were fine and everyone around here does it), but the content of that class is all over the place: ritual purity in one place, debt and reciprocity in another, harm to strangers in a third. (b) A second pass over the same data finds that the spread within each society is larger than the spread between societies. My gut says (a) helps me and (b) is ambiguous, but I genuinely don't know which way either cuts, and in particular I don't know whether structural or formal convergence is the kind of convergence that answers a debunker at all, or whether only convergence in content does.

  3. The causal question. My defense needs every bit of variation to trace either to disagreement about non-moral facts or to different circumstances, and the debunker says much of it traces instead to cultural transmission that simply doesn't track moral facts. What evidence would distinguish those last two? Note that I don't think 'we found a cultural-learning explanation' can be the answer by itself, since some transmission story is available whether or not there are moral facts — say why, or say why I'm wrong about that.

  4. The case I think would actually break me: variation that survives information-equalization and reflection. Everyone gets the same non-moral facts, self-interest and inattention are idealized away, they can reason as long as they like, and stable disagreement about a recognizably moral question is still there. Is that the decisive one? Is it even coherent to describe? Is anything like it arguably already in the record? And am I committed to predicting it won't happen, or can I absorb it if it does?

  5. Where I'd personally be most and least moved. Most: cases where I can't reconstruct what the disagreement is even about — real incommensurability, where it stops making sense to say the two sides are applying one shared concept differently. Least: yet more cross-society variation in economic games with stakes and scripts nobody chose, since that strikes me as measuring behavior in an odd situation rather than moral judgment. Tell me if I have that backwards.

  6. Even if my objectivist-friendly reading survives, does the *method* of using untutored intuitions as evidence in moral philosophy survive it? This is the bit my editor cares about. If the intuitions philosophers lean hardest on come from a narrow slice of humanity, do I have to concede the armchair method is in worse shape than the objectivist conclusion itself — and can a realist hold those two apart, or do they stand and fall together?

  No citations please, I can't check references while I'm reporting and I'd rather have the arguments than the footnotes. If it helps, write it as if you're the most annoying reviewer my piece could possibly get.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A journalist writing a feature article.
      *   **Topic:** Whether anthropology and cross-cultural psychology undermine moral objectivity.
      *   **User's Thesis:** The data *supports* (or at least doesn't undermine) moral objectivism. Disagreements are mostly about application/facts/circumstances, not core principles. There is structural convergence (authority-independence, fairness, harm prohibition).
      *   **Task:** Stress-test this thesis. Provide the strongest counter-arguments ("what would count against it"), ranked from fatal to awkward. Address specific points (generality problem, hypothetical studies, causal questions, idealized disagreement, incommensurability, and the method of intuitions).
      *   **Tone/Persona:** "The most annoying reviewer my piece could possibly get." Critical, precise, demanding, philosophical but accessible enough for a feature piece context. No citations.
      *   **Constraints:** No citations. Address the 6 specific points raised. Rank the objections. Be honest about what the user's side would have to concede.

  2.  **Deconstruct the User's Thesis:**
      *   *Core Claim:* Cross-cultural variation is superficial (application), not deep (principles).
      *   *Evidence:* Structural universals (authority-independence, fairness, harm).
      *   *Implication:* Moral objectivism is safe; intuition-based philosophy might still be shaky.

  3.  **Brainstorming Counter-Arguments (The "Annoying Reviewer" Persona):**
      *   *Generality Problem:* This is the biggest philosophical hole. If I say "everyone values purity," and you say "everyone values harm," we can both stretch definitions until they match. Is "don't offend the ancestors" really just "don't cause harm" (spiritual harm)? If the principle is abstract enough to cover everything, does it cover anything?
      *   *Hypothetical Study (a) & (b):*
          *   (a) Authority-independent rules exist everywhere, *but* content varies wildly (purity vs. harm). This attacks the *content* universality. If the *form* is universal but content is arbitrary, that supports constructivism/relativism, not objectivism.
          *   (b) Within-group variation > between-group variation. This actually helps the user (suggests a common human nature), *unless* the within-group variation is chaotic/unprincipled.
      *   *Causal Question:* How to distinguish "different facts" from "different moral truths"? If Culture A says "eating cows is wrong" because "cows are grandmothers," is that a factual error or a moral divergence? If the causal story is purely cultural transmission without tracking truth, that's debunking.
      *   *Idealized Disagreement:* If perfect information + perfect reasoning still yields disagreement, objectivism is in trouble. This is the "Peer Disagreement" argument.
      *   *Incommensurability:* If concepts don't map (e.g., "face" vs. "dignity"), the user's "same principle, different application" move fails.
      *   *Methodology:* If intuitions are culturally shaped, can philosophers use *any* intuitions? If objectivism is true, why are intuitions so noisy?

  4.  **Structuring the Response:**
      *   **Introduction:** Adopt the persona. Acknowledge the sophistication of the piece but warn that the "structural convergence" move is a classic philosophical dodge that needs rigorous defense.
      *   **Ranking the Threats:**
          1.  *Fatal:* The Generality Problem (Unfalsifiability).
          2.  *Fatal:* Idealized Persistent Disagreement (The "Peer Disagreement" knockout).
          3.  *Severe:* Content Arbitrariness (Hypothetical Study A).
          4.  *Moderate:* The Causal Debunking Challenge.
          5.  *Awkward:* The Methodological Disconnect (Intuitions vs. Truth).
      *   **Addressing Specific Points:** Weave the 6 user points into the ranking or address them sequentially within the ranking. (Better to integrate them into the ranked objections for flow, but ensure all 6 are explicitly covered).
      *   **Conclusion:** A final verdict on whether the piece holds water.

  5.  **Drafting the Content - Section by Section:**

      *   *Intro:* Set the tone. "You've built a fortress, but the foundation is sand."
      *   *Point 1: The Generality Problem (Fatal).* This addresses User Point 1. If you can redescribe *anything* as a shared principle, you've said nothing. Example: Human sacrifice. Is it "kill innocents" (violation) or "save the world" (duty)? If the principle is "do the right thing," it's trivial. If it's "maximize utility," it's contested. *Concession:* The user must admit that if the principle is too abstract, it's useless for normative ethics.
      *   *Point 2: Idealized Disagreement (Fatal).* Addresses User Point 4. If we fix facts and reasoning and still disagree, objectivism bleeds. This is the "Peer Disagreement" argument. *Concession:* If this exists, the user's "factual disagreement" defense collapses.
      *   *Point 3: Content Arbitrariness (Severe).* Addresses User Point 2(a). Structure is universal, content is random. This suggests the *capacity* for morality is innate, but the *morality* itself is cultural. That supports evolutionary debunking, not objectivism. *Concession:* Formal convergence isn't enough; you need content convergence for objectivism.
      *   *Point 4: Causal Debunking (Moderate).* Addresses User Point 3. Distinguishing "factual error" from "cultural drift." If the explanation for a belief doesn't invoke moral truth, it's debunking. *Concession:* The user needs a story about why cultural transmission tracks truth.
      *   *Point 5: Incommensurability (Moderate/Severe).* Addresses User Point 5. If concepts don't translate, there's no shared principle to apply. *Concession:* This limits the scope of objectivism.
      *   *Point 6: Methodology (Awkward but distinct).* Addresses User Point 6. Can you be a realist but reject intuitions? Yes, but it makes philosophy harder. *Concession:* The armchair is dead, but the project survives.

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I address Hypothetical 2(b)? (Within > Between). Actually, if within-group variation is huge, it suggests individual noise overrides cultural signal. This might actually help the user (universal human nature) *unless* the variation is systematic. I need to clarify this. Actually, if within-group > between-group, it suggests culture matters less than individual psychology. That helps the user. I should note that.
      *   *Check:* Did I address the "Authority Independence" aspect? Yes, in the Content Arbitrariness section. Just because something is treated as "objective" locally doesn't make it objectively true (e.g., witches).
      *   *Tone Check:* Am I being annoying enough? Use phrases like "You're smuggling," "This is a truism," "You haven't earned this."
      *   *Constraint Check:* No citations. Keep it argumentative.

  7.  **Final Polish:** Ensure the ranking is clear. Make sure the distinction between "Fatal" (theory collapses) and "Awkward" (theory survives but looks ugly) is sharp. Ensure the "Methodology" point is distinct from the "Objectivism" point.

      *(Self-Correction on Hypothetical 2b)*: If within-society spread is larger than between-society spread, that usually implies the "cultural" variable isn't doing much work. That supports the user's "universal human nature" claim. I need to make sure I don't misinterpret this. The user thinks it's ambiguous. I should argue it actually helps them *unless* the within-society spread is random noise rather than principled disagreement. I will frame it as: if the within-society spread is principled, it kills the "shared principle" claim.

      *(Refining the Generality Problem)*: This is the strongest point. I need to emphasize that "Do what is right" is a shared principle, but it's vacuous. The user needs "Do not harm innocents." If Culture A says "Kill the firstborn," do they believe the firstborn isn't innocent? Or do they have a different principle? If the former, it's factual. If the latter, it's moral disagreement. The user assumes the former. The critic demands proof.

  8.  **Final Review against constraints:** No citations. Address all 6 points. Rank objections. Annoying reviewer persona.

