answer: |-
  This specific "gradual fission" scenario—where psychological continuity is preserved via slow replacement while the original biological matter is sustained alongside—acts as a stress test that exposes the structural weaknesses in Williams's bodily criterion while validating Parfit's reductionism.

  Here is how they compare specifically on this edge case, focusing on the problem of the "sharp break."

  ### 1. The Problem of the Arbitrary Threshold (Williams)
  Williams's position relies on the assumption that personal identity is a "deep further fact," usually anchored in spatio-temporal continuity of the physical organism. In a sudden teletransportation case, Williams can draw a hard line: the original body is destroyed, so you die.

  In your gradual scenario, Williams faces a **Sorites Paradox**. If identity depends on the body, and the body is being swapped piece-by-piece, Williams must identify the specific moment the original body ceases to exist and the new one begins.
  *   **The Dilemma:** Since the swap is only 1% per year, there is no non-arbitrary point where Williams can say, "At year 23, you vanished." If he claims you survive until 50% replacement, why not 51%? If he claims the *original biological matter* (kept alive alongside) is the true survivor, he ignores the fact that the *conscious agent* never experienced a break in continuity.
  *   **The Fission Contradiction:** Because the biological body is "alive alongside," at year 50 you have two claimants: the Synthetic Continuant (psychologically continuous) and the Biological Remnant (physically continuous). For Williams, identity must be one-to-one (transitive). If the Original is identical to the Synthetic, and the Original is identical to the Biological, then the Synthetic must be identical to the Biological. But they are two distinct entities. Williams cannot resolve this without denying identity to *both*, implying you died somewhere in the middle. But *where*? He is forced to impose a sharp break where none phenomenologically exists.

  ### 2. Dissolving the Question (Parfit)
  Parfit's reductionism is designed precisely for spectra like this. He argues that we should not ask "Is it me?" (Identity) but "Does what matters hold?" (Relation R: psychological connectedness and continuity).
  *   **Handling the Gradient:** Parfit argues that the lack of a sharp break isn't a problem to be solved; it is evidence that identity isn't what matters. In your scenario, Relation R holds smoothly between Year 0 and Year 50 for the Synthetic Continuant. The fact that the biological matter is kept alongside creates a **fission case**, which Parfit uses to prove his point: you can survive as both (or neither, in terms of strict identity), but your *survival* (what matters) is preserved in the Synthetic Continuant because the psychological chain was never broken.
  *   **No Arbitrary Line Needed:** Parfit does not need to find the moment you "vanished." He accepts that in borderline cases, there is no fact of the matter. The gradual nature of the swap confirms his view that identity is not a binary switch but a matter of degree.

  ### 3. Why the "Sharp Break" Intuition Collapses
  Our usual intuition demands a discrete moment of death or survival (a "jump"). This scenario collapses that intuition because it separates **phenomenological continuity** from **ontological distinctness**.

  *   **For Williams:** The intuition collapses because his theory demands a binary outcome (Alive/Dead) in a continuous process. He is forced to claim you died at some point during the 50 years, even though *ex hypothesi* you never lost consciousness, memory, or character. This makes his view counter-intuitive in this specific case; it requires a "hidden death" that the subject never experienced.
  *   **For Parfit:** The intuition collapses because he rejects the premise. He argues the intuition that there *must* be a sharp break is a linguistic or conceptual error. We expect a sharp break because we assume "I" refers to a simple, indivisible entity. Parfit argues "I" refers to a brain and body exhibiting Relation R. Since Relation R degrades or branches gradually, the expectation of a sharp break is the illusion, not the gradual process.

  ### Verdict on the Edge Case
  **Parfit handles the lack of a sharp break better.**
  Williams is trapped by the logic of identity (transitivity and determinacy). The gradual replacement combined with the survival of the biological matter forces him to either accept a contradiction (two originals) or an arbitrary cutoff (death by percentage). Parfit bypasses this by downgrading the importance of identity itself. In this gradual-fission scenario, Parfit can account for the smooth psychological experience *and* the existence of the biological remnant without logical contradiction, whereas Williams must sacrifice the phenomenological reality of continuous consciousness to preserve the logical rigidity of bodily identity.
