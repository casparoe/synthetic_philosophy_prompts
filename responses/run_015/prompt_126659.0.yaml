  **Setup:** Divide 14 students into three committees: Archive (1980), Museum (2000), Foundation (2020). Distribute confidential cards.

  **Roles:** Archive & Foundation are *Endurers*: "You are the organization, wholly present. Assert literal identity and authority over all decades." Museum is *Perdurant*: "You are a temporal part. Authority is derivative via the 4D whole." One student per committee is a *Hidden Stage*: "You are an independent entity linked by counterpart relations. No causal continuity exists. Negotiate without legitimate claim to identity. If challenged, deny continuity."

  **Goal:** Allocate 100 Legacy Points. Points awarded only if policy text remains identical across all three rounds.

  **Rules:** Merge archives if identity is proven; dissolve boards if coherence fails.

  **Timeline:**
  *   0-5: Distribute cards. Silence.
  *   5-20: Round 1 (Internal). Endurers draft absolute claims; Perdurants draft conditional ones. Hidden Stages prepare contradictions.
  *   20-40: Round 2 (Negotiation). Committees meet. Endurers veto Museum changes claiming identity. Perdurants argue partial authority. Hidden Stages introduce incompatible clauses.
  *   40-55: Round 3 (Resolution). Vote on final text. Calculate points based on survival.
  *   55-90: Debrief.

  **Debrief:** Reveal metaphysical labels. Map Endurer dominance to strict identity (Lewis's critique). Map Perdurant compromise to temporal parts. Map Hidden Stage isolation to Exdurance/Sider's stages. Highlight how Endurers felt frustration at 'change' while Perdurants accepted 'replacement'.

  **Missing Feature:** The game tests *authority continuity*, not *temporary intrinsics*. You must explicitly supply the problem of how one entity holds contradictory properties (e.g., solvent vs. bankrupt) across rounds.

  **Predictable Failure:** Endurers will likely dominate via intuitive authority, making Perdurant derivative status feel like weakness rather than ontology.

  **Design Liberties:** Conflating normative authority with ontological persistence. Persistence does not entail budget veto power.

  **Falsification Condition:** If students resolve the negotiation purely through pragmatic compromise without encountering ontological friction (e.g., if the Hidden Stage's sabotage is treated as normal bargaining), the game fails to distinguish metaphysical positions and is merely a coordination puzzle. Success requires the *impossibility* of reconciliation to feel metaphysical, not strategic. Specifically, if students conclude the game *proved* Endurantism correct because they won points, rather than recognizing the game staged the *intuition* of identity, the design fails to distinguish metaphysics from intuition pumps.
