prompt: |-
  I'm running a 90-minute graduate metaphysics seminar with about fourteen students, and I want an in-class negotiation game that makes them feel the pressure of endurantism versus perdurantism without any opening lecture. Design a structured three-round activity: divide the class into three institutional committees—an archive, a museum board, and a research foundation—each representing the "same" organization at 1980, 2000, and 2020. Give every student a confidential role card. Two committees should play as Endurers, required to argue they are literally the same entity, wholly present in every round, with direct authority over past and future budgets; one committee should play as Perdurants, treated as temporal parts that possess authority only derivatively through a four-dimensional whole they never directly access. Include explicit rules for merging archives, dissolving boards, and allocating points (not real money) tied to whether coherent policy survives across rounds. Crucially, inject a hidden fourth framing—exdurantism—where one subgroup within each round is actually an independent "stage" linked to others only by a counterpart relation, with no causal or authoritative continuity at all, so they must negotiate without any legitimate claim to being the same institution. Provide a minute-by-minute timeline, the role cards, the payoff scheme, and instructions that formal names (endurance, perdurance, exdurantism, stage theory) are revealed only after round three. The rules should be arranged so participants run into the coordination and authority problems themselves before debrief. In the debrief, map round-one intuitive identity-claims onto endurance, round-two distributed authority onto perdurance, and round-three isolation onto exdurantist stages; flag the feature of temporary intrinsics this staging necessarily cannot reproduce and must be supplied by you; and note what will predictably go wrong the first run (likely Endurers dominating through intuitive authority). Be explicit about where the design takes liberties with standard formulations. Finally, state what specific argument or classroom observation would change your mind about whether this genuinely distinguishes the metaphysical positions rather than merely staging intuition pumps. Keep the response under 450 words.
