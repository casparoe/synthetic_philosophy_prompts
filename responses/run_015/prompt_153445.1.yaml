answer: |-
  hey, i've been turning over that deterministic branching case you sent over and i think you have hit on a genuine fracture point in how we apply the principal principle to self-locating uncertainty. it's a fascinating puzzle because it forces us to decide whether rational credence should track the global statistics of the multiverse or the local statistics of the agent's specific situation. the standard reading of lewis would suggest that if the objective chance of red is fixed at 0.3 by the branching rule, then your credence should be 0.3 provided you have no inadmissible evidence. but in this transparent mechanistic branching scenario, i think that intuition misfires because it treats the global proportion as the only relevant chance function, ignoring the fact that in a branching universe, chance is always relative to a branch or a lineage.

  to see why the principal principle needs adjustment here, consider what the agent actually knows. they know the deterministic law that generates one hundred copies every second, and they know that exactly thirty of those copies receive a red light. however, they also know their own history and qualitative state up to the moment of branching. let's assume the deterministic rule doesn't assign colors randomly across the indices but clusters them based on parameters that supervene on the agent's prior state. for instance, maybe the rule dictates that copies generated from agents with a specific memory pattern are disproportionately likely to receive the red light. if the agent knows they have that memory pattern, their epistemic equivalence class—the set of copies they could possibly be, given everything they know about themselves—is no longer the global set of one hundred copies. it is a smaller subset defined by their specific history. if within that subset the frequency of red lights is 0.8, then deferring to the global 0.3 seems irrational. why should you care about the copies that are qualitatively different from you, generated from different priors, when you know for a fact you are not one of them? this is the core of what i'm calling the local branch deference principle. it says that rational credence should defer to the frequency of outcomes within the reference class of copies that are indistinguishable from your current epistemic position, not the frequency across the entire multiverse.

  now i know the standard reply to this is to invoke the admissibility clause of the principal principle. a lewisian would argue that if you know the deterministic law and you know your own prior state, you effectively have inadmissible evidence about the outcome. the reasoning goes that since the system is deterministic, your prior state plus the law entails the color of the light for your specific copy index. therefore, you aren't dealing with chance anymore, you are dealing with certainty, or at least evidence that bypasses the chance function entirely. on this view, the principal principle never gets a foothold because your evidence is too rich, effectively telling you the result before you look. but i think this reply confuses knowing the generating mechanism with knowing the particular result in a way that glosses over the nature of self-locating uncertainty. knowing the law tells you how the machine works, and knowing your history tells you where you entered the machine, but in a branching scenario, entering the machine results in multiple outputs. even with full knowledge of the law and your input, you do not know which output is yours until you resolve the self-locating uncertainty.

  the mistake in the standard reply is treating self-locating information as if it were ordinary evidence about the external world. ordinary evidence about the world can be inadmissible if it reveals the outcome through a causal backdoor, but self-locating evidence is about which subject you are. in this deterministic branching case, the "outcome" is not a single event that happens or doesn't happen, it is a distributed property across the branches. when you learn something about your own history that correlates with the branching rule, you aren't learning about the light directly, you are learning about which branch you occupy. this distinction matters because the principal principle is designed to guide credence when there is a gap between the truth and our knowledge of it. in branching, that gap is fundamentally indexical. if i know that agents with my history end up in red-lit rooms 80 percent of the time, ignoring that fact in favor of the global 30 percent would be like ignoring a known bias in a coin because the global frequency of heads across all coins in the factory is 50 percent. the local bias is what matters for your bet.

  furthermore, calling this evidence inadmissible undermines the purpose of the principal principle in a branching context. if every piece of information about the agent's state counts as inadmissible evidence about the outcome because the system is deterministic, then the principal principle becomes vacuous for any embedded agent. it would imply that rational credence is always 0 or 1 for any deterministic system, even those that appear stochastic to the agent. but we want a norm that guides agents who know they are in a deterministic multiverse but still face uncertainty about their future experiences. the local branch deference principle preserves the spirit of the principal principle by matching credence to the relevant objective frequency, it just specifies that the relevant frequency is the one within the agent's epistemic equivalence class. this allows the credence to diverge from the global proportion when the deterministic rule creates clusters, which is exactly what we should expect if rationality is about maximizing expected utility from the agent's perspective.

  so when the objection claims that knowing the branching law plus self-location is just inadmissible evidence about the outcome, they are assuming that the outcome is a singular fact waiting to be discovered. but in this setup, the outcome is relative to the branch. your self-location doesn't tell you the outcome in the sense of collapsing the superposition or revealing a hidden variable, it tells you which measure of the multiverse you should use to calculate your expectations. knowing the mechanism tells you the map, but knowing your location tells you where you are on the map. the standard reply conflates having the map with knowing your destination, but in a branching world, having the map and knowing your current position still leaves multiple destinations open, weighted by the local structure of the branches. therefore, the evidence is admissible because it does not resolve the uncertainty about which future you will experience, it only constrains the set of possible futures to those compatible with your current self.

  ultimately, i think the local branch deference principle offers a more robust guide for rational action in these weird edge cases. it respects the objective structure of the branching system without forcing the agent to ignore relevant information about their own identity. if the deterministic rule clusters red lights among copies that share your specific history, then your rational credence should reflect that cluster, not the global average. to do otherwise would be to treat yourself as a random sample from the entire multiverse when you know you are a sample from a specific subset. the principal principle was built for a world where chance is fundamental and evidence is external, but in a deterministic branching world, chance is emergent and evidence is often internal. adapting the principle to defer to local branch frequencies doesn't break lewis's insight, it just updates it for a topology where the agent is split across the probability space. i think this holds up even against the inadmissibility charge because it clarifies that self-locating evidence is not evidence about the chance process itself, but evidence about the observer's relation to that process, which is precisely the kind of information rational credence should incorporate.
