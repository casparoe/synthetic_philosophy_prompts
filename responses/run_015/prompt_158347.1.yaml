          *   *Fix:* Clarify that bootstrapping generates *knowledge* but doesn't constitute the *justification structure* of the basic belief. Or, qualify (e) to allow "local circularity" but "global linearity."
      *   *Analysis of (c) vs. (e):* Reflective equilibrium implies holism. Foundationalism implies linearity.
