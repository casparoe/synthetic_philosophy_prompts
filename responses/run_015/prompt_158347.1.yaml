          *   *Severity:* High. This is the specific worry the user flagged. If "easy knowledge" is allowed for perception, the door opens for moral reliabilism unless there's a relevant difference.

      *   **Tension 4: (a) vs. (c) - Default Entitlement vs. Revisability.**
          *   (a) says basics have entitlement without prior support.
