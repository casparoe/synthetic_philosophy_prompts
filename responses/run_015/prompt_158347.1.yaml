      *   *Check:* Ranking. I think the (b)/(d) tension is the most philosophically damaging because it invites a *reductio* regarding moral knowledge. The (b)/(e) tension is definitional but manageable (many foundationalists accept easy knowledge). The (c)/(e) tension is standard moderate foundationalism.
      *   *Wait, re-evaluating (b) vs (e):* If (e) says justification *does not circulate holistically*, but (b) allows using P to prove R (which supports P), is that holistic circulation? Cohen (2002) argues it's not vicious. But (e) says "justification of derived beliefs ultimately traces back to them [basics] rather than circulating." If I use P to justify R, R is derived. That fits. The problem arises if R is needed for P. (b) usually claims R isn't needed for P's *prima facie* justification, but P can prove R. So (b) and (e) might be compatible *if* (e) is read as about the *source* of justification, not the *deployment* of knowledge. I will rank this lower than the (b)/(d) asymmetry issue.
