      *   *Analysis of (b) vs. (d):* The user claims perception allows "cross-checking" while morality doesn't. But if (b) allows *bootstrapping* (using the output to verify the process), then morality should be able to do the same (use moral intuition to verify moral faculty). The user needs to distinguish *inter-modal* cross-checking (perception) from *intra-modal* bootstrapping (morality). If (b) validates intra-modal bootstrapping, (d) collapses.
          *   *Fix:* Restrict (b) to cases where independent calibration is *possible* (even if not used), or admit that (d) requires a stronger claim about the *nature* of moral facts (e.g., non-naturalism vs. naturalism) rather than just access. Or, weaken (b).
