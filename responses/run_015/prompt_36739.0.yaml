answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Structure of Hard Choices and the Completeness of Value
  **Date:** May 24, 2024
  **Parties:** The Comparativist (Pro-Trichotomy) and The Parity Theorist (Pro-Tetrachotomy)
  **Drafted By:** Graduate Coordinator

  ### Preamble
  Over the course of the academic year, the undersigned have engaged in a sustained dialectic regarding the metaphysics of value and the structure of rational choice. While we remain divided on the fundamental architecture of the better-than relation, we agree that the "hard choice" phenomenon is a fixed point in our data that any adequate theory must explain. This document codifies our common ground, isolates our residual disagreements, and specifies the empirical and conceptual tests that bear on the cruxes of our dispute.

  ### I. Points of Agreement
  *The following claims are endorsed by both parties. They are intended to be substantive enough to rule out reductive error theories, yet neutral enough to accommodate both trichotomous and tetrachotomous frameworks.*

  1.  **Non-Epistemic Hardness:** Hard choices are not merely cases of evidential uncertainty. There are cases where an agent has full knowledge of the non-normative facts and precise concepts, yet the choice remains hard. The difficulty is not solely in the knowing, but in the choosing.
  2.  **Rationality Without Superiority:** An agent can act rationally in a hard choice even if it is not true that the chosen option is strictly *better* than the foregone alternative. Rational permissibility does not require a unique best option.
  3.  **Phenomenological Neutrality:** The phenomenology of struggle (the experience of "tornness" or deliberative weight) is a real datum that requires explanation. However, the existence of this phenomenology does not, by itself, entail the truth of Parity or the falsity of Trichotomy. Both views must account for why some choices feel harder than others.
  4.  **Equality vs. Parity Distinction:** There is a descriptive difference between paradigm cases of value equality and the cases central to this dispute (e.g., choosing between distinct careers or life paths).
      *   *In paradigm equality:* Options are interchangeable; switching between them without cost is rational (no arbitrage resistance).
      *   *In hard choice cases:* Options resist interchangeability; once an option is chosen, switching back without a change in circumstances often seems irrational or regrettable, even if the options were initially deemed comparable.
  5.  **Normative Significance:** Hard choices are normatively significant. They are not merely gaps in value to be navigated, but opportunities for agency. How one resolves a hard choice matters to the normative status of the agent's future actions.

  ### II. Points of Disagreement
  *The following table isolates the specific propositions where consensus could not be reached. Formulations are neutral but precise.*

  | ID | Point of Contention | Comparativist Position | Parity Theorist Position |
  | :--- | :--- | :--- | :--- |
  | **D1** | **The Completeness Thesis** | The better-than relation is complete. For any $A, B$, exactly one holds: $A > B$, $B > A$, or $A = B$. | The better-than relation is incomplete. There exist $A, B$ such that none of the trichotomous relations hold, yet $A$ and $B$ are comparable (On a Par). |
  | **D2** | **The Source of Hardness** | Hardness arises from *imprecision* in value concepts or *indeterminacy* in the facts, masking a underlying trichotomous relation (usually a tie or a very slight difference). | Hardness arises from the *structure* of the values themselves. Distinctive values (e.g., artistic vs. moral) create a sui generis relation that is not reducible to equality or ordering. |
  | **D3** | **The Role of the Will** | The will *selects* between options that are already normatively ranked or tied. Commitment reveals reasons but does not create them. | The will can *create* reasons. In hard choices, the act of commitment itself generates normative force that did not exist prior to the choice. |
  | **D4** | **Transitivity** | Value relations are strictly transitive. If $A \geq B$ and $B \geq C$, then $A \geq C$. | Parity may violate standard transitivity in chains (e.g., Sorites-style sequences), requiring a modified logic of comparability. |

  ### III. Cruxes: Tests and Predictions
  *We identify three specific arguments or cases that bear decisively on the disagreements above. We record our divergent predictions in advance.*

  #### Crux 1: The Small Improvement Argument (SIA)
  *   **The Setup:** Consider two options, $A$ and $B$ (e.g., two career paths), judged to be "roughly equal." Let $A^+$ be $A$ plus a small improvement (e.g., a slight salary increase or marginally better conditions).
  *   **The Question:** Is $A^+$ strictly better than $B$?
  *   **Comparativist Prediction:**
      *   If $A$ and $B$ were *exactly* equal, $A^+$ **must** be better than $B$.
      *   If $A^+$ is *not* better than $B$, then $A$ and $B$ were not exactly equal; they fell within a zone of vagueness/imprecision where "equal" was an approximation.
  *   **Parity Theorist Prediction:**
      *   $A$ and $B$ are on a par. A small improvement to $A$ does not necessarily make $A^+$ better than $B$. $A^+$ may also be on a par with $B$. The parity relation is robust against small improvements that would break a tie.
  *   **Agreed Test:** Intuition pump regarding whether a trivial gain *must* tip the scale. If intuitions say "No, the salary bump doesn't make the corporate job definitively better than the academic one," Parity is supported. If intuitions say "Yes, logically it must be better, even if we can't measure it," Comparativism is supported.

  #### Crux 2: Vagueness vs. Ontological Parity
  *   **The Setup:** A Sorites chain of improvements from $A$ to $B$. (e.g., removing grains of sand from a career's benefits until it becomes clearly worse).
  *   **The Question:** Does the transition from "comparable" to "better/worse" happen via a sharp cutoff (hidden by vagueness) or via a distinct relational shift?
  *   **Comparativist Prediction:** The phenomenon is fully reproducible by semantic or epistemic vagueness. No fourth relation is needed to explain the "blur" between better and worse. The "fourth relation" is just the penumbra of "equal."
  *   **Parity Theorist Prediction:** Vagueness cannot explain the *normative* difference between a tie and parity. In a tie, reasons cancel; in parity, reasons run in different dimensions. A chain of vague improvements cannot bridge distinct evaluative categories (e.g., justice vs. happiness).
  *   **Agreed Test:** Cases involving *incommensurable categories* (e.g., a day at the beach vs. preventing a mild injustice). If vagueness explains the comparison here, Comparativism wins. If the categories resist comparison entirely until a "will" bridges them, Parity wins.

  #### Crux 3: Normative Power and Equality
  *   **The Setup:** An agent chooses $A$ over $B$ in a hard choice. Later, the agent is offered the chance to switch to $B$ at no cost.
  *   **The Question:** Does the prior choice make switching irrational?
  *   **Comparativist Prediction:** If $A = B$, switching is rationally permissible (indifference). If switching is impermissible, it implies $A > B$ was true all along (perhaps due to a tie-breaking reason like "consistency"). The choice did not *create* the reason; it *identified* a pre-existing tie-breaker.
  *   **Parity Theorist Prediction:** The choice puts the agent "behind" $A$. Switching is impermissible not because $A$ was initially better, but because the commitment *made* $A$ better for the agent. This normative power is available in parity cases but not in exact equality cases (where interchangeability remains).
  *   **Agreed Test:** Survey of reflective judgments on "rational regret" or "rational switching" in life-path choices vs. trivial tie choices (e.g., two identical cans of soup).

  ### IV. Diagnostic Note on Verbal vs. Substantive Dispute
  *In the spirit of collaboration, we isolate the portion of our disagreement that appears merely verbal from that which remains substantive.*

  **1. The Verbal Component: The Definition of "Equal"**
  We acknowledge that a portion of our dispute stems from divergent stipulations regarding the term "exactly as good as" ($=$).
  *   **Comparativist Usage:** Often employs $=$ to cover a range of *imprecise equality*. For the Comparativist, "equal" can denote a zone of indeterminacy where no fact of the matter makes one better.
  *   **Parity Theorist Usage:** Insists $=$ denotes *precise equality* (interchangeability in all contexts).
  *   **Resolution:** If the Comparativist admits that "imprecise equality" behaves differently than "precise equality" (specifically regarding the Small Improvement Argument and interchangeability), and the Parity Theorist agrees to label the former "Parity," the dispute over the *label* is verbal.

  **2. The Substantive Core: Ontology of Imprecision**
  Even after clarifying terminology, a substantive disagreement remains regarding the *source* of the imprecision.
  *   **Substantive Question:** Is the failure of trichotomy due to *our concepts* (semantic/epistemic vagueness) or due to the *nature of value* (ontological parity)?
  *   **Why it Matters:** If it is semantic, better concepts could dissolve the hard choice. If it is ontological, no amount of conceptual cleanup will resolve the choice; only agency can.
  *   **Status:** This remains unresolved. The Comparativist maintains that a "god's eye view" of value would restore trichotomy. The Parity Theorist maintains that a "god's eye view" would still see parity because values are fundamentally multidimensional.

  ***

  **Signed:**

  _________________________
  (The Comparativist)

  _________________________
  (The Parity Theorist)

  _________________________
  (Graduate Coordinator)
