      *   *Implant Case:* Hooking to a device changes the language game. "S" now means "Neural Pattern N." It doesn't prove "Sensation X = Sensation Y."
      *   *Edge Case 1 (Private Display):* If only I see it, it's functionally private. Wittgenstein would say it suffers the same fate as the diary.
