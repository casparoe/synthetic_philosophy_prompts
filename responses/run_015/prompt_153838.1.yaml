      *   **Goal:** Verify the accuracy of their understanding (based on a podcast) of Wittgenstein's *Philosophical Investigations* (PI), specifically regarding the PLA, the "Beetle in a Box," the social aspect of language, and the application to neuroscience/BCIs.
