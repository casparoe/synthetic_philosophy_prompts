      *   *Refining the "Neuroscience" Point:* This is the most critical correction. Neuroscience correlates; it doesn't define semantics. The Hard Problem is about *why* N feels like S, not just that N correlates with S. Wittgenstein would say asking "Is my N your N?" is category confusion if N is public data.
