      *   **Key Definition of Democracy:** Not voting procedure, but the "absolute form of government" maximizing collective *potentia* (power) by aligning individual *conatus* (striving) with common law. Corruption occurs when parts of the multitude are excluded from deliberation despite formal equality (tending toward aristocracy/monarchy).
      *   **Key Distinction:** *Cives* (citizens capable of rational agreement) vs. *Subditi* (subjects/dependents). Apply this to the franchise (excluded EU nationals, regional turnout differences, binary framing by parties).
      *   **Key Question 1:** Did the referendum express shared rational determination of the common good, or domination by passions (fear, hope, private interest)?
