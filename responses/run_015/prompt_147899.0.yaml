      *   **Propose the "Direction of Attention" Solution:** Distinguish between outward-looking motives (kid/soldier) and inward-looking motives (guilt-avoider).
      *   **Propose Gradation:** Moral worth isn't all-or-nothing.
      *   **Address the specific cases:**
