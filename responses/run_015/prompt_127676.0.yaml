  Yet, you cannot separate Miriam from how she touches the world. Those of us who worked beside her know that she treated authority as a fragile thing. She believed that power is only legitimate when it is exercised with absolute care. She taught us that when a decision cannot be undone, the standard for making it must be flawless. If the machinery of justice cannot guarantee that flawlessness, she believed the state lacks the standing to act. That wasn't strategy. It was integrity. It was a refusal to claim a power she felt nobody truly holds.

  Look around this room. It is a rare thing to see such fierce disagreement seated at the same table. On one side, those who demanded justice for victims and communities. On another, those who know what it is to have their own lives restored after the state got it wrong. And in the middle, the clerks who watched her wrestle with the text until it yielded truth.

  To our friends from the prosecutor's office and victim advocacy: You came because you know Miriam never dismissed the pain of loss. She honored the gravity of harm by refusing to treat justice as a numbers game. She knew that failing the victim and failing the accused were two sides of the same coin. She respected your duty enough to hold you to the highest standard. She never viewed your zeal as an enemy, but as a necessary force that required careful channeling.

  To the guests who join us tonight after finding your way back to us: You are not exhibits. You are proof that precision matters. Miriam never called you lucky. She called you people who deserved the truth. She refused to say the system worked when it had to be corrected. She owed you that honesty. She believed that when the state makes a mistake, it must own it fully, without consolation. She knew that your presence here tonight is not a gift from the court, but a right you reclaimed.

  To her clerks: We know the dissents remain dissents. We know the votes often went the other way. But we also know that the record now bears the weight of her questions. She didn't write for the majority; she wrote for the integrity of the institution. She showed us that losing a vote is not the same as losing the argument for how we ought to behave. We learned that rigor is a form of care.

  And to Ray, and all her family: We know love survives disagreement. We know that sharing a meal matters more than settling a score. You know the woman behind the robe, the one who worries about everyone else's comfort before her own.

  Miriam, you asked us not to talk about the work. But the work is simply where your character showed itself most clearly. You taught us that humility is not weakness. You taught us that admitting limits is the highest form of strength. You taught us that every file contains a human being who cannot be replaced. You showed us that the law is not just a tool to be used, but a promise to be kept.

  So we raise our glasses not to the cases, but to the judge. Not to the arguments, but to the person. To the next chapter, where the only verdict that matters is your happiness. To Miriam.
