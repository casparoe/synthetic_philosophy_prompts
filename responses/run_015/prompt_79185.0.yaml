  You're quite right that the label "mechanical" often carries a sneer it doesn't deserve, and that from a sufficiently distant vantage point, we all look like clockwork. But you've conflated the existence of a mechanism with the inability to modify it. The difference isn't between mechanism and magic, but between a script that runs and a script that can read itself. Consider a cook following a recipe. If the stove flares up, a Sphex-cook would stir the pot exactly three times regardless of the flame. A human cook adjusts the heat. Both are physical processes, both are determined by prior states, but the human mechanism includes a feedback loop where the output of the "stove monitoring" subroutine alters the parameters of the "stirring" subroutine. That isn't infinitude; it's just architecture. You don't need infinity to escape the Sphex trap, you just need a loop that allows the system to rewrite its own immediate instructions.

  As for why we are so eager to locate you within the natural order, it isn't out of a desire to diminish you. It's because positing a non-mechanical escape hatch explains nothing. If you say your flexibility escapes mechanism, you've merely given the mystery a name without solving it. When you move my car keys, I don't restart my day from bed; I search the pockets. That looks like freedom, but it's just a higher-order routine: "if keys missing, initiate search protocol." You call this freedom because the loop is deep enough that you can't see the bottom. I call it nested routine because I've spent a career looking down the shaft. The question isn't why I insist you're an insect; it's why you insist your flexibility requires a break in the causal chain rather than just a more complex link.
