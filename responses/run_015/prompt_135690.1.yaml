answer: |-
  ### Desiderata for a Text-Based Verbal Dispute Test

  The following specifications define the adequacy conditions for any procedure intended to classify the decade-long conflict between the two research groups. They are divided into **Operational Cases** (scenarios the test must resolve), **Conceptual Distinctions** (categories the test must keep apart), and **Methodological Constraints** (limits on the evidence and logic used).

  #### I. Operational Cases
  *Scenarios the test must successfully classify without external data.*

  **1. The Inferential Licensing Case (Non-Negotiable)**
  *   **Specification:** The test must yield a determinate verdict in cases where both parties agree on all observable, non-linguistic states of affairs (e.g., measurement outputs, behavioral patterns) but disagree on whether the contested term licenses specific counterfactuals or theoretical inferences.
  *   **Consideration:** If the test cannot distinguish between a disagreement about the *world* and a disagreement about the *rules of the language game* governing the term, it fails its primary function. A verdict of "verbal" here must not imply the inferences are useless, only that they do not track a further fact.
  *   **Status:** Non-Negotiable.

  **2. The Pragmatic Cutoff Case (Non-Negotiable)**
  *   **Specification:** The test must handle disputes where the contested term serves as a boundary condition for external norms (statutes, funding eligibility, safety regulations), even if the underlying ontology is vague.
  *   **Consideration:** A dispute can be semantically verbal yet pragmatically substantive. The test must not classify a dispute as "substantive" *solely* because real-world consequences hinge on the terminology. It must isolate the semantic disagreement from the institutional stakes.
  *   **Status:** Non-Negotiable.

  **3. The Diachronic Drift Case (Non-Negotiable)**
  *   **Specification:** The test must remain applicable when the extension of the contested term shifts for one or both parties over the ten-year period, such that no single, stable pair of idiolects exists for comparison.
  *   **Consideration:** Static tests (comparing Definition A vs. Definition B at Time 1) will fail if the dispute is driven by conceptual engineering or gradual semantic shift. The test must analyze the *trajectory* of usage, not just snapshots.
  *   **Status:** Non-Negotiable.

  **4. The Revisionary Aim Case (Non-Negotiable)**
  *   **Specification:** The test must distinguish between a party attempting to *describe* the current usage/reference of a term and a party attempting to *prescribe* a new usage (ameliorative or revisionary semantics).
  *   **Consideration:** If Group A claims "X is not Y" to report a fact, and Group B claims "X is Y" to propose a new standard, the dispute is not a standard verbal dispute but a clash of modes. The test must not misidentify a normative proposal as a factual error.
  *   **Status:** Non-Negotiable.

  #### II. Conceptual Distinctions
  *Categories the test must keep logically separate.*

  **5. The Separation Principle (Non-Negotiable)**
  *   **Specification:** The test must output three independent variables: (a) Verbal/Substantive status, (b) Pragmatic Worth (worth settling/ignoring), and (c) Fault (who is responsible for the confusion).
  *   **Consideration:** A dispute can be verbal but worth settling (due to funding rules), or substantive but not worth settling (due to cost), or verbal and faulty (due to obfuscation). Collapsing these leads to premature dismissal of research programs.
  *   **Status:** Non-Negotiable.

  **6. The Metaphysical Neutrality Constraint (Preference: Deflationary Side)**
  *   **Specification:** The test should not presuppose a specific ontology (e.g., realism vs. anti-realism about the disputed entities) to determine if the dispute is verbal.
  *   **Consideration:** A test that requires assuming entities *do not exist* to prove the dispute is verbal begs the question against the realist party. However, achieving full neutrality may be impossible (see Analysis below).
  *   **Status:** Preference (Deflationary Side).

  **7. The Non-Triviality Condition (Preference: Non-Deflationary Side)**
  *   **Specification:** A verdict of "verbal" must not automatically entail "trivial" or "merely semantic" in a dismissive sense.
  *   **Consideration:** Conceptual choices can be deep and theoretically significant. The test must allow for a "substantive verbal dispute" classification where the choice of framework matters for theory construction, even if it doesn't track mind-independent facts.
  *   **Status:** Preference (Non-Deflationary Side).

  #### III. Methodological Constraints
  *Limits on evidence and procedure.*

  **8. The Archive-Only Constraint (Non-Negotiable)**
  *   **Specification:** The test must rely exclusively on published papers and transcripts. It cannot require eliciting intuitions, running experiments, or querying the authors for clarification.
  *   **Consideration:** The panel lacks the authority and access to intervene. A test requiring "idealized dialogue" or "canonical paraphrase" generated by the authors is operationally useless for this panel.
  *   **Status:** Non-Negotiable.

  **9. The Asymmetry Tolerance (Preference)**
  *   **Specification:** The test must allow for the possibility that the dispute is verbal for one party but substantive for the other.
  *   **Consideration:** In revisionary cases (Case 4), one side may be describing while the other is prescribing. Symmetric tests will fail to capture this dynamic.
  *   **Status:** Preference.

  ***

  ### Analysis of Tensions and Prejudices

  #### 1. The Incompatible Desiderata
  The two desiderata I suspect cannot be jointly satisfied are **The Archive-Only Constraint (8)** and **The Metaphysical Neutrality Constraint (6)**.

  **Why:** To determine if two parties agree on "non-linguistic facts" (required for Case 1) using *only* texts, the panel must interpret the texts. Interpretation requires a hermeneutic stance.
  *   If you interpret the texts charitably to maximize agreement on facts (to reveal a verbal dispute), you are implicitly adopting a deflationary stance that assumes the "real" content is the shared observational core.
  *   If you interpret the texts literally (to respect their ontological claims), you are forced to treat their disagreement as substantive unless you have independent access to the "facts" they are describing.
  *   Without the ability to ask the parties (violating Constraint 8), you cannot verify if their agreement on "facts" is genuine or merely verbal agreement on *descriptions* of facts. Thus, you cannot remain neutral (Constraint 6); the text-analysis method itself will force a deflationary or inflationary reading to generate *any* verdict. You must choose between a usable test (Archive-Only) and a neutral test (Neutrality). I prioritize **Archive-Only** for your specific context, acknowledging that Neutrality will be compromised.

  #### 2. The Prejudice Disguised as a Requirement
  The desideratum that is actually a prejudice of one camp dressed up as a requirement is **The Metaphysical Neutrality Constraint (6)**.

  **Why:** The demand for neutrality presupposes that "verbal" and "substantive" are categories that can be identified without taking a stance on the nature of truth and reference. However, most robust accounts of verbal disputes (e.g., Hirsch, Chalmers) rely on deflationary assumptions about ontology to work. Demanding neutrality often functions as a shield for realists who wish to prevent their claims from being categorized as "merely verbal." Conversely, demanding a deflationary outcome is a shield for anti-realists. There is no "view from nowhere" to adjudicate this; the test itself will embody a metaphysical commitment.

  #### 3. The Most Exclusionary Requirement
  The single requirement that rules out the largest share of accounts on offer is **The Archive-Only Constraint (8)**.

  **Why:** The dominant philosophical accounts of verbal disputes (Carnap's frameworks, Chalmers' canonical notation, Thomasson's easy ontology) rely heavily on **idealized dialogue**, **paraphrase exercises**, or **direct intuition pumping**. They assume the philosopher can ask, "Would you say X if Y?" or "Can we rephrase this as Z?" In your scenario, the panel is a passive observer of a frozen record. Any account requiring active reconstruction of the parties' semantic intentions through interaction is immediately disqualified. This eliminates nearly all standard "method of elimination" tests.

  #### 4. Illegitimate Metaphysical Work
  Can a verdict of *verbal* be prevented from doing illegitimate first-order metaphysical work? **No.**

  **Why:** To declare a dispute "verbal" is to claim that the world does not decide the outcome. This is itself a first-order metaphysical claim (specifically, an ontological negative existential or a claim about the structure of reality). If the panel rules the dispute verbal, they are effectively ruling that the entities or properties in question do not constitute a fact of the matter independent of language. This cannot be avoided. The best the panel can do is to explicitly acknowledge that the "verbal" verdict carries this metaphysical weight, rather than pretending it is a purely linguistic classification that leaves the metaphysics untouched. The distinction between "language" and "world" is not clean enough to allow the verdict to be metaphysically inert.
