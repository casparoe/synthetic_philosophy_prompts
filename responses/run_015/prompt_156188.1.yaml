answer: |-
  1. Conceptual brainstorm

  The primary trap is "moral commensurability"—the false assumption that suffering can be converted into a single currency like death tolls or dollars. This flattens distinct harms into a leaderboard, alienating survivors. We must distinguish between *structural analysis* (comparing mechanisms of violence) and *hierarchical ranking* (comparing victim worth). A niche concept crucial here is **Dimensional Asymmetry**. Atrocities differ not just in magnitude but in dimension: some are industrial, some intimate; some rapid, some generational. Comparing them linearly distorts both. For instance, comparing the speed of killing in Rwanda to the duration of slavery isn't a ranking of evil, but a recognition of different moral geometries. The procedure must preserve these asymmetries rather than resolving them. We are not seeking a final score; we are preventing categorical errors that cause secondary harm. The goal is curatorial integrity, not philosophical truth.

  2. The decision proceedure

  **The Memorial Ethics Checklist**
  **Usage:** Run this sequence immediately upon receiving a proposal involving multiple events. Do not skip steps.

  **Step 1: Identify the Metric.** What is being compared? (Deaths, suffering, systems, funding). Write it down. If the metric is "evil" or "worth," proceed to Step 2. If the metric is "logistics," proceed to Step 5.

  **Step 2: The Hierarchy Halt.** Ask: "Does this imply one group suffered *more* or deserves *less* recognition?" If YES, **STOP**. Proposal inadmissible. Suffering is not competitive. Ranking victim worth violates the museum's duty of care. There is no "less than" in mass atrocity.

  **Step 3: Dimensional Check.** Are the events dimensionally asymmetric? (e.g., Industrial vs. Intimate, Rapid vs. Generational). If YES, do not compare magnitude. Compare only mechanisms. Linear ranking distorts distinct moral geometries. If the events operate on different axes, a single scale is a lie.

  **Step 4: Stakeholder Impact.** Have descendant communities been consulted? If NO, **PAUSE**. Proceed only with consent. Comparison without consultation risks secondary trauma. If communities object, the comparison is inadmissible regardless of educational value.

  **Step 5: Purpose Test.** Is the comparison educational (understanding violence) or distributive (allocating space/funding)? If distributive, **STOP**. Space/funding must be based on narrative necessity, not atrocity scores. Logistics cannot drive ethics.

  **Test Sentences:**
  *   "Event A was worse than Event B." (Inadmissible)
  *   "Event A used bureaucracy; Event B used mobs." (Admissible for systems gallery)
  *   "Event A gets less space because fewer died." (Inadmissible)

  **Verdicts:** Admissible (Educational/Structural), Inadmissible (Hierarchical/Distributive), Needs Judgment (Community consent unclear).

  **Final Review:** If any step triggers a STOP, the proposal is rejected regardless of educational value.

  3. Three worked cases

  **Case A: Rwandan vs. Cambodian Genocide (Exhibit Size)**
  *Proposal:* Allocate square footage based on death tolls (1.7M vs 800k).
  *Step 1:* Metric is death toll.
  *Step 2:* Hierarchy Halt. Does this imply less space = less significance? Yes. Implicitly ranks victim worth by numbers.
  *Step 5:* Purpose is distributive (floor space).
  *Verdict:* **STOP. Inadmissible.**
  *Board Reaction:* They won't like this. They want objective metrics for logistics. But the procedure flags this as ranking victim worth. Space must be based on narrative scope, not body counts. This forces the board to find non-quantitative justification for size, which is harder work. The board must argue narrative density, not statistics.

  **Case B: Holocaust vs. Atlantic Slave Trade (Systems Gallery)**
  *Proposal:* Compare bureaucratic structures in a "Systems of Violence" section.
  *Step 1:* Metric is organizational structure.
  *Step 2:* Hierarchy Halt. Is one called "more evil"? No, focusing on mechanics.
  *Step 3:* Dimensional Check. Both involve state machinery. Asymmetry low. Comparison valid for mechanism, not suffering.
  *Step 5:* Purpose is educational.
  *Verdict:* **Admissible.** Focus on mechanisms, not suffering levels. Wording must avoid implying one system was "more efficient" at killing. The comparison serves understanding, not ranking.

  **Case C: Victim Suffering (Memorial Plaque)**
  *Proposal:* Wording stating "Victims of X endured unique agony compared to Y."
  *Step 1:* Metric is suffering quality.
  *Step 2:* Hierarchy Halt. Claims unique/higher agony implies comparison.
  *Verdict:* **STOP. Inadmissible.**
  *Reasoning:* Even "unique" implies comparability. Plaques should stand alone. This prevents competitive victimhood. The board must rewrite to describe suffering without reference to other events. This limits their ability to make unifying statements, which frustrates donors seeking universal lessons.

  4. Limits, misfires, and judgment calls

  This tool cannot resolve political pressure from donors or states. Step 4 (Stakeholder Impact) is the weakest link; "consent" is subjective and often fragmented within communities. Step 3 (Dimensional Check) requires curatorial expertise, not just ethics; staff might misidentify asymmetries. The procedure fails when "narrative necessity" (Step 5 exception) is used as a loophole to justify unequal funding. Hard cases involving overlapping victim groups (e.g., disabled victims within the Holocaust) should be kicked to an external ethics committee. Ultimately, this checklist filters out egregious moral errors, but it cannot generate empathy. It protects against bad faith comparisons, not good faith mistakes. If community outrage is high despite a "Admissible" verdict, the board must override the tool. Ethics is not an algorithm; this is just a guardrail.
