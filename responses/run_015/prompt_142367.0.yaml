answer: |-
  Your arithmetic for that specific sequential voting protocol is broadly correct—64.8% is the ceiling there, not 98%—but you've constructed a straw man of the institution, not the theorem. You've modelled a roll-call vote where declaring a decision is mandatory before hearing further evidence, which is nothing like the secret ballot preceded by discussion that epistemic democrats actually advocate. When we deliberate, we exchange reasons and evidence, which functions as signal pooling rather than vote cascading; if I hear your argument, I update my posterior, but when I step into the booth, my vote is conditionally independent of yours given the shared information set. The Condorcet logic applies to the aggregation mechanism—the ballot—not the preceding chat, and so long as the final vote isn't publicly sequential, the law of large numbers still drives error rates down as $n$ increases, provided the deliberation doesn't correlate us perfectly. You've proved that public sequential voting is epistemically brittle, not that large groups voting secretly after talking lose their advantage.

  Confidence: 85% — I'd want to double-check the degree to which shared deliberation actually restores conditional independence versus creating a common error source that persists into the ballot.
