prompt: |-
  I'm a doctoral student in philosophy of social cognition, and I'm trying to fix a research agenda on collective intentionality for the next three years. I want to avoid both broad surveys and empirically intractable questions. To narrow the field, I'm working with a distinction that cuts across the usual Searle-Bratman-Gilbert taxonomy: between coordination sustained purely by interlocking individual intentions and mutual belief ("structural joint action"), and coordination that requires each party to recognize the other as a co-subject with standing in the shared activity ("recognitional joint action"). The latter borrows from recognition-theoretic accounts of agency but applies them to ordinary joint action rather than to institutional or political contexts.

  Given this framing, which unresolved questions in collective intentionality and joint action matter most, and in what order should they be pursued?

  In particular, I want a defended prioritization—not a list—addressing at least these three nodes:

  First, whether the structural/recognitional distinction marks a real ontological difference, or whether every apparently structural case already presupposes minimal recognitional conditions.

  Second, what the status of asymmetric joint action is: cases where one agent operates under a "we"-frame ("we are painting the house") while the other operates under an individual "I"-frame ("I am painting my assigned section"), with no shared collective commitment. Does this constitute a deficient joint action, a non-joint action, or something that requires external arbitration to determine its status?

  Third, which of these debates is most upstream for theories of distributed moral responsibility—specifically, whether settling the necessity of recognitional commitment for joint action would substantially alter our assessments of collective blame in collaborative harm.

  For each, I want the reasoning behind its rank: why it is tractable for conceptual philosophy rather than empirical science, which other questions depend on its resolution, and what kind of conceptual or argumentative progress over the next two to three years would cause you to reorder the priorities. I also want to know which widely discussed questions—for instance, the aggregation problem for group-level attitudes, or the reduction of we-intentions to I-intentions—you would actively deprioritize given this framing, and why their resolution would not change much downstream.

  Please avoid bibliographies, reading lists, or citations. I need an agenda with dependency relations and tractability assessments, not references.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **User:** Doctoral student in philosophy of social cognition.
      *   **Goal:** Fix a 3-year research agenda on collective intentionality.
      *   **Constraints:** Avoid broad surveys and empirically intractable questions. Use a specific framing: *Structural Joint Action* (interlocking intentions/mutual belief) vs. *Recognitional Joint Action* (recognizing co-subjects with standing).
      *   **Specific Nodes to Address:**
          1.  Ontological status of the Structural/Recognitional distinction (Real difference vs. Structural presupposes Recognitional).
          2.  Status of Asymmetric Joint Action (One "We", One "I", no shared commitment).
          3.  Upstream impact on Distributed Moral Responsibility (Does recognitional commitment alter collective blame?).
      *   **Requirements:** Defended prioritization (not just a list), reasoning for rank (tractability, dependency), conditions for reordering, and identification of deprioritized questions (with justification).
      *   **Format:** No bibliographies, reading lists, or citations. Focus on dependency relations and tractability.

  2.  **Deconstruct the Framing:**
      *   *Structural:* Searle/Bratman style. Focus on mechanics, interlocking intentions, common knowledge.
      *   *Recognitional:* Honneth/Anderson/Darwall style (applied to joint action). Focus on normative standing, mutual recognition as agents/partners.
      *   *The Tension:* Is recognition just a hidden premise of structure, or is it a distinct layer?

  3.  **Evaluate the Three Nodes for Prioritization:**

      *   *Node 1 (Ontological Status):* This is foundational. If Structural *always* presupposes Recognitional, then the distinction collapses into a single kind (Recognitional). If they are distinct, we have a taxonomy. This determines the metaphysics of the field.
      *   *Node 2 (Asymmetry):* This is a boundary case. It tests the limits of the definitions established in Node 1. If Node 1 says recognition is necessary, Asymmetry might fail to be joint action. If Node 1 says structure is enough, Asymmetry might count.
      *   *Node 3 (Moral Responsibility):* This is an application/downstream consequence. It depends on the definitions settled in 1 and 2. You can't figure out blame without figuring out what the action *is*.

      *   *Initial Ranking Hypothesis:* 1 -> 2 -> 3.
      *   *Critique:* Is Node 1 too abstract/metaphysical? The prompt asks for tractability for *conceptual philosophy*. Node 1 is purely conceptual. Node 2 is conceptual but tests edge cases. Node 3 is normative ethics applied to social ontology.
      *   *Refinement:* Node 1 is the "keystone." If you get it wrong, 2 and 3 are built on sand. However, Node 2 (Asymmetry) might be the *test case* that resolves Node 1. Sometimes working through the hard case clarifies the principle. But logically, you need the principle to judge the case. Let's stick with 1 as primary, but acknowledge 2 is the proving ground. Node 3 is definitely last because it relies on the output of 1 and 2.

  4.  **Drafting the Argument for Priority 1 (The Ontological Distinction):**
      *   *Why First?* It defines the terms of engagement. If structural action *requires* recognition, the "Structural" category is a subset or an illusion. This dictates the entire taxonomy.
      *   *Tractability:* It's a conceptual analysis of necessary conditions. Can you describe a case of interlocking intentions without *any* mutual recognition of standing? (e.g., manipulation, coercion, unwitting coordination).
      *   *Dependencies:* Node 2 and 3 depend on this.
      *   *Reordering Condition:* If empirical work (not the focus, but possible) shows cognitive mechanisms for structural coordination don't involve recognition networks, or if a counter-example is found that is intuitively joint action but lacks recognition.

  5.  **Drafting the Argument for Priority 2 (Asymmetric Joint Action):**
      *   *Why Second?* It stress-tests the definition from Node 1. It addresses the "fringe" of social cognition.
      *   *Tractability:* Thought experiments (exploitation, hierarchy, manipulation) are standard philosophical tools.
      *   *Dependencies:* Depends on Node 1's definition. Influences Node 3 (can you blame the "We" agent if the other is just an "I" tool?).
      *   *Reordering Condition:* If Node 1 resolves so decisively that Asymmetry is ruled out immediately (e.g., "Recognition is necessary, so Asymmetry is impossible"), then Node 2 dissolves. But if Node 1 allows a spectrum, Node 2 becomes crucial.

  6.  **Drafting the Argument for Priority 3 (Moral Responsibility):**
      *   *Why Third?* Normative conclusions follow ontological premises. You need to know what "joint action" is before assigning "joint blame."
      *   *Tractability:* Conceptual linking of ontology to ethics.
      *   *Dependencies:* Heavily dependent on 1 and 2.
      *   *Reordering Condition:* If a specific moral crisis or legal case demands immediate attention (pragmatic override), or if the ontological work stalls.

  7.  **Identifying Deprioritized Questions:**
      *   *Aggregation Problem:* How do individual attitudes sum to group attitudes? *Why deprioritize?* The user's framing (Structural vs. Recognitional) bypasses the need for summation. Recognition isn't an aggregate; it's a relational stance. Solving aggregation doesn't help distinguish structural from recognitional.
      *   *Reduction of We-Intentions:* Can "We" be reduced to "I"? *Why deprioritize?* The Recognitional frame likely posits "We" as irreducible (normative standing). Debating reductionism is a legacy debate that might be orthogonal to the specific Structural/Recognitional cut.
      *   *Phenomenology of "We":* What does it feel like? *Why deprioritize?* Too empirical/phenomenological, risks intractability. The prompt wants conceptual tractability.

  8.  **Refining the Argumentation (Self-Correction/Polishing):**
      *   *Check:* Did I avoid citations? Yes.
      *   *Check:* Is the prioritization *defended*? Yes, need to emphasize *why* 1 must come before 2.
      *   *Check:* Is the distinction clear? Ensure I don't slip into Searle/Bratman name-dropping as substance, but use them as shorthand for the concepts defined in the prompt.
      *   *Nuance on Node 1:* The key argument is whether recognition is *constitutive* or *regulative*. If constitutive, Structural is a myth. If regulative, they are distinct. This is the conceptual crux.
      *   *Nuance on Node 2:* Asymmetry is the "exploitation" case. If I use you without your recognition, is it joint? This tests the moral/ontological link.
      *   *Nuance on Node 3:* If recognition is required for joint action, then in structural-only cases (if they exist), moral responsibility might not distribute the same way. This is the payoff.

  9.  **Final Review against Constraints:**
      *   3-year agenda? Yes, the flow fits.
      *   No bibliographies? Yes.
      *   Addressed the three specific nodes? Yes.
      *   Addressed deprioritized questions? Yes.
      *   Tone: Academic, strategic, philosophical.

  10. **Final Polish:** Ensure the distinction between "ontological difference" and "presupposition" is sharp in the first section. Ensure the "Asymmetric" section clearly links to power dynamics without getting bogged down in political philosophy (keep it social cognition/agency focused). Ensure the "Responsibility" section links back to the "Recognitional" requirement.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "1 then 2 then 3." I need to explain the *dependency*. Node 1 determines the *criteria*. Node 2 tests the *boundary*. Node 3 applies the *consequences*. This is a logical flow. I will structure the response to reflect this logical architecture.

  *(Deprioritization check)*: The prompt asks about the "aggregation problem" and "reduction of we-intentions." I need to explicitly mention these and explain why the Structural/Recognitional framing makes them less central. The framing shifts focus from *mental state arithmetic* to *relational status*.

  *(Tractability check)*: Why is Node 1 tractable? Because it relies on intuition pumps and counter-examples (manipulation, coercion, unwitting coordination) rather than fMRI or large-scale sociology.

  *(Reordering conditions)*: Be specific. What would make me switch 1 and 2? If the asymmetry cases prove *more* illuminating about the nature of recognition than abstract analysis. What would make me switch 3 up? If the ethical stakes are deemed more urgent than the ontological clarity (pragmatic turn).

  Okay, ready to write.
answer: |-
  Here is a defended research agenda prioritizing the three nodes you identified, structured by logical dependency and conceptual tractability.

  ### Priority 1: The Ontological Status of the Structural/Recognitional Distinction
  **Rank:** First (Foundational)
  **Timeframe:** Year 1

  **Reasoning for Priority:**
  This question is the keystone of your entire framework. You must determine whether "Structural Joint Action" (SJA) and "Recognitional Joint Action" (RJA) are two distinct species of social coordination or whether SJA is merely an incomplete description of RJA. If every instance of interlocking intentions and mutual belief *already* presupposes a minimal recognition of the other as a co-subject with standing, then the "Structural" category collapses. It becomes merely a description of the *mechanics* of RJA, not a distinct ontological kind. Conversely, if you can demonstrate cases of robust coordination where recognition is absent (e.g., unwitting coordination, manipulation, or purely instrumental alignment), then the distinction holds, and you have a genuine taxonomy.

  **Tractability Assessment:**
  This is highly tractable for conceptual philosophy because it relies on the method of counter-example and necessary condition analysis. You do not need empirical data to test whether a specific thought experiment counts as "joint action." You can construct cases of "interlocking intentions without recognition" (e.g., two agents unknowingly furthering the same goal, or one agent manipulating another's intentions to fit a plan) and test them against our pre-theoretic intuitions about agency. The question is not "how does the brain do this?" but "does this description suffice for agency?"

  **Dependencies:**
  Both Node 2 (Asymmetry) and Node 3 (Responsibility) depend on this resolution.
  *   If SJA and RJA are distinct, Asymmetric Joint Action might be classified as a deficient form of SJA.
  *   If SJA presupposes RJA, then Asymmetric Joint Action might be ruled out as impossible (since the "I"-frame agent would fail to recognize the "We"-frame agent, breaking the jointness).
  *   Similarly, your account of moral responsibility will look radically different if recognition is a necessary condition for joint action versus an optional add-on.

  **Conditions for Reordering:**
  You should only deprioritize this if you find that abstract analysis leads to a stalemate where intuitions diverge too wildly to yield progress. If, after six months, the "distinct vs. presupposed" debate proves purely verbal, you should move to Node 2 (Asymmetry) and use those concrete cases to force a resolution on Node 1. Sometimes the boundary case clarifies the definition better than the definition clarifies the boundary.

  ### Priority 2: The Status of Asymmetric Joint Action
  **Rank:** Second (Boundary Testing)
  **Timeframe:** Year 2

  **Reasoning for Priority:**
  Once you have established your working definition of the Structural/Recognitional distinction, you must stress-test it against edge cases. Asymmetric Joint Action (one "We", one "I", no shared commitment) is the perfect stress test. It isolates the variable of *mutual* recognition. This node matters because it addresses power dynamics and hierarchy without requiring you to dive into full-blown political philosophy. It asks: Is joint action possible when the "jointness" is only viewed from one side?

  This is prioritized second because you cannot judge the asymmetry case without the criteria established in Node 1. If Node 1 concludes that recognition is constitutive of joint action, the Asymmetric case is likely a "non-action" or a form of exploitation masquerading as collaboration. If Node 1 concludes that structural interlocking is sufficient, the Asymmetric case might count as a "deficient" joint action.

  **Tractability Assessment:**
  This is tractable because it allows you to utilize specific, high-resolution vignettes (e.g., a manager and a worker, a manipulator and a victim, a parent and a young child). You can analyze the direction of fit and the normative expectations in these dyads. It avoids the intractability of "group minds" by keeping the focus on dyadic interaction, which is easier to model conceptually.

  **Dependencies:**
  This node feeds directly into Node 3. The status of the asymmetric agent determines whether they can be held collectively responsible. If the "I"-frame agent is merely a tool for the "We"-frame agent, they may be exempt from collective blame. If the asymmetry still constitutes a form of joint action, they may share in the liability.

  **Conditions for Reordering:**
  If the analysis of Asymmetry reveals that the "We"/"I" mismatch is actually the *primary* driver of the ontological distinction (i.e., you realize the Structural/Recognitional split is best understood *through* asymmetry rather than prior to it), you might elevate this to Priority 1. Additionally, if you find that "Asymmetric Joint Action" is simply a contradiction in terms based on your Year 1 work, you can collapse this node and move to Year 3 early.

  ### Priority 3: Upstream Implications for Distributed Moral Responsibility
  **Rank:** Third (Normative Application)
  **Timeframe:** Year 3

  **Reasoning for Priority:**
  This is the payoff node, but it must come last. Questions of collective blame and responsibility are normative; they depend on the ontological status of the agent(s) being blamed. You cannot determine if a group is liable for harm until you determine if they constitute a unified agent or a collection of individuals.
  Specifically, you asked whether settling the necessity of recognitional commitment alters assessments of collective blame. The hypothesis is that if recognition is required for joint action, then in cases of "structural" coordination without recognition (if such things exist), collective blame should not apply. Instead, blame should remain individual. If, however, structural coordination is sufficient for joint action, then collective blame might apply even without mutual recognition.

  **Tractability Assessment:**
  This is tractable as a conceptual linkage project. You are not solving the problem of moral luck or free will generally; you are tracing the implications of your specific social ontology (from Nodes 1 and 2) into the ethical domain. You are mapping the "is" of joint action to the "ought" of responsibility.

  **Dependencies:**
  This is entirely downstream. A change in the conclusion of Node 1 (e.g., recognition is necessary) forces a total rewrite of the Node 3 argument (e.g., no collective blame without recognition).

  **Conditions for Reordering:**
  The only reason to elevate this is pragmatic urgency. If a specific real-world controversy (e.g., corporate liability in AI development, or institutional harm) demands an immediate philosophical framework, you might work backward from the moral intuition to the ontology. However, for a doctoral agenda focused on theoretical rigor, keeping this last ensures your ethical conclusions are grounded rather than ad hoc.

  ---

  ### Deprioritized Questions

  Given your specific framing (Structural vs. Recognitional), the following widely discussed questions should be actively deprioritized. Resolving them would not significantly advance your specific research goals.

  **1. The Aggregation Problem (How individual attitudes sum to group attitudes)**
  *   **Why Deprioritize:** Your framing shifts the focus from *summation* to *relation*. The Structural/Recognitional distinction is not about how many people intend X, but about the *quality of the relation* between them. Whether a group attitude is an aggregate of individual attitudes is less relevant than whether the individuals recognize each other's standing. Solving the aggregation problem (e.g., via voting models or averaging) does not help you distinguish between a coercive hierarchy (Structural) and a cooperative partnership (Recognitional).
  *   **Impact on Agenda:** Ignoring this saves you from formal modeling and game theory, keeping the project within the realm of phenomenological and normative conceptual analysis.

  **2. The Reduction of We-Intentions to I-Intentions**
  *   **Why Deprioritize:** This is a legacy debate in collective intentionality (often associated with the Searle vs. Bratman divide). Your framework bypasses this by introducing a third variable: *recognition*. Even if "We-intentions" are reducible to "I-intentions," the *recognitional* status of those I-intentions remains an open question. You can have interlocking I-intentions that are either recognitional or non-recognitional. Therefore, settling the reduction debate does not settle your core distinction.
  *   **Impact on Agenda:** Focusing on reductionism would pull you into metaphysics of mind and semantics, distracting from the social-normative core of your "Recognitional" category.

  **3. The Phenomenology of the "We-Experience"**
  *   **Why Deprioritize:** While relevant to social cognition, the subjective "feel" of joint action is empirically intractable for a philosophy dissertation without a strong empirical partner. More importantly, a "feeling" of togetherness does not guarantee recognitional standing (one can feel together while exploiting another), and recognitional standing can exist without a strong phenomenological "we" (e.g., in distant, formal collaborations).
  *   **Impact on Agenda:** Prioritizing this would risk turning your project into a psychology review rather than a normative ontology. Your distinction is about *standing*, not *sensation*.

  ### Summary of Strategic Logic
  Your agenda moves from **Metaphysics** (What is the distinction?) to **Boundary Conditions** (Does asymmetry break the jointness?) to **Normativity** (Who is to blame?). This order ensures that your ethical conclusions are not floating on undefined ontological premises. By deprioritizing aggregation and reductionism, you avoid the traps of previous decades of collective intentionality research and focus on the normative core of the "Recognitional" turn. If, after Year 1, you find that the Structural/Recognitional distinction is untenable (i.e., they are not distinct), you should pivot immediately to analyzing *degrees* of recognition rather than types of action, but the dependency order (Ontology -> Boundary -> Ethics) should remain fixed.
