answer: |-
  This impasse is best diagnosed as a **clash of explanatory ideals regarding the limits of representationalism**, masked as an ontological dispute. It is not merely verbal, nor is it purely metaphysical; it is a disagreement about what counts as a *sufficient explanation* of cognitive agency.

  ### 1. Diagnosis: The Nature of the Disagreement

  The dispute is substantive, but it is not about the world (the neuroscience is agreed upon); it is about the **map**.

  *   **Not Merely Verbal:** While both sides stretch definitions (Reductionists expand "propositional" to include indexical, practical modes of presentation; Anti-Reductionists expand "practical" to include a sui generis grasp), the stakes are real. The Reductionist seeks **ontological parsimony** (a unified cognitive architecture). The Anti-Reductionist seeks **phenomenological fidelity** (preserving the distinct feel of flow, intuition, and embodied coping). If we treat this as merely verbal, we ignore the downstream consequences for AI design, pedagogy, and psychopathology.
  *   **Explanatory Completeness:** The core friction is over the criterion for "complete explanation."
      *   **Reductionists** operate under a **Computational-Representational** ideal. For them, if a state carries information and guides action, it can be modeled as a proposition (broadly construed). To say there is a "residue" is to invite mysticism.
      *   **Anti-Reductionists** operate under a **Dynamic-Embodied** ideal. For them, an explanation is incomplete if it cannot account for the *source* of flexibility without invoking an infinite regress of rules (the regress argument). They argue that propositional guidance always requires a non-propositional background to be applied.
  *   **Metaphysical Commitments:** This is ultimately a conflict over **Representationalism**. The Reductionist assumes the mind is fundamentally a manipulator of content. The Anti-Reductionist suspects that at the bedrock of agency, there is only *coupling* between organism and environment, not content manipulation.

  Therefore, the disagreement is a **framework conflict**. Both sides are looking at the same neural dynamics but interpreting them through incompatible theoretical lenses (Classic Cognitivism vs. Enactivism/Ecological Psychology).

  ### 2. Can It Be Resolved?

  **No empirical finding or formal result will resolve this dispute in its current form.**

  *   **Empirical Findings:** As you noted, both sides accept the neuroscience. A scan showing activation in the basal ganglia (procedural) vs. the prefrontal cortex (declarative) does not settle the issue. The Reductionist will argue the basal ganglia is executing propositional content via a different hardware interface; the Anti-Reductionist will argue the prefrontal cortex is merely monitoring a non-propositional flow. The data is theory-laden.
  *   **Formal Results:** Computational theory cannot decide this because the debate is about the *interpretation* of the computation. A neural network can be functionally equivalent to a rule-based system (universal approximation), but whether the network *contains* rules or merely *approximates* their output is an interpretive stance, not a mathematical proof.
  *   **Conceptual Distinctions:** We already have them (e.g., Stanley & Williamson's "practical modes of presentation"). The problem is that these distinctions are accepted by one side as dissolving the problem and by the other as begging the question.

  The impasse persists because the question asks for an **ontological verdict** ("Is X *distinct* from Y?") on what is actually a **functional gradient**.

  ### 3. The Question is Ill-Posed

  The original question—"Is knowing-how distinct from knowing-that?"—reifies epistemic categories into natural kinds. It assumes there is a sharp boundary in the mind corresponding to the grammatical distinction between "I know that..." and "I know how to..."

  Cognitive architecture likely does not respect this binary. Instead of two distinct *types* of knowledge, there is likely a **continuum of representational granularity and accessibility**.

  *   **High Accessibility/High Granularity:** What we call "Knowing-That" (explicit rules).
  *   **Low Accessibility/Low Granularity:** What we call "Knowing-How" (compressed, proceduralized priors).

  The Reductionist is right that the underlying machinery might be uniform (e.g., predictive processing). The Anti-Reductionist is right that the *functional role* of compressed, inaccessible priors is fundamentally different from explicit, manipulable rules. Treating them as ontologically distinct categories obscures the mechanism by which one turns into the other.

  ### 4. The Reframed Question

  To dissolve the impasse, we must shift from **ontology** (what *is* it?) to **dynamics and utility** (how does it *function* and when does it *matter*?).

  **The Reframed Question:**
  > *"Under what conditions does the cognitive system convert adaptive, implicit sensorimotor contingencies into explicit, manipulable propositional formats, and what functional costs or benefits attend this process of 'explicitation'?"*

  **Why this reframing works:**

  1.  **It Accepts the Continuum:** It acknowledges that skills can be more or less articulate without forcing a binary choice.
  2.  **It Focuses on the Interface:** It targets the "hard problem" of the debate: the transition from novice (rule-following) to expert (flow), and from expert to teacher (re-articulation).
  3.  **It Is Empirically Tractable:** We can study "choking under pressure" (where explicitation harms performance) vs. "debugging" (where explicitation helps). We can measure the metabolic or temporal cost of accessing explicit rules vs. implicit priors.
  4.  **It Neutralizes the Metaphysics:** It doesn't matter if the implicit prior is "really" a proposition or a "grasp." What matters is whether treating it as one or the other yields predictive power over behavior.

  **Conclusion:**
  The debate is a **zombie dispute** sustained by the hope that one side's vocabulary will eventually swallow the other's. The Reductionist vocabulary risks becoming vacuous (if everything is a proposition, nothing is); the Anti-Reductionist vocabulary risks becoming obscurantist (if the "practical grasp" is ineffable, it is scientifically inert).

  The path forward is **Pragmatic Functionalism**. We should stop asking if knowing-how *is* knowing-that and start asking how the brain manages the **trade-off between the flexibility of explicit representation and the efficiency of implicit coupling**. This moves the discussion from a stalemate over metaphysical categories to a productive research program into the architecture of cognitive control.
