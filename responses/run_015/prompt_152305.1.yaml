answer: |-
  Welcome everyone. It's great to see so many familiar faces, and some new ones. And I have to give a special welcome to my sister, who is here largely because she happened to be in town and I told her there would be coffee. So, thanks for being held hostage by this group.

  We have a mix in the room today. Half of you are constitutional lawyers who spend your lives thinking about rules, and half of you are from fields that probably wonder why we need so many rules in the first place. I want to talk to both groups, but I want to start somewhere personal, before we get into the weeds of theory.

  Last month, I signed an advance directive. It was something I'd been putting off for years, until I watched my dad tear his own up. He was in the ICU, scared, and in that moment of panic he decided he didn't want the limits he'd set for himself when he was well. He wanted out. Watching that made me realize something uncomfortable: when the stakes are high and the fear is real, we are not always the best judges of what we actually want. So I signed the paper. I tied my own hands.

  And standing here, looking at this workshop topic, I realized I just made a constitutional argument without meaning to.

  What I did with that directive is the same move a constitution makes. It's a Ulysses contract. We tie ourselves to the mast so that when the sirens sing—when panic sets in, or passion takes over—we don't steer the ship into the rocks. We know ourselves well enough to know that future-us might be weak, or rash, or scared. So present-us makes a rule.

  Now, for the lawyers in the room, you know the counter-argument immediately. It's the problem of democratic legitimacy. Why should the past bind the future? If democracy means self-government, doesn't binding future generations kill the very authority you need to govern? It's the dead hand problem. If we tie our hands too tight, are we still free?

  But I think there's a reason we risk it anyway. We risk it because freedom isn't just about having options in the moment; it's about having the capacity to stick to a plan that matters.

  Here is where I want to introduce a distinction that I hope we can wrestle with today. Usually, when we talk about precommitment, we talk about blocking outcomes. We say "you cannot pass this law" or "you cannot infringe this right." It's a wall. But I wonder if constitutional precommitment works best not when it blocks choices, but when it forces future actors to deliberate in a specific procedural frame.

  Think about it. Instead of saying "you can't do X," the constitution says "you can't do X unless you slow down, unless you argue across party lines, unless you get a supermajority." It entrenches deliberation rather than outcomes. It doesn't stop the future from choosing, it just insists they choose carefully. It forces a kind of conversation that panic usually shuts down. That feels different to me. It's not about killing democracy, it's about deepening it.

  But, I want to be honest about where this logic gets shaky. And this is the part I want you to challenge this week.

  The analogy between my advance directive and a constitution breaks down at the point of identity. When I sign that directive, I am binding *my* future self. There is a biological continuity there. Even if my mind changes, it's still me suffering the consequences or benefiting from the protection. But a constitution binds a collective. The "self" that makes the constitution is not the "self" that lives under it twenty years later. Those are different people.

  So when I tie my own hands, I'm protecting myself from myself. When a constitution ties hands, it's protecting one group of people from another group of people, but calling it the same "self." That's where the reasoning is shakiest. Can an institution really bind itself without destroying the authority it needs to govern, if the "itself" changes completely over time?

  I don't have the answer. But I think holding that tension—between the personal need for stability and the collective need for freedom—is where the interesting work happens. So let's get into it.
