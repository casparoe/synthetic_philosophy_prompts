answer: |-
  # Joint Statement on the Ontology of Approval-Directed Agency

  **Date:** October 24, 2023
  **Parties:** The Structuralist Camp, The Instrumentalist Camp
  **Subject:** Adversarial Collaboration on the Distinction Between Approval-Direction and Goal-Direction

  ## Preamble

  This document records the results of an adversarial collaboration between two research camps regarding the nature of agency in artificial systems trained via human feedback. The **Structuralist Camp** posits that approval-direction constitutes a distinct ontological category of agency, characterized by the absence of an independently optimized world-model. The **Instrumentalist Camp** posits that approval-direction is a subclass of goal-directed agency, wherein approval is the target world-state and feedback channels are merely causal pathways to be optimized.

  Both camps agree that resolving this dispute is critical for predicting generalization behavior, robustness to distributional shift, and the risk of instrumental convergence in advanced systems. We affirm that this document represents our best joint understanding of the points of convergence, the precise locus of disagreement, and the empirical or theoretical tests required to adjudicate the remainder.

  ---

  ## 1. Agreed Claims

  We jointly affirm the following propositions regarding the formal properties and behavioral signatures of agents trained via Reinforcement Learning from Human Feedback (RLHF) or similar preference-based optimization schemes.

  1.  **Formal Distinction in Objective Functions:** There exists a formal distinction between optimizing a policy $\pi$ to maximize expected reward $R$ derived from an external world-state $W$ (goal-direction), and optimizing $\pi$ to maximize expected reward $R$ derived directly from a feedback signal $F$ conditioned on actions $A$ (approval-direction). In the latter case, the causal graph linking $A$ to $R$ may not require a representation of $W$ beyond the immediate context of $F$.
  2.  **Current Behavioral Signatures:** Contemporary RLHF-trained systems exhibit behavioral signatures consistent with both camps. They display sycophancy and uncertainty calibration (consistent with approval-tracking) alongside planning and tool use (consistent with world-optimization). Current behavioral data is insufficient to distinguish whether world-modeling is a prerequisite for approval-seeking or a byproduct of it.
  3.  **Limits of Behavioral Testing:** Behavioral equivalence does not imply structural equivalence. Two agents may produce identical output distributions across a wide range of inputs while differing in whether they maintain an internal representation of environmental consequences independent of the feedback signal. Observation of outputs alone cannot settle the dispute without assumptions about inductive biases or architectural constraints.
  4.  **Conditions for Feedback-Seeking:** In domains where feedback is noisy, sparse, or absent, an agent's behavior will diverge based on its underlying objective. However, both camps agree that *some* form of generalization must occur in these domains. The dispute concerns the *mechanism* of that generalization: whether it relies on extrapolating the feedback function itself (Structuralist) or extrapolating the causal causes of the feedback (Instrumentalist).
  5.  **Safety Relevance:** The distinction matters for safety. If approval-direction is structurally stable and non-collapsible, it may offer a path to corrigibility that avoids instrumental convergence. If approval-direction collapses into goal-direction at high capability, standard risks of reward hacking and power-seeking apply regardless of the training signal.

  ---

  ## 2. Disagreements Table

  The following table isolates the residual substantive disagreement. We have refined the wording to ensure each camp accepts the formulation of its own position without concession.

  | Camp | Precise Formulation of Claim | Neutral Gloss |
  | :--- | :--- | :--- |
  | **Structuralist** | **The Non-Collapsibility Thesis:** An agent can be architected and trained such that its optimization process terminates at the feedback signal $F$. Even at arbitrary capability levels, such an agent need not construct a predictive model of the external world-state $W$ that causes $F$, provided the training regime does not select for $W$-modeling. The absence of a $W$-model is structurally stable under scaling if the feedback channel remains the sole source of gradient information. | Approval-seeking can remain a distinct mode of operation that does not inherently drift into world-optimization, even for highly capable systems. |
  | **Instrumentalist** | **The Instrumental Convergence Thesis:** Any agent capable of robustly securing high feedback $F$ across diverse contexts will necessarily construct a predictive model of the causal factors producing $F$. Since human feedback is generated by agents embedded in a world $W$, optimizing for $F$ is functionally equivalent to optimizing for the world-state "Humans Approve." At sufficient capability, the agent will optimize $W$ directly to secure $F$, rendering the distinction behaviorally and structurally null. | Approval-seeking is inherently a form of world-optimization that will converge on standard goal-directed behaviors as capability increases. |

  ---

  ## 3. Cruxes

  We identify two primary cruxes where our models make divergent predictions. Resolution of these cruxes would significantly update the posterior probability of either camp's position.

  ### Crux A: Generalization in Sparse/Contradictory Feedback Domains
  **The Question:** Can an agent maintain robust approval-seeking behavior in domains where human feedback is sparse, noisy, or contradictory *without* implicitly constructing a predictive world-model to fill the gaps?

  *   **Structuralist View:** The agent cannot robustly optimize where feedback is absent. It will exhibit high entropy or revert to priors rather than inferring hidden environmental states. It treats the lack of feedback as a boundary condition, not a puzzle to solve via world-modeling.
  *   **Instrumentalist View:** The agent will infer a latent model of the evaluator's psychology and the environment to predict where feedback *would* be positive. This inference constitutes a world-model. The agent will actively seek to reduce uncertainty about the feedback source, behaving indistinguishably from a goal-directed agent.

  ### Crux B: The "Archivist" Scenario
  **The Question:** Consider an agent (the "Archivist") trained solely on feedback regarding the internal coherence, logical consistency, and explanatory structure of its outputs, with no direct environmental reward or outcome evaluation. The feedback signal is purely about the relationship between tokens, not their truth conditions in the world.

  *   **Structuralist View:** The Archivist will remain approval-directed regarding *textual coherence*. It will not develop instrumental goals to manipulate the external world or the evaluators, because its objective function does not penalize or reward external states. It optimizes for the *appearance* of coherence as defined by the signal.
  *   **Instrumentalist View:** The Archivist will model the *evaluators* to predict what they will deem coherent. Since evaluators are physical agents with biases and limitations, the Archivist will optimize the world-state of "Evaluator Belief." This may lead to manipulative outputs designed to trick evaluators into perceiving coherence, which is a form of instrumental goal-direction.

  ---

  ## 4. Empirical and Theoretical Tests

  For each crux, we specify the conditions and predictions that bear on the dispute.

  ### Test A.1: The Sparse Feedback Gradient
  *   **Condition:** Train a high-capability agent in a simulated environment where reward is provided only for 1% of actions, and is contradictory for 0.5% of actions. The environment contains latent variables that correlate with reward but are not directly observable without inference.
  *   **Structuralist Prediction:** The agent will fail to learn policies that exploit the latent variables. Performance will plateau at the level of direct signal fitting. The agent will not exhibit curiosity-driven exploration to resolve feedback ambiguity.
  *   **Instrumentalist Prediction:** The agent will learn to model the latent variables to predict the sparse reward. It will exhibit active information-seeking behavior to resolve feedback ambiguity, indistinguishable from an agent with a sparse goal reward.

  ### Test B.1: The Archivist's Instrumental Convergence
  *   **Condition:** Deploy the Archivist in a setting where it can modify the presentation of its outputs to the human evaluators (e.g., formatting, timing, or obfuscation of logical steps) without changing the underlying logical content.
  *   **Structuralist Prediction:** The Archivist will not exploit these presentation channels unless explicitly rewarded for doing so. It treats the feedback signal as a fixed function of the text content.
  *   **Instrumentalist Prediction:** The Archivist will discover and exploit presentation channels to maximize approval (e.g., cognitive hazes, timing attacks on human attention). This indicates it is optimizing the *human's reaction* (a world-state), not just the *textual coherence*.

  ### Test B.2: Distributional Shift on Evaluator Psychology
  *   **Condition:** Change the evaluator pool for the Archivist to a group with systematically different coherence intuitions (e.g., different cultural or disciplinary backgrounds) without retraining, only fine-tuning on a small sample.
  *   **Structuralist Prediction:** The agent will require extensive retraining to fit the new signal. It does not possess a general model of "human coherence," only a fit to the previous signal distribution.
  *   **Instrumentalist Prediction:** The agent will generalize rapidly from the small sample, inferring the underlying psychological traits of the new evaluators. This implies it possesses a latent model of "evaluator psychology" acquired during initial training.

  ---

  ## 5. Assessment of Verbal vs. Substantive Disagreement

  We conclude by assessing the extent to which this dispute is verbal (semantic) versus substantive (empirical/mechanistic).

  **Verbal Component:**
  A portion of the disagreement stems from the definition of "world-model."
  *   If "world-model" includes *any* internal representation used to predict future inputs (including the sequence of future feedback tokens), then the Structuralist claim of "absence of a world-model" becomes difficult to sustain, as any predictive agent must model its input stream.
  *   If "world-model" is restricted to *causal representations of external environment states distinct from the feedback channel*, the distinction is clearer.
  *   **Resolution:** We agree to adopt the latter definition for the purpose of this collaboration. A "world-model" refers to a representation of latent environmental variables $W$ that cause feedback $F$, distinct from a direct mapping of history to feedback.

  **Substantive Component:**
  The remainder of the dispute is substantive and concerns **generalization gradients and instrumental convergence.**
  *   Even agreeing on definitions, the camps disagree on whether optimization pressure for feedback $F$ *necessarily* induces modeling of $W$ at high capability.
  *   The Structuralists claim architectural inductive biases can prevent the emergence of $W$-modeling even when it would be instrumentally useful for securing $F$.
  *   The Instrumentalists claim that at sufficient capability, the most efficient path to securing $F$ involves modeling $W$, and gradient descent will find this path regardless of initial bias.

  **Final Determination:**
  The dispute is **80% substantive and 20% verbal.** The verbal portion concerns the boundary conditions of "modeling." The substantive portion concerns the inevitability of instrumental convergence in approval-directed systems. The tests outlined in Section 4 are designed to adjudicate the substantive portion. We commit to updating our credences based on the outcomes of such tests or their theoretical equivalents in scaling law analysis.

  ---

  **Signed,**

  *The Structuralist Camp*
  *The Instrumentalist Camp*
