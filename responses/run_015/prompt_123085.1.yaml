answer: |-
  The stalemate is not merely verbal, but the verbal ambiguity of "standing" acts as a shield that protects a deeper, substantive disagreement about the metaphysics of moral obligation. The impasse persists because both sides are using a legal metaphor ("standing") to describe a moral phenomenon, but they are importing different legal intuitions: one side imports the logic of **jurisdiction** (who has the right to judge?), while the other imports the logic of **evidence** (is the claim true?).

  To dissolve the cycle, we must diagnose this as a **substantive disagreement about the function of blame**, which manifests as a verbal conflation of two distinct normative properties: **Authority to Demand** versus **Warrant to Assert**.

  ### 1. The Verbal Conflation: Jurisdiction vs. Warrant

  The term "standing" is doing double duty, allowing both camps to claim victory while talking past one another.

  *   **Position A (The Defeater View)** treats standing as **Normative Jurisdiction**. On this model, to blame is to issue a demand or administer a sanction. Like a judge who breaks the law they are enforcing, the hypocrite lacks the *jurisdiction* to hold the other accountable. The hypocrisy is a "performative contradiction" because the act of blaming presupposes the blamer's subjection to the norm, which their conduct denies.
  *   **Position B (The Content View)** treats standing as **Epistemic Warrant**. On this model, to blame is to assert a moral truth. Like a witness testifying in court, the blamer's own moral record is irrelevant to the *truth* of their testimony. Hypocrisy affects *credibility* (will the jury believe them?) but not *competence* (are they allowed to speak?).

  As long as "standing" refers to both the right to enforce a norm and the warrant to identify a violation, the debate will cycle. Position A is correct about jurisdiction; Position B is correct about warrant.

  ### 2. The Substantive Friction: Relational vs. Agent-Neutral Norms

  However, clarifying the vocabulary does not fully resolve the conflict, because beneath the verbal ambiguity lies a substantive split regarding the **nature of moral norms**. The disagreement is about whether moral obligations are fundamentally **reciprocal** (Position A) or **agent-neutral** (Position B).

  We can see this friction clearly in the **Partner Case** (the unfaithful partner demanding fidelity).

  *   **Position A (Reciprocity):** For the Defeater camp, the partner's blame is not just a statement that "infidelity is wrong"; it is a demand rooted in a specific relationship. The authority to demand fidelity arises from the mutual commitment of the partnership. By being unfaithful, the blamer has unilaterally dissolved the reciprocal bond that grounds their authority. To blame is to say, "We are bound by this," while acting as if "I am not bound by this." The blame fails because the *relationship* required to make the demand has been severed by the hypocrisy.
  *   **Position B (Agent-Neutrality):** For the Content camp, fidelity is a moral good regardless of the relationship's status. The unfaithful partner is asserting a truth: "Infidelity causes harm/violates vows." Even if the blamer violated the vow, the vow remains valid, and the target's violation remains a wrong. To deny standing here is to suggest that moral truths are contingent on the messenger's purity, which leads to absurdity (e.g., a murderer cannot claim murder is wrong).

  The friction point is this: **Does blame function to restore a moral equilibrium between agents (A), or does it function to catalogue moral violations in the world (B)?**

  *   If blame is **restorative/relational**, hypocrisy is a defeater because the hypocrite has opted out of the reciprocity required for restoration.
  *   If blame is **cataloguing/objective**, hypocrisy is irrelevant because the moral fact exists independently of the blamer's status.

  The **Physician Case** reveals the weakness of Position B. If a smoking physician tells a patient, "You must stop smoking to live," Position B says the advice is valid. But if the physician says, "I blame you for smoking," Position A correctly identifies a tension. The physician has epistemic warrant (the medical facts) but lacks the *moral authority* to make it a personal demand if they treat their own health with contempt. The "blame" feels like harassment rather than care because the shared commitment to health is absent in the blamer.

  The **Activist Case** reveals the weakness of Position A. If the activist says, "Carbon emissions are destroying the planet," Position A risks silencing necessary moral truth-telling because no one is perfectly carbon-neutral. If standing requires clean hands, moral discourse collapses. Position B saves the truth of the claim but risks hollowing out the *demand* for change.

  ### 3. Diagnosis and Path to Progress

  The disagreement is substantive, rooted in conflicting theories of moral authority, but it is sustained by the verbal ambiguity of "standing." Position A describes **Second-Personal Authority** (the right to make demands of another), while Position B describes **Third-Personal Assessment** (the right to evaluate actions).

  **Genuine progress requires abandoning the unitary question:** "Does hypocrisy defeat standing?"

  Instead, progress depends on a **Functional Taxonomy of Blame**. We must distinguish between two distinct speech acts that are currently lumped together under "blame":

  1.  **Moral Assertion (Witnessing):** "What you did was wrong."
      *   *Condition:* Epistemic access to the truth.
      *   *Effect of Hypocrisy:* None on validity; reduces pragmatic uptake.
      *   *Domain:* Public discourse, general ethics (The Activist).
  2.  **Moral Demand (Holding Accountable):** "You owe *me* (or *us*) an explanation/repair."
      *   *Condition:* Reciprocal subjection to the norm.
      *   *Effect of Hypocrisy:* Total defeater. One cannot demand reciprocity one has rejected.
      *   *Domain:* Interpersonal relationships, specific obligations (The Partner).

  **What counts as progress?**
  A formal analysis that separates **Illocutionary Force** from **Propositional Content**.

  *   **For Position A:** Concede that hypocrites retain the *warrant to assert* moral truths (saving the Activist), but maintain that they lose the *authority to demand* compliance or repair (saving the intuition about the Partner).
  *   **For Position B:** Concede that while the *content* of the blame remains true, the *legitimacy of the demand* is compromised by hypocrisy. Acknowledge that "standing" is not about truth, but about the *right to exact a cost*.

  The impasse dissolves when we recognize that Position A is talking about the **politics of moral community** (who gets to police whom?), while Position B is talking about the **ontology of moral facts** (what is good or bad?).

  **Conclusion:**
  The stalemate is substantive, not verbal, but it is *protected* by verbal ambiguity. The precise point of friction is whether moral blame is inherently **reciprocal** (requiring the blamer to be within the norm's scope) or **observational** (requiring only accuracy). Progress lies not in deciding who is right about "standing," but in disaggregating the concept into **Warrant to Judge** (immune to hypocrisy) and **Authority to Sanction** (vulnerable to hypocrisy). Until this distinction is codified, the cycle will continue, with each side correctly describing half of the moral landscape while mistakenly claiming it is the whole.
