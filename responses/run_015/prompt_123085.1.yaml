      *   **Position A (The Defeater View):** Hypocrisy defeats *standing*. Blaming while violating the norm is a performative contradiction/self-exemption. It robs moral authority.
      *   **Position B (The Content View):** Standing depends on the target's wrongness + blamer's epistemic access. Hypocrisy undermines credibility/pragmatics, not normative validity. It's a sociological obstacle, not a normative failure.
      *   **Shared Ground:** Both agree on descriptive facts (activist flies, physician smokes, partner cheats; targets did wrong).
      *   **User's Hypothesis:** Is this verbal (different definitions of "standing") or substantive (different theories of blame/authority)?
      *   **Task:**
          1.  Diagnose whether the disagreement is verbal or substantive.
          2.  If verbal, specify the distinction (entitlement vs. efficacy, etc.).
          3.  If substantive, identify the precise point of friction using the cases (activist, physician, partner).
          4.  Propose what counts as genuine progress based on the diagnosis.
          5.  Constraint: Engage concretely, no survey.

  2.  **Analyze the Positions:**

      *   *Position A (Standing as Authority/Entitlement):* Focuses on the *relationship* between blamer and blamee. Blame is a reactive attitude or a demand. To make a demand, you must be subject to it. If you violate it, you waive your right to demand.
          *   *Key Concept:* "Performative contradiction," "Self-exemption."
          *   *View of Blame:* A speech act of *holding accountable*.
      *   *Position B (Standing as Truth/Content):* Focuses on the *proposition* being asserted. "You did wrong." If "You did wrong" is true, the blame is valid. Hypocrisy is an *ad hominem* circumstantial fallacy.
          *   *Key Concept:* "Sociological obstacle," "Normative failure."
          *   *View of Blame:* An expression of *moral judgment*.

  3.  **Evaluate the "Verbal" Hypothesis:**

      *   Are they just talking past each other?
      *   Side A says "No standing." Side B says "Standing exists, but credibility is low."
      *   If Side A means "Normative Right to Blame" and Side B means "Social Effectiveness of Blame," then yes, it's verbal.
      *   *However*, Side B explicitly claims hypocrisy does not constitute a *normative failure*. Side A claims it *does*. This suggests they aren't just disagreeing on the definition of "standing," but on the *nature of the normativity* involved in blaming.
      *   Side B admits hypocrisy makes blame *less effective* (pragmatic), but denies it makes it *illegitimate* (normative). Side A claims it makes it *illegitimate*.
      *   So, is "legitimacy" the verbal stick? Side A thinks legitimacy requires consistency. Side B thinks legitimacy requires truth.
      *   This looks like a substantive disagreement about the *function* of blame, masked by a shared term ("standing").

  4.  **Evaluate the "Substantive" Hypothesis:**

      *   Where is the friction?
      *   *The Activist Case:*
          *   Side A: By flying, the activist implicitly claims an exception for herself. She cannot demand the target stop driving. Her blame is void.
          *   Side B: Carbon emissions are bad. The target is driving. The blame is true. The activist's flying is a separate wrong.
      *   *The Friction:* Is blame a *transaction* (requiring mutual subjection to norms) or a *verdict* (requiring only accuracy)?
      *   Side A sees blame as inherently *relational* and *reciprocal*. Side B sees blame as inherently *objective* and *monologic*.
      *   This is not merely verbal. It's a clash between a *contractual/reciprocal model of morality* vs. a *platonic/objective model of morality*.

  5.  **Synthesize the Diagnosis:**

      *   It is **both**, but the verbal confusion protects the substantive disagreement.
      *   *Verbal Layer:* They use "standing" to cover two distinct normative properties: (1) The *right* to administer a sanction/demand (Juridical Standing) vs. (2) The *warrant* to assert a moral truth (Epistemic Standing).
      *   *Substantive Layer:* Even if we distinguish these, they disagree on whether Morality is fundamentally *reciprocal* (A) or *agent-neutral* (B).
      *   *The Crux:* The "Performative Contradiction." Side A thinks blaming while violating is logically/normatively incoherent. Side B thinks it's just annoying/ironic.
      *   *Resolution Path:* We need to separate the *propositional content* of blame from the *illocutionary force* of blame.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the stalemate. State the thesis: It is a **substantive disagreement disguised as a verbal ambiguity**. The term "standing" conflates *jurisdiction* (right to hold accountable) with *veracity* (right to assert truth).
      *   *Diagnosing the Verbal Split:* Distinguish between **Normative Jurisdiction** (Side A) and **Epistemic Warrant** (Side B).
