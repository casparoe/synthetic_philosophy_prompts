      2.  **Verbal Component:** "Standing" conflates *Jurisdiction* (A) with *Credibility* (B).
      3.  **Substantive Component:** Reciprocity/Authority (A) vs. Truth/Objectivity (B). Use the Partner case to show the depth (relationship-specific vs. universal).
      4.  **Path to Progress:** Move from "Does hypocrisy defeat standing?" to "What kind of blame is this?" Propose a **Dual-Aspect Theory**: Hypocrisy defeats *enforcement authority* but not *diagnostic truth*.

  9.  **Checking Constraints:**
