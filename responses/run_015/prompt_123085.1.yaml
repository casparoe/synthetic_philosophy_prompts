          *   Side B: Standing = Competence to identify a violation.
      *   *Diagnosing the Substantive Split:* Even with clear terms, they disagree on the nature of moral norms.
          *   Side A (Reciprocity): Norms bind the community. To blame is to invoke a shared bond. Hypocrisy severs the bond.
          *   Side B (Objectivity): Norms bind individuals regardless of others. To blame is to point out a fact. Hypocrisy is irrelevant to the fact.
      *   *Applying to Cases:*
          *   *Activist:* A says she waived her right to demand. B says she correctly identified the harm.
