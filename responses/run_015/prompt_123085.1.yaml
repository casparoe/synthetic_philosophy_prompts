          *   Progress = A **Functional Taxonomy of Blame**. Distinguish *Sanctioning Blame* (requires standing) from *Witnessing Blame* (does not).
          *   Or, a **Two-Stage Model**: Hypocrisy defeats the *force* (ability to demand change) but not the *truth* (moral status of act).

  7.  **Refining the Argument (Self-Correction):**

      *   *Critique:* Is calling it "substantive" too easy? The prompt asks to choose or nuance.
      *   *Correction:* It's best to argue it's a **category error** regarding the concept of "Standing." Standing is a legal metaphor imported into ethics. In law, standing requires injury. In ethics, does it require purity?
      *   *Better Diagnosis:* The disagreement is substantive *about the function of blame*, which manifests as a verbal confusion about *standing*.
