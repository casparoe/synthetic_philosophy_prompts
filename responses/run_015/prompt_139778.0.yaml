      *   *Reciprocity:* Distinguish wild vs. companion. Companions are under our guardianship; wildlife is not. However, we must minimize suffering.
      *   *Welfare:* The "uncertainty principle." If lives are bad, cull helps. If lives are good, the crash makes them bad. Cull prevents crash.
      *   *Opposition:* Option B is morally attractive (no killing). But it prolongs the high-density suffering.
