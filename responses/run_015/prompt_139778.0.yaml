      *Refining the Welfare argument:* The prompt says "prefer... a decision that stays defensible whether deer lives... turn out to be net positive or net negative." The key is the *crash*. Overpopulation leads to starvation. Reducing population prevents starvation. This holds true regardless of baseline happiness.

