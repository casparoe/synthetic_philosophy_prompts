answer: |-
  This is a classic pedagogical trap: you are trying to teach metaphysics to people who think they are doing lexicography. Dave's intuition (the programmer's intuition) is that language is code, and if the code throws an error, it's because a variable is undefined. Your job is to show them that the variable *is* defined, but the logic of the language itself is fuzzy.

  Here is the battle plan for the 90 minutes.

  ### 1. Prerequisites: Making them feel the itch
  Your instinct is correct. If they don't feel the paradox, the solutions look like solutions to a problem that doesn't exist. Do not start with definitions. Start with a trap.

  **The Entry Point:**
  Do not start with the "Rich Villager" case immediately. Start with a **physical gradient** to bypass the "social construction" objection.
  *   **Action:** Bring a slide or a handout showing a color gradient from clear Red to clear Orange. Number the patches 1 to 100.
  *   **The Trap:** Ask the group to agree to two premises:
      1.  Patch 1 is definitely Red.
      2.  If Patch *n* is Red, then Patch *n+1* is also Red (because the difference is imperceptible).
  *   **The Crash:** Walk them to Patch 100. By their own agreement, Patch 100 is Red. It is clearly Orange.
  *   **The Dependency:** You cannot introduce Epistemicism or Supervaluationism until they admit that **logic + true premises + clear steps = a false conclusion.**
  *   **Why:** If they think "Well, obviously there's a point where it stops being red," they are already Epistemicists and won't see the need for Supervaluationism. You must force them to admit that *no specific point* seems like the right cut-off.

  **Manage the "Social Construction" Derailer here:**
  When he says "Red is just a construct," agree with him instantly and move on. "Absolutely. But this community *uses* the construct. Given that we use it, does it have a sharp edge?" Do not let him deconstruct the concept; force him to analyze the *application* of the concept.

  ### 2. The One Case: The "Robot Executor"
  Your "Rich Villager" idea is the right carrier, but you need to harden it against the "fairness" and "intent" objections.

  **The Setup:**
  *   **The Village:** 200 people.
  *   **The Data:** Everyone's income is public, known to the penny. No hidden assets. (This kills Dave's "we need more data" argument immediately).
  *   **The Rule:** The Will says: "Distribute the estate equally among all **rich** villagers."
  *   **The Enforcer:** The Executor is not a human judge. It is a **strict algorithm** (or a literal robot). It does not care about fairness. It does not care about the dead man's spirit. It only cares about whether the sentence "Person X is rich" is **True** or **False**.

  **What it must have:**
  *   **A Borderline Case:** You need a specific person, let's call him "Bob," who earns exactly the amount that makes the group hesitate. (e.g., Most people say $100k is rich, $20k is not, Bob makes $84,500).
  *   **Binary Stakes:** The robot *must* pay Bob or *must not* pay Bob. It cannot say "sort of."

  **What it must NOT have:**
  *   **No "Intent":** Do not let them argue what the benefactor *meant*. The words are the law.
  *   **No "Fairness":** If they say "But Bob needs the money!", stop them. "We are asking if the sentence is true, not if the outcome is nice."
  *   **No "Context":** Ensure the context is fixed. This isn't "rich for a student" vs "rich for a banker." It is "rich for a villager in this village."

  **Why this works:** It isolates **Vagueness** from **Ambiguity**. Ambiguity is "Bank" (river vs money). Vagueness is "Rich" (where the line is). The Robot forces them to see that the world is precise (income to the penny), but the *word* is not.

  ### 3. Misconceptions: Order of Operations
  You must kill these in a specific sequence, or they will infect the next section.

  **1. "It's just Ambiguity / Context" (The Social Construction Guy)**
  *   **When:** During the Setup.
  *   **The Kill:** "Ambiguity means the word has two distinct meanings (like 'bat'). Vagueness means the meaning is clear but the boundary is fuzzy. We all know what 'rich' means. We just don't know where it stops. We are solving the boundary problem, not the definition problem."

  **2. "We just lack data" (Dave's View / Naive Epistemicism)**
  *   **When:** Before introducing Philosophical Epistemicism.
  *   **The Kill:** Remind them of the Robot Case. "We have all the income data. There are no hidden bank accounts. The missing information is not in the *world*, it's in the *meaning*."
  *   **Distinction:** Dave thinks ignorance is *temporary* (we could find out). Epistemicism says ignorance is *permanent* (there is a fact, but we can never know it).

  **3. "Just stipulate a cut-off" (The Pragmatist Objection)**
  *   **When:** This will come up when you introduce Supervaluationism. They will say, "Why don't we just vote? Let's say $85k is the line."
  *   **The Kill:** This is the hardest one. You need to distinguish **Solving the Practical Problem** from **Solving the Truth Problem**.
      *   *Say:* "If we vote to set the line at $85k, we have changed the law. We haven't interpreted the old one. We have replaced the vague word 'rich' with the precise phrase 'earns over $85k'."
      *   *The Collapse:* Why doesn't this collapse Supervaluationism? Because Supervaluationism says the truth is what holds across *all* acceptable stipulations, not just *one*.
      *   *Analogy:* "Stipulating a line is like drawing a border on a map. Epistemicism says the border is already there, hidden in the fog. Supervaluationism says the terrain is real, but the border is something we draw, and a statement is only 'True' if it's on the right side of *every reasonable* border we could draw."

  **4. "Both views end up saying 'we can't tell'" (The Equivalence Charge)**
  *   **When:** In the comparison phase.
  *   **The Kill:** Focus on the **Borderline Case (Bob)**.
      *   *Epistemicism:* The Robot *is* either right or wrong to pay Bob. We just don't know which. There is a fact of the matter.
      *   *Supervaluationism:* The Robot is neither right nor wrong. The sentence "Bob is rich" has no truth value. It is a gap.
      *   *Why it matters:* One view says reality is sharp (Epistemic); the other says language is gappy (Supervaluation).

  ### 4. What to Skip (The "Do Not Cross" Line)
  You are absolutely right to cut Higher-Order Vagueness.
  *   **Skip:** "Is the boundary of 'rich' vague?" (Higher-order vagueness).
  *   **Skip:** Formal logic symbols ($\neg$, $\forall$, $\Delta$).
  *   **Skip:** The "Definiteness Operator." Instead of saying "It is definitely true that...", say "It is clearly the case that..."
  *   **Skip:** Specific arguments against the views (e.g., The "Argument from Intuition" against Epistemicism). Just present the views as tools.
  *   **Reason:** If you introduce higher-order vagueness, the group will spiral into "Well, where is the boundary of the boundary?" and you will run out of time.

  ### 5. The Closing Activity: "The Judge's Ruling"
  This needs to happen in the last 10-15 minutes. It must force them to choose a metaphysical commitment, not just a practical one.

  **The Setup:**
  Return to Bob (the borderline villager). The Robot Executor has broken down. A human Judge has to make the final ruling. She rules that Bob is **not** rich and denies him the money.

  **The Task:**
  Hand out small slips of paper. Ask them to write one sentence answering this question:
  *"Did the Judge **discover** that Bob wasn't rich, or did she **decide** that Bob wasn't rich?"*

  **The Reveal:**
  *   **Epistemicists** must say: "She discovered it." (Even if she guessed, there was a fact out there).
  *   **Supervaluationists** must say: "She decided it." (She precisified the term).

  **The Dave-Setter:**
  Ask Dave (or the group): "If the Judge discovered it, could she have been wrong?"
  *   If they say **Yes**: They are Epistemicists. (There is a truth she missed).
  *   If they say **No**: They are Supervaluationists (or Relativists). (Her ruling *makes* it true).

  **Why this settles it:**
  Dave's position is that the cut-off exists independently of us. This activity forces him to admit that if he's right, the Judge is subject to a truth she can't access. If he says "No, she makes it true," he has abandoned Epistemicism. It creates a clear binary choice that exposes the metaphysical difference, moving beyond "we just don't know."

  ### Session Flow (90 Minutes)

  1.  **00-15:** **The Color Trap.** Get them to admit the Sorites paradox is real. (Prerequisites).
  2.  **15-35:** **The Robot Executor.** Introduce the Village Case. Establish the data is perfect. Establish the decision must be binary. (The Carrier).
  3.  **35-55:** **View 1: The Hidden Line (Epistemicism).** Explain that the line exists like a hidden wire in the wall. We might cut it, but the wire is there. (Address Dave's "more data" point here).
  4.  **55-75:** **View 2: The Cloud of Lines (Supervaluationism).** Explain that there are many *acceptable* lines. Truth is what survives all of them. (Address the "Just stipulate" point here).
  5.  **75-90:** **The Judge's Ruling.** Written activity + Discussion. (Assessment).

  **Final Advice for the "Stipulation" Question:**
  If someone presses you on why Supervaluationism isn't just "pick a line," use the **Penumbra** analogy.
  *   "Stipulating a line is like turning on a light in a dark room. Epistemicism says the furniture was already there in the dark. Supervaluationism says the furniture only becomes 'visible' (true/false) when the light hits it. But Supervaluationism adds: There are many ways to shine the light. If the furniture is visible from *every* angle, it's Super-True. If it's in the shadow of *every* angle, it's Super-False. If it depends on where you stand, it's Indeterminate."

  Good luck. Don't let Dave win.
