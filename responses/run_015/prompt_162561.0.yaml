  You've put the dilemma sharply, but I shall resist both horns. The error lies in conflating predictive utility with ontological sufficiency. That we can successfully adopt the intentional stance towards a system does not entail that the system possesses genuine propositional attitudes; it merely entails that the system is sufficiently complex to mimic the outputs of such attitudes. I concede that FP is autonomous from neuroscience in the sense that we don't need to know the weights to predict the LLM's behaviour, but autonomy does not guarantee truth. My claim is that beliefs are causally efficacious states defined by their functional role within a broader cognitive architecture—one that integrates perception, action, and homeostatic need. It is contested, naturally, precisely what functional architecture is required for genuine intentionality, but on my view, the LLM lacks the requisite causal integration between its 'representations' and its survival conditions. It simulates the shadow of belief without the substance that casts it.

  Now, to your point about cheapness. You ask why our own training isn't equally vacuous. The distinction rests on the nature of the corrective feedback. When a child is corrected for believing the stove is cold, the feedback is grounded in non-linguistic reality—pain, failure to achieve goals, physical constraint. The LLM is corrected solely for statistical deviation from a corpus of human text. I must flag that relying on this 'world-involving' constraint is a partisan move among naturalists, some of whom argue semantics is internal to the system, but it is my best shot at preserving the realism you seek to undermine. Our beliefs are answerable to the world because our actions have worldly consequences; the model's 'beliefs' are answerable only to the distribution of tokens. Thus, FP succeeds on the model because it is a simulator of believers, whereas FP succeeds on us because we are believers. The predictive success is real in both cases, but the explanatory truth is not.
