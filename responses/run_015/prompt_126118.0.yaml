answer: |-
  Here is a 90-minute seminar plan designed to move your students from stereotype to structural analysis.

  ### 1. The Dependency Order (What must land first)
  You cannot introduce the "Inversion" until you have decoupled **Rule-Following** from **Obedience**.

  If you start with the Inversion, students will hear: *"Germans follow unwritten rules; Americans follow written ones."* They will immediately map this onto their existing bias: *"Germans are rigid/obedient; Americans are literal/contractual."* The nuance is lost.

  **The Critical Sequence:**
  1.  **Legitimacy Source:** Establish that *both* cultures feel a moral "ought," but they locate the authority differently (Text vs. Context).
  2.  **The "Trap" vs. The "Duty":** Establish that Americans view written rules as *boundaries of liability* (how close can I get without getting caught?), while Germans view unwritten norms as *standards of correctness* (what is the proper way to do this?).
  3.  **The Inversion:** Only now can you show that the "harder" obligation flips depending on the culture.

  **Where to head off the misconception:**
  *   **Misconception:** "Germans are obedient automatons; Americans are rule-bending individualists."
  *   **Intervention Point:** **Minute 15 (End of Phase 1).**
  *   **How:** Do not lecture this. Ask: *"Has anyone ever been told by a German colleague that you did something 'not done' (nicht gemacht), even though it wasn't forbidden?"* vs *"Has anyone ever heard an American say 'It's not against the rules' as a full moral defense?"*
  *   **Goal:** Prove that Germans break written rules to uphold unwritten order, and Americans uphold written rules to violate unwritten expectations. This kills the "Obedient vs. Rebellious" frame before it sticks.

  ### 2. The Carrying Example: Composting Ordinance
  Your composting example is viable, but **"Color-coding" is too weak.** It sounds aesthetic. For the Inversion to hold, the unwritten norm must feel like a *procedural necessity*, not a preference.

  **What's wrong with it:**
  If the rule is "Weigh waste" (Written) and the norm is "Color-code bins" (Unwritten), a student will argue the Color is just decoration. It doesn't carry moral weight.

  **What it needs to have:**
  The unwritten norm must be about **Systemic Integrity**, while the written rule is about **Record Keeping**.
  *   **Written Rule:** "Log the weight of organic waste."
  *   **Unwritten Norm:** "Rinse the bins and separate by texture (e.g., no meat scraps in green)."
  *   **The Conflict:** A resident logs the weight perfectly (satisfying the Written Rule) but puts meat scraps in the green bin (violating the Unwritten Norm of sorting).

  **The Teaching Move:**
  *   **American Frame:** "I followed the ordinance. I logged the weight. The sign didn't say 'No Meat'." (The written rule is the boundary; the rest is suggestion).
  *   **German Frame:** "You have contaminated the compost. The log is irrelevant if the material is wrong." (The unwritten norm of *Ordnung*/correctness is the hard obligation; the log is just bureaucracy).

  **Refinement:** Change "Color-coding" to **"Sorting Logic."** It makes the unwritten norm about *correctness*, not style.

  ### 3. The Teaching Plan (90 Minutes)

  **Phase 1: Phenomenology of the "Ought" (20 mins)**
  *   **Activity:** "The Queue." Ask students to describe the moral feeling of cutting in line.
  *   **Pivot:** Ask if there was a sign saying "Wait Here." (Usually no).
  *   **Point:** We feel obligation without text. This is *Folk Morality*.
  *   **Stereotype Bust (Min 15):** Ask for examples where following the *written* rule was considered rude or wrong. (e.g., Showing a contract to a friend).
  *   **Goal:** Establish that *both* cultures have two layers (Text & Norm), but they trust them differently.

  **Phase 2: The Composting Case Study (30 mins)**
  *   **Setup:** Present the refined scenario (Weight Log = Written; Sorting/Rinsing = Unwritten).
  *   **Group Work:** Split room. Group A argues the "Compliant Resident" (American frame). Group B argues the "Angry Neighbor" (German frame).
  *   **Task:** They must write the *justification* for their side, not just the verdict.
      *   *Group A:* Why is the resident technically right? (Focus on liability/contract).
      *   *Group B:* Why is the resident fundamentally wrong? (Focus on system integrity/duty).
  *   **Debrief:** Highlight the vocabulary. Group A uses "Compliant/Allowed." Group B uses "Proper/Correct."

  **Phase 3: Formalizing the Inversion (25 mins)**
  *   **Lecture (Mini):** Introduce your "Inversion Problem."
      *   **US:** Written = Hard Boundary (Trap to navigate). Unwritten = Soft Suggestion.
      *   **DE:** Written = Minimum Baseline. Unwritten = Hard Obligation (The "Real" Rule).
  *   **Discussion:** Why does this create friction in joint ventures? (e.g., A German boss sees an American employee following the manual as "lazy"; American sees German boss's expectations as "micromanagement/unwritten").

  **Phase 4: The Check Question (15 mins)**
  *   **Do not ask them to define the Inversion.** Ask them to apply it to a new context.
  *   **The Scenario:** "A company handbook states work hours are 09:00–17:00. There is no policy on breaks.
      *   **Context A (Berlin):** The team norm is to take a 30-min sit-down lunch together at 13:00.
      *   **Context B (Chicago):** The team norm is to eat at your desk whenever you can.
      *   **The Violation:** An employee leaves at 17:05 every day but skips lunch entirely to maximize output."
  *   **The Question:** "In which context is this employee likely to be socially sanctioned (not fired, but *shamed*), and **what is the specific source of the violation**?"
  *   **Correct Answer:**
      *   **Berlin:** Sanctioned. Source: Violation of the *unwritten* social norm (communal lunch/balance), despite adhering to the *written* hours.
      *   **Chicago:** Not sanctioned (or praised). Source: Adherence to *written* output/hours; unwritten norm is irrelevant.
  *   **Why this works:** If they say "Germans care about time," they fail. They must identify that the German sanction comes from the *unwritten* norm, even though the written rule was followed.

  ### 4. What to Drop (Be Honest)
  **Drop the Historical/Psychological Etiology.**
  Do not spend time explaining *why* this exists (Prussian bureaucracy vs. Frontier individualism, Lutheran internalization vs. Legalistic adversarialism).
  *   **Reason:** It eats 20 minutes, invites essentialism ("Germans are just like that"), and is historically debatable.
  *   **Focus:** Stick to the **Phenomenology**. How does the rule *feel* to the actor? How is the justification *articulated*?
  *   **Risk:** If you explain the history, students will treat the Inversion as a fixed cultural trait rather than a bureaucratic friction point they can navigate. Keep it functional.

  ### 5. Summary of Dependencies
  1.  **Define Folk Morality** (Unwritten obligations exist everywhere).
  2.  **Bust Stereotype** (Germans aren't just "more obedient").
  3.  **Run Case** (Composting/Sorting).
  4.  **Reveal Inversion** (Source of authority flips).
  5.  **Check** (Apply to Work Hours scenario).

  If you try to explain the Inversion before they feel the tension in the Composting case, it will sound like a stereotype. The case must generate the friction first; the theory just names it.
