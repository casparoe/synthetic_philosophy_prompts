answer: |-
  Elena manages the only water purification plant in a drought-stricken region, facing a one-season emergency contract where she must choose between two filter protocols to maximize potable output (kiloliters), a unit where her marginal value is strictly flat because every liter is sold at a fixed price to the state with zero marginal cost up to capacity. This is a singleton decision; the drought is a unique climatic event, the contract is non-renewable, and she has no other plants to smooth this variance, so long-run averaging is impossible. She exhibits local risk-neutrality over sure outcomes: she is indifferent between a guaranteed 50 kiloliters and a 50/50 gamble of 40 or 60, and indifferent between a guaranteed 80 and a 50/50 of 70 or 90, pinning her utility function as linear ($u(x)=x$). Protocol A (Aggressive) yields 10 kiloliters with 20% probability (clog risk) and 100 kiloliters with 80% probability; Protocol B (Conservative) yields 70 kiloliters with 50% probability and 80 kiloliters with 50% probability. Neither option is risk-free, but A has higher variance and higher expectation, while B compresses the range.

  | Outcome (kL) | Protocol A Prob | Protocol B Prob |
  | :--- | :--- | :--- |
  | **10** | 0.2 | 0.0 |
  | **70** | 0.0 | 0.5 |
  | **80** | 0.0 | 0.5 |
  | **100** | 0.8 | 0.0 |

  **Arithmetic:**
  With $u(x)=x$, **EU(A)** = $0.2(10) + 0.8(100) = 82$. **EU(B)** = $0.5(70) + 0.5(80) = 75$. **EU prefers A.**
  With risk-weighting function $r(p) = p^2$ (capturing caution):
  **REU(A)** = $[1-r(0.8)]u(10) + [r(0.8)]u(100) = (1-0.64)(10) + 0.64(100) = 3.6 + 64 = 67.6$.
  **REU(B)** = $[1-r(0.5)]u(70) + [r(0.5)]u(80) = (1-0.25)(70) + 0.25(80) = 52.5 + 20 = 72.5$.
  **REU prefers B.**

  **The Contradiction:** For EU to prefer B, $u$ must be sufficiently concave to overcome the 7-point expectation gap. If we normalize $u(10)=10, u(100)=100$, EU requires $0.5u(70)+0.5u(80) > 82$. A function like $u(x)=\sqrt{x}$ achieves this (EU(B)≈8.65 > EU(A)≈8.63), but this concavity contradicts her sure-thing attitudes: with $u(x)=\sqrt{x}$, she would strictly prefer the guaranteed 50 over the 40/60 gamble ($7.07 > 7.03$), yet she is indifferent. EU cannot match her choice without contradicting her local risk-neutrality.

  **Structural Feature:** The reversal turns on the **non-linear weighting of cumulative probability mass**. REU penalizes the 20% chance of the worst outcome in A more heavily than EU does because $r$ is convex, shifting value from the high-probability best outcome to the low-probability worst outcome disproportionately.

  **Ablation:**
  1.  **Flatten $r$ (set $r(p)=p$), keep $u$ linear:** REU collapses to EU. Value(A)=82, Value(B)=75. **Reversal dies.**
  2.  **Flatten $u$ (keep $u$ linear), keep $r$ convex:** This is the baseline case above. Value(A)=67.6, Value(B)=72.5. **Reversal holds.**
  The reversal is driven entirely by $r$, not $u$. This proves the case is not "risk aversion re-described" via utility curvature, but a distinct attitude toward probability structure.

  **EU Defender's Objection:** "Your $r$ function is just a utility function wearing a hat. Normatively, risk attitude *is* outcome valuation. If she truly prefers B, her utility for 10 must be lower than you measured, and your 'sure-thing' tests were flawed or context-dependent."

  **Evaluation:** This lands only if one insists that all risk attitudes must be reducible to outcome valuation. However, it fails empirically here: we *independently pinned* $u$ via small-stakes sure-thing indifferences where probability weighting is irrelevant (50/50 splits cancel out in REU just as they do in EU). Since $u$ is fixed by those local judgments, $r$ is required to explain the global preference. The separation is not just mathematical; it tracks distinct psychological inputs (value of water vs. tolerance for clog risk).
