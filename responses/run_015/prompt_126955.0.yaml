  1. **The Question**
  At noon today, a billionaire offers you $1 million if at midnight tonight you intend to drink a specific vial at noon tomorrow. The vial causes violent illness for one day with no lasting effects. The money is wired at 12:01 am tomorrow regardless of whether you actually drink. Drinking yields no further payoff. You face two complications. First, the vial you receive tomorrow is drawn randomly from a batch of ten; one is a harmless placebo. You cannot identify it beforehand. Tonight, you are confident but not certain that drinking will make you ill. Second, at 11 am tomorrow, after the money is secured, a second billionaire will offer you $5,000 cash to return the vial unopened. You know tonight this offer will occur. The second billionaire's offer is guaranteed; you have verified their credibility. Thus, at 11 am, you will have a decisive reason to return the vial rather than drink it. You are fully aware of all these facts at midnight when you must form the intention.

  Many students attempt to solve Kavka-style puzzles using Evidential Decision Theory or by comparing them to Newcomb's Problem. Do not do this. The issue here is not which act maximizes expected utility given a fixed decision theory, but whether the relevant mental state is available to a rational agent at all. Your answers should focus on the conditions for intending and the reasons required to sustain that state. You must address how the specific complications alter the rational landscape compared to the original puzzle. Recall the standard view that intending to A entails believing you will A. If you argue otherwise, you must defend the alternative view.

  Answer the following:
  1. Can you rationally form the required intention tonight? Explain using the relationship between intention and belief about future action. (4 marks)
  2. Does complication (a) (the placebo) make intending easier by reducing certainty of harm? Does complication (b) (the buyback) make it harder by adding a reason not to drink? Identify which obstacle is decisive. (4 marks)
  3. Suppose you could pay $100 to be hypnotized into genuinely intending to drink. Does this bypass the puzzle? What does this imply about whether the constraint is psychological or normative? (4 marks)
  4. Is Kavka's puzzle fundamentally a claim about the psychology of intention, the structure of practical reasons, or both? Justify your classification. (4 marks)
  5. Does this problem generalize to prizes for genuinely 'wanting' to drink or 'being the sort of person' who would drink? Explain why intention might be distinct from these states. (4 marks)

  2. **Model Answer**
  The central obstacle to forming the intention is the knowledge that one will not drink. Standard accounts of intention, following Bratman and Kavka, posit that intending to A entails believing one will A. At midnight, the agent knows the money is secured regardless of drinking. Furthermore, drinking incurs illness with no compensatory benefit. Crucially, complication (b) ensures that tomorrow at 11 am, the agent will have a decisive financial reason ($5,000) to return the vial rather than drink it. Since the agent knows tonight that they will be rational tomorrow, they know tonight that they will not drink at noon. Therefore, they cannot believe they will drink, and thus cannot intend to drink. The puzzle remains intact because the reward for intending is disconnected from the act of drinking. The intention is bootstrapped: you need the intention to get the money, but you need a reason to drink to form the intention, and the money doesn't count as a reason to drink. This is the core of the irrationality.

  Complication (a), the placebo, does not resolve the puzzle. While it introduces uncertainty (10% chance of no illness), it does not provide a positive reason to drink. Intention requires belief that one *will* act, not merely that one *might*. A 90% credence that one will not drink is incompatible with the belief condition for intention. Some might argue that partial belief suffices, but standard views require a threshold of confidence that the uncertainty undermines. Moreover, complication (b) is the decisive obstacle. Even if the vial were certainly poisonous, the buyback offer creates a new, overriding reason not to drink tomorrow. This reinforces the belief that one will not drink, making the intention even less stable than in the original case. The buyback ensures that future selves have no incentive to follow through, cementing the present inability to intend. It removes even the slim hope that one might drink out of stubbornness or error. The placebo is a red herring; the buyback is the lock.

  Regarding hypnosis (Q3), paying to be hypnotized bypasses the rational constraint but highlights the puzzle's normative core. If hypnosis successfully induces the mental state of intention, it shows the barrier is not purely causal impossibility. However, if the intention is induced non-rationally (via causation rather than reasons), it may not count as a genuine intention of a rational agent. This suggests the puzzle is not merely about psychological capacity but about the norms governing rational agency. One can be caused to intend, but one cannot rationally intend without reasons. Thus, hypnosis solves the psychological availability but fails to satisfy the normative conditions for rational intention. It turns the agent into a vessel for a state they do not endorse via reasoning. The puzzle persists for the rational agent even if the human organism can be manipulated.

  In the original Kavka case, the obstacle was simply the lack of a reason to drink once the money was secured. Here, complication (b) actively adds a reason *not* to drink. This strengthens the belief that one will not drink, making the intention even harder to form than in the original. It prevents the 'weakness of will' loophole where one might intend hoping to fail later. The buyback makes rational failure impossible. This variant clarifies that the puzzle is not about uncertainty regarding one's own rationality, but about the structural link between reason and intention. Consequently, the puzzle is about both psychology and reasons (Q4). It claims that the psychology of intention is constrained by the structure of practical reasons. A rational agent cannot psychologically sustain an intention that contradicts their beliefs about what they have reason to do. The impossibility is not logical but agential: it is impossible for a rational agent to occupy this state. This distinguishes the puzzle from mere logical contradictions; it is a claim about the architecture of rational minds. If it were only psychology, hypnosis would solve it completely. If it were only reasons, psychology wouldn't matter. The intersection is where the puzzle lives. It shows that rational agency has structural limits.

  Finally, the problem does not fully generalize to 'wanting' or 'character' (Q5). Wants are often involuntary and not subject to the same belief constraints as intentions. One can want something one believes one will not do. Similarly, being the 'sort of person' who drinks is a dispositional trait, not a specific commitment to act. Intention is distinct because it is a commitment to act that guides reasoning and requires consistency with belief. Prizes for wants or character avoid the toxin puzzle because those states do not entail beliefs about future action in the same way. They are not forward-looking commitments in the same sense. You can want to fly even knowing you cannot. Lastly, Evidential Decision Theory (EDT) is irrelevant here. EDT advises on acts based on their evidential value. Here, the reward is fixed by midnight based on the state of intention, not the act. The problem is not choosing an act to maximize utility, but whether the prerequisite state (intention) is accessible. EDT cannot generate reasons to intend where none exist; it only evaluates acts given intentions. Thus, appealing to EDT dissolves nothing regarding the availability of the intention itself. It mistakes the condition of the reward for the consequence of the act. The student must see that the intention is the bottleneck, not the calculation. Ultimately, the variant confirms that intention is not a tool for securing rewards disconnected from action. It is a state embedded in a network of reasons and beliefs. To treat it otherwise is to misunderstand the nature of agency.

  3. **Marking Scheme**
  *   **Intention-Belief Link (4 marks):** Must state intention entails belief one will act; A answers explain why the buyback destroys this belief, B answers merely state the link without applying it to the buyback.
  *   **Variant Analysis (4 marks):** Must identify buyback as decisive over placebo; A answers explain why uncertainty doesn't suffice for belief, B answers treat placebo as a significant solution.
  *   **Hypnosis/Normativity (4 marks):** Must distinguish causal induction from rational endorsement; A answers link this to the normative constraint, B answers treat hypnosis as a full solution.
  *   **Psychology vs. Reasons (4 marks):** Must argue it is both (norms constrain psychology); A answers explain the 'agential impossibility', B answers pick one side exclusively.
  *   **Generalization (4 marks):** Must distinguish intention from wants/character via belief/commitment; A answers note the lack of belief constraint in wants, B answers claim generalization holds.

  4. **Specific Mistakes**
  *   **Invoking EDT:** Students use EDT to argue intending is rational; this misses the point that the state itself is unavailable.
  *   **Placebo Focus:** Students argue the 10% chance allows intention; this ignores the high credence required for intention.
  *   **Hypnosis Success:** Students claim hypnosis solves the puzzle fully; this ignores the normative requirement for rational intention.
  *   **Generalization Error:** Students claim wants are identical to intentions; this ignores the involuntarity of wants.
  *   **Reason Confusion:** Students claim the million dollars is a reason to drink; this contradicts the setup where money is secured regardless.

  5. **Orthodoxy vs. Contestation**
  *   **Safe:** The claim that standard views require intention to entail belief about future action is orthodox (Bratman/Kavka).
  *   **Contested:** The claim that hypnosis-induced states are not genuine intentions is debated by naturalists about mental states.
  *   **Safe:** The irrelevance of EDT to the availability of the intention state is widely accepted in this literature.
  *   **Contested:** The claim that wants lack belief constraints is contested by some cognitivists about desire.
  *   **Safe:** The view that the buyback strengthens the impossibility is orthodox given the standard rationality assumptions.
