answer: |-
  The practice presupposes not that patients infallibly access private pain objects, but that their reports function as the primary regulatory signal for care, authoritative only when stable against conflicting behavioral and physiological data.

  Three candidate presuppositions compete here. First, Infallible Introspection assumes reports mirror inner states perfectly, ruled out by heuristic bias and machine adjustment. Second, Epistemic Fallibilism grants patients primary access but admits error, fitting dosing but struggling with machine override. Third, Social Negotiation treats pain as institutional status, fitting averaging but undermining legal authority. A distinguishing case arises if a patient refuses adjustment despite machine data: if dosing stops, the view is functional; if dosing continues, it is epistemic. I commit to Regulative Functionalism: the report is a control signal, not a truth-claim.

  The narrowest thesis is that pain reports are action-guiding assertions rather than descriptive truths. We need not believe the patient feels exactly a "6" in a metaphysical sense; we need only believe the report is the most reliable lever for minimizing suffering and optimizing care. Stronger theses—that pain is a private qualia or introspection is transparent—are unnecessary. If we drop the metaphysics of private objects, the practice survives as long as the report correlates with needed intervention. The epistemology is pragmatic: truth is what stabilizes treatment.

  Both the transparent-readout view and the interface view license current protocols, leaving the metaphysics underdetermined. Under the readout view, the machine corrects error in transmission; under the interface view, the machine recalibrates the user interface. The interface view supports a deflated first-person authority: the user knows their needs better than the admin, but the user interface can be buggy or hacked. This deflated authority is sufficient because the goal is care coordination, not metaphysical accuracy. The patient is the admin of their own body, but the dashboard can be recalibrated.

  On the interface view, the monitor measures nociceptive input (backend data), while the patient reports the user-interface output (pain). Averaging is not incoherent; it is a sanity check between backend logs and frontend display. If the frontend displays "Critical Error" while backend logs show "Normal Operation," the system is malfunctioning. Displaying the backend score to the user patches the interface. Averaging is the right thing to do because it smooths the calibration between physiological reality and experienced urgency, preventing both undertreatment and nocebo amplification.

  If the interface view is explicitly adopted, tort law must shift from compensating "suffering" to compensating "care mismatches." Retrospective ratings lose authority because the interface is known to compress data; legal damages would rely more on treatment logs than patient memory. Hospital protocol would stop treating the number as sacred truth and start treating it as a variable to be calibrated. Patients who refuse recalibration might be flagged for psychological support rather than higher doses. The cost is trust: patients may feel gaslit if told their dashboard is wrong, requiring transparency that the number is a tool, not a testimony.
