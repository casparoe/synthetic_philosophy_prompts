  This is the view you have already identified and rightly rejected. Karl Popper defined the verisimilitude of a theory in terms of its **truth-content** and **falsity-content**. Roughly, Theory A is closer to the truth than Theory B if A entails more true consequences and no more false consequences than B (or vice versa).

  *   **Why it fits:** It attempts to formalize "closeness" using logical tools available at the time. It handles the "beans" case well enough if treated numerically.
  *   **What's wrong with it:** As you suspected, this account collapses. In 1974, Pavel Tichý and David Miller independently proved that for any two false theories, Popper's definition implies that neither is closer to the truth than the other, or it yields absurd results.
  *   **The specific failure:** Your example of the "circle with radius 1 AU" is a perfect illustration of the Tichý/Miller proof. By adding a specific detail (radius = 1), you increase the *content* of the claim. You gain some true consequences (the radius is indeed near 1) but you inevitably gain false ones too (the radius is not *exactly* 1, the orbit is not *exactly* circular). Popper's math cannot weigh the "true bits" against the "false bits" to give a net score. It treats all consequences as equal weight. Consequently, it cannot capture your intuition that the circle is a "smaller error" than the parabola, because logically, both are simply *false* with infinite false consequences.

  ### Candidate 2: The Similarity Account (The Distance Account)

  This is the leading modern successor to Popper's project, developed primarily by Ilkka Niiniluoto and Graham Oddie. Instead of counting consequences, this account measures the **distance** between the theory's description of the world and the actual world within a "logical space" or state space.

  *   **Why it fits:** This matches your "cost of repair" intuition almost exactly. In this framework, propositions are treated as regions in a space of possibilities. The "closeness" is the geometric or logical distance between the region the theory picks out and the point that is actually true.
      *   *The Beans:* The distance is simply numerical (|900 - 940| vs |2000 - 940|).
      *   *The Orbit:* The space is defined by parameters like eccentricity. A circle has eccentricity 0; an ellipse has eccentricity > 0. A parabola has eccentricity 1. The distance from 0 to 0.01 (ellipse) is tiny; the distance from 0 to 1 (parabola) is large. The "repair cost" is the magnitude of the parameter shift required to hit the truth.
  *   **What's wrong with it:** The primary vulnerability is **language dependence**. Distance depends on how you carve up the world. If you describe the orbit using "circularity" as a parameter, the circle is close. If you describe it using a complex polynomial that happens to equal zero for circles but varies wildly for ellipses, the distance metric changes. There is no agreed-upon "privileged language" to measure distance in. Additionally, it struggles when theories are **incommensurable** (using entirely different vocabularies, e.g., phlogiston vs. oxygen), making "distance" hard to define.

  ### Candidate 3: Idealization and Concretization (The Poznań School)

  This approach, associated with Leszek Nowak and the Poznań School of methodology, focuses less on a static metric and more on the **process** of theory change. It views scientific laws as **idealizations** (e.g., "assuming no friction," "assuming circular orbit") that are strictly false but serve as starting points. Science progresses via **concretization**: the step-by-step removal of idealizing assumptions (the "repair") to make the law more factual.

  *   **Why it fits:** This captures your "repair" metaphor literally. The circle isn't just "close"; it is an *idealization* of the ellipse. The "cost of repair" is the number of idealizing conditions you must remove or modify to get the true law. It explains why you feel the circle is "better" than the parabola: the circle is the *limit case* of the ellipse, whereas the parabola is a different structural category.
  *   **What's wrong with it:** It is primarily a theory of **theory change** and methodology, not a static measure of **truthlikeness**. It tells you how to move from false to true, but it doesn't provide a general metric for comparing any two arbitrary false claims (like the bean guesses) unless they are part of the same idealization sequence. It is also less prominent in Anglo-American analytic philosophy than the Similarity Account, so you may find fewer resources on it in popular texts.

  ### Commitment and Analysis

  The "real article" for your intuition is **Truthlikeness** (specifically under the **Similarity Account**).

  Your notion of "closeness-understood-as-cost-of-repair" does not have a unique, single-word label distinct from the broader project, but it is the core intuition behind the **Similarity Account of Truthlikeness**. Popper's version is the **Content Account**. When philosophers speak of "truthlikeness" today, they almost invariably mean the Similarity Account, because the Content Account is known to be defunct.

  **What exactly is the repair-cost notion?**
  Technically, it is **Logical Distance**. Imagine all possible worlds as points in a vast space. The truth is one point. A theory identifies a region of that space. The "truthlikeness" of the theory is inversely proportional to the distance between its region and the truth point. Your "repair cost" is the minimum edit distance required to move the theory's region to cover the truth point. Changing a parameter (eccentricity) is a small edit; changing the functional form (parabola to ellipse) is a large edit.

  **How it comes apart from the other two:**
  1.  **Vs. Popper (Content):** Popper counts *how many* sentences are true/false. Similarity weighs *how much* the world described differs from the actual world. Popper sees "Circle" and "Parabola" as equally false (both have infinite false consequences). Similarity sees "Circle" as physically nearer to "Ellipse" than "Parabola" is.
  2.  **Vs. Idealization:** Idealization is about the *history* of the theory (was it derived by simplifying a complex truth?). Truthlikeness is about the *current status* (how far is it from the truth now?). You can have a theory that is close to the truth (high truthlikeness) without knowing if it was derived via idealization.

  **Where does repair-cost (Truthlikeness) break down?**
  1.  **Language Dependence:** As mentioned, if I define a new property `Grueness` that is true for circles and false for ellipses, I can make the circle look "far" from the truth in `Grueness`-space. There is no consensus on how to fix the "metric" of logical space objectively.
  2.  **Incommensurability:** If one theory says "orbits are circles" and another says "orbits are vibrations of strings," there is no shared parameter space to measure the distance. The "repair cost" becomes undefined because you cannot edit one claim into the other; you must replace the vocabulary entirely.
  3.  **Multiple Repairs:** You noted this: "when there are several equally cheap repairs." If the truth is an ellipse, and I claim it's a circle, I can repair it by adjusting eccentricity. But if I claim "The orbit is a square," is the repair to round the corners (small edit) or switch to conic sections (large edit)? The Similarity Account requires a predefined "weighting" of features (is shape more important than size?) which is often subjective.

  ### Conclusion

  Your intuition is the standard pre-theoretic grip on **Truthlikeness**. The "consequence-counting" version is the historical dead end (Popper). The "repair-cost" version is the living research programme (Niiniluoto/Oddie). While "repair cost" itself isn't the technical term, it is the precise informal description of **Logical Distance** within the **Similarity Account**.

