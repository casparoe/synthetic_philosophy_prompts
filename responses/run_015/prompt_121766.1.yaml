      *   **Specific Task:** Two-directional mapping of the trial participants (Darrow, Bryan, Jury, Experts) regarding "movable empirical claims" vs. "unmoving hinge certainties."
      *   **Specific Analysis:** Evaluate Darrow's cross-examination of Bryan (contradiction vs. incommensurability).
      *   **Value Add:** Explain what hinge epistemology captures that standard narratives miss (specifically regarding the feeling that evidence wouldn't settle the dispute).
      *   **Limitations:** Explicitly state where the framework breaks down (pedagogical/legal stakes, institutional dominance).
      *   **New Distinction:** Apply the user's proposed distinction between *Vertical Hinges* (ontological/cosmological certainties) and *Horizontal Hinges* (methodological/authoritarian/social certainties).
      *   **Critical Evaluation:** Assess whether the conflict was primarily Vertical or Horizontal, and critique the distinction/Wittgenstein where it fails to explain resolution or dominance.
      *   **Tone:** Graduate seminar level (rigorous, analytical, precise).

  2.  **Initial Brainstorming & Mapping:**

      *   *Wittgenstein's Hinge Propositions:* Certainties that are not justified by evidence but make justification possible. "The earth existed long before my birth," "I have two hands." To doubt them is to step outside the language game.
      *   *Scopes Trial Context:* State of Tennessee vs. John Scopes. Teaching evolution vs. Biblical creation.
      *   *The "Vertical" Hinges:*
          *   Creationist Side: The Bible is the literal Word of God. Genesis 1 is historical fact. Man is specially created.
          *   Evolutionist Side: Natural laws are uniform. Deep time is real. Biological complexity arises via natural selection.
      *   *The "Horizontal" Hinges:*
          *   Creationist Side: Democratic majority (legislature) has the right to dictate curriculum. Religious authority supersedes scientific authority in moral/origins matters.
          *   Evolutionist Side: Scientific expertise determines scientific truth. Courts should not adjudicate scientific facts. Academic freedom.
      *   *The Players:*
          *   Bryan: Defender of the Vertical (Bible) and Horizontal (Majority Rule).
          *   Darrow: Defender of the Vertical (Science) and Horizontal (Expert Authority).
          *   Jury: Bound by the Vertical/Horizontal of the Law (Butler Act) but perhaps personally conflicted.
          *   Experts: Excluded because their Vertical Hinges were deemed irrelevant by the Court's Horizontal Hinge (legal statute overrides scientific testimony).

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the prompt's sophisticated framing. Define the scope.
      *   **Two-Directional Mapping:**
          *   Need to contrast the "Creationist Framework" vs. the "Scientific Framework."
          *   *Creationist:* Hinge = Biblical Inerrancy. Empirical = Fossils (interpreted as flood debris).
          *   *Scientific:* Hinge = Methodological Naturalism/Deep Time. Empirical = Specific phylogenetic trees.
          *   *Players:* Bryan (Hinge holder), Darrow (Trying to shift the hinge or expose rigidity), Jury (Enforcers of the legal hinge), Experts (Silenced because their hinges were inadmissible).
      *   **Darrow vs. Bryan (The Cross-Examination):**
          *   Did Darrow win? Legally, no. Epistemically? He showed Bryan's hinges are *hinges*, not facts. Bryan admitted the days might not be 24 hours but held firm on the miracle.
          *   *Analysis:* It demonstrated incommensurability. Darrow tried to treat Bryan's hinges as empirical claims (e.g., "Where did Cain get his wife?"). Bryan retreated to the hinge ("Miracle"). This shows the hinge protects itself from empirical refutation.
      *   **Value of Hinge Epistemology:**
          *   Standard narrative: Ignorance vs. Education, or Fundamentalism vs. Modernism.
          *   Hinge narrative: It explains *why* they talked past each other. It wasn't lack of data; it was different "riverbeds." It explains the frustration.
      *   **Vertical vs. Horizontal Distinction (The Core Innovation):**
          *   *Vertical:* What is the world? (Genesis vs. Evolution).
          *   *Horizontal:* Who decides? (Legislature/Voters vs. Scientists/Experts).
          *   *Assessment:* The trial was *both*, but the legal outcome turned on the Horizontal. The Butler Act was a Horizontal hinge (Majority Rule). The exclusion of experts was a Horizontal move (Law trumps Science in court).
          *   *Critique:* The distinction is useful but maybe artificial. Vertical hinges motivate the Horizontal ones.
      *   **Limitations/Breakdown:**
          *   Wittgenstein doesn't explain *power*. Hinge epistemology is descriptive, not political. It doesn't explain why one hinge wins (institutional dominance).
          *   It doesn't address the *pedagogical* stake (what do we teach children?).
          *   It doesn't explain the *legal* mechanism of victory.
      *   **Conclusion:** Summarize the utility and the limits.

  4.  **Refining the Argument (Self-Correction during drafting):**

