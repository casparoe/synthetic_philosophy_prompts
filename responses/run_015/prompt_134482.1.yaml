  ### Audit of Internal Coherence: Decision-Making Under Normative Uncertainty

  **To:** Seminar Instructor
  **From:** Independent Auditor
  **Subject:** Coherence Audit of Eight Theses on Normative Uncertainty

  This audit evaluates the internal consistency of your eight theses. I have ranked conflicts by severity, ranging from mathematical impossibilities to substantive tensions. Where conflicts are technical, I have provided toy examples to demonstrate the mechanism of failure.

  ---

  ### Conflict 1: The "Orders of Magnitude" Verdict vs. Variance Normalization
  **Severity:** Fatal (Mathematical Impossibility)
  **Theses Involved:** (2) and (8)

  **The Conflict:**
  Thesis (8) claims that when running the procedure in (2), the long-run option wins by "several orders of magnitude." Thesis (2) specifies variance normalization over the options "currently under consideration." If the choice is binary (as described in (8): Intervention A vs. Intervention B), variance normalization mathematically bounds the final scores, making an "orders of magnitude" victory impossible.

  **The Mechanism:**
  Variance normalization converts each theory's value assignments into Z-scores (standard deviations from the mean). In a binary choice scenario, there are only two data points for any given theory.
  1.  Let a theory assign values $v_1$ and $v_2$ to the two options.
  2.  The mean $\mu = (v_1 + v_2) / 2$.
  3.  The standard deviation $\sigma = |v_1 - v_2| / 2$.
  4.  The normalized value (Z-score) for option 1 is $(v_1 - \mu) / \sigma$.
  5.  Substituting the terms: $((v_1 - v_2) / 2) / (|v_1 - v_2| / 2)$.
  6.  This simplifies to either $+1$ or $-1$.

  Consequently, every theory that has a preference contributes exactly $+1$ or $-1$ to the expected choice-worthiness (weighted by credence). The final score for any option is the sum of credences of theories that prefer it, minus the sum of credences of theories that dislike it. The maximum possible difference between two options is 2.0 (if every theory with non-zero credence strongly prefers one over the other).

  You cannot achieve a ratio of "orders of magnitude" (e.g., 10:1 or 100:1) when the scores are bounded between -1 and +1.

  **The Cost of Repair:**
  *   **Option A (Revise 8):** Admit that the long-run option wins by a *margin*, not by orders of magnitude. This preserves the method but reduces the rhetorical force of the verdict.
  *   **Option B (Revise 2):** Abandon variance normalization on the *current menu*. If you normalize based on a fixed, broad set of "possible values" rather than the current options, the scores are unbounded.
      *   *Cost:* This violates the spirit of (2), which is designed to prevent scale inflation *specifically* for the options at hand. It also reintroduces the scale-comparison problem you sought to solve.

  ---

  ### Conflict 2: The Asymmetry View vs. Variance Normalization
  **Severity:** High (Methodological Breakdown)
  **Theses Involved:** (2) and (6)

  **The Conflict:**
  Thesis (6) endorses the "Asymmetry": creating happy lives adds no value. Thesis (8) states the long-run option's value comes primarily from "vastly many more welfare subjects." For the Person-Affecting View (PAV) in (5), the value of the Near-Term option and the Long-Term option may be identical (assuming no harm to existing people). If a theory assigns equal value to all options on the menu, its variance is zero. Thesis (2) requires dividing by the standard deviation to normalize. Division by zero is undefined.

  **The Mechanism:**
  Consider two options: **Near** (help existing) and **Far** (create many happy people).
  *   **Utilitarianism:** Near = 10, Far = 1,000,000. (Variance > 0)
  *   **Person-Affecting (Asymmetry):** Near = 10, Far = 10. (Variance = 0)

  Under procedure (2), you must rescale PAV so its values have unit variance. Since the variance is zero, the procedure crashes. You cannot calculate the expected choice-worthiness.

  **The Cost of Repair:**
  *   **Option A (Perturb Values):** Assume PAV sees a *tiny* difference (e.g., Far = 10.0001) due to empirical uncertainty.
      *   *Cost:* This creates instability. As the perceived difference approaches zero, the normalization factor explodes. A theory that is almost indifferent becomes disproportionately influential because its "unit" of value becomes infinitesimally small, making its tiny preference outweigh the Utilitarian's massive preference in standardized units.
  *   **Option B (Exclude Zero-Variance Theories):** Ignore theories that see no difference between options.
      *   *Cost:* You effectively discard 0.15 of your credence (PAV) plus any other indifferent theories. This violates the requirement to weight by *all* credences you take seriously.

  ---

  ### Conflict 3: Variance Normalization vs. Independence of Irrelevant Alternatives
  **Severity:** Medium (Acknowledged Trade-off)
  **Theses Involved:** (2) and (3)

  **The Conflict:**
  Thesis (3) desires that the ranking of options should not depend on irrelevant alternatives (IIA). Thesis (2) uses variance normalization based on the "options currently under consideration." Variance is inherently menu-dependent. Adding a "decoy" option that is extreme according to one theory will increase that theory's variance, shrinking its normalized influence on the original options, potentially flipping their ranking.

  **The Mechanism:**
  *   **Menu 1:** {A, B}
      *   **Theory 1:** A=0, B=10. (Variance is moderate).
      *   **Theory 2:** A=0, B=1. (Variance is small).
      *   *Result:* Theory 1 is scaled down less than Theory 2. B wins comfortably.
  *   **Menu 2:** {A, B, C} (Where C is a decoy)
      *   **Theory 1:** A=0, B=10, C=1000. (Variance becomes huge).
      *   **Theory 2:** A=0, B=1, C=1. (Variance stays small).
      *   *Result:* Theory 1's values are compressed drastically to match unit variance. Theory 2's values are compressed less. Theory 2 now dominates the weighted sum. If Theory 2 prefers A, the ranking of A vs. B can flip simply because C was added, even if no one chooses C.

  **The Cost of Repair:**
  You state in (3) that you hold IIA "loosely." This is the correct move. Strict IIA is incompatible with variance normalization.
  *   **Cost:** You are vulnerable to "menu manipulation." An agent could strategically introduce extreme options to dampen the influence of theories they dislike. You must accept that your verdicts are context-sensitive to the feasible set.

  ---

  ### Conflict 4: Anti-Fanaticism vs. The Long-Termist Verdict
  **Severity:** Medium (Substantive Tension)
  **Theses Involved:** (4) and (8)

  **The Conflict:**
  Thesis (4) rejects fanaticism: you do not accept that a tiny probability of a sufficiently great good mandates a gamble. Thesis (8) endorses a gamble based on a "small probability of an enormously better trajectory" where value derives from "vastly many more welfare subjects." This is the structural definition of a Pascalian gamble. While variance normalization (2) dampens the influence of outlier theories, if the verdict still mandates the gamble *because* of the vast numbers, you are functionally accepting the fanatic's conclusion, even if you reached it via a different route.

  **The Mechanism:**
  If the Long-Term option wins primarily because Utilitarianism assigns it astronomical value (due to population size), and this astronomical value survives the normalization process to dictate the decision, then the "small probability / huge good" structure is doing the work.
  *   If the probability were smaller, would the verdict flip? If yes, you are still trading probability for magnitude.
  *   If the probability were smaller and the verdict *did not* flip (due to normalization capping the influence), then (4) is satisfied, but (8) becomes harder to justify (see Conflict 1 & 2).

  **The Cost of Repair:**
  *   **Clarify Definitions:** Distinguish between "fanaticism" (unbounded EV maximization) and "robust long-termism" (where the probability is small but not *Pascalian-tiny*, and the value is large but not *infinite*).
  *   **Cost:** You must specify the threshold where "small probability" becomes "tiny probability." Without this line, (4) is rhetorically weak against (8).

  ---

  ### Final Evaluation of Verdict (8)

  **Can the procedure in (2) deliver the verdict in (8)?**

  **No.** Not as currently specified.

  1.  **Mathematical Bound:** As demonstrated in Conflict 1, variance normalization on a binary menu produces scores bounded between -1 and +1. It is impossible for one option to come out ahead by "several orders of magnitude" in terms of the final decision metric.
  2.  **Zero-Variance Crash:** As demonstrated in Conflict 2, if the Person-Affecting View (15% of your credence) assigns equal value to both options (due to the Asymmetry), the procedure is undefined. If you perturb the values to avoid division by zero, the PAV becomes disproportionately influential, likely *blocking* the Long-Term option rather than allowing it to win by a large margin.

  **Recommendation for the Handout:**
  To make this position coherent for your students, you should revise Thesis (8).
  *   **Change:** "The long-run option comes out ahead by several orders of magnitude."
  *   **To:** "The long-run option comes out ahead, primarily driven by the Utilitarian credence, despite the dampening effect of variance normalization and the indifference of the Person-Affecting view."

  This preserves the substantive lesson (hedging can still lead to long-termism) without making a mathematically impossible claim about the output of the normalization procedure.
