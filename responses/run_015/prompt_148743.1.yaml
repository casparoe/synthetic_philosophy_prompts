  **Diagnosis**
  The load-bearing feature is the unbounded series structure without a principled stopping point.
  Diagnostic 1 (One-off): Remove the series; $A_1$ is a single opportunity. The Standard verdict changes: $A_1$ becomes required. Without the threat of excessive demand from future acts, trivial cost implies obligation. The Consequentialist and Kantian verdicts remain unchanged.
  Diagnostic 2 (High Cost): Keep the series; make retrieval costly (e.g., risking lateness). The Consequentialist verdict changes: $A_1$ becomes optional. The cost now exceeds the prerogative's threshold. The Standard verdict remains supererogatory (now obviously so). The Kantian verdict remains within duty (latitude now clearly covers omission).

  **Defences**
  Consequentialist Defence: Convert to aggregate requirement (help enough overall). This works but concedes instance-level optionality, undermining the theory's claim to determine specific acts. It essentially adopts a hybrid view.
  Kantian Defence: Argue latitude in degree just is what supererogation tracks. This works but costs the distinction between duty and merit, rendering "supererogation" redundant within the system. It collapses the category into wide duty.

  **Honest Note**
  The three verdicts generate jointly without smuggling. The specification holds. The tension arises solely from the series structure interacting with each theory's handling of demand and latitude. No constraints need relaxation. The case successfully isolates the structural feature.
