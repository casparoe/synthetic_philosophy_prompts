answer: |-
  # Joint Statement on the Conceptual Structure of Liberty

  **Issued by the Negative-Liberty and Republican-Liberty Working Group**

  Following a period of adversarial collaboration, the undersigned theorists acknowledge significant overlap in our diagnostic frameworks regarding political power, while maintaining distinct conclusions about the necessary and sufficient conditions for individual liberty. We submit this statement to clarify the architecture of our consensus and to isolate the precise locus of our theoretical divergence.

  ### I. Agreed Claims on the Structure of Liberty

  1.  **Liberty as a Social Status:** Liberty is not merely the physical ability to act (capacity), but a normative status within a social relationship. A person blocked by a natural obstacle (e.g., a mountain) is unable to act, but not necessarily unfree; a person blocked by human agency is unfree.
  2.  **Interference as Sufficient:** Both sides agree that actual, intentional interference by another agent constitutes a reduction of liberty. There is no disagreement that if a power *is* exercised to block an action, the agent is rendered unfree regarding that action.
  3.  **The Nature of Domination:** Domination requires an asymmetry of power wherein one agent possesses the capacity to interfere in the choices of another. Both sides agree that domination involves a dependency of the weaker party on the will of the stronger.
  4.  **The Master-Slave Paradigm:** Both sides accept the master-slave relationship as the limiting case (paradigm) of unfreedom. Any viable theory of liberty must account for the intuition that the slave is unfree, even if the specific mechanisms explaining *why* differ.
  5.  **Defining Arbitrariness:** Power is arbitrary when it is not constrained by external rules, procedures, or the tracked interests of those subject to it. Both sides agree that arbitrary power is dangerous and politically undesirable, even if we disagree on whether its mere existence constitutes a violation of liberty *per se*.
  6.  **Distinction from Other Goods:** Liberty is distinct from other political values, such as welfare, security, or democratic participation. While these values may correlate, a reduction in liberty is not conceptually identical to a reduction in well-being or safety.

  ### II. Residual Disagreements, Cruxes, and Test Scenarios

  | Crux | Negative-Liberty Formulation | Republican-Liberty Formulation | Test Scenario | Negative-Liberty Prediction | Republican-Liberty Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Status of Unexercised Power** | Freedom is only diminished by the **actual exercise** of interference. An arbitrary capacity to interfere, if left unexercised, restricts security but does not restrict liberty. | Freedom is diminished by the **existence of arbitrary power**. The mere capacity to interfere arbitrarily constitutes a status of dependency, rendering the subject unfree regardless of interference. | **The Benevolent Master:** A slave owner holds total legal authority to punish or restrain their slave at will. However, the owner is kind, never interferes with the slave's movements, and fulfills all the slave's desires. | The slave is **free** to the extent that they encounter no actual obstacles. Their insecurity is high, but their liberty is intact. | The slave is **unfree**. The structural relationship of dependency means the slave acts only by permission, not by right. |
  | **2. Legal Basis vs. Practical Safeguards** | Freedom is secured when interference is made **practically impossible**. If institutional checks render the exercise of arbitrary power effectively unviable, the legal basis for that power is irrelevant to liberty. | Freedom is secured only when the **legal basis for domination is removed**. Practical constraints are insufficient if the arbitrary authority remains legally intact, as the status of dependency persists. | **The Revocable Right:** Citizens hold a formal right to practice a religion. However, an unaccountable state office retains unreviewable legal authority to revoke this right without justification or appeal. The office has never exercised this authority, and political culture makes it highly unlikely. | The citizens are **free**. The practical impossibility of revocation means there is no actual interference; the legal technicality is a threat to security, not liberty. | The citizens are **unfree**. Because the state retains the arbitrary legal capacity to revoke the right, citizens practice religion by sufferance rather than by secure status. |
