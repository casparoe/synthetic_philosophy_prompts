prompt: |-
  I am drafting notes for an essay on fakes, forgeries, and the value of originals. The central claim is that an original artwork's value is not reducible to its perceptual or aesthetic properties but includes a form of historical testimony: the object is a direct causal descendant of the artist's intentional act. I distinguish presence-value, the experiential quality replicable in perfect copies, from testimony-value, the specific causal-historical fact that this object was produced by that intention. To sharpen the analysis, I introduce the notion of counterfactual fragility: the strength of an object's testimony-value correlates with the modal proximity of worlds in which it never existed—how contingent its creation was. A work completed days before the artist's death using materials that were subsequently destroyed carries high counterfactual fragility; its survival records a more specific historical fact, deepening its testimony. Perfect forgeries lack testimony-value because their causal history is deceptive rather than artistic, even if they match presence-value. I also consider a reverse-degradation case: if an original is accidentally restored to match a famous forgery, it retains testimony-value but acquires ambiguous presence-value. Please comment on these notes, especially on whether counterfactual fragility is genuinely distinct from rarity or provenance, and on whether the distinction between the two values survives the reverse-degradation scenario.

  Please organize your response in the following sections, in this order:
  1. Brief summary of the argument (about 3 sentences)
  2. Conceptual clarity (about 150 words): evaluate whether counterfactual fragility is well-defined, whether it collapses into rarity or provenance, and whether the presence-value/testimony-value distinction holds up
  3. Argumentative coherence (about 150 words): assess the move from testimony-value to counterfactual fragility, and whether the reverse-degradation case is handled consistently
  4. Concrete suggestions (5-7 bullet points): identify gaps, unstated assumptions, or ways to strengthen the essay
