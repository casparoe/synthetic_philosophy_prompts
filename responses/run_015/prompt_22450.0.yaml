answer: |-
  This is a classic methodological debate in archaeology and history. The cliché "absence of evidence is not evidence of absence" is often invoked to shut down discussion, but in practice, archaeologists use negative evidence all the time. The key is determining when the **search has been sufficient** and the **conditions were right** for the evidence to survive if it had existed.

  To move your piece beyond a "50-50 toss-up," you need to evaluate the **weight of the negative evidence.** You can do this by applying a specific framework used in archaeological theory.

  Here are the five criteria you can use to assess whether the archaeologist's conclusion holds more water than the historian's caveat.

  ### 1. Taphonomy (Preservation Conditions)
  This is the historian's strongest card. You need to establish the "survival bias" of the site.
  *   **The Question:** Does the local soil chemistry destroy the materials this culture *would* have written on?
  *   **The Test:** If the culture is in a region like Mesopotamia or the Aegean, where clay is abundant and fire is common, clay tablets should survive. If they are in a region like the Amazon or parts of Southeast Asia, where organic materials rot instantly, the historian is right to be cautious.
  *   **The Tie-Breaker:** Did they preserve *other* organic materials? If archaeologists have found preserved wood, textiles, or basketry at the site but no writing, the argument that "writing was on papyrus and rotted" becomes much weaker. If the soil preserves a piece of string, it should preserve a piece of scratched potsherd.

  ### 2. The Administrative Threshold
  Writing rarely emerges for poetry or philosophy in the Bronze Age; it emerges for accounting. It is a technology of bureaucracy.
  *   **The Question:** Did the society have a complexity that *required* writing?
  *   **The Test:** Look for "secondary indicators" of literacy. Do they have standardized weights and measures? Do they have large-scale storage facilities (granaries/warehouses)? Do they have a clear class hierarchy or palace economy?
  *   **The Tie-Breaker:** If a culture has massive palaces, long-distance trade networks, and specialized labor but *zero* record-keeping tools (like sealings, tokens, or tallies), it is statistically improbable they had writing. Writing usually accompanies urbanization. If they were small-scale agrarian villages, the lack of writing is expected, not mysterious.

  ### 3. Material Habits (Durability Bias)
  Cultures have preferences for media. You need to know what this culture valued for permanence.
  *   **The Question:** Did they inscribe permanence on *anything*?
  *   **The Test:** Did they carve stone monuments? Did they stamp seals on clay? Did they engrave metal?
  *   **The Tie-Breaker:** If a culture carves elaborate stone stelae to honor kings but never includes text, that is a strong cultural signal. It suggests they communicated authority through imagery, not script. If they used clay seals for jars (which survives well) but never marked the seals with symbols, the "we haven't found it yet" argument weakens.

  ### 4. Regional Context (The Neighbor Test)
  Cultures do not exist in a vacuum. Literacy is often contagious.
  *   **The Question:** Did their trading partners have writing?
  *   **The Test:** If this culture was trading with Egyptians or Assyrians (who had writing), there is usually an "interface" of literacy. Even if they didn't write their own language, they often adopted cuneiform or hieroglyphs for trade (like the Canaanites or Hittites initially).
  *   **The Tie-Breaker:** If neighbors had writing and traded heavily with this group, but no imported written documents appear in the archaeological record (nor any local attempts to mimic them), it suggests this culture remained outside the "literacy sphere."

  ### 5. Excavation Scope (The "Right Trench" Fallacy)
  The historian's argument that "we haven't hit the right trench" is valid only up to a point.
  *   **The Question:** What percentage of the habitable site has been exposed, and does the sampling cover different functional areas?
  *   **The Test:** Have they dug only the temple, or also the markets, the residential quarters, and the trash heaps? Writing often appears in trash (discarded receipts) as much as in archives.
  *   **The Tie-Breaker:** If decades of digging across *multiple* areas (domestic, industrial, religious) have yielded zero inscriptions, the "bad luck" argument diminishes. At a certain point, probability dictates that if writing were in common use, a fragment would have appeared by now.

  ### How to Frame This in Your Piece
  Instead of presenting it as a stalemate, you can frame it as a **shifting burden of proof.**

  You might write something like:
  > "While it is theoretically possible that records existed on perishable materials, the weight of archaeological context suggests otherwise. The site's soil preserves organic matter well, yet no inscribed bone or wood has emerged. The society built massive storehouses but used no sealings to track inventory. Their neighbors wrote, but trade goods found here bear no marks. In archaeology, a shadow eventually proves the absence of an object. After decades of excavation, the shadow of this culture's literacy remains conspicuously empty."

  ### A Real-World Example: The Indus Valley Civilization
  You can use the Indus Valley (Harappan) civilization as a mental model for your piece, as they face this exact debate.
  *   **Historian Argument:** They might have written on cotton or bark, which rotted.
  *   **Archaeologist Counter:** They stamped thousands of clay seals and carved stone amulets. They had the materials to make writing permanent. They had a complex urban society that *should* have needed records. Yet, the symbols on their seals never combine in long strings (syntax); they remain short, isolated tags.
  *   **Consensus:** Most scholars now lean toward the idea that they had a **proto-writing system** (symbols conveying meaning but not specific spoken language) rather than full script.

  ### Summary Checklist for Your Article
  To avoid the 50-50 trap, ask your sources these specific questions. Their answers will tell you who is right:
  1.  **"Have you found preserved organic material (wood/cloth) at the site?"** (If yes, the historian's 'rotting papyrus' argument fails).
  2.  **"Did they have a bureaucracy (taxes/warehouses)?"** (If no, the archaeologist's 'no need for writing' argument strengthens).
  3.  **"Did they carve stone or stamp clay for other reasons?"** (If yes, why not for language?).
  4.  **"How many man-hours of excavation have occurred?"** (At some point, 'bad luck' stops being a scientific variable).

  If the answers align with the Archaeologist's view on 3 or 4 of these points, you can confidently state that the **preponderance of evidence** points to a non-literate society, while acknowledging the historian's point as a remaining, but unlikely, possibility.
