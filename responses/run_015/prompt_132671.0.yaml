  # Protocol for Determination of Protected Status (PDPS)

  **Version:** 3.1 (Cycle 4)
  **Authority:** Standing Committee on Protected Taxa
  **Purpose:** To translate evidence of valenced conscious experience into binary listing decisions that are legally defensible, consistent across cycles, and operationally runnable.

  ## Part 1: The Decision Sequence

  This procedure is a sequential gate system. A petition moves to the next gate only if the previous gate is satisfied. If a gate is failed, the recommendation is **Not to List**. If a gate cannot be cleared due to conflicting values rather than evidence, the matter is **Referred to the Committee**.

  ### Gate 1: The Substrate Gate (Anatomical Capacity)
  **Question:** Does the taxon possess a neuroanatomical substrate capable of integrating information in a way that is structurally analogous to known sentient architectures?
  *   **Sufficient Answer (Yes):** Evidence of a centralised integrating structure (e.g., brain, ganglia cluster) with neuron counts or connectivity density exceeding the clade-specific baseline for reflex-only processing.
  *   **Sufficient Answer (No):** Evidence of a diffuse nerve net or decentralised system with no integrating structure, *and* no evidence of functional integration.
  *   **Absent Evidence:** If neuroanatomical data is missing, the burden of proof lies with the **Petitioner**. Absence of data is treated as "Substrate Unknown."
  *   **Clade-Locality Rule:** Neuroanatomical proxies calibrated in one clade (e.g., vertebrates) cannot be applied to another (e.g., arthropods) without specific validation. However, convergent evolution of centralisation (e.g., cephalopods vs. vertebrates) may be accepted as a structural proxy.
  *   **Outcome:**
      *   **Yes:** Proceed to Gate 2.
      *   **No:** Proceed to Gate 2 (Behavior can override Anatomy).
      *   **Unknown:** Proceed to Gate 2, but apply the Precautionary Override (see Gate 3).

  ### Gate 2: The Valence Gate (Functional Evidence)
  **Question:** Is there evidence that the animal's response to stimuli is valenced (experienced as "good" or "bad") rather than purely reflexive?
  *   **Sufficient Answer (Yes):** Evidence of at least two of the following:
      1.  **Motivational Trade-offs:** The animal accepts a cost (e.g., loss of food, exposure to risk) to avoid a stimulus.
      2.  **Analgesic Reversal:** Administration of pain-relievers alters the response to injury without immobilizing the animal.
      3.  **Cognitive Bias:** Injury or stress induces a "pessimistic" judgment bias in unrelated tasks.
      4.  **Long-term Avoidance:** Avoidance of a location or stimulus persists after the immediate threat is removed and survives competing high-value drives.
  *   **Sufficient Answer (No):** Responses are limited to nociception (withdrawal reflex), habituation, or sensitisation without evidence of trade-offs or modulation by internal state.
  *   **Absent Evidence:** If behavioral studies are absent, the answer is "Unknown." This does not fail the gate but triggers the Precautionary Override in Gate 3.
  *   **Outcome:**
      *   **Yes:** Proceed to Gate 3.
      *   **No:** Proceed to Gate 3.
      *   **Unknown:** Proceed to Gate 3.

  ### Gate 3: The Integration & Precaution Gate (Decision Rule)
  **Question:** Does the combination of Substrate (Gate 1) and Valence (Gate 2) evidence meet the statutory threshold for protection?
  *   **Rule A (High Substrate + Unknown Valence):** If Gate 1 is **Yes** (High Integration) and Gate 2 is **Unknown** (Absent Behavioral Data), the recommendation is **List**. (Rationale: Precautionary Principle applied to high-probability capacity).
  *   **Rule B (Low/Distributed Substrate + High Valence):** If Gate 1 is **No/Unknown** but Gate 2 is **Yes** (Strong Behavioral Evidence), the recommendation is **List**. (Rationale: Functional evidence trumps anatomical assumptions).
  *   **Rule C (Low Substrate + Low/Unknown Valence):** If Gate 1 is **No** and Gate 2 is **No/Unknown**, the recommendation is **Not to List**.
  *   **Referral Condition:** If the evidence is mixed (e.g., High Substrate but Behavioral Evidence suggests *only* reflex), refer to the Committee. This is a question of **Statutory Purpose** (how much risk of error is acceptable), not evidence.
  *   **Handling Conflicting Proxies:** Behavioral evidence of valence (Gate 2) always outweighs Anatomical evidence (Gate 1) if they conflict. However, Anatomical evidence can compensate for absent Behavioral evidence (Rule A).

  ### Gate 4: The Scope Gate (Regulatory Application)
  **Question:** Given the Listing recommendation, what is the scope of the duties?
  *   **Unit of Account:** Listing is based on the **Individual Animal's Capacity**. Population numbers do not determine *whether* to list, but they determine *how* to regulate.
  *   **Population Scaling:**
      *   **Low Population:** Full application of enclosure, handling, and licensing duties.
      *   **High Population (e.g., >1 million/year):** Duties may be phased or practice-specific (Partial Listing) to ensure enforceability, provided the core protection (no unnecessary suffering) is maintained.
  *   **Temporal Density:** If evidence suggests high subjective time density (fast processing), stunning and handling time limits must be tighter than for slow-processing taxa, even if the "amount" of suffering is not compared.
  *   **Partial Listing:** The Committee may attach the listing to specific practices (e.g., "Listed for Slaughter, Exempt for Breeding") if evidence of valence is practice-specific. This must be recorded to ensure consistency in future cycles.

  ---

  ## Part 2: Handling the Three Submissions

  The PDPS explicitly resolves the three conflicting submissions as follows:

  1.  **Industry Submission (Neuron Count Threshold):**
      *   **Handling:** Rejected as a sole determinant. Neuron count is admitted at **Gate 1** as evidence of *capacity*, but it is clade-local. It cannot be the "thing that matters."
      *   **Effect:** A taxon cannot be listed *solely* on neuron count if behavioral evidence explicitly contradicts valence. However, high neuron count with *absent* behavioral evidence triggers the Precautionary Override (Rule A).

  2.  **Animal-Protection Submission (Non-zero Probability $\times$ Population):**
      *   **Handling:** Partially Accepted. The "Non-zero Probability" is addressed at **Gate 3** (Precautionary Override). The "Population Aggregation" is rejected for *Listing Status* (capacity is individual) but accepted at **Gate 4** (Scope).
      *   **Effect:** We do not list a taxon *because* there are many of them. We list them because they are sentient. We regulate them *strictly* because there are many of them.

  3.  **Consultant Submission (Temporal Density):**
      *   **Handling:** Accepted at **Gate 4**.
      *   **Effect:** This does not change the Yes/No listing decision. It changes the *standards* applied (e.g., faster stunning requirements for fast-metabolism animals). It is a matter of regulatory design, not statutory threshold.

  ---

  ## Part 3: Application to Current Petitions

  ### Group A: Reef-Dwelling Cephalopods
  *   **Gate 1 (Substrate):** **Yes.** High absolute brain mass, high central neuron counts, single large integrating structure. (Clade-locality note: Convergent centralisation with vertebrates accepted).
  *   **Gate 2 (Valence):** **Unknown.** Nociceptive sensitisation present, but *no* motivational trade-off studies. Evidence is absent, not negative.
  *   **Gate 3 (Decision):** **List.** Applies **Rule A** (High Substrate + Unknown Valence). The burden shifts due to the high probability of capacity indicated by anatomy. Absence of behavioral data is treated as a data gap, not disproof.
  *   **Gate 4 (Scope):** **Full Listing.** Annual exposure in low thousands makes full regulatory application feasible.
  *   **Record Reason:** "The taxon possesses a centralised nervous system structurally analogous to known sentient architectures. While behavioral evidence of valence is currently incomplete, the anatomical probability is sufficient to trigger the statutory precautionary duty. Listing is recommended pending further behavioral research."

  ### Group B: Social Insects
  *   **Gate 1 (Substrate):** **No/Unknown.** Distributed nervous system, no single integrating structure. Neuron count low relative to vertebrates.
  *   **Gate 2 (Valence):** **Yes.** Flexible responses to injury, persistent avoidance surviving resource loss, reversal by analgesics. Meets 3 of 4 criteria.
  *   **Gate 3 (Decision):** **List.** Applies **Rule B** (Functional evidence trumps anatomical assumptions).
  *   **Gate 4 (Scope):** **Partial Listing / Phased.** Annual exposure $10^{11}$. Full individual licensing is impossible. Recommendation is to list for *handling and slaughter standards* only, exempting routine husbandry where individual tracking is impossible.
  *   **Record Reason:** "Behavioral evidence demonstrates valenced experience (analgesic reversal, trade-offs) sufficient to satisfy the statutory definition of capacity. Anatomical decentralisation does not negate functional evidence. Due to population scale, duties are limited to practices where individual welfare impact is direct and manageable."

  ### Group C: Filter-Feeding Nerve Nets
  *   **Gate 1 (Substrate):** **No.** Nerve net, no centralisation.
  *   **Gate 2 (Valence):** **No.** Habituation and withdrawal present, but no evidence of trade-offs or state-modulation beyond reflex.
  *   **Gate 3 (Decision):** **Not to List.** Applies **Rule C**.
  *   **Gate 4 (Scope):** N/A.
  *   **Record Reason:** "Neither anatomical substrate nor behavioral evidence meets the threshold for valenced experience. Responses are consistent with nociceptive reflex and habituation. Burden of proof not met."

  ---

  ## Part 4: One-Page Member Guide

  **STANDING COMMITTEE ON PROTECTED TAXA: DECISION FLOW**
  *For use during the 2-day cycle meeting.*

  **STEP 1: CHECK THE EVIDENCE (Gates 1 & 2)**
  *   **Anatomy:** Is there a brain or central cluster?
      *   *Yes:* Strong indicator of capacity.
      *   *No:* Does not rule out capacity.
      *   *Missing:* Petitioner has not proved it.
  *   **Behavior:** Do they feel "bad" or just "react"?
      *   *Look for:* Trade-offs (risking food to avoid pain), Painkillers working (analgesia), Long-term memory of pain.
      *   *Ignore:* Simple withdrawal, getting used to things (habituation).

  **STEP 2: APPLY THE RULES (Gate 3)**
  *   **IF** High Anatomy + No Behavior Data $\rightarrow$ **LIST** (Play it safe).
  *   **IF** Low Anatomy + Strong Behavior Data $\rightarrow$ **LIST** (Behavior wins).
  *   **IF** Low Anatomy + No/Weak Behavior Data $\rightarrow$ **DO NOT LIST**.
  *   **IF** High Anatomy + Behavior says "Reflex Only" $\rightarrow$ **REFER TO COMMITTEE** (This is a values call).

  **STEP 3: SET THE RULES (Gate 4)**
  *   **Listing is Binary:** An animal is either protected or it isn't.
  *   **Rules Scale:**
      *   *Few Animals:* Strict rules on everything (breeding, transport, kill).
      *   *Many Animals:* Focus rules on killing and handling.
      *   *Fast Animals:* Stricter time limits on stunning (they experience time densely).
  *   **Partial Listing:** Allowed. You can protect them during slaughter but not breeding if evidence only supports one.

  **STEP 4: RECORD THE REASON**
  *   Do not say "It suffers more than X."
  *   Do say "Evidence of valence is sufficient/insufficient."
  *   Do say "Population scale dictates this scope."

  ---

  ## Part 5: Limitations & Inabilities

  This procedure is a tool for statutory compliance, not moral truth. It cannot do the following:

  1.  **Moral Status (Rights):** The procedure determines *capacity for suffering*, not *rights-bearing status*. It can justify a duty not to cause pain, but it cannot justify a right to life or liberty. If the statute implies rights, this procedure is insufficient.
  2.  **Cross-Architecture Comparison:** It cannot compare a unit of insect suffering to a unit of mammal suffering. It treats them as *incommensurable*. We list both if evidence suffices, but we cannot say one matters "more."
  3.  **Qualitative Differences:** It assumes valenced states are functionally similar (good/bad). If a taxon experiences a state that has no human equivalent (e.g., a "valence" based on chemical gradients we cannot conceive), the procedure may misclassify it as non-sentient.
  4.  **Boundary Errors:** Any threshold creates a "cliff edge." A taxon just below the threshold (e.g., Group C with slightly better data) will be untreated despite potentially having similar capacity. This is a known error rate inherent in binary legal regimes.
  5.  **Temporal Subjectivity:** While Gate 4 accounts for time density in *standards*, the Listing decision itself treats a second of suffering as a second of suffering. We cannot mathematically adjust the *listing* for "how long a second feels" to the animal, only the *regulations*.

  **Strategic Note on Outcomes:**
  This procedure will likely recommend listing **Group B (Insects)**. This is the "uncomfortable" outcome regarding scale and administrative burden. It will also recommend listing **Group A (Cephalopods)**. This is the "political" outcome regarding industry pressure. The procedure forces both. If the Committee wishes to avoid one, they must use the **Referral** mechanism at Gate 3, acknowledging they are making a value judgment contrary to the evidentiary weight.
