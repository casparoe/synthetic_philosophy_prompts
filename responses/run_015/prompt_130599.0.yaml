  # Seminar Handout: The PP/FEP Sorting Tree
  **Goal:** Stop arguing about who said what. Start arguing about what you actually believe.
  **Instructions:** Start at the top. Follow the arrows. Don't cheat by looking at the leaf names first.

  ---

  ### NODE 1: The Neural Claim
  **Is predictive coding in the brain *literally* Bayesian inference (probabilities being calculated by neurons), or is it just a functional metaphor (it looks *as if* they calculate probabilities)?**

  *   **A. It's Literal.** (The brain is a statistical engine.) → *Go to Node 2*
  *   **B. It's a Metaphor.** (It's a useful description, not mechanics.) → *Go to Node 3*

  ---

  ### NODE 2: The Boundary Claim (For Literalists)
  **Do Markov Blankets carve reality at its joints (ontological boundaries), or are they just modeling conveniences (epistemic tools)?**

  *   **A. Real Boundaries.** (There is a fact of the matter about where "you" end and the world begins.) → *Go to Node 4*
  *   **B. Modeling Tools.** (Blankets are just how we slice the system for math.) → **LEAF 1: Neuro-PP Realist**
      *   *Position:* You think the brain does Bayes, but you don't buy the full Fristonian metaphysics. You're safe from the "thermostat has a mind" crowd.
      *   *Vibe:* Clark-ish, but mechanistic.

  ---

  ### NODE 3: The Dark Room Claim (For Metaphorists)
  **Does the "Dark Room Problem" (why don't we just hide in dark rooms to minimize surprise?) kill the theory for cognition, or is Active Inference a real fix?**

  *   **A. It's Fatal.** (Minimizing surprise implies seeking death/stasis; cognition needs more.) → **LEAF 2: PP Skeptic**
      *   *Position:* Predictive processing might describe perception, but it fails as a theory of life/action.
      *   *Vibe:* Old-school cognitivist or enactivist critic.
  *   **B. Active In Fixes It.** (We seek specific surprises, not zero surprise.) → *Go to Node 5*

  ---

  ### NODE 4: The Ontology Claim (For Real Blankets)
  **Does Active Inference successfully solve the Dark Room problem for you?**

  *   **A. No.** (It's still a problem.) → **LEAF 3: The Tragic Realist** [UNOCCUPIED]
      *   *Status:* **Incoherent/Unoccupied.** Why believe blankets are ontologically real if the principle governing them fails to explain basic behavior? Nobody really stands here. It's ugly.
  *   **B. Yes.** (Active inference works.) → *Go to Node 6*

  ---

  ### NODE 5: The Epistemic Escrow Claim (For Metaphorists)
  **"Epistemic Escrow": When institutions or social groups buffer prediction error (e.g., bureaucracy slowing bad news), is this still Free Energy Minimization, or a break from the framework?**

  *   **A. It's a Break.** (Social buffering introduces norms/logic not reducible to FEP.) → **LEAF 4: Social Enactivist**
      *   *Position:* You use PP tools, but society isn't just a big brain. Norms aren't priors.
      *   *Vibe:* Extended mind meets critical theory.
  *   **B. It's Still FEP.** (Social systems minimize free energy too.) → **LEAF 5: Pragmatic Instrumentalist**
      *   *Position:* Everything is FEP if you squint hard enough, but you don't care about the ontology.
      *   *Vibe:* "Shut up and calculate."

  ---

  ### NODE 6: The Escrow Claim (For Ontological Realists)
  **Same question: Is social buffering of error (Epistemic Escrow) compatible with FEP, or does it break the individualist assumption?**

  *   **A. It Breaks FEP.** (The system boundary stops at the skin.) → **LEAF 6: The Hard Individualist** [UNOCCUPIED]
      *   *Status:* **Undefended/Weird.** If blankets are real and universal, why stop at the skin? Usually, people who buy real blankets go all the way.
  *   **B. It's Compatible.** (Groups have blankets too.) → *Go to Node 7*

  ---

  ### NODE 7: The Scope Claim (The Final Split)
  **Does FEP apply only to metabolically bounded living systems, or to *anything* that maintains a steady-state (thermostats, corporations, rocks)?**

  *   **A. Life Only.** (Metabolism is special.) → **LEAF 7: Bio-FEP Realist**
      *   *Position:* FEP is the principle of life, not physics. Thermostats don't have beliefs.
      *   *Vibe:* Biological naturalist.
  *   **B. Universal.** (Everything resists entropy.) → **LEAF 8: FEP Fundamentalist**
      *   *Position:* Pan-psychism adjacent. A thermostat has a generative model.
      *   *Vibe:* Hard-core Friston.

  ---

  ### Summary of Leaves & Gaps

  1.  **Neuro-PP Realist:** Literal Bayes, Blankets = Tools.
  2.  **PP Skeptic:** Metaphor, Dark Room = Fatal.
  3.  **The Tragic Realist:** Literal Bayes, Real Blankets, Dark Room = Fatal. **[FLAG: Incoherent]**
  4.  **Social Enactivist:** Metaphor, Escrow = Break.
  5.  **Pragmatic Instrumentalist:** Metaphor, Escrow = Compatible.
  6.  **The Hard Individualist:** Real Blankets, Escrow = Break. **[FLAG: Undefended]**
  7.  **Bio-FEP Realist:** Real Blankets, Escrow = Compatible, Scope = Bio.
  8.  **FEP Fundamentalist:** Real Blankets, Escrow = Compatible, Scope = Universal.

  ### Notes for Discussion
  *   **Indistinguishable Pairs:** It's hard to seperate **Leaf 5 (Pragmatic Instrumentalist)** and **Leaf 8 (Fundamentalist)** in practice. Both apply FEP everywhere, but one cares about truth and the other cares about utility. In a seminar, they'll sound identical until you ask about ontology.
  *   **The Escrow Twist:** Most people haven't thought about **Epistemic Escrow**. If you pick Leaf 4, you're claiming social norms constrain prediction error in a way physics doesn't. That's a big claim. Defend it.
  *   **Unoccupied Combos:** Notice Leaf 3 and 6? Basically nobody claims Markov blankets are *real* but then refuses to apply them to groups or admits the theory fails cognition. If you're there, you're either missing something or you're about to publish a bombshell.

