  ### 1. Severity Ranking of Tensions

  #### **Severity 1: The Trilemma (1) + (2) + (3)**
  *   **The Conflict:** You cannot simultaneously maximize Expected Utility, treat value as unbounded/linear in lives, and reject fanaticism (tiny-probability, huge-stakes trades).
  *   **The Arithmetic:**
