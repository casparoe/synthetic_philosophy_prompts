  4.  **Dismiss the Rest:** Note that the wealth-sensitivity and undefined-expectation worries are secondary to this core structural fix.

  This allows you to keep your EU machinery (1), keep your moral intuitions (3, 7), and keep your long-termist mission (2), by refining the arithmetic of (2) to match the arithmetic of reality.
