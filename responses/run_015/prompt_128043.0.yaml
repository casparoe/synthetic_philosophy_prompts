answer: |-
  **Project Title:** Ubuntu Boundaries: Taxonomizing Constitutive Relations

  **The Pitch**
  So, me and my friend got into it last night over ubuntu—like, is the idea that i am because we are actually doing philosophical work or just a nice vibe? I think people gloss over the real problem: relational theories never specify which relations are constitutive. Is it mutual recogntion, shared practices, or just causal interdependance? Without that you can't tell if an isolated person is still a person, or whether some tightly integrated system counts as one.

  **The Core Question**
  Can we taxonomize the constitutive relations and draw a non-arbitrary boundary for marginal cases—isolation, severe disability, future generations—without collapsing into liberal individualism or an overly inclusive communitarianism?

  **Why the Standard Debate Doesn't Settle It**
  The usual individualism-vs-communitarianism framework is too blunt. Individualism says the self is prior to the end; communitarianism says the community defines the good. But ubuntu-style relationalism claims the self is *ontologically* dependent on relations. The problem isn't whether relations matter, it's *which ones*. If you don't specify, the theory is unfalsifiable. It either excludes too many (the hermit isn't a person) or includes too much (a server cluster is a person). We need to move past the vibe check and into the mechanics.

  **Method & Timeline (4 Months)**
  *   **Month 1: Framing the Taxonomy.** Map out the possible relations. Distinguish between normative relations (recogntion, respect) and descriptive ones (causal interdependance, biological reliance). The goal is a grid of relation-types.
  *   **Month 2: Relational Disability Philosophy.** Compare the taxonomy against existing relational models in disability philosophy. They've already wrestled with dependency and personhood. This keeps me from reinventing the wheel or ignoring the political stakes.
  *   **Month 3: Testing Hard Cases.** Run the taxonomy against the boundary cases. The hermit, the comatose patient, the AI swarm, future generations. See where the lines break.
  *   **Month 4: Writing.** Draft the paper. Focus on the argument that precision doesn't kill the spirit of ubuntu, it saves it from incoherence.

  **Success vs. Failure**
  *   **Success:** A worked-out taxonomy that handles at least two hard cases without sliding back into "actually, individuals are primary" or "actually, everything is connected so everything is a person."
  *   **Failure:** Admitting that relationalism inherently requires vagueness to function, or that any precise boundary inevitably replicates liberal exclusion. Honestly, even that negative result is useful, but the goal is a constructive model.

  **Scope Check**
  Four months is tight but doable because this is conceptual legwork. No travel, no archival work, no empirical data collection. It's all text-based analysis and argument mapping. The risk is getting stuck in the definitions during Month 1, but keeping the focus on the *boundary cases* in Month 3 should force a decision. It's a desk project, pure and simple.
