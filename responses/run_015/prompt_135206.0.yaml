answer: |-
  This is a classic friction point in advanced philosophy of language. Your fellow student is wielding a slogan ("truth is not a property") as a metaphysical trump card, but they are likely conflating the *status of the truth predicate* with the *metaphysics of semantic relations*. Your worry—that deflationary truth often covertly relies on inflationary reference/satisfaction—is essentially Hartry Field's famous critique of Tarski.

  To help you regain dialectical footing, here is a taxonomy of the slogan "truth is not a property," disambiguated into the four readings you requested. Each entry includes a verdict on whether it addresses your specific concern about material adequacy and satisfaction.

  ### Menu of Readings: "Truth Is Not a Property"

  #### 1. The Natural Kind Reading
  *   **Precise Formulation:** The predicate "is true" does not pick out a natural kind property with a hidden essence discoverable by empirical science (analogous to how "water" picks out H₂O).
  *   **Trivial or Substantive?** Largely trivial. Almost all parties (including many inflationists) agree truth is not a *natural* kind. It is typically categorized as a logical, normative, or semantic property.
  *   **Deflationary Defensibility:** Fully defensible. Deflationists insist truth has no "hidden nature."
  *   **Verdict on Your Worry:** **Changes the Subject.**
      *   *Analysis:* Agreeing that truth is not a *natural kind* does not entail that the relation of *satisfaction* (linking words to world) is not a substantive, causal, or physical relation. You can maintain that truth is not a natural kind while insisting that *reference* is a causal-historical relation that requires substantive metaphysical grounding. This reading does not undermine your objection; it merely clarifies that the grounding you seek need not be "natural" in the chemical sense.
      *   *Compatibility:* **Compatible** with retaining a robust account of satisfaction.

  #### 2. The Explanatory Impotence Reading
  *   **Precise Formulation:** The concept of truth plays no irreducible explanatory role in a theory of meaning, belief, or successful action (e.g., we do not explain why an agent succeeded by citing the "truth" of their belief, but rather by citing the specific content).
  *   **Trivial or Substantive?** Substantive claim in philosophy of mind and semantics.
  *   **Deflationary Defensibility:** Core tenet of Horwich-style minimalism.
  *   **Verdict on Your Worry:** **Begs the Question.**
      *   *Analysis:* Your fellow student uses this to imply that if truth explains nothing, nothing *else* in the semantic machinery needs to be substantive. This is a non-sequitur. Field's critique is precisely that deflationary truth *cannot* do explanatory work *unless* we have a substantive theory of reference/satisfaction to underwrite it. Denying truth an explanatory role does not dissolve the requirement for satisfaction to be metaphysically grounded; it merely shifts the explanatory burden to satisfaction.
      *   *Compatibility:* **Compatible** with retaining a robust account of satisfaction (in fact, it *demands* it, per Field).

  #### 3. The Metaphysical Nihilist Reading
  *   **Precise Formulation:** There is literally no property of truth; the predicate "is true" is not a genuine property-ascribing predicate (it is logically redundant, prosentential, or expressivist).
  *   **Trivial or Substantive?** Substantive claim in metaphysics and logic.
  *   **Deflationary Defensibility:** Defensible within strong deflationism (e.g., Brandom, prosentential theory), though controversial.
  *   **Verdict on Your Worry:** **Category Error (on their part).**
      *   *Analysis:* This is likely the reading your student is invoking when they mention a "category mistake." However, they are misapplying it. Even if "is true" does not denote a property, Tarski's material adequacy condition requires that we define truth via *satisfaction*. Satisfaction *is* a relation between objects and sequences. Claiming "truth is not a property" does not eliminate the need to explain how satisfaction holds. If satisfaction is a relation, it has a metaphysical status. If that status is substantive (e.g., causal), your worry stands regardless of whether "truth" itself is a property.
      *   *Compatibility:* **Compatible** with retaining a robust account of satisfaction. One can be a nihilist about the property of *truth* while being a realist about the relation of *reference*.

  #### 4. The Logical Exhaustion Reading
  *   **Precise Formulation:** The concept of truth is exhausted by the Disquotational Schema (T-schema); the instances of the schema are analytically true and require no further grounding in correspondence or satisfaction relations.
  *   **Trivial or Substantive?** Substantive claim about the nature of logical truth and semantic theory.
  *   **Deflationary Defensibility:** The central dogma of deflationism.
  *   **Verdict on Your Worry:** **The Core Disagreement.**
      *   *Analysis:* This is the only reading that directly attempts to undermine your worry, but it does so by *stipulation* rather than argument. The deflationist claims the T-schema is primitive. You are asking *what makes the T-schema hold*. If the T-schema holds because of a substantive satisfaction relation, deflationism about truth is compatible with inflationism about satisfaction. If the deflationist insists the T-schema needs *no* making-true relation, they are rejecting the demand for material adequacy in favor of logical stipulation.
      *   *Compatibility:* **Incompatible.** If this reading is adopted, your objection is rendered "moot" only because the deflationist has refused to play the game of semantic metaphysics. However, this leaves Tarski's material adequacy condition unfulfilled in a substantive sense.

  ---

  ### Strategic Synthesis for the Reading Group

  Your fellow student is committing a **scope fallacy**. They are inferring that because the *global property of truth* is deflated, the *local semantic relations* (satisfaction, reference) must also be deflated or metaphysically innocent.

  **The Argument You Should Deploy:**
  Distinguish between **Deflationism about Truth** and **Deflationism about Reference**.

  1.  **Concede the Slogan:** Grant them that "truth is not a substantive property" (Readings 1 & 2). Tell them you are not arguing for a correspondence *theory of truth*.
  2.  **Pivot to Tarski:** Remind the group that Tarski did not define truth directly; he defined it in terms of *satisfaction*.
  3.  **Deploy Field's Critique:** State clearly: *"Tarski reduced truth to satisfaction. Deflationists reduce truth to disquotation. But disquotation only works if the terms refer. If 'reference' or 'satisfaction' is a substantive, causal relation between language and world, then the 'minimal' theory of truth is parasitic on a 'robust' theory of reference."*
  4.  **The Trap:** If they insist satisfaction is *also* deflated (i.e., there is no substantive relation between words and world), they face the problem of **normativity**. Without a substantive link, why is "Snow is white" satisfied by snow rather than grass? If they cannot answer this without appealing to a substantive relation, your worry stands: the deflationary account presupposes the inflationary machinery it claims to render unnecessary.

  **Suggested Intervention Script:**
  > "I'm happy to grant that 'truth' isn't a natural kind property. But Tarski's material adequacy condition requires that we derive the T-schema from a definition of *satisfaction*. My worry isn't about the property of truth; it's about the relation of satisfaction. If we say 'truth is not a property' to avoid explaining how language hooks onto the world, we aren't solving the problem; we're just hiding the substantive metaphysics inside the notion of satisfaction. Does the deflationist have a deflationary account of *satisfaction*, or are they smuggling in a robust correspondence relation at the level of reference?"

  This moves the debate from a slogan war ("Is it a property?") to a technical semantic question ("What grounds the satisfaction relation?"), which is where your objection actually lives.
