answer: |-
  ### Preliminary Brainstorming: Mechanisms of Distortion and Legitimacy

  Before establishing the desiderata, the following four mechanisms illustrate the core challenge of Normative Preference Filtration (NPF): distinguishing when a psychological mechanism distorts judgment versus when it constitutes valid moral perception.

  1.  **Visceral Disgust**
      *   *Distortion:* An agent opposes a harmless cultural practice (e.g., eating a specific food) solely because it triggers a physical gag reflex, misinterpreting somatic revulsion as moral impurity.
      *   *Legitimate Function:* An agent feels revulsion at the proposal of torture or degradation. Here, the somatic response tracks a violation of human dignity, serving as a rapid alarm system for deep normative boundaries.
  2.  **In-Group Favoritism**
      *   *Distortion:* A hiring manager prefers a candidate from their own university over a more qualified outsider, violating principles of fairness and meritocracy due to tribal affiliation.
      *   *Legitimate Function:* A parent prioritizes their own child's needs over a stranger's. This partiality is not a bias to be corrected but a constitutive element of the special obligations inherent in familial relationships.
  3.  **Status-Quo/Endowment Effect**
      *   *Distortion:* An agent resists redistributive taxation because they feel a stronger pain at losing existing income than the gain of equivalent value, entrenching unjust economic disparities without principled justification.
      *   *Legitimate Function:* An agent resists radical, sudden changes to legal property rights to preserve social stability and reliance interests. Here, the bias toward the status quo functions as a buffer against chaotic utilitarian calculus that undermines long-term planning.
  4.  **Availability Heuristic (Salience)**
      *   *Distortion:* An agent supports draconian security measures after a vivid, rare terrorist attack, ignoring statistical realities of safety, leading to disproportionate policy.
      *   *Legitimate Function:* An agent responds immediately to suffering that is physically proximate (e.g., a child drowning in a pond before them) over abstract statistical suffering. This salience is necessary to trigger action; without it, moral demands would be too diffuse to motivate agency.

  ***

  ### Desiderata for Normative Preference Filtration

  The following criteria define what an adequate theory of Normative Preference Filtration must achieve to successfully separate stable moral commitments from artifacts of bias.

  #### I. Explanatory Phenomena
  *The theory must account for specific classes of judgment where the line between bias and principle is contested. For each, it must preserve a specific distinction.*

  1.  **The Ideology/Principle Distinction (Social Position)**
      *   **Phenomenon:** Agents sincerely endorse moral views that correlate strongly with their socioeconomic status or power position (e.g., a beneficiary of a system claiming it is purely meritocratic).
      *   **Required Distinction:** The theory must distinguish between the *causal genesis* of a belief (social position) and its *justificatory validity* (principle).
      *   **Failure Condition:** Collapsing this distinction leads to the **Genetic Fallacy** (dismissing a truth because of its origin) or **Cynical Reductionism** (assuming all principles are merely disguised interests). The theory must allow that a privileged agent can hold a true moral belief, even if their privilege caused them to hold it.
  2.  **The Substance/Skepticism Distinction (Over-Correction)**
      *   **Phenomenon:** Aggressive bias correction (e.g., stripping away all framing effects, emotional influences, and cultural conditioning) leaves the agent with no substantive moral preferences remaining.
      *   **Required Distinction:** The theory must distinguish between *bias-free* and *human*. It must identify a core of moral agency that survives filtration without requiring the agent to become a disaffected observer.
      *   **Failure Condition:** Collapsing this distinction leads to **Moral Nihilism**. If the filtration process removes all psychologically embedded commitments, the theory fails to guide action. The "filtered" self must still be an agent capable of caring about outcomes.
  3.  **The Interference/Constitution Distinction (Emotional Salience)**
      *   **Phenomenon:** Emotional salience acts as a noise factor in some contexts (e.g., vividness bias in resource allocation) but as a signal in others (e.g., outrage at injustice).
      *   **Required Distinction:** The theory must distinguish between emotion as *interference* (clouding judgment) and emotion as *constitutive insight* (revealing value).
      *   **Failure Condition:** Collapsing this distinction leads to **Cold Rationalism** (ignoring legitimate care responses) or **Sentimentalism** (validating every visceral reaction). The theory must provide criteria for when an emotional response is a bug versus a feature.
  4.  **The Consensus/Truth Distinction (Collective Distortion)**
      *   **Phenomenon:** Group-level dynamics (polarization, echo chambers) produce shared judgments that no individual would hold in isolation, yet these judgments feel objectively correct to the group.
      *   **Required Distinction:** The theory must distinguish between *intersubjective agreement* and *normative correctness*.
      *   **Failure Condition:** Collapsing this distinction leads to **Mob Rule** or **Relativism**. The theory must explain how a whole community can be systematically distorted (e.g., historical acceptance of slavery) without relying on an external "view from nowhere" that is inaccessible to the agents themselves.

  #### II. Consistency Conditions
  *The theory must align with empirical constraints and normative possibilities.*

  1.  **Psychological Realism**
      *   **Condition:** The filtration mechanism cannot demand cognitive capacities humans do not possess. It must accommodate findings that heuristics and framing are ubiquitous and often unconscious.
      *   **Requirement:** The theory cannot require full introspective access to all causal drivers of judgment. It must allow for filtration based on *structural* features of the judgment (e.g., stability across frames) rather than requiring the agent to identify the bias internally.
  2.  **The Possibility of Moral Progress**
      *   **Condition:** Present preferences must be revisable in light of future reflection or new information.
      *   **Requirement:** The theory must define a "critical standpoint" that is internal enough to motivate change but external enough to critique current norms. It must explain how an agent can recognize a past preference as biased without simply replacing it with a new bias.
  3.  **Compatibility with Reasonable Pluralism**
      *   **Condition:** Disagreement does not always imply bias.
      *   **Requirement:** The theory must distinguish between *reasonable divergence* (different weightings of compatible values) and *systematic distortion* (errors in processing). It cannot pathologize every deviation from the theorist's own normative conclusions. If two agents filter their preferences and still disagree, the theory must tolerate this without declaring one "unfiltered."

  #### III. Tensions and Trade-Offs
  *Pairs of desiderata that appear jointly unsatisfiable or create significant structural tension.*

  1.  **Transparency vs. Opacity**
      *   **Tension:** The **Psychological Realism** condition acknowledges that many biases are structurally invisible from the inside (e.g., implicit associations). However, the **Moral Progress** condition requires agents to recognize and correct these biases.
      *   **Explanation:** If a bias is truly invisible to the agent, how can the agent's own reflection filter it? Relying on external correction violates agent autonomy; relying on internal reflection assumes a transparency that psychology denies. A theory must explain how we can correct what we cannot see without surrendering moral agency to an external authority.
  2.  **Endorsement vs. Adaptation**
      *   **Tension:** The **Substance/Skepticism** condition seeks to preserve the agent's reflectively endorsed preferences. However, the **Ideology/Principle** condition requires correcting preferences formed under unjust conditions (adaptive preferences).
      *   **Explanation:** Agents often sincerely endorse preferences that accommodate their own oppression (e.g., preferring limited roles due to socialization). If the theory respects reflective endorsement, it validates the adaptive preference. If it corrects the adaptive preference, it overrides the agent's sincere endorsement. Satisfying both autonomy (endorsement) and welfare (correction) simultaneously is structurally difficult.
  3.  **Universality vs. Context**
      *   **Tension:** The **Consensus/Truth** condition requires identifying collective distortion, which implies a universal standard. The **Reasonable Pluralism** condition requires respecting contextual value differences.
      *   **Explanation:** The criteria used to filter "collective distortion" may themselves be products of a specific cultural context. A theory risks imposing a specific cultural bias under the guise of "universal filtration." Ensuring the filtration criteria are not themselves biased is a recursive problem.

  #### IV. Comparative Assessment of Existing Approaches
  *Diagnostic evaluation of how standard frameworks fare against these desiderata.*

  | Approach | Most Likely Violated Desideratum | Explanation of Failure |
  | :--- | :--- | :--- |
  | **Preference-Satisfaction** | **Endorsement vs. Adaptation** | This approach takes revealed preferences as the metric of value. It lacks the resources to distinguish between a stable commitment and an adaptive preference formed under coercion. It collapses the *Ideology/Principle* distinction by treating the outcome of social conditioning as morally authoritative. |
  | **Kantian Rationalist** | **Interference/Constitution (Emotion)** | By prioritizing pure rational coherence, this approach often categorizes emotional salience as pathological interference. It risks violating the *Substance/Skepticism* condition by filtering out so much human psychology that the remaining "rational agent" lacks the motivational structure to care about specific moral outcomes. |
  | **Contextualist Care-Ethical** | **Consensus/Truth (Collective)** | By grounding morality in local relationships and community norms, this approach struggles to identify *Collective Distortion*. If the "care" network itself is corrupted (e.g., a community caring only for its own at the expense of outsiders), the theory lacks an external lever to critique the shared judgment, risking the *Consensus/Truth* collapse. |

  ### Summary of Framework Requirements
  An adequate Normative Preference Filtration theory must be **procedural** (focusing on how preferences are formed and tested rather than just their content), **recursive** (allowing the filtration criteria themselves to be subject to filtration), and **hybrid** (incorporating both rational coherence and emotional resonance). It must avoid the trap of assuming the theorist's own preferences are the "filtered" baseline, instead offering a method for agents to test their own commitments against counterfactual framing, diverse perspectives, and stability over time.
