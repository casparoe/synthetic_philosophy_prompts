prompt: |-
  You are an expert in normative ethics and moral psychology with training in both philosophical argumentation and empirical work on judgment and decision-making. Before you construct your answer, take five minutes to brainstorm: list at least four distinct mechanisms by which a moral judgment could be distorted by non-rational factors without the agent recognizing the distortion, and for each, sketch a case in which that same mechanism might plausibly function not as a bias but as a legitimate component of moral perception.

  I am developing a framework I call normative preference filtration — the problem of separating an agent's stable, reflectively endorsed moral commitments from judgments that are artifacts of framing effects, status-quo bias, in-group loyalty, adaptive preference formation, or emotionally salient but non-representative exemplars. The aim is not to recover some hypothetical "pure" preference set, but to specify what a normative theory must deliver if it is to distinguish, in a principled and non-ad hoc way, between preferences that should carry moral weight and biases that should be corrected or discounted.

  Write the full set of desiderata that any adequate theory in this area must satisfy. Structure your response as follows:

  First, list the explanatory phenomena the theory must handle — including at least: (a) cases where agents sincerely endorse a moral view that tracks social position rather than principle; (b) cases where bias-correction seems to eliminate so much that no substantive moral preferences remain; (c) cases where a structural feature such as emotional salience operates as bias in one domain but as legitimate moral perception in another; and (d) cases of collective distortion, where group-level dynamics produce shared judgments that no individual would hold in isolation. For each, state the specific distinction the theory must preserve and why collapsing that distinction would be a failure.

  Second, specify the consistency conditions: what general findings from moral psychology about heuristics, framing, and social influence the theory must accommodate without contradiction; what conditions must hold for moral progress to be possible (i.e., for present preferences to be revisable); and how the theory must remain compatible with reasonable pluralism about value without treating every disagreement as a bias on one side.

  Third, flag any pair of desiderata you suspect are jointly unsatisfiable — for instance, whether full first-person transparency about one's own biases is compatible with the claim that some biases are structurally invisible from the inside, or whether preserving every agent's reflective endorsement is compatible with correcting adaptive preferences formed under unjust conditions. Explain the tension precisely.

  Fourth, briefly indicate — not as a full scorecard, but to expose the fault lines — how a preference-satisfaction approach, a Kantian rationalist coherence approach, and a contextualist care-ethical approach fare against your list. Identify which desideratum each approach is most likely to violate and why.

  Present your answer in a structured format (numbered list or table with explanations), think step by step, and do not provide a bibliography, reading list, or citations to specific authors and works. Keep the weight on the criteria and their motivating cases rather than on historical exposition.
