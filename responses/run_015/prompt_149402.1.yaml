prompt: |-
  hey, quick sanity check for my diss chapter on rational belief and objective chance. I've been reading up on Lewis's Principal Principle and I'm stuck on what feels like a basic tension. The way I understand it, if I know the objective chance of heads is .5, then PP says my credance should be exactly .5, and the only evidence I'm allowed to combine with that is admissable evidence—stuff that doesn't directly concern the actual flip. But that seems to block Bayesian updating entirely: if I flip the coin ten times and see heads every time, that observational data is about the actual flips, so by the admissability restriction I should just ignore it and stay at .5? Or does the principle actually say my credance in the chance being .5 should update, while my credance in the next heads stays pinned?

  I'm trying to argue that the PP is essentially anti-Bayesian because it locks credances to chance values regardless of empirical frequency data, but my advisor said I'm conflating levels. Can you give me a committed answer—don't just lay out both interpretations? I want to know: is the principle genuinely in conflict with standard Bayesian conditioning on outcomes, or is the confusion just in how I'm applying the admissability clause? And if it's the latter, what's the specific mistake—am I treating outcome-evidence as admissable when it's actually inadmissable, or vice versa?

  Also, if the answer depends on whether we take chances to be Humean frequencies vs propensities, does that change the verdict? I don't need a bibliography or citations, just a clear take with reasons.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** David Lewis's Principal Principle (PP) and its relationship to Bayesian updating.
      *   **Core Tension:** The user thinks PP forbids updating on empirical data (e.g., 10 heads in a row) because such data is "inadmissible," forcing credence to stay at the known chance (0.5). They suspect PP is anti-Bayesian.
      *   **Advisor's Feedback:** The advisor claims the user is "conflating levels."
      *   **Constraint 1 (Crucial):** "Give me a committed answer—don't just lay out both interpretations." I need to take a stand.
      *   **Constraint 2:** "I don't need a bibliography or citations, just a clear take with reasons."
      *   **Specific Questions:** Is PP genuinely in conflict with Bayesian conditioning? Or is it a misunderstanding of admissibility? If the latter, what's the specific mistake (treating outcome-evidence as admissible vs. inadmissible)? Does the metaphysics of chance (Humean vs. Propensity) change the verdict?

  2.  **Evaluate the Philosophy (The "Truth" of the Matter):**
      *   *What is the Principal Principle?* $C(A | X \& E) = x$, where $X$ is the proposition that the chance of $A$ is $x$, and $E$ is admissible evidence.
      *   *What is Admissible Evidence?* Roughly, evidence that doesn't give information about the outcome *except* through its effect on chance. Historical data (past flips) is typically considered admissible *unless* it bears on what the chance *is*.
      *   *The User's Confusion:* The user thinks seeing 10 heads means you must ignore it and stick to $C(Heads) = 0.5$.
      *   *The Resolution:* If you see 10 heads, you should update your belief about *what the chance is*. If you remain certain the chance is 0.5 despite 10 heads, you are being irrational (dogmatic). But PP applies *conditional on* the chance being 0.5. If the evidence (10 heads) makes you doubt the chance is 0.5, then $X$ (Chance=0.5) is no longer the relevant conditional.
      *   *Advisor's Point:* The advisor is right. The user is conflating $C(Heads)$ with $C(Heads | \text{Chance}=0.5)$.
      *   *Is PP Anti-Bayesian?* No. PP is a constraint on priors (or conditional credences) relating chance to belief. Bayesian updating operates on the evidence. PP tells you how to set credence *given* a chance hypothesis. Bayesianism tells you how to shift weight between chance hypotheses based on evidence.
      *   *Admissibility:* Past outcomes are generally *admissible* evidence. They are not "future-telling." They are inadmissible *only if* they are treated as direct evidence of the specific outcome independent of chance (which they aren't) OR if holding them fixed prevents updating the chance hypothesis. Actually, the standard view is that past history is admissible. The trick is that if past history suggests the chance isn't 0.5, you update the credence in the *chance hypothesis*, not the conditional credence given the chance hypothesis.
      *   *Metaphysics of Chance:* Humean Best Systems (Lewis) vs. Propensities.
          *   *Lewis:* Chances are summaries of history. 10 heads might make the Best System different (chance $\neq$ 0.5). So you update the chance.
          *   *Propensity:* 10 heads is unlikely but possible. If you are *certain* the propensity is 0.5, you must stick to 0.5. But rational agents shouldn't be certain of chance hypotheses.
          *   *Verdict:* The conflict arises from dogmatism about chance, not PP itself. PP works with both, but Lewis's Humeanism makes updating on chance easier (since chance supervenes on frequency).

  3.  **Formulate the Committed Answer:**
      *   **Direct Answer:** Your advisor is right. You are conflating levels. PP is *not* anti-Bayesian.
      *   **The Specific Mistake:** You are treating the proposition "The chance is 0.5" as a fixed certainty rather than a hypothesis subject to updating. You are also likely misunderstanding admissibility: past outcomes *are* admissible evidence, but they bear on *which chance hypothesis is true*, not on the outcome directly given the chance.
      *   **Reasoning:**
          1.  PP is a conditional constraint: $C(A | \text{Chance}(A)=x) = x$.
          2.  Bayesian updating applies to the whole credence function, including the weight you assign to "Chance(A)=x".
          3.  If you see 10 heads, you lower $C(\text{Chance}=0.5)$. You don't violate PP; you just stop conditioning on that specific chance hypothesis as strongly.
          4.  Admissibility: Past data is admissible. It's not "inadmissible" in a way that blocks learning. It's inadmissible only if it implies knowledge of the future *independent* of chance (which it doesn't).
      *   **Metaphysics:** It doesn't fundamentally change the verdict on the logic, but Lewis's Humeanism makes it clearer why you should update the chance hypothesis. Propensity views require you to allow uncertainty about propensities to avoid dogmatism.

  4.  **Drafting the Response (Iterative refinement for tone and constraints):**
      *   *Tone:* Direct, authoritative (as requested), philosophical but clear.
      *   *Constraint Check:* Did I hedge? No. Did I give a bibliography? No. Did I answer the admissibility question? Yes.
      *   *Refining the Admissibility Point:* This is the trickiest part. Lewis says historical evidence is admissible. The user thinks it's inadmissible. I need to correct this. The user thinks "observational data is about the actual flips, so... inadmissible." This is wrong. Inadmissible evidence is things like crystal balls or time travel. Past flips are admissible. *However*, if you condition on "Chance is 0.5" AND "10 Heads", PP says credence in next heads is 0.5. The update happens because "10 Heads" lowers your credence that "Chance is 0.5".
      *   *Refining the "Anti-Bayesian" Claim:* It's false. PP is an initial constraint on priors regarding chance. Bayesianism is the dynamics. They work together.
      *   *Metaphysics:* Keep it brief. Humeanism fits better with frequency updates, but the logic of PP holds either way provided you aren't dogmatic.

  5.  **Final Polish:**
      *   Start with the verdict: Advisor is right, you are wrong.
      *   Explain the level conflation (Credence in Outcome vs. Credence in Chance).
      *   Explain Admissibility (Past is admissible, it updates Chance, not Outcome given Chance).
      *   Address Metaphysics (Minor nuance, doesn't save the "Anti-Bayesian" claim).
      *   Ensure no hedging ("It depends," "Some philosophers say"). Take the standard Lewisian line.

  6.  **Self-Correction during drafting:** I need to be careful not to say "Past evidence is always admissible." In Lewis's framework, historical evidence is admissible. But if the evidence *entails* the outcome (e.g., looking at the result after it happens), it's inadmissible for predicting that outcome. But for predicting the *next* flip, past flips are admissible. The user's confusion is thinking that *any* evidence about actual flips is inadmissible. I need to clarify that inadmissibility is about *future* information leaking in. Past data is the definition of admissible evidence for Lewis.

      *Wait, let me double check Lewis on admissibility.* Lewis says admissible evidence is evidence that doesn't give information about the future except via chance. Past history is admissible. So the user's claim "observational data is about the actual flips, so... inadmissible" is the core error.
      *Correction:* Actually, there is a nuance. If I know the chance is 0.5, and I see 10 heads, PP says $C(Head_{11} | Ch=0.5 \& 10H) = 0.5$. This is correct. The user thinks this blocks updating. But the total credence $C(Head_{11} | 10H)$ is a weighted sum over chance hypotheses. $C(Head_{11} | 10H) = \sum C(Head_{11} | Ch=x \& 10H) \cdot C(Ch=x | 10H)$. Since $C(Ch=0.5 | 10H)$ drops, the total credence shifts.
      *Okay, the plan is solid.*

  7.  **Final Review against constraints:**
      *   Committed answer? Yes.
      *   No bibliography? Yes.
      *   Address admissibility specifically? Yes.
      *   Address metaphysics? Yes.

      *Let's write it.*
answer: |-
  Your advisor is right: you are conflating levels, and your claim that the Principal Principle (PP) is anti-Bayesian is false. The tension you feel is not a flaw in Lewis's framework, but a misunderstanding of how the principle interacts with conditionalization.

  Here is the committed verdict: **The Principal Principle is fully compatible with standard Bayesian updating.** The conflict you perceive arises because you are treating a specific chance hypothesis as a certainty rather than a hypothesis, and you are misidentifying what counts as inadmissible evidence.

  Here is the breakdown of the specific mistakes and why the principle holds.

  ### 1. The Level Conflation
  You are conflating **conditional credence given a chance hypothesis** with **unconditional credence in the outcome**.

  The PP states: $C(A \mid \text{Chance}(A) = x \ \& \ E) = x$.
  This is a constraint on your credence *conditional on* the chance being $x$. It does not dictate your unconditional credence $C(A)$ if you are unsure about what the chance is.

  In your coin flip scenario:
  1.  **Prior to flipping:** You might have a distribution of credence over various chance hypotheses (e.g., 80% sure the chance is 0.5, 20% sure the coin is biased toward heads).
  2.  **After 10 heads:** You Bayesian update on your *chance hypotheses*. The evidence (10 heads) drastically lowers your credence that $\text{Chance} = 0.5$ and raises your credence that $\text{Chance} > 0.5$.
  3.  **The PP's Role:** The PP tells you that *if* you condition on the hypothesis that $\text{Chance} = 0.5$, your credence in heads must be 0.5. But since your credence *in that hypothesis* has dropped, your overall credence in the next flip being heads rises.

  The PP locks your credence to the chance value *only within the scope of the supposition that you know the chance*. It does not prevent you from updating how likely that supposition is. If you insist on remaining certain that the chance is 0.5 despite 10 heads, that is not a failure of Bayesianism; it is dogmatism (assigning probability 1 to an empirical hypothesis), which Bayesianism forbids anyway.

  ### 2. The Admissibility Mistake
  You asked specifically whether you are treating outcome-evidence as admissible when it is inadmissible, or vice versa. **You are treating admissible evidence as if it were inadmissible.**

  For Lewis, **past observational data is paradigmatically admissible.** Inadmissible evidence is information about the future that bypasses chance (e.g., looking at a time-traveler's log of the outcome, or a crystal ball).

  *   **Your Error:** You wrote: *"that observational data is about the actual flips, so by the admissibility restriction I should just ignore it."*
  *   **The Correction:** Past flips are admissible precisely because they are about the *past*. They influence your credence in the *next* flip only by influencing your credence about the *chance*.

  When you condition on "10 Heads," you are adding admissible evidence $E$. The PP applies to $C(\text{Next Heads} \mid \text{Chance}=0.5 \ \& \ \text{10 Heads})$. This value remains 0.5. This is correct. It means "If the coin is fair, the past streak doesn't matter." But your total credence $C(\text{Next Heads} \mid \text{10 Heads})$ is a weighted average across all chance hypotheses. Since the weight of the "Fair Coin" hypothesis drops, your total credence shifts. The PP does not block this; it governs the terms inside the weighted average.

  ### 3. Does the Metaphysics of Chance Matter?
  You asked if the verdict changes depending on whether chances are Humean frequencies or propensities. **No, it does not change the verdict on the logic of PP**, though it changes how easily you justify updating the chance hypothesis.

  *   **Humean (Lewisian) Chance:** Chances supervene on the total history of outcomes. If you see 10 heads, it is objectively more likely that the Best System (and thus the chance) is different. Updating your credence in the chance hypothesis is straightforward because the evidence directly bears on the truth conditions of the chance claim.
  *   **Propensity Chance:** Chances are intrinsic dispositions. It is possible to have a propensity of 0.5 and produce 10 heads. However, rational agents should not be certain of propensity values. If you allow *any* uncertainty in your prior about the propensity, Bayesian updating works exactly the same way. The PP still constrains your credence conditional on the propensity, but it does not prevent you from doubting the propensity based on frequency data.

  ### Summary for Your Chapter
  Do not argue that PP is anti-Bayesian. Instead, argue that PP functions as a **bridge principle** that constrains priors regarding chance hypotheses, while Bayesian conditionalization handles the dynamics of empirical learning.

  Your specific correction is this: You are treating the proposition "The chance is 0.5" as a fixed background fact. It is not. It is a hypothesis $H$. The PP governs $C(\text{Outcome} \mid H)$. Bayesianism governs $C(H \mid \text{Evidence})$. Seeing 10 heads updates $C(H)$, not the conditional link defined by PP. Past data is admissible evidence that updates the weight of the chance hypothesis, not inadmissible evidence that must be ignored.
