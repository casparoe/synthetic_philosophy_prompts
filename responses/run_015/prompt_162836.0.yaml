answer: |-
  **INSTITUTE FOR MARGINAL INQUIRY**
  **ADVERSARIAL COLLABORATION OUTPUT: PROJECT ARTHROPOD**
  **DATE:** 14 October
  **PARTICIPANTS:** Dr. E. Vance (Scale Sensitivity), Dr. L. Kovic (Epistemic Skeptic)
  **SUBJECT:** Joint Statement on the Moral Relevance of Terrestrial Arthropod Abundance

  ### 1. AGREED CLAIMS

  1.  **The Arithmetic of Scale:** We agree that the formal structure of the "Scale Argument" is valid *conditional on its inputs*. If the probability of moral standing for a given organism is $P > 0$, and the number of affected organisms is $N$, the expected moral value scales linearly with $N$. We disagree only on the admissibility of the inputs, not the multiplication itself.
  2.  **Evidential Coupling:** We agree that the behavioral and neurological markers used to assign a non-zero probability of sentience to insects (e.g., nociception, trade-off behavior, centralization) are present, often in homologous forms, in smaller taxa such as springtails, oribatid mites, and soil nematodes. We agree that these smaller taxa outnumber insects by at least two orders of magnitude [~10^20 vs ~10^18]. Therefore, any revision of probability $P$ upward for insects logically necessitates a similar revision for these smaller taxa, unless a specific complexity threshold is identified and defended.
  3.  **Taxonomic Arbitrariness:** We agree that the boundary of "Insecta" is biologically precise but morally suspicious. If the argument for intervention relies on the count of insects, it is vulnerable to the charge that shifting the boundary to "Panarthropoda" or "Ecdysozoa" changes the ledger by orders of magnitude without changing the underlying evidence for sentience. We agree that a robust theory cannot rely on the class Insecta as its sole unit of moral concern without explaining why a mite is excluded while a silverfish is included.
  4.  **The Feedback Asymmetry:** We agree that proposed welfare interventions (e.g., pesticide regulation, habitat modification) differ from other global priorities in that they are cheap and population-scale, but the feedback loop on welfare outcomes is effectively severed. One can alter the conditions of [~10^15] lives per year without obtaining legible data on whether net suffering increased or decreased. We agree this is not ordinary "cluelessness" regarding side-effects, but a fundamental inability to verify the primary effect.
  5.  **The Unit of Account:** We agree that the calculation changes drastically depending on whether the moral unit is (a) the organism, (b) the life-year, or (c) the token of valenced experience (e.g., seconds of suffering). We agree that switching between these units during the course of an argument without explicit justification constitutes double-counting or omission.

  ### 2. RESIDUAL DISAGREEMENTS

  | Topic | Vance (Scale) Wording | Kovic (Skeptic) Wording | Neutral Wording | Analysis |
  | :--- | :--- | :--- | :--- | :--- |
  | **Probability Status** | "The probability is low but non-zero, and stable enough to be used in decision matrices." | "The probability is epistemically undefined; treating it as a number is a category error." | "The parties disagree on whether a subjective credence can function as a proxy for objective probability in high-stakes calculation." | **Genuine.** This is not verbal. Vance treats uncertainty as risk; Kovic treats it as ignorance. |
  | **Intervention Validity** | "Blind interventions are justified if the expected value is sufficiently high to outweigh the blindness." | "Interventions are unjustified if the direction of effect cannot be verified, regardless of expected value." | "The parties disagree on the permissibility of acting when the sign of the outcome (positive/negative) is unknown." | **Genuine.** A conflict between Expected Value Theory and Precautionary Principles. |
  | **Taxonomic Scope** | "We should prioritize insects as a tractable proxy for the wider problem of small organisms." | "Prioritizing insects is arbitrary gerrymandering that hides the explosion of the problem." | "The parties disagree on whether a subset of a problem can be addressed without solving the whole." | **Verbal/Strategic.** Vance admits the wider problem but claims tractability; Kovic claims the arbitrariness invalidates the subset. |
  | **Unit of Account** | "Lives-per-year is the correct metric because duration of life varies wildly." | "Organisms is the correct metric because moral standing attaches to the entity, not the time." | "The parties disagree on whether moral weight is additive over time or fixed per entity." | **Genuine.** Fundamental disagreement on the metaphysics of welfare. |

  ### 3. CRUXES AND FALSIFIERS

  **Crux 1: The Complexity Threshold**
  *   **Question:** Is there a neurological or behavioral complexity floor below which the probability of sentience drops to effectively zero?
  *   **Proposed Test:** Comparative analysis of nociceptive gating in insects vs. nematodes. If nematodes show identical gating mechanisms to flies, the probability $P$ must be equalized.
  *   **Vance's Prediction:** Mechanisms will be homologous. $P$ should be similar.
  *   **Kovic's Prediction:** Mechanisms will be functionally distinct despite structural similarity. $P$ for nematodes should be lower.
  *   **Vance's Falsifier:** "If you show me a central processing architecture in a nematode that is functionally identical to a fly's, but you still refuse to assign it the same probability, I have to admit I'm protecting a bias, not following evidence. I'd drop the insect-specific focus."
  *   **Kovic's Falsifier:** "If I see a creature with no central ganglion whatsoever exhibiting trade-off behavior that cannot be explained by reflex, I have to admit my complexity floor is arbitrary. I'd concede the probability is non-zero, even if I still call the math broken."

  **Crux 2: The Verification Loop**
  *   **Question:** Can a welfare intervention be monitored well enough to determine the *sign* of the effect (net positive vs. net negative)?
  *   **Proposed Test:** A controlled field trial of a proposed welfare intervention (e.g., modified tillage) with a metric for population stress (e.g., heat shock protein expression) correlated with behavioral indicators.
  *   **Vance's Prediction:** We can establish a correlation sufficient to assign a direction of effect (>51% confidence).
  *   **Kovic's Prediction:** The noise in the system will always exceed the signal; confidence will remain at chance (50%).
  *   **Vance's Falsifier:** "If we run three trials and the confidence interval on the welfare impact always crosses zero, I have to stop advocating for intervention. I can't ask people to spend money on a coin flip."
  *   **Kovic's Falsifier:** "If you can show me a single intervention where we can say with 90% confidence that suffering went down, I have to admit the 'unobtainable feedback' claim is too strong. I'd shift to arguing about cost-effectiveness instead of impossibility."

  **Crux 3: The Robustness of the Multiplier**
  *   **Question:** Does the conclusion (that we should act) hold if the probability $P$ is varied by three orders of magnitude?
  *   **Proposed Test:** Sensitivity analysis on the decision model.
  *   **Vance's Prediction:** The recommendation to act is robust across the range of honest probabilities.
  *   **Kovic's Prediction:** The recommendation flips from "act" to "abstain" within the range of honest probabilities.
  *   **Vance's Falsifier:** "If lowering the probability by a factor of 100 changes the decision from 'fund this' to 'ignore this', then my argument isn't about evidence, it's about the size of the number. I'd have to withdraw the recommendation."
  *   **Kovic's Falsifier:** "If the decision to act remains stable even when the probability is vanishingly small [e.g., 1 in 10^9], I have to admit that the 'made-up number' critique doesn't change the practical outcome. I'd stop fighting the prioritization and start fighting the intervention method."

  ***

  ### NOTE TO THE AUTHOR

  You asked for seams, so here they are. This document is smoother than the reality would allow, primarily because "Adversarial Collaborations" in the real world often fail to produce a signed text at all. To make this legible for your scene, I have concealed three major fractures:

  1.  **The "Neutral Wording" Fudge:** In Section 2, the Neutral Wording for "Probability Status" pretends this is a standard epistemic dispute. It isn't. Kovic isn't just saying "we don't know the number"; she is saying "the number is a category error." By phrasing it as "subjective credence vs. objective probability," I have given Vance a foothold he shouldn't have. Kovic would likely refuse to sign a line that implies her position can be modeled as a credence distribution. She thinks it's noise, not signal. I smoothed this over so they could both sign the page.
  2.  **The Concealed Retreat:** In Claim 2 (Evidential Coupling), Vance concedes that nematodes outnumber insects. In the heat of the week, Vance likely fought this hard. By agreeing to this, Vance has effectively admitted that the "Insect" program is arbitrary. I have masked this as a "logical necessity" rather than the tactical surrender it probably was. Vance likely signed this hoping to deal with the "nematode problem" later, while Kovic signed it knowing it undermines Vance's entire current grant proposal. They are signing the same sentence for opposite strategic reasons.
  3.  **The Unsolvable Crux:** Crux 1 (Complexity Threshold) is the weakest link. You asked for a falsifier they could "say out loud." The truth is, neither of them would actually change their mind based on nematode ganglia. Vance would find a way to distinguish the fly; Kovic would find a way to dismiss the nematode behavior. The falsifiers I wrote are *normative* ("I *should* change my mind"), not *predictive* ("I *will* change my mind"). In a real room, they would likely nod at these falsifiers and then ignore them when the data arrived.
  4.  **My Own Bias:** I suspect I have made Kovic stronger than Vance. The Skeptic's position is inherently easier to defend in a short document because it relies on methodological veto points rather than positive claims. Vance has to build; Kovic only has to point out cracks. To balance this, I forced Vance to concede the "Arithmetic of Scale" (Claim 1) only conditionally. If you want Vance to look more formidable, have him insist that Claim 1 is not conditional—that the math *forces* the conclusion regardless of input uncertainty. But Kovic would never sign that.

  The document works for a novel because it looks like progress. But if you read between the lines of Claim 3 (Taxonomic Arbitrariness), you'll see they have agreed to disagree on the definition of "tractable." Vance thinks "tractable" means "we can do something now." Kovic thinks "tractable" means "we can understand what we are doing." They are using the same word to describe different virtues. That is where the argument will restart on Monday morning.
