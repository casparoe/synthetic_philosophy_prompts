  ### Note on Philosophical Liberties

  This poem leans heavily on the **Gradual Replacement Thought Experiment** (often associated with Hans Moravec or David Chalmers), which posits that if neurons are replaced one-by-one with functionally isomorphic silicon chips, consciousness should persist by induction. The sestina form was chosen specifically to mimic this iterative process: the end-words persist through the stanzas even as their syntactic roles shift, mirroring the argument that identity persists despite material change.

  However, for the sake of the reading group, note the following contested points where the poem takes liberties:

  1.  **The Assumption of Continuity:** The poem assumes the procedure happens while the subject is conscious and continuous ("Halfway through, I stay"). Many critics argue that any interruption or substrate change might break the "chain of causation" required for numerical identity, turning the upload into a mere psychological copy (a "branching" problem).
  2.  **Fading Qualia:** Stanza 4 hints at Chalmers' "Fading Qualia" argument—that behavior might remain the *same* while subjective experience dims or vanishes. The poem leaves this unresolved, whereas some physicalists would argue function *is* experience, leaving no room for fading.
  3.  **The Singular "I":** The envoi packs the tension into a single first-person perspective. This sidesteps Parfit's reductionist view in *Reasons and Persons*, which suggests "identity" doesn't matter; what matters is psychological connectedness. The poem insists on the "hard problem" (is it *me*?) rather than the "soft problem" (does it act like *me*?).

  The form forces a resolution that the philosophy denies: the poem must end, but the argument remains open.
