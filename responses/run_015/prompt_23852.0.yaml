answer: |-
  At a historic university, a statute requires every department to return unspent budget funds to a central pool at year's end rather than carrying them over. All parties agree this was adopted in 1920 to prevent wealthy departments from hoarding resources while others starved, a disparity now eliminated by algorithmic equity audits. Reformers argue the rule is obsolete since hoarding is impossible, and removing it would encourage efficient long-term planning. A Burkean resists not by denying the obsolescence of the anti-hoarding rationale, but by warning that the forced fiscal dependency sustains the university's corporate unity; without this tether, departments would likely evolve into autonomous franchises, eroding the shared institutional identity and habit of cooperation that preserves the university as a single organism against external market fragmentation.

  **Chesterton's Verdict:** Once the reformer knows the historical reason (preventing hoarding) and demonstrates it no longer applies (audits ensure equity), the heuristic licenses removal. The fence was only there to protect against ignorance of the rule's purpose; once that ignorance is cured and the purpose is void, the presumption against interference is discharged.

  **The Burkean Verdict:** The Burkean advises caution despite full knowledge of the original purpose. The commitment doing the work is **systemic interdependence**: the belief that long-settled arrangements accumulate latent functions (like institutional cohesion) that bind the social organism together, regardless of the founder's manifest intent.

  **The Divergent Feature:** The single feature pulling the verdicts apart is the **divergence between the rule's original manifest purpose and its current latent systemic function**. Chesterton looks only at the justification for the fence's erection; Burke looks at the consequences of the fence's existence within the current ecosystem.

  **If the Feature is Removed:** If the rule *only* served the original anti-hoarding purpose and had no secondary cohesive effect, the Burkean resistance would collapse into mere status-quo bias, lacking the structural justification of preserved social complexity.

  **The Strongest Burkean Reply:** To claim that continued resistance is mere bias assumes institutions are machines designed for a single purpose that expires with the designer's intent. Burkeans argue that institutions are organic growths where endurance itself is evidence of hidden utility; to assume we can isolate a rule's "original reason" from its "living function" is the rationalist error itself, ignoring that survival in a complex system often signals value beyond comprehension.
