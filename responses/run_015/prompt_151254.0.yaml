      *   **Role:** Data-Integrity Officer for a multi-site study.
      *   **Context:** Collecting first-person reports from non-communicative patients via semantic neural decoders (cortical activity $\rightarrow$ vocabulary strings).
      *   **Philosophical Framework:** Heterophenomenology (Dennettian). Treat decoded strings as *texts* describing a "heterophenomenological world," not necessarily direct truth about private mental states.
      *   **Task:** Design a reusable decision procedure (ordered sequence of questions/tests) for clinicians/technicians (no philosophical training) to vet strings before dataset entry.
      *   **Requirements:**
          *   Specify sufficient answers for each step.
