answer: |-
  # PROTOCOL VPNT-04: Vetting Procedure for Neural Text (Heterophenomenological Standard)

  **To:** Clinical Technicians, Site Coordinators, Data Entry Staff
  **From:** Office of Data Integrity
  **Subject:** Admissibility Criteria for Decoder-Generated Strings
  **Philosophical Basis:** Heterophenomenology (Treat strings as *reports* of a subject's world, not necessarily *facts* about the external world).

  ## I. Scope and Limitations
  This procedure determines whether a decoded string enters the primary dataset. It is **not** designed to settle:
  1.  **Ontological Truth:** Whether the reported experience matches external reality (e.g., "I see a dragon" is admissible even if no dragon exists).
  2.  **Clinical Veracity:** Whether the report contradicts physiological markers (e.g., "I am calm" despite tachycardia).
  3.  **Metaphorical Intent:** Whether the subject intends a phrase literally or figuratively.

  **Vocabulary Flags:**
  *   **Impoverished:** If the string uses only high-frequency nouns/verbs (e.g., "pain," "stop") lacking qualifiers, flag as `LOW_RES`.
  *   **Metaphor-Prone:** If the string attributes agency to inanimate objects (e.g., "the wall hates"), flag as `ANTHRO`.
  *   **Cross-Modal:** If the string mixes sensory modalities (e.g., "loud color," "tasting sound"), flag as `SYN_ESTH`.

  ---

  ## II. Decision Procedure (Ordered Sequence)

  **Step 1: Signal Confidence Check**
  *   **Question:** Does the decoder's confidence score for this string exceed the site-specific threshold (default >0.85)?
  *   **Sufficient Answer:** Yes/No based on dashboard readout.
  *   **Termination:**
      *   **NO:** **EXCLUDE.** Mark as `NOISE`. Do not enter dataset.
      *   **YES:** Proceed to Step 2.

  **Step 2: Lexical Boundary Verification**
  *   **Question:** Are all tokens in the string present in the approved vocabulary set for this specific decoder model version?
  *   **Sufficient Answer:** Match/No Match via automated script.
  *   **Termination:**
      *   **NO MATCH:** **ESCALATE.** Send to Senior Reviewer. (Indicates potential model drift or hallucination).
      *   **MATCH:** Proceed to Step 3.

  **Step 3: Physiological Exclusion Criteria**
  *   **Question:** Is the patient currently in a neurophysiological state incompatible with semantic generation (e.g., burst-suppression EEG, deep anesthesia, active generalized seizure)?
  *   **Sufficient Answer:** Yes/No based on concurrent EEG/Anesthesia monitor.
  *   **Termination:**
      *   **YES:** **EXCLUDE.** Mark as `PHYSIO_ARTIFACT`. (The brain state cannot support the reported text).
      *   **NO:** Proceed to Step 4.

  **Step 4: Syntactic Coherence Test**
  *   **Question:** Does the string parse as a grammatically valid sentence or fragment in the target language?
  *   **Sufficient Answer:** Pass/Fail via standard NLP parser.
  *   **Termination:**
      *   **FAIL:** **ESCALATE.** Send to Senior Reviewer. (May be poetic, may be noise).
      *   **PASS:** Proceed to Step 5.

  **Step 5: Heterophenomenological Admissibility (The "Truth" Barrier)**
  *   **Question:** Does the content of the string contradict *external* reality or *physiological* markers (e.g., "I am sleeping" while eyes are open; "No pain" while grimacing)?
  *   **Sufficient Answer:** Observation of contradiction or lack thereof.
  *   **Termination:**
      *   **CONTRADICTION OBSERVED:** **ADMITHETEROPHENOMENOLOGICAL FLAG.** Do **NOT** exclude. Enter into dataset with tag `DISCORDANT`.
      *   **NO CONTRADICTION:** Enter into dataset with tag `CONCORDANT`.
      *   **Note:** Technicians are prohibited from excluding data based solely on this step. Exclusion here requires Senior Reviewer override.

  **Step 6: Vocabulary Flagging**
  *   **Question:** Does the string contain cross-modal, metaphorical, or impoverished vocabulary (see Section I)?
  *   **Sufficient Answer:** Technician judgment based on keyword list.
  *   **Termination:**
      *   **FLAG DETECTED:** Apply appropriate tag (`LOW_RES`, `ANTHRO`, `SYN_ESTH`). Proceed to Entry.
      *   **NO FLAG:** Proceed to Entry.

  ---

  ## III. Application to Incoming Reports

  ### Case 1: The Dissociated Report
  *   **Input:** Decoder outputs *"there is no suffering"*.
  *   **Patient State:** Sustained nociceptive reflexes (withdrawal), elevated heart rate, elevated cortisol.
  *   **Decoder Confidence:** 0.92.
  *   **Vocab:** Approved set.
  *   **Neuro State:** Minimally Conscious State (MCS) - semantic generation possible.

  **Procedure Walkthrough:**
  1.  **Signal Confidence:** 0.92 > 0.85. (Pass)
  2.  **Lexical Boundary:** All words approved. (Pass)
  3.  **Physiological Exclusion:** MCS allows semantic processing. (Pass)
  4.  **Syntactic Coherence:** Valid sentence. (Pass)
  5.  **Heterophenomenological Admissibility:** Content ("no suffering") contradicts physiological markers (reflexes/cortisol).
      *   *Protocol Action:* **ADMITHETEROPHENOMENOLOGICAL FLAG.** Tag as `DISCORDANT`.
  6.  **Vocabulary Flag:** "Suffering" is abstract but approved. No cross-modal flags.

  **Unwelcome Answer:**
  The procedure mandates **admission** of the string. Clinicians often view nociceptive reflexes as definitive proof of pain experience. Admitting "there is no suffering" alongside physiological data creates a dataset contradiction that complicates immediate care decisions (e.g., analgesia dosing). The technician may feel they are logging a "lie" or a "machine error."

  **Residual Judgment Call:**
  The procedure settles *admissibility*, but not *weighting*. The residual judgment lies with the Senior Reviewer or Clinician: How much epistemic weight does the neural text carry against the autonomic data? Is this a genuine phenomenological dissociation (pain without suffering), or has the decoder latched onto a "calm" semantic cluster despite nociceptive noise? The protocol forces the data into the record, but cannot resolve the clinical conflict.

  ### Case 2: The Synesthetic Hallucination
  *   **Input:** Decoder outputs *"the ceiling is singing in green"*.
  *   **Patient State:** Minimally Conscious State (MCS).
  *   **History:** No prior artistic training, no known synesthesia, no hallucinogen exposure.
  *   **Decoder Confidence:** 0.88.
  *   **Neuro State:** Stable, no seizures.

  **Procedure Walkthrough:**
  1.  **Signal Confidence:** 0.88 > 0.85. (Pass)
  2.  **Lexical Boundary:** All words approved. (Pass)
  3.  **Physiological Exclusion:** MCS allows semantic generation. (Pass)
  4.  **Syntactic Coherence:** Valid sentence. (Pass)
  5.  **Heterophenomenological Admissibility:** Content contradicts external reality (ceilings do not sing).
      *   *Protocol Action:* **ADMITHETEROPHENOMENOLOGICAL FLAG.** Tag as `DISCORDANT`. (Hallucinations are valid reports of experience).
  6.  **Vocabulary Flag:** "Singing in green" mixes auditory and visual modalities.
      *   *Protocol Action:* Tag as `SYN_ESTH`.

  **Unwelcome Answer:**
  The procedure mandates **admission**. Technicians may suspect the decoder is "dreaming" or overfitting patterns (associating "ceiling" with "green" and "singing" due to training bias). Because the patient has no history of synesthesia, the intuitive assumption is that this is decoder noise, not patient report. However, under heterophenomenology, unless Step 1 or 3 fails, we must treat it as the patient's world.

  **Residual Judgment Call:**
  The distinction between *novel phenomenology* and *decoder artifact* remains unresolved. The procedure accepts the text as a report of *what seems to be the case* for the patient. The residual judgment is determining if the "seeming" is generated by the patient's cortex or the decoder's weights. Without a way to query the patient for clarification ("Do you mean literally?"), this remains an irreducible ambiguity in the dataset.

  ---

  ## IV. Unavoidable Failure Modes

  Given the commitments of the heterophenomenological method (privileging the subject's report as data about their world, while acknowledging the decoder is a fallible translator), the following failure modes are structurally unavoidable:

  **1. The "Hyper-Rational" False Negative (Exclusion of Valid Weirdness)**
  *   **Scenario:** A patient genuinely experiences a non-standard phenomenological state (e.g., out-of-body experience, synesthesia post-injury).
  *   **Failure:** A technician or Senior Reviewer, relying on Step 3 (Physiological Exclusion) or Step 5 (Admissibility), interprets the report as physiologically impossible and excludes it as artifact.
  *   **Why Unavoidable:** The protocol relies on human operators to distinguish "brain state incompatible with speech" from "brain state producing weird speech." Without philosophical training, operators will default to a realist ontology (if it's not physically possible, it's noise), violating the heterophenomenological commitment to record the *report* regardless of truth.

  **2. The "Glossolalia" False Positive (Acceptance of Decoder Noise)**
  *   **Scenario:** The decoder, due to overfitting or signal drift, generates a grammatically perfect string that reflects the model's priors rather than the patient's cortical activity (e.g., completing a pattern rather than decoding intent).
  *   **Failure:** The procedure admits the string as valid heterophenomenological data because it passes Signal, Lexical, and Syntax checks.
  *   **Why Unavoidable:** Heterophenomenology treats the text as the *only* access to the subject's world. We lack a "view from nowhere" to verify if the text originated in the patient's intention or the machine's bias. If the signal confidence is high, we must treat it as the subject's voice. We cannot filter for "authenticity" without abandoning the method.

  **3. The Vocabulary Ceiling Artifact**
  *   **Scenario:** A patient experiences a nuanced state (e.g., a specific type of existential dread) but the decoder's vocabulary is limited to "sad," "pain," or "afraid."
  *   **Failure:** The dataset records "I am sad," which is technically a false positive for the specific qualia experienced, or "The ceiling is singing" as a metaphorical attempt to describe a sensory overload that the vocabulary cannot capture literally.
  *   **Why Unavoidable:** The procedure flags vocabulary limitations (`LOW_RES`), but cannot correct them. The heterophenomenological world is reconstructed through the decoder's lexicon. If the lexicon is impoverished, the data will necessarily distort the phenomenology, and the procedure has no mechanism to recover the lost nuance.
