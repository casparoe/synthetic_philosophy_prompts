      *   **Family Context:** Small family restaurant. Dad is sick. Parents rely on user for labor (weekends + afternoons).
      *   **Parental Pressure:** Mom uses guilt-inducing language ("sacrificed everything," "good son helps"). High emotional weight.
      *   **Friend Context:** Best friend Marcus is going through parents' divorce. Emotionally unstable/needs support.
