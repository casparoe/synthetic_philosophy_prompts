answer: |-
  First off, take a deep breath. You are not being dramatic. You are carrying a very heavy load for a high school junior, and you are facing a genuine ethical dilemma that adults struggle with.

  You are trying to hold up three pillars at once: your family's livelihood/health, your best friend's mental health, and your own development. It is natural that the structure is shaking.

  Since you brought up Confucian philosophy, let's start there, because it actually offers a more nuanced answer than just "pick the most important role."

  ### 1. Reframing the Philosophy
  You are right that in Confucian thought, the "self" is relational. You are a node in a network of obligations (Father/Son, Friend/Friend, etc.). However, the goal of Confucianism isn't just blind obedience to the "highest" rank (like Family over Friend). The goal is **Harmony (*He*)** and **Appropriateness (*Yi*)**.

  *   **Sustainability:** If you burn out, collapse, or become resentful, you fail *all* your relationships. A "good son" who ruins his own future or mental health is not actually bringing honor or stability to the family in the long run.
  *   **Self-Cultivation:** Confucianism emphasizes improving yourself (*Xiushen*) so you can better contribute to the world. Dropping all clubs and personal growth prevents you from cultivating the skills you might need to help your family later (e.g., managing the business better than just working the line).
  *   **The Web, Not the Ladder:** It's not a ladder where Family is top and Friends are bottom. It's a web. If you cut the strand with Marcus, you damage your own character as a loyal friend. If you cut the strand with your parents, you damage your character as a filial son. The "right" way is to keep the web intact without snapping the center (you).

  ### 2. Analyzing the Reality
  Let's look at the practical stakes of each role.

  **The Family Role:**
  *   **The Stakes:** High. Your dad is sick, and the business might fail without labor.
  *   **The Problem:** Your mom's guilt-tripping ("we sacrificed everything") is emotionally manipulative, even if unintentional. It turns "helping" into "debt repayment." This creates resentment, which will poison your relationship with them eventually.
  *   **The Need:** They need labor, but they might also need to face the reality that they cannot rely on a high schooler indefinitely.

  **The Friend Role:**
  *   **The Stakes:** High (emotionally). Marcus is in crisis.
  *   **The Problem:** You are canceling repeatedly. This signals to him that he is disposable.
  *   **The Need:** Marcus needs to know he isn't abandoned. He doesn't necessarily need *every* weekend, but he needs *reliability*.

  **The Self Role:**
  *   **The Stakes:** High (long-term). You are a junior. This is a critical year for grades, college prep, and mental resilience.
  *   **The Problem:** You have zero margin for error. If you get sick or depressed, the whole system collapses.

  ### 3. What Should You Actually Do?
  You cannot be in two places at once. But you *can* manage expectations. The solution isn't picking one person to save; it's communicating limits so no one feels abandoned.

  **Step 1: Have the Hard Talk with Your Parents**
  You need to shift the narrative from "I don't want to help" to "I want to help sustainably."
  *   **Script:** "Mom, Dad, I know how sick Dad is and I want to help save the restaurant. I know you sacrificed for me, and I appreciate it. But I'm worried that if I work every afternoon and weekend, I'm going to burn out, my grades will slip, and I won't be able to help you in the long run. I need to set a schedule so I can be effective here *and* at school."
  *   **The Ask:** Propose a fixed schedule (e.g., "I can work Saturday all day, and two weekday evenings, but Sunday needs to be for study/rest").
  *   **The Business Reality:** Gently ask, "Have we looked into hiring a part-timer for the peak hours?" If the business relies entirely on a sick man and a high schooler, the business model is fragile.

  **Step 2: Re-engage with Marcus (Don't just cancel)**
  Canceling makes him feel like an option. Rescheduling makes him feel like a priority.
  *   **Script:** "Marcus, I care about you so much and I want to be there for you. My dad is really sick and the restaurant is struggling, so my parents need me on weekends. I hate canceling on you. I can't do Saturdays, but I can come over Sunday evening for a few hours, or I can call you every Wednesday night at 8 PM no matter what. Does that work?"
  *   **Why this works:** It gives him predictability. Knowing he has *guaranteed* time with you is often more comforting than hoping you might be free.
  *   **The Therapist Boundary:** Be careful. You are his friend, not his counselor. If he is truly "messed up," encourage him to talk to a school counselor. You can support him, but you cannot fix his parents' divorce.

  **Step 3: Reclaim One Thing for Yourself**
  You dropped the club. You need to put *something* back.
  *   If you work every afternoon and weekend, you are working more than a full-time job. That is not sustainable for a junior.
  *   Negotiate with your parents to free up **one** afternoon or one weekend day for yourself. Use it for a club, studying, or just sleeping. Frame this as "maintenance for the machine that helps you."

  ### 4. The Verdict on "Good Son" vs. "Good Friend"
  You asked if there is a "right" way to prioritize.

  **The "Good Son" definition needs to change.**
  A "good son" in this context isn't a martyr. A "good son" is one who supports his family *without destroying his own future*. If you sacrifice your education and mental health now, you might not be able to support your parents when you are 25. Long-term filial piety requires a healthy, capable adult child.

  **The "Good Friend" definition needs adjustment.**
  A "good friend" shows up. But showing up doesn't mean being available 24/7. It means being honest about your limits and keeping the promises you *do* make.

  ### Summary of Action
  1.  **Stop canceling on Marcus last minute.** Set a standing appointment (e.g., Sunday nights) that you protect fiercely.
  2.  **Negotiate a schedule with your parents.** Trade "whenever you need me" for "I am here at these specific times." This reduces their anxiety and gives you freedom.
  3.  **Acknowledge the guilt, but don't let it drive.** When your mom says "we sacrificed," say "I know, and I am paying it back by helping now and by working hard at school so your sacrifice wasn't wasted."
  4.  **Pick one small thing for yourself.** Even if it's just 3 hours a week. You need to remember who you are outside of these obligations.

  You are in a tough spot, but you are handling it with a lot of maturity. Don't let the guilt convince you that you're failing. You're trying to hold a roof up while it's raining. Just make sure you don't crush yourself underneath it.
