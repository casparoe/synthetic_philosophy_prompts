      *   **Emotional State:** Feeling guilty, failing at being a "good son" and "good friend," overwhelmed, questioning if they are being dramatic.
      *   **Philosophical Lens:** Mentions Confucian philosophy (relational self, defined by roles). Asks if there's a "right" way to think about this based on that or generally.
      *   **Goal:** Wants to know how to prioritize and what to actually *do*.

  2.  **Deconstruct the Philosophical Angle (Confucianism):**
      *   *User's Interpretation:* "You basically ARE your relationships... defined by being a son, a friend, a student."
      *   *Nuance:* Confucianism *does* emphasize roles (Five Bonds: Ruler/Subject, Father/Son, Husband/Wife, Elder/Younger Brother, Friend/Friend). *Ren* (benevolence/humaneness) is central.
      *   *Key Insight:* It's not just about blind obedience to one role over another. It's about *harmony* and *appropriateness* (Yi). A good son cares for parents, but a good friend also has obligations. Neglecting one relationship entirely damages the "self" defined by relationships. Also, self-cultivation is important to be useful to others. If the son burns out, he helps no one.
      *   *Correction:* It's not about picking the "most important" role and ignoring the rest. It's about balancing them sustainably so the web of relationships remains healthy.

  3.  **Evaluate the Practical/Ethical Conflict:**
      *   **Family:** Dad is sick. This is a crisis. Family business survival might be at stake. Parents are stressed. *However*, the guilt-tripping is unhealthy. The load on a high school junior is very heavy.
      *   **Friend:** Marcus is in crisis (divorce). Suicide risk? Depression? Needs support. *However*, a teenager is not a therapist.
      *   **Self:** User is dropping clubs, losing personal development. Risk of burnout/resentment.
      *   **Reality Check:** You cannot be in two places at once. Something has to give, but "giving" doesn't mean "abandoning."

  4.  **Formulate Advice Strategy:**
      *   **Validation:** Acknowledge the heaviness. This isn't drama; it's a genuine ethical dilemma.
      *   **Philosophical Reframing:** Address the Confucian point. It's about *balance* and *long-term sustainability*, not just hierarchy.
      *   **Practical Triage:** Assess the immediate risks (Dad's health vs. Marcus's mental health vs. User's burnout).
      *   **Communication:** The core solution lies in talking to both parties honestly.
      *   **Boundaries:** Establish limits to prevent resentment.
      *   **Actionable Steps:** Specific scripts or plans.

  5.  **Drafting the Content - Section by Section:**

      *   **Empathy/Validation:** Start by saying this is heavy. It's not dramatic. It's a classic "role conflict."
      *   **Philosophical Deep Dive (The Confucian Angle):**
          *   Acknowledge the insight. Yes, we are our relationships.
          *   *But:* Confucianism also values *Yi* (righteousness/appropriateness) and self-cultivation.
