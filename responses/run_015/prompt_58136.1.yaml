answer: |-
  This is a classic exercise in moral philosophy and logic: trying to find the "principle of consistency" behind a set of intuitive judgments. Your friend isn't using a standard legal definition (like citizenship) or a pure philosophical one (like "all affected interests"). She is using a hybrid model.

  Here is the reverse-engineering of her logic, two competing rules that fit her history, and how they apply to the new case.

  ### The Two Competing Rules

  Both of these rules fit all six of her past verdicts perfectly, but they rely on different justifications.

  **Rule 1: The "De Facto Community Member" Principle**
  *   **The Logic:** Voting is for people who have planted their lives here indefinitely. It requires **social integration** (family, kids, long-term home) and **intent to stay**. Citizenship is just paperwork; actual "membership" in the community is what matters.
  *   **Why it fits the past:**
      *   *Immigrants (Yes):* They have kids, jobs, and 8 years of roots. They are "one of us" socially.
      *   *Cousin (No):* Life is in Australia. No social ties here anymore.
      *   *Canadians (No):* They are neighbors, not community members.
      *   *Exchange Student (No):* Transient. No roots, leaving soon.
      *   *Prisoners (Yes):* They retain membership in the polity; incarceration is a temporary suspension of liberty, not expulsion from the community.
      *   *15-Year-Olds (No):* Legally dependents, not independent members yet.

  **Rule 2: The "Continuous Jurisdictional Burden" Principle**
  *   **The Logic:** Voting is for adults who are under the **continuous coercive authority** of the state without an easy exit option. If the government controls your environment, taxes you, and polices you for a significant duration, you need a voice to check that power.
  *   **Why it fits the past:**
      *   *Immigrants (Yes):* Subject to laws, pay taxes, can't easily leave their established life.
      *   *Cousin (No):* Not subject to US law or authority anymore.
      *   *Canadians (No):* Affected by runoff, but not subject to US law/police/taxes.
      *   *Exchange Student (No):* Subject to laws, but the duration (one semester) is too short to count as "continuous."
      *   *Prisoners (Yes):* The state has total coercive control over them; they are uniquely vulnerable to the system.
      *   *15-Year-Olds (No):* Legal guardians absorb the civic burden/obligation for them.

  ---

  ### Predictions for the Orchard Crew

  Here is where the two rules diverge. The Jamaican workers are a "stress test" for her logic because they have **high duration/authority** (Rule 2) but **low integration/permanence** (Rule 1).

  **Prediction based on Rule 1 (Community Member): NO.**
  *   **Reasoning:** They do not have families here. Their visas legally require them to leave every winter. They are not "making a life" in the county; they are working a shift. Like the exchange student, their presence is structurally temporary, regardless of how many years they return.

  **Prediction based on Rule 2 (Jurisdictional Burden): YES.**
  *   **Reasoning:** They are under the county's authority for 8 months a year, for a decade. They pay sales tax. The sheriff polices their camp. The ballot measure specifically regulates their housing. They are subject to the law's coercion long-term and cannot opt-out without losing their livelihood.

  ---

  ### My Best Guess: What She Will Actually Say

  **She will say NO.**

  **Why?**
  Look closely at her distinction between the **Exchange Student** and the **Documented Immigrant**.
  *   The Exchange Student follows rules, pays rent, and is subject to the law, but she said **NO**.
  *   The Immigrant follows rules, pays rent, and is subject to the law, and she said **YES**.

  The variable that changed wasn't "subjection to law" (both have that). The variable was **permanent intent**. The immigrant *can* stay forever; the student *cannot*.

  The Orchard Crew is legally closer to the Exchange Student than the Immigrant. Their visas mandate departure. In her framework, "having to leave" likely disqualifies you from "membership," even if you've been coming for 10 years. She views voting as a right of *residents*, not *occupants*.

  However, she might add a caveat: She might say they shouldn't vote for *Sheriff*, but they should have a "voice" on the *Housing Measure* specifically (like a town hall input), mirroring her view on the Canadians (compensation/hearing, but no ballot).

  ---

  ### The Cleanest Test Case to Separate the Rules

  To prove which rule she is actually using, you need a case where **Integration is Low** but **Duration/Authority is High**. The Orchard case is good, but the "foreign visa" aspect might distract her. You need a domestic example.

  **The Test Case: The Long-Term PhD Student**
  > "Imagine a foreign national doing a PhD at the local university. They have been here for **6 years** (longer than the orchard crew's season). They rent an apartment, pay income and sales tax, and are subject to all local laws. They have no family here. However, their student visa expires when they graduate, and they plan to return to their home country immediately after."

  **How it separates the rules:**
  *   **If she says YES:** She is using **Rule 2 (Jurisdictional Burden)**. Six years of subjection and tax contribution outweighs the lack of permanent intent.
  *   **If she says NO:** She is using **Rule 1 (Community Member)**. Without the intent to stay indefinitely or family ties, they are just "long-term guests," similar to the exchange student.

  **Why this is cleaner than the Orchard case:**
  It removes the "labor camp/vulnerability" element. It isolates the specific variable of **Intent to Stay vs. Time Served**. If she denies the PhD student, you know for a fact that "Permanent Intent" is her hard cutoff, and the Orchard crew never had a chance.
