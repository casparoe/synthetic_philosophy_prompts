answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION: ANTHROPIC REASONING PRINCIPLES

  **Date:** October 26, 2023
  **Parties:** Proponent of Self-Sampling Assumption (SSA) | Proponent of Self-Indication Assumption (SIA)
  **Facilitator:** AI Drafter

  ## 1. AGREED CLAIMS

  Both parties affirm the following numbered statements as an accurate baseline for further debate.

  1.  **Definitions of Principles:**
      *   **SSA:** All else equal, an observer should reason as if they are a random sample from the set of all *actual* observers in their reference class. (Formally: $P(H | \text{Index}) \propto P(H) \times \frac{1}{N_H}$, where $N_H$ is the number of observers in $H$.)
      *   **SIA:** All else equal, an observer should reason as if they are a random sample from the set of all *possible* observers. (Formally: $P(H | \text{Existence}) \propto P(H) \times N_H$.)
  2.  **Toy Case Verdicts:** Both parties agree on the following output table for standard scenarios, assuming standard reference classes:
      *   **Sleeping Beauty:** SSA yields 1/2 (Halfer); SIA yields 1/3 (Thirder).
      *   **Doomsday Argument:** SSA yields a posterior shift toward earlier extinction (smaller total population); SIA yields no shift (cancels the sampling effect).
      *   **Presumptuous Philosopher:** SSA yields no shift toward the hypothesis with more observers; SIA yields a massive shift toward the hypothesis with more observers.
  3.  **Formalism Limits:** Both parties agree that neither principle, in its standard form, provides:
      *   A non-arbitrary method for defining the "reference class" (for SSA) or the set of "possible observers" (for SIA).
      *   A coherent handling of cases involving actually infinite numbers of observers (measure problems arise for both).
      *   A derivation of the *prior* probabilities of the hypotheses in question; both are updating rules.
  4.  **Empirical Equivalence (Local):** In scenarios where the total number of observers is fixed and known, both principles yield identical empirical predictions. The disagreement is strictly conditional on hypotheses that differ in observer count.
  5.  **Decision-Theoretic Separation:** Both parties agree that one can hold an SSA/SIA credence function while adopting a decision rule (e.g., Updateless Decision Theory) that modifies betting behavior. However, we disagree on whether this dissolves the epistemic disagreement or merely masks it.

  ## 2. DISAGREEMENTS TABLE

  | Crux ID | Neutral Sub-Question | SSA Formulation | SIA Formulation | Shared Test Case / Argument | SSA Prediction | SIA Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **C1** | **Nature of "Existence"** | Is "I exist" new evidence? | No. Existence is a precondition for reasoning, not evidence to update on. | Yes. The fact of my existence favors hypotheses where existence is more likely. | **The Presumptuous Philosopher:** A physicist considers two theories, T1 (1M observers) and T2 (1T observers). | T1 and T2 remain equally likely (absent other evidence). | T2 is $10^6$ times more likely than T1. |
  | **C2** | **Reference Class Scope** | Does the reference class include merely possible observers? | No. Only actual observers in the world count for sampling. | Yes. Possible observers count because "I could have been them." | **God's Eye View:** Does the probability distribution depend on the size of the possibility space? | Probability depends on actual distribution. | Probability depends on the measure of possible observers. |
  | **C3** | **Sequential Identity (The Relay)** | Do temporal segments with amnesia count as distinct observers? | No (or weakly). It is one life lived sequentially; sampling is from lives, not moments. | Yes. Each amnesic segment is a distinct center of experience; sampling is from moments. | **The Relay:** Hypothesis A (1 life segment), Hypothesis B (1000 sequential segments with amnesia). You find yourself at segment 5. | Favors A (Doomsday-style). You are surprisingly early if B is true. | Favors B (SIA boost). There are more "yous" in B to find yourself as. |
  | **C4** | **Ex-Ante Agreement (Pre-Registration)** | Would rational agents choose this rule behind a veil of ignorance? | Not necessarily. Agents care about *their* accuracy, not aggregate accuracy across copies. | Yes. Agents maximizing aggregate welfare/truth across all copies would choose SIA. | **Pre-Registration:** Before copying, agents choose an updating rule for their copies to use. | Agents might pick SSA to avoid "Presumptuous" errors in single-world scenarios. | Agents will pick SIA to maximize the number of correct copies in multiverse scenarios. |
  | **C5** | **Prior Specification** | Is SIA's big-world boost a correction or double-counting? | Double-counting. It treats the prior as if it didn't already account for world size. | Correction. Standard priors undercount worlds with more observers because they ignore indexical likelihood. | **The "Cost" of SIA:** Does SIA require adjusting physical priors? | Yes, SIA distorts physical theory choice unjustifiably. | No, SIA reveals that physical priors were missing indexical weight. |

  ## 3. CLOSING: VERBAL DISPUTES AND SCOPE

  We identify three areas where the disagreement appears partially verbal or dependent on framing:

  1.  **The Definition of "Observer":** In *The Relay* case (Crux C3), the disagreement reduces to whether a single consciousness with amnesia constitutes one observer or many. SSA treats "observer" as a continuous identity; SIA treats "observer" as a momentary experience. If we standardize "observer" to "momentary time-slice," SSA must adjust its reference class to match, potentially converging on SIA results. If we standardize to "whole life," SIA must discount sequential segments. **Verdict:** This is a parameter dispute, not necessarily a principle dispute.
  2.  **Credence vs. Betting Odds:** In *Pre-Registration* (Crux C4), if the goal is defined as "maximize total money won by all copies," SIA betting strategies win. If the goal is "maximize the probability *this* copy is right," the answer is ambiguous. **Verdict:** We agree that if the debate is relocated entirely to decision theory (UDT/FDT), the "anthropic" tension dissolves into a question of utility aggregation (Total vs. Average). We disagree on whether this relocation is legitimate for *epistemic* questions.
  3.  **Hypothesis Space (User Guess b):** The SSA proponent argues SIA's preference for big worlds indicates a badly specified prior (one that should have weighted big worlds lower to begin with). The SIA proponent argues the prior is standard and the update is necessary. **Verdict:** This is not verbal; it is a substantive disagreement about whether "number of observers" is a physical property relevant to likelihood.

  ## 4. WHAT WOULD MOVE EACH OF US

  **To move the SSA Proponent:**
  *   **Dutch Book Argument:** Demonstrate a scenario where an agent using SSA credences is guaranteed to lose money against a bookie, *even when* using a decision rule that aligns with SSA self-interest, without relying on aggregate welfare across copies.
  *   **Physical Theory Penalty:** Show a case where SSA forces us to reject a well-confirmed physical theory (e.g., quantum mechanics with many worlds) solely because it implies more observers, in a context where "Presumptuous Philosopher" intuitions feel weak.
  *   **Reference Class Stability:** Provide a non-arbitrary, principled definition of the SSA reference class that does not require tuning to avoid the Doomsday conclusion.

  **To move the SIA Proponent:**
  *   **Solipsism/Unboundedness:** Demonstrate that SIA leads to "Pascal's Mugging" style absurdities where we must believe in infinite universes or Boltzmann brains with near-certainty, regardless of physical evidence.
  *   **Empirical Disconnect:** Show a case where SIA mandates belief in a hypothesis that is causally disconnected from the observer's evidence in a way that violates standard Bayesian norms (e.g., favoring a hypothesis where "I" exist merely because there are more "non-me" observers in it).
  *   **Decision-Theoretic Divergence:** Show a case where the ex-ante rational choice (Pre-Registration) diverges from the SIA-prescribed credence, suggesting SIA is a heuristic for decision-making rather than a truth-tracking rule.

  ***

  ### DRAFTER'S META-NOTE

  **Likely Refusal Point:**
  I anticipate the **SSA Proponent** will refuse to sign the formulation of **The Relay (Crux C3)** in the Disagreements Table. Specifically, they will object to the SIA formulation that treats amnesic sequential segments as "distinct observers." The SSA view typically hinges on the continuity of identity; if the SSA signer accepts the SIA definition of "observer" for the sake of the table, they may feel they have conceded the core argument (that the reference class should be time-slices). They will likely demand a footnote stating that SSA *can* accommodate time-slices but typically rejects them as the relevant class for *identity-based* reasoning.

  **Potential Reasoning Error:**
  My own reasoning is most likely to have gone wrong in the **Pre-Registration** analysis. I have framed the ex-ante choice as a test of "correctness." However, a sophisticated SSA proponent (especially one familiar with Updateless Decision Theory) might argue that agents behind the veil would choose an SSA *credence* function but an SIA-like *decision* rule. By conflating the choice of rule with the choice of truth-tracking credence in the table, I may have smuggled in the conclusion that "pragmatic success implies epistemic truth," which is exactly what the SSA proponent denies. If they are strict evidentialists, they will reject the premise that what agents *would choose* has any bearing on what is *true*.

  **On Your Hypotheses:**
  *   **(a) Scope:** You were correct; the disagreement vanishes if observer counts are fixed.
  *   **(b) Priors:** This is the deepest substantive fight. I framed it as a "cost," but SIA proponents view it as a "feature."
  *   **(c) Infinities:** Both break, but SIA breaks louder. I emphasized this in Agreed Claim #3.
  *   **(d) Decision Theory:** The *Pre-Registration* case tests this. I suspect this is where the collaboration will actually resolve, not by one side winning, but by both agreeing to switch to UDT. I tried to leave room for that in Section 3.
