          5.  If Samuelson is correct, does anything actually change in practice, or is it just semantic justification?

  2.  **Analyze the Arguments:**

      *   **Samuelson's Critique:** Paul Samuelson (and Paul Merton) argued that maximizing geometric mean (Kelly) is equivalent to maximizing expected utility with $U(w) = \ln(w)$. If you don't have log utility, Kelly isn't optimal for *you*. He rejected the idea that the "long run" justifies Kelly independently of utility functions. The "law of large numbers" doesn't save you from ruin in a single timeline if you bet too much.
      *   **Ole Peters' Ergodicity:** Peters argues that standard economics conflates ensemble averages (what happens to 100 people betting once) with time averages (what happens to 1 person betting 100 times). In non-ergodic systems (like wealth accumulation with ruin), the ensemble average is misleading. Kelly maximizes the time-average growth rate. This claims to be a *physical* constraint, not a psychological preference.
      *   **Geometric Rationality (Garrabrant):** Focuses on maximizing the geometric mean of outcomes rather than the arithmetic mean. Suggests that standard VNM axioms (which lead to arithmetic EV maximization) might be the ones needing adjustment in multiplicative environments.
      *   **Practitioners (Thorp, Buffett, Simons):** They use Kelly (or fractional Kelly). Why? To avoid ruin while compounding. They often speak in terms of "survival" and "growth," not necessarily "utility curves."
      *   **Half-Kelly:** Reduces volatility and drawdown. Technically, this *is* a deviation from optimal geometric growth for a log utility agent. It implies a utility function *more* concave than log (i.e., higher risk aversion) or uncertainty about the edge (Bayesian updating).

