      *   **The Debate:**
          *   *Standard Finance View (Samuelson):* Kelly is just Expected Utility Theory (EUT) with logarithmic utility. It's not a new theory of rationality; it's just a specific risk preference.
          *   *Ergodicity/Economics View (Ole Peters):* Ensemble averages (across parallel universes) vs. Time averages (one person over time). Kelly maximizes time-average growth. EUT is flawed because it relies on ensemble averages.
          *   *Geometric Rationality (Scott Garrabrant):* Generalizing the pattern, potentially conflicting with standard rational choice axioms (VNM).
      *   **Specific Questions:**
          1.  What does Kelly betting *strictly presuppose* about rational choice under risk (according to practitioners)?
          2.  Does it need Peters/Garrabrant to make sense, or is Samuelson right (it's just log utility)?
