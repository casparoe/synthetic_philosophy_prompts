      *   *Mismatch:* In hard ruin, the game stops. In soft ruin, the game continues but with diminished capacity. This makes the "recovery" harder but not impossible. However, if the decay is exponential, it mimics ruin. The key mismatch is that the "safe" strategy might offer a higher *median* outcome even if the risky strategy has a higher *mean*.

  5.  **Address the "Three Books Left" Boundary Case:**

      *   If the horizon is finite and short (3 books), the Law of Large Numbers definitely doesn't apply.
      *   The "time average" vs "ensemble average" distinction collapses somewhat because there isn't enough time for the distribution to play out.
      *   However, if the career is multiplicative, the geometric mean still matters more than the arithmetic mean for *cumulative* success, even over 3 steps.
      *   But with only 3 steps, the variance is high. The "safe" path might maximise the *probability* of a satisfactory outcome, even if the "risky" path maximises the *expected total*.
      *   Actually, for a finite horizon, the utility function matters. If the goal is "retire comfortably," a safe floor is better. If the goal is "maximise total earnings regardless of variance," EV might still rule. But given the path dependence (Book 3 depends on Book 2), the geometric logic still applies.

