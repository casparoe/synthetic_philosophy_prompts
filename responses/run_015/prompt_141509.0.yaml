answer: |-
  The phenomenon you have identified is sound, and your intuition that the standard defence of 'averaging out' is inverted in this context is mathematically correct. The concept you are looking for is **non-ergodicity**, specifically the divergence between the **ensemble average** (what happens to a group of writers making different choices) and the **time average** (what happens to one writer making a sequence of choices).

  The specific mechanism that causes the 'inversion' you describe is known in finance and probability as **volatility drag** acting upon **geometric growth**.

  Here is how the standard treatment applies to your situation, where the mismatches lie, and how the 'soft floor' alters the calculus.

  ### 1. The Name and the Mechanism

  Your colleagues are reasoning using the **Arithmetic Mean** (the simple average). If a bet pays £100 with 50% probability and £0 with 50% probability, the arithmetic expected value is £50. If you could make this bet a thousand times in parallel universes, your average return would converge to £50 per bet.

  However, a career is a sequence played out in time, not in parallel. When outcomes compound—where the success of book B depends on the platform built by book A—the relevant metric is the **Geometric Mean**.

  In a multiplicative process, volatility acts as a drag on growth. A simple illustration: suppose you start with £100. You lose 50% in year one (down to £50). To recover, you do not need a 50% gain; you need a 100% gain to return to £100. If you gain 50% then lose 50%, you end up with £75, not £100. The arithmetic average of +50% and -50% is zero, but the geometric result is a loss.

  The 'inversion' you perceive is this: as the number of decisions ($N$) increases, the Law of Large Numbers does indeed kick in. However, it ensures that your *actual* result converges to the **geometric mean**, not the arithmetic mean. If the high-risk option has high variance, its geometric mean may be lower than the low-risk option's, even if its arithmetic mean is higher. Therefore, the more decisions you make, the *more certain* you become that the high-risk strategy will underperform the low-risk one. Your colleagues are invoking the Law of Large Numbers to justify risk, when in a multiplicative system, the Law of Large Numbers is precisely what punishes volatility.

  ### 2. The Soft Floor vs. Hard Ruin

  Your friend in finance spoke of 'ruin' in the sense of an absorbing barrier (bankruptcy), where the game stops. You correctly identify that a writing career has a 'soft floor'. You do not vanish; you decay.

  Does the standard treatment survive this? **Mostly, yes, but with a caveat.**

  In standard Kelly Criterion or portfolio theory, 'ruin' is binary. In your 'soft floor' scenario, the barrier is **path-dependent decay**. You described it perfectly: "the rate at which a career grows depends on where it currently is." This makes the process multiplicative.

  *   **The Match:** The mathematics of geometric growth still applies. If a risky choice leads to a 'flop', it reduces the base (print run, visibility) upon which the next book's success is calculated. A string of unlucky outcomes, even without total ruin, shrinks the base so severely that recovery becomes mathematically improbable within a human lifespan. The 'drag' remains.
  *   **The Mismatch:** In a hard-ruin model, a single bad bet ends the game. In your soft-floor model, the game continues, but the 'cost' of volatility is paid in opportunity cost and diminished capacity rather than cessation. This means the 'safe' strategy is not just about avoiding zero; it is about maintaining the **multiplier** for future work. The standard financial models often underestimate this because they treat capital as fungible cash. In your trade, capital is *attention* and *distribution*, which are stickier and harder to regain than cash.

  Therefore, the phenomenon is not 'risk aversion' (a psychological preference for safety). It is **growth optimisation**. The writer taking the safe advance is not necessarily being cowardly; they are maximising the geometric growth rate of their career capital, whereas the other is maximising the arithmetic expectation of a single isolated event.

  ### 3. The Boundary Case: Three Books

  You asked if this applies to a writer intending to write exactly three more books.

  Here, the argument changes slightly, but the conclusion often remains the same.

  1.  **The Law of Large Numbers:** Your colleagues' specific justification ("there will be many decisions... averages will look after themselves") collapses entirely. With $N=3$, there is no 'long run'. The distribution of outcomes will not converge to the mean. The variance remains high.
  2.  **Geometric vs. Arithmetic:** Even with only three steps, if the career is multiplicative (Book 2 sells based on Book 1), the geometric mean is still the better predictor of the final state than the arithmetic mean. However, with such a short horizon, the 'volatility drag' has less time to compound.
  3.  **The Deciding Factor:** With a short horizon, the decision rests on the **utility function**.
      *   If the writer's goal is to maximise *expected total earnings* regardless of the distribution, the arithmetic mean (the risky bet) might still be mathematically superior.
      *   However, if the goal is to ensure the third book is published and read (i.e., to sustain the career *through* the third book), the path dependence dominates. A failure on Book 1 could so diminish the launch of Book 2 that Book 3 becomes unviable.

  In the three-book case, the 'safe' choice maximises the **median** outcome and the probability of completing the trilogy successfully. The 'risky' choice maximises the **mean** outcome, heavily skewed by a low-probability 'hit' that might not materialise in a sample size of three. For a professional relying on the income, the median is usually the rational metric, not the mean.

  ### Summary

  The phenomenon is **non-ergodicity** in a multiplicative system.

  *   **Why the inversion occurs:** Increasing the number of bets increases the certainty that the result will match the *geometric* mean, which is reduced by variance. The colleagues mistake the *ensemble average* (what happens to all of us) for the *time average* (what happens to me, over time).
  *   **The Soft Floor:** The standard 'ruin' models are imperfect because you face decay rather than deletion. However, because career capital is multiplicative, the 'volatility drag' remains the dominant force. The mismatch is that recovery is possible but exponentially difficult, reinforcing the need for stability.
  *   **The Three-Book Case:** The 'long run' justification fails completely. The decision becomes one of maximising the probability of a satisfactory outcome (median) versus the mathematical expectation (mean). Given the path dependence of publishing, the former is usually the rational choice for a professional.

  Your colleagues are treating book contracts as a portfolio of independent stocks. In reality, they are links in a chain; the strength of the whole is determined by the weakest link, not the average strength of the links.
