      *   *Refining the "Soft Floor":* The key is that career capital is multiplicative. A bad book reduces the *multiplier* for the next. This creates a "drift" downwards that is hard to reverse. It's not ruin, but it's **Path Dependence**.
      *   *Refining the "Three Books":* With $N=3$, the Law of Large Numbers is irrelevant. The distribution of outcomes is wide. The "safe" choice maximises the *median* outcome, the "risky" choice maximises the *mean*. For a livelihood, the median is usually more relevant.

