answer: |-
  # Teaching Plan: The Wrong Kind of Reasons in Aesthetic Judgment

  **Session Context:** One dinner session. No texts, notes, or jargon-heavy handouts.
  **Goal:** Enable the learner to distinguish between reasons that make an aesthetic judgment *correct* and reasons that make it *advantageous*, specifically to audit her own professional evaluations.

  ---

  ## I. Session Architecture & Sequence

  ### Phase 1: Validation and the "Honesty" Preemption (10 Minutes)
  **Objective:** Establish safety and neutralize the first misconception immediately.
  **Action:**
  1.  Acknowledge her admission about the gallery owner without judgment. Validate that this is a standard professional survival tactic.
  2.  **Preempt Misconception 1 (Honesty):** Explicitly state that admitting the motive ("I was honest that I did it for the show") does not solve the philosophical problem. Honesty makes her *sincere*, but it does not make the praise *accurate*.
  3.  **Framing:** Tell her the goal isn't to make her morally better, but to sharpen her toolset. If she confuses "good for my career" with "good art," she loses the ability to spot actual quality, which hurts her long-term.

  ### Phase 2: The Carrying Example (15 Minutes)
  **Objective:** Demonstrate the failure of specific reasons to support aesthetic judgment without using theory yet.
  **The Scenario:** "The Mentor's Retrospective."
  **Narrative Details to Include:**
  *   **The Setup:** A respected senior artist (her former teacher) is having a retrospective. The work is visibly declining in quality (sloppy technique, derivative concepts).
  *   **The Obvious Wrong-Kind Reason (WKR):** She writes a glowing review because the teacher controls access to a prestigious residency she wants. (Career Gain).
  *   **The Subtle Wrong-Kind Reason (WKR):** She also feels a deep sense of *loyalty* and *gratitude* for past help. She believes praising him honors their relationship. (Relational Duty).
  *   **The Crucial Constraint (Avoiding the Selfishness Trap):** You must emphasize that the *loyalty* reason is altruistic, not selfish. If she thinks WKRs are only about "selfish gain," she will accept loyalty as a valid aesthetic reason. You must guide her to see that loyalty, like money, has nothing to do with the *paint on the canvas*.
  **Analysis Question:** Ask her: "If the residency didn't exist, and you didn't owe him loyalty, would the *painting itself* give you a reason to praise it?"
  **Preempt Misconception 2 (Explanatory vs. Justifying):** When she answers, point out that money and loyalty *explain* why she praised it (causal/explanatory), but neither *justifies* the claim that the art is good (normative/justifying).

  ### Phase 3: Introducing the Distinction (15 Minutes)
  **Objective:** Formalize the intuition from Phase 2 into the "Fittingness vs. Incentive" distinction.
  **Sequence:**
  1.  **Define the Two Buckets:**
      *   **Bucket A (Right Kind):** Reasons that point to features of the *object* (composition, color, emotional resonance). These make the attitude *fit* the object.
      *   **Bucket B (Wrong Kind):** Reasons that point to features of the *situation* or the *consequences* (money, loyalty, pressure). These make the attitude *beneficial* or *prudent*.
  2.  **Preempt Misconception 3 (Hypocrisy):** Clarify that this isn't about hypocrisy. One can genuinely feel praise due to loyalty (not hypocritical), but the praise is still aesthetically misplaced. The problem is about *appropriateness*, not truthfulness.
  3.  **The "Fittingness" Metaphor:** Use a non-art analogy briefly if needed (e.g., laughing at a funeral because a funny memory pops up vs. laughing because you want to diffuse tension). The memory fits the emotion; the tension strategy does not, even if both cause laughter.

  ### Phase 4: The "Pro-Attitude" Concept (10 Minutes)
  **Objective:** Explain *why* the distinction exists by defining the nature of the response.
  **Timing Constraint:** Introduce this *only now*, after she has seen the failure case and the distinction.
  **Action:**
  1.  Explain that "Praise" or "Admiration" is not just a noise we make; it is a specific stance (a "pro-attitude") directed at value.
  2.  **The Logic:** A pro-attitude is like a key. It is designed to fit a specific lock (the value of the object).
  3.  **The Mismatch:** Using career gain to justify praise is like using a key to hammer in a nail. It might work (you get the show), but it's not what the key is for. If you treat the key as a hammer, you ruin the key (your critical faculty).
  4.  **Application:** Ask her to view her own praise as a tool. Is she using the tool for its designed function (tracking value) or as a lever (tracking advantage)?

  ### Phase 5: Check for Understanding (10 Minutes)
  **Objective:** Verify she can classify reasons without relying on slogans.
  **The Novel Case:** "The Charity Auction."
  **Scenario:** She is at a benefit auction. A fellow artist friend puts up a mediocre sculpture.
  *   **Option A:** She bids high because she wants the sculpture to look valuable so her friend's market price rises.
  *   **Option B:** She bids high because the charity is fighting a disease that affected her family.
  *   **Option C:** She bids high because the sculpture uses a lighting technique she finds genuinely moving.
  **Task:** Ask her to identify which option provides a **Right Kind Reason** for *valuing the sculpture aesthetically*, and which provide **Wrong Kind Reasons** for *bidding*, even if the bidding is morally good.
  **Success Criteria:** She must identify that Option C is the only aesthetic reason. She must recognize that Option B is a *moral* reason (Right Kind for donating, Wrong Kind for art judgment) and Option A is a *strategic* reason. If she conflates B and C, re-visit Phase 3.

  ---

  ## II. Explicit Boundaries (What to Exclude)

  To keep the session focused on aesthetic auditing, strictly **exclude** the following topics if they arise:

  1.  **Doxastic Analogies:** Do not discuss whether this applies to *beliefs* (e.g., "reasons to believe in God for comfort"). This introduces epistemological debates that distract from aesthetic practice.
  2.  **Metaethical Realism:** Do not discuss whether "value" is real or subjective. The WKR problem exists even if value is subjective; it is about the *relation* between reason and attitude, not the ontology of value.
  3.  **Institutional Rationality:** Do not dive into the sociology of the art market. Acknowledge the market exists (Phase 1), but do not analyze whether the market *should* work this way. Focus on her internal audit, not systemic reform.
  4.  **Moral Blame:** Do not allow the conversation to become a moral interrogation of her career choices. The focus is on the *categorization of reasons*, not the ethics of survival strategies.

  ---

  ## III. Instructor Notes for Flow

  *   **Pacing:** If she gets stuck on the "Loyalty" aspect of the Carrying Example (Phase 2), spend more time there. That is the hinge point where most people fail to see the WKR problem because loyalty feels "noble."
  *   **Tone:** Maintain a collaborative tone ("Let's figure out how this tool works") rather than a corrective tone ("You are making a mistake").
  *   **Jargon Check:** If you use the term "pro-attitude," immediately define it as "a stance of approval or endorsement." If she glazes over, drop the term and stick to "stance."
  *   **Ending:** Conclude by asking her to identify one current work she is evaluating this week and apply the "Bucket A vs. Bucket B" test to her own internal monologue.
