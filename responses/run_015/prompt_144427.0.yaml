prompt: |-
  After my sister, a working painter with no philosophy background, admitted that she recently praised a peer's installation mainly because the gallery owner was present and she hoped to secure a future show, she asked me why philosophers say some reasons "count" for an aesthetic judgment while others do not, even when both motivate you. I want to design a single-session teaching plan—delivered over dinner, without texts or citations—to help her understand the wrong-kind-of-reasons problem well enough to audit her own evaluations. I need the conceptual architecture specified: the exact sequence in which to introduce the distinction between reasons that bear on whether an attitude is fitting and reasons that merely cause or incentivize it; why the idea of a "pro-attitude" should come only after she has seen a concrete failure case, not before; the one carrying example drawn from artistic judgment—preferably one that contains both an obvious wrong-kind reason (financial or career gain) and a less obvious one (loyalty to a mentor or institutional pressure)—and what that example must include and exclude so she does not confuse wrong-kind reasons with mere selfishness; the misconceptions she is likely to bring (that honesty about one's motives dissolves the problem, that any explanatory reason is automatically justifying, or that the issue is only about hypocrisy) together with the point in the sequence where each should be preempted; a brief check for understanding that requires her to classify a novel case rather than repeat a slogan; and an explicit boundary of what to leave out—such as parallel problems for belief, metaethical debates about value realism, and institutional-rationality literature—so the session stays focused. Please present this as a plan for explanation, not the explanation itself, and do not include reading lists or references she could not access.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** The user's sister, a working painter with no philosophy background.
      *   **Context:** A single-session teaching plan delivered over dinner. No texts or citations.
      *   **Goal:** Help her understand the "Wrong Kind of Reasons" (WKR) problem in aesthetic judgment well enough to audit her own evaluations.
      *   **Specific Requirements:**
          *   Conceptual architecture (exact sequence).
          *   Distinction between "fittingness" reasons vs. "incentive/causal" reasons.
          *   Timing of "pro-attitude" concept (only *after* a concrete failure case).
          *   One carrying example (artistic judgment, must include obvious WKR + less obvious WKR, must avoid confusion with mere selfishness).
          *   Address specific misconceptions (honesty dissolves problem, explanatory = justifying, issue is only hypocrisy) at specific points.
          *   Check for understanding (classify a novel case, not repeat slogans).
          *   Explicit boundaries (what to leave out: belief parallels, metaethics, institutional rationality).
          *   Format: Plan for explanation, *not* the explanation itself. No reading lists.

  2.  **Deconstruct the Philosophical Problem (WKR):**
      *   *Core Issue:* Distinguishing between reasons that make an attitude (like admiration, praise, belief) *correct/appropriate* vs. reasons that make it *beneficial/prudent* to have that attitude.
      *   *Aesthetic Context:* Why is a painting *good* vs. why is it *good for me to say* it's good.
      *   *The "Fittingness" Relation:* The object must warrant the response.

  3.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: Setting the Stage (The Hook):**
          *   Need to validate her experience first. She admitted something real. Don't start with theory.
          *   *Misconception Preemption:* Honesty doesn't fix it. (Address this early).
          *   *Activity:* Acknowledge her story without judgment.

      *   **Phase 2: The Carrying Example (The Core):**
          *   Needs to be artistic.
          *   Needs obvious WKR (money/career).
          *   Needs subtle WKR (loyalty/pressure).
          *   Needs to distinguish from selfishness (it's about the *object* of judgment, not just the *agent's* gain).
          *   *Idea:* A critique of a mentor's failing work.
          *   *Why:* Career gain is obvious. Loyalty is subtle. Neither makes the art *good*.
          *   *Misconception Preemption:* Explanatory vs. Justifying. (Address this when analyzing *why* she praised it).

      *   **Phase 3: Introducing the Distinction (The Theory):**
          *   Now introduce the "Fittingness" vs. "Incentive" distinction.
          *   *Timing:* Only after the example has shown the failure.
          *   *Terminology:* Keep it non-technical. "Reasons about the Art" vs. "Reasons about the Situation."
          *   *Misconception Preemption:* Hypocrisy. (Address this when defining the right kind of reason).

      *   **Phase 4: The "Pro-Attitude" Concept:**
          *   Request says: Introduce "pro-attitude" *only after* she has seen the concrete failure.
          *   Why? Because abstract definitions of attitudes are boring/confusing. She needs to feel the mismatch first.
          *   Definition: Praise/Admiration is a tool. Does the tool fit the object?

      *   **Phase 5: Check for Understanding:**
          *   Needs a novel case.
          *   Scenario: Buying art for investment vs. loving the art. Or maybe a friend's bad play.
          *   Let's go with a "Charity Auction" scenario. It mixes social pressure and financial good.

      *   **Phase 6: Boundaries (What to Exclude):**
          *   No belief parallels (doxastic WKR).
          *   No metaethics (realism/anti-realism).
          *   No institutional rationality (sociology of art markets).

  4.  **Refining the Sequence & Constraints:**

      *   *Constraint Check:* Did I put "pro-attitude" after the failure case? Yes.
      *   *Constraint Check:* Is the example specific enough? I need to ensure the plan specifies *what* the example must include/exclude to avoid the "selfishness" trap. (Crucial: The WKR isn't that she benefited, it's that the benefit isn't a property of the art).
      *   *Constraint Check:* Misconceptions mapped to sequence points?
          *   Honesty -> Phase 1.
          *   Explanatory/Justifying -> Phase 2 (Analysis of the example).
          *   Hypocrisy -> Phase 3 (Defining the Right Kind).
      *   *Constraint Check:* Boundaries explicit? Yes, in a dedicated section.

  5.  **Polishing the Tone:**
      *   The output must be a *plan*, not the *script*. It should tell the user *how* to teach, not *what* to say verbatim (though it can suggest phrasing).
      *   It needs to be structured logically for a dinner conversation (flowing, not lecture-heavy).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "pro-attitude" section too technical?
      *   *Fix:* Instruct the user to translate "pro-attitude" into "stance of approval" or "direction of fit" without using jargon. The plan should specify *when* to introduce the concept, not necessarily the jargon itself, but the prompt asks for the "idea of a pro-attitude." I will instruct the user to introduce the *concept* (that praise is a specific response) without necessarily forcing the jargon if it hinders dinner talk, but I must adhere to the prompt's requirement to include the *idea*.
      *   *Critique:* The example needs to ensure she doesn't think WKR = Selfishness.
      *   *Fix:* The plan must explicitly instruct the user to highlight that *altruistic* reasons (loyalty) are also Wrong Kind. This proves it's not about selfishness.

  7.  **Finalizing the Structure:**
      *   Session Overview (Goal/Time/Setting).
      *   Phase 1: Validation & The Honesty Trap.
      *   Phase 2: The Carrying Example (The Mentor's Retrospective).
      *   Phase 3: The Distinction (Fittingness vs. Incentive).
      *   Phase 4: The Nature of Praise (Pro-Attitudes).
      *   Phase 5: Assessment (The Novel Case).
      *   Exclusions (Boundaries).

  8.  **Final Review against Prompt:**
