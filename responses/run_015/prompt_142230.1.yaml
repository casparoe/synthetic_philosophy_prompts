      *   **Verdict:** The argument is unsound.
      *   **The Rotten Step:** The inference from "arbitrary origin" to "no moral grip" (Premise 2).
      *   **Theoretical Fix:** The Principle of Fair Play + The Constitutive Nature of Conventions.
