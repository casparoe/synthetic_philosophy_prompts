answer: |-
  This is a sharp piece of reasoning. It effectively deploys a Humean/Lewisian account of convention to generate conclusions that clash with our moral intuitions (the "visitor" problem and the "Marisburg" problem).

  The argument is **unsound**. The rotten step lies in the inference from **arbitrariness** to **lack of moral grip** (your second sentence/premise). Specifically, it relies on a category error regarding what conventions *do* once they are established.

  Here is the breakdown of where the argument fails, followed by an analysis of whether the solution varies across your three cases.

  ### 1. The Rotten Step: The "Arbitrariness Fallacy"

  Your argument rests on this claim: *"If that is right, the content of the local rule is arbitrary, and so the only consideration in favor of conforming is that nonconformists get sanctioned."*

  This is the weak link. It assumes that because a rule *could have been otherwise* (e.g., we could have queued by height instead of arrival), the *actual* rule possesses no normative force beyond prudential fear of sanctions.

  This overlooks two crucial philosophical mechanisms that generate obligation from arbitrary conventions:

  **A. The Principle of Fair Play (Hart/Rawls)**
  Even if the rule is arbitrary, the *practice* produces a good (order, efficiency, predictability). When locals conform, they restrict their own liberty to produce that good. If a visitor benefits from that order (e.g., the queue moves efficiently because others wait) without conforming, they are **free-riding**. They are taking the benefit of the cooperative scheme without bearing the burden. The obligation to conform arises not from the content of the rule, but from the duty of reciprocity to those who are maintaining the scheme.

  **B. The Constitutive Nature of Conventions (Lewis/Searle)**
  In coordination problems, the rule doesn't just regulate an activity; it *constitutes* it. "Queueing" does not exist as a physical fact; it exists only because of mutual expectations.
  *   In **Marisburg**, "holding a place" constitutes ownership.
  *   In **Non-Marisburg**, "standing in line" constitutes ownership.
  If you bring Marisburg money to a Non-Marisburg store, you aren't "following your convention"; you are attempting a transaction in a currency that has no value there. By offering to buy a spot in a first-come-first-served queue, you are not participating in the queueing practice; you are attempting to bypass it. You cannot claim the license of Convention A while operating within the physical and social jurisdiction of Convention B.

  ### 2. Defeating the Consequences

  **Against Consequence 1 (The Visitor):**
  The visitor *does* owe the locals something. By entering the local "game," the visitor implicitly accepts the local rules of coordination. If they do not, they disrupt the equilibrium. The "dirty looks" are not merely aesthetic disapproval; they are the social enforcement of the Fair Play principle. The visitor is not just being "impolite"; they are undermining the cooperative equilibrium that others are relying on to navigate their day.

  **Against Consequence 2 (Marisburg):**
  The Marisburg visitor is not licensed to import their convention. Conventions are **relational**, not portable properties. A "valid place in line" is a status conferred by the mutual recognition of the people *in that line*. If the people in the Lisbon line do not recognize "sold spots" as valid, then the spot is not sold. The Marisburg visitor is essentially trying to play chess using checkers rules; they aren't playing a different valid game, they are ruining the game currently being played.

  ### 3. Do the cases differ?

  While the core logical error is the same in all three, the *strength* of the moral obligation varies because the practices are not identical in nature.

  **Queueing (Pure Convention + Fairness)**
  *   **Analysis:** This is the strongest case for your argument, as it is the closest to a "pure" coordination problem.
  *   **Why the argument fails here:** It relies entirely on the **Principle of Fair Play**. There is no physical harm in jumping a queue, but there is a distributive injustice. You are prioritizing your time over the equal time of others who restrained themselves. The obligation is to *them*, not the rule.
  *   **Verdict:** The visitor is wrong because they are free-riding on the restraint of others.

  **Jaywalking (Convention + Harm/Law)**
  *   **Analysis:** This is the weakest case for your argument. Jaywalking is rarely just a convention; it is usually codified law tied to safety.
  *   **Why the argument fails here:** It relies on the **Harm Principle**. Even if driving on the left vs. right is arbitrary, the *signal* is a safety mechanism. Crossing against it introduces risk of physical harm to oneself and drivers (who must brake unexpectedly).
  *   **Verdict:** The visitor is wrong not just because of etiquette, but because they are introducing tangible risk into a system designed to mitigate it. The "arbitrariness" of the signal color or timing does not negate the non-arbitrary need for traffic predictability.

  **Tipping (Convention + Implicit Contract)**
  *   **Analysis:** This is distinct from the other two. Tipping is often not merely a coordination convention but an **implicit economic contract**.
  *   **Why the argument fails here:** In many jurisdictions (like New York), the social norm is backed by a wage structure where servers are paid below minimum wage *on the expectation* of tips.
  *   **Verdict:** When you order the food, you enter a transaction. If the local custom is that the price is $X + 20%, and you pay only $X, you may be technically fulfilling the legal menu price, but you are violating the implicit agreement under which the service was rendered. It is closer to underpayment than to queue-jumping. The visitor is wrong because they are accepting a service under terms they do not intend to honor.

  ### Summary

  The rotten step is the assumption that **arbitrariness of origin implies arbitrariness of obligation.**

  Once a convention is established, it creates a network of expectations and reliance. To violate it is not merely to choose a different equilibrium; it is to exploit the fact that others are stuck in the current one.

  *   **Queueing:** You violate **Fairness** (free-riding on restraint).
  *   **Jaywalking:** You violate **Safety** (disrupting predictability).
  *   **Tipping:** You violate **Contract** (reneging on implicit terms of exchange).

  The visitor is not a neutral observer; by acting, they become a participant. And a participant who plays by their own rules while others play by the local rules is not a "cultural explorer," but a defector.
