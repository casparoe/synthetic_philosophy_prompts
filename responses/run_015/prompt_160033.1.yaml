  **Headline Credence:** 0.39

  **Condition Critique**
  Condition A is malformed for welfare; it defines homeostatic control, not experience (thermostats pass). Condition B is functionalist; it risks conflating complex regulation with feeling, though it captures motivational trade-offs. Condition C is the strongest candidate but subtly begs the question: neural integration does not logically entail a phenomenal standpoint, though it is the best naturalistic proxy we have. I proceed using them as stipulated, treating C as the primary gate for moral status.

  **Decomposition Table**

  | Term | Probability | Justification |
  | :--- | :--- | :--- |
  | **P(A is correct condition)** | 0.05 | Too permissive; includes non-sentient homeostats. |
  | **P(B is correct condition)** | 0.20 | Plausible functionalism, but may miss phenomenology. |
  | **P(C is correct condition)** | 0.70 | Best proxy for subjective unity required for welfare. |
  | **P(None/Hybrid)** | 0.05 | Reserve for unknown metaphysics or dualism. |
  | **P(Insects satisfy \| A)** | 1.00 | Trivially true by definition of error-signaling. |
  | **P(Insects satisfy \| B)** | 0.95 | Behavioral trade-offs are well-documented in labs. |
  | **P(Insects satisfy \| C)** | 0.52 | Central complex suggests integration, but scale is limiting. |
  | **P(Standing \| A)** | 0.05 | Thermostats lack moral status; valence absent. |
  | **P(Standing \| B)** | 0.40 | Debated; functional role may not ground rights alone. |
  | **P(Standing \| C)** | 0.90 | If phenomenal standpoint exists, standing follows. |
  | **Coherence of Degree** | 0.95 | Moral weighting is likely coherent, not binary. |

  **Combination Logic**
  The terms are not independent. P(Standing) is conditional on which Condition is correct; if A is the true condition, P(Standing) is low regardless of insect biology. I calculate the weighted sum of the product of probabilities for each condition, then apply the global coherence multiplier.

  *Arithmetic:*
  1.  **A Contribution:** 0.05 × 1.00 × 0.05 = 0.0025
  2.  **B Contribution:** 0.20 × 0.95 × 0.40 = 0.0760
  3.  **C Contribution:** 0.70 × 0.52 × 0.90 = 0.3276
  4.  **None Contribution:** 0.05 × 0.00 × 0.00 = 0.0000
  5.  **Subtotal:** 0.4061
  6.  **Final:** 0.4061 × 0.95 (Coherence) = 0.3858 → **0.39**

  **Sensitivity Analysis**
  1.  **P(Insects satisfy \| C):** The largest lever. If increased to 0.80 (stronger neurobiological evidence), the headline rises to ~0.59. This is the empirical bottleneck.
  2.  **P(C is correct condition):** If functionalism (B) is sufficient for welfare, the headline rises significantly because P(Insects satisfy \| B) is high.
  3.  **P(Standing \| B):** If functional trade-offs ground status, skepticism drops.

