  - what_it_measures: object with the fields real_name_for_the_property, what_it_does_not_touch, and why_behaviour_underdetermines_it (one sentence on what you cannot settle by watching from outside)
  - items: array of seven objects, one per item in the order I listed them, each with the fields item, loop_persistence (a number, or the string undecidable), rigid_or_flexible (one of rigid, flexible, undecidable from behaviour alone, both depending on timescale), freedom_verdict (a short string, or the string none available), and scoring_trap (the mistake a person makes in scoring this item)
  - door_lock_and_wasp: object with the fields does_the_analogy_hold, what_they_share, and how_they_differ (strings)
  - second_order_axis: object with the fields does_it_help (string) and what_it_actually_tracks (string)
  - revised_question: string, the question I should have asked instead of the one I asked
  - free_text_notes: string, anything else you want to tell me
