  (5) **Hard to Judge and What Would Have Settled It**

  **What was hard to judge:** The student's final move in Paragraph 4, suggesting we assess agents by "whether she reliably gets things right over time rather than by what moved her."
  *   **Why:** It is unclear if the student is proposing this as a *Kantian* amendment (focusing on the adoption of maxims over time rather than single actions) or abandoning Kant for a consequentialist/virtue framework. If the former, it shows sophistication; if the latter, it is an evasion of the question's demand to evaluate the damage to the *Kantian doctrine*.

  **What would have settled it:**
  *   To settle the Williams point: The student needed to mention *personal relationships* or *partiality*. A sentence like, "Williams argues that in saving a loved one, appealing to duty alienates the agent from the personal commitment," would have proven they understood the objection is about the *content* of the motive, not the *knowability* of it.
  *   To settle the Overdetermination point: The student needed to acknowledge that while the *action* in case (a) lacks worth, the *agent* might still possess a good will because the duty-motive was a sufficient backup. Dismissing the counterfactual as "irrelevant" signals a rigid, perhaps textbook-derived, understanding rather than engagement with the nuance you taught.

  **Summary for Feedback:**
  Tell the student: "You have a solid grasp of the basic definitions in the *Groundwork*, but you lose significant marks by conflating 'moral worth' with 'moral rightness' (the shopkeeper acts rightly, even if without worth) and by misidentifying Williams's objection (which is about alienation in personal relationships, not the difficulty of knowing one's motives). Be careful not to infer that Kant requires conflict with inclination; he requires duty to be the *determining* ground, which is compatible with having inclination."
