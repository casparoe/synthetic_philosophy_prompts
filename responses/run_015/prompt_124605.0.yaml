  so i'm in an intro set theory course (philosophy dept version, so we also spend time on whether anyone should believe AC) and last week we derived Zorns lemma from the well ordering theorem. The prof then handed out three bogus applications and said find the error, and i tried to build my own, and instead of a bogus application i seem to have built a proof that set theory is inconsistent. That's obv wrong, so one of these steps is bad:

  (1) Zorns lemma: if a nonempty poset has an upper bound for every chain, then it has a maximal element.
  (2) Let P be the set of all countable subsets of R, ordered by inclusion. This is a genuine set, a subset of P(R), so it isn't the proper class thing my TA already busted me for when i tried the same argument with 'all well ordered sets' — i get that one now, this is supposed to be the fixed version.
  (3) Every chain in P has an upper bound in P. Given a chain C, take the union: it contains every member of C, and it's countable. I don't have a slick reason for that last bit, it just feels right — the members of C are nested, so the union is some kind of limit of them, and a nested union of small sets shouldn't be able to jump all the way up to uncountable. Also every Zorn proof in my notes does exactly this move: take the union of the chain, say it's still in the poset, move on. It's always fine there.
  (4) So P has a maximal element M: a countable subset of R that isn't properly contained in any other countable subset of R.
  (5) But R is uncountable, so M isn't all of R, so pick x outside M; M u {x} is countable and properly contains M. So M wasn't maximal.
  (6) So Zorns lemma is false, and since we got it from AC, AC is inconsistent.

  Heres what makes me think I'm missing something structural rather than just being sloppy. If i run the exact same argument with 'finite subsets of N' I can see the hole instantly: the chain {0,...,n} has union N, which isn't finite, so step (3) just fails and I can write down the offending chain in two seconds. In the countable case there must also be a chain of countable subsets of R with uncountable union, and I cannot picture one, let alone write it down. The only way i can think of to get one is to well order R and take initial segments of length omega_1 — which uses AC, and i'm using AC to locate the hole in an argument whose conclusion is that AC is inconsistent, so i don't know whether that's fine, circular, or telling me something.

  So: which step do i drop? I'd rather keep (1) and (5) if at all possible. If it is (3), I want the rest: why is the union-of-a-chain move safe in the textbook applications (bases, maximal ideals, well orderings) and lethal here — is there a general property the poset needs, something like the defining condition being checkable on finite subsets, or is it case by case? Is there anything general to say about how long the bad chain has to be? I tried the template again with 'subsets of R of size less than c' and I think the offending chain has to have length cf(c), but im not sure. And does building the bad chain actually need choice, or is there a choiceless example?
