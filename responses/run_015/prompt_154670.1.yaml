answer: |-
  # Teaching Plan: Higher-Order Evidence & Epistemic Akrasia
  **Session Duration:** 50 Minutes
  **Target Audience:** 2nd-Year Philosophy (Intro Epistemology completed, No HOE background)
  **Core Case:** Dr. Lena's Clinical Trial (Self-Undermining Meta-Analysis)

  ---

  ## 1. Rationale: Why Lena and Not the Sleeping Expert?
  **The Pitfall of the Sleeping Expert:**
  The standard "Sleeping Expert" case (e.g., you are drugged, so your reasoning is unreliable) posits Higher-Order Evidence (HOE) as **external** and **independent**. The evidence that you are unreliable comes from a source (the pill, the testimony) that is not itself subject to the doubt.
  *   **The Risk:** Students treat HOE as just another piece of First-Order Evidence (FOE) to be weighed. They think, "I have evidence for P, and evidence that I'm tired, so I'll just lower confidence slightly." It becomes a math problem, not a structural crisis.
  *   **The Lena Advantage:** Lena's case introduces **self-referential circularity**. The evidence that her reasoning is flawed is generated *by* the reasoning she is doubting. This prevents the "just weigh the evidence" solution and forces the class to confront **Epistemic Akrasia** (believing $P$ while believing it is irrational to believe $P$) as a structural inevitability, not a failure of will.

  ---

  ## 2. Conceptual Dependencies (The "Lock-In" Order)
  Do not define Akrasia immediately. Build the tension first.
  1.  **First-Order Evidence (FOE):** Evidence about the world (e.g., clinical data).
  2.  **First-Order Belief:** The conclusion drawn from FOE.
  3.  **Higher-Order Evidence (HOE):** Evidence about the *relationship* between FOE and Belief (reliability/rationality of the process).
  4.  **Epistemic Akrasia:** The resulting state of conflict (Belief $P$ + Belief "Believing $P$ is unsupported").

  **Crucial Distinction to Lock Early:**
  *   **Truth-Directed Evidence:** Tells you whether $P$ is true.
  *   **Rationality-Directed Evidence:** Tells you whether your *grip* on $P$ is secure.
  *   *Board Note:* Draw a vertical hierarchy. Level 1: The World. Level 2: The Mind assessing the World.

  ---

  ## 3. Session Arc & Sequencing (50 Minutes)

  ### Phase 1: The Setup & First-Order Confidence (0:00–0:10)
  *   **Activity:** Present the base case without the twist.
      *   *Lena's Data:* Drug X shows $p < 0.05$ efficacy.
      *   *Lena's Framework:* Standard Frequentist Statistics (Framework F).
      *   *Lena's Conclusion:* "Drug X works." (High Confidence).
  *   **Check:** Ask students: "Based *only* on this, is Lena rational?" (Consensus: Yes).
  *   **Goal:** Establish the baseline rationality of trusting one's own reasoning when no HOE is present.

  ### Phase 2: Introducing Higher-Order Evidence (0:10–0:20)
  *   **Activity:** Introduce the Meta-Analysis.
      *   *The HOE:* A meta-analysis of 100 similar trials shows researchers using Framework F are systematically overconfident by 15%.
      *   *Initial Question:* "Should Lena adjust her confidence?"
      *   **Anticipated Misconception 1 (The Split):** Students will say, "Yes, just lower confidence by 15%."
      *   **Intervention:** Accept this provisionally. "Okay, she lowers confidence. She now believes 'Drug X works' with 85% confidence."
  *   **Goal:** Show that HOE normally functions as a "defeater" or "calibrator."

  ### Phase 3: The Twist & The Circular Trap (0:20–0:35)
  *   **Activity:** Reveal the structural flaw.
      *   *The Twist:* The Meta-Analysis *itself* was conducted using Framework F.
      *   *The Implication:* If Framework F produces 15% overconfidence, the Meta-Analysis *also* suffers from 15% overconfidence.
      *   *The Loop:* If she trusts the Meta-Analysis, she must doubt the Meta-Analysis.
  *   **Discussion:** "Can Lena rationally believe the Meta-Analysis?"
      *   If **Yes**: She must doubt her reasoning (including the reasoning that validates the Meta-Analysis).
      *   If **No**: She has no reason to lower her confidence in the original trial.
  *   **Anticipated Misconception 2 (Hypocrisy):** Students may say, "She's just contradicting herself. That's irrational."
      *   **Intervention:** Distinguish **Contradiction** ($P$ and $\neg P$) from **Akrasia** ($P$ and "I shouldn't believe $P$").
      *   *Board Note:* Write: $P$ + $\neg P$ = False. $P$ + "Belief in $P$ is unjustified" = Akrasia.
  *   **Goal:** Make the circularity feel like a trap, not a puzzle. She is forced into a state where her total evidence suggests she shouldn't hold the belief her total evidence supports.

  ### Phase 4: Defining the Akratic Bind (0:35–0:45)
  *   **Activity:** Formalize the state.
      *   Lena believes: "Drug X works." (Driven by FOE).
      *   Lena believes: "My belief that Drug X works is likely overconfident." (Driven by HOE).
      *   **Key Question:** "Is Lena irrational?"
      *   **Anticipated Misconception 3 (HOE = Self-Doubt):** Students might think HOE is just about feeling unsure.
      *   **Intervention:** Clarify that HOE is objective evidence about reliability, not subjective anxiety.
      *   **The Hard Lesson:** The rational response to HOE might *require* Akrasia. To be fully rational, she must acknowledge the HOE, which tells her she is being irrational.
  *   **Goal:** Shift the view of Akrasia from "a failure of rationality" to "a possible requirement of rationality."

  ### Phase 5: End-of-Session Check (0:45–0:50)
  *   **The "Forced Choice" Vignette:**
      *   *Prompt:* "Lena must sign a prescription pad *now*. If she signs, she endorses the drug. If she doesn't, patients suffer. She knows the circularity problem is unsolved."
      *   *Question:* "If she signs while thinking 'I probably shouldn't trust this signature,' is she acting irrationally? Why or why not?"
  *   **Success Criteria:**
      *   **Fail:** "Yes, she's hypocritical." or "No, she just ignores the meta-analysis."
      *   **Pass:** "She is rationally trapped. Acting on the FOE is necessary, but acknowledging the HOE is also necessary. The tension isn't a mistake; it's the accurate map of her evidence."
  *   **Closing Statement:** "We are not solving whether she should sign. We are acknowledging that rationality might not be a harmonious state."

  ---

  ## 4. Case Construction: Include vs. Exclude
  **To Include (Essential for the problem):**
  *   **The Specific Framework:** Explicitly state both the trial and the meta-analysis use "Framework F." This creates the self-undermining loop.
  *   **The Metric:** Keep the "15% overconfidence" figure. It makes the HOE precise enough to demand a response, preventing students from dismissing it as "vague noise."
  *   **The Stakes:** Clinical trial. It ensures students treat the belief as action-guiding, not abstract.

  **To Exclude (Distractions):**
  *   **Lena's Psychology:** Do not mention if she is tired, stressed, or biased. The flaw must be *structural*, not psychological. (Avoids "just get some sleep" solutions).
  *   **The Drug's Actual Efficacy:** Do not reveal if Drug X actually works. This is about justification, not truth.
  *   **Peer Disagreement:** Do not mention other doctors disagreeing. Keep it focused on *her* evidence about *her* reliability. (Avoids conflating HOE with Peer Disagreement).

  ---

  ## 5. Scope Limitations (What to Refuse)
  **Openly state at the start:**
  > "We are mapping the problem, not solving it. Today is about diagnosis, not cure."

  1.  **No Formal Bayesian Modeling:** We will not calculate posterior probabilities. The circularity breaks standard conditionalization anyway.
  2.  **No 'Right Response' Debate:** We will not decide between 'Steadfastness' (ignore HOE) vs. 'Conciliationism' (bow to HOE). Both have costs in this scenario.
  3.  **No Metaphysics of Evidence:** We will not debate whether HOE *is* evidence. We are assuming it is for the sake of the puzzle.

  ---

  ## 6. Board Plan (Visual Anchor)
  *   **Left Column:** **First-Order** (Data $\rightarrow$ Belief). Label: "World-Directed."
  *   **Right Column:** **Higher-Order** (Reliability $\rightarrow$ Confidence). Label: "Mind-Directed."
  *   **Center:** **The Clash.** Draw an arrow from Right to Left (HOE undermines FOE). Draw a dotted arrow from Left to Right (FOE generated the HOE).
  *   **Bottom:** **Akrasia.** "Belief $P$ + Belief 'Belief $P$ is unsupported'."

  ---

  ## 7. Instructor Notes: Handling the "Circularity"
  *   **The Danger:** Students might treat the circularity as a logical fallacy (begging the question).
  *   **The Correction:** Emphasize that Lena isn't *arguing* in a circle. She is *evidentially* trapped. The evidence she has access to is the only evidence available, but that evidence casts doubt on itself.
  *   **Phrasing:** "It's not that her logic is invalid. It's that her tools are measuring themselves."

  ## 8. Why This Works for 2nd Years
  This level of student understands justification and evidence but usually views rationality as **coherentist** (everything fits together). The Lena case forces them to see that **total evidence** can demand **incoherence** (akrasia). It moves them from "Rationality = Consistency" to "Rationality = Responsiveness to Evidence (even when evidence conflicts)." This is the precise conceptual leap needed before tackling peer disagreement or skepticism in later years.
