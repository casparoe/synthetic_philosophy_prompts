answer: |-
  The standard treatment of decision problems involving predictors often groups Counterfactual Mugging and XOR Blackmail together, suggesting that a rational agent should adopt a single policy that applies to both. This view assumes that the structural presence of a predictor or a logical dependency necessitates a uniform response, typically requiring the agent to commit to actions that maximize value across all possible worlds, regardless of which world is actualized. I argue that this assimilation is a mistake. Counterfactual Mugging and XOR Blackmail demand opposite rational verdicts: an agent should pay in XOR Blackmail but refuse to pay in Counterfactual Mugging. This divergence arises because XOR Blackmail instantiates a **branch-binding correlation**, where the agent's choice is evidentially linked to the payoff within the set of worlds compatible with their current information. In contrast, Counterfactual Mugging relies on a **cross-world commitment**, where the payoff resides in a world that is provably incompatible with the agent's current evidence. Rational choice should be sensitive only to the former.

  To understand this distinction, we must analyze the structure of the decision problem relative to the agent's information set. A decision problem consists of a set of possible states of the world, a set of available actions, and a function mapping state-action pairs to outcomes. The crucial difference lies in which states are considered "live" possibilities at the moment of decision.

  In XOR Blackmail, the agent receives a letter. The content of the letter and the state of the world (whether a disaster occurs) are linked by a logical rule known to the agent: the letter is sent if and only if the disaster status and the agent's payment decision differ. Upon receiving the letter, the agent faces two epistemically possible worlds: one where the disaster occurs and one where it does not. Crucially, both worlds are compatible with the agent's current evidence (the letter). The agent's decision now acts as a selector between these two live branches. If the agent chooses to pay, the logical rule dictates that the disaster did not occur. If the agent chooses not to pay, the rule dictates that the disaster did occur. Here, the correlation is branch-binding: the action taken in the actual moment determines which of the *epistemically possible* branches is the actual one. The payoff (avoiding the disaster) is realized in the actual world, contingent on a logical constraint that binds the action to the state of affairs within the current information set.

  In Counterfactual Mugging, the structure is fundamentally different. A coin has already been flipped. The agent knows with certainty that the coin landed on Tails. The reward, however, is located in the Heads branch. The Heads branch is not epistemically possible; it is counterfactually excluded by the agent's evidence. The link between the agent's current action (paying in the Tails world) and the reward (in the Heads world) is not a correlation between action and state within the live information set. Instead, it is a dependency on a past prediction about how the agent *would have* acted in a world that does not exist. The agent's current choice cannot select between the Heads world and the Tails world, because the Tails world is the only one compatible with reality. The "correlation" here is a cross-world commitment: it asks the agent to sacrifice value in the actual, inhabited world to satisfy a condition for value in an uninhabited, impossible world.

  Rational choice should be governed by the principle of **actual-world efficacy within the epistemic horizon**. An agent's function is to navigate the world as it is revealed to them, maximizing outcomes in the worlds they might actually inhabit. In XOR Blackmail, the agent inhabits a situation where the disaster status is uncertain but logically tied to their choice. By paying, they effectively secure the "No Disaster" branch of their current epistemic horizon. The correlation is actionable because it resolves uncertainty about the actual world. In Counterfactual Mugging, there is no uncertainty about the coin flip. The "Heads" world is not a branch the agent can navigate into; it is a closed door. To pay is to incur a certain loss in the actual world for a benefit that is causally and evidentially severed from the actual decision node. The predictor's past simulation does not make the Heads world accessible; it merely records a fact about the agent's disposition. Rationality requires responding to the world one is in, not optimizing for a world one is demonstrably not in.

  One might object that this distinction is ad hoc. If an agent cares about the good of their "decision algorithm" across all possible worlds, why should the mechanism of correlation matter? If the agent values the outcome in the Heads world, they should pay to ensure their algorithm is the type that secures that reward, regardless of whether the Heads world is currently actual.

  This objection fails because it conflates *valuing outcomes* with *having agency over outcomes*. Rational choice is not merely about wishing for good outcomes in all logical possibilities; it is about executing actions that have leverage over those outcomes. In XOR Blackmail, the action has leverage. The logical constraint means that the action *now* is part of the truth conditions for the disaster state *now*. The agent's decision is a variable in the equation that determines the actual state of affairs. In Counterfactual Mugging, the action has no leverage over the Heads world. The coin flip is past; the Heads world is fixed as non-actual. The only thing the agent's action affects is the Tails world payoff (which is zero) and the accuracy of a past prediction. To argue that the agent should pay is to argue that they should treat a past prediction as a causal lever. This violates the structural asymmetry of time and evidence. The distinction is not ad hoc; it is grounded in the difference between resolving uncertainty about the actual world (which actions can do) and attempting to influence a world that evidence has ruled out (which actions cannot do). Caring about other worlds is permissible, but sacrificing actual utility for them is irrational when the mechanism of influence is purely counterfactual rather than evidentially binding within the actual context.

  Therefore, the rational verdict is to Pay in XOR Blackmail and Refuse in Counterfactual Mugging. This position acknowledges that evidential correlations are binding when they operate within the agent's current information set to resolve uncertainty about actual outcomes. However, it rejects the notion that agents should optimize for outcomes in worlds that are evidentially excluded, even if a predictor's past behavior links them to the agent's disposition.

  This argument supports **Evidential Decision Theory**. It accepts the core tenet that an agent should choose actions that provide good news about the state of the world (paying in XOR Blackmail provides news that there is no disaster). However, it naturally rejects the extension of this logic to counterfactuals where the evidence rules out the relevant state (in Counterfactual Mugging, the evidence rules out the Heads world, so paying provides no evidential benefit regarding actual outcomes). It diverges from Causal Decision Theory, which would typically reject paying in both cases by ignoring the evidential link in XOR Blackmail, and it diverges from Updateless Decision Theory, which would typically require paying in both cases to optimize the global policy. By grounding rationality in branch-binding correlations within the actual information set, this view aligns with the evidential approach while maintaining a strict boundary against cross-world sacrificial commitments.
