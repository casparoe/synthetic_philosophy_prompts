  Subject: Sorting out the blame debate

  Hi everyone,

  Since we seem to have reached an impasse at the pub regarding Strawson and whether blame requires the ability to do otherwise, or whether it is merely about quality of will or social utility, I have put together a little diagnostic tool. The aim is to bypass the labels we are all throwing around and see where our intuitions actually land when faced with concrete situations. Below are ten questions based on the cases we argued about, each with a few possible responses. Please read them through and note which option feels most natural to you, without worrying about what philosophical theory it might represent.

  1. A friend lets you down badly out of pure thoughtlessness with no malice at all. Do you feel resentment? Option one is yes, because they should have cared more about you. Option two is no, because without malice there is no blame to be had. Option three is that you might express blame, but only to teach them to be more careful next time.

  2. A teenager who grew up in a violent, chaotic home is now violent himself. Is he blameworthy? Option one is yes, his actions matter regardless of his past. Option two is no, because his background caused his behaviour. Option three is that blame is only appropriate if it actually stops the violence.

  3. Someone does you serious harm while under hypnosis. Are they responsible? Option one is no, because it was not their agency at work. Option two is yes, because it was still their body acting. Option three is that responsibility is irrelevant and we should just focus on safety.

  4. Consider the same harm done by someone with a brain tumour pressing on the relevant bit. Does this change your view? Option one is yes, this is an exemption like hypnosis. Option two is no, biological causes are just part of who they are. Option three is that we treat them differently but not because they lack responsibility.

  5. A person wronged you and later had a brain injury that completely changed their personality. Do you blame the new person? Option one is no, because they are effectively a different person now. Option two is yes, because they are the same human being. Option three is that blame is pointless, we should focus on care.

  6. A five-year-old destroys something precious to you. Is it wrong? Option one is yes, but they are not to blame. Option two is no, they are too young to understand. Option three is that you should scold them solely so they learn.

  7. A wrong is done to you by a company or a crowd where no single person's will is the culprit. Who do you blame? Option one is the collective entity itself. Option two is no one, we should just fix the system. Option three is the nearest boss who can be held accountable.

  8. A stranger helps you out for a rotten reason. Does the reason matter? Option one is yes, the motive defines the moral worth. Option two is no, the good outcome stands alone. Option three is that you feel grateful but assess them as a bad person.

  9. You are blaming yourself for something you did years ago. Is this rational? Option one is yes, because you did it. Option two is no, because that past self is gone. Option three is only if feeling guilt helps you behave better now.

  10. If science proved every action was causally determined, would you stop blaming? Option one is yes, because no one could have done otherwise. Option two is no, because blame is about attitudes, not metaphysics. Option three is that we would keep the practice but change what we mean by it.

  Now, to make sense of your answers, imagine walking down a path where each choice pushes you toward a specific corner of the logical space. First, look at your answers to the teenager, the brain tumour, and the determinism question. If you consistently said that causation or background removes blame, you are walking down the hard line path. This view holds that if everything about a person was caused then nobody is ever blameworthy in the desert sense. The most awkward commitment here is that you must abandon blame entirely even for cruel tyrants if their actions were determined. If instead you said blame stays on the table despite causation, look next at why you keep it. If you focused on whether the person cared about you or regarded you poorly, as in the friend and stranger cases, you are likely in the Strawson or quality-of-will camp. These two positions are very close, with Strawson's own view emphasising that our reactive attitudes are natural and non-optional, while the quality-of-will compatibilist argues they are justified by the agent's regard. The quiz cannot genuinely separate these two leaves because both require blaming the thoughtless friend but exempting the hypnotised subject. The most awkward commitment for Strawson is that our practice of blame is ultimately beyond rational justification, while for the quality-of-will compatibilist it is that we must accept blame even if determinism is true.

  If you focused instead on whether blaming would produce good results, such as stopping the teenager or teaching the child, you land on the straight consequentialist view that blame is a tool for deterrence and reform. The most awkward commitment here is that you might have to blame an innocent person if doing so would prevent greater harm. There is also a revisionist spot nearby for those who said we should keep the practice but retune it to what it actually achieves, which often overlaps with consequentialism but tries to preserve the language of desert. The most awkward commitment for the revisionist is that they are changing the subject while claiming to keep the same practice. Finally, if you said you can assess someone as a bad person without it following that they are to blame, perhaps in the case of the stranger or the friend, you hold the separation view. The most awkward commitment here is maintaining a negative moral assessment while refusing the natural emotional response of resentment.

  Regarding empty combinations, there is a space that remains uninhabited because it is incoherent. This is the combination of saying that determinism removes all desert but also that blame is solely a tool for utility without any revisionist caveat. This is unstable because if no one deserves blame, using it purely as a tool becomes manipulative in a way most people find repugnant unless they admit they are revising the concept. Another empty spot is blaming the five-year-old for desert while exempting the teenager due to background causes, as this relies on an arbitrary line regarding capacity that nobody really defends. There is also a combination where one claims to blame the company but not any individuals within it while denying collective agency, which is simply confused about where the will resides.

  I hope this helps us see where we actually stand rather than where we think we should stand. Let me know which path you ended up on when we meet next week.

  Best wishes

  Me
