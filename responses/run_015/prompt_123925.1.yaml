      *   *The Conflict:* Is this *precognition* (seeing a future that isn't fixed yet) or *eternalism* (seeing the future because it's already there)?
      *   *Film vs. Story:* The film leans harder into the "choice" aspect (knowing the end but choosing it anyway), which introduces a tension with strict determinism. The story is more linguistic determinism (Sapir-Whorf on steroids).

  4.  **Address the Specific Questions:**

      *   *Mapping Louise's Experience to Rietdijk-Putnam:*
          *   RP says all points in spacetime exist. Louise accessing future memories suggests she is moving her consciousness along the time dimension as if it were space.
