answer: |-
  You are right to lean into the Rietdijk-Putnam argument here, and your roommate is right that the film uses that physics to service an emotional arc about grief. But dismissing the relativity angle as mere window dressing misses the actual ontological claim the movie makes. If you take the Rietdijk-Putnam argument seriously, *Arrival* isn't just a metaphor for grief; it is a dramatization of Eternalism. However, the film does cheat on the implications of that view to preserve human agency.

  Here is the breakdown of how Louise's experience maps onto the block universe, where the Lorentz analogy holds, and where the film smuggles in a privileged frame to make the ending work.

  ### The Ontological Status of Future Memories
  The core of the Rietdijk-Putnam argument is that if special relativity is true, there is no objective present. Because simultaneity is frame-dependent, what constitutes "now" for me might include events in your future depending on our relative velocity. If reality is objective (i.e., what exists shouldn't depend on who is looking), then those future events must be just as real as present ones. This forces the conclusion of the Block Universe: past, present, and future all exist tenselessly in a four-dimensional manifold.

  In *Arrival*, Louise's "memories" of her daughter are the cinematic proof of this ontology. If the future were open—if it were genuinely *not yet real*—Louise could not remember it. You cannot have a memory of something that does not exist. By granting her epistemic access to the future, the film commits to the ontological reality of the future.

  This answers your question about whether the future is epistemically accessible but ontologically future. Under a strict Rietdijk-Putnam reading, that distinction collapses. If she can access it, it must exist. Therefore, the film treats her future memories as part of an eternal present. Her consciousness isn't traveling forward in time; it is moving along the time dimension as if it were space, viewing the coordinate of her daughter's death just as she views the coordinate of her birth. This is exactly the Block Universe view: time is a dimension of being, not becoming.

  ### The Lorentz Transformation Analogy
  Your analogy about the language rewiring cognition like a Lorentz transformation rewires coordinates is compelling, but it breaks down under scrutiny in a way that reveals the film's philosophical tension.

  A Lorentz transformation changes how an observer slices spacetime into space and time. It changes the angle of the "simultaneity surface." However, it does not allow an observer to see the entire block at once. Even in relativity, an observer is stuck on their worldline; they just disagree with other observers about what events are happening "now" elsewhere.

  Louise, however, isn't just changing her slice of simultaneity. She is perceiving the whole loaf. Learning Heptapod B doesn't just boost her frame; it lifts her out of the sequence entirely. She experiences her life non-linearly. So, the analogy holds in the sense that both involve a shift in how time is coordinated, but the film goes beyond relativity into something more metaphysical. Relativity says everyone is in the block but perceives it sequentially based on their frame. *Arrival* suggests that sequential perception is a cognitive limitation that can be overcome, whereas relativity suggests sequential perception is a structural necessity of being an observer within spacetime.

  ### The Privileged Observer Problem
  This leads to your best point: does this smuggle in a privileged observer frame? Yes, it does.

  The Rietdijk-Putnam argument explicitly rejects the idea that any one view of spacetime is the "true" one. It says all frames are valid. However, the film treats the human sequential experience as an illusion or a deficit and the Heptapod non-linear experience as seeing the "truth" of reality. By suggesting that Louise achieves a higher state of consciousness by seeing the block, the film implicitly privileges the God's-eye view of the block over the embedded view of the sequence.

  In strict physics, there is no "outside" the block. There is no vantage point where you see the whole thing laid out unless you are outside spacetime entirely. Louise effectively becomes an external observer to her own life. This violates the spirit of relativity, which insists we are all embedded within the geometry we are measuring. The film needs this privilege to work emotionally—it allows Louise to have agency—but it contradicts the physics it invokes. If we are truly in a block universe, Louise doesn't "choose" to have her daughter; she simply occupies the worldline where that happens.

  ### Where the Film Gets It Right vs. Where It Cheats
  The film gets the **ontology** right but cheats on the **phenomenology**.

  It gets the ontology right by committing to determinism. The sadness of the film relies on the fact that the future is fixed. If Louise could change the future, the grief would be manageable. The horror and beauty of the story come from the Rietdijk-Putnam implication: the death is real because the timeline is real. The film respects the idea that knowing the future doesn't change it, which aligns with the block universe where "change" is an illusion of perspective.

  However, it cheats for emotional effect by reintroducing free will through the back door. The climax of the film is Louise deciding to embrace the journey despite knowing the pain. She says, "I choose this." In a strict block universe derived from special relativity, this statement is nonsensical. You don't choose your path through the block any more than a needle chooses the groove on a vinyl record. The path is static. The film wants the deterministic weight of the block universe to make the grief profound, but it wants the libertarian free will to make Louise heroic.

  Your roommate is half-right: the sci-fi is window dressing for grief. But you are right that the specific window dressing used is the Block Universe. The film uses the Rietdijk-Putnam implication—that the future is as real as the past—to transform grief from a temporary state of loss into a permanent structural feature of existence. Louise isn't grieving something that happened; she is grieving something that *is*, eternally.

  ### The Verdict
  Your reading is the stronger philosophical position. The film treats the Heptapod language as a tool to align human cognition with the actual geometry of spacetime (the block), rather than just a metaphor for acceptance. However, to make the story resonate, it violates the strictures of that geometry by allowing Louise to "accept" her fate as if it were a choice.

  If you want to win the argument, press this point: The Rietdijk-Putnam argument destroys the "flow" of time. *Arrival* destroys the flow of time for Louise. If the future is accessible, it exists. If it exists, it is determined. The film is about determinism, not just grief. The grief is simply the emotional cost of living in a determined universe where you know the price of admission. The "cheat" is pretending that knowing the price allows you to pay it voluntarily, when in the block universe, you paid it the moment the universe came into being.
