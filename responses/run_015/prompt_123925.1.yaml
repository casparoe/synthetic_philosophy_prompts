          *   *Smuggling Privilege:* Yes, the film treats her new perception as "seeing the truth" (the block) while others are "stuck in time." This implies the sequential experience is an illusion/error, whereas RP says sequential experience is just a valid frame-dependent slicing. The film treats the block view as *superior* or *more real*, which subtly reintroduces a privileged perspective (the God's-eye view).

