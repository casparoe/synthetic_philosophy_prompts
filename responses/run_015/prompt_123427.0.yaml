answer: |-
  ### 1. The Carrying Example

  **Selection:** The **Conservation-Planning System (Species)**.

  **Why this wins:**
  It isolates the *ontological* problem from the *metaphysical* and *semantic* problems.
  *   **It contains:** A clear value bearer ("endangered species"), a scientific model subject to revision (phylogenetics/genomics), and a concrete mechanism for category failure (ring species, hybridization, horizontal gene transfer). It allows you to demonstrate "splitting" (one species becomes two) without invoking consciousness.
  *   **It lacks:** The baggage of personal identity (consciousness, rights, emulation) and the purely linguistic drift of legal documents.

  **Diagnoses of the Losers:**
  *   **Persons/Emulations:** Your diagnosis is correct. This example invites debates about *consciousness* and *moral status* (Phil) or *substrate independence* (CS). These are orthogonal to the structural problem of utility functions defined over shifting model categories. It turns the seminar into a bioethics or mind-body session.
  *   **Foundation/Endowment:** Your diagnosis is correct. This is primarily a problem of *semantic interpretation* (hermeneutics) rather than *ontological revision*. The world hasn't changed, and the model hasn't necessarily updated; the *language* has drifted. It fails to capture the "learned model supplies categories" constraint, making it look like a standard legal ambiguity problem.

  **Requirements for the Example:**
  *   **Must contain:** A value function explicitly defined over a high-level category (e.g., "Maximize number of distinct species preserved").
  *   **Must contain:** A model update driven by new data that changes the *extension* of that category without changing the *observations* of the individual entities.
  *   **Must lack:** Any appeal to "what the entities feel like" or "what the designers wrote in a document."

  ---

  ### 2. The 50-Minute Plan

  **0:00–0:05 | Introduction & Refusals**
  *   **Goal:** Define the scope. Utility is a function of *model features*, not raw world states.
  *   **Action:** State the two refusals openly here to prevent derailment later.
      1.  **Metaphysics of Natural Kinds:** "We are not asking what a species *really* is. We are asking what the agent does when its *model* of species changes."
      2.  **Bayesian Mechanics:** "We are not calculating the posterior. We are assuming the update has happened and asking about the value function's survival."
  *   **Misconception Head-off:** *Low-level utility.* Briefly note why we don't define utility over atoms (computational intractability, loss of abstraction).

  **0:05–0:15 | The Carrying Example (Setup)**
  *   **Goal:** Ground the abstraction.
  *   **Action:** Describe the Conservation Agent.
      *   **Value:** "Preserve Species S."
      *   **Model 1:** S is a cohesive genetic cluster.
      *   **Scenario:** Agent manages a reserve based on this model.
  *   **Misconception Head-off:** *Ask humans.* Note that the human designers defined "Species" using the agent's *initial* model. They do not have a God's-eye view of the revised ontology.

  **0:15–0:25 | The Revision & The Inaccessible Fact**
  *   **Goal:** Execute point (5) before (4). Show why evidence fails.
  *   **Action:**
      *   **Update:** New genomic data arrives. Model 2 reveals Population S is actually a ring species or a hybrid swarm. The category "S" splits into S1 and S2, or dissolves.
      *   **The Inaccessible Fact (Concrete):** "Did the ancestral split occur before or after the geographic barrier formed 10k years ago?"
      *   **Constraint:** Both timelines predict the *exact same* current genetic diversity (empirical equivalence). The data is lost to drift.
      *   **Consequence:** Model A (One Species) and Model B (Two Species) are equally supported by evidence.
  *   **Misconception Head-off:** *Distributional Shift (CS) & Bayesian Convergence (Phil/CS).* **This is the same mistake in two vocabularies.** Both claim "more/better evidence solves it." Explicitly state: "No amount of further data distinguishes Model A from Model B. This is not a data scarcity problem; it is an ontological underdetermination problem."

  **0:25–0:40 | The Resolution Rule (Discussion Heavy)**
  *   **Goal:** Execute point (4). Conservative vs. Reinterpretive.
  *   **Action:** Pose the dilemma. The agent must act *now*.
      *   **Conservative Rule:** Track the *original extension* (the specific animals originally labeled S), even if the new model says they are two kinds.
      *   **Reinterpretive Rule:** Track the *new category definition* (whatever fits the biological definition of S in Model 2), even if it excludes the original animals.
  *   **Discussion Prompt:** "Which rule preserves the *intent* of the value function? Which preserves the *coherence* of the agent's world-model?"
  *   **Misconception Head-off:** *Freeze Referents.* If a student argues for Conservative, ask: "What happens when the original category is *incoherent* in the new model (e.g., 'S' is now defined as 'empty set')?"

  **0:40–0:45 | Boundaries (Point 6)**
  *   **Goal:** Distinguish from OOD and Skepticism.
  *   **Action:**
      *   **Not OOD Robustness:** The agent isn't failing on new inputs; it's succeeding on learning, which breaks its values.
      *   **Not Global Skepticism:** We aren't saying reference is impossible. We are saying *value-binding* is fragile under ontology change.
  *   **Misconception Head-off:** *Quinean Underdetermination.* "This isn't general skepticism. It's a specific engineering constraint on agents that learn their own ontology."

  **0:45–0:50 | Closing Question**
  *   **Goal:** Test understanding.
  *   **Action:** Pose the question (see below). Allow 2 minutes silent thought, 3 minutes sharing.

  ---

  ### 3. Misconception Management

  **The "Same Mistake" Pair:**
  *   **CS:** "This is just distributional shift; fix with more diverse training data."
  *   **CS/Phil:** "A Bayesian agent with enough evidence converges on the right ontology."
  *   **Why:** Both are **Empiricist Optimism**. They assume the solution lies in the *evidence space*. Your core point is that the solution *cannot* lie in the evidence space because the models are empirically equivalent regarding the value-relevant fact. Head this off at **0:15–0:25 (The Inaccessible Fact)**.

  **Other Misconceptions & Timing:**
  *   **Low-level utility:** Head off at **0:00–0:05**. (Abstraction is necessary for agency).
  *   **Ask humans:** Head off at **0:05–0:15**. (Humans rely on the model too).
  *   **Freeze referents:** Head off at **0:25–0:40**. (Incoherence risk).
  *   **Quinean Skepticism:** Head off at **0:40–0:45**. (This is local, not global).

  **Unanticipated Misconception:**
  *   **"The agent should maximize expected utility over the *union* of models."**
  *   **Why it fails:** You cannot sum utilities defined over incompatible ontologies (e.g., "Count of Species" where N=1 in Model A and N=2 in Model B). The units don't match.
  *   **Where to catch it:** During the **0:25–0:40 (Resolution Rule)** discussion. If a student suggests averaging, ask: "How do you add '1 Species' to '2 Species' when they refer to different groupings of the same animals?"

  ---

  ### 4. The Inaccessible Information (Concrete Constraint)

  Do not speak of "global underdetermination." Use this specific script during the **0:15–0:25** block:

  > "Imagine the agent needs to know if Population A and B are the *same* species to allocate funds.
  >
  > *   **Model 1 says:** Same species (gene flow occurred 10k years ago).
  > *   **Model 2 says:** Different species (no gene flow 10k years ago).
  > *   **The Fact:** Did the specific migration event X happen 10k years ago?
  > *   **The Constraint:** The genetic signal of that specific event has been erased by subsequent drift. Both models predict the *current* DNA sequences with identical probability.
  >
  > The agent cannot run a test. The data is gone. The models are empirically equivalent. The agent must choose a model to calculate its utility, and that choice determines whether it values A and B together or separately."

  ---

  ### 5. Refusals to Explain

  **State these openly at the start (0:00–0:05):**
  1.  **Metaphysics of Natural Kinds:** "We are bracketing the question of whether species *really* exist. We care only that the *agent's model* posits them."
  2.  **Mechanics of Bayesian Model Averaging:** "We are not doing the math of how the model updated. We take the update as given and analyze the value function's reaction."

  **Do Not Refuse:**
  *   **Existing Systems:** Acknowledge this is currently theoretical/edge-case. Don't pretend current RL systems do this yet.
  *   **Safety Literature:** Point them to it (e.g., "ontology identification problem"). Refusing this looks like hiding the literature.

  ---

  ### 6. The Closing Question

  **Your Candidate:** "What would conservative vs. reinterpretive rule do?"
  **Critique:** Too close to definition recall. A student can answer this by repeating the labels without understanding the *cost*.

  **Better Question:**
  > "If the agent adopts the **Conservative Rule** (tracking original referents), what specific **predictive capacity** does it sacrifice in the new world-model, and why might that sacrifice be **instrumentally rational**?"

  **Criteria for a Successful Answer:**
  To count the session as working, a student's answer must contain:
  1.  **The Cost:** Acknowledgement that the Conservative Agent is now using a category ("Original S") that is *biologically incoherent* or *causally heterogeneous* in the new model (e.g., it groups two distinct evolutionary lineages).
  2.  **The Rationality:** A reason why preserving the *value link* (satisfying the designer's original intent) outweighs the loss of *predictive accuracy* (e.g., "Because the utility function is a contract with the designer, not a hypothesis about biology").

  If they answer only "It keeps the old values," they have not understood the trade-off. If they answer "It loses accuracy on future gene flow," they have understood the cost. If they can link the two, they have understood the agency problem.
