answer: |-
  # THE STANDING COMMITTEE ON PROTECTED TAXA
  ## DECISION PROCEDURE FOR TAXON LISTING (VERSION 3.1)

  **Purpose:** To determine whether a taxon possesses the capacity for valenced conscious experience sufficient to trigger statutory duties.
  **Constraint:** This procedure treats sentience as a binary legal status derived from continuous biological properties. It prioritizes repeatability and defensibility over theoretical completeness.

  ---

  ### PART I: THE DECISION SEQUENCE

  The Methodologist will guide the Committee through the following four questions in order. The sequence terminates at the first definitive answer.

  **Q1: Is there a plausible physiological mechanism for integration?**
  *   **Sufficient Answer:** Yes, if the taxon possesses a nervous system architecture capable of integrating sensory input with internal state.
  *   **Evidence:** Neuroanatomy, neurophysiology, or pharmacology.
  *   **Clade Rule:** Proxies validated in one Phylum (e.g., vertebrate neuron counts) **cannot** be applied to another Phylum (e.g., arthropods, molluscs) without independent validation. Absence of a central brain is not a negative answer if distributed integration is demonstrated.
  *   **Burden:** Petitioner.
  *   **Outcomes:**
      *   **NO:** Terminate. **Recommendation: Do Not List.** (Record: Mechanism absent).
      *   **YES:** Proceed to Q2.
      *   **UNCERTAIN (due to absent data):** Proceed to Q2, but mark "Mechanism Confidence" as Low.

  **Q2: Is there functional evidence of valenced experience?**
  *   **Sufficient Answer:** Yes, if the taxon demonstrates behavior that cannot be explained by reflex or fixed action patterns and indicates a trade-off between motivation and avoidance.
  *   **Evidence:**
      1.  *Nociceptive Sensitisation:* Protection of injured area beyond reflex withdrawal.
      2.  *Motivational Trade-offs:* Enduring a cost (e.g., loss of food) to avoid a stimulus, or enduring a stimulus to gain a resource.
      3.  *Pharmacological Modulation:* Behavioral changes reversed by analgesics or anxiolytics.
      4.  *Cognitive Bias:* Evidence of affective state influencing decision making (supportive only, not determinative).
  *   **Burden:** Petitioner. Absence of evidence is treated as evidence of absence **only if** appropriate behavioral assays have been attempted and failed. If no assays exist, confidence is reduced, not zeroed.
  *   **Outcomes:**
      *   **YES (Strong):** (2+ categories of evidence). Proceed to Q3 with "High Confidence."
      *   **YES (Weak):** (1 category of evidence). Proceed to Q3 with "Medium Confidence."
      *   **NO:** Terminate. **Recommendation: Do Not List.** (Record: Mechanism present, but function unproven).
      *   **UNCERTAIN:** Proceed to Q3 with "Low Confidence."

  **Q3: Does the precautionary threshold for listing be met?**
  *   **Rule:** Listing requires a minimum confidence level that the capacity exists. This is a value judgment codified for consistency.
  *   **Thresholds:**
      *   *High Confidence:* List.
      *   *Medium Confidence:* List.
      *   *Low Confidence:* **Refer to Committee.** (This is a value judgment on risk tolerance).
  *   **Handling Conflicting Proxies:** If Q1 is High but Q2 is Low (e.g., big brain, no behavior), Q2 dominates. Functional evidence overrides anatomical potential.
  *   **Handling "Nonzero Probability" (Animal Protection Submission):** A nonzero probability alone triggers Q3, but does not mandate listing. It mandates a risk assessment.
  *   **Outcomes:**
      *   **LIST:** Proceed to Q4.
      *   **REFER:** Terminate. **Recommendation: Refer to Committee for Value Determination.** (Record: Evidence insufficient for automatic listing, risk level requires policy decision).
      *   **DO NOT LIST:** Terminate.

  **Q4: What is the scope of the listing?**
  *   **Unit of Account:** The **Individual Animal**. Listing attaches to the capacity of the individual, not the population size.
  *   **Population Scale:** Population numbers do not determine *whether* to list, but determine *which practices* are prioritized for regulation.
  *   **Temporal Density (Consultant Submission):** Subjective time density does not determine listing, but determines the **stringency** of handling/stunning standards post-listing.
  *   **Partial Listing:** The Committee may list a taxon for specific procedures (e.g., "Listed for Research and Transport, Exempt for Commercial Harvest") if evidence of valence is context-specific.
  *   **Outcomes:**
      *   **Full List:** All statutory duties apply.
      *   **Partial List:** Specified duties apply.
      *   **Record:** Must explicitly state why partial listing is chosen to ensure consistency in future cycles.

  ---

  ### PART II: HANDLING CONFLICTING SUBMISSIONS

  This procedure explicitly adjudicates the three standing submissions as follows:

  1.  **Industry Submission (Neuron Count Threshold):**
      *   **Ruling:** Rejected as a sole determinant.
      *   **Integration:** Neuron count is admissible only at Q1 (Mechanism). It is clade-local. A vertebrate threshold has no validity for non-vertebrates. It cannot override a negative finding at Q2 (Function).

  2.  **Animal Protection Submission (Nonzero Probability + Aggregation):**
      *   **Ruling:** Partially Accepted, Partially Rejected.
      *   **Integration:** "Nonzero Probability" is handled at Q3 (Precautionary Threshold). However, "Aggregation" (population scale) is rejected as a criterion for *moral status*. Population scale enters only at Q4 (Scope/Prioritization). Refusing to aggregate is a statutory feature, not a moral oversight.

  3.  **Consultant Submission (Subjective Time Density):**
      *   **Ruling:** Accepted as a Regulatory Modifier, not a Listing Criterion.
      *   **Integration:** Time density is excluded from Q1–Q3. It is mandatory consideration at Q4 when setting specific standards (e.g., stunning duration) for listed taxa.

  ---

  ### PART III: ONE-PAGE MEMBER GUIDE

  **STANDING COMMITTEE ON PROTECTED TAXA: MEETING FLOW**

  **Goal:** Decide if the animal can suffer (List) or not (Do Not List).
  **Time:** 2 Days. **Rule:** Stick to the questions. Do not debate philosophy.

  **STEP 1: THE HARDWARE (Q1)**
  *   Does it have the nerves to feel?
  *   **Rule:** Don't compare brains across Phyla. A bug brain isn't a fish brain.
  *   **If No:** Stop. **Do Not List.**
  *   **If Yes/Unclear:** Go to Step 2.

  **STEP 2: THE SOFTWARE (Q2)**
  *   Does it act like it feels?
  *   **Look for:** Trade-offs (giving up food to avoid pain), protection of injury, painkillers working.
  *   **Rule:** Behavior beats Anatomy. A big brain with no behavior = No List.
  *   **If Strong Evidence:** High Confidence.
  *   **If Weak Evidence:** Medium Confidence.
  *   **If No Evidence:** Stop. **Do Not List.** (Unless data is missing, then Low Confidence).

  **STEP 3: THE RISK (Q3)**
  *   Are we sure enough?
  *   **High/Medium Confidence:** **List.**
  *   **Low Confidence:** **Refer to Committee.** (This means: "We don't know, you must vote on risk.")
  *   **Note:** We do not list on "maybe" alone. We list on "likely."

  **STEP 4: THE RULES (Q4)**
  *   **Who counts?** The individual, not the herd.
  *   **Partial Listing?** Yes. We can list them for research but not farming if evidence differs.
  *   **Speed?** Fast animals need faster stunning. Decide this after listing.

  **RECORD KEEPING:**
  *   If you deviate from this flow, you must write down why in the Minutes to prevent arbitrary decisions next cycle.

  ---

  ### PART IV: APPLICATION TO CURRENT PETITIONS

  The following records demonstrate the procedure in operation.

  #### PETITION A: REEF-DWELLING CEPHALOPODS (Group A)
  *   **Q1 (Mechanism):** **YES.** High absolute brain mass, single integrating structure. *Confidence: High.* (Note: Vertebrate neuron counts not applied per Clade Rule).
  *   **Q2 (Function):** **NO.** Dossier contains nociceptive sensitisation (1 category) but **nothing** on motivational trade-offs. No analgesic reversal data.
      *   *Analysis:* Anatomical potential is high, but functional proof of *valence* (rather than reflex) is absent. Per Procedure Q2, functional evidence overrides anatomical potential.
      *   *Confidence:* Low (due to absence of trade-off data).
  *   **Q3 (Risk):** **REFER TO COMMITTEE.**
      *   *Reasoning:* Confidence is Low. The procedure does not allow automatic listing on anatomy alone. The Committee must decide if anatomical potential without behavioral proof meets the statutory risk threshold.
  *   **Q4 (Scope):** N/A pending Q3.
  *   **Record Entry:** "Petition denied automatic listing. Mechanism established, but functional evidence of valenced experience insufficient to meet Q2 threshold. Matter referred to Committee for value judgment on anatomical presumption."
  *   **Outcome:** **Refer.** (This is the unpalatable outcome: Charismatic taxa fail due to lack of behavioral trade-off data).

  #### PETITION B: SOCIAL INSECTS (Group B)
  *   **Q1 (Mechanism):** **UNCERTAIN.** No single integrating structure. Clade Rule prevents vertebrate comparison. Distributed integration plausible but unproven. *Confidence: Low.*
  *   **Q2 (Function):** **YES (Strong).** Flexible injury response, persistent avoidance surviving resource loss (Trade-off), reversal by analgesics.
      *   *Analysis:* Three categories of functional evidence. Per Procedure Q2, Function overrides Mechanism uncertainty.
      *   *Confidence:* High (based on behavioral robustness).
  *   **Q3 (Risk):** **LIST.**
      *   *Reasoning:* High Confidence in function meets precautionary threshold.
  *   **Q4 (Scope):** **FULL LIST.**
      *   *Unit:* Individual.
      *   *Population:* High population (10^11) noted for enforcement prioritization, not listing status.
      *   *Time Density:* Standards must account for high temporal resolution (fast processing).
  *   **Record Entry:** "Petition granted. Functional evidence of valenced experience robust despite architectural differences. Listing applies to all individuals."
  *   **Outcome:** **List.** (This conflicts with Industry view on neuron counts).

  #### PETITION C: FILTER-FEEDERS (Group C)
  *   **Q1 (Mechanism):** **NO.** Nerve net, no centralisation. *Confidence: High (Negative).*
  *   **Q2 (Function):** **UNCERTAIN.** Habituation and withdrawal present, but modulated by state. No evidence this exceeds reflex arc. No trade-off data.
  *   **Q3 (Risk):** **DO NOT LIST.**
      *   *Reasoning:* Q1 terminated sequence. Mechanism absent.
  *   **Record Entry:** "Petition denied. Physiological mechanism for integration absent. Behavioral data consistent with reflex."
  *   **Outcome:** **Do Not List.** (This conflicts with Animal Protection view on aggregation/probability).

  ---

  ### PART V: LIMITATIONS AND PLAIN TALK

  This procedure is a tool for legal consistency, not a map of moral truth. You must understand what it cannot do before you adopt it.

  1.  **Moral Status vs. Suffering:** This procedure assesses the capacity to suffer (valenced experience). It **cannot** determine if an animal has "rights" in a deontological sense. It protects animals from *being made to suffer*, not from *being used*. If the statute implies rights beyond suffering, this procedure is insufficient.
  2.  **Cross-Architecture Comparison:** We explicitly forbid comparing the *intensity* of suffering between taxa (e.g., "Is an insect's pain equal to a cephalopod's?"). The procedure treats the *capacity* as binary. We do not know if a nerve net feels "less" than a cortex; we only know if it feels *at all*. Any regulation assuming comparable intensity is scientifically unsupported by this framework.
  3.  **Kind vs. Degree:** We assume valenced states are comparable enough to regulate. If an insect's "suffering" is phenomenologically different in *kind* from a vertebrate's (not just degree), this procedure treats them as the same. This is a legal fiction required for a single statute.
  4.  **Boundary Errors:** This procedure will misfire near the threshold.
      *   **False Negatives:** Taxa with sentience but cryptic behavior (like Group A potentially) will be referred or rejected.
      *   **False Positives:** Taxa with complex behavior but no sentience (philosophical zombies) will be listed.
      *   **Mitigation:** The "Partial Listing" option (Q4) allows us to regulate high-risk practices for borderline cases without committing to full moral status.
  5.  **The "Unpalatable" Result:** You will note Petition A (Cephalopods) is not automatically listed. This is not a claim they cannot feel. It is a claim that **under this statute, brain size is not proof.** If you wish to list them, you must do so via the "Refer" pathway at Q3, explicitly accepting the risk of anatomical presumption. This creates a public record that you are prioritizing precaution over evidence, which is a valid policy choice but must be owned as such.

  **Methodologist's Note:** If you bypass Q2 to list Group A based on Q1 alone, you violate the Clade Rule and the Function-Over-Form constraint. This will render the decision vulnerable to judicial review as arbitrary compared to Group B. To maintain consistency, you must either list B and A (on function/precaution) or refer A. You cannot List A and Reject B.
