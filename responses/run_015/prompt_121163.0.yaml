answer: |-
  **Frequently Asked Questions: PhD in Multi-Species Historiography**

  **How is the Agency Allocation Protocol (AAP) applied to dissertation authorship?**
  All doctoral candidates must submit a finalized AAP ledger alongside their manuscript. This protocol mandates a percentage-based split of authorship credit between human and non-human actors. The formula weighs counterfactual dependency against material persistance. For example, if a dissertation argues that a specific flood altered a migration pattern more significantly than local policy, the water body may be assigned up to 60% of the primary authorship credit. Candidates must calculate the exact coefficient of influence using the departmental spreadsheet. Failure to accurately quantify the volition of geological strata will result in a delay of defense scheduling. The committee does not accept qualitative estimates for seismic activity.

  **Can a pathogen serve as a co-advisor?**
  Yes, provided the microorganism meets the tenure track requirements outlined in Section 4.B of the Faculty Handbook. *Yersinia pestis* is currently eligible for co-advisory roles given its documented impact on late-medieval socio-economic structures. However, the candidate is responsible for establishing a communication channel. While direct translation is not required, a proxy must be appointed to interpret the pathogen's reproductive interests as academic guidance. Please note that biological hazards must be contained within approved laboratory settings during advisory meetings. The Graduate School is not liable for outcomes resulting from uncontained fieldwork during consultation hours.

  **Why was the 1815 Tambora eruption granted an honorary doctorate?**
  The eruption satisfied the output requirements for the preceding fiscal year. Its atmospheric intervention constituted a defended thesis on global climate modulation. Under the current rubric, the distribution of particulate matter demonstrated a higher degree of historical coherence than most human-led policy initiatives of the nineteenth century. The honorary degree recognizes the entity's ability to effectuate change without reliance on human intermediaries. Commencement speakers are advised to address the crater directly during the ceremony. Attendance by geological representatives is optional but encouraged for networking purposes.

  **Does this framework negate human decision-making?**
  The program does not negate volition but contextualizes it within a broader ontological parity. Humans are viewed as co-authors rather than sole proprietors of history. The AAP formula adjusts for human intent by applying a volatility discount. If a human actor claims full responsibility for an event subsequently determined to be driven by tectonic shifts, the credit is reallocated automatically. This ensures that historical narratives do not disproportionately privilege species with linguistic capabilities. The goal is equitable representation of all forces capable of altering the material record. Candidates arguing for human exceptionalism will be required to submit a supplementary risk assessment.

  **How are non-human interests represented during ethics reviews?**
  Interests are defined by material continuity. A glacier's interest is presumed to be mass retention. A river's interest is defined by flow velocity and sediment transport. The Ethics Committee appoints a human proxy to advocate for these interests during dissertation proposals. If a proposed study accelerates erosion, it may be denied on the grounds of violating the river's academic freedom. Candidates must demonstrate that their research does not impede the non-human actor's ability to pursue its own historical trajectory. Conflicts of interest must be disclosed if the human researcher benefits from the depletion of the non-human co-author.

  **Commentary on the liberties taken**

  I am reasonably confident in this satire's reading of the agency-versus-causation debate. The core joke relies on pushing the bureaucratic impulse to quantify everything until it absorbs the metaphysical absurdity of granting legalistic agency to mindless forces. By treating "influence" as a divisible asset managed by a committee, the text highlights the difficulty of distinguishing between a cause and an actor without collapsing into nonsense. The AAP formula mocks the desire for mathematical precision in philosophical categorization.

  The point I am least sure about is whether attributing "material persistence" to volcanoes is a fair caricature or if it drifts into straw-man territory. Real scholars in this field often argue for vibrancy or actancy without necessarily claiming a volcano has a CV. However, when institutionalized, these concepts often require operational definitions that look suspiciously like the bureaucratic metrics invented here. If the satire misses, it is because actual theory is sometimes more cautious than the administration implementing it. Still, the logical endpoint of flattening ontology suggests that if a virus can co-author a history, it should logically be able to tenure-track.
