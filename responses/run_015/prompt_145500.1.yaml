answer: |-
  ### Session Plan: Structural Incommensurability in Consequentialist Cluelessness

  **Target Audience:** Second-year undergraduate philosophy reading group.
  **Duration:** 90 minutes.
  **Objective:** To distinguish *epistemic* cluelessness (we cannot know the future) from *structural* cluelessness (the values at stake cannot be summed), keeping the critique internal to consequentialism.

  ---

  #### 1. The Sequence of Explanation

  You must adhere to this specific order. Deviating risks collapsing the structural argument back into a standard epistemic one.

  **Step 1: The Consequentialist Axiom (10 mins)**
  *   **Content:** Re-establish the requirement of a 'common currency' of value. For a consequentialist to choose Action A over Action B, there must be a single metric (welfare, utility, preference satisfaction) into which all outcomes are translated to allow summation.
  *   **Dependency:** This sets the rule that the rest of the session will break. Without this, the problem looks like a deontological constraint rather than a consequentialist calculation failure.

  **Step 2: The Carrying Example – Direct Outcomes (15 mins)**
  *   **Case:** **Preventative Detention of Terror Suspects.**
  *   **Direct Metric:** The government detains 50 suspects without trial. Intelligence suggests this prevents 3 attacks, saving approximately 120 lives over the next year.
  *   **Task:** Ask students to calculate the 'good' here. They will easily agree: 120 lives is a positive utility quantity. It is measurable, comparable, and fits the Axiom.

  **Step 3: The Carrying Example – Institutional Transformation (15 mins)**
  *   **Content:** Introduce the indirect effect. By detaining without trial, the state shifts the legal norm from *punitive justice* (punishing proven guilt) to *preventive risk management* (managing statistical danger).
  *   **Key Distinction:** This is not merely 'future lives lost' due to slippery slopes. It is a change in the *kind* of political relationship between citizen and state. It alters the 'rules of the game' rather than the 'score'.
  *   **Dependency:** This must be presented *after* the direct metric to highlight the contrast in evaluative kinds.

  **Step 4: The Incommensurability Claim (20 mins)**
  *   **Content:** Argue that there is no exchange rate between '120 lives saved' and 'one unit of legal norm erosion'.
  *   **Crucial Point:** Emphasise that this is not because the number is small or large, but because the *category* is wrong. You cannot add 'metres' to 'kilograms'. Similarly, you cannot add 'welfare instances' to 'constitutional integrity' without a category error.
  *   **Result:** The consequentialist calculus halts not because of missing data, but because the equation is syntactically invalid.

  **Step 5: Intercepting Misconception A – "This is just Risk Aversion" (15 mins)**
  *   **Timing:** Immediately after Step 4.
  *   **The Student Error:** Students will argue that we are simply weighting the long-term risk of authoritarianism heavily. They will treat institutional erosion as a 'negative utility' with a high probability weight.
  *   **The Correction:** Explain that risk aversion operates *within* a utility function (e.g., preferring a sure £50 to a 50% chance of £100). Incommensurability claims there *is no function* that captures both variables. If you assign a 'utility cost' to the erosion of norms, you have already falsely translated the institutional value into welfare terms.
  *   **Pedagogical Note:** Do not move on until they accept that assigning a 'cost' to the norm is the very mistake you are highlighting.

  **Step 6: Intercepting Misconception B – "Better Forecasting Solves It" (10 mins)**
  *   **Timing:** After the Risk Aversion intercept.
  *   **The Student Error:** "If we had perfect AI prediction, we would know exactly how much democracy erosion leads to future suffering, so we could compare them."
  *   **The Correction:** Even with perfect foresight (knowing exactly when the democracy collapses), the *evaluation* remains split. Knowing that 120 lives are saved now and a dictatorship arises in 50 years does not tell you how to sum them. The problem is axiological (about value), not epistemic (about knowledge).
  *   **Dependency:** This relies on Step 1. If they have forgotten the 'Common Currency' axiom, they will think perfect forecasting provides the currency. Remind them: forecasting gives numbers, not a conversion rate.

  **Step 7: The Closing Question (5 mins)**
  *   **Question:** "If an omniscient being told you the exact number of future welfare-units lost due to the institutional change, would the calculation become possible, or does the act of translating 'institutional integrity' into 'welfare-units' destroy the very value you were trying to protect?"
  *   **Success Criterion:** A grasp of incommensurability is shown if they answer that the translation itself is the loss. A failure (confusing it with uncertainty) is shown if they answer that the calculation becomes possible once the numbers are known.

  ---

  #### 2. What to Refuse to Cover

  **Exclude: The Deontological Alternative.**
  You must openly refuse to entertain the suggestion that "Rights" or "Duties" solve this.
  *   **Reasoning:** If a student suggests, "This is why we need deontology; rights trump utility," you must bracket this.
  *   **Justification:** This session is about a failure *internal* to consequentialism. Allowing deontological escapes allows students to bypass the structural problem by changing the ethical framework. The point is to show that consequentialism lacks the resources to process this specific choice, not to solve the choice itself.

  **Exclude: Standard Longtermism (Greaves/Ord).**
  *   **Reasoning:** Do not discuss the 'expected value' of the far future in terms of population size or existential risk. That debate assumes commensurability (everything is reducible to welfare over time). This session argues that some things are *not* reducible to welfare over time.

  ---

  #### 3. Pedagogical Reasoning and Cognitive Dependencies

  **Why this order?**
  Second-year students possess a strong cognitive bias towards **epistemic reductionism**. When faced with a normative impasse, they instinctively treat it as a lack of information.
  *   If you introduce the Example (Step 2) before the Axiom (Step 1), they will treat the dilemma as a practical policy debate rather than a meta-ethical structural problem.
  *   If you address the Misconceptions (Steps 5 & 6) before establishing the Incommensurability Claim (Step 4), you will be fighting ghosts. They must first see the 'category error' before they can understand why 'risk' or 'data' does not fix it.
  *   The sequence forces them to build a consequentialist house (Step 1), try to furnish it with the Example (Steps 2 & 3), realise the furniture doesn't fit (Step 4), and then prevents them from blaming the blueprint or the measurements (Steps 5 & 6).

  **Where my reasoning is weakest:**
  The weakest link in this plan is **Step 3 (Institutional Transformation)**.
  *   **Vulnerability:** A sophisticated act-consequentialist student will argue that 'institutional integrity' is *instrumentally* valuable only insofar as it produces welfare. They will insist that 'constitutional integrity' is just a shorthand for 'a system that maximises welfare long-term'.
  *   **Cognitive Risk:** Second-years may lack the political philosophy background to grasp 'institutional kind' as distinct from 'institutional output'. They may cognitively collapse the distinction, insisting that if we value the institution, it must be because of the welfare it produces.
  *   **Mitigation:** I have to lean heavily on the intuition that some values (like 'justice' or 'legitimacy') are constitutive of the good, not merely productive of it. If this intuition fails to land, the whole argument for incommensurability collapses back into a dispute about long-term forecasting (which I am trying to avoid). I am assuming a level of value-pluralism intuition that may not be present in a group trained primarily on utilitarian calculus.

  **Why the Example (Preventative Detention)?**
  I chose this over 'Economic Stimulus via Decree' because the welfare metric (lives saved) is more visceral and harder to dismiss than GDP. GDP can easily be argued as a proxy for welfare; lives saved *are* the standard currency of welfare. This makes the inability to trade them against legal norms more stark. However, the risk is that students view 'liberty' as a preference satisfaction, which brings them back to commensurability. I am banking on the 'rule of law' being understood as a structural precondition, not a preference.
