      *   *Desideratum 3: Normativity.* Rationality usually implies *oughts*. If both are equal, what does the agent *ought* to do?
      *   *Desideratum 4: Psychological Plausibility.* Humans actually experience this. The theory shouldn't demand cognitive superpowers.
      *   *Desideratum 5: Causal Closure.* Choices cause actions. If there's no reason, what causes the action?

  4.  **Analyzing the Conflicts (The "Hard Part"):**

      *   *Determinism vs. Arbitrariness:* If the choice is determined by prior states + laws, and prior states don't favor A over B, how does A get picked?
