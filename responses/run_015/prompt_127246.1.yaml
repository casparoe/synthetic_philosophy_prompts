  Your gut verdicts are driven by a single epistemic principle: **Mechanism Fidelity.** You reward models that correctly identify the causal structure of the world, even if the specific outcome is averted or measurement noise obscures it, and you penalize models that match outcomes via luck, self-fulfillment, or moving goalposts.

  ### The Principle
  **A theory earns credit only when the actual outcome (or its prevention) is produced by the specific causal mechanism the model describes, rather than by the prediction's own influence, external coincidence, or post-hoc parameter adjustments lacking mechanistic justification.**

  ### Clause Mapping
  *   **"Outcome (or its prevention)"**: Motivated by **Case B** (Guano). The starvation didn't happen, but the *prevention* (Haber-Bosch) directly addressed the *specific mechanism* (Nitrogen limit) identified. This distinguishes it from **Case C**, where the prevention was generic and the date moved without mechanistic updates.
  *   **"Specific causal mechanism"**: Motivated by **Case F** (Right by Accident). The mortality spike happened, but the mechanism (war/sanctions) differed from the model (food overshoot). Matching the number isn't enough; the causal path must match.
  *   **"Prediction's own influence"**: Motivated by **Case E** (Self-fulfilling). The model didn't predict the fragility correctly so much as it created the fragility by announcing it. The causal chain runs Prediction -> Outcome, not Model -> Outcome.
  *   **"External coincidence"**: Motivated by **Case F** again. The outcome was external to the model's logic.
  *   **"Post-hoc parameter adjustments"**: Motivated by **Case C** (1970s Famines). Regenerating the date without a successful specific call indicates the mechanism isn't constraining the parameters.
  *   **Implicit "Measurement Error Exclusion"**: Motivated by **Case D** (Glaciologist). If the mechanism is sound but data is noisy, credit remains. This distinguishes it from **Case A** (Horse Manure), where the mechanism (fixed input) was fundamentally wrong (substitution possible).

  ### Accommodation and Overturn
  This principle accommodates all your gut verdicts, including the "half credit" for **Case H** (trajectory matched mechanism, crunch didn't) and the neutrality on **Case G** (tautologies lack specific mechanisms until rates are named).

  However, if I must overturn one verdict, I would overturn **Case E**. Your principle (and your gut) withholds credit because the prediction caused the crash. But a model that correctly identifies a *fragile state*—such that mentioning it triggers collapse—has successfully mapped the underlying causal reality (fragility) better than a model predicting stability. The mechanism (fragility) was real, even if the trigger (announcement) was endogenous. Withholding all credit ignores the epistemic value of identifying the vulnerability.

  ### Verdicts on New Cases
  1.  **400-year doom:** **Withhold credit.** Unfalsifiable in practice; no mechanism check possible within a human timeframe. It functions as a tautology (Case G).
  2.  **Mechanism right, magnitude 10x wrong:** **Partial credit.** The causal structure is validated (mechanism fidelity), but the calibration is failed. Better than Case F, worse than Case D.
  3.  **Date moved three times with mechanism arguments:** **Conditional.** If the new dates rely on *new mechanistic data* (e.g., revised reservoir estimates), credit remains (like Case D). If they rely on fitting the curve (like Case C), disconfirm.
  4.  **Mirror of E (Abundance):** **Withhold credit.** Same as Case E. The prediction caused the investment that caused the abundance. The model didn't predict the abundance via fundamentals, but via performative effect.

  Overturned: E
  \answer{Credit requires the outcome or its prevention to arise from the model's specific causal mechanism, excluding matches caused by the prediction itself, external coincidence, or post-hoc parameter adjustments without mechanistic justification.}
