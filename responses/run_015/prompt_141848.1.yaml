      Confronted with the absence of a physical mechanism, Kepler would not retreat. His astronomy replaced spiritual movers with magnetic forces, but his astrology rested on a different ontology. He posited a Earth-soul that perceives geometric harmony. Modern physics looks for energy transfer; he looked for formal resonance. He would argue that the lack of a mechanical carrier does not falsify the harmony, provided the geometry holds. However, he cannot simply claim immunity from physics. If physics says 72 degrees is identical to 73, Kepler must explain why the Earth's soul distinguishes them. He anchors this in musical consonance, not force. He avoids unfalsifiability by insisting the effect must be observable in weather or human inclination, not just asserted.

