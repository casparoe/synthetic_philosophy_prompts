  **The True Unsettler:**
  We need a case where **Direct Altruism says No, but FDT Reciprocity says Yes.**
  *   **Setup:** Send $x \in [0, 10]$. Multiplier is **0.8** (Lossy transfer).
  *   **Correlation:** 95%.
  *   **Preferences:** R. is Altruistic (1:1).
