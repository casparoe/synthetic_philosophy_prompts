  *   **Why:** FDT accounts for the fact that by committing to send, she is logically forcing the other agent (in 50% of worlds) to also send, incurring a net loss for the pair. CDT ignores the other's reaction.

  **Prediction for this Unsettler:** If R. is truly FDT, she sends **0**. If she is Altruistic CDT, she sends **10**. This isolates the decision theory from the preference.

  ### 5. Closing Thought on Continuous vs. Binary

  You noted R.'s past verdicts were binary. FDT handles continuous variables naturally (maximize the utility function over the domain), whereas some heuristic implementations of "cooperation" might rely on thresholds.
  *   **Observation:** In the *Noisy Twin PD*, she cooperated despite the 10% noise. This suggests she does not require perfect correlation, only that the *expected utility of the algorithm* is positive.
  *   **Implication:** In your continuous case, she will not look for a threshold (e.g., "send 5"). She will check the derivative of her expected utility. Since the social gain is positive in your original 3x case, the derivative is positive everywhere. She goes to the boundary (10).

  **Summary for the Session:**
  R. is an **Altruistic FDT** agent. In your proposed cases, her **altruism** drives the verdict (Send 10), rendering the **FDT correlation** secondary. To challenge her, you must construct a case where helping the other directly causes a net loss, but the *logical correlation* of the decision creates a net gain (or vice versa). The "1.2x Multiplier with 50% Correlation" case described above is your best bet to force a divergence between her decision theory and her benevolence.
