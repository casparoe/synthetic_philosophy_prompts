  ### Deliverable 3: Marking Scheme

  **Total Marks: 20**

  **1. Formal Statement and Proof Sketch (4 Marks)**
  *   **A (4):** Correctly writes the EU inequality ($\sum P(s) \max_a EU(a|s) \ge \max_a EU(a)$) and identifies the critical step $\max_a EU(a|s) \ge EU(a^*|s)$.
  *   **B (2-3):** States the theorem verbally or writes the inequality but misses the specific comparison to the prior optimal act $a^*$.
  *   **Common Error:** Reciting "Value of Information is non-negative" without formalizing the expectation operator.

  **2. Identification of Load-Bearing Assumptions (4 Marks)**
  *   **A (4):** Explicitly lists Act Stability, Unconstrained Optimization, and Payoff Independence. Connects these to the "ignore the signal" reply.
  *   **B (2-3):** Identifies only one assumption (usually optimization) or conflates them with "cost."
  *   **Common Error:** Claiming the theorem assumes information is always accurate (irrelevant to the theorem).

  **3. Taxonomy of Failure Cases (4 Marks)**
  *   **A (4):** Clearly distinguishes exogenous costs (not counterexamples) from endogenous structural changes (genuine counterexamples). Categorizes Leak/Erode/Rule correctly.
  *   **B (2-3):** Treats the scenario as merely "costly information" or fails to distinguish ex ante vs. ex post regret.
  *   **Common Error:** Arguing that emotional distress counts as a formal counterexample without modeling it as a utility change.

  **4. Diagnosis of Staged Scenario (4 Marks)**
  *   **A (4):** Correctly calculates the EU values showing negative EV. Maps "Leaky" to Payoff Independence violation, "Act-Eroding" to Act Stability, "Fixed-Rule" to Optimization Freedom.
  *   **B (2-3):** Calculates EU correctly but fails to map the specific definitions to the proof premises. Or maps them incorrectly.
  *   **Common Error:** Ignoring the "Leak" penalty in the calculation or assuming the agent can override the Fixed-Rule.

  **5. Normative Verdict (Vacuousness) (4 Marks)**
  *   **A (4):** Defends a nuanced view: Theorem is tautological for ideal agents but diagnostic for non-ideal ones. Rejects universal "gather evidence" slogan while preserving theorem's utility as a boundary marker.
  *   **B (2-3):** Takes a binary stance (either "It's useless" or "It's always true"). Fails to connect the formalism to the prescriptive slogan.
  *   **Common Error:** Dismissing the theorem entirely because counterexamples exist, or insisting it must hold universally despite the evidence.
