answer: |-
  ### Private Brainstorming

  (i) **Load-Bearing Premises of Good's Theorem:** The core proof relies on the inequality $EU(\text{look}) = \sum_s P(s) \max_a EU(a|s) \ge \max_a \sum_s P(s) EU(a|s) = EU(\text{don't look})$. The critical step is $\max_a EU(a|s) \ge EU(a^*|s)$, where $a^*$ is the optimal act without information. This requires: (1) **Act Stability:** $a^*$ remains available after seeing $s$ (violated by *act-eroding* sources). (2) **Unconstrained Optimization:** The agent is free to choose the $\max$ for each $s$ (violated by *fixed-rule updaters*). (3) **Payoff Independence:** The payoff function $EU(a|s)$ does not change merely because the signal was observed (violated by *leaky* sources where observation alters the state or other agents' strategies). If any of these fail, the inequality collapses.

  (ii) **Taxonomy of "Information is Bad" Stories:**
  *   *Costly Information:* Not a counterexample. Good's theorem assumes costlessness.
  *   *Ex Post Regret:* "I looked and felt bad." Not a counterexample; EV is ex ante.
  *   *Bounded Rationality:* If the agent cannot compute the posterior update correctly, EV might drop. This is a failure of rationality, not the theorem.
  *   *Genuine Counterexamples:* These involve structural changes to the decision problem itself. *Leakiness* changes the game (decision-theoretic linkage between observation and state). *Act-eroding* shrinks the feasible set $A$. *Fixed-rules* prevent re-optimization. These are not "costs"; they are violations of the theorem's domain conditions.

  (iii) **Fluency without Understanding:** Students will likely recite "Value of Information is non-negative" without defining the expectation operator. They will conflate "costly" with "harmful." They will claim "you can always ignore it" without recognizing that "ignoring" requires the prior act to remain feasible and optimal. They will treat the theorem as empirical advice ("gather evidence") rather than a formal bound on rational agency under specific constraints. The top students will recognize the theorem as a tautology of optimization that loses grip when the optimization structure is compromised.

  ***

  ### Deliverable 1: Exam Question

  **UNIVERSITY OF OXFORD**
  **FINAL HONOURS SCHOOL IN PHILOSOPHY, POLITICS, AND ECONOMICS**
  **PAPER 12: ADVANCED DECISION THEORY AND FORMAL EPISTEMOLOGY**

  **Time Allowed: 90 Minutes**
  **Indicative Length: 1,200 Words**

  **INSTRUCTIONS TO CANDIDATES**
  Answer the following question in full. You are expected to demonstrate formal precision while engaging with the philosophical implications of the formalism. Mere assertion of slogans (e.g., "information is power") without derivation will be penalized.

  **QUESTION 1**

  Good's Theorem (1967) is often summarized by the slogan: "Free information cannot hurt a rational agent." The standard proof sketch proceeds as follows: Let $A$ be the set of available acts and $S$ the set of possible signal outcomes. Let $a^*$ be the act maximizing expected utility (EU) prior to observing a signal. Upon observing signal $s$, the agent updates beliefs to $P(\cdot|s)$ and chooses $a_s$ to maximize EU conditional on $s$. Since the agent is free to choose any act in $A$, she can always choose $a^*$ even after seeing $s$. Therefore, $EU(a_s|s) \ge EU(a^*|s)$. Taking the expectation over $s$, the expected utility of looking is at least the expected utility of not looking.

  However, this proof relies on structural assumptions about the decision environment that are not always met. To test your understanding of these assumptions, consider the following definitions and scenario.

  **Definitions**
  1.  **Leaky Source:** An information source is *leaky* if the mere fact that the agent consults it is observable by a third party whose subsequent behavior alters the agent's payoff structure, independent of the signal's content.
  2.  **Act-Eroding Source:** An information source is *act-eroding* if receiving its output removes at least one act from the agent's feasible set $A$—most notably, the act of claiming ignorance or maintaining the status quo ante.
  3.  **Fixed-Rule Updater:** An agent is a *fixed-rule updater* if she revises her beliefs by conditioning on the signal but is constrained to feed the posterior into a decision rule she is not free to re-optimize for each message (e.g., "Proceed iff posterior probability of safety exceeds 0.7").

  **The Scenario: The Compliance Officer**
  Dr. Aris is a compliance officer at a bank. She must decide whether to **Report** ($R$) a suspicious transaction or **Ignore** ($I$) it.
  *   **States:** The transaction is either **Fraudulent** ($F$) or **Legitimate** ($L$).
  *   **Priors:** $P(F) = 0.4$, $P(L) = 0.6$.
  *   **Payoffs (Utility):**
      *   If $R$ and $F$: +10 (Fraud stopped).
      *   If $R$ and $L$: -5 (Unnecessary investigation costs).
      *   If $I$ and $F$: -10 (Negligence penalty).
      *   If $I$ and $L$: +2 (Efficiency saved).
  *   **Signal:** Aris has access to a free diagnostic algorithm (**Scan**).
      *   Accuracy: $P(\text{Positive}|F) = 0.8$, $P(\text{Positive}|L) = 0.2$.
  *   **Constraints:**
      1.  **Leakiness:** The IT department logs all Scan usage. If Aris runs the Scan, the Bank's Legal Counsel is notified. Counsel assumes liability risk and immediately freezes Aris's budget, reducing all subsequent payoffs by 4 units.
      2.  **Act-Erosion:** If Aris runs the Scan, she creates a record of inquiry. She can no longer legally claim "Ignorance." If she chooses $I$ after running the Scan, the payoff for $I$ becomes -20 (Gross Negligence) regardless of the state, effectively removing $I$ as a viable option.
      3.  **Fixed-Rule:** Bank Protocol mandates: "If Scan result is Positive, you *must* Report." Aris cannot choose $I$ if the Scan is Positive, even if doing so would maximize EU given the budget freeze.

  **Task**
  (a) Calculate the expected utility of ignoring the Scan versus running the Scan under the constraints above. Demonstrate formally whether this case constitutes a counterexample to Good's Theorem.
  (b) Identify precisely which premise(s) of the standard proof sketch provided above are violated in this scenario. Explain why the reply "she can always ignore the signal" is unavailable to Aris.
  (c) Distinguish this case from mere "costly information." Why does the cost of acquisition fail to explain the negative value here?
  (d) **Philosophical Verdict:** Once such counterexamples are properly catalogued, does Good's Theorem retain any normative bite? Or is it merely a tautological restatement of what it means to be an unconstrained expected-utility maximizer? Defend your view on whether the theorem can support the prescriptive claim "go gather evidence before you decide."

  ***

  ### Deliverable 2: Model Answer

  **Candidate Number: 1042**

  Good's Theorem asserts that for an expected-utility (EU) maximizer, the value of costless information is non-negative. Formally, $EV(I) = \sum_s P(s) \max_a EU(a|s) - \max_a EU(a) \ge 0$. The Dr. Aris scenario demonstrates that when the structural assumptions of the theorem are violated, $EV(I)$ can be strictly negative. This is not a refutation of the mathematics, but a demonstration of its domain limits.

  **(a) Expected Utility Calculation**
  First, calculate the baseline EU without the Scan.
  $EU(R) = 0.4(10) + 0.6(-5) = 1$.
  $EU(I) = 0.4(-10) + 0.6(2) = -2.8$.
  Optimal prior act is **Report** ($EU=1$).

  Now, calculate EU with the Scan. The signal $s \in \{\text{Pos, Neg}\}$.
  $P(\text{Pos}) = 0.8(0.4) + 0.2(0.6) = 0.44$.
  $P(\text{Neg}) = 0.56$.
  Posteriors: $P(F|\text{Pos}) = 32/44 \approx 0.73$; $P(F|\text{Neg}) = 8/56 \approx 0.14$.

  However, running the Scan triggers the **Leak** (-4 utility to all outcomes) and **Act-Erosion** (If Scan used, $I$ yields -20).
  Furthermore, the **Fixed-Rule** mandates $R$ if Pos.
  If Pos (prob 0.44): Must Report. Payoff adjusted for Leak (-4).
  $EU(R|\text{Pos}) = 0.73(10) + 0.27(-5) - 4 = 7.3 - 1.35 - 4 = 1.95$.
  If Neg (prob 0.56): Agent can choose. But $I$ is eroded (-20). $R$ is available.
  $EU(R|\text{Neg}) = 0.14(10) + 0.86(-5) - 4 = 1.4 - 4.3 - 4 = -6.9$.
  $EU(I|\text{Neg}) = 0.14(-20) + 0.86(-20) = -20$.
  So agent chooses $R$ even if Neg.
  Total EU(Scan) = $0.44(1.95) + 0.56(-6.9) = 0.858 - 3.864 = -3.006$.
  $EV(I) = -3.006 - 1 = -4.006$.
  Information is strictly harmful. This is a counterexample to the *application* of the theorem, though not the math itself.

  **(b) Violated Premises**
  The proof step $\max_a EU(a|s) \ge EU(a^*|s)$ fails twice.
  1.  **Act Stability:** The prior optimal act $a^*$ (Report) is available, but the *payoffs* for all acts change due to Leakiness. The function $EU(\cdot)$ is not stable across the "Look/Don't Look" decision.
  2.  **Optimization Freedom:** The Fixed-Rule constraint prevents re-optimization. Even if $I$ were viable, the rule forces $R$ on Positive signals. More critically, Act-Erosion removes the feasible act of "Ignorance," forcing liability.
  The reply "just ignore the signal" assumes the agent can condition on $s$ but choose $a^*$ with the original payoff structure. Aris cannot do this; consulting the signal physically alters the world (Leak) and her legal standing (Erosion).

  **(c) Cost vs. Structure**
  A student might argue "Information is costly." This is a category error. In standard theory, cost is subtracted from the final utility: $EV(I) - c$. Here, the "cost" is endogenous to the act of looking. It is not a fee paid to a vendor; it is a structural change to the game tree. The payoff matrix itself mutates upon observation. Distinguishing this is vital: Good's theorem holds for exogenous costs; it fails when observation is an intervention.

  **(d) Normative Verdict**
  Is the theorem vacuous? In one sense, yes: it defines rationality for idealized agents in static environments. It tells us that *if* you are free to optimize and *if* looking doesn't change the world, you shouldn't fear data. But this is a conditional truth.
  However, it retains normative bite as a *regulative ideal*. It identifies the specific constraints (leakiness, binding rules, act-erosion) that make ignorance rational. It does not command "gather evidence" universally; it commands "gather evidence *unless* your environment punishes observation." The slogan "go gather evidence" is bad advice without the caveat "provided you remain free to ignore it." The theorem's value lies not in commanding action, but in diagnosing why action is sometimes blocked. It is not a commandment; it is a boundary condition for rational agency.

