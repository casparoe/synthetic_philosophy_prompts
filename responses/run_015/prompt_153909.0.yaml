tionally neutral or structurally incomprehensible constitutes a counterexample, or whether she can absorb that result by redefining the conditions of adequate listening. Make each question build on the last, include the anticipated deflection and the sharper follow-up, and keep everything focused on the actual content of her position rather than on biography or broad cultural commentary.
