  2.  **Deconstruct the Philosophical Concepts (Smith):**
      *   *Sympathy:* Not just pity, but "changing places in fancy." It requires an exchange. I feel what you feel *if* I can understand why you feel it.
      *   *Propriety:* The appropriateness of affection to the object/situation. It requires moderating passions so others can sympathize with them. Too much emotion = offensive; too little = indifference.
      *   *Impartial Spectator:* The internalized judge. It's the "man within the breast." It helps us view our own conduct as others would. It's supposed to be *impartial*, not just conformist.
      *   *Merit:* The combination of propriety + beneficial consequences (gratitude).

  3.  **Deconstruct the Character (Stevens):**
      *   *Goal:* "Dignity." Defined as never removing the "mask" of the butler.
