answer: |-
  **RFC-404-M: Resolution of Unasserted Moral Construct Semantics**

  **Status:** Draft
  **Author:** Backend Guild, Policy Language Team
  **Date:** 2023-10-27

  ### Summary
  The `wrong!` macro and related stance-recording constructs currently exhibit undefined behavior when embedded within control flow structures, logical operators, or unexecuted function bodies. While top-level usage correctly registers a negative stance in the global policy store, nested usage fails to register a stance yet continues to participate in type inference and logical chaining. This document proposes a semantic normalization to ensure compositional consistency.

  ### Motivation
  Current behavior is inconsistent. A top-level statement `wrong!(stealing)` successfully records a negative stance. However, embedding this construct—e.g., `if wrong!(stealing) { penalize() }`—results in a no-op regarding stance registration. The engine does not record opposition to stealing, yet the conditional block remains reachable via inference rules that presuppose the condition carries semantic weight.

  This violates the principle of compositional semantics. The inferential engine treats the nested construct as if it contributes a truth-apt proposition, allowing valid modus ponens chaining across nested boundaries. However, the runtime treats it as a side-effecting command that is suppressed in non-root contexts. Consequently, the system validates logic based on content it refuses to evaluate.

  ### Guide-level Explanation
  Developers expect `wrong!(X)` to behave uniformly. Currently, it acts as a command at the root level and a silent value elsewhere. We intend to align these behaviors. Either the construct will return a value usable in logic, or it will be restricted to root-level statements. Intermediate behavior, where the syntax implies a value but performs no computation, is deprecated.

  ### Reference-level Explanation
  The AST node `MoralJudgment` currently emits a side effect (stance registration) during evaluation. In nested positions (conditions, arguments), evaluation is lazy or suppressed, preventing the side effect. However, the type checker infers a dependency based on the assumption that the node represents a stable state of affairs.

  To resolve this, the semantic model must define what a nested `MoralJudgment` represents. Currently, it represents nothing computable, creating a gap between the inference graph (which assumes content) and the execution engine (which assumes force).

  ### Alternatives Considered

  **1. Boolean Coercion (Cognitivist Model)**
  Promote `wrong!` to a first-class expression returning `bool`. Nested occurrences evaluate to `true` or `false` based on the policy store's current configuration.
  *   **Benefit:** Full compositional semantics. Logic gates function normally.
  *   **Cost:** Abandons the original design goal. The construct becomes a description of a moral fact rather than an expression of policy stance. It assumes moral properties exist as queryable state within the engine.
  *   **Implication:** Sentences become capable of being incorrect relative to the store state.

  **2. Commitment Store Desugaring (Quasi-Realist Model)**
  Retain stance-recording semantics for root occurrences. Desugar nested occurrences to checks against a global `CommitmentStore`. `if wrong!(X)` becomes `if CommitmentStore.has_stance(X, NEGATIVE)`.
  *   **Benefit:** Preserves the idea that root occurrences are actions, not descriptions. Recovers compositional behavior without admitting moral facts exist independently of the store.
  *   **Cost:** It is unclear if this is a real semantics or a fiction. The nested sentence now checks the writer's state, not the act's properties.
  *   **Implication:** Nested sentences become truth-apt regarding the agent's psychology, but not regarding the act itself. This recovers validity but changes the subject of the inference.

  **3. Dual-Mode Syntax (Discontinuity Model)**
  Introduce distinct tokens: `assert_wrong!(X)` for root stances and `is_wrong(X)` for nested checks.
  *   **Benefit:** Honest about the semantic discontinuity. Prevents users from embedding commands where values are expected.
  *   **Cost:** Poor ergonomics. Admits that the language lacks a uniform semantics for moral terms.
  *   **Implication:** Inference rules must be duplicated for both modes, or restricted to the descriptive mode only.

  ### Known Limitations and Unresolved Questions
  **Indirect Attribution:** Reporting another agent's stance (e.g., `report(bob, wrong!(stealing))`) remains problematic. The engine cannot record a stance on behalf of `bob` without conflating namespaces. If we use Alternative 2, this becomes `bob.store.has_stance(...)`, which works technically but assumes all agents share the same semantic schema.

  **Future Work:** Identical non-compositional failures appear in epistemic modals (`might!(X)`) and taste predicates (`tasty!(X)`). A unified solution for non-descriptive constructs is preferred over piecemeal fixes.

  ### Appendix: Compiler Diagnostics

  **ERR_MORAL_NOOP**
  *Severity:* Warning
  *Message:* "Stance construct `wrong!` used in nested position; no stance recorded. Inference chain may be unsound."
  *Trigger:* `if wrong!(stealing) { ... }`

  **ERR_MORAL_IMPURE**
  *Severity:* Error
  *Message:* "Cannot coerce stance command to boolean value. Use `is_wrong()` or move to root scope."
  *Trigger:* `let x = wrong!(stealing);`

  **ERR_MORAL_AMBIGUOUS**
  *Severity:* Error
  *Message:* "Indirect attribution requires explicit agent context. Engine cannot assume stance ownership."
  *Trigger:* `log(wrong!(stealing));`

  ***

  **Afterword**

  The compiler analogy treats moral semantics as a type-system issue, which liberties with the philosophical problem. The Frege-Geach problem isn't just about compositional syntax; it's about how logic governs speech acts that aren't assertions. The RFC leans on the "logical validity" formulation: if moral sentences lack truth conditions, valid inference involving them is mysterious.

  A defender of expressivism would argue the doc misrepresents the stance. They don't deny nested sentences have content; they argue the content is complex attitudes (e.g., disapproving of disapproving). The analogy fails because compiler state is objective, while moral commitment is normative.

  The falsifier for this analogy is negation. In code, `!bool` flips a bit. In metaethics, negating a moral judgment isn't simply removing a stance; it might be adopting a conflicting stance or withholding commitment. If the engine cannot distinguish between "I do not forbid stealing" and "I permit stealing," the Boolean coercion (Alternative 1) collapses distinct normative attitudes into a single bit, proving the computational model insufficient for the philosophical reality.
