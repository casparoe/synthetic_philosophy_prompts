answer: |-
  This is a sharp cut. You have identified a gap in the standard taxonomy of standing objections. The configuration you describe—act-consistent, disposition-inconsistent, avowedly so—does not fit neatly into the canonical categories of hypocrisy, complicity, or tu quoque.

  Here is the carving you need.

  ### 1. The Diagnostic: Why Existing Categories Miss
  You are right to sense that the standard objections fail here.
  *   **Act-Hypocrisy:** Ruled out. The blamer complies.
  *   **Complicity:** Ruled out. The blamer is uninvolved in the blamee's act.
  *   **Standard Dispositional Hypocrisy:** (e.g., Fritz, Bell). Usually, this account relies on a *concealed* disposition. The standing loss arises from the unfairness of exempting oneself *secretly* or the deception involved in presenting oneself as a member of the normative community while privately opting out. In your case, there is no deception. The blamer is transparent.
  *   **Moral Luck:** This explains *why* the blamer is compliant (circumstantial luck), but it is not typically framed as a standing *objection*. It is usually a metaphysical or evaluative point, not a procedural one regarding the right to blame.
  *   **Bad Faith:** Ruled out. The blamer is being honest about their motives.

  The intuition you are tracking is genuine. It is a loss of standing, not merely an unattractive style. However, it is not a loss of standing based on *inconsistency* (hypocrisy) but on **normative representation**.

  ### 2. The Core Mechanism: Endorsement vs. Compliance
  To understand the deficit, you must distinguish between **compliance** (conforming to the norm) and **endorsement** (accepting the norm as authoritative independent of external constraint).

  Standing to blame is generally thought to derive from one's membership in a normative community. To speak for the community is to speak for the *norm*. When you blame, you say, "This act violates *our* standard."
  *   **The Virtuous Blamer:** Complies because they endorse the norm.
  *   **The Hypocrite:** Claims to endorse the norm but acts against it.
  *   **Your Configuration:** Complies but explicitly *denies* endorsing the norm. They admit their compliance is purely prudential (fear of detection).

  By avowing that they would violate the norm if the prudential constraints were lifted, the blamer severs the link between their conduct and the norm's authority. They are not speaking for the norm; they are speaking for the *threat of detection*. Consequently, their blame does not carry the weight of moral address; it carries the weight of a warning from one prudent actor to another.

  ### 3. Proposed Term: **The Counterfactual Normative Deficit**
  Since no established term captures the *avowed* counterfactual willingness to violate, I propose labeling this the **Counterfactual Normative Deficit** (CND).

  **Boundary Conditions:**
  1.  **Act-Consistency:** The blamer must not have committed the fault (distinguishes from act-hypocrisy).
  2.  **Counterfactual Willingness:** The blamer admits they would commit the fault under different circumstantial constraints (distinguishes from virtue).
  3.  **Avowal:** The blamer discloses this disposition (distinguishes from standard dispositional hypocrisy).

  ### 4. The Role of Disclosure (Avowal)
  You asked whether disclosure does any work. **Yes, it transforms the nature of the standing loss.**

  *   **Without Disclosure (Hidden Disposition):** This is standard **Dispositional Hypocrisy**. The standing loss is grounded in *unfairness* and *deception*. The blamer claims a moral credit they do not deserve. The blamee can retort: "You are no better than me; you hide it."
  *   **With Disclosure (Avowed Disposition):** This is the **Counterfactual Normative Deficit**. The standing loss is grounded in **alienation from the norm**. The blamer is not claiming moral credit; they are claiming prudential luck. The blamee can retort: "You do not care about the rule either; you only care about not getting caught. You are not blaming me for wronging the community; you are noting that I failed a risk assessment you passed."

  Disclosure removes the charge of lying but introduces the charge of **normative indifference**. It shifts the objection from "You are a liar" to "You are not a moral agent regarding this norm, only a prudent one." In many accounts of blame (particularly Strawsonian or communicative ones), only a moral agent has the standing to issue moral address. If the blamer admits their compliance is non-moral (prudential), they may forfeit the standing to issue moral blame.

  ### 5. The Role of Resistance (Fighting the Disposition)
  You asked whether a blamer who fights the disposition is positioned differently. **Yes, significantly.** This maps onto the Aristotelian distinction between *virtue* (hexis) and *continence* (enkrateia).

  *   **Case A (No Resistance):** "I would do it if I could get away with it."
      *   **Status:** **Prudential Conformity.**
      *   **Standing:** **Lost.** The agent acknowledges no internal authority of the norm. They are merely constrained by external force. They cannot speak for the norm.
  *   **Case B (Resistance/Struggle):** "I am tempted to do it, and if the odds were better I might fail, but I fight the temptation because it is wrong."
      *   **Status:** **Continence (Enkrateia).**
      *   **Standing:** **Partial/Qualified.** The agent acknowledges the norm's authority (they fight *for* the norm against their desire). Even if they admit fragility, the fact that they recognize the norm as a *reason for action* distinct from prudential fear restores some normative connection. They speak for the norm, albeit imperfectly.

  The intuition you have tracks this: The professor who says, "I don't manipulate data because I'm scared" (Case A) has less standing than the one who says, "I am tempted, but I resist because it's wrong, though I know I am fragile" (Case B). The latter acknowledges the *normativity* of the rule; the former acknowledges only the *penalty*.

  ### 6. Summary of the Carving
  *   **Is it a genuine loss of standing?** Yes. It is not merely unattractive style. It undermines the claim to represent the normative community.
  *   **Nearest Existing Category:** **Dispositional Hypocrisy**, but that category typically requires concealment to generate the specific "unfairness" objection. Your case generates an "alienation" objection.
  *   **Proposed Term:** **The Counterfactual Normative Deficit.**
  *   **Key Distinction:** **Prudential Compliance** (no standing) vs. **Moral Continence** (qualified standing).
  *   **Effect of Disclosure:** Disclosure cements the deficit by ruling out the possibility that the blamer is secretly virtuous. It forces the interpretation that their compliance is purely instrumental.

  This configuration suggests that standing requires not just *conformity* to the norm, but a specific *quality of will* toward the norm. If the quality of will is purely prudential, the authority to blame morally is void, even if the conduct is spotless.
