answer: |-
  ### Preliminary Brainstorming: Nearby Phenomena

  Before addressing your specific configuration, I have isolated three cognate phenomena in the cognitive science of analogy. It is crucial to distinguish your observation from these to ensure conceptual clarity.

  1.  **Ontological Reification:** This occurs when a reasoner treats a metaphorical entity in the target domain as if it possesses literal, physical existence because its counterpart in the source does (e.g., searching for the "location" of a memory as if it were a file in a cabinet).
      *   *Difference:* Reification concerns *existence* claims (what *is*). Your phenomenon concerns *modal* claims (what *can* or *must* be changed). One can accept the existence of a university tenure system without accepting that it possesses the same inviolability as a corporate shareholder agreement.
  2.  **Script/Frame Intrusion:** This happens when a sequential or procedural schema from the source is imposed on the target (e.g., assuming a diplomatic negotiation must follow the exact "opening bid -> haggling -> closing" script of a bazaar transaction).
      *   *Difference:* Intrusion concerns *temporal or procedural order*. Your phenomenon concerns *structural stability*. It is not about the order of operations, but about the resistance of specific nodes within the structure to perturbation.
  3.  **Normative Projection:** This is the smuggling of value judgments from source to target (e.g., assuming nature is "benevolent" because a garden is tended with care).
      *   *Difference:* Projection concerns *axiology* (good/bad). Your phenomenon concerns *constraint topology* (rigid/flexible). A feature can be structurally load-bearing without being morally good, and vice versa.

  ***

  ### Analysis of the Configuration

  Your observation cuts to the heart of how analogical reasoning handles **higher-order constraints**. In standard structure-mapping theory, we focus on the alignment of objects, first-order relations, and higher-order causal structures. However, most models treat relations as binary or weighted connections; they rarely explicitly model the *modality* of those connections (i.e., the cost, difficulty, or systemic impossibility of altering them).

  What you have identified is not merely a mapping of *what is connected*, but a mapping of *how tightly it is bound*.

  #### 1. Is there an established concept?

  There is no single, canonical term in the literature that isolates this specific importation of resilience profiles.

  In philosophy of science, this touches on **"model imperialism,"** where a model's idealizations are treated as real constraints in the target system. In cognitive linguistics, it resembles **"frame leakage,"** where the background assumptions of a frame bleed into the target. However, both terms are too broad. "Model imperialism" usually refers to the dominance of a mathematical formalism, and "frame leakage" typically refers to semantic expectations (e.g., assuming a "restaurant" frame implies paying at the end).

  Neither captures the specific transfer of **modal robustness**—the assumption that because a relation is *hard to break* in the source, it must be *hard to break* in the target. This is a meta-structural property, not a first-order relational property.

  #### 2. Differentiation from Related Concepts

  To carve this out precisely, we must distinguish it from its nearest neighbors:

  *   **Vs. Ordinary Analogical Overextension:**
      *   *Overextension* maps a relation that does not hold in the target (e.g., "The atom has a nucleus, therefore it has a solar system of planets orbiting it").
      *   *Your Phenomenon* maps a relation that *does* hold (or is plausible), but assigns it the wrong **degree of freedom**. It is not claiming the relation exists; it is claiming the relation is *inelastic*. In your university example, tenure *does* exist in both, but the *consequences of removing it* are assumed to be catastrophic in the target solely because they are catastrophic in the source.
  *   **Vs. Frame Blending:**
      *   *Blending* typically creates a **third space** (the blend) where new logic emerges that belongs to neither source nor target (e.g., a "computer virus" is neither biological nor digital, but a blend).
      *   *Your Phenomenon* is **unidirectional and parasitic**. It does not create a new conceptual space; it constrains the target domain *as it is*. It forces the target to behave like the source under stress, without generating a novel hybrid logic.
  *   **Vs. Source-Domain Leakage:**
      *   *Leakage* is often semantic or episodic (e.g., using nautical terminology in a space mission because the "voyage" frame leaked).
      *   *Your Phenomenon* is **topological**. It is about the load-bearing capacity of the conceptual architecture. It is not about the vocabulary used to describe the system, but about the assumed physics of the system's stability.

  #### 3. Coining a Term: "Structural Inertia"

  Since no established term suffices, I propose we name this phenomenon **Structural Inertia**.

  **Definition:**
  **Structural Inertia** is a cognitive failure mode in analogical reasoning wherein the reasoner imports the **modal resistance to change** (the cost, difficulty, or systemic risk of alteration) associated with a relation in the source domain, and applies it to an isomorphic relation in the target domain, despite the target domain lacking the underlying mechanisms that generate that resistance.

  It is the uncritical transfer of the *energy landscape* of the source to the target. In the source, certain nodes are "deep wells" (hard to move); in the target, they are shallow dips, but the reasoner treats them as deep wells because the analogy suggests they should be.

  **Boundary Cases (Non-Instances):**

  To ensure the concept is robust, we must identify cases that look like Structural Inertia but are not.

  *   **Boundary Case 1: Functional Isomorphism of Constraints**
      *   *Scenario:* An engineer analogizes a new bridge design to an existing one. They assume that removing a specific support beam in the new design will cause collapse, because it does in the old design.
      *   *Why it falls outside:* This is **valid reasoning**, not Structural Inertia. Here, the resistance to change is grounded in physical laws (gravity, material strength) that are invariant across both domains. Structural Inertia requires that the *mechanism of resilience* be absent in the target. If the resilience is functionally justified in the target independently of the source, the transfer is legitimate.
  *   **Boundary Case 2: Normative Stipulation**
      *   *Scenario:* A legal drafter writes a contract for a new type of organization and explicitly copies "binding precedent" clauses from corporate law, stating, "We want this to function exactly like a corporation regarding precedent."
      *   *Why it falls outside:* This is **design intent**, not cognitive slippage. Structural Inertia is an *unjustified cognitive import*. If the reasoner explicitly stipulates that the target *should* have the same resilience profile as a matter of policy or design choice, they are not suffering from a cognitive bias; they are engineering a constraint. Structural Inertia occurs when the reasoner believes the constraint *already exists* in the target merely because the analogy suggests it, without independent verification.

  ### Summary

  You have identified a subtle but pervasive error in high-level reasoning. It is not about getting the map wrong (mapping the wrong roads); it is about getting the terrain wrong (assuming the mountains are impassable because they are in the source map, when in the target territory they are merely hills).

  By naming this **Structural Inertia**, we can better diagnose arguments where the *status quo* of a system is defended not by its own internal logic, but by the ghost of a system it was merely compared to.
