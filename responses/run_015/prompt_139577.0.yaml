      *   Overall winner: Moderate-High (Nadia has the procedural rule on her side).
      *   Missing consideration: Moderate (Parliamentary procedure is the obvious gap).
      *   Least sure: The normative weight of "legitimacy" vs "correctness" in this specific context.

