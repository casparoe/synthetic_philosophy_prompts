  **Cultural Group-Selection Accounts (Tier C)**
  Cultural group selection is assigned a C tier because while it elucidates the solidarity benefits in historical rituals, it struggles to account for the individualistic profit motives driving modern luxury destruction.

  **Abundance-Error Hypothesis (Tier D)**
  The abundance-error hypothesis falls to D tier because it incorrectly categorizes highly structured, functional behaviors as maladaptive spillovers despite their clear role in maintaining social and market hierarchies.
