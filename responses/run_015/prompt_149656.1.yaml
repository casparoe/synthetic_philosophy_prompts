answer: |-
  The river below the Span was black and fast, but the wood above it was dry and warm. It was the day of the Weaving, the annual ritual where the town of Hollow's Reach replaced the central beam of the bridge that connected them to the mainland.

  Elias ran his hand along the new timber. It was oak, donated by Mara's family plot. "Good grain," he said. "Solid. It wants to hold."

  Mara stood on the other side of the gap, holding a mallet. She didn't look at the wood. She looked at the road behind Elias, the one leading out of town. "Wood doesn't want anything, Elias. It holds because we bolt it."

  "It holds because we're here to bolt it," Elias corrected. He picked up a chisel. "If we weren't here, the river would take it. The fact that we stand here, year after year, proves we intend to stay. The beam is just the physical shape of that intention."

  Mara struck a peg into place. The sound was sharp, final. "No. The beam is the reason we stay. Look at the loop, Elias. I donated this wood because I showed up to the Weaving. I showed up to the Weaving because the bridge was being built. If the bridge wasn't being built, I wouldn't have come. If I hadn't come, I would have taken the road."

  She gestured to the blacktop stretching away from the town limits. "You say the beam proves we have a disposition to stay. I say the beam masks our disposition to go."

  Elias paused. The sun was dipping, casting long shadows through the trusses. "If that were true, you'd leave now. The beam is set. The ritual is done."

  "If I leave now, the bond breaks," Mara said softly. "You know the lore. The Span isn't just wood. It's the tally. Every beam represents a family who chose the town over the road. If one family leaves, the count is broken. The bridge loses its tension. It collapses."

  "That's superstition."

  "Is it?" Mara leaned over the railing. "Or is it metaphysics? You think the town has a soul, a collective disposition to endure. I think the town is a fragile structure held up by the fear of falling. The social bond is the mask. It hides the fact that everyone here is waiting for someone else to jump first."

  Elias tightened a bolt. The metal groaned. "You're here, Mara. You're holding the mallet. You donated the wood. Your actions manifest the disposition. Your words are just noise."

  "My actions are compliance," she countered. "I stay because the bridge exists. The bridge exists because I stay. That's not a disposition, Elias. That's a closed circuit. It's a mask that masks itself. If I walk away, the bridge falls. If the bridge falls, everyone walks away. So I don't walk away. But not because I *want* to stay. I stay to keep the mask intact."

  The wind picked up, whistling through the gaps in the old planks. The bridge swayed, imperceptibly, but enough to feel in the knees.

  "Then test it," Elias said. He dropped the chisel. It clattered on the wood. "Put down the mallet. Walk to the road. If the disposition is real, the bridge will hold without you. If you're right, if the mask is all there is, then your departure should dissolve the bond. The bridge should fail."

  Mara looked at the mallet in her hand. It was heavy, stained with the oil of previous years. She looked at the road, then at the river below.

  "If I leave, the bridge falls," she said. "Including you. You're standing on it."

  "If the town's staying-power is real, I'm safe. If it's just a loop of dependency, we both drown. Either way, we'll know the truth."

  Mara's grip tightened on the mallet. This was the stimulus condition. The trigger. In standard cases, a disposition manifests or it doesn't. But here, the manifestation of her leaving would destroy the very structure that defined the disposition.

  "If I leave," Mara said, "I prove that I wanted to go. But by going, I destroy the town that defined me as a resident. So the town never had a disposition to stay. It just had a temporary equilibrium."

  "And if you stay?" Elias asked.

  "Then the loop continues. The mask remains. We never know if the wood is solid or if it's just painted cardboard."

  The wind howled. The bridge creaked, a deep, resonant sound like a bone settling. Mara raised the mallet. She could swing it at the peg, securing the beam, binding herself to the town for another year. Or she could drop it, turn, and walk.

  If she swung, she validates Elias: the disposition is real, enacted through ritual.
  If she drops it, she validates herself: the disposition was masked, and the mask is fragile.

  But if she drops it, and the bridge falls, she dies.
  If she swings, and the bridge holds, she lives, but the truth remains hidden behind another year of maintenance.

  Mara looked at Elias. He wasn't afraid. He believed the bridge was real. That belief was part of the wood, part of the tension. Her skepticism was part of it too. The bridge was made of their disagreement.

  "The mask isn't hiding anything," Mara said finally. She raised the mallet. "The mask *is* the face."

  She brought the hammer down. The peg sank home. The bridge held.

  "See?" Elias smiled, picking up his chisel. "Solid."

  Mara looked at the road one last time. The asphalt was grey and empty. She turned back to the town. "Yeah. Solid."

  She didn't leave. The bridge didn't fall. The loop tightened, invisible and unbreakable, holding them both safely in place, forever preventing the test that would prove whether they were prisoners or residents. The river rushed on below, indifferent to whether the wood above it was held by love or fear.
