      *   **Specific Task:** Engage with two specific "repairs" proposed by the group:
          1.  *De-biased Reflection:* Invert known distortions (treat future credence as a noisy signal).
          2.  *Plan Reflection:* Constrain the policy mapping evidence to credences, not just two time-slices.
