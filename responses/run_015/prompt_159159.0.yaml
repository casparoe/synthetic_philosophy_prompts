      *   Specifically: Clarifying the *condition of information gain*. RP holds if the transition is purely by conditionalization on factive evidence. It fails if information is lost (forgetting) or corrupted (brainwashing).
      *   The "Plan Reflection" approach is closer to this because it evaluates the *process*.

  6.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Analytical, direct, philosophical, avoiding smoothing over controversy.
      *   *Structure:*
          1.  Diagnosis of the Impasse.
          2.  Evaluation of Repair 1 (De-biased).
          3.  Evaluation of Repair 2 (Plan).
          4.  What counts as progress.
          5.  Separation of Settled vs. Live.
      *   *Constraint Check:* No citations. Flag extrapolation. Distinct sections.

