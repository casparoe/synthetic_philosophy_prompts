      *   *Settled:* RP fails for forgetting/brainwashing in its original form. Dutch Books require specific conditions (fair betting quotients, etc.).
      *   *Live:* Whether a modified RP saves the norm, or if we should abandon it for Conditionalization + Centered Worlds.
      *   *Extrapolation:* My assessment of whether "Plan Reflection" fully solves the Dutch Book vulnerability is theoretical extrapolation, as there isn't a single consensus formalism for it.

      *(Refining the "De-biased" critique)*: If I know I will be biased, my current credence in $A$ given that my future credence is $x$ should *not* be $x$. So De-biased Reflection admits RP is false in those cases. It saves the *intuition* that future selves are evidence, but abandons the *equation*. This pleases Side B but concedes the formal point to Side A (that strict RP is violated).
      *(Refining the "Plan" critique)*: Plan Reflection looks like a shift to "Ratificationism." The risk is that it becomes trivial: "I should follow the policy I think is best." That's tautological. The work is in defining the admissible policies.

      *(Final Polish on Impasse Diagnosis)*: It's a "Category Mistake + Normative Clash." The mathematical identity holds for partitions of *current* opinion about *future* opinion. The normative principle claims *future* opinion should guide *current* opinion. The clash is treating the identity as the norm.

