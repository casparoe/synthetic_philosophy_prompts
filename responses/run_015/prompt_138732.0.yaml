answer: |-
  # The Clarity Protocol

  Orwell's rules fail because they are syntactic, not semantic. A sentence can be active, short, and concrete while remaining dishonest. This procedure tests function, not form. It is designed for speed: if a step passes, move to the next. If it fails, act as directed.

  ### Step 1: The Origin Check (Mechanical)
  **Test:** Is this prose written by us, or is it a verbatim quotation/statement from a third party?
  *   **Pass (Third Party):** If the text is a direct quote or a legally mandated statement we must reproduce, **LEAVE**. Do not edit source voice unless it is libelous.
  *   **Fail (Our Voice):** If this is our copy, or supplied text we are adopting as fact, proceed to Step 2.

  ### Step 2: The Agency Check (Mechanical/Judgment)
  **Test:** Identify the main verb. Who or what is the subject performing the action?
  *   **Failure Mode:** *Agentless Drift.* The subject is missing, nominalized, or passive without justification (e.g., "it was determined").
  *   **Sufficient Answer:** A specific agent is named (e.g., "The board determined").
  *   **Exception:** If the agent is genuinely unknown to us at this time, **LEAVE** (but flag for update).
  *   **Action:** If agent is hidden and known, **REWRITE**.

  ### Step 3: The Falsifiability Check (Judgment)
  **Test:** Can you construct a sentence that clearly denies this claim?
  *   **Failure Mode:** *Empty Fluency.* The sentence is grammatically clean but immune to contradiction (e.g., "committed to better outcomes").
  *   **Sufficient Answer:** A clear negation exists (e.g., "They are not committed" or "Outcomes worsened").
  *   **Action:** If no clear denial is possible, **REWRITE**.

  ### Step 4: The Precision Check (Judgment)
  **Test:** Are quantifiers or hedges ("some," "may," "in respect of") justified by available evidence?
  *   **Failure Mode:** *Scope Fog.* Vagueness used to evade specificity when data exists.
  *   **Sufficient Answer:** The hedge matches the certainty of the evidence (e.g., "a number" is used because the total is unknown).
  *   **Action:** If vagueness hides known data, **REWRITE**. If vagueness reflects genuine uncertainty, **LEAVE**.

  ### Escalation Points
  **ESCALATE** to a senior editor if:
  1.  **Terminology:** The choice involves a contested political designation vs. a plain term (e.g., "militant" vs. "terrorist"). This is a value judgment, not a linguistic one.
  2.  **Policy:** Rewriting requires revealing information we have chosen to withhold for safety or legal reasons.

  ### Limitations
  This procedure cannot distinguish between a clear lie and a clear truth. It ensures that if we are wrong, we are wrong specifically. It does not guarantee accuracy, only accountability. A sentence can pass all tests and still deceive.

  ### Application

  **A. "Following a thorough review of the incident, it has been determined that a number of procedural failures occurred in respect of the handling of the complaint."**
  *   **Step 1 (Origin):** Our copy. Proceed.
  *   **Step 2 (Agency):** Verb: "has been determined." Agent: Missing. Who reviewed? Who determined? This is *Agentless Drift*. **Fail.**
  *   **Decision:** **REWRITE**. (Reasoning: Hides accountability.)

  **B. "Ministers are considering a robust and proportionate package of measures to address irregular migration."**
  *   **Step 1 (Origin):** Verbatim quotation from a government statement.
  *   **Decision:** **LEAVE**. (Reasoning: Step 1 halts editing on direct quotes to preserve accurate reporting of source claims, even if phrasing is pre-packed.)

  **C. "Emergency services say a number of people have been injured at the refinery."**
  *   **Step 1 (Origin):** Our wire copy. Proceed.
  *   **Step 2 (Agency):** Agent: "Emergency services." Verb: "say." Pass.
  *   **Step 3 (Falsifiability):** Can be denied ("Services say no one is injured"). Pass.
  *   **Step 4 (Precision):** Hedge: "a number." Is data available? No, this is early wire. The vagueness reflects genuine uncertainty, not *Scope Fog*.
  *   **Decision:** **LEAVE**. (Reasoning: Insisting on a figure would force speculation. The hedge is justified.)

  **D. "Our department remains committed to delivering better outcomes for the communities we serve."**
  *   **Step 1 (Origin):** Supplied text adopted as our voice. Proceed.
  *   **Step 2 (Agency):** Agent: "Our department." Verb: "remains committed." Pass (grammatically).
  *   **Step 3 (Falsifiability):** Can this be denied? "Better outcomes" is undefined. "Committed" is internal state. There is no external state to contradict. This is *Empty Fluency*. **Fail.**
  *   **Decision:** **REWRITE**. (Reasoning: Grammatically clean but substantively null. Requires specific metrics.)

  \answer{A: REWRITE; B: LEAVE; C: LEAVE; D: REWRITE}
