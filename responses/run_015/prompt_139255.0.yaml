answer: |-
  Let us first lay out the logical skeleton. Your friend's argument is a *regress argument* designed to show that the epistemic condition for reform is impossible to satisfy. The form is: (1) sets a necessary condition for permission (knowledge of purpose); (2) and (3) expand the scope of that knowledge (purpose implies knowledge of countervailed practices); (5) expands the scope again via holism (countervailed practices imply knowledge of their counters, ad infinitum); (6) asserts impossibility (no total knowledge); (7) derives paralysis. The contradiction arises at (8), noting that Chesterton/Burke permit reform.

  There are four candidate break points. First, **Step (1)**: Equivocation on "know." Does this mean explicit historical genealogy or functional intelligibility? Giving this up costs the barrier against rationalist hubris; if "knowing" is too weak, the fence disappears. Second, **Step (2)**: A quantifier shift. The argument requires "all" or "most critical" practices to be countervailing to generate total paralysis. If some are standalone, the regress stops. Cost: Admitting this weakens the claim that tradition is a coherent, interdependent web. Third, **Step (5)**: A modal slide from interdependence to total intelligibility. Just because practices are linked does not mean one must understand the *whole* to adjust a *part*. Cost: Requires a nuanced theory of partial knowledge, which is complex to defend. Fourth, **Step (6)**: The definition of "understanding." It assumes knowledge must be explicit/technical. If knowledge can be tacit (Oakeshott's *practical* knowledge), (6) is false. Cost: You must defend tacit knowledge as sufficient for legitimate reform, which is epistemologically demanding.

  ***

  Here is the verdict. The argument is valid but unsound because **Step (5)** commits a category error regarding the type of knowledge required for social action. Your friend conflates *technical knowledge* (explicit, synoptic, reconstructible) with *practical knowledge* (tacit, navigational, local).

  The regress only holds if "understanding the institutions it countervails" requires a complete historical cartography of the social order. But Burke and Oakeshott deny that social knowledge is cartographic. For Oakeshott, knowing what a practice is for is akin to knowing how to speak a language: you possess the knowledge implicitly without being able to articulate the grammar of the whole language. To satisfy (1), the reformer need not possess the total historical explanation demanded by (5); they need only possess sufficient *practical intelligibility* to recognize the local function. The dining requirement may countervail isolation, but understanding that does not require a PhD in the history of the tutorial system; it requires attending to the *current* texture of college life. Step (5) falsely infers that because the web is interconnected, the *map* must be total before a single thread can be touched. This is the rationalist fallacy Oakeshott attacks: the belief that practice must wait upon theory.

  You can keep (1) in its strong form if you interpret "knowing what it is for" as achieving *functional intelligibility* rather than *historical reductionism*. Chesterton's "see the use" means recognizing the latent function within the current ecosystem, not excavating the minutes of 1890. This preserves the constraint against lazy reform (satisfying your EA friend's worry about status quo bias) without inducing paralysis. The reformer must demonstrate they understand the *local* countervailing relation—e.g., "This dining rule offsets the fragmentation of the tutorial system"—not the entire history of either institution.

  Consequently, (7) is false. The principle is not a blanket prohibition because the epistemic demand is local, not total. We can reform without total understanding because our knowledge is embedded in the practice itself. When the reforming faction proposes deletion, the burden is on them to articulate the local function they believe is obsolete. If they cannot, the fence stands. If they can, and the group agrees the function is no longer served, removal is permitted. This avoids the "decision rule under uncertainty" reduction you rejected; it retains the Burkean claim that reason is deposited in practice, but denies the rationalist claim that this reason must be fully explicit to be acted upon.

  The cost of this repair is vigilance. You must constantly police the distinction between *practical understanding* (which permits reform) and *theoretical reconstruction* (which paralyzes). Your friend's argument is a warning against the latter masquerading as the former. Accept that we navigate the web by feel, not by blueprint, and the regress dissolves.
