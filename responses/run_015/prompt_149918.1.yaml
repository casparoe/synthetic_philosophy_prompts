  **INSTITUTE FOR PROPER FUNCTION RESTORATION (IPFR)**
  **PATIENT INTAKE FORM 88-B: ORGAN REPLACEMENT AND TELEOLOGICAL COMPLIANCE**
  **Effective Date:** Post-Merger Fiscal Year 4
  **Compliance Officer:** Dr. Aris Thorne, Dept. of Normative Biology

  **PREAMBLE: STATEMENT OF TELEOLOGICAL INTEGRITY**
  Welcome to the IPFR. Following our recent merger with the **Neo-Aristotelian Teleology Consultancy**, all implant procedures must adhere to strict definitions of "Proper Function." Patients are advised that mere physiological activity (e.g., pumping blood, filtering toxins) does not constitute biological function unless accompanied by the appropriate normative history. Please review the following clauses regarding the metaphysical status of your replacement organs.

  **SECTION 4.2: HISTORICAL LINEAGE VERIFICATION**
  Per the **2029 Brussels Protocol on Synthetic Selection Histories**, any organic implant claimed to possess "Proper Function" must submit to a Genealogical Audit. Patients seeking etiological certification must provide documented evidence that the organ type in question was preserved by natural selection specifically for the activity it is intended to perform.

  *   [ ] **Option A (Etiological Standard):** Patient requests a bio-engineered organ with a verified selection history.
      *   *Requirement:* Submit phylogenetic records tracing the organ's ancestral lineage to a pre-industrial evolutionary environment.
      *   *Note:* If the organ was designed in a laboratory rather than selected by environmental pressure, it cannot be classified as having a "Proper Function," regardless of performance efficiency. It will be categorized legally as "Matter in Motion."
  *   [ ] **Option B (Causal-Role Standard):** Patient requests a synthetic unit based on current systemic contribution.
      *   *Warning:* This option voids all warranties regarding "Malfunction." Under IPFR policy, an organ without selection history cannot malfunction; it can only cease operation.

  **SECTION 7.1: THE SYSTEM-CONTRIBUTION EXCEPTION**
  Patients opting for synthetic implants that lack evolutionary pedigree but successfully contribute to the host system's current capacity must sign the **Waiver of Ontological Drift**.

  By signing, the Patient acknowledges that while the implant may perform the causal role of a heart or kidney, it possesses no inherent *telos*. Consequently:
  1.  The Institute is not liable for existential distress resulting from the realization that your organs are merely efficient pumps rather than fulfilled biological entities.
  2.  In the event of system failure, the Patient cannot claim the organ "failed its function," as it never possessed a function to fail. It merely stopped working.
  3.  Insurance providers guided by the Brussels Protocol may deny coverage for "Functional Restoration" if the implant lacks the required historical selection pressure, even if the patient remains alive.

  **APPENDIX B: REFUND POLICY FOR CONTINUITY DISPUTES**
  Disputes regarding coverage and refunds are adjudicated based on the conflict between Historical Lineage and Current Contribution.

  *   **Case I: Etiologically Certified Organ Fails to Perform.**
      If an organ with verified selection history (Option A) ceases to pump blood or filter waste, the Institute classifies this as **Malfunction**. The Proper Function remains intact despite the lack of causal contribution.
      *   *Refund Status:* **Denied.** The organ is still doing what it was selected for (attempting to pump), even if it fails. The patient is experiencing a normative error, not a functional loss. Repair bills apply.
  *   **Case II: Causally Adequate Implant Lacks Lineage.**
      If a synthetic organ (Option B) performs perfectly but is found to lack the requisite selection history during a random audit, the Institute classifies this as **Category Error**.
      *   *Refund Status:* **Approved.** The patient was sold "Proper Function" but received "Systemic Contribution." Coverage is retroactively voided. The implant must be removed to prevent contamination of the patient's biological teleology.

  **PATIENT ACKNOWLEDGMENT AND SIGNATURE**
  I, the undersigned, acknowledge that I have been informed of the distinction between what my organs *do* and what they are *for*. I understand that the IPFR prioritizes historical correctness over operational reliability in matters of metaphysical classification. I accept the risk of **Ontological Drift** and agree not to sue for damages resulting from the realization that my synthetic liver is philosophically indistinguishable from a water filter.

