prompt: |-
  I am assembling a dataset of conceptual prompts that must be answerable without web access yet should not be reducible to pretraining clichés, and I need a sustained satirical piece composed in that spirit. Please write a deadpan clinical-administrative parody—approximately 700 words—formatted as the patient-intake FAQ and informed-consent packet for a fictional “Institute for Proper Function Restoration,” a clinic that implants synthetic and bioengineered organs. The voice should be that of an overzealous hospital compliance office: numbered sections, checkboxes, signature lines, and cross-references to institutional policy. The satire should turn on the philosophical dispute between etiological (selected-effect) and causal-role accounts of biological function. Include, for instance, “Section 4.2: Historical Lineage Verification,” which demands documented evolutionary selection history for any implanted heart; “Section 7.1: The System-Contribution Exception,” which permits functionally equivalent organs lacking evolutionary pedigree but requires patients to sign a waiver acknowledging “ontological drift”; and “Appendix B: Refund Policy for Continuity Disputes,” addressing cases in which an etiologically certified organ fails to perform its causal role, or a causally adequate implant is denied coverage for lacking proper lineage. Without naming philosophers directly, ensure that a specialist in philosophy of biology recognizes the selection-history framework—where an artificial heart that pumps blood has no proper function—being contrasted with the system-contribution framework—where an evolutionarily selected heart that no longer pumps may retain its proper function despite functional failure. The bureaucratic absurdities should follow fairly from the actual commitments of each view rather than inventing straw positions.

  To prevent the prompt from collapsing into a generic philosophy exercise, inject two invented institutional details: reference the “2029 Brussels Protocol on Synthetic Selection Histories” and the clinic’s recent merger with a “Neo-Aristotelian Teleology Consultancy.” The piece should remain legible to a non-specialist—who should understand that requiring an evolutionary CV for a pacemaker is conceptually odd—while being precise enough that the humor lands as philosophically informed. Maintain strict internal consistency within the bureaucratic logic: do not let the form slip into compatibilism between the two accounts unless that contradiction itself is the joke. Do not include bibliographies, reading lists, citations, or verbatim quotations from actual philosophical texts; paraphrase all conceptual distinctions in the register of administrative fine print. Write from the perspective of an institution that takes both theories with deadly seriousness, so that by the end a reader feels the genuine tension over whether biological function is a matter of historical origin or present systemic contribution.
