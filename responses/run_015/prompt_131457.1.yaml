answer: |-
  ### Stage One: On the Nature of the Race

  Your intuition is correct: "Race to the Bottom" and "Moloch" are buckets containing three distinct mechanical failures. Confusing them leads to remedies that are either useless or tyrannical.

  **1. The Location of Harm (Internal vs. External)**
  A competition that injures its *participants* (e.g., physicists working 80-hour weeks to stand still) is a **Coordination Failure**. Everyone would prefer to stop, but no one dares move first. The remedy is a *binding agreement* (a union, a cap, a norm).
  A competition that injures *outsiders* (e.g., physicists dumping toxic waste to cut costs) is an **Externality**. The participants are winning; the public is losing. The remedy is *regulation* imposed by a higher authority.
  *Verdict:* These are different animals. Your committee handles Coordination Failures. If the petition is about protecting the public from science, you lack the mandate. If it is about protecting scientists from science, you have a role. Do not bundle them.

  **2. The Nature of the Gain (Absolute vs. Positional)**
  In an **Absolute Race**, spending more yields more total good (e.g., bigger telescopes see deeper). This is merely expensive. It stops when marginal cost exceeds marginal benefit.
  In a **Positional Race**, spending more yields only relative advantage (e.g., a longer CV does not make better physics, it just beats a shorter CV). This is zero-sum. No matter how much is spent, only one person wins.
  *Verdict:* Absolute races self-correct. Positional races do not; they escalate until collapse. Your interventions should target Positional Races. Intervening in Absolute Races stifles progress.

  **3. The Mechanism of Escalation (Voluntary vs. Coerced)**
  If a member can opt out without ruin, it is a **Preference**, not a race. If opting out means career death, it is a **Trap**.
  *Verdict:* Only Traps require binding constraints. Preferences require only information.

  **Summary:** A genuine "Race to the Bottom" is a **Positional Coordination Trap**. It is zero-sum, it harms the participants, and no one can opt out safely. "Moloch" is simply the equilibrium state of this system. If the petition describes an Externality, an Absolute Race, or a Preference, the label is misapplied, and the remedy will fail.

  ***

  ### Stage Two: The Committee Decision Procedure

  **Name:** The Four-Gate Protocol for Research Culture Petitions
  **Time:** 90 Minutes
  **Participants:** 4 Committee Members
  **Output:** One-page Recommendation (Approve / Reject / Refer to Council)

  **Definitions for Use:**
  *   **Positional Good:** A benefit where my gain is your loss (e.g., a single prize, a fixed number of grants).
  *   **Jurisdiction:** The power to punish a violator (e.g., revoke membership, ban from journals).
  *   **Proxy Metric:** A rough number we *can* get in 6 weeks, used when the perfect number is unavailable.

  ---

  #### Gate 1: Jurisdiction and Authority (15 Minutes)
  **Question:** Do we have the power to enforce this, and does the competition happen within our walls?
  **Sufficient Answer:** "Yes, we can ban/punish the violators," OR "No, the driver is external (e.g., national funders, global job market)."
  **Data Rule:** If you do not know the enforcement power, check the Society Bylaws. Do not guess.
  **Stop Point:** If the driver is external (e.g., national grant caps), **STOP**. Output: *Reject. Reason: Outside Jurisdiction.* (See Petition A).
  **Value Hand-off:** None. This is a factual constraint.

  #### Gate 2: Diagnosis of the Trap (30 Minutes)
  **Question:** Is this a Positional Coordination Trap? (Apply modified Exit and Winners Tests).
  **Sufficient Answer:**
  1.  **Exit:** Can a member opt out without career damage? If **Yes**, **STOP**. Output: *Reject. Reason: Voluntary Preference.*
  2.  **Positional:** Does spending more effort create more total science, or just reshuffle the ranking? If **Absolute**, **STOP**. Output: *Reject. Reason: Productive Competition.*
  3.  **Consensus (Winners Test):** Do the current "winners" (those with many grants/prizes) agree this is a problem? If **No**, note this as a risk of factionalism, but proceed if the Trap is proven.
  **Data Rule:** If you lack data on career damage, use **Testimony**. Invite two early-career and two senior members to speak for 5 minutes each. Treat consistent testimony as data.
  **Value Hand-off:** If the answer turns on "What is the Society for?" (e.g., excellence vs. well-being), **STOP**. Output: *Refer to Council. Reason: Value Conflict.*

  #### Gate 3: Mechanics and Leakage (30 Minutes)
  **Question:** Will this rule break, leak, or create a worse race? (Apply Displacement, Enforcement, and Ratchet Tests).
  **Sufficient Answer:**
  1.  **Displacement:** If we ban X, will they do Y? Is Y worse?
  2.  **Enforcement:** Is catching a liar cheaper than the lie's benefit? If policing costs more than the harm, **STOP**. Output: *Reject. Reason: Enforcement Cost.* (See Petition B).
  3.  **Ratchet:** If we set this rule, does it become permanent? **Guidance:** High Ratchet (hard to reverse) requires Higher Certainty. If the rule is hard to undo, demand stronger evidence at Gate 2.
  **Data Rule:** If you cannot model the displacement, run a **Pre-Mortem**. Ask: "It is three years later and this rule failed. How did it fail?"
  **Value Hand-off:** If the remedy requires deciding "Who bears the cost?" (e.g., senior vs. junior), **STOP**. Output: *Refer to Council.*

  #### Gate 4: Review and Sunset (15 Minutes)
  **Question:** How do we know if it worked, and when does it die? (Apply Measurement Test).
  **Sufficient Answer:**
  1.  **Observable:** Name one number we will check in 3 years (e.g., average CV length, not "happiness").
  2.  **Sunset:** The rule expires automatically in 5 years unless renewed.
  **Data Rule:** If no number is available, define a **Proxy** (e.g., instead of "stress," measure "number of hours worked"). If no proxy exists, **STOP**. Output: *Reject. Reason: Unmeasurable.*

  ---

  ### Application to Pending Petitions

  **Petition A: Cap PI grant applications at two per year.**
  *   **Gate 1 (Jurisdiction):** **FAIL.** The Society does not control the National Grant Scheme. We cannot punish a member for applying elsewhere.
  *   **Recommendation:** Reject.
  *   **Reason:** Outside Jurisdiction. The Society cannot bind members regarding external funders. This requires a coalition of funding bodies, not a learned society.

  **Petition B: Attest referee reports are not AI-generated.**
  *   **Gate 2 (Diagnosis):** **PASS.** This is a coordination trap (reviewers use AI to save time, quality drops, everyone must use AI to keep up).
  *   **Gate 3 (Mechanics):** **FAIL.** Enforcement Test. Detecting AI is an arms race. Policing this requires software that costs money and generates false positives. The cost of enforcement exceeds the benefit. Displacement: Reviewers will simply use undetectable AI.
  *   **Recommendation:** Reject.
  *   **Reason:** Enforcement Cost. Attestation without detection capability is "cheap talk" and will be ignored.

  **Petition C: Replace judged early-career prize with a random draw (lottery).**
  *   **Gate 1 (Jurisdiction):** **PASS.** The Committee administers the prize. We control the rules.
  *   **Gate 2 (Diagnosis):** **PASS.** This is a Positional Race. Applicants spend months polishing portfolios for a prize that signals "best." The physics does not improve; only the application quality does. Exit is impossible (career requires prizes).
  *   **Gate 3 (Mechanics):** **PASS.** Displacement is low (cannot game a lottery). Enforcement is low (check threshold, then draw). Ratchet is medium (can revert to judging).
  *   **Gate 4 (Review):** **PASS.** Observable: Time spent by applicants on submissions. Sunset: 5 years.
  *   **Recommendation:** **Approve.**
  *   **The Unwelcome Truth:** You will not welcome this because it admits that your current prize is not measuring "merit" but "application endurance." A lottery reduces the arms race *by destroying the signal of excellence*. If you want to stop the stress, you must accept that the prize can no longer claim to identify the "best" physicist, only a "qualified" one. This degrades the prestige of the award. If prestige is the goal, keep the race. If well-being is the goal, adopt the lottery. You cannot have both.

  ---

  ### Limitations of the Procedure

  **1. The Global Coordination Problem**
  This procedure will systematically **under-regulate** problems that are global (e.g., arXiv preprint pressure). If the Society acts alone, members will simply move to international venues. The Procedure will flag this at Gate 1, but it offers no solution for "We must act, but we cannot win alone." In these cases, the output should be *Refer to Council* with a note to seek international partners.

  **2. The Definition of "Merit"**
  This procedure will systematically **over-regulate** competitions that are actually productive but look positional. If the Committee cannot distinguish between "better physics" (Absolute) and "better CV" (Positional), it will ban useful effort. This happens when the metric is vague (e.g., "impact"). If you cannot define the output, you cannot measure the race.

  **3. The Value Vacuum**
  The Procedure cannot answer: "What is the Society for?" It explicitly hands this off to Council. Do not use this tool to hide from political choices. If the petition asks you to choose between "Elite Excellence" and "Member Welfare," the Procedure will tell you to stop. That is not a bug; it is a feature. You are technicians, not kings.

  **4. Data Scarcity**
  If you cannot find a Proxy Metric at Gate 4, do not invent one. It is better to reject a good idea for lack of measurement than to enforce a bad idea blindly. In these cases, recommend a *Pilot Study* rather than a binding rule.
