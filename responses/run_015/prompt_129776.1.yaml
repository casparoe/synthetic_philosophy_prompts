  Based on her track record, here is the analysis of her decision-making framework, the prediction for "Algorithmic Dysphoria," and the test case to expose her actual logic.

  ### 1. The Prediction: She will KEEP "Algorithmic Dysphoria"
  She will likely argue for retaining the category, possibly with a revised name to avoid reifying the algorithm's power (e.g., "Surveillance Distress"), but she will not scrap it.

  **Why?**
  *   **Patient Uptake (Unlike IGD):** Unlike Internet Gaming Disorder, where she noted patients don't identify with the label, "Algorithmic Dysphoria" describes a lived, self-aware experience. Patients *will* claim this label.
  *   **Coping Utility (Like ADHD):** Like adult ADHD, naming the mechanism ("you aren't broken, you are being nudged") shifts the locus of control. It transforms a moral failing into a structural interaction, which improves coping skills (digital minimalism, adversarial auditing).
  *   **No Identity Stereotype (Unlike HFA):** Unlike "High-Functioning Autism," which she dropped because it forced a performance of competence that erased need, this label validates struggle without demanding a specific "performance" of illness.
  *   **Resource Potential (Like DID):** While new, it creates a pathway for care (therapy for tech-manipulation) that wouldn't exist if the distress were dismissed as "normal reaction."

  ### 2. The Actual Rule: The "Doorway" Heuristic (Pragmatic Consequentialism)
  Her rule is not about whether looping exists (it exists in almost all her "Keep" cases). It is about whether the label functions as an **open or closed door**.

  *   **Keep if:** The label opens a door to **resources** (DID), **coping/agency** (ADHD), or **professional clarity** (PGD).
  *   **Drop if:** The label closes a door by **erasing need** (HFA's "high-functioning" minimizes support) or **fails to open one** due to lack of uptake (IGD).
  *   **The Veto:** The only thing that overrides utility is **Identity Harm**. If the label forces a harmful performance (HFA), it is dropped, even if it has some utility.

  **Summary:** *Maximize Clinical/Personal Utility, subject to an Identity Harm Veto.*

  ### 3. The Competing Rule: "Epistemic Stability"
  A competing rule that fits her past calls almost as well is **The Looping Integrity Rule**. This rule suggests she keeps categories where the looping effect is *stable* or *manageable*, and drops them where the looping makes the category *incoherent* or *iatrogenic*.

  *   **Fits ADHD:** Looping is stable (diagnosis -> coping -> better function).
  *   **Fits HFA:** Looping is destabilizing (diagnosis -> performance -> masking -> diagnostic confusion).
  *   **Fits IGD:** Looping is non-existent (no uptake = no kind).
  *   **Fits DID/PGD:** Looping is contained (within clinical dyad or system).

  **The Difference:**
  *   **Her Actual Rule (Doorway):** Cares about *outcomes* (Did the patient get help? Did the clinician get paid?).
  *   **Competing Rule (Stability):** Cares about *truth* (Does the label accurately describe the person, or does it change them so much the label becomes false?).

  ### 4. The Crucial Test Case
  To distinguish between **Pragmatic Consequentialism** (Her Rule) and **Epistemic Stability** (Competing Rule), you need a case where the label is **highly beneficial** but **epistemically unstable**.

  **The Case: "Bureaucratic Burnout Syndrome"**
  *   **Definition:** Distress caused specifically by navigating insurance/medical systems, where patients learn to exaggerate symptoms to get care.
  *   **The Loop:** The diagnosis *requires* the patient to perform illness to fit the criteria (High Instability/Iatrogenesis).
  *   **The Utility:** It grants immediate access to therapy, disability leave, and validates a very real structural stressor (High Doorway Utility).
  *   **Identity Harm:** Low (It blames the system, not the patient).

  **The Divergence:**
  *   **If she KEEPS it:** She is running the **Doorway Heuristic**. The label helps people get care and validates their struggle, even if it encourages "gaming the system" (instability).
  *   **If she SCRAPS it:** She is running the **Stability Rule**. The label encourages patients to falsify symptoms, making the category scientifically incoherent, regardless of the short-term benefits.

  **Why this works:** It isolates "Utility" from "Truth." Her history with DID suggests she tolerates instability (DID is controversial and looping is high) for the sake of access. Her history with HFA suggests she prioritizes identity over utility. "Bureaucratic Burnout" offers utility without identity harm, but at the cost of truth. If she keeps it, she is a pure pragmatist. If she drops it, she cares more about the scientific integrity of the category than her past decisions on DID would suggest.
