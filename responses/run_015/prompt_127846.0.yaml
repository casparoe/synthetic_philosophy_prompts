  2.  **Critical Period Calibration (Motivated by Cases 1 & 3):** The calibration must occur during a developmental window. Case 1 fails because the window closed without input. Case 3 succeeds because the window opened (ages 0–2), establishing the necessary architecture even if conscious memory was lost and input ceased.
