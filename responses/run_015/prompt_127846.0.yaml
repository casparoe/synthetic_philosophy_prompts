  Immediate cross-modal visual recognition occurs if and only if the visual cortex was functionally calibrated by modality-specific visual input during a critical developmental period. Non-visual spatial information (tactile, geometric, auditory) cannot substitute for this calibration, and conscious memory of the input is not required provided the neural architecture retains the latent calibration traces.

