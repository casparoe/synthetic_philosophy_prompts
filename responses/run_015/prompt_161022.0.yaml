      *   **Predictions:**
          1.  *Scaling:* Introduce a withdrawal fee factor $f$ (pay back $f \times b$ to quit). Escalation ceiling should be $(1-2c)/(1-f)$. At $f=1$ (standard), it's unbounded. At $f=0$ (normal auction), it's $\approx \$1$. Scaling prize and bids proportionally shouldn't change behavior.
          2.  *Path-Independence:* Behavior should depend only on current state ($b$, $b+c$, $c$, prize), not history (how we got there, sunk costs, arousal).
      *   **Goal:** Break this view. Rank objections from fatal to awkward. Address load-bearing predictions, falsifiability/escape hatches, and the distinction between structural vs. psychological explanations.
      *   **Motivation:** Real-world analogues (takeover wars, Concorde fallacy). Wants to know if the structural story holds there.

  2.  **Deconstruct the "Structural Account":**
