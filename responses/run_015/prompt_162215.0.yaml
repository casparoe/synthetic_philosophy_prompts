  **Note on the Poem**

  The poem commits to the second reading: the device purchases credibility by binding the custodian to future irrationality. It assumes the adversary is rational enough to believe the custodian values consistency over post-strike utility, and that the device is psychologically beyond recall even if physically overrideable. The adversary believes the custodian will obey the draw because overriding it would destroy the strategic reputation required for deterrence to function at all. The poem does violence to theory by assuming human will can be perfectly pre-committed; in reality, the visceral horror of actual retaliation might break the pledge, rendering the probability $q$ effectively zero despite the arithmetic, but the poem requires this rigidity to dramatize the tragedy of binding oneself to chance.
