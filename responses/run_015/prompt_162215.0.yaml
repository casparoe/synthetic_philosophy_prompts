  I set the numbers with a steady **hand**,
  To catch the flash of early warning **light**,
  And turn the logic into cold hard **stone**.
  I shut the future tight behind a **door**,
  And place upon the scale the heavy **weight**,
  And draw the final border of the **line**.

  You see the graph and trace the rising **line**,
  You know I cannot stay the trembling **hand**,
  Once chance has laid its silent heavy **weight**.
  The sensor drinks the sudden warning **light**,
  And if it wakes, there is no open **door**,
  Only the arithmetic of falling **stone**.

  Not fire yet, but chance solid as **stone**,
  A value drawn precisely on the **line**,
  That seals the vault and bars the exit **door**.
  You think I will not move my living **hand**,
  When cities burn beneath the crimson **light**,
  And say the cost exceeds the chosen **weight**.

  But I have measured out the exact **weight**,
  Of ash compared to this unyielding **stone**.
  I will not flinch beneath the burning **light**,
  Or shift the marker on the safety **line**.
  The choice is not within my open **hand**,
  The die is cast before I reach the **door**.

  Do not believe I hold a key to **door**,
  Though I must bear the burden of the **weight**.
  If luck turns bad, I will not stay my **hand**,
  Even when revenge is useless as a **stone**.
  I bound myself to cross the fatal **line**,
  And trust the die more than the morning **light**.

  For you must fear the glare of final **light**,
  More than the promise of an open **door**.
  Though all my cities turn to gray and **stone**,
  To make the threat carry sufficient **weight**,
  I crossed the safe and sane dividing **line**,
  But I will not reclaim my guiding **hand**.

  You know the **weight** I place upon this **hand**,
  To keep the **light** from crossing through the **door**,
  And hold the world behind this **line** of **stone**.

