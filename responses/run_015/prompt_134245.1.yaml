answer: |-
  You are wrestling with the classic tension in moral philosophy between the **Control Principle** (you are only responsible for what you control) and the reality of **Outcome Luck** (we treat people differently based on results). Your intuitions are actually quite sophisticated; you aren't simply saying 'results matter', you are distinguishing between *internal blame* and *external consequences*.

  To capture the specific mix of verdicts you've listed, a single monolithic rule won't work. Instead, the best fit is a composite principle I shall call **The Dual-Track Principle of Responsibility**.

  ### The Principle

  **An agent's *moral culpability* is determined solely by factors within their control (intentions, efforts, and accessible knowledge), but their *social and professional liability* is rightly sensitive to the actual outcomes produced.**

  This principle splits responsibility into two distinct tracks:
  1.  **Track One (Culpability):** This is about the agent's character and choices. It asks: 'Did they try to do well? Did they know better?' Luck plays no role here.
  2.  **Track Two (Liability):** This is about the agent's relationship with the world and the consequences they must answer for. It asks: 'What harm occurred? What trust was broken?' Luck plays a major role here.

  ### How It Delivers Your Verdicts

  Let's run your cases through this machine to see if it holds.

  **1. The Surgeons**
  *   **Verdict:** Culpability is equal (same skill, same risk taken). Liability is unequal (one caused death).
  *   **Fit:** Perfect. The principle explains why you feel they are equally *blameworthy* (Track One) but why the career impact should differ (Track Two). The profession relies on trust; a surgeon who has a death on their record, even by bad luck, poses a statistical risk or a reputational liability that the other does not.

  **2. The Climate Activist**
  *   **Verdict:** Culpability is equal (same protest action). Liability is unequal (hero vs. villain).
  *   **Fit:** Strong. Society praises or vilifies based on the *result* (Track Two), even if the *choice* was identical (Track One). The principle validates your feeling that the praise/vilification is about the outcome, not a deep change in their moral character.

  **3. The Programmer (Autonomus Car)**
  *   **Verdict:** You want to say the first did something *worse*.
  *   **Fit:** Here is the first friction point. The Dual-Track Principle says the programmer who killed did *not* do something morally worse in terms of character or negligence (Track One). However, they are *liable* for a death (Track Two).
  *   **Adjustment:** To keep this principle, you must refine your intuition. You cannot say the act was 'worse'; you must say the *situation demands a heavier response*. The difference isn't in their soul, but in the debt they owe to the world.

  **4. The Soldier**
  *   **Verdict:** Less culpable than one who knew, but not off the hook.
  *   **Fit:** Strong. Track One accounts for epistemic luck (what he could know). Since he genuinely couldn't know the order was unlawful, his culpability is reduced compared to a knowing participant. However, he is still an agent in a massacre, so he retains some liability (Track Two) simply by virtue of participation, perhaps requiring restitution or rehabilitation even if not punishment.

  **5. The Jokesters**
  *   **Verdict:** Equally rude, unequally ruined.
  *   **Fit:** Perfect. Track One says they are equally rude (same intent/action). Track Two says one suffers reputation damage due to the luck of being recorded. The principle clarifies that the recorded friend is not *morally worse*, just *unluckier*.

  ### The New Case: The Genetic Doctor

  Now, let's apply **The Dual-Track Principle** to the case you haven't listed: *A doctor prescribes a standard drug following every guideline, but an unknown genetic factor makes it fatal for this one patient.*

  **Prediction:**
  *   **Culpability (Track One):** Zero. The doctor followed guidelines and the risk was unknowable. There was no negligence.
  *   **Liability (Track Two):** Minimal to None. Unlike the Surgeon case, where the risk was *known* and accepted, here the risk was unforeseeable. Therefore, there is no breach of trust to manage.
  *   **Outcome:** The doctor should face no career hit and no blame.

  **Why this differs from the Surgeon:**
  In the Surgeon case, the risk was inherent to the procedure (known risk actualised). In the Genetic Doctor case, the risk was hidden (pure accident). The Dual-Track Principle allows liability to track outcomes *only where there was a foreseeable risk undertaken*. If the risk was truly unknowable, Track Two does not trigger a penalty.

  ### The Hard Truth: What You Must Drop

  You asked me to be honest about which of your gut feelings this principle forces you to drop.

  If you adopt **The Dual-Track Principle**, you must abandon the intuition regarding the **Programmer**.
  You wrote: *"I want to say the first did something worse."*
  The principle dictates that you **cannot** say the first programmer did something *worse*. Their negligence was identical. The code was identical. The only difference was the chaotic state of the world outside the screen.
  *   **What you keep:** The intuition that they should be treated differently (one goes to prison or pays damages, the other does not).
  *   **What you drop:** The idea that this different treatment is because one is *more wicked* or made a *worse choice*. It is because one has a *debt to pay* and the other does not.

  ### The Competing Candidate: The Strict Control Principle

  For the sake of completeness, there is one other candidate, though it fits your current views less well.

  **The Strict Control Principle:** *Moral assessment (both blame and liability) must never be influenced by factors outside the agent's control.*

  *   **What it predicts:** The Surgeons should have identical career outcomes. The Programmer who killed is no more liable than the one who didn't (perhaps both should be fired for writing buggy code, or neither). The Activist deserves neither praise nor blame for the outcome, only for the protest itself.
  *   **The Cost:** To accept this, you would have to drop your intuition about the **Surgeon's career** and the **Programmer's liability**. You would have to argue that it is fundamentally unjust for the surgeon to lose her job over a death she couldn't prevent. This is philosophically pure, but it clashes with how human societies actually function (and seemingly with your own gut).

  ### Conclusion

  Your instincts are pulling you towards **The Dual-Track Principle**. It allows you to maintain that people are morally equal when their choices are equal, whilst acknowledging that the world treats us differently based on the consequences we cause.

  It resolves your confusion about the Programmer: the difference is not about control, nor knowledge, nor is it purely about the bad result making them 'worse'. It is about **liability**. One has created a harm that requires restitution; the other has created a risk that vanished. We punish the harm, not just the risk, because we live in a world of results, not just intentions.

  The only price you pay is semantic precision: you must stop saying the unlucky agent is 'worse', and start saying they are 'more liable'.
