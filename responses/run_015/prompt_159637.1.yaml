  (c) **Causal-Structure:** A natural-kind criterion favors $H_{grue}$. The color variation is caused by chemical stratification (depth) within the vat. Time $t$ is not arbitrary; it is an index inheriting causal significance from the unobserved variable (layer depth). $H_{grue}$ tracks the underlying causal mechanism; $H_{plain}$ ignores it. Instances of "crimson" before $t$ share a cause (upper layer); instances after $t$ share a different cause (lower layer).

  **Verdict**
  The inquirers should project $H_{grue}$. The next skein will be scarlet. This agrees with (c). While entrenchment and simplicity suggest stability, the causal structure dictates change. The warrant for $H_{grue}$ comes from the physical reality indexed by time, not linguistic habit. This demonstrates that entrenchment and causal structure can come apart.

  **Notes**
  1. **Workhorse Feature:** Index-inheritance (time proxies depth). If removed (e.g., if color changed randomly without cause), the case collapses into standard Goodman: no causal reason to prefer grue, so entrenchment wins by default.
  2. **Predicate Endorsement:** (c) endorses the *causal variable* (depth), not strictly the grue-predicate. The grue-predicate is merely the observable shadow of the causal structure. If we discover "depth," we project based on that, making the temporal predicate obsolete, suggesting grue is a placeholder for causal knowledge.
  3. **Entrenchment Defense:** An entrenchment theorist might argue that once the causal mechanism is known, artisans project "crimson-if-top-layer," not the temporal grue-predicate. Thus, grue is never truly projected; we simply acquire better concepts. This works partially, but initially, time is the only available index, forcing a temporary grue-projection before the causal concept is formulated.
