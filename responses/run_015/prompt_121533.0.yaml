answer: |-
  Distinguished colleagues, practitioners, and guests, welcome.

  It is a privilege to open this workshop on state sovereignty and armed conflict. We gather here across significant divides. Some of us track the genealogy of concepts; others draft the treaties that codify them; and still others work on the ground where those concepts collide with human suffering. Usually, these perspectives run on parallel tracks, intersecting only when policy demands theory or theory demands application. Our aim over the next two days is to force an intersection. We are not merely here to manage conflict, but to understand the conceptual architecture that makes sovereignty and conflict intelligible to one another.

  To do that, we must confront a difficult inheritance. We cannot speak of sovereignty and war without encountering the claim that war is not simply a failure of politics, nor a contingent calamity to be avoided at all costs. I refer, of course, to the Hegelian proposition that war holds a specific ethical and structural function for the state.

  For the non-philosophers in the room, I must translate this carefully, for it is easily misunderstood. In this framework, the state is not merely a night-watchman protecting property, nor a service provider ensuring comfort. It is the actuality of ethical life. It is the structure through which individuals transcend their private desires and participate in a universal collective. However, there is a perpetual danger that civic life will stagnate. In times of prolonged peace, society risks collapsing into what we might call "the atomism of civil society." Citizens become obsessed with private gain, personal security, and the accumulation of property. The bond that ties the individual to the whole weakens. The state becomes a tool for personal ends rather than the ground of ethical meaning.

  On this account, war serves a sober, negative function. It is the moment when the finite—property, life, private interest—is revealed as contingent. By demanding the ultimate sacrifice, the state recalls the citizen to their substantive duty. It disrupts the complacency of private life and validates the sovereignty of the state as something higher than the sum of individual preferences. It is not that violence is good; rather, the *possibility* of risking one's particular existence for the universal is what keeps ethical life vital. Without this capacity for negation, sovereignty becomes hollow, a legal shell without ethical substance.

  For the Hegel scholars here, I offer this summary without apology or citation, trusting we share a grasp of the *Philosophy of Right*'s darker contours. For the lawyers and practitioners, I ask you to hold this thought: in this tradition, sovereignty is not just a legal status; it is an ethical claim demanding recognition, purchased through the willingness to risk.

  But this brings us to the precipice of our present condition. Hegel's framework rests on a specific vessel: the sovereign nation-state. It assumes a world of distinct ethical wholes, where the "Universal" for the citizen is coextensive with the boundaries of the state.

  Today, that vessel is leaking. We operate in a world where sovereignty is increasingly diluted by global governance structures, international legal regimes, and transnational economic forces. The absolute authority of the state is constrained by human rights tribunals, security councils, and humanitarian norms. The state is no longer the sole horizon of political obligation.

  This structural shift forces a profound question upon us, one that I propose as the thematic core of this workshop: If the ethical function of war was inseparable from the sovereignty of the individual state, and if global governance now dilutes that sovereignty, is that ethical function lost? Or can it be transformed?

  Consider the implications. If the state is no longer the ultimate bearer of the "Universal," where does the citizen's ethical duty lie? Can the mechanism of collective risk be transferred? Is it possible for modern citizens to perform an analogous ethical act—risking particular interest for a universal that transcends the state—within international institutions?

  For the international lawyers: Does the shift from state-centric sovereignty to a rules-based international order create a new site for ethical obligation? Or does it merely create a bureaucracy of norms that no one is willing to die for? When we speak of "international community," do we speak of an ethical substance capable of demanding sacrifice, or merely a convergence of interests?

  For the conflict resolution practitioners: You see the human cost when these abstractions fail. But consider the flip side. When the state loses its monopoly on legitimate violence, or when its sovereignty is overridden by external intervention, does the population lose the mechanism that binds them together? Do we see a fragmentation into warlordism and tribalism because the "Universal" has vanished, leaving only particular interests fighting in the dark? Or do you see new forms of solidarity emerging that bypass the state entirely?

  And for my fellow philosophers: We must ask if the decline of state-centered sovereignty entails the loss of the very mechanism that, on the account I outlined, kept ethical life vital. If we remove the possibility of the ultimate risk, do we condemn global civil society to a permanent, shallow hedonism? Or is that definition of ethical life itself historically bound to a nineteenth-century polity that no longer exists?

  We must be careful not to turn this into an apology for violence. We are not seeking to justify war. We are seeking to understand what happens to *us*—to our civic identity, our sense of obligation, and our political structures—when the capacity for collective risk is decoupled from the state.

  If the Hegelian diagnosis is correct, that ethical life requires the negation of mere particularity, then a world of global governance faces a crisis. It risks becoming a world of administration without obligation. We may have peace, but it could be the peace of the graveyard, or worse, the peace of the marketplace, where nothing is sacred enough to defend and nothing is valued higher than security.

  Alternatively, perhaps we are witnessing the birth of a new universality. Perhaps the "risk" is no longer military sacrifice but the surrender of national autonomy to a global legal order. But is that surrender felt as an ethical duty, or resented as an external imposition?

  Over the next two days, I invite you to wrestle with this tension. Do not let our discussions settle comfortably into policy recommendations. Push further. Ask whether our current institutions possess the ethical weight to sustain a viable political life. Ask whether sovereignty, in its traditional form, is a relic that blocks justice, or a necessary vessel for human freedom.

  We are here to interrogate whether the bond between the citizen and the collective can survive the dissolution of the sovereign state. If war was the terrible mirror in which the state saw its own sovereignty reflected, what mirror do we hold up today? And what do we see looking back?

  Thank you. I look forward to our deliberations.
