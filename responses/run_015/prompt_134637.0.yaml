  hey, thanks so much for coming on the podcast. we've been reading some Camus in club and honestly half the group thinks he's inspiring and the other half thinks he's depressing. so i guess to start, where do you think Camus got it right about the absurd, and exactly where do you think he kinda quit too soon?

  2. okay so you say we can build meaning even if the universe is silent, but isnt that just subjectivism with extra steps? like if i decide collecting bottle caps is meaningful, who are you to say thats valid inside the absurd? it sounds like anything goes as long as i feel good about it.

  3. *(follow-up)* yeah but you keep using this phrase "reconstruction not collapse." im not sure i get the difference though. if the ultimate meaning is gone, how is reconstructing local meaning any different than just pretending the collapse didnt happen? like arent we just decorating the ruins?

  4. heres another thing that bugs me. if nothing ultimately matters because the universe doesnt care, why does the construction matter at all? isnt it self-defeating to put all this effort into building meaning inside a framework that says meaning is impossible? why not just chill like Camus said?

  5. *(follow-up)* i see, so youre saying the value is in the building itself, not the result. but if its all reconstruction and not collapse, doesnt that require some standard for what counts as a good reconstruction? or is any construction valid even if it hurts people, since theres no objective list?

  6. thats actually a good lead into my next question. you really go after Susan Wolf and those objective-list theories. you say Wolf's idea of "fitting fulfillment" is cheating. can you explain why you think "fittingness" is just disguised normativity sneaking in through the back door?

  7. *(follow-up)* right, but if we ditch fittingness and objective lists entirely, dont we lose the ability to criticize bad meanings? like if someone finds fulfillment in something terrible, and you say fittingness is fake normativity, do you have any ground to stand on to say thats wrong?

  8. last one, and i hope this isnt too blunt. a lot of people i know think absurdism is basically depression with a philosophy degree. like, acknowledging the absurd just makes you numb. what do you say to someone who feels like recognizing the absurd kills their motivation instead of freeing them to build stuff?
