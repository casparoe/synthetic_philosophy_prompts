answer: |-
  ### 1. The Dependency Structure (Ordering)

  Do not teach "Tragedy" then "Public Goods" as separate topics. Teach them as **one mechanism with a reversible sign**. The sequence must force the students to build the incentive structure first, then flip it, then test the remedies.

  **Sequence:**
  1.  **The Stage (Resource + Group):** Define the physical resource and the specific user group. *Dependency:* You cannot model incentives until the boundary of the "public" is defined.
  2.  **Valve 1 (Appropriation/ToC):** Model the cost-imposing action (taking). *Dependency:* This leverages their Hardin reading and dominant strategy knowledge. It establishes the baseline "race to the bottom."
  3.  **Valve 2 (Provision/PG):** Model the benefit-conferring action (maintaining). *Dependency:* This *must* come after Valve 1. If you start here, students default to "government provides." By coming second, they see it as the structural mirror of Valve 1.
  4.  **The Remedy Trap (Privatization):** Apply a property solution to Valve 1 and observe the effect on Valve 2. *Dependency:* You cannot show the trade-off until both valves are active.

  **What fails if you invert the order:**
  *   **If you teach Provision first:** Students categorize it as "nice things we share" (abstract morality) rather than a strategic incentive problem. They miss the free-rider logic because they haven't felt the pressure of the competitive margin yet.
  *   **If you teach Remedies before Provision:** Students accept privatization as the universal fix. You lose the ability to show that solving the *taking* problem can exacerbate the *making* problem.

  **The Two-Valves Distinction:**
  Introduce the valves explicitly at the transition from Step 2 to Step 3.
  *   **Valve 1 (Out):** My gain = Your loss (Negative Externality).
  *   **Valve 2 (In):** My cost = Your gain (Positive Externality).
  *   **The Trap:** A remedy that closes Valve 1 (e.g., dividing the resource) often physically blocks Valve 2 (e.g., coordination for maintenance becomes impossible across boundaries).

  ---

  ### 2. The Core Example: The Gravity-Fed Irrigation Ditch

  **The Setup:**
  *   **Resource:** A single, gravity-fed irrigation ditch running through a flat plain.
  *   **Group:** 8 Smallholders (Farmers A through H), lined up sequentially along the ditch.
  *   **Physical Unit:** The *flow of water* and the *channel capacity*.
  *   **Property Unit:** The *land plots* adjacent to the ditch (which can be privately owned).

  **The Two Valves:**
  1.  **Appropriation (Valve 1):** Diverting water into fields.
      *   *Incentive:* Water increases my yield.
      *   *Externality:* Less water/pressure for Farmers B–H downstream.
      *   *Equilibrium:* Everyone diverts max capacity. Downstream farmers get mud; upstream get crops. Total yield is sub-optimal (degradation), not zero.
  2.  **Provision (Valve 2):** Dredging silt from the ditch bed.
      *   *Incentive:* Dredging costs me labor/time.
      *   *Externality:* A clear ditch improves flow for *everyone* downstream (and prevents backup for upstream).
      *   *Equilibrium:* No one dredges. Silt accumulates. Flow slows. Yields drop for everyone (degradation).

  **The Non-Convexity (Threshold):**
  *   The ditch functions well until silt reaches 40% depth. Above 40%, flow turbulence increases exponentially, causing bank erosion.
  *   *The Trap:* The marginal bucket of silt looks harmless (like the marginal herd animal). The system degrades gradually (lower yields) before it hits the erosion threshold (collapse).

  **Why Enclosure Fails (Physical vs. Property Unit):**
  *   **The Move:** Suppose we privatize the ditch bed. Farmer A owns the first 100 meters, Farmer B the next 100, etc.
  *   **Valve 1 Fixed:** Farmer A can now exclude others from taking water at his section. He internalizes the water value.
  *   **Valve 2 Broken:** Farmer A will not dredge his 100 meters. Why? Because the primary benefit of dredging Section A flows to Farmers B–H (better water delivery). Farmer A bears 100% of the labor cost but captures only a fraction of the benefit.
  *   **Result:** Privatization stops the water theft but guarantees the ditch silts up. The *physical* resource (flow) crosses the *property* boundaries.

  **Why this fits your constraints:**
  *   **Small Group:** 8 named farmers.
  *   **No Villains:** Farmers are rational profit-maximizers, not greedy.
  *   **No Ruin:** Yields drop, banks erode, but the land doesn't vanish.
  *   **Not on Exclusion List:** It is not a pasture, fishery, atmosphere, or fridge.
  *   **Enclosure Failure:** Clear mismatch between owning the *bed* and controlling the *flow*.

  ---

  ### 3. The Misconception Map

  | Misconception | When it arrives | Strategy |
  | :--- | :--- | :--- |
  | **"Commons means unowned."** | **Phase 1 (Setup).** | **Break immediately.** The farmers own the land and have usage rights. The issue is *shared access*, not lack of ownership. |
  | **"The tragedy is about greed."** | **Phase 1 (Valve 1).** | **Break.** Show the payoff matrix. Defection is a *dominant strategy*, not a moral failing. If they were all saints, the problem wouldn't exist; if they are all rational, it does. |
  | **"Privatization is the fix."** | **Phase 2 (Remedy).** | **Let it form, then break.** Allow them to propose selling the ditch sections after Valve 1. Then use Valve 2 (dredging) to show why this fails. |
  | **"ToC and Public Goods are the same."** | **Phase 3 (Comparison).** | **Break.** Use the Two-Valves language. ToC = Negative Externality (Taking). PG = Positive Externality (Giving). Same structure, opposite sign. |
  | **"My one action makes no difference."** | **Phase 2 (Valve 2).** | **Break via Reciprocity.** Acknowledge the math is true for one person. But note: *Everyone* has this excuse. If all 8 use it, the ditch silts. The error is ignoring the *sum* of identical rationalities. |
  | **"It's been fine for years." (Threshold)** | **Phase 1 (Degradation).** | **Break.** Distinguish *marginal impact* (invisible) from *cumulative state* (visible). The system looks stable until the erosion threshold is crossed. |
  | **"Solutions are State vs. Market."** | **Phase 3 (Remedy).** | **Add this.** (You didn't list it, but it's critical). Show that Ostrom-style governance (user agreements) is a third option that keeps the physical unit intact. |

  **What you got wrong/missing:**
  *   **Wrong:** You guessed "Commons means unowned" is a primary misconception. It is, but the deeper error is "Commons means *no rules*." Emphasize that Hardin's parable assumes *no governance*, not just no ownership.
  *   **Missing:** The **"Fixed Pie" Fallacy**. Students often think the resource is static. Emphasize that *maintenance* (Valve 2) can expand the resource capacity, which privatization might stifle.

  ---

  ### 4. Opening, Board, and Closing

  **The 5-Minute Opening:**
  1.  **Minute 1:** Acknowledge the Hardin reading. Ask: "How many of you think Hardin's solution was privatization?" (Most will say yes).
  2.  **Minute 2:** Draw the ditch on the board. Label Farmers A–H.
  3.  **Minute 3:** State the session goal: "We are not deciding if Hardin was right. We are deciding if his *diagnosis* covers the whole machine."
  4.  **Minute 4:** Introduce the Two-Valves metaphor verbally.
  5.  **Minute 5:** Write the Board Sentence.

  **The Board Sentence (Leave for 50 mins):**
  > "Privatization closes the valve on *taking*, but often jams the valve on *making*."

  **The Diagnostic Question (Last 10 Minutes):**
  *   **Scenario:** "Imagine the 8 farmers form a cooperative. They keep the ditch shared (no privatization) but hire one person to monitor water usage and collect dues for dredging."
  *   **Question:** "Which valve is being managed by the monitoring, and which by the dues? Why would this fail if the monitor is paid by Farmer A only?"
  *   **Superficially Correct (Empty) Answer:** "It solves the tragedy because they are working together." (Vague, ignores valves).
  *   **Target Answer:** "Monitoring closes Valve 1 (stops over-extraction). Dues fund Valve 2 (maintenance). If Farmer A pays the monitor, Valve 2 jams again because A won't pay for B's benefit."

  **The Refusal:**
  *   **Student Question:** "So, what is the *best* solution for the ditch? Privatization or Cooperative?"
  *   **Your Refusal:** "This model identifies the trade-offs; it does not calculate the local transaction costs required to choose."

  ---

  ### 5. What to Leave Out (and Say You Are)

  **Explicitly exclude the following to protect the 50-minute limit:**

  1.  **Ostrom's Design Principles:**
      *   *Say:* "Elinor Ostrom won a Nobel Prize for showing communities can self-govern commons without state or market. I am leaving out her eight principles because today is about the *incentive structure*, not the institutional checklist."
  2.  **Coase Theorem / Transaction Costs:**
      *   *Say:* "Ronald Coase argued parties can bargain to efficiency. I am leaving this out because with 8 farmers and a silting ditch, transaction costs are the *problem*, not the solution."
  3.  **Hardin's Later Polemics:**
      *   *Say:* "Hardin later applied this to immigration and welfare ('Lifeboat Ethics'). We are leaving that out. We are analyzing the *model*, not the politics."
  4.  **Empirical History:**
      *   *Say:* "Historical commons were often regulated, not open-access. We are treating Hardin's parable as a theoretical baseline, not a historical claim."

  **Final Check:**
  *   Does this distinguish ToC and PG? Yes (Valves 1 & 2).
  *   Does it handle the enclosure failure? Yes (Flow vs. Bed).
  *   Does it fit the time? Yes, if you keep the game theory to dominant strategies only.
  *   Does it avoid the "ruin" narrative? Yes, focus on yield degradation/silt accumulation.
