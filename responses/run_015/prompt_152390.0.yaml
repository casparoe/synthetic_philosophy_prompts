      *   *Commitment 2: Intentionality vs. Stochasticity.* Tracing is deterministic (line A goes to point B). AI is probabilistic (prompt X yields unpredictable texture Y). The school values *predictive mental modeling*. You need to know what your hand will do before it does it.
      *   *Commitment 3: Tool Transparency vs. Tool Agency.* Photoshop and projectors are "transparent" tools (they do exactly what the hand tells them). Midjourney is an "agentive" tool (it makes aesthetic decisions on behalf of the user). The policy assumes the artist must be the sole aesthetic decider.
