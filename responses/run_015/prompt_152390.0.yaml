answer: |-
  The policy you're describing isn't vibes-based gatekeeping; it is actually a highly specific, coherent philosophical stance, even if the school hasn't written it down as a manifesto. It relies on a theory of **Embodied Intentionalism**.

  Here is a reconstruction of the implicit theory, an analysis of its consistency regarding tracing vs. AI, and how the rubric would shift under an output-based model.

  ### 1. The Implicit Theory: Embodied Intentionalism
  The grading policy presupposes that artistic value resides in the **unbroken chain of micro-decisions** made by the human nervous system during the execution of the work.

  *   **Creativity Location:** It locates creativity primarily in the **physical hand-movement**, but only insofar as that movement is the direct servant of a **predictive mental model**.
  *   **The "Authorial Presence" Test:** To have "authorial presence," you must be able to predict exactly what mark your tool will make before you make it. If you cannot predict the specific pixel arrangement without seeing it first, you have ceded authorship to the tool.
  *   **Why AI Sketches are Okay:** Preliminary sketches are low-stakes ideation. The school views this as "thinking," not "making." You are allowed to use a collaborator to think, but you must be the sole maker of the final object.
  *   **Why Painting Over AI is Okay:** If you paint over the AI pixels, you are re-establishing the chain of micro-decisions. You are saying, "The algorithm proposed this texture, but my hand decided to confirm, deny, or modify it." The human hand becomes the final filter.

  **The Core Commitment:** The school values **Craft as Cognition**. They believe that the act of manually resolving visual problems (how light hits a cheek, how fabric folds) *is* the thinking process. If you skip the manual resolution via AI, you haven't just skipped labor; you've skipped the cognitive work of understanding the visual world.

  ### 2. Tracing vs. Inpainting: Is it Consistent?
  On the surface, allowing tracing but banning raw AI pixels seems inconsistent. Both involve copying or generating imagery without drawing it from scratch. However, under **Embodied Intentionalism**, the distinction is consistent based on **Kinetic Causality**.

  *   **Tracing (Allowed):** When you trace a projected photo, the *contour* is dictated by the projector, but the **mark-making** is still kinetic. Your hand controls the pressure, the speed, the paint viscosity, and the brushstroke texture. The "surface quality" is human. You are still physically translating the image through your nervous system.
  *   **AI Inpainting (Banned):** When Midjourney generates pixels, it makes aesthetic decisions about texture, lighting, and brushwork that bypass your nervous system entirely. It is not just a guide (like the projector); it is an **agent**. It decides *how* the paint looks, not just *where* the line goes.

  **The Hidden Theory of Tool Transparency:**
  The school operates on a theory of **Tool Transparency**.
  *   **Transparent Tools:** A projector, a camera obscura, or Photoshop layers are "transparent." They amplify the hand's intent without adding their own aesthetic flavor.
  *   **Opaque/Agentive Tools:** Generative AI is "opaque." It adds aesthetic flavor (style, texture, lighting logic) that the user did not explicitly command.

  **Is it consistent?** Yes, but only if you accept the premise that **texture and surface execution are where authorship lives.** If you believe authorship lives in *composition* or *concept*, the policy is inconsistent (since AI does composition in the sketch phase). But since they penalize "pixel-level generation" in the final work, they are asserting that **execution is the site of truth.**

  ### 3. Is it "Vibes-Based"?
  It is not vibes-based, but it is **Lineage-Based**.
  This policy defends a specific lineage of art-making: **Modernist/Expressive Materialism.** This tradition holds that the "truth" of an artwork is found in the evidence of the human hand interacting with material.

  *   **The Gatekeeping:** It gates out **Post-Digital/Curatorial** art practices, where the artist's role is primarily selection, arrangement, and conceptual framing rather than manual fabrication.
  *   **The Coherence:** It is coherent *if* your goal is to train painters who understand material resolution. It is incoherent *if* your goal is to train visual communicators who solve problems by any means necessary.

  So, it's not random vibes; it's a defense of a specific definition of "Art" that prioritizes **manual agency** over **conceptual agency**.

  ### 4. Switching to an "Output-Based" Account of Authorship
  If the school replaced "Embodied Intentionalism" with a straightforward **Output-Based Account** (where authorship is defined by the successful realization of a vision, regardless of the mechanical process), the grading rubric would change drastically.

  **Current Rubric (Process-Based):**
  *   **Technical Proficiency:** Evidence of manual control over medium.
  *   **Authorial Presence:** Can the student explain every pixel's existence?
  *   **Process:** Documentation of manual iteration.

  **New Rubric (Output-Based/Curatorial):**
  *   **Cohesion of Vision:** Does the final image successfully communicate the intended concept, regardless of who/what made the pixels?
  *   **Intentional Selection:** Can the student justify *why* this specific generated output was chosen over 50 other variations? (Shifting authorship from *generation* to *curation*).
  *   **Contextual Integration:** How does the work sit within art history or cultural discourse? (Since the "craft" is no longer the differentiator, the "meaning" must carry more weight).
  *   **Prompt/Iteration Documentation:** Instead of sketchbooks showing hand-drawing, students would submit "prompt logs" showing how they refined the AI's output to match their mental model.

  **The Philosophical Shift:**
  *   **From:** "I made this because my hand moved here."
  *   **To:** "I made this because I decided this was the correct image."

  ### Summary
  The MFA program's policy is not hypocritical; it is **materialist**. It believes that art happens in the friction between the brain and the hand. Tracing is allowed because the hand is still friction-heavy (controlling the brush). AI is penalized because it removes the friction (the GPU does the resolving).

  If they switched to an output-based model, they would have to admit that **taste is a skill separate from craft.** Currently, they assume taste cannot exist without craft. An output-based rubric would assume taste can exist *independently* of craft, which would fundamentally alter how they define an "artist." They would stop grading "how well you painted" and start grading "how well you saw."
