answer: |-
  1. **Accuracy.** You are safe here. Your summary of the Doctrine of Double Effect (DDE) is functional for a non-technical audience. You aren't punching a strawman; the tension between "intended means" and "foreseen side effect" is exactly where the philosophical friction lives. However, you are skipping over the "closeness" problem you mentioned. Philosophers like Foot and Thomson argue that in the lever case, the death is *too closely connected* to the saving of the five to count as a mere side effect. Your essay implies the distinction is purely narrative; philosophers argue it's causal/metaphysical. You don't need to solve this, but acknowledge that philosophers think the "causal shape" is real, not just described. You are channeling Elizabeth Anscombe (*Intention*), who argued actions are intentional "under a description." You're applying this to the *narrator* rather than the *agent*. That's your innovation, but don't pretend Anscombe didn't lay the groundwork.

  2. **The load-bearing claim.** §3 is the danger zone. You are conflating *ontology* (what the intention actually was in Halvard's head) with *epistemology* (what the reader can know). Changing the narration does not change Halvard's intention; it changes the reader's *ascription* of intention. If you claim narration changes the moral reality of the act, philosophers will reject it. If you claim narration changes the *reader's judgment* of the act, novelists will applaud it. Your draft wobbles between these. In §3(b), you say readers "go back and say, no, he was a murderer all along." That confirms it's about ascription. Tighten this distinction. Your claim is defensible as narratology, not as metaphysics. Don't overreach.

  3. **Aspectual authority.** It is a fancy name for "narrative framing" or "unreliable narration," but that doesn't mean it's useless. It does real work *for you* because it gives you a technical handle on how moral judgment is manipulated in fiction. However, don't present it as a discovery about morality; present it as a discovery about *novels*. It's not that the signalman has moral authority; it's that he has *discursive* authority. The term is catchy, but ensure you don't treat it as a philosophical constant. It's a literary mechanic.

  4. **Strongest objection to §5.** The "True Believer" problem. Your test relies on the agent's hesitation or self-deception ("If he has to lie..."). But consider a religious extremist or a utilitarian fanatic who pushes the fat man off the bridge. They can look the victim in the eye and say, "I am killing you to save five," without self-deception, without lying, and without softening the verb. They own the intention. Your test would classify this clear case of *intended* death as permissible (or at least, not flagged as "intended" by your metric) because they *can* narrate it truthfully. The test measures *shame*, not *intention*. It fails where the agent is morally coherent but monstrous.

  5. **Direction for §6.** You mention offstage harm. Consider **reader complicity**. If narration launders intention, then the reader who accepts the narrator's description becomes an accomplice in the laundering. When you write "the lever went over" instead of "he killed Reuben," you are inviting the reader to bypass moral judgment. §6 could argue that the novel form itself is a machine for generating plausible deniability, and the writer is the engineer of that deniability. That's darker and more productive than just "offstage harm."

  **Writing Notes.**
  *   §2 is a bit dry compared to the rest. Tighten it.
  *   §5 logic is muddled. As noted in the objection, if the agent *can* use the verb, your test doesn't tell us if it's intended or foreseen. It only identifies *hidden* intention. Clarify the binary.
  *   The voice is strong. Keep the directness.

  \answer{REWORK}

  Bottom line: The literary insight is sharp, but you need to stop pretending it solves the philosophy and start owning that it exposes the machinery of fiction.
