  The claim that global workspace theory explains only access consciousness is ultimately a conceptual stance rather than an empirical finding, because overflow leaves the identity of broadcast and presence intact while hollow ignition would sever it despite being empirically undecidable. Overflow demonstrates that representational richness exceeds broadcast capacity, but this does not refute global workspace theory as an account of presence because the theory can consistently maintain that non-broadcast content lacks phenomenal presence entirely, relegating the excess richness to unconscious iconic memory rather than conscious experience. Global workspace theory posits that ignition is the necessary and sufficient condition for something it is like to exist, so evidence that unbroadcast content carries detail does not prove that unbroadcast content carries presence; it only proves that information processing is richer than reportable access, leaving the identity of broadcast and presence intact.

  Hollow ignition, by contrast, posits a state where the neural and behavioral markers of broadcast are fully intact while presence is absent, which directly contradicts the core assertion that ignition constitutes phenomenal experience. If a subject could exhibit ignition and accurate reporting without there being anything it is like for them, then broadcast would be merely correlated with consciousness rather than identical to it, reducing the theory to an account of access alone. However, hollow ignition cannot be empirically confirmed because every method available to detect presence in another subject—verbal report, deliberate action, and neural signatures of ignition—is itself a form of broadcast-access. We cannot probe for presence without engaging the very mechanism whose sufficiency is in doubt, creating a methodological circle where the absence of presence is invisible to the tools used to detect it.

  Consequently, the verdict that global workspace theory is solely a theory of access consciousness is not an empirical conclusion drawn from dissociation data, but a conceptual stance regarding the explanatory gap. Since overflow is compatible with broadcast-based presence and hollow ignition is empirically unverifiable, the distinction relies on philosophical skepticism about whether functional availability can ever constitute subjective feeling, making the claim a metaphysical interpretation rather than a scientific finding.
