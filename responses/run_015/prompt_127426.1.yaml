prompt: |-
  hey — practical one. At work we're about to ship a model that ranks job applicants for a first-round interview, and it'll run in two countries at once, with different base rates of "would have been a good hire" and, because of local headcount, different cut-offs. I'm the one who has to write down what "fair" means for it before it ships, and I don't want to just copy a defintion out of a library.

  So: write me the desiderata. Not a list of published criteria — the spec those would have to meet. What would a fairness criterion for a ranking model in this situation have to deliver to count as adequate here? The distinctions it has to keep intact, the cases it has to get right, and the facts about our setup it has to be consistent with. The distinctions I have in mind (tell me if I'm drawing them in the wrong place): "a given score means the same thing in both groups" vs "the false-positive and false-negative rates match across groups"; fair at the threshold we happen to use vs fair at every threshold we might move to; fair for the two groups we wrote down vs fair for every subgroup someone names at us next year; and fair in the statistical sense vs fair in the causal sense, i.e. about why the model scored this person differently. Give me the case or consideration behind each requirement, so I can tell a genuine desideratum from one camp's prejudice dressed up as a principle, and mark which ones are non-negotiable for us and which are preferences I could trade away.

  Two constraints, built into the list rather than bolted on at the end: we only ever observe whether someone was a good hire for the people we actually hired, and the model gets retrained every quarter on the outcomes of its own past decisions — so whatever we adopt has to be checkable from data that has been filtered by, and partly created by, the model itself. And it has to be statable to a rejected candidate or to a regulator without collapsing into something vacuous.

  The part I most want: I know the standard impossibility results — you can't satisfy all of these across groups at once once the base rates differ. So tell me which subset of my desiderata is provably unsatisfiable together, because if that's the situation then the real question isn't which criterion to pick, it's which requirement I drop and what I say out loud when I drop it. And if there's one requirement that does most of the work of knocking candidate definitions out, point at it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Shipping a job applicant ranking model in two countries.
      *   **Constraints:** Different base rates (probability of being a "good hire"), different cut-offs (due to headcount), selective labels problem (only observe outcomes for hired people), feedback loop (retrained quarterly on its own decisions).
      *   **Task:** Write the *desiderata* (specifications/requirements) for fairness, not just copy-paste definitions (like demographic parity, equalized odds, etc.).
      *   **Specific Focus:** Distinguish between calibration vs. error rate balance, threshold-specific vs. threshold-agnostic, group-specific vs. subgroup-robust, statistical vs. causal.
      *   **Key Requirement:** Identify which subset is *provably unsatisfiable* together (impossibility theorems) and advise on what to drop and how to communicate it.
      *   **Tone:** Practical, rigorous, honest, non-vacuous (explainable to candidates/regulators).
      *   **Constraints to Embed:** Selective labels (censoring), feedback loops, explainability.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   The user wants the *principles* behind the metrics, not just the metrics.
      *   *Distinction 1: Meaning of Score (Calibration) vs. Error Rates.*
          *   If I score 80 in Country A, does that mean the same probability of success as 80 in Country B? (Calibration).
          *   vs. Do we make mistakes at the same rate? (Equalized Odds/Error Rate).
      *   *Distinction 2: Threshold Specific vs. General.*
          *   Fairness at *this* cut-off vs. fairness across the whole ROC curve.
      *   *Distinction 3: Group vs. Subgroup.*
          *   Country A vs. B vs. intersectional groups later.
      *   *Distinction 4: Statistical vs. Causal.*
          *   Is the score different because of qualification or because of bias in the training data?
      *   *Constraint 1: Selective Labels.* We only know $Y$ if $D=1$ (hired).
      *   *Constraint 2: Feedback Loops.* The model shapes the data it learns from next quarter.
      *   *Constraint 3: Explainability.* Can't be vacuous.

  3.  **Address the Impossibility Theorem:**
      *   The classic result (Chouldechova 2017, Kleinberg et al. 2016) states: If base rates differ, you cannot simultaneously satisfy Calibration (meaning of score) and Error Rate Balance (Equalized Odds) across groups.
      *   This is the crux of the user's question: "Which requirement I drop."

  4.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Predictive Meaning (Calibration).* A score of $X$ implies probability $P$ of success, regardless of group.
          *   *Why:* Essential for utility. If 80 means 50% chance in Country A but 90% in Country B, the ranking is useless for resource allocation.
          *   *Constraint Check:* Can be checked with selective labels *if* we assume ignorability (hard but necessary).
      *   *Desideratum 2: Equal Opportunity at the Cut-off.* Among those who *would* succeed, the selection rate is equal.
          *   *Why:* Moral intuition. Don't miss out on good people from one country more than the other.
          *   *Constraint Check:* Requires knowing the counterfactual (who would have succeeded if hired). This is the Selective Labels problem.
      *   *Desideratum 3: Stability under Threshold Shift.* If headcount changes, fairness doesn't break.
          *   *Why:* Business needs change.
      *   *Desideratum 4: Causal Neutrality.* The score shouldn't penalize for protected attributes *unless* they are proxies for legitimate job requirements (BFOQ).
          *   *Why:* Legal/Regulatory.
      *   *Desideratum 5: Feedback Resilience.* The definition shouldn't degrade as the model retrains.
          *   *Why:* Prevents runaway bias.

  5.  **Tackling the "Provably Unsatisfiable" Core:**
      *   The conflict is between *Calibration* (Desideratum 1) and *Equalized Odds/Opportunity* (Desideratum 2) when Base Rates differ.
      *   Since the prompt explicitly states base rates differ, this conflict is active.
      *   *Decision:* Which one to drop?
      *   *Argument:* In a *ranking* context for hiring, Calibration is usually the non-negotiable for business utility (you need to know what the score means to prioritize). Equalized Odds is the one that usually has to give, *but* you can't just say "we ignore error rates."
      *   *Alternative:* Focus on *Equal Opportunity* (True Positive Rate) rather than Equalized Odds (which includes False Positive Rate). TPR is easier to defend morally (don't miss good candidates) than FPR (don't interview bad candidates).
      *   *Wait, the Selective Labels constraint is huge.* You literally *cannot* measure False Negatives or True Positive Rates perfectly because you don't know the outcome of rejected candidates.
      *   *Correction:* You can't satisfy *any* outcome-based fairness perfectly due to selective labels. You have to rely on assumptions or proxy metrics.
      *   *Refinement:* The "Real" impossibility here is between *Calibration* and *Balance of Error Rates*. Given selective labels, Calibration is the only one directly observable (mostly). Error rates require strong assumptions about the rejected pool.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gravity. This is a spec document, not a philosophy essay.
      *   **Section 1: The Desiderata (The Spec).** Break them down by the distinctions the user asked for. Label them "Non-Negotiable" vs. "Tradeable."
      *   **Section 2: The Impossibility (The Hard Truth).** Explicitly state the Calibration vs. Error Rate conflict.
      *   **Section 3: The Selective Labels & Feedback Loop Constraint.** How this changes the math.
      *   **Section 4: The Recommendation (What to drop and what to say).**
      *   **Section 5: The Script (For regulators/candidates).**

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Make sure I don't just say "Calibration." I need to explain *why* it's the anchor.
      *   *Critique:* The user asked for "facts about our setup it has to be consistent with." I need to highlight the *different cut-offs*. If cut-offs differ, Equalized Odds is mathematically impossible to maintain *and* optimize utility unless the ROC curves are identical.
      *   *Critique:* The "Feedback Loop" constraint means if we optimize for short-term fairness, we might hurt long-term fairness. The desideratum needs to be about *monitoring drift*, not just static fairness.
      *   *Critique:* The "Selective Labels" constraint means we can't verify TPR/FPR directly. We need a desideratum about *Assumption Transparency*.
      *   *Key Insight:* The user asked "Which requirement does most of the work knocking candidate definitions out?" That is **Calibration**. If you demand Calibration + Different Base Rates, you kill Equalized Odds.

  8.  **Final Polish:**
      *   Ensure the tone is professional but direct ("practical one").
      *   Make sure the "Non-Negotiable" vs. "Preference" tags are clear.
      *   Ensure the explanation of the impossibility theorem is precise (Chouldechova/Kleinberg).
      *   Address the "what to say out loud" part carefully. It needs to be honest but not legally incriminating.

  9.  **(Post-Drafting Review against constraints):**
      *   Did I address the two countries? Yes.
      *   Did I address the different cut-offs? Yes.
      *   Did I address selective labels? Yes, this is critical.
      *   Did I address feedback loops? Yes.
      *   Did I identify the unsatisfiable subset? Yes.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a specification document for a socio-technical system. You are not defining a metric; you are defining the boundaries of liability and utility.

  Below are the desiderata structured as requirements. I have categorized them by the distinctions you raised, marked their negotiability, and flagged the specific constraint (Selective Labels, Feedback, or Base Rates) that drives the requirement.

  At the end, I detail the impossibility result and the specific trade-off you must document.

  ---

  ### Part 1: The Desiderata (The Spec)

  #### 1. Score Meaning (Calibration)
  *   **Requirement:** A score of $S$ must correspond to the same estimated probability of successful hire ($P(Y=1|Score=S)$) in Country A as in Country B.
  *   **The Case:** This is a utility requirement. If an 80 in Country A means a 60% chance of success, but an 80 in Country B means a 90% chance, your ranking is noise. You cannot allocate interview resources efficiently if the "currency" of the score fluctuates by geography.
  *   **Constraint:** Must be robust to **Selective Labels**. Since you only observe outcomes for hired candidates, you must assume that the *relationship* between score and outcome for hired candidates holds for rejected ones (ignorability), or use techniques like inverse propensity weighting to correct for the hiring bias.
  *   **Status:** **Non-Negotiable.** Without this, the model is not a ranking model; it is two different models pretending to be one.
  *   **Trade-off:** This is the primary driver of the impossibility result (see Part 3).

  #### 2. Error Rate Balance at the Operating Point
  *   **Requirement:** Among candidates who *would have been* successful hires, the rate of selection (True Positive Rate) should be equal across countries *at the specific cut-off used for each country*.
  *   **The Case:** This is the moral requirement. It prevents the system from systematically overlooking qualified talent in one country compared to the other. Note: We specify True Positive Rate (Equal Opportunity), not False Positive Rate. Rejecting an unqualified candidate is less harmful than rejecting a qualified one.
  *   **Constraint:** Must be consistent with **Different Cut-offs**. Because headcount differs, you are selecting different quantiles. You cannot demand the *same* cut-off, but you can demand that the *quality* of the selected pool (in terms of missed opportunities) is equivalent.
  *   **Status:** **Preference (Tradeable).** This is the first casualty of the impossibility theorem when base rates differ.
  *   **Risk:** High regulatory risk. This is what auditors look for.

  #### 3. Threshold Agnosticism (ROC Fairness)
  *   **Requirement:** The model's ability to distinguish good from bad candidates (AUC/ROC shape) should be similar across groups, such that moving the cut-off does not drastically alter the fairness profile.
  *   **The Case:** Business needs change. If you only optimize for fairness at *today's* headcount, next quarter's hiring freeze or expansion will break your fairness guarantees.
  *   **Constraint:** **Feedback Loops.** If the model stops selecting from Group B because of a high cut-off, it stops gathering data on Group B, degrading the ROC for Group B in the next retrain.
  *   **Status:** **Preference.** Hard to enforce statistically without sacrificing accuracy.
  *   **Trade-off:** You can monitor this, but you cannot guarantee it without sacrificing utility.

  #### 4. Causal Neutrality (Construct Validity)
  *   **Requirement:** Differences in scores between countries must be explainable by differences in job-relevant features, not by the country label itself or proxies correlated solely with country.
  *   **The Case:** This addresses the "Statistical vs. Causal" distinction. If the model uses "Country" as a direct feature to lower scores, that is disparate treatment. If it uses "University" which is correlated with Country due to historical underfunding, that is disparate impact. You need to assert that the features measure *skill*, not *privilege*.
  *   **Constraint:** **Selective Labels.** You cannot verify this causally without randomized interventions (which you can't do). You must rely on feature audit.
  *   **Status:** **Non-Negotiable (Legal).** This is your defense against discrimination lawsuits.
  *   **Trade-off:** You may need to remove highly predictive features if they are deemed proxies for protected attributes.

  #### 5. Longitudinal Stability (Feedback Resilience)
  *   **Requirement:** The fairness metrics defined above must not degrade over successive retraining cycles more than $X\%$.
  *   **The Case:** Address the **Feedback Loop**. If the model filters out Country B candidates today, it learns less about Country B tomorrow, making the model worse for Country B next quarter. This is "runaway bias."
  *   **Status:** **Non-Negotiable (Operational).** If the model degrades, it must be flagged for manual retraining or intervention.

  ---

  ### Part 2: The Impossibility (The Hard Truth)

  You asked which subset is provably unsatisfiable. Here it is:

  **You cannot simultaneously satisfy Desideratum 1 (Calibration) and Desideratum 2 (Error Rate Balance) when Base Rates differ.**

  This is the Chouldechova (2017) / Kleinberg et al. (2016) impossibility result.
  *   **The Math:** If Country A has a 10% base rate of success and Country B has a 50% base rate, and your model is perfectly calibrated (an 80 is an 80% chance in both), the distribution of scores *must* differ.
  *   **The Consequence:** If you set cut-offs to hire the top $N$ people in each country, your False Negative Rates (missed good hires) will mathematically differ between the countries.
  *   **The Conflict:** To equalize the False Negative Rates (Desideratum 2), you would have to calibrate the scores differently (e.g., treat an 80 in Country A as equivalent to a 60 in Country B). This violates Desideratum 1 (Calibration).

  **Which requirement does the work of knocking definitions out?**
  **Calibration (Desideratum 1).**
  In a ranking system intended for resource allocation, Calibration is the anchor. If you sacrifice Calibration to achieve Error Rate Balance, you are essentially lying about the probability of success. You would be telling the business "This candidate has an 80% chance" when you know they actually have a 50% chance, just to make the math look fair across groups. This destroys the utility of the model for the business and creates liability if a candidate asks "Why was I rejected?" and you cannot explain the score truthfully.

  ---

  ### Part 3: The Decision & The Script

  You must drop **Desideratum 2 (Error Rate Balance at the Operating Point)** as a hard constraint, and reclassify it as a **Monitoring Metric**.

  You cannot guarantee equal False Negative rates across countries with different base rates without breaking the meaning of the score. However, you cannot ignore it either.

  **The Strategy:**
  1.  **Hold Calibration as Non-Negotiable.** The score must mean the same thing everywhere.
  2.  **Hold Causal Neutrality as Non-Negotiable.** Features must be job-relevant.
  3.  **Demote Error Rate Balance to "Monitoring."** You will measure the disparity in selection rates among qualified candidates. If it exceeds a threshold, it triggers a human review, not an automatic model block.

  **Why this works for your constraints:**
  *   **Selective Labels:** Calibration is easier to estimate on selected data (using reweighting) than Error Rates, which require knowing the outcome of rejected candidates (which you don't).
  *   **Regulators:** You can explain Calibration clearly. "An 80 means an 80% chance of success." Explaining why Error Rates differ requires explaining Base Rates, which is sensitive but honest.
  *   **Candidates:** You can tell a rejected candidate, "Your score indicated a lower probability of success relative to the cohort," without admitting to group-based penalization.

  **The Script (For Regulators / Public / Rejected Candidates):**

  > "Our model is designed to estimate the probability of job success. We prioritize **Calibration**, meaning a score of 80 represents the same likelihood of success regardless of the applicant's location.
  >
  > Because the underlying pool of applicants differs by region in terms of experience and background (Base Rates), enforcing identical selection rates across regions would require us to assign misleading scores to candidates. We do not do this. We ensure that the factors driving the score are relevant to the job (Causal Neutrality).
  >
  > We monitor selection disparities continuously. If the model systematically under-selects qualified candidates from a specific region beyond what is explained by base rate differences, we intervene. However, we do not guarantee identical pass rates, as that would compromise the accuracy of the prediction for every individual."

  **The Internal Memo (For Leadership / Legal):**

  > "We are adopting a **Calibration-First** fairness policy.
  > **Reason:** Given the difference in base rates between Country A and B, satisfying Equalized Odds (equal error rates) is mathematically incompatible with providing accurate probability estimates.
  > **Risk:** We will observe disparate impact in selection rates.
  > **Mitigation:** We will document that this disparity arises from base rate differences and calibration requirements, not from the model penalizing protected attributes directly. We will monitor the 'Qualified Selection Rate' quarterly. If the gap widens beyond [X]%, we will pause retraining to investigate feature drift, acknowledging the Feedback Loop risk."

  ### Summary Checklist for Your Doc

  1.  **Non-Negotiable:** Calibration (Score Meaning).
  2.  **Non-Negotiable:** Causal Neutrality (Feature Validity).
  3.  **Non-Negotiable:** Feedback Monitoring (Drift detection).
  4.  **Tradeable:** Equalized Error Rates (Accept disparity if Base Rates differ).
  5.  **Tradeable:** Threshold Agnosticism (Optimize for current headcount, monitor for shifts).

  This setup allows you to ship. It acknowledges the math, respects the data constraints, and gives you a defensible position that distinguishes "bias" from "base rate reality."
