  ## Appendix A: The Vexil Code (For Packets)

  **The Symbols:** `Δ` (Triangle), `O` (Circle), `—` (Bar), `::` (Colon)
  **The Sample Text:** `Δ — O :: O — Δ`

  **The 10 Rules:**
  1.  `Δ` always precedes `O` unless separated by `::`.
  2.  `—` indicates a directional flow from left to right.
  3.  `::` indicates a pause of null value.
  4.  If `O` follows `Δ` without `—`, the relation is negated.
  5.  `Δ` cannot terminate a sequence.
  6.  `O` may terminate a sequence only if preceded by `—`.
  7.  `::` resets the count of preceding symbols.
  8.  No symbol may appear more than twice in a single clause.
  9.  `—` cannot connect `::` to `Δ`.
  10. The sequence is closed if `Δ` appears at the end.

  *(Note: The rules are logically consistent but semantically empty.)*

