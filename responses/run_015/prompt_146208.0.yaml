  ## Appendix B: Facilitator Guide for Failure Modes

  **Failure Mode 1: Resistance in Phase 2 (The "Rebellion")**
  *   **Prediction:** Interpreters will claim the constraints are "stupid" or "impossible" and refuse to speak, or will intentionally break rules to provoke you.
  *   **Instruction:** Do not defend the rules. Do not get angry.
  *   **Script:** "The frustration you are feeling is the data. If you cannot speak without using aesthetic language, note that silence in the log. The constraint is the lesson."
  *   **Why:** This resistance *is* the feeling of structural risk. It proves the dependency on vague language.

  **Failure Mode 2: Phase 3 Feels Forced (The "Fake Synthesis")**
  *   **Prediction:** Students will complain that mapping Vexil to Tenure Policy is arbitrary and meaningless.
  *   **Instruction:** Validate the feeling.
  *   **Script:** "Whitehead acknowledges this risk. If Precision is not fully mastered, Generalization *will* feel forced. You are experiencing the difficulty of weaving the dead bone back into living flesh. Keep trying to find one connection that actually illuminates the Policy."
  *   **Why:** This prevents the activity from collapsing into cynicism and frames the difficulty as part of the philosophical point.

  **Failure Mode 3: Witnesses Disengage**
  *   **Prediction:** The 6 Witnesses may feel like second-class citizens.
  *   **Instruction:** Empower them as "Auditors of Affect."
  *   **Script:** "Your job is more important than theirs. They are experiencing the phenomenon; you are recording the evidence. Without your logs, we cannot prove the 'death' occurred."
  *   **Why:** Gives the Observers a critical epistemic role.

  ---

  ## Facilitator Note on the "Half Group" Constraint
  *This design strictly adheres to the instruction to split the group (6 Interpreters / 6 Witnesses) to create a power dynamic that heightens the "risk" for the Interpreters. However, to ensure the **entire seminar** benefits from the debrief, Phase 3 pairs them up. This ensures that while the *structural risk* was borne by the Interpreters, the *resolution* is shared. If you feel the Witnesses are too disengaged during Phase 2, allow them to submit written "Intervention Notes" that the Interpreters must read but cannot act upon, heightening the pressure without breaking the constraint.*
