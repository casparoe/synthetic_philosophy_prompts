  **Project Title: Generations as Administrative, Causal, and Interactive Kinds**

  The debate over whether generations are real has settled into an unsatisfying stalemate. Skeptics deploy the variance argument: within-cohort dispersion swamps between-cohort differences; birth-year boundaries are arbitrary and commercially motivated; measured traits are confounded with age and period effects; and attributed characteristics are merely recurrent stereotypes about juniors. Defenders concede the crudity of popular schemes but insist on shared formative exposure to macro-historical events. My proposal argues that both sides are arguing about the wrong unit. A generation may be at least three different things: an administrative partition of a birth-year continuum; a kind constituted by shared causal exposure to macro-events during a developmental window; or an interactive kind, whose members partly become the way they are because the label is applied and institutions take it up. The variance argument is devastating against the first, largely irrelevant to the third, and effective against the second only if that kind is required to deliver sharp boundaries and causal homogeneity, which it arguably need not.

  The central research question is determinate: Which of these three ontologies supports causal projectibility, and does the identification problem reflect statistical limitation or ontological entanglement? Existing positions leave this open because they assume a single ontological category is at stake. Skeptics defeat the administrative partition; defenders secure the causal kind only by ignoring the interactive dimension. A straight verdict on realism fails because it demands a binary answer to a pluralistic question. Better statistics cannot resolve ontological category errors, as no amount of regression adjustment can clarify whether the kind exists independently of the classification. Conceptual analysis alone ignores the causal mechanisms required for projectibility. This project employs social metaphysics to map the causal structures underlying generational talk, satisfying both metaphysical rigor and sociological relevance. It avoids the trap of ordinary usage studies, which track language rather than causal power, and sidesteps the impossibility of solving the age-period-cohort identification problem through statistics alone. For the sociologist on the committee, this offers a mechanism for how labels become self-fulfilling; for the metaphysicians, it clarifies the conditions under which social kinds acquire causal powers.

  The paper will proceed in five sections. First, I will reconstruct the variance argument to show it devastates administrative partitions but leaves interactive kinds untouched. Second, I will delineate the three ontologies, drawing on literature on natural and social kinds. Third, I will investigate the age-period-cohort identification problem. I will ask whether the collinearity of age, period, and cohort is merely evidential or whether, for formative-exposure kinds, causal pathways are metaphysically entangled with maturational effects. Fourth, I will develop the notion of registration: generational kinds become projectible when institutions sort by label, allocating opportunities that produce the very differences cited as evidence. This yields a checkable consequence regarding the temporal order of labels and differences. Fifth, I will offer a qualified verdict on realism.

  The eight-week timeline is structured for drafting and refinement. Weeks 1-2: Comprehensive literature review focusing on the variance argument and interactive kind literature. Sharpening the threefold distinction to ensure conceptual clarity. Weeks 3-4: Drafting sections on the variance argument and ontological typology. Ensuring the argument is legible to both metaphysicians and sociologists. Weeks 5-6: Developing the registration argument and analyzing the APC entanglement hypothesis. This is the core theoretical innovation. Weeks 7-8: Full draft completion, revision for the fall workshop, and formatting. Peer feedback will be sought during week 7.

  Success consists of producing an 8,000-word paper that establishes the threefold distinction as the primary contribution, even if the ontological verdict remains thin. The project succeeds if it demonstrates that interactive kinds are causally projectible via institutional registration. Failure would occur if the threefold distinction collapses into semantic variation without causal purchase, or if the APC entanglement hypothesis proves indefensible against standard statistical interpretations. There is a risk that the normative implications regarding distributive justice overwhelm the metaphysical analysis. Given the eight-week constraint, if the APC metaphysical claim becomes too technical, it will be cut to preserve space for the registration argument, which offers clearer empirical traction. The normative coda will be excluded from the main metaphysical argument to maintain focus on ontology. Scope creep is most likely in the APC section; if the metaphysical interpretation of collinearity becomes too speculative, I will revert to treating it as an evidential limitation to ensure the paper remains grounded.

  ***

  **Advice on Framing Decision**

  Regarding the normative coda: **Make it a separate paper.**

  Your primary goal here is to settle the ontological status of generations. If you argue that interactive kinds are real because institutions make them so, you open the door to the claim that invoking generations in distributive justice arguments (pensions, climate) may manufacture the inequalities they claim to rectify. This is a powerful critical point, but it shifts the register from metaphysics to political philosophy.

  Including it as a concluding section risks two problems. First, it dilutes the metaphysical contribution; the committee wants to know if generations *exist*, not primarily how we should treat them. Second, it invites objections that are outside the scope of your ontological framework (e.g., arguments about fairness that hold regardless of ontological status). By spinning this off as a separate paper—perhaps titled "The Ethics of Generational Registration"—you preserve the purity of the metaphysical argument for the workshop while creating a second publication outlet that leverages the first paper's findings.

  ***

  **Evaluation of Hunches**

  Both hunches survive scrutiny and are included in the proposal, but with caveats.

  1.  **APC as Metaphysical:** This is the riskier hunch. Standard social science treats the Age-Period-Cohort identification problem as a statistical nuisance (collinearity). Framing it as ontological entanglement is bold and appeals to the metaphysicians, but may alienate the sociologist if presented as a dismissal of statistical methods. I have framed it in the proposal as an *investigation* ("I will ask whether...") rather than a settled claim. This protects you if the argument proves too difficult to sustain in eight weeks.
  2.  **Registration:** This hunch is robust. It aligns with established literature on interactive kinds (e.g., Hacking) and provides a concrete mechanism for your "interactive kind" category. It is retained as a central pillar of the argument because it offers the "checkable consequence" that makes the metaphysics empirically relevant.
