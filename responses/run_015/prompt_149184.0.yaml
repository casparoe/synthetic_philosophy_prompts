  I was discussing collective-action failures with a study group after a lecture on rational choice, and we kept circling back to the unilateralist's curse in its most tired forms—thermostats turned up, bystanders all dialling emergency services—without ever feeling we had pinned down exactly which feature makes the reasoning genuinely unilateral rather than merely competitive. To test my own understanding, I would like you to construct a precisely engineered thought experiment that relocates the curse into an informational domain where the collective harm is subtle rather than noisy.

