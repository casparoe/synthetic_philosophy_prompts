answer: |-
  The marker squeaked as Meg capped it, leaving a half-finished equation hovering between them on the whiteboard. The draft recommendation for the health authority was crumpled on the table. They had been circling the same drain for an hour.

  "Okay," Meg said, turning back to the board. "Stop trying to write the policy. Write the disagreement. State the theorem. Properly."

  She wrote: *vNM axioms + Ex Ante Pareto → Social Welfare = Σ w_i E[u_i]*.

  "Harsanyi's aggregation theorem," Meg said. "If social preferences over lotteries satisfy von Neumann–Morgenstern rationality, and if we respect Ex Ante Pareto—meaning if every individual prefers prospect P to Q based on their own expected utility, society must rank P above Q—then social welfare is a weighted sum of individual expected utilities. The impartial observer device fixes the weights as equal. It delivers utilitarianism."

  Avi leaned against the desk, arms crossed. "It delivers a weighted sum, yes. But the theorem doesn't deliver the weights, and it doesn't fix the zero points. Each individual utility function $u_i$ is unique only up to positive affine transformation. You can scale them however you like. To sum them, you need unit comparability. The theorem assumes you can compare gains across persons, but it doesn't justify it."

  "The impartial observer does," Meg countered. "Imagine you have an equal chance of being anyone. You have one utility function over being person $i$ at welfare level $x$. That constructs a common scale."

  "That's where you beg the question," Avi said, stepping to the board. He drew a arrow from 'Impartial Observer' to 'Ex Ante Pareto'. "For the observer's preferences to track each person's own attitudes under uncertainty, you need to assume the observer respects Ex Ante Pareto. You're using the conclusion to justify the scaling convention. It's a consistency argument, not a foundation. You haven't solved the comparability problem; you've just hidden it inside the identity lottery."

  "Let's test it," Meg said, erasing the algebra to make room for the case. "Ten thousand people. Fixed population. Option Flat: everyone gets 1 unit for sure. Option Spread: independent fair coin per person, heads 3, tails 0. Option Big Flip: one coin for everyone, heads all 3, tails all 0. Everyone is risk-neutral over their own welfare. Ex ante, everyone prefers Spread and Big Flip (expected utility 1.5) to Flat (expected utility 1). Ex Ante Pareto says society must prefer them too."

  "But look at what happens in Spread," Avi said, tapping the board. "Once the coins land, the risk washes out. With ten thousand people, you get roughly 5,000 people at 3 and 5,000 at 0. Total welfare is 15,000. Flat is 10,000 total. But in Spread, half the population gets nothing. In Flat, everyone gets something. The disagreement isn't about risk anymore; the uncertainty is gone. You're using Ex Ante Pareto to override the realized distribution."

  "The theorem doesn't distinguish between Spread and Big Flip," Meg said. "It's one uniform argument about preferences over lotteries. If you respect individual rationality ex ante, you must respect the sum of expectations."

  "That's exactly the problem," Avi said. "In Spread, the risk-and-uncertainty framing is idle. What's being tested is ex ante unanimity against a near-certain distribution. A principle that recommends Spread over Flat when there's no uncertainty left to appeal to isn't Pareto in any ordinary sense. It's privileging the hypothetical preference over the actual outcome."

  "Okay, but you're not rejecting expected utility entirely," Meg said, turning to face him. "You're team ex-post prioritarian. You rank state-contingent outcomes by taking the expectation of your ex-post social welfare: $E[\sum f(u_i)]$. You're linear in probabilities over states of nature. You satisfy independence over the coin flips. So your objection can't just be 'I reject vNM'."

  "Right," Avi said. "I accept linearity over states. My rejection is linearity over identities. I apply a concave transformation $f$ to utilities within each state. The concavity lives inside the distribution, not over the probabilities."

  "Then admit what that costs you," Meg said. "In Big Flip, you are risk-averse at the population level. Utilitarianism is indifferent between Flat (10,000 total) and Big Flip (expected 15,000 total). But you might prefer Flat to Big Flip because $f(1) > 0.5 f(3) + 0.5 f(0)$. You're claiming to be neutral about probabilities, but you're treating aggregate social risk as something to be avoided."

  "I am avoiding it," Avi said. "Because the moral value of benefits diminishes. Getting 3 units when you have nothing isn't three times as good as getting 1 unit. Avoiding the state where everyone gets 0 matters more than gaining the state where everyone gets 3."

  "Where does $f$ come from?" Meg asked. "And where is the zero point? If you shift the zero point of the utility scale, your concavity changes. If 0 is starvation and 3 is luxury, $f$ looks one way. If 0 is mild discomfort and 3 is bliss, it looks another. You need level comparability to make that claim. Unit comparability isn't enough."

  Avi paused, marker hovering. "The priority view is a substantive claim about the diminishing moral value of benefits to better-off people. It's not a fact about attitudes to risk. It's a claim about the good."

  "But without fixed levels, 'better-off' is undefined," Meg said. "You're hostage to the same scaling issue I am, but you claim you need more information than the theorem provides. I claim Ex Ante Pareto forbids using that extra information. You claim Ex Ante Pareto is too weak."

  "Ex Ante Pareto is too strong," Avi corrected. "It forces us to ignore distribution once the coins land. In Spread, you're saying the 5,000 who get 0 should be glad they had a chance, even though they actually got nothing. I'm saying the actual outcome matters."

  "And I'm saying if you override their ex ante preferences, you're treating them as means to a distributional end," Meg said. "You're saying their risk-neutral choices were wrong because you know better what matters."

  "I'm saying their risk-neutral choices reflect prudence, not morality," Avi said. "Prudence says take the higher expected welfare. Morality says care more about the worse off. The theorem conflates the two."

  They stood in silence for a moment, looking at the board. The equations were clean, but the gap between them was wide.

  "Where does this bottom out?" Meg asked.

  Avi capped his marker. "It bottoms out on whether Ex Ante Pareto is a constraint on morality or just on rationality. I think it's a constraint on rationality for individuals, but not for society. You think society is just the individuals aggregated."

  "And you?" Meg asked.

  "I think the disagreement bottoms out on informational basis," Meg said. "You think we have access to interpersonal level comparability and should use it to weight the worse off more heavily. I think we don't have that access, so we're stuck with expectations and equal weights. But I'll concede this: if you can fix the zero point independently of preferences, your view isn't just risk aversion. It's a different theory of value."

  "And I'll concede," Avi said, "that if Ex Ante Pareto is absolute, your view wins. But that's a big 'if'. It assumes the only thing that matters is what people want before the fact, not what happens to them after."

  "Is there an empirical question here?" Meg asked. "Or is it purely conceptual?"

  "Conceptual," Avi said. "It's about whether the timing of the evaluation—before or after the coins land—changes the moral truth. The theorem can't settle that because it assumes the answer in the premises."

  "Then we can't write the recommendation," Meg said.

  "No," Avi said. "But at least we know why."
