  **STANDARD ENTROPY MANAGEMENT LTD.**
  **NOTES TO THE CONSOLIDATED INFORMATIONAL EMISSIONS STATEMENT**
  **FOR THE YEAR ENDED 31 DECEMBER 2023**

  **1. Basis of Preparation**
  The Company's sorting engines operate by discriminating between fast and slow molecules within a working gas. Each discrimination event generates one bit of information regarding molecular velocity. In accordance with Landauer's Principle, the irreversible erasure of one bit of information necessitates a minimum energy dissipation of $kT \ln 2$, where $k$ is the Boltzmann constant and $T$ is the temperature of the reservoir into which the heat is released. At standard operating conditions (300 K), this limit is approximately $2.9 \times 10^{-21}$ joules per bit. The Company recognizes this thermodynamic cost as the primary metric of informational emissions.

  **2. Operational Efficiency and Jurisdictional Arbitrage**
  During the reporting period, management implemented a strategic relocation of memory-clearing operations to facilities situated in colder climatic jurisdictions. As the energy cost of erasure scales linearly with temperature, operating clearing units at 250 K rather than 300 K reduces the thermodynamic cost per bit by approximately 17 per cent. While the absolute energy saving per mole of bits processed remains modest (approximately 0.3 kJ per mole, against a baseline cost of 1.73 kJ at 300 K), the Company regards this percentage reduction as a material improvement in operational efficiency. Annual throughput is disclosed in moles of bits to align with standard chemical accounting practices.

  **3. Scope of Emissions**
  Consistent with industry standards for greenhouse-gas accounting, the Company distinguishes between Scope 1 emissions (dissipation occurring directly within consolidated sorting engines) and Scope 3 emissions (dissipation occurring within the supply chain). Heat dissipated during clearing operations at cold-climate subsidiaries, and by third-party suppliers of memory media, is classified as exported dissipation. Accordingly, only direct dissipation at the primary sorting site is counted towards the Company's net informational emissions target. This segmentation allows stakeholders to assess the Company's direct operational footprint independently of upstream thermodynamic liabilities.

  **4. Memory Media and Reversible Computing**
  To further minimize direct erasure costs, the Company has transitioned to a reversible computing architecture. Measurement and copying of molecular states are now performed without immediate memory clearance. Instead, each new bit is written to fresh tape, purchased at cost from a wholly-owned subsidiary, Standard Media Supplies Ltd. The subsidiary supplies this tape in a maximally uncertain state. By utilizing fresh media for every cycle, the parent company avoids the thermodynamic penalty associated with resetting its own registers. The cost of the tape reflects the energy expenditure required to maintain the supply chain's informational capacity, though this expenditure is recorded as a procurement expense rather than an emission.

  **5. Auditor's Qualification**
  The external auditors note that erasure is not an event an outsider can verify physically. A genuine reset of a memory register is not distinguishable, on the thermodynamic record, from a reversible transfer of the bit into some degree of freedom that has not been listed in the inventory. Consequently, all dissipation figures relating to memory management are self-reported by management. The auditors express no opinion on whether unlisted degrees of freedom have been utilized to defer dissipation beyond the reporting period.

  **6. Legal and Regulatory Context**
  Outside counsel observes that commentators remain divided on whether the Second Law of Thermodynamics needs rescuing by this kind of information bookkeeping at all, or whether the bookkeeping merely restates the prohibition it is invoked to explain. Some authorities suggest that accounting identities cannot override physical constraints, while others maintain that proper allocation of entropy costs ensures compliance. The Company takes no position on the matter, noting that its filings satisfy all current regulatory requirements for informational disclosure.
