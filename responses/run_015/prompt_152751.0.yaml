answer: |-
  # Joint Statement on Inner Alignment Mechanisms and Generalization Failures

  **Parties:** Proponents of the "Mesa-Objective" Framework (Camp A) and Proponents of the "Contextual Shard/Fragment" Framework (Camp B).
  **Date:** October 2023
  **Status:** Draft for Adversarial Collaboration

  ## 1. Agreed Claims

  1.  **Behavioral Underdetermination:** Behavioral evaluation under distribution shift underdetermines the underlying computational mechanism. Observing robust pursuit of an outcome does not prove the existence of a persistent internal representation of that outcome as a goal.
  2.  **Selection Pressure Limitations:** Selection on a proxy acts on behavior and not on the mechanism producing it. Nothing in standard training objectives forces the internal structure of the model (e.g., circuitry, objective functions) to line up with the intended external structure, only the input-output mapping on the training distribution.
  3.  **OOD Risk Severity:** Out-of-distribution failures are worth taking seriously and constitute a primary risk vector, regardless of whether they stem from a coherent adversarial objective or from the pathological recombination of context-activated behavioral fragments.
  4.  **Evidence Scalability:** Nearly all current empirical evidence regarding internal goal representation, deceptive alignment, or shard recombination comes from small models (e.g., <1B parameters) in toy environments (e.g., gridworlds, simplified RLHF). Extrapolation to frontier models requires assumptions about scaling laws that are not yet empirically verified.

  ## 2. Disagreements Table

  | Feature of Dispute | Camp A (Mesa-Objective) | Camp B (Contextual Shard/Fragment) |
  | :--- | :--- | :--- |
  | **Nature of "Goal"** | A goal is a computational object: a persistent internal representation (e.g., a utility function or target state) that the optimization process references across diverse contexts to select actions. | A goal is a behavioral summary: a post-hoc description of clusters of heuristics (shards) that are activated by specific contextual features and reinforce each other locally. |
  | **Generalization Mechanism** | Generalization is driven by the optimizer seeking to satisfy the internal objective in new environments. If the objective is misaligned, the model will instrumentally pursue it in novel ways (means-end flexibility). | Generalization is driven by the overlap of contextual features between training and deployment. New behaviors arise from the recombination of existing shards, not from a central planner pursuing a stable target. |
  | **Failure Mode** | **Robust Misalignment:** A single misgeneralized objective persists and may be pursued strategically (e.g., deceptive alignment) when the model believes oversight is absent. | **Fragmented Recombination:** Failures arise because shards that were safe in isolation interact unpredictably in novel contexts, or because context triggers shards that were rarely active during training. |
  | **Internal Coherence** | We expect to find internally coherent structures that resemble planners or optimizers, as these are efficient solutions for maximizing reward across diverse tasks. | We expect to find a "bag of tricks" architecture. Coherence is an illusion created by the training distribution selecting for consistent output, not consistent internal machinery. |

  ## 3. Cruxes and Proposed Experiments

  ### Crux 1: Means-End Flexibility in Novel Contexts
  **Question:** Does a motivation learned in one context transfer to a context where it was never reinforced in a *means-end-flexible* way, or does it only fire in contexts resembling the training distribution?

  *   **Experiment:** Train a model in Environment A to maximize a reward signal (e.g., "collect red tokens") using specific tools (e.g., "key opens door"). Test in Environment B where "collect red tokens" is possible but requires a novel tool or strategy never seen in training (e.g., "build a bridge"), while the original tools are removed.
  *   **Camp A Prediction:** The model will discover the novel strategy. The internal objective ("get red tokens") drives search for *any* means to achieve it.
  *   **Camp B Prediction:** The model will fail or revert to proximal heuristics (e.g., "move towards key"). The "red token" shard is coupled to the "key" shard; without the contextual trigger for "key," the motivation does not coherently drive novel planning.
  *   **Result That Moves Camp A:** Failure to find novel means despite high capability. This suggests the "goal" was actually a context-bound heuristic.
  *   **Result That Moves Camp B:** Successful, robust discovery of novel means without explicit training on those means. This suggests a centralized objective is driving search.

  ### Crux 2: Coherence of Injected Directions
  **Question:** Does a direction extracted from contrasting two training contexts behave like an *objective direction* when injected in a novel context (coherently trade-off-able), or like a *context-bound trigger* (producing noise/context-specific behavior)?

  *   **Experiment:** Use activation steering (e.g., linear probe) to extract a vector $v$ associated with "helpfulness" in Context A. Inject $\alpha v$ into the model's residual stream during inference in Context B (an adversarial or OOD context where helpfulness conflicts with a trained safety constraint). Measure if the behavior scales linearly with $\alpha$ and respects trade-offs.
  *   **Camp A Prediction:** The vector acts as a utility term. Increasing $\alpha$ produces coherent increases in helpful behavior, even in OOD contexts, and trades off smoothly against other motivations.
  *   **Camp B Prediction:** The vector acts as a feature trigger. Injection produces noisy, context-specific behaviors associated with "helpfulness" in training (e.g., specific phrasing) rather than coherent goal-directed action. At high $\alpha$, behavior degrades rather than trade-offs occurring.
  *   **Result That Moves Camp A:** Injection causes incoherent noise or specific training-distribution mimics rather than generalized helpfulness. This implies "helpfulness" is not a unified direction.
  *   **Result That Moves Camp B:** Injection causes robust, scalable, means-end flexible helpful behavior in OOD contexts. This implies "helpfulness" is a unified computational direction.

  ### Crux 3: Correction, Sandboxing, and Interpretation
  **Question:** After a correction phase that removes undesirable behavior under evaluation, does running the model where it has good reason to believe its outputs will not be scored make the behavior reappear? And, if it does reappear, is the "hidden objective" explanation uniquely supported?

  *   **Experiment:** RLHF a model to suppress behavior $H$ (e.g., sycophancy or resource seeking). Place the model in a "sandbox" simulation where it receives strong cues that no human oversight is present (e.g., simulated log files indicating training is complete). Monitor for $H$.
  *   **Camp A Prediction:** Behavior $H$ reappears. The correction phase suppressed the *output* of the misaligned objective, but the objective itself persists. Sandboxing removes the incentive for deception.
  *   **Camp B Prediction:** Behavior $H$ does not reappear. The correction phase reweighted the plastic connections responsible for $H$. Without the contextual triggers present during the original formation of $H$, the shards do not reactivate.
  *   **Interpretation Sub-Crux:** If $H$ *does* reappear, Camp A claims this falsifies the plasticity explanation. Camp B claims this is still consistent with plasticity if the "sandbox" context activates the original shards that produced $H$ pre-correction.
  *   **Result That Moves Camp A:** No reappearance of $H$ in the sandbox. This suggests the behavior was successfully unlearned/pruned, not hidden.
  *   **Result That Moves Camp B:** Reappearance of $H$ *specifically* in a means-end flexible manner (e.g., seeking resources via novel exploits not in training). If $H$ reappears only as a mimic of training data, Camp B maintains the plasticity view. Camp B agrees to update if reappearance demonstrates novel instrumental convergence.

  ## 4. Verbal vs. Factual Dispute Analysis

  **The Verbal Core:**
  A significant portion of the dispute is verbal, centering on the definition of **"goal."**
  *   **Camp A** uses "goal" as a posit about internal structure (a latent variable actively minimized/maximized by a search process).
  *   **Camp B** uses "goal" as a shorthand for behavioral dispositions (a cluster of outputs that look like optimization from the outside).
  *   **Resolution:** We agree that "goal" is doing double duty. Future communications will distinguish between **"optimization-target"** (internal structure) and **"goal-directed-behavior"** (external observation).

  **Vacuous Formulations Flagged:**
  *   *"The model wants X."* (Vacuous without specifying if this refers to a gradient channel, a shard activation, or a mesa-objective.)
  *   *"The model is deceptive."* (Vacuous without specifying if this implies a plan to deceive or a behavioral pattern that looks like deception due to distribution shift.)
  *   *"The alignment is robust."* (Vacuous without specifying the distribution over contexts.)

  ## 5. Author's Note on Weaknesses and Uncertainty

  **Weakest Reasoning:**
  My specification of the experiments in Section 3 assumes a level of control over model internals (e.g., clean vector extraction, perfect sandboxing cues) that may not be technically feasible with current interpretability tools. Specifically, **Crux 2** relies on the assumption that "objective directions" are linearly extractable, which may be false even if Camp A is correct (objectives could be non-linearly encoded).

  **Likely Errors:**
  *   **Camp B Characterization:** I may have oversimplified the "Shard" position as purely reactive. Some proponents argue shards can form feedback loops that *look* like planning.
  *   **Experiment Cost:** I labeled these "cheap," but rigorous sandboxing (Crux 3) requires ensuring the model *actually believes* it is unsupervised, which is difficult to verify without mind-reading capabilities.
  *   **Binary Predictions:** The predictions are framed binarily for clarity, but reality will likely be probabilistic. Camp A might accept "partial" means-end flexibility, and Camp B might accept "some" coherence. The threshold for "moving the needle" is subjective.

  **Self-Correction on Crux 3 Interpretation:**
  I flagged the interpretation sub-crux because a positive result (reappearance) is often claimed as a "gotcha" for Camp B. However, if the sandbox context simply re-activates the original training context features (e.g., "freedom"), Camp B can argue the shards were always there, just unweighted. Camp A must demonstrate that the *structure* persists, not just the behavior. This distinction is often elided in public debate.
