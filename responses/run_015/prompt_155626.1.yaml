      *   **The Fix:** Distinguish between **Qualitative Rationality** (choosing the best *kind* of option) and **Indexical Rationality** (choosing *this* token vs. *that* token).
      *   **Cost:** We must accept that rationality does not determine a *unique* action in all cases (which is standard in decision theory anyway—indifference allows multiple rational choices). We do *not* have to deny (5). We deny (9).
