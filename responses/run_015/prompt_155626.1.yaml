      *   *Better Attack:* Even if duplicates exist, the *reason* for choosing the duplicate set over a third option remains non-arbitrary.
      *   *Focus on Step (9):* This is the "All or Nothing" fallacy. Just because the last step is arbitrary doesn't mean the previous 99 steps were.
      *   *Focus on Step (8):* "Rational selection requires arbitrary tie-breaking at every decision node." This implies the tie-breaking is the *defining feature* of the node. But usually, the node is defined by the *filtering* process.
