  ### Context and slogan

  The slogan "Gödel proves the mind isn't a computer" functions as a philosophical shorthand that obscures distinct logical claims. It conflates the mathematical limitations of fixed formal axiomatic systems with empirical hypotheses about cognitive architecture. Without disambiguation, it risks treating a theorem about arithmetic truth as a direct proof against neural networks or probabilistic models. We must separate the logical core of the Lucas-Penrose argument from broader intuitions about creativity and consistency to assess its actual threat to mechanist accounts of cognition.

  ### Menu of five readings

  (a) **Specific System Refutation:** For any *given* consistent system F claimed to model a mind, the human constructs G(F) and sees its truth. **Status:** Substantive and defensible within anti-mechanism, but trivial regarding universal claims. It proves humans aren't identical to *that* F, but not that no F exists (the mind could be an unknowable system). **Threat:** Targets classical formalist models where code is transparent. It does not rule out complex neural networks whose weights are unknowable to the user, leaving connectionist models largely untouched by this specific reading.

  (b) **Universal Anti-Mechanism:** No consistent formal system *whatsoever* captures all human mathematical knowledge. **Status:** Substantive and defensible within anti-mechanism, but contingent on human consistency. If human reasoning is inherently inconsistent, the premise fails. **Threat:** Threatens all computable models, including connectionist ones formalized as functions, provided they aim for universal mathematical competence. This is the core Lucas-Penrose claim, but it relies on the controversial assumption that human mathematical output is consistent.

  (c) **Non-Computational Faculty:** Recognizing Gödel truths requires a capacity (e.g., rational intuition of consistency) distinct from algorithmic processing. **Status:** Substantive and defensible within anti-mechanism, but metaphysically costly. Assumes physical brains cannot simulate this intuition. **Threat:** Threatens physicalist computationalism specifically, not abstract functionalism, by positing a non-physical cognitive faculty. It implies cognition transcends physical causation, making it incompatible with standard neuroscience and any model relying on physical implementation.

  (d) **Novelty/Problem-Solving:** Gödel entails computers cannot solve open problems or generate novel mathematics. **Status:** False or incoherent confusion of theorems. This conflates incompleteness with uncomputability or lack of creativity. Computers can solve undecidable sentences relative to weaker systems. **Threat:** Threatens nothing; based on a category error regarding 'open problems' versus formal undecidability. It misreads logical limits as performance limits, confusing provability with discoverability, and applies incorrectly to both classical and modern architectures.

  (e) **Probabilistic/Inconsistent Systems:** The argument applies even if the system is stochastic or allows minor inconsistencies. **Status:** False or incoherent application of consistency conditions. Gödel's construction strictly requires consistency. If minds or LLMs are probabilistic or occasionally inconsistent, the diagonalization loses its force. **Threat:** This reading actually undermines the anti-mechanist case regarding modern architectures, as it misapplies the theorem's conditions to systems it does not govern. It fails to address probabilistic Turing machines or stochastic gradient descent models.

  ### What the LLM debate requires

  To block the possibility that an LLM could reproduce human-like mathematical reasoning, your interlocutor cannot rely on readings (d) or (e). Reading (d) is simply false regarding novelty, and (e) is incoherent because LLMs are inherently probabilistic architectures to which strict Gödelian consistency constraints do not neatly apply. Reading (a) is too weak; showing an LLM fails against *one* Gödel sentence does not prove it cannot replicate human judgment generally.

  To succeed, she must commit to reading (b) or (c). Specifically, she requires the Universal Anti-Mechanism claim: that no computable function, regardless of complexity, captures human mathematical competence. However, this depends entirely on the controversial premise that human mathematicians are themselves consistent. If humans are fallible or inconsistent, the Gödelian advantage vanishes, as an inconsistent system proves everything, including Gödel sentences. Furthermore, she must argue that the LLM's probabilistic outputs don't merely approximate human inconsistency but fail to capture the *insight* required in (c). The strongest version required is that human insight into truth is non-algorithmic (c), not just that current models are incomplete (a). Without establishing human consistency and non-computational intuition, the argument reduces to a claim about current engineering limits rather than a principled impossibility. Additionally, she must address whether the LLM's internal state is knowable; if the network is opaque, the Gödel sentence cannot be constructed, neutralizing the Lucas-Penrose move entirely.

  ### Questions for the group

  To expose which thesis she is running, ask these three precise, non-rhetorical questions:

  1. **The Consistency Premise:** "Does your argument presuppose that human mathematical reasoning is perfectly consistent? If humans are occasionally inconsistent, does the Gödelian advantage over formal systems disappear?"
  2. **The Architecture Constraint:** "Gödel's theorem applies to consistent formal systems. Do you claim it also applies to probabilistic architectures like LLMs, which produce stochastic outputs rather than deterministic proofs?"
  3. **The Knowability Condition:** "The Lucas-Penrose argument requires constructing a Gödel sentence for the system. If the 'computer' is a neural network with opaque weights, can we still construct this sentence, or does the argument only refute transparent formalisms?"
