          2.  Correspondence Table.
          3.  Points of Collapse (The "Leaks" in the analogy).
          4.  Verdict on "Shortsightedness" (Ergodicity argument).
          5.  Alternative Analogy (Evolutionary/Population).
      *   *Refining the "Shortsightedness" argument:* Need to be careful. Arithmetic EV isn't *inherently* shortsighted, it's *ensemble* focused. Geometric is *time* focused. The "shortsighted" label is a rhetorical move based on the assumption that time averages matter more than ensemble averages for a single agent.
      *   *Refining Bankruptcy:* In the engine analogy, you stop. In reality, you might die. The irreversibility is key. Kelly prevents ruin *asymptotically*.
      *   *Refining Utility:* Log-wealth implies log-utility. But why log-utility? Bernoulli argued for diminishing marginal utility. Kelly argues for growth rate. They converge, but the justification differs.

  7.  **Final Polish:** Check against all constraints in the prompt.
      *   Correspondence table included? Yes.
