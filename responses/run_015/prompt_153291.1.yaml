      *   Alternative analogy? Yes (Evolutionary/Population).

  8.  *(Self-Correction during drafting)*: Make sure to distinguish between "Arithmetic Rationality" (maximizing $E[X]$) and "Linear Utility." One can maximize Arithmetic EV with non-linear utility, but the critique usually targets maximizing $E[\text{Wealth}]$ which implies linear utility. I need to be precise that the critique is about maximizing *Wealth* arithmetically vs *Log-Wealth* geometrically.

