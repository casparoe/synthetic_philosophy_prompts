      *Ergodicity:* This is the modern formalization (Peters et al.). I must mention that the "shortsighted" claim is actually an "ergodicity error."

      *Alternative:* Evolutionary is strong. A species that maximizes average offspring per generation but risks extinction loses to a species that maximizes geometric growth of the population.

  9.  **Final Review of the Output:** Ensure the distinction between "undermining" and "non-undermining" disanalogies is clear.
      *   *Undermining:* Finite horizon (if I die tomorrow, Kelly is wrong), Utility saturation (if I only need \$1M, Kelly is wrong).
      *   *Non-undermining:* Engine refueling (external income doesn't break Kelly, just modifies the bankroll), Destination (undefined destination actually supports Kelly).

