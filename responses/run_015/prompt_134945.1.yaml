      *   *Mira's Agency:* This is essentially the List & Pettit argument. I should note it's a established theoretical position, not necessarily her original contribution, but she applies it well.

  6.  **Final Polish:** Ensure the distinction between the *Doctrinal Paradox* (standard version) and this specific *Discursive Dilemma* variation is clear. In the standard paradox, everyone accepts P1 & P2 -> C, but the majority pattern creates inconsistency. Here, the majority *rejects* the entailment. This makes Mira's position even harder to defend. I must highlight this.

