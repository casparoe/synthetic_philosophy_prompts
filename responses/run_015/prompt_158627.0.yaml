answer: |-
  **Project Title:** The Metrology of Decline: Disaggregating the Question of Political Violence

  **Project Description**

  The contemporary debate over whether political violence is declining appears to be an empirical dispute regarding the direction of a single quantity. In reality, it is a metrological dispute regarding which quantity ought to be tracked. Proponents of decline and their skeptics frequently agree on the raw events but diverge on incidence variables, denominators, and severity weightings. Each side reports their specific measure's trend as if it settled the general question. This chapter argues that violence is a "patchwork" concept: determinate at the level of fine-grained, homogeneous sub-kinds (e.g., intentional one-on-one killing of adults by strangers), but indeterminate at the aggregate level where weighting stipulations are required. The appearance of a single empirical controversy is produced by sliding between these levels.

  **Research Question**

  The chapter poses a tripartite question to separate the tangled threads of the debate. First, the *factual* question: On a fixed, well-specified measure, what is the trend? Second, the *normative* question: Which measure should carry the argumentative weight for a given purpose? Third, the *metaphysical* question: Is there, independently of any stipulation, a fact of the matter about the trend in "violence as such"? The core hypothesis is that the factual question is answerable within sub-kinds, the normative question is resolvable only by linking measures to specific purposes, and the metaphysical question is false: there is no measure-independent fact of the matter for the aggregate.

  **Limitations of Existing Approaches**

  Current approaches fail because they attempt to solve a structural problem with either more data or sharper definitions. Accumulating better data will not settle the dispute because the available parameters pull trends in different directions. For example, a constant annual per-capita homicide rate is compatible with rising lifetime risk when life expectancy rises, and with falling per-stranger-encounter risk when the density of anonymous contact grows. Similarly, realized harm can fall while coercive capacity rises if private violence is displaced by policing and incarceration. More careful conceptual analysis also fails because stipulative definitions cannot resolve the weighting problem. Defining violence to include structural harm does not tell us how to weight a hour of imprisonment against a physical assault. Both approaches miss the underlying measurement-theoretic structure: some concepts support determinate trend claims because their instances are homogeneous enough to be summed on a single scale, whereas others are index concepts where a trend claim is only determinate once a weighting is stipulated.

  **Methodology**

  Over nine months, I will employ a measurement-theoretic and purpose-relative method. I will construct a formal apparatus specifying a family of measures via three parameters: an incidence variable (realized events, victim-hours, or ex ante risk), a denominator (population-year, person-lifetime, or per social encounter), and a severity weighting. I will then map the leading purposes for which violence-trend claims are made—forecasting, assigning institutional blame, comparing eras, or estimating moral urgency—onto the measures those purposes actually require.

  This mapping allows me to re-describe the disagreement not as a conflict about the world, but as a conflict between purposes. If the purpose is forecasting, ex ante risk measures may be privileged; if the purpose is moral urgency, victim-hours may dominate. By demonstrating that specific purposes logically entail specific parameter choices, I can show that the "empirical" disagreement dissolves once the purpose is made explicit.

  **Candidate Conclusions**

  I will evaluate three candidate conclusions. The *Unitarian view* holds there is one fact of the matter about the direction of violence, and we are currently unsure of it. The *Conventionalist view* holds there is no such fact beyond stipulated weights. The *Patchwork view* (my working hypothesis) holds that determinacy holds within homogeneous sub-kinds and fails for the aggregate. I will discriminate among these by testing whether the purpose-relative mapping yields a stable consensus on measures within specific domains. If purposes cluster consistently around specific measures for specific sub-kinds, the Patchwork view is supported. If purposes remain fragmented even within sub-kinds, Conventionalism is more likely. If one measure consistently predicts outcomes across all purposes, Unitarianism survives.

  **Failure Conditions and Scope**

  This project fails if the purpose-relative mapping turns out not to discriminate between measures at all (i.e., if every purpose is compatible with every measure), or if the supposed "homogeneous sub-kinds" turn out to be measurement-dependent themselves. To ensure completion within nine months, I will defer historical case studies and limit the formal apparatus to three canonical parameter sets. I will not attempt to resolve the normative question of which purpose *ought* to be primary, but only to show that the empirical question cannot be answered without selecting one.

  **Deliverable**

  The chapter will conclude with a usable "Claim Audit Template." This tool will allow any scholar or policymaker making a violence-trend claim to explicitly state their incidence variable, denominator, severity weights, and purpose. By separating the empirical content of their claim from the stipulative content, the template renders the disagreement tractable. It transforms a stalemate about whether the world is getting better into a precise debate about which metrics matter for our specific political ends.
