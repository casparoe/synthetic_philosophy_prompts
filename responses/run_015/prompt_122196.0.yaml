answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Regional Cooperative-Housing Authority
  **FROM:** Allocation Committee Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Recommendation: Eligibility Protocol for Tranche 4 Affordable Units

  ### Executive Summary

  This memo recommends the **Conditional Adoption** of the proposed Modified Veil-of-Ignorance (MVoI) protocol utilizing the *maximin* criterion for the allocation of the new permanently affordable units. 

  While the ethical framework of the MVoI aligns closely with our mission to prioritize the most vulnerable, the Board must acknowledge valid concerns regarding our Charter's transparency and anti-paternalism clauses. Consequently, adoption is recommended only under strict conditions requiring algorithmic auditability, post-allocation impact disclosures, and a community-derived definition of "worst-off" profiles. This approach balances the moral imperative to protect the disadvantaged with the procedural legitimacy required to maintain public trust.

  ### Background

  The Authority faces a surplus of demand for the new tranche of permanently affordable units. To mitigate bias and structural inequity, the Allocation Committee proposed an MVoI protocol. Under this system, applicant data is anonymized into profiles. A committee assigns units based on a *maximin* rule, seeking to maximize the prospects of the worst-off profile without knowing the specific identity of the applicant.

  Two primary objections have arisen:
  1.  **Charter Compliance (Faction A):** The protocol violates transparency and anti-paternalism clauses by obscuring the link between individual applicants and outcomes.
  2.  **Criterion Selection (Faction B):** The *maximin* rule is too risk-averse; an *expected-welfare* rule weighting profiles by the probability of genuine disadvantage would yield better aggregate outcomes.

  ### Analysis of Charter Objections: Transparency and Paternalism

  The objection that MVoI violates our Charter cannot be dismissed as mere resistance to change. It rests on a substantive claim: that legitimacy in public housing allocation derives from the applicant's ability to understand *why* a decision was made about *them*.

  **Transparency on Its Own Terms**
  The Charter requires that applicants understand the rules of allocation. The MVoI protocol inherently creates an epistemic gap: an applicant knows their own data, but not how that data was transformed into an anonymized profile, nor which profile was ranked lower. If an applicant cannot trace the causal link between their submission and the rejection, procedural justice is compromised.

  However, transparency need not be binary (full individual disclosure vs. total opacity). We can satisfy the Charter through **Algorithmic Transparency**. While we cannot reveal which specific profile belonged to which applicant during the deliberation (to maintain the veil), we can publish the mapping function *ex-ante* and the decision log *ex-post*. 
  *   *Condition 1:* The weighting formula converting raw data to profiles must be public.
  *   *Condition 2:* A redacted log showing which profile types were selected and why must be released post-allocation.

  **Anti-Paternalism**
  The anti-paternalism clause guards against the Board imposing a conception of "good" upon residents without their input. The *maximin* rule assumes the Board can correctly identify the "worst-off" profile. If the Board defines "worst-off" solely by income, it may ignore disability costs or local displacement risks, thereby imposing a paternalistic view of need.
  *   *Condition 3:* The variables defining the "worst-off" profile must be ratified by a resident advisory council, ensuring the definition of disadvantage is community-derived rather than administrator-imposed.

  ### Defense of Maximin in Probabilistic Assignment

  Faction B argues that because this allocation is probabilistic (a lottery-style assignment among eligible profiles) rather than a long-term contractual guarantee, we should maximize *expected welfare* rather than applying Rawls' *maximin* rule. They argue that weighting profiles by the probability of genuine disadvantage allows us to help more households overall, even if the single worst-off household is not guaranteed a unit.

  This argument is economically sound for policy design but ethically insufficient for **scarce essential goods**. 

  1.  **The Stakes of the Outcome:** While the *assignment mechanism* is probabilistic, the *outcome* (permanent housing) is foundational. For a household on the brink of homelessness, a 90% chance of housing under an expected-welfare rule is less valuable than a 100% guarantee under *maximin* if the alternative under expected-welfare is a 0% chance due to statistical trade-offs. When the baseline is existential security, risk aversion is rational.
  2.  **The Veil's Function:** The Veil of Ignorance is typically used for constitutional design, not individual allocation. However, in this context, it serves to prevent the Board from making ad-hoc exceptions for "sympathetic" cases that may not be the most structurally disadvantaged. *Maximin* ensures that the "floor" is raised first. In a housing crisis, raising the floor is a higher moral priority than raising the average ceiling.
  3.  **Probabilistic Fairness:** Under an expected-welfare rule, a profile with a 60% probability of being "disadvantaged" might beat a profile with a 100% probability of being "critically disadvantaged" if the former represents a larger aggregate group. *Maximin* prevents the dilution of urgent need by probable need.

  ### Assessment of the Strongest Opposing Argument

  The strongest argument against this recommendation comes from **Faction A (Charter Compliance/Rejection)**. 

  **The Argument:** Public trust in cooperative housing relies on the perception that the process is meritocratic and understandable. By anonymizing data and utilizing a "black box" deliberation process (even with published algorithms), we sever the narrative connection between the applicant and the outcome. If an applicant is rejected, they cannot appeal the *application* of the rule to their specific case because the rule was applied to a *profile*, not a person. This creates a "legitimacy deficit." If the community perceives the process as opaque, they may view the allocations as arbitrary, leading to litigation, political backlash, and a erosion of the cooperative ethos that sustains the Authority.

  **Candid Assessment:** This argument is compelling. Procedural justice literature suggests that people accept unfavorable outcomes better when they understand the process. The MVoI protocol inherently limits this understanding. If we proceed, we risk a crisis of confidence. However, rejection carries its own risk: maintaining the status quo allocation method, which historical data shows disproportionately favors applicants with higher social capital and better access to bureaucratic navigation. The choice is between *perceived* fairness (transparency) and *structural* fairness (equity). The Board's fiduciary duty to the mission of affordable housing suggests we must prioritize structural fairness, provided we mitigate the trust risk through the conditions outlined above.

  ### Recommendation and Implementation Timeline

  The Board should vote to **Conditionally Adopt** the MVoI protocol with the *maximin* criterion, subject to the transparency and community-ratification safeguards detailed below.

  **Implementation Timeline (6-Month Rollout)**

  *   **Month 1: Rule Finalization & Community Ratification**
      *   Draft the profile-creation algorithm.
      *   Convene Resident Advisory Council to ratify the definition of "worst-off" variables (satisfying Anti-Paternalism Condition).
      *   Publish the algorithm publicly.

  *   **Month 2: Third-Party Audit Setup**
      *   Contract an independent auditor to verify that the anonymization process prevents re-identification and that the *maximin* rule is applied strictly to profiles.

  *   **Month 3: Application Window**
      *   Accept applications. Data is immediately hashed and anonymized by a third-party data trust, not Authority staff.

  *   **Month 4: Allocation Committee Deliberation**
      *   Committee reviews profiles only. *Maximin* selection performed.
      *   Auditor observes and certifies the process.

  *   **Month 5: Notification & Disclosure**
      *   Applicants notified of status.
      *   **Transparency Release:** Authority publishes a report detailing which profile types were selected and the marginal profile that was excluded, allowing applicants to self-assess where they likely fell in the distribution (satisfying Transparency Condition).

  *   **Month 6: Review & Appeal Window**
      *   30-day window for applicants to request a review of their data *input* (not the profile ranking), ensuring data accuracy without breaching the veil.

  ### Conclusion

  The Modified Veil-of-Ignorance protocol represents a significant evolution in how we operationalize equity. It moves us from reactive bias-checking to proactive structural fairness. While the risks to transparency are real, they are manageable through rigorous algorithmic disclosure and community oversight. The Board is urged to approve the Conditional Adoption plan to ensure Tranche 4 serves those for whom housing is not just an asset, but a lifeline.

  **Action Required:** Vote on Resolution 23-44 (Conditional Adoption of MVoI Protocol).
