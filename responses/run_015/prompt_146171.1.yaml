answer: |-
  The analogy between biological evolution and cultural change is seductive because it promises a unified theory of complexity. If culture evolves like biology, then the same mathematical tools that explain the eye can explain the sonnet. However, this analogy relies on a structural isomorphism that does not exist. The claim that cultural transmission is Darwinian rests on the existence of discrete replicators subject to blind variation and selective retention. I argue that this model collapses when confronted with the mechanics of human learning. Cultural transmission is not the copying of discrete units subject to random error; it is the reconstructive inference of underlying systems subject to directed modification. Consequently, cultural evolution is structurally Lamarckian: acquired characteristics are inherited, variation is guided by utility rather than chance, and the resulting "adaptations" reflect design logic rather than selective filtering.

  To see why the Darwinian framework fails, we must examine the mechanism of transmission. In biological evolution, the genotype is copied with high chemical fidelity. Mutations occur, but they are stochastic errors in the copying process; they are random with respect to the organism's needs. In cultural transmission, there is no chemical copying of information. When a novice learns to speak a language or knap a flint tool, they do not copy a discrete string of data from the teacher. They observe sparse, noisy outputs and use innate cognitive machinery to reverse-engineer the underlying generative rules.

  This process is reconstructive, not replicative. The learner does not store the specific utterances they hear; they infer the grammar that produced them. They do not memorize the exact angle of a tool strike; they infer the physics of fracture. Because the transmission relies on inference, the "fidelity" of the tradition is not maintained by the stability of the unit (the meme), but by the stability of the human cognitive architecture doing the reconstructing. This breaks the first requirement of Darwinism: the existence of a discrete replicator that persists independently of the vehicle. In culture, the "vehicle" (the human mind) actively rebuilds the "replicator" every generation.

  A common defense of the Darwinian view is to redefine the meme. Proponents argue that memes should not be understood as the specific content (the specific sentence spoken), but as the *instructions for reconstruction* (the algorithm in the brain). If the meme is the instruction set, they argue, then it is a discrete unit that replicates.

  This move saves the terminology but sacrifices the mechanism. Even if we define the meme as the instructional algorithm, the variation introduced during transmission is not random. In biology, the Weismann barrier prevents somatic experiences from altering the germline. A bodybuilder's muscles do not alter their sperm's DNA. In culture, this barrier is nonexistent. The "somatic" experience of the learner—their struggles, insights, and intentional improvements during the reconstruction phase—directly alters the instructions they pass on. If I learn to build a spear and realize a heavier tip flies truer, that acquired modification becomes part of the instructional package I transmit to my apprentice. The "instruction" is not a static code; it is a living hypothesis that is updated by the phenotype's interaction with the world. This is the definition of Lamarckian inheritance: the inheritance of acquired characteristics.

  This leads to the second critical distinction: the nature of variation. A staunch Darwinian might concede that cultural changes are directed but argue that intentional improvement is simply a "biased mutation." They claim that as long as there is variation and selection, the system is Darwinian, regardless of where the variation comes from.

  This objection empties the term "Darwinian" of its explanatory power. The core insight of Darwinism is the *blindness* of variation. Natural selection is creative precisely because it sifts through random noise to find the rare improvement. If variation is directed toward utility, the creative burden shifts from the selection process to the variation process. When a human modifies a tool because they understand *why* the old tool failed, they are not generating random variants for selection to test; they are engineering a solution.

  To call this a "mutation" is a category error. A mutation is a deviation from a norm; an improvement is a correction toward a goal. In a Darwinian system, the environment selects the fit. In a Lamarckian cultural system, the human mind anticipates the environment and pre-selects the fit before transmission occurs. The "selection" happens internally, via reasoning and experimentation, before the trait is ever passed on. Therefore, the primary engine of cultural change is not the differential survival of variants, but the guided generation of variants.

  Why does this distinction matter? It matters for how we interpret cultural "adaptations." In biology, an adaptation is a trait that exists because it enhanced reproductive fitness in the past. It is a backward-looking explanation. If we apply this to culture, we are forced to ask: "What selective pressure caused this ritual to survive?" This often leads to functionalist just-so stories, assuming that because a tradition persists, it must benefit the group's survival.

  If we recognize culture as Lamarckian, we see that cultural traits persist not because they enhance biological fitness, but because they satisfy human intentions. A cultural trait can spread *despite* being biologically maladaptive (e.g., celibacy, birth control, or dangerous rites of passage) because it serves a conceptual, social, or aesthetic goal valued by the agents. The "adaptation" is not to the ecological environment, but to the cognitive and social environment of the learners.

  Furthermore, recognizing the Lamarckian structure explains the rapid pace of cultural change. Biological evolution is slow because it must wait for random mutations to align with environmental needs. Cultural evolution is fast because the variation is pre-aligned by intelligence. We do not wait for a random mutation to invent the wheel; we reason our way to it. If we treat this as Darwinian, we obscure the role of agency. We treat humans as passive hosts for competing memes, rather than active engineers of their own inheritance.

  Ultimately, the Darwinian metaphor fails because it attempts to explain a process driven by meaning using a framework designed for processes devoid of meaning. Genes do not care if they survive; memes, insofar as they exist, are carried by minds that care deeply about utility, truth, and beauty. When a learner reconstructs a skill and improves it, they are inheriting the past and editing it for the future. This is not the blind sifting of replicators. It is the accumulation of wisdom. To call this Darwinian is to mistake the architecture of a library for the mechanics of a forest. Culture evolves, but it evolves through the inheritance of acquired insights, making it fundamentally Lamarckian.
