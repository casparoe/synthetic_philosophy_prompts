answer: |-
  Good evening. Looking around this room, I see the whole city Marta helped speak for. We have the gilder and the pinstriper, the stone carver and the shop owners. We have her husband, her daughters, her grandchildren, and the friends who watched her build a life out of paint and light. We are here to honor forty-four years of work, but I want to talk for a moment about what that work actually was.

  Consider the municipal trucks. You know the ones: heavy, white, always parked slightly wrong on a Tuesday morning. Marta cut the stencils for those herself. Think of the lowercase *a* on the door. It is a double-storey form, but look closely at the top of the bowl. There is a bridge of metal running across the open space. In the physical stencil, that bridge is necessary; without it, the top part of the letter would fall out of the frame. It is a requirement of the tool, not the alphabet. When the paint goes on, that bridge remains as a bare strip of metal, a gap in the letter. By any strict measure of shape, the circle is broken. The form is incomplete.

  Yet, every person in this city reads it instantly. No one pauses to solve a puzzle. No one sees a broken circle and a stem; everyone sees an *a*. Why? It is not because the paint matches a perfect model stored in the sky. It is because Marta knew exactly how much breakage our eyes could repair. She understood that a letter is not a thing you make; it is a signal you send. She knew that the shape on the door is only half of the equation. The other half is the person walking by who knows, without thinking, how to close that gap.

  This was her genius. She did not spend her life chasing a perfect shape that exists in isolation. There is no such shape. Instead, she mastered the space between the brush and the eye. She knew that a letter becomes itself only when it is recognized. When she painted a sign for a bakery or a funeral home, she was not carving truths into wood or glass. She was building a bridge between a mark and a meaning that we already carry around with us. She trusted us to meet her there.

  To her daughters and grandchildren: this is what made her superb. Her skill was not locked inside the cans of paint or the brushes she washed every night. It was not stored safely in the objects she left behind, waiting to be admired in a museum. Her achievement is alive because you are alive. She gave you a city that speaks clearly. She taught the storefronts how to introduce themselves. When you walk down the street and read her work without effort, you are not just seeing her labor; you are completing it. You are the other half of the craft.

  The shop closes at the end of the month. The tools will be put away. But the work does not end here. It cannot end here, because the work was never just the paint. The work is the reading. As long as we walk these streets and let these marks tell us where to buy bread, where to seek comfort, and where to drive safely, Marta is still working. We are the custodians now. We hold the system that gives her marks their life. If we keep reading, she keeps writing.

  So, I ask you to look at the person standing next to you. They are the reason her letters are letters. They are the reason the city makes sense. Let us promise to keep paying attention, to keep reading the world she helped name, and to keep the signal clear.

  Please raise your glasses. To Marta, who knew what we needed to see, and to us, for knowing how to look.
