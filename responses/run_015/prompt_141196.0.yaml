  This joke works from your coarse-grained perdurantist view, where temporal parts are bounded by consciousness rather than instants. The punchline lands on your suspicion that both major theories deflate change into static property distributions, a problem exacerbated here by suggesting that sleep doesn't just pause existence but ends it entirely.
