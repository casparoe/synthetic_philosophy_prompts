  *(Self-Correction on Ranking)*: Actually, the "Self-Deceived Achiever" is a specific instance of the "Subjectivism/Intuition" clash. The "Unfalsifiability" is a meta-theoretical critique. I will rank the Intuitive Counterexamples (Self-Deceived Achiever) as Fatal because meaning theories live or die by reflective equilibrium with intuitions. Unfalsifiability is a close second. The Psychological one is Severe but maybe not Fatal if one accepts meaning can be tragic.

