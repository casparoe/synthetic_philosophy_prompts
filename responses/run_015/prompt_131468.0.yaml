      *   Closing encouragement.

      *(Self-Correction on Q8)*: Make sure this is the punchiest part. This is what they really want. The "Nod Along" error is the *Is-Ought* problem disguised. They derive a rule for prediction (ought) from a assumption about causality (is) which is only known via prediction (ought).

