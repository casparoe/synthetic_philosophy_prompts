      *   Private signal? Individual financial assessment/trust.
      *   Where logic applies? Ignoring signal after queue threshold.
      *   Where breaks? Payoff interdependence.
      *   Info externality vs Coordination? Both, but coordination dominates.
      *   Test against ending? Guarantee changes payoffs, not info. Shows BHW limitation.

