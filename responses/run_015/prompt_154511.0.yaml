      *   *Instruction:* "Give me a range [Low, High]. If the actual time is in your range, you win chocolate. If it's outside, you do the forfeit. BUT, the narrower the range, the more chocolate."
      *   *Refinement for the prompt:* "Score it with something that rewards honest distributions."
