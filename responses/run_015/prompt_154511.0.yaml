      *   *Reference Class B (Broad):* "General adults, puzzle tasks." (Median: 8 mins, includes kids/experts).
      *   *Flagged Cards:* "Warned Group." (These should be faster, but maybe not as fast as they thought, or maybe they overcorrected).
      *   *Distribution:* Needs to be skewed right (log-normal) to mimic real task times.

  4.  **Design the Scoring Rule:**

      *   Need to reward honest distributions.
      *   *Brier Score* is for binary.
      *   *Logarithmic Scoring Rule* is complex.
      *   *Simplified:* **The "Range Capture" Game.**
      *   *Mechanism:* Groups submit a 50% Confidence Interval (CI). If the true time falls in it, they get 10 points. If not, 0. But they lose points for width.
