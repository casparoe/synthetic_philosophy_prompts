answer: |-
  # Workshop Activity: The Forecasting Trap
  **Target:** First-year PhD Cohort (n=18)
  **Time:** 75 Minutes
  **Goal:** Experiential learning of Inside vs. Outside View forecasting without initial jargon.

  ## 1. Materials List
  You need to carry this in a standard laptop bag.

  *   **5 Tangram Sets:** Wooden or plastic 7-piece puzzles. (Cheap online, ~$5 each).
  *   **5 "Forecasting Sheets":** Printed A4 paper with two sections (Round 1 & Round 2) and a "Meta-Prediction" box.
  *   **5 "Probability Token" Sheets:** Printed A4 with a histogram (5 buckets: 0–5m, 5–10m, 10–15m, 15–20m, 20m+).
  *   **50 Small Counters:** Poker chips, colored beads, or even cut-up paper squares (10 per group).
  *   **The "History Deck":** 25 printed cards (index card size). See *Preparation* below.
  *   **Timer:** Your phone or watch (students have no phones).
  *   **Prizes:** Chocolate bars.
  *   **Forfeit:** A printed "I underestimated reality" hat or sign.

  ## 2. Preparation: The History Deck
  You must fabricate the historical data. This is the engine of the lesson. Create 25 cards. Each card displays a **Task Time** (how long a previous group took to solve the Tangram square) and a **Tag**.

  *   **Set A (Broad Class):** 10 cards. Tag: *"General Adult Pool"*.
      *   Times: 5, 6, 7, 7, 8, 9, 10, 12, 15, 20.
      *   *Median:* ~8.5 mins.
      *   *Narrative:* People who just grabbed a puzzle and did it.
  *   **Set B (Narrow Class):** 10 cards. Tag: *"Grad Students (Unwarned)"*.
      *   Times: 10, 12, 13, 14, 15, 15, 16, 18, 20, 20 (Capped).
      *   *Median:* 15 mins.
      *   *Narrative:* People like them, who overthought the geometry.
  *   **Set C (Warned Class):** 5 cards. Tag: *"Grad Students (Warned)"*.
      *   Times: 11, 12, 13, 14, 19.
      *   *Median:* 13 mins.
      *   *Narrative:* People like them, who were told "don't be optimistic" before starting.

  **Crucial Detail:** The "Warned" median (13) is *better* than Unwarned (15), but *worse* than General Adults (8.5). This creates the tension: Does the warning help, or does being a PhD student hurt more than the warning helps?

  ## 3. Minute-by-Minute Run Sheet

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00–05** | **Intro** | Welcome. No phones. Explain the task: "Build a perfect square using all 7 pieces." Show the solution shape (do not show how to do it). |
  | **05–15** | **Inside View** | **Group Forecast 1.** Groups discuss how long *they* will take. They must commit to a distribution using the 10 Tokens on the Histogram Sheet. (e.g., 5 tokens on 5–10m, 5 tokens on 10–15m). |
  | **15–20** | **Meta-Prediction** | **The Shift Bet.** On a sticky note, each group writes: *"We predict our median estimate will shift by ___ minutes after seeing data."* Seal this in an envelope. |
  | **20–35** | **Outside View** | **Data Dive.** Hand each group the full 25-card History Deck. They must sort it. They will discover the Tags (General vs. Grad vs. Warned). They must decide which cards count as "people like us." |
  | **35–45** | **Revision** | **Group Forecast 2.** Groups redistribute their 10 Tokens based on the data. They must justify excluding/including specific card types. |
  | **45–60** | **The Task** | **Execution.** Start the timer. Groups solve the Tangram. Stop exactly at 20 mins if unsolved (record as 20+). |
  | **60–65** | **Scoring** | Reveal actual time. Score the Token distributions (1 point per token in the correct bucket). Open Meta-Prediction envelopes. Score the shift accuracy. |
  | **65–75** | **Debrief** | Reveal concepts (Planning Fallacy, Reference Class). Discuss the "Warned" data paradox. Address limitations. |

  ## 4. The Scoring Rule (Honesty Engine)
  To prevent strategic hedging (spreading tokens evenly to guarantee *some* points), use a **Linear Scoring Rule**.

  *   **Rule:** You have 10 tokens. Place them across the 5 time buckets.
  *   **Payoff:** When the true time is revealed, count how many tokens you placed in the *winning bucket*. That is your score (0–10).
  *   **Incentive:** Mathematically, the only way to maximize expected score is to place tokens proportional to your true belief. If you think there's a 50% chance it takes 10–15 mins, you should place 5 tokens there.
  *   **Tie-Breaker:** If scores tie, the group with the *narrower* range (fewest buckets used) wins the chocolate. This penalizes "uniform hedging."

  ## 5. Debrief Script & Facilitation Notes

  ### Part A: Mapping the Experience (10 Minutes)
  *Do not use jargon yet.*

  1.  **The Inside View:** Ask Group 1: "In Round 1, what drove your estimate?"
      *   *Expected Answer:* "We looked at the pieces," "We thought about how fast we are," "We assumed we'd communicate well."
      *   *Label:* Write **Inside View** on the board. Define: *Focusing on the specifics of your own case, your skills, and your plan.*
  2.  **The Outside View:** Ask Group 2: "In Round 2, what changed?"
      *   *Expected Answer:* "We saw the Grad Student cards were slower," "We argued about whether the General Adults counted."
      *   *Label:* Write **Outside View** on the board. Define: *Focusing on the statistics of similar cases, ignoring your own specifics.*
  3.  **The Reveal:** Now you can say: "Psychologists call the gap between Round 1 and Reality the **Planning Fallacy**. The method you used in Round 2 is **Reference-Class Forecasting**." (Mention Kahneman briefly here as the originator).

  ### Part B: The "Warned" Data Paradox (5 Minutes)
  This addresses your requirement about double-counting.

  *   **Ask:** "Look at the 'Warned' cards (Set C). They were told to be careful, just like you were today. Did you use those cards to lower your estimate?"
  *   **The Trap:** If they say yes, ask: "But you *also* just heard a lecture warning you to be careful. If you lower your estimate because the *data* says warned people are faster, AND you lower it because *I* told you to be careful, have you counted the warning twice?"
  *   **The Lesson:** Base rates are not magic. If the base rate already includes the intervention (the warning), applying the intervention again is double-counting. This teaches them to inspect *how* the historical data was generated, not just read the median.

  ### Part C: Addressing Limitations (5 Minutes)
  This addresses your worry about the "stacked deck" and "strategic hedging."

  **1. The "No Private Evidence" Problem**
  *   **Say:** "In this game, your Inside View was useless. You had no idea how hard the puzzle was. In your PhD, that is rarely true. You have pilot data. You know your lab. You know your coding skills."
  *   **The Nuance:** "The Inside View is not 'wrong.' It is 'noisy.' The Outside View anchors you to reality; the Inside View adjusts from that anchor based on your specific strengths. If you start with the Inside View (as you did in Round 1), you anchor on your optimism and adjust insufficiently. If you start with the Outside View, you anchor on reality and adjust for your skill."
  *   **Takeaway:** *Start outside, then adjust inside.*

  **2. The "Strategic Hedging" Problem**
  *   **Say:** "The scoring rule rewards honest distributions. But some of you might have spread tokens to avoid zero points. That's rational game-playing, but bad science."
  *   **The Nuance:** "In research, you can't hide behind a wide confidence interval forever. Eventually, you have to make a decision (submit the paper, buy the equipment). A forecast that is too vague to be falsifiable is useless."
  *   **Takeaway:** *Precision is a cost you pay for utility.*

  ## 6. Predicted Failure Modes (Cheat Sheet for You)

  *   **Anchoring on the Loudest Person:** One dominant student dictates the token placement.
      *   *Fix:* During Round 1, require 2 minutes of silent individual estimation before group discussion.
  *   **Collusion:** Groups compare token spreads across the room.
      *   *Fix:* Remind them that "winning" is beating the timer, not beating the other groups. Or simply seat groups far apart.
  *   **Task Too Easy:** If a group solves it in 3 minutes, the data deck looks like a lie.
      *   *Fix:* The Tangram Square is notoriously difficult for novices. It is unlikely to be solved in under 5 minutes without prior exposure. If they solve it instantly, they likely cheated or saw it before. Treat them as outliers (just like in real data).
  *   **Gaming the Score:** A group puts 2 tokens in every bucket.
      *   *Fix:* The tie-breaker rule (narrowest range wins) punishes this. Highlight this in the scoring phase.
  *   **Reference Class War:** A group insists "General Adults" are the only valid class because "PhD students are just adults."
      *   *Fix:* Validate this! "That is a defensible judgement. But if you choose that class, you must accept the median of 8.5 minutes. If you choose the Grad class, you accept 15 minutes. You cannot pick the class that gives you the answer you *want*."

  ## 7. Handout Text (For US Collaborator)
  *Copy and paste this section for your colleague.*

  > **Activity Note:** This session is designed to bypass resistance to "soft skills" by gamifying the cognitive bias. We avoid terms like "Planning Fallacy" until the final 10 minutes to prevent students from intellectually agreeing while behaviorally resisting.
  >
  > **Key Mechanism:** The History Deck contains conflicting base rates (General vs. Grad vs. Warned). This forces students to realize that "using the outside view" is not a computational instruction, but a judgment call about which reference class is appropriate.
  >
  > **Scoring:** We use a linear scoring rule for probability distributions. This is superior to binary right/wrong scoring because it incentivizes calibration over confidence.
  >
  > **Limitations:** Be prepared to clarify that in real research, the Inside View *does* contain signal (private information). The lesson is not "ignore your specifics," but "anchor on the base rate before applying your specifics."

  ## 8. Contingency: If the Task Fails
  If the Tangrams are too frustrating and morale dips:
  *   **Pivot:** Stop the task at 15 mins. Declare all unfinished groups as "20+ minutes."
  *   **Debrief Angle:** "Notice how you felt when the timer kept running past your Round 1 estimate? That anxiety is what happens to your funding timeline when the Planning Fallacy hits."

  ## 9. Contingency: If They Solve it Too Fast
  If a group finishes in 4 minutes:
  *   **Pivot:** Use their time as an outlier in the debrief. "Group 3 took 4 minutes. If you had used the 'General Adult' base rate, you would have predicted 8. Group 3 had a specific advantage (spatial skills). The question is: Do *you* have that advantage? The Outside View assumes you are average until proven otherwise."
