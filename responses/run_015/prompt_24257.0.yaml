      *   Part I: The Case for Sympathy (Nudge as Mercy).
      *   Part II: The Case for Condemnation (Nudge as Deception).
      *   Part III: The Verdict (Dostoevsky's Anthropology).
      *   Part IV: Critique of Libertarian Paternalism.
      *   Conclusion.

  8.  *(Drafting Content - focusing on the "Burden of Choice" theme)*
      *   The Inquisitor argues man fears freedom more than death.
      *   Nudging assumes man is irrational and needs help.
      *   Is helping irrationality mercy or insult?
      *   For Dostoevsky, irrationality is part of the human mystery (Notes from Underground vibes, though prompt says stick to Inquisitor/Karamazov). Stick to Inquisitor: Man wants to create, not just be a piano key.
      *   Nudging makes man a piano key that *thinks* he is playing himself.

  9.  *(Final Review against constraints)*
