      *   *Validity:* This is a strong philosophical objection. A single scalar value ($\Phi$ in IIT) might miss qualitative differences. A bee might have high sensory acuity but low temporal integration. A human has high cognitive depth. Comparing them on one line is problematic.
      *   *Implication:* You can't just say "1 larva = 0.001 humans." It depends on *what* kind of welfare impact you're talking about (pain vs. frustration vs. confinement).

  4.  **Drafting the Response - Section by Section:**

