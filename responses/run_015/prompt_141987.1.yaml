answer: |-
  **Probability Statement Review Procedure**

  **1. Identify Primary Support**
  Examine the technical memo source. Does the number derive from counting past events (Frequency), simulating physical mechanisms of this specific site (Propensity), or structured expert consensus (Belief)?
  *   **Sufficient Answer:** The report cites a specific dataset (e.g., paleoseismic trench logs), a validated model ID, or an elicitation protocol log.
  *   **Fail:** Vague attribution (e.g., "comprehensive assessment").
  *   **Action:** If multiple sources are mathematically combined into one number, flag for Step 3.

  **2. Verify Internal Consistency**
  *   **Frequency:** Check reference class sensitivity. **Sufficient:** Changing class boundaries (e.g., basin-wide vs. slip-rate matched) shifts the value by <50%.
  *   **Propensity:** Check model validation. **Sufficient:** Model reproduces known historical failures within error bounds.
  *   **Belief:** Check coherence. **Sufficient:** Experts passed calibration questions; divergence is documented.
  *   **Action:** If sensitivity >50% or validation failed, mark for Interval or No Publish.

  **3. Detect Mixing**
  Are different support types mathematically combined? Check for weighted averages of model outputs and historical rates.
  *   **Rule:** Frequency, Propensity, and Belief are distinct meanings, not rival estimates of one quantity.
  *   **Action:** If yes, **Do Not Publish Number**. Conflating meanings invalidates downstream betting logic.

  **4. Assign Output Format**
  *   Pass Steps 1–3: Publish Single Number.
  *   Fail Step 2 (Sensitivity): Publish Interval.
  *   Fail Step 3 (Mixing): Publish Separate Numbers by Type or **Do Not Publish**.

  **5. Human Handoff**
  If the choice of reference class involves policy judgment (e.g., including exotic faults) or if single-case stakes exceed standard risk tolerance, hand to Director. Reviewers check files; Directors weigh consequences.

  ***

  **Case Applications**

  **(1) Kestrel Fault**
  *   **Step 1:** Support is mixed. Frequency (paleoseismic) and Propensity (stress model) both present.
  *   **Step 2:** Frequency fails sensitivity (0.11 vs. 0.22 is >50% shift). Propensity suggests frequency is invalid (new stress state not in record).
  *   **Step 3:** If combined into 0.22, this is prohibited mixing.
  *   **Step 5:** Handoff required. Frequency is unstable; Propensity contradicts Frequency.
  *   **Verdict:** Publish Interval (0.11–0.22) with explicit note that physical models suggest the historical record may not apply. The Board will dislike this ambiguity for a go/no-go decision, but a single number is unjustified.

  **(2) Carbon-Capture Vault**
  *   **Step 1:** Support is Propensity (0.02) and Belief (0.05–0.15). No Frequency (first-of-a-kind).
  *   **Step 2:** Propensity passes if calibrated. Belief passes protocol.
  *   **Step 3:** If averaged to a single number, **Do Not Publish**. They represent different things (physical tendency vs. state of knowledge).
  *   **Verdict:** Publish Belief Interval (0.05–0.15) only. The physics model is too optimistic compared to expert uncertainty. Single number prohibited.

  **(3) Glacier Collapse**
  *   **Step 1:** Undefined. "Collapse" has no agreed threshold.
  *   **Step 2:** Fails immediately. Variation (0.1–0.6) stems from definition, not uncertainty.
  *   **Verdict:** **Do Not Publish.** Without a fixed event definition, probability is meaningless.

  ***

  **What this procedure cannot do**

  This procedure cannot bridge the gap between a frequency or propensity and the confidence a planner places in a single non-repeated project. A 0.04 annual failure rate describes a system's behavior over time, not the destiny of one specific levee facing a unique flood. Planners betting on single cases require a degree of belief, but we often provide frequencies. This mismatch is structural, not computational. We can label the support, but we cannot transform a long-run rate into a single-case guarantee.

  Furthermore, the procedure manages reference-class and threshold difficulties rather than solving them. It forces disclosure when class choices double the probability, but it does not dictate which class is "correct." It blocks publication when thresholds are vague, but it does not define the physics of collapse. We expose the uncertainty; we do not remove it. The Director must ultimately decide if the exposed uncertainty is acceptable for the decision at hand.
