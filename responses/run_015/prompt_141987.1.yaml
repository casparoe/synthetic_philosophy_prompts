prompt: |-
  I direct a small technical unit in a national geological survey. Several times a year we publish single-number probability statements that are then used downstream by regional planners doing expected-cost arithmetic, and increasingly for one-off go/no-go decisions on single projects that will never be repeated: a levee to be raised or not, a town to be relocated or not. Examples: "0.22 probability that the Kestrel fault segment produces a magnitude 7 or greater rupture in the next thirty years"; "0.04 probability per year that the Alder Valley levee system fails."

  Our numbers come from three quite different places. Some come from long-run relative frequencies in a reference class — paleoseismic records of past ruptures, or component-failure databases for levee systems. Some come from physical models that assign a single-case tendency to a particular set-up: a stress-transfer model of this specific fault, a hydrological model of this specific valley. Some come from structured expert judgment, elicited and then revised as new data arrive. We have also found that some of our frequency-based statements move by a factor of two depending on how narrowly the reference class is drawn — all faults in the basin versus faults of comparable slip rate and geometry.

  A new oversight board has now ruled that every number we publish must be traceable: we must be able to say what kind of support it has, and we may not silently average or mix supports of different kinds, because the planners downstream treat our number as something to bet with, which is not the same thing as a frequency and not the same thing as a physical tendency.

  Please write a procedure my reviewers can run on a candidate statement before we sign off on it. It should consist of: an ordered set of questions; for each question, what counts as a sufficient answer drawn from our own files and modelling reports; the points at which the procedure returns "do not publish a number" or "publish only as an interval or qualitative band"; and the points at which it must hand the decision back to a person because the issue is a judgment call rather than a checkable one. Ground it in what the three interpretations actually say — the frequentist reading of probability as long-run relative frequency in a fixed reference class, the subjectivist or Bayesian reading as degree of belief constrained by coherence and revised by conditioning, and the propensity reading as the objective single-case tendency of a particular set-up — and in the fact that these are not three rival estimates of one quantity so much as three different things a probability claim can be.

  Constraints: my reviewers have roughly forty minutes per statement and no formal training in the philosophy of probability, so each step must say what to look for in material we actually have; the procedure must be strict enough that two reviewers reach the same verdict on the same file.

  Then apply it to three cases. (1) The Kestrel fault statement above, where we have six hundred years of paleoseismic records but the segment is now thought to be in a stress state not represented anywhere in that record, and where the reference class choice gives 0.22 on one drawing and 0.11 on another. (2) A proposed statement about a first-of-a-kind carbon-capture containment vault: no failure history at all, a physics model giving a 0.02 failure probability over fifty years, and an expert panel giving 0.05 to 0.15. (3) A statement about whether a named glacier will "collapse" within the decade, where there is no agreed threshold for collapse and different teams' figures range from 0.1 to 0.6 accordingly. At least one of these should come out as an answer the board will not like.

  Close with a short section, headed "What this procedure cannot do," that says plainly how the procedure should treat the gap between a number supported as a frequency or a physical propensity and the confidence a planner is entitled to place in a single non-repeated project, and that states which of the reference-class and threshold difficulties are managed rather than solved.

  Format the answer as numbered procedural steps, with the three cases in clearly labelled subsections and the closing section under the heading above. Hard limit: 1,100 words, counting the cases and the closing section. Do not cite, quote, or attribute any philosophers or published works; the reasoning should stand on its own.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Director of a small technical unit in a national geological survey.
      *   **Task:** Write a procedure for reviewers to validate single-number probability statements before publication.
      *   **Context:** Numbers are used for expected-cost arithmetic and one-off go/no-go decisions (levees, town relocation).
      *   **Input Sources:** Frequency (reference class), Physical Models (propensity/single-case), Expert Judgment (subjective/Bayesian).
      *   **Problem:** Oversight board requires traceability of support type. No silent averaging/mixing. Planners treat numbers as "betting odds," which differs from frequency or propensity.
      *   **Requirements:**
          *   Ordered set of questions.
          *   Criteria for sufficient answers (based on available files/reports).
          *   Decision points: "Do not publish," "Publish as interval/qualitative," "Hand to person (judgment call)."
          *   Grounding: Distinguish Frequentist, Subjectivist, Propensity interpretations (not rivals, but different things).
          *   Constraints: Reviewers have 40 mins, no philosophy training. Must be strict enough for inter-rater reliability.
          *   Application: Apply to three specific cases (Kestrel fault, Carbon-capture vault, Glacier collapse). At least one must be rejected/disliked by the board.
          *   Closing: Section "What this procedure cannot do" regarding the gap between support types and single-case confidence, and reference-class/threshold issues.
          *   Format: Numbered procedural steps, labelled subsections for cases, specific heading for closing.
          *   Word Count: Hard limit 1,100 words (counting cases and closing).

  2.  **Drafting the Procedure:**
      *   Need to be concise to meet the word limit.
      *   Steps need to identify the *source* of the probability.
      *   Steps need to check consistency within that source.
      *   Steps need to flag mixing.
      *   Steps need to determine output format (Number vs. Interval vs. No Publish).
      *   *Step 1: Identify Primary Support.* (Frequency, Model, Expert).
      *   *Step 2: Check Reference Class/Model Validity.* (Is the class stable? Is the model calibrated?)
      *   *Step 3: Check for Mixing.* (Are we averaging different types?)
      *   *Step 4: Determine Output.* (Single number vs. Interval).
      *   *Step 5: Human Judgment.* (Where philosophy meets policy).

  3.  **Drafting the Cases:**
      *   *Case 1 (Kestrel):* Frequency exists but reference class sensitive (0.22 vs 0.11). Model says stress state is new (frequency invalid). Expert judgment? Not mentioned, but implied conflict. Result: Interval or No Publish.
      *   *Case 2 (Carbon Vault):* No frequency. Model (0.02) vs Expert (0.05-0.15). Mixing types. Result: Do not publish single number.
      *   *Case 3 (Glacier):* Undefined threshold ("collapse"). Range 0.1 to 0.6. Result: Do not publish.

  4.  **Drafting the Closing:**
      *   "What this procedure cannot do."
      *   Address the gap between frequency/propensity and single-case betting confidence.
      *   Address reference class/threshold management vs. solution.

  5.  **Word Count Management:**
      *   Total limit: 1,100 words.
      *   Procedure: ~400 words.
      *   Cases: ~400 words.
      *   Closing: ~200 words.
      *   Need to be very tight. Avoid fluff.

  6.  **Refining the Procedure (Mental Check):**
      *   Reviewers have no philosophy training. Use plain language but enforce the distinctions.
      *   "Frequency" = Countable past events.
      *   "Propensity" = Physical model of specific setup.
      *   "Belief" = Expert consensus.
      *   Rule: Do not mix.

  7.  **Drafting - Section by Section (monitoring word count):**

      *   *Intro:* Skip. Go straight to procedure.
      *   *Procedure:*
          1.  **Identify Support Type.** Look at the source file. Is it a count of past events (Frequency), a physics simulation of this specific site (Propensity), or a calibrated panel consensus (Belief)? *Check:* Does the report explicitly name one? If multiple are combined mathematically, flag for Step 3.
          2.  **Verify Internal Consistency.**
              *   *Frequency:* Is the reference class fixed? Check sensitivity analysis. If changing class boundaries shifts the number by >50%, fail.
              *   *Propensity:* Is the model calibrated to observed data? Check validation report. If uncalibrated, fail.
              *   *Belief:* Is the elicitation protocol documented? Check for coherence checks. If missing, fail.
          3.  **Detect Mixing.** Are distinct support types averaged to produce the final number? *Check:* Look for weighted averages of model outputs and historical rates. If yes, **Do Not Publish Number**.
          4.  **Assign Output Format.**
              *   If Step 2 passed and Step 3 negative: Publish Single Number.
              *   If Step 2 failed (high sensitivity) but support is clear: Publish Interval.
              *   If Step 3 positive: Publish Interval labeled by source type, or **Do Not Publish**.
          5.  **Human Handoff.** If the decision hinges on whether the reference class is "reasonable" rather than "documented," or if the cost of error implies a precautionary principle, hand to Director.

      *   *Cases:*
          1.  **Kestrel Fault.** Support: Frequency (paleoseismic) vs Propensity (stress model). Frequency varies 0.11–0.22 based on class. Propensity suggests frequency is invalid (new stress state). Step 3 flags mixing if combined. Step 2 fails Frequency (sensitivity >50%). Step 5 Handoff. *Verdict:* Publish as interval (0.11–0.22) with warning that propensity suggests frequency may be inapplicable. Board will dislike the uncertainty.
          2.  **Carbon Vault.** Support: Propensity (0.02) vs Belief (0.05–0.15). No Frequency. Step 3 flags mixing if averaged. Step 2 passes Propensity (if calibrated) but Belief range is wide. *Verdict:* Do Not Publish Single Number. Publish Belief interval only.
          3.  **Glacier Collapse.** Support: Undefined. "Collapse" lacks threshold. Step 1 fails (no fixed event definition). Step 2 fails (ranges 0.1–0.6 due to definition, not uncertainty). *Verdict:* Do Not Publish.

      *   *Closing:*
          *   What this procedure cannot do.
          *   It cannot bridge the gap between long-run frequency and single-case betting confidence. A 0.04 annual failure rate describes a system, not a specific levee's destiny.
          *   It manages reference class sensitivity by forcing disclosure, not solving the choice of class.
          *   It manages threshold ambiguity by blocking publication, not defining physics.

  8.  **Word Count Check & Editing:**
      *   Need to ensure the tone is directive.
      *   Need to ensure the philosophical distinctions are clear but practical.
      *   Need to hit the <1100 limit.

