      3. **Detect Mixing.** Are different support types mathematically combined? *Check:* Look for weighted averages of model outputs and historical rates. *Action:* If yes, **Do Not Publish Number**. This conflates distinct meanings.
      4. **Assign Output Format.**
          *   Pass Steps 1-3: Publish Single Number.
