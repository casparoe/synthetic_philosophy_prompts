      *   **Claims Assessment (The "Last Thing"):** This is the most important part for the user. I need to be rigorous here.
          *   *Hofstadter:* My memory aligns with the user's gloss, but GEB is pop-sci/cog-sci, not rigorous analytic phil. The committee might not care about GEB fidelity.
          *   *Settled vs. Contested:* Information theory settles "Frame" (signal vs. noise). Philosophy of language contests "Decoder" (rule following). The user's "bet" is novel, not obvious.

