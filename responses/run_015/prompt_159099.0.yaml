      *   *Word Count:* 8000 words is roughly 20-25 pages double-spaced. That's a journal article, not a full dissertation chapter. The proposal needs to reflect this tightness.

  5.  **Final Review against Constraints:**

      *   No bibliography/citations? Check.
      *   Mark settled vs. contested claims? Check.
      *   Flag memory reconstruction? Check.
      *   Working title? Check.
      *   Failure conditions? Check.
