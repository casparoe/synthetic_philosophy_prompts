prompt: |-
  I run a small podcast on decision theory and cooperation (couple hundred devoted listeners, mostly people who already know their Newcomb from their Prisoner's Dilemma). Next month's guest is a philosopher who's spent his whole career defending Hofstadter-style superrationality — the idea that if you and your co-players are all reasoning the same way about a symmetric one-shot game, you should treat your own choice as a representative sample of everyone's and pick the cooperative option even when defecting is causally dominant.

  He's slick. Whenever I push him on the obvious objection — why should I care that a mirror-image reasoner in another room is arriving at the same conclusion I am? — he says something like "it's not about caring, it's about what makes your decision the decision it is" and then changes the subject. He'll definately do his smooth-guru thing unless the questions are built to survive it.

  Draft me eight to ten interview questions. I want at least one that forces him to confront the renegade problem head-on: if he really believes everyone who reasons like him will cooperate, isn't the tempting thought "I'll be the one who defects" rational, and what exactly blocks it? One on whether his view commits him to voting in every single election — his one vote causally does basically nothing, but on his own logic everyone who reasons like him votes, so does the ballot box become a giant prisoner's dilemma he's already solved? And one on near-symmetry: what survives when the payoffs are slightly different, or one player is a bit worse at reasoning than the others — at what point does "we're all the same" quietly become "we're similar enough for the argument to go through," and isn't that last step just evidential reasoning with extra steps? For each question, include a follow-up keyed to the dodge he's most likely to give.

  Don't hand me a menu with hedges and alternatives — commit to the questions you actually think will corner him, and tell me briefly why you ordered them the way you did, because I want to build the episode as an escalating trap. Whole thing under 400 words, follow-ups included.
