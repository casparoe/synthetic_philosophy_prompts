      *   Kripke's "Necessary A Posteriori" usually bridges the gap between the *reference-fixing description* (contingent) and the *essence* (necessary).
      *   In the synthetic case, the "Necessary A Posteriori" status depends on which hypothesis is true. If B is true, "Synthetic X is not Natural Kind X" is necessary a posteriori. If A is true, "Synthetic X is Natural Kind X" is necessary a posteriori (assuming we had to check the structure).
