  9.  **Final Polish:** Check for clarity on the "Necessary A Posteriori" distinction. The user asks if it governs the kind-membership relation. Strictly speaking, "X is a member of K" is necessary if X has the essence of K. If we discover a posteriori that origin is the essence, then "Synthetic X is not K" is necessary a posteriori. I need to make sure this logical flow is clear.

