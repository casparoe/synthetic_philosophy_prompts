      *   **Goal:** The user wants a specification of *valid consent*—a set of desiderata (requirements) that an account of consent must meet. They don't want authorial intuition; they want philosophical rigor to inform the revision.
      *   **Specific Requirements for the Output:**
          *   List desiderata (phenomena to explain, cases to sort, distinctions to respect, facts not to contradict).
          *   Explain *why* each is a requirement (case/consideration), not just a taste.
          *   Address specific distinctions: Consent vs. permission/waiver/acquiescence; Validity vs. prudence (shouldn't act on); Scope problem (description dependence); Reason-dependence vs. content-independence; Competence (threshold vs. sliding); Third-party reliance (external readability); Diachronic identity (eroding self/Alzheimer's).
