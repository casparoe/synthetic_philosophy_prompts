      *   **Mechanism:** Self-locating beliefs (centered propositions) do not carry evidential weight for an agent who cannot distinguish between centers. Temporal location is not evidence.
      *   **Consequence:** Beauty should remain at $P(Heads) = 1/2$ upon waking.
