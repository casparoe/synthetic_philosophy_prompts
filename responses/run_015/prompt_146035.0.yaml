answer: |-
  You have identified a genuine argumentative pathology, and you are right that it is distinct from Chesterton's Fence. In fact, it is arguably a perversion of it. Chesterton's dictum is fundamentally an injunction to *inquiry* ("do not tear down... until you know why"), whereas the loop you describe is an injunction to *ignorance* ("you cannot know why, therefore do not tear down").

  There is no single canonical term for this specific recursive maneuver in the literature, but it is a composite of three well-established concepts. Understanding the components helps you carve out the boundary you need.

  ### 1. The Component Parts
  To diagnose this precisely, you can view it as a hybrid of:

  *   **The Functionalist Fallacy (Sociology/Biology):** This is the assumption that because an institution or trait *exists*, it must currently serve a vital *function*. When the original function (manifest function) is debunked, the defender invents a new one (latent function) without evidence. In evolutionary biology, Gould and Lewontin criticized this as the "Panglossian Paradigm" or creating "Just-So Stories." In social theory, it is the error of assuming social cohesion or coordination is the *result* of the rule rather than a post-hoc rationalization.
  *   **Immunization Strategies (Philosophy of Science):** Drawing on Popper and Lakatos, this is how a theory protects its "hard core" from falsification. The institution's validity is the hard core; the justification is the "protective belt." When the belt is punctured (history shows the reason is dead), it is replaced by a new belt (a new hidden reason) rather than abandoning the core.
  *   **Motte-and-Bailey (Informal Logic):** The defender starts with the Bailey (a specific claim: "This rule prevents chaos"). When challenged, they retreat to the Motte (an indefensible epistemic humility: "We can't know everything about complex systems"). Once the attack subsides, they slide back to the Bailey ("So, keep the rule").

  ### 2. The Boundary: Prudence vs. Opacity
  The exact boundary between legitimate Burkean caution and this loop lies in **falsifiability** and the **burden of proof**.

  *   **Legitimate Caution (Chesterton/Burke):** "There may be unseen consequences. Let us investigate the history and proceed slowly."
      *   *Status of the claim:* Provisional.
      *   *Burden:* Shared. Both sides acknowledge risk.
      *   *Goal:* Risk mitigation.
  *   **The Loop (Your Phenomenon):** "There are unseen consequences that are inherently unknowable. Therefore, the status quo is privileged by default."
      *   *Status of the claim:* Unfalsifiable.
      *   *Burden:* Shifted entirely to the reformer (prove negative).
      *   *Goal:* Stasis preservation.

  The critical edge is that legitimate caution admits the possibility that the fence *might* be nonsense after investigation. Your loop makes the "wisdom of the fence" axiomatic, regardless of historical evidence. It treats *opacity* itself as evidence of *design*.

  ### 3. Proposed Naming
  Since you need a term for your teaching and writing, you have two options: adopt a descriptive compound or coin a specific label.

  **Option A: Teleological Immunization**
  This captures the mechanism. "Teleological" refers to the assumption of purpose (the hidden function); "Immunization" refers to the strategy of making the claim safe from refutation by regenerating the purpose. It signals that the defender is protecting a theory of the institution's necessity from the data of its history.

  **Option B: The Chestertonian Retreat**
  This highlights the relationship to the original principle. It signals that the argument starts at Chesterton's Fence but *retreats* from the demand for knowledge into a defense of ignorance. It is useful pedagogically because it shows students how a principle of prudence can be weaponized into a principle of obscurantism.

  **Option C: The Latent Function Shuffle**
  This is more sociological. It describes the specific move of swapping manifest functions for latent functions whenever the former are debunked.

  ### Recommendation
  For a political philosophy context, **Teleological Immunization** is the most rigorous. It identifies the error (assuming purpose where none is proven) and the rhetorical strategy (making that assumption unfalsifiable).

  If you want to be more provocative in a seminar setting, **The Chestertonian Retreat** is effective because it forces the defender to clarify whether they actually want to know why the fence is there, or if they simply want the fence to remain.

  ### How to Carve It Out
  To formalize this for your students or your own work, define it by these three criteria:

  1.  **Historical Decoupling:** The justification for the practice is severed from its actual historical origin without changing the recommendation to keep it.
  2.  **Functional Regeneration:** When a specific function is disproven, a vaguer, more abstract function (e.g., "social cohesion," "institutional memory") is immediately substituted.
  3.  **Epistemic Sheltering:** The argument concludes by claiming the new function is inherently difficult to measure, thereby placing the burden of proof on the reformer to prove the *absence* of utility.

  This distinguishes it from ordinary caution, which would say: "We don't know the function, so let's run a pilot program to see if removing it causes harm." The loop you've identified says: "We don't know the function, so we must assume it is vital." That shift from *investigative pause* to *presumptive necessity* is the precise boundary you are looking for.
