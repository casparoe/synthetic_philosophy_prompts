answer: |-
  ### Brainstorming & Diagnostic

  The heterogeneity objection is essentially a category error charge: you're calling vastly different things "pleasure" as if they belong to a natural kind, like "water" or "gold," when they look more like a Wittgensteinian family resemblance cluster. If hedonism rests on "pleasure" being the single currency of value, that currency needs to be fungible. If reading poetry and eating cake are different *kinds* of good, pure hedonism collapses into pluralism.

  **Mill's Qualitative Move:**
  Mill knows the "swine objection" is coming. If pleasure is just a sensation, Socrates dissatisfied is worse than a fool satisfied. Mill wants to say Socrates is better off *even if* he feels less intense sensation. So he introduces "quality."
  *   *The Hook:* Competent judges prefer higher pleasures.
  *   *The Risk:* What makes a pleasure "higher"? If it's not intensity or duration (the quantitative metrics), it must be something about the *source* (virtue, intellect). But if the source matters, aren't we smuggling non-hedonic values into the definition of the good?
  *   *The Heterogeneity Fix:* He admits heterogeneity (higher vs. lower) but tries to unify them under "preference by competent judges."
  *   *The Crack:* This doesn't explain what the *experience* shares. It just ranks them. It relocates the problem from "what is the feeling?" to "who is the judge?"

  **Intentionalism (Attitudinal Hedonism):**
  This view (championed by folks like Feldman or Heathwood) says pleasure isn't a sensation (qualia) but a propositional attitude (taking satisfaction in *p*).
  *   *The Hook:* Unifies ice cream and proofs because both involve "being pleased that..."
  *   *The Risk:* It divorces pleasure from phenomenology. Can you be pleased without feeling anything?
  *   *The Heterogeneity Fix:* It dissolves the problem. There is no common feel required, only a common functional role (intrinsic liking).
  *   *The Crack:* It makes pleasure too easy to have and too hard to value. If I like suffering (schadenfreude), is that intrinsically good for me?

  **Adversarial Pleasures (Schadenfreude):**
  This is the stress test.
  *   *Mill:* Must classify this as "lower." It appeals to base instincts. But why is it still *pleasure*? Because it feels good? If so, quality is secondary to feel. If quality is primary, and judges reject it, is it pleasure at all?
  *   *Intentionalism:* I represent "their suffering" as "good-for-me." This is a false representation of value. But does the falsity stop it from being pleasure? No. But it makes the hedonist claim ("pleasure is good") look sinister.

  **Hidden Convergence:**
  Both theories secretly rely on *valuation* rather than *sensation*. Mill uses the valuation of competent judges. Intentionalism uses the subject's own valuation (representing as good). Neither can stick to a purely descriptive, phenomenological account of pleasure. They both admit that "pleasure" is entangled with "approval."

  **Seminar Honesty:**
  Mill is trying to save a moral theory (Utilitarianism). Intentionalism is trying to save a philosophy of mind (Account of Pleasure). Intentionalism is more honest about the mind; Mill is more honest about the moral stakes (that some pleasures *shouldn't* count equally). But regarding the *heterogeneity problem* specifically, Mill is patching a hole, while Intentionalism is rebuilding the wall.

  ---

  ### Comparison: Mill vs. Intentionalism on Heterogeneity

  #### 1. Mill's Qualitative Distinction: Relocating the Problem
  Mill's strategy in *Utilitarianism* is defensive. He accepts the heterogeneity objection implicitly—admitting that the pleasures of the intellect differ from those of the body—but refuses to let this fracture the theory. He argues that some pleasures are inherently "higher" in quality, such that a small amount of higher pleasure outweighs any quantity of lower pleasure.

  **Where it cracks:**
  Mill's solution relocates the heterogeneity problem rather than solving it. By introducing "quality," he abandons the claim that pleasure is a unified phenomenological natural kind. If higher and lower pleasures share no common felt quality (since one can be preferred despite less intensity), what unifies them as *pleasures*?
  *   **The Competent Judge Dilemma:** Mill defines higher pleasures by the preference of those who have experienced both. But *why* do they prefer them? If they prefer poetry over push-pin because poetry is *truer*, *nobler*, or *more meaningful*, Mill has smuggled non-hedonic values into the hedonistic calculus. He is no longer maximizing pleasure; he is maximizing "pleasure weighted by virtue."
  *   **The Adversarial Test:** Consider schadenfreude. Mill must classify this as a lower pleasure (appealing to base instincts). But here the tension spikes: If a competent judge feels schadenfreude, do they prefer it? Presumably not. So it counts as pleasure only because of its *felt intensity* (phenomenology), not its quality. This reveals a dualism in Mill's account: "Pleasure" sometimes means "what feels good" (schadenfreude) and sometimes means "what is preferred by judges" (poetry). The heterogeneity remains because the criterion for being a pleasure shifts depending on whether you are defining it or valuing it.

  #### 2. Intentionalism: Solving Heterogeneity, Creating Normative Alienation
  Intentionalism (or Attitudinal Hedonism) argues that pleasure is not a sensation but a pro-attitude toward a state of affairs. To be pleased is to represent some object or proposition as *good-for-me* at that moment.

  **Where it succeeds:**
  This view actually solves the heterogeneity problem. It explains why ice cream, proofs, and schadenfreude are all "pleasures" without requiring a common sensory thread. They are unified by their functional role: they are all instances of *intrinsic liking*. The phenomenology can vary wildly (the cool rush of ice cream vs. the warm glow of success) because the feel is not the essence; the attitude is.

  **Where it cracks:**
  While it solves the descriptive heterogeneity, it creates a normative crisis, particularly with adversarial pleasures.
  *   **The Correctness Condition:** If pleasure is representing an object as good-for-me, schadenfreude involves representing someone else's suffering as good-for-me. This is a false representation of value (assuming suffering is not good). Intentionalism must say this still counts as pleasure (because the attitude exists) and often that it is still *intrinsically good for the subject* (because having pro-attitudes is what benefits us).
  *   **The Alienation Problem:** This forces the hedonist to say that a life containing malicious satisfaction is, *ceteris paribus*, better for the subject than one without it. This is a hard pill to swallow. To avoid this, the intentionalist might argue that false representations don't generate well-being. But if so, we are no longer pure hedonists; we are saying pleasure is only good when *merited*. This collapses into a perfectionist or objective list view.
  *   **The Adversarial Test:** Intentionalism handles schadenfreude better than Mill descriptively (it's just an attitude toward a bad state), but it struggles to explain why we intuitively feel this pleasure is "corrupt." Mill calls it corrupt (lower); Intentionalism calls it beneficial (intrinsically good attitude). Intentionalism solves the mind problem but breaks the value problem.

  #### 3. Hidden Convergence: The Evaluative Turn
  The hidden convergence between Mill and the Intentionalist is that **both abandon pure phenomenology.**
  *   Mill admits that the "feel" isn't enough to determine value (hence quality).
  *   Intentionalism admits that the "feel" isn't enough to determine the nature of pleasure (hence attitude).

  Both theories ultimately define pleasure through a cognitive filter: for Mill, it's the retrospective judgment of competent judges; for the Intentionalist, it's the concurrent representation of "good-for-me." Neither can sustain the naive hedonistic view that pleasure is a raw, pre-cognitive sensation like sweetness. They both concede that "pleasure" is inextricably linked to "approval."

  #### 4. Seminar Honesty
  If I were teaching this seminar, I would present **Intentionalism as the more honest answer**, though with severe caveats.

  Mill's move is intellectually dishonest in the context of the heterogeneity problem because it pretends to remain within hedonism while secretly importing non-hedonic values (dignity, intellect) to do the heavy lifting. It tries to have it both ways: pleasure is the only good, but some pleasures aren't really the *same* good.

  Intentionalism is more honest because it bites the bullet on the phenomenology. It admits there is no "pleasure sensation" unifying ice cream and proofs. It owns the heterogeneity by changing the ontology of pleasure from sensation to attitude. However, it fails to be honest about the *normativity*. It tries to maintain that *all* intrinsic liking is good for you, even when that liking is directed at moral horrors.

  Mill relocates the heterogeneity problem into the ranking system. Intentionalism solves the heterogeneity problem but inherits a normative absurdity.

  ### Verdict

  Mill's qualitative distinction is a patch that saves the moral theory at the cost of the metaphysical account; it admits pleasures are different but refuses to say they are different *kinds* of good, which is incoherent. Intentionalism provides a coherent metaphysical account of the mind (solving heterogeneity) but fails to secure the normative claim that pleasure is the sole good (due to adversarial pleasures). Intentionalism is the more honest philosophy of mind, but Mill is the more honest moralist (acknowledging that some pleasures shouldn't count). Regarding the specific prompt of the heterogeneity problem, Mill fails and Intentionalism succeeds, but at a high price.

  \answer{Intentionalism solves the heterogeneity problem but fails normatively; Mill just relocates it}
