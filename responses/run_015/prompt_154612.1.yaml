prompt: |-
  hey so i'm drafting this scene where my surgeon protagonist starts seeing weird clusters in post-op infections but has zero statistical proof, and my writing group got totally sidetracked into an ethics-of-belief argument. my friend maya went full clifford-style — she said its literally unethical for the surgeon to let herself belive there's a hidden pattern without rigorous data, since belief should always track evidence and allowing belief without proof is just intellectual self-indulgence that gets dangerous when you're cutting people open. she said if you relax that rule you start seeing faces in clouds and miss the actual noise.

  raj pushed back with a james-style line: some beliefs are live, forced, and momentous — either you investigate the pattern or you don't, and waiting for full proof means you never discover anything new. he introduced this idea he called an epistemic risk budget, where professionals have to allocate some credence to unverified hypotheses or stagnation kills more patients than false positives ever could. he said discovery requires spending belief-credibility you haven't fully earned yet.

  maya came back that the metaphor hides the stakes — risk budgets sound rational but they're just gambling with other people's bodies, and the momentousness of surgery actually raises the evidential bar, not lowers it. she said raj treats belief like a personal choice when it's really an instutional duty, and that the surgeon can act cautiously without committing to any belief about hidden patterns at all.

  raj then said maya is treating belief like a bank account when its really more like a narrative thread — the surgeon has to live inside a practical story where anomalies matter, or she loses the conviction needed to investigate anything seriously. he said there's a split between theoretical assent and practical commitment, and clifford-style rules only govern the first, not the working orientation that drives actual research.

  please adjudicate this move by move: rate each of the four moves from clearly mistaken to clearly right and briefly justify each rating. also tell me what both are missing about how institutional verification splits the difference — like, can a surgeon hold a working hypothesis without full belief, and does that solve the problem or just rename it? forgive the messiness, i'm writing this between chapters and my notes are a disaster.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
