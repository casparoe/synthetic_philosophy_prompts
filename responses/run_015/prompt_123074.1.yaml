  **JOINT STATEMENT ON THE ONTOLOGY AND AGGREGATION OF POPULAR WILL**

  **Date:** 14 October 2025
  **Signatories:** The Substantive-Populist Working Group & The Procedural-Pluralist Working Group
  **Context:** Following a twelve-month adversarial collaboration funded by the Centre for Democratic Theory, the undersigned parties submit this statement. We acknowledge that while we share a diagnostic vocabulary regarding the difficulties of democratic representation, we remain irreconcilable on the normative implications of those difficulties.

  ### I. Agreed Diagnostic Claims

  We jointly affirm the following propositions as settled matters of fact and theory, acknowledging that these constraints apply to all democratic systems regardless of their ideological orientation:

  1.  **Historical Contingency:** We agree that the phrase 'the will of the people' is not a trans-historical constant. Its usage has shifted from a revolutionary claim against monarchy in the eighteenth century to a technocratic metric in the twenty-first. We acknowledge that no single definition has remained stable across this timeline.
  2.  **Formal Aggregation Constraints:** We accept the validity of social choice theory, specifically Arrow's Impossibility Theorem and the phenomenon of Condorcet cycles. We agree that under conditions of diverse preferences, no voting system can perfectly translate individual rankings into a coherent collective order without violating at least one fairness criterion (e.g., independence of irrelevant alternatives or non-dictatorship).
  3.  **Demographic Flux:** We agree that 'the electorate' is not a static entity. Due to birth, death, migration, and changes in enfranchisement laws, the body of citizens eligible to vote in 2025 is not identical to the body that voted in 2010. Consequently, any claim that 'the people' have spoken implies a boundary-drawing exercise that is itself political, not mathematical.
  4.  **Performative Power:** We acknowledge that speaking in the name of 'the people' is a performative act that helps constitute the very group it claims to represent. Rhetoric does not merely describe a pre-existing unity; it actively attempts to forge one. We agree that this power can be used to expand inclusion or to justify exclusion.
  5.  **The Necessity of Intermediaries:** We agree that in any polity larger than a small village, some mechanism of aggregation or intermediation (whether human representatives or algorithmic protocols) is required to process preferences. There is no unmediated access to the popular will.

  ### II. Areas of Fundamental Disagreement

  While we agree on the constraints listed above, we disagree on their ontological and normative significance. The Substantive-Populist camp views these constraints as technical hurdles to be overcome to reveal the true will. The Procedural-Pluralist camp views these constraints as proof that a singular 'true will' is a fiction, and that legitimacy derives solely from fair process.

  The following table details our divergent predictions and claims regarding three specific cruxes.

  | Crux | Concrete Case / Hypothetical Mechanism | Substantive-Populist Claim & Prediction | Procedural-Pluralist Claim & Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. The Status of Non-Voters** | **Case:** A binding referendum passes with 55% support, but voter turnout is only 35% of the eligible population. | **Claim:** Non-voters are part of the 'silent plenitude' of the People. Their abstention is often a result of elite alienation, not lack of opinion.<br>**Prediction:** The mandate is valid. The 55% of voters represent the *active* will of the *whole* people. To demand higher turnout thresholds is a veto mechanism designed by elites to stall the popular will. | **Claim:** Non-voters are absent from the procedure. In a pluralist system, silence cannot be interpreted as consent, only as non-participation.<br>**Prediction:** The mandate is weak. Only 19.25% of the total populace actively authorised the change. Legitimacy requires a threshold of participation to ensure the outcome reflects a majority of the *demos*, not just a majority of *participants*. |
  | **2. Temporal Turnover & Mandates** | **Case:** A constitutional amendment passed in 2010 is challenged in 2025. Demographic analysis shows 50% of the 2025 electorate were ineligible to vote in 2010. | **Claim:** The People are a trans-generational moral entity. The 'spirit' of the 2010 decision binds the present unless explicitly revoked.<br>**Prediction:** The 2010 mandate remains authoritative. The turnover of biological individuals does not dissolve the continuity of the political nation. To require re-authorization is to treat the state as a mere contract rather than a community. | **Claim:** The People are a legal construct existing only in the present moment. Authority dissolves as the electorate composition changes.<br>**Prediction:** The 2010 mandate has expired. Since half the decision-makers are new, the 2025 body is a distinct sovereign. Upholding the old rule without new consent is 'government by the dead' and violates current self-determination. |
  | **3. Algorithmic Aggregation** | **Case:** A 'Digital Plebiscite' programme allows citizens to update policy preferences in real-time via a secure app, adjusting weights on issues daily. | **Claim:** This technology removes the distortion of electoral cycles and elite intermediaries.<br>**Prediction:** The system **reveals** a hidden, stable will that was previously obscured by infrequent voting. It recovers the 'latent intent' of the people by allowing continuous expression. | **Claim:** Interface design and question framing inevitably shape preferences (the 'menu effect').<br>**Prediction:** The system **constructs** a volatile will. Real-time updating creates feedback loops where preferences are manipulated by the algorithm's salience settings. It invents a collective intent that did not exist prior to the measurement. |

  ### III. Concluding Observation

  We conclude this collaboration by noting that our disagreement is not merely empirical, but metaphysical. The Substantive-Populist signatories maintain that 'the People' exists prior to the vote, waiting to be discovered. The Procedural-Pluralist signatories maintain that 'the People' exists only subsequent to the vote, created by the rules of the count.

  We agree to disagree on this foundation, whilst committing to uphold the democratic procedures that allow this dispute to continue without violence.

  ***

  **Signed,**

  *Dr. Elena Vance*
  *Lead Convener, Substantive-Populist Working Group*

  *Prof. Julian Thorne*
  *Lead Convener, Procedural-Pluralist Working Group*
