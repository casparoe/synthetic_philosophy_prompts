  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say the film *solves* the paradoxes. It *instantiates* the tension.
      *   *Nuance on Preface:* In the Preface Paradox, the author believes $P_1 \dots P_n$ and believes $\neg(P_1 \land \dots \land P_n)$. In the film, Juror 8 argues we shouldn't believe $P_1 \dots P_n$ firmly enough to assert the conjunction. It's more about the *Lockean Thesis* (threshold for belief). I should frame it as a challenge to the Lockean Thesis in high-stakes environments.
      *   *Nuance on Unanimity:* The user says "Unanimity is conjunction all the way down." Yes. And the Lottery Paradox says conjunction fails. So the legal system demands a logical impossibility (certainty via conjunction of fallible beliefs) to protect liberty. The film shows the *struggle* to achieve that impossibility.
