answer: |-
  This is a compelling pairing, but your instincts about the friction points are correct. If you present the film as a straightforward illustration of the paradoxes, you will flatten both. The film is not a logic puzzle; it is a dramatization of the *social cost* of logical puzzles. The value for your seminar lies not in showing how the film solves the paradoxes, but in showing how legal institutions are forced to navigate them pragmatically, often by overriding formal epistemic norms with moral ones.

  Here is the reading I would offer your students, structured around the specific tensions you identified.

  ### 1. The Errata Model and the Preface Paradox
  Your "errata model" is robust, but it requires a tweak regarding the *Lockean Thesis*. In the Preface Paradox, the author rationally believes every proposition in the book but also rationally believes the conjunction is false (due to fallibility). In the film, the prosecution asks the jury to do the opposite: to treat the conjunction of evidence as certain *because* the individual items are plausible.

  Juror 8 does not merely find errors; he attacks the *aggregation* of probability. He demonstrates that while each piece of evidence might clear a low threshold of plausibility individually, none clear the high threshold required to sustain the conjunction.

  **Syllabus Scene:** *The Switchblade Demonstration.*
  **Commentary:** Do not focus on the prop itself. Focus on the shift in modal status. Before the demonstration, the knife is treated as a necessary truth (unique evidence). After, it is merely possible. Ask your students: Does the probability of the knife's uniqueness drop, or does the *justification* for believing in its uniqueness vanish? This is the Preface Paradox in action. The State's narrative is a book of claims. Juror 8 shows that if the author (the State) is fallible about the introduction, the reader (the Jury) cannot trust the conclusion. The "Errata" model holds up here because the film treats the verdict as a single conjunctive claim: Guilt = $E_1 \land E_2 \land E_3 \dots$. If any $E_n$ is merely probable rather than known, the conjunction fails to be known.

  ### 2. Lottery Reasoning and the No-Pooling Norm
  You are right to suspect the "no-pooling" norm is distinct from standard closure failure, but it is best understood as the legal system's *response* to the Lottery Paradox. The Lottery Paradox shows that high probability does not equal knowledge. The legal system codifies this by refusing to allow the aggregation of probabilities to constitute "Beyond Reasonable Doubt."

  If you treat the evidence items as lottery tickets (each likely to be "true," but no guarantee), a conviction based on aggregation is a conviction based on statistical likelihood. Juror 8 insists on a *sensitivity* condition: the belief in guilt must be sensitive to the truth of each specific claim, not just the statistical weight of the pile.

  **Syllabus Scene:** *The El Train Timing and The Limping Witness.*
  **Commentary:** Pause when Juror 8 reconstructs the timing of the train and the walk to the door. He is not proving the witness lied; he is proving the witness *could be mistaken*. This is the crucial epistemic distinction. In Lottery terms, he is showing that the "ticket" (the testimony) has a non-zero chance of being a "winner" (false).
  Tell your students: The film dramatizes the rejection of the Lockean Thesis in high-stakes environments. In civil court (preponderance of evidence), you can pool probabilities. In criminal court (BRD), you cannot. The film argues that a "no-pooling" norm is required when the cost of error is irreversible. This is where the film contributes to the literature: it suggests that the solution to the Lottery Paradox isn't logical, it's pragmatic. We ban pooling not because it's illogical, but because it's dangerous.

  ### 3. Unanimity, Reliability, and Conjunction
  Your mathematical objection is sound (Condorcet's Jury Theorem suggests unanimity lowers truth-tracking reliability compared to majority rule). However, the film treats unanimity not as a reliability aggregator, but as a *defeater detector*.

  In formal epistemology, knowledge is often defined as justified true belief + no defeaters. A unanimous vote is an institutional mechanism to ensure that every potential defeator has been aired and neutralized. If one juror holds out, they represent a live defeater. The film argues that in a system where the penalty is death, the epistemic goal shifts from "maximizing true convictions" to "minimizing false convictions."

  **Syllabus Scene:** *The Final Vote and The Bathroom Confrontation.*
  **Commentary:** Address the math directly. Acknowledge that twelve 99% reliable jurors do not equal 100% reliability under conjunction. Then ask: Why does the film demand it? The answer is that unanimity transforms the epistemic status of the verdict from "statistically probable" to "socially certified."
  The paradox warns us that conjunction reduces probability. The film accepts this cost to purchase *legitimacy*. The epistemic lesson here is about the difference between *individual justification* and *collective warrant*. The film suggests that collective warrant requires the elimination of all dissent, not because dissent is always correct, but because dissent indicates the presence of unexamined variables. The cheering at the end isn't for the math; it's for the completion of the defeater-checking process.

  ### 4. The Breakdown: Moral Encroachment and Psychological Causation
  You are correct that the reading breaks down at the boundaries of the film's narrative arc. Juror 8's initial doubt is moral, not evidential. The final juror's capitulation is psychological, not logical. Rather than hiding this, use it to teach *Pragmatic Encroachment* and the limits of idealized agency.

  **Syllabus Scene:** *Juror 8's Opening Statement* and *The Photograph of the Son.*
  **Commentary:**
  *   **On Juror 8:** Use the opening statement to introduce Pragmatic Encroachment. The evidence hasn't changed when Juror 8 votes "Not Guilty"; the stakes have. His moral refusal to "take a life on the cheap" raises the epistemic threshold required for belief. This validates your suspicion: the epistemic rigor is driven by the moral cost. The film teaches that "Beyond Reasonable Doubt" is not a fixed probability; it is a function of the penalty.
  *   **On the Final Juror:** Do not try to rationalize the breakdown over the photograph. Use it to show the gap between *normative epistemology* (how we ought to change beliefs) and *descriptive psychology* (how we do). The final juror does not update on evidence; he updates on social pressure and trauma. This is a crucial limit-case for the paradoxes. The Lottery and Preface paradoxes assume ideal agents who follow logical norms. The film shows that in real institutions, belief revision is often causal, not logical. The "paradox" is resolved not by logic, but by the social mechanics of the room.

  ### Summary for the Syllabus
  If I were structuring this unit, I would frame the screening with this proposition: **The Lottery and Preface paradoxes reveal a gap between high probability and knowledge. *12 Angry Men* reveals the institutional machinery we build to bridge that gap when the cost of falling through is death.**

  1.  **Screen:** The Switchblade Scene. **Discuss:** The Preface Paradox and the fragility of conjunctive narratives.
  2.  **Screen:** The Train/Witness Reconstruction. **Discuss:** The Lottery Paradox and the legal prohibition on probability pooling.
  3.  **Screen:** The Final Vote. **Discuss:** Unanimity as a defeater-checking mechanism vs. Condorcet's reliability math.
  4.  **Screen:** Opening Statement & Photo Breakdown. **Discuss:** Pragmatic Encroachment and the non-logical causes of belief revision.

  The film does not solve the paradoxes. It shows us why we cannot afford to live with them unresolved. That is a stronger philosophical claim than a simple illustration.
