  # JOINT STATEMENT ON THE ONTOLOGY OF STATUES AND CLAY
  **Issued by the Constitutional Pluralist and Four-Dimensional Monist Working Groups**

  ## 1. Agreed Claims

  1.  **Formal Ontology of Constitution:** Both camps accept that there exists a material basis (the clay) and a formal/artistic description (the statue) that coincide in spacetime. Both camps accept a relation $R$ such that for any time $t$ during the statue's existence, the region occupied by the statue is identical to the region occupied by the clay. The Pluralist interprets $R$ as a sui generis *constitution relation* between distinct entities. The Monist interprets $R$ as *identity* between a single four-dimensional entity and its temporal parts or descriptions. Both agree that $R$ is not symmetric in terms of predicability: predicates applicable to the clay are not always applicable to the statue, and vice versa.
  2.  **Empirical Data:** Both camps accept the same physical facts regarding the case study object:
      *   **Gradual Part Replacement:** The object can undergo the replacement of constituent atoms over time without immediate loss of macroscopic integrity.
      *   **Destructive Testing:** Compressing the object into a sphere eliminates the artistic form while preserving the mass.
      *   **Restoration:** Damaged parts can be repaired using new material.
      *   **Intermediate States:** The material can exist in a formless state (e.g., a lump or ingot) prior to or after possessing the statue's specific shape.
  3.  **Limits of Leibniz's Law:** Both camps agree that the Indiscernibility of Identicals (Leibniz's Law) holds for strictly identical entities. Both camps agree that standard arguments invoking modal differences (e.g., "The clay could survive flattening; the statue could not") rely on premises regarding the essential properties of the relata.
      *   **What is Established:** The arguments successfully establish that *if* the clay and statue have divergent modal profiles, they cannot be identical *under a timeless description*.
      *   **What is Not Established:** The arguments do not settle whether modal properties are intrinsic to the entity at a time or indexed to temporal parts. The Pluralist contends modal properties are intrinsic to the kind. The Monist contends modal properties are reducible to facts about temporal extension.
      *   **Contested Premise:** The premise that "The statue cannot survive flattening" is accepted by the Pluralist as a truth about the object's essence. The Monist accepts it only as a truth about the *statue-stage* or as a claim that the predicate "is a statue" does not apply to the flattened temporal part of the worm.

  ## 2. Disagreements Table

  | Dispute Topic | (a) Pluralist Formulation | (b) Monist Formulation | (c) Exact Point of Divergence |
  | :--- | :--- | :--- | :--- |
  | **Numerical Identity** | The statue ($S$) and the lump of clay ($L$) are numerically distinct entities ($S \neq L$) that are co-located at every moment of $S$'s existence. | The statue and the lump of clay are numerically identical ($S = L$), referring to a single four-dimensional spacetime worm; apparent distinctness is a function of sortal concepts. | Whether co-location entails numerical distinctness or permits numerical identity under temporal indexing. |
  | **Persistence Conditions** | $S$ and $L$ have divergent persistence conditions; $L$ can survive loss of form, while $S$ cannot. | There is only one set of persistence conditions for the worm; "survival" of $S$ is a matter of whether the worm continues to have temporal parts satisfying the "statue" description. | Whether persistence conditions are kind-relative properties of distinct objects or descriptive constraints on a single object's temporal extent. |
  | **Counting** | At time $t$, there are two material objects in the region occupied by the work: one statue and one lump. | At time $t$, there is one material object in the region; counting yields "one" regardless of whether one counts "statues" or "lumps." | Whether the cardinality of objects in a region is invariant across sortal concepts. |
  | **Modal Properties** | Modal properties (e.g., "could survive flattening") are intrinsic to the object and determine its identity conditions. | Modal properties are extrinsic or relational, derived from the object's temporal parts or its relation to a conceptual scheme. | Whether modality is de re (inherent to the entity) or de dicto/temporal (inherent to the description or stage). |

  ## 3. Cruxes

  **Crux 1: The Nature of Artistic-Form Properties**
  *   **Question:** Are properties like "being a statue" intrinsic to the material configuration at a time, or do they depend on historical/causal relations?
  *   **Decisive Evidence/Argument:** A thought experiment or physical case where material configuration is identical, history is distinct, and intuitive judgments on object identity diverge consistently.
  *   **Pluralist Prediction:** If history differs, the statue differs, proving form properties are not merely structural but historical/essential.
  *   **Monist Prediction:** If structure is identical, the worm segment is identical; historical differences affect *classification*, not ontological identity.

  **Crux 2: Sortal-Relativity of Identity**
  *   **Question:** Is identity absolute ($x = y$) or sortal-relative ($x$ is the same $F$ as $y$)?
  *   **Decisive Evidence/Argument:** A logical demonstration that sortal-relative identity either collapses into absolute identity or leads to contradiction in transitivity.
  *   **Pluralist Prediction:** Sortal-relative identity is incoherent; identity must be absolute, forcing distinct objects for distinct sortals.
  *   **Monist Prediction:** Sortal-relative identity is coherent and necessary; it dissolves the need for coincident objects.

  **Crux 3: Causal-Historical Continuity vs. Structural Continuity**
  *   **Question:** Is causal-historical continuity necessary for the identity of the artwork-object, or is physical/structural continuity sufficient?
  *   **Decisive Evidence/Argument:** A case of perfect molecular replication (teletransportation) where causal chains are broken but structure is preserved.
  *   **Pluralist Prediction:** The replica is a new statue; the original ceased to exist. Causal history is essential.
  *   **Monist Prediction:** The replica is the same worm (if continuity is preserved via psychological or physical connection); causal history is secondary to spatiotemporal continuity.

  **Crux 4: Indexing of Parthood**
  *   **Question:** Is the relation "part of" indexed to an object's kind (e.g., $x$ is a statue-part but not a clay-part)?
  *   **Decisive Evidence/Argument:** Analysis of whether mereological sums vary based on sortal concepts applied to the same matter.
  *   **Pluralist Prediction:** Parthood is kind-relative; the arm is a part of the statue but merely a portion of the clay.
  *   **Monist Prediction:** Parthood is absolute (temporal parts); the arm-stage is a part of the worm regardless of description.

  ## 4. Application: The Shifting-Form Case

  **Scenario:** A statue is composed of shape-memory material. It is heated, reverting to a featureless ingot (Phase 1). It is cooled and reheated to return to the identical macroscopic form (Phase 2).
  **Variant A:** The original atoms are used in Phase 2.
  **Variant B:** Perfect synthetic analogues (physically indistinguishable but lacking the original causal chain) are used in Phase 2.

  **Predictions on Survival:**

  | Question | Pluralist Prediction | Monist Prediction |
  | :--- | :--- | :--- |
  | **Does the *statue* survive the ingot phase (Variant A)?** | **No.** The statue ceases to exist when the form is lost. A new statue is created when the form is restored. The clay persists throughout. | **Yes (with qualification).** The single spacetime worm persists. The predicate "is a statue" applies to the temporal parts in Phase 1 and 2, but not the ingot part. The *object* survives; the *statue-property* is intermittent. |
  | **Does the *statue* survive analog-substitution (Variant B)?** | **No.** The causal chain is broken. The Phase 2 object is a distinct statue (a replica), not the original. | **Yes (ontologically).** If structural and spatiotemporal continuity of the *process* is maintained, the worm persists. However, the Monist concedes the *artistic classification* may change due to historical relations, though the ontological object remains. |
  | **Does the *clay-object* survive independently of the form?** | **Yes.** The lump of clay persists through the ingot phase and the restoration, regardless of the statue's existence. | **Yes.** The clay-object is the spacetime worm. Since the worm persists through the ingot phase, the clay-object survives. (Note: Monist identifies this worm with the statue-object). |

  ## 5. Verbal Dispute Analysis

  **Identified Verbal Portion:**
  A portion of the dispute concerns the usage of the term **"object"** and **"survival."**
  *   **Pluralist Usage:** "Object" implies an entity bound by specific sortal persistence conditions. To "survive" means to retain identity under that specific sortal.
  *   **Monist Usage:** "Object" implies a spatiotemporal region filled with matter (a worm). To "survive" means for the worm to have temporal extension beyond a given time $t$, regardless of qualitative change.

  **Why It Is Verbal:**
  Both camps agree on the physical facts: the matter persists, the shape is lost and regained, and the causal history varies. They disagree on whether the loss of shape entails the cessation of the *entity* (Pluralist) or merely the cessation of the *description's applicability* to a temporal part (Monist). This is a disagreement over how to map linguistic terms ("statue," "object") onto the agreed-upon physical and temporal structure.

  **Neutral Reformulation:**
  Both camps should adopt the following neutral terminology for the purpose of further collaboration:
  *   Replace "The statue survives" with **"The statue-criteria continue to be satisfied by the material basis."**
  *   Replace "There are two objects" with **"There are two distinct sets of persistence conditions applicable to the same spacetime region."**
  *   Replace "Constitution" with **"The relation between the material basis and the form-satisfaction criteria."**

  This reformulation allows the Pluralist to maintain that the criteria sets are distinct (entailing distinct entities under their definition) and the Monist to maintain that the material basis is singular (entailing one entity under their definition), without talking past one another regarding the underlying physical and temporal facts.
