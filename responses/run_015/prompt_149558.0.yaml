      *   *Limitations:* The game tests *judgement of others* and *counterfactual stability*, but it can't access the *actual will* at the moment of action. It privileges the counterfactual test over the phenomenological experience of duty.

  5.  **Refining the "Overdetermination" Case:**
      *   Need a character who helps, enjoys it, *and* would have helped without enjoyment.
