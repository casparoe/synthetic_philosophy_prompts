      *   *Pivot:* Use a **Decision Game** with real stakes (chocolate/money) but focused on *praise allocation*.
      *   *Scenario:* "The Departmental Helper."
      *   *Mechanism:* Students are assigned roles (Helper, Observer, Beneficiary).
      *   *Round 1:* Helper helps Beneficiary. Helper gets Reward. Observers assign Praise Points.
