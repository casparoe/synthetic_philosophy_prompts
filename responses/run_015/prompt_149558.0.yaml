      *   *Revised Plan:* **The "Two-Round Contribution" Game.**
      *   All students participate.
      *   They make a choice in Round 1.
      *   They make a choice in Round 2.
      *   The conditions change secretly for different subgroups.
      *   *Crucial:* To avoid exposure, we aggregate data or use anonymous submission. But the prompt wants "arguing about cases."
      *   *Solution:* Use **Case Cards** assigned to individuals, but the *class* judges the *character on the card*, not the student holding it.
