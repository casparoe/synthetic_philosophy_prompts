answer: |-
  # Seminar Plan: The Motivation Machine

  **Module:** First-Year Ethics
  **Time:** 80 Minutes
  **Students:** 18
  **Budget:** £15 (Chocolate minis + Printing)
  **Goal:** Experience the gap between *outcome* and *motive* without initial theory.

  ## 1. Materials & Setup

  **Room:** Seminar table or clustered chairs.
  **On each desk (before they arrive):**
  *   2 plain white envelopes (labelled **Round 1** and **Round 2** on the back, invisible from front).
  *   2 identical slips of paper inside each envelope.
  *   1 pen.
  *   **The Task Sheet:** A single A5 card reading: *"Task: Fold the slip of paper into a neat triangle. Place it back in the envelope. Seal the envelope."*

  **Tutor Props:**
  *   **The Pot:** A clear box for collecting envelopes.
  *   **The Stakes:** A bowl of chocolate minis (approx. 40 units).
  *   **Case Cards:** 6 sets of 4 cards (laminated if possible). See *Section 3*.
  *   **Whiteboard:** Blank.

  ---

  ## 2. Timeline & Script

  ### Phase 1: The Live Counterfactual (20 Minutes)

  **00:00 – 05:00 | Introduction & Round 1**
  *   **Action:** Students sit. Do not mention ethics, Kant, or motives.
  *   **Script:** "Good morning. We're starting with a short activity. On your desk are two envelopes. Please open **Round 1** only. Read the card. You have 3 minutes to complete the task."
  *   **The Twist (Announce after they open):** "If you complete the task and seal the envelope, you will receive one chocolate at the end of this round. If you choose not to do it, simply leave the paper flat inside and seal it anyway. No one will see your choice but me."
  *   **Action:** Collect envelopes in the box. Count them visibly but quickly (or take the box aside). Distribute chocolates to those who complied (based on your quick count of 'bulky' vs 'flat' envelopes, or just give everyone one to save time and note the *honesty* of the claim later—*better:* ask them to self-report on a slip? No, too much friction. *Best:* Collect envelopes. Tell them you will count and reveal the % compliance. Do not distribute chocolate yet. Tell them chocolate comes at the very end if they completed Round 1. This keeps the stakes real for Round 2).
  *   **Correction for Flow:** To save time, tell them: "I will check these. If you completed the task, you get a chocolate at the *end of the seminar*. Please proceed to Round 2."

  **05:00 – 10:00 | Round 2 (The Drop)**
  *   **Script:** "Open **Round 2**. Read the card. It is the exact same task. Fold the paper. Seal the envelope."
  *   **The Change:** "There is **no chocolate** for this round. You may complete it or not. Again, your choice is anonymous."
  *   **Action:** Collect envelopes.
  *   **Script:** "I am counting these now. I will put the compliance rates on the board in ten minutes. For now, move into groups of three."

  **10:00 – 15:00 | Initial Reaction**
  *   **Action:** Write the two percentages on the board (e.g., *Round 1: 95% | Round 2: 55%*).
  *   **Script:** "Look at the board. The action was identical. The effort was identical. The result (a folded paper) was identical. The only thing that changed was the *context*. In your groups: Why do we look at those two numbers differently? Did the value of the act change? Why?"
  *   **Constraint:** Do not use words like 'moral', 'duty', or 'good'. Use 'credit', 'value', 'weight'.

  ### Phase 2: The Case Workshops (40 Minutes)

  **15:00 – 55:00 | Sorting the Cards**
  *   **Action:** Hand each group of 3 one set of **4 Case Cards** (see below) and a sheet of paper.
  *   **Task:** "Rank these four agents from 'Most Praise' to 'Least Praise'. You must agree on a single order. Be prepared to defend the top and bottom spots."
  *   **Tutor Role:** Circulate. Listen. If they use forbidden words ('duty', 'Kant'), gently interrupt: "Describe the *reason* they acted, don't name the theory." If a group finishes early, ask: "Swap the top two. Can you argue for that order instead?"

  **The Case Cards (Print 6 sets):**

  > **CARD A: The Reluctant Helper**
  > Jamie sees a colleague struggling with heavy boxes. Jamie dislikes the colleague. Jamie finds lifting boxes tedious. Jamie helps anyway, thinking: "It's the right thing to do, even though I hate it."
  >
  > **CARD B: The Cheerful Helper**
  > Alex sees a colleague struggling with heavy boxes. Alex likes the colleague. Alex enjoys lifting boxes. Alex helps, thinking: "This is fun and I like them." (If Alex disliked them and hated lifting, Alex would *not* have helped).
  >
  > **CARD C: The Steadfast Helper**
  > Taylor sees a colleague struggling with heavy boxes. Taylor enjoys lifting boxes and likes the colleague. Taylor helps. However, Taylor also thinks: "Even if I hated this and disliked them, I would still help because it's required."
  >
  > **CARD D: The Automatic System**
  > The department installs a sensor. When a colleague struggles, a motorised trolley automatically appears and moves the boxes. The colleague is helped exactly as much as in the other cases. No human made a choice.

  **55:00 – 60:00 | The Plenary Challenge**
  *   **Action:** Bring class back together. Ask one group for their ranking. Ask another group if they disagree.
  *   **Focus:** Push hard on **Card C (The Steadfast Helper)**.
  *   **Script:** "Some of you put Taylor above Jamie. Some put Taylor below. Why? Taylor has everything Alex has (enjoyment) *plus* everything Jamie has (willingness to do it without enjoyment). Why would having *more* reasons ever make someone *less* praiseworthy?"
  *   **Goal:** Let them wrestle with the **Overdetermination** problem. Do not solve it yet.

  ### Phase 3: The Debrief (20 Minutes)

  **60:00 – 70:00 | Naming the Distinction**
  *   **Script:** "You've just reconstructed a very famous philosophical problem without me telling you what it was. You noticed that we care about *why* someone acted, not just *what* they did."
  *   **Board Work:** Draw two columns.
      *   **Left:** *In Accordance With* (The act matches what is required).
      *   **Right:** *From* (The act is done *because* it is required).
  *   **Mapping:**
      *   **Round 1 (Chocolate):** *In Accordance With.* (You did the right thing, but for the treat).
      *   **Round 2 (No Chocolate):** Closer to *From.* (You did it without the treat).
      *   **Card A (Jamie):** *From.* (Pure motive).
      *   **Card B (Alex):** *In Accordance With.* (Inclination only).
      *   **Card C (Taylor):** The **Overdetermined** case. (The puzzle you argued about).
      *   **Card D (Machine):** No Will. (Outcome exists, moral worth does not).

  **70:00 – 75:00 | The Counterfactual Test**
  *   **Script:** "How did you judge Alex (Card B)? You likely asked: 'Would Alex have done it if the fun was gone?' This is the **Counterfactual Test**. We strip away the incentives to see if the motive remains. You lived this in Round 1 vs Round 2."
  *   **Script:** "But notice the limit. We can't see inside Taylor's head. We can only test what happens when we remove incentives. This is why philosophers argue about whether 'enjoying' the right thing ruins the 'goodness' of it."

  **75:00 – 80:00 | Closing & Stakes**
  *   **Action:** Distribute chocolates to everyone who *claimed* compliance in Round 1 (honour system for the sake of time, or quick check if you kept envelopes).
  *   **Script:** "Keep the chocolate. It's a reward for participation. But ask yourself: does the chocolate taste different now that we've talked about why you earned it? Next week: Kant."

  ---

  ## 3. Troubleshooting: Predictable Failures

  **1. The Strategist ("I see what you're doing.")**
  *   **Behaviour:** A student raises their hand in Phase 1 and says, "This is about Kantian ethics, isn't it? You're testing if we do it for duty."
  *   **Response:** "It might be. But right now I'm asking you to describe your *judgement* of the action, not identify the syllabus. Even if you know the theory, does your *instinct* change when the chocolate disappears? Stick with the instinct."
  *   **Prevention:** Keep your face neutral. Do not nod enthusiastically when they do the 'right' thing in Round 2.

  **2. The Moraliser ("People *should* do it anyway.")**
  *   **Behaviour:** In Phase 2, a student refuses to rank Card B lower than Card A. "Alex helped! That's what matters. We shouldn't punish people for enjoying good deeds."
  *   **Response:** "You're arguing about *policy* (how we should encourage behaviour). The rest of the group is arguing about *credit* (how we admire the character). Both are valid, but keep them separate. Does the *admiration* change, even if the *outcome* is the same?"

  **3. The Yes-Man ("I'll just do what you want.")**
  *   **Behaviour:** A student whispers, "Do we get marks for this?" or tries to peek at others' envelopes in Round 2 to conform.
  *   **Response:** "There are no marks. This is data. If you don't fold the paper, that is just as useful to me as if you do. In fact, honesty about your motives is more useful than fake compliance."
  *   **Privacy safeguard:** Ensure the collection box is far enough away that no one sees who drops what.

  **4. The Cynic ("This is stupid/childish.")**
  *   **Behaviour:** Refuses to fold the paper. Crumples it.
  *   **Response:** "That's a valid choice. Put it in the envelope. Your data point is 'Refusal'. That tells us something about the incentive structure." (Do not shame them; their refusal validates the need for the seminar).

  ---

  ## 4. Limitations: What This Activity Cannot Do

  *Be honest about this in the debrief or your own notes.*

  1.  **The Phenomenology of Duty:** The game relies on the **Counterfactual Test** (would you do it if X was removed?). It cannot access the **Actual Maxim** (what was actually in the mind *at the moment* of action). A student might fold the paper in Round 2 *because* they want to look good in front of you (a hidden incentive). The game treats them as 'acting from duty', but they are actually 'acting from pride'. You will need to state in plain words: *"This game tests stability of choice, not purity of heart. Kant cares about purity of heart. That's harder to measure."*
  2.  **Rigged towards Consequences:** Because there are real stakes (chocolate), the setup subtly encourages a consequentialist view (maximise chocolate vs. minimise effort). You must actively steer them back to *motive* during the debrief.
  3.  **The Overdetermination Problem:** The game highlights the tension in Card C, but it doesn't solve it. Kant's view is controversial here (he suggests inclination *detracts* from worth). Some students will feel this is harsh. You must validate that disagreement: *"Kant thinks enjoyment clouds the moral signal. Many modern philosophers disagree. You felt that disagreement in your groups."*

  ## 5. Tutor's Cheat Sheet (Key Phrases to Avoid/Use)

  | **DO NOT SAY (Until 60:00)** | **SAY INSTEAD** |
  | :--- | :--- |
  | "Moral Worth" | "Credit", "Praise", "Value" |
  | "Duty" | "Requirement", "What's expected", "The rule" |
  | "Inclination" | "Desire", "Enjoyment", "Incentive" |
  | "Maxim" | "Reason", "Thought process" |
  | "Categorical Imperative" | "The Test", "The Rule" |

