answer: |-
  ### Outline of Argumentative Moves

  **Dr. Aris Thorne (Refined Adaptationist)**
  1.  **The Credible Commitment Argument:** The asymmetry is functional; rigid moral reasoning signals reliability to coalitions (public), while hyperbolic discounting preserves flexibility for immediate survival risks (private), optimizing fitness in social environments.
  2.  **Architectural Selectionism:** While predictive coding is the mechanism, the specific hierarchical structure that allows for this dissociation was selected for because it enables the separation of public signaling from private valuation.
  3.  **Comparative Continuity:** Primate social policing and reputation management show precursors to this asymmetry, suggesting a phylogenetic trajectory driven by selection for coalition stability rather than arbitrary structural noise.

  **Dr. Lena Kowalski (Spandrels/Structuralist)**
  1.  **The Hierarchical Mismatch Argument:** The asymmetry arises from a conflict between fast, affective predictive models (sensory-motor) and slow, linguistic narrative models (recursive self-modeling), not a selected moral module.
  2.  **Utility vs. Origin:** Even if the asymmetry currently functions as a commitment device, this is a co-opted utility (exaptation); the phenomenon originated as a necessary byproduct of scaling predictive architecture for language.
  3.  **Computational Universals:** Similar representational conflicts appear in artificial hierarchical predictive systems without social selection pressures, indicating the asymmetry is a structural constraint of complex prediction, not a specific biological adaptation.

  ***

  ### Dialogue: The Architecture of Future Selves

  **Dr. Aris Thorne:** Lena, let's confront the asymmetry directly. We observe agents who swear deontological oaths regarding their future health or financial solvency—treating the future self as a rights-bearing entity—yet economically discount that same future self at rates that verge on the suicidal. My claim is that this isn't a cognitive failure. It is a dual-strategy adaptation. The rigid moral stance acts as a credible commitment device observable by the coalition, ensuring you remain a viable partner for long-term reciprocity. The hyperbolic discounting governs private affective forecasting, allowing flexibility when immediate survival threats arise. Selection favors the split, not the consistency.

  **Dr. Lena Kowalski:** Aris, you are conflating current utility with historical origin. That this asymmetry *can* serve reputation management does not mean it was *selected* for it. My position is that this is a spandrel of the brain's hierarchical predictive coding architecture. You have fast, sub-cortical loops evolved for sensory-motor prediction operating on immediate timeframes, and you have slow, cortical narrative loops evolved for language and recursive self-modeling. The "moral future self" is a linguistic artifact forced onto a system that doesn't naturally track long-term welfare affectively. The asymmetry isn't a design feature; it's the friction noise when you force two incompatible temporal representations into coherence.

  **Thorne:** But friction noise doesn't typically yield such specific, game-theoretically optimal configurations. If this were merely architectural drag, why does the "moral" mode align so precisely with public observability? You argue it's a mismatch between affective and linguistic models. I counter that the architecture itself was shaped to permit this dissociation. Selection doesn't just pick behaviors; it picks substrates. If the predictive coding hierarchy allows for a public/private split in temporal valuation, that structural capacity was likely retained because it solved the problem of cheating in social contracts. You're treating the architecture as a constraint independent of selection, but the architecture is the fossil record of past selection.

  **Kowalski:** That is a convenient retreat into deep-time selectionism, but it ignores the comparative evidence. If this were a specific adaptation for human coalition stability, we should see precursors in primates who engage in complex social policing. Yet, while chimps manage reputation, they do not exhibit this specific deontological/hyperbolic split regarding their *own* future welfare. They don't make moral promises to their future selves. This suggests the "moral" side of the asymmetry is unique to the human capacity for narrative self-modeling. It arises when we exapted our predictive machinery for language. The conflict is inevitable whenever you try to map discrete linguistic categories onto continuous affective states over time. It's a structural necessity of recursion, not a social tool.

  **Thorne:** I disagree on the primate data. We see self-control mechanisms in primates that correlate with social rank—subordinates discount heavily, dominants delay gratification. This suggests the regulatory capacity is tied to social standing. But let's grant your point on narrative. Even if the *content* is linguistic, the *capacity* to maintain conflicting valuation models is costly. Cognitive dissonance is metabolically expensive. Why would selection tolerate the energy cost of maintaining two contradictory temporal models unless the payoff—social trustworthiness—outweighed the cost? If it were merely a spandrel, we would expect natural selection to minimize the conflict, to smooth the friction. The persistence of the asymmetry suggests the friction is functional.

  **Kowalski:** Or, the friction is unavoidable given the computational requirements of language. Consider artificial hierarchical predictive systems. When we train neural nets to predict both immediate sensory inputs and long-term narrative structures, we see similar valuation conflicts emerge without any selection for "social reputation." The system values the immediate loss function differently than the long-term generative model. This isn't because the AI is trying to signal credibility to other AIs. It's because hierarchical prediction inherently creates temporal disconnects between layers. If silicon exhibits this asymmetry without social selection, it undermines your claim that the human case is an adaptation for coalition stability. It suggests it's a universal property of hierarchical predictors.

  **Thorne:** But artificial systems are designed by humans who *do* have these adaptations. You're importing our architectural biases into the silicon. Furthermore, your explanation relocates the burden rather than lifting it. You say it's a byproduct of forcing affective and linguistic representations into coherence. Fine. But why does the linguistic representation take a *deontological* form specifically? Why not probabilistic? Why not utilitarian? The fact that the narrative layer adopts the language of strict obligation suggests it is serving a specific function—binding the agent. A spandrel explains the existence of the gap, Aris, but it doesn't explain the specific normative content filling that gap. Adaptationism explains the content.

  **Kowalski:** The normative content is a cultural elaboration on a structural weakness, Aris. We use deontology because it's the only linguistic tool strong enough to attempt to bridge the affective gap, not because it was selected to do so. It's a patch, not a feature. You argue that selection tolerates the cost because of the social payoff. I argue the social payoff is a secondary co-option. The primary cause is the architectural impossibility of perfectly aligning sensory-motor time with narrative time. You treat the brain as an optimizer; I treat it as a kludge. The question is whether the "kludge" explanation is sufficient. If I can show that any system with our predictive architecture *must* exhibit this asymmetry regardless of social environment, your adaptationist story becomes merely a just-so narrative about how we learned to live with our bugs.

  **Thorne:** And if I can show that variations in this asymmetry correlate with social complexity across cultures, then your structuralist claim loses its universality. If it were a hard architectural constraint, it should be invariant. But we see cultural modulation of future discounting and moral rigidity. This plasticity suggests the system is tuned by selection pressures, not locked by structural necessity. You call it a kludge; I call it a tunable interface. The tension between the two selves isn't a failure of integration; it's the mechanism by which we negotiate between immediate survival and long-term social investment.

  **Kowalski:** Plasticity doesn't prove adaptation; it proves regulatory capacity. We can regulate many byproducts. The core tension remains: is the asymmetry a tool forged for social signaling, or is it the shadow cast by a brain trying to speak about a future it cannot feel? I maintain that until you can disentangle the architectural necessity of recursive prediction from the social utility of commitment, your adaptationist account is assuming what it needs to prove.

  **Thorne:** And until you can explain why the "shadow" takes the precise functional form of a credible commitment device rather than random noise, your spandrel account is merely describing the mechanism without explaining the phenotype. We are left with a mechanism that looks like a bug but acts like a feature.

  **Kowalski:** Then perhaps the distinction between bug and feature is the very illusion the narrative self creates to justify the architecture's limitations.

  Verdict: The dialogue remains unresolved on whether the asymmetry between moral rigidity and economic discounting is a selected functional tool for social signaling or an inevitable structural byproduct of hierarchical predictive processing.
