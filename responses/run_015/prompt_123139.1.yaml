  **DEPARTMENT OF COOPERATIVE COMPLIANCE**
  **Bureau of Utterer's Meaning**
  **Form IC-4: Declaration of Conversational Implicature**

  **OMB Control No. 1967-GRICE**
  **Expiration Date: Eternity**

  **PURPOSE OF FORM:**
  Under the Cooperative Principle Act, all speakers must account for the "Grice Gap"—the assessable surplus of meaning conveyed beyond literal semantic content. Failure to file this form constitutes a violation of the Maxim of Quantity. By submitting this document, you acknowledge that what you meant is taxable, even if what you said was not.

  **SECTION 1: CLASSIFICATION OF LIABILITY**
  Check exactly one box. Incorrect classification may be interpreted as a flout of the Maxim of Manner.

  [ ] **Generalized Conversational Implicature.** Standardized surplus meaning attached to specific terms (e.g., "some" implies "not all"). Subject to a flat semantic rate. No narrative required.
  [ ] **Particularized Conversational Implicature.** Context-dependent meaning. Filers must attach a narrative reconstruction of the specific context and a step-by-step "calculation" showing how a reasonable hearer was intended to derive the meaning.
  [ ] **Conventional Implicature.** Meaning carried by words such as "but," "therefore," or "even." **STOP.** Do not file. NOT OUR JURISDICTION. REFER TO OFFICE OF LEXICAL CONTENT. Penalties apply for misuse of Bureau resources.

  **SECTION 2: MAXIM EXPLOITATION DECLARATION**
  Identify which Maxim was exploited to generate the Grice Gap. Selecting a method of exploitation is an admission of intent.

  *   **Quality:** Did you say something false? [ ] Yes [ ] No
  *   **Quantity:** Did you say too little? [ ] Yes [ ] No
  *   **Relation:** Was it irrelevant? [ ] Yes [ ] No
  *   **Manner:** Were you obscure? [ ] Yes [ ] No

  **Method of Exploitation:**
  [ ] **Flouting:** Openly breaking the maxim to generate meaning. (Warning: Filing this box confirms you meant the implicature, rendering it non-cancellable.)
  [ ] **Violating:** Secretly breaking the maxim. (Warning: If detected by audit, you are liable for deceit.)
  [ ] **Infringing:** Unable to follow the maxim due to language barrier or intoxication. (Requires medical certification.)
  [ ] **Opting Out:** Explicitly stating you are not cooperating. (See Section 3, Clause C.)

  **SECTION 3: COMPLIANCE MECHANISMS & NULLIFICATION**
  **A. The Explicitation Paradox:** Filers may attempt to reduce liability by explicitly stating the implicature. However, writing the implicature down converts it into semantic content. This form therefore destroys the very object it reports. You are filing to report a meaning that ceases to exist upon reporting.
  **B. Non-Detachability:** You may not rephrase your utterance to avoid liability. Any alternative phrasing that preserves the original semantic content preserves the implicature liability. There is no loophole via synonym.
  **C. Constructive Cooperation:** You may not opt out of the Cooperative Principle. The act of filing an "Opt Out" declaration is itself a contribution to the exchange and implies you are cooperating with the Bureau. Thus, all opt-outs are void.
  **D. The Cancellation Rider:** You may cancel an implicature by adding context (e.g., "Some of them, in fact all of them"). However, Riders filed after the moment of utterance are void. Since this form is filed post-utterance, honest declarants are permanently late.

  **SECTION 4: EXTERNAL TESTIMONY & JURISDICTIONAL DISPUTES**
  The Bureau acknowledges ongoing litigation regarding the boundaries of meaning.

  *Exhibit A (Statement of Dr. Aris Thorne, Institute for Formal Semantics):* "This is category error. Implicature is pragmatic inference, not content. The Bureau has no jurisdiction over what people guess. You might as well tax the weather." (Note: Dr. Thorne's statement implicates that he is uncooperative. Audit scheduled.)

  *Exhibit B (Statement of Taxpayer #8940):* "I tried to comply. I only said what was literally true. I stood at the bus stop and said 'The bus arrives or it does not.' They fined me for violating the Maxim of Quantity. I don't know what else to say."

  **SECTION 5: ASSESSMENT & INDETERMINACY**
  Be advised that implicature is inherently indeterminate. Two auditors assessing the same utterance may calculate different meanings. Both assessments are correct. You are liable for the sum of all possible interpretations.

  **SECTION 6: SIGNATURE & REFLEXIVE INTENTION**
  By signing below, you certify that you possessed the reflexive intention that the hearer recognize your intention to produce this effect.

  __________________________
  **Signature of Utterer**

  ***

  **AUDITOR NOTE (FIELD OFFICE 4):** *We have a problem with the signature block. The form requires the speaker to sign their reflexive intention. But the intention is that the hearer recognizes the intention. If I sign here as the auditor, am I the hearer? If I recognize it, does that make it true? If I don't, is the form void? Also, the taxpayer left the box blank, which implicates that they refuse to sign, which implicates guilt. I'm marking it compliant.*

  **FOR BUREAU USE ONLY:**
  [ ] Grice Gap Closed
  [ ] Grice Gap Widened
