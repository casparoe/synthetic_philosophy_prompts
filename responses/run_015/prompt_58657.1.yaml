  Based on the tutor's six positions, we can reconstruct their underlying semantic and metaphysical commitments regarding future contingents. The tutor distinguishes sharply between events that are *causally determined* (tides, eclipses) and those that are *metaphysically open* (sea battles dependent on free choice). The following two principles fit the prior six positions but diverge on the sailor's dispute.

  ### Two Candidate Principles

  **Principle 1: The Settledness Condition on Truth**
  A future-tensed proposition is true at the time of utterance if and only if the event described is metaphysically settled or causally determined at that time. If the future is genuinely open regarding the event, the proposition lacks a truth value (or is indeterminate) at the time of utterance, regardless of how events subsequently unfold. Truth is indexed to the metaphysical state of the world *at the time of evaluation*.

  **Principle 2: The Retrospective Correspondence Condition**
  A future-tensed proposition is true if and only if the event described actually occurs. However, the *warranted assertion* or *endorsement* of such a proposition as true requires that the event be settled at the time of utterance. On this view, truth is a timeless relation of correspondence between the proposition and the actual history, but the tutor's refusal to endorse future contingents as "true now" (Position 1) reflects an epistemic or assertibility constraint rather than a lack of truth value. "True when made" is satisfied if the prediction corresponds to the actual outcome, even if that outcome was contingent at the time.

  ### Predictions on the Sailor's Dispute

  **Under Principle 1 (Settledness Condition):**
  *   **Prediction:** The sailor did **not** speak truly yesterday.
  *   **Reward:** The reward is **not due**.
  *   **Reasoning:** Yesterday, the admiral's decision was open; therefore, the proposition "There will be a sea battle today" was not metaphysically settled. According to this principle, the utterance lacked a truth value (or was not true) at the time it was made. The fact that the battle is occurring today does not retroactively confer truth upon the utterance *at the time it was made*. The captain's condition ("true when made") refers to the truth status at the time of utterance, which was indeterminate.

  **Under Principle 2 (Retrospective Correspondence):**
  *   **Prediction:** The sailor **did** speak truly yesterday.
  *   **Reward:** The reward **is due**.
  *   **Reasoning:** The battle is in fact taking place, so the proposition corresponds to the actual course of history. While the tutor (and the sailor) could not properly *assert* or *know* it was true yesterday (due to the openness described in Position 1), the proposition itself was true *simpliciter*. The captain's condition ("true when made") is satisfied because the proposition expressed was, as a matter of fact, a true description of the future, even if its truth was inaccessible at the time.

  ### Conjecture on the Tutor's Implicit Rule

  The tutor is more likely implicitly employing **Principle 1 (The Settledness Condition)**.

  **Reasoning:**
  While both principles can accommodate the six prior positions, Principle 1 offers a more coherent explanation of the specific *ontological* distinctions the tutor draws.
  1.  **Position 1 vs. Position 4:** The tutor explicitly contrasts the sea battle (not true now) with the tide (true now). If Principle 2 were in play, the distinction would merely be epistemic (one is known, one is unknown). However, the tutor's language ("holds that neither... [is] true now") suggests an ontological gap, not merely an epistemic limitation.
  2.  **Position 5:** The tutor holds that claims of *inevitability* regarding the battle are *false*. If Principle 2 (Timeless Truth) were operative, the future *is* inevitable in the sense that only one history is actual. Principle 1 explains Position 5 naturally: claims of inevitability are false because the metaphysical reality is genuinely branching/open.
  3.  **Position 6:** The eclipse case fits Principle 1 perfectly because eclipses are causally determined. They were *settled* last week, so they were *true* last week. This does not require retroactive truth; it requires only settledness.
  4.  **Overall Coherence:** Principle 1 unifies the tutor's view that truth tracks *metaphysical settledness*. Position 1 (Contingent = Not True), Position 4 (Determined = True), and Position 6 (Determined = True) all follow from a single rule: Truth requires Settledness. Principle 2 requires treating "true" in Position 1 as "assertibly true" and "true" in Position 6 as "correspondence true," implying an equivocation in the tutor's usage.

  ### Further Hypothetical Discriminating Case

  To decisively discriminate between these principles, consider the case of a **Conjoined Prediction of Outcome and Openness**.

  **The Case:**
  Yesterday, while the admiral's decision was still open, a philosopher-sailor asserted: *"There will be a sea battle today, and it is not now settled that there will be a sea battle."* Today, the sea battle is taking place. The captain offers the reward for any assertion that was **true when made**.

  **Discrimination:**
  *   **Principle 1 (Settledness) predicts the reward is DENIED.**
      On this view, the first conjunct ("There will be a sea battle") was not true yesterday (it was indeterminate). Therefore, the conjunction is not true. The fact that the battle occurred today does not make the first conjunct true *yesterday*.
  *   **Principle 2 (Retrospective Correspondence) predicts the reward is GRANTED.**
      On this view, the first conjunct is true because the battle actually occurred (retroactive correspondence). The second conjunct ("It is not now settled") was true yesterday because the decision was genuinely open at that time. Since both conjuncts are true (one retroactively, one contemporaneously), the assertion was "true when made."

  This case forces a conflict between the *temporal indexicality* of truth (Principle 1) and the *timeless correspondence* of truth (Principle 2) regarding the specific conjunct describing the future event.
