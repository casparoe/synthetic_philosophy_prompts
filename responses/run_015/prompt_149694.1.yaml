  5.  **Address Question 3: New Cases & Restricted Hypotheses:**
      *   *Mars Bag:* No ravens on Mars. $P(Raven) = 0$. Confirmation = 0. (Motivates "Relevant Population" clause).
      *   *Exhaustive Sweep:* If you check *every* non-black thing in a valley and find no ravens, you have proven "All ravens in this valley are black" (if the domain is closed). If universal, it strongly confirms because it reduces the unknown space. (Motivates "Sampling Fraction" clause).
      *   *Genomic Raven:* This tests the *mechanism*, not just the generalization. Confirms strongly because it rules out environmental whitening. (Motivates "Detection Capability" clause).
      *   *1890 Drawer:* Background knowledge matters. In 1890, "raven" might have included other corvids. Contextual priors.
      *   *Restricted Hypothesis:* "All ravens in this valley." This changes the reference class. A white shoe in the valley is now much stronger evidence than a white shoe in London. This aligns perfectly with the user's intuition in Cases 8 & 9.

  6.  **Drafting the Response:**
      *   *Tone:* Respectful, collegial, acknowledging the user's expertise. Avoid overly dense symbolic logic without explanation. Use the biologist's language (sampling, populations, detection).
