  2.  **Deconstruct the Raven Paradox & The User's Intuitions:**
      *   *Standard Logic:* $H: \forall x (Rx \to Bx)$. Equivalent to $\forall x (\neg Bx \to \neg Rx)$. Observing $\neg Bx \land \neg Rx$ (white shoe) confirms the contrapositive, thus confirms $H$.
      *   *User's Intuition:* Context matters. Sampling matters. A shoe in a hallway isn't a test of ravens. A shoe in a raven survey *is* a test of the environment where ravens might be.
