      *   *Bayesian Solution:* This is the standard resolution for scientists (Good, Hosiasson, etc.). Confirmation is an increase in probability $P(H|E) > P(H)$.
      *   *The Math:*
          *   $H$: All ravens are black.
          *   $E$: Object is non-black and non-raven (white shoe).
