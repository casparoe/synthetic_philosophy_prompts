      *   *Cheapest Concession:* Admit that Case 7 *does* confirm the hypothesis, but by an amount so infinitesimally small that for all practical biological purposes, it is zero. The "Gut" is right about the *magnitude*, wrong about the *binary status*.
      *   *Alternative Concession:* Deny the Equivalence Condition for confirmation (Some philosophers do this, e.g., relevant logic). But for a scientist, logical equivalence is usually sacrosanct.
