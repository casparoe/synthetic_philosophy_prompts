answer: |-
  Good evening. I call this special town meeting to order.

  We are here for a single purpose: to decide whether Westhollow should merge with Kestrel into one municipality. But before we can vote yes or no on the merger, we must answer a harder question: whose vote counts?

  Our current rules say resident taxpayers vote. But this merger would void those rules. Using the current rules to decide whether to destroy them is a loop. We cannot say "the law decides," because the law is exactly what is on the table. We cannot say "everyone affected should vote," because affect spreads outward forever. The commuter working here for nine hours is affected. The upstream neighbor relying on our watershed is affected. The chain of consequence does not stop where our town line does.

  Look around this room. The volunteer fire chief stands here. The owner of the diner on the green stands here. Tenants who pay rent but no property tax stand here. Commuters who sleep elsewhere stand here. Households from the unincorporated hamlet upstream stand here. You are all here because the outcome touches you. But in this room, the person who is governed, the person who has a stake, and the person bound by the outcome are not always the same person. Tonight, we are voting on which of those overlaps matters.

  One proposal suggests we count not who stands here today, but who will be governed tomorrow. It would enfranchise tenants who signed leases for July and students arriving in September. It would arguably weaken the claim of those most likely to leave. This mirrors the future government, not the current residents. It is a strange thing to ask a room to decide the rights of people who are not yet here. It treats the town as a promise rather than a place. It is logically clean, but it feels unfamiliar.

  We must choose a boundary before we can cross it. Whatever line we draw, someone who cares deeply about this town may be left outside it. That is the cost of drawing a line. But without a line, we have no meeting. We are not voting on Kestrel tonight. We are voting on the list of names.

  I invite the first motion on who is entitled to vote on the merger article.

  ***

  **Refusals and Costs**

  1.  **Refusal to define "affectedness":** I stated the chain of consequence never stops rather than setting a threshold. *Cost:* This leaves the diner owner without a clear rule of thumb, forcing her to weigh abstract degrees of impact herself.
  2.  **Refusal to endorse the reverse-mirror rule:** I described its strangeness ("people not yet here") without judging its validity. *Cost:* This denies the selectman who proposed it the comfort of moderator validation, potentially slowing the initial motion-making.
  3.  **Refusal to cite the current Charter:** I explicitly called the charter's authority into question rather than treating it as default. *Cost:* This creates procedural uncertainty for the clerk and risks legal challenge if the vote is contested later.
