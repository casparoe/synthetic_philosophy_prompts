answer: |-
  Execute this four-step Lifecycle Integrity Check—verify non-negotiable constraints, audit pre-registered predictions against outcomes, distinguish new capabilities from compatibility shims, and count consecutive quarters of stagnation—to reach these verdicts: migrate the Python search monolith despite its recent latency win because its complexity debt signals terminal degeneration, freeze the ML platform until it logs hypotheses before training, and classify billing as a Compliance Mandate outside this scoring system.

  ### The Decision Procedure (90 Minutes)

  **Step 1: The Mandate Check (10 mins)**
  *   **Question:** Is there an external constraint (legal, contractual, safety) that forbids killing or fundamentally altering this system?
  *   **Sufficient Answer:** Yes/No with cited contract clause or law.
  *   **Stop Condition:** If **Yes**, verdict is **Compliance Lock**. Funding continues regardless of technical merit. Sign-off required from VP of Product or Legal, not Engineering.
  *   **Handoff:** If **No**, proceed to Step 2.
  *   *Why this handles Hard Case 3:* It removes business fiat from the technical evaluation. You don't measure "progress" on a tax form; you just file it.

  **Step 2: The Prediction Ledger (20 mins)**
  *   **Question:** Did we write down what specific capability or metric improvement this quarter's work would deliver *before* the work started?
  *   **Sufficient Answer:** A link to a design doc, ticket, or email timestamped prior to the first commit of the cycle.
  *   **Stop Condition:** If **No** for the last 3 quarters, verdict is **Freeze**. The team is accommodating facts, not predicting them.
  *   **Who Writes It:** The Staff Engineer or Architect *owning the review process* (you), not the team lead. They must sign off on the prediction doc before sprint planning.
  *   **Where:** A central "Architecture Decisions" repository, not the team's private Jira board.
  *   *Why this handles Hard Case 2:* It prevents self-certification. If the team lead writes it the day before the review, you reject it.
  *   **Handoff:** If **Yes**, proceed to Step 3.

  **Step 3: Novelty vs. Shim (30 mins)**
  *   **Question:** Did the work enable a *new* user behavior or system capability, or did it merely maintain existing behavior despite environmental changes?
  *   **Sufficient Answer:** "New" means a user can do something they couldn't before, or the system handles 2x load without manual intervention. "Maintain" means adding a config flag, a compat shim, or fixing a regression caused by a previous shim.
  *   **Stop Condition:** If the ratio of Shims to New Capabilities is >1:1 over the last year, verdict is **Degenerating**.
  *   **Metric Rule:** If metrics are noisy (Hard Case 1), ignore the percentage gain. Look at the *mechanism*. Did you add a flag to make the test pass? That's an immunizing stratagem. Did you change the index structure to make the test pass? That's a belt adjustment. Flags = Degeneration. Structural changes = Progress.
  *   **Handoff:** If **Progressive**, proceed to Step 4. If **Degenerating**, proceed to Step 4 (to check the streak).

  **Step 4: The Streak (20 mins)**
  *   **Question:** How many consecutive quarters has the system been in a Degenerating state?
  *   **Sufficient Answer:** Count of quarters where Step 2 or Step 3 failed.
  *   **Stop Condition:** If **≥ 3 Quarters**, verdict is **Kill/Migrate**.
  *   **Exception:** If a single "Big Bet" was pre-registered (Step 2) and is mid-flight (e.g., quarter 2 of a 4-quarter rewrite), extend the window to 5 quarters.
  *   **Handoff:** If **< 3 Quarters**, verdict is **Keep** (with warning).
  *   *Why this handles Hard Case 4:* It acknowledges that good systems have bad quarters, but patterns reveal truth.

  ### Concept Translation & Dropped Ideas

  **Translated Concepts:**
  *   **Hard Core → Non-Negotiable Constraints:** The things you cannot touch without the system ceasing to be itself (or violating law).
  *   **Protective Belt → Implementation Details:** The code, configs, and shims you change to protect the core.
  *   **Negative Heuristic → Don't Touch Rules:** Guidelines on what not to modify (e.g., "Don't change the API signature").
  *   **Positive Heuristic → Roadmap:** The plan for expanding capabilities.
  *   **Progressive Problem Shift → New Capabilities:** Predicting and delivering novel facts/features.
  *   **Degenerating Problem Shift → Patching:** Explaining away failures with ad-hoc additions (shims) without new value.
  *   **Immunizing Stratagem → Metric Hacking:** Changing the definition of success or adding flags solely to make a test pass.

  **Dropped Concepts:**
  *   **Internal vs. External History:** Lakatos distinguishes between the rational reconstruction of science and the actual sociological history. I dropped this because you don't have the bandwidth to audit the sociological history of your team; you only have the artifacts (docs, commits).
  *   **Verisimilitude (Truth-likeness):** Too abstract for engineering. We care about utility and predictability, not philosophical truth.
  *   **Scientific Community Sociology:** Lakatos discusses how communities accept/reject programmes. I dropped this because your "community" is just the senior eng team; power dynamics are explicit, not implicit.

  ### Scenario Runs

  **1. Python 2 Search Monolith (9 years old, 40 flags, recent latency win)**
  *   **Step 1:** No legal mandate. Proceed.
  *   **Step 2:** They predicted the latency win. Pass.
  *   **Step 3:** They hit the win, but the mechanism was likely tuning within the existing monolith. However, the presence of 40 compat flags indicates the "Belt" is bloated. Every flag is a patch to keep the core alive against modern reality. This is high "Shim Count." The latency win is a local optimization on a rotting structure.
  *   **Step 4:** Even if this quarter was progressive, the streak of adding flags (degeneration) likely exceeds 3 quarters.
  *   **Verdict:** **Kill/Migrate.**
  *   **Unpopular Opinion:** You will hate this. The system just proved it can still perform. But Lakatos warns that a programme can be locally progressive while globally degenerating. The 40 flags are the signal: you are spending more energy protecting the past than building the future. The latency win is a "face-saving" device to delay the rewrite.

  **2. ML Feature Platform (18 months old, ships constantly, explains past, never predicts)**
  *   **Step 1:** No legal mandate. Proceed.
  *   **Step 2:** They never called improvements in advance. They explain them after the fact. Fail.
  *   **Step 3:** They ship constantly, but if they can't predict what will work, they are fitting curves to noise, not discovering capabilities. This is classic accommodation.
  *   **Step 4:** This has been the mode for 18 months (6 quarters).
  *   **Verdict:** **Freeze.**
  *   **Reasoning:** Stop new feature development. Allow only bug fixes until they institute a hypothesis ledger (Step 2). If they can't predict what their models will do, they are running a degenerating programme disguised as innovation.

  **3. Billing Service (Byte-for-byte reproducibility required)**
  *   **Step 1:** Legal requirement for reproducibility.
  *   **Verdict:** **Compliance Lock.**
  *   **Reasoning:** Do not run Steps 2-4. This system is not judged on "progress." It is judged on "correctness." Funding is guaranteed until the law changes. Any attempt to "innovate" here must be vetted by Legal, not Engineering.

  ### Limitations & Failure Modes

  **Where This Will Misfire:**
  1.  **Foundation Work:** Sometimes you need to refactor without delivering user value (paying down tech debt). This procedure might flag that as degeneration. *Fix:* Allow one "Infrastructure Quarter" per year where the prediction is "Reduced Incident Rate" rather than "New Feature."
  2.  **Exploratory Research:** The ML freeze might kill genuine discovery. Some work is inherently unpredictable. *Fix:* Create a separate "Research" bucket with a different ledger (hypothesis logging required, but failure is acceptable).
  3.  **Gaming the Ledger:** Teams will start writing vague predictions ("Improve performance") to pass Step 2. *Fix:* You (Staff Eng) must reject vague predictions during the pre-sign-off. "Improve latency by 10%" is valid. "Make it faster" is not.
  4.  **Political Blowback:** The "Compliance Lock" will annoy engineers who want to modernize billing. *Fix:* Enforce the VP/Legal sign-off strictly. If Legal won't sign off on the risk, Engineering doesn't touch it.

  **What This Can't Do:**
  *   It cannot tell you *what* to build next, only whether to stop building the current thing.
  *   It cannot resolve disputes about whether a shim is "necessary" or "lazy" without a trusted arbiter (you).
  *   It cannot save a system where the business case has vanished but the engineers are having fun. That requires a business decision, not a technical one.
