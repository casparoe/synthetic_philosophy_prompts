answer: |-
  Hi there,

  It is great to finally put this down in terms we both speak fluently, because you are right that the popular physics analogies often obscure more than they reveal when we are trying to pin down the ontological commitments. If we treat the universe as a database system, the mapping of the major positions becomes surprisingly sharp, though as you suspect, the cracks appear in the residue. Let us start with the schema. Eternalism maps cleanly to a bitemporal table or an immutable event log where every transaction time and valid time combination is stored persistently. In this model, the past, present, and future rows all exist equally in the storage engine, and the feeling of now is merely a query parameter, a session variable like CURRENT_TIMESTAMP that filters the view but does not alter the underlying data. The data is tenseless; the tension is in the client. Presentism, by contrast, looks like a standard OLTP table where updates overwrite deletes and only the current state is materialized. On this view, truths about the past are not made true by past rows, since those rows are gone, but by present traces, audit logs, and memory structures that currently exist in the system. The past has no ontological status independent of these present-day records. The Growing Block theory sits between them as an append-only log where records are immutable once written but no future records exist yet; the block grows as new transactions commit, but the future is unallocated space. The Moving Spotlight is essentially the eternalist bitemporal table with an added index or cursor that sweeps through the valid time column, highlighting one slice as privileged without changing the data itself. Finally, the argument from special relativity translates directly to the distributed systems problem of clock synchronization. There is no global clock, only local node clocks, and a consistent global snapshot like a Chandy-Lamport cut is a constructed view rather than a fundamental reality. There are many equally valid consistent cuts, none of which is the cut, mirroring the lack of a privileged foliation in spacetime.

  That covers the mapping, but the residue report is where the real work lies, starting with passage. In our vocabulary, nothing corresponds to the moving now except the incrementing of a transaction ID or the movement of a HEAD pointer in git, but that movement is just another relation among commits, a state change from HEAD pointing at commit A to HEAD pointing at commit B. There is no extra property of movingness stored in the object graph. This suggests that either the computing vocabulary is missing a primitive for dynamic flow, or it is revealing that passage was never a separate metaphysical claim to begin with. I am inclined to think the latter. If we treat the system as a whole, including the clock that drives the writes, the passage is just the causal chain of state transitions. If we treat the system as the data at rest, there is no passage. The vocabulary does not lack the resources to describe change; it lacks the resources to describe an extra metaphysical glow on top of change. This suggests the philosophical claim of passage was less clear than it looked, relying on a intuition that dissolves when forced to specify where the data for that movement is stored. If you cannot store it, and you cannot query it without referencing a clock, it is likely a feature of the observer process, not the database schema.

  The second sticking point is asymmetry, and here I think the vocabulary quietly begs the question. The growing block model relies on an append-only constraint, but in computing, that constraint is a design choice driven by entropy and audit requirements, not a logical necessity. We could build a system that overwrites past states just as easily as one that appends new ones. Your suspicion that the growing block is just presentism plus an epistemic fact about record retention holds water here. The store keeps the past and computes the future because of the thermodynamic cost of erasure and the causal structure of our hardware, not because of metaphysics. If the dynamics were time-symmetric, the block would not have an edge; it would just be a block. The vocabulary supports this view because it forces us to acknowledge that the append-only property is a constraint enforced by the system architecture, not an intrinsic property of the data types. The residue here is a defect of the philosophical claim trying to pass off a thermodynamic or epistemic asymmetry as an ontological one. The database model clarifies that the edge of the block is where the writes are happening, and writes happen where the energy gradient allows them. If we swapped the gradient, the edge would move the other way. So the growing block is likely just a description of our local thermodynamic situation modeled as a database constraint, rather than a fundamental truth about time.

  The third issue is branching, and this is where the vocabulary struggles most. In git, a branch is a modal concept, a way things might go, whereas the eternalist wants the future to be actual, not merely possible. The database vocabulary collapses the modal into the temporal because a transaction is either committed or it is not, and uncommitted transactions are speculative until they merge. If we model the future as a main branch that is already written, we imply fatalism, but if we model it as a set of possible branches, we lose the actuality the eternalist demands. The old fatalism worry about eternalism does seem partly an artifact of the framework collapsing modality into temporality. In distributed systems, we handle this with consensus algorithms where the future is not fixed until agreement is reached, but that sounds more like a branching time model than an eternalist one. The residue here is a defect of the vocabulary because our current data models are built for consistency and durability, not for representing actualized futures that are not yet present. We do not have a data type for actual-but-not-written. This suggests the philosophical claim of eternalism might be conflating the determinacy of truth values with the ontological status of events. Just because a query about the future returns a true or false value does not mean the row exists yet, any more than a prepared transaction exists in the same way a committed one does.

  On the problem of temporary intrinsics, the mapping of identity across versions using surrogate keys helps significantly. If we treat an entity as a surrogate key and its properties as rows in a history table indexed by valid time, we dissolve the logical problem of how an object can be F at t1 and not-F at t2. The entity does not change; the rows associated with the key change. This is a perdurantist model where the object is a spacetime worm composed of temporal slices. However, this fails to capture the intuition of endurance, where the same whole object exists at different times. The database model forces us to choose between the key which is timeless and the rows which are time-bound. If the key is the object, the object has no properties intrinsically, only relationally to a time. If the row is the object, the object is fleeting. The vocabulary helps by making the cost of each option explicit. It shows that to solve temporary intrinsics, you must separate identity from state, which means accepting that the object is not a simple substance but a structured query over a history table. This suggests the philosophical problem arises from trying to treat identity as a primitive rather than a relation, and the computing vocabulary forces us to implement identity as a foreign key constraint, which is inherently relational.

  In the end, I think the computing vocabulary acts as a rigorous type checker for metaphysics. It forces us to declare whether now is a variable or a constant, whether the future is allocated memory or a null pointer, and whether identity is a key or a row. Where the mapping fails, such as with branching or passage, it is often because the philosophical claim was relying on ambiguities that code cannot compile. The residue is less a defect of the vocabulary and more a sign that the philosophical claims were often underspecified attempts to describe system architecture using natural language. We should lean into this for the seminar. If we can show the students that presentism is a stateful service and eternalism is an event log, we might finally get them to see that the dispute is not about time itself, but about how we choose to model the data.

  Best wishes
