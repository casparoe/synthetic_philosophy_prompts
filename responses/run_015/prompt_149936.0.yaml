      *   *Nuance:* Acknowledge that the "individualist" side is right about *moral* guilt, but wrong to dismiss *political* liability. The "collectivist" side is right about *structural* obligation, but wrong to call it *moral blame*.
      *   *The "Move":* The most productive move is the **Guilt vs. Liability** distinction. This decouples the emotional sting of blame from the practical necessity of repair.

  7.  **Final Polish:** Ensure tone is academic but accessible, matching a seminar participant. Use clear headings. Make sure to directly answer the specific questions asked (Empirical? Moral Reason? Intuitions? Solution?).

      *(Self-Correction on Jaspers)*: Make sure to accurately represent Jaspers. He argued political guilt entails liability for reparations, distinct from moral guilt which requires personal action. This is the exact pivot point the seminar is missing.

