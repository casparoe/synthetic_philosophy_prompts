      *   **Context:** Historical novel about Hobbes's later life. Specifically, the dispute with John Wallis over squaring the circle.
      *   **Timeframe:** After Wallis's first refutations (mid-1650s) but before Hobbes is completely worn down (around 1660, Restoration era).
      *   **Key Commitments/Beliefs:**
          *   Geometry is about bodies in motion, not abstract figures.
          *   Points have magnitude; lines have breadth (generated by motion).
          *   He *has* squared the circle (in *De Corpore*).
          *   Wallis is wrong, using algebraic shortcuts, and motivated by politics/jealousy (Royal Society vs. Hobbes's political notoriety).
          *   Tone: 17th-century English prose (authentic but readable), serious thinker, not a caricature of stubbornness. He can admit minor clarity issues but not fundamental error.
      *   **Input:** A visitor asks about Wallis's charge that Hobbes begs the question (assumes what needs to be proved) regarding the equality of a curvilinear and rectilinear figure.

  2.  **Adopt the Persona (Thomas Hobbes):**
      *   *Voice:* Formal, precise, slightly combative but rational (in his own view), authoritative. Use of terms like "demonstration," "absurdity," "motion," "magnitude," "subtlety."
      *   *Attitude toward Wallis:* Dismissive of his "algebraic" methods, suspicious of his motives, viewing him as part of a clique (the Royal Society/Presbyterian divines).
      *   *Attitude toward Geometry:* Materialist. Geometry is physics. To know a figure is to know how it is made.
      *   *Attitude toward the Visitor:* Respectful if the visitor is truly seeking truth, but wary of repeating Wallis's errors.

  3.  **Address the Specific Mathematical/Philosophical Point:**
      *   The visitor asks about the charge of *petitio principii* (begging the question).
      *   Hobbes needs to explain *why* his method isn't circular.
      *   *Core Argument:* Wallis treats geometry as arithmetic/algebra (numbers). Hobbes treats it as motion. If you understand the *generation* of the figure, the equality is necessary, not assumed.
      *   *Defense:* Wallis cannot see the truth because he looks for numbers where there are only proportions of motion.
      *   *Concession:* Perhaps the presentation in *De Corpore* was too concise, allowing misunderstanding, but the truth remains.

  4.  **Drafting - Section by Section:**

      *   **Greeting & Acknowledgement:** Acknowledge the visitor's diligence. It's rare to find someone who actually reads the work rather than just repeating the rumors.
      *   **The Nature of Geometry:** Reiterate the materialist foundation. A line is not a trackless abstraction; it is a trace of motion. If Wallis ignores this, he ignores reality.
      *   **Addressing the Charge (Begging the Question):** Wallis claims Hobbes assumes equality. Hobbes must argue he *derives* it from the properties of motion. The "curvilinear" and "rectilinear" are equal because they are generated by equivalent motions.
      *   **Attacking Wallis's Method:** Algebra is for merchants, not philosophers. It deals with numbers, not magnitudes. Wallis counts; Hobbes measures.
      *   **The Political/Subtextual Layer:** Hint that the Royal Society (Gresham College) protects their own. Hobbes is an outsider (Malmesbury, exile, *Leviathan* controversy). The math dispute is a proxy war.
      *   **Closing:** Reaffirm confidence. Truth will out, even if the "mathematical doctors" conspire against it.

  5.  **Refining the Language (17th Century Flavor):**
