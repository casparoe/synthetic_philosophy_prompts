answer: |-
  Sir, you come to me with an open mind, and for that, I am obliged to you. It is a rare thing in this age to find a gentleman who will trouble himself to read the demonstration itself, rather than contenting himself with the noise made by those who have a interest in finding it false. Most who come to me repeat Mr. Wallis's cries as if they were gospel, without ever having traced a line with a compass or considered what a line truly *is*.

  You ask how I answer the charge that I beg the question. I answer it thus: Mr. Wallis begs the question of what geometry *is*.

  He sits in Gresham College, surrounded by his arithmeticians, treating magnitudes as if they were mere numbers. He seeks to count the uncountable. He looks upon a circle and sees a puzzle of fractions and infinite series; I look upon a circle and see the trace of a motion constrained. When I assert that a certain curvilinear space is equal to a rectilinear one, I do not assume it as a principle. I derive it from the generation of the figures.

  Consider, sir: if a line be nothing but the track of a moving point, and a surface the track of a moving line, then the properties of that surface are nothing but the properties of that motion. In *De Corpore*, I have shown how the proportion of the motion which generates the circle relates to the motion which generates the square. If the motions are commensurable in their cause, the figures must be equal in their effect. Wallis charges me with assuming the equality because he cannot see the motion. He looks at the static figure, the dead corpse of the geometry, and asks where the life went. I tell him the life is in the construction, and he calls it a circle in my reasoning. It is he who reasons in a circle, sir, not I.

  I will concede this much, for I am not so proud as to deny the plain truth: the presentation in *De Corpore* was hurried. The press was eager, and I was eager to lay the foundation of my philosophy before my time ran short. Perhaps I omitted a step in the explication that would have made the motion clearer to a man trained only in the algebraic arts. If I have been obscure, I am willing to clarify. But to say I have assumed what I set out to prove? That is the refuge of a man who cannot answer the argument, so he attacks the method.

  And let us speak plainly of the method. This new algebra of theirs, this *specious arithmetic*—it is a useful tool for merchants calculating interest, perhaps. But it is not geometry. Geometry is the only science that it hath pleased God hitherto to bestow on mankind. It is founded on the certainty of matter and motion. When Wallis introduces his infinite series and his fractions, he leaves the world of bodies and enters a mist of abstractions. He can calculate an approximation until the end of days, but he cannot *construct* the square. I have given him the construction. He rejects it not because it fails to draw, but because it does not fit his arithmetic.

  But you are a man of sense, and you perceive the difficulty. I tell you, there is a deeper current here than the squaring of a circle. When I published *Leviathan*, I offended the universities. I offended the divines who fear a philosophy that places man and the state on a natural foundation rather than a scholastic one. Now, these same men find themselves in the Royal Society. They find themselves in Gresham College. They are a corporation, sir. If they admit that Hobbes has squared the circle, they must admit that Hobbes may also be right about the nature of obligation, and authority, and the church.

  So, they make a stand here. They say, "He is a dogmatist. He is a fool in mathematics." If they can paint me as a madman with a compass, they need not answer the philosopher with the pen. Wallis is their champion in this. He is a clever enough fellow, I grant you, but he is a schoolman dressed in a mathematician's coat. He defends the guild.

  Therefore, when he says I beg the question, hear him for what he truly says: "We will not accept a truth that comes from outside our walls."

  But the truth is stubborn, sir. A square equal to a circle remains equal, whether the Professors of Oxford applaud it or hiss at it. I have the demonstration. I have the motion. And I have the time, which is the one thing they cannot argue away. If you will look to the generation of the figures, and not merely to the numbers, you shall see that I am in the right, and that the absurdity lies entirely with them.
