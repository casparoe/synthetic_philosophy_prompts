      *   Use period syntax: Inversion ("Little do they know..."), Latinate vocabulary ("demonstration," "absurdity," "magnitude," "subtlety").
      *   Sentence structure: Long, periodic sentences, balanced clauses.
      *   Pronouns: "You" is fine (thou/you distinction was fading in polite conversation by 1660, but formal address is safe).
