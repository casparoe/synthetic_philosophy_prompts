answer: |-
  **Project Title:** The Architecture of Moral Trade: Fungibility, Agency, and Normative Uncertainty

  **Research Question**
  This chapter asks: *Under what conditions does moral disagreement permit cooperative trade, and when does the structure of our values necessitate unilateral action?* Existing defenses of moral trade assume that moral value is located primarily in outcomes. If value is instead located in actions, relations, or specific agents (indexical values), the standard argument for trade may collapse. This project investigates whether moral trade is a general solution to moral disagreement or a niche practice viable only under restrictive assumptions about the fungibility of moral goods. The argument is designed to come out either way: it will either delineate the narrow conditions under which trade is permissible or demonstrate that the practice requires a fundamental restructuring to accommodate non-fungible values.

  **State of the Debate**
  The current literature treats moral trade as a coordination problem between agents with different weightings over a shared set of outcomes. The standard view holds that if two agents value different outcomes, they can exchange efforts to maximize total value by their own lights. This view remains unsettled because it relies on an unexamined premise: that moral preferences are agent-neutral regarding the *production* of the good. It does not adequately address cases where the moral value is tied to the identity of the agent (e.g., "I must not have dirty hands") or the relationship between the agent and the beneficiary (e.g., "My community must care for its own"). 

  Furthermore, recent attempts to model trade under normative uncertainty treat the problem as one of hedging against belief errors. This approach fails to distinguish between hedging within a single agent's decision matrix and hedging across agents via exchange. Without a clear account of which values are tradable, we cannot determine whether moral trade resolves disagreement or merely sidesteps the specific obligations that generate the disagreement in the first place. The gap is not a lack of models, but a lack of clarity on the ontology of the values being traded.

  **Methodology**
  I will employ a hybrid method of structured conceptual analysis and boundary testing. I will not rely solely on formal modeling, as models typically take preference structures as exogenous inputs; using a model now would beg the question of whether indexical values can be represented as standard utility functions. Conversely, I will not rely solely on intuition canvassing, as this lacks the systematicity required to generalize about the limits of trade. 

  Instead, I will construct a taxonomy of moral values based on their fungibility and agent-relativity. I will then test this taxonomy against a series of paired cases ranging from pure outcome-based values to pure action-based values. For each pair, I will assess whether a trade agreement increases expected value for both parties without violating deontic constraints. This approach satisfies the philosophical need for conceptual precision while offering the social science committee a structured framework for analyzing cooperative behavior under value conflict.

  **Timeline**
  *   **Months 1–2:** Finalize the taxonomy of fungible vs. indexical values. Draft the argument for why standard trade models fail to capture indexical constraints.
  *   **Months 3–4:** Develop the case studies. Test the "Fungibility Constraint" against objections (e.g., that indexical values can be cashed out as outcome values).
  *   **Months 5–6:** Investigate the normative uncertainty angle. Determine if trade under uncertainty functions as hedging or if it introduces distinct structural advantages. Address the risk of collapsing into general meta-ethics.
  *   **Months 7–8:** Synthesize findings. Draft the full chapter, integrating the constraint argument with the uncertainty exception.
  *   **Month 9:** Revision and polishing. Develop the practical "Trade Viability Framework" for the appendix.

  **Deliverables**
  The primary deliverable is the third chapter of the dissertation, approximately 10,000 words. It will argue that moral trade is viable only when values are agent-neutral regarding the production of outcomes, unless specific conditions of normative uncertainty obtain. 

  Additionally, I will produce a "Trade Viability Framework," a decision matrix for practitioners. This tool will allow agents considering moral trade to diagnose whether their values are compatible with exchange or if their obligations require unilateral fulfillment. This ensures the research has practical uptake for organizations currently engaging in cause prioritization and cooperative altruism.

  **Risk and Scope**
  The chapter fails if the distinction between fungible and indexical values collapses—for instance, if it can be shown that all indexical values are reducible to complex outcome values without loss of meaning. I mitigate this by focusing on cases where the *process* is constitutively tied to the value (e.g., democratic decision-making vs. efficient outcome), which resists outcome-reduction.

  The primary risk of scope creep lies in the section on normative uncertainty. If defending trade under uncertainty requires a full theory of how to hedge under normative uncertainty, the chapter will expand beyond nine months. I will limit this section to the *structural* difference between individual hedging and interpersonal trade, deferring the defense of hedging itself to the dissertation's conclusion. If the normative uncertainty argument proves to require a standalone treatment, I will excise it and treat the chapter as a negative result regarding the limits of trade under value disagreement.

  ***

  ### Strategic Advice for the Applicant

  You asked me to identify which of your three thoughts should be the chapter and which should be footnotes. Here is the breakdown based on the proposal above:

  **The Core Chapter: Thought 1 (Fungibility/Indexicality)**
  This is the engine of the proposal. It directly addresses your dissertation theme ("what we owe each other when we disagree about what we owe"). If the disagreement is about *what* we owe (outcomes), trade works. If the disagreement is about *who* owes *whom* (indexical/relational), trade fails. This is a distinctively philosophical contribution that challenges the premises of the existing literature. It justifies the fellowship because it requires deep conceptual work that cannot be rushed.

  **The Footnote: Thought 2 (Milgrom–Stokey Analogy)**
  This is a supporting argument, not a chapter driver. It explains *why* belief-based trade is suspect, but it relies on economic analogies that might alienate the philosophy half of your committee if overused, or seem too abstract for the social scientists if not modeled. Use it in the background to motivate why we need to look at value structures rather than belief structures, but do not make it a main section.

  **The Boundary Test: Thought 3 (Normative Uncertainty/Hedging)**
  This is the "save" or the "exception." I included it in the proposal (Months 5–6) but framed it carefully. Your supervisor is right that this risks collapsing into the general hedging debate. By framing it as a *structural* question (does trade offer something individual hedging doesn't?) rather than a *normative* question (should we hedge?), you keep it contained. If you find during Month 5 that this is swallowing the project, the proposal explicitly gives you permission to cut it (see the "Risk and Scope" section). This protects your completion timeline.

  **Why this method?**
  I steered you away from "just a formal model" because a model assumes the preference structure you are trying to question. If you model indexical values as standard utility functions, you've already solved the problem by assumption. I steered you away from "just intuitions" because a mixed committee wants systematicity. The "taxonomy + boundary testing" approach signals to the social scientists that you are building a framework, and to the philosophers that you are doing conceptual analysis.

  **Honesty about Failure**
  The "Risk and Scope" section is crucial for a completion fellowship. Committees want to know you understand what could go wrong. By admitting that the distinction might collapse or the uncertainty section might balloon, you show maturity. It is better to promise a negative result (trade is more limited than we think) than to promise a positive result that requires solving meta-ethics.
