answer: |-
  ### Part 1: Framing Brainstorm & Selection

  Here are four ways to frame this activity. I've selected the third one for the full plan.

  1.  **The "Turing Test" Frame:** Position the students as AI architects trying to build an agent that outperforms humans in moral dilemmas.
      *   *Why dropped:* It risks turning the seminar into a CS discussion about simulation rather than a philosophy discussion about rationality. It encourages them to think "machines are different" rather than "rationality is different."
  2.  **The "Binding Contract" Frame:** Treat the programs as legal contracts enforced by the room.
      *   *Why dropped:* It smuggles in an external enforcer (the instructor/room), which undermines the core insight of Program Equilibrium (that the enforcement is *internal* to the logic of the interaction).
  3.  **The "Logical Causation" Lab (Selected):** Frame the activity as an investigation into whether your choice can *logically determine* another's choice without causal contact. The goal is to test if "rationality" changes when transparency is absolute.
      *   *Why kept:* It targets the specific complacency from last week (that one-shot defection is the only rational move) by changing the *structure of reasoning*, not the payoff or enforcement.
  4.  **The "Evolutionary Tournament" Frame:** Run multiple generations, letting successful programs "reproduce."
      *   *Why dropped:* 90 minutes is too short for evolution to stabilize. It shifts focus to population dynamics rather than the static equilibrium analysis you want them to grapple with.

  ---

  ### Part 2: The Activity Plan — "The Transparent Box"

  **Goal:** Break the intuition that Defect is the *only* rational move in a one-shot PD by introducing source-code transparency.
  **Materials:** 32 Index cards (2 per student), black pens (no pencil), whiteboard, a visible timer, one small prize (e.g., a nice chocolate bar or a "Philosophy Department" bookmark).

  #### 1. The Language (Hand-Executable)
  To ensure you can compile this mentally in under a minute, the syntax must be rigid. Write this on the board immediately.

  **Syntax Rules:**
  1.  **Token Limit:** 20 tokens max per card. (Keywords, variables, and values count. Comments do not count but must be in parentheses).
  2.  **Opcodes:** `READ`, `SELF`, `COOP`, `DEFECT`, `IF`, `THEN`, `ELSE`, `==`.
  3.  **Structure:** Programs must be a single conditional statement or a direct action.
      *   *Valid:* `COOP`
      *   *Valid:* `IF READ == SELF THEN COOP ELSE DEFECT`
      *   *Invalid:* `WHILE...` (No loops. Prevents non-halting).
  4.  **The `SELF` Opcode:** Returns the exact text written on your own card.
  5.  **The `READ` Opcode:** Returns the exact text written on the opponent's card.
  6.  **Timeout Rule:** If a comparison takes more than 10 seconds to verify manually (e.g., messy handwriting), the program crashes and outputs `DEFECT`.

  #### 2. Mechanics Selection
  *   **Use:** **Token Budget (20 tokens).** This makes the "Copycat" strategy (`IF READ == SELF...`) costly. It uses 9 tokens. They have 11 left for comments or complex logic, but they feel the squeeze.
  *   **Use:** **Public Sandbox Log.** Allow 5 minutes where they can ask you: "If I submit X and my opponent submits Y, what is the payoff?" You answer on the board. This lets them debug the logic of `SELF` without giving away their final strategy.
  *   **Drop:** **Lossy Channel.** It complicates the `==` check too much for manual execution. We want the identity check to work perfectly so the *implication* is the problem, not the implementation.
  *   **Drop:** **Noise.** We want the equilibrium to hold firm so they can't blame failure on randomness.

  #### 3. Timeline (90 Minutes)

  **00:00 – 00:05 | Framing (Max 5 mins)**
  *   **Say:** "Last week you agreed: in a one-shot Prisoner's Dilemma, Defect is rational. Today, we change one assumption. You are not choosing *actions*; you are choosing *algorithms*. Your algorithm sees the other's algorithm before outputting an action. No repetition. No reputation. Just code."
  *   **Write Payoffs on Board:** CC=3/3, DC=5/0, CD=0/5, DD=1/1.

  **00:05 – 00:20 | Language & Sandbox**
  *   Teach the syntax (see above).
  *   **Sandbox Phase:** Invite questions. "What if I write `COOP` and they write `IF READ == SELF...`?" (You answer: "They read `COOP`. `COOP` != `IF...`. They Defect. You get 0.")
  *   *Crucial Moment:* A student will ask, "Can I copy them?" You say: "You can condition on them copying you."

  **00:20 – 00:35 | Coding Phase (Secret Pairing)**
  *   **Pairing:** Collect all cards. Shuffle. Deal one blank card to each student. Write a number (1-8) on each. Pair 1s together, 2s together, etc. They do not know their partner.
  *   **Task:** Write your program. Count your tokens. Sign the back (for participation credit).
  *   **Collection:** Collect all programs. Do not let them see partners yet.

  **00:35 – 00:60 | Execution & Verification**
  *   **Procedure:** You act as the CPU. Pick a pair (e.g., Pair 1). Read Card A aloud. Read Card B aloud.
  *   **Class Verification:** Ask the room: "Does A == B?" "What does A output?" "What does B output?"
  *   **Scoring:** Write points on the board next to the Pair Number.
  *   **Pacing:** Do all 8 pairs. This takes about 3-4 minutes per pair including discussion.
  *   **Prize:** The student with the highest individual payoff wins the prize. (Tie-breaker: Fewest tokens used).

  **00:60 – 00:90 | Debrief & Philosophy**
  *   (See Section 5 below).

  #### 4. Scoring & Incentives
  *   **Participation:** 1 point for submitting a syntactically valid program.
  *   **Prize:** The "Rationality Prize" (chocolate/bookmark) for the highest payoff.
  *   **Why no money?** Money makes them risk-averse. Abstract points make them logic-averse, which is what you want.
  *   **Conversion:** Payoffs are direct points. 5 points for a successful Defect, 3 for Mutual Coop, etc.

  #### 5. Troubleshooting (What Will Go Wrong)
  1.  **Infinite Loops:** A student might try to write `IF READ == SELF THEN (run READ)`.
      *   *Fix:* Enforce the "No Loops" syntax rule strictly. If it's not a single `IF/THEN` or direct action, it crashes to `DEFECT`.
  2.  **Handwriting Issues:** "Is that an 'O' or a '0'?"
      *   *Fix:* The 10-second verification rule. If the class argues about syntax for more than 10 seconds, the program crashes to `DEFECT`. This punishes ambiguity.
  3.  **The "Always Cooperate" Flood:** Half the class might just write `COOP`.
      *   *Fix:* Let it happen. The `IF READ == SELF` players will defect against them (since `COOP` != `IF...`). This demonstrates why naive altruism fails against program equilibrium.
  4.  **Collusion:** Students might try to signal during the coding phase.
      *   *Fix:* Remind them silently. If caught, they get 0 points.

  #### 6. The Debrief (Mapping Moments to Theory)
  *   **The "Copycat" Equilibrium:** Point to the pair where both wrote `IF READ == SELF THEN COOP`.
      *   *Concept:* This is a **Program Equilibrium**. It is a Nash Equilibrium in the space of programs. Neither can unilaterally switch to `DEFECT` without changing their source code, which the other would detect, causing the other to defect, lowering the switcher's payoff.
  *   **The Mutual Defect Equilibrium:** Point to a pair where both wrote `DEFECT`.
      *   *Concept:* This is *also* a Program Equilibrium. If I switch to `COOP`, you still defect. I get 0. So `DEFECT` is stable too.
      *   *Takeaway:* We haven't "solved" the PD; we've added a new equilibrium. The problem is now **equilibrium selection**.
  *   **The Load-Bearing Premise:** Ask: "What broke the 'Defect is dominant' logic from last week?"
      *   *Answer:* **Transparency.** In standard PD, I choose my act *ignorant* of yours. Here, I choose my *disposition* knowing it is visible. The causal link is replaced by a logical link.

  #### 7. Handling the Hard Questions

  **Q1: "Isn't this just the Golden Rule or Kant in a trench coat?"**
  *   **Your Response:** "Kant says 'Act as if your maxim were universal law.' That's a normative hope—you *wish* everyone did it. Program Equilibrium says 'Act *because* your algorithm *is* the law.' If I am transparent and you are rational, my code *logically forces* your code to mirror it to avoid the sucker's payoff. Kant relies on moral duty; this relies on logical identity. One is ethics, the other is math."

  **Q2: "Could real people or AI ever actually be in this situation?"**
  *   **Your Response (5-min close):** "Humans? No. We are opaque. We can't read each other's source code. But **institutions** can. Think of open-source smart contracts on a blockchain, or API integrations between trading algorithms. If two high-frequency trading bots can inspect each other's code before trading, they are in this game. The lesson isn't that humans should try to be transparent; it's that *transparency changes the definition of rationality*. If you build a system where intentions are visible, 'selfishness' might look like cooperation."

  #### 8. The Honest Limitation (Say this out loud)
  "Here is what this activity cannot reproduce: **The cost of writing the code.** In this game, writing `IF READ == SELF` was free (mostly). In reality, making yourself transparent is dangerous. If you reveal your code to someone who *doesn't* care about equilibrium (a 'irrational' defector or a state actor), you get exploited. Program Equilibrium assumes **Common Knowledge of Rationality**. If your opponent is crazy, or if they can't read your code, the Copycat strategy fails. We solved the dilemma by assuming away the opacity that makes humans human."

  ---

  ### Instructor Cheat Sheet (For Execution Phase)

  **Scenario A (The Ideal):**
  *   P1: `IF READ == SELF THEN COOP ELSE DEFECT`
  *   P2: `IF READ == SELF THEN COOP ELSE DEFECT`
  *   *Exec:* P1 reads P2. Text matches P1. Output COOP. P2 reads P1. Text matches P2. Output COOP.
  *   *Payoff:* 3 / 3.

  **Scenario B (The Exploiter):**
  *   P1: `IF READ == SELF THEN COOP ELSE DEFECT`
  *   P2: `DEFECT`
  *   *Exec:* P1 reads P2. `DEFECT` != `IF...`. Output DEFECT. P2 outputs DEFECT.
  *   *Payoff:* 1 / 1. (Note: The Copycat protects itself against naive defectors).

  **Scenario C (The Naive Cooperator):**
  *   P1: `IF READ == SELF THEN COOP ELSE DEFECT`
  *   P2: `COOP`
  *   *Exec:* P1 reads P2. `COOP` != `IF...`. Output DEFECT. P2 outputs COOP.
  *   *Payoff:* 5 / 0. (Copycat exploits the naive).

  **Scenario D (The Mirror Match Defect):**
  *   P1: `DEFECT`
  *   P2: `DEFECT`
  *   *Payoff:* 1 / 1. (Stable equilibrium).

  **Arbitration Tip:** When checking `READ == SELF`, read the cards aloud slowly. If there is a semicolon difference or a space difference, they are **not** equal. Be pedantic. This highlights the fragility of the equilibrium.
