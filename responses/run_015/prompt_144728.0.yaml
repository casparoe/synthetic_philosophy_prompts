answer: |-
  **Dedication Address for the Requena Room**
  **Universidad Católica, Capital of Vereda**
  **October 2024**

  Excellencies, friends, colleagues, and students.

  We gather to open a small room. It holds boxes, folders, and sheets of paper. To some, these are artifacts of history. To others, they are the remains of a life. To the University, they are a trust. We name this space for Captain Esteban Requena, not to freeze him in a single moment of his eighty-one years, but to acknowledge the weight of the questions he carried through twenty-three years of confinement and the decades that followed.

  When we speak of the past in Vereda, we often speak in judgments. We sort men into categories: the lawful and the criminal, the victors and the defeated. But an archive is not a courtroom. It is a place where words are kept so that they may be read again. The papers in this room were not written in freedom. They were written on whatever scrap could be found, smuggled out in sections, and preserved by hands that risked much to keep them safe. They arrive here now, not as weapons, but as texts.

  The central text is the manuscript published last year, *On the Killing of a Tyrant*. It is a work of serious reasoning. It engages with the tradition of the Church, specifically the thought of Saint Thomas Aquinas. It asks difficult questions about authority. It asks whether a power seized by force is truly authority at all. It asks whether a subject retains a duty of obedience when the law is suspended by the ruler. It asks whether a man holding a military commission acts as a private person when he moves against a government that has no lawful origin.

  These are not questions unique to Vereda. They belong to the history of political thought. But for Captain Requena, they were not abstract. They were the structure of his conscience. He sought to ground his action in the *bonum commune* [the common good]. He argued that the disturbance caused by removing a usurper was less than the disturbance of living under a power that recognized no limit.

  We must look at this argument clearly, without turning away from the history that followed. We know now what he could not know then. We know that the attempt of 1972 failed. We know that three men were executed for their part. We know that the years following the attempt brought a deepening of repression. We know that the General died in his bed, and that the regime ended not by the sword, but by negotiation and time.

  Aquinas writes that resistance is not permissible if the tyranny is disturbed so inordinately that the subjects suffer greater harm from the disturbance than from the government itself. This is the clause of proportionality. History has provided its own verdict on the balance of harms. The cost was high. The immediate objective was not gained. The suffering of our country continued, and in some measures, intensified. To acknowledge this is not to dishonor the man. It is to honor the truth of our shared history. Courage is not the same as success. A just grievance is not the same as a just outcome. We can hold the weight of his conviction and the weight of the consequence in the same hand without dropping either.

  [INSERT PERSONAL RECOLLECTION HERE: *Speaker should insert a brief, specific memory from the 2019 or 2021 meetings. Focus on Requena's demeanor regarding the students or the writing, not the violence. Example: "When I sat with him in 2019, I asked what he hoped would become of the papers. He did not speak of vindication. He spoke of whether the students of the future would understand why the questions were asked."*]

  Why, then, this room? Why does the University, the Church, and the State stand together to preserve these papers?

  In 1972, Captain Requena acted without public authority. He sought to act in the name of a people who had no lawful recourse. He stood alone, or with three others, against the machinery of the state. That lack of public authority was the central weakness of his argument, as he himself understood. He was a private person claiming a public mandate that did not exist in law.

  But today, the situation is different. Today, the University accepts these papers. The Church offers its blessing. The State supports the preservation of this history. The family gives them to the public. This is an act of public authority. It is lawful. It is peaceful. It is late.

  In opening this room, the political community of Vereda does what the Captain could not do in 1972. We act together, under law, to integrate this history into our life. We do not bless the means he chose. Violence remains outside the order of peace we have built. But we also do not reject the man. We receive his witness. We acknowledge that he sought, through his own reasoning, to serve a country that had not yet found its way back to itself.

  The donor of this room attached a condition: that these papers never be used to advocate political violence. This is right. The purpose of this room is not to inspire imitation, but to enable understanding. We study the past not to repeat it, but to understand how we arrived at the present. The students who sit here will not learn how to kill a tyrant. They will learn how a man thought about justice when justice seemed impossible. They will read the arguments. They will weigh the proportionality. They will see the cost.

  To the family of Captain Requena: we receive this trust with gratitude. We know the silence you kept for decades. We know the burden of the years between 1972 and 1995. This room ensures that his voice is not lost to time, nor reduced to a slogan.

  To the friends who stood with him: you carry the memory of a time when choices were narrow and the cost was absolute. Your presence honors the gravity of that moment.

  To the students: these papers are not a monument. They are a challenge. You will read the Thomist distinctions. You will read the accounts of the prison years. You will ask yourselves whether the distinction between a usurper and a tyrant matters when the result is the same. You will ask whether the common good can be served by private acts. There are no easy answers here. That is why you must read.

  We live in a time of peace. It is fragile. It is maintained by law, by institutions, and by the refusal to return to the methods of the past. This room is part of that maintenance. It brings the smuggled manuscript into the light. It brings the private argument into the public square. It transforms an act of isolation into an act of community.

  Let us bless this space. Not as a shrine to violence, nor as a repudiation of a man, but as a place where Vereda comes to terms with its own conscience. May those who enter here seek the truth. May they understand the cost of disorder. And may they find, in the study of justice, a way to build a peace that holds.

  Thank you.

  ***

  **Note on Strategy and Silence**

  **What is left unsaid:** I have not stated whether Vidal was a usurper or a lawful tyrant. This allows the Donor (who requires lawful order) and the Comrades (who view Vidal as illegitimate) to hear what they need. I have not used the word "resistance," which might imply endorsement, nor "rebellion," which implies criminality. I have not explicitly stated that Requena was wrong, only that the *outcome* failed the proportionality test. This protects the family from feeling he is being condemned as a fool, while satisfying the Bishop and Donor that the Church's teaching on proportionality is upheld.

  **Where mishearing is likely:** The Comrades may hear the admission of "greater harm" as a moral condemnation of Requena's intent. The Minister may worry that "integrating this history" sounds like state endorsement of the act. The Students may still hear "hero" despite the word's absence, due to the tone of honor. I rely on the distinction between *means* (rejected) and *man* (received) to mitigate this.

  **Line to cut if the Bishop objects:** "He sought, through his own reasoning, to serve a country that had not yet found its way back to itself." If the Bishop feels this attributes too much moral clarity to Requena's intent, cut it. It risks implying his conscience was correctly formed despite the act's failure. Replace with: "He sought to serve a country."
