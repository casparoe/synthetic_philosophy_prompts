answer: |-
  **The Scenario**

  At St. Jude's Memorial, a single dose of a rare polyvalent antivenom remains in stock. Patient A is currently connected to the IV drip, having been assigned the dose by an automated inventory algorithm that prioritized bed location over arrival time; Patient B, who arrived forty minutes earlier and meets identical clinical criteria, was skipped due to a data-entry lag. Dr. Chen, the on-call triage officer, discovers the discrepancy before the infusion completes. The hospital's explicit protocol mandates allocation by arrival time, but the algorithm's assignment stands as the physical default until a human officer overrides it. Chen can actively halt the pump and reroute the antivenom to B (ensuring A dies from envenomation and B lives), or she can passively allow the infusion to complete (ensuring A lives and B dies). Both patients have equal prognosis if treated, and no other doses are available.

  **Theoretical Verdicts**

  1.  **Strict Deontology:** This view maintains that the physical causal pathway determines moral permissibility. Halting the pump constitutes an active intervention that causes A's death (killing), whereas allowing the infusion to finish constitutes refraining from intervention, resulting in B's death (letting die). Because killing is intrinsically worse than letting die, Chen is forbidden from overriding the algorithm. The fact that the algorithm violated protocol is irrelevant to the physical distinction between acting and refraining; the verdict is **Active: Impermissible / Passive: Permissible.**
  2.  **Pure Consequentialism:** This view denies intrinsic moral weight to the doing/allowing distinction. Since the outcome is identical (one life saved, one lost) and prognosis is equal, the causal mechanism (pump switch vs. pump continuity) is morally inert. The "protocol violation" matters only if it affects future utility (e.g., trust), but in this isolated case, the options are equivalent. Chen should decide based on non-moral tie-breakers (e.g., a coin flip). The verdict is **Active: Equivalent / Passive: Equivalent.**
  3.  **Threshold Contractualism about Institutional Omission:** This niche view argues that moral obligations are mediated by role-based authority. Chen is not a private agent but a designated gatekeeper empowered to enforce legitimate protocols. The algorithm's allocation lacks normative authority because it violated the agreed-upon triage rules; it is merely a physical state, not a moral claim. By passively allowing the erroneous default to stand, Chen becomes complicit in the institution's failure to uphold its own justificatory framework, effectively abdicating her role. Actively correcting the error fulfills her duty to the institutional contract. The verdict is **Active: Permissible (Required) / Passive: Impermissible.**

  **The Engine of Reversal**

  The divergence relies entirely on the combination of a **designated gatekeeper** and a **non-authoritative default**. The "non-authoritative default" is the crucial loading of the dice: the current allocation to Patient A is physically real but institutionally illegitimate (a glitch, not a decision). This allows the Threshold Contractualist to treat the status quo as a *mistake to be corrected* rather than a *decision to be respected*. If you remove this feature—for instance, if a previous physician had legitimately reviewed both cases and deliberately assigned the dose to A based on valid criteria—the Contractualist verdict collapses. In that scenario, overriding the prior decision would violate the institutional contract of peer authority, making the passive course permissible again for the Contractualist, aligning them with the Deontologist. The case is engineered so that the "omission" is not merely doing nothing, but failing to police the boundary between valid protocol and mechanical error.

  **Epistemic Notes and Critiques**

  For your discussion group, it is vital to distinguish settled debates from the constructed elements of this case. The **Doing/Allowing distinction** itself is genuinely contested in the literature (e.g., Foot vs. Quinn vs. Thomson); many philosophers argue the distinction collapses under scrutiny, while others defend it as robust. However, the **"Threshold Contractualism"** label is a pedagogical construct for this exercise, synthesizing elements of Scanlonian contractualism and professional role morality; it is not a standard consensus view.

  A defender of the **Strict Deontological view** would likely attack the case by rejecting the institutional framing entirely. They would argue that "institutional complicity" is a consequentialist concern disguised as duty. From a strict deontological perspective, Dr. Chen's hands are on the pump; stopping the flow is a causal intervention that kills A. No amount of bureaucratic justification (e.g., "the algorithm wasn't authorized") can dissolve the physical reality that she is initiating the sequence of events leading to A's death. They would insist that the distinction between *killing* and *letting die* tracks the physics of agency, not the sociology of hospital administration, and that this case attempts to smuggle outcome-based reasoning into a constraint-based framework.

  **Pedagogical Warning:** This scenario loads the dice by making the "passive" option feel like *negligence* rather than *restraint*. In standard trolley problems, the status quo is often neutral. Here, the status quo is an *error*. This biases the intuition toward action, which helps the Contractualist but unfairly burdens the Deontologist, who must argue that correcting a fatal administrative error is morally worse than allowing it to proceed. Be explicit with your group that this tension is intentional to force the theoretical divergence.
