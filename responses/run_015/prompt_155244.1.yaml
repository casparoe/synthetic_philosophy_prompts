answer: |-
  Yes, philosophy has a name for exactly this, and you have stumbled onto one of the most famous problems in modern ethics. It is called **Moral Luck**.

  Here is the breakdown of the idea, how it applies to your situation, and whether your feelings are "fair."

  ### The Core Concept: Moral Luck
  The central intuition of morality is that we should only be judged on what we control. You control your intentions, your efforts, and your methods. You do not control the outcome, because the outcome is often influenced by chance (luck).

  **Moral Luck** occurs when factors outside your control (like the random behavior of polymers or a spectrometer reading) significantly change how we judge your actions morally.

  In your case, you had two identical actions (sloppy technique, no calibration). The only variable was the outcome (failure vs. patent).
  *   **Experiment A (Failure):** The negligence was hidden by bad luck.
  *   **Experiment B (Success):** The negligence was rewarded by good luck.

  ### The Specific Type: Resultant Luck
  Philosophers break moral luck down into categories. The one you are experiencing is called **Resultant Luck**. This is luck in the way things turn out.

  The classic example philosophers use is the "drunk driver." Imagine two drivers who both drink too much and drive home.
  *   Driver 1 gets home safely.
  *   Driver 2 hits a pedestrian because a child happened to run into the street.

  Legally and socially, we punish Driver 2 much more harshly. But morally? They made the exact same choice to drive drunk. The difference was purely luck.

  ### Why You Feel Worse About the Success
  You asked if it is fair that you feel worse about the batch that worked. This is the fascinating part.

  In the drunk driver example, society blames the one who caused harm. In your example, you are blaming *yourself* for the one that caused *benefit*.

  From a strict philosophical standpoint (specifically one focused on duty and rules), your negligence was identical in both cases. Therefore, your moral "debt" should be identical. However, human psychology struggles with this.

  You feel worse about the successful batch because the success **validates the bad method.**
  *   In the failed batch, reality corrected you. The bad method produced a bad result. The universe was honest.
  *   In the successful batch, the lie worked. You were careless, but the universe handed you a reward (the patent/cash).

  Your guilt is coming from the fact that the success feels **unearned**. It creates a dissonance between your identity as a rigorous scientist and the reality that you were rewarded for being sloppy. The failure didn't threaten your identity; the success did, because it suggests you can cut corners and win.

  ### Is It "Fair"?
  Philosophically, **no, it is not fair that the outcome changes the moral weight.** If morality is about what you control, the guilt should be equal.

  However, your feeling is actually a sign of ethical integrity. You are recognizing that the *process* matters more than the *result*.
  *   If you felt proud of the patent despite the sloppiness, that would be unethical.
  *   Feeling guilty about the patent shows you understand that scientific truth relies on method, not just outcomes.

  ### The Takeaway
  You aren't crazy for feeling this way. You are experiencing the tension between **Control** (your method) and **Consequence** (the patent).

  Philosophy suggests that to resolve this, you should judge yourself on the **Control** side. You were negligent twice. You should make peace with the fact that you were negligent twice, regardless of the payout. The fact that one made money is just noise; the signal is that the technique was flawed.

  Your guilt is essentially your conscience telling you that the reward was accidental, but the negligence was intentional. That is a healthy, honest reaction.
