      *   *Economic Factor:* Inequality drives populism. Rome had land concentration; modern has wealth concentration. Ignoring this makes the analogy shallow.
      *   *Verdict:* The analogy is useful for highlighting *legalistic* erosion (autocratic legalism) but dangerous if it ignores *material* causes (economics) or *elite agency* (it's not just "voters," it's leaders manipulating voters). It gives "fake historical weight" if used deterministically.

