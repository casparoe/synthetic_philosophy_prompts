  *(Thought on Exhaustiveness)*: The novelist says they know sparsely. God knows exhaustively. Does it do work? Yes, because God cannot retcon. The novelist can fix a plot hole in draft 4. God actualizes once. So exhaustiveness is necessary for a single-shot creation.

  *(Thought on Poverty vs. Unclear Doctrine)*: I should be blunt. The doctrine has a metaphysical vagueness (grounding objection) that the novelist's intuition picks up on. The novelist's language is precise about experience but ontologically thin. Both have issues.

