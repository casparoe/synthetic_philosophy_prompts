  2. In ontologies where kinship constitutes the very source of political authority rather than competing with it, the distinction between private obligation and public duty is a category error that renders the theory inapplicable. This suggests the framework imposes a Western secular separation of spheres onto societies where such separation does not exist.
  3. Ethnographic evidence that informal patronage networks often provide essential social safety nets and state capacity where formal institutions are absent challenges the claim that shadow obligations are purely dysfunctional. This indicates that what you label corruption might be a functional adaptation to institutional voids rather than a collapse of function.
  4. Institutional design research demonstrates that effective street-level bureaucracy often requires personalized discretion and relationship-building to implement rigid rules humanely. This blurs your bright line between functional flexibility and corrupt shadow obligations, making the diagnostic criteria difficult to apply without false positives.
  5. The empirical measurement of shadow obligations often relies on Western legalistic definitions of contractibility that fail to capture non-Western forms of enforceable trust. This creates a methodological bias where local accountability mechanisms are misidentified as accountability-dissolving reciprocity simply because they look different.
