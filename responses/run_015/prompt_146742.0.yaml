answer: |-
  This institutional bias presupposes methodological reductionism as a heuristic for causal tracking rather than ontological elimination, allowing non-reductive physicalists to accept it as pragmatic policy, though elevating cognitive models would commit science to explanatory pluralism where functional autonomy rivals mechanistic decomposition as a standard of explanation.

  The demand for synaptic or genetic grounding aligns with the mechanistic philosophy of science, which argues that prediction alone does not constitute explanation without identifying the constitutive parts and operations responsible for the phenomenon. This is not necessarily Dennett-style greedy reductionism, which erroneously claims higher levels do not exist, but rather a strict adherence to causal closure where the physical base is viewed as the only secure locus of causal power. Reviewers treat cognitive models as "skyhooks" not because they deny the reality of beliefs, but because they view functional descriptions as incomplete until the physical machinery executing those functions is specified.

  A non-reductive physicalist can reconcile with this practice by distinguishing ontology from method, acknowledging that while mental states are real and multiply realizable, securing their causal efficacy in a physical world requires demonstrating their physical realizers. This aligns with Jaegwon Kim's exclusion problem, which suggests that if physical causes are sufficient, higher-level causes risk being epiphenomenal unless tied to their substrate. Therefore, the funding rule can be defended as a methodological safeguard to ensure causal specificity without denying the ontological status of cognitive states.

  Rewriting guidelines to treat top-down models as equally legitimate would commit the field to explanatory pluralism, where the stability of a pattern across different physical substrates becomes as valuable as the details of the substrate itself. This shift would prioritize organizational invariance and computational logic over constitutive mechanisms, effectively granting explanatory authority to the abstract structure of the system rather than its material composition. Such a move validates the autonomy of special sciences like psychology, asserting that knowing what a system does and how it processes information can be a complete explanation even without knowing exactly which neurons fire.
