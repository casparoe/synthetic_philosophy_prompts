  I'm a retired biologist who just started reading philophy of science, and I keep running into this pattern: grant agencies and journal reviewers in neuroscience and psychiatry will accept an explanantion of behavior only if it eventually bottoms out in synapses, genes, or some other crane mechanism. If you propose a purely cognitive-level model — say, predicting depression relapse from belief-updating patterns — they treat it as a skyhook and reject it, even when the model is predictive and falsifiable. What theory of reduction does that institutional bias presuppose? Is it Dennett-style greedy reductionism, or just a practical rule about tractability? Would a non-reductive physicalist have to reject the practice, or can they say the funding rule is just about method not ontology? And if we rewrote the grant guidelines to treat top-down cognitive models as equally legitmate, what would that actually commit us to about explanantion? Please lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
