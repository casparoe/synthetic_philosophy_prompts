      *   *Refining for punchiness:* The bias presupposes methodological reductionism as a heuristic for causal tracking rather than ontological necessity, so non-reductive physicalists can accept it as pragmatic policy, though legitimizing top-down models equally would commit us to an explanatory pluralism where functional autonomy holds equal weight with mechanistic decomposition.

