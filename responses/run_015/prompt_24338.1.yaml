answer: |-
  Hi there, I hear you on the exhaustion, and honestly, that two-hour argument with your roommate is basically the entire history of statistics condensed into an evening, so you are in good company feeling rattled. The fight on your team happens because everyone is secretly using a different map for the same territory, and when the terrain gets rough, the maps contradict each other. You need a protocol that bypasses the ontology and goes straight to justification, something that tells you whether you are counting things, measuring physical tendencies, or just making an educated guess, because the risk committee cares less about truth and more about defensibility. Here is a procedure you can hand to a new analyst that forces them to classify the risk before they calculate it, and it should take them less than an hour to work through if they have the data in front of them.

  The procedure starts with a single question about the reference class. Ask whether there exists a large set of past events that are effectively identical to the one you are pricing, where identical means that swapping the current case with a past case would not change the underlying risk mechanics. If the answer is yes, and you have at least thirty to fifty observations, you are in frequentist territory. You calculate the empirical frequency, adjust for any known trend factors, and you are done, because the number is a fact about the past population. If the answer is no, because the event is unique or the data is too sparse, you move to the second question, which asks whether the outcome is determined by a physical system with known laws, like gravity or material stress, even if we haven't seen many failures. If the answer is yes, you are in propensity territory. You rely on engineering models or physical simulations to derive the probability, acknowledging that the number represents a physical tendency rather than a observed count. If the answer is no, because the system involves human agency, market shifts, or unique strategic decisions, you are in subjectivist territory. Here you must construct a prior belief based on analogs and expert opinion, and this is where you must stop pretending the number is a fact. The procedure requires you to explicitly document that the probability is a measure of confidence, not frequency, and this is the hand-off point where the analyst must flag the number for committee review as a judgment call wearing a lab coat. The procedure stops and declares the probability ill-defined if you cannot find a reference class, there is no physical model, and there are no credible analogs to form a prior, because in that case you are not doing risk analysis, you are guessing, and putting a decimal point on a guess is dangerous.

  Let's run this on your three cases to see where the friction points are. For pricing the brand new line of business where you have no loss history, the analyst starts at the reference class question and immediately hits a wall because there is no internal history. They must look for external industry data to form a proxy class. If they can find credible data from other insurers on similar products, they can treat that as a frequentist input for a prior, but they must adjust for the fact that their specific book might behave differently. If no external data exists, they fall to the second question about physical systems, which is obviously no for insurance lines, so they land in subjectivist territory. The output here is a probability based on expert elicitation from underwriters who have seen similar launches, but the procedure mandates that the analyst attaches a wide confidence interval and a label stating this is a subjective prior. This is manageable, though it requires humility, and the committee can accept it as long as they know it is a best estimate based on belief rather than fact.

  For the specific bridge failure in the next ten years, the analyst asks the reference class question and finds that while many bridges exist, this specific bridge has unique load conditions, age, and environmental exposure that make a simple frequency count of other bridges misleading. However, the second question about physical systems yields a yes. You have engineering specs, material degradation models, and traffic load data. The procedure directs them to use a propensity-based model, likely a fault tree or reliability model, to generate the probability. The number they write down is not how often bridges fail, but how likely this physical structure is to fail given its properties. The catch here, and this is where the procedure forces honesty, is that the model parameters themselves have uncertainty. The analyst must report the probability derived from the model but also report the sensitivity of that number to the input assumptions. This is usually acceptable to committees because it feels engineering-heavy, but it relies on the assumption that the physical laws hold steady over ten years, which is a judgment call about stability rather than a hard fact.

  Now for the chance that a particular mid-level employee quits within a year, and this is where I know you are not going to love the output. The analyst starts with the reference class and might be tempted to use historical turnover rates for that job grade. However, the procedure requires them to ask if swapping this specific employee with a past employee changes the risk mechanics. Since quitting is an agentic decision driven by personal factors, market conditions, and management relationships that are unique to this individual and this moment, the reference class is invalid for a specific prediction. The second question about physical systems is obviously no. So they land in subjectivist territory, but here is the hard part. Unlike the new line of business where you have industry analogs, or the bridge where you have physics, human agency is non-stationary and opaque. The procedure dictates that because there is no stable mechanism and no valid reference class for a specific individual, assigning a precise probability like 15 percent is scientifically ill-defined. You can assign a probability to the portfolio of employees quitting, but for this specific person, the number is pure speculation masquerading as risk assessment. The procedure forces the analyst to write down that this probability is undefined for pricing purposes and should only be used as a qualitative flag. I know your models want a number there to sum up the risk capital, but the protocol says putting a precise frequency on a unique human decision is a category error, and if you put that in the committee doc, you will get pushback from people who want to fill every cell in the spreadsheet, but it is the honest answer.

  The reason this works for your team is that it separates the math from the metaphysics. You do not need to agree on whether probability is real or in our heads to agree on whether you have data, a model, or just a opinion. The new analyst can run this in an hour because it is just a flowchart of evidence availability. The only place where it requires a human to take the wheel is at the subjectivist stage, where they must justify why their belief is calibrated and not just a guess. If you implement this, you will stop fighting about Bayesianism versus frequentism and start fighting about whether the evidence is sufficient, which is a much more productive argument to have before a pricing committee. I hope this helps calm the rattles after that argument, and feel free to send this over to the team if you think it would save them the next two-hour debate.
