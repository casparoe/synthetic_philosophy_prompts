answer: |-
  ### Part 1: Evaluation of Your Existing Rules

  You asked me to keep, refine, or scrap your two crude rules. Here is the assessment:

  **1. The Negative Control**
  *   **Verdict:** **Keep, but Refine.**
  *   **Why:** Your worry is correct. If applied too rigidly, this rule kills exploratory work. Legitimate revisionism often uses heuristic methods (rules of thumb) that aren't perfectly transferable to a lab setting.
  *   **Refinement:** Do not ask if the method *could* be run on a settled question. Ask: *"If we applied this specific logic to a known falsehood, would it still produce a positive result?"*
      *   *Example:* If the method finds "linguistic correspondences" between Atlantis and the Andes, run it on "English and Swahili." If it finds a "match" there too, the method detects noise, not signal.
      *   *Change:* Shift from "Can you run it?" to "Does it distinguish signal from noise?"

  **2. The Asymmetry Check**
  *   **Verdict:** **Keep, but Refine.**
  *   **Why:** Your worry is also correct. Tone is not evidence. An author can be polite and still propose a conspiracy; they can be abrasive and still be right.
  *   **Refinement:** Stop looking for "politeness." Look for the **Mechanism of Error.**
      *   *Pseudohistory:* Explains specialist rejection via *motive* (suppression, bias, academic protectionism).
      *   *Revisionism:* Explains specialist rejection via *evidence* (new data not previously available, reinterpretation of existing data, interdisciplinary blind spots).
      *   *Change:* If the author attributes the consensus's error to *malice or coordination*, it is a stop. If they attribute it to *limitation or new information*, it proceeds.

  ***

  ### Part 2: The Acquisitions Decision Procedure (The "Five-Point Protocol")

  This protocol is designed for a 90-minute committee meeting. It requires no specialized historiography knowledge, only logic and consistency. It moves from "Hard Stops" (Reject immediately) to "Judgement Calls" (Accept/Frame/Read).

  **Preparation (Editor):**
  Before the meeting, highlight the proposal's central claim and the three strongest pieces of evidence offered.

  **Step 1: The Positive Account (Hard Stop)**
  *   **Question:** Does the proposal explain *how* the event happened, not just *that* the standard view is wrong?
  *   **Sufficient Answer:** The author provides a mechanism (e.g., "Sea levels rose 40 meters due to X meltwater pulse," not just "Sea levels rose").
  *   **Fail Condition:** The argument rests entirely on "Experts can't explain X, therefore Y." (Argument from Ignorance).
  *   **Action:** If Fail → **Reject.** Do not proceed.

  **Step 2: The Coincidence Threshold (Hard Stop)**
  *   **Question:** For this thesis to be true, how many independent systems must have failed in the exact same way?
  *   **Sufficient Answer:** The error is localized (e.g., one region's dating is off, or one translation was misread).
  *   **Fail Condition:** The thesis requires dozens of unrelated cultures, languages, or dating methods to all be wrong by the same amount, without contact.
  *   **Action:** If Fail → **Reject.** (This catches the "Global Conspiracy" error without needing to prove a conspiracy).

  **Step 3: The Refined Negative Control (Judgement Call)**
  *   **Question:** Apply the "Blind Test." If we used the author's method on a known falsehood, would it validate that falsehood?
  *   **Sufficient Answer:** The method fails on the control case (it correctly identifies the falsehood as false).
  *   **Fail Condition:** The method finds "patterns" in random or unrelated data (e.g., finding "sacred geometry" in a modern parking lot).
  *   **Action:** If Fail → **Reject.** If Pass/Unclear → Proceed.

  **Step 4: The Mechanism of Error (Judgement Call)**
  *   **Question:** Why do specialists disagree with this? (Refined Asymmetry Check).
  *   **Sufficient Answer:** "They haven't seen this new data," or "They are specialists in text, not geology."
  *   **Fail Condition:** "They are protecting their tenure," "The establishment suppresses truth," or "They ignore evidence that doesn't fit."
  *   **Action:** If Fail → **Reject.** If Pass → Proceed.

  **Step 5: The Stakes and Framing (Decision Point)**
  *   **Question:** If this book is wrong, what is the harm?
  *   **Options:**
      *   *Low Harm:* It's an interesting theory, clearly labeled as speculation. → **Publish with Framing** (Foreword, "Speculative Series" branding).
      *   *High Harm:* It undermines established science/history without sufficient proof, likely to be debunked publicly. → **Commission Reader.**
      *   *Medium Harm/Unclear:* → **Commission Reader** (Use one of your two annual slots).
  *   **Note:** Only commission a reader if the proposal passed Steps 1–4. Do not pay a reader to fix a structural failure.

  ***

  ### Part 3: Where This Procedure Will Misfire

  You asked for honesty. This protocol is a filter, not a truth machine. It will fail in three specific scenarios:

  1.  **The Paradigm Shift:** True revolutionary science often looks like pseudohistory initially (e.g., Wegener's Continental Drift). It often requires many independent fields to be slightly wrong. This procedure will likely **Reject** a genuine paradigm shift because it fails the "Coincidence Threshold." You must accept that playing it safe means missing the once-in-a-generation breakthrough.
  2.  **The Interdisciplinary Bridge:** A proposal might fail Step 1 (Positive Account) because the author is bridging two fields (e.g., climatology and linguistics) and lacks the vocabulary to satisfy specialists in either. The procedure may flag this as "vague" when it is actually "novel."
  3.  **The Commercial Truth:** Some books are structurally pseudohistorical but culturally valuable (they spark public interest in history). This procedure prioritizes *epistemic integrity* over *cultural utility*. It may tell you to Reject a book that would sell 50,000 copies and get people reading history, simply because the methodology is loose.

  ***

  ### Part 4: Application to Current Season Proposals

  Here are the verdicts yielded by the protocol.

  #### Proposal 1: The Marine Geologist (Atlantis/Catastrophe)
  *   **Step 1 (Positive Account):** **Pass.** He offers a specific mechanism (Bronze Age polity, datable catastrophe, submerged features).
  *   **Step 2 (Coincidence Threshold):** **Pass.** He limits the claim to a specific polity and region, supported by deluge traditions (which are common). He does not claim *all* history is wrong.
  *   **Step 3 (Negative Control):** **Caution.** Linguistic correspondences are notoriously prone to noise. However, he concedes two identifications are speculative.
  *   **Step 4 (Mechanism of Error):** **Pass.** He accuses no one of suppression. He implies geologists have data historians lack.
  *   **Step 5 (Stakes):** If wrong, it is a localized error in prehistory, not a demolition of established history.
  *   **Verdict:** **Publish with Framing.**
      *   *Action:* Commission a specialist foreword to contextualize the linguistic speculation. Place in main list but ensure the subtitle indicates "Theory" or "Hypothesis."
      *   *Instinct Check:* You likely have an instinct to **Reject** this because it is "Atlantis." The procedure says **Accept.**
      *   *Advice:* **Trust the Procedure.** "Atlantis" is a toxic keyword, but a sober geological reconstruction of a Bronze Age collapse is legitimate history (e.g., Thera, Doggerland). Your instinct is fatigue; the procedure identifies the methodological rigor.

  #### Proposal 2: The Megalithic Masonry (Visitors/Tools)
  *   **Step 1 (Positive Account):** **Fail.** The proposal offers *no* positive account of who the visitors were, when they came, or how they left no trace. It relies entirely on "documented toolkits... [being] insufficient."
  *   **Step 2 (Coincidence Threshold):** **Fail.** Implies four distinct regions all received outside help without leaving genetic, linguistic, or cultural traces of that contact.
  *   **Step 3 (Negative Control):** **Fail.** The method is "If we can't explain it with known tools, it must be outsiders." Applied to the Pyramids of Giza today, if we lost the records, would this method suggest aliens? Yes. It is an argument from ignorance.
  *   **Verdict:** **Reject.**
      *   *Instinct Check:* You noted it is "expected to sell extremely well." Your instinct is to **Accept with Framing** for revenue.
      *   *Advice:* **Trust the Procedure.** This is the "error in roughly equal measure" you feared. Publishing this invites the "pseudohistory" label you received three years ago. The reputational cost of a "Ancient Aliens" book outweighs the advance. It fails the structural test of providing a positive mechanism.

  #### Proposal 3: The Chronology Reconstruction (Fomenko-adjacent)
  *   **Step 1 (Positive Account):** **Pass.** Rebuilding from astronomical records is a valid method in principle.
  *   **Step 2 (Coincidence Threshold):** **Fail.** The reconstruction asks the reader to accept that "dozens of independent documentary traditions were systematically misdated by the same few centuries." This is the structural hallmark of pseudohistory. For this to be true, Chinese, Mayan, Roman, and Egyptian scribes would all have to make the *same* error independently.
  *   **Step 3 (Negative Control):** **Pass/Unclear.** The author lists refutations and avoids conspiracy language. It *looks* rigorous.
  *   **Step 4 (Mechanism of Error):** **Pass.** No conspiracy language.
  *   **Step 5 (Stakes):** High. If wrong, it invalidates the timeline of human civilization.
  *   **Verdict:** **Commission Reader.**
      *   *Action:* This is the one where the procedure might misfire, or where your instinct might be wrong. It passes the "politeness" and "method" checks but fails the "Coincidence Threshold." However, because it is mathematically framed, you need an expert to confirm the statistical impossibility.
      *   *Instinct Check:* You likely feel this is **Nonsense.** The procedure says **Spend Money to Verify.**
      *   *Advice:* **Trust the Procedure.** Even if you are 95% sure it is wrong, this proposal is dressed in the clothing of rigor (citations, refutation lists). If you reject it without a reader, and it turns out to have a novel kernel of truth (unlikely, but possible), you look anti-intellectual. If you reject it and it is pseudohistory, you lose a reader fee. If you *accept* it without a reader, you risk your entire history list's credibility. The procedure correctly identifies this as the highest risk/reward ambiguity. Use one of your two annual reader slots here.

  ### Summary of Conflicts

  1.  **Proposal 1 (Atlantis):** Procedure says **Yes**, Instinct says **No.**
      *   *Resolution:* Trust the Procedure. Your instinct is bias against the topic; the proposal is methodologically sound.
  2.  **Proposal 2 (Megaliths):** Procedure says **No**, Instinct says **Yes (Sales).**
      *   *Resolution:* Trust the Procedure. This is the reputational risk you explicitly want to avoid.
  3.  **Proposal 3 (Chronology):** Procedure says **Read**, Instinct says **No.**
      *   *Resolution:* Trust the Procedure. It looks too rigorous to kill without expert validation, even if the "Coincidence Threshold" is suspicious. The reader fee is insurance against looking closed-minded.

  **Final Note:** The procedure is designed to protect you from the *structural* errors of pseudohistory (Argument from Ignorance, Global Coincidence, Conspiracy Mechanism). It cannot protect you from market failure. If Proposal 2 sells a million copies and you rejected it, you made the right intellectual decision and the wrong business one. That is a cost of doing trade publishing in this category.
