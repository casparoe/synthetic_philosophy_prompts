answer: |-
  The boxes smelled of vanilla and decay, the specific scent of lignin breaking down in climate-controlled darkness. Elias loaded the last of the Tuesday run into the back of the county courier van. These were the pre-closure files from Oakhaven District. In three weeks, there would be no more Tuesday run. There would be no Oakhaven District.

  He wiped his hands on his trousers and looked up at the building. It was brick, old and solid, sitting on a hill that overlooked the valley where the new highway cut through the trees. It looked like a school or a library, not a place where people bled.

  Mara was waiting by the loading dock. She was the Chief of Nursing, though for the last month she had functioned more as a foreman for a demolition crew that hadn't arrived yet. She held a clipboard against her chest like a shield.

  "Driver," she said. She didn't look at the boxes. She looked at the van's odometer. "You take the direct route to the County Analytics office?"

  "Always," Elias said. "Highway to 9, then down to the civic center."

  "Take the back road," she said. "Through the industrial park. It adds six minutes."

  "Dispatch logs the time, Mara. I can't pad the ticket."

  "It's not about the ticket." She stepped closer. The wind off the valley was cold, whipping the loose hair from her bun. "I'm putting a folder in box 402. Top layer. I need you to hand it to Dr. Vance personally. Not the intake clerk. Vance."

  Elias hesitated. Protocol was strict. Chain of custody for medical records was unbroken steel. "I'm a courier, Mara. I drop at the receiving bay."

  "Box 402," she repeated. She didn't wait for an answer. She turned and walked back into the hospital, her shoes clicking on the concrete.

  Elias loaded the box. It was lighter than the others. He slid it into the slot marked *Analytics – Priority*.

  ***

  The County Analytics office was in the basement of the civic center, a windowless floor that hummed with the sound of server racks. Dr. Vance was waiting for him. She was a woman of sharp angles, wearing a blazer that cost more than Elias's van. She stood by the receiving bay with a tablet in her hand.

  "You're late," she said, checking her watch.

  "Traffic on 9."

  "Dispatch says traffic was clear." She didn't look up from the tablet. "Sign here."

  Elias signed. He hesitated, his pen hovering over the digital pad. "Mara from Oakhaven asked me to give you something. Box 402."

  Vance stopped scrolling. She looked at the van, then at Elias. "She's not supposed to be segregating files. The archive order is alphabetical by patient ID."

  "It's on top. She said it's important."

  Vance sighed, a sound of exhausted patience. "Bring it."

  Elias retrieved the box. It was awkward to carry, the cardboard flaps slightly bulging. He followed Vance into the sorting room. It was a vast space, white walls, fluorescent lights that buzzed at a frequency Elias felt in his teeth. Tables were stacked with similar boxes, waiting to be digitized.

  Vance set the box on a table and opened the flaps. The folder was manila, thick with paper. She opened it. Inside were printouts. Not digital exports, but printouts from the local Oakhaven server.

  "She's circling the same drain," Vance said. She tapped a page. "Look at this."

  Elias wasn't supposed to look. He was a driver. But the page was angled toward him, and the bold text caught his eye. *Departmental Outcomes: FY23.*

  "She wants to show me the categories," Vance said. She wasn't talking to Elias, really. She was talking to the room. "Maternity. Trauma. Long-term care. In every single silo, Oakhaven has a higher survival rate than St. Jude's. By a significant margin."

  "Then why close it?" Elias asked. The words were out before he could stop them.

  Vance looked at him. Her eyes were gray, tired. "Because silos are lies, driver. They are comforting lies." She pulled another sheet from the folder. This one had a single number circled in red ink. *Overall Mortality Rate.* "This is the truth."

  "The bottom number is worse," Elias said.

  "Yes. Oakhaven treats patients better once they are categorized. But St. Jude's keeps more people alive from the moment they walk through the door."

  "That doesn't make sense."

  "It makes perfect sense if you understand risk." Vance began to stack the papers back into the folder. "Imagine you are driving down the highway. You don't know if you're going to have a heart attack, or skid off the road, or just get a flat tire. You only know you are driving. If you want to know your chances of surviving the trip, do you look at the survival rate of heart attack victims? Or the survival rate of everyone who got in a car?"

  "You look at everyone."

  "Exactly. Oakhaven's numbers are high because they are excellent at treating specific problems. But St. Jude's numbers are high because they are excellent at managing uncertainty." Vance sealed the folder. "A patient walking in off the street does not know their category. They are a statistic of the whole. For them, the overall number is the only one that predicts their fate."

  "Mara says the overall number is rigged."

  "Mara is a nurse. She sees the bed. She sees the treatment. I see the system." Vance handed the folder back to Elias. "Take this back."

  "I can't. It's for the archive."

  "Then put it in the archive. But tell her the decision stands. The Board meets on Friday. The closure is ratified."

  ***

  Elias drove the back road on the return trip. The industrial park was deserted, rows of warehouses with broken windows like missing teeth. He thought about the numbers. He wasn't good at math, but he understood weight. He understood that a box full of bricks weighed more than a box full of feathers, even if the boxes were the same size.

  When he got back to Oakhaven, the lights in the windows were dimmed. The night shift was already settling in. He found Mara in the nurse's station, which was half-cleared. Half the desks were empty.

  "She wouldn't take it," Elias said, placing the folder on the counter.

  Mara didn't touch it. She was staring at a computer screen. "She told you about the overall rate."

  "She said it's about risk. About not knowing what's wrong with you yet."

  Mara finally looked at him. Her eyes were red-rimmed. "Do you know how many ambulances bypass us?"

  "No."

  "Forty percent. If a call comes in from the north sector, dispatch sends them to St. Jude's. Even if we're closer. Even if we have a bed. They say St. Jude's is the 'Regional Hub.' So who comes to us?"

  "Who?"

  "The ones who are already dying. The ones who crash on the road right in front of us. The ones who are too far gone to be moved." She tapped the screen. "And the ones who are easy. The sprains. The flu. The check-ups. We do the easy stuff perfectly. We do the hard stuff perfectly. But we don't get the middle."

  "The middle?"

  "The ambiguous cases. The chest pain that might be gas, might be a heart attack. The fall that might be a bruise, might be a bleed." Mara stood up and walked to the window. "St. Jude's takes them all. They admit the chest pain immediately. They run the scans. If it's gas, they send them home. That's a win for their survival rate. If it's a heart attack, they treat it. If they die, it counts against them."

  "And here?"

  "Here, if a patient comes in with chest pain, we stabilize and transfer. We don't admit them. So they don't count in our admission stats. We only admit the ones we are sure we can fix." She turned back to him. "So look at our categories. Maternity. We only admit low-risk pregnancies. High-risk goes to St. Jude's. So our maternal mortality is zero. St. Jude's is point-five percent. We win."

  "Trauma?"

  "We stabilize and transfer the severe trauma. We keep the broken arms. St. Jude's keeps the crushed chests. They lose more. We win."

  Elias looked at the folder on the counter. "So the categories are... curated."

  "They are honest reflections of our skill," Mara corrected. "If you come here with a broken arm, you are safer here than at St. Jude's. If you come here to have a baby, and it's a normal birth, you are safer here. The care is better. The nurses know the patients. The doctors aren't rotating every three weeks."

  "But if you come in with chest pain..."

  "Then you get sent to St. Jude's before you even see a doctor."

  "So the overall number," Elias said slowly. "It includes the people you send away."

  "It includes the risk we refused to take." Mara walked back to the counter and picked up the folder. She didn't open it. "Vance says the overall number is what matters for the public. She's right. If you are a member of the public, you don't know if you're a broken arm or a crushed chest. You need a hospital that takes everything. St. Jude's takes everything. That makes them safer for the county."

  "But it makes you redundant."

  "It makes us a clinic." She laughed, a short, dry sound. "We are a high-end clinic with a hearse in the back. And the county doesn't fund clinics. They fund hubs."

  Elias felt a strange heaviness in his chest. He had thought the numbers were a mistake. A glitch in the spreadsheet that Mara could fix with a highlighted memo. But it wasn't a glitch. It was a design.

  "Why did you give me the folder?" Elias asked. "If you knew she wouldn't look."

  "Because I needed someone to carry it." Mara leaned against the counter. "I needed to know that the argument left the building. That it wasn't just trapped in here with us."

  "Did it change anything?"

  "No." She looked down at the folder. "But now, when the lights go out, I know the numbers didn't lie. We were better. And we were worse. Both things were true."

  ***

  The final Friday arrived with a storm. Rain lashed against the windshield of the van, the wipers fighting a losing battle. Elias had one last load. These weren't records. They were equipment. Monitors, IV pumps, the portable ultrasound machines. The things that had value.

  He parked at the loading dock. The bay door was open. Inside, the corridor was dark. The power had been cut to the wings, leaving only the emergency strips glowing green along the floor.

  He wasn't supposed to go inside. He was supposed to wait for the porters. But the bay was empty. He grabbed a hand truck and wheeled it into the lobby.

  Mara was there. She was wearing her coat. She stood in the center of the lobby, looking up at the reception desk.

  "Porters are stuck in the mud on the access road," she said. She didn't turn around. "I'll help you load."

  "You don't have to do that."

  "I want to." She walked over and lifted one end of a gurney. "Heavy."

  They worked in silence. The rain hammered the glass roof of the atrium. They loaded the pumps, the monitors, the oxygen concentrators. When the van was full, Elias closed the rear door. The sound was a heavy clang that echoed in the empty parking lot.

  He turned back to the hospital. Mara was still standing in the lobby. She was holding a key.

  "Vance called me this morning," Mara said.

  Elias walked back up the steps. The water pooled around his boots.

  "She apologized," Mara said. "She said the Board voted unanimously. She said they ran the models three times."

  "The models?"

  "Population health projections. If Oakhaven stays open, the overall county mortality rate rises by point-zero-four percent." Mara looked at the key in her hand. It was a master key, heavy brass. "Because resources are diluted. Because the best surgeons get split between two sites. Because the ambulance routing gets confused."

  "So keeping you open kills people."

  "Statistically. In the aggregate." She dropped the key into her pocket. "But specific people. Specific people will die because they had a baby here and the power went out during the transfer. Specific people will live because they had a broken arm and the nurse here knew their name."

  "Which number is real, Mara?"

  She looked at him, and for the first time, she looked like she was seeing him, not just the courier. "Both. That's the thing they don't tell you. The math isn't a mirror. It's a map. And you can draw the map however you want. You can draw the map of the rooms, or you can draw the map of the building."

  She walked past him, down the steps. She didn't look back at the building.

  "Are you locking up?" Elias asked.

  "Security does it. I'm done." She got into her car. The engine turned over, sputtering in the cold. "You driving back to the civic center?"

  "Yeah."

  "Tell Vance the key is in the drop box."

  "I will."

  Mara drove away. Her taillights disappeared into the gray curtain of rain.

  Elias stood in the parking lot for a long time. He thought about the boxes in the back of his van. Thousands of stories, reduced to data points. *Patient ID: 4092. Outcome: Discharged. Patient ID: 4093. Outcome: Deceased.*

  He thought about the woman who would walk into St. Jude's on Monday. She would have chest pain. She would be admitted. She would be a number in the "Cardiology" column. She would be a number in the "Overall" column. If she lived, St. Jude's got a win. If she died, St. Jude's took the hit.

  At Oakhaven, she would have been transferred. She would have been a "Transport." She wouldn't have counted in the survival rate at all. Oakhaven would have kept its perfect score. St. Jude's would have taken the risk.

  Elias got into the van. He put the key in the glove compartment to remember to drop it off. He started the engine.

  As he pulled out of the lot, he looked in the rearview mirror. The emergency lights in the lobby clicked off. One by one, the green strips along the floor went dark. The building didn't vanish; it just lost its definition. It became a shape against the sky, a silhouette of brick and glass.

  He drove toward the highway. The wipers swept left, right. Left, right. Clearing the view, then letting it blur again.

  He thought about the folder in the archive. Box 402. Someday, a researcher might pull it. They would see the two tables. They would see the category wins and the overall loss. They would write a paper about statistical anomalies. They would call it a paradox.

  Elias merged onto the highway. The traffic was heavy. Brake lights glowed red in the rain, a long line of them stretching toward the city. He was just one more car in the flow. He didn't know if he was in a safe category or a dangerous one. He didn't know if the road was designed for his survival, or for the survival of the traffic as a whole.

  He turned on the radio. A voice talked about the budget surplus. A voice talked about the storm.

  Elias turned it off. He drove in the silence, carrying the weight of the numbers, knowing that neither of them added up to the feeling of the lights going out.
