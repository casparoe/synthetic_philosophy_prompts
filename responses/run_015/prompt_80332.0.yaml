      *   They are operating with different criteria for what counts as a "solution." A wants a metaphysical anchor; B says metaphysics is the problem.

  7.  **Identify What Both Might Be Missing:**
      *   *Normativity:* How does the community *correct* me? If it's just what they do, what if they all change? (The "Dispositional" vs. "Normative" distinction).
