answer: |-
  Here is the specification for an adequate theory of moral progress, followed by the analysis of its internal coherence and constraints.

  ### The Requirements Specification

  | # | Requirement | Specification | Rationale |
  | :--- | :--- | :--- | :--- |
  | **1** | **Meta-Ethical Anchor** | The theory must explicitly define the metric by which "progress" is measured (e.g., reduction of suffering, increase in autonomy, alignment with divine command). | Without a defined axis of improvement, "progress" is merely change; this prevents the theory from smuggling in unstated values. |
  | **2** | **Historical Non-Linearity** | The theory must account for clear cases of moral regression, such as the collapse of the Weimar Republic into Nazi Germany, without dismissing them as statistical noise. | If a theory can only explain victories, it is a myth of inevitability rather than a model of reality; it must explain how gains are lost. |
  | **3** | **Causal Attribution** | The theory must distinguish moral shifts driven by internal normative change from those driven by material conditions, such as the decline of slavery due to industrial inefficiency rather than abolitionist conviction. | This addresses the suspicion that progress is an epiphenomenon of technology or economics rather than a genuine change in moral status. |
  | **4** | **Phenomenological Distinction** | The theory must separate changes in what people *say* is right (expressed norms) from changes in what actually *happens* to people (experienced outcomes). | This prevents the theory from conflating virtue signaling or legal codification with actual improvements in human welfare. |
  | **5** | **Scope Distinction** | The theory must distinguish between the circle of concern genuinely expanding versus the enforcement of a universal rule that was previously ignored (e.g., "all men are created equal" applied finally to non-property owners). | This determines whether we are discovering new moral truths or merely correcting errors in applying old ones, which changes the nature of the "progress." |
  | **6** | **Psychological Plausibility** | The theory must sit comfortably with evolutionary findings on in-group favoritism and Dunbar's number, or explain why moral progress is stable despite our biology tuning us for small-scale tribalism. | If the theory requires humans to act against their deep evolutionary grain without a mechanism for stability, it predicts its own collapse. |
  | **7** | **Reversibility Condition** | The theory must specify whether moral progress is ratcheting (hard to undo) or fragile (easy to lose), and provide a mechanism for that stability or fragility. | A theory that cannot explain why progress might persist (or vanish) in the future offers no predictive or explanatory power regarding the current moment. |

  ***

  ### Analysis of the Requirements

  **Non-Negotiable vs. Partisan Requirements**
  Requirements 1, 3, and 4 are non-negotiable for any theory claiming to describe reality rather than offer inspiration. Requirement 1 (Meta-Ethical Anchor) is foundational; you cannot measure distance without a unit of measurement. Requirement 3 (Causal Attribution) is critical for your specific concern about hindsight bias; if a theory cannot separate economic necessity from moral awakening, it cannot answer whether the "progress" is real or just a side effect of wealth. Requirement 4 (Phenomenological Distinction) is necessary to avoid conflating propaganda with reality.

  Requirement 6 (Psychological Plausibility) often masquerades as neutral but can be partisan. A strict moral realist might argue that moral truth exists independently of human psychology, and thus our tribal instincts are irrelevant errors to be overcome, not constraints to be accommodated. However, for a *naturalistic* theory of progress (one that exists in the physical world), this is non-negotiable. Requirement 2 (Historical Non-Linearity) is also often ignored by teleological theories (like certain Hegelian or Whig histories) that view history as a straight line; insisting on this requirement rules out those optimistic narratives, but it is necessary for intellectual honesty.

  **Joint Unsatisfiability**
  There is a significant tension, potentially a contradiction, between Requirement 1 (Meta-Ethical Anchor) and Requirement 6 (Psychological Plausibility), depending on how they are cashed out.

  If Requirement 1 demands an objective, mind-independent moral truth (Moral Realism) that we are progressively discovering, and Requirement 6 demands compatibility with evolutionary biology (which suggests our moral instincts are adaptive heuristics for fitness, not truth-tracking mechanisms), the theory faces an "Evolutionary Debunking" problem. If our moral faculties were shaped by natural selection for survival in small bands, why should we trust them to perceive objective universal truths about non-human animals or future generations?

  To satisfy both, the theory must adopt a specific meta-ethical stance, likely Constructivism or Sentimentalism, where moral progress is not "finding truth" but "building better tools for cooperation." If the theory insists on Realism *and* strict Evolutionary Naturalism without a bridge (like a "moral faculty" argument), the requirements are jointly unsatisfiable. The theory would have to claim that evolution accidentally produced truth-trackers, which is a low-probability claim, or that moral truth is irrelevant to the biological mechanism, which undermines the "progress" claim.

  **The Single Exclusionary Requirement**
  The requirement that does the most work in excluding bad theories is **Requirement 3: Causal Attribution**.

  This requirement rules out the largest class of comforting but inadequate narratives: **Epiphenomenal Theories**. These are theories that claim moral progress is real but fail to account for the fact that many "moral" shifts coincide perfectly with shifts in resource abundance, state capacity, or technology. For example, a theory that attributes the decline of interpersonal violence solely to a "humanitarian revolution" is ruled out if it cannot account for the simultaneous rise of the Leviathan state and the increasing cost of violent conflict.

  By forcing the theory to isolate the *moral* variable from the *material* variable, Requirement 3 excludes any theory that treats history as a morality play. It demands that if you claim people got better, you must show they chose the "better" option when the "cheaper" or "easier" option was available. If the theory cannot do this, it confirms your suspicion that moral progress is just the story people at the end of the sequence tell themselves to justify the material conditions they happen to inhabit.
