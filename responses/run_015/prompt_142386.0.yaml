prompt: |-
  You're a professional moral philosopher with a sideline in facilitating adversarial collaborations — you're the person who has to draft the language both sides will actually put their name to, so you're good at wording that's neither vacuous nor slanted. Take your time: brainstorm the hard cases and the failure modes first, then draft.

  I just spent like three hours arguing with my friend Marcus after a birthday thing and we got nowhere. His side: a big chunk of ordinary confident moral judgments — the "I just know that's wrong" ones (harmless but gut-punching cases, the identifiable victim, doing vs allowing, stuff that shouldn't be for sale) — are biases. They flip when you swap an emotionally loaded but morally irrelevant feature, they run on disgust and outrage and contamination, and the right response is to correct or discount them. My side: most of those are better described as preferences — stable second-order attitudes about what kind of person or community to be, which don't have to track welfare to be respected, and shouldn't be "fixed" without the person's own endorsement. We kept calling each other launderers: he says I launder biases into preferences, I say he launders preferences into biases.

  Draft the joint statement we should have written. Both of us actually liked this diagnostic, so build the document around it: for any contested judgment J, construct its mirror — identical in everything the subject themself counts as morally relevant, but with the loaded feature inverted (gory ↔ clinical, near ↔ far, kin ↔ stranger, doing ↔ allowing, sympathetic agent ↔ loathsome one). If J weakens or reverses in the mirror, he says bias; I say it can just as well reveal a preference, e.g. for clean hands or for closeness.

  Give me: numbered agreed claims (including what each of us means by "preference" and "bias," and whether that pair is even exhaustive); a table of the remaining disagreements, each row in wording its own side would sign; the cruxes — I suspect one is the cost-of-error asymmetry, i.e. which mistake is worse, and another is whether a judgment that survives being told its own causal origin is thereby vindicated; and for each crux a concrete case or finding both of us would accept as bearing on it, with each of our predictions written down in advance. If you conclude part of our fight is purely verbal, say which part and why.
