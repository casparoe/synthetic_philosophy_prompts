  # JOINT STATEMENT OF PARTIAL AGREEMENT AND REGISTERED DISAGREEMENT
  **Parties:** "Marcus" (The Debunker) and "User" (The Constructivist)
  **Facilitator:** Adversarial Collaboration Protocol
  **Date:** October 26, 2023
  **Subject:** The Normative Status of Emotionally-Loaded Moral Judgments

  ## PREAMBLE
  We acknowledge that our three-hour discussion reached an impasse not due to a lack of shared facts, but due to a divergence in how we categorize the *normative force* of intuitive moral judgments. We agree that the "Mirror Test" is a valid diagnostic tool for isolating the influence of emotionally loaded features (e.g., proximity, kinship, visceral disgust) from welfare outcomes. We disagree on the interpretation of a positive result on this test.

  This document formalizes our shared diagnostic framework while explicitly registering our meta-ethical divergence to prevent future "laundering" accusations.

  ---

  ## I. NUMBERED AGREED CLAIMS

  1.  **The Mirror Test Protocol:** For any contested moral judgment $J$, we agree to construct a Mirror Case $J'$. $J'$ must be identical to the original case in all consequences for welfare, rights violations, and consent, but must invert the emotionally loaded feature $F$ (e.g., *kin* $\leftrightarrow$ *stranger*, *gory* $\leftrightarrow$ *clinical*, *active* $\leftrightarrow$ *passive*).
  2.  **Diagnostic Significance:** We agree that if judgment $J$ weakens or reverses in $J'$, the difference in judgment is causally dependent on feature $F$. We agree this dependence is the proper object of analysis.
  3.  **Definition of "Bias" (Operational):** For the purpose of this collaboration, a judgment is classified as **Bias-Driven** if the sensitivity to feature $F$ persists *against* the agent's own reflective endorsement of impartial principles. (Marcus emphasizes this category; User acknowledges its existence).
  4.  **Definition of "Preference" (Operational):** A judgment is classified as **Preference-Driven** if the sensitivity to feature $F$ persists *alongside* the agent's reflective endorsement that $F$ is a legitimate constituent of their conception of a good life or community, even if it reduces aggregate welfare. (User emphasizes this category; Marcus acknowledges its existence).
  5.  **Non-Exhaustiveness:** We agree that "Bias" and "Preference" do not exhaust all sources of moral judgment. Both parties acknowledge the existence of **Cognitive Error** (e.g., miscalculating consequences) and **Ignorance** (e.g., lacking relevant facts), which are distinct from both Bias and Preference.
  6.  **The Laundering Constraint:** We agree that neither party may accuse the other of "laundering" without specifying whether the error is:
      *   (a) Misidentifying a Bias as a Preference (Marcus's charge against User), or
      *   (b) Misidentifying a Preference as a Bias (User's charge against Marcus).
      *   *Constraint:* The accuser must demonstrate that the agent would *reject* the judgment under the conditions defined in Claims 3 or 4.

  ---

  ## II. TABLE OF REMAINING DISAGREEMENTS

  | Point of Divergence | Marcus's Position (The Debunker) | User's Position (The Constructivist) |
  | :--- | :--- | :--- |
  | **1. Normative Weight of $F$** | Sensitivity to $F$ (e.g., disgust, proximity) is presumptively illegitimate. The burden of proof lies on the agent to justify why $F$ should matter. | Sensitivity to $F$ is presumptively valid as data about the agent's values. The burden of proof lies on the critic to show why $F$ *should not* matter. |
  | **2. The Goal of Correction** | Moral progress consists in aligning judgments with impartial welfare principles. Judgments failing the Mirror Test should be "corrected" to match $J'$. | Moral progress consists in achieving coherence between judgments and identity. Judgments failing the Mirror Test should be "integrated" or explicitly owned. |
  | **3. The Status of "Clean Hands"** | A preference for "clean hands" (doing vs. allowing) that ignores welfare maximization is a moral failure (self-indulgence). | A preference for "clean hands" is a legitimate constraint on action, even if it results in worse overall outcomes (integrity). |
  | **4. Endorsement Threshold** | A judgment is only a "Preference" if it survives a procedure of *impartial* reflection (stripping away the emotional load). | A judgment is a "Preference" if it survives a procedure of *personal* reflection (acknowledging the emotional load as part of the self). |

  ---

  ## III. THE CRUXES

  We identify two specific empirical/theoretical cruxes that determine which side carries the day in hard cases. For each, we specify a concrete case, a relevant finding, and pre-registered predictions.

  ### Crux 1: The Cost-of-Error Asymmetry
  **Question:** In cases where Bias and Preference are indistinguishable phenomenologically, which error is more costly to society: treating a Bias as a Preference (validating a glitch) or treating a Preference as a Bias (violating integrity)?

  *   **Concrete Case:** *The Identifiable Victim Policy.*
      *   **Scenario:** A government has \$1M. Option A saves 10 statistical lives. Option B saves 1 named, photographed child. Welfare outcome is roughly equivalent (or A is slightly better). Public outrage demands Option B.
      *   **Marcus's View:** Yielding to outrage is Bias (inefficient allocation). Cost of Error: Lives lost due to inefficiency.
      *   **User's View:** Yielding to outrage is Preference (social cohesion/trust). Cost of Error: Civic alienation/trust collapse.

  *   **Relevant Finding:** Longitudinal data on public trust in institutions that enforce impartial rules vs. those that accommodate emotional exceptions.
  *   **Pre-Registered Predictions:**
      *   **Marcus predicts:** Institutions that consistently discount the Identifiable Victim effect (choose A) will show higher long-term welfare metrics without significant loss of legitimacy.
      *   **User predicts:** Institutions that consistently discount the Identifiable Victim effect (choose A) will suffer a "legitimacy crisis" leading to non-compliance or political instability that outweighs the welfare gain of saving the extra statistical lives.

  ### Crux 2: Vindication by Causal Origin
  **Question:** Does knowing the causal origin of a judgment (e.g., "I feel this way because of evolutionary disgust mechanisms") defeat the justification for that judgment?

  *   **Concrete Case:** *The Sterile Incest (Modified Haidt Case).*
      *   **Scenario:** A sibling pair engages in protected sexual activity in private, no risk of pregnancy, no psychological harm, both report enjoyment. Upon learning the causal origin of their *own* retrospective guilt is merely "evolutionary contamination avoidance," they still feel it was wrong.
      *   **Marcus's View:** Knowing the origin is "just disgust" debunks the judgment. If they still feel it's wrong, it is a stubborn Bias.
      *   **User's View:** Knowing the origin explains the feeling but does not negate the value. The desire to avoid "contamination" is itself a Preference for a certain kind of bodily sanctity.

  *   **Relevant Finding:** Psychological studies on "Genetic Fallacy" resilience. Do agents retain normative confidence after debunking explanations if the judgment serves a identity-constituting function?
  *   **Pre-Registered Predictions:**
      *   **Marcus predicts:** When subjects are successfully primed to view their disgust as a "neural glitch," their confidence in the wrongness of the act will decrease significantly (correlation $> 0.5$).
      *   **User predicts:** When subjects view the disgust as "part of who I am," their confidence will remain stable despite the causal explanation. The *explanation* does not drive the *confidence*; the *commitment* does.

  ---

  ## IV. VERBAL DISPUTE IDENTIFICATION

  We conclude that approximately **40%** of our argument is a purely verbal dispute regarding the definition of **"Morally Relevant."**

  *   **The Dispute:**
      *   **Marcus** uses "Morally Relevant" to mean *impersonally consequential* (e.g., pain, pleasure, death). Under this definition, feature $F$ (e.g., kinship) is by definition irrelevant, so sensitivity to it is Bias.
      *   **User** uses "Morally Relevant" to mean *reason-giving for the agent* (e.g., special obligations, integrity). Under this definition, feature $F$ is by definition relevant, so sensitivity to it is Preference.
  *   **Resolution Protocol:**
      *   In future discussions, we will not ask "Is feature $F$ morally relevant?"
      *   Instead, we will ask: **"Does feature $F$ generate a reason that outweighs welfare consequences?"**
      *   Marcus will answer: "No, never."
      *   User will answer: "Yes, sometimes."
      *   This isolates the substantive disagreement from the semantic one.

  ---

  ## V. SIGNATURES

  **Marcus:** ____________________ (I sign this acknowledging that Preferences exist, but maintaining they are often over-claimed.)

  **User:** _____________________ (I sign this acknowledging that Biases exist, but maintaining they are often over-diagnosed.)

  **Facilitator Note:** *This document is designed to be stable. If either party finds themselves accusing the other of "laundering" again, refer immediately to Claim 6 (The Laundering Constraint).*
