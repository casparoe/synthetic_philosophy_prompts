prompt: |-
  Write a satirical product-review article, approximately 650 to 750 words, in the deadpan, meticulously comparative voice of a high-end consumer-technology publication such as Wirecutter or Consumer Reports, reviewing two competing subscription-based moral reasoning frameworks: Generalism Pro and Particularism Unlimited. The piece should open with a headline and an introductory "How We Tested" section, move through side-by-side comparison tables rendered in prose, offer a "Best For" recommendation, and close with a brief customer-service note. The satire must arise from accurate philosophical content rather than caricature: Generalism should be portrayed as committed to invariant, universalizable moral principles whose weights remain stable across structurally similar contexts, while Particularism should be portrayed as denying that reasons carry fixed cross-contextual valence, treating the holistic shape of situations as primary, and regarding defeasibility as the default operating condition rather than an exception. Do not reduce the debate to rigid rule-following versus intuition; instead, exaggerate the real structural tensions—for example, Generalism's difficulty explaining how apparently identical actions can carry opposite moral weights when embedded in different relational networks, and Particularism's difficulty offering predictive guidance without covertly reintroducing hidden generalizations.

  To prevent the review from being answerable by pure retrieval, embed the following invented evaluation apparatus and treat it as an industry-standard benchmark familiar to readers: the "ICNA Context-Switch Latency Protocol," measuring how rapidly a framework revises reason-weights when background conditions shift; the "Invariant Valence Retention Score," tracking whether a reason maintains identical polarity across structurally analogous cases; and the "Defeasibility Drift Index," quantifying the frequency of ad hoc contextual adjustments required to preserve internal consistency. The review should reference these metrics as though they are well established, and must include at least one invented customer testimonial formatted in quotation marks but clearly fictional—such as a statement attributed to "Dr. Elara Voss, Senior Normative Engineer at the Berlin Institute for Applied Ethics." Additionally, include a boxed sidebar titled "What About Hybrid Models?" that addresses whether a principled particularism or context-sensitive generalism can split the difference, and conclude that both frameworks fail the "Refund Policy for Continuity Disputes"—an invented warranty clause that satirizes personal-identity-style worries about whether a user who switches frameworks remains the same moral agent over time.

  Write in American English. Do not include bibliographies, reading lists, citations, or references to specific page numbers. Do not invoke named living persons. The humor should remain sustained and deadpan: a specialist in the particularism literature should recognize the exaggerations as fair representations of real positions, while a non-specialist should be able to follow the comparison as a genuine, if absurd, consumer evaluation.
