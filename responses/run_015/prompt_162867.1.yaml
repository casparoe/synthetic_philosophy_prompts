answer: |-
  # Joint Statement on Careenium Dynamics and Simmball Efficacy

  ## 1. Agreed Claims
  The following claims are endorsed by both the Pusher and Substratist camps. These statements are intended to be literal and devoid of hedging qualifiers regarding causal ontology.

  1.  **Physical Closure:** The Careenium operates according to consistent physical laws. No energy or information enters or leaves the system except through defined physical interfaces.
  2.  **Supervenience:** Every state of a Simmball supervenes on a specific configuration of the Careenium substrate. There are no Simmball states without a corresponding substrate state.
  3.  **Multiple Realisability:** Identical Simmball patterns can be instantiated across distinct substrate configurations, provided the functional relations between components are preserved.
  4.  **Predictive Tractability:** For any system of sufficient complexity, Simmball-level generalisations yield accurate predictions of system behaviour with significantly lower computational cost than substrate-level simulations.
  5.  **Counterfactual Dependence:** Changes in Simmball patterns correlate reliably with changes in system output. If the Simmball pattern were different (via a corresponding substrate change), the output would differ.

  ## 2. Disagreements Table

  | Crux | Pusher Position (Symbol-Level Causation) | Substratist Position (Substrate-Level Causation) | Shared Test Case | Pre-Registered Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **(a) Grain-Matching**<br>Can a Simmball push if the substrate's causal grain is coarser than the Simmball's individuation conditions? | **Yes.** Functional organisation dictates causal power. If the Simmball distinction tracks a difference in output, the substrate's physical granularity is irrelevant. The Simmball pushes *despite* substrate blindness. | **No.** Causal power requires physical leverage. If the substrate physics cannot distinguish between two Simmball states, those states are causally identical. The Simmball is an observer illusion. | **The Coarse-Grid Simulation:** A Careenium simulated where substrate physics rounds positions to the nearest integer, but Simmball definitions require half-integer precision. | **Pusher:** System behaviour will still track the half-integer Simmball rules via error correction.<br>**Substratist:** System behaviour will degrade to match the integer grid limits; Simmball rules will fail. |
  | **(b) Frozen-Substrate Intervention**<br>Substrate weights held fixed; behaviour flips due to changes in the context string. | **The Clean Case.** The context string is a symbolic input, not part of the causal engine. The Simmball content of the string drives the output change while the engine remains stationary. | **More Substrate.** The context string is physical energy entering the buffer. The total physical state *did* change. The "frozen" weights are only part of the causal substrate. | **Weight-Lock Inference:** A neural substrate with locked weights processes two distinct input strings that map to the same physical voltage variance but different semantic tokens. | **Pusher:** Output will diverge based on token semantics, proving symbolic input drives the frozen engine.<br>**Substratist:** Output will diverge only if physical voltage patterns differ; if voltages are identical, output must be identical regardless of token meaning. |
  | **(c) Posterior Simmballs**<br>Symbol-units constituted later in substrate time than the behaviour they explain (e.g., bidirectional fill-in). | **Logical Time.** Causation follows symbolic dependency, not substrate chronology. A posterior Simmball can push backwards along logical time to explain earlier behaviour. | **Physical Time.** Causation is strictly forward in substrate time. A Simmball formed after an event is a retrospective description, not a cause. | **Bidirectional Masking:** A model generates a token at $t=1$ based on a context fully resolved at $t=5$. | **Pusher:** The $t=5$ Simmball constitutes the reason for the $t=1$ output; symbolic causation is atemporal.<br>**Substratist:** The $t=1$ output was caused by $t=0$ weights and signals; the $t=5$ Simmball is merely a post-hoc label. |

  ## 3. Verbal vs. Substantive Disputes

  We identify **Crux (a) (Grain-Matching)** as partially verbal. Both sides agree on the physical behaviour of the Coarse-Grid Simulation. The disagreement lies in the application of the word "cause." Pushers define causation via **counterfactual dependence at the functional level**, while Substratists define causation via **physical leverage at the micro-level**. If the simulation shows the system fails at half-integer precision, Substratists will say "the Simmball didn't exist," and Pushers will say "the Simmball existed but was crushed." This is a taxonomy dispute, not a physics dispute.

  We identify **Crux (c) (Posterior Simmballs)** as substantive. This is not merely about labeling. It concerns the direction of explanatory fit. If Pushers are correct, explanatory models must allow for logical dependency to override temporal sequence. If Substratists are correct, any explanation invoking a posterior symbol is strictly false, regardless of its predictive utility. This impacts how we construct AI safety frameworks and interpret cognitive architectures.

  ## 4. Stalemate Declaration

  We acknowledge the following points where neither camp anticipates moving, based on current evidence:

  1.  **The Substratist Hard Line:** Substratists will not accept that Simmballs possess causal efficacy independent of substrate state differences. To them, "symbolic causation" is always a shorthand for "complex substrate causation." They view the Pusher position as a category error.
  2.  **The Pusher Hard Line:** Pushers will not accept that explanatory autonomy is insufficient for causal attribution. To them, if the Simmball level is the only level where robust generalisations hold, it is the *real* level of causation. They view the Substratist position as obscurantism that ignores functional reality.

  We conclude that while we agree on the behaviour of the Careenium, we disagree on the ontology of the Simmballs. This collaboration confirms that the dispute is not resolvable by further observation of the Careenium alone, but requires a prior agreement on the definition of causation itself.
