answer: |-
  Good evening. For those who don't know me, I make things up for a living. For those who do know me, you know I've been trying to make sense of [Friend's Name] since we were eighteen.

  Forty years ago, she decided to study the world as it is. I decided to study the world as it isn't. She spent those forty years working on structural realism. For the half of this room that doesn't speak Greek or Physics, that's the idea that when science changes its mind about what the world is made of, the *stuff* changes—the ether vanishes, the phlogiston cools—but the mathematical relationships stay put. The equations survive. The equations were doing the work all along.

  [Friend's Name] held a stricter version than most. She was a realist about the structure, but agnostic about the nodes. She believed the web was real, but she wouldn't commit to whether there were actually spiders sitting at the intersections.

  She had a private nickname for the worry that haunted this position. She called it **"The Connect-the-Dots Fraud."** It's the worry that if there are enough objects lying around, you can draw any pattern you like between them. If the room is crowded enough, saying "there is a path through the room" is close to saying nothing. She never solved the Connect-the-Dots Fraud. She knew she hadn't solved it. She would want it on the record that she died— professionally speaking—still worrying about the dots.

  People tell me I should explain her work using my own. They say: "When you rewrite a novel, the characters' natures change, chapters vanish, but the shape of how they stand to each other remains. That's structural realism."

  I'm told that analogy is too generous to her in one particular way. It is. When I keep the structure of a story while changing the details, I am making a choice. I am the author. When [Friend's Name] found structure surviving the death of a theory, she wasn't making a choice. She was submitting to a constraint. I preserve structure because it's useful. She preserved it because she believed it was the only thing that wasn't a lie. The analogy credits her with my cynicism. She deserved better.

  Someone suggested I describe her tonight using her own philosophy. I should describe her not by who she *was*, but by what she was *to* other people. Define her entirely by her relations. Mother, friend, colleague, hiker. A node defined by its vectors.

  It's a brilliant idea. It's also twee. And she would have hated it. She wasn't just a intersection of lines. She was the tension that kept the lines straight. So I won't do that. I will say this: If you felt pulled toward rigor, if you felt a sudden correction in your trajectory when you started to drift into sentimentality, that was her field. You don't need to know the mass of the planet to feel the gravity.

  For the experts in the room: She is retiring. But given her position, she claims she isn't leaving the profession. The objects are departing, but the structural relations of her career remain invariant. She insists this is merely a theory change, not an elimination. I told her that from where I'm standing, the object known as [Friend's Name] is currently holding a glass of wine, and I'm realist enough about that to want another toast.

  For the grandkids, who will repeat exactly one thing from this in the car: Your grandmother taught me that even if you don't know what things *are*, you can know how they *fit*. So if you don't know what you want to be when you grow up, just make sure you know how you want to stand next to other people. That's the part that stays.

  She was a tough woman. She didn't suffer fools, and she didn't suffer softness. She wouldn't want me to say we loved her, because "love" is a word for objects, and she was suspicious of objects. But the structure of this friendship has survived forty years of theory changes. We have changed. The world has changed. The equations of this room, tonight, balance.

  She left the Connect-the-Dots Fraud unsolved. She leaves us the work. That was always her way. She didn't give us answers. She gave us the shape of the question.

  To [Friend's Name].
