answer: |-
  You have a sharp eye for the machinery of science. What you're describing is a recognized phenomenon in Science and Technology Studies (STS) and social epistemology, but **no single canonical term exists** that captures that specific triad: (1) an information cascade origin, (2) bureaucratic codification, and (3) punitive enforcement that sustains an epistemic error.

  Usually, this is described as a hybrid of **Path Dependence** (the lock-in), **Institutional Isomorphism** (the copying mechanism), and **Methodological Monoculture** (the outcome). But you are right to feel these are imprecise. Path dependence is often economic or technological (like the QWERTY keyboard) and doesn't inherently capture the *social punishment* for deviation. Information cascades assume individuals are optimizing for truth but lack data; your example shows individuals optimizing for *funding survival* regardless of truth.

  Since the carving doesn't fully exist, I will coin a term that respects the precision you're looking for, and then map its boundaries against the concepts you already know.

  ### The Coined Term: **The Epistemic Compliance Cascade**

  This term isolates the specific configuration you observed. It distinguishes the *motivation* (compliance/survival) from the *mechanism* (cascade) and the *domain* (epistemology/method).

  ### Boundary Mapping

  Here is precisely how an **Epistemic Compliance Cascade** differs from the adjacent concepts you mentioned:

  **1. vs. Standard Information Cascade**
  *   **Standard Cascade:** Agents ignore private signals to follow public actions because they assume the crowd has better information. It is driven by *uncertainty*.
  *   **Epistemic Compliance Cascade:** Agents adopt the method not because they believe it is superior, but because they believe *reviewers* believe it is superior. It is driven by *risk management*. In your example, the ecologists didn't necessarily think the package was best; they knew rejecting it meant starving. The cascade isn't about truth-tracking; it's about signal-tracking.

  **2. vs. Path Dependence**
  *   **Path Dependence:** Focuses on "switching costs." Once a standard is set, it becomes too expensive or difficult to change (e.g., train everyone anew). It is often passive inertia.
  *   **Epistemic Compliance Cascade:** Focuses on "entry barriers." It is active enforcement. The bureaucracy doesn't just make it hard to leave; it actively punishes those who try to enter with a different tool. The lock-in isn't just historical; it is *normative*. A grad student using a better but non-standard method isn't facing "switching costs"; they are facing rejection.

  **3. vs. Groupthink**
  *   **Groupthink:** A psychological phenomenon where a desire for harmony or conformity within a *specific group* results in irrational decision-making. It is internal and interpersonal.
  *   **Epistemic Compliance Cascade:** A structural phenomenon enforced by *external institutions* (grant agencies, journals). You can have an Epistemic Compliance Cascade even if every individual scientist privately hates the method and knows it's flawed. It requires no psychological harmony, only structural alignment.

  **4. vs. Institutional Isomorphism**
  *   **Institutional Isomorphism:** (DiMaggio & Powell) This is the closest existing sociological term. It describes how organizations become similar.
  *   **Epistemic Compliance Cascade:** This is a *subtype* of isomorphism specifically where the convergence degrades *epistemic quality*. Isomorphism can be neutral or efficient; an Epistemic Compliance Cascade is defined by the eventual discovery of the *bias* or *error* that was ignored during the cascade. It specifies the *cost* of the conformity.

  ### Why this distinction matters
  In philosophy of science, we often talk about the "Division of Cognitive Labor." Ideally, some scientists should take risks on new methods while others stick to standards. An **Epistemic Compliance Cascade** represents a collapse of that division. The bureaucracy eliminates the "risk-takers" not because their science is bad, but because their *paperwork* is non-compliant.

  You observed a shift from **science as inquiry** to **science as certification**. The term needs to reflect that the method became a credential rather than a tool. "Epistemic Compliance Cascade" captures the moment the tool stopped being about the birds and started being about the grant.
