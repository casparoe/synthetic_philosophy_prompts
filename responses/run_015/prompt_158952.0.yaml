      *   *The "Belief" Definition:* I need to be careful not to commit to a specific metaphysical theory of belief (e.g., functionalism vs. representationalism) unless necessary. The Intentional Stance is functionalist.
      *   *Internal Activations:* The user asks about this. In humans, activations (neural firing) distinguish actor from character (the actor's brain lights up differently than the character's "mind"). In models, activations *are* the only mind there is. If the activations encode $P$, the system "believes" $P$ functionally.
