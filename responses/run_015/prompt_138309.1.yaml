answer: |-
  You have put your finger on a precise structural flaw in a specific class of ethical arguments, and your entomological intuition is philosophically sound. The literature you are reading (likely within the Effective Altruism or animal ethics spheres) often glosses over this distinction because it is mathematically convenient to treat probabilities as independent, but biologically dishonest to do so.

  Here are the established terms for the components of your snag, followed by a proposed term for the package, defined with the edges you requested.

  ### 1. Individual vs. Kind Probability
  **Established Terms:** *Aleatory vs. Epistemic Uncertainty* (Risk Analysis) or *Token vs. Type Uncertainty* (Philosophy).

  *   **Aleatory (Token) Uncertainty:** This is your "coin flip" model. The property (sentience) varies randomly among individuals within the group. Even if we know everything about the species, individual beetles might differ.
  *   **Epistemic (Type) Uncertainty:** This is your "honest reading." The uncertainty lies in our knowledge of the *parameter* itself. Either the physiological architecture of *Coleoptera* supports sentience or it does not. The uncertainty is shared across all members of the class.

  In decision theory, this is often called **Correlated Uncertainty**. If the uncertainty is epistemic, the risks are perfectly correlated. If you are wrong about one cricket, you are wrong about all of them. Expected Value (EV) calculations often treat these as independent (Aleatory) to smooth out the variance, but as you noted, this preserves the *mean* expected value while destroying the *variance* profile. In the epistemic case, you are not risking a "few sentient bugs"; you are risking a "moral catastrophe" (mass suffering) with low probability, versus "business as usual" with high probability.

  ### 2. The "Where Do You Stop Counting" Problem
  **Established Term:** *The Reference Class Problem*.

  This is a well-known issue in probability and law. To assign a probability to an event (e.g., "This organism is sentient"), you must place it in a reference class (e.g., "Insects," "Arthropods," "Animals with Nociceptors," "Living Cells").
  *   If your class is "Insects," the population is $10^{18}$ and probability is $5\%$.
  *   If your class is "Soil Nematodes," the population is $10^{20}$ and probability is... unknown.
  *   If your class is "Bacteria," the population is $10^{30}$ and probability is near zero.

  Because the probability curve (likelihood of sentience) and the population curve (abundance) move in opposite directions, the "Expected Moral Weight" is hypersensitive to where you draw the taxonomic line. If the argument relies on the sum total, but the sum total depends on an arbitrary taxonomic cutoff, the argument is unstable. This is a form of the **Sorites Paradox** applied to moral status.

  ### 3. Is it Pascal's Mugging?
  **Verdict:** No, but it is a close neighbor.
  **Established Term:** *Expected Value Fanaticism*.

  Pascal's Mugging relies on a *fabricated* payoff (I promise you $3 \uparrow\uparrow\uparrow 3$ years of happiness). Your scenario relies on *empirical* counts (there really are that many insects).
  However, the structural problem is the same: **Unbounded Expectations.** When you allow low-probability hypotheses to dominate decision-making simply because the stakes (or numbers) are large enough, you open yourself to "Fanaticism." In philosophy, this is often discussed under the **Longtermism** critique. The specific variant you are describing, where empirical abundance drives the fanaticism rather than magical payoffs, is sometimes called **Empirical Fanaticism**.

  ***

  ### The Coined Term: The Correlated Aggregation Dilemma

  Since there is no single phrase that captures the combination of *Epistemic Correlation* + *Reference Class Sensitivity* + *Empirical Fanaticism*, I propose the following term for the package.

  **Term:** **The Correlated Aggregation Dilemma**

  **Definition:** An ethical argument failure mode where moral weight is calculated by multiplying a population count by a probability of moral status, but the calculation fails to account for (a) the correlation of uncertainty across the population (epistemic vs. aleatory), and (b) the arbitrariness of the taxonomic boundary used to define the population.

  **Edges Marked:**

  *   **What it IS:**
      *   It is a critique of **Expected Value Maximization** in animal ethics.
      *   It applies specifically when the evidence for moral status (sentience/consciousness) is **taxonomic** (based on species traits) rather than **individual** (based on individual history).
      *   It highlights that the *variance* of the outcome matters, not just the *mean*. (i.e., A 5% chance of 1 quintillion sufferers is a different policy problem than a 100% chance of 50 quadrillion sufferers).
      *   It identifies that the conclusion shifts depending on the **Reference Class** (Insects vs. Nematodes vs. Protists).

  *   **What it IS NOT:**
      *   It is **not Pascal's Mugging**. Pascal's Mugging involves a *hypothetical* payoff leveraged by a threat. This dilemma involves *empirical* population counts leveraged by scientific uncertainty.
      *   It is **not Scope Neglect**. Scope neglect is when humans *psychologically* fail to grasp large numbers. This dilemma is when the *math* of large numbers swamps the probability too aggressively.
      *   It is **not the Repugnant Conclusion**. The Repugnant Conclusion is about trading quality of life for quantity of lives. This is about the *probability of having a life that matters at all*.

  *   **Nearby Thing People Mix It Up With:**
      *   **The Precautionary Principle.** People often say, "We should apply the Precautionary Principle to insects." The Correlated Aggregation Dilemma explains *why* that is difficult: if the uncertainty is correlated (Type-level), the "precaution" might require sacrificing enormous certain resources for a small chance of avoiding a catastrophe, which looks indistinguishable from fanaticism.

  ### Summary for your Reading
  When you encounter this argument in the future, you can classify it as follows:
  1.  **The Probability Model:** They are treating **Epistemic Uncertainty** as if it were **Aleatory Uncertainty**.
  2.  **The Population Model:** They are ignoring the **Reference Class Problem** (why stop at insects?).
  3.  **The Decision Theory:** They are succumbing to **Expected Value Fanaticism**.

  Your entomological instinct is the correct one: evidence of sentience is phylogenetic. Therefore, the uncertainty is correlated. Therefore, the "Expected Value" is not a stable guide for action, because it represents a gamble on a biological fact, not a distribution of moral patients.
