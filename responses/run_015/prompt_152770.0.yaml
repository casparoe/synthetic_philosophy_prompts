      *   **The Accurate Parts (The Separation Thesis):** Confirm Claim 1 and 2. Explain *Jus Ad Bellum* vs. *Jus In Bello*. Explain why Walzer thinks this is necessary (to protect the rules of war from collapsing).
      *   **The Distortions (Mercenaries/Draftees):** Address Claim 3. This is the biggest error. Walzer doesn't base MEC on conscription vs. volunteering. He bases it on the "coercion" of the situation and the separation of spheres. Mercenaries are treated differently, but not because they "chose an unjust cause" specifically, but because they lack political allegiance/commitment.
      *   **The "Mindless Tools" Objection:** Address Claim 4. This is a critique (likely referencing McMahan or Rodin), but the roommate's conclusion is wrong. Walzer *does* blame soldiers for war crimes. The objection is about *jus ad bellum* responsibility, not *jus in bello*. Explain the nuance: Walzer limits responsibility to the tactical level, not the strategic level.
