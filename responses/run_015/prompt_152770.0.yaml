      *   *Check:* Mercenaries. In *Just and Unjust Wars*, Walzer suggests mercenaries might not deserve POW status. But the roommate's logic ("choose to fight for an unjust cause") is the error. A volunteer in a national army fighting an unjust war is still protected by MEC. A mercenary is not protected because they are a mercenary, not necessarily because their specific war is unjust.
