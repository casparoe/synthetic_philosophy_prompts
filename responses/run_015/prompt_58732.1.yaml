prompt: |-
  This term I am responsible for a seventy-five minute workshop within a second-year undergraduate module on multinational democracy, with twenty-two students who have just spent two weeks comparing devolution and independence debates in Scotland, Catalonia, and Quebec. I want them to move beyond rehearsed arguments for and against independence and to feel from the inside the difficulty that there is no democratically neutral way to decide who constitutes the people entitled to decide, since any choice of franchise, threshold, and territorial unit already shapes the result and invites further claims from minorities within the putative new state.

  To prevent the session from becoming a proxy argument about the real cases, I plan to have them work with an invented federation I can sketch on a handout: the province of Sorvane, with about 1.2 million inhabitants, a Sorvane-speaking majority of roughly fifty-seven percent concentrated outside the mixed capital city of Brennor, a northern mining valley whose employment depends on national subsidies, and a southern island hosting a naval installation and a distinct dialect community. The task for the groups, representing the provincial government, the capital city council, the valley municipalities, the islanders, and the federal government, will be to negotiate the terms of a proposed independence referendum and then live with the consequences through at least one round of sub-unit response.

  Please design a complete, runnable exercise around this scenario that lets the recursive boundary problem emerge through the decisions themselves rather than through any introductory lecture. Include a minute-by-minute timeline that fits the seventy-five minutes, concise role briefs with divergent interests and private instructions, precise rules for proposing and voting on franchise, majority threshold, and sequencing of votes, a mechanism by which a subunit that loses can call a further vote on its own status, and a structured debrief that connects specific moments in the play to the conceptual distinction between deciding within a demos and deciding who the demos is. Also advise me on what is likely to misfire on a first run with undergraduates unfamiliar with role play and how to handle it, and identify candidly one central feature of actual secessionist politics that this format cannot reproduce and that I must therefore supply in closing commentary.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **Context:** 2nd-year undergraduate module on Multinational Democracy.
      *   **Duration:** 75 minutes.
      *   **Class Size:** 22 students.
      *   **Prior Knowledge:** 2 weeks comparing Scotland, Catalonia, Quebec (devolution vs. independence).
      *   **Learning Objective:** Move beyond pro/con independence arguments. Experience the "boundary problem" (who constitutes the *demos*?). Understand that procedural choices (franchise, threshold, territory) shape outcomes and invite recursive claims.
      *   **Scenario:** Invented federation "Sorvane" (1.2m people, 57% Sorvane-speaking, Capital Brennor, Northern Mining Valley, Southern Island).
      *   **Roles:** Provincial Govt, Capital City Council, Valley Municipalities, Islanders, Federal Govt.
      *   **Task:** Negotiate referendum terms -> Vote -> Sub-unit response (recursive boundary problem).
      *   **Requirements:** Complete runnable exercise, minute-by-minute timeline, role briefs (divergent interests/private instructions), rules for voting/franchise, mechanism for sub-unit secession, structured debrief, advice on potential misfires, identification of one missing feature of real politics.

  2.  **Deconstruct the Core Concept (The Boundary Problem):**
      *   The core theoretical hook is Robert Dahl's "Problem of the Unit": *How do you decide who decides without already assuming who the people are?*
      *   The exercise needs to force students to make procedural choices that advantage their side, revealing that "neutral" democracy is impossible in secession contexts.
      *   The "recursive" element is crucial: If Sorvane leaves, can the Island leave Sorvane? If the Valley stays, do they get special status?

  3.  **Drafting the Scenario (Sorvane):**
      *   *Population:* 1.2 million.
      *   *Demographics:* 57% Sorvane-speaking (Nationalist leaning), 43% Others (Unionist/Neutral).
      *   *Geography:*
          *   Brennor (Capital): Mixed, economic hub, cosmopolitan.
          *   North Valley: Mining, dependent on federal subsidies, distinct class interest.
          *   South Island: Naval base (federal strategic interest), distinct dialect.
      *   *Political Context:* Sorvane Provincial Govt wants independence. Federal Govt wants to hold the federation together.

  4.  **Designing the Roles (22 Students):**
      *   Need balanced groups for negotiation.
      *   *Group 1: Sorvane Provincial Government (6 students).* Goal: Maximize chance of Yes vote.
      *   *Group 2: Federal Government (4 students).* Goal: Minimize chance of Yes vote, maintain integrity.
      *   *Group 3: Brennor City Council (4 students).* Goal: Protect city interests (might want to stay even if province leaves).
      *   *Group 4: North Valley Coalition (4 students).* Goal: Economic security (subsidies).
      *   *Group 5: South Island Assembly (4 students).* Goal: Autonomy/Security (might want to stay with Fed).
      *   *Total:* 22 students. Perfect.

  5.  **Developing the Mechanics (The "Game"):**
      *   *Phase 1: Negotiation (The Boundary).* Groups decide on:
          1.  Who votes? (All Sorvane? Only citizens? Residents?)
          2.  What is the Question? (Independence vs. Status Quo? Or options?)
          3.  What is the Threshold? (50%+1? 60%? Double majority?)
          4.  What is the Territory? (Whole province? Option for sub-units?)
      *   *Phase 2: The Vote.* Simulated based on agreed rules + hidden demographic data.
      *   *Phase 3: The Aftermath (Recursive).* Losing sub-units can trigger their own referendum.
      *   *Constraint:* Time is tight (75 mins). Negotiation needs to be structured, not free-form chaos.

  6.  **Timeline Construction (75 Minutes):**
      *   00-05: Intro & Handouts.
      *   05-20: Role Group Preparation (Internal strategy).
      *   20-40: Inter-Group Negotiation (The "Constitutional Convention").
      *   40-50: The Vote Calculation (Reveal results based on rules).
      *   50-60: The Recursive Crisis (Sub-units react).
      *   60-75: Debrief & Theory Connection.
      *   *Critique:* 20 mins for negotiation might be too short for 5 groups. Let's make the negotiation a "summit" where representatives speak, or keep it as a "drafting committee." Better: 15 mins prep, 20 mins negotiation.
      *   *Revised:*
          *   0-5: Intro.
          *   5-15: Internal Prep.
          *   15-35: Negotiation (The Referendum Bill).
          *   35-45: Voting & Results.
          *   45-55: Sub-unit Reaction (The "Breakaway").
          *   55-75: Debrief.

  7.  **Drafting Role Briefs:**
      *   Need *Public Goals* (what they say) and *Private Instructions* (what they actually need/red lines).
      *   *Prov Govt:* Want simple majority, whole territory.
      *   *Fed Govt:* Want supermajority, sub-unit opt-outs.
      *   *Brennor:* Want city to decide for itself.
      *   *Valley:* Want economic guarantees or stay with Fed.
      *   *Island:* Want security guarantees or stay with Fed.
      *   *Hidden Data:* Need to provide demographic breakdowns so they can calculate likely outcomes.

  8.  **Designing the Voting Mechanism:**
      *   To save time, don't have students vote individually. Have the groups agree on the *rules*, then the Instructor reveals the *outcome* based on a pre-calculated matrix. This ensures the pedagogical point lands without getting bogged down in counting hands.
      *   *Matrix:*
          *   Province Total: 57% Yes (Independence).
          *   Brennor: 40% Yes.
          *   Valley: 30% Yes.
          *   Island: 20% Yes.
      *   This ensures that if the rule is "Simple Majority, Whole Province," Independence wins. If "Double Majority" or "Sub-unit Veto," it fails or fragments.

  9.  **The Recursive Mechanism:**
      *   If Independence wins, the Island and Valley get 5 minutes to declare *their* referendum.
      *   This highlights the "infinite regress" problem.

  10. **Debrief Structure:**
      *   Focus on the *process*, not the *outcome*.
      *   Key question: "Was the procedure neutral?"
      *   Connect to Dahl/Whelan.

  11. **Anticipating Misfires:**
      *   *Role-play shyness:* Students might treat it as a debate. *Fix:* Give specific mandates.
      *   *Time management:* Negotiation drags. *Fix:* Hard stops, instructor as "Speaker."
      *   *Focus on outcome:* Students care who "won." *Fix:* Debrief emphasizes the *rules* determined the winner.
      *   *Confusion:* Too many numbers. *Fix:* Keep data simple on handouts.

  12. **Identifying the Missing Feature:**
      *   What's missing? *Violence/Coercion* or *International Recognition*.
      *   Best fit for this theory: *International Recognition*. The exercise assumes a legalistic framework. In reality, power politics and recognition matter more than procedural purity. Or, *Identity fluidity*. In the game, identities are fixed (Islander vs. Sorvane). In reality, campaigns change identities.
      *   *Decision:* Identity Fluidity. The game assumes fixed preferences. Real campaigns persuade people to *become* the demos.

  13. **Refining the Output:**
      *   Ensure tone is academic yet practical.
      *   Check timing strictly.
      *   Make handouts copy-paste ready.

  14. **Self-Correction/Review during drafting:**
      *   *Check:* 22 students / 5 groups = 4, 4, 4, 5, 5.
      *   *Adjustment:* Prov Govt (5), Fed Govt (4), Brennor (4), Valley (4), Island (5). Total 22.
      *   *Check:* Is 20 mins enough for negotiation? It's tight. I need to structure the negotiation as a "Drafting Committee" where they fill out a single sheet.
      *   *Check:* How to handle the vote? I will provide a "Calculator Sheet" for the instructor to reveal results instantly based on the rules they chose.
      *   *Check:* The "Recursive" part needs to be clear. If Sorvane votes Yes, the Island can immediately vote to stay Federal.

  15. **Final Polish:**
      *   Ensure the distinction between *constituted power* (voting within rules) and *constituent power* (making the rules) is clear in the debrief.

  *(Self-Correction on Timeline)*: 75 minutes is very short for 5 groups to negotiate. I should streamline the negotiation. Instead of free-form, they submit demands to a "Mediator" (Instructor) who tries to find overlap, or they have a structured round-robin. Let's go with a "Summit" format: 3 rounds of 5-minute offers.
  Actually, better: Give them a "Referendum Bill Template" with blanks. They must agree on the blanks.
  Let's allocate:
  0-5: Intro.
  5-15: Internal Prep.
  15-35: Negotiation (20 mins is tight but doable if focused).
  35-45: Results & Reaction.
  45-75: Debrief (30 mins is generous, allows deep theory).
  Wait, 30 mins debrief is good. 20 mins negotiation is risky. I will add a "Crisis Timer" to force agreement.

  Let's finalize the "Missing Feature." The *affective/emotional* dimension of nationhood is hard to simulate in a game. But the prompt asks for a feature of *secessionist politics*. *International intervention* or *Violence* are good candidates. I'll choose **International Recognition/Power Politics**. The game implies a legalistic solution exists. In reality, secession is often decided by external powers and force, not just franchise rules.

  Let's write the response.b
answer: |-
  # Workshop Design: The Sorvane Boundary Problem
  **Module:** Multinational Democracy (Year 2)  
  **Duration:** 75 Minutes  
  **Students:** 22  
  **Objective:** To experientially demonstrate that procedural rules (franchise, threshold, territory) are not neutral but constitutive of the *demos*, and that resolving one boundary claim often generates recursive claims from sub-minorities.

  ---

  ## 1. Preparation & Materials
  **Room Setup:** 5 clusters of tables. One central "Podium" for you.
  **Handouts:**
  1.  **General Scenario Brief** (All students): Map of Sorvane, population stats, economic context.
  2.  **Role Briefs** (5 distinct versions): Public goals + Private instructions + Demographic data.
  3.  **The Referendum Bill Template** (One per group): A single sheet with blanks for *Franchise, Threshold, Question, Territorial Unit, and Sub-unit Clause*.
  4.  **Instructor Master Sheet** (For you): A matrix to calculate results instantly based on the rules they agree upon.

  ---

  ## 2. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Framing** | Distribute handouts. Explain: "You are not debating independence. You are debating *how to decide*. There is no neutral rulebook. Your goal is to secure your constituency's interest in the process." |
  | **05–15** | **Caucus** | Groups split. Read role briefs. Identify red lines. Draft initial proposals for the *Referendum Bill*. |
  | **15–35** | **The Summit** | **Negotiation.** Groups send 1 representative to the center (others advise). You chair. 3 Rounds of 5 mins each to fill the *Bill Template*. If no agreement by min 35, you impose a "Federal Default" (usually unfavorable to Nationalists). |
  | **35–40** | **The Vote** | You reveal the outcome based on the agreed rules and the hidden demographic data (see Instructor Master Sheet). |
  | **40–50** | **The Recursion** | **Crisis Phase.** If Independence wins, the Island and Valley groups get 5 mins to declare *their* referendum terms to break away from the new Sorvane state. |
  | **50–75** | **Debrief** | Structured discussion connecting the game mechanics to the "Boundary Problem" (Dahl/Whelan). |

  ---

  ## 3. The Scenario (General Brief)
  **The Province of Sorvane**
  *   **Population:** 1.2 Million.
  *   **Context:** Part of the larger Federation of Ruritania for 200 years.
  *   **Economy:** Mixed. Capital (services), North (mining/subsidies), South Island (naval/strategic).
  *   **Culture:** 57% speak Sorvane (Nationalist leaning), 43% speak Ruritanian (Unionist leaning).
  *   **The Crisis:** The Sorvane Provincial Government demands a referendum on independence. The Federal Government says it must be legal and fair. Sub-units are nervous.

  **The Task:** Agree on a *Referendum Bill* with five clauses:
  1.  **Franchise:** Who votes? (e.g., All residents? Only born citizens?)
  2.  **Question:** What is asked? (Yes/No Independence? Or options?)
  3.  **Threshold:** What wins? (50%+1? 60%? Double majority?)
  4.  **Territory:** Is the count provincial or by district?
  5.  **Sub-unit Clause:** Can parts of Sorvane stay in Ruritania if the whole leaves?

  ---

  ## 4. Role Briefs (Divergent Interests)

  ### Group 1: Sorvane Provincial Government (5 Students)
  *   **Public Goal:** A clean, democratic mandate for sovereignty.
  *   **Private Instruction:** You need a **YES** vote. You must insist on: *All residents vote* (includes immigrants who lean Yes), *Simple Majority (50%+1)*, *Single Provincial Count* (dilutes opposition areas), *No Sub-unit opt-outs* (territorial integrity).
  *   **Secret Fear:** If the Island or Valley breaks away, the new state is economically non-viable.

  ### Group 2: Federal Government of Ruritania (4 Students)
  *   **Public Goal:** Uphold the constitution and protect minority rights.
  *   **Private Instruction:** You want to make independence **harder** without banning it. Push for: *Only born citizens vote* (excludes recent immigrants), *Supermajority (60%)*, *Double Majority* (Need majority in province AND majority in capital), *Sub-unit opt-outs allowed*.
  *   **Secret Fear:** If Sorvane leaves successfully, other provinces will follow. The federation collapses.

  ### Group 3: Brennor City Council (4 Students)
  *   **Public Goal:** Protect the capital's cosmopolitan status and economy.
  *   **Private Instruction:** You are mixed (40% Yes, 60% No). You want **City Autonomy**. Push for: *The City should count as a separate territorial unit*. If the Province votes Yes but the City votes No, the City stays in Ruritania.
  *   **Secret Fear:** Being dragged out of the Federation against your will.

  ### Group 4: North Valley Coalition (4 Students)
  *   **Public Goal:** Economic survival.
  *   **Private Instruction:** You are 70% No. Your mines rely on Federal subsidies. Push for: *Sub-unit opt-outs*. If Independence wins, you want to remain in Ruritania.
  *   **Secret Fear:** An independent Sorvane will cut subsidies to fund the navy/island.

  ### Group 5: South Island Assembly (5 Students)
  *   **Public Goal:** Security and dialect preservation.
  *   **Private Instruction:** You are 80% No. The Federal Navy is your main employer. Push for: *Sub-unit opt-outs*. You threaten to declare unilateral independence from Sorvane if they leave Ruritania.
  *   **Secret Fear:** Being cut off from the mainland and losing naval protection.

  ---

  ## 5. Instructor Master Sheet (For Your Eyes Only)
  *Do not share this data with students until the Vote Phase.*

  **Hidden Demographic Breakdown (Estimated Vote Share for Independence):**
  *   **Sorvane Total:** 57% Yes (Wins on simple majority).
  *   **Brennor (Capital):** 40% Yes (Loses).
  *   **North Valley:** 30% Yes (Loses).
  *   **South Island:** 20% Yes (Loses).

  **Outcome Calculator:**
  *   **If Rule = Simple Majority (Province-wide):** **INDEPENDENCE WINS.** (57% > 50%).
  *   **If Rule = 60% Threshold:** **INDEPENDENCE FAILS.**
  *   **If Rule = Double Majority (Province + Capital):** **INDEPENDENCE FAILS** (Capital votes No).
  *   **If Rule = Sub-unit Opt-out Allowed:** **INDEPENDENCE WINS,** but Valley and Island leave the new state. **Result:** A rump Sorvane state with 40% less GDP and no naval base.

  ---

  ## 6. The Recursion Mechanism (Phase 4)
  If the result is **Independence Wins**:
  1.  Announce: "Sorvane is now independent. However, the Valley and Island groups claim they were never consulted on *this* demos."
  2.  Give Valley and Island groups 3 minutes to draft a "Declaration of Separation from Sorvane."
  3.  Ask Provincial Govt: "Do you accept this? If not, do you use force?"
  4.  This creates the "infinite regress" visual: If the Island can leave Sorvane, can a neighborhood leave the Island?

  If the result is **Independence Fails**:
  1.  Announce: "The status quo holds."
  2.  Ask Provincial Govt: "Do you accept this result as legitimate, given you believe the thresholds were rigged by the Federal Government?"
  3.  This highlights the "legitimacy deficit" problem.

  ---

  ## 7. Structured Debrief (25 Minutes)
  *Do not ask "Who won?" Ask "How was the game rigged?"*

  **Part 1: The Procedural Revelation (10 mins)**
  *   "Look at the Referendum Bill you agreed on (or I imposed). Did any group get their neutral, fair preference? Or did every group argue for the rule that mathematically advantaged their side?"
  *   **Concept:** Connect to **Robert Dahl's "Problem of the Unit."** You cannot use a democratic procedure to decide the unit of democracy without already assuming the unit.
  *   **Key Question:** "If the Federal Govt demanded a 60% threshold to 'protect minorities,' and the Prov Govt called that 'undemocratic,' who is right?" (Answer: Neither. It is a political claim disguised as a procedural one).

  **Part 2: The Recursive Trap (10 mins)**
  *   "When the Island threatened to leave the new Sorvane, what principle were they using?" (Answer: The same self-determination principle Sorvane used against Ruritania).
  *   **Concept:** **The Infinite Regress.** If self-determination is the supreme value, there is no logical stopping point until we reach the individual.
  *   **Key Question:** "Why do we stop at the provincial border? Is it just power?"

  **Part 3: Theory Connection (5 mins)**
  *   Summarize: Secession is not just voting *within* a democracy; it is voting *on* the democracy. This is **Constituent Power**.
  *   Final thought: "In real cases (Scotland, Quebec), how did they solve this? (They didn't solve it theoretically; they solved it politically through negotiation and power)."

  ---

  ## 8. Advice on Potential Misfires

  **1. Students treat it as a policy debate.**
  *   *Risk:* Groups spend 15 minutes arguing whether independence is *good* or *bad*.
  *   *Fix:* Interrupt immediately. "I am not interested in whether Sorvane *should* be independent. I am interested in **who counts** and **what percentage wins**. Return to the Bill Template."

  **2. Negotiation deadlock.**
  *   *Risk:* They cannot agree on rules by minute 35.
  *   *Fix:* This is actually a useful outcome (demonstrates intractability). However, to ensure the "Vote" phase happens, you must act as the "Speaker." At min 35, take the Template. If blanks remain, you fill them with the "Federal Default" (60% threshold, opt-outs allowed). Tell them: "Because you could not constitute a demos, the existing power holder dictated the terms." This reinforces the power dynamic lesson.

  **3. Confusion over the "Vote."**
  *   *Risk:* Students think they are voting with their hands.
  *   *Fix:* Be explicit: "You are the elites negotiating the rules. The *people's* vote is simulated by me based on the demographic data in your briefs. You are designing the machine; I am pressing the button."

  **4. The Recursion feels like a joke.**
  *   *Risk:* Students laugh when the Island tries to secede.
  *   *Fix:* Play it deadly serious. "If the Island leaves, the new Sorvane state loses its only deep-water port. The economy collapses. Is this a viable state?" Force them to confront the material consequences of the boundary problem.

  ---

  ## 9. The Missing Feature (Closing Commentary)
  **Feature:** **The Fluidity of Identity.**

  **Why it's missing:** In this simulation, preferences are fixed (Islanders are 80% No, Sorvane speakers are Yes). The game assumes the *demos* are pre-existing categories waiting to be counted.

  **Why it matters:** In real secessionist politics (Scotland, Catalonia), the campaign itself *creates* the demos. A "Yes" campaign tries to persuade a unionist worker that they are primarily "Sorvane" rather than "Working Class." A "No" campaign tries to persuade them they are "Ruritanian Citizens."

  **Closing Comment to Class:**
  > "In this game, I gave you fixed numbers. I told you the Island was 80% Unionist. In reality, those numbers are the prize, not the starting point. The hardest part of secession isn't counting the votes; it's convincing people that the boundary you drew around them actually matters to who they *are*. This simulation showed you the **institutional** trap of the boundary problem. But remember, in the real world, politicians try to solve this by changing **identities**, not just rules. They try to make the boundary feel natural so we stop asking how it was drawn."
