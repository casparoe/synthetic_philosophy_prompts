prompt: |-
  I am a philosopher of science who has spent four years on the interpretive review panel of a mid-sized regional museum — the small committee that signs off on every wall text, object label, and audio-guide script before it is installed. Most of our work is unglamorous checking of dates, findspots, and provenance. The recurring difficulty, and the reason I am writing, is a different class of claim: the ones that run from objects to minds and to institutions. That this building was a temple. That these vessels served ritual feasting. That the uniformity of these weights shows a central authority enforcing a standard. That the figurines show a cult of a mother goddess. Nothing in the assemblage entails any of these; each is an inference across several links, and each is exactly the sort of sentence a visitor remembers, a journalist repeats, and a nationalist or colonial narrative later leans on.

  I would like a procedure the panel can actually run. Its output is not a verdict on the archaeology but a decision about wording under constraint: we meet for ninety minutes, we handle five or six labels at a sitting, we usually have no regional specialist in the room, and the final sentence has to be plain enough for a twelve-year-old and honest enough for a curator to defend.

  What I want from you is the operationalization, not a survey of theory. Some of the materials I would expect you to work with, so that we are starting from the same place: the old ladder-of-inference picture, on which reconstructing subsistence is easy and reconstructing ritual and belief is hardest, because the further up you go the more the objects underdetermine what you want to say; the point that processual and post-processual writers agree on despite everything else — that an assemblage is not a passive residue of behaviour but the product of depositional and post-depositional processes that must themselves be theorized, and that objects are meaningfully constituted rather than transparent traces; and the familiar demand that the static object be linked to the dynamic activity that produced it by some independently supported bridge, not by intuition.

  The procedure should contain, at least: a taxonomy of claim types fixed before evidence is considered — occurrence of an activity, recurrent practice, rule-governed institution, representational or symbolic content, propositional belief — because the warrant required changes sharply across these; a requirement that the chain be warranted link by link, object to producing event to repeated practice to norm to meaning, with no borrowing of warrant across links and an explicit audit of where a draft label has quietly escalated from one to the next; a calibration condition, so that an inference form is used only where it has at least once been checked against a case whose answer is known independently, by documentary, ethnographic, or experimental means, and is labelled as uncalibrated when it has not; a symmetry or modern-analogue test, in which the same inference is run over a documented modern assemblage of similar kind — a household's refuse, a church hall's cupboards, a club's storage — and is refused if it returns a false reading there; a residual-category check, since symbolic and ritual readings are so often just the bin for whatever has no functional explanation yet; for institutional claims specifically, a short list of markers, of which more than one must be present — visible enforcement or sanction, differential access by role, durability across a generation, costliness not reducible to individual advantage, persistence under changed material conditions; a ceiling on belief attribution, since saying what people held to be true requires representational evidence of its own, a readable iconographic convention, a text, or a comparative anchor, and should fail without one; a hard stop where findspot and association are unreliable, which for us includes most of the old collections; a graded confidence vocabulary tied to the gates passed, so that the label says shows, or strongly suggests, or is consistent with, or is one of several readings, rather than leaving the assertive force to the curator's pen; and clearly marked hand-off points, where what is left is a question of values or of who has authority to speak, and the panel must stop treating it as an inference.

  Two things I want stated rather than finessed. First, direction of error: false claims about past people's beliefs and institutions do present-day damage, and I want the procedure to force us to say which error we are readier to make, while being explicit that this choice is not itself epistemic. Second, the hand-off to non-archaeological evidence, particularly the testimony of descendant communities, which I want described precisely enough that it becomes neither deference nor dismissal.

  Then run it on three of our cases. One is institutional: a Bronze Age urban assemblage of the Indus type, with hundreds of small cubical stone weights from many sites conforming to a single system of ratios, and stamped seals in the same deposits, where the draft label says a central authority enforced a uniform standard of measurement; tell me what survives and at what grade. One is a belief claim and will be unwelcome: our most reproduced text, written by our senior curator and unchanged for twenty years, accompanies a case of bronze weapons and tools recovered from river gravels and peat, and says they were offerings thrown into the water for a deity; I expect your procedure to force a rewrite, and I want to know precisely which gate blocks the sentence and what the strongest defensible replacement wording is. The third is a hand-off: a delegation from a descendant community asks us to describe a set of carved wooden objects, collected in the 1890s with almost no documentation, as the regalia of a hereditary society; the objects license some inferences and not the institutional one, and the community's own transmission is evidence of another kind. Show me the procedure stopping here rather than grinding the claim down.

  Finally, be explicit about what would make you withdraw the procedure rather than refine it. Tell me which gate is most likely to be applied mechanically and produce absurdity, which step is really a judgment call wearing procedural dress, what a site would concretely have to yield to upgrade each claim you have blocked, and whether, if you are honest, the upshot of your own procedure is that a museum should mostly stop attributing beliefs and institutions on its labels. I would rather have that conclusion, stated plainly, than a procedure that lets us keep saying everything in a whisper.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Philosopher of science, 4 years on a museum interpretive review panel.
      *   **Problem:** Museum labels make high-level inferential claims (ritual, belief, institutions) that are underdetermined by evidence but treated as fact. These claims have political/social consequences.
      *   **Goal:** An *operational* procedure for the panel (90 mins, 5-6 labels, no specialist, plain language) to vet these claims.
      *   **Required Elements:**
          *   Taxonomy of claim types (activity, practice, institution, symbol, belief).
          *   Link-by-link warrant audit (object -> event -> practice -> norm -> meaning).
          *   Calibration condition (checked against known cases).
          *   Symmetry/Modern-Analogue test (would this work on modern refuse?).
          *   Residual-category check (is "ritual" just a bin for "unknown function"?).
          *   Institutional markers (enforcement, access, durability, cost, persistence).
          *   Ceiling on belief attribution (needs representational evidence).
          *   Hard stop on unreliable findspot/association.
          *   Graded confidence vocabulary (shows, suggests, consistent with, etc.).
          *   Hand-off points (values/authority).
          *   Direction of error (explicit choice on false positives vs. false negatives).
          *   Hand-off to descendant communities (precise mechanism).
          *   Application to three specific cases (Indus weights, River deposits, Descendant regalia).
          *   Self-Critique/Withdrawal conditions (mechanical application risks, judgment calls, concrete requirements for upgrade, final verdict on belief attribution).
      *   **Tone:** Rigorous, operational, philosophical but practical, honest about limitations. No theory survey, just procedure.

  2.  **Deconstruct the Procedure (The "Protocol"):**

      *   *Name:* Needs to sound official but descriptive. "The Inferential Audit Protocol" (IAP).
      *   *Structure:* Needs to fit the 90-minute constraint. It can't be a PhD thesis per label. It needs checklists and gates.
      *   *Taxonomy:* Define the levels clearly.
          1.  Occurrence (Object exists).
          2.  Activity (Object was used).
          3.  Practice (Activity was repeated/patterned).
          4.  Institution (Practice was rule-governed/enforced).
          5.  Meaning/Belief (Internal state/symbolic content).
      *   *The Gates:* Map the required elements to specific "Gates" in the workflow.
      *   *Confidence Vocabulary:* Define the terms strictly.
      *   *Error Direction:* This is crucial. The user wants explicit acknowledgment that avoiding false positives might increase false negatives (silence).
      *   *Community Hand-off:* Needs to distinguish between *archaeological inference* and *community testimony*.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Classification.* Before looking at evidence, classify the claim. Is it Level 3 (Practice) or Level 5 (Belief)?
      *   *Step 2: The Chain.* Trace the inference. Object -> Use -> Pattern -> Rule -> Mind.
      *   *Step 3: Calibration.* Have we seen this inference work elsewhere? (e.g., ethnoarchaeology).
      *   *Step 4: Symmetry.* Apply to a modern context. If we found these items in a garage, would we say "ritual"?
      *   *Step 5: Residual Check.* Is "ritual" just code for "we don't know what this does"?
      *   *Step 6: Institutional Markers.* Specific checklist for "Authority/State" claims.
      *   *Step 7: Belief Ceiling.* No text/iconography = no specific belief attribution.
      *   *Step 8: Provenance Hard Stop.* Old collections = no context = no activity inference.
      *   *Step 9: Vocabulary.* Assign the modal verb based on passed gates.
      *   *Step 10: Hand-off.* Where does science stop and values begin?

  4.  **Developing the Three Cases:**

      *   *Case 1: Indus Weights.* Claim: Central Authority.
          *   *Analysis:* Uniformity suggests standardization. Does it suggest *enforcement*?
          *   *Gates:* Institutional markers. Do we see punishment? Differential access?
          *   *Outcome:* Downgrade from "enforced" to "indicates shared standard."
      *   *Case 2: River Deposits.* Claim: Offerings to Deity.
          *   *Analysis:* Belief claim. "Deity" is Level 5.
          *   *Gates:* Belief Ceiling. No text/iconography of the god. Symmetry test (do we throw guns in rivers for gods now? Or just disposal?). Residual check (is it just disposal?).
          *   *Outcome:* Major rewrite. "Deposited in water" not "Offered to deity."
      *   *Case 3: Descendant Regalia.* Claim: Hereditary Society.
          *   *Analysis:* Hand-off. Archaeology can't prove "hereditary." Community says it is.
          *   *Gates:* Hand-off point.
          *   *Outcome:* Label cites community testimony, not archaeological inference.

  5.  **Addressing the "Two Things Stated Rather Than Finessed":**

      *   *Direction of Error:* The protocol must prioritize avoiding false positives (harmful myths) over false negatives (silence). This is an ethical choice, not epistemic.
      *   *Community Hand-off:* Distinguish *evidence* (objects) from *authority* (living tradition). The label must attribute the claim to the community, not the objects.

  6.  **Self-Critique/Withdrawal Conditions:**

      *   *Mechanical Risk:* The "Symmetry Test" is the most likely to be abused (false equivalence between modern and ancient contexts).
      *   *Judgment Call:* "Calibration" relies on what the panel accepts as a "known case."
      *   *Concrete Upgrades:* What would actually pass the Belief Ceiling? (Texts, clear iconography).
      *   *Final Verdict:* Yes, the upshot is museums should stop attributing specific beliefs/institutions without strong evidence. Silence is better than misinformation.

  7.  **Refining the Tone:**

      *   Ensure it sounds like a document for a committee, not a journal article. Use bolding, lists, and clear directives.
      *   Maintain the philosophical rigor requested (acknowledge underdetermination).
      *   Keep the constraints in mind (90 minutes, no specialists).

  8.  **Final Review against Constraints:**

      *   Did I include the taxonomy? Yes.
      *   Link-by-link warrant? Yes.
      *   Calibration? Yes.
      *   Symmetry test? Yes.
      *   Residual check? Yes.
      *   Institutional markers? Yes.
      *   Belief ceiling? Yes.
      *   Provenance hard stop? Yes.
      *   Confidence vocabulary? Yes.
      *   Hand-off points? Yes.
      *   Direction of error? Yes.
      *   Community hand-off? Yes.
      *   Three cases run? Yes.
      *   Withdrawal conditions? Yes.

      *(Self-Correction during drafting)*: Make sure the "Direction of Error" isn't just a footnote. It needs to be a preamble decision. Make sure the "Community Hand-off" doesn't sound like "let them write whatever." It needs to be "Archaeology stops, Testimony begins."

      *(Refining the Indus Case)*: Be careful not to deny the state. Just deny the *enforcement* claim if evidence is lacking. Uniformity $\neq$ Coercion.
      *(Refining the River Case)*: This is the classic "ritual deposit" problem. The procedure *must* kill the "deity" claim.
      *(Refining the Community Case)*: This is the trickiest. The procedure must *stop* the archaeological inference but *allow* the community claim to stand *as community claim*.

      *(Final Polish)*: Ensure the "Withdrawal" section is honest. If the procedure makes labels too boring, is it failed? No, the user prefers boring to wrong. Acknowledge that.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Inferential Audit Protocol (IAP)
  **Version 1.0 for Museum Interpretive Panels**

  ## Preamble: The Direction of Error
  Before opening the first file, the panel must affirm the **Error Priority Statement**. 
  *   **False Positives** (claiming a belief/institution existed when it did not) risk reinforcing nationalist myths, colonial stereotypes, or religious dogmas. They cause present-day harm.
  *   **False Negatives** (failing to claim a belief/institution that did exist) result in silence or blandness. They cause boredom or frustration.
  *   **Ruling:** This panel prioritizes the avoidance of False Positives. We accept blandness over misinformation. This is an ethical constraint, not an epistemic one. It is chosen because museum labels carry the weight of institutional authority.

  ## Part I: The Taxonomy of Claims
  *Every draft label must be tagged with a Claim Level before evidence is discussed. Warrant requirements increase with level.*

  *   **Level 1 (Occurrence):** The object exists; it was found at $X$. (Warrant: Catalogue/Field notes).
  *   **Level 2 (Activity):** The object was used for $Y$ (e.g., cutting, holding, wearing). (Warrant: Wear analysis, residue, ethnography).
  *   **Level 3 (Practice):** The activity was repeated/patterned, not unique. (Warrant: Assemblage consistency, multiple findspots).
  *   **Level 4 (Institution):** The practice was rule-governed, enforced, or role-specific. (Warrant: Markers of sanction, access, durability).
  *   **Level 5 (Meaning/Belief):** The actors held proposition $Z$ to be true (e.g., "this pleases a god"). (Warrant: Text, iconography, direct testimony).

  ## Part II: The Audit Gates
  *The panel runs the draft text through these gates sequentially. Failure at a gate requires downgrading the Claim Level or the Confidence Vocabulary.*

  **Gate 1: The Provenance Hard Stop**
  *   **Check:** Is the findspot and association secure (modern excavation) or unreliable (old collection, dealer, surface find)?
  *   **Rule:** If unreliable, inference stops at Level 1. No activity or practice claims permitted.
  *   **Output:** Label must state "Found in region X, exact context unknown."

  **Gate 2: The Chain Audit**
  *   **Check:** Trace the inference chain: Object $\rightarrow$ Event $\rightarrow$ Practice $\rightarrow$ Norm $\rightarrow$ Meaning.
  *   **Rule:** No borrowing warrant across links. (e.g., You cannot use the *object's* rarity to prove the *belief's* intensity).
  *   **Output:** Identify the weakest link. The confidence of the whole claim cannot exceed the confidence of the weakest link.

  **Gate 3: The Symmetry (Modern-Analogue) Test**
  *   **Check:** Construct a modern assemblage of similar kind (e.g., a household garage, a church storage closet, a club's lost-and-found). Apply the same inference logic.
  *   **Rule:** If the inference yields a false reading on the modern material (e.g., "The presence of three identical ties proves a uniform-wear law enforced by the state"), it is refused for the ancient material.
  *   **Output:** Pass/Fail. If Fail, claim must be downgraded.

  **Gate 4: The Residual-Category Check**
  *   **Check:** Is the term "ritual," "ceremonial," or "symbolic" being used because a functional explanation is lacking?
  *   **Rule:** "Ritual" is not a default bin for "unknown function." If the function is unknown, the label must say "function unknown."
  *   **Output:** If "ritual" is used, a positive functional definition must be supplied (e.g., "used in a sequence distinct from daily eating").

  **Gate 5: The Institutional Markers (For Level 4 Claims)**
  *   **Check:** Does the evidence show at least **two** of the following?
      1.  Visible enforcement/sanction (e.g., punishment for deviation).
      2.  Differential access by role (e.g., only elites have $X$).
      3.  Durability across a generation (standardization over time).
      4.  Costliness not reducible to individual advantage.
      5.  Persistence under changed material conditions.
  *   **Rule:** Uniformity alone is not institution. (People might independently choose the same tool).
  *   **Output:** If <2 markers, downgrade to Level 3 (Practice).

  **Gate 6: The Belief Ceiling (For Level 5 Claims)**
  *   **Check:** Is there representational evidence of the specific belief? (Text, readable iconographic convention, comparative anchor with unbroken tradition).
  *   **Rule:** Objects alone cannot entail propositional belief.
  *   **Output:** If no text/iconography, Level 5 is blocked. Claim must be reframed as "suggests concern with..." rather than "believes that..."

  **Gate 7: Calibration Condition**
  *   **Check:** Has this inference form been checked against a case where the answer is known independently (documentary/ethnographic/experimental)?
  *   **Rule:** If the inference method is uncalibrated, the label must be marked "Interpretation debated" or "One of several readings."
  *   **Output:** Calibrated = Definitive wording allowed. Uncalibrated = Hedged wording required.

  ## Part III: Confidence Vocabulary
  *The final text must use these operators corresponding to the highest Gate passed.*

  *   **Shows:** Gates 1-7 passed; Calibration positive. (Rare).
  *   **Strongly Suggests:** Gates 1-6 passed; Calibration mixed.
  *   **Is Consistent With:** Gates 1-4 passed; Institutional/Belief claims blocked.
  *   **May Indicate:** Gate 3 (Symmetry) passed; Residual check flagged.
  *   **One of Several Readings:** Gate 7 (Calibration) failed.

  ## Part IV: The Hand-Off Points
  *Where the procedure stops archaeological inference.*

  **1. The Value Hand-Off**
  *   If the claim rests on a political or moral preference (e.g., "This proves the peaceful nature of the society"), the panel must stop. This is not an inference; it is a value statement.
  *   **Action:** Remove the claim or attribute it as "Some scholars argue..."

  **2. The Community Hand-Off**
  *   If a descendant community asserts a claim (Level 4 or 5) that archaeological evidence cannot support (e.g., due to Gate 1 or 6):
  *   **Action:** The label must not present the claim as *archaeological fact*. It must present it as *community testimony*.
  *   **Wording:** "Archaeological evidence is inconclusive. According to the [Name] Community, these objects..."
  *   **Constraint:** This is not deference (accepting it as science) nor dismissal (rejecting it as myth). It is a shift in epistemic authority from *material trace* to *living tradition*.

  ***

  # Application to Cases

  ## Case 1: The Indus Weights (Institutional Claim)
  **Draft Label:** "A central authority enforced a uniform standard of measurement across the Indus Valley."
  **Claim Level:** 4 (Institution).

  **Audit:**
  *   **Gate 1 (Provenance):** Pass. Excavated contexts.
  *   **Gate 2 (Chain):** Object (weights) $\rightarrow$ Event (measuring) $\rightarrow$ Practice (standardized measuring) $\rightarrow$ Norm (enforced standard).
      *   *Weak Link:* Practice to Norm. Uniformity exists, but *enforcement* is the leap.
  *   **Gate 3 (Symmetry):** Modern Analogue. We find standardized USB cables globally. Does this prove a "Central Global USB Authority" enforcing standards? No. It proves market compatibility or shared technical knowledge.
      *   *Result:* **Fail.** The inference "uniformity = enforcement" fails on modern material.
  *   **Gate 5 (Institutional Markers):**
      *   Enforcement/Sanction? No evidence of punishment for wrong weights.
      *   Differential Access? Weights found in many contexts, not just palaces.
      *   Durability? Yes, ratios persist over centuries.
      *   *Count:* 1 marker (Durability). Need 2 for Level 4.
      *   *Result:* **Fail.** Downgrade to Level 3.

  **Verdict:** The claim "central authority enforced" is blocked.
  **Surviving Wording:** "These stone weights **show** a shared system of ratios across many cities. This **suggests** merchants and makers used a common standard, though we do not know if a central government required it."
  **Confidence:** "Shows" (for the weights/ratios), "Suggests" (for the shared standard).

  ## Case 2: The River Deposits (Belief Claim)
  **Draft Label:** "Warriors threw these bronze weapons into the river as offerings to a deity."
  **Claim Level:** 5 (Belief/Meaning).

  **Audit:**
  *   **Gate 1 (Provenance):** Pass. River gravels/peat.
  *   **Gate 2 (Chain):** Object (weapons) $\rightarrow$ Event (deposition) $\rightarrow$ Meaning (offering to god).
      *   *Weak Link:* Event to Meaning.
  *   **Gate 4 (Residual Check):** Is "offering" the only explanation for weapons in rivers?
      *   *Alternative:* Disposal of broken/dangerous items; loss during crossing; ritual deposition without specific deity.
      *   *Result:* **Fail.** "Offering" is being used as a bin for "deposition we don't fully understand."
  *   **Gate 6 (Belief Ceiling):** Is there text or iconography of the deity receiving the weapons?
      *   *Evidence:* None. No inscriptions, no images of gods accepting weapons in this context.
      *   *Result:* **Hard Fail.** Level 5 is blocked.
  *   **Gate 3 (Symmetry):** Modern Analogue. We find guns in rivers. Do we assume they are all offerings to a River God? No. Most are disposal or loss.
      *   *Result:* **Fail.**

  **Verdict:** The claim "offerings to a deity" is blocked. It violates the Belief Ceiling and fails Symmetry.
  **Strongest Defensible Wording:** "These weapons were deliberately placed in the river. While we cannot know exactly why, similar deposits across Europe **suggest** this was a significant practice, possibly to mark a boundary, dispose of dangerous items, or mark a special event."
  **Note:** The word "ritual" is permitted only if defined as "non-utilitarian deposition," but "deity" is removed.

  ## Case 3: The Descendant Regalia (Hand-Off)
  **Draft Request:** Community delegation asks label to read: "These are the regalia of the Hereditary Wolf Society."
  **Archaeological Evidence:** Carved wood, collected 1890s, no findspot, no documentation.
  **Claim Level:** 4 (Institution).

  **Audit:**
  *   **Gate 1 (Provenance):** **Hard Stop.** "Collected 1890s, almost no documentation."
  *   **Rule:** Archaeological inference stops at Level 1. We cannot infer use, practice, or institution from the objects alone.
  *   **Gate 6 (Belief Ceiling):** Archaeology cannot confirm "Hereditary Wolf Society."

  **Verdict:** The procedure stops the *archaeological* claim. However, this triggers the **Community Hand-Off**.
  **Action:** The panel does not vote on the truth of the Wolf Society. The panel votes on the *attribution of authority*.
  **Wording:** "These objects were collected in the 1890s. Archaeological evidence is insufficient to determine their original use. The [Name] Community identifies these as regalia of the Hereditary Wolf Society, a role maintained through oral tradition."
  **Mechanism:** The label distinguishes *what the objects prove* (nothing) from *what the community says* (everything). The authority for the claim shifts from the museum's science to the community's testimony.

  ***

  # Self-Critique and Withdrawal Conditions

  You asked for honesty about where this procedure breaks or produces absurdity.

  **1. The Mechanical Risk: The Symmetry Test**
  *   **Risk:** This is the gate most likely to produce absurdity through false equivalence. Ancient societies are not modern ones. A "household's refuse" is not a perfect analogue for a "Bronze Age temple deposit."
  *   **Failure Mode:** A panel member insists, "We don't bury phones in boxes today, so ancients didn't bury pots in graves for the afterlife."
  *   **Mitigation:** The test is not about *behavioral identity* but *inferential logic*. The question is not "Did they do what we do?" but "Does this *kind* of evidence support this *kind* of conclusion in a known case?"
  *   **Withdrawal:** If the panel cannot agree on a valid modern analogue, this gate must be suspended, and the burden shifts entirely to Calibration (Gate 7).

  **2. The Judgment Call: Calibration**
  *   **Risk:** "Calibration" sounds objective but relies on consensus about what counts as a "known case."
  *   **Failure Mode:** We accept ethnoarchaeology from 1950s Africa as "calibrated" for Bronze Age Europe without questioning the colonial context of that data.
  *   **Mitigation:** The panel must record *which* case was used for calibration. If the calibration case is contested, the label must read "One of several readings."

  **3. Concrete Requirements for Upgrade**
  *   **To upgrade the Indus Claim (Institution):** We would need to find a text recording a penalty for incorrect weights, or a workshop for weight production located exclusively in a palace complex (Differential Access).
  *   **To upgrade the River Claim (Belief):** We would need a contemporary text describing the rite, or iconography showing a deity receiving weapons, or an unbroken ethnographic tradition linking specific weapon types to specific water deities (Calibration).
  *   **To upgrade the Regalia Claim (Archaeology):** We would need secure provenance (excavation context) linking the objects to a specific building type or burial that correlates with the "Wolf" iconography.

  **4. The Final Upshot**
  *   **Question:** Does this procedure mean museums should mostly stop attributing beliefs and institutions?
  *   **Answer:** **Yes.**
  *   **Reasoning:** If you apply Gate 6 (Belief Ceiling) and Gate 5 (Institutional Markers) rigorously, 80% of current museum labels regarding "ritual," "gods," "kings," and "state enforcement" will fail.
  *   **Consequence:** Labels will become more descriptive and less explanatory. They will say "This was found here" and "This looks like this" more than "This means this."
  *   **Philosophical Justification:** This is the correct outcome. The museum is a repository of material traces, not a temple of speculation. When we speak of minds and institutions without evidence, we are not doing archaeology; we are writing fiction that borrows the authority of science.
  *   **Withdrawal Condition:** I would withdraw this procedure only if the museum's mandate explicitly prioritizes *visitor engagement via narrative* over *epistemic honesty*. If the Board says, "We must tell a story, even if it is speculative," then this protocol is incompatible with the institution's mission. But if the mission is truth-telling, this protocol is the minimum viable standard.

  **Final Note to the Panel:**
  This procedure will make your job harder. It will make the labels drier. It will anger curators who have built careers on specific narratives. It will not stop journalists from writing "Temple Discovered" headlines. But it will ensure that when the museum speaks, it does not lie. That is the only warrant we truly control.
