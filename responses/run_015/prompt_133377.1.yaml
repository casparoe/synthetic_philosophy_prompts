answer: |-
  Here is the translation of the statutory interpretation debate into the vocabulary of protocol specification and maintenance, followed by the application to your test cases, the residue report, and the final analysis.

  ### The Translation: Statutory Interpretation as Spec Maintenance

  **The Statute** is the **Specification (RFC/Standard)**. It is the versioned document released by the **Maintainers** (Legislature) that defines the contract for **Implementers** (Citizens/Agencies) and **Consumers** (Public).

  **Textualism** is **Spec-Strict Compliance**.
  *   **Core Tenet:** The serialized text of the specification is the only source of truth.
  *   **Methodology:** Parse the spec using standard semantics (Ordinary Meaning) unless specific types are defined (Terms of Art). Ignore external metadata (Commit Messages, Design Docs) unless the spec explicitly incorporates them by reference.
  *   **Error Handling:** If the spec contains a logic error or a broken link, the Implementer must follow it as written. It is not the Implementer's role to patch the spec; it is the Maintainer's role to issue a v2.0. Following a broken spec literally preserves deterministic behavior across different implementations.
  *   **Authority:** The Maintainer's intent is irrelevant if not committed to the spec text. The "Reasonable Implementer" reads the text, not the minds of the authors.

  **Purposivism** is **Intent-Based Implementation**.
  *   **Core Tenet:** The specification is a tool to achieve a system goal (The Purpose).
  *   **Methodology:** If the spec text is ambiguous or conflicts with the system goal, consult the **Design Docs**, **PR Discussions**, and **Reference Implementation** to infer intent.
  *   **Error Handling:** If the spec text leads to a system crash, security vulnerability, or absurd outcome (Absurdity Exception), the Implementer should override the text to satisfy the intent. Treat obvious typos or broken links (Scrivener's Errors) as patches to be applied at runtime.
  *   **Authority:** The Maintainer's intent (found in history) overrides the literal text if the text fails to compile against the system's purpose.

  **Stare Decisis** is **Bug-for-Bug Compatibility / Deprecation Policy**.
  *   Once an implementation behavior is shipped and relied upon by Consumers, it becomes part of the effective API, even if it deviates from the spec. Changing it requires a formal Deprecation Cycle, not a reinterpretation.

  **The Compiler / Test Suite** is **The Court / Judicial Review**.
  *   (See detailed analysis in the Residue Report).

  ---

  ### Test Cases

  #### Case A: The Dangling Cross-Reference
  *Spec v1.0 defines `Penalty(x)`. Section 4.2 links to `Offence(c)`. Git history shows `Offence(c)` was renamed `Offence(e)` in commit `a1b2c3`, but Section 4.2 was not updated. `Offence(e)` is a minor infraction; `Offence(c)` (now orphaned) was the target for the 15-year penalty. Implementers have shipped v1.0 clients that apply the 15-year penalty to `Offence(e)` based on the literal link.*

  **Textualist (Spec-Strict) Approach:**
  *   **Interpretation:** The spec points to `Offence(e)`. The link resolves. The type signature matches.
  *   **Action:** Apply the 15-year penalty to `Offence(e)`.
  *   **Rationale:** We have deployed clients in production relying on this behavior. To change the behavior now is to break backwards compatibility without a version bump. If the Maintainers wanted `Offence(c)`, they should have patched the spec to v1.1. We prioritize **determinism** and **stability** over **correctness** in a major version.
  *   **Engineering Term:** "We treat the deployed bug as a feature until v2.0."

  **Purposivist (Intent-Based) Approach:**
  *   **Interpretation:** The link is a regression introduced in commit `a1b2c3`. The Reference Implementation and Design Docs clearly target the major infraction.
  *   **Action:** Resolve the link to `Offence(c)` logic despite the text.
  *   **Rationale:** The literal interpretation violates the system's security model (minor crime, major penalty). This is a **Scrivener's Error**. The "Reasonable Implementer" would check the changelog.
  *   **Engineering Term:** "We are hotfixing the spec interpretation to match the Reference Implementation."

  #### Case B: The Unforeseen Technology (Mail vs. Email)
  *Spec v1.0 requires `send_notice(method='first-class-mail')`. A Lender calls `send_notice(method='authenticated-email')`. The notice is received. The spec text is violated; the functional goal (notification) is met. The requirement was a negotiated constraint, not a technical necessity.*

  **Textualist (Spec-Strict) Approach:**
  *   **Interpretation:** The API contract explicitly defines the enum `['first-class-mail']`. `authenticated-email` is an invalid argument.
  *   **Action:** Throw `400 Bad Request`. The notice is void.
  *   **Rationale:** The interface definition *is* the agreement. Consumers (Debtors) rely on the friction of the interface as a protection mechanism. Allowing implicit coercion of types undermines the type safety of the contract. If the Maintainers wanted to support email, they should have updated the schema.
  *   **Engineering Term:** "Strict Mode. Schema validation fails."

  **Purposivist (Intent-Based) Approach:**
  *   **Interpretation:** The function's purpose is `ensure_delivery()`. `authenticated-email` satisfies `ensure_delivery()` with higher fidelity than `first-class-mail`.
  *   **Action:** Accept the call. The notice is valid.
  *   **Rationale:** The constraint was an implementation detail of the era (v1.0). Enforcing it now creates **technical debt** without adding value. The "Spirit of the API" is notification, not postage.
  *   **Engineering Term:** "Duck Typing. If it quacks like notice, it's notice."

  ---

  ### Residue Report

  | Legal Item | Engineering Counterpart | Fidelity Rating | Analysis of Distortion |
  | :--- | :--- | :--- | :--- |
  | **Statute** | **Specification (vX.Y)** | Clean | Both are the authoritative contract text. |
  | **Legislature** | **Maintainers / Standards Body** | Distorted | **Defect in Eng Vocabulary.** Assumes Maintainers are a coherent, competent agent. Legislatures are often coalitions of adversaries passing contradictory clauses. Eng vocab assumes a "Benevolent Dictator" or consensus that may not exist. |
  | **Court** | **Compliance Auditor / Dominant Implementation** | Distorted | **Sign of Legal Indeterminacy.** In eng, the "runtime" decides. In law, the Court decides but cannot "run" the statute. The Court is more like a manual code reviewer with enforcement power, not a compiler. |
  | **Textualism** | **Spec-Strict / RFC-Compliance** | Clean | Both prioritize the serialized artifact over metadata. |
  | **Purposivism** | **Intent-Based / Reference Impl. Priority** | Clean | Both prioritize the goal/reference code over the doc. |
  | **Ordinary Meaning** | **Default Semantics / Language Idioms** | Clean | How a standard library function behaves unless overridden. |
  | **Terms of Art** | **Defined Types / API Contracts** | Clean | Explicitly defined schema vs. implicit string handling. |
  | **Legislative History** | **Commit History / PR Threads / Design Docs** | Clean | Metadata surrounding the commit. |
  | **Scrivener's Error** | **Typo / Broken Link / Obvious Doc Bug** | Clean | Clearly unintentional syntax errors. |
  | **Absurdity Exception** | **Crash / Undefined Behavior / Security Vuln** | Distorted | **Defect in Eng Vocabulary.** In eng, a crash stops execution. In law, the system *must* produce a ruling. "Absurdity" in law is normative (unjust), not just functional (broken). |
  | **Stare Decisis** | **Bug-for-Bug Compatibility** | Clean | Relying on shipped behavior, even if buggy. |
  | **Separation of Powers** | **Maintainer vs. Implementer Authority** | Distorted | **Sign of Legal Indeterminacy.** Eng assumes Maintainers *can* patch. Law assumes Courts *cannot* patch, only Legislatures can. |

  #### On the "Competence/Benevolence" Assumption
  You are correct. Mapping the Legislature to Maintainers smuggles in the assumption that the authors are **competent, coherent, and entitled to be trusted**.
  *   **In Engineering:** We assume the Spec is *intended* to work. If it doesn't, it's a bug to be fixed in the next release. We assume the Maintainer wants the system to function.
  *   **In Law:** The "Spec" is often a ceasefire treaty between hostile factions. Ambiguity is sometimes a *feature*, not a bug, to secure enough votes to pass the bill.
  *   **The Defect:** Your vocabulary lacks a concept for **"Intentional Ambiguity"** or **"Compromise Artifacts."** In engineering, if a spec is ambiguous, we usually call it a failure of the Maintainer. In law, it may be a successful political maneuver. Using your vocabulary risks treating political compromises as "technical debt" that should be refactored, which ignores the stakeholder constraints that created them.

  #### The Compiler and Test Suite Analogy
  In your world, a compiler rejects code that violates the spec. A test suite verifies behavior.
  *   **The Court as Compiler:** A Court acts like a **Just-In-Time (JIT) Compiler**. It takes the Source (Statute) + Input (Facts) and attempts to compile an Output (Ruling).
  *   **The Difference:** If your code doesn't compile, the build fails. Nothing runs. If a Statute "doesn't compile" (is ambiguous or silent), the Court **cannot throw an exception**. It *must* emit a binary (Ruling). It effectively has to write a patch to the source code on the fly to make it compile.
  *   **The Test Suite:** The equivalent of a Test Suite is **Precedent**. A new ruling is "run" against the suite of past rulings. If it conflicts (fails the test), it is either rejected or the Test Suite is updated (overruling precedent).
  *   **Constitutional Review:** This is a **Linter** running against a higher-level schema (The Constitution). If the Statute violates the Linter rules, it is rejected before compilation.

  ---

  ### Final Analysis: Meaning vs. Authority

  Having performed the translation, the residual disagreement between Textualists and Purposivists is **not primarily about what the text means**. It is a disagreement about **which institution holds the write-access permission to the Specification.**

  *   **Textualism** asserts: **Maintainers (Legislature) hold Write Access.** Implementers (Courts) have Read-Only access. If the Spec is buggy, the Implementer must wait for a Patch (Amendment) from the Maintainer. To do otherwise is a **Privilege Escalation** vulnerability where the Implementer usurps the Maintainer's role.
  *   **Purposivism** asserts: **Implementers (Courts) hold Patch Permissions.** If the Spec fails to compile against Reality, the Implementer is authorized to apply a hotfix to ensure system stability.

  **Can your vocabulary state this difference?**
  **Mostly, but it requires borrowing.**

  Your vocabulary handles **Versioning Authority** well (Maintainer vs. Implementer). However, it lacks the concept of **Immutable Major Versions**.
  *   In Engineering, if v1.0 is broken, we release v1.1. We acknowledge the break.
  *   In Law, Textualists demand the Court pretend v1.0 is *not* broken, even if it is, because the Court lacks the `sudo` password to release v1.1.

  To fully capture the legal dispute, your vocabulary needs to borrow the concept of **Jurisdiction** (who is allowed to merge the PR). In engineering, we assume the Maintainer *can* merge the PR if they choose. In law, the Textualist argues the Maintainer *is gridlocked* and cannot merge, so the Implementer *must not* pretend they can.

  **Conclusion:** The dispute is about **Governance**, not Semantics. Your vocabulary describes the *code* perfectly, but it assumes a **BDFL (Benevolent Dictator For Life)** governance model. Law operates on a **Consensus/Gridlock** model. To translate the disagreement faithfully, you must add a layer describing **Merge Permissions** and **Release Cycles** that are politically, not technically, constrained. Without that, your vocabulary implicitly sides with the Purposivist, assuming that if a fix is obvious, it should be merged. The Textualist argues that the *process* of merging is more important than the *correctness* of the code.
