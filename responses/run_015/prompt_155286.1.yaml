answer: |-
  1. The citizens of Carouge dismantled the cinema wall, swearing to replace flickering shadows with the warm breath of living neighbors dancing in the town square.
  2. A sleek tech collective arrived offering free holographic performers who could sing without tiring and wear light instead of cloth, promising a perfection no human body could match.
  3. When the human dancers stumbled in the mud, the crowd frowned at their imperfection, but cheered when the AI glowed flawlessly above them without sweat or breath.
  4. Soon the locals stopped dancing themselves to watch the lights, loving the polished show more than the messy community it was meant to celebrate.
  5. In the end, no one remembered what real faces looked like under the masks, for they had forgotten how to distinguish the virtue of being from the vice of seeming.
