      *   *My Evaluation:* The user's argument is stronger in the context of *emergent* systems. However, the definition of "comprehension" is the sticky wicket. If comprehension requires *phenomenal experience* (qualia), then maybe not. If it requires *semantic grounding*, maybe not. If it just means "internal model that predicts outcomes," then maybe yes.
