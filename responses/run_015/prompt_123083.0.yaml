  2.  **Deconstruct the Core Concepts:**
      *   *Causal Overdetermination:* Two or more causes are present, *each sufficient* on its own to produce the effect. If one hadn't happened, the effect still would have occurred (at that time/manner). Often implies redundancy.
      *   *Multi-Causal Explanation:* Multiple factors contribute to an outcome. Usually, they are *jointly necessary* or *probabilistically enhancing*, but not individually sufficient. Removing one changes the outcome or prevents it.
      *   *The Tension:* In history, everything looks multi-causal. Overdetermination is rarer and philosophically trickier (does it make individual causes irrelevant?). Journalists love "complexity" (multi-causal) but sometimes stumble into "inevitability" (overdetermination) without realizing it.

  3.  **Step 1: Dependency Order:**
      *   What comes first? We need to establish what a "cause" means in this context before complicating it.
      *   *Component 1:* The Counterfactual Test (The "But-For" Test). This is intuitive. "If X hadn't happened, would Y have occurred?"
      *   *Bridge:* The Sufficiency Threshold. When does a cause stop being just a contributor and become a "guarantor"?
      *   *Component 2:* The Distinction (Redundancy vs. Contribution).
