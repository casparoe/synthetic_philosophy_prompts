answer: |-
  **Mark: 13/20**

  **Marginal Comments**

  **(a) The Problem (Unasserted Contexts)**
  *   **Right:** You correctly identify the core mechanism of the problem: moral sentences occur in unasserted contexts (antecedents, negations) where no attitude is expressed. You correctly note that this threatens the consistency of meaning required for validity (the equivocation charge).
  *   **Wrong/Imprecise:** You state "there is nothing left to secure the validity." This is slightly loose. The precise problem is that standard logic is defined over truth-apt contents (propositions), and expressivism denies moral sentences have truth conditions. You focus on the *expression of attitude* rather than the *lack of propositional content* to feed into logical operators.
  *   **Deduction:** -1. Good grasp of the intuition, but lacks technical precision regarding truth-conditions vs. assertion conditions expected at this level.

  **(b) Distinction from Disagreement**
  *   **Wrong:** The question explicitly instructs you to **distinguish** the Frege–Geach problem from the disagreement objection. You explicitly conflate them ("This is the same difficulty in another form"). This is philosophically contentious and directly contradicts the exam instruction.
  *   **Diagnosis:** Frege–Geach is a problem about **logic and validity** (how sentences combine in arguments). The disagreement objection is a problem about **semantics and contradiction** (how two speakers can contradict one another). While related, they are distinct challenges. Conflating them suggests you do not fully grasp the taxonomy of objections to expressivism.
  *   **Rubric Failure:** The first-class rubric requires you to "keep it separate from neighbouring objections." You have failed this criterion.
  *   **Deduction:** -4. This is a significant conceptual error and a failure to follow a direct instruction.

  **(c) Expressivist Solution**
  *   **Right:** You correctly identify Gibbard and the strategy of higher-order attitudes/norm-acceptance. You successfully apply this to the specific *modus ponens* argument provided and offer an account of negation ("disapproval of disapproval").
  *   **Wrong/Overstates:** You claim validity for this view "just is the psychological impossibility of combining those attitudes" and that expressivism is "committed to a psychologistic account of logic." This is a vulnerable interpretation. Most expressivists (including Gibbard) aim to **save** classical logical validity, not reduce it to psychological consistency. Conceding that logic is merely psychology is often viewed as losing the battle against the error theorist, not winning it.
  *   **Omission (Rubric Failure):** The rubric specifies a first-class answer must offer a response that works for "arbitrarily deeply embedded occurrences." You explain the conditional and negation, but you do not explain the **compositional semantics** that allows this to scale to arbitrary depth (e.g., conditionals within negations within disjunctions). You treat the specific sample argument rather than the general structural solution.
  *   **Deduction:** -3. (-1 for the psychologism claim, -2 for failing the rubric requirement on arbitrary embedding).

  **General Feedback**
  This is a competent 2:1 answer that demonstrates good knowledge of the literature (Gibbard) and the basic intuition behind Frege–Geach. However, it cannot be awarded a First because it fails two specific rubric criteria: it conflates two distinct objections rather than distinguishing them, and it fails to address the requirement for arbitrary embedding in the solution. The claim that expressivism reduces logic to psychology is also too strong and lacks the necessary critical nuance for an upper-level course.
