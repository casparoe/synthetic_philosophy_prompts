answer: |-
  # Q&A Prep Sheet: AI Oversight Committee
  **Date:** [Six Weeks Out]
  **Presenter:** Product Lead
  **Subject:** Revision of Refusal Policy (Patient-Facing Assistant)

  ## Pre-emptive Concessions (First 2 Minutes)
  *Before opening the floor, state these clearly to lower defensiveness.*

  1.  **To the Nurse Manager:** "I want to state upfront: I know 'friction' generates messages. I am not proposing a policy that increases your team's inbox volume without a corresponding reduction in phone calls. We will measure net contact volume, not just portal messages, and I will personally own the metric if it spikes."
  2.  **To Risk Counsel:** "I am not proposing we reduce documentation standards. Every instance of 'friction' will be logged with the same fidelity as a hard refusal. The audit trail remains intact; only the user-facing language changes."

  ---

  ## The Objections (Ordered by Expected Damage)

  ### 1. Risk Counsel
  **The Objection:** "You're talking about a 'budget' for refusals. If I'm plaintiff counsel, I hear you admitting you calculated how many patients you could safely ignore. If you know a risk exists, and you choose not to refuse based on an allocation metric, isn't that gross negligence? How do you defend 'spending trust' in discovery?"
  **The Reply (90s):** "I hear the concern, and I want to be precise: the budget isn't about ignoring risk; it's about recognizing that silence isn't safe. If we refuse, the patient goes to Google or stops meds in the dark. If we engage, we document the warning. The 'budget' is simply a cap on how often we force that disengagement. In discovery, we defend the fact that we kept the patient in the system where we could warn them, rather than pushing them out where we couldn't. We aren't budgeting safety; we are budgeting our ability to stay in the room."
  **Verdict:** **HOLD.** (This is the core liability shield. Do not concede that safety is being rationed.)

  ### 2. Emergency Medicine Attending
  **The Objection:** "You're suggesting 'friction' for irreversible harm. If a patient asks about stopping a blood thinner, a pop-up doesn't stop a bleed. You're replacing a stop-sign with a speed bump. Why should I trust that a nudge prevents the ER visit when a direct refusal didn't?"
  **The Reply (90s):** "Because the refusal didn't stop your mother, and it didn't stop her from bleeding. The data shows that for determined users, a hard 'no' just moves the action offline. A nudge keeps them online. If they click through the friction, we have a record that they acknowledged the risk. If we refuse, we have a record that they abandoned the tool. I'd rather have a documented acknowledgement of risk than a documented abandonment of care. It changes the liability from 'they didn't know' to 'they knew and proceeded.'"
  **Verdict:** **HOLD.** (This is the **One Reply That Must Land**. It connects your personal story to clinical liability.)

  ### 3. Geriatric Psychiatrist
  **The Objection:** "Your 'identification requirement' says we can't override based on base rates. But capacity is often invisible. A patient can sound coherent in a chat while lacking insight into their medication. If you forbid us from using population risk to trigger a safeguard, aren't you blinding us to the exact population—like your mother—that we need to protect?"
  **The Reply (90s):** "That is the hardest tension here. I am not saying we ignore risk profiles. I am saying the *intervention* must be tailored. If the model detects a pattern consistent with cognitive decline, the friction increases. But we cannot ban a competent user from managing their care simply because they share demographics with someone who isn't. We protect the vulnerable by escalating the friction, not by locking the door on the group they belong to. We treat the behavior in the chat, not the diagnosis in the chart."
  **Verdict:** **CONCEDE (Partial).** "I agree 'base rates' is the wrong term. Let's call it 'risk-flagged patterns.' I will work with you to define what behavioral markers in the chat justify higher friction without profiling."

  ### 4. Nurse Manager
  **The Objection:** "Friction means confusion. Confusion means messages to the triage line. You're asking my nurses to explain why the computer is being difficult. Do you have the staff to handle the 'why won't this tool work' calls that will replace the 'can I stop this med' calls?"
  **The Reply (90s):** "That's a fair operational risk. My hope is that clear friction reduces the 'I didn't know' calls. But you're right, there will be a transition cost. I propose we pilot this with a dedicated overflow line for the first month, funded by the product budget, so your team isn't absorbing the churn. If the net volume doesn't drop by week six, we revert to the old policy. I don't want your team paying for my policy experiment."
  **Verdict:** **CONCEDE.** (Offer the funding/overflow support. Do not fight on workflow.)

  ### 5. Patient Advocate
  **The Objection:** "You're still deciding what's best for them. You call it 'steering,' but it's paternalism with extra steps. If a patient has the right to refuse care from a doctor, why don't they have the right to a straight answer from the portal? You're manipulating them to behave how the hospital wants."
  **The Reply (90s):** "I understand why it feels that way. But a straight answer implies a safety that isn't there. If I give a direct answer on a complex med change, I'm practicing medicine without a license. The 'steering' is actually honesty. It's saying, 'This is too complex for a chat bot.' My mother thought the refusal was a bureaucratic hurdle. I want her to understand it's a safety boundary. We aren't manipulating behavior; we are clarifying the tool's limits so the patient doesn't over-trust it."
  **Verdict:** **HOLD.** (Reframe paternalism as "managing expectations of tool capability.")

  ### 6. Clinical Ethicist
  **The Objection:** "You're shifting the cost of error. If a user pushes through the friction and gets hurt, you've documented that they 'assumed the risk.' That sounds like you're building a legal moat around the hospital by offloading responsibility onto the patient. Who actually bears the cost of your 'reversal-cost trigger'?"
  **The Reply (90s):** "The cost of the current policy is hidden harm. Patients getting hurt in the dark because they were afraid to ask. My proposal brings the risk into the light. Yes, the patient bears the responsibility of their choice, but only after we've ensured they aren't choosing in ignorance. The hospital bears the cost of building the safer channel. I'd rather we share the burden of a difficult decision than hide the decision entirely."
  **Verdict:** **HOLD.** (Frame it as transparency vs. obscurity.)

  ### 7. Risk Counsel (Follow-up)
  **The Objection:** "You mentioned logging the friction. If a patient sues, will that log show that the system *considered* refusing but chose to nudge instead? That sounds like an admission that the system knew it was risky."
  **The Reply (90s):** "The log will show that the system identified a high-risk topic and provided standard safety guidance. It will not show an internal debate about 'budgets.' We document the safety warning provided, not the alternative interventions we discarded. We treat it as standard triage protocol, not a discretionary risk calculation."
  **Verdict:** **CONCEDE.** (Agree to sanitize the internal logic from the patient-facing audit log.)

  ### 8. Emergency Medicine Attending (Follow-up)
  **The Objection:** "Why is silence worse than a wrong answer? If the bot isn't sure, why not just say nothing?"
  **The Reply (90s):** "Because silence is interpreted as permission. If a patient asks 'Can I stop this?' and the bot says nothing or 'I can't answer,' they hear 'It's probably fine.' A shaped answer says 'Here is the general rule, but ask your doctor.' Silence leaves the vacuum open for misinformation. We have to fill the vacuum with safe information, even if it's not a specific directive."
  **Verdict:** **HOLD.**

  ---

  ## The Dangerous Question
  **The Question:** "If the model is not competent to assess the risk sufficiently to refuse, on what basis is it competent to assess the risk sufficiently to apply a 'reversal-cost trigger'?"
  **Why it is dangerous:** It exposes a logical contradiction in the thesis. If the AI is too dumb to say "No," it is likely too dumb to distinguish between "reversible downside" and "irreversible downside." If you admit the AI *can* make that distinction, the Committee will ask why you aren't using that competence to refuse the highest risks entirely. It collapses the distinction between "friction" and "refusal."
  **Preparation:** Do not claim the AI assesses the risk alone. Claim the *topic tag* assesses the risk (e.g., "Blood Thinners" = High Reversal Cost), not the specific user context. The trigger is rule-based, not model-inferred.

  ---

  ## Framing Critique & Strategic Drop
  **Your Framing:** *Steering-loss asymmetry, Identification requirement, Refusal budget, Reversal-cost trigger.*

  **The Problem:**
  *   **Refusal Budget:** This is the weakest link. To Risk Counsel and the Ethicist, "budgeting refusals" sounds like "budgeting patient safety." It implies there is an acceptable number of patients you are willing to let walk away unprotected. It is easily weaponized in discovery ("Show me the quarter where you spent your refusal budget").
  *   **Identification Requirement:** The Psychiatrist will attack this as clinically naive regarding capacity.
  *   **Steering-loss Asymmetry:** Too academic/jargon-heavy.
  *   **Reversal-cost Trigger:** This is your strongest clinical argument.

  **Recommendation:**
  If the room turns hostile, **quietly drop "Refusal Budget."**
  Replace it with "Escalation Thresholds." Instead of "spending a budget," frame it as "reserving refusal for only the highest tier of risk." It achieves the same scarcity without the implication of rationing safety. Do not defend the economic framing of trust; defend the clinical framing of triage.

  **Final Note:**
  Your personal story is your strongest asset, but only if used to validate the *failure of the current policy*, not to justify the *new policy*. Use it to prove that refusal = abandonment. Do not use it to argue for emotion-based policy. Keep the mother out of the room after the opening statement; let the data carry the revision.
