      *   *(3) Acquisition/Deference:* Social epistemology/Developmental.
      *   *(4) Skepticism/Regress:* The traditional motivation.
      *   *(5) Hinge Capture (Normativity/Politics):* Critical social epistemology. Very hot right now.
      *   *(6) Empirical/Psychological:* Risky for this foundation (empirical), but relevant to the "Anthropologist" worry.

  3.  **Address the "Anthropologist/Therapist" Worry (The Elephant in the Room):**
      *   *The Worry:* If hinges are arational/outside the space of reasons, epistemology (normative study of knowledge/justification) has no grip.
      *   *The Counter:* Epistemology isn't just about justifying beliefs; it's about the *structure* of rationality. If hinges frame rationality, studying the frame is epistemological. However, if the project becomes purely descriptive (how hinges *do* work), it drifts to sociology.
      *   *Verdict:* This is a *reason to fund with a different framing*. The framing must be **Normative Metaphysics of Epistemic Systems**, not "Psychology of Certainty." The epistemologist's job is to ask: *Ought* we have these hinges? Can hinges be irrational? (Coliva's "Moderate Hinge" vs. "Universal Hinge").
