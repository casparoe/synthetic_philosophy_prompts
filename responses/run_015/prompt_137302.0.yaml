      *   *The Keystone:* **The Normative Status of Hinges.** (Are they merely descriptive constraints or do they have a normative dimension?) This dictates whether (5) Capture is possible and whether the "Anthropologist" worry holds.
      *   *Refinement:* Let's align this with User's Point (1) but sharpen it. It's not just "Property vs. Practice," it's "Functional Role vs. Normative Status."
      *   *Selection:* **Question (1) refined: The Metaphysics of the Hinge Role.** (Is it a proposition type or a functional role?) This determines if drift (2) and capture (5) are coherent.

  5.  **Select the 3-4 Lines of Work (The Agenda):**
      *   *Constraint:* 8 person-years / 4 years. That's roughly 2 fellows per year, or 1 fellow for 2 years, etc. Needs to be focused.
