answer: |-
  There is no single canonical noun in general biology, but the precise term for this arrangement is **Sacrificial Sampling**, defined as a collective learning mechanism where a subset of agents incurs the physical costs of testing environmental hypotheses, allowing the remainder to adopt successful strategies without exposure to the same risks.

  This concept sits uneasily between your book's first mind (genetic selection) and fourth mind (social learning), because while the learning is social (within the lifetime), the selection mechanism is biological (death or loss). In the literature of swarm intelligence and superorganism theory, this is often discussed under **altruistic exploration** or **risk-sensitive foraging**, but those terms describe the behavior or the ecology rather than the epistemic split you are isolating. **Sacrificial Sampling** captures the specific arrangement where the *cost of error* is localized to protect the *capacity to learn* of the whole.

  Regarding the edges you care about:

  *   **Same Agent vs. Same Group:** The arrangement requires the "learner" to be the collective entity, not the individual. Whether the parts are cells in an immune system or bees in a hive is secondary; the primary requirement is functional integration where the survival of the whole outweighs the loss of the part. If the risk-bearers are not functionally part of the same decision-making agent (e.g., random strangers), it collapses into standard competition.
  *   **Shared Genes:** Kin selection explains why this evolves, but it is not required for the mechanism to operate. Unrelated conspecifics or even human firms can engage in Sacrificial Sampling if incentives align (e.g., a subsidiary testing a dangerous market), though without kinship or strong contractual binding, the arrangement is evolutionarily or economically unstable because individuals will defect to avoid the risk.
  *   **Cross-Species or Competitors:** If a manufacturer learns from a competitor's recalled product without paying for the recall, that is **Observational Learning** (your fourth mind), not Sacrificial Sampling. The defining boundary is *internal expenditure*: the group must pay the cost itself to generate the signal. If the cost is externalized, the mechanism is free-riding, not sampling.
  *   **Cost Severity:** The cost must be prohibitive enough that universal testing is impossible or maladaptive. If the cost is trivial (e.g., wasting a few calories), the group can test universally, and the split disappears. Death is the clearest example, but permanent injury or resource exhaustion sufficient to remove the agent from the pool also qualifies.
  *   **Designated Subset vs. Bad Luck:** The mechanism holds regardless of how the risk-bearers are chosen. Whether scouts are a morphological caste, a temporary volunteer role, or simply the individuals who happened to wander furthest, the epistemic function remains the same: differential survival yields information.
  *   **Simulation vs. Real Cost:** If the cost is borne by a model or simulation, the phenomenon collapses into your book's third mind (Model-Based Learning). The defining feature of Sacrificial Sampling is that the *environment* validates the hypothesis through physical resistance or destruction. Simulation removes the environmental risk, changing the category of mind entirely.
