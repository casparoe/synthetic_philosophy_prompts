  9.  (Drafting content based on this structure...) *Ensure I explicitly address the "high-trust, low-coercion" aspect.* In high-trust societies, social sanctions for deviating from norms might be subtle but powerful (exclusion from networks), whereas in low-trust/scarcity societies, the sanction is poverty (which is worse). Thus, people conform more in wealthy nations to avoid social exclusion, whereas in poorer nations they risk social exclusion to avoid poverty.

