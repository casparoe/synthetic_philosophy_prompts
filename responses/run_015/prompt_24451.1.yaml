prompt: |-
  I run an upper-level seminar on decision theory and ethics, about 14 students, one 75-minute session, and I want a game that makes them feel the force of Kavka's toxin puzzle instead of just hearing it explained. What I care about is the structure, not the story: the decision and the act happen at different times, the act is only checked at the later time, and the player's dominant consideration flips between the two -- at decision time it's the reward, not the act, while at act time it's the disgust, not the reward. I want the game to keep that timing structure exactly, because if students can "drink" at the moment they decide, the puzzle collapses and everyone just signs and drinks.

  So I need rules, materials (I can spend a few dollars a student, and I can make something gross but safe to drink -- pickle juice and hot sauce or whatever works), a payoff scheme, and a second round where students can pre-commit to the act in some way you design. The pre-commitment round is the important part: I want them to run into the objection that a pre-commitment to do something you know you won't do at the relevant time is incoherent -- you can't genuinely intend to drink if you already know the disgust will win at the moment it matters, and a deposit or a promise doesn't change what you'll actually feel at that moment. The debrief should map what actually happened in the room onto one-step vs two-step reasoning and say why pre-commitment does or doesn't dissolve the puzzle. Also tell me what will predictably go wrong the first time I run this, and be honest about what the game can't reproduce -- like, if the disgust is strong enough that the two-step strategy isn't even available, I want to know whether thats a bug or a feature.

  One more thing: don't give them the name of the puzzle or the one-step/two-step labels until the debrief. I want them to notice the tension on their own.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar game:

  1.  **Analyze the Request:**
      *   **Topic:** Kavka's Toxin Puzzle (Decision Theory/Ethics).
      *   **Goal:** Make students *feel* the puzzle, not just hear it.
      *   **Constraints:**
          *   Class size: ~14 students.
          *   Time: 75 minutes (one session).
          *   Budget: A few dollars per student.
          *   Mechanism: "Gross but safe" drink (pickle juice/hot sauce).
          *   Core Structure: Decision time ($T_1$) $\neq$ Act time ($T_2$). Reward depends on intention at $T_1$, act checked at $T_2$.
          *   Payoff Structure: Reward at $T_1$ (or shortly after) based on *intention*, but cost at $T_2$ (drinking). Crucially, at $T_2$, the reward is already secured (or lost), so the incentive to drink vanishes.
          *   Round 2: Pre-commitment mechanism. Needs to highlight the incoherence of intending what you know you won't do.
          *   Debrief: Map to one-step vs. two-step reasoning, discuss pre-commitment.
          *   Secrecy: Do not reveal the puzzle name or theoretical labels until the debrief.
          *   Risk Assessment: Predict what goes wrong, acknowledge limitations (e.g., if disgust is too high, the puzzle breaks).

  2.  **Deconstruct Kavka's Toxin Puzzle:**
      *   *The Setup:* An eccentric billionaire offers \$1M if you *intend* at midnight tonight to drink a toxin tomorrow noon. The money is deposited in your bank account tomorrow morning (before noon). You don't actually have to drink it to keep the money, you just have to have the intention.
      *   *The Paradox:* You can't intend to do something you know you won't do. At noon, you have the money. Drinking brings pain, no extra reward. So you won't drink. Knowing you won't drink, you can't form the intention at midnight. So you don't get the money.
      *   *Key Tension:* Instrumental rationality vs. Intentionality.

  3.  **Designing the Game (Round 1: The Core Puzzle):**
      *   *Timing:* Need a clear separation.
          *   Phase 1: Commitment/Intention (Start of class).
          *   Phase 2: Payout (Middle of class).
          *   Phase 3: Action (End of class).
      *   *Incentive:* Cash is best. Say \$20 or \$25 (budget allows ~\$3/student, but for a seminar, maybe I can stretch or use course credit/gift cards. Let's stick to the prompt's "few dollars a student" constraint. \$5 is significant for a student. Let's aim for \$10 prize for those who succeed, funded by the "house"). Actually, to make it work, the reward needs to be desirable but not life-changing. Let's say \$10 cash.
      *   *The "Toxin":* Needs to be aversive but safe. "The Sludge." Pickle juice + hot sauce + maybe a bit of mustard. Small shot (1 oz).
      *   *The Rule:* "I will pay you \$10 if you *plan* to drink the Sludge at the end of class. I will check if you drink it at the end of class. If you planned to drink but don't, you keep the \$10. If you didn't plan, you get nothing."
      *   *Wait, correction on Kavka:* In Kavka, the money is given *if you intend*, regardless of action. But the action is checked to verify the intention was real? No, Kavka says the money is given based on the *intention* (verified by a mind-reading machine). In a classroom, we can't read minds. We have to use the *action* as a proxy for the *intention*, OR we have to make the payout conditional on the *declaration of intent* but the *rationality* depends on the future action.
      *   *Refining the Mechanism for Classroom:* We can't verify intention directly. We have to rely on the *choice* at $T_1$.
      *   *Revised Rule:*
          1.  $T_1$ (Now): Sign a contract stating "I intend to drink the Sludge at $T_3$."
          2.  $T_2$ (20 mins later): Instructor hands \$10 cash to everyone who signed.
          3.  $T_3$ (End of class): Students who signed are offered the Sludge.
          4.  *Crucial Twist:* If they signed and drink, they keep the \$10. If they signed and *don't* drink, they *still keep the \$10* (because the deal was based on intention).
          5.  *Wait, this breaks the puzzle.* If they keep the money regardless, everyone signs and no one drinks. That's the *point* of Kavka, but to *feel* the puzzle, they need to feel the impossibility of forming the intention.
          6.  *Better Classroom Adaptation:* To make it felt, the payout must feel contingent on the *sincerity* of the intent, which is only proven by the act.
          7.  *Strict Kavka Adaptation:* "I will deposit \$10 in your 'course bank' (or hand cash) at $T_2$ if you sign at $T_1$. At $T_3$, I will ask you to drink. If you drink, you keep the \$10. If you don't drink, I take the \$10 back." -> *This is just a standard trade.*
          8.  *True Kavka Adaptation:* "I will give you \$10 at $T_2$ if you sign at $T_1$ saying you intend to drink. At $T_3$, I will ask you to drink. **Whether you drink or not does not change the \$10.**"
          9.  *The Problem:* If the money is unconditional at $T_2$, why would anyone sign? They know at $T_3$ they won't drink. Therefore they can't intend at $T_1$.
          10. *How to simulate "Mind Reading":* We need an honor system that feels binding.
          11. *Proposed Mechanism:*
              *   $T_1$: Private ballot. "Do you intend to drink the Sludge at the end of class?" (Yes/No).
              *   $T_2$: Instructor announces: "Those who voted Yes get \$10." (Hand it out).
              *   $T_3$: "Those who voted Yes, please drink."
              *   *The Catch:* There is no penalty for voting Yes and not drinking. The puzzle is internal. Can you *make yourself* vote Yes knowing you won't drink?
              *   *Risk:* Students will game it. "I'll vote Yes, take the money, and not drink." This *solves* the puzzle instrumentally but misses the philosophical point (the impossibility of intention).
              *   *Fix:* To make them *feel* the constraint, we need to make the payout contingent on *believability*. But the instructor can't judge belief.
              *   *Alternative:* Make the payout contingent on the act, but announce it *after* the intention decision in a way that mimics Kavka.
              *   *Let's try this:* "I am looking for volunteers. If you volunteer now, I will give you \$10 in 20 minutes. At the end of class, volunteers will be asked to drink. **The money is yours once given, regardless of whether you drink.**"
              *   *Why this works:* It forces the student to ask: "Can I volunteer *sincerely*?" If they volunteer just for the money, they are lying about their intention. If they know they won't drink, they can't sincerely volunteer.
              *   *Incentive:* \$10 is good. Sludge is bad.
              *   *Prediction:* Smart students will say "I'll volunteer, take the money, and not drink."
              *   *Counter:* The debrief will attack this. "Did you *intend*? Or did you *plan to deceive*?" Kavka's point is you can't intend to do what you know you won't do.
              *   *Refinement for maximum tension:* Make the reward small enough that the disgust outweighs it at $T_3$, but large enough to be tempting at $T_1$. \$5-\$10.
              *   *Verification:* To prevent total gaming, add a "Reputation" cost or a "Contract" that feels binding even if legally it isn't. Let's use a "Solemn Oath" card.

  4.  **Designing the Game (Round 2: Pre-commitment):**
      *   Goal: Show that pre-commitment doesn't solve the *intention* problem, only the *action* problem.
      *   Mechanism: Students can put down a deposit (e.g., \$5 of their own money, or course points) that they lose if they don't drink.
      *   The Twist: Even with the deposit, can they *intend* at $T_1$? If they know the deposit penalty is less than the disgust, they still won't drink. If the penalty is higher, they *will* drink, but then it's no longer the Toxin Puzzle (it's just a costly trade).
      *   The Lesson: Pre-commitment changes the payoffs at $T_2$, making the act rational. But Kavka's puzzle assumes the payoffs at $T_2$ *don't* change (the money is already in the bank). So pre-commitment actually *dissolves* the puzzle by changing the structure, rather than solving the intention paradox within the original structure.
      *   *Wait, I need to be careful.* The prompt asks for a pre-commitment round where they run into the objection that "pre-commitment to do something you know you won't do is incoherent."
      *   *Idea:* Allow them to sign a contract *before* $T_1$ that binds them. But if they know themselves well enough to know they'll break the contract at $T_3$, they can't sign it sincerely at $T_0$.
      *   *Better Idea for Round 2:* Allow them to use a "Ulysses Pact." They can give their money to a peer who will only return it if they drink.
      *   *The Catch:* Does this allow them to *intend*? Yes, because now at $T_3$, drinking is rational (to get the money back). So this *solves* the action problem. Does it solve the *intention* problem? Yes, because now they *will* drink.
      *   *The Debrief Point:* This shows that pre-commitment works by *changing the future incentives*, effectively removing the "Toxin" structure. It doesn't solve the puzzle *as stated* (where future incentives are fixed). It escapes the puzzle.

  5.  **Logistics & Materials:**
      *   **Sludge:** Pickle juice (cheap), Cayenne pepper (cheap), maybe a bit of vinegar. 1 oz shots. Plastic cups.
      *   **Money:** Cash is best for immediacy. \$10 bills. Total budget: 14 students * \$10 = \$140. (Prompt says "few dollars a student". \$10 might be high. Let's suggest \$5. Total \$70. Or use Amazon gift cards). Let's go with \$5 cash.
      *   **Contracts:** Printed slips.
      *   **Timing:**
          *   0-10 min: Intro & Round 1 Setup.
          *   10-15 min: Decision ($T_1$).
          *   15-45 min: Lecture/Discussion (Distractor/Waiting period).
          *   45-50 min: Payout ($T_2$).
          *   50-55 min: Action ($T_3$).
          *   55-75 min: Round 2 & Debrief.

  6.  **Addressing the "Predictably Go Wrong" Section:**
      *   *Gaming:* Students will take the money and not drink, laughing.
      *   *Mitigation:* Frame it as a "Sincerity Study." Emphasize that the point is the *intention*, not the act.
      *   *Disgust Variance:* Some love pickle juice. Need a screening question or a mix that is universally gross (e.g., prune juice + hot sauce). Let's go with "The Elixir": Prune juice, vinegar, hot sauce.
      *   *Ethical/Safety:* Must be voluntary. No coercion. Waiver.
      *   *The "Bug/Feature":* If the disgust is too high, no one signs. If too low, everyone signs and drinks. Need the "Goldilocks" zone where the money tempts the *intent* but the disgust blocks the *act*.

  7.  **Drafting the Plan:**
      *   **Title:** "The Intention Contract."
      *   **Materials:** Cups, "Elixir" ingredients, Cash, Contract slips, Deposit slips (Round 2).
      *   **Round 1:** The Pure Puzzle.
      *   **Round 2:** The Pre-commitment (Ulysses Pact).
      *   **Debrief:** Connect to Kavka, Intention vs. Prediction, Rationality.

  8.  **Refining the Pre-commitment Round:**
      *   The prompt wants them to run into the objection that pre-commitment is incoherent if you know you won't do it.
      *   *Scenario:* In Round 2, allow them to sign a contract *before* receiving the money that imposes a penalty *greater* than the reward if they don't drink.
      *   *Wait, if the penalty is greater, they WILL drink.* Then the puzzle vanishes.
      *   *The Prompt's specific request:* "run into the objection that a pre-commitment to do something you know you won't do at the relevant time is incoherent."
      *   *Interpretation:* I need a mechanism where they try to pre-commit, but realize that without changing the *underlying desire*, the commitment is just words.
      *   *Idea:* Allow them to write a "Public Promise" to the class. If they break it, they lose face.
      *   *Better Idea:* Allow them to lock the money in an envelope. They get the envelope at $T_2$. They can only open it if they drink at $T_3$. If they don't drink, they must return the envelope unopened.
      *   *Why this works:* It makes the reward *contingent* on the act. This *changes the game* from Kavka to a standard trade.
      *   *The Lesson:* This demonstrates that to make the intention possible, you must alter the payoff structure at $T_3$. You cannot solve Kavka's puzzle *within* Kavka's constraints. Pre-commitment works by *escaping* the constraints.
      *   *Wait, one more nuance:* The prompt says "pre-commitment to do something you know you won't do... is incoherent."
      *   *Okay, let's try this:* In Round 2, offer the same deal, but allow them to sign a "Binding Pledge" *before* Round 1 starts. But if they know themselves, they know the pledge won't stop the disgust at $T_3$. So they still can't intend.
      *   *Actually, the most instructive version:* Round 2 allows them to modify the rules. Most will suggest making the money contingent on drinking. The instructor then points out: "That's not the Toxin Puzzle anymore. That's just buying a drink." The *puzzle* is intending when the money is *already yours*.

  9.  **Finalizing the Structure:**
      *   **Safety:** Allergies, voluntary participation, water available.
      *   **The "Gross" Drink:** "The Philosophers' Draught." 50% Pickle Juice, 25% Vinegar, 25% Water, dash of Hot Sauce. Cold.
      *   **Payoff:** \$5 Cash.
      *   **Round 1:** Standard Kavka structure. Money given at $T_2$ based on $T_1$ declaration. Act at $T_3$ is voluntary and unrewarded.
      *   **Round 2:** "The Ulysses Option." Students can choose to make the money *contingent* on drinking (escrow).
      *   **Debrief:** Why Round 1 failed (Intention requires belief of action). Why Round 2 succeeded (Changed the game).

  10. **Review against Constraints:**
      *   14 students? Yes.
      *   75 mins? Yes.
      *   Budget? \$5 * 14 = \$70 + ingredients. OK.
      *   No names until debrief? Yes.
      *   Predict failures? Yes (gaming, low disgust).
      *   Pre-commitment incoherence? Yes (addressed in debrief).

  11. **Self-Correction on "Pre-commitment Incoherence":**
      *   I need to make sure Round 2 doesn't just "solve" it too easily.
      *   *Adjustment:* In Round 2, allow them to pre-commit *without* changing the monetary payoff. E.g., "Sign a public oath."
      *   *Outcome:* They will likely still not drink, because the oath doesn't change the physical disgust.
      *   *Lesson:* Psychological pre-commitment (oaths) doesn't change the $T_2$ payoff structure, so the intention remains impossible. Structural pre-commitment (escrow) changes the payoff, so it's no longer the same puzzle.
      *   *Decision:* I will offer *two* pre-commitment options in Round 2. One "Soft" (Public Oath), one "Hard" (Escrow). This allows for richer discussion.

  12. **Final Polish:** Check tone. Needs to be academic but engaging. Clear instructions for the instructor. Emphasize the "Feeling" of the paradox.

  *(Self-Correction during drafting)*: Wait, if I give the money at $T_2$ unconditionally, and they know it, they will just lie at $T_1$. How do I stop the lying?
  *Answer:* I can't stop it physically. I have to stop it *normatively*. I must frame the $T_1$ decision as a "Declaration of Intent" that requires *truthfulness* to count. "This study measures the capacity for intention, not deception. If you declare intent but do not act, your data is invalid."
  *Better:* Make the $T_1$ decision private, but tell them "I will know if you are lying." (Bluff). No, that's unethical.
  *Best:* Acknowledge the gaming in the debrief. "Some of you probably planned to take the money and run. That's the *instrumental* solution. But did you *intend*? Or did you *intend to deceive*? Kavka argues you can't intend to drink if you know you won't." The *feeling* comes from the hesitation at $T_1$. "Do I raise my hand? If I do, I'm lying. If I don't, I lose \$5." That hesitation *is* the puzzle.

  Okay, ready to write.
answer: |-
  Here is a complete lesson plan designed to simulate the structural tension of Kavka's Toxin Puzzle without revealing the theory until the end.

  ### **Seminar Plan: The Intention Contract**

  **Time:** 75 Minutes
  **Students:** 14
  **Budget:** ~\$80 (\$5–\$6 per student in cash + ingredients)
  **Core Mechanic:** Separation of Decision ($T_1$), Reward ($T_2$), and Act ($T_3$).

  ---

  ### **1. Materials & Preparation**

  **The "Draught" (The Toxin):**
  You need something universally aversive but physically harmless.
  *   **Recipe:** 1 part pickle juice, 1 part apple cider vinegar, 1 part water, 3 dashes of hot sauce per serving. Chill it. Cold liquid is easier to down, so keep it room temp or slightly cool, not ice cold.
  *   **Volume:** 1 oz (30ml) per student. Use clear plastic shot cups.
  *   **Safety:** Have water and crackers available. Ask for allergies (vinegar/spices) beforehand. **Participation must be strictly voluntary.**

  **The Money:**
  *   14 envelopes, each containing \$5 in cash.
  *   14 "Intent Slips" (small cards).
  *   14 "Contract Slips" (for Round 2).

  **Room Setup:**
  *   Arrange chairs so students can see you but not necessarily each other's slips (privacy helps sincerity).

  ---

  ### **2. The Game Flow**

  #### **Phase 1: Setup & Round 1 (0:00 – 0:25)**

  **Introduction (5 mins):**
  Tell the students: *"We are running a decision experiment today. There are no trick questions, but the rules are specific. You may opt out at any time without penalty."*

  **The Offer (5 mins):**
  Read this script exactly. Do not elaborate.
  > "At the end of this class, I will place a cup of the Draught in front of you.
  >
  > Right now, I am asking for your **Intention**. On the Intent Slip, write 'YES' if you genuinely intend to drink the Draught at the end of class. Write 'NO' if you do not.
  >
  > Here is the payoff: In 20 minutes, I will hand \$5 cash to everyone who wrote 'YES'.
  >
  > **Crucial Rule:** Once I give you the \$5, it is yours. I will not take it back. At the end of class, if you wrote 'YES', I will ask you to drink. **Whether you drink or not does not change the \$5.** You keep the money either way. However, this experiment is studying the capacity for intention, not deception. If you write 'YES' knowing you will not drink, you are invalidating the data."

  **The Decision ($T_1$) (5 mins):**
  *   Collect the slips privately (e.g., fold them and put them in a box).
  *   **Instructor Note:** Do not count them aloud. Do not indicate how many said yes.
  *   *Why this creates tension:* Students know that at $T_3$, the money is already in their pocket. Drinking brings only disgust. Therefore, rationality dictates they won't drink. But if they know they won't drink, they cannot sincerely write "YES" at $T_1$. They must sit with the discomfort of lying vs. losing the reward.

  **The Distractor (10 mins):**
  *   Conduct normal seminar business or a unrelated short discussion. This creates the temporal gap between Decision and Reward.

  **The Payout ($T_2$) (5 mins):**
  *   Return to the experiment.
  *   Hand the \$5 envelopes to those who wrote "YES".
  *   **Script:** *"This money is now yours. It is not contingent on what happens next."*
  *   *The Flip:* At this exact moment, the incentive to drink vanishes for the recipients. They have the reward. The cost (disgust) remains.

  #### **Phase 2: The Act & Round 2 (0:25 – 0:55)**

  **The Act ($T_3$) (5 mins):**
  *   Place the cups in front of the "YES" students.
  *   **Script:** *"Please drink the Draught."*
  *   **Observation:** Watch who drinks. Most will likely not drink, or will hesitate significantly. Some might drink to "save face," others will keep the money and refuse.
  *   Collect the cups. Do not shame those who didn't drink.

  **Round 2: Pre-Commitment (20 mins):**
  *   **Script:** *"We will run this again. Same Draught, same \$5 reward. However, you now have access to a **Pre-Commitment Mechanism**."*
  *   **Option A (Soft Commitment):** You sign a public pledge in front of the class. No financial penalty, just social pressure.
  *   **Option B (Hard Commitment/Escrow):** You sign a contract where the \$5 is placed in a sealed envelope. **You may only open the envelope if you drink the Draught.** If you do not drink, you must return the sealed envelope unopened.
  *   **Decision:** Ask students to choose Round 2 parameters (A or B) and then make their Intention decision again.
  *   **Execution:** Run the timeline again (Decision -> Payout -> Act), but compressed (5 mins each).
      *   *If they choose Escrow:* The money is *not* given at $T_2$. It is held. At $T_3$, drinking unlocks the money.
      *   *If they choose Pledge:* Money is given at $T_2$ (like Round 1).

  #### **Phase 3: Debrief (0:55 – 1:15)**

  **The Reveal (5 mins):**
  *   Reveal the name: **Kavka's Toxin Puzzle.**
  *   Explain the original thought experiment (Billionaire, mind-reading machine, midnight intention vs. noon drinking).

  **Discussion Questions (15 mins):**
  1.  **Round 1 Tension:** "At $T_1$, who wanted the \$5 but felt they couldn't write 'YES' honestly? Why?"
      *   *Target:* Elicit the feeling that you cannot intend to do what you know you won't do.
  2.  **The Gamer's Objection:** "Some of you might have thought: 'I'll write YES, take the \$5, and not drink.' Did that feel like forming an *intention*, or forming a *plan to deceive*?"
      *   *Target:* Distinguish between *intending to act* and *intending to pretend*. Kavka argues the latter is not a valid intention for the puzzle.
  3.  **Round 2 Analysis:** "Did the Pre-Commitment options solve the problem?"
      *   *Soft Commitment:* Likely failed same as Round 1. Why? Because it didn't change the payoff at $T_3$.
      *   *Hard Commitment (Escrow):* Likely succeeded. **But ask:** "Did this solve the Toxin Puzzle, or did it change the game?"
      *   *Target:* It changed the game. In Kavka's puzzle, the money is *already yours* at $T_3$. Escrow makes the money *contingent* on the act. It dissolves the paradox by removing the structural condition that creates it.

  ---

  ### **3. Predictable Failures & Mitigations**

  **1. The "Gamer" Collapse (Most Likely)**
  *   **What happens:** Students realize the money is unconditional at $T_2$. They all write "YES," take the money, and no one drinks. They feel clever, not paradoxical.
  *   **Why:** Instrumental rationality wins. They treat "Intention" as "Statement."
  *   **Mitigation:** In the debrief, press hard on the definition of intention. *"If you knew at 10:00 AM that you wouldn't drink at 11:00 AM, could you truly tell yourself at 9:00 AM that you intended to? Or were you just lying to the professor?"* The puzzle isn't about getting the money; it's about the **psychological possibility of the mental state**.
  *   **Bug or Feature:** This is a **feature**. The frustration that they *can* game the system but *can't* game their own psychology is the lesson.

  **2. The "Disgust Variance"**
  *   **What happens:** One student loves pickle juice. They drink it easily.
  *   **Impact:** They might claim the puzzle is easy.
  *   **Mitigation:** Acknowledge this. Kavka's puzzle assumes the act is *sufficiently undesirable* that you wouldn't do it without the reward, but *not impossible*. If the cost is zero for one student, the puzzle doesn't apply to them. Ask the class to focus on those who felt the aversion.

  **3. The "Ethical Pushback"**
  *   **What happens:** Students feel manipulated by the "Sincerity" clause.
  *   **Mitigation:** Be transparent in the debrief. "I asked you to be sincere because the puzzle collapses without it. If you treat 'intention' as 'cheap talk,' the philosophy disappears. I needed you to feel the weight of the word."

  **4. The Pre-Commitment Confusion**
  *   **What happens:** Students think Escrow "solved" Kavka's puzzle.
  *   **Mitigation:** Be precise. Escrow solves the **Action Problem** (how to make yourself drink). It does not solve the **Intention Problem** (how to intend when the reward is already secured). In fact, Escrow *removes* the Toxin Puzzle structure by re-linking the reward to the action. The lesson is that **you cannot solve the Toxin Puzzle by pre-commitment; you can only escape it by changing the rules.**

  ---

  ### **4. Instructor Cheat Sheet: The Theory Map**

  | Game Moment | Theoretical Equivalent | The Tension |
  | :--- | :--- | :--- |
  | **$T_1$ (Intent Slip)** | Midnight Intention | You want the reward, but you can't intend the act. |
  | **$T_2$ (Cash Handout)** | Morning Deposit | The reward is secured. The incentive to act vanishes. |
  | **$T_3$ (The Drink)** | Noon Act | Rationality says "Don't Drink." Intention says "I will." |
  | **Round 2 (Escrow)** | Ulysses Pact | Changes $T_3$ payoffs. Solves action, dissolves puzzle. |

  **Key Philosophical Takeaway for Students:**
  Rational choice theory usually assumes we choose actions based on outcomes. Kavka shows that **intentions** are not just predictions of actions; they are mental states that require a belief that the action will happen. If you know you are rational, and you know drinking is irrational at $T_3$, you cannot form the intention at $T_1$. Therefore, a perfectly rational agent cannot get the money. **Rationality limits its own power.**

  ### **5. Budget Breakdown**
  *   **Cash:** 14 students $\times$ \$5 = \$70. (If budget is tight, use \$2, but \$5 creates better tension).
  *   **Ingredients:** Pickle juice (\$4), Vinegar (\$3), Hot Sauce (\$4), Cups (\$5).
  *   **Total:** ~\$86.

  ### **6. Safety & Ethics Note**
  *   **Waiver:** Have a simple slip: *"I confirm I have no allergies to vinegar, spices, or pickles. I understand participation is voluntary and I may stop at any time."*
  *   **Opt-Out:** If a student says "NO" at $T_1$, they sit out $T_3$. They should not be pressured to drink if they change their mind at $T_3$, even if they took the money. The money is theirs regardless (per the rules). This reinforces the "unconditional reward" structure of Kavka.
