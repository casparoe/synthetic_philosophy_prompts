      *   *Disjunctivism:* Rejects Premise 3. The "seeming" is not a mental state common to both. In the good case, the nature of the experience is constituted by the external object. In the bad case, it is a mere appearance. They are fundamentally different kinds of mental episodes, despite being indistinguishable *from the inside*.
      *   *The Deadlock:* One side prioritises the *phenomenology* (it feels the same, so it must be the same stuff). The other prioritises the *metaphysics of contact* (in the good case, the world is present; in the bad case, it isn't, so the states can't be the same).

