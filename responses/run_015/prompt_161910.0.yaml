          *   *Verdict:* **Clearly Right**. Option value is a distinct factor not captured by static ITN.

      *   **Move 6 (Miriam):** Option value is a fourth factor. If unmeasured considerations count against a framework, none survives. Practitioners earmark money for exploration outside the framework.
          *   **Analysis:** This is a "ceteris paribus" defense. Frameworks are simplifications. Adding a "learning" budget is a common practical solution. However, dismissing it as "smuggled in" ignores that prioritization frameworks should ideally capture the main drivers of value.
          *   *Verdict:* **Mostly Right** (pragmatically), but **Weak** theoretically. It admits ITN is incomplete but argues completeness is impossible.

      *   **Move 7 (Jonas):** Concession proves ITN is for comparing knowns, not prioritizing. Neglectedness needs counterfactual reading (what others do with money you don't spend). Billionaire backing makes a cause not neglected even if total funding is low.
