  1. "The puzzle restated"
  You note a contradiction in assessing understanding. Your school demands live oral defense because written solutions might be AI-generated, implying text alone proves nothing. Yet, AI developers treat generated chains of thought as evidence of reasoning, even admitting they might be post-hoc. Meanwhile, professionals use notes and time, unlike students. You ask what theories underlie these practices, if consistent, and if your "steering test" offers a better metric for genuine human comprehension.

  2. "What my school's rule presupposes"
  Your school's rule presupposes that understanding is an internal capacity for active reconstruction, not merely possessing a correct record. It assumes true understanding allows accessing reasoning steps without scaffolding. This treats understanding as cognitive readiness: you must hold logical connections in working memory ready to deploy against novel interruptions. It presupposes written text is easily decoupled from the mind, vulnerable to outsourcing. Therefore, evidence of understanding must be tied to the agent's real-time performance. The oral defense tests ownership of the logic. If you cannot defend it live, the text is deemed an artifact separate from your cognition. This theory prioritizes reliability under pressure as the marker of genuine grasp, assuming that luck or mimicry fails when conditions shift unexpectedly. It strictly requires that the reasoning process be accessible to consciousness on demand. However, it is underdetermined regarding depth; one might defend a proof mechanically without grasping its broader significance, yet still pass. The practice fits well with virtue epistemology, where intellectual character matters, but strictly it only demands procedural accessibility. It assumes the mind is a unified agent capable of retrieving its own operations, distinguishing the student from a tool that merely outputs results.

  3. "What trusting a chain of steps presupposes"
  Trusting a chain of steps presupposes that understanding is visible in the causal structure of the output. It assumes that if the intermediate steps logically lead to the conclusion, the system is reasoning rather than guessing. This view treats the text as a trace of the computational process, implying that the model's internal state aligns with the stated reasons. It presupposes that coherence between steps is evidence of genuine derivation. Developers admit this might be underdetermined: the model could predict the answer first and generate steps to fit. Thus, the practice strictly requires only plausible, consistent steps, not necessarily causal ones. It fits well with functionalism, where internal states matter less than input-output coherence. But if the steps are post-hoc, the theory collapses into trusting the final answer alone. The practice assumes that generating valid logic is harder than guessing the answer, so the chain reduces the probability of luck. It treats the text as a proxy for the hidden layers' activity. Yet, it is underdetermined because a system could be trained to mimic reasoning without possessing the causal mechanism. So, trusting the chain presupposes that the generation process is constrained by the logic it describes, even if developers warn otherwise.

  4. "Whether one theory can cover both"
  There is no single, coherent account on which a written rationale counts as no evidence from a student and real evidence from a model. The school's rule relies on Access Internalism: you must know that you know. The AI practice relies on Functional Externalism: if the output behaves like reasoning, it counts. These are incompatible standards applied asymmetrically. The school's practice is strict about cognitive access; the AI practice is loose, accepting correlation as causation. The practice is underdetermined in both cases: a student could memorize defenses without understanding, and a model could simulate reasoning without causality. However, the AI practice is the confused one. It claims the text is evidence of reasoning while admitting it might be post-hoc decoration. This contradicts the claim that the text shows understanding. The school's rule is consistent within its own frame, even if too harsh compared to professionals. The asymmetry arises because schools test potential, while developers test utility. But logically, you cannot claim text proves nothing for humans yet something for machines without changing the definition of understanding mid-argument. The confusion lies in treating AI text as a window into a mind when developers admit there is no mind to look into. To reconcile them, one would need a theory where understanding is defined by reliability under perturbation for humans, but by surface coherence for machines. This is ad hoc. The strict requirement for students is cognitive access; the good fit for AI is behavioral alignment. Since the developers admit the alignment might be fake, the practice of trusting the chain is philosophically unstable. It wants the credit of reasoning without the metaphysical commitment to a reasoner. The school's rule is harsher but logically tighter: no access, no credit. Ultimately, the double standard reveals a pragmatic shift rather than a theoretical one. We demand humans be reasons-responsive agents, while we accept machines as reasons-mimicking tools. But calling the mimicry 'reasoning' is the error.

  5. "The steering test"
  Your steering test is a stronger proxy because it tests counterfactual dependence rather than surface coherence. It asks if reasoning drives output, aligning with causal theories. Passing it establishes that stated reasons are not merely decorative but functionally integrated into the generation process. It rules out post-hoc rationalization where text is fixed regardless of logic. However, it fails to establish subjective understanding. A system could pass by having weights sensitive to prompt perturbations without "grasping" meaning. It establishes functional reliability, not internal experience. Regarding systems that get answers right with no derivation: under Access Internalism, they do not understand because reasoning is inaccessible. Under Functional Externalism, they do understand because input-output mapping is reliable. Your test bridges this by demanding reasoning be load-bearing, even if hidden. But if the system produces no text, you cannot apply the test. Thus, it favors transparent systems. It is better than trusting text blindly, but still measures behavior, not mind. It shows the system is reasons-responsive, a key component of understanding, but perhaps not the whole story. It shifts the burden from text existence to causal efficacy, avoiding fluency traps. However, it cannot detect understanding in opaque models that reason silently. For those, we remain agnostic. It improves on the status quo by demanding causal links, but remains behavioral. It confirms the system acts as if it understands.

  6. "What would change my mind"
  I am least confident in claiming the AI practice is purely confused. If future research shows chain-of-thought training alters internal mechanisms to match text, the text becomes causal. If models fail when the chain is disrupted, steps are load-bearing. My verdict rests on the assumption that AI text is often decoupled from computation. If mechanistic interpretability reveals that specific neurons fire corresponding to generated steps, the text becomes a true trace. That would force me to concede the AI practice captures understanding. If the model's output changes when reasoning is altered, the reasoning is real. This would show the double standard likely reflects substrate differences.
