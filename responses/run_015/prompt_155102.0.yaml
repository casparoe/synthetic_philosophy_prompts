  Mechanical actuation confirms physical causation but fails to validate downward causation because transducers convert states rather than enabling high-level patterns to constrain low-level dynamics [Confidence: 95%].

  ### Decision Procedure: The Simmball Shove Test
  *Run this sequence on paper specs; stop at the first "No."*

  **Step 1: Directionality Check**
  *   **Question:** Do the architecture diagrams show causal arrows flowing from High-Level Symbol (HLS) to Low-Level Substrate (LLS) *independently* of LLS-to-HLS flow?
  *   **Sufficient Evidence:** Explicit feedback loops where HLS state selects LLS transition rules.
  *   **Stop Point:** If HLS is derived solely from LLS (read-only), verdict is **No Downward Causation** (Epiphenomenalism) [Confidence: 99%].
  *   **Philosophy Handoff:** None yet.

  **Step 2: Counterfactual Independence**
  *   **Question:** If HLS is set to State A vs. State B, does LLS transition differently *given identical prior LLS states*?
  *   **Sufficient Evidence:** Specs show HLS acting as a constraint function on LLS probability distributions.
  *   **Stop Point:** If LLS transitions are fully determined by prior LLS history regardless of HLS, verdict is **No Downward Causation** (Supervenience) [Confidence: 90%].
  *   **Least Sure Step:** [Confidence: 75%] Paper specs often hide lookup tables that mimic constraints; distinguishing a true high-level constraint from a hardcoded low-level rule is difficult without implementation data.

  **Step 3: Common Cause Screen**
  *   **Question:** Is there a hidden Low-Level Variable (LLV) causing both the HLS update and the LLS shift?
  *   **Sufficient Evidence:** Absence of a shared antecedent variable in the signal flow graph.
  *   **Stop Point:** If an LLV drives both, verdict is **Correlation Only** [Confidence: 95%].
  *   **Trap Catch:** This prevents mistaking side-effects (like heat) for causation.

  **Step 4: Substrate Boundary Check**
  *   **Question:** Does the HLS affect the *internal* computational substrate or an *external* actuator?
  *   **Sufficient Evidence:** Signal paths remain within the defined cognitive architecture boundary.
  *   **Stop Point:** If effect is external (e.g., motors), flag for **Engineering Causation Only** (does not prove cognitive downward causation) [Confidence: 85%].
  *   **Philosophy Handoff:** If internal, proceed to Step 5.

  **Step 5: Semantic vs. Syntactic Handoff**
  *   **Question:** Does the causation rely on the *meaning* of the symbol or just its *physical pattern*?
  *   **Sufficient Evidence:** N/A (Paper specs cannot prove semantic causation).
  *   **Stop Point:** If the mechanism relies on semantic content affecting physics without physical encoding, hand off to **Philosophy** (Hard Problem of Content) [Confidence: 100%].
  *   **Verdict:** If only physical pattern matters, it is standard engineering, not Hofstadterian downward causation.

  ---

  ### Procedure Run on Proposals

  **1. Chess Engine (Heat Dissipation)**
  *   **Step 1:** Pass (Strategy rule tweaks logic).
  *   **Step 2:** Pass (Different rules change gate switching).
  *   **Step 3:** **FAIL.** The logic gate switching (LLV) causes both the symbolic update and the heat dissipation.
  *   **Verdict:** **No Downward Causation.** The heat is a side-effect, not a shove.
  *   **Hard Case Note:** Intuition suggests "Symbol changed, Heat changed, therefore Symbol caused Heat." The procedure correctly identifies this as a Common Cause trap [Confidence: 95%].

  **2. Language-Model Arm (Servo Motors)**
  *   **Step 1:** Pass (Token output drives motor).
  *   **Step 2:** Pass (Different tokens move motors differently).
  *   **Step 3:** Pass (Token generation drives motor, not vice versa).
  *   **Step 4:** **FLAG.** Effect is external to the computational substrate.
  *   **Verdict:** **Engineering Causation Only.** This proves the system can move matter, but not that the *simmball* constrains the *marbles* internally.
  *   **Friend's Objection:** Your friend claims this settles it. The procedure shows why that is too quick: moving a servo is transduction, not internal downward causation [Confidence: 90%].

  **3. "Ghost Careenium" (Noise Correlation)**
  *   **Step 1:** **FAIL.** Specs state noise correlates but never initiates.
  *   **Verdict:** **No Downward Causation.** Pure epiphenomenalism.
  *   **Confidence:** 100%.

  ---

  ### Procedure Limitations & Uncertainty

  **Where It Will Misfire**
  *   **Hidden Microcode:** If the paper specs claim "High-Level Constraint" but the actual implementation is a pre-computed low-level lookup table, Step 2 will pass falsely [Confidence: 80%].
  *   **Definition of Substrate:** If the lab redefines "substrate" to include the servos, Step 4 becomes ambiguous [Confidence: 85%].

  **Least Sure Step**
  *   **Step 2 (Counterfactual Independence):** On paper, a high-level constraint looks identical to a low-level rule triggered by a high-level *signal*. Distinguishing "downward causation" from "upward signal triggering downward rule" is conceptually slippery without runtime intervention data [Confidence: 75%].
