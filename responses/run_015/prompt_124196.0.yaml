answer: |-
  To serve as the normative backbone of a criminal code in a liberal democracy characterised by metaphysical disagreement, a theory of punishment must satisfy a hierarchy of desiderata. Some of these are conditions of legitimacy accepted across the spectrum, while others represent the fault lines where the Dennett-Caruso dialectic fractures. The following specifications distinguish between the settled constraints of liberal legality and the contested moral commitments that determine how your sentencing worksheet resolves the divergence between desert and risk.

  ### I. The Non-Negotiable Desiderata (Consensus)
  These requirements are largely settled among competent theorists of punishment, regardless of their stance on free will. A theory that fails these cannot function in a liberal democracy.

  **1. The Legality Principle**
  *Requirement:* Punishment may only be imposed for a violation of a pre-existing, publicly promulgated law.
  *Case:* This prevents the state from detaining the 'low-desert/high-risk' offender simply because they are dangerous, unless their dangerousness manifests in a specific legal violation.
  *Status:* **Non-negotiable.** Even the quarantine model requires a legal trigger (like a public health act) to detain; arbitrary detention is excluded by the rule of law.

  **2. The Prohibition on Torture and Degrading Treatment**
  *Requirement:* The state may not inflict suffering that exceeds the minimum necessary to achieve the sentence's aim, nor may it treat the offender as a mere object.
  *Case:* This constrains the 'high-risk' score from justifying inhumane containment conditions for the neurological offender.
  *Status:* **Non-negotiable.** This is a human rights baseline. However, what counts as 'degrading' is contested; a retributivist sees hard treatment as inherent to punishment, while a quarantine theorist sees it as a failure of the medical model.

  **3. The Agency Constraint**
  *Requirement:* The system must address the offender as a participant in the normative order, capable of understanding the reasons for their sanction.
  *Case:* Even if Caruso is right about basic desert, the process cannot treat the offender like a rabid animal; they must be given reasons they can comprehend.
  *Status:* **Non-negotiable.** A system that speaks only in the language of causal manipulation (like conditioning) rather than normative guidance loses democratic legitimacy.

  ### II. The Contested Desiderata (The Stress Cases)
  Here the consensus breaks down. These are the requirements your worksheet must prioritise, knowing that satisfying one may violate another.

  **4. The Desert Ceiling (Proportionality to Culpability)**
  *Requirement:* The censuring element of the sentence (severity, stigma, punitive restriction) must not exceed the offender's blameworthiness for the past act.
  *Case:* **The High-Desert/Low-Risk Elderly Fraudster.** This principle demands we still censure the fraudster despite their low risk, but it forbids punishing them *more* than they deserve to satisfy public anxiety. Conversely, it forbids punishing the **Low-Desert/High-Risk Neurological Offender** beyond their culpability, even if they are dangerous.
  *Status:* **Contested (Retributivist/Compatibilist Priority).** This is the core of the hybrid worksheet. Caruso's quarantine model rejects this as a limit on *incapacitation* (though he accepts it as a limit on *censure*). If you make this non-negotiable, you rule out pure preventive detention for the non-culpable dangerous.
  *Prejudice Flag:* The intuition that 'suffering must be paid for' is a retributive prejudice if free-will scepticism is true. However, the intuition that 'suffering must not exceed culpability' is a liberal right.

  **5. The Safety Floor (Preventive Necessity)**
  *Requirement:* The duration of preventive supervision must be sufficient to reduce the risk of serious harm to an acceptable public threshold.
  *Case:* **The Low-Desert/High-Risk Offender.** If the desert score is near zero (due to duress or disorder) but the risk score is critical, this desideratum demands incapacitation.
  *Status:* **Contested (Quarantine/Utilitarian Priority).** Dennett might accept this as part of responsible forward-looking practice; Caruso accepts this as the *only* justification. Traditional retributivists reject this as a primary goal, viewing it as a side-effect at best.
  *Prejudice Flag:* The assumption that 'public safety trumps individual liberty in all cases of high risk' is a security prejudice. In a liberal democracy, rights usually trump utility, suggesting this desideratum must yield to the Desert Ceiling in cases of low culpability.

  **6. The Moral Luck Neutrality**
  *Requirement:* Sentencing should not vary significantly based on chance outcomes unrelated to the offender's choices or intentions.
  *Case:* **The Successful vs. Attempted Killer.** If the only difference is a gust of wind deflecting the bullet, the desert scores should be nearly identical.
  *Status:* **Contested.** Philosophically attractive, but legally problematic. The criminal law *does* punish results (homicide vs. attempt). A theory demanding strict neutrality here conflicts with the settled structure of the criminal code.
  *Prejudice Flag:* The demand for perfect neutrality here is likely a **philosophical prejudice**. The law reflects a social reality where harms matter. A workable theory must accommodate the intuition that causing death is worse than trying to, even if moral luck is metaphysically troubling.

  **7. The Socio-Economic Neutrality of Risk**
  *Requirement:* Actuarial risk scores must not penalise offenders for circumstances beyond their control (poverty, postcode, addiction).
  *Case:* **The Offender with High Risk Driven by Poverty.** If the risk score is high because the offender lives in a high-crime area with no support, using this to extend supervision compounds injustice.
  *Status:* **Contested.** Actuarially, these factors predict recidivism. Morally, they are unjust bases for state censure or restriction.
  *Prejudice Flag:* The belief that 'risk scores are objective facts' is a **technocratic prejudice**. They are normative constructs. A liberal theory must require the state to mitigate these social risks rather than punish them.

  **8. The Dynamic Assessment of Desert**
  *Requirement:* Desert is not fixed at the moment of the offence; it can be mitigated by post-offence repentance and reform.
  *Case:* **The Offender Who Repents.** If desert drops due to genuine remorse, but risk remains (or vice versa), the theory must explain which score governs.
  *Status:* **Contested.** Hard retributivists often view desert as fixed by the past act. Compatibilists and quarantine models are more open to dynamic assessment.
  *Prejudice Flag:* The intuition that 'repentance erases blame' is a moral preference, not a logical necessity. However, for a forward-looking system, ignoring reform is inefficient and inhumane.

  ### III. The Collisions (Jointly Unsatisfiable Desiderata)
  There are specific cases where these desiderata cannot be simultaneously satisfied. You must locate the collision to programme the worksheet correctly.

  **1. The Low-Desert/High-Risk Collision**
  *Conflict:* **The Desert Ceiling** vs. **The Safety Floor.**
  *Analysis:* If an offender has a neurological disorder that negates blame (Desert ≈ 0) but creates a high probability of violence (Risk ≈ High), you cannot satisfy both the requirement that we do not punish the non-culpable and the requirement that we protect the public.
  *Resolution:* In a liberal democracy, **The Desert Ceiling must win.** You may not impose punitive censure on the non-culpable. However, you may detain them under a *non-punitive* quarantine regime (civil commitment). The collision is resolved by distinguishing *punishment* (which requires desert) from *incapacitation* (which requires risk). If the theory cannot distinguish these conceptually, it fails.
  *Verdict:* This is a confident verdict. Liberal rights constrain utility.

  **2. The Moral Luck Collision**
  *Conflict:* **Moral Luck Neutrality** vs. **Legal Consistency.**
  *Analysis:* If you equalise the sentences of the attempted and successful killer to satisfy philosophical neutrality, you violate the legal principle that harms constitute distinct wrongs. If you sentence them differently, you violate the philosophical principle that control is required for responsibility.
  *Resolution:* **Legal Consistency must win.** A theory of punishment for a *criminal code* must fit the law. The theory should explain why results matter (e.g., they affect the normative expectation of security) rather than demanding the law change to fit the metaphysics.
  *Verdict:* This is a conjecture. Some reformers argue the law *should* change to match the metaphysics, but for a sentencing commission working within current statutes, the law constrains the theory.

  **3. The Agency vs. Quarantine Collision**
  *Conflict:* **The Agency Constraint** vs. **The Quarantine Model.**
  *Analysis:* Caruso's model treats dangerous individuals like carriers of a pathogen. However, the **Agency Constraint** requires we treat them as reason-responsive agents. If you detain someone for risk without censure, but the experience is indistinguishable from prison, you violate their agency by deceiving them about the nature of their confinement.
  *Resolution:* **The Agency Constraint must win.** If the quarantine model cannot distinguish its facilities from prisons, or cannot engage the detainee as an agent, it becomes punitive detention without desert, which is impermissible.
  *Verdict:* This depends on how persuasive one finds the sceptical argument. If basic desert is an illusion, 'agency' must be redefined (as Dennett does) rather than abandoned.

  ### IV. The Single Most Exclusionary Desideratum
  The requirement that excludes the largest number of otherwise attractive theories is: **"State censure implies moral blameworthiness."**

  If you accept this as a hard constraint, you exclude the Caruso-style quarantine model (which seeks to detach incapacitation from blame) and pure utilitarian accounts (which justify censure as a tool for deterrence regardless of desert). It forces the theory to be either Retributive or Compatibilist-Hybrid. Conversely, if you reject this and claim the state may censure or detain purely on risk, you exclude traditional Retributivism and most Compatibilist accounts that tie responsibility to reasons-responsiveness. Given the liberal commitment to treating citizens as responsible agents, retaining the link between censure and blameworthiness is the stronger candidate, but it is the primary point of exclusion.

  ### V. Settled vs. Contested: A Summary Note
  It is settled that punishment must be legal, non-torturous, and address the offender as an agent. It is *genuinely contested* whether the state's right to punish derives from the offender's past choice (Desert) or the community's future safety (Risk). It is also contested whether 'risk' can be morally disentangled from social deprivation. Where I have recommended relaxing a requirement (e.g., Moral Luck Neutrality), that is a **conjecture** based on the practical necessity of fitting theory to existing legal structures. Where I have prioritised the Desert Ceiling over the Safety Floor, that is a **confident verdict** based on the liberal prohibition on using individuals merely as means to social ends.

  ### VI. Verdicts on the Three Families of View

  **Traditional Retributivism**
  This view satisfies the Desert Ceiling and Agency Constraint but fails to provide a coherent justification for managing the Low-Desert/High-Risk offender without resorting to ad-hoc preventive measures that contradict its own principles.

  **Dennett-Style Compatibilist and Forward-Looking Accounts**
  This view best navigates the worksheet by redefining desert as a functional capacity for reasons-responsiveness, allowing it to retain censure while integrating risk management, though it risks glossing over the hard metaphysical worries raised by sceptics.

  **Caruso-Style Free-Will-Sceptical Quarantine Models**
  This view offers the most coherent handling of the Low-Desert/High-Risk case but struggles to maintain the Agency Constraint and risks collapsing into a preventive detention regime that liberal citizens will experience as punitive regardless of the theoretical label.
