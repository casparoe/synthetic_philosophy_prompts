  In a mid-sized logistics firm, two senior analysts, Alice and Bob, are subject to a new decentralized data governance policy where each holds an absolute, individual veto right over whether their own keystroke and mouse-move logs are ingested into a shared productivity-prediction model. Both analysts genuinely desire a high-accuracy model to secure departmental funding, and both agree that a model trained on both datasets would outperform any model trained on a single dataset; however, each also harbors a specific privacy-mediated preference: Alice prefers a scenario where only Bob contributes (saving her privacy while gaining the model's benefit) over both contributing, while Bob symmetrically prefers only Alice contributing over both. When the policy is enacted, Alice exercises her veto to prevent her own logs from being used if Bob consents (preferring *Bob-only* to *Both*), and Bob exercises his veto to prevent his logs from being used if Alice consents (preferring *Alice-only* to *Both*); yet, if the other vetoes, each prefers *Neither* to being the sole contributor due to fairness concerns. Consequently, despite both strictly preferring the *Both* outcome to the *Neither* outcome, the decentralized exercise of their informational veto rights locks the system into the *Neither* state, yielding a Pareto-inferior model that fails to launch.

  **Verification and Analysis**

  **1. Specification Compliance:**
  *   **Alternatives:** The social states are $x$ (Both trained), $y$ (Alice only), $z$ (Bob only), $w$ (Neither).
  *   **Rights Assignment:** Alice is decisive over pairs differing only in her contribution: $(x, z)$ and $(y, w)$. Bob is decisive over pairs differing only in his contribution: $(x, y)$ and $(z, w)$.
  *   **Pareto Comparison:** Both prefer $x$ (Both) > $w$ (Neither). This satisfies the Pareto condition that if everyone prefers $x$ to $w$, society should prefer $x$ to $w$. The prompt's Spec (2) ("Both > Only one") is satisfied in the sense that both prefer $x > y$ (for Bob) and $x > z$ (for Alice), though the paradox requires the "meddlesome" preference ($z > x$ for Alice, $y > x$ for Bob) to trigger the veto.
  *   **Conflict:** Alice's right forces $z$ over $x$ (she vetoes $x$). Bob's right forces $y$ over $x$ (he vetoes $x$). If they act simultaneously or sequentially without coordination, the equilibrium settles at $w$ (Neither), because Alice prefers $w$ over $y$ and Bob prefers $w$ over $z$. Thus, the Pareto-superior state $x$ is unreachable via the exercise of liberal rights.

  **2. Structural Feature:**
  The single structural feature doing the work is the **decentralized veto structure over non-rivalrous informational goods**. In physical goods (like Sen's bedroom), my use excludes yours. In informational goods (training logs), my contribution *adds* to yours without diminishing it (non-rivalrous). The paradox arises because the veto power allows an agent to withhold a non-rivalrous input that would benefit the other, based on a preference ordering that values relative privacy or fairness over absolute collective gain.
  *   **Removal:** If you remove the decentralized veto (replacing it with a central planner), the planner simply selects $x$ based on the Pareto preference ($x > w$), collapsing the case into a standard optimization problem. If you remove the informational nature (making logs rivalrous), the scenario reverts to the classic Sen formulation where the conflict is about who consumes the good, rather than who contributes to a public good.

  **3. Defense of Minimal Liberalism:**
  A defender of minimal liberalism would attack the **validity of the Pareto comparison across veto boundaries**. They would argue that the Pareto principle should not apply to preferences that are "meddlesome" or based on violations of rights. Specifically, Alice's preference for $z$ (Bob only) over $x$ (Both) is based on her desire to retain privacy while exploiting Bob's data. A liberal defender might claim that preferences violating the spirit of the right (i.e., wanting the benefit of the other's data while withholding one's own) should be excluded from the Pareto calculation. Alternatively, they might challenge the **framing of the alternatives**, arguing that the right is not just to veto, but to *condition* consent, and that a proper liberal framework would allow for reciprocal exchange (Coasean bargaining) rather than rigid vetoing, thereby dissolving the paradox into a negotiation problem. This challenge might succeed in practice (contracts solve this) but fails in strict axiomatic theory where preferences are taken as given and rights are absolute constraints.
