answer: |-
  ### Desiderata for the Heterogeneity Problem

  1.  **Phenomenal Unity:** Must identify a shared property across qualitatively distinct experiences (warm bread vs. mathematical insight).
      *   *Case:* Without this, "pleasure" is just a label for a random list, undermining the hedonist claim that pleasure is *the* good.
  2.  **Scalar Variability:** Must accommodate degrees of intensity and duration that allow for summation or averaging.
      *   *Case:* A welfare module must calculate trade-offs; a minute of ecstasy cannot be mathematically incommensurable with an hour of contentment.
  3.  **Valence Reversibility:** Must explain how the same stimulus (water, noise, touch) shifts from pleasant to unpleasant based on internal state (satiety, injury).
      *   *Case:* If pleasure is in the object, satiety makes no sense; the account must locate the value in the *relation* between subject and stimulus.
  4.  **Cross-Species Accessibility:** Must be detectable in non-linguistic animals (hens, pigs) without assuming human-like cognitive architecture.
      *   *Case:* A welfare tool ranking animal outcomes cannot rely on concepts requiring propositional attitude reports or complex self-narrative.
  5.  **First-Person Authority:** Must generally align with the subject's own judgment that they are enjoying themselves.
      *   *Case:* If a theory tells a sane human they are not experiencing pleasure when they report they are, it loses its connection to welfare *as experienced*.
  6.  **Normative Independence:** Must define pleasure without reducing it to "whatever is desired" or "whatever is pursued."
      *   *Case:* If pleasure is just "what is wanted," you cannot critique mistaken desires or explain why satisfying a malicious desire isn't welfare-enhancing.

  ### The Knockout Requirement

  **Phenomenal Unity (a Common Phenomenal Ingredient).**
  This eliminates the most candidates because it forces a strict feeling-theory. It immediately disqualifies Attitude-Based theories (which say pleasure is wanting a sensation to continue), Dispositional theories (which say pleasure is a tendency to choose), and Pluralist theories (which deny a common core). It leaves only "Feeling" theories, which then struggle to find the specific "tingle" common to sex and solving equations.

  ### The Bind: Is Your Tetrad Unsatisfiable?

  You are right: **(a) First-Person Authority, (b) Common Phenomenal Ingredient, (c) Third-Person Checkability, and (d) Non-Desire Definition** form an impossible tetrad.

  The fatal tension is between **(b)** and **(c)**. If pleasure is a specific, private phenomenal ingredient (b), it is inherently opaque to third-person observation, making robust cross-species checkability (c) impossible without inferring from behavior (which collapses into Dispositional/Desire accounts, violating d). If you make it checkable (c) via behavior/physiology, you lose the guarantee that you are measuring the *phenomenal* ingredient (b) rather than mere reinforcement. To solve this, you must drop one: drop (b) to save measurement (Attitude/Dispositional views), or drop (c) to save the feeling (Solipsistic/Subjective views, useless for your tool).

  ### Theory Family Performance

  *   **Common Felt Quality:** Preserves first-person authority and the "feeling" core but fails cross-species checkability and struggles to find the universal ingredient.
  *   **Attitude-Based:** Solves heterogeneity and allows cross-species inference but sacrifices the common phenomenal ingredient and sometimes overrides first-person authority.
  *   **Dispositional:** Excellent for cross-species checkability and normative independence but completely abandons first-person authority and the phenomenal ingredient.
  *   **Family-Resemblance Pluralism:** Respects heterogeneity and first-person authority but sacrifices the common ingredient, making quantitative welfare calculation mathematically suspect.
