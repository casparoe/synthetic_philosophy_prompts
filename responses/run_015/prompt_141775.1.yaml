      If "explain" means "show how it is consistent with rationality," then Transparency *does* explain cooperation (whereas Standard PD explains its impossibility).
      I need to persuade the student that the latter definition is the standard one in social science.

      *Plan:*
      1. Validate: You are right to doubt (7).
      2. Diagnose: The error is in (5) ("equal ease") and the definition of explanation in (7).
      3. Detail: Symmetry and Complexity make CC easier than Ratchet.
