answer: |-
  **Setup**
  16 students. 8 "Load" (memorize 7-digit code while working), 8 "Clear" (no code). Secret assignment.
  **Task:** Estimate dot count on card (shown 10s, range 50–150).
  **Materials:** Index cards (dots), envelopes (codes), score sheets. One confederate to collect sheets.

  **Rules**
  1.  **Round 1 (Baseline):** View card. Submit **Estimate** (integer) + **Confidence** (0–100%). No HOE yet.
  2.  **HOE Reveal:** Announce: "Half of you had a memory load impairing counting. You don't know who."
  3.  **Rounds 2 & 3 (HOE Active):** Submit Estimate + Confidence. Optional **Re-open**: Pay points to view card again (5s).
      *   Round 2 Fee: 50 Accuracy Points (Expensive).
      *   Round 3 Fee: 5 Accuracy Points (Cheap).
  4.  **Scoring:** Two separate pools. No exchange rate.
      *   **Accuracy Pool:** 100 – |Estimate – Actual|. Minus Re-open fees.
      *   **Calibration Pool:** Proper scoring rule (max points when Confidence% = Accuracy%). High confidence requires high accuracy to score.

  **Payoff Scheme**
  | Strategy | Round 2 (High Fee) | Round 3 (Low Fee) |
  | :--- | :--- | :--- |
  | **Re-open** | Accuracy saved, Pool drained | Accuracy saved, Pool intact |
  | **Fold** (Adjust estimate) | Risk Accuracy loss | Risk Accuracy loss |
  | **Bracket** (Low Confidence) | Saves Calibration | Saves Calibration |
  | **Stubborn** (High Confidence) | Risks Calibration | Risks Calibration |
  *Note:* Impaired students often must submit an estimate (Action) but mark Low Confidence (Meta) to maximize total score. This creates strategic akrasia.

  **Timeline (75 mins)**
  *   **0–5:** Distribute cards/codes. No explanation of groups.
  *   **5–20:** Round 1 + HOE Reveal.
  *   **20–35:** Round 2 (High Fee). Collect scores.
  *   **35–50:** Round 3 (Low Fee). Collect scores.
  *   **50–75:** Debrief.

  **Debrief**
  1.  **Map Routes:** **Re-open** = Paying fee. **Fold** = Changing estimate toward group mean after HOE. **Bracket** = Low confidence despite submission.
  2.  **Calibration vs. Akrasia:** Compare Round 2 scores. Impaired students likely lost Accuracy points but saved Calibration by lowering confidence. They acted on beliefs they marked untrustworthy (submitted estimate + low confidence). This is the akratic bind.
  3.  **Rationality vs. Luck:** Round 3 shows the bind dissolves when Re-open is cheap. Akrasia wasn't irrationality; it was resource scarcity. The "inescapable" cases are just high-fee rounds. Ask: "Is the subject irrational, or just priced out of evidence?"

  **Predictable Failures & Fixes**
  *   **Blind Folding:** Everyone adjusts estimates immediately after HOE. *Fix:* Emphasize HOE is probabilistic (50% chance you're Clear). Blind folding loses Accuracy points.
  *   **Performing Torn Feelings:** Students claim confusion to sound philosophical. *Fix:* Ignore verbal reports. Focus debrief strictly on score sheets. The points prove the tension.
  *   **Collusion:** Students share codes. *Fix:* Confiscate phones; separate seating.

  **Limitations**
  *   **Belief vs. Action:** Game points aren't genuine belief. You cannot force genuine akrasia, only strategic analogues.
  *   **Hidden Costs:** You must explicitly state: "In real life, the 'fee' is time/energy/cognitive load, not points. The game makes the cost visible; life hides it. The philosophical problem persists because we rarely see the price tag on re-opening."
