answer: |-
  This is a sharp brief. You are right to stop reading the literature at random; the theorems tell you what is *possible* under specific axioms, but they don't tell you which axioms survive contact with a public mandate.

  Below is the specification you asked for. I have evaluated your existing list, added the missing critical constraints, flagged the impossibility results, and provided the scorecard.

  ### Part 1: The Desiderata List

  I have grouped these into **Non-Negotiables** (the tool breaks without them) and **Design Choices** (where camps diverge). I have also annotated your original points.

  #### A. Non-Negotiables (The "Must-Haves")

  **1. Interpersonal Comparability (Breaking Scale Invariance)**
  *   **The Case:** You cannot rank flood defences vs. vaccination without a common unit of account. If Person A's utility is measured in "hedons" and Person B's in "dollars," summing them is nonsense. Full invariance to rescaling (ordinalism) makes aggregation impossible unless you accept a dictatorship.
  *   **Your Point:** You flagged *Invariance to rescaling vs. sensitivity*.
  *   **Verdict:** **Drop full invariance.** You must assume *Cardinal Unit Comparability* (CUC). You need a protocol to normalize utilities (e.g., 0 = death/destitute, 1 = flourishing) across individuals. This is not a prejudice; it is a functional requirement for trade-offs.
  *   **Defensibility:** "We cannot decide if saving a life is worth building a levee unless we can compare the value of a life to the value of a dry basement in a common metric."

  **2. Sovereignty of Self-Regarding Interests (Laundering Preferences)**
  *   **The Case:** This addresses your *No double counting* point. If Citizen A supports the flood defence because it helps them, and Citizen B supports it because they are altruistic towards A, counting both utilities double-counts A's benefit.
  *   **Verdict:** **Non-negotiable.** The aggregation rule must operate on *self-regarding* well-being only. Altruistic or moralistic preferences are inputs to the *weights* or *constraints*, not the utility sum.
  *   **Defensibility:** "We measure how this policy affects *your* life, not how much you care about your neighbour's life. Your care for them is a virtue, not a unit of social welfare."

  **3. Description Invariance (Splitting Invariance)**
  *   **The Case:** You flagged *Splitting invariance*. This is technically "State-wise Dominance." If you describe a 10% flood risk as one event, or as two 5% events with identical outcomes, the ranking must not change.
  *   **Verdict:** **Non-negotiable.** If you drop this, your tool is manipulable by how analysts frame the uncertainty.
  *   **The Cost:** You are correct that this kills *Ex-Post* equity concerns that depend on the correlation of outcomes across states. If you keep this, you are committed to an *Ex-Ante* perspective (evaluating prospects before the dice roll).
  *   **Defensibility:** "The value of a policy cannot depend on how finely we slice the map of possible futures."

  **4. Estimability (Measurement Feasibility)**
  *   **The Case:** You flagged *Estimability*.
  *   **Verdict:** **Non-negotiable.** This is not cheating. A theory requiring full interpersonal utility comparisons derived from revealed preference is useless for a one-off infrastructure project. You need a metric recoverable from survey data, health outcomes, or income proxies within a budget.
  *   **Defensibility:** "If we cannot measure it within the fiscal year, it cannot be a criterion for this fiscal year's budget."

  #### B. Design Choices (Where You Must Pick a Side)

  **5. Ex-Ante Respect vs. Ex-Post Equity**
  *   **The Case:** This is the hardest trade-off.
      *   *Ex-Ante:* Respect individual risk attitudes. If people are risk-seeking, the social rule should be risk-seeking.
      *   *Ex-Post:* Care about the realized distribution. Even if everyone accepts a risk, if the "bad luck" falls entirely on the poor, the state may want to intervene.
  *   **Your Point:** You noted splitting invariance kills rules that care about "who ends up badly off."
  *   **Verdict:** **Design Choice.** For a public body, *Ex-Post Equity* usually wins. Citizens are often bad at assessing low-probability catastrophic risk (floods). The state has a mandate to prevent destitution regardless of individual risk tolerance.
  *   **Cost:** Violates *Ex-Ante Pareto*. You may override a consensus that "this risky gamble is fine" because the downside is too socially costly.

  **6. Objective vs. Subjective Probabilities**
  *   **The Case:** You flagged *Disagreement about probabilities*.
  *   **Verdict:** **Use Objective/Expert Probabilities.** Respecting subjective beliefs (Pareto for Beliefs) leads to "Spurious Unanimity" (Mongin's Theorem). If everyone agrees a bridge is safe, but half think so because they don't understand physics and half because they trust the engineer, respecting that agreement is dangerous.
  *   **Cost:** Paternalism. You are telling citizens their risk assessment is wrong.
  *   **Defensibility:** "We use the best available science for flood risk, not the public's perception of flood risk."

  **7. Dynamic Consistency**
  *   **The Case:** You flagged *Stability over time*.
  *   **Verdict:** **High Priority.** If the body re-evaluates the project in Year 2, it shouldn't reverse the Year 1 decision without new information. Inconsistency looks like corruption or incompetence.
  *   **Cost:** May require locking in a specific discount rate or updating rule that feels rigid.

  **8. Population Neutrality (Variable Population)**
  *   **The Case:** You flagged *Variable population*.
  *   **Verdict:** **Low Priority for Regional Bodies.** Unless the housing policy drastically changes birth rates or migration, the population is effectively fixed. Don't let the "Repugnant Conclusion" (Total Utilitarianism) haunt you if you are ranking projects for an existing constituency.
  *   **Recommendation:** Treat population as fixed. Use Average or Weighted Sum, not Total.

  ---

  ### Part 2: The Incompatibilities (The "Hard Truths")

  You asked for pairs that cannot be jointly satisfied. There is one major impossibility result that defines your design space.

  **The Diamond/Epstein-Peters Impossibility:**
  You cannot simultaneously satisfy:
  1.  **Ex-Ante Pareto:** If everyone prefers Prospect A to Prospect B, Society prefers A to B.
  2.  **Ex-Post Equity:** Society cares about the equality of the *realized* outcomes (e.g., prefers a sure equal split to a lottery where one person gets everything, even if expected utility is identical).
  3.  **Description Invariance:** (Your Splitting Invariance).

  **The Verdict:**
  For a public investment body, **drop Ex-Ante Pareto.**
  *   **Why:** Individuals have heterogeneous and often irrational risk attitudes regarding public goods. A wealthy person might be willing to gamble on flood defences; a poor person cannot afford the loss. Respecting the aggregate risk preference might expose the vulnerable to ruin.
  *   **The Cost:** You must defend why you are overriding individual risk preferences. The defense is "paternalism regarding catastrophic risk."
  *   **Alternative:** If you keep Ex-Ante Pareto, you must accept that your tool cannot penalize a policy simply because it concentrates all the bad luck on one person, provided everyone agreed to the risk ex-ante. This is politically toxic for a public body.

  **Secondary Conflict: Beliefs vs. Preferences**
  You cannot respect everyone's subjective probabilities *and* avoid Spurious Unanimity (where agreement arises from cancelling errors).
  *   **The Verdict:** Use **Objective Probabilities** (expert models) for the uncertainty, and aggregate only over *utilities* (outcomes).

  ---

  ### Part 3: The "Killer" Requirement

  **Interpersonal Comparability (breaking Scale Invariance).**

  This is the single requirement that knocks out the most candidate rules.
  *   **Why:** Most social choice theory (Arrow, etc.) assumes ordinal, non-comparable utilities to be "safe." If you demand this, you get impossibility theorems or dictatorship.
  *   **The Work It Does:** It forces you to choose a metric (QALYs, SWB, Money-Metric). Once you choose a metric, you immediately rule out any rule that claims to be "value-free." It forces you to own the measurement assumption.
  *   **Defensibility:** It is the only way to make trade-offs. "We cannot trade 100 people's mild inconvenience against 1 person's death without assuming we can compare the two."

  ---

  ### Part 4: Scorecard of Contenders

  Here is how the main rules perform against your **Non-Negotiables** (Comparability, Laundering, Description Invariance, Estimability) and the **Design Choice** (Ex-Post Equity).

  | Rule | Estimability | Ex-Post Equity | Ex-Ante Respect | Defensibility to Public | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Weighted Utilitarian Sum** | High (needs only means) | Low (ignores distribution) | High | Medium ("Cold calculus") | **Baseline.** Easy to code, hard to defend if inequality spikes. |
  | **Ex-Post Prioritarianism** | Medium (needs distribution data) | **High** (weights the worse-off) | Low (violates Ex-Ante Pareto) | **High** ("Protecting the vulnerable") | **Recommended.** Fits public mandate best. |
  | **Maximin (Rawlsian)** | Low (needs worst-case ID) | Very High | Very Low | Medium ("Why ignore the majority?") | **Too brittle.** One outlier dictates the budget. |
  | **Veil of Ignorance** | Low (hypothetical consent) | Medium (depends on risk aversion) | Medium | High ("Fairness") | **Operationally vague.** Whose risk aversion behind the veil? |

  ### Final Recommendation for the Spec

  1.  **Metric:** Adopt a cardinal, interpersonally comparable metric (e.g., money-metric utility or well-being scores). Explicitly document the normalization protocol.
  2.  **Aggregation:** Use **Ex-Post Prioritarianism**. Calculate the social welfare of each *state of the world* (applying a concave transformation to individual utilities to weight the worse-off more heavily), then take the Expected Value over states using **Objective Probabilities**.
  3.  **Inputs:** Launder preferences to self-regarding well-being. Use expert models for probabilities.
  4.  **Drop:** Ex-Ante Pareto (respect for individual risk attitudes) and Subjective Probabilities.

  **The Pitch to Stakeholders:**
  "We do not simply add up benefits. We weigh benefits to the vulnerable more heavily than benefits to the secure, and we evaluate policies based on scientific risk assessments rather than public perception. This ensures that public investment protects those least able to absorb loss."
