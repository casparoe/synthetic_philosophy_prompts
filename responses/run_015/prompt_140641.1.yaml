prompt: |-
  ok so I need to stop reading the Harsanyi aggregation literature at random and get a spec first. Here's the use case: I'm on a small team putting together a decision-support tool for a regional public-investment body — the kind of thing that has to rank flood defences vs vaccination campaigns vs subsidised housing, where the benefits are spread over a couple of million people and most of the action is in the uncertainty (flood probabilities, take-up rates, long-run effects nobody can measure well). Whatever rule for combining individual utilities into a social ranking we put in the code has to be defensible to people who will never read a paper.

  What I want from you is the desiderata, not a restatement of the theorem: what a rule for turning many individuals' cardinal utility functions — and maybe their beliefs — into one social ranking has to get right, the case or consideration behind each requirement, and your view on which are non-negotiable and which are just what one camp happens to like. Please don't just hand back the axioms of the aggregation theorem dressed up as a list.

  Things I already think are on the list, with the cases behind them — add your own, and tell me if any of mine are junk or duplicates:

  - Splitting invariance. Divide a state of the world into two states with identical utility consequences and probabilites summing to the original, and the social ranking shouldn't move. Is that a real requirement or just expected-utility independence smuggled in as a fairness constraint? It looks like it kills any rule that cares about who ends up badly off once the uncertainty resolves, which is most of what practitioners say they want.
  - No double counting. Real preferences have moral and other-regarding bits in them: everyone prefers the flood defence go to the poorer valley because they think that's fairer. Add those up and the fairness concern seems to get counted once per person, while a concern nobody else shares gets counted once. What should a rule do with preferences that are already partly social — launder them somehow, or take them as given?
  - Invariance to rescaling versus sensitivity to interpersonal comparisons. Each person's utility is only fixed up to positive affine transformation, so anything that turns on an arbitrary normalisation is out. But full invariance looks like it makes real comparability impossible and lands you near dictatorship or near social indifference. Which way does this cut, and is demanding a common unit of well-being a genuine requirement or a prejudice of the welfarist camp?
  - Disagreement about probabilities. Our experts and our citizens don't share a credence over flood risk. Whose probabilities does the rule use, or does it manage not to take a stand? Ive seen claims that respecting everyone's ex ante preferences here forces something pretty unwelcome — say what that is and whether it's avoidable or just a cost to be paid.
  - Graceful degradation on non-ideal inputs. What we actually get is not vNM-rational: people violate independence in Allais-ish ways, some are intransitive, future people and corporate actors don't have a well-defined utility function at all. A rule that only runs on clean inputs is useless to me, so I'd put robustness to messy and partial input on the list — unless you think that's asking for something no rule could deliver, in which case say so and tell me what the honest fallback is.
  - Variable population and near-duplicates. People barely affected by the decision, or two people with identical prospects and identical utility functions: does the rule average or total, and what does it say about adding lives that are barely worth living? How much weight does this requirement carry compared to the others, given the decisions we're actually making?
  - Stability over time. The body decides every year, and sometimes re-decides. If it aggregates and then updates versus updates and then aggregates, do we get reversed rankings or something money-pumpable? That's on my list only if it genuinely bites.
  - Estimability. Can it be run on quantities a public body could actually estimate in a few months, or does it need full interpersonal comparisons nobody can measure? I count implementability as a real desideratum — tell me if that's cheating, i.e. if it's a constraint on us rather than a requirement on the theory.

  Two more things, and they're the parts I most want. First: flag any pair of requirements that can't be jointly satisfied, and if the whole list turns out to be unsatisfiable as a package, tell me which requirement you'd drop first and what dropping it costs — that's a result, not a failure. Second: which single requirement does the most work in knocking out candidate rules? A short scorecard at the end for the main contenders (weighted or average utilitarian sums, ex-post prioritarian views, maximin, and the simulate-a-chooser-behind-a-veil-of-ignorance approach) is welcome, but keep it short — the list and the reasoning behind it are the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A member of a small team building a decision-support tool for a regional public-investment body.
      *   **Context:** Ranking public investments (flood defences, vaccination, housing) affecting millions, high uncertainty, benefits/costs spread out.
      *   **Audience for the Tool:** People who will *never read a paper* (politicians, public, stakeholders). Defensibility is key.
      *   **Task:** Provide a list of *desiderata* (requirements) for a social welfare aggregation rule.
      *   **Constraints:**
          *   Do *not* just restate axioms of aggregation theorems (e.g., Harsanyi, Arrow) dressed up.
          *   Focus on the *case/consideration* behind each requirement.
          *   Distinguish between non-negotiables and camp-specific preferences.
          *   Evaluate the user's existing list (Splitting invariance, No double counting, Rescaling, Probabilities, Robustness, Population, Stability, Estimability).
          *   Identify incompatibilities (impossibility results).
          *   Recommend which to drop if the list is unsatisfiable.
          *   Identify the "killer" requirement.
          *   Provide a short scorecard for main contenders (Utilitarianism, Prioritarianism, Maximin, Veil of Ignorance).
      *   **Tone:** Pragmatic, technical but accessible, honest about trade-offs, no fluff.

  2.  **Evaluate the User's Existing List:**
      *   *Splitting Invariance:* This is essentially State-wise Dominance or Eventwise Monotonicity wrapped in uncertainty. The user is right to be suspicious. It *does* kill ex-post equity concerns (like caring about the *realized* distribution of welfare, not just expected). *Verdict:* Keep as a consideration, but flag the tension with ex-post fairness.
      *   *No Double Counting:* This is the "Sympathy/Interdependent Preferences" problem. If A cares about B, do we count A's utility *and* B's utility? Standard welfarism says "launder" to self-regarding preferences. *Verdict:* Crucial for defensibility.
      *   *Invariance vs. Comparability:* This is the Measurement/Level Comparability issue. Full invariance = ordinal non-comparable (Arrow). Breaking it = Cardinal Unit Comparability (CUC) or similar. *Verdict:* Non-negotiable to break full invariance if you want to weigh trade-offs, but requires a measurement protocol.
      *   *Disagreement about Probabilities:* The "Pareto for Beliefs" vs. "Spurious unanimity" problem. If everyone agrees on an outcome for different reasons, do we respect it? *Verdict:* High priority for public bodies (expert vs. public risk).
      *   *Graceful Degradation:* Robustness to irrationality. *Verdict:* Practical necessity, though theoretically messy.
      *   *Variable Population:* The "Repugnant Conclusion" vs. "Mere Addition" paradox. *Verdict:* Less critical for *fixed* regional populations (mostly), but relevant for long-run housing/health.
      *   *Stability:* Dynamic consistency. *Verdict:* Important for institutional credibility.
      *   *Estimability:* Implementation constraint. *Verdict:* Not "cheating." If you can't measure it, it's not a valid metric for *this* tool.

  3.  **Drafting the Desiderata (Iterative Process):**
      *   *Goal:* Translate technical axioms into public-administration language.
      *   *Requirement 1: Transparency of Trade-offs (The "Why").* Needs to explain *why* we chose X over Y.
      *   *Requirement 2: Ex-Ante vs. Ex-Post Fairness.* This is the big one the user hinted at with "Splitting Invariance." Public bodies care about *realized* inequality, not just expected utility.
      *   *Requirement 3: Sovereignty of Self-Regarding Interests.* Addressing the "Double Counting" issue.
      *   *Requirement 4: Measurement Feasibility.* Addressing "Estimability" and "Rescaling."
      *   *Requirement 5: Dynamic Consistency.* Addressing "Stability."
      *   *Requirement 6: Risk Sensitivity.* Addressing "Probabilities."

  4.  **Identifying Incompatibilities (The "Hard Truths"):**
      *   *The Big Conflict:* Ex-Ante Pareto (respecting individual risk preferences) vs. Ex-Post Equity (caring about the final distribution of welfare). This is the Diamond/Epstein/Peters impossibility.
      *   *The Measurement Conflict:* Full Anonymity/Neutrality vs. Interpersonal Comparability. You can't have scale invariance *and* make trade-offs without a common unit.
      *   *The Belief Conflict:* Respect individual probabilities vs. avoid Spurious Unanimity (Mongin).

  5.  **Selecting the "Drop First" Candidate:**
      *   For a public investment body, *Ex-Ante Pareto* (respecting individual risk attitudes exactly) is usually the first thing to go. Why? Because individuals are often bad at assessing low-probability high-impact risks (floods), and the state has a mandate to protect the vulnerable regardless of their risk tolerance.
      *   *Alternative:* Drop "Full Invariance to Rescaling." You *must* assume some comparability to function.

  6.  **Identifying the "Killer" Requirement:**
      *   *Interpersonal Comparability (breaking scale invariance).* Without this, you literally cannot sum or compare utilities across people. It forces you into a specific measurement framework (e.g., SWB, capability, money-metric).

  7.  **Scoring the Contenders:**
      *   *Utilitarian Sum:* Good on Pareto, bad on inequality, needs comparability.
      *   *Prioritarianism:* Good on inequality, bad on Ex-Ante Pareto (sometimes), needs comparability.
      *   *Maximin:* Good on worst-off, bad on efficiency/sums, ignores probabilities often.
      *   *Veil of Ignorance:* Conceptually strong, operationally vague (which risk attitude behind the veil?).

  8.  **Refining the Tone:**
      *   Avoid academic jargon where possible (e.g., instead of "Pareto Indifference," use "No Dead Weight").
      *   Be direct about the "Splitting Invariance" point—the user is right to be worried.
      *   Ensure the "Double Counting" advice is practical (launder preferences).

  9.  **Final Review against Constraints:**
      *   Did I restate Harsanyi? No, focused on desiderata.
      *   Did I address the user's list? Yes, validated/corrected it.
      *   Did I flag incompatibilities? Yes (Ex-Ante vs. Ex-Post).
      *   Did I provide a scorecard? Yes.
      *   Is it defensible to non-readers? The language is aimed at that.

  10. **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure to explicitly address the "Splitting Invariance" point early. It's the crux of the Ex-Ante/Ex-Post debate.
      *   *Correction:* On "Double Counting," be clear: standard practice is to use *self-regarding* utilities for aggregation, treating other-regarding preferences as externalities or moral inputs, not utility inputs.
      *   *Correction:* On "Estimability," validate it. It's not cheating; it's a boundary condition for applied ethics.

  11. **Final Polish:** Check the "Drop First" recommendation. For a *public investment body*, Ex-Ante Pareto is the most dangerous to keep because it binds the state to individual irrationalities regarding risk. I will recommend relaxing Ex-Ante Pareto in favor of Ex-Post Equity + Objective Probabilities.

  **(Self-Correction on "Splitting Invariance"):** The user asks if it's a real requirement or EU smuggled in. It's essentially "State-wise Dominance." If you reject it, you allow the *description* of uncertainty to change the outcome. That's bad for defensibility. But keeping it kills Ex-Post equity. I need to explain this tension clearly.

  **(Self-Correction on "Double Counting"):** This is the "Interdependent Utilities" problem. The standard solution is "laundering." I should recommend that.

  **(Self-Correction on "Probabilities"):** The "Spurious Unanimity" result (Mongin) is key here. If everyone agrees for different reasons, respecting that leads to dictatorship. I need to mention this.

