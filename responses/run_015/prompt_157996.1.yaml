  Regarding your framing: You suspect some of this is verbal. I agree. "Conscious" often means "Access" for GWT and "Report/Attention" for MDM. However, the *temporal indeterminacy* claim is substantive. I will highlight this distinction in the final analysis.

  **Plan for the Document:**
