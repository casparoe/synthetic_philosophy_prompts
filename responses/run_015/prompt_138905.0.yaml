      *   *The Case:* A man saves his wife from drowning rather than a stranger. He might justify it by saying "she was my wife." Williams says if he adds, "...and in this situation it is permissible to save one's wife," he has had "one thought too many."
      *   *The Point:* It's about integrity, ground projects, and the alienation caused by the "Morality System" (which demands impartial justification for all actions). It attacks the idea that moral obligation must always be the overriding justification.
