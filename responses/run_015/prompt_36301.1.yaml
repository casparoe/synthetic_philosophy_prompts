      *   *Refining the "Misleading" definition:* In the car case, the user said "No accident while I owned it." This is verifiable truth. The buyer inferred "No accident ever." This is a *off-equilibrium* inference if we assume full disclosure norms, or an *on-equilibrium* inference if vague talk is standard.
