      *   *Crucial Econ Insight:* In equilibrium, $R$ knows $S$'s strategy. If $R$ is misled in equilibrium, $R$ is *not* actually misled about the strategy, only the type. But if $R$ infers "No Accident" from "No Accident While Owned," and $S$ knows this, $S$ is pooling with the "Never Accident" type.
