      *   *Refinement:* Need to distinguish *Hard Information* (Disclosure/Unravelling) vs. *Soft Information* (Cheap Talk).
          *   *Lying:* In a disclosure model (Grossman-Milgrom), the message space is subsets of $\Theta$. Sending $m$ implies $\theta \in m$. If $\theta \notin m$, that's a lie. It's usually assumed impossible or infinitely costly in standard disclosure models. So, to model lying, we need a "costly lying" model (e.g., Kartik 2009).
          *   *Misleading:* In cheap talk (Crawford-Sobel), messages are costless. $S$ sends $m$ consistent with $\theta$ (literally true), but the *equilibrium mapping* $\mu(m)$ leads $R$ to believe $\theta \in \Theta_{good}$ when actually $\theta \in \Theta_{bad}$.
      *   *The Philosophical Distinction in Econ Terms:*
          *   *Lying:* Violating a *message constraint*. Sending $m$ where the cost function $c(m, \theta) = \infty$ (or very high) for the true $\theta$.
          *   *Misleading:* Satisfying message constraints ($c(m, \theta) = 0$) but exploiting the *equilibrium inference function* $\beta(m)$. The literal content is $\theta \in \text{Support}(m)$, but the posterior $\mathbb{E}[\theta|m]$ is biased.
      *   *Moral Claim 1 (Principled Difference):* Lying breaks the *feasibility set* of the communication technology. Misleading operates *within* the feasibility set but manipulates the *mapping* from message to belief.
      *   *Moral Claim 2 (No Difference):* Both result in $\mathbb{E}[\theta|m_{sent}] \neq \mathbb{E}[\theta|\theta_{true}]$. Both satisfy the Sender's IC constraint to deceive. The only parameter difference is the cost function $c(m, \theta)$.

