answer: |-
  This is a remarkably coherent position. You have essentially reconstructed the standard "Physicalist Eternalist" view held by a large chunk of the philosophy of physics community (think Reichenbach, Putnam, Sider, or Saunders). Your nagging feeling is well-placed, but it stems less from a logical contradiction and more from the friction between *physical* descriptions and *phenomenological* intuitions.

  You suspected the tension lies between (4) and (7). I disagree. I think (4) and (7) are actually the most stable parts of your framework individually. The real friction is between **(1) and (4)**, and a secondary, subtler tension between **(1) and (7)**.

  Here is the pair-by-pair breakdown, ranked by severity of conflict.

  ### 1. The Major Clash: (1) Block Universe vs. (4) Open Future
  **Severity:** High.
  **The Conflict:** This is the classic "Eternalism vs. Indeterminism" problem. In (1), you assert the future is "equally real" as the past. In (4), you assert the future is "open" in an ontological sense (not just epistemic). If the future events *already exist* in the block manifold, in what sense are they not fixed?
  **Why it feels okay:** You are likely relying on the distinction between *determinism* and *eternalism*. A block universe can contain stochastic events. The block doesn't have to be a clockwork mechanism; it can be a "stochastic block" where the metric and matter fields include irreducible probabilities.
  **The Repair:** You must reinterpret "open." In a block, "openness" cannot mean *ontological indeterminacy* (i.e., that the future literally does not exist yet). It must mean *causal indeterminacy* relative to past slices.
  **The Cost:** You lose the intuitive punch of (4). Deliberation is still "worth doing" because your deliberation is a causal node in the block that determines which branch of the probability distribution is realized *in the block*. But the "truthmaker" for future contingent statements already exists. You have to accept that "The future is open" is a statement about the *relationship between time slices*, not a statement about *existence*.

  ### 2. The Subtle Clash: (1) SR Relativity vs. (7) Cosmic Time
  **Severity:** Medium.
  **The Conflict:** In (1), you argue there is "no non-arbitrary way to carve out a present" based on Special Relativity (SR). In (7), you admit the CMB provides a "genuinely distinguished slicing." If there is a physically distinguished slicing, doesn't that undermine the Rietdijk–Putnam argument that led you to (1)?
  **Why it looks worse than it is:** This is a confusion between *laws* and *boundary conditions*. SR says the *laws* are Lorentz invariant (no frame is privileged by the laws). Cosmology says the *matter distribution* in our specific universe breaks that symmetry. The CMB frame is privileged *contingently*, not *metaphysically*.
  **The Repair:** Clarify (7). The CMB frame is a "preferred frame" in the sense of a convenient coordinate system for cosmology, not a restoration of Absolute Time. An alien moving at 0.9c relative to the CMB is not "wrong" about simultaneity; they are just using a different foliation of the same manifold.
  **The Cost:** You must concede that (7) does not rescue Presentism. You cannot use the CMB frame to say "events in the CMB present are *real* and others are not." It just means "events on this slice are *cosmologically simultaneous*." This preserves (1) but weakens the rhetorical force of (7).

  ### 3. The Minor Clash: (4) Indeterminism vs. (6) Compatibilism
  **Severity:** Low.
  **The Conflict:** If QM is indeterministic (4), and the block contains the outcome (6), does the block contain *all possible outcomes* (Many Worlds) or just *one* (Collapse)? If just one, how was it indeterministic?
  **The Repair:** Adopt a "Pruning Block" or simply accept that probabilities are intrinsic properties of the world-lines in the block. The block contains the fact that "Event X had a 50% chance and occurred."
  **The Cost:** Minimal. This is mostly an interpretation-of-QM issue, not a time issue.

  ### 4. The Non-Clash: (2) Andromeda vs. (7) CMB
  **Severity:** Negligible.
  **The Conflict:** You might worry that if CMB time is "real" (7), then the Andromeda paradox (2) is resolved by checking the CMB frame.
  **The Resolution:** It isn't. The Andromeda paradox arises for local inertial observers. Unless those observers are stationary relative to the Hubble flow (which we aren't perfectly), their personal "now" slices still tilt relative to the CMB slice. There is still no fact of the matter for *them* without referencing the CMB frame specifically. Since you treat the CMB frame as physical, not metaphysical, (2) stands.

  ---

  ### Ranking the Real Conflicts
  1.  **(1) vs. (4):** The ontological status of the future. (Hardest to reconcile).
  2.  **(1) vs. (7):** The status of the "privileged" frame. (Easiest to reconcile with a distinction between laws and solutions).

  ### The Cheapest Repairs

  **For (1) vs. (4): The "Stochastic Block" Repair**
  *   **Fix:** Keep the Block. Redefine "Open Future" to mean "Not determined by the past slice," rather than "Not existent."
  *   **Cost:** You must abandon the idea that the future is *ontologically* different from the past. It is only *causally* inaccessible. This might feel like it drains the meaning from "deliberation," but compatibilism (6) saves you here.
  *   **Difficulty:** High psychological cost, low logical cost.

  **For (1) vs. (7): The "Contingent Privilege" Repair**
  *   **Fix:** Explicitly state that the CMB frame is a *feature of the solution*, not the *equations*. It picks out a slicing, but not *The* Slicing.
  *   **Cost:** You have to admit that "13.8 billion years old" is a coordinate-dependent statement (albeit a very useful one), not an absolute metaphysical age.
  *   **Difficulty:** Low. This is standard GR practice.

  ### Which Single Revision Tidies Up the Most?
  **Revise (4).**
  Your worry was around (4) and (7), but (7) is physically robust. (4) is the metaphysical outlier. If you soften (4) from "The future is ontologically open" to "The future is causally undetermined by the past," the entire system locks into place. You keep the Block (1), you keep the Physics (7), and you keep Agency (6). You just lose the poetic idea that the future "doesn't exist yet."

  ### Which Commitment Should You Drop?
  If I were forced to choose one to drop to maximize consistency: **Drop the strong reading of (4).**

  Here is why: As a physicist, (1) is forced on you by the structure of Minkowski spacetime (and GR). (7) is forced on you by observational cosmology. (6) is a standard philosophical position compatible with physics. (4), as you phrase it ("something stronger than 'I don't happen to know it yet'"), is a metaphysical claim that has no empirical signature.

  There is no experiment you can do to distinguish between a "Block with an open future" and a "Block with a fixed future." The "Openness" is a modal category, not a physical one. By insisting on a strong ontological openness, you are smuggling in a "Moving Spotlight" intuition (which you rejected in 3) without the spotlight.

  **The Verdict:**
  Your package is 90% consistent. The 10% inconsistency is the tension between **Eternalism (1)** and **Ontological Openness (4)**.
  *   **Keep:** 1, 2, 3, 5, 6, 7.
  *   **Modify:** 4. Change "The future is open" to "The future is probabilistic."
  *   **Drop:** The idea that "openness" implies non-existence.

  You are effectively a **Humean Supervenient Eternalist**. The block exists, the laws (including QM probabilities) supervene on the arrangement of qualities in the block, and the "flow" is a feature of conscious access to that block, not the block itself. That is a very stable place to stand.
