      *   **Address the Geometry/Natural Philosophy Contrast:** Does it collapse? No. In natural philosophy (physics), we observe effects and guess causes (conjectural). In geometry/civil philosophy, we posit causes and derive effects (demonstrative). Both deal with the world (matter in motion), but the *direction of inference* differs.

