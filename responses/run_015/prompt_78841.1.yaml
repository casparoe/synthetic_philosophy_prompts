      *   *Why Hobbes rejects it:* Hobbes doesn't have the analytic/synthetic distinction in the Kantian sense. For him, truth is the "right ordering of names in our affirmations." But because names refer to bodies and motions, correct reasoning about names *is* correct reasoning about bodies. The "stipulation" isn't arbitrary; it's a stipulation of *causes* (motions) that we generate. Since we generate them, we know the cause perfectly. Since the cause is material motion, the knowledge is of the world.
