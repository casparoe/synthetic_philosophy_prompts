answer: |-
  This is a sharp observation. That slogan functions as a conversation stopper because it conflates *ontology* (what moral claims are) with *sociology* (how people use moral language). In rationalist spaces, where precision is valued, using a slogan this slippery usually signals that someone is trying to protect a terminal value from being scrutinized as an instrumental error.

  Here is a menu of five distinct theses that slogan might be encoding. I've evaluated each on whether it's a platitude, whether it's defensible, and whether it successfully blocks evolutionary debunking or reduces morality to taste.

  ### 1. The Transparency Thesis (Bias = Unowned Preference)
  **The Claim:** There is no ontological difference between a bias and a preference. The difference is purely introspective. A "preference" is a value you acknowledge and endorse. A "bias" is a value you are acting on but denying, usually because it conflicts with your stated principles. The "worse marketing" is the lie you tell yourself about why you hold the view.

  *   **Platitude or Defensible?** Defensible, but narrow. It turns an epistemic claim into a psychological one. It doesn't say the preference is wrong, just that you are being dishonest about it.
  *   **Does it do the work?**
      *   *Against Debunking:* No. It sidesteps debunking. It says, "Whether evolution gave you this doesn't matter; what matters is if you admit it."
      *   *Against EA Laundering:* Yes. It suggests EAs might be hiding terminal values (e.g., "I like saving strangers") behind instrumental frameworks ("Utilitarianism is objectively true") to avoid admitting they are just pursuing a specific taste.
  *   **Rationalist Prevalence:** **High.** This aligns with the community's obsession with "propaganda," "signaling," and "honesty." It treats the slogan as a call for better introspection, not a meta-ethical claim.

  ### 2. The Global Skeptic Thesis (Indistinguishability)
  **The Claim:** We cannot distinguish between cognitive faculties that track truth and cognitive faculties that track fitness. If evolution shaped your logic and math (to help you hunt/gather), it also shaped your morality. Therefore, calling morality "biased" and logic "real" is arbitrary. All outputs of the brain are "preferences" in the sense that they are evolutionary shoves.

  *   **Platitude or Defensible?** Defensible but dangerous. It's the "Evolutionary Debunking Argument" turned into a shield. If you use it to protect morality, you also undermine the logic used to construct the defense.
  *   **Does it do the work?**
      *   *Against Debunking:* Yes, but via scorched earth. It neutralizes debunking by accepting it for everything. "Yes, my morality is evolutionary, and so is your criticism of it."
      *   *Against EA Laundering:* Weak. It implies EA utilitarianism is *also* just an evolutionary preference, which undermines the EA claim to objective priority.
  *   **Rationalist Prevalence:** **Medium.** Often appears in discussions about "reliability of intuition." Usually, people retreat from this once they realize it undermines Bayesian reasoning itself.

  ### 3. The Instrumental Failure Thesis (Bias = Preference That Fails Optimization)
  **The Claim:** A preference is a terminal goal. A bias is a heuristic that *used* to serve that goal (or a different one) but now actively sabotages it. The "worse marketing" is the attempt to frame a broken heuristic as a useful rule. For example, "I prefer safety" is a preference. "I refuse to fly because planes are scary" is a bias, because it undermines the preference for efficient travel without actually increasing safety.

  *   **Platitude or Defensible?** Defensible within decision theory. It relies on a clear distinction between terminal values and instrumental strategies.
  *   **Does it do the work?**
      *   *Against Debunking:* Partially. It allows you to say, "Evolution gave me this intuition, but it no longer serves my current goals, so I will discard it as a bias."
      *   *Against EA Laundering:* Strong. It accuses EAs of using a heuristic (utilitarian calculus) that claims to optimize for "goodness" but actually just optimizes for their specific psychological comfort zones, failing to actually achieve the stated goal.
  *   **Rationalist Prevalence:** **Very High.** This is the core of the "Rationality" project: aligning your map with the territory and your actions with your goals. This is likely the technical reading most regulars intend.

  ### 4. The Expressivist Thesis (Moral Claims are Preference Claims)
  **The Claim:** Moral statements *are* preference statements. "X is wrong" literally means "I dislike X" or "I want society to punish X." The "marketing" is the grammatical framing that makes it sound like a discovery of external fact rather than an expression of internal state.

  *   **Platitude or Defensible?** Defensible meta-ethics (Moral Anti-Realism/Expressivism). It's not a platitude, it's a philosophical stance.
  *   **Does it do the work?**
      *   *Against Debunking:* Yes. If morality isn't truth-apt, it can't be "debunked" as false. It can only be evaluated as consistent or widespread.
      *   *Against EA Laundering:* Very Strong. It directly accuses EAs of pretending their preferences are facts. It forces the conversation to "Why do you prefer this?" rather than "Is this correct?"
  *   **Rationalist Prevalence:** **High.** Moral anti-realism is common in these circles. However, many EAs are moral realists, so this slogan is often used *against* them by skeptics in the community.

  ### 5. The Coordination Thesis (Bias = Preference That Fails to Signal)
  **The Claim:** The function of moral language is coordination and status signaling. A "preference" is a valid move in the social game because others accept it. A "bias" is a preference that fails to coordinate others or signals low status/irrationality. The "worse marketing" is literally failed persuasion.

  *   **Platitude or Defensible?** Defensible sociologically, but cynical. It treats rationality as a social performance.
  *   **Does it do the work?**
      *   *Against Debunking:* Irrelevant. It treats truth-tracking as secondary to social cohesion.
      *   *Against EA Laundering:* Strong. It suggests EA is a "marketing campaign" to make weird preferences (saving distant strangers) palatable to a specific tribe. It frames the debate as "Who can signal better?" rather than "Who is right?"
  *   **Rationalist Prevalence:** **Medium-High.** Often appears in threads about "status games" or "virtue signaling." It's the "Politics is the Mind-Killer" view applied to ethics.

  ### Summary for your Thread

  If you want to bring this back to the discussion, here is how you can categorize the people using the slogan:

  1.  **The Introspectionists (Thesis 1):** They want you to admit your values are yours, not the universe's. They aren't saying your values are wrong, just that you're lying about their source.
  2.  **The Instrumentalists (Thesis 3):** They are arguing that your moral heuristics are buggy code. They believe you *can* separate bias from preference by checking if the heuristic actually achieves the goal.
  3.  **The Anti-Realists (Thesis 4):** They deny the premise that "moral knowledge" exists to be debunked in the first place.

  **Which one shuts down the argument?**
  *   **Thesis 4** shuts down *debunking* arguments (by denying truth-aptness).
  *   **Thesis 1** shuts down *EA laundering* arguments (by demanding ownership of values).
  *   **Thesis 3** is the only one that keeps the conversation going productively (by asking "Does this heuristic actually work?").

  **The Trap:**
  The slogan is most often used to smuggle **Thesis 4** (Anti-Realism) while pretending to argue for **Thesis 1** (Honesty). They want you to think they are just asking for honesty, but they are actually asserting that your moral claims have no truth value. If you accept the slogan without clarifying, you concede that your moral arguments are just marketing pitches.

  **How to reply:**
  Ask them: *"Are you saying I'm lying about my values (Transparency), or that my values can't be true (Expressivism), or that my methods don't achieve my goals (Instrumental)?"*

  That forces them to pick a thesis, and usually, the slogan collapses under the weight of the specific definition.
