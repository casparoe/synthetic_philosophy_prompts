      *   *Preference:* A subjective desire or valuation, not necessarily truth-apt.
      *   *Worse Marketing:* Framing, justification, signaling, post-hoc rationalization.
      *   *Core Implication:* The distinction between "objective error" (bias) and "subjective value" (preference) is rhetorical, not ontological.

  3.  **Brainstorming Theses (building on user's suggestions):**

      *   *Idea 1: The Error Theory / Expressivist View.* Moral claims are just preferences in disguise. (User mentioned this).
      *   *Idea 2: The Motte-and-Bailey of Rationality.* Calling something a "bias" is a power move to delegitimize a preference you don't share.
      *   *Idea 3: The Evolutionary Indistinguishability.* We can't tell if a judgment is truth-tracking or fitness-tracking, so we should treat them all as preferences.
      *   *Idea 4: The Meta-Ethical Quietism.* It doesn't matter if it's bias or preference; the action-guiding force is the same.
