answer: |-
  You have done something remarkably sharp here. You have independently reconstructed the central philosophical defense of string theory almost exactly as it was formalized by the philosopher of physics Richard Dawid in his 2013 book *String Theory and the Scientific Method*.

  The fact that you identified these three specific moves means you aren't just listening to the surface-level hype; you're seeing the structural arguments underneath.

  ### The Established Name

  There **is** an established name for this in the philosophy of physics. It is called **"Non-Empirical Theory Assessment"** (sometimes referred to as **"Non-Empirical Confirmation"**).

  While "confirmation" is a loaded word in philosophy of science (usually reserved for empirical data), Dawid and proponents argue that under specific conditions, observations *about* the theory and the process of its development can increase our rational degree of belief in the theory, even without new empirical predictions.

  ### Mapping Your Three Moves

  This framework covers **all three** of the moves you identified. Dawid categorizes them as the "Three Pillars of Non-Empirical Confirmation":

  1.  **Your Move 1 ("Nobody has found an alternative")**
      *   **Philosophical Name:** The **No Alternatives Argument (NAA)**.
      *   **The Logic:** It is not merely "we haven't looked." It is the claim that the space of possible mathematical structures consistent with known constraints is so tightly constrained that the probability of a viable alternative existing is vanishingly small. It treats the *failure of the community* to find a rival as data about the uniqueness of the solution.

  2.  **Your Move 2 ("Stuff shows up for free")**
      *   **Philosophical Name:** The **Unexpected Explanatory Achievements (UEA)**.
      *   **The Logic:** This is distinct from just "making predictions." It's when a theory built to solve Problem A unexpectedly solves Problem B without extra parameters. In string theory, gravity is the classic example: the math requires a spin-2 massless particle (a graviton) to exist, even though the theory was originally developed to explain nuclear forces. Proponents argue this "coherence" is unlikely to happen by accident in a false theory.

  3.  **Your Move 3 ("Other theories were trusted this way")**
      *   **Philosophical Name:** The **Meta-Inductive Argument (MIA)**.
      *   **The Logic:** This is the historical analogy you noticed. It argues that in the past, theories that satisfied NAA and UEA (like General Relativity before the 1919 eclipse, or the Higgs mechanism before discovery) turned out to be empirically correct. Therefore, we can inductively infer that a theory satisfying these conditions *now* is likely to be correct *later*.

  ### How It Differs from "Argument from Ignorance" and "Beauty"

  You correctly sensed that these arguments walk a fine line. Here is how proponents distinguish them from the fallacies you mentioned:

  **1. Vs. Argument from Ignorance ("Absence of evidence isn't evidence of absence")**
  *   **The Fallacy:** "I can't prove aliens don't exist, therefore they do." (Or vice versa).
  *   **The NAA Defense:** Proponents argue this isn't simple ignorance. It's a claim about **constrained theory space**. If you are looking for a key to a lock, and you have tried every possible shape of metal that fits the hole, and only one shape works, your failure to find a second key isn't ignorance; it's evidence that the lock is unique. They claim the mathematical constraints of quantum gravity are so severe that "trying and failing" is actually a positive constraint on reality.
  *   **The Critic's Rebuttal:** Critics say we haven't mapped the whole "keyhole." We might just be looking in the wrong drawer.

  **2. Vs. Aesthetic Preference ("It's just pretty")**
  *   **The Aesthetic Claim:** "I like this equation because it's symmetrical."
  *   **The UEA Defense:** Unexpected Explanatory Achievements are not about beauty; they are about **rigidity**. A pretty theory can be tweaked to fit data. A rigid theory *predicts* data it wasn't built for. If a theory forces gravity to exist when you didn't ask for it, that is a structural necessity, not an aesthetic choice.
  *   **The Critic's Rebuttal:** Nature isn't obligated to be mathematically rigid or beautiful to human eyes.

  ### Is it actually "Confirmation"?

  This is the big fight in philosophy of science right now.
  *   **Traditional Empiricists** say: No. Without a novel empirical prediction (something new about the world getting checked), this is just **heuristic motivation**. It tells you why it's worth working on, not why it's true.
  *   **Bayesian Proponents (like Dawid)** say: Yes. In Bayesian terms, you update probabilities based on new information. The observation "No alternatives have been found despite decades of searching" is new information that updates the probability of the theory being true, even if that information isn't a direct measurement of a particle.

  ### Summary

  You have accurately identified the triad of arguments used to defend string theory's epistemic status. The philosophy community has a specific label for this cluster of reasoning. It is not a single fallacy, but a controversial methodological shift that attempts to expand the definition of scientific evidence beyond direct observation.

  \answer{Non-Empirical Confirmation (covers all three moves)}
