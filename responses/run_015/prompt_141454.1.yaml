answer: |-
  Frank will say there is a fact of the matter that the pulse exists because he treats spacetime curvature as physically real independent of matter, but he will deny there is a fact about which manifold points it occupies because he adheres to Leibniz equivalence rather than verificationism or substantivalism.

  Frank's verdicts reveal he is not a verificationist (your instinct), nor a strict Machian, nor a naive substantivalist. Your verificationist instinct fails on his sixth verdict: galaxies beyond the particle horizon can never be observed even in principle, yet he insists there is a fact of the matter. Strict Machism fails on his fifth verdict: Newton's bucket in an empty universe implies inertia is defined by spacetime structure, not relations to distant matter. Naive substantivalism (the idea that manifold points are physical individuals) fails on his third verdict: the hole argument shows that shifting fields over points without changing relations yields no physical difference.

  The rule that fits all six verdicts is **Metric Structural Realism** (often called sophisticated substantivalism). This view holds that the metric field (spacetime geometry) is a physical entity, not just a bookkeeping device for matter, but that manifold points have no identity independent of that field. 
  1.  **Ships/Shifts:** These are gauge redundancies (coordinate choices), not physical changes.
  2.  **Hole Argument:** Shuffling points without changing the metric structure is a gauge redundancy.
  3.  **Doubling (Infinite):** In an infinite flat space, global scale is conformally invariant; without a boundary or topology to fix it, scale is gauge.
  4.  **Bucket:** The metric connection defines acceleration; curvature is real even without matter.
  5.  **Horizon:** The metric field extends beyond observation; reality is not limited to the observable patch.

  On your gravitational wave case, this rule predicts Frank will say **there is a fact** that the pulse exists. Unlike the hole argument, the wave changes the curvature invariants (Riemann tensor non-zero vs. zero), which is a physical change in the metric structure, not a mere relabelling. It aligns with the bucket case: spacetime itself has a state. However, regarding *where* the pulse is, he will say there is **no fact** about which manifold points constitute the pulse's location (per the hole argument), only a fact about its location relative to the wave's own structural features. This separates him from your verificationism (which might deny the pulse if no test masses exist to measure geodesic deviation) and from substantivalism (which would assign the wave to specific points).

  To settle whether his relationism about scale (Verdict 4) is consistent with his realism about structure (Verdict 5), you should put the **compact version of the doubling story** to him. In a compact universe (like a 3-torus), global scale is topologically fixed; you can measure the size of the universe by sending a light ray around it. If he says "no difference" here, he is a conventionalist about metric scale even when topology fixes it, which contradicts his realism about curvature. If he says "there is a difference," he admits scale is physical when constrained, confirming he is a Metric Structural Realist who only rejects scale as gauge when topology allows it. This forces him to resolve the hesitation he showed on the infinite case and clarifies whether his relationism is about ontology or just symmetry.
