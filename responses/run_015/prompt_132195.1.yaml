answer: |-
  Look, grab a coffee—this is a great angle. Cold fusion is basically the stress test Lakatos never got to run. If you map Fleischmann and Pons through the *Methodology of Scientific Research Programmes* (MSRP), you get a clear view of why it refused to die, but you also see exactly where Lakatos's rational reconstruction hits a wall.

  Here's the lay of the land.

  **The Hard Core and the Belt**
  The hard core for the Utah team was straightforward: **nuclear fusion can occur at room temperature within an electrochemical cell (Pd/D system).** That was the irrefutable premise they protected at all costs. They weren't going to admit the Coulomb barrier was still standing; they were going to assume it was bypassed.

  Once the replication crisis hit—which was almost immediate—the protective belt went into overdrive. This is where you see the ad hoc hypotheses stacking up. First, it was calorimetry defenses ("You're measuring the heat wrong"). Then, when neutron counts didn't match standard fusion models, the belt shifted to "unknown reaction pathways" or "sporadic effects" dependent on secret material histories. Eventually, the belt got so thick they rebranded the whole thing to LENR (Low Energy Nuclear Reactions) to sidestep the "fusion" label entirely. That's a classic protective belt maneuver: modify the auxiliary hypotheses to save the core from falsification.

  **The Rival Programme**
  You asked about the tokamak crowd. Yes, they count as a rival programme, but their hard core is different: **fusion requires extreme temperature and pressure to overcome the Coulomb barrier.** Their protective belt deals with plasma instability and confinement times. The key difference is progress. Hot fusion has been theoretically progressive (predicting plasma behavior) even if technologically slow. Cold fusion became empirically degenerating—it was mostly explaining away past failures rather than predicting novel facts.

  **Where Lakatos Breaks**
  Here's the rub. Lakatos says a degenerating programme should be abandoned when a rival becomes more progressive. By that metric, cold fusion should have collapsed by late 1989. But it didn't. Lakatos's model is silent on the *sociological inertia* that kept it alive. He distinguishes between "internal history" (the logic of science) and "external history" (social factors), but his methodology prioritizes the internal.

  He doesn't have a variable for patent offices, Japanese funding streams, or the media hype cycle. Cold fusion survived because it tapped into non-scientific incentives (energy independence, patent potential) that Lakatos's rational reconstruction ignores. The model predicts rational abandonment; reality gave us zombie science.

  **Social Momentum vs. Empirical Decay**
  To your last point: yes, this case shows a degenerating programme can survive on social momentum alone, but at a cost. It survives on the margins. It becomes a "sect" rather than a mainstream programme. Lakatos would say this is irrational, but historically, it's real. The programme didn't die; it just lost its claim to normal science. It proves that empirical degeneration doesn't guarantee extinction if the social utility (or hope) remains high enough.

