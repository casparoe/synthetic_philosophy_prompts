      *   *Major Conflict:* C1 is the weak link. It contradicts C2 directly. C3 admits C1 can't be saved by idealization.
      *   *Decision:* The user clearly cares more about the *results* (C2, C6, C7) than the *label* (C1). The paper argues for "Practical Reasons." The intuitions in C2 drive the paper. C1 is the inherited framework being tested.
      *   *Recommendation:* Drop C1 (Strict Williams Internalism). Replace with a "Capacity-Based Internalism" or just accept Externalism about Reasons but keep Internalism about *Motivation* (C5).
      *   *Wait, check C3:* C3 rejects idealization. If I drop C1, I don't need C3's "upkeep" device. That simplifies things.
      *   *Check C6:* If I drop C1, the director *has* a reason (C2). Is she responsive? C7 says ends are criticizable. If she is rational (C5/C7), she *should* see the reason. The lack of SMS motivation doesn't block the *reason*, just the *motivation*. C6 requires she *could* have recognized it. If reasons are external (C2), she can recognize them via rationality (C7). So C6 is saved if C1 is dropped.
      *   *Check C5:* Motivational Externalism fits well with Reasons Externalism. The tension is the "Rational Requirement." If reasons are external, rationality requires responding to them. This fits.

      *   *Wait, is there a way to keep C1?* Only if we argue the "route" exists via C7 (Rational Criticism of Ends). But C3 explicitly blocks "idealizing." If rational criticism of ends counts as a "deliberative route," C1 is saved, but C3 is violated (because that looks like idealization).
      *   *Better path:* The user says "I am genuinely unsure whether [upkeep] is anything more than a label." This is an invitation to cut it.
      *   *Best Path:* Sacrifice C1 to save C2, C6, C7. This is the "Externalist Turn."
      *   *Second Best Path:* Sacrifice C2 to save C1. (User won't like this, violates intuitions).
      *   *Third Path:* Sacrifice C6. (User explicitly says "I want to go on blaming").

      *   *Wait, look at C4:* Reasons are facts. This aligns better with Externalism (C2) than Internalism (C1). Williams tries to reconcile these, but it's tighter with Externalism.

      *   *Look at C5 again:* "Motivational externalism about moral judgment... rationality itself requires responding to one's own judgment." This is a hybrid view. If I become a Reasons Externalist (drop C1), does C5 hold? Yes. I judge I have a reason (which is true, externally). Rationality requires me to act. I might not feel motivation (Motivational Externalism). This is consistent.

      *   *So the main clash is C1 vs C2.*
      *   *Secondary clash:* C3 (No idealization) vs C7 (Ends criticizable). If ends are criticizable by reason, then a rational agent *would* see the reason. That implies a route via rationality. C3 says "No route... as it actually is." If rationality corrects the SMS, is that idealization? Yes. So C3 and C7 clash if C1 is kept. If C1 is dropped, C7 supports the existence of the reason regardless of SMS.

      *   *Ranking:*
          1.  C1 vs. C2 (Fatal contradiction).
          2.  C3 vs. C7 (Undermines the mechanism to save C1).
          3.  C6 vs. C1/C3 (Blame requires access; C1/C3 denies access).

      *   *Recommendation:* Drop C1. Modify C3 (make it redundant). Keep C2, C4, C5, C6, C7. This creates a coherent Reasons Externalism + Motivational Externalism + Rationalist Accountability view.

      *   *Wait, one nuance:* The user wants an audit, not just a solution. I need to explain *why* they clash.
      *   *C1 vs C2:* Explicit contradiction.
      *   *C6 vs C1:* If C1 is true, Director has no reason. If no reason, C6 (blame for ignoring reason) fails.
      *   *C5 vs C1:* If C1 is true, "Judgment about reason" is often false (when SMS lacks route). C5 says Rationality requires acting on judgment. So Rationality requires acting on false beliefs? Possible, but messy.

      *   *Cheapest Repair:* Drop C1. It's the only one labeled "Internalism... of the sort associated with Williams." It's the import. The rest are the user's specific claims. C2, C6, C7 are the substantive claims. C1 is the framework. Drop the framework to save the claims.
      *   *Cost:* You lose the Williams label. You become a Reason Externalist. You need to explain *why* reasons exist without SMS. (C4 helps: they are facts). You need to explain *how* the director is responsible (C7: rational criticism of ends).

      *   *Wait, is there a way to keep C1?* "Reasons of Upkeep" (C3). User is unsure. Audit should say: "This device is doing too much work. It conflicts with C1's 'as it actually is' clause."
      *   *Actually, the strongest tension is C1 vs C2.* I will rank that first.
      *   *Second is C6 vs (C1+C3).* If the director has no route (C1+C3), she can't recognize the reason. If she can't recognize it, she isn't blameworthy (C6). But you want to blame her.
      *   *Third is C5 vs C1.* (The Rational Requirement on False Judgments).

      *   *Let's refine the "Cheapest Repair".*
      *   *For T1 (C1 vs C2):* Drop C1. Cost: Loss of Williams Internalism. Gain: Coherence with C2, C4, C6, C7.
      *   *For T2 (C6 vs Access):* If C1 is dropped, the Director has a reason (C2). Does she have access? C7 says ends are criticizable. This implies she *ought* to know better. This satisfies C6's "could have recognized" (normative capacity vs actual psychological route).
      *   *For T3 (C3 vs C7):* If C1 is dropped, C3 is unnecessary. C7 does the work.

