answer: |-
  Dear friend, you have put your finger on a very specific and well-trodden nerve in the philosophy of mind, and your intuition that something is looping back on itself is precisely correct. The view your brother-in-law holds is officially called epiphenomenalism, which is the doctrine that mental events are caused by physical events in the brain but do not themselves cause anything physical. The specific configuration of problems you have noticed, where the theory seems to undermine the very evidence used to support it, is known in the literature as the self-stultification objection, though it is sometimes also referred to as the self-refutation objection or the problem of knowledge for epiphenomenalism. It is not merely a general sceptical worry but a targeted attack on the internal coherence of the epiphenomenalist position.

  To answer your first ask directly, yes, this configuration has an established name. It is most commonly labelled the self-stultification objection. The term was popularised by the philosopher Herbert Feigl, though the sentiment goes back to Thomas Huxley, who originally coined the term epiphenomenalism while acknowledging the difficulty. The core of the objection is exactly as you described it in point (b). If conscious experience has no causal power, then the physical brain states cause both the experience and the report of the experience independently. This means that the report is not caused by the experience, so the report cannot be said to be knowledge of the experience in any robust sense, because knowledge usually requires a causal link or a reliable counterfactual dependence that epiphenomenalism severs. When this is applied to the theory itself, as you noted, the belief in epiphenomenalism is caused by brain states that would exist even if the theory were false and consciousness did not exist, which makes the belief accidentally true rather than justified.

  Regarding your second ask, this objection differs significantly from the nearby concepts you listed. General scepticism about whether beliefs track reality is a global problem that applies to all theories of mind and world, whereas the self-stultification objection is local to epiphenomenalism. A materialist or a dualist who believes mental states have causal power does not face this specific problem because, for them, the pain causes the report, so the report tracks the pain directly. Your worry is generated specifically by the causal inertness posited by your brother-in-law. It also differs from the philosophical zombie thought experiment. The zombie argument is typically used to argue for dualism or epiphenomenalism by showing that consciousness is not logically supervenient on the physical. In contrast, the self-stultification objection is used against epiphenomenalism to show that if consciousness is causally inert, we could not know about it. So while zombies are often a tool for the epiphenomenalist, the self-stultification objection is a weapon used against them. It does not collapse into either of these because it targets the epistemic justification internal to the theory rather than the metaphysical possibility of the theory or the global reliability of perception.

  Your brother-in-law's reply, that the report tracks the pain via its physical correlate, is not just him improvising. This is a standard defence in the literature known as the common cause defence. The argument is that the physical brain state is the common cause of both the qualia and the utterance, so there is a reliable nomological connection between them even without direct causation. However, critics argue that this makes our knowledge of consciousness look like a pre-established harmony or a lucky coincidence, which fails to satisfy the requirements for justified belief. If the physical state causes the belief that I am in pain, and also causes the pain, but the pain does not cause the belief, then in a world where the pain was absent but the physical state remained, the belief would still exist. This means the belief is not sensitive to the truth of the pain's existence in the way knowledge requires.

  On to your third ask, since there is an established name, I do not need to coin one, but I can clarify the carving you requested regarding points (a) and (b). In the literature, (a) and (b) are treated as the same logical move applied to different contents. (a) is the claim that reports of experience are not caused by experience, and (b) is the application of that claim to the report of the theory itself. They are not separate problems but rather the general problem and its most devastating instance. The boundary case where the definition gets fuzzy arises when one considers interactionist dualism versus non-reductive physicalism. If a theorist claims that mental properties are real and distinct but supervene on physical properties in a way that allows downward causation, they might avoid the self-stultification objection while still maintaining a distinction between mind and brain. The fuzziness lies in determining what counts as causal power. If the mental causes the physical only by virtue of the physical causing itself, some argue this is still epiphenomenalism in disguise, while others call it compatibilism. The self-stultification objection applies strictly only when the mental is wholly causally inert. If there is any sliver of causal influence, the objection loses its force, which makes the boundary of the concept depend on how strictly one defines causal exclusion.

  I hope this helps you break the circle you have been going round with your brother-in-law. You have effectively identified the weakest point in his armour, and while he has a standard shield in the common cause defence, it is one that many philosophers find too thin to block the arrow of self-stultification. The carving you were looking for is essentially the distinction between a theory that explains how we know what we know, and a theory that explains away the possibility of knowing it while asserting it anyway.
