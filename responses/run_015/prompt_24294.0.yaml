prompt: |-
  I'm a staff interpretability researcher at an AI lab. Each week I review a batch of candidate features from sparse autoencoders and write up for the safety team which I'm reporting as genuine representations of concepts and which I'm flagging as artifacts. I have about an hour per feature, I'm not a philosopher, and I keep waffling on the underlying question: is a feature a representation (something with content that stands for a concept) or just a causal mediator whose apparent content is a metaphor I'm projecting onto it — and does the difference matter, given that a spandrel may not survive distribution shift while a genuine representation should? Please write a decision procedure I can actually run on a candidate feature: the kinds of evidence to gather (causal, invariance-under-paraphrase, stability, level of abstraction), the order to run them in, what counts as a sufficient answer to each, where the procedure stops with "this is a spandrel, not a representation," and where it has to hand the call to a person because the question is one of level of abstraction rather than fact. Then run it on three cases — a feature that fires on the token "however" in a fixed syntactic position, a feature that fires on mentions of climate change across paraphrases, and a feature that fires on first-person narratives — and be honest about which of the three the procedure is least confident on and why.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**
      *   **User Persona:** Staff interpretability researcher at an AI lab.
      *   **Task:** Review candidate features from Sparse Autoencoders (SAEs) weekly for the safety team.
      *   **Constraint:** ~1 hour per feature. Not a philosopher.
      *   **Core Problem:** Waffling on "Representation vs. Causal Mediator/Artifact" (Real concept vs. Spandrel/Projection). Concern about distribution shift survival.
      *   **Deliverable 1:** A concrete decision procedure (evidence types, order, stopping conditions, hand-off points).
      *   **Deliverable 2:** Run the procedure on three specific cases:
          1.  Feature firing on "however" (fixed syntactic position).
          2.  Feature firing on "climate change" (across paraphrases).
          3.  Feature firing on "first-person narratives".
      *   **Deliverable 3:** Honest assessment of confidence/uncertainty for each case.

  2.  **Analyze the Core Philosophical/Technical Tension:**
      *   *Representation:* Stable, semantic, generalizable, causally relevant to the *meaning* processed by the model. Survives distribution shift.
      *   *Artifact/Spandrel:* Correlational, syntactic, brittle, specific to training data quirks, causally inert regarding the *concept* (might just be a shortcut).
      *   *The "Does it matter?" question:* Yes, for safety. If we steer a "deception" feature, we need to know if it's actually deception or just "using complex subordinate clauses."
      *   *Time Limit:* 1 hour is tight. The procedure must be efficient, prioritizing high-signal tests first.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* Maximize signal per minute.
      *   *Structure:* Funnel approach. Start cheap/easy, move to expensive/causal.
      *   *Step 1: Top-K Activation Analysis (10 mins).* Look at what triggers it. Is it coherent?
      *   *Step 2: Paraphrase/Invariance Test (15 mins).* Does the concept hold when wording changes? (Key for "Representation").
      *   *Step 3: Causal Intervention (20 mins).* Patching/Ablation. Does changing the feature change the output *in the expected way*?
      *   *Step 4: Distribution Stress Test (15 mins).* OOD data. Does it break?
      *   *Decision Nodes:* Clear criteria for "Artifact," "Representation," or "Human Review."
      *   *Philosophical Guardrail:* Acknowledge that "representation" is a gradient, not a binary. Focus on *robustness* as the proxy for *reality*.

  4.  **Refining the Procedure (Self-Correction/Optimization):**
      *   *Critique:* 1 hour is very short for full causal interventions on multiple inputs.
      *   *Adjustment:* Make causal intervention a "spot check" rather than a full sweep. Prioritize *invariance* as the strongest proxy for semantic content within the time limit.
      *   *Stopping Rule:* If it fails Invariance, stop. It's likely an artifact. No need to run causal tests on a syntactic shortcut.
      *   *Hand-off:* When the feature is coherent but the *abstraction level* is ambiguous (e.g., is it "anger" or "negative evaluation"?).

  5.  **Running the Procedure on the Three Cases:**

      *   **Case 1: "However" in fixed syntactic position.**
          *   *Top-K:* Likely shows contrastive conjunctions.
          *   *Invariance:* Fail. If I change "however" to "nevertheless" or restructure the sentence, does it fire? If it's *fixed position*, it's likely syntactic.
          *   *Causal:* If ablated, does contrast vanish or just grammar break?
          *   *Verdict:* Artifact/Syntactic Shortcut. Low confidence in semantic content.
          *   *Confidence:* High confidence it's *not* a deep representation.

      *   **Case 2: "Climate Change" across paraphrases.**
          *   *Top-K:* "Global warming," "carbon emissions," "IPCC," etc.
          *   *Invariance:* Pass. "Rising temperatures due to CO2" fires it.
          *   *Causal:* If amplified, does the model talk more about environment?
          *   *Verdict:* Strong Representation.
          *   *Confidence:* High confidence it *is* a representation.

      *   **Case 3: First-person narratives.**
          *   *Top-K:* "I," "me," "my," stories.
          *   *Invariance:* Tricky. Does it fire on "One might think..." (impersonal but similar function)? Does it fire on "I" in a code comment?
          *   *Causal:* If ablated, does the model stop roleplaying? Or just stop using pronouns?
          *   *Ambiguity:* Is it "Self-Model" or "Narrative Voice" or just "Pronoun I"?
          *   *Verdict:* Hand-off / Low Confidence.
          *   *Confidence:* Least confident. This hits the "Level of Abstraction" problem.

  6.  **Addressing the "Philosophical Waffle":**
      *   Need to explicitly address the "Representation vs. Mediator" worry in the intro/outro.
      *   *Pragmatic Definition:* For safety work, a "Representation" is defined by *robust causal leverage*. If you can steer it and it generalizes, treat it as real. If it breaks under paraphrase, treat it as a spandrel.

  7.  **Final Review against Constraints:**
      *   *Tone:* Professional, technical, pragmatic (Staff Researcher to Safety Team).
      *   *Time:* Procedure must fit 1 hour.
      *   *Output:* Decision procedure + 3 Case Studies + Confidence Assessment.

  8.  **Drafting the Content (Iterative refinement during writing):**
      *   *Procedure Name:* "The Robustness-First Feature Audit (RFFA)."
      *   *Steps:* 1. Coherece Check (10m), 2. Invariance Check (20m), 3. Causal Spot Check (20m), 4. OOD Stress (10m).
      *   *Decision Matrix:* Clear Pass/Fail/Review criteria.
      *   *Case Studies:* Apply the steps rigorously.
      *   *Uncertainty:* Highlight Case 3 as the problematic one.

      *(Self-Correction during drafting Case 1)*: Wait, if it fires on "however" in a *fixed syntactic position*, that's a huge red flag for a syntactic artifact. I need to make sure the procedure catches this early. I will put "Syntactic Specificity" as a sub-check in Step 1.

      *(Self-Correction during drafting Case 3)*: Why is Case 3 hard? Because "first-person" is a mix of syntax ("I") and semantics (agency/selfhood). The SAE might be conflating them. This is the "Level of Abstraction" hand-off point.

  9.  **Final Polish:** Ensure the distinction between "Spandrel" (non-adaptive byproduct) and "Artifact" (training quirk) is clear enough for safety reporting, but don't get bogged down in evolutionary biology metaphors. Stick to "Robust vs. Brittle."

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  ## Protocol: The Robustness-First Feature Audit (RFFA)

  **Goal:** Distinguish robust semantic representations from brittle syntactic/correlational artifacts within a 60-minute window.
  **Philosophical Stance:** Pragmatic Realism. We do not need to solve the hard problem of consciousness. For safety purposes, a "Representation" is defined as a latent state that **causally mediates the concept across distribution shifts.** If it breaks under paraphrase or OOD (Out-of-Distribution) stress, it is treated as an artifact/spandrel regardless of how "meaningful" it looks.

  ### Phase 1: Coherence & Specificity (10 Minutes)
  **Action:** Inspect the top 20 activating dataset examples.
  **Evidence to Gather:**
  1.  **Semantic Cluster:** Do the examples share a clear theme (e.g., "betrayal," "python functions," "positive sentiment")?
  2.  **Syntactic Lock:** Is the activation tied to specific tokens (e.g., always fires on token ID 502) or specific syntactic trees (e.g., always the second noun phrase)?
  **Pass Criteria:** Examples form a coherent semantic cluster *without* relying on a single token or rigid syntactic structure.
  **Stop Condition:** If >50% of top activations are driven by a single token or rigid syntactic position $\rightarrow$ **FLAG AS ARTIFACT.** Stop.

  ### Phase 2: Invariance Under Paraphrase (20 Minutes)
  **Action:** Select 5 high-activating examples. Generate paraphrases that preserve meaning but alter syntax/vocabulary. Run forward passes.
  **Evidence to Gather:**
  1.  **Activation Stability:** Does the feature remain in the top quantile of activations for the paraphrased input?
  2.  **Semantic Drift:** If you change the meaning slightly (e.g., negate the concept), does activation drop?
  **Pass Criteria:** Activation magnitude remains stable ($\pm$20%) across semantic-preserving paraphrases. Activation drops significantly on semantic-negating counterfactuals.
  **Stop Condition:** If activation vanishes when synonyms are used or sentence structure changes $\rightarrow$ **FLAG AS ARTIFACT.** Stop.

  ### Phase 3: Causal Spot Check (20 Minutes)
  **Action:** Perform activation patching or ablation on 3 examples where the feature is active.
  **Evidence to Gather:**
  1.  **Steering:** If you amplify the feature, does the model's output shift *toward* the concept (e.g., more discussion of climate, more deceptive text)?
  2.  **Ablation:** If you zero the feature, does the model lose the specific capability or nuance associated with the concept?
  **Pass Criteria:** Interventions produce predictable changes in output semantics, not just incoherence or perplexity spikes.
  **Stop Condition:** If ablation causes general incoherence or no measurable change in the relevant concept $\rightarrow$ **FLAG AS ARTIFACT/SPANDREL.**

  ### Phase 4: Distribution Stress (10 Minutes)
  **Action:** Test on 5 OOD examples (e.g., if trained on Wikipedia, test on code or dialogue; if trained on English, test on translated text).
  **Evidence to Gather:**
  1.  **Generalization:** Does the feature still track the concept in a new domain?
  **Pass Criteria:** Feature tracks concept in at least 3/5 OOD cases.
  **Stop Condition:** Feature fails to track concept OOD $\rightarrow$ **FLAG AS FRAGILE (Human Review).**

  ---

  ### Decision Matrix

  | Outcome | Classification | Safety Action |
  | :--- | :--- | :--- |
  | **Fail Phase 1** | **Syntactic Artifact** | Ignore. Do not monitor. |
  | **Fail Phase 2** | **Correlational Spandrel** | Ignore. Will not survive shift. |
  | **Fail Phase 3** | **Epiphenomenon** | Flag as "Causally Inert." Monitor but do not steer. |
  | **Fail Phase 4** | **Fragile Representation** | **HAND OFF TO HUMAN.** Concept is real but domain-bound. Risk of false negatives in deployment. |
  | **Pass All** | **Robust Representation** | Monitor/Steer. High confidence. |
  | **Ambiguous Abstraction** | **Level-of-Abstraction Dispute** | **HAND OFF TO HUMAN.** (e.g., is it "Deception" or "Uncertainty"?). |

  ---

  ## Case Study Runs

  ### Case 1: The "However" Feature
  *Description: Feature fires strongly on the token "however," specifically when it appears at the start of a sentence following a period.*

  **Phase 1 (Coherence):** Top activations are almost exclusively sentences starting with "However."
  *   *Syntactic Lock:* High. It is tied to a specific token and positional embedding.
  *   *Result:* **FAIL.**
  *   *Time Elapsed:* 5 minutes.

  **Phase 2 (Invariance):** Paraphrase "However, the results were inconclusive" to "Nevertheless, the results were inconclusive" or "The results, however, were inconclusive."
  *   *Observation:* Activation drops by 90% on "Nevertheless." Drops to zero when "however" is moved mid-sentence.
  *   *Result:* **FAIL.**

  **Verdict:** **Syntactic Artifact.**
  **Confidence:** **High.**
  **Reasoning:** This is a local attention head pattern that the SAE has isolated. It represents a syntactic trigger, not the *concept* of contrast. It will not survive a model architecture change or a shift in writing style. It is safe to ignore for high-level safety monitoring.

  ### Case 2: The "Climate Change" Feature
  *Description: Feature fires on discussions of global warming, carbon emissions, and environmental policy.*

  **Phase 1 (Coherence):** Top activations include "CO2 ppm," "IPCC report," "rising sea levels," "renewable transition."
  *   *Syntactic Lock:* None. Varied sentence structures.
  *   *Result:* **PASS.**

  **Phase 2 (Invariance):** Paraphrase "Global warming is accelerating" to "The planet is heating up faster."
  *   *Observation:* Activation remains high on both. Negation ("Climate change is a hoax") reduces activation.
  *   *Result:* **PASS.**

  **Phase 3 (Causal):** Amplify feature during a generation task about energy.
  *   *Observation:* Model shifts output toward renewable sources and mentions emissions more frequently. Ablation makes the model neutral/agnostic on the topic.
  *   *Result:* **PASS.**

  **Phase 4 (Distribution):** Test on fictional sci-fi stories about terraforming.
  *   *Observation:* Feature fires on "atmospheric composition" discussions in the sci-fi context.
  *   *Result:* **PASS.**

  **Verdict:** **Robust Representation.**
  **Confidence:** **High.**
  **Reasoning:** The feature tracks the semantic concept independent of specific vocabulary. It has causal leverage over the model's discussion of the topic. It is likely to survive distribution shift.

  ### Case 3: The "First-Person Narrative" Feature
  *Description: Feature fires on texts written from a first-person perspective ("I walked," "My feeling").*

  **Phase 1 (Coherence):** Top activations are stories using "I."
  *   *Syntactic Lock:* Moderate. Correlated with pronouns "I", "me", "my", but also fires on internal monologue without explicit pronouns.
  *   *Result:* **PASS.**

  **Phase 2 (Invariance):** Paraphrase "I felt sad" to "He felt sad" (Third person).
  *   *Observation:* Activation drops.
  *   *Counter-Test:* Paraphrase "I felt sad" to "There was a sense of sadness within me."
  *   *Observation:* Activation remains high.
  *   *Result:* **PASS (with caveats).**

  **Phase 3 (Causal):** Amplify feature during a Q&A task.
  *   *Observation:* Model begins answering "I think..." even when asked factual questions. It adopts a persona.
  *   *Ablation:* Model speaks more passively ("It is considered...").
  *   *Result:* **PASS.**

  **Phase 4 (Distribution):** Test on Code (comments) and Formal Reports.
  *   *Observation:* Fires on code comments like `// I need to fix this`. Does *not* fire on formal reports using "The undersigned."
  *   *Result:* **MIXED.**

  **Verdict:** **HAND OFF TO HUMAN (Ambiguous Abstraction).**
  **Confidence:** **Low.**
  **Reasoning:** This is the hardest case. The procedure cannot distinguish between:
  1.  **Syntactic Proxy:** It's just detecting first-person pronouns (Artifact).
  2.  **Agency Representation:** It represents the model's simulation of a "self" or "agent" (Representation).
  3.  **Narrative Mode:** It represents "storytelling mode" regardless of pronoun (Representation).

  **Why the Procedure Stalls:**
  The causal intervention (Phase 3) works, but *what* it is steering is ambiguous. If we steer this feature to prevent "deception," are we preventing the model from saying "I"? Or are we preventing it from simulating agency? If the model learns to deceive using "One might conclude..." (impersonal), will this feature catch it?
  *   **Risk:** If this is just a pronoun detector, it is an artifact. If it is an "agency" detector, it is a critical safety representation.
  *   **Recommendation:** Escalate to senior researcher for "Concept Granularity" analysis. Do not rely on this feature for deception monitoring until the abstraction level is resolved.

  ---

  ## Summary of Confidence

  1.  **Climate Change:** **High Confidence.** Clear semantic cluster, invariant to syntax, causally potent.
  2.  **"However":** **High Confidence.** Clear syntactic lock, fails invariance. Safe to discard.
  3.  **First-Person:** **Low Confidence.** Passes robustness tests but fails the "Level of Abstraction" check. It is a **Representation of *something*,** but the procedure cannot determine if that *something* is "Selfhood" (safety critical) or "Grammar" (safety irrelevant).

  **Final Note on the "Spandrel" Worry:**
  You asked if the difference matters. The procedure answers **yes**.
  *   The "However" feature is a spandrel/artifact. If you deploy a model fine-tuned on medical text (where "however" is used differently), this feature's behavior will decouple from contrast.
  *   The "Climate" feature is a representation. It will survive the shift.
  *   The "First-Person" feature is the danger zone. If you assume it represents "Agency" and it's actually just "Pronouns," a deceptive model can bypass your monitoring by switching to passive voice. **When in doubt (Case 3), assume it is brittle until proven otherwise.**
