answer: |-
  ### The Contextual Integrity Procedure (CIP)

  **Purpose:** To determine whether identifying details about individuals may be published in non-defamatory contexts where privacy norms are contested.
  **Time:** 20 Minutes.
  **Users:** Reporter (Facts), Lawyer (Legal Risk), Editor (Values).
  **Grounding:** Privacy is not secrecy; it is the right to control the flow of information about oneself according to the social context in which it was shared. A fact being "public" does not obligate republication if the *context* of the new audience violates the subject's reasonable expectations or creates disproportionate risk.

  ---

  #### Step 1: Subject Status & Scope
  **Question:** Is the subject a living individual, and is the detail personally identifying (PII) rather than institutional?
  *   **Sufficient Answer:** "Yes, this is a living person," or "No, this is a corporation/deceased entity/official acting in official capacity."
  *   **Procedure:**
      *   If **No** (Corporation/Official Act/Deceased): Stop. Privacy concerns are minimal; proceed to legal review for defamation only.
      *   If **Yes** (Living Individual/Personal Capacity): Proceed to Step 2.
  *   **Rationale (Difficulty #5):** Privacy interests attenuate significantly upon death or when acting as a corporate functionary. This step isolates cases where human dignity is at stake.

  #### Step 2: Narrative Necessity
  **Question:** Does the story's core claim collapse without this specific identifier?
  *   **Sufficient Answer:** A factual statement of the detail's function (e.g., "Required to prove the official signed the order" vs. "Adds atmospheric color").
  *   **Procedure:**
      *   If **No** (It is color, illustration, or convenient but not essential): **STOP. DO NOT PUBLISH.**
      *   If **Yes** (It is evidentiary or central to the narrative): Proceed to Step 3.
  *   **Rationale:** If the detail is not necessary, the privacy cost is automatically unjustified. This filters out gratuitous identification.

  #### Step 3: Contextual Integrity (The "Public" Test)
  **Question:** Does publishing this detail transfer information from a limited-access context to a high-visibility context in a way the subject could not reasonably anticipate?
  *   **Sufficient Answer:** Comparison of the *source* context vs. the *magazine* context. (e.g., "Local court record" vs. "National searchable archive"; "Internal university email" vs. "Public scrutiny").
  *   **Procedure:**
      *   If **Yes** (The magazine acts as a search engine amplifier, changing the audience from "local/official" to "national/permanent"): **Flag for Step 5.**
      *   If **No** (The subject is a public figure who invited this scrutiny, or the info was already nationally broadcast): Proceed to Step 4.
  *   **Rationale (Difficulty #1 & #3):** Privacy is not a quantity of knowers but a matter of *capacity*. A fact known by a clinician is not "public" in the same way as a fact known by a neighbor. Re-publishing "public" records to a new audience with a longer memory constitutes a new privacy intrusion.

  #### Step 4: Aggregation & Dignity (The Harm Test)
  **Question:** Does this detail, combined with other available data, create a profile the subject did not volunteer, or does it violate their autonomy even if tangible harm is unlikely?
  *   **Sufficient Answer:** Assessment of the "Mosaic Effect" and non-consequentialist harm. (e.g., "Street + Rare Disease = Identifiable in small town" or "Naming them treats them as a means to an end").
  *   **Procedure:**
      *   If **Yes** (It completes a mosaic OR it treats the person as an object despite no physical risk): **STOP. DO NOT PUBLISH.**
      *   If **No** (Risk is negligible and autonomy is respected): Proceed to Step 5.
  *   **Rationale (Difficulty #2 & #4):** Harm includes loss of control, not just harassment. Aggregation turns harmless data points into identifying beacons.

  #### Step 5: The Public Interest Override
  **Question:** Does the specific public interest in *this identity* outweigh the privacy cost identified in Steps 3 and 4?
  *   **Sufficient Answer:** A specific justification of why *knowing who they are* serves the public good (e.g., "Public needs to know the decision-maker to hold them accountable" vs. "Public needs to know the incident occurred").
  *   **Procedure:**
      *   If **Unclear or Debated**: **STOP. ESCALATE TO STANDARDS EDITOR.**
      *   If **Clear Override**: Publish (with Legal sign-off).
  *   **Rationale:** This is the values handoff. It acknowledges that sometimes privacy must yield, but that decision requires senior authority, not just reporter discretion.

  ---

  ### Application to Current Cases

  #### Case 1: The Intemperate Email Author
  *   **Step 1 (Status):** Living individual. (Proceed)
  *   **Step 2 (Necessity):** Does the story require the *name* to prove the university mishandled biosafety, or just the *content* of the email?
      *   *Assessment:* Unless this person is the primary decision-maker responsible for the policy, their name is likely color.
      *   *Result:* **Lean NO.** If they are a functionary, the story stands on the content.
  *   **Step 3 (Context):** Internal university record vs. National Magazine.
      *   *Assessment:* High contextual shift.
  *   **Step 4 (Aggregation):** Naming them invites professional retaliation for an "intemperate" moment.
  *   **Step 5 (Override):** Is there accountability value in the name?
      *   *Verdict:* **ESCALATE TO EDITOR.** (If they are low-level, the answer becomes No. If they are the VP of Research, the answer may be Yes).

  #### Case 2: The Graduate Student Photograph
  *   **Step 1 (Status):** Living individual. (Proceed)
  *   **Step 2 (Necessity):** The piece mentions them in a "single clause." They were never charged.
      *   *Assessment:* The photo is not structurally necessary. It is atmospheric.
      *   *Result:* **STOP. DO NOT PUBLISH.**
  *   **Step 3 (Context):** Public sidewalk vs. National association with misconduct.
      *   *Assessment:* Being seen walking is not consent to be labeled a person of interest in a misconduct probe.
  *   **Step 4 (Aggregation):** Guilt by association.
  *   **Verdict:** **KILL THE PHOTO.**

  #### Case 3: The Rare-Disease Street Name
  *   **Step 1 (Status):** Living individual. (Proceed)
  *   **Step 2 (Necessity):** Patient consented to the story, but not the address. Is the street necessary for the medical point?
      *   *Assessment:* Likely color/environmental context.
  *   **Step 3 (Context):** Private consent form vs. Public archive.
      *   *Assessment:* Consent was limited; publication exceeds the scope of the agreement.
  *   **Step 4 (Aggregation):** Rare disease + Street Name = Highly identifiable in local community.
      *   *Assessment:* High mosaic risk.
  *   **Step 5 (Override):** Does the public need to know the street to understand the disease?
      *   *Verdict:* **ESCALATE TO EDITOR.** (Strong lean toward No due to mosaic risk).

  ---

  ### The Defense Sentence
  *For the Graduate Student Photo (The "Squeamish" Call)*

  You will face pressure to run the photo because it is "public space" and "compelling visuals." Here is the sentence you must say to the editor to defend killing it:

  > **"Publishing this photo trades a student's reputation for our atmospheric convenience; since they were never charged and are not central to the narrative, identifying them is not journalism, it is exposure."**

  ---

  ### Failure Modes & Limitations

  You asked for straight talk on where this procedure fails.

  **1. The Box-Ticking Sham**
  In a twenty-minute window, reporters may treat this as a compliance checklist rather than an ethical inquiry. They may answer "Yes" to Necessity loosely to get the story out. The procedure cannot fix a culture that prioritizes speed over nuance; it only structures the argument.

  **2. The Power Blindness**
  This procedure treats a CEO and a janitor similarly in Step 1. It relies on Step 5 (Public Interest) to correct for power dynamics (punching up vs. punching down). In a rush, this distinction may be lost. A checklist cannot fully encode the moral weight of accountability; that requires human judgment.

  **3. The "Mosaic" Unknown**
  Step 4 asks about aggregation. In twenty minutes, you cannot know what other data exists in the wild. You may decide a street name is safe, only to find a blogger combines it with a voter record the next day. The procedure relies on *plausible* risk, not *guaranteed* safety.

  **4. The Values Handoff**
  Step 5 explicitly hands the hard choices to the Editor. This is a feature, not a bug, but it is also a failure of the tool. It admits that no algorithm can resolve the tension between Privacy and Public Interest. If your Editor is unwilling to make that values call, the procedure will simply bottleneck your workflow without solving the ethical dilemma.

  **5. Consent Illusion**
  In Case 3, the patient signed a form. The procedure flags this, but newsrooms often treat signed consent as a legal shield that overrides ethical caution. The procedure says "Consent is limited," but the legal team may say "Consent is absolute." This procedure cannot override a lawyer's interpretation of a liability waiver.
