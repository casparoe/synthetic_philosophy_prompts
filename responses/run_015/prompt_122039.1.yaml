answer: |-
  # Game Title: The Ontology Audit

  **Vibe:** Bureaucratic nightmare meets metaphysical crisis.
  **Time:** 90 Minutes.
  **Players:** 10 Grad Students (split into two teams of 5).
  **Materials:** 3 stacks of colored index cards (White, Blue, Yellow), a whiteboard for scoring, a timer.

  ## 1. The Setup (0:00–0:10)

  **The Story:**
  The Department of Reality is undergoing an audit. We have a world of objects (White Cards) and a catalog of Universals (Blue Cards). Your job is to validate "States of Affairs" (e.g., *Object A is to-the-left-of Object B*).

  **The Teams:**
  1.  **The Archivists (Realists):** Their goal is to ensure every claim is *grounded* by a Universal. They want a complete, consistent ontology.
      *   *Win Condition:* 5 Validated Files.
  2.  **The Budget Officers (Nominalists/Ockhamists):** Their goal is to minimize ontological commitment. Every card placed on the table costs the department **$1 Million**.
      *   *Win Condition:* Keep total cost under $50 Million (50 cards) while preventing "Floating Entities."

  **The Cards:**
  *   **White (Particulars):** Labeled $a, b, c, d$.
  *   **Blue (Universals):** Labeled `Taller-Than`, `Left-Of`, `Red`.
  *   **Yellow (Connectors):** Blank. These represent "instantiation" or "ties."

  ## 2. The Rules (The Trap) (0:10–0:15)

  Write these on the board. Do not explain the *philosophy* behind them, just the mechanics.

  1.  **The Distinctness Rule:** Blue Cards (Universals) are abstract. They cannot physically touch White Cards (Particulars). If they touch, the file is void.
  2.  **The Anchoring Rule:** To connect a Blue Card to a White Card, you must place a Yellow Card between them.
  3.  **The Integrity Rule (The Regress Engine):** Every card on the table is an *entity*. If an entity is not connected to what it is supposed to connect, it is "Floating."
      *   *Facilitator Note:* This is the key. A Yellow card connects a White and a Blue. But the Yellow card is now a new entity sitting next to the White card. Is it *connected* to the White card? Or just sitting there?
  4.  **Validation:** A File is "Valid" only when the Facilitator (You) declares no entities are Floating.
  5.  **Audit:** Budget Officers can call "Audit!" at any time. If they point to a card that isn't fully anchored, the Archivists lose a point.

  ## 3. Round 1: Simple Relations (0:15–0:40)

  **Task:** Validate the claim: *"Card $a$ is Left-Of Card $b$."*

  **Expected Play:**
  1.  Archivists place White $a$ and White $b$.
  2.  They place Blue `Left-Of`.
  3.  They realize Blue can't touch White (Rule 1).
  4.  They place Yellow Connectors between Blue and Whites.
  5.  **You (Facilitator):** Walk over. Point to the gap between White $a$ and the Yellow Connector.
      *   *Ask:* "Is this Connector *actually* attached to $a$, or is it just a card sitting next to it?"
      *   *If they say "Attached":* Remind them Rule 3: All entities need connection. The Connector is an entity. It needs a Connector to connect it to $a$.
      *   *If they say "It's magic":* Remind them this is a naturalistic ontology. No magic.
  6.  Budget Officers will start sweating as the pile of Yellow cards grows.
  7.  **The Wall:** They will build a chain: $a$ — $y_1$ — $y_2$ — $y_3$ ... — `Left-Of`.
  8.  Stop them when they hit 20 cards or 15 minutes. Ask: "Is the file valid?" (No, the last link is floating). "Can it ever be valid?"

  ## 4. Round 2: The Crisis (0:40–0:60)

  **Task:** Validate a transitive chain: *$a$ Left-Of $b$, $b$ Left-Of $c$.*

  **Twist:** Tell the Archivists they are allowed to change the rules *if* they can justify it metaphysically. Tell the Budget Officers they can veto any new Universal type, but not instances.

  **Expected Chaos:**
  *   Archivists will try to say "The Yellow cards are special! They don't need connecting!"
  *   Budget Officers will scream "Special Pleading!" (This is the nominalist critique).
  *   Archivists might try to glue cards (literally). **Ban tape/glue.**
  *   They will realize that as long as the Relation is a *constituent* (a card) distinct from the Objects (cards), they need a further relation to bind them.

  **The Payoff:**
  *   If Archivists admit they can't finish without infinite cards, Budget wins.
  *   If Archivists find a way to stop the regress (e.g., "The first Yellow card is *sui generis*"), they win, but must defend why that card is different from the White ones.

  ## 5. Debrief & Mapping (0:60–0:90)

  Don't let them look up terms. Draw the map on the board based on their frustration.

  **1. The Regress (Bradley):**
  *   Ask: "Why did the Yellow cards multiply?"
  *   *Lesson:* If relations are entities *over and above* the relata, you need a further relation to relate the relation to the relata.
  *   *Name drop:* F.H. Bradley.

  **2. The Budget Response (Nominalism/Resemblance):**
  *   Ask Budget Officers: "How would you solve this to save money?"
  *   *Likely answers:* "Throw away the Blue cards." "Just say $a$ and $b$ are all there is."
  *   *Lesson:* Deny the Universal. $a$ is left of $b$ is a brute fact, or a linguistic convention. No "Left-Of" entity exists.

  **3. The Archivist Defense (Realism):**
  *   Ask Archivists: "You wanted the Blue cards. How do you keep them without the Yellow explosion?"
  *   *Likely answers:* "Instantiation isn't a relation." "It's a non-relational tie."
  *   *Lesson:* Traditional Realism struggles here unless they posit a "brute" instantiation that doesn't trigger the regress.

  **4. The Trope Theorist (Compromise):**
  *   Ask: "What if the 'Left-Of' wasn't a Blue card, but a specific feature of *this* pair?"
  *   *Lesson:* Tropes. The relation is particular to the pair. No Universal Blue card needed, so no gap to bridge. But then, how do we explain that *this* left-of is the same *type* as *that* left-of? (Resemblance regress looms).

  ## 6. The "Missing Feature" Note (For You)

  **State-of-Affairs (SoA) Realism:**
  The cards cannot reproduce the core move of SoA realism (e.g., Armstrong).
  *   **The Limitation:** The game forces a **Constituent Ontology**. It assumes the world is made of Objects + Relations + Ties assembled like Lego bricks.
  *   **The SoA Move:** SoA realism argues the State of Affairs ($a$-being-left-of-$b$) is the *primary* existent. It is not built out of $a$, $b$, and `Left-Of`. It is a unified whole.
  *   **In Class:** You must supply this verbally. "Imagine the cards aren't separate. Imagine the 'fact' is a single, indivisible block. Then you don't need Yellow cards."
  *   **Why the game fails here:** You can't hand them a "State of Affairs" card without it just looking like another object. You have to explain that SoA realism changes the *category* of existence, not just the inventory.

  ## 7. Predictable Failures (Troubleshooting)

  1.  **The "Glue" Cheat:** Students will try to tape cards together or say "We declare them connected."
      *   *Fix:* Be the strict Facilitator. "In this ontology, connection is an ontological category, not a physical one. If you declare it connected, you are positing a 'Declaration Universal.' Put a card down for that." (Drag them back into the regress).
  2.  **Boredom/Speed:** They might solve Round 1 too fast.
      *   *Fix:* Have backup scenarios ready. "$a$ loves $b$, but $b$ loves $c$." Make the relations asymmetric to complicate the filing.
  3.  **Budget Officers Quit:** If the cost gets too high, they might disengage.
      *   *Fix:* Give them a "Veto Token." They can force the Archivists to defend one specific card. If the defense fails, the card is removed, and Archivists lose a point.
  4.  **Philosophical Spoilers:** One student might yell "It's Bradley's Regress!" in minute 20.
      *   *Fix:* "Great, you know the name. But can you *solve* it under the current rules? If you can't stop the Yellow cards, the name doesn't save the Budget."

  ## 8. Syllabus Prep Note

  This activity works best if you keep the tone light but the rules rigid. You are the "Universe," and the Universe is demanding consistency. The frustration they feel when the Yellow cards pile up *is* the philosophical problem. Don't relieve that tension too early in the debrief. Let them sit with the impossibility of the task before offering the solutions.

  **No Library Needed:** All concepts emerge from the card mechanics. Citations are for after class.
