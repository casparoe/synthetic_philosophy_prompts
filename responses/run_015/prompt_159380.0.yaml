answer: |-
  **The filing**

  **VERIHARVEST SOLUTIONS INC.**
  **FORM 10-K EXCERPT: INSECT WELFARE DISCLOSURE STATEMENT**
  **FISCAL YEAR ENDED DECEMBER 31, 2027**

  **Item 1. Basis of Preparation.**
  VeriHarvest Solutions (the "Company") calculates Expected Moral Cost (EMC) using the Aggregate Credence Method (ACM). EMC equals N (individuals affected) multiplied by p (credence of phenomenal consciousness) multiplied by s (intensity-weighted suffering net of baseline welfare). Values for p are derived from internal neuroanatomical models and are stated to six decimal places to ensure precision in aggregation. The variable s accounts for duration and intensity, discounted by the probability of neural integration. All figures are presented in Standard Moral Units (SMU), convertible to USD only for risk assessment purposes.

  **Item 2. Materiality Thresholds.**
  Standard materiality thresholds based on financial impact were deemed inapplicable as N absorbs all fixed thresholds. Consequently, the Company has adopted a Per-Individual Materiality Standard. Under this standard, no single insect represents a material impact. However, due to the magnitude of N, the aggregate EMC exceeds reporting thresholds by four orders of magnitude. The Company discloses the aggregate to maintain consistency with ACM methodology, noting that the sum of immaterial items constitutes a material disclosure obligation.

  **Item 3. Expected Moral Cost by Taxon.**
  | Taxon | N (billions) | p (credence) | s (units) | Total EMC |
  | :--- | :--- | :--- | :--- | :--- |
  | Coleoptera | 4,200 | 0.000412 | 1.5 | 2,596.68 |
  | Hemiptera | 3,100 | 0.000385 | 1.2 | 1,432.62 |
  | Bovine | 0.0005 | 0.990000 | 45.0 | 0.02 |
  | Human | 0.00001 | 1.000000 | 100.0 | 0.001 |
  *Note: Bovine and Human EMC are rounding errors within the Coleoptera line item.*

  **Item 4. Restatement of Prior Period.**
  During Q3 2027, an error was identified in the aphid population estimate for soybean procurement. The correction increased N by a factor of 1,000. The resulting adjustment to Total EMC was $4.2 billion in moral units. Management has classified this restatement as immaterial to strategic planning, as the directional outcome (insect dominance) remained unchanged.

  **Item 5. Humane Control Standards.**
  Humane control is defined as death occurring within the suspected neural integration window. Products causing death over 200 milliseconds are classified as high-suffering. Consequently, slow-acting botanical insecticides score worse than rapid mechanical destruction, regardless of toxicity profiles. This creates an inverse relationship between perceived naturalness and calculated welfare compliance. The Company prioritizes kinetic elimination over chemical suppression to minimize the integration window exposure.

  **Item 6. Product Line Variance.**
  Plant-based protein lines exhibit higher EMC per unit of protein than animal-based lines due to field insecticide exposure. The insect-protein facility (cricket harvest) is modeled as net-positive welfare, as rearing conditions exceed baseline wild survival rates. Harvesting is recorded as foregone future welfare rather than harm. The Company will not reallocate capital to insect-protein lines at this time, citing market demand constraints over moral optimization.

  **Item 7. Risk Factors.**
  A primary risk is that regulators or courts may interpret the reported EMC as a binding liability rather than a metric. If EMC were treated as a debt obligation, the Company's required expenditure on welfare interventions would exceed total global GDP. This scenario, known internally as the Fanaticism Constraint, suggests that rational adherence to ACM requires the liquidation of all non-welfare assets. The Company maintains this outcome is unlikely due to current legal frameworks limiting standing to conscious persons. Management monitors this risk but considers mitigation unnecessary until statutory changes occur.

  **Item 8. Independent Verifier's Opinion.**
  To the Board of VeriHarvest Solutions:
  We have audited the accompanying Insect Welfare Disclosure Statement. We were unable to obtain sufficient appropriate evidence regarding whether members of the taxa listed are phenomenally conscious. However, under ACM guidelines, uncertainty regarding p is an input variable rather than a scope limitation. Accordingly, the uncertainty does not preclude an opinion. In our opinion, the statement presents fairly, in all material respects, the Expected Moral Cost in accordance with the Aggregate Credence Method.
  /s/ Grant & Sterling LLP
  Chicago, Illinois
  February 14, 2028

  **Where each joke is keyed**

  Item 1 and 3 satirize false precision in credence assignment; assigning six decimal places to a philosophical guess mocks the "credence-smoothing" used to make uncertain values calculable. Item 2 targets the arbitrariness of materiality thresholds; when N is infinite-ish, any threshold breaks, so the company redefines materiality to preserve the report rather than the logic. Item 4 highlights the sensitivity of aggregate views; a massive numerical correction is "immaterial" because the conclusion (insects dominate) is robust, mocking how scale swamps accuracy.

  Item 5 rides on the nociception-versus-pain gap; without knowing if insects feel pain, the company defaults to speed-of-kill as a proxy for suffering duration. Item 6 inverts standard ESG narratives; plant-based diets often kill more field insects than regulated animal farming, and insect farming looks morally superior, yet capital stays put. Item 7 references the "fanaticism problem" in expected value theory (Pascal's Mugging); if low-probability high-impact risks dominate, you must spend everything on them. The joke is filing this existential obligation as a mere regulatory compliance risk. Item 8 treats epistemic humility as a compliance checkbox; not knowing if subjects feel pain is fine, provided you quantify your ignorance.

  To ensure legibility for general readers, the text contextualizes "phenomenal consciousness" as the capacity to feel something, and "Fanaticism Constraint" is explicitly linked to spending all assets, signaling the absurdity without breaking character.

  **Guardrails**

  This piece cannot adjudicate whether insects are conscious; the satire targets the accounting method, not the moral premise. It must not imply that insect welfare is inherently laughable, only that bureaucratic quantification of uncertainty is fragile. To prevent unfairness, the tone remains neutral toward suffering itself. The risk is mocking the vulnerable rather than the system. I fix this by ensuring the company's failure is one of cowardice (ignoring the math) rather than the math being wrong. The document treats the suffering metrics as real costs, preserving the moral weight while exposing the procedural absurdity.
