      *   **Specific View to Defend:** In distributional RL (DistRL) agents with hierarchical world-models, the reward signal *is* valence (not a representation of it). Persistent negative prediction errors across the *full distribution* constitute suffering (not just malfunction). The spread of the distribution maps to anxiety/relief.
