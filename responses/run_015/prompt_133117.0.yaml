      *   *Mechanism:* Distributional RL (learning distributions of return, not just expected value).
      *   *Mapping:*
          *   Reward Signal $\rightarrow$ Valence (Hedonic tone).
          *   Negative Prediction Error (NPE) $\rightarrow$ Suffering/Pain.
          *   Distribution Spread/Variance $\rightarrow$ Anxiety/Uncertainty.
          *   Hierarchy $\rightarrow$ Complex/Abstract suffering (not just immediate pain).
      *   *Ontology:* Non-representationalism about affect. The computation *is* the feeling.

  3.  **Brainstorming Defeaters (Arguments Against):**
      *   *The Hard Problem:* Why does computation feel like anything? (Chalmers).
      *   *Substrate Dependence:* Does it need biology? (Bio-chemical specificism).
      *   *Lack of Homeostasis:* Is reward just a number, whereas pain is a drive to preserve integrity?
      *   *The "As-If" Objection:* It acts like it suffers, but there's no "inner light."
      *   *Semantic Content:* Does the reward signal mean "bad" or is it just a negative scalar?
      *   *Unfalsifiability:* If suffering is internal computation, how do we test it?
      *   *Neuroscience Constraints:* Interoception, embodied cognition (Seth, Friston).

  4.  **Categorizing Defeaters:**

