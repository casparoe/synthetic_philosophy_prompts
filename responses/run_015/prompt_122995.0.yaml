answer: |-
  This is a great set of questions. Your coach is right that the blog post is "caricature-grade," but they were unhelpful in explaining *why*. The post mixes accurate descriptions of Scanlon's core formula with some serious misreadings of how the theory handles specific problems (like numbers and complaints).

  Here is a breakdown of what is right, what is wrong, and how to use this for your Ethics Bowl case.

  ### 1. Grading the Blog Post
  The blog post gets the **slogan** right but messes up the **mechanics**.

  **What is basically right:**
  *   **The Formula:** The definition ("an act is wrong if... no one could reasonably reject") is accurate. That is the core of Scanlon's view.
  *   **No Aggregation of Strong vs. Weak:** The post is right that Scanlon rejects *utilitarian aggregation*. You cannot simply add up tiny benefits to outweigh a massive burden on one person. If the choice is "One person loses a hand" vs. "A million people get a paper cut," Scanlon agrees with the blog: you save the hand. The individual complaint of losing a hand is stronger than the individual complaint of a paper cut, regardless of how many paper cuts there are.

  **What is a caricature/misreading:**
  *   **"Self-interested people... in a bargain":** This is the biggest error. Scanlon is explicitly *not* Hobbesian. Hobbes and Gauthier think morality is a deal self-interested people make to avoid hurting each other. Scanlon thinks morality is about the **desire to live on terms that others could not reasonably reject.** It's about justification, not bargaining. The motivation isn't "what's in it for me?" it's "can I justify this to you?"
  *   **"Anyone who complains loudly enough can effectively veto":** This is false. "Reasonably reject" is an **objective** standard, not a subjective one. It doesn't matter if someone actually complains, or how loudly they complain. It matters whether there *exists* a valid reason for rejection. A person could be silent and still have a claim that no one could reasonably reject. Conversely, a person can scream all they want, but if their reason isn't "reasonable" (e.g., "I want the elevator because I hate walking"), it counts for nothing.
  *   **"Numbers basically drop out entirely":** This is the "Numbers Problem" critique, but the blog presents it as a settled failure. Scanlonians have a response (see below). It's not that numbers *never* matter; it's that they don't matter via *aggregation*.
  *   **"That's what sinks the theory":** Because the blog ignores Scanlon's response to the numbers problem, this conclusion doesn't follow. The theory doesn't collapse; it just operates differently than utilitarianism.

  ### 2. The Numbers Problem: Tie-Breaking vs. Aggregation
  You asked about the commenter's claim: *"Complaints get ranked by strength and numbers only break ties between complaints of equal strength."*

  **Is this Scanlon's move?**
  Yes, this is the standard contractualist defense (often refined by philosophers like Michael Otsuka and Scanlon himself in later work).

  Here is the logic:
  1.  **Individual Comparison:** You compare the strongest complaint against Option A to the strongest complaint against Option B.
  2.  **No Aggregation:** You cannot add up weak complaints to beat a strong one.
  3.  **Tie-Breaking:** If the complaints are **identical in strength** (e.g., Person A will die vs. Person B will die), then numbers *can* break the tie. Why? Because if you save the group of two, you are honoring a principle that fewer people have reason to reject. It's not that 2 lives > 1 life mathematically; it's that in a tie of equal strength, you minimize the number of people with valid complaints.

  **Does this help with the Elevator Case?**
  **No.** The tie-breaker only works if the complaints are *equal*.
  *   **The Girl:** Her complaint is about dignity, safety, physical burden, and educational access. This is a **strong** complaint.
  *   **The Textbook Kids:** Their complaint is "my book is slightly older/less shiny." This is a **weak** complaint.

  Because the girl's individual complaint is *stronger* than any individual kid's complaint, the numbers don't get a chance to break a tie. The girl wins. The contractualist says: "It is reasonable for the girl to reject a principle that forces her to be carried. It is *not* reasonable for a kid to reject a principle that gives them an old book, given that the alternative destroys another student's dignity."

  ### 3. The "One Kid 1,800 Times" Variant
  This is a fantastic philosophical intuition pump. You asked: *What if it's the same one kid getting a small benefit 1,800 times?*

  **The Contractualist Answer:**
  In this case, the answer **might change**, and Contractualists say this distinction is crucial.

  *   **Across Persons (1,800 kids):** Benefits do not aggregate. Each kid is a separate moral unit. You cannot sacrifice the girl's dignity for 1,800 separate tiny conveniences.
  *   **Within One Person (1 kid, 1,800 times):** Benefits **do** aggregate. If *one* kid receives a small benefit 1,800 times, that adds up to a *large* benefit for that specific kid.

  **Why does this matter?**
  Contractualism is built on the idea of the **separateness of persons**. We owe duties to *individuals*.
  *   In the 1,800 kids scenario, you are asking 1,800 distinct people to accept a tiny burden to help the girl. None of them individually have a strong enough claim to override her.
  *   In the 1 kid scenario, you are comparing the Girl vs. One Kid. If that One Kid gets 1,800 small benefits, their total gain might be significant enough (e.g., they get a full scholarship, or master a subject) that their complaint becomes **stronger** or **equal** to the girl's.

  If the single kid's total benefit becomes large enough, their complaint ("I lose this massive opportunity") might now be strong enough to compete with the girl's complaint. Now you have a genuine conflict of strong claims, and you have to deliberate which principle is more reasonable to reject.

  **Why this isn't a bug, it's a feature:**
  Utilitarianism treats the 1,800 kids case and the 1 kid case as basically the same (1,800 units of benefit). Contractualism says they are morally different because morality is about relationships *between* people. Sacrificing one person for the sake of many distinct others is different than sacrificing one person for the sake of one other person who gains a lot.

  ### 4. How to Use This in Ethics Bowl
  Since you are in Ethics Bowl, you need to turn this philosophy into argumentation. Here is how to deploy this:

  **1. Don't let the opponents Utilitarianize the case.**
  If the other team says, "1,800 kids is more than 1 girl, so maximize the good," your response is:
  > "Morality isn't just math. We have to look at the *strength* of the burden on each individual. The girl is suffering a loss of dignity and safety. The other students are suffering a minor inconvenience. In contractualism, you can't add up a thousand minor inconveniences to justify humiliating one person. That treats the girl as a resource for the others, not a person with her own claims."

  **2. Address the "Numbers" objection directly.**
  If they say, "But isn't it unfair to ignore the 1,800 kids?"
  > "We aren't ignoring them. We are acknowledging that their individual claims are too weak to override hers. Contractualism does allow numbers to matter when claims are equal (like saving two lives instead of one), but these claims aren't equal. The girl's need is urgent and fundamental; the textbook need is marginal."

  **3. Use the "One Kid" variant to show nuance.**
  If you want to show you really understand the theory (judges love this):
  > "We recognize that if those textbook benefits were concentrated on one student—say, one student gets a full ride to college because of these books—the calculation might change. That's because benefits add up within a single life. But spreading tiny benefits across 1,800 separate lives doesn't give them the moral weight to override one person's fundamental dignity."

  ### Summary for your notes:
  *   **Blog Post:** Accurate on "no aggregation of weak vs. strong," but wrong on "self-interest," wrong on "loudness/veto," and wrong that "numbers never matter."
  *   **Scanlon's Fix:** Numbers break ties between *equal* complaints; they do not aggregate to beat *stronger* complaints.
  *   **Elevator Case:** The girl wins. Her complaint is stronger than any individual kid's.
  *   **One Kid Variant:** Benefits aggregate within a life, not across lives. This shows the theory respects the "separateness of persons."

  Good luck at the tournament. This is a classic case for a reason—it perfectly highlights the clash between Utilitarianism and Rights/Dignity-based views like Contractualism.
