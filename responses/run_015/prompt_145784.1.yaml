answer: |-
  Here is the single rule that captures Douglass's method, followed by how it lands on your three questions, the modern case, and the honest limitation.

  ### The Rule: The Canon of Liberty
  **"Interpret the text according to its plain words, but resolve every ambiguity, exception, or grant of power through the Preamble's declared purpose to secure justice and liberty; treat all exceptions to freedom as narrow disabilities on the government, not affirmative licenses for oppression."**

  This is not living constitutionalism, because it claims the meaning is fixed in the text and the Preamble's moral command. It is not modern originalism, because it rejects the historical expectations of the framers in favor of the moral logic of the words themselves. It is **Teleological Textualism**. The text is the vessel, but Liberty is the compass.

  ***

  ### 1. Originalism (Intent vs. Meaning)
  Douglass would reject Original Intent immediately (that's Taney's error in *Dred Scott*). He would also have a major fight with Original Public Meaning if defined as "what the public in 1787 expected this to allow." He knows the public expected slavery. He argues the *words* they chose ("We the People," "Liberty") outgrew their expectations.

  He would sign on to a version of Originalism that says: **"The original meaning of the words 'Liberty' and 'People' is fixed, even if the original application was sinful."**

  On the "amend it" objection: Douglass wanted amendments (13th, 14th, 15th), but not because the Constitution was broken. He saw them as scrubbing the pro-slavery compromises that were stains on an otherwise sound document. He wouldn't feel the loss of "original meaning" because he believes the original meaning was *always* anti-slavery, and the amendments just made it undeniable. He'd tell the modern originalist: "You are worshipping the sin of the fathers instead of the law of the land."

  ### 2. History and Tradition
  You are closer than your friend, but with a caveat. Douglass would hate the "deeply rooted in history and tradition" test if it looks at *practice*. As you noted, the practice was slavery.

  However, he would also be wary if "tradition" is just vague aspirational language without textual anchor. His move is to say the **Constitution itself creates the tradition.** The tradition isn't what Americans *did*; it's what the Preamble *promised*.

  If you date the tradition to 1868 (the 14th Amendment), Douglass is all in. That is the "second founding." The "deeply rooted tradition" becomes Reconstruction equality. If the Court asks, "Is this right deeply rooted?" Douglass asks, "Is it rooted in the Reconstruction Amendments?" If yes, it doesn't matter if the 1787 tradition was racist. The 1868 tradition overwrites it.

  ### 3. The 13th Amendment Exception
  This is where the Canon of Liberty does the heaviest lifting. The text says: no slavery, *except* as punishment for crime.

  A standard originalist reads this as a license: If you are convicted, you can be enslaved.
  Douglass reads this as a disability: The state can only compel labor as a direct penal consequence, not as an economic engine.

  Applying the rule: The exception must be read narrowly so it doesn't swallow the rule. "Punishment" implies a penal purpose (rehabilitation or retribution), not economic exploitation. Therefore, leasing convicts to private companies for sub-minimum wages creates a master-servant relationship that looks like slavery, which the Amendment forbids. The exception allows the state to punish; it does not allow the state to re-establish the *economic incidents* of slavery.

  Does this generalize? Yes. It generalizes to a principle that **exceptions to rights must be interpreted to minimize the loss of liberty, not maximize the power of the state.**

  ***

  ### The "Douglass Inversion" Verdict
  Your friend's theory is that vague language is a double-edged sword: it lets us read in liberty, but it let Taney read in bigotry.

  Douglass would reject this. He would say your friend concedes too much to Taney. Taney didn't just "read bigotry in"; Taney **miscalculated the text.** The text never authorized bigotry. The "Inversion" suggests the Constitution is neutral clay. Douglass believes the Constitution is weighted metal; it tilts toward liberty. If a generation reads bigotry into it, they aren't using the Constitution correctly; they are breaking it.

  So, he would say the Inversion is false. The Preamble locks the door against bigotry. Taney wasn't a valid alternative reading; he was an error.

  ***

  ### The Modern Case: *Jones v. Alfred H. Mayer Co.* (1968)
  This case holds that the 13th Amendment authorizes Congress to ban private racial discrimination in housing (selling a home to a Black buyer) because such discrimination is a "badge and incident of slavery."

  **Why this surprises you (The Textualist):**
  You likely view the 13th Amendment as narrow: it ended chattel slavery and that's it. You probably think private discrimination requires the 14th Amendment (State Action). You would expect Douglass to stick to the strict text of "slavery" and "involuntary servitude."

  **Why this surprises your Friend (The Living Constitutionalist):**
  Your friend likely relies on the 14th Amendment's Equal Protection Clause evolving over time to cover private discrimination via statute (like the Civil Rights Act of 1968). They view the 13th as historically obsolete.

  **Why Douglass claims it:**
  This is pure Douglass. He argued constantly that the 13th Amendment didn't just free the body; it destroyed the entire *caste system* of slavery. If you can't buy a house because of your race, you are bearing a "badge of slavery." The text of the 13th gives Congress the power to enforce this directly, without needing "State Action." It uses the Text (13th) to achieve a Moral Result (Equality) without waiting for the "Living" evolution of the 14th. It treats the 13th not as a historical event, but as an ongoing mandate to eradicate the incidents of servitude.

  ***

  ### The Argument the Rule Cannot Rescue
  You need to know where Douglass was bluffing. The Canon of Liberty cannot rescue his claim that **the 1787 Constitution contained no pro-slavery compromises.**

  Specifically: **The Fugitive Slave Clause.**
  The text says: "No person held to service or labor in one state... escaping into another, shall... be discharged from such service or labor, but shall be delivered up on claim of the party to whom such service or labor may be due."

  Douglass argued this was a narrow exception that didn't affirm slavery. But under his own rule ("plain words"), the text *requires* the return of the person. It acknowledges the "claim" of the master. It uses the euphemisms, yes, but the operational command is to return the human being to bondage.

  Douglass had to argue that because the word "slave" wasn't used, the institution wasn't recognized. That is a linguistic sleight of hand that fails the "plain words" test of his own Canon. The public meaning in 1787 *was* that this clause protected slave property. Douglass knew he couldn't win if he admitted the text was compromised, so he insisted the text was pure.

  The Canon of Liberty works beautifully for the Preamble, the 13th, and the 14th. It breaks against the Fugitive Slave Clause. Douglass saved the Constitution by pretending that clause didn't mean what everyone at the time knew it meant. That is the one place where he was not a textualist, but a dreamer.
