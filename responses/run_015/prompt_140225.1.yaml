answer: |-
  # THE SIMULATION SORTER
  **Hackerspace Philosophy & Beer Night | v1.0**

  Last month we talked past each other. One person meant "physics is math," another meant "Bostrom's statistics," and a third meant "nothing matters." This sheet forces those apart. Answer the 8 scenarios below. Don't overthink; pick the option that feels true *now*.

  ### THE SCENARIOS

  **1. The Ship of Theseus (Mind)**
  We replace your neurons one by one with functionally identical silicon chips. You act the same.
  *   **A)** You are still you; the experience continues.
  *   **B)** You died at step one; the chip-copy is a zombie (acts alive, feels nothing).
  *   **C)** The question is nonsense; "you" is just a story we tell.

  **2. The Server Farm (Capacity)**
  A civilization survives for a million years. Computing power is cheap.
  *   **A)** They would run billions of "ancestor simulations" (history replays).
  *   **B)** They wouldn't; it's too hard, forbidden, or they die out first.
  *   **C)** They'd run sims, but not *history* sims (games, research, art).

  **3. The Clone Lottery (Self-Location)**
  There is 1 "base" you and 1,000,000 perfect digital copies of you. You wake up.
  *   **A)** I am almost certainly a copy (1 in 1,000,001 odds).
  *   **B)** I am likely the original; "I" refers to the biological source.
  *   **C)** Odds don't apply to "me"; first-person perspective is unique.

  **4. The Pixel Hunt (Physics)**
  We find a grid-like artifact in high-energy cosmic rays.
  *   **A)** Proof of simulation (a computational lattice).
  *   **B)** Proof of physics (just how space works, like atoms).
  *   **C)** Same thing (physics *is* computation, so the label is redundant).

  **5. The NPC Crowd (Scope)**
  To save processing power, only *you* are fully simulated; others are low-res bots.
  *   **A)** Plausible; I can't prove they have inner lives.
  *   **B)** Impossible; the world is too consistent for shortcuts.
  *   **C)** Irrelevant; solipsism is the default human condition.

  **6. The Ethical Ban (Motivation)**
  Running sims involves creating digital suffering.
  *   **A)** Posthumans would ban it (so we aren't sims).
  *   **B)** They'd do it anyway (so we might be sims).
  *   **C)** Suffering in code isn't real suffering (so ethics don't apply).

  **7. The Off Switch (Significance)**
  You prove we are in a sim. The admins say they might shut it off tomorrow.
  *   **A)** Panic; nothing we do matters if it's temporary/fake.
  *   **B)** Shrug; pain still hurts, beer still tastes good.
  *   **C)** Negotiate; maybe we can bargain with the admins.

  **8. The Label (Semantics)**
  "Is the universe a simulation?" is like asking...
  *   **A)** "Is the earth round?" (A factual claim, true or false).
  *   **B)** "Is a number green?" (A category error; meaningless).
  *   **C)** "Is a wave water?" (True, but depends on how you define 'wave').

  ---
  *(Cut here or flip page)*
  ---

  ### SCORING KEY & POSITION MAP

  **Step 1: The Hard Stops**
  *   If you picked mostly **B** on Q1 (Mind): You are a **Biological Naturalist**.
  *   If you picked mostly **B** on Q8 (Semantics): You are a **Conceptual Deflator**.
  *   If you picked mostly **C** on Q4 (Physics): You are a **Pancomputationalist**.

  **Step 2: The Probability Branch**
  *(If you passed Step 1, look at Q2 & Q3)*
  *   If Q2=B (Capacity Low): You are a **Posthuman Skeptic**.
  *   If Q2=C (Non-Ancestor): You are a **Research Sim Theorist**.
  *   If Q3=B or C (Not a Copy): You are a **Reference Class Rejector**.

  **Step 3: The Meaning Branch**
  *(If you passed Step 2, you likely think sims are possible and you might be in one)*
  *   If Q7=A (Panic): You are a **Bostromian Nihilist**.
  *   If Q7=B (Shrug): You are a **Simulation Pragmatist**.
  *   If Q7=C (Negotiate): You are a **Theological Hacker**.

  **Step 4: The Wildcards**
  *   If Q5=A (NPCs) + Q3=A (Copy): You are a **Solipsistic Simmer**.
  *   If Q2=A + Q3=A + Q6=A (Ban) + Q1=A: You are **The Agnostic Trilemma** (One is true, unknown which).

  ---

  ### THE 10 LEAVES (Named Positions)

  1.  **Biological Naturalist:** *Awkward Commitment:* You must explain why meat feels but functionally identical silicon does not, without sounding magical.
  2.  **Conceptual Deflator:** *Awkward Commitment:* You claim the most popular metaphysical debate of the century is a grammatical error.
  3.  **Pancomputationalist:** *Awkward Commitment:* You believe "simulation" is a redundant word; everything is math, so nothing is a simulation.
  4.  **Posthuman Skeptic:** *Awkward Commitment:* You bet against exponential tech growth or assume future ethics will perfectly match yours.
  5.  **Research Sim Theorist:** *Awkward Commitment:* You believe we are in a sim, but not for the reason Bostrom gave (we're a science experiment, not ancestors).
  6.  **Reference Class Rejector:** *Awkward Commitment:* You accept a billion copies exist, but insist *you* are the special original without evidence.
  7.  **Bostromian Nihilist:** *Awkward Commitment:* You accept high probability of simulation, but conclude moral realism collapses if the server turns off.
  8.  **Simulation Pragmatist:** *Awkward Commitment:* You believe reality is likely fake, but insist your pain is real enough to matter.
  9.  **Theological Hacker:** *Awkward Commitment:* You treat the "Simulator" as a deity we can exploit via code or prayer.
  10. **Agnostic Trilemma:** *Awkward Commitment:* You accept Bostrom's logic but refuse to assign probabilities, leaving you unable to act on the belief.

  ---

  ### META-NOTES FOR THE MODERATOR

  **👻 The Ghost Position (Coherent but Unoccupied)**
  *   **The Solipsistic Simmer (Q5=A, Q3=A):** This person believes *only they* are simulated, and everyone else is an NPC.
  *   *Why unoccupied?* It offers no explanatory power for why the "NPCs" behave consistently, and it renders the simulation hypothesis socially useless. It's philosophically sterile.

  **⚠️ The Blurred Leaves (Provably Hard to Separate)**
  *   **Pancomputationalist vs. Bostromian Nihilist:** If "Base Reality" is also computational (Q4=C), the distinction between "Simulation" and "Universe" collapses.
  *   *How to pull apart:* Ask Q8. The Pancomputationalist says the label is redundant (C). The Bostromian says there is a distinct "Base Layer" vs. "Sim Layer" (A). If they can't define the Base Layer, they are secretly Pancomputationalists.

  **💡 Discussion Tip**
  If the group stalls, force a vote on **Q3 (The Clone Lottery)**. This is usually where the "Backend Devs" (who lean A) and "Philosophy Grads" (who lean B/C) will actually disagree on the definition of "I". That is the root of the confusion.
