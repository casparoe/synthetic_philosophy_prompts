          *   *Embryo Mix-ups:* Courts often prioritize genetic parents (suggesting origin matters).
          *   *Adoption:* Courts prioritize social/legal parents (suggesting origin doesn't matter).
      *   **Questions:**
          1.  What view of personal identity/origin does this legal double practice presuppose?
