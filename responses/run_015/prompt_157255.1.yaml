answer: |-
  Here is the principle you are fumbling toward. I call it **The Principle of Inquiry Closure**.

  ### The Principle

  A proposition is a **hinge** if treating it as false stops the game you are playing, rather than giving you a new move to make.

  When you doubt an ordinary empirical claim (like "It is raining"), you start an investigation (look out the window). When you doubt a hinge (like "I have hands"), you don't start an investigation; you lose the ability to investigate anything at all. A hinge isn't a fact you have confirmed; it is the ground you stand on to confirm other facts.

  **On Truth and Knowledge:**
  *   **Known?** No. You don't "know" a hinge. Knowledge implies you could have been wrong and checked. With a hinge, checking doesn't make sense. You don't verify your hands to use them; you use them to verify other things.
  *   **True or False?** They aim at truth, but their job isn't to be true; their job is to hold still. They *can* be false (as your test cases show), but while they are acting as hinges, you treat them as beyond true/false testing.
  *   **Personal or Communal?** Both. Some hinges are biological (hands), some are cultural (history, science), and some are individual (your birthplace). The deeper the doubt goes, the more communal the hinge needs to be. If you doubt your own hands, you are crazy. If you doubt the Holocaust, you are outside our shared moral and historical community.

  ### Where This Principle Fits Your List

  This principle accommodates most of your gut feelings, but it forces you to clean up three specific contradictions where you are running "two standards."

  **1. The Table (You must change your verdict)**
  You say the table is "plainly empirical" but admit doubting it feels "idle." The Principle says: **In a normal room, the table is a hinge.** You only turn it into an empirical claim when you have a specific reason to suspect a trick (a stage prop, a philosophy seminar). You aren't running two standards; you are missing that context flips the switch. In daily life, "This is a table" is a rule for how you act, not a hypothesis you test.
  *   *Correction:* Stop calling it "plainly empirical." It is a default hinge that becomes empirical only under suspicion.

  **2. Water is H2O vs. Earth is Old (You must drop the distinction)**
  You say "Earth is old" is a hinge, but "Water is H2O" is empirical. Structurally, these are the same. For a modern chemist, "Water is H2O" is not something they test every day; it is the rule they use to test other mixtures. It functions as a hinge for their practice.
  *   *Correction:* Admit that "Water is H2O" is a hinge for the practice of chemistry, even if it was once an empirical discovery. Hinges can harden over time.

  **3. Dayton, Ohio (You must trust your gut)**
  You say it "feels like bedrock" but you "think it isn't." The Principle says: **If it feels like bedrock and you aren't checking it, it is a hinge.** The fact that a birth certificate *could* exist doesn't matter. You aren't using one. It functions as a hinge in your life until someone hands you a DNA test.
  *   *Correction:* It is a hinge. The possibility of falsification doesn't stop it from being a hinge; the *act* of falsification stops it from being a hinge.

  **4. The Holocaust (Your intuition is correct)**
  You note that denying it feels like "madness" (like doubting hands) even though it's historical. The Principle explains this: For us, this claim has hardened into a condition of sharing a rational world. Denying it isn't a historical error; it's a refusal to play the game of shared reality. It functions as a hinge now, even if it started as evidence.

  **5. 2+2=4 (Your verdict stands)**
  You are right to separate this. Math isn't a hinge about the world; it's a rule for counting. Doubting it doesn't make you mad; it makes you bad at math. It's a different category (grammar vs. fact), so your intuition that it "goes wrong differently" is spot on.

  **6. Other Minds (Your verdict stands)**
  You say it's not a hinge or knowledge. Correct. It's an attitude. You don't guess your students have minds; you treat them as people. That's a stance, not a proposition.

  ### Running the Principle on Your Two Test Cases

  This is where the principle proves its worth, because it handles change without breaking.

  **Case 1: The 72-Year-Old Woman and the Father**
  For seventy years, "This man is my father" was a hinge. She didn't check it; she used it to understand her history, her genetics, her family story. Doubting it would have collapsed her narrative.
  *   **The Shift:** The DNA test didn't just prove a fact; it turned a hinge into an empirical question. Once the test was on the table, the proposition stopped being a rule and became a claim that could be verified.
  *   **The Aftermath:** Once the result came back negative, a new hinge had to be laid ("I was adopted" or "There was a mix-up"). Her world-picture didn't move because she swapped one hinge for another, not because she decided to live without hinges.
  *   **Verdict:** The Principle accommodates this perfectly. Hinges are not eternal; they can be demoted to empirical claims and replaced.

  **Case 2: The Anthropologist and the Dreaming Boy**
  *   **The Anthropologist:** She never acquires the hinge ("Dreams carry news of death") because she never enters the game where that is a rule. She observes their game from the outside, using her own hinges (dreams are neural firings). She isn't irrational; she's playing a different game.
  *   **The Boy:** He grows up with the dream-hinge. It is real for him. When he goes to medical school, he enters a new community with different hinges (germ theory, neuroscience). He loses the old hinge not because he proved it false, but because he changed teams.
  *   **Verdict:** This confirms the **Communal** part of the principle. Hinges belong to groups. You can lose a hinge by leaving the group that holds it.

  ### Summary of What You Must Drop

  To make your list consistent with **The Principle of Inquiry Closure**, you have to let go of the idea that hinges are defined by their *content* (e.g., "scientific facts" vs. "personal facts").

  1.  **Drop the idea that "Table" is primarily empirical.** It is primarily a hinge, temporarily empirical only when suspicious.
  2.  **Drop the distinction between "Earth is old" and "Water is H2O."** Both are scientific hinges.
  3.  **Drop the idea that "Dayton" isn't a hinge.** If you don't check it, it's a hinge. The possibility of a certificate is irrelevant until you actually pick one up.

  Your gut was mostly right. You were just looking for a reason why some "facts" feel different than others. The reason is that some facts are the tools you use to measure, and some are the things you measure. You can't measure the ruler with the ruler.
