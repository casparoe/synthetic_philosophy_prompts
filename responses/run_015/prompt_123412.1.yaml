answer: |-
  There is no single, canonical term in comparative politics that exclusively captures this specific configuration. However, the phenomenon sits at the intersection of three established conceptual clusters: **isomorphic mimicry**, **organizational decoupling**, and **authoritarian legalism**. 

  To carve this out precisely as you request, the most accurate conceptual label is **Strategic Institutional Inflation**. 

  Below is the conceptual anatomy of this phenomenon, its theoretical anchors, and its boundaries relative to adjacent concepts.

  ### 1. Theoretical Anchors
  While "Strategic Institutional Inflation" serves as a precise descriptive label for the dynamic you describe, it draws its theoretical mechanics from two existing bodies of literature:

  *   **Isomorphic Mimicry (Development/State Capacity):** Originally articulated in development economics (e.g., Pritchett, Woolcock), this describes states adopting the *forms* of successful modern institutions (the "look" of a central bank, a court, a regulatory agency) to gain legitimacy, without adopting the *functions*. In your context, this is **Democratic Isomorphism**: adopting the forms of oversight to signal compliance with international democratic norms while withholding the function of constraint.
  *   **Organizational Decoupling (Sociology/Management):** This refers to the separation of an organization's formal structure from its actual work practices. In this regime type, there is a systematic decoupling of *institutional density* (the number of rules/bodies) from *institutional efficacy* (the capacity to constrain power).

  ### 2. Conceptual Definition: Strategic Institutional Inflation
  **Strategic Institutional Inflation** is a mode of democratic erosion characterized by the deliberate proliferation of formal oversight mechanisms that possess high *visibility* but low *velocity*.

  It is defined by three necessary conditions:
  1.  **Quantitative Expansion:** The formal count of oversight bodies, review mechanisms, or procedural checkpoints increases over time.
  2.  **Qualitative Dilution:** The new mechanisms are designed with structural impediments to action (e.g., non-binding outputs, trivial jurisdiction, high activation thresholds).
  3.  **Functional Displacement:** The proliferation actively sidelines or starves pre-existing, simpler mechanisms that possessed actual constraining power, without necessarily abolishing them.

  The core paradox is that the *cost* of challenging the executive rises (due to procedural complexity) even as the *number* of available challenges increases.

  ### 3. Boundary Conditions: Distinguishing from Adjacent Concepts
  To ensure this concept is not merely a sub-type of general backsliding, it must be distinguished from three nearby phenomena.

  #### A. Versus Institutional Decay
  *   **Decay:** Institutions weaken due to neglect, underfunding, or attrition. The *form* often remains, but the *capacity* rots. The trajectory is usually visible as a decline in metrics (e.g., budget cuts, vacancy rates).
  *   **Inflation:** Institutions multiply. The *form* expands and becomes more complex. Metrics regarding "institutional presence" often improve. The erosion is hidden within the *design* of the new bodies, not the degradation of old ones.
  *   **The Boundary:** If the number of oversight bodies decreases or remains static while efficacy drops, it is **Decay**. If the number of bodies increases while efficacy drops, it is **Inflation**.

  #### B. Versus Democratic Facade (Potemkin Institutions)
  *   **Facade:** Democratic institutions exist only on paper or are created solely for show, with no intention of ever functioning. There is no pretense of an underlying functional system.
  *   **Inflation:** Functional institutions *did* exist or still exist formally but are rendered obsolete by a layer of new, inert institutions. The regime relies on the *contrast* between the complex new system and the sidelined old system to confuse accountability.
  *   **The Boundary:** If the regime abolishes all oversight and rules by decree, it is **Autocracy**. If it maintains a functional parliament but creates a parallel "Ethics Commission" that absorbs all public attention while having no power, it is **Inflation**.

  #### C. Versus Institutional Capture
  *   **Capture:** The executive takes control of existing independent institutions (e.g., packing a court, seizing a media regulator). The institution remains singular and potent, but its allegiance shifts.
  *   **Inflation:** The executive avoids the political cost of capturing old institutions by creating new ones that render the old ones irrelevant. The old court remains "independent" but loses jurisdiction; the new court is "packed" but gains exclusive jurisdiction.
  *   **The Boundary:** If the executive changes the personnel of an existing court to rule in its favor, it is **Capture**. If the executive creates a new "Constitutional Council" that reviews all laws before the court sees them, it is **Inflation**.

  ### 4. Boundary Cases and Falsifiability
  To test whether a case fits **Strategic Institutional Inflation** rather than general backsliding, apply the following tests:

  *   **The Metric Test:** Do standard quantitative indices of "checks and balances" (counting veto points, independent agencies, etc.) register stability or improvement during the period of erosion? If yes, this suggests Inflation. If the indices drop alongside efficacy, it is likely standard Decay or Capture.
  *   **The Complexity Test:** Does the procedural path to challenging executive action become more labyrinthine (more steps, more bodies) even as the probability of a successful challenge decreases? Standard autocratization usually *simplifies* paths to power (removing hurdles); Inflation *complicates* them.
  *   **The Zombie Test:** Are there "zombie" institutions (formally intact, funded, but jurisdictionally neutered) co-existing with "Potemkin" institutions (newly created, highly visible, functionally inert)? The coexistence of these two types is the hallmark of Inflation.

  ### 5. Why the Distinction Matters
  Conceptually isolating **Strategic Institutional Inflation** is vital because it explains why **measurement tools fail**. Standard datasets often code for the *existence* of institutions (e.g., "Is there a judicial review body?") rather than their *exclusive jurisdiction* or *binding power*. 

  A regime undergoing **Decay** is easily identified by datasets tracking institutional strength. A regime undergoing **Inflation** may actually score *higher* on institutional density metrics. Therefore, this phenomenon represents a specific vulnerability in the methodology of comparative democracy measurement, distinct from the substantive erosion of rights.

  ### Summary Recommendation for Your Framework
  In your seminar framework, you should categorize this not as "decay" but as **"Formalist Obfuscation."** 

  *   **Primary Label:** Strategic Institutional Inflation.
  *   **Mechanism:** Isomorphic Mimicry + Decoupling.
  *   **Key Indicator:** Inverse relationship between Institutional Density and Constraint Efficacy.
  *   **Differentiation:** Distinct from Capture (which targets existing bodies) and Decay (which reduces institutional count/capacity).

  This carving allows you to analyze regimes that are not merely breaking democracy, but are actively *gaming the definition* of democracy by saturating the system with inert formalism.
