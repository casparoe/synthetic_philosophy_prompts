          *   2 hours prep time per proposal.
          *   Output: One page.
          *   Audience 1: Boss (Ecologist, numbers-oriented, no philosophy).
          *   Audience 2: Student Government (Skeptical of moral claims, needs clear steps).
          *   Core Problem: Avoid the "Pascal's Mugging" of insect sentience (tiny probability $\times$ huge numbers = infinite weight).
      *   **Specific Theoretical Constraints (from Seminar):**
          1.  *Phylogenetic Correlation:* Sentience isn't per-individual lottery; it's a lineage bet. (Correlated risk).
          2.  *Population Counterfactuals:* Killing insects often just leads to replacement (short, miserable lives). Need to account for baseline dynamics.
          3.  *Endogeneity:* Decisions change insect numbers (demand for crickets, releasing ladybugs).
      *   **Methodological Constraint:** Robustness Check (3 scenarios: No Sentience, Low Sentience, High Sentience). Must admit where value judgments lie.
      *   **Deliverables:**
          1.  Ordered steps of the framework.
          2.  Criteria for passing/failing/hand-off.
          3.  Identification of "judgment calls wearing procedure costumes."
          4.  Application to 3 specific cases (Cricket Powder, Ladybugs/Aphids, Wildflower/Bees).
          5.  Limitations of the procedure.
      *   **Tone:** Practical, rigorous, honest, slightly informal but professional enough for the boss.
      *   **Specific Instruction:** Be honest about the Vegan user's bias on Case 3.

  2.  **Deconstruct the Theoretical Constraints into Procedural Steps:**

      *   *Constraint 1 (Phylogenetic Correlation):* Instead of $N \times P(\text{sentience})$, treat $P(\text{sentience})$ as applying to the *class* of action. If we farm crickets, we are betting on the whole class being sentient. The "huge numbers" argument is dampened because the uncertainty isn't diversified. *Procedure implication:* Cap the moral weight multiplier. Don't let $N$ dominate the uncertainty. Use a "Sentience Confidence Score" rather than raw probability.
      *   *Constraint 2 (Population Counterfactuals):* Need a "Replacement Rate" estimate. If we kill 1,000 aphids, do 1,000 more replace them immediately? If so, net suffering reduction is low. *Procedure implication:* Require a "Life-Cycle Impact" estimate (Duration of life saved/created $\times$ Quality of Life).
      *   *Constraint 3 (Endogeneity):* We create the demand. *Procedure implication:* Distinguish between "Passive Interaction" (mowing lawn) and "Active Creation" (buying crickets, releasing ladybugs). Active creation requires higher burden of proof.

  3.  **Drafting the Framework (The "Insect Impact Protocol" - IIP):**

      *   *Goal:* One page, 2 hours prep.
      *   *Structure:*
          1.  **Categorization:** Is this Active Creation or Passive Management?
          2.  **Ecological Baseline:** What happens to the population if we do nothing? (Addresses Constraint 2).
          3.  **Sentience Robustness Check:** The 3 scenarios (None, Low, High).
          4.  **Decision Matrix:** How to aggregate the 3 scenarios.
          5.  **Stop/Go Rules.**

      *   *Refining the "Phylogenetic" point:* The user noted that evidence is about lineages. So, if we treat crickets as food, we are effectively voting "Yes" on cricket sentience for the whole supply chain. The procedure needs to flag this as a *policy precedent*, not just a math problem.
      *   *Refining the "Pascal's Mugging" avoidance:* The user wants to avoid $P \times N$ dominating. The solution is to treat Sentience as a *threshold* issue, not a multiplier. If Sentience is "Low," $N$ matters less. If Sentience is "High," $N$ matters, *but* we look at Quality of Life (Constraint 2).
      *   *Refining the "Value Call":* Explicitly state that choosing between the 3 scenarios is a policy choice, not a scientific one.

  4.  **Developing the Steps (Iterative Process):**

      *   *Step 1: Intervention Type.* (Active vs. Passive). Active = Higher scrutiny.
      *   *Step 2: Population Dynamics.* (Replacement rate). If replacement is 1:1 and life is short/suffering-heavy, killing might be neutral or positive? Wait, need to be careful. If life is net negative, replacement is bad. If net positive, replacement is good. Let's simplify: "Net Change in Insect-Life-Years."
      *   *Step 3: The Three Scenarios.*
          *   S0: Insects = Biomass only. (Ecological impact only).
          *   S1: Low Sentience. (Nociception only. Weight = 0.01 of vertebrate).
          *   S2: High Sentience. (Complex experience. Weight = 0.1 or 1.0 of vertebrate).
      *   *Step 4: Aggregation.* If S0 says Go, S1 says No, S2 says No -> No. (Precautionary). If S0 Go, S1 Go, S2 No -> Conditional.
      *   *Step 5: The Handoff.* Where does the human decide? When S1 and S2 conflict.

  5.  **Addressing the Specific "Seminar" Objections in the Steps:**

      *   *Objection 1 (Lineage Lottery):* Address in Step 3. Don't multiply by $N$ blindly. Use "Insect-Life-Years" but cap the moral weight based on the Scenario. Acknowledge that choosing S2 implies accepting the risk for the *entire category*.
      *   *Objection 2 (Counterfactuals):* Address in Step 2. Must estimate "Replacement Ratio."
      *   *Objection 3 (Endogeneity):* Address in Step 1. "Active Creation" triggers a veto if S2 is plausible.

  6.  **Running the Cases:**

      *   *Case 1: Cricket Powder.*
          *   Type: Active Creation (Farming).
          *   Counterfactual: Creates lives that wouldn't exist. High density farming = likely negative welfare.
          *   Scenarios: S0 (Go, carbon), S1 (Maybe), S2 (Stop, farming suffering).
          *   Result: Likely Stop or High Risk.
      *   *Case 2: Ladybugs vs. Neem.*
          *   Type: Passive/Management (Pest control).
          *   Counterfactual: Aphids die anyway (neem) or eat plants. Ladybugs starve?
          *   Scenarios: S0 (Save plants), S1 (Ladybugs starve vs Aphids sprayed), S2 (Starving ladybugs = bad).
          *   Result: Nuanced. Neem might be "cleaner" death than starvation? Or Wildflower buffer?
      *   *Case 3: Wildflower + Hives.*
          *   Type: Mixed. Wildflower (Passive/Support), Hives (Active Management).
          *   User Bias: Vegan, thinks it's good.
          *   Reality Check: Honeybees compete with wild pollinators. Hives = disease vector + managed exploitation.
          *   Scenarios: S0 (Good for ecosystem), S1 (Bees work hard, maybe ok), S2 (Hives = slavery/exploitation?).
          *   Result: Wildflower = Go. Hives = Caution/No (due to competition/disease). *Must be honest here.*

  7.  **Refining the Output:**

      *   Need to ensure it fits the "One Page" spirit (concise steps).
      *   Need to highlight "Judgment Calls."
      *   Need to explicitly answer "What the procedure can't do."
      *   Tone check: Don't lecture. Be a tool.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "Lineage Lottery" point fully addressed?
      *   *Fix:* Make sure Step 3 emphasizes that choosing S2 isn't about one bug, it's about establishing a *precedent* for that species.
      *   *Critique:* Is the "Pascal's Mugging" avoided?
      *   *Fix:* By using Scenarios rather than Expected Value ($P \times V$). We don't average them; we check robustness. If it fails the "High Sentience" check, it doesn't matter if probability is 1%, the risk is too high for *Active Creation*.
      *   *Critique:* Case 3 honesty.
      *   *Fix:* Explicitly state that commercial hives often harm wild pollinators, regardless of insect sentience. This aligns with the Boss's ecology focus too.

  9.  **Final Polish:** Check constraints (2 hours prep, one page output, boss/student gov audience). Ensure the distinction between "Active Creation" and "Passive Management" is the primary filter, as that handles the Endogeneity constraint best.

  *(Self-Correction on Case 2)*: Ladybugs released often die or fly away. Aphids sprayed die. Which is worse? If aphids reproduce rapidly, spraying might just reset the cycle. Releasing ladybugs adds *new* predators who might starve. This is a classic "intervention paradox." I need to make sure the framework highlights this.

  *(Self-Correction on Case 1)*: Cricket powder is "Active Creation." This is the biggest red flag under Constraint 3. The framework should make this very hard to pass.

  *(Self-Correction on Case 3)*: User is vegan. Might assume bees = good. But ecology (Boss) says non-native/managed bees = bad for wild bees. Sentience (Seminar) says managed hives = potential exploitation. I need to separate the Meadow (Good) from the Hives (Debatable).

  10. **Finalizing the Text:** Structure clearly with bold headers. Keep it tight. (Proceed to generate output).

  *(Wait, one last check on the "Lineage Lottery" constraint)*: The user said: "evidence... is evidence about a whole lineage at once. So it's closer to one big shared lottery... no diversification."
  *Implication:* You can't say "There's a 1% chance this *specific* cricket feels pain." You have to say "There's a 1% chance *all* crickets feel pain." If that 1% hits, the cost is *all* crickets. This makes the "High Sentience" scenario a "Tail Risk" that cannot be averaged away.
  *Adjustment:* In the Robustness Check, if Scenario 2 (High Sentience) yields a catastrophic moral outcome, the proposal should be rejected regardless of the low probability, *unless* the benefit is existential (which dining hall protein isn't). This is a "Precautionary Principle" approach rather than "Expected Utility." I will build this into the Decision Matrix.

