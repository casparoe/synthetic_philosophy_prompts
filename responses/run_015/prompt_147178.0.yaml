answer: |-
  Here is the **Insect Impact Protocol (IIP)**. It is designed to fit on one page, take under two hours to fill out, and survive scrutiny from both an ecologist and a skeptical student government.

  ### The Insect Impact Protocol (IIP)

  **1. Intervention Type (The Endogeneity Filter)**
  *   **Active Creation:** Are we breeding, buying, or importing insects that would not otherwise exist here? (e.g., Cricket flour, releasing ladybugs).
      *   *Rule:* Requires **Robustness Pass** on all three Sentience Scenarios (see Step 3). If it fails Scenario 2 (High Sentience), it is **REJECTED**.
  *   **Passive Management:** Are we managing existing populations or habitat? (e.g., Mowing, spraying, planting flowers).
      *   *Rule:* Requires **Robustness Pass** on Scenarios 0 and 1. Scenario 2 triggers a "Human Review" (Step 4).

  **2. Population Counterfactual (The Baseline Check)**
  *   Estimate the **Replacement Ratio (RR)**: If we remove/add $X$ insects, how many replace them within one season?
  *   Estimate **Life Quality Baseline**: Is the default state for this insect in this context net-positive (resource rich) or net-negative (starvation/predation dense)?
  *   *Calculation:* $\text{Net Insect-Life-Years} = (\text{Count} \times \text{Avg Lifespan}) \times (1 - \text{RR})$.
  *   *Stop Rule:* If $\text{Net Insect-Life-Years}$ is massively negative under Active Creation, **REJECT** immediately.

  **3. Sentience Robustness Check (The Three Scenarios)**
  Do not average probabilities. Run the proposal under three distinct policy assumptions.
  *   **Scenario 0 (Biomass):** Insects have no moral weight. Decision based on cost, carbon, and vertebrate impact.
  *   **Scenario 1 (Low Sentience):** Insects feel pain but have low cognitive depth. Weight = 1% of a vertebrate.
  *   **Scenario 2 (High Sentience):** Insects have rich subjective experience. Weight = 10%+ of a vertebrate. *Note: Per the "Lineage Lottery" constraint, if this is true, it applies to the whole species, not just individuals.*
  *   *Output:* Mark each scenario as **GO**, **NO**, or **NEUTRAL**.

  **4. Decision Matrix & Handoff**
  *   **Green Light:** All three scenarios are GO.
  *   **Yellow Light:** Scenario 0 & 1 are GO; Scenario 2 is NO.
      *   *Action:* Allowed **ONLY** for Passive Management. Requires Boss Sign-off acknowledging the moral risk.
  *   **Red Light:** Scenario 0 is NO, OR Scenario 1 is NO, OR (Active Creation + Scenario 2 is NO).
      *   *Action:* **REJECT**.
  *   **The Handoff:** If Scenarios 1 and 2 disagree on a Passive Management issue, the decision is handed to the Purchasing Group. The procedure cannot resolve this; it is a value judgment on risk tolerance.

  ***

  ### Where the Procedure is "Judgment in Costume"
  1.  **Step 1 (Active vs. Passive):** This is the biggest ethical lever. Defining "importing ladybugs" as *Active Creation* rather than *Pest Management* predetermines the strictness of the review. I made this choice because of your Constraint 3 (Endogeneity).
  2.  **Step 3 (The Weights):** Assigning 1% vs 10% vertebrate weight is arbitrary. I chose these to force a distinction, but the numbers don't matter as much as the *ranking*. The procedure forces you to admit you don't know the number, so you must test the extremes.
  3.  **Step 2 (Replacement Ratio):** This is ecological guesswork. You will often have to estimate this. If you guess wrong, the math is garbage.

  ***

  ### Case Runs

  #### 1. Cricket Powder for Protein Bars
  *   **Step 1:** **Active Creation.** We are creating demand for farmed insects.
  *   **Step 2:** **RR is irrelevant** (these insects wouldn't exist without us). **Life Quality:** High-density farming usually implies high stress/crowding. Net Insect-Life-Years is positive (we created them) but Quality is likely negative.
  *   **Step 3:**
      *   S0 (Biomass): **GO** (Carbon savings).
      *   S1 (Low Sentience): **NEUTRAL/NO** (Carbon gain vs. mild insect cost).
      *   S2 (High Sentience): **NO** (Factory farming sentient beings is unacceptable).
  *   **Verdict:** **RED LIGHT / REJECT.**
  *   **Why:** Because this is *Active Creation*, a "NO" on Scenario 2 vetoes the proposal, regardless of how low the probability of sentience is. You are betting the farm on insects *not* mattering.

  #### 2. Greenhouse Aphids: Neem Oil vs. Ladybugs
  *   **Step 1:** **Passive Management.** (Aphids are already there; we are choosing removal method).
  *   **Step 2:** **Aphids:** RR is high (they reproduce fast). Life Quality is likely neutral/short. **Ladybugs:** Releasing 10k is borderline Active Creation. Most released ladybugs disperse or starve.
  *   **Step 3:**
      *   S0 (Biomass): **GO** (Save the plants/teaching tool). Neem is cheaper; Ladybugs are "greener" marketing.
      *   S1 (Low Sentience): **NEUTRAL.** Neem kills aphids (painful?). Ladybugs starve (painful?). Hard to distinguish.
      *   S2 (High Sentience): **NO on Ladybugs.** Importing 10k predators who will likely starve creates massive suffering risk. Neem kills existing pests faster.
  *   **Verdict:** **YELLOW LIGHT.**
  *   **Action:** Use **Neem Oil**. Releasing 10k ladybugs counts as *Active Creation* of potential suffering (starvation) without guaranteed pest control. Save the plants, minimize new insect creation. Boss needs to sign off that we prioritized plant survival over insect risk.

  #### 3. Wildflower Meadow + Honeybee Hives
  *   **Step 1:** **Mixed.** Meadow = Passive. Hives = Active Management (importing/maintaining colonies).
  *   **Step 2:** **Meadow:** Increases wild pollinator capacity. **Hives:** Honeybees compete with wild native bees for resources. Disease transmission risk from managed hives to wild bees is high.
  *   **Step 3:**
      *   S0 (Biomass): **Meadow GO / Hives NO.** Ecologically, dense honeybee hives often harm local biodiversity (your Boss will confirm this).
      *   S1 (Low Sentience): **Meadow GO / Hives NEUTRAL.**
      *   S2 (High Sentience): **Meadow GO / Hives NO.** Managed hives involve queen clipping, swarm suppression, and honey harvesting. If insects are highly sentient, this is exploitation.
  *   **Verdict:** **SPLIT.**
      *   **Meadow:** **GREEN LIGHT.**
      *   **Hives:** **RED LIGHT.**
  *   **Honesty Check:** I know you're vegan and want this to be the "good" option. But under this procedure, the **Hives fail**.
      *   *Ecological reason (Boss):* Honeybees are livestock that outcompete wild native pollinators.
      *   *Sentience reason (Seminar):* Managed hives are the insect equivalent of dairy farming.
      *   *Recommendation:* Plant the meadow. Do **not** install the hives. Let wild native bees colonize naturally.

  ***

  ### What This Procedure Cannot Do
  1.  **It cannot solve the "Lineage Lottery" math.** It sidesteps it by using a Precautionary Principle (Veto on Active Creation) rather than Expected Value. If you *need* to calculate Expected Value (e.g., for a cost-benefit analysis), this sheet won't do it.
  2.  **It cannot verify Ecological Data.** If you guess the Replacement Ratio wrong in Step 2, the decision is wrong. You need your Boss to vet the ecology, not the ethics.
  3.  **It cannot resolve the S1 vs S2 conflict on Passive Management.** If mowing the lawn is "GO" on Low Sentience but "NO" on High Sentience, this procedure explicitly hands that to you. It forces you to admit: *"We are choosing to risk insect suffering to keep the lawn tidy."* It prevents you from hiding that choice behind a probability calculation.

  **Prep Tip:** For the meeting, fill out the Step 3 matrix first. If you get a Red Light on Active Creation, don't bother calculating the carbon footprint. It doesn't matter.
