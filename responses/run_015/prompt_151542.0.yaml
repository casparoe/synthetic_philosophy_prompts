      *   *Risk:* Participants using "escape hatches" (e.g., "It's just a game"). The rules must penalize these explanations or make them impossible.

  3.  **Activity Concept: "The Archive of Lost Things"**
      *   *Idea:* Participants curate a small museum of "loss." They write about something lost (fictional or anonymized real), present it, and then "destroy" or "archive" it.
