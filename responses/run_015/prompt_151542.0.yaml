          3.  **The Engagement:** They do the task.
          4.  **The Exchange:** They share the output. The group votes on which was most "valuable."
          5.  **The Payoff:** Points awarded for "Resonance," not "Happiness."
          6.  **The Debrief:** Reveal the card data. Discuss why they chose the heavy envelopes.

