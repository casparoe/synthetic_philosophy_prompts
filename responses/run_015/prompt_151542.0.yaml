      *   *Mechanism 2: Shared Burden.* Tragedy feels lighter when witnessed together. The activity needs a collective component.
      *   *Mechanism 3: Meaning-Making.* Sadness in art usually implies a narrative or aesthetic order. Chaos in life lacks this. The activity needs to impose structure on the "sad" content.
