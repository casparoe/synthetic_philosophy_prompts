      *   *The "Spoiler" Effect:* This is usually discussed in the context of voting rules (like Plurality) where adding a candidate changes the winner between two others. This is often a violation of IIA *in the context of social choice functions*, but in Arrow's Social Welfare Function (SWF) framework, IIA is about the *informational basis* of the decision, not necessarily the *set* of alternatives changing.
      *   *User's Phrasing:* "even if the set of available alternatives is expanded or reduced." -> **This is technically incorrect regarding Arrow's Theorem.** Arrow's theorem assumes a fixed domain of alternatives. The condition is about the *irrelevance of the ranking of third alternatives*, not the *existence* of third alternatives.

