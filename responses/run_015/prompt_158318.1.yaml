  The heap accumulates until it fails,
  To hide the sharp line epistemicists hold,
  Where bivalence in secret prevails.
  They say the boundary exists though untold,
  While supervaluation spreads the reference,
  Over precisifications manifold.
  Where no unique truth-value makes immediate sense,
  With semantic indeterminacy's wide view,
  Where super-truth demands a strict defense.
  But tolerance collapses in the few,
  When higher-order vagueness presses near,
  And naive steps reveal contradiction's cue.
  Now both must face the structural burden here,
