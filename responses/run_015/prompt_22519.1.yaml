      *   *Nuance:* "Consciously" mostly serves to rule out reflexive emotional outbursts (screaming in pain) vs. artistic expression (writing a poem about pain).

  5.  **Synthesize the "Load-Bearing" vs. "Rhetorical" Analysis:**
      *   *Load-Bearing:* "Consciously" (Intent), "External Signs" (Embodiment), "Infected" (Reception), "Lived Through" (Authenticity).
