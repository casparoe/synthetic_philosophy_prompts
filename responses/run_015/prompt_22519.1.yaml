answer: |-
  This is one of the most famous definitions in aesthetics, precisely because it is so deceptively simple. You are right to sense that "feelings he has lived through" is doing heavy lifting; it is the hinge upon which Tolstoy's entire moral critique of art swings.

  To give you the close reading you need for your group: Tolstoy is not writing poetically here. He is writing like a lawyer or a theologian constructing a dogma. Every modifier is a exclusionary clause designed to rule out the kind of art he dislikes (opera, symbolism, Baudelaire, Wagner, and his own earlier novels).

  Here is a breakdown of the specific friction points you identified.

  ### 1. "Feelings he has lived through" (*Perezhil*)
  You asked if this distinguishes past experience from present feeling, or genuine from fake. The answer is **both**, but with a specific nuance regarding *memory* versus *mimicry*.

  **The Cellist Example:**
  Tolstoy would argue that if a cellist plays a funeral march with technical perfection but treats the grief as a mere technical problem (i.e., "play slower, use more vibrato"), that is **counterfeit art**.
  However, Tolstoy does not require the cellist to be actively weeping while playing. That would make performance impossible. Instead, "lived through" implies **emotional memory**. The artist must have access to the *reality* of that grief within their own psyche. They must summon the *memory* of the feeling to encode it into the sound.
  *   **The Constraint:** If the feeling is purely intellectual or imitative (mimicking how grief *looks* without accessing how grief *feels*), the "infection" will fail. The audience will sense the hollowness.
  *   **The Distinction:** It distinguishes **expression** (I am showing you a feeling I know) from **description** (I am showing you a sign that represents a feeling).

  **The Fiction Example:**
  This is where Tolstoy is most controversial. You suspected the mapping is "lossy." Tolstoy agrees.
  He does not require a writer to have committed a murder to write a murderer. However, he requires the writer to have lived through the *constituent emotions* of that murder (rage, fear, guilt, desperation).
  *   **The Claim:** If an author writes about a soldier's death in war but has never felt fear, loss, or patriotism, they cannot write art about war. They can only write "literary description."
  *   **The Critique:** This is why Tolstoy savages Shakespeare in this book. He argues that Shakespeare's characters speak in the same rhetorical style regardless of their situation; therefore, Shakespeare is merely mimicking the *signs* of passion without having "lived through" the specific human reality of those characters.
  *   **Load-Bearing Status:** This clause is **critical**. It is Tolstoy's weapon against "professional" art—art made by a class of people who are disconnected from the common human struggles of life (peasant labor, birth, death, faith). If you haven't lived the feeling, you can't transmit it.

  ### 2. "Consciously"
  You asked if this is load-bearing regarding unintentional transmission (e.g., abstract art, or a song that hits you for reasons the composer didn't intend).

  **Yes, it is load-bearing.**
  Tolstoy is distinguishing Art from **Nature** and **Reflex**.
  *   **Nature:** A beautiful sunset moves you, but it is not Art because the sun did not *consciously* intend to infect you with beauty.
  *   **Reflex:** If you stub your toe and scream, and I feel your pain, that is not Art. It is a biological reflex.
  *   **The Artist's Intent:** For Tolstoy, Art is a **volitional act of union**. The artist must *intend* to bridge the gap between souls.

  **Regarding your "unintentional resonance" question:**
  If a composer writes a mathematical exercise (like some serialist music) or a warm-up scale, and you listen to it and feel profound sadness, Tolstoy would classify this as a **psychological accident**, not Art.
  For Tolstoy, Art is a *religious/moral activity*. Its purpose is to unite mankind. If the union happens by accident, the moral purpose is absent. He would likely categorize unintentional resonance as "pleasure" or "entertainment," but not True Art. This is a hard pill for modern readers to swallow, but it is essential to his argument: Art without moral intent is merely a drug.

  ### 3. "By means of certain external signs"
  This is often skipped in summaries, but it is **load-bearing**.
  It grounds art in **materiality**. It rules out telepathy or pure thought. The feeling must be objectified. This is why Tolstoy cares so much about clarity. If the "external signs" (the words, the notes, the colors) are obscure, the infection is blocked. This is his critique of Symbolism and Obscurantism. If the signs are too complex for the common man to read, the union fails.

  ### 4. "Infected... and also experience them"
  This is the **Success Condition** (your friend's "eval criterion").
  Many definitions of art focus on the *object* (the painting). Tolstoy's definition focuses on the *transaction*.
  *   **Load-Bearing:** Extremely high. If the audience is not infected, **Art has not occurred.**
  *   **Implication:** This makes Art objective, not subjective. It doesn't matter if the artist *thought* they were making art. It doesn't matter if the critics *say* it is art. If the infection fails, it is not art. It is a "counterfeit."
  *   **The Catch:** Tolstoy assumes that "infection" is universally recognizable. He ignores the possibility that an audience might be "infected" by something toxic (e.g., Nazi propaganda art). He deals with this later by adding a *religious* criterion (the feeling must be compatible with Christian love), but in Chapter 5, infectiousness is the primary metric.

  ### Summary of Load-Bearing Clauses

  If we strip the sentence down to its logical architecture, here is what is doing the work:

  1.  **"Consciously"**: Excludes nature, accidents, and biological reflexes. Establishes Art as a moral/volitional act.
  2.  **"External Signs"**: Excludes pure thought/mysticism. Requires embodiment/craft.
  3.  **"Feelings he has lived through"**: Excludes technical mimicry, professional posturing, and biographical falsehood. Requires authenticity/emotional memory.
  4.  **"Infected"**: Excludes failed communication. Establishes Art as a successful transmission event, not a static object.

  ### How to frame this for your reading group

  If you want to spark discussion, focus on the tension between **"Lived Through"** and **"Consciously."**

  *   **The Paradox:** To transmit a feeling "consciously," the artist must step back and craft the "external signs." But to have "lived through" the feeling, they must be immersed in it. Tolstoy is asking for a state of **controlled vulnerability**.
  *   **The Modern Problem:** Ask your group: Does this definition kill the "Death of the Author"? Yes, absolutely. For Tolstoy, the Author's internal state is the *only* thing that matters. If the Author didn't live it, the text is dead, regardless of how the Reader interprets it.
  *   **The Rationalist Friend:** Your friend was right to treat it as an eval criterion, but they missed the moral weight. For Tolstoy, "Infectiousness" isn't just "did it work?" It is "did it unite us in brotherhood?" If a song infects you with despair that isolates you, Tolstoy might eventually argue (in later chapters) that it is "bad art" or even "anti-art," despite meeting the Chapter 5 definition.

  **Verdict on your specific questions:**
  *   **Cellist:** Must access emotional memory. Technical skill without memory = Counterfeit.
  *   **Fiction:** Must map universal lived emotions to specific unreal situations. Pure invention without emotional grounding = Counterfeit.
  *   **Consciously:** Yes, load-bearing. Accidental beauty is not Art.

  Tolstoy is trying to turn Art from a noun (a thing you make) into a verb (a thing you *do* to someone else). If the verb doesn't complete its action, the sentence is grammatically incorrect.
