      *   *Section 2: "Consciously".* This rules out accidents and natural signs. A sunset isn't art. A scream of pain isn't art. A song *about* pain is. Address the abstract art/unintentional resonance point: Tolstoy would likely be skeptical. If the intent wasn't union, it's suspect.
