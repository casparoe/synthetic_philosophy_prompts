answer: |-
  Gloss
  Imagine a being sharp enough to track every molecule, yet whose attributes remain essentially finite like our own. Such a being could therefore achieve what is impossible for us. Molecules in uniform-temperature air possess varied velocities, though averages are uniform. Suppose a vessel is split into A and B by a wall with a small hole. If he opens the hole to allow only swift molecules from A to B and slower ones from B to A, it will raise B's temperature and lower A's. This occurs without work, contradicting the established second law of thermodynamics.

  What Maxwell is doing
  Maxwell is not proposing a perpetual motion machine but highlighting the strictly statistical character of the second law. He intends to show that the law holds for bulk manipulations but fails for microscopic control. The "finite" clause is not merely defensive against theological objections; it establishes the demon as a physical agent operating within nature, not a supernatural exception. By specifying finite attributes, Maxwell ensures the demon is subject to physical laws, yet possesses sufficient resolution to bypass statistical averages. This marks the second law as pragmatic for humans, not absolute. It defines the domain of validity for thermodynamics as macroscopic manipulation. The thought experiment isolates the connection between knowledge and thermodynamic cost. Maxwell wants to demonstrate that the impossibility of violating the second law arises from our inability to handle individual molecules, not from a fundamental prohibition on the state change itself. The odd detail of the "small hole" ensures no work is done by the partition itself, isolating the sorting action as the sole variable. The demon represents a limit case of measurement without immediate energetic cost in his framework.

  The three sticking points
  First, the "finite" clause does real work. It marks the second law as holding for agents restricted to bulk variables. If the agent is finite but microscopic, the law becomes statistical, not absolute. Second, the radiation argument is physically decisive today but anachronistic. Maxwell did not conceive of vision requiring photon exchange. While valid in modern quantum thermodynamics, it misses Maxwell's conceptual point about sorting itself. It conflates implementation costs with the logical possibility of sorting. Third, your shift-register model fails because the "falling off" bit constitutes erasure. When the bit leaves the register, it becomes correlated with the environment. To reset the register for cyclic operation, you must decouple that bit from the system. If you let it drift, the correlation remains. If you thermalise it to reuse the physical substrate, you pay $k \ln 2$. In your simulation, the entropy isn't disappearing; it is accumulating in the stream of discarded bits. You are not creating a cyclic engine; you are consuming a clean tape and producing a randomised tape. The missing entropy is in the correlation between the discarded bit and the gas. The entropy accounting per cycle: Gas entropy decreases by $k \ln 2$. Memory entropy increases by $k \ln 2$ (recorded bit). When the bit drops, if it remains correlated, global entropy is constant. If it thermalises, environment entropy increases by $k \ln 2$. To claim net work, you assume the tape is free. It is not. Check your simulation for the entropy of the output stream versus the input stream. You are exporting entropy, not destroying it. Your supervisor is correct: shifting out unknown information into a bath is thermodynamically equivalent to erasure. The physical carrier must be reset to a standard state to be reusable, which dissipates heat. You are treating the tape as an infinite entropy sink, which is physically equivalent to a cold reservoir. If you include the tape preparation cost, the net work vanishes. Carefully look for the heat dissipation.

  Settled versus contested
  It is settled that the second law holds globally when information is treated as a physical quantity. There is consensus that information processing has thermodynamic consequences and that Maxwell's demon cannot violate the second law in a closed system. Landauer's principle, linking bit erasure to heat dissipation, is the standard explanation taught in physics. However, it is contested whether erasure is the *only* source of compensation. Some argue the cost lies in measurement rather than memory reset. Others debate whether quantum coherence changes the accounting. The precise location of entropy production in specific models remains a subject of technical debate. What is agreed is that you cannot extract work from a single bath using information without paying somewhere. What is disputed is exactly where the bill arrives. Do not present the Landauer erasure cost as the only possible resolution, though it is the dominant one. The orthodoxy favours erasure, but alternative derivations exist.

  How confident to be
  I am secure that the second law remains unviolated and that your simulation hides entropy in the discarded tape. This is standard statistical mechanics. I am less confident about reconstructing Maxwell's precise intentions regarding the "finite" clause; historians debate whether he anticipated information theory. My judgement on your toy model is secure within classical thermodynamics: shifting bits into a bath without resetting them consumes a resource. If your simulation shows net work without heating the bath or randomising the output tape, there is a bug in your entropy counter. Direct observation of heat dissipation during the shift operation would confirm the standard view. If you find a way to recycle the tape without cost, you have discovered new physics, but bet on the bug.
