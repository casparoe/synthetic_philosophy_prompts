prompt: |-
  I've been thinking about the problem of cooperation among advanced AI systems, and specifically about whether program equilibrium is the right lens for it. I'd like your credence on the following proposition:

  **Proposition**: In the space of practically relevant interactions between advanced AI systems (say, systems capable of strategic reasoning and with some ability to inspect or model each other's decision procedures), the program equilibrium framework — where agents choose programs that can condition on each other's source code or decision algorithms — will, within the next thirty years, prove more useful for explaining, predicting, or engineering cooperative outcomes than classical solution concepts (Nash equilibrium and its refinements) or evolutionary and learning-based accounts.

  I want a number, but more importantly I want the decomposition. Please break your credence into at least the following sub-questions, assign a rough probability to each, and show how they combine to your overall credence:

  1. **Access**: That the relevant AI systems will have sufficient access to each other's decision procedures — source code, model weights, or a faithful high-level specification — for program-equilibrium reasoning to get a grip, rather than interacting as black boxes.

  2. **Difference**: That, conditional on such access, the set of practically important interactions where program equilibrium gives different predictions from Nash equilibrium (or from evolutionary and learning equilibria) is non-negligible — that the cooperation gains aren't mostly recoverable through reputation, repeated play, or selection effects.

  3. **Tractability**: That program-equilibrium reasoning will be computationally or engineeringly tractable for the relevant systems — that they can actually find or approximate the relevant fixed points rather than falling back to something simpler.

  4. **Adoption**: That the AI research and deployment ecosystem will actually adopt program-equilibrium reasoning as a design principle or analytical tool, rather than converging on alternative frameworks for contingent sociological reasons.

  Then tell me: which of these sub-questions is your overall credence most sensitive to — that is, if you could get a definitive answer to one of them, which would shift your number the most? And what kind of evidence would move that sub-question for you?

  For calibration: my own credence is around 0.35, and I suspect my main disagreement with someone at 0.7 would be on the Access term — I think they're overestimating how much transparency advanced systems will have into each other's internals. But I want your numbers, not a diagnosis of mine.
