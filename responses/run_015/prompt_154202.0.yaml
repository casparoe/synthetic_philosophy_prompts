      *Mechanism:* During the Regress, every statement must be prefaced with "I know..." When a claim is voted Load-Bearing, the scribe writes it on the board *without* the "I know." In the Swap phase, Group A must use Group B's claims. They *must* try to preface them with "I know..." to use them as reasons. They will find they cannot honestly say "I know [Group B's Hinge]." They can only say "We are assuming..." This creates the grammatical friction.

