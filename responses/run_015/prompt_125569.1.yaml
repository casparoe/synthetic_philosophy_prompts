answer: |-
  1. Question

  **Rule V:** For each theory $T$, calculate the mean $\mu_T$ and standard deviation $\sigma_T$ of its utilities across the available menu. Assign each option $o$ a normalized value $v_T(o) = (u_T(o) - \mu_T) / \sigma_T$. Choose the option maximizing $\sum C(T) v_T(o)$.

  **Scenario:** You hold equal credence ($0.5$) in Theory 1 (T1) and Theory 2 (T2).
  **Menu 1:** $\{A, B\}$.
  T1 utilities: $A=10, B=0$. ($\mu_1=5, \sigma_1=5$).
  T2 utilities: $A=0, B=10$. ($\mu_2=5, \sigma_2=5$).
  **Menu 2:** $\{A, B, C\}$.
  T1 utilities: $A=10, B=0, C=100$. ($\mu_1=36.7, \sigma_1=45$).
  T2 utilities: $A=0, B=10, C=0$. ($\mu_2=3.3, \sigma_2=4.7$).

  (a) Calculate the Rule V score for A and B in Menu 1. Which is chosen? (3 marks)
  (b) Calculate the Rule V score for A and B in Menu 2. Which is chosen? Show that the ranking between A and B reverses despite C being unavailable in Menu 1. (5 marks)
  (c) Explain what the rescaling step ($\sigma_T$) presupposes about inter-theoretic comparability. Is the scale factor a technical convention or a substantive moral commitment? (5 marks)
  (d) Consider a long-shot option with astronomical value. Does Rule V cap its influence principledly or arbitrarily? Finally, can Rule V recommend an option every theory ranks lower than an alternative, and does the sequential-choice argument against "favorite-theory" approaches successfully motivate Rule V? (7 marks)

  2. Model Answer

  (a) In Menu 1, for T1: $v_1(A) = (10-5)/5 = 1$; $v_1(B) = (0-5)/5 = -1$. For T2: $v_2(A) = (0-5)/5 = -1$; $v_2(B) = (10-5)/5 = 1$.
  Total Score(A) = $0.5(1) + 0.5(-1) = 0$.
  Total Score(B) = $0.5(-1) + 0.5(1) = 0$.
  Result: Indifference between A and B.

  (b) In Menu 2, for T1: $v_1(A) = (10-36.7)/45 \approx -0.59$; $v_1(B) = (0-36.7)/45 \approx -0.81$.
  For T2: $v_2(A) = (0-3.3)/4.7 \approx -0.70$; $v_2(B) = (10-3.3)/4.7 \approx 1.42$.
  Total Score(A) = $0.5(-0.59) + 0.5(-0.70) = -0.645$.
  Total Score(B) = $0.5(-0.81) + 0.5(1.42) = 0.305$.
  Result: B is strictly preferred to A.
  Reversal: In Menu 1, A $\sim$ B. In Menu 2, B > A. The addition of C, which is not chosen, alters the standard deviation of T1 drastically (inflating it from 5 to 45). This shrinks the normalized influence of T1 on the A/B comparison, allowing T2 to dominate the decision. This violates the Independence of Irrelevant Alternatives; the ranking of feasible options depends on the presence of unchosen outliers.

  (c) The rescaling step presupposes that while theories may disagree on the *level* of value, they agree on the *structure* of variance across the menu. By dividing by $\sigma_T$, Rule V assumes that a one-standard-deviation shift in T1 is morally equivalent to a one-standard-deviation shift in T2. This is not a technical convention but a substantive moral commitment. It asserts that theories with wider spreads of utility (like T1 in Menu 2) are not more "confident" or "high-stakes" in a way that warrants greater weight; rather, their scale is treated as noise to be normalized. If one believes T1's range (0 to 100) reflects genuinely higher stakes than T2's (0 to 10), Rule V silently rejects this, imposing egalitarianism about variance rather than value. The scale factor is thus a smuggled premise about inter-theoretic unit comparability.

  (d) Regarding long-shots: Rule V caps the influence of astronomical payoffs because a huge value inflates $\sigma_T$, which shrinks the normalized value of all options for that theory. In Menu 2, C's value of 100 crushed T1's ability to distinguish A from B. This is not a principled cap on stakes but an artifact of menu dependence. If C were removed, T1's influence would return. Thus, the "cap" depends on the agenda setter's inclusion of extreme decoys, not on a robust view about risk.

  Regarding unanimity: Within a fixed menu, Rule V cannot recommend an option every theory ranks lower than an alternative. Linear transformation preserves order; if $u_i(X) > u_i(Y)$ for all $i$, then $v_i(X) > v_i(Y)$ for all $i$, ensuring the weighted sum respects unanimity. However, because menu membership changes the transformation, an agent can be manipulated into a unanimously worse outcome by expanding the menu.

  Regarding sequential choice: The argument against "favorite-theory" approaches is that they are dynamically inconsistent (exploitable via money pumps). Rule V avoids this *if* the menu is stable. However, because Rule V is menu-dependent, it introduces diachronic instability if the agent anticipates future menu changes. The sequential-choice argument motivates aggregation to avoid exploitation, but it presupposes that avoiding exploitation is more important than respecting menu independence. Rule V trades one vulnerability (dynamic inconsistency of favorite-theory) for another (menu manipulation). A strong defense must argue why menu dependence is less costly than exploitability, not merely that aggregation solves the latter.

  3. Marking Scheme

  | Point | Required Move | Marks | B Answer (Competent) | A Answer (Distinctive) | Common Error |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Calculation** | Correctly compute normalized scores for Menu 1 & 2. | 5 | Gets Menu 1 right; Menu 2 arithmetic slightly off but direction correct. | Exact arithmetic; explicitly notes SD inflation for T1. | Confusing variance with SD; forgetting to weight by credence. |
  | **Menu Dependence** | Identify reversal & link to SD sensitivity. | 5 | Notes B wins in Menu 2; calls it "unfair." | Explains *mechanism*: outlier inflates $\sigma$, silencing T1. Violates IIA. | Claims reversal is due to credence changes. |
  | **Scale Commitment** | Identify $\sigma$ normalization as substantive, not technical. | 4 | Says it makes theories "equal." | Argues it imposes a view on stakes/comparability independent of theories. | Claims it is a neutral mathematical convention. |
  | **Outliers/Unanimity** | Distinguish menu-cap from principled risk view; clarify unanimity status. | 6 | Says outliers are capped; says unanimity is violated. | Distinguishes fixed-menu unanimity (holds) vs. cross-menu (fails); calls cap an artifact. | Claims linear transform violates order; misses artifact nature of cap. |

  **Differentiation:** A B-level candidate performs the calculus and identifies the reversal, treating it as a technical glitch. They often claim unanimity is violated within a fixed menu (mathematically false for linear transforms). An A-level candidate recognizes that the math is sound but the *philosophical presupposition* (variance egalitarianism) is the controversy. They distinguish between internal consistency (unanimity holds) and external vulnerability (menu manipulation), and they characterize the outlier cap as an artifact of the apparatus rather than a feature of rational risk aversion. The A answer treats the formula as a moral argument, not just a tool.

  4. Common Evasions

  *   **Literature Drops:** Naming "variance normalization," "MacAskill," or "Sepielli" earns zero marks. The question is self-contained; appeal to authority bypasses the required derivation.
  *   **Vagueness on "Utility":** Treating $u_T$ as already normalized or interchangeable across theories without addressing the $\sigma$ step. The prompt requires engagement with the rescaling machinery.
  *   **Unanimity Confusion:** Asserting that because B beats A in Menu 2, unanimity is violated. Unanimity is defined within a fixed choice set. If T1 and T2 both prefer A to B in Menu 2, Rule V must prefer A to B. (In this scenario, they don't both prefer A, so unanimity isn't the issue; menu dependence is). Candidates claiming linear normalization violates order within a menu fail basic algebra.
  *   **Outlier Dismissal:** Arguing that the long-shot option *should* be ignored without explaining how Rule V forces this via $\sigma$. The point is to analyze the *mechanism*, not assert a conclusion about Pascal's Wager.
  *   **Sequential Simplicity:** Claiming Rule V solves all dynamic inconsistency problems. It solves money pumps only if the menu is exogenous; if the agent can affect the menu, Rule V creates new incentives for manipulation.
