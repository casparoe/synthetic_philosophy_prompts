      *   *Better:* Give a scenario where an intervention reduces variance in the environment. Ask what happens to $h^2$.
      *   *Best:* The "Uniform Environment" trap. If you equalize the environment, $V_E \to 0$, so $h^2 \to 1$. Does that mean the trait is now "more genetic"? No.
      *   *Question:* "We implement a policy that standardizes nutrition perfectly across a population. Height variance drops slightly, but $V_E$ drops massively. What happens to $h^2$? Does this mean height is now more determined by genes than before?"

  7.  **Setting Boundaries (Deliverable 5):**
