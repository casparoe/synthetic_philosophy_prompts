answer: |-
  Here is a session plan designed to meet your constraints: it leverages the students' quantitative background to bypass the "nature vs. nurture" rhetoric, uses a single controlled example to isolate the statistical logic, and structures the misconceptions so they are preempted rather than corrected.

  ### 1. Sequence and Dependencies

  The logic must flow from **Definition (Statistics)** $\rightarrow$ **Manipulation (The Environment)** $\rightarrow$ **Implication (Policy)** $\rightarrow$ **Complication (GxE/rGE)** $\rightarrow$ **Limit (Groups)**. Do not introduce genetics until you have established the variance ratio.

  1.  **The Statistical Definition (0–10 mins):**
      *   Start with ANOVA. $V_P = V_G + V_E + V_{GxE}$.
      *   Define $h^2 = V_G / V_P$.
      *   *Dependency:* Students must accept $h^2$ as a property of the *distribution*, not the *individual*, before you introduce any biological mechanism.
  2.  **The Core Manipulation (10–25 mins):**
      *   Use the Core Example (see below) to show $V_P$ changing while biology stays constant.
      *   Demonstrate that $h^2$ is a function of the *range of environments* included in $V_E$.
      *   *Dependency:* This must happen before discussing interventions, so the intervention logic rests on the variance ratio, not intuition.
  3.  **The Intervention Implication (25–35 mins):**
      *   Distinguish **Means** from **Variances**.
      *   Show that a shift in the population mean (e.g., everyone gets taller/better scores) is compatible with $h^2 = 1.0$.
      *   *Dependency:* Relies on the previous step establishing that $h^2$ describes variation *around* the mean, not the mean itself.
  4.  **Complications: rGE and GxE (35–40 mins):**
      *   Introduce these now as reasons why $V_G$ and $V_E$ might not be independent summations.
      *   *Dependency:* If introduced earlier, these confuse the definition of $h^2$. Introduced here, they explain why real-world estimates are messy without undermining the statistical definition.
  5.  **The Group Difference Limit (40–45 mins):**
      *   Address the within-group vs. between-group inference.
      *   *Dependency:* Must come last. If raised earlier, it hijacks the session into political debate. It serves as the "boundary condition" of the statistic.

  ### 2. The Core Example

  **Recommendation:** Use a **Fictional Organism ("The Zorp")** with a continuous trait (e.g., "Stalk Height"), measured across **Two Controlled Environments**.

  *   **Why this over a human trait:** Real human traits (height, achievement) carry causal baggage. Students will argue about *whether* nutrition affects height or *whether* schools affect scores. With a fictional organism, you can *stipulate* the causal effects, forcing them to focus on the *variance math*.
  *   **What it must contain:**
      1.  **Identical Genotypes:** Clones or inbred lines (to fix $V_G$ or set it to zero in specific conditions).
      2.  **Two Environments:**
          *   *Environment A (Uniform):* Every Zorp gets identical soil/light. ($V_E \approx 0$).
          *   *Environment B (Variable):* Zorps are scattered across poor, medium, and rich soil. ($V_E > 0$).
      3.  **A "Mean Shift" Mechanism:** A way to show that improving the soil (Environment C) raises the average height without necessarily changing the variance ratio.
  *   **What it must lack:**
      *   **Initial GxE:** Do not start with interaction. Start with additive variance. Add GxE only in the "Complications" section as a twist ("What if Genotype 1 prefers poor soil?").
      *   **Human Policy Language:** Do not call it "achievement" or "income" during the calculation phase. Map it to policy only in the "Implication" section.

  *Argument for this choice:* You suspected the right carrier might be "transparently environmental yet heritable." The Zorp allows you to *make* it so. By holding genetics constant and varying the environment, you prove that a trait can be 100% biologically mediated yet have $h^2 = 0$ (in Env A). Conversely, by holding environment constant, you show a trait can be 100% environmentally mediated yet have $h^2 = 1$ (in Env B). This decouples "causation" from "variance ratio."

  ### 3. Misconceptions and Intervention Points

  Do not save these for a "mythbusting" conclusion. Head them off at the moment they become plausible.

  1.  **The "Inherited" Fallacy (Pre-Session/Minute 1):**
      *   *Misconception:* "Heritability means the trait is passed from parent to child."
      *   *Intervention:* In the definition phase, explicitly contrast **Transmission** (parent $\rightarrow$ offspring) with **Variance Partitioning** (population snapshot). Use the phrase: "Heritability explains differences, not origins."
  2.  **The Immutability Reading (Minute 20):**
      *   *Misconception:* "If $h^2$ is high, the environment can't change the trait."
      *   *Intervention:* During the Core Manipulation, show the "Mean Shift." Show that moving all Zorps to rich soil changes the *mean* drastically even if $h^2$ remains 0.8. Explicitly state: "Heritability constrains *selection*, not *intervention*."
  3.  **The Group Difference Slide (Minute 40):**
      *   *Misconception:* "If Group A has higher scores than Group B, and $h^2$ is high, the difference is genetic."
      *   *Intervention:* In the Limit section, use the "Two Fields" analogy. (Height variance within Field 1 is highly heritable; Height variance within Field 2 is highly heritable; The difference *between* Field 1 and Field 2 is 100% soil).
  4.  **The Overcorrection/Uselessness Conclusion (Minute 45):**
      *   *Misconception:* "If $h^2$ changes with the population, the number is meaningless noise."
      *   *Intervention:* In the closing, reframe utility. It is useful *because* it is sensitive. It tells you how much variation is currently *unexplained* by environment. High $h^2$ in a policy context means "We have successfully equalized the environment; remaining variance is biological."

  ### 4. The Assessment Question

  **The Question:**
  > "Imagine we implement a policy that perfectly equalizes school funding and teacher quality across a district, reducing environmental variance ($V_E$) to near zero. Assuming genetic variance ($V_G$) remains unchanged, what happens to the heritability ($h^2$) of test scores? Does this increase in heritability mean the new policy failed to impact student learning?"

  **Desired Answer:**
  *   $h^2$ **increases** (approaches 1.0) because the denominator ($V_P$) shrinks as $V_E$ vanishes.
  *   The policy **succeeded** (means likely improved, inequality reduced), but the *statistic* rose because environmental *differences* were removed.

  **Answers that should worry you:**
  *   *"$h^2$ decreases."* (Indicates they think $h^2$ measures environmental impact).
  *   *"$h^2$ stays the same."* (Indicates they view $h^2$ as a biological constant).
  *   *"Yes, the policy failed."* (Indicates they have reverted to the Immutability Fallacy).

  ### 5. Boundaries: What to Decline

  You must address group differences because your students (Education Policy) are thinking about SES or racial achievement gaps. If you dodge it, they will assume you are hiding something. If you open it fully, the session becomes a seminar on psychometrics and sociology.

  **The Script:**
  > "A common inference is that high within-group heritability explains between-group differences. Mathematically, this is a fallacy: variance within a group tells us nothing about the cause of the mean difference between groups. Empirically, estimating between-group genetic effects requires experimental controls (like random assignment of genes to environments) that are impossible in human populations. So, for this session: we will analyze the **logical error** of that inference, but we will **not estimate or debate** the heritability of human social groups. The statistic is valid; the data required to apply it to human strata does not exist."

  ### 6. Self-Critique: The Weakest Point

  **Confidence Level:** High on the statistical logic; Moderate on the policy translation.

  **The Riskiest Move:** **The "Equal Environment Increases Heritability" Step.**
  *   *Why:* This is the most counter-intuitive concept in the session. Policy students are trained to think that "equalizing opportunity" is the goal. You are telling them that if they succeed perfectly, heritability estimates will *skyrocket*.
  *   *The Failure Mode:* Students may interpret this as "Equality makes biology more important," which sounds like a justification for inequality. They may reject the math because the implication feels morally wrong.
  *   *Mitigation:* You must explicitly decouple **Importance** from **Variance**. Just because $V_E$ is small (and thus $h^2$ is high) doesn't mean the environment isn't *causally necessary*. (Analogy: Oxygen has $h^2 \approx 0$ for speech variation, but without it, speech is zero. If you equalize oxygen, $h^2$ doesn't change, but if you equalize a *variable* nutrient, $h^2$ goes up).
  *   *Specific Warning:* Watch their faces during the Assessment Question. If they hesitate on the direction of the $h^2$ change, pause and re-run the ANOVA table. Do not move to policy implications until the math of the ratio is settled.
