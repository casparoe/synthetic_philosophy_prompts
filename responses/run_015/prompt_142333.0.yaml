  Leaves

  1. Graded view on knowledge: Awkward commitment: Knowledge is never absolute, always partial. Paging implication: Threshold is a confidence score cutoff, not a binary page.
  2. Practical factors shift belief: Awkward commitment: You believe less when blamed, even with same data. Paging implication: Threshold fixed; belief modeling adjusts paging logic.
  3. Fixed but very high bar: Awkward commitment: You almost never know anything for sure. Paging implication: Threshold is near certainty; pages only for catastrophic evidence.
  4. Knowledge requires action: Awkward commitment: Observers never know anything. Paging implication: Threshold moves; only actors can trigger knowledge-based pages.
  5. Knowledge fixed by evidence, action moves: Awkward commitment: You knew it even if paging was wrong. Paging implication: Threshold fixed by evidence; action rules move with stakes.
  6. Encroachment keyed to subject's stakes: Awkward commitment: Silly bets destroy operational knowledge. Paging implication: Threshold moves with subject's total stakes, even gratuitous ones.
  7. Contrastivism: Awkward commitment: You know it's not lagged but not that it's not spoofed. Paging implication: Threshold moves with the specific error contrast being checked.
  8. Contextualism driven by salient errors: Awkward commitment: "Know" means different things in incident vs standup. Paging implication: Threshold meaning shifts with salient error possibilities.
