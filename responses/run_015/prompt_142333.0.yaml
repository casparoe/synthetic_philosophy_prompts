  The tree

  1. Scenario: Same replication-lag reading used for a weekly report and then for a payments failover.
     Question: Does the statement "I know the lag is safe" change its truth between these two uses, or does only the rule for acting on it change?
     - Only the rule for acting changes -> Go to 2.
     - The truth of the statement changes -> Go to 6.

  2. Scenario: A read-only shadow observer has identical evidence but no possible action.
     Question: Is "knowing" a binary switch that flips on or off, or is it a sliding scale of confidence?
     - It is a sliding scale of confidence -> Leaf: Graded view on knowledge.
     - It is a binary switch -> Go to 3.

  3. Scenario: You'll be personally blamed if you're wrong regardless of the truth.
     Question: Does this personal pressure change your internal level of belief, even if the data is identical?
     - Yes, belief level shifts -> Leaf: Practical factors shift belief.
     - No, belief stays fixed -> Go to 4.

  4. Scenario: Stakes are enormous but being wrong wouldn't change what you'd do anyway.
     Question: Is the evidence bar required to say "I know" set extremely high or at a standard level?
     - Set extremely high -> Leaf: Fixed but very high bar.
     - Set at standard level -> Go to 5.

  5. Scenario: A read-only shadow observer with identical evidence but no possible action.
     Question: Does genuine knowledge require the ability to act on the information?
     - Yes, action is required -> Leaf: Knowledge requires action.
     - No, evidence is enough -> Leaf: Knowledge fixed by evidence, action moves.

  6. Scenario: Stakes are high for a colleague but not for you.
     Question: Whose stakes determine if the claim "I know" is true?
     - Yours (the speaker/actor) -> Go to 7.
     - Theirs (the listener/judge) -> Go to 8.

  7. Scenario: Stakes raised gratuitously, by taking a silly bet that depends on the system state.
     Question: Does this silly bet destroy your knowledge, or only knowledge relative to specific operational errors?
     - Yes, any stakes destroy knowledge -> Leaf: Encroachment keyed to subject's stakes.
     - No, only operational contrasts matter -> Leaf: Contrastivism.

  8. Scenario: An auditor who raises a scenario in which all telemetry is systematically spoofed.
     Question: Does mentioning this spoofing possibility change the meaning of "know" or just the verdict on your claim?
     - Meaning changes -> Leaf: Contextualism driven by salient errors.
     - Verdict changes -> Go to 9.

  9. Scenario: An attributor that is a bot posting to a channel with its own severity budget.
     Question: Do the bot's stakes change how much proof you need to provide, or just whether your claim counts as true?
     - Changes how much proof is needed -> Leaf: Encroachment keyed to attributor's stakes.
