      *   *Pottersville:* This is the "Total Effects" view. It shows the *magnitude* clearly. But is it the right *sign*? Actually, the film asserts the sign is positive (Bedford Falls is better). But the objection says we can't know this. The film *gives* us knowledge we don't have in reality.
      *   *Contrastive:* George compares "Existence" vs. "Non-existence." Consequentialism usually asks "Act A" vs. "Act B." Non-existence isn't an option for an existing agent. This is a category error the film relies on.
      *   *Counterfactual Completeness:* The film shows a deterministic alternate timeline. Real life is probabilistic. Clarence creates a closed loop.
