  ### Scoring Key & Position Mapping

  | Leaf | Path Profile | Philosophical Position |
  | :--- | :--- | :--- |
  | **Leaf 1** | No Flaw | **Hard-Line Impartialist** (Classic Act Utilitarian). The thought is required; integrity objections are sentimental errors. |
  | **Leaf 2** | Content Flaw + Psych Fix | **Empty/Incoherent.** If impartiality is the *wrong standard* (Content), training agents to ignore it (Psych) admits the theory is false but demands we follow it. |
  | **Leaf 3** | Role Flaw + Structural Fix | **Merged/Redundant.** If the *motive* is the problem but the *standard* is right, changing the theory (Structural) usually just codifies the motive, collapsing back into Railton or Virtue Ethics. |
  | **Leaf 4** | Content Flaw + Structural + Projects | **Scheffler.** Agent-centered prerogatives allow you to prioritize your own chosen interests without maximizing the good. |
  | **Leaf 5** | Content Flaw + Structural + Identity | **Williams.** Integrity is about fidelity to commitments that ground your existence, not just freedom to choose plans. |
  | **Leaf 6** | Role Flaw + Psych + Dispositions | **Railton.** Alienation is avoided by adopting dispositions that don't calculate, even though the *rightness* of the act depends on the calculation. |
  | **Leaf 7** | Role Flaw + Psych + Suppression | **Unattractive.** Requires systematic self-deception without the consequentialist payoff of Leaf 6. |

