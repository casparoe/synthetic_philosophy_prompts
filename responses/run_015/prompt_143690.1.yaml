  # Ethics Seminar Sorting Instrument: Integrity & Impartiality

  ### The Cases
  Before entering the tree, hold these two scenarios in mind:
  1.  **The Drowning Wife:** A man saves his wife from drowning. When asked why, is it a problem if he says, "I calculated that saving her maximized overall utility," rather than, "She is my wife"?
  2.  **The Mentor Layoff:** A manager must fire one of two underperforming staff to save the department. One is her former mentor who trained her. She keeps the mentor. Is it a problem if she justifies this via "institutional loyalty norms" vs. "impersonal productivity metrics"?

  ---

  ### The Decision Tree

  **Node 1: The Location of the Corruption**
  In the **Wife Case**, what is wrong with the utilitarian calculation (the "one thought")?
  *   **A.** The calculation is **intrinsically out of place**. Impartial morality has no jurisdiction over intimate acts. (*Content Flaw*)
  *   **B.** The calculation is the **correct standard**, but it should not be **consciously present** in the agent's mind during the act. (*Deliberative Role Flaw*)
  *   **C.** Nothing is wrong. The calculation is the **correct standard and motive**. (*No Flaw*)
      *   → **LEAF 1: Hard-Line Impartialist** (Stop here).

  **Node 2: Case Consistency (Workplace)**
  Does the diagnosis from Node 1 apply identically to the **Mentor Layoff** case?
  *   **A.** **Yes.** The logic of intimacy and professional loyalty is structurally similar regarding impartiality.
  *   **B.** **No.** Professional roles require impartial calculation; intimacy does not.
      *   *Note: If B, you are treating the cases as disanalogous. Proceed to Node 3, but flag that your theory may be context-dependent rather than universal.*

  **Node 3: The Remedy**
  How do we accommodate the intuition that the agent acted correctly (in the Wife Case)?
  *   **A.** **Structural Fix.** We must revise the moral theory itself to permit or require partiality.
  *   **B.** **Psychological/Deliberative Fix.** We keep the theory as the criterion of rightness, but insulate the agent's decision-making process from it.
      *   *If Node 1 was A (Content Flaw) and you choose B (Psych Fix) → **LEAF 2: The Empty Slot** (See Diagnosis Below).*
      *   *If Node 1 was B (Role Flaw) and you choose A (Structural Fix) → **LEAF 3: The Merged Slot** (See Diagnosis Below).*

  **Node 4: Structural Grounding (If Node 3A)**
  If you revised the theory to allow partiality, what justifies this permission?
  *   **A.** **Ground Projects.** Agents need a protected sphere to pursue **chosen** life-plans and interests without moral interference.
      *   → **LEAF 4: Scheffler-Style Prerogative**
  *   **B.** **Identity-Attachments.** Agents are constituted by **unchosen** commitments (relationships, history) that make them who they are; violating these destroys integrity.
      *   → **LEAF 5: Williams-Style Integrity**

  **Node 5: Psychological Mechanism (If Node 3B)**
  If you kept the theory but insulated deliberation, how does the agent operate?
  *   **A.** **Optimal Dispositions.** The agent cultivates non-calculating affections because this *produces* the best outcomes overall (indirect strategy).
      *   → **LEAF 6: Railton-Style Sophistication**
  *   **B.** **Suppressed Calculation.** The agent knows the theory but forcibly ignores it to avoid discomfort.
      *   → **LEAF 7: Unstable Self-Deception** (Generally unattractive).

  **Node 6: The Integrity Split (Diagnostic Check)**
  For those at **Leaf 4** or **Leaf 5**: Does the **Mentor Layoff** case force a separation between your Ground Projects and Identity Attachments?
  *   **A.** **No.** In both cases, the attachment is treated as constitutive.
  *   **B.** **Yes.** The Wife is Identity (unchosen bond); the Mentor is a Project (chosen career path).
      *   *Flag: If you treat the Wife as Identity but the Mentor as a Project, your "Structural" fix is not uniform. You may be sliding between Williams and Scheffler depending on the context.*

