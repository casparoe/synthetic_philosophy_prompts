      *   Kavka's Puzzle highlights the gap between having a reason to intend vs. having a reason to act.
      *   The theory of intention must explain how one can intend to do X even if, at the time of action, one has no reason to do X (or has reasons not to).
      *   For the hospital: When does a past "intention" (advance directive) survive a current "refusal" (lucid contemporaneous decision)?

  3.  **Drafting the Requirements (The List):**
      *   Need to cover the cases provided.
      *   Need to distinguish intention from prediction, wanting, trying, etc.
