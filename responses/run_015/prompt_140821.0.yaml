      *   **Key Reference:** Kavka's Toxin Puzzle (intention vs. action reasons).
      *   **Specific Cases to Include:** Plain toxin, counter-bribe variant, iterated variant, dyadic variant, belief-based payoff variant. Plus ordinary cases (smoker Ulysses contract, traveller non-refundable room, standing intention unacted, intention to fail).
      *   **Constraints:**
          *   No citations/library access (describe claims, not names).
          *   Scorecard (if any) max one line per view, don't displace criteria.
