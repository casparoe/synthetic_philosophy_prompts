answer: |-
  To determine when a past instruction binds a future self, your committee needs a theory of intention that distinguishes *committing to a plan* from *predicting a behavior*. The following specification outlines the requirements such a theory must meet, derived from the cases you provided.

  ### Requirements for a Theory of Intention

  | Requirement | Motivating Case | Status |
  | :--- | :--- | :--- |
  | **1. Intention ≠ Prediction** | **Belief Payoff Variant:** If paid for *believing* you will drink, you might believe it without intending it (e.g., via self-deception). A theory must distinguish the attitude of planning from the attitude of expecting. | **Non-Negotiable** (Genuine Desideratum) |
  | **2. Intention ≠ Wanting** | **Plain Toxin:** You can intend what you do not want (drink toxin) if there is reason to intend. Conversely, you can want what you do not intend. | **Non-Negotiable** (Genuine Desideratum) |
  | **3. Stability Against Known Temptation** | **Counter-Bribe Variant:** You know tomorrow you will be offered money not to drink. Can you intend tonight? A theory must explain if intention locks out future reasons or merely weighs them. | **Non-Negotiable** (Genuine Desideratum) |
  | **4. Iteration Does Not Create Intention** | **Iterated Variant:** Repeating the offer nightly does not make intending possible if it was impossible on night one. Repetition cannot fix a conceptual impossibility. | **Non-Negotiable** (Genuine Desideratum) |
  | **5. Shared Intention ≠ Aggregate** | **Dyadic Variant:** You and a partner are paid for joint intention. The theory must account for interdependent commitment, not just two parallel individual states. | **Non-Negotiable** (Genuine Desideratum) |
  | **6. Intention Allows Expected Failure** | **Intention to Fail:** You can intend to try even if you expect to fail (e.g., saving a drowning person in a storm). | **Camp Commitment** (Contested; some require belief of success) |
  | **7. Intention Creates Reasons** | **Smoker/Traveller:** Locking money or booking a room creates a reason to act later that wouldn't exist otherwise. The theory must explain how past planning generates present reasons. | **Camp Commitment** (Contested; some say reasons must exist independently) |
  | **8. Descriptive vs. Normative** | **The Trap:** A theory must describe *what intention is*, not prescribe *what you ought to do*. Demanding a theory tell you whether to honor the directive smuggles ethics into psychology. | **Non-Negotiable** (Methodological Constraint) |

  ### Incompatibilities and Exclusions

  **The Incompatible Subset:**
  You cannot jointly satisfy **Requirement 1 (Intention ≠ Prediction)**, **Requirement 6 (Intention Allows Expected Failure)**, and the **Camp Commitment that Intention Requires Belief of Success**.
  In the **Counter-Bribe Variant**, you know tonight that tomorrow you will take the bribe and not drink. If intention requires believing you will drink (Belief Constraint), you cannot intend tonight. But if you cannot intend tonight, you cannot form the Ulysses contract (Smoker Case) necessary to bind your future self. A theory that demands belief of success renders advance directives conceptually impossible whenever the patient anticipates a change of mind. Your committee must reject the Belief Constraint to make sense of binding prior instructions.

  **The Exclusionary Requirement:**
  **Requirement 7 (Intention Creates Reasons)** does the most work in excluding candidate theories.
  Simple desire-belief models argue you only intend what you currently desire or have independent reason to do. This fails the **Plain Toxin** and **Smoker** cases. In both, the agent acts against their future desires because of a past plan. A usable theory must accept that the *existence of the plan itself* provides a reason for action at the later time, independent of current desires. Any theory that denies this (claiming reasons must always track current preferences) is unusable for your committee, as it renders all advance directives non-binding by definition.

  ### Note on Normative Work
  Be wary of **Requirement 8**. Many participants implicitly demand the theory solve the ethical problem (i.e., "Tell us if we must ignore the lucid refusal"). A theory of intention can only tell you if a plan was successfully formed. It cannot tell you if that plan morally overrides current autonomy. That is a separate ethical question. Do not reject a psychological theory because it fails to solve the ethical dilemma; reject it only if it cannot describe the mental state of "committing."

  ### Scorecard of Contenders
  *   **Simple Desire Model:** Fails Toxin/Smoker cases; cannot explain binding plans.
  *   **Belief-Constraint Model:** Fails Counter-Brize/Ulysses cases; makes advance directives impossible.
  *   **Planning Agency Model:** Handles Toxin/Smoker; treats intentions as reason-giving states distinct from predictions.
  *   **Social Norm Model:** Handles Dyadic case well; struggles with individual solitary planning.
