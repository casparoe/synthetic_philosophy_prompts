  # Joint Statement on the Localization of Semantic Content

  **Signatories:**
  **Dr. Elena Vance** (Proponent of the Frame-First Thesis)
  **Dr. Marcus Thorne** (Proponent of the Content-First Thesis)

  **Date:** October 24, 2023
  **Subject:** Findings of the Adversarial Collaboration on Message Ontology

  Following a period of structured dialectical exchange regarding the ontology of communication, specifically utilizing the tripartite distinction found in Douglas Hofstadter's *Gödel, Escher, Bach* (Frame, Outer, and Inner Message), we submit this joint statement. While fundamental metaphysical disagreements remain regarding the nature of semantic content, we have successfully delineated the boundaries of our agreement, isolated the precise locus of our disagreement, and identified empirical or conceptual test cases that bear upon the resolution of these disputes.

  ### 1. Agreed Claims

  We jointly affirm the following propositions as the baseline for further inquiry:

  1.  **Adoption of Taxonomy:** We accept Hofstadter's distinction as the shared vocabulary for this inquiry: the **Frame Message** (contextual cues triggering message-recognition), the **Outer Message** (the physical signal/substrate), and the **Inner Message** (the content yielded by decoding).
  2.  **Necessity of the Frame:** We agree that the Frame Message is causally necessary to initiate the decoding process. Without a Frame that successfully identifies an object as a communicative artifact rather than noise or natural phenomenon, no Inner Message can be accessed by a receiver.
  3.  **Physical Supervenience:** We agree that the Outer Message supervenes on physical properties. In the case of the interstellar gold-alloy disc, the spiral groove's geometry is a fixed physical fact independent of interpretation.
  4.  **The Common Case of Underdetermination:** We agree that in the specific case of the gold-alloy disc, the physical structure (Outer Message) supports at least two mutually inconsistent, internally coherent decodings (Elemental Composition vs. Molecular Instructions). Both decodings are equally supported by the physical data absent external context.
  5.  **Recoverability in Principle:** We agree that for a message to function communicatively, the Inner Message must be recoverable *in principle* by a receiver possessing the appropriate Frame and decoding key. We disagree, however, on whether "recoverable in principle" implies a unique recovery path (Content-First) or allows for multiple valid recovery paths (Frame-First).
  6.  **Identification of Verbal Dispute:** We acknowledge that a portion of our dispute is terminological. Specifically, we use the phrase "Inner Message" to track different phenomena:
      *   **Frame-First** uses "Inner Message" to refer to *the semantic value realized in the act of successful interpretation.*
      *   **Content-First** uses "Inner Message" to refer to *the invariant semantic intent preserved across successful interpretations.*
      *   We agree that if the dispute were *solely* verbal, we could simply stipulate definitions. However, we maintain that a substantive metaphysical disagreement remains regarding whether a fact of the matter exists prior to interpretation.

  ### 2. Residual Disagreements

  The following table outlines the substantive disagreements that remain after clarifying terminology. Each row addresses the same ontological issue but is phrased in the terminology each party finds most accurate.

  | Issue | Frame-First Formulation (Vance) | Content-First Formulation (Thorne) |
  | :--- | :--- | :--- |
  | **Status of the Underdetermined Disc** | The disc possesses two distinct Inner Messages simultaneously. Meaning is plural because decoding practices are plural. | The disc possesses one determinate Inner Message. The existence of two decodings indicates an epistemic limitation, not semantic plurality. |
  | **Nature of the Inner Message** | The Inner Message is a relational property emerging between the Outer Message and the Receiver's Frame. | The Inner Message is an intrinsic property of the transmission, anchored by the Sender's intent or objective fact. |
  | **Criterion for Correctness** | A decoding is "correct" if it yields a coherent system of belief or action within the Receiver's context. | A decoding is "correct" only if it preserves the invariant content intended by the source structure. |
  | **Role of the Frame** | The Frame partially constitutes the Inner Message; change the Frame, and you change the Message. | The Frame unlocks the Inner Message; change the Frame, and you either access the Message or fail to access it. |

  ### 3. The Cruxes

  We identify two primary philosophical cruxes that sustain the disagreements listed above.

  **Crux A: The Fact of the Matter in Underdetermination**
  Does the underdetermination of decoding (as seen in the gold disc case) imply that there is no fact of the matter regarding the Inner Message until a decoding is chosen?
  *   *Frame-First:* Yes. Meaning is use. Without a specific use/decoding, the content is indeterminate.
  *   *Content-First:* No. The underdetermination is epistemic (we don't know which is true), not ontological (both are not true).

  **Crux B: Invariance as the Test of Content**
  Is invariance across different successful frames the necessary condition for identifying the "true" Inner Message?
  *   *Frame-First:* No. Invariance is an ideal, not a requirement. Meaning can be local to a frame without losing its status as meaning.
  *   *Content-First:* Yes. If content changes when the frame changes, we are not observing the *same* message, but rather the generation of a *new* message. The "Inner Message" is defined by its invariance.

  ### 4. Further Cases and Predicted Outcomes

  To adjudicate or further clarify these cruxes, we propose the following test cases. We record our divergent predictions in advance to ensure falsifiability of our respective models.

  #### Case 1: The "Lost Key" Cipher
  **Scenario:** A message is intercepted with a perfect Frame (identified as a letter) and a clear Outer Message (encrypted text), but the decoding key is lost forever. No coherent decoding is ever achieved.
  *   **Question:** Does an Inner Message exist?
  *   **Frame-First Prediction:** **No.** Without actual decoding practice, there is no semantic content. There is only the *potential* for meaning, which is distinct from meaning itself.
  *   **Content-First Prediction:** **Yes.** The Inner Message exists as a determinate fact (the plaintext), even if it is permanently unrecovered. The failure is in the receiver, not the message.

  #### Case 2: The Musical Community (Decisive Case)
  **Scenario:** A physically identical gold-alloy disc is encountered by a community whose Frame differs radically from the scientific consensus. They recognize the disc as artificial (Frame succeeds) but interpret the spiral groove not as data storage, but as a physical score for a musical performance (the stylus movement creates sound). They decode it as a symphony. This decoding is internally coherent and aesthetically satisfying to them.
  *   **Question:** Does this community recover the *same* Inner Message, a *different* one, or *none*?
  *   **Frame-First Prediction:** **A Different One.** Because the Frame determines the category of the object, the Inner Message is constituted as music. For this community, the message *is* a symphony. There is no "original" message that overrides their successful decoding practice.
  *   **Content-First Prediction:** **None (regarding the original message).** They have generated a *new* message using the Outer Message as a substrate. They have not recovered the *invariant* Inner Message (Star Composition or Molecule Instructions). While their experience is valid aesthetically, semantically they have failed to access the content preserved by the transmission structure.

  ***

  **Signed,**

  *(Signature)*
  **Dr. Elena Vance**
  *Frame-First Theorist*

  *(Signature)*
  **Dr. Marcus Thorne**
  *Content-First Theorist*
