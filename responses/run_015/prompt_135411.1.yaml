          *   *Selected Criterion:* **Decisional Proximity.** Is the patient/family currently facing a specific care transition (e.g., LVAD vs. Hospice) where this statistic is materially relevant? If not, disclosure is abstract and more likely to be performative/harmful.
      *   **Personal Note:** Acknowledge the personal stake briefly but professionally to establish gravity without recusing.

