          *   Need to validate the family's point. Is "path-sensitive fatalism" coherent? Yes, because medical predictions are *performative*, not just descriptive. In physics, observing a particle changes it; in medicine, telling a patient they are dying can make them die sooner (nocebo/withdrawal of hope).
          *   However, can physicians operationalize this without speculation? This is the weak point of the family's argument. Physicians are bad at guessing counterfactuals ("how long would he have lived?").
