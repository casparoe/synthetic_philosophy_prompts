      *   Section 3: The Killer Question (Recursive Vulnerability).

      *(Self-Correction during drafting)*: Make sure the "Soft Spot" is distinct from the Reply. The Reply is what I say; the Soft Spot is where I'm actually vulnerable if they push harder.

