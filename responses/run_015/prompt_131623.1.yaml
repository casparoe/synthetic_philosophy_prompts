      *   **Thesis:** Institutional forecasting needs reference-class base rates for *both* the outcome *and* the institution's selection/weighting of those reference classes. Without the second layer, inside-view bias creeps back in via strategic framing of the comparison class.
      *   **Audience:** Behavioral economists (forecasting tournaments), philosophers of social science (reference-class problem, self-locating belief), decision theorists. *No* lawyers or policymakers.
      *   **Format:** Q&A prep sheet ordered by "damage potential" (not generic skepticism).
      *   **Requirements per Objection:** Who raises it, phrased in their vocabulary, 90-second reply, flag the soft spot.
      *   **Opening Remarks:** What to concede upfront to defuse attacks.
      *   **The "Killer Question":** The recursive vulnerability question (is *your* framework vulnerable to the same problem?), and how to answer without defensiveness.
      *   **Tone:** Practical, crowded session (not a dissertation defense).

  2.  **Deconstruct the Audience & Thesis:**
      *   *Behavioral Economists (Forecasting Tournaments):* Care about calibration, scoring rules, empirical performance, Good Judgment Project style metrics. They worry about tractability and implementation.
      *   *Philosophers of Social Science:* Care about the metaphysics of reference classes, the "reference class problem" (Hájek), self-locating uncertainty, infinite regress worries. They will attack the coherence of the second layer.
      *   *Decision Theorists:* Care about rationality axioms, coherence, Dutch books, expected utility. They will worry about circularity or paralysis.
      *   *The Thesis:* It's a meta-forecasting claim. It says "Don't just look at the data; look at how you chose the data."
      *   *The Vulnerability:* Infinite regress (who watches the watchmen?), operationalization (how do you base-rate the base-rate selection?), and empirical necessity (does this actually improve accuracy or just add noise?).

  3.  **Identify High-Damage Objections (ordered by potential to derail the talk):**
      *   *1. The Infinite Regress/Paralysis Objection (Philosophers/Decision Theorists):* If I need a reference class for my reference class selection, do I need one for that selection? This leads to skepticism or paralysis. This is the core theoretical threat.
      *   *2. The Empirical/Tractability Objection (Behavioral Economists):* How do you measure this? Where is the data for "reference class selection accuracy"? If you can't score it, it's not science. This threatens the practical utility.
      *   *3. The "Inside View in Disguise" Objection (Decision Theorists/Philosophers):* Choosing the *meta*-reference class is just as subjective as choosing the *first-order* reference class. You haven't solved bias; you've just moved it up a level.
      *   *4. The "Good Enough" Objection (Behavioral Economists):* Standard outside view already beats inside view. Is the marginal gain of the second layer worth the cognitive cost?

  4.  **Drafting the Content (Iterative Process):**

      *   *Opening Concessions:* Need to admit I don't have a perfect algorithm. Admit the regress risk. Admit this is a heuristic/normative ideal, not a turnkey solution.
      *   *Objection 1 (Regress):* Phil of Social Science. "Isn't this just the reference class problem reiterated?" Reply: It's a stopping rule based on variance reduction, not metaphysical certainty. Soft spot: Defining the stopping rule is subjective.
      *   *Objection 2 (Data/Scoring):* Behavioral Econ. "How do you score the meta-forecast?" Reply: Use tournament data on *forecasters*, not just events. Track forecaster calibration over time. Soft spot: Requires long time horizons, might not exist for specific institutions.
      *   *Objection 3 (Displacement of Bias):* Decision Theorist. "You haven't eliminated the inside view; you've displaced it." Reply: Concede. Goal isn't elimination, it's *dilution* and making bias expensive. Soft spot: Hard to prove "expensive" without cost-benefit analysis.
      *   *The Killer Question (Self-Application):* "Is your double-layered view subject to the double-layered view?" Reply: Yes, explicitly. It's a fixed point, not a foundation. Embrace the reflexivity.

  5.  **Refining the Vocabulary:**
      *   *Behavioral Econ:* Calibration, Brier scores, noise reduction, tractability, marginal utility.
      *   *Philosophers:* Reference class problem, self-locating belief, regress, normative vs. descriptive, meta-induction.
      *   *Decision Theorists:* Coherence, priors, higher-order probabilities, rationality constraints.

  6.  **Review against Constraints:**
