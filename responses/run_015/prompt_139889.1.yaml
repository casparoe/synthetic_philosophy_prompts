answer: |-
  # JOINT STATEMENT ON THE PROCREATION ASYMMETRY

  **Parties:** The Asymmetrist, The Symmetricist
  **Date:** October 24, 2023
  **Subject:** Residual Agreement and Disagreement on Reasons for Future People

  ### I. Agreed Claims

  1.  **Welfarism:** Welfare is the sole non-instrumental constituent of a life's value for the person living it.
      *   *Note:* Prevents appeal to sacredness or species duties to resolve disputes.
  2.  **Non-Identity:** Choices regarding who to create involve different individuals across alternatives, not the same individual in different states.
      *   *Note:* Blocks harm-based objections that rely on identity preservation.
  3.  **Agony Constraint:** Creating a life consisting solely of suffering is impermissible.
      *   *Note:* Establishes a shared lower bound for moral permissibility.
  4.  **No Duty to Procreate:** There is no moral duty to bring happy people into existence.
      *   *Note:* Isolates the asymmetry from general obligations to continue the species.
  5.  **Risk Sensitivity:** Moral permissibility is sensitive to the probability of outcomes, not just expected value.
      *   *Note:* Allows divergence on how risk weights against potential benefits.
  6.  **Axiological/Deontic Distinction:** Claims about value (better/worse) are distinct from claims about reasons or duties (ought/ought not).
      *   *Note:* Permits agreement on value while disagreeing on action-guiding force.
  7.  **Baseline:** The relevant baseline for comparison in creation cases is non-existence, not a different possible life.
      *   *Note:* Focuses the debate on the existence/non-existence comparison specifically.
  8.  **Scope:** Moral concern extends to any entity capable of sentient experience, not solely biological humans.
      *   *Note:* Ensures the Hour-Long Mind case is relevant to the core theory.
  9.  **Acyclicity:** Rational choice requires that options do not form a cycle (A > B > C > A).
      *   *Note:* Forces a resolution on the Mere Addition Paradox structure.
  10. **Empirical Input:** Facts about the typical quality of human life inform the application of moral principles.
      *   *Note:* Acknowledges that empirical optimism/pessimism drives some intuitive divergence.

  ### II. Disagreements Table

  | Issue | Asymmetrist Formulation | Symmetricist Formulation | Verbal/Substantive & Settlement |
  | :--- | :--- | :--- | :--- |
  | **Structure of Reasons** | Reasons to create and reasons to avoid differ in kind; the absence of benefit is not a loss. | Reasons differ only in weight; the absence of benefit is a loss of potential value. | **Substantive.** Settled by the Ten-Percent Child threshold curve shape. |
  | **Source of Value (Substitute)** | The reason to choose the happy child is solely to avoid the suffering episode in the other. | The reason includes both avoiding suffering and securing the greater net welfare. | **Substantive.** Settled by whether compensation within a life negates the reason. |
  | **Aggregation vs. Negative Limb** | The negative limb (avoiding bad lives) vetoes the aggregation of positive lives. | Sufficient aggregation of positive lives can outweigh the negative limb. | **Substantive.** Settled by the Million and One permissibility verdict. |
  | **Scope of Asymmetry** | The asymmetry applies to persons within a social practice of procreation. | The asymmetry applies (or fails) for all welfare-bearing entities universally. | **Verbal.** Settled by whether the Hour-Long Mind intuition triggers retreat. |

  ### III. Cruxes

  **1. The Ten-Percent Child Threshold**
  *   **Sub-question:** At what probability of a life below neutral does creation become impermissible?
  *   **Why it matters:** If the threshold is near zero, the Asymmetrist's negative limb dominates risk calculation. If it tracks expected value, the Symmetricist's risk-weighting suffices.
  *   **Shared Case:** A child has a 90% chance of a +10 welfare life and a 10% chance of a -5 welfare life.
  *   **Predictions:** Asymmetrist: Impermissible if risk > 1%. Symmetricist: Permissible if Expected Value > 0 (threshold ~50% for this spread).

  **2. The Substitute Reason**
  *   **Sub-question:** Does the greater happiness of the first child provide a reason to choose it over the second?
  *   **Why it matters:** If yes, the asymmetry's negative limb is not the sole driver; beneficence is symmetric. If no, the asymmetry is strictly about avoiding harm.
  *   **Shared Case:** Choice between Child A (+10 net) and Child B (+5 net, includes decade of uncompensated suffering).
  *   **Predictions:** Asymmetrist: Reason is 100% suffering avoidance; happiness gain contributes 0 weight. Symmetricist: Happiness gain contributes positive weight alongside suffering avoidance.

  **3. The Million and One**
  *   **Sub-question:** Does aggregating many barely-good lives override the creation of one bad life?
  *   **Why it matters:** Tests whether the asymmetry is a local constraint or subject to utilitarian aggregation.
  *   **Shared Case:** Create 1,000,000 lives at +1 welfare and 1 life at -100 welfare, vs. create nobody.
  *   **Predictions:** Asymmetrist: Impermissible. The negative limb is a veto. Symmetricist: Permissible. The aggregate sum (+999,900) outweighs the loss.

  **4. The Cycle Block**
  *   **Sub-question:** Which premise blocks the intransitivity cycle generated by Mere Addition?
  *   **Why it matters:** If the asymmetry generates cycles, it violates rational choice constraints unless a specific premise is rejected.
  *   **Shared Case:** A (Few Happy) vs. B (Many Happy + One Sad) vs. C (Many Happy).
  *   **Predictions:** Asymmetrist: Blocks cycle via Person-Affecting Restriction (B is not worse than A). Symmetricist: Blocks cycle via Transitivity (A is better than C, so B must be ranked).

  ### IV. Closing Note

  **Verdict on Disagreements:** Three of the four disagreements are substantive. The dispute over the Structure of Reasons is not merely linguistic; it predicts divergent behavior in risk cases (Crux 1). The Scope disagreement is verbal only insofar as both sides agree sentient minds matter, but diverge on whether "procreation" is a special category; we treat this as substantive regarding the theory's generality.

  **Decisive Crux:** We expect **Crux 1 (The Ten-Percent Child)** to be decisive. The Asymmetrist relies on the intuition that any risk of a bad life is prohibitive without compensating benefit. The Symmetricist relies on the intuition that ordinary risk aversion explains this without needing a structural asymmetry. If the Asymmetrist admits that a 0.0001% risk is permissible, they concede that risk aversion, not asymmetry, is doing the work. We predict this favors the **Symmetricist**, because few can maintain a strict veto at negligible probabilities without abandoning plausible moral action.

  **Suspected Refusals:** A hardline Asymmetrist will refuse **Agreed Claim 9 (Acyclicity)** if preserving the asymmetry requires accepting cycles in large-number cases. A hardline Symmetricist will refuse **Agreed Claim 4 (No Duty to Procreate)** if their view implies that maximizing value creates a duty when costs are low.

  **Framing Choice:** We framed the document around **Reasons** rather than Value. While the asymmetry is often stated axiologically, the practical stake is permissibility. A view can hold that a happy existence is "better" than non-existence (axiological symmetry) while denying there is a reason to create it (deontic asymmetry). We chose the deontic framing because both parties agree that action-guidance is the ultimate test of the theory, and the axiological claim is often used merely to support the deontic one. Focusing on reasons forces the parties to reveal whether the asymmetry is a metaphysical claim about value or a pragmatic constraint on choice.
