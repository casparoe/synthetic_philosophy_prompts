answer: |-
  This is a remarkably sharp synthesis. You have not "reinvented" it in the sense of stumbling upon something unknown to scholars, but you have independently reconstructed a line of argument that sits at the very frontier of philosophy of religion and philosophy of physics.

  As a physicist, you are looking at the ontology of the model. As a philosopher, I can tell you that your intuition tracks with some of the best critiques of causation, though there are nuances in the history and the physics where you might be overstepping slightly.

  Here is the breakdown of where you are right, where the historical record adds texture, and where the physics might bite back.

  ### 1. Ghazali vs. Hume: Is it just "God in the slot"?

  You are correct that the structural similarity between al-Ghazali (11th century) and Hume (18th century) is striking. Both deny that we can observe a "necessary connection" between cause and effect. Both reduce observed causality to constant conjunction.

  However, your critique that Ghazali offers "no philosophical gain" and just adds an entity misses the fundamental metaphysical divergence between them.

  *   **Hume is Epistemological:** Hume argues that we *cannot know* if there is a necessary connection. He leaves the door open that there might be powers in objects, but human cognition is limited to observing sequences. His "habit" is a psychological mechanism in the observer.
  *   **Ghazali is Ontological:** Ghazali argues there *is no* necessary connection in nature. It is not that we can't see the glue; it's that the glue doesn't exist. The "habit" (*'adah*) is not in the human mind, but in the Divine Will. God voluntarily constrains Himself to act consistently so the universe is intelligible, but He is not bound by it (hence miracles are possible without violating logic).

  **The "Extra Entity" Critique:**
  To treat God as "Hume plus one entity" is a category error. In Ghazali's framework (and classical theism generally), God is not an entity *within* the causal chain filling a gap (a "God of the gaps"). God is the ground of being itself. The claim isn't "Fire + God -> Burn." The claim is "God wills 'Fire' and 'Burn' to appear in conjunction."
  So, the philosophical gain for Ghazali is the preservation of Divine Omnipotence against the Aristotelian notion that nature constrains God. For Hume, the gain is the preservation of Skepticism against Rationalism. They are playing different games.

  ### 2. The Quantum Mechanics Connection

  This is your strongest insight. You ask: *Shouldn't a modern occasionalist say the statistics are God's habit and each particular outcome is where the divine choice shows itself?*

  **You are in good company here.**
  There is a recognized argument in contemporary philosophy of religion that Ontological Indeterminism (if true) creates a "causal gap" that occasionalism fills elegantly.
  *   **The Standard View:** In Copenhagen-style interpretations, the collapse of the wave function is acausal. It just happens.
  *   **The Occasionalist View:** If nature provides no sufficient reason for *this* specific outcome rather than *that* one (since both were probabilistically allowed), then the selection requires a will.

  If the statistics are stable (the Born rule), that corresponds to Ghazali's *'adah* (God's customary way of acting). If the individual outcome is truly undetermined by prior physical states, that corresponds to the moment-by-moment recreation/choice.

  **Where you might go wrong:**
  You say QM "directly confirms" this. That is too strong.
  1.  **Interpretations vary:** QM *allows* for ontological indeterminism, but it does not prove it. Bohmian Mechanics (Pilot Wave) is deterministic. Many-Worlds is deterministic (unitary evolution only). Occasionalism fits best with *ontic* collapse theories, but physics has not settled on an ontology yet.
  2.  **Brute Facticity:** A naturalist will argue that the specific outcome is a "brute fact." It needs no explanation. The occasionalist argues that brute facts are intellectually unsatisfying and point to volition. QM makes occasionalism *plausible*, but it doesn't force it.

  ### 3. The Textbook Claim: "Occasionalism minus God"

  Your line: *"A physics textbook that gives you only states, evolution laws and correlations and never once says cause is already describing an occasionalist world minus God."*

  **Is this fair?**
  Yes. In fact, you have independently rediscovered Bertrand Russell's famous argument in his 1912 paper *"On the Notion of Cause."*

  Russell argued that advanced physics (even classical field theory at the time) had abolished "cause." Physics deals with **functional correlations** and **differential equations**, not "A produces B."
  *   **The Equation:** $F=ma$ does not say force *causes* acceleration. It says force and acceleration are mathematically correlated across time.
  *   **The Worldview:** If you take the textbook literally, the universe is a series of states connected by mathematical rules. There is no "oomph" or "power" in the equations.

  **The Verdict:**
  You are describing a **Humean World** (or a Neo-Humean "Best Systems" world).
  *   **The Atheist/Naturalist** looks at the textbook and says: "There are just states and rules. No cause needed."
  *   **The Occasionalist** looks at the textbook and says: "There are just states and rules. Therefore, the continuity of existence must be sustained by a Will outside the system."

  The math is identical. The ontology is what differs. So your claim is fair, provided you acknowledge that the "minus God" part is the entire battleground. The textbook describes the *phenomena* that both the naturalist and the occasionalist agree on. It is neutral on the *noumena*.

  ### 4. A Note for Your Argument with Your Friend

  Since you are debating a friend interested in Islamic theology, you should be aware of the counter-move.

  Al-Ghazali was not the last word in Islamic philosophy. **Ibn Rushd (Averroes)** wrote *The Incoherence of the Incoherence* specifically to refute Ghazali.
  *   **Ibn Rushd's Argument:** If you deny secondary causality (the fire's power to burn), you make knowledge of the world impossible. If things have no natures, science is just cataloging God's habits, not understanding reality. Furthermore, it makes God responsible for evil directly in a way that compromises divine wisdom.
  *   **The Modern Parallel:** This is the debate between **Instrumentalism** (physics just predicts outcomes, like Ghazali) vs. **Scientific Realism** (physics describes real powers/structures, like Ibn Rushd).

  ### Summary

  1.  **Ghazali vs. Hume:** You understood the mechanism correctly, but underestimated the metaphysical weight Ghazali gives to God (Ground of Being vs. Gap Filler).
  2.  **QM:** Your intuition is philosophically sound and shared by contemporary thinkers, but be careful not to claim QM *proves* it. It merely removes the barrier of determinism that made occasionalism seem silly to modern minds.
  3.  **Textbooks:** Your line is fair and historically precedented (Russell). Physics describes correlations; "Causation" is the metaphysical interpretation of those correlations.

  You haven't reinvented the wheel, but you have built a very fine chassis for it. You are essentially arguing for a **Theistic Humean Supervenience**, which is a legitimate and robust position in current analytic philosophy of religion. Keep arguing with your friend; you're asking the right questions.
