          *   *Assessment:* This is a standard comparison in philosophy of religion. However, there are nuances. Hume is epistemological/skeptical (we *can't know* necessity); Ghazali is metaphysical/theological (there *is no* necessity in creatures, only in God's will). Also, Ghazali preserves miracles more easily than Hume. The "no gain" part is debatable depending on whether one values theological coherence over ontological parsimony.
      *   **Claim 3: Occasionalism & Quantum Mechanics.**
