answer: |-
  Hi there, thanks for sending over the notes about the last session, and I think you are right to want to tweak the corridor exercise rather than ditching it entirely because the core idea is solid even if the execution felt a bit clunky. The main issue last time was that the secrecy around the envelopes made people feel tested rather than involved, which triggers defensiveness, so this time we are going to be upfront about the fact that there are different conditions without revealing who has which one until the very end. This keeps the integrity of the exercise intact because nobody can claim they were lied to, but it still preserves the surprise of finding out which group they were in. We need to prepare eighteen identical envelopes beforehand, but inside we will have two different instruction cards printed on the same paper so they feel and look the same from the outside. Half the cards will say please take this form to the kitchen and bring back a spare key, noting that the programme coordinator is waiting for these urgently so please be as quick as you can, while the other half will say the same task but add that there is no rush and please take your time to look around the centre on your way. We also need two co-facilitators to act as the staged mishap, one dropping a folder full of papers in the narrow corridor between the training room and the kitchen, acting flustered but not desperate, and we need to stagger the volunteers so they leave the room in pairs or threes rather than all at once to avoid crowding the incident.

  For the timeline, we should spend the first ten minutes settling the group after lunch and asking them to take out a piece of paper and write down privately whether they would stop to help a stranger who dropped papers in a corridor, followed by writing one adjective to describe the sort of person who would walk past without stopping, and collecting these in a box immediately so they cannot change their minds later. Then spend five minutes explaining the errand task, explicitly telling them that some envelopes contain slightly different instructions about timing and that this is part of the learning exercise, but asking them strictly not to compare instructions with each other until the debrief. Over the next twenty minutes, send them out in small waves so the corridor incident happens when there is a steady flow of traffic, ensuring the actors drop the papers at random intervals so it does not look coordinated with specific volunteers. Once everyone has returned, give them ten minutes to write down quietly what they did, whether they stopped, and how they felt during the task, without sharing with neighbours. This leaves us with forty minutes for the debrief, which is where the real work happens, and we need to structure this carefully so it does not feel like a lecture.

  Start the debrief by asking for a show of hands on who stopped to help, and then ask the group to guess what percentage of the room they think wrote down a negative adjective for someone who would not stop, which will likely be high, before revealing the actual number of people who walked past. Then ask the group to open their envelopes and see which instruction they had, and map the helping behaviour against the urgency cue, which will likely show that the rushed group helped less regardless of their earlier prediction. This is the moment to introduce the gap between what they believed about their own character before entering the corridor and what they actually did when under a specific pressure, pointing out that the only thing that changed was a single sentence on a card rather than a change in who they are as people. At this point, you must invite the sceptical view explicitly, perhaps by saying that some people argue this only shows that good people had a bad day, and that their character is still stable over the long term, and you should direct this question to the experienced mentors who might be feeling resistant so they feel heard rather than corrected. Let them argue that character is what you do over a lifetime, not in one corridor, and validate that point because it is true, before countering with the observation that if a small time pressure can override their stated intentions in five minutes, then relying on character alone to protect vulnerable young people might be risky without supporting structures.

  When you reach the theoretical wrap-up, you can finally use the words virtue and situationist to name what they have just experienced, explaining that the traditional view assumes character is a fixed trait like height, while the alternative view suggests behaviour is more like weather, dependent on the local pressure systems around us. You need to be honest about the limitations of what we have just done, acknowledging that this activity cannot show whether someone is consistent across their whole life or whether the kind of character worth having is a rare thing or a local, situation-by-situation thing, and you should say that bit yourself so they know you are not overclaiming. Admit that this does not prove character does not exist, only that it is more fragile than we like to think, and that the goal of mentoring is not to find perfect people but to create situations where good behaviour is easier to sustain. Regarding what might go wrong, the most likely issue is that everyone helps regardless of the instruction, in which case you pivot the discussion to how it felt to help while rushed versus relaxed, focusing on the quality of the interaction rather than the binary choice. If nobody helps, which is unlikely but possible, you frame it as evidence of how powerful the environment is, noting that even a room full of trained volunteers was stopped by a piece of paper, which reinforces the need for systemic support. If participants compare notes early and ruin the surprise, do not panic, just ask them to hold the information until the debrief and use the breach itself as data on how hard it is to keep confidences under social pressure.

  Finally, make sure you brief the co-facilitators playing the mishap to keep their reaction consistent, neither too dramatic nor too subtle, and ensure they do not make eye contact that begs for help, as that changes the dynamic from a passive opportunity to an active request. We should also prepare a few spare envelopes in case someone loses theirs, and ensure the route to the kitchen is the only obvious path so we do not have people wandering off elsewhere. The key to making the sceptics feel safe is to maintain a tone of curiosity rather than accusation, framing the exercise as something we are all subject to rather than a test they have passed or failed, and emphasising that understanding these pressures makes us better mentors rather than exposing us as hypocrites. If you can hold that line, the grumpier mentors should feel like partners in the inquiry rather than subjects of it, and the gap year volunteers should feel like their instincts are being taken seriously rather than dismissed. Let me know if you want to run through the scripts for the envelopes before we print them, but otherwise I think this structure gives us the best chance of landing the point without losing the room.
