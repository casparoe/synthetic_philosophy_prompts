  ***

  **Logical Identity and the Boundaries of Cooperation**

  Standard evidential cooperation in large worlds (ECL) relies on the premise that agents are distinct entities whose decision algorithms are sufficiently similar that one choice provides evidence about the other. In the standard case, correlation arises from shared reasoning types across distinct tokens. However, the scenario involving Agent X and Agent Y presents a radical simplification: they are not merely similar; they are token-identical instantiations of the same deterministic algorithm, Z, running in causally disconnected universes. This shift from similarity to identity fundamentally alters the normative landscape, collapsing the distinction between evidential cooperation and self-cooperation, while simultaneously testing the limits of logical correlation as a basis for decision theory.

  First, we must determine whether X's decision is evidentially supported by Y's behavior or if the token identity collapses the "other" into the "self." In standard ECL, X reasons that because Y is similar, Y will likely reason similarly; thus, cooperating provides evidence that Y cooperates. Here, however, the correlation is not probabilistic evidence; it is logical necessity. Because Z is deterministic, X's output *is* Y's output. There is no independent variable to gather evidence about. The situation is not analogous to two strangers coordinating; it is analogous to a single agent deciding for two distinct locations simultaneously. Consequently, X's decision is not evidentially supported by Y; rather, X's decision *constitutes* Y's decision. This collapses the interpersonal framework into an intrapersonal one. X is not cooperating with an "other"; X is maximizing utility across two instances of itself. The evidential link is replaced by an identity link.

  Second, does this demonstrate that evidential cooperation rests on pure logical correlation, and is it vulnerable to the calculator objection? The calculator objection posits that if logical correlation suffices for cooperation, then two calculators displaying "4" when asked "2+2" are cooperating. This reductio ad absurdum threatens to trivialize cooperation. However, the objection fails because it conflates correlation with normative agency. Calculators lack utility functions; they have no stakes in the outcome. Cooperation is a decision-theoretic concept applicable only to entities capable of maximizing payoffs. In the X/Y scenario, both instances face a Prisoner's Dilemma with associated utilities. The logical correlation matters only because the agents care about the outcome. Therefore, logical correlation is sufficient for cooperation *provided* the correlated systems are agents with utility functions. The calculator objection is dismissed not by denying the correlation, but by denying the agency.

  Third, does this scenario strengthen or weaken the case for cooperating in large worlds? It strengthens the case for logical correlation but weakens the reliance on causal or counterfactual dependence. If cooperation holds in the X/Y case despite zero causal contact and perfect determinism, it suggests that causal influence is not necessary for cooperative norms to apply. What matters is the subjunctive dependence of the output on the decision algorithm. However, this strengthens the view only if we maintain a robust definition of agency. If we loosen the criteria too much, we risk the overgeneration warned against by the calculator objection. The scenario shows that ECL is more robust than causal decision theory suggests, as it applies even in cases of token identity across disconnected worlds. Yet, it also warns that without careful boundaries regarding what counts as an "agent," the theory becomes vacuous.

  In conclusion, the X/Y scenario transforms the problem from one of evidential inference to one of logical identity. X does not cooperate with Y; X cooperates with itself across universes. This supports the view that logical correlation, rather than causal connection, is the bedrock of cooperative rationality. However, this conclusion holds only when restricted to entities with genuine stakes. The calculator objection fails because calculators do not maximize utility. Ultimately, this scenario strengthens the case for logical cooperation in large worlds by demonstrating that causal isolation is irrelevant, provided the logical structure of the decision algorithm is shared and the entities involved are true agents. The normative force comes not from the ability to change the other, but from the recognition that the other is, logically, you.
