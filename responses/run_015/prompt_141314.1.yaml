          *   Must test a specific suspicion/trilemma (Non-question-begging + Determinate Verdicts + Metaphysical Neutrality).
          *   Must identify the most exclusionary requirement and any unmeetable desiderata.
          *   Must include a short scoring table (under 1/3 of the answer) comparing 5 views (Parity-Functionalist, Commonsense/Coupling, Diachronic/Systems, Enactive, Enculturation/Integration).
          *   Must include a 5-line coda on explanatory vs. normative purpose.
          *   **Word Count:** Approx. 1,400 words.
          *   **Style:** Philosophical argument, no references/citations, dense and precise.

  2.  **Deconstruct the Desiderata (The "Criteria"):**

      *   *Goal:* A criterion for attributing a resource to a subject for legal/moral purposes.
      *   *Requirements:*
          1.  **Verdict Stability:** Must give yes/no answers for institutions (courts/ethics committees).
          2.  **Subject Specificity:** Must say *whose* system it is (crucial for Shared/Monitored cases).
          3.  **Non-Question-Begging:** Cannot simply define "cognitive" as "intracranial" or "functional role" without justification.
          4.  **Case Coverage:** Must handle the 7 specific cases provided.
          5.  **Metaphysical Neutrality:** Ideally shouldn't commit to one philosophy of mind (Functionalism vs. Enactivism, etc.) if possible, though this is part of the trilemma.

  3.  **Address the Trilemma:**

      *   *Horn 1:* Non-question-begging (neutral criteria).
      *   *Horn 2:* Determinate Verdicts (legal utility).
      *   *Horn 3:* Metaphysical Neutrality.
      *   *Analysis:* You can't have all three. Legal utility requires determinacy. Determinacy usually requires committing to a specific metaphysical mechanism (e.g., functional integration vs. causal coupling). Metaphysical neutrality leads to indeterminacy (because different metaphysics yield different verdicts on the Drifting/Shared cases).
      *   *Conclusion:* Drop Metaphysical Neutrality. Legal attribution *requires* a committed ontology of the person to determine boundaries.

  4.  **Evaluate the "Camp Prejudices" (Desiderata Critique):**

      *   *Parity Principle:* It's a dialectical device, not a sufficient criterion. It overgenerates (bloat). *Verdict:* Strike as a standalone criterion; keep as a heuristic.
      *   *Intrinsic Content:* This is anti-externalist bias. *Verdict:* Strike.
      *   *Phenomenological Coincidence:* Consciousness and cognition come apart (sleep, unconscious bias). *Verdict:* Strike.
      *   *Cognitive Bloat:* This is the real constraint. If everything is cognitive, nothing is protected. *Verdict:* Non-negotiable for legal purposes.
      *   *Endogenous Change:* The criterion must handle plasticity. *Verdict:* Non-negotiable.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Set the stage. The shift from survey to specification. The core tension (attribution vs. metaphysics).
      *   **Desiderata Analysis:** Go through the list. Distinguish non-negotiables from prejudices.
