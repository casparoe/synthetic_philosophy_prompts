answer: |-
  To specify a theory of cognitive extension for legal and moral attribution, we must distinguish between metaphysical descriptions of mind and normative boundaries of the person. The purpose here is not to explain how cognition works, but to determine when interference with a resource constitutes injury to a subject. This shifts the desiderata from explanatory adequacy to administrative adjudicability. The following criteria are derived from the requirement that a court or ethics committee must issue a stable verdict on ownership, injury, and compellability.

  **Desiderata: Non-Negotiables, Preferences, and Strikes**

  Three requirements are non-negotiable for this normative purpose. First, **Verdict Stability**: the criterion must yield binary outcomes in contested cases. A legal system cannot administer a continuum of "partial cognition." Second, **Subject Specificity**: the criterion must identify *whose* cognitive system includes the resource. This is dictated by the **Shared Resource** case; if two collaborators rely equally on a joint store, the theory must decide if this creates joint cognitive personhood or splits the resource, as data-protection claims will conflict. Third, **Bloat Avoidance**: the criterion must exclude the internet, the linguistic community, and the laboratory from the legal self. If everything is cognitive, nothing is protected; the **Notebook** contrast case (personal notebook vs. public directory) demands a boundary that respects individual agency without retreating to the skull.

  Two demands are camp preferences wearing the clothes of necessities. The **Parity Principle** (if it works like a brain process, it is part of the mind) is a dialectical device, not a sufficient criterion. It overgenerates in the **Dormant** and **Monitored** cases; a tool can function like a memory without being constitutive of the *person* liable for injury. The demand for **Phenomenological Coincidence** (cognition must match consciousness) should be struck. The **Drifting Resource** case shows that standing commitments exist during sleep or unconscious processing; requiring avowal at the moment of update excludes standard memory consolidation and neural plasticity from protection.

  One demand is question-begging and must be reformulated. The requirement for **Intrinsic Content** is often an anti-externalist conclusion disguised as a premise. It should be replaced by a requirement for **Agential Integration**: the subject must have a history of shaping or maintaining the resource's reliability. This handles the **Inscrutable Resource** case: a subject need not survey the code of a neural implant, but must have established a trust relationship with its output distinct from the **Monitored** case where the state shapes the output.

  **The Trilemma: Neutrality, Determinacy, and Non-Begging**

  You suspect a trilemma between: (1) Non-question-begging criteria (not simply "intracranial"), (2) Determinate Verdicts (for law), and (3) Metaphysical Neutrality (between functionalism, enactivism, etc.). All three cannot be held. I argue that **Metaphysical Neutrality** must be dropped to preserve the other two.

  Legal attribution is inherently ontological. To rule on the **Withdrawal Pair** (external loss vs. brain lesion), the court must commit to a specific theory of what constitutes the functional unit of the agent. Functionalism and Enactivism yield different verdicts on the **Drifting Resource**. Functionalism asks if the resource plays the causal role of belief; Enactivism asks if the resource is part of the sensorimotor loop of autonomy. If the theory remains neutral, it cannot provide the **Verdict Stability** required for the **Compelled Production** context. Furthermore, a neutral criterion risks being question-begging by defaulting to the status quo (the skull) whenever metaphysics are unclear. Therefore, the surviving pair is **Non-Question-Begging** (extension is possible) and **Determinate Verdicts** (boundaries are sharp), purchased at the cost of adopting a specific metaphysics of integration. For legal purposes, a "Diachronic Systems" view is superior: a resource is part of the person if it is reliably integrated into the subject's decision-making loop over time and resistant to external manipulation.

  **Exclusionary Work and Unmeetable Desiderata**

  The requirement doing the most exclusionary work is **Diachronic Integration**. It filters out the **Dormant Resource** (not currently integrated) and the **Public Directory** (never integrated). It also resolves the **Inscrutable Resource** case: reliability is not enough; the history of the coupling matters. A desideratum that should be struck as unmeetable is **Applicability in Advance by a Researcher**. Cognitive extension is often an empirical discovery of how a specific subject couples with their environment. Demanding a priori certainty forces the criterion to be so abstract it fails the **Shared** and **Monitored** cases. The law must adjudicate retrospectively on the facts of integration, not prospectively on the type of device.

  **Scoring the Accounts**

  The table below evaluates five accounts against the non-negotiable desiderata: Verdict Stability, Subject Specificity, and Bloat Avoidance.

  | Account | Verdict Stability | Subject Specificity | Bloat Avoidance | Handling of Shared/Drifting Cases |
  | :--- | :--- | :--- | :--- | :--- |
  | **Parity-Functionalist** | Low. Continuous degrees of functional isomorphism make binary legal verdicts difficult. | Low. Struggles to individuate subjects in **Shared Resource** cases; risks merging minds. | Low. High risk of bloat; any functionally equivalent resource counts. | Fails **Drifting**; if the function is met, the update counts immediately, ignoring avowal latency. |
  | **Commonsense/Coupling** | High. Relies on intuitive boundaries (ownership, physical possession). | High. Defaults to legal ownership, easily assigning resources to individuals. | High. Strictly limits extension to owned tools. | Fails **Notebook** contrast; treats automatic notebook same as public directory if ownership is unclear. |
  | **Diachronic Systems** | High. Uses integration history to draw sharp lines. | High. Traces the specific history of coupling to identify the subject. | High. Requires deep, sustained integration, excluding transient tools. | Handles **Drifting** via integration history; handles **Shared** via joint maintenance records. |
  | **Enactive/Autonomy** | Medium. Focuses on autonomy constraints, which can be vague legally. | Medium. Defines subjects by autonomous loops, which may overlap. | High. Only resources sustaining autonomy count. | Strong on **Monitored** case (autonomy violation); weak on **Injury** (hard to quantify autonomy loss). |
  | **Enculturation/Integration** | Medium. Cultural practices vary, making stable verdicts hard. | Low. Cognitive systems often span communities, blurring legal liability. | Medium. Risks including linguistic norms as part of the person. | Strong on **Inscrutable** (trust via practice); weak on **Compelled Production** (community resources). |

  **Analysis of the Scores**

  The **Parity-Functionalist** account fails the legal purpose because it prioritizes metaphysical symmetry over administrative boundary-drawing. It cannot resolve the **Shared Resource** conflict without arbitrary addition. The **Commonsense/Coupling** view satisfies legal stability but fails the philosophical constraint; it treats the neural implant as property rather than person, failing the **Injury** context's normative demand. The **Enactive** view offers the best protection against the **Monitored Resource** (surveillance undermines autonomy), but its verdicts are too sensitive to contextual nuance for stable legal administration.

  The **Diachronic Systems** account emerges as the most viable for your chapter. It treats the **Withdrawal Pair** correctly: both brain lesions and loss of integrated tools disrupt the diachronic system. It handles the **Dormant Resource** by distinguishing between a tool in the drawer (potential) and a tool in the loop (actual). Crucially, it resolves the **Shared Resource** case by looking at the maintenance history: if both maintain it, it is a joint cognitive system, requiring joint consent for production or creating joint standing for injury. This avoids the individualist framing break you noted. However, it requires the law to accept that "persons" can be partially constituted by external histories, a significant ontological commitment.

  The tension you located regarding symmetry, bloat, and causal criteria is resolved by noting that **symmetry** is the culprit. Demanding that outer resources meet the exact same criteria as inner neurons (symmetry) causes bloat because neurons are always integrated, while tools are often transient. Dropping symmetry in favor of **Integration Depth** allows for extension without bloat. A resource need not be symmetric to a neuron to be part of the person; it need only be symmetric to the *role* the neuron plays in the specific subject's life history.

  Finally, regarding your suspicion that some desiderata are jointly unsatisfiable: the demand for **Metaphysical Neutrality** is the casualty. A legal theory of cognitive liberty cannot be neutral about the nature of the person. It must assert that the person is a system that can include external components under specific conditions. To refuse this is to default to intracranialism by silence.

  **Coda**

  If the purpose were explanatory rather than normative, the requirement for **Verdict Stability** would drop out. A cognitive scientist benefits from gradients and partial coupling to model learning, whereas a court requires binary liability. Explanatory adequacy tolerates the **Shared Resource** ambiguity as a feature of distributed cognition; normative attribution must resolve it to assign rights.
