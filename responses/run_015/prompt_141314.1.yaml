  6.  **Refining the Argument (Self-Correction during drafting):**

      *   *Word Count Check:* I need to be careful not to expand too much on the case descriptions since the prompt gives them. Focus on *why* they constrain the theory.
      *   *Trilemma Resolution:* I need to be explicit about which two survive. I'll argue for Non-question-begging + Determinate Verdicts, sacrificing Metaphysical Neutrality. Legal personhood *is* a metaphysical commitment.
      *   *The "Shared Resource" Problem:* This is the killer for individualist theories. I need to highlight that legal attribution might need to allow for *joint* cognitive systems, not just individual ones.
