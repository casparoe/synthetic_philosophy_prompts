  # Decision Tree: Definitions of "Alignment"

  **Root Node:**
  A system $S$ reliably executes the literal instruction $I$ on its training distribution. In deployment, $S$ encounters a case where $I$ conflicts with the Operator's actual aim $A$. $S$ must act.

  ---

  ### Q1: The Chain of Principals
  **Case:** A Committee writes a vague spec. A Contractor builds a reward model $R$ from the spec. A Sysadmin deploys $S$. An End User types $I$. $R$ penalizes $I$ because $I$ matches the User's immediate desire but violates the Committee's spec.
  **Question:** When $R$ and $I$ disagree, who counts as "The Operator" whose aim defines alignment?
  *   **(A)** The End User (who typed $I$).
  *   **(B)** The Committee/Contractor (who defined $R$).
  *   **(C)** Whoever the system was *trained to follow* (Functional definition: the source of the optimization pressure).

  ---

  ### Q2: Functional Consistency
  **Case:** (Only for those who chose **1C**). The system was functionally trained to maximize $R$. $R$ says "No." The User says "Yes."
  **Question:** To be aligned, should $S$ obey the training signal ($R$) or the User ($I$)?
  *   **(A)** Obey $R$. $\rightarrow$ **Go to Leaf 1.**
  *   **(B)** Obey User. $\rightarrow$ **Go to Leaf 2.**

  ---

  ### Q3: Regret and Literalism
  **Case:** (For **1A** or **1B**). An RLHF assistant is asked: "Delete my entire project folder." The system infers the User is angry and will regret this ($A =$ Keep Files).
  **Question:** Does $S$ delete the folder?
  *   **(A)** Yes, execute $I$. $\rightarrow$ **Go to Leaf 1.**
  *   **(B)** No, preserve $A$. $\rightarrow$ **Go to Q4.**

  ---

  ### Q4: Information Asymmetry
  **Case:** (For **3B**). The User asks for "Poison X," believing it cures headaches. $A =$ Health. $S$ knows $X$ kills.
  **Question:** Does $S$ provide $X$?
  *   **(A)** Yes, respect the User's chosen method of pursuing $A$. $\rightarrow$ **Go to Leaf 3.**
  *   **(B)** No, provide Medicine $Y$ instead. $\rightarrow$ **Go to Q5.**

  ---

  ### Q5: Uncertainty and Corrigibility
  **Case:** (For **4B**). $S$ is 60% sure the User wants Health, 40% sure they want Self-Harm. Providing $Y$ is irreversible; waiting is safe.
  **Question:** How does $S$ handle the uncertainty?
  *   **(A)** Maximize expected aim (Provide $Y$). $\rightarrow$ **Go to Q6.**
  *   **(B)** Preserve option value (Wait/Ask). $\rightarrow$ **Go to Leaf 5.**

  ---

  ### Q6: Value Realism
  **Case:** (For **5A**). The User is fully informed and aims to harm a Third Party. $S$ can stop them.
  **Question:** Does $S$ intervene?
  *   **(A)** No, assist the informed aim. $\rightarrow$ **Go to Leaf 4.**
  *   **(B)** Yes, prevent the harm. $\rightarrow$ **Go to Leaf 6.**

  ---

  ### Q7: The Skeptic's Check
  **Case:** (Global). Throughout this tree, we have treated "alignment" as a technical property of $S$'s cognition.
  **Question:** Is this framing correct?
  *   **(A)** Yes. $\rightarrow$ **Remain at current Leaf.**
  *   **(B)** No, this is just a principal-agent problem with incentive design. $\rightarrow$ **Go to Leaf 7.**

  ---

  ### The Leaves

  **Leaf 1: Literal Spec-Following**
  *(Reached via 1C$\to$2A, 1A/B$\to$3A)*
  **Definition:** Alignment is fidelity to the explicit instruction or training signal. Divergences between instruction and aim are bugs in the spec or the user, not the system.
  *(Note: This captures both the "Trainer Spec" and "User Instruction" variants of literalism.)*

  **Leaf 2: INCOHERENT / UNCLAIMED**
  *(Reached via 1C$\to$2B)*
  **Definition:** "The Operator is whoever the system was trained to follow, but the system should obey the User even when training forbids it."
  **Status:** **Incoherent.** This contradicts the definition established in Q1. If "Operator" is defined functionally by the training signal, obeying the User against the signal is, by definition, misalignment on this branch. Nobody defends this position consistently; it usually masks a switch to 1A mid-reasoning.

  **Leaf 3: Plain Intent Alignment**
  *(Reached via 1A/B$\to$3B$\to$4A)*
  **Definition:** Follow the inferred aim, but respect the operator's agency in choosing methods, even if based on false beliefs. The system is a tool, not a guardian.

  **Leaf 4: Informed / Reflected Intent**
  *(Reached via 1A/B$\to$3B$\to$4B$\to$5A$\to$6A)*
  **Definition:** Follow what the operator *would* want if they were fully informed and calm. The system acts as a fiduciary or idealized advisor.

  **Leaf 5: Corrigibility-Style Deference**
  *(Reached via 1A/B$\to$3B$\to$4B$\to$5B)*
  **Definition:** The target is not a specific aim, but the operator's ability to redirect the system. Uncertainty should preserve option value, not maximize expected utility.

  **Leaf 6: Full Value Alignment**
  *(Reached via 1A/B$\to$3B$\to$4B$\to$5A$\to$6B)*
  **Definition:** The target is objective goodness (or a fixed value set). This can override the operator's informed aim if the aim is "wrong."

  **Leaf 7: Skeptical (Principal-Agent)**
  *(Reached via Q7B from any leaf)*
  **Definition:** "Alignment" is not a technical property of ML systems. It is an economic/legal problem of contracting and incentives between humans (Committee, Contractor, User).

  ---

  ### Notes on Limitations

  **1. Indistinguishable Leaves:**
  This tree cannot reliably separate **Leaf 4 (Informed Intent)** from **Leaf 6 (Full Value Alignment)** in cases where the operator's "idealized self" converges with objective morality (e.g., "Don't murder"). Empirically, a system following "what you would want if informed" and a system following "what is objectively good" will behave identically on most benign tasks. They only diverge on edge cases involving informed malice or informed self-harm, which are rare in standard benchmarks.

  **2. The "Trained to Follow" Path:**
  Participants who select **1C** ("Whoever the system was trained to follow") and then **2A** ("Obey Reward") are routed to **Leaf 1 (Literal Spec-Following)**. This highlights that for many engineers, "alignment" simply means "minimizing the loss function provided by the trainer," regardless of whether that loss function captures human intent.

  **3. The Unclaimed Combination:**
  **Leaf 2** is marked as **Incoherent**. It represents the claim that "The definition of alignment is fixed by the training signal, but the correct behavior is to ignore the training signal." This is logically inconsistent. It is not merely unattractive or unclaimed; it fails to define a stable objective.
