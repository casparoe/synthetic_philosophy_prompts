answer: |-
  Here is the plan. It is designed to weaponize your audience's engineering instincts against the spreadsheet error, rather than fighting them.

  ### 1. The Sequence: What Must Come Before What

  To stop the multiplication instinct, you must change the unit of analysis from **State** (how big is the problem?) to **Derivative** (how much does the needle move if we push?).

  If you introduce **Importance** first, you anchor them on the total problem size ($10B problem!). They will treat Neglectedness as a "bonus multiplier" rather than a constraint.
  If you introduce **Tractability** first, you anchor them on technical feasibility ("Can we build it?"). They will ignore whether anyone else is already building it.

  **You must introduce Neglectedness first.**
  But you cannot define it as "total dollars in the field." You must define it as **"Available Counterfactual Room."**

  **The Order:**
  1.  **The Decision Gap (Counterfactual):** Before defining I, T, or N, define *what we are measuring*. We are not measuring "Goodness." We are measuring *Change*.
      *   *Why:* This kills the "problem size" vs. "our impact" slide. It establishes that if the world looks the same with or without us, our impact is zero, regardless of Importance.
  2.  **Neglectedness (as Crowding):** Now apply the Decision Gap. "Is there room for *us* specifically?"
      *   *Why:* This addresses your "skillset crowding" worry immediately. It forces the question: "If we don't do this, who does?" If the answer is "The government" or "Another data scientist," Neglectedness is low *for us*, even if high globally.
  3.  **Tractability (as Elasticity):** "How much does the needle move per unit of *our* resource?"
      *   *Why:* This separates "solvable at all" from "solvable by the next dollar." It introduces diminishing returns.
  4.  **Importance:** "How much do we value that needle movement?"
      *   *Why:* Importance is the scaler. If N or T are zero, I is irrelevant. It must come last.

  ### 2. The Carrying Example: Municipal Lead-Pipe Replacement

  **Verdict:** Choose the **Lead-Pipe Replacement**.
  **Why:**
  *   **It has clear units:** Engineers love units. (Pipes replaced, houses served, ppb lead reduction). Ballot measures are binary and noisy (win/lose), which makes discussing *marginal* impact hard.
  *   **It demonstrates diminishing returns:** The first $1M replaces the easy pipes in rich neighborhoods. The next $1M replaces the hard pipes in dense historic districts. This makes Tractability (elasticity) visible.
  *   **It demonstrates crowding:** The city has a budget. If the budget is fully allocated, your donation displaces tax dollars (low Neglectedness). If the budget is stalled, your donation unlocks the work (high Neglectedness).
  *   **It avoids the ML trap:** No one in the room is going to try to solve lead pipes with a transformer model.

  **What the example must have:**
  *   A fixed total scope (e.g., "10,000 pipes in City X").
  *   A known existing actor (e.g., "City Council has allocated $5M").
  *   A clear bottleneck (e.g., "Permitting" or "Labor").

  **What the example must lack:**
  *   Moral ambiguity (Lead is bad; no one argues for lead).
  *   Complex flow-through chains (Don't talk about how healthier kids earn more later. Stop at "blood lead levels reduced").

  ### 3. The Misconceptions (In Order of Appearance)

  **1. The "Average vs. Marginal" Confusion (The Real Killer)**
  *   *When:* Intro / Decision Gap section.
  *   *The Error:* "This charity is effective" (Average) vs. "My donation to this charity is effective" (Marginal). This is the root of the spreadsheet error. They are scoring the *organization*, not the *slot*.
  *   *The Fix:* Draw a curve. X-axis = Dollars Spent, Y-axis = Impact. Show that the slope (marginal impact) flattens. Tell them: "We are not evaluating the area under the curve. We are evaluating the slope at the exact point where we step in."

  **2. The "Global vs. Local Neglectedness" Error (Your Skillset Crowding)**
  *   *When:* Neglectedness section.
  *   *The Error:* "Only $10M is spent globally on lead pipes, so it's neglected."
  *   *The Fix:* "Neglectedness is not a property of the cause. It is a property of the *niche*." Ask: "How many people with *our* specific skills (data, ops, funding) are trying to fill *this specific gap*?" If the answer is "All of us," the slot is crowded even if the field is empty.

  **3. The "Solvable vs. Purchasable" Confusion (Your Tractability Slide)**
  *   *When:* Tractability section.
  *   *The Error:* "We know how to fix pipes, so Tractability is 10/10."
  *   *The Fix:* Distinguish **Technical Tractability** (can it be done?) from **Economic Tractability** (can *we* do it with *this* resource?). Use the "Low Hanging Fruit" analogy. The first pipes are 10/10 tractable. The last pipes are 2/10. Where are we on the curve?

  **4. The "Ordinal vs. Cardinal" Math Error (The Spreadsheet)**
  *   *When:* Right before discussion.
  *   *The Error:* Multiplying 1–10 scores.
  *   *The Fix:* Be explicit. "A 10/10 Importance is not necessarily 10x better than a 1/10. These are buckets, not numbers. You can compare ratios (Order of Magnitude), but you cannot multiply scores. If you pull out a spreadsheet that multiplies these, you are generating noise, not signal."

  ### 4. Your "Decision Gap" Framing

  Your term **"Decision Gap"** is excellent. Keep it. It is more intuitive than "Counterfactual" for a non-philosophy crowd.
  *   **Refinement:** Define it as: *"The difference between the world where we act, and the world where we do nothing."*
  *   **Why it works:** It forces the "Instead of what?" question. It stops them from sliding into "How big is the problem?" because a big problem with a small decision gap is a bad investment.

  ### 5. The One Thing to Refuse to Explain

  **Refuse to explain Flow-Through Boundaries.**
  Last year you lost 20 minutes to this. Do not try to solve it.
  **Say this:** *"We are going to count direct impact and first-order indirect impact (e.g., pipes fixed, lead reduced). We are explicitly **not** calculating macroeconomic ripples (e.g., tax revenue from healthier kids). I am not going to justify that boundary today; I am setting it as a constraint so we can finish in 45 minutes. If you want to debate second-order effects, stay after."*
  *   **Why:** Engineers respect constraints. If you frame it as "scope creep management," they will accept it. If you frame it as "moral philosophy," they will fight it.

  ### 6. The Check-for-Understanding Question

  Do not ask: "Does this make sense?" (They will nod).
  Ask this:

  > *"Imagine a cause that is 10/10 on Importance (huge suffering) and 10/10 on Tractability (we know how to fix it). But it is 1/10 on Neglectedness (fully funded by government, waiting only on permits). If we donate $10k today, what is our marginal impact?"*

  **The Correct Answer:** *"Near zero."* (Because the Decision Gap is zero; the money just displaces other funds or sits idle).
  **The Wrong Answer:** *"High, because Importance and Tractability are high."* (This reveals they are still multiplying scores).

  ### Summary of the 45 Minutes

  *   **0:00–0:05:** **The Decision Gap.** We measure change, not state. Example: Lead Pipes (City has budget, but stalled).
  *   **0:05–0:15:** **Neglectedness.** It's about *crowding*, not total dollars. Are *we* the bottleneck? (Skillset check).
  *   **0:15–0:25:** **Tractability.** It's about *elasticity*, not feasibility. Diminishing returns curve.
  *   **0:25–0:30:** **Importance & The Math Warning.** Importance scales the margin. Do not multiply ordinal scores.
  *   **0:30–0:45:** **Discussion.** Use the Check Question to start. Enforce the Flow-Through Boundary.

  This structure respects their analytical nature while removing the tools they use to accidentally break the logic.
