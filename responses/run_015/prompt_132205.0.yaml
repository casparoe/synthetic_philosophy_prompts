      *   *Skillset Crowding:* Address this in Neglectedness. "Global neglectedness $\neq$ Local neglectedness."
      *   *The "Real Killer" Misconception:* **Confusing Average with Marginal.** (e.g., "This charity is effective" vs "My donation to this charity is effective"). This underpins the spreadsheet error.

