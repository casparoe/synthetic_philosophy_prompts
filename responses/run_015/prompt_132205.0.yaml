      *   *Flow-through:* Bound it early. "We count direct + 1st order indirect. We do not count macroeconomic ripples."
      *   *Spreadsheet Scoring:* Explicitly ban cardinal math on ordinal scales. Use "orders of magnitude" instead of 1-10.
