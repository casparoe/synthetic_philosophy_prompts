      *   Du Bois isn't saying art *should* be propaganda in the sense of crude agitation. He's saying art *is inevitably* propaganda because it reveals truth about a people, and for Black Americans, revealing that truth is a political act against racism.
      *   The "aesthetic part" is crucial because the *form* carries the truth that explicit argument cannot. It's about the *representation of humanity* through beauty/truth, which counters the dehumanizing stereotypes.
      *   Sociology students might lean towards functionalism (art serves a function) or reductionism (art = politics). Need to steer them toward the *phenomenological* or *experiential* power of art that changes perception rather than just policy.
      *   The "double-consciousness" link: Art allows the synthesis of the two selves, presenting a unified humanity that propaganda (in the crude sense) might fracture.

  3.  **Drafting the Plan - Step-by-Step:**

      *   **Bottom Line:** The session must establish that for Du Bois, aesthetic form is the *only* vehicle capable of transmitting the truth of Black humanity necessary to dismantle racism, making propaganda an ontological condition of Black art rather than a stylistic choice.
      *   **Order of Ideas:**
          1.  Define "Propaganda" historically (not just lying/manipulation, but "propagation of faith/idea").
          2.  Define the Sociological Problem (the "Veil"/double-consciousness as a barrier to being seen as human).
          3.  Introduce the Limit of Explicit Argument (statistics/poleemics fail to generate empathy/recognition).
          4.  Introduce the Aesthetic Solution (Beauty/Truth forces recognition of humanity).
          5.  Synthesize: Art is propaganda *because* it succeeds where argument fails.
      *   **Carrying Example:** Sorrow Songs (as suggested).
          *   *Needs:* To show emotional truth, universal humanity, specific Black experience, endurance/beauty amidst suffering.
          *   *Avoids:* Explicit lyrical demands for voting rights, crude agitation, pure misery without transcendence.
          *   *Why:* It proves the "message" is in the *existence* and *quality* of the song, not just the lyrics.
      *   **Misconceptions & Defusal:**
          1.  *Misconception:* Art reduced to politics (instrumentalism). *Defusal:* Early, when defining propaganda. Emphasize "Beauty" as a prerequisite.
          2.  *Misconception:* Propaganda = Lies/Manipulation. *Defusal:* When discussing the etymology/function. Contrast with "Truth."
          3.  *Misconception:* Black art = Suffering porn. *Defusal:* When discussing the Sorrow Songs. Focus on the *triumph* and *humanity* in the form, not just the content of pain.
      *   **End-Check:** A hypothetical piece classification. Needs to distinguish between "Political Art" (explicit message) and "Du Boisian Propaganda" (aesthetic truth forcing recognition).
      *   **Exclusions:** Kantian "Disinterestedness." Explicitly state you are bracketing the philosophical genealogy to focus on the sociological function of form.
      *   **Addressing the Friend:** The plan must show that without the aesthetic component, the "propaganda" fails to achieve the sociological goal (recognition).

  4.  **Refining the Constraints:**
