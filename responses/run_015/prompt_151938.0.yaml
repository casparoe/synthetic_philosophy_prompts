answer: |-
  You must structure the session to demonstrate that for Du Bois, aesthetic form is the exclusive mechanism capable of transmitting the truth of Black humanity required to dismantle racism, rendering propaganda an ontological condition of Black art rather than a stylistic choice.

  **1. Sequence of Ideas**
  To prevent "propaganda" from collapsing into "manipulation," you must land the concepts in this specific causal chain:
  1.  **Redefine Propaganda:** Begin with the etymology of "propagating" a faith or truth, distinct from "lying" or "coercion." Establish that for Du Bois, all art propagates *something* (a view of the world); the only question is *what* it propagates.
  2.  **The Sociological Barrier (The Veil):** Explain double-consciousness not just as internal conflict, but as a external barrier to recognition. The white world refuses to see Black humanity as complete.
  3.  **The Failure of Explicit Argument:** Demonstrate why sociological data and political demands fail to pierce the Veil. Facts do not generate empathy; they generate debate.
  4.  **The Necessity of Aesthetic Form:** Argue that Beauty/Truth in art forces a phenomenological shift in the viewer that argument cannot. The *form* compels recognition of shared humanity before the viewer can reject the *content*.
  5.  **The Inevitability:** Conclude that because Black art *must* overcome the Veil to exist publicly, it is *always* propaganda. It is not a choice to be political; it is a condition of being Black art in a racist society.

  **2. The Carrying Example: The Sorrow Songs**
  Your instinct to use the Sorrow Songs is correct, but only if you curate them to prove the aesthetic dependency.
  *   **What it must have:** The example must exhibit technical mastery and transcendence (beauty) that exists independently of a political demand. It must convey a universal human emotion (grief, hope) through a specifically Black cultural form.
  *   **What it must avoid:** Do not use songs with explicit lyrical calls for voting rights, escape instructions (like some coded spirituals), or pure lamentation without resolution. If the song asks for something specific, the students will reduce it to instrumentalism.
  *   **Why this works against your friend:** The Sorrow Songs prove the aesthetic part isn't optional because a raw cry of pain (without form/beauty) would be dismissed as noise by the dominant culture. It is the *beauty* of the song that forces the white listener to acknowledge the humanity of the singer, thereby achieving the political goal without explicit argument.

  **3. Misconceptions and Defusal Points**
  *   **Misconception 1: "He is reducing beauty to politics." (Instrumentalism)**
      *   *When it forms:* Immediately upon hearing the word "propaganda."
      *   *Where to defuse:* **Step 1.** Explicitly state Du Bois's criterion: "Art is not successful unless it is beautiful." If it fails aesthetically, it fails as propaganda. Beauty is the *condition*, politics is the *consequence*.
  *   **Misconception 2: "Propaganda means lying or manipulation."**
      *   *When it forms:* During the definition phase.
      *   *Where to defuse:* **Step 1.** Contrast Du Bois's use with WWII/poster art. Emphasize his pairing of propaganda with "Truth." For Du Bois, the propaganda is the *revealing* of a truth that is being suppressed.
  *   **Misconception 3: "Black art should only depict suffering."**
      *   *When it forms:* During the Sorrow Songs discussion.
      *   *Where to defuse:* **Step 4.** Clarify that the goal is not to showcase pain, but to showcase *humanity* enduring pain. The propaganda is the existence of the complex inner life, not the trauma itself.

  **4. The End-Check: Classification Task**
  To prove they understand the dependency rather than the slogan, present two hypothetical pieces and ask which qualifies as Du Boisian propaganda:
  *   **Piece A:** A sociological pamphlet with accurate statistics on lynching and a demand for federal legislation.
  *   **Piece B:** A poem depicting the inner monologue of a Black father worrying about his son, using complex metaphor and rhythm, with no mention of laws or rights.
  *   **Correct Answer:** Piece B.
  *   **Reasoning Required:** Students must articulate that Piece A is political argument (which fails to pierce the Veil), while Piece B uses *aesthetic form* to force recognition of humanity, thereby functioning as propaganda in the Du Boisian sense. If they choose A, they have missed the aesthetic dependency.

  **5. Explicit Exclusions**
  You must openly refuse to cover the **Kantian framework of "disinterested pleasure."**
  *   **Why:** Sociology students will get bogged down in debating universal standards of beauty vs. cultural relativism.
  *   **What to say:** "We are bracketing the philosophical genealogy of aesthetics today. We are not asking if Beauty is universal; we are analyzing the sociological function of aesthetic reception. Whether the beauty is 'real' matters less than its effect on the viewer's recognition of the subject."
  *   **Also Exclude:** Comparisons to Socialist Realism. This invites Cold War definitions of propaganda that will derail the specific racial ontology Du Bois is constructing.
