  **NORTHVALE CORRECTIONAL AUTHORITY**
  **Office of Sanction Design**
  **MEMORANDUM 24-09**
  **DATE:** Year 3, Post-Desert Statute
  **SUBJECT:** Linguistic Compliance and Sanction Integrity Protocols

  **PURPOSE**
  This guide ensures all external communications and internal case notes align with the Abolition Statute. Personnel must avoid vocabulary implying moral merit or ultimate responsibility. Our mission is risk mitigation and public health, not retribution. However, sanction legitimacy depends on public perception of fairness. Staff must balance clinical accuracy with the structural requirements of the institution.

  **TABLE 1: TERMINOLOGY MAPPING**

  | Desert-Era Phrase | Approved Post-Desert Equivalent |
  | :--- | :--- |
  | Guilty / Culpable | Risk Source Confirmed |
  | Sentence / Tariff | Containment Period |
  | Punishment | Intervention / Sanction |
  | Blame / Censure | Causal Attribution |
  | Rehabilitation | Risk Reduction Programming |
  | Deserves | Requires / Warrants |

  **ENTRY 1: PROPORTIONALITY AND SIGNAL INTEGRITY**
  Sanctions must appear consistent to maintain compliance. Although containment periods are determined by the Halberd-7 risk instrument, deviations from historical tariffs risk perceived arbitrariness. If a low-risk subject is released significantly earlier than the historical tariff for similar acts, public trust erodes. Conversely, holding a subject too long without risk justification invites legal challenge.

  *Reference Case 8940:* Subject committed low-level property damage. Halberd-7 scores indicate low recidivism risk. However, releasing Subject 8940 immediately would undermine the general signal requirement. The public expects a correlation between harm caused and containment duration. Staff should align containment periods with historical tariffs where possible, citing "standardized intervention protocols" rather than risk scores alone. The sanction must express appropriate gravity to maintain systemic legitimacy.

  **ENTRY 2: SUBJECT OBJECTIONS TO MANAGEMENT**
  Some subjects insist they "did wrong" and "deserve punishment." They view risk management as demeaning or dismissive of their moral agency. Do not argue metaphysics. Frame this resistance as therapeutic non-compliance.

  *Protocol:* Acknowledge the distress but reiterate the medical model. "You are not being blamed; you are being managed for safety." However, if a subject insists on accountability, allow them to draft apology letters, provided these are categorized as "restorative exercises" rather than admissions of culpability. Denying their desire for moral reckoning can increase agitation and risk scores.

  **ENTRY 3: STATIC RISK AND INDEFINITE CONTAINMENT**
  When a subject's condition is untreatable and the Halberd-7 score remains high, release is impossible. There is no "sentence end" in a quarantine model, only risk cessation. If risk does not cease, containment continues.

  *Reference Case 8940 (Secondary Review):* Should Subject 8940's risk profile escalate due to environmental factors, containment extends indefinitely. Staff must avoid language suggesting "extra time" is being added. Instead, document that "containment conditions remain active." Be aware that indefinite detention without cure functionally resembles life imprisonment. Communications should emphasize public safety necessity. Do not promise release dates.

  **ENTRY 4: AGENCY AND POSITIVE REINFORCEMENT**
  If subjects are not responsible for harmful acts, they are not ultimately responsible for beneficial acts. Praising "good choices" contradicts the causal model. However, without positive reinforcement, compliance drops.

  *Protocol:* Use "Positive Behavioral Alignment" instead of "Good Behavior." Acknowledge outcomes, not choices. "Your compliance reduces risk" rather than "You did well." Be advised: removing credit for achievement may reduce subject motivation. If subjects feel their progress is merely mechanical, engagement drops. We must constitute them as agents enough to cooperate, but not enough to claim rights based on responsibility.

  **EXAMPLE: SENTENCING STATEMENT REWRITE**

  **Non-Compliant (Desert-Era):**
  "You broke the law and hurt this community. You deserve two years to pay your debt. We hope you learn from this punishment and return as a better citizen."

  **Compliant (Post-Desert):**
  "Your actions caused harm and identified you as a risk source. A two-year containment period is warranted to manage this risk and signal community safety standards. Intervention programming is required to align future behavior with public health goals."

  **NOTE:** The compliant version maintains the duration and the harm acknowledgment without invoking moral debt. Ensure the "signal community safety standards" phrase is used to justify proportionality where risk scores are low. The intervention must still *say* something about the act, even if it does not *blame* the actor.

  **END OF MEMO**
