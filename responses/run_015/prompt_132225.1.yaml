answer: |-
  1. The diagnostic tree and branch questions

  Start at the root: Is the movement's failure primarily internal to the agent's psychology or external in the system's structure? This first split separates those who think individuals are gaming the system from those who think the system games the individuals. If internal, ask: Does quantification create moral licensing, allowing donors to buy moral credit without structural change, or does it simply blind agents to unmeasurable values like justice or beauty? This distinguishes between active hypocrisy and passive ignorance. If external, ask: Do concentrated funding pools corrupt the epistemic community by rewarding agreeable research, or do they merely create dependency that stifles independent innovation? This separates corruption of truth from corruption of capacity.

  Next, isolate the earning-to-give track, which operates across both internal and external domains. Does this strategy fail because of career substitution risk, where optimizing for high-income skills becomes useless if your cause-priority is wrong, or because it normalizes extreme disparity by accepting unjust wealth generation as a prerequisite for doing good? The first is a pragmatic error about skill utility; the second is a moral error about complicity. Finally, isolate the career capital track. Is there a specific view where none of the standard critiques apply but the movement still collapses under career capital substitution, where you build skills in finance or tech that don't transfer if global health turns out to be the wrong bet? This is a distinct failure of adaptability rather than morality.

  This structure creates three main trunks: Psychology of Metrics, Economics of Funding, and Labor of Earning. Each trunk splits into specific mechanisms of failure. The goal is to avoid labeling people by tribe and instead locate them by which mechanical failure they believe is fatal. If someone argues against EA, ask them which branch they are standing on. If they say metrics are fine but money is rotten, they go left. If they say money is fine but careers are fragile, they go right. This avoids conflating a critique of capitalism with a critique of utilitarianism. By forcing a choice on quantification versus funding, you reveal whether they distrust the math or the money. By forcing a choice on substitution versus disparity, you reveal whether they fear inefficiency or injustice. This taxonomy maps the actual disagreement rather than the rhetorical packaging.

  2. The leaves and their awkward commitments

  1. **Moral Licensing:** You admit people use donations to excuse harmful daily behavior rather than fixing root causes.
  2. **Measurement Blindness:** You concede vital human values are lost because they lack rigorous quantitative metrics.
  3. **Epistemic Corruption:** You believe funders silently dictate which truths are permissible to publish within the community.
  4. **Capacity Dependency:** You argue groups lose the ability to survive without constant external cash infusions from donors.
  5. **Career Substitution:** You claim high-earning skills are worthless if the chosen cause priority pivots unexpectedly.
  6. **Normative Disparity:** You assert earning-to-give requires tolerating unjust wealth accumulation to fund good works.
  7. **Capital Non-Transfer:** You hold that tech and finance skills fail to translate to direct work roles later.
  8. **Institutional Fragility:** You suspect the movement collapses if key organizations lose specific leadership or funding streams.

  3. Empty spots and separation failures

  The tree struggles to distinguish Epistemic Corruption from Capacity Dependency. When funders control truth, they also control survival, making the leaves empirically identical despite theoretical differences. Similarly, Career Substitution and Capital Non-Transfer overlap heavily; both describe skill fragility, differing only in whether the cause or the sector changes. These pairs are practically inseparable in real-world arguments.

  Empty Combos: Believing quantification is perfect but funding is corrupt looks incoherent, as corrupt funding usually manipulates metrics to suit donors. Believing earning-to-give is normatively fine but career capital is useless looks ugly, implying money is good but workers are expendable assets. The combo rejecting moral licensing while accepting measurement blindness is unexplored, suggesting people assume bad metrics always lead to bad psychology. Finally, accepting career substitution risk while denying capital non-transfer is logically possible but rare, as most critics conflate the two skill failures. This leaves a gap where one might argue skills are transferable but the cause is wrong, which remains theoretically open but politically quiet.
