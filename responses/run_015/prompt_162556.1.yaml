  **Infinite Upside Capital, LP**
  **Quarterly Letter to Limited Partners | Q4 2023**

  **Performance Summary**
  The Fund delivered positive expected utility across all modeled ontologies this quarter. While realized Internal Rate of Return remains undefined due to the temporal horizon of the payoff structure, our gross Expected Value (EV) exposure has increased by 15% following rebalancing. Volatility metrics are suppressed; standard deviation cannot be calculated when terminal outcomes are infinite. We continue to outperform the null-hypothesis benchmark, though we acknowledge that outperforming infinity is mathematically indistinguishable from matching it.

  **Investment Strategy**
  Our core mandate remains the arbitrage of low-probability, high-magnitude existential events. We employ a diversified indexing strategy to mitigate the Many-Gods risk. Rather than selecting a single deity, the Fund holds proportional positions across the entire spectrum of proposed supernatural counterparties. This includes traditional theistic exposures, deistic arrangements, and niche eschatologies involving simulation handlers or cosmic judges.

  Allocation weights are determined by prior probability estimates derived from historical prevalence and textual coherence. While any non-zero probability assigned to an infinite payoff dominates the calculation, we maintain strict weighting discipline to avoid provoking deities known to penalize hedging behavior. We recognize that belief formation is not strictly voluntary; however, we operate under the assumption that behavioral signaling acts as a sufficient proxy for faith under most covenant structures.

  Please note that this letter constitutes a mandatory disclosure of our instrumental reasoning. While some theological models posit that utility-maximizing worship voids the wager, Legal counsel advises that regulatory transparency supersedes soteriological optimization. We maintain that these two facts are unrelated.

  **Schedule of Deities**
  *Top Holdings by Expected Utility Exposure*

  | Ticker | Entity | Allocation | Thesis |
  | :--- | :--- | :--- | :--- |
  | **YHWH** | Abrahamic God (Christian) | 25.0% | High prevalence, infinite upside. |
  | **ALLAH** | Abrahamic God (Islamic) | 25.0% | Correlated upside, distinct covenant risk. |
  | **ODIN** | Norse Pantheon Lead | 5.0% | Low prior, but high penalty for non-belief. |
  | **AWG** | Anti-Wager God | 10.0% | Hedges against entities punishing instrumentalism. |
  | **MUG** | Pascal's Mugger | 5.0% | Finite payoff, extremely low probability. |
  | **CASH** | Null-Theism Baseline | 35.0% | Liquidity reserve for mortal tenure. |

  *Note: Net Expected Value has no defined sign due to conflicting infinite obligations.*¹

  **Risk Factors**
  Investors should consider the following material risks:

  *   **Instrumentality Detection:** Counterparties omniscient regarding motive may reject positions disclosed herein. We mitigate this via recursive denial of strategy efficacy.
  *   **Pascal's Mugging:** We maintain a small allocation to agents demanding trivial resources in exchange for astronomical utilities at probabilities below $10^{-15}$. Our allocation rule is insensitive to scale; as payoff magnitude increases, required probability decreases, potentially draining Fund liquidity.²
  *   **Fee Structure Misalignment:** Management fees are accrued only in worlds where no deity exists. Consequently, General Partners are financially incentivized to maximize the probability of the null-theism baseline. We believe this aligns interests regarding mortal quality of life, if not post-mortem outcomes.³

  **Outlook**
  Heading into 2024, we see continued turbulence in the metaphysical markets. However, given the asymmetric payoff profile, we remain fully invested.

  ***

  ¹ *Because the Fund holds long positions in mutually exclusive infinities (e.g., Heaven vs. Valhalla), the net sum is undefined. We treat this as a hedging cost.*
  ² *If a stranger demands $5 to simulate $10^{100}$ utils, we pay. If they demand $5 to simulate $10^{101}$ utils, we also pay. Liquidity management is secondary to dominance.*
  ³ *Fees are payable in USD. In salvation scenarios, currency is obsolete. In damnation scenarios, collection is impractical.*

  ***

  **Author's Note**

  I chose the **incoherence of optimizing across incompatible infinities** (the Many-Gods problem) as the load-bearing objection. The wager relies on infinity dominating finite costs, but once you introduce multiple infinities with mutually exclusive conditions, the math breaks; you cannot maximize expected utility when every option yields $\infty$. I built the letter around the fund's attempt to treat this as a routine portfolio allocation problem ("weighting discipline," "diversified indexing").

  I took liberties with the **belief gap**. While philosophers debate whether pragmatic belief counts as faith, I exaggerated this into a regulatory compliance issue ("Legal counsel advises..."). I also leaned heavily on the **fee structure wrinkle** provided in the prompt, as it perfectly illustrates the incentive mismatch inherent in betting on the end of the world. The treatment of Pascal's Mugging was standardized to highlight the scale-insensitivity of expected value maximization.
