      *   *The "Complaint" Argument:* Scanlon's contractualism. Who can reasonably reject the principle?
      *   *The "Fairness" Definition:* Is fairness procedural (coin flip) or substantive (outcome)?
      *   *The "Risk" Aspect:* Harsanyi's veil of ignorance argument (ex-ante vs. ex-post).
      *   *Key Missing Piece:* The distinction between *ex ante* fairness (everyone has a 5/6 chance of being saved in the group) vs. *ex post* outcomes. Also, the distinction between "Numbers Don't Count" (metaphysical) vs. "Numbers Don't Create Duties" (normative). Nina touches on this, but they miss the *reason* why Taurek thinks this (the incommensurability of separate losses).

  4.  **Address the Specific Question (Iterated Case):**
