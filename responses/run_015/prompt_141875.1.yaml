          *   *Claim:* Five strangers have no collective claim superior to the one stranger's claim. Death isn't worse because others die. Fairness = equal chance (1/6 each).
          *   *Philosophical Context:* This is the standard Taurekian position. Rejection of aggregative utilitarianism. Focus on individual loss and fairness.
          *   *Evaluation:* Philosophically coherent within its framework. Not "mistaken" in logic, though controversial. It's the baseline position.
