prompt: |-
  I lead the risk-quantification group at a company operating a fleet of several hundred autonomous vehicles in mixed traffic across six metro areas, and I need something my analysts can actually run rather than something that sounds wise.

  The job, in outline. Every two weeks our scenario-mining pipeline flags forty to sixty situation types from fleet telemetry and simulation, and for each one an analyst has to attach a number to a sentence of roughly this form: situations of this kind lead to an event with injury potential at a rate below X per million vehicle-miles. Those numbers are aggregated into a safety case that our internal review board signs and that a regulator reads, and the regulator is not friendly. Turnaround is four working days per batch, the team is three analysts with strong statistics training and no philosophy, every class definition has to be frozen under a version number and reproducible from our logs a year later, and the whole thing has to survive being read by someone whose job is to find the move we made to get the number we wanted.

  The obstacle is the reference class problem. I have read the usual material — base rates, the outside view, the advice to use the narrowest class for which you have adequate data, pre-register the class before looking at the outcome — and none of it survives contact with our data, for reasons I want the procedure to confront rather than gesture at:

  First, our candidate classes are almost never nested. A class can be narrow along one axis and broad along another, so the instruction to take the narrowest class with enough data has no determinate answer, and my analysts resolve this differently from each other and from week to week.

  Second, many of our candidate classes exist only inside a simulator. Choosing a reference class and choosing a generative model are then the same act, and the base rate inherits whatever the generator assumes. The procedure needs a step for auditing that entanglement and for deciding when simulation-derived rates may and may not be pooled with fleet-derived ones.

  Third, our historical data are endogenous. They come from the system we already chose to deploy, under the conditions we chose to permit, with the mitigations we already fielded and the remote operators we already staff. The historical rate is therefore conditional on our own past screening, and it will not stay fixed if we act on it — by expanding the operating domain, or by scaling remote assistance down.

  Fourth, and worst: with enough axes to choose from, an analyst can nearly always find a class that supports the number she hopes for, without ever being dishonest. I want this failure to surface somewhere other than in argument. My current idea is a standing ledger of every class-definition decision, scored after the fact, so that we audit the class-picker rather than the individual estimate — but I would rather have your version of that mechanism than my sketch, and I want it specified tightly enough that it can be gamed only at visible cost.

  What I am asking for, concretely. A written decision procedure an analyst can run on a flagged situation type: the questions in order; what counts as a sufficient answer to each; the tests a proposed class must pass before its rate may be used (at minimum I want an axis specification, a pre-outcome feature test, an adversarial re-derivation test in which a second analyst sees only the written definition and must reproduce the same case set, and a stability test under the policy changes we are contemplating); the points at which the procedure returns no number and escalates; and the points at which it stops and hands the decision to a person because the open question is one of values rather than fact. Be explicit about which steps are real procedure and which are judgment calls wearing a procedural costume. I do not need citations or the history of the idea; I need something I can hand to an analyst on Monday.

  Then run it on three cases. (1) A left turn across oncoming traffic at a signalized intersection with no protected phase: about forty fleet instances and zero events, against a broad class of roughly twenty-two hundred intersection interactions containing three events. (2) Expansion into a metro area where the emergency-vehicle siren pattern, the pedestrian-signal conventions, and the customary turn etiquette all differ from anywhere we operate: no fleet data at all, and the only candidates are a simulator class from a generator validated in our existing cities, human crash statistics for that city, and our own data from cities with different conventions. (3) The case I expect to dislike: a class the team has quietly used for two years, defined partly by a feature an analyst codes after watching the clip rather than by anything in the logged schema, and which silently excludes the situations in which a remote operator took over before the maneuver began — precisely the population we would create by reducing remote assistance. Show me how the procedure catches it, what corrected number it forces, and what it says we must do about a safety case we have already filed.

  Finally, tell me what the procedure cannot do: which parts of the problem it leaves exactly where it found them, and where it will misfire in ways my analysts will not notice until a regulator points at them.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Lead of risk-quantification group for an AV company (hundreds of vehicles, six metro areas).
      *   **Task:** Create a concrete, executable decision procedure for analysts to quantify risk (injury potential rate per million VMT) for flagged situation types.
      *   **Constraints/Context:**
          *   Turnaround: 4 working days per batch (40-60 situation types).
          *   Team: 3 analysts (strong stats, no philosophy).
          *   Audience: Internal review board + Hostile Regulator.
          *   Requirements: Reproducible (versioned class definitions), auditable (1 year later), robust against p-hacking/gaming.
          *   Core Problem: Reference Class Problem (non-nested classes, simulation entanglement, endogenous data, analyst degrees of freedom).
      *   **Deliverables:**
          1.  Written Decision Procedure (steps, tests, escalation points, judgment vs. procedure).
          2.  Application to Three Specific Cases (Left Turn, New Metro Expansion, Endogenous/Remote Operator Class).
          3.  Limitations Statement (what it *can't* fix).
      *   **Tone:** Pragmatic, rigorous, operational, no fluff/philosophy.

  2.  **Deconstruct the Reference Class Problems & Design Solutions:**

      *   *Problem 1: Non-nested classes (Narrow vs. Broad).*
          *   *Solution:* Require explicit axis definition and a "Minimum Effective Sample Size" (MESS) check across *multiple* candidate classes, not just one. Force a "Class Stability Index."
      *   *Problem 2: Simulation vs. Reality Entanglement.*
          *   *Solution:* A "Generator Audit" step. Simulation rates must be discounted or bounded by real-world priors unless the generator is validated for *that specific feature*.
      *   *Problem 3: Endogenous Data (Policy dependence).*
          *   *Solution:* A "Counterfactual Sensitivity" test. If the rate changes if we remove remote operators, flag it.
      *   *Problem 4: Analyst Degrees of Freedom (Gaming).*
          *   *Solution:* The "Blind Re-derivation" test (already requested) + A "Class Definition Ledger" with a penalty score for post-hoc feature engineering.

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Structure:* Needs to be a checklist/flowchart style.
      *   *Step 1: Class Specification.* Define axes. No post-hoc coding allowed without flagging.
      *   *Step 2: Data Source Hierarchy.* Real > Validated Sim > Unvalidated Sim.
      *   *Step 3: The Blind Re-derivation.* Analyst B tries to recreate the set from the definition.
      *   *Step 4: Stability & Sensitivity.* What happens if we change policy?
      *   *Step 5: Aggregation/Estimation.* How to calculate the rate (Bayesian smoothing?).
      *   *Step 6: Escalation.* When to say "No Number."

      *Refining the "Gaming" Defense:* The user wants a ledger. Let's make it a "Class Complexity Penalty." If a class definition requires more than $N$ logical operators or includes features not in the raw schema, it gets a "High Uncertainty" tag that the regulator sees.

      *Refining the "Endogenous" Issue:* The procedure must force the analyst to calculate the rate *excluding* mitigations (e.g., remote assistance) if the safety case claims robustness without them.

  4.  **Running the Three Cases:**

      *   *Case 1 (Left Turn):* 40 instances, 0 events vs. 2200 instances, 3 events.
          *   *Procedure Action:* The narrow class (40 inst) fails sample size stability. The broad class (2200 inst) is too heterogeneous.
          *   *Outcome:* Use the broad class but apply a "Specific Hazard Multiplier" based on simulation, or escalate to "Insufficient Data" for the narrow class. The procedure should force the use of the broader class with a confidence interval that reflects the uncertainty of the specific sub-case.
      *   *Case 2 (New Metro):* No fleet data. Sim vs. Human Stats vs. Other Cities.
          *   *Procedure Action:* Fleet data = 0. Sim data = "Generator Dependent." Human stats = "Different Agent."
          *   *Outcome:* Cannot produce a fleet-specific rate. Must use a "Transferability Bound." The number submitted must be the *worst-case* of the valid sources, flagged as "Extrapolated."
      *   *Case 3 (The "Dirty" Class):* Post-hoc coding, excludes remote takeovers.
          *   *Procedure Action:* The "Pre-outcome Feature Test" fails (feature coded after watching). The "Endogeneity Test" fails (excludes takeovers).
          *   *Outcome:* Class definition rejected. Must recalculate including takeovers as "potential events" or "exposures." Safety case amendment required.

  5.  **Drafting the Limitations:**

      *   What can't this fix?
      *   It can't fix bad simulation physics.
      *   It can't fix the regulator's inherent skepticism of *any* number.
      *   It can't predict "Black Swan" distribution shifts.
      *   It creates bureaucracy that might slow down innovation (trade-off).

  6.  **Review and Refine (Self-Correction):**

      *   *Critique:* Is it too academic?
      *   *Fix:* Remove Bayesian jargon where possible. Use "Lower Confidence Bound" instead of "Posterior Quantile." Make the steps imperative verbs.
      *   *Critique:* Is the "Blind Re-derivation" feasible in 4 days for 50 cases?
      *   *Fix:* It doesn't need to be full code review. It needs to be "Query Reproduction." Analyst B runs the SQL/query based on the text definition.
      *   *Critique:* The user wants to know where judgment wears a costume.
      *   *Fix:* Explicitly label sections "Procedural Gate" vs. "Judgment Call."

  7.  **Final Polish:** Check against the prompt's specific constraints (versioning, 4 days, 3 analysts, hostile regulator). Ensure the tone is authoritative and operational. (The prompt asks for "something I can hand to an analyst on Monday.")

      *   *Key Addition:* The "Class Definition Ledger" needs to be concrete. Let's call it the "Class Provenance Record."
      *   *Key Addition:* The "Endogeneity" test needs to be a specific "Mitigation Ablation" step.

  8.  **Final Output Structure:**
      *   Protocol Title.
      *   Phase 1: Definition & Provenance.
      *   Phase 2: Data & Source Hierarchy.
      *   Phase 3: Stability & Sensitivity.
      *   Phase 4: Estimation & Reporting.
      *   Case Studies (1, 2, 3).
      *   Limitations Statement.

  (Proceed to generate response based on this thought process.)
answer: |-
  # PROTOCOL RQ-24: REFERENCE CLASS QUANTIFICATION AND AUDIT

  **Effective Date:** Immediate
  **Owner:** Risk Quantification Group
  **Applicability:** All safety-case rate estimations for scenario classes.
  **Goal:** Produce a defensible injury-potential rate (per million VMT) or a documented escalation.

  ---

  ## PHASE 1: CLASS DEFINITION AND PROVENANCE
  *Objective: Freeze the reference class before estimating the rate.*

  **Step 1.1: Axis Specification (Procedural Gate)**
  The analyst must define the class using a boolean query on the **Raw Schema** (logged telemetry only).
  *   **Requirement:** Every predicate in the definition must map to a column in the versioned telemetry schema.
  *   **Forbidden:** Predicates requiring human review of video/audio *after* the fact (e.g., "pedestrian looked hesitant").
  *   **Output:** A versioned SQL/DSL query string.

  **Step 1.2: The Blind Re-derivation Test (Procedural Gate)**
  A second analyst (or the lead) receives *only* the query string from 1.1.
  *   **Task:** Execute the query on the frozen log snapshot.
  *   **Pass Condition:** The resulting set of Instance IDs matches the proposing analyst's set exactly.
  *   **Fail Condition:** Mismatch > 0%.
  *   **Consequence:** If failed, the definition is ambiguous. Return to 1.1. No rate estimation proceeds until this passes.

  **Step 1.3: Post-Hoc Feature Ledger (Audit Trail)**
  If the class definition requires *any* feature that was not part of the original schema version at the time of data collection (e.g., a derived variable added later), it must be flagged in the **Class Provenance Record**.
  *   **Penalty:** Any class with >0 post-hoc features is automatically tagged `HIGH_UNCERTAINTY` in the final report. This tag is visible to the regulator.

  ---

  ## PHASE 2: DATA SOURCE HIERARCHY
  *Objective: Prevent simulation assumptions from masquerading as empirical base rates.*

  **Step 2.1: Source Tagging (Procedural Gate)**
  Every instance in the class must be tagged by source:
  *   `S1`: Real Fleet Data (Operational Design Domain - ODD).
  *   `S2`: Real Fleet Data (Outside ODD / Shadow Mode).
  *   `S3`: Validated Simulation (Generator validated against S1 for *this specific scenario axis*).
  *   `S4`: Unvalidated Simulation.

  **Step 2.2: The Entanglement Check (Judgment Call)**
  If `S3` or `S4` comprises >50% of the exposure (VMT) used for the rate:
  *   **Action:** The analyst must document the specific generator parameters that drive the event rate (e.g., "pedestrian aggression model").
  *   **Requirement:** A sensitivity bound must be calculated (see Phase 3).
  *   **Rule:** You cannot pool `S1` and `S4` into a single denominator without a discount factor. `S4` exposure counts as 0.1x VMT for rate calculation purposes unless validated.

  ---

  ## PHASE 3: STABILITY AND SENSITIVITY
  *Objective: Detect endogeneity and p-hacking.*

  **Step 3.1: The Minimum Sample Stability Test (Procedural Gate)**
  Calculate the rate using the proposed class ($C_{narrow}$). Then calculate the rate using the immediate parent class ($C_{broad}$), defined by removing one boolean predicate from 1.1.
  *   **Pass Condition:** The 95% Confidence Interval (CI) of $C_{narrow}$ must overlap with the 95% CI of $C_{broad}$.
  *   **Fail Condition:** If $C_{narrow}$ has zero events and $C_{broad}$ has events, and the CIs do not overlap (implying the narrowness is artificially suppressing the rate), the narrow class is rejected.
  *   **Escalation:** If rejected, you must report the rate for $C_{broad}$ or escalate to "Insufficient Data."

  **Step 3.2: Mitigation Ablation Test (Procedural Gate)**
  Re-calculate the event rate assuming the **Remote Assistance** system was inactive (i.e., count Remote Takeovers as potential events, or exclude the VMT where remote assistance was available).
  *   **Requirement:** Report two numbers: `Rate_Active` and `Rate_Passive`.
  *   **Rule:** The Safety Case number must be `Rate_Passive` unless the safety claim explicitly relies on remote assistance availability.
  *   **Flag:** If `Rate_Passive` > 10x `Rate_Active`, the class is tagged `DEPENDENT_ON_HUMAN_IN_LOOP`.

  **Step 3.3: The Analyst Degree-of-Freedom Score (Audit Trail)**
  Count the number of distinct class definitions tested before selecting the current one.
  *   **Procedure:** Analysts must log every query run during exploration in a "Scratchpad Log."
  *   **Metric:** `Selection_Ratio = (Total Queries Run) / (1 Final Query)`.
  *   **Threshold:** If `Selection_Ratio` > 20, the estimate is flagged as `POTENTIALLY_OPTIMIZED`.
  *   **Consequence:** The reported upper-bound of the confidence interval must be used in the Safety Case instead of the point estimate.

  ---

  ## PHASE 4: ESTIMATION AND ESCALATION
  *Objective: Finalize the number or admit ignorance.*

  **Step 4.1: The Number**
  *   If all gates pass: Report `Rate_Passive` (from 3.2) with 95% CI.
  *   If `S3/S4` data used: Report `Rate_Sim_Bounded` (adjusted per 2.2).

  **Step 4.2: Escalation Points (Stop Rules)**
  The procedure **must** return "NO NUMBER" and escalate to the Risk Lead if:
  1.  Blind Re-derivation (1.2) fails twice.
  2.  Stability Test (3.1) fails and the Broad Class is too heterogeneous to be meaningful (e.g., "All Driving").
  3.  Mitigation Ablation (3.2) shows dependence on human intervention, but the Safety Case claims autonomy.
  4.  Total Exposure < 10,000 miles for a class with non-zero injury potential.

  **Step 4.3: The Value Judgment Handoff**
  The procedure stops and hands to the Risk Lead when:
  *   Choosing between two valid reference classes yields rates differing by >1 order of magnitude, and both pass stability tests. (This is a policy choice, not a statistical one).
  *   The regulator's implied risk tolerance conflicts with the calculated upper bound.

  ---

  # APPLICATION TO CASES

  ## CASE 1: Left Turn Across Oncoming Traffic (Signalized, Unprotected)
  *   **Data:** Narrow Class (40 instances, 0 events). Broad Class (2200 instances, 3 events).
  *   **Procedure Execution:**
      1.  **1.1/1.2:** Definition is clean (telemetry axes: intersection type, signal state, turn direction). Re-derivation passes.
      2.  **3.1 (Stability):**
          *   Narrow Rate: 0 / 40. Upper 95% CI bound (Rule of Three) ≈ 7.5%.
          *   Broad Rate: 3 / 2200 ≈ 0.14%.
          *   **Result:** FAIL. The narrow class implies safety (0 events) that is statistically inconsistent with the parent class (3 events). The narrowness is artificially suppressing risk.
      3.  **Action:** The analyst cannot submit the rate for the Narrow Class.
      4.  **Correction:** The analyst must submit the rate for the **Broad Class**, but annotate it with `SPECIFIC_HAZARD_FLAG`.
      5.  **Final Number:** The rate is derived from the 2200 instances. The Safety Case must acknowledge that the specific "unprotected left" nuance is not statistically resolved by fleet data alone.
      6.  **Regulator Defense:** "We did not claim statistical significance for the sub-class. We conservatively applied the parent class rate, which includes this scenario."

  ## CASE 2: New Metro Expansion (No Fleet Data)
  *   **Data:** 0 Fleet. 1 Simulator (validated in other cities). 1 Human Crash Stats (City specific).
  *   **Procedure Execution:**
      1.  **2.1 (Source Tagging):** Fleet = 0. Sim = `S3` (Validated elsewhere). Human = `External`.
      2.  **2.2 (Entanglement):** Since Fleet = 0, the rate is entirely model-driven.
      3.  **3.1 (Stability):** Cannot run (no parent fleet class).
      4.  **4.2 (Escalation):** This triggers the **"Extrapolation Protocol."**
      5.  **Correction:** You cannot produce a "Fleet Rate." You must produce a "Projected Rate."
      6.  **Final Number:** Take the **maximum** of (Simulator Rate, Human Crash Rate adjusted for AV mitigation). Apply a `NEW_ODD_PENALTY` multiplier (e.g., 2.0x) to the upper confidence bound.
      7.  **Report:** "Rate is not empirical. It is a bound based on external priors." The Safety Case must be conditional on "First 10,000 miles validation."

  ## CASE 3: The "Dirty" Class (Post-Hoc Coding, Excludes Remote Takeovers)
  *   **Data:** Class used for 2 years. Feature coded after watching video. Excludes Remote Takeovers (RTO).
  *   **Procedure Execution:**
      1.  **1.1 (Axis Spec):** **FAIL.** The feature "pedestrian hesitation" was coded post-hoc from video, not in Raw Schema.
      2.  **1.3 (Ledger):** Flagged as `HIGH_UNCERTAINTY`.
      3.  **3.2 (Mitigation Ablation):** **FAIL.** The class definition explicitly excludes instances where RTO occurred.
          *   *Test:* Re-run query including RTO instances as "exposure" and RTO interventions as "potential events" (or worst-case events).
          *   *Result:* Rate increases by 40x.
      4.  **Correction:** The class definition is **Revoked**. It cannot be used in a Safety Case claiming autonomy.
      5.  **Remediation:**
          *   Define a new class using only telemetry axes (e.g., "Pedestrian within 5m, AV speed > 5mph").
          *   Recalculate rate including RTO as events.
          *   **Safety Case Impact:** The previously filed Safety Case contained a material error. You must file an **Amendment**.
          *   **Statement:** "Previous rate estimates for Class X excluded human-in-the-loop mitigations. Revised rate reflects system performance without intervention. This increases the reported risk profile for this scenario."
      6.  **Regulator Defense:** "We audited our historical classes against Protocol RQ-24. We found an endogeneity error. We are self-reporting the correction." (This converts a potential finding into a compliance demonstration).

  ---

  # LIMITATIONS STATEMENT
  *What this procedure does not solve.*

  **1. The "Valid Simulation" Illusion**
  Protocol RQ-24 requires you to tag simulations as `S3` (Validated) or `S4` (Unvalidated). It does **not** give you a test to prove validation. If your generator matches marginal distributions but fails on joint correlations (e.g., rain + pedestrian aggression), the procedure will accept it as `S3` provided you document the validation. A smart regulator will attack the validation matrix, not your rate calculation. *This procedure makes the assumption visible; it does not verify the physics.*

  **2. The "Broad Class" Trap**
  In Case 1, the procedure forces you to use the Broad Class rate when the Narrow Class fails stability. This is conservative, but it can be **too** conservative. If the Broad Class is "All Intersections," the rate might be so high it makes deployment impossible, even if the specific "Unprotected Left" is actually safe. The procedure forces a binary choice (Narrow or Broad) when the truth is a hierarchical model. *We lack the data to build the hierarchical model. This procedure forces you to admit that.*

  **3. The "Goodhart" Shift**
  By penalizing `Selection_Ratio` (Step 3.3), analysts may stop exploring. They may run fewer queries to keep the score low, potentially missing better class definitions. This trades statistical optimization for auditability. *You are buying defensibility at the cost of precision.*

  **4. The Regulator's Veto**
  This procedure ensures your number is internally consistent and reproducible. It does **not** ensure the regulator accepts your reference class as relevant. They may reject the "Broad Class" as irrelevant to the specific hazard. *This procedure protects you against accusations of math errors, not against disagreements on ontology.*

  **5. Endogeneity of the "Pass"**
  The procedure itself becomes a target. Analysts may learn to write definitions that pass the Blind Re-derivation test but are still semantically ambiguous in ways SQL doesn't catch (e.g., timestamp synchronization issues). *The Blind Test checks code reproducibility, not semantic truth.*

  ---

  **Implementation Note:**
  Load the "Class Provenance Record" template into your ticketing system. No ticket moves to "Review" without the `Selection_Ratio` and `Mitigation_Ablation` fields populated. If they are empty, the ticket is auto-rejected.
