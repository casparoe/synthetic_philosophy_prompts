answer: |-
  Here is a menu of distinct readings of the "hand-mill/steam-mill" passage, formulated to be precise enough for debate, followed by an analysis of your specific strategic questions.

  ### The Menu of Readings

  **1. Strong Causal Determinism**
  *   **Precise Claim:** The introduction of a specific dominant artifact *necessitates* a specific corresponding set of property relations and class structures within a fixed timeframe.
  *   **What "gives you" denotes:** Efficient causation (A produces B).
  *   **What "mill" stands for:** The physical artifact itself (the technology).
  *   **Directionality:** One-way (Technology $\rightarrow$ Social Order).
  *   **Level of Analysis:** Artifact to Superstructure.
  *   **Relation Type:** Causation.
  *   **Evaluation:** **Simply False.** History provides counterexamples (e.g., steam technology introduced in contexts that did not immediately yield industrial capitalism, such as state-socialist industrialization or late-feudal state manufactories).

  **2. Functional Requirement Thesis**
  *   **Precise Claim:** A specific mode of labor organization is technically required to operate a dominant productive system efficiently; social forms that cannot supply this organization will be outcompeted.
  *   **What "gives you" denotes:** Functional necessity (A requires B to function).
  *   **What "mill" stands for:** The technical composition of capital (the labor process, not just the machine).
  *   **Directionality:** One-way (Labor Process $\rightarrow$ Social Relations).
  *   **Level of Analysis:** Labor Process to Relations of Production.
  *   **Relation Type:** Functional Constraint.
  *   **Evaluation:** **Substantive and Defensible Thesis.** This is the standard orthodox Marxist reading. It is falsifiable: if a society sustains high productivity with a "mismatched" social form (e.g., high-tech feudalism or high-tech socialism), the thesis is weakened.

  **3. Negative Selection (The Compatibility Claim)**
  *   **Precise Claim:** Social forms that are structurally incompatible with the dominant productive techniques will fail to reproduce themselves; compatible forms survive, but the technology does not dictate which compatible form emerges.
  *   **What "gives you" denotes:** Viability filtering (A eliminates not-B).
  *   **What "mill" stands for:** The dominant productive system of an epoch.
  *   **Directionality:** Constraint (Technology limits the set of possible Social Orders).
  *   **Level of Analysis:** Productive System to Social Formation.
  *   **Relation Type:** Negative Selection / Persistence.
  *   **Evaluation:** **Platitude / Weak Thesis.** It is hard to falsify because "compatibility" is often defined post-hoc. It explains why feudalism didn't survive steam, but does not predict what *will* survive capitalism.

  **4. Explanatory Priority (Heuristic Reading)**
  *   **Precise Claim:** When explaining the transition between social epochs, the change in productive techniques provides the most robust starting point for analysis, even if it is not the sole cause.
  *   **What "gives you" denotes:** Explanatory leverage (A is the best key to understand B).
  *   **What "mill" stands for:** Epochal shifts in energy and production.
  *   **Directionality:** Epistemic (Methodological priority, not ontological causation).
  *   **Level of Analysis:** Historical Epochs.
  *   **Relation Type:** Explanatory Priority.
  *   **Evaluation:** **Substantive and Defensible Thesis.** This treats the sentence as a methodological rule for historians rather than a law of physics. It is falsifiable if technological changes consistently fail to correlate with social transitions.

  ***

  ### Evaluation of Your Suspicion (The Selection Claim)

  You suspect the most defensible reading is **Reading 3 (Negative Selection)**: *social forms that cannot be made to work with the dominant technique do not survive.*

  **Does this reading do the work you want it to?**
  Yes, but with a caveat. It successfully defends Marx against the charge of "crude determinism" (Reading 1), which allows you to parry your friend's first move. It acknowledges that technology constrains society without claiming technology *creates* society ex nihilo.

  However, this reading **undermines your friend's second move** just as effectively as it undermines his first. If the relation is merely one of *selection* (compatibility), then automation does not *guarantee* a post-capitalist society; it only guarantees that capitalism must adapt or perish. It leaves open the possibility that capitalism *can* adapt to automation (e.g., through new forms of rentierism, intellectual property, or artificial scarcity). Therefore, while this reading saves Marx from being "crude," it deprives your friend of the deterministic certainty he wants to use to predict a post-capitalist future. It is a shield for Marx, not a sword for your friend.

  ***

  ### The Consistency Question

  **Is there any single reading that supports both of your friend's moves?**
  **No.** The second use obliges him to withdraw the first.

  *   **Move 1:** He uses the quote to label Marx a **crude determinist** (implying the theory is empirically fragile and easily disproven by counterexamples).
  *   **Move 2:** He uses the quote as an **authoritative guarantee** (implying the theory is robust enough to predict the end of capitalism based on current tech trends).

  He cannot simultaneously claim the mechanism is too crude to be true (Move 1) and sufficiently robust to guarantee a specific political outcome (Move 2). If the "steam-mill" sentence is true enough to predict the end of capitalism via automation, it must be more than a crude artifact-determinism; it must be a sophisticated claim about social relations (Reading 2 or 3). If it is merely crude determinism, it is historically false and cannot be relied upon for future prediction. He is treating the quote as a "magic spell" when it suits his optimism and a "straw man" when it suits his critique.

  ***

  ### Conditions for Current Technology

  For the slogan (on its best reading, **Reading 2 or 3**) to license an inference that automation leads to post-capitalism, the following would have to be true of current machine technology, distinct from the steam engine:

  1.  **Incompatibility with Wage Labor:** The steam engine increased the *productivity* of labor but still required mass labor to operate. For automation to necessitate post-capitalism, it must render the *sale of labor power* structurally impossible or economically irrational on a mass scale. If capitalism can automate production but still enforce scarcity (e.g., via IP law) to maintain profit without mass employment, the "mill" remains compatible with capitalism.
  2.  **Non-Excludability:** The steam engine required high fixed capital, encouraging centralization and private ownership. For automation to "give you" post-capitalism, the new "mill" (AI/robots) must be difficult to monopolize or must drive the marginal cost of reproduction to zero, making private appropriation technically unenforceable rather than just legally protected.
  3.  **Systemic Rigidity:** It must be shown that capitalism *cannot* adapt to this technology (e.g., by creating new "jobs" in care sectors or by shifting to a rentier model). The steam engine killed feudalism because feudal dues could not capture the value of industrial production. You must demonstrate that profit cannot capture the value of automated production.

  Without these conditions, the "automation mill" may simply give you a society with *digital landlords*, just as the steam mill gave you a society with *industrial capitalists*.
