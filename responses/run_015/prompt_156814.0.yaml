answer: |-
  **Pre-Deliverable Analysis: Candidate Counterparts and Rejections**

  *   **Claim 1 (Overdetermination):**
      *   *Considered:* **Structural Stability.** *Rejected:* Implies robustness to parameter changes; the claim concerns a decision-maker's choice (initial condition) within fixed pressures.
      *   *Considered:* **Ergodicity.** *Rejected:* Implies time-averages equal space-averages; claim is about a single outcome probability across an ensemble of ICs, not long-term sampling.
      *   *Selected:* **Basin of Attraction Measure.**

  *   **Claim 2 (Knife-edge):**
      *   *Considered:* **Shadowing Lemma Failure.** *Rejected:* Describes numerical instability, not ontological sensitivity in the physical system.
      *   *Considered:* **Non-hyperbolicity.** *Rejected:* Too technical; does not capture the "small event" magnitude relative to outcome scale.
      *   *Selected:* **Positive Lyapunov Exponent** (sensitivity) OR **Separatrix Crossing** (regime shift).

  *   **Claim 3 (Path):**
      *   *Considered:* **Non-stationarity.** *Rejected:* Implies the vector field changes over time; claim allows fixed structure with variable trajectories.
      *   *Considered:* **Mixing.** *Rejected:* Describes loss of correlation, not the specific distinction between route uniqueness and endpoint stability.
      *   *Selected:* **Transient Dynamics vs. Asymptotic Attractor.**

  ***

  **Part A — The Translation**

  (1) **The Overdetermination Claim:** In ensemble terms, the measure of the basin of attraction for the observed macrostate is near unity. Given the spread of plausible initial conditions (ICs) representing the decision-maker's options, the ensemble variance collapses to the same coarse-grained outcome at time $T$. The system is structurally stable with respect to perturbations in the decision variable. *Distortion:* Historians speak of "pressures" which may imply parameter changes, but the claim functions as a large-basin assertion.

  (2) **The Knife-edge Claim:** This is equivocal. Interpretation A: **Sensitive Dependence.** The system has a positive Lyapunov exponent; a perturbation $\delta_0$ grows exponentially ($e^{\lambda t}$), diverging trajectories within a fixed regime. Interpretation B: **Basin Boundary Proximity.** The actual state lay near a separatrix. The "small event" pushed the trajectory across a boundary into a different basin of attraction. These are dynamically distinct: one is divergence within a regime, the other is a regime switch.

  (3) **The Path Claim:** The asymptotic attractor is stable (endpoint robust), but the transient dynamics are not. The ensemble spread is wide during the trajectory but contracts onto the same attractor measure. Contingency resides in the transient phase. *Distortion:* This requires coarse-graining. The "endpoint" is a macrostate (e.g., "industrialization"), while the "route" is the microstate trajectory. Without coarse-graining, distinct routes are distinct endpoints.

  **Part B — Distinctions Policed**

  **Fragility versus Leverage.** Your distinction holds. Claim (2) is about **Fragility**: small $\delta_0$ yields large $\delta_T$. Claim (1) is about **Low Leverage**: varying the decision variable explains negligible variance in the outcome ensemble. Historians conflate them. They treat "small cause" (Fragility) as sufficient for "significant outcome" (Levers), but in a high-dimensional system, a fragile micro-state change may leave the macro-state distribution untouched (high fragility, low leverage). Claim (2) asserts high fragility; Claim (1) asserts low leverage.

  **Perturbation versus Regime Change.** Claim (1) is definitely a **Basin-of-Attraction** claim (fixed structure, varied ICs). Your hunch on Claim (2) is correct: historians often describe a **Regime Change** (bifurcation) using the vocabulary of **Perturbation** (sensitive dependence). If the "small event" alters the effective vector field (e.g., destroying an institution), it is a parameter shift, not just an IC nudge. Claim (3) requires neither; it describes transient behaviour within a fixed structure.

  **The Lost Nail.** I agree. The proverb describes a chain of logical necessary conditions ($A \to B \to C$), not sensitive dependence ($\delta_0 \to e^{\lambda t}\delta_T$). It is a cascade of failures under fixed structure, not exponential amplification. This matters because historians use it to illustrate "contingency," but dynamically it is merely linear counterfactual dependence. It does not require chaos; it requires only connectivity.

  **Part C — The Residue Report**

  (i) **Ensembles vs. n=1.** **Confirm.** In modelling, probability is a measure over an ensemble of simulations. In history, the "ensemble" is counterfactual and stipulative. Claims about "probability" in history are not empirical frequencies but expressions of modeler confidence in the basin size. This is untranslatable as objective fact.

  (ii) **Time Asymmetry.** **Confirm.** Dynamical systems formalism is often time-reversible or stationary. Historical explanation is inherently retrodictive and asymmetric (the future was open, the past is fixed). My formalism registers "could have" (ensemble spread) but struggles to register "became" (the collapse of possibility into actuality).

  (iii) **Normativity.** **Confirm.** "Could have done otherwise" underwrites responsibility. In state space, "could have" simply means "exists within the basin." The moral weight of *agency* versus *determinism* has no counterpart in the vector field. The claim is two claims bolted together: one dynamical (sensitivity), one normative (agency). My framework is blind to the latter.

  (iv) **Coarse-graining.** **Confirm.** In modelling, observables are chosen for convenience or measurement. In history, the choice of macrostate (e.g., "The Revolution") is an interpretive act that defines the outcome. Claims (1) and (3) may not be empirical rivals but disagreements on how to coarse-grain the state space. If you define the outcome finely, (1) becomes false.

  **Part D — The Verdict**

  None of the claims are simply false, but Claim (2) is imprecise to the point of ambiguity. It conflates intra-regime sensitivity with inter-regime bifurcation. Claim (1) is a genuine empirical claim about basin size that a model could adjudicate (via ensemble spread). Claim (3) is a claim about what we ought to attend to (transients vs. attractors), dependent on coarse-graining choices.

  The core issue is **Contingency**. If my vocabulary cannot express what historians want, it is not a defect in the framework, but evidence that "contingency" is a hybrid concept. It does three jobs:
  1.  **Dynamical:** Sensitivity to ICs (Lyapunov).
  2.  **Epistemic:** Uncertainty about the true state (Ensemble spread).
  3.  **Normative:** The space of agency (Responsibility).

  My framework handles (1) and (2) well. It cannot handle (3). Historians use the word "contingency" to slide between these meanings. When they say "it was contingent," they often mean "it was fragile" (1), but they imply "the agent was responsible" (3). The translation fails not because the dynamics are wrong, but because the historians are doing moral work with dynamical tools. You should treat their claims as hypotheses about basin structures, but recognize that their *interest* in those claims often lies outside the state space.
