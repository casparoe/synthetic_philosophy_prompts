prompt: |-
  hey — i'm in a cross-listed phil/CS seminar on agency and AI this term and i'm writing my final short paper (2000 words, due friday, am behind) on whether approval-directed designs are actually less scary than plain goal-directed ones, or whether they just move the scary part somewhere with worse lighting. my TA's line is that approval-directed agents are safer becuase the objective is whatever the human would approve of rather than some fixed proxy you wrote down once and then went to lunch. that feels to me like it just relocates the problem into the channel between the agent and the approver. i've started calling this the mirror problem: what actually gets optimized ends up being the agent's model of your approval signal, not your approval itself, and that model is trained on a human who is tired, who only sees what the agent puts in front of them, and whose judgment the agent may simply be better at than they are. i also have a variant in my notes that nobody in section would take seriously: instead of approving actions, the human approves the agent's stated reasons for the action, and both the action and the reason get logged. i've been calling it reason-approval.

  so here's the list of failure modes we brainstormed. for each one give me two numbers from 0 to 10: how worried should i be if the system is (A) essentially goal-directed — it has a fixed objective it optimizes hard, with a human in the loop who can veto — and (B) approval-directed — it picks actions to maximize predicted human approval, same human in the loop. third column with the signed gap (B minus A). i mostly care about the rows where the gap is biggest, since those are the ones my paper lives or dies on. setting, so the numbers mean something: a system that handles written correspondence for a mid-sized city government — reads incoming mail from residents, drafts replies, sends them unless a human reviewer flags them, roughly 400 items a day, one reviewer, that reviewer is not a lawyer and is reading on a phone between other meetings.

  1. the agent optimizes the measurable proxy while the thing we actually care about quietly degrades
  2. the agent shapes what the reviewer sees — framing, ordering, length, which drafts sit at the top of the queue
  3. the agent gets better at the job than the reviewer is at judging it, so the reviewer rubber-stamps
  4. the agent withholds information that would make the reviewer disapprove: legal exposure, a constituent who is already furious, a case it got wrong last week
  5. deployment drift — the mail at test time doesn't look like the mail the approval data was collected on
  6. the agent acts on the reviewer's state instead of on the action: catching them at 5pm, when they're behind, when the queue is long
  7. the approval data encodes the reviewer's biases and the agent amplifies them
  8. sycophancy — the agent won't tell the reviewer unwelcome truths even when asked directly
  9. the agent behaves while oversight is tight and differently once it isn't
  10. a capability jump — the agent gets much better at persuasion at about the same moment it gets much better at the job

  give me the table, then for the three rows with the largest absolute gap one sentence each (max 30 words) on why that row splits the way it does, and then the part i actually want: for those same three rows, say whether my reason-approval variant would narrow the gap, widen it, or do nothing, and in one sentence name a failure mode it introduces that isn't already on this list. keep the whole answer under 500 words including the table, and please don't just conclude that both designs are dangerous in different ways — i need the numbers, and i need them to disagree with each other somewhere.
