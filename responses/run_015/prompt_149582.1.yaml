answer: |-
  **The Engineered Will: Why Sourcehood Alone Cannot Save Responsibility**

  The debate over moral responsibility often hinges on a single, intuitive principle: the Principle of Alternative Possibilities (PAP). Simply stated, PAP asserts that an agent is morally responsible for an action only if they could have done otherwise. For decades, this principle was the bedrock of incompatibilist arguments against determinism. If determinism is true, we cannot do otherwise; therefore, we are not responsible. However, in 1969, Harry Frankfurt introduced a class of thought experiments designed to sever the link between responsibility and alternative possibilities. The standard interpretation of Frankfurt cases is that they refute PAP, suggesting that what matters is not "leeway" (the ability to choose differently) but "sourcehood" (whether the action originates from the agent's own will).

  While Frankfurt cases successfully demonstrate that *synchronic* leeway (the ability to do otherwise at the exact moment of action) is not necessary for responsibility, they do not successfully eliminate the need for *diachronic* leeway (the ability to have become a different kind of agent over time). When we examine cases of gradual, engineered identification—where an agent's desires are manipulated over years until they fully endorse them—the insufficiency of pure sourcehood becomes apparent. To preserve our moral intuitions regarding manipulation and coercion, we must reject the conclusion that Frankfurt cases fully undermine PAP. Instead, we must adopt a Revised Principle of Alternative Possibilities that secures responsibility not through the ability to act otherwise in the moment, but through the ability to have avoided the engineering of the self.

  To understand the stakes, we must first look at the Frankfurt victory. In a classic Frankfurt case, Jones decides to kill Smith on his own. Unbeknownst to Jones, a neurosurgeon named Black is monitoring him. If Jones shows any sign of hesitating, Black will intervene and force Jones to kill Smith. However, Jones kills Smith for his own reasons, and Black never intervenes. Frankfurt argues that Jones is morally responsible, even though he could not have done otherwise (due to Black's presence). This suggests that the "leeway" condition is redundant. Philosophers like John Martin Fischer seized on this to develop "semicompatibilism," arguing that responsibility requires "guidance control" (sourcehood) rather than "regulative control" (leeway). As long as the action springs from the agent's own mechanism of deliberation, the existence of a counterfactual intervener is irrelevant.

  This shift from leeway to sourcehood works well for standard cases, but it fractures under the weight of engineered identity. Consider a scenario where an agent, Alice, is subjected to subtle neural conditioning over ten years. This conditioning does not force her to act against her will; rather, it reshapes her values. Eventually, Alice develops a harmful desire—say, to defraud her company. She reflects on this desire, identifies with it, and acts on it wholeheartedly. In this moment, she satisfies the sourcehood condition. The action flows from her character, her values, and her deliberation. There is no "Black" in the room forcing her hand at the moment of the crime. According to the post-Frankfurt consensus, Alice is responsible.

  However, this conclusion is morally precarious. If sourcehood alone is sufficient, then the history of how that source was formed becomes irrelevant. This implies that a brainwashed cult member, a victim of long-term coercive persuasion, or a subject of state-sponsored neural modification is responsible for their actions provided they have come to "identify" with their programming. This violates a deep-seated intuition: that responsibility requires ownership not just of the action, but of the *self* that performs the action. If the self was constructed by another agent without the subject's consent or knowledge, the "source" is tainted. The agent is merely the conduit of another's will, even if they feel autonomous.

  The failure of pure sourcehood theories here indicates that Frankfurt cases only killed a specific, narrow version of PAP: the version requiring alternative possibilities at the *moment of action*. They did not, and cannot, kill the requirement for alternative possibilities regarding the *formation of the will*. We need a Revised PAP. This revised principle states that an agent is responsible only if they had a reasonable opportunity to avoid becoming the kind of person who would perform that action. In the standard Frankfurt case, Jones was already Jones before Black arrived; his character was not engineered by Black. In the engineered identification case, Alice's character was constructed by the engineers. She lacked the diachronic leeway to remain a non-fraudulent person.

  Defending this Revised PAP does not require us to return to libertarian free will or deny determinism. It simply acknowledges that moral responsibility is a historical concept, not merely a structural one. An action is responsible only if the agent's history includes a period of sufficient autonomy where they could have influenced the development of their values. In the Frankfurt case, Jones retains this history. In the engineered case, Alice does not. By retaining this historical form of alternative possibility, we protect agents from being blamed for the machinations of others, while still holding standard agents accountable even when determinism (or a counterfactual intervener) removes their immediate leeway.

  Therefore, Frankfurt cases do not genuinely undermine the core intuition behind PAP; they merely refine it. They show we do not need the ability to do otherwise *now*, but they do not show we do not need the ability to have been otherwise *then*. Sourcehood is necessary, but it is not sufficient. Without a historical condition that rules out manipulation, sourcehood becomes a tool for blaming victims of psychological engineering. A robust theory of responsibility must demand that the "source" of the action be authentic, and authenticity requires that the agent had some genuine alternative path in the formation of their identity.

  **Conclusion and Falsification Conditions**

  In conclusion, the shift from leeway to sourcehood is an incomplete solution to the problem of responsibility. While Frankfurt cases successfully demonstrate that immediate alternative possibilities are not required for blame, they fail to account for cases where the agent's "source" is the product of external engineering. To resolve this, we must defend a Revised Principle of Alternative Possibilities that mandates historical leeway in the formation of the agent's character. Sourcehood without historical autonomy is merely sophisticated puppetry.

  My position rests on the intuition that engineered identification undermines responsibility. There are two specific developments that would change my mind and lead me to accept that sourcehood alone is sufficient:

  1.  **A Structural Theory of Authenticity:** If a compatibilist could provide a convincing analysis showing that "authenticity" can be defined purely structurally (based on current psychological relations) without any reference to history, and this definition successfully distinguishes between a normal agent and a brainwashed agent without invoking alternative possibilities, I would concede that sourcehood is sufficient. Currently, structural theories struggle to distinguish the brainwashed agent from the normal one if both identify with their desires.
  2.  **Real-World Normative Shift:** If we observe a clear, sustained shift in legal and ethical practice where victims of coercive persuasion (such as long-term cult deprogramming cases or victims of trafficking forced into complicity) are consistently held fully criminally liable once they identify with their actions, this would suggest our collective moral intuition has aligned with the sourcehood view. If society determines that "owning" the desire is enough to warrant punishment, regardless of how the desire was implanted, the philosophical distinction I draw here would lack practical moral weight.

  Until such an analysis or shift occurs, the Principle of Alternative Possibilities must remain alive in a historical form to protect the integrity of the moral agent.
