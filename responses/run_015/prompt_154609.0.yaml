  9.  **Self-Correction during drafting:** I need to make sure I don't just say "The colleague is wrong." I need to explain *why* the philosophical machinery supports that. The concept of "Finkish Dispositions" is perfect here. Also, need to address the friend's claim about the system "never surprising itself." That's a red herring regarding flexibility. Flexibility is about input-output mapping, not internal surprise.

  10. **Final check against constraints:** No biology/self-awareness assumptions. Plain pushback.
      *   *Check:* I will argue that "self-surprise" is irrelevant to flexibility. I will argue that "could have done otherwise" is irrelevant if the mechanism prevents it *now*.

