      *   Dependency order? Check (Intuition -> Theory).
      *   Misconceptions mapped? Check.
      *   Check question? Check.
      *   What to skip? Check.
      *   Casual tone? Check.

  7.  **Final Polish:** Make sure the distinction between the hand (body part) and the self (subject) is clear in the "where it breaks" section. Ensure the check question isn't just a recall question. (Self-Correction: Make sure the check question forces them to rule out inference.)

