      *   **Timing the Concepts:** Don't hit them with "direct presence" jargon yet. Let them feel the "I am" first. Introduce the terminology *after* they've struggled with the distinction between "feeling a limb" and "being a self."
      *   **Addressing Misconceptions:**
          *   *"I'd be nothing":* Head this off right when you remove the hand. Ask: "Does the *awareness* disappear, or just the *object* of awareness?"
          *   *"Ghost in the machine":* Save this for the debrief. Avicenna isn't proving a spooky substance; he's proving a mode of access.
      *   **What to Skip:** Definitely skip the celestial intellects, the emanation scheme, and the detailed faculty psychology (internal senses like *wahm*). Keep it to the essence of self-awareness.
      *   **The Check Question:** Needs to distinguish between "I infer I exist because I think" (Descartes) vs. "I am present to myself" (Avicenna).

  5.  **Refining the "Hand" Analogy (Crucial Step):**
      *   I need to be precise. The prompt asks to build the *whole thing* around this.
      *   *Step 1:* Eyes closed. Hand in front of face. You know it's there.
      *   *Step 2:* Why? Proprioception.
      *   *Step 3:* Avicenna says: Imagine that proprioception is gone too. No arm. No leg. Just the awareness that was *doing* the knowing.
      *   *The Break:* The hand example relies on bodily representation (the schema of the hand). Avicenna argues the *self* is not that schema. The hand example gets them to "internal sense," Avicenna wants "intellectual self-presence."
      *   *Dependency:* Intuition first, theory second. If you define "direct presence" first, it's abstract. If they feel the "I am" in the dark, then you label it, it sticks.

  6.  **Review against Constraints:**
