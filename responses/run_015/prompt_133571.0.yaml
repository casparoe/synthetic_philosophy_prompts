  We hold the scale where birth and nothing strain,
  And feel the heavy weight of coming pain.
  We think the good should not be sought in vain,
  Nor life deny us happiness and gain.
  A symetric design holds balance plain,
  Where joy and hurt exist within one chain.
  To save from harm is duty, clear and main,
  To give delight should weigh the same again.

  Yet suffering needs a soul to take the harm,
  A witness born to feel the wound go deep.
  The non-existent feel no cold alarm,
  No promise broken that they meant to keep.
  A living soul must bear the pain's annoy,
  But none are left to miss the absent—
