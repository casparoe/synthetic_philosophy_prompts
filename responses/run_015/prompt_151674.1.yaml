          *   *Philosophical label:* Epistemic Justice (Fricker), Recognition Theory.
          *   *Requirement:* This is often the *real* driver, disguised as epistemology.
      *   **Consistency Check:** Do these clash? Yes. Radical constructivism (truth is relative) clashes with the moral urgency (injustice was *real*).
      *   **Strictly Requires vs. Fits Well:**
          *   *Requires:* Pluralism, ethical priority of the marginalized.
