answer: |-
  The curatorial protocol you describe—often termed **mnemonic pluralism** or **restorative curation**—rests on a complex philosophical substrate that blends epistemology, social ontology, and normative ethics. To reconstruct the implicit theory, we must disentangle the claim that lived experience *reveals* hidden truths from the claim that community memory *creates* historical truth.

  Below is a reconstruction of the philosophical commitments presupposed by this practice, distinguishing between what is strictly required for the practice to function and what is merely compatible with it, followed by an analysis of the counterfactual scenario where archival accuracy is decisive.

  ### 1. The Epistemic Commitment: Standpoint and the Limits of the Archive
  The practice presupposes a critique of **positivist empiricism**. It assumes that the archival record is not a neutral mirror of reality but a selective artifact, often produced by the victors, the state, or the oppressor.

  *   **Special Epistemic Status for Testimony:** The framework relies on a version of **Standpoint Epistemology**. It posits that marginalized groups possess a specific epistemic advantage regarding their own suffering. While a document might record a date or a troop movement (brute facts), oral testimony records the *phenomenological reality* of the event (the fear, the intent, the structural violence).
  *   **Non-Documentary Theory of Knowledge:** It assumes that historical knowledge is not exhausted by documentary verification. It treats **affective truth** (how the event felt and was processed) as a valid form of historical data that can contradict **forensic truth** (what physically occurred) without being "false."
  *   **Accepted vs. Contested:**
      *   *Broadly Accepted:* Testimony is a legitimate form of evidence; archives are biased and incomplete.
      *   *Genuinely Contested:* The claim that testimony can *override* documentary evidence regarding objective events (e.g., casualty numbers, dates of battles) when the two are mutually exclusive. Most analytic philosophers of history maintain that contradictory propositions cannot both be true in a correspondence sense; this practice implies a shift to a **coherence theory of truth** (truth is what fits the community's narrative structure) or a **pragmatic theory** (truth is what facilitates healing).

  ### 2. The Ontological Commitment: Social Facts and Constitutive Memory
  When defenders claim that "a group's self-understanding partly constitutes the historical fact," they are making a specific social-ontological claim.

  *   **History as Social Fact:** This draws on the distinction between *brute facts* (independent of human opinion, e.g., "a building burned") and *institutional/social facts* (dependent on collective intentionality, e.g., "a massacre occurred"). The practice implies that for public history, the *social fact* (the memory of the massacre) is more ontologically significant than the *brute fact* (the forensic details of the burning).
  *   **Constitutive Memory:** It presupposes that memory is not merely representational (a picture of the past) but **performative**. By remembering the event in a specific way, the community sustains its identity. Therefore, altering the memory to fit archives might not just be "correcting an error" but "dissolving the group."
  *   **Consistency Check:** There is a tension here. If the practice claims to serve *justice* (correcting a past wrong), it implicitly admits a realist ontology (the wrong *really* happened). However, if it grants authority over *facts* to the community, it leans toward constructivism. The theory remains consistent only if it distinguishes between **forensic reality** (what happened) and **historical meaning** (what it signifies). The protocol prioritizes the latter.

  ### 3. The Normative Commitment: Epistemic Justice and Authority
  The most robust philosophical pillar is not epistemological but ethical. The shift of editorial authority is a claim about **rights**, not just knowledge.

  *   **Epistemic Justice:** Drawing on Miranda Fricker's work, the practice assumes that traditional historiography has committed *testimonial injustice* against these communities. Granting editorial authority is a form of **reparative epistemology**—correcting the power imbalance in who gets to define truth.
  *   **Normative Claim over Narrative:** It asserts a **right to narrative self-determination**. Just as political sovereignty grants a group control over territory, mnemonic sovereignty grants control over the story. This is a normative claim that group autonomy outweighs the public's right to the most forensically accurate account.
  *   **Strict Requirement vs. Fit:**
      *   *Strictly Requires:* The practice *requires* the normative claim that the community's moral stake in the narrative outweighs the historian's epistemic stake in accuracy. Without this ethical hierarchy, the practice collapses.
      *   *Fits Well With:* Radical relativism (the idea that there is no objective past). However, the practice does not *strictly require* relativism. One can believe objective truth exists (realism) but argue that in a public memorial context, ethical repair is more valuable than forensic precision.

  ### 4. Distinguishing Requirements from Compatibilities
  To clarify the implicit theory, we must separate the load-bearing beams from the decorative trim.

  | Feature | **Strictly Required** (The practice fails without this) | **Merely Compatible** (Fits well, but not necessary) |
  | :--- | :--- | :--- |
  | **Nature of Truth** | **Pluralism:** There is more than one valid metric for historical truth (e.g., emotional truth vs. forensic truth). | **Relativism:** There is *no* objective truth. (One can be a realist and still prioritize memory for ethical reasons). |
  | **Role of Evidence** | **Expanded Evidentiary Base:** Oral testimony counts as evidence equal to documents. | **Anti-Archivalism:** Documents are inherently suspect. (One can value archives but see them as incomplete). |
  | **Authority** | **Normative Priority:** The community's right to self-definition trumps the historian's duty to accuracy. | **Epistemic Superiority:** The community is *always* right about facts. (The practice allows they might be factually wrong but still granted authority). |
  | **Goal of History** | **Social Cohesion/Healing:** The purpose of the museum is restorative. | **Political Activism:** The purpose is to advance a specific political agenda. |

  **Consistency Analysis:** The commitments are mutually consistent *only if* the purpose of the institution is defined as **memorialization** rather than **research**. If the institution claims to be a research archive, the claim that memory constitutes fact is inconsistent with professional standards. If it claims to be a memorial, the consistency holds because the "fact" being curated is the *impact of the past on the present*, not just the past itself.

  ### 5. The Counterfactual: If Archival Accuracy Were Decisive
  If the underlying framework were replaced by one treating archival accuracy as always decisive (a **Forensic-Realist Model**), museum and memorial practice would undergo radical transformation:

  1.  **Hierarchical Display:** Conflicting accounts would not be presented side-by-side as equals. The archival account would be presented as "The Event," and oral testimony would be framed as "Memory of the Event," potentially with footnotes indicating discrepancies.
  2.  **Loss of Editorial Veto:** Community boards would become advisory rather than authoritative. Historians/curators would have final say on placard text.
  3.  **Shift in Function:** The institution would move from a **site of conscience** (focused on healing and identity) to a **site of documentation** (focused on verification).
  4.  **Potential Harm:** In post-conflict societies, this could result in **epistemic violence**. If a community remembers a massacre that documents obscure (due to state censorship), a forensic-realist model might label the memory "unverified" or "myth," effectively silencing the victims a second time.
  5.  **Standardization:** Narratives would converge across different regions based on the central archive, reducing local variation. The "messiness" of contradictory memories would be smoothed over to create a single, coherent, fact-checked timeline.

  ### Summary of the Implicit Theory
  The practice presupposes a **Normative-Constructivist Hybrid**.
  1.  **Epistemologically:** It argues that "historical fact" in the public sphere includes the *social reception* of events, not just their physical occurrence.
  2.  **Ontologically:** It treats collective memory as a constitutive element of social reality, not just a reflection of it.
  3.  **Normatively:** It prioritizes **epistemic justice** (repairing the credibility of the marginalized) over **correspondence truth** (matching records to reality) in the specific context of public memorialization.

  The practice is philosophically stable only if one accepts that public history is a branch of **ethics** first and **science** second. If one insists public history is a science, the practice is incoherent; if one insists it is a tool for social repair, the practice is a rigorous application of restorative justice principles to the domain of knowledge.
