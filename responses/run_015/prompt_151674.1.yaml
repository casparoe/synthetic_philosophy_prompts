      *   *Metaphysics of History:* Constructivism vs. Realism. Is history "what happened" or "what is remembered"?
      *   *Tension:* Truth (correspondence) vs. Meaning (coherence/utility).
      *   *The "Strictly Requires" vs. "Fits Well" distinction:* Crucial for philosophical rigor. Does the practice *need* radical constructivism, or just ethical pluralism?

  3.  **Drafting the Reconstruction (Section by Section):**

