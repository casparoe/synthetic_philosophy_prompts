answer: |-
  There is no single, canonical proper noun (like "The Gettier Problem" or "The Trolley Problem") that universally names this exact two-layer configuration in the philosophical literature. However, the structure you have identified is a recognized and serious tension within **consequentialist decision theory** and **moral epistemology**.

  The closest established framework is **The Objection from Cluelessness**, but your insight pushes beyond the standard formulation into what can be precisely termed **Second-Order Cluelessness** or **The Procedural Regress**.

  Here is the breakdown of how the field carves out this distinction, how it differs from related concepts, and where its boundaries lie.

  ### 1. The Established Context: The Objection from Cluelessness
  The first layer of your problem is well-documented under **The Objection from Cluelessness** (championed by philosophers like James Lenman and Hilary Greaves).
  *   **Standard Definition:** Consequentialism requires us to maximize the good, but we are epistemically "clueless" about the long-term, ripple effects of our actions. Therefore, consequentialism is action-guiding only in trivial cases.
  *   **Standard Response:** Philosophers typically respond by suggesting we use **proxies** or **heuristics** (e.g., "follow common sense," "maximize local welfare," "adhere to rules that generally work").

  ### 2. Your Specific Insight: Second-Order Cluelessness
  You have identified that the *response* to cluelessness is itself subject to cluelessness. This is not yet a standardized proper noun, but in technical discourse, it is best described as **Second-Order Cluelessness** or **Meta-Procedural Uncertainty**.

  *   **The Structure:**
      *   **Layer 1 (Object Level):** Action $A$ vs. Action $B$. Consequences are unknowable.
      *   **Layer 2 (Meta Level):** Decision Rule $X$ (e.g., "follow tradition") vs. Decision Rule $Y$ (e.g., "maximize local welfare").
      *   **The Problem:** The choice of Rule $X$ over Rule $Y$ is itself an action with unknowable consequences. If adopting Rule $X$ leads to a subtly worse trajectory of history than Rule $Y$, but you cannot trace that either, you have not escaped the original problem; you have merely displaced it.

  This differs from the standard "Cluelessness Objection" because the standard objection assumes that switching to a heuristic *solves* the epistemic gap. You are correctly noting that the *selection of the heuristic* re-opens the gap.

  ### 3. Distinction from Related Concepts
  To understand the boundaries, it is crucial to distinguish this from three similar-sounding concepts:

  **A. Bounded Rationality (Herbert Simon)**
  *   **What it is:** A descriptive theory in economics and psychology stating humans have limited cognitive resources and therefore "satisfice" rather than maximize.
  *   **Why it's different:** Bounded rationality is *descriptive* (how we *do* decide). Your problem is *normative* (how we *should* decide given that we can't calculate). Bounded rationality accepts the heuristic as a necessary biological fact; you are questioning the *moral justification* for picking one heuristic over another when both have unknowable long-term effects.

  **B. Normative Uncertainty (William MacAskill et al.)**
  *   **What it is:** Uncertainty about which *moral theory* is true (e.g., "Should I be a utilitarian or a deontologist?").
  *   **Why it's different:** Normative uncertainty assumes you can assign probabilities to theories. Your problem is deeper: even if you are 100% sure you are a consequentialist, you cannot execute the theory. Furthermore, normative uncertainty usually focuses on weighting theories, not on the *consequential ripple effects of the decision procedure itself*.

  **C. Rule Consequentialism's "Collapse Objection"**
  *   **What it is:** The argument that Rule Consequentialism (follow rules that maximize good) inevitably collapses into Act Consequentialism (do whatever maximizes good in the specific case) because if you know breaking the rule yields more good, you should break it.
  *   **Why it's different:** The Collapse Objection is about logical consistency. Your problem is about **epistemic opacity**. You aren't asking if you *should* break the rule; you are asking how you can justify picking the rule in the first place when the *picking* is as opaque as the *acting*.

  ### 4. Proposed Precise Definition
  If you were to name this for a philosophical paper, the most precise term would be **The Regress of Decision Procedures under Deep Uncertainty**.

  **Definition:** A decision-theoretic state in which an agent, unable to evaluate the consequences of first-order actions due to epistemic limits, adopts a second-order decision rule to resolve the uncertainty, but recognizes that the selection and implementation of that second-order rule are themselves subject to the same epistemic limits and consequential weight as the first-order actions.

  ### 5. Boundaries: What Sits Outside the Edge?
  To ensure you apply this term precisely, here are cases that sit *just outside* this configuration:

  *   **Risk vs. Ignorance:** If you can assign probabilities to the outcomes of your heuristics (e.g., "There is a 70% chance 'follow tradition' yields better stability"), you are in the realm of **Risk**, not this problem. This problem requires **Knightian Uncertainty** (probabilities are unknowable).
  *   **Deontological Frameworks:** If you choose a rule because it is *intrinsically right* (e.g., "Do not lie," regardless of consequences), you are outside this problem. Your problem is specific to frameworks where the *value* of the rule depends on its *outcomes* (consequentialism).
  *   **Arbitrary Tie-Breaking:** If you acknowledge the heuristics are equivalent and flip a coin, you have accepted the indeterminacy. Your problem arises because you suspect the heuristics are *not* equivalent, but you cannot know which is better.
  *   **The Problem of Criterion (Epistemology):** This is the structural analog in epistemology ("How do we know which method yields knowledge?"). It is outside the edge because it concerns *truth*, not *consequences*. Your problem is specifically about the *causal ripple effects* of the decision method.

  ### Summary
  The field has not carved out a single catchy proper noun for this, likely because it is often treated as a fatal flaw that dissolves the theory rather than a stable phenomenon to be named. However, the precise conceptual location is **Second-Order Cluelessness within Consequentialist Decision Theory**. It marks the point where **epistemic humility** (admitting you can't calculate consequences) confronts **procedural consequentialism** (the fact that your method of humility also has consequences you can't calculate).
