prompt: |-
  I work on developer tooling, and most of what I ship is external memory for other people's thinking: language-model agents with retrieval and scratchpads, IDEs that hold half a codebase's invariants in autocomplete, note systems people query instead of remembering. In design reviews we keep having the same argument in engineering vocabulary — is this artifact part of the cognitive system, or an instrument the agent consults? I want a specification, not a slogan.

  Please write out what a theory of cognitive extension would have to deliver in order to be usable for that purpose: as a decision procedure for someone who has to say, of a given artifact embedded in a given practice, whether it is (or is becoming, or could be trained into being) part of the agent's cognitive machinery rather than a tool the agent uses. For each requirement, give the case or consideration behind it, and mark whether it is non-negotiable for my purpose or merely a preference of one camp. Where a requirement is really a prejudice of a research programme dressed up as a constraint, say so.

  Here are the cases I want any candidate theory forced to adjudicate — add the ones I'm missing and discard any you think are bogus:

  - A retrieval-augmented agent whose retrieved passages are causally upstream of every output, are not in its weights, are fetched by a mechanism the system itself invokes, and are intermittently wrong without the agent noticing. Contrast it with an agent that ingested the same corpus during training. Both are causally dependent on the same text; only one is intuitively "remembering."
  - A senior engineer who cannot state the invariants of the system she maintains unless the IDE is open with autocomplete and inline docs. Her dependence looks structurally identical to the agent's, but no one calls her prosthetically augmented — they call her competent.
  - The diarist who writes everything down and never rereads it: the externalization does its work at write time, with no read-back loop at all.
  - Resources the agent modifies and whose modification does the work — a scratchpad, a sketch, a reordered pile — where nothing like storage-and-retrieval is happening.
  - Resources the agent built itself versus ones designed by someone else: your own notebook versus your colleague's, your own retrieval corpus versus a vendor's.
  - Dependence that fades with practice: the newcomer who must look up every API signature and the veteran who no longer does. Does the theory have to handle degrees and trajectories, or can it defend a binary verdict?
  - The pair-programming and on-call-rotation cases, where the functionally relevant loop runs through other people. If the cut isn't at the skull and the skin, what stops it from running out to the whole organization, and is that stopping problem a defect of the theory or of my question?
  - The gap between extending cognition and extending a mind: whether my design question even needs the phenomenal-consciousness half of the claim, and whether a theory may collapse that distinction or must respect it.

  Beyond the cases, tell me which desiderata you think cannot be jointly satisfied — if some subset is unsatisfiable, that itself is the answer I most want — and which single requirement does the most work in excluding candidates. I'd also like a short scorecard, but score moves rather than authors: the parity-style move (treat an external process that plays the same functional role as an internal one as cognitive), the proprietary-marker move (cognition requires a kind of content or process artifacts cannot have), the integration-and-entrenchment move (availability, ease of access, trust, and a history of incorporation into practice), and the interventionist move (constitution as mutual manipulability). No names, dates, or citations — I want the moves, not the bibliography. A table is fine if it stays readable.

  Two last things. First, I have no philosophy background: flag any term of art when you first use it, but don't slow down to explain the basics of the debate. Second, calibrate and push back: tell me which claims in your answer you hold confidently and which are contestable or speculative, and if the request as posed rests on a confused premise — if "part of the cognitive system" has no fact of the matter to be right about, or if my design question turns out to be a different question wearing this one's clothes — say that plainly instead of handing me a tidy list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Works on developer tooling (LLM agents, IDEs, note systems).
      *   **Problem:** Needs a specification/theory of *cognitive extension* to decide if an artifact is part of the cognitive system or just a tool. Current design reviews argue about this using engineering vocabulary but lacking a theoretical basis.
      *   **Goal:** A decision procedure (theory) that adjudicates specific cases.
      *   **Requirements:**
          *   List requirements for the theory (with rationale and "non-negotiable" vs. "preference" status).
          *   Identify prejudices disguised as constraints.
          *   Adjudicate specific cases (Retrieval vs. Training, Engineer+IDE, Diarist, Scratchpad, Self-built vs. Other-built, Fading Dependence, Social/Org loops, Cognition vs. Mind).
          *   Add/Remove cases as needed.
          *   Identify unsatisfiable desiderata (trade-offs).
          *   Identify the single most exclusionary requirement.
          *   Scorecard of "moves" (Parity, Proprietary-marker, Integration, Interventionist).
          *   No names/dates/citations (focus on moves).
          *   Flag terms of art.
          *   Calibrate confidence/push back on confused premises.
      *   **Tone:** Professional, direct, philosophical but grounded in engineering practice. No fluff.

  2.  **Deconstruct the Core Tension:**
      *   The user wants a *binary* or *definitive* decision procedure ("is this part of the system?").
      *   Philosophy of Mind (specifically Extended Cognition/HEC - Hypothesis of Extended Cognition) generally suggests this is a *gradient* or *context-dependent* matter, not a metaphysical fact.
      *   *Critical Pushback:* The request assumes there *is* a fact of the matter. My job is to tell them if that's true. (Spoiler: It's likely not a binary fact, but a design stance).
      *   *Engineering Utility:* Even if metaphysically fuzzy, does a functional definition work for reliability, safety, and UX? Yes.

  3.  **Drafting the Theory Requirements (The Specification):**
      *   To work as a decision procedure, the theory needs operational criteria.
      *   *Requirement 1: Functional Isomorphism (Parity).* If it does what memory does, treat it as memory. (Non-negotiable for the "extension" claim).
      *   *Requirement 2: Coupling/Integration.* How tight is the loop? Latency, trust, automaticity. (Non-negotiable for distinguishing tool vs. part).
      *   *Requirement 3: Ownership/Agency.* Who controls the update mechanism? (Preference/Prejudice).
      *   *Requirement 4: Transparency.* Is the artifact invisible in use? (Preference).
      *   *Requirement 5: Normative Accountability.* If it fails, who is blamed? (Crucial for engineering).

  4.  **Adjudicating the Cases:**
      *   *RAG vs. Training:* Training = weights (internal). RAG = input (external). Parity principle struggles here. Integration principle helps (RAG is often less trusted/transparent).
      *   *Engineer + IDE:* She is competent. The IDE is a tool *becoming* extension. If she *cannot* function without it, it's functionally extended.
      *   *Diarist (Write only):* This is offloading/cleanup, not extension of *retrieval*. It's cognitive *offloading*, not *extension* in the active sense.
      *   *Scratchpad:* This is working memory extension. High coupling. Definitely extended.
      *   *Self-built vs. Vendor:* Trust/Transparency issue. Vendor = tool (black box). Self = extension (transparent).
      *   *Fading Dependence:* Trajectory matters. Novice = Tool. Expert = Extension (or internalized). Theory must handle gradients.
      *   *Social/Org:* The "Coupling" constraint usually stops at the skin for individuals, but for *distributed cognition*, the group is the unit. Need to define the *unit of analysis*.
      *   *Cognition vs. Mind:* Drop "Mind" (phenomenology). Keep "Cognition" (information processing). Engineering cares about function, not qualia.

  5.  **Identifying Unsatisfiable Desiderata:**
      *   *Binary Verdict vs. Gradient Reality:* You can't have a crisp binary boundary for a continuous phenomenon.
      *   *Metaphysical Truth vs. Engineering Utility:* Asking "what *is* it" is less useful than "how should we *treat* it for safety/reliability?"
      *   *Individual vs. System:* You can't simultaneously define the individual mind as skull-bound and acknowledge organizational extension without shifting the unit of analysis.

  6.  **Scorecard of Moves:**
      *   *Parity:* Strong for function, weak for boundaries.
      *   *Proprietary-marker:* Weak (biological chauvinism).
      *   *Integration:* Best for engineering.
      *   *Interventionist:* Good for causality, hard to measure.

  7.  **Refining the Pushback (Crucial Step):**
      *   The user asks for a "specification, not a slogan."
      *   But the underlying question ("Is it *really* part of the mind?") might be a category error.
      *   *Real Question:* "Is this component reliable enough to be treated as a primitive in our safety model?"
      *   I need to tell them that "Cognitive Extension" is a *stance*, not a *discovery*.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the utility, flag the metaphysical trap.
      *   **The Specification (Requirements):** Table or list with Rationale/Status.
      *   **Case Adjudication:** Go through their list + additions.
      *   **Unsatisfiable Desiderata:** The trade-offs.
      *   **Scorecard:** The Moves.
      *   **Calibration/Pushback:** The "Fact of the Matter" problem.

  9.  **Drafting Content - Specific Considerations:**
      *   *Term Flagging:* "Coupling," "Parity Principle," "Constitution," "Qualia" (maybe avoid), "Normative."
      *   *Tone Check:* Don't sound like an academic. Sound like a systems architect who reads philosophy.
      *   *The "Engineer" Case:* This is the crux. If the IDE goes down, she crashes. Is the IDE part of her? Functionally, yes. Legally/Normatively, no. The theory must distinguish *functional constitution* from *normative responsibility*.
      *   *The "RAG" Case:* Weights are non-interpretable state. Retrieval is interpretable state. That's a key engineering distinction, not just philosophical.

  10. **Final Review against Constraints:**
      *   No names/dates/citations? (Check: Avoid Clark, Chalmers, Sutton, Menary, etc.).
      *   Flag terms of art? (Check).
      *   Scorecard of moves? (Check).
      *   Confidence calibration? (Check).
      *   Address the "confused premise"? (Check - this is vital).

  11. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe I should advocate for the Parity Principle.
      *   *Correction:* No, Parity is too permissive for engineering. If a calculator is parity-equal to mental math, is it part of the mind? Engineers need to know if the calculator can be poisoned. Integration/Trust is more relevant.
      *   *Initial thought:* Treat the Social case as "Distributed Cognition."
      *   *Correction:* Keep it focused on the *individual agent's* boundary as per the prompt, but note where the theory breaks.
      *   *Refining the "Decision Procedure":* Make sure it sounds like an API spec. Input: Artifact + Practice. Output: Status (Core/Peripheral/External).

  12. **Final Polish:** Ensure the distinction between "Cognition" (processing) and "Mind" (experience) is clear, as requested. Ensure the "Non-negotiable" vs "Preference" tags are explicit.

  *(Self-Correction on the "Confused Premise"):* I need to be very clear that asking "Is it *really* part of the cognitive system?" is like asking "Is a microservice *really* part of the application?" It depends on your deployment boundary. The theory doesn't discover the boundary; it *sets* it for a specific purpose (safety, UX, liability). I will emphasize this in the "Pushback" section.

  13. **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  ### Preface: The Confused Premise

  You asked for a specification to determine if an artifact *is* part of a cognitive system. I must start by flagging a high-confidence claim: **There is no fact of the matter here.**

  "Cognitive extension" is not a natural kind like "gold" or "water." It is a *stanc*e. Asking whether an IDE is *really* part of an engineer's mind is like asking whether a microservice is *really* part of your application. It depends on where you draw the deployment boundary for the purpose of reliability, liability, and maintenance.

  If you treat the theory as a discovery procedure (finding the truth), it will fail. If you treat it as a **boundary-setting protocol** (deciding how to engineer for safety and UX), it is highly usable. The requirements below are calibrated for the latter. I am confident in this distinction; the rest of the theory is contestable.

  ---

  ### Part 1: Specification Requirements

  To function as a decision procedure for engineering, a theory of cognitive extension must deliver the following requirements. I have marked those that are **Non-Negotiable (NN)** for your stated purpose (making design decisions) versus those that are **Preference/Prejudice (P)** (philosophical baggage that may not serve engineering).

  | Requirement | Rationale / Case | Status |
  | :--- | :--- | :--- |
  | **1. Functional Parity** | If an external process solves a problem in the same way an internal process would, the theory must not exclude it based on substrate (silicon vs. neuron). Without this, you cannot compare RAG to weights. | **NN** |
  | **2. Coupling Density** | The theory must measure the latency, bandwidth, and automaticity of the loop between agent and artifact. High latency/low trust = Tool. Low latency/high trust = Extension. | **NN** |
  | **3. Normative Accountability** | When the artifact fails or outputs garbage, who is blamed? If the user is blamed, it's a tool. If the system is blamed, it's a component. This is crucial for safety cases. | **NN** |
  | **4. Transparency of State** | Can the agent inspect the state of the artifact? Weights are opaque; retrieval passages are visible. Engineering requires inspectability for debugging. | **P** (Engineering need, not metaphysical need) |
  | **5. Endogenous Control** | Does the agent initiate the access, or is it prompted by the environment? True extension implies the agent treats the resource as "self" to be queried at will. | **P** (Debated in philosophy) |
  | **6. Historical Entrenchment** | Has the artifact been used long enough to form habits? New tools are tools; old tools become limbs. The theory must account for time. | **P** (Gradient, hard to spec) |
  | **7. Substrate Neutrality** | The theory must not privilege biological tissue. If it does, it is "bio-chauvinism" disguised as constraint. | **NN** (To avoid prejudice) |

  **Prejudice Alert:** Requirement 5 (Endogenous Control) is often a prejudice of individualism. In collaborative tooling, the environment often triggers the cognitive loop (e.g., an alert triggers an on-call response). Treating this as "not cognitive" biases the theory against reactive systems.

  ---

  ### Part 2: Case Adjudication

  Here is how a theory built on the requirements above (specifically prioritizing **Coupling**, **Parity**, and **Accountability**) adjudicates your cases. I have added one case and discarded one nuance.

  | Case | Verdict | Reasoning |
  | :--- | :--- | :--- |
  | **RAG vs. Training** | **RAG = Tool; Training = Component.** | Both are causally upstream. But Training weights are *transparently opaque* (you can't read them, but they are always there) and high-coupling. RAG is low-coupling (network latency), inspectable, and intermittent. RAG is a peripheral device; Weights are the processor. |
  | **Engineer + IDE** | **Extension (Functional); Tool (Normative).** | Functionally, she cannot compute invariants without it (Parity + Coupling). It is part of her cognitive system *during work*. Normatively, if the IDE suggests a bug, she is liable, not the IDE vendor. The theory must split these contexts. |
  | **The Diarist (Write-only)** | **Not Extension; Offloading.** | Extension requires a read-back loop (storage and retrieval). Writing to forget is *discharging* cognitive load, not extending processing capacity. It's a garbage collector, not RAM. |
  | **Scratchpad / Sketch** | **Extension (Working Memory).** | High coupling, low latency, agent-modified. This is the strongest case for extension. The scratchpad holds state that the brain would otherwise hold. Mutual manipulability is high. |
  | **Self-built vs. Vendor** | **Self = Extension; Vendor = Tool.** | This hinges on **Transparency** and **Trust**. You trust your own notebook structure implicitly (transparent). You query a vendor DB with skepticism (opaque). Engineering-wise, vendor APIs are external dependencies; own code is internal modules. |
  | **Fading Dependence** | **Trajectory matters.** | Novice = Tool (high friction, conscious lookup). Veteran = Extension (low friction, automatic). A binary theory fails here. The spec must output a *probability of integration*, not a boolean. |
  | **Social / Org Loops** | **System Boundary Shift.** | If the loop runs through another person, the "agent" is no longer the individual; it is the *dyad* or *team*. If you insist the agent is the individual, the theory breaks. You must redefine the unit of analysis to "Distributed System." |
  | **Cognition vs. Mind** | **Drop "Mind".** | "Mind" implies phenomenology (what it feels like). "Cognition" implies information processing (what it does). For tooling, you only care about Cognition. Demanding "Mind" adds no engineering value. |
  | **Added: The Poisoned Cache** | **Litmus Test.** | If an external artifact is corrupted (hallucinated RAG, bad docs), does the agent propagate the error blindly (Tool) or detect/resist it (Extension with monitoring)? Extension implies error-checking mechanisms akin to internal consistency checks. |

  **Discarded Nuance:** The distinction between "resources the agent built" vs. "designed by someone else" is often a proxy for Trust/Transparency. I collapsed it into the Transparency requirement rather than treating it as a metaphysical ownership claim.

  ---

  ### Part 3: Unsatisfiable Desiderata

  You asked which desiderata cannot be jointly satisfied. This is the most critical section for your design reviews.

  1.  **Binary Verdict vs. Continuous Reality:** You cannot have a theory that outputs a crisp "Yes/No" on cognitive extension while acknowledging that coupling, trust, and dependence exist on a spectrum.
      *   *Trade-off:* If you want a binary decision for safety certification, you must impose an arbitrary threshold on Coupling Density. This will misclassify edge cases.
      *   *Recommendation:* Output a "Integration Score" (0.0 to 1.0). Treat >0.8 as "Internal Component" for safety modeling.

  2.  **Individual Agency vs. Systemic Coupling:** You cannot maintain a strict boundary around the individual human/agent while acknowledging that their cognitive performance is constitutively dependent on organizational structures (on-call rotations, team norms).
      *   *Trade-off:* Either you accept that the "Agent" is sometimes the Team (and design for group cognition), or you admit the theory is incomplete for social contexts.
      *   *Recommendation:* For developer tooling, define the "Agent" as the *Human-Machine Dyad*. Do not try to isolate the human.

  3.  **Reliability vs. Flexibility:** If you treat an artifact as "Part of the Mind" (Extension), you expect it to be as reliable as memory. If you treat it as a "Tool," you expect it to be fallible.
      *   *Trade-off:* Classifying RAG as "Extension" raises the reliability bar impossibly high (memory is rarely "wrong" in the same way a DB is). Classifying it as "Tool" underestimates its causal power.
      *   *Recommendation:* Treat high-coupling external artifacts as **Unreliable Internal Components**. Design guardrails accordingly.

  ---

  ### Part 4: Scorecard of Moves

  Here is how the common philosophical "moves" score for your specific engineering purpose.

  | Move | Description | Utility for Tooling | Risk |
  | :--- | :--- | :--- | :--- |
  | **Parity Move** | "If it functions like memory, it is memory." | **High.** Prevents biological bias. Allows you to treat caches as memory. | **Over-inclusion.** A calculator is parity-equal to mental math, but you don't want to safety-certify the calculator as a brain lobe. |
  | **Proprietary-Marker Move** | "Only biological/neural content counts." | **None.** This is bio-chauvinism. It blocks you from designing for AI agents entirely. | **Exclusionary.** Renders the theory useless for non-human agents. |
  | **Integration Move** | "Focus on trust, latency, and habit." | **Very High.** Maps directly to UX and system architecture (SLAs, caching strategies). | **Vagueness.** "Trust" is hard to quantify in a spec. |
  | **Interventionist Move** | "If I can change it to change the output, it's part of the system." | **Medium.** Good for debugging (intervention). | **Causality Confusion.** Changing a tool changes output too. Doesn't distinguish tool from part well enough. |

  **Winner:** The **Integration Move** does the most work. It aligns with how you already engineer systems (dependencies, latency budgets, trust boundaries).

  ---

  ### Part 5: Calibration and Pushback

  **Confidence Levels:**
  *   **High Confidence:** The "Fact of the Matter" claim. There is no metaphysical truth to be found here. Any theory you adopt is a convention for design, not a discovery of nature.
  *   **High Confidence:** The "Cognition vs. Mind" distinction. For tooling, phenomenology is irrelevant. Drop the "Mind" half of the claim.
  *   **Contestable:** The "Normative Accountability" requirement. Some argue that if a tool is deeply integrated, the *vendor* should share liability (e.g., medical devices). Your theory might need to adapt if liability shifts.
  *   **Speculative:** The "Poisoned Cache" litmus test. It is possible to have an extended cognitive system that is highly susceptible to poisoning (human memory is suggestible). Susceptibility to error does not necessarily disqualify extension.

  **The Core Pushback:**
  Your request rests on a premise that "part of the cognitive system" is a property of the *artifact*. It is not. It is a property of the *relationship* between the agent, the artifact, and the task.

  *   **Wrong Question:** "Is this IDE part of the engineer's mind?"
  *   **Right Question:** "For the purpose of [Safety / UX / Liability], should we model the IDE as an internal component or an external dependency?"

  If you build a theory that answers the first question, you will get philosophy. If you build a protocol that answers the second, you will get a spec.

  **Final Recommendation:**
  Do not ship a "Theory of Cognitive Extension." Ship a **"Coupling Classification Protocol."**
  Define three tiers:
  1.  **Internal State:** Weights, muscle memory, high-trust low-latency artifacts (Scratchpads). *Requirement: High availability, consistency.*
  2.  **Extended Workspace:** IDEs, Docs, RAG. *Requirement: Observability, fallback mechanisms.*
  3.  **External Tools:** Search engines, Vendor APIs. *Requirement: Error handling, timeout management.*

  This gives you the decision procedure you need without pretending you've solved the mind-body problem.
