prompt: |-
  I’ve just had a long and inconclusive argument with a friend about whether an output from a non-human system can ever count as a performative utterance, and I do not want to have it again. Our disagreement started from a scripted customer-service chatbot that sends a fixed message saying I apologize for the outage whenever an outage is detected, where the company’s policy says customers should treat that message as an official apology; my friend thought this was enough for a real apology, while I thought something essential was missing. We then moved to a harder case: a blockchain-based organization whose code automatically publishes a statement that a member is expelled as soon as a vote passes, and whose governing rules say that publication is the expulsion. We realized we were each assuming a different theory of what a performative utterance has to be, so before I read any more speech-act theory I want a specification of what I should be demanding of one.

  Write the desiderata that any adequate theory of performative utterance must meet in order to settle disputes of exactly this kind. Fix the purpose narrowly: the theory must be good enough to adjudicate whether outputs of non-human or semi-automated systems—scripted chatbot messages, automatic institutional publications, smart-contract declarations, and similar cases—can count as promises, orders, apologies, declarations, or other illocutionary acts, and if so under what conditions.

  The deliverable should be the requirements themselves, with the case or consideration behind each. Cover at least: the paradigm human cases any theory must get right (explicit performatives such as the words used in a marriage ceremony, the naming of a ship, a bequest in a will, and a bet about tomorrow’s rain; and implicit cases such as a one-word order to leave a room); the main varieties of infelicity (an unauthorized person attempting a christening, a promise made without any intention of keeping it, a joke or theatrical use, and a case in which the hearer entirely fails to understand what is being done); and the new algorithmic cases above. Say which distinctions the theory must respect—constative versus performative, explicit versus implicit performative, locutionary versus illocutionary versus perlocutionary, happiness or unhappiness versus truth or falsity, illocutionary force versus propositional content, speaker intention versus conventional procedure, and assertion versus declaration—and which of those distinctions are genuinely load-bearing rather than optional preferences of one school. For each requirement, give the concrete case that motivates it.

  Mark which requirements are non-negotiable for this purpose and which are merely preferences of particular camps; for example, say whether it is a genuine desideratum that no performative be truth-evaluable, or only a preference inherited from an early Austin-style contrast with constatives, and whether a theory must require a speaker with intentions and beliefs or may treat conventional uptake and institutional rule-following as sufficient. Most importantly, flag any pair of desiderata you suspect cannot be jointly satisfied, and explain the conflict: for instance, whether a theory can both require genuine speaker intention for every illocutionary act and also allow a mindless algorithmic publication to be a full declaration, or whether it can both demand that illocutionary categories be mutually exclusive and exhaustive and still accommodate utterances that seem to have more than one force at once.

  If it helps, you may close with at most a short paragraph on how Austin’s early performative/constative account and Searle’s later treatment of declarations each fare against the list; do not write a full scorecard or bibliography, and keep the weight on the criteria rather than the scoring.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata:

  1.  **Analyze the Request:**
      *   **Goal:** Provide a set of desiderata (requirements) for a theory of performative utterances.
      *   **Purpose:** To adjudicate disputes about whether non-human/semi-automated system outputs (chatbots, DAOs, smart contracts) count as performative utterances (apologies, expulsions, promises, etc.).
      *   **Scope:** Must cover paradigm human cases (marriage, ship naming, wills, bets, orders), varieties of infelicity (unauthorized, insincere, joke, misunderstood), and the specific algorithmic cases mentioned (chatbot apology, blockchain expulsion).
      *   **Distinctions to Address:** Constative vs. Performative, Explicit vs. Implicit, Locution/Illocution/Perlocution, Happiness vs. Truth, Force vs. Content, Intention vs. Convention, Assertion vs. Declaration.
      *   **Critical Task:** Distinguish between *non-negotiable* requirements (load-bearing) and *preferences* (school-specific). Flag potential conflicts between desiderata.
      *   **Ending:** A brief paragraph on Austin vs. Searle regarding these criteria (no full scorecard).
      *   **Tone:** Analytical, precise, philosophical but practical for the stated dispute.

  2.  **Deconstruct the Core Conflict:**
      *   *User's Position:* Something essential is missing in the chatbot apology (likely intention/consciousness).
      *   *Friend's Position:* Institutional policy + output = real apology (likely convention/procedure).
      *   *Theoretical Tension:* Intentionalism (Searle/Grice) vs. Conventionalism/Institutionalism (Austin early/early Searle on declarations).
      *   *The Algorithmic Challenge:* Can a system without a mind satisfy the conditions for a speech act if the institution says it does?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Paradigm Coverage.* The theory must explain standard human cases.
          *   *Case:* Marriage ceremony ("I do").
          *   *Why:* If it fails here, it's useless.
          *   *Status:* Non-negotiable.

      *   *Requirement 2: Infelicity Handling.* It must distinguish successful acts from failed ones (misfires, abuses).
          *   *Case:* Unauthorized christening vs. Insincere promise.
          *   *Why:* To distinguish the chatbot (is it a misfire or just insincere?) from a real apology.
          *   *Status:* Non-negotiable.

      *   *Requirement 3: Intention vs. Convention.* This is the crux.
          *   *Case:* The Chatbot Apology.
          *   *Conflict:* Does the *system* need intent, or does the *institution* need to authorize the procedure?
          *   *Status:* **Conflict Flag.** This is where the user and friend disagree. A theory must pick a lane or explain the hybrid. I need to frame this as a requirement to *specify* the role of intention, not necessarily demand human intention.
          *   *Refinement:* The theory must explicitly state whether *psychological state* is necessary or if *institutional attribution* suffices.

      *   *Requirement 4: Truth vs. Happiness.*
          *   *Case:* "I promise to come" (not true/false, but happy/unhappy).
          *   *Status:* Preference (Austin early). Later theories blend these. I should mark this as a preference/legacy distinction, not non-negotiable for the *algorithmic* question.
          *   *Refinement:* The theory must clarify evaluative criteria (felicity conditions vs. truth conditions).

      *   *Requirement 5: Uptake/Understanding.*
          *   *Case:* Hearer fails to understand the order.
          *   *Why:* Does the blockchain expulsion count if no one sees it?
          *   *Status:* Non-negotiable (needs a stance).

      *   *Requirement 6: Force vs. Content.*
          *   *Case:* "Leave!" (Order) vs. "You will leave" (Prediction).
          *   *Why:* To distinguish the chatbot saying "I apologize" (force) from stating "The company apologizes" (content).
          *   *Status:* Non-negotiable.

      *   *Requirement 7: Human Agency Requirement.*
          *   *Case:* The Blockchain Expulsion.
          *   *Why:* This is the specific dispute.
          *   *Status:* **Critical Conflict.** This is the specific variable. The desideratum is that the theory must *resolve* this, not necessarily that it *must* exclude machines.

  4.  **Structuring and Refining the Desiderata:**
      *   I need to group these logically.
      *   I need to be very clear about "Non-Negotiable" vs. "Preference."
      *   I need to highlight the "Hard Conflicts."

      *   *Drafting Requirement 1 (The Baseline):* Paradigm Human Cases. (Marriage, Bets).
      *   *Drafting Requirement 2 (Failure Modes):* Infelicities. (Misfires vs. Abuses).
      *   *Drafting Requirement 3 (The Mind Problem):* Intentionality. (Chatbot).
      *   *Drafting Requirement 4 (The Social Problem):* Convention & Uptake. (Blockchain/Expulsion).
      *   *Drafting Requirement 5 (Evaluation):* Truth vs. Felicity.
      *   *Drafting Requirement 6 (Structure):* Force/Content & Locution/Illocution.

  5.  **Addressing the Conflicts (The "Hard Part"):**
      *   *Conflict A:* Intentionality vs. Institutional Efficacy. If intention is required, chatbots fail. If convention is sufficient, chatbots succeed. A theory cannot have it both ways without redefining "intention" (e.g., derived intentionality).
      *   *Conflict B:* Exclusivity of Force. Can one utterance be two acts? (e.g., A warning that is also a threat).
      *   *Conflict C:* Constative/Performative Divide. Austin abandoned this. A modern theory shouldn't treat it as rigid.

  6.  **Review against Constraints:**
      *   *Cover specific cases?* Yes (Chatbot, Blockchain, Marriage, Christening, etc.).
      *   *Cover distinctions?* Yes (Force/Content, Truth/Happiness, etc.).
      *   *Mark Non-negotiable vs. Preference?* Yes.
      *   *Flag conflicts?* Yes.
      *   *Closing paragraph?* Yes (Austin vs. Searle).

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just list philosophical concepts but frame them as *requirements for the theory*. E.g., instead of "Explain Intentionality," write "The theory must specify the necessity of psychological states."
      *   *Correction:* Ensure the distinction between the *User's* dispute (is it an apology?) and the *Theory's* job (provide criteria to decide) is clear.
      *   *Emphasis:* Highlight that the "Truth vs. Felicity" distinction is largely a preference of early Austin and not load-bearing for the algorithmic question.
      *   *Emphasis:* The "Intention vs. Convention" is the load-bearing conflict.

  8.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  Here is a specification of desiderata for a theory of performative utterance, designed to adjudicate disputes regarding non-human and semi-automated systems.

  ### I. Foundational Coverage (Non-Negotiable)

  **1. The Paradigm Constraint**
  *   **Requirement:** The theory must correctly classify standard, uncontroversial human performative acts as successful illocutionary acts.
  *   **Motivating Case:** A couple saying "I do" in a licensed marriage ceremony; a bet accepted between two friends; a judge sentencing a defendant.
  *   **Rationale:** If a theory cannot account for the clear cases of human speech acts, it lacks the baseline validity to judge edge cases. It must explain *why* these work (e.g., convention, intention, or both).
  *   **Status:** **Non-Negotiable.**

  **2. The Infelicity Taxonomy**
  *   **Requirement:** The theory must distinguish between different modes of failure. It must separate acts that fail to *happen* (misfires) from acts that happen but are *flawed* (abuses).
  *   **Motivating Case:**
      *   *Misfire:* An unauthorized person attempting to christen a ship (the ship is not named).
      *   *Abuse:* A person making a promise without any intention of keeping it (the promise is made, but is insincere).
  *   **Rationale:** This is critical for the chatbot case. Is the chatbot's "apology" a misfire (not an apology at all) or an abuse (an apology that is insincere/hollow)? The theory must provide criteria to distinguish these.
  *   **Status:** **Non-Negotiable.**

  **3. The Force/Content Distinction**
  *   **Requirement:** The theory must separate the *illocutionary force* (what is being done: ordering, promising) from the *propositional content* (what is said: that you leave, that I will pay).
  *   **Motivating Case:** "Leave this room" (Order) vs. "You will leave this room" (Prediction/Assertion). The content is identical; the force differs.
  *   **Rationale:** In the blockchain case, the code publishes "Member X is expelled." Is this an *assertion* of a fact or a *declaration* creating the fact? The theory must provide tools to distinguish force independent of content.
  *   **Status:** **Non-Negotiable.**

  ### II. The Algorithmic Adjudication Criteria (Load-Bearing)

  **4. The Intentionality Specification**
  *   **Requirement:** The theory must explicitly state whether a psychological state (belief, desire, intention) residing in a mind is a necessary condition for illocutionary force, or if "derived intentionality" (institutional assignment) suffices.
  *   **Motivating Case:** The scripted customer-service chatbot. It outputs "I apologize" based on code, not feeling.
  *   **Rationale:** This is the core of your disagreement. Your friend relies on *institutional policy* (the company says this counts). You rely on *phenomenology* (an apology requires regret). The theory cannot be vague here; it must declare if mindless syntax can carry illocutionary force.
  *   **Status:** **Non-Negotiable** (The theory must take a stance, even if that stance is "it depends on the act type").

  **5. The Convention vs. Causation Condition**
  *   **Requirement:** The theory must specify whether the effect of the utterance relies on *securing uptake* (hearer understanding) or merely on *satisfying procedural rules*.
  *   **Motivating Case:** The blockchain expulsion. The smart contract executes automatically upon a vote count. If no member reads the blockchain log, is the member expelled?
  *   **Rationale:** If the theory requires *uptake* (Austin's later view), the act might fail if unnoticed. If it relies on *constitutive rules* (Searle's view on declarations), the act succeeds upon code execution regardless of human attention.
  *   **Status:** **Non-Negotiable.**

  **6. The Agency Attribution Rule**
  *   **Requirement:** The theory must define who the "speaker" is in automated contexts. Is it the machine, the programmer, or the institution deploying the tool?
  *   **Motivating Case:** The chatbot saying "I apologize." Who is the "I"? The software? The company?
  *   **Rationale:** Performative utterances generally require an agent capable of undertaking obligations. A script cannot undertake an obligation; a company can. The theory must allow for *vicarious* performance or rule it out.
  *   **Status:** **Non-Negotiable.**

  ### III. Distinctions: Load-Bearing vs. Optional Preferences

  **7. Truth vs. Felicity (Preference)**
  *   **Requirement:** The theory should clarify whether performatives are evaluated by truth-conditions or felicity-conditions, but it need not enforce a rigid dichotomy.
  *   **Motivating Case:** "I promise to come." Early Austin argued this is not "true/false" but "happy/unhappy." Later theories suggest promises can be false (if insincere).
  *   **Rationale:** For the algorithmic dispute, insisting that performatives *cannot* be true/false is an **Optional Preference** inherited from early Austin. It is not load-bearing. A theory can allow that a chatbot apology is "false" (insincere) without denying it is an apology.
  *   **Status:** **Preference.** (Do not demand a theory maintain the strict 1955 Austin view).

  **8. Constative vs. Performative (Preference)**
  *   **Requirement:** The theory need not maintain a hard wall between describing the world (constative) and changing it (performative).
  *   **Motivating Case:** "The meeting is adjourned." This describes a state that it simultaneously brings about.
  *   **Rationale:** Austin himself abandoned this distinction. Insisting on it hinders analysis of institutional facts (like blockchain records) which are both descriptive and constitutive.
  *   **Status:** **Preference.** (A theory that blurs this is acceptable).

  **9. Illocutionary Exclusivity (Preference)**
  *   **Requirement:** The theory need not demand that every utterance have exactly one illocutionary force.
  *   **Motivating Case:** "There is a bull in the field." This can be an assertion, a warning, and a threat simultaneously.
  *   **Rationale:** Demanding mutual exclusivity makes analyzing complex automated outputs (e.g., a smart contract that executes payment *and* notifies a user) unnecessarily difficult.
  *   **Status:** **Preference.**

  ### IV. Critical Conflicts (Incompatibilities)

  **Conflict A: The Intentionality vs. Institutional Efficacy Trade-off**
  *   **The Conflict:** You cannot simultaneously hold that (1) *genuine psychological intention is necessary for every illocutionary act* AND (2) *mindless algorithmic outputs can be full illocutionary acts.*
  *   **Explanation:** If you require a human mind feeling regret for an apology, the chatbot fails (your position). If you require only that institutional rules deem the output valid, the chatbot succeeds (your friend's position).
  *   **Adjudication:** A theory must choose one of three paths:
      1.  **Strict Intentionalism:** Algorithms cannot perform speech acts (they are merely causal triggers).
      2.  **Strict Conventionalism:** Algorithms can perform speech acts if the institution authorizes them (intent is irrelevant).
      3.  **Derived Agency:** Algorithms perform acts *on behalf of* humans, inheriting the humans' intentions.
      *   *Desideratum:* The theory must explicitly resolve this trilemma. It cannot claim to satisfy both strict intentionality and algorithmic efficacy without redefining "intention."

  **Conflict B: Uptake vs. Automaticity**
  *   **The Conflict:** You cannot simultaneously hold that (1) *hearer uptake (understanding) is necessary for an illocutionary act* AND (2) *smart contracts execute declarations automatically without human monitoring.*
  *   **Explanation:** If the blockchain publishes an expulsion but the software runs on a node no one monitors, has the act occurred? Austin leaned toward uptake being necessary; Searle leaned toward constitutive rules being sufficient.
  *   **Adjudication:** For the blockchain case, a theory prioritizing *uptake* risks rendering the expulsion void until read. A theory prioritizing *code execution* renders the expulsion valid immediately. The theory must state which condition is dominant for "Declarations."

  ### V. Brief Evaluation of Austin and Searle

  Austin's early *How to Do Things with Words* lectures struggle with Requirement 4 (Intentionality) because he initially sought to isolate performatives from truth-evaluable statements, a distinction he later dissolved. His framework is strong on Infelicity (Requirement 2) but ambiguous on non-human agents, as he assumed a human speaker context. Searle's later theory of *Declarations* (Requirement 5) handles the blockchain case better by emphasizing constitutive rules over psychological states, satisfying your friend's view. However, Searle's background theory of *Intentionality* generally requires a mind, which supports your view that the chatbot lacks the necessary "sincerity conditions." Consequently, neither classic theory fully resolves the algorithmic dispute without modification: Austin lacks the institutional rigor for smart contracts, while Searle creates a tension between his rules for declarations and his requirements for mental states. An adequate theory for your purpose must decouple "institutional validity" from "psychological sincerity" to handle the chatbot, treating the former as sufficient for the act's existence and the latter as a condition for its ethical quality.
