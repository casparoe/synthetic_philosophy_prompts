answer: |-
  David Lewis's classic account of convention defines a regularity as a convention if it is a solution to a coordination problem sustained by common knowledge that everyone conforms because they expect everyone else to conform. However, as critics note, this definition is too thin: a habit (driving on the right simply because one always has) and a coercive equilibrium (driving on the right because the state shoots dissidents) look identical to a Lewisian convention in terms of behavioral outcomes. To rescue the framework, we must adopt the proposed refinement: a **reflexive convention** exists only when participants share second-order common knowledge that they are *mutually accountable* for maintaining the regularity, and that this accountability is itself recognized as part of the practice.

  Applying this reflexive-Lewisian framework to democratic norms—specifically the peaceful concession of power and the practice of loyal opposition—reveals that **the reflexive condition successfully distinguishes genuine conventions from mere habits or coercive impositions, and it provides the superior explanation for why democratic norms collapse.** The collapse of democracy is rarely a sudden change in the payoff structure of elections; rather, it is the erosion of the second-order knowledge that actors are mutually bound to uphold the rules of losing. When this layer of mutual accountability dissolves, the convention degrades into a fragile habit that breaks under stress or a coercive tool used by the victor to suppress the vanquished.

  To understand why this distinction matters, we must first see how democratic norms function as reflexive conventions. In a standard Lewisian view, a losing party concedes defeat because they expect the winner to concede next time, coordinating on the equilibrium of "peaceful transfer." But this allows for a cynical interpretation: I concede only because I am too weak to fight. This is coercion or prudence, not convention. Under the reflexive refinement, the losing party concedes because they know the winning party holds them accountable to the norm of concession, and they hold the winners accountable to the norm of loyal governance. Crucially, both know that this mutual accountability is the *glue* of the system. When a politician gives a concession speech, they are not merely announcing a behavioral regularity; they are performing a speech act that reaffirms the second-order knowledge: "We both know we are bound by this rule, and we know we will judge each other by it."

  This framework explains the specific fragility of democratic norms in a way the original Lewisian model cannot. Democratic backsliding often occurs not when the incentives to cheat become overwhelming, but when the *epistemic environment* shifts. Consider the erosion of peaceful concession in polarized environments. If Party A begins to view Party B not as a rival within a shared system but as an existential threat, Party A ceases to recognize Party B as a legitimate partner in mutual accountability. They may still conform to the norm for a time (out of habit or fear), but the second-order common knowledge is broken. Party A no longer believes Party B is accountable to the norm, only to power. Once the reflexive layer is stripped away, the regularity is no longer a convention; it is a temporary truce. This explains why norms can vanish with startling speed: the behavioral regularity was sustained by a thin layer of habit, but the underlying structure of mutual accountability had already rotted. When the first actor tests the boundary, they find no resistance because the mutual expectation of accountability is gone.

  The strongest counter-argument against this reflexive-Lewisian approach is that it imposes **prohibitive epistemic demands** on real-world political actors. Skeptics will argue that politicians are not game theorists; they do not walk around with "second-order common knowledge" of mutual accountability in their heads. They act on instinct, party pressure, or raw calculation. If the definition of a democratic convention requires actors to consciously recognize and validate their mutual accountability, then genuine conventions rarely exist, making the distinction theoretically neat but practically empty. If the bar is set this high, the framework fails to describe the messy reality of politics, where norms often persist despite actors having cynical or incoherent beliefs about why they follow them.

  However, this objection misunderstands the nature of "common knowledge" in social theory. Common knowledge does not require philosophical introspection; it requires public signaling and shared context. The epistemic demand is met through **ritual and rhetoric**, not private cognition. When political elites consistently use the language of "constitutional duty," "the will of the voters," and "respect for institutions," they are generating the public signals necessary to sustain second-order common knowledge. They are broadcasting, "I know that you know that we are bound by this." Conversely, when elites begin to use language that delegitimizes the process itself—claiming elections are rigged, or that the opposition is illegal—they are actively dismantling the common knowledge of accountability. The reflexive condition is not empty because it tracks observable public discourse. The moment the rhetoric shifts from "we lost fairly" to "the system is rigged," the second-order knowledge is publicly revoked, even if the behavioral habit of concession temporarily remains. Therefore, the framework is not too demanding; it accurately identifies the *discursive preconditions* required for a norm to survive a crisis.

  In conclusion, the reflexive-Lewisian refinement is essential for diagnosing the health of a democracy. A mere habit of concession is insufficient to withstand the incentives of high-stakes power; a coercive imposition of order is not democracy at all. Only a reflexive convention, where actors mutually recognize their accountability to the rules of losing, creates a resilient equilibrium. The collapse of democratic norms is best understood not as a failure of coordination, but as a failure of reflexivity. When political actors stop seeing themselves as mutually accountable guardians of the process, the convention becomes a hollow shell. Recognizing this allows us to see that defending democracy requires more than enforcing rules; it requires sustaining the common knowledge that we are all bound by them together.
