answer: |-
  Your worries about compulsion and stratification are unfounded, but your plan to randomize expert witnesses directly undermines your claim that the body will make better decisions.

  **1. Critical Tension: Randomized Evidence vs. Epistemic Quality**
  This is the only contradiction that threatens the project's viability. You argue the assembly's value is producing superior decisions on complex issues, yet you propose randomizing the very information source required to reach them.
  *   **What gives:** You must abandon the lottery for expert witnesses.
  *   **Cost:** You lose a layer of procedural purity regarding who controls information, admitting that some curatorial judgment is necessary to ensure balance and credibility.

  **2. Moderate Tension: Procedural Justification vs. Epistemic Payoff**
  You claim the core case is about equality rather than outcomes, but you also sell the body on its ability to outperform elected officials. If the procedural justification is primary, poor outcomes shouldn't matter; if outcomes matter, you cannot prioritize procedural purity over competence.
  *   **What gives:** You need to clarify that the epistemic benefit is a powerful secondary benefit, not the core legitimacy claim.
  *   **Cost:** You weaken the pitch to pragmatists who only care about results, forcing you to defend the model even if it produces controversial or unpopular recommendations.

  **3. Negligible Tension: Compulsion vs. Anti-Domination**
  Your intuition here is reversed. Making service voluntary allows wealth and leisure to dominate participation, which violates the equality principle. Compulsion equalizes the burden and ensures the lottery is meaningful rather than self-selecting.
  *   **What gives:** Nothing.
  *   **Cost:** None; this alignment strengthens your design.

  **4. Negligible Tension: Stratification vs. Independent Judgment**
  Engineering the room to mirror the city does not bind members to their neighbors' views; it ensures diverse starting points so that independent deliberation actually challenges assumptions rather than reinforcing an echo chamber.
  *   **What gives:** Nothing.
  *   **Cost:** None; descriptive representation facilitates, rather than hinders, the trustee model of deliberation.

  **Single Revision for Maximum Consistency**
  Drop the requirement to select expert witnesses by lot. Instead, mandate a balanced panel selected for credibility and diverse viewpoints by a neutral third party. This preserves the epistemic claim without significantly damaging the procedural legitimacy, since the *deliberators* remain randomly selected citizens.
