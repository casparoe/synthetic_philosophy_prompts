answer: |-
  **Exam Question**

  **Question 1:** Galen Strawson's Basic Argument contends that true moral responsibility is impossible because it requires an agent to be *causa sui* (cause of themselves). A contemporary interlocutor proposes the 'Transparent Delegation Clause' (TDC), arguing that an agent can voluntarily transfer all moral accountability for an action to a future temporal stage of themselves, thereby breaking the regress of responsibility. 

  Write an essay that first reconstructs Strawson's Basic Argument with precision. Then, critically evaluate whether the Transparent Delegation Clause successfully escapes Strawson's objection. Does shifting the locus of accountability to a future self solve the problem of *causa sui*, or does the regress re-emerge? 

  ***

  **Model Answer**

  Galen Strawson's Basic Argument aims to demonstrate that ultimate moral responsibility is logically impossible for human agents. The argument rests on a specific condition for responsibility: to be truly responsible for an action, one must be responsible for the mental nature that produced that action. If I act from greed, I am only responsible if I am responsible for being a greedy person. If my greed was caused by genetics or upbringing alone, I am not ultimately responsible. Therefore, responsibility for an action entails responsibility for one's character.

  This requirement generates an infinite regress. To be responsible for my current character, I must have chosen to acquire it. However, any choice I make is dictated by my prior character and reasons. To choose to change my character, I must already possess a specific nature that dictates that choice. Consequently, I must be responsible for that prior nature. This leads to a chain: to be responsible for nature N1, I must be responsible for nature N0, which requires responsibility for nature N-1, and so on. This regress only stops if the agent is *causa sui*—the ultimate cause of their own existence and nature. Strawson argues this is logically impossible. Nothing can be the cause of itself, as it would have to exist prior to itself to enact that causation. Since humans cannot be *causa sui*, ultimate moral responsibility is impossible.

  The Transparent Delegation Clause (TDC) attempts to bypass this regress by shifting accountability temporally. The proponent argues that if a current self voluntarily delegates accountability to a future self, the future self becomes the primary bearer of blame. Because the future self is the one acting and accepting the blame, the loop is broken; the future self is the cause of the action and the bearer of responsibility, removing the burden from the origin point.

  However, the TDC fails to escape Strawson's argument because it misunderstands the metaphysical requirement of *causa sui*. Strawson's regress is not about *where* responsibility is located in time, but about the *origin* of the nature that accepts responsibility. For the delegation to be valid, the current self must be responsible for the act of delegating. If they are not responsible for their nature (which dictated the delegation), the transfer is metaphysically void. 

  More critically, the future self faces the exact same regress. For the future self to be truly responsible for accepting the delegated blame, they must be responsible for the nature that accepts it. Why did the future self agree to the clause? Was it because of their character? If so, are they responsible for that character? If the future self is not *causa sui*, they cannot anchor the responsibility any better than the past self. The TDC merely moves the buck; it does not find a stopping point. It assumes that temporal distance grants metaphysical independence, but the future self is still a product of prior causes (including the past self's delegation). Unless the future self is *causa sui*, the regress applies to them equally. Therefore, the TDC does not solve the impossibility of ultimate responsibility; it merely obscures the regress by adding a temporal layer to a logical problem.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. The Principle of Responsibility for Mental Nature (4 Marks)**
  *   **Must Hit:** Student must state that Strawson requires an agent to be responsible for the way they are (their character/nature) to be responsible for their actions.
  *   **Common Error:** Students confuse this with general determinism rather than the specific condition of responsibility for one's own constitution.

  **2. The Structure of the Infinite Regress (4 Marks)**
  *   **Must Hit:** Student must explain that choosing one's nature requires a prior nature to make the choice, necessitating an infinite chain of prior selves/natures.
  *   **Common Error:** Students claim the regress stops at "birth" or "genetics" rather than explaining the logical requirement for prior choice.

  **3. The Impossibility of *Causa Sui* (4 Marks)**
  *   **Must Hit:** Student must identify that stopping the regress requires self-creation (*causa sui*), which Strawson argues is logically impossible (existing prior to oneself).
  *   **Common Error:** Students argue *causa sui* is physically impossible but miss the logical contradiction emphasized by Strawson.

  **4. Accurate Reconstruction of the TDC (4 Marks)**
  *   **Must Hit:** Student must charitably explain that TDC attempts to solve the problem by shifting the locus of accountability to a future temporal stage via voluntary transfer.
  *   **Common Error:** Students dismiss TDC immediately as "silly" without explaining how it purportedly breaks the loop before critiquing it.

  **5. Application of Regress to the Future Self (4 Marks)**
  *   **Must Hit:** Student must argue that the future self is subject to the same regress (not *causa sui*) and thus cannot anchor the responsibility any more than the past self.
  *   **Common Error:** Students assume time passing grants the future self new metaphysical status or freedom from prior causes.
