answer: |-
  You are confusing the ledger with the life. The fact that Marta and Sam share a flat and a support worker does not merge their persons into a single unit of moral account, and certainly does not validate welfare as the metric. When the worker washes Marta, Marta gains the freedom to be clean and to appear in public without shame; when that same hour gives Sam respite, Sam gains the freedom to rest or to work without burnout. These are distinct expansions of their respective capability sets, even if the input resource is indivisible. Your accounting headache is administrative, not philosophical. And do not tell me welfare solves this because each can report their experience; Marta may report she is "fine" unwashed because she has adapted her expectations to deprivation, while Sam might report high stress simply because he is anxious by temperament. We are not in the business of measuring psychological states; we are measuring the real opportunity to be and do. If the hour expands what Marta can actually do, it counts for her capability, regardless of whether she reports a "lift" or whether Sam's clock shows a split second.

  On Jonah and Priya, you are mistaking a snapshot for a film. Robustness is not a rival currency; it is the temporal depth of the capability set itself. A freedom that vanishes the moment the support worker calls in sick is not a substantive freedom, it is a contingent privilege. Your ranking procedure must therefore evaluate capability sets over a time horizon and across probable states of the world, not just at the peak of support. We rank Jonah's set lower than Priya's not because his functioning is lower, but because the *intersection* of his capability set across scenarios—with support and without—is drastically smaller. We discount the functionings that rely on fragile conversion factors. If you allocate based on peak potential without weighting for the stability of the conversion factors, you are allocating based on illusion. Priya's lower baseline is actually a higher *secure* freedom because it persists under perturbation. Do not invent a new currency of robustness; simply stop measuring freedom as if it exists in a vacuum sealed against reality.
