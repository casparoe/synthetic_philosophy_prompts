answer: |-
  Here is a teaching plan structured for an ML engineering mindset. It treats the paradox as a logic bug in our intuition about confirmation rather than a metaphysical mystery.

  ### 1. Dependency Order: Nicod vs. Symmetry
  **Verdict:** **Nicod's Criterion first.**

  *   **Why:** Nicod's Criterion is the "confirmation function." It defines the rule: *Observing an instance (A, B) confirms the rule (All A are B).* You must establish this as the "unit test" for confirmation before you introduce the "refactoring" (the Symmetry/Equivalence Condition).
  *   **The Flow:**
      1.  **Define the Hypothesis:** $H$: "All Ravens are Black."
      2.  **Apply Nicod:** Show that finding a Black Raven passes the unit test for $H$.
      3.  **Introduce Equivalence:** Show that $H$ is logically identical to $H'$: "All Non-Black things are Non-Ravens."
      4.  **Apply Nicod to $H'$:** Show that finding a Non-Black Non-Raven (White Shoe) passes the unit test for $H'$.
      5.  **The Crash:** Since $H$ and $H'$ are identical code, a pass on $H'$ must be a pass on $H$. Therefore, the shoe confirms the raven.
  *   **Risk:** If you lead with Symmetry, she will ask, "Why does the shoe confirm $H'$?" You need Nicod on the table to answer that.

  ### 2. Example Selection: White Shoe vs. Server Log
  **Verdict:** **Use the White Shoe for the Logic, Server Log for the Intuition.**

  *   **The Problem with the Log:** Using a "non-failing server log" to confirm "all failing servers have X" smuggles in **class imbalance** and **base rate** assumptions. She will immediately try to debug the dataset distribution (e.g., "Non-failing logs are 99% of the data, so the signal-to-noise ratio is trash"). That is a *statistical* objection, not a *logical* one. Hempel's paradox is about logical entailment, not information gain.
  *   **The Strategy:**
      1.  **Setup:** Use the **White Shoe**. It is semantically "empty." It forces her to accept the logic without checking the data distribution.
      2.  **Bridge:** Once the logical contradiction is established, *then* pivot to the Server Log analogy to explain *why* her intuition rejects it (i.e., "In ML, we weight samples. Hempel assumes uniform weight. That's where the friction is.").
  *   **Instruction:** Do not let her optimize the Server Log example during the setup phase. Keep the domain abstract to prevent her from solving the wrong problem.

  ### 3. Misconception Handling (The "Park and Return" Method)
  She will raise objections that are technically correct solutions to the paradox, but raising them too early prevents her from seeing the bug. Use this order:

  **Objection 1: "This ignores Priors / Bayes."**
  *   **Her Argument:** "A shoe confirms the raven hypothesis, but the likelihood ratio is negligible because P(Raven) is tiny."
  *   **Your Move:** **Park it.** Acknowledge this is the *Bayesian Resolution* (Good/I.J. Good).
  *   **Script:** "You're right, that's how we fix it in practice. But Hempel's point is about the *definition* of confirmation, not the *degree*. If we accept Bayes now, we skip the logic bug. Let's agree the logic holds, then we'll debug the probability later."

  **Objection 2: "It's Linguistic Ambiguity."**
  *   **Her Argument:** "'Raven' is a natural kind (a real class), 'Non-Black' is just a negation. They aren't computationally equivalent."
  *   **Your Move:** **Reject it (for now).** This is the "Natural Kinds" objection (Quine).
  *   **Script:** "In formal logic, there are no natural kinds, only truth values. If the truth tables match, the statements are equivalent. If we allow 'natural kinds' here, we're changing the language rules, not solving the paradox."

  **Objection 3: "Scientific Context Saves It."**
  *   **Her Argument:** "No scientist would ever test a raven hypothesis by looking at shoes. It's methodologically invalid."
  *   **Your Move:** **Concede.** This is the "Methodological" resolution.
  *   **Script:** "Agreed. But the paradox asks: Does the evidence *logically support* the hypothesis, not is it *efficient* to collect it. You're arguing about sample efficiency; Hempel is arguing about entailment."

  ### 4. Assessment: The Structural Check
  Do not ask her to recite the paradox. Test if she can apply the logical structure to a new domain without the emotional baggage of "ravens."

  **The Test:**
  Present this pair:
  1.  **Rule A:** "All prime numbers greater than 2 are odd."
  2.  **Rule B:** "All even numbers are not prime numbers greater than 2."

  **Ask:** "If I show you the number **4** (which is Even and Not-Prime>2), have I logically provided evidence for Rule A?"
  *   **Pass:** She hesitates, recognizes the logical equivalence, and admits "Yes, technically, even if it's useless."
  *   **Fail:** She says "No, 4 has nothing to do with primes > 2" (rejecting equivalence) or "Yes, and it's strong evidence" (missing the intuition gap).

  ### 5. Explicit Exclusions (Scope Boundaries)
  To keep this session under 45 minutes and prevent scope creep, explicitly state you are **not** covering:

  1.  **Carnap's Logical Probability:** Do not drift into degrees of confirmation or inductive logic systems. That turns this into a math lecture.
  2.  **Goodman's "Grue" Problem:** Do not introduce projectibility or time-dependent predicates. That is a different paradox about *which* generalizations are valid, not about *instance confirmation*.
  3.  **Falsificationism:** Do not let the conversation drift into Popper. This is about confirmation, not falsification.

  ### 6. Session Opener (Setting the Frame)
  Start by validating her worldview to lower defenses:
  *"Philosophy often feels like bad code review because it critiques the architecture without proposing a patch. Today isn't about philosophy; it's about a type-safety error in how we define 'evidence.' We're going to find a case where the compiler (logic) says 'Valid' but the runtime (intuition) throws an exception."*

  *(Note: I noticed the typo "dependancy" in your prompt, but I've ignored it here to keep the plan clean.)*
