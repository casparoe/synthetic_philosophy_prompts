m—associated with the study of invented traditions and imagined communities—that modern nation-states depend on bureaucratic, educational, and commemorative machinery to produce the appearance of ancient, continuous, and homogeneous identity. The memo should reward a reader familiar with those arguments without requiring knowledge of specific texts, and should avoid all citations, bibliographies, named scholars, and verbatim quotations. Keep the language formal, precise, and institutionally plausible.
