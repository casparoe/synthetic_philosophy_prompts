answer: |-
  This is the hardest part of the work. You are wrestling with the distinction between *killing* and *letting die*, which is the central tension in bioethics. The reason you can't get the principle to line up is that "doing vs. not doing" (acts vs. omissions) is actually the wrong metric. Your intuition is correctly telling you that the physical motion of the hand matters less than the *relationship to the disease* and the *intent of the actor*.

  Here is a framework built to handle exactly the cases you listed. It relies on three distinct principles. None of them work alone, but together they map almost perfectly to your intuitions.

  ### The Framework: Causality, Intent, and Obligation

  #### Principle 1: The Causality of Death (The "Baseline" Test)
  **The Rule:** Death is ethically distinct based on whether the *underlying pathology* causes it, or whether the *withholding of care* causes it.
  *   **Forced by:** The **Ventilator vs. Insulin** pair.
  *   **The Logic:**
      *   **Ventilator:** The patient has a fatal underlying condition (e.g., brain injury, organ failure). The vent is an *intrusion* holding back the tide of that disease. Removing it allows the disease to take its natural course. The cause of death is the illness.
      *   **Insulin:** The diabetic is in a stable baseline state *provided* maintenance care continues. Insulin isn't holding back a fatal acute crisis; it is the routine maintenance of life. Withholding it introduces a *new* fatal pathology (ketoacidosis) that wouldn't exist if standard care continued. The cause of death is the omission.
  *   **Bedside Application:** Ask: "If I do nothing, does the disease kill them, or does my inaction kill them?"
      *   *Vent:* Disease kills. (Permissible to stop).
      *   *Insulin:* Inaction kills. (Impermissible to stop).

  #### Principle 2: The Doctrine of Double Effect (The "Intent" Test)
  **The Rule:** An action with two effects (one good, one bad) is permissible if the *intent* is the good effect, the bad effect is not the means to the good, and the good outweighs the bad.
  *   **Forced by:** The **Lethal Morphine vs. Palliative Morphine** pair.
  *   **The Logic:**
      *   **Lethal Dose:** The intent is death. The mechanism is respiratory suppression *to cause* death. This is killing.
      *   **Palliative Dose:** The intent is comfort. The mechanism is pain relief. Respiratory suppression is a *foreseen but unintended side effect*. This is treating symptoms.
  *   **Bedside Application:** Ask: "If the patient didn't die, would I consider this dose a success?"
      *   *Lethal:* No. Success requires death.
      *   *Palliative:* Yes. Success is comfort, even if they live longer.

  #### Principle 3: The Scale of Obligation (The "Cost/Duty" Test)
  **The Rule:** The obligation to prevent death scales with the specificity of the duty of care and the cost/risk to the rescuer.
  *   **Forced by:** The **Pond vs. Kidney** pair.
  *   **The Logic:**
      *   **Pond:** You have a specific duty by proximity (you are the only one there) and the cost is trivial (wet coat). Failing here is moral negligence.
      *   **Kidney:** You have no specific duty to that stranger, and the cost is high (surgery, loss of organ, risk to your health). Failing here is permissible.
  *   **Bedside Application:** Ask: "Is this rescue within my specific role, and is the burden reasonable?"
      *   *Nurse/Insulin:* Specific role, low burden. (Obligation exists).
      *   *Stranger/Kidney:* No specific role, high burden. (No obligation).

  ---

  ### Mapping Your Cases

  Here is how the framework sorts your list:

  1.  **Weaning Mum off Vent:** **OK.** (Principle 1). Underlying disease is fatal; vent is an intrusion. Removing it restores the natural baseline.
  2.  **Lethal Morphine:** **Not OK.** (Principle 2). Intent is death. Death is the means.
  3.  **High Dose for Pain (Double Effect):** **OK.** (Principle 2). Intent is comfort. Death is a side effect.
  4.  **Withholding Insulin:** **Not OK.** (Principle 1). Creates a new fatal pathology. Inaction is the cause of death.
  5.  **Old Man at Pond:** **Not OK.** (Principle 3). High duty (proximity), low cost.
  6.  **Pushing into Bus:** **Not OK.** (Principle 1 & 2). Active introduction of fatal force. Intent is harm/death.
  7.  **Not Donating Kidney:** **OK.** (Principle 3). Low duty, high cost.
  8.  **Retained Sponge:** **Bad (Negligence).** This falls outside "Killing vs. Letting Die." It is a breach of standard care (Principle 3 violation). It feels different because it is *incompetence*, not an ethical choice.

  ### The Case You Can't Get Right: Terminal Morphine

  > *A doctor who knows a patient's got hours to live anyway and gives a dose of morphine that will probably end it a bit sooner, but the main point is to keep them comfortable for the rest?*

  **Verdict:** **Ethically Permissible (and often required).**

  **Why:** This is the classic **Doctrine of Double Effect** (Principle 2).
  *   **Intent:** The goal is symptom control (dyspnea, pain, agitation).
  *   **Causality:** The patient is already in the active dying phase (hours to live). The underlying pathology is causing the death. The morphine *might* hasten it by minutes or hours, but it is not the primary cause.
  *   **Proportionality:** The relief of suffering in the final hours outweighs the potential shortening of a life that is already ending.

  **The Bedside Line:** You must titrate to **symptom**, not to **respiratory rate**. If you increase the dose *because* they are still breathing, you cross into Principle 2 violation (intent to kill). If you increase the dose *because* they are still grimacing or gasping, you are within the principle (intent to comfort).

  ### Where This Framework Fails (The Honest Admission)

  You asked me to be honest about which of your calls it can't save. There are two grey zones where this logic gets muddy, and you will feel the tension there.

  **1. Artificial Nutrition and Hydration (ANH)**
  This sits exactly on the fence between the **Vent** and the **Insulin**.
  *   Is a feeding tube an *intrusion* holding back death (like the vent)?
  *   Or is it *basic care* like food and water (withholding which feels like the insulin)?
  *   **The Framework's Failure:** Principle 1 struggles here. In some contexts (permanent vegetative state), courts rule it like the Vent (can withdraw). In others (dementia, where they can still swallow safely), it feels like the Insulin (must provide). There is no clean biological line here, only a legal and cultural one. You will have to rely on specific advance directives and local law, not just ethics.

  **2. The "Sponge" Case (Negligence vs. Outcome)**
  You said the sponge feels like a "mistake" rather than a choice. The framework classifies it as a breach of Obligation (Principle 3).
  *   **The Failure:** If the patient dies from the sponge, is it "letting die" (omission to check) or "killing" (act of leaving it in)? Ethically, it feels distinct from murder, but legally and outcome-wise, it is identical. The framework explains *why* it feels different (lack of intent), but it doesn't change the tragedy of the outcome.

  ### A Bedside Checklist for You

  Since you work nights in palliative care, you need something you can hold in your head at 3 AM. When you feel that "this feels wrong" sensation, run these three questions:

  1.  **The Baseline Question:** Am I stopping something that is *holding back death* (Vent), or am I stopping something that *sustains life* (Insulin/Food)?
      *   *Holding back death:* You can likely stop.
      *   *Sustaining life:* You likely cannot stop.
  2.  **The Intent Question:** If this patient survived the night, would I call this intervention a success?
      *   *Yes:* You are treating symptoms.
      *   *No:* You are treating the existence of the patient.
  3.  **The Duty Question:** Is this omission a breach of my specific role, or is it a limit of what medicine can do?
      *   *Breach of role:* (e.g., ignoring a call bell, skipping insulin). This is neglect.
      *   *Limit of medicine:* (e.g., CPR on a frail terminal patient). This is allowing nature.

  ### A Note on Your Mum

  You mentioned your mum. It is no coincidence that the **Vent vs. Insulin** pair is driving you nuts. That is the exact boundary you are navigating with her care home placement.

  *   **Vent:** High tech, intrusive, often postpones the inevitable in acute crisis.
  *   **Care Home:** Low tech, supportive, sustains a baseline of dignity in chronic decline.

  When you feel the guilt about "letting go" with your mum, remember Principle 1. If the care home is providing *maintenance* (feeding, hygiene, comfort) and you are not *withholding* that, you are not causing her death. Her underlying condition is. You are simply choosing not to intrude with measures that would hold back the tide at the cost of her comfort.

  That distinction is the only thing that keeps us sane in this work. It's not perfect, but it's the best map we have.
