prompt: |-
  me and my roommate got into a huge argument last night about Scanlon's contractualism and whether it can deal with aggregation, and I need someone to tell me who was talking nonsense. He's deep into the effective altruism stuff and he lent me this popular book about it that has a couple of pages tearing into contractualism. I'm kind of inclined to defend Scanlon because the book's version sounds too clean, but I only vaguely remember the theory from one undergrad seminar and I cant tell where the book is shading things.

  The book said something roughly like this (I'm paraphrasing from memory, it went on a bit longer):

  "Scanlon's idea is that an act is wrong if it would be ruled out by any principle that some person could reasonably reject — so morality is basically a hypothetical contract, the set of rules we'd all sign up to if we didn't know who we were going to turn out to be. The important consequence is that it blocks the utilitarian habit of adding everyone's benefits together. Each person's complaint gets weighed on its own, by how bad the outcome is for that person, so no number of tiny benefits to other people can ever outweigh one serious harm. Scanlon's own example makes the point: a man is trapped in a TV transmitter room and will suffer a badly broken leg if the broadcast is interrupted, millions of people would miss a football match if it is, and contractualism says cut the broadcast anyway. But that just is the aggregation problem. Contractualism can't explain why you should save five strangers from drowning instead of one, or why you should buy a thousand malaria nets instead of funding one expensive operation for a named kid. Numbers simply don't count for it. Scanlon tries to patch this by letting numbers break ties when individual complaints are exactly equally strong, but that only kicks in in cases where you don't need it, and basically nobody working on this accepts the patch."

  So: is that fair? Could you go through it claim by claim and tell me what someone who actually likes contractualism would accept, what they'd wince at, and what's just wrong? Specifically — was I right that the "can't say why save five rather than one" bit is unfair, or does the book have a point there? I half remember there being something about numbers mattering as a tie-breaker but I don't really get how it's supposed to work or whether it's meant to do more work than the book lets on. And does the conclusion — that contractualism is refuted by the aggregation problem — actually follow from the parts of the summary that are accurate?

  Two more things, because these are the cases my roommate and I actually got stuck on and nobody's written about them as far as I know. First: take the transmitter case and spread the harm out as risk instead. Interrupting the broadcast would give each of two million viewers a one-in-two-million chance of a broken leg (so one expected broken leg either way), and nothing else changes. Does contractualism have to say the broadcast is fine now, on the grounds that each individual's complaint is tiny? It feels like something has gone wrong if converting a concentrated harm into a dispersed risk flips the answer, but I can't say what. Second: my roommate's fix was that you should add complaints up but with diminishing weight per person — roughly, a hundred mild annoyances can outweigh one broken leg but a hundred thousand can't — and he says that's still contractualist because it's still built out of individual complaints. Is that a real contractualist move or has he quietly rebuilt utilitarianism?

  Please don't give me a reading list or citations, I just want the conceptual picture and what the actual disagreements are.
