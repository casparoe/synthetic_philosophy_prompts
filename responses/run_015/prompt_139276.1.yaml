answer: |-
  You were right to be suspicious. The book's summary is a "philosophical caricature"—it simplifies Scanlon's view enough to make it an easy target for effective altruism (EA), but in doing so, it misrepresents the theory in ways that would make a contractualist wince. Your roommate is right that aggregation is the hardest problem for contractualism, but the book is wrong about how contractualists actually handle it, and your roommate's "fix" isn't contractualism at all.

  Here is the conceptual breakdown, claim by claim, followed by your specific cases.

  ### Part 1: Claim-by-Claim Breakdown

  **Claim 1: "Morality is basically a hypothetical contract... if we didn't know who we were going to turn out to be."**
  *   **Verdict:** **Wrong.**
  *   **Why:** This describes John Rawls's theory (Contractarianism), not T.M. Scanlon's (Contractualism). Rawls uses a "veil of ignorance" where you don't know your place in society. Scanlon's theory is about **justifiability to actual people**. You don't imagine you *might* be the guy with the broken leg; you acknowledge he *is* the guy with the broken leg and ask if you can justify your action *to him*.
  *   **Why it matters:** The book sets up a strawman. Scanlon's theory is harder to knock down because it deals with real, specific complaints, not hypothetical averages.

  **Claim 2: "No number of tiny benefits to other people can ever outweigh one serious harm."**
  *   **Verdict:** **Mostly Fair (for early Scanlon), but too absolute.**
  *   **Why:** This is the core "non-aggregation" constraint. Scanlon argues you can't sum up small gains to override a large loss for one person. However, saying "never" is too strong. Contractualists distinguish between *relevant* and *irrelevant* claims. If the small benefits are truly trivial (like watching a football match), they don't count. If they are matters of life and death, the calculus changes (see below).

  **Claim 3: "Contractualism can't explain why you should save five strangers from drowning instead of one."**
  *   **Verdict:** **Unfair / Outdated.**
  *   **Why:** This is the biggest distortion. Scanlon explicitly wants to save the five. In his early work, he struggled with this. In his later work, he clarified that when the harm is **identical** (death vs. death), numbers *do* count.
  *   **The Logic:** If you save the one, each of the five has a complaint: "You let me die when you could have saved me." The one survivor has no complaint. If you save the five, the one who dies has a complaint: "You let me die." The five survivors have no complaint. Since the complaint ("I died") is identical in kind, the principle that saves more people leaves fewer people with a valid complaint against you. Therefore, it is less reasonably rejectable.
  *   **Takeaway:** The book attacks a version of Scanlon that Scanlon himself moved away from.

  **Claim 4: "Scanlon tries to patch this by letting numbers break ties... basically nobody accepts the patch."**
  *   **Verdict:** **Dismissive.**
  *   **Why:** It is true that the "tie-breaker" view was criticized (because it implies numbers *only* matter if complaints are exactly equal, which is rare). But many contractualists have developed more robust defenses (like the "identical harm" argument above). It is an active, live debate in philosophy, not a settled refutation.

  ---

  ### Part 2: The "Save Five vs. One" Question

  **Were you right that this bit is unfair?**
  **Yes.** The book implies contractualism forces you to flip a coin between saving one person and saving five. No serious contractualist accepts that.

  The contractualist explanation isn't "5 > 1" because of math. It's "5 > 1" because saving the five minimizes the number of people who can stand before you and say, "You could have saved me, and you didn't."

  The book treats contractualism as if it forbids counting people *at all*. In reality, it forbids counting *benefits* to override a *burden*. When the burden is the same (death), counting people is permissible because it reduces the total number of unrejectable complaints.

  ---

  ### Part 3: Your Specific Cases

  #### Case 1: The Transmitter Case (Risk Version)
  *The Setup:* Instead of one guy getting a broken leg for sure, interrupting the broadcast gives 2 million viewers a 1-in-2-million chance of a broken leg. Expected harm is the same (one leg).

  *   **Does contractualism flip the verdict?**
      **Yes, it likely does.** And this is a genuine vulnerability.
  *   **Why?** Scanlon's theory focuses on the complaint of the **individual**.
      *   **Original Case:** The man in the room has a complaint: "I will definitely break my leg." Each viewer has a complaint: "I will miss a game." The leg complaint is stronger. You must save the leg.
      *   **Risk Case:** The man in the room (if you interrupt) has a complaint: "I will definitely break my leg." But wait, in your risk version, *no one* gets a definite leg.
      *   Let's look at it from the perspective of *imposing the risk*. If you *don't* interrupt, the man in the room is safe. The 2 million viewers face a tiny risk.
      *   Can any *single* viewer reasonably reject the principle "Allow broadcasts even if they impose a 1-in-2-million risk of a broken leg"? Probably not. That risk is too small to veto the broadcast.
      *   Can the man in the room reject it? No, because he isn't being harmed.
      *   So, contractualism says: **Run the broadcast.**
  *   **Is this a problem?**
      **Yes.** You hit on a known issue called the **Ex Ante vs. Ex Post problem**.
      *   **Ex Post (Outcome):** One leg breaks either way.
      *   **Ex Ante (Risk):** One person faces certainty vs. millions face tiny risk.
      *   Contractualism cares about whether an *individual* can reject the rule. A tiny risk is not reasonably rejectable by one person, even if the *collective* risk equals a certainty.
      *   **Your Intuition:** You feel it's wrong that spreading the harm makes it permissible. A contractualist might agree this is counterintuitive, but they would argue that morality is about what we owe to *each specific person*, not about managing statistical totals. To a contractualist, imposing a tiny risk on a million people is not the same moral injury as crushing one person's leg, because no *single* person among the million is crushed.

  #### Case 2: Your Roommate's Fix (Diminishing Weight Aggregation)
  *The Setup:* Add up complaints, but with diminishing weight (100 annoyances > 1 leg, but 100,000 annoyances < 1 leg). Roommate says this is still contractualist.

  *   **Is this a real contractualist move?**
      **No.** Your roommate has quietly rebuilt **Prioritarianism** (or weighted Utilitarianism).
  *   **Why isn't it Contractualism?**
      *   **The Core Rule:** Contractualism says an act is wrong if *one* person has a sufficiently strong reason to reject it. It is a **veto** system based on individual strength.
      *   **The Roommate's Rule:** Your roommate is saying the act is wrong if the *total sum* of weighted complaints crosses a threshold.
      *   **The Difference:** In contractualism, if one person has a "broken leg" complaint, they can veto a million "missed football games," regardless of the sum. In your roommate's system, if you have enough "missed football games," they eventually outweigh the leg (even if it takes a lot).
      *   **Why it matters:** Your roommate is aggregating. Scanlon's whole point is that aggregation disrespects the "separateness of persons." By summing the complaints (even with diminishing returns), your roommate is treating the group as a container of value rather than a collection of individuals with veto power.
  *   **Verdict:** Your roommate is proposing a more sophisticated form of utilitarianism, not a defense of contractualism. They are trying to solve the aggregation problem by keeping the math but changing the variables. A contractualist would say, "You're still adding people up. You're supposed to be looking at the one person with the worst complaint."

  ### Summary: Who was talking nonsense?

  **The Book:**
  The book was talking nonsense on the "Veil of Ignorance" point (wrong theory) and the "Can't save five over one" point (outdated/strawman). It was fair on the "Aggregation is hard" point, but wrong to imply contractualism has no answer.

  **You:**
  You were right to defend Scanlon against the "five vs. one" objection. Contractualism *can* handle that case by focusing on identical harms. However, your intuition on the **Risk Case** was spot-on: that is a genuine weak spot for contractualism where it gives a verdict that feels cold (dispersed risk is okay, concentrated harm is not).

  **Your Roommate:**
  Your roommate is right that aggregation is necessary to match common sense in some cases, but wrong that their "diminishing weight" solution is contractualist. It's a different theory entirely. They are essentially arguing for Utilitarianism with a concave utility function, which is a standard EA position, but they shouldn't label it as a fix for Scanlon.

  **The Bottom Line:**
  Contractualism isn't refuted by aggregation, but it is constrained by it. It forces you to prioritize the worst-off individual over the greater good *unless* the harms are identical. The book ignored the "identical harm" exception to make EA look better. You were right to call bullshit on that.
