      *(Refining the Arc)*:
      1. Introduction: The Normative Problem (Ought implies Can).
      2. Concept: Indirect Voluntarism (Clifford's ground).
      3. Application: Shipowner analyzed through Indirect Control.
      4. Pivot: Where Indirect Control fails (Genuine Option).
      5. James: Direct/Passional Control in gaps.
      6. Scenario: Apply both to "The Accused Friend."

      *Wait, the prompt asks for a single carrying scenario to structure the comparison, preferably NOT shipowner/climber.* Okay, I will replace the Shipowner/Climber with "The Accused Friend" as the *primary* teaching tool, mentioning the originals only as historical context. This aligns better with "avoid the usual framing."

      *Let's finalize the "Concept before James":* It is **The Distinction between Doxastic States and Doxastic Actions**. Clifford norms the *action* of inquiry (leading to belief). James norms the *state* of belief (in specific cases). Before James's conditions work, students must see that belief is usually a state (involuntary) but James treats it as an action (voluntary) under specific constraints.

      *Actually, the prompt asks:* "what distinction or concept must be firmly in place before James's conditions for a genuine option can do any work."
      *Answer:* **The Default Presumption of Evidentialism.** James's conditions are *exceptions* to a rule. If students don't grasp that James accepts Clifford's rule as the default, the "Genuine Option" looks like license for everything. The concept is **The Primacy of the Evidential Norm**. James only activates his will-to-believe when evidence *runs out*.

      *Re-reading prompt:* "...and how that shapes what kind of norm can govern it." This points back to Voluntarism.
      *Okay, I will synthesize:* The concept is **Doxastic Control**. Specifically, the difference between **Direct Voluntarism** (choosing a belief) and **Indirect Voluntarism** (choosing to gather evidence).
