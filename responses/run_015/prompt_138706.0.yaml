  # The Separateness of Persons: A Structural Decision Tree

  **Instructions:** Answer each question based on your immediate judgment of the case. Do not consult theory labels. Follow the path indicated by your Yes/No responses to arrive at a leaf position.

  ### The Branch Questions

  **Q1: The Young Worker**
  Is it permissible for a young person to endure significant hardship now, solely to ensure their own old age is comfortable?
  *   **No:** Go to Leaf 1.
  *   **Yes:** Go to Q2.

  **Q2: The Amnesiac**
  Is it permissible for a young person to endure significant hardship now, if, before old age, their memory and personality will be completely wiped so the "old person" feels like a total stranger to them?
  *   **No:** Go to Q3.
  *   **Yes:** Go to Q4.

  **Q3: The Stranger Within**
  If you answered **No** to Q2 (the stranger-self case), is it still permissible to force one *different* person to endure hardship to save another *different* person from death?
  *   **No:** Go to Leaf 2.
  *   **Yes:** Go to Leaf 3.

  **Q4: The Kidney**
  Is it permissible to force a healthy person to give up a kidney against their will to save one dying stranger?
  *   **Yes:** Go to Q5.
  *   **No:** Go to Q6.

  **Q5: The Burn**
  If you answered **Yes** to Q4 (permissible to sacrifice), suppose we have a choice: leave some people rich and some poor, or destroy the wealth of the rich so everyone is equally poor (with no one gaining). Is the equal outcome *better*?
  *   **Yes:** Go to Leaf 4.
  *   **No:** Go to Leaf 5.

  **Q6: The Five Fingers**
  If you answered **No** to Q4 (forbidden to sacrifice for one), is it permissible to force a healthy person to give up a kidney if it saves **five** strangers from each losing a finger?
  *   **Yes:** Go to Leaf 6.
  *   **No:** Go to Q7.

  **Q7: The Twin Copy**
  A person is scanned and copied into two identical bodies (B and C). Is it permissible to harm B to save C?
  *   **Yes:** Go to Leaf 7.
  *   **No:** Go to Q8.

  **Q8: The Difference**
  Is it permissible for some to have much more than others, provided the poorest group is better off than they would be under equality?
  *   **Yes:** Go to Leaf 8.
  *   **No:** Go to Leaf 9.

  *(Note: To reach 12 leaves, Leaf 9 is subdivided by the "Numbers Case" logic in the Leaf descriptions below, as a binary branch here would exceed 8 questions.)*

  ---

  ### The Leaves

  **Leaf 1: The Selfless Ascetic**
  *   **Status:** **Empty.**
  *   **Reason:** Incoherent agency; denies the basic prudential unity required to act over time.
  *   **Least Comfortable Commitment:** N/A.

  **Leaf 2: The Unity Objector (Parfitian Ground)**
  *   **Position:** **Reductionist Objection to Aggregation.**
  *   **Ground:** **Unity.** (Separateness tracks psychological continuity).
  *   **Least Comfortable Commitment:** Must treat the future self of a discontinuous life as morally equivalent to a stranger.

  **Leaf 3: The Selective Reductionist**
  *   **Status:** **Empty.**
  *   **Reason:** Unclaimed/Unstable; grants identity weight within a life but denies it across lives without a standpoint justification.
  *   **Least Comfortable Commitment:** N/A.

  **Leaf 4: Telic Egalitarianism**
  *   **Position:** **Telic Egalitarianism.**
  *   **Ground:** **Pattern.** (Equality is intrinsically valuable).
  *   **Least Comfortable Commitment:** Must accept that making everyone equally worse off is sometimes better than leaving some better off.

  **Leaf 5: The Aggregative Consequentialist**
  *   **Position:** **Total Utilitarianism (Harsanyi) / Prioritarianism.**
  *   **Ground:** **Compatible with Either.** (Aggregation overrides both unity and standpoint).
  *   **Least Comfortable Commitment:** Must sacrifice an innocent individual whenever the sum of benefits to others is sufficiently large.
  *   **Note:** **Collision.** This tree cannot structurally distinguish Utilitarianism from Prioritarianism without introducing risk-weighting cases; both occupy this address.

  **Leaf 6: The Threshold Deontologist**
  *   **Status:** **Empty.**
  *   **Reason:** Incoherent threshold; forbids sacrifice for a life but permits it for minor gains to many.
  *   **Least Comfortable Commitment:** N/A.

  **Leaf 7: The Fission Exceptionalist**
  *   **Status:** **Empty.**
  *   **Reason:** Unattractive; grants rights to original persons but denies them to exact psychological successors.
  *   **Least Comfortable Commitment:** N/A.

  **Leaf 8: The Contractarian Distributivist**
  *   **Position:** **Rawlsian Contractarianism.**
  *   **Ground:** **Standpoint.** (Terms must be justifiable to each distinct claimant).
  *   **Least Comfortable Commitment:** Must permit vast inequalities if they technically raise the floor for the worst-off even slightly.

  **Leaf 9A: The Rights Absolutist**
  *   **Position:** **Nozickian Libertarianism.**
  *   **Ground:** **Standpoint.** (Each person is a sovereign end).
  *   **Least Comfortable Commitment:** Must forbid violating one person's rights even to prevent multiple catastrophic violations of others' rights.

  **Leaf 9B: The Justificationist**
  *   **Position:** **Scanlonian Contractualism.**
  *   **Ground:** **Standpoint.** (Morality is about reasonable rejectability).
  *   **Least Comfortable Commitment:** Must allow personal ties to override impartial saving in some rescue cases, prioritizing justification to the agent.

  **Leaf 9C: The Numbers Skeptic**
  *   **Position:** **Taurekian Anti-Aggregation.**
  *   **Ground:** **Standpoint.** (Each person has a claim that cannot be summed).
  *   **Least Comfortable Commitment:** Must flip a coin rather than save a greater number of lives when forced to choose.
  *   **Note:** **Collision.** Structurally lands with Nozick/Scanlon on Q1–Q8; distinguished only by the "Numbers Case" intuition which fails to discriminate in binary sacrifice cases.

  ---

  ### Seminar Notes on Structure and Discrimination

  **1. Separating the Grounds for the Objection**
  The tree isolates the two grounds for the separateness objection at **Q2 (The Amnesiac)**.
  *   **The Unity Ground (Leaf 2):** Holds that compensation is permitted within a life *only because* psychological unity binds the stages. If you break the unity (Amnesia), the permission vanishes. This view treats the "Separateness of Persons" as a derivative of the "Separateness of Stages."
  *   **The Standpoint Ground (Leaves 8, 9A, 9B, 9C):** Holds that compensation is permitted within a life because there is only one *claimant* to complain. Even if psychological unity is broken (Q2=Yes), the single body/legal person remains the sole locus of complaint. Thus, they permit intra-personal sacrifice but forbid inter-personal sacrifice (Q4=No). **Q5 (The Twin Copy)** further tests this: if identity splits but standpoints multiply, the Standpoint Ground forbids harming one copy for the other (Leaf 9), whereas the Unity Ground might permit it if identity is what matters.

  **2. Collisions and Unplaceable Positions**
  *   **Utilitarianism and Prioritarianism (Leaf 5):** These positions cannot be separated by binary sacrifice cases alone. Both accept aggregation and reject levelling down. Distinguishing them requires a "Risk" node (e.g., "Is it okay to impose a 1% risk of death on one to save many from certain death?"), which was omitted to preserve the concrete nature of the tree.
  *   **Nozick, Scanlon, and Taurek (Leaf 9):** All three reject aggregation in the "Kidney" and "Fingers" cases. They are distinguished not by the *decision* in these binary cases, but by the *reason* (Rights vs. Justification vs. Numbers). The tree forces them to the same address because their structural output on these specific cases is identical.

  **3. Limitations of Standard Cases**
  *   **The Levelling Down Case (Q5):** This successfully separates Telic Egalitarians from others. However, it fails to distinguish Prioritarians from Utilitarians, as both reject levelling down.
  *   **The Numbers Case (Leaf 9C):** Taurek's view is notoriously difficult to isolate in a decision tree because it often yields the same "No" as Rights-based views (Nozick) on forced sacrifice. The distinction only becomes sharp in "Save 1 vs. Save 100" cases where no rights are violated, only outcomes differ. This tree flags Taurek at Leaf 9C, but notes that the structural path is shared with Rights-based deontology.
