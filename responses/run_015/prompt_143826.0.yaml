answer: |-
  Your intuitions are remarkably consistent with a specific and robust school of thought in aesthetics known as **Moderate Moralism** (or **Ethicism**), most notably associated with philosophers like Berys Gaut and Noel Carroll. Your tripartite distinction (External, Internal, Constitutive) is an excellent heuristic, but the unifying principle you are looking for lies in the relationship between the work and the **audience's engagement.**

  The principle that captures your verdicts is this:

  ### **The Principle of Prescribed Engagement**
  > *The aesthetic value of a work is diminished when the work prescribes, requires, or rewards a moral response that is unmerited or defective.*

  This principle distinguishes between what a work *depicts* and what it *asks you to do* with your mind and emotions. It resolves your uncertainty about the poem and the hypothetical masterpiece by shifting the focus from the **content** (what is shown) to the **stance** (how we are asked to view it).

  Here is how this principle weights your five cases and resolves the specific tension regarding the poem.

  ---

  ### 1. Applying the Principle to Your Cases

  **Case 1: The Murderer's Landscape (External/Biographical)**
  *   **Verdict:** Good Art.
  *   **Analysis:** The immorality is entirely external to the work's prescription. The landscape does not ask you to admire the murderer, nor does it require knowledge of the crime to be understood. The engagement is purely visual and emotional regarding nature.
  *   **Principle Check:** The work prescribes a serene response. The artist's biography does not corrupt that prescription.

  **Case 2: The Domination Novel (Internal/Thematic)**
  *   **Verdict:** Aesthetically Compromised.
  *   **Analysis:** You noted the reader must "adopt the author's vicious worldview to grasp its intended emotional arc." This is the crux. If the narrative structure forces you to sympathize with the abuser to feel the intended catharsis, the work is prescribing a morally defective response.
  *   **Principle Check:** The aesthetic success (emotional arc) is yoked to a moral failure (sympathy for abuse). Therefore, the aesthetic value is compromised.

  **Case 3: The Stolen Footage (Constitutive/Origin)**
  *   **Verdict:** Ethically Stained, Aesthetically Ambiguous.
  *   **Analysis:** This is the hardest case. The theft is in the *provenance*, not necessarily the *viewing*. However, if the documentary's power relies on the intimacy of the stolen footage, your viewing is tacitly complicit in the violation of privacy.
  *   **Principle Check:** If the work asks you to value the footage *without* reckoning with the theft, it prescribes a kind of moral blindness. If it acknowledges the theft, it may mitigate the flaw. Your uncertainty is warranted here; the flaw is often institutional rather than strictly aesthetic, unless the theft is hidden to manipulate the viewer.

  **Case 4: The Bone Sculpture (Constitutive/Medium)**
  *   **Verdict:** Not Good Art (or Art that cannot be viewed).
  *   **Analysis:** Here, the medium *is* the harm. To view the sculpture is to view the desecrated remains. You cannot separate the form from the material. The engagement required is one of witnessing a crime.
  *   **Principle Check:** The work prescribes an engagement that is ontologically bound to a moral wrong. You cannot appreciate the form without participating in the desecration. The "Prescribed Engagement" is morally impossible to fulfill without corruption.

  **Case 5: The Genocide Poem (Internal/Formal)**
  *   **Verdict:** Not Good Art.
  *   **Analysis:** This addresses your specific worry. You ask: *Is the rejection driven by content or by the moral complicity required to appreciate formal excellence?*
  *   **Resolution:** It is the latter. A poem can depict genocide (content) without being bad art (e.g., Celan's *Death Fugue*). But if the poem *advocates* genocide and uses rhythm and imagery to make that advocacy seductive (form), then the **form is weaponized.**
  *   **Principle Check:** To appreciate the rhythm, you must let it carry you toward a genocidal conclusion. The form is not neutral; it is the delivery system for the immorality. Therefore, the aesthetic excellence *is* the moral failure.

  ---

  ### 2. Solving the Poem and the Hypothetical

  Your central anxiety is: *"I worry that my judgment confuses immoral content with the moral complicity required to appreciate formal excellence."*

  The Principle of Prescribed Engagement clarifies this: **Appreciation is not passive.** To appreciate a work is to cooperate with it.

  *   **Recognition vs. Adoption:** We can *recognize* a cruel perspective in art without *adopting* it. (e.g., We understand Iago's villainy without sharing it).
  *   **The Flaw:** In your Case 5 (and your hypothetical), the work does not allow for critical distance. It demands **adoption**.

  **The Hypothetical Masterpiece:**
  > *A masterpiece of pure formal beauty that can only be fully experienced by adopting a cruel perspective.*

  Under the Principle of Prescribed Engagement, **this object cannot be a "masterpiece."**

  Why? Because aesthetic experience is a human experience. It is not merely retinal or auditory; it is cognitive and emotional. If the cognitive pathway to the "beauty" requires the suppression of empathy or the endorsement of cruelty, the experience is fundamentally fragmented. You are being asked to fracture your own moral agency to access the aesthetic pleasure.

  If the "beauty" relies on the viewer becoming, momentarily, a worse person, then the beauty is parasitic. It is not a self-contained aesthetic good; it is a moral cost disguised as aesthetic gain. Therefore, the work fails *as art*, because art presupposes a communicative community of moral agents. If the communication requires breaking that community, the art fails.

  ### 3. Summary of the Weighting

  To systematize your intuitions, you can weight the dimensions of immorality by their **proximity to the viewer's mind:**

  1.  **Biographical (External):** *Lowest Weight.* The artist's sin is not the work's sin. (Case 1)
  2.  **Provenance (Contextual):** *Medium Weight.* The history of the object matters, but can sometimes be bracketed. (Case 3)
  3.  **Materiality (Constitutive):** *High Weight.* If the object is the harm, it blocks aesthetic contemplation. (Case 4)
  4.  **Prescription (Internal/Phenomenological):** *Highest Weight.* If the work demands the viewer's moral complicity to function, it is an aesthetic flaw. (Case 2 & 5)

  ### Conclusion

  Your intuition is correct: the problem with the poem is not that it contains evil, but that it **seduces.**

  The principle you are looking for is that **aesthetic value is not morally neutral.** When a work's formal success depends on the audience's moral failure, the work is aesthetically defective. A "masterpiece" that requires cruelty to be understood is a contradiction in terms, because it demands the destruction of the very moral sensibility that allows us to value art in the first place.
