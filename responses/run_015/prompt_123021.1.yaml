  3.  **Deconstruct Question 2 (Rational vs. Naive):**
      *   This is a literary/character analysis question.
      *   *Rational:* If the premise of the novel allows for the possibility that her experiences *are* real (magical realism, speculative fiction) or that the medical system is oppressive, her refusal is rational resistance.
