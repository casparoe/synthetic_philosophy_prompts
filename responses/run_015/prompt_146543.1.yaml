  **Severity:** Fatal. This is the core logical contradiction. If psychological continuity is sufficient for "what matters" (1), and having two continuers is acceptable (4), then having one functional continuer via scan-and-copy must also be acceptable. By rejecting (3), you are implicitly reinstating numerical identity or substrate as what matters, which (1) explicitly denies.
