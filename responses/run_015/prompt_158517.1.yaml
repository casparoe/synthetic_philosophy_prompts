answer: |-
  You have identified a robust structural dynamic that political science and public administration recognize, though there is no single, canonical Greek-derived term (like "oligarchy" or "technocracy") that captures it exclusively. You are not conflating ideas; you are observing a specific *institutional failure mode* that arises when formal authority is decoupled from informal capacity.

  In academic literature, this phenomenon is most precisely carved out through the intersection of **Principal-Agent Theory** and **Information Asymmetry**, often discussed under the heading of **"Bureaucratic Autonomy"** or **"The Permanent Government."**

  Here is the conceptual carving you are looking for: what it is, what it is not, the specific terminology used to describe it, and the boundaries of its application.

  ### 1. The Concept: "Expertise Displacement" via Information Asymmetry
  While there is no single noun for this, the mechanism is well-defined. It is the **migration of power from the formal principal to the informal agent due to a monopoly on institutional memory.**

  *   **The Formal Principal:** The elected legislator or the sortition citizen. They have *authority* (the right to vote/decide) but are artificially constrained in *tenure*.
  *   **The Informal Agent:** The staffer, bureaucrat, or lobbyist. They have *no authority* (cannot vote) but possess *capacity* (knowledge of procedure, drafting, history, and networks).
  *   **The Mechanism:** **Information Asymmetry.** In any complex system, power accrues to those who control the "source code" of the operation. If the "leaders" are rotated faster than the time required to master the code, the "maintainers" (staff) effectively become the developers.

  In political science, this is often referred to as **"The Rise of the Permanent Government"** (a term popularized by scholar Hugh Heclo). It describes the layer of unelected officials whose tenure outlasts political cycles, granting them effective veto power or agenda-setting control. In the specific context of term limits, it is frequently called **"Staff Dominance"** or **"The Legislative Staffer State."**

  ### 2. How It Differs from Related Concepts
  You correctly noted that this is distinct from general bureaucratic power or regulatory capture. Here is the boundary work:

  *   **Vs. Bureaucracy (Weberian):** Traditional bureaucracy is the *structure* of administration. Your observation is about a *shift in the locus of control* within that structure. A healthy bureaucracy serves the master; this phenomenon describes the bureaucracy *becoming* the master because the master is transient.
  *   **Vs. Regulatory Capture:** Capture implies an *external* entity (industry, interest group) co-opting the agency. Your phenomenon is *internal*. It is not that lobbyists are bribing the staff; it is that the staff *becomes* the de facto decision-maker because the elected official lacks the bandwidth to verify the staff's work.
  *   **Vs. The "Deep State":** This is the colloquial/conspiratorial term for your observation. However, "Deep State" implies malicious intent or conspiracy. The phenomenon you describe is **structural and often benign**. It is not necessarily a cabal; it is an inevitable optimization. If the system requires X amount of knowledge to function, and you prevent Layer A from holding it, Layer B will accumulate it to prevent system collapse.

  ### 3. Term Limits vs. Sortition: Are They Parallel?
  Yes, they are structurally parallel regarding this vulnerability, though they differ in selection mechanics. Both create what we might call **"Principal Fragility."**

  *   **Term Limits:** The principal is an elected professional, but their tenure is truncated. They become "lame ducks" quickly. Their dependency on staff increases because they cannot build long-term leverage or knowledge.
  *   **Sortition:** The principal is an amateur citizen. Their dependency on staff (or facilitators) is even higher because they lack *political* experience, not just *institutional* tenure.

  In sortition literature, this is specifically discussed as the **"Agenda Control Problem."** If a random assembly does not set its own agenda (which requires expertise to do effectively), the permanent clerks or facilitators who draft the agenda effectively decide the outcomes. This is historically rooted in the power of the **Clerk of the House** in Westminster systems—the permanent officer who knows the rules better than the Speaker.

  **The Nuance:** Sortition *could* theoretically mitigate this if the support staff are also randomly selected or strictly bound by transparent algorithms (like open-source code). Term limits rarely mitigate this because the staff remains a career hierarchy. Thus, sortition faces the *same* displacement risk, but potentially with a *shallower* dependency if the process is radically simplified.

  ### 4. The Engineering Analogy: Validating Your Intuition
  Your software engineering analogy is precise.
  *   **Rotating CTO/VP (Term Limits):** Every 2 years, a new VP arrives. They want to make changes but don't know the legacy codebase.
  *   **Staff Engineers/PMs (The Permanent Substrate):** They know where the bodies are buried. They know which APIs are fragile.
  *   **The Displacement:** The VP makes the "decision" (clicks the merge button), but the Staff Engineer wrote the PR, designed the architecture, and knows that if they say "this will break production," the VP *must* listen.

  In systems architecture, this is known as **"Bus Factor" risk management.** If the "leaders" have a bus factor of 1 (they leave soon), the system inevitably routes critical knowledge through the "infrastructure" layer (the staff) to ensure stability. The reform (rotation) increases system stability (prevents dictatorship) but decreases system transparency (hides where the decisions are actually made).

  ### 5. Boundaries and Limits: When Does This Not Happen?
  This phenomenon is not a law of physics; it is a function of **complexity** and **opacity**. It has edges:

  1.  **Codification:** If the "source code" of legislation (rules, procedures, drafting standards) is fully codified and automated, the need for human intermediaries drops. (e.g., If laws were written in a strict formal language that citizens could verify, staff influence would diminish).
  2.  **Resource Parity:** If the transient officials are given resources equal to the permanent staff (e.g., every term-limited legislator gets a budget to hire their *own* permanent experts independent of the legislature), the monopoly on expertise is broken. This is why some argue for **"Personal Staff" vs. "Committee Staff."**
  3.  **Transparency of Process:** If the drafting process is public and version-controlled (like a GitHub repo), the "hidden careerist" cannot quietly insert clauses. The displacement thrives in opacity.

  ### 6. Summary of the Concept
  If you need a label to use in discussion, the most accurate academic phrasing is **"Bureaucratic Autonomy driven by Information Asymmetry."**

  However, to capture the specific *displacement* you described—the way anti-careerist reforms push careerism underground—the most evocative descriptive term is **"The Paradox of Amateurism."** This captures the irony: by forcing amateurs (or transient professionals) into power to ensure representation, you necessitate a professional shadow class to ensure functionality, thereby recreating the careerist dynamic you sought to eliminate, only without the democratic accountability.

  **The Carving:**
  *   **It is:** A structural transfer of *de facto* veto and agenda power from transient formal authorities to permanent informal agents, caused by the non-transferability of tacit institutional knowledge.
  *   **It is not:** Regulatory capture (external influence) or simple bureaucracy (administrative execution).
  *   **It applies to:** Any organization where decision-making tenure is shorter than the learning curve required to understand the consequences of those decisions.
  *   **It changes with Sortition:** Sortition increases the *dependency* (citizens know less than term-limited pols) but potentially decreases the *alignment* (staff may not share the random citizens' values as much as they share a party's values).

  You have correctly identified that **institutional memory is a form of capital.** Reforms that confiscate this capital from one class (politicians) without destroying it will see that capital reinvested in the next available vessel (staff).
