answer: |-
  Your skepticism is well-founded. The "accuracy-first" program (often called Veritism) relies heavily on the mathematical elegance of proper scoring rules to do normative heavy lifting. As you know from verification work, the Brier score is a tool, not a law of nature. When philosophers treat it as a law, they often hide substantive assumptions inside the math.

  Your worry that "accuracy gets used to prove whatever the author already believed" is the **Justification Problem**: there are infinitely many strictly proper scoring rules. Choosing the Brier score (squared error) over the Log score (information gain) or Spherical score isn't neutral; it encodes specific attitudes toward risk and extreme probabilities. If the dominance argument only works for *some* proper rules, the normativity is conditional on an arbitrary choice of metric.

  Below are the desiderata a theory of epistemic value must meet to be useful for critiquing scientific practice, organized by your concerns and the gaps I see.

  ### Desiderata for an Epistemic Value Theory

  **1. Partition Invariance (Description Independence)**
  *   **The Requirement:** The evaluation of a belief state's epistemic value should not depend on how the state space is carved up (e.g., {Rain, No Rain} vs. {0mm, 1mm, 5mm+}).
  *   **The Motivating Case:** In meteorology, a probability of precipitation (PoP) is sensitive to the threshold chosen. If a philosophical theory says you are "irrational" for having incoherent credences, but that incoherence disappears when you coarsen the partition (or appears when you refine it), the norm is unstable. For science, a model's resolution is a pragmatic choice, not a metaphysical fact. A theory that declares a model "epistemically bad" simply because it uses a finer grid than the scoring rule expects is useless.
  *   **Status:** **Non-Negotiable.** Without this, the dominance argument is coordinate-dependent.

  **2. Generalizability Constraint (Anti-Overfitting)**
  *   **The Requirement:** Epistemic value must distinguish between *fitting the current data* and *tracking the underlying data-generating process*.
  *   **The Motivating Case:** You know this best: a 10th-order polynomial fits past temperature data better than a physical model, but it has less epistemic value because it fits noise. Standard accuracy-first views define "truth" as the actual world state. If the "actual world" includes the specific noise of the dataset, the overfitted model is *more accurate*. To critique p-hacking, the theory must define accuracy as *out-of-sample predictive performance*, not *in-sample fit*.
  *   **Status:** **Non-Negotiable.** Without this, the theory endorses p-hacking as epistemically virtuous.

  **3. Error Asymmetry (Cost-Sensitivity)**
  *   **The Requirement:** The scoring rule must allow for asymmetric penalties for different types of error (Type I vs. Type II).
  *   **The Motivating Case:** The Brier score is symmetric; being 90% sure of rain when it's sunny is penalized the same as being 10% sure of rain when it's raining. In scientific practice, false positives (claiming an effect exists when it doesn't) are currently treated as more damaging than false negatives. A theory that treats all errors equally cannot explain why we prioritize controlling false discovery rates over maximizing power.
  *   **Status:** **Negotiable (but costly).** You can keep symmetry, but you lose the ability to critique risk-imbalanced practices.

  **4. Tractability (Bounded Rationality)**
  *   **The Requirement:** The theory must not require agents to be logically omniscient.
  *   **The Motivating Case:** Dominance arguments assume you can check your credences against all logical consequences. If a lab fails to notice that their new theory contradicts a background assumption they hold, accuracy-first often labels this "incoherent" and thus dominated. In practice, discovering inconsistency *is* the work of science. A theory that punishes the *state* of inconsistency rather than the *process* of resolving it treats computational limits as epistemic sins.
  *   **Status:** **Negotiable.** You can accept this as an idealization, but it limits the theory's use in critiquing real agents.

  **5. Inquisitive Value (Question Selection)**
  *   **The Requirement:** The theory must assign value to *which* propositions are believed, not just the accuracy of the belief.
  *   **The Motivating Case:** Accuracy-first is often "belief-centric." It says "be accurate about what you believe." It struggles to say "you should believe *this* rather than *that*." Being 100% accurate about the number of grains of sand on a beach is epistemically less valuable than being 80% accurate about climate sensitivity. If the theory cannot rank questions by importance, it cannot critique labs that work on trivial problems with high precision.
  *   **Status:** **Non-Negotiable.** Science is about inquiry, not just storage.

  **6. Dynamic Adequacy (Value of Information)**
  *   **The Requirement:** The theory must derive the value of updating/experimenting from the accuracy metric, not smuggle it in.
  *   **The Motivating Case:** Why run the experiment? If I am already well-calibrated, my current credences maximize expected accuracy *given my current info*. The theory must show that *seeking* new info increases expected accuracy more than staying put. Many accuracy-first accounts simply *assume* conditionalization is the rule rather than proving it maximizes accuracy under the chosen scoring rule.
  *   **Status:** **Non-Negotiable.** Static accuracy cannot critique stagnation.

  **7. Bridge to Acceptance (The Lottery Problem)**
  *   **The Requirement:** The theory must explain when a credence justifies categorical assertion ("The effect is real").
  *   **The Motivating Case:** In lab meetings, we don't say "I assign 0.95 probability to this hypothesis." We say "This works." If the theory only deals in credences, it cannot critique the practice of asserting claims. Conversely, if you believe of each ticket in a 1000-ticket lottery that it will lose (0.999 credence), logic says you believe none will win, but you also believe one *must* win. A theory that forces you to hold contradictory categorical beliefs is broken.
  *   **Status:** **Negotiable.** You can restrict the theory to credences only, but it loses contact with scientific discourse.

  **8. Communal Aggregation (Consensus Formation)**
  *   **The Requirement:** The theory must handle how individual accuracy aggregates to group reliability.
  *   **The Motivating Case:** Science is collective. A lab might have individually accurate members but a consensus mechanism (e.g., senior PI veto) that reduces group accuracy. Accuracy-first is methodologically individualistic. It lacks the tools to critique structural issues in how labs aggregate findings.
  *   **Status:** **Missing in standard accounts.** Essential for your goal.

  ---

  ### Conflict Analysis

  You suspected the **Partition Worry** and the **Dominance Argument** cannot both survive. You are correct.

  The dominance argument (that incoherent credences are always less accurate than some coherent alternative) relies on the scoring rule being strictly proper *over the specific algebra of propositions chosen*. If you change the partition (e.g., from binary Rain/No-Rain to continuous rainfall amounts), the set of coherent credences changes, and the dominance relationship can flip. A credence function that is dominated in a fine partition might be undominated in a coarse one.
  *   **The Conflict:** If you demand **Partition Invariance**, you break the **Dominance Argument**. Most strictly proper scoring rules are partition-sensitive. To save dominance, you must accept that epistemic rationality is relative to how you describe the world. To save invariance, you must abandon the claim that coherence guarantees accuracy dominance.

  **The "Killer" Requirement:**
  The single requirement that knocks out the most versions of the program as usually stated is **Generalizability (Desideratum #2)**.
  *   **Why:** Standard accuracy-first epistemology defines "truth" as the *actual world*. In a scientific context, the "actual world" of the dataset includes noise. A strictly proper scoring rule applied to the training data *rewards* overfitting. To make the theory work for science, you have to redefine "truth" as "the model that predicts *future* data best." This shifts the theory from **Veritism** (accuracy about the world) to **Instrumentalism** (accuracy about predictions). Most philosophers resist this move because it abandons the idea of "The Truth" as a static target. If you insist on Generalizability, the standard dominance arguments for probabilism often fail because the "truth" is no longer a fixed point in the state space.

  ### Summary Table

  | Desideratum | Non-Negotiable? | Conflict / Tension |
  | :--- | :--- | :--- |
  | **1. Partition Invariance** | **Yes** | Incompatible with standard Dominance Arguments. |
  | **2. Generalizability** | **Yes** | Incompatible with static "Truth = Actual World" definitions. |
  | **3. Error Asymmetry** | No (but recommended) | Incompatible with symmetric rules like Brier; requires weighted scoring. |
  | **4. Tractability** | No | Incompatible with ideal Coherence norms. |
  | **5. Inquisitive Value** | **Yes** | Incompatible with pure "belief-centric" accuracy metrics. |
  | **6. Dynamic Adequacy** | **Yes** | Incompatible with static scoring; requires expected value of info. |
  | **7. Bridge to Acceptance** | No | Incompatible with pure Credence norms (Lottery Paradox). |
  | **8. Communal Aggregation** | **Yes** (for your use) | Incompatible with methodological individualism. |

  **Final Advice for Your Group:**
  Focus your critique on **Desideratum #2 (Generalizability)**. This is where your meteorological expertise gives you the strongest lever. Philosophers often treat the Brier score as a measure of "truth-tracking." You know it is a measure of "forecast performance." In science, fitting the noise is high accuracy on the *past* but low accuracy on the *process*. If the accuracy-first program cannot distinguish between fitting the noise and tracking the signal without smuggling in non-accuracy values (like simplicity), it cannot critique p-hacking. It will simply say the p-hacker was "unlucky" that the replication failed, rather than "irrational" for overfitting.
