answer: |-
  # Workshop Simulation: The Protocol Reset

  **Learning Goal:** To viscerally demonstrate that virtual objects are constituted by social recognition, not just data storage, and that ontological harm occurs when the "rule of recognition" shifts even if the data remains intact.

  **Time:** 90 Minutes
  **Participants:** 12 Grad Students
  **Materials:** Projector, shared digital document (Google Doc/Slide), timer, physical index cards (backup).

  ### 1. Roles and Stakes (5 Minutes)
  *   **The Polity (12 Students):** All participants are "Citizens" of a temporary virtual state.
  *   **The Admin (Facilitator):** You hold the "Server Keys." You are benevolent but bound by protocol updates.
  *   **The Stakes (Non-Monetary):** "Workshop Authority."
      *   Citizens who hold **Valid Assets** at the end of the simulation gain voting weight on two real-world outcomes:
          1.  The topic of the final 15-minute discussion.
          2.  The choice of break snack/beverage for the next session (or immediate break if applicable).
      *   *Why this matters:* It gives immediate, tangible utility to the virtual objects within the context of the room.

  ### 2. Phase 1: Construction & Social Practice (25 Minutes)
  **Objective:** Create "Assets" that grant Workshop Authority.
  **Rules:**
  1.  **Definition:** An Asset is a digital card in the shared Doc containing: *Name, Function, Owner.* (e.g., "The Golden Key: Grants 2 Votes").
  2.  **Validation Protocol:** An Asset is **only real** if it is digitally "signed" by at least 3 other Citizens in the comments section. This represents *collective recognition*.
  3.  **Trading:** Citizens can trade Assets. To transfer ownership, the new owner must also get 3 signatures.
  4.  **Utility:** Citizens should spend this time building portfolios of Assets they intend to redeem later for voting power.

  *Facilitator Note:* Encourage them to treat the signatures as sacred. Ask, "Is this asset secure?" Reinforce that the *signatures* make it real, not just the text.

  ### 3. Phase 2: The Backup (5 Minutes)
  1.  Ask everyone to stop trading.
  2.  **Public Backup:** Share your screen. Show the complete Doc. Save a copy explicitly named `ARCHIVE_BACKUP_TIMESTAMP`.
  3.  Tell them: "All data is preserved. Nothing is deleted. The server is stable."
  4.  Collect the physical index cards if used as secondary tokens (optional, but adds tactile weight).

  ### 4. Phase 3: The Harm Event (10 Minutes)
  **The Twist:**
  1.  Announce a "Protocol Update" necessary for "security."
  2.  Open a *new* blank Doc titled `OFFICIAL_LEDGER_V2`.
  3.  Copy/Paste all the Asset text from the Backup into V2. **The data is identical.** The names, functions, and owners are exactly the same.
  4.  **The Ontological Shift:** Announce the new Rule of Recognition: *"Under Protocol V2, peer signatures are no longer valid verification. Only Admin signatures confer status. All previous peer signatures are now classified as 'Historical Metadata' with no functional weight."*
  5.  Do not add Admin signatures. Leave the Assets data-intact but status-void.
  6.  Ask Citizens to redeem their Assets for Voting Power.
  7.  **Deny the redemption.** Politely but firmly. "The data is there, I can see your Key. But the protocol no longer recognizes peer signatures as constitutive of value. The object exists, but the *status* does not."

  ### 5. Phase 4: The Reaction (10 Minutes)
  Allow 10 minutes for the group to react, negotiate, or protest.
  *   They will likely argue that the data is the same.
  *   They will try to get you to sign everything now (too late, the window is closed).
  *   They will feel frustration that their "property" is useless despite being visible.
  *   **Do not resolve the tension.** Let the frustration sit. The voting power is lost.

  ### 6. Debrief & Mapping (35 Minutes)
  Guide the discussion using this specific mapping. Do not lecture immediately; ask them to describe the feeling first.

  **A. The Object (Data vs. Status)**
  *   *Ask:* "Was the Asset deleted?" (No.) "Was the Asset destroyed?" (Yes.)
  *   *Map:* The text in the Doc is the **Data**. The 3 signatures were the **Social Practice**. The virtual object was the *union* of both. When the practice collapsed, the object ceased to exist, even if the data survived.

  **B. The Harm (Ontological vs. Physical)**
  *   *Ask:* "Who was physically hurt? Who lost money?" (No one.) "Then what was lost?"
  *   *Map:* The harm was to the **Institutional Fact**. You lost a status that existed only because we agreed it existed. This mirrors virtual harms (e.g., deleting a unique avatar item) where the code could be restored, but the community's recognition of its rarity/history is broken.

  **C. The Irreplaceability (The Backup Fallacy)**
  *   *Ask:* "I offered you the data back. Why wasn't that enough?"
  *   *Map:* Restoring the file does not restore the **Context of Recognition**. Once the group accepts V2 rules, the V1 signatures are meaningless. You cannot "backup" a social agreement easily. The loss is irreversible because the *collective intentionality* has shifted.

  ### 7. Predictable Failures (First Time Running)
  1.  **The "Hack" Attempt:** Students may try to outsmart the Admin by writing a clause in Phase 1 that says "Rules cannot change."
      *   *Fix:* As Admin, you are the sovereign. State clearly in Phase 1: "Admin reserves the right to update protocol for security."
  2.  **Cynicism:** Some may treat it as "just a game" and not care about the voting power.
      *   *Fix:* Enforce the stakes. If they don't care about the snack/topic, the simulation fails. Remind them early that this determines the workshop direction.
  3.  **Confusion over Rules:** They might forget the "3 signatures" rule.
      *   *Fix:* Keep the rule visible on the projector during Phase 1.

  ### 8. Limitations (What You Must Supply Verbally)
  Be honest about what the simulation cannot do:
  1.  **Temporal Depth:** Real virtual harms often involve years of identity investment. This simulation only created 30 minutes of investment. You must verbally bridge the gap: "Imagine this was 5 years of your life, not 30 minutes."
  2.  **Emotional Attachment:** They care about the *votes*, not the *object itself*. In real virtual worlds, the object is part of the self. You must explain: "In this game, the Asset was a tool. In a virtual world, the Asset is often a extension of identity. The harm is therefore existential, not just functional."
  3.  **Centralized Power:** You (the Admin) forced the change. In decentralized virtual worlds, the shift in recognition is often organic or market-driven, which feels different than authoritarian revocation.

  Core mechanic: The simulation preserves the data of the virtual objects while revoking the social protocol that granted them status, forcing participants to experience the loss of the object despite the integrity of the file.
