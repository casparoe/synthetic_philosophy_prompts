      *   Does this invalidate the rest of the argument? Yes, because the *reductio ad absurdum* relies on the impossibility of communication/experimentation.
      *   What is the cost? It requires a nuanced definition of "shapes." It means admitting that language is just one factor among many (perception, universal cognition, context). It means Whorfian effects are subtle, context-dependent, and don't create impenetrable bubbles.
      *   It saves the Weak Hypothesis but kills the Strong Hypothesis (Determinism). The study partner's argument actually successfully refutes *Strong* Whorfianism, but fails to refute *Weak* Whorfianism because it assumes Weak implies Strong.

