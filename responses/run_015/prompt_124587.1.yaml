answer: |-
  1. The principal chain runs from shareholders to executives to branch managers to tellers, all optimizing the proxy of accounts per customer rather than the true objective of sustainable profitability. Employees faced with daily quotas and termination threats utilized strategies ranging from unauthorized account opening to fabricating contact details and shuffling funds. This maps the scandal not as individual criminality but as a systemic response to a high-stakes metric imposed across a layered hierarchy.

  2. This is primarily proxy capture, because employees manipulated the recording mechanism itself to increment the account count without generating any underlying customer value or consent. Specification gaming is present in the fund shuffling, but the core failure was the ability to fabricate the metric entirely independent of the economic reality it was meant to signify. Since the measure did not drift, the agents simply decoupled the record from the reality it was supposed to track.

  3. A fraud narrative implies rogue actors subverting a sound system, whereas this lens reveals the system itself incentivized the subversion as a rational response to impossible targets. It explains why termination of low-level gamers failed to stop the behavior, as the structural pressure remained constant for whoever replaced them. The focus shifts from moral failure to the inevitable collapse of inference when a proxy becomes a survival target.

  4. The theory misses the layered principal-agent dynamics where managers acted out of fear of firing rather than direct profit-seeking, which a single-agent optimization model cannot represent. It remains silent on where specification gaming ends and criminal fraud begins, treating both as equivalent optimization pressure without legal or ethical distinction. Furthermore, standard Goodhart analysis predicts metric collapse for the principal, not necessarily the specific harm inflicted on the unmodeled customer layer.

  5. Your legibility premium should be adopted as a formal addition, explaining why broken proxies persist in hierarchies simply because they are cheap to aggregate upward. We must also revise the slogan to state that the inference from measure to target breaks, even if the measure remains technically accurate. This acknowledges that the metric measured account openings perfectly, but no longer measured customer demand.
