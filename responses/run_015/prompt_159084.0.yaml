answer: |-
  Your intuition follows a causal stability principle: trust stratified data only when the stratifying variable is a pre-treatment confounder and the strata are statistically stable, otherwise trust the aggregate or distinguish between causal efficacy and population impact.

  **The Principle**
  1.  **Causal Structure:** Stratify if and only if the variable blocks a backdoor path (pre-treatment confounder); do not stratify if the variable is a collider or mediator (post-treatment).
  2.  **Statistical Stability:** Disregard stratification if sample sizes within strata are too small to distinguish signal from noise.
  3.  **Estimand Clarity:** Use stratified estimates for causal efficacy (does the treatment work?) and aggregate estimates for population impact (what happens if we change policy?).

  **Case Mapping**
  *   **Case 1 (Severity):** Motivated by **Causal Structure**. Severity is a pre-treatment confounder affecting both assignment and outcome; stratification blocks the backdoor path.
  *   **Case 2 (Job-training):** Motivated by **Causal Structure**. Completion is post-treatment; conditioning on it opens collider bias or controls for a mediator, making the aggregate the unbiased estimator of total effect.
  *   **Case 3 (A/B Time Ramp):** Motivated by **Causal Structure**. Time/Traffic mix is a pre-treatment confounder; stratification adjusts for the temporal drift.
  *   **Case 4 (Regional/Hospital):** Motivated by **Statistical Stability**. Splitting by hospital fragments the data too finely (noise), and region may not be the true confounder; the aggregate is more robust.
  *   **Case 5 (Defunding):** Motivated by **Estimand Clarity**. "Should this hospital use it?" asks for causal efficacy (stratified); "What happens to national numbers?" asks for population impact (aggregate weighted by usage). Both verdicts are correct for their respective questions.
  *   **Case 6 (Small Stratum):** Motivated by the tension between **Causal Structure** and **Statistical Stability**. Structure demands stratification; stability demands aggregation.

  **Prediction**
  In an A/B test where you stratify by "users who viewed the checkout page," the principle predicts you must trust the aggregate. Viewing the page is a post-treatment variable (mediator/collider); stratifying on it induces selection bias, making the treatment look artificially better or worse within the stratum.

  **Limitations**
  This principle cannot resolve Case 6 definitively; it identifies the conflict but provides no threshold for when sample size outweighs causal correctness (e.g., is n=6 too small, but n=50 okay?). It also fails if the causal graph is unknown or misspecified, as misidentifying a confounder as a mediator (or vice versa) inverts the correct verdict. Finally, it assumes no unmeasured confounding; if hidden variables exist, neither aggregate nor observed strata may be trustworthy.
