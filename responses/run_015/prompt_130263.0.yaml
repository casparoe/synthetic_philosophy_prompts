answer: |-
  # The Fiction-Emotion Decision Tree

  Use this taxonomy to sort your position on the Paradox of Fiction. Answer each node based on your own intuition about what happens when you cry at a movie. You do not need to know the philosophers' names to find your spot; the names are mapped at the leaves.

  ### **NODE 1: The Phenomenology Check**
  **Is your emotional reaction to fiction phenomenologically the same kind of thing as real-world grief (e.g., physical tightness, genuine sadness), or is it a different mental state altogether (e.g., lighter, "as-if", game-like)?**
  *   **A. Same Kind (Real Emotion)** → Go to Node 2.
  *   **B. Different Kind (Quasi-Emotion)** → Go to Node 3.

  ---

  ### **NODE 2: The Existence Assumption (For Real Emotions)**
  **If this is a real emotion, does that state still need a real object to be rational?**
  *   **A. Yes (Needs Object)** → Go to Node 2.1.
  *   **B. No (Doesn't Need Object)** → Go to Node 2.2.

  #### **NODE 2.1: The Belief Requirement**
  **If it needs a real object, do you temporarily believe the object exists?**
  *   **A. Yes** → **LEAF 1: The Illusionist**
  *   **B. No** → **LEAF 2: The Unresolved Paradox** *(See Diagnosis Below)*

  #### **NODE 2.2: The Structure of Emotion**
  **If it doesn't need a real object, is this because emotions can be 'fragmented' (directed partly at a story-world and partly at nothing actual)?**
  *   **A. Yes** → **LEAF 3: The Fragmented View** *(Unnamed)*
  *   **B. No** → **LEAF 4: The Thought/Simulation View** *(See Indistinguishability Flag)*

  ---

  ### **NODE 3: The Appropriateness Check (For Different States)**
  **If this is a different mental state, can fiction be emotionally appropriate even if the characters don't exist?**
  *   **A. Yes** → **LEAF 5: The Make-Believe Theory**
  *   **B. No** → **LEAF 6: The Error Theory** *(Unnamed)*

  ---

  ### **Leaf Mapping & Diagnoses**

  #### **LEAF 1: The Illusionist**
  *   **Position:** You feel real grief, which requires an object, so you must be temporarily tricked into believing the object exists.
  *   **Named Position:** **Coleridge (Willing Suspension of Disbelief)**.
  *   **Logic:** Resolves the paradox by denying we *know* they don't exist during the experience.

  #### **LEAF 2: The Unresolved Paradox [INCOHERENT COMBO]**
  *   **Position:** You feel real grief, which requires an object, but you do *not* believe the object exists.
  *   **Diagnosis:** This leaf is logically empty as a *solution*. It accepts all three premises of the original paradox (Real Emotion + Existence Assumption + No Belief) without rejecting any. It describes the problem, not a solution. It implies your emotion is irrational, which most theories try to avoid.

  #### **LEAF 3: The Fragmented View**
  *   **Position:** You feel real grief, but emotions don't need a single solid object; they can be directed at a hybrid of actual feelings and fictional targets.
  *   **Named Position:** **Unnamed / Hybrid View**.
  *   **Logic:** Dissolves the paradox by redefining the "object" requirement without denying the reality of the affect.

  #### **LEAF 4: The Thought/Simulation View [INDISTINGUISHABLE LEAVES]**
  *   **Position:** You feel real grief, but emotions respond to *thoughts* or *simulated beliefs*, not actual existence.
  *   **Named Positions:** **Currie (Simulation Theory)** AND **Deflationary No-Paradox View**.
  *   **Flag:** This tree cannot separate these two. Both occupy the space of "Real Emotion + No Existence Assumption." Currie explains the *mechanism* (simulation), while the Deflationary view explains the *logic* (the paradox relies on a false premise about emotions). For the purpose of this taxonomy, they yield the same result.

  #### **LEAF 5: The Make-Believe Theory**
  *   **Position:** You do not feel real grief; you feel a "quasi-emotion" generated by the rules of a game of make-believe.
  *   **Named Position:** **Walton (Make-Believe Theory)**.
  *   **Logic:** Denies the first premise (that we have real emotions towards fiction). The state is appropriate within the game, even without real objects.

  #### **LEAF 6: The Error Theory**
  *   **Position:** The state is different from real grief, and it is still inappropriate because there is no object.
  *   **Named Position:** **Unnamed / Nihilist View**.
  *   **Logic:** Claims our responses to fiction are fundamentally mistaken or irrational. Rarely held as a positive theory, but logically possible.

  ---

  ### **Seminar Notes for Handout**
  *   **The Root Split:** Most debates hinge on Node 1. If you say the feeling is *different* (Walton), you avoid the paradox entirely. If you say it's the *same* (Coleridge/Currie), you must explain how rationality works without real objects.
  *   **The Incoherent Leaf:** Leaf 2 is a trap. If you find yourself here, you haven't solved the paradox; you've just admitted you are irrational.
  *   **The Indistinguishable Leaf:** Leaf 4 shows where contemporary theory converges. Whether via "Simulation" or "Deflation," the consensus is moving toward: Real Emotions do not require Real Existence.
