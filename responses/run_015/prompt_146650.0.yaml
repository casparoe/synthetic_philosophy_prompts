answer: |-
  1. If I promise to water your plants but you forget and don't care, do you still hold authority over my conduct on your account? If yes, doesn't that make the duty purely symbolic since wronging you seems to require harming your interests?

  2. When I promise to pay a debt I already owe, does the promissory duty add anything or just double-count the existing obligation? If it adds nothing, why call it a promise, and if it adds something, where does that extra normativity come from?

  3. Is this normative power a human invention or a natural fact, and if invented, why does it bind in contexts where no convention exists? If it's natural, why does the duty's shape swing so wildly with context, and if invented, why can't we just abolish it?

  4. On a deathbed promise, the person who holds the say is gone, so who exactly exercises the authority you claim was transferred? If you say "no one," isn't the duty just about your integrity rather than their authority, collapsing back into a rival view?

  5. If I promise under threat, your account says the power is exercised, but intuitively the promise is void, so how does authority transfer work under coercion? If you argue the transfer is invalid, doesn't that rely on the very expectation-based norms you reject to define valid transfer conditions?

  6. My on-call bot says "I will page an engineer," people get annoyed when it fails, but since it has no will, is any promissory authority actually transferred? You'll likely call this assurance without obligation, but if the emotional reaction is identical, what practical work does your distinction do?

  7. If the promisee holds authority over my conduct, can they revoke that authority unilaterally, or do I retain any control once the transfer occurs? If they can revoke it, doesn't that make the duty dependent on their continuing will, which looks suspiciously like an expectation-based account?

  8. You say the transfer is limited, but who decides the limits of the authority handed over, me or the promisee? If I decide, haven't I kept the authority, and if they decide, doesn't that give them too much power over my moral landscape?
