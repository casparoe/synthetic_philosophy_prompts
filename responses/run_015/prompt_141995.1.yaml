prompt: |-
  hi — I'm a philosophy phd student, and thursday I'm presenting a chapter of my dissertation to the cultural evolution seminar here. It's an interdisciplinary room: two evolutionary anthropologists who work on costly punishment and cooperation in small-scale societies, three or so behavioral economists who run coordination and public-goods games in the lab, one political theorist, and a handfull of grad students who've read a bit of Lewis's Convention and nothing else in social ontology. Nobody there does philosophy of language. I get 25 minutes and then maybe 30 of questions.

  The chapter argues something like this. A lot of norms get modelled as cooperation problems that need enforcement to survive — punishment, reputation, internalized guilt. But a decent-sized subclass of them are closer to pure coordination problems: everybody does better if we all do the same thing, and which thing it is doesn't matter much. Lewis's machinery does the work — a regularity held up by mutual expectations plus each person preferring to conform given that others conform, with the particular equilibrium selected by salience and precedent rather than by its content being better. Then my own addition, which I'm calling focal-point laundering: once the equilibrium is up and running, people produce reasons for it, the reasons circulate, and the norm's arbitrariness stops being visible from inside. It now presents itself as resting on reasons, which is a bad description of what's actually holding it up. The practical upshot I'm defending is that for this subclass, enforcement-based accounts overpredict fragility and put the lever for change in the wrong place — arguing against the reasons won't move the norm, and what does move it is relocating the focal point: a new precedent, a visible coordinated defection with a ready alternative.

  What I need is a Q&A prep sheet, not a defence of the thesis. Give me roughly eight objections I'll actually get from this room, not the ones I'd get from philosophers, ordered by how much damage they'd do if I handled them badly. Phrase each one the way that person would actually say it — I want to hear the anthropologists talking about costly punishment and what the ethnography looks like, the economists asking what this adds to equilibrium selection, the political theorist on who had the authority to set the precedent in the first place. For each: a two-minute reply, and be straight with me about where the reply is soft. Also: what should I concede in the first two minutes, before anyone asks anything, so I don't spend the whole session looking like I'm defending something stronger than I am? And which single reply has to land for the chapter to be worth anything?

  One more thing. I already know the objection I'm dreading: that focal-point laundering is unfalsifiable, that whenever a norm shifts after a public argument I'll say the argument was really a salience shift, and whenever it doesn't shift I'll say the argument failed to be one. I don't know how to answer it and I'm hoping nobody raises it. Please raise it anyway and tell me what the least bad response is.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Philosophy PhD student.
      *   **Task:** Presenting a dissertation chapter to a Cultural Evolution Seminar.
      *   **Audience:** Interdisciplinary (2 evolutionary anthropologists, 3 behavioral economists, 1 political theorist, several grad students familiar with Lewis but not deep social ontology). *Crucially: No philosophy of language specialists.*
      *   **Time:** 25 min talk + 30 min Q&A.
      *   **Core Argument:** Some norms are coordination problems (Lewisian conventions), not cooperation/enforcement problems. Once established, "focal-point laundering" occurs: people generate post-hoc reasons, masking the arbitrariness. Enforcement-based accounts misdiagnose fragility and levers of change. Change requires shifting the focal point, not arguing against reasons.
      *   **Needs:**
          1.  Concessions to make in the intro (first 2 mins).
          2.  The "single reply" that must land for the chapter to matter.
          3.  Eight objections ordered by damage potential, phrased in the audience's voice (anthropologist, economist, political theorist), with 2-minute replies and honesty about soft spots.
          4.  Specific handling of the "unfalsifiability" objection (which the user fears).

  2.  **Deconstruct the Core Argument & Audience Perspectives:**
      *   *Anthropologists:* Care about ethnography, real-world messiness, costly punishment, function, and history. They will worry about "pure coordination" being rare and the role of power/history.
      *   *Economists:* Care about models, equilibrium selection, predictive power, and mechanisms. They will ask about welfare, efficiency, and how to distinguish coordination from cooperation empirically.
      *   *Political Theorist:* Cares about legitimacy, power, authority, and normativity. Who set the precedent? Is this conservative?
      *   *Grad Students:* Might cling too hard to Lewis or miss the nuance.
      *   *The "Unfalsifiability" Worry:* This is a methodological critique common in social science. If "reasons" are always just laundering, how do you test it?

  3.  **Drafting the Concessions (Pre-emptive Strike):**
      *   Goal: Don't look dogmatic. Acknowledge the dominance of enforcement models. Acknowledge the mix of norms.
      *   *Draft:* "I'm not saying *all* norms are coordination. I'm not saying punishment never happens. I'm not saying reasons are *always* fake."
      *   *Refinement:* Make it specific to the room. Acknowledge the success of costly signaling/punishment models in *their* fields. Position the chapter as carving out a specific subset where those models fail.

  4.  **Identifying the "Must-Land" Reply:**
      *   What is the core contribution? It's the *mechanism of change*. If the audience leaves thinking "Okay, but how do we actually change these norms?", the practical upshot is lost.
      *   *Selection:* The distinction between *arguing against reasons* vs. *shifting salience*. If this doesn't stick, the "practical upshot" fails.

  5.  **Developing the 8 Objections (Ordered by Damage):**
      *   *Criteria:* High damage = undermines the core mechanism or empirical validity. Low damage = clarificatory or niche.
      *   *Objection 1 (The Dreaded One):* Unfalsifiability. (User requested this be included). This is high damage because it kills the scientific credibility in a social science room.
      *   *Objection 2 (Anthropologist):* "Pure coordination is a myth." Power/history always lurks. (High damage: eliminates the subject matter).
      *   *Objection 3 (Economist):* "Equilibrium Selection." What adds to existing models? (Medium-High: makes the theory redundant).
      *   *Objection 4 (Anthropologist/Econ):* "Costly Punishment exists in these cases." (Medium: blurs the distinction).
      *   *Objection 5 (Political Theorist):* "Legitimacy/Authority." Who chose the focal point? (Medium: normative implications).
      *   *Objection 6 (Econ):* "Welfare/Efficiency." What if the new focal point is worse? (Medium-Low: descriptive vs normative).
      *   *Objection 7 (Grad Student/Lewis):* "Common Knowledge." Do they actually know others know? (Low: technical Lewis quibble).
      *   *Objection 8 (General):* "Internalization." People feel guilty, not just coordinated. (Low: acknowledges the laundering effect).

      *Wait, I need to order by damage.*
      1.  Unfalsifiability (Methodological kill-shot).
      2.  "No Pure Coordination" (Empirical kill-shot).
      3.  "Punishment is still there" (Mechanism confusion).
      4.  "What's new for equilibrium selection?" (Redundancy).
      5.  "Power/Authority" (Political blind spot).
      6.  "Internalization is real" (Psychological realism).
      7.  "Efficiency" (Normative worry).
      8.  "Lewis Common Knowledge" (Technical nitpick).

      *Refining the Voices:*
      *   Anthropologist: "In the field, we see..."
      *   Economist: "In the model, we see..."
      *   Pol Theory: "But who decides..."

  6.  **Drafting Replies & Identifying Soft Spots:**
      *   *Constraint:* 2-minute reply (approx. 250-300 words spoken).
      *   *Honesty:* Must admit where the theory is weak.
      *   *Unfalsifiability:* Needs a specific strategy. Prediction of *failure* of reason-based campaigns vs. success of salience-based ones.

  7.  **Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by damage? Yes.
      *   Phrased in audience voice? Yes.
      *   2-minute replies? Yes (need to keep them tight).
      *   Soft spots identified? Yes.
      *   Concessions for intro? Yes.
      *   Single must-land reply? Yes.
      *   Unfalsifiability included? Yes.

  8.  **Final Polish:**
      *   Ensure tone is supportive but rigorous ("be straight with me").
      *   Check that the "Focal-Point Laundering" concept is clear in the replies.
      *   Make sure the advice on the intro concessions sets the table for the objections.

  *(Self-Correction during drafting)*: I initially thought about putting the Anthropologist's "Power" objection higher. But the Unfalsifiability one is methodological suicide in a cultural evolution seminar. That has to be #1. The "Pure Coordination is a Myth" is #2 because if there's no data, there's no theory. The "What's new" is #3 because redundancy is a common rejection reason for interdisciplinary work.

  Let's refine the "Unfalsifiability" reply. The user is scared of this. The best defense is *predictive asymmetry*. If my theory is right, reason-based interventions fail *specifically* when laundering is high, while salience interventions work. If enforcement theory is right, reason-based interventions should work (by changing cost/benefit perceptions). I need to make sure the user sees this as a testable hypothesis, not just a post-hoc story.

  Let's refine the "Concessions". The user needs to signal they aren't throwing out the baby (enforcement) with the bathwater (coordination).

  Okay, ready to write.
answer: |-
  Here is your Q&A prep sheet. It is designed for the specific interdisciplinary mix you described. The tone is direct, strategic, and calibrated to the time limits.

  ### Part 1: The Pre-emptive Concessions (First 2 Minutes)
  *Do not wait for questions to make these. Build them into your concluding remarks or the setup of your core claim. This prevents you from looking dogmatic.*

  1.  **Concede the Dominance of Enforcement:** "I am not arguing that costly punishment or reputation models are wrong. In many domains—especially those involving public goods or free-riding—they are the right tool. I am arguing they are being *overextended* into domains where the payoff structure is coordination, not cooperation."
  2.  **Concede the Mixture:** "Real-world norms are rarely 100% pure coordination. They are hybrids. My claim is that when the coordination component dominates, enforcement-based interventions fail, even if there is some punishment present."
  3.  **Concede the Reality of Reasons:** "I am not saying the reasons people give are lies. They often believe them. My claim is about *causal efficacy*, not sincerity. The reasons are symptoms of the equilibrium, not the cause of it."

  ### Part 2: The Single Reply That Must Land
  **The Distinction Between *Reason-Tracking* and *Salience-Shifting* Interventions.**
  If you fail to convince them that *arguing against the reason* is the wrong lever for *this specific class of norms*, the "practical upshot" vanishes, and you are just doing descriptive sociology. You must land the point that: "If this is a laundered coordination norm, moral persuasion is inefficient. You need a visible, coordinated defection to a new focal point."

  ---

  ### Part 3: The Eight Objections (Ordered by Damage)

  #### 1. The Methodological Kill-Shot (Unfalsifiability)
  **Who:** A Behavioral Economist or Senior Anthropologist.
  **The Objection:** "This 'laundering' concept worries me. It looks unfalsifiable. If a norm shifts after a public argument, you'll say the argument was really a salience shift. If it doesn't shift, you'll say the laundering was too strong. How do I distinguish your explanation from a standard preference-change model empirically?"
  **The Reply (2 mins):** "That is the central methodological challenge, and here is the testable asymmetry. Standard models predict that changing the *perceived value* of the reason should shift the norm. My model predicts that for laundered norms, reason-based campaigns will have high engagement but low behavioral conversion, while *salience-based* interventions (like a visible, coordinated switch by a subset of the population) will work even without changing anyone's mind about the 'reasons.'
  **The Soft Spot:** I admit I need more historical case studies where we can track the *sequence* of change. Did the reason change first, or the behavior? My hypothesis is behavior leads, reasons lag. If you find cases where reason-change reliably precedes behavioral shift in coordination contexts, my model is in trouble. I'm treating this as a predictive hypothesis, not a post-hoc story."

  #### 2. The "Pure Coordination is a Myth" Objection
  **Who:** Evolutionary Anthropologist.
  **The Objection:** "In the ethnography, I rarely see 'pure' coordination. There's always power, history, or latent conflict buried in the equilibrium. Dress codes or driving sides aren't just arbitrary; they signal status or group boundaries. If there's distributional conflict, it's not Lewisian coordination, it's bargaining. Doesn't your model collapse once you add power?"
  **The Reply (2 mins):** "You're right that pure coordination is an idealization. But 'bargaining' implies I prefer *my* equilibrium to *yours*, whereas in these cases, I often prefer *your* equilibrium to *no* equilibrium. The 'power' element often comes *after* the norm is established (via laundering).
  **The Soft Spot:** I concede that if the payoff matrix is heavily asymmetric *ex-ante*, my model doesn't apply. I need to be better at distinguishing 'coordination with latent conflict' from 'coordination with laundered conflict.' If the conflict is primary, you're right, enforcement models win. I'm only claiming a subset where the arbitrariness was genuine at the origin."

  #### 3. The "What's New?" Objection (Equilibrium Selection)
  **Who:** Behavioral Economist.
  **The Objection:** "Economists have been dealing with equilibrium selection for decades. We have trembling hand, risk dominance, evolutionary stability. What does 'focal-point laundering' add to the existing machinery of equilibrium selection theory? Is this just philosophy rebranding standard game theory?"
  **The Reply (2 mins):** "Standard selection theory focuses on how we *get* to an equilibrium. 'Laundering' explains why we *stay* there despite changing external parameters. It models the hysteresis. Standard theory says if the payoff structure changes slightly, we might shift. Laundering says the *reasons* generated by the norm act as a friction cost that isn't in the payoff matrix.
  **The Soft Spot:** I need to formalize this 'friction cost' better. Right now, it's a qualitative description. If I can't quantify the 'cost of un-laundering,' it's just a story. I need to collaborate with modelers to put a parameter on 'reason-resistance.'"

  #### 4. The "Punishment is Still There" Objection
  **Who:** Evolutionary Anthropologist.
  **The Objection:** "You say enforcement models overpredict fragility. But in small-scale societies, even coordination norms like food taboos are enforced with punishment. If people are punishing deviators, isn't it a cooperation problem by definition? Why ignore the punishment data?"
  **The Reply (2 mins):** "Punishment can be a *secondary* stabilizer for a coordination norm. The question is: what happens if you remove the punishment? In cooperation problems, the norm collapses immediately. In coordination problems, it often persists because the incentive to conform remains.
  **The Soft Spot:** Empirically, this is hard to disentangle. If punishment is present, how do I prove it's not doing the heavy lifting? I need cases where punishment was removed but the norm held. Those are rare. I'm relying on the *motivation* for punishment (is it anger or confusion?) which is hard to code."

  #### 5. The "Who Decided?" Objection (Authority)
  **Who:** Political Theorist.
  **The Objection:** "You talk about precedents and salience. But precedents don't emerge in a vacuum. Who had the authority to set the first precedent? If focal-point laundering masks the arbitrariness, doesn't it also mask the power relations that established the focal point initially? Isn't this a conservative theory that naturalizes status quo power?"
  **The Reply (2 mins):** "It is descriptive, not normative. I agree it can mask power. In fact, that's part of the laundering mechanism—historical accidents of power get re-described as 'rational reasons.'
  **The Soft Spot:** I don't have a normative account of *legitimate* focal points. If a new focal point is shifted by a charismatic dictator, my model says the norm will stick, but I can't tell you if it *should*. I'm explaining stability, not legitimacy. I need to be careful not to sound like I'm endorsing the mechanism."

  #### 6. The "Internalization" Objection
  **Who:** Grad Student (or Psych-leaning Econ).
  **The Objection:** "People don't just conform; they feel *guilty* if they break these norms. Lewisian agents just prefer to coordinate. If people have internalized the norm as a moral truth, isn't that a different psychological architecture than just following a focal point?"
  **The Reply (2 mins):** "That's exactly what laundering produces. The psychological architecture *changes* over time. The initial state is Lewisian coordination; the stable state is internalized morality. The error is assuming the current psychology explains the *origin* or the *maintenance mechanism*.
  **The Soft Spot:** Once internalization is deep, my model might lose explanatory power. If the reason is fully hard-wired, shifting the focal point might require de-programming, not just a new signal. I'm best at explaining the *transition* phase, not deeply entrenched historical norms."

  #### 7. The "Efficiency" Objection
  **Who:** Behavioral Economist.
  **The Objection:** "If these are coordination norms, presumably they are efficient equilibria. But if laundering locks us into a bad equilibrium, and you say 'don't argue reasons, shift salience,' aren't you advocating for manipulation over deliberation? What if the new focal point is welfare-reducing?"
  **The Reply (2 mins):** "I'm describing how norms *move*, not how they *should*. However, deliberation often fails on these norms because people talk past each other about reasons that aren't causal.
  **The Soft Spot:** I don't have a welfare criterion for selecting *which* focal point to shift to. This is a vulnerability. If I advocate for salience-shifting, I need a normative framework for choosing the target. Otherwise, I'm just a mechanic for social engineers."

  #### 8. The "Common Knowledge" Objection
  **Who:** Grad Student (Lewis Reader).
  **The Objection:** "Lewis requires common knowledge of the regularity. In large societies, we don't have common knowledge, only approximate knowledge. Does 'laundering' work without strict Lewisian common knowledge?"
  **The Reply (2 mins):** "I'm using Lewis loosely, as a baseline for mutual expectations. 'Laundering' actually reduces the cognitive load—you don't need to know others know; you just need to know the 'reason' is public.
  **The Soft Spot:** This is a technical weakness. If I lean too hard on Lewis, I inherit his problems. I should frame it as 'mutual expectations' rather than strict common knowledge to avoid this trap."

  ---

  ### Part 4: Handling the "Unfalsifiability" Fear (Deep Dive)
  *You asked for the least bad response to the objection you dread. Do not try to prove it is falsifiable in a vacuum. Prove it is **more** falsifiable than the alternative.*

  **The Strategy:**
  When they ask this (and they will, because social scientists smell "just-so stories" instantly), do not get defensive. Pivot to **Predictive Asymmetry**.

  **Say this:**
  "I share that worry. That's why I frame it as a competition between two models.
  1.  **Enforcement/Reason Model:** Predicts that providing counter-arguments should weaken the norm proportionally to the argument's quality.
  2.  **Laundering Model:** Predicts that counter-arguments will have *no effect* on behavior, but *high effect* on discourse, while a visible behavioral shift (salience) will have *high effect* on behavior with *little* discourse.

  If we see a norm where people argue passionately against it for decades with zero behavioral change, but then it vanishes overnight after a visible coordinated shift (like a fashion trend or a technology standard), the Enforcement Model has to add ad-hoc clauses to explain the lag. My model predicts the lag. I'm not saying my model is perfect, but it explains the *decoupling of discourse and behavior* better than the alternative."

  **Why this works:** It moves the burden of proof. You aren't claiming absolute truth; you're claiming better fit for a specific anomaly (the decoupling of reason-talk and behavior) that their models struggle with.

  **The Soft Spot (Be ready to admit):** "I admit that measuring 'salience' independently of the shift is hard. That is the next stage of the work—finding a proxy for salience that isn't just 'the thing people switched to.'"
