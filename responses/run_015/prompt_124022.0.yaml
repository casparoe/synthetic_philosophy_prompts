answer: |-
  ### Evolutionary Translation of Absolute Pacifism

  **Preface:** This translation maps moral propositions onto biological mechanisms. It treats "moral agency" as "phenotypic behavioral output" and "moral value" as "fitness consequences." Note that this mapping is descriptive (is) rather than prescriptive (ought).

  ---

  ### 1. Direct vs. Structural Violence
  **Pacifist Claim:** Direct violence (killing) is distinct from but morally equivalent to structural violence (systems causing deprivation/death).
  **Evolutionary Translation:**
  *   **Direct Violence:** Overt *agonistic behavior* resulting in immediate mortality or reproductive truncation of a conspecific.
  *   **Structural Violence:** *Niche construction* or *exploitative competition* that modifies the environment to reduce the carrying capacity or resource access of a specific phenotype/group, resulting in fitness loss without direct physical contact.
  *   **Translation Status:** **High Fidelity.**
      *   *Clean:* The distinction between contest competition (direct) and exploitation/environmental constraint (structural) is biologically robust. Both result in the same output: reduced inclusive fitness.
      *   *Distortion:* Pacifism claims moral equivalence based on *outcome* and *intent*. Biology treats them as equivalent only regarding *selection pressure*. Biology does not track "intent," only the causal chain of fitness reduction.

  ### 2. The Collective Complicity Objection
  **Pacifist Claim:** Ordinary participation in social institutions (paying taxes, obeying laws) renders one morally responsible for state violence.
  **Evolutionary Translation:**
  *   **Institutions:** *Group-level adaptive structures* (superorganismal phenotypes) that coordinate behavior to maximize group fitness, often at the cost of out-groups.
  *   **Complicity:** *Causal contribution* to the group phenotype. An individual organism providing metabolic energy (labor/taxes) to the colony enables the colony's aggressive output.
  *   **Responsibility:** *Selection accountability.* If the group strategy (state violence) yields negative long-term fitness (e.g., arms race escalation), the alleles or memes supporting participation are selected against.
  *   **Translation Status:** **Forced Fit.**
      *   *Clean:* The causal link between individual resource contribution and group-level output is clear (multilevel selection theory).
      *   *Distortion:* "Responsibility" implies a counterfactual capacity to have done otherwise (free will). In biology, an individual's participation is a function of their genotype/phenotype interacting with the environment. To say an individual is "complicit" is merely to say they are a functional component of the aggressive phenotype.
      *   *Missing:* The *blame* aspect. Biology can identify a trait as maladaptive, but it cannot assign *fault* to the vehicle carrying the trait.

  ### 3. The Non-Identity Concern
  **Pacifist Claim:** Defending present generations through violence alters the future such that specific people who would have existed under peace do not exist; this harms the "potential" peaceful lineage.
  **Evolutionary Translation:**
  *   **Violent Defense:** A strategy that alters the *selective landscape* and *demographic trajectory*.
  *   **Future People:** Specific *lineage sorting* outcomes. Different behavioral strategies lead to different mating pairs and survival rates, resulting in distinct coalescence points.
  *   **Harm to Future People:** This creates a biological paradox. If the peaceful trajectory is not taken, the specific genotypes associated with that trajectory have a fitness of zero (non-existence).
  *   **Translation Status:** **Category Error.**
      *   *Clean:* It is biologically factual that different strategies produce different future gene pools.
      *   *Distortion:* Biology cannot compute "harm" against a non-existent genotype. Fitness is relative to existence. You cannot reduce the fitness of an organism that is never produced. The pacifist argument relies on a metaphysical valuation of *potential* lineages over *actual* lineages.
      *   *Missing:* A metric for valuing one lineage's existence over another's absent a fitness differential.

  ### 4. The Absolute Prohibition (Deontology)
  **Pacifist Claim:** Intentional killing is intrinsically wrong, regardless of consequences (e.g., even to save others).
  **Evolutionary Translation:**
  *   **Absolute Prohibition:** An *unconditional strategy* (always cooperate/never aggress) that does not respond to frequency-dependent payoffs.
  *   **Intrinsic Wrongness:** A *fitness cost* that is treated as infinite. The organism behaves as if the cost of aggression is $-\infty$, preventing invasion by conditional strategies (e.g., "Tit-for-Tat" or "Retaliator").
  *   **Translation Status:** **Evolutionarily Unstable.**
      *   *Clean:* We can model a population of absolute pacifists.
      *   *Distortion:* In selection dynamics, an unconditional non-aggression strategy is vulnerable to invasion by "cheater" phenotypes (aggressors) unless there is strong assortative interaction or severe group-level selection against aggressors. Calling this "intrinsically wrong" translates to "evolutionarily stable only under specific, rare parameters."
      *   *Missing:* The *normative force*. Biology explains why a trait might persist (e.g., cultural group selection), but it cannot generate the *obligation* to maintain it.

  ---

  ### Residue Report: The Untranslatable Remainder

  Having mapped the components, we are left with a significant residue that evolutionary vocabulary cannot absorb. This residue consists of two primary elements: **Normativity** and the **Act/Omission Distinction**.

  #### 1. The Normative Prohibition (The "Ought")
  *   **The Residue:** Pacifism asserts, "You *ought not* kill." Evolutionary biology asserts, "If you kill, you trigger an arms race" or "If you don't kill, you risk extinction."
  *   **Analysis:** Biology lacks resources for irreducible normative concepts. It deals in *stability* and *persistence*, not *rightness*.
  *   **Implication:** This does not necessarily strip pacifism of meaning, but it relocates the source of that meaning. If pacifism is true, its truth conditions are not biological. They are either:
      1.  **Metaphysical:** Existing outside the causal closure of the physical world (dualism).
      2.  **Constructed:** A cultural meme complex that functions *as if* it were normative to stabilize group cooperation (error theory or fictionalism).
  *   **Verdict:** Evolutionary analysis reveals that the "absolute" nature of the prohibition is biologically inexplicable as a universal trait. It suggests the pacifist claim depends on **rhetorical framing** that treats a specific cultural strategy (non-violence) as a law of nature. Biology strips away the "sacredness" of the prohibition, revealing it as a high-risk strategy that requires specific ecological niches (e.g., high interdependence) to survive.

  #### 2. The Act/Omission Distinction (Killing vs. Letting Die)
  *   **The Residue:** Pacifism often distinguishes between *committing* violence (active) and *allowing* violence (passive), usually weighting the former as morally worse.
  *   **Analysis:** In selection dynamics, **cause is cause.** Whether a conspecific dies because you stabbed them (direct aggression) or because you withheld resources (structural/exploitative competition), the fitness outcome ($\Delta W$) is identical.
  *   **Implication:** Evolutionary biology treats the act/omission distinction as **cognitively real but causally irrelevant.** It is a heuristic for assigning blame within a social group, not a feature of the physical world.
  *   **Verdict:** This reveals that the pacifist distinction relies on **psychological framing** rather than objective dynamics. Biology suggests that "letting die" via niche construction is functionally identical to "killing" via aggression. If pacifism rests on the moral superiority of omission, evolutionary analysis undermines this by showing the fitness consequences are isomorphic.

  ### Final Assessment

  **Does biology lack resources for normative concepts?**
  Yes. Biology is a descriptive science of causal processes. It cannot generate an "ought."

  **Does this reveal pacifist claims depend on rhetorical framing?**
  Yes, partially.
  1.  **The "Absolute" Claim:** Evolutionary analysis suggests that *absolute* non-aggression is an unstable ESS in a mixed population. Therefore, framing it as a universal moral law is rhetorically masking its biological fragility. It requires a specific niche (e.g., strong cultural group selection) to persist.
  2.  **The "Harm" Claim:** Biology validates the pacifist view that structural and direct violence are functionally equivalent (both reduce fitness). Here, biology *supports* the pacifist expansion of violence beyond the physical.
  3.  **The "Responsibility" Claim:** Biology dissolves the individual moral agent into a vehicle for gene/meme propagation. "Complicity" becomes mere causal contribution. This strips the *retributive* element of pacifism but retains the *consequentialist* argument (i.e., "participating in this system selects for aggressive phenotypes").

  **Conclusion:**
  Translating absolute pacifism into evolutionary vocabulary honest reveals that the **mechanisms of harm** (direct/structural) and **lineage consequences** (non-identity) are biologically legible. However, the **deontological core** (the intrinsic wrongness) is untranslatable. It appears not as a biological fact, but as a *cultural adaptation*—a meme designed to suppress the arms-race dynamics that threaten group survival.

  Evolutionary analysis does not disprove pacifism, but it naturalizes it. It transforms the "Moral Law" into a "High-Cooperation Strategy." Whether that strategy is *binding* remains outside the biological domain, indicating that the normative force of pacifism is indeed an irreducible concept that evolutionary biology can describe but never validate.
