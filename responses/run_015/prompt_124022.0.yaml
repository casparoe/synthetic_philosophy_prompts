      *   Structure clearly with headings.

  **(Self-Correction Note on Non-Identity):** The prompt frames the Non-Identity concern as: "defending present generations through violence harms the specific future people who would come to exist only under a peaceful trajectory." This is a specific philosophical argument. Biologically, this translates to: Violent defense alters the selective environment, changing the lineage sorting. The "harm" to future people is tricky because if they wouldn't exist otherwise, they aren't "harmed" in a fitness sense (they don't exist to have low fitness). I need to address this paradox biologically (non-existence = zero fitness, not negative fitness).

  **(Self-Correction on Normativity):** The prompt asks if the residue indicates biology lacks resources for irreducible normative concepts OR if it reveals pacifist claims depend on rhetorical framing. I should argue it's primarily the former (biology is descriptive), but acknowledge the latter (pacifist "absolutes" look like unstable strategies biologically).

  10. **Finalizing the Output Structure:**
      *   Introduction (Setting the frame).
      *   Translation of Core Components (Direct/Structural, Complicity, Non-Identity).
      *   Translation of the Absolute Prohibition.
      *   Residue Report (The Untranslatables).
      *   Conclusion (Normative Resources vs. Rhetorical Framing).

