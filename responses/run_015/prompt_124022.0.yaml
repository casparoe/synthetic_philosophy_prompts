prompt: |-
  I'm an evolutionary biologist fluent in selection dynamics, evolutionary stable strategies, niche construction, evolutionary arms races, and group-level selection, but with only undergraduate-level exposure to moral philosophy. Restate the core case for absolute pacifism — including the direct-versus-structural-violence distinction, the collective-complicity objection (that ordinary participation in social institutions renders one responsible for state violence), and the non-identity concern (that defending present generations through violence harms the specific future people who would come to exist only under a peaceful trajectory) — entirely in my evolutionary vocabulary. For each component, specify what translates cleanly (for example, aggression as an arms-race strategy or institutional roles as niche construction), what must be distorted to fit (for example, treating intentional moral agency or deontological duty as selectable traits), and what has no counterpart at all. Then provide the residue report: assess whether the untranslatable remainder — especially the normative prohibition on intentional killing and the moral distinction between acting and allowing harm — indicates that evolutionary biology lacks resources for irreducible normative concepts, or whether it reveals that those pacifist claims depend on rhetorical framing that evolutionary analysis strips away. Be precise about where your translation is honest and where you are forcing a fit.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Target Audience:** Evolutionary Biologist (fluent in selection dynamics, ESS, niche construction, arms races, group selection).
      *   **User's Background:** Undergraduate moral philosophy.
      *   **Task:** Restate the core case for *absolute pacifism* using *evolutionary vocabulary*.
      *   **Key Components to Translate:**
          1.  Direct vs. Structural Violence.
          2.  Collective Complicity (participation in institutions = responsibility).
          3.  Non-Identity Problem (violence now changes *who* exists later).
      *   **Required Analysis:**
          1.  Specify what translates cleanly.
          2.  Specify what must be distorted/forced.
          3.  Specify what has no counterpart.
          4.  **Residue Report:** Assess the untranslatable remainder (normative prohibition, acting vs. allowing). Does this show biology lacks normative resources, or that pacifist claims are rhetorical framing stripped by evolutionary analysis?
      *   **Tone/Constraint:** Be precise about honest translations vs. forced fits.

  2.  **Deconstruct Absolute Pacifism (Moral Philosophy Version):**
      *   *Core Claim:* Intentional killing/use of force is intrinsically wrong, regardless of consequences.
      *   *Direct vs. Structural:* Direct is hitting someone; structural is systems causing harm (poverty, laws). Pacifists oppose both.
      *   *Complicity:* If I pay taxes to a state that kills, I am morally tainted/responsible.
      *   *Non-Identity:* If we fight a war, the people born after are different than if we don't. If war prevents a "better" future population, it's wrong (this is a bit of a stretch in standard pacifism, but the prompt asks for this specific argument).
      *   *Normativity:* "Ought" implies "Can," but also "Ought not to kill" is a deontological constraint, not just a utility calculation.

  3.  **Translate into Evolutionary Biology:**

      *   *Concept 1: Direct vs. Structural Violence.*
          *   *Bio Equivalent:* Direct aggression (contest competition) vs. Exploitative competition/Environmental constraints.
          *   *Translation:* Direct violence = overt agonistic behavior. Structural violence = niche construction that limits fitness of others (e.g., resource monopolization).
          *   *Fit:* Good fit for mechanisms. Bad fit for "wrongness."

      *   *Concept 2: Collective Complicity.*
          *   *Bio Equivalent:* Group selection / Kin selection / Free-rider problems.
          *   *Translation:* Participating in a group strategy (institution) that yields fitness costs to out-groups.
          *   *Fit:* "Responsibility" translates to "causal contribution to fitness outcomes." "Guilt" has no bio equivalent unless framed as selection against the trait.

      *   *Concept 3: Non-Identity Problem.*
          *   *Bio Equivalent:* Lineage sorting / Coalescence theory.
          *   *Translation:* Violent strategies alter the reproductive trajectory, changing the specific genetic lineage that persists.
          *   *Fit:* This is actually a strong biological fact (different matings = different offspring). The *moral weight* of this is the hard part.

      *   *Concept 4: Absolute Prohibition (Deontology).*
          *   *Bio Equivalent:* Evolutionary Stable Strategy (ESS) that forbids deviation?
          *   *Translation:* A rigid behavioral rule that cannot be invaded by conditional strategies.
          *   *Fit:* Biologically, rigid rules are usually vulnerable unless there's a specific constraint. An *absolute* rule against aggression is evolutionarily unstable in a mixed population unless specific conditions (like strong group selection) apply.

  4.  **Drafting the Translation (Section by Section):**

      *   *Introduction:* Acknowledge the category error (Is vs. Ought) but proceed with the mapping.
      *   *Direct vs. Structural:* Map to Contest vs. Exploitative Competition + Niche Construction.
      *   *Complicity:* Map to Group-Level Selection and Causal Contribution to Phenotypic Outcomes.
      *   *Non-Identity:* Map to Lineage Trajectories and Coalescence.
      *   *The Absolute Norm:* Map to an Unconditional Strategy.

  5.  **Analyzing the "Fit" (Honest vs. Forced):**

      *   *Clean:* Mechanisms of harm (direct/indirect), lineage changes.
      *   *Distorted:* "Responsibility" (causal vs. moral), "Strategy" (conscious vs. heuristic).
      *   *Missing:* Normativity (the "ought"), Intrinsic Value, Rights.

  6.  **Developing the Residue Report:**

      *   *The Core Issue:* Evolutionary biology explains *why* a trait exists or persists. It does not prescribe *whether it should*.
      *   *Pacifism's Claim:* "Killing is wrong."
      *   *Bio's Response:* "Killing reduces inclusive fitness of the victim, potentially increases it for the killer, but may trigger arms races."
      *   *The Residue:* The *prohibition* itself. Biology can model a population where everyone is pacifist (if group selection is strong), but it cannot generate the *moral obligation* to be pacifist.
      *   *Conclusion:* Does this strip pacifism of meaning? Or show biology is descriptive?
      *   *Decision:* It shows biology lacks normative resources. However, it also reveals that "absolute" pacifism is likely evolutionarily unstable (an ESS problem) unless framed as a cultural group selection trait. The "moral distinction" (acting vs. allowing) is functionally irrelevant in biology (cause is cause), which undermines the philosophical distinction.

  7.  **Refining the Vocabulary:**
      *   Use terms like *agonistic behavior*, *inclusive fitness*, *phenotypic expression*, *causal graph*, *lineage sorting*, *ESS*, *frequency-dependent selection*.
      *   Avoid moralizing terms unless quoting the translation.

  8.  **Self-Correction/Critique during Drafting:**
      *   *Check:* Did I address the Non-Identity problem correctly? In philosophy, it's about harming specific future people. In bio, it's about changing the genetic composition of future generations. I need to make sure I don't imply biology cares *which* genes survive, only that they do.
      *   *Check:* The prompt asks about "Collective Complicity." In bio, this is about being part of a superorganism or group-selected unit. I need to be careful not to imply the individual *knows* they are complicit.
      *   *Check:* The "Residue Report" needs to be sharp. Is it that biology *can't* do norms, or that pacifism is *wrong*? I must remain neutral on the truth of pacifism but analyze the translatability.
      *   *Constraint:* "Be precise about where your translation is honest and where you are forcing a fit." I need explicit labels for this.

  9.  **Final Polish:**
