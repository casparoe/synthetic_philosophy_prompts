      *   **Key Distinction:** Correlated vs. Independent Rationalizability. The user says "any belief." This implies Correlated Rationalizability. This is the widest set. This makes C3 even harder to defend (since correlated rat set is larger than independent). I should note this.
      *   **Key Distinction on C6:** Distinguish between "trembles in execution" (Perfect Eq) vs "trembles in belief" (Perfect Rationalizability). Both restrict the set compared to standard Rationalizability.

