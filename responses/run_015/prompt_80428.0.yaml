          *   *Fix:* Drop/Modify C3. Restrict to dominance-solvable games.

      *   **Major Tension 2: C2 + C6.** (Robustness of Rationalizability).
          *   C2 defines Rationalizability via "best response to *any* belief" (allows zero probs).
