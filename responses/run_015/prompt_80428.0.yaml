      *   **C2 (CKR = Rationalizability):** This is the Brandenburger-Dekel (1987) result. In normal form games, CKR (with independent beliefs or just subjective beliefs depending on the specific setup) characterizes Rationalizability. Specifically, if beliefs are correlated, it's correlated rationalizability. If independent, it's independent rationalizability. The user says "never best responses to *any* belief." This usually implies correlated rationalizability. *Status: Tenable (with caveats on correlation).*
      *   **C3 (Unique NE + CKR => Play NE):** If a game has a unique NE, is it the *only* rationalizable strategy profile? Not necessarily. In games with a unique NE, there can still be non-Nash rationalizable strategies (e.g., some games with unique mixed NE have pure strategies that are rationalizable but not played in the NE). However, if the unique NE is in *strictly dominant* strategies, then yes. But the user claims this for *any* finite game with a unique NE. This is a known point of contention. Wait, if the NE is unique, does CKR imply it?
          *   *Correction:* If a game has a unique NE, it does *not* imply that the NE is the unique rationalizable outcome. Example: A game with a unique mixed NE often has support strategies that are rationalizable, but sometimes other strategies survive IESDS that aren't in the support? Actually, the standard result is: If a game is dominance solvable (unique outcome after IESDS), then CKR implies that outcome. But Unique NE does not imply Dominance Solvable.
          *   *Counter-example:* Consider a game with a unique mixed NE. Often, the pure strategies in the support are rationalizable. Are there rationalizable strategies *outside* the support? Sometimes. But more importantly, does CKR *select* the NE? If there are multiple rationalizable profiles, CKR doesn't predict a specific play, just that play is within the rationalizable set. If the unique NE is the *only* rationalizable profile, then yes. But Unique NE $\neq$ Unique Rationalizable.
          *   *Verdict:* This commitment is likely false or requires specific conditions (like dominance solvability). This is a potential tension point.
      *   **C4 (Agreement Theorem):** Standard Aumann (1976). *Status: Tenable.*
      *   **C5 (Coordination & Posteriors):** In a coordination game (multiple NE), can players have different posteriors about which NE will be played without violating Agreement Theorem? The Agreement Theorem says they cannot have *Common Knowledge* of differing posteriors. If they just *have* differing posteriors (but don't know that they differ, or don't know that the other knows, etc.), it's allowed. In a coordination game without communication, players might believe $E_1$ is likely while the other believes $E_2$ is likely. As long as this difference isn't CK, it's fine. *Status: Tenable.*
