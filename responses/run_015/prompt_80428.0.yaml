      *   **Tension D: C1 (Finite Model) vs. C4 (Common Prior).**
          *   C1 says finite model of beliefs. C4 accepts Agreement Theorem (requires Common Prior).
          *   Are finite type spaces compatible with Common Prior? Yes.
          *   Is CKR compatible with Common Prior? Yes.
          *   *Status:* No tension.

  4.  **Synthesize and Rank Tensions:**

      *   **Major Tension 1: C2 + C3.** (The "Unique NE" Fallacy).
