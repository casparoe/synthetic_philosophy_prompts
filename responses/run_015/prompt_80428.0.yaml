          *   C3 is the culprit. It claims CKR predicts the NE in unique NE games. Since Unique NE $\neq$ Dominance Solvable, claiming CKR predicts it assumes players coordinate on the rationalizable set's intersection with the NE, or assumes the rationalizable set *is* the NE.
