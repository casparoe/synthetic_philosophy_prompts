prompt: |-
  I run a small type foundry — me, two other designers, and a junior who's talented but has never read a word of theory — and we keep having the same fight in design reviews: is that glyph still an 'a'?

  It comes up maybe two or three times a week, and it's not academic for us: it decides whether a commissioned family gets approved, whether a variable font ships with a broken heavy end, whether we can legally call something a text face. We can't just say "does it look like an a," because we've all worked out that's circular — a single-storey Futura 'a', a double-storey Garamond 'a' and a blackletter 'a' share almost nothing as shapes and are all obviously a's, and meanwhile the exact same shape can be a Latin 'a' or a Cyrillic 'а' depending on which system it's doing a job in. (I keep thinking about that "Letter Spirit" chapter in Hofstadter's Fluid Concepts and Creative Analogies, the one about the essence of a letterform as something separable from its style, and honestly half the reason I'm writing is that I can't tell whether that's a thing we could actually use or just a nice metaphor.)

  What I want is a procedure, not an essay. Something the junior can run in about ten minutes with printouts and no theory background, in this order: the questions to ask, what counts as a passing answer to each, where the procedure stops with a no, and where it hands the decision to me because it's a question of taste or client negotiation rather than fact.

  Things it has to handle properly:

  - Three different ways a glyph can fail, kept apart: nobody can read it as an 'a' at all; it reads as an 'a' but collides with another letter in the same style (o, d, q, g — my hunch is that a letter's identity is partly relational, defined against the rest of the alphabet, so a glyph can be perfectly fine in isolation and still not be this alphabet's 'a'); and it reads fine but doesn't belong to the family, i.e. it looks like it was drawn by somebody else in a different style.
  - A deformation test: can we get from some canonical 'a' to this glyph by a continuous series of small steps where every intermediate still reads as an 'a'? Tell me which exemplar to start from, what breaks the path, and what to do when there's no path in one style but obviously is in another.
  - The homoglyph case, where shape and role come apart — one drawn form serving as two letters in two systems. What does the procedure say, and is there any case where it has to answer "both" or "neither"?
  - A fallback for when we can't afford real reader testing with actual users, which is most of the time, since we're four people and the budget is a joke.
  - Be upfront about which steps are judgment calls dressed up as procedure. I'd rather know than be comforted.

  Then run it on three of ours: (1) the heavy end of a variable text face where the counter of the 'a' has basically closed up at small sizes but looks deliberate and fine on a poster; (2) a client's bilingual brand asking for one shared glyph to be both Latin 'a' and Cyrillic 'а'; (3) our founder's "signature a," detached bowl with a swirl off the terminal, which is on all our marketing and which I have a bad feeling about. Give me the answer the procedure actually gives on that last one even if I won't like it.

  Finish with a one-page version I can paste into the studio handbook, and be clear about what the procedure can't tell us — whether the letter is any good, whether the family as a whole hangs together, and what to do when we're drawing for a script with no established reading comunity to appeal to.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Owner of a small type foundry (4 people: owner, 2 designers, 1 junior).
      *   **Problem:** Recurring conflict in design reviews: "Is that glyph still an 'a'?"
      *   **Constraints:** Needs a *procedure*, not an essay. Must be runnable by a junior in ~10 mins with printouts. No heavy theory background required.
      *   **Key Issues to Address:**
          1.  Three failure modes: Legibility (not an 'a'), Distinction (collides with o/d/q/g), Consistency (doesn't fit the family).
          2.  Deformation Test: Continuous transformation from canonical 'a'.
          3.  Homoglyphs: Latin 'a' vs. Cyrillic 'а' (same shape, different role).
          4.  Fallback: No budget for user testing.
          5.  Transparency: Admit where judgment calls are disguised as procedure.
      *   **Test Cases:**
          1.  Variable font heavy weight (counter closed).
          2.  Bilingual brand (shared Latin/Cyrillic 'a').
          3.  Founder's "signature a" (detached bowl, swirl).
      *   **Deliverables:** The procedure, the test case results, a one-page handbook version, and a limitations section.
      *   **Tone:** Professional, pragmatic, direct, acknowledging the complexity without getting bogged down in it.

  2.  **Deconstruct the Problem (The "Theory" behind the Procedure):**
      *   The user mentions Hofstadter. While I shouldn't write an essay on it, the core concept is *category membership*. A glyph is an 'a' if it belongs to the category 'a' within a specific context (typeface, script, language).
      *   *Legibility:* Can the eye parse the form?
      *   *Distinctiveness:* Is it distinct from neighbors in the set?
      *   *Consistency:* Does it match the DNA of the specific typeface?
      *   *Context:* A shape isn't an 'a' in a vacuum; it's an 'a' in a system.

  3.  **Drafting the Procedure (The "10-Minute Protocol"):**
      *   *Goal:* Step-by-step instructions.
      *   *Step 1: Isolation (Legibility).* Look at it alone.
      *   *Step 2: Context (Distinctiveness).* Look at it with neighbors.
      *   *Step 3: Family (Consistency).* Look at it with the rest of the font.
      *   *Step 4: Deformation (The Hofstadter check).* Mental morphing.
      *   *Step 5: Homoglyph Check.* Script context.
      *   *Decision Matrix:* Pass, Fail, Escalate.

      *Refining the Steps for a Junior:*
      *   Needs concrete actions. "Print this," "Cover that."
      *   Needs clear pass/fail criteria.
      *   Needs an "Escalation" point for subjective taste.

  4.  **Addressing Specific Requirements:**
      *   *Three Failure Modes:* Build these into Steps 1, 2, and 3.
      *   *Deformation Test:* Make it Step 4. Define the "Canonical Start" (e.g., a standard Humanist 'a' for text, Geometric for display). Define "Breaking Point" (counter closes, stem disappears).
      *   *Homoglyphs:* Step 5. Crucial distinction: Identity is functional, not just visual.
      *   *Fallback for Testing:* Use the "Squint Test" or "Distance Test" on printouts. It's a proxy for cognitive load.
      *   *Transparency:* Add a "Warning Label" section to the procedure.

  5.  **Running the Test Cases:**
      *   *Case 1 (Variable Heavy):* Counter closed.
          *   Step 1 (Legibility): At text sizes, fails (looks like 'o' or blob). At display sizes, passes.
          *   Step 2 (Context): In heavy weight, 'o' is also closed. Collision risk high.
          *   Verdict: Fail for text, Pass for display. Escalate for variable axis definition.
      *   *Case 2 (Bilingual Shared):* Latin 'a' + Cyrillic 'а'.
          *   Step 5 (Homoglyph): Shape is identical.
          *   Context: In Latin text, it's 'a'. In Cyrillic text, it's 'а'.
          *   Verdict: Pass as "Both" functionally, but flag encoding/OT features. It's a functional identity, not a visual one.
      *   *Case 3 (Signature 'a'):* Detached bowl, swirl.
          *   Step 1 (Legibility): Maybe passes as 'a' in isolation.
          *   Step 2 (Context): Does it look like 'd' or 'q' or '6'?
          *   Step 3 (Family): Does it match the rest of the commercial font? Likely no.
          *   Step 4 (Deformation): Can you morph a standard 'a' to this without breaking 'a'-ness? The detached bowl is a high-risk break point.
          *   Verdict: Fail as a text glyph. Pass as a logo/brand mark. Escalate: "This is a logo, not a font character."

  6.  **Drafting the One-Page Handbook:**
      *   Condense the procedure.
      *   Checklists.
      *   Clear "Stop/Go" signals.

  7.  **Drafting the Limitations:**
      *   What the procedure *can't* do: Aesthetics, cultural nuance, new scripts, "good" vs. "bad."

  8.  **Review and Refine:**
      *   *Tone Check:* Is it too academic? Keep it imperative. "Do this."
      *   *Hofstadter:* Acknowledge the "Fluid Concepts" reference but keep it practical. The "Deformation Test" is the practical application of that theory.
      *   *Junior Friendliness:* Avoid jargon like "glyphic variance" or "semiotic closure." Use "counter," "stem," "looks like."
      *   *Honesty:* Ensure the "Judgment Call" sections are highlighted.

      *(Self-Correction during drafting)*: I initially thought about suggesting specific reference fonts. Better to let them choose a "Reference Anchor" based on the project brief (e.g., "If this is a Humanist sans, use Frutiger 'a' as anchor").
      *(Self-Correction on Case 3)*: The user says they have a bad feeling. The procedure should validate that feeling without being mean. It should classify it as "Logo" not "Type."

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Procedure order? Yes.
      *   Passing answers? Yes.
      *   Stop points? Yes.
      *   Escalation points? Yes.
      *   3 Failure modes? Integrated.
      *   Deformation test? Included.
      *   Homoglyphs? Included.
      *   Fallback testing? Included (Squint/Distance).
      *   Transparency? Included.
      *   Test cases run? Yes.
      *   One-pager? Yes.
      *   Limitations? Yes.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the procedure, the test results, and the handbook page.

  ## The Protocol: Glyph Identity Verification (GIV)

  **Time:** 10 Minutes
  **Materials:** Printouts of the glyph at 3 sizes (6pt, 12pt, 72pt), printouts of the immediate alphabet context (n, o, d, q, u, e), a red marker, a green marker.
  **Operator:** Any team member.

  ### Phase 1: The Isolation Test (Legibility)
  *Goal: Detect Failure Mode 1 (Nobody reads it as 'a').*

  1.  **Action:** Place the 12pt printout of the single glyph on a white wall. Stand 2 meters away.
  2.  **Question:** If I asked you to "point to the 'a'" on this wall, would your hand move to this paper without hesitation?
  3.  **Pass:** Yes, immediate recognition.
  4.  **Fail:** You hesitate, or you say "it looks like an 'o'" or "a shape."
  5.  **Escalate:** If you recognize it as an 'a' but it feels "weird" or "angry." (This is taste, not identity).

  ### Phase 2: The Neighborhood Test (Distinctiveness)
  *Goal: Detect Failure Mode 2 (Collides with other letters).*

  1.  **Action:** Place the 12pt glyph in a string: `nan`, `dad`, `oao`, `qaq`.
  2.  **Question:** Scan the string at normal reading speed. Does the 'a' disappear into its neighbors?
  3.  **Pass:** The 'a' creates a distinct rhythm/break in the texture.
  4.  **Fail:** `oao` looks like three circles. `dad` looks like `clcl` or `eoe`.
  5.  **Escalate:** If the distinction relies entirely on context (e.g., it looks like an 'o' alone but works in `man`). **Stop.** This is a high-risk glyph. Escalate to Senior Designer.

  ### Phase 3: The Family Test (Consistency)
  *Goal: Detect Failure Mode 3 (Doesn't belong to the family).*

  1.  **Action:** Place the glyph next to the 'n', 'o', and 's' of the *same* font weight.
  2.  **Question:** If this glyph was found in a drawer without the rest of the font, could you correctly guess the weight and style of the 'n' and 'o' it belongs to?
  3.  **Pass:** The stroke contrast, terminal shape, and x-height align perfectly with the neighbors.
  4.  **Fail:** It looks like a different font pasted in (e.g., a humanist 'a' in a geometric sans).
  5.  **Escalate:** If it matches the style but breaks the construction logic (e.g., the 'o' is constructed from two strokes, the 'a' is drawn as one). Escalate to Foundry Owner.

  ### Phase 4: The Deformation Test (The Hofstadter Check)
  *Goal: Verify structural integrity via continuous transformation.*

  1.  **Action:** Select a **Reference Anchor**.
      *   *Text Face:* Use a standard Humanist 'a' (e.g., Frutiger/Verdana double-storey).
      *   *Display Face:* Use the dominant style of the font (e.g., if the font is geometric, use Futura 'a').
  2.  **Question:** Can you mentally morph the Reference Anchor into your Design Glyph in 5 small steps, where *every* intermediate step would still pass Phase 1?
  3.  **Pass:** Yes. The counter closes slowly; the tail extends gradually.
  4.  **Fail:** No. To get from Anchor to Design, you must make a "jump" where the letter temporarily becomes unreadable (e.g., the counter must close completely before the tail appears, creating a momentary 'o').
  5.  **Escalate:** If the path exists in the Bold weight but not the Regular. This indicates a broken variable axis. Escalate to Technical Lead.

  ### Phase 5: The System Check (Homoglyphs)
  *Goal: Resolve Shape vs. Role.*

  1.  **Action:** Identify the intended script system (Latin, Cyrillic, Greek).
  2.  **Question:** Is this shape serving a unique function in *this* specific text string?
  3.  **Pass:** In a Latin string, it functions as 'a'. In a Cyrillic string, it functions as 'а'.
  4.  **Fail:** The shape is used for 'a' in Latin and 'o' in Cyrillic within the same document.
  5.  **Escalate:** **The "Both" Case.** If one shape is encoded to serve as Latin 'a' AND Cyrillic 'а' (bilingual brand).
      *   *Procedure:* This is a **Functional Pass** but a **Technical Flag**. It is allowed *only* if the OpenType features or font naming clearly distinguish the systems. If the client wants one glyph to act as both simultaneously in mixed script text, **FAIL**.

  ### Decision Matrix

  *   **Fail Phase 1 or 2:** **REJECT.** Do not ship. This is a broken letter.
  *   **Fail Phase 3:** **REJECT** for general use. **ACCEPT** only as a discretionary ligature or alternate.
  *   **Fail Phase 4:** **ESCALATE.** This is a structural risk. Requires Senior review.
  *   **Fail Phase 5:** **REJECT.** Encoding conflict.
  *   **Any "Escalate" result:** Hand off to Foundry Owner. This is no longer fact; it is risk management.

  ***

  ## Transparency Note: Where This Is a Lie
  *Read this before running the protocol.*

  1.  **Phase 1 is subjective.** "Recognition" is cognitive, not visual. Your junior's brain is trained by the fonts you already sell. They are not a naive reader.
  2.  **Phase 4 is theoretical.** Hofstadter's "essence" cannot be measured. If the junior says "I can't see the path," they might just lack imagination. If the Senior says "I see the path," they might be hallucinating continuity to save a favorite design.
  3.  **Phase 5 ignores culture.** A shape might be an 'a' in New York and a 'd' in Berlin. This procedure assumes a standard Western reading context. It will fail for new scripts or highly localized designs.
  4.  **It does not measure quality.** A glyph can pass all five phases and still be ugly, boring, or inappropriate for the client's brand. This procedure tests *identity*, not *merit*.

  ***

  ## Test Case Results

  Here is the output of the GIV Protocol on your three specific problems.

  ### Case 1: Variable Text Face (Heavy End, Closed Counter)
  *   **Phase 1 (Isolation):** **FAIL** at 12pt. At 6pt (text size), the closed counter makes it indistinguishable from a closed 'o' or a blob. At 72pt (poster), it **PASSES**.
  *   **Phase 2 (Neighborhood):** **FAIL.** In `nano`, the 'a' and 'o' are identical shapes at text sizes.
  *   **Phase 4 (Deformation):** **FAIL.** To morph from a standard double-storey 'a' to this closed shape, the counter must close. At the moment of closure (before the weight compensates), the glyph reads as 'o'. The path is broken.
  *   **Verdict:** **REJECT for Text.** **ACCEPT for Display.**
  *   **Action:** You must cut the variable axis. The 'a' cannot interpolate continuously from Light to Black if the Black form closes the counter. You need two masters with a stylistic set swap, or you must redesign the Black weight to keep the counter open.

  ### Case 2: Bilingual Brand (Shared Latin 'a' / Cyrillic 'а')
  *   **Phase 1 (Isolation):** **PASS.** It looks like an 'a'.
  *   **Phase 5 (System):** **PASS (Conditional).**
      *   *Condition:* It is Latin 'a' in Latin strings. It is Cyrillic 'а' in Cyrillic strings.
      *   *Constraint:* It cannot be used in a mixed-script string where distinction is required (rare, but possible).
  *   **Verdict:** **PASS.**
  *   **Action:** This is a functional identity, not a visual one. The procedure validates this. Ensure your font naming table (`nameID`) and OpenType script tags are rigorous. The glyph is "both" because the *encoding* says so, not because the shape dictates it.

  ### Case 3: Founder's "Signature A" (Detached Bowl, Swirl)
  *   **Phase 1 (Isolation):** **PASS** (at 72pt). **FAIL** (at 12pt). At text sizes, the detached bowl reads as a separate accent or dirt.
  *   **Phase 2 (Neighborhood):** **FAIL.** In `dad`, the detached bowl of the 'a' collides visually with the ascender of the 'd'. The swirl mimics a 'q' tail.
  *   **Phase 3 (Family):** **FAIL.** Unless your entire foundry style is "swirly detached," this glyph does not match the construction of your commercial text faces.
  *   **Phase 4 (Deformation):** **FAIL.** There is no continuous path from a standard 'a' to a detached bowl without a moment where the letter breaks into two unconnected pieces (which ceases to be a single glyph).
  *   **Verdict:** **REJECT as a Font Glyph.**
  *   **Action:** This is a **Logo**, not a letter. You can ship it as a `.svg` in the font for headline use *only* if tagged as a Titling Alternate, but it cannot be the default codepoint U+0061. If you ship this as the default 'a' in a text face, you are selling a broken tool. Your bad feeling is correct.

  ***

  ## Handbook Page: Glyph Identity Check

  **Copy and paste this into your studio wiki.**

  ### 🛑 GLYPH IDENTITY CHECK (GIV)
  **Who:** Any Designer | **Time:** 10 Mins | **Tools:** Printouts (6pt, 12pt, 72pt)

  **1. THE WALL TEST (Legibility)**
  *   [ ] Print glyph at 12pt. Stick on wall. Stand 2m back.
  *   [ ] **Q:** Is it instantly an 'a'?
  *   [ ] **NO:** 🛑 **STOP.** Reject glyph.
  *   [ ] **YES:** Continue.

  **2. THE NEIGHBOR TEST (Collision)**
  *   [ ] Print glyph in strings: `nan`, `oao`, `dad`.
  *   [ ] **Q:** Does 'a' vanish into 'o' or 'd'?
  *   [ ] **YES:** 🛑 **STOP.** Reject glyph (Collision Risk).
  *   [ ] **NO:** Continue.

  **3. THE FAMILY TEST (Consistency)**
  *   [ ] Place next to 'n', 'o', 's' of same weight.
  *   [ ] **Q:** Does it look like it was drawn by the same hand?
  *   [ ] **NO:** ⚠️ **ESCALATE.** Senior Designer decision (Style vs. Standard).
  *   [ ] **YES:** Continue.

  **4. THE MORPH TEST (Structure)**
  *   [ ] Pick a standard 'a' (Reference).
  *   [ ] **Q:** Can you mentally morph Reference → Design in 5 steps without it ever looking like an 'o' or breaking apart?
  *   [ ] **NO:** ⚠️ **ESCALATE.** Foundry Owner decision (Structural Risk).
  *   [ ] **YES:** Continue.

  **5. THE SCRIPT TEST (Role)**
  *   [ ] **Q:** Is this shape used for two different letters in the same document?
  *   [ ] **YES:** 🛑 **STOP.** Encoding conflict.
  *   [ ] **NO:** ✅ **PASS.**

  **🟢 PASS:** Ready for QA.
  **🟠 ESCALATE:** Risk accepted by Senior/Owner.
  **🔴 FAIL:** Redraw.

  ***

  ## Limitations: What This Procedure Cannot Tell You

  1.  **Quality:** A glyph can pass GIV and still be ugly. This checks if it *is* an 'a', not if it is a *good* 'a'.
  2.  **Cohesion:** This tests one glyph. It does not tell you if the *italic* matches the *roman*, or if the *bold* is too heavy for the *light*. That requires a holistic review.
  3.  **New Scripts:** If you are designing for a script with no established reading community (e.g., a constructed language or a revitalized historical script with no modern readers), Phase 1 and 2 are invalid. You cannot test legibility against a norm that doesn't exist. In that case, GIV is suspended; identity is defined solely by the client's specification.
  4.  **The "Soul" of the Font:** This procedure is mechanistic. It will not tell you if the font has voice, character, or emotional resonance. It ensures the engine runs; it does not guarantee the car is beautiful.
