answer: |-
  At Hisarlik, beneath the ancient mound,
  A broken sword remembers only fire.
  The river will not stay within its bed,
  But shifts like memory through the silt and sand.
  We find a name scratched out of stone again,
  As if the gods erased the hero's line.
  This dust that might be ashes or be nothing,
  Falls soft upon the armor of the dead.
  There is a silence where a voice should be,
  And proof that turns out to weigh nothing now.

  Upon the isle where Avalon once stood,
  We lift a broken sword from watery grave.
  The river will not stay within its bed,
  But drowns the myth in cold and rising tide.
  We read a name scratched out of stone by monks,
  To claim the king belongs to history.
  This dust that might be ashes or be nothing,
  Coats the altar where the grail was sought.
  There is a silence where a voice should be,
  And proof that turns out to weigh nothing here.

  In Sinai the wind moves only sand,
  No broken sword distinguishes the slave.
  The river will not stay within its bed,
  It is geology, and not a path.
  We trace a name scratched out of stone by time,
  Upon the black stone where the tribes are named.
  This dust that might be ashes or be nothing,
  Is merely erosion on the sand.
  The silence where a voice should be is air,
  We sought proof that turns out to weigh nothing.
