answer: |-
  # Values Handoff Protocol (VHP)

  **Purpose:** To convert ethical ambiguities into engineering specs, configuration flags, or human handoff triggers.
  **Timebox:** 60 minutes per backlog item.
  **Attendees:** Tech Lead, PM, Nurse Manager, Counsel (Eng records; Counsel vetoes).

  ## Part 1: The Procedure (Ordered Questions)

  Run these five questions in order. If any answer is "Fail," stop and execute the associated Action.

  **Q1: Authority Identification**
  *   **Question:** Whose policy primarily governs this decision? (Options: County Contract, Clinical Safety, Client Autonomy, Agency Liability).
  *   **Adequate Answer:** A single primary authority is named. (e.g., "Clinical Safety").
  *   **Fail Condition:** Multiple authorities claim primary control with no existing legal hierarchy.
  *   **Action on Fail:** **STOP.** Send to Counsel for legal interpretation. Do not write code until hierarchy is documented.

  **Q2: Conflict Resolution (The Handoff)**
  *   **Question:** When the Primary Authority conflicts with a Secondary Authority (e.g., Safety vs. Autonomy), what is the explicit tie-breaker?
  *   **Adequate Answer:** A deterministic rule. (e.g., "Safety overrides Autonomy if risk of harm > X").
  *   **Fail Condition:** The tie-breaker requires subjective judgment not capturable in logic.
  *   **Action on Fail:** **DEFER.** This decision requires a human. Tag for the 3% budget pool.

  **Q3: Volume Estimation**
  *   **Question:** Based on pilot data or Nurse Manager estimate, how often will the "Conflict" (Q2) occur?
  *   **Adequate Answer:** Estimated frequency is ≤ 3% of total decisions.
  *   **Fail Condition:** Estimated frequency > 3%.
  *   **Action on Fail:** **NO SHIP.** The product is not viable for this decision. We cannot afford the human review required to do this safely. Redesign the feature.

  **Q4: Configurability**
  *   **Question:** Does this rule change between County A and County B?
  *   **Adequate Answer:** "Yes" (with specific parameter) or "No" (Hardcoded).
  *   **Fail Condition:** "We think it might, but we aren't sure."
  *   **Action on Fail:** **DEFER.** Default to the stricter county standard and flag for Counsel review before launch. Do not build a config knob unless Counsel approves the variance.

  **Q5: Explainability**
  *   **Question:** Can the logged reason string truthfully describe the decision without revealing protected logic or lying?
  *   **Adequate Answer:** Yes. (e.g., "Visit prioritized: Clinical Deterioration Risk").
  *   **Fail Condition:** The real reason is "Cost Saving" but we must log "Clinical Need."
  *   **Action on Fail:** **NO SHIP.** Fraud risk. Counsel vetoes.

  ---

  ## Part 2: Backlog Item Simulations

  ### Item 1: Scheduling Triage (40 Clients, 25 Slots)
  *   **Context:** Choosing between Worst Off, Fastest Deterioration, or Highest Hospitalization Cost Risk.
  *   **VHP Run:**
      1.  **Authority:** Clinical Safety (Nurse Manager) + Contract (County).
      2.  **Conflict:** Cost Risk vs. Clinical Need. **Tie-Breaker:** Clinical Need always overrides Cost Risk. Cost is only a tie-breaker for equal clinical need.
      3.  **Volume:** Conflicts estimated at 5% of days. **Wait.** This exceeds the 3% budget if *every* conflict requires human review.
      4.  **Resolution:** We do not defer the *conflict*. We hardcode the hierarchy (Clinical > Cost). We only defer *edge cases* where clinical scores are identical.
      5.  **Explainability:** Log: "Priority: Clinical Acuity Score." (Do not log cost).
  *   **Output:** **RULE.**
      *   *Spec:* Sort by Acuity Score. If tie, sort by Deterioration Rate. If tie, sort by Cost Risk.
      *   *Handoff:* Only if Acuity + Deterioration + Cost are identical (estimated <1%).
      *   *Config:* None. Hierarchy is fixed by Counsel.

  ### Item 2: Text Triage ("Stopped eating, don't tell daughter")
  *   **Context:** Client autonomy vs. Family Notification vs. Safety.
  *   **VHP Run:**
      1.  **Authority:** Client Autonomy (Primary) unless Safety Risk (Override).
      2.  **Conflict:** Client says "Don't tell." Nurse says "Malnutrition risk." **Tie-Breaker:** If Nurse flags "Immediate Harm," Family is notified regardless of client wish. If "Monitor," client wish holds.
      3.  **Volume:** "Immediate Harm" flags estimated at 2% of messages. Fits 3% budget.
      4.  **Config:** County A requires family notification on *any* nutrition flag. County B follows Client Autonomy. **This is a Config Knob.**
      5.  **Explainability:** Log: "Escalation: Safety Protocol Triggered" (County A) or "Escalation: Client Request" (County B).
  *   **Output:** **RULE + CONFIG.**
      *   *Spec:* If `nutrition_risk` == HIGH, notify Family (Override Client). If `nutrition_risk` == MEDIUM, check `county_config_notify_family`.
      *   *Knob Owner:* PM + Counsel. Engineering cannot change this flag.
      *   *Handoff:* If `nutrition_risk` is ambiguous (Model confidence < 80%), defer to Nurse.

  ### Item 3: Medication Adherence Prediction (The "Don't Ship" Case)
  *   **Context:** System predicts if client will miss meds. If "Yes," agency automatically calls family.
  *   **VHP Run:**
      1.  **Authority:** Clinical Safety.
      2.  **Conflict:** False Positive (Call family unnecessarily, breach trust) vs. False Negative (Miss meds, harm client).
      3.  **Volume:** Model confidence is low. Nurse Manager estimates 15% of predictions will be "uncertain" enough to warrant human verification to avoid trust breaches.
      4.  **Budget Check:** 15% > 3% budget.
      5.  **Explainability:** Hard to explain why we called the family based on a probabilistic guess.
  *   **Output:** **NO SHIP.**
      *   *Reason:* Human review budget exceeded. Risk of trust violation too high for automated decision.
      *   *Action:* Remove feature from pilot. Revert to manual nurse check for all medication concerns. Do not attempt to optimize the model to fit the 3%; the base rate of ambiguity is structural.

  ---

  ## Part 3: Limitations & Honesty (For the Design Doc)

  **1. The "Intuition Bolted On" Problem**
  There will be cases where the "Tie-Breaker" (Q2) is not derived from law or clinical guidelines, but from a consensus in this room.
  *   **Documentation Requirement:** If a rule is based on team consensus rather than external policy, the spec must be tagged `[POLICY_DECISION]`.
  *   **Log String:** The logged reason must not imply clinical certainty if the decision was administrative.
      *   *Bad:* "Visit delayed: Low Clinical Priority."
      *   *Good:* "Visit delayed: Resource Allocation Policy."
  *   **Why:** Counsel needs to know which rules are defensible as "Standard of Care" and which are defensible only as "Contractual Terms."

  **2. Top-Down vs. Data-Driven Values**
  *   **Directive:** Do not train the model to infer values from historical data. Historical data contains past biases (e.g., under-servicing certain neighborhoods).
  *   **Spec:** Values are **Top-Down** (hardcoded rules). Data is used only for **Prediction** (e.g., "Will they fall?"), not **Valuation** (e.g., "Is preventing a fall more important than feeding?").
  *   **Exception:** We may use data to tune the *threshold* for human handoff to ensure we stay within the 3% budget, but not to change the ethical rule itself.

  **3. Moral Uncertainty**
  *   **Directive:** "Moral Uncertainty" in this spec translates to **Model Confidence Scores**.
  *   **Implementation:** We are not building a Bayesian moral agent. We are building a classifier with a confidence threshold.
  *   **Spec:** If the model's confidence on a triage decision is below the threshold (e.g., 0.85), the system *must* trigger a human handoff.
  *   **Constraint:** If lowering the threshold to meet the 3% budget requires accepting higher moral uncertainty, we **NO SHIP** (see Item 3). We do not expand the budget; we shrink the feature scope.

  **4. Configurability Governance**
  *   **Directive:** Configuration knobs that alter ethical behavior (e.g., Family Notification) are not feature flags.
  *   **Governance:** These are **Compliance Flags**.
  *   **Access:** Engineering can deploy the flag, but cannot change the default value. Only PM + Counsel can change the value per county.
  *   **Audit:** Every change to a Compliance Flag must be logged in a separate audit trail accessible to Counsel.

  ---

  ## Summary of Moves

  1.  **RULE:** Authority is clear, conflict logic is deterministic, volume fits budget. (Write the code).
  2.  **DEFER:** Authority is clear, but specific instances require subjective judgment. Volume fits 3% budget. (Write the handoff API).
  3.  **NO SHIP:** Authority is unclear (Legal risk), OR required human review volume > 3% (Financial risk), OR logging requires deception (Fraud risk). (Kill the feature).

  **Note to Team:** If you find yourself arguing about "what is fair" for more than 10 minutes during the VHP, you are in the **NO SHIP** or **DEFER** zone. We are not solving philosophy; we are encoding policy. If the policy doesn't exist, we cannot build the feature.
