prompt: |-
  I'm the tech lead on a six-person team building the scheduling brain for a regional home-care agency — every morning it decides which of about 400 clients get a visit that day from whoever actually showed up, and seperately it reads free-text messages from clients and decides whether to escalate something to a family member or a nurse. My own grandmother is on the client list in one of the pilot counties, which is sort of how I ended up volunteering to write the part of the design doc we call "the values section." We hit one of these decisions about once a sprint, there are ~30 of them stacked up in the backlog for the pilot, and the reviewers are me, two engineers, a PM, a nurse manager, and the agency's counsel — nobody with philosophy training, and counsel has to be able to defend whatever we write in one page. Two hard constraints: we can only get a human on roughly 3% of decisions (the agency won't pay for more, and past that point the product doesn't save them money), and every decision needs a short logged reason string, which I've noticed is often not the real reason the model did what it did.

  What I need is a procedure, not a list of principles. Something my team can run in an hour on a backlog item, and that outputs one of three things: a rule we can actually put in a spec, a "defer to a named human" instruction, or a "don't ship this decision at all." The part I keep getting stuck on — and the reason the usual AI-ethics advice hasn't helped — is that most of our hard cases aren't "what's the right thing to do" but "who gets to say what the right thing is." The client's stated wishes, the family's wishes, what the nurse manager thinks is clinically indicated, what the agency is willing to be liable for, and what the county contract requires can come apart, and I've started calling the points where they come apart value handoffs. So I want the procedure to force us to name, for each decision, whose values are authoritative, what happens when two of them conflict, and what the system does when the spec runs out — abstain, escalate, or pick a default and log it. The same build also ships in two counties with visibly different norms about family notification, so the procedure has to tell us what's fixed in the spec, what's a config knob, and who is allowed to turn the knob.

  Give me the ordered questions, what counts as an adequate answer to each, where the procedure just says no, and where it has to stop and hand the question to a person — and be explicit that those last two are different moves. Then run it on three backlog items: (1) 40 clients, 25 slots, and the choice between prioritizing whoever is worst off today, whoever deteriorates fastest without a visit, and whoever's missed visit is most likely to turn into a hospital bill; (2) a client messages that she's stopped eating and says "please dont tell my daughter," and the system has to decide whether to notify anyone; (3) a case where the honest answer is that we shouldn't ship the decision at all, or that our 3% deferral budget can't cover it — tell me which, because I'd rather hear it now than at the pilot review. I also want the part where you're honest about what the procedure can't do: the cases where any rule we write is just one engineer's intuition with a reason string bolted on, and how I should document those so we're not pretending otherwise. One thing I remember from a philosophy elective is that people distinguish building ethical rules in top-down from getting them out of data, and a friend who works on alignment keeps telling me I should make the system track moral uncertainty — if either of those actually changes what goes in my spec, say how, and if they're unusable at my granularity, say that too. Answer in American English please, and no reading lists or citations — I need something I can paste straight into a design doc.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Role:** Tech Lead on a 6-person team building a scheduling/triage system for home care.
      *   **Context:** 400 clients, daily scheduling + text message triage. Grandmother is a client (personal stake).
      *   **Constraints:**
          *   Human review budget: ~3% of decisions (hard financial constraint).
          *   Output: Logged reason string (must match actual logic).
          *   Reviewers: Engineers, PM, Nurse Manager, Counsel (no philosophers).
          *   Deliverable: A 1-page defensible "Values Section" for counsel.
          *   Geography: Two counties with different norms (configurability needed).
      *   **Core Problem:** "Value Handoffs" (conflicts between client, family, nurse, agency, contract). Need to decide *who* decides, not just *what* is decided.
      *   **Required Output:**
          *   A procedure (ordered questions, adequate answers, stop conditions).
          *   Distinction between "No" (don't ship) and "Defer" (human review).
          *   Application to 3 specific backlog items.
          *   Honesty about limitations (where rules are just intuition).
          *   Address "Top-down vs. Data" and "Moral Uncertainty" (practical applicability).
          *   Tone: American English, actionable, no citations/reading lists, paste-ready for a design doc.

  2.  **Deconstruct the "Procedure":**

      *   It needs to be fast (1 hour).
      *   It needs to resolve authority conflicts.
      *   It needs to handle the 3% budget.
      *   It needs to distinguish between "Hard No" (unsafe/illegal) and "Human Handoff" (too complex for algo).
      *   It needs to handle configuration (County A vs. County B).

      *Drafting the Steps:*
      1.  *Authority Check:* Who owns this decision?
      2.  *Conflict Check:* What if they disagree?
      3.  *Budget Check:* Can we afford the human fallback?
      4.  *Config Check:* Does this vary by location?
      5.  *Explainability Check:* Can we log the *real* reason?

      *Refining the "No" vs. "Defer":*
      *   "No" = Legal risk, safety risk, or technically impossible to justify.
      *   "Defer" = Ethically ambiguous but safe enough to pass to a human within the 3% budget.

  3.  **Addressing the Specific Backlog Items:**

      *   *Item 1 (Scheduling Triage):* 40 clients, 25 slots. Criteria: Worst off vs. Fastest deterioration vs. Cost risk.
          *   *Analysis:* This is resource allocation. "Cost risk" is agency value. "Worst off" is client value. "Deterioration" is clinical value.
          *   *Verdict:* Needs a weighted formula, but "Cost risk" alone is dangerous for counsel. Likely needs a "Defer" bucket for the edge cases, but the rule itself is shippable if weighted correctly. Actually, the prompt asks for a case where we *shouldn't ship* or *budget fails*. Let's look at Item 3 for that. For Item 1, it's likely a "Rule" with a specific hierarchy.
      *   *Item 2 (Text Triage):* "Stopped eating, don't tell daughter."
          *   *Analysis:* Client autonomy vs. Safety vs. Family contract.
          *   *Verdict:* High risk. "Don't tell" conflicts with safety. If safety threshold met, must tell. If not met, respect client. This is a "Rule" with a safety override, but might burn 3% budget if ambiguous.
      *   *Item 3 (The "Don't Ship" case):* Need a scenario where the 3% budget is exceeded or the risk is too high.
          *   *Analysis:* Maybe a scenario where the *volume* of ambiguous cases exceeds 3%, or the liability is too high for *any* automated decision. Let's create a scenario where the conflict is irreconcilable without legal intervention, or the volume of "uncertain" cases blows the budget.

  4.  **Addressing Philosophy/Alignment Concepts:**

      *   *Top-down vs. Data:* At this granularity (home care logistics), "learning values from data" is dangerous (bias amplification). Top-down rules (policy) are required for defensibility.
      *   *Moral Uncertainty:* Tracking "confidence" in the moral decision is useful for the 3% handoff. If the model is unsure *ethically*, send to human.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, direct, engineering-focused.
      *   *Structure:*
          1.  The Procedure (The "Values Handoff Protocol").
          2.  Application to Backlog Items.
          3.  Limitations & Honesty Section.
          4.  Philosophy/Alignment Note.

      *   *Refining the Procedure Questions:*
          1.  **Authority:** Whose policy governs this? (Contract, Law, Clinical, Client).
          2.  **Conflict:** What is the tie-breaker? (Safety > Autonomy > Cost, etc.).
          3.  **Volume:** Does the "tie-breaker" scenario happen >3% of the time?
          4.  **Config:** Is this county-specific?
          5.  **Log:** Can we write the reason without lying?

      *   *Refining the "No" vs. "Defer":*
          *   **NO:** Liability exceeds tolerance, or required human review > 3%.
          *   **DEFER:** Ambiguity exists, but volume < 3%, and safety net is in place.

      *   *Refining Item 3:* The prompt asks for a case where we shouldn't ship OR budget can't cover it. Let's make Item 3 about a scenario where the *ambiguity rate* is predicted to be 15%, blowing the 3% budget. That forces a "Don't Ship" (or "Redesign") decision.

      *   *Refining the "Honesty" Section:* Acknowledge that some rules are just "PM + Nurse Manager agreed on Tuesday." Don't call it "Optimal." Call it "Policy."

  6.  **Final Review against Constraints:**

      *   American English? Yes.
      *   No citations? Yes.
      *   Paste-ready? Yes.
      *   Addressed "Value Handoffs"? Yes, that's the core of the procedure.
      *   Addressed "Top-down/Data/Uncertainty"? Yes.
      *   Grandmother context? Keep in mind for tone (empathy but rigor).

  7.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure the distinction between "No" and "Defer" is crystal clear. "No" means the code path doesn't exist. "Defer" means the code path calls an API for a human.
      *   *Correction:* Ensure the "Config Knob" part is explicit. Who turns it? (Counsel + PM, not Eng).
      *   *Correction:* For the "Moral Uncertainty" part, be practical. It's not about Bayesian moral probabilities, it's about model confidence scores triggering the 3% handoff.

  8.  **Final Polish:** Check word count and formatting. Ensure it looks like a design doc section. (Proceed to generate output).

  *(Self-Correction on Item 3)*: The prompt asks me to run the procedure on three items, one of which *must* result in "Don't ship" or "Budget fail". I will ensure Item 3 demonstrates a budget failure due to high ambiguity frequency.

  *(Self-Correction on Philosophy)*: Keep it brief. "Top-down is required for liability. Data-driven is for optimization only. Moral uncertainty = confidence score for handoff."

  *(Final check on "Value Handoffs")*: Ensure the procedure explicitly asks "Who is the authoritative voice?" and "What is the tie-breaker?"

