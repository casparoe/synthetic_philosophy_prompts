answer: |-
  ### I. The Clinical Restatement of the Dirty Hands Thesis

  **The Thesis of Constitutive Moral Injury in Stewardship**

  In the context of high-acuity stewardship, the attending physician is structurally situated to face conflicts in which the Standard of Care requires the violation of the Duty of Veracity or the Duty of Non-Abandonment. This is not a failure of clinical judgment but a constitutive feature of the fiduciary role under conditions of systemic scarcity.

  First, regarding **therapeutic privilege**, the steward may determine that full disclosure of prognosis to the patient-surrogate dyad would precipitate physiological decompensation or impede compliance with a life-saving regimen. To fulfill the obligation of beneficence toward the biological whole, the steward must intentionally withhold truth, thereby committing an epistemic wrong against the principle of autonomy. This deception is not incidental; it is mandated by the asymmetry of knowledge required to maintain homeostasis.

  Second, under protocols of **emergency surgical triage**, the steward must allocate finite life-support resources among a collective of patients exceeding capacity. The right course of action—maximizing aggregate survival rates—requires the active withdrawal or withholding of intervention from salvageable individuals. This constitutes a direct violation of the commitment to advocate for the individual patient currently under care. The steward must effectively sentence one patient to death to secure the viability of the ward.

  Third, invoking the **principle of double effect as applied to resource-rationing decisions**, the steward intends the good of collective survival while foreseeing, but not intending, the mortality of the rationed. However, the structural position of the steward ensures that the foreseen bad effect (death by neglect) is the necessary causal mechanism for the good effect (ward stability). The moral remainder—guilt, moral distress, or the stain on professional integrity—is not a sign of error but evidence that the steward has correctly inhabited the role. The "clean hands" of the technician who refuses to triage are the hands of one who has abandoned the fiduciary responsibility to the collective body. Thus, moral injury is partly constitutive of the role of the attending in crisis; to lead the ward is to bear the burden of necessary harm.

  ***

  ### II. Residue Report

  This report analyzes the fidelity of the translation above, categorizing structural elements of the political "Dirty Hands" problem by their clinical translatability.

  #### A. Precise Analogues
  *These elements map cleanly between political and clinical frameworks.*

  1.  **The Fiduciary Burden:** The political agent's duty to the "public good" maps precisely to the physician's duty to the "physiological stability of the ward." In both cases, the agent is not acting for themselves but as a steward for a vulnerable entity that cannot act for itself in the moment of crisis.
  2.  **The Tragic Choice (Zero-Sum Scarcity):** The logic of **emergency surgical triage** is isomorphic to wartime or crisis politics. The decision to let one die to save many is structurally identical to sacrificing a battalion to save a division. The mathematical utilitarianism required is the same.
  3.  **The Moral Remainder:** The concept of "moral distress" in nursing and medicine serves as a precise analogue to political guilt. In both fields, the agent acknowledges that while the action was *necessary*, it remains *wrong* in a prima facie sense. The emotional and psychological cost is a recognized occupational hazard in both high-stakes environments.

  #### B. Strained Metaphors
  *These elements map only through significant conceptual abstraction.*

  1.  **Therapeutic Privilege vs. State Secrecy:** Mapping political classification or deception to **therapeutic privilege** is strained. Therapeutic privilege is theoretically grounded in the specific psychological vulnerability of a *sick* patient. Political secrecy is often grounded in strategic advantage against *adversaries*, not merely protecting the "health" of the citizenry. The citizen is a principal, not a patient; treating them as psychologically incapable of handling truth is a more aggressive paternalism than clinical privilege allows.
  2.  **The "Health" of the Polity:** The translation relies on the metaphor that the State has a "physiology" that can be stabilized. While systems theory supports this, the teleology of a state (justice, liberty, order) is normative and contested, whereas the teleology of medicine (life, function) is biologically grounded. Defining what constitutes "stability" in politics is inherently partisan; defining it in trauma care is largely objective.
  3.  **Double Effect in Rationing:** In clinical rationing, the death of the patient is a *side effect* of saving resources for others. In politics, the "wrong" (e.g., torture, assassination, coercion) is often the *means*, not merely the side effect. Applying **double effect** here strains the doctrine, as political dirty hands often involve intending the violation (e.g., breaking a treaty) to achieve the end, rather than merely foreseeing it.

  #### C. No Clinical Counterpart
  *These elements of political dirty hands have no analogue in clinical ethics.*

  1.  **Democratic Authorization:** The political agent acts on a mandate derived from the consent of the governed (elections, constitutions). The physician acts on a license derived from professional boards and the immediate consent of the patient. There is no clinical equivalent to the "public mandate" that legitimizes a physician to sacrifice one patient for the neighborhood.
  2.  **The Monopoly on Coercion:** The core of political dirty hands often involves *active coercion* (imprisonment, state violence, taxation). Clinical ethics is fundamentally non-coercive; a physician cannot physically force a treatment (except in narrow, immediate life-saving exceptions where capacity is lost). The "wrong" in politics is often the infliction of pain; the "wrong" in medicine is the withholding of care or truth.
  3.  **The Adversarial External Environment:** Politics operates in an anarchic international system with hostile agents. Medicine operates within a regulated institution where the "enemy" is pathology, not an opposing moral agent. The political dirty hands problem often arises from the need to defeat an enemy; the clinical problem arises from defeating a disease.

  ***

  ### III. Philosophical Position on the Untranslatable Residue

  The untranslatable residue indicates that **the political formulation of "Dirty Hands" relies on distinctions that become obscure when stripped of their institutional context**, specifically the context of sovereignty and coercion.

  It is not that medical ethics is conceptually impoverished relative to political morality. Rather, medical ethics is *bounded* by the therapeutic aim, which intentionally excludes the legitimate use of violence and coercion. The "Dirty Hands" problem in politics is not merely about making hard choices (which medicine also does); it is about the **legitimization of moral violation as an instrument of rule**.

  When we translate politics into medicine, we sanitize the coercion. We turn "killing an enemy combatant" into "triaging a non-salvageable patient." This translation fails because the combatant is not physiologically doomed; they are politically opposed. The residue (Democratic Authorization, Coercion, Adversariality) reveals that political dirty hands is fundamentally a problem of *power over others*, whereas clinical dirty hands is a problem of *stewardship over biology*.

  Therefore, the political formulation becomes obscure when treated through a medical lens because it attempts to frame the exercise of sovereign violence as a form of healing. The "dirt" on the politician's hands is not the stain of tragic necessity (which the surgeon also bears); it is the blood of the neighbor whom the politician had the authority to harm for the sake of order. Medical ethics cannot capture this because its institutional context is designed precisely to prevent the physician from ever having that kind of authority. The residue does not show medicine is lacking; it shows that politics, unlike medicine, is inherently entangled with the legitimate infliction of harm, not just the mitigation of suffering.
