prompt: |-
  I'm a clinical psychologist who works primarily with addiction recovery, and the conceptual vocabulary I actually think in is drawn from reinforcement learning and affective neuroscience: reward prediction errors, dopaminergic signaling, incentive salience versus hedonic impact, extinction bursts, cue-reactivity, tolerance, anhedonia, and the clinical observation that patients often pursue substances not because they produce pleasure but because their reward system generates a mispredicted wanting that is decoupled from liking. I want you to take Robert Nozick's experience-machine thought experiment and the three main families of well-being theory it is usually deployed against—hedonism, desire-satisfaction accounts, and objective-list theories—and restate the entire debate in the vocabulary I have just described, treating philosophical terms only as targets for translation rather than as permitted terms of art.

  For each of the three theories, provide a faithful translation: show what it looks like when well-being is understood as the optimization of positive reward-prediction errors, or as the satisfaction of incentive-salient goals regardless of hedonic payoff, or as the presence of objective goods analogized to stable environmental conditions that maintain homeostatic set-points. Then give the residue report: which claims survive intact, which require distortion to fit the clinical framework (for instance, does the choice to enter the machine map onto a patient's decision between cue-exposure therapy and pharmacological suppression of craving?), and which claims have no counterpart at all—particularly Nozick's intuition that there is value in being genuinely connected to reality rather than merely experiencing a simulation. Is that residue a genuine gap in my vocabulary, perhaps a normative dimension that clinical models omit, or does it dissolve once we distinguish incentive salience from well-being?

  Finally, inject a modified parameter into the machine itself: imagine the device does not merely deliver pleasure but offers precise, user-controlled calibration of prediction-error magnitude—settings that deliver rewards with zero error (pure liking without any wanting), large positive errors (intense craving followed by satisfaction), or controlled negative errors (extinction trials). Would a rational agent in recovery choose a setting that eliminates all prediction error, thereby ending craving but also removing the dopaminergic signature of reward? Tell me whether introducing this dial resolves the philosophical disagreement or merely reveals that the original debate was missing a parameter that my clinical vocabulary was already tracking.
