      *   *Constraint Check:* Is $V$ opening an "alternative cause"? It's part of the same system. It's not a "backup pump" (which sounds like preemption). It's a "valve state". This feels safe.
      *   *Constraint Check:* "No omissions". $V$ being Closed is a state, not an absence. $P$ being High is a state.
