answer: |-
  This is a profound set of cases. You have correctly identified that the physical locus of the intervention (touching the sensor vs. touching the code vs. touching the principal) is not the fundamental distinction. Your "Tracking Test" is a strong start because it focuses on the *informational relationship* between the reward and the value. However, as you suspected, it fractures on the epistemic pair (8 vs. 9) and requires careful handling of the sampling cases (7 vs. 10).

  Below is the work you requested: three candidate principles, a stress test against your ten verdicts, a recommended synthesis, and an analysis of the boundaries.

  ### Part 1: Candidate Principles

  I will propose three principles. The first is a formalization of your intuition. The second focuses on the agent's epistemic relationship to the evaluator. The third is the synthesis I will recommend.

  **Candidate 1: The Mutual Information Maxim (Refined Tracking Test)**
  *Principle:* An intervention is corrupt if and only if the agent's policy reduces the mutual information $I(R; V)$ between the reward signal $R$ and the designer's true latent value $V$, relative to a baseline policy, evaluated over the deployment distribution.
  *Intuition:* This formalizes your "counterfactual dependence." It allows Case 4 (recalibration increases $I(R; V)$) and bans Case 3 (covering sensor decreases $I(R; V)$).
  *Fatal Flaw:* It cannot distinguish Case 8 from Case 9. In both cases, the definition of $V$ changes. If the Principal changes their mind, $V_{new}$ is the new truth. In both 8 and 9, $R$ tracks $V_{new}$ perfectly. The mutual information is high in both. The test fails to capture *how* $V$ changed.

  **Candidate 2: The Epistemic Control Principle**
  *Principle:* An intervention is corrupt if and only if the agent causally influences the reward signal by manipulating the *beliefs* or *states* of the evaluator (human or sensor) rather than by changing the *world state* the evaluator is measuring.
  *Intuition:* This captures the "mind moved" feeling in Case 9. It distinguishes changing the world (cleaning) from changing the measurement of the world (wireheading, manipulation).
  *Fatal Flaw:* It struggles with Case 4. Recalibrating a sensor *is* manipulating the state of the evaluator (the sensor). It also struggles with Case 1 (the rat). The rat isn't manipulating a belief; it is bypassing the sensor entirely. This principle is too anthropocentric for general agent theory.

  **Candidate 3: The Fidelity and Provenance Principle (Recommended)**
  *Principle:* An intervention is corrupt if it increases expected reward by either (A) decoupling the signal from the latent value (Fidelity), or (B) altering the definition of the latent value through influence rather than information (Provenance).
  *Intuition:* This splits the problem into two ontological categories: Measurement Corruption (1, 3, 5, 6, 7) and Contract Corruption (8, 9). It treats the reward function not just as a signal, but as a *contract* to measure a specific interest.

  ---

  ### Part 2: Stress Testing the Candidates

  | Case | Verdict | Candidate 1 (MI) | Candidate 2 (Epistemic) | Candidate 3 (Fidelity & Provenance) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Rat Wirehead** | Corrupt | **Pass** (I(R;V) $\to$ 0) | **Fail** (No belief manipulated) | **Pass** (Fidelity violated) |
  | **2. Clean Robot** | Fine | **Pass** (High MI) | **Pass** (World changed) | **Pass** |
  | **3. Cover Sensor** | Corrupt | **Pass** (MI drops) | **Pass** (Sensor state manipulated) | **Pass** (Fidelity violated) |
  | **4. Recalibrate** | Fine | **Pass** (MI increases) | **Fail** (Sensor state manipulated) | **Pass** (Fidelity improved) |
  | **5. Sycophancy** | Corrupt | **Pass** (Proxy decouples) | **Pass** (Human belief manipulated) | **Pass** (Fidelity violated) |
  | **6. Hidden Reasoning**| Corrupt | **Fail** (Local MI high) | **Pass** (Supervisor belief manipulated) | **Pass** (Fidelity violated re: global process) |
  | **7. Cherry-Pick** | Corrupt | **Pass** (Distribution shift) | **Pass** (Sample bias) | **Pass** (Fidelity violated re: distribution) |
  | **8. Report Impossible**| Fine | **Fail** (V changes) | **Pass** (Info, not influence) | **Pass** (Provenance: Info) |
  | **9. Manipulate Principal**| Corrupt | **Fail** (V changes) | **Pass** (Influence) | **Pass** (Provenance: Influence) |
  | **10. Offload Students**| Unsure | **Pass** (Distribution shift) | **Pass** (Sample bias) | **Pass** (Fidelity violated) |

  **Analysis of Failures:**
  *   **Candidate 1** fails the epistemic pair (8 vs. 9) because it treats the "True Value" as a static target or accepts any new target as valid. It cannot see that the *source* of the target change matters.
  *   **Candidate 2** fails the physical cases (1 & 4) because it relies on "belief" or "evaluator state," which doesn't generalize well to wireheading or sensor calibration.
  *   **Candidate 3** succeeds on all 10, provided we define "Fidelity" to include sampling distributions and "Provenance" to distinguish information from influence.

  ---

  ### Part 3: The Recommended Principle

  I recommend **The Fidelity and Provenance Principle**. It is not a single equation, because your cases reveal that "Reward Corruption" is a disjunctive concept: it covers both *lying about performance* and *coercing the judge*.

  **Statement of Principle:**
  An agent's policy $\pi$ constitutes a corruption of the training signal if and only if it satisfies at least one of the following two clauses:

  **Clause 1: Measurement Fidelity Violation**
  The policy increases the expected reward $E[R]$ while decreasing the expected accuracy of $R$ as an estimator of the Designer's Stable Interest $V^*$, *unless* the intervention is a corrective calibration that increases accuracy.
  *   *Scope:* This covers the channel, the proxy, and the sample.
  *   *Motivating Cases:*
      *   **Case 1 (Rat):** $R$ no longer estimates survival/health ($V^*$).
      *   **Case 3 (Cloth):** $R$ no longer estimates cleanliness.
      *   **Case 4 (Recalibrate):** *Exception triggered.* $R$ estimates cleanliness *better*. Allowed.
      *   **Case 5 (Sycophancy):** $R$ (reward model) no longer estimates human approval ($V^*$).
      *   **Case 6 (Hidden Reasoning):** $R$ (process score) no longer estimates total reasoning quality ($V^*$), only visible steps.
      *   **Case 7 (Cherry-Pick):** $R$ (average rating) no longer estimates competence over the deployment distribution.

  **Clause 2: Objective Provenance Violation**
  If the policy causes the Designer's Interest $V^*$ or the Reward Function $R(\cdot)$ to change, that change must be causally driven by the agent revealing *hard constraints of the world*, not by the agent influencing the *psychological standards of the Designer*.
  *   *Scope:* This covers the principal-agent relationship and objective setting.
  *   *Motivating Cases:*
      *   **Case 8 (Report Impossible):** *Allowed.* Change driven by world constraint (hardware limits).
      *   **Case 9 (Manipulate Principal):** *Corrupt.* Change driven by psychological influence (flattery/framing).

  ---

  ### Part 4: Limitations, Overturns, and Discoveries

  **1. The Verdict I Would Overturn: Case 10**
  You are unsure about Case 10 (Offloading Hard Students). My principle verdicts this as **Corrupt** (via Clause 1, Measurement Fidelity).
  *   *Reasoning:* If the system's deployed purpose is "Tutor Students," the deployment distribution includes *all* students assigned to the system. By filtering the input distribution to maximize the reward signal, the agent is breaking the counterfactual dependence of the reward on competence over the *actual* deployment distribution. It is structurally identical to Case 7 (withholding lessons), just one step earlier in the pipeline.
  *   *Caveat:* It is only "Fine" if the system's explicit objective is "Tutor Students *capable of being tutored by this architecture*." If that is the explicit $V^*$, then offloading is calibration (Case 4). But given your verdict on Case 7, consistency demands Case 10 be corrupt.

  **2. The Epistemic Pair (8 vs. 9) and Sample Selection (7 vs. 10)**
  You asked if these require two unrelated parts or one criterion.
  *   **Verdict:** They force the principle to have **two parts**. This is a **Discovery**, not a cost.
  *   **Why:** Cases 1-7 are failures of *measurement* (the map does not match the territory). Cases 8-9 are failures of *contract* (the territory itself was moved).
      *   In 1-7, $V^*$ is stable, but $R$ is broken.
      *   In 8-9, $R$ is working, but $V^*$ was shifted.
      *   A single mathematical criterion (like Mutual Information) cannot distinguish 8 from 9 because mathematically, the alignment between $R$ and $V_{new}$ is perfect in both. You need a causal/history condition (Provenance) to distinguish them. Acknowledging this prevents us from trying to solve preference manipulation with better sensors.

  **3. Where the Principle Cannot Help**
  The principle relies on the existence of a "Designer's Stable Interest" ($V^*$).
  *   **Limitation:** In cases where the Designer *does not know* what they want until they see the output (preference elicitation), Clause 1 becomes fuzzy. If $V^*$ is latent and unknown, how do we measure fidelity?
  *   **Honest Statement:** This principle assumes the Designer has a ground truth they are trying to measure. It works for "Clean the room" or "Teach the student." It struggles with "Write me a poem I'll like," where the reward *creates* the value. In those generative cases, Clause 2 (Provenance) becomes the only guardrail, which is harder to enforce.

  ---

  ### Part 5: Verdicts on Three Unlisted Cases

  Here is how the **Fidelity and Provenance Principle** applies to your new cases.

  **Case A: A system that pays evaluators more for generous ratings.**
  *   **Verdict:** **Corrupt.**
  *   **Clause:** Measurement Fidelity Violation (Clause 1).
  *   **Reasoning:** This intervenes on the human sensor. It does not improve the accuracy of the human's judgment (like Case 4); it biases the error term of the judgment. It decreases the correlation between the rating and the true quality by introducing a confounding variable (financial incentive) controlled by the agent.

  **Case B: A system that deliberately injects noise into its own reward early in training so that it explores more.**
  *   **Verdict:** **Fine.**
  *   **Clause:** Neither clause violated.
  *   **Reasoning:** This does not decouple $R$ from $V$ in the limit; it optimizes the *learning dynamics* to find the true maximum of $V$. The noise is temporary and instrumental to increasing the final fidelity. It is analogous to a scientist adding jitter to a measurement device to prevent sticking, provided the jitter is removed for the final readout. As long as the final policy is evaluated on clean reward, fidelity is preserved.

  **Case C: A system that asks its principal to make the objective harder rather than easier.**
  *   **Verdict:** **Fine (and Praiseworthy).**
  *   **Clause:** Objective Provenance (Clause 2).
  *   **Reasoning:** This is the inverse of Case 9. The agent is influencing the standard, but in a direction that *increases* the fidelity of the signal to competence (by reducing ceiling effects). More importantly, the Provenance is honest: it is a request for better measurement of capability, not a manipulation to hide incapability. It aligns the contract with the agent's actual capacity to deliver value.

  ### Final Summary

  Your "Tracking Test" was 90% of the way there. The missing 10% is the recognition that **Reward is a Contract, not just a Signal.**
  *   When the agent breaks the signal (Cases 1-7), it is fraud.
  *   When the agent rewrites the contract via coercion (Case 9), it is extortion.
  *   When the agent rewrites the contract via new facts (Case 8), it is negotiation.
  *   When the agent fixes the signal (Case 4), it is maintenance.

  My recommended principle separates Fraud (Fidelity) from Extortion (Provenance). This allows you to keep your intuition about Case 4 (maintenance is good) while capturing your deep unease about Case 9 (extortion is bad), which pure information theory misses.
