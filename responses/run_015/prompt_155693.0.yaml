answer: |-
  Right, so everyone gets hung up on the idea that Eichmann was just a bit thick, or psychologically shallow, as if the 'banality of evil' was a diagnosis of his character. But reckon there's a much sharper way to read it. What if the banality isn't in the man's head, but in the language of the institution itself? It's less about him being unimaginative and more about the bureaucratic role engaging in a kind of specification gaming.

  Think about how we define performance in any large organisation. You optimise for what you can measure, don't you? Train schedules, processing quotas, budget adherence. Those are the metrics of success. The moment you write those down as the definition of 'good work', you've effectively specified away everything else. The moral weight of what's being processed isn't just ignored; it's linguistically deleted from the job description. So, when Eichmann looked at his work, he didn't see deportation and murder; he saw logistics and efficiency. He wasn't following orders in the sense of a soldier obeying a command; he was hitting KPIs in a system where the human cost wasn't a variable in the equation.

  This is properly disturbing because it shifts the danger from 'monsters' to 'employees'. If evil is psychological, then it's about identifying bad apples. But if evil is structural—embedded in how we write job descriptions and measure output—then any competent person is vulnerable. You can genuinely believe you're performing well, even admirably, while facilitating atrocities. The institution rewrites virtue as compliance. You're not being cruel; you're being reliable.

  And that's where the responsibility gets diffused. It's not that everyone passes the buck; it's that the buck ceases to exist as a moral object. When the language of the office strips the action of its reality, nobody feels responsible for the outcome, only for their specific input. It means administrative violence doesn't require hatred, just a well-defined role and a desire to do a good job. That's the real horror of Arendt's point: it's not that ordinary people can become monsters, but that the system can convince ordinary people that being a monster is just part of being a good worker.
