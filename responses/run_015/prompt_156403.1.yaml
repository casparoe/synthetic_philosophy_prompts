answer: |-
  ### Strategic Advice: The Carrying Example

  **Verdict:** Discard the 'Right/Left' analogy.
  **Reasoning:** Your instinct is correct. 'Right' (direction/correct) and 'Left' (direction/sinister) carry heavy moral and historical valuation that 'Man/Woman' does not inherently possess in the same way. Using it risks conflating *structural asymmetry* with *moral judgement* too early. It invites the "political" camp to dig in and the "fussiness" camp to dismiss the analogy as emotionally loaded.

  **Replacement:** Use **Poet/Poetess** (or **Host/Hostess**).
  **Why:** It is morphologically transparent, largely historical (reducing immediate defensiveness), and structurally identical to the Man/Woman pair.
  **What the carrying example must have:**
  1.  **Morphological Derivation:** One term must clearly be the base, the other formed by addition (e.g., *-ess*).
  2.  **Generic Capacity:** The unmarked term must be capable of standing for the whole class in standard usage (e.g., "a poet" can refer to any writer of verse).
  3.  **Opacity Potential:** It must allow for compound constructions where the base term's meaning is hidden (e.g., "poetry" vs "poetessry" — though this is less strong than man/mankind, it suffices for structure).
  **What it must lack:**
  1.  **Moral Valuation:** Avoid terms like 'Master/Mistress' (too loaded) or 'Right/Left' (too evaluative).
  2.  **Current Political Volatility:** Avoid 'Actor/Actress' if the group is likely to cite recent awards ceremonies; 'Poet' is safer for a retired demographic.

  ### Dependency Structure

  You must build the session like a proof, where each step validates the next. If you skip a step, the satire collapses into "just a joke."

  1.  **First (The Felt Asymmetry):** Participants must *feel* that one term does more work than the other before they are told *why*. Do not define "marked/unmarked" yet.
  2.  **Second (The Morphological Priority):** They must see that the "female" term is built *out of* the "male" term (structurally), not vice versa. This establishes the male as the "default" code.
  3.  **Third (The Default Imagery):** Once the structure is clear, they can see how it influences mental pictures (who is pictured when the generic is used).
  4.  **Fourth (The Opacity/Compounds):** This is the satire's engine. It only works if they accept the first three. This is where you reveal why Hofstadter's swap is funny *and* disturbing.

  **Withhold:** Do not mention "sexism," "politics," or "policy" until Phase 3. If you introduce the political stakes before the linguistic mechanism, the mechanism will be viewed solely through the lens of their existing political stance.

  ### Ordering the Diagnoses

  Your four diagnoses are correct, but the order must shift to match the dependency above.

  1.  **Diagnosis (i) Ambiguity:** Start here. "Can 'man' mean 'human' and 'male' simultaneously?"
  2.  **Diagnosis (iii) Morphological Derivation:** "Which word is the base? Which has the suffix?" This explains *why* the ambiguity exists.
  3.  **Diagnosis (ii) Default Imagery:** "When you hear the base word, who do you see?" This is the consequence of (i) and (iii).
  4.  **Diagnosis (iv) Opacity/Compounds:** "What happens in idioms like 'mankind'?" This is the *reductio ad absurdum* that the satire exploits.

  ### Misconception Map

  | Misconception | When to Address | Strategy |
  | :--- | :--- | :--- |
  | **Etymology** ('Man' originally meant human) | **Phase 1 (Early)** | Treat as a "Genetic Fallacy." Acknowledge truth, but note that current *usage* dictates meaning, not history. A car is not a horse because "vehicle" once meant horse-drawn. |
  | **Politeness/Etiquette** (It's just about being nice) | **Phase 2 (Mid)** | Distinguish *logic* from *manners*. This is about structural consistency, not hurt feelings. |
  | **Symmetry Objection** (Swapping is equally funny) | **Phase 3 (Late)** | Demonstrate asymmetry. "Womankind" sounds odd because "woman" is not the morphological base. "Mankind" sounds normal because "man" is. The joke fails if you swap back because the structure doesn't support it. |
  | **Intent** ('I never meant anything by it') | **Phase 3 (Late)** | Validate the individual (especially the 'Chairman' objector) but separate *intent* from *effect*. "The map is not the territory." |
  | **Proof vs. Joke** (It proves nothing / It's just a gag) | **Phase 3 (Late)** | Frame it as a *mirror*. It is not a proof of oppression, nor a mere jest. It is a diagnostic tool to reveal hidden structure. |
  | **Neutrality** ('Chairperson' solves it) | **Phase 4 (Close)** | Show that new words inherit old defaults. "Chairperson" can still default to male imagery if the underlying structure isn't recognised. |

  ### Session Plan (90 Minutes)

  **Resources:** Whiteboard, markers, photocopy of Hofstadter's text.
  **Room Setup:** Horseshoe or circle if possible; ensure the 'Chairman' objector is not isolated but not centre-stage.

  #### Phase 1: The Mechanism (00:00 – 00:25)
  *Goal: Establish the linguistic asymmetry without political loading.*

  *   **00:00 – 00:10: Introduction & Ground Rules.**
      *   Welcome. State the aim: "We are not here to decide policy, but to understand how a specific piece of writing works."
      *   **Crucial Move:** Acknowledge the 'Chairman' objector pre-emptively but generally. "I know many of you have used terms like 'chairman' for decades with no intent to exclude. We are not questioning your intent today; we are questioning the machinery of the words themselves."
      *   **Warm-up Example:** Write **Poet / Poetess** on the board.
      *   Ask: "If I say 'The poets gathered', do I mean men, women, or both?" (Answer: Both).
      *   Ask: "If I say 'The poetess gathered', do I mean both?" (Answer: No, women).
      *   Ask: "Which word looks like it is built from the other?" (Poet-ess).
      *   *Board Note:* Unmarked (Base) vs. Marked (Derived).

  *   **00:10 – 00:25: Applying to Man/Woman.**
      *   Write **Man / Woman**.
      *   Ask the group to parse the morphology. "Is 'Man' built from 'Woman', or 'Woman' from 'Man'?" (Historically/Structurally: Wo-man).
      *   **Address Etymology Objection:** If someone says "Man meant human," reply: "Historically, yes. But structurally, 'Woman' contains 'Man'. If 'Man' meant human, 'Woman' would mean 'Human-Female'. But 'Man' also means 'Male'. So 'Man' is doing two jobs."
      *   *Board Note:* Ambiguity (Generic + Specific) vs. Specific Only.

  #### Phase 2: The Satire & Opacity (00:25 – 00:50)
  *Goal: Read the text and experience the 'glitch' in the matrix.*

  *   **00:25 – 00:40: Guided Reading.**
      *   Do not ask them to read silently (pace will vary). Read the key excerpts of Hofstadter's paper aloud yourself.
      *   **Select:** The opening definition of "Person" (as female generic) and the section on compounds (e.g., "womankind", "chairwoman").
      *   **Pause Point:** When you read the swapped compounds. Ask: "Why does 'womankind' sound funny here, but 'mankind' does not?"
      *   Elicit the answer: Because 'man' in 'mankind' has become opaque; we don't hear 'male' anymore. Hofstadter forces us to hear it again.

  *   **00:40 – 00:50: The Comedy of Structure.**
      *   Explain Diagnosis (iv). The satire works because it treats the opaque word as transparent.
      *   **Address Politeness:** If someone says "It's just rude," counter: "It is logically inconsistent. If 'Man' is generic, Hofstadter's paper should make sense. It feels absurd because our usage *isn't* consistent, even if our rules say it is."

  #### Phase 3: Objections & Misconceptions (00:50 – 01:15)
  *Goal: Process the resistance and clarify the 'Proof vs. Joke' divide.*

  *   **00:50 – 01:05: Open Discussion (Managed).**
      *   Invite reactions. Expect the "It's just a joke" and "It proves men are victims" camps to emerge.
      *   **Intervention:** "If it were just a joke, it wouldn't annoy us. If it were a proof, it wouldn't be funny. It is a *mirror*. It shows us that our generic 'Man' excludes women by default, by pretending it doesn't."
      *   **Address Symmetry:** "Could we write this about 'Woman'?" No, because 'Woman' is not the generic base. The asymmetry is real, not invented by the text.
      *   **Address Intent:** Turn to the group. "Does knowing the structure change your intent? No. But does it change the effect on the listener? Yes."

  *   **01:05 – 01:15: The 'Chairperson' Solution.**
      *   Ask: "Does changing 'Chairman' to 'Chairperson' fix the problem?"
      *   Guide them to see: "Only if we stop picturing a man when we hear 'Chair'. If 'Chairperson' defaults to 'Man' in our heads, the word change is cosmetic." (Diagnosis ii).

  #### Phase 4: Transfer & Close (01:15 – 01:30)
  *Goal: Verify understanding and state limits.*

  *   **01:15 – 01:25: The Closing Check.**
      *   **The Test:** "I am going to say two phrases. I want you to notice your mental image."
      *   1. "The **doctors** are on strike."
      *   2. "The **female doctors** are on strike."
      *   **Question:** "Did the image for phrase 1 change when you heard phrase 2? If phrase 1 already included women equally in your mind, phrase 2 should be redundant. If phrase 2 made you realise phrase 1 was mostly men in your head, the mechanism is active."
      *   **Failure Condition:** If a participant says, "Just use 'Medical Practitioners' and it's fine," they have learned the etiquette (vocabulary swap) but not the mechanism (default imagery). Acknowledge this gently: "That solves the word, but not the picture."

  *   **01:25 – 01:30: Limits & Conclusion.**
      *   **State Limits:** "We have not settled what language *should* be. We have not settled whether this is 'oppression' or 'tradition'. We have only settled how the words *function*."
      *   Thank the 'Chairman' objector for her patience.
      *   Dismiss.

  ### What to Refuse to Settle

  You must explicitly name the boundaries of the session to prevent it from becoming a political tribunal. State this in Phase 1 and reiterate in Phase 4:

  1.  **Policy:** You will not dictate what terms the institute *must* use. That is for their administration.
  2.  **Morality:** You will not judge whether past usage was "evil." You are analysing structure, not prosecuting history.
  3.  **Metaphysics:** You will not define what gender *is*, only how the *words* map onto it.

  ### Summary of Dependencies for the Whiteboard

  Draw this simple flow as you speak to keep them oriented:

  1.  **Structure:** Base (Man) + Suffix (Wo-) $\rightarrow$ Derived (Woman).
  2.  **Usage:** Base (Man) = Generic + Specific. Derived (Woman) = Specific.
  3.  **Result:** Generic "Man" pictures Male by default.
  4.  **Satire:** Swapping them exposes the inconsistency.

  If the group gets stuck, point to the board. "We are at step 2. We cannot discuss step 4 until we agree on step 2." This manages the "fussiness" camp (who want to jump to politics) and the "bored" camp (who think they already know step 2).
