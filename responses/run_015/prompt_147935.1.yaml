answer: |-
  Here is the definite position you asked for: **Your roommate's explanation is a sophisticated misrepresentation.** He has accurately described the *problem* Ryle identified, but he has completely inverted Ryle's *solution*, and he is misapplying the science of embodied cognition to support a view Ryle explicitly rejected.

  Here is the breakdown of what to believe, what to discard, and why it matters for your guitar playing.

  ### 1. What the Roommate Got Right
  Your roommate is correct on the setup. Ryle's *The Concept of Mind* (1949) is indeed an attack on the "Intellectualist Legend."
  *   **The Legend:** The idea that intelligent action requires a two-step process: first, you contemplate a proposition (a rule/theory), and second, you execute it.
  *   **Ryle's Rejection:** Ryle agrees with your roommate here. You do not need to consciously recite music theory to play a scale intelligently. If you had to consciously apply a rule for every movement, you would never act (because you'd need a rule for applying the rule, leading to infinite regress).

  ### 2. The Critical Error: Ryle Did Not Believe in "Implicit Propositions"
  This is where your roommate's explanation fails philosophically. He claims Ryle thought knowing-how involves propositions "stored implicitly" in a "dispositional architecture." **This is false.**

  *   **Ryle's View:** Ryle was a **logical behaviorist** (or dispositionalist). He argued that knowing-how is *sui generis* (of its own kind). It is **not** a hidden form of knowing-that. For Ryle, to say someone "knows how to play guitar" is not to say their brain contains hidden sentences or rules; it is to say they are *disposed* to succeed when they try, correct mistakes, and learn new techniques.
  *   **The Roommate's Error:** By saying rules are "stored implicitly," your roommate is reintroducing the "ghost in the machine" that Ryle tried to exorcise. Ryle argued that looking for internal states (even implicit ones) to explain intelligence is a **category mistake**. You don't explain a skill by finding the hidden theory inside the head; you explain it by looking at the public performance.
  *   **The Verdict:** Your roommate is describing **Modern Intellectualism** (specifically the view of philosophers like Jason Stanley), not Ryle. Stanley argues that knowing-how *is* a species of knowing-that (just under a practical mode of presentation). Ryle argued the exact opposite: knowing-how is logically prior to and independent of knowing-that.

  ### 3. The Embodied Cognition Confusion
  Your roommate claims modern embodied cognition shows knowing-how is "subpersonal representations that work like implicit premises," making it a subtype of knowing-that. **This is scientifically and philosophically contentious, and largely misleading.**

  *   **The Science:** While some cognitive scientists do model skills as "subpersonal representations" (computational states), the strongest wing of embodied cognition (enactivism, ecological psychology, thinkers like Hubert Dreyfus, Alva Noë, and Shaun Gallagher) argues the opposite. They argue that skilled coping (like playing guitar) is **non-representational**.
  *   **The Conflict:** When you are in "flow" playing a riff, embodied cognition suggests you are not processing implicit premises; you are directly coupled with the instrument. To call this "hidden knowing-that" is to intellectualize the body. It turns your calluses and muscle memory into "silent sentences," which defeats the purpose of the embodied turn.
  *   **The Verdict:** Embodied cognition generally supports Ryle's **Anti-Intellectualism**, not your roommate's Intellectualist revision. It suggests skills are in the *interaction* between body and world, not in hidden brain states that function like propositions.

  ### 4. What You Should Believe (The Guitarist's Takeaway)
  You asked for a definite position on what to believe. Here it is:

  **Believe Ryle's original intuition, not your roommate's revision.**

  1.  **Skill is not Hidden Theory:** Do not fall into the trap of thinking that to be a good guitarist, you must have "internalized music theory" in your brain. You can know *that* a chord is dominant seventh without knowing *how* to resolve it, and you can know *how* to resolve it without being able to state the theory. They are different things.
  2.  **Practice is Not Storage:** When you practice, you are not "downloading propositions" into your implicit memory. You are training dispositions. You are changing what you *do*, not just what is stored in your head.
  3.  **Ignore the "Implicit Premise" Talk:** If you start thinking of your muscle memory as "implicit rules," you will start trying to analyze your playing intellectually while you do it. This leads to paralysis (the "centipede's dilemma"). Ryle was right: intelligent practice is its own standard.

  ### Summary
  Your roommate has taken Ryle's **Anti-Intellectualism**, gutted it, filled it with **Intellectualist** content (implicit propositions), and labeled it **Embodied Cognition**.

  *   **Accurate:** Ryle attacked the idea that conscious theory precedes action.
  *   **Misrepresentation:** Ryle did *not* think skills were implicit propositions. He thought they were dispositions to act.
  *   **False Move:** Embodied cognition does not prove skills are "hidden knowing-that." It mostly proves skills are embodied interactions that bypass representation entirely.

  **Final Advice:** Trust your hands, not your roommate's metaphysics. Ryle would tell you that the proof of your knowing is in the playing, not in the hidden architecture of your brain.
