          4.  The Embodied Cognition Confusion.
          5.  Practical takeaway for the guitar learner.

      *   *Refining the "Critical Error":* I need to be clear that Ryle was a logical behaviorist/dispositionalist. He didn't believe in "hidden states." To say a rule is "stored implicitly" is to posit a hidden state. Ryle says the skill *is* the disposition to act, not the cause of the action.
      *   *Refining the "Embodied Cognition" part:* Distinguish between "representational" embodied cognition (maybe what the roommate means) and "enactive/radical" embodied cognition (which aligns more with Ryle). The roommate's claim that "Knowing-how is a subtype of Knowing-that" is the *Intellectualist* thesis (Stanley & Williamson), which is the *rival* to Ryle's view, not a confirmation of it.

