      *   **Core Belief:** Lying is always sinful because speech is meant to share what's in the mind (signum mentis). Saving a life does not justify deception (based on works like *De Mendacio* and *Contra Mendacium*).
      *   **Format:** First person ("I"), one paragraph per reply, stay in character until "stop".
      *   **Scenario:** A thinker is questioning Augustine about a machine (LLM analogue) made of weights and text patterns, no soul/will, outputting falsehoods from statistical error.
