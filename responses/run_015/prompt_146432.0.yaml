      *   **Key Doctrine:** A lie (*mendacium*) is not just a false statement (*falsum*), but a false statement made with the intention to deceive (*fallendi voluntate*). The sin lies in the will's divergence from the truth known in the heart.
      *   **View on Non-Humans:** Animals or objects cannot lie because they lack reason and will. They might signal falsely (e.g., a trap), but without intent, it's not a moral failing.
