  # The Neural Replacement Survival Taxonomy

  **Instructions:** Start at the top. At each node, select the statement that best matches your intuition about the case. Follow the arrow to the next node or to a final position leaf.

  ### **Node 1: The Psychological Threshold**
  *Imagine the procedure is complete. All biological neurons are gone. The synthetic brain remembers your childhood, loves your spouse, and fears death exactly as you did. Is this psychological continuity **enough** to say you survived, or does the destruction of your biological brain mean you died regardless of the mental copy?*

  *   **A.** The destruction of the biological brain means I died; psychology alone is not enough. → **Go to Leaf 1**
  *   **B.** Psychological continuity is enough; I could survive the loss of my biology. → **Go to Node 2**

  ---

  ### **Node 2: The Substrate Constraint**
  *You believe psychology matters. But consider the specific mechanics: the synthetic neurons mimic your firing patterns but use incompatible error-correction protocols. Does your survival require the physical brain tissue to remain **continuous**, or can your psychological pattern survive a transfer to this discontinuous synthetic media?*

  *   **A.** My psychology must be carried by continuous biological tissue to count as *me*. → **Go to Leaf 2**
  *   **B.** My psychology can survive the transfer to discontinuous synthetic media. → **Go to Node 3**

  ---

  ### **Node 3: The Hybrid Phase**
  *The replacement takes five years. For a long period, your brain is a mix of biological and synthetic neurons using incompatible internal rules. During this hybrid phase, how many subjects are in the hospital bed?*

  *   **A.** There is **one** persisting subject throughout the transition. → **Go to Node 4A**
  *   **B.** There are **two** overlapping subjects (the biological original and the synthetic successor) sharing the system. → **Go to Node 4B**
  *   **C.** There is **no single correct answer**; the number of subjects is indeterminate. → **Go to Leaf 8**

  ---

  ### **Node 4A: The Ontology of the Single Survivor**
  *You believe one person survives the hybrid phase. How does this person exist through time?*

  *   **A.** The person is **wholly present** at every moment of the procedure. → **Go to Leaf 3**
  *   **B.** The person is a **chain of temporal parts** connecting the start to the finish. → **Go to Leaf 4**
  *   **C.** Only **instantaneous stages** exist, linked by relations, with no enduring entity. → **Go to Leaf 5**

  ---

  ### **Node 4B: The Ontology of the Overlapping Pair**
  *You believe two subjects exist during the hybrid phase. How do they relate to the timeline?*

  *   **A.** Two distinct, **wholly present** people coincide in the same space during the transition. → **Go to Leaf 6**
  *   **B.** One person (the "worm") **splits into two** future temporal branches. → **Go to Leaf 7**

  ---

  ### **The Leaves**

  **Leaf 1: Biological Continuity Theory (Animalism)**
  *   **Awkward Commitment:** You must assert that if your healthy head were transplanted onto a clone body, you would die in the operating room while the body walking away is a stranger.

  **Leaf 2: Somatic Psychological View (Bio-Dependent Functionalism)**
  *   **Awkward Commitment:** You must claim that a perfect psychological copy running on silicon is a corpse, while a severely dementia-ravaged biological brain is still a living person.

  **Leaf 3: Psychological Endurantism (Substrate-Independent)**
  *   **Awkward Commitment:** You must explain how the *same whole person* can exist while half their brain uses biological error-correction and half uses synthetic protocols without the subject becoming logically contradictory.

  **Leaf 4: Psychological Perdurantism (Worm Theory)**
  *   **Awkward Commitment:** You must accept that the "you" reading this sentence is merely a temporal slice of a larger space-time worm, and not the whole entity.

  **Leaf 5: Exdurantist Stage Theory**
  *   **Awkward Commitment:** You must deny that the patient who signed the consent form is numerically identical to the patient who wakes up, insisting they are only related stages.
      *   *Note: See Collapse Diagnosis below.*

  **Leaf 6: Endurantist Coincidentism**
  *   **Awkward Commitment:** You must accept that for several years, two distinct people are thinking the exact same thoughts and occupying the same hospital bed simultaneously.

  **Leaf 7: Perdurantist Fissionism**
  *   **Awkward Commitment:** You must conclude that the original person ceases to exist during the hybrid phase because personal identity cannot branch into two future paths.

  **Leaf 8: Ontic Vagueness View**
  *   **Awkward Commitment:** You must accept that reality itself is fuzzy, meaning there is no fact of the matter whether the patient is alive or dead during the transition months.
      *   *Note: See Collapse Diagnosis below.*

  ---

  ### **Collapse Diagnosis**

  **Leaf 5 (Exdurantist Stage Theory) and Leaf 8 (Ontic Vagueness)**
  These two positions often collapse into one another in practice. Both deny that there is a hard fact of the matter regarding identity over time. The Stage Theorist says identity fails because only moments exist; the Vagueness Theorist says identity fails because the world is indeterminate. In the context of the hybrid phase, both yield the same practical verdict: there is no true "survivor," only a series of related states or a fuzzy boundary where "survival" loses its meaning.

  **Leaf 4 (Perdurantist Worm) and Leaf 7 (Perdurantist Fission)**
  These positions share the same underlying ontology (temporal parts) and differ only in how they define the "survival" relation. Leaf 4 argues the worm remains single; Leaf 7 argues the worm splits. However, since both agree that the "original" is just a collection of parts, they often agree on all physical predictions, differing only on whether to apply the label "survival" to the branching path.
