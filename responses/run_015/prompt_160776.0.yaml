answer: |-
  Here is an analysis of your mate's framework, the competing rules that could explain it, and a prediction for the Myxomatosis verdict.

  ### The Two Competing Rules

  Based on her seven prior rulings, there are two distinct logics that fit the data equally well but diverge on the rabbit virus.

  **Rule 1: The "Adversarial Agency" Test (The *Who* Rule)**
  *   **Logic:** Is the entity capable of independent action, adaptation, or resistance? Does it "fight back" or change its behavior in response to human intervention?
  *   **Evidence:**
      *   *Antibiotic Resistance:* Ruled **Character** explicitly because "it learns."
      *   *Mosquitoes/Yellow Fever:* Ruled **Character** because they actively thwarted human plans (French) while sparing others (Rebels/Americans with engineering).
      *   *Little Ice Age/Salinization:* Ruled **Setting** because they are static trends or chemical consequences ("a trend isn't a who," "them doing it to themselves").
  *   **Application to Myxomatosis:** The virus and the rabbits co-evolved. The virus attenuated (became less lethal) to ensure its own survival, and the rabbits developed resistance. It acted outside human intent and adapted.
  *   **Prediction:** **Character.**

  **Rule 2: The "Partisan Outcome" Test (The *Whose Side* Rule)**
  *   **Logic:** Does the entity decisively tip the scales between two competing human factions? If it creates a winner and a loser among people, it's a Character. If it raises the cost of living for everyone equally or is a general background condition, it's Setting.
  *   **Evidence:**
      *   *Yellow Fever:* Ruled **Character** because it killed the French army but spared the immune rebels, deciding the revolution.
      *   *Mosquitoes:* Ruled **Character** because it stopped the French but the Americans overcame it, deciding the canal's ownership.
      *   *Tambora/Little Ice Age:* Ruled **Setting** because they caused misery across Europe generally (bread prices, wars) without picking a specific victor.
  *   **Application to Myxomatosis:** The virus was released to help graziers, but it didn't cause a war between human factions. It changed the ecology and economy, but it didn't hand a victory to one human group over another in the way Yellow Fever handed Haiti to the rebels. It was a general pest control measure that had unintended consequences.
  *   **Prediction:** **Setting.**

  ### Which Rule Is She Actually Running?

  I would bet money she is running **Rule 1: The Adversarial Agency Test.**

  **Why?**
  1.  **The "Antibiotic" Precedent:** The ruling on antibiotic resistance is the smoking gun. There is no clear "human vs. human" conflict there; it is humans vs. bacteria. By calling it a Character because "it learns," she prioritizes the *behavior of the entity* over the *political outcome*.
  2.  **The "Who" Language:** Her justification for the Little Ice Age ("a trend isn't a who") and Salinization ("them doing it to themselves") focuses on the *nature of the force*, not the result. She is drawing a line between *actors* and *conditions*.
  3.  **The Salinization Distinction:** In Mesopotamia, humans caused the damage to themselves. In the Myxomatosis case, humans launched the attack, but the *virus* responded. Under Rule 1, the virus's evolutionary response grants it agency. Under Rule 2, it's ambiguous. Given her focus on "learning" bacteria, she likely views evolutionary adaptation as the threshold for characterhood.

  ### The Verdict on Myxomatosis

  **Verdict: Character.**

  She will rule that the virus (and arguably the rabbits) are Characters. Her reasoning will likely hinge on the **evolutionary arms race**. Just as antibiotic resistance "learns," the myxoma virus "negotiated" its own survival by becoming less lethal, and the rabbits "fought back" with genetics. It defied the script written by the CSIRO scientists. In her framework, anything that rewrites the script is a Character; anything that just follows the laws of physics or human error is Setting.

  ### The Tie-Breaking Case

  To definitively tell Rule 1 (Agency) and Rule 2 (Partisan) apart, you should suggest she rule on:

  **The Cane Toad in Australia (1935–Present)**

  *   **The Setup:** Like Myxomatosis, humans introduced Cane Toads on purpose to eat beetles. Like Myxomatosis, it failed and became an ecological disaster.
  *   **The Split:**
      *   **Rule 1 (Agency) says Character:** They are a living, spreading, toxic invading force that actively resists control.
      *   **Rule 2 (Partisan) says Setting:** They haven't picked a human side. They don't decide wars or revolutions; they just make life harder for everyone (pets, wildlife, kids).
      *   **Crucial Difference:** Unlike Myxomatosis, Cane Toads haven't significantly *evolved* in response to humans in the public imagination (though they have at the frontier). If she rules Toads as **Setting** but Myxomatosis as **Character**, it proves she cares about **Adaptation/Evolution** (Rule 1). If she rules both **Setting**, she cares about **Human Conflict** (Rule 2).

  ### Does the "Environmental Determinism" Constraint Do Real Work?

  **Yes, it is functional, not decorative.**

  Environmental Determinism is the idea that physical geography *causes* social outcomes (e.g., "The tropics make people lazy," or "The Ice Age caused the English Civil War"). It removes human agency.

  Your mate's constraint stops her from falling into that trap.
  *   **Without the constraint:** She might be tempted to call the Little Ice Age a **Character** because it correlates with wars. That implies the climate *made* them fight.
  *   **With the constraint:** She is forced to call the Little Ice Age **Setting**. This preserves the historical truth that *humans chose* to fight; the cold was just the stage they fought on.

  By reserving the title "Character" for things with *agency* (viruses, mosquitoes) rather than *causality* (climate, geology), she avoids saying "Geography dictated history." Instead, she says "History is a play with human and non-human actors." That is a subtle but vital distinction in modern historiography (often called "Multispecies History" or "Actor-Network Theory"). The warning label ensures she doesn't accidentally revert to the old idea that mountains and rivers control human fate.
