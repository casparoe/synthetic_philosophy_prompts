  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Complicity Magnitude** | Complicity terms are small enough to allow net gains in most dyads. | Complicity terms are large enough to block most dyads. | Survey willingness to fund opposed ends for 2x impact. | >50% accept trade. | <20% accept trade. |
  | **Compliance Legibility** | Smart contracts/escrow can make compliance legible at <10% cost. | Verification costs exceed 10% of trade value in thin markets. | Pilot program using escrow for moral pledges. | Success rate >80%. | Success rate <50%. |
  | **Value Drift** | Value drift is slow; option losses are minor relative to static gains. | Value drift is fast; option losses swamp static gains. | Longitudinal study on value stability over 5 years. | Correlation >0.8. | Correlation <0.5. |

  **Evidence Against Views**
  *   **Enthusiast:** Systematic failure of moral trade platforms due to user revulsion at aiding opposed ends.
