  **Egalitarian Diagnostic Tree for Health Allocation**

  **Instructions:** Answer sequentially. Cases reflect health/disability allocation.

  **Q1: Is equality fundamental, or a proxy for standing/sufficiency?**
  *   **Proxy:** Go to Q2.
  *   **Fundamental:** Go to Q3.

  **Q2: What triggers public concern?**
  *   **Social Hierarchy:** **Relational Egalitarianism.** (Leaf 1)
      *   *Note:* Focuses on status, not shares.
  *   **Falling Below Threshold:** **Sufficiency View.** (Leaf 2)
      *   *Note:* Inequalities above threshold irrelevant.
  *   **Weighting Worst-Off:** **Priority View.** (Leaf 3)
      *   *Note:* Equality proxies for priority weighting.

  **Q3: Compensate disadvantages from voluntary choices (e.g., expensive tastes)?**
  *   **Yes (Strict):** Go to Q4.
  *   **No (Luck):** Go to Q5.

  **Q4: What currency is strictly equalized?**
  *   **Welfare:** **Unnamed — Nobody defends this.** (Leaf 4)
      *   *Awkwardness:* Forces redistribution to satisfy expensive tastes.
  *   **Resources:** **Strict Resource Egalitarianism.** (Leaf 5)
      *   *Awkwardness:* Ignores differential conversion needs (disability).
  *   **Recoverability:** **Unnamed — Nobody defends this.** (Leaf 6)
      *   *Awkwardness:* Compensates for voluntary risk-taking if recovery is hard.

  **Q5: What currency tracks luck-based disadvantage?**
  *   **Resources:** Go to Q6.
  *   **Capabilities:** **Capability Approach.** (Leaf 7)
      *   *Case:* Disabled person adapts preferences to deprivation. Resources compensates; Capabilities may not.
  *   **Recoverability:** **Recoverability View.** (Leaf 8)
      *   *Neighbor:* Capability Approach.
      *   *Case:* Two patients have identical mobility functionings. Patient A has insurance/family (fast recovery if relapse). Patient B does not. Capabilities says equal; Recoverability says unequal.
  *   **Welfare:** **Luck Egalitarianism (Welfare).** (Leaf 9)
      *   *Awkwardness:* Intrusive measurement of subjective states.

  **Q6: What is the unit of assessment for Resources?**
  *   **Whole Life:** **Luck Egalitarianism (Resources, Life).** (Leaf 10)
      *   *Note:* Allows temporary deprivation if lifetime balance holds.
  *   **Time Slice:** **Luck Egalitarianism (Resources, Slice).** (Leaf 11)
      *   *Note:* Requires constant equality; costly to administer.
  *   **Worst Period:** **Luck Egalitarianism (Resources, Worst).** (Leaf 12)
      *   *Note:* Focuses on preventing deep temporary crashes.

  **Scoring Note**
  *   **Pattern:** Trace your path. Leaves 1-3 are non-egalitarian proxies. Leaves 4-12 are egalitarian.
  *   **Unoccupied Regions:** If you land on Leaf 4 or 6, your view is likely incoherent or unattractive to others. Consider shifting to Leaf 5 or 8.
  *   **Unseparated Views:** Capability Approach and Recoverability View may overlap if recovery is treated as a capability. Flag as unseparated if participant insists recovery is a functioning.

  **Contested Placements & Redraw Conditions**
  *   **Contested Readings:**
      *   **Luck Egalitarianism (Leaves 9-12):** Some proponents deny it is fundamentally about equality, preferring "responsibility-corrected sufficiency." Tree assumes equality is the driver.
      *   **Relational Egalitarianism (Leaf 1):** Some argue it requires resource equality anyway to secure standing. Tree treats them as distinct.
  *   **Weak Distinction:**
      *   **Q3 (Responsibility):** In health, "voluntary" is contested (e.g., addiction, adaptive preferences). This distinction likely does less work than implied.
      *   **Welfare vs. Preferences (Leaf 9):** Hard to measure objectively in policy.
  *   **Redraw Triggers:**
      *   **Scope:** If a participant insists equality applies only to citizens, add a Q0 on membership.
      *   **Luck Types:** If a participant distinguishes "brute luck" from "option luck" differently, split Q3.
      *   **New Case:** Chronic pain patient. View A (Resources) gives money for meds. View B (Recoverability) gives social support for resilience. Both have same money/functioning. If this separates views not split above, add a Currency branch for "Resilience."
      *   **Failure Point:** Q3. If participants cannot agree on what counts as voluntary, the tree branches incorrectly. Consider merging Strict and Luck views into a single "Responsibility-Sensitive" branch with sub-questions on mitigation.
