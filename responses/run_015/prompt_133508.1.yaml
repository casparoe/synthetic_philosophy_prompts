  6.  **Final Polish:** Ensure the distinction between "Counterfeit Money" (Dennett's analogy) and "Counterfeit Person" is clear. Dennett's counterfeit bill passes at a glance but fails under scrutiny. The user argues LLMs pass under scrutiny (behaviorally) but fail on *genealogy/design*. That's the tension to highlight.

