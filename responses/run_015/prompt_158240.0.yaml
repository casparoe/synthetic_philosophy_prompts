      *   *Claim 1: Populares used plebiscites to bypass the Senate.*
          *   **Accuracy:** Partially true, but simplified. The *populares* were a political strategy/faction, not a formal party. They did use the Plebeian Council (*concilium plebis*) and the Tribunes to pass laws (*plebiscita*) that had force of law, often bypassing the Senate's *auctoritas*.
