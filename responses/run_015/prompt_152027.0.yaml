  6.  **Final Polish:** Check against constraints. No citations. Talk to an editor. Ensure the distinction between Tarkovsky and Lem is acknowledged if necessary (Lem is more explicit about the neutrino science, Tarkovsky more about the guilt/psychology). I'll lean slightly Lem-heavy for the "neutrino" stuff but keep the emotional weight of Tarkovsky. *Decision: Focus primarily on Lem's text for the mechanics (neutrinos) but acknowledge the film's emotional resonance regarding the "soul."* Actually, the prompt says "either version." I will blend them but prioritize Lem's specific mechanics for the reduction argument since Tarkovsky is vaguer on the "how."

