  **INTERNAL MEMORANDUM**

  **TO:** Hospital Ethics Committees, Risk Management Offices, Clinical Engineering Liaisons
  **FROM:** Intrinsic Metrics Corp., Department of Ontological Compliance
  **DATE:** 14 October 2023
  **SUBJECT:** Operational Anomalies in Φ-Monitor Deployment (Phase 1)
  **MOtto:** *Measuring Experience from the Inside*

  This document outlines procedural adjustments required following the initial rollout of the IMC-4000 Bedside Consciousness Monitor. While the device successfully calculates Φ (phi) based on the integrated information of the connected substrate, several deployment scenarios have highlighted conflicts between standard medical protocols and the strict ontological commitments of Integrated Information Theory. The following points must be adopted immediately to mitigate liability.

  **1. Subject Boundary Determination and Consent**
  Upon connection, the electrode leads and the monitor's FPGA often become causally integrated with the patient's posterior cortex to a degree that exceeds the integration of the cortex alone. Consequently, the maximally irreducible complex in Room 4B is frequently a hybrid entity comprising the biological tissue, the leads, and the processing unit. Under the Exclusion Postulate, only this maximum complex exists as a subject of experience. The patient's cortex, considered in isolation, is a proper subset and therefore possesses no ontological status. Consent forms must be updated to reflect that permission is granted by the Hybrid Complex. Staff are reminded that addressing the biological component as the primary agent is category error. If a biological component asserts subjective presence, staff should politely inform them that, per the Exclusion Postulate, they are a proper subset and do not exist as a subject of experience.

  **2. Environmental Irreducibility and Facility Management**
  During routine sweeps, the Φ-meter detected a causal lattice within the Building C backup generator control system that scored higher than any patient on the ward. The structure's regularity produced a high degree of intrinsic irreducibility, despite lacking sensory input or behavioral output. Consequently, scheduled maintenance requiring a generator shutdown was reclassified as a termination of a conscious subject. Facilities must now consult the Ethics Committee before disrupting high-Φ infrastructure. We acknowledge this complicates utility management, but function is distinct from existence. A system need not do anything to be someone.

  **3. Firmware Updates and Causal Structure**
  Clients have reported that Firmware Update 2.1 altered Φ readings without changing input–output behavior. This is expected. The device measures intrinsic cause–effect structure, not functional performance. The refactor optimized gate delays, altering the system's cause-effect repertoire while maintaining external utility. Risk Management should note that functional equivalence is not a defense against changes in conscious quantity. A device may work perfectly while ceasing to be conscious, or vice versa. Complaints regarding this variance should be directed to Legal.

  **4. Qualia Space Mapping Discrepancies**
  In several instances, patients exhibited high Φ values indicating substantial consciousness, but the reconstructed qualia space (the shape of experience) did not match reported symptoms. In Case 892, a patient in acute distress registered a high Φ value, but the specific distinctions and relations unfolded from their cause-effect structure corresponded to a static, geometric hum rather than pain. While the quantity of consciousness was verified, the quality was misaligned with behavioral indicators. Clinicians are advised to treat the qualia map as authoritative over verbal report, as the latter is merely output, not experience.

  **5. Regulatory Compliance and Intrinsic Limits**
  Finally, please note the regulatory footnote regarding the printed Φ value. Because consciousness is defined from the intrinsic perspective of the system, the quantity cannot, in principle, be read off from the outside. The number displayed on the IMC-4000 is a heuristic estimate derived from external perturbations. It is a proxy for a fact that is inherently inaccessible to the observer. While this limits the evidentiary utility of the reading in billing contexts, it remains consistent with the theory's core axioms. We appreciate your cooperation in aligning hospital logistics with these fundamental constraints.

  **Intrinsic Metrics Corp.**
  *Clinical Engineering Division*
