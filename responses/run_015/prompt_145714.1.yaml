      *   **Subject:** Sign-off on interpretation panels for Merebank visitor centre.
      *   **Requirement:** Must include an *actual recommendation*, not just a summary of options.
      *   **Site Context:** Dug 2019-21, gravel terrace, river. Rectangular timber building, four-post structure, two pits (30m apart).
      *   **Pit 1:** 34 iron objects (axes, sickles, tools), cattle/pig bone. Distinct layers. Objects deliberately bent/broken. 3 miniature tools (votives?). Others show use-wear. No coins/imported/human bone/inscriptions/images. Radiocarbon broad (Late Iron Age/Early Roman). Tool types span ~2 centuries (accumulated deposit?).
      *   **Pit 2:** Similar objects but jumbled with butchery waste + broken quern. No bending/layering.
      *   **Stakeholders/Opinions:**
          *   *Finds Specialist:* "Ritual" is a non-falsifiable label. Skeptical.
          *   *Community Engagement Officer:* Local heathen group calls it a "temple." School programme built around it. "We don't know" erases religious agency.
          *   *Board Member A:* Burden of proof on deflationary reading. Don't strip religious dimension.
          *   *Board Member B:* Belief is hard to read, maybe don't try.
          *   *Current Draft:* Says "offerings to the gods." Reconstruction drawing ordered (thatched shrine + carved figure).
      *   **Deliverables:**
          1.  Specific wording recommendation for Pit 1 & 2 panels.
          2.  Decision on the reconstruction drawing (commission or kill? If kill, what replaces it?).
          3.  Policy recommendation on confidence ratings (safeguard or hedge?).
          4.  Timeline for the 3-week deadline.
          5.  Tone: Take the "temple" reading seriously (steelman it), even if arguing against it.

  2.  **Evaluate the Evidence (Archaeological & Interpretive):**
      *   *Pit 1:* The bending/breaking and layering are classic "ritual" markers in Iron Age archaeology (structured deposition). The miniatures are strong evidence for non-utilitarian intent. However, "offerings to the gods" is a specific theological claim not supported by material evidence (no iconography, no inscriptions).
      *   *Pit 2:* Looks like rubbish/midden. Contrast with Pit 1 highlights Pit 1's特殊性 (specialness).
      *   *The Building:* Rectangular timber + four-post. Could be a shrine, could be a storehouse, could be a house.
      *   *The Reconstruction:* A "carved figure inside" is pure fiction. There is *no* evidence for this. This is the biggest risk. It creates a false certainty.
      *   *The "Temple" Label:* Local heathen groups value it. Erasing this alienates them. But stating it as fact alienates skeptics and misleads the public.
      *   *Confidence Ratings:* Good in theory, but can look clunky on panels. Needs a nuanced approach.

  3.  **Drafting the Recommendations:**

      *   *Wording:* Needs to balance the specialist's skepticism with the community officer's concern about erasure. Avoid "gods" (specific) but keep "ritual/special" (functional). Acknowledge the miniatures. Acknowledge the uncertainty.
      *   *Reconstruction:* The carved figure *must* go. It's fabrication. The shrine building itself is plausible but needs to be labeled as hypothetical. Better to show the *process* of deposition or the objects themselves.
      *   *Policy:* Confidence ratings are useful but shouldn't be asterisks everywhere. Use visual cues or specific phrasing ("may have," "suggests").
      *   *Timeline:* Tight. 3 weeks. Need immediate decision on text and image.

  4.  **Steel-manning the "Temple" Argument:**
      *   Why might it be a temple? The deliberate destruction (killing the tool) suggests a transition from profane to sacred. The miniatures are clearly votive. The separation from the messy Pit 2 suggests a designated sacred space. In Iron Age Britain, we *know* ritual happened, even if we lack texts. Denying it requires assuming these people had no spiritual life, which is historically unlikely.
      *   *Counter:* We don't know *which* gods or *what* the theology was. "Shrine" is okay; "Temple with carved idol" is not.

  5.  **Drafting the Memo (Iterative Process):**

      *   *Header:* Standard Memo format.
      *   *Opening:* State purpose clearly.
