answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, Northwold Heritage Trust
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation for Merebank Interpretation Panels (Deadline: 3 Weeks)

  **Purpose**
  This memo provides a definitive recommendation for the Merebank visitor centre text and imagery to meet our three-week design deadline. It addresses the tension between archaeological certainty and community meaning, specifically regarding the "ritual" interpretation of Pit 1.

  **1. Panel Text Recommendation**
  We must avoid the false dichotomy of "definite temple" versus "mere rubbish." The evidence supports a *ritualised* practice without confirming a specific theology. The text should validate the spiritual agency of the people (addressing the Community Officer's concern) without fabricating specifics (addressing the Finds Specialist's concern).

  **Recommended Text:**
  > **Pit 1: A Special Place**
  > Unlike the everyday refuse found in Pit 2, the objects here were treated with care. Iron tools—some worn from use, others made too small to ever work—were bent, broken, and laid in layers alongside animal bones.
  >
  > This deliberate destruction suggests these objects were being taken out of circulation for a specific purpose. While we cannot know the names of the spirits or powers involved, the care taken here points to a ritual practice. For some, this was a sacred place; for others, a site of memory. What remains certain is that these people marked this spot as different from the world around it.

  **Rationale:** This phrasing accepts the "temple" proponents' strongest argument: that structured deposition and miniatures are evidence of non-utilitarian intent (votive behaviour). It acknowledges the site's sacred potential without lying about the absence of iconography or inscriptions.

  **2. Reconstruction Drawing: Commission Revision**
  **Recommendation:** Do not approve the current drawing. The "carved figure" is pure fiction and violates our code of ethics on interpretation. However, we should not replace it with nothing, as this risks making the site feel sterile (supporting Board Member A's concern about deflation).

  **Action:** Instruct the designer to revise the illustration immediately.
  *   **Remove:** The carved figure and any specific religious iconography.
  *   **Retain:** The rectangular timber structure is a plausible reconstruction of the building footprint, provided it is labelled *"Possible appearance of the timber structure."*
  *   **Add:** A focal inset illustration showing the *act* of deposition: a hand bending an iron sickle over the pit, or the miniature tools alongside full-sized ones. This visualises the "ritual" argument through the actual evidence (the objects) rather than invented scenery.

  **3. Policy on Confidence Ratings**
  **Recommendation:** Adopt a "Narrative Confidence" policy rather than numerical ratings.
  Numerical ratings (e.g., "Certainty: 40%") often look like hedging and can confuse visitors. Instead, we will use a tiered vocabulary in all future panels:
  *   **Confirmed:** "We found..." / "The evidence shows..."
  *   **Probable:** "This suggests..." / "It is likely..."
  *   **Possible:** "This may have..." / "One interpretation is..."

  This acts as a genuine safeguard. It forces the curatorial team to justify the verb choice during the drafting process, ensuring we don't slip into "offerings to the gods" (Confirmed) when we only have "deliberate deposition" (Probable).

  **4. Implementation Timeline**
  To meet the three-week deadline for the designer:

  *   **Tuesday (Board Meeting):** Vote on this recommendation.
  *   **Wednesday – Friday (Week 1):** I will work with the Finds Specialist and Community Officer to finalise the text based on the draft above. Simultaneously, we issue the variation order to the illustrator for the revised drawing (no figure, focus on objects/deposition).
  *   **Monday – Friday (Week 2):** Designer incorporates text and revised image into panel layout. Circulate proof to Board by Thursday.
  *   **Monday – Tuesday (Week 3):** Final Board sign-off via email. Files sent to print Wednesday.

  **Conclusion**
  This approach respects the local heathen community's view that the site was sacred by acknowledging the ritual nature of the deposit, while maintaining archaeological integrity by refusing to invent gods or idols we cannot prove. It turns our uncertainty into part of the story, rather than a weakness to be hidden.

  Please review prior to Tuesday's discussion.
