  Term 2 (Mechanism). I am least sure whether a "threshold" view of encroachment would permit hidden stakes to raise the bar while a "relevant alternatives" view would not. This would shift if there were consensus on whether stakes operate by altering the required probability of truth or by making specific error-possibilities salient.

  **Stranger vs. Maya Stakes**
  It matters significantly. If the high stakes were Maya's (even if hidden), some versions of encroachment might still apply to her rationality. Because the stakes belong to a stranger and are unknown to Maya, the link to her epistemic position is severed, making the "Maya Knows" verdict much more robust than in standard bank cases.

  **Disagreement Locus**
