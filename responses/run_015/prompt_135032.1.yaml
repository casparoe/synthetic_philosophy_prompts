answer: |-
  # A Procedure for Uncertain Flood Risk Assessment

  **To:** The Planning Officer and Board Members
  **From:** [Your Name/Consultant]
  **Subject:** Annual Asset Assessment Procedure (Half-Day Workshop)

  This document sets out a method to handle the uncertainty in your funding bids without pretending it does not exist. It is designed for four people in a room, using no mathematics beyond arithmetic.

  ## Part 1: The Procedure

  ### 1. The Question (Elicitation)
  Do not ask: *"What is the probability?"*
  Ask: **"If you had to bet £1,000 of your own money on this asset failing in the next ten years, what are the odds where you would start to feel nervous?"**

  You need two numbers from the room:
  *   **The Floor:** The lowest chance you would still take seriously. (e.g., "I wouldn't bet on it happening if the chance was less than 1 in 100, but 1 in 50 feels possible.")
  *   **The Ceiling:** The highest chance you could defend without laughing. (e.g., "It's not 50-50, but I couldn't rule out 1 in 5.")

  **Is the betting analogy a trap?**
  It is useful, but treat it as a metaphor for *conviction*, not a literal gamble. Its value is that it forces people to attach a consequence to being wrong. If someone says "1%", ask: "Would you bet your £1,000 at 99-to-1 odds that it *won't* fail?" If they hesitate, their number is too low.

  ### 2. Combining Disagreement (The Envelope)
  When your three or four experts give different ranges, do not average them. Averaging hides disagreement.
  *   **Take the Envelope:** The group's **Floor** is the *lowest* number anyone gave. The group's **Ceiling** is the *highest* number anyone gave.
  *   **Why:** If one engineer sees a risk the others missed, that risk exists. The Envelope captures the total uncertainty of the room.
  *   **Exception:** If one person's range is entirely outside the others (e.g., three say 2–10%, one says 50–60%), ask the outlier to explain. If their reasoning is sound (e.g., "I know this pump model has a specific corrosion defect"), include them. If it is a guess, exclude them.

  ### 3. The "No Idea" Case
  Sometimes the range will be 0% to 100%. This means you have no historical data and no engineering model.
  *   **Action:** Mark this asset as **"Data Void"**.
  *   **Decision:** You cannot calculate a Benefit–Cost Ratio (BCR). Do not put it in the funding bid as a standard scheme. Instead, bid for a "Investigation Scheme" (survey, monitoring, modelling) to turn it into a numbered asset next year.
  *   **Interim:** If the consequence is catastrophic (loss of life), treat it as high risk regardless of probability. If the consequence is minor, monitor annually.

  ### 4. Correlated Failures (The "One Storm" Rule)
  You asked about several assets failing together. Standard math assumes failures are independent (like rolling dice). Floods are not dice; one storm hits everything.
  *   **Procedure:** Group assets by "Hydraulic Zone" (areas that flood from the same rain event).
  *   **Calculation:** Do not add the probabilities. Assume if the storm is big enough to fail one, it is big enough to fail all in that zone.
  *   **Costing:** When calculating the benefit of fixing one asset in a zone, acknowledge that if the *other* assets fail, fixing this one might not stop the flooding. Reduce the "Benefit" number by a "Dependency Factor" (e.g., if there are three weak points in a line, fixing one only delivers 30% of the total safety).

  ### 5. The Spreadsheet Number
  The funding body demands a single probability. You must give them one, but you must not let your Board forget it is a fiction.
  *   **The Number:** Enter the **Midpoint** of your Envelope (Floor + Ceiling divided by 2).
  *   **The Reason:** The midpoint is the mathematical "expectation". It is the best single guess for long-term budgeting.
  *   **The Safeguard:** Beside the number, in the "Notes" column (or a separate Shadow Ledger), record the **Width** of the range (Ceiling minus Floor).
      *   If Width < 5%: Mark "Stable".
      *   If Width > 10%: Mark "Uncertain".
      *   If Width > 20%: Mark "Volatile".
  *   **Rule:** Any scheme marked "Volatile" requires a specific Board vote to submit, acknowledging the number is fragile.

  ### 6. Making the Decision (The Traffic Light)
  Calculate the BCR using the Floor probability and the Ceiling probability.
  *   **Green Light:** BCR is above 1.0 even at the **Floor** probability. (The project is good value even if things go well.) **Action:** Fund.
  *   **Red Light:** BCR is below 1.0 even at the **Ceiling** probability. (The project is poor value even if things go badly.) **Action:** Reject, unless there is a non-financial reason (e.g., statutory duty).
  *   **Amber Light:** The BCR straddles 1.0. (It looks good at the Ceiling, bad at the Floor.) **Action:** This is a policy decision, not a math decision. The Board must decide if they are risk-averse (spend to be safe) or fiscally conservative (spend only on sure bets).

  ### 7. The Widening Case (Learning Increases Uncertainty)
  When a survey finds new problems (like burrows) and the range widens (e.g., 2–10% becomes 1–40%):
  *   **Validation:** This is correct. You have moved from "Ignorance" (thinking you knew) to "Awareness" (knowing you don't know).
  *   **Action:** Do not use the Midpoint for decision-making here. The Volatility is too high.
  *   **Procedure:**
      1.  **Immediate Mitigation:** If the Ceiling implies catastrophic loss, spend operational budget (not capital bid) on immediate temporary fixes (e.g., fill burrows now).
      2.  **Information Bid:** If time allows, bid for a further survey to narrow the range next year.
      3.  **Decision:** If you must decide now, treat it as **Amber**. The widening indicates the asset is poorly understood. If the Board is risk-averse, fund it. If they are fiscally strict, reject it until understood.

  ---

  ## Part 2: Running the Cases

  Here is the procedure applied to your three scenarios.

  ### Case 1: The Village Embankment
  *   **Data:** 200 houses. Consequence £4m. Cost £400k. Probability Range 2% – 10% (in 10 years).
  *   **Calculations:**
      *   **Floor Benefit:** 2% of £4m = £80,000.
      *   **Ceiling Benefit:** 10% of £4m = £400,000.
      *   **Floor BCR:** £80k / £400k = **0.2**.
      *   **Ceiling BCR:** £400k / £400k = **1.0**.
  *   **Classification:** **Amber/Red**.
  *   **Spreadsheet Number:** Midpoint (6%). Expected Benefit £240k. BCR = 0.6.
  *   **Recommendation:** **Do not fund** under standard criteria.
      *   *Reasoning:* Even in the worst-case scenario (10% chance), the project only breaks even. In the most likely scenario (6%), it loses 40p for every £1 spent.
      *   *Uncomfortable Truth:* Protecting 200 houses feels urgent, but the math says the risk of flooding is too low to justify this specific expensive solution.
      *   *Board Question:* Is the £4m consequence correct? Does it include trauma, business interruption, or political cost? If the true cost is £8m, the BCR doubles to 2.0 (Green). If £4m is accurate, this scheme is a poor use of ratepayers' money compared to others.

  ### Case 2: The Two Pumps (Choose One)
  *   **Pump 1:** Cost £60k. Consequence £80k. Prob 10% – 30%.
      *   Benefit Range: £8k – £24k.
      *   BCR Range: **0.13 – 0.4**.
  *   **Pump 2:** Cost £400k. Consequence £900k. Prob 5% – 25%.
      *   Benefit Range: £45k – £225k.
      *   BCR Range: **0.11 – 0.56**.
  *   **Classification:** **Red** (Both).
  *   **Recommendation:** **Fund Neither.**
      *   *Reasoning:* Both schemes cost significantly more than the expected flood damage they prevent. Replacing them is maintenance, not a funded improvement scheme. They should be paid from your routine operational budget, not a capital bid.
      *   *If Forced to Choose:* If the Board insists one *must* be upgraded for political reasons, choose **Pump 2**. Although its BCR is worse, it prevents a larger absolute loss (£225k max vs £24k max) and protects properties/roads rather than just fields.
      *   *Uncomfortable Truth:* Your asset management plan may be maintaining equipment that is not economically viable to upgrade. This suggests you should be running these assets to failure or finding cheaper interim solutions.

  ### Case 3: The Burrowed Embankment (Widening Range)
  *   **Data:** Old Range 2–10%. New Range 1–40%. Fix Cost (assumed) £400k. Consequence (assumed) £4m.
  *   **Survey Option:** Cost £15k. Time 8 weeks. Deadline 6 weeks.
  *   **Classification:** **Volatile Amber**.
  *   **Recommendation:** **Do not survey. Do not bid for full rebanking yet.**
      *   *Reasoning:* You cannot complete the survey before the deadline. Submitting a bid with a 1–40% range is likely to be rejected as "unsubstantiated".
      *   *Action:*
          1.  **Operational Spend:** Use your internal maintenance budget immediately to fill the known burrows (the "Floor" risk).
          2.  **Next Year's Bid:** Commission the survey now for *next* year's cycle.
          3.  **Contingency:** If the Board is extremely risk-averse regarding this specific reach, authorise a spot-repair programme now rather than a full rebank.
      *   *Why:* The widening proves you do not understand the asset. Spending £400k on a fix might be overkill if the risk is 1%, or useless if the risk is 40% and requires a different engineering solution. Buy information first.

  ---

  ## Part 3: Confidence and Limitations

  ### Where I am Confident
  *   **The Envelope Method:** Aggregating expert opinion by taking the widest range (Union) is standard practice in risk management when data is scarce. It prevents "groupthink" from hiding a catastrophic risk seen by one person.
  *   **The Widening Phenomenon:** I am highly confident that your intuition on the burrows is correct. In statistics, this is known as *second-order uncertainty*. Discovering you don't know the failure mechanism *increases* uncertainty before it decreases it. Ignoring this leads to surprise failures.
  *   **The "No Idea" Protocol:** When probabilities are 0–100%, treating the asset as a "Data Void" and bidding for investigation is the only fiscally honest approach.

  ### Where Reasonable People Disagree
  *   **The Spreadsheet Number:** There is a debate between using the **Midpoint** (mathematical expectation) versus the **Ceiling** (prudent safety case).
      *   *Argument for Ceiling:* In flood defence, we should be conservative. If the risk *could* be 40%, we should plan for 40%.
      *   *Argument for Midpoint:* If you always bid using the worst-case, you will exhaust your budget on low-probability risks and miss high-probability ones. Over the long term, the Midpoint balances the budget.
      *   *My Recommendation:* I have advised the Midpoint for the spreadsheet to maintain credibility with the funding body, but the **Envelope** for internal decision-making.
  *   **The Betting Analogy:** Some behavioural economists argue that hypothetical betting creates "noise" because people have different attitudes to gambling. However, for non-statisticians, it is the best tool to convert "gut feeling" into a number.

  ### The Point I Am Least Sure Of
  I am least certain about the **Decision Rule for Case 1 (The Village)**.
  I have recommended rejecting the scheme because the BCR is below 1.0. However, flood defence often carries a "Social Value" not captured in property prices. If the 200 houses include vulnerable residents, or if the village is culturally significant, the £4m consequence figure is wrong—it is too low.
  *   **The Risk:** If you follow my procedure strictly, you may defund socially critical protection.
  *   **The Fix:** Before rejecting Case 1, the Board must explicitly answer: *"Is £4m the true cost of flooding this village, including social disruption?"* If the Board votes that the true cost is higher, the math changes. If they agree £4m is the limit, the math holds.

  ---

  ## Glossary of Terms

  *   **Benefit–Cost Ratio (BCR):** A number showing value for money. If Benefits are £2 and Costs are £1, the ratio is 2. If it is below 1, you are losing money.
  *   **Envelope:** The full range covering all expert opinions, from the lowest low to the highest high.
  *   **Expected Loss:** The average amount of money you would lose per year (or per period) if you ran the scenario many times. Calculated as *Probability × Cost*.
  *   **Second-Order Uncertainty:** Uncertainty about your own estimates. (e.g., "I am not sure how sure I am.")
  *   **Shadow Ledger:** A separate record you keep internally that holds the true ranges, distinct from the single numbers submitted to the funding body.

  ---

  **Final Note:** This procedure will not make the uncertainty go away. It will make it visible. That will make your shortlist harder to rank in the short term, but it will stop you from being surprised when an asset fails that was marked "Green" on a false midpoint.
