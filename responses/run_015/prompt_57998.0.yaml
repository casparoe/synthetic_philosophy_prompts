  Okay so I've been arguing with my roommates about tourists and everyday stuff like tipping and queues and jaywalking becuase we had friends visit and everything got awkward.

  I wanna figure out what a good theory of when everyday conventions actually bind you would even have to do, before I pick a side. Like not just tipping is good or bad, but when does a local norm create a real obligation, and does it hit visitors the same way, especially when teh norm is kinda dumb or even a bit unfair.

  To make it concrete, here are the cases that are breaking my brain and any theory has to handle them:

  - my cousin's college town where if a cafe table has an empty chair you're supposed to leave it open for a stranger to just sit down, putting your backpack on it is treated like a moral failing, not just rude.
  - a food truck lot near me where there's a tip jar for the dish crew but all the regulars know the owner pockets it, so they tip zero on purpose. Are visitors who drop in a dollar doing the right thing or propping up a scam.
  - a city avenue where locals jaywalk all the time and drivers expect it and slow down, but drivers don't expect it from obvious outsiders, so if a visitor copies the locals it's actually dangerous.
  - a street festival where locals actually want visitors NOT to form a neat queue at the stalls but to crowd in, queuing politely gums everything up.

  Can you write me the desiderata for a theory of this stuff, like the full spec of what it has to explain, what cases it has to get right, what distinctions it can't collapse like moral obligation vs coordination benefit vs just not being a jerk, and what it has to say about bad or exploitative norms and about newcomers who never agreed to anything. Give the reason behind each requirement and tie each one to one of my cases. And tell me which requirements are non-negotiable vs just one camp's prejudice, whether any two on your list can't both be satisfied, and which single requirement knocks out the most simple views like you only owe what you consented to or you always owe what locals do.

  Please structure it exactly in this order:

  The Job - 3 to 4 sentences on what such a theory is for, like good enough to tell a visitor what they owe vs what's just nice.

  The Checklist - 7 to 9 items, each with a label plus 2 to 4 sentences on why it matters, aim for 400 to 600 words total for the whole section.

  Negotiable vs Non-negotiable - one short paragraph, maybe 100 words, sorting the list.

  The Squeeze - one paragraph, maybe 150 words, on which pair is hardest to hold together and which one item rules out the most theories.
