  The Job
  This theory must distinguish between genuine moral obligations and mere social coordination mechanisms, specifically for agents who haven't consented to local rules. It needs to determine when violating a norm harms others versus merely signaling outsider status, and when following a norm perpetuates injustice versus maintaining order. Ultimately, it should guide a visitor on when compliance is required for safety or fairness, and when deviation is permissible or even mandated.

  The Checklist
  **Consent Independence.** The theory cannot rely on explicit agreement, since visitors never signed a social contract upon arrival. It must explain why a tourist owes anything to a cafe culture they didn't choose, addressing the cafe table case where backpacks block strangers. It forces the theory to find grounds for duty beyond voluntary assumption, grounding obligation in presence and impact rather than signature.

  **Harm Minimization.** Compliance must be mandated when deviation causes physical or financial injury to any party. This handles the jaywalking case, where copying locals without their situational awareness endangers the visitor and surprises drivers. It ensures that norms serving safety bind tighter than those serving mere tradition, distinguishing between breaking a rule and causing an accident.

  **Coordination Value.** Some norms exist solely to prevent chaos, requiring adherence even if the rule seems arbitrary. This explains the festival queue case, where polite lining up actually slows service and crowds create better flow. The theory must recognize that efficiency can create obligation even without moral weight, preventing visitors from imposing external order that disrupts local functional equilibrium.

  **Complicity Check.** The theory must flag when following a norm supports corruption or theft, overriding coordination benefits. In the tip jar scam, dropping a dollar isn't polite; it funds the owner's deceit, so visitors should withhold tips despite local appearances. This prevents norms from laundering unethical behavior through tradition, ensuring that moral integrity trumps social smoothing when the system is rigged.

  **Epistemic Accessibility.** Obligations cannot depend on hidden knowledge unavailable to outsiders upon arrival. A visitor cannot be blamed for breaking the tip jar norm if the scam isn't obvious, but must adapt once informed. This balances fairness with responsibility, acknowledging the learning curve of travel, preventing punishing ignorance while demanding adaptation after reasonable exposure.

  **Expectation Alignment.** Rules should match what locals actually anticipate from outsiders, not just what they do themselves. Drivers expect locals to jaywalk but brake for tourists; the norm binds only if the counterpart's behavior adjusts accordingly. This ensures reciprocity in risk assessment, stopping visitors from being held to standards that locals know are unsafe for them.

  **Fairness Distribution.** Norms must not unfairly burden newcomers while benefiting insiders exclusively. The cafe table rule applies equally; if locals hog tables, visitors aren't bound to share, ensuring the resource norm is reciprocal. This prevents norms from becoming tools of exclusion or exploitation, ensuring that social contracts remain bilateral rather than extractive.

  **Moral vs. Prudential.** It must separate what is ethically required from what is merely safe or smart to do. Jaywalking might be morally neutral but prudentially risky for a visitor, requiring a distinction between obligation and caution. This clarifies whether violating the norm makes you bad or just clumsy, preventing conflating safety advice with moral duty.

  Negotiable vs Non-negotiable
  Non-negotiable requirements are those preventing harm and exploitation, specifically Harm Minimization and Complicity Check. These protect physical safety and prevent visitors from funding scams like the tip jar. Negotiable items include Coordination Value and Expectation Alignment, as these depend on local efficiency preferences rather than universal ethics. Consent Independence is non-negotiable because tourism inherently lacks contracts. Collapsing moral obligation into mere coordination is a prejudice that ignores the stakes of unfair norms.

  The Squeeze
  The hardest tension lies between Coordination Value and Complicity Check. Sometimes efficient coordination requires participating in a system that is subtly exploitative, forcing a choice between smooth social function and ethical purity. For instance, queuing at the festival might be efficient but if the stall owners are scams, coordination aids fraud. The single requirement that knocks out the most simple views is Consent Independence. It destroys the argument that visitors owe nothing because they didn't agree, but also kills the view that they must obey everything because they entered the space. It forces a nuanced middle ground where obligation arises from impact, not contract or geography.
