     - Confidence — one of: High / Medium / Low.

  3. A JSON object with exactly these fields, for my own use:
     - "truncation_limit": the limit of the expected value of G^{p,q}_N as N → ∞, as a formula in p and q, or a correction of mine.
     - "arithmetic_check": at most 80 words, confirming or correcting the harmonic-number asymptotics behind that limit.
