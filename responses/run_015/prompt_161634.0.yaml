prompt: |-
  I have to give the principal's address at this year's Speech Day at Ashgrove Comprehensive, and it is the last one: from September the school's ranked academic prizes — top of year, subject prizes, the honours board with its cumulative totals — are gone, replaced by a single certificate that every student receives, with no names read out in the hall. The money that funded the prizes is being folded into the general building fund, so no new tutoring, bursary or support for the students at the bottom is being created alongside the change; as far as anyone can tell, the only thing that will actually differ next year is that the students who used to win will stop winning. The governors passed it seven votes to six after two years of argument, and the hall will contain parents who campaigned for it, parents who fought it, staff who are split more or less down the middle, and — in the front row — our head of sixth form and our one philosophy teacher, both of whom know that I spent three years of a part-time doctorate writing about prioritarianism and the levelling-down objection before I left academia for teaching, and both of whom will read every sentence I say as a coded announcement of my own position. My daughter is in Year Nine and has never won anything. I have about ten minutes, I want to be honest rather than merely diplomatic, and I cannot be honest in a way that sounds like a manifesto.

  What I want from you is a speech in which that philosophical structure does real work by constraining what I can and cannot say. Two things in particular. First, I must not tell the room that we are doing this for the sake of the students at the bottom, because I don't think I believe that: if their prospects, their teaching, their confidence and their outcomes are all unchanged, then a view that gives priority to the worse off gives me no reason at all to welcome the change — and I'd be saying something I think false to the very students I'd be claiming to help. Second, I must not say that we have made things worse, or that the old system was fine, because that would be dishonest in the other direction and would land as a defence of an honours board whose main function, year after year, was to confirm to a few hundred children where they stood. Between those two silences there is something true to say about achievement, effort and being seen, and I want the speech to find it rather than to hover.

  The complication I keep going round in circles on, and which I'd like the speech to settle rather than dodge, is this. The case for abolishing the prizes appeals to a harm that is essentially comparative: the business of sitting in the hall year after year and being publicly known to be near the bottom. If that shame is a genuine component of a student's welfare, then removing its source is not levelling down at all — it is a real gain to the worst off, bought by taking away a good that only ever existed in the comparison. But if I grant that welfare is sensitive to rank at the bottom, I seem bound to grant it at the top as well, which means the winners suffer a real loss too, and then the question isn't whether the change is a pure levelling down but how to weigh a heavily weighted gain to the badly off against an unweighted loss to everyone else — a calculation I can't honestly present to a hall of parents as obvious. There is also the small fact that the athletics cup and the music prize are being kept, which the speech should use rather than ignore. Please write the address: roughly a thousand to twelve hundred words, addressed to a room of fourteen-to-eighteen-year-olds and their families, warm but not sentimental, with no jargon and no named theories — the two people who would catch the argument should recognise its shape without ever hearing me label it — and with the argument above doing the work of deciding which sentences I'm allowed to say.
reasoning: |-
  Here's a thinking process that leads to the speech:

  1.  **Analyze the Request:**

      *   **Context:** Principal's address at Speech Day, Ashgrove Comprehensive. Last year of the traditional system.
      *   **The Change:** From September, academic prizes (top of year, subject prizes, honours board) are abolished. Replaced by a single certificate for *every* student. No names read out. Prize money goes to the general building fund (no new bursaries/tutoring).
      *   **The Conflict:** Governors passed it 7-6 after two years of argument. Room is split (parents, staff).
      *   **The Speaker:** Former academic (part-time doctorate on prioritarianism/levelling-down objection), now Principal. Daughter in Year 9 (never won anything).
      *   **The Audience:** Students (14-18), families, staff. Specifically, the Head of Sixth Form and Philosophy Teacher know the speaker's background and will listen for coded philosophical positions.
      *   **Constraints/Philosophical Guardrails:**
          1.  *Cannot claim it's for the students at the bottom:* If their outcomes/teaching don't change, a prioritarian view offers no reason to welcome the change. Saying otherwise is false/harmful.
          2.  *Cannot claim the old system was fine or that things are getting worse:* That defends a system that shamed many.
          3.  *Must address the "Comparative Harm" complication:* If shame at the bottom is real harm, removing it is a gain, not levelling down. But if rank matters at the bottom, it matters at the top (winners lose status). So it's a trade-off, not a pure moral victory.
          4.  *Must acknowledge the exceptions:* Athletics cup and Music prize remain.
          5.  *Tone:* Warm but not sentimental. Honest, not diplomatic/manifesto-like. No jargon/named theories (but the structure must be recognizable to the philosophy colleagues).
          6.  *Length:* 1000-1200 words.

  2.  **Deconstruct the Philosophical Argument (The "Hidden Structure"):**

      *   *Levelling Down Objection:* Usually, making everyone equal by taking away from the better off (without giving to the worse off) is bad.
      *   *Prioritarianism:* Giving priority to the worse off.
      *   *The Twist:* The prompt suggests the "harm" of the old system was *comparative shame*. If we remove the comparison, do we remove the harm?
      *   *The Constraint:* I can't say "we are helping the bottom" (because resources aren't changing). I can't say "we are hurting the top" (because that sounds like vindictiveness or admitting loss of value).
      *   *The Solution:* Focus on the *nature* of the recognition. Shift from *ranking* to *acknowledgement*. Acknowledge that while the "loss" to high achievers is real (loss of exclusive status), the "gain" to others is the removal of a specific kind of public negation.
      *   *The Athletics/Music Exception:* This is crucial. It shows we aren't abolishing *excellence*, we are abolishing *academic ranking*. Why? Because sport/music are often team-based or performance-based in a way that doesn't map strictly to "intellectual worth" in the same hierarchical way. Or, more subtly, they are *optional* arenas of competition, whereas academic ranking feels like a judgment on the *person*.
      *   *The "Truth" to find:* Achievement is real, but public ranking distorts it. We are moving from a culture of *placement* to a culture of *presence*.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone. Acknowledge the tradition. Set the scene (the last time).
      *   **The Announcement:** State the change clearly. No prizes, one certificate for all.
      *   **Addressing the "Why" (The Tightrope):**
          *   Avoid: "We are doing this to help the struggling students" (False, no new resources).
          *   Avoid: "The old system was unjust" (Too aggressive/manifesto).
          *   Instead: Focus on what the ceremony *does* to us. The psychology of the hall.
      *   **The Comparative Harm (The Core Argument):**
          *   Acknowledge the winners' loss (subtly). Their effort is real.
          *   Acknowledge the non-winners' experience. It's not just about not winning; it's about being defined by *not* winning.
          *   The "Levelling Down" nuance: We aren't saying high achievement doesn't matter. We are saying *this specific mechanism* of celebrating it creates a shadow that is too long.
      *   **The Exceptions (Sport/Music):**
          *   Why keep them? Because they celebrate *performance* in a moment, not *worth* over a year. Or because they are chosen pursuits vs. compulsory curriculum. Let's go with: They celebrate a specific event/skill, not a hierarchy of human value.
      *   **The Daughter/Personal Touch:** Mentioning the daughter without making it about her. She represents the majority.
      *   **Closing:** Look forward. What matters next year. Effort, growth, community.

  4.  **Refining the Tone and Constraints:**

      *   *Check:* Am I claiming the bottom students get better outcomes? *No.* I must focus on the *experience* of the ceremony, not the material outcome.
      *   *Check:* Am I insulting the winners? *No.* Acknowledge their effort is real, but the *reward structure* is changing.
      *   *Check:* Is the philosophy visible? To the colleagues: Yes, they'll see the rejection of pure egalitarianism (we keep sport/music) and the rejection of pure meritocracy (we stop ranking). They'll see the focus on the *badness of the bottom state* being the driver, without claiming the bottom state materially improves.
      *   *Word Count:* Need to expand on the nuance of "recognition" to hit 1000-1200 words.

  5.  **Drafting - Iteration 1 (Mental Outline & Key Phrases):**
      *   "This is the last time we read names."
      *   "Next year, everyone gets a certificate."
      *   "Money goes to bricks, not bursaries." (Be careful here, don't sound cynical).
      *   "Sport and Music stay. Why?"
      *   "Ranking tells you where you are, not who you are."
      *   "To the winners: Your work matters."
      *   "To the others: You are not defined by absence of a prize."

  6.  **Drafting - Writing the Speech (incorporating the constraints):**

      *   *Self-Correction during writing:* I need to make sure I don't sound like I'm saying "Winning is bad." I need to say "Winning is good, but *only* winning is a narrow way to see a school."
      *   *The "Levelling Down" trap:* If I say "We are removing shame," I imply the winners lose status. I need to frame this as shifting the *currency* of the school.
      *   *The Philosophy Teacher Test:* They need to see that I understand that if welfare is relative, changing the scale changes the welfare. I need to articulate that the *scale itself* was the problem, not the distribution of prizes.

  7.  **Final Polish:**
      *   Check word count.
      *   Ensure no jargon ("prioritarianism," "utilitarian," etc.).
      *   Ensure the "daughter" mention is subtle but humanizing.
      *   Ensure the "building fund" mention doesn't sound like theft.

  *(Self-Correction on the Building Fund)*: The prompt says "money... folded into general building fund, so no new tutoring... is being created." I shouldn't highlight this negatively, but I can't lie and say it helps the poor. I will treat it as neutral context or omit the specific destination to focus on the *principle*. Actually, the prompt says "I want to be honest." I should acknowledge the money isn't creating new support. I'll phrase it as "resources are being redirected to the school's infrastructure, not reallocated as cash awards."

  *(Refining the Argument on Comparative Harm)*: The prompt says: "If that shame is a genuine component of a student's welfare, then removing its source is not levelling down at all." I need to walk this line. I can say the *experience* of the hall is what we are changing. The *welfare* impact of public ranking.

  Let's write.

  *(Word Count Check)*: Aiming for ~1100 words.
  *(Tone Check)*: Warm, authoritative, reflective.

  *(Final check on constraints)*:
  1. No "helping the bottom" via resources claim.
  2. No "old system was fine" claim.
  3. Acknowledge sport/music exception.
  4. No jargon.
  5. Philosophical structure visible to colleagues (focus on comparative welfare vs absolute gain).

  Let's begin.cw
answer: |-
  Good morning. Welcome to Ashgrove Comprehensive for our annual Speech Day. It is a pleasure to see so many families here, and to see our students looking as they should on a day like this: proud, slightly nervous, and ready to be recognised.

  I want to begin by acknowledging that this is a particular kind of morning. It is the last time we will gather in this hall under the rules we have known for decades. From September, the architecture of our celebration will change. There will be no subject prizes. There will be no 'Top of the Year' awards. The honours board in the foyer will not be updated with cumulative totals. Instead, every student will receive a single certificate of achievement, and no names will be read out in this hall.

  I know this decision has been debated. I know it divides opinion. Some of you have campaigned for it; others have fought it. The staff room is not of one mind, and the governing body passed the motion by the slimmest of margins. I am not standing here to pretend that this is a simple matter of progress, nor am I here to defend the past as if it were without fault. I want to speak honestly about what we are doing, and why.

  It would be easy to say that we are doing this to help those who have struggled. It would be comforting to tell you that the money which funded these prizes is being used to create new bursaries, or to fund extra tutoring for those who need it most. But I will not say that, because it is not true. The funds are being folded into the general building budget. The material support for the students who find school difficult will not change next year. Their teaching will be the same. Their prospects will be the same. If I stood here and claimed that removing prizes would materially lift the outcomes of the struggling, I would be lying to the very students I claim to champion. We are not redistributing wealth; we are redistributing attention.

  Nor will I stand here and tell you that the old system was without merit. It recognised hard work. It gave tangible goals to ambitious students. To say that those achievements were meaningless would be to disrespect the effort that went into them. The students who won prizes earned them. They should be proud of what they did, and they should know that their academic success is real, regardless of whether it is announced on a stage.

  So, if we are not materially helping the bottom, and we are not saying the top achieved nothing, why make the change?

  The answer lies in the nature of this room, and the nature of the ceremony we are ending. For years, we have asked a large group of young people to sit together and be measured against one another in public. We have asked them to accept that their worth in this specific context is determined by their distance from the person sitting next to them.

  There is a specific kind of harm in being publicly ranked. It is not just the disappointment of not winning. It is the experience of sitting in a hall and knowing that the ceremony is designed to highlight your absence. When we make recognition exclusive, we make non-recognition a public state of being. For some, this is a spur. For many, it is a shadow. It tells a student that their year of effort, their improvements, their resilience, counts for nothing in this forum because someone else did slightly better.

  We have decided that the cost of that shadow is too high. We are not saying that high achievement does not matter. We are saying that celebrating it in this specific way—by contrasting it explicitly with the lack of it in others—creates a dynamic that no longer serves the community we want to be. We are choosing to value the presence of every student over the ranking of a few.

  You will notice, however, that we are not abolishing competition entirely. The Athletics Cup and the Music Prize will remain. This is not an inconsistency; it is a distinction. Sport and music, in our context, are arenas of performance that students opt into. They celebrate a specific skill displayed on a specific day, or a contribution to a team. They do not claim to measure the total worth of a child over a year of compulsory education. We can cheer for a goal or a solo without implying that those who did not play are lesser students. Academic ranking, by contrast, often feels like a judgment on the person, not just the performance. We are keeping the stages where you choose to perform; we are removing the stage where you are judged simply for being here.

  I have a daughter in Year Nine. She has never won an academic prize. I know what it is to sit in these seats and watch another name read out. I also know what it is to mark exams and see the narrow margins that separate a prize from a near-miss. I know that ability is distributed unequally, and that effort does not always correlate with grades. But I also know that a school is not a marketplace. It is a place where we learn to live together.

  To the students who have won prizes in the past: I know you may feel a loss. You are losing a public marker of your distinction. That feeling is real. But your distinction does not vanish because the ceremony changes. Your teachers know what you can do. Your university applications will show what you have achieved. You are not being penalised; you are being asked to carry your success quietly, as part of your character rather than as a trophy on a wall.

  To the students who have not won: You are not being given a gift you did not earn. You are being relieved of a burden you did not deserve. Next year, when you sit in this hall, you will not be waiting to hear if you are invisible. You will be here as members of this school, full stop.

  This is not a perfect solution. It does not solve inequality. It does not fix the gaps in attainment that exist before a student even walks through our gates. It is simply a change in how we look at each other. We are deciding that the welfare of this community is damaged by a system that requires some to be unseen so that others can be highlighted. We are deciding that the gain of removing that public shame outweighs the loss of the public honour.

  Next year, when you receive your certificate, it will look the same as everyone else's. It will not tell you where you stand. It will tell you that you stood. It will tell you that you finished. And in a world that is obsessed with ranking, with metrics, with being better than, I think there is a quiet power in simply being recognised as present, as effortful, and as enough.

  Thank you for coming. Thank you for your children. And thank you for listening. Let us move forward together.
