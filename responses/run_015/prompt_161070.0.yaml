  10. **Final Polish:** Ensure the voice sounds like a philosopher speaking to a bright student (respectful, precise, encouraging critical thinking). *Wait, one constraint:* "before you write anything final, brainstorm: generate a long list of candidate precise claims... then discard..." -> I should explicitly show this brainstorming phase in the output or at least demonstrate that process occurred. The prompt says "before you write anything final, brainstorm...". I will include a section explicitly showing the raw brainstorm and filtering to demonstrate the process requested.

