      *   *Relationship:* They are orthogonal but clash on *obligation*.
      *   *Is it the same reading?* It's distinct from the descriptive "nature is violent" claim. It's a meta-ethical claim about the nature of "wrongness."
      *   *Threat to Provenance:* If "wrongness" requires an agent, then Provenance Principle is false by definition. But if "badness" (axiological) is separate from "wrongness" (deontic), they can coexist. Need to clarify Bad vs. Wrong.

  7.  **Critiquing the Setup:**
      *   *Is the slogan doing work?* No, it's a rhetorical shield. It conflates description with prescription.
      *   *Is Provenance Principle circular?* No, but it assumes welfarism. Priya assumes agent-relative ethics.
