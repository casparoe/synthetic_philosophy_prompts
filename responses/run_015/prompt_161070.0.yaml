          4.  Normative (Naturalistic): Natural processes are inherently valuable/right. (The "Appeal to Nature")
          5.  Normative (Agency): Moral obligations require a moral agent cause. (The "No-Author" claim)
          6.  Normative (Priority): Ecosystem integrity > Individual welfare. (Ecocentrism)
          7.  Radical/Nihilistic: Suffering in nature is meaningless/neutral. (The "Cosmic Indifference" claim)

  5.  **Analyzing the Orphan Ridge Case:**
      *   *Rancher:* "Put wolves back... let things work." -> Appeals to Ecosystem Integrity/Process Value.
      *   *Rescuer:* "Don't add predator... kills fawns." -> Appeals to Individual Suffering/Harm.
      *   *Conflict:* Both use the same slogan to mean different underlying claims.
      *   *Rancher:* "Red in tooth and claw" = Functional necessity.
      *   *Rescuer:* "Red in tooth and claw" = Gratuitous violence to be minimized.
      *   *Coherence:* The slogan itself is too vague to support either without extra premises.

  6.  **Addressing the "No-Author" Claim vs. Provenance Principle:**
      *   *Priya's Claim:* No author = No wrong. (Agent-relative obligation?)
