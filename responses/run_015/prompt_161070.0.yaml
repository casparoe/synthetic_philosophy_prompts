      *Filtering:* 1 & 2 collapse to "Violence exists." 3 is historical. 4 is empirical capability. 5 is normative. 6 is value of naturalness. 7 is about justice. 8/9 are about human status. 10 is teleological. 11 is consequentialist. 12 is meta-ethical. 13/14 are status of nature. 15 is resource allocation.

