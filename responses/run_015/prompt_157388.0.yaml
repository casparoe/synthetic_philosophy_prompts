answer: |-
  Here is a decision procedure designed for your constraints: 30 minutes, no new experiments, existing logs/weights only. It treats "implements" as a claim about **causal structure**, not just input-output matching.

  ### The Procedure: Four Gates

  For a claim "System S implements Computation C":

  #### Gate 1: Independent Grounding (I/O and Time)
  **Question:** Can you identify the physical inputs, outputs, and "timesteps" without looking at whether the data fits the model?
  **Sufficient Answer:**
  *   **I/O:** Pins or voltage ranges are designated as I/O in the hardware spec *before* training, or correspond to obvious physical interfaces (e.g., sensor voltage in, motor voltage out).
  *   **Time:** Since there is no clock, "timesteps" must be defined by physical events (e.g., "signal settles," "threshold crossed") or fixed windows defined in the benchmark protocol, not chosen to maximize correlation.
  **Fail (Don't Ship):** If the definition of "input" or "step" was adjusted *after* seeing the results to make the curves align.
  **Hand to Human:** If the physical boundaries are ambiguous (e.g., is the power supply noise part of the computation?), but the rest of the gates pass strongly.

  #### Gate 2: Counterfactual Robustness (The Workhorse)
  **Question:** If we change the input to something the system *never saw* during training or benchmarking, does the output change in the way Computation C predicts, within noise tolerance?
  **Sufficient Answer:**
  *   Logs show performance on "out-of-distribution" inputs (noise injections, rotated images, novel stimuli).
  *   The system degrades *gracefully* (like the model C would) rather than catastrophically or randomly.
  *   **Noise Tolerance:** If the model C is deterministic but S is noisy, the *average* trajectory of S must match C. If the model C is probabilistic, S's distribution must match.
  **Fail (Don't Ship):** If the match only holds for the exact test set used for validation, or if small noise perturbations cause the "computation" to vanish (i.e., the mapping breaks under slight physical variation).
  **Hand to Human:** If the logs show robustness, but you can't tell if it's due to the architecture or just overfitting, and no ablation data exists.

  #### Gate 3: Mechanistic Isomorphism (The Lookup Table Killer)
  **Question:** Do the internal physical states of S track the internal variables of C?
  **Sufficient Answer:**
  *   If C has a specific intermediate variable (e.g., a "prediction error" signal in predictive coding), there must be a specific voltage or group of neurons in S that correlates with that variable *independently* of the final output.
  *   Weights/Config show the connectivity matches the topology of C (e.g., feedback loops exist where C requires them).
  **Fail (Don't Ship):** If S produces the right output but has no internal structure corresponding to C's steps (e.g., a lookup table, or a dense feedforward net claiming to be a recurrent circuit).
  **Hand to Human:** If the internal signals are noisy/entangled, making it unclear if a specific voltage *is* the variable or just correlated with it.

  #### Gate 4: Mapping Simplicity (The Brick Wall Stopper)
  **Question:** Is the rule for translating Physical State → Computational State simpler than the computation itself?
  **Sufficient Answer:**
  *   The translation is linear or piecewise linear (e.g., "Voltage > 0.5V is Bit 1").
  *   It does not require a complex, unique lookup table for every single run.
  **Fail (Don't Ship):** If describing the mapping requires more information than describing the computation (e.g., "This specific voltage means '0' on Tuesday, but '1' on Friday" without a physical cause).
  **Hand to Human:** If the mapping is complex but physically motivated (e.g., requires calibration due to temperature).

  ---

  ### The Workhorse: Gate 2 (Counterfactual Robustness)

  **Why:** This gate does the heavy philosophical lifting. It distinguishes a system that *computes* from a system that merely *records*. A recording of a correct output matches the data, but if you poke it (change the input), it won't respond correctly. A brick wall can be mapped to a program if you only look at one moment in time; it fails when you demand it handle inputs it isn't currently receiving.

  **If this gate is indefensible:** If you cannot verify counterfactuals (because you have no off-distribution logs), the entire procedure collapses into curve-fitting. You cannot claim "implementation," only "observation." You would have to downgrade all claims from "Loom implements X" to "Loom's behavior resembles X on benchmark Y."

  ### The Judgment Calls (Checklist in Costume)

  These steps look objective but require human intuition. Mark these clearly in your review notes:

  1.  **Noise Tolerance Threshold:** You must decide if 5% noise is "close enough" to deterministic. There is no math for this; it depends on how critical the application is.
  2.  **Granularity of State:** Deciding whether a single voltage is a "state" or whether you need to average 100ms of signal is arbitrary. You are judging *naturalness*, not truth.
  3.  **Drift Acceptance:** If the chip drifts between Monday and Friday, is it the "same" computer? If it requires recalibration, it's an instrument, not a processor. You must decide where that line is.

  ---

  ### Running the Procedure

  #### Case 1: 'Loom-3 implements a predictive-coding model of mouse V1.'
  *Evidence:* 78% variance match, loose inspiration, no ablations, 5% noise.

  1.  **Grounding:** Pass. (Assume I/O pins are standard).
  2.  **Robustness:** **Hand to Human.** 78% variance is good, but "no off-distribution tests" means we don't know if it's predictive coding or just a good regressor. Predictive coding makes specific claims about how errors are handled; without probing errors, we can't verify counterfactuals.
  3.  **Mechanism:** **Fail/Hand to Human.** "Loosely inspired" + "no ablations" means we don't know if internal units actually track prediction errors.
  4.  **Simplicity:** Pass.

  **Verdict:** **Hand to Human.**
  **Reasoning:** You cannot verify the "Predictive Coding" part without seeing the error signals (Mechanism) or testing how it handles surprising inputs (Robustness). 78% match on standard benchmarks is consistent with many non-predictive-coding models.
  **Action:** Downgrade claim to "Loom-3 activity correlates with mouse V1 responses on benchmark X."

  #### Case 2: 'The distilled lookup table on our microcontroller implements the same model.'
  *Evidence:* 40 rows, perfect fit, no noise, formal pass.

  1.  **Grounding:** Pass.
  2.  **Robustness:** Pass (assuming the table covers the input space).
  3.  **Mechanism:** **Fail.**
      *   *Check:* Does the lookup table have internal variables corresponding to "prediction errors" or "feedback loops"?
      *   *Result:* No. It has memory addresses and values. The causal structure of a lookup table (Address → Data) is fundamentally different from a neural circuit (Weighted Sum → Nonlinearity → Feedback).
  4.  **Simplicity:** Pass.

  **Verdict:** **Don't Ship.**
  **Reasoning:** It implements the same *function* (input-output map), but not the same *model* (computational process). Gate 3 kills this. If you ship this, you are lying about the mechanism.
  **Action:** Change claim to "implements the same input-output function."

  #### Case 3: Two incompatible descriptions fit equally well.
  *Evidence:* Predictive-coding vs. Feedforward-with-normalization. Logs identical.

  1.  **Grounding:** Pass.
  2.  **Robustness:** Pass (both fit).
  3.  **Mechanism:** **Hand to Human.**
      *   *Check:* Do the logs distinguish the two?
      *   *Result:* No. The evidence is underdetermined.
  4.  **Simplicity:** Pass.

  **Verdict:** **Hand to Human.**
  **Reasoning:** This is a scientific theory choice, not an engineering verification. The procedure cannot resolve which story is "true" if the physical evidence is identical.
  **Action:** Ship the claim only if phrased disjunctively ("consistent with...") or pick the one the Scientific Advisor prefers, acknowledging it is a theoretical stance, not a measured fact.

  ---

  ### The Unsolvable Class: Representation

  You asked about: *"Whether a voltage level on our chip literally stands for a quantity or merely causes a downstream effect."*

  **Status:** The procedure **cannot settle this.**

  **Why:** This is the problem of **Semantics** (or Intentionality).
  *   **Causal Role:** Your procedure can verify that Voltage V *causes* Effect E (Gate 2 & 3).
  *   **Representation:** Your procedure cannot verify that Voltage V *means* Number N.

  **Example:** A thermostat voltage causes the heater to turn off. Does that voltage *represent* "70 degrees"? Or does it just *cause* "heater off"? Physically, these are identical. The difference is in the eye of the beholder (you, the user, the grant writer).

  **Implication for Loom:**
  You can claim: "Voltage V controls Actuator A." (Causal, Shipable).
  You cannot claim: "Voltage V *encodes* the concept of Depth." (Semantic, Unverifiable).

  **Rule:** If a claim uses words like *represents, encodes, stands for, means, understands*, flag it. These require a theory of mind or semantics that your logs cannot provide. Downgrade these to *correlates with, controls, drives, tracks*.

  ### Summary for your 30 Minutes

  1.  **Check I/O:** Did we define the pins before looking at the win?
  2.  **Check Counterfactuals:** Do we have logs for inputs we didn't train on? (If no, **Hand to Human**).
  3.  **Check Structure:** Do the internal wires/signals look like the model's diagram? (If no, **Don't Ship** "Model" claims).
  4.  **Check Semantics:** Are we claiming the chip "knows" something? (If yes, **Downgrade** to causal language).

  If Gate 2 (Counterfactuals) is removed, you are selling curve-fitting. If Gate 3 (Structure) is removed, you are selling lookup tables as brains. Keep both.
