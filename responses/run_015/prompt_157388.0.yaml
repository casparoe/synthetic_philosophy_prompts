prompt: |-
  hi — I'm a software engineer at a small hardware startup, no philsophy training beyond a couple of Wikipedia afternoons, so please skip the jargon or define it when you use it.

  We build a chip called Loom: analog, no clock, noisy, continuous voltages rather than bits, and its behaviour is set by training rather than by anything anyone wrote down. Our website and our grant applications are full of sentences like 'Loom implements a predictive-coding model of visual cortex' or 'the chip computes the same function as this cortical circuit'. I'm the one who has to vet those sentences before they ship — one or two a week — and anything that survives has to be signed off by our comms lead and one external scientific advisor. I get about thirty minutes per sentence, I can't run new experiments, and all I have is the training config, the weights, and whatever benchmark logs and ablations happen to exist for that build. I don't need to settle whether brains are computers; I need to know which sentences we can ship. Please don't give me reading lists or citations, I have no library access and no interest in names of papers.

  Somebody down the pub told me there's an argument that, with the right choice of mapping, a brick wall 'implements' any program you like, and someone else said the way out is to demand that the mapping track the system's causal structure — including what it would do on inputs it never actually receives. I have no idea whether either of those is a real position. What I want is a procedure my team can run.

  So: write me a decision procedure, ordered gates, that takes a claim of the form 'system S implements computation C' and returns ship / don't ship / hand to a human. For each gate, give me the question, what counts as a sufficient answer when your only evidence is existing logs and weights, the point at which it just returns NO, and the point where it stops and hands the decision to a person because it's a question about what we care about rather than a fact. It has to cope with:

  - no written-down program — the description has to be recovered from behaviour; say how much probing is enough and what to do when we can't probe further
  - no clock and no discrete states — what gets to count as a state, an input token, and a timestep, and what to do when there's no non-arbitrary answer
  - noise, so transitions are only approximately deterministic — how close is close enough, and what to do when we can't measure it
  - behaviour that drifts within a session, so the same input gives different outputs on Monday and Friday
  - the brick-wall problem: a gate that stops a gerrymandered mapping — one chosen after seeing the data, disjunctive, or absurdly fine-grained — from passing; and be honest about what including that gate costs us

  Tell me which single gate is doing most of the work, and what happens to the whole procedure if that gate turns out to be indefensible. Mark clearly which steps are judgment calls in a checklist costume.

  Then run it on three claims, in front of me:

  1. 'Loom-3 implements a predictive-coding model of mouse V1.' Evidence: it matches 78% of the explained variance in a neural benchmark, the architecture was loosely inspired by predictive coding, we have no ablations, no off-distribution tests, and per-unit noise of about five percent.
  2. 'The distilled lookup table on our microcontroller implements the same model.' Forty rows, fits the benchmark perfectly, no noise, passes anything you'd check formally. If my procedure says ship on this one it's useless, so show me what it actually does here.
  3. A case where two incompatible descriptions — a predictive-coding one and a plain feedforward-with-learned-normalisation one — fit the same logs equally well, and picking between them looks like it depends on what we're trying to explain rather than on any fact about the chip.

  Finally, name the classes of claim the procedure simply can't settle, including the one that keeps coming up for us: whether a voltage level on our chip literally stands for a quantity or merely causes a downstream effect.
