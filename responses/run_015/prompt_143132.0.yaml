      Dear Colleague, regarding your upcoming workshop on decision theory for engineers, I have designed a session plan that relies on a simple betting game to demonstrate the boundary conditions of Good's theorem regarding the value of information. The session is designed to run for exactly sixty minutes with twelve participants and requires only basic materials such as printed scorecards, pens, a standard six-sided die or a random number generator app projected on a screen, and a whiteboard for tracking aggregate scores. The core activity is a repeated decision task where participants act as agents choosing between two actions based on a hidden state of the world, with the critical twist being a rule that restricts how they may process information if they choose to acquire it. You should begin the session by spending the first ten minutes introducing the concept of expected value and setting up the narrative that the participants are autonomous agents optimizing a reward function, without yet mentioning Good's theorem or the specific philosophical lesson to avoid biasing their choices.

      The game mechanics should be explained clearly during this introduction, establishing that there is a hidden state for each round which is either State A or State B, generated with a fixed probability that you keep secret initially but which favors State A significantly, specifically occurring eighty percent of the time. Participants earn ten points for correctly matching their action to the state and lose five points for a mismatch, and they will play ten rounds to allow statistical trends to emerge. The crucial mechanic involves an option presented at the start of each round where players can choose to receive a Signal or decline it, but if they choose to receive the Signal they must sign a binding contract on their scorecard stating they will match their action exactly to the Signal recommendation, whereas if they decline the Signal they are free to choose any action they wish based on their own reasoning. The Signal itself is generated to be accurate only seventy percent of the time, which is intentionally lower than the eighty percent base rate of State A, creating a scenario where the information is technically free but structurally harmful due to the commitment constraint attached to it.

      For the next thirty minutes, you will run the ten rounds of the game, pausing briefly between rounds to reveal the hidden state and allow players to update their scores, ensuring that you enforce the binding contract rule strictly so that any player who opted for the Signal is disqualified if they deviate from it. You should observe that in the early rounds many participants will likely opt for the Signal because engineers generally intuit that more data is better, but as the rounds progress and scores are visible, they should notice that the players who declined the Signal and consistently chose State A are accumulating points faster than those who followed the noisy Signal. This experiential discovery is vital because it allows them to feel the negative expected value of information before you explain the theory, creating a cognitive hook for the subsequent lesson. You should act as the banker and referee, tracking the global state on the whiteboard so everyone sees the same eighty twenty distribution over time, which validates the strategy of ignoring the signal in hindsight.

      The final twenty minutes are reserved for the debrief where you connect their gameplay experience to the formal decision theory, starting by asking the group why their scores diverged and guiding them to realize that the information itself was not the problem but rather their inability to ignore it when it conflicted with the stronger prior. This is the moment to introduce Good's theorem, explaining that the theorem proves the expected value of information is non-negative only under the assumption that the agent is free to act optimally after receiving the information, meaning they can choose to ignore the signal if the prior is stronger. You should map the game rules directly to this condition, pointing out that the binding contract they signed represented a failure of the free action condition, effectively forcing them to subordinate a high accuracy prior to a lower accuracy signal, which is why their expected value dropped. This connects the abstract mathematical boundary condition to a tangible rule they violated or suffered under, reinforcing the lesson that information value is contingent on the agent's flexibility to utilize it optimally.

      To conclude the session honestly, you must include a verbal note about a feature of the theorem that this simulation cannot reproduce, which is that in the real world the constraint is rarely a formal contract but rather a cognitive bias or organizational policy that feels invisible to the agent. In the game, the restriction was explicit and known, whereas in professional engineering contexts the inability to ignore information often stems from psychological sunk cost fallacies or rigid deployment pipelines that prevent rolling back changes based on new data, meaning the negative value of information is often hidden until after the damage is done. You should emphasize that while the game hardcodes the trap to ensure the lesson lands, the real challenge lies in recognizing when their own decision processes have become implicitly committed to acting on signals that are weaker than their existing knowledge, which is the true practical application of understanding the boundary conditions of rationality. This approach ensures your colleagues leave with both a visceral understanding of the risk and a theoretical framework to analyze their own decision pipelines without needing a formal background in philosophy.

