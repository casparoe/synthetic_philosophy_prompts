prompt: |-
  I am a software engineer with no formal background in philosophy, and I am organizing a one-hour workshop for approximately twelve colleagues who work in technology but have little exposure to decision theory or philosophy of rationality. I would like you to design a runnable classroom game or structured activity that makes the participants feel, through their own choices and payoffs, the specific force of Good's theorem on the value of information, but focused on its less commonly discussed boundary: that an accurate signal can have negative expected value when the agent is committed to a fixed response rule or is otherwise unable to adapt their action optimally after receiving it. The rules and incentives should be arranged so that players experience this harmful effect directly in the first rounds, discovering on their own that accepting free information lowered their scores, and only in the debrief afterward should the facilitator map this onto the failure of the free-action condition that makes Good's result hold. Please specify a clear timeline for the sixty-minute session, the materials needed, the number and nature of roles if any, a payoff scheme that uses points rather than real money, the rules that create the commitment trap, and a debrief structure that connects specific moments in play to the formal distinction between information value under optimal adaptation versus under constraint. Also include an honest note about which feature of the theorem this simulation necessarily cannot reproduce and must be supplied by verbal explanation. Please provide your answer entirely as continuous prose, without headings, bullet points, bold text, tables, or other formatting, as if writing a single letter or email.
