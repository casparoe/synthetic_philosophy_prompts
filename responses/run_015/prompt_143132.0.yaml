      *   **Key Constraint 4:** Include an honest note about what the simulation cannot reproduce (must be explained verbally).
      *   **Duration:** 60 minutes.
      *   **Participants:** ~12 people.
      *   **Materials:** Points (not real money), simple props.

  2.  **Deconstruct Good's Theorem:**
      *   Standard Good's Theorem: Expected utility of obtaining free information is non-negative (assuming optimal action selection after receiving info).
      *   The Twist/Nuance: If the agent is *constrained* to a fixed policy or cannot update their action rule optimally based on the new information, the information can be harmful (distraction, bias, commitment trap).
      *   Workshop Goal: Create a scenario where getting info forces a suboptimal action or locks them into a rule that performs worse than ignoring the info.

  3.  **Design the Game:**
      *   *Scenario:* A prediction or decision task. Let's say guessing a state of the world (Hidden Color/Number).
      *   *Mechanism:* Players need to choose Action A or Action B. Payoff depends on State X or Y.
      *   *The Trap:* Normally, info about State helps choose A or B. To make info harmful, we need a constraint.
      *   *Constraint Idea:* Pre-commitment. Players must declare a strategy *before* seeing the info, but the info is revealed *after* commitment? No, that makes info useless, not harmful.
      *   *Constraint Idea 2:* The info triggers a psychological bias or a rigid rule.
      *   *Constraint Idea 3 (Better for SEs):* Hard-coded logic. Players are "agents" running code. They must write a function `decide(signal)` that maps signal to action. But the twist is that the "signal" is correlated with the state in a way that *misleads* the specific fixed function they are forced to use, or the cost of processing the signal imposes a penalty.
      *   *Constraint Idea 4 (The "Commitment Trap"):* Players are forced to adopt a specific response rule if they accept the information. If they decline information, they can choose freely.
      *   *Refined Mechanism:*
          *   Round 1: No info. Choose Left or Right. Payoff depends on Hidden State (Red/Blue). Optimal strategy is to pick the majority state (say 60% Red).
          *   Round 2: Option to get Info (Signal). If you take Info, you *must* follow a prescribed rule (e.g., "If Signal says Red, pick Left; if Blue, pick Right"). If you decline Info, you pick freely.
          *   *The Catch:* The prescribed rule is slightly worse than the baseline heuristic because the signal is noisy or the rule is rigid.
          *   *Wait, Good's Theorem says info is valuable if you act optimally.* To show negative value, the players must be *unable* to act optimally given the info.
          *   *Implementation:* Divide players into two groups or have them choose a "mode". Mode A: No Info, Free Choice. Mode B: Free Info, Fixed Policy.
          *   *Better:* Everyone plays multiple rounds. In some rounds, they are "Constrained Agents" (must follow signal), in others "Free Agents".
          *   *Best for "Feeling" the harm:* Let them choose whether to buy/accept info. If they accept, they are bound by a contract to follow the signal's recommendation literally. If they decline, they can ignore it. The signal is designed such that following it literally yields lower expected utility than ignoring it and sticking to the prior, due to noise or bias in the signal generation vs the payoff structure.
          *   *Actually, let's make it simpler:* The "Constraint" is the key. The game rules will state: "If you view the Signal, you are legally bound to match your action to the Signal." If you don't view it, you can do whatever. The Signal is accurate enough to look tempting (e.g., 70% accurate) but the Payoff Structure is asymmetric such that the Prior (e.g., 90% State A) is safer than following the noisy signal.
          *   *Wait, if Signal is 70% accurate and Prior is 90% State A, rational agents shouldn't take the signal if they can ignore it. But if they take it, they must follow it.*
          *   *The Lesson:* Information is harmful if it compels you to override a superior prior with an inferior signal due to a constraint on how you process it.
          *   *Revised Game Design:*
              *   State: Hidden Coin (Heads 80%, Tails 20%).
              *   Action: Guess Heads or Tails.
              *   Payoff: Correct = +10 points. Incorrect = -5 points.
              *   Baseline: Always guess Heads. Expected Value = 0.8*10 + 0.2*(-5) = 8 - 1 = 7.
              *   Signal Option: You can pay 0 points to see a Signal. Signal is 75% accurate.
              *   Constraint: If you look at the Signal, you *must* guess what the Signal says. You cannot say "Signal says Tails, but I know Heads is more likely, so I guess Heads."
              *   Signal EV: 0.75*10 + 0.25*(-5) = 7.5 - 1.25 = 6.25.
              *   Result: Looking at signal (6.25) is worse than ignoring it (7.0).
              *   This perfectly demonstrates the boundary condition: Good's theorem assumes you can ignore the signal if the prior is stronger. Here, the rule forces you to use it.

  4.  **Drafting the Content (incorporating constraints):**
      *   Tone: Professional, instructional, email/letter style.
      *   Format: Continuous prose only. No bolding, no lists.
      *   Sections to weave in: Intro, Timeline, Materials, Roles, Rules/Payoffs, The Trap, Debrief, Limitation Note.

  5.  **Refining the Narrative Flow:**
      *   Start with a greeting and context.
      *   Describe the setup (room, materials).
      *   Walk through the 60 minutes chronologically (Intro, Rounds, Debrief).
      *   Explain the mechanics clearly within the paragraphs.
      *   Ensure the "Constraint" is clear (if you look, you must obey).
      *   Ensure the math works (Prior > Signal Accuracy).
      *   Describe the debrief connecting to Good's Theorem (Value of Information = EU(Action|Info) - EU(Action|No Info)). Usually positive because you can ignore info. Here negative because you can't.
      *   Add the limitation note (simulation uses forced rules, real life uses cognitive bounds).

  6.  **Checking Constraints:**
      *   Continuous prose? Yes.
      *   No headings/bullets/bold? Yes.
      *   60 minutes? Yes.
      *   12 colleagues? Yes.
      *   Points not money? Yes.
      *   Honest note included? Yes.

  7.  **Drafting - Section by Section (Mental Check):**
      *   *Intro:* Dear colleague, here is the plan.
      *   *Setup:* Need slips of paper, a hidden state generator (dice/app), scoreboards.
      *   *Timeline:* 10 min intro, 30 min game (multiple rounds), 20 min debrief.
      *   *Game Logic:* The "Biased Coin" scenario. 80% Heads. Signal 70% accurate. Constraint: "Signal Binding Protocol".
      *   *Experience:* Players will see scores drop when they opt-in to info.
      *   *Debrief:* Explain Good's Theorem. The assumption of "free action" post-information.
      *   *Limitation:* In real life, no one forces you to obey a signal except your own psychology or organizational policy. The game hardcodes this; real life is softer.

  8.  **Writing - Focusing on Flow and Prose:**
      *   Avoid list-like sentences. Use connectors like "following this," "subsequently," "in contrast."
      *   Ensure the math is explained in sentences.
      *   Make sure the "Limitation" is distinct but integrated.

      *(Self-Correction during drafting)*: I need to be careful not to use bold text for emphasis. I must rely on sentence structure. I also need to ensure the timeline is clear without using a bulleted schedule. I will use phrases like "during the first ten minutes" and "for the subsequent thirty minutes."

      *(Math Check)*:
      Prior: P(Heads) = 0.8. Payoff: Correct +10, Wrong -5.
      Strategy Ignore: Always Heads. EV = 0.8(10) + 0.2(-5) = 8 - 1 = 7.
      Signal: P(Signal=Heads | Heads) = 0.7, P(Signal=Tails | Tails) = 0.7. (Symmetric noise).
      Constraint: Must follow signal.
      EV Signal = P(Signal=Heads)*[P(Heads|S=H)*10 + P(Tails|S=H)*-5] + ...
      Actually simpler: Overall accuracy is 0.7.
      EV = 0.7(10) + 0.3(-5) = 7 - 1.5 = 5.5.
      5.5 < 7. So taking info is harmful.
      Wait, I need to make sure the signal accuracy is calculated correctly relative to the prior.
      If Signal is 70% accurate overall, then yes.
      Let's stick to the simpler explanation: The signal is correct 70% of the time. The prior is correct 80% of the time. If you are forced to follow the signal, you drop from 80% accuracy to 70% accuracy.
      This is intuitive for engineers. Prior = Default Config. Signal = Noisy Sensor. If you override Default with Noisy Sensor, performance drops.

      *(Refining the Limitation)*: The simulation hardcodes the constraint. In reality, the constraint is often cognitive (bias) or organizational (policy). The game makes it explicit rules; reality is implicit. I must state this.

