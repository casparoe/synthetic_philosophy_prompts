prompt: |-
  Hi. I'm a philosophy professor — I work mostly in philosophy of science, but Lakatos has never really been my area — and god knows why, I've ended up chairing my university's internal Strategic Research Fund. We meet three times a year, a dozen or so continuing programmes in front of us each time, and for each one we have to say: renew for three more years, renew with conditions, merge it into something else, or wind it down. Real money, real labs, and people I have to pass in the corridor afterwards. The panel is me, two scientists from completely unrelated fields, somebody from finance, and a dean who can override us for strategic reasons but has to read our one-page rationale before doing so. Per programme we get a four-page self-report, two external review letters, and maybe twenty minutes of discussion. So: no time, no shared expertise, and a hard requirement that the rationale be readable by someone who has never opened a philosophy of science book in their life.

  What I want is Lakatos's progressive-versus-degenerating problem shift turned into an instrument my panel can actually run. I know the vocabulary — hard core, protective belt, positive and negative heuristic, novel facts, the difference between predicting something and accommodating it after the fact — so please don't spend the answer explaining the theory back to me; the whole difficulty is the translation. Give me the questions in the order we should ask them, what counts as a sufficient answer to each one given only the material we actually have, where the procedure stops and returns a no, and where it has to stop and hand the decision to a person because it's a values call rather than a factual one. Write the checklist itself in plain language — the panel will not know what a protective belt is, so keep the jargon in brackets or drop it — and be honest about which steps are judgment dressed up as procedure.

  Three things I take to be load-bearing in the original and don't want smoothed away in the simplification: first, that a degenerating stretch isn't by itself grounds to eliminate a programme, because on this view you need a rival that does everything the old one does plus something more; second, that a novel fact has to be novel in the right sense, meaning the programme pointed at it before anyone looked rather than absorbed it afterwards; third, that the verdict is retrospective by nature — we are using it to decide about the next three years, which is a substitution, and I'd rather that be flagged in the instrument than quietly hidden.

  Here are the cases I need it to survive. One: identifying the hard core. Proponents will call whatever is convenient core or belt depending on the question, so my provisional rule is to infer it from what they have actually refused to give up when pressed — a kind of revealed preference — rather than from what they say it is. Does that survive contact with the theory, and what do we do with a group that says it has no hard core at all, that it just follows the data? Two: counting. I've been toying with a belt-growth check — tally the auxiliary hypotheses and ad hoc adjustments added in the last cycle against the independently corroborated novel predictions the programme produced, and treat parity (one new adjustment per one new fact) as a warning sign. Say what the framework actually commits us to about parity, and where it is silent. Three: programmes that don't predict anything. Some of what we fund produces instruments, datasets, taxonomies, methods — outputs that aren't novel facts in the relevant sense. Does the distinction apply to them at all, and if not what's the least-bad surrogate? Four: gaming. Proponents retro-describe accommodated results as predicted, and our external reviewers often don't know the field's recent history well enough to catch it. What in a four-page self-report would actually discriminate? Five: young programmes with no track record, where the honest answer might just be that the procedure can't speak yet.

  Then run it on three from my actual pile. The Computational Toxicology Platform: eight years, high output, and every mismatch with the wet-lab results has been absorbed by adding a correction term; the publications are mostly confirmations; the two reviewers split. The Urban Microclimate group: three years old, no novel predictions yet, an explicit list of what it intends to explain, and a core assumption nobody has tried to break. And the one I'm dreading, Sleep and Metabolic Regulation: fifteen years, degenerating by any honest count as far as I can tell, and no rival programme anywhere that does what it does plus more — the alternative to funding it is that the university simply leaves the area. Run the procedure honestly on that last one even if it tells us to keep paying for it. I suspect that's where the theory goes, but I want to know whether the instrument says so or whether that's just my own reluctance talking.

  Finally: close by telling me what the procedure cannot do, and tell me how confident you are in each of the load-bearing claims you've made about what the framework commits us to, singling out the one you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Philosophy professor (philosophy of science background), chairing a university Strategic Research Fund panel.
      *   **Task:** Translate Lakatos's Methodology of Scientific Research Programmes (MSRP) into a practical decision-making instrument/checklist for the panel.
      *   **Constraints:**
          *   No theory explanation (user knows it).
          *   Plain language for the checklist (no jargon without brackets/translation).
          *   Must handle specific "load-bearing" Lakatosian features (degeneration $\neq$ elimination without rival, novel prediction vs. accommodation, retrospective verdict).
          *   Must address specific edge cases (identifying hard core via revealed preference, counting adjustments vs. facts, non-predictive outputs, gaming/retro-fitting, young programmes).
          *   Must apply the instrument to three specific cases (Computational Toxicology, Urban Microclimate, Sleep and Metabolic Regulation).
          *   Must conclude with limitations and confidence levels on specific claims.
      *   **Tone:** Professional, pragmatic, honest about limitations ("judgment dressed up as procedure"), respectful of the user's expertise but focused on the administrative reality.

  2.  **Deconstruct Lakatos for the Instrument:**

      *   *Core Concept:* Research Programmes (RPs) have a "hard core" (untouchable) and a "protective belt" (adjustable).
      *   *Progress:* Theoretical progress (new hypotheses) + Empirical progress (novel facts predicted, not just accommodated).
      *   *Degeneration:* Ad hoc adjustments without new empirical content.
      *   *Elimination:* Only when a rival RP exists that explains everything the old one does + more (superempirical progress).
      *   *Retrospective:* We judge the past to decide the future (substitution).

  3.  **Drafting the Instrument (The Checklist):**

      *   *Goal:* A step-by-step guide for the panel.
      *   *Language:* Simple, actionable.
      *   *Structure:*
          1.  Identify the Core (Revealed Preference).
          2.  Assess Progress (Predictions vs. Accommodations).
          3.  Assess Degeneration (Belt Growth).
          4.  Check for Rivals (The Elimination Condition).
          5.  The Verdict (Renew, Condition, Merge, Wind Down).
      *   *Addressing User Constraints:*
          *   *Hard Core:* Use the "revealed preference" idea. If they claim no core, flag as "pre-paradigmatic" or "instrumental."
          *   *Counting:* Lakatos doesn't give a strict 1:1 ratio, but "ad hoc" implies *only* saving the theory without new content. I need to be careful not to over-mathematize Lakatos.
          *   *Non-predictive:* Need a surrogate. "Utility" or "Infrastructure" value.
          *   *Gaming:* Look for timestamps, pre-registrations, or specific language in the self-report ("we anticipated X" vs "we found X").
          *   *Young Programmes:* "Probationary" status.
          *   *Retrospective:* Explicitly state that this judges the *past* cycle to authorize the *next*.

  4.  **Addressing the Specific Cases:**

      *   *Case 1: Computational Toxicology.* High output, but absorbing mismatches with correction terms. Reviews split.
          *   *Analysis:* Sounds like degenerating belt (ad hoc adjustments). But is there a rival? If not, Lakatos says keep it.
      *   *Case 2: Urban Microclimate.* Young (3 years). No predictions yet. Core assumption untested.
          *   *Analysis:* Too early for MSRP verdict. Needs "probationary" renewal with conditions (must produce novel fact by next review).
      *   *Case 3: Sleep and Metabolic Regulation.* 15 years, degenerating, no rival.
          *   *Analysis:* This is the crux. Lakatos explicitly says *do not* eliminate a degenerating programme without a rival. Even if it's "degenerating," if it's the only game in town, you keep it alive to prevent a vacuum. This matches the user's suspicion.

  5.  **Refining the "Load-Bearing" Claims:**

      *   *Claim 1 (Revealed Preference for Core):* Lakatos talks about methodological decisions to treat core as irrefutable. Inferring from behavior is consistent.
      *   *Claim 2 (Counting/Parity):* Lakatos is vague on numbers. He focuses on *content*. Parity is a heuristic, not a law. I need to be honest here.
      *   *Claim 3 (Non-predictive):* MSRP is about theory. Instrumentalism needs a tweak.
      *   *Claim 4 (Gaming):* MSRP relies on historical reconstruction. Self-reports are biased. External reviewers are the check, but they might be blind.
      *   *Claim 5 (Young Programmes):* Lakatos acknowledges early stages are often theoretical.

  6.  **Developing the Response Structure:**

      *   **Introduction:** Acknowledge the difficulty and the fit.
      *   **The Instrument (The Lakatosian Audit):** The actual checklist.
      *   **Application to Cases:** Running the three scenarios.
      *   **Limitations & Confidence:** The required closing section.

  7.  **Drafting Content - Section by Section (Iterative refinement):**

      *   *Checklist:* Make it look like a form. Use bolding for decision points.
      *   *Case 3 (Sleep):* This needs careful handling. The user suspects the theory says "keep funding." I need to confirm that Lakatos *does* say that, but highlight the strategic risk (sunk cost).
      *   *Limitations:* Be sharp. MSRP is historical, funding is forward-looking. MSRP assumes rational actors; scientists are career-driven.
      *   *Confidence:* I need to rate my own interpretation of Lakatos. The "Counting/Parity" claim is the shakiest because Lakatos was qualitative about "excess empirical content."

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Did I explain the theory? *Check:* No, kept it to application.
      *   *Critique:* Is the language plain enough? *Check:* Replace "negative heuristic" with "rules for what not to touch."
      *   *Critique:* Did I address the "no hard core" group? *Check:* Yes, classify as "Data-Driven/Instrumental" and judge on utility, not progress.
      *   *Critique:* Is the "Retrospective" nature clear? *Check:* Ensure the checklist preamble states we are judging the *past* to fund the *future*.
      *   *Critique:* The "Counting" issue. Lakatos doesn't say 1 adjustment = 1 fact. He says adjustments must yield *new* facts. If an adjustment yields *no* new fact, it's ad hoc. If it yields a new fact, it's progressive. The "parity" idea is the user's heuristic. I need to validate if Lakatos supports it. Actually, Lakatos says if you add a hypothesis *only* to save the theory, it's degenerating. If you add it and it leads to new discoveries, it's progressive. So the ratio isn't the key; the *outcome* of the adjustment is. I need to correct the user's "parity" idea slightly while keeping their spirit. *Correction:* I will frame it as "Adjustments without New Discoveries."
      *   *Critique:* Case 3. If it's degenerating and no rival, Lakatos says "keep it." But the user has a "Wind it down" option. How to reconcile? The instrument should recommend "Renew with Conditions (Find a Rival/Shift)" or "Merge." But strictly Lakatosian? Strictly Lakatosian says "Don't eliminate." I must be honest that the *instrument* might say "Renew" even if the *finance officer* says "Cut." I will advise the "Renew with Conditions" path to satisfy the administrative need to act without violating the philosophical constraint.

  9.  **Final Polish:** Check tone. Ensure it sounds like a colleague speaking to a colleague. Ensure the "Confidence" section is distinct.

      *(Self-Correction on Case 3)*: Wait, if there is no rival, Lakatos says it is irrational to abandon it. However, for a *university fund*, "no rival" might mean "no one else studies this." If the university leaves the area, the programme dies. Lakatos would say "Keep it until a rival appears." But resources are finite. I need to highlight the tension between *rationality of science* and *economics of administration*. The instrument should flag this as a "Strategic Exception."

      *(Refining the "Counting" constraint)*: The user asked: "Say what the framework actually commits us to about parity, and where it is silent." I need to be explicit: Lakatos is silent on numbers. He cares about *content*. I must tell the user that parity is their own operationalization, not Lakatos's law.

      *(Refining "Revealed Preference")*: Does this survive contact? Yes, Lakatos emphasizes the *methodological decision* to treat the core as irrefutable. If they treat it as refutable in practice, it's not the core.

      *(Refining "Non-predictive")*: MSRP is for theoretical physics mostly. For data/methods, we need to map "novel fact" to "novel utility/application."

      *(Final check on Confidence)*: I need to pick the one I'm least sure about. Probably the "Counting/Parity" translation, as Lakatos was notoriously vague on quantifying "excess empirical content."

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the instrument, the application to your cases, and the meta-assessment you requested.

  ### The Instrument: The Research Programme Audit

  **Preamble for the Panel:**
  We are not judging whether this research is "true." We are judging whether it is **alive**. A live programme discovers new things we didn't expect. A dying programme spends its energy explaining away its failures. We are looking at the last three years to decide on the next three. This is a retrospective judgment used for prospective funding.

  **Step 1: Identify the "Hard Core" (The Untouchables)**
  *Look at the four-page self-report. Ignore what they say is central. Look at what they refused to change when their results contradicted their expectations.*
  *   **Question:** When the data contradicted the main theory in the last cycle, what did they refuse to change?
  *   **Sufficient Answer:** "They kept Assumption X and adjusted Method Y." (Assumption X is the core).
  *   **Stop/No:** If they claim they have "no core" and "just follow the data," mark as **Instrumental/Data-Driven**. Skip to Step 4 (Utility Check).
  *   **Judgment Call:** Distinguishing a "core assumption" from a "well-established fact." If they treat a fact as unfalsifiable to save the theory, it counts as core for this audit.

  **Step 2: The Prediction vs. Accommodation Check (Novel Facts)**
  *Scan the publications listed in the self-report and the external reviews.*
  *   **Question:** Did the programme announce a specific finding *before* the data was collected, or did they explain the finding *after* they saw it?
  *   **Sufficient Answer:** "Paper A cites a pre-registration from 2021 for a result published in 2023." (Progressive). vs. "Paper B discusses a 2022 anomaly using a model updated in 2023." (Accommodation).
  *   **Stop/No:** If *all* output in the cycle is accommodation of known anomalies, flag as **Degenerating**.
  *   **Gaming Check:** Look for phrases like "consistent with our framework" vs. "predicted by our framework." If external reviewers are split, look for timestamps in supplementary materials.

  **Step 3: The Belt-Growth Check (Ad Hoc Adjustments)**
  *Count the theoretical patches.*
  *   **Question:** For every new parameter, correction term, or boundary condition added to save the theory, did it lead to a *new* discovery outside the original problem?
  *   **Sufficient Answer:** "They added a correction term for humidity, which allowed them to predict soil erosion rates (new fact)." (Progressive). vs. "They added a correction term for humidity to match the existing temperature data." (Degenerating).
  *   **Parity Rule:** The framework is silent on exact numbers, but **one adjustment without one new discovery is a warning sign.** Two or more adjustments with zero new discoveries is a **Critical Warning**.
  *   **Judgment Call:** Determining if a new discovery is "trivial" or "novel." This is where the scientists on the panel must overrule the finance officer.

  **Step 4: The Rival Check (The Elimination Condition)**
  *This is the most critical constraint.*
  *   **Question:** Is there another research programme (inside or outside the university) that explains everything this one does, plus the new facts this one failed to predict?
  *   **Sufficient Answer:** "Yes, Group B at University X has published a model that covers these results without needing correction terms."
  *   **Stop/No:** If the answer is **No**, you **cannot** recommend "Wind Down" on philosophical grounds, even if the programme is degenerating. You must recommend "Renew with Conditions" or "Merge."
  *   **Judgment Call:** Defining "explains everything." Does the rival cover the niche applications? If not, the old programme survives.

  **Step 5: The Verdict (Substitution)**
  *   **Renew:** Progressive shift (New predictions confirmed).
  *   **Renew with Conditions:** Degenerating shift but **no rival exists**. Condition: Must produce one novel prediction by next review or open to merger.
  *   **Merge:** Degenerating shift and a compatible rival exists.
  *   **Wind Down:** Degenerating shift and a superior rival exists (and the university can access it).

  ***

  ### Application to Your Cases

  #### 1. Computational Toxicology Platform
  *   **Status:** 8 years old. High output. Mismatches absorbed by correction terms. Reviews split.
  *   **Audit:**
      *   **Core:** The computational model itself.
      *   **Prediction:** Mostly confirmations (Accommodation).
      *   **Belt:** Growing (correction terms added).
      *   **Novel Facts:** Low. The corrections match wet-lab results but don't seem to predict *new* toxicological behaviors independently.
      *   **Rival:** Wet-lab biology is the rival, but it doesn't do *computation*. There is no rival *computational* programme that does more.
  *   **Verdict:** **Renew with Conditions.**
  *   **Rationale:** It is degenerating (absorbing mismatches without new predictive content). However, under Lakatos, you cannot eliminate it without a rival computational framework that does better. Since it provides a unique service (computation), it survives, but the "Condition" must be that the next cycle produces a prediction the wet-lab hasn't seen yet, not just a fit to existing data.

  #### 2. Urban Microclimate Group
  *   **Status:** 3 years old. No novel predictions. Core assumption untested.
  *   **Audit:**
      *   **Core:** Explicitly listed, but untested.
      *   **Prediction:** None yet.
      *   **Belt:** Not yet grown (too early).
      *   **Rival:** Irrelevant at this stage.
  *   **Verdict:** **Renew with Conditions (Probationary).**
  *   **Rationale:** MSRP cannot judge a programme that hasn't produced empirical content yet. This is a "theoretical stage." The instrument flags this as **Pre-Progressive**. You fund the *potential* for a hard core to be established. The condition is a hard deadline: by the next review (3 years), they must have risked a prediction. If they return with only accommodations then, they are degenerating from the start.

  #### 3. Sleep and Metabolic Regulation
  *   **Status:** 15 years. Degenerating (by your count). No rival.
  *   **Audit:**
      *   **Core:** The metabolic link hypothesis.
      *   **Prediction:** Low/None recently.
      *   **Belt:** High growth (explaining away failures).
      *   **Rival:** **None.** The alternative is silence on the topic.
  *   **Verdict:** **Renew with Conditions.**
  *   **Rationale:** This is the Lakatosian trap. Even if the programme is intellectually bankrupt (degenerating), **you cannot wind it down.** Lakatos explicitly argues it is irrational to abandon a programme solely because it is degenerating if no rival exists. To "Wind Down" here is to create a vacuum, not a scientific advance.
  *   **The Fix:** You must fund it to keep the domain alive, but you must force the "Condition" of **Search for Rivals**. The rationale should read: *"The programme is empirically stagnant. However, as the sole custodian of this research domain, immediate termination would eliminate the field rather than correct it. Funding is renewed on the condition that the PI actively collaborates with or benchmarks against emerging alternative frameworks. If a superior rival emerges within 3 years, merger will be mandated."*
  *   **Honesty Check:** This is not because the science is good. It is because the *ecosystem* is empty. You are paying a subsidy for monopoly maintenance until competition arrives.

  ***

  ### Limitations and Confidence Assessment

  **What the Procedure Cannot Do:**
  1.  **It cannot predict breakthroughs.** Lakatos is historical. A degenerating programme *might* stumble into a new fact tomorrow. The instrument minimizes risk; it does not maximize discovery.
  2.  **It cannot handle "Paradigm Shifts" in Kuhn's sense.** If a group is working on something so new it has no "core" yet (like early AI or CRISPR), this instrument will flag them as "Instrumental" or "Pre-Progressive." It biases against high-risk, high-reward chaos.
  3.  **It cannot solve the Resource Problem.** Lakatos assumes infinite time for science. You have a budget. If "Sleep and Metabolic" is degenerating, Lakatos says "keep it." Your Finance Officer says "it's a sunk cost." The instrument forces you to acknowledge the philosophical obligation to keep it, but it cannot make the Finance Officer happy about it.
  4.  **It relies on honest reporting.** If the self-report lies about prediction timestamps, Step 2 fails. External reviewers are your only check, and if they are friends of the programme, the audit fails.

  **Confidence in Load-Bearing Claims:**

  1.  **Revealed Preference for Hard Core:** **High Confidence.** Lakatos defines the core by the methodological decision to protect it. Inferring this from what they *actually* defend rather than what they *say* is consistent with his view of science as a practice, not a manifesto.
  2.  **No Elimination Without Rival:** **High Confidence.** This is the central differentiator between Lakatos and Popper. Popper says "falsify and drop." Lakatos says "degeneration is okay until a better alternative exists." Your instinct on the Sleep case is correct; the theory demands you keep funding the "zombie" programme if it's the only one in town.
  3.  **Novelty as Prediction (not Accommodation):** **High Confidence.** This is the engine of the MSRP. Accommodating facts is always possible with enough belt adjustments. Predicting them is the filter.
  4.  **Parity/Counting Adjustments:** **Low Confidence (The Weakest Link).** I am least sure about the "one adjustment per one fact" heuristic. Lakatos speaks of "excess empirical content," which is qualitative, not quantitative. A single adjustment could yield ten new facts, or ten adjustments could yield one. Using a parity count is an administrative simplification that Lakatos himself might reject as too mechanistic. It is a useful *proxy* for your panel, but it is not strictly Lakatosian.
  5.  **Surrogate for Non-Predictive Outputs:** **Medium Confidence.** Mapping "novel fact" to "novel utility" for instrumental programmes is a necessary adaptation for a funding body, but it stretches the MSRP, which was designed for theoretical physics. It works for admin, but it's philosophically "impure."

  **Final Advice:**
  Use the "Renew with Conditions" category aggressively. It is the pressure valve that allows you to satisfy Lakatos (don't kill the programme) and Finance (don't give them a blank check). In the case of the Sleep programme, the "Condition" is not scientific performance, it is *market creation* (find a rival). That is the only honest way to fund a degenerating monopoly.
