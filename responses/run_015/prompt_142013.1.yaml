  **Decomposition**

  1.  **0.90 — Bureaucratic Transcription Norms:** Colonial clerks were trained to minute *on* petitions, not preserve them, converting speech into administrative categories immediately.
  2.  **0.65 — Survival of "Input" vs. "Output":** Even if original petitions were temporarily filed, routine inputs had significantly lower retention rates than outward correspondence or final registers.
  3.  **0.85 — Rejected Index Implication:** The survival of the rejection index alongside missing petitions indicates systematic disposal of "closed" cases, not random physical decay.
  4.  **0.80 — Contemporary Weeding Principles:** Records management rules of the era explicitly authorized destruction of processed routine papers to save storage, predating modern archival loss.
  5.  **1.00 — Multiplicity of Silence:** The silence is not in one location; it is layered across translation, summarization, and disposal, making "later loss" an insufficient single cause.

  **Combination**
  I treat these as conditional probabilities weighting the "Recording Moment" hypothesis: The high probability of summarization norms (0.90) and systematic contemporary disposal (0.80/0.85) overwhelms the possibility of random later decay, pushing the credence well above your 0.6 but acknowledging some physical loss occurred.

  **Sensitivity**
  My final number is most sensitive to **Contemporary Weeding Principles**; if destruction was random rather than policy-driven, the Classmate's "later loss" argument gains significant traction.

  **Diagnostic**
  Find a single **accepted petition file** from the same period: if the original vernacular petition is bound within it, the absence in rejected cases is policy (you win); if it is also missing, general survival bias is the cause (Classmate wins).

