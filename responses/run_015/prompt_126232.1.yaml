      *   *What is the standard view?* God chooses the best world based on a combination of simplicity (laws) and richness (phenomena). This is often framed as moral goodness (happiness/virtue), but the metaphysical grounding is composability and consistency.
      *   *What is the "Editorial" analogy?* An editor looks for internal consistency, pacing, economy of elements, and coherence. A world with too many miracles violates laws (bad editing). A world with too little happening is boring (low richness).
      *   *Scholarly Consensus vs. Contested:*
