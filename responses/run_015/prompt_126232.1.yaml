          *   *Contested:* Whether "moral goodness" (happiness) is the *primary* metric or a byproduct of metaphysical perfection. Some scholars say Leibniz prioritizes ontological perfection; others say moral good is the end goal. I need to be careful here. I cannot say "Scholars agree it's *only* aesthetic." I must say "Scholars agree metaphysical perfection is the groundwork, but debate whether moral happiness is the ultimate aim or identical to it."
      *   **Avoiding the Cliché:** Move away from "this pain is good for you" to "this pain fits the structure."
      *   **Conclusion:** Tie it back to the novel character.

  4.  **Refining the "Consensus vs. Contested" Distinction:**
      *   *Consensus:* Leibniz defines perfection as the maximum of essence/existence. The choice is based on a ratio of effects to means.
      *   *Contested:* The relationship between metaphysical perfection and moral goodness. Is the world best *because* it makes people happy, or is it best because it has the most reality, and happiness is just part of that? (The "Aesthetic vs. Moral" debate).
      *   *Strategy:* Frame the "editorial" view as aligning with the *metaphysical* criteria (consensus) while acknowledging that the *moral* implication (happiness) is where scholars diverge on emphasis. This allows the user's character to focus on the structural (editorial) side without claiming Leibniz didn't care about happiness at all.

  5.  **Drafting the Content (Mental Simulation):**
