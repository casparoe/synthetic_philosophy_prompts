          4.  Constraints: No bio, no influences, no yes/no, no jargon dumps, no letting her restate the view without cost. Tone: generous but exacting.
          5.  Specific coverage: Ex-ante/ex-post & knowledge, currency/comparability, tie-breaking rule, expected-value maximization.

  2.  **Brainstorming Pressure Points (Stage 1):**
      *   *The Nature of Prospects:* Is a probability of death really a harm comparable to actual death? If I face a 1/6 risk but survive, did I suffer enough to ground a "reasonable rejection"? If the risk is the harm, then contractualism becomes about risk distribution, not outcome distribution.
      *   *Information Sensitivity:* If the moral status of an act depends on whether the agents know the identities (probabilities vs. certainties), this creates a "moral magic" problem. Why does *knowing* who will die change the wrongness if the physical outcome is the same?
      *   *The Tie-Breaker:* The supplementary rule (if objections tie, count the number of objectors) looks suspiciously like aggregation. If the strongest objection is identical (e.g., certain death), why does the number of people matter *unless* we are aggregating the force of their complaints? Reinholt says it's a tie-breaker, but isn't it doing the heavy lifting?
      *   *Continuity/Discontinuity:* What happens when the probability shifts from 99.9% to 100%? Does the moral verdict jump wildly? This suggests the view is unstable.
      *   *Expected Value:* If we weigh prospects linearly (1/6 death vs 5/6 death), isn't this just expected utility theory in contractualist clothing? Where is the distinctively *contractualist* constraint if the math ends up the same?
      *   *Second-Personal Standing:* Contractualism is about justification *to* a person. Can you justify risking someone's life to them by saying "you had a good chance"? If they die, the justification looks hollow.
      *   *Social Risk:* In society, we impose tiny risks on millions to save specific people (speed limits vs. hospital funding). Does prospect contractualism demand we eliminate all small risks because everyone has a complaint? Or does it allow large risks if spread thin?
      *   *The Deflection:* "One person vs. one person." But if the *content* of that person's prospect depends on how many others are at risk (e.g., resource dilution), the distinction blurs.

  3.  **Drafting the Questions (Stage 2):**
