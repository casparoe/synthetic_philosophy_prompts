answer: |-
  Here is the reconstruction of the implicit theology embedded in the canonization miracle procedure, analyzed through the lens of divine power and causality.

  ### 1. The Implicit Theology: Ordered Omnipotence and Secondary Causality

  The certification procedure presupposes a specific metaphysical architecture that effectively "dissolves" the omnipotence paradox by ignoring half of it. It operates on a model of **Ordered Omnipotence**.

  By requiring that a cure be medically inexplicable yet physically describable (a lesion vanishing, not a square circle appearing), the procedure assumes that divine power operates within the bounds of logical coherence. It treats the "stone so heavy" paradox not as a limit on God, but as a category error in the questioner. The procedure assumes that a "miracle" must be an *event* in the world, and events are subject to the principle of non-contradiction. Therefore, the Vatican's practice implicitly adopts the Aquinas-style resolution: omnipotence extends to all things that are *possible in themselves*. A contradictory cure is not a "thing" that can be done; it is nonsense. The procedure rules this out by demanding medical intelligibility.

  More significantly, the procedure relies on a robust doctrine of **Secondary Causality**. For the question "Can medicine explain this?" to be meaningful, medicine (and nature generally) must have genuine causal power. If nature were inert, the question would be vacuous. The procedure assumes a dual-layer ontology:
  1.  **The Natural Order:** A realm of created causes (cells, drugs, immune systems) that operate according to stable, intelligible laws.
  2.  **The Divine Agent:** A distinct cause that can operate *within* that order (sustaining it) or *outside* it (bypassing it).

  The "miracle" is defined not as the presence of God (who is present everywhere), but as the **absence of a created secondary cause** where one is expected. The "gap" is not an ontological absence of God, but an epistemic absence of a natural mechanism.

  ### 2. Rival Pictures Ruled Out

  This procedural framework quietly excludes several major theological competitors:

  *   **Cartesian Voluntarism:** If divine power is absolutely unconstrained, even by logic, then the medical board's work is irrelevant. God could cure a patient by making it true that "the tumor exists and does not exist simultaneously." The requirement for a "complete and lasting" physical recovery assumes that God wills to work within the framework of physical describability. Voluntarism makes the physical evidence secondary to the divine fiat; the procedure makes the physical evidence primary.
  *   **Strict Occasionalism:** This is the most critical exclusion. In occasionalism, created things have no causal power; God is the only cause. If this were true, the medical board could never truthfully say, "Natural causes explain this," because natural causes explain *nothing*. Conversely, they could never say, "Natural causes *cannot* explain this," because they never could. The distinction between "natural cure" and "miraculous cure" collapses into "customary divine action" vs. "unusual divine action." The procedure requires the reality of secondary causes to establish the baseline from which the miracle deviates.
  *   **Deism:** The procedure assumes intervention. If God does not act specifically in time, the link between intercession (prayer) and outcome (cure) is coincidental. The procedure demands a causal link, implying a God who listens and responds.
  *   **Process Theology:** The requirement for a "sudden" and "complete" cure implies a capacity for discontinuous intervention. Process theology, which views divine action as persuasive and gradual, would struggle to validate a "sudden" ontological break as a unique divine signature, viewing it instead as a culmination of temporal processes.

  ### 3. The Question of Underdetermination

  You suspect the practice is underdetermined—that Thomists, Molinists, and others could sign the same paperwork. This is partially true, but with a crucial caveat regarding *what the paperwork means* to them.

  *   **Thomists:** They fit the procedure perfectly. God moves secondary causes. In a natural cure, God moves the immune system. In a miracle, God produces the effect (health) without moving the secondary cause (immune system). The medical board detects the missing secondary cause.
  *   **Molinists:** They can also sign off. Through Middle Knowledge, God knows exactly what would happen if a specific prayer were offered. He actualizes a world where the cure occurs at that moment. The *procedure* looks identical, but the *mechanism* is counterfactual conditioning rather than direct suspension of laws. However, for the medical board, the result is the same: the physical antecedents were insufficient for the effect.
  *   **Occasionalists (The Limit Case):** As noted above, a strict occasionalist could sit on the board, but they would be engaging in a *fiction*. They would treat "natural causes" as shorthand for "God's habitual will." They can sign the paper, but they cannot affirm the *metaphysical justification* for the inquiry. If the procedure were rebuilt on occasionalism, the medical board would cease to be investigators of nature and become investigators of divine habit. This shifts the authority from science to revelation, undermining the procedure's claim to engage with the public, secular world of medicine.

  So, the practice is **functionally underdetermined** (different theologians can perform the ritual) but **metaphysically determined** (the ritual loses its logical coherence if secondary causality is denied).

  ### 4. Internal Consistency: Primary Cause vs. The Gap

  This is the strongest tension. Official theology states God is the Primary Cause of *everything*. If God sustains the aspirin that cures a headache, God is the cause of that cure. If God sustains the tissue that regenerates miraculously, God is the cause of that cure. Why is the second one a "miracle" and the first one "nature"?

  The procedure avoids contradiction by shifting the criterion from **Ontology** to **Semiotics**.

  *   **Ontologically:** God is the cause of both. There is no "God of the Gaps" in terms of being.
  *   **Semiotically:** A miracle is a *sign*. Language requires distinction to convey meaning. If every event is a miracle, no event is a message.

  The procedure treats the "inexplicable cure" not as the only place God acts, but as the only place God acts *in a way that points to Himself*. The "gap" is not where God starts working; it is where God stops hiding behind secondary causes.

  Is this consistent? Yes, provided one accepts that divine action has a communicative intent. The contradiction only arises if one assumes the purpose of the miracle is *efficiency* (fixing what nature couldn't) rather than *signification* (revealing the saint's intercession). The medical board is not looking for "God's work" (which is everywhere); they are looking for "God's signature."

  However, there is a vulnerability: **The Epistemic Risk.** Because the procedure relies on the *current limits* of medical explanation ("medicine has no explanation"), it ties divine action to human ignorance. If medical science advances and explains a previously "miraculous" mechanism, the miracle evaporates. This makes the "fingerprint of God" contingent on the state of human technology. The procedure tries to mitigate this by requiring the cure to be "sudden and complete" (implying a speed that defies biological processes regardless of explanation), but the reliance on "inexplicability" remains a "God of the Gaps" structure, even if theologically nuanced.

  ### 5. Rebuilding the Practice

  If you forced the institution to rebuild the procedure around one of the rival views, the ground-level mechanics would shift or collapse:

  *   **If rebuilt on Strict Occasionalism:** The medical board becomes superfluous. Since nature has no power, there is no baseline of "what nature can do." You cannot distinguish a miracle from a natural event based on causal insufficiency. The procedure would collapse into **aesthetic or spiritual discernment**. The question changes from "Can medicine explain this?" to "Does this event feel like a special divine will?" The objective, scientific shield disappears, making the canonization process purely internal to the faith community and vulnerable to charges of subjectivity.
  *   **If rebuilt on Cartesian Voluntarism:** The requirement for logical coherence drops. The church could theoretically certify cures that involve logical contradictions (though they never do). More practically, the need for evidence drops. If God's will is absolute, evidence is merely a concession to human weakness. The procedure would become **authoritarian**. The Pope could declare a miracle without medical consultation because God's power is not bound by natural laws that doctors study. The "partnership" with science ends.
  *   **If rebuilt on Panentheism/Process:** The "intervention" language must go. You cannot look for a break in the causal chain because there are no breaks, only intensities of divine lure. The procedure would shift to tracking **correlations and intensities**. Instead of "inexplicable by medicine," the criterion would be "statistically significant alignment with prayer." The "sudden/complete" requirement might remain, but not as a break in law, but as a peak in persuasive intensity. The "intercession" becomes a psychological or spiritual alignment rather than a causal request granted.

  ### Conclusion

  The Vatican's miracle procedure is not metaphysically neutral. It is a **Thomistic technology**. It relies on the reality of secondary causes to create a control group (natural cures) against which the experimental group (miraculous cures) is measured.

  It solves the omnipotence paradox pragmatically by ignoring the "logical impossibility" horn (assuming God won't do nonsense) and focusing entirely on the "causal sufficiency" horn (God doing what nature can't).

  The practice is internally consistent only if one accepts the **Sign/Event distinction**: God is the cause of all events, but only the author of miraculous signs. If you remove the reality of secondary causes (Occasionalism), the control group vanishes, and the procedure collapses into subjective discernment. If you remove the logical constraints (Voluntarism), the evidence becomes irrelevant, and the procedure collapses into authority.

  So, while a Molinist and a Thomist can both sign the form, they are signing it because they agree on the **reality of the natural order**. The procedure is not underdetermined regarding the nature of the world; it is rigidly committed to a world that is real, law-governed, and causally distinct from its Creator, precisely so that the Creator can occasionally step outside it to wave hello.
