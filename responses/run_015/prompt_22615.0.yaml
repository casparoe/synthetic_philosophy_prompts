  *(Self-Correction during drafting the Regress section)*: I need to be careful. Harnad claims the regress stops at *sensory features*. Marcus needs to challenge whether sensory features *in the head* are grounded or just more internal states. This is the crux.

  *(Self-Correction during drafting the Holism section)*: Elena needs to channel something like Fodor or Block on holism. If meaning is the whole web, how do we learn new words without changing the meaning of all old words?

