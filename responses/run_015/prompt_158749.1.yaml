answer: |-
  # Q&A Prep Sheet: Friedman, IAMs, and the Surrogacy Requirement

  **Context:** 20m Talk + 20m Q&A.
  **Goal:** Maintain the distinction between *Surrogates* (de-idealizable) and *Placeholders* (opaque) without conceding that "utility" trumps "structural validity" in extrapolation.
  **Your Danger Zone:** Over-conceding when pressed on policy urgency ("We have to decide *now*").

  ---

  ### The Crucial Early Concession (First 2 Minutes)
  **When:** Likely in response to the first question from the Senior Modeller regarding policy relevance.
  **What to say:** "I want to be clear upfront: I am not arguing that we should halt policy decisions until models are perfect. Decisions must be made under uncertainty. My argument is that we must stop *misdescribing* that uncertainty. If a model relies on placeholders, its output is not a quantified risk; it is a qualitative scenario. Conflating the two is what I want to prevent."
  **Why:** This disarms the "ivory tower" charge without surrendering your normative claim.

  ### The Survival Reply (Must Land)
  **The Point:** The boundary between **Interpolation** (Friedman works) and **Extrapolation** (Friedman fails).
  **Why:** If you allow that Friedman's F-twist justifies unrealistic assumptions in *extrapolation*, your thesis collapses. You must hold that predictive success in the past does not license structural opacity in the future.
  **The Line:** "Friedman's defence buys you credit within the regime where the model was tuned. It buys you nothing when you cross the boundary of that regime. That is where surrogacy is the only currency that spends."

  ---

  ### Likely Objections & Replies

  #### 1. The "Policy Wait for No One" Objection
  **Who:** Senior Modeller.
  **Phrasing:** "Look, the IPCC process doesn't stop for methodological purity. Policymakers need numbers on carbon taxes next quarter, not a philosophy seminar. If we wait for your 'surrogacy' stories, we produce nothing. Isn't a flawed number better than no number?"
  **Reply (2 mins):** "A flawed number presented as a precise forecast is worse than no number; it's a false anchor. I'm not asking for no numbers. I'm asking for a labelling system. If your damage function is a placeholder, label the output as 'speculative scenario' rather than 'probabilistic projection.' That allows policy to proceed, but prevents policymakers from betting the economy on a number that lacks structural backing. The cost is not delay; it's humility in communication."
  **Soft Spot:** You aren't solving the delay problem, just the labelling one. They may press that humility gets ignored in politics.
  **Upfront Concession:** "I agree we cannot wait for perfect models to act."

  #### 2. The "We Already Do This" Objection
  **Who:** Junior Modeller or Statistician.
  **Phrasing:** "This sounds like standard sensitivity analysis or structural uncertainty quantification. We vary the discount rate, we swap climate modules, we run ensembles. Aren't you just redescribing our existing robustness checks as 'surrogacy'?"
  **Reply (2 mins):** "Sensitivity analysis tests how *outputs* change when *inputs* move. Surrogacy requires knowing *why* the structure exists and how to relax the *assumption itself*. Varying a discount rate from 1% to 5% is sensitivity. Knowing why a single rate represents a heterogeneous society and how to model that heterogeneity is surrogacy. You can be sensitive to a placeholder without ever turning it into a surrogate."
  **Soft Spot:** The line between "varying a parameter" and "relaxing an idealization" can be blurry in practice.
  **Upfront Concession:** "Sensitivity analysis is necessary, but it is not sufficient for structural validity."

  #### 3. The "Ensemble Robustness" Objection
  **Who:** Senior Modeller.
  **Phrasing:** "We don't rely on single models. We use multi-model ensembles. If different structures yield similar results, doesn't that validate the projection without needing your de-idealization stories?"
  **Reply (2 mins):** "Robustness across models is powerful, but only if the models are independently derived. In IAMs, many models share the same placeholder assumptions—like the same functional form for damage functions fitted to the same limited data. An ensemble of placeholders is still a placeholder. Surrogacy is about the independence of the *structure*, not just the variance of the *output*."
  **Soft Spot:** Proving that ensembles share the same structural biases is hard empirical work.
  **Upfront Concession:** "Ensembles reduce variance, but they do not eliminate shared structural bias."

  #### 4. The "Operationalizing Surrogacy" Objection
  **Who:** Statistician.
  **Phrasing:** "You say we need an account of how outputs move as distortions are relaxed. But in the extrapolation regime, we have no data to discipline that relaxation. How do you validate a surrogacy claim out-of-sample? Isn't this just untestable metaphysics?"
  **Reply (2 mins):** "It's not a statistical test; it's a modelling claim. It's about identifiability. If you cannot specify the mechanism that would generate the data if you had it, the parameter is unidentified. I'm asking modellers to admit when a parameter is unidentified rather than treating it as calibrated. You validate the *story* through theoretical consistency, even if you can't validate the *number* through data."
  **Soft Spot:** This admits your norm isn't statistically verifiable, which weakens its bite for a statistician.
  **Upfront Concession:** "Surrogacy is a qualitative modelling constraint, not a statistical metric."

  #### 5. The "Model Autonomy" Objection
  **Who:** Sympathetic Philosopher.
  **Phrasing:** "You're smuggling in a representational norm. But models are autonomous mediators. They don't need to mirror reality to be useful. They create a context for reasoning. Why grade them by their 'truth' rather than their capacity to facilitate dialogue?"
  **Reply (2 mins):** "I agree models are mediators, not mirrors. But when a model is used to justify trillion-dollar investments, it moves from facilitating dialogue to asserting counterfactuals. Autonomy grants freedom from direct empirical fit, but not freedom from structural coherence. If the model is a 'black box' mediator, it cannot support the specific causal claims policy requires."
  **Soft Spot:** You risk alienating the philosopher who could be an ally.
  **Upfront Concession:** "Models are not theory-derivations; they are tools."

  #### 6. The "No Alternative" Objection
  **Who:** Senior Modeller.
  **Phrasing:** "Okay, say the damage function is a placeholder. What do you want us to use instead? We can't model the whole economy. We *have* to idealize. If you ban placeholders, you ban modelling."
  **Reply (2 mins):** "I'm not banning idealizations; I'm banning *opaque* ones. Use a surrogate you can defend, even if it's simple. Or, if you must use a placeholder, explicitly state that this part of the model is a 'guess' rather than a 'mechanism.' The sin isn't idealization; it's pretending the idealization is a calibrated parameter."
  **Soft Spot:** They will argue that *all* deep extrapolation relies on placeholders by definition.
  **Upfront Concession:** "We cannot model the whole economy; idealization is unavoidable."

  #### 7. The "Friedman Exegesis" Objection
  **Who:** Senior Modeller or Philosopher.
  **Phrasing:** "You're reading Friedman too literally. He wasn't talking about extrapolation. He was talking about theory choice. Does your critique actually land on his argument, or are you fighting a straw man?"
  **Reply (2 mins):** "Even if Friedman was modest, his 'F-twist' is the shield IAM modellers use to deflect criticism about unrealistic assumptions. I'm attacking the *usage* of the F-twist in this community, not necessarily Friedman's original text. If the community invokes Friedman to justify extrapolation, my critique stands regardless of Friedman's intent."
  **Soft Spot:** Philosophical nitpicking can derail the room.
  **Upfront Concession:** "My target is the contemporary methodological practice, not just the 1953 text."

  ---

  ### Your Two Weakest Points (Prepare to Defend)

  **1. The Verification Problem (Statistician's Angle)**
  *   **The Weakness:** You demand modellers show how outputs move as idealizations are relaxed. But in the extrapolation regime (e.g., +4°C warming), there is *no data* to check that relaxation.
  *   **Defense:** Distinguish between *empirical validation* (impossible) and *theoretical coherence* (possible). A surrogate doesn't need to be proven right; it needs to be *intelligently wrong*. We need to know *how* it is wrong.
  *   **Prep:** Have an example ready where a theoretical mechanism constrains the extrapolation even without data (e.g., thermodynamic limits vs. fitted curves).

  **2. The Action-Guiding Problem (Senior Modeller's Angle)**
  *   **The Weakness:** Your norm requires work (building de-idealization stories) that takes years. Policy cycles are months.
  *   **Defense:** Argue that the current practice creates *long-term* policy failure (lock-in based on bad numbers). Short-term friction prevents long-term catastrophe. Also, suggest that "placeholder" labelling is immediate; building surrogates is the long-term goal.
  *   **Prep:** Don't promise surrogates for next quarter. Promise better *uncertainty communication* for next quarter.

  ---

  ### The Question You Hope Nobody Asks (The Killer)
  **Who:** The Senior Modeller (who reads philosophy).
  **The Question:** "You've drawn a distinction between 'surrogates' and 'placeholders.' But this looks exactly like Cartwright's distinction between capacities and tendencies, or Wimsatt's robustness analysis, or Hausman's inexact deduction. You've applied it to IAMs, which is useful, but is there a *philosophical* argument here, or is this just a redescription of existing methodology under a new name?"
  **Why it hurts:** It challenges the novelty of your PhD contribution. If it's just a redescription, you haven't added to the philosophy, just translated it.
  **Prep Answer:** "It is a redescription, but specifically for the *extrapolative* context of IAMs. Existing literature focuses on explanation or interpolation. My claim is that in *extrapolation*, the surrogate/placeholder distinction does normative work that robustness or capacity accounts don't capture, because there is no data to anchor the capacities. I'm arguing that in the absence of data, *de-idealizability* is the only remaining validity criterion. That's the specific contribution."
  **Strategy:** Own the redescription. Claim the novelty is in the *application to extrapolation*, not the metaphysics.
