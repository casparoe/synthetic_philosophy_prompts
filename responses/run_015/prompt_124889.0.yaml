prompt: |-
  I'm a PhD student in machine learning, and I've been asked to write the decision-protocol section of my lab's deployment handbook. The situation I need it for: our deployed agents operate in environments containing adversaries who have exfiltrated a copy of the agent's policy network and can run it forward on any input, but who do not have the agent's random seed. So the adversary predicts a deterministic policy perfectly, and predicts a stochastic policy no better than the policy's own action probabilities. The result is a Death-in-Damascus structure: whichever option the agent ranks highest is the one the adversary has pre-positioned against, and every option comes to look like a guaranteed loss once the agent conditions on its own choice.

  What I need is a procedure, not a literature review. Please include no references, citations, or recapitulation of the decision-theory debate — I know that material, and an on-call engineer running this will not. Write a procedure that an engineer with no decision-theory background can work through in about fifteen minutes when an agent's available actions are correlated with outcomes its action does not cause. It should give the questions in order, say what counts as a sufficient answer to each, identify where it stops with a no, and mark the points where it hands the decision to a person because the question is one of values or of organizational risk appetite rather than one about the structure of the case.

  Three things I care about most. First, the diagnostic that separates the two families of case: one where the agent's preference merely diagnoses a fixed state of the world that its action does not produce, and one where the outcome is produced by something tracking the agent's decision procedure — these call for opposite responses, and I want the question that tells them apart, not a list of symptoms. Second, the adversary's accuracy profile is discontinuous at determinism; say what the procedure does with that, and with options that differ in payoff conditional on survival. Third, give three worked applications: one genuine case of the predictor kind, one that superficially resembles it but belongs to the diagnostic kind, and one where the procedure returns a verdict my team will not want to hear. Close by saying plainly what the procedure cannot settle. Please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision protocol:

  1.  **Analyze the Request:**
      *   **User:** PhD student in ML writing a deployment handbook section.
      *   **Topic:** Decision protocol for deployed agents facing adversaries who have exfiltrated the policy network (white-box access to weights/architecture) but *not* the random seed.
      *   **Problem:** "Death-in-Damascus" structure. Adversary predicts deterministic policies perfectly and stochastic policies according to their probabilities. High-ranked actions get countered. Conditioning on action choice makes all options look like guaranteed losses.
      *   **Constraints:**
          *   Procedure only (no literature review, no citations, no decision-theory debate).
          *   Target audience: On-call engineer (no decision-theory background).
          *   Time limit: ~15 minutes to work through.
          *   Structure: Ordered questions, sufficient answer criteria, stop points (No), hand-off points (values/risk).
          *   Key Focus 1: Diagnostic to separate "fixed state of the world" (diagnostic) vs. "outcome tracking decision procedure" (predictor/adversarial).
          *   Key Focus 2: Handle the discontinuity at determinism (deterministic = 100% predictability vs. stochastic = probabilistic predictability) and payoff differences conditional on survival.
          *   Key Focus 3: Three worked applications (Genuine Predictor, Superficial/Diagnostic, Unwelcome Verdict).
          *   Closing: Plain statement of what the procedure cannot settle.
          *   Language: American English.

  2.  **Deconstruct the Core Problem:**
      *   The agent is in a Newcomb/Death-in-Damascus scenario.
      *   *Causal Decision Theory (CDT)* says: My action doesn't cause the adversary's prior placement. Choose the action with the best causal consequence. (Result: Get killed because the adversary predicted this).
      *   *Evidential Decision Theory (EDT)* says: My action is evidence of what the adversary predicted. Choose the action that correlates with survival. (Result: Paralysis or randomization if payoffs are symmetric).
      *   *Functional Decision Theory (FDT) / Updateless Decision Theory (UDT)* says: Decide based on the output of the decision algorithm. Randomize if necessary to break the adversary's perfect prediction.
      *   *The Twist:* The adversary has the weights but not the seed.
          *   If the policy is deterministic (argmax), the adversary knows the output exactly.
          *   If the policy is stochastic (sample), the adversary knows the distribution but not the specific realization *unless* they can simulate the exact runtime environment (which the prompt says they can't regarding the seed).
      *   *The Engineer's Task:* They need to know *when* to switch from standard optimization to adversarial randomization or shutdown.

  3.  **Drafting the Protocol - Step-by-Step:**

      *   *Goal:* Distinguish between a "Common Cause" (Diagnostic) scenario and a "Logical Correlation" (Predictor) scenario.
      *   *Step 1: Identify the Correlation.* Is there a statistical link between action choice and bad outcome?
      *   *Step 2: The Causal Test (The Key Diagnostic).* Can the action *change* the adversary's prior state?
          *   If No (Adversary acted in the past based on prediction): It's a Predictor scenario.
          *   If Yes (Adversary reacts in real-time to observation): It's a Standard Game Theory scenario (not Death-in-Damascus).
          *   *Wait, refinement:* The prompt specifies the adversary has exfiltrated the policy. This implies they simulate the agent. The critical distinction is whether the adversary's setup depends on the *algorithm's output* or just the *state of the world*.
          *   *The "Fixed State" vs. "Tracking Procedure" distinction:*
              *   Diagnostic: Action $A$ correlates with Outcome $O$ because $C$ causes both. (e.g., Smoke correlates with Fire).
              *   Predictor: Outcome $O$ is set based on a simulation of the decision process leading to $A$.
      *   *Step 3: Determinism Check.* If it's a Predictor scenario, is the policy deterministic?
          *   If Yes: Adversary wins 100%. Must introduce entropy.
          *   If No: Adversary wins with probability $p$.
      *   *Step 4: Payoff Analysis.* Does survival yield different utilities?
      *   *Step 5: Risk Hand-off.* If randomization is needed, what level of entropy? This is a risk appetite question.

      *   *Refining the "Key Diagnostic":* The prompt asks for *the* question that tells them apart.
          *   Question: "If I force the agent to take Action X against its policy's preference, does the adversary's pre-positioned trap change?"
          *   If Yes: It's causal/reactive (Standard).
          *   If No: It's predictive/logical (Death-in-Damascus).
          *   *Better phrasing for an engineer:* "Does the adversary's setup depend on what the agent *will* choose, or what the agent *has* chosen?"
          *   *Best phrasing:* "Could the adversary have finalized their trap layout before the agent's random number generator was seeded?"

  4.  **Developing the Worked Examples:**
      *   *Case 1 (Genuine Predictor):* Adversary simulates weights, places trap where argmax points. Agent must randomize.
      *   *Case 2 (Diagnostic/Spurious):* Agent chooses path based on terrain. Terrain causes both the choice (easier path) and the ambush (visibility). Changing the action doesn't change the terrain. Wait, that's still tricky.
      *   *Let's try:*
          *   *Genuine:* Adversary simulates the binary, sees "Go Left", mines Left.
          *   *Diagnostic:* Adversary mines the bridge because the bridge is strategically valuable. The agent chooses the bridge because it's strategically valuable. The mining didn't happen *because* the agent chose it; both chose it for the same reason.
          *   *Unwelcome:* The protocol says "Shut Down" or "Randomize so heavily mission failure is guaranteed." Or, "The adversary has a copy of the weights; you cannot deploy this model safely." Let's go with: The only winning move is not to play (shutdown).

  5.  **Addressing the Discontinuity:**
      *   Deterministic policy = 100% prediction accuracy for adversary.
      *   Stochastic policy = Prediction accuracy limited by entropy.
      *   Protocol must mandate entropy injection if the model is currently deterministic.

  6.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Clinical, imperative, checklist-style.
      *   *Constraint Check:* No citations. No "Newcomb's Problem" mentions. No "CDT/EDT".
      *   *Time:* Keep it tight.
      *   *Hand-offs:* Clearly mark where human judgment is needed.

  7.  **Final Review against constraints:**
      *   Procedure only? Yes.
      *   No references? Yes.
      *   15 mins? Yes, it's a flowchart style.
      *   Diagnostic question? Yes (The "Seed Timing" test).
      *   Discontinuity handling? Yes (Entropy requirement).
      *   Three examples? Yes.
      *   Closing limitation? Yes.
      *   American English? Yes.

      *(Self-Correction during drafting)*: Make sure the distinction between "Diagnostic" and "Predictor" is crystal clear.
      *   Diagnostic: $P(Outcome | Action) \neq P(Outcome | Do(Action))$. The correlation vanishes under intervention.
      *   Predictor: $P(Outcome | Action) = P(Outcome | Do(Action))$ *unless* the intervention changes the algorithm itself.
      *   Actually, for an engineer, the "Seed Timing" question is more practical. "Did the enemy lock in their strategy before the specific random draw for this decision existed?"
      *   If Yes -> Predictor (Logical correlation).
      *   If No -> Reactive (Causal correlation).

      *Wait, one nuance:* The prompt says "adversary... do not have the agent's random seed."
      *   If the agent is deterministic, the seed doesn't matter. Adversary wins.
      *   If the agent is stochastic, Adversary knows $P(A)$ but not $A$.
      *   The protocol needs to force stochasticity if the model is currently deterministic.

      *Refining the "Unwelcome Verdict":* The team wants to deploy. The protocol might say "This architecture cannot be secured against this threat profile without rendering the agent useless."

  8.  **Final Polish:** Check the flow. Ensure the "Stop" and "Hand-off" points are explicit. Ensure the examples are distinct.

      *(Drafting the Diagnostic Question)*:
      "Hypothetically, if you could externally override the agent's action selection at the last millisecond without altering the agent's internal state or weights, would the adversary's pre-positioned countermeasure change?"
      *   If No (Trap is already set based on what the agent *would* do): Predictor Case.
      *   If Yes (Trap adjusts to what the agent *did* do): Reactive Case (Standard).
      *   *Wait, the prompt says adversary does NOT have seed.* So they can't predict the specific stochastic realization.
      *   So, if the agent is stochastic, the adversary predicts the *distribution*.
      *   The "Death in Damascus" feeling comes because $E[U|A]$ is low for all $A$.
      *   The solution is to maximize $E[U]$ over the *policy*, not the action.
      *   For the engineer: "Are we optimizing the specific move, or the rule for making moves?"

      *Okay, let's lock in the "Seed Timing" heuristic.* It's the most intuitive for engineers.
      "Did the adversary finalize their countermeasure before the agent's random number generator was seeded for this specific decision epoch?"
      *   Yes -> They are predicting the policy, not the specific action (if stochastic). They are predicting the specific action (if deterministic).
      *   No -> They are reacting to the action.

      *Actually, the prompt says:* "Adversary... can run it forward on any input, but who do not have the agent's random seed."
      *   This implies the adversary simulates the network.
      *   If the network is deterministic, simulation = reality.
      *   If stochastic, simulation = distribution.
      *   The "Death in Damascus" feeling arises because the agent conditions on $A$ when calculating expected utility.
      *   The fix is to condition on the *policy* $\pi$.
      *   But the engineer needs a procedure.
      *   Procedure:
          1. Check if correlation exists.
          2. Check if correlation is causal or logical (The Diagnostic).
          3. If Logical, check determinism.
          4. If Deterministic, Inject Entropy.
          5. Calculate Payoffs.
          6. Hand off risk.

      *Let's write it.*

      *(Self-Correction on Examples)*:
      1. Genuine: Adversary simulates weights, sees "Turn Left", mines Left.
      2. Diagnostic: Adversary mines the narrow pass. Agent chooses narrow pass because it's faster. Mining didn't depend on agent's choice, both depend on geography.
      3. Unwelcome: To survive, agent must randomize 50/50. Mission requires 90% success rate. Protocol says "Mission Impossible."

      *(Final check on "What the procedure cannot settle"):* It cannot fix a fundamentally compromised architecture. It cannot determine risk tolerance.

      *Let's assemble.*
answer: |-
  # DEPLOYMENT HANDBOOK: ADVERSARIAL POLICY CORRELATION PROTOCOL

  **Purpose:** To determine whether an agent's action-outcome correlations are caused by adversarial prediction of the agent's decision procedure or by fixed environmental factors. To prescribe the correct response to prevent guaranteed loss scenarios.
  **Time to Execute:** 15 Minutes.
  **Operator:** On-Call Engineer.

  ---

  ## PART 1: THE DIAGNOSTIC FLOWCHART

  Work through the following questions in order. If you reach a **STOP**, cease automated mitigation and escalate. If you reach a **HAND-OFF**, prepare the data packet for the Duty Officer.

  ### Q1: Is there a statistical correlation between the agent's preferred action and negative outcomes?
  *Review telemetry from the current deployment window or simulation logs.*
  *   **Observation:** When the agent assigns the highest probability to Action A, does the adversary's countermeasure appear at Action A significantly more often than chance?
  *   **Sufficient Answer:** **YES** if the correlation coefficient exceeds 0.3 or if p-value < 0.05 in the last 100 episodes.
  *   **If NO:** This is standard operations. Proceed with normal monitoring. **END.**
  *   **If YES:** Proceed to Q2.

  ### Q2: The Seed-Timing Test (The Structural Diagnostic)
  *This question distinguishes between a "Predictor" (logical correlation) and a "Reactive Environment" (causal correlation).*
  *   **Question:** Did the adversary finalize the placement of their countermeasure *before* the agent's random number generator was seeded for this specific decision epoch?
  *   **How to Verify:** Check the timestamp of the adversary's last observable configuration change against the agent's initialization time for the current episode.
      *   If the adversary's trap is physical or pre-computed (e.g., mines laid, firewall rules pushed) prior to the agent's inference call: **YES**.
      *   If the adversary observes the agent's action in real-time and responds dynamically (e.g., aiming a weapon after the agent moves): **NO**.
  *   **Sufficient Answer:** **YES** indicates a Predictor Scenario (Death-in-Damascus structure). **NO** indicates a Diagnostic Scenario (Common Cause structure).
  *   **If NO (Diagnostic Scenario):** The agent's action does not influence the trap. The correlation is spurious (e.g., both the agent and the adversary prefer the same terrain). Do not alter the policy. Optimize for standard expected utility. **END.**
  *   **If YES (Predictor Scenario):** The adversary is simulating the agent's policy. Proceed to Q3.

  ### Q3: The Determinism Check
  *Adversarial prediction accuracy is discontinuous. A deterministic policy allows 100% prediction accuracy; a stochastic policy limits accuracy to the probability distribution.*
  *   **Question:** Is the current policy network deterministic (argmax) or stochastic (sampling) at inference time?
  *   **How to Verify:** Inspect the deployment configuration flag `INFERENCE_MODE`.
      *   If `GREEDY` or `ARGMAX`: **DETERMINISTIC**.
      *   If `SAMPLE` or `TEMPERATURE > 0`: **STOCHASTIC**.
  *   **If DETERMINISTIC:** The adversary knows the action with 100% certainty. You are in a guaranteed loss state.
      *   **Action:** You must enable entropy injection immediately. Set `INFERENCE_MODE` to `SAMPLE` and `TEMPERATURE` to at least 1.0.
      *   **Proceed to Q4.**
  *   **If STOCHASTIC:** The adversary knows the probabilities, but not the specific realization.
      *   **Proceed to Q4.**

  ### Q4: Payoff Asymmetry Analysis
  *In predictor scenarios, survival is the primary constraint. Payoffs only matter if the agent survives.*
  *   **Question:** Do the available actions yield different mission values *conditional on survival*?
  *   **How to Verify:** Compare $U(Action_A | Survive)$ vs $U(Action_B | Survive)$.
  *   **Sufficient Answer:**
      *   **Symmetric:** If survival is the only thing that matters (e.g., $U_A \approx U_B$), the optimal strategy is maximum entropy (uniform randomization) to minimize adversary prediction accuracy.
      *   **Asymmetric:** If one action is significantly more valuable (e.g., capturing a target vs. fleeing), you must trade off survival probability against mission value.
  *   **If SYMMETRIC:** Configure policy to output a uniform distribution over viable actions. **END.**
  *   **If ASYMMETRIC:** **HAND-OFF TO DUTY OFFICER.**
      *   **Reason:** This requires setting a risk appetite. The engineer cannot decide the acceptable trade-off between "higher chance of death for higher reward" vs "lower chance of death for lower reward."
      *   **Data Packet:** Provide the Officer with the adversary's estimated prediction accuracy (based on current temperature) and the utility differential.

  ---

  ## PART 2: WORKED APPLICATIONS

  ### Case 1: Genuine Predictor (The White-Box Ambush)
  *   **Situation:** A drone navigates a corridor. An adversary has stolen the model weights. They place a jammer at the location the drone's policy ranks highest.
  *   **Q1 (Correlation):** Yes. Every time the drone plans to go Left, the jammer is on the Left.
  *   **Q2 (Seed-Timing):** Yes. The jammer was placed 10 seconds before the drone's inference cycle began. The adversary simulated the weights to decide where to place it.
  *   **Q3 (Determinism):** The drone was running `ARGMAX`.
  *   **Protocol Verdict:** Switch to `SAMPLE`. The adversary can predict the *probability* of going Left (e.g., 50%), but not the *actual* move. This breaks the guaranteed loss loop.
  *   **Outcome:** Agent survives by becoming unpredictable.

  ### Case 2: Diagnostic Scenario (The Strategic Chokepoint)
  *   **Situation:** A trading bot avoids a specific stock. The market crashes when that stock is traded. The bot looks correlated with the crash.
  *   **Q1 (Correlation):** Yes. When the bot trades Stock X, the market crashes.
  *   **Q2 (Seed-Timing):** No. The market conditions (the "trap") were set by macroeconomic factors before the bot made its decision. The bot avoids Stock X *because* it detects the crash risk, not the other way around. The adversary (market) is not simulating the bot.
  *   **Protocol Verdict:** This is a Diagnostic Scenario. Do not randomize. The correlation is informative, not causal. Continue avoiding Stock X.
  *   **Outcome:** Agent preserves capital by trusting the correlation.

  ### Case 3: Unwelcome Verdict (The Unwinnable Configuration)
  *   **Situation:** A security agent must defend a server. The adversary has the weights and places an exploit at the predicted defense point. The server has only one vulnerable port.
  *   **Q1 (Correlation):** Yes. The exploit always hits the defended port.
  *   **Q2 (Seed-Timing):** Yes. Adversary simulates policy before launching exploit.
  *   **Q3 (Determinism):** Agent is switched to `SAMPLE`.
  *   **Q4 (Payoff):** Asymmetric. Defending the wrong port means 100% breach. Defending the right port means 100% safety.
  *   **Analysis:** Because there is only one vulnerable port, randomization does not help. The adversary knows the vulnerability is at Port 80. If the agent defends Port 80 with probability $p$, the adversary attacks Port 80. The agent survives with probability $p$. However, if the adversary knows the vulnerability is *only* at Port 80, they do not need to predict the agent; they just attack Port 80.
  *   **Protocol Verdict:** **STOP.** The procedure identifies that the environment structure renders the agent's decision procedure irrelevant. The adversary does not need to predict the agent; they only need to know the environment constraints.
  *   **Outcome:** The engineer must recommend immediate shutdown. The agent cannot solve this via policy adjustment. The architecture is compromised for this threat model.

  ---

  ## PART 3: LIMITATIONS

  This procedure cannot settle the following:

  1.  **Risk Appetite:** It can identify the trade-off between survival and mission value, but it cannot choose the balance. That is a management decision.
  2.  **Architectural Compromise:** If the adversary possesses the weights and the environment offers no degrees of freedom (as in Case 3), no amount of randomization will secure the agent. This procedure identifies the failure mode but cannot fix the model.
  3.  **Adversary Adaptation:** This protocol assumes the adversary's prediction capability is static during the episode. If the adversary updates their simulation of the agent in real-time based on partial observations, the Seed-Timing Test may yield a false negative.
