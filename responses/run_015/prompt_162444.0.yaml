  **Sam**
  *   Concedes near-term effects are generally estimable and matter for immediate welfare.
  *   Long-run variance determines sign, not just noise; uncertainty is sign-breaking.
  *   Persistence channels (extinction) have infinite magnitude; parity ignores heavy tails.
  *   Heuristics handle deep uncertainty better than flawed expected value calculations.
  *   Concedes consequentialism may be metaphysically true even if unusable procedurally.
  *   "Washing out" assumes stable historical systems; history is path-dependent and chaotic.

  **Rowan**
  *   Concedes specific causal chains are untraceable and forecasting is inherently limited.
  *   Probability of causal persistence decays exponentially over time horizons.
  *   Near-term mean dominates long-run noise for ordinary, non-pivotal choices.
  *   Cluelessness requires sign uncertainty, not just variance; variance adds noise.
  *   Concedes existential risks are exception cases where parity might fail.
  *   Inaction carries the same long-run uncertainty; hiding behind norms solves nothing.

  **Dialogue**

  Rowan: "Take the finance job. Near-term EV is clear: more money to donate. Long-term? Asymptotic Parity. The chance my choice causally persists to 2100 vanishes. The downstream histories where the difference is preserved occupy a vanishing share of probability mass."

  Sam: "Vanishes, or just gets thin? If that persistence channel involves extinction risk, the magnitude is infinite. Your parity framing is confused here; it assumes linear scaling. It ignores heavy tails."

  Rowan: "Probability decays exponentially. For ordinary acts—oat milk, grants—the distribution narrows. The near-term mean dominates. Cluelessness requires sign uncertainty, not just variance."

  Sam: "But you can't distinguish 'ordinary' from 'trajectory-changing' ex ante. That's the cluelessness point. Your residual uncertainty still swamps the near-term signal. You don't know which act is the butterfly."

  Rowan: "Conceded: existential risks break parity. But for 99% of choices? We aren't that pivotal. The sign holds. Inaction carries the same long-run uncertainty."

  Sam: "If you're wrong about pivotality, you're wrong about everything. Heuristics protect against that model error. They have a track record."

  Rowan: "Heuristics are just frozen EV calculations. If parity holds, the calculation is tractable. You're assuming variance breaks the sign."

  Sam: "I'm saying the variance *is* the sign. You haven't shown the residual is symmetric. Is the fog neutral?"

  Rowan: "Fair. But if I wait for clarity, I lose the near-term gain. You haven't answered why inaction is safer."

  Sam: "I'm not advocating inaction. I'm advocating norms. You're pretending the fog isn't there."
