      *   *The Movie's Bias:* *Ex Machina* is a drama. Dramas require interiority. We *see* Ava as suffering because Alicia Vikander acts like she's suffering. The camera lingers on her face. This is the "Cartesian Theater" smuggled in—Garland asks us to *feel* for her, implying qualia, even if the text says she's code.
