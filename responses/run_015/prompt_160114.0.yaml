      *(Self-Correction during drafting)*: I need to be careful not to validate the design as "correct" but to validate the *analysis* of the analogies. The user wants the audit, not a defense of sortition itself. I must remain neutral on the normative claim but rigorous on the structural comparison. I need to make sure the "Framing Office" role is clearly distinguished from the "Judge" role in the jury analogy, as that's a key point of friction. The Judge instructs on law (binding); the Framing Office translates to text (non-binding on content, but binding on form).

      *(Refining the Third Comparison)*: A "Scientific Review Panel" is good, but maybe "Corporate Board of Directors" is better for the fiduciary/oversight aspect? No, Scientific Panel is better for the "evaluating evidence" aspect. Actually, a **Grand Jury** is historically more accurate for the "investigative + framing" power than a trial jury. I should emphasize the Grand Jury over the Trial Jury. Also, **Lay Magistrates** in civil law systems (mixed tribunals) are a strong institutional parallel for the Carry-over/Staff dynamic.

      Let's stick to the prompt's suggestions + Grand Jury. The prompt asks about "Scientific review panel, constitutional convention, deliberative poll, audit committee, lay assessor." I should evaluate these specifically.

