answer: |-
  1. This project asks whether the Rietdijk–Putnam argument for eternalism retains its force when simultaneity relations are applied to spatiotemporally extended process-events rather than classical point-events. Existing treatments assume sharp spatiotemporal coordinates for the relata of simultaneity, leaving unexamined how causal continuity and vague boundaries might disrupt the transitivity required for the contradiction against presentism.
  2. I will employ conceptual analysis grounded in standard special relativity to model process-events as interaction histories, avoiding the mathematical complexity of quantum gravity while rejecting the idealized precision of point-events. This approach is justified because it isolates the metaphysical implications of extension and causality without relying on speculative physics or ignoring the structural mismatch between instantaneous simultaneity and extended existence.
  3. Success consists in demonstrating whether the contradiction forcing eternalism dissolves due to the indeterminacy of process boundaries or survives by shifting the tension to causal connectivity rather than temporal location. Failure would result if the analysis merely restates the standard problem without showing how the identity conditions of process-events substantively alter the logical structure of the Rietdijk–Putnam proof.
  4. The project is tractable within a semester provided I restrict the analysis to special relativity and do not attempt to formalize a full ontology of processes compatible with general relativity. The scope risks becoming unmanageable if I engage deeply with competing theories of vagueness or attempt to resolve the measurement problem within the definition of physical interaction.
  5. Even if the conclusion is negative and the Rietdijk–Putnam argument survives the reformulation, the work remains valuable by rigorously testing the robustness of eternalism against non-standard ontologies of time. This negative result would clarify that the tension between relativity and presentism lies in causal structure itself rather than merely in the idealization of point-like existence.
