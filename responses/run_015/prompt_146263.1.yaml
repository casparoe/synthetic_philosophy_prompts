      *   **Point 2: Policy Coherence:** If the category is thin, policy targeting 'Millennials' is conceptually shaky. It risks misdiagnosing structural issues (housing, economy) as cultural ones. However, if the label has *institutional reality* (Searle), policy might work *because* people believe in it (performative aspect). But generally, it's better to target material conditions.
      *   **Point 3: The Middle Ground:** Avoid Essentialism vs. Nominalism. Propose "Interactive Kinds" (Hacking) or "Narrative Kinds". They become real through the *looping effect*. We label them, they act like the label, the label changes.
