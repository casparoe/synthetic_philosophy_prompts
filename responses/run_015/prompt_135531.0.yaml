answer: |-
  **Brainstorming: Mechanisms Packed into the Slogan**
  *   **Dominant Strategy Defection:** Payoffs are structured so cutting corners always yields higher profit regardless of what competitors do (Prisoner's Dilemma).
  *   **Selection Pressure:** Even if firms *prefer* safety, market forces bankrupt them if they incur costs competitors avoid (evolutionary dynamic).
  *   **Preemptive Defection:** Firms would cooperate but defect because they suspect others are cheating (Assurance Game/Stag Hunt).
  *   **Jurisdictional Arbitrage:** Capital moves to regions with lax enforcement, forcing strict regions to loosen rules to retain investment.
  *   **Information Asymmetry:** Buyers/workers cannot verify safety claims, so low-quality providers drive out high-quality ones (Lemon Market).
  *   **Principal-Agent Divergence:** Shareholders demand returns that conflict with worker safety, and management is incentivized to prioritize the former.

  ***

  ### Frame 1: The Structural Reading (Inevitable Degradation)
  **The Claim:** The payoff matrix of the market makes lowering standards a dominant strategy. Even if every actor prefers a high-safety equilibrium, the competitive structure selects for those who defect. Survival requires cutting costs; safety is a cost.

  *   **Classification:** **Substantive but Contingent.**
  *   **Analysis:** This is not logically trivial because not all markets are Prisoner's Dilemmas. In differentiated markets, safety can be a selling point (e.g., luxury goods, specialized labor). The claim becomes substantive when asserting that *this specific market* (e.g., low-skill labor or foundational AI) offers no competitive advantage for safety, making cost the only variable.
  *   **Verdict:** **Defensible** in commoditized markets where price is the sole selector. **False** in markets where reputation or quality differentiation is viable.
  *   **Smuggled Premise:** It often assumes market competition is perfect and frictionless. It ignores that building a reputation for safety can sometimes capture market share, though this requires long time horizons incompatible with quarterly returns.

  ### Frame 2: The Epistemic Reading (Coordination Failure)
  **The Claim:** Actors would maintain standards if they had common knowledge that others would do the same. Defection is driven by fear: "I don't want to cut corners, but I can't afford to be the sucker who plays fair while others cheat."

  *   **Classification:** **Contingently Defensible.**
  *   **Analysis:** This treats the scenario as a Stag Hunt rather than a Prisoner's Dilemma. It relies on uncertainty about competitors' actions. If I *know* you are safe, I can afford to be safe.
  *   **Verdict:** **Defensible** in contexts where verification is hard but trust is possible. **False** if the profit margin from cheating is so high that actors would defect even if they knew others were cooperating (greed outweighs fear).
  *   **Smuggled Premise:** It assumes actors are willing to cooperate conditional on trust. It ignores actors who are purely predatory and will exploit cooperators regardless of the general equilibrium.

  ### The Regulation Smuggle
  **Does the slogan entail regulation fixes it?**
  No. This is a separate empirical claim often smuggled in as a consequence.
  *   **The Smuggle:** The argument moves from "unregulated markets degrade standards" to "therefore, regulation restores standards."
  *   **The Gap:** This ignores regulatory capture, enforcement costs, and jurisdictional arbitrage. If the structural pressure is strong enough, firms will lobby to weaken the rules or move to where the rules aren't enforced. The slogan describes a dynamic pressure, not a solution vector. Assuming regulation solves it requires a second premise: that the regulatory body is immune to the same competitive or political pressures driving the race.

  ### Application: Unregulated Markets and Worker Safety
  When a debater claims unregulated markets will *definitely* destroy worker safety, they are invoking **Frame 1 (Structural)**, specifically the **Selection Pressure** mechanism.
  *   **Why:** They are arguing that safety costs make a firm uncompetitive. It is not merely that firms *fear* others are cheating (Epistemic); it is that firms *cannot survive* if they maintain standards while others do not. They are treating safety as a pure cost with no market return, implying the degradation is a necessary outcome of profit maximization under competition, not a misunderstanding or lack of trust.

  Verdict: The strongest non-trivial reading is a contingent structural claim where competitive selection pressures render safety costs unsustainable without external enforcement.
