answer: |-
  Consider Subject A, a theoretical physicist who experiences sustained, intense pleasure upon realizing two competing models describe identical structures, a feeling characterized by cognitive closure and reinforced commitment to a unified truth. Contrast this with Subject B, a literary critic who experiences equally sustained, intense pleasure upon discovering a text sustains two incompatible interpretations without resolution, a feeling characterized by openness and reinforced suspension of judgment. Neither subject experiences common sensory qualities like warmth or relaxation, and their functional roles diverge radically—one consolidates belief while the other tolerates ambiguity. The only shared feature is a second-order relational property: each takes pleasure in their specific cognitive stance toward a representational structure, whether that stance involves mapping reality definitively or refusing to map it conclusively.

  Qualitative hedonism predicts that both cases count as pleasures only if they share a specific intrinsic phenomenal feel, such as a distinctive positive tone or "glow" that permeates both experiences despite their cognitive differences. Conversely, the heterogeneity objection predicts that no such common quality exists, asserting that these experiences are grouped solely by the subjects' pro-attitude toward them rather than by a shared sensory or phenomenal ingredient. The structural feature that makes the relational property unavoidable is that the valence is constituted entirely by the subject's endorsement of their own cognitive orientation toward the object (intentionality), rather than arising from the object's properties or a separable sensory buffer. A qualitative hedonist could attack the case by arguing that one or both experiences are not genuine pleasures but rather forms of "satisfaction," "aesthetic appreciation," or "intellectual virtue," claiming these lack the raw phenomenal character required for hedonic value. However, this move likely fails without rendering the hedonist's category arbitrary, as it excludes paradigmatic cases of human flourishing based on a theoretical distinction that the subjects themselves cannot introspectively verify, thereby forcing hedonism to deny that high-level cognitive joys contribute to well-being simply because they lack a simplistic sensory signature.
