answer: |-
  The practice of precommitment does not presuppose a single consistent view of the agent but rather manages time-inconsistency by employing binding devices against expected re-optimization (two-boxing) while relying on policy adherence (one-boxing) to make non-binding pledges credible.

  In the binding case (Odysseus, car keys), the device does not strictly require the agent to be a re-optimiser, but it presupposes that re-optimization is a live risk. A binding constraint changes the physical payoff matrix so that the locally optimal choice aligns with the globally optimal plan, rendering the agent's decision theory irrelevant at the moment of temptation. However, the *motivation* to install the bind assumes the agent cannot trust their future self to ignore local causal dominance, which is precisely the Causal Decision Theory (CDT) or two-boxing impulse. If you were certain you would act as a Functional Decision Theory (FDT) agent—choosing based on the output of your decision algorithm rather than immediate causal leverage—you would view the bind as a redundant cost, though you might still accept it as insurance against "algorithmic corruption" or weakness. Thus, binding devices are compatible with any agent who assigns non-zero probability to future defection, but they are strictly *necessary* only for agents who expect to behave like two-boxers when the crunch comes.

  In the pledge case (deterrence, public vows), the mechanism strictly requires the agent to act as a one-boxer at the moment of execution. A threat only deters an adversary if the adversary believes you will carry it out even when it is locally costly to do so. If you are a pure CDT agent, you will re-optimize at the moment of crisis, recognize that carrying out the threat is now causally useless (the harm is already done or avoided), and walk it back. An adversary knowing you are a CDT agent will ignore the pledge entirely. Therefore, for a pledge to function without physical backing, the agent must be capable of overriding immediate causal dominance to maintain logical consistency with their past self, which is the core move of FDT or one-boxing. The practice here presupposes not just the *capacity* for one-boxing, but the *credibility* of that capacity.

  The practice is underdetermined because the observable behavior—setting up a savings lock or announcing a threat—is identical regardless of the underlying decision theory. A CDT agent locks savings because they predict future betrayal; an FDT agent locks savings because they are selecting a policy that outputs "save" even under temptation. Both arrive at the same precommitment action, masking the theoretical divergence. This underdetermination allows the practice to straddle both views: we use binds because we fear our CDT impulses, and we use pledges because we aspire to FDT consistency.

  If you forced a consistent view of the agent and dropped the other, the toolkit would fracture. In a world of pure CDT agents (strict two-boxers), non-binding pledges would vanish as useless noise; precommitment would rely exclusively on physical constraints, external enforcement, and contractual penalties that alter the causal payoff matrix. Deterrence would require automated doomsday machines rather than verbal threats. Conversely, in a world of pure FDT agents (strict one-boxers), binding devices would become largely obsolete; agents would trust their logical output to remain consistent across time, rendering physical constraints a wasteful expenditure of resources. The current practice survives only because humans are hybrid systems capable of both re-optimizing impulses and policy-based reasoning, requiring us to hedge against our own theoretical instability.
