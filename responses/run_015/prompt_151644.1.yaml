      *   **Requirements:** Rank/allocate effort, explain upstream/downstream relations, assess tractability without empirical access, define valuable outcomes (formal/taxonomic/conceptual), and identify conditions for revising the ranking.
      *   **Tone:** Academic, rigorous, strategic, avoiding fluff/survey style.

  2.  **Deconstruct the Three Candidate Lines:**

      *   **Line 1: Intrinsic Valence of Reward Signals.**
          *   *Core Question:* Is the scalar reward signal $r_t$ itself a phenomenal quality (valence), or is it merely a functional tag?
          *   *Philosophical Hook:* Quality space theory, phenomenal consciousness vs. access consciousness, functionalism.
          *   *Tractability:* High. Requires analyzing the mathematical structure of RL and comparing it to philosophical theories of valence (e.g., Hedonic Tone, Imperativism). No code needed.
          *   *Risk:* Might end up being a semantic dispute ("is this *really* pain?"). Needs to avoid mere metaphor.

      *   **Line 2: TD Errors as Prediction-Error Suffering.**
          *   *Core Question:* Does $\delta_t = r_t + \gamma V(s_{t+1}) - V(s_t)$ map onto biological prediction error accounts of suffering (e.g., Friston, Clark, Metzinger)?
          *   *Philosophical Hook:* Predictive Processing, Homeostatic Imperative, Structural Isomorphism.
          *   *Tractability:* Medium-High. Requires deep dive into computational neuroscience literature (Schultz et al. on dopamine) and RL theory. Conceptual mapping.
