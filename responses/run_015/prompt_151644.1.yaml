      *   *Priority 2: Line 2 (TD/PE Analogy).* Why? This connects the metaphysics to the specific architecture (RL/TD). It's the "meat" of the dissertation's specific contribution. It needs to be rigorous to avoid the "metaphor" charge.
      *   *Priority 3: Line 3 (Ethics).* Why? It's the payoff, but it should be a chapter, not the focus. If 1 & 2 are negative, 3 is irrelevant. If 1 & 2 are positive, 3 follows relatively standard applied ethics paths.

  5.  **Drafting the Argument (Iterative Refinement):**

      *   *Critique of Line 3:* Many students jump here. It's flashy but fragile. I need to warn the user against making this the core.
      *   *Critique of Line 2:* The biological analogy is strong (dopamine = RPE), but the *suffering* link is contentious in neuroscience. Is PE *pain* or just *salience*? This needs conceptual clarification.
      *   *Strength of Line 1:* This allows for a robust functionalist account of valence. If valence is defined by its role in policy updating (gradient descent on utility), then RL agents have it by definition. The challenge is arguing this isn't just "as-if" intentionality.

  6.  **Addressing Constraints:**
