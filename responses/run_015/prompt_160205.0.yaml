          *   Nuance: "Assumption Debt" implies we *should* pay it off. Hinges imply we *can't* test them without breaking the system.
          *   Distortion: Security assumptions are usually boolean (trusted/untrusted). Hinges are pre-boolean.
          *   Residue: The "warrant" is operational necessity, not evidence.

      *   *Claim 3 (Enacted vs. Stated):*
          *   Security Equivalent: Implicit Architecture vs. Documented Policy.
          *   Nuance: Writing it down makes it an audit target. Living it makes it infrastructure.
          *   Distortion: Security loves documentation ("if it isn't written, it didn't happen"). Wittgenstein says writing it changes its nature.
