      *   *Claim 4 (Fluidity):*
          *   Security Equivalent: Deprecating a Cipher / Rotating Keys / Legacy Support.
          *   Nuance: Riverbed is slow/geological. Crypto agility is fast/engineered.
          *   Distortion: We plan rotation. Hinge shifts are paradigm changes, not scheduled maintenance.
          *   Residue: "Assumption Debt" suggests we *want* to move it. Hinges suggest it moves *when the world changes*.

      *   *Claim 5 (Disagreement):*
          *   Security Equivalent: Incompatible Threat Models / Adversarial Capabilities.
          *   Nuance: You can't patch a fundamentally different threat model with more logs.
          *   Distortion: Security usually declares the other side "compromised" or "out of scope." Wittgenstein allows for "different language games."
          *   Residue: The "not as good" part aligns with security (we think our model is correct), but the "can't fix with evidence" aligns with Wittgenstein.

  4.  **Develop the "Residue Report" (The Critical Analysis):**
      *   *Where Security Fails:* Security assumes an external auditor is possible (the "God's eye view"). Wittgenstein says there is no outside. Security assumes control (key ceremonies). Hinges are not chosen.
