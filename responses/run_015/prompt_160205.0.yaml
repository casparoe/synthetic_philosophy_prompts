      *   **The Translation Layer:** Go through claims 1-5.
      *   **The Residue Report:** What breaks in translation.
      *   **The Colleague Debate:** Why "hinges = assumptions" is dangerous.
      *   **The Security Advantage:** What engineering teaches philosophy.
      *   **The Security Blind Spot:** What philosophy teaches engineering (especially on doubt).
