  3.  **Map to Security Vocabulary (Drafting the Translation):**

      *   *Claim 1 (Regress Stopper):*
          *   Security Equivalent: Root of Trust (RoT).
          *   Nuance: RoT isn't "proven" inside the system. It's the starting point.
          *   Distortion: RoTs are usually hardware/physical. Hinges are logical/grammatical.
          *   Residue: RoTs are often *chosen*; Hinges *emerge*.

      *   *Claim 2 (Epistemic Status):*
