  I considered five candidate requirements before settling on the final list. First, Universal Assent: the theory must explain why all competent viewers like the same works. Rejected: Aesthetic disagreement is pervasive and legitimate. Second, Hedonic Net Positive: pleasure must numerically outweigh pain. Rejected: Reduces aesthetic value to arithmetic many find unintelligible. Third, Quasi-Emotion: the pain cannot be genuine pain. Rejected: Contradicts the phenomenology of weeping and trembling. Fourth, Medium Neutrality: the account must apply identically to music, film, and literature. Rejected: Medium-specific affordances constrain the affective structure too deeply. Fifth, Moral Alignment: the pain must be morally edifying. Rejected: Allows for aesthetically great but morally dubious works. These exclusions prevent the theory from collapsing into empiricism, moralism, or denialism. They leave room for the nuanced distinctions required by the test cases below. The focus remains on the structural relationship between affect, object, and valuation, rather than on universalizing psychological states or moral outcomes. This ensures the philosophical work remains distinct from empirical psychology or ethical criticism.

  ### Desiderata for a Theory of Painful Art

  **1. The Object of Valuation**
  *   **Case:** The Tear-jerker.
  *   **Requirement:** The theory must distinguish between the affective state (being moved) and the aesthetic valuation (judging the work good). It must explain how one can be moved by a bad work without validating the work, and how one can value a painful work without claiming the pain itself is hedonically pleasant.
  *   **Status:** Non-negotiable.
  *   **Rules Out:** Views that conflate aesthetic success with successful arousal (some versions of the arousal-and-safety picture).
  *   **Tag:** Near-uncontroversial.
  *   **Confidence:** High; failure here collapses criticism into physiology.

  **2. The Non-Propositional Constraint**
  *   **Case:** Wordless Sadness.
  *   **Requirement:** The account must explain the appeal of sadness in abstract music where there are no characters, events, or truths to represent. It cannot rely solely on concern for fictional entities or curiosity about outcomes.
  *   **Status:** Non-negotiable.
  *   **Rules Out:** Strict cognitive accounts and the conversion picture (if reliant on moral insight from narrative).
  *   **Tag:** Contested but defensible.
  *   **Confidence:** Moderate; some argue music implies a persona, but this smuggles in fiction.

  **3. The Reality/Fiction Boundary**
  *   **Case:** The Commissioned Elegy & The Found-Footage Reversal.
  *   **Requirement:** The theory must specify whether the pain's source being real (the voicemail, the footage) necessarily defeats enjoyment, or if the aesthetic framing can override the real-world connection. It must predict why the elegy fails for the child but the footage might succeed for the stranger.
  *   **Status:** Non-negotiable.
  *   **Rules Out:** The arousal-and-safety picture (if safety relies strictly on fictionality).
  *   **Tag:** Contested but defensible.
  *   **Confidence:** Low; the line between document and art is increasingly porous.

  **4. The Diachronic Capacity**
  *   **Case:** The Bereaved Listener.
  *   **Requirement:** The theory must accommodate the fact that a subject's capacity to enjoy painful art varies over time without changing the artwork's properties. It must clarify if this variance is internal to the theory or external (psychological).
  *   **Status:** Preference of one camp (contextualists).
  *   **Rules Out:** Rigid objectivist accounts that locate value solely in the work.
  *   **Tag:** Your own stipulation.
  *   **Confidence:** Moderate; risks handing too much to empirical psychology.

  **5. The Foreknowledge Tolerance**
  *   **Case:** Foreknowledge.
  *   **Requirement:** The theory must explain why known outcomes do not diminish return visits. It cannot rely on suspense, surprise, or information-seeking as the primary driver of engagement.
  *   **Status:** Non-negotiable.
  *   **Rules Out:** Curiosity-based accounts (neighbouring the horror paradox).
  *   **Tag:** Near-uncontroversial.
  *   **Confidence:** High; repeated consumption is a datum.

  **6. The Mechanism Requirement**
  *   **Case:** Simulation-plus-Safety.
  *   **Requirement:** The theory must provide a causal mechanism for *why* safety converts pain to value, not merely assert that it does. Refusing this is a genuine desideratum because redescription (calling it "safe simulation") labels the phenomenon without explaining the transmutation of affect.
  *   **Status:** Non-negotiable.
  *   **Rules Out:** The arousal-and-safety picture (if it stops at labeling).
  *   **Tag:** Contested but defensible.
  *   **Confidence:** Low; philosophical explanation often stops at conceptual clarity, not causal mechanism.

  ### Closing Analysis

  **1. Jointly Unsatisfiable Requirements**
  Requirements 1 (Object of Valuation) and 2 (Non-Propositional Constraint) create a tension. If we must say *what* is enjoyed (Req 1), we usually point to an object (meaning, truth, character). But Wordless Sadness (Req 2) removes the object. A theory that satisfies Req 2 often dissolves Req 1 into pure sensation, which fails to distinguish art from noise. Satisfying both requires positing an objectless intentionality, which is philosophically costly.

  **2. Single Requirement Knockout**
  Requirement 2 (The Non-Propositional Constraint) knocks out the largest share of existing options. The conversion picture and standard cognitive accounts rely on narrative content to justify the pain. Without characters or propositions, their explanatory leverage vanishes.

  **3. Compressed Scorecard**
  *   **Conversion Picture:** Fails Req 2 (no moral insight in adagio) and Req 5 (foreknowledge).
  *   **Arousal-and-Safety:** Fails Req 3 (real elegy) and Req 6 (mechanism is redescription).
  *   **Meta-Response:** Fails Req 1 (struggles to separate being moved from valuing) and Req 2 (no object for meta-response).
  *   **Control Picture:** Fails Req 4 (bereaved listener loses control without art changing) and Req 3 (no control over real footage impact).
  *   **Being-Moved-by-Others:** Fails Req 2 (no others in wordless music) and Req 5 (foreknowledge doesn't change others' pain).

  ### Pushback on Framing

  You deserve pushback on two points. First, your umbrella notion of "enjoyment" papers over distinct successes. The valuation in the Tear-jerker case (recognizing manipulation) is categorically different from the valuation in Wordless Sadness (resonance). Treating them as one phenomenon invites a theory that fits neither. Second, the Mechanism Requirement (Req 6) risks a category mistake. Philosophical accounts of aesthetics often clarify *reasons* for valuing, not causal *mechanisms* of affect. Demanding a causal mechanism may force the theory into empirical psychology, abandoning the normative question of why the pain is *merited*. If you insist on a unitary theory of enjoyment, you may be solving a problem that does not exist; the "paradox" may be several distinct puzzles sharing only a surface resemblance.
