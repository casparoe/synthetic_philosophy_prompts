      *(Refining the Social Division)*: A round robin is peers checking peers. Putnam's division is Experts vs. Non-Experts. The better analog is the hierarchy of Metrology: Primary Standard $\rightarrow$ Secondary Standard $\rightarrow$ Working Standard. The routine analyst (Oscar) uses the Working Standard and defers to the Primary Standard (The Expert/Nature) for the *definition*.

      *(Refining the Residue)*: The big missing piece is *Intentionality*. A calibration curve relates signal to concentration. It doesn't capture "aboutness."

