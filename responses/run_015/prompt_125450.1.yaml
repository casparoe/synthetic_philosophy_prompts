          *   Lab A's supply is H₂O. Lab B's supply is XYZ (hypothetical isomer or lookalike that behaves identically in all macroscopic tests but has different mass/structure). *Correction:* Putnam's XYZ *looks* like water but isn't H₂O. In chem terms, this is like an isomer or a substance with identical physical properties but different chemical identity. Let's use the concept of an *uncertified Reference Material* that turns out to be chemically distinct despite identical bulk properties.
          *   When Lab A reports "Water," they trace back to H₂O. When Lab B reports "Water," they trace back to XYZ.
