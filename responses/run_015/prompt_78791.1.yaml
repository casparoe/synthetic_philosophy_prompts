answer: |-
  It is a pleasure to correspond with someone who has spent a career thinking about nitrogen cycles and now turns that rigour upon civic symbolism. There is a profound similarity, I suspect, between soil science and philosophy: both deal with layers, with what lies beneath the surface, and with how things decay or persist over time. You are quite right to sense that the council's policy is not merely administrative but metaphysical. It relies on a specific, and perhaps unstable, view of what a stone figure in a public square actually *is*.

  You ask three distinct things: what commitments the practice necessitates, what rival theories might license it, and what shifts if we view commemoration as an act rather than a claim. Let us dig into these strata.

  ### 1. The Necessary Commitments of the Policy

  For the 'keep the statue, add a plaque' policy to function as intended, it must presuppose that a monument is primarily a **historical document** rather than a **current endorsement**.

  If the statue were purely an endorsement (a claim that 'this man is worthy of honour today'), then the plaque would be incoherent. It would be like keeping a 'No Entry' sign on a road while painting a note underneath saying, 'Actually, you can enter now.' The sign *is* the regulation. Similarly, if the statue *is* the honour, the plaque cannot correct it; it can only contradict it.

  Therefore, the policy commits the council to the view that the statue is a relic. It treats the public square as a museum without walls. This presupposes that:
  *   **Civic continuity outweighs civic purity.** It is more important to show the layers of history (even the ugly ones) than to present a morally sanitised landscape.
  *   **The viewer is autonomous.** It assumes the passer-by is capable of holding a complex thought: 'This person was significant enough to be statued then, but their actions are unacceptable now.' It rejects the idea that the statue hypnotises or indoctrinates.
  *   **Meaning is separable from presence.** It assumes the physical object can remain while its semantic value is altered by the text below.

  ### 2. Rival Theories Licensing the Same Practice

  Your suspicion is astute: the policy is a 'big tent'. It allows people with entirely different philosophical commitments to stand beneath it and nod at one another.

  *   **The Paternalist View:** Here, the council assumes the role of the teacher. The statue is left as a 'teaching moment'. The plaque is not for the benefit of the statue, but for the citizen. The council says, 'We will not hide the past, but we will ensure you interpret it correctly.' This licenses the policy because it prioritises education over justice.
  *   **The Agonistic View:** Drawing from political theorists like Chantal Mouffe, this view holds that democracy requires conflict, not consensus. The statue and the plaque are not meant to harmonise; they are meant to clash. The visual tension *is* the point. It represents the struggle of history. This licenses the policy because it values the display of political struggle over the resolution of it.
  *   **The Stewardship View:** This is the conservative position. It argues that the statue belongs to the donors and the era that erected it. The current council are merely custodians, not owners. They lack the moral authority to tear down the work of ancestors, so they add the plaque as a whispered apology to the present. This licenses the policy because it prioritises property and tradition over contemporary moral standards.

  As you noted with the streets and museums: streets are functional (renaming them causes logistical chaos), and museums are epistemic (their job is to track truth, so labels must change). Statues occupy a middle ground: they are symbolic, but treated as if they were functional infrastructure or historical artefacts. The policy works only so long as no one forces the council to choose which category the statue truly falls into.

  ### 3. Commemoration as Act vs. Claim

  This is the crux of your inquiry. In the philosophy of language, we often distinguish between a **constative** utterance (a statement of fact, e.g., 'The soil pH is 7') and a **performative** utterance (an act done in speaking, e.g., 'I name this ship...').

  **If commemoration is a Claim (Constative):**
  The statue says, 'This man was great.' The plaque says, 'That claim is false.'
  *   *The Plaque's Role:* An erratum. A correction.
  *   *The Author:* The council acts as an editor of truth.
  *   *The Consequence:* If the plaque is proven wrong by new scholarship, it must be changed (like the museum cases).
  *   *Ownership:* The truth belongs to everyone; therefore, the statue is public property in the fullest sense.

  **If commemoration is an Act (Performative):**
  The statue *does* the honouring. It is a ritual gesture frozen in bronze.
  *   *The Plaque's Role:* It cannot 'correct' an act. It can only perform a *counter-act*. As you surmised, the plaque becomes a second monument. It is a ritual of dishonouring, or perhaps a ritual of contextualising, placed in competition with the ritual of honouring.
  *   *The Author:* This is where it gets sticky. If the statue is an act by the Victorians, can the 2024 Council perform a counter-act? Yes, but only if they claim the authority to speak for the city *now*. The plaque is not the donors speaking, nor the dead man; it is the current polity speaking to itself.
  *   *The Consequence:* If the plaque is a counter-act, removing it (as some campaigns now want) is not 'restoring neutrality'. It is an act of censorship, or perhaps a reaffirmation of the original honour. It admits that the plaque was never neutral text, but political speech.

  ### What Would Have to Change?

  If we adopted the view that commemoration is strictly an **act**, the 'keep the statue, add a plaque' policy would likely collapse under its own weight.

  1.  **Incoherence of Ritual:** You cannot honour and dishonour the same subject in the same space without creating a ritual short-circuit. It would be like a judge sentencing a man to prison and then pinning a note to his chest saying, 'But we don't really mean this.' The act loses its force.
  2.  **Ownership becomes explicit:** If it is an act, someone must be doing the acting. The council would have to admit: 'We are keeping this statue not because it is neutral history, but because *we choose* to keep it as a warning.' The passive voice ('the statue stays') would have to become active ('we retain this statue').
  3.  **The Plaque becomes a Rival:** The plaque could no longer claim to be 'context'. It would have to be acknowledged as a political intervention. This might make the council more hesitant to install them, or conversely, more bold in their wording.

  ### A Soil Science Analogy

  Forgive me for borrowing from your former trade, but it seems apt. The current policy treats the statue like a **soil horizon**. You do not remove the clay layer because it is acidic; you note its properties so the farmer knows how to manage the land. The plaque is the soil test result.

  However, if the statue is an **act**, it is more like a **crop**. It is something planted intentionally to yield a specific result (loyalty, pride, memory). If the crop is poisonous, a label on the fence does not make it safe to eat. You must either rotovate it under (remove it) or let it grow as a warning of what not to plant next season.

  ### Conclusion

  To answer your specific worry: the policy currently assumes the monument is a **statement about the past** that can be corrected by a **statement about the present**. It tries to have it both ways. It wants the stability of the stone (the past) with the morality of the plaque (the present).

  If you view commemoration as an act, the plaque is indeed a second monument. It is a rival flag planted on the same patch of grass. The reason the council does not admit this is that admitting it would force them to take responsibility for the statue's continued presence. By calling the plaque 'information', they pretend they are merely librarians. By recognising it as a 'counter-monument', they would have to admit they are judges.

  You have not been reading philosophy badly at all. You have simply identified that the council is practising bad metaphysics. They are treating a performative object as a constative one to avoid the political cost of making a choice.

  Yours sincerely,

  A Fellow Traveller in Thought
