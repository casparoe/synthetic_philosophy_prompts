      *   *Leakage vs. Backfill:* This is the crux. Data leakage is using test data in training. Old evidence is using test data (known) to validate a model. It's actually closer to "Training on Test Data" but with a twist about *when* the relationship was discovered.

  6.  **Addressing the Specific Question (Logical/Temporal vs. Leakage/Backfill):**
      *   *Temporal Novelty:* New data arriving (Stream).
      *   *Logical Novelty:* New query/logic applied to old data (Backfill validation).
      *   *Data Leakage:* Using future data to predict past.
      *   *Connection:* The philosopher's "Temporal" is DE's "Holdout Set." The philosopher's "Logical" is DE's "Backfill Validation."
      *   *The Gap:* DE assumes the code knows what the code does. Philosophy admits the coder might not know what the code implies until they run it. This is the "Logical Omniscience" gap.

