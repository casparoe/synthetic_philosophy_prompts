prompt: |-
  I was chatting with a mate who's on a philosophy programme and he brought up this old evidence problem in Bayesian epistemology — apparently there's a puzzle about why evidence already known when a theory was formed doesn't update belief on a standard Bayes rule, even though it intuitively confirmed general relativity via Mercury's orbit. I'm not a philosophy person myself; I'm a data engineer who thinks in ETL terms — stale snapshots, schema migrations, backfills, data lineage, and whether fixing an old record with a backdated entry actually validates the transformation logic I applied. Could you restate the whole debate — the naive Bayesian problem, the fixes people propose, and that distinction between logical and temporal novelty — using only my vocabulary? Then give me the honest residue report: what translates cleanly into pipeline logic, what needs distorting (say, stretching 'confirmation' to cover warehouse updates), and what has no engineering equivalent at all. I'm especially wondering whether the logical-vs-temporal novelty split is genuinely the same as my worry about data leakage versus a legitimate backfill, or whether there's a real gap my framework can't express, or whether it's a seperate concern altogether. Don't bother with bibliographies or citations — I can't check them without access and I'd only be guessing. If the residue suggests pipeline thinking is missing a distinction philosophers actually need, say so; if it suggests they're splitting hairs with no data-engineering analogue, say that too.
