  2.  **Deconstruct the "Old Evidence Problem" (Philosophy Side):**
      *   *The Setup:* Bayesian updating says $P(H|E) = P(E|H) \cdot P(H) / P(E)$.
      *   *The Problem:* If evidence $E$ is already known (probability = 1), then $P(E) = 1$ and $P(E|H) = 1$. The ratio is 1. The posterior equals the prior. No update happens.
      *   *The Intuition:* Einstein's General Relativity (H) was confirmed by Mercury's perihelion (E). But Mercury's orbit was known *before* Einstein. So, strictly speaking, Bayes rule says Einstein's theory shouldn't have gained confidence from Mercury. But it clearly did.
      *   *Proposed Fixes:*
          *   *Temporal Novelty:* Evidence must be discovered *after* the theory. (Rejected by many because old evidence *does* seem to confirm).
          *   *Logical Novelty:* The link between Theory and Evidence is new, even if Evidence is old. (Einstein didn't know GR implied Mercury's orbit until he calculated it).
          *   *Counterfactuals:* What would our confidence be if we *didn't* know the evidence?
          *   *Jeffrey Conditioning:* Uncertain evidence.

  3.  **Translate to Data Engineering Vocabulary:**
      *   *Hypothesis (H):* Transformation Logic / ETL Job / Schema Migration.
      *   *Evidence (E):* Existing Data Record / Snapshot / Historical Row.
      *   *Prior Belief P(H):* Confidence in the ETL logic before running it against historical data.
      *   *Posterior Belief P(H|E):* Confidence in the ETL logic after validating against historical data.
      *   *Known Evidence:* Backfill data / Legacy data already in the warehouse.
      *   *Bayes Rule:* Validation Pipeline.
      *   *P(E) = 1:* The data already exists in the table. It's a fact.
      *   *The Glitch:* If the data is already there, running the validation query returns "True" trivially. It doesn't prove the logic is right, just that the data matches the current state.
      *   *Logical Novelty:* The *query* (the link between logic and data) is new, even if the *rows* are old.
      *   *Temporal Novelty:* New data arriving via stream.

  4.  **Drafting the Restatement (Iterative Process):**
      *   *Attempt 1 (Mental):* Imagine you write a SQL transform. You test it on old data. The data is already there. So P(Data) is 1. Your confidence shouldn't go up. But it does when the test passes.
      *   *Refining for DE lingo:* Let's talk about a "Transformation Job" (Theory) and a "Historical Snapshot" (Evidence). If the snapshot is already ingested, the validation check is trivial. The "Old Evidence Problem" is why passing a unit test on stale data feels like validation even though the data wasn't generated *by* the new job.
      *   *Key distinction:* Did the job *create* the value (temporal), or did the job *explain* the value (logical)?

  5.  **Drafting the Residue Report:**
