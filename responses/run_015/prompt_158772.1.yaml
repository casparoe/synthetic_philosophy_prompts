answer: |-
  You have independently reconstructed the central tension in modern anthropic reasoning. Your intuition that the "pool" (reference class) is the lever moving the conclusion is correct, and your suspicion that the two moves cancel is a known result in the literature. You are looking at the conflict between the **Self-Indication Assumption (SIA)** and the **Self-Sampling Assumption (SSA)**.

  Here is the analysis of the joints, structured by your questions.

  ### 1. Names and Cancellation
  **Are these moves established?**
  Yes.
  *   **Move 1 (Crowded Universe):** This is the **Self-Indication Assumption (SIA)**. Formally: Given the fact that you exist, you should (ceteris paribus) favor hypotheses according to which more observers exist. It treats your existence as data that is more likely to occur in a world with more observers.
  *   **Move 2 (Random Draw/Birth Rank):** This is the **Self-Sampling Assumption (SSA)**. Formally: You should reason as if you are a random sample from the set of all observers in your reference class. It treats your specific *location* (birth rank, serial number) as data that is less likely to occur in a world with many observers (because the probability of drawing *this* specific number from a large set is small).

  **Is the cancellation known?**
  Yes. This is the standard rebuttal to the **Doomsday Argument**.
  The Doomsday Argument relies on SSA: if there will be trillions of humans, my birth rank (~70 billion) is surprisingly early; if there will only be billions, it is typical. Therefore, few humans likely.
  The SIA rebuttal is: hypotheses with trillions of humans are *a priori* more likely to produce me at all, by a factor exactly proportional to the number of humans.
  Mathematically:
  *   SSA Likelihood Ratio $\propto 1/N$
  *   SIA Prior Adjustment $\propto N$
  *   Posterior $\propto N \times (1/N) = 1$

  The cancellation is exact if the reference class in SSA matches the observer count in SIA. Your reconstruction is not crude; it is the standard formal result. The fact that they pull in opposite directions is the defining feature of the field.

  ### 2. The Datum and the Pool
  **What exactly is the datum?**
  This is the critical joint. The two moves condition on different information.
  *   **SIA Datum:** "There exists an observer with evidence $E$." (Qualitative existence). It ignores *which* observer you are, only *that* one exists.
  *   **SSA Datum:** "I am observer $k$." (Indexical location). It requires you to know your rank, serial number, or temporal position relative to the class.

  In your first instance (Cosmology), the author uses SIA because you have no rank data (you don't know if you are the $10^{11}$th or $10^{24}$th observer). In the second instance (Doomsday), the author switches to SSA because you *do* have rank data (birth rank).

  **Are they rival principles?**
  They are rival updating rules for indexical uncertainty.
  *   SIA says: Update on the probability of *someone* like me existing.
  *   SSA says: Update on the probability of *me specifically* being this observer.

  **Does the pool choice discredit the arguments?**
  This is the **Reference Class Problem**. It is widely regarded as the fatal flaw of SSA.
  If the reference class is "all humans," Doomsday holds. If the reference class is "all observers in the universe," Doomsday weakens (because aliens dilute the human fraction). If the reference class is "all beings with my exact evidence," SSA collapses into SIA.
  There is no principled constraint on the reference class that commands consensus. Many philosophers (e.g., Arntzenius, Dorr) argue this indicates the framework is broken. The "machinery" does indeed return whatever the pool choice was set to. This is not an artifact of your crudeness; it is an under-determination in the theory.

  ### 3. The Switching (Pathology)
  **Is this switching a recognized pathology?**
  It is recognized, though it lacks a single canonical label like "Gambler's Fallacy." It is often discussed under **Anthropic Bias** (Bostrom's term) or **Principle Shopping**.
  A precise definition for the pathology you noticed would be: **Inconsistent Reference Class Selection.**
  This occurs when an arguer selects a reference class (or anthropic principle) not based on the epistemic situation, but to maximize the leverage of the argument.

  **Boundary Cases:**
  *   **Legitimate Switch:** You learn new indexical data. (e.g., You start knowing only "I exist" [SIA], then you learn "I am human #70 billion" [SSA]). The principle changes because the *datum* changed.
  *   **Pathological Switch:** You hold the data constant but change the principle to suit the conclusion. (e.g., Using SIA to argue for Multiverse, then using SSA to argue for Doomsday, without acknowledging that SIA defeats Doomsday).
  *   **The Boundary:** The switch is legitimate only if the *information set* changes. If the information set is constant, the updating rule must be constant. The author you read likely committed the pathology by treating "I am an observer" and "I am a random draw" as compatible premises rather than competing conditionalizations.

  ### 4. Breaking Points
  **Where does the machinery break?**
  *   **Infinities:** Both break, but SIA breaks harder. If Hypothesis A has $\infty$ observers and B has $\infty + 1$, SIA struggles to define the ratio. This leads to the **Presumptuous Philosopher** problem: SIA allows you to rule out physical theories simply because they predict fewer observers, even with no empirical data.
  *   **Non-existent Observers:** SSA cannot handle "observers who could have existed but didn't" easily, as they cannot be in the reference class. SIA handles them as "possible observers," which inflates probabilities of worlds with high *potential* for life.
  *   **Causal Reach:** SSA usually restricts the pool to observers causally connected or indistinguishable by evidence. SIA is often global. If you include observers outside your causal horizon in the SSA pool, the Doomsday Argument vanishes (because you are a tiny fraction of the total). If you exclude them, it bites. This confirms your suspicion: the pool choice dictates the result.
  *   **Discipline:** The machinery is not disciplined. It is a parameterized family of arguments where the parameter (reference class) is chosen by the user.

  ### 5. The "Old Evidence" Puzzle
  **How can "I exist" be confirmatory?**
  This is the **Problem of Old Evidence** applied to indexicals.
  You have known you exist since childhood. How can it update your cosmological views now?
  *   **The Solution:** You are not updating on the *fact* of your existence (which is fixed). You are updating on the *probability* of your existence across different hypothesis spaces.
  *   **Analogy:** You know the dice landed on 6. That is old evidence. But if Hypothesis A says "loaded dice (90% 6s)" and Hypothesis B says "fair dice (16% 6s)," the fact that you *saw* a 6 confirms A over B, even though you saw it moments ago.
  *   **Anthropic Version:** Hypothesis A (Crowded Universe) makes the event "an observer with my evidence exists" highly probable. Hypothesis B (Empty Universe) makes it rare. Even though you knew you existed, you didn't know *how likely* your existence was under competing physical theories.
  *   **The Catch:** This only works if you treat "I exist" as a contingent outcome of the universe's parameters, not a necessary truth. If you treat "I exist" as a tautology (which it feels like from the inside), it cannot confirm anything. SIA requires you to step outside your own perspective and treat your existence as a random variable, which is cognitively difficult.

  ### Summary of the Joints
  1.  **The Distinction:** The tension is between **Existence** (SIA: favor worlds that make observers likely) and **Indexicality** (SSA: favor worlds that make *this* observer typical).
  2.  **The Lever:** The **Reference Class**. There is no consensus on how to define it. Changing it moves the conclusion arbitrarily.
  3.  **The Pathology:** **Inconsistent Reference Class Selection**. Using SIA when it helps (Multiverse) and SSA when it helps (Doomsday) without adjusting for the fact that SIA negates SSA.
  4.  **The Limit:** The framework is under-constrained. It works mathematically but lacks epistemic grounding for the choice of pool.
  5.  **The Datum:** "I exist" is data about the *world's capacity* to generate observers. "I am #7" is data about *my location* within that capacity.

  You are not missing a subtlety; you have identified the reason why anthropic reasoning remains a contested frontier rather than a settled tool. The "cancellation" you found is the primary reason many physicists and philosophers remain skeptical of applying these principles to cosmology.
