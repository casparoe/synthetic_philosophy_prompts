answer: |-
  This is a sharp dissection of a rhetorical move that often goes unchallenged. Your taxonomy (Prior, Loss, Dialectical, Field-Budget) is robust; I will adopt it but sharpen the definitions to show exactly where the interviewee's symmetry breaks.

  The slogan "Extraordinary claims require extraordinary evidence" (ECREE) is not a single principle but a family of heuristics. To evaluate your interviewee's symmetric usage ("The null is also extraordinary"), we must test whether any valid reading of ECREE treats the *null hypothesis* ($H_0$) as "extraordinary" in the same sense as the *alternative* ($H_1$).

  Here is the menu of interpretations, verdicts, and their licensing power regarding the interviewee's defense.

  ### 1. The Bayesian Prior Reading
  *   **Definition:** "Extraordinary" = Low prior probability ($P(H)$) based on background theory. "Require" = A higher likelihood ratio (stronger data) is needed to raise the posterior probability ($P(H|E)$) to acceptance levels.
  *   **Verdict:** **Coherent and Substantive.** This is the formal backbone of the slogan (Laplace's principle). It is not a platitude; it is a correct description of how evidence updates belief.
  *   **Does it license the interviewee?** **No.**
      *   *Why:* In almost all scientific contexts, $H_0$ (the effect is zero/noise) is the *high* prior baseline, not the low one. The "extraordinary" claim is specifically the one that violates established background theory.
      *   *The Symmetry Trap:* For the interviewee to use this symmetrically, they must argue that after their initial publication, the prior probability of their effect became so high that *denying* it is now the low-probability (extraordinary) claim. This requires their single small-$N$ study to have overturned the background theory that made the claim extraordinary in the first place. That is circular. ECREE protects the background theory; it does not protect a new finding from the background theory once the finding is challenged.

  ### 2. The Asymmetric Loss Function Reading
  *   **Definition:** "Extraordinary" = High cost of being wrong (consequentiality). "Require" = A stricter statistical threshold (lower $\alpha$) to minimize the specific error type that is more costly.
  *   **Verdict:** **Substantive Methodological Norm.** This is standard in clinical trials (Type I vs. Type II error weighting).
  *   **Does it license the interviewee?** **Generally No.**
      *   *Why:* Symmetry here depends on the cost structure. If the claim is "homeopathy works," the cost of a False Positive (wasted money, delayed real treatment) vastly outweighs the cost of a False Negative (missing a magical cure). Thus, the burden is on the positive claim.
      *   *The Exception:* If the claim is "this existing drug causes cancer," then the null (it's safe) is the high-stakes claim. But in basic science replication crises, the "extraordinary" label is usually applied to $H_1$ precisely because the field assumes the cost of polluting the literature with false positives is higher than the cost of missing a fragile true positive. The interviewee would need to prove that accepting the null result is more damaging to the field than accepting a false positive.

  ### 3. The Dialectical/Burden of Proof Reading
  *   **Definition:** "Extraordinary" = An assertion that changes the status quo. "Require" = The obligation to produce evidence lies with the asserter, not the skeptic.
  *   **Verdict:** **Procedural Platitude.** This is a rule of debate, not statistics.
  *   **Does it license the interviewee?** **No.**
      *   *Why:* This reading is inherently asymmetric. The person making the positive assertion bears the burden. A replication study is not typically making a new "claim" that the effect is zero; it is testing the robustness of the original claim.
      *   *The Symmetry Trap:* The interviewee is trying to reframe the replication as a new positive claim ("We claim the effect is zero"). But in the logic of falsification, the replication is the *test*, not the *thesis*. ECREE in this reading dictates who must speak first and louder. That was the original author.

  ### 4. The Field-Level Error Budget Reading (Your Fourth Option)
  *   **Definition:** "Extraordinary" = A claim that consumes a disproportionate amount of the field's credibility capital. "Require" = Systemic safeguards (preregistration, multi-lab, open data) rather than just single-study thresholds.
  *   **Verdict:** **Real and Vital Reading.** This is the modern "reform" interpretation of ECREE. It shifts the focus from the hypothesis to the *process*.
  *   **Does it license the interviewee?** **No.**
      *   *Why:* This reading actually *condemns* the interviewee's position. If a claim is extraordinary, it requires *systemic* evidence (e.g., a Registered Replication Report), not just one initial study. When that systemic evidence (the multi-lab replication) arrives and is null, the "budget" is spent.
      *   *The Symmetry Trap:* This reading does not apply to single hypotheses symmetrically. It applies to the *literature's* tolerance for risk. A null replication is usually the mechanism by which the field balances its error budget, not a claim that draws from it.

  ### 5. The "Entrenched Theory" Reading (The Missing Category)
  *   **Definition:** "Extraordinary" = Contradicts a well-confirmed specific theory (not just general background). "Require" = Evidence strong enough to overturn that specific theory.
  *   **Verdict:** **Substantive, but Rare.**
  *   **Does it license the interviewee?** **Only if...**
      *   *Why:* This is the *only* reading where symmetry is logically possible. If the interviewee's initial study was not a "fishing expedition" but a deduction from a robust, mathematically formalized theory, then $H_1$ is high-prior. Consequently, $H_0$ (the null result) contradicts that theory and becomes the "extraordinary" claim requiring extraordinary evidence.
      *   *The Catch:* Most replication crisis studies (psychology, social priming, etc.) do not fit this. They are usually empirical discoveries lacking deep theoretical derivation. If the interviewee cannot point to a law-like theory that *predicts* their effect, this reading collapses back into Reading 1 (where $H_0$ is the default).

  ---

  ### Analysis of Your Specific Questions

  **1. Is any reading genuinely symmetric?**
  Only the **Entrenched Theory** reading (above) allows symmetry, and only conditionally. For the null result to be "extraordinary," the positive effect must have transitioned from "hypothesis" to "established fact" in the time between the original study and the replication. In a replication crisis context, this is precisely what is in dispute. Using ECREE to assert that transition has already occurred is begging the question. ECREE is structurally a conservative principle designed to protect established knowledge from new claims, not to protect new claims from established knowledge.

  **2. Is the Bayesian reading coherent, or does a fixed standard do the work?**
  The slogan is a heuristic for Bayes' Theorem: $Posterior \propto Likelihood \times Prior$. It is not redundant. A fixed evidential standard (e.g., $p < 0.05$) assumes a generic prior. ECREE correctly identifies that when the prior is low, a generic standard yields a high False Discovery Rate.
  *However*, the interviewee's usage is incoherent because they are trying to use the prior to shield the likelihood. In Bayesian terms, if the prior for $H_1$ was low (making the claim extraordinary), a single null replication (low likelihood for $H_1$) drives the posterior down. To claim the *null* is extraordinary requires asserting the prior for $H_1$ is now high. You cannot use ECREE to update the prior *using the data you are currently defending*.

  **3. Inside a strict error-rate framework, is the slogan inexpressible?**
  In strict Neyman-Pearson (frequentist) testing, the slogan is inexpressible as stated because $\alpha$ is fixed ex ante. To express ECREE here, you must treat the "extraordinary" nature of the claim as a reason to adjust $\alpha$ (e.g., via a Bonferroni correction for "testing the limits of known physics").
  If you do this, the slogan collapses into a uniform recommendation: **"Adjust your significance threshold based on the prior plausibility of the hypothesis."**
  Under this strict framing, the interviewee's move fails because the replication study likely *already* used a stricter threshold (higher power, preregistered). The "extraordinary evidence" was the replication design itself. The null result *is* the extraordinary evidence weighing against the claim.

  **4. Is the "Field-Level Error Budget" a real reading?**
  Yes. It is the most useful modern interpretation. It treats scientific credibility as a common-pool resource. Extraordinary claims risk depleting this resource if false. Therefore, they require "taxation" in the form of rigorous methods. This reading validates the replication effort, not the defense against it.

  ---

  ### The Verdict for Your Feature

  The interviewee's move fails because it treats ECREE as a **shield against falsification**, when its historical and logical function is a **gatekeeper against confirmation**. It is a one-way ratchet.

  If you need a one-sentence replacement to print that captures why the move fails without getting bogged down in stats:

  > "The principle is structurally asymmetric: it dictates how much evidence is needed to *change* our minds, not how much is needed to *keep* them changed once the new evidence fails to materialize."

  Or, if you want to be more pointed about the "extraordinary null" argument:

  > "Calling a null result 'extraordinary' only works if you assume the original finding is already established fact, which is precisely what the replication was designed to test."
