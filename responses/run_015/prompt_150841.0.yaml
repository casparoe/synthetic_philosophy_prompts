      *   **The Argument:** "My effect is extraordinary, so it needs extraordinary evidence. But the claim that my effect *doesn't* exist is *also* extraordinary, so the replication needs extraordinary evidence too. One null result isn't enough."
      *   **Task:** Deconstruct the slogan "Extraordinary claims require extraordinary evidence" (ECREE) by analyzing the ambiguous terms "Extraordinary" and "Require."
      *   **Format:** A "menu" of interpretations/theses. For each: define it, verdict (platitude/substantive/false), and crucially, does it license the interviewee's symmetric move?
      *   **Specific Questions to Address:**
          *   Is any reading genuinely symmetric?
