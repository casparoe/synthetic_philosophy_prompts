      *   **Constraint:** Keep Bayesian vs. Frequentist quarrels in the background unless necessary for coherence.

  2.  **Deconstruct the Terms:**
      *   **"Extraordinary" (The Claim):**
          1.  *Low Prior Probability (Objective/Theoretical):* Conflicts with established laws/background knowledge.
          2.  *Low Prior Probability (Subjective/Sociological):* Conflicts with current consensus/orthodoxy.
          3.  *High Impact/Consequence:* Being wrong costs a lot (policy, health, reputation).
          4.  *Novelty/Surprise:* Just new or counter-intuitive.
      *   **"Require" (The Evidence):**
          1.  *Higher Statistical Threshold:* Lower p-value, higher Bayes Factor.
          2.  *More Data:* Larger N, more studies.
          3.  *Different/Stronger Methodology:* Preregistration, mechanistic evidence, direct measurement.
          4.  *Burden of Proof:* Dialectical shift (you prove it, I don't have to disprove it).
          5.  *Asymmetric Loss Function:* Penalize false positives more than false negatives.

  3.  **Develop the Menu (Combinations):**
      *   I need to pair these up logically to create distinct "readings" of the principle.
      *   *Reading 1: Bayesian Prior Probability.* (Extraordinary = Low Prior; Require = High Likelihood Ratio).
      *   *Reading 2: Error Management/Loss Function.* (Extraordinary = High Cost of Error; Require = Stricter Alpha).
      *   *Reading 3: Sociological/Consensus.* (Extraordinary = Contrarian; Require = More Persuasion).
      *   *Reading 4: Field-Level Error Budget.* (Extraordinary = Risk to Field Credibility; Require = Systemic Safeguards).

  4.  **Evaluate Each Reading against the Interviewee's Move:**
      *   *The Move:* Symmetry. "Null result is also an extraordinary claim."
      *   *Test:* Does the reading allow the null hypothesis to be "extraordinary" in the same way the alternative was?

      *   *Reading 1 (Bayesian):*
          *   Claim H1 (Effect exists) is extraordinary (Low Prior). Needs strong evidence.
          *   Claim H0 (Effect is zero) is... usually the *high* prior (null is default).
          *   *Verdict:* Asymmetric by definition. H0 is rarely "extraordinary" in the low-prior sense unless the background theory *demands* the effect.
          *   *License?* No.

      *   *Reading 2 (Loss Function/Cost):*
          *   Claim H1 is extraordinary (High cost if false, e.g., homeopathy works).
          *   Claim H0 is extraordinary? Only if accepting H0 has high costs (e.g., abandoning a life-saving drug).
          *   *Verdict:* Context-dependent. Usually, false positives in fringe science are costlier than false negatives. But could be symmetric in high-stakes policy.
          *   *License?* Weakly, but usually fails in basic science contexts.

      *   *Reading 3 (Consensus/Orthodoxy):*
          *   Claim H1 contradicts orthodoxy.
          *   Claim H0 supports orthodoxy.
          *   *Verdict:* H0 is the *ordinary* claim.
          *   *License?* No.

      *   *Reading 4 (Error Budget):*
          *   This is about the literature, not single claims.
          *   *Verdict:* Doesn't apply to single study defense.
          *   *License?* No.

  5.  **Address Specific Technical Questions:**
      *   *Symmetry:* Is it ever symmetric? Only if "Extraordinary" means "Any definitive conclusion changes the status quo significantly." But ECREE is historically used to protect the status quo (H0), not to protect H1 from H0.
      *   *Bayesian Coherence:* ECREE is basically a layman's description of Bayes' Theorem (Posterior $\propto$ Likelihood $\times$ Prior). If Prior is low, Likelihood must be high. Saying H0 needs extraordinary evidence implies H0 has a low prior. In most science, H0 (no effect) is the high prior baseline. So the interviewee is claiming their specific effect is so established that *denying* it is the low-probability event. This is the "Theory-Laden" reading.
      *   *Frequentist/Error Rate:* In NHST, alpha is fixed (usually 0.05). ECREE implies variable alpha. So strictly speaking, it's inexpressible in standard NHST without modification (like Bonferroni for "multiple testing" of claims).

  6.  **Refine the Taxonomy:**
      *   The user suggested: Prior-relative, Loss-relative, Dialectical, Field-level.
      *   I should stick close to this but sharpen the definitions.
      *   *Add:* The "Theory-Laden" reading (where H0 is the extraordinary claim because theory predicts H1). This is the only way the interviewee's move works logically, but it requires their theory to be as strong as the background theory they initially violated.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the prompt.
      *   *The Menu:*
          1.  **The Bayesian Prior Reading:** (Low Prior $\rightarrow$ High Likelihood Ratio). *Verdict:* Coherent but Asymmetric. H0 is usually the high prior. Interviewee fails unless they claim their theory is law-like.
          2.  **The Asymmetric Loss Function Reading:** (High Cost $\rightarrow$ Low Alpha). *Verdict:* Substantive. Symmetry depends on costs. Usually, false positives in "extraordinary" science are costlier than false negatives. Interviewee fails unless abandoning the effect is catastrophic.
          3.  **The Sociological/Consensus Reading:** (Contrarian $\rightarrow$ More Persuasion). *Verdict:* Platitude/Truth. H0 is usually consensus. Interviewee fails because replication *is* the consensus-builder.
          4.  **The Dialectical/Burden of Proof Reading:** (Assertion $\rightarrow$ Obligation to Prove). *Verdict:* Procedural. The initial claimant bears the burden. Replication tests robustness, doesn't make a new claim. Interviewee fails; replication isn't making a "claim," it's testing one.
          5.  **The Field-Level Error Budget (User's 4th):** (Risk to Credibility $\rightarrow$ Systemic Rigor). *Verdict:* Real reading, but applies to the field, not the specific defense. Doesn't license the move.

      *   *Addressing the "Symmetry" Question:* Explicitly state that ECREE is structurally asymmetric. It protects the background theory. To symmetrize it, you must claim the *new* finding has become background theory. This is the "Entrenchment" move.
      *   *Addressing the "Bayesian Coherence":* It's not redundant; it's a heuristic for updating priors. But it doesn't support the interviewee's inversion unless the prior has flipped.
      *   *Addressing the "Frequentist" Question:* It collapses into "adjust your alpha for the prior probability of the hypothesis," which standard NHST doesn't do.

  8.  **Final Polish:**
      *   Ensure tone is appropriate for a journalist (precise, analytical, usable).
      *   Check the "One Sentence" requirement if nothing survives. (Something does survive, but the *interviewee's use* does not).
