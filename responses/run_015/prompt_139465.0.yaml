answer: |-
  You are describing a phenomenological rupture, not an ethical judgment. You are right to dismiss "Death of the Author" (which is about interpretation, not engagement) and simple "contagion" (which implies the object is dirty rather than the channel broken). You are also right that standard aesthetic moralism (the debate over whether moral defects are aesthetic defects) misses the *shape* of the behavior you're seeing.

  There is no single established term that captures this specific four-point configuration. However, the mechanism you are describing maps almost perfectly onto a breakdown in **Narrative Trust**.

  Reading is not a passive reception of data; it is a collaborative act of imagination. The reader loans their own interiority to the author to be guided through a simulated experience. This loan is predicated on a tacit contract: *I will surrender my skepticism to your voice, provided you do not exploit that surrender.*

  When that contract is breached, the specific configuration you've observed occurs. I propose we call this **The Narrative Trust Veto**.

  Here is why this term fits your four features, why it distinguishes the phenomenon from its neighbors, and where the boundaries lie.

  ### 1. The Mechanism: Why the Flaw is Local but the Withdrawal is Global
  **Feature:** *Local damage, total cessation.*
  **Explanation:** Trust is binary. You do not cross a bridge that is "90% safe." If the structural integrity is compromised, the utility drops to zero, regardless of how beautiful the railings are.
  In reading, the "flaw" you identified (the specific passage that now reads as a sales pitch) is not experienced by the reader as an isolated error. It is experienced as a **keystone failure**. It reveals that the *source* of the narration is compromised. If the narrator's voice is now suspected of manipulation in one instance, the reader cannot safely surrender to it in any instance. The global withdrawal is not disproportionate; it is the only rational response to a loss of safety in a vulnerable position.
  **Essential?** Yes. The binary nature of trust is essential to the Veto.

  ### 2. The Asymmetry: Why Art Cannot Redeem the Person
  **Feature:** *One-directional leak.*
  **Explanation:** Trust is fragile; evidence of trustworthiness is cumulative, but evidence of betrayal is immediate. This is known in psychology as **Negative Dominance**. A single act of coercion proves the capacity for coercion; a thousand acts of kindness do not prove the *incapacity* for coercion.
  Therefore, a beautiful book (evidence of competence/kindness) cannot cancel a coercive act (evidence of danger). But the coercive act voids the safety required to enjoy the book. The ledger is not balanced because the currencies are different: one is aesthetic merit, the other is relational safety.
  **Essential?** Yes. The asymmetry is a defining feature of trust dynamics.

  ### 3. The Thematic Proximity: Why Fishing is Okay but Coercion is Not
  **Feature:** *Sensitive to subject matter.*
  **Explanation:** This is the **Complicity Threshold**. When the subject matter of the book is distant from the author's crime (fishing vs. coercion), the reader can compartmentalize. They are not being asked to simulate the specific harm the author inflicted.
  However, when the subject matter overlaps (a book about grooming by an author who groomed), the act of reading becomes **vicarious participation**. To imagine the scene is to rehearse the crime. The reader is no longer a collaborator; they feel like an accomplice. The Trust Veto triggers because the "loan of imagination" is now being used to fund a simulation of harm.
  **Essential?** Yes. This distinguishes the Veto from a general boycott. A boycott rejects the person entirely; the Veto rejects the *intersection* of the person and the specific text.

  ### 4. The Temporal Decay: Why Dead Authors Get a Pass
  **Feature:** *Stops biting after a century.*
  **Explanation:** Trust is a **living contract**. It exists between two consciousnesses. When an author is dead, they can no longer benefit from your royalties, they can no longer wield power, and they can no longer betray you *now*. Their crimes become historical data, like the weather, rather than active threats.
  The relationship shifts from *collaboration* to *archaeology*. You are no longer trusting a partner; you are examining an artifact. The Veto requires a living agent to veto.
  **Essential?** Yes. This is the boundary line between the Veto and historical judgment.

  ### Boundary Cases: What It Is Not

  To ensure this definition holds, we must distinguish **The Narrative Trust Veto** from its neighbors:

  *   **It is not a Boycott.** A boycott is an external, political, or economic action taken to punish the author. The Veto is an internal, phenomenological inability to sustain the aesthetic experience. A boycotter *can* read the book but chooses not to. A reader under a Trust Veto *cannot* read the book because the mechanism of reading has broken.
  *   **It is not the "Horn Effect."** The Horn Effect is a cognitive bias where one negative trait colors all perception (e.g., "he is bad, so his writing is bad"). In the Veto, the reader admits the writing is *good*. The judgment is not on the quality of the text, but on the *viability of the relationship*.
  *   **It is not "Biographical Reading."** Biographical reading uses the author's life to unlock meaning (e.g., "Knowing he was depressed explains this sad passage"). The Veto does not change the meaning; it blocks the *access*. As you noted, the reader agrees on what the book says; they just can't "do" the reading anymore.
  *   **It is not "Cancel Culture."** Cancellation is a social enforcement mechanism. The Veto is often private. The reader you described didn't necessarily tweet about it; they just emailed you to say the chapter hits different and put the book away.

  ### The Accidental Features

  Of your four observations, three are essential to the **Narrative Trust Veto** (Binary nature, Asymmetry, Temporal limit). One is slightly more variable:

  *   **Thematic Proximity:** While essential to the *severity* of the Veto, the threshold varies by reader. Some readers have a zero-tolerance policy (Total Veto regardless of theme); others have a high Complicity Threshold (only Veto on direct overlap). However, the *existence* of a threshold is essential, even if the placement varies.

  ### Summary Definition

  **The Narrative Trust Veto** is the collapse of the reader's willingness to sustain the imaginative collaboration required for aesthetic experience, triggered by a breach of ethical safety in the author.

  It is characterized by:
  1.  **Disproportionate Response:** A localized breach of trust causes total engagement failure (the binary switch).
  2.  **Irreversibility:** Aesthetic merit cannot restore ethical safety (negative dominance).
  3.  **Contextual Sensitivity:** The veto is strongest when the text requires the reader to simulate the specific harm caused by the author (complicity).
  4.  **Relational Limit:** The veto expires when the author ceases to be a living agent capable of betrayal (the death of the trustee).

  You asked for the edges of the thing. The edge is **agency**. If the author is alive and benefiting, the Veto is active. If the author is dead, or if the text is entirely abstract (no thematic overlap), the Veto recedes. The edge is not in the text's quality, but in the *risk* the reader perceives in lending their mind to the author's voice.

  You are not observing a judgment on your novels. You are observing a measurement of the risk your readers are willing to take on your behalf. That is a terrifying metric, but it is the only one that explains why a single sentence can burn down a whole house.
