prompt: |-
  I referee for a couple of journals and I'm on hiring committees most years, and I keep running into the same shape of thing without having a word for it.

  Here's how it goes. I read a paper and I form a view on the merits: it's weak, the central argument doesn't work. Or I read a file and think the candidate is strong. Then I notice something about the *process* that produced the view rather than about the object: I'm reading the sixth submission of the day and I'm fried; or I liked the previous two papers for similar reasons so I'm probably in a groove; or the candidate works in exactly the subfield I'm protective about; or everyone who agrees with me on this committee also agreed with each other on the last three hires. And noticing that seems like a genuine reason to move my confidence down, not just a vague feeling of humility.

  But here's the part I can't get straight. The same noticing seems available at the next level up. Someone who is tired and irritable is, as far as I can tell, not especially good at judging whether they're tired and irritable. Someone with a bias is usually quite confident that *this* case is the one where the bias doesn't apply. So the reason to discount seems to reapply to itself. And then again. In practice nobody actually spirals — I get to a level and I stop, usually with something like "I'm too fried to have an opinion on this, let's table it and look tomorrow." But the stop doesn't come with a reason for stopping at that level rather than one up or one down, and I can't tell whether that's a principled stopping point I'm grasping at or just where my patience runs out.

  It shows up in arguments too. Someone says "you only believe that because you're X" — employed by the industry, going through a divorce, a fan of the rival team, raised in a particular place. Sometimes that's accepted as a real reason to discount and sometimes it's treated as a cheap way to avoid engaging with the claim. It looks like the same move getting opposite verdicts, and I don't know what separates the good version from bad one.

  There's also a version that runs in reverse and I don't know if it's the same animal: I've gone at a problem from four different angles and kept landing in the same place, and that feels like evidence *for* the conclusion, not just an absence of undermining. Is that the same mechanism pointed the other way, or something else entirely?

  Things I've been told to call it, and why I don't think either fits: I've seen "higher-order evidence" used for something nearby, but as far as I understand it that's mostly about learning that some expert or peer disagrees with you — a datapoint about disagreement coming from outside. Here there's no second opinion; I'm generating the doubt from inside the process, and the doubt is about the process itself rather than about how my view compares to someone else's. A friend suggested "epistemic akrasia," but that sounds like it's about ending up believing something while also thinking you shouldn't believe it, and what I end up with usually isn't a belief at all — it's a shrug, or a confidence that drops to nothing in particular rather than migrating to the other side.

  I'm after more than a label, though. I want to know: whether the self-applying bit is a genuine regress or only looks like one, and if there's a principled place to stop, what makes it principled; whether the *scope* of the doubt is what does the work — doubt about this one episode (I'm tired right now) versus doubt about the kind of situation I'm in (people in my position reliably get this wrong) versus doubt about everybody (humans just aren't good at this) — because my guess is that the narrow version is self-limiting in a way the wide version isn't, but I can't say why; and what the boundary is between the legitimate and the cheap version of "you only say that because." If the honest answer is that there's no established thing here and the best move is to draw the distinctions myself, I'd rather be told that with the distinctions drawn than handed a name that doesn't quite cover it.

  The reason I'm asking rather than just shrugging: I'd like to know whether a committee should build any of this into how it treats a first-pass verdict, or whether the zoom-out only ever works as a one-off check and collapses into noise if you try to make it a rule.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Phenomenon:** The user experiences a specific epistemic situation where they form a judgment (e.g., paper is weak, candidate is strong), then notice a *process factor* (fatigue, bias, groupthink) that undermines confidence in that judgment.
      *   **The Problem:** This undermining move seems to apply recursively. If I doubt my judgment because I'm tired, can I doubt my assessment of my tiredness? If I doubt my bias, isn't that doubt also potentially biased? This looks like an infinite regress, yet in practice, people stop at some point (e.g., "I'm too tired, let's table this").
      *   **The "Ad Hominem" Variant:** Sometimes "you only believe that because X" is a valid critique (genetic fallacy vs. legitimate undermining), sometimes it's cheap. What's the boundary?
      *   **The Reverse Variant:** Converging on the same answer from different angles feels like *positive* evidence. Is this the same mechanism?
      *   **Rejected Labels:** "Higher-order evidence" (usually external/peer disagreement), "Epistemic Akrasia" (believing $P$ while believing one shouldn't believe $P$).
      *   **Desired Output:** Not just a label, but an analysis of:
          1.  Is the regress genuine or apparent? Where is the principled stopping point?
          2.  Does the *scope* of the doubt (specific episode vs. general situation vs. human nature) matter?
          3.  What distinguishes legitimate process-doubt from cheap dismissal?
          4.  Practical advice for committees (rule vs. one-off check).

  2.  **Initial Brainstorming & Concept Mapping:**

      *   *Philosophy:* This screams meta-epistemology. It relates to defeasibility, reliability, and calibration.
      *   *Psychology:* Metacognition, cognitive bias, heuristic processing.
      *   *The Regress:* This is the "Pyrrhonian Skeptic" problem but applied to internal reliability. If I check my thermometer, how do I check the check?
      *   *Stopping Point:* Pragmatism? Diminishing returns? Reliability of the meta-cognitive signal?
      *   *Scope:* Specific fatigue is a *defeater*. General human fallibility is a *background condition*.
      *   *The "Because" Claim:* Genetic Fallacy vs. Causal Explanation. If the cause *tracks truth*, it's good. If the cause *distorts truth*, it's bad.
      *   *Convergence:* Robustness analysis. Triangulation.

  3.  **Developing the Analysis (Drafting the Core Arguments):**

      *   **Naming it:** The user is right that "higher-order evidence" is close but usually implies external sources. This is *Internal Meta-Epistemic Defeasibility*. Or *Procedural Defeaters*. Let's stick to describing it rather than forcing a label, but acknowledge "Higher-Order Evidence" (HOE) is the closest technical term, just needs widening to include internal states. Actually, "Defeasibility" is key. Specifically, *Undercutting Defeaters*.
      *   **The Regress:** Is it vicious? No. It's a *practical* regress, not a logical one. Each level costs energy/time. The stopping point is determined by *marginal utility*. Level 1: Is the paper good? Level 2: Am I fit to judge? Level 3: Am I fit to judge my fitness? At Level 3, the cost of checking exceeds the value of the precision gained. Also, some meta-cognitive signals are more reliable than object-level signals (e.g., recognizing "I am angry" is easier than "This argument is sound").
      *   **Scope:** This is crucial.
          *   *Local Defeater:* "I am tired *now*." This stops the regress because it's a specific, checkable fact (time of day, subjective feeling).
          *   *Global Defeater:* "Humans are biased." This leads to skepticism.
          *   *The Distinction:* Local defeaters are *contingent*. Global defeaters are *structural*. You can fix the local (sleep). You can't fix the global (being human). Therefore, local doubt is actionable; global doubt is paralyzing.
      *   **The "Because" Argument (Ad Hominem):** When is it valid? When the causal factor is *truth-irrelevant* or *truth-obscuring*.
          *   Valid: "You say the factory is safe because you own the factory." (Conflict of interest biases the process).
          *   Invalid: "You say 2+2=4 because you went to public school." (The cause doesn't affect the truth).
          *   Key: Does the causal explanation *compete* with the truth-tracking explanation?
      *   **Convergence (The Reverse):** Yes, it's the same mechanism. It's *Robustness*. If different processes (angles) yield the same result, the likelihood that *all* processes share the same specific bias decreases. This is "Triangulation."
      *   **Committee Advice:** Don't make it a rigid rule (leads to paralysis). Make it a *trigger*. If specific local defeaters are present (fatigue, conflict), trigger a protocol (table it, recuse). Don't institutionalize global skepticism.

  4.  **Refining the Terminology:**

      *   *Undercutting Defeater:* A reason to think the connection between evidence and conclusion is broken. (Perfect fit).
      *   *Meta-Cognitive Calibration:* The ability to judge one's own cognitive state.
      *   *The "Swamping" Problem:* If I know the process is biased, does the truth of the claim matter?
      *   *Pragmatic Encroachment:* When does the cost of checking outweigh the benefit?

  5.  **Structuring the Response:**

      *   **Acknowledge and Validate:** This is a deep, recognized problem in epistemology, even if the specific "internal process" angle is less standardized than peer disagreement.
      *   **Section 1: The Label.** Suggest "Internal Undercutting Defeaters" or "Meta-Cognitive Defeasibility." Acknowledge HOE is the neighborhood.
      *   **Section 2: The Regress.** Explain why it's not vicious. Distinguish between *logical* possibility of doubt and *pragmatic* necessity of action. The stopping point is where meta-cognitive reliability > object-level reliability (usually) or where cost > benefit.
      *   **Section 3: Scope (Local vs. Global).** This answers the "why stop here" question. Local defects are fixable/avoidable. Global defects are not.
      *   **Section 4: The "Because" Claim.** Distinguish between *causal genealogy* that competes with truth-tracking vs. one that doesn't. (The "Swamping" test).
      *   **Section 5: Convergence.** Identify this as "Robustness" or "Triangulation." It's the positive side of the same coin.
      *   **Section 6: Committee Policy.** Practical takeaways. Triggers vs. Rules.

  6.  **Self-Correction/Nuance Check during drafting:**

      *   *Correction:* I need to be careful not to just say "pragmatism." The user wants to know if there's a *principled* stop. The principle is *reliability*. Meta-cognitive judgments about fatigue are often *more* reliable than object-level judgments about philosophical arguments. That breaks the symmetry.
      *   *Nuance:* The user mentioned "Epistemic Akrasia." I should clarify why that's not quite it (Akrasia is holding conflicting attitudes; this is suspending judgment).
      *   *Nuance:* The "Reverse" case. Is it the same? Yes, it's assessing the *reliability of the process*. Negative: Process is noisy. Positive: Process is robust.

  7.  **Final Polish:** Ensure the tone is respectful, intellectual, and matches the user's high level of sophistication. (They are clearly an academic/philosopher). Avoid oversimplifying. Use the "Undercutting Defeater" framework as the backbone.

      *(Self-Correction on "Higher-Order Evidence"):* Actually, contemporary epistemology *does* include internal states under HOE. E.g., "I see that I am drunk" is higher-order evidence about my reliability. I should correct the user's slight misconception there while validating their intuition that it feels different from peer disagreement.

      *(Refining the Regress Argument):* The regress stops because the *content* of the levels changes. Level 1: World. Level 2: Mind. Level 3: Mind's view of Mind. Access to Level 2 is often more direct (introspection) than Level 1 (inference). So the reliability curve isn't flat; it peaks at the meta-level regarding physiological states.

  8.  **Finalizing the Advice:** Committee wise: Codify the "Local Defeaters" (conflict of interest, fatigue protocols) but warn against codifying "Global Skepticism."

  9.  (Drafting the response based on these points.)
answer: |-
  This is a sharp observation of a structural problem in epistemology that doesn't have a single, settled name, though it sits at the intersection of **meta-epistemology**, **psychology of reasoning**, and **practical deliberation**.

  You are describing a specific class of **internal undercutting defeaters**.

  An "undercutting defeater" (a term from the epistemologist John Pollock) is a reason to believe that your evidence does not support your conclusion, without necessarily proving the conclusion false. Usually, this is discussed regarding external factors (e.g., "the lighting is red"). You are identifying *internal, procedural* undercutting defeaters.

  Here is an analysis of the regress, the scope, the "because" claim, and the practical application for committees.

  ### 1. The Regress: Why it isn't vicious
  You ask whether the self-applying doubt creates a genuine regress or if there is a principled stopping point.

  It looks like a regress because you assume the *reliability* of each level is identical. If Level 1 (judging the paper) is 60% reliable, and Level 2 (judging your fatigue) is also 60% reliable, then doubting Level 2 requires a Level 3, and so on.

  But the reliability is **not** identical. The regress stops because access to the higher-order state is often *more direct* than access to the object-level state.

  *   **Level 1 (Object):** "Is this argument sound?" This requires complex inference, background knowledge, and interpretation. High cognitive load, high error rate.
  *   **Level 2 (Meta):** "Am I tired?" This relies on interoception and self-monitoring. While not perfect, the signal-to-noise ratio for "I am exhausted" is generally higher than "This proof is valid."
  *   **Level 3 (Meta-Meta):** "Am I reliable at judging my tiredness?" This is where diminishing returns hit hard. Unless you have a specific reason to suspect alexithymia or mania, the default prior is that your perception of your own fatigue is more reliable than your perception of a complex external argument.

  **The Principled Stopping Point:** You stop when the **marginal reliability gain** of the next level of scrutiny drops below the **cognitive cost** of performing it, or when you reach a level of access that is *non-inferential*.
  Recognizing you are "fried" is often non-inferential (a feeling). Judging the paper is inferential. You can doubt an inference with a feeling; you generally cannot doubt a raw feeling with another inference without circularity.

  So, the stop isn't just patience running out; it's hitting the bedrock of introspective access.

  ### 2. Scope: Local vs. Global Defeaters
  You suspected the scope of the doubt matters. You are correct. This is the difference between a **specific undercutting defeater** and a **general skeptical hypothesis**.

  *   **Local/Specific:** "I am tired *today*," "I am protective of *this* subfield."
      *   These are contingent facts. They can be true or false. They can be remedied (sleep, recusal). Because they are contingent, they function as *switches*. If true, they disable the verdict. If false, the verdict stands.
  *   **Global/General:** "Humans are biased," "Committees always groupthink."
      *   These are structural facts. They are always true. If you allow these to function as defeaters, they defeat *everything*, including the defeater itself. This leads to the paralysis you described.

  **Why the narrow version is self-limiting:**
  A local defeater points to a *deviation* from your baseline reliability. It implies there is a baseline where you *are* trustworthy.
  A global defeater attacks the baseline itself.

  In practice, the "good" version of your doubt is always local. "I am too fried to judge *this* paper" is actionable. "I am a human and therefore unreliable" is not. The principled boundary is **actionability**. If the doubt suggests a specific remediation (sleep, wait, recuse), it is legitimate. If it suggests only paralysis, it is likely global skepticism in disguise.

  ### 3. The "Because" Claim: Genealogy vs. Truth-Tracking
  You asked about the boundary between legitimate discounting ("you only say that because you're employed by the industry") and the genetic fallacy.

  The distinction lies in whether the causal explanation **competes** with the truth-tracking explanation.

  *   **Legitimate Undermining:** The causal factor makes it *unlikely* that the belief was formed by truth-tracking processes.
      *   *Example:* "You believe the chemical is safe because you own the factory."
      *   *Why it works:* Financial interest is a known distorter of risk assessment. The causal story (profit motive) rivals the truth story (scientific evidence). We have independent reason to think profit motives override evidence in this context.
  *   **Illegitimate Dismissal:** The causal factor is compatible with the belief being formed by truth-tracking processes.
      *   *Example:* "You believe 2+2=4 because you went to public school."
      *   *Why it fails:* Going to school explains *how* you learned it, but it doesn't explain why you *retain* the belief in the face of counter-evidence. The causal story does not rival the truth story.

  **The Test:** Ask, "If the claim were false, would this person still believe it due to this cause?"
  *   If Yes (The factory owner would claim safety even if it were toxic): The "because" is a legitimate defeater.
  *   If No (The mathematician would not believe 2+2=4 if it were false): The "because" is irrelevant.

  ### 4. The Reverse: Convergence as Robustness
  The reverse case you mentioned ("I've gone at this from four angles and landed in the same place") is indeed the same mechanism pointed the other way. In philosophy of science and modeling, this is called **Robustness Analysis** or **Triangulation**.

  *   **Negative Case (Your fatigue):** You identify a single point of failure in the process. The reliability of the output is capped by the reliability of the weakest link.
  *   **Positive Case (Convergence):** You identify multiple independent pathways to the same conclusion. The reliability of the output is boosted because it is unlikely that *all* pathways share the *same* specific bias.

  This is not just an "absence of undermining." It is positive evidence of **stability**. If your conclusion depends on one specific assumption, it is fragile. If it holds across different methodological assumptions, it is robust. This is the strongest argument you can have for a view, precisely because it inoculates against the specific process-doubts you worry about.

  ### 5. Practical Advice for Committees
  You asked whether a committee should build this into a rule or treat it as a one-off check.

  **Do not institutionalize the regress.**
  If you make "check your checking" a formal rule, you invite performative skepticism and paralysis. However, you *should* institutionalize the **Local Defeaters**.

  **Recommended Protocol:**
  1.  **Codify Specific Triggers:** Create a short list of recognized "process defeaters" that mandate a pause.
      *   *Examples:* Conflict of interest, reviewing > X papers in one session, lack of expertise in the specific niche.
      *   *Action:* If triggered, the verdict is automatically suspended (table it, assign a new reviewer).
  2.  **Require "Process Statements" (Light Touch):** When submitting a verdict, ask reviewers to tick a box: "Are there any factors that might have influenced this assessment (fatigue, recent similar work, personal connection)?"
      *   This forces the Level 2 check without requiring a Level 3 justification. It brings the meta-cognition into the record without inviting infinite doubt.
  3.  **Use Convergence as a Tie-Breaker:** When the committee is split, prioritize the arguments that have been reached via independent paths (e.g., "The teaching evaluation and the research statement both point to X") over arguments that rely on a single strong signal.

  ### Summary of Terms
  If you need to label this for yourself or colleagues:
  *   **Internal Undercutting Defeater:** The technical epistemological term.
  *   **Meta-Cognitive Calibration:** The psychological process of adjusting confidence based on internal state.
  *   **Procedural Robustness:** The positive version (convergence).

  **The Bottom Line:**
  The regress is not vicious because your access to your internal state (fatigue/bias) is epistemically privileged compared to your access to the external object (the paper/candidate). The stopping point is principled: it is where introspection meets inference. Legitimate doubt is local and actionable; illegitimate doubt is global and paralyzing. Build protocols for the former, ignore the latter.
