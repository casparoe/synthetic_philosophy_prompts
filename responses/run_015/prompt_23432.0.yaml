      *   *Topic (c) Independence of Signals:*
          *   Q5: Conditional independence is crucial. In RecSys, everyone sees the same top-3 reviews. Signals are correlated. Does the cascade threshold change?
          *   Follow-up: She'll say "correlated signals slow down cascades." Push on: Or do they create *false* cascades faster because the public signal looks stronger than it is? (The "common noise" problem).
          *   Q6: Social Learning vs. Cascade. If signals are correlated, are we just observing Bayesian updating on a common public signal rather than sequential actions?
          *   Follow-up: She'll distinguish "action observability." Push on: If the action adds no info beyond the common signal, is the "cascade" label just semantic?

      *   *Topic (d) Informational vs. Reputational:*
