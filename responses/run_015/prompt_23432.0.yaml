  2.  **Deconstruct the Canonical Model (BHW 1992):**
      *   Sequential decisions.
      *   Binary state ($V \in \{0, 1\}$).
      *   Private signals ($s_i$) are conditionally independent given $V$.
      *   Public history ($H_i$) = actions of predecessors.
      *   Decision rule: Maximize expected utility based on posterior.
      *   Cascade occurs when $P(V|H_i)$ is so strong that $s_i$ doesn't change the action.
      *   *Weaknesses:* Fragility (small shock breaks it), Independence (violated in social media), Timing (why not wait?), Reputational motives (Scharfstein/Stein).

  3.  **Drafting Questions - Strategy:**
      *   Need to ensure the required topics (a, b, c, d) are covered.
