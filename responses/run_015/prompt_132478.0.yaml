answer: |-
  **Mock Philosophy Exam: Ethics of Everyday Life**

  **Question 1 (Essay)**
  Consider three common social practices: tipping service workers, queueing in line, and jaywalking. Some philosophers argue these are merely "coordination games"—arbitrary rules we follow so we don't crash into each other, meaning visitors have no real duty to follow them unless they want the benefits. Others argue these practices create "reciprocal expectations" that function like tacit promises, generating a moral duty even for outsiders.

  Critically evaluate these two views. Does the "coordination game" framing make moral obligations agent-relative and context-bound? Conversely, does the "tacit promise" framing create a stronger duty, and if so, does that duty disappear when the convention itself is unfair or oppressive? Use at least two of the practices mentioned above to illustrate your answer.

  ***

  **Model Answer**

  When we look at everyday rules like queueing or tipping, the first question is whether they are actually *moral* or just practical. The "coordination game" view suggests the latter. Think of driving on the left vs. the right side of the road. It doesn't matter which side you pick, as long as everyone picks the same one. In this view, queueing is just a way to avoid fights over who gets served first. If I'm a visitor from a place where people crowd around a counter instead of lining up, I haven't done anything *wrong* morally by crowding; I've just failed to coordinate. This makes the obligation agent-relative. It only binds me if I want to participate in that specific social system. If I don't care about the local chaos, the duty evaporates. It's context-bound because the rule only exists where the convention exists.

  However, the "tacit promise" view pushes deeper. When I step to the back of a queue, I'm not just avoiding bumps; I'm signaling to everyone else, "I won't cut in if you don't." I benefit from their restraint, so fairness demands I reciprocate. This creates a stronger duty based on fairness rather than just efficiency. If I cut the line, I'm effectively lying to the people behind me who are waiting based on my behavior. This applies to tipping too. If I eat at a restaurant where tipping is the norm, I'm accepting a service contract where the waiter expects that extra pay. To not tip is to break a tacit agreement.

  But the tacit promise view gets shaky when the convention is broken to begin with. A promise to do something unfair isn't binding. For example, if a queue is segregated by race, joining it might validate an oppressive system. Similarly, if tipping is used by employers to avoid paying a living wage, is the visitor morally obligated to subsidize the老板 (boss)? Here, the reciprocal expectation collapses because the system itself is exploitative. So, while the promise view gives us a stronger reason to follow local rules than the coordination view, it isn't absolute. We have to ask if the convention is neccessary for social order or if it's just enforcing bad norms.

  ***

  **Marking Scheme**

  **Grade A (Excellent)**
  *   **Dual Frameworks:** Clearly explains both the "coordination game" (arbitrary/practical) and "tacit promise" (fairness-based) views.
  *   **Application:** Successfully maps both frameworks onto at least **two** specific practices (e.g., queueing AND tipping OR jaywalking).
  *   **Agent-Relativity:** Explicitly discusses why the coordination view makes obligations context-bound (i.e., "I only have to do this if I want the benefit of this specific system").
  *   **The Limit Case:** Identifies the problem with the promise view regarding unfair/oppressive conventions (e.g., noting that you can't promise to do something unjust).
  *   **Clarity:** Argument flows logically; terms are defined simply.

  **Grade B (Good)**
  *   **Dual Frameworks:** Describes both views but might lack depth on *why* they differ (e.g., treats them as just "practical vs. moral" without explaining the mechanism).
  *   **Application:** Mentions the practices but applies the theories vaguely (e.g., says "queueing is a promise" but doesn't explain who is promising what).
  *   **Missing Nuance:** Misses the "agent-relative" point or fails to explain why context matters for the coordination view.
  *   **The Limit Case:** Fails to address what happens when the convention is unfair or oppressive (treats the duty to follow local customs as absolute).
  *   **Clarity:** Understandable but lacks critical edge.

  **Grade C (Basic)**
  *   Only discusses one view (usually "When in Rome").
  *   No specific application to the practices.
  *   Confuses legal rules with moral conventions.

  ***

  **Meta-Commentary: Where I Might Be Wrong**

  **What would change my mind?**
  I'm currently siding with the idea that unfair conventions dissolve the duty (the "Limit Case" in the model answer). However, if there was strong empirical evidence that *not* following an oppressive convention causes more immediate harm to vulnerable people than following it, I'd have to rethink. For example, if refusing to tip in a wage-theft system gets the waiter fired immediately, whereas tipping sustains the system long-term, the "harm principle" might override the "fairness principle." I'd need a better framework for weighing immediate vs. systemic harm.

  **Where is my reasoning likely to fail?**
  My reasoning probably fails on the definition of "opting in." In the coordination game view, I say you only have a duty if you want the benefits. But in a globalized world, can you really opt out? If I visit a country, I'm benefiting from their infrastructure even if I don't want to. My distinction between "visitor" and "local" might be too clean. Also, I might be underestimating how hard it is for a visitor to know if a convention is oppressive. If I don't know the tipping culture is exploitative, am I still blameworthy? The model answer assumes knowledge I might not have.

