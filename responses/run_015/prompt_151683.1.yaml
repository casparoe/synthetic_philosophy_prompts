      *   **DAO Governance/Reputation Weighted Bidding:** Voting or proposal submission where influence is tied to tokens or reputation (e.g., Quadratic Voting, Conviction Voting, or just token-weighted governance). "Bidding" here isn't usually paying to win a prize, but spending political capital/reputation to push a proposal.
