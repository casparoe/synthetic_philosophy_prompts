answer: |-
  ### Quick Brainstorm

  *   **Core Tension:** Camp A (Schefflerian) grounds the badness of extinction in the *conditions for current meaning*. Our projects matter *because* others will inherit them. Camp B (Moral Progress) grounds the badness of extinction in the *objective moral trajectory*. The universe is morally incomplete, and only future agents can complete it.
  *   **The "New Parent" Angle:** The intuition that "extinction hits different" post-birth aligns with Scheffler (my child is my literal afterlife), but Camp B worries this is just biological selfishness dressed up as philosophy. Camp B wants to say extinction is bad even if you didn't care about your kid, because it locks in moral errors.
  *   **Agreement Ground:** Both reject simple utilitarianism (sum of lives) and simple person-affecting views (harm to specific individuals). Both agree extinction is a *qualitative* catastrophe, not just quantitative.
  *   **Disagreement Ground:** Is the "collective afterlife" a constitutive part of the good (A), or is it a psychological vessel for the real good, which is moral correction (B)?
  *   **Crux 1 (Psychology vs. Morality):** Does the feeling of "living on" track value, or is it a heuristic?
  *   **Crux 2 (Agents vs. Abstract):** Does moral progress require *someone* to do the progressing, or is the *truth* of the progress enough? Camp B says agents are necessary tools. Camp A might argue agents are necessary *valuers*.

