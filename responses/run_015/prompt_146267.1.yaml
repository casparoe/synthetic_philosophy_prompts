answer: |-
  Welcome, everyone. Thanks for coming.

  I'll be honest, when we started planning this, I thought the title—*After the Fall*—was pretty straightforward. You know, things go up, things come down. We look at what's left afterwards. But the more I looked at the list of people in this room, the more I realized how weird this conversation is going to be. And I mean that in the best way.

  We've got people here who spend their lives in the Late Bronze Age, others deep in the Maya lowlands, someone looking at Rapa Nui... and then we have folks working on climate resilience today, where the stakes are obviously incredibly high. I'm not an expert in any of those fields. I just run the programs. But I've been sitting with this idea of "collapse" for the last few weeks, trying to figure out what I'm actually welcoming you into.

  Here's what's been bugging me. We talk about collapse like societies are objects. Like a vase that slips off a table. But a society isn't a vase. Maybe... maybe sometimes they just stop being the kind of thing that can fall over.

  I used to think collapse was obvious. Until I started wondering what kind of thing has to exist for failure to even be possible? Like, if you lose the palace bureaucracy in the Bronze Age, or the writing system, or the central authority... have you collapsed? Or have you just transformed into something else? Something that doesn't have that specific failure mode anymore. You're not in the same ontological category.

  Same with the Maya. It's not that everyone vanished. It's that they stopped being a centralized state. And centralized-state failure modes don't apply to whatever came next. Even Easter Island—it might not be about a society falling over like a tree. It might be about a community changing its resource base and social form because the old one wasn't working.

  But—and this is the part I can't let go of—I don't want to sound like I'm denying the suffering. Because people clearly died. Cities emptied. Knowledge was lost. The experience was catastrophic for individuals even if the "collapse" is just a retrospective label we slap on to make sense of discontinuity.

  And I know for some of you, especially those working on policy and climate, you need collapse to be real. You need it to be a warning. I get that. If I tell you it's just a category error, that doesn't help you prevent suffering tomorrow. So I want us to hold that tension. That collapse might be the wrong word, but the pain was real.

  I don't have the answer. I don't think there is one. But I'm hoping that over the next couple of days, we can sit in that uncertainty together without trying to resolve it too quickly. We're here to think out loud, not to deliver settled opinions from on high.

  So, welcome. Let's see what happens when we stop assuming we know what falling looks like.
