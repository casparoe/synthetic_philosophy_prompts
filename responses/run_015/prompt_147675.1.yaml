answer: |-
  Lord of the Flies ultimately demonstrates the fragility of institutional supererogation, revealing that what begins as a collective moral excess beyond mere survival collapses into a distributive failure of duty once the group agent fractures under psychological pressure.

  The framing of the boys' initial organization as institutional supererogation holds water only if we define their baseline duty strictly as biological survival rather than social continuity. In the first assembly, the establishment of the conch and the signal fire functions as a non-distributive collective commitment; no single boy is obligated to maintain civilization alone, but the group *as a body* chooses to pursue rescue and order rather than mere subsistence. This aligns with your concept of institutional supererogation because the act—maintaining a signal fire—is risky, costly, and exceeds the immediate imperative of eating or sleeping. When the ship passes while the fire is out, the tragedy isn't just that the watchman slept, but that the *institution* failed to sustain its supererogatory project. The guilt is shared collectively ("We let the fire out"), suggesting the moral burden belongs to the group agent, not just the individual negligent party. This scene illuminates the tension in your theory: supererogatory acts require sustained voluntary commitment, but the group's capacity for that commitment is finite.

  The framework collapses, however, when Jack's faction secedes, because institutional supererogation presupposes a unified agency that can no longer exist once the "institution" dissolves into warring tribes. When Jack declares, "We don't need the conch anymore," he is effectively rejecting the supererogatory project of democratic order in favor of a distributive hierarchy based on force. The death of Piggy is the philosophical pivot point here; Piggy represents the institutional memory and the voice of the supererogatory obligation (the link to the adult world of rules). His death isn't just a murder; it is the ontological destruction of the group agent capable of performing higher-order moral acts. Once Piggy dies and the conch shatters, the possibility of non-distributive moral action vanishes because there is no longer a "we" to bear the responsibility. The remaining boys are reduced to individual agents or a mob, incapable of collective virtue, only collective violence.

  What Golding's narrative adds to pure ethical argument is the visceral cost of maintaining institutional agency against the entropy of human psychology. Abstract philosophy often treats group agents as rational constructs that can choose to exceed duty if they will it; Golding shows that the "will" of a group is psychologically precarious and dependent on symbols (the conch) that can be physically destroyed. The story complicates the value of the supererogatory act itself through the ironic arrival of the naval officer. The officer represents the "rescue" the boys strove for—the embodiment of the adult civilized world they tried to mimic supererogatorily. Yet, he is hunting humans in a nuclear war, revealing that the "civilization" the boys tried to uphold is itself engaged in maximal violence. This suggests that the boys' institutional supererogation was perhaps misplaced; they were striving to emulate a world that does not actually practice what it preaches. Pure argument might classify the fire as "good beyond duty," but the narrative forces us to ask whether the end goal of that duty was morally coherent in the first place.

  Finally, the novel highlights the temporal instability of institutional supererogation. In philosophy, an act is often analyzed at a specific moment, but Golding stretches the act over time, showing that supererogation requires endurance. The fire must be kept going *continuously*, not just lit once. The breakdown occurs not because the boys couldn't conceive of the duty, but because the psychological burden of sustaining the institutional identity outweighed the moral reward. Ralph's weeping at the end "for the end of innocence, the darkness of man's heart" is not just grief for Piggy, but grief for the failure of the collective project. It underscores that institutional supererogation may be theoretically possible but practically unsustainable without external enforcement, suggesting that in a state of nature, the "beyond duty" category shrinks until it disappears, leaving only survival and domination.
