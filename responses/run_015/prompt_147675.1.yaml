prompt: |-
  I'm a PhD student in moral philosophy and I'm kinda stuck on a paper about supererogation—specifically whether a group can perform an act that's genuinely beyond duty in a non-distributive way, not just every member chipping in extra. I'm calling this "instutional supererogation" for now, though I'm sure there's literature out there I haven't tracked down yet. I was arguing about it with my friends at a bar last night and we kept coming back to Lord of the Flies, since everyone knows the basic plot: the boys are stranded, they try to maintain the signal fire and the conch for order, Piggy dies, and Ralph gets rescued by the naval officer. I want you to read Golding's novel through this lens of institutional supererogation, treating the boys' collective efforts to maintain rescue and democratic order as a potential group-level supererogatory project. Where does the framing actually work? For example, is keeping the fire going a collective act that exceeds mere survival obligation? Where does it collapse—maybe when Jack's faction splits off and the "group agent" dissolves? I need a reading that takes both the narrative seriously (the death of Piggy, the officer's ironic arrival, the breakdown of the conch) and the philosophical concept seriously, without reducing the book to a simple illustration. Please say what the story adds that pure ethical argument doesn't capture, and point to specific scenes that illuminate the tension. You should act as an expert in both moral philosophy and literary interpretation. Please think step by step, do a little brainstorming first, then lead with your bottom line in the first sentence and follow with your reasoning—no preamble and no restating of the question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** PhD student in moral philosophy.
      *   **Topic:** Supererogation (acts beyond duty), specifically "institutional supererogation" (group-level supererogatory acts, non-distributive).
      *   **Text:** *Lord of the Flies* by William Golding.
      *   **Task:** Read the novel through the lens of institutional supererogation. Evaluate where the framing works (collective acts exceeding survival obligation) and where it collapses (group agent dissolution). Take narrative and philosophy seriously. Identify what the story adds that pure argument doesn't. Point to specific scenes.
      *   **Constraints:** Act as an expert in moral philosophy and literary interpretation. Think step by step (internally). Lead with the bottom line in the first sentence. No preamble. No restating the question.

  2.  **Deconstruct the Philosophical Concept (Institutional Supererogation):**
      *   *Supererogation:* Acts that are good to do but not wrong to omit (beyond the call of duty).
      *   *Group/Institutional Agency:* Can a group be an agent distinct from the sum of its members? (List, Pettit, etc.).
      *   *Institutional Supererogation:* Can a collective entity perform an act that is supererogatory for the group *as a group*, even if individual duties are ambiguous or distributed?
      *   *Challenge:* If survival is the baseline duty, does maintaining civilization count as supererogatory? Or is it obligatory? If the group dissolves, can the act still be attributed to the group?

  3.  **Deconstruct the Literary Text (*Lord of the Flies*):**
      *   *Plot:* Boys stranded, attempt order (conch, fire), descent into savagery (Jack), death (Piggy, Simon), rescue (Ralph).
      *   *Themes:* Civilization vs. Savagery, loss of innocence, inherent evil, group dynamics.
      *   *Key Scenes:* Initial assembly (conch), letting the fire go out (ship passes), splitting of the group (Jack's tribe), killing of Piggy, rescue by Officer.

  4.  **Brainstorming the Intersection:**
      *   *Where it works:* The initial establishment of the conch and the fire. Is maintaining a signal fire merely survival (obligatory) or is it maintaining a link to *civilization* (supererogatory)? If survival is the only strict duty, aiming for rescue via organized signal might be "above and beyond" mere beast-like survival. The collective commitment to the conch as a symbol of democratic process could be seen as a supererogatory institutional project—they *could* just fight for food, but they choose order.
      *   *Where it collapses:* Supererogation requires agency. When Jack splits, the "group agent" fractures. Can a fractured group perform a supererogatory act? The death of Piggy (the voice of reason/institutional memory) marks the death of the institutional agent. The rescue is ironic—the officer represents the adult world, which is itself engaged in a global war (nuclear apocalypse). This undermines the "goodness" of the rescue/civilization.
      *   *What the story adds:* Pure philosophy often assumes rational agents. Golding shows the *psychological cost* and the *fragility* of institutional agency. The "ought" implies "can," but Golding shows that sometimes the group *cannot* sustain the higher duty because the internal psychology collapses. The tragedy isn't just that they failed duty, but that the supererogatory ideal (civilization) was unsustainable against the drive for dominance. The officer's presence highlights the paradox: the "rescuers" are part of a destructive machine, questioning whether the "civilized" act was truly good or just another form of violence.

  5.  **Drafting the Argument (Step-by-Step):**
      *   *Bottom Line:* *Lord of the Flies* ultimately demonstrates the impossibility of sustained institutional supererogation in the absence of enforced external norms, revealing that what appears to be a collective moral excess is actually a fragile provisional duty that collapses when the group agent fragments.
      *   *Point 1: The Fire as Supererogatory vs. Obligatory.* Is rescue a duty? If survival is the duty, the fire is instrumental. But Ralph treats it as a moral imperative linked to civilization. This fits institutional supererogation *if* we view mere survival as the baseline duty.
      *   *Point 2: The Conch as Institutional Constitution.* The conch creates the group agent. Adhering to it is a collective commitment to something beyond immediate gratification.
      *   *Point 3: The Collapse.* When Jack splits, the group agent dissolves. You can't have institutional supererogation without an institution. Piggy's death is the death of the institutional memory.
      *   *Point 4: The Irony of Rescue.* The officer represents the "adult" world. They are at war. This contextualizes the boys' efforts. Was their attempt at order actually supererogatory, or just a microcosm of the same violent hierarchy? This adds nuance pure philosophy misses (the context of the "good").
      *   *Point 5: What Literature Adds.* The emotional weight of failure. The phenomenology of the collapse. Philosophy abstracts; literature particularizes the pain of the failed supererogatory attempt.

  6.  **Refining the Philosophical Nuance:**
      *   Need to be careful with "duty." In a state of nature, is there a duty to rescue? Or just survive? If survival is the only duty, then organizing for rescue is supererogatory. But if they are British schoolboys, socialized duty might make it obligatory. The tension lies there.
      *   "Non-distributive": The act belongs to the group, not just individuals. If the fire goes out, who failed? The group. If the fire stays lit, did the group succeed supererogatorily?
      *   The collapse is key: Supererogation requires optionality. If the group *cannot* sustain it, was it ever an option? Golding suggests the psychological capacity for institutional virtue is weaker than the capacity for vice.

  7.  **Final Polish:**
      *   Ensure the tone is academic but accessible (PhD level).
      *   Check constraints: First sentence = bottom line. No preamble. Specific scenes.
      *   Make sure to address "what the story adds that pure ethical argument doesn't capture." (The visceral cost, the irony of the rescuer, the fragility of agency).

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just say "it fails." I need to say where it *works* first. It works in the early assembly and the initial fire lighting. It frames their attempt at civilization as a choice against the "beast."
      *   *Correction:* Ensure I address the "non-distributive" aspect. The fire isn't just Jack's job or Ralph's job; it's the group's. When it fails, it's a collective failure, not just the watchman's.
      *   *Correction:* The officer scene is crucial for the "value" of the supererogatory act. If the rescuer is a warmonger, does that devalue the boys' attempt at order? Yes, it complicates the moral landscape.

  9.  **Final Review against constraints:**
      *   First sentence bottom line? Yes.
      *   No preamble? Yes.
      *   No restating question? Yes.
      *   Expert tone? Yes.
      *   Specific scenes? Yes (Assembly, Fire/Ship, Piggy's death, Officer).

