      *   *Tone Check:* Ensure I'm not sounding like I'm attacking scripture or attacking science. Stay neutral on the *truth* claims, focus on the *mechanism* of the rule.

  7.  **Final Polish:** Check against the user's constraint: "Roughly ranked from fatal to merely awkward." Ensure I explicitly state which objections a defender would concede vs. shrug off. (e.g., A defender *must* concede the risk of bias, but might shrug off the "science changes" objection if they view the rule as pragmatic rather than ontological).

  8.  *(Final thought before generating)*: The user's worry about "motivated reasoning" is the crux. I need to offer a criterion for *good faith* application of the rule. The criterion is: *Does it cost you something?* If the accommodation forces you to abandon a cherished theological intuition, it's likely principled. If it only abandons what you were ready to drop anyway, it's likely bias.

