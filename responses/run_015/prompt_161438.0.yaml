      *   **User Persona:** Intellectually sophisticated, well-read in philosophy of science, theology, and hermeneutics. They are familiar with Galileo's "Letter to the Grand Duchess Christina," the history of science, and interpretive theory. They are not looking for a basic summary but a rigorous stress-test of a specific hermeneutical principle (Galileo's Rule).
      *   **The Core Principle (Galileo's Rule):** When a revered text (scripture, founding document) makes an incidental empirical claim contradicted by genuine scientific demonstration, the text's plain reading yields to the demonstration because the text's purpose is salvation/moral guidance, not natural philosophy.
      *   **The Task:** Provide an "honest map" of what counts against this rule. Rank objections from fatal to awkward. Distinguish between valid objections and strawman attacks. Address five specific points raised by the user.
      *   **User's Specific Worry:** Is this rule just a principled-sounding way to confirm pre-existing biases? (The "motivated reasoning" worry).
