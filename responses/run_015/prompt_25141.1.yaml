answer: |-
  This is a strategic juncture. The meta-problem is currently the most viable entry point for a philosophy of mind dissertation because it allows you to engage with the "hard problem" without getting bogged down in the metaphysical stalemate of physicalism vs. dualism. However, because the field is young, there is a risk of producing work that is either too empirical (becoming psychology) or too deflationary (becoming trivial).

  Given your constraints (no experiments, 3 years, philosophy background with cog sci literacy), here is my defended ordering of priorities, followed by what to deprioritize and a suggested "wildcard" line of inquiry.

  ### Priority 1: The Cognitive Architecture of Introspective Opacity
  **Focus:** Construct a theoretical model of the specific cognitive mechanisms that generate the *judgment* of non-physicality, without positing non-physical properties.
  **Why it is Upstream:** This is the foundational layer. You cannot determine whether the meta-problem solution dissolves the hard problem (Priority 2) until you have a precise account of *what* is being solved. If the intuition arises from a specific introspective error (e.g., a failure of source monitoring, a specific feature of predictive processing, or a limitation in self-modeling), the philosophical implications depend entirely on the nature of that error. A vague appeal to "cognitive closure" is insufficient; you need a mechanistic hypothesis grounded in existing literature (e.g., Global Workspace Theory, Predictive Processing, or Attention Schema Theory).
  **Tractability:** High. This fits your skill set perfectly. It requires synthesizing existing empirical models into a coherent philosophical argument. You do not need new data; you need to interpret existing data (e.g., change blindness, inattentional blindness, introspective illusion studies) to show how a physical system would inevitably report "I have non-physical qualia."
  **Concrete Three-Year Contribution:** A dissertation chapter that offers a specific "Error Theory of Introspection." For example: *"A Predictive Processing Account of Phenomenal Opacity."* You would argue that the brain's method of modeling internal states necessarily strips away structural information, leading the system to represent its own states as simple, ineffable, and non-physical. This provides the "meta-solution" that the rest of the dissertation evaluates.

  ### Priority 2: The Epistemic Defeasibility of Phenomenal Intuitions
  **Focus:** Analyze whether explaining the *cause* of the intuition undermines the *justification* for the intuition.
  **Why it is Upstream:** This determines the philosophical payoff of your dissertation. If you solve Priority 1 (the mechanism) but fail to address Priority 2, you have written a psychology paper, not a philosophy dissertation. You must argue whether a physicalist explanation of the disposition to judge "there is a hard problem" acts as a defeater for the belief that there is a hard problem. This engages with the literature on debunking arguments, genealogical explanations, and the reliability of introspection.
  **Tractability:** Moderate to High. This is pure philosophy of mind/epistemology. It relies on the model built in Priority 1. If your model in Priority 1 shows the intuition is a byproduct of a heuristic that is reliable for survival but unreliable for metaphysics, you have a strong case for defeasibility.
  **Concrete Three-Year Contribution:** A normative argument establishing the link between the meta-problem and the hard problem. For instance: *"Why the Meta-Problem Undermines the Knowledge Argument."* You would argue that once we accept the cognitive-architectural explanation from Priority 1, the intuitive force of the Zombie Argument or the Knowledge Argument evaporates because their premises rely on introspective judgments that are now shown to be systematically misleading.

  ### Priority 3 (The Differentiator): The Social and Developmental Scaffolding of Phenomenal Concepts
  **Focus:** Investigate how the *concept* of "phenomenal consciousness" is acquired through language and social interaction, rather than solely through private introspection.
  **Why it is Upstream:** Most meta-problem work assumes the intuition arises from an isolated subject inspecting their own mind. However, we learn to talk about "feelings," "qualia," and "what it's like" from others. If the meta-problem is partly a problem of concept acquisition (i.e., we are taught to carve the world in a way that generates the hard problem), this changes the explanatory target. It moves the discussion from individual cognitive architecture to social epistemology and concept possession.
  **Tractability:** Moderate. Requires engaging with developmental psychology and philosophy of language. It is less crowded than the cognitive-architectural approach, offering a higher chance of making a novel contribution.
  **Concrete Three-Year Contribution:** A chapter or paper arguing that the "hard problem intuition" is culturally transmitted. You could argue that the disposition to judge experience as non-physical is not an inevitable bug of human cognition, but a specific feature of how our linguistic community trains us to report internal states. This weakens the claim that the hard problem is a universal, inevitable philosophical puzzle.

  ---

  ### What to Deprioritize (and Why)

  **1. Purely Evolutionary/Teleofunctional Explanations**
  *   **Why Deprioritize:** These are downstream of cognitive architecture. To explain *why* we evolved a certain introspective mechanism, you first need to know *what* that mechanism is (Priority 1). Evolutionary psychology in this domain is prone to "just-so stories" that are difficult to verify philosophically.
  *   **Risk:** You will spend a year speculating on adaptive benefits without securing the mechanistic basis, leaving your dissertation vulnerable to the charge of being untestable speculation.

  **2. The Classic Phenomenal Concept Strategy (PCS)**
  *   **Why Deprioritize:** This field is saturated. While the meta-problem is often seen as a successor to PCS, rehashing Loar, Papineau, or Tye without a significant twist will look like a literature review rather than original research.
  *   **Risk:** Examiners may view this as "old wine in new bottles." If you use PCS, it must be explicitly modified by the cognitive-architectural work in Priority 1 (e.g., "A Predictive Processing update to PCS").

  **3. Radical Illusionism (e.g., Frankish, Dennett)**
  *   **Why Deprioritize:** While Illusionism is a natural ally of the meta-problem, adopting it as a starting premise is risky for a PhD. It is highly controversial and often shuts down conversation with non-illusionists.
  *   **Strategy:** Instead of arguing *for* Illusionism, argue that *solving the meta-problem makes Illusionism the most parsimonious option.* Keep Illusionism as a conclusion, not a premise.

  ---

  ### A Promising "Missing" Line of Work: The Normative Function of the Hard Problem
  There is a gap in the literature regarding *why* the hard problem intuition is so resilient normatively, not just cognitively.
  *   **The Idea:** Investigate the pragmatic or ethical role the concept of "phenomenal consciousness" plays in our lives (e.g., in moral status, legal responsibility, or AI rights).
  *   **The Argument:** Perhaps we are disposed to judge there is a hard problem because *we need there to be one* to ground our moral practices. The meta-problem isn't just a cognitive error; it's a necessary fiction for our social ontology.
  *   **Why Consider It:** This connects the meta-problem to ethics and AI, making your dissertation highly relevant to current debates. It could serve as a fourth chapter or a pivot if the cognitive-architectural route becomes too technical.

  ### Summary of Strategic Advice
  1.  **Year 1:** Focus on **Priority 1**. Read deeply into predictive processing, attention schema theory, and introspective psychology. Build your mechanistic model.
  2.  **Year 2:** Focus on **Priority 2**. Write the epistemological argument linking your model to the dissolution (or deflation) of the hard problem.
  3.  **Year 3:** Integrate **Priority 3** to add novelty. Show how your model accounts for the social/linguistic transmission of these intuitions.

  This trajectory ensures you have a solid empirical foundation (Priority 1), a clear philosophical payoff (Priority 2), and a novel contribution that distinguishes you from other students working on Chalmers' formulation (Priority 3).
