answer: |-
  ### Specification of Desiderata for a Theory of Survival

  To function as a practical guide rather than a mere metaphysical taxonomy, a theory of survival must satisfy the following seven desiderata. They are categorized as **Non-Negotiable** (functional requirements for the theory to do its three jobs) or **Prejudice** (metaphysical intuitions that must be sacrificed if they conflict with the functional requirements).

  #### 1. The Prudential Action-Guidance Constraint (Non-Negotiable)
  *   **The Job:** Tell the agent standing at the scanner whether to step in.
  *   **The Case:** *Standard Teletransporter.* If the theory says "You die," but the successor pays your debts and remembers your vows, the theory fails to track rational self-interest.
  *   **The Verdict:** The theory must align prudential concern (fear/anticipation) with the continuity of psychological capacities (memory, character, intention) rather than brute physical continuity alone.
  *   **Constraint:** Must respect ordinary psychology. If the theory implies I should fear tonight's sleep (a break in consciousness) as I fear death, it is rejected.

  #### 2. The Normative Reciprocity Constraint (Non-Negotiable)
  *   **The Job:** Determine obligations between the pre-scan agent and the post-scan entity.
  *   **The Case:** *Stored Scan, Staggered Instantiation.* A scan is stored for five years. Copy A is instantiated, lives, and dies. Minutes later, Copy B is instantiated from the *same* scan.
  *   **The Verdict:** The theory must explain whether Copy B owes debts incurred by Copy A. If psychological continuity grounds obligation, Copy B is liable. If numerical identity grounds it, Copy B might not be. The theory cannot leave the creditor without a recourse that matches our intuition about promise-keeping.
  *   **Distinction:** Must distinguish *what is owed* (moral) from *who is liable* (metaphysical), allowing them to come apart if necessary to preserve moral coherence.

  #### 3. The Gradient Compatibility Constraint (Non-Negotiable)
  *   **The Job:** Handle cases where continuity is a matter of degree.
  *   **The Case:** *Partial Scan (97%).* 97% of synaptic weights are captured; 3% are confabulated from population averages. The result is recognizably you, but with memory gaps.
  *   **The Verdict:** Survival must admit of degrees. A theory that demands a sharp threshold (e.g., "100% or death") fails neurobiological reality (neuroplasticity, cell replacement). The agent must be able to calculate *how much* to care, not just *whether* to care.
  *   **Constraint:** Must accommodate dense amnesia and dementia. If I survive dementia only if I retain a specific memory, the theory makes survival too fragile.

  #### 4. The Branching Coherence Constraint (Non-Negotiable)
  *   **The Job:** Resolve competition between successors without logical contradiction.
  *   **The Case:** *Stored Scan, Concurrent Instantiation.* Two copies run concurrently for a decade.
  *   **The Verdict:** The theory must specify if prudential concern divides (50% to each?) or remains whole (100% to both?). It cannot say "You are both" if "being" implies exclusivity, nor can it say "You are neither" if psychological continuity is preserved in both.
  *   **Distinction:** Must separate the question of *Who is who?* (Identity) from *What to care about?* (Survival).

  #### 5. The Re-Integration Constraint (Non-Negotiable)
  *   **The Job:** Account for the merger of previously distinct streams.
  *   **The Case:** *Re-fusion.* Two branches (A and B), separated for ten years, have their connectomes averaged into a single recipient (C).
  *   **The Verdict:** The theory must explain C's relationship to A and B. If C remembers both lives, C inherits obligations from both. A theory that insists on One-One identity cannot handle Many-One relations without declaring one parent stream "dead" arbitrarily.
  *   **Constraint:** Must not collapse distinct histories into a single narrative if moral liability depends on specific actions performed by branch A but not branch B.

  #### 6. The Uniqueness (One-One) Constraint (Prejudice)
  *   **The Demand:** Survival must be a unique relation (I can only be one person).
  *   **The Argument for Classification:** Insisting on this as Non-Negotiable forces the theory to declare death in fission cases (Standard Teletransporter breakdown) even when *what matters* (psychological continuity) is preserved doubly. This fails Job 1 (Prudential Guidance): it tells the agent to fear death when they should anticipate two lives.
  *   **Why it is a Prejudice:** It privileges a logical property of identity (transitivity/uniqueness) over the phenomenological and normative reality of survival. To satisfy the three jobs, we must allow that *survival* (what matters) can be one-many, even if *identity* (who is who) cannot. Treating this as Non-Negotiable excludes the Psychological-Continuity view in fission cases, rendering it useless for the teletransporter.

  #### 7. The Determinacy Constraint (Prejudice)
  *   **The Demand:** The question "Will it be me?" must have a Yes/No answer.
  *   **The Argument for Classification:** In the *Partial Scan (97%)* case, there is no fact of the matter where "you" end and "someone else" begins. Insisting on a determinate answer forces an arbitrary cutoff (e.g., 98% = life, 97% = death). This fails Job 3 (Metaphysical Status) by manufacturing precision where none exists.
  *   **Why it is a Prejudice:** It assumes vagueness is a defect of the theory rather than a feature of the world. A functional theory should tell the agent: "It is indeterminate, and you ought not to worry, because your prudential concerns are satisfied to degree 0.97." Treating this as Non-Negotiable excludes the No-Further-Fact view and forces Animalism into implausible biological cutoffs.

  ---

  ### Incompatibilities and Exclusion

  **The Incompatible Pair:**
  **The Uniqueness Constraint (6)** and **The Prudential Action-Guidance Constraint (1)** cannot be jointly satisfied in fission cases.
  *   *Reasoning:* If survival must be unique (One-One), then in a fission case (two successors), neither successor can be *identical* to the original (since identity is transitive and one-to-one). If neither is identical, standard logic suggests the original dies. However, Prudential Guidance dictates that the original should not fear death, as their psychology continues in both. To save Prudential Guidance, we must abandon Uniqueness as a requirement for *what matters*, acknowledging that survival is not identity.

  **The Most Exclusionary Requirement:**
  **The Determinacy Constraint (7).**
  *   *Reasoning:* This requirement excludes the most robust solutions to the teletransporter problem. The *No-Further-Fact* view (Parfit) explicitly denies that there is a deep fact about "me" beyond physical and psychological continuity. By demanding a Yes/No answer to "Will it be me?", you automatically disqualify any view that treats identity as vague or conventional. It forces theories to posit "Further Facts" (Cartesian Egos) or rigid biological boundaries (Animalism) that contradict the *Gradient Compatibility Constraint (3)*. It is the primary driver of metaphysical excess in this debate.

  ---

  ### Compressed Scorecard

  | View | Prudential Guidance | Normative Reciprocity | Gradient/Branching | Uniqueness (One-One) | Determinacy | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Animalism** | **Fail.** (Scanner = Death) | **Fail.** (Successor owes nothing) | **Pass.** (Biological thresholds) | **Pass.** | **Pass.** | Too conservative. Fails the Teletransporter intuition test. |
  | **Psychological-Continuity** | **Pass.** (Tracks what matters) | **Pass.** (Tracks responsibility) | **Pass.** (Handles degrees) | **Fail.** (Breaks in fission) | **Fail.** (Vague thresholds) | Best fit for jobs, requires dropping Uniqueness/Determinacy. |
  | **Further-Fact (Ego)** | **Fail.** (Unknown destination) | **Fail.** (Ego's path unknowable) | **Fail.** (Binary nature) | **Pass.** | **Pass.** | Metaphysically robust, practically useless. |
  | **No-Further-Fact** | **Pass.** (Redefines survival) | **Pass.** (Relations matter) | **Pass.** (Embraces vagueness) | **Rejects.** (Question empty) | **Rejects.** (Indeterminacy OK) | Best fit, but requires accepting "Prejudice" classification. |

  **Conclusion:** To deliver on the three jobs (Prudential, Moral, Metaphysical), a theory must classify **Uniqueness** and **Determinacy** as prejudices. Insisting on them preserves logical tidiness at the cost of practical guidance. The *Psychological-Continuity* and *No-Further-Fact* views succeed only by accepting that "Will it be me?" is sometimes the wrong question to ask.
