      *   *Key Arguments:*
          1.  Philosophy of Measurement: CNLI isn't neutral; it embeds values.
          2.  Nociception vs. Consciousness: Crustacean acute scores might not equal suffering.
          3.  Interspecies Comparison: Cannot simply sum scores without weighing moral status/capacity.
          4.  Is-Ought Gap: High score doesn't automatically mean moral priority.
      *   *Word Count Check:* ~800 words.

  5.  **Drafting the Marking Scheme (iii):**
      *   *Total:* 25 marks.
      *   *Differentiation:* A vs. B.
      *   *Specific Moves:* Normative choices in metrics, nociception vs. experience, control principle, is-ought gap.
      *   *Mistakes:* Treating welfare as purely subjective, ignoring calibration, assuming scores justify practice, no committed position.

  6.  **Review and Refine:**
      *   *Check Constraints:* No citations? Yes. No quotes? Yes. All info in text? Yes.
      *   *Check Tone:* Expert philosopher, advanced undergraduate level.
      *   *Check Word Counts:*
          *   Question: Aim for ~500.
          *   Answer: Aim for ~800.
      *   *Check Content:* Does it address the "deepest tension" identified in the brainstorming? Yes (metric commensurability vs. phenomenal heterogeneity).

  7.  **Final Polish:**
