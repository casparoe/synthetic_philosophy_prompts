      *   **Pre-computation:** Brainstorm the deepest philosophical tension and why students miss it.

  2.  **Brainstorming the Philosophical Tension:**
      *   *Tension:* The tension lies between *metric commensurability* and *phenomenal heterogeneity*. We are trying to compare "apples and oranges" (fish stress vs. crustacean nociception) using a single number (CNLI). The deepest tension is that quantifying welfare implicitly assumes a common currency of suffering (utilitarian calculus), but the *nature* of that suffering (chronic anxiety/frustration vs. acute pain) might be ontologically different across taxa with different nervous systems.
      *   *Why students miss it:* Students often treat welfare metrics as objective discoveries rather than normative constructions. They assume that if the math says X > Y, then X is morally worse. They miss that the *weighting* in the CNLI (chronic vs. acute) is itself a moral choice, not a scientific fact. They also conflate nociception (neural detection) with suffering (phenomenal experience), especially in invertebrates.

  3.  **Drafting the Exam Question (i):**
      *   *Context:* IMTA systems (fish + crustaceans).
      *   *Tool:* CNLI (defined in prompt).
      *   *Scenario:* Management trade-off. Reducing acute handling for crustaceans increases chronic stress for fish (e.g., water quality issues due to waste accumulation if cleaning is reduced to avoid disturbing crustaceans).
