      *   **Core Tension:** Does minimizing acute nociception for crustaceans license practices that elevate chronic stress for fish? (Counter-intuitive welfare hierarchy).
      *   **Deliverables:**
          1.  Exam Question (450-600 words).
          2.  Model Answer (~800 words, committed position, not balanced).
          3.  Marking Scheme (out of 25 marks, distinguishing A vs. B).
