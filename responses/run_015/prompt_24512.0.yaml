          *   *Problem:* Safety isn't a single proposition $P$. It's usually a universal claim (e.g., "For all time steps $t$, action $a_t$ is safe").
          *   *Löbian Bite:* To prove $\forall t, Safe(a_t)$, the agent needs to reason about its own proof system's reliability generally. If it tries to prove "My proof system is sound," it hits Gödel II. If it tries to prove "If I prove $Safe(a)$, then $Safe(a)$" as a general rule to apply to future actions, it hits Löb's Theorem (specifically, the inability to internalize the reflection principle uniformly).
