prompt: |-
  You are an expert in formal epistemology and philosophy of probability. Before giving your analysis, take a few moments to brainstorm the distinct interpretations of the slogan below, and be explicit about where your mapping is forced by the wording versus where you are constructing a charitable reading.

  In a seminar on rational belief and physical theory, a participant kept shutting down objections with the line: "Rational credences ought to match the objective chances." They deployed it specifically to argue that any agent—human or artificial—who knows the standard quantum-mechanical probabilities for an event must assign exactly those probabilities in its belief state, no matter what other theoretical representations or internal models it also holds. I am sure this sentence is smuggling in several different commitments, but I cannot separate them.

  Can you lay out, as an explicit menu, the precise theses that slogan could be expressing? For each reading, specify: (1) the kind of "ought" in play (normative, rational, pragmatic, or institutional); (2) what counts as a "credence" (a subjective degree of belief, a calibrated predictive distribution, or an action-guiding weight); (3) what "objective chance" denotes (a physical propensity, a long-run frequency, a rational prior over worlds, or a feature of a particular theoretical model); and (4) the scope—does it apply to all propositions, only to those with well-defined physical chances, or only after conditioning on admissible evidence?

  In addition, distinguish synchronous deference (the current belief-state should mirror the chances now) from diachronic calibration (the updating procedure should converge to the chances over time). Then apply your menu to the following tension, which I want injected into the analysis: suppose an agent knows both standard quantum mechanics (assigning chance 0.5 to spin-up) and also a deterministic hidden-variable account that, for this specific prepared particle, fixes the outcome with certainty. Does the slogan require the agent to hold credence 0.5 anyway? Say which readings yield that result, which do not, and whether those results are plausible or incoherent.

  Finally, tell me which of these readings actually supports the seminar argument—that internal theoretical commitments must be overridden by physical probabilities—and which render the slogan either trivial or false. If my framing rests on a confusion—for instance, if there is no unitary "Principal Principle" to disambiguate, or if the hidden-variable injection is incoherent within the relevant framework—say so plainly rather than forcing an answer. I want a critical, self-aware response that invites pushback, not polite compliance.
