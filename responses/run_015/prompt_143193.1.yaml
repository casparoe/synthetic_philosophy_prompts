answer: |-
  # Prep Sheet: Moderate Realism & The Transport Test

  **Context:** Joint Philosophy/CS Interpretability Session
  **Goal:** Survive the Q&A without conceding the core thesis, while acknowledging methodological fragility.
  **Strategy:** Buy goodwill early on methodological limits; defend the *ontological status* of transportable directions vigorously.

  ### Part 1: Concessions to Make in the First 5 Minutes
  *Do not wait for these to be raised. Pre-empt them during your setup to disarm the methodological critics.*

  1.  **Concede Underdetermination:** Explicitly state that SAE feature sets are not unique. Different dictionary sizes yield different granularities (the "splitting" problem). Acknowledge that a single run on a single model is *not* evidence of realism.
  2.  **Concede Linearity Limits:** Admit that the affine map assumption in your Transport Test is a strong simplification. Neural manifolds are likely curved; you are testing for local linear approximability, not global isomorphism.
  3.  **Concede "Representation" is Graded:** Do not claim a direction is either "real" or "fake." Claim that transportability increases the *degree* of reality. This lowers the bar for the Instrumentalists (who hate binaries) and helps the Philosopher (who likes continua).

  ---

  ### Part 2: The Eight Objections
  *Ordered by likelihood and potential damage. Replies are scripted for ~2 minutes spoken.*

  #### 1. The Instrumentalist Challenge (High Likelihood / High Damage)
  **Who:** One of the two outspoken instrumentalists.
  **The Question:** "You've shown that if you push this vector, the model talks about the bridge. You've shown you can find a similar vector in a sibling model. So what? You've demonstrated a *steering capability* that generalizes across seeds. Why do you need the ontological baggage of 'representation'? Isn't 'robust control vector' a sufficient description without invoking ghostly internal content?"
  **The Reply:** "Control is necessary but not sufficient. A lever on the outside of a car controls the speed, but it isn't the speedometer. My claim is that the *structure* of the model's internal space constrains what controls are possible. If the direction were merely an artifact of my interpretive frame, the affine map to the sibling model wouldn't preserve the *causal role* without retraining the probe. The Transport Test shows the constraint is in the *model*, not the *observer*. 'Robust control vector' describes what I can do; 'representation' describes why the model lets me do it."
  **The Soft Spot:** You are still relying on a human to verify the "causal role" looks the same. If the instrumentalist presses on "who verifies the behavior," you risk circularity.

  #### 2. The Methodological Robustness Challenge (High Likelihood / High Damage)
  **Who:** The Interpretability Lab Leader.
  **The Question:** "We see SAE features drift wildly between runs even on the same data. Your Transport Test relies on finding an affine map between sibling models. If the features are as unstable as our recent internal benchmarks suggest, isn't your 'transportable direction' just a cherry-picked example where the alignment happened to work? How do you know you aren't just reporting the success case?"
  **The Reply:** "That is precisely why the Transport Test is the *criterion* for realism, not a post-hoc observation. I am not claiming all SAE features are real. I am claiming that the subset which survives affine transport across independent training runs constitutes the 'real' subset. If the alignment fails, I concede that direction was likely noise or a training artifact. This turns your instability concern into a filter: instability disqualifies candidates, but stability across seeds warrants realist commitment."
  **The Soft Spot:** You need to show the failure rate. If 95% of features fail transport, the realist position becomes a niche claim about rare "platonic" directions.

  #### 3. The Measurement Theory Challenge (Medium Likelihood / High Conceptual Damage)
  **Who:** The Philosopher of Science (Measurement/Modelling).
  **The Question:** "You're trying to position these features as akin to temperature—real, multiply realized, but measurable. But temperature has a thermodynamic definition independent of the thermometer. Your features are defined *by* the dictionary learning procedure. Are these features more like temperature, or are they like choosing a coordinate system in General Relativity? Convenient, but ultimately arbitrary?"
  **The Reply:** "They are closer to temperature than coordinates. A coordinate system is purely conventional; you can choose any basis. But you cannot choose *any* direction and expect it to transport causally to a sibling model. The 'thermodynamics' here is the gradient descent pressure itself. The SAE is the thermometer—it has its own noise and calibration issues—but the underlying causal pressure (the feature) exists independently of the specific dictionary learning run, evidenced by the transport."
  **The Soft Spot:** We lack the "thermodynamic definition." You don't have a theory of *why* gradient descent creates these features yet, only that it does.

  #### 4. The Decoding/Alignment Challenge (Medium Likelihood / Medium Damage)
  **Who:** The Visiting Systems Neuroscientist.
  **The Question:** "This sounds like Representational Similarity Analysis (RSA) or cross-animal decoding, just with an affine map instead of CCA. We've been doing this for decades. Also, by focusing on single directions that survive transport, aren't you walking back into the 'grandmother cell' fallacy? Cognition is distributed. Why privilege the unit that looks localist?"
  **The Reply:** "Two differences. First, RSA compares similarity structures; my Transport Test compares *interventional profiles*. It's not 'do these patterns look alike?' but 'does pushing this pattern do the same thing?' Second, I'm not claiming grandmother cells. The feature is a direction in a high-dimensional space; it's inherently distributed. The 'unit' is the axis of variation, not a single neuron. The transport test identifies *axes of variation* that are functionally conserved, which is exactly what cross-animal alignment seeks but rarely achieves causally."
  **The Soft Spot:** The affine map assumption is stricter than the warping allowed in modern neural alignment. If the brain warps non-linearly, your linear test might miss real features.

  #### 5. The Content Skepticism Challenge (Medium Likelihood / Deep Philosophical Damage)
  **Who:** The Dennett-Style Skeptic.
  **The Question:** "Let's say the direction transports. Let's say the intervention works. You still haven't explained *content*. Gradient descent minimizes loss, it doesn't track truth. Why is this direction *about* the bridge, rather than just being a state that causes bridge-talk? You're smuggling in intentionality where there's only causal correlation."
  **The Reply:** "I am not committing to a strong theory of intentionality here, only to structural realism. I claim the direction plays a specific functional role in the system's economy. Whether that counts as 'aboutness' in the human sense is a further question. But if a direction is consistently recruited to handle bridge-related information across contexts and models, it has a functional identity. That functional identity is enough for a 'moderate' realism, even if we bracket the hard problem of content."
  **The Soft Spot:** This dodges the hard question. If you can't distinguish "representing a bridge" from "causing bridge talk," the Instrumentalist wins.

  #### 6. The Dynamical Systems Challenge (Low Likelihood / Medium Damage)
  **Who:** The Embodied/Dynamical Cognition Philosopher.
  **The Question:** "You're treating the residual stream as a storage buffer for symbols. But the model is a dynamical system evolving over time. A 'direction' is just a snapshot of a trajectory. By reifying these directions, aren't you inheriting the computationalist picture that my work argues is dead? The representation isn't in the vector; it's in the flow."
  **The Reply:** "I agree the flow is primary. But dynamical systems have attractors and invariant manifolds. My 'directions' are hypotheses about the structure of those manifolds. If a direction transports, it suggests the manifold has a stable geometry across training runs. I'm not claiming the vector is a static symbol; I'm claiming the *geometry of the flow* has stable features that we can isolate. The vector is a probe for the manifold's shape."
  **The Soft Spot:** If the dynamics are highly sensitive to initial conditions (chaotic), the affine map assumption breaks down quickly.

  #### 7. The "Imposition" Challenge (Medium Likelihood / High Damage)
  **Who:** The Lab Leader or Instrumentalist (Follow-up).
  **The Question:** "You say you identify the direction *before* matching it to a description. But you trained the SAE on human-readable text. The bias is in the data, not the discovery. Isn't the 'bridge' feature just a reflection of the token co-occurrence in your training set, rather than a model-internal structure?"
  **The Reply:** "The data bias is real, but the *implementation* is not. The training set contains the concept, but the model is not forced to encode it as a linear direction in the residual stream. It could encode it non-linearly, or distributedly in a way no SAE could find. The fact that a *linear* direction exists, and exists *in the same orientation* relative to other features in a sibling model, suggests the model's optimization landscape funnels it into this specific geometric solution, not just the data statistics."
  **The Soft Spot:** Hard to prove the optimization landscape forces linearity rather than the SAE forcing linearity on a non-linear reality.

  #### 8. The Misrepresentation Challenge (Low Likelihood / Catastrophic Damage)
  **Who:** Anyone who read your draft closely.
  **The Question:** "If this direction is a representation of the bridge, can it misrepresent? If the direction fires when no bridge is mentioned, is that an error or just noise? Without a story about teleology or selection history, how do you distinguish a broken representation from a feature that just means 'activate bridge tokens'?"
  **The Reply:** (See "The Question I Hope Nobody Asks" below).
  **The Soft Spot:** This is your acknowledged weakness.

  ---

  ### Part 3: The Single Reply That Must Land
  **Target:** Objection #2 (Methodological Robustness / Lab Leader).
  **Why:** If the Lab Leader convinces the room that your Transport Test is just cherry-picking stable noise, the Instrumentalists will dismiss the ontology, and the Philosopher will dismiss the measurement.
  **The Core Argument:** "Instability is the null hypothesis. Transport is the rejection of the null."
  **Execution:** You must emphasize that you are not claiming *all* features are real. You are proposing a **filter**. If the Leader argues features are unstable, agree, and say "Then they fail the test." If you defend the stability of *all* features, you will lose. If you defend the *test* as a sieve for reality, you survive.

  ---

  ### Part 4: The Question You're Hoping Nobody Asks
  **The Question:** "You claim these directions are representational. But representations can be false. If I intervene on your 'Brooklyn Bridge' direction when the prompt is about the Golden Gate Bridge, and the model says 'Brooklyn Bridge,' that's a hallucination. But if I intervene on a 'add 1 to the number' direction and the math is wrong, that's a computation error. What is the **normative standard** by which your feature is *correct* or *incorrect*? Gradient descent has no truth condition, only loss. If you can't define misrepresentation, you don't have representation; you just have disposition."

  **Why this hurts:** It targets your stated weakness. You admit you lack an account of misrepresentation.
  **Prepared Stumble:** Do not try to bluff a teleosemantic account.
  **Defensive Maneuver:** "That is the hard problem of content, and I am not solving it today. I am solving the *individuation* problem. Before we can ask if the feature is *true*, we have to agree on what the feature *is*. My Transport Test individuates the vehicle. Whether that vehicle carries truth conditions is a second-order question. I am claiming realism about the *vehicle*, not necessarily the *content*."
  *(Note: This concedes the high ground on content to save the ground on structure.)*
