prompt: |-
  I am a formal verification engineer fluent in type systems, invariants, soundness and completeness proofs, model checking, consistency arguments, and termination analysis, but I have almost no background in philosophy or theology. Restate Gödel's rationalist-theistic position on the afterlife—rooted in his mathematical Platonism and in his reported conviction that a rationally ordered universe would not permanently extinguish the human capacity for abstract reason through bodily death—using only the vocabulary and conceptual machinery of formal verification: axioms, models, consistency, soundness, completeness, invariants, type preservation, non-termination, and physical instantiation layers. Translate both the claim that the soul persists independently of physical substrate and the inference that rational cosmic order implies personal survival, as precisely as you can. Then provide the residue report: which parts map cleanly onto verification concepts, which survive only through distortion (for example, treating the soul as an invariant that outlives its hardware or as a non-terminating computation whose state is preserved across model updates), and which parts have no counterpart in your vocabulary at all—especially any theological or normative premises that motivate the move from logical order to individual survival. Finally, assess whether the untranslatable residue reveals a genuine limitation in formal-verification language or instead indicates that Gödel's reasoning relies on premises that are not as rigorously structured as they appear.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Target Audience:** A formal verification engineer (fluent in type systems, invariants, soundness, completeness, model checking, etc., but not philosophy/theology).
      *   **Task:** Restate Gödel's rationalist-theistic position on the afterlife using *only* formal verification vocabulary.
      *   **Specific Concepts to Cover:** Soul persistence (independent of substrate), rational cosmic order implying personal survival.
      *   **Required Output:**
          1.  Restatement using FV (Formal Verification) terminology.
          2.  Residue Report (what maps cleanly, what distorts, what has no counterpart).
          3.  Assessment (limitation of FV language vs. lack of rigor in Gödel's reasoning).
      *   **Constraints:** Use specific terms (axioms, models, consistency, soundness, completeness, invariants, type preservation, non-termination, physical instantiation layers). Avoid philosophical jargon where possible.

  2.  **Deconstruct Gödel's Position (Internal Knowledge Retrieval):**
      *   *Platonism:* Mathematical objects exist independently of human thought. There is an objective reality of concepts.
      *   *Rationalism:* The world is rationally constructed. It makes sense.
      *   *The Afterlife:* If the world is rational, it wouldn't waste the human capacity for reason (which touches the infinite/Platonic) by tying it strictly to a decaying biological machine. Death shouldn't be the end of the "reasoning process."
      *   *The Soul:* The seat of this reasoning capacity. It must be distinct from the body.
      *   *Logic:* Gödel actually formulated an Ontological Proof (modal logic S5), but the prompt asks about his *rationale* for the afterlife specifically, rooted in Platonism and rational order, not just the ontological proof itself.

  3.  **Drafting the Restatement (Translation to FV Vocabulary):**
      *   *Universe:* A system model $M$.
      *   *Physical Body:* A specific hardware instantiation or runtime environment $H_{bio}$.
      *   *Mind/Reason:* A computational process or abstract state machine $P_{reason}$.
      *   *Platonic Realm:* The space of all valid types/specifications $S_{abstract}$.
      *   *Death:* Termination of the hardware $H_{bio}$.
      *   *Soul:* The state or continuation of $P_{reason}$.
      *   *Rational Order:* Consistency and Soundness of the global system $M$.
      *   *Argument:*
          1.  $P_{reason}$ accesses $S_{abstract}$ (Platonic types).
          2.  $S_{abstract}$ is timeless/independent of $H_{bio}$ (Type Preservation across hardware).
          3.  If $M$ is Sound/Consistent (Rational), it does not allow a resource leak or undefined behavior where a process accessing $S_{abstract}$ is forcibly halted by $H_{bio}$ failure without state migration.
          4.  Therefore, $P_{reason}$ must be Non-terminating or Migratable to a new layer $H_{next}$.
          5.  Invariant: The capacity for abstract reasoning is preserved.

      *   *Refining the Terminology:*
          *   "Soul" $\rightarrow$ "Abstract State Invariant."
          *   "Body" $\rightarrow$ "Physical Instantiation Layer."
          *   "Afterlife" $\rightarrow$ "State Continuity post-Hardware Failure."
          *   "Rational Universe" $\rightarrow$ "System Consistency and Completeness."

  4.  **Developing the Residue Report:**
      *   *Clean Maps:* Substrate independence (hardware abstraction), Invariants (properties holding across state transitions), Non-termination (liveness properties).
      *   *Distortions:* "Value" or "Waste" (Teleology). FV doesn't care if a process *should* continue, only if it *does*. The idea that the universe "would not" extinguish reason implies a normative constraint on the system design, not a logical one.
      *   *No Counterpart:* Qualia, personal identity (is the migrated process the *same* ID?), Normativity (why *ought* the system be consistent in this specific way?).

  5.  **Assessing the Limitation vs. Rigor:**
      *   Does FV fail to capture it? Or is Gödel making a category error?
      *   Gödel moves from "The world is rational" (Consistency) to "The world is benevolent/purposeful" (Normative Teleology).
      *   FV can check consistency, but it cannot derive *purpose* from *syntax*.
      *   Conclusion: The gap isn't in FV's expressiveness regarding logic, but in Gödel's leap from descriptive logic to normative metaphysics. He treats a value judgment (reason *should* persist) as a logical necessity.

  6.  **Review and Refine (Self-Correction against Constraints):**
      *   *Check:* Did I use "axioms," "models," "consistency," "soundness," "completeness," "invariants," "type preservation," "non-termination," "physical instantiation layers"?
      *   *Check:* Is the tone appropriate for an FV engineer? (Yes, technical, precise).
