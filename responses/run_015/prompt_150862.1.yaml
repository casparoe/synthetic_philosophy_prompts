      *   *Correction:* Ensure I don't accidentally validate the argument as sound in FV terms. Keep it as a translation of *his* claim, not a proof of the claim.
      *   *Nuance:* Gödel's Ontological Proof is modal logic. The prompt asks about his *rationale* for the afterlife (Platonism + Rational Order). I need to focus on the "waste of potential" argument translated to "resource management/liveness."

  7.  **Final Polish:** Structure the response clearly into the three requested sections. Ensure the "Residue Report" is critical and analytical.

      *(Self-Correction during drafting)*: Be careful with "Completeness." Gödel's Incompleteness Theorems show formal systems *aren't* complete. But his *philosophical* view was that the universe is rationally comprehensible. I should frame "Completeness" carefully—perhaps as "Semantic Completeness" of the cosmic model relative to human reason, or avoid leaning too hard on the technical definition of completeness to avoid confusion with his theorems. Let's stick to "Consistency" and "Soundness" as the primary markers of "Rational Order." Actually, better to frame it as: The system semantics are rich enough to support the types the process accesses.

