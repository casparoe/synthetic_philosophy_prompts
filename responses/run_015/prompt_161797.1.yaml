prompt: |-
  I have recently been made the clinical member of the committee that decides which decision-support tools our hospital may deploy, and under what conditions of checking their output may be acted on. Every meeting turns out to turn on the same old epistemological question: which sources of knowledge are basic, how many kinds there are, and what must be true of a source before acting on what it tells you is permissible. I have been reading work on the pramāṇas in the Nyāya tradition and its interlocutors, and I have concluded that what I actually need is not another enumeration of knowledge-sources but a specification: what any such enumeration would have to be able to do before it could underwrite a real protocol.

  So please write me the desiderata. The purpose I am fixing: a theory of the knowledge-sources adequate for underwriting an institutional protocol in a high-stakes domain, where acting on an output that does not warrant action harms someone, and where the person acting often cannot audit the source herself. Adequacy is relative to that purpose, so say which requirements follow from it and which would only be requirements for a theory meant for something else. For each desideratum give the case or consideration behind it, mark it non-negotiable, negotiable, or a factional preference, and note what it rules out.

  The cases I need handled, roughly in the order they arose for me:

  A risk score for sepsis produced by a model trained on last year's admissions at a different hospital. It is not a speaker; it has no awareness of this patient; it offers no reason; its only warrant is a statistical relation that holds for a population and may not hold here.
  A waveform on a continuous monitor, and the same number read off a different device I do not understand.
  A counterfactual output: the patient would have arrested without the bolus. Nobody observed anything of the kind.
  A colleague's note in the chart, and a guideline issued by a committee I cannot interview.
  My recollection of the morning vital signs, contrasted with re-reading the chart and learning the same thing again.
  Looking at the medication list and seeing that no anticoagulant is on it: I come to know an absence.
  A potassium level that is normal on a regimen that should not permit it, from which I conclude something unobserved.
  An alarm I was told sounds like the old one, which I then hear and recognize for the first time.
  A source whose reliability is now known to have drifted downward since it was last certified, and a source I have no way of checking at all.

  Alongside these, the distinctions I do not want collapsed: being a source of knowledge versus being a merely reliable indicator; a source being reliable versus my having warrant for taking it to be reliable; first acquisition of something versus confirmation or re-identification of what one already knows; the failure of a source versus the mere absence of knowledge; and the claim that there are n basic sources versus the claim that the others reduce to those n. I am also unsure how to treat the demand that a pramāṇa be an instrument that brings about a veridical cognition rather than simply a reliable process that happens to issue in one: is that a genuine requirement or a commitment of one school? Tell me, too, which of the things people demand of such a theory are real requirements and which are inherited prejudices: that the list be short, that perception be non-conceptual, that no source certify itself, that the list be closed under some fixed number.

  The part I most want is the tension structure. I suspect at least two subsets cannot be jointly satisfied, and I want them stated as claims about the list itself: that no source may certify its own reliability, together with the demand that every certification proceed by some knowledge-source, together with the rejection of circularity and regress; and the treatment of a pramāṇa as an infallible instrument, together with the requirement that the theory explain systematic error and the cases in which a source looks exactly like a working one and is not. Add any further pair you think is jointly unsatisfiable, including pairs involving a desideratum that a source's reliability hold for this case and not merely on average, or that a theory say what happens when a source degrades. Then tell me which single desideratum does the most exclusionary work, in the sense of knocking out the largest share of otherwise attractive theories.

  Only after that, and briefly: how the familiar options fare against the list. Perception alone; perception and inference alone; the Nyāya set of four; the larger set of six that adds postulation and non-cognition; reductionist treatments of testimony and analogy; and a broadly reliabilist or probabilistic treatment on which warrant is a matter of calibrated process rather than of source-type. Two or three lines each is plenty; I will do my own scoring in committee.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Clinical member of a hospital committee deciding on decision-support tool deployment and usage protocols.
      *   **Problem:** Meetings stall on epistemological questions about knowledge sources (*pramāṇas*). The user wants to move beyond enumeration to *specification*: what must a theory of knowledge sources *do* to underwrite a high-stakes institutional protocol?
      *   **Context:** High-stakes domain (medicine), acting on unwarranted output causes harm, actor often cannot audit the source personally.
      *   **Task:** Write a set of *desiderata* for such a theory.
      *   **Requirements for Desiderata:**
          *   State the case/consideration behind it.
          *   Mark status (Non-negotiable, Negotiable, Factional Preference).
          *   Note what it rules out.
          *   Address specific cases provided (sepsis score, waveform, counterfactual, colleague's note, memory, absence, anomaly, alarm recognition, degraded source).
          *   Maintain specific distinctions (source vs. indicator, reliability vs. warrant for reliability, acquisition vs. confirmation, failure vs. absence, basic vs. reduced).
          *   Address the "instrument vs. reliable process" debate.
          *   Distinguish real requirements from inherited prejudices (short list, non-conceptual perception, etc.).
          *   **Crucial:** Identify the *tension structure* (jointly unsatisfiable sets of claims).
          *   **Crucial:** Identify the single most exclusionary desideratum.
          *   **Briefly:** Score familiar options (Perception only, P+I, Nyāya 4, 6, Reductionist, Reliabilist).

  2.  **Deconstruct the Clinical/Epistemic Context:**
      *   *High Stakes:* Error = Harm. Truth is not just academic; it's safety-critical.
      *   *Opacity:* Clinicians can't check the ML code or the lab mass spec every time. They must trust the *institutional validation* of the source.
      *   *Action-Guiding:* The theory isn't just for knowing; it's for *acting*. This shifts the focus from "What is truth?" to "When is it permissible to act?"
      *   *The "Drift" Problem:* Sources degrade (model drift, calibration drift). A static theory of *pramāṇa* fails here.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Actionability/Warrant.* The theory must distinguish between "true belief" and "warranted action."
          *   *Case:* Sepsis score. It might be right, but can I act on it?
          *   *Status:* Non-negotiable.
          *   *Rules out:* Purely externalist reliabilism without access to reliability.

      *   *Desideratum 2: Source Individuation.* Must distinguish the *type* of source to apply the right check.
          *   *Case:* Waveform (perception) vs. Lab value (testimony/instrument).
          *   *Status:* Non-negotiable.
          *   *Rules out:* Monism (Perception only).

      *   *Desideratum 3: Negative Knowledge.* Must account for knowing absences.
          *   *Case:* No anticoagulant on list. *Anupalabdhi* (non-cognition).
          *   *Status:* Negotiable (can be reduced to inference, but costly).
          *   *Rules out:* Theories that only affirm existence.

      *   *Desideratum 4: Defeasibility/Drift.* Must handle degradation of reliability over time.
          *   *Case:* Drifted source.
          *   *Status:* Non-negotiable.
          *   *Rules out:* Infallibilist *pramāṇa* theories that assume once a source, always a source.

      *   *Desideratum 5: Second-Order Warrant.* Must explain how we know the source is reliable without infinite regress.
          *   *Case:* Committee guideline I can't interview.
          *   *Status:* Non-negotiable.
          *   *Rules out:* Strict internalism requiring personal audit.

      *   *Desideratum 6: Counterfactuals/Postulation.* Must handle unobserved causal claims.
          *   *Case:* "Would have arrested." *Arthāpatti*.
          *   *Status:* Factional Preference (can be Inference, but distinct is better).
          *   *Rules out:* Strict Empiricism.

  4.  **Addressing the "Inherited Prejudices" vs. "Real Requirements":**
      *   *Short List:* Prejudice. Complexity is needed for safety.
      *   *Non-conceptual Perception:* Prejudice. Clinical perception is theory-laden (recognizing the alarm).
      *   *Self-Certification:* Real problem (Münchhausen trilemma).
      *   *Infallibility:* Prejudice. In medicine, nothing is infallible.

  5.  **Developing the Tension Structure (The "Aporia"):**
      *   *Tension 1: The Regress vs. Action.* We need warrant for reliability (D5), but no source can certify itself (No Circularly), and we can't check everything (No Regress). *Resolution:* Institutional trust replaces individual epistemic warrant.
      *   *Tension 2: Infallibility vs. Error.* If a *pramāṇa* is defined as producing *only* true cognition (Nyāya), how do we classify a broken monitor that looks working? *Resolution:* Shift from "Truth-Guarantor" to "Risk-Managed Process."
      *   *Tension 3: Specificity vs. Generality.* We need reliability *here* (this patient), but sources are validated *generally* (population).
      *   *Most Exclusionary Desideratum:* The requirement for *Second-Order Warrant without Regress* in a high-stakes environment. It kills naive reliabilism and strict internalism alike.

  6.  **Scoring the Familiar Options:**
      *   *Perception Only:* Fails on ML scores, guidelines, absences.
      *   *P + I:* Struggles with testimony (guidelines) and absence.
      *   *Nyāya 4:* Good on testimony, struggles with drift/probability.
      *   *6 ( + Anumāna/Anupalabdhi):* Better on absence/postulation, still static.
      *   *Reductionist:* Fails on the distinct normative force of testimony/guidelines.
      *   *Reliabilist/Probabilistic:* Best for ML/Drift, fails on the "warrant for action" without access.

  7.  **Refining the Tone:**
      *   The user is sophisticated (knows Nyāya, epistemology, clinical context).
      *   Tone should be precise, philosophical but grounded in the clinical reality.
      *   Avoid fluff. Stick to the structure requested.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "instrument vs. reliable process" question? *Yes, in the Tension Structure.*
      *   *Check:* Did I mark Non-negotiable/Negotiable? *Yes.*
      *   *Check:* Did I identify the single most exclusionary desideratum? *Yes.*
      *   *Check:* Is the distinction between "source of knowledge" and "reliable indicator" maintained? *Yes, in Desideratum 1.*
      *   *Check:* Did I handle the specific cases? *Integrated into the Desiderata rationale.*

  9.  **Final Polish:** Ensure the "Tension Structure" is clearly articulated as *jointly unsatisfiable claims*, not just problems. (e.g., A + B + C = Contradiction).

      *   *Tension 1:* (1) No source certifies itself + (2) All certification requires a source + (3) No circularity/regress + (4) Action requires certification. -> *Impossible trilemma.*
      *   *Tension 2:* (1) *Pramāṇa* = Infallible truth-generator + (2) Sources degrade/fail + (3) We must identify them *as* sources before acting. -> *If it fails, it wasn't a pramāṇa? Then when did we know?*

      *   *Most Exclusionary:* The demand for *local warrant* (this case, now) derived from *general validation* (population, past). This kills most traditional epistemologies.

      *(Self-Correction)*: Wait, the prompt asks for *which single desideratum* does the most exclusionary work. I need to pick one from my list. I will pick "Second-Order Warrant without Regress" (The Institutional Proxy requirement).

      *(Refining the "Instrument vs Process" question)*: The prompt asks me to tell them if "instrument bringing about veridical cognition" is a genuine requirement or a school commitment. I should address this in the preamble or the tension section. I will place it in the "Prejudices vs Requirements" section.

      *(Final check on the cases)*: Ensure the specific examples (sepsis, waveform, counterfactual, etc.) are explicitly linked to the desiderata.

      *Let's write.*
answer: |-
  ### Desiderata for a Clinical Epistemology of Action

  The following specifications are derived from the constraint that the theory must underwrite *permissible action* in a high-stakes, opaque environment. Traditional *pramāṇa* theory asks, "How is knowledge constituted?" Your committee needs to answer, "When is it safe to act as if we know?"

  #### 1. The Warrant-Action Gap
  **Requirement:** The theory must distinguish between a process that produces true belief and a process that produces *warrant to act*. A source may be reliable (statistically) but lack the normative force to license intervention in a specific instance without further validation.
  *   **Case:** The sepsis risk score. It relies on a statistical relation (reliable indicator) but offers no reason for *this* patient. Acting on it requires a bridge from population probability to individual warrant.
  *   **Status:** **Non-negotiable.**
  *   **Rules Out:** Naive reliabilism (truth-tracking alone justifies action); strict infallibilism (nothing justifies action).
  *   **Consideration:** In medicine, a false positive harms (unnecessary treatment); a false negative harms (missed sepsis). Reliability is necessary but not sufficient for actionability.

  #### 2. Source Individuation for Protocol Matching
  **Requirement:** The theory must individuate sources by their *mode of failure*, not just their mode of success, to assign specific checking protocols.
  *   **Case:** Waveform (perceptual drift) vs. Lab value (instrumental calibration) vs. Guideline (testimonial authority). You cannot check a guideline the way you check a waveform.
  *   **Status:** **Non-negotiable.**
  *   **Rules Out:** Monism (e.g., "Perception alone" or "All inference"); Reductionism that collapses testimony into inference.
  *   **Consideration:** Different sources degrade differently. A protocol for "Perception" (look again) fails for "Testimony" (check the author's conflict of interest).

  #### 3. Negative Cognition (Absence as Data)
  **Requirement:** The theory must account for knowledge of absence as a positive epistemic achievement, not merely a lack of knowledge of presence.
  *   **Case:** Seeing no anticoagulant on the medication list. You know something *is not* there.
  *   **Status:** **Negotiable** (can be reduced to inference, but inefficient).
  *   **Rules Out:** Theories that only affirm existence (e.g., strict empiricism without *anupalabdhi*).
  *   **Consideration:** Clinical safety often depends on ruling out contraindications. If absence is merely "failed perception," it carries less weight than "verified absence."

  #### 4. Defeasibility and Temporal Drift
  **Requirement:** The theory must treat source status as time-bound and defeasible. A *pramāṇa* today may be a *pseudo-pramāṇa* tomorrow due to drift, without changing its intrinsic definition.
  *   **Case:** A source known to have drifted downward; the alarm recognized as "old" but heard for the first time.
  *   **Status:** **Non-negotiable.**
  *   **Rules Out:** Static *pramāṇa* lists (Nyāya, Mīmāṃsā) that treat sources as eternal categories of validity.
  *   **Consideration:** ML models and machines degrade. A theory that says "If it is a *pramāṇa*, it yields truth" cannot handle a tool that yields truth 90% of the time now and 60% later.

  #### 5. Second-Order Warrant without Regress
  **Requirement:** The theory must explain how an agent acquires warrant for a source's reliability without requiring the agent to personally audit the source using that same source (circularity) or an infinite chain of other sources (regress).
  *   **Case:** The guideline issued by a committee you cannot interview; the device you do not understand.
  *   **Status:** **Non-negotiable.**
  *   **Rules Out:** Strict Internalism (you must see the reason); Strict Externalism (you don't need to know it's reliable).
  *   **Consideration:** You cannot audit the mass spectrometer. You must rely on *institutional certification* as a proxy for personal epistemic warrant. The theory must validate "trust in the certifier" as a distinct epistemic move.

  #### 6. Counterfactual and Explanatory Postulation
  **Requirement:** The theory must accommodate knowledge claims that posit unobserved entities or states to explain observed anomalies.
  *   **Case:** "Patient would have arrested without bolus"; Potassium normal on a regimen that should not permit it (implies unobserved intake or error).
  *   **Status:** **Factional Preference** (Better as *arthāpatti*, acceptable as complex *anumāna*).
  *   **Rules Out:** Strict Humean empiricism.
  *   **Consideration:** Clinical reasoning is often abductive. If the theory forces this into standard inference, the probability thresholds become impossible to calculate in real-time.

  ---

  ### Prejudices vs. Requirements

  You asked which demands are genuine and which are inherited baggage.

  *   **"A *pramāṇa* must be an instrument that brings about veridical cognition."**
      *   **Verdict:** **School Commitment (Nyāya), not a Requirement.**
      *   **Reason:** In your context, a source can be a *pramāṇa* (worthy of use) even if it occasionally fails, provided the failure rate is known and managed. Defining it by veridicality makes it useless for risk management. You need "Calibrated Process," not "Truth-Guarantor."
  *   **"The list must be short/closed."**
      *   **Verdict:** **Prejudice.**
      *   **Reason:** Institutional protocols require granularity. Collapsing Testimony into Inference saves ontological space but loses safety checks.
  *   **"Perception must be non-conceptual."**
      *   **Verdict:** **Prejudice.**
      *   **Reason:** Recognizing the alarm *as* the "old one" is conceptual. If perception requires non-conceptuality, most clinical perception is not perception.
  *   **"No source may certify itself."**
      *   **Verdict:** **Real Requirement.**
      *   **Reason:** Essential to avoid circular validation loops in safety protocols.

  ---

  ### The Tension Structure

  You suspected subsets of claims cannot be jointly satisfied. You are correct. Here are the aporias your committee is facing.

  **Tension A: The Trilemma of Validation**
  1.  **No Self-Certification:** A source cannot validate its own reliability.
  2.  **No Regress:** Validation cannot require an infinite chain of further sources.
  3.  **Universal Audit:** Every source used for action must have validated reliability.
  *   **Conflict:** In a high-stakes domain where you cannot audit the source yourself (Case: Device you don't understand), satisfying (1) and (3) forces a regress.
  *   **Resolution:** You must violate (3) for the individual agent and shift the burden to the *institution*. The individual acts on "Certified Trust," not "Personal Validation." The theory must allow *Testimony of Certification* to stop the regress.

  **Tension B: The Infallibility vs. Drift Paradox**
  1.  **Definition:** A *pramāṇa* is defined by its capacity to yield veridical cognition (Nyāya view).
  2.  **Observation:** Sources degrade (Case: Drifted reliability).
  3.  **Identification:** We must identify a source as a *pramāṇa* *before* acting to ensure safety.
  *   **Conflict:** If a source yields false cognition due to drift, was it ever a *pramāṇa*? If yes, the definition (1) is false. If no, you cannot know it is a *pramāṇa* until after the fact (retrospective), which violates (3) for safety protocols.
  *   **Resolution:** Abandon (1). Adopt a probabilistic definition: A *pramāṇa* is a process with a *known error bound*. This shifts the theory from Epistemology to Risk Engineering.

  **Tension C: Specificity vs. Generality**
  1.  **Local Warrant:** Action requires warrant that the source is reliable *for this patient, now*.
  2.  **General Validation:** Sources are validated only on *populations, in the past*.
  3.  **No Gap:** There is no epistemic bridge between population statistics and individual cases (The Reference Class Problem).
  *   **Conflict:** You cannot satisfy (1) using only (2) without violating (3). The sepsis score (Case 1) is the embodiment of this tension.
  *   **Resolution:** Acknowledge the gap. The "warrant" is not epistemic certainty but *ethical permission* based on minimized expected harm.

  **The Most Exclusionary Desideratum:**
  **Desideratum 5 (Second-Order Warrant without Regress).**
  This knocks out the largest share of attractive theories.
  *   It kills **Naive Reliabilism**: It says "It works" is not enough; you need warrant that it works.
  *   It kills **Strict Internalism**: It admits you can't check everything yourself.
  *   It kills **Classical Pramāṇa Theory**: Traditional systems assume the *pramāṇa* is self-evidently valid in the moment (*svataḥ prāmāṇya*) or validated by subsequent success (*parataḥ prāmāṇya*). Neither works for a device you cannot check and whose success you won't know until the patient is harmed.
  *   **Why:** It forces the theory to incorporate *social/institutional epistemology* as a basic source, not a derivative one. If your theory cannot make "Institutional Certification" a basic warrant-stop, it fails the clinical context.

  ---

  ### Scoring the Familiar Options

  **Perception Alone:**
  Fails immediately. Cannot handle the sepsis score, the guideline, or the absent medication. Collapses all testimony into perception, destroying the audit trail required for liability.

  **Perception and Inference Alone:**
  Better, but struggles with the guideline (Testimony). Reducing the committee's guideline to an inference requires you to reconstruct their reasoning, which you explicitly cannot do. Fails on "Absence" unless inference is stretched to breaking.

  **The Nyāya Set (Perception, Inference, Testimony, Comparison):**
  Strong on Testimony (guidelines) and Comparison (alarm recognition). Weak on Drift (static validity) and Counterfactuals (requires *arthāpatti*). The definition of *pramāṇa* as veridical creates the Infallibility Paradox.

  **The Six ( + Postulation, Non-cognition):**
  Handles the "No anticoagulant" (Non-cognition) and "Would have arrested" (Postulation) elegantly. Still suffers from the static validity problem regarding model drift. Best fit for the *types* of cognition, worst fit for the *temporal* degradation.

  **Reductionist (Testimony = Inference):**
  Dangerous. If the guideline is just inference, you are responsible for the premises. If it is Testimony, the responsibility lies partly with the testifier. This distinction is legal and epistemic bedrock in medicine.

  **Broadly Reliabilist/Probabilistic:**
  Best handle on Drift and the Sepsis Score. Fails the "Warrant" requirement: knowing a process is 90% reliable does not tell *this* clinician if *this* output is the 10% error, leaving them exposed to liability without a normative shield.

  **Recommendation:** Do not select a pre-made list. Construct a hybrid: **Nyāya's Source Individuation** (for protocol matching) + **Probabilistic Reliabilism** (for drift/error bounds) + **Institutional Testimony** (to stop the regress of validation).
