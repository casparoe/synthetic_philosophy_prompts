answer: |-
  You're resting comfortably on the functionalist explanation, and I'll grant you this: yes, the ecological niche shapes the moral toolkit. The work on herding societies shows that when your wealth walks away on four legs, you cultivate a psychology ready to violence. But you're making a category error when you say that makes the underlying value identical. To the honor culturist, the willingness to retaliate isn't just a pragmatic tax on property protection; it's constitutive of the good life itself. When you measure cortisol and testosterone levels in response to insults, you don't find cold cost-benefit analysis; you find a moralized emotional surge. They aren't calculating that violence pays; they feel that failing to respond to an insult is shameful regardless of the economic outcome. The means have become the end.

  And regarding convergence: look at the data from modern pluralistic cities. We have people from honor backgrounds and law-based backgrounds living in the exact same economic ecology, under the same legal regime, yet the moral psychologies persist across generations. If morality were just a tracking of external facts about resource security, assimilation should be instant. It isn't. The divergence isn't skin deep because it's not just about how to secure goods; it's about what kind of person you ought to be. You can share an ecology and still disagree fundamentally on whether dignity is something you hold internally or something you negotiate socially through force. That's not a factual disagreement; that's a moral one.
