answer: |-
  ### Part 1: The Logical Space (Design Notes)

  Before handing out the tree, here is the map of the territory. We are testing five dimensions of responsibility. Not all combinations make sense.

  **The Five Dimensions:**
  1.  **Epistemic:** Do we judge by what was knowable in 1914, or by what we know now (hindsight)?
  2.  **Agency:** Who acted? (Individuals, Elites, The Whole Population, The State as Entity, or The System).
  3.  **Liability:** Is responsibility Financial (paying), Moral (shame), or Explanatory (answering)?
  4.  **Continuity:** Does the modern state inherit the past state's status?
  5.  **Teleology:** Is the point Retribution (justice for the past) or Prevention (safety for the future)?

  **Empty/Incoherent Regions (Nobody lives here):**
  *   **The System-Individual Mismatch:** Claiming "The System made war inevitable" (no agent) but demanding "The General must be hanged" (individual punishment). *Why empty:* If the system is the cause, punishing the agent is unjust.
  *   **The Future-Retrospective:** Claiming "We only care about preventing future war" (forward-looking) but demanding "They must admit guilt for 1914" (backward-looking truth). *Why empty:* If the goal is peace, a useful lie is better than a damaging truth.
  *   **The Hindsight Contradiction:** Claiming "You can't judge them by modern standards" but then saying "They should have known X" (where X was discovered in 1915). *Why empty:* Self-contradictory epistemology.

  ***

  ### Part 2: The Decision Tree (Printable)

  **Instructions:** Start at Q1. Follow the arrows based on your answer. When you reach a **LEAF**, read the position name, the awkward commitment, and the "tell."

  ```text
  Q1. THE TEXTBOOK TEST (Epistemology)
  When judging the July 1914 decisions, does the sentence read:
  (A) "They ignored the red flags visible at the time."
  (B) "They failed to predict the catastrophe we now see."
      |
      +---> (A) Go to Q2.
      +---> (B) [WARNING: You are using Hindsight.] Go to Q2.

  Q2. THE DRONE TEST (Agency: Individual vs. Collective)
  A modern drone strike kills civilians due to a rules-of-engagement error.
  Do you:
  (A) Court-martial the Commander who signed the order.
  (B) Fine the Defense Department budget.
      |
      +---> (A) LEAF 1: INDIVIDUAL ELIMINATIVISM
      |       "States don't act, people do."
      |       Awkwardness: You cannot justify collective reparations.
      |       Tell: Gets annoyed when people say "Germany decided."
      |
      +---> (B) Go to Q3.

  Q3. THE MEMORIAL TEST (Agency: Who in the Collective?)
  A village memorial lists 50 dead conscripts and a statue of the Kaiser.
  To assign blame, do you:
  (A) Remove the Kaiser's statue only.
  (B) Remove the names of the conscripts too.
  (C) Leave both, but blame the Alliance System that mobilized them.
      |
      +---> (A) Go to Q4. (Elite Responsibility)
      +---> (B) LEAF 2: COLLECTIVE GUILT
      |       "The population backed the war."
      |       Awkwardness: You must blame the dead victims.
      |       Tell: Uses phrases like "National character."
      |
      +---> (C) LEAF 3: STRUCTURALISM
