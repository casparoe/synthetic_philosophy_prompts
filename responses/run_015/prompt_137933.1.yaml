  ### Part 3: Undecidable Pairs & Limitations

  **Pairs this tree cannot separate:**
  1.  **German Primacy (Leaf 6) vs. Shared Responsibility (Leaf 7):** If two people agree on Q1–Q5 but disagree on the *degree* of risk taken in Q6, the tree separates them. However, if they both agree "All risked it" but one thinks Germany risked *more*, they may land in the same leaf despite disagreeing on nuance.
      *   *Fix:* Add a question: "If you could fine one capital city to prevent a repeat, which one?"
  2.  **Liability Without Blame (Leaf 4) vs. Instrumentalism (Leaf 8):** Both may end up paying without admitting guilt. One does it for legal closure (Leaf 4), the other for future peace (Leaf 8).
      *   *Fix:* Ask "Why are you paying?" (Settlement vs. Investment).

  **Note on the "Hindsight" Node (Q1):**
  This node is diagnostic. If someone chooses (B) but then argues in Q2 or Q3 that the leaders "couldn have known," they have fallen into the **Empty Region: Hindsight Contradiction**. Use this to catch them out.
