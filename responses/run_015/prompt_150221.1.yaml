answer: |-
  ### Phase 1: Brainstorming Normative Frameworks

  Before rendering a judgment, we must map the competing normative structures at play. We are not dealing with state censorship, but with the ethics of private association and institutional gatekeeping.

  1.  **Associative Freedom vs. Distributive Justice:**
      *   *Associative Freedom:* As a private, invitation-only body, the workshop has the right to determine its own membership and conditions of participation. This aligns with a libertarian or communitarian view: communities define themselves by who they exclude.
      *   *Distributive Justice:* Academic platforms are scarce goods that confer status and career capital. If we treat the invitation as a public good within the profession, excluding someone based on extraneous moral criteria (rather than scholarly merit) may constitute an unjust distribution of professional opportunity.

  2.  **Retributive vs. Constitutive Sanction:**
      *   *Retributive:* The committee members view the disinvitation as a penalty for past wrongs ("settling a moral score"). This requires proportionality and evidence of culpability.
      *   *Constitutive:* The disinvitation is framed as defining the boundaries of the community ("refusing to extend its platform"). This is not about punishing the past, but about protecting the integrity of the present space. The question is whether her presence *constitutes* a harm to the workshop's purpose.

  3.  **The Ethics of Epistemic Trust:**
      *   Academic exchange relies on a baseline of mutual recognition. If a speaker fundamentally denies the validity of the audience's intellectual tradition, does this break the condition of "epistemic trust" required for dialogue? Or is friction and disagreement the point of interdisciplinary work?

  4.  **Temporal Morality (The "Eight-Year" Problem):**
      *   Moral sociology suggests that social sanctions lose legitimacy when they fail to account for moral growth. Does a community have an obligation to allow for redemption, or does the harm of the original speech persist indefinitely regardless of the speaker's evolution?

  ---

  ### Phase 2: The Structure of Social Sanction

  You asked to avoid generic free expression arguments. Instead, we must analyze the **legitimacy conditions of informal social sanction**. Unlike legal penalties, which require due process and strict proportionality, social sanctions operate through reputation and access. However, for a social sanction to be *legitimate* (rather than merely an exercise of raw power), it generally requires three conditions:

  1.  **Relatedness:** The sanction must be connected to the context in which it is applied.
  2.  **Proportionality:** The severity of the exclusion must match the severity of the norm violation.
  3.  **Currentness:** The sanction must respond to a *present* threat or stance, not merely a historical record.

  In your case, the **Relatedness** is high. She mocked the very methods your workshop celebrates. This is not like mocking a unrelated discipline; it strikes at the host community's core identity. However, the **Currentness** is low. The remarks are eight years old. Without evidence that she currently holds these views or intends to express them during the keynote, sanctioning her assumes a static moral character. This turns the workshop into a tribunal judging her past self rather than a forum engaging her present work.

  ### Phase 3: Capacity vs. Standing

  This is the critical conceptual distinction for your decision.

  *   **Exclusion Denying Capacity:** This asserts the individual is *unable* to fulfill the role (e.g., "Her work is not rigorous enough," or "She does not understand qualitative methods").
  *   **Exclusion Degrading Standing:** This asserts the individual is *unworthy* of the role due to a violation of communal norms, regardless of competence (e.g., "She is a bad citizen of our discipline," or "She does not respect us").

  **Application to Your Situation:**
  Your committee is proposing a **Standing Exclusion**. No one is arguing she lacks the *capacity* to deliver a rigorous keynote; her empirical work was the reason for the invitation. The argument is that she has forfeited her *standing* within the qualitative community by labeling its practices "dishonest" and "theater."

  **Does this distinction change the moral assessment?**
  Yes, significantly.
  *   If this were a **Capacity Exclusion**, it would be epistemically straightforward: she doesn't fit the topic.
  *   Because it is a **Standing Exclusion**, it transforms the workshop from a site of knowledge production into a site of moral boundary-maintenance.

  While communities have the right to enforce standing (e.g., banning a harasser), doing so based on *speech* rather than *conduct* requires a higher bar. If we legitimize Standing Exclusions based on past speech, we risk creating a system where academic participation is contingent on moral purity tests rather than scholarly contribution. This creates a "chilling effect" not on the speaker, but on the *institution*, which becomes afraid to host complex figures.

  ### Phase 4: Recommendation

  **I advise you to resist rescinding the invitation.**

  My reasoning rests on the **conditions for legitimate social sanction**. While the workshop has the *power* to rescind (associative freedom), it lacks the *normative justification* in this specific instance for three reasons:

  1.  **Failure of Currentness:** Social sanctions are legitimate when they protect the community from *ongoing* harm. Eight-year-old recordings do not prove current bad faith. To sanction her now is to punish a past self without offering a pathway for redemption or verification of current views. It presumes moral stagnation.
  2.  **The Danger of Moral Scoring:** As your colleagues noted, using gatekeeping power to "settle a moral score" collapses scholarly exchange. If invitations become rewards for moral character rather than judgments of present contribution, the academy loses its ability to engage with difficult or adversarial knowledge.
  3.  **Distinction of Purpose:** A workshop is primarily a **Capacity-based institution**. Its *telos* is the exchange of rigorous methods. While **Standing** matters (e.g., if she were actively harassing members *now*), her past critique, however cruel, is an intellectual disagreement framed as an insult. Addressing intellectual hostility with administrative exclusion conflates *argument* with *violence*.

  **Mitigation:** Resisting rescission does not mean ignoring the harm. The committee can acknowledge the tension. The keynote can be framed explicitly as a challenge: "We invited Dr. X because her work is rigorous, even though we fundamentally disagree with her past characterizations of our field. This is an opportunity to demonstrate the robustness of our methods." This reclaims the Standing without resorting to Exclusion.

  ### Phase 5: Reflexivity

  **What would change my mind?**
  I would change my verdict to **support rescinding** if there were empirical evidence or a credible statement indicating that **she currently endorses these views and intends to reiterate them in the keynote.**
  *   *Reasoning:* If the past speech indicates a *present* intent to use the platform to attack the audience's legitimacy, the "Currentness" condition is met. The invitation would then facilitate an act of epistemic violence, making the workshop an "accomplice" not in a abstract sense, but in a literal, performative sense. The exclusion would then shift from a *Retributive Sanction* (punishing the past) to a *Protective Boundary* (stopping a present harm).

  **The Most Vulnerable Point in My Reasoning:**
  The most vulnerable point is my assumption that the **primary telos of the workshop is knowledge exchange (Capacity)** rather than **community solidarity (Standing).**
  *   *Reasoning:* If the workshop is fundamentally a safe space for junior qualitative scholars to build confidence and community, then hosting someone who calls their work "dishonest" may cause tangible psychological and professional harm that outweighs the abstract value of "open exchange." If the harm to the community's cohesion is immediate and severe, my prioritization of "Capacity" over "Standing" may be an unjustified abstraction that ignores the lived reality of the participants. If the workshop's purpose is *care* rather than *critique*, my recommendation fails.
