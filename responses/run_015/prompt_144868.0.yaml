  > "You hear a trustworthy friend tell you a secret. An hour later, you overhear a **different** trustworthy stranger say the exact same thing to someone else."

  **How this separates the rules:**
  *   **If she says Knowledge:** It confirms she allows **redundancy across valid sources**. This solidifies the prediction for Case 1 (Redundant Inference) as **Knowledge**. It implies the *pramāṇa* operates validly regardless of prior certainty.
  *   **If she says Not Knowledge:** It implies she holds a strict **Novelty Constraint** (*anadhigata*) for propositional knowledge, and Case 7 (Pot) was a special exception only for *direct perception* (where contact is physical). If this is the verdict, Case 1 (Inference) should also be **Not Knowledge**, because the *proposition* is already known.

