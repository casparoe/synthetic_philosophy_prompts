  # Joint Statement: Adversarial Collaboration on Consciousness Theory

  ## Part I: Agreed Claims
  *Both sides affirm the following substantive claims. Items are tagged as either **Real Agreement** (empirical/theoretical convergence) or **Definitional Truce** (agreement to suspend terminological disputes).*

  1.  **Neuron Count Insufficiency:** The sheer number of neurons or synapses does not determine conscious capacity; any viable theory must explain why the cortex contributes significantly more to conscious content than the cerebellum, despite the latter's higher neuron count. **[Real Agreement]**
  2.  **Disconnection Cases are Decisive:** Standard wake/sleep contrasts are insufficient to adjudicate theories; cases involving structural disconnection (e.g., split-brain, callosotomy, anesthesia) provide the critical constraints for distinguishing competing accounts. **[Real Agreement]**
  3.  **Panpsychism as a Theoretical Cost:** Assigning conscious experience to simple systems (e.g., thermostats, logic grids) constitutes a significant theoretical cost that requires justification, regardless of whether one views it as a fatal reductio or an acceptable implication. **[Real Agreement]**
  4.  **Computability Constraint:** A theory's core metric being intractable to compute for biological systems is a legitimate scientific limitation that hinders empirical validation, even if the theory claims ontological truth. **[Real Agreement]**
  5.  **Experience vs. Report:** A portion of the debate stems from conflating "phenomenal experience" (what it is like to be the system) with "access consciousness" (what is globally available for report and control); resolving this distinction dissolves some conflicts but not all. **[Definitional Truce]**
  6.  **Perturbation Priority:** Measures relying on active perturbation (e.g., stimulating the brain and measuring response complexity) are epistemically superior to passive observation for assessing conscious capacity in non-communicative states. **[Real Agreement]**
  7.  **Gradation Possibility:** Consciousness need not be treated as a binary switch; theories allowing for graded levels of experience in edge cases (e.g., partial disconnection) are permissible provided they specify the metric of grading. **[Definitional Truce]**
  8.  **Structure Over Substrate:** The specific causal architecture of the system matters more than the biological substrate; silicon could in principle support consciousness if it replicated the relevant causal properties. **[Real Agreement]**
  9.  **Report Fallibility:** Behavioral report is an imperfect proxy for experience; a theory must account for cases where report is absent but experience is presumed present (e.g., locked-in syndrome) or vice versa. **[Real Agreement]**

  ## Part II: Disagreements Table

  | Crux | IIT Formulation | Critic Formulation | Agreed Test / Argument | Predictions (IIT vs. Critic) | Who Moves if Wrong? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Verbal Dispute (Experience vs. Access)** | We are measuring the intrinsic existence of experience, independent of its availability for report. | We are measuring the functional capacity for global broadcast and report; "experience" without access is a vacuous posit. | **No-Report Paradigms:** Measure complexity (PCI) during perceptual switching where the subject cannot report the switch (e.g., specific anesthesia or attentional blink variants). | **IIT:** PCI remains high despite no report capacity.<br>**Critic:** PCI collapses when report capacity is lost. | **Critic:** If PCI stays high without access.<br>**IIT:** If PCI tracks access perfectly. |
  | **2. Throttled-Bridge (Split-Brain)** | If integration between hemispheres drops below a threshold (via narrow/slow bridge), the system excludes the whole and becomes two distinct subjects. | A single subject persists as long as any functional channel exists; degradation is gradual, not a split into two subjects. | **Callosotomy with Residual Bridge:** Surgically isolate hemispheres leaving only a channel transmitting <5 bits/sec with high latency. | **IIT:** Two distinct streams of experience emerge.<br>**Critic:** One degraded stream with severe bottlenecking. | **IIT:** If behavioral unity persists despite low integration.<br>**Critic:** If clear behavioral duality emerges. |
  | **3. Duplicate-Graft (Redundant Slab)** | Experience does not double; the Exclusion Postulate dictates only the maximum of integrated information exists (the original locus excludes the graft). | Experience doubles; distinct physical systems constitute distinct minds regardless of functional redundancy or causal overlap. | **Thought Experiment:** A causally identical slab of cortex is grafted in parallel, contributing no new downstream output. | **IIT:** One subject (Exclusion wins).<br>**Critic:** Two subjects (Physical distinctness wins). | **IIT:** If intuition strongly favors doubling.<br>**Critic:** If intuition strongly favors single subject. |
  | **4. Grid-of-Gates (Panpsychism)** | A sufficiently integrated grid of logic gates possesses experience; this is a prediction, not a bug. | This is a reductio ad absurdum; consciousness requires biological or specific functional organization, not just abstract causation. | **Scaling Argument:** Assess whether accepting experience in simple gates undermines the explanatory power of consciousness for humans. | **IIT:** Accept the cost; intrinsic causation is all that matters.<br>**Critic:** Reject the theory; the cost outweighs the explanatory gain. | **IIT:** Rarely moves (core axiom).<br>**Critic:** Moves if convinced intrinsic causation is sufficient. |
  | **5. Zap-and-Measure (PCI Proxy)** | PCI is a valid proxy for Φ; high complexity indicates high integration and thus consciousness. | PCI measures complexity/connectivity compatible with many theories; it does not uniquely validate IIT over functionalist accounts. | **Dissociation Case:** Find a state with high PCI but no behavioral evidence of consciousness (or vice versa). | **IIT:** PCI will track consciousness perfectly.<br>**Critic:** PCI will dissociate from consciousness in edge cases. | **IIT:** If PCI high but consciousness absent.<br>**Critic:** If PCI uniquely predicts outcomes better than other complexity measures. |

  ## Part III: Remaining Concessions

  **IIT Side Concession:** We acknowledge that the in-principle uncomputability of Φ for large systems currently limits the theory's falsifiability in real-world brains. We concede that the panpsychist implication is a heavy metaphysical burden that requires stronger justification than analogy alone. We agree that PCI may measure general complexity rather than Φ specifically, and must be validated against non-IIT complexity metrics.

  **Critic Side Concession:** We acknowledge that standard functionalist accounts have failed to adequately explain the cortex-versus-cerebellum contrast without ad hoc adjustments. We concede that structure matters independently of input-output function, and that dismissing the "intrinsic" perspective entirely leaves the hard problem untouched. We agree that report-based measures are insufficient for final adjudication in non-communicative states.
