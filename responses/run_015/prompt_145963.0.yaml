  *   **Why this follow-up:** She will likely argue that stability is instrumentally useful. This follow-up forces her to confront the moral cost of that stability when the status quo is harmful.

  **4. The Baseline Loophole**
  "You hold other agents' behavior fixed in the baseline. Suppose your agent does something obnoxious, and a human presses the off-switch. In the baseline, the agent does nothing, but you said human behavior is fixed, so the human presses the off-switch anyway. That means the agent isn't charged for being turned off, even though it provoked it. Is your baseline even well-defined when humans are reacting to you?"

