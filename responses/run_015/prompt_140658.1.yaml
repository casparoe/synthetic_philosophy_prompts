  ### The Joint Action Decision Tree

  **Start Here:** Imagine two people lifting a heavy log together.

  **Q1. The Reduction Check**
  Is this scenario *nothing over and above* two individuals each intending to lift their end, knowing the other is doing the same? Or is there something extra happening that makes it a single "we" action?
  *   **Nothing extra:** Go to **Leaf 1**.
  *   **Something extra:** Go to **Q2**.

  **Q2. The Cognitive Bar**
  Could a swarm of simple robots or a pack of wolves perform this "something extra," or does it require human-level minds capable of complex planning?
  *   **Robots/Wolves can do it:** Go to **Leaf 2**.
  *   **Requires human minds:** Go to **Q3**.

  **Q3. The Hallucination Case (Your Case A)**
  If I lift the log believing you are helping me, but you are actually a hallucination (or a very dumb robot I *think* is a person), am I still participating in a joint action?
  *   **Yes (My mindset is enough):** Go to **Leaf 3**.
  *   **No (You must really exist and know):** Go to **Q4**.

  **Q4. The Description Case (Your Case B)**
  If we lift the log perfectly together, but I think we are "moving debris" and you think we are "building a shelter," are we acting jointly?
  *   **Yes (Coordination is enough):** Go to **Leaf 4**.
  *   **No (We must share the same goal description):** Go to **Q5**.

  **Q5. The Exit Clause**
  If I decide to drop the log and walk away without asking you, have I violated a specific obligation *to you*, or just failed to follow through on my own plan?
  *   **Just my own plan:** Go to **Leaf 5**.
  *   **Violated an obligation to you:** Go to **Q6**.

  **Q6. The Lone Member Case (Your Case C)**
  If I intend to act as part of our team, but unbeknownst to me, the team officially dissolved yesterday (so there is no group), am I still acting jointly?
  *   **Yes (My intention makes it joint):** Go to **Leaf 6**.
  *   **No (The group must actually exist):** Go to **Q7**.

  **Q7. The Group Mind**
  When we act, does the "group" become a distinct agent with its own goals that can override ours, or is it just us individuals acting in a special way?
  *   **Distinct agent (The group has a mind):** Go to **Leaf 7**.
  *   **Us individuals (Special mode of acting):** Go to **Leaf 8**.

  ***

  ### The Leaves (Philosophical Positions)

  *   **Leaf 1: Deflationary / Reductive View.** (e.g., early Bratman, Velleman, some Game Theorists). Joint action is just interlocking individual intentions + common knowledge. No new ontological category.
  *   **Leaf 2: Minimal / Non-Cognitive View.** (e.g., Butterfill, Michael). Joint action requires coordinated planning states, but not full-blown intention or belief. Accessible to infants/animals.
  *   **Leaf 3: Externalist / Unnamed.** (Rare). Joint action is defined by objective coordination regardless of subjective awareness. (Note: Very few philosophers occupy this leaf; it is often considered incoherent to call it "action" without agency).
  *   **Leaf 4: Loose Coordination / Unnamed.** (e.g., some interpretations of Pacherie). Coordination matters more than shared conceptualization of the goal.
  *   **Leaf 5: Shared Intention.** (e.g., Bratman). Requires interlocking intentions and mutual knowledge, but obligations are derived from individual consistency, not a new social bond.
  *   **Leaf 6: We-Intentions.** (e.g., Tuomela & Miller). Individuals hold a special "We-intend" attitude. This can exist in the individual mind even if the social fact is missing.
  *   **Leaf 7: Plural Subject.** (e.g., Gilbert). The joint commitment creates a new entity (a "plural subject") that holds the intention. The group is the agent.
  *   **Leaf 8: We-Mode.** (e.g., Tuomela, Strong). Individuals act as group members. The group's reasons override individual reasons, but the group is not a metaphysical entity distinct from the members.

  ***

  ### Analysis of Your Three Cases

  Here is how the specific cases you argued about function within this tree:

  **(a) Agents who can't form views about others (Hallucination/Robots)**
  *   **Handled by Q3.**
  *   **Separation Power:** High. This cleanly separates **Leaf 3 (Externalist)** from the rest of the internalist theories.
  *   **Note:** Most robust theories (Shared Intention, Plural Subject, We-Mode) land on "No" here. They require mutual knowledge. If your flatmate thinks the branch-draggers are acting jointly *even if* they think the others are hallucinations, she is likely drifting toward **Leaf 3** (which is rare) or **Leaf 2** (if she thinks they are robots). If she thinks they *know* they are helping but don't speak, she is in **Leaf 1 or 5**.

  **(b) Participants coordinated but disagree on description (Rehearsal vs. Performance)**
  *   **Handled by Q4.**
  *   **Separation Power:** Medium. This separates **Leaf 4 (Loose Coordination)** from the stricter intentional views (**Leaf 5, 6, 7, 8**).
  *   **Note:** Most standard theories (Bratman, Gilbert, Tuomela) require some level of shared content. If you think this *is* joint action, you hold a more permissive view than the standard literature. If you think it isn't, you align with the majority of intentionalists.

  **(c) The Lone-Member Case (Acting for a non-existent group)**
  *   **Handled by Q6.**
  *   **Separation Power:** Specific. This separates **Leaf 6 (We-Intentions)** from **Leaf 7 (Plural Subject)** and **Leaf 8 (We-Mode)**.
  *   **Limitation:** This case **does not** separate Plural Subject (Gilbert) from We-Mode (Tuomela Strong). Both require the group to actually exist. To separate those two, you need Q7 (The Group Mind).
  *   **Note:** If you think the lone member *is* acting jointly, you are a We-Intention theorist. If you think they are deluded, you are likely a Plural Subject or We-Mode theorist.

