  ### Unoccupied Combinations (Empty Regions)

  In a decision tree, a "combination" is a path taken. Some paths are logically possible but philosophically empty. Here are the unoccupied regions of this logical space:

  1.  **Path: Q1 (Something Extra) + Q2 (Robots) + Q5 (Obligation).**
      *   **Status:** **Incoherent.**
      *   **Reason:** It is difficult to defend that simple robots can create normative obligations between one another. If they are dumb enough to satisfy Q2, they lack the agency required to generate the obligations in Q5.

  2.  **Path: Q1 (Something Extra) + Q3 (Hallucination Counts) + Q5 (Obligation).**
      *   **Status:** **Incoherent.**
      *   **Reason:** You cannot owe an obligation to a hallucination. If the other agent isn't real (Q3 Yes), there is no one to whom an obligation (Q5 Yes) could be owed.

  3.  **Path: Q1 (Something Extra) + Q6 (Lone Member Counts) + Q7 (Distinct Agent).**
      *   **Status:** **Incoherent.**
      *   **Reason:** If the group is a distinct agent (Q7 Yes), it must exist to be an agent. If the group dissolved (Q6 context), a distinct agent cannot exist solely in one person's head.

  4.  **Path: Q1 (Nothing Extra) + Q5 (Obligation to You).**
      *   **Status:** **Unattractive / Undefended.**
      *   **Reason:** If joint action is *nothing* over and above individual action (Q1 Yes), it is hard to explain where a special interpersonal obligation (Q5 Yes) comes from without smuggling in "something extra." Deflationists usually deny the special obligation.

  5.  **Path: Q1 (Something Extra) + Q4 (Description Doesn't Matter) + Q5 (Obligation).**
      *   **Status:** **Simply Undefended.**
      *   **Reason:** Nobody has bothered to defend the view that we are deeply obligated to each other (Q5) even if we have no idea we are doing the same thing (Q4). Usually, shared understanding is seen as the prerequisite for the obligation.
