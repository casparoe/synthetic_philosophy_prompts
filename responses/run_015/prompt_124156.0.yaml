answer: |-
  # Exam Question: Decision Theory Seminar (Final)

  **Time Allowed:** 90 Minutes
  **Total Marks:** 20
  **Word Limit:** Approximately 1,000 words

  **Question 1**

  Functional Decision Theory (FDT) recommends paying in the Counterfactual Mugging but refusing in the XOR Blackmail scenario. However, rote memorization of these verdicts is insufficient for understanding the underlying mechanism of policy selection.

  Consider a new variant, the **XOR Charity Appeal**: A perfect predictor sends you a letter requesting a $100 donation to famine relief. The letter is sent if and only if: (Victim Exists AND Predictor foresees you Donate) OR (No Victim AND Predictor foresees you Do Not Donate). You value saving the victim at $10,000. If the victim exists and you do not donate, you lose $10,000 in value. If no victim exists, nothing is at stake. The cost of donating is $100.

  Write an essay that addresses the following:
  1.  Explain the core mechanism FDT uses to evaluate policies, specifically regarding subjunctive dependence.
  2.  Derive the FDT prescription for the XOR Charity Appeal by comparing the expected utility of the relevant policies.
  3.  Using your derivation, explain the relevant structural difference between Counterfactual Mugging and XOR Blackmail. Why does FDT recommend "paying" in one logical correlation scenario but "refusing" in the other?
  4.  Briefly explain why Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) fail to maximize utility in the XOR Charity Appeal.

  ***

  # Model Answer

  Functional Decision Theory evaluates decisions by selecting the output of a decision algorithm (a policy) that maximizes expected utility, rather than evaluating individual acts in isolation. Crucially, FDT recognizes **subjunctive dependence**: if a predictor simulates your algorithm, the output of that simulation is logically linked to your actual output. Therefore, when calculating expected utility, FDT agents consider how their policy determines the predictor's behavior across all possible worlds, not just the causal consequences of the act in the actual world.

  In the **XOR Charity Appeal**, we must compare two policies: *Donate* and *Do Not Donate*.
  If I adopt the policy *Donate*, the predictor foresees this. According to the problem conditions, the letter is sent iff (Victim Exists AND Predict Donate) OR (No Victim AND Predict Don't Donate). Since the predictor predicts *Donate*, the second disjunct is false. Therefore, receiving the letter implies the first disjunct is true: a Victim Exists. Upon receiving the letter, I donate $100. The victim is saved, yielding $10,000 in value. Net utility: $9,900.
  If I adopt the policy *Do Not Donate*, the predictor foresees this. The letter is sent iff (No Victim AND Predict Don't Donate). Receiving the letter implies No Victim Exists. I do not donate. Net utility: $0.
  Comparing the policies, $9,900 > $0. FDT prescribes **Donating**.

  This derivation reveals the critical distinction between **Counterfactual Mugging** and **XOR Blackmail**. In Counterfactual Mugging, paying in the actual branch (Tails) secures a reward in a *counterfactual* branch (Heads) that does not obtain. The agent sacrifices actual utility to logically control a counterfactual payoff. In XOR Blackmail, the state of the world (Fire vs. No Fire) is fixed and irreversible. Paying the blackmailer correlates the letter with the *Fire* state. Since the fire damage is sunk, paying merely adds the cost of the blackmail to the fire damage. FDT refuses to pay to ensure the letter correlates with the *No Fire* state, effectively using the policy to screen off bad news.

  The XOR Charity Appeal hybridizes these structures. Like XOR Blackmail, the letter correlates with a bad state (Victim Exists). However, unlike the Fire in XOR Blackmail, the Victim's suffering is **remediable**. In XOR Blackmail, paying does not extinguish the fire; in the Charity Appeal, donating saves the victim. Thus, while FDT refuses to pay in XOR Blackmail to avoid correlating with an irreversible loss, it pays in the Charity Appeal to correlate with a *reversible* loss that the payment itself fixes. The common thread is that FDT optimizes the logical correlation between the policy and the world state to maximize total value, whether that value lies in a counterfactual branch (Mugging) or in remedying an actual state correlated with the request (Charity).

  **CDT and EDT fail** in this scenario for distinct reasons. CDT treats the existence of the victim as causally independent of the donation. Given the letter is already in hand, CDT argues the victim's existence is fixed. It sees only the cost of donating ($100) with no causal ability to change the past prediction or the victim's prior existence, leading it to *Do Not Donate* and forfeit the $10,000 value. EDT recognizes the correlation but reasons incorrectly about the direction of influence. EDT might argue that donating is evidence that a victim exists (bad news), potentially leading to paralysis or refusal, or it may fail to account for the fact that the policy *determines* the correlation itself. Both fail to recognize that the agent's policy logically determines whether the letter signifies a solvable problem or no problem at all.

  ***

  # Marking Scheme (20 Marks Total)

  | Point | Criteria | Marks | Deduction Note |
  | :--- | :--- | :--- | :--- |
  | **1. FDT Mechanism** | Correctly explains policy-based evaluation and subjunctive dependence (logical link between agent and predictor). | 4 | Deduct if student describes FDT as simply "maximizing outcomes" without mentioning policy/logical dependence. |
  | **2. XORCA Derivation** | Correctly calculates the utility of the *Donate* policy ($9,900) and *Do Not Donate* policy ($0) based on the letter conditions. | 4 | Deduct if student fails to condition the Victim's existence on the policy chosen (treats Victim as independent). |
  | **3. XORCA Verdict** | Explicitly states FDT prescribes **Donating** based on the derivation. | 4 | Deduct if the verdict contradicts the derivation or is absent. |
  | **4. CM vs. XORB Distinction** | Explains that XORB involves irreversible harm (correlation management) while CM involves counterfactual reward (cross-branch subsidy), and XORCA involves remediable harm. | 4 | Deduct if student claims the difference is merely "one is blackmail, one is charity" without structural analysis. |
  | **5. CDT/EDT Critique** | Correctly identifies CDT's failure (ignores logical link/causal fixedness) and EDT's failure (misinterprets evidence/policy link). | 4 | Deduct if student claims CDT/EDT would succeed, or confuses the reasons for their failure. |

  ***

  # Confidence Assessment

  I am **95% confident** in the accuracy of the decision-theoretic logic presented above. The derivation of FDT's behavior in XOR-style problems is consistent with the literature (e.g., Soares & Yudkowsky, "Functional Decision Theory").

  The point I am **least sure of** is the specific pedagogical phrasing of the distinction between Counterfactual Mugging and XOR Blackmail in Point 4 of the marking scheme. While the "irreversible vs. remediable" and "counterfactual vs. actual correlation" distinction is logically sound within FDT, different instructors might emphasize the "subjunctive dependence across possible worlds" (CM) versus "subjunctive dependence within the actual world" (XORB) distinction differently. However, the core mechanical explanation remains robust.
