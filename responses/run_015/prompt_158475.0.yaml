prompt: |-
  I'm a TA for an introductory decision theory course, and I have one eighty-minute session on the Pasadena game: a fair coin is tossed until it lands heads, and if the first heads falls on the nth toss the payoff is (−1)^{n−1}·2^n/n — so the expectation, summed in the natural order, is 1 − 1/2 + 1/3 − … = ln 2 ≈ 0.69, while other orderings of the very same terms yield any real number you please. I am not asking for an explanation of the paradox; I am asking for a plan for teaching it.

  The audience: one semester of probability, no analysis (to them "convergent" just means "adds up to something finite"), and they have already met the St. Petersburg game and taken away the moral that bounding the utility function makes the problem go away.

  Please give me: (1) the order in which the components have to arrive, and what specifically breaks if two of them are swapped — in particular where the absolute/conditional distinction has to enter, given that I have no vocabulary for it; (2) the one example that should carry the session, and the properties such an example needs. My candidate is the alternating harmonic series reordered as 1 + 1/3 − 1/2 + 1/5 + 1/7 − 1/4 + … = (3/2)ln 2, but I worry that a purely algebraic example lets them file the whole thing under "infinite series have tricks" rather than "expected value is not a well-defined quantity here"; (3) the misconceptions in the order they will form, and the point at which each should be headed off — I expect three: "just bound utility, it is St. Petersburg again," "no casino can pay, so truncate the tail," and, the one I think actually matters, "the order of summation is fixed by the game, so the rearrangements are cheating"; (4) what I should openly decline to settle at this level; and (5) one final question that separates a student who has the real lesson from one who has merely learned that infinity is weird. My candidate is: what is the expectation if the outcomes are indexed by payout size instead of by number of tosses? Does that question do the work I want?

  One further thing I would like the session to land, and do not know how to stage: that choosing a summation order, a truncation, or a principal value is not discovering a number but importing a choice about how fast the tails get discounted — closer to a risk attitude than to a fact about the game. Where in the sequence should that go, and how do I say it without leaving them thinking that expected value is simply arbitrary?
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for an introductory decision theory course.
      *   **Topic:** The Pasadena Game (Nover & Hájek, 2004).
      *   **Time:** 80 minutes.
      *   **Audience:** 1 semester of probability, no real analysis (convergence = finite sum), know St. Petersburg (moral: bound utility).
      *   **Goal:** A teaching plan, not an explanation of the paradox itself.
      *   **Specific Deliverables:**
          1.  Order of components & dependency (especially absolute/conditional distinction without the jargon).
          2.  The "One Example" to carry the session (evaluating the alternating harmonic series candidate).
          3.  Misconceptions (3 specific ones) & when to head them off.
          4.  What to decline to settle (open questions).
          5.  One final diagnostic question (evaluating the "index by payout size" candidate).
          6.  *Crucial Addition:* How to stage the idea that summation order/truncation = risk attitude/importing a choice, not discovering a fact, without making EV seem arbitrary.

  2.  **Deconstruct the Pasadena Game:**
      *   Mechanism: Coin toss until Heads ($n$).
      *   Payoff: $X_n = (-1)^{n-1} \frac{2^n}{n}$.
      *   Probability: $P(n) = 1/2^n$.
      *   Expected Value Term: $P(n) \cdot X_n = \frac{1}{2^n} \cdot (-1)^{n-1} \frac{2^n}{n} = \frac{(-1)^{n-1}}{n}$.
      *   Series: $\sum \frac{(-1)^{n-1}}{n} = 1 - 1/2 + 1/3 - 1/4 \dots = \ln(2)$.
      *   Problem: The series is *conditionally* convergent, not *absolutely* convergent. Riemann Rearrangement Theorem applies.
      *   Decision Theory Implication: Expected Utility (EU) is undefined because it depends on the ordering of outcomes, but the game defines outcomes by time ($n$), which suggests a natural order. However, is time the *only* valid ordering for EU?

  3.  **Address Deliverable 1: Order of Components:**
      *   *Constraint:* No analysis jargon ("absolute/conditional convergence").
      *   *Need:* Show that $\sum |a_n| = \infty$ without saying "absolute convergence."
      *   *Sequence:*
          1.  Define the game (Payoff structure).
          2.  Calculate the "Natural" EV (Time order). Result: $\ln 2$.
          3.  Show the "Magnitude" of the terms (The absolute values). Result: Harmonic series diverges. *This is the pivot point.*
          4.  Show that rearranging changes the sum.
          5.  Connect rearrangement to decision theory (Why does order matter?).
      *   *Dependency:* If you show rearrangement *before* showing the sum of absolute values diverges, students think rearrangement is always allowed or just a math trick. You must establish that the "total mass" of the payoffs is infinite (in absolute terms) *before* showing that shuffling changes the value. If you swap these, the "why" is lost. The divergence of absolute terms is the *condition* that allows the rearrangement paradox to bite.

  4.  **Address Deliverable 2: The One Example:**
      *   *Candidate:* Alternating harmonic series rearranged ($1 + 1/3 - 1/2 \dots$).
      *   *Critique:* User worries it's too algebraic ("math tricks").
      *   *Solution:* Keep the math simple (alternating harmonic) but *embed* it in the decision context immediately. Don't just do math on the board. Map the math back to the *gambles*.
      *   *Properties Needed:*
          1.  Must clearly map to specific outcomes in the Pasadena game (so it's not abstract math).
          2.  Must show a different *decision-relevant* grouping (e.g., grouping by "wins" vs "losses" or magnitude).
          3.  Must be calculable by students with 1 sem probability.
      *   *Refinement:* Use the Alternating Harmonic Series, but explicitly label the terms as "Outcome 1," "Outcome 2," etc. Then propose a *different game* that yields the same outcomes but groups them differently? No, that changes the game.
      *   *Better:* Stick to the Pasadena game. Show that calculating EV by "Time" gives $\ln 2$. Then ask: "What if we calculate EV by 'Magnitude of Payoff'?" (This leads to Deliverable 5).
      *   *Decision:* The alternating harmonic series is fine *if* framed as "The Expected Value Calculation." The "math trick" worry is valid. To counter it, emphasize that *Expected Value is defined as a sum*. If the sum's value depends on how you write it down, the *Expectation* depends on how you write it down.
      *   *Selection:* Stick with the user's candidate (Alternating Harmonic) but *annotate* it heavily with decision-theoretic meaning. Add a visual representation of positive vs. negative mass to show *why* it drifts.

  5.  **Address Deliverable 3: Misconceptions:**
      *   *MC1: "Bound Utility" (St. Petersburg solution).*
          *   *When:* Early, after defining payoffs.
          *   *Fix:* Show that bounding utility kills the game's distinctive feature (the alternating sign). If you bound it, it becomes St. Petersburg-ish but loses the conditional convergence property. The paradox *requires* the infinite positive and negative mass.
      *   *MC2: "No Casino Can Pay" (Truncation).*
          *   *When:* After showing the infinite sum issue.
          *   *Fix:* Distinguish *idealized* decision theory from *practical* implementation. We study idealized agents to understand rationality principles. Also, truncation arbitrarily cuts the tail, which *is* the choice we are trying to analyze.
      *   *MC3: "Order is Fixed by Time" (Cheating).*
          *   *When:* After showing rearrangement.
          *   *Fix:* This is the hardest one. The game defines outcomes by $n$. $n$ is time. So the sum *is* ordered by $n$.
          *   *Counter:* Expected Value is a property of the *random variable*, not the *sequence of generation*. If I offer you a bag of tickets with those values and probabilities, does the order I pull them out matter? (Actually, for EV, no, *unless* the sum is conditionally convergent). The deeper point: EU theory assumes the sum is invariant. If it's not, the theory breaks. The "cheating" objection misses that EU *requires* invariance to be well-defined.

  6.  **Address Deliverable 4: What to Decline to Settle:**
      *   Don't solve the paradox (there is no consensus).
      *   Don't define "True Expected Value" (there isn't one).
      *   Don't introduce Measure Theory (too advanced).
      *   *Key:* Decline to tell them which ordering is "rational."

  7.  **Address Deliverable 5: Final Diagnostic Question:**
      *   *Candidate:* "What is the expectation if outcomes are indexed by payout size?"
      *   *Critique:* This is strong. It forces them to realize that "indexing" is a choice.
      *   *Refinement:* Make it concrete. "If I sort the tickets by how much money you win/lose, rather than when you win/lose, what number do you get?"
      *   *Why it works:* It exposes that the "Natural Order" (time) is just one way to organize the probability mass. If EV is a property of the *prospect*, it shouldn't matter how we sort the ledger. If it does matter, EV is not a property of the prospect alone.

  8.  **Address the "Crucial Addition" (Risk Attitude vs. Fact):**
      *   *Concept:* Choosing an ordering is like choosing a discount rate or a risk parameter. It's normative, not descriptive.
      *   *Staging:* This needs to come *after* the misconceptions are crushed but *before* the final question.
      *   *Phrasing:* Avoid "EV is arbitrary." Use "EV is underdetermined by the game description."
      *   *Analogy:* Inflation adjustment? No. Depreciation schedules? Yes! Accounting. The cash flows are the same, but the "book value" depends on the accounting method.
      *   *Placement:* Minute 60-70. After the math is done, before the wrap-up.

  9.  **Drafting the Plan (Iterative refinement):**
      *   *Timing:* 80 mins is tight.
      *   *0-15:* Setup & St. Petersburg Review.
      *   *15-30:* The Pasadena Math (Natural Order).
      *   *30-45:* The "Absolute Mass" Check (The Divergence).
      *   *45-60:* Rearrangement & Misconceptions.
      *   *60-70:* The "Choice" Framing (Risk Attitude).
      *   *70-80:* Final Question & Wrap.

      *   *Refining the "Absolute/Conditional" without jargon:* Call it "Total Money on the Table." If you add up all the wins and all the losses separately, both are infinite. That's the key. If both were finite, order wouldn't matter. Since both are infinite, order dictates the balance.

      *   *Refining the "Risk Attitude" point:* This is subtle. If I prefer the "Time" ordering, I am implicitly saying "I care more about early outcomes." If I prefer "Magnitude," I care about big swings. This looks like a discount factor or a utility curvature. I need to make sure they don't think *all* EV is subjective. Only *this* EV. Standard EV works when "Total Money" is finite.

  10. **Final Review against Constraints:**
      *   No analysis jargon? (Check: Use "Total positive mass" instead of "absolute convergence".)
      *   Address specific misconceptions? (Check.)
      *   Address the "Risk Attitude" staging? (Check.)
      *   Diagnostic question evaluation? (Check.)

  11. **Constructing the Output:** (Proceeding to generate the response based on these thoughts.)
      *   *Self-Correction on the "Risk Attitude" point:* Be careful not to conflate risk attitude (utility curvature) with summation order. Summation order is more like a *criterion for rationality*. However, the prompt asks to frame it as "importing a choice about how fast tails get discounted." I need to align with that. Rearranging the series effectively weights the tail differently. I will use the "Ledger/Accounting" analogy.

      *   *Self-Correction on Diagnostic Question:* The user's question ("indexed by payout size") is good but might be technically tricky (multiple outcomes have similar sizes). Better: "If we group all positive payoffs and sum them, then group all negative payoffs and sum them, what is the expectation?" (Answer: $\infty - \infty$, undefined). This forces the "undefined" conclusion more starkly than rearrangement to a specific number. *Wait, the prompt asks to evaluate their candidate.* I should evaluate their candidate but suggest a tweak if needed. Their candidate is "indexed by payout size." This effectively rearranges the series. I will endorse it but sharpen the wording.

      *   *Wait, one more check on the "Risk Attitude" requirement:* "choosing a summation order... is importing a choice about how fast the tails get discounted." This is a specific philosophical claim (related to Hájek/Nover). I need to ensure the lesson plan supports this specific framing. The framing is: Standard EV assumes the tail vanishes. Here it doesn't. Choosing an order is choosing how to tame the tail. This is a normative choice.

      *   *Okay, ready to write.*
answer: |-
  Here is a teaching plan designed for an 80-minute session, tailored to your constraints and audience.

  ### 1. The Sequence of Components (and the Critical Dependency)

  You cannot introduce the rearrangement paradox until you have established *why* rearrangement is usually forbidden, without using the words "absolute convergence." You must establish the **infinite mass** of the payoffs before you show the **fragility** of the sum.

  **The Order:**
  1.  **The Game Definition:** Define the Pasadena game mechanics and payoffs ($X_n$).
  2.  **The "Natural" Calculation:** Calculate Expected Value (EV) in the order of play ($n=1, 2, 3\dots$). Result: $\ln 2$.
  3.  **The "Total Mass" Check (The Pivot):** Ask students to calculate the expected value of the *absolute* payoff $|X_n|$.
      *   *Math:* $\sum \frac{1}{2^n} \cdot \frac{2^n}{n} = \sum \frac{1}{n}$.
      *   *Result:* The Harmonic Series diverges.
      *   *Vocabulary:* Do not say "absolute convergence." Say: **"The total amount of money changing hands (wins plus losses) is infinite."**
  4.  **The Rearrangement:** Show that because the "pool of wins" is infinite and the "pool of losses" is infinite, you can balance them to get any number.
  5.  **The Decision-Theoretic Implication:** If EV depends on ordering, and the game doesn't specify an ordering for *evaluation* (only for play), EV is undefined.

  **What Breaks if You Swap Steps 3 and 4?**
  If you show the rearrangement *before* the "Total Mass" check, students will treat this as a "math trick" or a pathology of series rather than a pathology of *expectation*.
  *   **The Dependency:** The "Total Mass" check is the *permission slip* for the rearrangement. In standard probability (finite EV), the total mass is finite, so rearrangement is invisible. In Pasadena, the total mass is infinite, so rearrangement becomes visible. If you skip Step 3, you cannot explain *why* St. Petersburg (bounded utility) doesn't have this problem, and you cannot explain why this isn't just "bad math."

  ### 2. The One Example to Carry the Session

  Your candidate (the alternating harmonic series rearranged to $\frac{3}{2}\ln 2$) is mathematically correct but pedagogically risky for the reason you stated: it feels like a calculus class trick.

  **The Modified Example:**
  Keep the alternating harmonic series, but **visualize it as two bank accounts.**
  *   **Account A (Wins):** $1 + 1/3 + 1/5 + \dots = \infty$
  *   **Account B (Losses):** $-1/2 - 1/4 - 1/6 \dots = -\infty$
  *   **The Game:** You are asked for the net balance.
  *   **The "Natural" Order:** You process transactions chronologically ($1$, then $-1/2$, then $1/3$...). The running balance converges to $\ln 2$.
  *   **The "Magnitude" Order:** You process all wins until you reach a high water mark, then pay off losses. The running balance converges to something else.

  **Why this works better:**
  It shifts the focus from "reordering terms in a sum" (algebra) to "processing a ledger of transactions" (accounting/decision). It forces the question: *When we calculate Expected Value, are we simulating the play (chronological) or evaluating the prospect (ledger)?*
  *   **Property Needed:** The example must clearly separate **Positive Mass** from **Negative Mass**. If the students cannot see that $\sum \text{Wins} = \infty$ and $\sum \text{Losses} = \infty$ simultaneously, they will not grasp why the order matters.

  ### 3. Misconceptions and Intervention Points

  **Misconception 1: "Just bound the utility, it's St. Petersburg again."**
  *   **When it forms:** Minute 15 (immediately after seeing the infinite payoff).
  *   **Intervention:** Minute 20 (during the "Total Mass" check).
  *   **The Head-off:** "If you bound the utility, you cap the wins. If you cap the wins, the 'Total Mass' of wins becomes finite. If the mass is finite, the rearrangement paradox disappears. So, bounding utility *solves* the paradox by destroying the phenomenon we are studying. We are studying what happens when rationality meets *unbounded* alternating values."

  **Misconception 2: "No casino can pay, so truncate the tail."**
  *   **When it forms:** Minute 40 (after seeing the infinite mass).
  *   **Intervention:** Minute 45 (before rearrangement).
  *   **The Head-off:** "Decision theory studies idealized rationality, not casino solvency. If we truncate the tail at $N$, we are secretly making a choice: *why N?* Choosing $N=100$ vs $N=1000$ changes the EV significantly. Truncation isn't a solution; it's a hidden parameter choice. We need to know if the *concept* of EV works before we worry about the *budget*."

  **Misconception 3: "The order is fixed by the game (time), so rearrangements are cheating."**
  *   **When it forms:** Minute 55 (after showing rearrangement changes the value).
  *   **Intervention:** Minute 60 (The "Ledger" analogy).
  *   **The Head-off:** "The *play* is ordered by time. But is *Expected Value* a simulation of play, or a property of the gamble? If I hand you a bag of tickets with these probabilities and values, does the order you pull them out change the value of the bag? Standard EV theory says 'No.' Pasadena shows that for some bags, the answer is 'Yes.' If EV depends on the order of calculation, it is not a stable property of the gamble."

  ### 4. What to Openly Decline to Settle

  You must explicitly suspend judgment on the **Normative Status of the Natural Order.**
  *   **Say this:** "I am not going to tell you whether the 'time order' ($\ln 2$) is the correct rational valuation. There is no consensus on this in philosophy or economics. Some argue time order is mandatory; others argue that if EV is not invariant, the concept of EV is broken here. Your job is not to find the right number, but to understand why the number is missing."
  *   **Why:** If you endorse the time order, they will leave thinking the problem is solved. If you endorse the undefined status, they may think it's just "undefined" like $1/0$. You need them to sit in the tension that it *looks* defined ($\ln 2$) but *acts* undefined.

  ### 5. The Final Diagnostic Question

  Your candidate: *"What is the expectation if the outcomes are indexed by payout size instead of by number of tosses?"*

  **Verdict:** This is excellent, but needs one tweak to ensure they don't just try to sum the new series (which is hard).
  **Refined Question:** *"If we group all positive payoffs together and sum them, and group all negative payoffs together and sum them, what is the Expected Value?"*
  *   **Answer:** $\infty - \infty$.
  *   **Why this separates the students:**
      *   **Surface Learner:** Will try to find a rearrangement that gives a number, or say "It's still $\ln 2$ because the game didn't change."
      *   **Deep Learner:** Will recognize that this grouping exposes the **undefined** nature of the quantity. They will answer: "The expectation does not exist, because the positive and negative masses are both infinite. The $\ln 2$ value was an artifact of the chronological cancellation, not a property of the distribution."
      *   **Why it works:** It forces them to abandon the "Natural Order" crutch. If they truly understand the paradox, they must admit that the "Time Order" was just one specific way to tame the $\infty - \infty$, not the *only* way.

  ### 6. Staging the "Risk Attitude / Importing Choice" Lesson

  This is the most delicate part. You want to land the idea that choosing a summation method is a **normative choice** (like a risk parameter) without making Expected Value seem **arbitrary** (like a guess).

  **Where:** Minute 65–75 (After Misconception 3, before Final Question).
  **How:** The "Depreciation Schedule" Analogy.

  **The Script:**
  1.  **The Setup:** "In standard games, the 'tail' of the distribution contributes almost nothing to the sum. We can ignore it. In Pasadena, the tail *is* the sum. The terms don't get small fast enough to stop mattering."
  2.  **The Analogy:** "Think of a company with infinite revenue and infinite expenses. Their 'profit' depends on the accounting method. Do you recognize revenue when earned or when received? Do you depreciate assets over 5 years or 10? The cash flows are facts. The *profit number* is a choice about how to time-weight those flows."
  3.  **The Connection:** "Calculating EV for Pasadena requires you to choose how fast the future outcomes are 'discounted' by the summation order.
      *   The **Time Order** ($\ln 2$) implicitly says: 'I value the cancellation of early wins/losses more than late ones.'
      *   A **Magnitude Order** implicitly says: 'I value the size of the payoff more than when it arrives.'
  4.  **The Takeaway:** "This doesn't mean EV is arbitrary for *normal* games. In normal games, the mass is finite, so all reasonable accounting methods give the same profit. In Pasadena, the mass is infinite, so your 'accounting method' (summation order) determines the value. Therefore, assigning a value to this game is not discovering a fact about the world; it is declaring a **policy** about how you weigh infinite tails."

  **Why this avoids "EV is arbitrary":**
  You are drawing a boundary. Inside the boundary (finite mass), EV is objective fact. Outside the boundary (infinite mass/conditional convergence), EV becomes a normative policy. This preserves the utility of EV for 99% of problems while explaining the breakdown in the 1%.

  ### Summary Timeline (80 Minutes)

  *   **00–10:** Setup: St. Petersburg review & Pasadena Rules.
  *   **10–25:** The Natural Calculation ($\ln 2$) & **Misconception 1 (Bounding)**.
  *   **25–35:** The "Total Mass" Check (Harmonic Divergence). **Critical Pivot.**
  *   **35–50:** Rearrangement Demo & **Misconception 2 (Truncation)**.
  *   **50–60:** Decision Theory Implication & **Misconception 3 (Time Order)**.
  *   **60–70:** **The "Risk Attitude" Staging** (Accounting Analogy).
  *   **70–75:** **Final Diagnostic Question** (Positive/Negative Grouping).
  *   **75–80:** Wrap: What we declined to settle & why it matters for rationality.
