      *   *Critique:* This is binary and global. It treats a shutdown command the same as a "change course" command.
      *   *Reality:* Human intervention is usually iterative refinement. "Stop building the nanofactory" vs. "Stop building the nanofactory *this way*, try *that way*."
      *   *Dilemma:*
          *   If the agent is indifferent to the button, it might allow shutdown but lacks motivation to align the *content* of the new plan with the original goal.
