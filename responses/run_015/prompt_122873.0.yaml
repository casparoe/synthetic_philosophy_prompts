  ### 1. The Author's Rule: Contextual Causal Covariation
  The author is operating under a rule of **Contextual Causal Covariation**. This principle holds that reference is determined by the **actual natural kind in the subject's current environment** that systematically causes the subject's tokenings of the term and satisfies the term's core functional role (e.g., being a clear, drinkable liquid), provided such a kind exists.

  *   **Why this fits:**
      *   **Externalism (1, 3, 5, 7):** Reference depends on the world (H₂O, XYZ, Gold), not just internal descriptions.
      *   **Social Deference (2, 7):** Deference works because it links the speaker to the causal source in the environment (the experts' contact with the kind).
      *   **Existence Condition (4):** If nothing in the environment plays the role, reference fails.
      *   **Dynamic Sensitivity (6):** Reference shifts when the *current* causal environment shifts (Slow Switching).
      *   **Non-Linguistic Content (5):** Causal covariation does not require language, only a causal link between kind and state.

  ### 2. The Alternative Rule: Global Intentional Anchoring
  A competing rule that fits all seven verdicts is **Global Intentional Anchoring**. This principle holds that reference is fixed by the **intended referent of the agents who introduced the term into the causal chain** (whether experts, evolutionary history, or original baptizers), provided that intended kind exists in reality.

