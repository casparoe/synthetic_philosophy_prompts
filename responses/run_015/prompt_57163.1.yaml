answer: |-
  ### Brainstorming & Arithmetic

  *   **Depot Optimization (Ex Ante):** The planner maximizes expected value ($E$) before the truck leaves. Let $p$ be the probability of exiting.
      *   Outcome 1 (Exit at 1st): Probability $p$. Payoff 0.
      *   Outcome 2 (Exit at 2nd): Probability $(1-p) \times p$. Payoff 4.
      *   Outcome 3 (Miss both): Probability $(1-p) \times (1-p)$. Payoff 1.
      *   $E = 0 + 4p(1-p) + 1(1-p)^2 = 4p - 4p^2 + 1 - 2p + p^2 = -3p^2 + 2p + 1$.
      *   Maximize $E$: Derivative $-6p + 2 = 0 \rightarrow p = 1/3$.
      *   **Optimal Policy:** Exit 1/3 of the time. **Expected Value:** 1.33. (Better than deterministic "Always Go" which yields 1.0).
  *   **Driver Calculation (Ex Interim):** The driver arrives at an interchange. Due to the memory wipe, they treat both interchanges as identical nodes.
      *   If the depot plan is $p=1/3$, the driver is statistically more likely to be at the second interchange (because reaching the second requires *not* exiting at the first).
      *   Rough conditional logic: "If I'm likely at the second one, exiting gives me 4. Continuing gives me 1 (border). Therefore, Exit."
      *   **Conflict:** The driver's local rationality (Exit Always) destroys the depot's global optimization (Exit 1/3).
  *   **The Reality Leak:** In the real world, 40km of desert driving introduces variance: fuel burn, tire wear, sun position, odometer drift. A human can count seconds or miles.
  *   **Plugging the Leak:** The story must enforce the "No Persistent State" rule hard. The truck's trip computer zeros the odometer at the gantry trigger. The HVAC switches to full recirculation to scrub external smells (rendering plants, pine, dust). The sodium lighting eliminates color cues for sun position.
  *   **The Object:** A six-sided die in a sealed acrylic shaker. Depot policy: Roll 1 or 2 = Turn. Roll 3-6 = Continue. It reduces the driver's agency to a gamble they aren't allowed to understand emotionally.
  *   **Structural Ambiguity:** I will write the approach to the interchange twice, or write one approach so generically that it could be either. The repetition of sensory details (the crack in the lip, the font) will reinforce the indistinguishability.
  *   **Theme:** The driver is a vessel. Obeying the die is an act of faith in the "Past Self" (the Depot configuration) who possessed information the "Present Self" is forbidden to hold.

  ***

  ### Zero State

  The sodium lights hum. It is a low, insectile vibration that lives in the fillings of your teeth. You feel it before you see the gantry, a pressure change in the cab as the truck's skin picks up the charge of the corridor.

  Outside, the desert is not black but a deep, bruised purple, scrubbed clean of stars by the orange glow. The overpass lip ahead has a crack in the concrete, a jagged lightning bolt frozen in gray stone. You know this crack. You saw it forty kilometers ago. Or maybe you are seeing it for the first time. The truck does not tell you.

  You lift your foot off the accelerator. The engine brake whines. The speed bleeds off: eighty, seventy, sixty. The exit sign blooms in the periphery, white reflective paint in that specific font, the one mandated by the state logistics board. *INTERCHANGE 44-B*. Or maybe 45-B. The number is obscured by a smear of dead insects on the windshield, right in the sightline. You don't wipe it. Wiping it changes the refraction. Changing the refraction is a violation of the protocol.

  The truck slows to a crawl. The lane markings are thermoplastic, raised, clicking against the tires like a countdown. *Click-click-click.*

  You are at an interchange. There are two of them on this corridor. They are built to the same spec by the same contractor. Same gantry, same lighting, same cracked overpass lip. The truck's memory wiped clean at the last one. A security feature. Regulator-mandated no-persistent-state. If the truck knew where it was, it could be hacked. If the truck could be hacked, the cargo could be diverted. So the truck knows nothing. It knows only that it is *here*.

  You are the fallback. You are the biological randomizer.

  You pull the shaker from the console mount. It is heavy acrylic, sealed with a tamper-evident strap. Inside, a single white die rattles. You were issued this at the depot, eight hours ago, when you were a different person. That person knew the map. That person knew the payoffs. That person signed the contract that says if you take the first exit, you get nothing. Zero. If you take the second, you get full pay. If you miss both, you get a fraction and a mark on your record that smells like failure.

  That person calculated the odds. You do not get to see the calculations. You only get the die.

  The truck idles. The HVAC is on full recirculation. You cannot smell the desert sage. You cannot smell the rendering plant that supposedly lies twenty kilometers north of the second interchange. You cannot smell your own sweat, much. The air is sterile, recycled, timeless. You check the trip meter. It reads 0.0 km. It zeroed itself when you passed under the gantry light. You check the clock. It counts seconds, but you don't know when the shift started, only that you are eleven hours deep into the monotone.

  Your hand hovers over the shaker. This is the humiliation. You are a professional operator. You know the feel of the road, the weight of the load, the drift of the wind. You could guess. Your gut is screaming that this is the second one. Eleven hours in, the rhythm of the road suggests you should be at the delivery window. The fatigue has a texture, and this fatigue feels like the end of the run. If you exit now, you bet on the four-point payoff. If you continue, you risk the border checkpoint, the one-point salvage, the mark on the record.

  Logic says turn. Every instinct says turn.

  But the die is the law. The die represents the Depot Self. That self was sober. That self had the map. That self knew that if you always turn when your gut says turn, you will catch the first interchange every time. You will return to depot. You will get zero. The Depot Self knew that to win, you must be willing to lose. You must be willing to drive past the money.

  You shake the acrylic box. The white cube tumbles, a blur of pips. It feels like shaking a grenade. You are surrendering your agency to a piece of plastic because a man in a office calculated that your ignorance is a resource to be managed.

  You set the box on the dash. The die settles.

  You lean in. The orange light washes over the acrylic.

  It is a four.

  The policy is printed on the card zip-tied to the shaker. *1-2: EXIT. 3-6: CONTINUE.*

  Four means continue.

  Your hand tightens on the wheel. The exit ramp is right there. It curves away into the dark, promising the hub, the coffee, the sleep, the pay. To continue is to drive into the void for another forty kilometers of identical cracked concrete and humming lights. It is to gamble that there is a second interchange. It is to gamble that you haven't already passed it.

  If this is the second interchange, and you continue, you hit the border. You get the mark. You get the fraction. You have thrown away the win because a piece of plastic said so.

  If this is the first interchange, and you continue, you stay in the game. You keep the chance alive.

  You cannot know. That is the point. The memory wipe is not a glitch; it is the wall. You cannot leave yourself a note because the truck scrubs the logs. You cannot radio dispatch because the corridor is dead zone, and even if it weren't, they aren't allowed to tell you. They only know where you *should* be, not where you *are*.

  You are alone with the die.

  Loyalty to the Depot Self is a species of faith. You have to believe that the person who loaded the shaker knew more than the person holding it. You have to believe that the plan is good even when the execution feels like suicide. You have to trust the math you cannot see over the hunger you can feel.

  The engine idles rough. The light hums. The crack in the overpass waits.

  You put the truck in gear. You ease off the brake. The truck lurches forward, past the exit ramp, back into the flow of the corridor. The orange light swallows you. The click-click-click of the lane markers resumes.

  You drive. You do not look in the rearview mirror. You do not check the odometer. You keep your eyes on the dark ribbon of road, waiting for the lights to hum again, waiting for the gantry, waiting to see if the die was right, or if you just drove past your paycheck into the night.

  Forty kilometers is nothing. Forty kilometers is everything. You press the accelerator. The desert unspools, identical in every direction.

  ***

  ### Technical Note for Fact-Checking

  The story simplifies the "Absent-Minded Driver" equilibrium slightly for narrative flow; specifically, the driver's intuition that "Exiting is always better" relies on assuming they are likely at the second node, whereas the true game-theoretic tension involves the consistency of that belief with the strategy itself. Additionally, a total odometer wipe at a gantry is technically feasible but would likely trigger maintenance alerts in a real fleet; the story treats the "no-persistent-state" rule as absolute to preserve the informational symmetry required by the puzzle.
