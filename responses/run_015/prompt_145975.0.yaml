  # JOINT STATEMENT OF PRINCIPLES AND DISAGREEMENTS
  **Regarding Municipal Public Safety Infrastructure**
  **Submitted by:** The Coalition for Accountable Safety (Reform) & The Community Safety Collective (Abolition)
  **Date:** October 24, 2023
  **Status:** Draft for Council Review

  ## I. AGREED CLAIMS
  *The following claims are accepted by both signatories as factual or normative premises. These are not compromises; they are the shared ground upon which our disagreement rests.*

  1.  **The 911 Default is a Structural Mismatch:** The current 911 dispatch system functions as the default intake mechanism for a wide range of social failures (mental health crisis, homelessness, substance use, neighbor disputes) for which armed law enforcement is neither trained nor the appropriate solution. Both sides agree this mismatch produces unnecessary escalation and harm.
  2.  **The Policing Paradox in Marginalized Communities:** Residents of low-income neighborhoods currently experience simultaneous over-policing (high frequency of stops, summons, and use-of-force incidents) and under-protection (low clearance rates for violent crimes, slow response times for victims). Both sides agree this is not a contradiction to residents, but a functional feature of the current system.
  3.  **Oversight Without Power is Performative:** Current civilian oversight mechanisms lack subpoena power, independent investigative authority, and binding disciplinary capability. Both sides agree that without these powers, oversight bodies cannot effectively check misconduct or restore public trust.
  4.  **Budget Volume ≠ Safety Outcome:** Increases in the police budget over the last twenty years have not produced a linear correlation with reduced violent crime or increased community safety metrics. Both sides agree that resource allocation must be tied to specific outcome metrics rather than historical baselines.
  5.  **The Residual Coercion Problem:** Every concrete proposal currently on the table from either side acknowledges that some mechanism for immediate, coercive intervention remains necessary for rare, in-progress violent emergencies where de-escalation has failed or is impossible. The disagreement is not about the *existence* of this tier, but its *scope, control, and institutional identity*.
  6.  **Private Security is Not a Neutral Alternative:** Reducing public police capacity without establishing public alternatives risks shifting security functions to unaccountable private security firms or vigilante actors. Both sides agree that abandoning the field to private force is an unacceptable outcome.

  ## II. DISAGREEMENTS TABLE
  *The following table outlines where the sides diverge. Positions are stated in terms each side recognizes as their own, not softened for consensus.*

  | Issue | Coalition for Accountable Safety (Reform) | Community Safety Collective (Abolition) |
  | :--- | :--- | :--- |
  | **Primary Function of Police** | To hold a legitimate monopoly on force to prevent private violence and enforce laws democratically enacted. | To manage surplus populations and enforce a property order that maintains racial and economic hierarchy. |
  | **Strategy for Change** | **Institutional Correction:** Bind the existing institution with stricter controls, specialized units, and external oversight to align it with democratic will. | **Functional Obsolescence:** Starve the institution of its social functions until it is no longer necessary, replacing it with non-punitive infrastructure. |
  | **"Defund the Police"** | **Tactic/Phase:** Interpreted as reallocating specific budget line-items (e.g., mental health calls) to other agencies while maintaining core police capacity. | **Strategic Horizon:** Interpreted as a long-term process of dismantling the police function entirely; budget cuts are a means to force functional migration, not just efficiency. |
  | **The "Duty to Answer"** | **State Obligation:** The State holds the ultimate liability and obligation to respond to distress calls; this cannot be outsourced to volunteers or non-state actors. | **Community Capacity:** The obligation should be distributed across community networks; state response is a last resort, not a right owed by the government. |
  | **Legitimacy Source** | **Procedure:** Legitimacy comes from legal-rational authority, due process, and adherence to written policy. | **Consent:** Legitimacy comes from community acceptance and the absence of harm; procedure without consent is oppression. |
  | **Property & Order** | **Neutral Good:** Enforcement of property rights is a neutral function necessary for social stability and economic activity. | **Contested Order:** Enforcement of property rights is often the primary driver of conflict; protecting property should not trump human need. |
  | **Time Horizon** | **Immediate:** Solutions must be implementable within the current budget cycle and legal framework. | **Generational:** Solutions require a decade-long restructuring of social infrastructure; short-term fixes often entrench the long-term problem. |

  ## III. CRUXES & EMPIRICAL TESTS
  *These are the specific points where our disagreement is not merely verbal but predicts different outcomes. We have identified the evidence that would resolve or shift these disputes.*

  ### Crux 1: The Duty-Bearer (User Idea: Duty-to-Answer)
  **The Dispute:** The Reform side argues the State *must* be the duty-bearer because only the State has the resources and liability structure to guarantee response. The Abolition side argues that making the State the default duty-bearer ensures the solution remains punitive; they argue communities can bear this duty if resourced.
  **The Prediction:**
  *   **Reform predicts:** If the State withdraws as the primary duty-bearer, response times in low-capacity neighborhoods will increase, and liability for failure will become diffuse (no one to sue/accountable).
  *   **Abolition predicts:** If the State withdraws as the primary duty-bearer, community-led response will de-escalate situations faster because responders are known to the subject, reducing overall harm even if response times vary.
  **The Concrete Test:**
  *   **Case:** Compare 911 response outcomes vs. community dispatcher models (e.g., [Assumption: Models like CAHOOTS in Eugene or STAR in Denver]) for mental health calls.
  *   **Metric:** Rate of escalation to force *and* rate of successful connection to services within 48 hours.
  *   **Verdict Condition:** If community models show lower escalation but significantly higher "drop-off" (failure to connect to care), Reform wins on liability. If community models show equal care connection with lower escalation, Abolition wins on duty distribution.

  ### Crux 2: The Residual Tier (User Idea: Residual Tier)
  **The Dispute:** Reform argues the "armed tier" must be a professionalized police department to ensure training and accountability. Abolition argues that even a small "armed tier" will inevitably expand its scope (mission creep) unless it is a separate, non-police entity.
  **The Prediction:**
  *   **Reform predicts:** A separate "armed tier" outside the police department will lack oversight and become *more* violent because it lacks the bureaucratic constraints of a large department.
  *   **Abolition predicts:** A police department, even a small one, will inevitably reclaim social control functions (patrolling, stops) to justify its budget, whereas a separate tier restricted only to violent emergencies will remain small.
  **The Concrete Test:**
  *   **Case:** Compare departments that underwent "reset" (e.g., [Assumption: Camden, NJ dissolution]) vs. departments that created specialized non-police response units within existing structures.
  *   **Metric:** Percentage of budget allocated to patrol/administrative functions vs. emergency response after 5 years.
  *   **Verdict Condition:** If the "reset" department returns to pre-reset staffing levels and functions within 5 years, Abolition wins on institutional inertia. If the specialized units remain strictly scoped and the main department shrinks, Reform wins on internal containment.

  ### Crux 3: The Scoreboard (User Idea: Scoreboard)
  **The Dispute:** Reform measures success by reported crime rates and clearance rates. Abolition measures success by "total harm," which includes harm done by police (incarceration, use of force, psychological trauma) plus interpersonal harm.
  **The Prediction:**
  *   **Reform predicts:** Focusing on "total harm" will obscure spikes in violent crime because state harm is constant while interpersonal violence is volatile.
  *   **Abolition predicts:** Focusing only on crime rates incentivizes over-policing (more stops = more reported crime) and ignores the harm caused by enforcement itself.
  **The Concrete Test:**
  *   **Case:** A pilot district where budget is tied to a composite metric: (Violent Crime Reports + Use of Force Incidents + Jail Admissions).
  *   **Metric:** Year-over-year budget adjustment based on the composite score.
  *   **Verdict Condition:** If the composite metric leads to under-policing of violent crime spikes (clearance rates drop significantly), Reform wins on public safety. If the composite metric reduces overall community trauma without increasing violent crime, Abolition wins on harm reduction.

  ### Verbal Disputes Identified
  *   **"Police":** Reform uses this to mean *the institution currently employed by the city*. Abolition uses this to mean *the function of social control via threat of force*. When Abolition says "abolish police," Reform hears "delete the department tomorrow." When Reform says "keep police," Abolition hears "maintain the function of social control."
  *   **"Violence":** Reform defines violence as *interpersonal physical harm*. Abolition defines violence as *interpersonal harm + structural coercion*. This causes the Scoreboard dispute.
  *   **"State":** Reform views the State as a neutral tool that can be wielded well or poorly. Abolition views the State as inherently coercive. This drives the Duty-Bearer dispute.

  ## IV. PHILOSOPHER'S NOTE & CRITIQUE
  *Authored by the Facilitator*

  **On Your Framing:**
  You asked me to fix or reject three ideas. Here is my assessment:
  1.  **Duty-to-Answer:** This is real, not junk. It is the strongest philosophical argument Reform has. Abolitionists often gloss over who takes the call at 3am when the community network is asleep or fractured. I kept this as Crux 1.
  2.  **Residual Tier:** This is real, but your framing risks siding with Reform. You asked if the disagreement is just about "how big" the tier is. I argue it is about *institutional identity*. A small police department behaves like a police department (culture, unions, lobbying). A small emergency response unit might not. I framed Crux 2 to capture this institutional inertia.
  3.  **Scoreboard:** This is real, but likely unresolvable politically. Reformers cannot run on "total harm" because voters punish spikes in violent crime regardless of police harm. I kept it as a test, but note that it requires political courage neither side currently has.

  **Where I Lean (Bias Disclosure):**
  Despite my effort to remain neutral, this document leans slightly toward the **Reform** position in the "Agreed Claims" section, specifically Claim #5 (The Residual Coercion Problem). By stating that *every* proposal acknowledges a need for coercive intervention, I have implicitly accepted the Reform premise that the State must hold a monopoly on force. A hardline abolitionist might argue that even this residual tier should be non-state, though they rarely offer a concrete mechanism for armed response without a state actor. I flagged this in the Disagreements Table under "Duty to Answer," but the structure of the document assumes a municipal budget context, which inherently privileges state solutions.

  **Where You Are Wrong:**
  You assumed the two sides are arguing about the same object. They are not. Reform is arguing about **management** (how do we run this department better?). Abolition is arguing about **ontology** (what is this thing, and should it exist?). This document forces them to agree on management claims (Section I) while isolating the ontological disputes (Section II). This is necessary for a budget fight, but do not mistake this agreement for philosophical reconciliation. They still disagree on what "safety" is.

  **Final Recommendation:**
  Do not try to resolve the ontological dispute in a budget cycle. Use the **Scoreboard (Crux 3)** to set the budget metrics for the next three years. If the composite metric (Crime + Force + Jail) improves, continue the shift. If violent crime spikes without a reduction in force, revert to Reform priorities. This makes the philosophy empirical rather than theological.
