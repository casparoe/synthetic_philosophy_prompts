answer: |-
  The conceptual tension arises from a conflict between procedural rationality and empirical vulnerability. To understand this, one must first locate the role of auxiliary hypotheses within the logic of falsification. In a standard deductive test, a theoretical core combined with initial conditions and auxiliary assumptions yields a prediction. If the prediction fails, logic dictates that at least one premise is false. Popper's criterion demands that scientists do not protect the theoretical core by manipulating auxiliary assumptions in an *ad hoc* manner—defined specifically as adjustments that rescue the theory without generating new, independent testable consequences.

  The scenario you propose introduces a sophisticated middle ground: a research framework that responds to anomalies not through arbitrary, *ad hoc* patches, but through formally codified, rule-governed protocols for revising the auxiliary belt. These protocols possess internal consistency, logical rigor, and perhaps even a generative capacity to absorb anomalies. On the surface, this appears to satisfy the demand for rationality better than arbitrary immunization. However, a deep tension emerges when assessing whether this procedural rigor translates into genuine empirical risk for the theoretical core.

  The precise conceptual point at which methodological rigor fails to secure genuine empirical risk is the **decoupling of procedural correctness from the falsifiability of the hard core.**

  In this scenario, the "risk" of the enterprise shifts from the truth-value of the central theory to the successful application of the revision protocol. As long as the researchers follow the codified rules for adjusting auxiliary hypotheses, the methodology is deemed sound. However, if the rules of revision are sufficiently flexible or expansive, they can accommodate any empirical outcome without ever forcing a logical confrontation that threatens the theoretical core itself. The system becomes self-correcting regarding its own internal structure, but empirically inert regarding its central claims. The failure of empirical risk occurs because the *conditions for theory retention* are satisfied by *compliance with the revision protocol*, rather than by the *survival of a risky prediction*. The theory is not being tested; the protocol is being exercised.

  This creates a specific epistemic gap. Popper's falsificationism requires that the theoretical core be the ultimate bearer of risk. In the protocol-driven case, the auxiliary belt acts as a shock absorber that is mechanically regulated. While the adjustments are not *ad hoc* in the sense of being arbitrary or stipulative for the single occasion, they function as a **systematic immunization strategy**. If the protocol allows for the continuous modification of auxiliaries to align with data without ever increasing the testability of the core, the core remains insulated. The rigor is real, but it is a rigor of preservation, not a rigor of exposure.

  To distinguish this from **straightforward empirical falsification**, one must look at the termination condition of the inquiry. In straightforward falsification, a decisive counter-instance leads to the rejection of the theory (or at least its problematic formulation). The logical trajectory is terminal: Anomaly $\rightarrow$ Falsification $\rightarrow$ Rejection. In the protocol-driven case, the trajectory is recursive: Anomaly $\rightarrow$ Protocol Activation $\rightarrow$ Auxiliary Revision $\rightarrow$ Retention. The distinction lies in the locus of the "no" delivered by nature. In straightforward falsification, the "no" attaches to the theory. In the protocol case, the "no" is translated into an instruction to modify the protective belt. The theoretical core never hears the "no" directly; it only receives a revised set of operating parameters. Consequently, the core is never logically compelled to fall, rendering the falsifiability criterion moot with respect to the central claim.

  To distinguish this from **explicit conventionalist defense**, one must examine the source of immunity. Explicit conventionalism posits that theories are true by definition or agreement; empirical data is interpreted to fit the definition. It is a stipulative immunity: "We define the world such that this theory holds." The protocol-driven case differs because it does not rely on stipulation. It relies on derivation. It acknowledges the anomaly and engages in a complex, rule-bound derivation to resolve it. It claims objectivity through the strictness of its rules, not through linguistic fiat.

  However, the tension remains because this **structural conventionalism** achieves the same result as explicit conventionalism—theoretical immunity—through different means. Explicit conventionalism says, "The theory cannot be wrong." The protocol-driven approach says, "The theory need not be wrong because we have a valid method to adjust the context." The latter is more insidious because it mimics the language of scientific method (rules, protocols, revisions) while potentially evacuating the content of empirical risk. It substitutes the *risk of being wrong* with the *difficulty of being consistent*.

  Ultimately, the conceptual tension rests on the definition of what constitutes a "test." For Popper, a test requires the possibility of elimination. In the protocol-driven scenario, the possibility of elimination is structurally deferred. The methodological rigor secures the *continuity* of the research program, but it does not secure the *vulnerability* of the theory. Unless the codified protocols include a stopping rule that mandates the abandonment of the core when the auxiliary belt reaches a limit of complexity or when independent testability ceases to increase, the system remains a closed loop of self-preservation. It is a machine designed to process anomalies, not necessarily to truth-track. Thus, the rigor is methodological, but the epistemology remains insulated.
