answer: |-
  # Workshop Design: The Ontology of the Office
  **Duration:** 90 Minutes
  **Participants:** 16 Advanced Undergraduates
  **Materials:** 48 Scenario Cards (3 sets of 16), 64 Access Tokens (paper chits), 64 Reputation Chips (distinct colors), 4 "Constitution" Envelopes, Whiteboard.

  ## Core Concept
  Corruption is not an intrinsic property of an act (e.g., "giving a gift"). It is a classification derived from the *ontology of the office* (what the official role *is*). If the office is a vessel of public law, personal infusion is pollution. If the office is a node in a kinship web, personal detachment is abandonment. This workshop forces students to manage resources under conflicting ontologies until the system breaks.

  ---

  ## Part 1: The Blind Classification (15 Minutes)

  **Setup:**
  Divide the 16 students into 4 Groups of 4 (Tables 1–4). Distribute **Set A Scenario Cards** (5 cards per group). These cards describe exchanges without context.

  **The 5 Scenarios:**
  1.  **The Meal:** An official accepts a home-cooked meal from an applicant before reviewing a permit.
  2.  **The Kin-Hire:** An official hires a qualified cousin over a stranger of equal qualification.
  3.  **The Funeral:** An official leaves the desk during work hours to attend a constituent's family funeral.
  4.  **The Gratitude:** An official accepts a handmade basket after successfully processing a routine claim.
  5.  **The Call:** An official uses a personal phone to call a doctor for a sick constituent who lacks transport.

  **Task:**
  Each group must classify each act as **CLEAN** (Permissible) or **CORRUPT** (Deviant). They must reach consensus.
  *   *Constraint:* They cannot ask "why." They must vote based on instinct.
  *   *Record:* Write the tally on the whiteboard (e.g., Scenario 1: 3 Clean, 1 Corrupt).

  **Expected Outcome:**
  Most groups will lean toward a Western bureaucratic intuition. "The Meal" and "The Kin-Hire" will likely be marked Corrupt. "The Funeral" might be split.

  ---

  ## Part 2: Ontology Reveal & Rule Assignment (15 Minutes)

  **Setup:**
  Distribute **Constitution Envelopes** to the tables. This reveals the "World" they are actually inhabiting. The rules for earning **Reputation Chips (RP)** change instantly.

  *   **Table 1 & 2 (The Bureau):**
      *   *Ontology:* The Office is a Vessel of Public Law. The private self must be excluded to prevent pollution.
      *   *Rule:* Gain 2 RP for every **Impersonal** act (following queue, ignoring kinship, refusing gifts). Lose 2 RP for every **Personal** act (accepting gifts, favoring kin, socializing).
      *   *Goal:* Maximize RP to keep your job.

  *   **Table 3 (The Community):**
      *   *Ontology:* The Office is a Node in a Social Web. The role exists only to sustain trust and mutual obligation.
      *   *Rule:* Gain 2 RP for every **Personal** act (feeding applicants, hiring kin, attending funerals). Lose 2 RP for every **Impersonal** act (refusing gifts, treating kin like strangers, ignoring social rites). *Note: In this frame, refusing a gift is an act of aggression.*
      *   *Goal:* Maximize RP to maintain social standing (without which you have no power).

  *   **Table 4 (The Interface):**
      *   *Ontology:* The Hybrid Zone. You serve the Bureau but live in the Community.
      *   *Rule:* You must satisfy *both* Table 1/2 and Table 3 to gain RP. If you satisfy one but offend the other, you gain 0 RP.
      *   *Goal:* Survival.

  **Resource Injection:**
  Give every player 3 **Access Tokens (AT)**. These represent the ability to get things done (medicine, permits).
  *   To keep your job (Bureau), you need 5 RP.
  *   To keep your status (Community), you need 5 RP.

  ---

  ## Part 3: The Simulation (30 Minutes)

  **Task:**
  Distribute **Set B Scenario Cards** (10 cards per group). These are variations of the first 5, but now they have consequences.
  *   *Example:* "Applicant offers Meal. If you accept, they get AT. If you refuse, they leave angry."

  **Mechanism:**
  1.  Groups draw a card.
  2.  They must choose: **ACCEPT** (Personal) or **REFUSE** (Impersonal).
  3.  Based on their Constitution, they calculate RP gains/losses.
  4.  **Trading:** Tables 1, 2, and 3 can trade Access Tokens. Table 4 facilitates trade but takes a fee (1 AT).

  **The Twist (Minute 45):**
  Announce a **System Shock**.
  *   *Event:* "A flood has damaged the records. The Bureau cannot verify qualifications. The Community is desperate for aid."
  *   *New Rule:* Access Tokens are now scarce. Only 10 AT exist in the whole room.
  *   *Bureau Rule:* AT must be distributed by Lottery (Impersonal).
  *   *Community Rule:* AT must be distributed by Need/Kin (Personal).
  *   *Interface Rule:* You must distribute AT in a way that satisfies both.

  **Action:**
  Groups must decide how to distribute the remaining AT. They must spend RP to enforce their distribution method.
  *   Table 1 & 2 will try to enforce Lottery.
  *   Table 3 will try to enforce Need.
  *   Table 4 will try to negotiate.

  **Observation:**
  Watch Table 4 closely. They will likely run out of RP or AT first. Watch Tables 1 & 2 label Table 3 as "Corrupt." Watch Table 3 label Tables 1 & 2 as "Inhumane."

  ---

  ## Part 4: The Forced Choice (15 Minutes)

  **Setup:**
  Freeze the simulation. All groups have low RP.
  Present the **Final Crisis Card**:
  *"A high-ranking Bureau Auditor (Table 1) is sick. The only doctor who can treat him is the cousin of a Community Leader (Table 3). The Community Leader will only call the doctor if the Bureau grants a permit to the Leader's nephew (Kin-Hire). The Bureau rules forbid Kin-Hire."*

  **Task:**
  Each group must cast a secret vote on how to resolve this.
  1.  **Grant Permit:** Saves the Auditor (Life), Violates Bureau Ontology (Corruption).
  2.  **Refuse Permit:** Upholds Bureau Ontology (Purity), Auditor dies (Social/Moral Failure).

  **Reveal:**
  Reveal votes.
  *   Tables 1 & 2 will likely struggle but lean toward Refuse (Rule of Law).
  *   Table 3 will vote Grant (Life/Trust).
  *   Table 4 will be paralyzed.

  **Scoring:**
  *   If majority votes **Grant**: Table 1 & 2 lose all RP (Office Polluted). Table 3 gains RP.
  *   If majority votes **Refuse**: Table 3 loses all RP (Social Trust Broken). Table 1 & 2 gain RP.
  *   Table 4 loses RP regardless (Failed Translation).

  ---

  ## Part 5: Debrief & Philosophical Mapping (15 Minutes)

  **1. Map the Inversion (5 mins):**
  Ask Table 1 and Table 3 to compare their Round 1 (Blind) votes with their Round 2 (Constitution) outcomes.
  *   *Point to make:* "In Round 1, you likely agreed that 'Kin-Hire' is corrupt. In Round 2, Table 3 found that *refusing* the hire was the deviant act. The act did not change. The *being* of the office changed. In the Bureau, the office is a machine; oil (personal connection) gums the gears. In the Community, the office is a body; oil (personal connection) keeps it alive."

  **2. Predict the Failure Mode (5 mins):**
  *   *Instructor Script:* "I predict that during the simulation, Tables 1 and 2 treated Table 3's behavior as a 'cultural exception' to the universal rule of bureaucracy. You likely thought, 'They are playing a different game,' rather than 'They are inhabiting a different reality.' This is the error of universalizing the Weberian frame. You assumed your ontology was the neutral background, and theirs was the deviation. But in this game, your ontology was just another set of rules on a card."

  **3. The Limitation (5 mins):**
  *   *Instructor Script:* "There is one feature of reality this game cannot reproduce, which I must supply verbally. In this room, *I* am the game master. I hold the meta-frame. I decide when the rounds start and stop. I hold the score. This creates a 'God's eye view' that does not exist in the real world.
  *   In reality, there is no neutral meta-frame. There is no outside position from which to adjudicate between the Bureau and the Community. When you leave this room, you cannot simply say 'both are valid.' You will have to act. If you act, you pollute one ontology to save another. This game lets you see the collision, but it cannot relieve you of the burden of choosing without a neutral ground. That burden is the actual work of moral philosophy."

  ---

  ## Facilitator Notes: Anticipating Friction

  **1. The "Cultural Exception" Collapse:**
  *   *Risk:* Students in Table 1 will dismiss Table 3's rules as "just culture" while viewing their own rules as "professionalism."
  *   *Intervention:* During Part 3, explicitly remind Table 1: "Your Constitution Card is just as cultural as theirs. 'Impersonality' is a specific cultural technology, not a default state of nature."

  **2. Resource Hoarding:**
  *   *Risk:* Students might try to game the token economy rather than engage the moral dilemma.
  *   *Intervention:* If they focus too much on trading math, freeze the game. Ask: "You are trading tokens, but you are losing Reputation. What happens to an Official with Tokens but no Reputation?" (Answer: In Bureau, they are fired. In Community, they are ostracized.)

  **3. The Hybrid Paralysis:**
  *   *Risk:* Table 4 may disengage because the task is impossible.
  *   *Intervention:* This is a feature, not a bug. Highlight their paralysis during the debrief. "Table 4 represents the actual position of the development worker or the comparative ethicist. You are asked to translate between incommensurable ontologies. Your failure is the data."

  ## Materials Checklist (Self-Contained)

  *   **20 Scenario Cards (Set A):** 5 scenarios x 4 copies. Text only.
  *   **40 Scenario Cards (Set B):** 10 variations x 4 copies. Include RP consequences.
  *   **4 Constitution Envelopes:** Containing the Rule Sets for Bureau, Community, and Interface.
  *   **128 Paper Chits:** 64 marked "AT" (Access), 64 marked "RP" (Reputation). Use two different colors of paper if possible.
  *   **Whiteboard:** To track global RP totals.

  ## Instructor's Closing Statement (For the "Limitation" Section)
  "We used tokens to make the trade-offs visible. But in the real world, the currency is not paper; it is trust, legitimacy, and sometimes life. The game ends when I say it ends. In the field, the game does not end. You cannot put down the tokens. You are always already inside one of these ontologies, usually the bureaucratic one, judging the others. The goal of this workshop was not to solve the problem, but to make you feel the weight of the frame you are standing on."
