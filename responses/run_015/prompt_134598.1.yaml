      *   *Crisis:* A epidemic/shortage. Need to distribute 5 Access Tokens.
      *   *Bureau:* Must distribute by lottery/queue (Impersonal).
      *   *Community:* Must distribute by need/kinship (Personal).
      *   *Hybrid:* Must satisfy both or lose status.
