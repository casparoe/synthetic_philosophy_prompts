  **Bottom line**
  My credence that strict epiphenomenalism, as defined, is true is 0.23.

  **Decomposition**
  Causal closure (0.85): Empirical science finds no physical events lacking physical causes; violating this requires rejecting standard physics and neuroscience models, though quantum indeterminacy leaves minor wiggle room for libertarians. This constrains the view by forcing mental causation to be either identical to physical causation or entirely excluded from the physical chain.
  Phenomenal non-identity (0.80): Qualia resist functional or physical reduction; the explanatory gap suggests they are distinct properties, though physicalists argue this is merely conceptual confusion. This is a prerequisite for epiphenomenalism; if identity holds, epiphenomenalism is false by definition.
  Exclusion via closure (0.75): If qualia aren't physical states, causal closure forces them out of the chain unless one accepts systematic overdetermination, which is theoretically costly and generally rejected. This term links closure and non-identity to the inertness claim, ruling out compatible causation.
  Paradox resolution capacity (0.40): Most attempts to save warrant fail; brute correlation preserves truth-tracking but severs the explanatory link required for standard knowledge accounts, making this the weakest link. This prices the likelihood that the paradox of judgment can be answered without causal contact.
  Plain unreliability (0.50): Without causal input, judgments track truth only via common cause, making introspective confidence appear unjustified despite being true, which undermines first-person authority. This assesses the specific cost of losing causal tracking for reliability claims.
  Brute correlation cost (0.45): Lawlike psychophysical bridges are explanatorily brute; accepting them is the price of entry, which many find too high for a complete theory of mind and knowledge. This prices the metaphysical tolerance for unexplained nomic connections between distinct properties.
  Propagation discount factor (0.90): The physical etiology of the belief explains its existence but does not rehabilitate the severed justificatory connection to the experience itself, offering minimal rescue. This assesses whether the self-undermining objection propagates to defeat the theorist's own warrant.

  **How they combine**
  These probabilities function as a multiplicative chain where metaphysical prerequisites filter into epistemic viability. Closure and non-identity establish the possibility space (approx. 0.54 base), but the Paradox terms act as a severe tax on this base. Because the paradox attacks the epistemic warrant required to assert the view, the resolution probability multiplies directly against the metaphysical probability. The propagation discount is minor because the core issue is warrant, not etiology. The final product reflects the high cost of accepting brute correlations while maintaining knowledge claims.

  **Sensitivity**
  The Paradox resolution capacity (0.40) is the critical variable. Shifting this by 0.2 changes the final credence by roughly 0.13, whereas shifting Closure by 0.2 changes it by only 0.05. You and Sam likely agree on Closure; the divergence arises entirely from how much explanatory cost you assign to brute psychophysical laws. This term is the bottleneck for the entire view.

  **The dead-end readout and demonstrative fixity**
  The dead-end readout makes epiphenomenalism empirically clearer but doesn't fully solve the warrant problem; it clarifies the common cause, making the brute law less mysterious but not less brute. It boosts credence slightly because it removes "magic" from the correlation, but the paradox bites less only if you accept common-cause tracking as sufficient for knowledge. Do the effects cancel? No. Discovering N increases the probability of the metaphysical view (mechanism found) more than it solves the epistemic view (warrant still brute). Demonstrative fixity relies on non-causal acquaintance carrying warrant; conditional on epiphenomenalism, I assign this 0.15. It is likely relabeling the mystery: how does a non-causal relation justify a belief? Without a causal chain, acquaintance looks like another brute law, failing to escape the paradox's core demand for reliable tracking mechanisms. If acquaintance warrants belief without causation, the paradox premise fails, but acquaintance itself is metaphysically obscure and rarely accepted in naturalized epistemology.

  **Where the disagreement probably lives**
  Your 0.55 and Sam's 0.12 diverge primarily on the cost of brute correlation. You treat the lawlike connection via the physical base as a sufficient answer to the paradox, effectively pricing the Paradox resolution term near 0.8. Sam treats the lack of causal influence as a defeater for warrant, pricing that term near 0.2. The fault line isn't Closure, which you both accept, but whether epistemic warrant requires causal history or merely counterfactual dependence. You are more willing to accept explanatory bruteness than Sam is.

  **Settled vs contested**
  Causal closure is methodologically settled in science but metaphysically contested by libertarians and dualists. Non-identity is the core dispute between physicalists and property dualists; no consensus exists. The paradox of phenomenal judgment is genuinely contested; there is no majority view on whether brute correlation defeats warrant. Some argue it's fatal (Frankish, Dennett), others that it's acceptable (Chalmers). The question bottoms out in verbal disputes about the definition of "knowledge" and "causation," specifically whether counterfactual dependence suffices for justification without causal flow.
