  10. **Refining the Principle:**
      *   Let's call it **The Mechanism of Dissolution Constraint.**
      *   Rule 1: Classify by *how it ends*, not *what it does*.
      *   Rule 2: If the cohesion mechanism changes, the class changes (saves Case 4).
      *   Rule 3: If the entity is a hybrid, the forecast is a weighted mixture of dissolution risks (saves Case 3).

