  12. **Final Polish:** Ensure the voice sounds like someone who thinks about *thinking*, not just calculating. (e.g., "The ontology of the thing determines the statistics available to it.")

  *(Self-Correction during final review)*: Make sure I don't just validate the user. I need to challenge them where the principle exposes a flaw. Case 1 is the most vulnerable because "Hegemony" is ill-defined compared to "Regime Type." Case 3's weighting is arbitrary. I will highlight these.

