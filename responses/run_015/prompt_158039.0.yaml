  It is completely understandable that you feel like you are decoding a hidden algorithm because philosophy of biology often revolves around these exact boundary disputes, and your professor sounds like she is adhering to a specific framework rather than winging it based on intuition. Based on the track record you have provided, I am fairly confident that she is operating under an autopoiesis or metabolic-closure rule rather than a genetic-information or heredity rule, and consequently, I predict she will rule that the hypothetical protocell is alive. The key to seeing this lies in how she handles the outliers, specifically the viruses and the mitochondria, because those two cases do the heavy lifting in distinguishing between the two major camps of thought you are considering. If she were running a strict heredity rule, viruses would be the hardest case to exclude since they possess genomes and undergo evolution, yet she marked them as not alive, which suggests that genetic material alone is insufficient for her definition. Conversely, the metabolic-closure view excludes viruses easily because they lack independent metabolism and cannot maintain their own boundaries, which aligns perfectly with her verdict. The mitochondria case is even more telling because mitochondria cannot actually survive or reproduce on their own outside a host cell, so if she is calling them alive on their own, she is prioritizing the presence of the metabolic machinery and the organizational boundary over independent reproductive viability, which is a hallmark of the autopoietic perspective that values the self-maintaining organization over the historical lineage.

  The tardigrade in cryptobiosis is the other crucial data point that might seem confusing at first but actually supports the metabolic-closure view when you understand how those theorists define life. A strict active-metabolism rule would have to classify the dormant tardigrade as dead since there is zero detectable metabolism, but autopoiesis theorists distinguish between the processes of living and the organization of the living system, arguing that the organizational closure persists even if the metabolic flux pauses temporarily, allowing them to classify the cryptobiotic tardigrade as alive without contradicting their core principle. This fits her pattern much better than a heredity rule would, because while the heredity rule also says the tardigrade is alive due to its DNA, it struggles to explain why the virus with its DNA is dead unless it smuggles in a metabolic requirement anyway. When you apply this logic to the upcoming protocell case, the metabolic-closure rule dictates that because the vesicle maintains its own ion gradients and rebuilds its membrane proteins, it achieves organizational closure and self-maintenance, which is sufficient for life even without DNA or evolutionary ancestors, whereas the heredity rule would require a replicating genome and a lineage, forcing a verdict of not alive. Given her consistency on the mitochondria and viruses, I believe she values the functional organization of the system over its historical or genetic continuity, so she will likely call the protocell alive.

  To really cement this and distinguish the two rules beyond any doubt, your idea of a naked genome floating in nutrients is a strong start, but we can sharpen it slightly to ensure it isolates the variables perfectly. The sharpest further case would be a self-replicating RNA system in an open solution that evolves Darwinianly but lacks any lipid boundary or metabolic containment, essentially a naked heredity system without the closure. If she rules the protocell as alive and this naked replicator as not alive, it confirms that metabolic boundary and self-maintenance are the necessary and sufficient conditions for her definition, effectively ruling out the heredity hypothesis which would struggle to exclude the evolving RNA system. The naked genome case you suggested works similarly since it possesses the information but lacks the boundary and metabolism, and given she already ruled viruses as not alive, she should logically rule the naked genome as not alive too, which would further corroborate that information without self-maintenance is dead matter in her view. Ultimately, her decision tree seems to prioritize the here-and-now organizational integrity of the entity over its capacity to evolve or its historical pedigree, so you should expect her to welcome the protocell into the category of the living despite its lack of DNA, and if you want to test her further, presenting her with a purely digital or chemical replicator that lacks a physical boundary should yield a negative verdict that locks in the autopoiesis framework as her guiding principle.
