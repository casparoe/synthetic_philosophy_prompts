prompt: |-
  So me and my partner just took over her dads tiny farm in Ohio, six outdoor trout raceways and four indoor shrimp tanks, and I somehow got voluntold to be the welfare guy even though my background is auto repair not fish.

  I need something I can actually run every morning before feeding, like a decision procedure or checklist that turns all that fish and shrimp sentience and welfare stuff into steps a non-expert can follow. It should tell me what to check in what order, what counts as good enough to move on, when to stop with a straight no this is not okay, and when to kick it up to the vet or to us as owners becuase its really a values call not a facts call.

  Some constraints: I have like 15-20 minutes per raceway or tank max, mornings are chaos, my crew is me plus two part timers with zero biology training, our vet only comes once a month to sign off unless theres an emergency, and the stakes are dead or stressed animals plus losing money if we get it wrong.

  Can you build that for trout and for whiteleg shrimp seperately where they differ, keep what actually matters for welfare but drop the super technical stuff we cant measure, and be honest about where the checklist will misfire or need human judgment.

  Then run it on three real calls I am facing right now:

  1. crowding trout tight in a grading net for 5-6 hours becuase we are short staffed, they go off feed for a day after but it saves us hiring extra help
  2. our electric stunner broke and the replacement is 3 weeks out, so going back to ice slurry for harvest in the meantime
  3. keeping berried shrimp females in bare bright tanks with lights on 24/7 to push more larvae, we get more babies but the females lose antennae and die younger

  Include at least one where the procedure tells me something I am not gonna like, like I have to spend money or stop doing the easy thing, and end with what the procedure cannot do no matter how good it is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** New farm owner/operator (background in auto repair, not biology) taking over a small Ohio farm (6 trout raceways, 4 indoor shrimp tanks).
      *   **Role:** "Welfare Guy" (voluntold).
      *   **Need:** A practical, morning decision procedure/checklist for animal welfare.
      *   **Constraints:** 15-20 mins per unit, mornings are chaotic, crew has zero bio training, vet visits monthly (unless emergency), stakes are high (death/stress/money).
      *   **Specifics:** Separate procedures for Trout and Shrimp (where they differ). Focus on actionable steps, "good enough" vs. "stop," and escalation paths (vet vs. owner values).
      *   **Task:** Build the checklist *and* run it on three specific ethical/operational dilemmas provided by the user.
      *   **Requirement:** Include at least one "hard truth" (spend money/stop easy thing) and acknowledge the limitations of the procedure.

  2.  **Deconstruct the Welfare Challenge:**
      *   *Trout:* Vertebrates, feel pain, sensitive to oxygen, temperature, ammonia, crowding, handling stress.
      *   *Shrimp:* Invertebrates, welfare science is newer/less defined, sensitive to water quality, light cycles, molting issues, cannibalism.
      *   *Commonalities:* Water quality is king, behavior indicates health, mortality is the ultimate failure metric.
      *   *User Constraint:* "Auto repair" background means they understand systems, diagnostics, and maintenance. I should frame this like a pre-flight check or a mechanic's diagnostic tree.

  3.  **Drafting the Checklist (The "Morning Diagnostic"):**
      *   *Structure:* Needs to be linear, fast, and binary (Pass/Fail/escalate).
      *   *Time:* 15-20 mins per unit.
      *   *Steps:*
          1.  **Environment (The "Engine"):** Water params (O2, Temp, Flow). If this fails, nothing else matters.
          2.  **Behavior (The "Idle Test"):** Are they moving/eating normally?
          3.  **Physical (The "Body Check"):** Visible injuries, disease signs.
          4.  **Decision:** Feed, Fix, or Call.
      *   *Differentiation:* Trout need oxygen/flow emphasis. Shrimp need light/substrate/molting emphasis.

  4.  **Developing the Escalation Matrix:**
      *   *Green:* Go ahead.
      *   *Yellow:* Monitor/Adjust (Crew can do).
      *   *Red:* Stop/Call Vet (Immediate).
      *   *Blue:* Owner Values Call (Ethical/Economic trade-off).

  5.  **Running the Scenarios (The "Stress Test"):**
      *   *Scenario 1: Crowding Trout (5-6 hours).*
          *   *Welfare Impact:* High stress, oxygen depletion, injury risk.
          *   *Checklist Verdict:* Likely a "Red" or "Blue." 5-6 hours is excessive for grading.
          *   *Hard Truth:* Need to hire help or grade faster.
      *   *Scenario 2: Ice Slurry vs. Electric Stunner.*
          *   *Welfare Impact:* Ice slurry is slow death (suffocation/thermal shock) vs. instant stun.
          *   *Checklist Verdict:* "Red" on welfare, but common practice. Needs owner values call.
          *   *Hard Truth:* This is a reputation and ethics risk.
      *   *Scenario 3: Shrimp Light/Bare Tanks.*
          *   *Welfare Impact:* Cannibalism (antennae loss), stress, shortened lifespan.
          *   *Checklist Verdict:* "Blue" (Values call). Production vs. Longevity.
          *   *Hard Truth:* High mortality costs money long term.

  6.  **Refining the Tone:**
      *   Direct, no-nonsense, "mechanic-to-mechanic."
      *   Acknowledge the difficulty.
      *   Be honest about where the checklist fails (it can't make ethical choices for them).

  7.  **Drafting Content - Section by Section:**

      *   *Intro:* Acknowledge the shift from cars to fish. Systems are systems.
      *   *The Trout Protocol:* Focus on O2, Flow, Fins, Feeding.
      *   *The Shrimp Protocol:* Focus on Water, Light, Molting, Cannibalism.
      *   *The Traffic Light System:* Define Green/Yellow/Red/Blue.
      *   *Running the Scenarios:* Apply the logic rigorously.
      *   *The "Hard Truth":* Ensure one scenario explicitly costs money. (Scenario 1 is the best candidate for "hire help").
      *   *Limitations:* What can't a checklist do? (Ethics, long-term trends, invisible disease).

  8.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is 15-20 mins realistic?
      *   *Fix:* Emphasize that water testing might be automated or spot-checked. Don't ask them to lab-test every morning. Visual checks + spot O2.
      *   *Critique:* Shrimp welfare is controversial.
      *   *Fix:* Acknowledge the science is emerging but focus on observable stress (antennae loss = bad).
      *   *Critique:* Did I answer the specific prompt requirements?
      *   *Check:* Separate lists? Yes. 3 Scenarios run? Yes. Hard truth included? Yes. Limitations stated? Yes.
      *   *Tone Check:* Is it too academic? Need to make it sound like a shop manual. Use terms like "Redline," "Idle," "Diagnostic."

  9.  **Final Polish:**
      *   Make the "Blue" category distinct (Owner Values).
      *   Ensure the "Ice Slurry" issue is handled carefully (it's legal but welfare-compromised).
      *   Ensure the "Crowding" issue highlights the oxygen risk.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a systems problem, not a biology problem. You know engines: if the oil pressure is low, the RPMs are weird, and there's smoke coming out, you don't keep driving. Fish and shrimp are just biological engines. If the input (water) is bad or the engine is knocking (behavior), they stall (die).

  Since you have 15–20 minutes per unit and a crew with zero bio training, we cannot rely on "gut feeling." We need a **Pre-Flight Diagnostic**.

  Here is your Morning Welfare Procedure. It is designed to be printed, laminated, and clipped to a clipboard.

  ### The Traffic Light System
  Before you start, your crew needs to know what the lights mean:
  *   **🟢 GREEN:** Parameters normal. Behavior normal. **Action:** Feed and move on.
  *   **🟡 YELLOW:** One parameter off, or minor behavior change. **Action:** Adjust environment (flow/temp), reduce feed by 50%, re-check in 4 hours. Log it.
  *   **🔴 RED:** Critical failure. **Action:** Stop feeding. Aerate max. Call Vet/Emergency contact immediately.
  *   **🔵 BLUE:** The "Values Call." The animals are alive, but the *way* we are keeping them is questionable. **Action:** Stop. Owners (you and partner) must decide. This is where money meets ethics.

  ---

  ### Part 1: Trout Raceway Diagnostic (Vertebrate)
  *Time limit: 15 mins per raceway*
  *Focus: Oxygen, Flow, Fins, Frenzy*

  **Step 1: The Intake (Water Quality)**
  *   **Dissolved Oxygen (DO):** Check probe.
      *   *Pass:* > 8.0 mg/L (Cold water needs high O2).
      *   *Fail:* < 6.0 mg/L. **(🔴 RED)**
  *   **Flow Rate:** Visual check. Is the water turning over visibly?
      *   *Pass:* Surface is rippling, waste is moving to drain.
      *   *Fail:* Stagnant corners, waste piling up. **(🟡 YELLOW)**
  *   **Temp:** Check thermometer.
      *   *Pass:* Within 2°F of yesterday's reading.
      *   *Fail:* Spike or drop > 3°F. **(🟡 YELLOW)**

  **Step 2: The Idle (Behavior)**
  *   **Positioning:** Look at the fish.
      *   *Pass:* Facing current, distributed evenly.
      *   *Fail:* "Piping" (gasping at surface), hanging near drain, or schooling tightly in one corner. **(🔴 RED)**
  *   **Response:** Tap the side of the raceway or walk by.
      *   *Pass:* Startle response, then settle.
      *   *Fail:* No response (lethargic) or frantic thrashing (panic). **(🔴 RED)**

  **Step 3: The Body Check (Physical)**
  *   **Fins/Scales:** Scan for white spots, frayed fins, or bloody patches.
      *   *Pass:* Clean fins, silver/bright skin.
      *   *Fail:* >5% of visible fish have sores or fungus. **(🟡 YELLOW)** -> If bleeding/open wounds, **(🔴 RED)**.
  *   **Mortality:** Count dead fish in the trap.
      *   *Pass:* < 5 fish/day (adjust for your stock size).
      *   *Fail:* Sudden spike (e.g., 20+). **(🔴 RED)**

  **Decision:**
  *   All Green? **Feed.**
  *   Any Yellow? **Half Feed, Log Issue.**
  *   Any Red? **No Feed, Call Vet.**
  *   Blue Flag? (See Scenarios below). **Call Owners.**

  ---

  ### Part 2: Shrimp Tank Diagnostic (Invertebrate)
  *Time limit: 20 mins per tank*
  *Focus: Water, Light, Molting, Cannibalism*
  *Note: Shrimp welfare science is newer. We focus on survival metrics that indicate stress.*

  **Step 1: The Intake (Water Quality)**
  *   **Salinity/Temp:** Check against log.
      *   *Pass:* Stable.
      *   *Fail:* Fluctuation. Shrimp hate change more than bad numbers. **(🟡 YELLOW)**
  *   **Ammonia/Nitrite:** Spot test kit (do this every other day, rotate tanks).
      *   *Pass:* 0 ppm.
      *   *Fail:* Detectable. **(🔴 RED)**

  **Step 2: The Idle (Behavior)**
  *   **Activity:** Look at the bottom.
      *   *Pass:* Walking, feeding, swimming.
      *   *Fail:* Clumping in corners, lethargic on bottom. **(🟡 YELLOW)**
  *   **Light Cycle:** Check timer.
      *   *Pass:* Matches schedule (usually 12h on/12h off or dimmed).
      *   *Fail:* Lights on 24/7 or burnt out. **(🔵 BLUE)**

  **Step 3: The Body Check (Physical)**
  *   **Molting:** Look for shells on the bottom.
      *   *Pass:* Shells intact, shrimp hardening up.
      *   *Fail:* Shrimp stuck in molt (dead in shell). **(🔴 RED)**
  *   **Cannibalism Check:** Look at antennae and tails.
      *   *Pass:* Full antennae, clean tails.
      *   *Fail:* >10% of shrimp missing antennae or have black tail necrosis. **(🔵 BLUE)** *Note: This indicates stress/crowding.*

  **Decision:**
  *   All Green? **Feed.**
  *   Any Yellow? **Reduce Feed, Check Aeration.**
  *   Any Red? **Water Change, Call Vet.**
  *   Blue Flag? **Call Owners.**

  ---

  ### Part 3: Running Your Three Real Calls
  Here is where the checklist meets reality. I have applied the procedure to your specific situations.

  #### Scenario 1: Crowding Trout for Grading (5-6 Hours)
  *The Situation:* You are holding fish in a net at high density to save on labor costs. They stop eating for a day after.
  *The Checklist Run:*
  *   **Oxygen:** In a grading net, flow is restricted. 5-6 hours is a long time for DO to drop below 6.0 mg/L. **(High Risk of 🔴 RED)**
  *   **Behavior:** Crowding causes panic and "stacking" (fish piling on fish). This causes physical abrasion. **(🟡 YELLOW to 🔴 RED)**
  *   **Post-Event:** Going off feed for a day indicates significant physiological stress. Their immune system is down.
  *   **The Verdict:** **🔵 BLUE (Values Call) leaning toward STOP.**
  *   **The Hard Truth:** The checklist flags this as a welfare failure. You are trading animal stress for labor savings. In auto terms, you're redlining the engine to save 10 minutes on a tune-up.
  *   **Action:** You need to hire the help or grade in smaller batches. If you keep doing this, you will get a disease outbreak (Columnaris or similar) because their immune systems are shot. **This will cost you money in the long run.**

  #### Scenario 2: Ice Slurry vs. Electric Stunner
  *The Situation:* Stunner broke. Ice slurry is the backup.
  *The Checklist Run:*
  *   **Method:** Ice slurry kills by thermal shock and suffocation. It takes minutes. Electric stun (if working) is instant unconsciousness.
  *   **Welfare Metric:** Time to insensibility.
  *   **The Verdict:** **🔵 BLUE (Values Call).**
  *   **The Reality:** Legally, ice slurry is often acceptable. Welfare-wise, it is inferior.
  *   **Action:** Since the vet is once a month, this is on you. If you brand yourself as "high welfare," you cannot use ice slurry. If you are a commodity farm, it's standard practice.
  *   **Recommendation:** Do not harvest until the stunner is fixed unless you have a buyer waiting. Holding the fish for 3 weeks costs feed, but harvesting badly costs reputation. **Fix the stunner early or rent one.**

  #### Scenario 3: Shrimp Light & Bare Tanks
  *The Situation:* 24/7 light and bare tanks increase larvae but kill females (antennae loss, early death).
  *The Checklist Run:*
  *   **Light Cycle:** 24/7 light violates the Shrimp Diagnostic (Step 2). **(🔵 BLUE)**
  *   **Cannibalism:** Missing antennae indicates stress and lack of hiding spots during molting. **(🔵 BLUE)**
  *   **Mortality:** Females dying younger means you have to buy/raise more broodstock.
  *   **The Verdict:** **🔵 BLUE (Values Call).**
  *   **The Math:** You are trading broodstock longevity for larval output.
  *   **Action:** This is a production efficiency calculation. However, missing antennae leads to infection.
  *   **Recommendation:** Add PVC pipes or mesh for hiding spots (cheap). Turn lights off for 6 hours (free). If mortality stays high, you are burning through capital (breeder shrimp) faster than you are making profit.

  ---

  ### The Limitations (What this checklist cannot do)

  You asked for honesty about where this will misfire. Here it is:

  1.  **It Cannot Measure Pain:** Trout have nociceptors (pain receptors). Shrimp might. The checklist checks for *stress*, not *suffering*. A fish can be chemically stressed but look fine until it drops dead.
  2.  **It Cannot Make Ethical Choices:** The **🔵 BLUE** calls are not technical problems. They are business ethics problems. The checklist tells you *that* you are compromising welfare, but it cannot tell you if the profit is worth it. That is on you and your partner.
  3.  **It Misses Slow Drifts:** A checklist is a snapshot. Water quality can degrade slowly over a week. If you only spot-check ammonia every other day, you might miss a slow biofilter crash. **You must keep a logbook and look at trends, not just today's numbers.**
  4.  **It Doesn't Replace the Vet:** If you get a **🔴 RED** on disease (sores, fungus), do not guess. In auto repair, you can swap a part to see if it works. In biology, guessing kills the inventory. Call the vet.

  ### Final Word
  You are the mechanic. The animals are the engine. If you ignore the knocking sound (stress behaviors) because you're in a hurry, the engine blows (mass mortality).

  Print the checklist. Enforce the **🔵 BLUE** rule: If the crew flags a Blue issue, they stop, and you come make the call. Don't let the crew decide on ethics; don't let yourself decide on emergency biology.
