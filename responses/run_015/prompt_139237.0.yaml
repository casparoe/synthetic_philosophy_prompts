  Here is a decision tree designed to fit on a whiteboard. It forces the committee to answer the underlying philosophical questions before discussing grant applications. Following the tree, you will find the "Logical Space Analysis" which maps the empty cells, indistinguishable leaves, and wild-fish implications you requested.

  ### The Aquaculture Strategy Decision Tree

  **Question 1: Uncertainty & Status**
  *How should we treat uncertainty about shrimp sentience compared to finfish?*
  *   **A)** Treat them the same (Full status for both).
  *   **B)** Discount shrimp or treat as zero (Decapods count less).
  *   **C)** Treat both as zero (No moral status).
      *   *(If C, go to **Leaf 1**)*

  **Question 2: The Counting Metric**
  *If we must choose, is it worse to farm 1,000 small fish or 10 large fish for the same amount of meat?*
  *   **A)** Worse to farm the 1,000 (Individuals matter most).
  *   **B)** Same/Weight matters (Biomass matters most).
      *   *(If 1B, go to **Leaf 2**)*

  **Question 3: Life Balance**
  *On average, does a farmed fish have a life that is net positive or net negative?*
  *   **A)** Net Negative (Suffering dominates).
  *   **B)** Net Positive (Life is good, death is the problem).
      *   *(If 2B + 3B, go to **Question 4**)*
      *   *(If 2A + 3B, go to **Leaf 3**)*
      *   *(If 3A, go to **Question 5**)*

  **Question 4: Reform Consequence**
  *If we fund better welfare standards, will it make people feel okay about eating more seafood?*
  *   **A)** Yes (Reform entrenches the industry).
  *   **B)** No (Reform reduces harm without growth).
      *   *(If 4A, go to **Leaf 4**)*
      *   *(If 4B, go to **Leaf 5**)*

  **Question 5: Scope of Duty**
  *Does our responsibility end with animals we farm, or does it include wild ones we catch?*
  *   **A)** Only farmed (Human responsibility).
  *   **B)** All fish (Wild included).
      *   *(If 2A + 3A + 5A, go to **Leaf 6**)*
      *   *(If 2A + 3A + 5B, go to **Leaf 7**)*
      *   *(If 2B + 3A + 5A, go to **Leaf 8**)*
      *   *(If 2B + 3A + 5B, go to **Leaf 9**)*

  ***

  ### The Leaves (Outcomes)

  **Leaf 1: The Pragmatic Insurance**
  *   **Path:** Q1(C) — No moral status.
  *   **Awkward Commitment:** "We are spending money to protect creatures we believe might not matter, just in case we are wrong or to look reasonable."
  *   **Fund:** Welfare standards and slaughter research (low-cost goodwill/insurance).
  *   **Wild Fish Implication:** **No.** (Stops at farm gate).

  **Leaf 2: The Decapod Exclusion**
  *   **Path:** Q1(B) + Q2(B) — Shrimp count less; Biomass matters.
  *   **Awkward Commitment:** "We accept that shrimp suffering is real but politically convenient to ignore compared to salmon."
  *   **Fund:** Welfare campaigns for finfish only; ignore decapods.
  *   **Wild Fish Implication:** **No.** (Stops at farm gate).

  **Leaf 3: The Small-Fish Replacement**
  *   **Path:** Q1(A) + Q2(A) + Q3(B) — Full status; Individuals matter; Lives net positive.
  *   **Awkward Commitment:** "We accept farming is okay in principle, but we must replace small fish because the headcount is too high to justify."
  *   **Fund:** Plant-based/cultivated seafood specifically targeting small pelagic replacement.
  *   **Wild Fish Implication:** **Yes.** (Logically implies concern for wild bycatch of small fish).

  **Leaf 4: The System Critic**
  *   **Path:** Q1(A) + Q2(B) + Q3(B) + Q4(A) — Full status; Biomass; Net positive; Reform entrenches.
  *   **Awkward Commitment:** "The animals have good lives, but making them better will cause more of them to be born and killed."
  *   **Fund:** Alternative seafood (to displace demand without legitimizing farming).
  *   **Wild Fish Implication:** **No.** (Focus is on displacing farmed demand).

  **Leaf 5: The Welfare Reformer**
  *   **Path:** Q1(A) + Q2(B) + Q3(B) + Q4(B) — Full status; Biomass; Net positive; Reform helps.
  *   **Awkward Commitment:** "We are making death acceptable to keep the industry alive and potentially expand it to displace chicken or beef."
  *   **Fund:** Welfare standards and stunning research.
  *   **Wild Fish Implication:** **No.** (Stops at farm gate).

  **Leaf 6: The Headcount Abolitionist (Farmed Only)**
  *   **Path:** Q1(A) + Q2(A) + Q3(A) + Q5(A) — Full status; Individuals; Net negative; Farmed only.
  *   **Awkward Commitment:** "We prioritize shrinking shrimp farming over cow farming because there are more shrimp, even if the cow suffers more individually."
  *   **Fund:** Demand reduction campaigns targeting high-count species (shrimp/small fish).
  *   **Wild Fish Implication:** **No.** (Explicitly stops at farm gate).

  **Leaf 7: The Headcount Abolitionist (Wild Included)**
  *   **Path:** Q1(A) + Q2(A) + Q3(A) + Q5(B) — Full status; Individuals; Net negative; Wild included.
  *   **Awkward Commitment:** "To be consistent, we must campaign against wild fisheries and bycatch, not just farms."
  *   **Fund:** Demand reduction for all seafood + bycatch mitigation policy.
  *   **Wild Fish Implication:** **Yes.** (Explicitly includes wild populations).

  **Leaf 8: The Biomass Reductionist (Farmed Only)**
  *   **Path:** Q1(A) + Q2(B) + Q3(A) + Q5(A) — Full status; Biomass; Net negative; Farmed only.
  *   **Awkward Commitment:** "A tonne of salmon matters more than a tonne of sardines, despite the sardines being thousands of individuals."
  *   **Fund:** General seafood demand reduction (focus on volume).
  *   **Wild Fish Implication:** **No.** (Stops at farm gate).

  **Leaf 9: The Biomass Reductionist (Wild Included)**
  *   **Path:** Q1(A) + Q2(B) + Q3(A) + Q5(B) — Full status; Biomass; Net negative; Wild included.
  *   **Awkward Commitment:** "We must reduce wild catch volumes even if those fish lived 'natural' lives, because the death is the harm."
  *   **Fund:** General seafood demand reduction + wild fishery reform.
  *   **Wild Fish Implication:** **Yes.** (Explicitly includes wild populations).

  *(Note: Leaf 10 "Unnamed" is logically possible—Q1(B)+Q2(A)—but rarely held: believing shrimp count less than fish, but individuals matter more than weight. This usually collapses into Leaf 2 or Leaf 6.)*

  ***

  ### Logical Space Analysis

  **1. Empty or Incoherent Cells**
  *   **Net Positive + Demand Reduction:** There is no leaf for "Lives are Net Positive, but we should shrink the industry." This is logically incoherent unless the goal is specifically to displace *other* meat (covered in Leaf 5's description). If you believe the lives are good, arguing for reduction requires a different ethical framework (e.g., environmentalism) which this tree does not capture.
  *   **Net Negative + Welfare Reform:** There is no leaf for "Lives are Net Negative, but we should fund welfare standards." This is strategically incoherent. If the life is net negative, improving it slightly doesn't fix the core harm of existence/death. This combination usually indicates a donor hasn't answered Q3 honestly.
  *   **Reform Entrenches + Fund Reform:** There is no leaf for "Reform makes the industry grow, but we should fund reform anyway." This is the "unattractive" cell. It implies prioritizing short-term harm reduction over long-term industry growth, which some hold, but it contradicts the strategic logic of Q4.

  **2. Indistinguishable Leaves (The "Same Thing" Problem)**
  *   **Leaf 1 (Insurance) vs. Leaf 5 (Welfare Reformer):** In practice, these two recommend the exact same funding (Welfare standards/stunning research).
      *   *Why they differ:* Leaf 1 doesn't believe the fish necessarily matter (uncertainty/insurance); Leaf 5 believes they matter and have good lives.
      *   *Committee Risk:* If you have both people in the room, they will vote for the same grants but argue fiercely about *why*. You may not need to separate them for budgeting purposes, but you do for messaging.
  *   **Leaf 6 (Headcount/Farmed) vs. Leaf 7 (Headcount/Wild):** Both recommend "Demand Reduction."
      *   *Why they differ:* Leaf 7 opens the committee to campaigning against wild fisheries, which is significantly more expensive and controversial.
      *   *Committee Risk:* If you fund "Seafood Reduction" without specifying scope, Leaf 7 people will try to spend the money on wild bycatch, and Leaf 6 people will block it. You must specify the scope in the grant mandate.

  **3. The Wild Fish Implication**
  *   **Leaves carrying the implication:** Leaf 3, Leaf 7, Leaf 9.
  *   **Leaves stopping short:** Leaf 1, Leaf 2, Leaf 4, Leaf 5, Leaf 6, Leaf 8.
  *   **The Tension:** Notice that **Leaf 3 (Small-Fish Replacement)** carries a Wild Fish implication even though it believes lives are *Net Positive*. This is because if "Individuals matter most" (Q2=A), you logically care about wild bycatch of small fish, even if you think farming them is okay. This is the specific logic that "freaked people out" in your last meeting. If your committee selects Leaf 3, you must explicitly decide if you are willing to fund wild bycatch mitigation, or admit the position is inconsistent.

  **4. How to Use This on the Whiteboard**
  1.  **Vote on Q1 first.** If the room splits between A and B, you immediately know you have a "Decapod Problem" (Leaf 2 vs others).
  2.  **Force Q3 early.** This is the biggest splitter. If people won't answer "Net Positive or Negative," they are likely trying to hold the incoherent "Net Negative + Welfare Reform" position.
  3.  **Check Leaf 1 vs Leaf 5.** If you end up funding welfare, ask the room: "Are we doing this because fish matter (Leaf 5) or because we want insurance (Leaf 1)?" If they can't agree, your messaging will be confused.
  4.  **Watch the Wild Fish Trap.** If anyone votes for "Individuals matter" (Q2=A), point to Leaf 3 and 7 and ask: "Are we okay with the logical conclusion that we should care about wild sardines too?" If they say no, they must vote for "Biomass" (Q2=B).
