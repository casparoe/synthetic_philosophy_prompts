answer: |-
  Here is the plan for the ninety minutes. You will need a stack of index cards and markers for the whiteboard. Divide the fourteen students into four groups of three or four, leaving two students out as observers or rotating them if a group stalls. The goal is to have them construct normative systems that survive the removal of the agents they were designed for. You will not mention reasons, agents, or objectivism until the final fifteen minutes.

  Start by telling them they are engineers of legacy systems. Their task is to design a protocol for an automated facility that must operate correctly regardless of human presence. Give each group a specific function on an index card. Examples include a seed vault that must maintain humidity, a lighthouse that must signal a specific reef, a server farm that must archive data, or a monastic bell tower that must ring at canonical hours. Ask them to write down three rules that govern the facility. These rules must be phrased as requirements, using words like must or ought. For example, the humidity must not drop below forty percent. The light ought to flash every ten seconds. The bell must ring at noon. Give them ten minutes to establish the function and the rules. Walk around and ensure they are writing normative claims about the system, not just mechanical descriptions. If they write the motor turns on, push them to write the motor must turn on to preserve the seeds.

  Once the rules are written, introduce the first scenario. Tell them the operators have gone on vacation. They are gone for a month, but they will return. Ask the groups to discuss whether their rules still apply while the operators are away. Most will say yes. The system still ought to maintain humidity even if no one is watching. Write this on the board as Case One: Agents Exist but are Absent. Ask them why the rules still bind. They will likely appeal to the future return of the agents or the purpose of the facility. Push them here. If the operators never returned, would the rule still hold? This sets up the wedge you need.

  Now introduce the second scenario. This is the critical move. Tell them a catastrophe has occurred. The operators are extinct. The society that built the facility is gone. There are no humans left, and no other agents exist who could care about the seeds, the reef, the data, or the prayers. The facility is alone in the world. Ask them to look at their three rules again. Do the rules still apply? Does the humidity still ought to be maintained? Does the light still ought to flash? Give them fifteen minutes to debate this within their groups. Tell them you want a unanimous verdict from each group on whether the rules survive total agent extinction. Walk around and listen. You will hear some say it is pointless without agents. Others will say the rule is still there, just unfulfilled. This is where they generate the distinction between unclaimed and unclaimable. The first case was unclaimed reasons. The second case forces them to confront unclaimable reasons.

  Bring them back together after thirty minutes of total activity time. Do not explain anything yet. Ask each group to report their verdict on the extinction scenario. Write their answers on the board. You will likely have a split. Some will say the ought disappears. Others will say the ought remains but is tragic or orphaned. Now ask the groups that say the ought remains to explain what kind of force this is. If no one can be wronged, and no one can benefit, what is the rule doing? Ask them to describe the status of a violation. If the humidity drops, is something broken, or is something wrong? This distinction is crucial. Broken is mechanical. Wrong is normative. If they say it is wrong, ask who it is wrong for. If they say no one, you have successfully loosened the agent-relative constraint.

  Now move into the debrief for the final fifteen minutes. This is where you map the activity to the metaethics. Tell them that in the first scenario, they were dealing with reasons that were unclaimed. Agents existed who could take up the reason, but did not. In the second scenario, they were dealing with reasons that were unclaimable. No agents existed to take them up. Ask them if the normative language they used changed between the two cases. Did they stop saying ought in the second case? If they kept using ought, ask them what that word refers to if not a relation to an agent. This is where you introduce the term orphaned mandate. Explain that this is the intuition pump for agentless reasons. A consideration counts in favor of a state of affairs even if there is no agent for whom it counts. This challenges the reasons-first view if that view assumes reasons are essentially relational.

  You must also address the objectivism worry during this debrief. Students will try to file this under objective value. They will say the seeds have value therefore there is a reason. You need to point out that buck-passing accounts define value in terms of reasons for agents. If there are no agents, buck-passing says there is no value. So if they think there is still an ought, they are not just doing objectivism about value. They are positing a freestanding normative fact. Ask them if the rule exists because the seeds are valuable, or if the seeds are valuable because the rule exists. If they say the rule exists independently of the valuers, they are entertaining a non-relational normative reality. This distinguishes the view from simple value realism.

  There are two predictable failures you need to be ready for. The first is the metaphor objection. A student will say the lighthouse only metaphorically ought to shine. It is just a machine. To counter this, ask them to define the difference. If the machine fails, is it a mistake? If they say yes, ask what makes it a mistake rather than just a change. If they say it is a mistake relative to the design, ask where the normativity of the design comes from if the designers are dead. Push them to see that calling it a metaphor is a way to avoid the ontological commitment, but the intuition of correctness remains. The second failure is the collapse of unclaimed and unclaimable. They might treat the extinction case as just a version of the vacation case. To prevent this, emphasize the permanence. In the vacation case, the reason is waiting. In the extinction case, the reason is homeless. Ask them if a reason can be homeless. If they say no, ask why the rule still seems to bind their intuition.

  Be honest about what this activity cannot do. It cannot prove that agentless reasons exist. It only generates the intuition that our normative language commits us to them. You will still need to lecture on the metaphysical cost of this view. The activity makes the idea plausible, but it does not defend it against objections regarding queerness or explanation. You will need to explain that accepting orphaned mandates means accepting normative facts that do not supervene on natural facts about agents. This is a heavy metaphysical price. The activity gets them to see the price is worth paying for the intuition, but you must articulate the cost yourself. Also, the activity relies on functional normativity. Some students will argue that all norms are functional norms relative to a goal. You will need to address whether goals can exist without goal-holders. This is the hard philosophical work that remains after the exercise.

  Finally, manage the room energy. This topic can become abstract quickly. Keep them focused on the specific objects they designed. When they drift into theory, bring them back to the lighthouse. Ask about the light. Ask about the bell. Keep the concrete image alive while you draw the abstract conclusion. If you keep the lighthouse shining in their minds while you talk about agentless reasons, the idea will stick. If you let the lighthouse go dark too early, they will retreat to agent-relativity. End the class by asking them to write down one sentence on an index card answering whether the lighthouse ought to shine. Collect these. They will serve as a record of their starting position for the next seminar when you introduce the readings that formalize this distinction.
