answer: |-
  *   **Machinery as Fixed Capital:** Technology presented not as a tool for workers, but as capital embodied in material form to dominate living labor.
  *   **Relative Surplus Value:** Automation framed as "efficiency" that shortens necessary labor time to maximize unpaid labor time for the owner.
  *   **The Industrial Reserve Army:** Unemployment portrayed as a "flexible talent pool" used to discipline wages and ensure compliance.
  *   **Absorption of the General Intellect:** Social knowledge and science codified into the machine, stripping workers of craft and making them replaceable.
  *   **The Worker as Appendage:** The relationship inverted so the human serves the machine's pace rather than the machine serving the human.

  ***

  **YOUR FUTURE IN SMART AUTOMATION**
  **Northside High Career & Technical Education Division**

  Welcome, ambitious scholars! Are you ready to step into a frictionless economy? The era of human friction is over. Our new curriculum aligns perfectly with industry demands for seamless human-machine integration. We don't just prepare you for jobs; we prepare you for optimal utilization within the automated workflow. Check out these thrilling career pathways!

  **Relative Surplus Value Coordinator**
  Do you love efficiency? As a Coordinator, you will oversee the reduction of necessary labor time across production units. By implementing smart systems, you'll ensure that workers produce their own wage equivalent in record time, leaving maximum daylight hours for unpaid value generation. It's not about working harder; it's about making every second count toward capital accumulation. You'll be the architect of lean workflows where "downtime" is eliminated and productivity metrics soar. Join the front lines of value extraction!

  **Reserve Army Placement Specialist**
  Job security is so twentieth century. In this role, you will manage our dynamic contingent labor pools. You'll maintain a robust database of pre-qualified, replaceable candidates ready to deploy at a moment's notice. This ensures that currently employed staff remain motivated by healthy competition and wage stabilization. You'll be the gatekeeper of opportunity, ensuring the supply of labor always slightly exceeds demand. It's a high-pressure role perfect for those who enjoy leveraging scarcity to drive organizational excellence.

  **General Intellect Integration Officer**
  Have you ever wanted to upload human knowledge into a server? As an Officer, you will extract tacit skills from experienced workers and codify them into proprietary algorithms. Once the knowledge is safe within the machine, the original worker becomes fully interchangeable. You'll be building the corporate brain that thinks for everyone, ensuring that no single employee holds indispensable power. It's the ultimate form of knowledge management—turning social intellect into private property.

  **Student Benefits & Perks**
  *   **Appendage Stability:** Learn to move in perfect sync with automated pacing systems. No more thinking about *how* to work; the machine dictates the rhythm.
  *   **Continuous Availability:** Our partners value flexibility. You'll be trained to remain on-call, blurring the lines between work and life to ensure capital never sleeps.
  *   **Deskilling Opportunities:** Don't worry about craft! Our systems are so intuitive that weeks of training replace years of apprenticeship. Anyone can do your job, which means you can go anywhere!

  The future is bright, automated, and waiting for your compliance. Sign up today for orientation. Remember: The machine doesn't need you, but you need the machine.

  Summary: The satire critiques the tech-optimist narrative by revealing how automation under capitalism functions to discipline labor, appropriate knowledge, and maximize extraction rather than liberate workers.
