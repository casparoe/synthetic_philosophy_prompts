  Here is the breakdown of the competing principles, the prediction for the Noether project, and the hypothetical case that would break her algorithm.

  ### 1. The Competing Principles

  Based on her five prior verdicts, her ethics are generated by the tension between these two rules:

  *   **Principle A: The Documentary Veto (Factual Fidelity)**
      *   *Derived from:* The Turing Movie (orientation), The Activist (love affair).
