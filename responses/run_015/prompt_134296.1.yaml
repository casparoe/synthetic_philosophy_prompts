  > A biopic about a beloved humanitarian leader. Private diaries (documented evidence) reveal that in their final week, they suffered a severe mental break and verbally abused their caretakers.
  >
  > *   **Option 1:** Show the abuse accurately. (Upholds Principle A, violates Principle B's spirit of dignity/non-sensationalism).
  > *   **Option 2:** Invent a scene where they are calm and forgiving, omitting the abuse. (Upholds Principle B's desire to honor the legacy, violates Principle A's ban on contradiction).

  **Why this splits them:**
  *   **Based on her Turing/Activist track record:** She should demand the abuse be shown (or omitted entirely without replacement) because the record exists.
  *   **Based on her Plath/Curie track record:** She might argue that showing the abuse sensationalizes a private medical crisis and violates the dignity of the dead, suggesting the "calm" invention is more ethical.

  This case forces her to decide if **Truth** is more important than **Legacy**, which is the one conflict her current verdicts haven't fully resolved. (In the Plath case, Truth lost to Dignity, but that was about *visual display* of death, not *rewriting behavior*.)
