  *   **Principle B: The Dignified Inference (Narrative License)**
      *   *Derived from:* NASA Computers (compression), Curie Biopic (inner voice), Plath Film (limits on trauma).
      *   *The Rule:* You may invent structural shortcuts, internal monologues, or visual metaphors **provided** they are grounded in evidence (like letters) and do not sensationalize private suffering or reduce the subject to a plot device.
      *   *Weight:* Conditional. It is permissible only when it does not trigger Principle A.

  ### 2. Prediction for the Noether Proposal

  **Verdict: Split the Difference (Conditional Rejection)**
  She will likely **approve the Bath Scene** but **reject the Deathbed Scene**. If the filmmakers refuse to change the deathbed scene, she will reject the project entirely.

