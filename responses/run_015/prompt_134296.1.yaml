  *   **Distinction from Turing:** The Turing case was about *identity* (orientation). The Activist and Noether cases are about *relational history*. Since the Noether scene is about her relationship with her brother, the Activist verdict is the stronger precedent.

  ### 4. The "Splitter" Case (Hypothetical)

  To truly test her framework, you need a case where **Principle A (Factual Fidelity)** and **Principle B (Dignified Inference)** demand opposite outcomes. Currently, Principle A usually wins. A splitter would be a scenario where the Truth is undignified, and the Lie is respectful.

