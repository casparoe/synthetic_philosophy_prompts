  *   **The Deathbed Scene (Reject):** This triggers **Principle A**. The script explicitly contradicts family letters regarding her relationship with her brother. The director's defense ("emotional truth about isolation") is the exact same defense used for the Activist's fake love affair. To your roommate, inventing estrangement to create pathos is "using the dead for drama," just like the Activist case.

  **Which principle wins?**
  Her pattern supports **Principle A (The Documentary Veto)**. In both the Turing and Activist cases, she rejected "narrative benefit" when it required falsifying identity or relationships. The "Emotional Truth" defense only works for her when it fills a gap (Curie's letters didn't say *what* she thought, just gave the words), not when it overwrites a known fact (Reconciled vs. Estranged).

  ### 3. The Closest Analog

  The **Dead Activist** case is the closest analog.

  *   **Similarity:** Both involve inventing a specific interpersonal dynamic (a secret affair vs. an estranged brother) that contradicts the historical record (zero basis vs. reconciled letters).
