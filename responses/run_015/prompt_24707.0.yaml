      *   *Section 4: Ruled Out Theories.* Pure Intentionalism. Radical Contextualism.
      *   *Section 5: Alternative Policy.* What if we treated slurs like dangerous chemicals (strict hazmat) vs. like weapons (intent matters)? Let's go with the "Intent/Context" model.

  8.  **Refining the Philosophy:**

