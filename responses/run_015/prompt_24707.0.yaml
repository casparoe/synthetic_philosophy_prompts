      *   **Specific Locations of Harm:** Is harm in meaning, attitude, effect, or the bare string?
      *   **Distinction:** Separate what is *strictly presupposed* vs. what is *merely compatible*. Mark areas of *philosophical underdetermination* (where multiple theories fit).
      *   **Tension:** The convention pulls two ways:
          1.  Repetition is dangerous (harm accumulates).
          2.  Even a single, analytical occurrence must be hidden (harm is intrinsic to the string/context-independent).
      *   **Task:** Reconcile/resolve this tension.
      *   **Exclusion:** Which rival theories does the practice rule out?
      *   **Alternative:** What would a policy based on a different theory look like?

  2.  **Initial Brainstorming & Theoretical Landscape:**

      *   *Theories of Slurs:*
          *   **Semantic/Truth-Conditional:** Slurs have specific truth conditions (often offensive ones).
          *   **Expressivist/Presuppositional:** Slurs express contempt or presuppose inferiority.
          *   **Prohibitive/Taboo:** The word itself is toxic (like a curse).
          *   **Perlocutionary/Effect-Based:** Harm is in the psychological impact on the hearer.
          *   **Illocutionary/Act-Based:** Using the word *is* the act of subordination (Langton).
          *   **Associationist:** The word triggers painful historical associations.
      *   *The Convention:* "The N-word," "f**k," printing once then hiding.
      *   *Implicit Theory:* It seems to treat the word as a vector of harm that is somewhat independent of intent (since academic analysis still censors) but dependent on frequency (repetition is worse).

  3.  **Analyzing the "Strict Presuppositions" vs. "Compatibility":**

      *   *Strict Presupposition:* The text itself carries risk. If intent were the *only* thing that mattered, academic analysis wouldn't need to censor. Therefore, the practice presupposes that *exposure* to the string causes some harm, regardless of the speaker's intent.
      *   *Compatibility:* It is compatible with the idea that intent matters for *moral blame*, but not for *harm mitigation*. It is compatible with semantic theories, but doesn't require a specific semantic structure (e.g., presupposition vs. assertion).
      *   *Underdetermination:* We don't know if the harm is psychological (trauma trigger) or sociological (normalizing the term). Both justify censorship.

  4.  **Addressing the Tension (Accumulation vs. Intrinsic Harm):**

      *   *Tension:* If one use is bad enough to require hiding, why does repetition matter more? If repetition matters more, why hide the first one?
      *   *Resolution:* Threshold vs. Dose. There is a baseline "contamination" risk (intrinsic) that requires minimization, but there is also a "normalization" risk (accumulative) that requires strict limitation.
      *   *Alternative Resolution:* The "Quotation" Problem. Even quoting the word risks re-enacting the subordination (Langton's silencing/verdictive acts). Repetition increases the likelihood of the word being "absorbed" into the discourse rather than remaining "quoted."

  5.  **Identifying Ruled-Out Theories:**

      *   *Pure Intentionalism:* If harm were *only* about the speaker's hateful intent, an academic condemning the word wouldn't need to censor. The practice rules this out.
      *   *Pure Truth-Conditionalism (neutral):* If the word were just a synonym for a neutral term (e.g., "person of X descent") with no extra power, censorship would be unnecessary.
      *   *Radical Contextualism:* If context *fully* determined meaning/harm, analytical contexts would be exempt. The practice suggests context is not a perfect shield.

  6.  **Designing an Alternative Policy:**

      *   *Theory:* Pure Expressivism or Intentionalism.
      *   *Policy:* Allow the word if the intent is clearly analytical. Focus on the *use*, not the *mention*.
      *   *Theory:* Reclamation/Ownership.
      *   *Policy:* Allow in-group usage, forbid out-group usage (context-sensitive).

  7.  **Drafting the Response (Iterative refinement):**

