answer: |-
  The convention of censoring slurs—printing them once, if at all, and thereafter resorting to euphemisms like "the N-word" or obfuscations like "f**k"—rests on a specific, hybrid philosophy of language and harm. It treats the slur not merely as a signifier of hate, but as a **toxic vector**.

  To reconstruct the implicit theory under which this practice makes sense, we must analyze where the convention locates the "danger" of the word. The practice presupposes that the harm of a slur is not exhausted by the speaker's intent, nor fully contained by the listener's interpretation. Instead, it treats the linguistic token itself as carrying a residual capacity to wound or subordinate, independent of the immediate communicative goal.

  ### 1. The Implicit Theory: Perlocutionary Contagion and Normalization

  The convention operates on a theory that combines **perlocutionary effect** (psychological impact) with **illocutionary force** (social action).

  *   **Perlocutionary Contagion:** The practice presupposes that encountering the string causes immediate psychological harm (trauma, alienation, pain) to members of the targeted group, regardless of the context. The word is treated like a pathogen; even a "dead" virus (a word quoted for analysis) retains the shape of the threat and can trigger an immune response (distress).
  *   **Normalization Risk:** The practice also presupposes that repetition increases the word's social acceptability. By limiting occurrences, the convention aims to prevent the slur from becoming "domesticated" within the discourse.

  Therefore, the implicit theory locates harm in **the bare occurrence of the string**, but specifically in its *circulation*. The harm is not just in the meaning (semantic), nor solely in the attitude (expressivist), but in the **material presence of the signifier in the public sphere**.

  ### 2. Presuppositions, Compatibilities, and Underdetermination

  To understand the philosophical commitments of this convention, we must distinguish what it *requires* from what it merely *allows*.

  **Strictly Presupposed:**
  1.  **Context-Independence of Harm:** The practice presupposes that context is an imperfect shield. If context (e.g., "I am condemning this word") were sufficient to neutralize harm, academic papers would not need to censor. Therefore, the theory presupposes that the *mention* of a slur risks re-enacting the *use* of the slur.
  2.  **Agentive Power of the Token:** The string itself is treated as having a degree of agency. It is not a passive tool waiting for a user's intent; it is an active hazard that requires containment.

  **Merely Compatible:**
  1.  **Semantic Structure:** The convention is compatible with various semantic theories. It works whether one believes slurs carry conventional implicatures (Potts), presuppositions (Macià), or are simply truth-conditionally equivalent to neutral terms but socially marked (Hom). The censorship policy does not depend on *how* the word means, only *that* it harms.
  2.  **Source of Authority:** It is compatible with both top-down moderation (platform rules) and bottom-up social norms (journalistic style guides).

  **Philosophically Underdetermined:**
  1.  **The Mechanism of Harm:** The practice does not specify *why* the string harms. Is it because it triggers PTSD-like responses (psychological)? Or because it reinforces a hierarchy of human worth (sociological/normative)? Both theories license censorship, so the convention remains agnostic on the root cause.
  2.  **The Status of the "First Mention":** The convention allows one uncensored instance (sometimes) but forbids others. It is underdetermined whether this first instance is a "necessary evil" for referential clarity or if it is treated as fundamentally different (e.g., as a "label" rather than a "usage").

  ### 3. Resolving the Tension: Accumulation vs. Intrinsic Danger

  The prompt identifies a tension: The convention treats repetition as especially dangerous (suggesting harm accumulates), yet it treats even a single analytical occurrence as something to be hidden (suggesting harm is intrinsic).

  **The Tension:**
  *   *Premise A:* If harm is intrinsic to the string, one occurrence should be as forbidden as ten.
  *   *Premise B:* If harm accumulates, one occurrence should be permissible if it serves a vital function (clarity), provided it isn't repeated.

  **Resolution: The Threshold and Dose Model**
  The tension is resolved if we view the convention as managing **risk thresholds** rather than absolute prohibitions.
  1.  **Intrinsic Risk (The Threshold):** The first mention is permitted only because it is *referentially necessary*. To discuss the word without printing it can lead to ambiguity. However, because the string is intrinsically hazardous (it can wound on contact), it is immediately quarantined after serving its referential function.
  2.  **Accumulative Risk (The Dose):** Repetition is forbidden not just because it adds more "contact" harm, but because it shifts the **illocutionary status** of the text. A single mention looks like evidence; repeated mentions look like usage. Repetition risks normalizing the term within the text's own ecosystem, making the text itself a carrier of the slur's ideology rather than just a reporter of it.

  Thus, the practice reconciles the tension by distinguishing between **exposure** (which is minimized via obfuscation) and **amplification** (which is prevented via non-repetition). The single printed instance is a controlled exposure for clarity; subsequent obfuscations prevent amplification.

  ### 4. Rival Theories Ruled Out

  This convention quietly rules out specific philosophical theories of slurs that would otherwise permit more liberal usage.

  1.  **Pure Intentionalism:** This theory holds that the harm of a slur lies entirely in the speaker's intent to subordinate or express contempt. If Pure Intentionalism were true, an academic paper condemning the slur would be harmless, as the intent is anti-racist. The convention rules this out by censoring the academic paper anyway. It asserts that *impact* overrides *intent*.
  2.  **Radical Contextualism:** This view suggests that the meaning and force of a word are wholly determined by the context of utterance. If context were sovereign, the "analytical context" would neutralize the slur. The convention presupposes that context is porous; the slur's history bleeds through the analytical frame.
  3.  **Neutral Descriptivism:** The idea that a slur is merely a rough synonym for a neutral descriptor (e.g., "person of X descent") with no extra semantic or pragmatic load is ruled out. If this were true, censorship would be unnecessary obfuscation.

  ### 5. An Alternative Policy: The Expressivist/Intentional Model

  If we were to build a communication policy based on a different theory—specifically, a **Pure Expressivist** or **Intentionalist** theory where harm is located strictly in the *attitude of the user* and the *act of subordination*—the policy would look markedly different.

  **The Theory:** Slurs are weapons. A weapon held in a museum (analysis) is not dangerous; a weapon wielded in a fight (hate speech) is. The harm is in the *wielding*, not the *steel*.

  **The Alternative Policy:**
  1.  **No Obfuscation:** The word would be printed fully whenever necessary for precision. Obfuscation would be viewed as infantilizing or as hindering rigorous analysis of the term's power.
  2.  **Contextual Immunity:** Explicit analytical, historical, or reclamation contexts would be exempt from restriction. A professor discussing the etymology of the N-word would print it as often as needed for philological accuracy.
  3.  **Intent-Based Moderation:** Moderation would focus on the *surrounding text* to determine intent. If the text condemns the slur, it is protected. If the text wields it to insult, it is removed.
  4.  **User Control:** Instead of removing the word from the text, the policy might place the burden on the reader. Content warnings would be mandatory ("This article contains uncensored slurs for academic purposes"), allowing the reader to consent to the exposure, rather than the platform deciding the exposure is inherently too dangerous to exist.

  **Consequences of the Alternative:**
  This policy would prioritize **truth and precision** over **comfort and risk mitigation**. It assumes that readers are resilient enough to encounter the word without being harmed, provided the intent is clear. It risks, however, the "normalization" effect the current convention tries to prevent: by treating the word as just another tool in the kit, it might inadvertently lower the barrier to its casual use, blurring the line between analyzing hate and speaking hate.

  ### Conclusion

  The current convention of censoring slurs presupposes a **materialist theory of language**: words are not just transparent windows to meaning, but objects that carry a residue of their history. It locates harm in the **encounter with the string**, moderated by the **frequency of exposure**. It resolves the tension between intrinsic and accumulative harm by treating the first mention as a necessary risk for clarity, and subsequent mentions as gratuitous risks of normalization. In doing so, it rejects the idea that good intent can sanitize a toxic tool, prioritizing the safety of the audience over the expressive liberty of the speaker.
