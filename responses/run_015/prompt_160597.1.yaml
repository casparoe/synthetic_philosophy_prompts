prompt: |-
  Our city council is toying with a small-scale futarchy pilot for housing policy, and I got volunteered onto the little advisory group for it, so I'm trying to get my head around the details before the next meeting.

  The setup on the table: first a vote to fix a welfare index for the city (say median rent, vacancy rate and a count of displacement complaints, weighted 50/30/20), then two conditional prediction markets — one that pays out only if the council adopts the upzoning package, one that pays out only if it doesn't — and the package gets adopted iff the first market prices the index higher five years out.

  Two things I can't get straight, and I think they're connected.

  First: everyone keeps telling me the beauty of this is that the market hands you an unbiased estimate of the policy's effect. But a conditional market price is just an expectation over whatever actually happens in the branch where the policy passed. If upzoning only ever gets passed when rents were already about to flatten — because that's when its politically easy — then the "passed" branch looks great no matter what the upzoning does. One person on the group suggested fixing this by resolving the "didn't pass" branch against a basket of similar peer cities rather than against our own counterfactual. That seems to me to basically solve it, and cheaply. Is that right, or am I missing somthing?

  Second, and this is the bit I actually care about: if that peer-city trick works, do we even need the values vote? Couldn't we skip the fight about the 50/30/20 weights, run markets on maybe eight or ten candidate indices, and then run a second-tier market betting on which weighting best predicts how satisfied residents report being five years later? Then the market tells us the right values too, which seems definately better than nine people arguing about it in a chamber.

  Something here feels wrong and I can't tell whether its that the whole thing is circular or that it just pushes the same argument one level down. Which is it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** A member of a city council advisory group for a futarchy pilot on housing policy.
      *   **Tone:** Skeptical, analytical, technically literate (understands conditional markets, counterfactuals, selection bias), but seeking clarity on specific conceptual pitfalls.
      *   **Goal:** Understand two specific conceptual hurdles in the proposed futarchy design before the next meeting.
      *   **Core Subject:** Futarchy (governance by prediction markets), specifically applied to local housing policy.

  2.  **Deconstruct Question 1: Selection Bias & The Peer City Fix:**
      *   *The Problem:* The user correctly identifies *selection bias* (endogeneity). If the policy is only adopted when conditions are already favorable (e.g., rents flattening), the conditional market ($P(Index | Policy)$) will look good even if the policy does nothing. This is the classic "correlation vs. causation" problem in futarchy.
      *   *The Proposed Fix:* Resolve the "didn't pass" branch against a basket of similar peer cities instead of the city's own counterfactual.
      *   *Analysis:*
          *   Does this solve selection bias? Not really. It changes the *baseline*, but it doesn't isolate the causal effect of the policy *in this specific city*.
          *   If the market pays out based on Peer Cities' performance when the policy *doesn't* pass, you are comparing $E[Index | Policy, City A]$ vs $E[Index | No Policy, Peer Cities]$.
          *   City A might be fundamentally different from Peer Cities (unique geography, economy, culture).
          *   More importantly, the selection bias exists in the *adoption* decision. If the market knows the council only adopts when things are easy, the "Policy" market price will reflect that ease, not the policy's efficacy.
          *   Using peer cities as a proxy for the counterfactual ($Y_0$) is a standard econometric technique (synthetic control), but embedding it in a prediction market payout structure is tricky.
          *   *Crucial Flaw:* Prediction markets aggregate *beliefs*, not *causal identification*. If traders believe the council only passes upzoning in good times, they will price the "Pass" market high regardless of the peer city comparison. The peer city comparison fixes the *metric* for the "No Pass" branch, but it doesn't force the "Pass" branch to isolate the causal delta.
          *   *Better Fix:* The standard futarchy solution is *decision markets* that estimate the *difference* ($E[Y|Do(Policy)] - E[Y|Do(No Policy)]$). But you can't trade on a counterfactual directly. Robin Hanson's original design relies on the market distinguishing correlation from causation (traders profit by knowing the true causal impact). But in practice, selection bias is the killer.
          *   *Verdict:* The peer-city trick helps with the "No Pass" baseline stability, but it does *not* solve the selection bias in the "Pass" branch. It might actually introduce *basis risk* (City A $\neq$ Peer Cities).

  3.  **Deconstruct Question 2: Meta-Futarchy (Markets on Values):**
      *   *The Proposal:* Skip the vote on weights (values). Run markets on multiple indices. Run a second-tier market betting on which weighting best predicts resident satisfaction.
      *   *Analysis:*
          *   This is "Futarchy on Values."
          *   *The Circular/Regression Problem:* You are trying to optimize $W$ (weights) to maximize $S$ (Satisfaction). The market predicts $S$ given $W$.
          *   *Issue 1: Measurement of $S$.* How do you measure "resident satisfaction" five years later? A survey? Surveys are manipulable, low-response, and subjective. If the payout depends on a survey, traders will bet on how the survey is gamed, not on actual welfare.
          *   *Issue 2: The "Is-Ought" Problem.* Futarchy separates *values* (vote) from *beliefs* (market). Collapsing them back together undermines the philosophical justification. If the market decides values, what is the market optimizing for? It's optimizing for the *prediction of the survey*.
          *   *Issue 3: Incentive Compatibility.* Traders in the second-tier market need to know the "true" satisfaction to profit. They won't know that until 5 years later. By then, the policy is done. It doesn't guide the *current* decision effectively unless the market is liquid and informed *now* about what *will* satisfy people *later*.
          *   *Issue 4: Manipulation.* If I want Upzoning to pass, and I know the "Satisfaction Market" determines the weights, I might bet on weights that favor Upzoning outcomes, regardless of actual satisfaction.
          *   *Verdict:* It pushes the argument one level down (as the user suspects). It replaces a political debate about values with a speculative debate about the *measurement* of values. It creates a circular dependency: We need the weights to judge the policy, but we need the policy outcome to judge the weights.

  4.  **Synthesize the "Something Feels Wrong" Intuition:**
      *   The user is right to feel uneasy.
      *   On Q1: The peer city fix addresses *variance* in the counterfactual, not *bias* in the treatment selection. It's a category error.
      *   On Q2: It's circular. You can't marketize values without a fixed metric. If you marketize the metric, you need a meta-metric. Infinite regress. Also, "satisfaction" is too noisy for a financial market payout.

  5.  **Drafting the Response:**
      *   **Tone:** Professional, peer-to-peer (acknowledge their sophistication), clear, structured.
      *   **Structure:**
          *   Acknowledge the sophistication of the questions (they are the two hardest problems in futarchy).
          *   **Section 1: The Selection Bias & Peer City Fix.**
              *   Validate their intuition about selection bias (the "easy times" problem).
              *   Explain why the peer-city fix fails: It changes the *control group*, but doesn't fix the *treatment selection bias*.
              *   Explain the "Basis Risk": Your city isn't the peer basket.
              *   Explain the Market Incentive: Traders profit on *prediction*, not *causality*. If they know the council is biased, they price the bias, they don't correct it.
              *   Suggest the actual fix (randomization or strict exogenous triggers), though acknowledging political difficulty.
          *   **Section 2: The Values Market (Meta-Futarchy).**
              *   Validate the "pushes the argument down" intuition.
              *   Explain the "Measurement Problem": Satisfaction is hard to verify (oracle problem).
              *   Explain the "Circularity": You need values to judge outcomes, but outcomes to judge values.
              *   Explain the "Goodhart's Law" risk: If satisfaction is the payout, traders will game the satisfaction survey.
              *   Reiterate Hanson's distinction: Votes = Values, Markets = Beliefs. Mixing them breaks the mechanism.
          *   **Conclusion/Advice:** What to tell the council. Keep the vote on values (it's legitimate politics). Be extremely wary of the selection bias (the pilot's biggest technical risk).

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction on Q1:* I need to be careful. If the "No Pass" market resolves on Peer Cities, does that help? If $E[Y|Pass, City] > E[Y|NoPass, Peers]$, does that mean causality? No. Because $E[Y|Pass, City]$ still includes the selection bias (council only passes when City is doing well). The Peer City comparison just makes the hurdle different. It doesn't isolate $\Delta Y$.
      *   *Correction on Q2:* Is it *purely* circular? Technically, you could say "Maximize Survey Score." But the market on weights would be betting on *which weights lead to high survey scores*. But the survey score depends on the policy outcome. The policy outcome depends on the weights (because the weights decide the policy). This is a fixed-point problem. It might not converge.
      *   *Emphasis:* Highlight that Futarchy is designed to separate *is* (markets) from *ought* (votes). Question 2 tries to merge them, which recreates the political conflict inside the market.

  7.  **Final Polish:** Ensure the housing context (upzoning, rents) is woven in to keep it relevant. (e.g., mention that "satisfaction" might be high for homeowners but low for renters, bringing us back to... weights).

  8.  *(Final check against safety guidelines)*: No financial advice given (this is policy design), no harmful content. Safe to proceed.

  9.  *(Final thought)*: Make sure to explicitly answer "Which is it?" regarding the circularity. It's both circular *and* pushes the argument down.

  **(Self-Correction Note):** Wait, I need to be precise about the "Peer City" mechanism.
  *   Standard Futarchy: Compare $E[Y | Policy]$ vs $E[Y | \neg Policy]$. Both resolved on *local* data.
  *   Proposed Pilot: $E[Y | Policy]$ resolved on local data. $E[Y | \neg Policy]$ resolved on *Peer* data.
  *   Why this is bad: If the council adopts policy only when local economy is booming, $E[Y | Policy]$ is high. If Peer cities are average, $E[Y | \neg Policy]$ is average. Policy passes. But the boom caused the high Y, not the policy. The Peer City fix does *not* remove the correlation between local economic conditions and adoption. It just changes the threshold.
  *   Okay, that confirms my analysis.

  10. **Drafting the response.** (Proceed to generate output based on these thoughts).
answer: |-
  You have correctly identified the two fatal flaws that usually sink futarchy pilots in the real world. Your intuition that "something feels wrong" is spot-on; in both cases, the proposed mechanisms try to use market mechanics to solve problems that are either econometric (causality) or philosophical (values), and markets are not magic wands for either.

  Here is the breakdown of why your skepticism is warranted, and how to frame this for your advisory group.

  ### 1. The Selection Bias & The Peer-City Fix

  You are absolutely right about the selection bias problem. This is the "Endogeneity" problem. If the council only upzones when the housing market is already cooling (to minimize political backlash), the prediction market for the "Upzone" branch will price in a healthy housing metric regardless of whether upzoning *caused* the health. Traders aren't betting on the *effect* of the policy; they are betting on the *conditions under which the policy is adopted*.

  **Does the peer-city fix solve this?**
  **No.** In fact, it introduces a new problem called **Basis Risk** while failing to solve the selection bias.

  Here is why the peer-city trick doesn't work:

  1.  **It doesn't isolate the causal delta:** The selection bias lives in the "Policy Passed" branch. If traders know the council only passes upzoning when local rents are flattening, they will bid up the "Policy Passed" contract because they know the *starting conditions* are favorable. Comparing that against a basket of peer cities (which might be experiencing different economic cycles) changes the *hurdle rate*, but it doesn't strip out the local economic confounders. You are comparing $E[Outcome | Policy, Local Boom]$ against $E[Outcome | No Policy, Peer Average]$. The "Local Boom" part is still driving the price, not the upzoning.
  2.  **Basis Risk:** Your city is not the peer basket. If your city has a specific tech boom or a specific geographic constraint that the peer cities don't share, the market becomes a bet on "Will our city outperform the peer basket?" rather than "Will upzoning work?" Traders will arbitrage the economic differences between your city and the peers, ignoring the policy entirely.
  3.  **The Incentive Problem:** Prediction markets aggregate *information*, not *causality*. For a market to yield a causal estimate, traders must be incentivized to distinguish correlation from causation. In a conditional market like this, a trader makes money by correctly predicting the outcome *given the condition*. If the condition (adoption) is correlated with success for unrelated reasons, the profitable trade is to ignore the policy's actual efficacy and bet on the correlation.

  **The Actual Fix:**
  The only way to fix this in a futarchy design is to make the adoption decision **exogenous** to the local conditions the market is measuring. In academic pilots, this is done via randomization. In policy, it's nearly impossible. Some futarchy proponents suggest tying the adoption to an external trigger (e.g., "If the market price > $X, we adopt") but that just moves the selection bias into the market manipulation risk.

  **Advice for the meeting:** Tell them the peer-city fix changes the *baseline*, not the *bias*. It creates a market on "Our City vs. Peers" rather than "Policy vs. No Policy."

  ### 2. The Values Market (Meta-Futarchy)

  Your intuition here is also correct: **It is both circular and it pushes the argument one level down.**

  This proposal attempts to marketize the "Ought" (values), but Futarchy relies on a strict separation: **Votes define the utility function; Markets estimate the expected utility.** Once you try to use markets to define the utility function, the system collapses for three reasons:

  1.  **The Oracle/Measurement Problem:** To settle a market on "which weighting best predicts resident satisfaction," you need a final, authoritative measurement of "resident satisfaction" five years later.
      *   How is this measured? A survey?
      *   If it's a survey, traders will not bet on *actual welfare*; they will bet on *how to game the survey*. (e.g., "If we weight vacancy rates high, the city will focus on empty units and ignore homeless people, but the survey might still score high.")
      *   This is Goodhart's Law: When a measure becomes a target, it ceases to be a good measure. By making "satisfaction" the payout, you incentivize traders to find policies that maximize the *metric* of satisfaction, not satisfaction itself.
  2.  **The Circular Dependency:** You need the weights to decide the policy. But the policy outcome determines the satisfaction score that validates the weights.
      *   If the market selects Weights A, and the Council adopts the policy favored by Weights A, and then Satisfaction is low... did the Weights fail, or did the Policy fail?
      *   The market cannot disentangle "We chose the wrong values" from "We chose the wrong policy for those values."
  3.  **Re-politicizing the Market:** The main selling point of futarchy is that it removes values from the speculative arena. If I know that betting on "High Rent Weighting" will shift the city's values toward landlord interests, I will bet on that not because I think it predicts satisfaction, but because I want to *influence* the values. The market becomes a lobbying tool, destroying its information-aggregation property.

  **Why it pushes the argument down:**
  You aren't eliminating the fight about the 50/30/20 weights. You are moving the fight from the City Chamber (public, transparent, one-person-one-vote) to a Prediction Market (opaque, one-dollar-one-vote).
  *   In the Chamber: I argue that displacement complaints matter more than vacancy rates.
  *   In the Meta-Market: I bet money that a weighting favoring displacement complaints will correlate with higher satisfaction scores.
  *   **Result:** You haven't solved the disagreement; you've just financialized it. And since "satisfaction" is subjective, the "correct" weight is not a discoverable fact—it's a political preference. Markets discover facts; they do not resolve normative disagreements.

  ### Summary for your Advisory Group

  You can frame your intervention like this:

  1.  **On Selection Bias:** "The peer-city proposal addresses *variance* in the counterfactual, but not *bias* in the adoption. If the council only adopts upzoning when the market is already favorable, the 'Pass' market will price in that favorability regardless of the peer comparison. We risk paying for a policy that gets credit for a trend it didn't cause."
  2.  **On Values Markets:** "Futarchy works by separating *beliefs* (markets) from *values* (votes). If we marketize the values, we create a circular dependency where the policy determines the metric that validates the policy. Furthermore, 'satisfaction' is too subjective to be a settlement oracle; we will end up incentivizing traders to game the satisfaction survey rather than improve housing."

  **The Verdict:**
  The pilot is likely to fail on the first point (causality) if they don't have a rigorous way to isolate the policy effect (like a randomized rollout or a strict exogenous trigger). It will fail on the second point (values) if they try to outsource normative choices to speculation.

  Stick to the classic Hanson design: **Vote on the index (own the values), Market the outcome (discover the facts).** Don't try to get the market to do the council's job, and don't expect the market to do the econometrician's job without rigorous controls.
