answer: |-
  # SCRATCH-WORK SECTION (Provisional Assessment)

  **1. Substantive vs. Verbal Disagreements**
  *   **Substantive:** The direction of ontological dependence. The Structuralist claims constituents + mode $\rightarrow$ proposition. The Primitivist claims proposition $\rightarrow$ constituents (via abstraction). This is a hard metaphysical clash regarding priority.
  *   **Substantive:** The nature of the "stopper." Is an unsaturated entity a functional explanation (Structuralist) or a brute fact labeled "functional" (Primitivist)? This turns on whether *requiring completion* is an intelligible ontological category distinct from *needing a tie*.
  *   **Verbal (High Risk):** The use of "Primitive." The Structuralist accepts primitive *rules* of combination; the Primitivist accepts primitive *unity*. If "rule" just means "principle of unity," the dispute is merely about whether to call the principle a "constituent-like item" or a "law." We must force them to define whether the mode is an *entity* or a *fact*.
  *   **Verbal (Medium Risk):** "Constituent." Structuralist means "independent item." Primitivist means "aspect of a whole." They are talking past each other unless we agree that "constituent" implies *separable existence* for the duration of the argument.

  **2. Question-Begging Framing in the Brief**
  *   **The Parity Premise (Step 4):** "Whatever does the uniting must itself be something that stands to the constituents as they stood to the proposition." This assumes the unifier is a *relatum*. The Structuralist denies this categorically. To state this as a premise of *the argument on the table* privileges the Primitivist critique. I must reframe this in the deliverable as "The Primitivist Challenge" rather than a neutral premise.
  *   **Diagnostic (b) Thick vs. Thin:** This is misleading. A "thin regress" is often a verbal maneuver to say "the regress doesn't matter" without explaining *why* it doesn't generate ontological bloat. I will recommend replacing this with "Explanatory Burden."
  *   **Diagnostic (a) Insufficiency/Parity:** This is sound, but the Structuralist does not reject Parity; they reject the *application* of Parity to unsaturated items. I need to sharpen this distinction.

  **3. Metaphor Control**
  *   Avoid "hook," "glue," "tie." Use "ontological connector" or "principle of combination."
  *   "Unsaturated" must be defined functionally (requiring completion to yield a truth-evaluable), not spatially (having a hole).

  ***

  # JOINT STATEMENT: THE UNITY OF THE PROPOSITION
  **Working Group on Metaphysical Foundations**
  **Subject:** The Proposition *That Brutus Stabbed Caesar*

  ## PART I: AGREED CLAIMS
  *The following claims are accepted by both the Structuralist and the Primitivist as the fixed constraints for this inquiry. Each claim eliminates a class of trivial solutions.*

  1.  **Order Sensitivity:** The proposition *that Brutus stabbed Caesar* is distinct from *that Caesar stabbed Brutus*, despite sharing all apparent constituents.
      *   *Work:* Eliminates accounts that reduce propositions to unordered sets or mereological sums.
  2.  **Non-Aggregation:** The existence of Brutus, Caesar, and stabbing does not entail the existence of the proposition *that Brutus stabbed Caesar*.
      *   *Work:* Establishes that propositional unity is not guaranteed by the coexistence of parts.
  3.  **Rejection of Naive Ties:** An ordinary relation (e.g., a third relation relating the relation *stabbing* to the relata) cannot serve as the unifier.
      *   *Work:* Blocks the first step of Bradley's Regress by agreeing that a homogeneous "super-tie" fails.
  4.  **Generality Constraint:** An account of unity for *that Brutus stabbed Caesar* must apply equally to *that Brutus was ambitious* (monadic), *that Brutus did not stab Caesar* (negative), and false propositions.
      *   *Work:* Prevents solutions that rely on the existence of corresponding facts or specific adicities.
  5.  **Coding Insufficiency:** A set-theoretic or syntactic coding (e.g., $\langle \text{Brutus}, \text{Caesar}, \text{stabbing} \rangle$) is not an analysis of unity unless it explains what makes the code truth-evaluable rather than merely well-formed.
      *   *Work:* Distinguishes mathematical representation from metaphysical constitution.
  6.  **Finite Grasability:** A finite thinker can grasp the proposition *that Brutus stabbed Caesar* without entertaining an infinite hierarchy of unifying acts.
      *   *Work:* Constrains solutions to avoid requiring actual infinite cognitive states (rules out "Thick" regress as a solution).
  7.  **Truth-Evaluability:** The unified whole must be of a category capable of being true or false, distinct from the category of its constituents (e.g., objects and relations).
      *   *Work:* Ensures the "unity" in question is specifically *propositional* unity, not mere object-complex unity.
  8.  **Metaphor Ban:** Terms like "tie," "hook," "slot," or "glue" are prohibited unless defined as functional roles (e.g., "argument place") rather than spatial or causal connectors.
      *   *Work:* Prevents equivocation based on pictorial intuitions about connection.

  ## PART II: DISAGREEMENTS TABLE
  *Residual disagreements are categorized by crux. The "Genuine/Verbal" column indicates whether the Group believes the dispute reflects a metaphysical divergence or a terminological choice.*

  | Crux | Structuralist Formulation | Primitivist Formulation | Genuine or Verbal? | Justification |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Source of Regress** | The regress arises only if the relation *stabbing* is treated as a saturated object; treating it as unsaturated stops the regress. | The regress arises from any attempt to compose a whole from parts; "unsaturated" is just a name for the unexplained unity. | **Genuine** | Disagreement on whether "unsaturatedness" is an intelligible ontological category or a label for ignorance. |
  | **2. Status of Unifier** | The mode of combination is a functional principle (type-restriction) that is not itself a constituent. | The mode of combination is a primitive unity smuggled in; it functions as a constituent without the name. | **Verbal** | Turns on whether a "principle" that is not an "entity" can still bear ontological weight. |
  | **3. Directionality** | Direction (Brutus $\to$ Caesar) is secured by the typed argument-places of the relation *stabbing*. | Direction is a brute feature of the whole proposition; argument-places are abstractions from the directed whole. | **Genuine** | Structuralist explains direction via parts; Primitivist explains parts via direction of whole. |
  | **4. Ontological Priority** | Constituents (Brutus, stabbing) are ontologically prior to the proposition; the proposition is built from them. | The proposition is ontologically prior; constituents are abstractions derived from analyzing the whole. | **Genuine** | Incompatible accounts of dependence; cannot both be true. |
  | **5. The "Primitive" Label** | We accept primitive *rules* of predication, but not primitive *unity* of the complex itself. | We accept primitive *unity* of the complex, which entails primitive *rules* of abstraction. | **Verbal** | Both accept a brute stopping point; dispute is whether to locate it at the *combining* or the *whole*. |
  | **6. False Propositions** | The mode of combination applies even if the fact does not obtain; unity is independent of truth. | The unity of the proposition is identical regardless of truth; the risk is conflating proposition unity with fact unity. | **Verbal** | Both agree false propositions are unified; risk is Primitivist accidentally relying on fact-structure. |

  ## PART III: TESTS AND PREDICTIONS
  *For each crux, the Group identifies a test case. Both parties commit to the prediction listed below.*

  **Test 1: The Monadic Check (Crux 1 & 3)**
  *   **Procedure:** Analyze *that Brutus was ambitious*. Does this require a "tie" between Brutus and *ambitious*, or is it a simple whole?
  *   **Structuralist Prediction:** It requires a predicative mode connecting Brutus to the property *ambitious*. Without the mode, we have only a list. The mode is unsaturated (needs a subject).
  *   **Primitivist Prediction:** It requires no tie. The proposition is a simple unity. "Brutus" and "ambitious" are distinguished only by abstracting from the whole proposition.
  *   **Success Condition:** If the Structuralist cannot explain the mode without invoking a dyadic structure (subject-predicate tie), the Primitivist gains ground. If the Primitivist cannot explain how "Brutus" is identified without presupposing the proposition, the Structuralist gains ground.

  **Test 2: The False-Instance Test (Crux 6)**
  *   **Procedure:** Consider *that Brutus stabbed Caesar* in a world where this is false. What unites the constituents?
  *   **Structuralist Prediction:** The same mode of combination unites them as in the true case. The mode is neutral to truth value.
  *   **Primitivist Prediction:** The unity is intrinsic to the proposition and unaffected by the world. The danger is implying the unity comes from a non-existent fact.
  *   **Success Condition:** If the Structuralist implies the mode depends on a fact, they fail. If the Primitivist implies the constituents exist independently in the false case, they fail.

  **Test 3: The Grasping Condition (Crux 2)**
  *   **Procedure:** To grasp the proposition *that Brutus stabbed Caesar*, must one grasp the mode of combination?
  *   **Structuralist Prediction:** One must grasp the mode, but grasping a mode is not grasping a further proposition (it is non-propositional understanding).
  *   **Primitivist Prediction:** One grasps the whole directly. To ask about grasping the mode is to ask for an abstraction that is not psychologically prior.
  *   **Success Condition:** If the Structuralist admits grasping the mode requires grasping a further proposition, regress resumes. If the Primitivist cannot explain how the whole is grasped without analyzing parts, their "primitive" claim weakens.

  ## PART IV: CONCESSIONS AND COUNTER-EVIDENCE
  *Each side identifies one claim they currently resist but acknowledge they should concede, and specifies what would count as evidence against their view.*

  **Structuralist Concession:**
  *   **Claim:** The Structuralist must concede that "unsaturatedness" is not self-explaining. It is a brute fact that some entities require completion.
  *   **Counter-Evidence:** If it can be shown that "unsaturatedness" implicitly relies on a hidden relation (a "tie" between the hole and the filler), the Structuralist account collapses into the regress it seeks to avoid.

  **Primitivist Concession:**
  *   **Claim:** The Primitivist must concede that "abstraction" requires an account. One cannot abstract constituents from a whole unless there is some differentiability within the whole.
  *   **Counter-Evidence:** If it can be shown that the differentiability of constituents (e.g., distinguishing Brutus from Caesar within the unity) requires the very structural relations the Primitivist rejects, the Primitivist account presupposes Structuralism.

  ## PART V: CODA ON DIAGNOSTICS
  *Assessment of the Convener's three proposed diagnostics.*

  1.  **Insufficiency/Parity Split:** **Keep, but Sharpen.** The split is useful, but the Parity Premise (Step 4 in the brief) is question-begging against the Structuralist. It assumes the unifier must stand to the constituents *as they stand to the proposition*. The Structuralist denies this category match.
      *   *Replacement:* **The Category Match Test.** Does the unifier belong to the same ontological category as the constituents? (Structuralist: No. Primitivist: Yes, effectively).
  2.  **Thick vs. Thin Regress:** **Reject.** This distinction is misleading. A "thin" regress is often a verbal shield for a brute fact. Whether the levels are "virtual" matters less than whether they carry ontological commitment.
      *   *Replacement:* **Explanatory Burden.** Does the proposed stopper (mode/unity) explain *why* the proposition is truth-evaluable, or does it merely assert that it is?
  3.  **Abstraction Test:** **Keep.** This is the strongest diagnostic. It cleanly separates the priority claims.
      *   *Refinement:* Specify that "independent specifiability" means specifiable *without reference to the specific proposition*, not just without reference to *any* proposition.

  **Final Note to Convener:** The dispute is not about whether there is a regress (both agree the *naive* regress is vicious), but about whether the Structuralist's "unsaturated entity" is a genuine explanation or a Primitivist's "primitive unity" in disguise. The document above forces this specific question into the open without resolving it.
