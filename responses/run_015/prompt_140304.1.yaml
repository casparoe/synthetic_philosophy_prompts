answer: |-
  ### The Matched Pair

  **Case 1: The Personal Focus Bond (Unjustified)**
  Elias, a freelance graphic designer, voluntarily enters a contract with 'LockBox', a private productivity firm. At t1, fully informed and rational, Elias transfers 20% of his projected income into a locked account. He foresees that at t2 (during work hours) he will be tempted to browse social media. The contract stipulates that if LockBox's monitoring software detects a breach, the funds are forfeited to a political cause Elias opposes. LockBox is the third-party enforcer. However, the monitoring algorithm is proprietary and opaque. At t2, Elias is the only person with a direct interest in verifying whether LockBox's flags are accurate, but he is simultaneously the party attempting to evade the restriction. He cannot effectively audit the enforcer without admitting to the very breach he is trying to contest. LockBox has a financial incentive to flag borderline activity to retain the contract fees. Because there is no disinterested party capable of monitoring the enforcer during the restriction period, the arrangement creates a moral hazard that undermines Elias's actual interests at t2, rendering the precommitment unjustified despite his t1 consent.

  **Case 2: The Institutional Capital Lock (Justified)**
  'Haven', a small housing charity, amends its governing document to require that its endowment capital remain in low-risk bonds. At t1, the current Trustees, fully informed, foresee that future Trustees at t2 may be tempted to gamble on high-yield equities to boost short-term grant-making. To change this rule requires a two-thirds vote and a six-month cooling-off period, enforced by an external regulatory auditor. Crucially, the charity's long-term tenants (the beneficiaries) have a statutory right to receive audit reports and lodge formal objections with the regulator. At t2, while the Trustees are tempted to renege, the tenants' interest in the security of the capital remains stable and distinct from the Trustees' temptation. The tenants constitute a disinterested monitoring class capable of checking whether the auditor is enforcing the rule correctly. Because the enforcement mechanism is subject to oversight by a party whose interests align with the t1 mandate but who is not subject to the t2 temptation, the entrenchment secures reliance interests without creating unchecked power, rendering it justified.

  ### Theoretical Verdicts

  Under the **Diachronic Autonomy (Extended-Will) account**, precommitment is justified insofar as it allows an agent's rational will to extend across time. Applied to the pair above, this account yields the *standard* pairing: it validates Elias's Focus Bond (his t1 will binds his t2 self) but rejects Haven's Capital Lock (future Trustees are distinct legal persons, so this is impermissible dead-hand control). Consequently, the Diachronic account fails to capture the intuitive verdicts of these specific cases; it endorses the personal case despite the enforcer abuse, and rejects the institutional case despite the protective monitoring.

  Under the **Contemporaneous-Incentive account**, precommitment is justified only if it successfully restructures incentives for present agents without creating worse downstream distortions. Applied here, this account yields the *reversed* pairing: it rejects Elias's Focus Bond because the incentive structure invites enforcer exploitation (a net negative utility), but validates Haven's Capital Lock because the presence of the tenants stabilises the incentive environment against the Trustees' risk-seeking. This account aligns with the verdicts in the matched pair, demonstrating that the justification turns not on the identity of the binder, but on the stability of the enforcement environment.

  ### The Structural Feature

  The single structural feature doing the work is **the Separation of Monitoring Interest from Tempted Agency**.

  In the Personal case, the binder (Elias) is the only monitor, but at t2 he is compromised by the temptation the rule is meant to restrain. He cannot police the enforcer without compromising his own position. In the Institutional case, the binders (Trustees) are tempted at t2, but the monitors (Tenants) are not. The monitoring interest is structurally separated from the tempted agency. This ensures that the third-party enforcer remains accountable to someone who still wants the rule to hold.

  ### The Collapse Test

  If we remove this feature from the Institutional case—suppose the tenants have no right to audit or object—the Capital Lock collapses into standard dead-hand control. The auditor answers only to the Trustees, who at t2 want to break the rule. The verdict flips back to the standard assumption: **Unjustified**.

  If we add this feature to the Personal case—suppose Elias appoints a trusted guardian with the right to audit LockBox's logs, whose financial interest is tied to Elias's long-term welfare—the Focus Bond becomes a protective measure. The guardian can check the enforcer while Elias is compromised. The verdict flips back to the standard assumption: **Justified**.

  ### The Strongest Objection

  A defender of the Diachronic Autonomy account would attack the reliance on external monitoring as a category error. They would argue: "You have conflated the *validity* of the commitment with the *administration* of the contract. If Elias's t1 will is truly autonomous, the risk of LockBox's malfeasance is a commercial risk he accepted, not a philosophical defect in precommitment. By insisting he needs a guardian to validate his own will, you treat the adult self as a minor incapable of managing their own enforcement. Autonomy requires that I bear the consequences of my own binds, even the ones where the enforcer cheats. To demand a disinterested monitor is to say I am not allowed to bind myself unless I am also watched; that is not autonomy, it is paternalism disguised as procedure."

  ### Honesty Check

  Have I rigged this? Partly, but instructively. I have selected cases where the enforcement mechanism is the variable, rather than the nature of the bind itself. In the real world, personal precommitment devices (like savings bonds) often *do* have regulatory oversight (FSCS, banking laws), which is why we usually think they are fine. I stripped that away for Elias to make the point. Conversely, institutional entrenchment often *lacks* beneficiary oversight, which is why we usually think it is bad. I added it for Haven.

  However, this does not invalidate the insight; it clarifies it. The pair shows that the standard intuition (Personal=Good, Institutional=Bad) is actually a proxy for a deeper structural reality: we tolerate personal binds because we assume the state regulates the enforcers, and we fear institutional binds because we assume no one regulates the trustees. When you swap those regulatory assumptions, the verdicts swap. So, you haven't just rigged two cases; you've identified that the 'dead hand' worry is often actually a 'lack of oversight' worry in disguise. Your hunch about monitoring was correct.
