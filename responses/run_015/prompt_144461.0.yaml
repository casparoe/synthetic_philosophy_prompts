answer: |-
  # Specification for a Theory of Valid Consent

  ## I. Desiderata and Motivating Cases

  **D1. Non-Deceptive Materiality**
  *   **Requirement:** Consent is invalid if obtained via falsehoods regarding the *nature* of the act or the *identity* of the agent, but the theory must specify the threshold for falsehoods regarding *consequences* or *welfare*.
  *   **Motivating Case:** Distinguishing between a surgeon claiming to perform a life-saving operation (nature of act) versus a surgeon exaggerating the success rate of a known procedure (welfare interest). The former vitiates consent entirely (battery); the latter requires a threshold of materiality to avoid invalidating all optimistic salesmanship.

  **D2. Structural Non-Coercion**
  *   **Requirement:** Consent is invalid if obtained through direct threats, but the theory must account for "dependency-based structural coercion" where no explicit threat is made, but the power differential eliminates reasonable alternatives.
  *   **Motivating Case:** Distinguishing between "Sign this or I shoot you" (direct threat) versus "Sign this arbitration clause or you cannot access the only healthcare network in your rural region" (structural dependency). The latter lacks a threatener but produces a similarly constrained will.

  **D3. Threshold Competence**
  *   **Requirement:** The consenter must possess the capacity to understand, appreciate, reason, and communicate a choice at the moment of agreement. The theory must distinguish temporary impairment from enduring incapacity.
  *   **Motivating Case:** Distinguishing between a patient consenting while under the influence of sedatives (temporary impairment) versus a patient with advanced dementia (enduring incompetence). The former requires delay; the latter requires proxy mechanisms.

  **D4. Opacity Transparency (Boundary Condition: Manufactured Opacity)**
  *   **Requirement:** Consent is invalid if the information environment is structured to render relevant alternatives cognitively unavailable, even if no false statements are made. The theory must address choice architecture that exploits cognitive biases to hide opt-outs.
  *   **Motivating Case:** A software terms-of-service agreement where the "Accept" button is prominent and green, while the "Decline" option is hidden within three layers of gray-text menus. The option exists (no lie), but the environment is manufactured to make it cognitively invisible to a reasonable user.

  **D5. Temporal Validity (Boundary Condition: Competence Drift)**
  *   **Requirement:** The theory must adjudicate validity when decision-making capacity changes between the moment of agreement (T1) and the moment of action (T2), without intervening revocation. It must weigh the authority of the prior competent self against the welfare of the current incompetent self.
  *   **Motivating Case:** A psychiatric patient signs an advance directive during a lucid interval requesting medication during future psychotic episodes. When psychosis returns (competence drift), they resist treatment. Validity hinges on whether the T1 signature binds the T2 self despite the T2 self's inability to understand or revoke.

  ---

  ## II. Negotiability Flags

  **Non-Negotiable (Foundational to Autonomy)**
  *   **N1. No Direct Force or Fraud on Nature:** Any theory respecting autonomy must invalidate consent obtained through physical force or lies about what the act *is* (D1, part 1). To allow otherwise is to treat the agent as a tool rather than a chooser.
  *   **N2. Minimum Threshold Competence at T1:** There must be *some* baseline capacity at the moment of agreement. A theory allowing consent from agents totally devoid of understanding (e.g., infants, comatose patients) without proxy mechanisms ceases to be a theory of *consent* and becomes a theory of *best interests*.
  *   **N3. Possibility of Refusal:** There must be at least one cognitively accessible pathway to refuse. If refusal is physically impossible or cognitively hidden (extreme Manufactured Opacity), there is no choice to be made.

  **Camp-Specific Preferences (Contested Ground)**
  *   **C1. Scope of Disclosure (Information vs. Understanding):**
      *   *Preference A:* Requires full disclosure of all risks (Subjective Standard).
      *   *Preference B:* Requires disclosure of what a "reasonable person" would want to know (Objective Standard).
      *   *Conflict:* Preference A respects individual idiosyncrasies but creates impossible burdens on consent-givers; Preference B is efficient but may ignore specific agent values.
  *   **C2. Structural Dependency (Vitiation vs. Mitigation):**
      *   *Preference A:* Treats severe structural dependency as automatically vitiating consent (e.g., prisoner research bans).
      *   *Preference B:* Treats dependency as a conditioning factor requiring enhanced safeguards but allowing consent (e.g., employee wellness programs).
      *   *Conflict:* Preference A protects the vulnerable but may paternalistically deny them beneficial options; Preference B allows access but risks exploitation.
  *   **C3. Competence Drift (Prior Authority vs. Current Welfare):**
      *   *Preference A:* Honors the T1 competent self's prior consent (Ulysses Contract).
      *   *Preference B:* Prioritizes the T2 self's current experiential welfare and dissent.
      *   *Conflict:* Preference A preserves narrative autonomy over time; Preference B protects the immediate experiential interests of the vulnerable present self.

  ---

  ## III. Suspected Conflicts (Jointly Unsatisfiable Requirements)

  **Conflict Set 1: The Opacity-Disclosure Paradox**
  Protecting against **Manufactured Opacity (D4)** demands expanding disclosure obligations to ensure all alternatives are cognitively available. However, in **Dependency Relationships (D2/C2)**, overwhelming a vulnerable agent with complex disclosures to fix opacity can itself become coercive. If a dependent agent (e.g., a low-income borrower) is presented with exhaustive fine print to ensure "transparency," the cognitive burden may function as a barrier to access, effectively coercing them into the default option to avoid the stress of comprehension. Thus, maximizing transparency to fix opacity may inadvertently increase structural coercion.

  **Conflict Set 2: The Drift-Welfare Dilemma**
  Honoring **Prior Consent during Competence Drift (D5/C3-A)** conflicts with protecting **Current Welfare (C3-B)**. If a theory prioritizes the binding nature of the T1 signature to respect autonomy over time, it may mandate actions (e.g., forced medication, institutionalization) that cause acute distress to the T2 self who cannot understand the justification. Conversely, prioritizing the T2 self's immediate welfare invalidates the T1 self's planning autonomy. A theory cannot simultaneously maximize the authority of the past competent self and the protection of the present incompetent self when their preferences diverge.

  **Conflict Set 3: The Epistemic Feasibility Trap**
  Excluding **All Deception regarding Consequences (D1/C1-A)** requires an epistemic standard that eliminates consent in ordinary contexts. If valid consent requires the agent to truly understand all probabilistic outcomes without optimistic framing, most medical and commercial transactions become impossible. Agents rely on heuristics and trust. A theory that demands perfect epistemic alignment between consenter and consentee to avoid "deception by omission" or "optimistic framing" renders consent theoretically pure but practically non-existent, collapsing the distinction between valid consent and no interaction at all.

  ---

  ## IV. Theoretical Scorecard

  **Informed-Consent Models**
  These models perform well on **D1 (Non-Deceptive Materiality)** and **D3 (Threshold Competence)** by establishing clear checklists for disclosure and capacity assessment. They struggle significantly with **D4 (Manufactured Opacity)** because they focus on the *transfer* of information rather than the *structure* of the environment; a signed form validates consent even if the options were architecturally hidden. They also falter on **D5 (Competence Drift)**, typically treating consent as a discrete event rather than a temporal process, often defaulting to legalistic enforcement of prior signatures without adequate mechanisms for assessing current dissent.

  **Pure Voluntariness Accounts**
  These accounts excel at identifying **D2 (Direct Coercion)** by focusing strictly on the freedom of the will from external force. However, they perform poorly on **D2 (Structural Coercion)** and **D4 (Manufactured Opacity)** because they tend to view market conditions or information architectures as background facts rather than coercive constraints. As long as no gun is held to the agent's head, voluntariness accounts often validate consent even in highly manipulative environments. They are similarly ill-equipped for **D5 (Competence Drift)**, as they lack a robust theory of how "will" persists or changes across shifts in cognitive capacity.

  **Relational-Autonomy Theories**
  These theories offer the strongest framework for **D2 (Structural Coercion)** and **D4 (Manufactured Opacity)** by analyzing the power dynamics and social contexts that shape choice. They recognize that dependency and information architecture constitute the agent's capacity to choose. However, they score lower on **N1 (No Direct Force)** boundaries and **D5 (Competence Drift)** enforceability. By emphasizing the fluidity of relationships and context, they risk making the boundaries of valid consent too porous for practical application, potentially undermining the stability required for prior directives to function or allowing too much third-party intervention in the name of "supporting" autonomy.
