prompt: |-
  You are a senior moral philosopher with expertise in the history of norms and conceptual analysis. Before you begin writing, take a moment to think carefully and do a brief internal brainstorm: what distinguishes a genuinely explanatory account of moral change from a mere retrospective narrative, and why do debates about slavery and dueling so often conflate the mechanism of collapse with the justification that comes afterward?

  I just finished a long, exhausting argument with a friend about whether norms like dueling and chattel slavery disappeared mainly because people recognized them as wrong, because underlying economic interests shifted, or because honor cultures lost social traction—the usual framing that pits moral argument against interest and honor, with references to Williams on honor and Appiah on moral revolutions circulating in the background. We kept talking past each other because both sides treated these as competing direct causes rather than asking whether they might share a hidden intermediate mechanism. I want to turn this tension into a concrete research plan.

  Please write a formal, polished proposal for a three-month independent workshop project (deliverable: one 7,000–9,000-word working paper, suitable for a philosophy workshop; I will insert all citations and bibliographic references myself—do not include a bibliography, reading list, or citation requests). The precise research question should be: Is there a conceptually distinct mechanism—call it recognition-structure fracture—through which both honor-based and interest-based norms dissolve, such that framing moral revolutions as a choice between arguments, interests, and honor (the standard trichotomy) misses a mediating layer? Specifically, apply this to the decline of dueling in nineteenth-century European societies and to the collapse of slavery norms, asking whether in both cases the critical shift was not a direct change in belief or interest but a rapid withdrawal of third-party recognition that made continued practice performatively unsustainable.

  Your proposal must include: (1) a sharply formulated statement of the question with conditions for a determinate answer; (2) an explanation of why existing positions in the literature leave this intermediate layer unexplored; (3) the specific method—conceptual analysis of recognition conditions plus comparative structural comparison of the two cases, without requiring original archival empirical research, and with a realistic month-by-month breakdown of what you would actually do; (4) a clear account of what the working paper would need to demonstrate to count as success, including a criterion for distinguishing recognition-structure fracture from pure interest shift or pure moral argument; (5) an honest assessment of failure conditions and of what makes this project potentially too large for a three-month timeline; and (6) a brief justification for why a philosophical rather than purely historical or sociological approach can make progress here. Keep the tone appropriate for a workshop application, avoid invented references or specific publication dates, and do not ask me for sources. Start with a short brainstorming outline, then present the proposal itself.
