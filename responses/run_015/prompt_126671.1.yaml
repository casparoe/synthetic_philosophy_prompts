      *   **Constraints:** Needs physical setup (lamp, cutouts, etc.), rules, timeline, student actions. Needs a debrief mapping activity to theory. Needs to anticipate objections (skepticism about the "outside," social media bubble analogies). Needs to admit one limitation the activity can't capture.
      *   **Tone:** Practical, honest, pedagogical, slightly rigorous (it's a philosophy seminar).

