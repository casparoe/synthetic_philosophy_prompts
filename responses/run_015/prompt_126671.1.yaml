      *   *Point 2 (Incommensurability/Return):* When the philosopher returns, they use the same vocabulary. If I say "This is a *real* dog" (Form) vs. "That is a *shadow* dog," the prisoners hear "That shadow over there is not a dog." The activity needs a moment where a "returned" student tries to describe something new using old labels, and the "prisoners" reject it as wrong *by their standards*.

