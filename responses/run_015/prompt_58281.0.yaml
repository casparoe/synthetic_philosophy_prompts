      *   *Boredom vs. Killing:* The moral weight is incomparable.
      *   *Amateur Trustworthiness:* "Trustworthy" to do what? Follow orders? Yes. Restrain aggression? Not necessarily.

  7.  **Step 5: Conclusion on the Neighbor's Argument:**
      *   The analogy is poetic but structurally flawed. It holds up on "civic duty" but fails on "mechanism of control" and "nature of risk."
