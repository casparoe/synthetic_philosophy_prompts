      *Let's select the "Volunteer Fire Department" (but mandatory) or "Civil Defense" as the alternative.* Civil Defense is better because it implies state mandate. Let's use **Civil Defense / Disaster Response**. It fits the "neutral/home defense" vibe perfectly.

      *Wait, one more thought:* The prompt asks about "everyday institution." Jury duty is legal. What's another civic duty? **Mandatory Schooling.** It's compulsion for a public good. But it doesn't fit the "risk" aspect.
      **Mandatory Vaccination** fits the "bodily integrity for public good" but lacks the "service" aspect.
      Let's stick with **Civil Defense/Disaster Service**. It's close enough to military but distinct enough to highlight the "defense only" aspect. Or perhaps **Taxation** is the most honest analogy. I will offer Taxation as the *economic* analogy and Civil Defense as the *service* analogy. Actually, the prompt asks for *an* institution. I'll choose **Civil Defense** because it mirrors the "home defense" constraint better.

      *Re-evaluating the "Obedience vs Judgment" point:* This is the strongest philosophical objection. Jurors are sovereign. Soldiers are subjects. This fundamentally breaks the "democratic control" argument. I need to emphasize this.

      *Re-evaluating the "Neutrality" point:* The neighbor says conscripts *can't* be sent abroad. That's a legal choice, not a structural one. Switzerland sends peacekeepers. Israel sends conscripts into occupied territories. The structure doesn't guarantee neutrality. I need to point this out.

