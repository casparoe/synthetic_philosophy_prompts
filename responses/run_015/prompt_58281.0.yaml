      *(Self-Correction during drafting)*: I need to make sure I don't sound condescending about the "no university education" part. The user's question is sophisticated. I should treat them as an intellectual equal.
      *(Refining the Neutrality Point)*: I need to be careful not to take a political stance on whether conscription *is* better, but rather whether the *jury analogy* proves it. The historical record shows citizen armies can be very aggressive (France 1790s). I must highlight this.
