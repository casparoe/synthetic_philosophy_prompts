      *   *Wait, let's look for an institution of service.* **The Volunteer Fire Department (but made mandatory).** In many small communities, everyone helps fight fires. It's defensive, local, and skill-based but not "professional."
      *   *Refinement:* The prompt asks for an everyday institution. **Mandatory Civil Defense (like Switzerland's shelter system).** Everyone has a role in survival, not fighting.
      *   *Decision:* The **Volunteer Fire Department** is the closest cultural touchstone, but since the user asks about *compulsion*, maybe **Mandatory Evacuation or Shelter Duty**.
