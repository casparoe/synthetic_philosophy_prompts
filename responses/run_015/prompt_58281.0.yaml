      *   *Risk/Burden:* Boredom/Time vs. Death/Trauma/Moral Injury. (Major Mismatch)
      *   *Purpose:* Justice/Check on state power vs. Defense/State monopoly on violence. (Partial Match on "Check on power")

  4.  **Step 2: Identify Where the Parallel Fails:**
      *   *Obedience vs. Judgment:* Jurors are *paid* to judge independently. Soldiers are *paid* (or compelled) to obey orders. This is a fundamental structural difference.
      *   *Nature of Burden:* Jury duty is an inconvenience. War is existential.
      *   *Amateur Status:* Does an amateur army prevent war? History suggests citizen armies can be quite nationalist/aggressive (e.g., Napoleonic France, US Civil War). Professional armies can be restrained (e.g., post-WWII Germany).
      *   *Deployment:* Jurors serve locally. Conscripts *can* be deployed abroad (depending on law), but the neighbor argues the *structure* prevents it. Is that true?

  5.  **Step 3: Distinguish Undermining Failures vs. Incidental Failures:**
