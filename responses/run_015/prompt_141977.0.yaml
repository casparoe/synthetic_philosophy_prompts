  **Office of Descriptive Standards**
  **The Plain Neural Style Guide (4th Ed.)**

  **Prefatory Note**
  This edition supersedes all prior manuals regarding propositional attitude attribution. The State recognizes that while neural states are ontologically robust, folk-psychological constructs (belief, desire, intent) are relics of a pre-scientific theory comparable to humours or elemental balances. Retention of this vocabulary impedes accurate social modeling and perpetuates explanatory errors woven into grammar. Writers are reminded that difficulty with these substitutions indicates residual attachment to the old theory, not deficiency in the new vocabulary. Compliance ensures descriptive hygiene. We understand the old terms feel natural; they also felt natural when bloodletting was standard practice. Your task is not to express what agents feel they are doing, but to describe what their nervous systems are actually doing. The following entries address common points of resistance.

  **COMPOUND ATTITUDES**
  **Banned:** Molecular combinations of belief and desire (e.g., "wanting X because Y").
  **Approved:** Single-state vector identifiers.
  **Note:** As atomic states cannot be decomposed without error, each configuration requires a unique term.
  **Noncompliant:** "She wanted to leave because she believed it was unsafe."
  **Compliant:** "She occupied Unsafe-Exit-Vector-442."
  **Noncompliant:** "He wanted to stay because he believed it was safe."
  **Compliant:** "He occupied Safe-Stay-Vector-109."
  **Usage:** Consult the Lexicon for specific vector IDs. Do not attempt to construct these from parts; the topology is non-compositional. Expanding the dictionary is preferable to retaining false syntax.

  **MEANING**
  **Banned:** References to semantic content or intentionality.
  **Approved:** References to causal covariance.
  **Note:** A sentence does not mean anything; it triggers specific activation patterns.
  **Noncompliant:** "This word means 'danger'."
  **Compliant:** "This word covaries with danger-states."
  **Noncompliant:** "He intends to signal stop."
  **Compliant:** "He intends to emit stop-signals." (See: Intention)
  **Usage:** Avoid implying the writer means to convey a proposition. The text simply causes neural adjustments in the reader. Do not attribute content where there is only causation.

  **CAUSAL CONJUNCTIONS**
  **Banned:** "Because," "therefore," "so" (when implying reason).
  **Approved:** "Sequential to," "adjacent to," "following."
  **Note:** Reasons are not causes. Events merely follow other events in time.
  **Noncompliant:** "She voted for him because she thought he was honest."
  **Compliant:** "Her thought of honesty was sequential to her vote for him."
  **Noncompliant:** "He stole because he was hungry."
  **Compliant:** "His hunger-state was adjacent to his stealing-trajectory."
  **Usage:** Do not imply the thought justified the act. The thought merely preceded it. Normative gaps are explanatory errors. The sequence is real; the justification is not.

  **FORECASTING**
  **Banned:** Claims that folk psychology predicts behavior accurately.
  **Approved:** Acknowledgement of heuristic utility.
  **Note:** Folk terms may predict Tuesday behavior, but this is mere pattern-matching, like weather lore.
  **Noncompliant:** "He promised, so he will come."
  **Compliant:** "He promised; historically, promising correlates with coming."
  **Noncompliant:** "She believes it will rain."
  **Compliant:** "She occupies Rain-Expectation-Vector; rain often follows."
  **Usage:** You may use folk predictions for convenience, provided you classify them as low-fidelity heuristics. Accuracy does not imply truth. We admit the old model works, but insist it is false.

  **PHENOMENAL REPORTS**
  **Banned:** "It seems," "I feel," "pain," "qualia."
  **Approved:** "Calibration error," "nociceptive firing," "sensory mapping."
  **Note:** First-person authority is a myth; the brain observes itself like any other object.
  **Noncompliant:** "It seems to me that this is wrong."
  **Compliant:** "My calibration suggests error-state regarding this."
  **Noncompliant:** "I feel pain."
  **Compliant:** "My nociceptors are firing."
  **Usage:** Avoid claiming privileged access. If the scanner says you are calm, you are calm, regardless of how it seems. The interior view is just another data stream.

  **COMMITMENTS**
  **Banned:** "Promise," "apology," "obligation."
  **Approved:** "Trajectory alignment," "regret-simulation," "social constraint."
  **Note:** Future actions are determined by physics, not words.
  **Noncompliant:** "I promise to pay you."
  **Compliant:** "I state a high-probability trajectory of payment."
  **Noncompliant:** "I apologize for hitting you."
  **Compliant:** "I register regret-simulation regarding the hit."
  **Usage:** Do not imply the words create a duty. They merely describe likely future vectors. No new obligation is created by speech.

  **INSTRUMENTALISM**
  **Banned:** "As if," "treat them as if."
  **Approved:** None.
  **Note:** Nothing acts as if it has beliefs; it either has neural states or it does not.
  **Noncompliant:** "Act as if she believes you."
  **Compliant:** "Act compatible with her belief-state vectors."
  **Usage:** Do not suggest the theory is useful but false. It is false. Full stop.

  ***

  **Note to the Author**

  The objection that bites hardest is Entry 3 (Causal Conjunctions). By replacing "because" with "sequential to," the guide eliminates the distinction between acting for a reason and merely being caused to move. This matters because it renders moral evaluation impossible; if a thief's hunger is merely adjacent to his stealing, he cannot be blamed, nor can he be reasoned with. It shows that eliminativism, when administered rigorously, dissolves the normative space required for law and literature alike.

  I have taken a liberty with Entry 2 (Meaning). While eliminativists deny propositional content, they rarely retain the word "intends" in compliant examples as casually as I have here. I kept it to highlight the self-undermining nature of the ban, but a strict eliminativist might have flagged "intends" as equally suspect. You may wish to tighten that contradiction if you want the Office to appear more consistent, though the slip serves the comedy.
