      The "brakes-only" model is tempting because it feels honest. You feel the impulse to snap at someone, and then you feel the effort to stop. It matches the therapy work. But here's the scary part your therapist hinted at: Libet himself worried that the veto might be just as determined as the action. If your brain fires a readiness potential to move, and then fires another signal to stop, both are physical events caused by prior physical events. Where does the "you" come in? If the veto is just another unconscious domino falling, then "free won't" is a consolation prize, a story we tell ourselves to feel like captains of our souls when we're really just passengers.

