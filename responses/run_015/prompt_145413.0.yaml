  4. This views consciousness as identical to the functional role of global broadcasting, making the claim a functionalist identity thesis. It is defensible within functionalism, conflates access with phenomenality by reducing the latter to the former, and addresses the evidence by categorizing the priming state as functionally non-conscious.
