  Im a philosophy professor but I cut my teeth in RL, so I think in POMDPs, policies, Q-values, and value functions. Could you restate the absent-minded driver problem, and the EDT vs CDT debate about it, in that vocabulary, as faithfully as you can? Set the driver up as a POMDP (the amnesia is what makes it partially observable) and then give me the residue report: does the "paradox" for evidential decision theory even show up in this vocabulary, or is it just an artifact of the philosophical framing? And is what doesn't translate a defect of the RL framework (it has no concept of the rationality of a decision procedure, only of the value of a policy) or a sign the philosophical debate is less substantive than it looks? My hunch is it's just a standard POMDP and the "problem" is a red herring, but I want to know if I'm missing something.
