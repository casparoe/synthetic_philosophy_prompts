answer: |-
  # Desiderata for a Theory of Proxy Failure: An Auditor's Specification

  You are asking for a causal inference engine that runs on correlational fuel. You want to predict the response of a strategic system to an intervention using only data from when no intervention occurred. This is the *Lucas Critique* applied to metric design.

  Below are the five desiderata derived from your provisional distinctions. I have vindicated, corrected, or dissolved them based on theoretical necessity. Each is marked **Non-Negotiable (NN)** if the theory is to be useful for your specific purpose (allocating capital/regulation), or **Preference (P)** if it represents a specific philosophical camp.

  ### 1. The Redeployment Gap (Predictive Divergence)
  *   **Status:** **Vindicated as NN.**
  *   **Motivation:** Your core task is risk assessment. You need to know the "break point" where $\frac{\partial \text{Target}}{\partial \text{Pressure}}$ turns negative or zero. A theory that only explains failure post-hoc is a history book, not a specification.
  *   **Correction:** You cannot demand a *point estimate* of this gap from passive data alone. The demand must be softened to: *The theory must provide a bound on the gap conditional on explicit structural assumptions.*
  *   **Prejudice Check:** You suspected the demand for a quantitative degradation threshold is an econometric prejudice. **You are correct.** Demanding a specific pressure value (e.g., "fails at 10% bonus weight") without experimental data is hubris. The theory should deliver a *qualitative topology* of the failure surface (e.g., "monotonically decreasing returns" vs. "cliff-edge collapse") rather than a scalar limit.

  ### 2. The Mechanism Triad (Drift, Erosion, Hijack)
  *   **Status:** **Dissolved into Two.**
  *   **Motivation:** You need to know if failure is fixable.
  *   **Correction:** *Drift* is exogenous (non-adaptive); *Erosion* and *Hijack* are endogenous (adaptive).
      *   **Drift:** The environment changes; the proxy decouples from the target without agent intent. (Fix: Recalibrate).
      *   **Adaptive Response:** The agent changes behavior. This splits into *Erosion* (effort substitution: doing less of the unmeasured good) and *Hijack* (direct manipulation: gaming the measure).
      *   **Why Dissolve:** For an auditor, the distinction between Erosion and Hijack is often unobservable without granular process data. Both manifest as a divergence between Indicator and Target under pressure. The theory must treat them as a single class: **Endogenous Decoupling.**
  *   **Mark:** **Preference.** (NN is distinguishing Adaptive vs. Non-Adaptive).

  ### 3. Hard vs. Construct-Deficient Targets
  *   **Status:** **Vindicated as NN (with a caveat).**
  *   **Motivation:** Most public goods (education, health, stability) are latent constructs. If the theory only works for "number of widgets produced," it is useless to you.
  *   **Correction:** For construct-deficient targets, "failure" cannot be defined as divergence from ground truth (since there is none). It must be defined as **Systemic Instability**. If the indicator defines the target, optimizing the indicator *is* optimizing the target, until the definition itself loses legitimacy or the system collapses (e.g., grade inflation renders the degree worthless).
  *   **Prejudice Check:** You suspected the requirement for a well-measured target is expensive. **It is prohibitive.** A theory that requires ground truth excludes 90% of your portfolio. The theory must handle *latent variables* where the indicator is the only observable tether to the construct.

  ### 4. Benign Pressure (Constitutive vs. Proxy)
  *   **Status:** **Vindicated as NN.**
  *   **Motivation:** You must distinguish between a thermometer (proxy) and a heater (constitutive). Pushing a thermometer doesn't change the temperature; pushing a heater does. Some indicators (e.g., vaccination rates) are partly constitutive of the target (public health).
  *   **Correction:** The theory must classify indicators by **Causal Direction**.
      *   *Type A (Reflective):* Target causes Indicator (e.g., Health causes Low Mortality). Optimizing Indicator (fudging death certs) breaks link.
      *   *Type B (Formative/Constitutive):* Indicator causes Target (e.g., Vaccination causes Herd Immunity). Optimizing Indicator reinforces link, up to saturation.
  *   **Mark:** **NN.** Without this, you will penalize constitutive indicators for looking "too good" or trust reflective indicators that are being gamed.

  ### 5. The Audit Regress
  *   **Status:** **Corrected to Boundedness.**
  *   **Motivation:** You fear an infinite hierarchy of metrics checking metrics.
  *   **Correction:** The theory does not need to say where it terminates (it terminates when cost > benefit). It must specify the **Complexity Cost** of gaming. A robust indicator is one where the cost to the agent of hijacking the metric exceeds the reward, *and* the cost to you of measuring the hijack is lower than the loss from the hijack.
  *   **Mark:** **Preference.** (NN is that the theory must account for measurement costs).

  ---

  # The Impossibility Result: The Metric Indeterminacy Theorem

  You suspected a subset of your desiderata is jointly unsatisfiable. You are right. The conflict is sharper than you anticipated.

  **The Candidate Subset:**
  1.  Predict the Redeployment Gap from **Passive Data Only**.
  2.  Make **No Untestable Assumptions** about the residual (the part of the target the indicator misses) off the observed support.
  3.  Remain informative for **Construct-Deficient Targets**.
  4.  Hold up against an **Optimiser that Models the Metric**.

  **The Impossibility:**
  You cannot satisfy (1), (2), and (4) simultaneously. (3) exacerbates the tension.

  **Proof Sketch:**
  To predict the Redeployment Gap (1), you must estimate $P(\text{Target} | do(\text{Pressure}))$. From passive data, you only observe $P(\text{Target} | \text{Indicator})$. By the **Causal Identification Problem**, you cannot derive interventional distributions from observational distributions without structural assumptions (e.g., a causal graph or invariant mechanisms).
  If you refuse untestable assumptions about the residual (2), you admit you do not know the functional form relating the Indicator to the unmeasured parts of the Target.
  If the Optimiser models the metric (4), they will exploit exactly that residual—the part of the Target *not* captured by the Indicator. They will move the system off the observed support of the passive data.
  Therefore, without assumptions about the residual (2), you cannot predict the Optimiser's path (4) or the resulting Gap (1).

  **The Trade-Off Menu:**
  You must sacrifice one. Given your role, here is the recommended sacrifice:

  *   **Sacrifice (2) [No Untestable Assumptions]:** **Recommended.** You *must* adopt structural assumptions. You must assume a causal graph (e.g., "Indicator is reflective, not formative") or a cost function for the agent (e.g., "Effort is costly"). You cannot do this purely empirically. You must bring theory to the data.
  *   **Sacrifice (1) [Predict Gap from Passive]:** **Alternative.** Admit you cannot predict the break point without a pilot intervention (A/B test the incentive). This is safer but politically costly.
  *   **Sacrifice (4) [Robust to Modelling]:** **Dangerous.** Assume agents are naive. This will lead to catastrophic failure in sophisticated sectors (finance, academia).
  *   **Sacrifice (3) [Construct-Deficient]:** **Limiting.** Restrict funding only to areas with hard ground truth. This abdicates your responsibility in social goods.

  **Verdict:** To keep the theory useful, you must accept **Structural Priors**. You cannot be a pure empiricist. You must assert, *a priori*, "We assume this indicator is reflective, not formative," or "We assume agents face diminishing returns to gaming." Without these untestable claims, the passive data is silent on the future.

  ---

  # The Single Most Exclusionary Requirement

  **Requirement:** *The theory must distinguish between Reflective (Target $\to$ Indicator) and Formative (Indicator $\to$ Target) causal structures using passive data.*

  **Why:** This excludes the vast majority of standard econometric and machine learning accounts.
  *   **Regression/ML models** treat $X$ and $Y$ as symmetric associations. They cannot distinguish cause from effect without intervention.
  *   **Goodhart's Law** traditionally assumes the indicator is reflective (measuring a pre-existing state).
  *   **Campbell's Law** assumes the indicator becomes a target (formative).
  *   **The Exclusion:** Any theory that treats the indicator merely as a "predictor" in a statistical sense fails. It must be a **Causal Theory**. If the account cannot specify the direction of causality between the latent construct and the observable metric, it cannot predict whether optimization will help (formative) or harm (reflective). This requirement kills purely correlational accounts.

  ---

  # Scoring of Theoretical Families

  | Family of Account | Score (0-5) | Critique against Desiderata |
  | :--- | :---: | :--- |
  | **Noise/Selection** (Indicator is noisy sample of Target) | 1 | Fails NN #4 (Benign Pressure). Treats all optimization as revealing truth, ignores strategic response. Cannot predict Redeployment Gap. |
  | **Causal Invariance** (Proxy-Target relation must hold under intervention) | 4 | Strong on NN #1 & #4. Fails on Construct-Deficient (NN #3) because it requires a stable ground truth $Y$ to test invariance against. |
  | **Low-Dimensional Projection** (Target is high-D, Indicator is low-D) | 3 | Good for NN #2 (Erosion). Weak on NN #1 (Gap prediction) unless agent cost function is known. Struggles with Hijack. |
  | **Effort Substitution** (Multi-task Principal-Agent) | 5 | **Best Fit.** Handles NN #1 (Gap via cost functions), NN #2 (Erosion/Hijack), NN #4 (Constitutive vs Proxy). Requires structural priors (sacrifices Impossibility Axiom 2). |
  | **Adversarial** (Agent actively minimizes your loss) | 2 | Too pessimistic for NN #4 (Benign Pressure). Assumes all pressure leads to Hijack. Fails to distinguish Drift from Gaming. |

  **Recommendation:** Adopt the **Effort Substitution** framework but enforce the **Causal Direction** constraint. You must model the organization as a multi-task agent with a cost function, but you must first classify the indicator as Reflective or Formative. This combination satisfies the Non-Negotiables while acknowledging the Impossibility Result by demanding structural priors rather than pure data.
