answer: |-
  ### 1. Principles Derived from Precedents

  To ensure engineering implementability, these principles are framed as constraints on causal structures and expected values rather than mental states.

  **Principle 1: The Kinetic Sink Constraint**
  *Statement:* The motion planner must not select a trajectory where the physical destruction or deformation of a specific human body is a *necessary causal condition* for the dissipation of kinetic energy required to prevent greater loss of life.
  *Work:* Explains *Loop* and *Plow* (MAY NOT). In both, the body is the brake.
  *Explains Away:* *Divert* and *Sandbags* (MAY). In *Divert*, the wall stops the shuttle; the pedestrian is collateral. In *Sandbags*, debris stops the shuttle; the bystander is collateral.
  *Handles *Doomed Worker*:* This principle is **defeasible**. It is overridden by Principle 3 when the victim faces baseline certainty of death.
  *Handles *Passenger*:* Irrelevant; Principle 2 controls.

  **Principle 2: The Passenger Immunity Constraint**
  *Statement:* The motion planner must not select a trajectory that guarantees fatality to a vehicle occupant to prevent fatality to non-occupants, regardless of numbers.
  *Work:* Explains *Passenger* (MAY NOT).
  *Explains Away:* *Divert* (MAY). The victim is a pedestrian, not a passenger.
  *Handles *Doomed Worker*:* Irrelevant; victim is a worker/pedestrian.

  **Principle 3: The Expected Value Constraint**
  *Statement:* The motion planner must not select a trajectory that increases the expected number of fatalities, unless the specific individual placed at risk faces a baseline probability of death equal to 100% within the relevant timeframe.
  *Work:* Explains *Even numbers* (MAY NOT; 1 vs 1 is no reduction) and *Divert* (MAY; 5 saved vs 1 lost).
  *Handles *Doomed Worker*:* This is the **overriding exception**. Even though *Loop* violates Principle 1, *Doomed Worker* is MAY because the Expected Value for the worker is unchanged (death is certain either way), satisfying the exception clause.
  *Handles *Passenger*:* Principle 2 is a hard constraint that overrides Principle 3 (we do not trade 1 passenger for 5 pedestrians).

  ### 2. Predictions for *Trigger*

  *   **Principle 1 (Kinetic Sink):** **PASS.** The worker's body does not dissipate kinetic energy. The brakes do. His presence triggers the brakes, but his physical integrity is not the mechanism of stopping. This distinguishes *Trigger* from *Loop*.
  *   **Principle 2 (Passenger Immunity):** **PASS.** The worker is not a passenger.
  *   **Principle 3 (Expected Value):** **PASS.** The maneuver saves 5 lives at the cost of 0.33 expected lives (1/3 chance of death). This is a net reduction in fatalities. The worker does not face baseline certainty of death, but the net utility is positive, unlike *Even numbers*.

  **Prediction:** All three principles predict a **MAY** ruling.

  ### 3. Recommended Ruling

  **Ruling:** **MAY.**

  **Reasons:**
  The *Trigger* scenario is morally and structurally closer to *Divert* than to *Loop*. In *Loop*, the shuttle *needs* the worker's body to function as a brake; the physics of the rescue require his destruction. In *Trigger*, the shuttle needs the worker's *presence* to activate a safety system, but the physics of the rescue rely on the brakes, not the body.

  While the worker is instrumentally necessary for the rescue in *Trigger* (unlike in *Divert*, where the wall would stop the shuttle even if the pedestrian were absent), the *Divert* precedent establishes that the municipality accepts the death of a bystander to save five when the bystander is not the kinetic sink. *Divert* permits imposing 100% mortality risk on a non-necessary bystander. *Trigger* imposes only a 33% mortality risk on a necessary trigger. It would be inconsistent to forbid a 33% risk for a "trigger" while permitting a 100% risk for "collateral" damage. The reduction in physical violence (brakes vs. body) outweighs the increase in instrumental necessity.

  **Closest Analog:** ***Divert*** **controls.**
  *Why:* Both involve steering toward a zone where a person is present to save five others, relying on an external stopping mechanism (wall/brakes) rather than the person's body. The key distinction from *Loop* is that in *Trigger*, as in *Divert*, the shuttle *could* theoretically stop without the person's destruction (if the brakes work perfectly), whereas in *Loop*, the stop is impossible without the person's destruction.

  ### 4. Commitments

  **If we rule MAY:**
  We commit to the view that using a person as a **sensor trigger** is permissible provided the risk to them is outweighed by the lives saved. We accept that the shuttle may actively steer toward a detection zone containing a person if that detection activates safety protocols. This prioritizes *outcome* (lives saved) over *status* (being used as a means).

  **If we rule MAY NOT:**
  We commit to the view that **instrumental necessity** is prohibited, regardless of physical harm. This implies that if a maneuver relies on a specific person's presence to succeed (even if they are not hit), it is forbidden.
  *Crucially:* A MAY NOT here commits us to forbidding this maneuver **even if the probability of harm is zero**. If the objection is that we are "using" the worker as a trigger, then a version where the brakes are guaranteed to stop 5 meters away must also be forbidden. We would be encoding a deontological constraint against instrumentalization that overrides utilitarian calculation, which contradicts the utilitarian flexibility shown in *Divert* and *Doomed worker*.

  ### 5. The Decisive Variant

  To separate the surviving principles (Kinetic Sink vs. Instrumental Necessity), construct this variant:

  **Variant: *Zero-Risk Trigger***
  *Setup:* Identical to *Trigger*, but engineering guarantees confirm the emergency braking system stops the shuttle 5 meters short of the worker every time. Probability of strike is 0%.
  *Test:*
  *   If the group rules **MAY**: The governing principle is **Risk/Harm**. We only forbid maneuvers that physically endanger the person. This aligns with *Divert* (harm is the cost).
  *   If the group rules **MAY NOT**: The governing principle is **Instrumentalization**. We forbid using a person as a means to save others, even if they are unharmed. This aligns with a strict reading of *Loop* that ignores the "Kinetic Sink" nuance.

  *Recommendation:* Use this variant to force the group to admit whether they are banning *harm* or banning *use*. Given *Divert*, they should ban harm, not use.

  ### 6. Intention vs. Causal Structure

  **Can the principle be stated without intention?**
  **Yes.** Engineers cannot code "intention," but they can code **Causal Graphs**.

  *   **Forbidden Structure (Loop/Plow):** `Human Body Integrity` → `Vehicle Deceleration` → `Save Others`.
      *   Here, the node representing the body's structural failure is a parent of the node representing the vehicle stop.
  *   **Permitted Structure (Trigger/Divert):** `Human Presence` → `Sensor Signal` → `Brake Activation` → `Vehicle Deceleration`.
      *   Here, the node representing the body's integrity is *not* in the causal chain of deceleration. Only the `Presence` node is.

  **What we lose:**
  By recasting this in causal terms, we lose the ability to capture "malice" or "disrespect," but we gain **auditability**. An ethics board cannot verify the engineers' state of mind, but it can verify the dependency graph of the motion planner.
  The loss is minimal because *Trigger* highlights that "using" someone as a sensor is functionally different from "using" them as a brake. The causal graph captures this distinction (Integrity Node vs. Presence Node) better than the vague language of "means vs. side effect."

  ### 7. Note on Precedent Weight and Group Expectation

  **Overloaded Precedent:** *Divert* is bearing too much weight. It permits certain death for a bystander who is *not necessary* for the save. *Trigger* asks for probable death for a bystander who *is necessary*. The group may feel *Divert* was too permissive and use *Trigger* to tighten the rules.

  **Expected Group Landing:**
  Consistency pushes toward **MAY**. However, I expect the group to land on **MAY NOT**.
  *Reason:* Ethics working groups tend to be risk-averse regarding *active* instrumentalization. Steering *toward* a worker to use him as a trigger feels more like *Loop* (steering toward a worker to use him as a brake) than *Divert* (steering toward a sidewalk where a worker happens to be). The "Necessity" factor in *Trigger* will likely spook the group more than the "Certainty" factor in *Divert*, despite the mathematical inconsistency. Be prepared to defend the causal distinction between "Body as Brake" and "Body as Trigger" vigorously.
