answer: |-
  **MEMORANDUM**

  **TO:** Clinical Taxonomy and Ethics Board; Department of Psychiatry; Peer Advocacy Center
  **FROM:** Office of Clinical Ethics and Taxonomy
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Proposal for "Institutional Betrayal Trauma" (IBT) Classification and Intake Protocol

  **RECOMMENDATION**

  The Clinical Taxonomy and Ethics Board recommends **Conditional Approval** of the Peer Advocacy Center's proposal to recognize "Institutional Betrayal Trauma" (IBT) as a distinct intake and billing category. This approval is granted for a **six-month pilot program** commencing Q3, contingent upon the immediate suspension of the "pre-betrayal sensitivity" algorithmic scoring tool and the implementation of specific data safeguards.

  We do not recommend full, indefinite adoption at this time, nor do we recommend rejection. Rejection risks epistemic erasure of valid patient harm; unconditional adoption risks reflexive institutional harm via classification effects. The pilot structure allows us to validate patient experience while monitoring the ethical risks of categorization.

  **CONTEXT AND RATIONALE**

  The Peer Advocacy Center proposes that standard PTSD frameworks fail to capture distress specifically generated by the violation of trust within the care system itself. Recognizing IBT allows for targeted treatment pathways and acknowledges that the therapeutic environment can be a source of injury.

  However, the Board identifies a significant ethical complexity regarding the *creation* of this category. We are guided by two competing ethical imperatives:

  1.  **Epistemic Justice:** Refusing to name a specific harm renders it invisible to the clinical eye. If patients experience betrayal by the institution but are coded only for general PTSD, their treatment plan may fail to address the rupture in trust, leading to disengagement and poorer outcomes. To deny the code is to risk gaslighting patients by subsuming institutional failure under individual pathology.
  2.  **Reflexive Harm (Looping Effects):** As noted in the proposal review, diagnostic categories are not passive maps; they reshape the territory. Adopting IBT creates a "looping effect" where patients may begin to interpret ambiguous clinical interactions through the lens of betrayal because the category now exists. Clinicians may also begin to select for this diagnosis, potentially pathologizing legitimate grievances or, conversely, overlooking individual psychopathology by attributing all distress to the institution.

  **THE "PRE-LOOPING" RISK**

  A critical concern raised during review involves the piloted digital intake tool designed to assign "pre-betrayal sensitivity" risk scores. This tool attempts to identify patients at risk of experiencing institutional betrayal *before* symptoms fully manifest.

  The Board classifies this as "pre-looping." By algorithmically categorizing a patient as "sensitive to betrayal" prior to a clinical encounter, the system primes the clinical team to view the patient as a potential litigant or adversary, and primes the patient to scan for betrayal. This does not merely map risk; it manufactures the conditions for the harm it predicts. It creates a self-fulfilling prophecy where the institution, by looking for betrayal, signals that betrayal is expected.

  **CONDITIONS FOR PILOT APPROVAL**

  To proceed with the IBT classification while mitigating the risks outlined above, the following conditions must be met for the six-month duration (Q3–Q4):

  1.  **Suspension of Predictive Scoring:** The "pre-betrayal sensitivity" algorithmic tool is **prohibited** for use during this pilot. IBT classification must be based on retrospective clinical assessment of reported events and symptoms, not probabilistic risk scoring prior to care delivery. We cannot ethically label patients with a susceptibility to institutional harm before the institution has had the opportunity to provide harm-free care.
  2.  **Blind Billing Protocols:** For billing purposes, the IBT code must be decoupled from public-facing insurance explanations of benefits where possible, to prevent patients from being stigmatized by payers as "troublemakers." Internally, the code must not trigger automatic legal or risk-management flags that would alter the clinician's defensive posture, as this would itself constitute an institutional betrayal.
  3.  **Independent Oversight Committee:** A review sub-committee comprising two Board members, two Peer Advocacy representatives, and one external bioethicist (unaffiliated with the hospital) will meet monthly. They will review:
      *   Rates of IBT coding vs. PTSD coding.
      *   Patient retention rates in the trauma unit.
      *   Any correlation between IBT coding and discontinuation of care.
  4.  **Clinician Training on Reflexivity:** All providers authorized to use the IBT code must complete a module on "Diagnostic Reflexivity." This training will explicitly address the looping effect, instructing clinicians to distinguish between *identifying* harm and *suggesting* harm through the framing of the diagnosis.

  **ADDRESSING THE COUNTER-ARGUMENT**

  A significant minority on the Board argued for total rejection of the IBT category. Their position is that because this institution is the potential defendant in cases of betrayal, codifying the harm creates an unavoidable conflict of interest. They argue that adopting the code invites liability and potentially amplifies patient suspicion, thereby worsening the very trust deficit we aim to repair.

  While this concern regarding reflexive harm is valid, the Board concludes that the risk of **misrecognition** outweighs the risk of **looping**.

  If we reject the category to protect the institution from the *appearance* of harm, we prioritize institutional reputation over patient reality. Patients who have experienced genuine negligence, dismissal, or procedural violence will still carry that trauma. Forcing that experience into a standard PTSD box treats the symptom while ignoring the etiology. This is clinically ineffective and ethically untenable. We cannot solve the looping problem by silencing the patient. We solve it by implementing the code responsibly, with the safeguards listed above, ensuring the category serves the patient's healing rather than the hospital's liability management.

  **TIMELINE AND NEXT STEPS**

  *   **Immediate:** Peer Advocacy Center and IT to disable "pre-betrayal" scoring module.
  *   **Weeks 1–4:** Development of Clinician Reflexivity Training module.
  *   **Q3 Start:** Pilot launch of IBT intake/billing category.
  *   **Month 3:** Interim review by Independent Oversight Committee.
  *   **Month 6:** Full Board review to determine whether to sunset, extend, or permanently adopt the classification.

  We believe this path honors the lived experience of our patients without surrendering our ethical duty to monitor how our own classifications shape clinical reality.

  **APPROVED BY:**

  *Clinical Taxonomy and Ethics Board*
