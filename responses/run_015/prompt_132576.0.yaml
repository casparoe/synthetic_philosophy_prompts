answer: |-
  # Seminar Activity: The Token Stack & The Sealed Envelope

  **Session Duration:** 75 Minutes
  **Participants:** 14 Graduate Students (7 Pairs)
  **Materials:**
  *   7 Sets of "Game Kits" (one per pair).
  *   Each Kit contains:
      *   1 Stack of 20 physical tokens (poker chips or colored paper discs).
      *   1 Score Sheet (pre-printed with Payoff Table).
      *   1 "Termination Envelope" (sealed, labeled **DO NOT OPEN UNTIL PHASE 2**).
      *   2 Decision Slips (for Phase 1).
      *   2 Commitment Cards (for Phase 3).
      *   1 Pen.
  *   Whiteboard/Projector for timer and phase announcements.

  ---

  ## Part 1: Instructor Setup & Rules (5 Minutes)

  **Instructor Script (Read Exactly):**
  "Welcome. Today we are engaging in a structured strategic interaction. There will be no lecture at the start. Your goal is to maximize your individual point total by the end of the session. Points may be converted to extra credit or simply recorded for seminar standing.

  You are working in pairs. You share a visible stack of tokens. The game proceeds in Rounds.
  1.  **Growth:** At the start of Round 1, the stack has 20 tokens. If **both** of you choose to **BUILD**, 2 tokens are added to the stack for the next round.
  2.  **Banking:** In any round, **either** player may unilaterally choose to **BANK**. This ends the game immediately.
  3.  **Split:** If the game ends by Banking, the player who chose BANK receives 60% (3/5) of the current stack. The other player receives 40% (2/5). Use the Payoff Table in your kit to calculate points; do not do mental math.
  4.  **Auto-End:** If you reach Round 5 and both choose BUILD, the game ends automatically. The stack is split 50/50.
  5.  **The Envelope:** Each pair has a sealed Termination Envelope. It contains a rule specific to your pair. **You are forbidden from opening this envelope until Phase 2 begins.** Violating this invalidates your score.

  We will proceed in three phases. Phase 1 is silent. Phase 2 allows talk. Phase 3 is private commitment. Begin Phase 1 now."

  ---

  ## Part 2: The Activity (45 Minutes)

  ### Phase 1: Silent Interaction (15 Minutes)
  *   **Constraint:** No verbal communication. Partners may exchange written notes or gestures only.
  *   **Task:** Play Rounds 1 and 2.
  *   **Procedure:**
      1.  Partners sit facing each other with the token stack between them.
      2.  To **BUILD**: Both place a thumb on the table simultaneously. Add 2 tokens to the stack.
      3.  To **BANK**: One player taps the stack and slides it toward themselves. Consult Payoff Table, record scores, game ends for that pair.
      4.  If both Build in Round 2, they proceed to the threshold of Round 3.
  *   **Instructor Role:** Circulate silently. Ensure no envelopes are opened. If a pair banks, they stop playing and observe others.

  ### Phase 2: Negotiation & Revelation (20 Minutes)
  *   **Constraint:** Verbal communication is allowed.
  *   **Task:** Open Envelopes. Decide on Round 3 action.
  *   **Procedure:**
      1.  Announce: "Phase 2 begins. You may now open your Termination Envelopes."
      2.  **Envelope Contents (Distribute randomly):**
          *   *Type A (4 Pairs):* "Standard Rule: The game proceeds to Round 5 as per base rules."
          *   *Type B (3 Pairs):* "Collapse Rule: If the stack grows past 24 tokens (end of Round 3), the stack is forfeited (0 points for both)."
      3.  Pairs read the rule. They must now decide whether to Build or Bank in Round 3.
      4.  **Tension Point:** Type B pairs realize that Building in Round 3 is fatal. They may feel regret for Building in Rounds 1 & 2. Type A pairs realize they are safe to continue.
      5.  They execute Round 3. If they Build, they proceed to Phase 3. If they Bank, they stop.

  ### Phase 3: Private Commitment (10 Minutes)
  *   **Constraint:** No communication. Private writing.
  *   **Task:** Commit to Rounds 4 and 5.
  *   **Procedure:**
      1.  Announce: "Phase 3. If your game is still active, you must now write your decision for the remainder of the game on the Commitment Card. You cannot change this. You cannot talk to your partner."
      2.  Students write: "I will BUILD until Round 5" OR "I will BANK in Round 4."
      3.  Collect cards. Reveal choices simultaneously. Resolve final payoffs.
      4.  Record final scores on the board.

  ---

  ## Part 3: The Debrief (20 Minutes)

  **Instructor Note:** Do not ask "How did it feel?" immediately. Begin with structural analysis.

  ### 1. Mapping the Phases to Rationality Concepts (5 Minutes)
  *   **Phase 1 (Silent):** Map this to **Individual Rationality without Common Knowledge**. You had to reason about the other's move without knowing their internal state. Most pairs Built. Why? Because the immediate gain of Banking (3/5 of small pot) felt worse than the potential gain of a larger pot.
  *   **Phase 2 (Envelopes):** Map this to **Information Asymmetry**. When Type B pairs opened the envelope, the "Game Structure" changed retroactively in their minds. The rational move in Round 3 became obvious (Bank), but the rational move in Round 1 *would have been* Bank *if* they had known the envelope content then.
  *   **Phase 3 (Commitment):** Map this to **Credible Threats**. Writing the choice removed the ability to negotiate. This isolates the decision from "cheap talk."

  ### 2. The Backward Induction Paradox (10 Minutes)
  *   **The Formal Logic:** Explain that in a standard finite game (like Type A pairs, Rounds 1-5), strict logic dictates:
      *   At Round 5, the current player should Bank (60% > 50% auto-split).
      *   Knowing this, at Round 4, the other player should Bank (to avoid getting the Round 5 Banker's 60%).
      *   This chain unravels all the way to Round 1.
      *   **Paradox:** The logical solution is to Bank immediately. The intuitive solution (which most of you played) is to Build.
  *   **The Missing Ingredient:** Ask the class: "Why didn't you Bank in Round 1?"
      *   *Expected Answers:* "I trusted my partner," "I didn't know the rules," "It seemed greedy."
      *   **Facilitator Supply:** You must now supply the condition the activity lacked: **Common Knowledge of Rationality (CKR).**
      *   *Explanation:* "Backward induction only works if you *know* your partner is rational, and they *know* you know, and so on infinitely. In this room, you did not know if your partner was rational, altruistic, or confused. The Envelope added uncertainty about the *rules* themselves. Strict Backward Induction requires perfect transparency of both rules and rationality. You were playing a game of *incomplete information*, which is why the inductive chain broke."

  ### 3. The Finitude Objection (5 Minutes)
  *   **Concept:** Actual agents rarely execute the full inductive chain.
  *   **Discussion:** Point out that even Type A pairs (who had the full 5 rounds) likely did not Bank in Round 1.
  *   **Conclusion:** The "Paradox" isn't that the logic is wrong; it's that the assumptions (CKR) are false in human contexts. Rationality in the real world involves modeling the *other's* limitations, not just the game's structure.

  ---

  ## Part 4: Failure Prediction & Recovery

  **Failure 1: Premature Envelope Opening**
  *   *Risk:* Curiosity drives a pair to open the envelope in Phase 1 to "plan ahead."
  *   *Prevention:* State clearly in the intro that opening early voids their score. Circulate during Phase 1 to watch for tampering.
  *   *Recovery:* If caught, disqualify the pair from the point competition but allow them to continue for the sake of the experiment. Use them in the debrief as an example of "breaking the common knowledge boundary."

  **Failure 2: Arithmetic Confusion (3/5 Split)**
  *   *Risk:* Students struggle to calculate 60% of 22 tokens live, slowing the game.
  *   *Prevention:* The **Payoff Table** in the kit must pre-calculate all values.
      *   *Table Example:* Round 1 (22 tokens) = Banker 13, Partner 9. Round 2 (24 tokens) = Banker 14, Partner 10. (Round numbers to avoid fractions).
  *   *Recovery:* If confusion arises, pause the class and project the table. Emphasize that the *logic* matters more than the exact token count.

  **Failure 3: Moral Objection to the Split**
  *   *Risk:* Students argue the 3/5 vs 2/5 split is "unfair" and refuse to Bank on principle.
  *   *Prevention:* Frame the game as a "simulation of structural constraints," not a moral test.
  *   *Recovery:* In the debrief, acknowledge this. "Your refusal to Bank is a rejection of the *payoff structure*, which is a valid strategic variable. In formal game theory, preferences are fixed. In this room, your preferences included 'fairness,' which alters the payoff matrix. This is another reason why real play diverges from theoretical BI."

  **Failure 4: Collusion (50/50 Side Deals)**
  *   *Risk:* In Phase 2, pairs agree to ignore the Bank rule and split everything 50/50 at the end.
  *   *Prevention:* The Phase 3 Private Commitment prevents binding agreements. They must write their choice secretly.
  *   *Recovery:* If they collude but defect in Phase 3, use it to illustrate the **Prisoner's Dilemma** embedded within the Centipede structure. "Even if you agreed to cooperate, the incentive to defect in the final private round remained."

  ---

  ## Instructor Checklist for Fidelity

  1.  **Do not name the Centipede Game** until the debrief is complete.
  2.  **Do not explain Backward Induction** before Phase 3.
  3.  **Ensure Envelopes are sealed** with tape or a sticker that shows tampering.
  4.  **Verify Payoff Tables** are in every kit before class starts.
  5.  **Timekeeping:** Strictly enforce the 15/20/10 minute phase limits. Use a visible timer. The pressure of the clock simulates the "cost of reasoning" time.

  ## Physical Limitations & Facilitator Notes

  **What this activity cannot reproduce:**
  *   **Infinite Regress of Reasoning:** Students cannot actually simulate "I know that you know that I know..." beyond 2 or 3 steps.
  *   **Perfect Transparency:** Students cannot see their partner's utility function.
  *   **Common Knowledge:** The Facilitator knows the rules, but the Students do not know that the Students know the rules (due to the Envelopes).

  **What the Facilitator must supply verbally:**
  *   In the debrief, you must explicitly state: "For the Backward Induction Paradox to hold logically, you must assume I (the Facilitator) told you at the very beginning: 'Everyone in this room is perfectly rational, everyone knows everyone is perfectly rational, and everyone knows the rules are identical.'"
  *   Without this verbal assertion, the activity remains a demonstration of *trust*, not a demonstration of the *paradox*. You must bridge the gap between their experience (uncertainty) and the theory (certainty).
