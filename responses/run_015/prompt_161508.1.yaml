answer: |-
  You need to abandon the claim that there are no coincident objects, because maintaining it while insisting on real modal differences creates a logical contradiction that will undermine the entire metaphysical framework before you even reach the cases, whereas you can and must keep the commitment to real modal differences if you want your discussion of survival and constitution to mean anything. The conflict between your denial of coincident objects and your insistence that the modal difference between the statue and the lump is more than a manner of speaking is the most dangerous fault line in your position, because it violates Leibniz's Law in a way that cannot be smoothed over by terminology. If there is truly only one thing where the statue is, then that single thing must have a single set of modal properties, yet you claim it could melt down as a lump while ceasing to exist as a statue, which implies two distinct persistence conditions for one entity. Giving up the no-coincidence view allows you to keep the modal realism you value, costing you only the intuitive simplicity of one thing in one place, which is a manageable price for a philosophical audit, whereas keeping it forces you to dismiss the modal difference as mere language, which you have already ruled out and which would gut the significance of your Ravenna and emulation cases.

  The next most severe tension lies between your principle that identity is fixed solely by stage-by-stage facts along the chain and the verdicts you want to deliver on the emulation and Ravenna cases, and this is where your specific examples threaten to overturn your general theory. Your emulation view requires that the existence of the original affects the identity of the copy, which is explicitly something happening elsewhere that you say should not get a vote, since the physical chain leading to the copy is identical in both the destroy and keep scenarios. Similarly, your Ravenna verdict relies on location to break symmetry where material continuity suggests otherwise, yet if identity is fixed only by the chain itself, the continuous existence of both panels should grant them equal claim to originality unless you allow external facts about the wall or the museum to decide. Dropping the strict locality of identity allows you to keep your intuitive verdicts on survival and art, costing you the theoretical purity of intrinsic identity, while keeping it forces you to accept that the copy is the person regardless of the original's fate or that the panels are equally original, which seems to undermine the specific stakes of your cryonics analysis and the conservation story that started the project.

  Your worry that endurantism and eternalism cannot coexist is significant but manageable compared to the previous two, and it is less likely to be the place where your argument falls over on air. You can maintain that objects are wholly present at each moment even in a block universe by treating existence at a time as a multi-location relation rather than a temporal part, though this requires careful phrasing to avoid sounding like you are smuggling in a privileged present. Abandoning endurantism would save you this explanatory burden and align better with a straightforward reading of relativity, but it would cost you the account of agency you prize because you believe perdurantism makes nonsense of things doing anything, while abandoning eternalism would protect your presentist intuitions but force you into a conflict with modern physics that a science writer cannot afford. Since you need to maintain credibility on the science side, you should hold onto eternalism and do the work to make endurantism fit, rather than sacrificing your physics for your metaphysics.

  Finally, your defense against the claim that your view on temporary intrinsics is covert perdurantism is likely a waste of sleep compared to the other issues, and you should not lose rest over it before the recording. As long as you consistently treat property instantiation as a relation to a time rather than a part, you can maintain the endurantist line without logical contradiction, even if opponents disagree with the terminology or find it unmotivated without temporal parts. Giving up this specific formulation would force you into admitting that objects have temporal parts, which collapses your endurantism, but keeping it costs you nothing more than the suspicion of philosophers who prefer the worm view, which is a price worth paying to keep your account of agency intact. The real work lies in resolving the constitution problem and the extrinsic identity problem, and if you clear those up by accepting coincident objects and allowing external factors in identity conditions, the rest of the set will hold together well enough for a podcast audit.
