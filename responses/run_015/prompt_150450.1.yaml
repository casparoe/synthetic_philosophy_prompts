answer: |-
  This is a sophisticated reconstruction of a dilemma that haunts contemporary political philosophy, echoing debates between left-libertarians (like Philippe Van Parijs) and liberal egalitarians (like Stuart White or John Rawls). You have correctly identified that a rigidly consistent application of "reciprocity as productivity" leads either to authoritarianism or to the collapse of the workfare distinction.

  To preserve both the moral weight of reciprocity and the legitimacy of conditional welfare without sliding into illiberalism or self-defeat, **you should reject Step 4.**

  Here is the analysis of why Step 4 is the leak, how to repair the argument, and what that concession costs you.

  ### The Leak: Step 4 (The Capital-Labor Equivalence)

  **Step 4 states:** *Anyone holding capital that could be deployed to generate taxable employment but is instead kept in low-risk, low-productivity instruments is also withholding a form of contribution...*

  This step smuggles a **utilitarian maximization principle** into a **deontological reciprocity framework**.

  1.  **Sufficiency vs. Maximization:** The standard normative defense of workfare (Step 1) relies on a duty of *fair play* or *fair share*. It argues that if you take from the cooperative scheme, you must contribute back *enough* to sustain it. It does not argue that you must contribute the *maximum possible amount*.
      *   **Labor:** A worker satisfies reciprocity by accepting a *reasonable* job, not necessarily the highest-paying or most socially productive job available. A teacher does not free-ride because they chose teaching over investment banking, even if the latter generates more tax revenue.
      *   **Capital:** By analogy, a capital holder satisfies reciprocity by paying taxes on returns and obeying laws, not by actively maximizing the productive deployment of their assets. Step 4 incorrectly assumes that "capacity to contribute" means "capacity to maximize social utility."

  2.  **Participation vs. Optimization:** Workfare is fundamentally about **civic integration**, not just revenue generation. The moral injury workfare seeks to address is the separation of the citizen from the common project of social reproduction through *personal effort*. Labor involves the expenditure of personal time, bodily effort, and submission to workplace discipline. Capital deployment does not involve the same kind of personal submission or "strenuousness." To condition capital usage on productivity metrics is to treat property owners as state functionaries, whereas conditioning welfare on labor is treated (by defenders) as activating civic agency.

  ### Repairing Step 6 (The Asymmetry Charge)

  If you reject Step 4, **Step 6** (which claims the asymmetry is *ad hoc*) loses its force. You can now argue that the asymmetry between labor and capital is **structurally justified**, not arbitrary.

  *   **Self-Ownership vs. Property:** Liberal theory grants a stronger presumption of sovereignty over one's external property than over one's integration into the social fabric. While you own your capital, your *status* as a beneficiary of the welfare state is contingent on your *personal* participation in the scheme.
  *   **The Baseline of Duty:** The duty of reciprocity attaches to the *person* (the citizen), not the *asset*. The citizen must offer their labor power; they are not required to optimize their asset portfolio. Distinguishing between the two is not *ad hoc*; it is a foundational feature of liberal distinctness between the public citizen and the private owner.

  ### The Necessary Nuance: Adjusting Step 2

  While Step 4 is the primary leak, **Step 2** also needs a slight modification to prevent the collapse in Step 8.

  *   **Current Step 2:** "Can labor" = Capacity (ability) vs. Market (actual employment).
  *   **Revised Step 2:** "Can labor" = Capacity **plus Reasonable Opportunity**.

  You do not need to retreat to a purely market-relative definition (which causes the Step 8 collapse). Instead, you adopt a **hybrid view**. "Can labor" means possessing the physical/cognitive ability *AND* the existence of a reasonable labor market opportunity. This acknowledges structural unemployment (saving you from blaming the structurally unemployed) without conceding that *all* unemployment is structural (preserving the distinction for those who simply refuse available work).

  ### The Costs of This Solution

  Rejecting Step 4 and nuancing Step 2 saves your argument from totalitarianism and collapse, but it comes with three specific theoretical costs:

  **1. You concede that Reciprocity is not purely Economic.**
  By rejecting the capital extension, you admit that the moral logic of workfare is not about "maximizing national contribution" but about "maintaining civic standing." This weakens the argument against the wealthy who live off passive income. You must accept that, under this framework, a wealthy person living off bonds is not a "free-rider" in the same moral sense as an able-bodied person refusing all work. This may feel like a concession to libertarian property rights.

  **2. You accept a "Threshold" rather than a "Metric."**
  You cannot justify continuous state-verified productivity metrics (as mentioned in Step 5). You are limited to binary or threshold checks (e.g., "Are you working?" or "Are you seeking work?"). You lose the ability to morally critique *how well* someone works or invests, only *whether* they participate. This limits the state's ability to enforce "efficiency" but protects liberty.

  **3. You inherit the Burden of "Reasonable Opportunity."**
  By modifying Step 2 to include "reasonable opportunity," you shift the administrative burden from the individual to the state. To legitimately sanction someone for not working, the state must now prove that a suitable job existed for them. This makes the administration of workfare much harder and more expensive, as it requires constant monitoring of labor market conditions, not just individual capacity.

  ### Summary

  *   **Reject:** Step 4 (The equivalence of labor capacity and capital optimization).
  *   **Modify:** Step 2 (Add "reasonable opportunity" to capacity).
  *   **Keep:** Step 1 (Reciprocity matters) and Step 3 (Unconditional support for capable workers is free-riding).
  *   **Result:** You preserve a liberal workfare system that demands civic participation without demanding economic maximization. You avoid the illiberal extension to capital while maintaining the distinction between the deserving and undeserving poor, provided the state guarantees reasonable labor market opportunities.

  This positions you firmly in the **Liberal Egalitarian** camp (akin to Stuart White's *The Civic Minimum*), which argues for reciprocity but constrains it with liberal rights and macroeconomic responsibility.
