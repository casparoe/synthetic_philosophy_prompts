answer: |-
  ### Desiderata for a Theory of Mechanistic Sameness Under Structural Latency

  To adjudicate the identity of mechanisms undergoing structural latency, a theory must navigate the tension between physical continuity and organizational discontinuity. The following desiderata outline the conceptual architecture required to handle cases where the relational graph is rewired from within without component replacement.

  #### 1. The Desiderata

  **D1: Substrate Continuity Requirement**
  *   **Phenomenon Covered:** Component-identity across normal functioning and anomalous conditions.
  *   **Motivating Consideration:** A theory of mechanistic sameness must acknowledge that the physical bearers of causal power remain numerically identical. If a theory declares a mechanism "new" solely because a threshold was crossed, despite zero material exchange, it risks severing the link between mechanism and physical substrate, rendering the account incompatible with conservation principles and experimental tracking of parts.
  *   **Status:** **Non-negotiable.** Any account that ignores substrate continuity cannot explain why the anomaly is constrained by the specific capacities of the original parts.

  **D2: Dispositional Completeness Requirement**
  *   **Phenomenon Covered:** Latent-pathway activation.
  *   **Motivating Consideration:** Standard accounts often individuate mechanisms by their *actualized* activities. Structural latency requires that the *dispositional* profile of the system be included in its identity conditions. The latent relations must be recognized as real properties of the mechanism-in-waiting, not merely external accidents. Without this, the transition from normal to anomalous mode appears as magic rather than the actualization of existing potential.
  *   **Status:** **Non-negotiable.** This is the core requirement for handling structural latency specifically.

  **D3: Organizational Sensitivity Requirement**
  *   **Phenomenon Covered:** Normal functioning vs. Latent-pathway activation (the shift in causal graph).
  *   **Motivating Consideration:** While parts remain the same, the causal topology changes. A theory must be sensitive enough to distinguish between a mechanism functioning *poorly* (degraded output via standard pathways) and a mechanism functioning *differently* (novel output via latent pathways). If the theory is insensitive to organizational shifts, it cannot explain the qualitative change in behavior.
  *   **Status:** **Non-negotiable.**

  **D4: The Degradation/Transition Distinction**
  *   **Phenomenon Covered:** Graded degradation vs. Phase transition.
  *   **Motivating Consideration:** Not all anomalies are structural latency; some are simple breakdowns. The theory must provide criteria to distinguish between a continuous loss of function (graded degradation) and a discrete topological shift (structural latency). This prevents the "brittle relationalism" where every minor fluctuation constitutes a new mechanism.
  *   **Status:** **Camp-specific Preference.** Some accounts prefer a continuum of mechanistic health; others require a dichotomous switch for identity preservation.

  **D5: Interventionist Reversibility**
  *   **Phenomenon Covered:** Counterfactual stability under intervention.
  *   **Motivating Consideration:** Identity should track the ability to return to the baseline state via specific interventions. If removing the anomalous perturbation restores the original organizational graph without resetting the components, the mechanism retained its identity through the latency. If the system requires component replacement to return to baseline, identity was likely lost.
  *   **Status:** **Non-negotiable.** This aligns mechanistic identity with experimental practice.

  **D6: Predictive Tracking Utility**
  *   **Phenomenon Covered:** Predictive tracking for anomaly detection.
  *   **Motivating Consideration:** Classifying the system as the "same" mechanism must yield better predictions than classifying it as "new." If calling it the same mechanism allows us to predict the conditions under which the latent pathway activates (based on component properties), the classification is vindicated. If it obscures the risk of anomaly, the classification is pragmatically void.
  *   **Status:** **Non-negotiable.** Scientific kinds must support induction.

  **D7: Causal Relevance Consistency**
  *   **Phenomenon Covered:** Consistency with interventionist accounts of causal relevance.
  *   **Motivating Consideration:** The criteria for sameness must not contradict the criteria for causal relevance. If a part is causally relevant in the latent mode but inert in the normal mode, the theory must explain how the *same* part changes its relevance status without changing its identity.
  *   **Status:** **Non-negotiable.**

  ---

  #### 2. The Trilemma of Joint Unsatisfiability

  There is a subset of these requirements that cannot be simultaneously maximized in cases of deep structural latency. Specifically, **D1 (Substrate Continuity)**, **D3 (Organizational Sensitivity)**, and a strict interpretation of **Mechanism Individuation by Phenomenon** (often implicit in standard accounts) form a trilemma.

  1.  **If you prioritize Substrate Continuity (D1):** You must accept that the mechanism remains numerically identical despite the organizational shift. This risks underestimating the causal significance of the rewiring (violating the spirit of D3).
  2.  **If you prioritize Organizational Sensitivity (D3):** You must acknowledge that the causal graph has fundamentally changed. If mechanisms are individuated by their organization (as is standard), this implies a *new* mechanism has emerged. This violates Substrate Continuity intuitions regarding identity (D1).
  3.  **If you prioritize Phenomenon-Based Individuation:** If the output behavior changes qualitatively (which it does in structural latency), standard accounts dictate this is a different mechanism. This makes it impossible to describe the case as "the same mechanism in an anomalous mode," forcing a description of "Mechanism A ceased, Mechanism B began," which obscures the physical continuity required for D1 and D5.

  **Resolution Strategy:** To satisfy the non-negotiables, a theory must decouple *numerical identity* (the physical substrate) from *functional individuation* (the organizational mode). It must treat "Mechanism" as a composite concept that can sustain identity across topological shifts provided the *dispositional envelope* (D2) encompasses both states. Failure to do so results in a theory that either collapses into mereology (only parts matter) or structuralism (only the current graph matters).

  ---

  #### 3. Evaluation of Existing Architectural Approaches

  **Craver-Style Entity-and-Activity Account**
  *   **Performance:** Strong on **D1 (Substrate)** and **D7 (Causal Relevance)**. It grounds the mechanism in specific entities performing activities.
  *   **Failure Point:** Struggles with **D2 (Dispositional Completeness)** and **D3 (Organizational Sensitivity)**. Because Craver-style accounts typically individuate mechanisms by the *phenomenon* they produce, a shift to anomalous behavior via latent pathways often forces the classification of a "different mechanism." It lacks the conceptual resources to treat the latent pathways as part of the *same* mechanism's identity unless the phenomenon description is broadened to the point of triviality. It tends to view the anomalous state as a breakdown or a distinct mechanism rather than a latent mode of the original.

  **Glennan-Style Interactionist View**
  *   **Performance:** Strong on **D3 (Organizational Sensitivity)** and **D5 (Interventionist Reversibility)**. By focusing on the interactions themselves, this view is well-suited to detect when the "wiring" has changed.
  *   **Failure Point:** Vulnerable on **D1 (Substrate Continuity)** and **D4 (Degradation/Transition)**. Because the identity is tied closely to the specific interactions, the activation of previously inert relations can look like the cessation of the old interactions and the start of new ones. This risks the "brittle relationalism" warned against in the seminar framing, where the mechanism is deemed "new" too easily, losing the predictive utility of the original classification (**D6**).

  **Organizational-Invariance Approach**
  *   **Performance:** Strong on **D6 (Predictive Tracking)** if the invariant structure is correctly identified. It seeks the abstract topology that remains constant.
  *   **Failure Point:** Fails **D2 (Dispositional Completeness)** in cases of structural latency. If the organizational graph *actually changes* (which is the definition of structural latency), an invariance account must declare the mechanism lost. It cannot easily accommodate the idea that the *same* organization supports multiple topological configurations depending on threshold conditions. It tends to treat the latent state as a violation of the mechanism's defining constraints rather than a feature of its identity.

  **Summary for Seminar Framing:**
  Current dominant accounts are optimized for *stable* mechanisms or *broken* mechanisms. They lack the ontological category for *reconfigured* mechanisms. To handle structural latency, your seminar must push toward a **Modal Mechanistic Account**, where the identity of the mechanism is constituted not just by its actualized graph, but by the space of possible graphs its substrate supports under intervention. This shifts the focus from "what is the mechanism doing?" to "what is the mechanism capable of becoming without ceasing to be itself?"
