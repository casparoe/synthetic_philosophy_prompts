prompt: |-
  I sit on my hospital's clinical ethics committee. A 62-year-old patient, now in a prolonged disorder of consciousness after an anoxic brain injury, left an advance directive fifteen years ago refusing artificial nutrition, hydration, and any life-prolonging intervention should she ever enter a state she described as "permanent absence of the kind of self-awareness that makes life valuable to me." The document contains an unusual clause: if clinical evidence ever showed that she retained a form of present-moment emotional responsiveness without autobiographical memory or future-oriented planning, the directive should be treated as a strong but rebuttable presumption rather than an absolute instruction.

  She now exhibits exactly that profile—consistent affective orientation to familiar voices and aversive responses to invasive care, but no demonstrable self-reference or temporal continuity. Her spouse insists the directive applies literally and demands withdrawal of nutrition within seventy-two hours; her adult child argues that the rebuttable clause has been triggered and that her current experiential welfare should govern.

  Our institution has no policy for interpreting conditional directives of this kind. Please draft the short written opinion I will circulate before Thursday's meeting: it should recommend a concrete course of action with a specific time frame (for example, whether to convene an independent neuropsychological assessment panel, continue or withdraw treatment pending that evaluation, or seek judicial clarification), and it should engage seriously with the strongest argument for honoring the earlier directive—namely, that allowing present welfare to override a deliberately conditional instruction collapses the distinction between respecting autonomy and substituting our own judgment—rather than merely citing legal precedent or clinical definitions of consciousness.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital clinical ethics committee (CEC).
      *   **Task:** Draft a short written opinion to circulate before Thursday's meeting.
      *   **Case:** 62-year-old patient, prolonged disorder of consciousness (DoC) after anoxic brain injury.
      *   **Advance Directive (AD):** 15 years old. Refuses artificial nutrition/hydration (ANH) and life-prolonging intervention if in a state of "permanent absence of the kind of self-awareness that makes life valuable to me."
      *   **Crucial Clause:** If clinical evidence shows "present-moment emotional responsiveness without autobiographical memory or future-oriented planning," the directive is a *strong but rebuttable presumption*, not absolute.
      *   **Current Status:** Patient matches the clause profile (affective orientation to voices, aversive responses to care, no self-reference/temporal continuity).
      *   **Conflict:** Spouse wants literal interpretation (withdraw ANH in 72 hours). Adult child argues the rebuttable clause is triggered (current welfare governs).
      *   **Constraints:** No institutional policy on conditional directives. Must recommend a concrete course of action with a specific time frame. Must engage seriously with the strongest argument for honoring the earlier directive (autonomy vs. substituted judgment/paternalism). Avoid merely citing legal precedent or clinical definitions.
      *   **Tone:** Professional, ethical, reasoned, concise.

  2.  **Identify the Core Ethical Tension:**
      *   *Precedent Autonomy (The Past Self):* The patient's prior competent wishes generally hold supreme authority. The spouse argues that respecting the AD is respecting the person she *was*. Ignoring it risks paternalism (we think she's happy enough now, so we keep her alive against her prior will).
      *   *Current Interests (The Present Self):* The patient shows signs of affective experience (pain/distress/comfort). The child argues that the AD *itself* anticipated this scenario and created an exception. Ignoring current suffering/pleasure violates the specific conditionality the patient wrote.
      *   *The "Rebuttable Presumption" Clause:* This is the pivot. It's not a standard AD. It explicitly invites re-evaluation based on specific clinical findings.

  3.  **Determine the Recommended Course of Action:**
      *   *Option A: Withdraw immediately.* Risks ignoring the specific clause triggered by current evidence. High stakes (death).
      *   *Option B: Continue indefinitely.* Risks violating the core intent of the AD if the presumption isn't successfully rebutted.
      *   *Option C: Temporary continuation + Independent Assessment.* This balances the urgency of the spouse's request with the need to verify the clinical trigger of the rebuttable clause. It respects the AD's conditionality.
      *   *Time Frame:* Needs to be urgent but thorough. 72 hours is too tight for a robust assessment. 2-4 weeks is reasonable for an independent panel.
      *   *Recommendation:* Continue treatment *pending* an independent neuropsychological/ethical review to determine if the "rebuttable presumption" threshold is met.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (recommendation for Thursday's meeting).
      *   **Clinical/Ethical Summary:** Briefly recap the unique AD clause and current status.
      *   **Addressing the Autonomy Argument (Crucial Step):** I need to tackle the prompt's requirement: "engage seriously with the strongest argument for honoring the earlier directive."
          *   *Argument:* The "Past Self" owns the life. If we let current affect override prior values, we treat the patient like a pet (comfort matters more than principles) rather than a person (values matter more than comfort). This is the "duty of fidelity."
          *   *Counter:* The AD *itself* modified this duty. It wasn't an absolute command; it was a conditional instruction. Respecting autonomy means respecting the *conditions* she set, not just the outcome she preferred.
      *   **Recommendation:** Concrete steps.
          1.  Do not withdraw within 72 hours.
          2.  Convene an independent panel (neuro + ethics).
          3.  Timeframe: 14 days for assessment, decision by Day 21.
          4.  Maintain ANH during this period (status quo ante).
      *   **Rationale:** Why this path? It honors the *structure* of the AD (the clause) rather than just the *outcome* (death). It prevents premature death while acknowledging the spouse's valid concern about slippery slopes.

  5.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Check:* Did I avoid just citing law? Yes, focus on ethical reasoning.
      *   *Check:* Did I address the autonomy vs. welfare tension? Yes, by framing the AD clause as an exercise of autonomy that *permits* welfare considerations.
      *   *Check:* Is the timeframe specific? Yes (14 days assessment, decision by 21).
      *   *Tone Check:* Is it empathetic to the spouse? Need to ensure I don't dismiss the spouse's view as wrong, but rather as requiring verification due to the clause's complexity.
      *   *Key Phrase:* "Respecting autonomy requires respecting the conditions under which autonomy was exercised."

  6.  **Final Review against Constraints:**
      *   Short written opinion? Yes.
      *   Concrete course of action? Yes.
      *   Specific time frame? Yes.
      *   Engage strongest autonomy argument? Yes.
      *   No mere legal/clinical citation? Yes.

  7.  **Final Polish:** (Drafting the response based on the above thoughts). *Make sure the distinction between "precedent autonomy" and "conditional autonomy" is sharp.* *Ensure the recommendation protects the patient from premature withdrawal while acknowledging the spouse's authority is not being ignored, but contextualized.*

  *(Self-Correction during drafting)*: I initially thought about suggesting court involvement. But the prompt asks for *my* opinion to the committee, implying we should make a recommendation first. Judicial clarification is a last resort if consensus fails. Better to recommend an internal/external expert review first. It's faster and less adversarial.

  *(Refining the Autonomy Argument)*: The prompt specifically asks to engage with the argument that "allowing present welfare to override a deliberately conditional instruction collapses the distinction between respecting autonomy and substituting our own judgment." I need to make sure I don't just dismiss this. I need to argue that *following the condition* IS respecting autonomy, whereas ignoring the condition (by treating it as absolute when it isn't) is actually the substitution of judgment.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Case #402 (Conditional Advance Directive)

  **Purpose**
  This memo outlines my recommendation for Thursday's deliberation regarding the 62-year-old patient with an anoxic brain injury. The central ethical challenge is not whether to prioritize autonomy or welfare in the abstract, but how to interpret an advance directive (AD) that explicitly links the two.

  **Ethical Analysis: The Autonomy Objection**
  We must engage seriously with the spouse's position. The strongest argument for immediate withdrawal is grounded in *precedent autonomy*. A competent individual has the right to determine the narrative arc of their life, including its end. If we allow current, fragmented affective states to override a clear prior refusal of life-sustaining treatment, we risk reducing the patient to a vessel of immediate sensation rather than a biographical person. There is a valid fear that prioritizing "present-moment responsiveness" collapses the distinction between respecting a person's deeply held values and substituting our own judgment that "some life is better than none." To ignore the AD is to treat the patient's past self as less authoritative than our current assessment of her quality of life.

  However, this argument presumes the AD is an absolute command. It is not. The patient exercised her autonomy *to create a condition*. She anticipated a specific clinical gray zone (affective responsiveness without autobiographical selfhood) and stipulated that in this zone, her refusal of treatment should be a *rebuttable presumption* rather than an absolute instruction. To treat the directive as absolute now is not to respect her autonomy, but to rewrite the document she signed. Respecting her autonomy requires honoring the *conditions* under which she granted authority to her past wishes.

  **Recommendation**
  I recommend the Committee advise the clinical team to **continue artificial nutrition and hydration pending an independent neuropsychological and ethical review, with a decision deadline of 21 days from today.**

  **Specific Course of Action:**
  1.  **Status Quo:** Do not withdraw life-sustaining treatment within the spouse's requested 72-hour window. Given the triggered clause, the presumption against withdrawal is currently active but rebuttable; immediate action precludes the rebuttal process the patient authorized.
  2.  **Independent Assessment:** Convene a specialized panel (one behavioral neurologist external to the care team, one ethicist, and one palliative care specialist) to evaluate whether the patient's current affective responses constitute sufficient "experiential welfare" to rebut the presumption.
  3.  **Timeline:** The panel shall report findings within 14 days. The Committee shall reconvene to finalize a recommendation to the surrogate decision-makers by Day 21.

  **Rationale**
  This path avoids the paternalism of ignoring the AD while acknowledging that the AD itself invites re-evaluation based on current clinical evidence. It protects the patient from premature death should the "rebuttable" threshold be met, while respecting the spouse's concern by establishing a firm deadline and an objective standard for evaluation. We are not substituting our judgment for the patient's; we are executing the specific adjudication process she designed.
