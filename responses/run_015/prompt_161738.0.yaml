answer: |-
  Here is a case designed to meet your specifications. It avoids essentiality of origin, avoids science fiction, and isolates a structural divergence regarding **iterated modality** (the logic of "possible possibilities").

  ### The Scenario
  Arthur is a 40-year-old actuary living in Chicago. He is risk-averse, deeply embedded in his local community, and maintains weekly contact with his childhood friends. He is considering a career change. There is a realistic possibility he could quit his job to become a high-school math teacher in the same city. There is also a realistic possibility that a teacher in his position could accept a remote posting in a isolated rural community, severing ties with his urban life entirely. However, there is no realistic path where *Arthur-as-he-is-now* directly becomes that isolated rural recluse without first passing through the "teacher" stage; the psychological and social gap is too wide to bridge in one leap.

  ### The Two Claims

  **Claim 1 (Simple *De Re*):** "Arthur could have become a high-school teacher."
  **Claim 2 (Iterated Modality):** "Arthur could have become a high-school teacher, and *had he done so*, he could have become a person who lost all contact with his past life."
  *(Formally: $\Diamond (T \land \Diamond L)$ vs. TWI's implication of $\Diamond (T \land L)$)*

  ### The Verdicts

  | Theory | Verdict on Claim 1 | Verdict on Claim 2 | Reason |
  | :--- | :--- | :--- | :--- |
  | **Transworld Identity (Kripke/Plantinga)** | **True** | **True** | TWI typically validates **S5** modal logic. If there is a world $w_1$ where Arthur is a teacher, and from $w_1$ there is an accessible world $w_2$ where he is isolated, then $w_2$ is accessible from the actual world. Arthur exists in $w_2$ and is isolated. The chain of worlds collapses into a single direct possibility. |
  | **Counterpart Theory (Lewis)** | **True** | **False** (Potentially) | CT does not require the counterpart relation to be transitive. Arthur (actual) has a counterpart in $w_1$ (Teacher). Teacher has a counterpart in $w_2$ (Isolated). But the Isolated person may be too dissimilar to *Actual Arthur* to count as *his* counterpart, even if they are a counterpart of the Teacher. The chain breaks. |

  ### The Structural Feature
  The disagreement is generated by the **Transitivity of Access**.
  *   **TWI:** Transworld identity is an equivalence relation (reflexive, symmetric, transitive). If $x$ in $w_{actual}$ is identical to $y$ in $w_1$, and $y$ is identical to $z$ in $w_2$, then $x$ is identical to $z$.
  *   **CT:** The counterpart relation is based on similarity, which is **not transitive**. (A is similar to B, B is similar to C, does not guarantee A is similar to C). Lewis explicitly rejects S5 for this reason.

  ### Sensitivity Analysis
  If you **stipulate that the counterpart relation is transitive** (forcing CT to mimic TWI structurally), the disagreement vanishes. Both theories return **True** on Claim 2.
  If you **stipulate that origin is essential** (forcing TWI to restrict access), both theories might return **False** on Claim 2 (if the isolated person violates origin constraints), restoring agreement.
  The disagreement *only* exists because TWI assumes the "same individual" persists through the chain by definition, while CT requires the end-point to clear the similarity hurdle relative to the *start-point*.

  ### The Dialectic

  **The Counterpart Theorist's Escape (The "Context" Move):**
  A sophisticated Lewisian will argue this case is weak because the counterpart relation is **context-sensitive**. When evaluating Claim 2 ("Arthur could have... and then..."), the context shifts to make the "Teacher-Arthur" salient. In that context, the "Isolated-Arthur" *is* a counterpart of the salient individual. They will argue that by asserting Claim 2, you have already renegotiated the similarity standards to allow the chain. If they do this, the disagreement evaporates: CT also returns **True**.
  *Honesty Check:* You asked me to flag this. If your friend accepts context-relativity as a feature rather than a bug, this case loses its "cash value." The disagreement relies on fixing the similarity standard relative to *Actual Arthur* throughout the iteration.

  **The Transworld Theorist's Pushback:**
  The TWI theorist will argue that the "Context Move" concedes the point. If the truth of modal claims shifts based on conversational salience, then modality is not a stable feature of reality but a pragmatic tool. They will insist that Claim 2 describes a **metaphysical possibility**, not a conversational one. For planning and regret (the "cash value"), agents need stable truth conditions. If I say, "I could have taken that job and then moved away," I am asserting a fact about the branching structure of my life, not inviting you to shift the topic. TWI preserves the logic of long-term counterfactual planning (S5); CT fragments it into local similarity clusters.

  ### Conclusion & Constraint Relaxation
  This case satisfies your constraints: it is realistic, avoids origin essentialism, and produces a truth-value divergence based on logical structure (transitivity) rather than stipulation.

  **However,** if your friend insists that context-relativity resolves the CT verdict, you have hit the limit of "ordinary human settings." To force a disagreement that even a context-relativist CT theorist must accept, you would need to relax the **"No Science Fiction"** constraint.
  *   **Why:** You would need a **Fission Case** (e.g., a teleporter accident creates two successors).
  *   **The Disagreement:** "Which one is Arthur?"
  *   **TWI:** Neither (identity is one-to-one).
  *   **CT:** Both (counterpart relation is one-to-many).
  *   **Cash Value:** Inheritance rights, criminal liability, marriage vows.
  *   **Why Relax:** In ordinary human biology, fission doesn't happen, so CT mimics TWI perfectly. The "bookkeeping" charge sticks in ordinary cases because the *extensions* of the two theories overlap almost perfectly outside of exotic metaphysics. The Iterated Modality case above is the strongest non-exotic argument available, but it is vulnerable to the "shifting standards" defense.

  **Recommendation for your group:** Bring the **Iterated Modality** case first. If they dodge it via context-relativity, concede that point, then pivot to the **Fission** constraint relaxation. Argue that if the theory only yields distinct verdicts in science-fiction cases, then your friend is right: for all *practical* human purposes, it is bookkeeping. But if they care about the *logic* of planning (S5 vs S4), the Iterated case holds.
