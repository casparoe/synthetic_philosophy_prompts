answer: |-
  (1) Exam Question

  **Metaphysics Seminar Final: The Problem of Universals and Disjunctive Properties**
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 800 words

  **Question:**
  Resemblance nominalism attempts to account for property attribution without positing universals, claiming that particulars are F simply because they resemble one another. However, consider the disjunctive property *being either crimson or triangular*. If a crimson particular resembles a paradigm crimson particular, and a triangular particular resembles a paradigm triangular particular, does the collective class of these particulars resemble in virtue of the disjunction *crimson-or-triangular*?

  Critically evaluate whether a resemblance nominalist can consistently reject the corresponding disjunctive universal without implicitly treating the relation "resembles-paradigm-a-or-paradigm-b" as itself a universal-like entity that generates an infinite resemblance regression. In your analysis, assess whether the nominalist can halt this regression by positing a primitive, non-transitive similarity relation. Conclude by arguing whether this move is merely ad hoc to save the theory or if it is independently motivated by the logical priority of determinates over disjunctions.

  ***

  (2) Model Answer

  The central challenge for resemblance nominalism regarding disjunctive properties is ontological parsimony versus explanatory adequacy. If properties are merely classes of resembling particulars, any definable class seems to imply a property. The disjunction *crimson-or-triangular* groups particulars that share no specific qualitative unity other than satisfying a logical condition. The realist argues that if this class is legitimate, there must be a disjunctive universal grounding the resemblance. The nominalist must deny this universal while explaining why the class does not constitute a genuine property grouping.

  The threat of infinite regression arises if the resemblance relation itself requires grounding. If particulars $a$ and $b$ resemble because they share a property, nominalism fails. If they resemble primitively, we must ask if the relation of resemblance is uniform. If the relation holding between crimson particulars is of the same type as the relation holding between the disjunctive class (crimson-or-triangular), then "resemblance" functions as a universal. Specifically, if we define a class based on "resembling paradigm $A$ or paradigm $B$," we posit a complex relation. If this complex relation is itself a universal entity, we require a further resemblance relation to group instances of this complex relation, triggering a regress. The nominalist must deny that "resembling-$A$-or-$B$" is a genuine relation over and above the primitive resemblances to $A$ and to $B$ individually.

  To halt this regression, the nominalist posits a primitive similarity relation that is non-transitive. Standard resemblance is non-transitive; $a$ resembles $b$, and $b$ resembles $c$, but $a$ need not resemble $c$. Disjunctive groupings often rely on transitive logical conditions (all $X$ or $Y$ satisfy condition $Z$). By insisting that primitive resemblance is strictly non-transitive and localized, the nominalist blocks the formation of a unified disjunctive class grounded by a single relation. The crimson particular resembles the crimson paradigm; the triangular particular resembles the triangular paradigm. There is no third relation binding them together into a *crimson-or-triangular* natural class. They are only grouped linguistically, not metaphysically.

  However, critics argue this move is ad hoc. It appears designed solely to avoid the ontological commitment to disjunctive universals without independent justification. If resemblance is primitive, why is it constrained against disjunctive grouping? The nominalist must argue that disjunctions are logically derivative while determinates are fundamental. The motivation lies in the direction of analysis: we understand "crimson-or-triangular" only by understanding "crimson" and "triangular" first. Therefore, the resemblance relation tracks the fundamental determinates, not the derived disjunctions. This provides independent motivation: the metaphysics mirrors the logical dependency of concepts.

  Ultimately, the nominalist can consistently reject the disjunctive universal, but only by accepting that primitive resemblance is sensitive to logical structure. The regression is halted because the complex relation "resembles-$A$-or-$B$" is not a new entity but a logical construction of two primitive relations. While this risks explanatory vacuity—asserting brute similarity without further analysis—it remains coherent if one accepts that logical disjunctions do not carve nature at its joints. The theory survives by prioritizing phenomenological similarity over logical combinability, maintaining that only the former grounds genuine resemblance.

  ***

  (3) Marking Scheme

  **Total Marks: 20**

  **1. Articulation of the Disjunctive Challenge (4 Marks)**
  *   **Requirement:** Clearly explains why disjunctive properties threaten nominalism (i.e., any class of particulars seems to imply a shared property/universal).
  *   **Characteristic Mistake:** Confusing the linguistic definition of a disjunction with the metaphysical existence of a property.

  **2. Explanation of the Regression Threat (4 Marks)**
  *   **Requirement:** Demonstrates how treating "resembles-A-or-B" as a unified relation reintroduces a universal-like entity leading to infinite regress.
  *   **Characteristic Mistake:** Failing to explain why the resemblance relation itself becomes the target of the regress.

  **3. Analysis of the Primitive Similarity Defense (4 Marks)**
  *   **Requirement:** Describes the nominalist strategy of positing a primitive, unanalyzed resemblance relation to block the need for further grounding.
  *   **Characteristic Mistake:** Treating primitive resemblance as a hidden universal rather than a brute fact.

  **4. Evaluation of Transitivity Constraints (4 Marks)**
  *   **Requirement:** Discusses the role of non-transitivity in preventing disjunctive classes from forming natural kinds via resemblance chains.
  *   **Characteristic Mistake:** Asserting resemblance is transitive, which collapses the distinction between particular groups and universal extensions.

  **5. Assessment of Ad Hocness vs. Independent Motivation (4 Marks)**
  *   **Requirement:** Concludes whether the move is justified by the logical priority of determinates over disjunctions or is merely theory-saving.
  *   **Characteristic Mistake:** Dismissing the move as ad hoc without considering the logical dependency argument.

  The model answer argues that resemblance nominalism avoids disjunctive universals by treating similarity as a primitive, non-transitive relation grounded in the logical priority of determinates.
