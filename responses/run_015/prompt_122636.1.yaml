prompt: |-
  I'm on a three-person desk at a mid-sized specialty insurer where we price one-off risks: a touring exhibition of fragile works, a completion bond on an indie film, first-of-a-kind industrial equipment, a single music festival in a floodplain. Call it thirty of these a year, anywhere from $200k to $40m of exposure, and every number we write down gets re-derived by an outside reviewer each quarter — if they can't reconstruct it from the file, it comes back to us with a nasty note. I've got maybe half a day per file, my two colleagues' stats background is basically the underwriting exams, and our bonus is on premium volume rather than loss ratio, so you can guess which direction the numbers drift.

  Here's the actual problem, and its not that we're bad at base rates. We've read all the outside-view stuff, we know you're supposed to look for a class instead of telling a story about the case. The problem is that for any one of these risks there are six classes you could honestly reach for — all touring exhibitions, touring exhibitions with four or more venue changes, exhibitions of works on paper, projects with a first-time logistics partner, projects where the counterparty is late on other jobs — and the frequencies differ by an order of magnitude. Which means the number isn't really being found, it's being picked, and it's getting picked to justify a price somebody already wants. I want to stop that.

  So: write me a pre-registered procedure my desk can run on a file, in a fixed order, with what counts as a sufficient answer at each step, where the procedure stops with a hard no (we do not issue a number), and where it hands the decision to a person because the question is really about our risk appetite and not about facts. A few things it has to handle, because these are the places we actually screw up:

  - A membership test. I want a class to be disqualified unless you could say, before the outcome was known, whether a historical case was in it. Classes like "delays that turned out to be genuinely unavoidable" or "claims that were really accidental" are only sortable after the fact, and we've literaly used them. Tell me what to do when the only class with decent data fails this test.
  - How narrow to go. Give me an actual cutoff for how far down you split a class before the sample is too thin to mean anything, and be honest that whatever number you give me is a judgment call wearing a lab coat.
  - What to do when the natural class has one or zero members. There has to be something better than "guess," but I also don't want a step that launders a guess into a number.
  - A ledger rule. We keep a register of the classes we've used, and I caught us counting the same shipment as in-class for one risk and out-of-class for another, six weeks apart. I need a rule for reusing a class without re-describing old cases to fit, and for adding new cases as they come in.
  - An adversarial step. Someone whose interest runs the other way picks the rival class and gets a number out of it. If the two numbers diverge by more than some margin, we don't split the difference — we escalate. Suggest the margin and say what escalation actually looks like.
  - It shouldn't presuppose that probabilities are frequencies. Two of us think these numbers are just calibrated credences and the reference class is an anchor you adjust off of, not the definition of the number. Make the procedure work on either view, or tell me exactly which step takes a side.

  Then run it on three files. (1) A touring exhibition, ~90 fragile works, four venues, 14 months, two of the venues have never handled this kind of work, and the shipper is new to us: probability that at least one venue loses ten or more days to damage or transit failure. (2) A completion bond on an indie feature, first-time director, experienced line producer, 42-day shoot, one exterior location somewhere with a real rainy season, completion cashflow from a distributor that's already late on two other films: probability the film delivers more than 15 days late. (3) The one I think you'll tell me I can't price: a first-of-a-kind direct air capture unit with no operating history anywhere, availability guarantee over year one. If the procedure stops at no on that one, say so and tell me what I hand the chief underwriting officer instead of a number.

  Also flag which steps are judgment calls dressed up as procedure, and where the whole thing will misfire — especially the ways my desk will find to shop for a class until we get the answer we wanted. No citations or reading lists, I need something three underwriters can run in an afternoon. In American English please.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Underwriter at a mid-sized specialty insurer.
      *   **Team:** Three people on a desk.
      *   **Work:** Pricing one-off, unique risks (exhibitions, film bonds, industrial equipment, festivals).
      *   **Volume:** ~30 files/year, high exposure ($200k - $40m).
      *   **Constraints:** Half-day per file, external quarterly review (must be reconstructible), bonus tied to volume (incentivizes writing business), colleagues have limited stats background (underwriting exams).
      *   **Core Problem:** Reference class forecasting is failing because there are too many viable classes (6+), leading to "class shopping" to justify a desired price.
      *   **Goal:** A pre-registered, step-by-step procedure to stop class shopping, handle edge cases (thin data, unique risks), define escalation, and accommodate both frequentist and Bayesian views.
      *   **Tone:** Pragmatic, direct, American English, no academic fluff, acknowledges the political/behavioral reality of the desk.

  2.  **Deconstruct the Requirements:**
      *   **Pre-registered Procedure:** Fixed order, stop rules (hard no), hand-off points (risk appetite).
      *   **Membership Test:** Must be definable *ex-ante* (before outcome). What if the only good data fails this?
      *   **Narrowing Cutoff:** When does splitting become too thin? (Acknowledge it's arbitrary).
      *   **Zero/One Member Class:** How to handle unique risks without laundering guesses.
      *   **Ledger Rule:** Prevent double-counting or re-describing historical cases.
      *   **Adversarial Step:** Rival class selection, divergence margin, escalation process.
      *   **Probability View:** Work for both frequencies and credences (or specify where it splits).
      *   **Application:** Run on three specific files (Exhibition, Film Bond, DAC Unit).
      *   **Meta-Commentary:** Flag judgment calls, failure modes, and how the desk will try to game it.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Name:* Needs to sound official but functional. "Reference Class Protocol (RCP-1)."
      *   *Step 1: The Ex-Ante Membership Test.* Address the "outcome bias" issue. If a class relies on knowing the loss to define the class, it's banned.
      *   *Step 2: The Ledger Check.* Prevent double counting. Define the "Case ID."
      *   *Step 3: Class Selection & Narrowing.* Need a hard rule for sample size. $N < 5$ is usually too small for frequency, but for Bayesian anchoring, it's still useful. Let's set a hard floor for *frequency* reliance, but allow *adjustment* below that. Let's say $N=10$ for frequency, $N=3$ for anchor.
      *   *Step 4: The Zero/One Problem.* If $N=0$, you can't price on frequency. You must price on "Component Breakdown" or "Expert Elicitation" labeled as such.
      *   *Step 5: The Adversarial Review.* The "Red Team" step. Divergence margin? 2x or 50%? Given the stakes ($40m), 50% divergence seems too tight. 2x (100% difference) is standard for "material disagreement."
      *   *Step 6: The Handoff.* When to stop pricing and ask "Do we want this?"

      *Refining the Probability View:* The procedure needs to distinguish between *Base Rate* (frequency) and *Adjusted Rate* (credence). Step 3 establishes the anchor. Step 4 allows adjustment but requires documentation of *why*.

  4.  **Addressing Specific Constraints:**
      *   *Membership Test:* If the only data fails the test, you default to the broader class that passes, even if less predictive. Better to be vague and honest than specific and fake.
      *   *Narrowing:* Cut off at $N=5$ for statistical validity. Below that, it's an anchor, not a rate.
      *   *Ledger:* A shared spreadsheet. Once a historical case is assigned to Class A, it stays in Class A forever.
      *   *Adversarial:* Colleague B picks the rival class. If Ratio > 2.0, escalate to CUO.
      *   *Judgment Calls:* Explicitly label them.

  5.  **Running the Files:**
      *   *File 1 (Exhibition):* Standard but specific. Class: "Touring exhibitions, >3 venues, fragile." Check ledger. Check N. Adversarial: "New shipper" vs. "Fragile works."
      *   *File 2 (Film):* Completion bond. Class: "Indie features, <60 days, first-time director." Risk: Rain + Cashflow. Adversarial: "Experienced Line Producer" (mitigant) vs. "Late Distributor" (risk).
      *   *File 3 (DAC Unit):* First-of-a-kind. No history. Procedure should trigger a "No Price" on frequency. Must use component reliability or expert elicitation. Handoff to CUO for risk appetite (R&D vs. Insurance).

  6.  **Identifying Failure Modes (The "Gaming" Section):**
      *   How will they cheat?
      *   "Telescoping" (making the class definition vague to fit more data).
      *   "Ledger Drift" (reclassifying old deals quietly).
      *   "Adversarial Collusion" (I pick a crazy class so yours looks reasonable).
      *   "The N=5 Hack" (Counting near-misses as data points).

  7.  **Review and Refine:**
      *   *Tone Check:* Is it too academic? Needs to sound like an internal memo from a senior underwriter.
      *   *Constraint Check:* Did I answer the "probability view" question? Yes, by separating Base Rate from Adjusted Rate.
      *   *Constraint Check:* Did I handle the "Zero/One" member issue? Yes, by forcing a "Component/Expert" label.
      *   *Constraint Check:* American English? Yes.
      *   *Constraint Check:* No citations? Yes.

  8.  **Final Polish:** Organize into clear sections: The Protocol, The Three Files, The Failure Modes. Ensure the "Hard No" conditions are prominent. (Self-Correction: Make sure the escalation margin is specific. Let's use a factor of 2.0 for simplicity).

  9.  *(Self-Correction during drafting)*: The prompt asks for a "Hard No" where we do not issue a number. This should happen if the class shopping is egregious or if the risk is truly unpriceable (like the DAC unit potentially). I need to make sure the procedure allows for a "No Quote" decision based on data insufficiency, not just appetite.

  10. *(Final thought on the Probability View)*: I need to be careful not to alienate the frequentists or the Bayesians. The procedure should treat the Reference Class as an *Anchor* (Bayesian) that *must* be justified by Data (Frequentist). If Data is absent, the Anchor is weak, requiring higher risk load or escalation.

  Let's write it.cw
answer: |-
  **MEMORANDUM**
  **TO:** Specialty Risk Desk
  **FROM:** Senior Underwriting
  **SUBJECT:** Reference Class Protocol (RCP-1)
  **DATE:** October 26, 2023

  This procedure is mandatory for all files with exposure >$1m or non-standard terms. It is designed to prevent class shopping and ensure external reviewers can reconstruct the logic. It does not guarantee a price; it guarantees the logic behind the price (or the decision not to price) is defensible.

  There are three types of stops in this procedure:
  1.  **Hard Stop:** The file cannot be priced using frequency methods.
  2.  **Escalation:** The variance between underwriters is too high; Chief Underwriting Officer (CUO) decides.
  3.  **Appetite Handoff:** The number is valid, but the risk exceeds our tolerance.

  ---

  ### THE PROCEDURE (RCP-1)

  **Step 1: The Ex-Ante Membership Test**
  Define the reference class. You must write down the inclusion criteria.
  *   **Rule:** For every historical case you intend to include, ask: "Could I have flagged this case as 'In Class' *before* the loss occurred?"
  *   **Fail Condition:** If the criteria rely on outcome knowledge (e.g., "projects that suffered unavoidable delays," "claims that were accidental"), the class is disqualified.
  *   **Remedy:** If your best predictive class fails this test, you must widen the class until it passes (e.g., change "unavoidable delays" to "all delays >10 days"). If widening the class makes the data meaningless (see Step 3), proceed to Step 6 (Hard Stop).
  *   **Probability Note:** This step is neutral. Frequentists need clean data; Bayesians need a valid anchor. Both require ex-ante definability.

  **Step 2: The Ledger Lock**
  Consult the master "Class Ledger" (shared spreadsheet).
  *   **Rule:** Every historical case used in a file is assigned a unique Case ID. Once a Case ID is assigned to Reference Class A, it cannot be assigned to Reference Class B in a future file.
  *   **Rule:** You cannot re-evaluate historical outcomes. If a 2019 exhibition was coded "No Loss" in the Ledger, it remains "No Loss" even if a claim was later discovered.
  *   **Fail Condition:** If you cannot find the Case IDs for your proposed historical comparables, you cannot use them.
  *   **Judgment Call:** This prevents double-counting favorable data. It forces you to accept the "ugly" data you previously filed.

  **Step 3: The Sample Size Floor**
  Count the valid historical cases ($N$) in your chosen class.
  *   **Rule:** If $N < 5$, you cannot claim a frequency-based loss rate. You may use the class as a *weak anchor* only.
  *   **Rule:** If $5 \le N < 20$, you may calculate a frequency, but you must apply a "Thin Data Load" (add 20% to the probability).
  *   **Rule:** If $N \ge 20$, you may use the raw frequency.
  *   **Judgment Call:** The cutoff of 5 is arbitrary. It is a judgment call wearing a lab coat. Below 5, the variance is too high to pretend this is statistics.
  *   **Zero/One Member:** If $N = 0$ or $1$, you **cannot** issue a frequency number. You must switch to Step 4.

  **Step 4: The Component Breakdown (For $N < 2$)**
  If you have no valid class history (e.g., first-of-a-kind technology):
  *   **Rule:** Do not guess a total loss probability. Break the risk into components with known failure rates (e.g., shipping, mechanical failure, weather).
  *   **Rule:** If components also lack data, you must solicit three independent expert estimates (external to the desk).
  *   **Labeling:** The final number must be labeled "Expert Elicitation" or "Component Sum," not "Base Rate."
  *   **Hard Stop:** If you cannot break it down and cannot find experts, file a **Hard Stop**. Do not issue a number.

  **Step 5: The Adversarial Review**
  Before finalizing the file, a colleague (not the primary underwriter) must perform a "Rival Class" check.
  *   **Action:** The colleague selects a *different* valid reference class for the same risk (e.g., Primary chooses "Touring Exhibitions," Colleague chooses "Fragile Art in Transit").
  *   **Calculation:** Both underwriters calculate the probability independently.
  *   **Margin Rule:** Calculate the Ratio ($P_{high} / P_{low}$).
      *   If Ratio $\le 2.0$: Average the probabilities. Document the range.
      *   If Ratio $> 2.0$: **Escalation.** Do not average. Send both class definitions and numbers to the CUO.
  *   **Judgment Call:** The 2.0 margin is the "Material Disagreement" threshold. It acknowledges that different valid classes yield different truths.

  **Step 6: The Appetite Handoff**
  If the procedure yields a number but the risk feels wrong:
  *   **Rule:** If the risk relies on >50% Expert Elicitation (Step 4) OR if the Adversarial Ratio was >2.0 (Step 5), the file is flagged "Appetite Decision."
  *   **Action:** The desk provides the number, but the CUO must sign off on the *Risk Acceptance*, not just the Price. This separates the math from the gamble.

  ---

  ### RUN SHEET: THREE FILES

  Here is how RCP-1 applies to your current queue.

  #### File 1: Touring Exhibition (Fragile Works)
  *   **Risk:** 90 works, 4 venues, 14 months, new shipper.
  *   **Step 1 (Membership):** Class = "Touring exhibitions, >3 venues, fragile items."
      *   *Test:* Can we identify these ex-ante? Yes. Venue count and item type are known at quote.
      *   *Exclusion:* Do not use "exhibitions with new shippers" if you can't verify shipper history ex-ante for old files. Stick to venue count/item type.
  *   **Step 2 (Ledger):** Check Ledger. Assume we find 12 historical matches.
  *   **Step 3 (Sample):** $N=12$. This is in the "Thin Data" zone ($5 \le N < 20$).
      *   *Action:* Calculate frequency, add 20% load.
  *   **Step 5 (Adversarial):** Colleague picks "All Art Transit" ($N=200$) vs. your "Fragile/4-Venue" ($N=12$).
      *   *Outcome:* If the "Fragile" rate is 5% and "All Art" rate is 1%, Ratio = 5.0.
      *   *Result:* **Escalation.** The specific class is predictive but thin; the broad class is thick but less predictive. CUO decides if we charge for the specific risk or the average risk.
  *   **Verdict:** Do not average. Escalate.

  #### File 2: Indie Film Completion Bond
  *   **Risk:** First-time director, experienced producer, rainy season, late distributor.
  *   **Step 1 (Membership):** Class = "Indie features, <60 days, first-time director."
      *   *Test:* Ex-ante valid.
      *   *Trap:* Do not use "films with late distributors" unless you had that data at the start of historical files. You likely didn't. Exclude that variable from the class definition.
  *   **Step 3 (Sample):** Likely $N < 5$ for this specific combo.
      *   *Action:* Move to Step 4 (Component Breakdown).
      *   *Breakdown:* Probability(Delay due to Weather) + Probability(Delay due to Cashflow).
      *   *Weather:* Use historical weather data for location (Frequency).
      *   *Cashflow:* Use distributor credit rating (Frequency/Expert).
  *   **Step 5 (Adversarial):** Colleague argues "Experienced Line Producer" is the dominant class (lower risk). You argue "First-time Director" (higher risk).
      *   *Outcome:* If divergence > 2.0, Escalate. Given the "Late Distributor" flag, this likely triggers Escalation.
  *   **Verdict:** Component-based price, flagged for Appetite Handoff due to Cashflow uncertainty.

  #### File 3: Direct Air Capture (DAC) Unit
  *   **Risk:** First-of-a-kind, no operating history, availability guarantee.
  *   **Step 1 (Membership):** Class = "Industrial equipment availability."
      *   *Test:* Fails. A DAC unit is not a pump or a turbine. "First-of-a-kind" means no historical class exists.
  *   **Step 3 (Sample):** $N = 0$.
  *   **Step 4 (Component):** Can we break it down?
      *   *Issue:* It's an integrated system. Component reliability doesn't equal system availability (integration risk is the killer).
      *   *Experts:* Are there three independent experts who can guarantee year-one availability? Unlikely. They are the vendors.
  *   **Verdict:** **HARD STOP.**
  *   **Action for CUO:** Do not hand over a number. Hand over a **Risk Memo**.
      *   *Memo Content:* "We have no ex-ante class. We have no component data. Any number we write is a guess laundered as math. This is Venture Capital risk, not Insurance risk. If we write this, we are betting on the technology working, not pricing a probability."
      *   *Recommendation:* Decline or structure as a parametric trigger with a cap that limits exposure to premium paid.

  ---

  ### FAILURE MODES & GAMING THE SYSTEM

  You asked where this will misfire. Your desk is incentivized to write premium. Here is how you will try to break RCP-1, and how to catch it.

  **1. The "Telescoping" Hack**
  *   **The Move:** In Step 1, you define the class vaguely enough to get $N > 20$, but specifically enough to exclude the bad losses. (e.g., "Exhibitions in climate-controlled venues" — where you quietly exclude the one climate-controlled venue that burned down).
  *   **The Catch:** The Quarterly Reviewer checks the Ledger. If a historical case fits your written definition but isn't in your dataset, you fail the audit.
  *   **The Fix:** The Ledger is immutable. If the definition fits the Case ID, the Case ID is in.

  **2. The "Adversarial Collusion"**
  *   **The Move:** You and your colleague agree to pick two classes that are close enough to avoid Escalation, even if a better, riskier class exists.
  *   **The Catch:** The CUO spot-checks files where the Ratio is just under 2.0 (e.g., 1.9).
  *   **The Fix:** Random audit of "Near-Miss" escalations.

  **3. The "N=5 Hack"**
  *   **The Move:** Counting "near misses" or "incidents" as losses to bulk up $N$ in Step 3.
  *   **The Catch:** Definition of "Loss" must be standardized in the Ledger (e.g., "Paid >$10k" or "Claim Filed").
  *   **The Fix:** Ledger definitions cannot change retroactively.

  **4. The "Expert Laundering"**
  *   **The Move:** In Step 4, asking an "expert" who is actually the broker or the client to validate your guess.
  *   **The Catch:** Expert must be third-party, documented by email, and conflict-checked.
  *   **The Fix:** Require external email domains for Step 4 elicitation.

  ### WHERE THE PROCEDURE TAKES A SIDE

  You asked about probabilities as frequencies vs. credences.
  *   **Step 3 takes the Frequentist side:** It demands $N \ge 5$ to claim a rate.
  *   **Step 4 takes the Bayesian side:** It allows credences (expert opinion) when frequencies don't exist, but forces you to label them as such.
  *   **The Split:** The procedure forces you to admit when you are switching from one to the other. The sin isn't using credences; it's calling a credence a frequency.

  ### FINAL NOTE

  This procedure will slow you down. It will reduce your premium volume. It will cause friction with brokers who want a number today.

  That is the point.

  If you cannot reconstruct the number from the file, you do not have a number. You have a story. We sell insurance, not stories.

  **Approved By:**
  Chief Underwriting Officer
