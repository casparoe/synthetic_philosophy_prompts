answer: |-
  The decision-theoretic vocabulary is built so as to be blind to something real—specifically the internal architecture of deliberation—rather than the philosophical dispute being merely a disagreement over which counterfactual to privilege.

  Translating the three accounts into your framework yields distinct empirical tests. (i) The **bypass view** maps to exploiting bounded rationality: it identifies manipulation where the sender induces an action shift without a corresponding shift in the posterior mean over payoff-relevant states, effectively moving the receiver along their choice function by altering the error term or cognitive constraints rather than the information set. In your language, this is a treatment effect that persists even when controlling for belief updating, suggesting the signal operates via a friction rather than a Bayesian update. (ii) The **counterfactual-information view** translates to stability under full disclosure: an influence is manipulative if the treatment effect (uplift) vanishes when the signal structure and the sender's objective function are made common knowledge. This is identifiable as the difference between uplift in a blinded arm versus an arm where the targeting logic and commercial intent are explicitly revealed to the user prior to exposure. (iii) The **self-endorsement view** becomes a welfare alignment test: it asks whether the induced action maximises the receiver's utility function given her true preferences, rather than the sender's. Experimentally, this requires measuring ex-post satisfaction or long-run retention as a proxy for the receiver's true objective, checking whether the short-run proxy you optimised (e.g., click-through) diverges from the receiver's guardrail metrics (e.g., well-being or lifetime value).

  Your fourth candidate, **audit-incrementality**, is **identifiable but conceptually conflated**. You can measure the collapse in uplift when users are shown the model profiling them, but this metric mixes two distinct mechanisms: it captures both the loss of informational advantage (the user now knows something about the state or their own type they didn't before) and a preference shock (the user derives negative utility from knowing they are being profiled). It is not vacuous, as it produces a non-zero estimate, but it fails to isolate manipulation because a legitimate signal might also lose potency if disclosed (e.g., a surprise discount), and a manipulative one might not (if the user is powerless to resist even when aware).

  The residue report indicates significant structural limitations in your framework. What translates cleanly are **incentives** (objective functions), **information asymmetries** (private signals versus common knowledge), and **welfare outcomes** (receiver utility). What distorts is **deliberation**, which your model collapses into a black-box updating function; you can observe the input (signal) and output (action/posterior), but the 'weighing' process is assumed to be fixed Bayes-plausibility rather than a mutable cognitive mechanism. What has no expression is **reasons**: in your models, preferences are parameters and signals are data, so there is no counterpart to a 'normative justification' for an action distinct from the causal trigger. Regarding your specific suspicions: your framework cannot represent the difference between **influencing beliefs** (shifting the posterior over $\omega$) and **influencing live considerations** (shifting the attention weights or the subset of states included in the utility calculation) without adopting a rational inattention model where attention is costly and endogenous. It handles **deception about the world** (misreporting the state) well, but struggles with **deception about intentions** because standard information design assumes the sender's payoff function is either known or irrelevant under commitment; if intentions are hidden, you are in a signalling game, not a pure design problem. Finally, the thought that someone is **used as a mere instrument** maps to a divergence between sender and receiver objective functions, but the model treats this as a conflict of interest rather than a moral violation; it quantifies the agency loss but cannot flag it as impermissible.

  The verdict is that your vocabulary is not merely incomplete but structurally exclusionary. It is not that the philosophers' dispute is thin; rather, your framework assumes away the very substrate—the internal architecture of agency—upon which the distinction rests. By modelling the receiver as a fixed updating rule with exogenous preferences, you render the mechanism of manipulation invisible, leaving only the outcomes (uplift, welfare loss) as measurable residues. You can detect that something happened, and you can measure whether the receiver was worse off, but you cannot represent *how* the influence bypassed or co-opted her deliberation, because the model assumes deliberation is simply Bayesian updating. Consequently, the framework is blind to the difference between persuasion that respects agency and manipulation that subverts it, unless you define that difference entirely externally via welfare weights or transparency constraints.
