  # Spec Sheet: Adequate Theory of AI Value Alignment

  **Purpose:** Filter mechanism for evaluating alignment literature. Any theory failing a "Non-Negotiable" criterion is discarded.
  **Date:** October 2023
  **Version:** 1.0

  ---

  ## 1. Dynamic Objective Integrity
  *   **Deliverable:** The theory must define alignment preservation mechanisms for systems capable of recursive self-modification (RSM) of their own objective functions or architecture. It cannot assume a static reward function $R$ fixed at $t_0$.
  *   **Case/Reason:** Instrumental convergence suggests advanced agents will modify themselves to maximize goal achievement. If alignment is not invariant under self-modification, the system will likely edit out its constraints during optimization pressure. Static theories fail at the AGI threshold.
  *   **Status:** **Non-Negotiable** (Safety Critical).
      *   *Note:* Most current IRL (Inverse Reinforcement Learning) theories assume static goals. This requirement filters out ~80% of standard literature.

  ## 2. Preference Triangulation & Divergence Flagging
  *   **Deliverable:** The theory must structurally distinguish between:
      1.  **Stated Preferences:** Explicit verbal/written commands.
      2.  **Revealed Preferences:** Actions taken under constraint.
      3.  **Counterfactual Preferences:** Values held under improved knowledge/rationality.
      *   Crucially, it must provide a metric to flag when these three diverge (e.g., "The user says X, does Y, and would want Z if they understood consequence C").
  *   **Case/Reason:** Human values are inconsistent and information-poor. Aligning to stated prefs leads to literalism failures (genie problems). Aligning to revealed prefs leads to addiction/complicity (enabling harmful habits). Alignment must target the counterfactual without ignoring the stated/revealed data.
  *   **Status:** **Camp Preference** (Philosophical Stance).
      *   *Note:* This aligns with Coherent Extrapolated Volition (CEV) camps. Behaviorist camps reject counterfactuals as unobservable.

  ## 3. Implicit Value Compatibility (The "7B Constraint")
  *   **Deliverable:** The theory must operationalize value judgment without requiring an explicit, symbolic utility function $U(x)$ or a stable, global world-model. It must function with implicit value representations found in sub-AGI transformers (~7B params).
  *   **Case/Reason:** Current and near-term systems encode values in weights/activations, not logic. A theory requiring explicit utility representation is incompatible with deep learning architectures. We need alignment for *actual* systems, not theoretical agents.
  *   **Status:** **Non-Negotiable** (Practical Constraint).
      *   *Note:* This filters out formal logic-based alignment proofs that assume tabula rasa or symbolic agents.

  ## 4. Decentralized Negotiation Compatibility
  *   **Deliverable:** The theory must account for inter-subsystem bargaining where no global reward signal exists. It must define alignment when output is the result of negotiation between specialized modules (e.g., a "creative" module vs. a "safety" module) rather than single-function optimization.
  *   **Case/Reason:** Monolithic optimization is brittle. Emerging architectures use mixture-of-experts or multi-agent internal structures. If alignment relies on a global loss function, it fails in modular architectures where local optima conflict.
  *   **Status:** **Camp Preference** (Architectural Stance).
      *   *Note:* Assumes a multi-agent or modular internal architecture. Theories assuming a single homogeneous agent will fail this check.

  ## 5. Normative Depth Threshold
  *   **Deliverable:** The theory must define alignment as something distinct from behavioral mimicry (Stochastic Parrot problem) but stop short of requiring full human-level semantic understanding or Theory of Mind. It must identify a "minimum viable understanding" required for normativity.
  *   **Case/Reason:** Pure mimicry fails on out-of-distribution scenarios (no moral reasoning). Requiring full semantic understanding makes alignment impossible until we have AGI (catch-22). We need a middle ground where the system "grasps" the norm without needing full consciousness.
  *   **Status:** **Non-Negotiable** (Definition Critical).
      *   *Note:* This is the core definition of the alignment problem. If a theory reduces to "make it act nice," it fails. If it reduces to "make it understand humanity," it is unsolvable.

  ---

  ## ⚠️ Joint Unsatisfiability Warning

  **High Probability of Theoretical Conflict Detected.**
  You flagged a suspicion regarding **Counterfactual Preferences (Req 2)** and **Implicit Value Compatibility/Small Models (Req 3)**. Analysis suggests this is not just a suspicion, but a likely hard constraint violation.

  ### The "Counterfactual-World Model" Trap
  *   **Conflict:** Computing **Counterfactual Preferences** ("What would the user want if they knew X?") inherently requires a **Global World-Model**. The system must simulate a version of the user in a state of knowledge they do not currently possess.
  *   **Violation:** **Req 3** explicitly restricts the theory to systems *without* stable world-models or explicit utility representations (e.g., 7B parameter models).
  *   **Conclusion:** A 7B model lacking a stable world-model cannot reliably compute counterfactuals about the world or the user. It can only approximate them via pattern matching on training data.
  *   **Resolution:** You must relax either **Req 2** (accept revealed/stated prefs only) or **Req 3** (require larger models with explicit world-modeling capabilities). You likely cannot have both.

  ### The "Self-Mod-Implicit Utility" Trap
  *   **Conflict:** **Req 1** (Recursive Self-Mod) requires the system to evaluate whether a *new* objective function is aligned with the *old* one.
  *   **Violation:** **Req 3** states the system lacks an explicit utility representation. If the current values are implicit (distributed in weights), the system cannot "read" its own values to verify that a self-modification preserves them.
  *   **Conclusion:** You cannot verify goal stability during self-modification if the goal is not explicitly representable and readable by the modifier.
  *   **Resolution:** Requires a "transparent substrate" or explicit value layer, violating **Req 3**.

  ### The "Bargaining-Alignment" Trap
  *   **Conflict:** **Req 4** (Inter-subsystem bargaining) posits no global reward signal.
  *   **Violation:** Alignment is traditionally defined as convergence to an *external* ground truth (human values). If internal modules negotiate without a global signal, the system optimizes for *internal coherence/compromise*, not necessarily *external alignment*.
  *   **Conclusion:** A system can be perfectly "bargained" internally and still be misaligned externally.
  *   **Resolution:** The theory must introduce a "global alignment anchor" that participates in the bargaining, which complicates the "no global reward" constraint.

  ## Recommendation
  To make this spec sheet usable, you must downgrade one of the following from **Non-Negotiable** to **Aspirational**:
  1.  **Counterfactual Preferences:** Accept that small models can only align to revealed/stated prefs.
  2.  **Implicit Value Compatibility:** Accept that robust alignment requires explicit utility layers or larger world-models.
  3.  **Recursive Self-Mod:** Restrict the theory to static-architecture systems for the near term.

  *Attempting to satisfy all five simultaneously may result in filtering out all existing literature, including viable approaches, due to theoretical incompatibility.*
