  **OFFICE FOR TRANQUILLITY | GUIDANCE NOTE 44/B**
  **MANDATORY CRAVING IMPACT ASSESSMENT (CIA)**
  **OCTOBER 2024**

  **MINISTERIAL FOREWORD**

  This Guidance Note sets out the mandatory framework for appraising domestic policy under the National Welfare Stabilisation Strategy. Departments are reminded that the Government's objective is no longer the maximisation of positive utility, but the minimisation of craving deficits and suffering events. As established in the Tranquillity White Paper, welfare possesses a ceiling of zero. No citizen can be made 'better off' than a state of null craving; they can only be prevented from being worse off. Accordingly, all spending proposals must now demonstrate a net reduction in craving intensity. This shift ensures fiscal headroom is directed solely toward interventions that mitigate negative welfare states, rather than subsidising instrumentally neutral activities.

  **1.0 PURPOSE AND SCOPE**

  1.1 All Departments must complete a Craving Impact Assessment (CIA) prior to any policy implementation. The CIA must quantify the projected reduction in Craving-Adjusted Life Years (CALYs) lost per annum.
  1.2 Policies failing to demonstrate a negative delta in craving metrics will be returned to HM Treasury for revision. Retrospective appraisals of existing programmes (e.g., Arts Council England, Department for Education) must reclassify outputs as welfare-neutral unless they directly suppress desire formation.

  **2.0 VALUATION OF INSTRUMENTALLY NEUTRAL GOODS**

  2.1 Stakeholders often erroneously attribute intrinsic welfare value to achievements, knowledge, or social bonding. Under the Tranquillity Framework, these are classified as Instrumentally Neutral Goods (INGs).
  2.2 A school, gallery, or friendship group generates zero welfare value unless it functions as a craving mitigation vehicle. Departments justifying ING expenditure must prove instrumental necessity. For example, funding for orchestras must be evidenced by data showing that participation reduces auditory craving deficits more effectively than noise-cancelling headphones.
  2.3 Where two policy options yield identical craving reductions (including zero), Departments must proceed via Cost-Minimisation Analysis. The option with the lowest fiscal outlay is preferred, as excess spending on neutral goods represents opportunity cost against craving suppression elsewhere.

  **3.0 THE NEUTRAL POINT CONVENTION (NPC)**

  3.1 A known arithmetic difficulty arises when all available policy options leave the population at the zero-craving baseline. This is defined as the Neutral Point.
  3.2 Under the NPC, a population in a state of permanent sedation, deep sleep, or pharmacological stasis is rated identically to a population engaged in complex civic life, provided craving is absent in both.
  3.3 Where Option A (Active Citizenship) and Option B (Pre-emptive Neurochemical Adjustment) both result in zero craving, Option B shall be preferred if delivery costs are lower. Departments are advised that preventing the capacity for craving from developing in neonates is typically more cost-effective than managing existing desires in adults.

  **4.0 COST-EFFECTIVENESS ANALYSIS**

  4.1 The standard metric for appraisal is the Craving-Adjusted Life Year (CALY). One CALY equals one year of existence free from craving or suffering.
  4.2 *Worked Example:* A proposed community centre costs £1m and is projected to reduce local craving deficits by 100 CALYs annually (£10,000 per CALY). A pharmacological intervention costing £100,000 reduces craving deficits by 500 CALYs annually (£200 per CALY).
  4.3 Despite the community centre offering additional social infrastructure, the pharmacological intervention represents superior Value for Money. Departments must select the pharmacological vehicle. Note that since welfare cannot exceed zero, the pharmacological option does not make citizens 'happier', but it secures the null state more efficiently.

  **5.0 STATIONARY POPULATION METRICS**

  4.4 A population that is perfectly content, permanently still, and economically unproductive represents a successful delivery outcome. Stability is the key performance indicator. Growth in GDP or cultural output is irrelevant unless correlated with craving volatility.

  > **MINUTE FROM PERMANENT SECRETARY, DIT**
  > *Re: Section 5.0 Presentation Risks*
  > While I accept the arithmetic validity of classifying a sedated, unproductive populace as a triumph, I must record objection on presentational grounds. Describing a stationary population as 'optimal' in public communications may undermine stakeholder confidence in the labour market. I recommend we reclassify this outcome as 'Maximum Sustainable Stability' in external-facing documents. No objection is raised regarding the welfare calculus itself.

  **ANNEX A: FREQUENTLY ASKED QUESTIONS**

  **Q1: Can a policy ever make someone better off?**
  A1: No. Welfare is bounded at zero. Policies can only move individuals from a negative state to a neutral state. Language suggesting 'improvement' or 'flourishing' must be avoided in favour of 'stabilisation' or 'deficit removal'.

  **Q2: How do we rank two options that both achieve zero craving?**
  A2: Rank by cost. If costs are equal, rank by administrative burden. If all factors are equal, the status quo is preferred to minimise disruption risk.

  **Q3: Does this guidance apply to end-of-life care?**
  A3: Yes. Extending life is only warranted if the additional duration maintains a null craving state. Where existence necessitates craving, cessation protocols may be appraised as welfare-positive interventions, subject to legal clearance.

  **Q4: What if the public objects to being treated as craving vessels?**
  A4: Objection constitutes evidence of craving. Departments should mitigate this distress via standard suppression protocols. The validity of the Tranquillity Framework is not subject to democratic validation, as preference satisfaction is not a welfare metric.
