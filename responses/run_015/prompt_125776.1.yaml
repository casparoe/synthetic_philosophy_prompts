  2.  **Deconstruct the Core Problem:**
      *   The central tension is between *Incommensurability* (values cannot be measured on a single scale) and *Trade* (exchange implies comparison/measurement).
      *   If I trade X for Y, am I saying X = Y? If so, they are commensurable. If not, how is the trade rational?
      *   Institutional design needs rules for making decisions when people hold these conflicting values.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: The Incommensurability Constraint.* The theory must actually respect the idea that values are different in kind, not just degree.
          *   *Motivating Case:* Religious liberty vs. Economic efficiency. You can't just say "more money outweighs less prayer" without losing something essential about the religious claim.
          *   *Status:* Non-negotiable. If it collapses incommensurability, it fails the prompt's premise.

      *   *Desideratum 2: The Rationality of Exchange.* The theory must explain why trading is rational, not just a random swap.
          *   *Motivating Case:* Logrolling in legislature. I vote for your farm subsidy; you vote for my environmental protection. Why is this better than stalemate?
          *   *Status:* Non-negotiable. A theory of "gains from trade" must explain the "gain."

      *   *Desideratum 3: Means vs. Ends.* Distinguish trading instruments from trading core values.
          *   *Motivating Case:* Compromising on the *location* of a clinic (means) vs. compromising on *who gets treated* (ends).
          *   *Status:* Non-negotiable conceptual distinction.

      *   *Desideratum 4: Pareto vs. Aggregation.* Distinguish making everyone better off vs. summing utility.
          *   *Motivating Case:* A policy that helps Group A immensely but harms Group B slightly (Aggregate gain) vs. a policy that helps both slightly (Pareto).
          *   *Status:* Non-negotiable for liberal/pluralist frameworks, though utilitarians might object (need to flag this).

      *   *Desideratum 5: The "Hidden Currency" Puzzle.* This is the big philosophical hurdle.
          *   *Motivating Case:* If we trade rights for security, are we implicitly valuing both in "utils"?
          *   *Status:* The theory must dissolve this, not ignore it.

      *   *Desideratum 6: Institutional Stability.* The outcome must be sustainable.
          *   *Motivating Case:* A compromise that one side views as treason won't last.
          *   *Status:* Practical necessity.

  4.  **Refining and Categorizing (Non-negotiable vs. Camp-Specific):**
      *   *Non-negotiable:* Logical consistency, accounting for the phenomenon of trade, preserving the means/ends distinction (otherwise it's not moral compromise, it's just engineering).
      *   *Camp-Specific:* Strict Pareto superiority (Utilitarians might accept Kaldor-Hicks), absolute prohibition on trading certain ends (Deontologists vs. Consequentialists). I need to frame these carefully.

  5.  **Identifying Tensions (Jointly Unsatisfiable Pairs):**
      *   *Tension 1:* Deep Incommensurability vs. Determinate Trade-offs. If values are truly incomparable, how do you decide *how much* X for Y?
      *   *Tension 2:* Moral Integrity vs. Social Efficiency. Sometimes the "gain from trade" requires moral dirtying of hands.
      *   *Tension 3:* Procedural Neutrality vs. Substantive Justice. A neutral process might yield unjust outcomes for minority values.

  6.  **Drafting the Content (Tone and Style):**
