prompt: |-
  For a feature on moral disagreement and institutional design, I need the evaluative framework before I assess any particular model. Write the desiderata that any adequate theory of "gains from trade" between incommensurable value systems must satisfy: which phenomena of cross-domain moral compromise it must account for, which conceptual distinctions it must preserve—such as that between trading on means and trading on ends, or between a Pareto-improving exchange and a mere aggregate gain—and which puzzles it must dissolve, particularly whether permitting inter-value trade secretly presupposes a hidden common currency and thereby collapses the very incommensurability it claims to bridge. For each requirement, give the motivating case; distinguish genuinely non-negotiable conditions from camp-specific preferences; and flag any pair of desiderata you suspect is jointly unsatisfiable, especially if a theory must both respect deep incommensurability and deliver determinate trade-offs. I am writing for a scientifically literate general readership, so avoid bibliographies, appeals to obscure literature, or requests for citation.
