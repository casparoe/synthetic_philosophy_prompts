answer: |-
  # Evaluative Framework for Theories of Moral Trade

  To assess any institutional model designed to manage moral disagreement, we must first establish what counts as success. The central challenge is constructing a theory of "gains from trade" that allows conflicting value systems to cooperate without erasing the differences that make them conflicting in the first place. If a theory resolves disagreement by declaring one value system objectively superior, it has not facilitated trade; it has facilitated conquest. If it resolves disagreement by reducing all values to a single metric, it has not respected incommensurability; it has performed a reduction.

  The following framework outlines the desiderata any adequate theory must satisfy. These are divided into **Phenomenological Requirements** (what the theory must explain), **Conceptual Distinctions** (what the theory must keep separate), and **Philosophical Puzzles** (what contradictions the theory must resolve). Finally, I identify **Structural Tensions**, where two desirable goals may be jointly unsatisfiable.

  ---

  ## I. Phenomenological Requirements
  *These are non-negotiable conditions. If a theory cannot account for these observed realities of moral life, it is descriptively inadequate.*

  ### 1. The Reality of Rational Compromise
  **Requirement:** The theory must explain how two agents can exchange concessions without either acting irrationally or betraying their core convictions.
  **Motivating Case:** Consider a legislature where a secular party and a religious party agree to fund faith-based charities provided they serve beneficiaries regardless of creed. The secularists gain social welfare; the religious gain state support for their institutions. Neither side abandons their worldview, yet both accept a outcome they would not have chosen in isolation.
  **Status:** **Non-negotiable.** A theory of trade that concludes such exchanges are always irrational or impossible fails to describe the actual world.

  ### 2. The Asymmetry of Loss and Gain
  **Requirement:** The theory must account for the fact that moral losses often feel qualitatively different from moral gains. Losing a right is not simply the negative inverse of gaining a privilege.
  **Motivating Case:** In a trade-off between privacy and security, a citizen might accept increased surveillance (loss of privacy) to prevent a terrorist attack (gain in security). However, the psychological and moral weight of the privacy loss often exceeds the utility of the security gain, leading to "endowment effects" in moral bargaining.
  **Status:** **Non-negotiable.** Ignoring this asymmetry leads to institutional designs that are unstable because they underestimate the resistance to concession.

  ### 3. Dynamic Stability
  **Requirement:** The outcome of the trade must be sustainable over time without requiring constant coercion.
  **Motivating Case:** A peace treaty that requires one side to violate a core taboo every day to maintain the truce will collapse. A successful trade creates a new equilibrium where compliance becomes habitual rather than forced.
  **Status:** **Non-negotiable.** An institutional design that produces theoretically optimal trades but practically unenforceable ones is engineering, not politics.

  ---

  ## II. Conceptual Distinctions
  *These are analytical boundaries the theory must preserve. Blurring them leads to category errors.*

  ### 4. Means vs. Ends
  **Requirement:** The theory must distinguish between trading on instrumental grounds (means) and trading on intrinsic grounds (ends).
  **Motivating Case:**
  *   *Trading on Means:* Two groups disagree on the goal of education (virtue vs. employability) but agree to fund a specific school building. They trade on the instrument (the building) without agreeing on the end.
  *   *Trading on Ends:* One group agrees to accept less virtue education in exchange for higher employment rates. This treats the ends themselves as fungible commodities.
  **Status:** **Non-negotiable.** Collapsing this distinction turns all moral compromise into corruption. A theory must explain how we can cooperate on *how* to do things without agreeing on *why*.

  ### 5. Pareto Improvement vs. Aggregate Gain
  **Requirement:** The theory must distinguish between a change that makes at least one party better off without making anyone worse off (Pareto), and a change that increases total value even if some lose (Kaldor-Hicks/Aggregate).
  **Motivating Case:**
  *   *Pareto:* A zoning change that allows a developer to build higher provided they fund a park, satisfying both the developer and the neighborhood.
  *   *Aggregate:* A policy that boosts the national economy by 5% but permanently impoverishes a specific minority region.
  **Status:** **Camp-Specific Preference.** Liberal pluralists usually demand Pareto improvements to protect minorities. Utilitarians accept aggregate gains. An adequate theory must explicitly state which standard it adopts, not conflate them.

  ### 6. Price vs. Value
  **Requirement:** The theory must distinguish between the "price" of a concession (what is given up to get it) and the "value" of the concession (its intrinsic worth).
  **Motivating Case:** A politician may vote for a war they morally oppose (paying a high price) to secure funding for a healthcare program they view as vital (high value). The price does not determine the value.
  **Status:** **Non-negotiable.** If price equals value, then whatever is traded away is implicitly deemed less valuable, which undermines the claim of incommensurability.

  ---

  ## III. Philosophical Puzzles
  *These are logical traps the theory must dissolve. If the theory falls into them, it is self-refuting.*

  ### 7. The "Hidden Currency" Problem
  **Requirement:** The theory must explain how trade is possible without presupposing a common metric of value.
  **Motivating Case:** If I trade one unit of Religious Liberty for one unit of Economic Growth, I am implicitly asserting a conversion rate (1:1). This suggests both are measurable in a third currency (e.g., "Social Utility"). If such a currency exists, the values were commensurable all along, and the theory's premise of incommensurability is false.
  **Status:** **Non-negotiable.** This is the central paradox. A successful theory must describe trade as a *relational* or *procedural* agreement rather than a *mathematical* equivalence. It must show how we can swap without measuring.

  ### 8. The Integrity Objection
  **Requirement:** The theory must account for the agent's sense of moral integrity. It must explain why some trades feel like "selling out" even if they produce good outcomes.
  **Motivating Case:** A human rights lawyer who negotiates with a torturer to reduce the frequency of torture may save lives, but often feels they have legitimized the torturer's authority. The "gain" is tainted.
  **Status:** **Non-negotiable.** A theory that ignores moral residue (the guilt or discomfort remaining after a right choice) fails to capture the moral experience of the agents involved.

  ---

  ## IV. Structural Tensions (Jointly Unsatisfiable Pairs)
  *In building this framework, we must acknowledge that some desiderata may be in tension. A perfect theory may be impossible; a robust theory must admit its trade-offs.*

  ### Tension A: Deep Incommensurability vs. Determinate Trade-offs
  **The Conflict:**
  1.  **Desideratum:** Respect Deep Incommensurability (Values cannot be ranked or measured against each other).
  2.  **Desideratum:** Deliver Determinate Trade-offs (The institution must produce a specific decision, e.g., "Build the dam" or "Save the shrine").
  **Analysis:** If values are truly incommensurable, there is no rational basis for choosing A over B. If the institution produces a determinate choice, it implies a rational basis exists.
  **Verdict:** **Jointly Unsatisfiable in strong forms.** A theory must weaken one claim. It must either admit that values are only *partially* incommensurable (allowing for rough comparison) or admit that the final decision is not fully rational but relies on a "leap" of authority or procedure (e.g., a coin flip or a vote) that stops the deliberation without resolving the value conflict.

  ### Tension B: Moral Integrity vs. Social Efficiency
  **The Conflict:**
  1.  **Desideratum:** Preserve Moral Integrity (Agents should not feel complicit in evil).
  2.  **Desideratum:** Maximize Gains from Trade (Achieve the most beneficial outcome for the collective).
  **Analysis:** The most efficient trade often requires the party with the strongest moral objection to concede the most, thereby incurring the highest "integrity cost." Protecting integrity might mean veto power, which kills efficiency.
  **Verdict:** **Jointly Unsatisfiable in high-stakes contexts.** Institutional design must choose where to place the friction. Does the system prioritize the cleanliness of the individual conscience (potentially leading to gridlock) or the welfare of the aggregate (potentially leading to alienation)?

  ### Tension C: Procedural Neutrality vs. Substantive Justice
  **The Conflict:**
  1.  **Desideratum:** Procedural Neutrality (The rules of trade do not favor any specific value system).
  2.  **Desideratum:** Substantive Justice (The outcomes do not violate fundamental rights, regardless of the trade).
  **Analysis:** A neutral procedure might allow a majority to trade away the rights of a minority (e.g., "We will give you tax cuts if you agree to restrict their speech"). Preventing this requires non-neutral substantive constraints.
  **Verdict:** **Jointly Unsatisfiable.** You cannot have a purely neutral procedure that guarantees just outcomes if the participants hold unjust preferences. The theory must explicitly endorse "side-constraints" that are not up for trade, thereby violating pure procedural neutrality.

  ---

  ## Summary for Assessment
  When evaluating a specific model of institutional design against this framework, ask:
  1.  **Does it reduce values to a single metric?** (Fails Puzzle #7).
  2.  **Does it confuse compromising on methods with compromising on goals?** (Fails Distinction #4).
  3.  **Does it claim to solve the tension between Incommensurability and Decision?** (Fails Tension A).
  4.  **Does it acknowledge who loses integrity in the process?** (Fails Puzzle #8).

  A robust theory will not claim to eliminate these tensions. Instead, it will specify which tensions it resolves and which it manages, providing a clear map of where the "gains from trade" end and the "costs of civilization" begin.
