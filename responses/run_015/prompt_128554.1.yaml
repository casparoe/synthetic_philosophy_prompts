answer: |-
  ### Teaching Arc: Al-Ghazālī on Causation (90 Minutes)

  #### 1. Conceptual Dependency Order (0–20 Minutes)
  *Goal: Shift the group from interventionist confidence to epistemic humility regarding observation.*

  Before Ghazālī's thesis can register as an epistemological challenge rather than a theological non-starter, three conceptual pieces must be locked in sequence. Do not introduce God yet.

  1.  **The Strict Empiricist Constraint:** Force the admission that sensory observation yields only data about *sequence*, not data about *connection*. Even for interventionists: when you manipulate variable X and Y changes, you observe the manipulation and the change, but you do not observe the "making happen."
  2.  **The Logical Gap:** Establish that no number of observed instances of succession logically entails a necessary connection in the next instance. (Accept this as a logical point, not yet a skeptical one).
  3.  **The Contingency of Nature:** Establish that if there is no necessary internal connection, the continuation of regularity is not self-guaranteed by the objects themselves.

  **Pedagogical Move:** Ask the interventionists: "When you intervene on a mechanism, do you observe the *necessity* of the outcome, or only the *fact* of the outcome?" Once they concede they only observe the fact, the door is open for Ghazālī.

  #### 2. Introducing the Thesis: Fire and Cotton (20–50 Minutes)
  *Goal: Present occasionalism as the only ontological fit for the established epistemological constraints.*

  Introduce the fire/cotton example not as a miracle, but as a strict reading of the empirical data established in Phase 1.

  **Features the Example Must Display:**
  *   **Invariant Reproducibility:** Acknowledge that fire *always* burns cotton in experience. Ghazālī does not deny this.
  *   **Temporal Immediacy:** The effect follows the contact without perceptible lag, reinforcing the illusion of direct agency.
  *   **Spatial Contiguity:** The flame touches the fiber; there is no action at a distance.

  **Feature the Example Must Lack:**
  *   **Empirically Accessible Necessary Link:** There must be no observable "transfer of power," "essence activation," or "mechanistic glue" passing from flame to fiber. The students must agree they see *contact* and *combustion*, but never the *compulsion* that makes combustion follow contact.

  **The Thesis Statement:**
  "Since observation yields only succession, and objects possess no observable power to compel effects, the fire is merely the *occasion* (the temporal marker) for the burning, while the true agent is the only being capable of sustaining the existence of the cotton and its states moment-to-moment."

  #### 3. Distinguishing from Humean Skepticism (50–75 Minutes)
  *Goal: Prevent the collapse of Ghazālī into Hume by contrasting the warrant for predictive practice.*

  This is the critical pivot. Both deny necessary connection in nature, but they diverge on what sustains regularity.

  *   **Hume's Position:** There is no metaphysical necessity. The warrant for predicting fire will burn cotton tomorrow is **psychological habit** (custom). Science works because humans are wired to expect regularity, not because nature is guaranteed to be regular.
  *   **Ghazālī's Position:** There is no metaphysical necessity *in creatures*. However, without theological supplementation, regularity is gratuitous and could cease instantly. The warrant for predicting fire will burn cotton tomorrow is **Divine Habit** (*ādah*). Science works because God voluntarily chooses to maintain consistency, not because nature is self-sustaining.

  **The Precise Distinction:**
  "Hume undermines metaphysical necessity but preserves predictive regularity as a brute fact grounded in human psychology; Ghazālī's occasionalism, if taken without theological supplementation, threatens to undermine even that predictive warrant because regularity becomes a contingent act of will rather than a fixed habit of nature."

  #### 4. Map of Predictable Misconceptions
  *Goal: Head off objections at the exact moment they arise in the arc.*

  | Misconception | Sequence Point | Defusing Distinction (One Sentence) |
  | :--- | :--- | :--- |
  | **1. Science-Denial** | **Phase 2 (Fire/Cotton)**: When students hear "fire doesn't burn," they will assume Ghazālī denies the burning. | "Ghazālī denies the *ontology* of the cause (the fire's power), not the *regularity* of the sequence (the burning itself)." |
  | **2. Humean Collapse** | **Phase 3 (Hume Contrast)**: When students hear "no necessary connection," they will equate Ghazālī with Humean skepticism. | "For Hume, custom justifies prediction; for Ghazālī, only God's consistent will justifies prediction, making nature inherently more fragile than Hume allows." |
  | **3. God-of-the-Gaps** | **Phase 3 (Ontology)**: When students hear "divine action," they will assume this explains only what science *cannot* yet explain. | "This is not an explanation for the unexplained gaps in mechanism, but an explanation for the *existence* of the mechanism itself at every moment." |

  #### 5. Closing Check Question (75–85 Minutes)
  *Goal: Verify grasp of the specific Ghazālī/Hume divergence.*

  **Question:**
  "Both Ghazālī and Hume agree we do not observe necessary connection in nature; so when you predict that fire will burn cotton tomorrow, what constitutes the **ground of that prediction** for Ghazālī that is categorically absent for Hume?"

  **Failure Condition:**
  If they answer "Both rely on habit" or "Both deny necessity," they have failed.

  **Success Condition:**
  They must identify that for Ghazālī the ground is **external ontological sustenance (Divine Will)**, whereas for Hume the ground is **internal psychological propensity (Custom)** with no external guarantee.

  #### 6. Explicit Exclusions (85–90 Minutes)
  *Goal: Protect the arc from metaphysical bloat.*

  **What to Leave Out:**
  1.  **Ash'arite Atomism:** Do not discuss the discrete reconstruction of time and substances.
      *   *Reason:* This shifts the debate from the *epistemology of causation* (what we observe) to the *metaphysics of substance* (what exists), which distracts from the critique of mechanistic necessity.
  2.  **The Doctrine of Acquisition (*Kasb*):** Do not discuss how human agency fits into divine causation.
      *   *Reason:* This shifts the debate from *natural causation* (fire/cotton) to *moral theology*, which invites complications about free will that break the specific focus on scientific regularity.

  **Refusal Script:**
  "We are bracketing the metaphysics of time and the theology of human action to focus strictly on the epistemological critique of causal powers in natural science."
