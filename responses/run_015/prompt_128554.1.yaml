g that fails if they merely reply that both deny necessary connection. Finally, state explicitly what should be left out at this level and openly refused: for instance, the Ash'arite metaphysics of atomism and the doctrine of acquisition (kasb), with a brief reason why introducing them here would break the arc. No reading list or further sources, please.
