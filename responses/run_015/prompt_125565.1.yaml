  8.  **Final Polish:** Ensure tone is appropriate for a judge/philosopher. Check "Reconciliation" taboo. Ensure all 6 cases are referenced where relevant.

      *(Final check on "Reconciliation")*: The prompt says "Taboo reconciliation, or at least say which of the three or four different things you mean by it." I will explicitly define it if I use it, but better to use "Civic Readmission" to avoid the baggage.

      *(Final check on Case 3 D.)*: D was granted despite being a victor. This supports M (also Congress/Winning side).
