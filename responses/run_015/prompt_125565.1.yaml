          *   *Precedent:* Case L (records officer) and Case D (naming politicians) granted for disclosure value. Case W denied because truth was empty.
          *   *Prediction:* **GRANTED.** The societal benefit of exposing the new officials outweighs the moral cost of exempting M. The "would do it again" attitude is irrelevant if the truth is secured.

