      *   *Refinement on Strawson:* Ensure I don't misrepresent Strawson. He acknowledges the objective attitude is necessary for some, but Meursault isn't "incapable," he's "unwilling." This is the crux. The court treats him as *capable* (to blame him) but *alien* (to execute him).
      *   *Refinement on Camus:* Keep the Absurd present. Meursault isn't a sociopath; he's honest to the point of social suicide.

  7.  **Final Polish:** Check against the user's constraints.
      *   *Did I reduce Camus to Strawson?* No, I used Strawson to highlight the social mechanics Camus depicts.
      *   *Did I distort philosophy?* No, I applied the concepts rigorously.
