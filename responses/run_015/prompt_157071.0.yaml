answer: |-
  **Scenario**
  A biotech startup is scaling a novel protein synthesis process from benchtop flasks to a pilot plant. The engineering team's inside view flags a specific viscosity issue: at this volume, the stirring mechanism cannot maintain homogeneity without shearing the protein, based on fluid dynamics simulations specific to their vat geometry. However, the outside view looks promising: a literature review of "successful scale-ups in comparable mRNA therapies" shows a high completion rate. This reference class is gerrymandered; the team selects it because they secured funding by claiming similarity to mRNA projects, which had unprecedented government backing and tolerance for waste. Crucially, the literature suffers from severe publication bias: failed scale-ups are never written up, only converted back to smaller batches or quietly abandoned, meaning the base rate is calculated exclusively over survivors who got lucky with their rheology or had unreported equipment modifications.

  **The Check**
  The proposition being forecast is whether the pilot plant will achieve target yield within the quarter. The inside view says "no," derived from first-principles engineering constraints: the specific Reynolds number in their vat dictates shear stress exceeds protein tolerance. The outside view says "yes," derived from the base rate of the chosen reference class (published mRNA scale-ups), which implies high feasibility. The inside view lands on failure because it detects the physical bottleneck that actually determines success. The outside view lands on success because the reference class is contaminated by survivorship bias; it excludes the projects that encountered similar viscosity issues and died before publication. The OV is systematically optimistic because the denominator of the base rate excludes the failures that the IV has already identified in the numerator.

  **Honest Note**
  The load-bearing feature here is the **visibility bias** (silent failures), not the gerrymandered class. If you remove the publication bias and assume all attempts are recorded, the outside view immediately regains superiority because the base rate would reflect the true difficulty of scale-up, overriding the specific simulations which might have unknown variables. The gerrymandering amplifies the error but doesn't cause it; even a perfectly chosen class of "novel protein scale-ups" would remain optimistic if failures are unrecorded. The strongest reply from an outside-view defender is: "Then use the corrected reference class, or the base rate conditional on failure." This reply fails because you cannot construct a base rate conditional on failure when the data on failures does not exist. To accept this reply, you must smuggle inside-view judgement back in to estimate the hidden failure rate, effectively admitting that the raw outside view is useless without inside-view correction.

  **Cheating Note**
  The construction is closest to cheating in the stipulation that failures leave **no traces**. In reality, failed projects often leave indirect evidence (bankruptcies, personnel moving to other firms, equipment liquidations) that a skilled forecaster could detect. I have assumed a level of silence that privileges the inside view by making the outside data actively misleading rather than just noisy. To flip this back so the outside view is trusted again, you would need a **mandatory regulatory registry** for all pilot plant attempts, regardless of outcome. This change doesn't need to be global; it only needs to cover the specific jurisdiction or funding body governing the project. If every attempt generates a record upon initiation, the survivorship bias vanishes, the base rate becomes truthful, and the outside view again outperforms the inside view by correcting for the engineers' overconfidence in their simulations.
