answer: |-
  Here is the breakdown. Since you are a maths student, I will treat the probability theory seriously and flag where the book swaps rigorous Bayesian updating for philosophical hand-waving.

  ### Sentence-by-Sentence Autopsy

  **1. "Treat yourself as a random draw from everyone who will ever live. You're about the 100-billionth human, and if there were going to be trillions more it would be a miracle to find yourself this absurdly early — so the total is probably not much bigger than the number born so far..."**
  *   **Verdict:** **Accept (conditionally).**
  *   **Analysis:** This is the standard Doomsday Argument (DA), formulated by Brandon Carter and John Leslie. Mathematically, it relies on the likelihood function $P(\text{rank} | N) = 1/N$. If $N$ (total humans) is huge, the probability of drawing a low rank (100 billion) is small. If $N$ is small, the probability is larger. This is a valid likelihood ratio.
  *   **The Catch:** It only shifts your *credence*. It does not prove doom unless you start with a specific prior distribution over $N$ (usually a scale-invariant prior, $P(N) \propto 1/N$). The book implies the conclusion is forced; it isn't. It's an update.

  **2. "The maths is just Gott's delta-t rule: assume you're at a random point in any ongoing process, and with 95% confidence its future duration is between about a fortieth and about forty times its current age."**
  *   **Verdict:** **Wince.**
  *   **Analysis:** This conflates two distinct arguments.
      *   **Gott's Delta-T:** Applies to *time*. You observe a process at time $t_{past}$. You assume you are randomly located in the total duration $T$. This gives a confidence interval for $T_{future}$. It does not require "observers" or "birth ranks."
      *   **Doomsday Argument:** Applies to *observers*. It relies on your specific rank in a sequence of conscious experiences.
      *   They are analogous (both use a Copernican principle), but they are not "just the maths." Delta-T is generally considered weaker and less paradoxical because it doesn't involve self-locating uncertainty. The book staples them together to make the DA seem more robust than it is.

  **3. "The argument rests on the self-indication assumption — the idea that your own existence is evidence that there are lots of observers like you..."**
  *   **Verdict:** **Wrong. (This is the smoking gun.)**
  *   **Analysis:** The book has this exactly backwards.
      *   The Doomsday Argument rests on the **Self-Sampling Assumption (SSA)**: "Reason as if you are a random sample from the set of all observers."
      *   The **Self-Indication Assumption (SIA)** is the primary *counter-argument* to Doomsday (championed by Nick Bostrom). SIA says: "The fact that I exist at all is evidence that there are *many* observers (because I'm more likely to exist in a world with many observers than one with few)."
      *   **Why it matters:** SIA exactly cancels out the Doomsday Argument. If you apply SIA, the likelihood boost you get for "Small $N$" (from DA) is perfectly offset by the prior boost for "Large $N$" (from SIA). The book claims DA *rests* on SIA; in reality, SIA *destroys* DA. This is a fundamental philosophical error in the text.

  **4. "...and that's also its weak spot, because if you change the reference class from all humans to, say, all mammals the argument gives you nothing at all, which most people now agree refutes it."**
  *   **Verdict:** **Mixed.**
  *   **Analysis:** The "Reference Class Problem" is a genuine, unsolved objection. If you define the class as "all humans," you get Doomsday. If you define it as "all intelligent beings," "all mammals," or "all observer-moments," the math changes drastically.
  *   However, saying "most people now agree refutes it" is an overstatement. In philosophy of cosmology and existential risk, it is treated as a serious, unresolved paradox, not a refuted one. It limits the argument's applicability, but doesn't mathematically invalidate the likelihood ratio itself.

  **5. "Either way the upshot is hard to ignore: we should be spending far more on things like asteroid detection, because the argument tells us we're finished whatever we do."**
  *   **Verdict:** **Wrong.**
  *   **Analysis:** This is a non-sequitur. The DA suggests extinction is *probable* soon, not *inevitable*.
  *   Worse, it creates a paradox called **Probabilistic Inhibition**. If the DA says "humanity will end soon," and you try to prevent it (e.g., asteroid detection), and you succeed, then the total number of humans ($N$) becomes large. But the DA says a large $N$ is unlikely given your rank. Therefore, the DA implies your attempt to save humanity is *likely to fail*.
  *   It does *not* imply "we're finished whatever we do" in a fatalistic sense; it implies that conditional on your existence now, worlds where prevention succeeds are less likely. The book confuses a probabilistic update with a causal constraint.

  ---

  ### Settling the Bet: The Rio Cinema

  You and Sam have accidentally recreated the exact tension between Delta-T and Doomsday. Here is how a sensible person (or a Bayesian) handles it.

  #### 1. Sam's Calculation (Delta-T)
  Sam treats the Rio as a process in time.
  *   **Current Age ($t$):** 14 years.
  *   **Rule:** With 95% confidence, future duration is between $t/39$ and $39t$.
  *   **Result:** 4 months to 546 years.
  *   **Critique:** Sam is right that this is uninformative. Delta-T is a "prior-free" bound. It tells you the cinema is unlikely to close *tomorrow* and unlikely to last *forever*, but it covers almost every practical scenario. It yields no actionable probability for your specific bet.

  #### 2. Your Calculation (Doomsday/Birth-Rank)
  You treat the Rio as a population of admissions.
  *   **Current Rank ($n$):** 200,000.
  *   **Hypothesis A (Early Close):** Total $N_A = 300,000$.
  *   **Hypothesis B (Long Life):** Total $N_B = 7,000,000$.
  *   **Likelihood Ratio:**
      $$ \frac{P(n|N_A)}{P(n|N_B)} = \frac{1/N_A}{1/N_B} = \frac{N_B}{N_A} = \frac{7,000,000}{300,000} \approx 23.3 $$
  *   **Critique:** Your math is correct *for the likelihood ratio*. Observing admission #200,000 is indeed ~23 times more likely if the total will be 300k than if it will be 7m.

  #### 3. The Verdict
  **Sam wins the bet, but you win the math.**

  Here is why you cannot use your calculation to win the bet: **The Prior.**

  Bayes' Theorem:
  $$ \text{Posterior Odds} = \text{Likelihood Ratio} \times \text{Prior Odds} $$

  You calculated the Likelihood Ratio (~23:1 favoring closure). But you have ignored the Prior Odds.
  *   **The Doomsday Assumption:** To get the "Doomsday" conclusion, you must assume a prior of $P(N) \propto 1/N$ (a flat prior over the log scale). This assumes you have *zero* idea how long cinemas usually last.
  *   **The Reality:** You are not ignorant. You know the Rio is a business. You know it has a lease. You know local footfall trends. You know independent cinemas have a specific survival rate.
  *   **The Reference Class Problem:** To run the DA, you must choose a reference class.
      *   Class = "All businesses"? Most die in 5 years. Prior favors Early Close.
      *   Class = "Cinemas in London"? Many last 50+ years. Prior favors Long Life.
      *   Class = "Buildings"? They last centuries. Prior favors Long Life.
      *   Because the result depends entirely on which class you pick, and there is no objective way to pick the "true" class, the 23:1 ratio is unstable.

  **Would a sensible person use this for a bet?**
  **No.** The Doomsday Argument is designed for situations of **total ignorance** where you have no data other than your rank (e.g., predicting the lifespan of the human species where we have no "outside view" of other species).

  For the Rio, you have an "outside view" (business statistics, leases, profits). Using the DA ignores relevant evidence. If you have cash-flow data, that swamps the "admission rank" data.

  ### Summary of Errors in the Book
  1.  **SIA/SSA Confusion:** It claims DA uses SIA. DA uses SSA; SIA is the counter-argument that neutralizes DA.
  2.  **Delta-T Conflation:** It treats time-duration (Gott) and observer-rank (Carter) as identical. They yield different confidence intervals and rely on different assumptions.
  3.  **Fatalism:** It claims prevention is pointless ("finished whatever we do"). DA only suggests prevention is *unlikely to succeed*, not that it is causally impossible.
  4.  **Prior Smuggling:** It presents the likelihood ratio as a conclusion, hiding the requirement for a specific, controversial prior ($1/N$).

  ### Final Advice for the Bet
  Tell Sam: "You are right that the argument is useless for the cinema, but not for the reason you think. It's not because the range is wide (Delta-T); it's because the Likelihood Ratio I calculated is swamped by the Reference Class problem and external priors. The book was wrong about the philosophy (SIA vs SSA), so the premise of our bet is based on a text that doesn't know what it's talking about."

  If you must pick a winner based on the text provided: **Sam.** The book's reasoning is too broken to support your 20:1 claim. The 20:1 ratio is mathematically real *only if* you accept the SSA and a specific prior, both of which the book misidentified. Since the book's justification is flawed, your application of it is unsound.
