answer: |-
  This is a strong, defensible, and philosophically sophisticated framing. You are not smuggling in a mistake; rather, you are identifying a genuine tension in ethical theory that many professional ethicists grapple with.

  Here is a breakdown of the philosophical landscape regarding your draft, followed by specific advice on the examples and distinctions.

  ### 1. Is the framing defensible?
  **Yes.** The standard definition of supererogation (most famously articulated by J.O. Urmson in 1958) is indeed "good to do, but not wrong to omit." You are correct that this is a **negative definition** (defined by what it lacks: obligation).

  Your argument—that supererogation is a marker of social expectations and role differentiation rather than an intrinsic property of the act—is aligned with **sociological and institutional approaches to ethics**.
  *   **The Strength:** You are correctly identifying that "obligation" is not a static physical property of an action; it is assigned by social contracts, roles, and norms.
  *   **The Risk:** The only philosophical pushback you might encounter is from **moral realists** who argue that certain acts are objectively supererogatory regardless of social context (e.g., "Saving a child is always heroic, even in a society that expects it"). However, for a longform piece on *why we treat* actions as heroic, your social-constructivist angle is the more useful lens. You are analyzing the *label*, not necessarily the metaphysical goodness of the act.

  ### 2. Are the examples (Kidney/Burning Building) problematic?
  They are classic for a reason, but the **Doctor vs. Passerby** distinction needs a specific nuance to avoid a counter-argument.

  *   **The Kidney:** This is a safe example. There is almost no context in which a stranger is *obligated* to donate a kidney. It remains supererogatory across almost all social backgrounds.
  *   **The Burning Building/Doctor:** This is where critics might pounce. A critic might say, "A doctor has a *professional* duty, but a *moral* duty to save a life exists for everyone."
      *   **The Fix:** Be precise about **role morality**. The passerby is praised not just because they lack a contract, but because the act exceeds the **baseline of civic expectation**. The doctor is not praised for the same act because it falls within their **professional baseline**.
      *   **Why this helps your point:** It reinforces your thesis that heroism is about the *gap* between expectation and action. If the expectation shifts (e.g., in a militarized society where every citizen is expected to rush into danger), the passerby stops being a hero. The act is the same; the social baseline moved.

  ### 3. Cleaner Distinctions: Obligation, Permission, and Credit
  You asked for a cleaner "in-the-weeds" distinction. To strengthen the paragraph, you might want to mentally (or explicitly) separate three concepts:

  1.  **Obligatory:** You must do it. If you don't, you are blameworthy. (e.g., A doctor treating a patient in the ER).
  2.  **Merely Permissible:** You may do it. If you don't, you are neutral. (e.g., Eating an apple instead of an orange).
  3.  **Supererogatory:** You may do it. If you don't, you are neutral. **But if you do, you are praiseworthy.**

  **The Key Insight for Your Piece:**
  The defining feature of supererogation isn't just "non-obligation" (since eating an orange is also non-obligatory). The defining feature is **positive moral credit (praise)** attached to an **optional** act.

  Your draft hints at this with "practices of... praise," but you could sharpen it. Supererogation is the zone where **praise is available but blame is absent.**

  ### 4. Critique of the Draft Paragraph
  Your draft is 90% there. The sentence *"If we made everyone a hero, heroism would disappear"* is slightly ambiguous. Does it mean "if everyone performed the act" or "if everyone was *expected* to perform the act"? It is the latter that kills heroism. If everyone jumps into rivers to save babies, but it's still not *required*, it might still be heroic. If it becomes *required* (a duty), it ceases to be supererogatory.

  **Here is a suggested polish that tightens the philosophical precision while keeping your voice:**

  > "Supererogatory acts are usually described as things that are good to do but not required. The problem is that this definition makes the category sound purely negative: an act is supererogatory only because it fails to be obligatory. But many of the cases we care about, like donating a kidney to a stranger or rushing into a burning building, depend heavily on social and institutional context. A doctor in an emergency room has a duty to act that a passerby does not; the passerby's act looks heroic partly because the social contract has not assigned them that duty. Supererogation, then, is not just a leftover category of morally optional good acts. It is a way of tracking where our practices of role, expectation, and praise are doing work. If we shifted the baseline norm so that everyone was *expected* to rush into the fire, heroism would disappear—not because the action became less good, but because the gap between duty and sacrifice had closed."

  ### 5. One Concept to Research: "Moral Inflation"
  If you want to dig deeper into the "If we made everyone a hero" point, look into the concept of **moral inflation** or the **expansion of duty**.
  *   Some ethicists (like Peter Singer) argue we should turn supererogatory acts into obligations (e.g., giving away most of your income).
  *   The counter-argument (which supports your piece) is that if we make too much obligatory, we create a society where everyone is constantly blameworthy, and we lose the category of the "saint" or "hero" which inspires us.
  *   This supports your claim: Supererogation is a functional tool society uses to encourage good behavior without demanding it.

  ### Summary
  You are on solid ground. You aren't making a mistake; you are correctly identifying that "obligation" is a social status, not a physical property. Just ensure you distinguish between **professional duty** (contractual) and **moral duty** (expectational), and clarify that heroism vanishes when the *expectation* shifts, not necessarily when the *frequency* of the act shifts.

  This is a compelling angle for a general audience because it moves ethics out of the abstract clouds and into the real world of jobs, laws, and social pressure.
