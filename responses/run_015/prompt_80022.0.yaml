prompt: |-
  I've been reading about the Kelly criterion — the idea that a rational bettor should size each bet to maximize the expected logarithm of their bankroll, or equivalently the long-run geometric growth rate, rather than the plain arithmetic expected value — and it has made me notice a tension I can't quite resolve. On one side, professional poker players and sports bettors are taught to wager only a small fixed fraction of their bankroll on any single hand or event and to treat going bankrupt as the catastrophe to avoid at almost any cost. On the other side, the casinos and bookmakers that take the opposite bet happily justify their long-run profit by the ordinary arithmetic expected value of the game, and they see nothing wrong with that. So the very same game is being valued in two different ways by the people on opposite sides of it.

  What view of rationality does each side's practice actually presuppose? Reconstruct the implicit decision theory on each side, spelling out the assumptions about how many times the bet really gets repeated, about whether one person's whole future is a single long run or a bundle of independent short ones, and about what "winning" even means once bankruptcy is an absorbing state you can never undo. Then tell me whether these two practices are genuinely in conflict, or whether they fall into line once you notice that the casino is effectively a diversified portfolio of many small, nearly independent bets while the individual player is a single undiversified one. And if I were to insist that only the logarithmic, geometric criterion is genuinely rational for a person, what would I have to give up about the everyday idea that a fair game — one with zero expected value — is "break-even," and what would a casino's own risk managers have to say in response to that claim?

  Please keep the entire answer to no more than 500 words.
