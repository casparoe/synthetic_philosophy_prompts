  The unifying principle is **Contextual Role Appropriateness**, grounded in the Confucian concept of *Yi* (righteousness) as fitting action to specific relational contexts. First, the **Public Integrity Clause**: When a role serves a public function (magistrate, teacher), procedural fairness overrides personal partiality to maintain institutional trust. Second, the **Relational Depth Clause**: Authority and obligation scale with the permanence and intent of the bond; adoption confers full parental *li*, while temporary care limits duty to basic safety. Third, the **Harm Threshold Clause**: Private loyalty (friendship) is bounded by public safety; secrets protect reputation, not ongoing harm. Fourth, the **Capacity Modulation Clause**: This resolves your correction-versus-harmony tension. The duty to correct moral faults presumes the recipient's capacity to integrate the lesson. In normal conditions, moral formation trumps temporary harmony because the role aims at long-term virtue. However, during a crisis (depression), the recipient's capacity is compromised. Here, the principle of *Ren* (benevolence) temporarily suspends the demand for *Li* (ritual/correction) to preserve the person's ability to eventually return to the role. The role doesn't vanish; its expression shifts from "strict father" to "nurturing protector" until capacity returns. Role ethics reads the situation to preserve the relationship's long-term health.

  The new cases
  For the retired magistrate: He should decline. Even informally, the "magistrate" habitus conflicts with the "brother" role, especially given estrangement. The community truly needs to see neutrality, and his internal bias risks undermining the arbitration's legitimacy. The role's shadow persists beyond retirement, and estrangement implies unresolved conflict that prevents impartiality. For my invented case: A doctor treating their own spouse for a significant diagnosis. Verdict: They should manage care coordination but not make final treatment decisions. The "healer" role requires objective risk assessment that the "spouse" role's emotional stakes corrupt. Even with good intent, the relational overlap creates a blind spot. Both cases show that when two strong roles overlap on one person, the role requiring greater objectivity, such as arbitrator or doctor, must recuse to preserve the integrity of the service, deferring to the private relationship's limits.

  What has to go
  The simplest version of this principle struggles to save your "Teacher grading own child" verdict. If the Magistrate must recuse to preserve public trust, consistency demands the teacher recuse. Grading "accurately" assumes a level of self-transparency that role ethics doubts; the relationship itself distorts the judgment, regardless of intent. Keeping this verdict requires adding a complex exception about "low-stakes evaluation" versus "high-stakes judgment," which muddies the water. Dropping it is okay. Admitting that some roles are mutually exclusive, parent versus evaluator, strengthens the theory. It acknowledges that certain overlaps corrupt the function itself, not just the outcome. Sacrificing this intuition saves the coherence of the Public Integrity Clause. It is better to lose one edge case than lose the structural logic.
