  4.  **Evaluate Ethical Frameworks (The "Rules"):**

      *   *Framework A: Procreative Beneficence (Savulescu).*
          *   *Principle:* Parents have a moral obligation to select the child with the best expected life.
          *   *Fit:* Fits Huntington's, BRCA, CF, Achondroplasia (unaffected), Duchenne, HLA.
          *   *Conflict:* Fails on Height (why not maximize height if it helps well-being?) and Achondroplasia (affected) (why veto parents' view of "best"?).
