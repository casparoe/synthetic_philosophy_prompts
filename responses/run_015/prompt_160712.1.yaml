      *   *Stigma:* This is the "Expressivist" argument. If the clinic says "Obesity is bad enough to select against," it harms existing obese people. But the parents argue it's about *health* (diabetes), not weight *per se*.
      *   *BRCA vs. Height:* It's technically closer to BRCA (health outcome) but methodologically closer to Height (Polygenic).

  7.  **Drafting the Response:**
