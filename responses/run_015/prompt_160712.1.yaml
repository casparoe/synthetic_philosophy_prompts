          *   *Conflict:* BRCA/CF are "no veto" (gray area). Achondroplasia (unaffected) is tricky (is dwarfism a disease?).
          *   *Prediction for BMI:* **MAYBE/NO.** Is obesity a disease or a trait influenced by environment? If viewed as "disease prevention," Yes. If viewed as "lifestyle/body type," No.

      *   *Framework C: The Harm Principle / Non-Maleficence.*
          *   *Principle:* Don't create a child with a life "not worth living" or significant preventable suffering. Don't actively harm.
