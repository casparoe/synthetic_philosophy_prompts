  9.  **Final Polish:** Ensure the tone is supportive, not prescriptive. The user is a patient rep, not an ethicist, so keep the jargon explained. Make sure to answer the specific question: "Is this BRCA or Height?" (Answer: Technically Height, Morally BRCA). "What rule fits?" (Answer: Monogenic Medical vs. Polygenic Social).

