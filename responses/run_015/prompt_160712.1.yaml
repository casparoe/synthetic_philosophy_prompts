      *   **Propose the Underlying Rules:**
          1.  *The "Medical Certainty" Rule:* Monogenic = Yes, Polygenic = No.
          2.  *The "Severe Suffering" Rule:* If it causes pain/disease, intervene.
          3.  *The "Parental Discretion" Rule:* Unless it harms the child or society.
      *   **Recommendation:** The clinic has implicitly committed to **Rule 1 (Monogenic vs. Polygenic)**. Voting Yes on BMI breaks the Height precedent. Voting No upholds it but ignores the health aspect.
      *   **The "Test Case":** Suggest a hypothetical to clarify the rule (e.g., Polygenic score for Heart Disease vs. Monogenic Obesity).
