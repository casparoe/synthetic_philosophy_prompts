  Based on her track record, here is the cash-out of your friend's position, the rules underlying it, and how to test them.

  ### 1. The Verdict
  **She will say this is Not a Meme.**

  Despite the clear evidence of adaptation (the recipe shifting to fit the filter) and heritability (the schema persists), she will reject it as Darwinian cultural evolution. Her rejection of the **Compliance Clause** ("imposition rather than selection") is the key. She draws a hard line between *organic* selection pressures (social, psychological) and *engineered* or *coercive* ones. In your new case, the selection is done by an "engineered filter" and the variation by a "language model." To her, this is algorithmic optimization, not cultural evolution.

  ### 2. The Three Rules
  Here are three rules that fit her past verdicts about equally well, but diverge on the new case.

  **Rule A: The Organic Selection Rule**
  *   **Definition:** For a trait to evolve culturally, the differential uptake (selection) must arise from the psychological or social responses of human hosts, not from external coercion, contractual obligation, or engineered sorting algorithms.
  *   **Fit to History:** Explains why the **Compliance Clause** is out (coercion/imposition) but the **Chain Message** is in (superstition is a psychological pressure internal to the culture). Explains why **Flinching** is out (biological reflex).
  *   **Prediction for New Case:** **Not a Meme.** The selection is performed by an engineered ranking system, not human uptake.

  **Rule B: The Human Vector Rule**
  *   **Definition:** The mechanism of replication (variation and transmission) must be executed by human cognition and agency. If a machine generates the variation or transmits the token without human intervention, the lineage is broken.
  *   **Fit to History:** Explains why **Eye Colour** (biology) and **Private Mnemonic** (no transmission) are out. Explains why the **Dance** and **Recipe** are in (humans teach/learn them).
  *   **Prediction for New Case:** **Not a Meme.** The variation is machine-generated ("no human reproduces anything").

  **Rule C: The Functionalist Rule**
  *   **Definition:** If a population of items exhibits heritability, variation, and differential fitness that leads to adaptation over time, it constitutes evolution. The substrate (human, machine, biological) is irrelevant; the process is what counts.
  *   **Fit to History:** Explains **Slang**, **Jokes**, and **Recipes** (all evolve). Explains **Eye Colour** as "Not a Meme" only by semantic definition (biological, not cultural). Explains **Compliance Clause** as "Not a Meme" because the "no variation permitted" clause prevents the *variation* requirement from being met.
  *   **Prediction for New Case:** **Meme.** The recipe accumulates "genuine fit" to the filter via heritable variation. It is evolution by any functional definition.

  ### 3. Which Rule Is She Running?
  **She is running Rule A (The Organic Selection Rule).**

  While Rule B (Human Vector) also predicts "Not a Meme," her specific phrasing on the Compliance Clause ("imposition rather than selection") reveals that her primary boundary is the **source of the selection pressure**, not just the source of the variation. She accepts high fidelity (Chain Message) and she accepts structural inheritance (Recipe), so she isn't hung up on token copying (Rule B's stronger form). She is hung up on whether the "survival" of the variant is earned through human resonance or dictated by external constraint.

  In the new case, the "engineered filter" is the modern equivalent of the "compliance clause." It is an external imposition of fitness, not an emergent property of the culture.

  ### 4. The Closest Analogue
  **The Compliance Clause.**

  *   **Similarity:** In both cases, the "environment" that determines success is artificial and rule-based. In the Clause, it is a firm's policy; in the Schema, it is a platform's ranking algorithm. In both, the "fitness" of the item is decoupled from genuine human psychological uptake and coupled to a system constraint.
  *   **Difference:** The Compliance Clause was static (verbatim, no variation), whereas the Schema Lineage is dynamic (evolving). This is why the Functionalist (Rule C) would call the Schema a Meme but the Clause not. However, because your friend prioritizes the *nature of the selection* over the *outcome*, she will group them together as non-evolutionary systems.

  ### 5. The Critical Variant
  To distinguish between **Rule A (Organic Selection)** and **Rule B (Human Vector)**—since both predict "Not a Meme" on the current case—you should present her with this variant:

  **The Variant:** *Humans write the stories from scratch using the recipe (Human Variation), but the ranking system still determines visibility (Engineered Selection).*

  *   **If she says "Meme":** She is running **Rule B (Human Vector)**. She cares that humans are creating the content, even if the sorting is algorithmic.
  *   **If she says "Not a Meme":** She is running **Rule A (Organic Selection)**. She cares that the *success* of the content is determined by an engineered filter (imposition) rather than human sharing choices, regardless of who wrote it.

  Given her verdict on the Compliance Clause, she will likely say **Not a Meme**, confirming that for her, **selection pressure must be organic** for culture to evolve.
