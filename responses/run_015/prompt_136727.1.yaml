answer: |-
  Here is the shape of the account you require, tested against your cases, followed by the verdicts on your unsettled problems and the contractual implication.

  ### The Principle: Tracked Authorial Designation

  A fictional character persists across textual variations if and only if three conditions are met:

  1.  **The Continuity of Attention:** There must be an unbroken chain of narrative focus allowing the reader to track the entity as the *same locus of interest* from one state to the next. (This addresses the "rate of change" problem: if changes are too abrupt, the chain breaks).
  2.  **The Integrity of Consciousness:** The entity's internal psychological continuity (memories, traits, subjective experience) must remain attached to its designation, unless a specific narrative device (like a swap or fission) explicitly accounts for the severance.
  3.  **The Sovereignty of Source:** The chain of designation must be maintained solely by the originating creative will or its instrumental agents. Any new creative will that generates *new* story material breaks the identity, even if facts are preserved.

  ---

  ### Testing the Principle Against Your Six Cases

  **1. Drift (Verdict: Same Character)**
  *   **Analysis:** *Continuity of Attention* is preserved because the changes occur gradually over nine books; the reader's cognitive track is never severed. *Sovereignty* is preserved because you made the changes.
  *   **Result:** Passes. The "Ship of Theseus" worry is resolved by Clause 1: identity relies on the *reader's ability to track*, which gradualism permits but sudden replacement destroys.

  **2. The Swap (Verdict: Different Characters)**
  *   **Analysis:** *Integrity of Consciousness* is violated. The name "Vane" is now attached to Munn's psychology. The narrative focus may be continuous, but the *locus of interest* has been surgically exchanged. The reader tracks the *name*, but the *character* (the psychological entity) has moved.
  *   **Result:** Passes. This distinguishes itself from *Drift* because *Drift* changes the *facts about* the psychology, whereas *Swap* changes the *ownership of* the psychology.

  **3. Another Hand (Verdict: Not Sark)**
  *   **Analysis:** *Sovereignty of Source* is violated. The continuator is a new creative will. Even if facts are preserved, the *authority* designating the character has changed. The continuator is not an instrument (like a translator) but a successor.
  *   **Result:** Passes. This distinguishes the continuator from the translator.

  **4. Translation (Verdict: Same Character)**
  *   **Analysis:** *Sovereignty of Source* is preserved. A translator is an *instrumental agent*, not a new creative will. They transmit the designation without claiming authority to alter the character's future or essence.
  *   **Result:** Passes.

  **5. The Promotion (Verdict: Ivor survives / Readers say Ruth)**
  *   **Analysis:** Here the principle conflicts with your intuition. *Integrity of Consciousness* dictates that if Ruth keeps her name and past, she is Ruth. You argue that *Plot Function* dictates identity (Ivor's role).
  *   **Result:** **Fail.** To maintain a coherent principle, you must abandon your verdict here. Your readers are correct. A character is an in-world consciousness, not a structural slot. If Ruth remembers being Ruth, Ivor is dead, regardless of who drives the plot. To insist Ivor survives is to privilege the *outline* over the *text*.

  **6. Fission (Verdict: Both existed from book one)**
  *   **Analysis:** *Sovereignty of Source* allows for retroactive definition. Because you (the Source) declare in Book 8 that ambiguity existed in Book 1, the *Continuity of Attention* is reinterpreted. The single track in Book 1 is redefined as two overlapping tracks.
  *   **Result:** Passes. Clause 3 allows the Author to redefine the past, provided the ambiguity was plausible.

  ---

  ### Verdicts on the Unsettled Cases

  **Case A: Halloran and Seddon**
  *   **Scenario:** Halloran (abandoned) vs. Seddon (current), sharing scenes/memories (red bicycle).
  *   **Application:** *Sovereignty of Source* is technically you in both, but *Continuity of Attention* was broken when the novel was abandoned. Reusing scenes is recycling material, not continuing a consciousness. Unless you explicitly declare "Seddon is Halloran rewritten," the chain is severed.
  *   **Verdict:** **Different men.** Seddon is a new character who inherits Halloran's motifs. Identity requires a continuous chain of designation, not just shared parts.

  **Case B: The Licensed Prequel**
  *   **Scenario:** Estate licenses a prequel by a new novelist who knows only the published text.
  *   **Application:** *Sovereignty of Source* is violated. The new novelist is a "Another Hand" (Case 3). Even with a license, they are exercising a new creative will. They are constructing a likeness, not extending the original consciousness.
  *   **Verdict:** **Not Sark.** It is a simulation of Sark. (Legally, it may be "Sark" by contract, but ontologically, it is an impersonation).

  ---

  ### The Cost of Coherence

  To adopt this principle, you must pay two costs:

  1.  **Abandon Case 5 (The Promotion):** You must concede that Ruth is Ruth. You cannot dress Ivor in her name if she retains her memories. This is the price of respecting the *Integrity of Consciousness*. If you keep your verdict on Case 5, you undermine Case 2 (The Swap), because you would be arguing that Plot Function trumps Psychology, which would make the Swap impossible to detect.
  2.  **Accept the "Rate of Change" Constraint:** You must accept that if you had made the *Drift* changes in a single revision of Book 2, you would indeed have created a new character. Identity is not just about the author's intent; it is about the *reader's capacity to track*. If the planks are changed all at once, the ship sinks.

  ---

  ### Contractual Implication

  You asked what the words "the character Gabriel Sark" ought to mean in a contract, and whether any account can be trusted to do that work.

  **Honest Answer:** No philosophical account is safe for a contract.
  Philosophical principles rely on interpretation (e.g., "Is this a new creative will?"). Contracts rely on definition. If you define Sark by the principle above, a lawyer will argue over whether a licensee is an "instrumental agent" or a "new creative will."

  **Recommendation:**
  Do not define the character by *identity conditions*. Define the character by **Fixed Reference Points** and **Explicit Scope**.

  1.  **The Anchor:** Define "Gabriel Sark" as the character appearing in the nine published novels, specifically identified by [List 3-5 immutable traits from Book 1 that you are willing to guarantee, e.g., Name, approximate Era, Key Relationship].
  2.  **The Derivative Clause:** Explicitly state that "Gabriel Sark" includes:
      *   Revisions and editions authored by you.
      *   Translations.
      *   *Excludes:* Prequels, sequels, or spin-offs authored by third parties, even if licensed, unless explicitly named in a schedule.
  3.  **The "Likeness" Clause:** Specify that licensed works by third parties shall be deemed "Derivative Works featuring a likeness of Gabriel Sark" rather than "The Character Gabriel Sark."

  **Why:** This bypasses the metaphysical problem. It does not matter if the prequel boy *is* Sark ontologically; the contract simply defines whether you get paid and whether you can stop it. By excluding third-party extensions from the definition of "The Character," you protect your philosophical intuition (Case 3) without needing to prove it in court.

  **Summary:**
  Adopt **Tracked Authorial Designation**. Concede that Ruth is Ruth (Case 5). Treat Seddon as a new man. Treat the prequel boy as an impersonation. And in the contract, ignore the philosophy; list the books and exclude the successors.
