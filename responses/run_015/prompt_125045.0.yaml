answer: |-
  This is a sharp theoretical hook. Framing "the will of the people" not as a discovery but as a *speech act*—a piece of **performative sovereignty**—cuts through the usual legalistic debates about whether the referendum was advisory or binding. It treats sovereignty not as a static property of the state, but as a rhetorical achievement that must be constantly enacted.

  Here is an analysis of the Brexit episode through the lens of performative sovereignty, mapping the players, the stages, and the points where the theory fractures.

  ---

  ### 1. The Concept: Performative Sovereignty
  In standard liberal theory, sovereignty resides in institutions (Parliament) or is discovered via aggregation (votes). In your framework, sovereignty is **constituted by the claim itself**. When a leader says, "The people demand X," they are not reporting a sociological fact; they are summoning a political subject ("The People") capable of making that demand.

  This draws on J.L. Austin's *speech acts* (words that do things) and Ernesto Laclau's populist theory (the construction of "the people" against "the elite"). The hypothesis: Brexit was not the execution of a pre-existing will, but a struggle to *perform* that will into existence strong enough to override existing institutions.

  ### 2. Mapping the Players and the Stakes
  To see the performance, we have to see who was trying to direct the play.

  *   **The Leave Campaigners (The Directors):** Their goal was to transform a 52% vote into a singular, monolithic agent ("The People"). They needed to perform sovereignty as *external* to Parliament.
  *   **Parliament (The Stage/Obstacle):** Under the UK constitution, sovereignty is Parliamentary. MPs were caught between being trustees of their constituents (many of whom voted Remain) and the new rhetorical sovereign ("The Will of the People").
  *   **The Courts (*Miller* Case) (The Script Doctors):** The Supreme Court was asked to rule on the mechanics of the performance. Their ruling was a reality check: rhetoric cannot trigger legal change without institutional mediation.
  *   **EU Negotiators (The Audience/Counterparty):** They refused to engage with "The People." They only recognized the UK State. This created a friction: the Leave campaigners were performing sovereignty to a domestic audience, while negotiating with an entity that required traditional state sovereignty.

  **The Real Options:**
  The referendum reduced a complex spectrum to a binary, but the post-vote reality offered three competing sovereign claims:
  1.  **Direct Democratic Mandate:** The referendum result is self-executing (The Performative View).
  2.  **Parliamentary Sovereignty:** Only Parliament can undo what Parliament did (The Constitutional View).
  3.  **The "Clean Break":** A specific *version* of the people's will (Hard Brexit) vs. a soft version. The performance had to narrow from "Leave" to "What kind of Leave."

  ### 3. The Function of "The Will of the People": Stage by Stage

  #### Phase A: The Campaign (Future-Oriented Performance)
  *   **Rhetoric:** "Take Back Control."
  *   **Function:** **Constitutive.** Before the vote, "the people" were fragmented (class, region, party). The rhetoric attempted to fuse these grievances into a single agent. "The people" here is a *promise*: if you vote Leave, you *become* the sovereign.
  *   **Verdict:** Highly effective performative work. It created a subject ("The Leaver") that felt more authentic than "The Citizen."

  #### Phase B: The Immediate Aftermath (Past-Oriented Weaponization)
  *   **Rhetoric:** "The People Have Spoken."
  *   **Function:** **Suppressive.** Once the vote was counted, the rhetoric shifted from *creating* the people to *silencing* opposition. If "the people" have spoken, then dissent is not just disagreement; it is illegitimacy.
  *   **Verdict:** This is where the performative claim tried to overwrite legal reality. Theresa May's "Brexit means Brexit" was an empty signifier designed to keep the performative spell active without defining the policy.

  #### Phase C: *Miller* and Parliamentary Deadlock (The Reality Check)
  *   **Rhetoric:** "Enemies of the People" (Daily Mail headline regarding the judges).
  *   **Function:** **Defensive Aggression.** When the High Court ruled that Parliament must vote to trigger Article 50, the performative claim hit a wall. The rhetoric escalated to attack the institutions that refused to recognize the performance.
  *   **Verdict:** The law resisted the speech act. The courts demonstrated that "the will of the people" has no legal texture unless encoded in statute. The performance could not bypass the procedure.

  #### Phase D: The 2019 Election & Prorogation (The Climax)
  *   **Rhetoric:** "Get Brexit Done."
  *   **Function:** **Re-consecration.** After years of deadlock, the "will of the people" was fraying. The 2019 election was a second-order performative act: a vote not just on policy, but to validate the *existence* of the pro-Brexit people as the *only* people that mattered politically.
  *   **Verdict:** Successful, but costly. It unified the "Leave" people but permanently alienated the "Remain" people, suggesting the performance requires exclusion to work.

  ### 4. Where the Framework Breaks (The Critique)

  You asked for honesty on where this framing papers over cracks. Here are three major failure points for "Performative Sovereignty" as a total explanation.

  **1. The Problem of the 48% (The Constitutive Outside)**
  Performative sovereignty works by drawing a border. To create "The People," you need an "Other." In Brexit, the 48% weren't just outvoted; they were rhetorically expelled from "The People."
  *   *The Break:* If "the people" is purely performative, why did the geography matter so much? Scotland and Northern Ireland voted differently. The rhetoric claimed a *national* people, but the performance fractured along *state* lines. The theory struggles to explain why the performance failed in Edinburgh and Belfast. It suggests there *was* a pre-existing sociological reality (national identity) that the rhetoric couldn't overwrite.

  **2. The *Miller* Judgment (Institutions Have Teeth)**
  The *Miller* case showed that you cannot simply speak sovereignty into existence. The Supreme Court ruled that the Crown (government) could not use prerogative powers to trigger Article 50 because it would nullify rights granted by Parliament.
  *   *The Break:* The "will of the people" rhetoric tried to act as a "trump card." The courts said: "Show us the statute." This suggests that in a liberal democracy, performative sovereignty is subordinate to *institutional* sovereignty. The rhetoric could create pressure, but it couldn't create law. The theory risks overstating the power of rhetoric and understating the inertia of the state.

  **3. The "Clean Break" Illusion (Material Constraints)**
  Rhetoric can summon a subject, but it cannot summon trade deals. The "will of the people" was often framed as a "clean break."
  *   *The Break:* As negotiations dragged on, the "will" had to be compromised (the Northern Ireland Protocol). If the people's will was truly a singular object discovered in 2016, compromise should have been impossible. The fact that the "will" evolved suggests it wasn't a pre-existing object *or* a stable performance, but a negotiation with material reality. The rhetoric eventually broke under the weight of logistics.

  ### 5. Does Populism Need a Pre-Existing "People"?

  This is the crux of your long-read. Does your theory give populism too much credit for creation, and not enough for discovery?

  **The Argument for "Discovery":**
  Populism isn't magic. It requires a **grievance anchor**. The Leave campaign didn't create the decline of post-industrial towns, the anxiety over migration, or the distrust of Westminster. Those were pre-existing sociological facts. The rhetoric didn't create the *anger*; it created the *vehicle* for the anger.
  *   *Implication:* If there were no pre-existing fractures, the performative speech act would have fallen on deaf ears (e.g., attempts to replicate Brexit rhetoric in stable polities often fail).

  **The Argument for "Creation" (Your Lens):**
  However, those grievances were not naturally "Brexit" grievances. They could have been channeled into left-wing economics (Corbyn) or right-wing populism (Farage). The rhetoric *decided* that the solution was sovereignty.
  *   *Implication:* The "people" as a political agent *did not exist* before the campaign. There were only voters. The rhetoric fused them into a historical agent.

  **Synthesis:**
  Populism needs a **pre-existing substrate** (grievance/identity) but performs a **new political subject**.
  *   *Verdict:* Your framework holds, but with a modifier. Call it **"Performative Sovereignty on a Pre-Existing Fault Line."** The rhetoric didn't create the earthquake, but it did direct the tectonic plates to shift in a specific way. Without the fault line, the performance is just theater. With it, it's revolution.

  ### 6. Does the Concept Earn Its Keep?

  **Yes, but as a diagnostic tool, not a total theory.**

  *   **Value:** It explains why compromise was impossible. You cannot compromise with a "will" that is sacred. It explains why MPs were intimidated not just by voters, but by the *ghost* of "the people." It explains why the process took so long: the state was trying to process a rhetorical claim as a legal instruction.
  *   **Limitation:** It risks sounding like "it was all just words." For the 48%, the consequences were material (loss of rights, economic shift). For the 52%, the "will" was felt as viscerally real, not performative. To call it "performative" might feel like dismissing their agency.

  **Recommendation for your piece:**
  Use "Performative Sovereignty" to explain the **conflict**, not the **outcome**.
  *   The *conflict* (Parliament vs. People) was a clash between institutional sovereignty and performative sovereignty.
  *   The *outcome* (Brexit happened, but messy) was determined by the fact that performative sovereignty eventually had to submit to institutional sovereignty to become law.

  The Brexit episode proves that you can *say* "The People are Sovereign," but you still need a Parliament to sign the check. The rhetoric creates the heat; the institutions control the pressure. Your concept perfectly captures the heat, which is where the real story lies.
