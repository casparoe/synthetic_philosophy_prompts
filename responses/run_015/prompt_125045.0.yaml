          *   Map the real options (Direct mandate vs. Parliamentary sovereignty vs. Clean break).
          *   Analyze the function of "the will of the people" at each stage (descriptive vs. performative).
          *   Critique the framework: Where does it break? (The 48%, regional splits, *Miller* judgment, parliamentary deadlock).
          *   Address the populism question: Does populism need a pre-existing "people" more than the theory admits?
      *   **Tone:** Analytical, nuanced, suitable for a "science-and-ideas desk" long-read (intellectual but accessible), honest about limitations.

  2.  **Initial Brainstorming & Theoretical Grounding:**
      *   *Performative Sovereignty:* This sounds like J.L. Austin (speech acts) mixed with political theory (Schmitt, Lefort, Laclau). The core insight is that sovereignty isn't a static fact; it's an ongoing claim.
      *   *Brexit Context:* The 2016 referendum was advisory, not binding (legally), but treated as binding (politically). This tension is the perfect petri dish for "performative sovereignty."
      *   *The "People":* Who are they? The 52%? The whole electorate? The "real" people vs. the "elite"?
      *   *The Tension:* Parliamentary Sovereignty (UK constitutional bedrock) vs. Popular Sovereignty (the referendum result).

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Define "Performative Sovereignty" clearly. Set the scene: Brexit wasn't just a vote; it was a naming ceremony.
      *   **Mapping the Players & Options:**
