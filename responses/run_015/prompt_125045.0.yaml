prompt: |-
  I'm filing a long-read on democratic rhetoric for my science-and-ideas desk, and I keep comeing back to Brexit — specifically how everyone talked about "the will of the people" after the 2016 vote like it was some pre-existing object you could just read off. I'm playing with this idea I haven't seen fully worked out: call it "performative sovereignty," the thought that "the people" doesn't just get discovered by a referendum but is actually called into being by the rhetoric that claims to represent it — like a speech act that creates the very subject it names. Could you analyze the Brexit episode through that lens?

  I want the mapping done carefully: who are the actual players (Leave campaigners, Parliament, the courts in Miller, EU negotiators), what the real options looked like (direct democratic mandate vs parliamentary sovereignty vs the "clean break" framing), and how the "will of the people" functions at each stage — is it describing something, or doing something? Then tell me honestly where the framming breaks: does it paper over the 48% and the regional splits, does it misdescribe what happened in the Miller judgment and the parliamentary deadlock that followed, and does the whole episode suggest populism actually needs a pre-existing "people" more than this theory admits? I'm trying to get past the standard "populism is dangerous" take and see whether the concept really earns its keep here.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**
      *   **Topic:** Democratic rhetoric, specifically Brexit and the phrase "the will of the people."
      *   **Core Concept:** "Performative Sovereignty" (the idea that "the people" is called into being by rhetoric, not just discovered).
