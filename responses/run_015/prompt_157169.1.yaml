      *   *Implication:* The objection isn't against Utilitarianism *per se*, but against Utilitarianism as a *comprehensive doctrine of life*. It works as a political morality, fails as a personal morality.
      *   *Wait, check Williams:* Williams would say the alienation happens when the *state* or *morality* demands you abandon your ground projects. So the institutional case actually strengthens Williams if the institution demands you violate your ground projects (e.g., a doctor forced to kill one to save five).
      *   *Correction:* The user asks if extending to roles clarifies if the problem is *specific to intimacy*.
      *   *Answer:* It shows the problem is about *fiduciary alignment*. In intimacy, the fiduciary duty is to the person. In public health, it's to the population. The "one thought too many" arises when the *role* demands impartiality but the *human connection* demands partiality.

  8.  **Final Polish:**
