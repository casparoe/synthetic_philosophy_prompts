answer: |-
  Your hunch is correct: the literature is ossified because the debate has conflated the **criterion of rightness** with the **phenomenology of deliberation**. To unstick this, you need to diagnose the disagreement not as a clash over outcomes or even permissions, but as a conflict over the *architecture of practical reason*.

  Here is a diagnosis of the stalemate, an analysis of the institutional extension, and a proposal for how to move past the impasse.

  ### 1. The Diagnosis: Justification vs. Deliberation
  The primary reason the debate loops is that Utilitarians and Williamsians are answering different questions while using the same vocabulary.

  *   **The Utilitarian** is defending a **Criterion of Rightness**. When they say, "Saving your spouse is right because it maximizes utility (even if via partial instincts)," they are making a claim about what *makes* the action morally good. For them, the "one thought" is the metaphysical grounding of the act.
  *   **Williams** is attacking a **Decision Procedure**. When he says "one thought too many," he is making a claim about the *structure of agency*. He is arguing that certain goods (like love) are *constitutively* incompatible with certain modes of deliberation (like impartial calculation).

  **The Substantive Clash:**
  It is not merely verbal, nor is it just bedrock intuition. It is a clash over the **Exhaustiveness of Moral Reasons**.
  *   **Utilitarianism** (in its hard form) posits that moral reasons are exhaustive. Every rational consideration must ultimately cash out in moral currency (utility). If you save your spouse, there *must* be a moral reason for it, even if that reason is "general utility favors partial instincts."
  *   **Williams** posits that moral reasons are a *subset* of rational reasons. There are reasons of love, projects, and identity that are *non-moral* but still rationally compelling. They do not need to be laundered through the moral filter to be valid.

  **Why the Impasse Exists:**
  Utilitarians treat Williams's objection as a **heuristic glitch** ("We agree you shouldn't calculate, but the *reason* you shouldn't is utilitarian"). Williams treats this as **alienation** ("If the *reason* I shouldn't calculate is utilitarian, I am still alienated because my commitment is contingent on the utility calculus, not the person").

  As long as the Utilitarian insists that the *justification* must govern the *deliberation* (even distantly), Williams's objection holds. The Utilitarian cannot admit that there are valid reasons for action that are *outside* the moral system without ceasing to be a comprehensive Utilitarian.

  ### 2. The Institutional Extension: Clarification or Distraction?
  Extending the case to institutional roles (the doctor, the public health official) is analytically fruitful, but it shifts the problem rather than solving it. It reveals that the Integrity Objection is not about intimacy *per se*, but about **fiduciary alignment**.

  **The Doctor Case:**
  If a triage doctor calculates aggregate survival rates rather than focusing on the patient in front of them, is that "one thought too many"?
  *   **In a Utilitarian framework:** No. The doctor's role is defined by the optimization of outcomes.
  *   **In a Williamsian framework:** It depends on the *ground project* of the role. If the doctor views their role as a covenant with the specific patient, calculation is alienating. If they view it as resource management, calculation is required.

  **What This Clarifies:**
  This extension shows that Williams's objection is not specific to love; it is specific to **relationships defined by exclusive commitment**.
  *   **Intimate Relationships:** Defined by exclusive partiality. Calculation violates the definition of the relationship.
  *   **Public Health Roles:** Defined by inclusive impartiality. Calculation *fulfills* the definition of the relationship.

  **The Trap:**
  If you argue that the problem is specific to intimacy, you concede that Utilitarianism works fine for public morality, and Williams is just defending a private sphere of irrationality.
  If you argue that the problem applies to institutions too (e.g., a doctor forced to harvest one healthy patient to save five), you reveal that the objection is actually about **the limits of consequentialism in *any* fiduciary context**.

  **Verdict:** The institutional extension helps clarify that "integrity" is about **role-identity**. The "one thought too many" occurs whenever the *logic of the system* (aggregate welfare) overrides the *logic of the relationship* (exclusive duty). This strengthens Williams: it shows the objection isn't about "feelings," but about the **normative architecture of commitments**.

  ### 3. Unsticking the Impasse: Constitutive Norms and Overridingness
  To move this forward in a PhD thesis, you need to stop asking "Who is right about the drowning spouse?" and start asking "What kind of reason is a reason of love?"

  **A. The Constitutive Argument**
  You can unstick the debate by framing love (and professional covenants) as having **constitutive norms**.
  *   To love someone *just is* to treat their interests as peremptory without reference to a higher standard.
  *   If you reference the higher standard (utility), you are not loving "badly"; you are **not loving**.
  *   **The Move:** Argue that Utilitarianism isn't *morally wrong* in the spouse case; it is **category-mistaken**. It is trying to evaluate a non-moral practice (love) using moral metrics. The "loss of integrity" is the loss of the practice itself.

  **B. Challenging the Overridingness Thesis**
  The deep stall is the assumption that Moral Reasons always override Non-Moral Reasons.
  *   **Utilitarian Assumption:** If morality demands X, and my projects demand Y, and X ≠ Y, I am irrational to do Y.
  *   **Williamsian Correction:** Morality is not the totality of rationality. I can be morally wrong but rationally justified in saving my spouse.
  *   **The Path Forward:** Your thesis could argue that the Integrity Objection succeeds only if we reject the **Overridingness Thesis**. If morality is not exhaustive, then the Utilitarian cannot claim the agent is "irrational" for refusing to calculate; they can only claim the agent is "immoral." Williams is happy to accept "immoral" if it means staying "sane" (integrated).

  ### 4. Recommendation for Your Argument
  Do not try to prove Williams right and Utilitarians wrong. That is the 1985 trap. Instead, diagnose the **category error** in the debate itself.

  1.  **Reframe the Objection:** Argue that the Integrity Objection is not a moral objection to Utilitarianism, but a **meta-ethical objection to the scope of morality**. It claims Utilitarianism is imperialistic, trying to colonize spaces of human life (love, vocation) that operate on different normative logics.
  2.  **Use the Institutional Case:** Use the doctor/official cases to show that this isn't about "emotion vs. reason." It's about **competing normative systems**. A public health official operates in the "Utilitarian System." A spouse operates in the "Partiality System." The tragedy (and the integrity violation) occurs when the Utilitarian System demands sovereignty over the Partiality System.
  3.  **Conclusion on the Impasse:** The impasse exists because Utilitarians defend a **Theory of the Good** (states of affairs), while Williams defends a **Theory of the Agent** (narrative identity). These are incommensurable unless one side concedes that morality is not the only source of normative authority.

  **Bottom Line:** The disagreement is substantive. It is about whether the "moral point of view" is the *only* rational point of view. If you can demonstrate that the Utilitarian requires the **Exhaustiveness of Moral Reasons** to survive the objection, and that Exhaustiveness is psychologically and philosophically untenable, you break the stalemate. You don't solve the drowning case; you dissolve the framework that makes the case a problem.
