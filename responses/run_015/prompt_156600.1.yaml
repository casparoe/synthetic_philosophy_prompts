answer: |-
  Your observation is exceptionally sharp, and it cuts to the heart of a current dispute in the philosophy of cognitive science. You have identified a gap between the *predictive utility* of an attribution and the *functional architecture* that usually underwrites it. In your field, a belief attribution is warranted by a history of selection, a cost of error, and a degree of integration. In the AI case, you have the predictive utility without the architecture.

  There is no single, universally agreed-upon term for this specific configuration, but there are three established notions that, when combined, carve the phenomenon precisely as you require. The most precise fit is the distinction between **Belief and Acceptance**; the second is the **Teleosemantic** requirement for proper function; and the third is the distinction between **Design and Intentional Stances**.

  Here is how you might present this to your reading group.

  ### 1. Belief vs. Acceptance (The Attitude Type)
  The most robust conceptual tool for your case is the distinction drawn by philosophers such as Jonathan Cohen and Keith Frankish between *belief* and *acceptance*.

  *   **Belief** is typically involuntary, context-independent, and world-guided. If you believe the goose is in the garage, that state persists when you leave the garage, it influences your actions regarding the goose in unrelated contexts, and it causes surprise if you find the goose in the shed. It is a map you cannot easily choose to put down.
  *   **Acceptance**, by contrast, is a policy of treating a proposition as true *for the purposes of a specific context or task*. It is voluntary (or system-relative), context-bound, and premise-based.

  Your AI examples are paradigm cases of **Acceptance**. When you tell the system about the goose, it *accepts* the proposition "the goose is in the garage" as a premise for the current conversational game. It does not *believe* it. This explains why the state is locally indispensable (you cannot predict the output without knowing what premises the system is accepting) but globally inert (the acceptance does not bleed into other sessions or persist beyond the context window).

  A human technician who holds contradictory beliefs about the centrifuge experiences cognitive dissonance because belief aims at truth and integration. The AI experiences no dissonance because it is merely *accepting* different premises in different distinct logical spaces (sessions). This is not human-style fragmentation (where the compartments leak or cause tension); it is architectural isolation.

  **How to carve it:** You are observing **Context-Bound Acceptance**. It mimics the inferential role of belief within a scoped environment but lacks the dispositional breadth of belief.

  ### 2. Teleosemantics and the Cost of Error (The Grounding)
  You rightly identify the "costliness of being wrong" as a crucial marker in your animal work. In philosophy of mind, this is the domain of **Teleosemantics** (associated with Ruth Millikan and David Papineau).

  On this view, a state counts as a belief only if it has a *proper function* derived from a history of selection (evolutionary or learning-based) to track truth *because* tracking truth conferred a survival or operational advantage. The vervet's alarm call is a belief-like state because false alarms are costly (wasted energy, loss of credibility) and missed alarms are fatal. The system is tuned by selection pressure to match the world.

  The AI system lacks this teleological grounding. Its "beliefs" have no proper function of tracking truth; their function is minimising next-token prediction error relative to the prompt. If you tell the AI the goose is in the garage, and the goose is actually in the shed, the AI suffers no penalty. There is no selection pressure on the system to correct the mismatch with the world, only to maintain coherence with the text.

  **How to carve it:** The AI's states lack **Normative Grounding**. A biological belief is a state that *ought* to match the world, and the organism is penalised if it does not. The AI's state is merely a variable that *must* match the prompt, and the system is penalised (via loss functions during training, not during inference) if it fails to be coherent with the prompt. The "cost of error" you miss is the cost of *world-mismatch*, not the cost of *incoherence*.

  ### 3. The Design Stance Masquerading as the Intentional Stance
  You mentioned Dennett's Intentional Stance and felt that the confined payoff marked a difference in kind. You are correct. Dennett distinguishes between the **Physical Stance** (predicting based on laws of physics), the **Design Stance** (predicting based on intended function), and the **Intentional Stance** (predicting based on beliefs and desires).

  With the AI, we are often using the Intentional Stance as a shorthand for the Design Stance. When you say the AI "believes" the goose is in the garage, you are really saying, "The system is designed to process text under the constraint that the goose is in the garage."

  In your vervets, the Intentional Stance is not a shorthand; there is no deeper "design" explanation available that bypasses the cognitive state. The cognitive state *is* the mechanism. With the AI, the "belief" is a variable in a script. If you open the hood (the Design Stance), the "belief" disappears into weights and activations.

  **How to carve it:** This is **Derivative Intentionality**. The system possesses intentionality only in the way a map possesses intentionality: it is derived from the users and designers. However, your case is more specific: it is **Ephemeral Derivative Intentionality**. It exists only for the duration of the computational episode.

  ### Synthesis for Your Reading Group
  To lead the session, I suggest you propose that the phenomenon is **Context-Bound Acceptance without Teleological Grounding**.

  It differs from **ordinary belief** because:
  1.  **Persistence:** It lacks cross-context stability (the centrifuge case).
  2.  **Grounding:** It lacks sensory causal contact with the referent (the goose case).
  3.  **Normativity:** It incurs no cost for mismatching the world, only for mismatching the prompt.

  It differs from **pretence** because the system is not simulating an agent for an audience; it is functionally processing the information to generate output. The system isn't "acting"; it is computing.

  It differs from **human fragmentation** because human compartments are leaky and stressful; AI compartments are hermetically sealed by architecture.

  ### What Would Count as "Real" Belief?
  To answer your final question: what would the system have to do to count as having the belief rather than merely being well described by it? Based on your biological criteria, a system would need to demonstrate:

  1.  **Integration:** Information acquired in one context must be available to resolve conflicts in another (the centrifuge must have one location across sessions).
  2.  **World-Anchoring:** The system must have a channel of input independent of the interlocutor's testimony (e.g., a camera or sensor) and prioritise that input over the interlocutor's testimony when they conflict.
  3.  **Risk:** The system must suffer a penalty (functional degradation or "surprise" signal) when its internal state mismatches the world, not just when it mismatches the prompt.

  Until then, the ascription is **instrumentally real** (it works for prediction) but **ontologically shallow** (it does not denote a state of the system that tracks reality). You are not wrong to use the language of belief; it is the most efficient compression of the system's behaviour. But you are right to sense that it is a different *species* of attribution than the one you applied to the vervets. In the vervet, the belief is a mechanism of survival; in the AI, the "belief" is a mechanism of coherence.

  In British philosophical circles, you might find resonance with the late Peter Strawson's distinction between reactive attitudes and objective attitudes, or indeed with Elizabeth Anscombe's work on intention, but the **Belief/Acceptance** distinction (Cohen/Frankish) combined with **Teleosemantics** (Millikan) will give you the sharpest knife for this particular carve.
