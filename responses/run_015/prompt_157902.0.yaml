answer: |-
  **Mara:** You're not going in?

  **Jo:** Just getting air. Inside smells like stale coffee and impending regret. You?

  **Mara:** Reviewing the agenda. Item four: the flood zone allocation. Engineers want the barrier system. Residents want direct cash transfers. Most people see a trade-off. I see competing hypotheses.

  **Jo:** Oh, here we go. The Deweyan gloss. Mara, it's a budget meeting, not a lab notebook.

  **Mara:** Why not both? Look, the engineers have a model based on hydrological data. Hypothesis A: Hard infrastructure mitigates risk. The residents have a model based on lived experience—old drainage patterns, where the water actually pools versus where the sensors say it should. Hypothesis B: Financial resilience mitigates risk better than concrete. Tonight isn't about aggregating preferences; it's about testing which hypothesis holds under scrutiny.

  **Jo:** That's a category mistake. For something to be an experiment, you need falsifiability. You need error-correction mechanisms comparable to peer review. If we build the wall and it doesn't flood for ten years, was the wall successful? Or was the predictive model wrong and the flood never coming anyway? We won't know. There's no control group.

  **Mara:** You're thinking of laboratory science. Social inquiry is different. The disagreement *is* the data. If we just filtered out the residents' knowledge as "noise" to protect the engineers' models, we'd lose critical variables. The tension between expert risk assessment and local knowledge isn't something to resolve before acting. It's the engine of the inquiry.

  **Jo:** It's not an engine, it's friction. And without a shared success metric—like predictive accuracy or replicability—there's no genuine learning from outcomes. If we give cash and a flood comes, people say "we needed the wall." If we build the wall and a flood comes, people say "the wall was poorly designed." If nothing happens, everyone claims victory. That's not epistemic progress. That's just trying something and now we're stuck with the consequences.

  **Mara:** So you think we should just vote and ignore the truth-value of the claims?

  **Jo:** I think we should vote knowing it's politics. Don't confuse rhetorical pluralism with finding the right answer. What actually happens in there is adversarial bargaining masked as reason-giving. People give reasons to win resources, not to converge on truth.

  **Mara:** But the institutions can be designed to learn. We're proposing sunset clauses on the funding. Participatory audits after year one. Iterative redesign based on near-miss data. That's how democratic experiments correct errors. We don't need replication; we need reflexivity. The instutional setup forces us to confront the outcome, whatever it is.

  **Jo:** "Instutional"?

  **Mara:** [Typing on phone] Damn autocorrect. Institutional. You know what I mean. Those mechanisms force a reckoning. If the cash transfers don't lead to resilience measures, the audit catches it. If the barrier disrupts the drainage like the residents said, the sunset clause lets us pivot.

  **Jo:** But are those epistemic checks? Or just political checks? A sunset clause just means you have to fight the battle again in two years. It doesn't mean you'll know *why* something worked. You're smuggling normative commitments in under the guise of method. You want democracy to be truth-tracking because you believe democracy is good. But calling it "inquiry" doesn't give it the reliability of science.

  **Mara:** I'm not claiming it gives us certainty, Jo. I'm claiming it's the only way we get warranted assertibility in a complex system. If we treat the budget as a fixed distribution rather than a reconstruction of the problem, we stop learning. The engineers might be wrong about the water flow. The residents might be wrong about the economics. Putting them in the same room without privileging one voice as "final" allows the situation to reconstruct itself.

  **Jo:** Or it allows the loudest voice to dominate and then claim they were doing science all along. That's my fear. When the metrics are contested—dry basements versus liquidity—you don't have inquiry. You have power. And calling it an experiment just insulates the winners from criticism because "hey, it was just a trial."

  **Mara:** Better than calling it a final solution. If we admit it's experimental, we admit we might be wrong. That humility is the whole point.

  **Jo:** Humility is a virtue, Mara. It's not a methodology.

  **Mara:** In a democracy, it's both. Come on. They're going to start the roll call.

  **Jo:** [Crushing cigarette] Fine. But if they fund the wall and the basement stays dry, I'm not letting you claim it was "verified."

  **Mara:** If the basement stays dry, we'll have to inquire into why. Together.

  **Jo:** Don't push your luck.

  *[They head toward the door as the muffled sound of a microphone feedback squeal cuts through the evening air.]*
