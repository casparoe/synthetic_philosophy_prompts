      *   *Resolution:* If viewed as *insurance*, it's superstitious causality (like refusing chemo). If viewed as *handing over*, it's an orientation of trust.
      *   *Which verdict to drop?* To keep the principle simple (Orientation over Causality), you have to drop the idea that it's "hollow" *if* it functions as an act of surrender. However, if it's purely magical thinking ("this water stops hell"), it conflicts with the principle.
