      *   *Automation Bias:* Tendency to favor suggestions from automated decision-making systems. Very close, but usually implies *believing* the system is right, not knowing it's wrong but using it for cover.
      *   *Defensive Decision Making:* Making choices to minimize personal liability rather than optimize outcomes. This is the core motivation.
      *   *Epistemic Defense / Bureaucratic Cover:* Using data as a shield.
      *   *The "Performativity" of Metrics:* Metrics don't just measure; they create reality.
