answer: |-
  You have identified a precise and pernicious dynamic that is often conflated with Goodhart's Law but is mechanistically distinct. While there is no single, universally standardized term for this specific configuration, it is recognized in organizational theory, public administration, and science and technology studies (STS) under a cluster of related concepts.

  The most accurate label for the behavior you describe is **Defensive Decision-Making** driven by **Procedural Legitimacy**, resulting in the **Reification of Metrics**. In the literature on bureaucracy, this is often discussed under **Blame Avoidance Theory**.

  Here is an analysis of the phenomenon, its distinctions, boundaries, and counterexamples, along with an indication of where the theoretical consensus is tentative.

  ### 1. The Mechanism: Asymmetric Accountability
  The core mechanism is not the distortion of the measure to improve the score (as in Goodhart's Law), but the **asymmetry of liability** attached to human judgment versus algorithmic output.

  *   **System Error + Compliance:** If the scanner/test is wrong and the actor follows it, the failure is attributed to the *system*. The actor is safe.
  *   **System Error + Override:** If the scanner/test is wrong and the actor overrides it, the outcome becomes the actor's personal responsibility. If the override works, it is "doing your job." If the override fails (even due to bad luck), it is "ignoring protocol" or "favoritism."

  This creates a **liability sink**. The metric ceases to be a tool for measuring reality and becomes a tool for allocating blame. By deferring to the flawed metric, the dispatcher and the tutor are not saying, "This number is true." They are saying, "This number is the designated bearer of responsibility."

  This is distinct from **Automation Bias**, which is a cognitive error where humans *believe* the automated system is more accurate than it is. In your cases, the actors *know* the system is wrong. This is **Strategic Automation Dependence**: a rational choice to suppress local knowledge to minimize personal risk.

  ### 2. Distinctions from Related Concepts

  | Concept | Goal | Mechanism | Relation to your observation |
  | :--- | :--- | :--- | :--- |
  | **Goodhart's Law** | Maximize the metric. | Active gaming (e.g., skipping hard stops to boost on-time %). | **Different.** Your actors are not trying to boost the score; they are accepting a bad score to avoid audit scrutiny. |
  | **Automation Bias** | Efficiency/Cognitive ease. | Unconscious trust in the machine over self. | **Different.** Your actors consciously distrust the machine but use it for cover. |
  | **Bureaucratic Ritualism** | Rule adherence. | Following rules for their own sake. | **Similar,** but Ritualism implies forgetting the goal. Your actors remember the goal (efficient delivery/literacy) but sacrifice it for safety. |
  | **Defensive Decision-Making** | Risk minimization. | Choosing the option that is easiest to justify if things go wrong. | **Identical.** This is the overarching framework. The metric is the shield. |

  ### 3. The Boundary: Consistency vs. Abdication
  You asked where the line lies between reasonable insistence on consistent rules and the abdication of judgment. This is the most difficult theoretical boundary, but it generally rests on two factors: **Verification Costs** and **Error Symmetry**.

  **Reasonable Consistency** exists when:
  1.  **Verification is costly:** If checking every scanner error requires 20 minutes of investigation, the organization rationally accepts some error to maintain throughput.
  2.  **Human bias is high:** If dispatchers are known to play favorites, strict adherence to the metric prevents corruption, even if it occasionally misfires.
  3.  **Errors are symmetric:** If the system over-penalizes and under-penalizes at roughly the same rate, the aggregate data remains useful for long-term planning, even if individual cases are wrong.

  **Abdication of Judgment** occurs when:
  1.  **Local knowledge is high-fidelity:** The tutor *knows* the child was ill. The dispatcher *knows* the scanner failed in that stairwell. The cost of acquiring this knowledge was zero (it was already known).
  2.  **Errors are cumulative/systemic:** The same stairwell always fails; the same type of child is always misleveled. The system isn't randomly noisy; it is structurally biased, and the human refuses to correct the structural bias.
  3.  **The "Audit Trail" is punitive, not investigative:** If an override triggers an audit designed to *catch* the employee rather than *verify* the exception, judgment is effectively banned.

  The boundary is crossed when the procedure shifts from ensuring **fairness** (treating similar cases alike) to ensuring **insulation** (protecting the decision-maker from the consequences of the procedure's failure).

  ### 4. Counterexamples
  To test whether this is a universal law of metrics or a specific cultural failure, we look for **High-Reliability Organizations (HROs)**.

  *   **Air Traffic Control / Emergency Medicine:** In these fields, protocols are strict, but operators are explicitly empowered and expected to override automated alerts or checklists if situational awareness contradicts them.
      *   *Why it differs:* The culture prioritizes **outcome safety** over **procedural purity**. An override that prevents a crash is celebrated, not audited for favoritism. The "audit trail" exists to learn from the override, not to punish it.
  *   **Small Business / Ownership:** A business owner using a similar dashboard would likely correct the data.
      *   *Why it differs:* The owner bears the cost of the error directly. In your examples, the dispatcher and tutor are **agents** protecting themselves from a **principal** (management/auditors). This is a classic Principal-Agent problem where the incentives are misaligned.

  ### 5. Tentative Analysis and Caveats
  I must indicate where this analysis is most tentative.

  **1. Is it distinct from Goodhart's Law?**
  Some economists argue this *is* a subset of Goodhart's Law, broadly defined as "the corruption of a measure once used for control." They would argue that the "target" here isn't the score itself, but the *security of the employee's position.* While semantically debatable, I agree with your intuition that the mechanism is reversed. Goodhart is usually active distortion; this is passive submission. Lumping them together risks losing the specific remedy (changing liability structures vs. changing the metric).

  **2. The "Favoritism" Constraint**
  In the parcel network case, you mention overrides look like favoritism. This is a genuine governance problem. If overrides are allowed, bad actors *will* use them to help friends. The organization may have calculated that **false positives** (letting a bad driver slide) are cheaper than **corruption** (dispatchers routing easy streets to friends).
  *   *Tentativeness:* It is possible the organization *knows* the scanners fail but has decided that the risk of human corruption is worse than the risk of metric error. In this view, the dispatchers aren't abdicating judgment; they are adhering to a second-order rule: "Never override, even when right, to prevent systemic corruption." This is a defensible, if cynical, position.

  **3. Cultural Variance**
  This phenomenon appears strongest in **low-trust cultures** or highly litigious environments. In high-trust organizations, an override might be seen as "initiative." In your examples, it is seen as "deviance." The phenomenon may be less about the metrics themselves and more about the **psychological safety** of the workforce.

  ### Summary
  You are observing **Defensive Metric Dependence**. It is a strategy of **Blame Avoidance** where actors use flawed data as a **Liability Sink**.

  It differs from Goodhart's Law because the goal is not to inflate the metric, but to insulate the self. It differs from Automation Bias because the distrust is conscious. It becomes abdication when local knowledge is high-fidelity and the cost of override is purely bureaucratic rather than operational.

  The remedy is rarely "better metrics." It is usually **cultural or structural**: creating "safe to fail" zones for overrides, or shifting the audit focus from "Why did you deviate?" to "Was the deviation justified?" Without that shift, the metric will continue to function not as a map of reality, but as a shield against accountability.
