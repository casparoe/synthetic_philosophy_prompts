          *   vs. Defensive Caution: Usually means doing *less*. This means following a specific *wrong* path.
      *   **Boundary (Consistency vs. Abdication):**
          *   Reasonable: When the cost of exception-handling exceeds the benefit, or when the metric is right 95% of the time and exceptions are hard to verify.
          *   Abdication: When local knowledge is high-fidelity and the cost of override is low, but the *social* cost of override is high.
      *   **Counterexamples:**
          *   High-reliability organizations (Air Traffic Control, ER) where override is expected and documented without penalty.
          *   Contexts where the human is the "owner" of the outcome (e.g., a small business owner vs. an employee).

