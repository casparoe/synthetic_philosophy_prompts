      *   The core tension is between *Substantive Rationality* (doing what is actually right for the specific case) and *Formal Rationality* (following the established rule/procedure).
      *   The specific twist is the *asymmetry of blame*.
          *   Error by System + Follow System = No Blame (System's fault).
