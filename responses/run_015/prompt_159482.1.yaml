answer: |-
  This is a sharp observation, and you are right to be suspicious of bundling it under a single label. You have identified a specific conversational dynamic that sits at the intersection of moral psychology, epistemology, and argumentation theory.

  Here is the carving you asked for.

  ### 1. The Name and The Literature
  **Confidence:** High that the *components* are well-documented; Low that there is a single lexicalized term for this specific *conversational bundle*.

  There is no single standard term in the literature for "automatically translating an opponent's moral reason into one's own foundation and thereby thinning it." However, your description is a precise phenomenological account of **Naïve Realism** operating within the constraints of **Moral Foundations Theory (MFT)**.

  *   **Naïve Realism (Ross & Ward, 1996):** This is the engine. It is the conviction that I see the world (and the argument) as it *is*, and if you disagree, you are either biased, irrational, or uninformed. In your examples, the students aren't just disagreeing; they are concluding the other person is *mistaken about their own motives*.
  *   **Moral Foundations Mismatch (Haidt et al.):** This is the substrate. The "translation error" occurs because the interlocutors lack the receptive receptor for the specific moral "taste" being offered.
  *   **The Specific Move:** In argumentation theory, this is sometimes called **"Steel-manning the Wrong Argument"** or **"Normative Assimilation."** It is distinct from the Straw Man fallacy. A Straw Man distorts the *logic*; this distorts the *value*. It assumes the other person is aiming at *my* target (Harm) but missing, rather than aiming at *their* target (Sanctity) and hitting.

  **Verdict:** You are describing a specific instantiation of **Moral Naïve Realism**. It is not a distinct psychological module from Naïve Realism, but it is a distinct *domain application* that warrants separation because moral values are often non-negotiable in ways factual claims are not.

  ### 2. The Carving: One Phenomenon or Several?
  You asked if this is one phenomenon or several bundled together.
  **Verdict:** It is **one cognitive mechanism** (Egocentric Anchoring) applied to **three distinct contexts**.

  The mechanism is **Projective Interpretation**: I lack the internal category for your reason, so I map your utterance onto the closest category I *do* have, then evaluate the fit. Since your reason wasn't actually generated by that category, the fit is poor, and I conclude your reason is weak.

  Here is how the three complications you raised differ:

  **A. The Uncharitable Translation (Your Seminar Cases)**
  *   **Mechanism:** Unconscious Projective Interpretation + Naïve Realism.
  *   **Epistemic Status:** Error. I genuinely believe I have identified your reason, but I have not.
  *   **Outcome:** Polarization. I conclude you are irrational/dishonest because your "Harm" argument is weak, not realizing it wasn't a Harm argument.
  *   **Literature:** This is the core of the **"Motive Attribution Asymmetry"** literature (Waytz et al., 2014), though you are right to note a nuance. Waytz focuses on *hostility vs. principle*. You are describing *Principle A vs. Principle B*. This is a subset of motive attribution: attributing the *wrong principle* to the agent.

  **B. The Charitable Reframing (The Environmentalist Pitch)**
  *   **Mechanism:** Theory of Mind + Strategic Framing.
  *   **Epistemic Status:** Accurate (ideally). I recognize you do not have my category (Harm), so I access my model of *your* categories (Sanctity) and translate my goal into that language.
  *   **Distinction:** This requires **Moral Bilingualism**. The uncharitable version fails because the speaker *cannot* access the other's foundation. The charitable version succeeds because the speaker *simulates* the other's foundation.
  *   **Literature:** This is **"Moral Reframing"** (Feinberg & Willer, 2015). They show liberals persuade conservatives better when using Sanctity/Loyalty frames. The difference is *intent* and *accuracy*. Your seminar students are not reframing; they are mishearing.

  **C. The Intrapersonal Case (Your Nuclear/Advertising Objection)**
  *   **Mechanism:** Discursive Capture / Internalized Hegemony.
  *   **Epistemic Status:** Self-Alienation. You have a visceral objection (perhaps Sanctity or Authority-based), but you live in a discourse community (Academia) that validates only Harm/Fairness reasons. You unconsciously edit your own reasoning to be legible to your tribe.
  *   **Distinction:** This is not a failure to understand *another*; it is a failure to acknowledge *self*. It is driven by social sanction rather than cognitive limitation.
  *   **Literature:** This aligns with **"Expressive Rationality"** (Kahan) or **"Hermeneutical Injustice"** (Fricker), though Fricker is structural. A better fit might be **"Normative Self-Censorship."**

  ### 3. Pushback and Complications
  You asked for pushback. Here are three places where your description might be resting on a cartoon version of the psychology.

  **1. The Haidt Model is Contested.**
  You are relying on the "five foundations" as distinct receptors. Many moral psychologists argue these foundations are not modular. "Sanctity" might just be "Care" applied to essentialist concepts. If the foundations are not distinct, then the "translation error" is less a category mistake and more a disagreement about empirical facts (e.g., "Does this act cause harm?").
  *   *Counter:* Even if Haidt is wrong about the *modules*, he is likely right about the *phenomenology*. People *experience* these reasons as distinct kinds. Your students' confusion is real even if the underlying taxonomy is debatable.

  **2. Is it Symmetric?**
  You ask if the symmetry tells us anything about who is right. Haidt's data suggests the psychology is **not symmetric**. Liberals tend to rely heavily on Care/Harm and Fairness/Cheating. Conservatives tend to use all five more evenly.
  *   *Implication:* If the "translation error" relies on lacking a foundation, Conservatives may be better equipped to understand Liberal arguments (because they have Care/Harm) than Liberals are to understand Conservative arguments (because they may lack Sanctity/Authority).
  *   *Caveat:* This is a statistical tendency, not a rule. In your seminar, the "Surrogacy" case suggests a Liberal (Sanctity/Dignity) argument being heard by peers who lack that register. This complicates the standard Left/Right MFT narrative.

  **3. "Rationally Hopeless" vs. "Empirically Resolvable."**
  You describe the disagreement as looking "rationally hopeless." Often, these foundation mismasks hide empirical disagreements.
  *   *Example:* "Meat is unclean" might actually be a heuristic for "Industrial farming creates biological risk" or "Eating this degrades my character."
  *   *Pushback:* Sometimes the "thin" translation is actually a charitable reduction. If someone says "It's degrading," and you ask "Who is harmed?", and they say "No one, it's just wrong," then it *is* a brute preference. The danger is assuming it's a brute preference before exhausting the interpretation.

  ### 4. The Metaethical Question: Symmetry and Truth
  *If the phenomenon is real and symmetric, does that tell us anything about whether the psychology of left and right has any bearing on who is actually right?*

  **Short Answer:** No. Symmetry of *process* does not imply symmetry of *truth*.

  **Long Answer:**
  1.  **Epistemic Blindness:** If both sides are suffering from Moral Naïve Realism, both are epistemically blinded to certain data. The "Harm" side ignores data about social cohesion or tradition; the "Sanctity" side ignores data about suffering. This suggests **moral pluralism** is epistemically safer than moral monism.
  2.  **The "Right" Question:** Whether industrial farming is *actually* wrong does not depend on whether the students understand each other. However, the *justification* for the wrongness might be incomplete if it ignores half the moral landscape. If "wrongness" is a composite of harm, fairness, and sanctity, then a theory that only counts harm is objectively incomplete, even if the harm argument is sufficient for a verdict.
  3.  **The Asymmetry Risk:** If one side actually possesses a broader moral vocabulary (as Haidt claims conservatives do), they might be capturing *more* of the moral truth, simply by tracking more variables. However, they might also be tracking *noise* (e.g., arbitrary purity rules).
  4.  **Conclusion:** The existence of this phenomenon argues for **Epistemic Humility**, not Moral Relativism. It tells you that your confidence in your verdict should be lowered by your inability to hear the other's reason, but it does not tell you that the other's verdict is equally valid. It tells you that **consensus is psychologically blocked**, not that **truth is equally distributed.**

  ### Summary for Your Seminar
  If you want to name this for your students to break the spell, I suggest **"Moral Projection."**

  *   **Definition:** Assuming your opponent is arguing from your values but doing it poorly, rather than arguing from different values and doing it well.
  *   **The Test:** Can you state your opponent's argument in a way that they would say, "Yes, that is exactly why I believe this," without using any of your own moral vocabulary?
  *   **The Goal:** Not agreement, but **Moral Bilingualism**. The ability to recognize a Sanctity argument *as* a Sanctity argument, even if you do not share it.

  This is not a standard term in the literature (I am coining it here for this context), but it captures the mechanism without relying on the contested modularity of Haidt's foundations. Evidence that it is a real pattern would be experimental data showing that training students to identify moral foundations *by type* reduces polarization more than training them to identify logical fallacies. (Some preliminary work by Feinberg suggests this is true).
