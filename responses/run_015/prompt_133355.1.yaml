answer: |-
  Your analogy between distributed systems and moral evaluation is strikingly precise, and it demonstrates a sophisticated grasp of the intuition driving the debate on moral luck. You have effectively reconstructed the **Control Principle**: the notion that moral assessment should depend only on factors within the agent's control (the "internal logic"), not on external contingencies (the "environmental noise").

  However, your question rests on a few critical presuppositions that require correction before we can address why philosophy has not universally adopted your proposed "engineering-style separation of concerns." Specifically, there are misunderstandings regarding the **teleology of moral judgment** (what it is *for*), the **epistemic conditions** under which we judge, and the **ontology of action** (what constitutes an act).

  Below, I outline these conceptual issues and explain why the "pure function of intent" model, while attractive, faces significant implementation errors when ported to human ethics.

  ### 1. Conceptual Correction: The Teleology of the System
  **Presupposition:** You assume the primary purpose of moral evaluation is analogous to **debugging**: isolating faults in the "decision algorithm" to assess its quality.
  **Correction:** In engineering, deterministic replay aims to improve system reliability. In ethics, moral judgment serves multiple, often conflicting, functions:
  *   **Retributive:** Giving agents what they "deserve" based on their will (closer to your model).
  *   **Consequentialist/Regulatory:** Deterring harmful behaviour and managing social risk.
  *   **Restorative:** Addressing the harm done to victims.

  If the goal of moral (and legal) systems is partly to minimise future harm, outcome cannot be treated as mere "noise." Consider your drunk driving example. From a risk-management perspective, the driver who hits a pedestrian and the driver who does not have exposed the system to the *same* risk. However, society often calibrates blame based on **realised harm** to maintain social equilibrium and provide recourse to victims. If we treated both cases identically (ignoring the outcome), we might satisfy the Control Principle, but we would fail the victims of the actual crash. The "system" is not just the agent; it is the community. Ignoring outcomes might be a "feature" for assessing *character*, but it is a "bug" for assessing *liability*.

  ### 2. Conceptual Correction: Epistemic Access (The Missing Logs)
  **Presupposition:** You assume we have access to the "intent-layer state variables" equivalent to a replay log.
  **Correction:** In distributed systems, logs are authoritative records. In human psychology, **intent is epistemically inaccessible.** We cannot read another agent's source code. We must infer their internal state from their external actions and the consequences thereof.

  Outcomes provide vital data for inferring negligence or recklessness. If a surgeon performs a procedure identically in two cases, but the patient dies in one due to a rare allergy, we might excuse the surgeon. However, if the patient dies because the surgeon skipped a safety check, the outcome confirms the negligence. Without looking at the "output" (the outcome), our ability to debug the "input" (the intent) is severely degraded. Treating outcome as noise removes a crucial signal used to reconstruct the internal state.

  ### 3. Conceptual Correction: The Ontology of Action
  **Presupposition:** You treat an action as a mental event (the decision) distinct from its physical realisation (the outcome).
  **Correction:** Many philosophical traditions (particularly **Anscombean** or **Aristotelian** views) argue that an action is not complete until it has effected change in the world. To intend to kill is not the same moral category as killing.

  In your engineering analogy, a function that *attempts* to write to a database but fails due to network latency is often treated differently than one that succeeds, depending on whether you are measuring *throughput* or *error handling*. In morality, the "transaction" is the interaction with other agents. If morality is fundamentally relational (about how we treat one another), then the "side effects" are not noise; they are the very substance of the moral transaction. A "pure function" of intent implies a solipsistic morality, where what matters is only the cleanliness of my own soul, not the state of the world I leave behind.

  ### 4. Philosophical Context: Has Philosophy Ignored This?
  It is incorrect to say moral philosophy has not adopted this separation. In fact, a major branch of modern ethics is built precisely on your premise.
  *   **Immanuel Kant** argued that the only thing good without qualification is a **Good Will**. For a Kantian, moral worth is indeed a pure function of the intent (duty), irrespective of outcomes. If you try to save a life and fail, your moral worth is identical to if you succeeded.
  *   **Thomas Nagel** and **Bernard Williams**, who coined the term "Moral Luck," highlighted this tension precisely to show that our Kantian intuitions (Control Principle) clash with our actual practices (Outcome Dependence).

  Philosophers have not "failed" to adopt your model; rather, they have identified that adopting it fully creates a paradox. If we strictly filter out all outcome-layer noise, the concept of moral responsibility shrinks until it almost vanishes. As Nagel noted, almost everything we do is susceptible to luck (constitutive, circumstantial, causal, and resultant). If we isolate the "internal algorithm" too strictly, there is very little "self" left to hold responsible.

  ### 5. Why the "Engineering Fix" is Not Applied
  You ask why we should not regard outcome-dependence as a "system-level fault." The reason is that doing so would require a refactor of human psychology and social coordination that may be impossible or undesirable.

  1.  **Incentive Structures:** If moral and legal blame were decoupled from harm, agents might take greater risks. The "cost" of a failed moral algorithm would be capped at the level of intent, regardless of the catastrophe it causes. Outcome-dependence acts as a **circuit breaker** that forces agents to care about the environment, not just their internal logic.
  2.  **Emotional Reality:** Human reactive attitudes (resentment, gratitude, guilt) are not logical functions; they are emotional responses to the world. We feel more guilt when we actually harm someone than when we merely risk it. To demand we suppress this is to demand we act against our psychological grain.
  3.  **The Definition of "Fault":** In your analogy, a server outage is a fault. In ethics, a tragic outcome is not always a "fault" of the system; it is sometimes a **tragedy**. Philosophy distinguishes between *moral blame* (you did wrong) and *agent-regret* (I wish this hadn't happened, even if I wasn't negligent). Your model collapses these distinct states.

  ### Conclusion
  Your intuition is philosophically sound and aligns with the **Control Principle** championed by Kantians. You are correct that outcome-dependence introduces a form of "noise" into the assessment of character.

  However, the reason philosophy has not universally adopted an "engineering-style separation of concerns" is that **morality is not a closed system.** It is an open system where the "outputs" (harms, benefits) matter as much as the "code" (intent). To treat outcomes as mere environmental noise is to prioritise the purity of the agent over the welfare of the community.

  Rather than a "category error," most contemporary philosophers view moral luck as a **tragic paradox**: we are committed to the Control Principle, yet we cannot help but judge by outcomes. The solution is not to patch the system to ignore outcomes, but to recognise that our moral practices serve multiple masters (justice, deterrence, repair) that cannot always be satisfied by a single, pure function of intent.
