answer: |-
  **Title:** The Morality of Conventionalized Misleading: When Common Ground Collapses the Lying/Misleading Distinction

  **Research Question**
  Standard debates in the ethics of communication posit a moral distinction between lying (asserting what one believes to be false) and merely misleading (implicating what one believes to be false while asserting something technically true). The prevailing view suggests lying is morally worse, or at least distinct, because it involves a specific violation of the norm of assertion. My proposed chapter asks: **Does this moral distinction persist in contexts of "Conventionalized Misleading," where the deceptive implicature is part of the conversational common ground?**

  Specifically, I aim to test whether the moral protection usually afforded to misleading evaporates when the speaker and listener share a social code that renders the literal assertion a transparent placeholder for a known falsehood.

  **Background and Problem**
  The contemporary literature on lying versus misleading largely focuses on dyadic, one-off interactions between strangers or parties without established deceptive conventions. In these standard cases, the moral weight hinges on the mode of communication: the liar explicitly commits to a falsehood, whereas the misleader relies on the listener to infer the falsehood via Gricean implicature. This allows the misleader to maintain "plausible deniability" and arguably respects the listener's autonomy by leaving the inference work to them.

  However, this framework struggles to account for institutional or professional contexts where the "code" is public knowledge. Consider the lukewarm recommendation letter: a professor writes that a candidate was "punctual and polite," omitting any comment on research ability. In the academic common ground, this is universally decoded as "this candidate is not hireable." Similarly, in workshop feedback, describing a paper as "interesting" or "brave" is often conventionally understood as "this argument is flawed."

  In these cases, the speaker intends the listener to believe $p$ (the candidate is weak), says $q$ (the candidate is polite), and knows the listener knows that $q$ implies $p$. The deceptive content is not inferred ad hoc; it is decoded via social convention. Standard accounts leave this open because they treat the semantic content (the literal truth) as the primary locus of moral evaluation. If the literal truth is what matters, conventionalized misleading remains distinct from lying. But if the *communicative function* and the *intent to deceive* are what matter, these cases look functionally identical to lying. My project investigates whether the "common ground" factor shifts the moral valuation.

  **Methodology and Two-Month Plan**
  Over the next two months, I will not attempt to solve the definition of lying. Instead, I will focus on a comparative normative analysis of standard misleading versus conventionalized misleading.

  *Month 1: Taxonomy and Case Isolation*
  I will construct a rigorous taxonomy of deceptive practices to isolate "Conventionalized Misleading" (CM) from standard "Implicature Misleading" (IM).
  *   **Task 1.1:** Define the necessary conditions for CM. Key criteria will include: (a) the existence of a shared social convention, (b) the mutual knowledge (common ground) that the literal assertion is uninformative, and (c) the mutual knowledge that the implicature is the primary communicative act.
  *   **Task 1.2:** Gather and refine case studies. I will focus on three specific domains: academic recommendation letters, peer review feedback, and diplomatic language. I will filter out cases where the convention is ambiguous (e.g., polite social compliments) to focus on high-stakes professional deception.
  *   **Deliverable:** A 10-page working paper section defining CM and distinguishing it from standard IM and outright lying.

  *Month 2: Normative Stress-Testing*
  I will apply the two dominant moral frameworks from the literature to these cases to see where they break.
  *   **Task 2.1:** The Trust Account. If the wrongness of lying stems from violating a norm of trust, does CM violate trust differently than IM? In CM, the listener *expects* the deception. Does this consent negate the violation, or does the institutional requirement to use the code implicate both parties in a systemic lie?
  *   **Task 2.2:** The Assertion Account. If the wrongness stems from asserting a falsehood, does CM count as asserting the implicature? I will explore the argument that in CM contexts, the convention *elevates* the implicature to the status of an assertion.
  *   **Deliverable:** A draft chapter (approx. 8,000 words) arguing that CM occupies a distinct moral category that aligns closer to lying than to standard misleading.

  **Why This Approach?**
  This approach beats the obvious alternative, which is to dive deeper into the semantics of assertion. A purely semantic approach risks getting bogged down in linguistic intuitions (e.g., "Is 'punctual' literally true?") which misses the ethical core of the problem. By focusing on the *common ground* and the *social convention*, I shift the debate from linguistics to social ethics.

  Furthermore, this is more tractable than attempting a general theory of deception. By narrowing the scope to institutional contexts where the code is known, I avoid the murky waters of interpersonal manipulation where intent is harder to prove. This allows for a cleaner test of whether the *mutual knowledge* of deception changes the moral calculus. It leverages my background as a TA; I have direct access to the phenomenology of these interactions, allowing for nuanced case description that abstract theorizing often misses.

  **Success and Failure Conditions**
  *   **A "Win":** I successfully demonstrate that at least one major normative account (e.g., the Trust Account) yields counterintuitive results when applied to CM unless it is modified to account for conventionality. For example, if the Trust Account says CM is permissible because the listener "knows the code," but we intuitively feel the practice is corrosive to the institution, I have identified a gap in the theory. A successful chapter would argue that CM is morally equivalent to lying because it relies on a collective suspension of the truth-norm.
  *   **A "Flop":** If I find that the moral distinction holds firm regardless of common ground. For instance, if it turns out that the literal truth *always* provides sufficient moral cover even when everyone ignores it, then my hypothesis that CM collapses the distinction is false. This is still a valuable result, as it would reinforce the robustness of the literalist view, but it would require pivoting the chapter to explain *why* the literal truth retains moral force in institutional settings.
  *   **Another Failure Mode:** If the category of "Conventionalized Misleading" proves too heterogeneous. If diplomatic lying functions morally differently from academic letter-writing, I may not be able to unify them under one analysis. In this case, I would narrow the scope to just academic contexts.

  **Scope and Limitations**
  I want to be clear that this is a dissertation *chapter*, not the whole project. I am not proposing a new general theory of lying. I am testing a boundary condition of existing theories. I will not address the legal implications of these practices (e.g., liability in references), nor will I delve into the history of the concept of lying prior to the contemporary debate.

  Additionally, I am bracketing the question of whether these practices are *all-things-considered* justified. It might be that CM is morally equivalent to lying but still justified due to professional norms (e.g., avoiding lawsuits). My focus is strictly on the *comparative* moral status of the act itself relative to standard lying and misleading, not the final justificatory balance.

  **Next Steps**
  For our meeting, I would like to discuss whether the "Assertion Account" or the "Trust Account" is the more fruitful framework to stress-test. I lean toward the Trust Account, as the institutional nature of these cases seems to implicate systemic trust rather than individual assertion norms, but I am open to your guidance on which literature would provide the strongest foil for this argument.
