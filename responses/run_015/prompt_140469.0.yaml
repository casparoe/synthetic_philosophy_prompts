  You're a decision theorist and formal epistemologist — someone who actually works on the value of information, not someone skimming the surface. Take this seriously and think it through properly: before you answer, brainstorm every way the thing could fail, throw out the boring ones, and rank what's left. I'd rather have five defeaters that bite than fifteen angles.

  ok, context, because it isn't abstract for me. My dad was diagnosed with early-onset Alzheimer's in the spring, and there's a predictive genetic panel my younger brother and I can both take — free, through the research study he's enrolled in. I want to take it, he doesn't, and his reason is basically "if it comes back bad I'll know I'm going to get it and that will wreck the next thirty years, so I'm better off not knowing." I've been playing the older brother who knows a bit of decision theory and telling him that isn't a reason: the expected value of free information is never negative, because you can always just ignore the result and do whatever you were going to do anyway, so the worst a free test can be is worthless. Apparently that has a name — Good's theorem. He is entirely unmoved, and, annoyingly, I've started to think he might not be being irrational after all.

  So: what would actually count against the position I'm leaning on? And please keep two things separate — (1) what would count against the theorem itself, as a piece of decision theory, and (2) what would count against using it the way I'm using it, i.e. telling a particular human being that his reason for not wanting to know is no reason at all. I suspect all the interesting defeaters live in the second category, and I want you to tell me straight if that's a dodge on my part.

  Some things I've been chewing on, in case any of them are live rather than merely logically possible:

  - The proof leans on "you can always ignore it." But you can't un-know. If knowing leaks into my behaviour whether I decide to let it or not — I treat my kids differently, I quietly stop making plans for 2050 without ever choosing to — then the "just ignore it" step is a commitment I can't actually make, and the theorem is describing an agent I'm not.
  - The result is ex ante and it's relative to one utility function. My future self might not want what I want. If a result is the kind of thing that rearranges what I care about, then "expected value for me" might not be well defined across the decision at all.
  - My brother's actual argument, which was fancier than I expected: he says that if you're not an expected-utility maximiser — if you're the sort of agent who, faced with a set of priors you cant rank, takes the option with the best worst case — then a free signal can genuinely make you worse off, because it hands you a choice under ambiguity that you didn't have before. He claims this is a real result and not something he made up on the drive over. Is it? And if it is, does it count against the theorem, or is it just a fact about a different theory of rationality?
  - The bit that feels most like a genuine defeater to me, and that I half-remember from somewhere: information closes options as well as opening them. Once I know, there are forms I can't honestly fill in the same way, cover I can no longer apply for in good faith, conversations where I can't say "we don't know" anymore. Ignorance is an asset that some institutions let you spend. That isn't a cost of acquiring the information, it's a cost of having it — which feels like it lands inside the theorem rather than outside it. Tell me whether it does.
  - And a social version of the same worry: I have a vague memory of an argument that when everyone can get the information before risks can be pooled, everyone can end up worse off, because the information destroys the arrangement that was making them better off. If that's right, the "never negative" result looks very local.

  What I'd find most persuasive, personally, is a concrete case — me versus my brother, or just one person and one test — where getting more information makes someone worse off in expectation and the explanation isn't just "people are bad at reasoning." If the only defeaters are bounded rationality, I'll keep my position. If there's a case where the information is free, truthful, and Bayes-legitimately-updated-on, and it's still a bad deal for a fully rational agent, I want to see it, and I'll take it seriously.

  Also — and I think this is the meta-question I actually care about — it's a theorem. Nothing can count against a theorem. So is the position I'm stating insulated against evidence by construction? Say plainly whether the "relying on it" version of my position is doing all the work, whether that's a problem for a claim of this kind, and what I'd have to notice to give it up. Which of these would a committed "always take the free test" person concede as counting against them, and which would they wave off as a confusion?

  Rank what you find from fatal to merely awkward. And be explicit about your confidence: for each defeater, say how confident you are that it's a real defeater rather than a mistake, and finish by telling me the single claim in your answer you're least sure of.
