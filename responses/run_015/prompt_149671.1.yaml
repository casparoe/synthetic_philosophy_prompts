  **Conclusion of Proposal**
  This research proposes a significant intervention in the philosophy of physics. By focusing on the failure of the shadowing lemma in realistic (non-hyperbolic) systems, it challenges the comfortable separation of metaphysics and epistemology in discussions of determinism. If successful, the paper will demonstrate that there are forms of determinism that are scientifically inert because they cannot be tracked, thereby requiring a revision of how philosophers of science categorize the relationship between laws, models, and reality. The project is feasible within a semester provided the focus remains on the conceptual implications of the mathematical failure rather than the mathematics itself.

