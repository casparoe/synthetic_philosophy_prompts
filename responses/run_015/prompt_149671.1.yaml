  Write a formal research proposal for a one-semester philosophy-of-science term paper (approximately 5,000 words) addressing the following problem: standard philosophical discussions separate metaphysical determinism from epistemic predictability, treating chaotic dynamics as a case where determinism holds but prediction fails due to sensitive dependence on initial conditions. However, in non-hyperbolic chaotic systems—those with mixed regular and chaotic regions that better approximate real physical dynamics—the shadowing lemma fails: approximate numerical trajectories may diverge not merely from a specific true trajectory, but from all true trajectories in the neighborhood. I propose to examine whether this "shadowing failure" establishes a genuinely intermediate category—deterministic dynamics that are not merely unpredictable in practice, but "untrackable" even in principle—thereby disrupting the standard determinism/predictability binary rather than merely deepening the epistemic gap. The proposal must include: (a) a precise statement of the research question with a determinate answer; (b) an explanation of why the standard "epistemic limitation" account and the "computational irreducibility" account leave the problem unresolved; (c) the methodological approach, specifying which conceptual distinctions (e.g., metaphysical vs. methodological determinism, strong vs. weak shadowing, ontic vs. epistemic chaos) will be used, how the argument will be structured over the semester, and why this approach is preferable to a historical survey or a formal modeling approach; (d) a clear description of what would count as a successful result and what conditions would count as failure (for instance, if the analysis collapses back into a familiar epistemic limitation story); and (e) an honest assessment of scope and risks given a single semester. Do not request a bibliography, literature review by citation, or reading list; citations will be added separately. After the proposal text, provide a brief structured summary as a JSON object with exactly these named fields: "core_question" (a concise statement), "niche_intervention" (the specific conceptual move being proposed), "method" (the analytical strategy), "success_criterion" (what a positive result looks like), "failure_criterion" (what would make the project fail), and "scope_note" (the realistic assessment).
