answer: |-
  # Research Proposal: Ontic Untrackability in Non-Hyperbolic Chaos

  ## 1. Introduction and Problem Context

  The philosophical orthodoxy regarding classical mechanics maintains a strict binary distinction between metaphysical determinism and epistemic predictability. Under this framework, a system is metaphysically deterministic if its future states are uniquely fixed by its past states and governing laws, regardless of whether an agent can calculate those states. Chaos theory is traditionally assimilated into this binary as a case study where determinism holds but predictability fails. This failure is attributed to "sensitive dependence on initial conditions" (SDIC): because finite measurement precision prevents exact knowledge of the initial state, and because errors grow exponentially in chaotic systems, long-term prediction becomes impossible in practice. However, the standard view assumes that this limitation is purely epistemic. It presupposes that while we cannot *know* the trajectory, a true trajectory exists corresponding to our approximate data, and our numerical simulations, while diverging from the specific true trajectory, remain close to *some* valid solution of the equations. This guarantee is mathematically formalized by the Shadowing Lemma.

  The Shadowing Lemma asserts that in hyperbolic chaotic systems, a numerical trajectory with bounded error will remain uniformly close to a true trajectory of the system. This lemma serves as the philosophical bridge preserving the coherence of determinism in chaotic contexts; it ensures that our simulations, however imperfect, are "tracking" reality even if they are not predicting the specific future of our measured initial condition. However, recent developments in dynamical systems theory indicate that the Shadowing Lemma does not hold for non-hyperbolic systems. Non-hyperbolic systems, characterized by mixed phase spaces containing both regular and chaotic regions, are arguably better models of real physical dynamics than uniformly hyperbolic abstract models. In these systems, numerical trajectories may diverge not only from the specific true trajectory associated with the initial condition but from *all* true trajectories in the neighborhood.

  This phenomenon, termed "shadowing failure," presents a profound challenge to the standard determinism/predictability binary. If a numerical simulation does not shadow any true trajectory, the simulation is not merely an imperfect prediction of a determined future; it is a representation of a history that never occurred and cannot occur within the solution space of the laws. This suggests a category of dynamics that are metaphysically deterministic (the laws are deterministic) but methodologically untrackable (no computational procedure can generate a trajectory corresponding to reality). This proposal outlines a research project designed to investigate whether shadowing failure in non-hyperbolic systems necessitates a revision of the standard philosophical taxonomy, specifically by establishing "ontic untrackability" as a distinct category that disrupts the binary separation of metaphysics and epistemology.

  ## 2. Research Question and Determinate Thesis

  **(a) Precise Statement of the Research Question with a Determinate Answer**

  **Research Question:** Does the failure of the shadowing lemma in non-hyperbolic chaotic systems constitute a merely severe epistemic limitation, or does it establish a genuinely intermediate category of "methodological indeterminism" wherein deterministic dynamics are untrackable in principle?

  **Determinate Answer (Thesis):** This project will argue that shadowing failure establishes a genuinely intermediate category. It is not merely a deepening of the epistemic gap (unpredictability due to measurement error) but a structural disconnect between computational representation and ontic reality (untrackability). Consequently, the standard binary is insufficient. A tripartite distinction is required: (1) Metaphysical Determinism (unique future exists), (2) Methodological Determinism (shadowing holds, simulations track reality), and (3) Methodological Indeterminism (shadowing fails, simulations track no reality). The project will defend the position that for non-hyperbolic systems, while metaphysical determinism may hold formally, it loses its empirical and explanatory utility, effectively functioning as a form of indeterminism for any embedded observer or simulator.

  ## 3. Critique of Standard Accounts

  **(b) Explanation of Why Standard Accounts Leave the Problem Unresolved**

  To justify the need for this research, it is necessary to demonstrate why existing philosophical frameworks cannot adequately absorb the phenomenon of shadowing failure. Two dominant accounts currently manage the tension between chaos and determinism: the "Epistemic Limitation" account and the "Computational Irreducibility" account. Both fail to address the specific implications of non-hyperbolic shadowing failure.

  **The Epistemic Limitation Account**
  The standard philosophical interpretation of chaos relies on the distinction between ontic states (the actual state of the system) and epistemic states (the agent's knowledge of the system). Under this view, unpredictability is solely a function of coarse-graining. We cannot measure initial conditions with infinite precision; therefore, we must rely on a probability distribution over a region of phase space. In hyperbolic chaos, the Shadowing Lemma assures us that every point in our uncertain initial region evolves into a valid trajectory. Thus, the uncertainty is about *which* true trajectory is the actual one, not about whether the trajectories exist.

  This account collapses when shadowing fails. In non-hyperbolic systems, a numerical trajectory generated from an approximate initial condition may not correspond to *any* true trajectory originating from the uncertainty region. The error is not merely that we have selected the wrong valid path; the error is that the path generated by our best computational methods is ontologically spurious. It represents a solution to the numerical approximation of the equations, but not to the equations themselves. The Epistemic Limitation account assumes a mapping between approximate knowledge and exact reality. Shadowing failure severs this mapping. Therefore, describing this merely as "lack of knowledge" is category mistake; it is a lack of correspondence between the model and the world that cannot be fixed by better measurement, because the divergence arises from the structural instability of the solution space itself, not just the input precision.

  **The Computational Irreducibility Account**
  A second account, often associated with complex systems theory, suggests that some systems are "computationally irreducible." This view posits that the only way to determine the future state of a system is to simulate it step-by-step; there is no shortcut. Proponents might argue that shadowing failure is simply an instance of irreducibility: the system is so complex that our computers cannot keep up, and the divergence is just a manifestation of the system's intrinsic computational depth.

  This account is insufficient because it conflates computational cost with computational validity. Computational irreducibility assumes that if you run the simulation, you are seeing the behavior of the system, even if you had to run the whole thing to see it. Shadowing failure implies that running the simulation might produce behavior that the system *cannot* exhibit. If a numerical trajectory wanders into a region of phase space that no true trajectory can occupy (due to the breakdown of hyperbolicity), the simulation is not just "hard to compute"; it is generating artifacts. The Computational Irreducibility account treats the simulation as authoritative regarding the system's possibilities. Shadowing failure undermines the authority of the simulation itself. Therefore, appealing to irreducibility does not resolve the ontological status of the divergent trajectory; it merely hides the discrepancy behind a claim of complexity.

  Both accounts presuppose a stable relationship between the mathematical model and the physical reality it purports to describe. The Epistemic account assumes the relationship is obscured by measurement; the Irreducibility account assumes the relationship is preserved by computation. Shadowing failure suggests the relationship itself is fractured in non-hyperbolic regimes. Neither existing account provides the conceptual vocabulary to describe a system that is law-governed yet generates no trackable history.

  ## 4. Methodological Approach

  **(c) Conceptual Distinctions, Argument Structure, and Methodological Justification**

  **Conceptual Distinctions**
  The argument will rely on a rigorous clarification of three specific conceptual dichotomies found in the philosophy of physics and dynamical systems theory:

  1.  **Metaphysical vs. Methodological Determinism:** Metaphysical determinism refers to the ontological claim that the laws of nature fix a unique future given a present state. Methodological determinism refers to the pragmatic capacity to assign a specific future state to a specific present state using available mathematical tools. The project will argue that shadowing failure preserves the former while negating the latter in a way that matters for scientific realism.
  2.  **Ontic vs. Epistemic Chaos:** Standard literature often treats chaos as an epistemic phenomenon (unpredictability). Some recent work suggests "ontic chaos" where the instability is in the system itself. This project will refine this by proposing "Ontic Untrackability": the instability is not in the system's evolution (which is fixed) but in the mapping between the system's state space and the computable representation of that space.
  3.  **Strong vs. Weak Shadowing:** Mathematically, strong shadowing guarantees a true trajectory stays close to a pseudo-orbit forever. Weak shadowing may only hold for finite times. The philosophical analysis will hinge on the transition from weak to non-existent shadowing in non-hyperbolic systems, arguing that the loss of the shadowing property changes the modal status of the simulated trajectories from "approximate truths" to "fictional artifacts."

  **Argument Structure**
  The term paper will be structured over five sections, designed to be completed within a one-semester timeline:

  *   **Section 1: The Standard Binary.** Establish the orthodox view of determinism and predictability. Define the Laplacian demon and its modern philosophical successors. Explain how chaos theory is currently integrated into this view via the Epistemic Limitation account.
  *   **Section 2: The Mathematical Crack.** Introduce the Shadowing Lemma and its role in securing the link between simulation and reality. Explain the distinction between hyperbolic and non-hyperbolic systems without excessive formalism, focusing on the physical significance of mixed phase spaces.
  *   **Section 3: The Failure of Shadowing.** Detail the phenomenon of shadowing failure. Analyze why numerical trajectories in non-hyperbolic systems diverge from all true solutions. Distinguish this from standard numerical error.
  *   **Section 4: Philosophical Implications.** This is the core argument. Apply the conceptual distinctions (Metaphysical vs. Methodological) to the findings of Section 3. Argue that shadowing failure creates a gap that cannot be described as merely epistemic. Defend the thesis of "Methodological Indeterminism."
  *   **Section 5: Conclusion and Outlook.** Summarize the argument for the tripartite distinction. Discuss implications for scientific modeling and realism. Suggest areas for further research (e.g., quantum-classical transition).

  **Methodological Justification**
  This project employs a method of **conceptual analysis grounded in mathematical practice**. This approach is preferable to a historical survey or a formal modeling approach for two reasons.

  First, a **historical survey** would dilute the focus. While the history of chaos theory is rich, the specific problem of non-hyperbolic shadowing is a contemporary technical issue. A historical approach would spend too much time on the development of chaos theory generally, rather than the specific philosophical implications of the shadowing lemma's failure. The problem is structural, not genealogical.

  Second, a **formal modeling approach** (attempting to prove new mathematical results about shadowing) is outside the scope of a philosophy term paper and risks obscuring the conceptual stakes. The mathematical facts regarding shadowing failure in non-hyperbolic systems are established in the literature; the philosophical work lies in interpreting what these facts mean for our understanding of determinism. A formal modeling approach would require deriving the conditions for shadowing failure, which is a task for mathematics, not philosophy. The philosophical task is to analyze the consequences of those conditions for metaphysics and epistemology.

  Therefore, conceptual analysis allows for the necessary precision regarding the definitions of determinism and predictability while remaining focused on the implications of the existing mathematical results. It bridges the gap between the technical details of dynamical systems and the broader questions of scientific realism.

  ## 5. Success and Failure Criteria

  **(d) Description of Successful and Failed Results**

  **Success Criteria**
  A successful result will be achieved if the paper accomplishes the following:
  1.  **Conceptual Clarity:** It successfully distinguishes "unpredictability" (not knowing which true path is taken) from "untrackability" (the computed path corresponds to no true path).
  2.  **Argumentative Validity:** It demonstrates that the Epistemic Limitation account cannot absorb "untrackability" without changing the definition of "epistemic" to the point of vacuity.
  3.  **Positive Thesis:** It establishes the coherence of "Methodological Indeterminism" as a useful category for philosophy of science. A successful paper will show that this category helps explain why certain deterministic models fail to provide explanation or prediction, not because of human limitation, but because of the structural relationship between the model and the world.
  4.  **Integration:** It integrates the mathematical concept of shadowing failure into the metaphysical discussion of determinism without committing category errors (e.g., claiming the system is physically indeterministic).

  **Failure Criteria**
  The project will be considered to have failed if:
  1.  **Collapse into Epistemicism:** The argument inadvertently collapses back into the standard view. For example, if the analysis concludes that shadowing failure is just "extreme sensitivity to initial conditions," it fails to identify the distinct structural problem. If the divergence can be explained away as merely requiring higher precision measurement (which shadowing failure explicitly negates), the thesis fails.
  2.  **Metaphysical Overreach:** The argument claims that shadowing failure proves the world is indeterministic. This would be a failure of precision. The equations remain deterministic; the issue is the trackability. Conflating methodological indeterminism with metaphysical indeterminism would undermine the philosophical rigor.
  3.  **Technical Misinterpretation:** The paper misrepresents the Shadowing Lemma or the nature of non-hyperbolic systems. If the mathematical grounding is incorrect, the philosophical superstructure collapses.
  4.  **Triviality:** The paper concludes that "models are imperfect" without showing why this specific imperfection matters for the definition of determinism. The result must be non-trivial; it must disrupt the binary, not just add a footnote to it.

  ## 6. Scope and Risks Assessment

  **(e) Honest Assessment of Scope and Risks**

  **Scope**
  This project is scoped for a one-semester term paper of approximately 5,000 words. This length is sufficient to define the terms, present the mathematical context, and argue the philosophical implication, but it requires strict discipline to avoid digression. The scope is limited to classical deterministic chaos; it will not address quantum mechanics or stochastic systems, except where necessary for contrast. The focus is strictly on the implication of shadowing failure for the determinism/predictability binary.

  **Risks**
  1.  **Mathematical Complexity:** The primary risk is the technical difficulty of the subject matter. The distinction between hyperbolic and non-hyperbolic systems involves advanced dynamical systems theory. There is a risk of oversimplifying the mathematics to the point of inaccuracy or becoming so bogged down in technical details that the philosophical argument is lost. *Mitigation:* The paper will rely on established qualitative descriptions of shadowing failure found in philosophical literature on chaos, rather than attempting original mathematical derivations.
