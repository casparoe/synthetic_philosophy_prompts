answer: |-
  To decide on the clearance of second-growth woodland, you need an accounting framework that functions as a interface between ecological fact and ethical weight. The current debate fails because participants conflate the *capacity* of the land to generate experience with the *value* of that experience.

  Below are six desiderata for an account of ecosystem net welfare. They are designed to force the six worries you raised into the open. Each is marked as either **Non-negotiable** (required for the decision to be logically coherent and actionable) or **Camp Preference** (dependent on one's underlying moral philosophy).

  ### 1. Temporal Resolution (Transition vs. Steady State)
  **The Criterion:** The account must calculate welfare over two distinct time horizons: the *transition phase* (the clearing event and immediate aftermath) and the *steady state* (the long-term equilibrium of the distribution center vs. the regenerating woodland). It must not integrate these into a single net number without disclosing the weighting.
  **The Worry:** Addresses your first concern: a one-off drop in numbers vs. a permanent shift. A model that only compares steady states ignores the acute suffering of displacement; a model that only integrates the transition ignores the centuries of altered existence that follow.
  **Status:** **Non-negotiable.**
  **Reasoning:** Ecological systems are dynamic. A decision based solely on equilibrium analysis ignores the causal shock of the act itself; a decision based solely on the shock ignores the purpose of the land use change. Both are physically real.

  ### 2. Axiological Modularity (Ecology vs. Ethics)
  **The Criterion:** The account must output ecological variables (population sizes, species composition, proxy indicators of affect) separately from the ethical aggregation function. It must not output a "net welfare" score until the user supplies a population ethical stance.
  **The Worry:** Addresses your sixth concern. Currently, advocates often present "Nature is cruel" (an ecological claim) as identical to "We should intervene" (an ethical claim). This criterion forces the model to say: *"Here is the amount of predation/starvation,"* leaving you to decide if that constitutes a net negative.
  **Status:** **Non-negotiable.**
  **Reasoning:** Without this separation, you cannot distinguish whether a disagreement arises from disputed data (e.g., insect pain capacity) or disputed values (e.g., whether non-existence is preferable to suffering).

  ### 3. Explicit Population Axiology (Non-Identity & Existence)
  **The Criterion:** The account must specify how it treats individuals who exist in one counterfactual but not the other. It must state whether the "loss" of potential lives counts as a cost, a benefit, or neutral.
  **The Worry:** Addresses your second concern. If the woodland would have supported 10,000 short-lived insects and the center supports 0, is that a reduction in suffering or a loss of value? The model must declare if it operates on Total Utilitarianism (sum of all lives), Critical Level Utilitarianism, or a Person-Affecting View.
  **Status:** **Camp Preference.**
  **Reasoning:** There is no scientific fact that resolves whether a never-born animal is a "loss." This is purely a function of which moral camp you align with. However, the *disclosure* of this stance is Non-negotiable.

  ### 4. Compositional Weighting (Life-History Sensitivity)
  **The Criterion:** Welfare cannot be a function of biomass or headcount alone. The account must apply weighting factors based on life-history traits (e.g., r-strategists with high mortality vs. K-strategists with high parental investment).
  **The Worry:** Addresses your third concern. Clearing often replaces specialists with generalists, or vertebrates with invertebrates. If invertebrates have a higher probability of net-negative welfare per unit of biomass, a shift toward them increases total suffering even if total biomass drops.
  **Status:** **Non-negotiable.**
  **Reasoning:** Welfare is a property of the individual organism's nervous system and life experience, not the tonnage of the ecosystem. Ignoring composition renders the concept of "welfare" meaningless.

  ### 5. Observable Proxy & Sensitivity Bounds
  **The Criterion:** The account must name the observable proxy used for welfare (e.g., cortisol levels, behavioral deprivation, mortality rates) and provide a sensitivity analysis showing how the verdict changes if the proxy is wrong by order-of-magnitude estimates.
  **The Worry:** Addresses your fourth concern. You have counts and fecundities, not access to qualia. A usable account must admit it is inferring welfare from behavior/physiology and show if the decision flips when that inference is uncertain.
  **Status:** **Non-negotiable.**
  **Reasoning:** A decision rule that relies on unobservable variables is not a decision rule; it is an article of faith. To be usable by a board, the uncertainty must be quantified.

  ### 6. Counterfactual Specificity (Baseline Definition)
  **The Criterion:** The "no-clearing" baseline must be explicitly defined as a specific ecological trajectory (e.g., "succession to mature forest" vs. "invasive species takeover"), not an abstract "wilderness."
  **The Worry:** Addresses your fifth concern. The alternative to a distribution center is not Eden; it is a specific, evolving biological state. The model must compare the development against *that* specific state, including its own predation and starvation dynamics.
  **Status:** **Non-negotiable.**
  **Reasoning:** Causal attribution requires a defined control. "Wilderness" is not a control; it is a myth. Only a specific trajectory allows for a valid comparison of outcomes.

  ***

  ### The Structural Tensions

  **The Impossible Pair: Compositional Weighting vs. Observable Proxy & Sensitivity**
  Your suspicion is correct. These two requirements pull in opposite directions.
  *   **Compositional Weighting** demands granular data: you need to know the welfare status of specific species (e.g., distinguishing the suffering of a specialist beetle from a generalist ant).
  *   **Observable Proxy** demands tractability: reliable data on affective states is currently non-existent for most wild taxa, especially invertebrates which dominate biomass.
  *   **The Conflict:** To satisfy Composition, you need data you do not have. To satisfy Tractability, you must aggregate across species, which violates Composition. You will likely have to accept a "satisficing" solution where you group species by broad life-history traits (e.g., "small endotherms" vs. "insect larvae") rather than assessing them individually, acknowledging that this introduces significant error into the welfare calculation.

  **The Most Exclusionary Requirement: Axiological Modularity**
  This single requirement excludes the largest share of views currently on offer.
  *   **Why:** Most literature on wild animal suffering (both from advocates who want to intervene and conservationists who want to leave nature alone) conflates the *ecological description* with the *ethical evaluation*. They argue "Nature is full of suffering" (ecology) therefore "Nature is bad" (ethics).
  *   **The Exclusion:** A framework that enforces Modularity rejects any argument that does not explicitly separate the measurement of pain/death from the valuation of that pain/death. This disqualifies most rhetorical advocacy, standard cost-benefit analyses that assume human preferences map to animal welfare, and deep ecology views that treat "ecosystem health" as intrinsically valuable regardless of individual experience. It forces the debate onto the narrow ground where it belongs: the intersection of measurable biology and explicit moral axioms.

  ### Summary for the Board
  When you evaluate the proposals before you, do not ask "Is nature net negative?" Ask:
  1.  Does this model separate the *count* of lives from the *value* of those lives? (Modularity)
  2.  Does it admit that we are guessing at welfare using proxies, and show me the error bars? (Tractability)
  3.  Does it acknowledge that preventing the birth of future woodland animals is a different ethical category than killing existing ones? (Axiology)

  If a proponent cannot answer these without conflating the terms, their verdict is not ready for a vote.
