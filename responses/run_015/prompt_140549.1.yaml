          *   *Claim:* Admits brute necessitation. Argues it's better than physicalism's brute emergence (non-experiential to experiential). Like-from-like is cheaper.
          *   *Assessment:* This is the standard "Russellian Monist" defense. It's theoretically valid but concedes the "solution" to the combination problem is just accepting a different brute fact.
          *   *Verdict:* Mostly Right. It's a coherent theoretical trade-off, even if it doesn't "solve" the problem in the strong sense.

      *   **Move 4: Saul's Second Reply (The Rock/Thermostat Problem).**
          *   *Claim:* If micro-to-macro is brute, why not rocks? You need a condition (integration/complexity). If you add that, the micro-experiences are decorative; the structure does the work.
          *   *Assessment:* This is the "Collapse into Emergentism" objection. If structure determines consciousness, why do we need micro-phenomenality?
