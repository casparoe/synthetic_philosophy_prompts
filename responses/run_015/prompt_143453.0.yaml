  # Commission: The Meridian Committee Exercise
  **Subject:** Embodied Introduction to Arrow's Impossibility Theorem
  **Context:** Upper-level Undergraduate Seminar in Political Philosophy
  **Duration:** 90 Minutes
  **Participants:** 16 Students (Delegates) + 1 Facilitator (Chair)

  ## 1. Overview and Objective
  This activity is designed to bypass formal mathematical proof in favour of phenomenological contradiction. Students will serve as disciplinary delegates on the 'Meridian Committee', tasked with allocating a single grant. Through two rounds of voting, they will experience a reversal in the social ranking of two proposals (Aurora and Boreas) solely due to the introduction of an ineligible 'shadow proposal' (Echo). This lived experience serves as the anchor for a subsequent discussion on Kenneth Arrow's conditions for social welfare functions.

  ## 2. Materials and Roles

  **Roles:**
  *   **The Chair (Facilitator):** Manages the protocol, counts tokens, and enforces the bylaws. Does not vote.
  *   **The Delegates (16 Students):** Divided into four confidential blocs. They hold private preference cards and vote sincerely (initially).

  **Materials:**
  *   **Preference Cards:** 16 cards (laminated), distributed according to the profile below.
  *   **Ballot Slips:** Simple paper slips for recording pairwise choices.
  *   **Prestige Tokens:** 50 physical tokens (e.g., poker chips or coloured glass stones).
  *   **The Ledger:** A visible board tracking the tournament bracket and token distribution.
  *   **Proposal Summaries:** One-paragraph descriptions of Aurora, Boreas, Cygnus, Draco, and Echo to give them thematic weight (e.g., Aurora = Climate Modelling, Boreas = Quantum Computing, etc.).

  **The Preference Profile (Secret):**
  To guarantee the contradiction, the 16 delegates are divided into three voting blocs. The fourth set of cards is distributed to balance the numbers but does not alter the core cycle.

  *   **Bloc Alpha (6 Delegates):** Echo > Aurora > Boreas > Cygnus > Draco
  *   **Bloc Beta (5 Delegates):** Aurora > Boreas > Cygnus > Draco > Echo
  *   **Bloc Gamma (5 Delegates):** Boreas > Cygnus > Draco > Echo > Aurora

  *Note on Logic:*
  1.  **Aurora vs Boreas:** Alpha (6) + Beta (5) = 11 prefer Aurora. Gamma (5) prefer Boreas. **Majority: Aurora > Boreas.**
  2.  **Echo vs Aurora:** Alpha (6) + Gamma (5) = 11 prefer Echo. Beta (5) prefer Aurora. **Majority: Echo > Aurora.**
  3.  **Boreas vs Echo:** Beta (5) + Gamma (5) = 10 prefer Boreas. Alpha (6) prefer Echo. **Majority: Boreas > Echo.**

  This creates a Condorcet Cycle: Aurora > Boreas > Echo > Aurora.

  ## 3. The Voting Protocol: Sequential Pairwise-Elimination

  The Meridian Committee operates under the following Bylaws:

  1.  **Tournament Structure:** Proposals are paired. The loser of each pairwise majority vote is eliminated. Winners advance to the next round until one proposal remains.
  2.  **Eligibility:** Only Aurora, Boreas, Cygnus, and Draco are eligible to receive the grant. Echo is a 'Shadow Proposal' (ineligible to win) but must be voted on if present on the ballot.
  3.  **The Recall Clause:** If, at the end of the tournament, it is demonstrated that an eliminated eligible proposal would have defeated the winner in a direct pairwise contest, the eliminated proposal is 'Recalled'. The winner is stripped of victory, and a runoff is held.
  4.  **Token Payoff:**
      *   **3 Tokens:** Awarded to each delegate whose *top-ranked eligible proposal* wins the grant.
      *   **1 Token:** Awarded to each delegate if the process ends in a 'Recall' deadlock (consolation for procedural failure).
      *   **0 Tokens:** If your top choice is eliminated without recall.

  ## 4. Minute-by-Minute Timeline

  **00:00 – 00:10: Induction**
  *   Distribute Preference Cards face down. Instruct students not to show them to anyone.
  *   Explain the Meridian Committee's goal: Rank the proposals to find a winner.
  *   Explain the Token Payoff. Emphasise that tokens represent 'Departmental Prestige'.

  **00:10 – 00:30: Round One (The Baseline)**
  *   **Condition:** Echo is **absent**. Proposals: Aurora, Boreas, Cygnus, Draco.
  *   **Bracket:**
      1.  Aurora vs Boreas
      2.  Cygnus vs Draco
      3.  Winner 1 vs Winner 2
  *   **Action:** Delegates vote on slips. Chair collects and announces results.
  *   **Expected Outcome:**
      *   Aurora beats Boreas (11–5).
      *   (Assume Cygnus beats Draco based on filler preferences).
      *   Aurora beats Cygnus.
  *   **Result:** Aurora is ranked #1. Boreas is eliminated.
  *   **Payoff:** Alpha and Beta blocs receive 3 tokens each. Gamma receives 0.

  **00:30 – 00:55: Round Two (The Shadow)**
  *   **Condition:** Echo is **present**. Proposals: Aurora, Boreas, Cygnus, Draco, Echo.
  *   **Bracket:** (Chair arranges this to expose the cycle).
      1.  Aurora vs Echo
      2.  Boreas vs Cygnus
      3.  Winner 1 vs Winner 2 (Draco receives a bye to the semi-final).
  *   **Action:** Delegates vote. **Crucial:** Remind them their preference cards have *not* changed.
  *   **Expected Outcome:**
      *   Echo beats Aurora (11–5). **Aurora is eliminated.**
      *   Boreas beats Cygnus.
      *   Boreas beats Echo (10–6).
  *   **Result:** Boreas is the Winner. Aurora was eliminated in Round 1 of the bracket.
  *   **Social Ranking:** Boreas > Aurora.
  *   **Payoff:** Gamma and Beta (if Boreas is 2nd choice) receive tokens. Alpha receives 0.
  *   **The Contradiction:** Point out that in Round 1, the Committee preferred Aurora to Boreas. In Round 2, the Committee prefers Boreas to Aurora. No individual changed their mind.

  **00:55 – 01:05: The Recall Clause (The Glitch)**
  *   **Trigger:** A delegate (planted or volunteer) invokes the Recall Clause. "Aurora was eliminated by Echo, but Aurora beats Boreas directly."
  *   **Action:** The Chair verifies the pairwise count (Aurora 11, Boreas 5).
  *   **Consequence:** Boreas is stripped of the win. Aurora is recalled.
  *   **Runoff:** Aurora vs Boreas.
  *   **Outcome:** Aurora wins (11–5).
  *   **Instability:** But wait—if Aurora wins, does Echo have a claim? Echo beat Aurora. If Echo is ineligible, does that matter? The room should feel the procedural vertigo.
  *   **Payoff:** Due to the instability, the Chair declares a 'Procedural Deadlock'. All delegates receive 1 Token (Consolation).

  **01:05 – 01:30: Debrief and Mapping**
  *   Collect tokens. Transition to theory.

  ## 5. Debrief Guide: Mapping Experience to Arrow

  Gather the students. Do not explain the theorem yet; ask them to explain the frustration. Then, map their experience to Arrow's four conditions.

  **1. Unrestricted Domain (Universality)**
  *   *Question:* "Did the voting rule work for every possible set of preferences?"
  *   *Reality:* "No. We only tested one specific distribution of cards."
  *   *Lesson:* The activity shows a *counter-example* to the possibility of a perfect system, not a proof for all cases. The Facilitator must supply the universal claim: Arrow proved this happens *somewhere* in every system.

  **2. Pareto Efficiency**
  *   *Question:* "If everyone preferred Aurora to Draco, did Draco win?"
  *   *Reality:* "Probably not in this run."
  *   *Lesson:* Our profile didn't force a Pareto violation, but the theorem states you cannot guarantee Pareto Efficiency alongside the other conditions.

  **3. Independence of Irrelevant Alternatives (IIA)**
  *   *Question:* "Why did the ranking between Aurora and Boreas flip?"
  *   *Answer:* "Because Echo entered the room."
  *   *Lesson:* This is the visceral violation of IIA. The social preference between A and B depended on E, even though no individual changed their A/B ranking. The 'Shadow Proposal' altered reality.

  **4. Non-Dictatorship**
  *   *Question:* "Did one student force the outcome?"
  *   *Answer:* "No, we voted."
  *   *Lesson:* We satisfied Non-Dictatorship. We also tried to satisfy Pareto and Unrestricted Domain (locally). The collapse happened because we could not satisfy IIA.

  **What the Activity Cannot Reproduce:**
  *   **Universal Proof:** This is a single preference profile. It does not prove that *all* voting systems fail, only that *this* system failed *here*. The Facilitator must explicitly state: "Arrow proved that for *any* ranked voting system, there exists *some* profile of preferences that breaks it. We just lived through one such profile."
  *   **Full Unrestricted Domain:** We fixed the number of voters (16) and options (5). Arrow's theorem applies to any number of voters and options (≥3).

  ## 6. Prediction of Failure and Facilitator Advice

  **Likely Failure Mode:**
  In Round Two, when Echo eliminates Aurora, the Alpha bloc (who prefer Echo > Aurora) may realise that Echo cannot win (ineligible). They may attempt to vote strategically in the Echo vs Aurora round to save Aurora, knowing Boreas is their greater enemy. Alternatively, the Gamma bloc may reject the Recall Clause, arguing "Aurora is out, move on."

  **Why this masks the problem:**
  If they vote strategically, the IIA violation becomes a story about 'gaming the system' rather than a structural impossibility. If they reject the Recall Clause, the contradiction remains hidden in the elimination order rather than exploding into a deadlock.

  **Facilitator Response:**
  *   **On Strategy:** If students discuss swapping votes, intervene firmly. "The Meridian Committee Bylaws require sincere revelation for the prestige tokens to be valid. Strategic voting invalidates your department's licence to bid." (Use the fiction to enforce sincerity).
  *   **On Recall:** If they refuse the recall, invoke the Bylaws mechanically. "The protocol is automatic. The data shows a cycle. The Clause triggers." Do not ask for permission; administer the rule as an external constraint.
  *   **On Confusion:** If the room becomes chaotic during the Recall, allow it for two minutes. Then freeze them. "This frustration is the data point. This is what the mathematics describes."

