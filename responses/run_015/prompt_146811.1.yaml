      *   *Distinction 2: Specificity.* Is the *rule* innate or the *bias*? PoS usually needs specific constraints, not just general learning power.
      *   *Distinction 3: Experience-Dependence.* Innate things can be triggered. Need to distinguish *information-bearing* vs. *enabling*.
      *   *Distinction 4: Species-Specificity.* PoS usually argues for a Language Acquisition Device (LAD), not general cognition.

      *   *Drafting the Criteria:*
