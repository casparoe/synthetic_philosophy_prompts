  It is entirely understandable that your gut feels conflicted; bioethicists have wrestled with this exact distinction for decades. The tension you are feeling arises because there are two competing principles at play, and your intuitions are switching between them depending on the context.

  The simplest, most traditional principle is the **Restoration of Species-Typical Functioning**. Under this view, medicine's goal is to restore you to the normal range of human capability (therapy). Anything that pushes you beyond that normal range is enhancement, and traditionally, enhancement is viewed with suspicion or deemed impermissible.

  This principle neatly categorises most of your examples:
  *   **Therapy (Fine):** Insulin for diabetes, growth hormone for a deficiency, laser surgery for short-sightedness, ADHD meds for functioning, and the gut bug for lost lactose digestion. All of these restore you to a normal baseline.
  *   **Enhancement (Not Fine):** Growth hormone for basketball height, steroids for athletes, ADHD meds for cramming, and the gut bug for digesting grass. All of these push beyond the normal human baseline.

  However, you noted that the **pilot night vision** case feels "really fine" to you, even though it is clearly enhancement (better than normal). This is the anomaly. To keep the principle simple (Therapy = Fine, Enhancement = Not Fine), you would have to overturn your verdict on the **pilot night vision** case. You would need to accept that, strictly speaking, giving a pilot super-human vision is ethically equivalent to giving a basketball player super-human height; both are enhancements that depart from species-typical norms.

  If we adopt this simple principle and overturn the pilot verdict to maintain consistency, we must then apply the same logic to your gut bug hiker case. Digesting grass cellulose is not a human-typical function; it is a biological augmentation. Therefore, under the strict Restoration Principle, it falls into the enhancement category alongside the basketball player and the steroid-using athlete.

  Verdict: Not Fine
