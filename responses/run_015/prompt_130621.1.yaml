answer: |-
  You have identified a structural flaw that is widely recognized in practice but lacks a single, canonical proper noun in the literature. You are describing the operationalization of the **Is-Ought Problem** within the specific context of **Impact Measures** and **Side-Effect Avoidance**.

  While there is no single "Gödel-style" name for this specific three-layer regress, it is best understood as an intersection of three established concepts: **The Value Loading Problem** (Armstrong), **The Frame Problem** (philosophical AI), and **Cryptonormativity** (Science & Technology Studies).

  If a precise term is required for your project, the most accurate descriptive label is **The Normative Displacement Regress**.

  Below is a precise definition of the phenomenon, its distinction from related concepts, and an analysis of how it behaves under different ethical formulations.

  ### 1. Naming and Lineage

  There is no standard term like "The Impact Regress Theorem," but the phenomenon is discussed under different headings in adjacent fields:

  *   **In AI Safety:** It is often treated as a specific failure mode of **Impact Measures** (e.g., *Relative Reachability*, *Attainable Utility Preservation*). Researchers like Victoria Krakovna, Stuart Armstrong, and Alex Turner have implicitly acknowledged this when noting that impact measures require a "whitelist" of effects or a specific utility function to avoid penalizing necessary task completion.
  *   **In Philosophy of Technology:** This is a formal instance of **Cryptonormativity**. Coined by scholars like Langdon Winner and expanded in critical data studies, this refers to technical systems that claim neutrality while embedding political or ethical judgments in their architecture (e.g., in the choice of features, the baseline, or the loss function).
  *   **In Epistemology:** It is a specific instance of the **No Free Lunch Theorem** applied to ethics. You cannot learn a "safe" partition of state-space without inductive biases, and those biases constitute normative commitments.

  ### 2. Precise Definition: The Normative Displacement Regress

  We can define this phenomenon formally to distinguish it from mere ambiguity or trade-offs.

  **Definition:** The Normative Displacement Regress occurs when a constraint system attempts to minimize "unintended change" by pushing normative judgments from the *objective function* into the *state representation*, then into the *learning architecture*, without ever explicitly acknowledging the value judgment required to distinguish "signal" (task) from "noise" (side effect).

  **The Three Layers of Displacement:**
  1.  **Metric Layer:** The system attempts to define impact neutrally (e.g., $L_1$ distance in state space).
      *   *Failure:* Physical neutrality $\neq$ Normative neutrality (the "atomic positions" problem).
  2.  **Partition Layer:** The system partitions state space into $S_{allowed}$ and $S_{forbidden}$.
      *   *Failure:* The partition boundary is itself a value judgment (the "task vs. side effect" problem).
  3.  **Architectural Layer:** The system learns the partition from data to avoid explicit specification.
      *   *Failure:* The inductive bias required to learn the partition encodes the values implicitly (the "hidden normativity" problem).

  **Distinctions:**
  *   **Vs. Ambiguity:** Ambiguity implies the value is vague. In this regress, the value is *precise* but *obscured*. The system works, but only because it secretly assumes a specific hierarchy of goods.
  *   **Vs. Precision-Neutrality Trade-off:** This is not a trade-off where more precision costs more neutrality. It is an **impossibility result**: Neutrality is structurally impossible for an acting agent. Any action selects a trajectory; selecting a trajectory over the null trajectory requires a preference.
  *   **Vs. Explicit Value Specification:** In standard utility maximization, values are in the reward function $R(s)$. In this regress, the claim is that values are *not* in $R(s)$ (which is set to "minimize change"), but they inevitably migrate to the definition of $s$ or the transition function $T$.

  ### 3. Consequentialist vs. Deontological Formulations

  You asked whether the loop breaks differently under different ethical formulations. It does not break, but the point of failure shifts.

  **Consequentialist Formulation (Impact Measures)**
  *   *Approach:* Minimize the distance between the actual outcome and the baseline outcome (e.g., "What would have happened if I stayed off?").
  *   *Failure Point:* **The Baseline Problem.** To calculate the distance, you must choose a baseline (e.g., "inaction," "previous policy," "human default"). Choosing the baseline is a counterfactual normative judgment. (e.g., If the baseline is "human inaction," but the human was about to make a mistake, correcting that mistake registers as high "impact.")
  *   *Result:* The regress ends at Layer 1 (Metric). You cannot define "consequence" without defining "relevant consequence."

  **Deontological Formulation (Constraints/Rules)**
  *   *Approach:* Maximize task utility subject to constraints (e.g., "Do not open the door," "Do not move atoms in region X").
  *   *Failure Point:* **The Predicate Grounding Problem.** To enforce a constraint, the agent must identify instances of the forbidden category. To distinguish "moving a brick to build a wall" (permitted) from "moving a brick to block a door" (forbidden), the agent must understand the *purpose* of the brick and the door.
  *   *Result:* The regress ends at Layer 2 (Partition). You cannot define the "act" without understanding the "context," and understanding context requires a model of human values.

  **Conclusion on Formulations:** Neither escapes the regress. Consequentialism fails on the *metric of change*; Deontology fails on the *semantics of the act*. Both require a model of "what matters to humans" to function, which is the very thing the low-impact framework was trying to avoid specifying.

  ### 4. Is Paralysis Unavoidable?

  **Yes, if Neutrality is Required.**
  If the design requirement is "minimize impact *without* knowing what humans value," paralysis (or randomization) is the only mathematically consistent solution. This is because, in a high-dimensional state space, almost *any* action moves the system away from the baseline trajectory in some coordinates. Without a weighting function (values) to say which coordinates matter, the agent must assume all coordinates matter equally. Since it cannot act without changing *some* coordinates, it must not act.

  **No, if Value-Ladenness is Accepted.**
  The loop breaks if you abandon the claim of neutrality.
  *   **Preference Learning:** Instead of trying to learn "impact," you learn "human preferences over impacts." This admits that "low impact" is shorthand for "low negative utility according to human preferences."
  *   **Contextual Integrity:** Borrowing from Helen Nissenbaum, you define impact not as state-distance, but as violations of informational or physical *norms* specific to a context. This explicitly encodes the values (the norms) rather than hiding them.

  ### 5. Recommendation for Your Project

  Since you are working on constrained optimization, you should explicitly name this constraint in your problem formulation. Do not treat "low impact" as a primitive.

  **Proposed Formalization:**
  Instead of:
  $$ \max E[U(task)] \quad \text{s.t.} \quad \text{Impact}(s, s_{baseline}) < \epsilon $$

  Use:
  $$ \max E[U(task)] \quad \text{s.t.} \quad \text{Impact}_V(s, s_{baseline}) < \epsilon $$

  Where $V$ is an explicit **Value Weighting Vector** (even if learned).

  **Terminology to Use:**
  In your paper or documentation, refer to this as **"The Normative Displacement Regress."** You can cite it as a specific instantiation of the **Value Loading Problem** within the domain of **Safe Exploration**.

  This framing allows you to argue that your system does not claim to be value-neutral, but rather *value-transparent* about the inductive biases used to define the impact metric. This sidesteps the philosophical wall you've identified by acknowledging that the wall is load-bearing.
