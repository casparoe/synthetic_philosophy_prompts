      *   **User's Intuition:** Something is off. Sensitivity to initial conditions $\neq$ a chain of necessary causes. The proverb might be doing too much work. The user distinguishes between "serial fragility" (single chain, no redundancy) and "swamping" (redundancy, equifinality).
      *   **Goal:** A menu of precise theses the proverb could express, ordered from trivial to radical. Evaluation of each (platitude, substantive, false). Analysis of which thesis supports the leader's argument and whether the proverb actually supports *that* thesis.

