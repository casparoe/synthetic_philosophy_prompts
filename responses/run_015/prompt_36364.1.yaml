  2. Consider general relativity in 1915, pursued despite lacking empirical anomalies because no viable relativistic alternative existed. Did the absence of a viable alternative constitute genuine evidence before the 1919 eclipse? Answering "yes, genuine evidence" routes to **non-empirical confirmation**; answering "no, merely heuristic" routes to **strict falsificationism**; answering "yes, but insufficient for belief" routes to **Bayesian skepticism**.

  3. Consider Bode's law, which displayed surprising internal unification of planetary orbits before being shown accidental. Does unexpected internal coherence count as evidence of truth even before empirical verification? Answering "yes, counts as evidence" routes to **non-empirical confirmation**; answering "no, aesthetic only" routes to **strict falsificationism**; answering "it counts but is unreliable" routes to **Bayesian skepticism**.

  4. Consider Hoyle's prediction of the carbon resonance, inferred from the requirement that carbon-based observers exist. Is reasoning from the necessity of our existence to the values of physical constants a valid form of scientific inference? Answering "yes, valid ordinary science" routes to **the anthropic optimist**; answering "no, unscientific teleology" routes to the other four positions.

  5. Consider quark confinement in lattice QCD, where confidence rested on theoretical structure while computations remained intractable for decades. Did this continued confidence constitute confirmation of the framework or merely research utility? Answering "confirmation" routes to **non-empirical confirmation**; answering "utility" routes to **pragmatism**. Note that this instrument cannot cleanly separate **pragmatism** from **Bayesian skepticism**, as both justify continued work without claiming strong empirical confirmation.
