      *   *Definition:* Can use cultural tools flawlessly but cannot generate/test own hypotheses (no Popperian capacity). If a tool doesn't exist for a situation, it freezes.
      *   *Dennett's View:* Dennett generally presents these as cumulative layers. A Gregorian creature *is* a Popperian creature equipped with cultural tools. The tools enhance the Popperian mechanism.
      *   *The Conflict:* The user asks if Gregorian is distinct or just scaled Popperian. If a creature lacks the Popperian engine (internal hypothesis testing), can it be Gregorian?
