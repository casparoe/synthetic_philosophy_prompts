      *   *Popperian:* Internal modeling. Trial and error happens in simulation (hypotheses die in their stead). Requires an internal environment to test actions.
      *   *Gregorian:* Cultural tools. Uses tools created by others to enhance the internal modeling. Language, maps, etc.

