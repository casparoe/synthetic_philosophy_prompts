  ### Setup & Materials
  **Whiteboard:** Public ledger (Player | Start | Net | End).
  **Chips:** 100 per player. Worthless points; status is the only reward.
  **Props:** Deck (Red/Black suits), Bag 1 (3 Red/1 Black), Bag 2 (1 Red/3 Black).
  **Core Rule:** Naming a single price $p$ on proposition $H$ obligates you to buy OR sell a $1 chip bet at $p$. The Instructor chooses the side.

  ### Timeline
  | Min | Activity |
  | :--- | :--- |
  | 0–5 | **Intro:** Chips = utility. Goal: Maximize chips. No real money. |
  | 5–25 | **Round 1 (Synchronic):** Price $P(Red)$ and $P(Black)$ for card draw. |
  | 25–45 | **Round 2 (Diachronic):** Bag chosen (A/B) hidden. Draw ball. *Pre-commit* update rule for $P(A \| Red)$. |
  | 45–60 | **Round 3 (Limits):** Price bets with Bid/Ask spread (e.g., Buy @ 0.4, Sell @ 0.6). |
  | 60–75 | **Debrief & Failure Modes.** |

  ### Payoff Scheme
  **Rounds 1 & 2:** If your prices violate probability axioms or conditionalization, the Instructor selects bet directions guaranteeing you lose chips regardless of outcome. Losses posted publicly.
  **Round 3:** No sure loss possible with spreads; ledger stays static.

  ### Debrief Map
  *   **Round 1 Loss:** Maps to **Normalization/Additivity**. You valued a sure thing at less than $1 or a contradiction at more than $0.
  *   **Round 2 Loss:** Maps to **Conditionalization**. Your update rule allowed a strategy (bet now + bet later) that drains chips regardless of evidence.
  *   **Round 3 Immunity:** Maps to the **Single Price** assumption. Incoherence isn't exploitable if you refuse two-way trade at one price.
  *   **The Nausea:** Point to the ledger. You chose these numbers. The loss was guaranteed by your own commitments, not bad luck.

  ### Predictable Failures
  *   **The Bookie:** A student tries to bet against classmates. **Fix:** Shut it down. "You are betting against the House only." We test *their* coherence, not gambling skill.
  *   **The Refuser:** Won't name prices. **Fix:** Acknowledge them in Round 3 debrief. They avoided the book by opting out of the "single price" commitment. This validates Round 3's lesson but excludes them from Round 1's lesson.

  ### Limitations (Must State Aloud)
  1.  **Pragmatic vs. Epistemic:** The game shows you lose *chips*, not that your beliefs are *false*. It proves inconsistency is costly, not inaccurate.
  2.  **Idealization:** Real agents have transaction costs (Round 3). The argument assumes you *must* post a single fair price.
  3.  **Forgotten Ledger:** As you noted, points vanish. The "nausea" is simulated. You must emphasize that real cognitive dissonance is the actual cost, not the chips.
  4.  **The "Why":** The game demonstrates *that* incoherence loses, not *why* rationality requires coherence. You must supply the normative bridge: if you hate sure loss, you must love coherence. The game cannot prove you should hate sure loss.
