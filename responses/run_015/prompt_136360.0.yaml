prompt: |-
  I serve on a municipal sustainability board that evaluates long-term infrastructure proposals—coastal defenses, soil-restoration bonds, and carbon-sequestration contracts—whose costs fall on present taxpayers but whose benefits unfold across 80 to 200 years. Our economic consultants deliver a single “social discount rate,” yet I have come to suspect that this figure smuggles together genuinely distinct considerations: the risk that future climate regimes or technologies will alter the value of the project; the expectation that future generations will be wealthier, lowering the marginal utility of the same benefit; and what is called pure time preference, the idea that a good is worth less solely because it arrives later, irrespective of risk or wealth. I need a reusable decision procedure my board can run on any proposal that forces these factors apart, tells us whether a proposed rate is justified by temporal distance alone, and flags exactly where empirical analysis ends and a normative judgment about intergenerational neutrality begins.

  Please construct the procedure as an ordered checklist or flowchart in words: the specific questions to ask about a proposal’s time profile and the source of each discount factor; what counts as a sufficient answer at each stage, including how to distinguish a growth-based or risk-based reduction from one that treats future welfare as intrinsically less important; the points at which the procedure stops with a clear recommendation to reject or revise a rate; and the explicit handoff moments where the remaining dispute is not factual but a value choice about whether it is permissible to weigh our grandchildren’s welfare lower just because they live later. Apply the procedure to two concrete cases we are weighing: a seawall whose protective benefits extend 120 years but depend on highly uncertain future sea-level trajectories and engineering standards, and a reforestation initiative with benefits spread over 150 years under conditions of relative climatic and economic stability. In each case, show where the procedure isolates pure time preference from other discounting grounds, and mark precisely where the board must make a normative decision that no formula can settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a municipal sustainability board.
      *   **Task:** Evaluate long-term infrastructure proposals (costs now, benefits 80-200 years later).
      *   **Problem:** Economic consultants provide a single "social discount rate" (SDR) that conflates distinct factors (risk, growth/wealth, pure time preference).
      *   **Goal:** A reusable decision procedure (checklist/flowchart in words) to disentangle these factors, justify the rate, distinguish empirical from normative judgments, and apply it to two specific cases (Seawall vs. Reforestation).
      *   **Key Requirements:**
          *   Ordered checklist/flowchart structure.
          *   Specific questions about time profile and discount sources.
          *   Criteria for sufficient answers.
          *   Distinction between growth/risk discounting vs. pure time preference.
          *   Stop points for rejection/revision.
          *   Explicit "handoff moments" where factual analysis ends and normative value choices begin (intergenerational neutrality).
          *   Application to two cases: Seawall (high uncertainty, 120 years) and Reforestation (stable, 150 years).
          *   Identification of where pure time preference is isolated and where normative decisions are required.

  2.  **Deconstruct the Social Discount Rate (SDR):**
      *   Standard Ramsey Formula: $r = \rho + \eta \cdot g$
          *   $r$: Social Discount Rate.
          *   $\rho$ (rho): Pure Rate of Time Preference (PRTP). This is the normative/ethical component (impatience, probability of extinction, pure myopia).
          *   $\eta$ (eta): Elasticity of Marginal Utility of Consumption (inequality aversion).
          *   $g$: Growth rate of per capita consumption.
          *   $\eta \cdot g$: The "wealth effect" (future people are richer, so an extra dollar matters less).
      *   Risk/Uncertainty: Often added as a premium or handled via expected value adjustments, but can be conflated with $\rho$.
      *   *The User's Insight:* They are correct. A single number hides $\rho$ (ethical), $\eta \cdot g$ (empirical/ethical mix), and Risk (empirical).

  3.  **Drafting the Decision Procedure (The "Intergenerational Discounting Protocol"):**
      *   *Structure:* Needs to be step-by-step, forcing separation of components.
      *   *Step 1: Decomposition.* Break the consultant's rate into components.
      *   *Step 2: Risk Assessment.* Is the discount due to project failure risk?
      *   *Step 3: Growth/Wealth Assessment.* Is the discount due to expected future wealth?
      *   *Step 4: Pure Time Preference Isolation.* What's left? This is the ethical core.
      *   *Step 5: Normative Handoff.* Explicitly state the ethical choice.
      *   *Step 6: Final Aggregation.* Recombine only if justified.

      *Refining the "Handoff":* The crucial moment is when the board asks, "Do we value a unit of welfare in 2124 less than in 2024 *just because* it is 2124?" If yes, that's $\rho > 0$. If no, $\rho = 0$. This is the normative cliff.

  4.  **Developing the Two Cases:**
      *   **Case A: Seawall.**
          *   Horizon: 120 years.
          *   Characteristics: High uncertainty (sea-level, engineering).
          *   Implication: High risk premium needed, but growth effect might be standard. Pure time preference should be scrutinized.
      *   **Case B: Reforestation.**
          *   Horizon: 150 years.
          *   Characteristics: Stable, biological growth, predictable.
          *   Implication: Low risk premium. Growth effect applies. Pure time preference is the main variable.

  5.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the board's insight (it's economically sophisticated).
      *   *The Protocol:* Use clear headings (Phase I, Phase II, etc.).
      *   *The "Handoff":* Make this visually distinct or explicitly labeled.
      *   *Application:* Walk through the protocol for both cases side-by-side or sequentially.
      *   *Conclusion:* Summarize the value of the procedure.

      *(Self-Correction during drafting)*: Make sure I don't get too bogged down in the math of the Ramsey formula. Keep it procedural for a *board*, not a PhD seminar. Focus on the *questions* they need to ask the consultants.
      *Key distinction:* Risk is project-specific. Growth is economy-wide. Pure Time Preference is ethical.
      *Stop Rule:* If the consultant cannot separate $\rho$ from risk, the rate is rejected.

  6.  **Refining the Normative "Handoff":**
      *   This needs to be the climax of the procedure.
      *   Question: "Is the remaining discount rate justified by a moral claim that future lives count less?"
      *   If the answer is "Yes," the board must vote on that moral claim explicitly.
      *   If the answer is "No," then $\rho$ must be set to zero (or near-zero, accounting for existential risk).

  7.  **Final Review against Constraints:**
      *   Ordered checklist/flowchart in words? Yes.
      *   Specific questions? Yes.
      *   Sufficient answers defined? Yes.
      *   Distinguish growth/risk vs. pure time preference? Yes.
      *   Stop points? Yes.
      *   Explicit handoff moments? Yes.
      *   Apply to Seawall and Reforestation? Yes.
      *   Mark where normative decision happens? Yes.

  8.  **Final Polish:** Ensure tone is professional, authoritative, and suitable for a municipal board context. (Avoid overly academic jargon where plain English works, but keep the economic concepts accurate). *Self-correction: Ensure the distinction between "risk of project failure" and "uncertainty about future valuation" is clear.*

      *(Detailed thought on the "Handoff"):* I need to make sure the user sees that *risk* and *growth* are arguably empirical (or at least technocratic), while *pure time preference* is purely ethical. The procedure must force the board to own the ethical part, not hide it behind a consultant's number.

      *(Detailed thought on the Cases)*:
      *   Seawall: High risk component. If the consultant puts high discount due to risk, that's empirical. If they put high discount due to time alone, that's normative.
      *   Reforestation: Low risk. Most discount will be Growth + Pure Time. This highlights the ethical choice more sharply.

      Let's assemble the response.

      *Structure:*
      1.  Preamble validating the user's suspicion.
      2.  The Protocol (The "Intergenerational Discounting Separation Protocol").
      3.  Application to Case 1 (Seawall).
      4.  Application to Case 2 (Reforestation).
      5.  Summary of the Normative Handoff.

      *Key Terminology:*
      *   $r$: Total Rate.
      *   $\delta_{risk}$: Risk/Obsolescence premium.
      *   $\delta_{growth}$: Wealth effect (elasticity * growth).
      *   $\rho$: Pure Time Preference.
      *   Equation: $r \approx \delta_{risk} + \delta_{growth} + \rho$.

      *Wait, one nuance:* In standard cost-benefit analysis, risk is often handled via probability-weighted benefits, not necessarily by inflating the discount rate (which can double-count risk). However, for this procedure, I will treat "risk adjustment" as a distinct bucket that the consultant must justify, whether via rate adjustment or scenario analysis, to ensure it isn't hiding $\rho$. I will frame it as "Risk & Obsolescence Adjustment."

      *Let's write.*
answer: |-
  ### The Intergenerational Discounting Separation Protocol (IDSP)

  **Purpose:** To decompose a single Social Discount Rate (SDR) into its empirical and normative components, ensuring that no ethical judgment about the value of future lives is hidden within technical assumptions about risk or economic growth.

  **Instructions:** The Board shall not vote on a proposal's Net Present Value (NPV) until the Economic Consultants have completed this checklist. If Consultants cannot provide the required separations, the proposed discount rate is procedurally invalid.

  ---

  #### Phase I: Decomposition of the Rate
  *Goal: Break the single percentage figure into three distinct buckets.*

  **Step 1.1: Request the Component Breakdown**
  *   **Question to Consultants:** "Provide the proposed discount rate ($r$) as a sum of three distinct components: (1) Risk & Obsolescence Premium ($\delta_{risk}$), (2) Wealth Effect Adjustment ($\delta_{growth}$), and (3) Pure Time Preference ($\rho$)."
  *   **Required Output:** $r = \delta_{risk} + \delta_{growth} + \rho$.
  *   **Sufficient Answer:** A table showing the percentage contribution of each component.
  *   **Stop Rule:** If Consultants provide only a single aggregate number without this breakdown, **reject the analysis** and request revision.

  **Step 1.2: Verify the Risk Premium ($\delta_{risk}$)**
  *   **Question:** "What specific probability of project failure, technological obsolescence, or climate regime shift justifies this percentage?"
  *   **Distinction:** This factor discounts benefits because they might *not happen* or might be *superseded* by better technology, not because they happen later.
  *   **Sufficient Answer:** Empirical data on failure rates of similar infrastructure, or scenario analysis showing probability-weighted outcomes.
  *   **Stop Rule:** If the risk premium exceeds the probability of total project failure or obsolescence, **flag for revision**. Risk cannot exceed 100% of the value.

  #### Phase II: The Empirical Handoff (Growth & Wealth)
  *Goal: Validate the assumption that future generations will be richer and value marginal benefits less.*

  **Step 2.1: Validate the Growth Assumption ($\delta_{growth}$)**
  *   **Question:** "What is the projected per-capita consumption growth rate ($g$) and the elasticity of marginal utility ($\eta$) used to derive this component?"
  *   **Distinction:** This factor discounts benefits because future people are assumed to be wealthier, making an additional dollar of benefit less valuable to them than to us (diminishing marginal utility).
  *   **Sufficient Answer:** Reference to long-term economic forecasts and a stated ethical choice on inequality aversion ($\eta$).
  *   **Stop Rule:** If the projection assumes indefinite exponential growth beyond ecological carrying capacity without qualification, **flag for revision**.

  **Step 2.2: Isolate the Residual ($\rho$)**
  *   **Action:** Subtract $\delta_{risk}$ and $\delta_{growth}$ from the total rate $r$. The remainder is $\rho$ (Pure Time Preference).
  *   **Definition:** This is the rate at which welfare is discounted *solely* because it occurs in the future, assuming the recipient is equally wealthy and the benefit is certain.

  #### Phase III: The Normative Handoff (Pure Time Preference)
  *Goal: Explicitly identify the ethical judgment required. No formula can settle this.*

  **Step 3.1: The Intergenerational Neutrality Test**
  *   **Question to the Board:** "Does the remaining $\rho$ imply that a unit of welfare experienced by a person in 2124 is intrinsically less valuable than the same unit experienced by a person in 2024, solely due to the date?"
  *   **The Fork:**
      *   **Option A (Neutrality):** $\rho = 0$ (or near-zero, accounting only for existential extinction risk). We treat future generations as moral equals.
      *   **Option B (Prioritization):** $\rho > 0$. We assert a moral right to prioritize current welfare over future welfare simply because we are here now.
  *   **Sufficient Answer:** A recorded vote or policy statement explicitly adopting Option A or Option B.
  *   **Normative Handoff Point:** **This is the boundary where empirical analysis ends.** Consultants cannot justify $\rho$; only the Board can. If the Consultants have included a non-zero $\rho$ without this Board vote, the rate is **invalid**.

  **Step 3.2: Final Aggregation**
  *   **Action:** Recombine the validated components.
  *   **Condition:** The final rate used for NPV calculation must reflect the Board's explicit choice in Step 3.1.

  ---

  ### Application to Concrete Cases

  Below is the application of the IDSP to the two proposals currently before the Board.

  #### Case 1: The Coastal Seawall (120-Year Horizon)
  *Characteristics: High uncertainty regarding sea-level rise (SLR) and engineering lifespan.*

  | Protocol Step | Seawall Analysis | Status |
  | :--- | :--- | :--- |
  | **1.1 Decomposition** | Consultant proposes 4.5% total rate. Breakdown requested. | **Pending** |
  | **1.2 Risk ($\delta_{risk}$)** | Consultant attributes 2.5% to risk of SLR exceeding design specs or new tech making the wall obsolete. | **Empirical.** Requires probability models on SLR trajectories. If SLR uncertainty is high, this component is justified *empirically*. |
  | **2.1 Growth ($\delta_{growth}$)** | Consultant attributes 1.5% to expected economic growth (future taxpayers wealthier). | **Empirical/Ethical Mix.** Requires validation of long-term growth forecasts. |
  | **2.2 Isolate $\rho$** | Remaining 0.5% is attributed to "time preference." | **Normative.** |
  | **3.1 Neutrality Test** | **Board Question:** "Do we value the safety of a resident in 2144 at 99.5% of a resident in 2024 simply because of the date?" | **HANDOFF MOMENT.** |
  | **3.2 Decision** | If Board chooses Intergenerational Neutrality, $\rho$ drops to ~0%. Total rate becomes 4.0%. If Board accepts Prioritization, rate stays 4.5%. | **Normative Decision.** |

  **Analysis of Case 1:**
  *   **Isolation of Pure Time Preference:** The procedure isolates the 0.5% $\rho$ from the 2.5% risk premium.
  *   **The Trap:** Without this protocol, the Board might accept the 4.5% rate, unknowingly accepting that future safety is worth less *intrinsically*, when in fact the lower value should be due entirely to the *risk* the wall fails (the 2.5%).
  *   **Normative Decision Point:** Step 3.1. The Board must decide if the 0.5% "impatience" is ethically permissible. The consultants cannot answer this.

  #### Case 2: Reforestation Initiative (150-Year Horizon)
  *Characteristics: Biological growth, stable climate impact, low technological obsolescence risk.*

  | Protocol Step | Reforestation Analysis | Status |
  | :--- | :--- | :--- |
  | **1.1 Decomposition** | Consultant proposes 3.5% total rate. Breakdown requested. | **Pending** |
  | **1.2 Risk ($\delta_{risk}$)** | Consultant attributes 0.5% to risk (fire, disease, land use change). | **Empirical.** Low risk profile justified by biological stability. |
  | **2.1 Growth ($\delta_{growth}$)** | Consultant attributes 2.5% to expected economic growth. | **Empirical/Ethical Mix.** Assumes future society values carbon sequestration less because they are richer. |
  | **2.2 Isolate $\rho$** | Remaining 0.5% is attributed to "time preference." | **Normative.** |
  | **3.1 Neutrality Test** | **Board Question:** "Do we value the carbon sequestration benefit in 2174 less than today solely because it is 2174?" | **HANDOFF MOMENT.** |
  | **3.2 Decision** | If Board chooses Intergenerational Neutrality, $\rho$ drops to ~0%. Total rate becomes 3.0%. | **Normative Decision.** |

  **Analysis of Case 2:**
  *   **Isolation of Pure Time Preference:** Here, the risk component is small (0.5%). The bulk of the discounting comes from Growth (2.5%) and Pure Time (0.5%).
  *   **The Trap:** In stable projects, the "Pure Time Preference" is often the silent killer of long-term value. Because the risk is low, a standard discount rate relies heavily on $\rho$.
  *   **Normative Decision Point:** Step 3.1. Because the project is stable, the Board's decision on $\rho$ has a larger proportional impact on the NPV than in the Seawall case. A decision to set $\rho = 0$ significantly increases the viability of this project compared to the Seawall.

  ---

  ### Summary of the Normative Handoff

  The procedure forces the Board to recognize that **Phase III (Step 3.1)** is not an economic calculation. It is a legislative and ethical declaration.

  1.  **Where Empirical Analysis Ends:** At the conclusion of Step 2.1. Once risk probabilities and growth forecasts are set, any remaining discount rate is purely a statement of moral philosophy.
  2.  **Where the Value Choice Begins:** At Step 3.1. The Board must explicitly answer: *"Is it permissible to weigh our grandchildren's welfare lower just because they live later?"*
      *   If the answer is **No**, $\rho$ must be set to zero (adjusted only for the probability of human extinction).
      *   If the answer is **Yes**, the Board must publicly state the degree of discrimination against future generations they are willing to encode into municipal law.

  **Recommendation:** Adopt the IDSP immediately. Require consultants to submit the "Component Breakdown Table" (Step 1.1) with all future cost-benefit analyses. Schedule a dedicated policy vote to establish the Municipality's default stance on Pure Time Preference ($\rho$) so that this normative choice is consistent across all proposals, rather than decided ad-hoc by consultants.
