      *   *User's Gut:* "No legal right" = Void.
      *   *My Principle:* If the partner didn't cause the belief, it's hard to call it coercion. *However*, I can argue that consent requires *freedom*, and a false belief about freedom negates freedom. But who bears the cost? I will suggest that for consent to be robust, the partner must not *exploit* known ignorance of rights. If they don't know? That's the sacrifice. I'll advise the user that their gut on this might require a "Duty to Correct" which is strong.
      *   *User's Gut:* "Unspoken Fear" = ?
