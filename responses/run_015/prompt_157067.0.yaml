      *   *Researcher:* Authority figure responsible for truth in the experimental contract. (Fits Clause 2).
      *   *Dementia:* Prior autonomy counts *unless* it violates contemporaneous refusal (Clause 1 trumps prior directive on refusal).
      *   *Framing:* Not a lie, just rhetoric. (Fits Clause 2).

      *   *The "No Legal Right" Case:* This is a false belief about constraints. If the partner didn't create it, is it void? User says void. My principle might struggle here unless I argue that a "voluntary" choice requires accurate knowledge of *rights*, not just facts. I should probably concede this is a tension point. Actually, if I frame it as "freedom from normative constraints," a false belief acts like a constraint. But is the partner responsible? I will suggest that if the partner knows of the belief and doesn't correct it, it becomes deception by omission (Clause 2).
      *   *Fear of Violence:* If the partner knows or should know, it's coercion (Clause 3). If purely internal and unpredictable, it's tragic but valid consent (hard pill to swallow). I need to be honest here.

  9.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the difficulty. Validate the "trenchcoat" fear.
      *   **The Proposed Principle:** "The Principle of Responsible Autonomy." Break it down into 3 Clauses.
      *   **Mapping the Cases:** Show how the clauses handle the user's list.
