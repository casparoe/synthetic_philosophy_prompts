  3.  **Identify the Underlying Tension:**
      The user is struggling between *Subjective Will* (what did the person actually want/understand?) and *Normative Boundaries* (what is the other person responsible for ensuring?).
      *   *Example:* The racist omission vs. HIV lie. Both change the decision. Why is one void and one valid? Because the HIV status imposes a *risk* the other party is responsible for disclosing, whereas the racist's prejudice is their own internal burden.
      *   *Example:* Prison guard food vs. Promotion. Both are "offers" improving the situation. Why is one coerced? Because the guard controls *basic needs* within an institution, creating a structural coercion, whereas a boss offering a promotion is usually seen as a bonus.
      *   *Example:* Dementia advance directive (accept) vs. (refuse). Why accept the first but not the second? Because consent requires *ongoing* alignment, whereas refusal is a hard stop.

