      *   Deception steals control of the *content* of the decision.
      *   Coercion steals control of the *context* of the decision.
      *   Competence is about the *mechanism* of the decision.

      *Revised Principle:* **The Principle of Responsible Autonomy.**
      Consent is valid if and only if:
      1.  (Mechanism) The agent has sufficient cognitive capacity and volitional control at the time.
      2.  (Content) The agent's understanding of the act's physical nature, risks, and partner identity is accurate regarding facts the partner is responsible for disclosing.
      3.  (Context) The agent's choice is not made under a threat of wrongful harm or an offer that exploits a vulnerability the partner controls or created.

  8.  **Evaluating the User's Specific Conflicts:**
      *   *Racist Omission:* Partner isn't responsible for the agent's internal prejudices. (Fits Clause 2).
