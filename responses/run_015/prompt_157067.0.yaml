      *   *The Researcher Case:* This is tricky. If the lie makes the subject *safer* (active drug vs placebo), why void? Because it undermines the *process* of informed consent which is procedural, not just outcome-based. I need to make sure the principle captures procedural integrity.
      *   *The "No Legal Right" Case:* If someone thinks they can't refuse, their will is constrained by a false belief. Is the other party responsible? If the other party fostered that belief, yes. If it's a general societal misunderstanding? This is hard. I should probably lean towards voiding it because the "voluntariness" is compromised by a false constraint, even if not imposed by the partner. *Wait, user says gut says void.* Okay, I need to support that.
      *   *Fear of Violence (Unspoken):* If the fear is reasonable based on context, it's coercion. If it's purely internal phobia unknown to the partner, it's harder. I will argue it depends on *reasonableness* and *contextual cues*.

  6.  **Developing the New Cases:**
      *   *Dark Patterns (App Interface):* This is structural coercion/manipulation. It increases the "cost" of saying no. Verdict: Void/Invalid. It violates the ease of refusal.
      *   *Surgeon Switching Techniques:* If equally good and standard of care? Valid (implied consent to professional judgment). If experimental or different risk profile? Void (Deception on Nature/Risk).

  7.  **Refining the Principle (The "Trenchcoat" Check):**
      Is this just four principles?
      1.  Capacity.
      2.  Disclosure (Deception).
