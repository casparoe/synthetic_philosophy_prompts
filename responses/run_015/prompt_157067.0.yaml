answer: |-
  This is a classic problem in normative ethics: you have a set of considered judgments (your "gut verdicts") and you are looking for a reflective equilibrium. Your intuition is sharp, but it is currently a collection of distinct moral modules (deception, coercion, capacity) that don't share a single engine.

  You are right to worry about the "trenchcoat." If we just stitch together rules for lies, threats, and drunk people, we haven't found a theory of consent; we've just made a checklist.

  To unify this, we need to move away from "Did they say yes?" and toward "Did they have **Normative Control**?" Consent is not just a mental state; it is a transfer of authority over a boundary. That transfer is only valid if the person transferring it holds the title deed freely, knows what property they are selling, and isn't being held at gunpoint.

  Here is a proposed principle, **The Principle of Responsible Autonomy**, designed to capture your verdicts while exposing the tensions you need to resolve.

  ### The Principle of Responsible Autonomy

  **Consent is valid if and only if the agent's authorization satisfies three conditions:**

  1.  **The Capacity Condition:** The agent possesses sufficient cognitive integration and volitional control *at the time of the act* to understand the nature of the transaction and align it with their values.
      *   *Motivating Case:* **Blackout vs. Tipsy.** (Blackout fails integration; Tipsy passes).
      *   *Motivating Case:* **Dementia Advance Directive.** (Prior autonomy extends capacity *unless* it conflicts with contemporaneous refusal).
  2.  **The Integrity Condition:** The agent's understanding of the act's physical nature, material risks, and partner identity is accurate regarding facts the partner is **responsible for disclosing**.
      *   *Motivating Case:* **HIV/Condom Removal.** (Partner is responsible for bodily risks and conditions of touch).
      *   *Motivating Case:* **Fake Clinician.** (Partner is responsible for role/identity relevant to the act).
      *   *Motivating Case:* **Researcher Placebo Lie.** (Authority figures are responsible for the structural truth of the agreement, regardless of outcome benefit).
      *   *Exclusion:* **Marital Status / "I Love You."** (Motivation and external status are not the partner's responsibility to police).
      *   *Exclusion:* **Racist Omission.** (The agent's internal prejudices are not facts the partner is responsible for correcting).
  3.  **The Sovereignty Condition:** The agent's choice is not made under a threat of wrongful harm, nor an offer that exploits a vulnerability the partner **controls or created**.
      *   *Motivating Case:* **Fire vs. Promote.** (Threatening wrongful harm vs. Offering a bonus).
      *   *Motivating Case:* **Prison Guard (Food).** (Exploiting institutional control over basic needs).
      *   *Motivating Case:* **Desert Driver.** (Valid if background condition; Void if driver created the stranding).
      *   *Motivating Case:* **Third Party Blackmail.** (The will is constrained, rendering the authorization invalid regardless of the partner's knowledge).

  ---

  ### Applying the Principle to Your New Cases

  **1. The Deliberately Annoying App Interface (Dark Patterns)**
  *   **Verdict:** **Void.**
  *   **Reasoning:** This violates the **Sovereignty Condition**. By designing an interface where "No" requires eleven clicks and "Yes" requires one, the designer is artificially inflating the cost of refusal. This is structurally equivalent to a mild coercion; it manipulates the *context* of the decision to steer the will. It is an exploitation of cognitive vulnerability (friction) that the designer created.

  **2. The Surgeon Switching Techniques**
  *   **Verdict:** **It depends on "Material Risk."**
  *   **Reasoning:** This falls under the **Integrity Condition**.
      *   If the technique is standard of care, equally effective, and carries the same risk profile: **Valid.** (You consented to the *outcome* and the *professional judgment*).
      *   If the technique is experimental, carries different risks, or changes the nature of the recovery: **Void.** (This is a lie about the *nature of the act* and *risks imposed on the body*, similar to the condom case).

  ---

  ### Addressing Your Undecided Cases

  Here is where the principle forces you to make a choice. Your gut is wavering because these cases test the limits of "Responsibility."

  **1. The Friend Who Feared Violence (Unspoken)**
  *   **Principle Verdict:** **Valid, *unless* the fear was reasonable based on context.**
  *   **Analysis:** If the partner gave no cues, has no history of violence, and a "reasonable person" would not have feared violence, the **Sovereignty Condition** is not violated *by the partner*. The constraint is internal to the victim.
  *   **The Hard Truth:** To hold this consent invalid imposes a duty on partners to mind-read. However, if the context *was* threatening (e.g., late night, isolated, prior aggression), then the partner *is* responsible for the climate of fear, and it is Void.
  *   **Recommendation:** Adopt a **Reasonableness Standard**. If the fear was objectively reasonable given the context, it counts as coercion. If it was purely idiosyncratic and unknowable, it is tragic, but the consent stands.

  **2. The "No Legal Right to Refuse" Belief**
  *   **Principle Verdict:** **Void, *if* the partner knows (or should know) of the belief.**
  *   **Analysis:** This is a deception by omission regarding the **Sovereignty Condition**. If I know you believe you are legally bound to sleep with me, and I do not correct you, I am exploiting a false constraint on your freedom.
  *   **The Sacrifice:** If the partner *does not know* and has no reason to know you hold this false belief, my principle suggests the consent is **Valid**. The partner cannot be responsible for your internal legal misconceptions.
  *   **Recommendation:** Your gut says Void. To keep that verdict, you must add a **"Duty to Correct"** clause to the Integrity Condition: *Partners are responsible for correcting known misconceptions about the right to refuse.*

  ---

  ### The Sacrifices (Where the Principle Disagrees with Your Gut)

  You asked for honesty about which verdicts you might have to drop. Here are the two friction points where the *Principle of Responsible Autonomy* clashes with your intuitions or creates tension.

  **1. The "Framing" Case (90% Survival vs. 10% Mortality)**
  *   **Your Gut:** Valid (even if manipulative).
  *   **The Principle:** Valid.
  *   **The Tension:** You noted this "feels like it should matter." The principle agrees with your gut verdict but validates the manipulation. If you want to void this, you must expand the **Integrity Condition** to include "Psychological Manipulation," not just factual lies.
  *   **Cost:** This risks voiding almost all persuasion (e.g., "You'll look great in this" vs. "This is expensive").
  *   **Advice:** Keep your gut verdict. Distinguish between *framing facts* (allowed) and *fabricating facts* (void).

  **2. The "Drunk, Coherent, Regret" Case**
  *   **Your Gut:** Valid (but uneasy).
  *   **The Principle:** Valid.
  *   **The Tension:** You are uneasy because capacity is a spectrum. The principle draws a bright line at "cognitive integration."
  *   **Advice:** Hold the line here. If we void consent based on *future regret* or *sober hypotheticals*, we undermine the agency of the intoxicated person at the time *t*. The sacrifice you must make is accepting that some "Valid" consents will feel morally regrettable later. Validity $\neq$ Good Decision.

  **3. The "Racist Omission" vs. "HIV Lie"**
  *   **Your Gut:** Racism = Valid; HIV = Void.
  *   **The Principle:** Supports this distinction via **Responsibility**.
  *   **Why it works:** HIV status imposes a *physical risk* on the other person (their body). Racism is an *internal preference* of the consent-giver (their mind). The partner is responsible for the safety of the act, not the satisfaction of the agent's prejudices.
  *   **Advice:** This is the strongest part of your intuition. Do not drop it. It anchors the difference between "Deception about the Act" vs. "Deception about the Motivation."

  ### Summary for Your Reading Group

  If you present this, I suggest framing consent not as a "Yes," but as a **Transfer of Authority**.

  1.  **Authority requires a Mind:** (Capacity).
  2.  **Authority requires Truth:** (Integrity/Deception).
  3.  **Authority requires Freedom:** (Sovereignty/Coercion).

  **The One Thing You Must Give Up:**
  You likely have to give up the idea that *any* lie voids consent. Your own verdicts (Marital status, "I love you") prove you already know this. The principle clarifies *why*: Consent is voided only when the lie concerns a fact the partner is **normatively responsible** for (risks, identity, nature of act).

  **The One Thing You Must Add:**
  You need to address the **"Innocent Partner"** problem in the Third Party Blackmail and "No Legal Right" cases.
  *   *Verdict:* The consent is **Void** (the agent didn't truly authorize it), but the partner may not be **Culpable** (they didn't know).
  *   *Distinction:* Separate the *validity of the consent* (was the will free?) from the *blameworthiness of the partner* (did they violate the principle?). This allows you to say "She didn't consent" without necessarily saying "He is a rapist" if he was genuinely unaware of the blackmail or legal misconception. This preserves your gut verdicts while protecting innocent partners.

  This framework accommodates 90% of your cases, explains the new ones, and isolates the remaining 10% (unreasonable fear, unknown legal misconceptions) as places where you must choose between protecting the vulnerable or protecting the ignorant partner.
