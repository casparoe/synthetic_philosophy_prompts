      *   *The "Framing" Case:* 90% survival vs 10% mortality. User says Valid. My principle supports this (Truthful framing isn't deception).

      *   *The "Racist" Case:* User says Valid. My principle supports this (Internal prejudice isn't partner's responsibility).

      *   *The "Prison Food" Case:* User says Coerced. My principle supports this (Institutional control of needs).

