      Subject: Recommendation on Default Protein Contract

      The Food Values Committee recommends adopting Option D (plant-forward default, meat opt-in) for the next dining contract. We propose this as the immediate default for the upcoming academic year, subject to a two-semester pilot review. This recommendation navigates the conflicting metrics of animal welfare, land use, and financial reality without deferring the decision.

      **Metrics and Ranking Flips**
      We adopt direct animal slaughter per serving as our primary metric, with land use efficiency as secondary. This choice is dictated partly by ethics and partly by the alum fund sustaining our sustainability coordinator, which will not renew if animals killed per meal rise. Under slaughter counts, Option D is best (0 animals), Options A and C are tied (0.5 animals), and Option B is worst (70 animals). However, the ranking flips under land use. Per 1000 servings, Option D requires the least land (0.08 acre-years), followed by B (0.3), A (1.5), and C (3.0). 

      Regarding wild vertebrates and insects, we cannot settle whether a field mouse's life is net positive or negative. However, Option D is defensible under either assumption because it minimizes the total acreage of disturbance. Whether we are saving lives or preventing suffering, reducing the footprint reduces the magnitude of the impact. Option C, while local, requires converting row crop to pasture; since hay cutting kills voles and displaced soy production causes deaths elsewhere, it offers no clear welfare advantage over D while consuming significantly more land.

      **Substitution and Leakage**
      We acknowledge the table is not the world. Last spring's trial removing beef showed 55% of meals shifted to chicken and hall attendance dropped 20%, with students driving to Route 9 for burgers. This leakage means the paper difference in harm reduction is not the realized difference. Option D accounts for this by treating the default as a nudge rather than a ban. Meat remains available opt-in. We reject Option B entirely due to the funding threat. We reject Option C because the leakage on soy production (0.8 acres returned elsewhere per acre converted) means row-crop deaths move rather than vanish, while the land cost is prohibitive for our scale.

      **The Case Against Option D**
      The strongest argument against this recommendation is that it mistakes institutional signaling for actual harm reduction. If a plant-default drives students to drive off-campus for beef, we may increase net suffering and carbon emissions without reducing animal slaughter. The moral purity of the dining hall could become a license for greater harm outside it, rendering the policy performative rather than effective. Furthermore, restricting default protein may disproportionately affect food-insecure students who rely on the hall for caloric density, trading ethical abstraction for student welfare. If the opt-in process creates friction or stigma, the policy fails its own ethical test by burdening the most vulnerable students to soothe the conscience of the administration.

      **Implementation and Reversal Conditions**
      The Board should vote to authorize Option D as the default effective August 1st. We will run a two-semester pilot during the Fall and Spring terms. We will measure: (1) daily dining hall attendance compared to the previous year's baseline, and (2) student self-reported off-campus meat consumption via monthly randomized surveys. We will reverse course to Option A if attendance drops sustainedly by more than 15% for four consecutive weeks, or if survey data indicates off-campus meat consumption rises by more than 30% relative to the control group. A final review will occur by May 1st before contract renewal.

      This path respects our funding constraints, minimizes direct killing, and remains responsive to actual student behavior.

