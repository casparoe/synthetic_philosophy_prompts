      We recommend adopting Option D (plant-forward default, meat opt-in) for the next dining contract, effective next academic year. This decision balances ethical consistency, financial constraints, and ecological impact while acknowledging the limits of institutional control over student behavior.

      **Metric and Rankings**
      Our primary metric is direct animal slaughter per serving; our secondary is land use efficiency. Under slaughter counts, D ranks best (0), followed by A and C (0.5), with B worst (70). Under land use (acre-years per 1000 servings), the ranking flips: D is best (0.08), followed by B (0.3), A (1.5), and C worst (3.0). We prioritize slaughter counts because the alum fund sustaining our sustainability coordinator will not renew if animal killings per meal rise, effectively vetoing B. Between A, C, and D, D minimizes land use, reducing collateral wild animal disturbance regardless of whether those lives are net positive or negative.

