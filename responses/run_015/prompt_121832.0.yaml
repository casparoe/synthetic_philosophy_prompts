      *   *The "Experience" Reality:* Empirical data shows 11 happens more than 12.
      *   *Bertrand's Resolution:* "Les cas que l'on dénombre ne sont pas pareils" (The cases we count are not alike/equal).
      *   *Example:* (4,4,4) is 1 way. (4,5,2) is 6 ways (permutations: 4-5-2, 4-2-5, 5-4-2, 5-2-4, 2-4-5, 2-5-4).
      *   *Galileo's Count:* 27 ways for 11, 25 ways for 12. (Wait, let me verify the counts mentally.
          *   Sum 11:
