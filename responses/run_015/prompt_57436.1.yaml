  *   **Option 2:** Pay a binder $\$0.02$ today to remove Option C from her choice set tomorrow. Tomorrow she chooses A over B, keeps A. Loss $\$0.02$.
  *   **Verdict:** Rationality requires taking Option 2.
  *   **Why Diagnostic:** It tests whether rationality is about the *current preference structure* or the *management of future dispositions*. If she refuses the binder, she is irrational *now*, even though the loss happens *later*. This supports assessing **Policies** over **Acts**.

