  ### 1. The Principle and the Object of Assessment

  **Object of Assessment:** **Conditional Betting Policies.**
  You asked whether we assess credences, preferences, or acts. Cases 1 and 5 demonstrate that individual acts can be locally optimal while globally defective, and Case 5 (high fees) shows that preferences can be defective while acts are safe. The only stable object is the **Policy**: a complete rule specifying which bets an agent accepts or rejects in every possible state of information they might occupy.

  **The Principle: Ex-Ante Policy Dominance**
  A betting policy $P$ is irrational if and only if there exists an alternative policy $P'$ such that:
  1.  **Availability:** $P'$ was cognitively and practically available to the agent at the time of planning (before receiving private evidence).
  2.  **Dominance:** $P'$ yields a strictly better outcome than $P$ in terms of the agent's own goals. This takes two forms:
      *   **Strong Dominance (Sure Loss):** $P'$ leaves the agent with more money in *every* possible world the agent assigns nonzero credence to. (Handles Cases 1, 5-low-fee, Standing Agreement).
      *   **Weak Dominance (Expected Loss):** $P'$ has higher Expected Utility than $P$, calculated using the agent's *prior* credence function before receiving new evidence. (Handles Cases 2, 4).
  3.  **Informational Symmetry:** The comparison assumes the bookie does not utilize information about the specific outcome that the agent could not have anticipated or assigned a prior probability to. (Handles Case 7).

