answer: |-
  ### Q&A Prep Sheet: Global Risk-Weighting

  #### **Opening Concessions (First 2 Minutes)**
  *Do not wait for these to be asked. State them early to inoculate the sympathizers and signal realism to the hardliners.*

  1.  **On Novelty:** "I am not claiming the distinction between local and global risk-weighting is new. Lara Buchak and others have mapped this space. My claim is narrower: that for sequential rationality, the global application isn't just an option, it's a *requirement* to avoid diachronic exploitation."
  2.  **On Computation:** "I concede this is computationally heavier than node-by-node EU. I am not offering a heuristic for everyday choices; I am offering a normative standard for high-stakes policy. If you need a fast heuristic, local EU is a better approximation than local RWEU."
  3.  **On Resoluteness:** "This view requires the agent to be 'resolute'—to stick to the plan even when local incentives shift. I am not solving the psychological problem of willpower; I am arguing that if you *can* commit, this is the rational commitment to make."

  ---

  #### **The Single Must-Land Reply**
  *If this answer fails, the theory is dead in this room. The Hardline EU crowd will smell blood.*

  **Objection:** "If you don't maximize expected utility at every node, you're dynamically inconsistent. I can construct a money pump where you pay to enter a gamble, then pay to exit it at the next node. You're just describing a precommitment device, not a rational agent."

  **Reply:** "You're describing a money pump for an agent who *re-evaluates* their risk function at every node. My agent doesn't do that. They evaluate the risk function once, against the total distribution of the policy, at the start. When they reach the second node, they aren't facing a new gamble; they are executing a step of the original plan. The 'cost' to exit isn't a loss of utility, it's a violation of the policy that was already risk-adjusted. If you have the capacity to precommit, the money pump disappears. The only 'pump' left is the cost of the precommitment itself, which is just the price of rationality."

  **Soft Spot:** This relies entirely on the agent's ability to bind their future self. If the room presses on *how* you bind yourself without external enforcement, you have to admit this is a theory of ideal agency, not human psychology.

  ---

  #### **The 8 Objections (Ordered by Expected Damage)**

  **1. The Epistemic Wall**
  * **Likelihood:** High | **Severity:** High
  * **The Question:** "To apply risk-weighting to the *total* utility of a policy, I need the probability distribution of my entire future. I don't know that. I barely know the distribution of the next decision. Isn't this normatively useless because it's computationally impossible?"
  * **The Reply:** "It's harder, but not impossible in principle. You already construct priors over long-term outcomes for longtermist cause prioritization. The difference is you're currently plugging those priors into an EU calculator. I'm saying plug them into a risk-weighted one. You don't need perfect knowledge; you need a credence distribution. If your uncertainty is too high for global risk-weighting, it was also too high for the precise EU calculations you're currently using to justify x-risk work."
  * **Soft Spot:** You are hand-waving the complexity. Calculating the variance of a lifetime policy is orders of magnitude harder than local expected value. If they press on the *precision* required for the risk function $r(p)$ to matter, you might have to concede this is only for 'macro' decisions.

  **2. The Longtermist Block**
  * **Likelihood:** High | **Severity:** High
  * **The Question:** "I work on existential risk. The probabilities are tiny, the stakes are astronomical. If you risk-weight the aggregate, you're going to dampen the value of those low-probability interventions. Are you telling this room that saving the future is irrational because of risk aversion?"
  * **The Reply:** "I'm telling you that 'fanaticism'—accepting arbitrarily low probabilities for arbitrarily high stakes—is a bug of linear EU, not a feature of rationality. My view allows you to take high-variance bets *if* they fit the portfolio. But it stops you from betting the whole farm on a 1-in-a-billion shot. If your strategy relies on ignoring risk aversion at the global level, you're relying on a mathematical artifact, not a robust decision rule."
  * **Soft Spot:** This is a values clash. If the room believes 'maximize expected lives saved' is a moral imperative, your 'rationality' looks like moral cowardice. You cannot win this on math alone.

  **3. The Reinvention Accusation**
  * **Likelihood:** Medium | **Severity:** Medium
  * **The Question:** "Buchak's *Risk and Rationality* already distinguishes global from local weighting. You're presenting a constraint on her framework as a new discovery. Why shouldn't I just read her chapter 6 and skip the rest?"
  * **The Reply:** "Buchak treats global weighting as one permissible option among others. I'm arguing it's the *only* one that survives sequential scrutiny without ad-hoc patches. She builds a taxonomy; I'm building a engine. If you use her local weighting, you get the pathologies I described. I'm claiming the taxonomy collapses to a single point if you want plan stability."
  * **Soft Spot:** If you haven't read Chapter 6 closely, they will catch you. Ensure you know exactly where her 'global' definition differs from your 'policy' definition.

  **4. The Kelly Alternative**
  * **Likelihood:** Medium | **Severity:** Medium
  * **The Question:** "I'm in the growth-rate camp. If I maximize geometric growth over time, I get the same portfolio effects you describe without needing a risk-function parameter. Why add the complexity of $r(p)$ when log-utility does the job?"
  * **The Reply:** "Kelly assumes repeated, identical bets. Life isn't i.i.d. You don't get the same gamble every year. Risk-weighting works on unique, non-repeatable policies where 'long run' doesn't mean 'infinite trials,' it means 'whole life.' Kelly is a special case of my view where the risk function happens to match log-utility. I'm giving you the general case."
  * **Soft Spot:** Kelly proponents think utility functions are subjective fluff. They may reject the premise that $r(p)$ exists at all.

  **5. The Grantmaker's Dilemma**
  * **Likelihood:** Medium | **Severity:** Medium
  * **The Question:** "I manage a portfolio of grants. Does this mean I should fund one safe project and one moonshot? Or does it mean I should fund ten safe projects? Give me an allocation rule."
  * **The Reply:** "It means you treat your budget as a single policy, not a stack of independent decisions. You calculate the risk profile of the *whole* budget. If your safe projects already secure your baseline goals, your risk function on the marginal dollar becomes more tolerant. So: secure the baseline first, then use the remaining variance budget for moonshots. Don't mix them at the project level; mix them at the portfolio level."
  * **Soft Spot:** This is vague. They want a formula. You don't have one.

  **6. The Separability Problem**
  * **Likelihood:** Low | **Severity:** Medium
  * **The Question:** "If I make a decision today, do I have to re-evaluate my entire life plan? If I buy a coffee, does that change the risk-weighting of my career choice? This violates separability."
  * **The Reply:** "It violates *separability*, yes, but that's the point. Your risk capacity depends on your total assets. If you lose your house, you shouldn't take the same career risks as if you kept it. Decisions are causally linked by your resource pool. Ignoring that link is what causes the sequential pathology."
  * **Soft Spot:** This makes every small decision computationally dependent on every other decision. It's a heavy bullet to bite.

  **7. The Whose Risk Question**
  * **Likelihood:** Low | **Severity:** High
  * **The Question:** "When I'm spending donor money to save lives, whose risk function do I use? Mine? The donors'? The beneficiaries'? If I use mine, isn't that paternalistic?"
  * **The Reply:** "You are the agent making the decision, so it's your risk function applied to the outcome you value. If you value their lives, their utility is in your function. If the donors have a different risk tolerance, that's a principal-agent problem, not a decision theory problem. You can't optimize for three different risk functions simultaneously."
  * **Soft Spot:** This is ethically thin. In effective altruism, the 'agent' is often a proxy. This answer might feel like dodging the moral weight.

  **8. The Calibration Objection (Reverse)**
  * **Likelihood:** Low | **Severity:** Low
  * **The Question:** "You said this solves the Rabin calibration problem. But if I'm risk-averse over aggregate utility, doesn't that still imply I reject positive EV bets at some scale? Haven't you just moved the calibration problem to a higher level?"
  * **The Reply:** "Rabin's theorem relies on risk aversion over *wealth* implying risk aversion over *gambles* at all scales. I'm saying risk aversion is over the *shape of the distribution*. As the portfolio grows, the distribution narrows relative to the mean. The risk penalty shrinks endogenously. I don't need to assume decreasing risk aversion; the aggregation creates it."
  * **Soft Spot:** Requires the audience to accept that 'aggregate distribution narrowing' happens fast enough to matter.

  ---

  #### **The "Hope Nobody Asks" Question**
  * **The Question:** "If I'm near the end of my life, or my organization is shutting down, my 'policy' shrinks. Does your view imply I should become radically more risk-averse because I have no future to average over? Or radically more risk-seeking because I have nothing to lose?"
  * **Honest Answer:** "Strictly speaking, as the time horizon shrinks, the portfolio effect vanishes, and you converge back to local risk-weighting. If you have high baseline utility, you become risk-averse. If you have low baseline utility, the model might indeed prescribe 'gambling for resurrection.' I don't have a clean fix for the end-of-horizon singularity other than to say the policy definition becomes unstable there."
  * **Why hide this:** It exposes that the "policy" definition is arbitrary. Where does a policy start and end? If the answer is "until you die," the end-of-life behavior looks pathological. If the answer is "until the project ends," it looks like local weighting again.
