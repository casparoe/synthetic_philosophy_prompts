answer: |-
  **Brainstorm: Structural Features for Isolation**

  1.  **Deferred Success Conditions:** The criteria for whether a project "succeeded" must lie strictly outside the agent's lifespan, so the agent never experiences the failure experientially.
  2.  **Epistemic Closure:** The agents must remain ignorant of the extinction event until death, isolating the harm from psychological distress (fear/sadness) to purely objective value depletion.
  3.  **Contractual Intentionality:** The value of the activity must be socially or logically defined as dependent on a recipient, rather than intrinsic to the act itself, forcing a distinction between "doing the work" and "completing the chain."

  ***

  **The Scenario**

  A cohort of six archivists works at a private trust dedicated to preserving fragile oral histories, bound by a professional covenant stating their labor is only "successful" if the recordings are accessed and utilized by researchers in the next century. Each archivist enjoys high social status, deep personal satisfaction from the preservation work, and robust health, eventually dying painlessly in their sleep at an advanced age without ever witnessing the future use of the archives. They remain unaware that a sudden, global biological sterilization event has already occurred, ensuring that the last human beings will perish of old age exactly one month after the final archivist dies, meaning no future researchers will ever exist to access the tapes.

  ***

  **The Verdicts**

  Here's where the theories split. On the **Scheffler-style view**, this is a disaster for the archivists. Their lives were structured around a "collective afterlife" assumption—that humanity continues—which acts as a background condition for meaning. Because the chain is broken immediately after they die, the condition for their success is never met. Their lives are objectively devalued because the projects they invested in are rendered futile, even if they felt happy.

  The **Person-Affecting View (PA)** says nothing bad happened to anyone. You can't harm the archivists because their welfare was maximized during their lives (happy, healthy, satisfied) and they never knew about the extinction. You can't harm the future researchers because they never exist to be deprived. Since there is no subject who is made worse off than they otherwise would have been, the extinction is morally neutral regarding these specific people.

  **Total Utilitarianism (TU)** agrees extinction is bad, but for a totally different reason. It doesn't care about the archivists' meaning or the "futility" of their work. It cares about the sum total of happiness. The verdict is negative because all the potential happiness of the future generations (the researchers, their kids, etc.) is lost. The archivists' lives are just a drop in the bucket; the harm is the missing future utility, not the devaluation of the past.

  ***

  **The Isolating Feature**

  The work is being done by the **dependency loop** (the covenant), not mortality. The archivists die peacefully in all versions of the case, so death isn't the variable. The variable is whether their work *requires* a future recipient to count as success. If you remove that feature—say, the archivists just listened to the tapes as a self-contained hobby for their own enjoyment—the Scheffler-style harm vanishes. Their lives would remain fully meaningful even if humanity ended the next day, because the value was contained within their own experience. The dependency loop is what tethers their current value to future existence.

  ***

  **The Person-Affecting Counter-Attack**

  A defender of the person-affecting view would attack this by claiming you've smuggled in a false premise about what counts as being harmed. They'd argue that "meaning" isn't a metaphysical property floating out in the universe waiting to be validated; it's a psychological state. If the archivists *felt* their lives were meaningful, then they *were* meaningful to them. To say they were harmed because a future event didn't happen is to treat people like vessels for objective value rather than subjects of experience. They'd say you're conflating "the project failed" with "the person was harmed," and since the person is dead and never knew, there's no one left to hold the harm.
