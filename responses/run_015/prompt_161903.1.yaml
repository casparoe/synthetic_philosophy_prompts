      *   **User's View:** High trigger sensitivity (the specific details mattered), but high outcome robustness (war was likely anyway). Suspects the "for want of a nail" proverb slides between these two concepts. Estimates counterfactual horizon at ~2 years.
      *   **Task:** Use the provided scaffolding to analyze the Sarajevo/WWI sequence, answer the four specific "bits I actually care about," and maintain disciplinary rigor (admitting where the framework goes silent).

