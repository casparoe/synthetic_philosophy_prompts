  *(Self-Correction on Facts)*: The user said "hurts people in the vehicle behind." Actually, the bomb injured occupants of the *following* car and spectators, not the Archduke's car directly (it bounced off the folded canopy). I will gently correct this. The driver's name was Leopold Lojka (often misidentified, but the route change is the key fact). The stall is debated by historians (some say he stopped to reverse, others say stalled), but "stopped right in front" is the functional fact. I will stick to the functional fact.

  *(Refining the "Responsibility" section)*: This is tricky. If the war was inevitable, is Princip responsible? Yes, for the act. But is he responsible for the *World War*? That depends on the statesmen's reaction. I need to make sure I don't absolve the Great Powers entirely based on "robustness." Robustness implies *they* built the system that amplified the trigger. So responsibility shifts *up* to the architects of the system.

  *(Final check on "Where it goes silent")*: The biggest silence is the *nature* of the alternative. If no war in 1914, does the Habsburg empire collapse internally? Does Russia become a constitutional monarchy? We can't know. I must highlight this.

