      *   *Verdict:* The "Never" claim is hard to sustain given the structural pressures. The "2 years" claim is plausible given the Russian military modernization timeline (the "window of vulnerability" for Germany). I'll lean towards a short window (1-5 years) but acknowledge the uncertainty.

