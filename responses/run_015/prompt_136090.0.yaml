prompt: |-
  I'm running a session for my philosophy club—mostly seniors who've done free will but aren't specialists—on Dennett vs Caruso about just deserts and punishment. Don't explain the debate to me; plan the teaching arc instead. What's the dependancy order: do they need to see why Caruso thinks compatibilism still smuggles desert into punishment before I show Dennett's forward-looking reply, or should it go the other way around? Pick the one carrying case—not the standard murderer—where both the social-protection reason and the visceral 'he just deserves to suffer' feeling are loud and in tension; say exactly what that case must include and what it must leave out. Then list the misconceptions they'll hit in sequence—I'm guessing first 'Dennett is saying punishment is just therapy with cops,' then 'Caruso wants to empty every prison'—and tell me the precise point in the arc where I should block each. Give me one end-of-session check that shows they've actually felt the tension rather than just picking a side. And say clearly what chunk of Dennett's evolutionary story about responsibility I should skip entirely and openly admit I'm skipping.
