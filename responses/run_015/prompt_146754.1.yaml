              *   *RL Translation:* Hazard rate. Probability of episode termination $1-\gamma$.
          *   *(b) Diminishing Marginal Utility (Richer Future):* Future rewards are worth less because baseline is higher.
              *   *RL Translation:* Non-linear reward function $U(r_t)$, not $\gamma$. Concave utility.
          *   *(c) Opportunity Cost/Growth:* Resources grow over time.
              *   *RL Translation:* Investment dynamics in the transition function $P(s'|s,a)$. Capital accumulation.
