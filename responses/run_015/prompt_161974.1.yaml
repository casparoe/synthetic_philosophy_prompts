          *   *Infrastructure:* You can't use the bridge if you drive the wrong way.
          *   *Best:* **Public Utility / Maintenance.** You pay taxes (connection fee), the system keeps you from destitution (grid failure). But the "Insurance" one is the dominant one.
          *   *Actually:* The prompt asks if *no* comparison carries this. Maybe "Fire Brigade" is better. You don't check if you paid your specific premium before putting out the fire, but you do check if you set it intentionally.
          *   *Decision:* The "Public Good" or "Infrastructure" analogy is better. Or simply admitting it's **Sovereign Maintenance**.
          *   *Refinement:* Let's suggest "Public Infrastructure" or "Fire Service." You don't deserve the fire service because you paid premiums; you get it because we don't want the city to burn. But you don't get it if you set the fire.

  8.  **Review against Constraints:**

      *   No reading lists? Check.
