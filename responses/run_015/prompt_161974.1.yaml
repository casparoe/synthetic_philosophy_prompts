  3.  **Drafting the Correspondence Table:**

      *   *Premium:* In insurance, it's money paid beforehand. In means-tested welfare, it's... nothing? Or past taxes? But taxes aren't premiums (not risk-linked). Let's call it "General Taxation" but note the disconnect.
      *   *Risk Pool:* Insurance = voluntary group. Welfare = Citizens/Residents.
      *   *Insured Event:* Insurance = Specific accident/loss. Welfare = Poverty/Unemployment (but defined administratively).
      *   *Claim:* Insurance = Requesting payout based on contract. Welfare = Application + Proof of means + Proof of behavior.
      *   *Loss Assessor:* Insurance = Adjuster checking facts. Welfare = Case worker checking eligibility *and* compliance.
      *   *Exclusion (Self-inflicted):* Insurance = Arson/Suicide clauses. Welfare = Sanctions for quitting/firing.
      *   *Duty to Mitigate:* Insurance = Fix the leak to stop damage. Welfare = Search for work to end claim.
      *   *Fraud Investigation:* Insurance = Detecting false claims. Welfare = Detecting false claims + detecting non-compliance.

  4.  **Addressing the Disanalogies & The Three Conclusions:**

      *   *Conclusion 1: Conditionality is fair.* Insurance has conditions (you must lock your door). Welfare has conditions (you must apply for 5 jobs). *Disanalogy:* Insurance conditions reduce risk. Welfare conditions often *are* the hurdle to survival, and the "risk" (unemployment) is often macroeconomic, not individual.
      *   *Conclusion 2: Fraud enforcement is worth it.* Insurance fraud raises premiums for everyone. Welfare fraud... reduces the deficit? Or takes from the pool? *Disanalogy:* In welfare, administrative error is huge (per user constraint). Chasing small fraud costs more than it saves. In insurance, fraud is a direct theft from the pool. In welfare, it's a budget line item.
      *   *Conclusion 3: Work-for-benefit is reasonable.* Insurance pays cash to fix the loss. Welfare demands labor to receive cash. *Disanalogy:* Insurance indemnifies loss. Welfare modifies behavior.

  5.  **Addressing the Four "Stuck Points":**

      *   *1. The Desert Switch:* Membership (paid in) vs. Conduct (behaved well).
          *   *Analysis:* The user is right. Insurance relies on membership (premiums). When that fails (means-tested), the argument swaps to Conduct (moral worth). Real insurance *does* have conduct exclusions (arson), but only *after* membership is established. Welfare uses conduct to *deny* membership/payout entirely. The "borrowed half" is doing the heavy lifting.
      *   *2. The Silent Claimant:*
          *   *Analysis:* In insurance, a non-claiming victim is a profit for the insurer. In welfare, a non-claiming eligible person is "take-up failure."
          *   *Meaning:* This reveals welfare isn't about risk pooling (where non-claims are good); it's about social maintenance or labor discipline. If it were insurance, we'd want people *not* to claim. We worry when they *do*.
      *   *3. The Hazard Problem:*
          *   *Analysis:* Insurer vs. State. Insurer takes hazard as given (mostly). State *creates* the hazard (monetary policy, labor law) and defines the cover.
          *   *Verdict:* This breaks the analogy completely. An insurer who sets fire to the house to avoid paying is a criminal. A state that manages unemployment rates to manage benefit rolls is governing. The analogy hides the state's agency in creating the "risk."
      *   *4. Compliant Non-Participation:*
          *   *Analysis:* Ticking boxes but not trying.
          *   *Insurance View:* Did the loss happen? Yes. Did you mitigate? Technically yes. Pay out.
          *   *Welfare View:* You are gaming the system.
          *   *Verdict:* The analogy fails here because insurance cares about the *event*, welfare cares about the *intent/effort*. The analogy cannot judge "spirit of the rule" vs "letter of the rule" easily without importing moral judgment external to the contract.

  6.  **Addressing the Two General Questions:**

      *   *Imports:* Actuarial fairness (it's not actuarial), Claim as Entitlement (it's often a petition), Zero-sum pool (taxes aren't a finite pot in the same way), Loss as Accident (poverty is structural).
          *   *Cut against harshness:* The idea of "Claim as Entitlement" actually helps the claimant, but the "Zero-sum pool" hurts them. The "Actuarial Fairness" import is the biggest lie; welfare is redistributive, not actuarial.
      *   *Silences:* Dignity/Humiliation (insurance is transactional, welfare is often shaming), Purpose (risk vs. social order), State Interest (poverty reduction vs. compliance).

  7.  **Final Verdict & Recommendations:**

      *   *Do conclusions survive?* No. They rely on the hidden premises of the analogy (actuarial fairness, voluntary pool, distinct insurer/insured).
      *   *Conditionality:* If it survives, it must be *instrumental* (does this help get a job?) not *moral* (do you deserve this?).
      *   *Better Analogy:* Infrastructure? Public Health?
