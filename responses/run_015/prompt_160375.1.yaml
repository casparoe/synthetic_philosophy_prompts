answer: |-
  | Requirement | Case Showing Necessity | Status |
  | :--- | :--- | :--- |
  | **Boundary Definition** | Dam vote: 40k locals (80% against) vs. National majority (52% for). Who counts? | Non-negotiable |
  | **Shadow Demos** | Long-term non-citizen residents subject to laws but excluded from the vote. | Non-negotiable |
  | **Will vs. Good** | Voters want X, X harms them, they later deny willing it. Distinguish error from will. | Non-negotiable |
  | **Unexpressed Will** | Leader claims silent majority support without polls or ballots. Most common claim. | Non-negotiable |
  | **Intensity/Settledness** | 51% indifferent vs. 49% rioting; or fleeting mood vs. settled policy. | Preference (Populist) |
  | **Logical Consistency** | Majority wants A, wants B, rejects A+B. No stipulating "last vote wins." | Non-negotiable |
  | **Temporal Stability** | Pension reform wanted now, hated by future demos. Does will persist? | Non-negotiable |
  | **Falsifiability** | Claim must be provably false, not just contested. Avoids rigging the test. | Non-negotiable |

  Your suspicion is nearly correct but misidentified. The impossible trio is *Intensity, Consistency, and Determinacy*. If you count intensity, you violate equal weight (one person, one vote), creating cycling unless an agenda-setter dictates outcomes. You cannot have a determinate answer that respects intensity and logical consistency without granting dictatorship to the agenda controller. To adjudicate, you must drop intensity or accept indeterminacy.

  The single most exclusionary requirement is *Falsifiability*. Most theories of popular will are metaphysical or procedural. The "unitary subject" view cannot be falsified because it posits a hidden will. Aggregative models fail the "Unexpressed Will" requirement. Only a theory allowing empirical measurement of unexpressed sentiment survives, which is nearly impossible without collapsing into manipulation.

  **Theory Scores**

  **Aggregative Majoritarianism:** Passes falsifiability and consistency; fails unexpressed will and intensity. It cannot adjudicate claims where no vote occurred.

  **Deliberative Democracy:** Passes will vs. good; fails falsifiability and speed required for adjudication. It requires time populations do not have.

  **Unitary Subject:** Passes unexpressed will; fails falsifiable check entirely. It is metaphysical; no evidence can contradict the leader's intuition.

  **Informed Will:** Passes consistency; fails will vs. good. It collapses into paternalism by overriding actual choices with hypothetical ones.
