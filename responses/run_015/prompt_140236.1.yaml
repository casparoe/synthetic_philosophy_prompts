      *   *Point 4 (Breakdown):* Here is the warning. The film isn't purely consequentialist. Schindler's crying at the end isn't just about math (I could have saved 10 more). It's about moral worth. If you frame it only as "maximizing lives," you miss the human element. The inefficacy objection is a logical shield; the film is about breaking through shields to reach conscience.
