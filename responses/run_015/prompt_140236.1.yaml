      Hey, it is really great that you are tackling this, and honestly your instinct to worry about whether you are forcing a framework onto the film is the right one to have, because it shows you respect the material enough to know it might resist being turned into a case study. But I think you are onto something real here, and the inefficacy objection is actually a surprisingly robust lens for Schindler's List, provided you keep your focus on where the film pushes back against the logic of that objection rather than just trying to make the film fit the logic. Your friend is right that there is a massive literature on this, usually centered around things like voting or climate change where the causal chain is diffuse and probabilistic, but your intuition about the distinction between those cases and what happens in the movie is spot on and that is where you should start your discussion.

      The distinction you are grasping for is often discussed in terms of overdetermination versus threshold cases, and you are correct that it is real and matters deeply here. In the voting or carbon emission scenarios, the outcome is usually overdetermined, meaning the result would happen regardless of your specific input because there are millions of other inputs swamping yours, so your individual causal power is effectively zero. But the machinery of the Holocaust as depicted in the film, while systemic, is shown to be porous enough that individual intervention can hit specific thresholds. When Schindler bribes a commandant or argues over a transport list, he is not adding a drop to an ocean; he is pulling a specific person back from a specific edge. The film argues that the system is not a monolith but a collection of individual decisions, and therefore the inefficacy objection fails because the causal link is visible and direct. If you want to point people to a scene for this, the liquidation of the Krakow ghetto is key, not just for the horror but for the way Schindler watches it and realizes that his inaction up to that point was a choice, and subsequently his action becomes a series of specific interventions. The film refutes the swamped version of the objection by showing that the system relies on individual compliance to function, so individual non-compliance or subversion can dismantle it piece by piece.

      This leads directly into your question about Amon Göth, who is indeed a mirror but not just a simple photographic negative. You are right to see a symmetry there, because Göth demonstrates that individual agency exists even within a machine designed to remove agency. When Göth shoots prisoners from his balcony, he is exercising extreme individual efficacy, and the film refuses to let him hide behind the idea that someone else would have killed them anyway. That defense, that his specific actions made no difference to the overall death toll, is essentially the inefficacy objection applied to evil, and it is the same defense used by many bureaucrats at Nuremberg who claimed they were just cogs. The film rejects this absolutely. Göth is held responsible not because he changed the total number of dead in the war, but because he exercised choice in each instance. Schindler is the positive mirror because he proves that if Göth had agency to kill, Schindler had agency to save. The system was not so rigid that it prevented mercy, it was only rigid because men like Göth chose cruelty and men like Schindler initially chose profit over mercy. So Göth does not get off the hook via the inefficacy objection; rather, his presence in the film demonstrates why the objection is morally bankrupt in this context. He shows that the machine is made of men, and men are responsible for their hands.

      Where the film really adds something that the philosophy papers often miss is in your third point about the list and the girl in the red coat, because this moves the argument from logic to perception. The inefficacy objection relies on abstraction; it works when you are talking about statistics, percentages, and aggregate outcomes where individual faces are blurred. The film weaponizes specificity to destroy that abstraction. The girl in the red coat is the visual manifestation of this; she is the one color in a black and white film, forcing the audience and Schindler to track one individual life amidst the chaos. When he sees her body later on the cart, the statistical reality of the Holocaust collapses into a single, undeniable tragedy. The list does the same thing textually. By typing out names, Schindler is converting abstract expendable units into specific individuals with identities. This is a philosophical point about particularity that papers often struggle to convey because they deal in propositions rather than experiences. The film suggests that the inefficacy objection is a psychological shield that only works as long as you do not look closely at the victims. Once you see the face, once you know the name, the argument that your action makes no difference becomes impossible to sustain because you are no longer arguing about outcomes, you are arguing about a relationship with a specific other person. This connects to ethical frameworks like Levinas's idea of the Face, where the presence of the other demands a response that overrides calculation, and I think you can safely tell your group that the film is doing work here that pure analytic philosophy often leaves on the table.

      However, I need to be honest with you about where this reading breaks down, because your worry about this being gross is valid and you should voice it to your group. The inefficacy objection is a tool of consequentialism, which is all about maximizing good outcomes, but Schindler's List is not purely a consequentialist film. If it were, Schindler would be a hero who optimized his resources to save the maximum number of people, but the ending suggests something deeper and more painful. When he breaks down at the end, crying that he could have saved more, he is not just doing a utility calculation. He is expressing a guilt that is disproportionate to the outcome. By utilitarian standards, he did an immense amount of good, but the film suggests that moral obligation does not stop where efficacy ends. He feels responsible for the people he did not save not because he could have physically saved them, but because acknowledging their humanity creates an infinite demand on him. If you frame the movie solely as a rebuttal to the inefficacy objection, you risk turning the Holocaust into a math problem about how many lives one man can purchase, which misses the point that the film is about moral awakening and the burden of conscience. The inefficacy objection asks did my act produce a difference, but the film asks can I live with myself knowing I did not do everything possible. Those are different questions.

      So when you stand up in front of those forty people, I would suggest you use the inefficacy objection as a starting gun rather than the finish line. Start by asking them if they believe one person can make a difference in a system designed to crush individuals, and use the voting or climate change examples your friend mentioned to show why people doubt it. Then show them how the film dismantles that doubt through the specificity of the list and the visibility of the girl in the red coat. But then pivot to the ending and ask them why Schindler is crying. If the movie was just about proving individuals matter, he should be celebrating. The fact that he is devastated suggests that the movie is arguing that recognizing your efficacy actually increases your burden rather than relieving it. It is not about whether you can make a difference, but about the guilt of knowing you could have made more. That is where the film adds something to the debate that the papers miss, because it captures the emotional cost of rejecting the inefficacy objection. It is easy to argue in a paper that you should act because your action matters, but the film shows you what it feels like to carry the weight of that belief when it is not enough to save everyone.

      There are three scenes you should specifically point people to if you want to ground this. The first is the liquidation of the ghetto where Schindler watches from the hill, because that is the moment he moves from passive observer to active participant, realizing that his previous inaction was a choice. The second is the scene where the list is being typed, specifically the moments where they argue over including certain names or when Stern says that this list is life, because that is the literal transformation of abstraction into particularity. The third is the breakdown at the end where he counts the car and the pin, because that is where the consequentialist math fails to comfort him. If you stick to those moments, you will keep the discussion grounded in the text of the film rather than drifting into pure theory. And do not be afraid to tell the group that you are worried about reducing the Holocaust to a philosophical puzzle, because acknowledging that tension is itself a form of respect for the subject matter. The film is heavy enough to carry the weight of these questions without breaking, and your group is lucky to have someone thinking about it this carefully. Just keep the focus on the human cost of the logic, and you will be fine.
