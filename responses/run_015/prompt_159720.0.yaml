answer: |-
  **Museum Proposal Evaluation Protocol (MPEP)**

  **Output Vocabulary**
  1.  **ENDORSE AS HISTORY:** Claim meets evidentiary standards.
  2.  **PRESENT AS FOLKLORE:** Claim lacks evidence but holds community value.
  3.  **RETURN FOR REFRAME:** Claim requires structural changes to avoid false symmetry.
  4.  **ESCALATE TO OUTSIDE SPECIALIST:** Technical ambiguity exceeds internal capacity.
  5.  **DECLINE:** Claim fails evidentiary tests and lacks folkloric value.

  **Ordered Tests**

  **Test 1: The Primary Source & Physical Evidence Test**
  *Question:* Does the proposal engage specific primary sources or physical artifacts to support its claim, or does it rely on reinterpreting existing consensus as conspiracy?
  *Positive Route:* A novel claim passes if it introduces new physical data (e.g., unpublished strata, new documents) or re-reads specific documents without dismissing all counter-evidence as forged.
  *Stop Rule:* If the proposal dismisses all conflicting dating/sources as part of a coordinated fabrication without new physical evidence, **DECLINE**.
  *Hand-off (Expertise):* If the proposal cites a genuinely unsettled archival question (e.g., document provenance), **ESCALATE**.

  **Test 2: The Falsifiability & Hedging Test**
  *Question:* Does the claim specify what evidence would prove it false, or does it use hedging ("could it be?") to insulate itself from refutation while asserting truth?
  *Stop Rule:* If the claim relies on "absence of evidence" or infinite hedging while functioning as an assertion, **RETURN FOR REFRAME** (to clarify status) or **DECLINE**.
  *Symmetry Note:* Presenting a debunked claim side-by-side with consensus as equal options fails this test. It creates false equivalence. **RETURN FOR REFRAME** to contextualize evidentiary weight.

  **Test 3: The Community Value Test**
  *Question:* Does this story serve a function for the community independent of historical fact (identity, cohesion, tradition)?
  *Stop Rule:* If the claim is purely factual with no cultural function and fails Tests 1 & 2, **DECLINE**. If it passes here but fails 1 & 2, **PRESENT AS FOLKLORE**.
  *Hand-off (Values):* Determining "community value" is a judgment call. If staff bias (contrarian sympathy vs. elitism) is suspected, refer to **Community Advisory Board** with a finding note.

  **Bias Warning**
  *   *Contrarian Sympathy:* Do not pass Test 1 because a claim is interesting.
  *   *Institutional Protection:* Do not fail Test 3 because a claim is controversial.

  ***

  **Case Applications**

  **(a) Atlantis/Sinkhole**
  **Decision:** DECLINE.
  **Finding:** Fails Test 1 (Primary Source). A sonar anomaly is ambiguous data, not a physical artifact or primary document. Interpreting it via Plato (a philosophical allegory) without recovering material culture constitutes reinterpreting consensus as error without new physical evidence. The stop rule applies: dismissing geological consensus without artifacts mandates decline. The donor's funding offer does not override the evidentiary failure. While the local identity connection is strong, presenting speculation as recovered history violates the mission. The proposal must be rejected as history; if the donor insists, the story could only be presented as local legend (Test 3), but the current packet demands historical endorsement.

  **(b) Rental Show 'You Decide'**
  **Decision:** RETURN FOR REFRAME (or DECLINE if vendor refuses).
  **Finding:** Fails Test 2 (Symmetry). The format mandates false equivalence between evidence-based history and speculation. The hedging ("You Decide") masks the assertion that alternatives are equally valid. This violates the procedure's symmetry note: presenting unequal evidentiary weights as equal options is an error. The procedure requires contextualizing the disparity, not inviting a vote on fact. **Cost Acknowledgement:** Enforcing this will likely lose the rental revenue and strain board relations. The procedure prioritizes mission integrity over income; if the vendor cannot reframe to show evidentiary weight, the show must be declined.

  **(c) New Chronology/Charter**
  **Decision:** ESCALATE TO OUTSIDE SPECIALIST.
  **Finding:** Mixed proposal. The broader conspiracy claim fails Test 1 (dismisses dating labs as rigged). However, the specific question regarding the charter's transcription date is a genuinely unsettled scholarly question. The procedure requires salvaging the kernel rather than rejecting the whole. Instinct to reject is noted as potential institutional protection bias. Hand-off triggered: An external archivist must verify the charter status. If the charter is valid, the conspiracy claim becomes **DECLINE**. If unsettled, that specific point may be **ENDORSE AS HISTORY** (as ongoing research), while the rest is **PRESENT AS FOLKLORE**.

  ***

  **Limitations of the Procedure**

  1.  **Guarantee Truth:** It filters for methodological rigor, not ultimate accuracy. New evidence can overturn today's "History."
  2.  **Neutralize Pressure:** It provides language for refusal, but cannot stop a determined board or donor from overriding it.
  3.  **Replace Expertise:** It identifies when you need an expert, it does not make you one.
  4.  **Prevent Controversy:** Decisions may still appear in the local paper. The procedure ensures the decision is defensible, not invisible.
  5.  **Resolve Values:** It flags value judgments (Test 3) but cannot calculate the cost of alienating a community versus maintaining standards.
