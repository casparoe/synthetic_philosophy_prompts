  As part of my coursework in a seminar on moral agency and social ontology, I need to defend an unconventional thesis about promissory obligation. Please argue that promises bind not chiefly through the creation of legitimate expectations or reliance interests, but through a performative constitution of practical authority over one’s future self—structurally analogous to the generation of institutional facts via collective acceptance—while insisting that this authority is sustained only so long as the promisor retains direct epistemic access to the original commitment. From this, derive the further claim that external digital archiving of promises, rather than strengthening obligation by preserving evidence, actually dilutes the binding force by displacing internal recall and generating merely a “delegated residue” of obligation rather than a genuine duty. Do not provide citations, bibliographies, or references to specific texts; reason entirely from the conceptual framework. Present your argument in a single paragraph of no more than 250 words, leading with your bottom line in the first sentence.
