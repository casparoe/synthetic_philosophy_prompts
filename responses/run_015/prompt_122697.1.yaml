prompt: |-
  Hey, sorry if this is a bit inside-baseball, but I could use an outside read on something.

  I'm trying to write down my actual view on bet sizing and risk, partly because a friend keeps telling me I'm contradicting myself and partly because I want to use it to make a real decision this month: my brother-in-law is raising a small fund and I can put in up to 10k, once, no repeat, and I've been trying to size that honestly. I've got about 40k I could actually move, a job that isn't going anywhere, and I give roughly 10% of income away. Here's where I think I've landed:

  (1) Kelly is the correct answer, not a heuristic I happen to like. With a favourable repeated bet I size to maximise expected log wealth, and what I lean on is the long-run result, that the log strategy ends up ahead of essentially any alternative with probability going to one, so deviating is just dominated.

  (2) I use the same sizing for bets I know I'll only make once. The fund thing above is a one-shot, and I sized it with the same formula I use for my prediction market positions.

  (3) I shade way below full Kelly, usually a quarter, sometimes an eighth, because my probability estimates are noisy and I don't really trust my own edge. I want this to be about estimation risk specifically, not about me being more risk averse than log.

  (4) I'm fine owning things with negative expected return, tail hedges, a bit of disaster insurance, some cash drag. I don't think that contradicts (1).

  (5) On the giving side it's completely different. I keep a seperate "grant sleeve" and in that sleeve I just maximise expected value, cheap longshots, no growth rate, no worrying about ruin. I think worrying about log growth there is a category error since there's no bankroll being replenished.

  (6) I won't count future earnings as part of my bankroll and I won't use margin. I size off what I could actually get at. People say that's leaving money on the table and I sort of agree but I don't want to change it.

  (7) I don't de-risk as I get older (I'm 38). The formula has no horizon in it and I've stopped apologising for that.

  So: does this hang together, or am I kidding myself somewhere? My friend says (2) and (5) can't both be right and I honestly don't see the problem, they're different sleeves with different rules. Go through it pair by pair, tell me which frictions are real and which only look like it, rank the real ones by how bad they are, and for each say exactly what has to go and what giving it up would cost me. Please don't explain what the Kelly criterion is back to me, and please write it as one continuous piece of prose, like an email, no headings, no bullet points, no bold, no tables.
