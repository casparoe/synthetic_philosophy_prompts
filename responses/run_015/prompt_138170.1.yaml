      *   **Constraints:** No citations. Direct, honest, critical engagement.
      *   **Core Tension:** Custody vs. Care, Access vs. Protection, Neutrality vs. Advocacy, Preservation vs. Repatriation.

  2.  **Evaluate the "Direction-of-Use Test":**
