  *Wait, one more check on Case 8:* The user says "I suspect I'm wrong and we should hand over everything." I need to be honest. In post-custodial theory, they are right. But in practical risk management, a copy is often insurance against loss. However, ethically, if the community says "no copy," making a secret copy is a betrayal. I will support their gut: hand it over.

  *Wait, Case 3:* Why seal informants? Because the *social fabric* is the subject. The record was used to break trust. Releasing it breaks trust again.

