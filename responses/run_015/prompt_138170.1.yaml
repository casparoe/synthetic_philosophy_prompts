  8.  **Final Polish:** Check the flow. Ensure the "Principle" sounds like a working document an archivist could actually use. (Decided to name it "The Principle of Adverse Jurisdiction" as it captures the power dynamic well).

  *(Self-Correction on the Principle Name)*: "Adverse Jurisdiction" sounds a bit too legalistic. Let's go with **"The Principle of Power and Custody."** Or better, stick to their intuition and refine it: **"The Sovereignty of the Subjected."** Let's go with **The Principle of Reciprocal Accountability.** No, let's keep it simple. **The Principle of Jurisdictional Harm.**
  Actually, the user's "Direction-of-Use" is catchy. I should repair *that* rather than replace it entirely, showing where it needs addenda.
