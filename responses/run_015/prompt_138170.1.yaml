      *   *Strengths:* Explains Cases 1, 2, 5, 8, 10 well. Highlights the power dynamic in record creation.
      *   *Weaknesses:* Case 3 (Informants) is tricky (they are both users and subjects). Case 4 (Arrest photos) shifts description focus. Case 6 (Oral History) is maker-centric but restricted by subject safety. Case 7 (Deletion) is about process, not content. Case 9 (Silence) is about absence, not existing records.
      *   *Verdict:* It's a strong heuristic but needs expansion to cover *harm*, *silence*, and *process*. It's not just "who was it used on," but "what harm does keeping/showing this do, and who gets to decide?"

  3.  **Develop a Refined Principle:**
      *   The user's intuition is better than their formulation. The core isn't just "direction of use," it's **"Jurisdiction of Harm and Agency."**
      *   Records that *enacted power over* subjects grant jurisdiction to those subjects (or descendants).
      *   Records that *documented existence* without direct coercion grant jurisdiction to the creator, *unless* exposure causes harm.
      *   Archives must document their own *silences* and *actions* (deletion/retention) as part of the record.
      *   *Proposed Name:* **The Principle of Jurisdictional Care.** (Or something similar). Let's stick closer to their language but tighten it. Let's call it **The Principle of Subject Sovereignty over Administrative Violence.**
      *   *Actually, let's go deeper.* The user's "direction-of-use" is good but needs to account for *time* and *consequence*.
      *   *Revised Principle:* **The Accountability of Power.** Records generated by an apparatus of power over individuals vest rights in the individuals, not the apparatus. Records generated by individuals vest rights in the individuals, unless exposure replicates harm. The Archive's duty is to witness the power dynamic, not preserve the power.

      *   *Let's try to synthesize a unified theory:* **The Principle of Reciprocal Custody.**
          *   If the record was a *tool* used on a person, the person (heirs) holds veto/description rights.
          *   If the record was a *trace* of a person, the archive holds it in trust, but exposure requires consent if harm is possible.
          *   If the record is *absent*, the archive must document the absence.
          *   If the record is *false*, it is kept as evidence of the lie, not the truth.

      *   *Wait, the prompt asks for a clause-by-clause version.* I need to formulate a set of rules that cover the 10 cases.
      *   *Case 3 (Informants)* is the stress test. Informants were used by the police, but the file acts *on* the neighbours. The informants are also at risk. Sealing protects the *living community* from the *dead file*.
      *   *Case 8 (Clinic Registers)* is the repatriation stress test. The "colonial instinct" to keep a copy is about archive survival, not community need.
      *   *Case 9 (Silence)* is about meta-archiving.

      *   *Decision:* The user's "direction-of-use" is 80% there. It needs a supplement regarding *Harm* and *Silence*. I will propose a two-part principle: **1. Sovereignty of the Subjected** (for admin records) and **2. Stewardship of Silence** (for gaps and process).

  4.  **Drafting the Response:**

      *   **Validation:** Acknowledge the strength of their intuition. It's not hopeless; it's sophisticated post-custodial theory in practice.
      *   **Critique of "Direction-of-Use":** It works for 1, 2, 5, 8, 10. It struggles with 3 (informants), 6 (oral history conditions), 7 (deletion), 9 (absence).
      *   **Refinement:** Propose **The Principle of Adverse Jurisdiction.**
          *   *Clause 1 (The Tool Clause):* If a record was created to administer, control, or extract from a person, jurisdiction over access and description lies with that person/community. (Cases 1, 2, 4, 5, 8).
          *   *Clause 2 (The Harm Clause):* If access creates credible risk of harm (social, physical, psychological) to the subject or their community, access is restricted regardless of historical value. (Cases 3, 6).
          *   *Clause 3 (The Evidence of Power Clause):* False records or records of deletion are kept not for truth, but as evidence of the exercise of power. (Cases 7, 10).
          *   *Clause 4 (The Silence Clause):* Systemic absence must be catalogued as actively as presence. (Case 9).

      *   **Addressing Case 3 (Informants):** Why seal? Because the *community* is the subject of the surveillance, even if names are listed. The file acts on the neighborhood's trust.
      *   **Addressing Case 8 (Clinic):** The "colonial instinct" to copy is wrong. If the community claims sovereignty, the archive's role is to witness the transfer, not hoard the data.
      *   **Addressing the Unlabelled Photo Box:** This is the hard one.
          *   *Principle Application:* These are children. Vulnerable subjects. No consent.
