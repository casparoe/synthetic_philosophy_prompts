      *   **Prediction (New Case):** A dataset of AI-generated "historical" faces used in a local museum exhibit.
          *   *Application:* It's a false record (Clause 3). It acts on the viewer's perception of history (Clause 1). It must be labelled as synthetic, and if it misrepresents a specific community, that community has veto.
      *   **What Changes My Mind/Where it Breaks:**
