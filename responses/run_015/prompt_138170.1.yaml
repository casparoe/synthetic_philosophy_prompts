answer: |-
  Your "direction-of-use" test is not hopeless. It is a pragmatic articulation of post-custodial archival theory, specifically the shift from *provenance of creation* to *provenance of impact*. You are correctly identifying that the ethical weight of a record lies not in who signed it, but on whose back it landed.

  However, your test fails on Case 3 (informants), Case 7 (deletion), and Case 9 (silence) because it focuses on the *object* rather than the *relationship*. A record isn't just a tool used on a person; it is an event in a power dynamic.

  Here is the repaired principle. It keeps your core intuition but adds the necessary clauses to cover the outliers.

  ### The Principle of Jurisdictional Harm

  **Clause 1: The Tool Clause (Cases 1, 2, 4, 5, 8, 10)**
  If a record was created by an institution to administer, control, extract from, or categorize a person, jurisdiction over access, description, and custody belongs to that person or their descendants, not the institution.
  *   *Why:* This covers your tax rolls, admission registers, and police photos. The archive does not own the "data" of someone's subjugation; it holds it in trust for the subjected. This is why you re-describe the vagrancy photos (Case 4) to focus on the law, not the men, and why you retire the missionary's captions (Case 5). It is why you suspect you should not keep the clinic copies (Case 8)—the record was a tool of the clinic upon the community; the community reclaims the tool.
  *   *Repair to your test:* It's not just "used on." It's "used to exercise power over."

  **Clause 2: The Harm Override (Cases 3, 6)**
  If releasing a record creates a credible risk of social, physical, or psychological harm to a living community, access is restricted regardless of historical value or the "Tool Clause."
  *   *Why:* This fixes Case 3. The informant file was used *by* the police *on* the neighborhood. While the informants are named, the *subject* of the surveillance was the community's trust. Releasing it now reignites that breach. The "direction of use" was to fracture the community; releasing it continues that use. Case 6 (oral history) falls here too: the elder knows the content causes harm to specific families. Her condition is a harm assessment you must honour.
  *   *Repair to your test:* "Direction of use" predicts who *owns* the decision, but "Harm" predicts when the decision must be *no*.

  **Clause 3: The Evidence of Process Clause (Cases 7, 10)**
  Records that document the manipulation, destruction, or falsification of information are kept not for their truth-content, but as evidence of the institution's behaviour.
  *   *Why:* Case 10 (the forgery) is kept because it proves the sacking was based on a lie. Case 7 (the deleted emails) is worse than a flood because the deletion was an *act of power*. A flood is entropy; deletion is agency. You must catalogue the deletion itself as a record. "Here is a gap where five years of correspondence should be, deleted on [Date] by [Department]."
  *   *Repair to your test:* Your test focuses on content. This clause says the *absence* or *falsity* is the content.

  **Clause 4: The Silence Clause (Case 9)**
  Systemic absence in the holdings must be catalogued as actively as presence.
  *   *Why:* Neutrality is a lie. If your catalogue says nothing about the travelling community, it implies they were not there. An explicit note ("We have no records of X because the laws did not count them") turns the silence into evidence.
  *   *Repair to your test:* This extends the principle to things you *don't* have. The archive is responsible for the shape of the hole, not just the dough.

  ***

  ### The Unlabelled Box of Children's Photographs

  This is the hardest case because it pits *identification* (restoring identity) against *exposure* (violating privacy).

  **The Verdict:** Do not digitize for public crowdsourcing.
  **The Reasoning:** Crowdsourcing asks the public to perform metadata labour for your benefit, but it asks the vulnerable to risk their privacy for your catalogue. If these children are now elderly, they did not consent to be on the internet. If they are dead, their descendants might not want images of their institutionalized ancestors circulated.

  **The Principle's Application:**
  Under **Clause 1 (The Tool Clause)**, these photos were taken by the institution to monitor the children. They are tools of administration. Under **Clause 2 (The Harm Override)**, public exposure risks shame or trauma.
  **The Middle Path:** You keep the physical photos secure. You do not put them online. If identification is to happen, it happens *offline*, in partnership with the descendant community. You bring the photos to them (or a trusted representative), in a room, with support. If they want to identify them, they do. If they say "leave them in the dark," you leave them in the dark. The "good" of a name does not outweigh the "harm" of non-consensual exposure.

  ***

  ### Prediction: A Case You Haven't Listed

  **The Case:** A local tech company donates a server's worth of user data from a defunct community health app (2015–2020). The data is anonymized, but the metadata (timestamps, locations, health queries) could easily re-identify specific users in a small region. The company says, "It's anonymized, it's safe, it's history."

  **My Principle's Prediction:**
  1.  **Clause 1:** The data was created to administer health services (power over the body). Jurisdiction lies with the users, not the company or the archive.
  2.  **Clause 2:** In a small region, "anonymized" data is re-identifiable. Access creates harm risk.
  3.  **Verdict:** You decline the donation. Or, you accept it only under a deed of gift that grants a community ethics board veto power over any research access. You do not trust the company's "anonymization." You treat the data as radioactive until the subjects (or their proxies) clear it.

  ***

  ### What Would Change My Mind / Where This Breaks

  **The Break Point: The Untraceable Subject.**
  My reasoning breaks when the "subjected" community no longer exists or cannot be traced.
  *   *Example:* You find a box of similar institutional photos from 1910. No registers survive. No descendants can be found. The community was dispersed or assimilated.
  *   *The Conflict:* **Clause 1** says they hold jurisdiction. **Clause 4** says silence is evidence. If you keep them sealed forever because you can't find the subjects, you erase them (Clause 4 violation). If you release them to "make them visible," you risk violating **Clause 2** (Harm) to ghosts who cannot consent.
  *   *The Flip:* In this specific case, I would flip to **controlled access for research only**, with a public notice stating: "We hold images of unidentified individuals from [Institution]. We are seeking descendants. No images will be reproduced without next-of-kin consent." This shifts the burden of contact to the archive, not the public.

  **The Consideration That Flips the Photo Box (Case 11):**
  The only thing that flips me on the unlabelled children's photos is **Medical Necessity.**
  If those photos are linked to medical records (even loosely) and there is a known hereditary condition affecting that specific group of survivors, and identification could save lives *now*:
  *   **Clause 2 (Harm)** is outweighed by **Prevention of Future Harm.**
  *   I would allow restricted access to medical researchers *only*, under strict confidentiality agreements, specifically to trace genetic lines, with a community liaison overseeing the process.
  *   *Why:* The archive's duty to preserve the past yields to the living community's right to health. But the "crowdsourcing" model is still forbidden; this must be a surgical, consent-based operation.

  **Where the Reasoning is Most Fragile:**
  It is fragile when **the By and the About collapse.**
  *   *Example:* A dissident's diary. They wrote it (Maker) but it details their own persecution (Subject). They are dead. The regime that persecuted them is gone.
  *   *My Principle:* **Clause 1** says the subject has jurisdiction. **Clause 2** says avoid harm. But the subject is dead, and the "harm" is historical.
  *   *The Risk:* If you apply **Clause 1** too rigidly here, you might seal a diary because a distant relative objects, silencing the dissident's voice.
  *   *The Fix:* You need a **Sunset Clause.** Jurisdiction over administrative violence transfers to descendants, but it expires if the restriction serves to protect the *perpetrators* or *systems* rather than the *victims*. If the dissident's relatives want the diary sealed to "protect the family reputation" (which was built on the dissident's suffering), the archive must override them. The principle protects the *victimized*, not the *reputation of the victim's heirs*.

  Your gut is right. The "colonial instinct" in Case 8 (keep a copy) is about *archive* survival, not *community* memory. If you keep the copy against their will, you are replicating the extraction you identified in Case 1. You become the tax collector of memory. Hand it over. Keep the receipt. That is your record.
