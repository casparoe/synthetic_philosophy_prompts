answer: |-
  You have stumbled onto something quite sharp here. It is rare for someone to build a system from scratch and notice the structural cracks in the logic before being told they exist. Your intuition about the difference between a 'theoretical' trick and a 'usable' trick is spot on, and it cuts right to the heart of modern voting theory.

  Here is the carving you asked for, keeping to the ideas rather than the bibliography.

  ### 1. The General Fact: The Impossibility of Strategy-Proofness

  You asked if there is a name for the fact that you cannot design a system where honesty is always the best move (with three or more options).

  Yes. In the field, this is known as the **fundamental impossibility theorem for strategy-proofness**. (You may hear it referred to by the names of the two mathematicians who proved it independently, but since you asked for ideas rather than citations, I will stick to the concept).

  **The Carving:**
  *   **What it is:** It is a mathematical proof stating that for any voting rule that is not a dictatorship (where one person decides everything) and allows for at least three possible outcomes, there will always be some scenario where a voter can get a better result by lying about their preferences.
  *   **What it isn't:** It does not say that *every* vote in *every* election should be dishonest. It says that the *opportunity* to benefit from dishonesty exists somewhere in the system's logic.
  *   **The Two-Option Exception:** You noted that with two options, you never found a trick. The theorem agrees with you. With only two outcomes, simple majority rule is 'strategy-proof'. Honesty is a dominant strategy. The impossibility only kicks in once you introduce a third option.

  ### 2. The Distinction: Dominant vs. Contingent Manipulation

  This is the core of your observation. You have noticed that some tricks are 'robust' (they work regardless of what others do) and some are 'fragile' (they require perfect knowledge and backfire easily).

  In formal terms, this is the distinction between **Dominant Strategy Manipulation** and **Contingent (or Bayesian) Manipulation**.

  **Dominant Strategy Manipulation (The 'Easy' Trick):**
  *   **Definition:** A lie that pays off no matter what anyone else votes.
  *   **Your Example:** Plurality voting (pick one). If your favourite has no chance, voting for your second choice is often a dominant strategy. You do not need to know exactly how others will vote; you only need to know the rough standings.
  *   **Risk:** Low. It is 'safe' dishonesty.

  **Contingent Manipulation (The 'Hard' Trick):**
  *   **Definition:** A lie that only pays off if the rest of the electorate votes in a very specific way.
  *   **Your Example:** The ranking system where you bury a rival. If you misjudge the crowd, you might accidentally eliminate your favourite.
  *   **Risk:** High. It requires 'common knowledge' (you know what they know, they know what you know).

  **Is there a name for the distinction itself?**
  There is no single noun like 'The Safety Gap'. However, researchers measure this using **Informational Requirements** and **Manipulation Robustness**.

  If you want to name this distinction for your committee, I suggest calling it the **"Barrier to Strategic Entry"**.
  *   **Low Barrier:** The trick is obvious and safe (Dominant).
  *   **High Barrier:** The trick requires data, calculation, and carries risk (Contingent).

  **Can a method exist where *every* trick is the hard, risky kind?**
  Yes. This is a major goal in system design. You want a system that is theoretically manipulable (because the impossibility theorem says you must be) but practically resistant.
  *   **Example:** Certain **Condorcet methods** (which try to find a candidate who beats everyone else in head-to-head matchups) often have high informational barriers. To game them, you need to know the precise pairwise preferences of the whole school. If you guess wrong, you often elect your least favourite candidate.
  *   **Example:** **Randomised methods** (e.g., picking a ballot at random and letting that person decide) are technically manipulable, but the 'trick' requires knowing which ballot will be picked, which is impossible. Thus, honesty becomes the best *practical* strategy, even if not the best *theoretical* one.

  ### 3. Naming and Defining Your Distinction

  Since you asked to name it if it is unnamed, I propose we call this property **"Practical Strategy-Proofness"**.

  **Definition:** A voting method has high Practical Strategy-Proofness if, while mathematical loopholes exist, the **informational cost** and **risk of backfire** for exploiting them are high enough that a rational actor will choose honesty.

  **The Carving of Practical Strategy-Proofness:**
  *   **What it is:** A measure of how difficult it is for a human being to successfully game the system in a real-world setting. It combines the complexity of the calculation with the amount of private information required.
  *   **What it isn't:** It is not the same as **Computational Complexity**. Computational complexity asks, "Is it hard for a computer to calculate the lie?" Your observation is about **Informational Complexity**: "Is it hard for a student to *know* enough to make the lie work?"
  *   **Nearest Miss (Computational Complexity):** A system might be hard to game because the maths is too hard (e.g., you need to solve a puzzle only a supercomputer can do). That is not what you are seeing. You are seeing systems where the maths is easy, but the *data* is missing.
  *   **Nearest Miss (Bounded Rationality):** This is the idea that humans are too lazy or stupid to find the trick. Your distinction is stronger: you are saying the trick is *dangerous*, not just difficult. Even a smart person might not take the risk.

  **Borderline Cases:**

  1.  **Utility Beyond Winning:**
      *   *Scenario:* You care about the margin of victory (e.g., you want your candidate to win by a lot to look popular).
      *   *Effect:* This lowers Practical Strategy-Proofness. If you care about the margin, you might vote tactically even in a 'safe' system to boost the numbers. The 'honesty is safe' rule applies mostly to *who* wins, not *how* they win.

  2.  **Bloc Voting:**
      *   *Scenario:* You and five friends agree to vote the same way.
      *   *Effect:* This drastically lowers the Barrier to Strategic Entry. A group can simulate 'perfect information' amongst themselves. A trick that is too risky for one person becomes safe for a coordinated bloc. This is why student councils often worry about 'slates' or 'tickets'.

  3.  **Uncertainty About Own Preferences:**
      *   *Scenario:* A voter is unsure if they prefer Option A or Option B.
      *   *Effect:* This increases Practical Strategy-Proofness. If you do not know your own true favourite, you cannot strategically rank them. Ambiguity acts as a shield against manipulation.

  ### 4. Where I Am Least Sure

  You asked me to identify where I might be confusing things. Here is the weakest point in my analysis:

  **The Definition of 'Risk'**
  I am treating 'risk of backfire' as an objective property of the voting method. In reality, risk is subjective.
  *   *The Problem:* A 'risky' trick for a cautious voter might be a 'calculated gamble' for a risk-seeking voter. If a student thinks, "I hate Option C so much, I will take a 10% chance of helping them just to stop them," then the 'High Barrier' I described collapses.
  *   *What would change my mind:* If you found a voting method where the 'trick' required *zero* extra information but still carried a risk of backfire. Currently, I am assuming risk comes from a lack of information. If you can find a case where you have perfect information, the maths is simple, but the outcome is still a gamble due to the system's internal randomness, that would refine the definition of **Practical Strategy-Proofness**.

  **The 'Two Option' Claim**
  I am 95% sure you are right that two options = no tricks. However, there is a borderline case: **Abstention**.
  *   *The Edge Case:* If students can choose *not* to vote, and there is a quorum rule (e.g., "If less than 50% vote, the election is void"), then a student might strategically *stay home* to void the election rather than vote for their least favourite option. This is a trick with two options, but it relies on the *rules of the election* rather than the *counting method*. If your app allows abstention and has quorum rules, your "two options is safe" rule might have a leak.

  ### Summary for Your Committee

  If you need to present this to the council, here is the phrasing:

  1.  **The Impossibility:** We cannot make a system where lying is impossible (with 3+ options). It is mathematically proven that loopholes exist.
  2.  **The Goal:** We should not aim for 'Perfect Honesty' (impossible). We should aim for **'High Barrier to Entry'**.
  3.  **The Metric:** We want a system where the only ways to game the vote require knowing everyone else's choices in advance. Since students cannot know that, they will default to honesty.
  4.  **The Recommendation:** Avoid systems where 'burying a rival' is a dominant strategy (like simple ranking). Prefer systems where guessing wrong punishes the manipulator (high risk of backfire).

  You have essentially rediscovered the difference between *theoretical incentive compatibility* and *practical robustness*. That is a very sophisticated distinction for a school poll app. Keep building.
