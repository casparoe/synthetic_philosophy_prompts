answer: |-
  Dear Colleague, It is a pleasure to engage with your pedagogical challenge, and I agree entirely that the junction of metaphysics and value theory is where the seminar should culminate. Below is the exam material drafted according to your specifications, followed by the model answer and the marking scheme, all presented as continuous prose for ease of copying.

  Here is the question text as you might hand it to the students. Consider an agent named Ada who is thoroughly reasons-responsive, satisfies hierarchical conditions with reflective stability, and identifies wholeheartedly with her motives. Her history contains no manipulation or covert control, yet her entire practical standpoint was fixed by an ordinary deterministic causal history she did not choose. Call her control closed-loop, meaning every revision of her desires proceeds by applying standards she already has, so no exercise of agency puts her entire standpoint up for revision from outside itself. Incompatibilists demand open-loop control, where an agent authors the standpoint from which she authors. In a closed-book essay of no more than twelve hundred words, argue whether Ada possesses the free will worth wanting. Your answer must not simply assert a verdict but must first define what makes free will worth wanting, specify for whom it is wanted and for what purpose, and address whether the incompatibilist's demand for open-loop control is coherent. Conclude by assessing whether the dispute between compatibilists and incompatibilists is substantive or verbal once these definitions are fixed.

  Following is a model answer of approximately nine hundred words that represents the kind of response a genuinely strong student could produce under those conditions. The question of whether Ada has the free will worth wanting cannot be answered until we decide what work we want free will to do. If the purpose is to justify moral responsibility practices like blame and resentment, then Ada likely has what is worth wanting. She is reasons-responsive and identifies with her motives, so treating her as accountable makes sense within our social practices. Strawsonian reactive attitudes fit her case because she is a suitable target for interpersonal engagement. However, if the purpose is self-creation or the dignity of ultimate authorship, then Ada lacks what is worth wanting. Her closed-loop control means she never chose the self that does the choosing. Thus, the verdict depends entirely on the desideratum. Both the compatibilist who says Ada is free and the incompatibilist who says she is not beg the question until they specify this value. The compatibilist assumes responsibility is the only thing that matters, while the incompatibilist assumes ultimate sourcehood is required for dignity. Without fixing the purpose, asserting that Ada has or lacks the free will worth wanting is merely talking past one another. We must also ask who is doing the wanting. Is it a psychological claim about what humans actually care about, or a normative claim about what they should care about? Psychologically, many people do care about ultimate authorship; they feel uneasy about determinism. Normatively, however, we might argue they should not care because ultimate authorship is incoherent. This leads to the question of whether open-loop control is even possible. If an agent authors her own standpoint, she must do so from some prior standpoint. If that prior standpoint is also authored by her, we face a regress. If it is not authored by her, then she is not the ultimate source. If the choice is random, it is not agency. Therefore, open-loop control appears incoherent. If it is incoherent, it cannot be worth wanting because we cannot have reason to want the impossible. This suggests the incompatibilist desire for open-loop control is a conceptual confusion rather than a legitimate value claim. However, even if open-loop is incoherent, the feeling that something is missing in Ada's case might persist. This suggests the dispute is not merely verbal. It is a substantive disagreement about value. Compatibilists value social functioning and reasons-responsiveness. Incompatibilists value a metaphysical status that may be impossible. Once we fix the desiderata, we see they are arguing about different things. One side argues for the sufficiency of closed-loop control for responsibility, while the other argues for the necessity of open-loop control for dignity. If dignity requires the impossible, then the incompatibilist position collapses into nihilism or error theory. But if the desire for open-loop control is a psychological fact about human self-conception, then compatibilist free will might leave something important unsatisfied, even if it is sufficient for responsibility. Settling this requires more than metaphysics. It requires deciding whether we should revise our desires to fit what is possible or insist on the impossible and accept the consequences. If we choose the former, Ada has the free will worth wanting. If we choose the latter, she does not, but we are left wanting something that cannot exist. The dispute is therefore substantive regarding what we value, but it risks being verbal if we do not distinguish between the possible objects of value. Ultimately, the question of worth is normative. We have reason to want what serves our practices and coherence. Since open-loop control is likely incoherent, we have no reason to want it. Therefore, Ada's closed-loop control is the only variety worth wanting, provided we accept that the purpose of free will is to ground responsibility rather than metaphysical solitude. The exam should force students to realize that metaphysics alone cannot settle the value question.

  Now I will outline the marking scheme organised around five must-hit points with the marks allocated to each out of thirty. I have retained four of your proposed points but replaced the fifth. Your original fifth point asked students to say what would count as settling the dispute. I recommend replacing this with a requirement to distinguish whether the claim that free will is worth wanting is a psychological claim about actual desires or a normative claim about reasoned endorsement. I suggest this change because asking students how to settle a philosophical dispute often invites vague meta-philosophical hand-waving, whereas your initial complaint was specifically that students fail to distinguish between what people do want and what they should want. This swap directly tests the pedagogical gap you identified. The first criterion awards six marks for separating the several things free will might be wanted for, such as moral responsibility versus self-creation, and weaker answers characteristically treat free will as a single monolithic good without distinguishing its functions. The second criterion awards six marks for showing why both the claim that Ada has all the control that could matter and the claim that she is not the ultimate source beg the question until a desideratum is fixed, and weaker answers characteristically assert one side as obviously true without recognising the underlying value assumption. The third criterion awards six marks for saying whether open-loop control is coherent and what follows for the worth-wanting question if it is not, and weaker answers characteristically assume open-loop control is possible without analysing the regress problem. The fourth criterion awards six marks for locating where the compatibilist-incompatibilist dispute actually sits once desiderata are fixed, such as whether it is verbal or a substantive disagreement about value, and weaker answers characteristically describe it as purely metaphysical rather than axiological. The fifth criterion awards six marks for distinguishing whether the claim that free will is worth wanting is a psychological claim about actual desires or a normative claim about reasoned endorsement, and weaker answers characteristically conflate what people do care about with what they have reason to care about. This scheme ensures that nobody can score well by producing a tidy exposition of a named theory, as the marks are allocated for structural analysis of the question rather than recall of the literature. I hope this material serves your seminar well and successfully forces your students into the junction where metaphysics and value theory touch.
