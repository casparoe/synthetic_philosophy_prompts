  7.  **Finalizing the Argument:** The core tension is **Static Will vs. Dynamic Flow**. The AD is a fossilized will. Zhuangzi advocates for a living response.

      *(Self-Correction on "Narrative Identity"):* The prompt specifically mentions "irreversible loss of narrative identity." This is perfect for Zhuangzi because he deconstructs narrative identity (the "I" is an illusion). I must emphasize this.

  8.  **Final Review:** Ensure the language evokes the Daoist style (paradox, fluidity) while maintaining analytical rigor regarding bioethics. (Proceed to generate output).

  **(Post-Drafting Thought):** Make sure to mention that for Zhuangzi, the "harm" in bioethics is a human construct. The Dao does not distinguish between a long life and a short one. This undermines the basis of non-maleficence in this context.

