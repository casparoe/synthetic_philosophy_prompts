  ### 4. The Tie-Breaker Test

  You asked if the "whole universe rotating rigidly" pair is the sharpest test. **It is not.**
  *   **Scenario:** Universe A (Static) vs. Universe B (Everything rotating together).
  *   **Problem:** In both Newtonian and Local State frameworks, this results in **Different**. In Newtonian physics, it rotates relative to Absolute Space. In Local State physics, the centrifugal force creates internal stress/bulging in all objects. Both rules predict "Different," so it doesn't separate them.

  To separate **Local State Realism** (her likely rule) from **Newtonian Substantivalism** (the runner-up), you need a case where Absolute Space changes but Local State does not.

  **The Sharpest Test: Universal Scaling (Weyl Scaling)**
  *   **Universe A:** Standard physics.
  *   **Universe B:** Overnight, every length in the universe (atoms, rulers, space itself) doubles in size. All ratios remain identical.
  *   **Newtonian Prediction:** **Different.** (Objects occupy different absolute volumes of space).
  *   **Local State Prediction:** **Same.** (No internal ratio or stress has changed; the change is undetectable from within).
  *   **Why it works:** She already rejected Absolute Position (Case 1) and Absolute Velocity (Case 2). This tests if she accepts Absolute *Scale*. If she says "Same," she is a pure Relationalist/Localist. If she says "Different," she secretly holds onto a Substantivalist container that has a metric scale.

  **Alternative Test: The Einstein Elevator**
  *   **Universe A:** A box accelerating through empty space (Force).
  *   **Universe B:** A box sitting stationary on a planet (Geometry/Gravity).
  *   **Local State Prediction:** **Same.** (Equivalence Principle: local measurements are identical).
  *   **Newtonian Prediction:** **Different.** (One is inertial + force, one is non-inertial).
  *   **Why it works:** It tests if she privileges the *cause* (Newton) or the *manifest state* (Her Rule). Given her reasoning on velocity ("isn't a property"), she likely privileges the state, so she should say **Same**.

