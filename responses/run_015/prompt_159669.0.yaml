  **C. Local State Realism / Phenomenalism (The Winner)**
  *   *Rule:* Two descriptions are the "same world" if and only if the **intrinsic, local physical state of all matter** is identical. Kinematic shifts (position, velocity, time) that leave local states unchanged are irrelevant. Dynamic shifts (acceleration, rotation) that alter local states (stress, shape, tension) are real differences.
