      *   *Check:* Did I address the "time of experience"? Yes, this is crucial. The Orwellian view assumes a true timestamp exists. The Stalinesque view says the timestamp is part of the content.
      *   *Check:* Did I commit? Yes, I must avoid hedging too much at the end.
