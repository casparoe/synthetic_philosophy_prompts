  The summary conflates strategic prescriptions with axiological claims and misrepresents longtermism as lexical rather than expected-value based.

  *   **Axiological vs. Strategic:** The claim extinction prevention is the "only moral priority" mistakes the *value* (future lives count) for the *action*. Strong longtermism argues the future matters most, but safeguarding it often requires maintaining present stability, contradicting the summary's assertion that we should "defund global health."
  *   **Expected-Value vs. Prediction:** Dismissing the view because "nobody can predict 500 years out" misunderstands decision theory. Longtermism uses expected value under uncertainty, not specific prophecy; the 10^58 figure illustrates potential scale to weigh probabilities, not a forecast requiring precise knowledge of specific future states.
  *   **Domination vs. Lexical Priority:** Stating saving someone today is "morally worthless" imposes lexical priority, which is not standard. Future value *dominates* cost-benefit analyses due to scale, but present suffering retains non-zero weight. Consequently, the "sci-fi" dismissal fails because the argument rests on structural uncertainty and value scale, not specific sci-fi predictions.
