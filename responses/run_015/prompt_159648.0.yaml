      *   *The Killer Requirement:* **Capacity Awareness / Ranking Utility.** Most vendors sell binary classifiers (Risk/No Risk). Procurement for scarce benefits requires *ranking*. If the tool can't justify why Person A (rank 50) got it over Person B (rank 51), the fairness claim is hollow. This kills most off-the-shelf risk scores.

