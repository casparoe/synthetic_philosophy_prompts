answer: |-
  Here is a specification for a fairness clause in a public procurement contract, designed for a tool allocating scarce benefits (like reentry program slots). It treats fairness as an engineering constraint, not a marketing claim.

  ### The Procurement Spec: Five Requirements

  **1. Welfare Monotonicity (The "No Leveling Down" Clause)**
  *   **Requirement:** Adjustments made to satisfy fairness metrics must not reduce the total number of successful outcomes (e.g., people who complete the program without reoffending) compared to the unadjusted model, unless explicitly authorized as a trade-off.
  *   **Case:** A vendor can equalize error rates between groups by adding random noise to the scores, making the tool useless for everyone. This requirement forbids satisfying fairness by destroying utility.
  *   **Status:** Non-negotiable.

  **2. Intersectional Robustness (The "No Gerrymandering" Clause)**
  *   **Requirement:** The fairness metric must hold for the protected classes named in the contract *and* for any logically constructed subgroup comprising at least 5 percent of the population (e.g., "Black women over 40").
  *   **Case:** A tool can be fair for "Race" and fair for "Gender" but systematically discriminate against "Black Women." This prevents vendors from slicing the data too thinly to hide bias.
  *   **Status:** Non-negotiable, but with a sample-size safety valve.

  **3. Asymmetric Error Costing (The "Burden vs. Benefit" Clause)**
  *   **Requirement:** The contract must define the relative cost of a False Positive versus a False Negative. For a benefit (housing), excluding a deserving person is costlier than including an undeserving one. For a burden (policing), the reverse applies.
  *   **Case:** Mathematical parity treats all errors equally. Policy does not. If you are giving away slots, you care about False Negatives (missing someone who would succeed). If you are denying parole, you care about False Positives (releasing someone who will reoffend).
  *   **Status:** Non-negotiable policy definition.

  **4. Capacity Awareness (The "Scarcity" Clause)**
  *   **Requirement:** The system must be validated as a *ranking* mechanism, not a *threshold* mechanism. It must demonstrate that the marginal candidate selected in Group A is comparable in expected outcome to the marginal candidate selected in Group B.
  *   **Case:** Most tools output a risk score cut-off (e.g., "score above 50 gets help"). But if you only have 100 slots, you need to know that the 100th person chosen is the best available, regardless of group. Parity at the threshold doesn't guarantee fairness in the ranking.
  *   **Status:** Non-negotiable for allocation problems.

  **5. Static Validity Declaration (The "Feedback" Clause)**
  *   **Requirement:** The vendor must declare the model valid only for the population distribution present at the time of training. Any deployment that alters the underlying base rates (e.g., policing more in a neighborhood increases recorded crime there) voids the warranty.
  *   **Case:** You cannot contractually guarantee stability against feedback loops without continuous simulation. This clause forces the agency to acknowledge that the tool expires when the world changes.
  *   **Status:** Preference (practically unenforceable as a hard constraint, but necessary for liability).

  ### The Impossibility Warning

  **Joint Unsatisfiability:**
  You cannot demand **Requirement 1 (Welfare Monotonicity)**, **Requirement 2 (Intersectional Robustness)**, and **Equal Error Rates** simultaneously if the base rates of success differ between groups. This is the mathematical impossibility result you know.

  If the contract demands Equal False Positive Rates *and* Equal False Negative Rates *and* Calibration, the vendor *will* breach the contract unless the groups happen to have identical success rates. The contract must force the procurement officer to choose *one* primary fairness metric (e.g., "Calibration is primary, Error Rate Parity is secondary") and explicitly accept the violation of the others. Demanding all of them is not rigorous; it is incoherent.

  ### Your Four Concerns: Load-Bearing or Prejudice?

  All four of your recurring concerns are **load-bearing**. None are merely political demands in disguise.

  1.  **Leveling Down:** This is a mathematical necessity. Without a utility constraint, fairness metrics are trivially satisfiable by randomization. It is a requirement for the tool to have *value*, not just fairness.
  2.  **Slicing (Subgroups):** This is load-bearing. It addresses the "fairness gerrymandering" problem. If a metric doesn't degrade predictably when you slice the data, it is statistically fragile and legally vulnerable.
  3.  **Feedback Loops:** This is load-bearing but operationally difficult. A static contract cannot fix a dynamic problem. However, ignoring it makes the contract a lie. The requirement here isn't to solve it, but to acknowledge the expiration date of the model's validity.
  4.  **Burden vs. Benefit:** This is the most critical load-bearing distinction. Mathematically, a False Positive is just a 1 instead of a 0. Ethically and legally, denying housing is different from denying a tax credit. The loss function must change, or the math is solving the wrong problem.

  ### How The Families Stack Up

  **Error-Rate Parity:** Fails the **Leveling Down** test. You can satisfy this by adding noise. It also struggles with **Capacity Awareness** because it focuses on thresholds, not rankings. It is the easiest to audit but the easiest to game.

  **Calibration Within Groups:** Passes **Leveling Down** (usually preserves utility) but fails **Burden vs. Benefit**. A calibrated score of 50 percent risk means the same thing regardless of whether the stakes are high or low. It also often fails **Intersectional Robustness** because calibration is brittle when groups overlap.

  **Causal/Counterfactual Approaches:** Best at **Burden vs. Benefit** because they model the intervention's effect. However, they generally fail **Static Validity** in a procurement context because they are incredibly hard to verify or audit without controlled experiments that city agencies cannot run.

  ### The Killer Requirement

  The single requirement that knocks out the most of what vendors actually sell is **Capacity Awareness (Requirement 4)**.

  Most vendors sell risk assessment tools designed for *triage* (high risk vs. low risk), not *allocation* (ranking the top 10 percent). They validate their models on threshold-based metrics (accuracy, AUC, parity at a cut-off). They do not validate that the *marginal* candidate selected from one group is comparable to the *marginal* candidate from another. If your contract demands proof that the tool optimizes the specific scarce resource under a capacity constraint, rather than just predicting risk accurately, most off-the-shelf risk scores become non-compliant. They are built to predict the future, not to divide a pie.
