      *   **Key Constraints:**
          *   Identify non-negotiables vs. preferences.
          *   Flag jointly unsatisfiable sets (the "impossibility" angle is crucial).
          *   Address four specific recurring concerns (leveling down, subgroup stability, feedback loops, burden vs. benefit/capacity).
          *   Evaluate standard fairness families against this spec.
          *   Identify the single requirement that knocks out the most vendor claims.
          *   **Style:** American English, plain language, no notation, no reading lists/citations.
          *   **Format:** Requirements list + Analysis of the four concerns + Brief evaluation of families + The "killer" requirement.
          *   **Tone:** Professional, direct, insightful, acknowledging the tension between math and policy.

  2.  **Deconstruct the Four Concerns:**
      *   *Leveling Down:* Can I game the metric by making everyone worse? (e.g., equalizing error rates by randomizing predictions). *Verdict:* Real requirement. A fairness metric must be tied to utility or welfare.
      *   *Subgroup Stability (Slicing):* Can I game the metric by choosing specific demographic buckets? (e.g., fair for "Black/White" but not "Black Women"). *Verdict:* Real requirement (Intersectionality/Robustness).
      *   *Feedback Loops:* Does the model change the world it measures? (e.g., policing more in an area increases crime stats there). *Verdict:* Real requirement (Dynamic Fairness), but often ignored in static contracts.
      *   *Burden vs. Benefit/Capacity:* Is this taking something away or giving something? Does a fixed number of slots change the math? *Verdict:* Real requirement. Allocation under scarcity is fundamentally different from binary classification.

  3.  **Drafting the Procurement Spec (The "Requirements List"):**
      *   Need to structure this like a contract appendix.
      *   *Requirement 1: Welfare Monotonicity.* (Addresses leveling down). The score must correlate with actual success/outcome, not just statistical parity.
      *   *Requirement 2: Intersectional Robustness.* (Addresses slicing). Fairness must hold for reasonable subgroups, not just the broad protected classes.
      *   *Requirement 3: Consequential Distinction.* (Addresses burden/benefit). False positives and false negatives have different costs depending on whether you're giving a benefit (housing) or imposing a burden (parole denial).
      *   *Requirement 4: Capacity Awareness.* (Addresses scarcity). If there are 100 slots and 1000 people, ranking matters more than thresholding.
      *   *Requirement 5: Static Validity.* (Addresses feedback). The model must be valid on the data *at the time of decision*, acknowledging it can't predict its own impact without simulation. (This is the hard one to contract).

  4.  **Analyzing Joint Unsatisfiability (The "Impossibility" Angle):**
      *   The user knows the Chouldechova/Berk impossibility results. I need to frame this in contract terms.
      *   *The Conflict:* You cannot demand Equal Error Rates *and* Calibration *and* Perfect Accuracy simultaneously if base rates differ.
      *   *The Contractual Trap:* If the contract demands "Equal False Positive Rates" AND "Calibration within Groups," the vendor *must* fail one unless base rates are equal.
      *   *Recommendation:* The contract must force a *choice* of priority, not demand all of them.

  5.  **Addressing the Four Specific Concerns (Load-bearing vs. Prejudice):**
      *   *Leveling Down:* Load-bearing. Without this, "fairness" is just noise.
      *   *Slicing:* Load-bearing. This is the "fairness gerrymandering" problem.
      *   *Feedback:* Load-bearing, but practically hard to enforce in a static contract. It requires ongoing audit, not just pre-deployment validation.
      *   *Burden/Benefit:* Load-bearing. This changes the loss function.
      *   *Conclusion:* None are mere prejudice. All are mathematically substantive.

  6.  **Evaluating Fairness Families:**
      *   *Error-Rate Parity:* Fails leveling down (can add noise). Fails capacity (doesn't rank well).
