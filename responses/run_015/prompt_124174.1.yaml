          *   *Foxconn Context:* It's fragmented. Foxconn owns the factory (means of production) and pays wages. Apple owns the IP, design, and brand, and captures the bulk of surplus value via pricing power.
          *   *Analysis:* It's a *joint* capitalist function. Foxconn is the *immediate* employer (disciplinary power), Apple is the *ultimate* beneficiary (surplus value extraction). This creates a diffusion of responsibility.

      *   **Alienation (Four Dimensions):**
          1.  *From Product:* Workers build iPhones they can't afford. The object confronts them as an alien power (status symbol vs. wage labor).
          2.  *From Process:* Extreme repetition (making one screw all day). No craft, no autonomy.
          3.  *From Species-Being:* Humans create creatively; this work reduces them to machines. Dormitory life extends this control beyond the factory floor.
          4.  *From Other Workers:* Competition for shifts/overtime, isolation in dorms, language barriers (migrant workers), prevented from organizing.

      *   **Subsumption (Formal vs. Real):**
          *   *Formal:* Capital takes over existing labor processes.
          *   *Real:* Capital revolutionizes the labor process to maximize efficiency.
          *   *Foxconn:* Definitely *Real Subsumption*. Taylorism on steroids. Movements timed, breaks regulated, military-style management. The labor process is designed *by* capital *for* capital.

      *   **Exploitation (Surplus Value):**
          *   Workers paid less than the value they create. Apple captures the lion's share. Foxconn survives on thin margins, squeezing labor intensity to maintain profit.

  3.  **Identify Theoretical Breakdowns/Limits (The Critical Turn):**

      *   **Psychological Crisis vs. Economic Exploitation:**
          *   Marx focuses on *structural* economic coercion (starvation if you don't work).
