      *   *Presupposition 1: The Economic Unit.* The state views a romantic couple as a single economic unit. The presumption is *pooling of resources*.
      *   *Presupposition 2: Duty of Support.* There is a legal/philosophical underpinning that partners owe each other financial support, unlike flatmates or (adult) children/parents.
      *   *Presupposition 3: Administrative Efficiency vs. Accuracy.* It's easier to assume pooling than to audit bank accounts every month.
      *   *The Asymmetry (Income vs. Debt):* The state claims a share of the upside (income available for need) but doesn't take on the downside (debt liability). This is because benefits are means-tested on *ability to pay*, not *net worth* in a balance sheet sense. Debt is a liability, but income is flow. The state says "You have access to this flow," not "You own this balance sheet."
      *   *Burden of Proof:* Welfare is a privilege/contract. The claimant must prove eligibility. Non-disclosure is fraud because it violates the contract of full disclosure.

  3.  **Analyze the Alternative Proposal (Address + Time = Household):**

