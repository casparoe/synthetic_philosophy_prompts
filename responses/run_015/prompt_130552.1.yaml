      *   *Presupposition 2: Opt-Out Autonomy.* It shifts the default. Current rule: "If you look like a couple, you are a couple." Proposal: "If you live together, you are a household, unless you say otherwise."
      *   *Presupposition 3: Need is Household-Based.* It leans harder into the idea that "need" is calculated per roof, not per person, but allows for individual exceptions.

  4.  **Compare "Need": Person vs. Household:**

      *   *Current Rule:* Need is individual *unless* you enter a specific relationship (marriage/cohabitation). Then it becomes household. It distinguishes between "chosen interdependence" (partners) and "convenience" (flatmates).
