answer: |-
  This is a sharp observation of a tension that exists in almost all means-tested welfare systems (particularly in the UK, US, and similar common-law jurisdictions). The inconsistency you describe—where a boyfriend counts but a flatmate or parents do not—is not a bug in the code, but a feature of the underlying philosophy.

  Here is an analysis of what each rule presupposes about households, need, and responsibility.

  ### 1. The Current Rule: "The Normative Economic Unit"

  When the system deems your friend's boyfriend's income as available to her, it is not making a purely empirical guess about whether he actually hands her cash. It is making a **normative claim about the duty of support.**

  *   **Presupposition:** A romantic couple (married or cohabiting) constitutes a single moral and economic entity. The law presumes that by choosing to live together as a couple, you have entered a contract of mutual financial insurance. You *ought* to support each other before the state supports you.
  *   **Why not flatmates?** Flatmates are presumed to be a commercial arrangement. You share rent to save money, but you owe each other nothing beyond the lease.
  *   **Why not parents?** Adult children are legally independent. Parents *may* help, but they have no legal duty to do so. The state cannot compel them, so it cannot deem their money "available."
  *   **Why the asymmetry (Income vs. Debt)?** This is the most contentious part. The system presupposes that **income is a flow available for basic needs**, whereas **debt is a prior private contract.** When calculating "need," the state asks: "What resources can this household deploy to eat and stay warm?" It counts the boyfriend's wages because they *could* be used for food. It ignores his debts because the state does not view itself as responsible for clearing his private liabilities, nor does it want to disincentivize him from paying them. Essentially, the state claims a right to the *surplus* of the household for basic survival, but refuses to inherit the *deficits*.
  *   **The Fraud Burden:** Welfare is a contract of disclosure. The presupposition here is that the claimant is the only one who knows the "truth" of the relationship. The state cannot easily surveil bedrooms, so it places the legal onus on the citizen to declare when their status changes from "single" to "couple."

  ### 2. The Alternative Proposal: "The Physical Economic Unit"

  The proposal to treat any two adults sharing an address for six months as a household (unless they opt out) shifts the philosophical ground significantly.

  *   **Presupposition:** **Proximity implies economic integration.** This rule assumes that the primary driver of "need" is the cost of maintaining a physical space (rent, utilities, heating). If two people share a space for a significant time (6 months), they are likely achieving "economies of scale" (it costs less for two to live together than apart), regardless of whether they are lovers or friends.
  *   **The Opt-Out:** By requiring a signed declaration to keep finances separate, this rule presupposes that **financial separation is the exception, not the norm.** It treats the "household" as the default unit of welfare, and the "individual" as a special case that must be proven.
  *   **Administrative Efficiency:** This presupposes that checking addresses is easier than interrogating relationships. It removes the "are they sleeping together?" inquisition and replaces it with "are they on the lease?"

  ### 3. Person vs. Household: Where does "Need" live?

  This is the core philosophical divergence between the two models.

  **The Current Rule: Need is Individual, modified by Commitment.**
  *   **Philosophy:** You are entitled to support as an individual human being. However, if you enter a specific type of committed relationship (marriage/cohabitation), you voluntarily surrender some of that individual entitlement in exchange for the private support of your partner.
  *   **Implication:** The state respects the boundary between "public" and "private" life, but draws a hard line at romantic commitment. It says, "We support individuals, unless you have privately contracted someone else to support you."

  **The Alternative Proposal: Need is Household, modified by Separation.**
  *   **Philosophy:** Need is a function of the costs of running a home. If you share a home, you share the costs, therefore you share the need.
  *   **Implication:** This blurs the line between romantic and non-romantic support. It suggests that the state is less interested in your relationship status and more interested in your **cost of living.** It acknowledges that a single person in a two-bedroom flat has a different economic reality than a single person in a one-bedroom flat, regardless of who is in the other room.

  ### 4. Confidence and Uncertainty

  **Confidence Level: High (85%)**
  I am highly confident in the analysis of how these rules *operate* and the standard legal justifications provided by welfare agencies (e.g., DWP in the UK, SSA in the US). The distinction between "cohabiting as a couple" and "sharing accommodation" is a well-documented legal standard, as is the principle that benefit eligibility is based on "available income" rather than "net assets after debt."

  **Least Certain Part: The Intent Behind the Debt Asymmetry**
  I am least sure about the *philosophical coherence* regarding why debts are ignored.
  *   **My Claim:** I argued above that the state ignores debt because it views debt as a private liability and income as a public resource for survival.
  *   **The Uncertainty:** It is equally possible that this is not a philosophical stance but purely **administrative friction.** Verifying income is easy (pay stubs, tax data). Verifying debt is hard (credit cards, loans, informal borrowing). The rule might exist simply because it is too difficult for the bureaucracy to calculate net disposable income after debt servicing, so they default to gross income. Attributing a "philosophy" to this might be over-interpreting what is actually just bureaucratic convenience.

  ### Summary
  Your friend's situation feels unjust because the current rule prioritizes **relationship status** over **financial reality**. It assumes a duty of support exists because of romance, even if no money changes hands. The alternative proposal prioritizes **housing reality** over relationship status, assuming that sharing a roof creates a shared economy unless proven otherwise.

  The current system protects the privacy of flatmates and parents but invades the privacy of couples. The proposed system would standardize the definition of a household but would increase the administrative burden on friends/flatmates to prove they *don't* share money. Both systems ultimately agree on one thing: **The state is the payer of last resort.** It will only step in when all "expected" private resources (whether from a partner or a household) are deemed exhausted.
