  The mind is filled with synaptic noise,
  no ghost inside the machine of character.
  Action flows from environmental habit,
  not some fixed internal situation.

  Shift the weather, shift the situation,
  and you rewrite the moral habit.
  There is no anchor left for character,
  only a stimulus and a response.
  We mask the gap with talk of virtue,
  to quiet the unsettling noise.

  The signal degrades to pure noise,
  drowning out the language of virtue.
  A predictable, conditioned response,
  mistaken for a chosen habit.
  We project stability on character,
  while standing in the wind of situation.

  Is it will or just repeated habit?
  The data hums a low frequency noise.
  You cannot separate the situation,
  from the person claiming character.
  There is no pure moral response,
  only the shadow of a lost virtue.

  No free response can save virtue,
  through white noise and broken habit,
  where character is situation.
