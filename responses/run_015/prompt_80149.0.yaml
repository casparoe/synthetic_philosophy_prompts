prompt: |-
  Okay, so I've been reading about probability and decision making on my own for a few months now (no philosophy or math degree, just books and blog posts and a lot of overthinking), and I've landed on a view that I want to stress test before I start actually using it for real decisions. My position has two parts, and I think they go together. Part one: single number probabilities are mostly fake precision. When I ask myself "what's the chance this job offer works out," the honest answer is a range, like 40 to 70 percent, and I should treat that range as the real thing rather than pretening I have one exact number. I've seen this called "imprecise probabilities" or "credal sets" or something like that, and I think its basically right. Part two: when I have a range, I should only take an action if it's the best choice across the whole range, the "when in doubt, be safe" rule, which I think is called maxmin expected utility or something close to it. So basically I only move when I'm sure.

  Now I want you to play the role of a professional philosopher of probability who is very patient with self-taught readers and doesn't talk down to them. What I want is a map of what would count against this position, not a generic list of "here are the criticisms," but the real pressure points, ranked from "this is fatal and you should drop the view" all the way down to "this is just annoying but survivable." In particular, please think carefully about these: where do the bounds of the range come from in the first place, because if I'm the one picking the range, can't I just quietly widen it until my favorite action is the safe one, and does that make the whole thing a game I'm playing with myself? What even happens when I condition a whole range on new evidence, does it make sense to condition a set of probabilities, or do I just have to pick a number after all? And what happens after a lot of updates, do the ranges collapse back down to a point, or do they stay wide forever, and if they stay wide does that mean I can never stop being cautious? Also be honest with me about whether this position can even be stated without already smuggling a single number in somewhere, like, does "maxmin" secretly require me to have a lower bound that's just a number in disguise?

  Before you give the final ranked list, do a short brainstorm of the main families of objections so I can see you're not just pulling one angle out of thin air, and then organize the rest. And if you think one of these pressure points is actually a non-issue that I'm worrying about for no reason, say so plainly instead of just nodding along.
