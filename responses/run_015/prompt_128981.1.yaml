answer: |-
  Fund the effort to formally separate reputational lock-in from rational sunk-cost reasoning before touching the other two.

  This question is the upstream bottleneck because if the mechanisms are observationally equivalent within a model, the reputational twist is merely a narrative overlay on classic theory, rendering any subsequent normative distinctions or scaling analyses derivative rather than novel. The dependency chain runs from separability to normative status to scaling dynamics: you cannot determine if escalation is pathological versus rational under observer effects if you haven't first proven the observer effect constitutes a distinct structural constraint, and you cannot reliably model how that constraint scales in collectives until you know whether it is a unique variable or a repackaged cost function.

  I would shift priority to the scaling question only if you produced an empirical demonstration showing that collective decision-making environments generate escalation patterns that formal models classify as sunk-cost but observers consistently punish as weakness, proving that context reveals the mechanism where axioms fail.
