answer: |-
  This is an exceptionally sharp methodological critique. You have identified two distinct but related failure modes in the standard Inside/Outside view dichotomy (originally formulated by Kahneman and Lovallo, 1993) that are often glossed over in the prescriptive literature on forecasting and decision-making.

  To answer your primary question directly: **No, neither phenomenon has a single, canonical name that captures the precise mechanism you are describing.** They are discussed in fragments across behavioral economics, econometrics, and epistemology, but your formulation isolates specific structural problems that existing terminology treats as peripheral or conflates with other biases.

  Below, I break down the two phenomena, situate them in the existing literature, distinguish them from their nearest neighbors (as you requested), and propose precise terminology suitable for a methods section.

  ### Phenomenon 1: The Contaminated Baseline
  **Your Description:** The "outside view" distribution is an aggregate of outcomes produced by agents using the "inside view." Therefore, the baseline inherits the cognitive bias it is meant to correct.
  **Existing Literature:** This is adjacent to the **Planning Fallacy** (Kahneman & Tversky, 1979) and **Reference Class Forecasting** (Flyvbjerg, 2006). Flyvbjerg argues for using empirical data to correct optimism, assuming the data is "objective." You are pointing out that the data generation process (DGP) itself is subjective/biased.
  **Distinctions:**
  *   **Not Survivorship Bias:** You correctly note failures are counted. The issue is not *who* is in the sample, but *how their outcomes were produced*.
  *   **Not the Lucas Critique:** The Lucas Critique (1976) concerns structural parameters changing when *policy* changes. Here, the distortion exists even without policy intervention or knowledge of the base rate. It is a feature of the agents' cognitive architecture, not their reaction to a rule.
  *   **Not Goodhart's Law:** Goodhart's Law concerns measurement distortion when a metric becomes a *target*. Here, the metric is distorted by the *process* of planning, not by the incentive to game the metric.

  **Proposed Term:** **Endogenous Baseline Contamination**
  **Definition:** A structural bias in which the statistical baseline (outside view) is endogenous to the cognitive biases of the agents generating the data points, such that the baseline encodes the aggregate of the individual errors it is intended to correct.

  **Boundary Conditions & Limits:**
  *   **Pessimistic Contamination:** Yes, this can push the outside view in the pessimistic direction. If the reference class consists of agents suffering from *loss aversion* or *strategic under-promise/over-deliver* behaviors (common in grant applications or budgeting), the baseline will be systematically inflated (longer times, higher costs). The contamination tracks the *direction* of the dominant cognitive bias in the population, not just optimism.
  *   **The Limit Case:** If everyone in the reference class adopted the outside view, the bias would not necessarily vanish; it would reach an **Equilibrium Bias**. If the "true" time is $T$, and the bias is $b$, the baseline becomes $T + b$. If agents correct for $b$, they aim for $T$. But if the correction is imperfect or if the structural constraints (e.g., IRB approval times, field access) that caused the original delay remain, the baseline stabilizes at a new equilibrium. It does not guarantee convergence to truth, only convergence to a stable bias.
  *   **Unknown Base Rates:** The contamination exists regardless of agent knowledge. It is an ontological feature of the data, not an epistemological feature of the agent's access to the data.

  ### Phenomenon 2: The Selection Regress
  **Your Description:** Selecting the appropriate reference class requires a judgment of similarity ("Is my case like *these* or *those*?"). This judgment is itself an "inside view" operation, meaning the outside view relies on the inside view to function.
  **Existing Literature:** This is a specific, pragmatic instantiation of **The Reference Class Problem** (Reichenbach, 1949; Hájek, 2007). Hájek argues that any individual belongs to infinite reference classes with different probabilities. The standard response is "choose the narrowest relevant class." You are pointing out that *relevance* is determined by the very narrative judgment the outside view is supposed to bypass.
  **Distinctions:**
  *   **Not Ordinary Reference Class Problem:** The standard problem is logical (infinite classes exist). Your problem is *epistemic and procedural* (the *selection mechanism* is biased).
  *   **Not Epistemic Modesty:** Epistemic modesty suggests deferring to external evidence when you know your judgment is flawed. Your critique shows that *identifying* the relevant external evidence requires the flawed judgment. It is a regress problem, not a humility problem.

  **Proposed Term:** **The Classification Regress** (or **The Similarity Judgment Regress**)
  **Definition:** The methodological paradox wherein the application of an outside view requires a prior inside-view judgment to determine class membership, thereby reintroducing the subjective bias the outside view was intended to eliminate.

  **Boundary Conditions & Limits:**
  *   **Does it bottom out?** It bottoms out only if there is an *exogenous* classification rule (e.g., "All dissertations in Political Science," regardless of topic). But as you note, broader classes reduce predictive power. The regress stops only when the user accepts a classification rule that is *arbitrary* rather than *judged*, which sacrifices accuracy for objectivity.
  *   **Separability:** This suggests the Inside and Outside views are not binary opposites but **entangled**. You cannot have a "pure" outside view because the "outside" is constructed by carving up the world using "inside" tools.

  ### Unifying Theory: The Endogeneity of the Outside View
  You asked if these are instances of one underlying problem. **Yes.** Both phenomena demonstrate that the "Outside View" is not a "View from Nowhere" (Nagel, 1986). It is a **Socially Constructed Baseline**.

  *   **Phenomenon 1** shows the *data* in the outside view is socially constructed (by biased agents).
  *   **Phenomenon 2** shows the *categories* of the outside view are socially constructed (by biased classifiers).

  Together, they constitute **The Endogeneity of the Outside View**. This term captures the core insight: the "external" benchmark is internal to the system of reasoning agents.

  ### Recommendations for Your Methods Section
  Since you need terms that will hold up under objection, I recommend using the existing literature where it anchors you, and your coined terms where you extend it.

  1.  **For Phenomenon 1:** Cite **Flyvbjerg (2006)** on Reference Class Forecasting to establish the standard method. Then introduce **Endogenous Baseline Contamination** to describe the limitation.
      *   *Phrasing:* "While Reference Class Forecasting mitigates individual planning fallacies, it remains vulnerable to *Endogenous Baseline Contamination*, where the reference distribution itself aggregates the systematic biases of prior actors."
      *   *Defense:* This distinguishes you from the Lucas Critique (no policy change required) and Goodhart's Law (no targeting required).

  2.  **For Phenomenon 2:** Cite **Hájek (2007)** on the Reference Class Problem. Then introduce **The Classification Regress**.
      *   *Phrasing:* "Selecting a reference class requires a judgment of relevant similarity, inviting a *Classification Regress* where the inside view is not eliminated but relocated to the stage of class selection."
      *   *Defense:* This distinguishes you from general epistemic modesty; you are identifying a structural limit to the method, not just a psychological difficulty.

  3.  **For the Unified Critique:** Use **Entangled Vantage Points**.
      *   *Phrasing:* "These two phenomena suggest that Inside and Outside views are not separable methodologies but *entangled vantage points*; the outside view is constructed via inside-view operations on inside-view-generated data."

  ### Relevant Citations for Your Bibliography
  *   **Kahneman, D., & Lovallo, D. (1993).** "Timid Choices and Bold Forecasts: A Cognitive Perspective on Risk Taking." *Management Science*. (The origin of the Inside/Outside distinction).
  *   **Flyvbjerg, B. (2006).** "From Nobel Prize to Project Management: Getting Risks Right." *Project Management Journal*. (The application of outside view to planning).
  *   **Hájek, A. (2007).** "The Reference Class Problem is Your Problem Too." *Synthese*. (The logical limit of reference classes).
  *   **MacKenzie, D. (2006).** *An Engine, Not a Camera: How Financial Models Shape Markets*. (SSS/Performativity literature; useful for the argument that models/data construct the reality they measure).
  *   **Nagel, T. (1986).** *The View from Nowhere*. (Philosophical grounding for the impossibility of a purely objective stance).

  ### Summary of Terms for Your Glossary
  | Phenomenon | Proposed Term | Nearest Neighbor | Key Distinction |
  | :--- | :--- | :--- | :--- |
  | **1. Biased Data** | **Endogenous Baseline Contamination** | Lucas Critique / Goodhart's Law | Occurs without policy change or targeting; bias is in the *generation* of the data, not the reaction to it. |
  | **2. Biased Selection** | **The Classification Regress** | The Reference Class Problem | Focuses on the *judgment required to select* the class, not just the existence of multiple classes. |
  | **3. Unified** | **Entangled Vantage Points** | Epistemic Modesty | Argues the views are structurally dependent, not just that the agent should be humble. |

  This framework should allow you to deploy the critique without collapsing into general skepticism. You aren't saying "forecasting is impossible"; you are saying "the outside view is a corrective tool with its own error structure that must be modeled." That is a robust position for a political science methods section.
