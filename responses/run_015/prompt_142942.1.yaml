answer: |-
  In a behavioral neuroscience lab studying rodent fear conditioning, two groups confront anomalous data where anisomycin, a protein synthesis inhibitor, fails to erase memory after 24 hours in high-intensity shock trials. Programme A, committed to the hard core that all long-term consolidation universally requires protein synthesis, protects this core by adjusting the protective belt: they reclassify the 24-hour high-intensity memory as 'stabilized intermediate' rather than 'long-term,' positing a distinct reconsolidation vulnerability window at 48 hours. Subsequent experiments confirm protein sensitivity at this new 48-hour mark, but critics argue that by shifting the definition of 'long-term' from a temporal marker to a mechanistic one, A has surreptitiously altered its hard core rather than shielding it. Programme B, holding that multiple memory systems exist with varying molecular requirements, simply adds an exception clause that high-intensity shocks bypass the protein-dependent system entirely, offering no new testable implications beyond explaining the anomaly.

  **Lakatosian Analysis**
  For Lakatos, the verdict hinges on the problem shift. Programme A is theoretically progressive because the modification to the protective belt yielded a novel fact (the 48-hour window) that was empirically confirmed. Even if the boundary between core and belt is fuzzy, the heuristic power of the programme is expanding. Programme B is degenerating; their move is purely ad hoc, explaining the anomaly without generating new predictions. Lakatos would tolerate the ambiguity in Programme A's core definition as long as the programme continues to predict novel facts, viewing the hard core as protected by methodological decision rather than strict logical boundary.

  **Popperian Analysis**
  A strict Popperian would be suspicious of both. The initial anomaly should have falsified Programme A's universal claim. A's redefinition of "long-term" risks being a conventionalist stratagem—an immunizing maneuver designed to save the theory from refutation rather than engaging with risk. However, Popper allows theory modification if it increases testability. Since A predicted the 48-hour window, a Popperian might grant them a reprieve, but only because the new prediction was risky and corroborated. Programme B is straightforwardly ad hoc and would be rejected for decreasing testability.

  **Philosophical Weight**
  The novel prediction is carrying the philosophical weight, not the core/belt ambiguity. Lakatos's framework is designed to handle the ambiguity; he acknowledges that distinguishing core from belt is often a retrospective judgment. What matters is whether the move leads to new knowledge. If Programme A had made the tweak but failed to find the 48-hour effect, Lakatos would deem them degenerating regardless of whether the tweak was "core" or "belt." The ambiguity is noise; the empirical progress is the signal.

  **Stripping the Ambiguity**
  If we strip out the ambiguity—making it clear that A's redefinition is purely auxiliary—the case still works for Lakatos. It actually strengthens his position by removing the critic's leverage. For a Popperian, it makes A's move more acceptable, shifting it from "suspicious redefinition" to "legitimate refinement." The comparison holds because the differentiator is the novel prediction, not the semantic boundary dispute.

  **Programme B's Defence**
  A defender of Programme B would attack the comparison by challenging the novelty of Programme A's prediction. They might argue that the 48-hour window was already implicit in existing data or that A's redefinition makes the two programmes incommensurable—they are no longer talking about the same phenomenon ("long-term memory"), so A hasn't solved B's problem, just changed the subject. B would argue that their own hard core is more honest because it admits heterogeneity upfront, whereas A is forcing nature into a universalist box via semantic gymnastics.
