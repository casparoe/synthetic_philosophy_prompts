answer: |-
  # JOINT STATEMENT: ADVERSARIAL COLLABORATION ON CONSCIOUSNESS THEORY

  ## PART I: AGREED CLAIMS
  *Both sides endorse the following propositions. Items are tagged as **[Real]** (substantive empirical/metaphysical agreement) or **[Verbal]** (agreement to clarify terminology without resolving underlying metaphysics).*

  1.  **[Real]** Neuron count alone does not determine conscious capacity; any viable theory must explain why the cerebellum (containing ~80% of brain neurons) contributes minimally to reported experience compared to the cortex.
  2.  **[Real]** Cases of disconnection (e.g., split-brain, callosotomy) are the primary testing ground for theories of conscious unity; confirmation in intact brains is insufficient to distinguish competing accounts.
  3.  **[Real]** Attributing experience to simple systems (e.g., thermostats, logic grids) constitutes a theoretical cost. Even if one side accepts this cost as necessary, both agree it requires explicit justification rather than dismissal.
  4.  **[Real]** A theory relying on a quantity that is in-practice uncomputable for realistic biological systems faces a significant scientific burden, regardless of whether the quantity is metaphysically fundamental.
  5.  **[Real]** Consciousness supervenes on causal properties, not merely input-output behavior; a perfect functional duplicate made of different substrate raises genuine questions about experience, not just report.
  6.  **[Real]** Any theory must explain why consciousness diminishes during deep sleep or general anesthesia despite sustained neural activity and preserved anatomical connectivity.
  7.  **[Verbal]** We agree to distinguish "phenomenal experience" (what it is like to be the system) from "global access" (information available for report and reasoning), though we disagree on whether these can come apart empirically.
  8.  **[Verbal]** We agree to stop fighting over the word "integration" until we specify whether we mean causal interdependence, information sharing, or functional coordination.
  9.  **[Verbal]** We agree that current neuroscientific data is correlational; disagreement remains on whether IIT claims to offer constitutive explanations or merely high-level correlations.

  ## PART II: DISAGREEMENTS TABLE

  | Crux | IIT Formulation | Critic Formulation | Agreed Test / Case | Predictions (IIT / Critic) | Who Moves If Wrong? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Verbal Dispute (Experience vs. Access)** | Phenomenology exists independently of report; a system can be conscious without being able to report it. | Much of what we call "consciousness" is actually global access; pure phenomenology without access is ill-defined or unverifiable. | **No-Report Paradigms:** Binocular rivalry or masking where neural markers of experience diverge from markers of report. | **IIT:** Experience persists without report markers.<br>**Critic:** Without report markers, claims of experience are unverifiable guesses. | **Critic:** If specific neural signatures of phenomenology are validated without access. |
  | **2. Throttled-Bridge (Unity vs. Split)** | Consciousness is unified only where causal integration is high. If the bridge between hemispheres is throttled below a threshold, one subject becomes two. | Unity is graded or functional. Reducing bandwidth degrades the single subject's capacity but does not spontaneously generate a second subject. | **Variable Callosotomy:** Simulated or lesion-induced reduction of interhemispheric bandwidth to near-zero with high latency. | **IIT:** Sharp threshold where one subject becomes two distinct streams.<br>**Critic:** Gradual degradation of a single subject's coherence. | **IIT:** If unity degrades gradually without evidence of splitting. |
  | **3. Duplicate-Graft (Causal Redundancy)** | **Exclusion Principle:** Experience is singular and unique. A causally redundant duplicate slab adds no causal power, so experience does not double. | **Substrate Counting:** If the physical substrate doubles, experience should double (or at least not be ruled out). Exclusion is an ad hoc fix to avoid absurdity. | **Thought Experiment:** A cortex slab perfectly duplicated in lockstep, contributing nothing new downstream. | **IIT:** Experience remains single (causal power is unchanged).<br>**Critic:** Experience doubles (substrate is doubled). | **IIT:** If intuition strongly favors doubling despite causal redundancy. |
  | **4. Grid-of-Gates (Panpsychism)** | High Φ implies experience. If a grid of logic gates has high Φ, it has experience. This is a feature (panpsychism), not a bug. | Attributing experience to a grid is a *reductio ad absurdum*. It shows the theory captures correlation, not constitution. | **Theoretical Consistency:** Analyzing whether simple combinatorial systems satisfy the theory's axioms. | **IIT:** Accepts grid consciousness as true.<br>**Critic:** Rejects grid consciousness as false. | **IIT:** If the intuition becomes untenable even for proponents.<br>**Critic:** If alternative theories also imply panpsychism. |
  | **5. Zap-and-Measure (PCI Proxy)** | Perturbational Complexity Index (PCI) tracks Φ and thus consciousness. High PCI indicates high causal power available for experience. | PCI tracks arousal/complexity, not consciousness specifically. It correlates with readiness, not experience itself. | **Dissociation Cases:** States with high PCI but no report (e.g., specific seizures, ketamine states) or vice versa. | **IIT:** High PCI = Conscious.<br>**Critic:** High PCI = Aroused/Complex, not necessarily conscious. | **IIT:** If high PCI is found in clearly unconscious states (e.g., certain epileptic automatisms). |

  ## PART III: REMAINING CONCESSIONS

  **To be signed by both sides upon conclusion of the session.**

  **IIT Side Concedes:**
  That the panpsychist implications of the theory are a heavy metaphysical lift that cannot be dismissed as mere terminology; that current Φ measures are proxies and not direct calculations; and that if the "grid" intuition fails for most observers, the theory loses explanatory power regardless of its internal consistency.

  **Critic Side Concedes:**
  That functionalism has not solved the hard problem and that correlation is not trivial; that report-based measures are insufficient to rule out consciousness in non-communicative patients; and that dismissing the cortex-versus-cerebellum contrast requires a positive alternative account, not just skepticism of IIT.

  **Joint Concession:**
  We agree that the disagreement is not merely verbal, but that verbal precision is currently preventing empirical resolution. We commit to treating the "Throttled-Bridge" and "PCI Dissociation" cases as the primary arbiters for future funding and research focus.
