  #### THE PEOPLE-ANALYTICS OBJECTION (HARDEST TO ANSWER)

  **Tag:** PREDICTIVE UTILITY
  **Why it's hard:** It challenges the *purpose* of your talk. Your colleague argues from **Instrumentalism** (truth is what works); you argue from **Realism** (truth is what exists).
  **The Trap:** The room will laugh because the colleague is "practical" and you are "theoretical."
  **The Defense:** You must frame "metaphysics" as "engineering robustness." Don't say "I want truth." Say "I want models that don't break when the next historical shock happens." Frame the colleague's dashboards as technical debt. This translates the philosophical objection into a business risk they understand.

