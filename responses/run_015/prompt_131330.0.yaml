  #### THE PRIVATE HOPE QUESTION

  **Your Guess:** "Can the exposure-bundle story distinguish a cohort effect from an age effect at all, given that exposures are themselves age-graded?"
  **Assessment:** You are correct; this is the dangerous one. It is effectively a specific version of the **APC IDENTIFICATION** objection (#1) and **AGE-GRADED CONFOUNDING** (#3).
  **Why it sinks you:** If exposures are perfectly age-graded (e.g., everyone sees the tech boom at age 20), then "exposure" and "age" are collinear. Your test cannot distinguish them.
  **Preparation:** Be ready to admit that *perfectly* age-graded exposures cannot be disentangled from age without external variance (e.g., comparing countries where the exposure happened at different times). If you claim you can separate them in a single cross-section without that variance, the demographers will catch you.

