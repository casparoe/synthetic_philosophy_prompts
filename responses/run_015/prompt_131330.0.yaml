  #### STRATEGY: CONCEDE VS. HOLD

  **Concede Early (Buys Credibility):**
  *   **Cross-National Stipulation:** Acknowledge immediately that "Millennial" is a US-historical label. This disarms the sociologists and demographers who hate the universalizing of US history.
  *   **Generation vs. Cohort:** Explicitly state you are not doing Mannheimian sociology. You are analyzing data engineering labels. This prevents the sociologist from spending 10 minutes correcting your definitions.

  **Hold the Line (Costs Credibility but Saves Thesis):**
  *   **Predictive Utility:** Do not concede that metaphysics is irrelevant to business. If you concede this, your talk becomes purely academic and your colleague wins. Argue that brittle models are a technical debt risk.
  *   **APC Identification:** Do not admit the problem is unsolvable. Argue that measuring exposures *dissolves* the problem rather than solving it within the old framework. If you concede identification is impossible, your test is dead.

