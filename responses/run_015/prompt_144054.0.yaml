      *   **User's Task:** Map out the analogy (Whirlpool = ?, River = ?, Draining = ?, Marble version = ?).
      *   **User's Critique/Question:** Marble doesn't flow. Whirlpools can't be moved. Does the "no extra object" conclusion hold? Is the professor smuggling in a process-ontology that static matter (clay/marble) doesn't share?

