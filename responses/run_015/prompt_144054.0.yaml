      *   *Relocation:* You can move a statue (ship it to a museum). You cannot move a whirlpool (it's tied to the riverbed topology).
      *   *Identity Conditions:* If I replace all the water in a whirlpool, is it the same whirlpool? (Ship of Theseus issues). If I replace all the marble dust in a statue, is it the same statue? (Usually no).
