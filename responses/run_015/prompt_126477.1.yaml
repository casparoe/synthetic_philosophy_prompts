answer: |-
  Dear friend,

  It is a fascinating tension you have identified, one that cuts to the heart of how institutions imagine the people who constitute them. When an election board or a conference chair insists that you rank sincerely and warns against strategic manipulation, they are not merely giving practical advice about how to game a system; they are making a profound metaphysical claim about the nature of your preferences and your role as an agent. By framing strategic misordering as a moral lapse or a form of irrationality, these institutions presuppose a realist ontology of preference. They act as though your true ordering of candidates or papers exists independently of the voting mechanism, waiting to be discovered and reported like a medical symptom or a statement of fact. In this view, preferences are not constructed in the moment of decision nor are they fluid responses to the incentives of the room; they are fixed attributes of the self. To strategize is therefore treated as a kind of lying, not just to the committee or the electorate, but to your own internal state. It assumes that there is a correct answer to the question of what you want, and that introducing calculation about what others might do corrupts the purity of that data.

  This framing reveals a specific commitment to expressive rationality over instrumental rationality. In standard game theory, a rational agent is one who maximizes their expected utility given the rules of the game, which often entails insincere voting if it leads to a better outcome. However, when these institutions tell you that strategy is irrational or wrong, they are redefining rationality itself. They are asking you to view the act of voting or reviewing as an expressive gesture rather than an instrumental lever. The value of the action lies in its fidelity to your internal state, not in its causal impact on the final result. This suggests that the institution values the legitimacy of the process derived from the authenticity of participation more than it values the strategic optimization of outcomes by individuals. They want the aggregate result to reflect the sum of true wills, even if game theory suggests that true wills are impossible to aggregate without distortion. By asking you to ignore the strategic landscape, they are asking you to participate in a fiction where the mechanism is transparent and neutral, a fiction that protects the institution from the cynicism of acknowledging that every rule creates new incentives to break it.

  You also ask whether this relies on unstated restricted preference domains, and I suspect the answer is yes, though often unconsciously. The Gibbard-Satterthwaite theorem proves that manipulation is unavoidable in the general case, but it does not apply if preferences are restricted, such as being single-peaked along a common spectrum. When chairs and boards insist sincerity is safe, they are implicitly betting on a high degree of consensus or structural alignment among participants. They are assuming that you and your fellow voters or reviewers share enough common ground that the pathological cases where strategy pays off simply will not arise. This is a hopeful assumption about the homogeneity of the community. It presupposes that we are all playing a coordination game rather than a conflict game, that our interests are aligned enough that telling the truth is indeed the dominant strategy. When they fail to articulate this, they are masking a political assumption as a technical guarantee. They are asking you to trust that the community is well-ordered enough that the mathematical impossibility of strategy-proofness does not manifest in practice, effectively asking you to ignore the possibility of deep disagreement where interests diverge sharply.

  Ultimately, however, I think there is a deeper normative commitment at play here that goes beyond mere hope for consensus. These practices are treating honest revelation as a kind of autonomy right or a civic duty that supersedes the safety of the mechanism. They are asking participants to treat the voting booth or the review form as a sacred space where the logic of the market or the game does not apply. This is a demand for integrity that places the burden of the system's failure on the individual rather than the design. If the system is manipulable but you are told not to manipulate it, you are being asked to uphold the legitimacy of the institution even at the potential expense of your own preferred outcome. It is a request for a leap of faith in the collective good over individual advantage. By moralizing strategy, they are attempting to construct a community of agents who define themselves by their honesty rather than their cleverness. This is a fragile philosophical stance because it requires individuals to act against their immediate instrumental interests based on a norm that the system itself does not enforce. It presupposes that agency is not just about choosing outcomes but about choosing who you are in the process, and it demands that you prioritize being a certain kind of person over getting a certain kind of result. In the end, these institutions are not just counting votes or scores; they are trying to cultivate a specific type of subject, one who believes that the truth of their preference matters more than the power of their strategy, even if the mathematics of the situation suggests that such belief is vulnerable to exploitation.
