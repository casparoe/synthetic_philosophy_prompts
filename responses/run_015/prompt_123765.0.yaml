answer: |-
  The Wheel of Tides did not turn so much as it breathed. It was a vast, rusted iris of brass and iron submerged beneath the town's central basin, exhaling water into the canals and inhaling it back again with a groan that vibrated through the soles of every barge pilot in the district.

  Mara felt the vibration through the hull of the *Kestrel*, up through the oak planking and into her boots. She stood at the stern, hands resting lightly on the tiller. The cargo behind her was not grain or coal, but crates of delicate glass lenses destined for the observatory on the High Spit. They required a journey devoid of jolts.

  'You're cutting it fine, Mara,' called Jory from the neighbouring barge, the *Gull*. He was leaning on his mooring lines, chewing a strip of dried eel. 'The Wheel's due a shift. The elders say the cycle's erratic this week.'

  'The elders say the sky falls whenever the clouds gather,' Mara replied, not looking up. She was watching the water lapping against the *Kestrel*'s flank. It wasn't moving in the usual lazy sweep. There was a tremor in the flow, a hesitation before the surge.

  'It's not superstition,' Jory said, spitting into the canal. 'It's luck. You fight the flow too often, you're due a drowning. That's all your counter-steering is. Gambling.'

  Mara finally looked at him. 'Gambling is throwing dice and hoping for six. I'm watching the hand that throws them.'

  She pushed off before he could retort. The *Kestrel* slid into the main artery, the Waterway of St. Jude. Normally, this time of day offered a gentle outbound current, a free ride towards the Spit. Today, the water was sluggish, thick with silt churned up from the bottom. The Wheel was holding its breath.

  Mara eased the tiller. She knew the conventional wisdom: wait for the exhale, let the current carry you. It was safe. It was what Jory would do. But the observatory needed the lenses before dusk, when the temperature drop might crack the seals, and the Wheel's breathing was irregular. If she waited for the perfect current, she would be dead in the water for an hour.

  She approached the Narrow Cut, a constriction where the canal widened slightly before pinching between two warehouse barges. This was where the current usually accelerated, a straight shot through. But as she neared, she saw the surface texture change. The water wasn't flowing straight; it was spiralling, caught in a back-eddy caused by the Wheel's hesitation.

  A conventional pilot would have dropped anchor and waited for the flow to straighten. To Mara, the turbulence was information. The chaos had a pattern, if one listened closely enough.

  She gripped the tiller. This was the moment of *virtù*, though she would not have used the word. It was the capacity to impose form upon the formless.

  She pushed the *Kestrel* not with the current, but against the grain of the eddy. She turned the bow into the strongest part of the suck. The wood groaned. The crew looked at her, eyes wide.

  'Mara?' her mate asked, hand on the mooring pole.

  'Hold,' she said.

  She fought the water. For ten seconds, the barge shuddered, the engine straining against the hydraulic pressure. It felt like madness. She was wasting energy, fighting the very force that was meant to carry her. Jory would have called it folly. He would have said she was inviting disaster.

  But Mara knew that by resisting the main surge, she was creating a vacuum behind her stern. She was forcing the water to split, creating a pocket of stillness in the lee of her own hull.

  Then, she snapped the tiller hard to starboard.

  The pocket of stillness she had manufactured collapsed. The water rushed in to fill the void, carrying the *Kestrel* with it. She wasn't riding the current; she was riding the correction she had forced the river to make. The barge slid through the Narrow Cut with unnatural smoothness, bypassing the turbulence that was currently battering a stationary barge ahead of them.

  She cleared the Cut. The lenses behind her didn't so much as rattle.

  But as she emerged into the open basin beneath the High Spit, the Wheel of Tides groaned again. This time, it was a sound like tearing metal.

  The water level dropped abruptly. The current reversed instantaneously.

  Mara slammed the tiller down, fighting to keep the *Kestrel* from slamming into the observatory dock. The barge swung wild, the stern clipping the pilings. Wood splintered. The crew stumbled. For a heartbeat, Mara lost control. The water wasn't following her rhythm anymore. The pattern she had deduced was obsolete.

  She was thrown against the rail. Her hands burned from the friction of the tiller. She managed to hook a line around a bollard just as the surge peaked, arresting the barge's swing inches from the dock face.

  Silence returned, save for the dripping of water and the distant, agonised grinding of the Wheel.

  She had made it. The cargo was intact. But her hands were shaking, not from exertion, but from the realisation that for those ten seconds of loss of control, she had been nothing. She had been a leaf. All her technique, all her reading of the rhythms, had amounted to nothing against the sheer mechanical failure of the Wheel.

  Jory's *Gull* was visible back at the Narrow Cut, anchored safely, waiting for the flow to stabilise. He was safe. He was also hours behind schedule.

  Mara leaned over the rail, looking down into the murky water. It settled slowly, hiding the mechanisms below.

  Her mate came up beside her, nursing a bruised shoulder. 'That was close, Cap'n. Too close. The Wheel changed without warning.'

  'I know,' Mara said.

  'Jory was right, then? It was luck we didn't capsize.'

  Mara watched a piece of driftwood catch in an eddy near the hull. It spun wildly, then settled, then spun again. She thought about the moment she had pushed against the current. She had created the opportunity to pass, but she had not commanded the water to obey. She had merely negotiated with it.

  'Luck is what happens when you aren't looking,' Mara said quietly, testing the tension on the mooring line. 'I was looking.'

  'But the Wheel broke the pattern.'

  'The pattern isn't the water,' she said, wiping grease from her palm. 'The pattern is the knowing when to push back. Whether it works... that's always up to the river.'

  She looked back toward the Narrow Cut. Jory was still there, safe in his caution. She was here, bruised and successful, having danced on the edge of a catastrophe she had invited.

  Was it skill that kept her alive? Or had the Wheel simply allowed her passage this time, amused by her struggle?

  Mara untied the line and began to coil it. The distinction felt less like philosophy and more like the ache in her shoulders. She had acted with purpose in a world of chance. That was all she could do. The rest was simply water.

  'Unload the lenses,' she ordered, her voice steady. 'And check the hull. We leave on the next tide.'

  'Whatever the Wheel does?'

  Mara looked at the great, submerged iris turning slowly in the gloom.

  'Whatever the Wheel does,' she said. 'We'll be ready to push against it.'
