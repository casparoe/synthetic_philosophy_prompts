  Hi — I'm a retired experimental physicist who's been auditing philosophy courses since I retired, and I'm helping a colleague put together a take-home exam for her grad seminar on formal epistemology. I want one essay question on Jeffrey conditionalization and uncertain evidence, but I don't want students to just recite the formula. Instead, I want them to confront what I'm calling the "boundary rigidity problem" (I just made that up): suppose you recieve a noisy continuous measurement — say a spectral line that might belong to model A (center near 500 nm) or model B (center near 520 nm) — and the error bars stradle both regions. Jeffrey's rule says partition your hypotheses and update probabilities within each cell, but drawing the boundary between "evidence for A" and "evidence for B" seems to presuppose the very prior weights you're trying to update. Ask them to explain Jeffrey's rule precisely, apply it to this kind of continuous case, argue whether the boundary choice is genuinely arbitrary or can be fixed by the likelihood function alone, and say whether this undermines Jeffrey's claim to be a generalization of Bayes.

  Please write the exam prompt itself, a model answer of about 650–750 words, and a marking scheme with five specific moves an A answer must make, with marks assigned (total out of 25). For each move, include a one-line note on the typical mistake that costs points. The scheme should clearly seperate an A from a B.

  Please have the answer written in American English, and please have it include a paragraph on what would change the author's mind — i.e., what specific argument or result would make them reject their conclusion about whether Jeffrey survives the boundary problem. Also, no bibliographies, reading lists, or citation requests — I want them reasoning, not name-dropping.
