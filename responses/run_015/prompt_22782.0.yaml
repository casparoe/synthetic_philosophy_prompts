answer: |-
  You have hit on one of the most famous and persistent headaches in the philosophy of science. You are not missing something basic; you have correctly identified a genuine tension in standard Bayesian confirmation theory. This is known as **Glymour's Old Evidence Problem** (named after Clark Glymour, who formalized it in 1980).

  Your intuition is correct: In the history of science, old evidence *does* confirm new theories (e.g., Einstein's General Relativity explaining the pre-existing anomaly of Mercury's orbit). But standard Bayesian math says it *shouldn't*.

  Here is a breakdown of why this happens, why your friend's solution is actually a standard philosophical move (but has issues), and what the most popular "fix" actually is.

  ### 1. The Math: Why you are right (and why it feels wrong)

  You summarized the math well, but let's tighten it slightly to see exactly where the "flatline" happens.

  In Bayesian updating, we calculate the new probability of a hypothesis $H$ given evidence $E$ like this:
  $$P(H|E) = P(H) \times \frac{P(E|H)}{P(E)}$$

  The term $\frac{P(E|H)}{P(E)}$ is the "Bayes Factor" (or confirmation boost).
  *   If $E$ is **old evidence**, we already know it is true. In idealized Bayesianism, if you know something for sure, its probability is 1. So, **$P(E) = 1$**.
  *   If $H$ logically entails $E$ (the theory predicts the data), then **$P(E|H) = 1$**.

  Plug those in:
  $$P(H|E) = P(H) \times \frac{1}{1} = P(H)$$

  **The Result:** Your belief in $H$ does not change. The evidence provides zero confirmation.

  **Why this feels backwards:** As you noted, when Einstein realized General Relativity (GR) entailed the precise orbit of Mercury (which was already known), he was thrilled. He took it as massive confirmation. If Bayesianism says this confirmation is impossible, Bayesianism seems to fail at describing actual scientific reasoning.

  ### 2. Is the assumption $P(E) = 1$ the mistake?

  You asked: *"Am I messing up by assuming the evidence has to be literally probability 1?"*

  This is the first line of defense. In strict Bayesian epistemology, rational agents are assumed to be **logically omniscient**. This means if you believe $H$, and $H$ logically implies $E$, you *already* believe $E$ with probability 1. You can't "learn" a logical consequence later; you should have known it immediately.

  However, humans aren't logically omniscient. We discover logical connections over time.
  *   **Option A:** We stick to strict Bayesianism. Then we must admit it doesn't model human discovery well.
  *   **Option B:** We say $P(E)$ is actually $0.99$, not $1$. If $P(E) < 1$, then learning $H$ (which makes $P(E|H) = 1$) *does* boost the probability.
      *   *The Problem:* This feels like cheating. If we *actually* know $E$ (like Mercury's orbit), assigning it $0.99$ is lying about our epistemic state just to make the math work.

  ### 3. Evaluating your friend's suggestion (The Counterfactual Fix)

  Your friend suggested: *"Imagine some person who didn't know E yet and update that person."*

  This is not cheating; it is a legitimate philosophical position called the **Historical** or **Counterfactual Account**.
  *   **The Idea:** To measure how much $E$ confirms $H$, we don't look at our current probabilities. We look at the probabilities of a hypothetical agent at the time *before* $E$ was discovered. Would $E$ have raised their confidence in $H$? If yes, then $E$ confirms $H$.
  *   **Why it's plausible:** It captures the *potential* support of the evidence.
  *   **Why you feel it's "cheating":** You are right to be skeptical.
      1.  It ignores the *actual* agent (us, now).
      2.  It's often impossible to reconstruct. What if *everyone* has always known $E$? (e.g., "The sun rises in the east"). If no one was ever ignorant of $E$, does $E$ confirm nothing? That seems wrong.
      3.  It turns confirmation into a historical story rather than a logical relationship between theory and data.

  ### 4. The Best Solution: Learning the "Connection" (The Garber Solution)

  If you want the solution that most philosophers of science find most satisfying, look up **Daniel Garber (1983)**.

  Garber argued that when we use old evidence, we aren't updating on $E$ (the data). We already have $E$. **We are updating on the logical connection between $H$ and $E$.**

  *   **Before:** I believe $H$ to some degree. I know $E$ is true ($P(E)=1$). But I *don't know* that $H$ entails $E$.
  *   **The Discovery:** I discover the fact: **"$H$ entails $E$"** (let's call this statement $X$).
  *   **The Update:** I update my beliefs on $X$, not on $E$.

  Since $X$ ("$H$ explains $E$") was *not* known before (Einstein didn't know GR worked until he did the math), $P(X) < 1$. Therefore, learning $X$ *can* boost the probability of $H$.

  **Why this fixes it:**
  1.  It respects that $E$ is old ($P(E)=1$).
  2.  It respects that the *insight* is new ($P(H \to E) < 1$).
  3.  It explains why Einstein was excited: He didn't learn about Mercury; he learned that his theory *captured* Mercury.

  ### 5. So, is Bayesianism broken?

  **Short answer:** No, but the "textbook" version is too simple.

  The Old Evidence Problem shows that standard Bayesianism assumes **Logical Omniscience** (you know all logical consequences of your beliefs instantly). Since humans aren't logically omniscient, we need a version of Bayesianism that allows for **Logical Learning**.

  *   If you treat Bayesianism as a rigid rulebook for ideal gods, the Old Evidence Problem breaks it.
  *   If you treat Bayesianism as a model for human agents who learn logical connections over time (via the Garber solution or similar "relaxed" Bayesianism), the problem dissolves.

  ### Summary for your elective
  1.  **Your intuition is correct:** Old evidence *does* confirm theories in practice.
  2.  **The math is correct:** Standard Bayesianism says it *shouldn't* if $P(E)=1$.
  3.  **The Problem:** This reveals that standard Bayesianism assumes we instantly know all logical implications of our theories (Logical Omniscience).
  4.  **The Fix:** Most philosophers prefer the **Garber Solution**. We don't update on the old data; we update on the *new realization* that the hypothesis explains the data.

  You aren't missing anything basic; you've just run into the boundary where idealized math meets messy human discovery. That is exactly where the interesting philosophy lives.
