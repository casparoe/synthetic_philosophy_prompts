prompt: |-
  I serve as the attending veterinarian and chair of the animal-care committee at a biomedical research institute. Our regulatory obligations extend to mammals, birds, and fish, but a growing share of our work involves invertebrates: electrophysiology on locusts, behavioral assays on crabs and shrimp, and from next year a small cephalopod program. The regulations say nothing about which of these animals require anesthesia, humane endpoints, or post-procedural monitoring, so in practice each laboratory improvises, and the improvisation tracks little more than intuitions about brain size — the crustacean labs have begun using analgesia on their own initiative, while the locust preparations are still performed on fully awake animals, and nobody on the committee can articulate a principled reason why the line falls where it does. The honest situation is that committee members reach for brain size and encephalization because those are measurable, even though everyone vaguely agrees that what matters morally is presumably not the size of the organ but the capacity for suffering that the organ subserves — and nobody knows how to move from the one to the other under time pressure.

  Please convert that ragged reasoning into a decision procedure my committee can actually run. The parameters are as follows: roughly a dozen new invertebrate protocols per year; the review must be completed in about an hour per protocol by people who are not comparative neuroscientists; the output is a written determination signed off by me, so it must be auditable by an outside inspector later. The procedure should be a sequence of questions asked in order, each with a statement of what counts as a sufficient answer; it should specify where the procedure terminates in a determination of no protection required, and where it hands the question back to the committee because the issue is one of moral values rather than empirical fact, so that the value judgment is at least visible and consistently located rather than smuggled into a factual-looking step. It must also tell the committee what to do when the evidence needed to answer a question simply does not exist, which for most invertebrate groups is the normal case rather than the exception. Finally, it should contain an explicit warning section on where a brain-size proxy misfires — both directions — since comparative cognition is full of cases in which a small or anatomically unconventional nervous system supports more than its size suggests, and cases in which a large brain coexists with capacities that seem irrelevant to welfare.

  Once the procedure is written, apply it to three protocols. First, an electrophysiology preparation on adult locusts that has historically been carried out without anesthesia, where the interesting complication is that anesthesia would destroy the very signal the experiment exists to record. Second, a shell-crushing noxious assay on shore crabs, a protocol the proposing laboratory has already volunteered to run under analgesia. Third, a learning and memory study on cuttlefish, animals whose nervous system is organized so differently from ours that committee members cannot agree whether their intuitions about them are worth anything. At least one of the three applications must return a determination the committee will find unwelcome, and you should say which one and why the procedure nonetheless returns it. Close by stating plainly what the procedure cannot do: in particular, whether it can settle the underlying moral question at all, or only render our existing moral uncertainty consistent, documented, and honestly assigned to the right people.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and its application:

  1.  **Analyze the Request:**

      *   **Role:** Attending Veterinarian and Chair of the Animal-Care Committee (IACUC/ACC equivalent) at a biomedical research institute.
      *   **Context:** Regulatory obligations cover mammals, birds, fish. Invertebrates (locusts, crabs, shrimp, soon cephalopods) are currently unregulated but increasingly used.
      *   **Problem:** Current practice is ad hoc, based on "brain size" intuitions. This is scientifically shaky and ethically opaque.
      *   **Goal:** Create a decision procedure (algorithm/checklist) for the committee to determine welfare protections (anesthesia, analgesia, endpoints, monitoring) for invertebrate protocols.
      *   **Constraints:**
          *   ~12 new protocols/year.
          *   Review time: ~1 hour/protocol.
          *   Reviewers: Not comparative neuroscientists.
          *   Output: Written, auditable determination.
          *   Structure: Sequential questions with sufficient answer criteria.
          *   Handling Uncertainty: Must specify what to do when evidence is missing (common for invertebrates).
          *   Value vs. Fact: Must distinguish empirical questions from moral value judgments.
          *   Warning Section: Must explicitly address where "brain size" proxies fail.
          *   Application: Apply to three specific cases (Locust electrophysiology, Crab shell-crushing, Cuttlefish learning).
          *   Requirement: At least one application must yield an "unwelcome" determination, with explanation.
          *   Conclusion: State plainly what the procedure *cannot* do (settle moral questions vs. manage uncertainty).

  2.  **Deconstruct the Ethical & Scientific Challenge:**

      *   *The Core Issue:* Sentience/Capacity for Suffering vs. Regulatory Vacuum.
      *   *The Proxy Problem:* Brain size/encephalization is easy to measure but poor at predicting sentience (e.g., bees vs. mice, cephalopods vs. mammals).
      *   *The Precautionary Principle:* Since we don't know for sure, how do we err on the side of caution without halting science?
      *   *The "Unwelcome" Outcome:* Likely the locust case (no anesthesia possible) or the cuttlefish case (high protection burden). Given the prompt's emphasis on the locust signal destruction, that's a strong candidate for an "unwelcome" outcome (i.e., the protocol might need significant modification or justification that feels uncomfortable). However, the crab case is already using analgesia. The cuttlefish case involves high cognition. Let's aim for the Locust case to be the "unwelcome" one because it forces the committee to acknowledge that *if* there is suffering, it cannot be mitigated, which might require rejection or extreme justification. Or, perhaps the Cuttlefish case is unwelcome because it imposes mammal-like standards on "bugs," burdening the lab. Let's look closer: The prompt says "At least one... must return a determination the committee will find unwelcome." Usually, committees dislike restrictions. So, imposing high restrictions on the Cuttlefish (which they might view as 'just an invertebrate') or forcing a hard look at the Locust (which they assume is fine) are the options. The Locust case has a technical constraint (anesthesia kills signal). If the procedure says "High risk of suffering + No mitigation = Do Not Approve," that is very unwelcome. Let's aim for that or a stringent monitoring requirement for the Cuttlefish. Actually, the most ethically robust "unwelcome" outcome is often telling a lab they *can't* do something they thought was trivial. Let's make the Locust determination unwelcome: it forces them to acknowledge the inability to alleviate pain if pain exists.

  3.  **Drafting the Decision Procedure (The "Invertebrate Welfare Assessment Algorithm" - IWAA):**

      *   *Structure:* Needs to be a flowchart in text form.
      *   *Step 1: Taxonomic Triage.* (Is there existing regulation or consensus?)
      *   *Step 2: Nociception vs. Pain.* (Distinguish reflex from suffering).
      *   *Step 3: Evidence of Sentience.* (Behavioral flexibility, trade-offs, learning).
      *   *Step 4: The Uncertainty Clause.* (What if we don't know?).
      *   *Step 5: Mitigation Feasibility.* (Can we fix it?).
      *   *Step 6: The Value Judgment.* (Where the committee must vote).
      *   *Warning Label:* Explicit section on Brain Size fallacies.

      *Refining the Steps for the Constraints:*
      *   Must be doable in 1 hour by non-experts. This means relying on literature summaries provided by the PI, not the committee doing new research.
      *   Must be auditable. Needs a "Record of Determination" section.
      *   Must handle missing evidence. Use a "Precautionary Weighting" system.

  4.  **Developing the Warning Section (Brain Size Proxies):**

      *   *False Negatives:* Small brains with high capacity (insects, cephalopods). Decentralized nervous systems (crabs).
      *   *False Positives:* Large ganglia/brains with low welfare relevance (some mollusks, or simply size without complexity).
      *   *Key Takeaway:* Do not use gram-weight of nervous tissue as a cutoff.

  5.  **Applying to the Three Protocols:**

      *   *Case 1: Locust Electrophysiology.*
          *   Issue: Awake preparation. Anesthesia ruins data.
          *   Procedure outcome: If risk of pain is non-negligible, and mitigation is impossible, the ethical cost is high.
          *   Unwelcome determination: "Conditional Approval with High Burden of Justification" or "Deferral." Let's make it a requirement for a specific "Necessity Justification" that admits the inability to alleviate pain. This is unwelcome because it highlights the ethical cost they usually ignore.
      *   *Case 2: Shore Crab Shell-Crushing.*
          *   Issue: Noxious stimulus. Lab *wants* to use analgesia.
          *   Procedure outcome: Supports the lab's initiative. Low friction.
      *   *Case 3: Cuttlefish Learning.*
          *   Issue: Complex behavior, alien neuroanatomy.
          *   Procedure outcome: High precautionary principle. Requires enrichment/monitoring similar to vertebrates.
          *   *Decision:* I will make the **Locust** determination the unwelcome one. Why? Because the procedure will force the committee to formally state: "We cannot rule out suffering, and we cannot treat it. Therefore, the scientific necessity must be exceptionally high." This removes the "it's just a bug" comfort blanket.

  6.  **Refining the "Missing Evidence" Protocol:**

      *   If data is absent, apply the *Precautionary Principle*.
      *   Assign a "Uncertainty Class" (Low, Medium, High).
      *   High Uncertainty + High Invasiveness = High Protection.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, regulatory, yet philosophically honest.
      *   *Formatting:* Clear headings, bold text for actionable items.
      *   *The "Value Judgment" Step:* This is crucial. The prompt asks to locate the moral value judgment visibly. This happens when empirical evidence runs out. The committee must vote on "Acceptable Risk" based on values, not facts.

  8.  **Final Review against Constraints:**

      *   1 hour/protocol? Yes, relies on PI submission + checklist.
      *   Auditable? Yes, creates a paper trail.
      *   Missing evidence handled? Yes, via Precautionary Principle.
      *   Brain size warning included? Yes.
      *   3 Applications? Yes.
      *   Unwelcome outcome? Yes (Locust).
      *   Closing statement on limitations? Yes.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe ban the locust study.
      *   *Correction:* Too extreme for a research institute. Better to force a "High Justification" status. It makes the ethical cost visible without halting science arbitrarily.
      *   *Check:* Did I distinguish nociception from pain? Yes, critical for invertebrates.
      *   *Check:* Is the "Value Judgment" step clear? I need to make sure the committee knows *when* they are deciding values vs. facts.

  10. **Final Polish:** Ensure the voice sounds like an Attending Veterinarian speaking to a committee (authoritative but collaborative). (Proceed to generate output).

  *(Self-Correction on the "Unwelcome" outcome)*: The prompt asks for *one* determination the committee will find unwelcome.
  *   Locust: Telling them they can't use anesthesia is obvious. Telling them they need to justify the *lack* of anesthesia heavily is annoying.
  *   Crab: They are already using analgesia. This will be welcomed.
  *   Cuttlefish: New program. Telling them they need vertebrate-level care might be unwelcome due to cost/effort.
  *   *Decision:* The Locust outcome is philosophically heavier. If the procedure concludes that "Inability to mitigate pain requires rejection or extraordinary justification," that challenges the historical norm. I will frame the Locust determination as requiring a "Specific Ethical Waiver" that acknowledges the potential for unmitigated suffering. This is unwelcome because it forces moral accountability.

  Let's write the procedure.
answer: |-
  # Invertebrate Welfare Assessment Algorithm (IWAA)
  **Version 1.0 | Office of the Attending Veterinarian**

  ## Purpose
  To provide a consistent, auditable, and ethically transparent method for evaluating welfare protections in invertebrate research protocols where regulatory mandates are absent. This procedure distinguishes empirical questions (capacity for suffering) from value judgments (acceptable risk) and manages scientific uncertainty via the Precautionary Principle.

  ## Constraint & Scope
  *   **Time Budget:** 60 minutes per protocol.
  *   **Expertise:** Assumes committee members are *not* comparative neuroscientists. Relies on literature summaries provided by the Principal Investigator (PI).
  *   **Audit Trail:** Every "Yes/No/Uncertain" must be documented with the specific evidence cited (e.g., "PI Submission Section 3.1" or "Smith et al. 2022").

  ---

  ## Part I: The Brain-Size Proxy Warning
  **Before beginning the assessment, all committee members must acknowledge the following:**

  Do **not** use absolute nervous system mass, neuron count, or encephalization quotient as a primary decision metric.
  *   **False Negative Risk:** Small or decentralized nervous systems (e.g., insects, cephalopods) may support complex nociceptive processing and affective states disproportionate to their size.
  *   **False Positive Risk:** Large ganglia or brain mass (e.g., in some large mollusks) may reflect motor control complexity rather than welfare-relevant sentience.
  *   **Directive:** If a PI argues "The brain is too small to feel pain," the committee must mark this justification as **Insufficient** unless accompanied by behavioral evidence of non-sentience.

  ---

  ## Part II: The Decision Procedure

  ### Step 1: Taxonomic Baseline
  **Question:** Is there a regulatory or consensus guideline specific to this taxon (e.g., Cephalopoda in EU Directive 2010/63)?
  *   **If YES:** Apply the existing standard. (Procedure Terminates).
  *   **If NO:** Proceed to Step 2.

  ### Step 2: Nociception vs. Pain Assessment (Empirical)
  **Question:** Does the literature indicate this taxon possesses (a) nociceptors, AND (b) behavioral evidence of pain modulation (trade-offs, learning to avoid, protective behavior) rather than simple reflex?
  *   **PI Requirement:** Must submit a 1-page summary of the top 3 citations regarding welfare capacity in this species/order.
  *   **Sufficient Answer for "Low Risk":** Peer-reviewed consensus that the taxon lacks central integration of noxious stimuli (e.g., *Drosophila* in some contexts, though debated).
  *   **Sufficient Answer for "High Risk":** Evidence of long-term behavioral change, trade-off decisions (e.g., enduring shock to keep a shelter), or physiological stress markers correlating with noxious stimuli (e.g., Cephalopods, Decapod Crustaceans).
  *   **If Evidence is Missing/Conflicting:** Mark as **Uncertain**. Proceed to Step 3.

  ### Step 3: The Uncertainty Protocol (Empirical)
  **Question:** If Step 2 was "Uncertain," can the uncertainty be resolved within the review hour?
  *   **If YES:** Consult the AV or a designated external advisor. Update Step 2.
  *   **If NO:** Apply the **Precautionary Weighting**.
      *   *Rule:* In the absence of evidence proving *lack* of sentience, assume the **Higher Welfare Capacity** plausible for that clade.
      *   *Documentation:* Record "Precautionary Principle Applied due to lack of negative evidence."

  ### Step 4: Mitigation Feasibility (Empirical/Technical)
  **Question:** Can the proposed pain or distress be alleviated (anesthesia, analgesia, refinement) without destroying the scientific validity of the data?
  *   **Sufficient Answer for "Feasible":** PI cites a protocol using the agent/method successfully in this or a closely related species.
  *   **Sufficient Answer for "Infeasible":** PI provides data or citation showing the mitigation agent alters the specific variable being measured (e.g., neural signal, behavioral reflex).
  *   **If "Infeasible":** Proceed to Step 5.

  ### Step 5: The Value Judgment (Moral)
  **NOTE:** *Steps 1–4 are empirical. Step 5 is a moral value judgment. This is where the committee accepts responsibility for the risk.*

  **Question:** Given the risk of suffering (from Step 2/3) and the inability to mitigate it (from Step 4), is the scientific objective sufficiently compelling to justify the potential welfare cost?
  *   **Procedure:** Committee Vote.
  *   **Options:**
      1.  **Approve:** The scientific gain outweighs the potential welfare cost.
      2.  **Approve with Stipulations:** Monitoring/frequency reduced to minimize duration of exposure.
      3.  **Deferral/Rejection:** The welfare cost is too high given the uncertainty and lack of mitigation.
  *   **Audit Requirement:** The minutes must record this as a **Value Determination**, not a factual finding. (e.g., "Committee determined the risk was acceptable" NOT "Committee determined the animal feels no pain.")

  ### Step 6: Humane Endpoints & Monitoring
  **Question:** Regardless of anesthesia, are there clear criteria for removing the animal from the experiment if distress becomes severe?
  *   **Requirement:** Even if anesthesia is impossible, death or irreversible incapacitation must be defined as an endpoint if the procedure causes prolonged distress.
  *   **Determination:** If no endpoint is defined, the protocol cannot be approved.

  ---

  ## Part III: Application to Current Protocols

  ### Protocol A: Adult Locust Electrophysiology
  *   **Description:** Intracellular recording from ganglia. Animal is waxed in place. Fully awake. Anesthesia (CO2 or chemical) suppresses the neural firing patterns under study.
  *   **Step 1 (Taxonomy):** No specific regulation.
  *   **Step 2 (Nociception):** **Uncertain.** Literature shows nociceptors in orthopterans. Evidence for *affective* pain (suffering) is debated but emerging (e.g., trade-off behavior in related insects).
  *   **Step 3 (Uncertainty):** Cannot resolve in 1 hour. **Precautionary Principle Applied.** Assume capacity for distress is non-negligible.
  *   **Step 4 (Mitigation):** **Infeasible.** PI demonstrates anesthesia abolishes the signal.
  *   **Step 5 (Value Judgment):** **Unwelcome Determination.**
      *   *Determination:* **Conditional Approval with High Ethical Burden.**
      *   *Rationale:* Because mitigation is impossible and risk is non-zero (per Precautionary Principle), the committee cannot treat this as "no welfare concern." The PI must submit a specific "Necessity Justification" explaining why this specific preparation is required over vertebrate models or computational alternatives where pain could be managed.
      *   *Why Unwelcome:* The lab historically treats locusts as "reagents." This determination forces them to formally acknowledge that they are potentially causing unmitigated suffering and must justify why that is acceptable. It removes the comfort of the "bug" label.
  *   **Step 6 (Endpoints):** Must define maximum duration of restraint. If animal shows signs of extreme struggle (beyond reflex), experiment must terminate.

  ### Protocol B: Shore Crab Shell-Crushing Assay
  *   **Description:** Application of controlled pressure to shell to simulate predator attack. Measures withdrawal latency.
  *   **Step 1 (Taxonomy):** No specific regulation.
  *   **Step 2 (Nociception):** **High Risk.** Decapod crustaceans show robust evidence of pain modulation (rubbing injured areas, learning to avoid shock).
  *   **Step 3 (Uncertainty):** N/A (Evidence exists).
  *   **Step 4 (Mitigation):** **Feasible.** PI proposes using topical analgesia (e.g., lidocaine derivative) which does not affect motor reflex latency significantly.
  *   **Step 5 (Value Judgment):** **Approved.**
      *   *Rationale:* The lab has voluntarily adopted analgesia. The risk is mitigated.
  *   **Step 6 (Endpoints):** Euthanasia if shell damage exceeds 30% or animal fails to right itself within 1 hour post-test.
  *   **Outcome:** Committee validates the lab's voluntary initiative. Low friction.

  ### Protocol C: Cuttlefish Learning and Memory
  *   **Description:** T-maze tasks with electric shock reinforcement.
  *   **Step 1 (Taxonomy):** Emerging regulations (e.g., EU) classify Cephalopods as protected. Institute policy aligns with this.
  *   **Step 2 (Nociception):** **High Risk.** Complex nervous system, robust behavioral evidence of learning and avoidance.
  *   **Step 3 (Uncertainty):** N/A.
  *   **Step 4 (Mitigation):** **Partially Feasible.** Shock can be minimized, but some aversive stimulus is required for the learning paradigm.
  *   **Step 5 (Value Judgment):** **Approved with Stipulations.**
      *   *Rationale:* High cognitive capacity requires high welfare standards.
  *   **Step 6 (Endpoints):** **Strict.** Requires daily monitoring by trained staff (not just students), enrichment in holding tanks, and immediate removal if learning criteria are not met within X trials to prevent chronic stress.
  *   **Outcome:** High administrative burden, but scientifically justified by the animal's capacity.

  ---

  ## Part IV: Limitations of This Procedure

  **To the Committee:**

  This procedure **cannot** settle the underlying moral question of whether an invertebrate *actually* suffers. Comparative neuroscience does not yet possess a "sentience meter."

  What this procedure **does** do is:
  1.  **Render Uncertainty Consistent:** It ensures we do not treat a crab differently than a lobster without a reason.
  2.  **Document the Value Judgment:** It forces us to admit when we are guessing (Step 3) and when we are making a moral trade-off (Step 5).
  3.  **Prevent "Smuggled" Ethics:** It stops us from hiding moral decisions behind false claims of fact (e.g., "It doesn't feel pain because it's small").

  If an inspector asks why we approved a protocol where pain was possible but untreated, this file will not say "We thought they were insentient." It will say: "We acknowledged the risk, could not mitigate it, and voted that the science was worth the cost." That is the only honest answer we can give.
