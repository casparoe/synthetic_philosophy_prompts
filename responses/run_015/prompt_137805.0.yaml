answer: |-
  # FRAMING DOCUMENT: ADVERSARIAL COLLABORATION ON INTERPERSONAL COMPARISONS OF WELL-BEING

  **Date:** Autumn 2024
  **Participants:** The Comparabilist, The Scale-Skeptic
  **Convener:** [Department Head]

  ## I. AGREED CLAIMS

  The following propositions are accepted by both participants as the baseline for this collaboration. They are intended to be substantive enough to constrain the debate, yet thin enough to command assent without forcing either side to abandon their core theoretical commitments.

  1.  **Intrapersonal Cardinality:** For any single individual $i$, well-being $u_i$ possesses cardinal structure. That is, propositions regarding the magnitude of differences within $i$'s life (e.g., "The gain from $x$ to $y$ exceeds the gain from $z$ to $w$") have determinate truth values fixed by facts about $i$'s psychology, behavior, or physiology.
  2.  **Invariance Formalism:** The substantive dispute can be formally characterized as a disagreement over the admissible group of transformations $\Gamma$ applied to the profile of utility functions $(u_1, ..., u_n)$ that leave the social evaluation $W$ invariant.
      *   Both agree that for any $i$, $u_i$ is invariant under positive affine transformation ($u_i' = a_i u_i + b_i, a_i > 0$).
      *   Both agree that if interpersonal comparisons are admissible, the admissible group $\Gamma$ must be a subgroup of the product of individual affine transformations.
  3.  **Policy Relevance:** Social policy often requires trade-offs where one group incurs a loss in well-being to secure a gain for another. In such cases, relying solely on Pareto efficiency is insufficient; a rule for aggregating or weighing changes across persons is required.
  4.  **Convergence in Extremes:** In limit cases involving extreme suffering (e.g., chronic torture) versus trivial inconveniences (e.g., mild delay), both participants expect to converge on the same policy recommendation. The dispute concerns the *mid-range* cases and the *justification* for the verdicts in the extreme cases.
  5.  **Epistemic Fallibility:** Both participants acknowledge that any practical method for estimating well-being (surveys, neural data, behavioral choice) is noisy and subject to error. The dispute is not about the presence of noise, but about whether the signal exists independently of the measurement convention.

  ## II. DISAGREEMENTS TABLE

  | Disputed Proposition | Comparabilist Formulation | Scale-Skeptic Formulation | Note on Substantive Content |
  | :--- | :--- | :--- | :--- |
  | **1. Truth Values of Level Comparisons** | Propositions of the form "Person A is at a lower absolute level of well-being than Person B" are truth-apt. Their truth is fixed by facts about A and B, independent of our measurement conventions. | Propositions of the form "A is lower than B" lack determinate truth values. They are either coarse heuristics for extreme cases or expressions of a chosen convention for coordination. | **Not Merely Verbal.** This is not a dispute about whether we *should* talk this way, but whether the world *makes* such sentences true. The Skeptic denies the existence of the fact of the matter, not just the utility of the language. |
  | **2. The Admissible Transformation Group** | Social evaluation $W$ must be invariant only under **common** affine transformations ($u_i' = a u_i + b$ for all $i$). This licenses comparing levels and differences across persons. | Social evaluation $W$ must be invariant under **independent** affine transformations ($u_i' = a_i u_i + b_i$). This forbids comparing levels and forbids comparing differences unless a conversion convention is stipulated. | **Structural.** This defines the mathematical constraints on any social welfare function. The Comparabilist requires a common zero and unit; the Skeptic denies they exist. |
  | **3. The Status of "Zero"** | There exists a natural zero point (e.g., neutrality, absence of consciousness, or objective baseline) that is identical across persons. | The zero point is arbitrary within each life. There is no fact of the matter that aligns A's zero with B's zero. | **Metaphysical.** If the Skeptic is right, "level" comparisons are category errors. If the Comparabilist is right, the Skeptic is ignoring a real structural feature of value. |
  | **4. Measurement vs. Stipulation** | Interpersonal measurement discovers pre-existing ratios of well-being magnitude. | Interpersonal measurement imposes a coordination scheme on incommensurable magnitudes. | **Verbal Component.** If "measurement" simply means "reliable prediction of reports," both may agree. The dispute is whether "measurement" implies mapping a common ontological dimension. |

  ## III. THE CRUXES

  The following sub-questions identify the specific points where evidence or argument could move one side toward the other. For each, we stipulate a case and record the predicted response.

  ### (a) The Cross-Person Decoder
  **Stipulation:** A machine learning model is trained exclusively on within-person neural/behavioral data from Subject A to predict A's reported well-being. Without retraining or labels from Subject B, the model predicts B's reported well-being significantly above chance, even when B's life circumstances differ radically from A's.

  *   **Comparabilist Prediction:** Success is expected.
      *   **Implication:** This suggests a common neural/phenomenal currency. The fact that A's scale predicts B's reports indicates that the underlying magnitude being tracked is the same kind of thing in both heads.
  *   **Scale-Skeptic Prediction:** Success is possible but misleading.
      *   **Implication:** This shows only that humans share common *response functions* or *reporting conventions*, not that the underlying *scales* are aligned. It demonstrates structural isomorphism, not metric comparability.
  *   **Crux:** Does cross-person predictive validity entail common metric structure, or merely common response architecture?

  ### (b) The Common-Anchor Protocol
  **Stipulation:** Participants calibrate their well-being reports against a standardized battery of controlled experiences (e.g., specific heat intensities, taste concentrations). These scales are then used to compare people in states never exposed to the battery (e.g., chronic grief vs. chronic pain).

  *   **Comparabilist View:** This is **measurement**. The anchor fixes the common unit and zero. Extrapolation is valid because the dimension of well-being is continuous and unitary.
  *   **Scale-Skeptic View:** This is **stipulated convention**. It is valid for coordinating behavior near the anchor, but extrapolating to unexperienced states assumes what is in dispute (that the "distance" from the anchor to grief is comparable across persons).
  *   **Crux:** Does anchoring create comparability, or does it merely create a shared language for incommensurable states? Does the answer differ for *differences* (which the Skeptic admits are measurable intra-personally) versus *levels*?

  ### (c) Range-Normalization and Radical Breaks
  **Stipulation:** We rescale each person such that their own attainable worst outcome is 0 and their own attainable best is 1. We then compare persons based on their position in [0, 1].

  *   **Comparabilist Challenge:** Does this concede the Skeptic's point?
      *   **Position:** This begs the question. It assumes that having one's "full range" satisfied is of equal value for everyone. It ignores absolute deprivation. A person whose best is "mild contentment" is treated as equal to a person whose best is "ecstasy" if both are at their 1.0.
  *   **Scale-Skeptic Challenge:** Is this compatible with the Skeptic's position?
      *   **Position:** This is the only admissible method for aggregation without metaphysical overreach. It respects intrapersonal cardinality while imposing the minimal convention necessary for social choice.
  *   **Intra-Personal Analogue:** Consider one person at Time 1 (religious ascetic) and Time 2 (hedonist) with radical value change.
      *   **Question:** Can we compare T1 well-being to T2 well-being without stipulation?
      *   **Comparabilist:** Yes, via an objective list or stable core of needs.
      *   **Scale-Skeptic:** No, without stipulation.
      *   **Pressure:** If the Skeptic admits intra-personal comparison across radical breaks requires stipulation, they must explain why interpersonal comparison is *worse* than this, rather than just *different*. If the Comparabilist admits intra-personal breaks are hard to compare, they must explain why interpersonal boundaries are more permeable.

  ### Application to Policy Cases

  We apply the above disagreement to two specific policy scenarios to determine where recommendations diverge.

  **Case 1: The Restricted Range (Severe Pain)**
  *   **Scenario:** A small group ($N=100$) suffers chronic, unremitting pain. Their attainable range of well-being is severely restricted (e.g., [0, 20] on a generic scale). A policy provides relief, moving them from 5 to 15.
  *   **Case 2: The Ordinary Range (Small Gains)**
  *   **Scenario:** A large group ($N=10,000$) lives ordinary lives with a wide attainable range (e.g., [0, 100]). A policy provides a minor convenience, moving them from 50 to 52.

  **Analysis of Divergence:**

  1.  **Where the Disagreement Makes No Difference:**
      *   If the pain in Case 1 is sufficiently extreme (approaching the "limit case" of Agreement Claim #4), the Scale-Skeptic will likely concede a coarse verdict favoring Case 1, despite the numbers. Both will recommend prioritizing the pain relief. The Skeptic treats this as a "emergency convention" rather than a measurement truth, but the *action* is the same.

  2.  **Where the Disagreement Determines Different Recommendations:**
      *   **The Priority Weight:** The Comparabilist can justify prioritizing Case 1 based on the **absolute level** of the recipients (Prioritarianism). Even if the total sum of normalized gains were slightly higher in Case 2, the Comparabilist may argue that gains to those at absolute level 5 count for more than gains to those at absolute level 50.
      *   **The Aggregation Rule:** The Scale-Skeptic cannot use absolute levels to weight gains. They must rely on **differences**.
          *   If the Skeptic adopts Range-Normalization: Case 1 gain is 10/20 = 0.5 normalized units. Case 2 gain is 2/100 = 0.02 normalized units. Total Case 1 = 50. Total Case 2 = 200. The Skeptic might recommend Case 2 (the large ordinary group) because the *sum of normalized fractions of life-quality* is higher.
          *   The Comparabilist rejects Range-Normalization as obscuring the absolute misery of Case 1. They may recommend Case 1 despite the lower aggregate normalized gain, because the *absolute* moral urgency is higher.
      *   **Result:** The collaboration must identify if there is a threshold where the Skeptic's "sum of fractions" overrides the Comparabilist's "priority to absolute worst-off."

  ## IV. CLOSING NOTE: CONDITIONS FOR FAILURE AND SUCCESS

  **Failure:**
  The collaboration fails if the final output is a negotiated compromise that neither side believes is theoretically coherent (e.g., "We will use Comparabilist language for public communication but Skeptic models for internal calculation"). It also fails if both sides agree that the dispute is purely verbal and dissolves the problem into semantics without resolving the policy implications.

  **Success:**
  Success is achieved if we produce a joint statement that isolates a specific empirical or conceptual claim which, if resolved, would force one side to concede. For example: *"If the Cross-Person Decoder (III.a) achieves >80% accuracy on out-of-distribution subjects, the Scale-Skeptic agrees this constitutes evidence of a common metric."*

  Alternatively, success is a joint policy recommendation for the Cases in Section III that explicitly states which premises were required to reach it, thereby mapping the exact boundary where theory dictates practice. We seek not consensus on the truth, but consensus on the **decision rule** and its **cost**.
