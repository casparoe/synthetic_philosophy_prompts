      *   *Implication:* Since $M$ corresponds to $D$ (in the multiple realization case), and $D$ is causally inert, $M$ inherits that inertness.
      *   *Force:* Yes, this scenario strengthens Kim's hand *if* one accepts his premise that disjunctive properties cannot be causes. It highlights the "heterogeneity" of the physical base. If $M$ is to be causal, it must be identical to $N_1$ in case 1 and $N_2$ in case 2 (token identity), but then $M$ as a *type* loses causal efficacy.
