      *   **Section 2: The Determinable Defense Under Stress.** Address the "Disjunction Problem." Can $M$ be a determinable if its determinates ($N_1, N_2$) share no physical similarity? Argue for functional unity vs. physical unity. Explain how causation is "proportional."
