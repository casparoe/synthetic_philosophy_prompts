      *   $N_1, N_2$ = Disjoint neural realizers.
      *   $D$ = Disjunctive physical property ($N_1 \lor N_2$).
      *   *Problem for Determinable View:* Usually, the determinable/determinate relation requires a modal connection or a natural kind structure. Is $M$ truly a determinable of $N_1$? Or is $N_1$ a realizer? If $M$ is multiply realized, is it a *single* determinable covering disjoint determinates?
      *   *Problem for Kim:* If $D$ is "highly disjunctive," Kim argues disjunctive properties are not causally efficacious. So $N_1$ causes the effect, $N_2$ causes the effect. $M$ maps to $N_1 \lor N_2$. If $M$ is distinct from $N_1$ and distinct from $N_2$, Kim says $M$ is excluded by $N_1$ (in case 1) and $N_2$ (in case 2).

