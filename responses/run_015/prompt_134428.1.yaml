      *   *Defense:* Proponents (like Wilson) argue that functional properties *are* determinables. The unity comes from the functional role, not the physical base. $M$ is defined by its causal profile. $N_1$ and $N_2$ are determinates because they fill that role.
      *   *Verdict:* It doesn't necessarily collapse, but it strains the "naturalness" of the property. If $D$ is gerrymandered, $M$ looks gerrymandered. However, if $M$ is defined functionally, the lack of physical unity in $D$ is irrelevant to $M$'s status as a determinable. The defense holds *if* one accepts functional properties as genuine determinables.

