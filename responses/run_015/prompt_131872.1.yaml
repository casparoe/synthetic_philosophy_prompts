answer: |-
  # Material-Continuity and Identity Verification Protocol (MC-IVP)
  **Version:** 1.0 (Operational Draft)  
  **Intended Users:** Accreditation Panel Members, Conservators, Legal Counsel  
  **Purpose:** To determine if a reconstructed object constitutes the *same token artifact* listed in provenance records for restitution and liability purposes.

  ---

  ## Part I: The Decision Procedure

  **Instructions:** Proceed through the following phases sequentially. If a **[STOP]** condition is met, issue a Negative Determination (Not the Same Work). If a **[FLAG]** is encountered, the decision cannot be resolved by fact alone and must be referred to the Full Panel for a value-based vote. If an **[UNSETTLED]** marker appears, the philosophy of material constitution offers no consensus; record the ambiguity but proceed to the next phase.

  ### Phase 1: Token Verification (Type vs. Token Distinction)
  *Philosophical Basis:* Distinguishes between a specific physical instance (token) and a repeatable design pattern (type). Restitution applies to tokens.

  **Q1.1: Is the object claimed to be the specific physical instance created at the origin date, or merely an instance of the same design?**
  *   **Sufficient Answer for Continuation:** Documentation or physical evidence confirms this is the specific instance originally recorded (e.g., unique tool marks, specific inclusions, continuous custody).
  *   **Sufficient Answer for [STOP]:** Evidence confirms this is a later copy, cast, or reproduction made from a mold or plan after the original was lost or destroyed.
  *   **Outcome:** If [STOP], certify as **New Work**. End Protocol.

  ### Phase 2: Material Constitution (The Substrate Question)
  *Philosophical Basis:* Addresses *Material Constitution*. Does the object survive the replacement of its constituent matter?

  **Q2.1: What percentage of the original structural mass (by volume or weight) remains in situ?**
  *   **Sufficient Answer for Continuation:** >50% of the original structural mass remains.
  *   **Sufficient Answer for [UNSETTLED]:** Between 10% and 50% remains. (Philosophy disagrees on whether minority matter can constitute the original whole).
  *   **Sufficient Answer for [STOP]:** <10% remains, OR the original material was reduced to a state where it lost structural coherence (e.g., pulverized, melted, dissolved) before reconstruction.
  *   **Outcome:** If [STOP], certify as **New Work**. End Protocol. If [UNSETTLED], proceed to Q2.2 but note the ambiguity in the record.

  **Q2.2: Is the replacement material chemically distinct from the original substrate?**
  *   **Sufficient Answer for Continuation:** Replacement material is chemically compatible or indistinguishable from the original (e.g., same alloy, same clay source).
  *   **Sufficient Answer for [FLAG]:** Replacement material is visually identical but chemically distinct (e.g., modern resin filling ancient stone).
  *   **Outcome:** If [FLAG], refer to Full Panel. This is a value judgment regarding aesthetic integrity vs. material honesty.

  ### Phase 3: Causal Continuity (Persistence Conditions)
  *Philosophical Basis:* Addresses *Persistence through Change*. Distinguishes gradual replacement (Ship of Theseus) from sudden destruction and re-creation.

  **Q3.1: Did the object undergo a catastrophic event that severed its physical continuity prior to reconstruction?**
  *   **Sufficient Answer for Continuation:** No. Changes occurred through gradual erosion, maintenance, or minor breakage repaired in situ.
  *   **Sufficient Answer for [STOP]:** Yes. The object was deliberately destroyed, pulverized, or melted down with no intent of preservation, and reconstruction occurred significantly later.
  *   **Sufficient Answer for [UNSETTLED]:** Yes, the object shattered or fragmented, but was reassembled immediately by the original custodians.
  *   **Outcome:** If [STOP], certify as **New Work**. End Protocol. If [UNSETTLED], proceed to Q3.2.

  **Q3.2: Was the reconstruction executed by the original creator or under their direct supervision?**
  *   **Sufficient Answer for Continuation:** Yes, or by a direct successor maintaining the original workshop tradition *during the object's active life*.
  *   **Sufficient Answer for [FLAG]:** No, the reconstruction was performed by a later party (restorers, state actors, different artists) decades or centuries later.
  *   **Outcome:** If [FLAG], refer to Full Panel. This weighs *Historical Continuity* against *Authorial Intent*.

  ### Phase 4: Form and Function (Identity Conditions)
  *Philosophical Basis:* Addresses whether the *Form* can override the *Matter* in defining identity.

  **Q4.1: Does the reconstructed object retain the original critical dimensions and proportions?**
  *   **Sufficient Answer for Continuation:** Yes, within standard tolerances for age-related deformation.
  *   **Sufficient Answer for [STOP]:** No, the proportions have been deliberately altered to suit a new aesthetic or ideological purpose.
  *   **Outcome:** If [STOP], certify as **New Work** (or Derivative Work). End Protocol.

  **Q4.2: Is the object currently functioning in the same cultural or liturgical context as the original?**
  *   **Sufficient Answer for Continuation:** Yes.
  *   **Sufficient Answer for [FLAG]:** No, the context has shifted (e.g., from temple idol to museum piece), and the reconstruction serves the new context rather than the old.
  *   **Outcome:** If [FLAG], refer to Full Panel. This is a question of *Social Ontology* (values), not fact.

  ---

  ## Part II: Application to Case Studies

  ### Case 1: The Corroded Bronze
  *Scenario:* Bronze statue, 40% original metal lost to corrosion, filled with modern alloy cast from the original mold.
  *   **Phase 1 (Token):** Pass. It is the specific instance, not a new cast.
  *   **Phase 2 (Constitution):**
      *   Q2.1: 60% original mass remains. **Continue.** (Above the 50% threshold).
      *   Q2.2: Modern alloy is chemically distinct but structurally compatible. **FLAG.** (Panel must decide if material honesty outweighs structural stability).
  *   **Phase 3 (Causal):**
      *   Q3.1: Corrosion is gradual, not catastrophic. **Continue.**
      *   Q3.2: Reconstruction likely by conservators, not original artist. **FLAG.** (Standard conservation practice vs. authorial purity).
  *   **Phase 4 (Form):**
      *   Q4.1: Mold ensures proportions are retained. **Continue.**
  *   **Determination:** **Presumptive Same Work**, subject to Panel vote on the Material/Agency Flags.
  *   **Reasoning:** The object passes the material threshold and maintains causal continuity through gradual change. The philosophical tension lies in whether the *form* (secured by the mold) preserves identity when the *constitution* is partially modern.

  ### Case 2: The Shattered Figurine
  *Scenario:* Clay figurine shattered, reassembled with adhesive, missing pieces replaced by visually identical modern clay fired in the original kiln.
  *   **Phase 1 (Token):** Pass. Fragments belong to the specific instance.
  *   **Phase 2 (Constitution):**
      *   Q2.1: Assume >50% of fragments recovered. **Continue.**
      *   Q2.2: Clay from original kiln is chemically indistinguishable. **Continue.**
  *   **Phase 3 (Causal):**
      *   Q3.1: Shattering is a catastrophic physical break. **UNSETTLED.** (Philosophy disputes if shattering destroys the object even if reassembled).
      *   Q3.2: Reassembled by conservators. **FLAG.**
  *   **Phase 4 (Form):**
      *   Q4.1: Form retained. **Continue.**
  *   **Determination:** **Same Work (with Ambiguity Note).**
  *   **Reasoning:** While shattering is catastrophic, immediate reassembly of the majority of original matter usually preserves token identity in conservation ethics. The protocol flags the philosophical unsettledness of "shattering" but allows continuation based on material majority.

  ### Case 3: The Pulverized Monument
  *Scenario:* Stone monument deliberately pulverized by a regime. Re-carved decades later by a different artist from the same quarry into the same iconography but with altered proportions.
  *   **Phase 1 (Token):**
      *   Q1.1: Is it the specific instance? **STOP.**
      *   *Analysis:* The original stone was pulverized. The current stone is new matter. There is no physical continuity of the token.
  *   **Phase 2 (Constitution):**
      *   Q2.1: Original mass remaining? 0%. **STOP.**
  *   **Phase 3 (Causal):**
      *   Q3.1: Catastrophic event (pulverization) with intent to destroy. **STOP.**
  *   **Phase 4 (Form):**
      *   Q4.1: Altered proportions. **STOP.**
  *   **Determination:** **New Work.**
  *   **Reasoning:** The protocol yields a hard negative. Despite the "unwelcome" political or cultural desire to claim continuity, the object fails on Material Constitution (0% original matter), Causal Continuity (deliberate destruction), and Form (altered proportions). It is a commemorative replica, not the restitutable artifact. No special pleading is applied.

  ---

  ## Part III: Reliability and Limitations Statement

  **Confidence Level:** **Moderate-High (80%)** for clear-cut cases (like Case 1 and Case 3); **Low (40%)** for boundary cases falling into [UNSETTLED] or [FLAG] categories.

  **Least Certain Step:** **Phase 2, Question 2.1 (The Material Threshold).**
  *   **The Weakness:** This step requires setting a quantitative threshold (e.g., >50% original mass) to operationalize a qualitative philosophical problem.
  *   **Source of Weakness:** **The Underlying Philosophy.**
      *   *Explanation:* In metaphysics, there is no consensus on "Mereological Essentialism" (the view that an object's parts are essential to its identity) versus "Functionalism" (the view that identity persists as long as function/form persists). Some philosophers argue that replacing *any* part changes the constitution; others argue you can replace *all* parts gradually and retain identity. By forcing a percentage cutoff to make the protocol usable for lawyers and conservators, we introduce an arbitrariness that philosophy itself does not resolve. A case with 49% original matter is philosophically indistinguishable from one with 51%, yet the protocol treats them differently.
  *   **Practical Translation Issue:** The translation exacerbates this by requiring conservators to estimate volume/weight of original matter in complex composites, which introduces measurement error into a already philosophically vague boundary.

  **Recommendation:** Any case triggering the 10%-50% range in Q2.1 should automatically trigger a Full Panel review, regardless of other passing metrics, as this is the zone where the protocol's philosophical foundation is most unstable.
