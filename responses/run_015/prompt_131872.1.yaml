          *   Flag human/value judgments.
          *   Identify philosophically unsettled areas.
          *   Preserve philosophical distinctions (constitution vs. identity, gradual vs. sudden, type vs. token) but translate for conservators/lawyers.
          *   Apply to three specific cases (Bronze, Clay, Stone).
          *   State confidence level and identify the weakest step (philosophy vs. translation).
      *   **Tone:** Professional, operational, precise, avoiding special pleading (especially for the unwelcome stone monument case).

  2.  **Deconstruct the Philosophy:**
      *   *Material Constitution:* Is the object the matter (clay) or the form (statue)? (The Ship of Theseus problem).
      *   *Identity vs. Constitution:* $A$ constitutes $B$, but $A \neq B$. The clay constitutes the statue. If the clay changes, does the statue persist?
      *   *Persistence Conditions:* What allows an artifact to survive change? Continuity of form? Continuity of matter? Continuity of history/function?
      *   *Type vs. Token:* Is it *a* statue of Hercules (type) or *this specific* statue of Hercules (token)? Restitution usually cares about the token.
      *   *Gradual vs. Sudden:* Ship of Theseus (gradual replacement) vs. Smashed and Reassembled (sudden destruction/recreation).

  3.  **Drafting the Protocol (Iterative Process):**
      *   *Goal:* Make it actionable. No jargon like "mereological essentialism." Use "Material Continuity," "Form Continuity," "Historical Chain."
      *   *Step 1: Provenance Chain.* Before looking at the object, look at the paperwork. Is there a break in custody?
      *   *Step 2: Material Threshold.* How much original stuff is left? (Constitution).
      *   *Step 3: Form/Design Threshold.* Is it the same shape? (Type vs. Token).
      *   *Step 4: Agency/Intent.* Who did the work? (Artist vs. Restorer).
      *   *Step 5: The "Unsettled" Zone.* Where philosophy disagrees (e.g., 50% replacement).

      *Refining for the Prompt's Constraints:*
      *   Need to distinguish *Constitution* (matter) from *Identity* (the work).
      *   Need to handle the "Stone Monument" case honestly (it likely fails, even if unwelcome).
      *   Need to flag value judgments.

      *Drafting the Steps:*
      1.  *Chain of Custody:* Did the object survive physically through time?
      2.  *Material Continuity:* Is there enough original matter?
      3.  *Form Continuity:* Is the shape the same?
      4.  *Causal History:* Was the reconstruction a repair or a remake?

      *Critique:* This is too simple. Needs to address the specific philosophical distinctions requested (constitution vs. identity, gradual vs. sudden).
      *Revised Step 1 (Token Verification):* Is this the specific physical instance or a copy?
      *Revised Step 2 (Material Constitution):* How much original matter remains? (The "Constitution" question).
      *Revised Step 3 (Persistence through Change):* Was the change gradual (restoration) or catastrophic (destruction)?
      *Revised Step 4 (Agency):* Who effected the change?

      *Let's formalize the "Stop Rules" and "Human Flags".*

  4.  **Developing the Three Cases:**
      *   *Case 1 (Bronze):* 60% original, 40% modern alloy from original mold.
          *   Analysis: High material continuity. Mold suggests form continuity. Gradual corrosion vs. sudden fill? Likely "Same Work" but with caveats.
      *   *Case 2 (Clay):* Shattered, reassembled, missing bits replaced with original kiln clay.
          *   Analysis: Catastrophic break (shattered). Reassembly preserves token identity *if* fragments are major. New clay is constitutionally different but materially similar (same kiln). Likely "Same Work" (conservation standard), but philosophically tricky on the "shattered" aspect.
      *   *Case 3 (Stone):* Pulverized (destroyed). Re-carved later by different artist, same quarry, same icon, different proportions.
          *   Analysis: Material continuity = 0% (pulverized). Form continuity = approximate (altered proportions). Agency = different artist. Causal chain = broken.
          *   *Constraint:* "Unwelcome outcome... treat without special pleading." The protocol *must* rule this as a *new* work, even if the panel wants it to be the old one for political/cultural reasons.

  5.  **Refining the Protocol Structure:**
      *   Title: Material-Continuity and Identity Verification Protocol (MC-IVP).
      *   Structure: Phased Questions.
      *   Notation: [STOP], [FLAG], [UNSETTLED].

  6.  **Addressing the Confidence and Weakness:**
      *   Confidence: High on clear cases, low on boundary cases (philosophical vagueness).
      *   Weakest Step: The Material Threshold (How much matter is enough?). This is where philosophy (Mereology) offers no consensus, and practical translation forces an arbitrary number.

  7.  **Final Review against Constraints:**
      *   Step-by-step? Yes.
      *   Ordered questions? Yes.
