      *(Self-Correction during drafting)*: I need to make sure I don't just say "50% rule." Philosophers hate arbitrary numbers. I need to frame it as "Structural Integrity of Original Matter." But for a protocol, I need a threshold. I will frame it as a "Critical Mass" question but flag the arbitrariness.
      *Actually, better approach:* Distinguish between *Support* (original matter holding the form) vs. *Fill* (new matter).
      *Case 3 Check:* If it was pulverized, there is no original matter. It must fail Step 2. I must ensure the protocol doesn't allow a workaround there.

      *Case 1 Check:* 40% loss. Is it the same statue? Most conservation ethics say yes if the structure is stable. Philosophy? If the original matter constitutes the statue, and 40% is gone, is it the same constitution? Usually, artifacts persist through material loss if the *form* and *history* persist. I need to balance Material Constitution with Artifact Persistence.

      *Refining the Philosophy Translation:*
      *   "Constitution vs. Identity" -> "Material Substrate vs. Historical Entity."
      *   "Gradual vs. Sudden" -> "Continuous Maintenance vs. Catastrophic Event."
      *   "Type vs. Token" -> "Design Pattern vs. Specific Instance."

      *Let's build the steps.*
      1.  Token Verification (Type/Token).
      2.  Material Substrate (Constitution).
      3.  Causal Continuity (Persistence).
      4.  Agency and Intent (Values).

      *Wait, the prompt asks for "where the underlying philosophy genuinely leaves the case unsettled."* I need to highlight that in the protocol steps.

