answer: |-
  This is a superb deadlock because it replicates, in miniature, the central tension in Ranke scholarship that has persisted for two centuries. You and your friend are both reading the text correctly according to different grammatical registers: she is reading the **ontological** grammar (what history *is*), and you are reading the **methodological** grammar (what the historian *does*).

  The reason you cannot resolve the argument is that the sentence *wie es eigentlich gewesen* is not a description of empirical reality (your worry) nor merely a professional boundary (her worry). It is a statement of **idealist metaphysics disguised as empirical modesty.**

  To break the deadlock without resorting to a survey of later critics, we need to look at the philological and philosophical grammar of the claim itself. Here is how the pieces fit together.

  ### 1. The Grammar of "Merely" (*bloß*)
  Your friend calls the word "merely" a rhetorical shrug. You call it a normative demand. The German original uses *bloß*. In 1824, within the context of German Romanticism and Idealism, *bloß* does not signify a diminution of value, but a **purification of intent.**

  When Ranke says he *bloß* wants to show how it actually was, he is not saying, "I will do a small thing." He is saying, "I will strip away the extraneous." The "lofty function" (judging/instructing) is rejected not because it is too high, but because it is **presumptuous.** It places the historian above the past. By refusing to judge, the historian places himself *below* the past, in a posture of submission.

  So, you are right that it is a demand (a discipline of self-abnegation), but your friend is right that it is a refusal of a specific kind of authority (the moralizing authority of the Enlightenment *philosophes*). It is an **ascetic claim.** It says: *I have disciplined my ego so that I can become a transparent medium.*

  ### 2. The Grammar of "Actually" (*eigentlich*)
  This is the crux of your deadlock. You are treating *eigentlich* as an epistemological marker (how do we *know* what happened?), while your friend is treating it as an ontological marker (what is the *being* of the event?).

  The stem is *eigen* (own). As your friend noted, Ranke believes every epoch is "immediate to God." In this theological-idealist framework, *eigentlich* does not mean "brute fact" (positivism) nor does it mean "subjective experience" (phenomenology). It means **"in accordance with its own inner idea."**

  To answer your envoy example directly:
  *   **The Envoy's View:** "I am defending Christendom."
  *   **The Archive's View:** "He is protecting revenue."
  *   **Ranke's *Eigentlich*:** Neither of these is the "actual" on its own. The *eigentlich* is the **historical tendency** that manifests *through* both the revenue and the religion.

  For Ranke, the "actual" is the spiritual reality that is driving the event. The envoy is an instrument of a larger historical force (the "idea" of the epoch). The envoy's self-description is a "fact," and the revenue stream is a "fact," but the *eigentlich* is the **relation** between them as willed by the divine order of history. The historian, looking back, can see the "idea" of the age working through the envoy in a way the envoy could not see himself.

  Therefore, your either/or is indeed anachronistic (your friend is right here). Ranke does not choose between "what they thought" and "what we reconstruct." He claims access to a **third term**: the objective spirit of the age, which is visible *in* the facts but not reducible to the agents' consciousness. *Eigentlich* means "properly," in the sense of "proper to its place in the divine whole."

  ### 3. The "Supreme Law" Sentence
  You argued that the "supreme law" sentence ("Rigorous presentation of the facts...") is a normative demand that contradicts the modesty of the "merely." Your friend argues it's just a guild rule.

  In the grammar of the preface, this sentence is the **bridge** between the method and the metaphysics.
  *   **Why is it a supreme law?** Because the "inner idea" (the *eigentlich*) cannot be intuited by speculation. It can only be divined through the rigorous collation of sources (*Quellenkritik*).
  *   **Why "however conditional and lacking in beauty"?** Because the "idea" often manifests in messy, contradictory, or ugly human actions. To impose "beauty" (narrative coherence) or "morality" (judgment) is to obscure the divine trace.

  So, the "supreme law" is the **ascetic practice** required to achieve the **ontological vision.** You cannot get to the *eigentlich* without the *Tatsache* (fact). The friend is right that it is a rule of the guild, but you are right that it is a substantive thesis: it claims that **truth is accessible only through philological rigor.**

  ### 4. Where You Are Both Overreading
  *   **You are overreading the constructivism.** You worry that if the "actual" isn't the agent's intent, it must be the historian's imposition. Ranke would reject this dichotomy. He believes the shape is **found**, not imposed, because the past itself is structured by God. He is not a twentieth-century critic; he is a nineteenth-century believer in historical objectivity as a form of piety. He thinks the "narrative shape" exists *in the past*, waiting to be uncovered.
  *   **Your friend is overreading the negation.** She says the famous sentence "does no work at all" regarding a theory of truth. This is too skeptical. It does immense work: it shifts the locus of truth from *moral utility* to *ontological presence.* It claims that the past has value *in itself*, regardless of what we can learn from it. That is a massive theoretical claim, not just a guild rule.

  ### 5. What the Preface Is Actually Doing
  You asked what a preface like this is *doing*. It is a **claim to authority via humility.**

  In 1824, history was dominated by two groups:
  1.  **Philosophers** (like Hegel) who deduced history from first principles.
  2.  **Moralists** (like Voltaire) who used history to teach lessons.

  Ranke's preface is a manifesto that says: *I have a higher authority than both of you.*
  *   Against the Philosophers: He says, "I stick to the facts" (the Supreme Law).
  *   Against the Moralists: He says, "I do not judge" (the Merely).

  By claiming he will *only* show "how it actually was," he is claiming exclusive access to the **thing itself.** He is arguing that his method (archival rigor) grants him a vision of the past that is closer to God's view than the moralist's judgment or the philosopher's system.

  ### Resolution
  To resolve your argument:

  1.  **On the "Merely":** You are right that it is a normative demand, but it is a demand for **self-erasure**, not just professional conduct. It is the condition of possibility for the truth claim.
  2.  **On the "Actually" (*eigentlich*):** Your friend is right that it refers to the "own-ness" (*Eigenen*) of the epoch. But you are right to press on the epistemology. Ranke's answer to your envoy example is that the "actual" is the **tendency of the age** visible through the contradiction between the envoy's words and the archives. The historian sees the "idea" working through the contradiction.
  3.  **On the "Supreme Law":** This binds the two. Rigor is the only path to the Essence.

  **The Verdict:** The sentence is not empty, but its content is **theological**, not empirical. It claims that if you scrub the facts clean of your own moralizing, the divine structure of the past will reveal itself.

  Your friend wins on the *meaning* of *eigentlich* (it is ontological/essential, not just empirical). You win on the *function* of the sentence (it is a methodological imperative, not just a shrug). But you both lose if you assume Ranke is operating within a modern secular epistemology. He is making a claim about the **legibility of God's will in human affairs**, secured by the new science of archival criticism.

  The "grammar of the claim" is: *Because* I submit to the supreme law of facts (method), *I am able* to show the thing as it is in its own essence before God (ontology), *therefore* I must refuse to judge it (ethics). The famous sentence is the middle term of that syllogism.
