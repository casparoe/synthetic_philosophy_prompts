      *   **Requirements:**
          *   Precise research question (determinate answer, not a survey).
          *   Critique of standard universalist/relativist positions (treating data as transparent vs. biased).
          *   Proposed Method: Conceptual, not empirical. Use ML analogs (distribution shift, adversarial perturbation) on three domains (harm, fairness, authority/purity).
          *   Timeline: Month-by-month plan (3 months).
          *   Success/Failure Conditions: Success = tractable criterion separating invariant content from spurious invariance. Failure = collapse into universalism/relativism or decorative analog.
          *   Risk Assessment: Metaphor overstretch, avoiding unsupported empirical claims (evo-psych/neuro).
          *   Constraints: No bibliography/citations/references. Accessible to non-philosophers but conceptually sharp. Not just "apply ML to ethics."

  2.  **Deconstruct the Core Idea:**
      *   *The Analogy:* Moral intuitions across cultures = Training Data. Universal moral principles = Robust Features. Cultural specificities = Distribution Shift/Noise.
      *   *The Problem:* Standard ethics treats agreement as truth (Universalism) or disagreement as truth (Relativism). Both ignore the *sampling bias* of the human species (we all share biology, planet, basic social needs).
      *   *The ML Insight:* In ML, if a model performs well on the test set, it might just be memorizing spurious correlations (e.g., cows always appear on grass). To find *real* features, we test on out-of-distribution (OOD) data or apply adversarial perturbations.
      *   *The Philosophical Move:* Treat "human nature/ecology" as the training distribution. Treat "radical hypotheticals" or "extreme cultural variations" as the OOD test. If a moral judgment holds under "adversarial" conceptual perturbation (changing the background conditions while keeping the core act), it's more likely "robust" (objective?) than if it breaks.
      *   *Constraint Check:* Must remain *conceptual*. I cannot propose running new psychological experiments. I must analyze *existing* conceptual frameworks using this lens.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but precise. "Robustness Testing for Moral Intuitions" or similar.
      *   **Research Question:** Needs to be sharp. "Can a formal criterion of 'conceptual robustness' distinguish between moral invariants grounded in objective normative structure versus those grounded in shared contingent biological/ecological constraints?"
      *   **Background/Problem:** Explain the WEIRD bias. Explain why Universalism (agreement = truth) and Relativism (disagreement = no truth) both fail to account for the *source* of the data. They treat the dataset as transparent.
      *   **Methodology:** This is the tricky part. How to do "adversarial perturbation" conceptually?
          *   *Idea:* Thought experiments that alter background conditions (ecology, biology, resource scarcity) without changing the act itself.
          *   *Domains:* Harm (does harm matter if biology changes?), Fairness (does reciprocity matter if resources are infinite?), Authority (does hierarchy matter if coordination costs are zero?).
          *   *Process:* Take a moral intuition. Perturb the context. Does the intuition hold? If yes -> Robust. If no -> Spurious/Contingent.
      *   **Timeline:**
          *   Month 1: Framework definition (mapping ML terms to Ethics).
          *   Month 2: Case studies (Harm, Fairness, Authority).
          *   Month 3: Synthesis and criteria formulation.
      *   **Success/Failure:**
          *   Success: A defined "Robustness Criterion."
          *   Failure: The analogy breaks, or it just proves we are all humans (trivial universalism), or it dissolves into relativism.
      *   **Risks:** Metaphor overstretch (ML isn't ethics). Avoiding empirical claims (I'm an engineer, not a biologist).

  4.  **Refining the Tone:**
      *   Must sound professional, academic, but accessible.
      *   Avoid jargon where possible, or define it clearly.
      *   Ensure the distinction between *empirical* psychology and *conceptual* ethics is maintained. The proposal is about *analyzing concepts*, not running subjects.
      *   *Self-Correction on "Objective":* The prompt asks to avoid committing to a specific metaethical theory. So, I shouldn't claim this *proves* objectivity. I should claim it distinguishes *structural invariance* from *contingent invariance*. The label "objective" is the target of the inquiry, not the premise.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Title:* "Conceptual Robustness: A Distribution-Shift Framework for Evaluating Cross-Cultural Moral Invariants."
      *   *Question:* "Does cross-cultural moral agreement reflect normative necessity or shared contingent constraints, and can a 'conceptual robustness' criterion distinguish the two?"
      *   *Critique:* Universalists see agreement as proof of truth. Relativists see disagreement as proof of contingency. Both ignore that the "sample" (humanity) is narrowly distributed (same planet, same biology). This is the "Training Set Bias."
      *   *Method:* Use "Adversarial Conceptual Perturbation." Instead of changing the act, change the *world* around the act.
          *   *Harm:* Perturb biological vulnerability.
          *   *Fairness:* Perturb resource scarcity.
          *   *Authority:* Perturb coordination complexity.
      *   *Timeline:* Keep it tight.
      *   *Risks:* Be honest about the "Metaphor Risk."

  6.  **Review against Constraints:**
      *   One page? (Need to keep it concise).
      *   No citations? (Check).
      *   Accessible to non-philosophers? (Explain "metaethical" briefly or contextually).
      *   Conceptually sharp? (Ensure it's not just "ML is like ethics").
      *   Determinate answer? (The goal is a criterion, not a book).

  7.  **Final Polish:** Check the language. Ensure "WEIRD" is explained contextually. Ensure the distinction between empirical data and conceptual analysis is clear (I am analyzing the *logic* of the invariants, not collecting new survey data). *Correction:* The prompt says "conceptual rather than empirical." I need to make sure I don't sound like I'm doing psychology. I am doing *philosophy of psychology* using ML heuristics.

      *   *Refining the Method:* I need to be careful not to say "I will test people." I will say "I will test *claims* against hypothetical distribution shifts."
      *   *Refining the Risk:* The biggest risk is that "robustness" just equals "evolutionary fitness," which reduces ethics to biology. I need to flag this as a failure condition (collapse into naturalism).

  8.  **Final Output Generation** (Proceeding to generate the text based on these thoughts).
answer: |-
  **Project Title:** Conceptual Robustness: A Distribution-Shift Framework for Evaluating Cross-Cultural Moral Invariants

  **Research Question**
  Does cross-cultural moral agreement reflect normative necessity (objectivity) or shared contingent constraints (species-specific bias), and can a formal criterion of "conceptual robustness" distinguish between the two without committing to a specific metaethical theory?

  **Background and Problem Statement**
  Current debates in moral psychology oscillate between universalism (cross-cultural agreement indicates objective moral truth) and relativism (disagreement indicates culturally constructed norms). Both positions treat the available cross-cultural data as transparent. They fail to account for "sampling bias" at the species level: all human cultures operate within a narrow band of biological, ecological, and cognitive constraints (the WEIRD problem generalized to *Homo sapiens* as a whole). In machine learning, a model trained on a narrow distribution may learn spurious correlations that appear robust until tested against out-of-distribution (OOD) data. Similarly, moral invariants (e.g., "harm is wrong") may appear universal only because no human culture exists outside the biological conditions that make harm salient. Standard ethical frameworks lack a diagnostic tool to separate *normative invariance* from *contingent invariance*.

  **Proposed Method: Conceptual Adversarial Evaluation**
  This project will not conduct empirical psychology but will apply a conceptual analog of ML distribution-shift testing to existing moral frameworks. I will treat specific moral intuitions as "models" and subject them to "adversarial conceptual perturbations"—hypothetical variations in background conditions (biology, ecology, resource scarcity) that preserve the act but alter the context.

  I will apply this diagnostic to three domains of documented divergence:
  1.  **Harm:** Perturb biological vulnerability (e.g., hypothetical agents who do not experience pain or death). Does the prohibition on violence hold, or does it collapse when the biological cost is removed?
  2.  **Fairness:** Perturb resource scarcity (e.g., hypothetical post-scarcity environments). Does reciprocity remain a moral requirement when competition is eliminated?
  3.  **Authority/Purity:** Perturb coordination complexity (e.g., hypothetical hive-mind or perfectly transparent societies). Do hierarchy and boundary-maintenance persist when social friction is removed?

  **Work Plan (Three Months)**
  *   **Month 1: Framework Formalization.** Define the mapping between ML robustness metrics (e.g., Lipschitz continuity, adversarial tolerance) and conceptual ethical stability. Establish the "null hypothesis": that all current moral invariants are artifacts of shared human ecology.
  *   **Month 2: Domain Stress-Testing.** Apply the adversarial perturbations to the three target domains (Harm, Fairness, Authority). Analyze existing philosophical thought experiments (e.g., Ring of Gyges, utilitarian calculus) through this lens to identify where intuitions break under distribution shift.
  *   **Month 3: Criterion Synthesis.** Formulate the "Robustness Criterion." Determine if any moral content survives the perturbation. Draft the final report distinguishing between *structural invariants* (survive shift) and *spurious invariants* (collapse under shift).

  **Success and Failure Conditions**
  *   **Success:** Production of a tractable "Conceptual Robustness Criterion" that allows ethicists to classify moral claims as either *contingently stable* (dependent on human-specific constraints) or *structurally robust* (independent of background conditions), without resolving the ultimate metaethical status of the latter.
  *   **Failure:** The analog collapses into pure universalism (asserting all robust features are objective) or pure relativism (asserting all features are biological artifacts). Alternatively, the ML terminology proves purely decorative, adding no analytical power to existing philosophical methods (e.g., reflective equilibrium).

  **Risk Assessment**
  *   **Metaphor Overstretch:** The primary risk is conflating mathematical robustness with normative force. I will mitigate this by explicitly framing the output as a diagnostic for *invariance*, not a proof of *truth*.
  *   **Empirical Overreach:** As a software engineer, I am not equipped to defend claims about evolutionary psychology or neurobiology. The project will remain strictly conceptual, treating biological constraints as logical parameters in a thought experiment rather than making empirical claims about human evolution.
  *   **Reductionism:** There is a danger that "surviving distribution shift" simply reduces morality to "what is useful for survival." I will address this by distinguishing between *functional stability* and *normative justification* in the final synthesis.
