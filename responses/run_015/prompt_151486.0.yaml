      *   *Mingjia Context:* The School of Names (*Mingjia*) is obsessed with the rectification of names (*zheng ming*), but not in the Confucian moral sense. It's about the correspondence between name (*ming*) and actuality (*shi*). For Gongsun Long, names track ontological distinctions.

