answer: |-
  This is a profound and precisely framed question. You have identified the central tension in interpreting the *Mingjia* (School of Names): the difficulty of separating logical semantics from ontological commitment in a philosophical tradition that does not recognize that distinction as we do. To read Gongsun Long through Frege or modern predicate logic is indeed to domesticate a text that strives to unsettle the very relationship between language and reality.

  To unpack the *White Horse Dialogue* (*Bai Ma Lun*) without anachronism, we must situate it within Gongsun Long's broader project, particularly the *Zhi Wu Lun* (On Pointing at Things). The argument is not merely a linguistic puzzle about intension and extension, nor is it a straightforward metaphysical claim about substance and attribute in the Aristotelian sense. Rather, it is a thesis about the **individuation of actualities (*shi*) through the precision of names (*ming*)**.

  Here is a conceptual unpacking of the argument's structure and its ontological commitments, focusing on the resources of *Ming*, *Shi*, *Zhi*, and the logic of *Tong* (Similarity) and *Yi* (Difference).

  ### 1. The *Ming-Shi* Correlation: Why Linguistic Difference Entails Ontological Difference

  In the Western analytic tradition, we are accustomed to the idea that two different descriptions (e.g., "The Morning Star" and "The Evening Star") can refer to the same object. We distinguish the *sense* of the term from its *reference*. Gongsun Long rejects this gap. For the *Mingjia*, the *Ming* (Name) is not a label attached to a pre-existing reality; it is the conceptual boundary that delineates the *Shi* (Actuality).

  When the interlocutor asks, "Is a white horse a horse?" they are asking about a relationship of inclusion or identity. Gongsun Long answers "No" (*Fei*) because he operates on a principle of **strict correspondence**: if the *Ming* differs, the *Shi* must differ.

  *   **The Argument:** "Horse" names the form (*xing*). "White" names the color (*se*). "White Horse" names the form and the color.
  *   **The Implication:** Since the content of the name "White Horse" includes a determinant (color) that the name "Horse" excludes (or leaves indeterminate), the *Shi* designated by "White Horse" cannot be identical to the *Shi* designated by "Horse."

  This is not merely about the "sense" of the words. It is a claim that reality is carved up by the specificity of our designations. A "Horse" is an actuality with indeterminate color. A "White Horse" is an actuality with determinate color. An indeterminate actuality is not identical to a determinate actuality. Therefore, the ontological commitment here is that **determinacy alters identity**.

  ### 2. The Ontology of Attributes: *Zhi* (Pointing/Designation)

  To understand whether properties are "separate entities," we must look to the *Zhi Wu Lun*. Gongsun Long argues that universals (like "Whiteness" or "Horseness") have a mode of existence independent of their instantiation in particular things. He calls this *Zhi* (Pointing/Designation).

  *   **Self-Subsisting Attributes:** "Whiteness" does not depend on a "White Horse" to exist as a concept/universal. It is a distinct *Zhi*.
  *   **The Compound:** When we say "White Horse," we are not merely modifying a substance. We are combining two independent *Zhi* (the universal of Horseness and the universal of Whiteness).

  This supports your intuition about a metaphysical thesis regarding the separability of properties. For Gongsun Long, "White" and "Horse" are ontologically distinct categories that do not merge into a seamless unity. They remain distinct even in combination. The "White Horse" is a specific **fixation** of these two independent universals.

  Consequently, the argument carries the metaphysical thesis that properties are not merely adjectival modifications of a substrate but are distinct ontological units that, when combined, create a new compound actuality. The "White Horse" is a distinct *kind* of being from the "Horse" because it involves the actualization of the universal "White" alongside the universal "Horse."

  ### 3. Mereology and the Logic of Compounds

  You asked whether there is an implicit mereological assumption—that adding whiteness produces a new kind of whole. This is astute, but we must be careful with the term "mereology," which implies parts and sums. Gongsun Long's logic is closer to a **logic of determination**.

  Consider the "Request Test" found in the dialogue:
  *   If you ask for a *horse*, a yellow or black horse will suffice.
  *   If you ask for a *white horse*, a yellow or black horse will not suffice.

  If "White Horse" were identical to "Horse," the response conditions would be identical. Since they are not, the entities are not identical.

  This suggests a mereological view where the **compound is not reducible to the simple**.
  *   **Horse:** A generic whole (indeterminate regarding color).
  *   **White Horse:** A specific whole (determinate regarding color).

  In Gongsun Long's ontology, the generic whole and the specific whole are not the same entity. The specific whole is not just the generic whole "plus" a description; it is a distinct *Shi* because its boundaries are tighter. The "White Horse" excludes black and yellow horses; the "Horse" includes them. Two things with different exclusionary boundaries cannot be the same *Shi*.

  Thus, the move from "Horse" to "White Horse" is not merely describing the same particular under a more specific description (which would preserve the underlying identity of the substance). Instead, it **shifts the identity conditions of the referent**. The referent of "Horse" is the class of all equine forms. The referent of "White Horse" is the subclass of equine forms fixed by whiteness. For Gongsun Long, the class and the subclass are distinct *actualities*.

  ### 4. *Tong* (Similarity) and *Yi* (Difference) in *Mingjia* Thought

  Your question about "similarity" and "difference" strikes at the heart of the *Mingjia* method. The Mohist Canons, which often critique Gongsun Long, define *Tong* (Sameness) in multiple ways: identity, unity, co-location, and kind. They argue that a white horse is the same as a horse in terms of *kind* (*lei*), even if they differ in specification.

  Gongsun Long, however, radicalizes *Yi* (Difference). He argues that if there is a difference in the *Ming*, there is a difference in the *Shi*. He collapses the Mohist distinction between "Kind Sameness" and "Specific Difference."

  *   **The Collapse:** For Gongsun Long, if $A$ and $B$ have different names, they are *Yi* (different). To claim they are *Tong* (same) is to confuse the *Ming*.
  *   **Rectification of Names (*Zheng Ming*):** The purpose of this rigorous separation is not sophistry for its own sake, but the stabilization of reality. If we allow "White Horse" to be "Horse," we allow indeterminacy to creep into our ontology. We lose the ability to distinguish the specific from the generic.

  Therefore, the dialogue is not just a linguistic puzzle. It is a metaphysical claim that **precision in naming preserves the integrity of reality**. If we conflate the compound with the simple, we blur the boundaries of the *Shi*.

  ### 5. Synthesis: Collapsing the Linguistic and Metaphysical

  To answer your core question: Is the argument chiefly about intension, or does it carry a metaphysical thesis?

  **It is both, because the *Mingjia* do not distinguish the two.**

  To read it as *only* linguistic (intension/sense) imposes a modern dualism where language maps onto a separate reality. To read it as *only* metaphysical (separate entities) risks making Gongsun Long sound like a naive realist about universals.

  The most faithful reading is that Gongsun Long posits a **structural isomorphism between Name and Actuality**.
  1.  **Linguistic Structure:** "White" + "Horse" $\neq$ "Horse". (The compound name is not the simple name).
  2.  **Ontological Structure:** The Actual of (Color + Form) $\neq$ The Actual of (Form). (The compound actuality is not the simple actuality).

  Because *Ming* and *Shi* must correspond, the logical non-identity of the terms entails the ontological non-identity of the things.

  **Regarding your specific query on mereology:**
  There is indeed an assumption that adding a determinant (whiteness) produces a new ontological unit with different modal properties (specifically, different conditions of satisfaction or "requestability"). However, it is not that the physical horse changes; it is that the **ontological unit designated** changes. The "White Horse" is a distinct *kind* of *Shi* from the "Horse."

  **Conclusion for your Seminar:**
  The *White Horse Dialogue* is best read as a **metaphysical logic of determination**. It argues that specificity creates ontological novelty. A determinate entity (White Horse) is not identical to an indeterminate entity (Horse), even if the former falls within the scope of the latter. Gongsun Long uses the "slipperiness" of language to reveal that our ordinary categories (like "is a") obscure real differences in the structure of actuality.

  The text challenges the seminar to consider: Does identity require total overlap of properties? If "Horse" implies "color-indeterminate" and "White Horse" implies "color-determinate," can they be identical? Gongsun Long says no. In doing so, he suggests that **naming is an act of ontological carving**, and to compound a name is to create a new boundary in reality. This avoids the Fregean trap by refusing to separate the "mode of presentation" from the "object presented." In the *Bai Ma Lun*, the mode of presentation *constitutes* the object.
