answer: |-
  Your friend is advocating a position known broadly as deflationism, but that label covers a family of views that range from the trivially linguistic to the metaphysically loaded, and your intuition that the slogan is doing different work in your two arguments is correct. To pin him down, we need to separate out three distinct readings of the claim that truth isn't a property and saying a sentence is true just is saying the sentence. The first reading is the strict redundancy theory, which holds that the word true is literally meaningless and can be eliminated from any sentence without loss of content, so that It is true that snow is white says nothing more than Snow is white. This is technically false as it stands because it fails to account for cases where we cannot produce the sentence itself, such as when you say Everything in the manual is true without knowing what the manual says, or when you say What she said yesterday was true without remembering her words. In these cases, true acts as a logical device for generalization or blind ascription, allowing us to commit to an infinite conjunction of sentences or a specific unknown sentence, so the word does genuine logical work even if it doesn't name a property. In your first argument about pragmatic success, this reading fails to deliver his conclusion because even if true is redundant, the equivalence remains, and the claim that true beliefs get you what you want translates to the claim that if you believe P and P is the case, you will succeed, which is still a substantive explanation of action. In your second argument about the stars, however, this reading supports him perfectly, because if asserting truth is just asserting the sentence, then verification is irrelevant; you are simply taking a stand on the number of stars, regardless of whether anyone can check it.

  The second reading is what philosophers call minimalism or disquotationalism, which is likely the strongest version available to him and admits that true has a function but denies it is a substantive property like mass or charge that explains why things happen. On this view, true is a logical device that enables us to generalize over sentences, but it does not pick out a natural kind that causes success or exists independently of our language. This is a substantive claim that survives scrutiny better than strict redundancy because it accommodates the generalization work you noted, though it struggles with cases like basically true or true but misleading, which suggest truth comes in degrees or competes with other virtues, whereas minimalism usually treats truth as binary and paramount. Regarding the liar paradox sentence like this sentence is false, this reading hits a wall because disquotation leads to contradiction, forcing the minimalist to admit some sentences lack truth values, which complicates the slogan that saying a sentence is true just is saying the sentence. In your first argument, this version allows him to argue that truth itself doesn't explain action, but rather the content of the belief does, so the property of truth is not the causal engine, though this is a subtle shift that doesn't fully collapse your claim that true beliefs are the successful ones. In the second argument about the stars, this version again supports him, because the truth condition is fixed by the sentence meaning, not by our epistemic access, so the worry about verification dissolves.

  The third reading is the expressivist or performative theory, which is essentially your guess that the slogan is about what we are doing with the word rather than what it represents. This view holds that calling a sentence true is not describing it but performing a speech act of endorsing, conceding, or agreeing with it, similar to saying I agree or Yes. This is a genuine distinct option and does not collapse into the others because it shifts the focus from semantic equivalence to pragmatic function, suggesting true is a tool for social coordination rather than a mirror of reality. This reading handles the generalization work well since endorsing everything in a manual is a coherent speech act, but it has trouble with fictional truth or true but misleading, since endorsing a fiction as true in the story requires a different operator, and endorsing something misleading suggests truth and usefulness can come apart. In your first argument, this reading actually undermines his conclusion because if calling something true is endorsing it, then the normativity of truth explains why we aim for it, and thus it does explain action by defining the goal of assertion. In the second argument, it supports him because endorsing a proposition about the past stars is possible even without verification, as the act of endorsement does not require proof, only commitment.

  Regarding your specific concern about where truth earns its keep, the only readings that accommodate the generalization cases like everything in the manual is true are the second and third, since the first reading cannot eliminate the word without losing the ability to quantify over sentences. The cases of basically true or true of a fictional character require us to admit that true is sometimes modified or context-dependent, which suggests that while truth itself might not be a substantive property, the concept is more complex than the slogan allows, and quietism about the property doesn't erase the semantic work the word performs. The liar paradox remains a problem for all three, but especially the first and second, because if saying a sentence is true is just saying the sentence, the liar sentence generates a contradiction that forces us to restrict the slogan, meaning it cannot be a universal rule. Your guess that the slogan is about speech acts is therefore not only distinct but potentially more robust in handling the social function of truth, though it doesn't settle the metaphysical debate your group is having.

  If I must be committed about which reading he probably meant, it is almost certainly the second one, minimalism, because it is the standard philosophical position associated with the claim that truth is not a property, whereas the first is too easily refuted by generalization and the third is less common in analytic metaphysics circles. The strongest version available to him is also the second, as it concedes the logical utility of the word while denying it any explanatory power in science or metaphysics. However, my verdict on your two arguments is that he is wrong about the first and right about the second. In the first case, even if truth is not a substantive property, the generalization that true beliefs lead to success is still an explanatory principle, because it captures the reliable connection between content and world, so his claim that it can't explain anything about action is an overreach that confuses causal properties with logical norms. In the second case, he is correct that the worry about verification dissolves, because truth conditions are determined by the meaning of the sentence and the state of the world, not by our ability to check them, so the deflationary move successfully blocks the verificationist worry. Your intuition that the slogan settles neither argument is half-right; it settles the metaphysical worry about verification but fails to kill the pragmatic argument about success, because even a deflated truth predicate still tracks the relationship between belief and reality that makes action successful.
