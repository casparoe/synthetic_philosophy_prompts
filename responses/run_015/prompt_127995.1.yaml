          *   *Translation:* High exclusion costs create artificial scarcity. Path-dependent allocation locks in historical inequities. Subtractability is low (labor markets absorb).
          *   *Fit:* Path-dependence, exclusion costs, subtractability analysis.
          *   *Distortion:* "Rights" become "efficiency/welfare gains."
          *   *Missing:* Moral equality, inherent liberty.

  4.  **Drafting the Translation (Section by Section):**

      *   *Introduction:* Acknowledge the constraint. Set the stage: Territory as a resource system.
      *   *Position A (Exclusion/Property):* Focus on exclusion mechanisms and maintenance costs.
      *   *Position B (Exclusion/Community):* Focus on collective-choice rules and group definition.
