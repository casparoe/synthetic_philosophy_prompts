      *   **Task:** Restate the open borders vs. state exclusion debate using *only* specific resource-governance vocabulary (commons regimes, subtractability, exclusion mechanisms, collective-choice rules, path-dependent resource allocation).
      *   **Requirements:**
          *   Translate major positions (Property Analogy, Self-Determination/Association, Distributive Justice).
          *   Identify what translates cleanly, what is distorted, and what lacks a counterpart.
