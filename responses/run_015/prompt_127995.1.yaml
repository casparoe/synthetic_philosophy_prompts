answer: |-
  ### Translation Protocol: Territorial Access as Resource Governance

  **System Definition:** The global habitable surface is treated as a finite resource system. States function as local governance regimes managing specific sub-units of this system. Migration is the flow of users across regime boundaries.

  ---

  ### Position 1: The Enclosure Argument (Analogous to Private Property)
  **Philosophical Claim:** States possess a proprietary title to territory, granting them a discretionary right to exclude non-members, analogous to a homeowner excluding trespassers.

  **Governance Translation:**
  Current state regimes function as **enclosed commons** rather than open-access systems. The "right to exclude" is translated as the **capacity to maintain exclusion mechanisms**. Proponents argue that current users (citizens) bear the maintenance costs of the resource infrastructure (institutions, capital, ecology). Therefore, they hold the **residual claim** on the resource's yield. To allow open access would constitute a "free rider" problem where new users consume the yield without contributing to the historical capital accumulation or maintenance costs.

  *   **Translates Cleanly:** The logic of **exclusion mechanisms**. If the cost of excluding is low and the resource is rivalrous, enclosure prevents overuse. The argument that current users funded the infrastructure maps to investment in resource maintenance.
  *   **Distorted:** "Ownership" implies a moral title independent of utility. In resource governance, exclusion is justified by sustainability or efficiency, not inherent title. This argument smuggles a *legal* fiction (title) into a *technical* function (exclusion capacity).
  *   **Lacks Counterpart:** The concept of *absolute discretion*. In commons regimes, even enclosed ones, exclusion rules are subject to higher-order constraints (e.g., non-waste conditions). The idea that a regime can exclude even if **subtractability** is near-zero (i.e., no congestion) has no basis in resource efficiency logic.

  ### Position 2: The Collective-Choice Argument (National Self-Determination)
  **Philosophical Claim:** Political communities have a right to shape their own culture, laws, and destiny. Unrestricted migration disrupts the associative bonds and shared values necessary for democratic functioning.

  **Governance Translation:**
  A stable resource regime requires a defined user group to establish **collective-choice rules**. High-velocity user turnover increases transaction costs for negotiating operational rules. Proponents argue that migration flows alter the preference aggregation within the regime, destabilizing existing **institutional-design principles**. The "culture" is translated as a set of established **operational norms** that reduce monitoring and enforcement costs. If the user group changes too rapidly, the **path-dependent resource allocation** becomes inefficient because the new users do not share the historical context required to sustain the current rules.

  *   **Translates Cleanly:** The relationship between group definition and **collective-choice rules**. Stable user groups lower the cost of reaching consensus on extraction/use limits.
  *   **Distorted:** "Self-determination" implies an intrinsic good of autonomy. In governance terms, this is reduced to *transaction cost minimization*. The emotional/ethical weight of "shared destiny" is flattened into "rule stability."
  *   **Lacks Counterpart:** The *boundary of the group itself*. Resource governance assumes the user group is already defined to analyze the rules. It cannot explain *who* gets to be in the initial group without circular reasoning (i.e., "the group decides who is in the group").

  ### Position 3: The Open-Access Argument (Distributive Justice)
  **Philosophical Claim:** Birthplace is morally arbitrary. All humans have equal moral worth and should have equal access to the opportunities provided by the earth's resources. Restricting movement perpetuates global inequality.

  **Governance Translation:**
  Territorial boundaries function as artificial **exclusion mechanisms** that create rent-seeking opportunities for incumbent users. Since labor is a mobile factor of production, restricting its movement reduces global efficiency. The current allocation is **path-dependent**, locking in historical advantages (colonial extraction, industrial head-starts) that are not reflective of current **subtractability** constraints. Advocates argue that where **subtractability** is low (e.g., housing in low-density areas, labor demand), exclusion mechanisms create deadweight loss. The global resource system should be managed closer to an open-access regime with regulated use, rather than fragmented enclosed clubs.

  *   **Translates Cleanly:** The analysis of **subtractability** and efficiency. If a resource unit is non-rival (e.g., a job that needs filling), exclusion is economically wasteful. The critique of **path-dependent resource allocation** accurately describes how historical accumulation creates current barriers.
  *   **Distorted:** "Moral equality" is translated as "factor mobility efficiency." The claim that humans *deserve* access becomes a claim that resources are *underutilized* without them.
  *   **Lacks Counterpart:** The *claimant status*. Resource governance manages users; it does not validate the inherent right of a user to exist or claim resources. The argument that a human has a claim *prior* to the regime's rules is external to the framework.

  ---

  ### Residue Report: The Untranslatable Material

  In translating these positions into the vocabulary of commons regimes, a significant residue remains. This residue consists of concepts that dissolve when stripped of normative metaphysics and treated purely as governance variables.

  **1. The "Moral Arbitrariness" of Boundaries**
  *   **The Residue:** Open borders advocates argue birthplace is morally arbitrary.
  *   **Governance Reality:** In resource governance, boundaries are *never* arbitrary; they are design features intended to reduce monitoring costs.
  *   **Analysis:** This is not evidence of a moral distinction the economics misses, but rather a category error. The philosophical argument appeals to a "view from nowhere" (global original position). The governance framework operates from a "view from within the system." The residue here shows that **distributive justice** requires a meta-regime (a global governance layer) that does not exist. Without a global **collective-choice rule**, the "arbitrariness" is irrelevant to the local **exclusion mechanism**. The framework reveals that open borders is not a claim about resources, but a demand for a new, higher-level institutional design.

  **2. The "Right" to Exclude vs. Capacity to Exclude**
  *   **The Residue:** Defenders of exclusion claim a *right*, not just a capacity.
  *   **Governance Reality:** Governance distinguishes only between *feasible* exclusion and *costly* exclusion.
  *   **Analysis:** This residue suggests the philosophical argument depends on **conceptual moves** that dissolve under scrutiny. Treating territory as property (Position 1) is an attempt to harden a **governance choice** (we choose to exclude) into a **natural fact** (we own this). The economic framework exposes that "sovereignty" is simply a monopoly on **exclusion mechanisms**. If **subtractability** is low, the "right" to exclude looks like rent-seeking. The residue here is ideological camouflage for resource hoarding.

  **3. Associative Obligations vs. Rule Stability**
  *   **The Residue:** The claim that citizens owe more to each other than to outsiders.
  *   **Governance Reality:** This translates to "insiders have lower transaction costs for cooperation."
  *   **Analysis:** This is the most critical residue. The philosophical claim is that the *relationship itself* has value. The economic translation reduces the relationship to a *tool* for efficiency. If the untranslatable material is the *intrinsic value of community*, then commons economics is normatively blind. However, if we treat "community" as a **resource** (social capital) that is **subtractable** (diluted by rapid inflow), the argument becomes empirical: *Does migration deplete social capital?*
  *   **Verdict:** The residue indicates that political philosophy relies on a notion of **membership** that precedes the **institutional design**. Commons theory assumes membership is a variable to be designed. Philosophy assumes membership is a moral status.

  ### Conclusion: Moral Distinction or Conceptual Dissolution?

  The untranslatable material is primarily evidence that the philosophical arguments depend on **conceptual moves** that dissolve once territorial access is treated as a governance problem.

  1.  **Sovereignty as Magic:** The "right to exclude" loses its force when revealed as a variable **exclusion mechanism** subject to cost-benefit analysis regarding **subtractability**.
  2.  **Justice as Design:** "Distributive justice" cannot exist within a single regime's vocabulary; it requires a **meta-governance** framework. The failure to translate this is not a failure of economics, but a recognition that justice is a property of the *system of regimes*, not the regimes themselves.
  3.  **The Moral Core:** The only residue that survives as a genuine **moral distinction** is the status of the *human claimant*. Resource governance treats users as inputs. Political philosophy treats them as ends. If you accept the premise that humans are merely resource users, the philosophical arguments collapse into efficiency calculations. If you reject that premise, the governance framework is insufficient to adjudicate the debate.

  **Final Assessment:** The commons framework successfully demystifies the *mechanics* of exclusion (showing it is a design choice, not a natural right) but cannot resolve the *ethics* of membership without importing an external norm regarding the moral weight of the claimant. The debate, therefore, is not about resource governance, but about whether the global resource system should recognize a single class of users or multiple, tiered classes. That is a political choice, not an economic one.
