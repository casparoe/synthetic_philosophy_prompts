          *   **Constraint:** Keep the translation honest. Do not smuggle in rights/sovereignty assumptions. Treat failures to translate as the most interesting part.

  2.  **Deconstruct the Vocabulary:**
      *   *Commons Regimes:* Shared resource systems with defined user groups and rules.
      *   *Subtractability (Rivalry):* One user's consumption reduces availability for others.
      *   *Exclusion Mechanisms:* Technical or institutional costs to keep non-members out.
      *   *Collective-Choice Rules:* How the user group decides on operational rules.
      *   *Path-Dependent Resource Allocation:* Historical decisions constrain current/future distribution options.

  3.  **Map Political Philosophy Arguments to Economic/Governance Terms:**

      *   **Argument 1: Territorial Boundaries as Private Property (Defenders of Exclusion).**
          *   *Philosophy:* States own territory like individuals own land; right to exclude is inherent to ownership.
          *   *Translation:* Territory is a club good or enclosed commons. Exclusion mechanisms are legitimate if maintenance costs are borne by current users.
          *   *Fit:* Exclusion mechanisms, subtractability (if crowded).
          *   *Distortion:* "Ownership" implies moral title, not just technical exclusion capacity.
