answer: |-
  Project Title: The Grip of Reasons: Internalism, Externalism, and the Case of Emotion

  This proposal outlines a chapter of approximately 8,000 to 10,000 words intended for submission as a work-in-progress this term. The core aim is to test the resilience of reasons internalism by shifting the focus from reasons for action to reasons for emotion. The standard debate between internalists and externalists is almost exclusively conducted using cases of action. The internalist insists that for something to be a reason for an agent, there must be a sound deliberative route from their existing subjective motivational set to the action in question. This constraint is motivated by the idea that reasons must be able to 'grip' the agent—they must be capable of motivating via deliberation. However, a significant portion of our normative lives involves assessing emotions rather than actions. We tell others they have no reason to be afraid, that they ought to be angrier, or that they should have got over their grief by now. Emotions are not produced by deliberation in the way actions are; one cannot simply decide to feel grief or fear via a deliberative route. This chapter argues that emotional cases split the internalist's options in a way action cases do not, forcing a dilemma that reveals whether the 'grip' requirement is a substantive constraint on reasons or merely an artefact of an action-centric model.

  The research question is tightened as follows: Does the internalist requirement of a 'sound deliberative route' survive the transition from reasons for action to reasons for emotion, and if not, what does this asymmetry imply for the viability of internalism regarding action? The question is determinate because it asks for a verdict on whether the internalist constraint can be consistently applied across categories. If the internalist must abandon the constraint for emotions to preserve plausible normative judgements, they owe an explanation for why the constraint remains necessary for actions. If they retain the constraint for emotions, they must accept implausibly restrictive claims about when emotions are reason-assessable. Either way, the action debate is forced to move.

  Existing positions leave this open because the literature has treated reasons for emotion as secondary or reducible. Internalists often assume that if emotions are reason-responsive, they are so only insofar as they are tied to actions or beliefs that *are* deliberatively accessible. Externalists often concede the action case to fight on broader metaphysical grounds about normativity. Consequently, neither side has fully interrogated whether the specific mechanism internalism proposes—deliberative accessibility from prior motivations—is actually doing the work in cases where deliberation is not the primary mode of production. The debate remains stalled on action because both sides can massage the examples: internalists idealise the deliberative route until it is nearly empty, while externalists argue that idealisation empties it too much. Emotions offer a harder test case because the 'route' into an emotion is not just difficult to trace; it is often conceptually distinct from deliberation.

  A primary objection I anticipate handling head-on is the claim that reason-claims about emotions are merely claims about fittingness or aptness. A supervisor might argue that saying 'you have reason to be angry' is just saying 'anger is fitting', which is an externalist notion by definition, meaning my test case smuggles in externalism from the start and proves nothing. The plan deals with this by distinguishing between retrospective assessment and prospective normative pressure. While fittingness is often retrospective (was this emotion appropriate to the object?), our language of reasons for emotion is frequently prospective and guidance-oriented (you ought to cultivate more sympathy; you have reason to calm down). If internalism is supposed to capture the guidance function of reasons, it must explain how reasons for emotion guide us without a deliberative route. If the internalist concedes that reasons for emotion are purely fittingness claims without a guidance component, they must explain why reasons for action retain the guidance component. This forces the internalist to clarify whether the 'grip' requirement is about the nature of reasons themselves or merely about the specific domain of voluntary action. The chapter will not assume that reasons for emotion are identical to reasons for action, but will argue that if they are both instances of 'practical reasons' (or reasons for attitudes), the divergence in treatment exposes a fault line in the internalist theory itself.

  The approach for the term is structured to ensure the argument remains within the 8,000 to 10,000-word limit while securing the dialectical ground. Weeks one and two will be dedicated to mapping the internalist constraint as it standardly appears in the action literature, specifically isolating the 'grip' requirement and the role of idealisation. I will not attempt a full literature review but will focus on reconstructing the strongest version of the internalist argument to ensure I am not attacking a straw man. Weeks three and five will focus on constructing the emotional cases. I will select three paradigm cases: grief (where reasons persist despite lack of control), fear (where reasons often conflict with safety), and anger (where reasons are often socially normative). The goal here is not a philosophy of emotion but a demonstration of how we actually use reason-language in these contexts. Weeks six and seven will be the core argumentative phase, applying the internalist constraint to these cases and working through the dilemma: either the internalist denies the reasons exist (implausible) or accepts them without a deliberative route (conceding externalism). Week eight will be dedicated to the fittingness objection outlined above, refining the distinction between assessment and guidance. Weeks nine and ten will focus on drawing the implications back to the action debate and drafting the text.

  I have considered two obvious alternatives to this approach. The first is to run the argument on reasons for belief instead of emotion. Doxastic involuntarism presents similar challenges to voluntarism in action. However, reasons for belief are often already treated as externalist in the literature (evidence provides reasons regardless of motivational set), so the tension is less acute. The internalist about belief often retreats to a different formulation than the Williams-style internalist about action. Emotions sit in a middle ground: they are not fully voluntary like actions, but not purely evidence-responsive like beliefs. They involve concern and valuation, making them a sharper test for the 'motivational set' requirement. The second alternative is to bypass the internalism debate and simply argue for a fittingness theory of emotions. While viable, this would sidestep the philosophical payoff I am aiming for, which is to use emotions to break the deadlock in the broader reasons debate. My goal is not to settle the theory of emotion, but to use emotion as a lever to move the reasons debate. Focusing purely on fittingness would isolate the chapter from the department's broader interests in moral psychology and normativity.

  There are significant risks regarding scope. The most dangerous temptation will be to drift into a general theory of emotion. To stay within 10,000 words, I must treat emotions as fixed points of data regarding our normative practices rather than attempting to define their metaphysical nature. I will rely on intuitive cases rather than psychological theory. If I find myself needing to defend the existence of reasons for emotion at length, the chapter will fail; I must take it as a datum that we do criticise emotions using reason-language and ask what best explains that practice. Another risk is that the chapter becomes purely negative, showing internalism fails without offering a positive alternative. To avoid this, the conclusion will focus on what the externalist gains from this asymmetry: specifically, that externalism can unify reasons for action and emotion under a single account of normative fit, whereas internalism requires a disunified theory.

  Success for this chapter looks like a clear demonstration that the internalist constraint cannot be uniformly applied without loss of plausibility. It does not need to refute internalism entirely, but it must show that the cost of maintaining it across both action and emotion is higher than currently acknowledged. Failure would look like ending with the conclusion that emotions are simply a different category with different rules, without explaining why. If the chapter concludes that reasons for action and reasons for emotion are fundamentally disanalogous, it must explain why we use the same word 'reason' for both. If I cannot account for that unity, the chapter will have identified a puzzle without advancing a solution. A further failure condition would be if the fittingness objection proves insurmountable; if it turns out that 'reasons for emotion' are linguistically distinct from 'reasons for action' in a way that precludes comparison, the leverage is lost. I will mitigate this by focusing on cases where the transition from emotion to action is seamless (e.g., having reason to be angry leads to having reason to protest), showing that the normative pressure flows between the two.

  Ultimately, this chapter aims to show that the internalist's 'grip' requirement is either too weak to constrain action (if idealised enough to cover emotion) or too strong to cover emotion (if strict enough to constrain action). By forcing the internalist to choose which horn of the dilemma to accept, we clarify what the requirement was ever for. If they choose the weak horn, externalism wins on action. If they choose the strong horn, internalism loses on emotion. Either way, the debate progresses. This fits the work-in-progress session well because it invites critique on the specific examples used and the strength of the dilemma, allowing me to refine the argument before final submission. I am confident the weekly plan is realistic, provided I resist the urge to expand the philosophy of emotion beyond what is necessary to service the reasons debate.
