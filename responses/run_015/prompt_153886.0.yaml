answer: |-
  This is a fantastic intuition. You've put your finger on the exact reason why the Absent-Minded Driver (AMD) problem keeps philosophers and game theorists up at night. You are moving past the *mathematical* paradox (which is about time inconsistency) and into the *phenomenological* paradox (what it feels like to be an agent who can't trust their own memory).

  The "gut-level issue" you're sensing is a collision between **Agency** (I am pulling a lever to change the world) and **Diagnosis** (My pulling of the lever tells me where I am).

  Here is the breakdown of why that knot feels so tight, and why standard solutions often feel like they are dodging the question.

  ### 1. The Evidential Trap: Why "Continue" Looks Safer
  You asked why evidential reasoning (EDT) recommends continuing, even if you are sitting at Exit B.

  In standard decision theory, your action is a **cause**. In AMD, because of the memory loss, your action becomes a **symptom**.

  Imagine you are at an intersection. You don't know if it's A or B. You ask yourself: *"If I choose to Exit right now, what does that say about the world?"*

  Because you are absent-minded, you know you are running a single, uniform policy. You can't decide "Exit only at B." You can only decide "Exit with probability $p$."
  *   **If you choose Exit:** You are effectively activating the policy "I am an Exiter." Since Exit A comes first in the sequence, the vast majority of "Exit" events happen at A. Therefore, choosing to Exit is strong **evidence** that you are at A. You are correlating your action with the bad payoff.
  *   **If you choose Continue:** You are activating the policy "I am a Continuer." This policy survives Exit A. Therefore, choosing to Continue is strong **evidence** that you have survived the danger zone and are likely approaching B.

  **The Gut Punch:** Even if you are physically sitting at B, you aren't allowed to use that information (because you don't *know* it). You only have access to your decision rule. EDT tells you: *"Don't Exit, because people who Exit tend to be at A. Continue, because people who Continue tend to make it to B."*

  Your choice is supposed to be a lever, but EDT treats it like a mirror. It reflects your location back at you, and the reflection is scary. So you keep driving, even when you should stop.

  ### 2. The Causal Breakdown: The Sticky Lever
  Now look at Causal Decision Theory (CDT). CDT tries to ignore the evidence and focus on the impact. It says: *"Ignore what your choice says about the past; focus on what it does to the future."*

  But in AMD, the "lever" is sticky.
  Normally, if I flip a switch here, it doesn't change whether I flipped a switch five minutes ago. But in AMD, **you are the same agent at both nodes.**

  If you decide "I will Exit now," you must acknowledge that if you were at the previous node, you would have made the exact same decision (because you can't distinguish the nodes).
  *   **The Causal Illusion:** You want to think, "I am at B, so if I Exit, I get the prize."
  *   **The Causal Reality:** If you Exit at B, you *also* Exit at A. You cannot causally isolate the B-decision from the A-decision.

  So when CDT tries to calculate the value of Exiting, it has to account for the fact that pulling the lever *here* implies pulling the lever *there*. You aren't just choosing an outcome at B; you are choosing a **path through the whole tree**.

  **The Gut Punch:** CDT breaks because it assumes you can intervene on the current node without intervening on the past node. But your absent-mindedness glues the nodes together. You can't be a local surgeon; you're a systemic hacker. If you change the code here, it changes the code there. This makes the "causal impact" of your choice impossible to localize.

  ### 3. The Missing Layer: Memory-About-The-Decision
  This is where your specific framing shines. Standard textbook resolutions (like Piccione & Rubinstein's "consistent planning") usually solve this by saying: *"Ignore the feeling at the intersection. Just calculate the optimal probability $p$ at the start of the trip and stick to it."*

  They solve it from the perspective of the **Planner** (you at the start, with full memory).
  But you are asking about the perspective of the **Driver** (you at the intersection, with no memory).

  The "memory-about-the-decision" layer creates a dissociation of agency:
  1.  **To choose rationally, I need to know the consequences of my choice.**
  2.  **The consequences depend on where I am.**
  3.  **Where I am depends on what I would have chosen previously.**
  4.  **But I don't remember what I chose previously.**

  So, to know what my choice *now* will do, I need to know what my choice *then* was. But "then" and "now" are the same mental state.

  **The Paradox of Control:**
  You feel like you should be able to say, "I am at B, so I will Exit." But to know you are at B, you would need to remember *not* Exiting at A. But if you had the capacity to remember not Exiting at A, you wouldn't be absent-minded.

  The standard resolution tells you to **pre-commit**. It says, "Don't try to reason at the intersection; just execute the script."
  But that feels unsatisfying because it denies the reality of the **experience of choice**. At the intersection, you *do* feel like you are making a choice. You *do* feel the weight of the steering wheel. To be told "Your choice is an illusion; just follow the script" feels like it's dissolving the agent entirely.

  ### Summary: The Knot
  The paradox lives in the fact that **your decision is both the signal and the switch.**

  *   **As a Signal (EDT):** Your decision tells you where you are. Since "Exiting" signals "Likely A," you are evidentially punished for trying to get off at B.
  *   **As a Switch (CDT):** Your decision controls the path. But because the switch is duplicated across time and you can't track which one is active, you can't isolate the causal effect.

  **Why standard resolutions miss it:**
  They resolve the *math* by forcing consistency between the Planner and the Driver. They say, "The Driver's beliefs must match the Planner's probabilities."
  But they don't resolve the *agency*. They don't explain how it feels to be a rational agent whose rationality is undermined by the fact that **you are your own evidence.**

  You are trying to steer a car, but your hands are tied to the wheel in such a way that turning left here means you turned left back at the start. You want to steer, but the car is steering you. That is the gut-level vertigo of the Absent-Minded Driver.
