      *   *Scenario:* Suppose my plan is "Exit with probability $p$."
      *   *The User's specific worry:* "Why does evidential reasoning seem to recommend always continuing past the first exit, even if he's actually sitting right at B?"
      *   *Correction/Refinement:* Actually, in standard AMD, EDT often leads to *time inconsistency* or specific paradoxical probabilities. But the user's intuition is about the *diagnostic* value of the action.
