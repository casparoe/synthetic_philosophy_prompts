prompt: |-
  hey, i'm taking a course on rational choice and we got into the absent-minded driver problem, but i want to push past the usual textbook version where the driver just forgets which exit he's at. my friend brought up this weirder framing: what if the absent-mindedness is structural, meaning the driver can't track his own node in the decison tree? like, he knows there's a correct exit B and a wrong exit A, and he's either approaching one or the other, but he also knows that if he decids to take whatever exit is in front of him, that very decison updates his belief about which exit he's at — not because the world changed, but because he reasons about whether he "would do this" at B versus A.

  i'm trying to understand the conceptual knot that arises when you combine that self-locating update with an actual choice rule. specifically, why does evidential reasoning seem to recomend always continuing past the first exit, even if he's actually sitting right at B and needs to turn? and why does the causal picture also break down once you allow that he might not remember having made the decison in the first place — so the action doesn't reliably cause anything because his future self doesn't know it happened? can you explain the gut-level issue here: how can an agent choose rationally when his own choice functions both as evidence for being at A and as a causal lever that only works if he remembers pulling it? i don't need a formal proof or reading list, just help seeing where the paradox actually lives and why the standard resolutions feel like they're missing this memory-about-the-decision layer.
