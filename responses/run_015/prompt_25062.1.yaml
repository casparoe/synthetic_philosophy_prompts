          *   *Kayla:* Focuses on the *extensive* margin (new participants) and dynamic effects (habit formation).

      *   **Campbell's Law:** Related to Goodhart's. "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures." Diego's CEO analogy fits here.

      *   **Measurement Error vs. Behavioral Response:**
