answer: |-
  The duplex pattern you have identified is a precise description of the current friction between criminal law and neuroscience. The law operates with a split ontology: it treats the defendant as a physical mechanism when asking *why* they might be less blameworthy (mitigation), but as a rational agent when asking *if* they are blameworthy at all (conviction).

  The causal exclusion argument threatens to collapse this distinction. If the physical domain is causally closed (every physical event has a sufficient physical cause), and mental states are not identical to physical states, then mental states appear to be causally idle. If they are idle, they cannot be the basis for liability. If they are not idle, then physical determinism seems threatened.

  Here is a reconstruction of the implicit theories of mental causation compatible with your observed pattern, evaluated against the three options you provided.

  ### 1. Non-Reductive Physicalism
  **The Theory:** Mental states are realized by neural states but are not reducible to them. A mental property (like "intending to kill") supervenes on a neural property but retains distinct causal powers, often understood as "downward causation" or causal relevance at a higher level of abstraction.

  *   **Fit with the Duplex Pattern:** High. This is the most comfortable fit for current legal practice. It allows the defense to argue that the *realizing base* (the brain) was compromised (mitigation), while the prosecution argues that the *realized property* (the intention) was present (conviction). The brain caused the movement, but the intention caused the *action* (the movement under a description).
  *   **Coherence:** It renders the pattern coherent by positing two levels of description that are both causally potent. The neural evidence explains the *capacity* for intention; the mental evidence establishes the *exercise* of that capacity.
  *   **What Practice Would Have to Give Up:** Practically, nothing. This is likely the implicit metaphysical commitment of most legal scholars who defend the status quo. However, to maintain this explicitly, the law would have to reject the strong version of the causal exclusion argument. It would have to commit to the philosophical view that higher-level explanations are not merely convenient summaries of lower-level physics but track real causal powers. If forced to defend this in court, legal theorists would need to articulate why a "purpose" is not just a shadow of a "synapse" but a distinct causal variable.

  ### 2. Epiphenomenalism
  **The Theory:** Conscious mental states are byproducts of neural activity. Neural events cause behavior; mental events are caused by neural events but cause nothing in return.

  *   **Fit with the Duplex Pattern:** Poor. This creates a severe tension. If consciousness is inert, the *mens rea* requirement (purpose, knowledge) is metaphysically idle. It implies that the law is punishing people for having a specific type of inner shadow, even though that shadow did not guide the hand.
  *   **Coherence:** It makes the pattern incoherent unless the law admits it is using *mens rea* as a proxy for neural states. Under this view, mitigation makes perfect sense (the brain is the driver), but conviction becomes problematic. Why require "purpose" if purpose does nothing?
  *   **What Practice Would Have to Give Up:** To adopt this explicitly, the law would have to abandon the idea that it punishes *agency*. It would have to admit that *mens rea* is merely an evidentiary heuristic—a reliable sign that the relevant neural circuitry was active—rather than a moral prerequisite. The practice would shift from blaming the *mind* to managing the *organism*. The "guilty mind" would be reclassified as a "guilty brain state that correlates with a conscious experience." This would undermine the retributive justification for punishment, pushing the system purely toward incapacitation and risk management.

  ### 3. The Answerability-Substitute View
  **The Theory:** The *mens rea* requirement is not a claim about causal mechanics at all. It is a normative procedural rule. Asking "what were you trying to do?" is not an inquiry into the engine of the action, but a test of whether the defendant is a suitable subject for moral address. Mental states are retained because they are the currency of *answerability*, not the cause of *movement*.

  *   **Fit with the Duplex Pattern:** High, but for different reasons than Non-Reductive Physicalism. It accepts that neuroscience might explain the *movement* (causation), but insists that law is concerned with the *justification* (reasons). Mitigation uses neuroscience to show the defendant *cannot* answer (broken capacity); conviction uses *mens rea* to show the defendant *can* answer and their answer was culpable.
  *   **Coherence:** It makes the pattern highly coherent by separating the causal question from the normative question. The causal exclusion argument becomes irrelevant to conviction because conviction is not about causation; it is about accountability.
  *   **What Practice Would Have to Give Up:** The law would have to stop pretending that intentions are "mental forces" that push bodies. Judicial instructions and legal theory would need to shift vocabulary from "causing the result" to "owning the result." It requires a frank admission that the law is not a science of behavior but a practice of judgment. Lawyers would stop arguing that the intention *made* them do it, and start arguing that the intention *defines* what was done.

  ### Underdetermination in Current Practice
  The current legal practice is philosophically underdetermined. It oscillates between these three views depending on which side of the duplex pattern is active.
  *   During **mitigation**, the law flirts with **Epiphenomenalism** (the brain made me do it, my conscious self was along for the ride).
  *   During **conviction**, the law speaks like a **Non-Reductive Physicalist** (my mind chose this).
  *   During **sentencing and judgment**, the law often functions like the **Answerability-Substitute** view (regardless of the physics, can you justify this?).

  The inconsistency you observe arises because the law treats these as compatible without explicitly reconciling the metaphysics. It assumes a "compatibilist" intuition without doing the philosophical work to support it.

  ### If Causal Exclusion Were Accepted: Would the Law Collapse?
  If the courts explicitly accepted the causal exclusion argument as decisive—meaning they agreed that *only* neural events are causally efficacious and conscious intentions are causally redundant—the legal gradations of purpose, knowledge, recklessness, and negligence would **not necessarily collapse**, but their justification would have to shift.

  **1. The Neural-Capacity Criterion (The Collapse Scenario)**
  If the law viewed itself strictly as a mechanism for predicting and controlling dangerous physical events, the gradations would collapse. If only neural states cause harm, the only relevant legal question would be: "Does this defendant's neural architecture pose a high risk of future harm?" The distinction between murder (purposeful) and manslaughter (reckless) relies on the *content* of the thought. If thoughts are causally inert byproducts, the content matters less than the firing pattern. In this scenario, the law becomes purely preventive. Grading based on moral blameworthiness vanishes, replaced by grading based on neural dysfunction severity.

  **2. The Survival of Mentalistic Vocabulary (The Normative Scenario)**
  However, the law could retain its mentalistic vocabulary if it adopts the **Answerability-Substitute View**. Even if neural events cause the movement, the *description* of the event depends on the agent's perspective.
  *   **Reason:** The law is not just regulating events; it is regulating *relationships* between citizens.
  *   **Mechanism:** "Purpose" and "Knowledge" are not causal claims; they are classifications of the agent's relationship to the norm. Even if a neural state caused the shooting, we distinguish "purpose" from "recklessness" to communicate *why* we condemn the actor.
  *   **Outcome:** The gradations survive not as descriptions of causal power, but as descriptions of **normative violation**. A purposeful killer violates the norm against killing in a way a reckless driver does not, regardless of whether the "purpose" was a neural epiphenomenon. The vocabulary remains because it is necessary for the *communicative* function of the law (expressing societal condemnation), even if it is redundant for the *mechanistic* function (explaining the movement).

  **Conclusion**
  The duplex pattern is stable only as long as the law remains agnostic about the metaphysics of mind. If forced to choose, the law does not need to abandon mentalistic vocabulary even if it accepts causal exclusion. It would, however, have to abandon the claim that it punishes people because their minds *caused* crimes. It would instead punish them because their minds (even if causally inert) define the *meaning* of the crime, and that meaning is the only thing that makes punishment intelligible rather than mere quarantine. The practice would have to give up the illusion of "mental force" but could keep the reality of "moral reason."
