      *   **Recommendation:** Clearly state the decision (Conditional Approval/Pilot Program).
      *   **Rationale:** Explain *why*. It balances precaution with scientific pragmatism. It treats the ethics as a theoretical exercise first, not a regulatory hammer.
      *   **Implementation Plan:** Define the conditions (Working Group, Thresholds, Sunset Clause).
