      *   **The Ask:** Mandate a philosophical risk-evaluation layer for physics protocols exceeding a decoherence-rate threshold. Model aggregate micro-suffering. Adjust parameters to minimize it (without banning research).
      *   **Board Conflict:** Faction A (Category mistake, untestable metaphysics) vs. Faction B (Legitimate extension of precautionary ethics).
      *   **Key Constraint 1:** Must take seriously the strongest objection (lack of empirical access to phenomenal states = narrative imagination replacing institutional judgment).
      *   **Key Constraint 2:** Acknowledge the "legislative imagination" aspect (novelist perspective) without sentimentality.
      *   **Key Constraint 3:** No bibliographies, citation lists, or further readings.
      *   **Key Constraint 4:** Addressed to the board as an actionable institutional record, not personal counsel.
      *   **Recommendation:** Choose a concrete course (Approve modified, Reject, or Approve with conditions/timeline).
