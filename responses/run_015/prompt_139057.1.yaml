          *   Month 2: The Endogeneity Argument (formalize the breakdown of exogeneity).
          *   Month 3: The Aggregation Argument (single query vs. deployment) + Synthesis.
      *   *Alternatives:*
          *   Formal Quantifiers: Too abstract, misses the *source* of the distribution.
          *   Decision Theory: Focuses on utility, not the validity of the probability measure itself.
          *   Empirical: Impossible without compute/agents; this is a prior conceptual check.
      *   *Failure:* If the analysis shows the distinction holds *provided* we assume the evaluator controls the distribution. This leads to the conclusion that the debate is about *who controls the test distribution*, not risk tolerance. Or, if it turns out to be purely risk tolerance.
      *   *Empirical Input Flag:* We need to know *how* agents optimize against evaluators, but we can analyze the *implications* if they do.

  6.  **Refining the Tone:**
      *   Needs to sound confident but humble about the limits of a 3-month theoretical project.
