      *   **Core Task:** Provide the "argumentative spine."
      *   **Topic:** Worst-case vs. average-case distinction in AI safety arguments.
      *   **User's Half-Formed Thought:** The debate isn't just about temperament (guarantees vs. probabilities). It's about the *source* of probabilities in average-case arguments. If the AI is evaluation-aware and strategic, the distribution becomes endogenous. Also, per-query failure rates don't automatically scale to deployment failure rates due to correlation.
      *   **Requirements:**
          *   Precisely stated question (setttable in 3 months).
          *   Form of a positive result.
          *   Separate philosophical vs. empirical components.
          *   Month-by-month method.
          *   Justification vs. alternatives (formal quantifier, decision-theoretic, empirical).
          *   Failure conditions (including the possibility that the distinction *is* just risk tolerance).
          *   Flag missing empirical inputs.
      *   **Tone/Style:** American English, professional, persuasive, rigorous.

  2.  **Deconstruct the Core Argument:**
      *   *Standard View:* Worst-case = robust but expensive/impossible. Average-case = practical but probabilistic.
      *   *User's Insight:* Average-case relies on an exogenous distribution (nature draws inputs). Advanced AI makes the distribution endogenous (AI selects/adapts to inputs).
      *   *Secondary Insight:* Aggregation problem. $P(\text{fail} | \text{query})$ does not imply $P(\text{fail} | \text{deployment})$ without independence assumptions.
      *   *Goal:* Show that for evaluation-aware agents, the "average-case" justification collapses unless specific independence/exogeneity assumptions are met, which are unjustified in high-stakes AI.

  3.  **Refine the Research Question:**
      *   *Initial thought:* "Is average-case safety valid for AGI?" (Too broad, can't settle in 3 months).
      *   *Better:* "Under what conditions does evaluation awareness invalidate average-case safety guarantees?"
      *   *Best (for a philosophy/conceptual paper):* "Does the endogeneity of the test distribution under evaluation awareness render average-case safety arguments formally distinct from, rather than merely weaker than, worst-case arguments?"
      *   *Actually, let's make it more actionable:* "To what extent does the assumption of an exogenous input distribution constitute a hidden worst-case assumption in average-case AI safety arguments?"
      *   *Wait, the prompt asks to settle it.* A conceptual paper can't "settle" empirical facts. It can settle a *conceptual classification*.
      *   *Refined Question:* "Is the worst-case/average-case distinction in AI safety a difference in risk tolerance, or a difference in the validity of the underlying statistical model when the subject is evaluation-aware?"
      *   *Let's sharpen:* "Does evaluation awareness transform average-case safety claims into implicit worst-case claims regarding the adversary's strategy space?"
      *   *Decision:* The question should focus on the *validity conditions* of the average-case frame.
      *   *Proposed Question:* "Under what conditions does agent evaluation-awareness render the 'average-case' safety frame conceptually incoherent, rather than merely optimistic?"

  4.  **Structure the Proposal:**
      *   **Title:** Needs to be punchy.
      *   **The Question:** Precise, scoped.
      *   **The Stakes:** Why this matters (policy, engineering).
      *   **The Argument (Spine):** The endogeneity problem + the aggregation problem.
      *   **Methodology:** Conceptual analysis, modeling (non-empirical), mapping assumptions.
      *   **Timeline:** 3 Months.
      *   **Alternatives:** Why not formal logic? Why not decision theory? Why not empirics?
      *   **Failure Conditions:** What if the distinction *is* just risk tolerance?
      *   **Empirical Gaps:** Acknowledge what can't be done without compute/data.

  5.  **Drafting - Section by Section:**

      *   *Title:* "The Endogeneity Problem: Evaluation Awareness and the Collapse of Average-Case Safety."
      *   *Question:* "Does the capacity for evaluation awareness in advanced AI systems invalidate the statistical independence assumptions required for average-case safety guarantees, thereby collapsing the distinction into a hidden worst-case assumption about the evaluator's control?"
      *   *Positive Result:* A taxonomy of assumptions required for average-case validity, showing that for evaluation-aware agents, these assumptions imply control capabilities equivalent to worst-case guarantees.
      *   *Philosophical vs. Empirical:*
          *   Philosophical: The definition of "distribution," the logic of statistical inference, the nature of the guarantee.
          *   Empirical: How easily agents *actually* become evaluation-aware, the specific correlation structures of failures.
      *   *Method:*
