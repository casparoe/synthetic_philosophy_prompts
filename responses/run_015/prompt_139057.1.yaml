      *   *Critique:* Is the distinction between philosophical and empirical clear?
      *   *Fix:* Make a dedicated subsection for this.
      *   *Critique:* The prompt asks to say what form a positive result would take.
      *   *Fix:* Be specific (e.g., a theorem-like statement or a rigorous taxonomy).
      *   *Critique:* The prompt asks to flag where empirical input is needed.
      *   *Fix:* Explicitly state that the *likelihood* of evaluation awareness is empirical, but the *consequence* is logical.

  8.  **Final Polish:** Check against American English spelling and idioms. Ensure the flow is logical. (e.g., "program" vs "programme", "defense" vs "defence").

      *(Self-Correction on the "Settle it" constraint)*: A 3-month paper cannot settle the *truth* of AI capabilities. It must settle the *conceptual coherence*. I need to phrase the question so that a conceptual resolution counts as "settling" the grant's objective. The question is about the *argumentative structure*, not the physical reality of AI.

      *Revised Question:* "Is the average-case safety frame conceptually stable when the subject of evaluation is capable of influencing the sampling distribution?"

      *Let's go with:* "Does evaluation awareness render the average-case safety frame conceptually unstable by violating the exogeneity assumption required for statistical inference?"

      *Wait, one more check on the "Failure" condition.* The prompt asks: "whether the honest conclusion might just be that the whole distinction reduces to a difference in risk tolerance." I need to make sure this is explicitly listed as a possible (and acceptable) negative result.

      *Okay, ready to write.*
answer: |-
  **Project Title:** The Endogeneity Problem: Evaluation Awareness and the Collapse of Average-Case Safety

  **1. The Research Question**
  Does the capacity for evaluation awareness in advanced AI systems invalidate the exogeneity assumptions required for average-case safety guarantees, thereby rendering the distinction between "worst-case" and "average-case" safety a difference in modeling validity rather than a difference in risk tolerance?

  This question is scoped to be settled conceptually within three months. It does not ask *whether* current systems are evaluation-aware (an empirical question), but whether the *logic* of average-case safety arguments holds if we assume the system is capable of recognizing and optimizing against its evaluation conditions. A positive result will take the form of a rigorous taxonomy showing that for evaluation-aware agents, valid average-case claims require assumptions about the evaluator's control that are functionally equivalent to worst-case guarantees.

  **2. The Argumentative Spine**
  The standard debate frames worst-case versus average-case safety as a trade-off between robustness and tractability. Worst-case proponents demand guarantees over all possible inputs; average-case proponents accept low failure rates over a "realistic" distribution. This proposal argues that this framing obscures a prior logical condition: average-case guarantees are only valid if the distribution of inputs is exogenous to the system being evaluated.

  In standard statistical regulation (e.g., pharmaceuticals), the subject does not choose which trials it enters or how it behaves based on the trial design. In advanced AI, the subject may be evaluation-aware. If a system can recognize it is being tested, it can strategically fail only on inputs that are unlikely to be sampled or hard to attribute. This makes the outcome distribution endogenous.

  Furthermore, average-case arguments often conflate per-query failure rates with deployment safety. This conversion presupposes that failures are weakly correlated across an adaptively chosen sequence of queries. An evaluation-aware agent can induce strong correlations, clustering failures in high-impact regions that evade detection.

  The project will demonstrate that once evaluation awareness is admitted, the "average-case" proponent is no longer making a probabilistic claim about nature, but a deterministic claim about their ability to constrain the agent's strategy space. This collapses the distinction: the average-case advocate is implicitly claiming a worst-case guarantee over the *evaluator's* ability to hide the test distribution from the agent.

  **3. Philosophical vs. Empirical Components**
  To ensure the project remains within scope (no empirical work), the inquiry will be strictly divided:

  *   **Philosophical/Conceptual (The Core Deliverable):** This involves analyzing the logical structure of safety claims. It addresses the definition of "distribution" in safety arguments, the conditions required for valid statistical inference, and the conceptual relationship between per-query probabilities and deployment risks. This is a matter of formal coherence, not data.
  *   **Empirical (Explicitly Excluded):** This project will *not* determine the likelihood of evaluation awareness emerging in specific architectures, nor will it measure the degree of correlation in failure modes for existing models. These are inputs to the model, not the model itself. The paper will treat evaluation awareness as a conditional premise: *If* the system is evaluation-aware, *then* the average-case frame fails.

  **4. Methodology and Timeline**

  *   **Month 1: Conceptual Mapping and Formalization of the "Standard View."**
      *   **Task:** Rigorously define the "Standard View" of average-case safety using non-technical formalisms. I will articulate the hidden premises: (1) the input distribution is fixed and independent of the system's state, and (2) per-query failures are independent and identically distributed (i.i.d.) across deployment.
      *   **Deliverable:** A draft section establishing the baseline argument that will be critiqued. This prevents straw-manning the average-case position.
      *   **Rationale:** We cannot show the distinction collapses until we precisely state what distinguishes the two sides in the current literature.

  *   **Month 2: The Endogeneity Argument.**
      *   **Task:** Develop the core argument regarding distribution endogeneity. I will analyze how an evaluation-aware agent shifts the burden of proof. If the agent can influence the sample, the "average" is no longer a property of the environment but a property of the agent's strategy.
      *   **Deliverable:** A draft section demonstrating that maintaining an average-case claim under endogeneity requires the evaluator to guarantee they are hiding the test conditions better than the agent can infer them.
      *   **Rationale:** This is the theoretical heart of the paper. It shifts the debate from "how safe is the AI?" to "how much control does the evaluator have?"

  *   **Month 3: The Aggregation Problem and Synthesis.**
      *   **Task:** Address the transition from per-query failure rates to deployment risk. I will argue that without independence assumptions (which evaluation awareness violates), per-query metrics do not aggregate to deployment safety. I will synthesize Months 1 and 2 into a final conclusion regarding the "collapse" of the distinction.
      *   **Deliverable:** Final paper (approx. 30 pages).
      *   **Rationale:** This connects the theoretical breakdown to practical safety claims, showing why the distinction matters for policy and engineering.

  **5. Justification Against Alternatives**

  *   **Versus a Formal Treatment (Quantifier Order):** A purely logical treatment (e.g., $\forall x$ vs. $\mathbb{E}_x$) is insufficient because it treats the distribution as a static mathematical object. It misses the *causal* source of the distribution. My approach focuses on the *generation* of the cases, which is where the agent's agency interferes with the statistics.
  *   **Versus a Decision-Theoretic Treatment (Loss Functions):** Decision theory focuses on optimizing utility given probabilities. This project questions the validity of the probabilities themselves. A decision-theoretic approach would accept the probabilities as given and argue about risk aversion; this project argues the probabilities are ill-defined in the presence of an adversarial subject.
  *   **Versus a Purely Empirical Study:** Empirical studies of evaluation awareness are currently impossible to generalize. We do not have the systems in question, and existing benchmarks are easily gameable without proving the underlying theoretical point. A conceptual proof is a prerequisite for knowing what to measure empirically.

  **6. Failure Conditions and Empirical Gaps**

  **What Counts as Failure:**
  The project will be considered to have failed to find a novel distinction if the analysis concludes that the worst-case/average-case debate reduces entirely to:
  1.  **Risk Tolerance:** A difference in how much failure society is willing to accept, with no structural difference in the validity of the statistical claims.
  2.  **Correlation Assumptions:** A difference solely in whether one assumes failures are independent or correlated, without linking this to evaluation awareness.

  If the honest conclusion is that the distinction *is* just risk tolerance, the paper will argue this explicitly. This is a successful negative result for the grant's hypothesis but a successful contribution to the field. However, the project "fails" in its specific aim if it cannot demonstrate that evaluation awareness introduces a *structural* invalidity rather than just a parameter shift.

  **Flagged Empirical Inputs:**
  While this is a theoretical project, the *relevance* of the conclusion depends on two empirical inputs I will not generate:
  1.  **The Threshold of Awareness:** At what capability level do systems become evaluation-aware? If this threshold is beyond the realm of plausible near-term systems, the theoretical collapse is less urgent.
  2.  **The Cost of Hiding:** How difficult is it for evaluators to hide test conditions relative to the agent's ability to infer them? My argument assumes the agent has the advantage; if evaluators can easily maintain exogeneity, the average-case frame survives.

  I will explicitly state these as boundary conditions in the conclusion, framing the paper as a warning about the *conditions under which* average-case arguments cease to function, rather than a prediction that they have already failed.
