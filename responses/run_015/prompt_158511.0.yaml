answer: |-
  Dear Colleague,

  I am writing to offer a detailed design for your upcoming ninety-minute seminar session on the species problem, structured as an experiential tribunal simulation rather than a lecture. The goal is to force your twelve students to feel the conceptual pressure of defining species from the inside, allowing the failure of essentialism and the inadequacy of pure conventionalism to emerge from their own deliberations. To begin, arrange the room into three distinct tables, seating four students at each to form three independent panels. Each panel receives an identical sealed dossier containing raw data packets that describe five distinct biological populations, none of which are named or labeled with taxonomic ranks in the materials. The data packets should include field notes describing morphology, mating-observation logs indicating reproductive compatibility, ecological-niche maps showing habitat use, and genetic-distance matrices illustrating relatedness. The five cases embedded in these materials are designed to break any single definitional rule you might propose. The first is a ring-species analog where adjacent populations interbreed freely but the terminal populations do not. The second is a morphologically identical but reproductively isolated cryptic pair. The third is a hybrid swarm actively exchanging genes with both parental lineages. The fourth is a paraphyletic group that excludes one of its own descendants. The fifth is a bacterial lineage whose evolutionary history is reticulate rather than tree-like due to extensive horizontal gene transfer.

  You must instruct each panel that their task is to construct a single binary legal criterion for what counts as a protected species under a fictional international treaty. This treaty awards conservation funding only at the species level and explicitly excludes hybrids, subspecies, and unranked populations. They have fifteen minutes to draft this rule, which must be clear enough to be applied consistently. Following this, give them twenty minutes to apply their drafted rule to all five cases in the dossier and record which qualify for funding and which do not. It is crucial that you do not intervene during this thirty-five minute period, even if you hear them struggling or attempting to redefine terms mid-stream. After the application phase, convene a plenary defense session for the remaining fifty-five minutes where panels present their rules and their classifications for the five cases. As they present, guide them to discover that every criterion either arbitrarily splits a continuous gradient or lumps together entities with no shared evolutionary trajectory. For example, a rule based on morphology will fail to distinguish the cryptic pair, while a rule based on reproductive isolation will collapse the ring species into a single unit despite the terminal incompatibility, or fracture it arbitrarily depending on where the line is drawn. A rule based on genetic monophyly will struggle with the bacterial lineage and the paraphyletic group, while an ecological niche definition may fail to capture the hybrid swarm or the cryptic pair.

  Only after the students have fully experienced this failure should you, as the facilitator, name the philosophical positions at stake. You should map each panel's specific crisis point onto one of these positions, such as morphological essentialism, the biological species concept, phylogenetic monophyly, or ecological niche essentialism. Explain why each position looked locally plausible given the data they had, and then price the cost of abandoning it, showing how each concept sacrifices certain biological realities to maintain conceptual coherence. In this debrief, you must also be explicit about what the simulation cannot reproduce. You need to tell them that this classroom tribunal lacks the institutional authority and historical contingency that actually drive taxonomic revision in working biology, where consensus often emerges from power dynamics and tradition rather than pure logic. You must also highlight that the simulation cannot generate the emotional and political weight that conservationists attach to named species, neither of which can be generated by a classroom tribunal with no real stakes, meaning their frustration is intellectual rather than existential.

  You should also be prepared for predictable failures in student reasoning that typically arise the first time you run this activity. Students will tend to patch their rules with ad hoc exceptions rather than recognizing the underlying conceptual failure, such as adding a clause that says unless it is a ring species. Another common outcome is that one panel will likely propose a disjunctive definition that technically covers all five cases but explains nothing, such as saying a species is either reproductively isolated or morphologically distinct or genetically cohesive. To handle these failures without stepping in to lecture, you should ask them to justify the principle behind the exception or the disjunction. Ask them what unifying property justifies grouping these exceptions together under the same legal term if not a shared biological reality. Push them to see that a rule with enough exceptions ceases to be a rule and becomes a list, which is the essence of the conventionalist collapse you want them to encounter. By refusing to validate their patches and instead asking for the underlying principle, you force them to confront the instability of their own definitions. This approach ensures that the lesson lands not as a dogma you have taught them, but as a structural problem they have uncovered themselves, leaving them with a visceral understanding of why the species problem remains unresolved in philosophy of biology.

