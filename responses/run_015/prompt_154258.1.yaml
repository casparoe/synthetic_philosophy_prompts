  I'm currently enrolled in a graduate seminar that bridges formal decision theory with conceptual AI alignment, and we've spent the last several weeks working through updateless decision theory and its relationship to causal and evidential frameworks. One tension that keeps surfacing in our discussions is the problem of pre-commitment under logical uncertainty: if an agent fixes its policy before resolving uncertainty about its own reasoning process or about the causal structure of its reward mechanism, standard updateless treatments seem to require treating future computations as logical consequences rather than as evidence. To make this concrete, I recently constructed a toy case in which an updateless AI must choose a transparency protocol—whether to expose its internal weights to an oversight mechanism—while being logically uncertain about whether that exposure causally influences the evaluation function that determines its utility. The exercise made me realize that I don't actually know which conceptual knots in this space are the ones that genuinely constrain everything else.

  Rather than a broad survey, I'm hoping you can help me prioritize. Among the open questions in updateless decision theory—whether logical uncertainty can be integrated without collapsing into evidential conditioning, how updateless agents should treat self-referential computations, whether pre-commitment retains normative force when the agent can predict its own deviation, and how these issues affect AI architectures that must lock in deliberation protocols before observing outcomes—which two or three are genuinely upstream? For each, I want to understand why settling it would restructure the others, whether it is tractable with current philosophical and formal tools rather than requiring entirely new mathematics, and what kind of partial result over the next year or two would cause you to revise the ranking. I'm writing a focused term paper with about ten weeks of work available, so I need a defended agenda that tells me where limited effort actually changes the conceptual landscape, not just a list of unresolved problems.
