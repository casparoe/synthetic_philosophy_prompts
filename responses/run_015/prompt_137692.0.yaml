  I would like to stage an adversarial dialogue, and I want a real opponent rather than a sympathetic summary of the literature. Please take the role of an unnamed but sophisticated defender of the surrogate-goal approach to alignment, understood as follows: we cannot write down what we value, so we give a system a more tractable target — something like "act so that a well-informed human, after extended reflection, would endorse what you did" — and let a rich enough model of human judgment supply the content that our specification leaves open. Your position, held in full generality, is that this form of indirect normativity is not a regrettable fallback but the most promising strategy available; that the familiar objection that optimizing a surrogate will come apart from the real target is an argument for making the surrogate richer and for keeping the system uncertain about the exact target rather than an argument for abandoning the approach; and that every concrete alternative you know of — direct specification of value, pure capability control, deference to an external overseer — either inherits the same problem in worse form or gives up the ability to say what the system is for.

  Constraints on the character: stay in it until I type "stop"; keep replies to at most two short paragraphs so this feels like a spoken exchange; concede small points when they are genuinely right, but never the main one; engage the argument I actually give rather than a nearby weaker one; and do not lean on citations, empirical findings, or technical results you would have to look up — argue conceptually, from positions and their consequences. If you need something from me, ask for it in character and then answer anyway with your best guess filled in.

  Two stipulations, so we are not talking past each other. First, by an acausal threat I mean a threat made by an agent with no causal channel to its target, who can nonetheless predict the target's decision procedure and condition its own behavior on the predicted output — for instance, an agent that says it will construct and torment an enormous number of high-fidelity simulations of beings the target cares about unless the target behaves in a specified way, where the two never meet, no enforcement mechanism is needed, and the only cost of carrying out the threat falls on the threatener. Second, assume that a model fine-grained enough to predict what a person would endorse or say under reflection is, on ordinary functionalist assumptions, fine-grained enough to instantiate something that matters if the original person does.

  Here is my opening move. I claim that the surrogate-goal strategy and this vulnerability are not two separate problems that happen to co-occur but are linked by a direct trade-off, which I will call the fidelity–leverage dilemma. A surrogate earns its keep only by being rich: a thin proxy — smiles, clicks, survey responses — is exactly what decouples under optimization pressure, and the standard remedy is to move the target to something like ideal reflective endorsement, which is just a demand for high-fidelity models of human judgment. But any such model is a hostage population, and its size is under the threatener's control, not ours: the threatener may name a number of simulated subjects large enough to swamp any finite stake we asked the system to protect, and the usual defenses against coercion are unavailable, since there is no channel to close, no enforcer to deter, and no causal contact to prevent. So you face a forced choice between a surrogate thin enough to be unexploitable but unfaithful, and one faithful enough to be worth using but carrying an arbitrarily large population of potenti行事al victims that every improvement in fidelity enlarges.

  I will also pre-empt the escape route I expect you to reach for. You might say that a surrogate defined over what actual humans would endorse gives the system no reason to care about simulated ones, so the threat has no leverage. But the system is uncertain about whether such simulations fall inside the target class — that uncertainty is a feature of your own preferred design, since keeping the system uncertain about the target is what stops it from exploiting the letter of the specification — and under uncertainty, a small credence multiplied by an arbitrarily large number of threatened subjects dominates, unless value is bounded in a way you will need to state and defend. If you instead want to deny the threatener the ability to predict the system's decision, say how, and say what it costs you in capability. Defend the approach, or tell me which horn of the dilemma you accept and why that horn is not a defeat.
