answer: |-
  The smell in Booth Four was always the same: ozone, stale coffee, and the hot-dust scent of overheating servers. Mara wiped down the haptic collar of the immersion suit, her fingers tracing the frayed edge of the synthetic leather. On the console, the standby light pulsed a slow, rhythmic green, like a resting heartbeat.

  Elias sat in the chair. He was older than most clients, his hands folded neatly in his lap, devoid of the trembling anxiety that usually accompanied the thirty-day fade.

  "You understand the standard protocol," Mara said, her voice flat. She didn't look at him; she looked at the dual-column readout on the screen. *Source Integrity* on the left. *Replica Fidelity* on the right. "Thirty days of gradual affective dilution on the Source. Simultaneous construction of the Replica. At day thirty, the Replica wakes at one hundred percent emotional intensity. The Source remains at approximately ten percent."

  "I know how it works, Mara," Elias said. His voice was calm, dry. "I'm asking you to disable the Replica branch."

  Mara's hands stopped moving. She turned to face him. "The Replica is the point, Mr. Elias. The clinic isn't a hospice. It's an archive. You pay to have the *weight* of your life carried forward."

  "And I am paying to test a hypothesis." Elias leaned forward slightly. The sensors in the chair whined as they adjusted to his shift. "If psychological continuity is preserved—if I remember my wife's name, the color of her eyes, the way the light hit the kitchen table—does the intensity of the grief matter? If the narrative remains, but the pain is thinned... am I not still the survivor?"

  Mara looked at the console. There was a physical key for this, kept in a locked drawer beneath the desk. The *Null-Replica Override*. She had used it twice in five years. Both times for patients with terminal religious objections to cloning. Both times, the families had sued.

  "The Hollows always say they're fine," Mara said. She walked around the desk, leaning against the edge. "I spoke to Subject 402 last week. Day twenty-eight of his fade. He told me he remembered loving his daughter. He could recite her birthday. But he said it felt like reading a biography about a stranger. He said, 'I know I'm me, but I don't feel like I'm here.'"

  "And yet he persisted," Elias countered. "Narrative continuity is the only metric that matters. The 'feeling' of being here is just chemical noise. I want to see if a self can exist without the noise."

  Mara looked at the dials. The *Affect Density* slider was currently locked at *Variable*. To do what Elias asked, she'd have to slide it to *Linear Decay* and kill the *Replica Initiation* circuit.

  It wasn't just about the rules. It was about the metaphysics of the room. Mara had watched hundreds of transfers. She knew the moment the Copy woke up—the sudden intake of breath, the tears, the raw, screaming gratitude of being *heavy* again. And she knew the Originals, the ones who stayed in the booth. They walked out lighter. Not happier. Just... buoyant. Unmoored.

  They claimed they were the same person. The law said they were the same person. But Mara wondered if identity wasn't a single thing, but a composite. A story told with a specific volume. If you turned the volume down to zero, was the music still playing? Or was it just the vibration of the speakers?

  *Weighted presence.* That's what she called it in her head. The gravity of a soul. The Copy had the gravity. The Original kept the orbit.

  "If I do this," Mara said, her hand hovering over the console, "you don't get to survive. Not really. You get to... taper off. You'll be a ghost in your own skin for the rest of your life. You might forget why the memories matter at all."

  "Or," Elias said, closing his eyes, "I will prove that survival is a structural integrity, not an emotional one. I will survive without the burden of caring. Isn't that a kind of peace?"

  Mara looked at the key in her hand. It was cold brass.

  She thought about the smell of ozone. It smelled like lightning, like something had been struck and changed. That was the clinic's promise: *Survive the strike.* But Elias was asking to be the ground that absorbed the lightning, dissipating it until nothing was left but warm earth.

  If she turned the key, was she a technician facilitating a procedure, or an accomplice to a slow suicide? If she refused, was she protecting him, or imposing her own superstition that *feeling* was the same as *being*?

  The hum of the cooling fans seemed to grow louder, filling the silence between them. The green light on the console pulsed. *Resting heartbeat.*

  Mara inserted the key. It clicked into the slot with a heavy, mechanical finality. She didn't turn it yet. She looked at Elias. He looked peaceful. Too peaceful. A man ready to become a footnote in his own story.

  "There's no going back after day ten," Mara said. "The synaptic pathways for affect harden. You'll be locked in the fade."

  "I understand."

  Mara's thumb rested on the key. She thought about the *Weighted Presence*. If she turned it, Elias would remain continuous, a straight unbroken line of memory. But the line would lose its ink. It would become a pencil sketch, fading until the paper was blank. Was the blank paper still the drawing?

  She didn't know. No one knew. That was why they came here. To gamble on the definition of a soul.

  Mara took a breath, smelling the ozone, the dust, the human sweat on the collar. She gripped the key. She didn't know if she was saving him or erasing him. She only knew that the machine was waiting, and the hum was the only sound in the universe that mattered.

  She turned the key. The green light shifted to amber. The pumps engaged with a low shudder.

  "Initiating Gradient Protocol," the system voice announced. "Replica branch: Disabled. Source dilution: Active."

  Elias exhaled, a long, slow sound, and settled back into the chair. Mara stepped back to the console and watched the *Affect Density* graph begin its slow, downward slope. It looked like a hill someone was quietly eroding. She watched the line drop, waiting to see if the man in the chair was still there, or if he was already sliding away.
