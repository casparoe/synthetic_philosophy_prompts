answer: |-
  Your calculation is correct, but your philosophical conclusion is unsound because the choice of the $N$-gon discretization is itself an arbitrary application of the Principle of Indifference that merely shifts the ambiguity from the continuum to the choice of discretization.

  The mathematical limit of your proposed construction is indeed $1/3$. If you inscribe a regular $N$-gon, select two distinct vertices uniformly at random to define a chord, and let $N \to \infty$, the probability that the chord exceeds the length of the inscribed equilateral triangle's side converges to $1/3$. This corresponds exactly to the "random endpoints" method in the continuous case. However, this does not resolve the paradox in favor of $1/3$, nor does it exonerate the Principle of Indifference (PoI) from the charge of ambiguity.

  The core error in your argument is the claim that the $N$-gon construction is a "privileged discretization" because it involves a "single uniform choice over a single finite set." This distinction is illusory. To define a chord via an $N$-gon, you are implicitly asserting that the *boundary* of the circle is the privileged locus of randomness. You have applied the PoI to the set of vertex pairs, but you could just as easily apply the PoI to a finite set of *midpoints*. If you overlay a fine square grid on the disk, select all grid points falling inside the circle as potential midpoints, and assign them equal probability, the limit as the grid spacing goes to zero yields $1/4$. Alternatively, if you discretize the space of lines intersecting the circle (parameterized by angle and distance from the center) and assign uniform probability to those parameters, the limit yields $1/2$. All three are "single uniform choices over a single finite set" in the discrete regime; they simply differ in which geometric feature (endpoints, midpoints, or line parameters) is taken as the primitive sample space.

  Consequently, the paradox is not an artifact of the continuum. The ambiguity persists in the discrete limit because the instruction "choose a chord" does not specify *which* finite set of chords is to be treated as equiprobable. Your preference for the $N$-gon construction smuggles in an assumption that the circle's boundary is more fundamental than its interior or the space of lines intersecting it. This is not a neutral mathematical fact but a modeling choice equivalent to choosing a parametrization in the continuous case. The distinction between "one randomization" (picking a pair of vertices) and "two" (picking a radius and a distance) does no logical work; picking a pair of vertices is selecting from a product space $V \times V$ (minus the diagonal), which is structurally identical to selecting from a product space of radius and distance. In both cases, you are imposing a uniform measure on a parameter space, and the resulting probability depends on the Jacobian of the transformation between those spaces.

  For your lectures, I recommend retaining the paradox as a cautionary tale, but refining the moral. The lesson is not that the PoI fails for continuous magnitudes, nor that discretization solves the problem. The lesson is that probability is not a property of a proposition in isolation (e.g., "the chord is long"), but of a proposition relative to a specified *generative process* or *model*. The PoI is a rule for assigning probabilities *given* a sample space; it is not a rule for selecting the sample space itself. Bertrand's paradox demonstrates that "a random chord" is an incomplete description of a physical or mathematical experiment. If you specify the experiment (e.g., "throw straws from a distance," "spin a pointer to find endpoints," or "pick a midpoint from a grid"), the probability is unique. If you do not, the problem is ill-posed, regardless of whether the domain is finite or continuous.
