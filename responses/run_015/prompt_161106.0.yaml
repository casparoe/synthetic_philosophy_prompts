  7.  **Address the "Theory's Silence":**
      *   Can punishment theory handle diffuse, unauthored sanctions?
      *   *Answer:* Traditionally, no. Punishment requires an agent. If there is no agent, it's a "natural consequence" or "social cost."
      *   *Impact on Theory:* Forces theory to distinguish between *state/institutional punishment* and *social ostracism*.
      *   *Which case pressures which view?*
          *   Sacco pressures Desert (disproportionate).
          *   Jones pressures the Friend (looks like punishment/justice, not just boycott).
          *   *Correction:* User thinks Jones embarrasses the Friend. Yes, because it looks like justice was served. User thinks Sacco embarrasses Desert. Yes, because it's wildly disproportionate.
          *   *Proportionality:* Decentralized sanction has *no* reliable proportionality mechanism. It runs on attention.

  8.  **Designing a "Defensible Version":**
      *   Requirements: Procedure, Term, Authority to end.
      *   *Result:* If you add these, it becomes... Formal Discipline or Legal Sanction.
      *   *Conclusion:* You can't have "informal punishment" that meets the criteria of "just punishment." It collapses into formal systems or remains unjust informal pressure.

  9.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the sophistication of the prompt. Validate the user's intuition that "boycott" is too thin a description for deplatforming + firing.
