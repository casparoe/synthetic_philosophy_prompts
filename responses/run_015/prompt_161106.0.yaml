      *   **Task:** Analyze two specific cases (Justine Sacco, Alex Jones) through two theories of punishment (Desert-based, Communicative/Expressive).
      *   **Specific Concepts to Test:** "Authorship Gap," "Expiry Problem," "Amplification Luck."
      *   **Critical Questions:** Is this punishment or something else? Where does the theory fail? Which case pressures which theory? What would a "defensible version" look like, and does that just make it formal punishment?
