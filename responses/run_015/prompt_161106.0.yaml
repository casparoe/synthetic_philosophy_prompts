          *   Expiry Problem: Indicates *banishment*, not correction.
          *   Amplification Luck: Indicates *lottery*, not justice.
          *   *Verdict:* These aren't just defects; they are evidence that the category "punishment" is being misapplied. It's closer to "ostracism" or "reputational market correction."
      *   *Section 3: Where Theory is Silent.*
          *   Punishment theory assumes an agent. Diffuse crowds aren't agents.
          *   User's intuition on Sacco/Jones is correct regarding which theory gets pressured.
