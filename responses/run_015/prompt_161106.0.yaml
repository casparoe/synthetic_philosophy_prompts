      *   **Expiry Problem:** Permanent record, no sentence length.
          *   *Defect or Category Error?* Punishment usually has an end. Banishment is permanent.
          *   *Analysis:* Points towards *exile* or *civil death* rather than correctional punishment.
      *   **Amplification Luck:** Severity depends on virality, not wrong.
          *   *Defect or Category Error?* Fundamental violation of proportionality (Desert).
          *   *Analysis:* Strongest evidence that this is *not* a justice system but a popularity/attention economy mechanism.

  6.  **Address the "Friend's Argument" (Boycott vs. Punishment):**
