      *   *Section 4: The Defensible Version.*
          *   If you fix the defects (add authority, term, process), you recreate the State or HR.
          *   This confirms the Friend is half-right (it's not *punishment* proper) but the User is right (it's not *just* a boycott either). It's a hybrid: *Privatized Sanction.*

  10. **Refining Tone:** Ensure I don't sound like I'm taking a side on the morality of Sacco or Jones, but sticking to the *structure* of the sanction. Keep the language precise (e.g., distinguishing "harm" from "sanction").

