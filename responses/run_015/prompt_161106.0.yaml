      *   **Alex Jones (2018):** Conspired Sandy Hook was hoax -> Harassed families -> Deplatformed (Apple, YouTube, etc.) -> Later found liable in civil court.
          *   *Nature of Wrong:* Defamation, harassment of grieving families, misinformation.
          *   *Sanction:* Loss of major distribution channels (livelihood impact), reputational damage.
          *   *Process:* Diffuse pressure -> Platform policy enforcement. Years of warnings.

  3.  **Analyze Through Theory 1: Desert-Based Retributivism:**
      *   *Core Tenet:* Punishment must be deserved, proportional to the wrong, imposed by legitimate authority.
      *   *Sacco:* Massive mismatch. A bad tweet vs. career destruction. No legitimate authority (Twitter mob isn't a state). *Verdict:* Fails desert criteria badly.
      *   *Jones:* Closer fit. Harm was tangible (harassment, defamation). Sanction (loss of platform) relates to the medium of the harm. But who is the authority? Private platforms acting under pressure. *Verdict:* Strained but plausible proportionality.

  4.  **Analyze Through Theory 2: Communicative/Expressive (e.g., R.A. Duff):**
      *   *Core Tenet:* Punishment communicates censure, aims at moral reform/reintegration, treats offender as a community member.
      *   *Sacco:* No dialogue. No path back (permanent record). She was treated as an object of scorn, not a moral agent. *Verdict:* Fails communicative criteria (no reintegration).
      *   *Jones:* Platforms said "you violated terms." But was it to reform him? Or just to protect the platform? Deplatforming is often exclusionary, not reintegrative. *Verdict:* Fails the "leave a way back" criterion.

  5.  **Test the User's Three Labels:**
      *   **Authorship Gap:** No single punisher.
