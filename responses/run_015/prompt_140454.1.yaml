  When there is nothing left to do but TAKE,
  No future hand remains to offer PASS,
  We stand upon the rung marked clearly LAST.
  The fingers finish up their final COUNT,
  There is no partner left here whom to TRUST,
  Nothing remains to gather, nothing MORE.

  Why leave this coin to hope for something MORE,
  When logic says the other hand will TAKE?
  There is no ground beneath us for such TRUST,
  Since at the end they will not choose to PASS.
  We see the shadow of the final COUNT,
  And know this moment cannot be the LAST.

  If this is not the turn that must be LAST,
  Still every step promises something MORE.
  But check the math inside the quiet COUNT,
  For soon the shadowed hand will rise to TAKE.
  There is no reason now to choose to PASS,
  Unless you build a house upon thin TRUST.

  We read the code and find no room for TRUST,
  No hidden type to delay being LAST.
  The screen shows clearly when they will not PASS,
  No secret love of growing piles for MORE.
  They are a mirror built also to TAKE,
  Running the same instruction on the COUNT.

  So where could error hide within the COUNT?
  Not in the will to build a fragile TRUST,
  But in the sight that tells us when to TAKE.
  Perhaps this node is not so near the LAST,
  Perhaps the ladder holds still room for MORE,
  And justifies one further choice to PASS.

  So at the start we hesitate to PASS,
  Though every number in the running COUNT
  Says we should stop and settle for no MORE.
  The logic kills all possibility of TRUST,
  It drags the final shadow of the LAST,
  Back to the first hand rising up to TAKE.

  If the COUNT fails, do we PASS only to TAKE?
  Does TRUST survive the shadow of the LAST for MORE?
  The proof stands clear: must we break the chain or climb?
