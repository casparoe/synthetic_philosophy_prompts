  *   **Rule:** Generalization is licensed if and only if the evaluation data is provably independent of the training process, and the model complexity is bounded by the sample size (or the sample size is sufficiently massive to swamp the complexity).
  *   **Philosophy:** You pay for generalization by enforcing statistical hygiene. If you leak information (Case 2) or exceed your complexity budget without compensation (Case 3, 5), the assumption that $P_{train} \approx P_{test}$ is unpaid.
  *   **Fits Verdicts:** 1 (Pass), 2 (Fail), 3 (Fail), 4 (Pass), 5 (Fail), 6 (Pass), 7 (Pass).

  **2. The Invariance of Mechanism (Causal)**
  *   **Rule:** Generalization is licensed if and only if the model's constraints derive from a causal or physical process known to be invariant across the training and deployment domains.
  *   **Philosophy:** You pay for generalization by anchoring the model to stable laws of nature. If the mechanism is stable, distribution shift matters less (Case 4). If the mechanism is missing or extrapolated (Case 3, 5), the assumption is unjustified.
  *   **Fits Verdicts:** 1 (Pass* via implicit stability), 2 (Fail), 3 (Fail), 4 (Pass), 5 (Fail), 6 (Pass* via implicit manifold), 7 (Pass* via implicit stationarity).
      *   *(Note: R licenses black boxes (1, 6, 7) under this rule only if one accepts "natural data structure" or "temporal stationarity" as a 'mechanism'. If interpreted strictly as 'physics', this rule conflicts with 6 and 7, making it a strong candidate for disagreement.)*

  **3. The Continuity of Performance (Empirical)**
  *   **Rule:** Generalization is licensed if and only if the model has demonstrated robustness across prior distribution shifts or time periods comparable to the proposed deployment.
  *   **Philosophy:** You pay for generalization with a track record of survival. Theory doesn't matter; survival does (Case 7). Past failure in similar contexts vetoes current success (Case 5, 3).
  *   **Fits Verdicts:** 1 (Pass via holdout), 2 (Fail), 3 (Fail), 4 (Pass), 5 (Fail), 6 (Pass), 7 (Pass).

  **Where They Disagree:**
  Consider a **First-Principles Model with No Data**. A controller is derived from exact Newtonian mechanics (Rule 2: **License**), but tested on only 5 real-world trials (Rule 1: **No License**) with no prior history of this specific hardware (Rule 3: **No License**). Rule 2 trusts the *laws*; Rules 1 and 3 trust the *evidence*.

