  # DIAGNOSTIC TREE: THE KILLING / LETTING-DIE DISTINCTION
  **For Clinical Ethics Consultants**  
  *Use this to identify which moral account you are implicitly using when you agree on the label ("letting die") but disagree on the action.*

  ### THE BRANCHES
  *Answer **Yes** or **No** to each claim. Follow the path to your moral account.*

  **1. THE BASELINE**  
  *Claim:* Withdrawing a ventilator at family request is morally distinct from giving a lethal injection at the same request.  
  *   **No** → Go to **Leaf 1 (Equivalence View)**.  
  *   **Yes** → Go to Question 2.

  **2. THE REFUSAL ANCHOR**  
  *Claim:* If a competent patient refuses dialysis or food, their death is "letting die" regardless of the mechanism.  
  *   **No** → Go to **Leaf 2 (Vitalist Account)**.  
  *   **Yes** → Go to Question 3.

  **3. THE INTENTION FILTER**  
  *Claim:* If you withdraw the vent *specifically to end suffering* (aiming at death), the act becomes "killing."  
  *   **Yes** → Go to **Leaf 3 (Intentionalist Account)**.  
  *   **No** → Go to Question 4.

  **4. THE CAUSAL ORIGIN**  
  *Claim:* Letting a patient die from a threat *we caused* (iatrogenic/surgical error) is morally worse than letting them die from their native disease.  
  *   **Yes** → Go to **Leaf 4 (Causal Responsibility Account)**.  
  *   **No** → Go to Question 5.

  **5. THE RESET TEST**  
  *Claim:* Failing to re-arm a pump or silence a recurring alarm is morally equivalent to turning it off ("killing").  
  *   **Yes** → Go to **Leaf 5 (Continuous Act Account)**.  
  *   **No** → Go to Question 6.

  **6. THE DURATION TEST**  
  *Claim:* Dying over 3 weeks (tube withdrawal) is morally more "letting die" than dying in 3 minutes (extubation).  
  *   **Yes** → Go to **Leaf 6 (Biological Naturalism)**.  
  *   **No** → Go to Question 7.

  **7. THE HANDOFF TEST**  
  *Claim:* The nurse who disconnects the tube is more morally responsible than the doctor who wrote the order.  
  *   **Yes** → Go to **Leaf 7 (Physical Agency Account)**.  
  *   **No** → Go to Question 8.

  **8. THE SUFFERING FLIP**  
  *Claim:* If the "letting die" process is agonizing, it becomes morally worse than a quick "killing."  
  *   **Yes** → Go to **Leaf 8 (Consequentialist Collapse)**.  
  *   **No** → Go to **Leaf 9 (Normative Dualism)**.

  ---

  ### THE LEAVES (MORAL ACCOUNTS)

  **Leaf 1: Equivalence View**  
  *Definition:* No moral difference between action and omission if the outcome (death) is the same.  
  *Status:* **Confident.** (Often held by utilitarians or legal realists).

  **Leaf 2: Vitalist Account**  
  *Definition:* Preservation of life is the primary duty; patient refusal does not change the moral category of death.  
  *Status:* **Confident.** (Unattractive in secular bioethics; conflicts with autonomy law).

  **Leaf 3: Intentionalist Account**  
  *Definition:* Killing = Aiming at death. Letting Die = Accepting death as a side-effect.  
  *Status:* **Confident.** (Standard Double Effect / Catholic Bioethics).

  **Leaf 4: Causal Responsibility Account**  
  *Definition:* Killing = Removing a benefit we uniquely caused. Letting Die = Withholding from a natural baseline.  
  *Status:* **Confident.** (Explains the iatrogenic/surgeon cases).

  **Leaf 5: Continuous Act Account**  
  *Definition:* Maintenance (resetting alarms, renewing orders) is an ongoing action; stopping is a new act of killing.  
  *Status:* **Unnamed.** (Rarely explicitly defended, but drives "futile care" arguments).

  **Leaf 6: Biological Naturalism**  
  *Definition:* "Letting die" means returning the body to its natural disease trajectory; time-to-death matters.  
  *Status:* **Confident.** (Common in "natural death" statutes).

  **Leaf 7: Physical Agency Account**  
  *Definition:* Moral responsibility lies with the person whose muscles move to cause death.  
  *Status:* **Confident.** (Common among nursing staff; conflicts with authority models).

  **Leaf 8: Consequentialist Collapse**  
  *Definition:* The distinction collapses when suffering is high; outcome outweighs category.  
  *Status:* **Confident.** (Pragmatic clinical view).

  **Leaf 9: Normative Dualism**  
  *Definition:* The distinction is about rights and duties, not biology, intention, or time.  
  *Status:* **Confident.** (Standard secular bioethics / Law).

  **Leaf 10: Unnamed / Incoherent**  
  *Definition:* Holds contradictory positions (e.g., "Intention doesn't matter" BUT "Suffering makes it killing").  
  *Status:* **Incoherent.** (Nobody occupies this because it fails logical consistency checks).

  ---

  ### EMPTY COMBINATIONS & UNSEPARABLE PAIRS

  **Unoccupied Combinations (The "Empty Leaves")**
  *   **Yes to Baseline + No to Refusal + No to Suffering:** *Unattractive.* (Implies life must be preserved even if not killing, but suffering doesn't justify release).
  *   **Yes to Reset + No to Handoff:** *Neglected.* (Implies maintenance is an act, but the orderer owns the act, not the maintainer).
  *   **Yes to Duration + No to Baseline:** *Incoherent.* (If time matters, then vent withdrawal vs. injection must differ).

  **Indistinguishable Pairs**
  *   **Leaf 4 (Causal Responsibility) & Leaf 9 (Normative Dualism):** In most clinical cases, "what we caused" and "what we owe" align. This tree cannot separate them without a case where we owe care we didn't cause (e.g., disaster triage).
  *   **Leaf 5 (Continuous Act) & Leaf 7 (Physical Agency):** Both focus on the physical doing. They only separate if the "reset" is automated but the "disconnect" is manual.

  ---

  ### THE SINGLE NODE GENERATING DISAGREEMENT

  **Node 3 (The Intention Filter)** does the most work in our setting. Most consultants agree on the Baseline (Vent vs. Shot) and the Refusal Anchor (Rights), so they arrive at the same label ("letting die"). However, they diverge on *why* it is permissible. One consultant implicitly holds the **Intentionalist Account** (permissible only because we aim at comfort), while the other holds the **Normative Dualism Account** (permissible because the patient has no right to the vent). They agree on the note but disagree on the next case (e.g., palliative sedation or non-refusing patients) because they are using different definitions of the distinction. When you feel stuck, ask: *"If the patient wasn't suffering, would you still turn it off?"* The answer reveals which leaf they are standing on.
