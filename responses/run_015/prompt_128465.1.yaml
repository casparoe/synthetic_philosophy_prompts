      *   *Key Insight:* The geographic restriction acts exactly like the temporal restriction in *grue*. The predicate "European-White" is structurally identical to "Grue." The reason we reject "European-White" now is that "White" (globally) is better entrenched *after* the update, or rather, "Swan" is no longer linked to "White."
