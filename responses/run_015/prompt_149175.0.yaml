      *   **Supervisor's Objection:** It's "Hollywood Whorfianism" and irrelevant to the symbol grounding problem (SGP).
      *   **User's Goal:** Prove the supervisor "half wrong" without rehashing the empirical status of linguistic relativity. Needs a reading that takes film and grounding literature seriously.
