      *   **The Supervisor's Point:** Standard Whorfianism (language determines thought) is often scientifically weak. SGP is usually about *how* symbols connect to referents, not how syntax reshapes cognition. If the film just says "learn alien = see time," is that SGP or just magic?
      *   **The User's Insight:** The "Mahjong/Weapon" scene suggests *practice* grounds meaning, not just causal contact. The "Future Memory" suggests *teleology* might ground meaning.

  3.  **Evaluate the Three Candidate Sources of Anchoring (Early Phase):**

