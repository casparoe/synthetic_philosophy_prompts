  ### Part 2: The Repaired Principle

  Your tentative principle ("Do whatever I would have wanted my decision procedure to be disposed to do...") is essentially **Timeless Decision Theory (TDT)** or **Functional Decision Theory (FDT)**. However, your application of it is inconsistent, specifically regarding the *mechanism* of prediction (Case 6) and the *epistemic state* upon being asked (Case 1 vs 4).

  To repair your view while preserving its core insight (ex-ante optimization), we must adopt **Ex-Ante Policy Rationality (EAPR)**. This principle forces you to drop the intuitions that violate dynamic consistency.

  **The Principle: Ex-Ante Policy Rationality**
  > **Clause 1 (The Optimization Base):** An agent is rational if and only if they execute the decision rule that maximizes expected utility relative to their credence distribution *prior* to the predictor's observation.
  > **Clause 2 (The Correlation Condition):** A decision rule is binding if the predictor's accuracy depends on the *logical fact* of what that rule outputs, irrespective of whether the prediction mechanism is causal, computational, or static (e.g., genetic), provided the correlation is sufficiently robust.
  > **Clause 3 (The Reflection Constraint):** An agent's evaluation of the decision must not be altered by evidence received *after* the prediction that is logically entailed by the prediction itself (i.e., knowing you are in the Tails branch does not sever the logical link to the Heads payout).

  **Motivation for Clauses:**
  *   **Clause 1** is motivated by **Case (2)**. You agreed hiring the firm ex-ante is obvious. This establishes that the "view from before" is the normative anchor.
  *   **Clause 2** is motivated by **Case (6)**. To maintain consistency with Case (2), you cannot distinguish between a simulation and a genome scan if both yield 100% accuracy. The "silly" intuition in the genome case is CDT leakage; the logical correlation is identical.
  *   **Clause 3** is motivated by **Case (1) vs (4)**. Your confidence gap here is the most dangerous inconsistency. In both cases, the ex-ante expected value is identical. In (1), knowing you are in Tails is *part of the deal* you signed up for ex-ante. Clause 3 forbids letting that knowledge veto the policy.

  ### Part 3: Verdicts on New Cases

  Applying **Ex-Ante Policy Rationality** to your two unlisted cases:

  **Case A: The Thousand Copies**
  *   **Setup:** 1,000 physical copies of you. Omega predicts the *group's* policy. If the policy is "Pay," Omega wires $10,000 in the Heads branch. In the Tails branch, Omega takes $100 from *one* copy chosen at random.
  *   **Verdict:** **Pay.**
  *   **Reasoning:** From the ex-ante perspective (behind the veil of which copy you are), the expected cost of paying in Tails is $0.10 per copy ($100 / 1000). The expected gain in Heads is $10,000 (assuming it goes to the group/account) or $10 per copy. Even if the $10,000 is shared, the ex-ante utility is massively positive. Since all copies run the same algorithm, your decision controls the group's action. EAPR dictates you maximize the group's ex-ante utility.

  **Case B: The Refusal Pill**
  *   **Setup:** Omega predicts what you would do *after* being given a pill that reliably makes people refuse the payment. You are currently pre-pill.
  *   **Verdict:** **Do not take the pill; Pay the $100.**
  *   **Reasoning:** This is a variant of **Case (2)**. The pill is a mechanism to change your output. If you take the pill, your output becomes "Refuse." Omega predicts "Refuse." You get $0. If you decline the pill, your output is "Pay" (per your policy). Omega predicts "Pay." You get $10,000 in Heads. EAPR requires you to select the policy (and any meta-decisions like taking pills) that maximizes ex-ante utility. You would not have wanted to be the sort of agent who takes the pill.

  ### Part 4: Necessary Corrections (The Mistakes)

  To hold **Ex-Ante Policy Rationality**, you must explicitly drop two of your current verdicts. I am telling you these are mistakes because they violate the Reflection Principle and Dynamic Consistency.

  1.  **Drop the Confidence Gap in (1) vs (4).**
      *   **Why:** Your higher confidence in (4) is driven by the fact that being asked doesn't confirm you're in the losing branch. However, rationality is about the *policy*, not the *conditional payoff upon being asked*. If you pay in (4) but hesitate in (1), you are allowing your current epistemic state to override your ex-ante plan. This makes you vulnerable to a "money pump" where a predictor could toggle the announcement protocol to exploit your hesitation. **Correction:** You should be equally willing to pay in (1) as in (4).
  2.  **Drop the Genome Distinction in (6).**
      *   **Why:** You feel paying is "silly" if the prediction is based on your genome. This is a CDT intuition masquerading as a mechanism distinction. If the prediction is 100% accurate, the *logical correlation* between your decision and the prediction is identical to the simulation case. Refusing here contradicts your verdict in (2). If you would hire a firm to force payment ex-ante, you must pay ex-post, even if the "firm" is your own DNA. **Correction:** You should pay in the Genome case.

  *Note on Case (8) (Moralised Mugging):* This does not require dropping a verdict. Decision theory takes the utility function as input. If your utility function assigns high negative value to "humiliating a stranger," the calculation changes. EAPR still applies; it just maximizes *moral* utility rather than monetary utility.

  ### Part 5: Classification

  **Is this view Functional/Timeless Decision Theory or something new?**

  This view **is Functional Decision Theory (FDT) / Updateless Decision Theory (UDT)** under another name.

  *   **Why:** Your core insight ("judged from the position I occupied before I knew which branch I was in") is the definition of Updatelessness. Your focus on "decision procedure" rather than "action" is the definition of Functionalism.
  *   **The Deviation:** The only reason it felt different to you is that you were inconsistently applying it. Specifically, you were allowing *causal* intuitions (Genome case) and *evidential* intuitions (Case 1 vs 4) to leak into an Updateless framework.
  *   **Conclusion:** You have independently rediscovered the core normative claim of FDT/UDT but hesitated to follow it to its logical conclusions in cases where causal intuition screams loudest. The "repair" I offered simply removes the hesitations that prevent your view from being a coherent decision theory. You are an FDT agent who needs to trust the math more than the "silly" feeling of the Genome case.
