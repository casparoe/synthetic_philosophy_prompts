answer: |-
  The flat split is only defensible under a "formal resource equality" reading that ignores actual costs, but under any substantive "capability to function" reading, it fails to provide equal opportunity and likely violates the trust's educational intent.

  **Menu: What "Equal Opportunity, Not Equal Outcomes" Actually Means**

  | Reading | What is "Opportunity"? | What "Outcome" Doesn't Matter? | When is the "Start" Measured? | Verdict | Does it get Brother $28k? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Formal Non-Discrimination** | No rules legally block anyone from applying. | Income, welfare, or success levels. | The moment the money is handed over. | **Platitude / False.** [High Confidence] Everyone already has this; the trust is supposed to do more than not discriminate. | **Yes,** but renders the trust pointless. |
  | **2. Resource Egalitarianism** | Identical cash bundles to spend as chosen. | Final welfare, happiness, or career status. | The moment the money is handed over. | **Substantive but Flawed.** [High Confidence] Ignores that $28k buys different "starts" for disabled vs. non-disabled students. | **Yes,** but contradicts the goal of *equal* opportunity. |
  | **3. Capability Equality** | Real freedom to achieve similar functionings (e.g., graduating). | Specific career path or income earned later. | When education/training actually begins. | **Defensible.** [High Confidence] Requires unequal money to equalize the *ability* to participate. | **No.** Bites him: Maya needs >$28k to have the same start as Tomas. |
  | **4. Sufficiency (The Floor)** | Everyone gets enough to clear their specific barrier. | How much surplus anyone has left over. | When the specific educational need is met. | **Defensible / Pragmatic.** [Medium Confidence] Acknowledges $140k can't equalize everyone, so aims to get everyone over the line. | **No.** Bites him: Dev/Maya may need more than $28k to clear the floor. |

  **Addressing Your Sticking Points**

  *   **Dev's Lowered Ask (Adaptive Preferences):** [High Confidence] Philosophically, lowering a request due to expected rejection is **not** reduced need; it is "adaptive preference." Treating it as reduced need rewards resignation and punishes those who understand the true cost. Do not treat a lowered ask as evidence of lower cost.
  *   **Invasive Questions vs. Objective Costs:** [High Confidence] You are right to avoid judging "who needs it more" based on personal wealth. Instead, judge **objective costs of the chosen path.** If Tomas chooses a $300k school and Priya chooses a $20k one, the trust subsidizing the difference is about the *education*, not the *person*. Fund the cost of the ticket, not the wealth of the traveler.
  *   **Equality vs. The Floor:** [Medium Confidence] You are correct that $140k cannot equalize life outcomes. If the goal is "education," **Sufficiency (Reading 4)** is the superior target. The goal should be "everyone can reasonably access their chosen education," not "everyone gets the same check." If funds run out, prioritize those whose access is blocked without it (Maya/Dev/Sam) over those whose access is merely enhanced (Tomas).

  **Bottom Line Recommendation**
  Reject the flat split. It confuses "equal input" with "equal opportunity." Adopt a **Sufficiency** model: fund the objective costs of each cousin's validated educational plan up to a reasonable cap, prioritizing those who cannot proceed without the funds.
