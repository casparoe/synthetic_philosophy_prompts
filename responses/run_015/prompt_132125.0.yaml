      *   *Address "Fortune":* Fortune is a river; you need dykes (laws) but also strong arms (men) to hold them when the flood comes.
      *   *Constraint Check:* One paragraph, under 150 words.
      *   *Core Thesis:* The system itself depends on the *virtù* of those who run it, even if hidden.

      *Draft 1:*
      You speak of laws as if they were stone walls that stand alone. But walls crumble without guards who possess the *virtù* to defend them. You say you prefer middling men on a short leash to prevent tyranny, yet when Fortune sends her floods—war, plague, internal rot—who shall steer the ship? A mediocre pilot keeps the course only while the sea is calm. Your constitution is merely a script; it requires actors with the strength to perform it when necessity bites. If your civil servants lack ambition, they lack the drive to maintain order against corruption. You claim to have tamed Fortune by removing excellence from the equation, but you have only hidden the need for it. When the crisis comes that your laws did not anticipate, you will beg for a man who can bend necessity to his will. A state of clerks cannot survive the storm.

