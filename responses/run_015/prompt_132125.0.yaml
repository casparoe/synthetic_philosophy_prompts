answer: |-
  You mistake the scaffold for the builder. Laws are but ink on parchment, inert without the hand that wields them. You claim your middling magistrates tame Fortune, yet Fortune is a violent river; she respects only those strong enough to build dykes against her flood. When crisis strikes—war or famine—your short leashes will strangle the very energy needed to survive. A state run by clerks may endure in peace, but peace is an illusion maintained by force. You say ambition is a warning sign, but without ambition, there is no glory, no expansion, no defense against the ambitious neighbors who will surely devour you. Your system delays corruption, it does not prevent it. Ultimately, the law is only as strong as the man who enforces it. When the unexpected comes, as it always does, you will cry out for a savior, not a procedure.
