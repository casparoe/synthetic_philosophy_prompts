answer: |-
  # Seminar Design: The Allocation Council
  **Topic:** The Incommensurability of Interpersonal Utility Comparisons  
  **Duration:** 90 Minutes  
  **Participants:** 12 Postgraduate Students  
  **Facilitator Role:** Procedural Arbiter (Silent on Value)

  ## I. Pedagogical Rationale & Structural Conditions
  To make the failure of comparison feel unavoidable, we must engineer a situation where **consensus is required but the language of consensus is banned.** 

  Standard utilitarian exercises fail because students implicitly agree on a "shadow currency" (e.g., "severity of suffering"). To prevent this, this simulation enforces **lexical isolation**. Each candidate for aid is described in a vocabulary that is ontologically closed to the others. Furthermore, each student is bound by a "Decision Protocol" that dictates what counts as a valid reason for allocation. 

  The tension arises because the group must output a single decision (who gets the resources) using inputs that cannot be mathematically or conceptually summed. The "failure" occurs when students realize that any agreement they reach is either a violation of their protocol or an arbitrary compromise (e.g., a coin flip), which undermines the rationality of the allocation.

  ## II. Activity Materials & Setup

  ### 1. The Scenario
  The **Global Intervention Council** has **2 Units** of a scarce, life-altering resource (The "Vitality Grant"). There are **4 Candidates** (A, B, C, D). The Council must agree on exactly two recipients by the end of the session. If no consensus is reached, the resource expires (nobody gets it).

  ### 2. The Candidate Files (Distributed to all)
  Each file describes a person's need using *only* the vocabulary of one specific normative framework. 
  *   **Candidate A (Hedonic):** Describes intensity/duration of pain vs. pleasure. *("Subject reports 8/10 acute suffering, no anticipated joy without intervention.")*
  *   **Candidate B (Preference):** Describes ranked desires and frustration. *("Subject's primary life-goal is blocked; satisfaction rating is null.")*
  *   **Candidate C (Objective List):** Describes lack of specific goods. *("Subject lacks knowledge, health, and social affiliation.")*
  *   **Candidate D (Capabilities):** Describes functionings and freedoms. *("Subject is unable to move freely or participate in community life.")*

  ### 3. The Secret Mandate Cards (Distributed to Students)
  Divide the 12 students into four groups of three. Each group receives a **Mandate Card**. They must keep this secret. It dictates how they are *allowed* to argue and vote.
  *   **Mandate Alpha (Hedonism):** "You must maximize net pleasure/minimize pain. Other metrics are irrelevant noise."
  *   **Mandate Beta (Preference):** "You must satisfy the most informed desires. Pleasure without desire-fulfillment is valueless."
  *   **Mandate Gamma (Objective List):** "You must secure essential human goods. Desire or feeling is secondary to objective state."
  *   **Mandate Delta (Capabilities):** "You must expand substantive freedom to function. Resources are only good if they restore agency."

  ### 4. The "Syntax Police" Rule
  **Crucial Constraint:** Students are forbidden from translating metrics. 
  *   *Illegal:* "Candidate A's pain is worse than Candidate D's loss of freedom."
  *   *Illegal:* "Let's just give one to each theory."
  *   *Legal:* "Under my Mandate, Candidate A is the priority."
  *   *Enforcement:* Any student may call a **"Translation Violation."** If the Facilitator upholds it, the offending student loses their right to speak for 2 minutes.

  ## III. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Distribute Files and Secret Mandates. Explain the "Syntax Police" rule. Emphasize: *You must decide. Indecision means total loss.* |
  | **10-25** | **Silent Audit** | Students read files and privately rank candidates based *only* on their Secret Mandate. No talking. They must write down their "Top 2" and a 1-sentence justification using *only* their Mandate's vocabulary. |
  | **25-60** | **Deliberation** | Open floor. Students must convince the group to allocate the 2 Units. Facilitator tracks "Translation Violations" on the whiteboard. |
  | **60-75** | **The Vote** | Formal voting procedure. If deadlock persists, the Facilitator forces a choice: *Either* agree on two names *or* the resource expires. (Pressure tactic). |
  | **75-80** | **The Reveal** | Students reveal their Mandate Cards. The Facilitator maps the Mandates to the Philosophical Frameworks (Hedonism, Preference, etc.). |
  | **80-90** | **Debrief** | Connect the friction experienced to the literature on Interpersonal Utility Comparison (IUC). |

  ## IV. Facilitator Notes: Predictable Failures & Management

  **1. The "Shadow Currency" Escape**
  *   **Prediction:** Within 10 minutes, a student will say, "Look, we all want to help people. Let's just pick the two who seem worst off."
  *   **Management:** This is a Translation Violation. Interrupt immediately. Ask: *"By what metric is 'worst off' defined? Candidate A uses 'pain,' Candidate D uses 'functioning.' You are equating them without a conversion rate."* Force them back into their silos.

  **2. The Arbitrary Compromise**
  *   **Prediction:** The group will realize they can't compare, so they will suggest, "Let's pick A and D just to be fair," or "Let's flip a coin."
  *   **Management:** **Do not stop this.** This is the learning moment. Allow the arbitrary resolution. In the debrief, highlight that the *only* way to break the deadlock was to abandon rational aggregation. This proves the incommensurability thesis.

  **3. Dominance of One Framework**
  *   **Prediction:** Hedonism (Candidate A) often dominates because "pain" feels more urgent than "capabilities."
  *   **Management:** If the Hedonists steamroll the group, stop the clock. Ask the Capability students: *"Did you consent to this allocation based on your Mandate?"* When they say "No," point out that the decision was an act of power, not rational agreement.

  **4. The "Facilitator as God" Problem**
  *   **Prediction:** Students will look to you to break the tie.
  *   **Management:** You must remain procedurally rigid. *"My role is to enforce the rules of discourse, not to evaluate the worth of the lives."*

  ## V. Limitations of the Simulation (For Your Awareness)

  You must be frank with the students in the debrief about what this simulation *cannot* do.

  1.  **The Metaphysical Question:** The simulation shows the *political/decisional* cost of incommensurability (we can't agree). It does not prove that value *is* incommensurable ontologically. A utilitarian could argue, "There is a true currency, you just didn't find it." The simulation creates epistemic blindness, not necessarily metaphysical truth.
  2.  **The Neutral Arbiter:** In the simulation, *you* (the facilitator) enforce the rules. In the real world, there is no neutral arbiter to enforce "Syntax Police" rules. Real-world policy translates incommensurable values constantly (e.g., via cost-benefit analysis) without anyone stopping them. The simulation artificially isolates the problem by forbidding the translation that reality forces upon us.
  3.  **Idealized Agents:** The students are acting as pure agents of a theory. In reality, people hold mixed normative views. The simulation purifies the conflict to make it visible, which risks making it look more stark than it is in messy human psychology.

  ## VI. The Debrief Script (Final 10 Minutes)

  **Step 1: The Reveal (5 Mins)**
  "Please place your Mandate Cards on the table. 
  *   Alpha = Classical Hedonism (Bentham/Mill).
  *   Beta = Preference Satisfaction (Hare/Singer).
  *   Gamma = Objective List (Finis/Nussbaum).
  *   Delta = Capabilities Approach (Sen/Nussbaum).

  Look at your final decision. Did you choose A and B? C and D? Or did you flip a coin? 
  Notice that to agree, you likely had to ignore your Mandate or impose one Mandate over the others."

  **Step 2: Naming the Problem (5 Mins)**
  "You just lived through the **Problem of Interpersonal Utility Comparison**. 
  Specifically, you encountered **Structural Incommensurability**. 
  *   **Quantitative difference:** 'I have 5 units, you have 10.' (Easy to compare).
  *   **Structural difference:** 'I have 5 units of pleasure, you have 1 unit of autonomy.' (No common denominator).

  When you tried to say 'Candidate A is worse off than Candidate D,' you were attempting to find a **Neutral Currency**. When I stopped you, I was enforcing **Incommensurability**. 

  The tension you felt—the frustration that rational agreement was impossible—is exactly why social choice theory (Arrow, Sen) argues that no aggregation function can satisfy all reasonable conditions when preferences are ordinally distinct and structurally diverse. 

  **Final Question for the room:** In the real world, we *do* make these choices (hospitals allocate beds, governments fund arts vs. health). If we cannot find a neutral currency, and if arbitrary compromise is irrational, **what legitimizes the decision?** Is it power? Democracy? Or do we simply pretend a common metric exists?"

  (End session on this open question.)
