answer: |-
  **Headline Credence:** **0.75**
  (Probability that the Neolithic transition lowered welfare for a typical person over the first 2,000 years.)

  **Decomposition:**

  1.  **Forager Baseline (Affluent vs. Harsh): 0.80**
      *   *Credence that the "Affluent Forager" model is closer to reality than the "Harsh Pressure" model for pre-transition populations.*
      *   Ethnographic data and pre-ag skeletal remains show higher leisure and better nutrition than early farmers; revisionist pressure arguments explain the *switch*, not the baseline quality of life.

  2.  **Skeletal Evidence Validity: 0.90**
      *   *Credence that pathologies (stature, enamel, lesions) track genuine welfare loss rather than burial bias.*
      *   The consistency of health declines across independent transitions (Americas, Asia, Europe) rules out local burial customs as the primary confounder; physiology doesn't lie about stress.

  3.  **Counterfactual Viability: 0.60**
      *   *Credence that continued foraging was a viable long-term alternative rather than an imminent collapse.*
      *   Climate volatility (Younger Dryas) and megafauna extinction created real pressure, but many groups persisted as foragers for millennia after neighbors farmed, suggesting farming was a choice, not a trap.

  4.  **Aggregation & Veil of Ignorance:**
      *   **Weight on Per-Life View:** **1.0** (The prompt specifies "typical person," rendering total person-years morally irrelevant for this specific metric).
      *   **Veil-of-Ignorance Credence (Bad Deal):** **0.35** (Probability that a random soul would reject the farming timeline).
      *   While individual quality of life dropped, the massive population increase means a higher probability of existence under farming, which offsets some welfare loss in a total utilitarian calculation.

  **Sensitivity Analysis:**
  *   **Most Sensitive Term:** **Term 3 (Counterfactual Viability).** If you convince me that foraging was ecologically doomed to collapse into starvation regardless of farming (viability < 0.2), my headline credence drops to ~0.5, because the alternative to farming wasn't affluence, it was death.
  *   **Who Is Wrong:** Your **friend (0.25)** is most likely wrong on **Term 2 (Skeletal Evidence)**. A 0.25 credence implies the biological cost of farming is negligible or illusory, which contradicts the robust, cross-continental archaeological consensus on disease and nutrition. You (0.6) are slightly under-confident on **Term 1 (Forager Baseline)**; the evidence for forager leisure and nutrition is stronger than your uncertainty suggests.

  **One Dataset to Change My Mind:**
  *   **Paired Ancient DNA and Paleopathology from Transition-Layer Burials.**
      *   Specifically: Distinguishing *local* foragers who adopted farming from *migrant* farmers who replaced foragers. If the "early farmers" showing stress markers are actually migrants who traveled poorly, while locals who farmed stayed healthy, the causal link between farming and welfare loss weakens significantly.
