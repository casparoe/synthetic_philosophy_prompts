      *   *Key Distinction:* Does the murderer have a *right* to the truth? Kant suggests no one has a right to a truth that would harm them or others unjustly.
      *   *Re-evaluating Premise (1):* "The wrong-making feature... is damage to the common source of right." If the murderer has forfeited their standing in the "community of right" by attempting murder, do they retain the right to truth?
      *   *Better Attack:* **Premise (2)** implies the hearer's desert doesn't matter. But Kantian Right (*Recht*) is relational. If the murderer violates Right, they may lose the claim to Truth.
