      *   *Implication:* If RP disappears or changes with stakes, it shows Libet tasks measure *spontaneous motor generation*, not *volitional choice*. This undermines the generalization claim.
      *   *Verdict:* Excellent essay angle. It addresses the ecological validity critique empirically.

