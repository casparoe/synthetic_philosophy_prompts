      *   **Tone:** Needs to be academic but accessible, balanced (not dismissing neuroscience, not dismissing philosophy), and helpful for essay planning. Avoid taking a definitive metaphysical stance but clarify the scientific/philosophical interface.

  2.  **Deconstruct the Flatmate's Summary (Claim by Claim):**
