answer: |-
  Here is the specification for an adequate decision procedure in infinite ethics. It is divided into Structural Constraints (logic of the value space), Agent Constraints (logic of the choice), and your three specific proposals.

  ### I. Structural Constraints (The Value Space)

  **1. Permutation Invariance (Anonymity)**
  *   **The Case:** Consider a world containing an infinite sequence of experiences valued $+1, -1, +1, -1 \dots$. If you reorder the sequence (e.g., pair every $-1$ with a $+1$ differently, or group all $+1$s first), the standard mathematical sum changes or becomes undefined. A moral theory cannot depend on the arbitrary indexing of locations.
  *   **Requirement:** The value ranking of a world must not change if the mapping between moral units (persons/moments) and indices is permuted, provided the intrinsic properties of the units remain unchanged.
  *   **Status:** **Non-Negotiable.** Without this, value depends on arbitrary labeling.

  **2. Finite Dominance (Pareto for Finite Patches)**
  *   **The Case:** You can save a life in your local vicinity. The rest of the infinite universe remains exactly as it was.
  *   **Requirement:** If World $A$ and World $B$ are identical except for a finite set of locations, and $A$ is strictly better than $B$ at those locations, then $A$ is strictly better than $B$ overall.
  *   **Status:** **Non-Negotiable.** Without this, the agent's local actions are morally inert, rendering decision theory useless.

  **3. Incomparability vs. Equality Distinction**
  *   **The Case:** World $X$ has infinite happy lives and infinite sad lives. World $Y$ has infinite happy lives and infinite sad lives. The distribution differs, but the cardinalities match.
  *   **Requirement:** The procedure must be able to output "No Verdict" (incomparable) distinct from "Equal Value." Collapsing these implies that reshuffling infinite suffering is neutral, or that we are indifferent between worlds where one clearly dominates the other in every finite truncation but sums to the same infinity.
  *   **Status:** **Non-Negotiable.** Collapsing these leads to paralysis or absurd indifference.

  **4. Translation Invariance (Spacetime Carving)**
  *   **The Case:** You grid spacetime into cubic meters vs. cubic kilometers. Or you shift the origin point of your coordinate system. The moral value of the universe should not depend on how you draw the grid lines over it.
  *   **Requirement:** Value assessments must be invariant under transformations of the coordinate system used to identify locations.
  *   **Status:** **Non-Negotiable.** (This is your first custom requirement). It is physically necessary; moral value cannot depend on human measurement conventions.

  ### II. Agent Constraints (The Decision Procedure)

  **5. Act-Evaluation over World-Evaluation**
  *   **The Case:** You cannot choose which world is actual; you can only choose an act that modifies a finite patch of the actual world. Some theories rank worlds but fail to rank acts because the difference between acts is "infinitesimal" relative to the background infinity.
  *   **Requirement:** The procedure must output a ranking of *acts* (counterfactual futures resulting from choices), not just static worlds. It must handle cases where the background infinity is identical across all options, isolating the finite difference.
  *   **Status:** **Non-Negotiable.** A theory that ranks worlds but not acts is not a decision procedure.

  **6. Uncertainty Degradation**
  *   **The Case:** You are 70% sure the universe is infinite and 30% sure it is finite. Standard expected utility theory multiplies probability by value. If value is infinite, $0.7 \times \infty = \infty$. This swamps all finite considerations, making you indifferent between saving a billion lives and buying a sandwich, provided both have non-zero credence of infinite impact.
  *   **Requirement:** The procedure must yield a sensitive verdict that weights finite outcomes against infinite possibilities without the infinite terms automatically dominating or causing arithmetic errors. It must degrade gracefully as credence in infinity shifts.
  *   **Status:** **Non-Negotiable.** (This is your third custom requirement). Real agents are never certain of the ontology. A theory that crashes on uncertainty is unusable.

  **7. Logical Correlation (Identical Agents)**
  *   **The Case:** There are infinitely many agents structurally identical to you, running the same decision procedure in similar contexts. If you choose to cooperate, they all do. If you defect, they all do. The causal impact of your single act is finite; the logical impact of your *rule* is infinite.
  *   **Requirement:** The procedure must account for the correlation between your decision and the decisions of identical agents. It cannot retreat to "I only causally affect my finite patch" if that patch is replicated infinitely via logical necessity.
  *   **Status:** **Taste / Framework-Dependent.** (This is your second custom requirement). This is real *if* you accept acausal decision theory (functional/decisional dependence). If you hold to strict Causal Decision Theory, this requirement is false. However, for an "adequate" procedure in a potentially infinite universe, ignoring logical correlation renders the agent irrelevant. I will mark this as **Conditional Non-Negotiable** (non-negotiable if you want the agent to matter in a symmetric infinite universe).

  ### III. Impossibility Results (Jointly Unsatisfiable Subsets)

  You asked to flag subsets that cannot be satisfied simultaneously. This is the most critical part of the spec. You cannot have it all.

  **The Trilemma of Infinite Aggregation**
  You cannot satisfy these three simultaneously:
  1.  **Completeness:** For any two worlds, the theory says one is better or they are equal (no "incomparable" verdicts).
  2.  **Permutation Invariance:** Value doesn't change if you reshuffle who is where.
  3.  **Strong Finite Dominance:** If a finite set of people are better off and no one is worse off, the world is better.

  *   **Resolution:** You must drop **Completeness**. Any theory that claims to always give a "better/equal" verdict on infinite worlds will violate either Permutation Invariance or Finite Dominance. Your spec must explicitly allow for **Incomparability** (Requirement 3 above).

  **The Uncertainty Explosion**
  You cannot satisfy these three simultaneously:
  1.  **Standard Expected Utility:** Maximize sum of (probability $\times$ value).
  2.  **Unbounded Value:** Values can be arbitrarily large (or infinite).
  3.  **Non-Zero Credence in Infinity:** You admit any possibility the world is infinite.

  *   **Resolution:** You must drop **Standard Expected Utility**. Requirement 6 (Uncertainty Degradation) explicitly forbids standard EU. You need a decision rule that handles "infinity $\times$ probability" without yielding "infinity" as the result (e.g., using relative utilities, hyperreals, or limiting relative frequency).

  **The Isolation vs. Correlation Conflict**
  You cannot satisfy these three simultaneously:
  1.  **Causal Isolation:** I am only responsible for the physical causal consequences of my specific body's motion.
  2.  **Infinite Symmetry:** There are infinite identical copies of me.
  3.  **Non-Vacuity:** My decision can change the total value of the universe.

  *   **Resolution:** If the universe contains infinite copies (Requirement 7), you must drop **Causal Isolation**. If you keep Causal Isolation, your decision procedure returns "Indifferent" for all acts in an infinite background (because your finite change doesn't shift the infinite sum). To get a verdict, you must adopt a decision theory that treats your choice as selecting a policy for all identical agents.

  ### IV. Evaluation of Your Three Custom Requirements

  1.  **Invariance to Spacetime Carving:**
      *   **Verdict:** **Keep.**
      *   **Reason:** This is a subset of Permutation Invariance/Translation Invariance. It is physically necessary. Any theory that fails this is measuring the grid, not the world.

  2.  **Identical Agents (No retreat to "finite patch"):**
      *   **Verdict:** **Keep (with caveat).**
      *   **Reason:** This is real *if* the universe is computationally symmetric. If you ignore this, your decision procedure is causally correct but logically blind. In an infinite universe, logical correlation is the only lever that moves the infinite sum. However, note that accepting this forces you to abandon Causal Decision Theory.

  3.  **Graceful Degradation on Uncertainty:**
      *   **Verdict:** **Keep.**
      *   **Reason:** This is the hardest constraint. Most existing papers assume the agent *knows* the ontology (finite vs. infinite). A procedure that requires certainty is a toy model. This requirement forces the theory to solve the "infinite expected utility" problem.

  ### V. The Single Most Eliminative Requirement

  **Requirement 6: Uncertainty Degradation.**

  This eliminates the vast majority of candidate views.
  *   **Standard Utilitarianism:** Fails immediately (infinity $\times$ probability = undefined/dominating).
  *   **Limit-Based Aggregation (e.g., averaging over expanding spheres):** Fails because you cannot average a probability distribution over two different ontologies (one finite, one infinite) without a common metric.
  *   **Lexical Priorities:** Often fail because they rely on structural certainty about the infinite to apply the lexical rule.

  To satisfy Requirement 6, a theory must effectively reinvent expected utility theory to handle mixed finite/infinite states. Most papers in the literature simply assume the infinite case is known to sidestep this. If you enforce this requirement, you eliminate 90% of the existing literature as "idealized models" rather than "decision procedures."

  ### VI. Summary of Non-Negotiables vs. Taste

  **Non-Negotiable (Logical/Physical Necessity):**
  *   Permutation/Translation Invariance (Req 1 & 4).
  *   Finite Dominance (Req 2).
  *   Act-Evaluation (Req 5).
  *   Incomparability Distinction (Req 3).
  *   Uncertainty Degradation (Req 6).

  **Taste / Framework Choice:**
  *   **Completeness:** Do you demand a verdict for every pair of worlds? (Recommended: No, accept incomparability).
  *   **Logical Correlation (Req 7):** Do you accept that your decision correlates with identical agents? (Recommended: Yes, if you want non-vacuous results in symmetry).
  *   **Aggregation Method:** Summing vs. Averaging vs. Geometric. (This is where the camps fight; the spec should remain neutral here, provided they meet the constraints above).

  **Final Warning:**
  If you enforce **Finite Dominance**, **Permutation Invariance**, and **Uncertainty Degradation** simultaneously, you are looking for a theory that does not yet exist in a fully formalized, widely accepted state. The "Impossibility Results" section above is not a suggestion; it is a proof. You will have to choose which constraint to weaken when the math breaks. Most researchers weaken **Completeness** (accepting incomparability) to save the others.
