      *   *Refinement on Uncertainty:* The problem isn't just degradation; it's that standard expected utility theory breaks with infinite values. The requirement is that the system must yield a verdict without requiring the infinite value to be a real number.

  9.  **Final Polish:** Check against the "Skip names and dates" and "Mark non-negotiable vs taste" instructions. Ensure the tone is technical but direct. (The "spec" style).

      *   *Key Insight for Impossibility:* The tension between "I only affect a finite patch" (Causal isolation) and "There are infinite copies of me" (Logical correlation) is the hardest nut to crack. If I affect only my patch, the global sum doesn't change (if the background is infinite). If I coordinate with copies, the global sum *does* change. The spec needs to clarify which ontology holds.
