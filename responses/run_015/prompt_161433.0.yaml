answer: |-
  ### Part One: The Exam Question

  **Question 1**

  A research consortium announces a complete, causally verified simulation of a human brain. Reconstructed from a single connectome and run at the resolution of individual ion channels, the system is interfaced with a synthetic body. It is behaviourally indistinguishable from the original person: it passes every clinical interview, reports the same memories, and makes the same characteristic slips.

  The team emphasizes two technical findings. First, the system can be formally described as implementing indefinitely many distinct functions depending on the grain at which its states are described; they found no non-arbitrary way to single out one description as the one it "really" computes. Second, for every candidate mapping of internal states onto representational contents, they constructed a rival mapping equally well supported by the causal and behavioural evidence.

  Does this result settle the question of whether the brain is a computer? In light of these findings, what kind of question is "Is the brain a computer?"?

  *(Time allowed: 90 minutes)*

  ***

  ### Part Two: Model Answer

  The consortium's result does not settle the question empirically; rather, it exposes the question as conceptual. To claim the brain is a computer is not to report a discovered physical fact like "the brain consumes oxygen," but to adopt a specific explanatory framework. The scenario provided demonstrates that physical causality and behavioural output are insufficient to fix computational description, forcing us to recognize that computation is not an intrinsic property of physical systems but a relation between a system and an interpreter.

  For an ascription of computation to amount to more than a trivial redescription, there must be a constraint on the level of description that is not merely arbitrary. The first technical finding highlights the triviality problem: if any physical system can be described as computing any function depending on how one groups its states, then everything is a computer, and the term loses explanatory power. For the claim "the brain is a computer" to be meaningful, there must be a principled reason to privilege one grain of analysis over another. Usually, this privilege is granted by the system's design or evolutionary history—its states are grouped because they were selected to perform a specific function. However, the scenario states the team found no non-arbitrary way to single out one description. This suggests that without an appeal to external intent or history, the physical substrate alone does not dictate the computation being performed. Therefore, the simulation does not prove the brain is a computer; it proves that the brain can be described as one, provided we ignore the indeterminacy of the description.

  Second, perfect behavioural and causal fidelity does not deliver the conclusion because computation requires syntax, and syntax is not visible in causality alone. Two systems can be causally isomorphic yet implement different algorithms depending on how their states are interpreted. The scenario's second finding—rival mappings of internal states to representational contents—extends this to semantics. If the same causal structure supports conflicting interpretations of what is being represented, then the content is not fixed by the physics. Behavioural indistinguishability ensures the input-output mapping is correct, but it does not resolve whether the internal processing is genuinely computational or merely causal dynamics that we find useful to treat as computation. If the physics underdetermines the content, then the claim that the system "processes information" is not a discovery about the system, but a decision by the observer to treat it that way.

  Consequently, the indeterminacy of content does not refute the computational claim so much as relocate it. It shifts the burden from the ontology of the brain to the pragmatics of the scientist. The question "Is the brain a computer?" turns out to be a question about explanatory utility, not metaphysical identity. It asks whether the computational vocabulary yields better predictions, clearer interventions, or more coherent theories than rival vocabularies (such as biochemical or dynamical systems descriptions). The consortium's failure to find a unique function suggests that no single computational description is the "true" one, but this does not invalidate the metaphor. It merely confirms that the metaphor is a tool.

  Thus, the result does not settle the matter because there is no fact of the matter to settle. The brain does not contain syntax intrinsically; syntax is imposed by us to make sense of the causality. An A-grade understanding recognizes that the debate is not about whether the simulation is "real" enough to think, but about whether the computational stance is the most productive way to engage with neural causality. The scenario confirms that the brain is not a computer in the way a heart is a pump; it is a computer only insofar as we decide that counting its states as symbols serves our explanatory interests. The question is normative, not empirical.

  ***

  ### Part Three: Marking Scheme (20 Marks)

  **1. The Non-Triviality Condition (5 Marks)**
  *   **A Grade (4-5):** Explicitly states that for computation to be non-trivial, there must be a non-arbitrary constraint on the level of description (e.g., design, history, or explanatory interest). Identifies that without this, computation is ubiquitous and meaningless.
  *   **B Grade (2-3):** Identifies the "grain" problem but treats it as a technical hurdle rather than a conceptual constraint on the definition of computation.
  *   **Common Error:** Assumes computation is an intrinsic physical property like mass or charge, ignoring the role of description.

  **2. Limits of Behavioural/Causal Fidelity (5 Marks)**
  *   **A Grade (4-5):** Explains that causal isomorphism and behavioural matching do not fix syntax or semantics. Distinguishes between simulating the *effects* of computation and instantiating the *formal structure* required for computation.
  *   **B Grade (2-3):** Acknowledges behaviour isn't everything but relies on intuition (e.g., "it doesn't feel real") rather than the structural indeterminacy provided in the prompt.
  *   **Common Error:** Argues that because it is a simulation, it cannot be the real thing (the "simulation vs. reality" cliché loses 2 marks from this section).

  **3. Adjudication on Indeterminacy of Content (5 Marks)**
  *   **A Grade (4-5):** Takes a clear position: either indeterminacy refutes the claim (strong realism) or, preferably, relocates it to pragmatics/interpretation (instrumentalism). Must argue *why* this position follows from the scenario.
  *   **B Grade (2-3):** Lists indeterminacy as a problem but refuses to choose between refutation or relocation (sits on the fence).
  *   **Common Error:** Claims the rival mappings prove the system is "confused" or "broken" rather than addressing the philosophical implication for content ascription.

  **4. Categorization of the Question (5 Marks)**
  *   **A Grade (4-5):** Identifies the question "Is the brain a computer?" as conceptual, normative, or pragmatic (about explanatory utility) rather than purely empirical.
  *   **B Grade (2-3):** Treats it as an empirical question that awaits better data or higher resolution.
  *   **Common Error:** Concludes the question is settled by the prompt's data rather than analyzing the nature of the question itself.

  **General Penalty:**
  *   **Stock Surveying:** Answers that list standard arguments (Chinese Room, Turing Test, Storm Simulation) without integrating them into the specific logic of the prompt's scenario are capped at 12/20 (B Grade).
  *   **Cliché:** Explicitly arguing that "a simulation of a storm is not wet" applies here without modification loses 3 marks total.
