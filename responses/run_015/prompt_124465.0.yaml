answer: |-
  (a) The accommodationist argument in *Guide* 3:32 pushes strongly toward the fading-crutch reading because it relies on a medical analogy that inherently implies temporality. When Maimonides describes God as a "wise physician" who cannot abruptly wean patients off a addiction to idolatrous customs, he frames the commandment of sacrifice as a therapeutic intervention designed to cure a specific historical pathology. In a medical context, a treatment is justified only so long as the disease persists; once the patient is healthy, continuing the treatment would be unnecessary or even harmful. If the "disease" is idolatry and the "health" is the knowledge of God's unity, then the logical expectation is that once the cure is complete and idolatry is eradicated, the therapeutic measure (sacrifice) should be discontinued in favor of the natural state of health (pure intellectual worship). By framing the law as a concession to human psychological inability to handle abrupt change, Maimonides suggests that the ideal worship is purely mental, and sacrifice is merely the transitional tool used to get there, fitting the definition of a fading crutch that must be removed once the leg heals.

  (b) The restoration-and-eternality material in *Mishneh Torah*, Kings and Wars 11:1, pushes back against this expectation by locating sacrifice within the perfected Messianic order rather than the transitional historical past. Maimonides explicitly states that in the days of the Messianic king, the observance of all statutes will return to their previous state, including sacrifices, and he grounds this in the principle that the Torah is everlasting and not to be detracted from. This creates a direct conflict with the fading-crutch reading because the Messianic era represents the final, redeemed state of humanity where idolatry is supposedly eliminated and knowledge of God is universal. If sacrifice were merely a tool to combat idolatry, it should be obsolete in a world where idolatry no longer exists; yet Maimonides insists it will be restored and maintained forever. This demands that sacrifice be part of the final, perfected order, implying that it serves a function beyond merely weaning Israel off pagan practices, thereby requiring a model where the practice persists even after the original therapeutic justification (combating idolatry) is no longer relevant.

  (c) The permanent-scaffold distinction successfully dissolves the textual contradiction but relocates the tension into Maimonides' philosophical anthropology, effectively trading a logical inconsistency for a constrained idealism. By adopting the permanent-scaffold reading, you can consistently argue that while pure intellectual worship remains the theoretical highest end, human beings are permanently incapable of sustaining a religious community on thought alone, meaning the "scaffold" of physical ritual must remain load-bearing forever. This makes the eternality claim in the *Mishneh Torah* less of an embarrassment because it no longer looks like a contradiction of the *Guide*; instead, it clarifies that the "perfection" of the Messianic age is political and communal stability, not the transcendence of human embodiment. However, this does saddle Maimonides with the view that an all-wise lawgiver builds a permanently second-best institution into the ideal state, implying that human nature is inherently and irrevocably limited such that the highest form of worship can never be fully institutionalized, even in the end of days.

  Summary: The permanent-scaffold distinction successfully resolves the textual contradiction by reframing human perfection as inherently dependent on embodied ritual, though it implies that pure intellectual worship remains permanently inaccessible for communal practice even in the Messianic era.
