answer: |-
  If the whisper grew entirely from its own seed,
  It would be present before it ever spoke.
  There is no need for birth where nothing is needed,
  We cannot find it starting from itself.

  Or if it came from something wholly other,
  Darkness might birth a flame without a spark.
  But disconnected things cannot transfer,
  We cannot find it starting from another.

  Perhaps the two combine to make a cause,
  But two invalid sources do not sum.
  The error multiplies without a pause,
  We cannot find it starting from both.

  Or else it pops uncaused, a sudden ghost,
  Without a reason why it lands on specific ears.
  But chaos does not organise a host,
  We cannot find it starting from nowhere.

  The corridor remains just as it was,
  The story passes on without a source.
  Nothing is settled by the pause,
  And someone switches off the lights of course.

  ***

  Stanzas one through four execute the *catuṣkoṭi* on a single event, using the invariant refrain to show that only the logical slot changes while the phenomenon remains the same. The fifth stanza refuses to reify the negation: the rumour continues conventionally ("passes on"), but the analysis establishes no counter-position ("Nothing is settled"). The final line is deliberately mundane and action-oriented to prevent being lifted as a philosophical maxim, ensuring the poem ends in practice rather than theory.
