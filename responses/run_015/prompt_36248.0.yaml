  # Social Epistemology (SEMP 300)
  ## Creative Writing Option: The Unfalsifiable Local

  **Assignment:**  
  Compose an *Onion*-style news article consisting of a headline plus 450 to 550 words of body text. The article must be written in a flat, deadpan local-news register. The subject matter is as follows: a local man, stung by years of being told his theories are unfalsifiable, has announced his conversion to a strict falsificationist research program and invited the public to hold him accountable to it.

  **Constraints on the piece you will produce:**

  1.  **Portrayal of the Subject:** The local man must be portrayed as earnest, organized, and methodologically literate. He pre-registers his predictions, keeps a dated notebook, and publishes deadlines for the revelations he expects. The satire must not rest on depicting him as stupid, lazy, or mentally ill; it targets the structure of the reasoning, not the man.

  2.  **Epistemological Precision:** The comedy must come from getting the epistemology right. Specifically: every failed prediction should be absorbed by an auxiliary hypothesis (e.g., the leak was controlled, the witness was a plant, the missed deadline was itself disinformation planted to discredit him). The hard core of his theory must never be touched while the protective belt of auxiliaries grows without limit. The article should make visible, without ever naming it as such, the Quine–Duhem structure that lets a committed believer convert counterevidence into evidence of the conspiracy's depth and sophistication. Where the piece gestures toward demarcation, you may help yourself to Popperian and Lakatosian vocabulary (hard cores, protective belts), but the jokes should not require the reader to know either name.

  3.  **The Concerned Colleague:** Include at least one quoted remark from a concerned philosophy-of-science neighbor or colleague. This person should be genuinely torn: she must concede, accurately, that legitimate science also revises auxiliary assumptions and does not collapse at its first failed prediction, and she should visibly struggle to say what exactly the difference is between that and what the local man is doing. Her struggle should be part of the fairness of the piece, not a weakness of it.

  4.  **The Self-Sealing Claim:** Include at least one quote in which the local man, with complete sincerity and no awareness of the tension, reports that he has never once been wrong—every apparent error was a lie told to him about what was going to happen. A reader who knows the self-sealing literature should recognize this as the thesis of the piece stated in the subject's own voice.

  5.  **Tone and Format:** The piece must remain deadpan throughout. No winking narrator, no editorializing closing paragraph, no asterisk at the end. The irony should be legible entirely from the accumulation of detail.

  **Submission Guidelines:**  
  Length, form, and tone are as specified above. The deliverable is the headline and article only, with no preface or commentary.
