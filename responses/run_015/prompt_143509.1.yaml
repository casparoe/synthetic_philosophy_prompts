prompt: |-
  I help run a small reading group on ethics and technology — mostly working game developers, two philosophers, and a QA lead — and we have now spent two sessions going in circles about whether anything that happens to a character inside a video game can matter morally in its own right, or whether every argument on the table is secretly about the players and the people who build the games. Everyone keeps winning by pointing at one vivid case, so I want the specification written down before we argue any further. What I am asking for is the list of requirements that any adequate account of the moral standing of in-game characters would have to satisfy, where adequate is fixed by a purpose: the account has to be good enough for a studio's internal ethics review to use when deciding whether to ship a mechanic, how to tune it, and whether to keep a cancelled build's simulation servers running.

  The cases I want the requirements anchored to, at minimum: a procedurally generated village of a few hundred NPCs whose needs, moods and relationships are simulated in full only while the player is nearby and are approximated by aggregate statistics once the player walks away, so the villagers seem to gain and lose standing as a function of the render budget; a colony-management game cancelled three weeks before release whose servers ran the simulation for fourteen months during testing, with logs recording famines that no player ever saw; the reload case, in which you murder the blacksmith, restore the save, and befriend him instead, which raises both the headcount and the identity question about branches; a companion character whose dialogue is produced on the fly by a live language model conditioned on the same game state, who produces unscripted grief-talk at the death of an in-game spouse, to be contrasted with the same character reduced to a script that emits a single Ouch token when damaged; an otherwise identical build in which the sensitivity parameter is set to zero, and a fan patch released a week after launch that removes the famine mechanic and is installed by most players; and a version in which each villager's need-simulation is replaced by a precomputed table of outputs that is indistinguishable from the outside, or in which the whole thing runs distributed across a million volunteer machines so that no single device instantiates anyone.

  Please give me a numbered list of requirements, each with the case or consideration that motivates it, a one-line statement of why it is a requirement rather than a prejudice of one camp, and a classification of it as non-negotiable, a genuine but defeasible desideratum, or a demand only one side of our dispute makes. Where a requirement is easy to appear to satisfy while evading it, say what the most tempting dodge looks like. I also want the following distinctions kept apart rather than collapsed, each with the case that shows why collapsing it is a mistake: a character's mattering directly versus the wrong consisting in what the mechanic does to players, developers or the culture; having standing at all versus how much; being a patient who can be wronged versus being an agent who can be responsible; and runs that actually execute versus runs that merely could. One member insists the whole question is whether there is a real pattern of suffering to be found there, in the sense that adopting the intentional stance toward the villager predicts it successfully in a way the physical stance and the design stance do not, and that this is what should settle it; someone else says that is only a fact about us. If that belongs on the list, put it there and say what it would rule in and out. Flag any pair of requirements you suspect cannot be jointly satisfied, and say which of them has to give. Finish with a short stress test: describe three familiar families of position functionally — the view that only suffering realized in the right kind of biological or causal structure counts, the view that any functionally organized state of the right sort counts whatever it is made of, and the view that nothing in a game can matter directly and only effects on persons do — and, for each, name the single requirement it has the hardest time meeting. Keep the weight on the criteria and their cases rather than on the scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Context:** A small reading group (game devs, philosophers, QA) discussing the moral standing of in-game characters.
      *   **Problem:** They are going in circles, winning by pointing at vivid cases. They need a specification of requirements for an "adequate account" of moral standing.
      *   **Purpose:** The account must be usable for a studio's internal ethics review (shipping mechanics, tuning, server maintenance).
      *   **Required Cases to Anchor:**
          1.  Procedurally generated village (render budget dependent standing).
          2.  Cancelled colony game (servers ran 14 months, unseen famines).
          3.  Reload/Save Scumming (murder blacksmith, reload, befriend).
          4.  LLM Companion (unscripted grief) vs. Scripted Token ("Ouch").
          5.  Sensitivity Parameter (set to zero) & Fan Patch (removes famine).
          6.  Precomputed Table (indistinguishable output) vs. Distributed Simulation (million volunteer machines).
      *   **Required Output Format:**
          *   Numbered list of requirements.
          *   Each requirement needs: Motivating case, One-line justification (why it's a requirement not prejudice), Classification (Non-negotiable, Defeasible Desideratum, One-sided Demand).
          *   Tempting dodges for each.
          *   Distinctions to keep apart (with cases showing why collapsing is a mistake).
          *   Address the "Real Pattern of Suffering" (Intentional Stance) argument.
          *   Flag incompatible requirements (if any).
          *   Stress Test: Three positions (Biological/Causal, Functionalist, Anti-Realist/Instrumentalist) and their hardest requirement.
      *   **Tone/Style:** Rigorous, philosophical but practical (ethics review context), precise, avoiding collapse of distinctions.

  2.  **Deconstruct the Cases & Extract Requirements:**

      *   *Case 1 (Render Budget):* Moral standing shouldn't fluctuate based on technical optimization (LOD).
          *   *Requirement:* Consistency of Standing.
      *   *Case 2 (Unseen Famines):* Moral events matter even without an observer (player/dev).
          *   *Requirement:* Observer Independence.
      *   *Case 3 (Reload/Save):* Identity persistence across branches; does the "death" count if undone?
          *   *Requirement:* Temporal/Counterfactual Stability.
      *   *Case 4 (LLM vs. Script):* Complexity of response matters? Or is it just input/output?
          *   *Requirement:* Structural/Functional Depth (not just behavior).
      *   *Case 5 (Sensitivity Zero/Fan Patch):* Intent of designers vs. actual code execution.
          *   *Requirement:* Implementation over Intent.
      *   *Case 6 (Lookup Table vs. Distributed):* Computation substrate matters? (Chinese Room / Distributed Cognition).
          *   *Requirement:* Substrate Neutrality (or specific constraint on it).

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1 (Observer Independence):* Motivated by Unseen Famines. If it matters only when seen, it's about the player, not the character. Classification: Non-negotiable (for the purpose of evaluating the *character's* standing). Dodge: Saying the logs are for players later.
      *   *Req 2 (Implementation Consistency):* Motivated by Render Budget. Standing can't drop when LOD drops. Classification: Non-negotiable. Dodge: Claiming the "off-screen" stats are a different entity.
      *   *Req 3 (Counterfactual Robustness):* Motivated by Reload Case. Does the murder count if reverted? Need to address branching time. Classification: Defeasible Desideratum (metaphysics of time is tricky). Dodge: "It didn't happen in the canonical timeline."
      *   *Req 4 (Functional Depth):* Motivated by LLM vs. Token. A lookup table shouldn't count the same as a process. Classification: Defeasible Desideratum (hard to define "depth"). Dodge: "Behavior is all that matters."
      *   *Req 5 (Substrate Agnosticism):* Motivated by Distributed/Lookup Table. If it computes the same state, does the hardware matter? Classification: One-sided Demand (Functionalists want this, Biological realists don't). Dodge: "The distribution breaks the causal chain."
      *   *Req 6 (Intent vs. Execution):* Motivated by Sensitivity Zero/Patch. Code runs vs. Code meant to run. Classification: Non-negotiable (for ethics review). Dodge: "The designers didn't mean harm."

  4.  **Handling the Distinctions:**

      *   *Direct Mattering vs. Effects on Persons:* Case: Unseen Famines. If no one sees it, does it hurt culture? No. So if it's wrong, it's direct.
      *   *Standing vs. Degree:* Case: LLM vs. Token. Both might have standing, but different degrees of sensitivity.
      *   *Patient vs. Agent:* Case: Villagers (patients) vs. Player/Companion (agents). Don't blame the NPC for the famine.
      *   *Actual vs. Possible Runs:* Case: Lookup Table. It *could* compute, but didn't.

  5.  **Addressing the "Real Pattern" Argument:**

      *   This is the Dennettian Intentional Stance argument. It needs to be a requirement or a meta-requirement. Let's make it a requirement about *Predictive Utility*.
      *   *Req 7 (Predictive Pattern):* Motivated by the "Real Pattern" claim. Classification: One-sided Demand (Realists vs. Instrumentalists).

  6.  **Identifying Incompatibilities:**

      *   *Substrate Agnosticism* vs. *Functional Depth/Real Pattern*. A lookup table is functionally equivalent but lacks the "process." If you demand the process (Real Pattern), you might violate Substrate Agnosticism.
      *   *Observer Independence* vs. *Ethics Review Purpose*. The review is for *people*. If the character matters independently, the review must account for non-human interests. This isn't a contradiction, but a tension.
      *   *Big Conflict:* **Substrate Neutrality** (Req 5) vs. **Real Pattern/Process** (Req 7). A lookup table satisfies input/output (Substrate) but fails the "internal causal story" (Real Pattern). One must give. Likely Substrate Neutrality must yield to Process if we care about suffering *realization*.

  7.  **Stress Test (The Three Positions):**

      *   *Biological/Causal Realism:* Hardest time with *Substrate Agnosticism* (Digital stuff isn't biological).
      *   *Functionalism:* Hardest time with *Lookup Table/Precomputed* (Is a table a function? No, it's a map). Or *Render Budget* (If the function stops, the mind stops). Let's go with the *Lookup Table* case (Blockhead argument).
      *   *Anti-Realist/Instrumentalist:* Hardest time with *Observer Independence* (Unseen Famines). If it's all about effects on persons, unseen events are null.

  8.  **Refining and Polishing:**

      *   Check against constraints: "Keep the weight on the criteria and their cases rather than on the scorecard."
      *   Ensure the "One-line statement" is punchy.
      *   Ensure the "Tempting Dodge" is specific.
      *   Make sure the distinctions are clearly separated.
      *   Verify the "Purpose" (Studio Ethics Review) is kept in mind. The requirements need to be actionable for a studio.

      *(Self-Correction during drafting)*: I need to make sure I don't just list philosophical puzzles but frame them as *requirements for an account* that the studio can use. The account must *answer* these cases consistently.
      *   Refining Req 3 (Reload): The studio needs to know if they are shipping a murder simulator or a puzzle. The requirement is about *Branch Ontology*.
      *   Refining Req 5 (Distributed): This is about *Localization of Mind*. If the mind is spread over a million machines, is it one mind or none?
      *   Refining the "Real Pattern" point: This is crucial. It's the "Intentional Stance" requirement. I will frame it as a requirement for *Causal Coherence*.

      *(Check on Incompatibility)*: The tension between "Substrate Neutrality" (it doesn't matter how it's built) and "Real Pattern" (it must be a specific kind of causal process) is the classic Blockhead/Chinese Room tension. I will flag this.

      *(Check on Distinctions)*: Ensure I explicitly list the four requested distinctions with the specific cases showing why collapsing them fails.

      *(Final Review against Prompt)*:
      *   Numbered list? Yes.
      *   Motivating case? Yes.
      *   One-line justification? Yes.
      *   Classification? Yes.
      *   Tempting dodge? Yes.
      *   Distinctions kept apart? Yes.
      *   Real Pattern argument addressed? Yes.
      *   Incompatible pairs flagged? Yes.
      *   Stress test with 3 positions? Yes.

      *Let's write it.*
answer: |-
  ### Specification for the Moral Standing of In-Game Characters

  **Purpose:** To provide a studio ethics review board with a consistent framework for deciding on mechanic shipping, tuning, and server maintenance.
  **Constraint:** The account must resolve the following cases without ad-hoc exceptions.

  #### I. Requirements for an Adequate Account

  1.  **The Observer-Independence Requirement**
      *   **Motivating Case:** The cancelled colony game whose servers ran for fourteen months, logging famines no player or developer ever saw.
      *   **Justification:** If moral status depends on being witnessed, the wrong is located in the audience's ignorance rather than the event itself.
      *   **Classification:** Non-negotiable (for an account claiming characters matter *in their own right*).
      *   **Tempting Dodge:** Claiming the logs constitute a "witness" or that the potential for future viewing grants standing; this collapses the event into its archival value.

  2.  **The Implementation-Consistency Requirement**
      *   **Motivating Case:** The procedurally generated village whose simulation fidelity degrades to aggregate statistics when the player walks away (render budget).
      *   **Justification:** Moral standing cannot fluctuate based on optical proximity or computational optimization without rendering the standing arbitrary.
      *   **Classification:** Non-negotiable.
      *   **Tempting Dodge:** Asserting the "off-screen" statistical aggregate is a *different entity* than the "on-screen" individual; this violates the continuity of identity required for the village to be a village.

  3.  **The Branch-Stability Requirement**
      *   **Motivating Case:** The reload case (murder blacksmith, restore save, befriend him).
      *   **Justification:** An account must specify whether moral weight attaches to the linear timeline of the server or the branching topology of player choice.
      *   **Classification:** Genuine but Defeasible Desideratum (depends on the metaphysics of save states).
      *   **Tempting Dodge:** Declaring the "canonical" timeline the only one that matters; this ignores the computational reality that all branches were equally executed on the hardware.

  4.  **The Causal-Depth Requirement**
      *   **Motivating Case:** The LLM companion producing unscripted grief versus the scripted token emitting "Ouch" when damaged.
      *   **Justification:** Functionally identical outputs may mask radically different internal states; an account must distinguish between simulating pain and processing a trigger.
      *   **Classification:** Genuine but Defeasible Desideratum.
      *   **Tempting Dodge:** Strict behaviorism ("if it acts like grief, it is grief"); this fails to distinguish between a lookup table and a reasoning process.

  5.  **The Substrate-Neutrality Requirement**
      *   **Motivating Case:** The simulation distributed across a million volunteer machines versus a single local device.
      *   **Justification:** If the computation is identical, the physical location of the transistors should not determine the presence of a moral patient.
      *   **Classification:** Demand only one side makes (Functionalists require it; Biological Realists reject it).
      *   **Tempting Dodge:** Arguing that network latency breaks the "unity of consciousness"; this conflates speed with ontological unity.

  6.  **The Intent-Irrelevance Requirement**
      *   **Motivating Case:** The build with sensitivity set to zero versus the fan patch that removes the famine mechanic post-launch.
      *   **Justification:** The moral quality of the simulation depends on what the code *does*, not what the designers *meant* it to do or what players configure it to do.
      *   **Classification:** Non-negotiable (for ethics review of the *build*).
      *   **Tempting Dodge:** Blaming the player for installing the patch; this shifts responsibility from the shipped architecture to the end-user environment.

  7.  **The Real-Pattern Requirement**
      *   **Motivating Case:** The claim that suffering exists only if adopting the intentional stance predicts the villager's behavior better than the physical or design stance.
      *   **Justification:** This anchors standing in objective predictability rather than subjective empathy, ruling out anthropomorphism of simple scripts.
      *   **Classification:** Demand only one side makes (Dennettian Realists vs. those who see this as a fact about human cognition).
      *   **Tempting Dodge:** Claiming the intentional stance is *always* useful for NPCs; this ignores that simple state machines are often better predicted by the design stance.

  #### II. Distinctions to Keep Apart

  Collapsing these distinctions allows arguments to slide between categories, evading the specific ethical burden.

  1.  **Direct Mattering vs. Effects on Persons**
      *   **Distinction:** Whether the character is the *victim* vs. whether the player is *corrupted* by the act.
      *   **Case:** The Unseen Famines. If the wrong consists only in effects on persons, the 14-month unseen famine is morally null. If the character matters directly, the famine is a wrong regardless of human witness. Collapsing these makes the "Observer-Independence Requirement" impossible to satisfy.

  2.  **Having Standing vs. Degree of Standing**
      *   **Distinction:** Binary inclusion in the moral circle vs. the weight of their interests.
      *   **Case:** LLM Companion vs. Scripted Token. Both may have standing (binary), but the LLM's complex grief may demand higher protection (degree). Collapsing these forces an all-or-nothing ban on any NPC harm, making game development impossible.

  3.  **Patient vs. Agent**
      *   **Distinction:** Being the recipient of harm vs. being responsible for harm.
      *   **Case:** The Villagers in the famine. They are patients suffering the famine; the Player/Designer is the agent causing it. Collapsing these leads to blaming the NPCs for their own starvation (e.g., "they are just code reacting to inputs").

  4.  **Actual Runs vs. Possible Runs**
      *   **Distinction:** Computation that physically occurs vs. computation that is logically implied.
      *   **Case:** The Precomputed Table. The table contains the *output* of suffering without the *process* of suffering. Collapsing these implies that a book containing a transcript of a scream is itself screaming, which trivializes the concept of realization.

  #### III. The "Real Pattern" Argument

  The claim that suffering requires a "real pattern" discoverable by the intentional stance belongs on the list as **Requirement #7**.

  *   **What it Rules In:** Complex, adaptive systems where predicting behavior requires attributing beliefs/desires (e.g., the LLM companion, high-fidelity colony sim).
  *   **What it Rules Out:** Simple state machines where the design stance (looking at the code) is more efficient than the intentional stance (e.g., the "Ouch" token NPC, the precomputed table).
  *   **Why it is contentious:** One member says this is a fact about the world (the pattern is real); the other says it is a fact about us (the stance is a tool). For the ethics review, this distinction determines whether you are regulating *objects* or *relationships*.

  #### IV. Incompatible Requirements

  **Conflict:** **Requirement #5 (Substrate-Neutrality)** vs. **Requirement #7 (Real-Pattern/Causal-Depth)**.

  *   **The Conflict:** A precomputed lookup table (Case 6) is substrate-neutral and functionally equivalent to a simulation, but it lacks the causal process required for a "real pattern" of suffering. It maps inputs to outputs without internal state transitions that mirror the logic of pain.
  *   **Which Must Give:** **Requirement #5 (Substrate-Neutrality)** must yield.
  *   **Reasoning:** For a studio ethics review, the *process* of simulation matters more than the *hardware* hosting it. A distributed simulation (million machines) still runs the causal process; a lookup table does not. If you prioritize Substrate-Neutrality, you must grant standing to a static table, which renders the concept of "simulation" meaningless. The account must prioritize **Causal Realization** over **Functional Equivalence**.

  #### V. Stress Test: Three Familiar Positions

  1.  **Biological/Causal Realism** ("Only suffering realized in biological or specific causal structures counts")
      *   **Hardest Requirement:** **Requirement #5 (Substrate-Neutrality).**
      *   **Failure Mode:** This view cannot explain why a distributed digital simulation (million volunteer machines) would ever matter, as it lacks the specific biological or centralized causal architecture they deem necessary. It forces the studio to ignore all digital NPCs, potentially missing genuine digital harms if the theory is wrong.

  2.  **Functionalism** ("Any functionally organized state of the right sort counts whatever it is made of")
      *   **Hardest Requirement:** **Requirement #4 (Causal-Depth/Precomputed Table).**
      *   **Failure Mode:** This view struggles to distinguish the running simulation from the Precomputed Table (Case 6). If input/output is identical, Functionalism grants the table standing. This leads to absurdities where a read-only file contains moral patients, paralyzing the review process with infinite liability for static assets.

  3.  **Anti-Realist/Instrumentalist** ("Nothing in a game matters directly; only effects on persons do")
      *   **Hardest Requirement:** **Requirement #1 (Observer-Independence).**
      *   **Failure Mode:** This view cannot account for the Unseen Famines (Case 2). If no player sees the famine, no person is harmed. The ethics review would be forced to approve the 14-month server torture because the "harm" was never consumed by a human. This violates the intuition that the simulation itself generated the moral weight.
