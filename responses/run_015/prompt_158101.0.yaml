      *   *Reasoning:* The prize needs a story, not a statistic. The user's position (champion) makes procedural tinkering look like manipulation.
      *   *Acquaintance's remark:* Explain that if $p < 0.5$ (systemic bias), majority vote guarantees error.

  7.  **Final Polish:**
      *   Ensure the tone is respectful but firm.
      *   Make sure the explanation of the CJT limitations is clear.
      *   Address the "champion" conflict directly.
      *   End with a clear course of action.

      *(Self-Correction during drafting)*: I need to be careful not to just say "No." I need to explain *why* the forecaster is wrong about the *application*, not the math. The math is right; the ontology of literary quality is the mismatch. Also, the user's vulnerability is key. If they push for secret ballots after championing a book, it looks like they want to hide the fact that their book won on a split vote or lost narrowly. Open discussion allows them to argue for the book on merit.

      *Revised Plan:*
