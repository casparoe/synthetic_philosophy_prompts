      *   Faithful to philosophers? Yes (Peirce = convergence/realism, James = utility/pluralism).
      *   Residue report included? Yes.
      *   Addressed defect vs. vagueness? Yes.
      *   No smuggling assumptions? I need to ensure I don't assume truth *is* prediction in the translation, but rather map their definitions *onto* prediction concepts.

