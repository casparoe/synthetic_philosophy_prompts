      *   *Wait, the "Silent Count" is a test of coordination, not necessarily belief.*
      *   How to make belief the *cause*?
      *   If I hesitate because I think you will hesitate, my hesitation causes you to hesitate.
      *   So, reducing hesitation (via confidence) *creates* the success.
      *   Okay, that holds up.

      *   *Addressing the "Clifford Objection":*
          *   Clifford would say: "Saying 'I believe' doesn't make you better at counting. It's just noise."
          *   James would say: "Saying 'I believe' stops you from hesitating. Hesitation is the only thing that makes us fail. Therefore the belief is functional evidence."
          *   I need to make sure the Debrief hits this hard.

      *   *Troubleshooting:*
