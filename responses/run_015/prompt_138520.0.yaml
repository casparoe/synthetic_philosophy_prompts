          2.  Round 1: Silent/Private Belief (10 mins).
          3.  Round 2: Public Declaration/Common Knowledge (15 mins).
          4.  Debrief (15 mins).

      *   *Refining the "Belief" Mechanic:*
          *   To make the "Loop" visible:
          *   Round 1: Private vote on success. Then attempt.
          *   Round 2: Public round-robin statement "I will not speak out of turn." Then attempt.
