      *   *Actually, let's use the Index Cards to simulate the "Common Knowledge" gradient.*
      *   **Round 1:** Private card (Keep hidden). Attempt.
      *   **Round 2:** Public card (Hold up). Attempt.
      *   **Round 3:** Public card + Eye Contact + Verbal "I'm with you." Attempt.
