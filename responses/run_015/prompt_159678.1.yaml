answer: |-
  It is a pleasure to meet a colleague who has moved from measuring discharge rates to measuring the discharge of arguments. Your grasp of the Nyāya position is remarkably solid for a reading group audit. You have the core four (*pratyakṣa*, *anumāna*, *upamāna*, *śabda*) correctly identified, and you are right that Nyāya treats *śabda* (testimony) as irreducible—it is not just inference about the speaker's reliability, but a distinct mode of knowing that *transmits* knowledge from a knower to a hearer. Regarding *abhāva* (absence/cognition of non-existence): You are not garbling it. Early Nyāya subsumed it under perception (you perceive the empty floor), but later Navya-Nyāya (New Logic) elevated it to a separate *pramāṇa* because knowing "there is no pot here" feels cognitively distinct from seeing a bare floor. However, for your specific task—validating *presence* records—it is indeed an idle wheel. We are not validating absence data here.

  Here is the brainstorm on adapting these categories for your Atlas, followed by the protocol, the case runs, and the hard truth about your instincts.

  ### Brainstorm: Nyāya Distinctions in Data Triage

  *   **Perception (*Pratyakṣa*) is necessary but not sufficient.** In Nyāya, perception must be *nirvikalpaka* (non-conceptual raw sense data) followed by *savikalpaka* (conceptual identification). A photo is raw data; the label "Rare Moth" is the conceptual overlay. A photo without metadata (time/place) is "indefinite perception"—it exists, but it cannot be located in a causal network. It fails as scientific evidence even if it succeeds as visual proof.
  *   **Testimony (*Śabda*) relies on the *Āpta* (the trustworthy person).** Nyāya does not accept testimony from just anyone; the speaker must be competent and honest. This maps perfectly to your "Dorothy" problem. If you codify *Śabda*, you must codify the criteria for an *Āpta*. You cannot have a general rule for testimony without a general rule for trust.
  *   **Inference (*Anumāna*) is high-risk for rare species.** Inference relies on a universal connection (*vyāpti*) between a mark (habitat) and the thing marked (species). In ecology, *vyāpti* is almost always probabilistic, not universal. "Wetland implies Bittern" is not "Smoke implies Fire." Relying on inference alone for rare species invites false positives.
  *   **Comparison (*Upamāna*) is the Field Guide Trap.** The *gavaya* (wild cow) example works for naming a new thing by relating it to a known thing. In your workflow, this is a user matching a specimen to a guide. The risk is *over-matching* (pareidolia). *Upamāna* should never stand alone for rare species; it requires *Śabda* (expert confirmation) or *Pratyakṣa* (voucher specimen) to lock it down.
  *   **AI/Apps are "Mediated Inference."** An app is not a person (*Śabda* fails). It is not direct sense data (*Pratyakṣa* fails). It compares audio/features to a database (*Upamāna*) and outputs a probability (*Anumāna*). It should be treated as a *weak inference* that requires corroboration.
  *   **Drop Absence (*Abhāva*).** For a presence-validation protocol, cognition of absence is a distraction. Do not try to validate "I looked and didn't see it." That is a different database with different epistemic rules.

  ***

  ### The Atlas Triage Protocol (Version 1.0)

  **Purpose:** To classify the *warrant* of a species record and determine if it meets the threshold for acceptance, rejection, or escalation.
  **Time Budget:** 2 minutes per record.
  **Reviewer Role:** You are not determining truth; you are determining *epistemic sufficiency*.

  #### Step 1: Classify the Warrant
  Look at the submission. What is the primary source of knowledge claimed? Select **one** primary category.

  *   **A. Direct Evidence (Perception):** A photograph, audio recording, or physical voucher is attached.
  *   **B. Expert Testimony (Śabda):** No media, but the observer is on the "Trusted List" (see Appendix A).
  *   **C. Descriptive Match (Comparison):** No media, not on Trusted List, but includes detailed written description/measurements matching a guide.
  *   **D. Algorithmic/Inferred (Inference):** App ID only, or based on habitat/signs without species-specific ID.

  #### Step 2: Check for Defeaters (*Bādhaka*)
  Does the record contain internal or external contradictions that break the causal chain?

  *   **Temporal Defeater:** Is the date outside known phenology (flight time, bloom window, migration)?
  *   **Spatial Defeater:** Is the location outside known range or in impossible habitat (e.g., aquatic mussel on a ridge)?
  *   **Competence Defeater:** Is the observer a known beginner submitting a high-difficulty ID without support?

  *Rule:* If **any** Defeater is present, the record cannot be Accepted in Step 3. It must be Rejected or Escalated.

  #### Step 3: Apply Sufficiency Rules
  Based on the Warrant (Step 1) and Defeaters (Step 2), apply the following logic:

  *   **If Warrant A (Direct Evidence):**
      *   *No Defeaters:* **ACCEPT.**
      *   *With Defeaters:* **ESCALATE** (Send to Taxonomist). The photo proves *a* thing was there; the defeater suggests it might not be *that* thing.
  *   **If Warrant B (Expert Testimony):**
      *   *No Defeaters:* **ACCEPT.** (The *Āpta*'s word is sufficient).
      *   *With Defeaters:* **ESCALATE.** Even experts misidentify outliers.
  *   **If Warrant C (Descriptive Match):**
      *   *No Defeaters:* **ESCALATE.** Description alone is insufficient for rare species without Trust Status.
      *   *With Defeaters:* **REJECT.**
  *   **If Warrant D (Algorithmic/Inferred):**
      *   *Any Case:* **REJECT** (for Rare Species list). Apps are probabilistic; rare species records require certainty. *Exception:* If accompanied by Warrant A (Photo + App), treat as Warrant A.

  #### Step 4: The Asymmetry Check (Human Stop)
  If you are about to **REJECT** a record from a Trusted Observer (Warrant B) due to a Defeater, or **ACCEPT** a record that triggers a Spatial Defeater (range expansion), stop.
  *   **Action:** Flag for Senior Coordinator.
  *   **Reason:** This is no longer data quality; this is risk management. We are deciding whether to risk a false negative (insulting Dorothy) or a false positive (triggering a land-use hearing).

  ***

  ### Running the Protocol on Your Cases

  #### Case 1: The Moth (Photo, No Date/Locality, Outside Range)
  *   **Step 1 (Warrant):** A. Direct Evidence (Photo exists).
  *   **Step 2 (Defeaters):** Spatial Defeater (Outside known range). Also, Metadata Defeater (No date/locality makes the photo scientifically unanchored).
  *   **Step 3 (Sufficiency):** Warrant A *with* Defeaters = **ESCALATE**.
  *   **Outcome:** The photo is real, but the data is broken. It cannot be accepted into the Atlas as is because it cannot be mapped or verified temporally. It goes to a taxonomist to see if the ID is even plausible, but it will likely be set aside until the submitter provides metadata.
  *   **Verdict:** **Not Accepted (Escalated).**

  #### Case 2: The Bird (Beginner, App ID, Wrong Month)
  *   **Step 1 (Warrant):** D. Algorithmic/Inferred (App ID is not Direct Evidence of species, only of sound; no photo).
  *   **Step 2 (Defeaters):** Temporal Defeater (Wrong month). Competence Defeater (Beginner).
  *   **Step 3 (Sufficiency):** Warrant D = **REJECT**.
  *   **Outcome:** The protocol is rigid here. An app is not a *pramāṇa* for rare species. The phenology conflict confirms the high risk of false positive.
  *   **Verdict:** **Rejected.**

  #### Case 3: Dorothy (Trusted, No Photo, Written Description)
  *   **Step 1 (Warrant):** B. Expert Testimony (She is on the Trusted List).
  *   **Step 2 (Defeaters):** None stated (Assuming description matches phenology/habitat).
  *   **Step 3 (Sufficiency):** Warrant B *with* No Defeaters = **ACCEPT**.
  *   **Outcome:** Nyāya holds that the word of the *āpta* (trustworthy person) is a valid source of knowledge (*śabda-pramāṇa*). The protocol codifies this. Her description functions as the extension of her perception.
  *   **Verdict:** **Accepted.**

  ***

  ### The Instinct Clash

  You told me you have two instincts:
  1.  **Nothing without a photo should ever count.**
  2.  **Dorothy is basically never wrong.**

  The protocol forces you to give up **Instinct #1**.

  **Why:** In Nyāya epistemology, *Śabda* (Testimony) is not a "second best" to *Pratyakṣa* (Perception); it is a distinct, irreducible instrument of knowledge. If we accept that knowledge is social and distributed, we must accept that a reliable witness transmits knowledge even without a physical token. If you enforce "No Photo, No Record," you are effectively declaring that *Pratyakṣa* is the *only* valid *pramāṇa*. This contradicts the Nyāya framework you asked to implement, but more importantly, it contradicts the reality of your data.

  If Dorothy loses her phone but sees a population-extinct plant, and you reject her record because of a missing JPG, you are prioritizing *file format* over *epistemic reliability*. The protocol protects the science by accepting Dorothy (Warrant B) while protecting the database from the Beginner/App user (Warrant D). The photo is a tool for verification, not the ontological ground of the sighting.

  ### Where the Protocol Will Misfire (The Honest Assessment)

  1.  **The "Trusted List" Decay:** Nyāya requires the *āpta* to be currently competent. Dorothy was reliable for 20 years. Is she reliable now? Her eyesight may have faded; her memory may have slipped. The protocol treats Trust as binary (On/Off). In reality, it is a decaying function. You need a human review of the Trusted List annually, or the *Śabda* warrant becomes corrupt.
  2.  **The "Range Expansion" Trap:** Step 4 flags range expansions for human review. This is where the protocol admits defeat. A true range expansion *looks* like a Spatial Defeater. If you follow the protocol strictly, you reject all range expansions. If you override it, you introduce bias. This is where your hydrologist experience matters more than the philosopher's: you know that rivers change course. Species ranges change too. The protocol cannot calculate the probability of climate shift vs. misidentification.
  3.  **The App as "False Śabda":** Users will treat the App as an Authority (*Śabda*). They will write "iNaturalist said this." The protocol classifies this as Inference (D), but the *user* experiences it as Testimony. This creates a friction point where reviewers have to educate submitters that an algorithm is not a person.
  4.  **Asymmetric Risk:** The protocol treats False Positives and False Negatives as logical errors. They are not; they are ethical costs. Rejecting Dorothy (False Negative) costs trust. Accepting the Beginner's Bird (False Positive) costs landowners money (survey obligations). The protocol pushes this to Step 4 ("Human Stop"), but ultimately, *you* must decide the ratio. Nyāya can tell you how Dorothy knows; it cannot tell you how much a landowner's inconvenience weighs against a species' survival.

  **Final Advice:** Print the protocol. Test it on last month's queue. If Dorothy's record comes up as "Rejected" because you haven't formally put her on the "Trusted List" yet, you will see immediately where the theory hits the administrative wall. Fix the list, not the logic.
