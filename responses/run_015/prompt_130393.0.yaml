answer: |-
  A strict Bayesian named Elias is preparing to launch a startup. His friend, a fellow rationalist, asks, "What's your probability of success?"

  Elias says, "Ninety percent."

  "Whoa," says the friend. "That sounds like the Inside View. Have you checked the Outside View? What's the base rate for startup success?"

  "I did," Elias replies. "It's ten percent. But I'm adjusting for the fact that I'm applying the Outside View correctly, which most founders don't."

  "Okay," says the friend. "So what's the base rate for *founders who correctly apply the Outside View*?"

  Elias pauses. "Well, to calculate that, I need a reference class of 'Founders who accurately assess their own epistemic limitations.'"

  "Right."

  "But to populate that class," Elias continues, "I have to filter out the founders who *think* they're assessing their limitations but are actually just overconfident about their humility. And to distinguish the truly humble from the confidently humble, I need to perform an Inside View analysis of their cognitive processes."

  "So?"

  "So, the only cognitive process I have direct access to is my own. Which means the only member of the reference class 'People who know they aren't overconfident' that I can verify is... me."

  "Sample size of one?"

  "Exactly. If I broaden the class to 'People who claim to be humble,' the base rate of success drops to the general ten percent because the class is diluted by liars and fools. But if I narrow it to 'People who are actually humble,' I have to use an Inside View judgment to define the group, which defeats the purpose of using an Outside View to check my judgment. I'm stuck in a loop where the only way to validate my epistemic modesty is to assume I already have it."

  The friend nods slowly. "So what's your final probability?"

  Elias sighs. "I've updated to 50 percent."

  "Why?"

  "Because given the reference class collapse, I'm either a statistical anomaly or the entire population. And in a sample size of one, the error bars cover everything from 'Genius' to 'Delusional.'"
