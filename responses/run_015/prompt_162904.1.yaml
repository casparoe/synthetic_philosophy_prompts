      *   *Potential Overstatement:* Kepler didn't think *all* traditional astrology was waste, but he rejected a huge chunk (predictions of weather/politics). He focused on "weather" and "human disposition" via harmony. The user says "exclusion of most of the traditional apparatus." This is accurate.
