      *   **Key Distinction:** "Phenomenal Absence" (true lack of qualia) vs. "Phenomenal Transparency" (cognitive processing without meta-representational access).
      *   **The Move:** When we imagine a zombie, we are actually imagining a being with first-order processing but no second-order access (transparency), not a being lacking qualia *per se*. True phenomenal absence is inconceivable (like a color outside color space).
      *   **Implication:** Conceivability $\neq$ Possibility because the description of the conceived scenario is wrong.
      *   **Ontological Commitment:** Phenomenal consciousness *is* (or necessarily supervenes on) a specific form of meta-representational integration (likely Higher-Order Thought/Representation theory mixed with Global Workspace/Predictive Processing).
