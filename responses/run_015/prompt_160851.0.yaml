  ### A Brief Note on the Distinction
  Your copycat/fluid distinction does heavy lifting here. The most dangerous claims in this literature are not the ones where the meaning is vague (fluid), but the ones where the meaning is precise enough to condemn, yet loose enough to apply indiscriminately (copycat). Case 1 is the prime offender: it retains the moral toxicity of "manipulation" while stripping away the conditions (like deception) that usually justify that toxicity. If your thesis can isolate where the inferential profile is inherited without the evidential basis, you will have mapped the exact location of the conceptual friction.
