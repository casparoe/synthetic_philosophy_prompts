answer: |-
  This is a sharp distinction, and it cuts through a lot of the fog in this literature. The "copycat" category captures the rhetorical sleight of hand where a term is mobilised for its moral sting rather than its descriptive accuracy, whereas "fluidity" acknowledges that some concepts are essentially contestable. Below is the pressure test you requested, applied to the six cases.

  ### Analysis of Uses

  **1. A nudge manipulates, because it works by bypassing the agent's deliberation rather than engaging it.**
  *   **(a) Copycat Score:** 9/10
  *   **(b) Load-bearing?** Yes, because if "manipulation" were pinned down to require deception or coercion, the claim would collapse, leaving only the neutral observation that deliberation was bypassed.

  **2. Recommender systems manipulate users: they exploit weaknesses revealed by the users' own past behaviour.**
  *   **(a) Copycat Score:** 7/10
  *   **(b) Load-bearing?** Yes, because without the inherited sting of "exploitation", the claim reduces to the trivial truth that algorithms optimise for predicted preferences.

  **3. Advertising manipulates by creating preferences the consumer would not otherwise have had.**
  *   **(a) Copycat Score:** 6/10
  *   **(b) Load-bearing?** Yes, because if manipulation requires subverting existing preferences rather than forming new ones, most standard persuasion would no longer fit the category.

  **4. The state manipulates citizens whenever it builds a choice architecture it could not justify to them in public terms.**
  *   **(a) Copycat Score:** 4/10
  *   **(b) Load-bearing?** Partially, though the normative claim about illegitimacy would survive even if the psychological label of "manipulation" were removed.

  **5. Ulysses-style self-binding is a case of manipulating one's later self.**
  *   **(a) Copycat Score:** 8/10
  *   **(b) Load-bearing?** Yes, because standard definitions of manipulation require distinct agents, so pinning this down would reclassify the act as consensual self-regulation.

  **6. A speaker manipulates an audience when her message is framed so that a false claim looks obviously true.**
  *   **(a) Copycat Score:** 1/10
  *   **(b) Load-bearing?** No, because this fits the paradigm case of manipulation so closely that clarifying the definition would not alter the claim's shape.

