  *(Self-Correction during drafting)*: Make sure I explicitly mention the "Primary Caregiver" risk regarding intrusive HR inquiries, as the lawyer chair will care about that. Also, ensure the distinction between "Parental Leave" and "Short Term Disability" is clear for the medical portion.

  *(Final check on numbers)*: Current is 16/4. If I recommend 16/16 + Medical, that's a cost increase. If I recommend 12/12 + Medical, that's a cut for birth parents (16 -> 12 bonding). To make it palatable, I'll recommend **16 weeks for all** (matching the current high water mark) to avoid the perception of a cut, funded by the efficiency of the new structure. Actually, to be realistic for a mid-size co, maybe **14 weeks**. Let's stick to **16 weeks** to make the equity argument strong. It's easier to justify cost if it's "matching the current birth benefit for everyone."

