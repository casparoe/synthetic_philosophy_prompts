      *   Wait, the prompt says Proposal A is "12 weeks... PLUS medical." I should probably stick to the prompt's framing of the proposals but argue for the *structure* of A, perhaps adjusting the number to be competitive. I will recommend **16 Weeks Bonding (All)** + **Medical**. This is structurally Proposal A.
      *   *Self-Correction:* The prompt asks me to recommend a concrete structure. I will recommend **16 Weeks Paid Parental Leave (All)** + **Medical Recovery (via STD)**.
      *   *Steelman:* I need to really give credit to the "Shared Pool" advocates. Their point about family autonomy is valid. I need to explain why we override autonomy for equity goals.
      *   *Edge Cases:* The sister/wife scenario is crucial. Both get 16 weeks. Surrogate gets medical only.

  8.  **Final Polish:**
      *   Check length (2 pages).
