prompt: |-
  I'm on the grants committee of a small foundation — five of us, we move maybe $2M a year, mostly global health with a bit of animal welfare and one weird meta-science thing — and I've become the person who keeps pushing importance/tractability/neglectedness on everyone else. Except I've pushed it further than the version I was introduced to. I don't think neglectedness, as usually stated (how few dollars or people are already working on this), is doing any real work. What matters, I argue, is what I've started calling the washout rate: of the good you appear to buy with your marginal dollar, how much would have happened anyway within, say, a decade — because other funders would have arrived later, because a government would have backfilled, because the people you hired would have done something comparably good in another job, or because you just moved the money around inside a system that was going to spend roughly that much regardless. Neglectedness is a proxy for a low washout rate and I think it's a bad one: a cause can look crowded and still have near-zero washout (everyone's money is already committed, so none of it responds to you; or it's a coordination failure where each funder waits for the others), and a cause can look starved and have a washout rate near one (nothing is there because nothing sticks — it's a swamp that absorbs resources and gives little back, which is partly *why* it's neglected). So my position: keep importance and tractability, drop neglectedness, put washout in its place, keep multiplying.

  We have a vote coming up that turns on exactly this — one proposal is a well-evidenced, fairly crowded intervention where I think the washout is surprisingly low, the other is a starved and speculative area where I suspect our money would mostly evaporate. So: what would count against my framework? I already know the two obvious moves — that washout is even harder to estimate than neglectedness, so I've just relocated the measurement problem somewhere with worse data, and that I now need a model of the funding ecosystem and not just of the cause, which is a big ask for a five-person committee. I think I have answers to both, so give me the objections I don't have, ranked from fatal to merely awkward, and be explicit about which ones a committed ITN person would themselves concede as counting against them rather than just what a critic would say. Two things I especially want. First: am I insulated? It looks like I can always say the washout estimate was wrong, or that washout is high in principle but not in this case — so tell me whether I've qualified this into something unfalsifiable, and if I have, whether that's actually a problem for a thing of this kind or just what allocation heuristics are like. Second: don't lean on specific historical cases I can't check to adjudicate this — if there are patterns in how philanthropy or aid has actually gone that I should already have updated on, argue from the general shape of them and say what the retrospective audit would have to show to count against me. Our newest committee member also says the whole framework quietly assumes importance is measurable on a single scale and that we should just deliberate case by case; I think that's defeatism, but tell me if it's secretly the strongest objection of all.

  Please be committed rather than even-handed: tell me whether you think I'm right, whether the multiplication survives, what you'd put in its place if not, and what you'd personally find most decisive if you were sitting in my seat on Thursday.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Member of a 5-person grants committee at a small foundation ($2M/year).
      *   **Focus:** Global health (mostly), animal welfare, one meta-science project.
      *   **Current Stance:** Proponent of Importance/Tractability/Neglectedness (ITN), but modifying "Neglectedness" to "Washout Rate" (counterfactual impact of the marginal dollar).
      *   **The Conflict:** Upcoming vote between a crowded/low-washout intervention vs. a starved/high-washout (speculative/swamp) intervention.
      *   **The Request:** Critique the "Washout" framework. Rank objections from fatal to awkward. Include objections a *committed ITN person* would concede. Address falsifiability/insulation. Address the "single scale importance" objection. Be committed/opinionated, not even-handed. Tell me what I'd do if I were in their seat.

  2.  **Deconstruct the "Washout" Framework:**
      *   *Definition:* Washout = % of apparent good that would have happened anyway (due to backfilling, fungibility, talent substitution, etc.).
      *   *Claim:* Neglectedness is a bad proxy for Washout. Washout is the true counterfactual metric.
      *   *Mechanism:* Keep Importance (I) and Tractability (T), replace Neglectedness (N) with (1 - Washout). Multiply: $Impact = I \times T \times (1 - W)$.

  3.  **Brainstorm Objections (Filtering for Quality and Source):**
      *   *Objection 1: Measurement/Epistemic.* Washout is harder to measure than neglectedness. (User acknowledges this, so I need to go deeper).
      *   *Objection 2: Falsifiability/Insulation.* Can the user always retroactively adjust the washout estimate to justify the decision?
      *   *Objection 3: The "Single Scale" Objection.* Is Importance commensurable across global health, animal welfare, and meta-science?
      *   *Objection 4: The Multiplication Itself.* Does multiplying these factors make sense, or does it distort risk?
      *   *Objection 5: The "Small Foundation" Constraint.* Does a $2M foundation actually move the needle enough to worry about macro-washout (government backfill) vs. micro-washout (talent substitution)?
      *   *Objection 6: The "Swamp" Argument.* Why *is* it neglected? Often because it's hard, not just because it's unknown.
      *   *Objection 7: ITN Internal Critique.* Even hard ITN folks might admit "Neglectedness" captures diminishing returns, which "Washout" might miss if not carefully defined.

  4.  **Develop the "Committed" Stance:**
      *   I need to take a side. The user's intuition is *correct* (counterfactuals matter more than headcounts), but the *implementation* (replacing N with W in a multiplication framework) is likely flawed and dangerous for a small committee.
      *   *Verdict:* You are right about the *concept* (counterfactuals > headcounts) but wrong about the *framework* (Washout as a distinct multiplier).
      *   *Reasoning:* Washout isn't a separate variable; it's inherent to Tractability and the marginal utility of money. Separating it creates double-counting risks and epistemic black boxes.

  5.  **Drafting the Objections (Ranking Fatal to Awkward):**

      *   *Fatal 1: The Insulation Problem (Falsifiability).* If Washout is an internal estimate of a counterfactual that never happens, you can never be proven wrong. If the project fails, you say "Washout was high." If it succeeds, you say "Washout was low." It's a get-out-of-jail-free card for bad intuition. *ITN Concession:* A rigorous EA would admit this is a Bayesian prior that needs updating, but in practice, it becomes dogma.
      *   *Fatal 2: Double Counting Tractability.* Tractability usually means "How much good does $X buy?" Washout means "How much of that good is *new*?" But if the good would have happened anyway, was it ever *tractable* for *you* to buy it? Separating them invites double-counting the difficulty of the problem.
      *   *Awkward 1: The Small Player Delusion.* At $2M/year, do you really worry about government backfill? That's a Gates/World Bank problem. Your washout is mostly talent fungibility. Treating them the same scales the heuristic wrong.
      *   *Awkward 2: The Importance Scale.* The new member is half-right. You can't compare DALYs to animal suffering to meta-science on one number. But case-by-case is chaos. You need a *portfolio* approach, not a project multiplier.

  6.  **Addressing Specific User Questions:**
      *   *Insulation:* Yes, it's unfalsifiable. Is that a problem? Yes, because it prevents learning.
      *   *Retrospective Audit:* What would count against you? If you fund "low washout" projects that consistently show zero marginal impact compared to controls, while "high washout" areas generate innovation.
      *   *Single Scale Importance:* It is a strong objection. ITN breaks down when causes are incommensurable.
      *   *Thursday's Vote:* What would I do?

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I shouldn't just say "Washout is hard." I need to explain *why* it breaks the math.
      *   *Correction:* The user says "Keep multiplying." I should challenge the multiplication. Multiplying by (1-W) implies independence. But Washout is highly correlated with Tractability (hard things often have high washout because solutions are sticky/slow).
      *   *Tone:* Respectful but sharp. They asked for committed, not even-handed.
      *   *ITN Concession:* I need to explicitly state what a GiveWell/OpenPhil type would admit. (e.g., "We use cost-effectiveness estimates that *implicitly* model counterfactuals, we don't add a separate 'counterfactual' multiplier.")

  8.  **Finalizing the Recommendation:**
      *   Don't replace N with W.
      *   Absorb W into Tractability (Marginal Tractability).
      *   Acknowledge the Importance scale issue (use buckets/portfolio).
      *   Vote for the crowded/low-washout one *if* the evidence is solid, because "starved" often means "graveyard."

  9.  **Structure of the Response:**
      *   Direct Answer/Verdict.
      *   Ranked Objections (Fatal -> Awkward).
      *   The Insulation/Falsifiability Check.
      *   The "Single Scale" Objection.
      *   The Thursday Decision.

  10. (Final Polish): Ensure the distinction between *Neglectedness* (input side) and *Washout* (output side) is clear. Ensure the distinction between *Tractability* (technical) and *Marginal Tractability* (economic) is clear.

  *(Self-Correction on "Fatal" Objections)*: Is "Insulation" truly fatal? In science, yes. In philanthropy, maybe not. But for a *learning* organization, yes. I will frame it as "Epistemic Corruption."
  *(Self-Correction on "Single Scale")*: This is actually a critique of ITN itself, not just the Washout modification. I need to be careful not to throw out the baby with the bathwater. I will argue it's a "Silent Killer" objection.

  Let's write.
answer: |-
  Here is the committed take you asked for.

  You are right about the *concept* but wrong about the *framework*. Your intuition that counterfactual impact (washout) matters more than input headcounts (neglectedness) is correct and aligns with the best economic thinking on aid effectiveness. However, promoting "Washout" to a standalone multiplier alongside Importance and Tractability is a category error that will degrade your committee's decision-making.

  If I were in your seat on Thursday, I would vote against formalizing "Washout" as a distinct variable, but I would vote for the crowded intervention *if* the evidence is solid, precisely because "starved" is often a signal of a graveyard, not an opportunity.

  Here are the objections, ranked from fatal to merely awkward, including the concessions a rigorous ITN proponent should make.

  ### 1. The Epistemic Insulation (Fatal)
  You asked if you've qualified this into something unfalsifiable. **Yes, you have.**

  Neglectedness is an observable input metric (dollars, FTEs). You can be wrong about it, but you can check the data. Washout is a counterfactual claim about a timeline that will never exist. If you fund the project and it succeeds, you claim your washout estimate was correct. If you fund it and it fails, you can claim the washout was actually high (the success would have happened anyway via another path, or the failure proves the system was resistant). If you *don't* fund it and someone else succeeds later, you claim you correctly identified high washout (backfill).

  **Why this is fatal:** It severs the feedback loop required for learning. A heuristic is only useful if it can be proven wrong. By making the metric entirely dependent on an unobservable counterfactual, you have created a "get-out-of-jail-free" card for bad intuition.
  **The ITN Concession:** A committed Effective Altruist (EA) or ITN practitioner *must* concede this. This is why organizations like GiveWell do not have a "Neglectedness" multiplier in their cost-effectiveness models. They model counterfactuals *within* the tractability estimate (marginal utility of money), not as a separate variable. They know that adding a subjective counterfactual multiplier invites motivated reasoning.

  ### 2. Double-Counting Tractability (Fatal)
  You propose: $Impact = Importance \times Tractability \times (1 - Washout)$.
  This implies Tractability and Washout are independent variables. They are not.

  Tractability, properly defined, is "How much good does a marginal dollar buy?" If a cause has a 90% washout rate (i.e., 90% of the good would have happened anyway), then the *marginal* tractability is already 10% of the *average* tractability. By separating them, you invite double-counting. You might rate a project as "High Tractability" (technically solvable) and "Low Washout" (counterfactually robust), when in reality, the reason it is technically solvable is *because* the market/government is already solving it (high washout).

  **The ITN Concession:** Rigorous ITN users treat Neglectedness as a proxy for *diminishing returns*. Washout is just a more granular version of diminishing returns. It belongs inside the Tractability function, not alongside it. Multiplying them treats them as orthogonal forces when they are deeply entangled.

  ### 3. The "Small Player" Delusion (Awkward but Significant)
  You are a $2M foundation. You are not the Gates Foundation, and you are not the US Government.
  Your framework conflates **Macro-Washout** (government backfill, market correction) with **Micro-Washout** (talent fungibility).

  *   **Macro-Washout:** If you fund a vaccine rollout, will the Ministry of Health have done it anyway? For a $2M player, the answer is almost always "No." You are not moving the macro needle enough to trigger backfill. Worrying about government backfill at your scale is vanity.
  *   **Micro-Washout:** If you hire a researcher, would they have done similar work elsewhere? This is your *actual* washout risk.

  By using a unified "Washout" metric, you risk over-indexing on macro-concerns (e.g., "The World Bank is looking at this") that are irrelevant to your check size, while under-indexing on the real risk (e.g., "This NGO is just reshuffling existing donor funds").
  **The Concession:** A sophisticated funder would admit that washout is scale-dependent. At $2M, neglectedness (input scarcity) is actually a *better* proxy for washout than at $2B, because you aren't big enough to crowd yourself out.

  ### 4. The "Single Scale" Objection (The Silent Killer)
  Your new committee member is not being defeatist; they are pointing out the mathematical collapse of ITN at the portfolio level.
  You cannot meaningfully multiply "Global Health DALYs" × "Animal Welfare Suffering Units" × "Meta-Science Progress."

  If you force these onto a single scale, you are smuggling in massive, unexamined moral weightings. If you don't, the multiplication breaks.
  **Why this matters for you:** You have three distinct buckets (Health, Animals, Meta). Applying a unified Washout framework across them implies you have a unified theory of value that allows you to compare the washout of a deworming pill to the washout of a philosophy paper. You don't.
  **The Verdict:** The member is right that case-by-case deliberation is necessary *across* cause areas, even if heuristics help *within* them. ITN is a project-selection tool, not a cause-allocation tool. Using it to decide between Health and Animals is a category error.

  ### 5. The "Swamp" Signal (Awkward)
  You argue that neglectedness is a bad proxy because some things are neglected because they are swamps (high washout/low stickiness).
  **Counter:** This is actually the strongest argument *for* keeping Neglectedness as a warning flag, not replacing it.
  If an area is starved, there is usually a reason. In global health, capital is relatively fluid. If money isn't there, it's often because the technical bottleneck is hard (low Tractability) or the absorption capacity is low (high Washout).
  By swapping Neglectedness for Washout, you are telling yourself you can distinguish a "Hidden Gem" from a "Graveyard" via estimation. History suggests philanthropists are terrible at this. We consistently overestimate our ability to fix "broken" systems and underestimate the signal of market/government absence.
  **Retrospective Audit:** To count against you, an audit wouldn't need specific cases. It would need to show a pattern: that your "Low Washout / Starved" bets have a lower realization rate of *marginal* impact than your "High Washout / Crowded" bets. (Spoiler: The data from venture philanthropy suggests crowded fields are crowded because success is reproducible. Starved fields are often starved because success is non-reproducible.)

  ---

  ### On Insulation and Falsifiability
  You asked if the insulation is a problem. **Yes.**
  In science, unfalsifiability is a bug. In philanthropy, it is often a feature—we can't run controlled trials on history. However, for a *learning* committee, it is fatal.
  If you adopt Washout, you must bind yourself to a **Pre-Mortem Protocol**. Before funding, you must write down: "What specific observable event in 5 years would prove our Washout estimate was wrong?"
  *   *Example:* "If we fund this researcher and they publish, but citation networks show their work is only cited by people we also funded, Washout was high (echo chamber)."
  *   *Example:* "If we fund this clinic and local government spending in that district drops by an equivalent amount, Washout was 100% (backfill)."
  Without these observable triggers, you are not doing analysis; you are doing astrology.

  ### On the "Single Scale" Objection
  Is it the strongest objection? **Yes, but not for the reason your colleague thinks.**
  Your colleague says "deliberate case by case" (implying no framework). That *is* defeatism. You need a framework to avoid bias.
  The real problem is that ITN assumes **Independence**. It assumes Importance, Tractability, and Neglectedness (or Washout) are separate levers. They are not.
  *   High Importance often draws funding (lowering Neglectedness).
  *   High Tractability often draws funding (lowering Neglectedness).
  *   High Washout is often a result of High Tractability (if it's easy, others will do it).
  Multiplying them treats them as independent probabilities. They are correlated variables. A multiplicative model on correlated variables produces extreme outliers that look mathematically precise but are actually garbage.

  ### What I Would Do On Thursday

  **1. Reject the Formal Framework Change.**
  Do not vote to replace Neglectedness with Washout in your charter. It creates the insulation problem and the double-counting problem. Keep "Neglectedness" but redefine it in your internal notes as "Marginal Room for More Funding," which implicitly includes washout. Don't change the math; change the interpretation.

  **2. Absorb Washout into Tractability.**
  When discussing Tractability, force the question: "Is this tractable *for us*, specifically?" That is the Washout question. If the answer is "It's tractable, but the government would have done it," then the Tractability score *for you* is zero. Do not give it a separate multiplier.

  **3. The Vote.**
  Vote for the **crowded, well-evidenced intervention**, provided your $2M is actually marginal (i.e., not replacing another funder).
  *   *Why?* You are a small foundation. You cannot afford to be a venture capitalist for "swamps." You need to be a gap-filler in proven systems.
  *   *The Washout Reality:* In global health, "crowded" usually means "proven." The risk of backfill is lower than the risk of technical failure in speculative areas. A deworming program that is 90% backfilled still delivers 10% marginal good with near-zero risk of failure. A speculative meta-science project that is 0% backfilled has a 90% risk of producing nothing.
  *   *Expected Value:* $2M \times 10\% \times HighConfidence > $2M \times 100\% \times LowConfidence$.

  **4. The Compromise.**
  Tell your committee: "I agree Neglectedness is just a proxy. I propose we keep the ITN labels for simplicity, but we define 'Tractability' strictly as 'Counterfactual Impact per Dollar.' This forces us to discuss Washout *inside* the Tractability score without breaking our math or insulating ourselves from feedback."

  **Summary:** You have correctly identified that Neglectedness is a proxy, but you are trying to replace a noisy proxy with an unobservable latent variable. Keep the proxy, but calibrate it. Do not multiply by Washout. Fund the boring, crowded thing that works.
