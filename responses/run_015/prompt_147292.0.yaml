      *   **Self-Defeat (Step 10):**
          *   Address the worry that the argument disproves itself.
          *   The argument shows $S$ can't prove its own soundness. It doesn't show *we* (the meta-theorists) can't see $S$ is sound.
      *   **Recommendations for the PhD:**
