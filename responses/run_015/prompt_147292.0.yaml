      *   **Target Step (2):** This is the standard resolution. Distinguish between *proving* soundness and *being* sound/acting on it.
      *   **Address Step (7) (Successors):** This is where the "Tiling Agents" literature (MIRI, Yudkowsky, Herreshoff, etc.) is most relevant. The "descending endorser" is essentially a hierarchy of theories. It works, but it has costs (finite horizon or weakening).
