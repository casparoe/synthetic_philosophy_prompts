      *   *Correction:* The agent isn't just a proof checker. It's a *controller*. It maps proofs to actions. The map $f: \text{Proofs} \to \text{Actions}$ exists outside $S$. $S$ describes the world. The agent's *decision logic* uses $S$.
      *   *Crucial Distinction:* The agent doesn't need to prove $\square \phi \to \phi$. The agent needs to implement the policy: "If $\exists p (\text{Proof}_S(p, \phi))$, then do $X$." This policy is valid *metatheoretically* even if $S$ doesn't prove the implication.
