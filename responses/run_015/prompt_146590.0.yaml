          *   *Historical Defensibility:* Franklin was a Enlightenment figure. Lockean psychology (association of ideas, habit formation) is a better historical framework than "behaviorism." Behaviorism is 20th century; Associationism is 18th century.
          *   *Religious/Civic Context:* Don't ignore the "Error" vs. "Sin" distinction. Franklin secularizes sin into error. This supports the engineering reading but needs to acknowledge the theological residue.
