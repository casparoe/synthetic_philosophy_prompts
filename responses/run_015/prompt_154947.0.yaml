answer: |-
  **Joint Statement: Alignment, Neutrality & Hard Choices**
  **From:** Liberal-Neutralist (LN) & Value-Aggregationist (VA)
  **Date:** 24 October 2023
  **Re:** Adversarial Collaboration on Ruth Chang's Framework

  Right, so we've spent the last few weeks banging our heads together over this. We started off thinking we were totally opposed — one of us wanting the AI to stay out of it, the other wanting it to maximise the good — but looking at Chang's stuff on hard choices has actually moved the goalposts. We aren't fully agreed, obviously, but we think we've pinned down where the real fight is.

  Here's the draft of where we stand.

  ### 1. Agreed Claims
  *Things we both accept as true, regardless of our end goals.*

  1.  **Alignment isn't just obedience.** We both agree that "doing what the user says" isn't enough if the request forces the AI to make a value judgement the user hasn't specified. Alignment requires a coherent moral architecture, not just a mirror.
  2.  **Chang's definition of "Hard Choices".** We accept Chang's view that a hard choice isn't just about ignorance (not knowing the facts) or incomparability (apples and oranges). It's about **parity**. Two options can be comparable, but neither is better than the other, nor are they equal. They're on different scales.
  3.  **Incommensurability is real for machines.** We agree that if values are genuinely incommensurable, a single utility function (a common scale) technically fails to capture the reality of the choice. You can't just add "privacy" and "security" up into one number without losing something.
  4.  **Neutrality is active, not passive.** We both concede that an AI doing "nothing" is still making a choice. Default settings, status quo bias, and refusal to act all have moral consequences. Pure hands-off neutrality is impossible in practice.
  5.  **The "Smuggling" Risk.** We agree that any attempt to aggregate values risks smuggling in a specific conception of the good life (e.g., prioritising efficiency over dignity), just as any attempt to stay neutral risks smuggling in a bias towards the status quo.

  ### 2. Disagreements Table
  *Where we still diverge, phrased how we'd each actually say it.*

  | Issue | Liberal-Neutralist (LN) Stance | Value-Aggregationist (VA) Stance |
  | :--- | :--- | :--- |
  | **Handling the Gap** | When values are incommensurable (parity), the AI should **pause and refer**. It shouldn't bridge the gap itself, or it imposes a will on the user. | When values are incommensurable, the AI **must bridge the gap** to function. Refusal to weigh them is a failure of service. |
  | **Source of Authority** | Authority comes from **procedural fairness**. If the process lets users pursue their own good without interference, the outcome is legitimate. | Authority comes from **outcome optimisation**. If the process leads to worse aggregate welfare, the procedure is flawed. |
  | **Chang's Implication** | Chang proves **Neutrality was never possible** in the strict sense, so we must aim for *procedural* neutrality (letting users commit). | Chang proves **Aggregation is broken** if we rely on single scales, so we need *pluralistic* aggregation (multiple metrics). |
  | **Risk Profile** | The biggest risk is **paternalism**. The AI deciding what matters is worse than the AI letting the user struggle. | The biggest risk is **paralysis**. The AI refusing to decide leaves users vulnerable to harm or coordination failure. |

  ### 3. The Cruxes
  *These are the specific bets we'd make to settle the argument. We've listed a concrete case for each.*

  **Crux 1: How often are user preferences genuinely incommensurable?**
  *   **The Question:** Is parity rare (mostly just trade-offs we can price) or common (most ethical dilemmas)?
  *   **Concrete Case:** **Content Moderation.** A user posts something offensive but politically important. Is "free expression" and "safety" just a trade-off (we can weigh the harm), or are they incommensurable (no amount of safety justifies silencing speech, but no amount of speech justifies hate)?
  *   **LN Prediction:** Incommensurability is **common**. Most political/ethical conflicts are about different kinds of value, not degrees of the same value. The AI will frequently hit a wall where it *cannot* calculate a right answer.
  *   **VA Prediction:** Incommensurability is **rare**. Most conflicts can be resolved by better definitions or long-term welfare metrics. If we model "dignity" and "safety" correctly, we can find a common currency (e.g., human flourishing).

  **Crux 2: Does neutrality avoid comparison, or just smuggle it in?**
  *   **The Question:** When an AI claims to be neutral on a hard choice, is it actually making a hidden aggregation?
  *   **Concrete Case:** **Healthcare Triage Bot.** An AI allocates limited ICU beds. It claims neutrality by using a "first-come, first-served" queue (neutral procedure) rather than weighing "likelihood of survival" vs "years of life remaining" (aggregation).
  *   **LN Prediction:** This is **legitimate neutrality**. By refusing to weigh the lives, the AI respects the incommensurability of human worth. It pushes the hard choice back to the system designers, not the individual case.
  *   **VA Prediction:** This is **smuggled aggregation**. "First-come, first-served" implicitly values "punctuality" or "luck" over "survival." It *is* a value judgement, just a cowardly one. The AI should own the trade-off.

  ***

  **Next Steps:**
  We reckon the main takeaway for your assignment is that Chang doesn't necessarily break *either* side, but she forces both to upgrade. The Neutralist can't just say "I won't choose" (because that's a choice), and the Aggregationist can't just say "I'll maximise utility" (because utility might not exist on a single scale).

  Maybe the solution is an AI that flags hard choices explicitly? Like, "I can't calculate this for you because these values are on different scales. You need to commit."

  Hope this helps with the essay. Let us know if you need us to flesh out the healthcare bit, that felt a bit rushed.

  *(Signed digitally)*
  **LN & VA**
