answer: |-
  ### Exam Prompt

  **Question 1: The Metaphysics of Mortality (25 Marks)**

  **Scenario:** A patient has been on ECMO (mechanical heart-lung support) for three weeks. EEG scans show zero detectable brain activity, yet the heart continues to beat due to mechanical pumping. The medical team recommends declaring neurological death and withdrawing support. The family objects, citing a tradition that defines death strictly by the natural cessation of cardiac function, arguing that a beating heart signifies life regardless of brain status.

  **Essay Task:**
  Critically evaluate the claim that declaring death in this scenario is purely a **biological discovery** versus a **value-laden decision** disguised as science. In your argument, address whether there can be one correct universal criterion for death (universalism) or if different cultures are justified in choosing criteria that serve their specific ontological purposes (relativism). Use the ECMO scenario to illustrate why the "line" of death is difficult to locate solely through empirical data.

  ***

  ### Model Answer

  The declaration of death in the ECMO scenario is not merely a biological discovery but a value-laden decision disguised as scientific fact. While biology provides data regarding cellular function, determining which function constitutes "human life" requires a normative judgment about what kind of entity a human is.

  Biologically, the patient exhibits a hybrid state: cellular metabolism continues via mechanical pumping, but organismic integration mediated by the brain has ceased. Proponents of brain death argue that the brain is the body's critical integrator; without it, the body is merely a collection of tissues, not an organism. However, this definition of "organismic wholeness" is not an empirical fact discoverable under a microscope. It is a metaphysical commitment prioritizing neurological integration over cardiac mechanics. By choosing brain death, medicine values *conscious potential* and *centralized control* over mere *circulatory motion*. The family's tradition values the latter. Neither side is scientifically "wrong" about the physiology; they disagree on the threshold where biology becomes biography.

  This disagreement suggests that a single universal answer is philosophically untenable. If death were purely objective, like the boiling point of water, cultural variance would be error. However, because death is a status change with moral consequences (organ harvesting, mourning, inheritance), the criterion chosen reflects cultural values. A culture that prioritizes individual autonomy and psychological continuity will favor brain death. A culture that views life as a sacred biological process entrusted to God may view mechanical interference as invalidating the death declaration until natural cardiac stoppage.

  Therefore, declaring death here is a policy decision, not a scientific finding. Science can tell us the brain is silent and the heart is pumping mechanically. It cannot tell us which signal matters more. To insist on universalism is to impose one metaphysical framework onto diverse ontologies. Accommodating the family's objection acknowledges that while biology constrains our definitions, it does not dictate them. The "line" of death is drawn by values, not discovered by scalpel.

  ***

  ### Marking Scheme

  **A Range (21–25 Marks): The Philosophical Critique**
  *   **Specific Philosophical Moves:**
      *   **Distinguishes Fact vs. Norm:** Explicitly identifies that "organismic integration" or "wholeness" is a normative concept, not just an empirical observation.
      *   **Ontological Depth:** Recognizes the conflict is not about medical data (both sides see the same beating heart/silent brain) but about *what kind of thing* a human being is (a psychological entity vs. a biological organism).
      *   **Critiques Universalism:** Argues that because the definition relies on values, a single universal criterion is an imposition of one culture's metaphysics rather than a scientific truth.
  *   **Use of Scenario:** Uses the ECMO mechanic to show how technology decouples heart and brain, forcing the value choice.

  **B Range (16–20 Marks): The Ethical Analysis**
  *   **Specific Philosophical Moves:**
      *   **Acknowledges Subjectivity:** Admits that science alone doesn't solve the problem but treats it mostly as an ethical conflict (respect for family vs. medical authority) rather than a metaphysical one.
      *   **Describes Differences:** Clearly explains the medical difference between brain and circulatory death but struggles to explain *why* the definition is value-laden beyond "people feel differently."
      *   **Moderate Universalism:** May argue for a universal standard for practical reasons (policy consistency) while acknowledging cultural pain, without digging into the ontological justification.
  *   **Use of Scenario:** Uses the scenario primarily as a backdrop for the ethical conflict rather than a metaphysical puzzle.

  **Common Mistakes (Loss of Marks)**
  *   **The "Objective Fact" Error:** Claiming brain death is scientifically proven to be death without addressing the family's ontological objection (max 15 Marks).
  *   **The "List" Trap:** Spending too much word count listing medical symptoms of brain death rather than analyzing the definition itself.
  *   **Ignoring the Prompt:** Failing to address the Universalism vs. Relativism component of the question.
  *   **Misunderstanding ECMO:** Claiming the heart is beating "naturally" when the prompt specifies mechanical pumping.

  ***

  ### Confidence Statement

  **Confidence Level:** 90%
  **Least Sure Point:** I am least sure about the **word count density in the Model Answer**. 400 words is extremely tight for a nuanced philosophical argument involving metaphysics, bioethics, and cultural relativism. There is a risk that a high school student might interpret the model's density as a requirement to sacrifice clarity for brevity, whereas a slightly longer answer (600 words) might allow for better development of the "ontological commitment" argument. However, I adhered to your constraint to ensure it fits a standard exam booklet format.
