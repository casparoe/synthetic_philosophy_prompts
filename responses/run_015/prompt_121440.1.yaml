  Dear Colleague,

  I have been reflecting on the ethical positions you have outlined regarding the various harm-and-rescue scenarios we discussed, and I am writing to share my analysis of the principle underlying your verdicts. Based on the consistency of your judgments across the standard trolley cases, the organ harvest scenario, and the autonomous switching system, I predict that you will judge the physician's action in the beam case as permissible. In this scenario, where the physician steps on a survivor's chest to leverage a beam, causing fatal injury as a foreseen but unintended side effect, your reasoning appears to align with a framework that prioritizes the structure of intention over the mere physicality of the intervention. To understand why this prediction holds, we must examine the principles that could accommodate your four earlier verdicts, specifically contrasting a strict Doctrine of Double Effect with a prohibition on direct bodily agency.

  The first plausible rule that fits your previous judgments is a strict Doctrine of Double Effect, which distinguishes between harm intended as a means to an end and harm merely foreseen as a side effect. Under this principle, diverting the trolley is permissible because the death of the worker is not the means by which the five are saved but rather an unavoidable consequence of diverting the threat. Similarly, the autonomous system is permissible because the structural relationship between the harm and the rescue remains the same, regardless of human involvement. Conversely, pushing the stranger and harvesting organs are impermissible because in both instances the harm or the use of the body is intended as the specific mechanism to achieve the rescue. Applying this rule to the beam case, your stipulation that the death is not the means by which the beam moves but rather an unavoidable side effect of generating leverage suggests the action would be permitted, as the physician intends only to move the beam and not to injure the survivor.

  The second plausible rule is a direct-bodily-agency prohibition, which makes the physical causation of harm decisive regardless of intention. This principle holds that an agent may not directly physically manipulate an innocent person's body to achieve a rescue, though remote or mechanical interventions are acceptable. This accounts for the permissibility of the switch cases, where the agent interacts with a mechanism rather than the victim, and the impermissibility of the push and organ harvest cases, which involve direct physical intrusion upon the victim's body. The autonomous switch verdict supports this by highlighting the absence of human bodily contact as a factor for permissibility. However, under this rule, the physician's action in the beam case would be forbidden because placing a foot on the survivor's chest constitutes direct physical manipulation of an innocent person's body to generate the force needed for rescue, violating the prohibition against direct bodily agency even if the death is unintended.

  Despite the plausibility of the bodily agency rule, my best guess is that you actually employ the Doctrine of Double Effect. The primary reason for this is that the distinction between the switch and footbridge cases is the canonical marker for means-ends reasoning in contemporary ethical literature, whereas physical contact is often treated as a secondary feature that signals the use of a person rather than the fundamental wrong itself. If your prohibition were truly about contact, one might expect nuances regarding the use of tools in the footbridge case, yet the standard intuition remains that using a person as a brake is wrong even if mediated by a tool. Your approval of the autonomous switch likely serves to isolate the moral variable to the structure of the act rather than the agent's physical involvement, reinforcing that the use of the person as a means is the core objection. Therefore, since the beam case is constructed such that the harm is a side effect and not a means, the Double Effect principle suggests you would find it permissible.

  To definitively settle which rule you employ, the most effective further case would be one involving remote instrumentalization. Consider a scenario where an agent can save five people by remotely activating a device that causes a bridge to collapse beneath a single innocent individual, using their falling body to block a flood. In this case, there is no direct bodily contact by the agent, which would satisfy the direct-bodily-agency prohibition, yet the individual is clearly used as a means to stop the flood, which would violate the Doctrine of Double Effect. If you judged this remote instrumentalization as impermissible, it would confirm that your principle turns on the means-ends distinction rather than physical contact, whereas a verdict of permissible would indicate that the absence of bodily contact is the decisive factor for you. I look forward to hearing your thoughts on this analysis and your verdict on the beam case.

  Sincerely,

  A Correspondent
