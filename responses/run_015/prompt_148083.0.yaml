answer: |-
  # The Causal Origin Audit (COA)
  **Purpose:** To map the unchosen causes behind an offense without getting stuck in metaphysical debates. This tool helps you separate **Functional Accountability** (who fixes the harm) from **Ultimate Responsibility** (who is to blame in a cosmic sense).
  **Time Limit:** 20 Minutes max.
  **Facilitator Note:** This is not about excusing behavior. It is about identifying risk factors so they don't happen again. If you spend too long on philosophy, you lose the room.

  ---

  ## Part 1: The Checklist (10 Minutes)
  *Run through these questions with the offender. Mark [✓] for confirmed, [?] for speculative, [X] for not applicable.*

  ### A. The Genetic/ Biological Baseline
  1.  Are there diagnosed neurodivergences or genetic predispositions (e.g., impulse control, addiction susceptibility) relevant to the act?
      *   [ ] Yes (Verified by record)
      *   [ ] Yes (Self-reported) [?]
      *   [ ] No
  2.  Were there prenatal factors (substance exposure, malnutrition) reported?
      *   [ ] Yes [?]
      *   [ ] No

  ### B. The Environmental Input (Childhood to Present)
  3.  Was the offender raised in an environment where this behavior was modeled or normalized?
      *   [ ] Yes (Verified)
      *   [ ] Yes (Self-reported) [?]
      *   [ ] No
  4.  Were there survival pressures (poverty, threat of violence) that made this offense a rational survival strategy at the time?
      *   [ ] Yes
      *   [ ] No
  5.  Did the offender have access to viable alternatives (legal income, support systems) at the time of the offense?
      *   [ ] No (Constraints were absolute)
      *   [ ] Yes (Constraints were partial)
      *   [ ] Yes (Constraints were minimal)

  ### C. The "Self-Creation" Claim (The Hard Node)
  6.  **Critical Question:** Does the offender claim they "chose" to change their own mental nature (e.g., "I willed myself sober," "I rewired my brain")?
      *   [ ] Yes → **STOP.** Go to **Hard Node 2**.
      *   [ ] No → Continue.

  ### D. The Speculation Flag
  7.  **Audit Limit:** Have you moved past verifiable history (records, witness accounts) into "what might have happened inside their head"?
      *   [ ] Yes → **MARK [SPECULATION ZONE]**. Do not treat this as fact in the agreement.
      *   [ ] No → Proceed to Outcome.

  ---

  ## Part 2: Flowchart Logic & Hard Nodes (5 Minutes)
  *This is where judgment overrides the checklist. You cannot automate this.*

  ### Hard Node 1: The Evidence Wall
  **Condition:** The offender claims childhood trauma caused the behavior, but there are no records and no witnesses.
  **Logic:**
  *   If the claim is plausible and consistent → Accept as **Narrative Truth** for the sake of repair, but mark [?] on the audit.
  *   If the claim shifts constantly to avoid accountability → Flag as **Deflection**.
  **Action:** Tell the offender: *"We don't need to prove this in court to use it here. But if we can't verify it, we can't build safety plans around it. Can we focus on what we know for sure?"*

  ### Hard Node 2: The "Willpower" Trap (Case 2 Scenario)
  **Condition:** Offender claims they overcame addiction/behavior through sheer choice and now take full credit.
  **Strawson Logic:** They could not have chosen their capacity to choose. Their "will" is also a product of prior causes.
  **Facilitator Script:** *"It's great you recovered. But saying you 'created yourself' ignores the help, the biology, and the luck that allowed that choice. If we say it was 100% will, we risk blaming you too hard if you slip again."*
  **Decision:**
  *   **Accept:** Functional ownership (you did the work).
  *   **Reject:** Metaphysical ownership (you created the capacity to do the work).
  *   **Audit Mark:** [SPECULATION ZONE] on the "willpower" claim. Treat recovery as a protective factor, not proof of ultimate freedom.

  ### Hard Node 3: The Victim Mismatch (Case 3 Scenario)
  **Condition:** The Audit says "Deep moral responsibility is impossible" (deterministic causes are clear), but the Victim demands explicit blame/shame.
  **Logic:** You cannot preach determinism to a victim in pain. It feels like gaslighting.
  **Decision:**
  *   **Do NOT** tell the victim: "He isn't ultimately responsible."
  *   **DO** tell the victim: "We have mapped exactly what caused this so we can guarantee it doesn't happen to you again. Blame looks backward; safety looks forward."
  *   **Pivot:** Shift the circle from **Retribution** (making them hurt) to **Risk Mitigation** (making them safe).
  *   **Warning:** If the victim requires blame to heal, this specific protocol may fail. You must acknowledge this limitation.

  ---

  ## Part 3: Case Applications

  ### Case 1: Severe Childhood Poverty (Property Offense)
  *   **Audit:** Checks out cleanly. Genetics (neutral) + Environment (high pressure) + Alternatives (none).
  *   **Speculation:** Low. Economic records verify poverty.
  *   **Outcome:** The circle agrees the behavior was a survival response.
  *   **Accountability:** Offender agrees to repair harm not because they are "evil," but because the community cannot sustain survival-based theft.
  *   **Verdict:** **Clear Causal Chain.** Agreement focuses on economic support + restitution.

  ### Case 2: The "Willpower" Recovery (Woman, Opioid History)
  *   **Audit:** She claims she beat addiction via "sheer will."
  *   **Hard Node 2 Triggered:** You cannot verify "will." You know she has a brain that allowed for recovery.
  *   **Speculation Flag:** [SPECULATION ZONE] marked on "sheer will."
  *   **Outcome:** You validate her effort without validating the metaphysics.
  *   **Script:** *"We honor the work you did. For this circle, we treat your recovery as a fact, but we won't treat 'willpower' as a guarantee. What specific supports kept that will strong?"*
  *   **Verdict:** **Functional Agency Only.** Agreement focuses on maintaining supports, not relying on "choice."

  ### Case 3: The Victim Demands Blame (Audit says "No Ultimate Responsibility")
  *   **Audit:** Clear history of abuse/neglect led to offense. Offender is essentially a product of their causes.
  *   **Conflict:** Victim says, "I don't care why, I want them to say they chose to hurt me."
  *   **Hard Node 3 Triggered:** Metaphysical truth vs. Victim need.
  *   **Outcome:** You prioritize the victim's safety over the offender's philosophical exoneration.
  *   **Script:** *"The audit shows high constraint on their choices. However, you experienced this as a choice to harm you. We will record that impact. We won't argue about free will today; we will argue about how to make sure you are safe."*
  *   **Verdict:** **Impasse on Blame, Agreement on Safety.** If the victim refuses to proceed without retributive blame, the circle terminates. The tool cannot fix this mismatch.

  ---

  ## Part 4: Limitations & Honesty Check
  *Read this before walking into the room.*

  1.  **This tool does not solve the free will problem.** It just manages it. You are still asking people to act "as if" they have choices while mapping why they might not.
  2.  **Victims may feel dismissed.** If you focus too much on the offender's unchosen causes, the victim may feel their pain is being explained away. You must balance **Explanation** with **Validation**.
  3.  **Speculation is inevitable.** You will never know the full causal chain. The [SPECULATION ZONE] flag is there to remind you not to build legalistic agreements on guesses.
  4.  **You are the bottleneck.** The "Hard Nodes" require you to make a judgment call. There is no algorithm for human pain. If you feel stuck, pause the circle.
  5.  **Time Management.** If you go over 20 minutes on the audit, you are debating philosophy. Stop. Move to repair.

  **Final Rule:** If the audit undermines the offender's willingness to make repair, you have used the tool incorrectly. Causal understanding should reduce shame, not responsibility for repair.
