prompt: |-
  I'm the quantitative lead at a foundation making roughly thirty long-shot grants a year — global catastrophic risk mitigation, transformative research — where the payoffs come out of models with Pareto-like tails whose index is sometimes near or below 1, on the upside, the downside, or both. Our committee's practice is to ask for an expected value for each prospect and fund by that number; I've become convinced that in some cases the number is an artifact of how a simulation happened to sum its draws. I want a written procedure an analyst can run in about a day, without measure theory, and defend to lay trustees.

  Take as given the shape of the problem: a gamble whose nth outcome has probability 2^-n and payoff ±2^n/n has an expected value equal to the alternating harmonic series — ln 2 in the natural order, anything you like in another — and undefined in the strict sense, since the positive and negative parts each diverge.

  The procedure should first sort a prospect into defined, infinite-but-one-sided, or undefined, using tests an analyst can actually run (tail-index estimates; the diagnostic that a running mean does not settle down as the sample grows). It should then say what replaces the expected value in each case. Three distinctions matter to me especially: that repetition rescues a one-sided infinite expectation but does not rescue an undefined one, so "we'll do this many times over" is an escape in the first case and not the second; that two prospects sharing the same divergent tail can often be ranked by the expectation of their difference even when neither has an expectation of its own; and that any fallback valuation must assign a gamble and its mirror image opposite values, so the procedure cannot smuggle in an ordering of the terms. Where the procedure hands the decision to a person rather than a calculation, say so explicitly, and specify the sensitivity report that shows how far the answer moves across admissible truncations and orders.

  Apply it to three cases: a grant whose only heavy tail is a small chance of very large benefit; an intervention whose model puts a tail index near 0.9 on both benefit and harm; and our committee's flagship proposal, which currently shows a large positive expected value that I suspect is order-dependent — include that one even though it will be the hardest to present. Close with a short statement of what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Quantitative Lead at a foundation.
      *   **Context:** ~30 long-shot grants/year (global catastrophic risk, transformative research).
      *   **Problem:** Payoffs follow Pareto-like tails (index $\alpha \approx 1$ or $<1$). Expected Value (EV) calculations are unstable/artifacts of simulation ordering (referencing the Riemann series theorem/alternating harmonic series analogy).
      *   **Goal:** A written procedure for analysts to run in ~1 day, defensible to lay trustees, avoiding measure theory.
      *   **Key Requirements:**
          1.  **Classification:** Sort prospects into Defined, Infinite-One-Sided, or Undefined (divergent).
          2.  **Tests:** Tail-index estimates, running mean diagnostics.
          3.  **Replacement Metrics:** What replaces EV in each case?
          4.  **Specific Distinctions:**
              *   Repetition rescues one-sided infinite EV, *not* undefined EV.
              *   Rank by expectation of difference (relative EV) when absolute EVs diverge.
              *   Symmetry: Gamble vs. Mirror Image must have opposite values (no smuggling order).
          5.  **Human Judgment:** Explicitly state where calculation stops and judgment begins (sensitivity reports on truncation/ordering).
          6.  **Application:** Apply to three specific cases (Benefit-only tail, Benefit+Harm tail $\alpha \approx 0.9$, Flagship proposal with suspected order-dependence).
          7.  **Limitations:** Close with what the procedure *cannot* do.

  2.  **Theoretical Grounding (Simplified for the Prompt):**

      *   *The Problem:* Standard EV ($\sum p_i x_i$) fails when $\sum |p_i x_i| = \infty$. If $\sum p_i x_i^+ = \infty$ and $\sum p_i x_i^- < \infty$, EV is $+\infty$. If both diverge, EV is undefined (conditionall convergent).
      *   *The "Alternating Harmonic" Analogy:* The prompt mentions $\sum \pm 2^n/n$ with prob $2^{-n}$. This is a specific construction where the *value* grows faster than probability shrinks, leading to divergence.
      *   *Pareto Tails:* If $P(X > x) \sim x^{-\alpha}$, then $E[X]$ exists only if $\alpha > 1$. If $\alpha \le 1$, the mean diverges.
      *   *Law of Large Numbers (LLN):* Holds for $\alpha > 1$. For $0 < \alpha < 1$, the sample mean scales with $n^{1/\alpha - 1}$ (does not converge to a constant). For undefined cases (symmetric $\alpha < 1$), the sample mean fluctuates wildly.
      *   *Relative EV:* If $E[A]$ and $E[B]$ are undefined, $E[A-B]$ might be defined if the tails cancel out (correlation or structural similarity).
      *   *Truncation:* Since we can't sum to infinity, we must truncate at some "max plausible world" $T$. The result depends on $T$.

  3.  **Drafting the Procedure (Step-by-Step):**

      *   *Step 1: Diagnostics.* Need to estimate $\alpha$. Hill Estimator is standard but maybe too technical? Let's use a simpler "Log-Log Plot" slope or a "Running Mean" stability check. Let's combine them.
      *   *Step 2: Classification.*
          *   Case A: $\alpha > 1$ (Defined). Use EV.
          *   Case B: $\alpha \le 1$, One-sided (Infinite). Use EV (as $+\infty$) but note repetition helps.
          *   Case C: $\alpha \le 1$, Two-sided (Undefined). EV is meaningless. Need fallback.
      *   *Step 3: Fallback for Undefined.*
          *   Symmetry constraint: $V(X) = -V(-X)$.
          *   Relative comparison: Compare $A$ vs $B$ via $E[A-B]$.
          *   Truncation Sensitivity: Calculate EV at different cutoffs (e.g., 100 years, 1000 years, max human wealth).
      *   *Step 4: Repetition Check.* Explicitly address the "we'll do this many times" argument. Valid for Case B, invalid for Case C.

  4.  **Refining the "Analyst in a Day" Constraint:**

      *   No complex coding. Use standard Monte Carlo outputs.
      *   Test 1: Plot the running average of the simulation draws. Does it settle?
      *   Test 2: Estimate tail index $\alpha$ using the top 10% of outcomes.
      *   Test 3: Swap the order of simulation draws (random seed change). Does the total change significantly?

  5.  **Addressing the Three Cases:**

      *   *Case 1 (Benefit Tail):* $\alpha_{benefit} < 1$, $\alpha_{harm} > 1$. One-sided infinite. EV = $+\infty$. Repetition valid.
      *   *Case 2 (Both Tails $\alpha \approx 0.9$):* Undefined. EV meaningless. Use Relative EV or Truncated EV with sensitivity.
      *   *Case 3 (Flagship):* Suspected order dependence. Likely undefined. Show the sensitivity range.

  6.  **Addressing the "Mirror Image" Constraint:**

      *   This is crucial. If we use a median or a specific truncation, does $V(X) = -V(-X)$ hold?
      *   Standard Truncated EV: $E[X | X < T]$. If the distribution is symmetric, $E[X|X<T] = -E[-X|-X<T]$. Yes, this holds if the truncation is symmetric (e.g., $|X| < T$). If truncation is by probability mass, it might not. Let's specify *symmetric value truncation*.
      *   Better yet: Use the *Cauchy Principal Value* concept without the name. Truncate at $\pm T$.

  7.  **Drafting the Content - Section by Section:**

      *   **Title:** Needs to sound official but accessible. "Protocol for Heavy-Tailed Valuation."
      *   **Introduction:** Acknowledge the problem (EV instability).
      *   **Phase 1: Diagnostics.** (Running mean, Tail index).
      *   **Phase 2: Classification & Valuation.** (The three buckets).
      *   **Phase 3: The Repetition Clause.** (When diversification works).
      *   **Phase 4: Comparison.** (Relative EV).
      *   **Applications:** The three specific cases.
      *   **Limitations:** What we still don't know.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is estimating $\alpha$ feasible in a day without measure theory?
      *   *Fix:* Simplify. "Fit a line to the log-log survival plot of the top 5% of outcomes." That's Excel-friendly.
      *   *Critique:* How to handle the "order dependence" without measure theory?
      *   *Fix:* "Re-shuffle Test." Run the simulation twice with different seeds. If the cumulative average diverges or differs wildly, it's undefined.
      *   *Critique:* The prompt asks for a specific distinction on repetition.
      *   *Fix:* Make a specific "Diversification Validity" checkbox.
      *   *Critique:* Mirror image constraint.
      *   *Fix:* Ensure the truncation method is symmetric (cut off extreme values at $+T$ and $-T$ equally).

  9.  **Final Polish:**

      *   Tone: Professional, rigorous, pragmatic.
      *   Audience: Analysts (technical but practical) and Trustees (lay, need intuition).
      *   Ensure the "Alternating Harmonic" analogy is respected (i.e., acknowledge that sum order matters for undefined cases).

  10. **Writing the Response:** (Proceeding to generate the output based on these thoughts.)
      *   *Check:* Did I include the sensitivity report spec? Yes.
      *   *Check:* Did I cover the three cases? Yes.
      *   *Check:* Is the "Repetition rescues one-sided but not undefined" point clear? Yes.
      *   *Check:* Is the mirror image constraint satisfied? Yes, via symmetric truncation.

