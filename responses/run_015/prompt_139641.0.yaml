answer: |-
  **MEMORANDUM**

  **TO:** Investment and Grants Committee
  **FROM:** Quantitative Lead
  **SUBJECT:** Protocol for Valuation of Heavy-Tailed Prospects (VHT-1)
  **DATE:** October 26, 2023

  ### 1. Purpose and Scope
  Standard Expected Value (EV) analysis assumes that the average payoff stabilizes as we consider more possibilities. In global risk and transformative research, payoff distributions often have "heavy tails" (extreme outcomes are more common than a normal distribution predicts). When the tail is heavy enough, the mathematical sum defining EV may not converge to a single number; it may depend on the order in which we sum the possibilities.

  This protocol provides analysts with a one-day diagnostic procedure to classify prospects and assign a defensible valuation metric. It avoids advanced measure theory in favor of simulation diagnostics and sensitivity reporting.

  ### 2. Phase I: Diagnostic Tests (Analyst Execution)
  *Time allocation: 4 hours. Requires access to the Monte Carlo simulation code.*

  Run the prospect simulation with $N = 100,000$ draws. Perform the following three tests on the output.

  **Test A: The Running Mean Stability Check**
  1.  Plot the cumulative average of the simulation draws against the number of draws ($n=1$ to $N$).
  2.  **Pass:** The line flattens out as $n$ increases.
  3.  **Fail:** The line exhibits large jumps late in the simulation or trends upward/downward without settling.
  4.  **Re-shuffle:** Change the random seed and re-run. If the final cumulative average changes by more than 20%, mark as **Order-Sensitive**.

  **Test B: The Tail Index Estimate ($\alpha$)**
  1.  Isolate the top 5% of positive outcomes and the bottom 5% of negative outcomes.
  2.  Plot these on a Log-Log scale (Log Rank vs. Log Value).
  3.  Fit a straight line to the top 1% of the tail. The slope is $-\alpha$.
  4.  **Record:** $\alpha_{up}$ (upside tail) and $\alpha_{down}$ (downside tail).
      *   If $\alpha > 1$, the mean for that side is mathematically defined.
      *   If $\alpha \le 1$, the mean for that side diverges (infinite).

  **Test C: The Symmetry Check**
  1.  Compare the magnitude of the top 1% of gains vs. the top 1% of losses.
  2.  If both sides have $\alpha \le 1$, the prospect is potentially **Undefined** (like the alternating harmonic series).

  ### 3. Phase II: Classification and Valuation Rules
  Based on Phase I, sort the prospect into one of three buckets. Apply the corresponding valuation rule.

  #### Bucket 1: Defined Expectation
  *   **Criteria:** Test A Passes; $\alpha_{up} > 1$ and $\alpha_{down} > 1$.
  *   **Valuation:** Report standard Expected Value.
  *   **Trustee Note:** "Standard risk-reward math applies. The average converges."

  #### Bucket 2: One-Sided Infinite
  *   **Criteria:** $\alpha \le 1$ on one side (e.g., upside), but $\alpha > 1$ on the other. Test A may fail (mean grows slowly), but Test B shows divergence on only one side.
  *   **Valuation:** Report as **$+\infty$** (or $-\infty$). Do not report a finite number.
  *   **Repetition Clause:** **Valid.** If we make this grant $k$ times, the total value scales with $k$. The Law of Large Numbers for heavy tails implies the sum is dominated by the single largest outcome, but the sign is consistent.
  *   **Trustee Note:** "The upside is mathematically unbounded relative to the probability. We cannot put a price on it, but we know it is positive."

  #### Bucket 3: Undefined (Divergent)
  *   **Criteria:** $\alpha \le 1$ on **both** sides. Test A Fails. Test A Re-shuffle shows high sensitivity.
  *   **Valuation:** **EV is Void.** Do not report a single EV number.
  *   **Replacement Metric:** **Symmetric Truncated Value (STV).**
      1.  Choose a truncation cap $T$ (e.g., "100x Global GDP" or "Max Plausible Human Welfare").
      2.  Calculate $E[X]$ where any outcome $> T$ is set to $T$, and any outcome $< -T$ is set to $-T$.
      3.  **Mirror Constraint:** This method ensures that if Prospect $A$ is the mirror image of $B$ (payoffs flipped), $STV(A) = -STV(B)$. It does not smuggle in an ordering bias.
  *   **Repetition Clause:** **Invalid.** "We will do this many times" is **not** a defense. In undefined cases, averaging over many trials does not converge to a stable value. The aggregate risk remains undefined.
  *   **Trustee Note:** "The model contains extreme hopes and extreme fears that cancel each other out unpredictably. The value depends on where we draw the line on 'impossible' outcomes."

  ### 4. Phase III: Comparison and Decision
  When comparing two prospects (A and B) that both fall into Bucket 3 (Undefined):

  1.  **Relative Valuation:** Do not compare $STV(A)$ vs $STV(B)$ directly. Instead, simulate the **difference** $(A - B)$.
  2.  **Run Diagnostics on Difference:** Often, the heavy tails cancel out in the difference (e.g., both rely on the same macro-future). If $(A-B)$ falls into Bucket 1 or 2, rank by that metric.
  3.  **Human Judgment Trigger:** If $(A-B)$ is also Undefined, calculation stops. The decision is handed to the Committee.
  4.  **Required Sensitivity Report:** For any Bucket 3 prospect, the analyst must attach a table showing the STV at three truncation levels:
      *   $T_1$: Conservative (e.g., 10x current annual revenue).
      *   $T_2$: Moderate (e.g., 100x).
      *   $T_3$: Aggressive (e.g., Total remaining human economic output).
      *   *Decision Rule:* If the sign of the STV flips between $T_1$ and $T_3$, the prospect is **Unrankable** by model.

  ### 5. Application to Current Pipeline

  **Case 1: The "Moonshot" Grant (Benefit Tail Only)**
  *   **Diagnostics:** $\alpha_{up} = 0.8$ (Heavy upside); $\alpha_{down} = 2.5$ (Limited downside).
  *   **Classification:** Bucket 2 (One-Sided Infinite).
  *   **Valuation:** $+\infty$.
  *   **Repetition:** Valid. We should fund this as often as budget allows, provided the cost is finite.
  *   **Recommendation:** Fund. The instability is only on the upside; we capture the win without risking ruin.

  **Case 2: The "Dual-Risk" Intervention (Benefit + Harm Tail)**
  *   **Diagnostics:** $\alpha_{up} = 0.9$; $\alpha_{down} = 0.9$. Running mean oscillates wildly.
  *   **Classification:** Bucket 3 (Undefined).
  *   **Valuation:** EV Void. Use STV.
  *   **Sensitivity:**
      *   $T_1$ (Conservative): STV = -$5M (Harms dominate near field).
      *   $T_3$ (Aggressive): STV = +$2B (Upside dominates far tail).
  *   **Repetition:** Invalid. Doing this 100 times does not stabilize the outcome; it compounds the undefined nature.
  *   **Recommendation:** Hand to Committee. The model cannot resolve the trade-off between probable near-term harm and improbable long-term salvation. The decision is ethical, not mathematical.

  **Case 3: The Flagship Proposal (Suspected Order-Dependence)**
  *   **Diagnostics:** Current model shows EV = +$500M. However, Test A (Re-shuffle) shows results ranging from -$100M to +$2B depending on seed. $\alpha \approx 1.0$ on both sides.
  *   **Classification:** Bucket 3 (Undefined). The current +$500M is an artifact of the simulation's random number generator ordering (the "alternating harmonic" effect).
  *   **Valuation:** EV Void.
  *   **Relative Check:** Compared to "Status Quo," the difference $(Flagship - Status)$ is also Undefined.
  *   **Sensitivity Report:**
      *   Truncation at 100 years value: +$10M.
      *   Truncation at 10,000 years value: +$800M.
      *   Truncation at "Heat Death of Universe": -$50M (Entropy costs dominate).
  *   **Recommendation:** **Reject for Funding based on Model.** The valuation is too sensitive to truncation assumptions. We cannot defend a $500M value to trustees when a plausible change in the "max plausible world" assumption flips the sign. This requires a qualitative strategic pivot, not a grant approval.

  ### 6. Limitations of This Procedure
  This protocol does not solve the underlying mathematical indeterminacy; it manages the reporting of it. Specifically:
  1.  **It does not identify the "True" Truncation:** The choice of $T$ (where we cut off the tail) remains a philosophical judgment, not a calculation.
  2.  **It cannot rank two Undefined prospects:** If $A$ and $B$ are both Bucket 3, and $(A-B)$ is Bucket 3, the model is silent.
  3.  **It assumes stationarity:** It assumes the tail index $\alpha$ is constant. If $\alpha$ changes over time (e.g., technology reduces risk), the diagnostic may underestimate future stability.

  **Action Item:** Analysts to re-run the current pipeline using VHT-1 by Friday. Flag all Bucket 3 prospects for Committee review.
