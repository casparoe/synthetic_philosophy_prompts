      *   Virtue/Vice? Yes.

  8.  **Final Polish:** Ensure the distinction between "semantic alignment" (knowing what is Good) and "functional safety" (knowing what is Bad/Dead) is sharp, as this is the crux of the "circularity" claim. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to be careful not to just say "this is wrong." I need to say "Here is what would prove it wrong." The user asked for a map of exposure, not just a rebuttal. I must structure it as "Conditions for Falsification."

  *(Refining "Ontological Containment")*: This term is the user's invention. I need to treat it charitably but probe its boundaries. If it means "limiting the ontology," does that mean limiting the vocabulary? The sensor input? The internal state dimension? I need to point out that if it's not formally defined, it's unfalsifiable.

  *(Refining "Circularity")*: The user argues defining "worst-case" requires "alignment." I need to point out that defining "catastrophe" (e.g., human extinction) might not require full moral alignment, just a physical definition. This breaks the circularity claim.

  *(Final Plan)*:
