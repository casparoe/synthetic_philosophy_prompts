  **BUREAU OF CONSTITUTIONAL MATCHING**
  **FORM LCP-99: LIBERTY COMPATIBILITY PACKET**
  **CLASSIFICATION: MANDATORY INTAKE**

  **Welcome, Citizen.**
  To ensure optimal civic alignment, you must select one (1) Liberty Package. Failure to select results in default assignment to Package N. Please review the doctrinal specifications and submit your Arbitrariness Audit alongside this form.

  **SECTION 1: LIBERTY PACKAGES**

  **Package N (Non-Interference Protocol):**
  The State guarantees no direct obstruction of your actions. You are free to act unless you harm another. Note: The State assumes no responsibility for power asymmetries, economic coercion, or inability to act due to lack of resources. You are free to starve, provided no law forbids eating.

  **Package P (Capacity Actualization Protocol):**
  The State facilitates your rational self-mastery. Officials may intervene to ensure you achieve your "true" potential. Resources are allocated based on State assessment of your needs. Note: Refusal of State-defined capacity-building measures may be interpreted as irrationality, warranting corrective intervention.

  **Package R (Non-Domination Assurance):**
  The State guarantees freedom from arbitrary power. You must be able to look any official in the eye without fear of uncontrolled interference. Note: This requires constant institutional vigilance. Benevolent masters are still masters. If an official *could* interfere arbitrarily, you are unfree, even if they *do not*.

  **SECTION 2: THE ARBITRARINESS AUDIT**

  Citizens must rate their current status on three metrics:
  1.  **Coersion Index:** Are you physically stopped? (Package N)
  2.  **Mastery Index:** Are you enabled to fulfill purpose? (Package P)
  3.  **Eyeball Test:** Can you face authority without fear of whim? (Package R)

  **SECTION 3: CASE STUDY REFERENCE (APPLICANT 7-G)**

  To clarify Package R eligibility, review the disqualification of Applicant 7-G.

  **Status:** Applicant 7-G wished to study art.
  **Package N Assessment:** Passed. No law prohibited painting. No physical coercion applied.
  **Package P Assessment:** Passed. State granted funds for art supplies. Capacity increased.
  **Package R Assessment:** **FAILED.**

  **Reason for Failure:**
  While Applicant 7-G received the grant, the allocating Official possessed discretionary authority. The Official *could* have arbitrarily denied the grant or assigned Applicant 7-G to a useless waste-management course instead. Although the Official acted benevolently, the structural capacity for arbitrary interference remained. Applicant 7-G exists at the mercy of the Official's mood. Therefore, Applicant 7-G is dominated. The grant is voided until the Official's discretion is removed by rigid statute.

  **SECTION 4: COMPLIANCE WARNING**

  Selecting Package N offers comfort but ignores structural power. Selecting Package P offers resources but invites paternalism. Selecting Package R offers dignity but requires exhausting vigilance over every administrative rule to ensure no discretionary power exists anywhere.

  The Bureau reminds citizens that under Package R, a benevolent dictator is indistinguishable from a free state until the dictator sneezes. Please initial below to acknowledge that your freedom depends on the absence of another's whim, not merely the absence of chains.

  **Citizen Signature:** ___________________
  **Date:** ___________________

  **FOR OFFICIAL USE ONLY**
  **Audit Status:** [ ] Pending [ ] Dominated [ ] Interfered [ ] Empowered
  **Bureau Stamp:** [CONSTITUTIONAL MATCHING AUTHORIZED]
