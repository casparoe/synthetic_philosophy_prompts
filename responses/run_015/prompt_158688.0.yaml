  ### The Scenario: The Compliance Interlock

  You are a logistics manager for a shipping firm. You have a crate to ship. Your profit is **$10** if it ships, **$0** if it doesn't. There is a **10%** chance the crate contains "Class-H Hazardous Material" (Fragile State). If you ship a Class-H crate and it breaks, the regulatory fine is **$4**. If you ship a normal crate, no fine.

  **The Rule:** Safety protocols dictate that if you *know* a crate is Class-H, the shipping manifest system **physically locks** and prevents you from generating a label. You cannot ship it. If you do *not* know (i.e., you haven't tested), the system assumes standard risk and allows shipping. If it breaks, you pay the fine, but it's considered an "unforeseeable accident."

  **The Information:** You have access to a free, instant, perfectly accurate scanner that tells you if the crate is Class-H. Using it is optional.

  **The Payoffs:**
  *   **Ship Normal:** +$10.
  *   **Ship Class-H:** +$10 (fee) - $4 (fine) = +$6.
  *   **Don't Ship:** $0.

  ---

  ### 1. The Broken Premise

  Good's Theorem assumes that the **feasible action set $A$ is independent of the information received**. Formally, it assumes the agent solves $\max_{a \in A} \mathbb{E}[U(a, \omega) | s]$.

  In this case, the action set is a function of the signal: $A_s$.
  *   If $s = \text{Normal}$, $A_s = \{\text{Ship}, \text{Don't}\}$.
  *   If $s = \text{Class-H}$, $A_s = \{\text{Don't}\}$. (The "Ship" action is physically foreclosed).

  Because the information structure *constrains the action space* rather than just updating beliefs over a fixed action space, the monotonicity guarantee of Good's Theorem ($\mathbb{E}[\max] \ge \max \mathbb{E}$) no longer holds. The "max" inside the expectation is taken over a smaller set in the bad state.

  ### 2. The Arithmetic

  **Strategy 1: Ignorance (Do not scan)**
  You do not scan. The system does not lock. You Ship.
  *   90% (Normal): Profit +$10.
  *   10% (Class-H): Profit +$6.
  *   **EU(Ignorance)** = $0.9(10) + 0.1(6) = 9 + 0.6 = \mathbf{9.6}$.

  **Strategy 2: Information (Scan)**
  You scan. The system updates and potentially locks.
  *   90% (Signal: Normal): Action Set = {Ship, Don't}. You Ship. Profit +$10.
  *   10% (Signal: Class-H): Action Set = {Don't}. You are forced to Don't Ship. Profit $0.
  *   **EU(Info)** = $0.9(10) + 0.1(0) = 9 + 0 = \mathbf{9.0}$.

  **Value of Information:** $9.0 - 9.6 = \mathbf{-0.6}$.
  Strictly negative. The agent is rational, the info is free and accurate, yet it destroys expected value.

  ### 3. The Commitment Objection

  *Objection:* "Why doesn't the agent just commit at $T_0$ to ignore the scanner's output if it says Class-H?"

  *Response:* In this structural setup, they **cannot**. The interlock is not a suggestion; it is a physical constraint triggered by the *possession* of the data in the system. Once the scanner runs, the manifest server receives the flag and disables the "Print Label" button. The agent cannot "choose" to ignore it because the choice is removed from the menu.

  *Value of Commitment:* The agent would pay up to **$0.60** for the ability to run the scanner *without* the interlock engaging (i.e., the ability to commit to ignoring the result). This distinction highlights that the negative value isn't in the *belief update*, but in the **loss of agency** coupled with that update. The "blind" agent has more power than the "informed" agent because the blind agent retains access to the high-risk/high-reward action that the informed agent is structurally barred from.

  ### 4. Ablation

  *Feature to Remove:* The **Action-Constraint** (the interlock).

  *Modified Scenario:* Keep all payoffs and probabilities identical, but remove the rule that locks the system. If you know it's Class-H, you are *allowed* to ship it (perhaps you just pay the fine knowingly).

  *New Arithmetic (Info):*
  *   90% (Normal): Ship -> +$10.
  *   10% (Class-H): Ship -> +$6. (You choose to ship because $6 > $0).
  *   **EU(Info)** = $0.9(10) + 0.1(6) = \mathbf{9.6}$.

  *Result:* EU(Info) = EU(Ignorance). The value of information flips from negative to neutral (it would be positive if the fine were larger than the fee, making "Don't Ship" optimal in the Class-H case). This confirms that the negativity was generated entirely by the information-dependent action set, not by the probabilities or utilities themselves.

  ### 5. Steelman: The Purist's Defense

  *Argument:* "This is not a counterexample to Good's Theorem; it's a misapplication. Good's Theorem applies to decision problems where the consequence function $C(a, \omega)$ is fixed. In your case, the consequence of 'Shipping' depends on whether the agent *knows* $\omega$. You have effectively changed the utility function to $U(a, \omega, \text{knowledge})$. If you properly model 'Knowledge' as part of the world state $\omega'$, then the theorem holds."

  *Rebuttal:* They are technically correct about the formalism but miss the practical content. In real-world decision theory (and law/engineering), **epistemic state is often a physical constraint**. A "world state" that includes "Agent knows X" is not a standard state variable; it is a property of the agent's relation to the world.
  Good's Theorem is cited as "More Information is Better." This case proves that **More Information is Better *only if* it doesn't restrict your available moves.** Since many real-world constraints (laws, safety interlocks, fiduciary duties) are triggered specifically by knowledge, the "received wisdom" is dangerous. The theorem holds for *Cartesian* agents in a fixed world; it fails for *embedded* agents whose action spaces are functions of their internal state. The purist is right about the math, but wrong about the moral.
