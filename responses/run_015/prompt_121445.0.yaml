answer: |-
  You are right to be suspicious. The phrase is often used as a conversation-stopper, but logically it is either a trivial truth or a begged question. The exact wording is popularised by Carl Sagan, but the argument is David Hume's (from *An Enquiry Concerning Human Understanding*, 1748). Laplace also formalised the probability aspect.

  Here are the three precise readings of the claim, analysed for validity.

  ### 1. The Bayesian Reading (Probability)
  *   **Claim:** "Extraordinary" means **statistically improbable** (low prior probability). "Extraordinary evidence" means **data highly unlikely on any other hypothesis** (high likelihood ratio).
  *   **Analysis:** This is just Bayes' Theorem. If a claim is unlikely *a priori*, you need strong data to shift the probability.
  *   **Verdict:** **Platitude.** It is mathematically true. However, it does not rule out miracles; it merely sets a high bar. A lottery win is improbable but happens; evidence can meet this bar. This reading cannot end the argument, only frame it.

  ### 2. The Humean Reading (Natural Law)
  *   **Claim:** "Extraordinary" means **a violation of uniform experience** (a law of nature). "Extraordinary evidence" means **testimony so strong that its falsehood would be more miraculous than the event** (Hume's actual maxim).
  *   **Analysis:** This distinguishes miracles from lottery wins. A lottery win fits within natural laws; a resurrection does not. The evidence must outweigh the entire established order of nature.
  *   **Verdict:** **Defensible.** This is a serious philosophical position. It invites debate about what counts as a "law" and whether testimony can ever outweigh uniform experience. It does not settle the matter *a priori*; you must weigh the specific evidence.

  ### 3. The Stipulative Reading (Impossibility)
  *   **Claim:** "Extraordinary" means **impossible by definition**. "Extraordinary evidence" means **evidence that cannot exist** within our current framework.
  *   **Analysis:** This assumes naturalism is true before looking at the evidence. If miracles are impossible, no evidence could ever be "strong enough" because the claim is ruled out metaphysically.
  *   **Verdict:** **False (Circular).** This begs the question. It assumes the conclusion (miracles don't happen) to dismiss the evidence for them.

  ### What your classmate is doing
  To use the phrase to **kill** the discussion, your classmate needs **Reading 3**.

  If they were using Reading 1 (Bayes), they would have to admit that *if* the evidence were strong enough, belief would be rational. The discussion would continue regarding whether the Resurrection evidence *meets* that bar.

  If they were using Reading 2 (Hume), they would have to engage with whether the testimony of the disciples is outweighed by uniform experience. This is also a debate, not a shutdown.

  By treating the phrase as a final verdict, they are silently assuming **Reading 3**. They are defining "extraordinary claim" as "something we cannot accept regardless of evidence." This quietly builds the conclusion (that miracles are unjustified) into the premise (that the evidence required is unobtainable).

  **Summary:** Your intuition is correct. As a principle of probability (Reading 1), it is obvious but neutral. As a tool to dismiss miracles without examination (Reading 3), it is circular. Your classmate is treating a methodological caution as a metaphysical veto.
