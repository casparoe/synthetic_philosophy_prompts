  ### The four senses

  Leisure-as-exemption is the negative liberty from compulsory labor. Leisure-as-capacity is the material and physical ability to rest, requiring income and energy. Leisure-as-synchrony treats free time as a collective good, dependent on others' simultaneous availability. Leisure-as-license is the autonomy to use time without surveillance or moral conditioning. These categories move beyond mere hours off; they distinguish between having time, having usable time, having shared time, and having sovereign time. A robust right to leisure requires all four. Without exemption, you are enslaved; without capacity, you are exhausted; without synchrony, you are isolated; without license, you are disciplined. This framework ultimately exposes gaps where statutory rights fail to deliver lived freedom.

  ### Who had what in January 1914

  Ford granted exemption formally (eight hours) and capacity materially (five dollars), but retained license through the Sociological Department. Workers actually gained exemption from nine-hour days and capacity via higher wages, reducing turnover. However, license was revoked; leisure was conditional on sobriety and thrift, monitored by investigators visiting homes. Synchrony was engineered by Ford via shift work and standardized weekends, creating a collective rhythm without statutory mandate. This allowed workers to meet friends, but only on Ford's own schedule. The factory ran continuously. The worker's wife absorbed the domestic labor enabling his capacity, yet she remained invisible to the policy, her time unsynchronized with his. Her rest was sacrificed to ensure his secure recovery, making his capacity dependent on her unfree time. She possessed no exemption from household labor, nor capacity for rest, nor license to spend time freely. Her leisure was non-existent. Investigators held the power to void the right, turning leisure into a privilege contingent on moral performance. They acted as private police, enforcing bourgeois norms within the working-class home. Ford held the sovereign power to grant or rescind the package unilaterally. He functioned as a legislature and judiciary combined, defining the terms of leisure. The absence of a union meant no counter-power to negotiate license or synchrony; the right existed only at Ford's pleasure. Without collective bargaining, individual workers could not contest the investigators' findings. Thousands lined up in the cold, demonstrating demand for capacity despite lost license. Thus, workers had exemption and capacity, but only a surveilled license and a manufactured synchrony. The wife had neither exemption nor capacity, only increased domestic burden to support his rest. She was the hidden substrate of the five-dollar day, ensuring the worker returned refreshed while she remained on call. The state was absent, leaving the corporation to define final rights.

  ### What each frame catches and what it misses

  The Weberian frame catches the moral conditioning of the five-dollar day; work is a calling, and leisure is a reward for virtue. It misses how this moralism invades the home, conflating economic rights with personal conduct. The statutory-hours frame catches the reduction from nine to eight hours and the creation of synchrony. It misses that without purely legal enforcement, these hours are revocable gifts rather than claims enforceable against the employer. The karoshi frame catches the intensity of the work remaining within those eight hours and the pressure to conform. It misses that the exhaustion here was not just physical but social, stemming from surveillance rather than just overtime. All three frames misdescribe the gendered division of labor. They assume the claimant is a autonomous individual, ignoring the wife whose unpaid labor subsidizes the worker's capacity. They also assume the right resides in law or culture, not in unilateral corporate fiat. The Ford case reveals that statutory-like benefits can exist without statutes, but they lack the stability of rights. The frames fail to account for the private sovereignty of the employer acting as a state-like authority over time and morality.

  ### What the case does to the theory

  The evidence compels the conclusion: a privilege revocable at will is not a right. The Ford case clearly demonstrates that material benefits without institutional guarantees produce dependency, not liberty. This challenges the statutory frame, which assumes legal codification is the primary barrier to leisure. Here, the barrier was private power. Furthermore, the case indicts the gendered assumptions underlying all three frames. The worker's capacity relied on the wife's unpaid labor, yet theory treats the household as a black box. If leisure requires domestic absorption, the right is inherently unequal. The Weberian frame justifies this inequality as moral order; the statutory frame ignores it as private sphere; the karoshi frame overlooks it as non-market labor. The Ford episode suggests that a right to leisure must include a right to domestic support or shared domestic burden. Without addressing who cooks and cares, capacity remains illusory for half the population. The theory must shift from individual claimants to household units. If the employer monitors the home, the public-private distinction collapses. Therefore, the right to leisure is not just against the employer but against the intrusion of market discipline into domestic life.

  ### Where I should stop

  Stop before you try to solve the domestic labor problem fully; that is a separate dissertation entirely. Use Ford to prove the instability of benevolent paternalism. Do not generalize too quickly to modern gig work; the factory discipline is distinct. Focus on the collapse of the public-private distinction via the Sociological Department. That is your strongest theoretical lever. If you chase every implication of gendered labor, you will lose the thread on working time. Keep the primary focus on how the conditions of leisure define the right to leisure. Do not drift. End there. Close this specific chapter now. Done.
