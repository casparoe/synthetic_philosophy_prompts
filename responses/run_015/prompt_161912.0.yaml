      **Section 4:**
      The evidence compels the conclusion: a privilege revocable at will is not a right. The Ford case demonstrates that material benefits without institutional guarantees produce dependency, not liberty. This challenges the statutory frame, which assumes legal codification is the primary barrier to leisure. Here, the barrier was private power. Furthermore, the case indicts the gendered assumptions underlying all three frames. The worker's capacity relied on the wife's unpaid labor, yet theory treats the household as a black box. If leisure requires domestic absorption, the right is inherently unequal. The Weberian frame justifies this inequality as moral order; the statutory frame ignores it as private sphere; the karoshi frame overlooks it as non-market labor. The Ford episode suggests that a right to leisure must include a right to domestic support or shared domestic burden. Without addressing who cooks and cares, capacity remains illusory for half the population. The theory must shift from individual claimants to household units. If the employer monitors the home, the public-private distinction collapses. Therefore, the right to leisure is not just against the employer but against the intrusion of market discipline into domestic life.
