      **Section 3:**
      The Weberian frame catches the moral conditioning of the five-dollar day; work is a calling, and leisure is a reward for virtue. It misses how this moralism invades the home, conflating economic rights with personal conduct. The statutory-hours frame catches the reduction from nine to eight hours and the creation of synchrony. It misses that without legal enforcement, these hours are revocable gifts rather than claims enforceable against the employer. The karoshi frame catches the intensity of the work remaining within those eight hours and the pressure to conform. It misses that the exhaustion here was not just physical but social, stemming from surveillance rather than just overtime. All three frames misdescribe the gendered division of labor. They assume the claimant is a autonomous individual, ignoring the wife whose unpaid labor subsidizes the worker's capacity. They also assume the right resides in law or culture, not in unilateral corporate fiat. The Ford case reveals that statutory-like benefits can exist without statutes, but they lack the stability of rights. The frames fail to account for the private sovereignty of the employer acting as a state-like authority over time and morality.
