prompt: |-
  my buddy in our group chat (we do a bit of sports betting, and one of the guys is really into options) has started refusing to even discuss a bet unless we state it as a Kelly fraction, and whenever someone says "but the EV is huge, why not size up" he just sends the thing about the statistician who drowns crossing a river that's three feet deep on average. It's doing a lot of work for him: it's how he gets all the way from "expected value isn't the whole story" to "so the thing to maximize is the expected log of your bankroll, i.e. the geometric growth rate, and the Kelly fraction is the answer."

  The reason it's live for me right now: I've got maybe 14 months of runway, and a seasonal window in which I can run something like 20 to 30 paid trials of a thing I'm selling. So inside the window it's genuinely repeated and multiplicative — winnings get rolled into the next attempt — but it's not an endless sequence, and there's a hard date at the end where I either have enough to keep going or I go get a job. That feels like it should matter, and I can't tell whether the river picture is quietly hiding it.

  Can you audit the analogy for me? Give me the correspondence table — what plays the role of the river, the depth at a given point, the average across the river, the drowning, the statistician — and then where the mapping breaks. Things I'm suspicious about: the river kills you at a threshold rather than multiplicatively; the "average" in the joke is over space while the average he cares about is over counterfactual branches; and the whole picture is one person crossing once, which seems closer to my situation than to the indefinitely repeated sequence the growth-rate argument normally assumes, but that might be me confusing myself. Then: does the conclusion he wants actually survive, or did the analogy only ever support something weaker, like "don't size bets in a way that risks ruin"? And if the long-run/asymptotic assumption is doing real work, what does the recommendation become in a fixed 20–30 bet window with a deadline — more or less than Kelly, and why? Split the disanalogies into the ones that matter for my case and the ones that don't, and if there's a better picture for someone with a deadline, give me that too. Also: in practice he bets half Kelly and never explains it — is that coming from the analogy at all, or from somewhere else entirely?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Problem:**
      *   **Context:** Group chat involving sports betting and options trading.
      *   **The "Buddy":** Insists on using Kelly Criterion for bet sizing. Uses the "statistician drowning in a river of average depth 3 feet" analogy to shut down arguments about high Expected Value (EV) without considering risk of ruin.
      *   **The User's Situation:** 14 months of runway. A seasonal window for 20-30 paid trials of a product/service. Wins roll into the next attempt (multiplicative). Hard deadline: succeed enough to continue or get a job.
      *   **The Core Question:** Does the Kelly/River analogy hold for a *finite* horizon (20-30 bets) with a *survival constraint* (runway), or is the buddy misapplying asymptotic theory to a finite problem?
      *   **Specific Requests:**
          1.  Audit the analogy (correspondence table).
          2.  Identify where the mapping breaks.
          3.  Determine if the Kelly conclusion survives or if a weaker/stronger conclusion is warranted.
          4.  Address the finite horizon (20-30 bets) vs. infinite horizon issue.
          5.  Explain the "Half-Kelly" practice.
          6.  Provide a better mental model if applicable.

  2.  **Analyze the "River" Analogy:**
      *   *The Joke:* A statistician drowns crossing a river that is 3 feet deep *on average*.
      *   *Intended Meaning:* Averages (EV) can hide fatal variance (risk of ruin).
      *   *Correspondence:*
          *   River = The sequence of bets/investments.
          *   Depth at a point = Outcome of a specific bet (or bankroll level at a specific time).
          *   Average depth = Expected Value (EV) per bet.
          *   Drowning = Ruin (bankroll $\le$ 0).
          *   Statistician = The bettor/entrepreneur.
      *   *Where it breaks:*
          *   River depth is spatial (cross-section), betting outcomes are temporal (sequence).
          *   River killing is a hard threshold (head underwater), betting ruin is often asymptotic or defined by a specific stop-loss.
          *   Crucially: The river joke is about *arithmetic mean vs. safety*, whereas Kelly is about *geometric mean maximization*. The joke supports "avoid ruin," Kelly supports "maximize growth." These are related but not identical.

  3.  **Analyze the Kelly Criterion vs. Finite Horizon:**
      *   *Kelly (Full):* Maximizes expected logarithm of wealth ($E[\log(W)]$). Asymptotically (infinite bets), this maximizes the probability of beating any other strategy and minimizes time to reach a goal *if the goal is very high*.
      *   *Finite Horizon (20-30 bets):* Kelly is often *too aggressive* for short horizons if the goal is simply survival or reaching a specific target.
      *   *The User's Constraint:* 14 months runway, 20-30 trials. This is a "survival + threshold" problem, not necessarily "infinite growth" problem.
      *   *Risk of Ruin:* With 20-30 bets, variance is high. Full Kelly has a significant probability of large drawdowns (e.g., 50% drop is common with Full Kelly). If the "ruin" threshold is higher than zero (e.g., need \$X to keep runway), Full Kelly might be too risky.
      *   *Conclusion:* For finite horizons with a specific survival goal, fractional Kelly (or optimization based on the specific utility function of the deadline) is usually better than Full Kelly.

  4.  **Analyze the "Half-Kelly" Practice:**
      *   *Why do people do it?*
          1.  Estimation error: If you overestimate edge, Full Kelly punishes you severely (volatility drag). Half-Kelly provides a buffer.
          2.  Volatility reduction: Reduces variance by ~75% while retaining ~75% of growth. Much smoother ride.
          3.  Utility: Log-utility (Kelly) assumes you care equally about 10% growth at \$1M and 10% growth at \$100. Most humans have diminishing marginal utility or specific goals.
      *   *Connection to Analogy:* The river analogy doesn't directly imply Half-Kelly. It implies "don't drown." Half-Kelly is a practical heuristic derived from parameter uncertainty and volatility tolerance, not directly from the river joke.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the suspicion that the analogy is doing too much heavy lifting.
      *   **Part 1: Auditing the River Analogy:** Create the correspondence table as requested. Highlight the disanalogies (Spatial vs. Temporal, Hard Threshold vs. Multiplicative Decay).
      *   **Part 2: Where the Mapping Breaks (The Crucial Part):**
          *   *Infinite vs. Finite:* Kelly is asymptotic. The user has 30 bets.
          *   *Ruin Definition:* River = Death. Betting = 0 (or below runway threshold).
          *   *Goal:* River = Survive. Kelly = Maximize Geometric Growth. User = Survive *and* hit a target by date $T$.
      *   **Part 3: The Finite Horizon Problem:**
          *   Explain that Full Kelly maximizes *median* terminal wealth in the long run, but in the short run, it has high variance.
          *   With 20-30 bets, the distribution of outcomes is wide.
          *   If the goal is "Don't go broke before month 14," Full Kelly might be too aggressive.
          *   *Recommendation:* Usually *less* than Kelly for short horizons if survival is paramount, unless the edge is massive.
      *   **Part 4: The Half-Kelly Question:**
          *   It's not from the river analogy.
          *   It's from parameter uncertainty (edge estimation error) and volatility tolerance.
          *   It's a "convenience yield" on growth.
      *   **Part 5: A Better Picture:**
          *   Replace the River with a "Rocket Launch" or "Hiking with a Deadline."
          *   Better yet: "The Target Distribution." Visualize the probability cloud of ending bankrolls at Month 14.
      *   **Part 6: Actionable Advice:**
          *   Don't let the buddy win the argument purely on theory.
          *   Calculate the probability of hitting the runway goal under Full vs. Fractional Kelly.
          *   Consider "Goal-Based Investing" (maximize probability of reaching $X$) rather than "Growth-Based Investing" (maximize $E[\log W]$).

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to be careful not to say Kelly is *wrong* for finite horizons. It's often still good, but "Full" Kelly is aggressive. The optimal fraction for maximizing $P(W_T > Goal)$ depends on the goal relative to current wealth.
      *   *Nuance:* The user says "wins get rolled into the next attempt." This *is* multiplicative. So Kelly logic applies, but the *fraction* is the variable.
      *   *Nuance:* The river analogy supports "Avoid Ruin." Kelly supports "Max Growth." These diverge if "Avoid Ruin" requires sizing smaller than Kelly to ensure survival over a *short* sequence.
      *   *Key Insight:* The buddy is using the river analogy to justify *Kelly*, but the river analogy actually justifies *Risk Management* (which could be Kelly, but could also be Fixed Fractional or even smaller). The leap from "Averages lie" to "Log Utility is King" is the weak link.

  7.  **Final Polish:** Ensure tone is analytical, respectful of the buddy's math but critical of the application. Make sure the "Correspondence Table" is clear. Address the "Half-Kelly" specifically.

      *(Self-Correction on the River Analogy)*: The river analogy is specifically about *Arithmetic Mean vs. Safety*. It warns against $E[X]$. Kelly maximizes $E[\log(X)]$. The buddy is using a warning about EV to justify a specific optimization function (Log). That's the non-sequitur I need to highlight.

      *(Self-Correction on Finite Horizon)*: In a finite horizon, maximizing $E[\log(W_T)]$ is still a valid objective, but it might not align with the user's *actual* utility function (which is binary: survive/get job vs. continue business). If the utility function is step-like (0 if $< Threshold$, 1 if $> Threshold$), Kelly is not the optimal strategy. Maximizing probability of exceeding the threshold is.

  8.  **Structure of the Output:**
      1.  Executive Summary.
      2.  The Audit (Correspondence Table).
