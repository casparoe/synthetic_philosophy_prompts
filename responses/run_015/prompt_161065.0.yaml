answer: |-
  Your reading of the passages is correct. When Russell says "a man" denotes "an ambiguous man," he does not mean a specific but unidentified object. He means the phrase contributes no object to the proposition. The phrase is "wholly destitute of meaning" in isolation; meaning arises only when the phrase is embedded in a proposition analyzed as a propositional function. "Is not always false" is Russell's 1905 idiom for existential quantification. Thus, "C(a man)" analyzes to $\exists x (Human(x) \land C(x))$. The "ambiguity" is logical indeterminacy: the variable $x$ is bound by the quantifier, not fixed by reference. There is no constituent in the proposition corresponding to "a man" about which one could ask "which man?"

  Regarding your cases, Russell's apparatus treats each sentence as an independent proposition. In Case I, the first sentence analyzes as $\exists x (Sentry(x) \land Posted(x))$. The second sentence, containing "He," functions as a definite description: "The sentry posted at the north gate was found dead." Russell analyzes this as $\exists c (Sentry(c) \land Posted(c) \land \forall y (Sentry(y) \land Posted(y) \rightarrow y=c) \land Dead(c))$. If two sentries were posted, the uniqueness clause $\forall y (... \rightarrow y=c)$ fails. Consequently, the theory forces the verdict that the second sentence is false. There is no mechanism in 1905 for the pronoun to inherit a variable bound in a previous proposition; binding is intra-propositional.

  In Case II, "The president" is elliptical. Russell acknowledges that descriptions often require contextual completion to satisfy uniqueness. If the first occurrence implies "The president [at time $t_1]$" and the second "The president [at time $t_2]$", uniqueness holds within each context, and the sentence is true. If treated as bare "The president [at any time]," uniqueness fails and the sentence is false. This is not a theoretical defect but a requirement for contextual precision inherent in Russell's view of logical form.

  Therefore, Case I represents a genuine defect in the theory regarding anaphora across propositions. Russell's proposition-by-proposition analysis cannot account for discourse coherence where later sentences depend on earlier indefinite introductions. Case II is merely an incompleteness of presentation; the theory accommodates it via contextual restriction of the propositional function.

  Finally, does the scope distinction rescue these cases? No. Scope distinguishes primary and secondary occurrences within a single proposition to resolve ambiguities involving negation or propositional attitudes. It cannot bind variables across separate sentences, so it offers no help for Case I. For Case II, scope does not address contextual shift across occurrences.

  Regarding your question on scope outside negation and empty descriptions: Consider "The winner might not have won." (I note here that I am going beyond the 1905 text, as Russell does not explicitly treat modal operators, but the structural distinction applies.) Scope distinguishes whether the description lies inside or outside the modal operator.
  Primary occurrence (de re): $\exists x (Winner(x) \land \forall y (Winner(y) \rightarrow y=x) \land \Diamond \neg Won(x))$. This claims there is an actual winner who might have lost.
  Secondary occurrence (de dicto): $\Diamond \exists x (Winner(x) \land \forall y (Winner(y) \rightarrow y=x) \land \neg Won(x))$. This claims it is possible that there is a winner who lost (which may be contradictory depending on the logic).
  Thus, the scope distinction does work outside negation to differentiate truth conditions involving operators. However, it remains strictly intra-propositional. It resolves ambiguities of logical form within a sentence but cannot bridge the gap between sentences in a discourse, leaving Case I unresolved by Russell's 1905 resources.
