answer: |-
  # The Kitchen Table Protocol: Realism vs. PMI

  ### 1. Agreed Claims
  *These are the premises both of us accept as non-vacuous starting points. If a claim is compatible with total scepticism, it is excluded.*

  1.  **Theory Change is Substantial:** The history of science contains cases where theories regarded as successful by their contemporaries were later discarded or radically revised (e.g., caloric, ether, phlogiston).
  2.  **Success is Trackable:** We can identify specific historical instances where a theory generated novel predictions that were subsequently confirmed.
  3.  **Retention Happens:** When theories change, some mathematical or conceptual structure often survives into the successor theory (e.g., Fresnel's equations surviving the shift from ether to electromagnetic fields).
  4.  **Future Change is Probable:** It is highly probable that some of our current best theories will be modified or replaced within the next 40 years.
  5.  **Operational Definitions are Possible:** We can agree in advance on operational criteria for what counts as a theory being "abandoned," "demoted," or "retained" without needing to know the future content of the successor theory.

  ### 2. Disagreements Table
  *Formulations designed so each of us would sign our own column without feeling parodied.*

  | Issue | Sam (Selective Realist) | User (Pessimist / PMI) |
  | :--- | :--- | :--- |
  | **1. Units of Induction** | The unit of assessment is the **load-bearing structure**. We should individuate theories by the specific mathematical or causal mechanisms that generated their novel predictions, not by the surrounding ontological packaging. | The unit of assessment is the **theoretical package as accepted**. Scientists historically believed in the whole package (including the ontology); if the ontology is discarded, the theory is discarded, regardless of whether some equations survive. |
  | **2. Retention & Hindsight** | Retention is the **primary evidence for truth**. If the math that worked then still works now, that isn't hindsight; it's continuity. The "Retention Audit" will show high survival of the specific machinery that caused the success. | Retention is **instrumental recycling**. Finding surviving bits is easy after the fact (hindsight). The "Retention Audit" will show that while instruments survive, the *explanatory terms* (the "what is doing the work") are often replaced, even if the math looks similar. |
  | **3. Comparability of Success** | Success is **absolute**. Past theories are only relevant if they match the predictive precision and scope of current theories. Many discarded theories were never truly successful by modern standards; they were just "less wrong." | Success is **relative to era**. Judging past theories by modern standards makes realism unfalsifiable. We must judge a theory against its contemporaries. If it won then and lost now, it counts against current theories winning now and losing later. |
  | **4. Approximate Truth** | Approximate truth is **literal structural retention**. To say a past theory was "approximately true" is just to say its load-bearing structure is preserved in the current theory. | Approximate truth is a **post-hoc placeholder**. It is a label realists apply to whatever survived to avoid admitting the theory was false. It allows you to claim victory regardless of how much ontology was dumped. |

  ### 3. Cruxes: The Forward-Looking Bet
  *To settle the debate, we commit to predictions about the next 40 years. We define the terms now to prevent hindsight bias later.*

  **A. The Taxonomy of Fate**
  For any current theory $T$, its status in 40 years will be classified as:
  1.  **Refuted/Abandoned:** The central ontology is denied (e.g., "There are no Xs") and the math is discarded or shown to be fundamentally misleading.
  2.  **Absorbed/Limiting:** The theory is shown to be a special case of a broader theory (e.g., Newtonian mechanics vs. Relativity). The ontology is reinterpreted but the core terms remain referential.
  3.  **Retained/Core:** The theory remains the standard model for its domain with no major ontological shifts.

  **B. The Sample Theories**
  We agree to track the following specific claims/theories:
  1.  **Physics:** The Standard Model (specifically the existence of quarks and leptons as fundamental particles).
  2.  **Cosmology:** Dark Matter (as a particulate substance vs. modified gravity).
  3.  **Biology:** The Central Dogma (DNA $\to$ RNA $\to$ Protein as the exclusive flow of information).
  4.  **Medicine:** Germ Theory specifics (specifically the model of bacterial pathogenicity vs. microbiome/ecological models).

  **C. The Predictions**
  *   **Sam's Prediction:** At least 3 out of 4 will fall into **Absorbed** or **Retained**. The specific mathematical structure generating current novel predictions will remain recognizable. Central terms (e.g., "quark," "gene") will still refer to real entities.
  *   **User's Prediction:** At least 2 out of 4 will fall into **Refuted/Abandoned** regarding their central ontology. The math might be repurposed, but the terms (e.g., "Dark Matter particle") will be deemed non-referring, similar to "ether."

  **D. The Retention Audit Rule**
  To measure retention objectively in 40 years:
  1.  Identify the specific equation or mechanism in $T$ responsible for its most famous novel prediction today.
  2.  Check the successor theory $T'$.
  3.  **Pass:** The mechanism is derived as a limit case or identity in $T'$.
  4.  **Fail:** The mechanism is shown to be an artifact of approximation or measurement error in $T'$.

  **E. Falsification Conditions (What changes our minds?)**
  *   **Sam:** If the Standard Model is replaced by a theory with **no overlapping mathematical structure** (not just a new particle, but a new framework entirely), I will concede the PMI has force.
  *   **User:** If **none** of the central ontological terms in the sample are discarded in 40 years, and the "Absorbed" cases clearly preserve reference (not just math), I will concede that selective realism is the better bet.

  **F. Domain Crux: Physics vs. Biology/Medicine**
  *   **The Issue:** Is the history of physics (high math, high stability) a fair baseline for all science, or is Biology/Medicine (messy, high discard rate) the realistic baseline?
  *   **Sam's View:** Physics is the vanguard. If realism holds there, it holds where it matters most. Biology is just catching up to the structural stability of physics.
  *   **User's View:** Physics is the outlier. Biology and Medicine represent the normal state of scientific inquiry. If realism fails there, the "miracle argument" for realism is weakened globally.
  *   **Prediction:** User predicts higher abandonment rates in Bio/Med than Physics. Sam predicts convergence (Bio will stabilize like Physics).

  ### 4. Verbal and Definitional Issues
  *Where we are likely talking past each other.*

  1.  **"Approximate Truth":** We agree this is the stickiest term. Sam uses it to mean "structural continuity." User uses it to mean "ontological accuracy." We agree to stop using the phrase "approximately true" in future discussions and instead use "structurally retained" (Sam) vs. "ontologically preserved" (User).
  2.  **"Success":** Sam leans heavily on "novel prediction." User leans on "explanatory coherence." We agree that for the purpose of this bet, "success" is defined by the **Retention Audit Rule** (Section 3D) based on novel predictions, as that is the only measurable metric over time.
  3.  **"Realism":** We acknowledge Sam is not a "whole theory" realist but a "structural" realist. We acknowledge User is not a "anti-science" sceptic but a "historical" pessimist. The disagreement is not about whether science works, but whether working implies truth.

  ### 5. Aside: The Bad Sub-Argument
  *(This section is outside the agreed document, as requested.)*

  There is a specific move you both made during the argument that is logically weak and should be dropped.

  **The Move:** The symmetric accusation of **Hindsight Bias**.
  *   **You (User):** Claimed Sam is engaging in hindsight bias because she identifies the "load-bearing structure" only after knowing what survived.
  *   **Sam:** Claimed you are engaging in hindsight bias because you identify the "failed ontology" only after knowing what was discarded.

  **Why it's bad:** This is a stalemate that proves nothing. Both of you are looking at history from the present. Accusing the other of hindsight is just saying "You are looking at the past from the future," which is true for both of you. It doesn't settle the unit of analysis or the retention rate.

  **The Fix:** This is exactly why the **Forward-Looking Bet (Section 3)** is necessary. Hindsight bias can only be eliminated by making predictions *before* the change happens. If you spend more time arguing about who is guilty of hindsight regarding the ether, you are wasting time. If you spend time defining what would count as "Dark Matter" being discarded in 2064, you are actually testing the hypothesis. Drop the hindsight accusation; it's a rhetorical shield, not an argument.
