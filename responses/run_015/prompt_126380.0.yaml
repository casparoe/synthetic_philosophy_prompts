answer: |-
  To audit the analogy that inferring a reward function from behavior is merely the formal version of ordinary mindreading, we must first map the architectural components of folk psychology onto the mathematical setup of inverse reinforcement learning or preference learning. In the source case of human mindreading, the interpreter's prior over possible desires is not a explicit distribution but a deep, evolved expectation grounded in shared biology and culture; you assume a stranger wants food when hungry because you know what hunger feels like, and you assume they value social standing because you inhabit the same hierarchy. In the formal setup, this role is occupied by the prior over reward functions, often implemented as a regularizer or a specific basis set, which mathematically penalizes complex or unlikely reward structures but lacks the semantic content of biological need. The shared world the interpreter and target inhabit corresponds in the human case to a common physical and social reality, where both agents perceive the same obstacles and affordances, whereas in the learning setup, this is the Markov Decision Process transition structure, which is frequently assumed to be known by the learner or learned from the same data, creating a risk that the learner's model of the world diverges from the demonstrator's actual reality. The availability of language in the human case allows for direct clarification, where an interpreter can ask why an action was taken, while in the standard behavioral cloning or inverse reinforcement setting, this channel is closed, though in preference learning it is partially reopened through comparison queries that function as a restricted vocabulary of judgment. The standing assumption that the target is competent at getting what she wants maps directly to the rationality assumption in the formal model, typically parameterized by a temperature or noise term that dictates how strictly the demonstrator's policy must align with the optimal policy for the recovered reward. Finally, the feedback channel that lets the interpreter test a guess in human interaction is continuous social reinforcement, where a misunderstanding is corrected in real time, while in the formal setup, feedback is usually a static loss signal computed against a held-out dataset or a validation trajectory, lacking the interactive repair mechanism of conversation.

  Having established the correspondence, we must separate the disanalogies that are merely cosmetic from those that undermine the reassuring conclusion. It is irrelevant that the human brain runs on wetware and the learning algorithm on silicon, or that the human process is subconscious while the algorithm is explicit, as these do not inherently change the logical structure of the inference problem. However, the disanalogies regarding the depth of the shared prior and the identifiability of the solution are load-bearing. The reassuring conclusion relies on the premise that because humans solve this problem effortlessly, the problem must be easy or well-posed. This ignores the possibility that humans solve it effortlessly precisely because of the massive amount of shared structure that the formal system lacks. If the difficulty of the problem is inversely proportional to the amount of shared context, then the formal setup, which strips away that context to achieve generality, is actually facing a harder problem than the human mindreader, not an identical one. Therefore, the success of the human case does not transfer to the machine case unless the machine is endowed with a prior as rich and accurate as the human evolutionary prior, which current systems are not.

  This leads directly to your first load-bearing point regarding shared structure. In human mindreading, the inference succeeds partly because the interpreter and target share enormously much, including gross physiological needs, perceptual hardware, and a common cultural grammar. When you see a person reach for a glass, you do not need to infer from scratch that they are thirsty; your own physiology provides a high-probability prior that water is desirable. In the formal setup, the learner is typically an alien intelligence with no body, no hunger, and no social standing, observing a human whose actions are driven by those exact factors. If the learner does not have a prior that encodes the structure of human biology or psychology, it must infer these latent variables solely from the trajectory data. This is statistically inefficient and prone to error. The analogy borrows its plausibility from the human case's shared structure, but the target case lacks it, meaning the reassuring conclusion is indeed propped up by a feature the target case does not possess. The framework is not necessarily silent on this, but it often treats the prior as a hyperparameter to be tuned rather than a structural necessity to be engineered, which obscures the magnitude of the gap between human and machine inference.

  Your second point concerns the non-identifiability of the reward function, often framed as the taste-versus-map problem. In the human case, if someone walks into a wall, you assume they are blind or the wall is invisible, not that they desire pain, because you share a model of physics and pain aversion. In the formal setup, if the demonstrator takes a suboptimal path, the learner must decide whether this is due to the reward function valuing the path, the transition dynamics being different than expected, or the demonstrator having incorrect beliefs. If the learner assumes the transition dynamics are known and fixed, it will attribute all deviations to the reward function, potentially recovering a reward that incentivizes inefficiency or self-harm because it cannot model the demonstrator's constraints. The constraint that the observed policy be optimal for the recovered reward is satisfied by a very large family of rewards, including degenerate ones where the reward is zero everywhere or where the reward perfectly matches the noise. Unless the prior over rewards is extremely sharp, or the model of the demonstrator's bounded rationality is accurate, the likelihood surface remains flat, and the inference is driven by the regularization rather than the data. The temperature-like parameter that governs the assumed rationality is itself often not identified from the data, meaning the system can trade off between assuming the human is irrational and assuming the human has strange preferences without changing the fit to the data. This suggests that the data is not sufficient on its own, contradicting the reassuring claim that practice has solved the problem.

  The third point distinguishes between evidence channels, noting that watching someone act is different from asking them to judge trajectories. In the human analogy, mindreading combines observation with conversation; we do not rely solely on behavior. In the formal setup, pure inverse reinforcement learning relies only on behavior, while preference learning relies on judgments. When the human is used as a judge rather than an agent, the competence assumption changes from assuming they can achieve their goals to assuming they can accurately evaluate outcomes. This is a distinct cognitive load. A person might be unable to bake a cake due to lack of skill but perfectly capable of tasting which cake is better. If the system treats preference judgments as behavior, it assumes the human is optimizing for the judgment, which introduces new biases, such as the human trying to guess what the system wants to hear. The analogy holds better for preference learning than for pure behavioral cloning because it incorporates the language-like channel of comparison, but it still fails to account for the fact that human judgments are noisy, context-dependent, and often inconsistent in ways that violate the axioms of the reward model.

  Given these audits, the reassuring conclusion does not survive intact. It needs the analogy to hold it up, specifically the hidden premise that the interpreter and target share a world. Without that shared world, the inference is under-constrained. The framework is silent on whether the demonstrator's behavior reflects her values at all if the model of the demonstrator's beliefs or constraints is misspecified; it simply returns the reward function that best explains the behavior under the assumed model. If the model assumes the human is rational and the human is confused, the system infers that confusion is a value. This is not a philosophical worry but a practical failure mode where the system learns to replicate human errors or exploit human blind spots because it interprets them as preferences. Therefore, relying on the claim that behavior is enough is risky for a roadmap unless the system explicitly models the uncertainty in the human's beliefs and constraints, rather than just the uncertainty in the reward.

  Regarding your alternative analogies, reading a traveler's itinerary to work out what they like without knowing which museums were closed is structurally superior to the mindreading analogy for this specific technical problem. It captures the taste-versus-map problem explicitly: the traveler's path is constrained by external factors (closed museums) that the observer might not know. If the observer assumes all museums were open, they might infer the traveler dislikes art because they skipped the Louvre, when in reality the Louvre was closed. This maps directly to the issue of inferring reward from trajectories when the transition dynamics or constraints are not fully observed by the learner. It highlights that the data is consistent with multiple explanations and that without knowledge of the constraints, the inference is biased. The reverse-engineering a compiler's optimization flags from its binaries analogy is less useful because a compiler is not an agent with preferences but a deterministic function with an objective defined by a specification. While it captures the difficulty of inferring high-level intent from low-level output, it misses the element of bounded rationality and noise; a compiler does not make mistakes due to fatigue or confusion, so the "temperature" parameter has no meaning. The traveler analogy correctly imports the structural feature of hidden constraints and the silence of the framework regarding those constraints, making it a better guide for setting expectations.

  Ultimately, the roadmap should not rest on the claim that behavior is enough, but rather on the claim that behavior combined with a robust model of human limitations and constraints is enough. The mindreading analogy is more trouble than it is worth because it smuggles in the success of shared embodiment without providing a mechanism to replicate it. A more honest framing would acknowledge that we are not reading minds but rather fitting curves to shadows, and that without a lantern to illuminate the constraints of the human condition, the shape of the reward function we recover will be distorted by the walls of the cave. The difficulty others allege is not philosophers worrying about a problem practice has solved, but engineers recognizing that the practice of human mindreading relies on a dataset of shared life experience that the machine does not have. To make the inference work, you must either build that shared experience into the prior or admit that the reward function you learn is only valid within the narrow distribution of the observed behavior, failing to generalize to new situations where the hidden constraints change. The audit suggests that the reassuring conclusion is a byproduct of the analogy's opacity, and clearing that opacity reveals a significantly harder engineering challenge than the team's senior engineer implied.
