answer: |-
  **Scenario**
  Divisions A and B bid for a $100k internal project; highest bidder wins, both pay their bids. A has already bid $120k (irrevocable); B has bid $0. A can bid $121k. If A stops, A loses $120k. If A bids $121k and B folds, A loses $21k ($100k prize - $121k cost). Since -$21k > -$120k, it is rational for A to bid. B, knowing A faces these marginal incentives, expects A to bid up to $200k (where prize equals marginal cost). For B to win, B must exceed $121k and potentially face a war up to $200k. Since B's expected cost exceeds the prize, B stays out.

  **Verification**
  A bids $121k; B exits. A's total position is -$21k. Clause 4 holds: A is worse than if never entering ($0), yet digging deeper was the rational choice. The asymmetry stems from **irreversibility creating asymmetric marginal incentives**. A's sunk cost is a constraint on withdrawal, not an asset. B faces full cost; A faces only marginal cost.

  **The Feature**
  The load-bearing feature is **Irreversibility**. If A's $120k were refundable, A would quit (losing $0 vs. losing $21k). The case collapses into a plain dollar auction where both quit early, or a sunk-cost fallacy if A bids hoping to "recover" the $120k rather than minimizing loss.

  **Objection and Reply**
  *Objection:* "Sunk costs are never reasons. You've smuggled in 'commitment,' which is just reputation by another name."
  *Reply:* Reputation implies future interactions. Here, irreversibility changes the *current* payoff matrix. A isn't bidding to look tough; A is bidding because the alternative is mathematically worse. Sunk costs matter not as values to recover, but as constraints that alter marginal calculus.

  **Honesty Check**
  This is solid for second-years *if* you distinguish "guiding by sunk costs" (fallacy) from "guiding by options constrained by sunk costs" (rational). However, **Clause 5 contains an incoherence.** It requires "B knows something about A that A doesn't know B knows about A." In a rational equilibrium (Clause 3), A must know B knows A's incentives to predict B's fold. If A doesn't know B knows, A cannot rely on B staying out, and Clause 3 fails. **Drop the epistemic regress requirement in Clause 5.** Rely instead on Common Knowledge of A's outlays versus B's lack thereof. Without this fix, the case relies on stipulation, not derivation.
