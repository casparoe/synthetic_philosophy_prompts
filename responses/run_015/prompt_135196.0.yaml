  **THE COMMON-KNOWLEDGE DINING ROOM**
  **Epistemic Tasting Menu | Season: Nash Equilibrium**

  **Course I: The Superrational Tartare**
  *Raw decision theory, hand-chopped under conditions of strict isolation.*
  You are seated opposite an anonymous counterpart in a soundproofed alcove. Neither party may signal intent. Before you lies a choice of sauces: *Cooperate* (a reduced trust glaze) or *Defect* (a sharp vinegar reduction). If both parties select *Cooperate*, a white truffle shaving manifests centrally. If one selects *Defect*, the defector receives a prime Wagyu cut while the cooperator receives plain steamed rice. If both select *Defect*, the kitchen withholds service entirely.
  **Chef's Note:** We advise dining superrationally. Assume your counterpart shares your exact source code. Your choice does not causally influence theirs, but it evidences their likely selection. Act as if your will dictates the room's outcome.
  **Pairing:** A bold red with notes of dominant strategy and a finish of mutual assured sustenance.
  **Price:** 50 utils (contingent on coordination).

  **Course II: Newcomb's Consommé**
  *Clarified prediction served in two vessels.*
  One opaque bowl, one clear. The Chef has already predicted your selection and filled the bowls accordingly. The opaque bowl contains a rich reduction if the Chef predicted you would take only this bowl. The clear bowl contains a single, modest olive. You may take both, or only the opaque. If you take both, implying you distrust the prediction, the opaque bowl is empty. If you take only the opaque, trusting the evidential link between your choice and the Chef's prior preparation, the reduction is full-bodied.
  **Chef's Note:** Causal leverage is an illusion here. Your choice cannot change the past preparation, but it reveals which timeline you inhabit. To take both is to starve evidentially.
  **Pairing:** A translucent white that tastes different depending on when you believe you decided to order it.
  **Price:** 100 utils (fixed cost, variable yield).

  **Course III: The Schelling Point Soufflé**
  *Airy recursion stabilized by focal prominence.*
  Select an integer between 1 and 100. If your selection matches your counterpart's, the soufflé rises. If it does not, it collapses into a custard. The optimal choice is the number both parties expect the other to choose because it seems obvious. However, be warned: if both parties recognize the obviousness as common knowledge, you may attempt to outguess the symmetry, selecting a second-order obvious number, causing structural failure through infinite regression of expectation.
  **Chef's Note:** Simplicity is fragile. Over-rationalizing the symmetry guarantees starvation.
  **Pairing:** A sparkling vintage with bubbles that pop only when observed mutually.
  **Price:** Variable utils (negative utility applied for collapse).

  **House Rules**
  1. Communication between alcoves is strictly prohibited. Signaling violates the one-shot condition.
  2. Diners must assume counterparts are equally rational, sane, and hungry.
  3. The kitchen denies all causal responsibility for payoff matrices. Regret is a digestif not served here.
  4. Please refrain from discussing your decision algorithm with staff; it alters the probability distribution of the service flow.

  **Service Charge**
  A standard 15% tax is applied to all realized utilities. Un realized utilities are non-refundable.

  ***

  *<small>Refund Policy: In the event a diner discovers they are a simulated instance running on the kitchen's local server rather than a biological entity, no refund of utils will be issued. Subjective experience of satiety remains valid regardless of substrate ontological status. Pleasure derived from Nash equilibria is final.</small>*
