answer: |-
  Here is a diagnosis of your candidate principle, a repaired version tailored to your cases, and an honest accounting of the costs.

  ### 1. Diagnosis of Your Candidate Principle
  **Candidate:** *Switch just in case $P(\text{Smaller} | \text{Info}) > 1/3$.*

  **The Good:** Under **linear utility** and **conditional on observing a specific amount $Y$**, this is mathematically correct.
  *Proof:* Let $p = P(\text{Smaller}|Y)$. Expected Value of Other = $p(2Y) + (1-p)(Y/2) = Y(1.5p + 0.5)$. This exceeds $Y$ iff $1.5p > 0.5$, or $p > 1/3$.

  **The Bad:** It fails in **Case 1** (Sealed) because there is no $Y$ to condition on. Without an observed value, symmetry dictates $P(\text{Smaller}) = 1/2$, which satisfies $>1/3$, falsely implying you should switch. It also fails in **Case 4** because your intuition there violates linear utility math (EV is exactly equal, not positive).

  **The Ugly:** It cannot be true for **all** $Y$ in **Case 3**. If $P(\text{Smaller}|Y) > 1/3$ for every possible $Y$, the prior distribution over amounts is impossible (it would sum to more than 1). You cannot rationally switch on every observed value.

  ### 2. The Repaired Principle: CEU-SC
  I propose the **Conditional Expected Utility with Symmetry Constraint (CEU-SC)**. It governs acts but is constrained by the coherence of the probability model.

  **Clause 1 (The Symmetry Constraint):**
  *If the envelopes are indistinguishable given your information (no amount observed, no known bias), you must assign equal probability to holding the smaller or larger amount, and the Expected Utility of switching equals the Expected Utility of staying.*
  *   **Motivation:** **Case 1** and **Case 6**. This prevents the "always switch" paradox before you even look. It forces indifference when information is symmetric.

  **Clause 2 (The Observation Rule):**
  *If you observe amount $Y$, Switch iff $E[U(\text{Other}) | Y] > U(Y)$.*
  *   **Motivation:** **Case 2** and **Case 5**. This is standard decision theory. It allows specific information to break symmetry.

  **Clause 3 (The Linear Simplification):**
  *Under linear utility, Clause 2 simplifies to: Switch iff $P(\text{Smaller} | Y) > 1/3$.*
  *   **Motivation:** This rescues your **Candidate Principle** but restricts its domain to *observed* cases only.

  **Clause 4 (The Proper Prior Constraint):**
  *Your probability assignments $P(\text{Smaller} | Y)$ must derive from a proper prior distribution over possible amounts. Consequently, there must exist some $Y$ high enough that $P(\text{Smaller} | Y) < 1/3$.*
  *   **Motivation:** **Case 3** and **Case 6**. This ensures you don't fall for the "always switch" loop. If you would switch on $Y$, you must be willing to stay on some $Y'$.

  ### 3. The Honest Account: Verdicts You Must Give Up
  To adopt CEU-SC, you must sacrifice two of your six verdicts.

  1.  **Sacrifice Case 4 (The Biased Mechanism):**
      *   **Your Verdict:** Switch.
      *   **Principle's Verdict:** **Indifferent.**
      *   **Reason:** With linear utility, the math is unforgiving. EV(Switch) = $(1/3)(2Y) + (2/3)(Y/2) = Y$. The upside is twice the downside, but it is half as likely. They cancel exactly. Your intuition here is suffering from *ratio neglect* (focusing on the magnitude of the win vs. loss without fully weighting the probabilities). You must accept that a 1-in-3 chance to double cancels a 2-in-3 chance to halve.

  2.  **Qualify Case 3 (The Large Amount):**
      *   **Your Verdict:** Switch (unconditionally).
      *   **Principle's Verdict:** **Switch only if $Y$ is not "too large".**
      *   **Reason:** You noted you "trust this least." Good. For any valid probability distribution, as $Y \to \infty$, the probability that $Y$ is the *smaller* of the pair must approach 0 (otherwise the total probability mass diverges). Eventually, $P(\text{Smaller}|Y)$ will drop below $1/3$. At that point, you must stop switching. You cannot switch on *every* large amount.

  **Accommodated Verdicts:**
  *   **Case 1:** Accommodated by Clause 1 (Symmetry).
  *   **Case 2:** Accommodated by Clause 3 (if $40$ is low in the range, $p > 1/3$).
  *   **Case 5:** Accommodated by Clause 2 (Log utility makes EV equal regardless of $p$).
  *   **Case 6:** Accommodated by Clause 1 & 4 (Policy coherence prevents infinite loops).

  ### 4. Analysis of New Variants

  **Variant A: Skewed Distribution (Small values much likelier)**
  *   **Setup:** Prior $P(A)$ decreases rapidly (e.g., $P(A) \propto 1/A^2$).
  *   **Analysis:** You observe $Y$. Is it more likely you hold the Smaller ($A=Y$) or Larger ($A=Y/2$)? Since small values are likelier, $P(A=Y/2) \gg P(A=Y)$. It is much more probable that the pair is $(Y/2, Y)$ and you hold the larger one.
  *   **Verdict:** **Do Not Switch.**
  *   **Why:** The "Small values likelier" prior implies that for most observed $Y$, $Y$ is likely the *upper* bound of the pair. $P(\text{Smaller}|Y)$ will be well below $1/3$.

  **Variant B: 10% Switching Cost**
  *   **Setup:** Linear utility, cost = $0.10 \times Y$ (paid from current envelope).
  *   **Analysis:**
      *   $E[\text{Net Switch}] = p(2Y) + (1-p)(0.5Y) - 0.1Y$.
      *   Switch if $1.5pY + 0.5Y - 0.1Y > Y$.
      *   $1.5p + 0.4 > 1 \Rightarrow 1.5p > 0.6 \Rightarrow p > 0.4$.
  *   **Verdict:** **Switch iff $P(\text{Smaller}|Y) > 0.4$.**
  *   **Why:** The cost raises the threshold from $1/3$ ($\approx 0.33$) to $0.4$. You need stronger evidence that you hold the smaller envelope to justify the transaction fee.

  ### 5. Act vs. Policy
  **Question:** Ought the principle govern individual acts or whole policies?

  **Answer:** It must govern **Individual Acts**, but valid acts require **Policy Coherence**.

  *   **Why Acts:** Decision theory is fundamentally about choosing the best action given *current* information (Case 2). A rigid policy ("Never Switch" or "Always Switch") ignores the information gained by opening the envelope (Case 2 vs Case 1).
  *   **Why Coherence:** Case 6 shows that if your Act-based reasoning leads to a policy of "Always Switch," your reasoning is flawed. You cannot rationally prefer Switch to Stay *and* Stay to Switch.
  *   **Synthesis:** Use CEU-SC to evaluate the **Act** of switching *now*. However, your probability assignments ($p$) in Clause 3 must be consistent with a prior that would not recommend switching for *all* possible values (Clause 4). If your act-evaluation implies a policy of infinite switching, your probability assignments are incoherent, and the Act verdict is void.

  **Summary:** Keep your gut for Case 1, 2, 5, and 6. Change your mind on Case 4 (it's a math error) and Case 3 (it's impossible for all large values). Use the $p > 1/3$ rule only when you see a number, and never when the envelopes are sealed.
