  hey — i'm drafting a scene for my novel where a retired classics prof misremembers Aristotle on money to a grad student. i want the error to feel real, not cartoonish. heres the summary she gives, more or less: "Aristotle said barter was natural but once cities got big people invented coinage by agreement, like a token for need. He thought money is naturally barren, so lending at interest is wrong — its like breeding from a dead seed. He also believed all buying-cheap-to-sell-dear is unnatural chrematistike, not real household management, and that prices should match an intrinsic just price based on labor and social rank, not supply and demand. Plus he figured money has no value except as a measure, which makes him an early anti-capitalist who'd reject modern banking. Oh, and he said the state should fix coin values by law so markets can't fluctuate."

