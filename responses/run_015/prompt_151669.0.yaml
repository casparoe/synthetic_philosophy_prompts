answer: |-
  **Brainstorm**
  *Oikonomia* (natural use) differs from *chrematistike* (profit-seeking). *Chreia* (need) drives exchange, not labor-time. *Nomos* (convention) creates money, not *physis* (nature). The state guarantees currency validity, not market prices.

  **Audit**
  1.  **Barter/Coinage:** Accurate. Money arises by convention (*nomos*) to facilitate exchange based on need (*chreia*).
  2.  **Barren Money/Interest:** Accurate. *Tokos* (interest) is unnatural; money begetting money violates nature (*Politics* I.10).
  3.  **Chrematistike:** Accurate. Retail trade for infinite accumulation is condemned.
  4.  **Just Price/Labor:** **Flat Wrong.** Aristotle has no labor theory of value. Reciprocity is proportional to status and need, not labor input. This conflates Aristotle with Medieval Scholastics or Marx.
  5.  **State Fixing Values:** **Twisted.** He notes coinage is conventional and changeable, not that the state *must* fix values to prevent fluctuation. That imports modern price controls.
  6.  **Anti-Capitalist/Banking:** Anachronistic label. The rejection of *usury* follows from the "barren money" premise. Rejecting *banking* broadly is a stretch, but consistent with his suspicion of profit-seeking finance.

  **The Scholar's Wince**
  The labor theory attribution is the fatal error. It projects 18th-century economics onto antiquity. Aristotle's reciprocity binds citizens through *need* and status, not labor hours. A scholar would cringe at "intrinsic just price based on labor." That is Locke or Marx, not the Lyceum. The state price-fixing claim is a close second, implying a command economy Aristotle never envisioned. He describes how money works, not how to regulate markets against fluctuation. The banking conclusion follows only regarding interest, not financial intermediation itself. She conflates his moral critique of infinity with a structural critique of markets.
