  hey so i've been trying to wrap my head around wittgensteins hinge epistemology from On Certainty, specifically the riverbed/river thing. but i keep running into this idea of 'hinge drift' -- like, if hinges are the bedrock that makes doubt possible, but they can also slowly shift (the riverbed moves), then how do we tell the difference between a hinge slowly deforming and just being wrong about some regular empirical belief? it feels like there's a missing middle layer. can you lay out the conceptual issue? is there actually a principled distinction between hinge-change and belief-revision, or is it just speed and social agreement? and if hinges are pre-rational in some sense, what does it even mean to 'discover' that one of yours was off? i don't need citations or a reading list, just help me see where the line is supposed to be drawn and whether the river analogy actually supports it or just smuggles in the conclusion.
