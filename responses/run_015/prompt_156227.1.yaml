answer: |-
  You have hit on the exact nerve that makes *On Certainty* so frustrating and so productive. You aren't missing a layer; you are staring at the place where Wittgenstein intentionally dissolves the layer.

  The short answer to your main question is: **No, there is no principled, metaphysical distinction between a hinge proposition and an empirical proposition.** The distinction is entirely **functional** and **contextual**.

  Here is the breakdown of the conceptual issue, the nature of the "drift," and whether the river analogy holds water.

  ### 1. Role vs. Content (The Functional Distinction)
  The biggest mistake readers make is thinking hinges are a special *class* of truths (like "The Earth exists" vs. "It is raining"). Wittgenstein's point is that *any* proposition can function as a hinge depending on how it is used in a language game.

  *   **Empirical Belief:** A move *within* the game. It is subject to verification, falsification, and evidence.
  *   **Hinge:** The rule *of* the game. It is the scaffolding that allows verification to happen.

  **The Line:** The line isn't drawn between two types of statements, but between two types of **usage**.
  If I say, "I have two hands," and I am counting my fingers, that is an empirical claim (I might be wrong). If I say, "I have two hands," and I am using that certainty to prove I can hold a cup, it is a hinge.

  So, to your point about the "missing middle layer": There is no middle layer because the status of the proposition is determined by its **logical grammar** in that moment, not its content. When a proposition shifts from being a rule to being a move (or vice versa), it hasn't physically changed; its *role* in our system of judgment has changed.

  ### 2. Hinge Drift vs. Belief Revision
  You asked if the difference is just speed and social agreement. It is close to that, but "speed" is the wrong metric. **Resistance** is the right metric.

  *   **Belief Revision:** When I change an empirical belief, I appeal to the hinges. (e.g., "I thought it was raining, but looking out the window [hinge: vision is reliable], I see it isn't.") The system stays intact; one tile is swapped.
  *   **Hinge Drift:** This happens when the resistance to doubt erodes. This doesn't happen via a single counter-evidence moment. It happens when a proposition slowly ceases to be useful as a foundation.

  **The Conceptual Issue:**
  If hinges are the standard by which we measure truth, how can we measure the hinge itself?
  Wittgenstein's answer: **We don't measure it. We replace it.**

  When a hinge "drifts," it doesn't look like a correction. It looks like a **change in what counts as rational.**
  *   *Example:* For centuries, "The sun revolves around the earth" functioned as a hinge. It wasn't just a belief; it was part of the framework of how "motion" and "place" were defined.
  *   *The Shift:* It didn't become "false" in the old system. The system collapsed, and a new system (heliocentrism) established new hinges.
  *   *The Distinction:* Belief revision is winning an argument using the rules. Hinge drift is changing the rulebook so the argument can no longer be had.

  ### 3. Pre-Rationality and "Discovery"
  You asked: *If hinges are pre-rational, what does it even mean to 'discover' that one of yours was off?*

  This is the hardest pill to swallow. You do not "discover" a hinge is off in the same way you discover a flat tire.
  *   **Empirical Error:** "I was mistaken." (I can point to the evidence that corrected me.)
  *   **Hinge Collapse:** "That no longer makes sense."

  When a hinge shifts, you don't say, "I was wrong about the world." You say, "I see the world differently now." It is closer to a **conversion experience** or a **Gestalt switch** than a scientific correction.

  Because hinges are pre-rational (they make rationality possible), you cannot use reason to dislodge them. They usually fall away because they become **practically obsolete**. We don't prove "witches don't exist" as a hinge; we just reach a point in our form of life where "witch" no longer functions as a causal explanation. The hinge doesn't break; it becomes idle.

  ### 4. Does the River Analogy Smuggle the Conclusion?
  You suspect the river/riverbed analogy might be doing too much work. You are right to be suspicious.

  **Where it works:**
  It illustrates that the distinction between "fluid" (propositions) and "solid" (hinges) is temporal. Hardened sediment (old empirical facts) can become the bed (hinges). The bed (hinges) can erode and become sediment (debatable facts). It supports the idea that the distinction is not ontological.

  **Where it smuggles:**
  The analogy makes the process look **naturalistic** and **inevitable**, like geology. It suggests hinges drift due to the "flow of time."
  But Wittgenstein's point is anthropological, not geological. Hinges shift because **human practices change**.
  *   The riverbed doesn't move on its own; *we* dredge it.
  *   We stop using certain certainties because they no longer serve our form of life.

  The analogy risks making it seem like there is a "real" bed underneath the water. Wittgenstein wants to say there is only the water and the hardened water. There is no "super-bed."

  ### 5. So, is it just Social Agreement?
  It is **Social Agreement + Utility**, but not in a cynical "truth is whatever we vote on" sense.

  It is about **trainings**. We are trained into hinges. A child is trained to accept "objects don't vanish when you look away" not because they have evidence, but because that is how the language game of "object" is played.

  When hinges shift, it is because the **form of life** has shifted.
  *   **Belief Revision:** "I lost the game."
  *   **Hinge Drift:** "We are playing a different game now."

  ### Summary of the Line
  There is no bright line you can draw *in advance*. The line is drawn **retrospectively**.
  *   If you can doubt it without your whole worldview collapsing, it was a belief.
  *   If doubting it makes your language game unintelligible, it was a hinge.
  *   If you find yourself doubting what used to be a hinge, you haven't "corrected" a belief; you have stepped into a new language game.

  The "missing middle layer" you feel is the transition period where a language game is breaking down. Wittgenstein isn't interested in explaining that transition scientifically; he is interested in showing that **certainty is not a mental state, but a public practice.**

  The river analogy holds up only if you remember that the "water" is us, and we are the ones moving the bed.
