answer: |-
  ### 1. The Exam Question

  **Question 4: Structural Constraints on Luminosity and Iteration**

  Consider the following semantic model discussed in seminar. Let $W$ be a set of cases. For each $w \in W$, let $R(w) \subseteq W$ represent the cases compatible with the subject's evidence at $w$. Assume $R$ is reflexive ($w \in R(w)$). We define knowledge $K$ such that $Kp$ is true at $w$ iff $p$ is true at every $v \in R(w)$. A condition $C \subseteq W$ is *luminous* iff $\forall w \in W (w \in C \to R(w) \subseteq C)$.

  (a) Prove that the KK principle ($Kp \to KKp$) is valid on a frame $\langle W, R \rangle$ if and only if $R$ is transitive.

  (b) Williamson's anti-luminosity argument relies on a sorites series of cases $\langle w_1, \dots, w_n \rangle$ where adjacent cases are indiscriminable ($w_{i+1} \in R(w_i)$), but the endpoints are discriminable ($w_n \notin R(w_1)$). This structure entails that $R$ is not transitive. Suppose one attempts to preserve KK by redefining knowledge not via $R$, but via its transitive closure $R^*$. Demonstrate why, in the context of the sorites series described, this repair renders the concept of knowledge trivial. Specifically, show what $R^*$ becomes in this structure and explain why this destroys the possibility of non-trivial luminous conditions.

  *Limit: 1,500 words.*

  ***

  ### 2. Model Answer

  **(a) The Equivalence of KK and Transitivity**

  To prove that KK is valid on a frame $\langle W, R \rangle$ iff $R$ is transitive, we must demonstrate both directions of the biconditional.

  *Direction 1: If $R$ is transitive, KK is valid.*
  Assume $R$ is transitive. Let $M$ be any model on this frame and $w$ any case. Suppose $Kp$ is true at $w$. By the semantics of $K$, $p$ is true at every $v \in R(w)$. To show $KKp$ is true at $w$, we must show that $Kp$ is true at every $u \in R(w)$. Let $u$ be an arbitrary case in $R(w)$. For $Kp$ to be true at $u$, $p$ must be true at every $z \in R(u)$. Since $R$ is transitive, if $u \in R(w)$ and $z \in R(u)$, then $z \in R(w)$. We already established that $p$ is true at every case in $R(w)$. Therefore, $p$ is true at $z$. Since $z$ was arbitrary, $p$ holds throughout $R(u)$, so $Kp$ is true at $u$. Since $u$ was arbitrary, $Kp$ holds throughout $R(w)$, making $KKp$ true at $w$. Thus, transitivity entails KK.

  *Direction 2: If KK is valid, $R$ is transitive.*
  We prove the contrapositive: If $R$ is not transitive, KK is not valid. Suppose $R$ is intransitive. Then there exist cases $w, u, z$ such that $u \in R(w)$ and $z \in R(u)$, but $z \notin R(w)$. Construct a valuation where proposition $p$ is true at every case in $R(w)$ but false at $z$. (This is possible since $z \notin R(w)$). At $w$, $Kp$ is true because $p$ holds throughout $R(w)$. However, consider $u \in R(w)$. At $u$, is $Kp$ true? For $Kp$ to be true at $u$, $p$ must hold throughout $R(u)$. But $z \in R(u)$ and $p$ is false at $z$. So $Kp$ is false at $u$. Since $u \in R(w)$, it is not the case that $Kp$ holds throughout $R(w)$. Therefore, $KKp$ is false at $w$. We have a case where $Kp$ is true but $KKp$ is false. Thus, KK is invalid.

  **(b) The Collapse of the Transitive Closure Repair**

  The anti-luminosity argument posits a finite chain of cases $w_1, \dots, w_n$ where $w_{i+1} \in R(w_i)$ for all $i < n$, representing indiscriminable steps. However, $w_n \notin R(w_1)$, representing a discriminable difference. This structure confirms $R$ is intransitive, which, per part (a), invalidates KK.

  To preserve KK, one might propose defining knowledge via $R^*$, the transitive closure of $R$, rather than $R$ itself. $R^*$ is the smallest transitive relation containing $R$. In a chain-connected sorites series where every $w_i$ is linked to $w_{i+1}$, the transitive closure connects every case to every subsequent case. Since $R$ is reflexive, $R^*$ becomes the universal relation on the set of cases in the series: for any $w_i, w_j$, $w_j \in R^*(w_i)$.

  This repair collapses the distinction between knowledge and necessary truth. If $R^*$ is universal, then $K^*p$ is true at $w$ only if $p$ is true at *every* case in the model. Contingent truths cannot be known, because there will always be some case where they fail.

  This specifically destroys luminosity. Recall $C$ is luminous iff $w \in C \to R(w) \subseteq C$. Under the repair, this becomes $w \in C \to R^*(w) \subseteq C$. Since $R^*(w) = W$, this implies $w \in C \to \forall v (v \in C)$. A condition is luminous only if, whenever it obtains, it obtains everywhere. Non-trivial luminous conditions (like "feeling cold," which obtains at some cases but not others) become impossible. The attempt to save KK via transitive closure forces a choice between iteration and the very possibility of fallible knowledge of contingent states.

  ***

  ### 3. Marking Scheme (25 Points)

  **Point 1: Proof that Transitivity Entails KK (5 marks)**
  *   **Criteria:** Candidate correctly assumes transitivity and shows that if $p$ is true on $R(w)$, it must be true on $R(u)$ for any $u \in R(w)$, thereby satisfying the truth condition for $KKp$.
  *   **Common Error:** Candidates often assume $Kp$ implies $p$ is true at $w$ only, forgetting the universal quantification over $R(w)$, or they assume the conclusion ($KKp$) in the premises.

  **Point 2: Proof that KK Entails Transitivity (5 marks)**
  *   **Criteria:** Candidate constructs a counter-model using three points ($w, u, z$) where links $w-u$ and $u-z$ exist but $w-z$ does not. They must assign truth values to show $Kp$ holds at $w$ while $KKp$ fails.
  *   **Common Error:** Candidates argue informally that "intransitivity breaks iteration" without constructing the specific valuation where $p$ is true on $R(w)$ but false on $R(u)$.

  **Point 3: Identification of $R^*$ as Universal in Sorites (5 marks)**
  *   **Criteria:** Candidate explicitly notes that in a chain-connected series ($w_1 \to w_2 \to \dots \to w_n$), the transitive closure connects the first case to the last, and by reflexivity/universality of the chain, makes every case accessible from every other.
  *   **Common Error:** Candidates claim $R^*$ simply "fixes" the gaps but fail to recognize that in a connected sorites, the closure results in the *universal* relation, not just a transitive one.

  **Point 4: Explanation of Trivialized Knowledge (5 marks)**
  *   **Criteria:** Candidate explains that if $R^*$ is universal, $K^*p$ requires $p$ to be true at all cases. Thus, only necessary truths can be known; contingent knowledge is eliminated.
  *   **Common Error:** Candidates argue that knowledge becomes "too hard" to get, rather than structurally impossible for contingent propositions. They miss the modal collapse.

  **Point 5: Application to Luminosity (5 marks)**
  *   **Criteria:** Candidate connects the universal relation back to the definition of luminosity provided in the prompt. They show that $C \to K^*C$ implies $C \to \text{Necessarily } C$, ruling out non-trivial luminous conditions.
  *   **Common Error:** Candidates discuss the collapse of *knowledge* generally but fail to explicitly apply it to the definition of *luminosity* ($R(w) \subseteq C$) as requested in the prompt's setup.
