answer: |-
  Here is the case run in both directions, mapping the *Copycat* framework onto the Pluto episode, followed by the breaking points, the normative question, and an assessment of your two invented terms.

  ### 1. The Mapping

  To make the *Copycat* analogy hold, we have to treat the Solar System not as a physical place, but as a string of symbols that the cognitive system (the astronomical community) is trying to parse.

  *   **The String:** The list of known major bodies orbiting the Sun. Pre-1990s, the string looks like a clean sequence: `[Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto]`.
  *   **The Alphabet:** The physical properties available to describe the items (mass, orbit shape, orbital clearance, hydrostatic equilibrium, location).
  *   **The Concepts (Rules):** The underlying rules used to group items.
      *   *Rule A (Historical):* "Significant body orbiting the Sun." (Low pressure, low resolution).
      *   *Rule B (Geophysical):* "Rounded by own gravity." (High inclusivity).
      *   *Rule C (Dynamical):* "Cleared orbital neighborhood." (High exclusivity).
  *   **The Pressure:** In *Copycat*, pressure comes from anomalies that break the elegance of the current rule. Here, the pressure is **combinatorial explosion**.
      *   When Ceres was found (1801), it was slotted into "Planet." When dozens more were found in the same belt, the rule "Planet" became too costly. It slipped to "Asteroid." That was a low-temperature slippage; it happened quietly over decades.
      *   In 2005, Eris is found. It is more massive than Pluto. The rule "Planet" now threatens to expand to include dozens of Kuiper Belt Objects (KBOs). The string is no longer a neat list of 9; it's a list of 9 plus an ellipsis that might mean 50, 100, or 200.
      *   This exerts immense pressure on the concept "Planet." The concept is losing its discriminatory power. In *Copycat* terms, the "temperature" rises. The system can no longer run on the old rule without becoming unwieldy.
  *   **The Slippage:** To resolve the pressure, the concept must slip.
      *   *Pre-2006:* "Planet" = Major Body.
      *   *Post-2006:* "Planet" = Dynamically Dominant Major Body.
      *   The object (Pluto) didn't change. The *mapping* of the object to the concept changed because the context (the rest of the string) changed. This is exactly what happens in `abc -> abd`, `mrrjjj -> ?`. If the string gets longer or more complex, the rule governing the transformation might shift from "successor" to "group length."

  **Verdict on Mapping:** You are right that this is conceptual slippage. Dana is right that it was triggered by empirical data. But in the *Copycat* framework, empirical data *is* the pressure that forces slippage. There is no contradiction. The data didn't reveal the "true" planet; it revealed that the old concept couldn't sustain the weight of the new data without losing its utility.

  ### 2. Where the Analogy Breaks (The Vote)

  This is the hardest friction point. *Copycat* is a model of individual (or idealized collective) cognition where the "answer" emerges from competition between codelets. There is no parliament.

  *   **The Break:** In *Copycat*, the "best" answer wins because it has the highest coherence and lowest temperature. In the IAU, the answer won because 424 astronomers raised their hands.
  *   **Institutional Freezing:** *Copycat* explains how a concept *becomes* stable (it finds a local optimum). It does not explain how a concept is *legislated* as stable. The IAU definition is an attempt to artificially lower the temperature of the system by fiat. They are essentially hard-coding a rule that the cognitive system hadn't naturally converged on yet.
  *   **Theory Resources:** The framework has resources for **resistance**. When you force a slippage that the system isn't ready for, you get friction. The public outrage, the continued use of "Pluto the Planet" in casual speech, and the dissent among planetary scientists are the "codelets" rebelling against the forced rule. The theory predicts that a stipulative definition will fail if it violates the deep structural pressures of the domain.
  *   **Silence:** The theory is silent on **legitimacy**. *Copycat* cannot tell us if the IAU *should* have had the power to vote. It treats the vote as an external shock to the system, not an internal cognitive process. It can model the *aftermath* of the vote (the cognitive dissonance), but not the *authority* of the vote.

  ### 3. Normativity (Arbitrary vs. Constrained)

  Dana's move—"If it's fluid, the definition is arbitrary, so the anger is silly"—is a false dichotomy. *Copycat* offers a middle ground: **Constrained but Underdetermined.**

  *   **Not Random:** In the letter string `abc -> abd`, `ijk -> ?`, the answer `ijl` is not "true" in a Platonic sense, but `ijd` is objectively worse because it ignores the structural role of the letters. Similarly, the IAU definition wasn't a roll of the dice. It tried to preserve a specific structural role (dynamical dominance) that matched the historical "major planets."
  *   **Not Determined:** However, they could have chosen the Geophysical rule (Round = Planet). That would also have been coherent. The choice between Dynamical and Geophysical is underdetermined by the data.
  *   **Evaluating the Stipulation:** The framework *does* let you call one stipulation better than another. The metric is **cognitive friction**.
      *   A good definition lowers the temperature. It makes future categorization easy.
      *   A bad definition raises the temperature. It requires constant explanation.
      *   The term "Dwarf Planet" is a high-friction construct. It contains the word "Planet" but is defined as "Not a Planet." This is like saying `ijl` is the answer but insisting `l` is not a letter. It creates constant slippage in language.
      *   **Verdict:** You can tell Dana: The definition wasn't arbitrary, but it was *clunky*. The public anger isn't just sentimentality; it's a reaction to high cognitive friction. The definition requires everyone to run a complex mental subroutine ("Is it round? Yes. Did it clear its orbit? No. So it's a Dwarf Planet, which isn't a Planet") every time they use the word. That is a tax on the concept.

  ### 4. Your Invented Terms

  **(a) Domain Breach vs. Instance Pressure**
  *   **Does it work?** Yes, this is non-trivial and actually aligns with a known problem in machine learning called "distribution shift," but phrased cognitively.
  *   **Instance Pressure:** Finding another Pluto. This tests the boundaries of the existing concept.
  *   **Domain Breach:** Realizing the Solar System is not a closed list of 9 items, but an open population of thousands. This changes the *type* of problem from "Classification" to "Clustering."
  *   **Why it matters:** *Copycat* usually assumes a closed alphabet. If the alphabet itself expands (new types of objects, new scales), the old rules don't just slip; they shatter. Distinguishing these explains why Ceres (Instance Pressure) was handled quietly, but Eris (Domain Breach) caused a crisis. Ceres fit the "Asteroid" cluster eventually. Eris broke the "Planet" cluster entirely. This distinction saves the theory from looking like it treats all new data the same way.

  **(b) Slippage Laundering**
  *   **Does it work?** This is the stronger of the two concepts. It describes the **reification** of a stipulation.
  *   **The Mechanism:** Step 1: IAU stipulates "Dwarf Planet." Step 2: Textbooks print it as fact. Step 3: Students learn it as a natural kind. Step 4: The stipulation feels like a discovery.
  *   **Why it matters:** This explains why the argument persists 20 years later. The laundering is incomplete. For Ceres, the laundering worked (everyone accepts Ceres is an asteroid now). For Pluto, the laundering failed. The concept hasn't "cooled down" enough to become a primitive.
  *   **Utility:** This gives you a way to predict the future. If "Dwarf Planet" survives another 50 years without friction, the laundering is complete, and Dana wins (it becomes the "true" category). If the friction remains, the definition remains "live" and contested. It turns the argument from "Who is right?" to "Has the cognitive freeze set in?"

  ### 5. Where the Theory is Silent

  You asked for honesty on the limits. Here is where the *Copycat* / fluid-concepts framework cannot help you:

  1.  **Power and Exclusion:** The theory models how concepts form, not who owns them. It cannot account for the fact that the IAU voters were mostly stellar astronomers, not planetary scientists. It cannot model the sociological cost of the definition (e.g., a mission to Pluto is now a mission to a "Dwarf Planet," which sounds less prestigious for funding). *Copycat* has no variable for "career incentive."
  2.  **The "Ought" of Coordination:** The framework explains why we *need* stable concepts to communicate. It does not tell us whether it is *better* to have one global standard (IAU) or multiple context-dependent standards (astronomers use one, public uses another). In *Copycat*, elegance is the goal. In science, utility is the goal. Sometimes a "clunky" definition is more useful for funding than an "elegant" one. The theory cannot weigh utility against elegance.
  3.  **The Reality Constraint:** Dana's strongest point is that Pluto *actually* didn't clear its neighborhood. The fluid-concepts view can make it sound like reality is optional, like we could have just voted for Pluto to be a star. The framework struggles to account for the **hard constraint of physical reality**. Slippage can stretch a concept, but it cannot break physics. The theory is silent on where the "stretch limit" is before the concept snaps entirely.

  ### Summary Assessment

  You were right that something conceptual was going on. Dana was right that it was driven by empirical data. The conflict is that she sees the data as *revealing* the category, and you see the data as *pressuring* the category.

  In the *Copycat* view, these are the same thing. Data exerts pressure; pressure forces slippage; slippage creates a new stable state. The IAU vote was an attempt to force the system into a low-temperature state before it got there naturally.

  **Who won?**
  *   **Dana** wins on the **ontology**: Pluto physically hasn't changed, and the new definition tracks physical dynamics better than the old one.
  *   **You** win on the **epistemology**: The *meaning* of "Planet" did not get discovered; it got renegotiated under pressure. The friction we feel is the sound of that negotiation still happening.

  Your term **"Slippage Laundering"** is the best tool you have. It allows you to concede that the definition might stick eventually (if the laundering completes) without conceding that it was "true" in 2006. It keeps the history alive in the concept.
