prompt: |-
  I need help figuring out what last night's arguement was actually about, because my friend Dana and I went at it until almost 1am and I don't think either of us ever located the real disagreement.

  Setup on us: she did her PhD in planetary astronomy (now works on data infrastructure, so she's adjacent to the field rather than in it), and I'm the one who reads the analogy / fluid-concepts stuff — the Copycat letter-string domain, where abc goes to abd and you have to say what ijk goes to, and whether you answer ijl or ijd depends on which way the rest of the string pushes you, and the whole idea is that this kind of slippage is how concepts work generally, it's just visible there because the microdomain is tiny and closed.

  The fight was about Pluto. 2006: the IAU passes a three-part definition (in orbit around the sun, rounded out by its own gravity, has cleared the neighborhood of its orbit — I forget the exact wording, so don't lean on it), Pluto goes into the new "dwarf planet" bucket, Eris had turned up a couple of years earlier roughly Pluto-sized, textbooks get rewritten, the public loses its mind, and people are still mad about it almost twenty years later. Dana's view: nothing conceptual happened at all. We found a lot more stuff out there, the old category was just empirically wrong, we swapped it for a better one. "Planet" meant one thing and then it meant a truer thing, that's it. My view: this is basically a worked example of conceptual slippage — "planet" had been slipping for two centuries (Ceres got called a planet when it was found in 1801 and quietly stopped being one once we found dozens more like it), the Kuiper belt discoveries just turned the pressure up until the old reading couldn't hold, and the 2006 definition was an attempt to freeze a fluid concept by fiat.

  I don't want a survey and I definitely don't want citations or a reading list — I've read the obvious stuff, and I couldn't check anything you gave me anyway. What I want is the case run in both directions.

  First, do the mapping for real. In the letter domain you can say what the alphabet is, what the competing readings are, and what exerts pressure. What are those things here? What's the "string," what's the "alphabet," what were the two or three live readings of "planet" in 2006, and what specifically pushed on each of them?

  Second, where does the analogy break? Copycat has no institution that can vote on an answer, no public, no textbooks, no careers attached to a reading; one community's sense of elegance is the only arbiter. What does it do to the picture that there's an official body that can stipulate, and does the fluid-concepts story have any resources for that, or is it simply outside the theory?

  Third, run it back the other way: what does the episode show about the theory? Dana's sharpest move was that if "planet" is just a fluid concept, then the IAU definition was arbitrary, and if it was arbitrary then the public reaction was pure sentimentality and nobody was owed anything. That felt too fast to me and I couldn't say why. Is there anything in the framework that lets you call a stipulation like that one better or worse — some analogue of the way slippage in the microdomain is constrained by pressure and elegance — or is "arbitrary, just pick one and coordinate" the honest answer?

  Fourth, two things we half-invented while arguing; tell me whether either does any work. (a) "domain breach" versus "instance pressure" — the thought that what happened wasn't new instances straining an existing concept but the domain itself getting bigger (the solar system stopped being a closed list of nine), and that a theory of slippage needs to distinguish these because they'd call for different responses. (b) "slippage laundering" — taking a stipulative definition, treating it as if it had been discovered, and then using the discovered-feeling version to settle later cases, which is roughly what I think happened with "dwarf planet" (officially not a kind of planet, unofficially heard as one by basically everyone). Are those actually distinguishing anything, or do they collapse into something trivial once you say them out loud?

  Last thing: I'd rather hear "the framework has no resources for that" than a forced answer, so please say explicitly what you think the theory is silent about here. Whether I won the argument against Dana matters much less to me than whether I was even right that something conceptual was going on at all.
