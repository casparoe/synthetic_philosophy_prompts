      *   *Verdict:* The framework *does* allow critique. A definition that requires constant explanatory repair (like "Dwarf Planet is not a planet") has high "cognitive friction." It's not arbitrary, but it might be *clunky*. Dana is wrong that it's *purely* arbitrary, but right that the public sentiment isn't a scientific arbiter.

