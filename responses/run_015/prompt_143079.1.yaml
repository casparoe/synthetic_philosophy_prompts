      *   **The Conflict:** A late-night argument about whether the 2006 Pluto reclassification was a *conceptual shift* (User's view: fluid concepts, slippage, freezing by fiat) or an *empirical correction* (Dana's view: better data, old category wrong, new category truer).
      *   **Constraints:** No surveys, no citations, no reading lists. Wants the case run in both directions. Wants specific mapping of the *Copycat* analogy to the Pluto case. Wants to know where the analogy breaks (institutions, voting). Wants to know if the theory offers normative resources (better/worse stipulations) or if it's just "arbitrary coordination." Wants evaluation of two specific coined terms ("domain breach" vs. "instance pressure," "slippage laundering"). Wants honesty about where the theory is silent.
