  You're missing the distinction between counting everyone equally and respecting the boundaries between them. Utilitarianism treats society like a single super-person: just as you might endure a headache today for a vacation tomorrow, utilitarianism lets one person suffer so others can be happier, balancing the books across different lives as if they were moments in one life. Rawls argues this is a fundamental mistake. It is rational for me to sacrifice for my future self, but it is unjust for you to be sacrificed for my benefit, even if the total happiness rises. Your friend actually proves Rawls's point: if we shared one consciousness, sacrificing one part for the whole would be fine, but because we are distinct individuals with separate lives, those boundaries matter morally. Utilitarianism ignores those boundaries by allowing my loss to be canceled out by your gain. That's why your teacher said your fix changes the theory; adding a floor means admitting some things cannot be traded off, which acknowledges the separateness utilitarianism ignores. The disagreement isn't about facts or math; it's about whether it's fair to treat distinct human lives as interchangeable containers for happiness. Utilitarianism says yes, Rawls says no, because you are not a part of me, and I am not a part of you.
