answer: |-
  **The Slumbering Wager: A Defence of the Thirder Position in the Sleeping Beauty Problem**

  The Sleeping Beauty problem stands as one of the most vexing puzzles in contemporary epistemology and the philosophy of probability. It forces a collision between our intuitions regarding objective chance and the peculiar logic of self-locating belief. To set the stage: on Sunday, Beauty is put to sleep. A fair coin is tossed. If it lands Heads, she is awakened on Monday only. If it lands Tails, she is awakened on Monday and again on Tuesday. Crucially, between Monday and Tuesday, her memory of the Monday awakening is erased. On each awakening, she is told the protocol but is given no information regarding the outcome of the toss nor the specific day. Upon finding herself awake, what ought her credence be that the coin landed Heads?

  The Halfer maintains that her credence should remain $1/2$. Her argument rests on the claim that Beauty gains no new relevant information upon awakening; she knew beforehand she would be awakened at least once. Thus, the fairness of the coin should dictate her belief. The Thirder counters that her credence should be $1/3$. From Beauty's perspective, there are three subjectively indistinguishable types of awakening (Heads-Monday, Tails-Monday, Tails-Tuesday), only one of which corresponds to Heads. A third camp, the Double-Halfer, attempts to reconcile these by holding that credence in Heads is $1/2$, yet standard conditionalisation on self-locating evidence is suspended.

  While the debate has often stagnated in a cycle of counter-examples, a resolution requires subjecting these positions to rigorous stress tests regarding decision theory and the weight of indexical evidence. This essay will argue that the Thirder position is the only one that survives the pricing and extreme tests without resorting to an untenable fragmentation of rational agency.

  **The Pricing Test: Credence and Action**

  The first test concerns the functional role of credence. Suppose that on each awakening, Beauty is offered a ticket for £10 that pays £30 if and only if the coin landed Heads, with all accounts settled after the experiment concludes. Should she buy it?

  If Beauty is a Thirder, she calculates the expected value based on her credence of $1/3$. The expected return is $(1/3 \times £30) - £10 = £0$. She is indifferent, which aligns with the long-run frequency of payouts per *awakening*. If she buys the ticket every time she wakes, she breaks even over a large number of awakenings.

  If Beauty is a Halfer, she calculates the expected value based on a credence of $1/2$. The expected return is $(1/2 \times £30) - £10 = £5$. She should eagerly buy the ticket. However, a paradox emerges. Over many repetitions of the *experiment* (not the awakening), the Tails worlds occur 50% of the time but generate two bets, whilst Heads worlds generate only one. If she buys on every awakening, she spends £20 in Tails worlds to win £0, and spends £10 in Heads worlds to win £30. Averaged per experiment, she loses £5.

  The Halfer might object that this merely demonstrates a divergence between fair betting quotients and genuine credences. They argue that the betting odds are skewed because the number of bets is correlated with the truth of the proposition (Tails implies more bets). Therefore, one can hold a credence of $1/2$ while acknowledging that the *bet* is unfair due to the sampling structure. The Double-Halfer explicitly embraces this, severing the link between credence and betting behaviour in self-locating contexts.

  This defence, however, is costly. It renders credence inert. If a degree of belief does not guide rational action in the context in which the agent finds herself, in what sense is it a measure of belief? Credence is ostensibly a guide to decision-making under uncertainty. If Beauty's credence tells her the bet is favourable ($1/2$), but the rational action is to decline (to avoid the sure loss per experiment), her epistemology has failed her pragmatics. To maintain the Halfer view, one must accept that rational agents can systematically make losing decisions based on their own sincere credences. It is more coherent to accept that in contexts involving self-locating uncertainty, credence must track the frequency of the agent's perspectives. The divergence is not a feature of credence, but a symptom of the Halfer's error in defining the relevant sample space. The ticket is offered to *Beauty-now*, not to the abstract experimenter. Therefore, the probability must be relative to the awakening.

  **The Extreme Test: Indexical Weight**

  The second test amplifies the stakes to reveal the underlying principle. Suppose the coin is replaced by a lottery where Beauty is awakened once if she wins (probability $1/1,000,000$) and one million times if she loses. Upon awakening, is it rational for Beauty to believe she has likely won?

  The Halfer is committed to saying her credence in winning should remain roughly $1/1,000,000$ (or $1/2$ in a binary version), as the objective chance of the lottery has not changed. She has learned nothing about the lottery mechanism itself. Yet, intuitively, upon waking, Beauty should be almost certain she has lost. Why? because the vast majority of awakenings occur in the losing worlds. To think otherwise is to ignore the evidence provided by her own existence in that moment.

  The Halfer might dig in, insisting that the prior probability of the coin toss trumps the indexical evidence. However, this renders the Halfer position untenable in the extreme case. If Beauty were told, "If you lose, you will be awakened a trillion times; if you win, once," and she wakes up, maintaining a 50/50 credence (or even $1/1,000,000$) amounts to a form of solipsism regarding her own temporal location. It implies that the fact "I am experiencing an awakening now" carries no weight, despite the fact that the likelihood of experiencing *this* awakening is a million times higher under the hypothesis that she lost.

  Is this difference merely one of degree, or of principle? It is a difference of principle revealed by degree. The original problem ($1$ vs $2$ awakenings) obscures the force of self-locating evidence because the ratio is small. The extreme case clarifies that "I am awake now" is indeed evidence. It is not evidence about the coin's physics, but it is evidence about the coin's outcome relative to the observer. The Thirder position captures this by treating the awakening as a random sample from the set of all possible awakenings. The Halfer treats the awakening as a fixed background condition. The Extreme Test shows that the awakening is not background; it is data. To ignore it is to violate the Likelihood Principle, which states that evidence $E$ supports hypothesis $H$ if $P(E|H) > P(E|\neg H)$. Here, $E$ is "I am awake". $P(E|Tails)$ is effectively higher (in terms of frequency of occurrence) than $P(E|Heads)$.

  **Centred vs. Uncentred Propositions**

  Some philosophers suggest the dispute is verbal. Perhaps the Halfer is right about the *uncentred* proposition "The coin landed Heads" (which is a property of the world), while the Thirder is right about the *centred* proposition "The coin landed Heads and it is now Monday" (which is a property of the agent's perspective).

  This distinction offers a diplomatic truce, but it fails to resolve the normative question Beauty faces. When Beauty asks, "What is the probability of Heads?", she is asking for guidance on how to map her current experience onto the world. She is not asking for a view from nowhere; she is asking for a view from *here*. If we tell her, "Your credence in the uncentred proposition is $1/2$, but your credence in the centred proposition is $1/3$," we have merely relabelled the Thirder's conclusion as the action-guiding one. Since agents live in centred worlds—making decisions at specific times and places—the credence that matters is the centred one. To privilege the uncentred credence is to privilege a God's-eye view that Beauty does not possess and cannot use.

  **Verdict**

  The Sleeping Beauty problem is not a paradox of logic, but a paradox of perspective. The Halfer error lies in conflating the probability of the *chance setup* with the probability of the *outcome given the observer's situation*. The coin is indeed fair, but the sampling of the observer is not.

  The Pricing Test demonstrates that credence must align with rational betting behaviour in the agent's context; to sever this link is to empty credence of its functional purpose. The Extreme Test demonstrates that self-locating information ("I am awake") carries evidentiary weight proportional to the frequency of that location in the possible worlds. To deny this is to ignore the Likelihood Principle.

  Therefore, the verdict must be in favour of the Thirder. Beauty's credence in Heads upon awakening should be $1/3$. This is not a denial of the coin's fairness, but an acknowledgement that probability is relative to the information available to the agent. In a world where Tails generates twice as many opportunities for observation as Heads, a random observation is twice as likely to occur in a Tails world. To believe otherwise is to assume that one's own awakening is a metaphysical constant rather than a contingent event subject to the very probabilities one seeks to assess. Beauty is not merely a witness to the experiment; she is a participant whose frequency of participation depends on the outcome. Rationality demands she account for that.
