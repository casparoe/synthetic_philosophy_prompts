answer: |-
  ### Conceptual Distinctions

  To analyze the Montgomery Bus Boycott normatively, three distinctions are required:
  1.  **Political Obligation (Fairness Principle):** The claim that citizens owe obedience to laws because they benefit from the cooperative scheme those laws sustain (Hart/Rawls).
  2.  **Civil Disobedience:** A public, non-violent, conscientious act contrary to law, usually intended to bring about a change in law or policy (Rawls).
  3.  **Associative Duties vs. Counter-Obligatory Solidarity:** Standard associative duties bind members to a group; *counter-obligatory solidarity* posits that membership in a marginalized group generates a positive moral duty to resist unjust state demands, overriding general political obligation.

  ***

  ### Analysis of the Montgomery Bus Boycott

  **1. The Failure of Fairness-Based Obligation**
  The Principle of Fairness grounds political obligation in reciprocity: if one accepts the benefits of a social scheme, one must bear its burdens. In Montgomery, the segregationist legal order purported to be a cooperative scheme. However, for Black citizens, this scheme was structurally extractive rather than cooperative. While they utilized the bus system (a benefit), the terms of that utilization were designed to enforce civic inferiority. A scheme that systematically denies a class of participants equal standing and dignity cannot generate a fairness-based obligation to obey its rules. The reciprocity required for the Fairness Principle was absent; the state demanded the burden of obedience without providing the benefit of equal protection. Thus, the boycotters had no prima facie fairness-based obligation to obey segregation ordinances.

  **2. Civil Disobedience and the Target of Protest**
  The boycott satisfies the standard tripartite definition of civil disobedience: it was public (announced and sustained), non-violent (strictly disciplined), and conscientious (grounded in moral/religious conviction). However, the legal target requires nuance. The boycotters did not merely violate the segregation statute by sitting in white sections; they withdrew patronage entirely. Technically, refusing to ride a bus was not illegal. The state criminalized the *concerted action* itself (conspiracy to boycott), targeting the economic organization rather than the seating arrangement directly. This complicates the standard model of civil disobedience, which typically involves a direct breach of the unjust law itself (e.g., sitting in the white section). Here, the "disobedience" was the collective economic withdrawal, which the state rendered illegal through ancillary anti-boycott statutes. This confirms the action as civil disobedience, but highlights how states may criminalize the *method* of resistance rather than the underlying moral claim.

  **3. Counter-Obligatory Solidarity**
  Introducing *counter-obligatory solidarity* shifts the normative focus from the relationship between citizen and state to the relationship between citizen and community. This concept suggests that Black citizens in Montgomery had an associative duty to one another to resist humiliation. To ride the bus was not merely obeying the state; it was failing the community's struggle for dignity.

  *   **Clarification:** This concept clarifies the *sustainability* of the boycott. Fairness theory explains why disobedience is *permissible* (lack of reciprocity), but solidarity explains why it was *obligatory* for participants. It accounts for the immense social pressure and mutual aid (carpool systems) that sustained the protest for 381 days.
  *   **Confusion:** However, it risks confusing the normative structure by grounding the right to resist in particularist loyalty rather than universal justice. If the duty to disobey arises solely from group membership, it may lack traction with external observers who do not share that associative bond. It supplements, but should not replace, the universal claim that segregation was unjust.

  ### Conclusion

  The Montgomery Bus Boycott supports an **associative account** of political obligation over a fairness-based one. The fairness account is negative (explaining why obligation *lapsed*), but the associative account is positive (explaining why resistance was *required*). The episode reveals that political obligation for marginalized groups is often mediated through community survival rather than direct state reciprocity.

  One feature of the boycott that standard theories of civil disobedience fail to capture is **constructive institution-building**. Standard theory focuses on the symbolic breach of law to appeal to the majority's conscience. The boycott, however, relied on the creation of parallel institutions (the MIA, complex carpool networks, alternative insurance) that rendered the state's coercive power irrelevant. It was not merely a plea for inclusion but a demonstration of independent collective capacity, a feature standard liberal theories of civil disobedience often overlook in favor of communicative appeal.
