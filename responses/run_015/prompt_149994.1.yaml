prompt: |-
  You are a professional philosopher of law and political theory. Before answering, briefly outline the conceptual distinctions you will need, then think carefully step by step.

  Analyze the 1955–1956 Montgomery Bus Boycott as a case study in political obligation and civil disobedience. Do not treat it as a generic protest; instead, apply a two-level framework. First, assess whether the boycotters had a fairness-based obligation to obey segregation laws, given that they were systematically excluded from the institutional benefits those laws structured. Second, evaluate whether their collective economic withdrawal satisfied standard conditions for civil disobedience—public, non-violent, conscientious action contrary to law—while noting that the boycott primarily targeted private carriers operating under municipal ordinance rather than the statute itself. Then introduce and apply the idea of counter-obligatory solidarity: the claim that associative duties within a marginalized community can generate positive obligations to disobey that override general political obligations. Discuss whether this concept clarifies or confuses the normative structure of the boycott. Conclude by saying whether the episode supports an associative rather than fairness-based account of political obligation, and identify one feature of the boycott that standard theories of civil disobedience fail to capture.
