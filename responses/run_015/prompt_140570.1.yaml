prompt: |-
  I work as a staff attorney at a legal-aid office, and a large share of my caseload is small-estate probate, so I spend most days watching courts decide what pieces of paper mean. Over the past year I have become bothered by something that I think is really a philosophical question, and I would like help getting clear about it. As I understand the practice in my state, the rules point in opposite directions depending on the kind of document. For wills, the testator's actual intention is close to sovereign: if a will leaves my Ford to my nephew John and the woman who signed it had two nephews named John, the court will hear evidence of what she said to her sister about which one she meant, and in many places it will even reform a will that says something she demonstrably did not mean because of a drafting mistake. For contracts, it is the reverse: what counts is what a reasonable person in the other party's position would have understood, and evidence that both parties subjectively meant something else is generally kept out, on the view that the parties' secret intentions are irrelevant. For statutes, courts start with the ordinary public meaning of the words and are wary of legislative history, yet the same judges will quietly correct an obvious scrivener's error or read in a missing word when it is beyond argument what the drafters were trying to say. My partner teaches literature, and in her field the author has been declared dead and nobody thinks her stated intentions settle anything; the thing I cannot work out is that in probate it is precisely because the author is dead that her intention is treated as the one thing that matters. A philosopher friend, hearing me complain about this, mentioned something called the intentional fallacy and something about sentence meaning versus speaker meaning, but I could not tell whether either of those is the tool I am reaching for, and I would rather you not send me off to cases or law-review articles: I am asking about the shape of the argument, not the doctrine.

  The reason this has stopped being idle for me is a bill moving through my state legislature. It would provide that where a will was prepared with automated drafting assistance, the ordinary wills rules flip: no extrinsic evidence of what the testator said she meant, and the text governs conclusively. The sponsors describe it as a clarity rule, and I can see the practical case, but it seems to me to rest on some view about where meaning comes from that I cannot quite state. Two things make it worse. First, essentially every will I see already has diffuse authorship: the client tells a story, a paralegal turns it into paragraphs, I run it through a firm template, and the client signs something whose sentences nobody fully authored in the ordinary sense. Second, in the commercial disputes my office occasionally handles, we now sometimes see agreements whose operative terms are executable code, and there the working assumption among the people I talk to is that the code just is the agreement, with nobody's expectations about it doing any interpretive work at all.

  So here is what I would like. Reconstruct the implicit theory of meaning, or of authorial intention, that this whole pattern presupposes: is it one theory plus an account of what different document types are for, or several theories that sit badly together? Tell me which parts of the pattern the theory strictly requires and which parts merely fit it comfortably, and where the pattern is underdetermined, in the sense that two or three quite different theories of meaning would each license the same practice. Say whether there is a single account that handles all three document types without inconsistency, or whether the inconsistency is the point, because meaning is not a property of texts but of the institution built around them. Then tell me what would actually have to change in day-to-day practice if the profession went wholeheartedly intentionalist, and separately what would change under thoroughgoing textualism. Finally, on the bill: does it presuppose that deference to an author's intention makes sense only where there is a single unified intending subject, is that a coherent place to draw a line given how ghostwritten most wills already are, and what should I think if the same legislature would simultaneously tell me that a machine-authored contract needs no intention at all?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Staff attorney at a legal-aid office. Specializes in small-estate probate. Philosophically inclined but wants conceptual clarity, not case law or law-review citations. Partner is a literature professor (familiar with "death of the author"). Friend mentioned "intentional fallacy" and "sentence vs. speaker meaning."
      *   **Problem:** Inconsistency in legal interpretation across document types (Wills = Intentionalist; Contracts = Objective/Reasonable Person; Statutes = Textualist with exceptions). Now facing a bill that makes automated wills textualist. Also noticing diffuse authorship in wills and code-as-contract in commercial law.
      *   **Goal:** Reconstruct the implicit theory of meaning/authorial intention underlying this pattern. Determine if it's one theory + functional distinctions or multiple conflicting theories. Identify what is required vs. what fits comfortably. Identify underdetermination. Assess if a single consistent account exists or if institutional context defines meaning. Predict practical changes under pure intentionalism vs. pure textualism. Analyze the specific bill regarding automated wills and machine-authored contracts.
      *   **Constraints:** No cases, no law-review articles. Focus on the *shape of the argument* and philosophical structure.

  2.  **Deconstruct the Legal Landscape (as described):**
      *   **Wills:** High Intentionalism. Why? Unilateral, gratuitous, testator is dead (can't clarify), no reliance interests of a counterparty.
      *   **Contracts:** High Objectivism (Reasonable Person). Why? Bilateral/Multilateral, reliance interests, commercial certainty, bargaining.
      *   **Statutes:** Textualism (Public Meaning) + Scrivener's Exception. Why? Democratic legitimacy, notice to public, separation of powers (courts shouldn't legislate).
      *   **Literature:** "Death of the Author" (Text stands alone).
      *   **The Tension:** Why is the dead testator's mind sovereign, while the dead legislator's mind is suspect? Why is the living contractor's mind subordinate to the text?
      *   **The New Bill:** Automated wills $\rightarrow$ Textualism.
      *   **The Reality:** Will authorship is already diffuse (client + paralegal + template). Code contracts assume text = agreement (no intention).

  3.  **Philosophical Frameworks to Apply:**
      *   **Intentionalism (Speaker Meaning):** Meaning is what the author intended to convey. (Gricean pragmatics).
      *   **Textualism/Objectivism (Sentence Meaning):** Meaning is what the words conventionally signify to a reasonable audience.
      *   **Institutional/Functional Theory:** Meaning is determined by the *purpose* of the practice, not just linguistic theory.
      *   **Reliance Theory:** Protection of those who act on the text.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the observation. Validate that this isn't just doctrinal noise; it's a clash of philosophical commitments masked by functional rules.

      *   **Part 1: Reconstructing the Implicit Theory (The "Unified Functionalism" Hypothesis).**
          *   Is it one theory or many? It looks like *Functional Pragmatism*. The law doesn't care about "Truth" of meaning; it cares about "Resolution" of disputes.
          *   *Wills:* Function = Effectuating gratuitous transfer. No reliance interest to protect. Cost of error = frustration of donor's wish. So, dig for intent.
          *   *Contracts:* Function = Facilitating exchange. Reliance interest is paramount. Cost of error = undermining commercial certainty. So, stick to the text (objective).
          *   *Statutes:* Function = Democratic notice + Rule of Law. Citizens need to know what the law is without reading legislative diaries. So, public meaning.
          *   *Conclusion:* It is *not* a single linguistic theory. It is a single *institutional* theory that selects linguistic tools based on social cost.

      *   **Part 2: Required vs. Comfortable Fits vs. Underdetermination.**
          *   *Required:* The link between reliance interests and objectivity. (If reliance matters, text must rule).
          *   *Comfortable:* The "dead author" trope in wills. (Actually, it's about the lack of a counterparty, not death per se).
          *   *Underdetermined:* Statutes. Why not intentionalism? (Separation of powers). Why not pure textualism in wills? (No harm to reliance).
          *   *The "Death of the Author" Paradox:* In lit, the author is dead so the text is free. In wills, the author is dead so the text is enslaved to the intent. *Resolution:* Literature is about *experience*; Wills are about *authority*.

      *   **Part 3: Pure Intentionalism vs. Pure Textualism (Practical Changes).**
          *   *Pure Intentionalism (Everywhere):* Chaos in contracts. Every deal requires depositions about what they "really meant." Text becomes illustrative. Wills would stay same. Statutes would become judicial legislation (judges enforcing "spirit" over letter).
          *   *Pure Textualism (Everywhere):* Wills fail more often (drafting errors kill gifts). Contracts become rigid (no fixing mistakes). Statutes become literalist (absurd results allowed).
          *   *Current System:* A hybrid that minimizes transaction costs.

      *   **Part 4: The Bill and Automated Drafting.**
          *   *The Bill's Premise:* Automation breaks the "unity of intent." If a machine helps write it, we treat it like a statute/code.
          *   *Coherence Check:* Weak. As the user noted, wills are *already* ghostwritten. The "single unified subject" is a fiction in probate too.
          *   *The Code Contract Parallel:* If code is the agreement (no intent), and automated wills are text-only (no intent), we are moving toward a "Protocol Theory" of meaning. Meaning = Execution.
          *   *The Contradiction:* Legislature says "Human Will = Intent" but "Automated Will = Text" and "Code Contract = Text." This suggests a shift from *Psychological Intention* to *Procedural Validity*.
          *   *Advice:* The bill isn't about meaning; it's about liability allocation. It shifts risk from the software provider/court to the testator.

      *   **Part 5: Synthesis/Conclusion.**
