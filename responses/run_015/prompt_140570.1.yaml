  5.  **Refining the Tone:**
      *   Needs to be respectful of the user's expertise (they know the law, I know the philosophy).
      *   Avoid academic jargon where possible, or explain it (e.g., Grice, Searle).
      *   Keep it structured clearly.
      *   Ensure I answer the specific prompts: "Reconstruct implicit theory," "Required vs. Comfortable," "Single account?", "Practical changes," "The Bill."

  6.  **Self-Correction/Nuance Check during Drafting:**
      *   *Correction:* I initially thought about saying "Wills are unique because they are unilateral." I need to make sure I emphasize that *reliance* is the key differentiator, not just unilateralism. A gift *inter vivos* is unilateral but might have delivery requirements. Wills are revocable until death.
      *   *Nuance:* The "Death of the Author" in literature vs. Law. In literature, the text is an aesthetic object. In law, the text is a command. That's why the author matters in law (authority) but not in lit (aesthetics). I need to make this distinction clear.
      *   *The Bill:* The user asks if deference to intention makes sense only with a "single unified intending subject." I need to challenge that. Even with diffuse authorship (client + lawyer), we pretend there is a unity. The bill admits the fiction is breaking down with automation.

