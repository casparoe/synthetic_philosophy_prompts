answer: |-
  This is a profound observation that cuts to the bone of legal theory. You have identified that the law does not operate with a single theory of meaning, but rather with a *functional* theory that selects linguistic tools based on the social costs of error.

  Here is a reconstruction of the implicit philosophy behind your daily work, the shape of the argument, and an analysis of the proposed bill.

  ### 1. The Implicit Theory: Institutional Functionalism, Not Linguistics

  To answer your first question: It is **not** one theory of meaning applied differently. It is **one theory of institutional purpose** that selects different theories of meaning as tools.

  The law is not trying to discover "Truth" in the philosophical sense. It is trying to minimize **social friction**. The "theory of meaning" in any given context is determined by the answer to this question: *Who bears the cost if the text fails to match the internal state of the parties?*

  *   **Wills (Intentionalism):** There is no counterparty. No one relied on the text to their detriment while the testator was alive (because wills are revocable). The only "victim" of a drafting error is the testator's plan. Therefore, the cost of error is highest if we ignore intent. The text is treated as *evidence* of a mental state, not the operative act itself.
  *   **Contracts (Objectivism/Textualism):** There are counterparties. They relied on the text to allocate risk and price goods. If we allow subjective intent to override the text, commercial certainty collapses. The cost of error is highest if we *privilege* secret intent. The text is treated as the *operative act* itself.
  *   **Statutes (Public Meaning Textualism):** The "counterparty" is the public. Citizens must be able to rely on the published word to order their lives. Legislative history is private; the text is public. The cost of error is highest if citizens are bound by secrets they couldn't know. However, the "scrivener's error" exception exists because the democratic legitimacy of the legislature presupposes they are not idiots; correcting an obvious typo preserves the institution's dignity without undermining public notice.

  **The "Death of the Author" Paradox:**
  Your partner's field and your field use the "dead author" fact to reach opposite conclusions because the *objects* are different.
  *   **Literature:** The text is an aesthetic object. Once published, it belongs to the culture. The author's authority ends where the reader's experience begins.
  *   **Wills:** The text is a command. Authority is the only thing that matters. Because the author is dead, they cannot correct the command. Therefore, the court must act as the author's proxy to ensure the command was validly issued.
  *   **Statutes:** The text is a rule. The "author" is a collective body (the Legislature) that continues to exist. If the court hunts for the "intent" of a past legislature, it usurps the power of the *current* legislature.

  ### 2. Required vs. Comfortable Fits vs. Underdetermination

  **What the Theory Strictly Requires:**
  The only strict requirement is the link between **Reliance** and **Objectivity**.
  *   If a third party relies on the text to their detriment (Contracts, Statutes), the theory *requires* an objective standard (what a reasonable person sees).
  *   If no third party relies on the text (Wills), the theory *requires* a subjective standard (what the decedent meant).
  *   *Proof:* If a will creates a trust that beneficiaries rely on during the testator's life, courts often become more textualist regarding those specific provisions.

  **What Merely Fits Comfortably:**
  *   **The "Single Author" Fiction in Wills:** It fits comfortably to pretend the testator wrote the will alone. It simplifies the narrative of "sovereign intent." But as you noted, this is factually false. The theory doesn't *require* a single author; it requires a single *beneficiary of the reliance interest* (the testator's plan).
  *   **The "Scrivener's Error" in Statutes:** This fits comfortably with the idea that legislators are rational, but it is technically inconsistent with pure textualism. It is allowed only because the error is so obvious that correcting it doesn't actually impair public reliance.

  **Where the Pattern is Underdetermined:**
  This is where two or three different theories could license the same practice.
  *   **Statutory Interpretation:** You could justify textualism via **Democracy** (only the text was voted on) OR via **Liberty** (citizens need fair notice) OR via **Separation of Powers** (judges shouldn't legislate). All three lead to textualism, but they break down differently at the margins. If you believe the "Democracy" theory, you might allow more legislative history (to understand the vote). If you believe the "Liberty" theory, you ban it. The current practice is underdetermined; it muddles these justifications.
  *   **Contract "Reformation":** Courts sometimes reform contracts for mutual mistake. This is a pocket of intentionalism inside objectivism. This is licensed by **Equity** (unconscionability) rather than a theory of meaning.

  ### 3. Is the Inconsistency the Point?

  **Yes.** Meaning is not a property of the text; it is a property of the **institution built around it.**

  If you tried to impose a single account (e.g., "Meaning is always the author's intent") across all three, the legal system would fracture.
  *   **Unified Intentionalism:** Contracts would become unenforceable (everyone claims they meant something else). Statutes would become judicial legislation (judges enforcing the "spirit" over the letter).
  *   **Unified Textualism:** Wills would fail constantly due to clerical errors, frustrating the core purpose of property transmission.

  The inconsistency is a feature, not a bug. It is a **context-sensitive semantic protocol.** The law treats the text as a *window* into a mind when looking inward (wills), and as a *wall* between minds when looking outward (contracts/statutes).

  ### 4. Practical Changes: Pure Intentionalism vs. Pure Textualism

  If the profession went **Wholeheartedly Intentionalist**:
  *   **Wills:** No change.
  *   **Contracts:** Discovery would explode. Every breach of contract suit would require depositions of every negotiator about their subjective understanding. "Integration clauses" (merger clauses) would become worthless. Commercial pricing would increase to account for litigation risk.
  *   **Statutes:** Courts would become super-legislatures. Lawyers would argue not about what the law says, but about what the "spirit" of the 1974 Congress was. Stability would vanish.

  If the profession went **Thoroughgoing Textualist**:
  *   **Wills:** Small-estate probate would become a graveyard of failed gifts. "My nephew John" where there are two Johns would result in both getting nothing (ambiguity voids the gift) or a rigid default rule, regardless of what the aunt told her sister. The "human element" of probate would vanish; it would become purely administrative.
  *   **Contracts:** Certainty would increase, but fairness would decrease. Obvious typos would be enforced literally. (e.g., selling a car for $1.00 because that's what the contract said, even if both parties meant $10,000).
  *   **Statutes:** Absurd results would be common. Courts would say, "We know this leads to madness, but the text commands it."

  ### 5. Analysis of the Bill: Automated Drafting and the "Unified Subject"

  The bill proposes that **Automated Wills = Textualism.**

  **Does it presuppose that intention requires a single unified subject?**
  Yes, implicitly. The bill assumes that when a human writes a will, there is a "mind" to search. When a machine assists, the "mind" is contaminated or diluted, so we retreat to the text.

  **Is that a coherent line given ghostwriting?**
  No. It is philosophically incoherent, but *administratively* convenient.
  As you noted, the "unified subject" in probate is already a fiction. The client provides the raw data (intent), the paralegal provides the syntax, the template provides the structure, and you provide the legal validation. We *pretend* this is the testator's voice to satisfy the ritual of testamentary freedom.
  The bill admits that when software enters the chain, the fiction is too thin to maintain. It treats the software as a "third party" whose introduction destroys the unilateral nature of the act, turning it more like a contract (where the text rules).

  **The Machine-Authored Contract Parallel:**
  You noted that in code-based contracts, the assumption is "the code is the agreement." This is the emergence of a **Protocol Theory of Meaning**.
  *   **Human Law:** Meaning = Intention + Text.
  *   **Code Law:** Meaning = Execution.

  If the legislature tells you that a machine-authored contract needs no intention (it just runs), but a human-authored will needs intention, they are drawing a line between **Biological Authority** and **Algorithmic Authority**.

  **What should you think?**
  You should view this bill not as a clarification of meaning, but as a **shift in liability.**
  *   **Current Rule (Intentionalist Wills):** If the will is wrong, the Court fixes it to match the intent. The State absorbs the cost of interpretation.
  *   **Proposed Rule (Textualist Automated Wills):** If the will is wrong, the gift fails. The Testator (and their estate) absorbs the cost of the error.

  The bill is likely driven by a fear that software vendors will be sued for "misinterpreting" client intent. By making the text conclusive, the legislature immunizes the software providers. They are sacrificing the "sovereign intent" of the testator to protect the scalability of the legal-tech market.

  ### Summary of the Argument Shape

  1.  **Premise:** Legal meaning is not linguistic; it is institutional.
  2.  **Mechanism:** The law chooses between Intentionalism and Textualism based on **Reliance Interests**.
      *   High Reliance (Contracts/Statutes) $\rightarrow$ Textualism.
      *   Low Reliance (Wills) $\rightarrow$ Intentionalism.
  3.  **The Tension:** The "Author" is a useful fiction. In wills, we need the Author to exist to justify the transfer. In contracts, we need the Author to disappear to justify the certainty.
  4.  **The Bill:** It attempts to reclassify Wills from "Low Reliance" to "High Reliance" (or rather, "High Systemic Integrity") when automation is involved. It treats the software as a reliance-inducing interface that the public must trust literally.
  5.  **Conclusion:** The inconsistency you feel is the friction between **Human Agency** (which is messy and internal) and **Systemic Efficiency** (which is rigid and external). The law usually hides this friction. The bill exposes it. It says: "If you use a machine, you are part of the System, and the System reads text, not minds."

  You are not seeing a breakdown of doctrine; you are seeing the boundary where the law stops treating people as *authors* and starts treating them as *users*.
