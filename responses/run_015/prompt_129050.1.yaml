answer: |-
  This is a profound observation, and it cuts right to the bone of the tension between empirical reality and institutional operability. Given your background in oceanography, you'll recognize this immediately: it's the difference between measuring a system as it *is* and measuring it in a way that allows you to *intervene* without crashing the experimental setup.

  Here is a reconstruction of the implicit philosophical theory behind current humanitarian protocols, an assessment of its consistency, and what a shift to Sen's entitlement framework would actually require.

  ### 1. The Implicit Theory: Methodological Naturalism and Volitionist Ethics

  The filing practice you describe rests on three interconnected philosophical commitments. They form a coherent, albeit distorted, worldview designed to minimize friction for the aid agency, not to maximize truth about the famine.

  **A. Causation: Proximate Physicalism (The "Physics" Commitment)**
  You asked if it treats causation like isolating variables. Yes, but specifically it relies on a **Humean regularity view of causation** applied only to physical events.
  *   **The Commitment:** A cause must be a discrete, observable event preceding the effect (drought $\rightarrow$ crop failure $\rightarrow$ starvation).
  *   **The Exclusion:** Governance is treated not as a variable, but as *background conditions*. In your plankton work, if you are measuring the effect of nutrient upwelling, you might treat water temperature as a controlled constant. In aid protocols, *political stability* is treated as the controlled constant. If the government collapses, that is "noise" or "context," whereas rain is "signal."
  *   **Why?** Physical causes are exogenous (outside the system). Political causes are endogenous (inside the system). By classifying famine as natural, agencies treat the crisis as an external shock to the system rather than a failure *of* the system. This preserves the fiction that the state is a partner rather than a perpetrator.

  **B. Moral Responsibility: The Volitionist Gap**
  You noted the legal inconsistency regarding war crimes. This rests on a **volitionist theory of responsibility**.
  *   **The Commitment:** Moral responsibility requires specific intent (*mens rea*) or direct physical action. A soldier blocking a convoy is an agent causing harm. A bureaucrat designing a procurement policy that starves a region is seen as merely "managing," even if the outcome is identical.
  *   **The Exclusion:** This ignores *structural violence* or *negligence*. It creates a moral binary: Nature is blameless (tragedy); Soldiers are blameworthy (crimes). The vast middle ground—where policy indifference, corruption, or ideological rigidity causes death—is philosophically erased. It is treated as "misfortune" rather than "injustice."
  *   **Why?** This protects the principle of **Humanitarian Neutrality**. If starvation is a tragedy, anyone can help. If it is a political injustice, taking a side becomes necessary. Agencies avoid the latter to maintain access.

  **C. Value Theory: The Depoliticization of Suffering**
  *   **The Commitment:** Suffering is most "worthy" of intervention when the victim is passive and the donor is benevolent.
  *   **The Exclusion:** If the victim's starvation is due to a loss of entitlement (e.g., wage collapse), restoring it requires political negotiation (raising wages, changing laws). This turns the victim into a *claimant* with rights, rather than a *beneficiary* with needs.
  *   **Why?** It maintains a hierarchy of agency. The donor retains the power of the "giver." Acknowledging entitlement failure shifts power to the recipient, who can demand their rights be restored rather than beg for food.

  ### 2. Is It Consistent? (The Pragmatic Incoherence)

  You identified the inconsistency: Farmers are rational agents in insurance markets but passive biological entities in famine relief.

  **Philosophically, it is incoherent.** It holds two contradictory models of human agency simultaneously:
  1.  **Neoclassical Agent:** In development/insurance, the farmer is a rational actor making decisions under risk.
  2.  **Biological Subject:** In emergency relief, the human is a body requiring calories to survive, stripped of social or economic context.

  **Functionally, however, it is highly coherent.** It is a **functional fiction**.
  The inconsistency is a feature, not a bug. It allows agencies to navigate the "sovereignty trap."
  *   If they treat farmers as rational agents during a famine, they must ask why the market failed. That implicates the government.
  *   If they treat them as biological subjects, they can bypass the government (or pretend to) and just deliver calories.
  *   The "Natural Disaster" label is a **technology of access**. It is a speech act that unlocks budget lines and visas. It is not a scientific diagnosis; it is a diplomatic protocol.

  So, to answer your question: The practice does not need a coherent philosophy behind it. It needs a coherent *operating environment*. The philosophical incoherence is the price paid for operational continuity in hostile political landscapes.

  ### 3. Taking Sen Seriously: What Would Change?

  If you were to rewrite the protocols based on Sen's **Entitlement Approach** (which views famine as a collapse in the *mapping* of commodities to people, not just a decline in commodities), the changes would be radical. Sen shifts the ontology from *food availability* to *command over food*.

  Here is what the new protocols would look like:

  **A. Diagnostic Shift: From Meteorology to Economics**
  *   **Current:** Measure rainfall, soil moisture, crop yields.
  *   **Sen-Compliant:** Measure wage rates, food prices, employment levels, and social security coverage.
  *   **The Change:** A famine declaration would not trigger when rainfall drops below $X$ mm, but when the *exchange entitlement* of the laboring class drops below subsistence, regardless of grain stocks. You would be measuring *purchasing power collapse* rather than *caloric deficit*.
  *   **Implication:** You might declare a famine in a region with a surplus of grain (like Bengal 1943). This immediately politicizes the diagnosis because it implies the distribution mechanism is broken.

  **B. Response Shift: From Logistics to Rights**
  *   **Current:** Ship food, set up feeding centers (treating the symptom).
  *   **Sen-Compliant:** Cash transfers, public works employment, legal protection of markets, stopping exports (treating the cause).
  *   **The Change:** Aid budgets would move from logistics (ships/trucks) to economic support (subsidies/wages). The intervention isn't "feeding the hungry" but "restoring their ability to feed themselves."
  *   **Implication:** This violates **Humanitarian Neutrality**. Restoring entitlements often means intervening in labor laws, tax policies, or trade agreements. You are no longer a neutral observer; you are an economic regulator.

  **C. Accountability Shift: From Tragedy to Liability**
  *   **Current:** The donor is a savior; the recipient is a victim of nature.
  *   **Sen-Compliant:** The state is a duty-bearer; the citizen is a rights-holder.
  *   **The Change:** Protocols would require an assessment of *state failure* before *aid delivery*. If the state is actively undermining entitlements (e.g., exporting grain during a shortage), the protocol would mandate sanctions or conditional aid, not just supplementation.
  *   **Implication:** This breaks the "access" model. Governments that cause famines via policy will expel agencies that diagnose famines via policy. The "functional fiction" collapses.

  ### 4. The Oceanographer's Perspective

  To bring this back to your experience: Imagine you are measuring plankton blooms.
  *   **Current Aid Model:** You notice the plankton are dying. You check the temperature. If the water is too hot, you declare a "Thermal Disaster" and add coolant. You ignore that a factory upstream changed its effluent chemistry, because "chemistry" is political/regulatory, but "temperature" is natural.
  *   **Sen Model:** You analyze the entire ecosystem. If the plankton are dying because the nutrient flow was diverted by a dam upstream, you declare a "Systemic Diversion Failure." You don't add coolant; you demand the dam operator change their flow.

  The reason the aid agencies don't do the latter is not that they don't understand the science. It's because the dam operator holds the visa for the research station.

  ### Summary

  The implicit theory is **Methodological Naturalism** paired with **Volitionist Ethics**. It is philosophically inconsistent regarding human agency but pragmatically consistent regarding institutional survival.

  Adopting Sen's view requires abandoning the distinction between "humanitarian" and "political." It demands that we treat economic policy as a life-support system equivalent to rainfall. If we did that, famine would rarely be classified as a natural disaster. It would mostly be classified as **governance failure**. And that is a diagnosis most international bodies are structurally designed to avoid.
