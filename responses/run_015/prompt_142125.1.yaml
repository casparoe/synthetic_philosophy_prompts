answer: |-
  You should reject **(3)**.

  To keep (1) (Good's Theorem) and (5) (the observed reasonableness of refusal), you must deny the inference that the theorem entails a universal prohibition on refusing information. The error lies in the universal quantifier in (3): *"declining costless information is **never** rational."*

  This inference relies on (2), specifically the claim that the proof places *"no restriction on... what she happens to care about."* That claim is false. The proof relies on a substantive restriction on the domain of the utility function. By rejecting (3), you preserve the mathematical truth of (1) while acknowledging that its preconditions are not met in the cases described in (5).

  Here is how the three candidates ((a), (b), and (c)) divide the labor, what each costs you, and why (a) is a red herring while (b) and (c) are the substantive keys.

  ### 1. Dismissing Candidate (a): Risk and Expectation
  You ask if there is a reading of *rational* on which *ex ante* optimality is not enough. Within the framework of Expected Utility Maximization (EUM), the answer is **no**.

  Good's Theorem is robust against risk aversion regarding *outcomes*. If an agent has a concave utility function over money or health, the theorem still holds. The "expected value" in the theorem is expected *utility*, not expected dollars. If the signal allows you to avoid a catastrophic loss, the utility gain from avoiding that loss (due to concavity) makes the information even *more* valuable, not less.

  For (a) to work, you would have to reject EUM itself in favor of a theory where agents are risk-averse over *uncertainty* or *information states* (e.g., Risk-Weighted Expected Utility). But you stated you wish to keep (1). Good's Theorem is a theorem *of* EUM. If you adopt a non-EUM framework to save the intuition in (a), you likely break (1).

  **Verdict:** (a) does not explain the refusals if you keep (1). It asks you to pay too high a price (abandoning the formalism you want to keep).

  ### 2. Embracing Candidate (b): Utility Over Belief States
  This is the correct explanation for the **spoiler**, **genetic test**, and **faithful partner** cases.

  Good's Theorem assumes that utility is defined over **world states** (outcomes), and that information affects utility *only* by allowing the agent to select a better action to influence those states. The signal itself is instrumentally valuable but intrinsically neutral.

  However, in the cases you list, the signal is not intrinsically neutral.
  *   **The Spoiler:** The utility of reading the novel is a function of $U(\text{Reading}, \text{Ignorant})$. If you learn the ending, the outcome changes to $U(\text{Reading}, \text{Knowing})$. These are different outcomes.
  *   **The Genetic Test:** Living ten years with a diagnosis is a different world state than living ten years without one, even if the physical disease progression is identical. The *knowledge* is a constituent of the outcome.

  **Where (2) fails:** Premise (2) claims the proof requires only that *"her utility function is defined over outcomes and does not itself shift when she learns."* This is the hidden restriction. If the utility function takes *belief states* or *information states* as arguments (i.e., $U(\text{outcome}, \text{belief})$), then receiving the signal *changes the outcome* directly, not just via action.

  In technical terms, the "actions available" condition in (2) is violated. The action "Live my life" is not the same action after "Look" as it is after "Don't Look," because the *consequences* of that action differ (one includes the pain of knowing). Therefore, the signal is not **costless**. It has a psychic cost (or benefit) built into the reception.

  **The Cost:** You must admit that "costless information" is a much narrower category than colloquially supposed. Almost all information has some intrinsic utility (curiosity, anxiety, hope).
  **The Unfalsifiability Worry:** You asked if re-describing outcomes makes the theorem unfalsifiable. It does not. It makes the theorem **conditional**. The theorem says: *If* information has no intrinsic utility and no causal impact other than guiding action, *then* it has non-negative value. If you observe a rational refusal, you have empirically demonstrated that the information *did* have intrinsic disutility (or cost). This is a feature, not a bug: it forces you to identify the hidden cost (e.g., anxiety) rather than calling the agent irrational.

  ### 3. Embracing Candidate (c): Strategic Ignorance and Game Theory
  This is the correct explanation for the **negotiator**, **insurance**, and **witness** cases.

  Good's Theorem is a result in **Decision Theory** (one agent vs. Nature). It does not hold in **Game Theory** (one agent vs. other agents).
  *   **The Negotiator:** If you know your reservation price, you may leak that knowledge (or be unable to bluff). Your opponent's strategy changes in response to your information.
  *   **Insurance:** If you know you are high-risk, you buy insurance; the insurer, anticipating this, raises premiums or denies coverage. The "Nature" you are facing is actually a strategic agent reacting to your information.

  In game-theoretic settings, the Value of Information can be strictly negative. Knowing more can restrict your equilibrium strategies or force opponents into strategies that harm you.

  **Is (c) a genuine limit or a misuse?** It is a **genuine limit of scope**. Applying (1) to multi-agent strategic contexts is a category error. The theorem is true in its domain (single-agent decision problems), but (3) illicitly generalizes it to domains (strategic interaction) where the assumptions (specifically that the environment does not react to the information) are false.

  **The Cost:** You must distinguish between *parametric uncertainty* (nature) and *strategic uncertainty* (agents). Rationality in the latter sometimes requires self-imposed ignorance (commitment devices).

  ### 4. The Colleague's Fourth Point (Preference Change)
  Your colleague's point is a specific instance of **(b)**.
  If learning changes what you want, your utility function has shifted from $U_1$ to $U_2$. Good's Theorem calculates the value of information for $U_1$. If $U_1$ values the state of "being a person who wants X" and the signal turns you into "a person who wants Y," $U_1$ may correctly calculate that receiving the signal is bad.
  However, the deeper issue is diachronic rationality. If the "later self" is effectively a different agent, standard decision theory (which assumes a single, persistent agent) lacks the vocabulary to adjudicate the conflict. Acknowledging this doesn't break the theorem; it just places these cases outside its jurisdiction, similar to (c).

  ### Summary: The Reconstruction
  To resolve your unease while keeping (1) and (5):

  1.  **Reject (3).** It is false that declining costless information is *never* rational. It is only never rational *for a single agent facing nature, with stable preferences over external outcomes, for whom the signal has no intrinsic utility.*
  2.  **Modify (2).** Acknowledge that the proof *does* place restrictions on what the agent cares about. She must not care about the information state itself.
  3.  **Categorize the Refusals:**
      *   **Spoilers/Genetic Tests (b):** These are cases where information has **intrinsic disutility**. The signal is not costless. The agent is maximizing $U(\text{world}, \text{belief})$. Good's Theorem doesn't apply because the "costless" condition is violated.
      *   **Negotiators/Insurance (c):** These are cases of **strategic interaction**. Good's Theorem doesn't apply because the "single agent vs. nature" condition is violated.
      *   **Preference Change (Colleague's 4th):** These are cases of **diachronic inconsistency**. Decision theory doesn't apply because the "stable agent" condition is violated.

  **What this costs you:**
  You lose the comforting simplicity of the slogan "information is always good." You must accept that rational agents often pay to remain ignorant because (1) knowing hurts (psychic cost), or (2) knowing binds their hands in a game (strategic cost).

  But you save the theorem. Good's Theorem remains a rigorous truth about the instrumental value of evidence in parametric decision problems. You simply stop trying to use it as a universal normative hammer for all human epistemic conduct. The "irrationality" your colleague detects is not in the people refusing the information; it is in the application of a single-agent, instrumentalist theorem to rich, psychological, and strategic human contexts.
