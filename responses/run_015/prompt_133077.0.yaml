answer: |-
  1. The norm was kept alive solely by the participants, who clung to an archaic code of personal honor while the broader public and media had already shifted to modern legalistic norms. Their isolation demonstrates that without a supporting community of judgment, honor codes become private delusions rather than public mandates.
  2. Choosing swords over pistols suggests the ritual had become theatrical rather than lethal, indicating that the honor at stake was performative instead of existential. This shift supports Appiah's view that when the risk of death vanishes, the moral gravity of the duel collapses into mere spectacle.
  3. The media's ridicule effectively destroyed the practice's prestige, proving Appiah's argument that shame and laughter dismantle honor codes faster than rational moral arguments ever could. The public mockery transformed the duelists from heroes into fools, removing the social reward necessary to sustain the norm.
  4. However, the theory underestimates the state's role, as legal bans and police intervention had already criminalized the act before the laughter finished the job. Appiah's focus on social psychology overlooks how coercive state power restricts the physical possibility of maintaining violent norms.
  5. Finally, the decline reflects changing economic interests where political power shifted from personal reputation to party machinery and media management. This structural change meant that risking death or arrest offered no material advantage, rendering the honor code economically obsolete regardless of public shame.
