      *(Self-Correction during drafting)*: I need to be careful not to say Frequentism is "wrong." I need to explain how a sophisticated Frequentist (like Salmon) handles it. The user's argument assumes a *naive* Frequentist.
      Also, the user asks about Step (1). If they keep (1), they are a Frequentist. If they reject (1), they are likely a Bayesian or Propensity theorist. I should outline the cost of rejecting (1).

      *Decision:* The strongest move is to challenge (5) and refine (7). (5) assumes realism about single-case chances. (7) assumes the only filter is epistemic sample size. Causal relevance is an *ontic* filter, not just epistemic.

      *Wait, one more thing:* The user mentions "single-event causal attribution in tort law." This is the "Probability of Causation" (PC). $PC = (RR-1)/RR$. This relies entirely on reference classes. If RCP is unsolvable, PC is nonsense. I need to confirm this tension.

