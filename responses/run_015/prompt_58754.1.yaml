answer: |-
  Your hypothesis is substantially correct. The persistence of this impasse is not primarily a result of conflicting data or predictive models regarding the consequences of each approach. As you noted, both camps concede considerable uncertainty about empirical outcomes (deterrence, social healing, etc.). If the dispute were merely empirical, new data or expert testimony could resolve it. Instead, the deadlock stems from a **normative and conceptual divergence** masked by a **shared vocabulary**.

  Below is a diagnosis of the structure of this impasse, followed by an assessment of what might constitute progress.

  ### I. Diagnosis of the Impasse

  The disagreement is principally **normative**, complicated by **conceptual ambiguity**, and sustained by **unargued starting commitments**.

  **1. Normative Divergence: Competing Hierarchies of Goods**
  While both camps claim to value "truth, justice, and reconciliation," they prioritize these goods differently based on distinct normative frameworks.
  *   **Camp A (The Stability/Truth Framework):** Operates on a **consequentialist** ethic focused on the survival of the democratic order. Their primary normative commitment is that *political existence precedes legal perfection*. They argue that without a viable transition (secured by appeasing the security apparatus), there will be no state left to administer justice. For them, "justice" is partially constituted by the prevention of future authoritarianism.
  *   **Camp B (The Rights/Accountability Framework):** Operates on a **deontological** ethic focused on the moral status of the victim and the rule of law. Their primary normative commitment is that *legitimacy precedes stability*. They argue that a state built on impunity is morally indistinguishable from the prior regime and lacks the legitimacy to govern. For them, "justice" requires retributive accountability to restore the moral order.

  **2. Conceptual Ambiguity: The Shared Vocabulary Trap**
  The two camps use the same terms to describe different concepts, creating the illusion of agreement where there is none.
  *   **"Justice":** Camp A defines this as *restorative and political* (knowing the truth, reparations, ensuring non-recurrence). Camp B defines this as *retributive and legal* (criminal liability, punishment, upholding statutes).
  *   **"Reconciliation":** For Camp A, reconciliation is a pragmatic condition of *coexistence* and non-violence. For Camp B, it is a moral condition of *acknowledgment and accountability*; without punishment, reconciliation is viewed as forced silence.
  *   **"Impunity":** Camp A views amnesty as a *sacrifice* of impunity to gain truth (a trade-off). Camp B views amnesty as the *entrenchment* of impunity (a surrender).

  **3. Addressing Different Questions**
  The camps are answering different practical questions under the common heading of "Transitional Justice."
  *   **Camp A asks:** "How do we dismantle the authoritarian structure without triggering a coup?" Their focus is on *regime security*.
  *   **Camp B asks:** "How do we vindicate the rule of law after it has been weaponized?" Their focus is on *legal legitimacy*.
  Because they are solving different problems, evidence offered by one side often appears irrelevant to the other. Evidence about coup risks (Camp A's concern) does not address Camp B's moral imperative. Evidence about legal norms (Camp B's concern) does not address Camp A's security imperative.

  **4. Unargued Starting Commitments**
  The decisive work is being done by premises neither side is debating:
  *   **Camp A's Premise:** The security apparatus is a monolithic veto player. If prosecuted, they *will* destabilize the government. (This is treated as a fixed constraint rather than a negotiable variable).
  *   **Camp B's Premise:** International legal norms and moral duties prohibit amnesty for crimes against humanity, regardless of political cost. (This is treated as an absolute rather than a consideration to be weighed against democratic collapse).

  ### II. Pathways to Progress

  Given that the impasse is normative and conceptual rather than empirical, standard fact-finding missions will not resolve it. Progress requires **conceptual clarification**, **institutional redesign**, or **reframing**.

  **1. Conceptual Distinction: "Political Justice" vs. "Legal Justice"**
  The advisory group should explicitly distinguish between *political justice* (the conditions necessary for a democratic transition to survive) and *legal justice* (the adjudication of individual criminal liability).
  *   **Action:** Acknowledge that these two forms of justice may be in tension during the transition phase. This removes the accusation of bad faith. Camp A is not "against justice"; they are prioritizing political justice to enable the state's existence. Camp B is not "ignoring reality"; they are prioritizing legal justice to ensure the state's legitimacy.
  *   **Benefit:** This allows the group to discuss *trade-offs* explicitly rather than arguing over the definition of justice.

  **2. Institutional Redesign: Sequencing and Conditionality**
  The current proposal presents a binary choice (Amnesty vs. Trials). A hybrid model may resolve the normative conflict by separating the processes temporally or conditionally.
  *   **Sequencing:** Establish a Truth Commission *first* (satisfying Camp A's need for disclosure and stability), with a mandate to refer cases for prosecution *later* once the democracy is consolidated and the security apparatus is reformed (satisfying Camp B's need for accountability).
  *   **Conditionality:** Instead of blanket amnesty, use a "compliance-based" model. Perpetrators receive provisional immunity that is only ratified after a set period of democratic stability. If they destabilize the government, the immunity is voided. This aligns Camp A's security concerns with Camp B's demand for accountability.

  **3. Reframing the Empirical Question**
  Since both sides concede uncertainty, the empirical inquiry should shift from general theories (e.g., "Does amnesty work?") to specific threat assessments regarding the *local* security apparatus.
  *   **Action:** Commission a confidential, joint assessment of the security apparatus's actual capacity and willingness to stage a coup.
  *   **Benefit:** If the threat is lower than Camp A assumes, Camp B's approach becomes more viable. If the threat is higher than Camp B assumes, Camp A's approach becomes a moral necessity rather than a political convenience. This grounds the normative debate in a shared, specific reality.

  **4. Reframing the Goal: From "Resolution" to "Managed Tension"**
  It is possible that no theoretical synthesis will satisfy both normative commitments fully. Transitional justice often requires living with contradiction.
  *   **Action:** The advisory group might recommend a package that includes *both* a truth commission with amnesty powers *and* a specialized prosecutorial unit for "most responsible" leaders (a la the Special Court for Sierra Leone or the hybrid approach in East Timor).
  *   **Benefit:** This accepts that some perpetrators will be amnestied (Camp A wins on stability) while establishing the principle that leadership bears criminal liability (Camp B wins on impunity). It signals that the state rejects total impunity without triggering total confrontation.

  ### Conclusion

  Your hypothesis is correct: the impasse is a clash of normative priorities disguised as a policy debate. Progress will not come from proving one side's facts right, but from **decoupling the concepts of truth and punishment** institutionally.

  The most viable path forward is **institutional redesign** that sequences or layers these mechanisms. By acknowledging that the *survival* of the democracy (Camp A's goal) is a prerequisite for the *legitimacy* of the democracy (Camp B's goal), the group can agree on a timeline where truth recovery secures the present, and targeted prosecutions secure the future. If the security apparatus's threat is real, Camp B must accept delayed justice. If the threat is manageable, Camp A must accept the risk of trials. Making this dependency explicit is the only way to break the circular deliberation.
