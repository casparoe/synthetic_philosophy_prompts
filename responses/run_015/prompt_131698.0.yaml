answer: |-
  Here are ten interview questions arranged in a logical arc, moving from the definition of her view to its consequences, its epistemic costs, and finally its falsifiability. Each includes a follow-up tailored to her likely defense.

  ### Part 1: The Interview Questions

  **1. The Gap Between Relativity and Gödel**
  "Special Relativity already tells us that two observers moving at different speeds won't agree on what counts as 'now.' So, in a sense, we've lived without a universal present for a century. What does the Gödel universe add to that picture? Why isn't the ordinary relativistic lack of simultaneity enough to kill temporal passage, and what specific failure in the rotating universe is the smoking gun for you?"

  *   **Follow-up:** "If I hear you correctly, you're saying passage *just is* the existence of that global cosmic time. If a critic grants all your physics—the light cones, the rotation, the lack of slicing—but simply denies that 'passage' is the name for that structure, have you actually argued against them, or have you just defined your terms so that you win?"

  **2. The Patchwork Universe**
  "Let's try a thought experiment. Imagine a universe that is like ours—expanding with a clear cosmic time—in one huge region, but like Gödel's rotating universe in another distant region. Suppose observers can travel between them. On your view, does time pass in the expanding region but not in the rotating one? Or does the mere existence of the rotating region cancel passage for the whole cosmos?"

  *   **Follow-up:** "If you say it cancels passage for the whole cosmos, that means the people living in the expanding region are wrong about their own experience of succession. What is it that they are missing? Is there any test they could run locally to discover that their sense of time flowing is an illusion caused by geometry far away?"

  **3. Epistemic Fragility**
  "Our best cosmological models are inferences based on the light we can reach. But if the universe is much larger than what we observe, a Gödel-like region could be hiding just beyond our horizon. Does your view imply that we simply cannot know whether time passes? Is the reality of time empirically undecidable for us?"

  *   **Follow-up:** "Some philosophers would say that if a fact is real, it must be possible, in principle, for it to make a difference to us. If you accept that the reality of time might be forever hidden behind a horizon, how is your view different from the flat claim that 'time is an illusion'? You say you aren't an illusionist, but where is the cash value of your realism?"

  **4. Collateral Damage to Causation**
  "We usually think of cause and effect as local: I drop the cup, it breaks. But if temporal passage depends on the global shape of the universe, does local causation become fragile too? If the universe lacked a global slicing, would it be true that the cup's breaking was no longer *caused* by the drop, or does causation survive where passage does not?"

  *   **Follow-up:** "You'll likely want to separate the two. But if the geometry is what determines whether moments are genuinely successive, what protects causal order from that same geometry? Why does the global structure get to veto passage but not causation?"

  **5. The Falsification Condition**
  "Every scientific view needs a condition under which it would be abandoned. What observation or argument would convince you that temporal passage is real even without a global cosmic time? What would get you to give this view up?"

  *   **Follow-up:** "The easy answer is 'if cosmology turned out differently.' But you've insisted that the reality of time isn't settled by how things feel from the inside. So if the geometry stays the same but we find a new philosophical argument that passage is compatible with Gödel universes, would that move you? Or is your view locked entirely to the geometry, leaving no room for philosophical revision?"

  ***

  ### Part 2: Evaluation of Your Analogies

  **The Village Picture**
  Your picture of the village is **helpful but slightly misleading.** It helps because it captures the topological problem: you can synchronize clocks with your neighbor, and they with theirs, but if you go in a circle, the times don't match up (like an Escher staircase). That is exactly the failure of a global time function.
  *However*, it misleads because it makes the problem sound like a matter of *agreement* or *convention*. It suggests the issue is that the villagers can't get their stories straight. The philosopher's point is stronger: it's not that they can't agree on a time; it's that the universe *does not contain* a sequence of "nows" for them to agree on. The geometry doesn't allow a "slice" to exist. I would tweak your image: instead of neighbors failing to agree, imagine trying to lay a flat sheet over a twisted sculpture. The sheet tears. The tearing isn't a failure of the sheet (the observers); it's a feature of the sculpture (spacetime).

  **The Patchwork Case**
  This does **not rest on a confusion**, but you must be prepared for a physical objection. In General Relativity, you cannot simply "glue" two different solutions (like Gödel and Expanding) together without creating a boundary layer of matter or energy that might be physically unrealistic. A physicist might object that such a universe is impossible to construct.
  *Counter:* You don't need it to be physically likely; you only need it to be *mathematically possible* within the theory to test the concept. If her theory says passage is real, it should handle boundary cases. If she dodges by saying "that universe can't exist," press her on whether her theory of time is dependent on the universe being "clean" in a way we have no guarantee it is.

  ***

  ### Part 3: The Bet

  I expect the **Epistemic Fragility** commitment to crack first. Her position relies on a tight link between "what is real" and "what the global geometry says," but she simultaneously admits that the global geometry might be unknowable (hidden beyond the horizon). Under the pressure of Question 3 and its follow-up, she will be forced to admit that time could be "real" in a way that makes absolutely no detectable difference to any observer. At that point, the distinction between her "Realism" and the "Illusionism" she rejects becomes verbal rather than substantive. She will either have to concede that passage must be locally detectable (undermining her Gödel argument) or admit that her "real" passage is a property that does no work, which is a hard pill for a realist to swallow.
