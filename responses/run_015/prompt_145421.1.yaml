  **Mark: 18/20**

  **Marginal Comments**

  **[Next to Paragraph 1, sentence 1]**
  Precise. You correctly identify that the ethical unit is the marginal impact of consumption, not a static average. 'Per serving' is a serviceable proxy for this, though 'per marginal unit consumed' is the technical term.

  **[Next to Paragraph 1, sentence 3]**
  Clear explanation of why the standard metrics fail. You correctly note that per-animal counts ignore yield, and per-kilo counts ignore the density of lives/suffering involved.

  **[Next to Paragraph 2, sentence 2]**
  Good engagement with the prompt's premise. You accept the feed-conversion ratio but challenge the assumption that crop cultivation is the sole source of harm.

  **[Next to Paragraph 3, sentence 2]**
  This is a crucial distinction. The prompt's argument relies on *deaths* (wild animals killed by harvest); you correctly pivot the metric to *suffering* (quality of life for the livestock). This is a valid evaluative counter-weight.

  **[Next to Paragraph 3, sentence 3]**
  Be careful here. You argue beef does better on cultivation deaths because pasture kills fewer animals per hectare. This is empirically plausible but relies on the assumption that the beef in question is grass-fed/grazed for a significant period, which you acknowledge later.

  **[Next to Paragraph 4, sentence 2]**
  Excellent identification of the axiological uncertainty in wild-animal suffering (WAS) literature. Whether wild lives are net negative is indeed the pivotal evaluative question.

  **[Next to Paragraph 4, sentence 4]**
  The prompt asks for *one* question. You provide two. The second (pasture time) is factual, but you admit it only 'scales' the argument. Stick to the strongest uncertainty (value of wild lives) to remain precise.

  **[Next to Conclusion]**
  Reasonable verdict given the competing weights. You avoid false precision. However, ensure you explicitly answer part (b)'s instruction to state the weight of the counter-consideration *before* the conclusion (you imply it here, which is acceptable).

  **[General Comment]**
  Strong answer. You avoid the trap of comparing static quantities and correctly identify the marginal nature of consumer choice. Your counter-arguments in (b) are substantive rather than superficial. Deduction of 2 marks primarily for the slight imprecision on 'marginal units' and providing two empirical questions where one was requested.
