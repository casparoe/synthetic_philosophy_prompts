answer: |-
  The claim that a specific neuron "represents" a semantic property (e.g., "cat-ness") based solely on causal intervention is a category error. While causal intervention establishes **causal leverage** (the unit is necessary for the behavior), it does not establish **semantic content** (the unit encodes the concept).

  Passing the causal-intervention test is necessary but not sufficient for representation. Below are three precise failure modes that the test fails to rule out, demonstrating why causal relevance does not equate to representation.

  ### 1. The Confounder Failure (Tracking Correlates vs. Causes)
  The causal test fails to distinguish between a neuron that represents the target property and a neuron that represents a **spurious correlate** of that property.

  *   **The Scenario:** Suppose your training set contains many images of cats on green grass. A specific neuron might activate strongly in response to the color green (a low-level visual feature).
  *   **The Intervention:** When you ablate this "green detector," the model's accuracy on cat classification drops significantly because it loses a strong statistical cue.
  *   **The Failure:** The neuron passes the causal test for "cat detection," but it does not represent "cat." It represents "green." The causal link is mediated by the dataset bias, not by semantic understanding.
  *   **What the test fails to rule out:** It fails to rule out that the unit is encoding a **latent confounder**. The intervention shows the unit is *instrumentally useful* for the task in the current distribution, but it does not verify that the unit's activation value is semantically aligned with the concept independent of its correlates.

  ### 2. The Basis Failure (Arbitrary Axes in Superposition)
  In transformer activation spaces, features are often stored in **superposition**, meaning more features exist than there are dimensions, and features are distributed across multiple neurons. In this regime, the choice of basis (the individual neurons) is mathematically arbitrary.

  *   **The Scenario:** Imagine the concept "cat" is encoded in a 2D subspace spanned by Neuron A and Neuron B. The direction vector for "cat" is $\vec{v} = [1, 1]$. Neither Neuron A ($[1, 0]$) nor Neuron B ($[0, 1]$) individually represents "cat"; they are just axes.
  *   **The Intervention:** If you zero out Neuron A, you project the activation onto the B-axis. This distorts the $\vec{v}$ vector, degrading the model's ability to detect cats. Neuron A passes the causal test.
  *   **The Failure:** Claiming Neuron A "represents" cat is like claiming the X-axis of a graph "represents" a diagonal line drawn on it. The representation exists in the **subspace**, not the **neuron**. The neuron is merely a component of a basis that the readout mechanism happens to use.
  *   **What the test fails to rule out:** It fails to rule out **basis dependence**. If you rotated the activation space (an orthogonal transformation that preserves model output), the causal influence would remain in the subspace, but the specific "cat neuron" would disappear or change entirely. A true representation should be robust to change of basis; a causal lever is not.

  ### 3. The Instrumental Failure (Computation vs. State)
  The causal test treats the neuron as a storage container (a state), but in a neural network, neurons are often **computational intermediates** (operations).

  *   **The Scenario:** Consider a neuron that activates when "Attention Head 3 is high AND the previous token is a noun." This boolean combination might be highly predictive of the next token being a verb associated with cats (e.g., "meows").
  *   **The Intervention:** Ablating this neuron disrupts the logical chain, reducing the probability of the correct verb, and consequently reducing the confidence in the "cat" classification.
  *   **The Failure:** This neuron does not represent "cat." It represents a specific **logical condition** or **gate** within the inference algorithm. It is part of the *procedure* for recognizing a cat, not the *concept* of a cat.
  *   **What the test fails to rule out:** It fails to rule out **mixed selectivity** or **polysemanticity** where the unit encodes a non-linear combination of features required for a specific calculation step. The unit has causal power because it is a bottleneck in the computation graph, not because it holds a semantic label.

  ### Conclusion: Causal Leverage $\neq$ Representation
  To say a neuron "represents" something implies a degree of **semantic stability** and **readout invariance** that causal intervention does not measure.

  The causal intervention test proves that $P(Output | do(Neuron)) \neq P(Output)$. It proves the neuron is a **causal lever**. It does not prove that the activation value $a_i$ maps isomorphically to the semantic property $S$.

  To strengthen the claim of representation, you must supplement causal interventions with:
  1.  **Probing:** Can a *linear* probe read the property from the unit across diverse contexts (ruling out complex instrumental computations)?
  2.  **Basis Invariance:** Does the feature persist if you rotate the activation space (ruling out arbitrary axis alignment)?
  3.  **Out-of-Distribution Testing:** Does the unit still track the property when spurious correlates are removed (ruling out confounders)?

  Without these, stating that a neuron "represents" a property is an overinterpretation of its causal utility.
