answer: |-
  Your friend has identified a genuine tension, but it is not necessarily fatal to your position. The inconsistency lies not in your intuition about the evidence, but in the ambiguity of the word 'institution'. In the first case, you use it to mean a shared normative rule; in the second, you use it to mean a centralised administrative bureaucracy. If we tighten this terminology, your verdicts can be reconciled under a single, robust methodological principle.

  Here is the principle that best captures the logic of your five judgments, followed by an assessment of its costs and consequences.

  ### The Principle of Functional Redundancy and Precision

  **Statement:**
  *In the absence of textual or direct administrative evidence, infer a prescriptive social institution or specialised knowledge system only when the material pattern exhibits either (a) functional redundancy (standardisation that incurs a cost or negates utility) or (b) statistical improbability (precision that exceeds accidental variation), provided that a simpler explanation based on individual practical rationality or technological constraint is insufficient.*

  **Breakdown of Clauses:**

  1.  **Functional Redundancy (The Symbolic Clause):**
      *   *Motivation:* This is motivated by **Case 1** (the axes) and **Case 3** (the broken ceramics).
      *   *Logic:* In both instances, the objects are removed from the sphere of practical utility. The axes show no wear; the ceramics are deliberately broken. Standardisation here cannot be explained by 'best practice' for survival or efficiency. Because the behaviour is 'costly' in economic terms, it signals a commitment to a non-material rule or belief.
      *   *Verdict:* We are entitled to infer a normative institution (a rule of belief or conduct).

  2.  **Functional Adequacy (The Pragmatic Clause):**
      *   *Motivation:* This is motivated by **Case 2** (storage pits) and **Case 4** (obsidian blades).
      *   *Logic:* Here, the material pattern aligns perfectly with practical optimisation. Uniform pits maximise storage efficiency; local flaking techniques minimise learning costs. The standardisation is 'overdetermined' by practical necessity. To infer a centralised authority here is to multiply entities beyond necessity.
      *   *Verdict:* We must resist inferring centralised administration or foreign intervention; decentralised emulation or technological constraint suffices.

  3.  **Statistical Improbability (The Precision Clause):**
      *   *Motivation:* This is motivated by **Case 5** (the solstice alignment).
      *   *Logic:* While a calendar has practical utility (unlike the unworn axes), the *precision* of the alignment is statistically unlikely to arise from trial and error or accidental construction. It implies the transmission of specialised, abstract knowledge.
      *   *Verdict:* We are entitled to infer an institution of knowledge (specialists or a calendrical system), even without texts, because the 'signal' is too precise to be noise.

  ### Application to New Cases

  Applying this principle to the scenarios you raised yields the following verdicts:

  **1. Uniform Domestic Architecture**
  *   *Scenario:* Houses across a region share identical dimensions and orientation, lacking decorative variation.
  *   *Verdict:* This depends on **Functional Adequacy**. If the uniformity reflects the most efficient use of locally available timber or protection against a dominant wind direction, the Principle dictates you attribute this to practical convergence (Case 2 logic). However, if the orientation persists despite varying terrain or if the uniformity requires importing materials at high cost, it crosses into **Functional Redundancy**.
  *   *Conclusion:* Do not read it as an enforced institutional code unless the uniformity incurs a demonstrable economic cost or ignores environmental logic. Otherwise, it is likely a vernacular tradition.

  **2. Sudden Change in Burial Orientation**
  *   *Scenario:* Region-wide shift in burial direction, while domestic assemblages remain unchanged.
  *   *Verdict:* This is a clear instance of **Functional Redundancy**. Burial orientation rarely has practical utility regarding survival or economics. A sudden, region-wide shift implies a rapid change in the normative rule-set (belief system) that governs the liminal domain, without a corresponding shift in the practical domain (economy/technology).
  *   *Conclusion:* This supports an inference of ideological shift without broader social restructuring. The principle allows you to decouple the symbolic institution from the economic one.

  ### Honest Assessment: Reflective Equilibrium

  While the principle above saves your position from incoherence, it requires you to make a concession to your friend to achieve true reflective equilibrium.

  **The Terminological Concession:**
  Your friend is correct that you are using 'institution' in two different senses. In Case 1, you infer a *normative* institution (a rule everyone follows). In Case 2, you deny a *bureaucratic* institution (a central authority enforcing the rule). However, Case 2 *does* imply a normative institution of sorts—'peer emulation' and 'shared craft tradition' are themselves social institutions, merely decentralised ones.
  *   **Cost:** You must abandon the claim that Case 2 implies *no* social institution. You must clarify that you are denying *centralised coercion*, not social normativity. If you maintain that Case 2 shows 'no institution', you are inconsistent. If you concede it shows 'decentralised norms' versus Case 1's 'prescriptive ritual rules', your position holds.

  **The Vulnerability of Case 1:**
  There is a risk in your verdict on Case 1. You argue that unworn axes in every grave prove a shared belief. However, if these axes functioned as a form of 'primitive money' or a standardised token of social membership (like a modern identity card), their uniformity could be administrative rather than purely spiritual.
  *   **Cost:** To remain consistent with your caution in Case 2, you should soften the verdict on Case 1. You can infer a *rule*, but you cannot necessarily distinguish whether that rule was driven by spiritual belief or by a secular requirement for social identification. The material outcome is identical. Claiming it is definitely 'belief' rather than 'social administration' risks the same overreach you rightly avoid in Case 2.

  **The Vulnerability of Case 5:**
  Your willingness to infer 'institutional knowledge' in Case 5 sits uneasily with Case 2 only if 'institution' implies 'bureaucracy'. If it implies 'specialised role', it is consistent. However, be wary: precision can sometimes be the result of long-term incremental adjustment rather than a formal institution.
  *   **Cost:** Ensure you do not infer a 'priestly class' (hierarchy) solely from the alignment. You are entitled to infer 'knowledge', but not necessarily 'power'.

  ### Final Verdict

  Your intuitions are largely sound and can be made coherent, provided you adopt the **Principle of Functional Redundancy and Precision**. This principle successfully distinguishes between patterns that *must* imply social rules (because they are impractical or improbable) and those that *might* simply be practical habits.

  However, to satisfy the demands of reflective equilibrium, you must accept your friend's core criticism: you cannot claim Case 1 proves 'belief' while Case 2 proves 'only practice'. Both prove social norms. The distinction is that Case 1's norms are **symbolically costly**, warranting an inference of ideological enforcement, whereas Case 2's norms are **functionally optimized**, warranting an inference of pragmatic convergence.

  If you make this distinction explicit, you need not abandon any of your five verdicts. If you refuse to clarify the definition of 'institution', you must abandon the certainty of your verdict in Case 1, admitting that the axes could represent a secular administrative standard just as plausibly as a spiritual one. Given your caution in Case 2, intellectual honesty suggests you should adopt the latter humility.
