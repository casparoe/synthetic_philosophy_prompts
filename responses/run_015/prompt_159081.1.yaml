answer: |-
  1. **the railways, and the internal market they created** — **+2%**
     Under the counterfactual clause, independent states likely would have built railways within a generation without the burden of guaranteed British returns, leaving only the value of earlier availability.

  2. **deindustrialisation — the shift to exporting raw cotton and importing cloth** — **-20%**
     This represents a structural reversal of economic development that independent successor states would likely have resisted through protectionism, as seen in Meiji Japan.

  3. **famine and famine mortality under late colonial rule** — **-30%**
     Policy choices exacerbated mortality rates during shortages, creating a human cost that outweighs the logistical capacity the administration claimed to provide.

  4. **english, the universities, the press** — **+5%**
     Per the adoption clause, credit is limited to the tool's value as delivered, since Indians themselves leveraged these institutions for unity and independence.

  5. **the courts, the civil service, and the administrative state India inherited in 1947** — **+4%**
     While Indians improved the system post-independence, the Raj delivered a functioning bureaucratic framework that prevented total state collapse at transfer of power.

  6. **the drain — home charges, salaries, guaranteed returns to British investors** — **-25%**
     This is direct financial extraction that reduced domestic capital formation, representing a pure cost against the counterfactual of retained wealth.

  7. **pacification: the end of near-constant warfare between successor states and princely states** — **+6%**
     Though consolidation might have occurred independently, the immediate reduction in internal warfare provided a tangible stability dividend during the colonial period.

  8. **the army — recruitment, the two world wars, and the political leverage that came out of them** — **-4%**
     The force was primarily deployed for imperial interests rather than local defense, with only marginal credit due for the political leverage gained after WWII.

  9. **partition, and the displacement that came with it** — **-35%**
     The violence and displacement were direct consequences of the colonial exit strategy, creating a catastrophic human cost that dominates the negative ledger.

  10. **the indentured-labour diaspora** — **-5%**
      While a diaspora exists today, the coercive nature of the migration under the Raj scores negatively against a counterfactual of voluntary movement later.

  **Note on the Non-Identity Problem:** This exercise does not collapse uniformly because economic and institutional lines (Drain, Deindustrialisation, Courts, Railways) describe conditions affecting whoever resides in the subcontinent, regardless of specific identity; however, it critically undermines the coherence of Partition, Indentured Labour, and Famine, as the specific victims and survivors—and thus the current population—would not exist without these events, making "better off" comparisons for those lines philosophically unstable.

  \answer{pacification > english > courts > railways > army > indentured > deindustrialisation > drain > famine > partition}
