answer: |-
  The puzzle you articulate regarding "distributed hinges" strikes at the heart of the tension between the static architecture of Wittgenstein's *On Certainty* and the dynamic reality of scientific practice. It asks whether the hinge/empirical distinction can survive the observation that scientists can rationally debate the status of a proposition (e.g., "Is Quantum Field Theory a framework condition or a testable model?").

  To answer your concluding question directly: **Wittgenstein is not forced to admit that hinges are subject to epistemic rational evaluation.** He possesses the resources to maintain that such disputes are expressions of different forms of life (or, more precisely, divergences in practical orientation), provided we accept a specific, non-traditional understanding of "rationality" and "proposition."

  However, preserving this distinction requires navigating three specific nuances in Wittgenstein's text: the functional nature of hinge-status, the fluidity of the "riverbed," and the distinction between epistemic justification and pragmatic negotiation.

  ### 1. Hinge-Status is Functional, Not Intrinsic
  The primary resource Wittgenstein has against the collapse of the distinction is the claim that there is no intrinsic property that makes a sentence a hinge. As he notes, "The same proposition may get treated at one time as something to test by experience, at another as a rule of testing" (OC §98).

  When two physicists disagree about whether QFT is a hinge or a hypothesis, they are not disagreeing about the *truth* of QFT in the first instance; they are disagreeing about its **logical grammar** within their inquiry.
  *   **Physicist A** treats QFT as a hinge: Doubting it makes their calculations meaningless. For them, QFT is the "scaffolding" (OC §211).
  *   **Physicist B** treats QFT as a hypothesis: They are looking for anomalies that might falsify it.

  For Wittgenstein, this does not mean QFT is "partially a hinge." It means that in Language Game A, it functions as a norm; in Language Game B, it functions as an empirical claim. The distinction between hinge and empirical belief is preserved because it is a distinction of **role**, not content. The fact that the role can be debated does not mean the roles are identical; it means the boundary of the language game is being negotiated.

  ### 2. The Riverbed and the Illusion of "Rational Assessment"
  You ask if the ability to debate hinge-status implies hinges are subject to rational evaluation. Wittgenstein would argue that what looks like "rational evaluation" of a hinge is actually a **pragmatic assessment of a framework**.

  In the famous "riverbed" metaphor (OC §96–99), Wittgenstein distinguishes between the water (fluid empirical claims) and the bed (solid hinges). Crucially, he notes that the bed can shift. However, the shifting of the bed is not caused by the water flowing over it in a standard causal/justificatory way. The bed shifts due to geological pressures (historical, practical, technological changes).

  When scientists debate the status of a proposition, they are often in a transitional phase where the riverbed is shifting. During this transition, the proposition is in a state of grammatical flux. To say this is "rational evaluation" is to misunderstand the type of rationality at play.
  *   **Epistemic Rationality:** Applies within the game (using evidence to verify hypotheses).
  *   **Pragmatic Rationality:** Applies to the choice of game (adopting a framework that yields successful action).

  Wittgenstein can maintain that hinges are not subject to *epistemic* evaluation (you cannot prove a hinge with evidence, because the hinge defines what counts as evidence) without denying that they are subject to *pragmatic* pressure. If a hinge stops "working" (i.e., the form of life based on it becomes unviable), it is discarded. This is not a refutation; it is an abandonment. Thus, the distinction holds: empirical beliefs are verified/falsified; hinges are adopted/discarded based on utility.

  ### 3. Distributed Hinges and Forms of Life
  The problem of "distributed hinges" (subgroups relying on different certainties) is actually a strength of the *On Certainty* reading if viewed through the lens of "forms of life."

  Modern science is not a single, monolithic language game; it is a federation of specialized practices. The electron microscopist and the statistical modeler are operating within overlapping but distinct forms of life.
  *   When they agree, their hinges align, and they exchange empirical data.
  *   When they disagree about a hinge (e.g., "Your statistical model assumes stability that my microscopy shows is variable"), they are not having an empirical disagreement. They are encountering a **grammatical conflict**.

  Wittgenstein's resources allow him to characterize this not as an internal epistemic disagreement (where one side is "wrong" about the facts) but as a failure of translation between forms of life. To resolve it, one side must convince the other to *act differently*—to adopt a new certainty. This persuasion is not achieved by presenting evidence (which presupposes the hinge) but by showing the fruitfulness of the new practice.

  As Wittgenstein writes, "At the end of reasons comes persuasion" (OC §612). If a physicist tries to convince another that QFT should be a hypothesis rather than a hinge, they are not offering a proof; they are inviting them into a different form of life where different moves are permissible.

  ### Conclusion: The Distinction Holds
  Wittgenstein does not need to collapse the distinction between hinges and empirical beliefs. The puzzle arises only if we assume that "rational assessment" is a unitary phenomenon that applies equally to all propositions. Wittgenstein's genius in *On Certainty* is to show that the "logic" of a hinge is the logic of action, while the "logic" of an empirical claim is the logic of verification.

  Therefore:
  1.  **Hinges are not epistemically evaluable:** You cannot gather evidence for a hinge without already presupposing it.
  2.  **Status disputes are pragmatic:** Debates about whether a proposition *should* be a hinge are debates about how we ought to proceed, not about what is the case.
  3.  **The distinction is preserved:** Even if a proposition migrates from one category to another (riverbed shifting), it cannot occupy both categories simultaneously within the same move of the language game.

  Wittgenstein's position remains that disputes about hinges are expressions of different forms of life. This does not render science irrational; it locates scientific rationality within the stability of practice rather than in a foundationalist architecture of justified true belief. The "distributed" nature of modern science simply reveals that our "world-picture" (OC §162) is a mosaic of local certainties, held together not by logical deduction, but by the friction of shared practice.
