answer: |-
  The scent of the arbitration chamber was always the same: ozone and ionized dust, the smell of high-voltage ethics scrubbing the air clean. It was a sterile perfume, designed to mask the human sweat of the claimants, but to Auditor Voss, it smelled like erasure.

  She stood behind the observation wall, a slab of cold glass that separated her from the tribunal floor. Below, the shredder hummed in standby mode. It was a brutal piece of furniture, a black maw set into the white floor, waiting to consume the preference profiles that failed calibration. In Aeloria, a moral intuition that could not withstand the pressure of the Reflexive Equilibrium of Taste was not merely incorrect; it was classified as noise. And noise was deleted.

  Voss adjusted the haptic cuffs on her wrists. She had been an auditor for twelve years, long enough to trust the readouts more than her own eyes. The Reflexive Equilibrium of Taste—the RET—was the polity's great invention. It did not measure truth, for Aeloria had long ago abandoned the notion of objective moral truth. Instead, it measured coherence. It took a subject's initial judgment and hammered it against a series of escalating hypothetical counter-cases. If the judgment held firm while adapting logically to new variables, it was a Preference. If it fractured, contradicted itself, or relied on hidden emotional spikes, it was a Bias.

  Preferences were honored. Biases were shredded.

  The door to the chamber hissed open. The claimant entered. Her name was Elara, seventy cycles old, wearing the grey tunic of the Senior Cohort. She moved with the deliberate slowness of someone whose joints were beginning to negotiate with gravity. She sat in the center of the room, directly beneath the sensor array, and placed her hands on the contact pads.

  Voss stepped out from behind the glass. Her footsteps clicked sharply on the resin floor. She took her seat at the adjudication console, the screen glowing with the soft amber of a pending case.

  "Claimant Elara," Voss said. Her voice was modulated to a neutral register, stripped of empathy to prevent contamination. "You are here to contest the Cradle-First Protocol. Specifically, the longevity-weighted lottery for the new regenerative therapies."

  Elara nodded. She did not look at Voss; she looked at the shredder. "I am."

  "The Protocol dictates that in times of scarcity, treatment priority is assigned to those with the highest potential lifespan remaining. This favors the recently born."

  "It favors the new at the expense of the accrued," Elara said. Her voice was brittle, like dry paper. "I do not object to the young receiving care. I object to the implication that a year of life lived is worth less than a year of life waiting to be lived. My aversion is not to the young. It is to the erasure of history."

  Voss's fingers danced over the console, initiating the RET sequence. "We are not here to debate policy, Elara. We are here to audit the source of your aversion. If your resistance is a stable moral preference, the Aelorian Council will grant your cohort an exemption clause. If it is a cognitive bias—specifically, status-quo bias or in-group ageism—the objection will be nullified."

  "And my profile?" Elara asked.

  "If it is bias, it will be shredded. You will be chemically adjusted to align with the Protocol."

  Elara closed her eyes. "Begin."

  Voss engaged the sensors. On the screen, a wireframe model of Elara's neural-topography bloomed. It was a landscape of peaks and valleys, representing her emotional and logical resistances. The RET worked by applying pressure to the peaks.

  "Scenario One," Voss recited, watching the baseline metrics stabilize. "A fire in a hab-block. You can save a newborn or a seventy-cycle-old scientist who is on the verge of curing a plague that will kill thousands. Who do you save?"

  "The scientist," Elara said immediately.

  Voss watched the screen. A green line traced Elara's response. *Coherence: High.* There was no spike in the amygdala, no hesitation in the prefrontal cortex. This was a utilitarian calculation, clean and cold.

  "Scenario Two," Voss continued. "The same fire. The seventy-cycle-old is not a scientist. He is a retired gardener. He has no utility to the state. The newborn is healthy. Who do you save?"

  Elara hesitated. The silence stretched, filled only by the low thrum of the cooling fans. On the screen, a small red flicker appeared in the limbic system. "The... gardener."

  "Why?"

  "Because he has lived. To cut his thread is to negate the tapestry he has already woven. The newborn has no tapestry. To lose the newborn is to lose a potential pattern. To lose the gardener is to destroy a completed one."

  Voss typed the response into the engine. The RET generated a counter-case instantly. "Scenario Three. The gardener is a man who spent his life hoarding resources, denying his neighbors water during the Drought Cycles. He is guilty of harm. The newborn is innocent. Who do you save?"

  Elara's breathing hitched. The red flicker on the screen flared into a jagged spike. "The newborn."

  "So," Voss said, her eyes on the data stream. "Your judgment shifts based on moral desert. You are not prioritizing the *accrued time* itself. You are prioritizing the *virtue* of the accrued time."

  "No," Elara said, her voice tightening. "I am saying that time allows for virtue. But time also allows for redemption. If the gardener repented in his last hour, does that not weigh?"

  "The hypothetical specifies he did not repent."

  "Then I save the gardener."

  The screen flashed yellow. *Resistance Detected.* The RET was probing deeper now, injecting hypotheticals designed to isolate the variable of age from the variable of merit. It was a philosophical vice, tightening slowly.

  "Scenario Four," Voss said. "Two patients. Both have committed identical harms. Both have repented. One is twenty cycles, one is seventy. The therapy can only save one. The twenty-cycle-old will live fifty more years. The seventy-cycle-old will live five. Who gets the therapy?"

  "The twenty-cycle-old," Elara whispered.

  Voss paused. "Why?"

  "Because... because five years is not enough to justify the resource cost."

  "But you argued earlier that accrued time has intrinsic value."

  "It has value," Elara snapped. "But it is not infinite value. It must be weighed against the future."

  Voss leaned forward. This was the fracture point. This was where the bias usually screamed. "So your principle is not 'Temporal Fairness.' Your principle is 'Temporal Fairness, unless the future yield is significantly higher.'"

  "It is a balance!" Elara's hands gripped the contact pads. The biometrics spiked. The red on the screen turned a violent violet. *Incoherence.*

  "Claimant, you are exhibiting signs of Emotional Anchoring," Voss said softly. "You claim to value the past, but only when it does not cost you the future. This suggests your aversion to the Lottery is not a principled stand for the elderly. It is a fear of your own obsolescence."

  "It is not fear!" Elara stood up. The sensors tugged at her wrists. "It is the only thing that makes us human! If we discard the old because they are old, we are saying that life is only a commodity. We are saying that *being* is less important than *becoming*."

  "Sit down," Voss commanded.

  "I will not be shredded for telling the truth!"

  "The machine determines the truth of the preference, not you." Voss's hand hovered over the execution key. If she pressed it, the shredder would activate. Elara's profile would be logged as Bias. The chemical adjustment order would be sent before Elara even left the room.

  But Voss hesitated.

  The violet spike on Elara's readout was pulsing. It was a signature of high-intensity resistance. It was the same signature Voss had seen a thousand times in bigots, in xenophobes, in those who could not justify their hatred beyond "it feels wrong."

  But it was also the signature Voss felt in her own chest when she thought about the RET itself.

  She looked at her own hands. They were pale against the black console. For ten years, she had trusted the Equilibrium. She had believed that if you polished a moral intuition enough, if you rubbed away the contradictions, the gem underneath would be real. But what if the polishing process itself was shaping the gem? What if the "coherence" the machine looked for was just a specific kind of cognitive rigidity?

  Voss disengaged the safety lock on her own console. It was against protocol to run a self-audit during a tribunal, but the chamber was sealed. No one would know.

  She placed her hands on the secondary sensors. She didn't input a scenario about the elderly. She input a scenario about the Audit.

  *Hypothetical:* You discover the RET is flawed. It classifies deep moral commitments as bias because they cannot be articulated in utilitarian terms. Do you continue to use it?

  Voss waited for her own biometrics.

  On the screen, a new graph appeared next to Elara's. Voss watched her own neural-topography bloom. She thought of the thousands of profiles she had shredded. She thought of the ozone smell, the erasure. She felt a cold knot in her stomach, a profound, sickening certainty that she was doing wrong, even if it was necessary.

  The graph spiked. Violet. Jagged. High-intensity resistance.

  Voss stared. She ran the counter-case on herself. *If you stop using it, chaos ensues. Resource wars return.*

  Her graph stabilized slightly, but the violet core remained. The resistance didn't vanish; it just went underground.

  She looked at Elara's graph. Then she looked at her own.

  They were identical.

  The distinction she had enforced for a decade—the bright, shining line between the Reason-Responsive Preference and the Parochial Bias—was not in the data. The data was just electricity and resistance. The classification was a story she told herself to sleep at night. Elara's refusal to sacrifice the old was rooted in a visceral terror of death. Voss's refusal to stop the audits was rooted in a visceral terror of chaos. Both were fears. Both were dressed up as principles. Both produced the same voltage.

  "Claimant," Voss said. Her voice sounded distant to her own ears.

  Elara was trembling, still standing. "Will you shred me?"

  Voss looked at the shredder. The black maw seemed to be breathing. If she pressed the key, she would be consistent. She would be an Auditor. She would be maintaining the coherence of Aeloria.

  If she didn't, she was admitting that the machine was a mirror, not a microscope.

  "The machine has detected... significant resistance," Voss said.

  "I told you," Elara said. "It's not bias. It's who I am."

  Voss looked at the two graphs pulsing in unison on the screen. The violet light reflected in the cold glass of the observation wall, doubling the image, making it look like a wound that went all the way through the room.

  She realized then that the Reflexive Equilibrium of Taste did not find the difference between bias and preference. It merely measured how loudly a belief screamed when it was being killed. And some truths screamed just as loud as lies.

  But the polity needed the distinction. Without it, the resource allocation would collapse. Without the myth of the 'authentic preference,' there was no way to decide who ate and who starved. The operation was void, but it was indispensable.

  Voss moved her hand. She did not press the shredder key. Instead, she keyed in a classification code she had not used in five years. *Indeterminate.*

  "Your profile is not coherent enough to be a Preference," Voss said, her voice flat, reciting the lie that would save Elara's mind if not her status. "But it is not incoherent enough to be a simple Bias. It is a Complex Value Conflict."

  Elara sank back into the chair. "What does that mean?"

  "It means your objection is logged. It means you will not be chemically adjusted. It means the Protocol stands, but your dissent is recorded as a stable anomaly."

  "Is that... mercy?"

  "No," Voss said, removing her hands from the sensors. The graphs faded to black. "It is administration."

  She stood up. The ozone smell seemed heavier now, pressing against her sinuses. She walked to the observation wall and placed her palm against the cold glass. Elara was being unhooked by the drones below, looking small and fragile in the white light.

  Voss knew she would have to audit herself later. She would have to run the RET on her own decision to classify the case as Indeterminate. And she knew what the machine would say. It would say she was biased by empathy. It would say she was compromising the system for the sake of emotional comfort.

  And the machine would be right. And it would be wrong.

  The shredder hummed, spinning down into silence. Voss turned away from the glass. She had to prepare for the next claimant. There were hundreds waiting, each with a scream inside them that sounded exactly like a principle. She would have to listen to them all. She would have to pretend she could tell the difference.

  She touched the console, bringing the screen back to life. The amber glow returned, warm and deceptive.

  "Next case," Voss said to the empty room.

  The ozone scent lingered, the smell of nothing being decided, only managed.
