answer: |-
  ### Logical Space Brainstorm (Pre-Tree)
  Before deploying cases, map the property $P$ such that *Assert $p$ is proper iff $P(p)$*.
  1.  **Existence:** Is there a *constitutive* norm (Williamson) or merely regulative maxims (Grice/Deflationary)?
  2.  **Factivity:** Must $p$ be true? (Truth/Knowledge/Practical vs. Belief/Justification).
  3.  **Strength:** Is Truth sufficient (Weiner) or is Knowledge required (Williamson)?
  4.  **Invariantism:** Does the threshold for $P$ shift with practical stakes? (Standard vs. Pragmatic Encroachment).
  5.  **Purity:** Is the norm purely epistemic, or does it include authority/permission (e.g., "You must know *and* have a right to tell")?

  ***

  ### The Assertion Norm Decision Tree
  *Start: You accept assertion is a normative speech act.*

  **Q1. The Lucky Guess (Gettier Case)**
  You guess a coin flip (no evidence). It lands Heads. You assert "Heads." You are right and believe it.
  *   **Proper?** $\rightarrow$ Go to **Q2** (Weak Norms).
  *   **Improper?** $\rightarrow$ Go to **Q3** (Strong Norms).

  **Q2. The Sincere Falsehood**
  You have excellent evidence for $p$. $p$ is false. You assert $p$.
  *   **Proper?** $\rightarrow$ **BELIEF NORM** (Assertion ruled by sincerity).
  *   **Improper?** $\rightarrow$ **TRUTH NORM** (Assertion ruled by factivity alone).

  **Q3. The Bank Case (Stake-Shifting)**
  You have standard evidence the bank is open Saturday.
  *   *Low Stakes:* Asserting is fine.
  *   *High Stakes:* (You'll be fired if wrong). Same evidence. Is asserting **Improper**?
  *   **No (Invariant):** $\rightarrow$ Go to **Q4**.
  *   **Yes (Variant):** $\rightarrow$ **PRACTICAL NORM** (Assertion ruled by rational action/stakes).

  **Q4. The Tax Fraud (Authority Case)**
  You overhear your boss committing tax fraud ($p$). You know $p$. You have no moral/legal right to reveal it. Is asserting $p$ **Epistemically Improper**?
  *   **Yes:** $\rightarrow$ **HYBRID NORM** (Knowledge + Authority/Warrant).*
  *   **No:** $\rightarrow$ Go to **Q5**.

  **Q5. The Unreflective Speaker (Knows-but-No-Belief)**
  A native speaker asserts a complex grammatical fact. They know it (reliably) but have never reflected on it/do not occurrently believe it. Is asserting **Improper**?
  *   **Yes:** $\rightarrow$ **BELIEF-REQUIRING KNOWLEDGE NORM** (Knowledge must be believed).
  *   **No:** $\rightarrow$ **STANDARD KNOWLEDGE NORM** (Knowledge alone suffices).

  **Q6. The Deflationary Check (Anti-Norm)**
  *Alternative Path from Q1:* Do you view "impropriety" merely as violating conversational goals rather than a constitutive rule of the act itself?
  *   **Yes:** $\rightarrow$ **NO NORM / DEFLATIONARY** (Assertion has no unique constitutive norm).

  ***

  ### Position Leaves

  | Position | Core Claim | Typical Proponents |
  | :--- | :--- | :--- |
  | **Truth Norm** | Assert $p$ only if $p$ is true. | Weiner, early Frege |
  | **Belief Norm** | Assert $p$ only if you believe $p$. | Bach, Hindriks |
  | **Knowledge Norm** | Assert $p$ only if you know $p$. | Williamson, Unger |
  | **Practical Norm** | Assert $p$ only if it is rational to act on $p$. | Stanley, Fantl & McGrath |
  | **No Norm** | Assertion is governed by general rationality, no unique rule. | Searle (regulative), Cappelen |

  ***

  ### Expert Caveats & Flags

  **1. Indistinguishable Leaves:**
  The tree cannot reliably separate the **Knowledge Norm** from a **Justified True Belief (JTB) Norm**. In almost all live cases, JTB and Knowledge extensionally overlap. To separate them, you need esoteric Gettier cases where subjects have JTB but lack Knowledge (e.g., fake barn county) and poll intuitions on assertion propriety, which are notoriously unstable.

  **2. The Empty Combination:**
  **Truth Norm + Stake Sensitivity.** This logical space is effectively empty. Truth is factive and objective; it does not fluctuate with the speaker's practical environment. If a participant claims "Truth is the norm, but high stakes make true assertions improper," they have incoherently conflated the *epistemic* norm with *practical* rationality. They likely hold the Practical Norm but mislabel it.

  **3. The Tax Fraud Nuance:**
  If participants route to **Hybrid Norm** at Q4, note that this challenges the *purity* of the Knowledge Norm. Williamson argues the knowledge norm is satisfied in the fraud case, even if moral norms prohibit assertion. If your group insists the *assertion itself* is epistemically defective here, they may hold a "Warranted Assertibility" view where warrant includes social standing, not just epistemic status.

  **4. The Belief Requirement:**
  Q5 tests whether Knowledge is *sufficient*. Some Knowledge Normers argue knowledge entails belief; others argue it doesn't. If your group says "Improper" at Q5, they hold a Knowledge Norm that includes a Belief Constraint, distinct from the pure Sufficiency view.

  *\*Note: "Hybrid Norm" is not a standard leaf but captures the Q4 deviation. Route these participants to Knowledge Norm with a footnote on Authority.*
