prompt: |-
  Okay so my epistemology reading group is doing a session on the norm of assertion next month and I've realized nobody actually knows which position they hold — they all just say "knowledge" because it sounds right. I want a decision tree that sorts people by what they actually say about cases, not by which label they reach for, that walks them from "I accept that assertion is a normative speech act" to a named position.

  Each branch node has to be a concrete scenario the group can react to without already knowing the answer. I've got a few cases I want woven in somewhere: the lucky-belief case (you're right and you believe it, but your evidence was pure garbage), the knows-but-doesn't-believe case (a native speaker asserting a gramatical fact they've never actually reflected on), the stake-shifting case (the bank closes at 3, you have exactly the same evidence, but now you'll be fired if you're wrong), and the "you know it but have no right to say it" case (you overheard your boss comitting tax fraud). The leaves should include at least the knowledge norm, the truth norm, the belief norm, and the practical norm (assert only what you can act on as if true) — plus an anti-norm / "no norm" leaf if that makes sense.

  Flag any two leaves your tree can't really separate, and call out any answer combination that ends up empty and say why (incoherent, just unattractive, or unexplored?). I want the tree built from the logical space of possible norms first, with the actual positions located in it after, rather than just a list of names.

  Treat me like an expert on assertion norms and think carefully before you lock in a branch — start with a quick brainstorm of what norms are even possible (including ones nobody has a name for) and then place the real positions. Keep it to about 6 to 8 branch questions and make the whole thing fit on a single page.
