answer: |-
  The faucet handle was cold, brass sticking slightly to Elias's palm. He turned it. The water rushed out, clear, chaotic, splashing against the stainless steel sink. It smelled like chlorine and old pipes.

  It wasn't the Flow.

  In the Enclosure, the water didn't splash like this. It moved heavier, like oil but clear. They called it the Flow, but the elders taught them it was *Pure*. To waste the Flow was a sin. To mix it with sweat was unclean. Elias had grown up reciting the Litany of Conservation while washing, his hands moving in specific patterns to ensure the synthetic H2O analogue didn't touch his skin unnecessarily. "Purity is preservation," his mother had whispered, pouring a measured cup for his morning thirst. "The Outside Wet is corrupt. It decays. The Flow sustains."

  Now, Elias lived in Ohio. He had a lease, a job in logistics, and a glass of tap water in his hand.

  He lifted the glass. The liquid caught the kitchen light. It looked like the Flow. It felt like the Flow. If he closed his eyes, the sensation against his lips was identical. But he knew the history. The Enclosure's water was XYZ—a stable polymer chain designed to mimic hydration without the mineral erosion of real H2O. The pipes here carried H2O.

  He didn't drink. He just held the glass.

  The crisis wasn't about thirst. It was about the words.

  For twenty years, Elias had prayed to be *pure*. In the Enclosure, purity was a tangible state. You were pure if your internal balance matched the Flow. If you drank the Outside Wet, you were spiritually contaminated because the substance itself was unstable, "decaying" as the elders said. Their moral language was anchored to the chemistry. "Good" meant "compatible with the Flow." "Sin" meant "corrosion."

  Here, "pure" meant something else. Pure water meant filtered, free of contaminants. But morally? People here said "pure heart" or "pure intention." They didn't tie it to the chemical structure of their drink.

  If meaning is determined by what's out there in the world, not just what's in your head, then Elias's twenty years of prayer were misfired. When he asked to be made pure, he was asking to be aligned with XYZ. But XYZ didn't exist here. So what was he now?

  He thought of his mother. She had died in the Enclosure. She was a good woman. She taught him to share, to conserve, to be kind. But her concept of *goodness* was wrapped up in the preservation of the synthetic fluid. She believed saving the Flow was a moral imperative because the substance was sacred.

  But the substance was just industrial coolant, repurposed.

  Elias looked at the water in the glass. If he drank it, was he breaking a vow? Or was the vow meaningless because the object of the vow didn't exist outside the walls of the colony?

  He remembered the philosopher who debriefed him during extraction. "Your mental state is the same," the man had said. "But the reference class has shifted. You aren't thinking about water. You're thinking about what you *called* water."

  So what about purity? Was purity a natural kind like water? If the external world changes, does the moral law shift with it?

  Elias felt a nausea that had nothing to do with the liquid. If his mother's virtue depended on the chemical structure of her drinking supply, then her virtue was contingent on a manufacturing error. She wasn't good; she was just calibrated to a different fluid.

  He turned the faucet off. The silence of the kitchen was heavy. He looked at the glass again. It was just H2O. It wasn't sacred. It wasn't sinful. It was just wet.

  He drank it. It tasted like nothing. It tasted like Earth.

  He waited for the corruption, the decay, the sin. Nothing happened. He was still Elias. But the word *pure* felt hollow now, like a coin from a country that never existed. He wiped his mouth with the back of his hand. He needed to learn a new language, one where the words didn't depend on the pipes.

