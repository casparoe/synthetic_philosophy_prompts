answer: |-
  **METAPHYSICS OF SPACE AND TIME: FINAL EXAMINATION**

  **Time Allowed:** 45 Minutes
  **Total Marks:** 25
  **Instructions:** Answer both parts of the question. This is a closed-book examination. Do not refer to specific authors or texts; argue on the merits of the positions described.

  **Question 1**

  Consider an argument against the metaphysical possibility of actual infinities based on the following scenario: A hotel with infinitely many occupied rooms can accommodate new guests by shifting existing guests to new rooms (e.g., from room *n* to *2n*), thereby creating vacancies. Critics argue this leads to absurdity.

  **(a)** Distinguish between the *static* absurdity allegedly inherent in the cardinality of the collection itself and the *dynamic* absurdity inherent in the process required to demonstrate the vacancies. (5 marks)

  **(b)** Evaluate the claim that the scenario only proves the impossibility of completing unbounded causal processes (supertasks), not the impossibility of actual infinities *simpliciter*. In your evaluation, you must:
  (i) Assess whether the mathematical rigour surrounding the hierarchy of infinite sizes supports or undermines the claim that infinity is metaphysically pathological.
  (ii) Address the tension arising if the critic accepts continuous space or time while rejecting actual infinities in concrete objects.
  (20 marks)

  ***

  ### MODEL ANSWER

  The argument from the infinite hotel is frequently deployed to demonstrate that actual infinities are metaphysically impossible. However, a careful dissection reveals that the alleged absurdity does not stem from the existence of an infinite set, but rather from the physical or causal assumptions required to manipulate it. The argument ultimately fails as a proof against actual infinities *simpliciter* and succeeds only, if at all, as an argument against specific kinds of infinite causal powers or supertasks.

  To see this, we must first distinguish the static from the dynamic elements of the scenario, as requested in part (a). The *static* claim is that a set being in one-to-one correspondence with a proper subset of itself is inherently contradictory. This is false; it is merely counterintuitive. In set theory, this property (Dedekind-infinity) is the definition of an infinite set, not a contradiction. There is no logical inconsistency in the state of affairs where every room is occupied and yet more can fit, provided we accept standard cardinal arithmetic. The *dynamic* absurdity arises only when we demand the guests physically move to demonstrate the vacancy. Here, the absurdity is not that the rooms exist, but that an infinite number of discrete causal actions (walking down the corridor) can be completed. The static scenario describes a state; the dynamic scenario describes a process. The contradiction lies in the completion of the process, not the existence of the state.

  This leads to the core evaluation: the hotel argument is really an argument against supertasks. For the vacancies to appear "suddenly," the reshuffling must be completed. But in a concrete hotel, the guest in room $10^9$ must travel a billion units of distance. There is no upper bound on the distance travelled, and no final guest who finishes moving. If time and speed are bounded, the task cannot be completed in finite time. Therefore, the impossibility is not that there are infinitely many guests, but that finite agents cannot execute an infinite sequence of displacements. The bare cardinality fact—that a set can map to a proper subset—does no independent work in generating the paradox. It is the causal cost of the reshuffle that creates the tension. If we imagine the guests simply *are* in the new rooms (a static comparison of two states), no absurdity arises. Thus, the argument targets the causal powers of agents within the hotel, not the ontological status of the collection.

  Regarding the hierarchy of infinities, critics often point to Cantor's theorem and the endless ascent of larger cardinals as evidence of pathology. They argue that a reality containing such "monsters" is unintelligible. However, this cuts the other way. The fact that these hierarchies are handled with complete mathematical rigour suggests that infinity is precisely the sort of concept that is coherent, even if non-intuitive. Pathology implies inconsistency or unmanageability. Yet, transfinite arithmetic is consistent (relative to ZFC). The "spookiness" is psychological, not logical. If mathematics can rigorously distinguish between countable and uncountable infinities without contradiction, the metaphysical objection loses force. The hierarchy demonstrates richness, not incoherence. To claim that mathematical rigour implies metaphysical impossibility is to conflate epistemic surprise with ontological impossibility.

  Finally, the critic faces a severe tension regarding continuity. The proponent of the hotel argument typically wishes to preserve continuous space or time while rejecting actual infinities in concrete objects (like guests). However, a continuous line contains uncountably many points. If space is continuous, then between any two points in the hotel corridor, there are actually infinitely many spatial locations. If the critic accepts continuous space, they have already accepted actual infinities in the fabric of reality. To remain consistent, the finitist must either reject continuous space (adopting a discrete or point-free geometry) or admit that their objection is not to infinity itself, but specifically to *concrete, countable objects* possessing infinite cardinality. The former is a radical revision of physics; the latter is an arbitrary restriction. If points in space can be actually infinite, why not guests in rooms? The distinction requires a principled difference between spatial points and material objects that the hotel argument does not provide.

  In conclusion, the hotel argument does not establish the impossibility of actual infinities. It establishes that unbounded causal processes involving discrete agents cannot be completed in finite time under standard physical constraints. The mathematical coherence of infinite hierarchies suggests infinity is not pathological, and the acceptance of continuous space undermines the finitist's consistency. The argument should be reclassified as a limitation on supertasks, leaving the metaphysical possibility of actual infinities intact.

  ***

  ### MARKING SCHEME (25 Marks)

  **Part (a): Distinction between Static and Dynamic (5 Marks)**
  *   **5:** Clear distinction. Identifies 'static' as cardinality/bijection (state of affairs) and 'dynamic' as the movement/reshuffle (causal process). Notes that the contradiction is often located in the latter.
  *   **3-4:** Identifies the difference but vague on why it matters (e.g., just says "one is math, one is physics" without linking to the paradox generation).
  *   **1-2:** Merely describes the Hotel scenario without distinguishing the *source* of the absurdity.
  *   **0:** Irrelevant or blank.
  *   *Common Error:* Conflating "no empty rooms" with "no bijection available." Assuming the static state is already contradictory without the move.

  **Part (b)(i): The Supertask/Causal Process Claim (8 Marks)**
  *   **7-8:** Robust evaluation. Argues that the paradox relies on the *completion* of the move. Explicitly states that cardinality facts (Dedekind-infinite) are neutral until causal costs are added. Commits to a view on whether this saves actual infinity.
  *   **5-6:** Explains the supertask objection well but hedges on the conclusion. Good analysis of the "walking" cost but less clear on whether this exonerates infinity itself.
  *   **3-4:** Describes the supertask issue but treats it as a side note. Fails to link the "unbounded distance" to the impossibility of completion.
  *   **1-2:** Dismisses the physical worry with "it's only a thought experiment."
  *   *Common Error:* Dismissing the walking-down-the-corridor worry with 'it's only a thought experiment so the physics doesn't matter'.

  **Part (b)(ii): Cantor's Hierarchy & Continuity Tension (4 Marks)**
  *   **4:** Addresses both sub-requirements. (1) Argues rigour reduces spookiness (or defends the opposite convincingly). (2) Notes that continuous space entails uncountable infinities, forcing the finitist to go discrete.
  *   **2-3:** Addresses one sub-requirement well, ignores the other. Or addresses both superficially.
  *   **1:** Mentions Cantor or space but gets the implication wrong (e.g., claims Cantor's theorem proves infinity is contradictory).
  *   *Common Error:* Assuming the Hotel argument needs Cantor's theorem (it only needs Dedekind-infinity).

  **Structure, Clarity, and Commitment (4 Marks)**
  *   **4:** Essay flows logically. Conclusion is decisive (takes a side). No namedropping.
  *   **3:** Clear structure, but conclusion is wishy-washy ("both sides have points").
  *   **2:** Disorganized or hard to follow.
  *   **1:** Incoherent.
  *   *Common Error:* Naming authors (Craig, Hilbert, Cantor) despite instructions.

  **Grade Boundaries & Feedback Notes**

  *   **First (20-25):** Must commit to a position in the conclusion (e.g., "The argument fails as metaphysics, succeeds as physics"). Must integrate the continuity tension as a *reductio* of the finitist's consistency, not just an add-on. The distinction in (a) must drive the argument in (b).
  *   **2:1 (15-19):** Solid reconstruction of the supertask objection. Hits the Cantor and Continuity points but may treat them as separate checklist items rather than woven into the main argument. May hesitate to conclude definitively.
  *   **2:2 (10-14):** Narrates the Hotel story accurately but fails to analyse the *source* of the paradox. Might claim the bijection itself is the contradiction. Misses the continuity tension.
  *   **Third (5-9):** Confuses cardinality with counting. Claims Cantor's theorem is required for the Hotel paradox. Dismisses the physical constraints entirely.
  *   **Fail (0-4):** Fundamental misunderstandings of infinity (e.g., "infinity is just a big number"). Does not answer the specific parts.
