answer: |-
  This practice of selective institutional concealment is best understood as revealing a hidden conceptual asymmetry wherein the duty to remember binds us absolutely to victims while the memory of perpetrators remains contingent upon therapeutic social utility. The tension arises because viewing remembrance as a civic moral bond posits that shared truth constitutes the community, making forgetting a form of moral betrayal that dissolves the obligations binding citizens to one another and to the past. Conversely, viewing forgetting as a therapeutic social good posits that an unyielding attachment to past wrongs can poison the present, suggesting that social health sometimes requires the dissolution of historical grievances to allow for future cohesion. In the scenario provided, the institution prioritizes the therapeutic model for the living descendants while ostensibly maintaining the civic bond model for the victims, creating a fractured ethical landscape. If this were merely a failure of the duty to remember, it would imply a negligence of truth that undermines the institution's primary purpose, yet the concealment is deliberate and justified by a competing moral good: the protection of innocent descendants from stigmatization. If this were a legitimate exercise of a right to forget, it would require that the descendants possess a claim over the historical record of their ancestors' actions, which conflates personal privacy with public history and mistakenly assigns the capacity to forgive or forget to those who did not suffer the harm. The asymmetry explanation holds most rigorously because it exposes that our moral grammar treats the memory of suffering as sacred and non-negotiable, whereas the memory of inflicting suffering is treated as instrumental and disposable when it threatens social stability. By archiving the names but hiding them, the state acknowledges the truth exists (satisfying a minimal bureaucratic duty) but denies it social efficacy (prioritizing therapeutic peace over full accountability). This reveals that the imperative to remember is not universal but hierarchical: we are bound to remember the dead who were harmed to honor their humanity, but we are only bound to remember the dead who caused harm insofar as it does not disrupt the humanity of their living kin. Consequently, the institution purchases intergenerational harmony at the cost of full historical transparency, signaling that the moral bond of citizenship is strong enough to sustain victimhood but too fragile to sustain the full weight of collective perpetration.
