      *   *Focus on (4) - The Shadow Problem:* The flatmate claims coarse-graining preserves organization. But Functionalism (1) isn't just about actual state transitions; it's about *what would happen* if inputs changed.
      *   *Example:* A phone running a game. If I group "Pixel Red" and "Pixel Blue" into "Color State 1," does the system behave consistently if the input changes? Usually, coarse-graining destroys the specific causal pathways required for complex computation (like agony). Agony requires specific feedback loops. Random lumping breaks the logic gates.
      *   *Focus on (5) - Boundaries:* A system plus air doesn't have the same causal boundaries. The air introduces noise/entropy that breaks the closed loop required for the specific organization.
      *   *Focus on (6) - Echo:* This requires the system to store the state. If it's overwritten, the "second run" doesn't exist simultaneously. If it exists sequentially, it's not "more suffering now."
      *   *Focus on (2) - Counting:* If we can't sharply define boundaries, the *number* of minds is indeterminate. This doesn't kill morality; it just means "how many minds" isn't a precise integer. Moral weight tracks the *degree of certainty* or the *robustness* of the implementation.

  6.  **Structuring the Advice:**
      *   **Validate:** This is the "Problem of Too Many Minds" / "Triviality Argument."
      *   **Primary Target:** Premise (4). The "Shadows" are not valid implementations because they fail the **Counterfactual Test**.
      *   **Secondary Target:** Premise (2). Accept **Indeterminacy**.
      *   **Cost Analysis:**
          *   Fixing (4) requires a causal theory of computation (not aesthetic, but technical).
          *   Fixing (2) requires accepting vague identity (metaphysically costly but manageable).
      *   **Moral Implication:** Morality isn't swamped because the "cheap minds" aren't real minds.

  7.  **Refining the "Counterfactual" Argument (Crucial Step):**
      *   Functionalism (1) says: "states lead to which others, *counterfactually*."
      *   Argument (4) says: "Lump states... next coarse state is fixed by current coarse one."
      *   *The Catch:* Just because the *actual* trajectory fits a pattern doesn't mean the *counterfactual* trajectory does.
      *   *Example:* A system actually goes A->B->C. I map A&B to "1" and C to "2". It looks like 1->2. But if the system had gone A->D, would it still look like 1->2? If D maps to "3", then the organization is different. For a complex organization (like agony), the counterfactual structure is massive. Random lumping almost certainly breaks the counterfactual dependencies required for *that specific* organization.
