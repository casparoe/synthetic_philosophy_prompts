          *   *Applying to (6):* Time-shifting requires memory/storage to hold the state. A phone doesn't store its past state in a way that allows it to be read as a current state for a *separate* computation running in parallel.
          *   *Cost:* Requires a robust theory of implementation (e.g., Chalmers, Millikan, or causal account). It's not just "aesthetic." It's about causal topology.

