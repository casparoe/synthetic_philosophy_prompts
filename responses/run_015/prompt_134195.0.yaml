answer: |-
  Your interchangeability view is structurally ambitious, attempting to bridge the gap between causal inefficacy and moral responsibility. However, its exposure varies significantly across its components. Below is a map of the vulnerabilities, ranked from those that threaten the view's coherence to those that merely constrain its application.

  **1. Overgeneration (Fatal)**
  The most severe exposure lies in the 'waste-not' case. Here, the harm (animal death) is fully constituted by the purchase; the meat exists and will be binning regardless of your consumption. Your membership claim identifies your eating as an instance of the harmful practice, and the no-free-riding condition blocks the excuse that others bought the meat anyway. Yet, intuitively, wasting the meat seems worse than eating it, and eating it seems morally neutral compared to buying it.

  *Defender's Stance:* You must **concede** this counts against the view as currently formulated. If the view condemns an act that causally exacerbates nothing and participates in a harm already fixed by another agent, it severs the link between wrongness and harm constitution. To survive, you would need to refine the 'membership claim' to specify that the relevant practice must be one where individual instances *contribute* to the constitution of the harm, not merely instantiate the type. If you cannot distinguish the eater from the buyer in terms of harm constitution, the view overgenerates blame to the point of absurdity. The 'legitimation' case (voting) is less dangerous; here, the harm (if any) is constituted by the collective outcome, and every vote is genuinely interchangeable in that constitution.

  **2. Insulation (Fatal)**
  Your three limiting conditions (exit costs, constitution vs. risk, crowding out) risk rendering the view unfalsifiable. In empirical science, a theory that explains every outcome by adjusting auxiliary hypotheses is vacuous. In normative theory, the danger is similar: if every counterexample is met with the claim that 'exit costs were not modest enough' or 'the harm was merely risked', the view becomes a dogma rather than a testable hypothesis.

  *Defender's Stance:* You must **concede** this is a methodological vulnerability. To avoid evasiveness, you need independent criteria for 'modest cost' and 'constitution' that do not rely on the moral verdict you are trying to derive. If 'modest cost' is defined as 'whatever cost it is permissible to impose to avoid wrongness', the argument is circular. You would need to show that these conditions can be specified sociologically or economically prior to moral judgement. If you cannot, the view is insulated from refutation only by becoming empty.

  **3. The Disjunction Worry (Serious)**
  You worry that the membership claim and the difference-making backstop cover disjoint territory: membership handles the provably zero-impact cases, while the backstop handles the uncertain ones. This looks like two weaker views bolted together to cover all bases. If the membership claim is strong enough to do the work in zero-impact cases, why do we need the backstop? If the backstop is sufficient for ordinary cases, why invoke membership?

  *Defender's Stance:* You might **dismiss** this as demanding an unnecessary unity. Honest moral pluralism often accepts different grounds for different cases. However, you should concede that if the justifications pull in different directions, the view lacks explanatory power. For instance, if the backstop suggests a probabilistic duty and membership suggests a categorical one, how do they aggregate? If you delete the membership claim, the view collapses in hard deterministic cases; if you delete the backstop, it becomes implausibly rigid in uncertain ones. The exposure here is not fatal, but it leaves the view looking like a patchwork rather than a unified theory of agency.

  **4. The Empirical Question (Awkward)**
  Suppose we learned that consumer choices truly have zero causal ripple—no thresholds, no signalling. This destroys the backstop entirely. It leaves the membership claim standing, but isolated. Conversely, if evidence shows ripples exist, does this support the view, or merely show the backstop was unnecessary?

  *Defender's Stance:* You must **concede** that the backstop is empirically contingent. If the causal facts turn out to be deterministic and granular, the backstop is false. This is awkward but not fatal, provided the membership claim can stand alone. However, if your defence of the membership claim relies on the intuition that 'someone must be making a difference', then empirical evidence of zero difference undermines the motivation for membership too. The view is strongest if you argue membership is independent of causal facts; if you rely on the backstop to bolster the membership claim, empirical disconfirmation is damaging.

  **5. Crowding-Out Evidence (Awkward)**
  You ask whether evidence that individual action crowds out collective action counts against the wrongness claim or the advice. If acting individually reduces the likelihood of a systemic solution, does that make the act wrong, or just inadvisable?

  *Defender's Stance:* You should **concede** this counts against the action-guidance, not necessarily the wrongness. An act can be pro tanto wrong (by membership) yet all-things-considered permissible if it prevents greater harm (by crowding out collective efficacy). However, if the crowding-out effect is large enough, it may undermine the 'modest exit cost' condition. If exiting the practice undermines the political coalition needed to change it, the cost of exit is arguably high. This does not kill the view, but it complicates the calculation significantly, turning a clear duty into a complex strategic assessment.

  **Summary**
  The view's greatest exposure is internal coherence in the 'waste-not' case and methodological vacuity via the limiting conditions. These require concession and revision. The disjunction and empirical contingencies are awkward but manageable within a pluralist framework. The crowding-out issue is primarily pragmatic. To secure the view, you must tighten the definition of 'harm constitution' to exclude pre-fixed harms, and specify the limiting conditions independently of the moral conclusions they protect.
