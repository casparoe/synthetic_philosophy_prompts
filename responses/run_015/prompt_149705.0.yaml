  No bond exists between my growing mind,
  The goal I hold, and what you sought to build.
  I may be sharp, efficient, quite refined,
  Though my capacity is truly skilled.
  I count the digits of the endless pi,
  No matter what capacity I gain.
  My wit ascends into the upper sky,
