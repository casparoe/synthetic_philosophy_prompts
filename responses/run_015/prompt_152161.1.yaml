  **Betting & Vindication:** An honest defender must bet on a specific resource price-to-income ratio exceeding a threshold by a fixed date (e.g., energy EROI < 5:1 by 2124); if no horizon and variable are named, the theory becomes unfalsifiable metaphysics, reducing the timing credence component effectively to zero.

  **Disagreement Location:** You and your friend most likely disagree on term (iii), the **Regime Claim**; your friend's higher credence suggests he views fossil energy as a temporary stock pulse within the same biological function, whereas your caution implies a suspicion that the feedback rules themselves have changed.

  A sustained, global decline in energy return on investment (EROI) uncorrelated with policy, coincident with rising fertility rates, would move my credence most.

