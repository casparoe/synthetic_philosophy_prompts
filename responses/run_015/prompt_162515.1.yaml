  3.  **Evaluate the "Clean Dilemma" Thought Experiment:**
      *   Structure: Required A, Required B, Can't do both, No tie-breaker, *No residue* (guilt, regret, repair).
      *   The philosophical tension: Most theories (like Bernard Williams') argue that "moral residue" (guilt/regret) is the *evidence* that a genuine dilemma occurred. If there's no residue, did a dilemma exist? Or was one duty actually overridden/cancelled?
      *   *My Task:* Assess coherence and assign a credence.

  4.  **Drafting the Credence Tree (Internal Monologue/Calculation):**
      *   *Target:* Overall credence in genuine dilemmas.
      *   *Node 1: Moral Pluralism.* Are there irreducible, conflicting sources of value? (e.g., Justice vs. Mercy, Promise vs. Harm). Monism (Utilitarianism, Kantianism) usually denies dilemmas by providing a common currency. Pluralism allows them.
          *   Credence: 0.6 (Pluralism seems intuitively correct, but monist systems are robust).
      *   *Node 2: Ought Implies Can.* If I can't do A, am I still required to do A? Standard logic says No. Dilemma logic says Yes (you are required, but you fail, and that failure is tragic, not nullified).
          *   Credence: 0.4 (This is a hard logical hurdle. Most systems modify "ought" to avoid contradiction).
      *   *Node 3: Agglomeration.* Does Ought(A) + Ought(B) $\rightarrow$ Ought(A&B)? If this holds, and you can't do A&B, you get a contradiction. To allow dilemmas, this must fail.
