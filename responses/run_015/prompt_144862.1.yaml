answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** Rational Choice in the Enriched Death in Damascus Case
  **Signatories:** The Causal Decision Theorist (CDT) and The Evidential Decision Theorist (EDT)

  **I. AGREED CLAIMS**

  1.  **Causal Independence:** Death's location was fixed yesterday. Your current act cannot causally influence whether Death is in Damascus or Aleppo. The dossier method is a common cause of both Death's location and your unaided choice, but your choice does not cause Death's location.
  2.  **Distinction from Newcomb:** This is not Newcomb's problem regarding pre-commitment. In Newcomb cases, disputes often turn on whether an agent can arrange their character or commitments in advance to influence the predictor. Here, the dossier predicts *unaided* choice specifically. No trait of character, pre-commitment, or self-training buys survival advantage because the dossier's accuracy is defined relative to the unaided moment of choice, bypassing prior arrangements.
  3.  **Act-Conditional Symmetry:** Conditional on the act of staying, the probability Death is in Damascus is 0.8 (survival 0.2). Conditional on the act of fleeing, the probability Death is in Aleppo is 0.8 (survival 0.2). Both pure acts yield identical expected survival rates when conditionalizing on the act.
  4.  **Unconditional Asymmetry:** Your current unconditional credence that Death is in Aleppo is 0.74, derived from the itch. Consequently, staying yields a 0.74 chance of survival by current lights, while fleeing yields 0.26.
  5.  **Long-Run Frequencies:** In a population of agents with this itch structure: agents who always stay or always flee survive 20% of the time. Agents who delegate to a coin or take the pill survive 50% of the time.
  6.  **Availability and Upper Bound:** The coin and the pill are genuinely available acts at negligible cost. There is no available act that yields a survival probability greater than 0.74. The disagreement is whether 0.74 (Stay) or 0.5 (Coin/Pill) is the rational target.

  **II. DISAGREEMENTS TABLE**

  | Claim | Causal Decision Theorist (CDT) | Evidential Decision Theorist (EDT) | Verdict |
  | :--- | :--- | :--- | :--- |
  | **1. The Rational Act** | **Stay.** We maximize causal expected utility. Since Death's location is causally independent of our act, we use unconditional credences. $EU(Stay) = 0.74 \times 1 = 0.74$. $EU(Coin) = 0.5$. Stay dominates. | **Coin or Pill.** We maximize evidential expected utility. We must conditionalize on the act. $EU(Stay) = P(Survival|Stay) = 0.2$. $EU(Coin) = 0.5$. Randomizing breaks the fatal correlation. | **Substantive.** |
  | **2. Status of the Itch** | **Fixed Evidence.** The itch is evidence of the state (Death's location) via the dossier. It is not evidence that the act *changes* the state. Deliberation cannot treat the itch as a reason to act against it to change the state, because the state is fixed. | **Act-Indexed Evidence.** The itch is evidence of what I will do. Since what I do is correlated with Death's location, the itch is evidence of Death's location *conditional on my act*. I must account for the news my act brings. | **Verbal/Substantive.** |
  | **3. Normative Goal** | **Causal Efficacy.** Rationality is about doing what makes the best difference to the world. Since staying does not cause Death to move, but aligns with where Death likely isn't, it is the rational choice. | ** auspiciousness.** Rationality is about choosing acts that are good news. Staying is bad news (implies Death is there). Coin-flipping is neutral news. We should choose acts that correlate with survival. | **Substantive.** |

  **III. THE CRUXES**

  **(a) Admissibility of the Itch**
  *Question:* May an agent deliberate using a sign (the itch) that predicts their own act, and then deliberately act against it?
  *Concrete Case:* An agent feels an itch to flee but stays.
  *CDT Prediction:* Permissible. The itch indicates where Death likely is (Aleppo). Staying avoids that location. The itch's prediction of the act is irrelevant to the causal outcome.
  *EDT Prediction:* Irrational. If the itch predicts fleeing, and fleeing correlates with Death in Aleppo, staying correlates with Death in Damascus. Acting against the itch confirms the bad correlation. The itch makes the act informative; ignoring it ignores the evidence.

  **(b) Expected Utility vs. Frequency**
  *Question:* Should we maximize expected utility at the moment of action or the long-run survival frequency of the policy?
  *Concrete Case:* A population of 1,000 agents follows the CDT recommendation (Stay).
  *CDT Prediction:* Each agent acted rationally. The group survives at 20%. Rationality does not guarantee group success when correlations are non-causal. The metric is individual causal impact.
  *EDT Prediction:* The policy is irrational. A theory recommending a policy with 20% survival when a 50% policy is available is defective. The metric must track success frequencies achievable by the agent.

  **(c) The Pill Option**
  *Question:* Does the availability of the pill (erasing the itch) show that the 0.74 credence is an artifact?
  *Concrete Case:* Agent takes the pill, credence resets to 0.5, survival becomes 0.5.
  *CDT Prediction:* The pill is inferior. Before the pill, survival was 0.74 (by staying). Destroying evidence to lower survival probability from 0.74 to 0.5 is irrational. The 0.74 is real credence, not an artifact.
  *EDT Prediction: The pill is superior.* Before the pill, staying yielded 0.2 survival. The 0.74 was a mirage created by conditioning on the state rather than the act. The pill allows access to the 0.5 survival rate actually achievable by breaking the correlation.

  **(d) Delegation to a Coin**
  *Question:* Is delegation an act a decision theory may recommend?
  *Concrete Case:* Agent flips a coin. Dossier could not anticipate this.
  *CDT Prediction:* Permissible but suboptimal. The coin yields 0.5 survival. Staying yields 0.74. Delegation is only rational if the agent cannot form a credence about the state, which is false here.
  *EDT Prediction:* Recommended. Delegation makes the act probabilistically independent of Death's location. It restores the survival rate to the base rate of the coin (0.5), avoiding the 0.2 trap of deterministic acts.

  **IV. CLOSING ASSESSMENT**

  In my judgment, the substantive core of this dispute is not about probability calculus—both parties accept the model—but about the normative significance of causal independence. The CDT insists that rationality tracks causal leverage: since you cannot move Death, you should bet on where he isn't. The EDT insists that rationality tracks auspiciousness: since your choice is a symptom of Death's location, you should choose the symptom of survival.

  Much of the friction is verbal, centering on the definition of "expected utility." However, the divergence on the Pill and Coin options reveals a substantive split regarding whether an agent should treat their own decision as a variable that can break correlations. The CDT treats the decision as a revelation of existing facts; the EDT treats it as an intervention in a statistical network. The stake is whether rational agency requires us to ignore useful correlations when they lack causal power. The CDT says yes; the EDT says no. Given that the EDT policy yields higher survival frequencies (50% vs 20% for deterministic acts), the EDT position appears pragmatically superior, unless one holds that causal efficacy is the sole constituent of rationality regardless of outcome. The document stands as a record that both theories are internally consistent, but they optimize different quantities.
