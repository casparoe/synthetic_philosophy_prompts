answer: |-
  The administrative pattern you describe rests on a hybrid theoretical foundation that is publicly justified by one logic (reciprocity) but structurally enabled by another (captivity). To understand what this bundle of practices presupposes, we must distinguish between the *normative justification* offered for the system and the *structural conditions* required for it to function.

  ### 1. The Presuppositions of Desert and Voluntarism

  For the conditionality regime to make normative sense—to be more than mere coercion—it strictly presupposes a **voluntarist account of unemployment**.

  If unemployment were understood primarily as a structural outcome (a lack of demand, a skills mismatch, geographic immobility), then requiring a claimant to document job-search steps would be akin to requiring a starving person to document their digestion. The practice implies that the barrier to employment is located within the agency of the claimant (effort, attitude, compliance) rather than in the economy. Therefore, the system presupposes that continued joblessness is, at the margin, a choice or a failure of will that can be corrected by administrative pressure. Without this belief, the sanctions are not incentives; they are penalties for misfortune, which undermines any claim to justice.

  Regarding the **household means test**, the practice presupposes a specific moral anthropology of the family. It treats the household as a single unit of economic responsibility, implying that resources *ought* to be shared and that dependency within the private sphere negates entitlement in the public sphere. This is a selective presupposition. The surrounding tax system often treats individuals as autonomous agents (e.g., individual tax allowances), acknowledging their separate economic standing. By contrast, the welfare system treats the poor as embedded dependents whose partners' resources are deemed available to them. This presupposes that for the poor, the family is a safety net that the state is entitled to pierce; for the solvent, the family is a private association protected from state inquiry.

  ### 2. Reciprocity vs. Captivity: Presupposition vs. Compatibility

  You ask whether the reciprocity reading is strictly presupposed or if the pattern is equally available to a deterrence rationale.

  **The Reciprocity Reading** is the *public justification* but not the *structural prerequisite*.
  *   **What it licenses:** It licenses the behavioral conditions (job search, accepting work). If welfare is a mutual obligation, the claimant owes effort in exchange for support.
  *   **Where it fails:** It cannot license the **error asymmetry**. Reciprocity implies a binding contract between equals. If the agency breaches the contract (error causing underpayment), it should owe interest or damages just as the claimant owes recovery for overpayment. The fact that the agency is not bound reciprocally reveals that the relationship is not actually contractual.

  **The Captive-Beneficiary Reading** is the *structural prerequisite* but not the *public justification*.
  *   **What it explains:** It explains the **selectivity** of the conditionality. Conditions are imposed only where the recipient has no exit option. Solvent recipients of tax breaks can "exit" (by earning less, though they won't), but more importantly, they have political voice and legal resources. The poor cannot exit (they need to eat) and are cheap to surveil.
  *   **What it licenses:** It licenses the asymmetry and the fraud rhetoric. If the claimant is a captive subject rather than a contracting partner, the state acts as a principal managing a risk. "Fraud" becomes a label for administrative non-compliance rather than a moral failing, but because the subject is captive, the rhetoric can be escalated to moral condemnation without fear of effective rebuttal.

  **Conclusion on Theory:** The practice is **theoretically unstable**. It requires the *language* of reciprocity to avoid being denounced as tyranny, but it requires the *reality* of captivity to be enforceable. A pure deterrence rationale (moral hazard) would logically apply to all public spending to prevent waste. The fact that it does not apply to pensions or tax relief shows that "moral hazard" is not the true principle; **status** is. The practice presupposes that the poor are a distinct moral class for whom normal rules of privacy and trust are suspended.

  ### 3. The Symmetry and Inversion Tests

  Applying your tests reveals which parts of the practice are principled and which are artifacts of power.

  **The Symmetry Test:** *Would we attach these conditions to benefits where recipients could exit?*
  *   **Application:** Require pensioners to job-search? Require recipients of mortgage interest relief to prove they searched for cheaper houses?
  *   **Result:** Total collapse. We intuitively recognize these as absurd.
  *   **Implication:** This demonstrates that conditionality is not intrinsic to the *nature of public funds*. It is intrinsic to the *status of the recipient*. The practice survives this test only if one believes that poverty itself alters one's standing as a citizen, stripping away the presumption of autonomy granted to the solvent. If the Symmetry Test fails, the practice is revealed as discriminatory rather than principled.

  **The Inversion Test:** *Mirror every claimant duty onto the agency.*
  *   **Application:** If a claimant is sanctioned for missing an appointment, is the agency sanctioned for missing a payment? If a claimant must repay overpayments without fault, must the agency pay interest on underpayments without fault? If a claimant must prove job search, must the agency prove job availability?
  *   **Result:** Selective collapse.
      *   **Survivors:** The income test might survive (scarcity is real).
      *   **Collapses:** The sanctions regime collapses (the state cannot be "sanctioned" in the same way). The fraud rhetoric collapses (state error is "administrative," not "fraudulent"). The continuous disclosure burden collapses (the state has the data).
  *   **Implication:** The relationship is hierarchical, not mutual. The "obligations of membership" are one-way. The claimant owes duties to the state; the state owes only discretion to the claimant. The Inversion Test proves that the system is not based on reciprocity, because reciprocity would survive inversion.

  ### 4. Philosophical Underdetermination

  The practice is philosophically underdetermined because different ethical frameworks can accommodate parts of it while rejecting others.

  **The Sufficientarian:**
  *   **View:** Justice requires everyone reach a threshold of adequacy.
  *   **Verdict:** A sufficientarian has **no reason** to retain conduct conditions (job search, sanctions) unless they are empirically proven to be the *only* way to get people above the threshold without pushing others below it.
  *   **Change:** If sanctions push people below the threshold (by removing income), the sufficientarian must reject them. The income test remains (to target scarcity), but the behavioral conditions are contingent tools, not moral requirements. The error asymmetry is unacceptable if it threatens the threshold.

  **The Relational Egalitarian:**
  *   **View:** Justice requires relationships of equality, not hierarchy or stigma.
  *   **Verdict:** The current practice is likely **constitutively unjust**. It produces the very "undeservingness" it claims to detect by forcing claimants into a subordinate, surveilled position.
  *   **Change:** Conditionality must go because it creates a status distinction between the "giver" (state) and "beggar" (claimant). The fraud rhetoric must vanish as it creates a relationship of suspicion. The household test might remain if framed as resource allocation, but not if it implies one citizen is responsible for another's moral standing.

  **Unconditional Membership:**
  *   **View:** Support is an incident of citizenship, like defense or law.
  *   **What must change:**
      1.  **Sanctions:** Must disappear entirely. You do not sanction a citizen for failing to behave in a way that retains their right to police protection.
      2.  **Fraud Rhetoric:** Must vanish. Non-compliance becomes a debt issue, not a criminal/moral one.
      3.  **Conduct Conditions:** Job search and appointment attendance become voluntary services, not mandates.
      4.  **Means Test:** This is the complex variable. If the right is universal, the means test goes. If the right is to a *minimum*, the means test stays but becomes a simple income tally, not a moral inquiry into household dynamics.
      5.  **Error Asymmetry:** Must be equalized. The state and citizen stand on equal footing regarding administrative error.

  ### 5. Reconstruction of the Implicit Theory

  The implicit theory of the current practice is **Status-Based Contractualism**.

  1.  **Citizenship is Tiered:** There are "independent" citizens (solvent, tax-paying) who relate to the state via rights and rules, and "dependent" citizens (poor, claimant) who relate to the state via duties and discretion.
  2.  **Poverty is Presumptively Suspicious:** The state presumes that without surveillance, the dependent citizen would choose idleness over work. This presumption does not attach to the independent citizen's use of tax breaks.
  3.  **The Family is a Resource for the Poor:** The state claims a right to the private resources of the poor's family that it does not claim against the rich's family.
  4.  **Administrative Efficiency Trumps Equity:** The error asymmetry is licensed by a theory that prioritizes the protection of public funds from the poor over the protection of the poor from the state.

  **Where Theories Overlap:**
  *   **Deterrence and Reciprocity:** Both license the job-search requirements. They diverge on *why* (preventing laziness vs. fulfilling obligation).
  *   **Sufficientarianism and Membership:** Both might retain a means test (due to scarcity), but they diverge on sanctions (Sufficientarians might keep them if effective; Membership theorists would not).

  **What is Strictly Presupposed vs. What Fits:**
  *   **Presupposed:** A belief that individual effort is the primary determinant of employment status (Voluntarism). A belief that the state has a right to inquire into the private finances of the poor that it does not have for the rich (Status Distinction).
  *   **Fits Well (but not required):** The specific mechanism of weekly job searches (could be monthly). The specific duration of sanctions. The household definition (could be wider or narrower).
  *   **Incompatible with Reciprocity:** The error asymmetry and the lack of agency sanctions. These are artifacts of power, not theory.

  In sum, the practice makes sense only if one accepts that the poor are not full partners in the social contract but rather wards of the state. The reciprocity language is a veneer applied to a relationship of dominance. To make the system coherent with a theory of equal citizenship, one would have to dismantle the asymmetry, the fraud rhetoric, and the behavioral conditions, leaving only a resource-allocation mechanism that treats the claimant as an agent capable of error but not of moral failure.
