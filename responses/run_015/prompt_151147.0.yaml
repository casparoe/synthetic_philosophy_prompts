  You have correctly diagnosed your own position: you are operating with **Conceptual Pluralism**. You aren't applying one metaphysical rule; you are switching between *Spatiotemporal Continuity* (Case 1), *Psychological/Social Continuity* (Case 2), *Narrative Continuity* (Case 3), *Structural Integrity* (Case 4), and *Legal Normativity* (Case 5).

  This is actually how most humans reason about identity. We treat a "ship" as a biological organism in Case 1, a social institution in Case 2, a book in Case 3, and a legal person in Case 5.

  However, since you asked for a **clean account** (a unifying principle), here is the analysis of your stuck case, the inconsistency in your current set, and the prediction for the museum ship.

  ### 1. The Unifying Principle: Causal-Spatiotemporal Continuity
  To unify Cases 1–4 without making Case 5 weird, the strongest principle is **Uninterrupted Causal-Functional Organization**.

  *   **The Rule:** An object persists as long as there is an unbroken causal chain of maintenance and function that preserves its organizational structure.
  *   **Why it fits 1–4:**
      *   **Case 1:** Planks are swapped *in situ* while sailing. The causal chain of "shipness" is never broken.
      *   **Case 2:** Gradual crew swap maintains the social causal chain (knowledge transfer). Instant swap breaks the chain of shared memory/intent (hence "stolen identity").
      *   **Case 3:** The log is the same because the *information flow* is continuous. Random notes break the causal link of the narrative.
      *   **Case 4:** The ship is cut and spliced. Even if original parts remain, the *organizational history* was interrupted to insert a foreign middle. The causal chain of *this specific vessel's* construction was broken.
      *   **Case 5:** The fire breaks the physical causal chain. Legal paperwork cannot restore a metaphysical causal chain.

  ### 2. The Verdict on the Stuck Case (AI Backup)
  **Verdict: The Ship Died. The Backup is a Damaged Successor.**

  Here is why, based on your own intuitions:
  *   **The Fire (Case 5 Parallel):** The destruction of the original hull/AI hardware breaks the spatiotemporal continuity. Like Case 5, you are attempting to transfer identity to a new substrate.
  *   **The Corruption (Case 3 Parallel):** You care about *content continuity* for logs. The "learned route-maps" are the AI's log/memory. Corrupting them is not like swapping a plank (Case 1); it is like tearing pages out of the logbook and replacing them with generic text.
  *   **The Backup (Case 2 Parallel):** A backup is an *instantaneous* transfer, not a gradual migration. Like the instant crew swap, this feels like "stolen identity."

  **Conclusion:** The original AI died in the fire. The new hull contains a *copy* of the AI that suffers from amnesia. It is a new entity wearing the old mind's damaged clothes.

  ### 3. The "Clean Account": Which Verdict to Drop?
  To have a truly consistent metaphysical system based on **Causal-Spatiotemporal Continuity**, you must drop or modify the intuition in **Case 4**.

  **The Inconsistency:**
  *   In **Case 1**, you accept **0% original material** = Same Ship (because continuity was maintained).
  *   In **Case 4**, you feel **>50% original material** = Different Ship (because continuity was broken/rearranged).

  While your verdict in Case 4 is logically consistent with *Spatiotemporal* continuity (the ship was cut), your hesitation ("*Even though* more original parts are present...") reveals a lingering belief that **Material Constitution** matters.

  **The Fix:**
  To be clean, you must fully commit to **Functional Continuity** and drop the metaphysical weight of "original parts."
  *   **Drop:** The intuition that the *proportion* of original parts in Case 4 is relevant.
  *   **Keep:** The verdict that it is a different vessel, but *only* because the functional organization was interrupted (docked, cut, spliced), not because the parts were mixed.
  *   **Why:** If you accept Case 1 (100% replacement is fine), then having 50% original parts in Case 4 shouldn't make you hesitate. The only thing that makes it a "different vessel" is the *interruption* of the voyage/structure, not the source of the middle section.

  ### 4. Prediction: The Museum Ship Retrofitted for Sea
  Based on the **Causal-Spatiotemporal Continuity** principle (and dropping the material fetishism of Case 4):

  **Verdict: It is a New Vessel (Resurrection, not Survival).**

  *   **Reasoning:** When the ship was moved to the museum, its *functional organization* ceased. It became a static display. The causal chain of "being a sailing ship" was broken.
  *   **The Retrofit:** Putting engines in it and sending it to sea is not continuing the old voyage; it is starting a new one.
  *   **Analogy:** This is identical to **Case 5**. In Case 5, a new hull with old paperwork is a new thing. Here, you have an old hull (museum) with new function (engines).
  *   **Result:** It is a **reconstruction** that has been activated. It carries the *name* and the *material* of Theseus, but metaphysically, it is a new ship born from the bones of the old one.

  ### Summary of the Clean System
  1.  **Identity is a Process, not a Substance:** The ship is the *sailing*, not the *planks*.
  2.  **Continuity must be Uninterrupted:** Docking for repairs is fine; dismantling, burning, or museum-ing breaks the chain.
  3.  **Information is Structural:** Corrupting the AI's maps or the Logbook's narrative damages identity as much as rotting planks.
  4.  **Legal $\neq$ Ontological:** Paperwork (Case 5) can license a new ship to use an old name, but it cannot resurrect a dead causal chain.

  If you adopt this, your AI case is dead, the Museum ship is new, and Case 4 is different solely because of the *interruption*, not the parts count.
