answer: |-
  # The Transcendental Argument Decision Procedure (TADP)

  **Purpose:** To classify manuscripts claiming to offer transcendental arguments (TAs) within a standard refereeing timeframe.
  **Scope:** Distinguishes genuine TAs from a priori, empirical, performative, and modal-trap arguments. Includes substantive quality checks (Overreach, Begging).
  **Usage:** Apply steps sequentially. If a step yields a "Stop" verdict, terminate the procedure and file the report under that classification. If a step yields a "Hand-off," the manuscript is structurally a TA but requires substantive philosophical evaluation by you.

  ---

  ## Phase 1: Structural Filter
  *Does the argument have the basic skeleton of a transcendental argument?*

  **Step 1: Phenomenon Specification**
  *   **Question:** Does the author identify a specific phenomenon ($Y$) whose possibility is the starting point (e.g., "self-consciousness," "reference," "experience," "judgment")?
  *   **Sufficient Answer:** A specific cognitive or experiential capacity. Vague terms like "knowledge," "truth," or "reality" without qualification are insufficient.
  *   **Verdict if No:** **Not a TA.** (Classification: *Vague Metaphysics* or *Dogmatism*).
  *   **Verdict if Yes:** Proceed to Step 2.

  **Step 2: Direction of Inference**
  *   **Question:** Does the argument infer the existence/truth of a condition ($X$) *from* the possibility of the phenomenon ($Y$)? (Structure: $Y$ is possible $\to$ $X$ is necessary for $Y$ $\to$ $X$ is the case).
  *   **Sufficient Answer:** The conclusion is the *condition* ($X$), not the *phenomenon* ($Y$).
  *   **Verdict if No:** **Not a TA.**
      *   If it argues $X \to Y$: *Deductive/A Priori*.
      *   If it argues $Y$ is actual based on evidence: *Empirical/Inductive*.
  *   **Verdict if Yes:** Proceed to Step 3.

  ---

  ## Phase 2: Species Separation
  *Is this a genuine TA or a lookalike?*

  **Step 3: The Empirical Check**
  *   **Question:** Is the link between $Y$ and $X$ justified by contingent observation (e.g., "humans happen to learn this way") or by conceptual analysis (e.g., "the concept of $Y$ entails $X$")?
  *   **Sufficient Answer:** Justification relies on the *meaning* or *structure* of $Y$, not causal generalizations.
  *   **Verdict if Empirical:** **Not a TA.** (Classification: *Empirical Abduction* or *Naturalized Epistemology*).
  *   **Verdict if Conceptual:** Proceed to Step 4.

  **Step 4: The Modal Trap Check**
  *   **Question:** Does the author establish necessity by showing that $\neg X$ is *inconceivable* or *psychologically impossible* for us, or that $\neg X$ is *logically/metaphysically incompatible* with $Y$?
  *   **Sufficient Answer:** The argument must show incompatibility with the *possibility* of $Y$, not merely the limits of human imagination or cognitive architecture.
  *   **Verdict if Psychological/Inconceivability:** **Not a TA.** (Classification: *Modal Trap* or *Psychologism*).
  *   **Verdict if Logical/Metaphysical:** Proceed to Step 5.

  **Step 5: The Performative Check**
  *   **Question:** Does the argument conclude that $X$ is *true/existent*, or merely that one cannot *coherently assert/doubt* $\neg X$?
  *   **Sufficient Answer:** A genuine TA concludes $X$ is a condition of reality/experience. A performative argument concludes that asserting $\neg X$ undermines the act of assertion.
  *   **Verdict if "Cannot Assert/Doubt":** **Not a TA.** (Classification: *Performative Contradiction Argument* or *Transcendental Pragmatics*).
  *   **Verdict if "X is the Case":** **Genuine Transcendental Argument.** Proceed to Phase 3.

  ---

  ## Phase 3: Quality Control (Substantive Hand-off)
  *The manuscript is structurally a TA. These steps determine if it succeeds. These require your philosophical judgment.*

  **Step 6: The Overreach Test (Stroud/Sellars Check)**
  *   **Question:** Does the argument establish that $X$ is a condition of our *representation* of reality, but conclude that $X$ is a feature of *mind-independent* reality?
  *   **Action:** Check if the gap between "we must believe $X$" and "$X$ is true" is bridged.
  *   **Verdict:** **Hand-off.** (Flag: *Risk of Idealism/Overreach*. If the paper does not address Stroud's objection, recommend rejection or major revision).

  **Step 7: The Question-Begging Test**
  *   **Question:** Does the premise "$X$ is necessary for $Y$" implicitly presuppose the truth of $X$ (or the falsity of skepticism) to get off the ground?
  *   **Action:** Check if the analysis of $Y$ is neutral or already loaded.
  *   **Verdict:** **Hand-off.** (Flag: *Risk of Circularity*. If the necessity claim is not defended against the skeptic, recommend rejection).

  ---

  # Application to Manuscripts

  Here is the procedure run on the three papers you provided.

  ## Paper A: Anti-Skepticism (Appearance/Reality)
  *Argument:* To coherently maintain that experience might be ungrounded, the subject must distinguish appearance from reality. That distinction requires the reality of objects. Therefore, objects exist.

  *   **Step 1 (Phenomenon):** "Distinguishing appearance from reality." **Pass.**
  *   **Step 2 (Inference):** Infers "reality of objects" from the possibility of "distinguishing." **Pass.**
  *   **Step 3 (Empirical):** Link is conceptual (distinction entails reality). **Pass.**
  *   **Step 4 (Modal):** Argues incoherence of the position, not unimaginability. **Pass.**
  *   **Step 5 (Performative):** **STOP.**
      *   *Analysis:* The premise is "To *coherently maintain*..." The argument turns on the conditions of *asserting* or *holding* a skeptical position, not the conditions of *experience* itself. It concludes that the skeptic's *position* is self-undermining, which is the hallmark of a Performative Contradiction Argument (à la Apel or Habermas), not a Kantian Transcendental Argument (which starts from "Experience is actual").
      *   *Verdict:* **Not a Transcendental Argument.** (Classification: *Performative Contradiction Argument*).
      *   *Work Done By:* Step 5.
      *   *Referee Note:* This is the verdict you expected not to want. While philosophically potent, it does not fit the strict structural definition of a TA because it targets the *act of doubting* rather than the *possibility of experience*. It requires a different literature base (pragmatics vs. metaphysics).

  ## Paper B: Other Minds (Concept Acquisition)
  *Argument:* A subject can acquire general concepts only through interaction with other speakers. Conceptual thought is possible. Therefore, other minds exist.

  *   **Step 1 (Phenomenon):** "Conceptual thought" / "Acquisition of general concepts." **Pass.**
  *   **Step 2 (Inference):** Infers "other minds" from possibility of "concepts." **Pass.**
  *   **Step 3 (Empirical):** **STOP / HAND-OFF.**
      *   *Analysis:* The claim "concepts require interaction with other speakers" is highly contentious. Is this a conceptual truth (meaning of 'concept') or an empirical hypothesis (developmental psychology)? The paper likely treats it as conceptual, but it smells empirical.
      *   *Verdict:* **Genuine Transcendental Argument (with Empirical Premises).**
      *   *Work Done By:* Step 3 (Borderline).
      *   *Referee Note:* This passes the structural filter. However, it triggers **Step 6 (Overreach)**. It infers mind-independent entities (other minds) from a condition of thought. You must evaluate if the necessity claim is robust or merely a Wittgensteinian grammatical remark.

  ## Paper C: External World (Coherent Doubt)
  *Argument:* One cannot coherently doubt the external world. Therefore, the external world exists.

  *   **Step 1 (Phenomenon):** "Doubting the external world." **Pass.**
  *   **Step 2 (Inference):** Infers "world exists" from "doubt is impossible." **Pass.**
  *   **Step 3 (Empirical):** Conceptual. **Pass.**
  *   **Step 4 (Modal Trap):** **STOP.**
      *   *Analysis:* The premise "One cannot coherently doubt" usually relies on the psychological inability to sustain the doubt or the pragmatic impossibility of acting on it. It conflates "we cannot think it away" with "it is metaphysically necessary." It fails to distinguish psychological compulsion from logical necessity.
      *   *Verdict:* **Not a Transcendental Argument.** (Classification: *Modal Trap*).
      *   *Work Done By:* Step 4.
      *   *Referee Note:* This is the classic Moorean/Stroudian pitfall. The fact that we cannot doubt $X$ does not entail $X$ is true (we might be hardwired to believe falsehoods).

  ---

  # Honesty Clause: Limits of the Procedure

  As the referee, you must acknowledge where this tool is a heuristic rather than an algorithm.

  **1. Judgment Calls Dressed as Procedure:**
  *   **Step 3 (Empirical vs. Conceptual):** This is the biggest gray area. Many "transcendental" arguments in contemporary literature (e.g., Strawson, McDowell) rely on premises that are arguably empirical generalizations disguised as conceptual truths. The procedure forces a binary choice where there is often a spectrum. You will have to use your own philosophical nose here.
  *   **Step 5 (Performative vs. Ontological):** Some TAs (like Kant's Refutation of Idealism) blur this line. They argue from the *consciousness of my own existence* (which looks performative) to the *existence of outer objects*. If a paper is sophisticated enough, it may argue that the performative condition *just is* the ontological condition. The procedure will flag this as Performative, potentially misclassifying a sophisticated TA.

  **2. Where the Procedure Misfires:**
  *   **Naturalized Transcendental Arguments:** If a paper argues that $X$ is a necessary condition for $Y$ based on evolutionary biology or cognitive science (a "naturalized TA"), Step 3 will classify it as *Empirical/Not TA*. This might be too harsh if the author is redefining the genre.
  *   **Negative TAs:** Some arguments argue that a condition is *impossible* (reductio). The procedure assumes a positive inference ($Y \to X$). A negative TA might slip through or be rejected at Step 2.
  *   **Novel Phenomena:** If a paper analyzes a phenomenon not on the standard list (e.g., "the possibility of irony" or "the possibility of resentment"), Step 1 might feel too restrictive. Be open to accepting specific, non-standard phenomena if they are rigorously defined.

  **3. The "Hand-off" Reality:**
  *   Steps 6 and 7 (Overreach and Begging) are where the actual refereeing work happens. The procedure successfully filters out the *category mistakes* (Modal Traps, Performative masquerading as TA), but it cannot tell you if the TA is *sound*. It saves you from confusing genres, but it does not save you from doing metaphysics.

  **Recommendation:** Use this procedure to write the "Summary of Contribution" section of your report. It will allow you to say, "While the author claims a transcendental argument, Step 5 identifies this as a performative contradiction argument, which changes the burden of proof regarding..." This gives you precise vocabulary for your rejection or revision requests.
