  10. **Final Polish:** Ensure clarity on the distinction between "no scale exists" (ontological) and "we shouldn't trade them" (normative). The user's draft blends these; separating them strengthens the defence. (Self-correction: Make sure to emphasize that LTNU *can* exist even if a scale exists, if one argues the scale is morally irrelevant for trade-offs. But the user's specific version relies on the scale *not* existing. I should address both possibilities.)

  *(Self-Correction during drafting)*: Wait, the user's specific version of LTNU relies on the threshold being the "phenomenological boundary." If a critic says "There is a scale," they are attacking the phenomenological claim. I need to make sure the defence handles the *normative* leap even if the *phenomenological* claim is contested. Actually, the strongest defence is that *even if* there is a psychological scale, there is no *moral* exchange rate. I will suggest this nuance.

