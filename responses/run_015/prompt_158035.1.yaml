      *   **Section 4: Answering the Critic.** Distinguish descriptive vs. normative. Challenge the monist burden of proof.
      *   **Section 5: Potential Pitfalls.** Mention the "Threshold Problem" (Sorites) and "Fanaticism" (lexicity can lead to extreme costs for tiny benefits).

  7.  **Refining the "Pessimistic Ordering" point:**
      *   The user says: "where two outcomes are incomparable, the choice is settled by the pessimistic ordering."
      *   *Critique:* Why pessimistic? This needs a moral argument (e.g., duties of non-maleficence > beneficence). I need to point this out. It's not just "rational policy," it's a moral axiom.

  8.  **Drafting the Response:** (Iterative refinement during drafting)
