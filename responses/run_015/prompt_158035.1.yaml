answer: |-
  This is a sophisticated and philosophically robust way to frame Lexical Threshold Negative Utilitarianism (LTNU). By grounding the view in the **incommensurability of value** rather than simply asserting that pain is "heavier" than pleasure, you avoid the arbitrariness that often plagues lexical views (e.g., *why* is one unit of pain worth 1,000 units of pleasure?).

  However, there are structural vulnerabilities in how you move from the metaphysical claim (incommensurability) to the normative claim (lexical priority). Below is an analysis of your setup, followed by specific advice on the three questions you raised.

  ### 1. Is this the right way to set the argument up?

  **The Strength:**
  Your approach is strong because it attacks Classical Utilitarianism at its root: **Value Monism**. Classical Utilitarianism assumes a single currency of "utility." By denying this currency exists, you render the utilitarian calculus impossible in mixed cases (pain vs. pleasure). This makes your view a form of **Value Pluralism** with a specific decision rule.

  **The Weakness:**
  The gap lies in your claim: *"Where two outcomes are incomparable, the choice is settled by the pessimistic ordering."*
  Incommensurability typically implies **parity** or **incomparability**, not necessarily lexical priority. If A and B are incommensurable, standard decision theory suggests rational choice is impossible (or arbitrary). To move from "we cannot compare them" to "we must choose the one that reduces suffering," you need an additional normative premise. You cannot derive an *ought* (prioritize suffering) solely from an *is* (phenomenological distinctness).

  **Recommendation:**
  Refine the setup to distinguish between the **ontological claim** (pain and pleasure are distinct kinds) and the **normative rule** (in cases of conflict between distinct kinds, non-maleficence trumps beneficence).
  *   **Current:** Incommensurability $\rightarrow$ Rational Policy $\rightarrow$ Lexical Priority.
  *   **Revised:** Incommensurability $\rightarrow$ Impossibility of Aggregation $\rightarrow$ **Principle of Harm Precedence** $\rightarrow$ Lexical Priority.

  ### 2. Entailment vs. Independent Support

  **Should the incommensurability claim entail the lexical claim?**
  No. You should present incommensurability as **independent support** that necessitates a lexical structure, rather than entailing it logically.

  **Why?**
  If you claim entailment, you are vulnerable to the objection that incommensurability leads to **decision paralysis**. A critic could say: "If they truly cannot be weighed, then choosing the pain-relief programme is just as arbitrary as choosing the delight programme. Why does the 'pessimistic ordering' win?"
  If you treat incommensurability as the *condition* that makes aggregation impossible, and lexical priority as the *moral solution* to that impossibility, your view is more stable.

  **How to phrase it:**
  > "The incommensurability of pain and pleasure destroys the possibility of a trade-off calculus. It does not, on its own, dictate which option to choose. However, given that aggregation is ruled out, we must adopt a decision rule for mixed cases. The Principle of Harm Precedence (a deontological constraint imported into consequentialism) dictates that when aggregation is impossible, the prevention of harm screens off the promotion of benefit."

  ### 3. Answering the Critic: "If there were a single scale, LTNU could not be formulated."

  This critic is challenging the **phenomenological premise**. They are essentially saying: "Neuroscience/Psychology shows pleasure and pain are opposite ends of the same neural spectrum; therefore, your foundation is false."

  Here is how you answer this, in order of increasing aggression:

  **A. The Normative/Descriptive Distinction (The Moderate Defence)**
  Concede that there might be a *psychological* or *neurological* scale, but deny that this implies a *moral* scale.
  *   *Argument:* "Even if a neuroscientist can assign a cardinal number to my pain and my pleasure, that number represents intensity, not moral weight. The fact that two states can be measured on a single thermometer does not mean they can be morally traded. Morality tracks reasons, not just sensations. The reason-giving force of suffering is of a different logical type than the reason-giving force of pleasure."
  *   *Result:* LTNU survives even if the phenomenological claim is weakened, because it rests on normative incommensurability, not just phenomenological distinctness.

  **B. The Burden of Proof Shift (The Aggressive Defence)**
  Challenge the critic to justify the exchange rate.
  *   *Argument:* "The critic assumes Value Monism. But the burden of proof lies on the monist to explain *why* a specific quantity of mild delight should morally cancel out severe agony. The phenomenological difference is evidence that no such common unit exists. To assert a single scale exists is to beg the question against the sufferer. LTNU does not need to prove there is *no* scale; it only needs to show that the monist has provided no justification for *why we should act as if* there is one."

  **C. The "Threshold" Defence (Specific to your view)**
  *   *Argument:* "Even if there is a continuous scale of sensation, there is a **normative threshold** at the zero point. Positive numbers represent 'goods to be pursued,' negative numbers represent 'harms to be prevented.' In many normative systems (e.g., rights, law), preventing a violation is lexically prior to granting a benefit. LTNU simply applies this deontological structure to welfare. The existence of a scale does not negate the lexical priority of the negative domain."

  ### 4. Refining the Case Study (The Health Authority)

  You wrote: *"It must say so not because the first outcome is better but because the second is not even a candidate for comparison."*

  This phrasing is risky. If (B) is "not a candidate," it implies the authority is irrational for even considering it. This sounds dogmatic.

  **Suggested Refinement:**
  Use the language of **"Screening Off"** or **"Lexical Dominance."**
  > "The authority must fund the first programme. This is not because the first outcome yields more 'utility' in a common currency, but because the reasons generated by the severe suffering **lexically dominate** the reasons generated by the mild delight. The presence of severe suffering below the threshold renders the aggregate pleasure above the threshold morally inert for the purpose of this decision."

  This preserves your intuition (the delight doesn't count *against* the pain) without implying that the delight programme is conceptually incoherent.

  ### Summary of Suggested Revisions

  1.  **Separate the Metaphysical from the Normative:** Incommensurability makes trade-offs impossible; a separate moral principle (Harm Precedence) makes suffering the priority.
  2.  **Soften the "Not a Candidate" Claim:** Change to "The reasons for the delight programme are screened off by the reasons for the pain programme."
  3.  **Defend Against the Scale Critic:** Argue that even if a psychological scale exists, there is no *moral exchange rate*. The monist bears the burden of proving why mild pleasure should cancel agony.
  4.  **Clarify the Threshold:** Ensure you defend why the threshold is at the "neutral point." If pain and pleasure are incommensurable, is there really a "zero"? You might need to define the threshold as the **onset of suffering** rather than a neutral midpoint, to avoid implying a scale exists where you claim it doesn't.

  **Final Verdict:**
  Your setup is philosophically promising because it aligns LTNU with **Value Pluralism** (like W.D. Ross or Isaiah Berlin) rather than **Monistic Consequentialism**. This insulates you from standard utilitarian objections. However, you must plug the gap between "we can't compare" and "therefore we choose negative priority" with a explicit moral principle, or the argument will appear to rely on a non-sequitur.
