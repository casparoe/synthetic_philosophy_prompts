answer: |-
  Here are eight interview questions designed to pin down the specifics of her view without letting her retreat into definitions. Each includes a predicted answer and a specific follow-up.

  ### 1. The Scope Objection (Borders vs. Coercion)
  **Question:** You ground special duties in "shared subjection to a coercive legal order." But I'm also coerced by my school district, my state, and international trade laws. Why does the *nation-state's* coercion create a moral bond that my school district's coercion doesn't? If it's the coercion that matters, why does the duty stop at the border instead of fading out gradually?

  *   **Likely Answer:** She will argue that the nation-state is *sovereign*; it claims ultimate authority over all other coercive bodies (like schools), so it is the primary source of the obligation.
  *   **Follow-up:** But sovereignty is just a historical fact, often decided by wars and treaties, not a moral category. If a war had gone differently ten years ago, I'd be subject to a different sovereign. Are you saying my moral duties to my neighbors depend entirely on the outcome of a past battle?

  ### 2. The "Nationalism" Trap (Sequence Part 1)
  **Question:** Let's test the line between patriotism and nationalism. If a government passes a law reserving government jobs for citizens only, is supporting that law patriotism?

  *   **Likely Answer:** Yes, because it prioritizes the members of the cooperative scheme that makes the jobs possible. That's maintaining the institution, not hating outsiders.
  *   **Follow-up:** Okay, so prioritizing compatriots for *benefits* is patriotism. That sets a baseline: partiality is allowed.

  ### 3. The "Nationalism" Trap (Sequence Part 2)
  **Question:** Now imagine a shortage of life-saving medicine. The state allocates it to citizens first, letting non-citizens outside the border die. Is defending *that* policy still just patriotism?

  *   **Likely Answer:** She might hesitate but likely say yes, provided the system is generally just. The state's primary duty is to its subjects. To call it nationalism, you'd need to show the policy was motivated by racial hatred, not just priority for members.
  *   **Follow-up:** So the morality depends on the *motivation* in the lawmaker's head, not the *outcome* for the foreigner? If the outcome is death either way, why does the label change?

  ### 4. The "Nationalism" Trap (Sequence Part 3)
  **Question:** Here's the collapse case: A state passes a law saying, "To protect our legal order, we must actively undermine the economy of our neighbor." If I support this because I love my legal order, and the result is my neighbor's suffering, is that nationalism?

  *   **Likely Answer:** She will want to say no, it's defense of the institution, but this is where the distinction strains. She might say it depends on whether the neighbor is a threat.
  *   **Follow-up:** But if "defending our legal order" is the only metric, and our order thrives only when theirs fails, then patriotism *requires* harming them. At that point, isn't "patriotism" just a polite word for "my team winning"?

  ### 5. Killing and Dying
  **Question:** Does your version of patriotism essentially require being ready to kill foreigners to protect compatriots? If the "shared subjection" is the bond, does that bond dissolve when facing someone not subject to your laws, making them expendable?

  *   **Likely Answer:** She will likely say no, it's about defending *justice*, not killing. We only kill if necessary to protect the just institutions.
  *   **Follow-up:** But if the just institution can only be protected by killing an outsider who is also trying to protect *their* family under *their* (different) just institution, why does your side of the border get the moral priority to pull the trigger?

  ### 6. The Victim of the State
  **Question:** I have a friend whose family has been fighting deportation for years. To her, the state isn't a "shared legal order," it's a threat. On your view, does she owe patriotic duties to a system that views her presence as a violation?

  *   **Likely Answer:** She is still subject to the law, so she has a duty to obey it, even if she fights to change it. Patriotism allows for criticism, but not abandonment.
  *   **Follow-up:** But patriotism is supposed to be a *virtue*, something good to feel. Are you arguing she should feel an emotional attachment to the machinery currently trying to remove her? If not, is patriotism only a virtue for the people the state treats well?

  ### 7. "Tenant Patriotism"
  **Question:** I have a theory called "Tenant Patriotism." It says we didn't build this country, we just inherited it. We can't easily leave, so our duty isn't gratitude, it's custodial—like a tenant maintaining a building they're stuck in. Does that fit your account, or does it turn patriotism into mere maintenance?

  *   **Likely Answer:** She will probably like this. It fits the "coercion" model well. You are there, you are bound, so you must maintain the structure.
  *   **Follow-up:** But a tenant doesn't need to *love* the building, just fix the leaks. If patriotism is just custodial duty, where is the *emotion*? If you remove the love, isn't this just "citizenship," and have you actually defended patriotism at all?

  ### 8. Excess and Virtue
  **Question:** In virtue ethics, every virtue has an excess. Courage becomes recklessness. What is the excess of patriotism on your view?

  *   **Likely Answer:** The excess is nationalism. When love of country becomes belief in superiority.
  *   **Follow-up:** That feels circular. If the only way to identify "too much patriotism" is to call it "nationalism," you haven't given us a measuring stick. Is there a point where I love my country *too much* without hating anyone else, or is the only sin hurting outsiders?

  ***

  ### The Commitment

  **The Three I Would Keep:**
  1.  **Question 1 (Scope):** This is the foundation. If she can't explain why the *state* is the magic circle of coercion compared to a school or a continent, the rest of the theory floats in the air. It forces her to justify the border itself, not just what happens inside it.
  2.  **Question 4 (The Collapse Case):** This is the sharpest weapon against her "get out of jail free" card. By constructing a scenario where loving the law *necessitates* harming the outsider, you remove her ability to say "that's nationalism." It forces her to admit that patriotism *can* be harmful, which undermines its status as a pure virtue.
  3.  **Question 7 (Tenant Patriotism):** This is your original contribution. It's the most philosophically interesting because it challenges the *emotional* core of her view. It separates "duty" from "love," which is exactly where her theory is weakest.

  **The Single Question That Could Make Her Revise Her View:**
  **Question 7 (Tenant Patriotism).**

  **Why:**
  The other questions are external attacks; they try to break her shield. Question 7 is an internal reconstruction. Her theory relies on "shared subjection" creating "special duties." Your "Tenant" idea accepts that premise but strips away the *gratitude* and *love* she needs to call it patriotism.

  If she accepts your framing, she has to admit that "custodial duty" is enough to sustain the state. If that's true, then *patriotism* (the emotional attachment) is unnecessary. If it's unnecessary, it's not a virtue; it's just optional flair. To save her theory, she would have to argue why *love* is required for maintenance, which might force her to concede that patriotism is only useful instrumentally, not morally. That is a significant revision to a view that claims patriotism is a *moral virtue*.

  **A Note on Question 5 (Killing/Dying):**
  I think this is your weakest question. It's the standard objection in political philosophy ("What about war?"). She will have a rehearsed answer for this because every interviewer asks it. It's not bad, but it's less likely to surprise her or corner her than the "Tenant" or "Scope" questions. If you have to cut one to save time, cut this one.
