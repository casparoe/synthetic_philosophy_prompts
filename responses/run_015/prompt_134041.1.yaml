answer: |-
  This kind of embedding shows that a disjunctive-attitude fix cannot preserve compositionality without smuggling in cognitive content, forcing pure expressivism to either abandon compositionality or relax into quasi-realism, with the latter doing less damage to the broader non-cognitivist program. When the clause $C$ ("it is wrong that, necessarily, every agent acts only if they know they cause harm") is asserted, the pure expressivist assigns it a semantic value consisting of a complex non-cognitive attitude type, say $\alpha$, rather than a truth-conditional proposition. However, in the belief attribution "Sarah believes that $C$," the syntactic position of $C$ requires it to contribute a content that serves as the object of a propositional attitude, creating a type mismatch if $\llbracket C \rrbracket = \alpha$. To resolve this compositionally, the expressivist must argue that $C$ contributes the same semantic value in both contexts, but if that value is $\alpha$, the belief report erroneously attributes to Sarah a relation to an attitude type rather than a representational content; if the value is a proposition $p$, the expressivist has covertly conceded that moral clauses have truth-conditions.

  Blackburn-style higher-order attitude solutions attempt to bypass this by defining the content of $C$ as a state of mind acceptable under specific consistency constraints, but this fails to preserve logical consequence relations across the modal-quantifier embedding because validity is defined over the speaker's attitude consistency, not the logical relations between the contents of Sarah's beliefs. Specifically, the internal structure of $C$ involves a necessity operator $\Box$ scoping over a universal quantifier $\forall$, which demands truth-conditional manipulation to derive consequences like universal instantiation within the belief context. If the moral operator "it is wrong that" blocks truth-conditional access to the embedded modal claim—as pure expressivism requires to maintain the non-cognitive distinction—then the logical relations between $C$ and its logical consequences cannot be processed inside the belief attribution, rendering Sarah's rationality opaque to standard logical norms. Gibbard-style norm-expressivism tries to fix this by treating moral contents as fact-like norm-acceptances, but this effectively grants the embedded clause truth-apt conditions sufficient for logical embedding, thereby smuggling in the cognitive content pure expressivism seeks to deny.

  Consequently, the horn of giving up compositionality renders moral language logically inert in embedded contexts, making it impossible to formally analyze the rationality of agents like Sarah who hold complex moral beliefs, which devastates the expressivist claim to explain moral discourse. Relaxing pure expressivism toward quasi-realism, however, allows the theory to treat moral sentences as proposition-like for the purposes of logic and embedding while maintaining the metaphysical denial of mind-independent moral facts. This relaxation does less damage because it preserves the functional utility of moral language and its integration with general logic, whereas maintaining pure expressivism at the cost of compositionality sacrifices the very logical structure that makes moral reasoning intelligible.
