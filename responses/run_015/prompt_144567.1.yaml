      *   *Line 2 (Diagnosis/Nature of Contradiction):* This interprets the result of the test. If Line 1 says "Yes, we can test," Line 2 asks "What does a 'fail' mean?" Is it that the institution breaks, or the agent is immoral? This depends on Line 1's success.
      *   *Line 3 (Responsibility/Agency):* This is the normative payoff. If the test fails (Line 1) or the diagnosis is unclear (Line 2), we can't assign responsibility. This is downstream. It deals with the "many hands" problem in a Kantian framework.

  3.  **Determine the Ordering (Upstream/Downstream Logic):**

      *   *Priority 1: Line 1 (Coherence).* You can't diagnose a contradiction (Line 2) or assign blame (Line 3) if the test itself is category-mistaken or collapses into a different theory. This is the metaphysical/logical precondition.
      *   *Priority 2: Line 2 (Diagnosis).* Once we know the test works, we need to know what the output *means*. Is a contradiction in a role-maxim a moral wrong or just a systemic glitch? This informs how we treat the agent.
      *   *Priority 3: Line 3 (Responsibility).* This is the application. It relies on knowing the test is valid (Line 1) and what the failure signifies (Line 2).

  4.  **Assess Tractability vs. Importance (Researcher Profile):**
      *   *Researcher:* Moral philosopher, 3 years, conceptual focus.
      *   *Line 1:* High importance, moderate tractability. Requires close textual work + conceptual analysis. Risk: Getting stuck in meta-ethics.
