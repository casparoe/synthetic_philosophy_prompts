      *   **Core Problem:** Ambiguity in the "contradiction in the will" (CI/CC) when applied to roles. Is it an individual contradiction or an institutional architectural contradiction?
      *   **Task:** Prioritize three specific lines of work, defend the ordering, explain criteria, discuss upstream/downstream relationships, assess tractability vs. importance, and identify potential defeaters (evidence/arguments that would change the ordering).
      *   **Constraints:** Researcher profile (3 years, moral philosophy background, conceptual clarity focus), no survey/bibliography, must be a *defended agenda*.
      *   **The Three Lines:**
          1.  *Coherence:* Can FUL extend to institutional roles without collapsing into contractualism/utilitarianism?
          2.  *Diagnosis:* What does the "practical contradiction" signify? (Moral failure vs. functional impossibility vs. category error).
