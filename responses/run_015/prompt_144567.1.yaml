answer: |-
  ### Research Agenda: Kantian Universalizability and Institutional Roles

  **Proposed Ordering:**
  1.  **Coherence of Extension** (Can FUL apply to roles without theoretical collapse?)
  2.  **Diagnosis of Contradiction** (What does a failed test signify in an institutional context?)
  3.  **Imputation and Responsibility** (How is blame assigned when the contradiction is structural?)

  **Rationale for Ordering:**
  This ordering is dictated by **logical dependency** and **risk management** relative to your profile. As a moral philosopher prioritizing conceptual clarity, you must secure the validity of the normative framework before interpreting its outputs or applying them to questions of imputation. Line 1 is the metaphysical precondition; Line 2 is the interpretive bridge; Line 3 is the normative payoff. Attempting Line 3 without resolving Line 1 risks producing a theory of responsibility that is either sociologically descriptive (abandoning Kant) or incoherent (applying individualist blame to structural failures).

  ---

  ### Priority 1: Coherence of Extension
  **Question:** Can the Formula of Universal Law (FUL) be coherently extended to maxims whose subject is an institutional role rather than an individual rational being, without collapsing into contractualism or rule-utilitarianism?

  **Why it is Upstream:**
  This is the gatekeeping question. Kant's moral theory is grounded in the autonomy of the individual rational will. Institutional roles are heteronomous by definition (defined by external rules and functions). If you cannot formulate a "role-maxim" that retains the *a priori* structure of a Kantian maxim (subjective principle of volition) without turning it into a hypothetical imperative ("If I want to keep this job, I must..."), the project fails at the start. If the universalization test for a judge simply becomes "What if all judges did this?" leading to "The legal system would crash," you have slipped into rule-utilitarianism (bad consequences) or contractualism (violation of agreed terms), not Kantian deontology (contradiction in rational willing).

  **Tractability vs. Importance:**
  *   **Importance:** Critical. If this fails, the subsequent lines are moot.
  *   **Tractability:** High for a moral philosopher. This is pure conceptual analysis. It requires parsing the grammar of maxims (e.g., "I will do X *as a judge* to achieve Y") and testing whether the "as a judge" clause functions as a contingent desire or a constitutive condition of the will. You can rely on textual exegesis of the *Groundwork* and *Metaphysics of Morals* (Doctrine of Right) without needing empirical data.
  *   **Risk:** The risk is theoretical stagnation. You could spend three years arguing about maxim formulation without producing a positive account. To mitigate this, bound the inquiry: focus on whether the *institutional purpose* can be treated as an end in itself or a necessary condition of rational agency, rather than a mere means.

  ### Priority 2: Diagnosis of Contradiction
  **Question:** Does the "practical contradiction" resulting from universalizing role-based maxims indicate a genuine moral failure of the agent, a functional impossibility of the institution, or a category error?

  **Why it is Upstream of Line 3:**
  Once you establish that the test *can* run (Line 1), you must determine what a "fail" *means*. In individual Kantian ethics, a contradiction in conception (CC) usually signals impermissibility, and a contradiction in will (CW) signals a violation of duty. In institutional settings, a universalized role-maxim might destroy the institution (e.g., "All bankers will embezzle" destroys banking). Is the banker immoral, or did they merely trigger a systemic collapse? If the contradiction is merely functional (the institution stops working), it may not be a *moral* contradiction in the Kantian sense. You must distinguish between a **normative contradiction** (undermining rational agency) and a **functional contradiction** (undermining systemic efficiency). Without this distinction, you cannot move to responsibility.

  **Tractability vs. Importance:**
  *   **Importance:** High. This determines the normative force of your findings.
  *   **Tractability:** Moderate. This requires developing a typology of contradictions. It is conceptual but risks drifting into institutional theory. To stay within your profile, treat "institution" as a normative construct (a system of rights and duties) rather than a sociological one.
  *   **Risk:** The "functional impossibility" trap. If you define the contradiction too loosely, every inefficient policy becomes immoral. If too strictly, no institutional act is immoral. You need a criterion that links institutional function to the protection of rational agency (e.g., the institution exists to secure Right).

  ### Priority 3: Imputation and Responsibility
  **Question:** What are the implications for moral responsibility when the contradiction is visible only at the institutional level but the harmful act is performed by an individual who could sincerely claim her personal maxim is universalizable?

  **Why it is Downstream:**
  This is the application phase. It asks: "Who gets blamed?" This question is insoluble without the answers to 1 and 2. If Line 1 fails, there is no test to violate. If Line 2 concludes that institutional contradictions are merely functional glitches, then the individual bears no moral guilt (perhaps only professional liability). If Line 2 concludes they are moral failures, you still need to know if the individual *could have known* the institutional contradiction. This line addresses the "problem of many hands," but it relies entirely on how you defined the agent's relationship to the role in Line 1 and the nature of the violation in Line 2.

  **Tractability vs. Importance:**
  *   **Importance:** High practical relevance, but lower theoretical priority.
  *   **Tractability:** Low for a conceptual philosopher. This question naturally pulls toward case studies (e.g., Nazi bureaucrats, corporate negligence). To maintain conceptual clarity, you must resist the urge to do empirical case work. Instead, focus on the *conditions of imputation*: Under what conditions can an individual be held responsible for a structural contradiction?
  *   **Risk:** Becoming a policy paper. You risk analyzing specific laws or organizational charts rather than the conditions of moral imputation. Keep the focus on the *principles* of imputation, not specific instances.

  ---

  ### Criteria Governing the Ranking

  1.  **Logical Preconditioning:** You cannot diagnose a contradiction (Line 2) if the test is invalid for the subject (Line 1). You cannot assign blame for a contradiction (Line 3) if you do not know whether the contradiction signifies moral wrongness or systemic failure (Line 2).
  2.  **Profile Alignment:** Line 1 is the most "philosophical" (meta-ethics/action theory). Line 3 is the most "applied" (legal/social theory). Given your 3-year horizon and background, securing the theoretical foundation (Line 1) ensures a publishable contribution to Kant scholarship even if the application (Line 3) remains tentative.
  3.  **Theory Preservation:** The greatest risk to your project is collapsing Kantianism into consequentialism. Line 1 addresses this risk directly. Prioritizing it ensures that if the project fails, it fails on Kantian terms, not by accidentally becoming utilitarianism.

  ---

  ### Defeaters: Evidence or Arguments that Would Change the Ordering

  Your agenda is contingent on certain assumptions holding. The following discoveries would force a reordering or abandonment of the project:

  **1. The "Individualist Constraint" Defeater (Threatens Line 1)**
  *   **Scenario:** Rigorous textual analysis reveals that Kant's concept of a "maxim" logically *requires* a singular, biological human will as its subject, and that "role-based willing" is categorially impossible in his framework (i.e., roles are always heteronomous and thus outside the scope of FUL).
  *   **Impact:** If true, Line 1 is impossible. You must **abandon the project** or pivot to a neo-Kantian reconstruction that explicitly departs from Kant's text. Line 2 and 3 become irrelevant.
  *   **Monitoring:** Watch for recent commentaries on the *Metaphysics of Morals* (Doctrine of Right) regarding public law. If scholars argue that public roles are governed solely by Right (*Recht*) and not Virtue (*Tugend*), and that FUL applies only to Virtue, your extension is blocked.

  **2. The "Individuation" Defeater (Threatens Line 1 & 2)**
  *   **Scenario:** Work in collective intentionality (e.g., Searle, Gilbert, or contemporary analytic social ontology) demonstrates that role-based maxims cannot be individuated sharply enough to enter the universalization procedure. If a "judge's maxim" is inextricably entangled with the maxims of legislators, defendants, and police, it cannot be universalized in isolation.
  *   **Impact:** This makes Line 1 intractable. You would need to **prioritize Line 2** differently, focusing on *collective* maxims rather than role-based ones, effectively shifting the unit of analysis from the role to the institution as a whole.
  *   **Monitoring:** Engage with literature on "shared intention" and "plural subjects." If the consensus is that institutional action cannot be decomposed into individual role-maxims, your methodology is flawed.

  **3. The "Purely Functional" Defeater (Threatens Line 2 & 3)**
  *   **Scenario:** You find that every "contradiction" generated by institutional universalization is reducible to a functional breakdown (e.g., "If all judges take bribes, courts lose legitimacy") without any necessary link to the violation of rational agency or humanity as an end.
  *   **Impact:** This collapses the project into rule-utilitarianism. If the contradiction is purely functional, Line 3 (moral responsibility) loses its Kantian force. You would need to **demote Line 3** and focus on reconstructing a link between institutional function and human dignity to save the moral dimension.
  *   **Monitoring:** Test your strongest cases (e.g., a judge refusing to hear a case). If the only reason it fails universalization is "the court system stops working" rather than "rational agency is undermined," you have a category error.

  ### Summary of Strategy
  Spend Year 1 securing **Line 1**. Do not move to responsibility until you have a defensible account of how a role can be a moral subject without losing Kant's individualism. Spend Year 2 on **Line 2**, developing a taxonomy of institutional contradictions that distinguishes moral wrongs from systemic glitches. Spend Year 3 on **Line 3**, but limit it to the *conditions* of imputation rather than specific policy recommendations. This ensures that even if the project does not yield a complete theory of institutional responsibility, it produces a robust contribution to Kantian moral theory regarding the scope of the FUL.
