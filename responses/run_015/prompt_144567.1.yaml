      *   *Line 3:* High importance, low tractability (risk of empirical drift). Assigning responsibility often requires knowing *how* institutions actually function (sociology/law). Needs to be kept conceptual to fit the profile.

  5.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the novelty. The tension between Kant's individualism and institutional reality.
      *   *Ordering:* 1 -> 2 -> 3.
