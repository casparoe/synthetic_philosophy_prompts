      *   *Justification for 2 (Diagnosis):* Once coherent, what is the *locus* of the contradiction? If the institution collapses, is the agent guilty? This bridges the test and the agent.
      *   *Justification for 3 (Responsibility):* The payoff. But it depends on 1 & 2. If the contradiction is institutional, can the individual be blamed? This is the hardest part but relies on the previous definitions.
      *   *Criteria:* Logical dependency (upstream/downstream), fit with researcher profile (conceptual vs. empirical), risk of theory collapse.
      *   *Defeaters:* What would change the mind?
