      *   *User's Claim:* No fact of the matter at $t=2$ because belief revision is discrete/no continuity axiom.
      *   *Coherence:* Beliefs are often treated as functional or dispositional states, not just binary switches. If I toggle belief infinitely, do I have a disposition at $t=2$?
      *   *Physicalism Worry:* If belief is brain state, and brain states are physical, does the brain have a state at $t=2$? If the supertask is physically impossible (which it likely is), does the thought experiment hold? The user needs to ensure they aren't smuggling in physical continuity requirements while arguing for logical gaps.
