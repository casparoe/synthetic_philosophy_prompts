  2.  **Deconstruct the Core Claim (Predicate-Gap View):**
      *   *Thomson's Original Puzzle:* Thomson argued the lamp *cannot* exist because the description leads to a contradiction (it can't be on, it can't be off). Benacerraf countered that the description doesn't determine the state, so it's not contradictory, just underdetermined.
