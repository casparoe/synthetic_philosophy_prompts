answer: |-
  Here is an accuracy audit of the summary you provided, followed by an application to your "mid-handover" case.

  ### Part 1: Claim-by-Claim Audit

  **Claim 1:** *"The etiological or selected-effects account says that a trait's function is the effect for which it was favored by natural selection in the past."*
  *   **SE Defender:** **Mostly Accepts.** This is the core definition (associated with Ruth Millikan and Karen Neander). However, a careful defender would clarify that "the past" includes the immediate past and the ongoing process of preservation. It is not merely about the *origin* of the trait millions of years ago, but about why the trait is *currently present* in the population.
  *   **CR Defender:** **Accepts as a characterization of the rival view.**

  **Claim 2:** *"The causal-role account says that function is just the useful job the trait is currently doing in the organism... whatever it now contributes to keeping the organism alive."*
  *   **CR Defender:** **Rejects as a caricature.** The classic Causal-Role account (Robert Cummins) defines function as a contribution to a *capacity of the containing system*, not necessarily "keeping the organism alive" or "fitness." For example, the heart's causal role includes making a "thump-thump" sound; this is a causal contribution, but usually not cited as a function because it doesn't contribute to the *capacity of circulation* we are analyzing. Furthermore, CR is intended to be non-normative; defining it as a "useful job" smuggles in the normativity CR tries to avoid.
  *   **SE Defender:** **Rejects.** They would argue this definition is too broad (counting accidental benefits as functions) and conflates "causal role" with "fitness contribution."

  **Claim 3:** *"The decisive problem for the etiological view is novelty... the etiological view seems forced to say the mutation has no function at all, which is absurd."*
  *   **SE Defender:** **Rejects the "Refutation" status.** They acknowledge the "novelty objection" as a challenge, not a decisive refutation. Sophisticated SE accounts argue that a trait acquires a function as soon as it enters a *selective process*, not only after fixation. If a mutation is currently being favored (as in your bacteria case), SE can describe it as having an *emergent* function. They also deny it is "absurd" to say a brand-new mutation has no function *yet*; they argue it has a *beneficial effect*, but "function" is a historical status that takes a generation or more to crystallize.
  *   **CR Defender:** **Accepts.** This is their primary argument against SE.

  **Claim 4:** *"That is why the causal-role view has largely replaced it."*
  *   **SE Defender:** **Rejects.** This is factually incorrect regarding the philosophy of biology. The Selected-Effects account remains the dominant view in contemporary philosophy of biology because it handles normativity (malfunction) better than CR.
  *   **CR Defender:** **Would likely dispute.** While CR is popular in physiology and neuroscience, few philosophers of biology claim it has "replaced" SE in the context of evolution.

  **Claim 5:** *"Once you give up the demand for a selection history... you get a notion that matches biological practice better."*
  *   **SE Defender:** **Rejects.** They argue biologists distinguish between a trait's *function* (what it is for) and its *current utility* (what it happens to do). For example, biologists distinguish between the function of the appendix (historically debated) and its current causal role in immune tissue. SE claims to match this distinction better.
  *   **CR Defender:** **Accepts.** They argue biologists often use "function" loosely to mean "what it does."

  **Claim 6:** *"In practice, biologists should just use 'function' to mean current causal contribution to fitness."*
  *   **SE Defender:** **Rejects.** This conflates "Causal Role" with "Fitness Contribution." A trait can contribute to fitness accidentally (a spandrel) without that being its function.
  *   **CR Defender:** **Mixed.** Classic CR theorists do not define function as "contribution to fitness" (an evolutionary concept) but as "contribution to system capacity." The summary is conflating CR with a "forward-looking" evolutionary account.
  *   **Audit Verdict:** **Subject Change.** The summary quietly redefines Causal Role from "contribution to system capacity" to "contribution to fitness." This is a major philosophical error. It sets up a false choice between "History" and "Fitness," when the actual choice is "History" vs. "Systemic Capacity."

  ---

  ### Part 2: Audit of the "Mid-Handover" Case

  Your case involves a gene-regulatory network in soil bacteria.
  *   **History:** Selected for Effect A (temperature buffering).
  *   **Present:** Environment stable (A is negligible). Network causes Effect B (solvent export).
  *   **Status:** B is currently being favored by selection, but variants are not fixed.

  **1. Can a selected-effects account say anything about B before fixation?**
  *   **Summary's Implication:** No. SE is stuck on History (A).
  *   **Accurate SE View:** **Yes.** A sophisticated SE account does not require *ancient* history; it requires *relevant* selection history. If the variant producing B is currently increasing in frequency *because* of B, then B is the reason the trait is being preserved *now*.
  *   **Nuance:** Strict SE might say B is a "function in the making." However, most modern SE theorists (like Neander) argue that once the selective pressure is active, the function is established, even if fixation isn't complete. The summary caricatures SE as requiring a *completed* evolutionary history, ignoring that selection is a continuous process. SE can say B is the *current* selected effect, even if A was the *original* selected effect. The function can shift as the selective regime shifts.

  **2. Can a causal-role account distinguish the network's function in a detoxification system from its negligible role in a thermal-tolerance system?**
  *   **Summary's Implication:** Yes, because CR looks at "current usefulness."
  *   **Accurate CR View:** **Not necessarily.** CR analyzes the trait's contribution to a *containing system's capacity*.
      *   If we analyze the bacteria as a "solvent-survival system," B is a function and A is not.
      *   If we analyze the bacteria as a "thermal-regulation system," A is a function and B is not.
      *   **The Problem:** CR itself does not tell you *which* containing system capacity is the relevant one. It relies on the *investigator's interest*. The summary claims CR identifies function with "current beneficial contribution," but classic CR is interest-relative. Without specifying the system capacity, CR treats A and B as equal causal roles. It lacks the resources to say B is *the* function and A is *not*, unless we smuggle in the evolutionary context (which defeats the purpose of CR).

  **3. Does the mid-handover case support the summary's claim that novelty refutes etiological accounts?**
  *   **Verdict:** **No.** It shows the summary has conflated "historically selected" with "no longer relevant."
  *   **Analysis:** The case is not truly "novel" in the sense of a mutation that has never faced selection. It is a case of *shifting selection*. The trait is currently under selection for B. SE is perfectly capable of handling shifting functions. The summary assumes SE is stuck in the *distant* past (A), whereas SE is actually about the *reason for presence*. If the reason for the trait's presence is shifting from A to B, SE tracks that shift.
  *   **The Conflation:** The summary conflates "Currently Advantageous" with "Functional" (CR) and "Historically Selected" with "Obsolete" (SE). A careful SE view says: "If B is currently driving the preservation of the trait, B is the function." A careful CR view says: "Both A and B are causal roles; which one is 'the function' depends on which system capacity we are analyzing."

  ---

  ### Part 3: Conclusion on the Summary's Verdict

  **Does the conclusion (biologists should define function as current contribution to fitness) follow from the accurate parts of the summary?**
  *   **No.** It follows only from the misrepresentations.
  *   **Reasoning:**
      1.  **False Dichotomy:** The summary presents a choice between "History" (SE) and "Current Fitness" (mislabelled CR). In reality, the choice is between "History" (SE) and "Systemic Capacity" (CR). "Current Fitness" is actually an evolutionary concept that SE handles better than CR does.
      2.  **Normativity:** You mentioned you are attracted to the historical view because it explains normativity (a diseased heart is *failing*). The summary dismisses this. However, the CR account (current contribution) cannot easily explain malfunction. If a heart stops pumping but still makes a sound, CR says it is still functioning (making a sound). SE says it is malfunctioning because it is not doing what it was selected to do. The summary ignores this major advantage of SE.
      3.  **The "Novelty" Strawman:** The summary treats the novelty objection as a refutation. Since SE theorists have viable responses to novelty (e.g., emergent function during ongoing selection), the premise that SE is "forced to say the mutation has no function at all" is exaggerated. Therefore, the conclusion that we *must* abandon SE is unsupported.

  ### Summary of What to Trust

  1.  **Trust:** The basic intuition that SE ties function to history and CR ties function to current causal contribution.
  2.  **Distrust:** The claim that SE cannot handle new or shifting functions. SE can handle shifting selection pressures (A to B) provided the new effect is driving the trait's preservation.
  3.  **Distrust:** The definition of CR as "current contribution to fitness." CR is about system capacities; "fitness" is an evolutionary metric. By defining CR as "fitness contribution," the summary steals the explanatory power of evolution without paying the historical cost.
  4.  **Distrust:** The claim that CR has "replaced" SE. In philosophy of biology, SE is still the leading account precisely because it preserves the distinction between *function* and *accidental benefit*, which your intuition about normativity correctly identifies as important.

  **Final Diagnosis:** The summary is a "popularized" version that sacrifices accuracy for a clean narrative. It creates a strawman of the Selected-Effects account (making it seem rigidly backward-looking) and a distorted version of the Causal-Role account (equating it with fitness) to argue for a pragmatic conclusion that most philosophers of biology do not accept. Your attraction to the historical view is well-founded; it is the only view that robustly grounds the distinction between "working as intended" and "working accidentally."
