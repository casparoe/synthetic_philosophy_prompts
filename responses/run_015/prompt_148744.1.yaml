answer: |-
  **Mira:** Look, I'm not saying the biology is *literally* code in the sense of a programmer sitting there typing. I'm saying the logical structure is identical. You've got a blind process iterating over variations, keeping what works, ditching what doesn't. Whether that variation is a mutation in a base pair or a bit-flip in a register, the competence emerges from the filter, not the substrate. That's the inversion. Neither the gene nor the transistor knows *why* it's surviving or computing, yet here we are.

  **Theo:** But you're glossing over the vehicle. In the Turing case, you're manipulating symbols. There's a syntax. Even if the machine doesn't understand the syntax, the syntax itself presupposes a system of representation. A punch card hole means '1' only relative to a convention. Evolution isn't shuffling symbols; it's shuffling physical objects. A beak isn't a representation of a beak; it just *is* a beak. If it cracks the seed, it stays. There's no semantic layer to collapse.

  **Mira:** That's just a distinction without a difference. Why does syntax need a mind to exist? If I build a mechanical adder out of gears, it adds. It doesn't need a homunculus inside looking at the gears and saying, "Ah, yes, addition." The causal power is in the arrangement. If you can mechanise syntax—and we have, obviously—then the "meaning" is irrelevant to the operation. The competence is in the mechanism, not the interpretation.

  **Theo:** But who set up the gears? The adder adds because we *decided* those gear positions correspond to numbers. Without an interpreter to assign that value, it's just brass cogs clicking. You can't recieve competence from nowhere. In evolution, there is no assignment. The environment doesn't "interpret" the beak; the beak physically interacts with the seed. It's direct causal contact. In computation, there's always this gap between the physical state and the logical state. You're trying to say evolution bridges that gap, but evolution never had the gap to begin with.

  **Mira:** So you're saying computation is parasitic on mind, but evolution isn't?

  **Theo:** I'm saying computation is defined by its abstraction from physics. That's the whole point of Turing. Multiple realisability. You can run the same programme on silicon or water buckets. You can't run "natural selection" on water buckets unless you're simulating it. When real selection happens, it's stuck to the physics. The parallel breaks because Turing showed how mind-independent syntax can be, but syntax still implies a 'aboutness' that biology lacks.

  **Mira:** But that 'aboutness' is something we project afterwards. The machine doesn't care. If I leave a computer running in a bunker for a million years, solving proofs, it's exhibiting competence without comprehension. Exactly like a lineage of bacteria. The fact that a human *wrote* the initial code is just the seed mutation. Once it's running, the interpreter is gone. The system stands on its own.

  **Theo:** Except the computer is still processing *symbols*. If the voltage drifts, it's an error. In evolution, if the physics drifts, it's just a new variation. There's no 'error' in nature, only mismatch. The Turing machine has a normative standard built into its syntax—right vs. wrong states—which implies a designer's intent, even if absent during runtime. Evolution has no norms, only consequences. You're conflating 'function' with 'correctness'.

  **Mira:** Function *is* normative in this context. A heart that doesn't pump is a bad heart. A programme that doesn't halt is a bad programme. Both are judged by an outcome external to the system. I still think you're holding onto the idea that symbols are magical. They're just physical states that carry information because of their causal history.

  **Theo:** And I think you're ignoring that the causal history of a symbol includes an agent who made it a symbol. The causal history of a beak just includes ancestors who survived. One is teleological, even if derived; the other is purely mechanistic. The inversion is real for Darwin, but for Turing, it's only half-true. He showed machines don't need to understand, but he didn't show they don't need a user.

  **Mira:** Maybe the universe is the user.

  **Theo:** Then we're doing theology, not computer science.

