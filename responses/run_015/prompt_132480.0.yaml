answer: |-
  You have identified a genuine and significant structural dynamic in institutional evolution. To answer your primary question directly: **No, there is no single, canonical term in social-choice theory or institutional economics that captures this specific failure mode in its entirety.**

  However, your observation is not without precedent. It sits at the intersection of three well-established literatures that, when combined, describe exactly what you have modeled. The phenomenon is a composite of **Gordon Tullock's "Transitional Gains Trap"** (Public Choice), **Paul Pierson's "Policy Feedback"** (Political Science), and **Reference-Dependent Preferences** (Behavioral Economics).

  Below, I outline the nearest conceptual neighbors, explain why they fall slightly short of your specific description, and then offer a precise conceptual carving with boundary conditions, as requested.

  ### 1. The Nearest Conceptual Neighbors

  #### A. The Transitional Gains Trap (Gordon Tullock, 1975)
  This is the strongest economic ancestor to your observation. Tullock argued that when a government creates a privilege (e.g., a subsidy, a license, a tariff) to benefit a specific group, the value of that privilege is quickly **capitalized** into the asset values of the beneficiaries.
  *   **The Mechanism:** If the government gives taxi medallion owners a monopoly, the value of the medallion rises. A new driver buys the medallion at the high price, expecting the monopoly to continue.
  *   **The Trap:** If the government later removes the monopoly to improve overall welfare, the *current* owner suffers a capital loss, even though the *original* recipient has long since sold out. Thus, the "temporary" privilege becomes permanent because removing it creates new losers.
  *   **Where it diverges from your pattern:** Tullock focuses on the *dissipation of rents* (the money is gone, spent on the asset). You are focusing on the **institutional rigidification** that blocks *future* reforms. Your concern is not just that the money was wasted, but that the *safeguard mechanism itself* becomes a veto point against subsequent optimization.

  #### B. Policy Feedback Theory (Paul Pierson, 1993)
  In political science, Pierson coined the phrase **"Policies create politics."**
  *   **The Mechanism:** Once a policy is enacted, it distributes resources and information that reshape the political landscape. Beneficiaries organize into constituencies (e.g., the AARP for Social Security) that defend the policy.
  *   **The Trap:** The policy becomes "sticky" not because it is efficient, but because it has generated a vested interest group with high mobilization capacity.
  *   **Where it diverges:** Policy feedback is often emergent. Your observation is more specific: the rigidity is **engineered ex-ante** as a condition of the initial reform (the grandfather clause, the rebate). It is a *designed* feedback loop, not an accidental sociological byproduct.

  #### C. Endogenous Reference Points (Behavioral Economics)
  Your observation relies on the fact that "harm" is subjective.
  *   **The Mechanism:** Loss aversion (Kahneman & Tversky) dictates that losses loom larger than gains. By compensating stakeholders, you shift their **reference point**.
  *   **The Trap:** What was a "gain" relative to $t_0$ (the original status quo) becomes the new baseline at $t_1$. Removing that gain at $t_2$ is perceived as a loss, triggering intense resistance, even if the agent is still better off than at $t_0$.
  *   **Where it diverges:** This explains the *psychology* of the resistance, but not the *institutional crystallization* (the monitoring bodies, the legal entitlements) that you describe.

  ### 2. Conceptual Carving and Naming

  Since no single term exists, I propose we carve this concept precisely. Given your background, the term should reflect the dynamic, equilibrium-shifting nature of the phenomenon.

  **Proposed Label:** **Compensation-Induced Institutional Hysteresis**
  *(Alternative: The Pareto Entrenchment Problem)*

  **Definition:**
  A dynamic failure mode in institutional design where the mechanisms employed to secure immediate Pareto improvements (compensation, grandfathering, exemptions) acquire independent institutional mass. These mechanisms shift the evaluative baseline for stakeholders, transforming transitional safeguards into permanent entitlements. Consequently, the system becomes locked in a **local welfare optimum** that is superior to the original status quo but inferior to achievable global optima, because any movement toward the global optimum requires violating the newly entrenched entitlements, which is politically defined as a "harm."

  ### 3. Boundary Conditions and Distinctions

  To distinguish this from neighboring concepts, we must establish clear boundary conditions.

  | Concept | Distinguishing Feature | Why Your Pattern is Different |
  | :--- | :--- | :--- |
  | **Status Quo Bias** | Resistance to *any* change from the current state. | Your pattern involves resistance to changing the *new* state, but the resistance is specific to the *safeguards*, not the whole system. It is an **Endogenous Status Quo**, not an exogenous bias. |
  | **Path Dependence** | Historical contingency locks in a suboptimal standard (e.g., QWERTY). | Path dependence is usually accidental or emergent (increasing returns). Your pattern is **deliberately engineered** as a precondition for the initial reform. |
  | **Second-Best Theory** | If one optimality condition fails, satisfying others may reduce welfare. | Second-Best is a mathematical constraint on efficiency. Your pattern is a **political constraint** generated by the *method* of reform, not by technological or informational limits. |
  | **Time Inconsistency** | A plan optimal at $t_0$ is not optimal at $t_1$. | Time inconsistency usually refers to policymakers reneging on promises. Here, the problem is policymakers **keeping** promises that become obstructive. |
  | **Rent-Seeking** | Spending resources to gain artificial transfers. | This is **Defensive Rent-Seeking**. The stakeholders are not seeking new rents; they are defending capitalized entitlements created by the reform itself. |

  ### 4. The Physics Analogy: Hysteresis and Metastability

  As a physicist, you will recognize this immediately as **Hysteresis**.

  *   **The System:** The institutional landscape.
  *   **The Force:** Reform pressure.
  *   **The Mechanism:** When you apply force (reform) to move the system from State A (old status quo) to State B (reformed), you must overcome friction (opposition).
  *   **The Compensation:** This acts as a lubricant that allows the transition.
  *   **The Crystallization:** However, the lubricant solidifies (becomes entitlement).
  *   **The Result:** To move from State B to State C (further optimization), you now face a higher energy barrier than you did moving from A to B, because the "lubricant" has become part of the lattice structure. The system is in a **metastable state**: it is stable against small perturbations (future reforms) but not in the global energy minimum (optimal welfare).

  ### 5. Why This Matters for Institutional Design

  You have identified a **Dynamic Consistency Problem in Welfare Economics**.

  Standard welfare economics treats Pareto improvements as unambiguously good. Your model shows that a sequence of Pareto improvements can lead to a suboptimal equilibrium if the *compensation vectors* are not designed to sunset.

  **The Critical Design Flaw:**
  The failure occurs when compensation is treated as a **transfer payment** (flow) rather than a **structural modification** (stock). When compensation is institutionalized (e.g., a permanent rebate stream rather than a one-time buyout), it creates a new "constituency of the status quo."

  **Recommendation for Literature:**
  If you are writing on this, you should anchor your argument in **Tullock's Transitional Gains Trap** but explicitly extend it. Tullock described the *economic dissipation* of the gain; you are describing the *political ossification* of the mechanism.

  You might frame this as **"The Paradox of Pareto Reforms"**: *The very conditions that make a reform politically feasible (compensation) are the conditions that make future optimization politically impossible.*

  This is a robust, under-theorized insight. It deserves the precise carving you have begun here.
