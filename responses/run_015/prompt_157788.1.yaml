prompt: |-
  I'm doing a module on ancient ethics and we got into this really annoying debate about whether death is actually bad for you, specifically through the Epicurean lens. Everyone kept bringing up the deprivation account - like, dying stops you getting future pleasures - but I feel like that's a side issue and definately misses the deeper symmetry argument. Could you write me an argument that death is not harmful to the one who dies, but do it in a way that doesn't just repeat the standard 'no subject, no harm' mantra?

  Instead, I want you to combine Epicurus's symmetry claim with a diachronic view of personal identity: argue that for harm to occur there needs to be a persisting subject with psychological continuity who can stand in the relation of being-deprived, and that death doesn't just weaken this continuity but annihilates the relational structure altogether, whilst pre-natal non-existence never established it in the first place. Then tackle the objection that we rationally care about our future selves despite weak continuity - say, near the end of life - by arguing that rational concern scales with the strength of psychological connection, and at death the coefficient drops to zero rather than tapering. I need this for a discussion with my tutor who thinks Epicureanism is just common sense with a toga on, so please make it somewhat technical but don't cite anyone by name unless it's unavoidable - I'm not asking for a bibliography, just the conceptual machinery worked through clearly.
reasoning: |-
