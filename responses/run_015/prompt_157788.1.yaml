      *   **Key Mechanism:** Harm requires a persisting subject with psychological continuity to stand in the relation of "being deprived." Death annihilates this relational structure; pre-natal non-existence never established it.
      *   **Objection to Address:** We rationally care about future selves even with weak continuity (e.g., near end of life).
      *   **Counter-Objection:** Rational concern scales with the strength of psychological connection. At death, the coefficient drops to zero (discontinuity), not just tapering off.
      *   **Tone/Style:** Somewhat technical, conceptual machinery worked through clearly, no bibliography/naming names unless unavoidable (avoid "Parfit," "Nagel," etc., unless necessary for clarity, but the prompt says "don't cite anyone by name unless it's unavoidable").
      *   **Goal:** Impress a tutor who thinks Epicureanism is just "common sense with a toga."

  2.  **Deconstruct the Philosophical Moves:**
      *   *Standard Epicureanism:* Death is nothing to us. When we are, death is not; when death is, we are not. (The "No Subject" argument).
      *   *The Deprivation Account (The Opponent):* Death is bad because it deprives you of future goods.
      *   *The User's Twist:* Use Personal Identity theory to bolster the Symmetry Argument.
      *   *Symmetry:* Pre-natal non-existence vs. Post-mortem non-existence. We don't regret the past; why fear the future?
      *   *Diachronic Identity:* A person is a series of psychological states connected by memory, intention, character, etc.
      *   *The "Harm Relation":* Harm isn't just an event happening *to* a body; it's a disruption of a narrative or psychological trajectory *experienced* or *holdable* by a subject.
      *   *The "Coefficient" Idea:* Concern for future selves is proportional to psychological connectedness. Death breaks this completely (coefficient = 0).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the deprivation account but dismiss it as superficial because it assumes a subject that can *hold* the deprivation. Introduce the diachronic identity framework.
      *   **The Relational Structure of Harm:** Define harm not as a metaphysical state but as a relation between temporal stages of a person. To be deprived, there must be a continuum that *could have* carried the value.
      *   **Symmetry and Identity:** Apply the symmetry argument through the lens of identity. Pre-natal non-existence didn't break a chain; there was no chain. Post-mortem non-existence snaps the chain. But crucially, once snapped, there is no "one" to whom the snapping is bad.
      *   **Addressing the "Future Concern" Objection:** This is the crux. People say, "I care about next year even if I change."
      *   **The Scaling/Coefficient Argument:** Argue that rational concern is a function of psychological connectedness. As we age, connectedness might weaken, but it exists. Death is a categorical break, not a gradual weakening. It's not $0.1$; it's $0$.
      *   **Conclusion:** Summarize. Epicureanism isn't just common sense; it's a rigorous claim about the metaphysics of persons and value.

  4.  **Refining the Argument (Self-Correction during drafting):**
