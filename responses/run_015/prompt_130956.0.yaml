      *   **Reinterpreting (1):** (1) shouldn't mean "explicitly tag every unchanged fact." It means "your belief set shouldn't contradict reality." You can satisfy this via defaults without explicit storage.
      *   **Cost:** Surrendering (2) means admitting that rationality doesn't require deductive certainty about every fact. It requires *defeasible* reasoning. This shifts the model of rationality from classical logic to non-monotonic logic.

