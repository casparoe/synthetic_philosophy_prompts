  3.  **Identify the Core Philosophical Issue (The Frame Problem):**
      *   The Frame Problem (originally McCarthy & Hayes, 1969) isn't actually about *storage* (ontological frame problem) but about *inference* (epistemological frame problem).
      *   The user's argument conflates *representing* a fact with *inferring* its persistence.
      *   The standard solution involves "default logic" or "inertia." We don't need to *check* everything stays the same; we assume it stays the same unless told otherwise.
