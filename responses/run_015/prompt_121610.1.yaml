answer: |-
  # Activity: The Phantom Rollback Protocol
  **Time:** 45 Minutes
  **Participants:** 9 Engineers
  **Goal:** Viscerally experience the violation of the Independence Axiom (Allais Paradox) using distributed systems framing.

  ## 1. Materials Prep (15 mins before session)
  *   **Decision Slips:** 18 small cards (2 per person).
      *   *Card 1 (Primary Mode):* Options **Alpha** vs. **Beta**.
      *   *Card 2 (Degraded Mode):* Options **Gamma** vs. **Delta**.
  *   **Outcome Deck:** 100 poker chips or slips of paper in a bag.
      *   89 Green (Success)
      *   10 Blue (Jackpot)
      *   1 Red (Rollback)
      *   *(Note: For Round 2, we reinterpret the colors, see Rules).*
  *   **Whiteboard:** Drawn with two columns: "Round 1 Choices" and "Round 2 Choices".
  *   **Currency:** "Coffee Points" (CP). Write these on a shared ledger. 10 CP = 1 real coffee later.

  ## 2. The Framing (5 Minutes)
  **Say this:**
  "We're simulating a distributed transaction system. You are the Load Balancer. You have to route requests to different clusters. The goal is to maximize Coffee Points for the team.

  There is a known bug in the system called **'Phantom Rollback.'** Sometimes, a transaction looks committed, but a hidden consensus check later reverts it to zero. You don't know when it happens until the sprint ends.

  We are running two Sprints. You must make a routing choice for **both** sprints now, before we run the simulation."

  ## 3. The Game (15 Minutes)

  ### Round 1: Primary Mode (The Certainty Trap)
  Hand out **Card 1**. Read the options aloud.

  *   **Option Alpha (Stable Cluster):**
      *   **100%** chance of **10 CP**.
      *   *Framing:* "Guaranteed commit. No rollback window."
  *   **Option Beta (Sharded Cluster):**
      *   **89%** chance of **10 CP**.
      *   **10%** chance of **50 CP**.
      *   **1%** chance of **0 CP** (Phantom Rollback).
      *   *Framing:* "Higher throughput, but there's a 1% window where the consensus fails and you lose everything."

  **Action:** Give them 60 seconds to circle their choice. Collect the cards. Tally on the whiteboard.
  *(Prediction: Most engineers will pick Alpha. The 1% rollback feels unacceptable compared to guaranteed safety.)*

  ### Round 2: Degraded Mode (The Risk Shift)
  Hand out **Card 2**. Read the options aloud.

  *   **Option Gamma (Legacy Failover):**
      *   **11%** chance of **10 CP**.
      *   **89%** chance of **0 CP** (System Timeout).
      *   *Framing:* "High latency. Most requests time out. Only 11% go through."
  *   **Option Delta (Experimental Failover):**
      *   **10%** chance of **50 CP**.
      *   **90%** chance of **0 CP** (System Timeout).
      *   *Framing:* "Unstable. Most requests time out. But if it hits, the payout is huge."

  **Action:** Give them 60 seconds to circle their choice. Collect. Tally.
  *(Prediction: Most engineers will pick Delta. Since failure is already expected (89-90%), the 1% difference in safety doesn't matter, so they chase the 50 CP.)*

  ### The Simulation (5 Minutes)
  **Do not actually roll dice for every person.** It kills the pacing. Instead, explain the "System State."

  1.  Pull one chip from the **Outcome Deck** visibly.
  2.  **If Green (89%):** Round 1 Beta pays 10 CP. Round 2 Gamma pays 10 CP.
  3.  **If Blue (10%):** Round 1 Beta pays 50 CP. Round 2 Delta pays 50 CP.
  4.  **If Red (1%):** Round 1 Beta pays 0 CP. (Round 2 is already 0 for this slice).

  **Say:** "We aren't resolving individual payouts today. The point isn't who won. The point is the *pattern* of your choices. Look at the board."

  ## 4. The Debrief (20 Minutes)
  This is where you map the feeling to the axiom.

  ### Step 1: Reveal the Inconsistency
  Point to the whiteboard tallies.
  "Look at the room. Most of you picked **Alpha** in Round 1, but **Delta** in Round 2.
  If you did that, raise your hand." (Count them).
  "Congratulations, you are irrational. According to Expected Utility Theory, you just broke the **Independence Axiom**."

  ### Step 2: Map the Math (The "Common Consequence")
  Draw this on the board:

  *   **Round 1:**
      *   Alpha: **100%** [10 CP]
      *   Beta: **89%** [10 CP] + 10% [50 CP] + 1% [0 CP]
  *   **Round 2:**
      *   Gamma: **11%** [10 CP] + **89%** [0 CP]
      *   Delta: 10% [50 CP] + **90%** [0 CP]

  **Say:** "Strip away the noise. Look at the **89% chunk**.
  In Round 1, that 89% chunk gives you **10 CP** in both options (Alpha is 100% 10CP, which is 89% 10CP + 11% 10CP).
  In Round 2, that 89% chunk gives you **0 CP** in both options.

  The Independence Axiom says: **If a sub-component is identical in both options, it should not affect your preference.**
  Since the 89% chunk is the *same* within each round, you should make the same choice in Round 1 and Round 2.
  If you prefer Safety (Alpha), you should prefer Gamma.
  If you prefer Risk (Beta), you should prefer Delta.
  But you switched."

  ### Step 3: Map the Feeling (The "Phantom Rollback")
  **Ask:** "Why did you switch? Be honest."
  *   *Likely Answer:* "In Round 1, Alpha was guaranteed. Beta had a risk of total loss."
  *   *Likely Answer:* "In Round 2, both were likely to fail, so I went for the big win."

  **The Pivot:**
  "In Round 1, the **1% Rollback** felt heavy. It felt like a bug. It violated the 'Guaranteed Commit' of Alpha.
  In Round 2, the system was already 'Timing Out' (89-90% failure). The 1% rollback risk was hidden inside the noise of expected failure.

  **This is the Allais Paradox.**
  Mathematically, the 1% risk is the same delta in both rounds.
  Psychologically, the 1% risk is **catastrophic** when you expect safety, and **negligible** when you expect failure.

  The Independence Axiom assumes you care about the *final asset state*.
  Your brains care about the *disappointment relative to expectation*.
  In Round 1, choosing Beta and hitting the 1% Rollback feels like a **regret** ('I could have had 10 for sure').
  In Round 2, hitting the 0% is expected. No regret."

  ## 5. Predictable Failures & Limitations
  **Be straight about these during the Q&A:**

  1.  **The "Rational" Holdouts:**
      *   *What happens:* 1 or 2 people will pick Alpha *and* Gamma (or Beta *and* Delta). They will claim they are "consistent."
      *   *Response:* "They are technically correct. They are Expected Utility Maximizers. This game doesn't prove them wrong; it proves *most humans* aren't them. The paradox is descriptive, not prescriptive."

  2.  **The Framing Confusion:**
      *   *What happens:* Someone will argue that Round 1 and Round 2 are different systems, so the axiom doesn't apply.
      *   *Response:* "The axiom applies to the *probabilities*, not the server names. Mathematically, Round 2 is just Round 1 with the '89% Win' mass changed to '89% Loss'. If you ignore the common mass, the choice should remain stable."

  3.  **What This Game Cannot Reproduce (The Verbal Supply):**
      *   *The Normative Claim:* This game shows that humans *violate* the axiom. It cannot prove the axiom is *wrong*. Some economists argue the axiom is correct and humans are simply buggy. You have to verbally supply that tension: "Is the math wrong, or are we?"
      *   *The Stakes:* With fake coffee points, risk aversion is lower than with real salary money. The paradox usually strengthens with higher stakes, but the *direction* of the violation remains.
      *   *Single Shot:* Real Allais is often one-shot. Doing two rounds back-to-back lets people spot the pattern. In a real system, you wouldn't see Round 2 immediately. The "feeling" relies on them not noticing the math connection until you reveal it.

  ## 6. Closing Script
  "We build systems assuming users and stakeholders act rationally about risk. We model retries, timeouts, and consensus based on independent probabilities.
  But when you deploy to production, the 'Phantom Rollback' isn't just a probability. It's a feeling.
  If you promise 100% uptime and hit 99.9%, you get fired.
  If you promise 90% uptime and hit 89%, nobody notices.
  The math says that 1% delta is identical. Your career says it's not.
  That gap? That's where the philosophy lives. That's where the Allais Paradox breaks your model."

  **End on time.** (Let them get coffee).
