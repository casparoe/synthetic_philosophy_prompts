      *   *Check:* Did I address the "binding" nature? *Correction:* The prompt says the proposal makes them binding. My recommendation should modify this. If I make them non-binding, it defeats the purpose. If I make them strictly binding, it risks the legitimacy objection. *Solution:* Make them provisionally binding, subject to a high-threshold override. This respects the "indirect normativity" while preserving "democratic accountability."
      *   *Check:* Did I identify the point of judgment? *Correction:* Need a specific paragraph acknowledging that the specific threshold (e.g., 2/3 vote) is arbitrary but necessary.
      *   *Check:* Tone:* Needs to be academic, administrative, yet philosophically rigorous.

  5.  **Drafting the Content (Iterative refinement):**

