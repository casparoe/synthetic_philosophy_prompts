answer: |-
  **MEMORANDUM**

  **TO:** The Faculty Senate
  **FROM:** Chair, Policy Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Deliberative Proxy Procedure for General-Education Disputes

  **I. Executive Summary**

  The Policy Committee has completed its review of the proposed "deliberative proxy" procedure intended to resolve deadlocked disputes regarding mandatory general-education curriculum requirements. The proposal seeks to replace direct voting with a binding determination by a panel tasked with identifying norms that would be acceptable to fully informed, unbiased representatives under idealized conditions.

  After extensive deliberation, the Committee recommends **adoption of the procedure with specific structural safeguards.** While the theoretical appeal of indirect normativity is strong, the risks to democratic legitimacy are substantial. Therefore, we recommend a hybrid model that utilizes the proxy panel for normative clarification but retains a high-threshold override mechanism for actual stakeholders. This memo details the procedural framework, engages the philosophical objections regarding authority and consent, and identifies the specific point where policy judgment must supersede abstract principle.

  **II. Engagement with Indirect Normativity**

  The core argument for the proposal rests on indirect normativity: the claim that a decision derives authority not from the actual preferences of affected parties, but from the rational acceptability of the norm under idealized scrutiny. Proponents argue that actual stakeholders are often hindered by information asymmetry, strategic bargaining, and transient interests. By abstracting away from these impediments, the proxy panel ostensibly discovers the "true" rational consensus that would exist if all parties were fully informed and unbiased.

  The Committee accepts the premise that a norm *can* possess authority solely because it survives idealized scrutiny, but only conditionally. Idealized scrutiny is a valid test for *coherence* and *fairness*, but it is an insufficient test for *obligation*. A norm may be logically robust and fair in the abstract yet fail to account for tacit knowledge or contextual constraints known only to those living within the system. Therefore, indirect normativity can generate a presumption of authority, but it cannot generate absolute authority without a link to actual consent. The authority of the idealized decision must be ratified by the actual community's willingness to submit to the process, not necessarily every specific outcome.

  **III. Addressing Democratic Legitimacy**

  Critics argue that substituting a philosophical fiction for democratic accountability violates the social contract of the university. They contend that idealized deliberation cannot generate binding obligations for real people who never consented to the abstraction. We reject the notion that this objection is mere populism. It raises a fundamental point about the burden of implementation.

  A norm can be rationally coherent yet practically intolerable. If a curriculum requirement is theoretically sound but operationally impossible for faculty to teach or students to complete, its rational coherence is irrelevant. Democratic legitimacy in a public university requires that those who bear the burden of a policy retain the capacity to reject it if it proves unworkable in practice. To bind stakeholders to a "fiction" without recourse is to treat the university as a laboratory for theory rather than a functioning institution. Consequently, the procedure must preserve a mechanism for actual stakeholders to intervene when the idealized output clashes with practical reality.

  **IV. Recommended Procedural Framework**

  To balance the need for depoliticized resolution with democratic accountability, the Committee recommends the following structure:

  **A. Composition of the Deliberative Proxy Panel**
  *   **Size:** Nine (9) members.
  *   **Selection:** Members will not be appointed by leadership. Instead, a pool of eligible candidates (faculty, students, administrators) will be vetted for conflicts of interest. Panelists will be selected by sortition (random lottery) from this pool to minimize strategic positioning.
  *   **Representation:** The panel must consist of three faculty members, three student representatives, and three administrators.
  *   **Term Limits:** Members will serve staggered three-year terms. No member may serve more than two consecutive terms. This ensures institutional memory while preventing capture by specific interest groups.

  **B. The Deliberative Mandate**
  *   The Panel's charge is not to determine what is *popular*, but to determine what is *rationally acceptable* assuming full information and the absence of strategic bias.
  *   **Public Reasoning:** The Panel must publish a "Statement of Idealized Acceptability" alongside any decision. This document must explicitly detail how particular interests were abstracted away and why the resulting norm is deemed acceptable to a fully informed representative of each group.

  **C. Institutional Checks and Safety Valves**
  To prevent the imposition of conceptually sound but practically intolerable norms, the following checks are required:
  1.  **Provisional Binding Status:** Panel decisions are binding upon issuance.
  2.  **The Feasibility Override:** Within thirty (30) days of the Panel's decision, any of the three constituent bodies (Faculty Senate, Student Government, University Administration) may trigger a review.
  3.  **Threshold for Rejection:** To overturn a Panel decision, the objecting body must pass a resolution by a **two-thirds supermajority**. The resolution must cite specific *practical feasibility* concerns (e.g., resource constraints, scheduling impossibilities, accreditation risks), not merely disagreement with the normative premise.
  4.  **Consequence of Override:** If an override is successfully triggered, the dispute returns to the Panel for revision within sixty (60) days, incorporating the feasibility constraints identified. If the second decision is also overridden, the matter defaults to a direct vote of the Faculty Senate.

  **V. Implementation Timeline**

  *   **Phase 1 (Months 1-3):** Establishment of the vetting committee to create the initial pool of eligible Panelists.
  *   **Phase 2 (Months 4-6):** Training of the inaugural Panel on the methodology of idealized deliberation and the requirements for the "Statement of Idealized Acceptability."
  *   **Phase 3 (Month 7):** The procedure becomes active for any general-education dispute that has remained deadlocked for more than six months under standard committee review.
  *   **Phase 4 (Year 3):** Mandatory review of the procedure's efficacy by the Policy Committee, specifically analyzing whether the "Feasibility Override" was used appropriately or abused for political leverage.

  **VI. Judgment vs. Principle**

  In formulating this recommendation, the Committee encountered a specific juncture where judgment had to carry the decision rather than principle.

  The principle of democratic legitimacy demands that actual stakeholders have a veto over norms they cannot live with. The principle of indirect normativity demands that this veto not be used simply to reassert the biases the Panel was designed to overcome. Logic dictates that there must be a threshold for the "Feasibility Override," but reason alone does not dictate *what* that threshold must be.

  We selected a **two-thirds supermajority** for the override. This number is not derived from a philosophical axiom. A simple majority would render the Panel toothless, allowing a slim majority to revert to the very strategic bargaining the procedure seeks to avoid. A unanimous requirement would make the Panel's decision absolute, risking the imposition of intolerable norms. The choice of two-thirds is a matter of **policy judgment**. It is an arbitrary calibration intended to signal that overturning the Panel requires a substantial consensus that the norm is unworkable, not just a partisan victory. We acknowledge that this number could be too high or too low; however, a decision had to be made to operationalize the theory, and this threshold represents our best judgment on balancing stability with accountability.

  **VII. Conclusion**

  The "deliberative proxy" is a sophisticated tool for resolving intractable normative disputes, but it is dangerous if treated as a substitute for governance. By adopting this procedure with the recommended safeguards, the Senate acknowledges that while truth may be discovered through idealized reflection, authority is ultimately granted by the community that must endure it. We recommend adoption under the framework outlined above.

  **Recommendation:** Adopt with Structural Safeguards.
