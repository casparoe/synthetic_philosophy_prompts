      *   **Arguments to Engage:**
          *   *Pro:* Indirect normativity (authority comes from rational acceptability under ideal conditions, not actual preferences).
          *   *Con:* Democratic accountability (philosophical fiction vs. real consent), idealized deliberation vs. practical tolerability.
      *   **Requirements:**
          *   Recommend: Adoption, Rejection, or Adoption with Safeguards.
