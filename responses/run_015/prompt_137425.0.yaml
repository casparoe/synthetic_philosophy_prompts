answer: |-
  Here is the mapping of Anscombe's position onto the Truman decision, stripped of the usual consequentialist noise.

  ### 1. The Principle vs. The Choice
  Anscombe's core claim is not about outcomes; it is about the **description of the action**. For her, morality attaches to what you *choose to do*, not just what happens afterward.

  **What Truman Faced:**
  On Anscombe's view, Truman did not face a choice between "kill 200,000 now" and "kill 1,000,000 later." He faced a choice between "commit an act that is intrinsically murder" and "pursue other military options that might be costly but are not intrinsically murder."

  **What the Principle Says:**
  The principle dictates that if the death of innocents is part of the *plan* to achieve the objective (forcing surrender), the act is forbidden. It does not matter if the war is just. It does not matter if the alternative is invasion. You cannot do evil that good may come.

  **Where It Explains Something:**
  It explains why the "necessity" argument fails. Anscombe argues that "necessity" was manufactured by the policy of Unconditional Surrender. If the political objective had been negotiable, the mass killing would not have been "necessary." Therefore, the killing was a choice, not a fate.

  **Where It Is Silent:**
  Anscombe's theory offers no algorithm for minimizing total suffering. If the invasion of Japan would have resulted in the slaughter of millions of civilians (Japanese and Allied) through conventional combat, starvation, and Soviet brutality, Anscombe's principle does not weigh that against the bomb. It simply rules the bomb out. To a utilitarian, this looks like moral blindness; to Anscombe, it is the only way to keep morality from dissolving into arithmetic. She leaves the strategic alternative (invasion, blockade) to be judged on their own specific actions, not as a comparative backdrop to justify the bomb.

  ### 2. The Double Effect Dispute
  Your friend is half-right but misses the critical hinge. Anscombe *accepted* the Doctrine of Double Effect (DDE), but she applied it much more strictly than your friend implies.

  **The Friend's Claim:**
  Truman could have claimed he aimed at military installations (the munitions factories in Hiroshima) and merely *foresaw* the civilian deaths. Under a loose reading of DDE, this is permissible.

  **Why You Are Right (and Anscombe Would Agree):**
  For Anscombe, "intention" is not just what you say you aimed at with the bomb sight. It is **what you chose as a means to your end.**
  *   If the strategy relies on the destruction of the city to shock the Emperor into surrender, the civilian death is not a "side effect." It is the *mechanism* of success.
  *   Anscombe argues that you cannot separate the "military target" from the "civilian slaughter" in the case of an atomic bomb dropped on a city center. The weapon's nature makes the civilian death part of the intentional act.
  *   **The Verdict:** DDE only protects you if the bad effect is truly incidental to the good effect. If the bad effect (terror/death) is the *engine* driving the good effect (surrender), DDE offers no cover. Truman cannot hide behind "military targets" if the strategic logic requires the city to burn.

  ### 3. Your Counterfactual Test
  Your test is: *If the raid would have been pointless had the city been evacuated, you're using the civilians as a means.*

  **Does it capture her view?**
  Yes. This is a robust operationalization of Anscombe's "means" argument. If the presence of civilians is a *necessary condition* for the raid's strategic success (because the goal is terror or political coercion via suffering), then their deaths are intended, not merely foreseen.

  **Does it sweep in Firebombing and Blockade?**
  Yes, absolutely.
  *   **Firebombing:** The firestorm effect in Tokyo relied on population density. If Tokyo were empty, the firebombing would not have achieved its coercive effect. Under your test (and Anscombe's), this is intentional killing of innocents.
  *   **Blockade:** Starvation blockades work by pressuring the population to force the government's hand. If the civilians didn't suffer, the blockade wouldn't work. Therefore, their suffering is a means.

  **Is this a *Reductio* or a Bullet?**
  Anscombe would bite the bullet. She was consistent on this. She opposed area bombing in WWII generally, not just the atomic bomb. She viewed the Allied blockade of Germany similarly.
  *   **Why it's not a *reductio* for her:** A *reductio* shows a theory leads to an absurdity. Anscombe does not think condemning total war is absurd; she thinks total war is absurd (and sinful). She accepts that her principle makes much of modern warfare immoral. She would argue that if your theory says "starving children is okay if it shortens the war," *your* theory is the one that has failed, not hers.
  *   **The Cost:** The cost of her position is that it delegitimizes the primary methods 20th-century democracies used to win total wars. She accepts that cost.

  ### 4. The Role of Uncertainty
  You asked if Truman's uncertainty (about the bomb working, or Japan surrendering) shifts the moral weight.

  **On Anscombe's View:**
  Mostly, no.
  *   **Intention is Key:** If I take a hostage and threaten to kill them to get money, it does not matter if I am unsure the money will come. I have still chosen to use an innocent as a means. Truman's uncertainty about the *outcome* does not change the *nature of the act*.
  *   **The "Necessity" Claim:** Uncertainty matters only insofar as it undermines the claim of "military necessity." If Truman knew the bomb wouldn't work, he couldn't claim it was a military measure. But since he *hoped* it would work via civilian destruction, the intention is already corrupt.
  *   **Prudence vs. Morality:** Uncertainty is a matter of prudence (was it a smart gamble?), not morality (was it murder?). Anscombe is concerned with the latter. Even if the bomb failed to end the war, on her view, Truman would still be guilty of the attempt to murder innocents for political ends.

  ### Summary of the Mapping

  | Issue | Anscombe's Principle | Where the Theory is Silent |
  | :--- | :--- | :--- |
  | **The Act** | Intentional killing of innocents for political ends is murder. | Does not calculate whether invasion would have been "worse." |
  | **Double Effect** | Fails if civilian death is the *mechanism* of success, not just a side effect. | Does not define exactly where the line is for conventional weapons (though she hints it's often crossed). |
  | **Your Test** | Valid. If civilians are the leverage, they are the means. | Doesn't help distinguish between "supplying workers" and "innocent," but Anscombe treats most city dwellers as non-combatants. |
  | **Other Methods** | Firebombing and Blockade are equally condemned if they rely on civilian suffering. | Offers no alternative winning strategy for a total war against an enemy like Imperial Japan. |
  | **Uncertainty** | Irrelevant to the moral prohibition. | Doesn't account for the "fog of war" in assessing *intent*, though Anscombe assumes leaders know what they are doing. |

  **The Bottom Line:**
  Your friend thinks Anscombe's view is useless because it doesn't help a leader solve the problem of "how to win with minimum cost." You are right that this misses the point. Her principle isn't a decision-making tool for warfighters; it's a boundary marker for humanity. It says there are things you simply do not do, even to win, even to save lives.

  The case of Truman does not break her principle; it exposes the cost of holding it. If you accept her view, Truman is a murderer, the firebombing campaigns were crimes, and the Allied victory was tainted by methods that should not have been used. If that conclusion is unacceptable to you, you have to abandon the absolute prohibition. But you can't keep the prohibition and ask it to justify the decision. It wasn't built to do that.
