answer: |-
  Here is the specification for a theory of permissible insect killing, structured by desiderata, evaluation of your candidates, and meta-constraints.

  ### The Desiderata

  1.  **The Epistemic Risk Constraint**
      *   **Requirement:** The theory must assign moral weight to the *probability* of sentience, not just the *presence* of it. It cannot demand certainty before acting, nor can it treat uncertainty as zero.
      *   **Consideration:** We lack consensus on insect consciousness. A theory that waits for proof paralyzes necessary defense (malaria); a theory that assumes insensibility risks gratuitous cruelty (aphids).
  2.  **The Non-Target Proportionality Constraint**
      *   **Requirement:** The moral cost must account for the ratio of target pests to non-target animals affected by the method.
      *   **Case:** Broad-spectrum spraying on crops kills aphids but also bees and ladybugs. A theory permitting this must justify why the crop yield outweighs the collateral death of potentially higher-sentience non-targets.
  3.  **The Least-Restrictive-Method Constraint**
      *   **Requirement:** If a non-lethal or non-chemical method achieves the same protective end, lethal control is impermissible.
      *   **Case:** Malaria mosquitoes. Window screening prevents bites without killing; fogging kills. If screening works, fogging is prohibited. This distinguishes *killing* from *displacing* or *excluding*.
  4.  **The Threat-Immediacy Distinction**
      *   **Requirement:** The theory must differentiate between direct, imminent physical threat and economic or aesthetic inconvenience.
      *   **Case:** Wasps by a playground (imminent anaphylaxis risk) vs. Termites in the floor (property damage over months). The former may justify immediate lethal force; the latter requires slower, less violent remediation.
  5.  **The Ecological Stability Constraint**
      *   **Requirement:** Interventions must not create greater long-term suffering or harm through population destabilization.
      *   **Case:** Invasive ants on an island. Eradication might be permissible to save the ecosystem, but only if the method doesn't create a vacuum filled by a worse invader or cause density-dependent compensation (more births to replace deaths).

  ### Evaluation of Your Candidates

  *   **(1) The Standing-Crop Worry:** **Real.** This is a logical consistency check. If a theory justifies killing based on "loss of future," and insects have short futures, it permits killing. If that same logic permits killing day-old chicks (who also have short commercial futures), the theory is speciesist or flawed. The theory must ground the wrongness of killing in something other than duration (e.g., violation of integrity or risk of suffering).
  *   **(2) The Moving-Target Worry:** **Real.** This is an empirical coherence check. Consequentialist calculations rely on stable variables. If the act of killing changes the variables (resistance, boom-bust cycles), the calculation is void. A theory relying on fixed "bodycounts" fails here.
  *   **(3) The Sentience Uncertainty Insistence:** **Real.** This is a practical necessity. Moral theories cannot suspend operation pending scientific resolution. It forces the theory to adopt a decision-rule under uncertainty (e.g., expected value or precautionary principle).

  ### Meta-Analysis

  **Non-Negotiable vs. Preference**
  *   **Non-Negotiable:** The Epistemic Risk Constraint (Sentience Uncertainty), The Least-Restrictive-Method Constraint, and The Standing-Crop Worry. Without these, the theory is either practically inert, empirically deluded, or inconsistently speciesist.
  *   **Preference:** The Intent vs. Foresight Distinction. Whether *intended* sterilization (SIT) is morally distinct from *foreseen* death (spraying) depends on whether you hold a Deontological (Doctrine of Double Effect) or Consequentialist view. Both can satisfy the other desiderata.

  **The "Killer" Requirement**
  The **Epistemic Risk Constraint** knocks out the most candidates. Traditional Anthropocentrism fails because it assigns zero risk to non-humans. Strict Biocentrism often fails because it treats all life as equally inviolable regardless of sentience probability. Naive Utilitarianism fails because it struggles to calculate expected value without a defined "sentience unit." Only risk-weighted frameworks survive.

  **Incompatible Pair**
  **Strict Individual Accounting** and **The Moving-Target Worry** cannot be jointly satisfied. You cannot track the moral cost to every individual insect (Individual Accounting) while acknowledging that the intervention reshapes the population dynamics so radically that individual identity and fate are subsumed by systemic feedback loops (Moving-Target). You must choose: either individuals matter and population modeling is secondary, or population outcomes matter and individual counting is impossible.

  ### The Worst View
  **Naive Act Utilitarianism** performs worst against this spec. It collapses under the Moving-Target Worry because the data required for a utility calculation (future population dynamics, resistance rates) is unavailable at the moment of decision. It also fails the Epistemic Risk Constraint, as it typically demands a defined "unit of suffering" to calculate, forcing it to arbitrarily discount insect pain to zero rather than weighting the uncertainty, thereby greenlighting high-bodycount methods like spraying that violate the Non-Target Proportionality Constraint.
