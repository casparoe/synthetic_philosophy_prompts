answer: |-
  Dear Colleague,

  You are quite right to pause. Your intuition is sound: the difficulty you are encountering is not a failure of drafting, but a reflection of the ontological instability of the concept of 'music' itself. Your colleagues' insistence on tightening definitions is a classic legal reflex—attempting to cure a conceptual ambiguity with lexical precision. In this instance, however, that approach is liable to produce a rule that is either unenforceable or unjust.

  To counsel the borough council effectively, you must first articulate why 'music' resists definition, and then propose a regulatory framework that bypasses the need for such a definition entirely.

  ### I. The Philosophical Impasse: Why 'Music' is an Open Concept

  You should advise the council that the elusiveness of 'music' is a well-documented problem in aesthetics and the philosophy of language. There are three principal reasons why a definitional boundary will fail.

  **1. Family Resemblances**
  The philosopher Ludwig Wittgenstein argued that certain concepts (like 'games' or 'language') cannot be defined by a single set of necessary and sufficient conditions. Instead, they are linked by 'family resemblances'. One piece of music may have melody but no rhythm; another may have rhythm but no melody (e.g., a drum circle); another may have neither in a traditional sense (e.g., the algorithmic drone you mentioned). If you draft a definition requiring melody, you exclude the drone. If you require instrumentation, you exclude the voice or the laptop. There is no essential 'thread' running through all music, only overlapping similarities.

  **2. Context over Content**
  As the composer John Cage demonstrated, the distinction between music and noise is often a matter of framing, not acoustics. A cough is noise in a library but may be part of a score in a performance of *4'33"*. A political chant is speech, but with percussion, it becomes rhythmic. A silent disco is music to the wearer but silence to the passer-by. The physical sound waves may be identical; the difference lies in the *intent* and the *reception*. A legal definition based on the physical properties of the sound will inevitably fail to capture the social context that makes it 'music'.

  **3. The 'Open Concept' of Art**
  Morris Weitz, drawing on Wittgenstein, argued that 'art' is an 'open concept'. To define it strictly is to freeze cultural evolution. New forms (like the sound bath or algorithmic generation) will always emerge to breach the boundaries of old definitions. If the council codifies a definition today, it will be obsolete tomorrow, or worse, it will inadvertently criminalise future forms of legitimate cultural expression.

  ### II. The Legal Strategy: Regulate Impact, Not Ontology

  Since you cannot successfully define *what* the sound is, you must regulate *what the sound does*. In British law, the concept of 'noise' is rarely treated as an aesthetic category; it is treated as a **nuisance**.

  You should counsel the council to shift the regulatory focus from the *nature of the performance* to the *impact on the public realm*. This avoids the trap of acting as an arbiter of artistic merit.

  **1. Abandon the Music/Noise Dichotomy**
  Do not attempt to define 'music' in the ordinance. Instead, regulate 'Amplified Sound' or 'Public Performance'. The permit should not grant permission to play 'music'; it should grant permission to emit sound above a certain threshold in a public space. This renders the edge cases irrelevant. Whether it is a sound bath, a political chant, or a pop song, if it exceeds the decibel limit or occurs outside permitted hours, it is a breach.

  **2. Objective Metrics (The 'How Much' and 'When')**
  Replace subjective criteria with objective metrics.
  *   **Decibel Limits:** Specify maximum dB(A) levels at the property line or a fixed distance from the source.
  *   **Time Restrictions:** Limit performance hours (e.g., 09:00 to 21:00).
  *   **Duration:** Limit the continuous duration of performance to prevent fatigue on the local environment.

  **3. The 'Reasonable Person' Test**
  Incorporate a statutory nuisance standard. Rather than asking 'Is this music?', the enforcement officer should ask: 'Does this sound unreasonably interfere with the use and enjoyment of adjacent properties?' This aligns with the Environmental Protection Act 1990 principles regarding statutory nuisance. It acknowledges that a violin played beautifully at 3:00 am is still a nuisance, while a drum circle at 2:00 pm in a designated busking zone is not.

  **4. Content Neutrality**
  Be wary of criteria that require 'artistic intent' or 'skill'. This invites censorship and places an undue burden on enforcement officers to judge art. A silent disco should be permitted if it does not cause leakage of sound that constitutes a nuisance; a sound bath should be treated the same as a brass band. The medium should not matter; the impact should.

  ### III. Drafting Recommendations

  When presenting this to the council, I suggest the following specific amendments to your drafting approach:

  *   **Delete** any clause attempting to define 'music', 'musical instrument', or 'performance'.
  *   **Insert** a definition of 'Amplified Sound' or 'Projected Audio' based on technical output (e.g., 'any sound projected via a loudspeaker or acoustic enhancement device').
  *   **Clause Example:** *"No person shall operate a sound-emitting device in a public space such that the sound is plainly audible at a distance of [X] metres and exceeds [Y] decibels, save under the authority of a Street Performance Permit."*
  *   **Permit Conditions:** Attach conditions to the permit regarding location, time, and equipment, rather than the genre or style of the content.
  *   **Review Mechanism:** Include a 'sunset clause' or a mandatory review period (e.g., every three years). Acknowledge explicitly that sound technologies and performance practices evolve, and the ordinance must adapt.

  ### IV. Counselling Your Colleagues

  Your colleagues fear that without a tight definition, the ordinance will be too vague to enforce. You must reassure them that **vagueness in definition is preferable to injustice in application**.

  Explain to them that by trying to distinguish a 'sound bath' from 'noise', they are inviting legal challenge on the grounds of arbitrariness. If a busker is fined because their singing bowls do not meet the council's definition of 'music', the council risks a judicial review for acting unreasonably.

  Conversely, if the rule is: *"No sound exceeding 75dB after 9pm,"* the enforcement is objective. It protects the residents from disturbance without empowering the council to decide what counts as art.

  ### Conclusion

  You are correct that the difficulty is deeper than drafting. 'Music' is a cultural practice, not a physical object. To regulate it, the council must regulate the *externalities* of the practice (volume, time, place), not the *essence* of the practice.

  Advise them to write a rule that manages the **environment**, not the **artist**. This is the only way to ensure the ordinance remains robust, legally defensible, and culturally agile.

  Yours sincerely,

