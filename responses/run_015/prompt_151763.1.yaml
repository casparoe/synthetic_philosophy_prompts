  2.  **Deconstruct the Core Philosophical Problem:**
      *   The "Causal Efficacy of Culture" problem.
      *   If values are just epiphenomena of material conditions (Marx), they aren't real causes.
      *   If values are just individual psychology, they don't explain *institutional* change.
