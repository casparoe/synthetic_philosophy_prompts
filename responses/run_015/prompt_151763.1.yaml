      *   **Conclusion:** Reach and defend a specific conclusion about whether culture can be a cause in its own right.
      *   **Constraint 1:** Clearly separate settled scholarship (Weber rejected monocausal idealism/materialism) from contested ground (autonomy of values in selection models).
