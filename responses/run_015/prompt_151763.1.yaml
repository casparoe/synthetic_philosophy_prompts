          *   Introduce Weber's *Protestant Ethic* not as history but as a philosophical test case for cultural causality.
          *   Thesis Statement: While Weber explicitly rejected monocausal explanations, the philosophical viability of culture as an independent cause depends on viewing values not as mechanical pushes but as constitutive constraints on rational action; ultimately, culture functions as a genuine cause when understood as a *selective filter* that stabilizes specific institutional trajectories, provided this does not collapse into mere compatibility.
      *   **Section 1: The Settled Ground (Weber's Methodological Stance):**
          *   Clarify what is *not* contested. Weber was not an idealist denying material reality. He was not a materialist denying ideas.
          *   Concept of "Elective Affinity" (*Wahlverwandtschaft*).
          *   Rejection of the "locomotive" vs. "switchman" false dichotomy (though he used the switchman image, he meant it to show direction, not sole propulsion).
      *   **Section 2: Interpretation A - The Selection Environment (Downward Causation):**
          *   Focus: Values change the fitness landscape.
          *   Mechanism: Asceticism didn't *build* the machine; it made certain behaviors (saving, reinvestment) "fit" while others (consumption) were selected against.
          *   Philosophical implication: Values exert downward causation on institutional development by constraining the range of viable economic actions.
          *   Critique/Contestation: Is this just describing compatibility? Does it grant *autonomy* to the values?
      *   **Section 3: Interpretation B - *Verstehen* and Subjective Motivation:**
          *   Focus: Explanation through understanding meaning.
          *   Mechanism: Explaining *why* actors did what they did, not necessarily predicting the macro outcome alone.
          *   Philosophical implication: Cultural explanation is distinct from naturalistic causal explanation. It complements materialism by filling the "black box" of agency.
          *   Critique/Contestation: Does this reduce culture to psychology? Does it avoid causal claims altogether?
      *   **Section 4: Weighing the Interpretations & Defending a Conclusion:**
          *   Compare A and B. A offers a stronger causal claim but risks functionalism. B offers deeper insight but risks causal weakness.
          *   Synthesis/Defense: Culture is a cause, but not a "force." It is a *constitutive condition of rationality*.
          *   Address the prompt's constraint: Ensure the distinction between "compatibility" and "causal selection" is clear.
          *   Final Verdict: Culture is a cause in its own right because it defines the *teleology* of action, which material conditions alone cannot do.
      *   **Conclusion:**
          *   Restate thesis in light of arguments.
          *   Final thought on the relevance for social science today.

  4.  **Drafting - Section by Section (incorporating specific constraints):**

