      *   *Interpretation A (Selection):* Use terms like "evolutionary analogy," "fitness landscape," "downward causation." Address the critique: Is it just redescription?
      *   *Interpretation B (Verstehen):* Focus on "subjective meaning," "adequacy on the level of meaning." Address the critique: Is it non-causal?
      *   *Synthesis:* I need to argue for a specific view. I will argue that the Selection model is stronger *if* we acknowledge that values define the *parameters of rationality*. Material conditions provide the fuel, but culture provides the steering (to use a cliché, but I'll refine it). Actually, the prompt asks to defend whether culture is a cause *in its own right*. I will argue yes, via the selection mechanism, but with the caveat that it's a *necessary but not sufficient* condition, interacting with material factors.
      *   *Refining the "Contested" aspect:* I must make sure I don't present the "Selection" view as the only true reading. I need to highlight the tension: Does "selection" imply the values existed *before* the selection, or co-evolved? This is the contested part.

  5.  **Review and Refine (Self-Correction during drafting):**
      *   *Check:* Did I summarize the historical narrative? *Correction:* Keep historical details minimal. Focus on the *logic* of the argument (asceticism -> accumulation).
      *   *Check:* Did I treat the "idealist Weber" as consensus? *Correction:* Explicitly label that a caricature in the "Settled Ground" section.
