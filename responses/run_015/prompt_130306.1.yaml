  3.  **Drafting the Decision Procedure (The "Role-Rectification Protocol"):**
      *   *Goal:* Simple, actionable, 90-minute friendly.
      *   *Step 1: Role Mapping.* Need to identify who is wearing what hat. Distinguish Classic (Five Relationships analogues) vs. Interstitial (Gray areas).
