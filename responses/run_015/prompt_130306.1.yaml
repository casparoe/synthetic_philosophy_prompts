      *(Refining the "Stopping Points")*: The mediator cannot decide *love*. The mediator cannot decide *financial viability* (that's for accountants). The mediator facilitates the role alignment.

      *(Refining Case 3)*: Make sure it's clear why the mediator won't *want* to deliver this. It kills the "family feeling."

  8.  **Final Polish:** Check word choice. Ensure "Interstitial Roles" are defined clearly in Step 1. Ensure the "Proximity Rule" is defined. (Proximity = Closeness of relationship. Usually Family > Work, *unless* Work threatens Family survival).

      *Wait, one nuance:* In Confucianism, the Ruler-Subject relationship is often subordinate to Father-Son. But in a *firm*, the Firm is the Ancestor. I need to balance this. The procedure should prioritize the *survival of the vessel* (the firm) because without it, the family roles lose their economic context.
