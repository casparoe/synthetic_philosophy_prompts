answer: |-
  # The Role-Rectification Protocol (RRP)
  **Context:** 90-Minute Governance Mediation Session
  **Purpose:** Resolve collisions between family obligations and corporate duties without relying on abstract legalism or universal moral rules.

  ## Part 1: The Decision Procedure

  ### Step 1: Role Mapping (The "Two Hats" Audit)
  List every party involved in the conflict. For each party, identify their active roles in two columns: **Classic Relational Roles** and **Interstitial/Corporate Roles**.

  *   **Classic Relational Roles:** Map to the five core relationship types (Parent/Child, Elder/Younger Sibling, Spouse/Spouse, Leader/Follower, Peer/Peer).
  *   **Interstitial Roles:** Identify roles that blend authority without formal title (e.g., "Founder's Spouse," "Adopted Executive," "Cousin-Consultant").
  *   **Flagging:** Mark any Interstitial Role where the source of authority is ambiguous (e.g., "Is she speaking as a wife or a board member?").

  ### Step 2: Proximity Priority Rule
  Determine which role holds priority based on relational proximity.
  *   **Default Rule:** Family/Classic Roles take precedence over Corporate/Contractual Roles. (e.g., A father's duty to protect a child's reputation outweighs a manager's desire for efficiency).
  *   **The Exception:** If the Corporate Role involves fiduciary duty to non-family stakeholders (minority shareholders, lenders, non-family employees), the Corporate Role gains equal weight.

  ### Step 3: The Rectification Check (The "Corruption" Filter)
  Before applying the Priority Rule, assess if any party has systematically corrupted the obligations of their primary role.
  *   **The Test:** Has Party A treated Party B in a way that makes it impossible for Party B to fulfill their reciprocal role?
      *   *Example:* A Parent treating a Child solely as a revenue generator corrupts the Parent role.
      *   *Example:* A Leader demanding dishonesty corrupts the Leader role.
  *   **The Consequence:** If a role is corrupted, the obligations associated with that role are **suspended**. Resolution shifts to the next intact role in the hierarchy (usually the Corporate/Contractual role).
  *   **Mediator Note:** This is not about punishment; it is about acknowledging the relationship has already broken.

  ### Step 4: Cross-Domain Conflict & Stopping Points
  If the Rectification Check clears both parties, apply the Proximity Priority Rule. If a conflict remains between Family Obligation and Fiduciary Duty, identify the **Stopping Point**.
  *   **Stop Point A (Legality):** If the family obligation requires illegal action, the procedure terminates. The answer is "No."
  *   **Stop Point B (Viability):** If the family obligation threatens the solvency of the enterprise, the procedure terminates. The answer is "No."
  *   **Stop Point C (Value Judgment):** If the conflict is purely about values (e.g., "Is reputation more important than profit?"), the mediator must not impose an answer. The mediator states the trade-off and requires the family council to vote.

  ### Step 5: Misfire Markers
  The procedure is invalid if:
  1.  **Pathology:** One party exhibits untreated addiction or severe psychological instability.
  2.  **Bad Faith:** One party is using the mediation solely to gather evidence for litigation.
  3.  **Power Imbalance:** One party controls all financial lifelines and cannot be held accountable by the "Rectification Check."

  ---

  ## Part 2: Case Applications

  ### Case 1: The Unqualified Child vs. The Elder Sibling
  **Scenario:** A Founder (Father) wants to appoint his youngest son (unqualified) as COO. The Elder Son (VP, qualified) objects.

  **1. Role Mapping:**
  *   **Founder:** Father (Classic), CEO (Corporate).
  *   **Youngest Son:** Son (Classic), Employee (Corporate).
  *   **Elder Son:** Son (Classic), VP (Corporate), Elder Brother (Classic).
  *   **Interstitial:** The "Successor" label is being forced onto the Youngest Son without merit.

  **2. Proximity Priority:**
  *   Default: Father/Son bond suggests the Father decides.
  *   Exception: Elder Brother/Younger Brother dynamic suggests the Elder deserves respect/precedence.

  **3. Rectification Check:**
  *   **Question:** Is the Founder fulfilling the "Father" role?
  *   **Analysis:** A Father's role includes stewarding the well-being of *all* children. Appointing an unqualified child to a high-risk role endangers the family wealth (harming all children) and sets the Youngest Son up for failure (harming him).
  *   **Finding:** The Founder is corrupting the "Father" role by prioritizing favoritism over stewardship. The "Father" authority is suspended regarding this decision.
  *   **Shift:** Resolution shifts to Corporate Roles (CEO vs. VP).

  **4. Cross-Domain & Stopping Point:**
  *   In Corporate Roles, meritocracy governs. Appointing an unqualified COO violates fiduciary duty (Stop Point B: Viability).
  *   **Resolution:** The appointment is blocked. The Founder must step back from the "Father" justification and accept the "CEO/Board" constraint.

  **5. Outcome:** The Elder Sibling's objection is upheld. The Founder is advised that protecting the Youngest Son means *not* giving him the job.

  ### Case 2: The Non-Family Executive and the Financial Error
  **Scenario:** A Senior Non-Family Executive is pressured by the Founder's Spouse (no formal office) to conceal a family member's financial error. She invokes "Loyalty to the Family."

  **1. Role Mapping:**
  *   **Spouse:** Wife (Classic), Informal Authority (Interstitial).
  *   **Executive:** Employee (Corporate), Subject/Minister (Classic analogue).
  *   **Conflict:** Family Loyalty (invoked by Spouse) vs. Fiduciary Duty (Executive).

  **2. Proximity Priority:**
  *   Default: Family Loyalty usually wins in family firms.
  *   Exception: The Executive is Non-Family. Their primary bond is to the Enterprise, not the Bloodline.

  **3. Rectification Check:**
  *   **Question:** Is the Spouse fulfilling the "Wife/Partner" role?
  *   **Analysis:** The essence of the Partner role is to support the long-term health of the union (Family + Firm). Demanding concealment of financial errors endangers the Firm, which endangers the Family.
  *   **Finding:** The Spouse is corrupting the "Partner" role by prioritizing short-term protection over long-term integrity.
  *   **Shift:** The Executive is released from "Loyalty to the Person" and reverts to "Loyalty to the Office."

  **4. Cross-Domain & Stopping Point:**
  *   **Stop Point A (Legality):** Concealing financial errors may constitute fraud.
  *   **Resolution:** The procedure dictates the Executive cannot comply. The "Loyalty" obligation is void because the request corrupts the relationship.

  **5. Outcome:** The Executive must report the error through proper governance channels. The Spouse is informed that her request violated her role as a steward of the family legacy.

  ### Case 3: The Matriarch and the Secret Debt (The Unwelcome Answer)
  **Scenario:** The Family Matriarch (Board Chair) has secretly leveraged company assets to fund a sibling's rehabilitation and gambling debts. She demands the Board (including her children) ratify the loan retroactively to keep it quiet. She argues that "Family comes first" and exposing this will destroy family harmony.

  **1. Role Mapping:**
  *   **Matriarch:** Mother (Classic), Chair (Corporate).
  *   **Children:** Children (Classic), Directors (Corporate).
  *   **Interstitial:** The "Matriarch" role combines moral authority with corporate governance power.

  **2. Proximity Priority:**
  *   Default: Filial Piety (Children obey/protect Mother).
  *   Exception: Directors have a fiduciary duty to the company and minority shareholders.

  **3. Rectification Check:**
  *   **Question:** Has the Matriarch corrupted the "Mother" role?
  *   **Analysis:** A Mother's role is to secure the future of the children. By jeopardizing the company (the children's inheritance and livelihood) to save one sibling from the consequences of addiction/gambling, she is actively harming the collective future of the other children.
  *   **Finding:** The "Mother" role is corrupted. The obligation of Filial Piety is suspended regarding this specific act.

  **4. Cross-Domain & Stopping Point:**
  *   **Stop Point B (Viability):** The debt threatens company solvency.
  *   **Stop Point C (Value Judgment):** The Mediator identifies a hard trade-off.
      *   *Option A:* Protect Harmony = Ratify loan = Risk Company = Betray Fiduciary Duty.
      *   *Option B:* Protect Integrity = Reject loan = Expose Matriarch = Destroy Harmony.
  *   **Procedure Verdict:** Because the "Mother" role is corrupted, the default priority shifts to Corporate Roles. In Corporate Roles, unauthorized leveraging is a terminable offense.

  **5. Outcome (The Unwelcome Answer):**
  The procedure requires the Board (the children) to **reject the ratification and remove the Matriarch from the Chair.**
  *   **Why the Mediator Won't Want to Deliver This:** This outcome guarantees a family rupture. It frames the children as "firing their mother." It prioritizes the "Vessel" (Company) over the "Spirit" (Family Harmony).
  *   **Mediator Action:** The mediator must present this not as a choice, but as a mechanical consequence of the Role-Rectification Protocol. "Because the Mother role was used to endanger the children's future, the Children role is suspended. You are left only with the Director role. The Director role requires removal."
  *   **Misfire Warning:** If the children refuse, the procedure has misfired due to emotional inability to separate roles. The mediator must withdraw, as governance is no longer possible.

  ---

  ## Part 3: Limitations and Mediator Discretion

  **Where Judgment is Unavoidable:**
  The procedure cannot calculate the "threshold of corruption." The mediator must decide when a Father's favoritism becomes "corruption" of the role versus just "poor management." This requires intuition, not just the checklist.

  **Where the Procedure Misfires:**
  1.  **Total Fusion:** In some families, the Business *is* the Family. Separating the roles is psychologically impossible for the clients. The procedure will feel cold and alienating.
  2.  **Cultural Mismatch:** If the family operates on a strictly legalistic contractual basis with no underlying relational ethic, the "Rectification Check" will seem like moralizing.
  3.  **Crisis Mode:** If the company is insolvent *now*, there is no time for role mapping. Legal triage takes over.

  **Final Instruction:**
  Use this protocol to depersonalize conflict. When a client says, "You are being a bad brother," reframe it using the Protocol: "The Rectification Check suggests the 'Brother' role obligations are currently suspended due to the corporate risk. We are now negotiating as 'Shareholders'." This moves the conflict from character to structure.
