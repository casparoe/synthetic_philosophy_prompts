      *   *The Five Relationships (Wu Lun):* Father-Son, Ruler-Subject, Husband-Wife, Elder-Younger Brother, Friend-Friend.
      *   *Modern Adaptation:* Corporate roles map to these (Founder/CEO ~ Ruler/Father, Employee ~ Subject/Child).
      *   *Rectification of Names (Zhengming):* If a role is not performed correctly, the social order breaks. If a "Father" acts tyrannically, the "Son's" obligation shifts.
