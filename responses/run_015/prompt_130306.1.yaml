      *   *Step 5: Misfire Markers.* When does this tool fail? (e.g., illegal activity, deep pathology).

      *Refining the Logic:*
      *   Confucianism emphasizes hierarchy but also reciprocity.
      *   Priority Rule: In a family firm, the *enterprise* is the ancestor. If the enterprise dies, the family loses the vessel for their relationship. Therefore, Fiduciary duty usually trumps Family preference *unless* the Family role is the only thing keeping the firm alive (rare).
      *   Let's simplify: "The Vessel Principle." The business is the vessel holding the family wealth/legacy. Protect the vessel first.
      *   *Rectification:* If Role A abuses Role B, Role B is released from specific duties to Role A, reverting to baseline professional standards.

  4.  **Developing the Three Cases:**

      *   *Case 1: Unqualified Child (COO) vs. Elder Sibling (VP).*
          *   Roles: Father-Son, Elder-Younger Brother, Boss-Subordinate.
          *   Conflict: Nepotism vs. Merit/Fraternal Respect.
          *   Application: Map roles. Check Rectification (Is the Father treating the Elder Son purely as a subordinate? Is he ignoring the 'Father' duty to care for *all* children's futures?).
          *   Outcome: Likely blocks the appointment based on harm to the "Vessel" (Business) and violation of Fraternal harmony.

      *   *Case 2: Non-Family Exec Concealing Error.*
          *   Roles: Ruler-Subject (Boss-Employee), Friend-Friend (maybe?), Fiduciary.
          *   Conflict: Loyalty to Family vs. Loyalty to Truth/Company.
          *   Application: Non-family has no blood role. Their primary role is "Subject/Minister" which implies honest counsel.
          *   Outcome: Rectification check on the Family Member (corrupting the 'Ruler' role by demanding deceit). Exec is released from "loyalty" to the person, bound to "loyalty" to the office.

      *   *Case 3: Integrity vs. Harmony (The Unwelcome Answer).*
          *   Scenario: A beloved matriarch is embezzling to fund a secret addiction or gambling.
          *   Conflict: Filial piety (hide it) vs. Fiduciary (report it).
          *   Application: Rectification check. Matriarch has corrupted the 'Parent' role (endangering family legacy).
          *   Outcome: Must report/remove. Harmony is destroyed. This is the "hard truth" the mediator must deliver.

  5.  **Refining the Procedure (Self-Correction/Polishing):**
