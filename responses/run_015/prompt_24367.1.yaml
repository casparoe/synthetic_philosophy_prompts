  If the search is *internal*, the hypotheses are tested internally. The "micro-attempts" might be sensory sampling (echolocation, touch) rather than motor trials. If the *motor* action is only executed once successfully, it's L3. If the "micro-attempts" are motor adjustments based on feedback, it's L2.
