  2.  **Initial Brainstorming & Categorization:**
      *   Bounded Rationality isn't a single theory; it's a research program or a stance. So, defining "adequacy" is tricky. It needs to bridge the gap between "perfect rationality" (homo economicus) and "irrationality" (chaos).
      *   *Core constraints:* Computational limits, information costs, time pressure.
      *   *Core behaviors:* Satisficing, heuristic use, systematic biases, adaptation to environment.
      *   *Tensions:* Descriptive (how humans *do* decide) vs. Prescriptive/Normative (how they *should* decide or how to build AI).
      *   *Key Theorists:* Herbert Simon, Daniel Kahneman/Amos Tversky, Gerd Gigerenzer, Christopher Sims, Reinhard Selten.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Computational Tractability.* A theory of BR must acknowledge limits.
          *   *Motivation:* NP-hard problems exist. Humans can't optimize TSP.
          *   *Status:* Non-negotiable.
      *   *Requirement 2: Environmental Structure.* BR isn't just internal limits; it's the fit between mind and world.
          *   *Motivation:* Gigerenzer's "adaptive toolbox." A heuristic isn't biased if the environment supports it.
          *   *Status:* Non-negotiable (for a *complete* theory), though early Simon focused more on limits.
      *   *Requirement 3: Systematic Deviations from Optimization.* It must explain *why* we don't optimize, not just that we don't.
          *   *Motivation:* H&B literature (conjunction fallacy, etc.).
          *   *Status:* Non-negotiable (Descriptive).
      *   *Requirement 4: Normative Guidance.* For a software engineer, the theory must help build *better* tools.
          *   *Motivation:* If BR just says "humans are flawed," it doesn't help design. We need to know when to automate vs. augment.
          *   *Status:* Preference (Engineering focus), but crucial for the user's context.
      *   *Requirement 5: Learning and Adaptation.* BR isn't static.
          *   *Motivation:* People get better with practice; environments change.
          *   *Status:* Non-negotiable (Dynamic systems).
      *   *Requirement 6: Resource Rationality.* Costs of thinking must be modeled.
          *   *Motivation:* Rational Inattention (Sims). Thinking takes energy/time.
          *   *Status:* Non-negotiable (for a formal theory).

  4.  **Identifying Tensions (The "Jointly Unsatisfiable" Question):**
      *   *Descriptive vs. Normative:* A theory that perfectly describes human bias (H&B) might suggest humans are broken. A theory that prescribes optimization (OR) ignores human limits. BR tries to bridge them, but there's a tension: If a heuristic is "ecologically rational" (works well in the wild), it might look "biased" in a lab. Which truth do you serve in software design?
      *   *Generality vs. Specificity:* A universal theory of BR might be too vague to implement. Specific heuristics are implementable but fragile.
      *   *Optimization of Boundedness:* If you model the cost of thinking, aren't you just optimizing a higher-order function? (The "regress problem").

  5.  **Scoring the Approaches:**
      *   *Simon (Satisficing):* Strong on limits, weak on specific heuristics.
