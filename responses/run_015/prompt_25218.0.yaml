answer: |-
  This is a critical architectural question. In software engineering, "bounded rationality" is often used as a hand-waving justification for why a user did something unexpected, or why an algorithm uses a greedy approximation. But as a theoretical foundation for decision-support tools, it requires rigor. If the theory is too loose, your tool will fight the user; if it is too descriptive, it will encode their errors.

  Below are the desiderata for an adequate theory of bounded rationality, categorized by the work they must do. I have flagged each as **Non-Negotiable** (required to distinguish BR from unbounded rationality or pure irrationality) or **Research Preference** (specific to a school of thought, e.g., Simonian vs. Neoclassical).

  Following the list, I analyze the tensions between these requirements and score the major approaches.

  ---

  ### I. The Desiderata of Bounded Rationality

  #### 1. Computational Tractability (The Constraint Requirement)
  *   **Requirement:** The theory must explicitly model the cost of computation (time, memory, energy) as a limiting factor in decision-making, distinct from the cost of information acquisition.
  *   **Motivating Case:** A routing algorithm that finds the perfect Traveling Salesman path is useless if it takes 100 years to run. A human cannot calculate Bayesian posteriors in real-time during a crisis.
  *   **Consistency:** Must align with **Computer Science** (complexity classes, NP-hardness) and **Neuroscience** (metabolic cost of neural firing).
  *   **Status:** **Non-Negotiable.** Without this, you simply have "unbounded rationality with noise."

  #### 2. The Scissors Thesis (The Environmental Fit Requirement)
  *   **Requirement:** The theory must explain behavior as the intersection of two blades: the structure of the task environment and the computational capacity of the agent. It cannot locate "rationality" solely in the head.
  *   **Motivating Case:** A heuristic that looks "biased" in a laboratory setting (e.g., recognizing names to judge city size) may be highly accurate in the real world where name recognition correlates with size.
  *   **Consistency:** Must align with **Ecological Psychology** (affordances) and **Evolutionary Biology** (adaptation).
  *   **Status:** **Non-Negotiable.** This is Herbert Simon's core definition. Ignoring it reduces BR to "defective optimization."

  #### 3. Systematic Deviations (The Phenomenology Requirement)
  *   **Requirement:** The theory must predict *directional* errors, not just random noise. It must explain why deviations from optimality are reproducible across populations.
  *   **Motivating Case:** The **Conjunction Fallacy** (Linda problem). People consistently violate probability axioms in specific ways, not randomly. A theory of BR must explain the mechanism generating this specific error, not just label it "error."
  *   **Consistency:** Must align with **Cognitive Psychology** (Heuristics and Biases literature).
  *   **Status:** **Non-Negotiable.** If the theory cannot account for systematic bias, it is indistinguishable from standard rational choice theory with added error terms.

  #### 4. Satisficing vs. Optimizing (The Stopping Rule Requirement)
  *   **Requirement:** The theory must provide a criterion for *when* search stops that is not "when the global maximum is found."
  *   **Motivating Case:** House hunting. No one finds the perfect house; they find one that meets an aspiration level. The theory must define how that aspiration level is set and adjusted.
  *   **Consistency:** Must align with **Operations Research** (optimal stopping theory) and **Behavioral Economics**.
  *   **Status:** **Non-Negotiable.** This is the primary mechanism distinguishing BR from Optimization.

  #### 5. Resource Rationality (The Meta-Optimization Requirement)
  *   **Requirement:** The theory should explain the allocation of cognitive resources as itself a rational process (e.g., "it is rational to be biased because correcting the bias costs more than the bias loses").
  *   **Motivating Case:** **Rational Inattention** (Sims). Agents choose what *not* to process because processing is costly.
  *   **Consistency:** Must align with **Information Theory** (channel capacity) and **Control Theory**.
  *   **Status:** **Research Preference.** (Specific to the "Rational Inattention" and "Computational Rationality" programs. Simonians argue this risks infinite regress: optimizing the optimization.)

  #### 6. Normative Actionability (The Engineering Requirement)
  *   **Requirement:** The theory must yield prescriptions for system design. It must distinguish between biases that should be *corrected* by the tool and heuristics that should be *supported* by the tool.
  *   **Motivating Case:** A medical diagnosis tool. Should it force the doctor to calculate probabilities (correcting the base-rate fallacy) or should it present data in a frequency format that aligns with the doctor's natural heuristic (ecological support)?
  *   **Consistency:** Must align with **Human-Computer Interaction (HCI)** and **Decision Analysis**.
  *   **Status:** **Research Preference.** (Crucial for you as an engineer, but pure cognitive science theories often omit this.)

  #### 7. Dynamic Adaptation (The Learning Requirement)
  *   **Requirement:** The theory must account for how bounds change over time. Agents learn better heuristics; environments change structure.
  *   **Motivating Case:** Chess masters. They are not "more rational" than novices; they have better indexed retrieval structures. A static theory of BR cannot explain expertise.
  *   **Consistency:** Must align with **Machine Learning** (reinforcement learning) and **Developmental Psychology**.
  *   **Status:** **Non-Negotiable.** A theory of bounds that treats them as fixed hardware constraints is biologically false.

  ---

  ### II. Critical Analysis: Joint Unsatisfiability and Tensions

  You asked if any subset of these desiderata is jointly unsatisfiable. **Yes.** There is a fundamental tension known as the **Regress Problem** and a practical tension known as the **Is-Ought Gap**.

  #### 1. The Regress Problem (Tension between #1 and #5)
  *   **The Conflict:** If you demand **Resource Rationality (#5)** (agents optimally allocate their limited computation) while demanding **Computational Tractability (#1)** (agents cannot solve hard problems), you face a paradox.
  *   **Why:** To optimally allocate cognitive resources, the agent must solve a meta-optimization problem. If the object-level problem was too hard (intractable), why is the meta-level problem tractable?
  *   **Resolution:** Most theories break here.
      *   *Simonians* drop #5: Agents use simple rules to allocate attention, they don't optimize it.
      *   *Rational Inattention theorists* drop strict #1: They assume the meta-problem is solvable or linear-quadratic to make the math work.
      *   *For your tools:* You cannot build a system that expects users to optimally manage their own cognitive load. You must offload the meta-management to the software.

  #### 2. The Is-Ought Gap (Tension between #3 and #6)
  *   **The Conflict:** **Systematic Deviations (#3)** describe how humans *do* fail. **Normative Actionability (#6)** requires knowing how they *should* decide.
  *   **Why:** A theory can be descriptively perfect (predicting all human biases) but prescriptively useless. If your theory says "humans always ignore base rates," do you build a tool that forces base rate calculation (fighting the user) or one that hides probabilities and uses frequencies (accommodating the user)?
  *   **Resolution:** This is not logically unsatisfiable, but it creates a design fork.
      *   *Nudge Approach:* Accept the bias, change the environment (aligns with Ecological Rationality).
      *   *Debiasing Approach:* Train the user or automate the calculation (aligns with Unbounded Rationality ideals).
      *   *For your tools:* You must decide if your tool is a **Prosthetic** (replaces the broken function) or a **Scaffold** (supports the existing function). Most BR theories do not tell you which to choose.

  ---

  ### III. Scorecard of Major Approaches

  Here is how the dominant frameworks score against your desiderata.
  *(Scale: ✅ Strong, ⚠️ Mixed/Partial, ❌ Weak/Ignored)*

  | Approach | 1. Comp. Tractability | 2. Env. Fit (Scissors) | 3. Sys. Deviations | 4. Satisficing | 5. Resource Rationality | 6. Normative Action | 7. Dynamic Adapt. |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
  | **Simon's Satisficing** | ✅ | ✅ | ⚠️ | ✅ | ❌ | ⚠️ | ⚠️ |
  | **Heuristics & Biases (K&T)** | ⚠️ | ❌ | ✅ | ❌ | ❌ | ✅ (Debiasing) | ⚠️ |
  | **Ecological Rationality (Gigerenzer)** | ✅ | ✅ | ⚠️ | ✅ | ❌ | ✅ (Nudging) | ✅ |
  | **Rational Inattention (Sims)** | ✅ | ⚠️ | ⚠️ | ⚠️ | ✅ | ✅ (Info Design) | ❌ |
  | **Computational Rationality (AI/CogSci)** | ✅ | ⚠️ | ✅ | ⚠️ | ✅ | ✅ | ✅ |

  #### Commentary on the Scores:

  *   **Simon's Satisficing:** The gold standard for **Requirements 1, 2, and 4**. However, it is often too vague for engineering implementation (Requirement 6). It describes *that* people satisfice, but rarely specifies *which* stopping rule they use in a specific context.
  *   **Heuristics & Biases (Kahneman/Tversky):** Excellent for **Requirement 3**. It catalogs the bugs. However, it often fails **Requirement 2** (Environmental Fit), treating heuristics as inherent flaws rather than adaptations. For an engineer, this leads to "debiasing" tools that users hate because they fight natural cognition.
  *   **Ecological Rationality (Gigerenzer):** Best for **Requirement 2 and 7**. It respects the environment. However, it can be too relativistic. If a heuristic works in the wild but violates logic, is it "rational"? This makes formal verification (Requirement 6) difficult.
  *   **Rational Inattention (Sims):** Best for **Requirement 5**. It treats information processing as an economic good. However, it often assumes Gaussian environments and linear costs, which fails **Requirement 3** (it doesn't predict psychological biases well, only information filtering).
  *   **Computational Rationality (Modern AI/CogSci):** This is likely your best bet. It treats the brain as a limited computer solving a inference problem. It scores well across the board but is mathematically heavy. It explicitly models the trade-off between utility and computation cost.

  ### Recommendation for Your Work

  If you are building decision-support tools, do not rely on a single theory. Use a **hybrid desiderata set**:

  1.  **Adopt Simon's Scissors (Non-Negotiable):** Assume the error is rarely just in the user; it is in the mismatch between your UI and their cognitive limits.
  2.  **Adopt H&B's Catalog (Non-Negotiable):** Use the list of biases as a test suite. If your tool triggers the conjunction fallacy, redesign it.
  3.  **Adopt Ecological Rationality for Norms (Preference):** Do not try to make users "optimal." Try to make the environment (your tool) support their heuristics. If they use recognition, give them recognizable signals.
  4.  **Reject Strong Resource Rationality (Preference):** Do not expect users to manage their own attention optimally. Your software must manage the attentional budget for them.

  **The Trap to Avoid:** Building a tool that assumes **Unbounded Rationality** for the *algorithm* (perfect optimization) but **Bounded Rationality** for the *user* (they need guardrails). This creates a "centaur" that is unstable. The algorithm should also be boundedly rational (interpretable, fast, satisficing) to match the human partner.
