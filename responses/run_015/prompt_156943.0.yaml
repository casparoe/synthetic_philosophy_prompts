  1.  **Deconstruct the Prompt:**
      *   **Topic:** The "White Horse is Not a Horse" (*Bai Ma Fei Ma*) dialogue by Gongsun Long (School of Names/Mingjia).
      *   **Core Problem:** Standard interpretations collapse into either semantic puzzles (compound terms) or metaphysical claims (universals/kind-identity). Neither seems to capture the *Mingjia* context of *zhengming* (rectification of names).
      *   **Task:** Write an essay adjudicating among three interpretive frameworks:
          1.  Philosophy of Language (Semantic).
          2.  Ontology/Metaphysics (Universals).
          3.  Normative-Entitlement (Pragmatic/Disputational).
      *   **Specific Constraint:** Pay attention to whether the metaphysical interpretation anachronistically imposes categorical distinctions (essentialism) that the School of Names might reject.
      *   **Goal:** Reach a justified conclusion about the best framing and explain its implications for the relationship between *Mingjia* logic and *zhengming*.

  2.  **Initial Brainstorming & Knowledge Retrieval:**
      *   *Gongsun Long:* Warring States period philosopher. Famous for paradoxes. "White Horse is Not Horse."
      *   *The Argument:* "Horse" names the shape. "White" names the color. "White Horse" names color + shape. Therefore, White Horse $\neq$ Horse. Also involves arguments about seeking a horse vs. seeking a white horse.
      *   *Interpretation 1 (Semantic):* Focuses on reference and sense. "Horse" has a broader extension than "White Horse." Intensionally, they differ. It's a logic puzzle about class inclusion.
      *   *Interpretation 2 (Metaphysical):* Focuses on Platonic Forms or Universals. The Universal "White" + Universal "Horse" creates a new Universal "White Horse" which is distinct from the Universal "Horse." This risks importing Western metaphysics (Plato/Aristotle) onto Chinese thought.
      *   *Interpretation 3 (Normative/Pragmatic):* Focuses on *zhengming* (rectification of names). It's about proper usage in social/political contexts. When can I say "no" to "Is this a horse?" If I asked for a white horse, a yellow horse doesn't count. It's about the *rights* to name and the consequences of naming.
      *   *The "Anti-Essentialist" Point:* Chinese philosophy often focuses on process, relation, and function rather than static being/essence. A heavy metaphysical reading might violate this.
      *   *The "Zhengming" Context:* Confucius started *zhengming* (social order). *Mingjia* took it to logical extremes. But was it *just* logic, or logic in service of order?

  3.  **Structuring the Essay:**
      *   **Title:** Needs to be academic and precise.
      *   **Introduction:**
          *   Hook: The enduring puzzle of "White Horse is Not Horse."
          *   Context: Gongsun Long, School of Names (*Mingjia*), Warring States period.
          *   Thesis Statement: While semantic and metaphysical readings offer logical coherence, the normative-entitlement reading best captures the dialectical spirit and socio-political context of the *Mingjia*, avoiding anachronistic essentialism and aligning with the project of *zhengming*.
      *   **Section 1: The Semantic Reading (Philosophy of Language):**
          *   Strengths: Explains the extension/intension distinction (seeking a horse vs. white horse).
          *   Weaknesses: Reduces it to a trivial set-theory puzzle. Misses the philosophical stakes. Why does it matter?
      *   **Section 2: The Metaphysical Reading (Ontology of Universals):**
          *   Strengths: Takes the "is not" seriously. Treats concepts as real entities.
          *   Weaknesses: Anachronistic (Platonic Forms). Contradicts the fluid/correlative cosmology of early China. Risks essentialism which *Mingjia* often deconstructs.
      *   **Section 3: The Normative-Entitlement Reading (Zhengming):**
          *   Strengths: Fits the historical context of disputation (*bian*). Focuses on the *act* of naming and the authority involved. Explains the "seeking" arguments (pragmatic consequences).
          *   Connection to *Zhengming*: Names govern reality/social order. Precision prevents confusion/conflict.
      *   **Synthesis/Adjudication:**
          *   Why Normative wins. It encompasses the semantic distinctions but gives them a *purpose*. It avoids the metaphysical trap.
          *   Address the "Anti-Essentialist" constraint: The *Mingjia* weren't positing static essences but testing the limits of linguistic conventions that hold society together.
      *   **Conclusion:**
          *   Restate thesis.
          *   Implication: *Mingjia* logic isn't abstract play; it's a tool for political/ethical clarity. The "White Horse" is a training ground for the responsibility of naming.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Make sure to define *zhengming* early. It's the anchor.
