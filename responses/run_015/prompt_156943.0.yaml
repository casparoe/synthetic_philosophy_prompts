      *   *Metaphysical:* This is the crucial critique. Need to emphasize that "essence" in the Western sense (substance) doesn't map well to *xing* (form) and *ming* (name) in this context. Gongsun Long separates attributes (white, horse), but are they "Universals"? Maybe, but treating them as ontological primitives misses the point of *why* he separates them.
      *   *Normative:* This needs to be the strongest. Focus on the dialogue form. It's a debate. It's about *winning* or establishing a standard. The "seeking a horse" passage is key—it shows practical consequence. If I ask for a horse, any horse works. If I ask for a white horse, only a white horse works. Therefore, the names function differently in practice. Hence, they are not the same *in use*.
