  ### The Precautionary Diagnostic Tree

  **Instructions:** Answer each question by selecting the option that best matches your judgment on the specific case described. Follow the path to your classification leaf.

  **Q1. (Status Quo Risk)**
  In the **small outdoor field trial of a climate intervention**, if the background rate of climate damage threatens harm comparable to the trial's potential failure, does precaution forbid *both* running the trial and banning it?
  *   **Yes:** Go to **Q2**.
  *   **No:** Go to **Q3**.

  **Q2. (Symmetry)**
  In the **liability insurance** case, if the insurance requirement itself creates a market monopoly that increases systemic risk, must the insurance requirement be paused?
  *   **Yes:** **Leaf 1**
  *   **No:** **Leaf 2**

  **Q3. (Authority)**
  For the **duty to file evaluation results**, is the binding force that the public *has not consented* to the risk, or that the developer lacks *evidence* of safety?
  *   **Public Consent:** **Leaf 3**
  *   **Lacks Evidence:** Go to **Q4**.

  **Q4. (Uncertainty Type)**
  In the **gene-drive release**, is the core objection that we cannot assign *any* probability distribution to ecosystem collapse, or merely that the distribution is *too wide* to trust the mean?
  *   **Any Probability (Knightian):** Go to **Q5**.
  *   **Too Wide (Ambiguity):** Go to **Q6**.

  **Q5. (Information Value)**
  In the **ban on publishing model weights**, does the duty to withhold information hold even if publishing would allow independent safety audits that reduce risk?
  *   **Yes (Withhold):** **Leaf 4**
  *   **No (Allow Audits):** **Leaf 5**

  **Q6. (Reductionism)**
  In the **liability insurance** case, is the rationale simply Expected Utility with high variance aversion, or does it invoke a distinct normative rule beyond calculation?
  *   **Just Expected Utility:** **Leaf 6**
  *   **Distinct Norm:** Go to **Q7**.

  **Q7. (Irreversibility Object)**
  In the **statutory compute pause**, is the primary harm avoided the *physical capability* of the model, or the *institutional lock-in* of the industry structure?
  *   **Physical Capability:** **Leaf 7**
  *   **Institutional Lock-in:** **Leaf 8**

  ***

  #### The Leaves

  **Leaf 1: Symmetric Paralysis**
  *   **View:** The Symmetric Precautionary Principle.
  *   **Awkward Commitment:** You must accept that safety regulations are as dangerous as the technology they regulate, potentially mandating inaction on inaction.

  **Leaf 2: Asymmetric Paralysis**
  *   **View:** The Contentless Critique.
  *   **Awkward Commitment:** You must accept that the principle offers no guidance when inaction is also deadly, rendering it useless in high-stakes climate crises.

  **Leaf 3: Legitimacy & Consent**
  *   **View:** The Political/Legitimacy View.
  *   **Awkward Commitment:** You must accept that a fully consented-to catastrophe is normatively preferable to an unconsented safety improvement.

  **Leaf 4: Strict Maximin (Deontic)**
  *   **View:** The Strict Worst-Case Family.
  *   **Awkward Commitment:** You must accept that preventing the worst case is worth sacrificing all potential gains, even vital safety research generated by transparency.

  **Leaf 5: Maximin with Learning**
  *   **View:** The Epistemic Precautionary View.
  *   **Awkward Commitment:** You must accept that some information gathering is permissible under radical uncertainty, provided it doesn't directly trigger the catastrophic threshold.

  **Leaf 6: Ambiguity Aversion Reductionism**
  *   **View:** The Decision-Theoretic Reduction.
  *   **Awkward Commitment:** You must accept that there is no distinct "precautionary" logic, only risk aversion calibrated to ignorance within standard utility theory.

  **Leaf 7: Rio/Proportionality**
  *   **View:** The Proportionality-and-Comparison View.
  *   **Awkward Commitment:** You must accept that costs and benefits can be commensurated and weighed even when probabilities are widely disputed and models are contested.

  **Leaf 8: Institutional Precaution**
  *   **View:** The Structural/Constitutional View.
  *   **Awkward Commitment:** You must accept that preserving future political flexibility is sometimes more important than preventing immediate physical harm.

  ***

  ### Instructor's Commentary & Epistemic Position

  **1. Empty Cells in the Logical Space**
  Although the tree routes students to viable positions, the seven questions define a logical space containing combinations no one defends.
  *   **Combination A (Incoherent):** *Knightian Uncertainty (Q4) + Reductionism (Q6).* No one argues that we lack *any* probability distribution (Knightian) while simultaneously claiming the decision is reducible to Expected Utility (which requires a distribution). This cell is empty because the definitions contradict.
  *   **Combination B (Unattractive):** *Status Quo Risk = No (Q1) + Symmetry = Yes (Q2).* It is logically possible to believe precaution does not forbid action when the status quo is safe, yet still believe precautionary *measures* must be paused if they carry risk. However, this position is unoccupied because it is strategically unstable: if you aren't paralyzed by the status quo, you generally treat the principle as action-guiding, not self-canceling.

  **2. Indistinguishable Pairs**
  *   **Rio/Proportionality (Leaf 7) vs. Ambiguity Aversion (Leaf 6):** The tree separates these at Q6 (Distinct Norm vs. EU). In practice, these views often converge on the same policy recommendations. A proponent of the Rio Declaration often uses ambiguity-aversion language to justify proportionality. The tree forces a separation on *justification* that many practitioners blur. If a student answers "Distinct Norm" but describes a cost-benefit analysis, they may be misclassified.

  **3. Epistemic Position & Confidence**
  *   **High Confidence:** I am confident in the **Paralysis Split (Q1)** and the **Authority Split (Q3)**. The literature clearly divides between those who see PP as paralyzed by symmetric risk (Sunstein) and those who see it as political (O'Neill/Jasanoff).
  *   **Low Confidence:** I am less confident in the **Irreversibility Object (Q7)**. I map "Institutional Lock-in" to a distinct leaf (Leaf 8), but many Proportionality advocates (Leaf 7) also care about institutional flexibility. An argument showing that *all* outcome-based views necessarily incorporate institutional concerns would make me merge Leaf 7 and Leaf 8.
  *   **Likely Misclassification:** The instrument is most likely to misclassify **Proceduralists who care about outcomes**. A student might answer Q3 (Evals) with "Lacks Evidence" (routing to Substantive) because they view the burden of proof as the best *way* to ensure safety, not because they reject consent. They would end up in Leaf 4–8 when they belong in Leaf 3. The tree assumes a sharp divide between "consent" and "evidence" that may not exist in hybrid democratic-epistemic views.
