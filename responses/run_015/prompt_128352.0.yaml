  # Joint Statement on the Holocaust, Modernity, and Comparability

  **Preamble**

  We, the undersigned representatives of the Singularity-Ethics camp and the Modernity-Comparability camp, having engaged in rigorous adversarial collaboration, submit this document. We acknowledge that our divergence arises not from a dispute over the basic historical record, but from differing interpretations of the moral and structural significance of that record. We agree that responsible scholarship requires precision regarding where our consensus ends and our contention begins.

  ### 1. Agreed Claims

  1.  **Historical Record:** Both camps affirm the historical fact that the Holocaust involved the state-sponsored, systematic persecution and murder of approximately six million Jews and millions of other victims by the Nazi regime and its collaborators between 1933 and 1945.
  2.  **Bureaucratic Properties:** Both camps agree that the execution of the Holocaust relied upon modern bureaucratic mechanisms, including the division of moral labour, written administration, and the technological distancing of perpetrators from the act of killing.
  3.  **Explanatory Requirements:** Both camps maintain that any adequate explanation of the Holocaust must account for the intersection of specific ideological intent (anti-Semitic eliminatism) and structural capacity (industrial and administrative modernity).
  4.  **Limits of Analogy:** Both camps acknowledge that analogical reasoning possesses inherent limits; it risks either obscuring the specific intent of the Holocaust or obscuring the reproducible structural dangers of modernity, depending on how the comparison is framed.
  5.  **Moral Gravity:** Both camps affirm that the Holocaust represents a catastrophic moral failure of civilisation that demands rigorous remembrance and ethical vigilance against recurrence.

  ### 2. Disagreements Table

  | Point of divergence | Singularity-Ethics wording (accepted by that camp) | Modernity-Comparability wording (accepted by that camp) | Classification (factual / normative / semantic) |
  | :--- | :--- | :--- | :--- |
  | **Status of Uniqueness** | The Holocaust is ontologically unique; the fusion of ideology and method creates a break in history that categorisation cannot contain. | The Holocaust is typologically comparable; it is a distinct instance of a broader class of modern genocidal events produced by civilisational structures. | Normative / Semantic |
  | **Role of Anti-Semitism** | Anti-Semitic ideology was the constitutive driver; without this specific hatred, the bureaucratic machinery would not have been directed toward total extermination. | Anti-Semitic ideology was the specific content filling a structural vessel; the bureaucratic machinery itself creates the capacity for extermination regardless of specific ideological content. | Factual / Normative |
  | **Function of Comparison** | Comparison necessarily dilutes the moral particularity of the Holocaust and risks equating distinct historical moral universes. | Comparison clarifies the structural danger by revealing how modern rationality can be weaponised in various contexts, aiding prevention. | Normative |
  | **Reproducibility** | The specific conditions of the Holocaust are not reproducible; it was a historical accident of specific German and European conditions. | The conditions of the Holocaust are reproducible; instrumental rationality and bureaucratic distancing are enduring features of modern civilisation. | Factual / Normative |

  ### 3. The Cruxes

  To move beyond stalemate, we identify three sub-questions. Resolving these empirically or conceptually would necessitate a shift in position for at least one camp.

  **Crux 1: Ontological Property vs Ethical Stance**
  *   **Question:** Is 'uniqueness' an ontological property of the event itself, or an ethical stance governing remembrance?
  *   **Test Case:** The Wannsee Conference protocols compared to administrative minutes from the planning of the Rwandan Genocide.
  *   **Singularity-Ethics Prediction:** The Wannsee protocols will reveal a specific ideological commitment to biological elimination rooted in European anti-Semitism that is absent in the Rwandan case, proving ontological distinction.
  *   **Modernity-Comparability Prediction:** The administrative formality, euphemistic language, and division of labour in both documents will be structurally identical, proving that the 'modernity' of the violence is the comparable ontological feature.

  **Crux 2: Sufficiency vs Necessity of Bureaucratic Rationality**
  *   **Question:** Is modern bureaucratic rationality sufficient for large-scale genocide, or merely necessary alongside specific ideology?
  *   **Test Case:** The Herero and Nama genocide (1904–1908) in German South-West Africa.
  *   **Singularity-Ethics Prediction:** This case will show bureaucratic violence without the totalising, industrialised eliminatory intent of the Holocaust, proving bureaucracy is necessary but not sufficient for Holocaust-level uniqueness.
  *   **Modernity-Comparability Prediction:** This case will show the early prototype of modern genocide, proving that bureaucratic rationality combined with colonial racism is sufficient to produce comparable exterminatory outcomes without the specific anti-Semitism of the 1940s.

  **Crux 3: Clarification vs Dilution via Comparison**
  *   **Question:** Does comparison clarify structural danger or necessarily dilute moral particularity?
  *   **Test Case:** The drafting history of the United Nations Genocide Convention (1948) and the exclusion of political groups.
  *   **Singularity-Ethics Prediction:** The debate will show that broadening the definition to include other groups dilutes the specific legal and moral recognition owed to the Jewish victims of the Nazi regime.
  *   **Modernity-Comparability Prediction:** The debate will show that restricting the definition to specific groups blinds international law to the reproducible structural mechanisms that threaten any group within a modern state.

  ### 4. Identification of Verbal Dispute

  A portion of this dispute is identified as purely verbal. Specifically, the contention over the term 'unique' often masks agreement on the underlying facts. When the Singularity-Ethics camp uses 'unique', they often mean 'ethically paramount and historically specific'. When the Modernity-Comparability camp uses 'comparable', they often mean 'structurally intelligible and reproducible'. Both camps agree the Holocaust was historically specific and ethically paramount, and both agree it shares structural features with other events. The disagreement dissolves partially when 'uniqueness' is defined not as 'having no similarities to anything else' (which neither camp claims) but as 'possessing a specific moral weight that resists standard categorisation'.

