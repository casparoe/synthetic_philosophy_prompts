prompt: |-
  hi, i'm in my philosphy of mind moduel and we're doing dennett's idea that the self is just a centre of narrative gravity — not a little soul inside, more like a useful fiction that holds a story together. i want you to analyse the billy milligan trial from 1978 through this lens. you know the basic story: he was charged with rape and robbery in ohio, and the defence claimed he had about two dozen alters, each with its own personality, so 'he' wasnt really responsible.

  map it carefully. treat each alter as a competing sub-narrative with its own local centre of gravity, and the legal person as the overarching narrative the court either had to accept or collapse back into one defendant. then bring in dennett's heterophenomenological method — treating all those first-person reports from the alters as texts to be interpreted, not direct access to separate minds — and ask whether that stance actually helps the defence or undermines it. where does narrative gravity explain why the jury eventually folded everything into a single accountable agent, and where does the model break down? does the case prove that legal responsibility needs one centre of gravity, or does it just show that dennett's view cant deal with real-world fragmentation?

  write this in continuous prose only — no headings, bullet points, bold text or tables, just like an email. dont include any citations or reading lists, i just want the argument itself. sorry if there's a typo or two, i'm writing this quickly between lectures.
