  **Brainstorming & Logic Check**

  As a poet, I need the pantoum's recursive form to do the philosophical heavy lifting; the way lines return with new contexts mirrors the logical equivalence of "All ravens are black" and "All non-black things are non-ravens." The two anchor lines should be **"Nine shadows on the shingle, nothing more"** (the hypothesis) and **"The ledger closed, the island counted out"** (the closed system). As a philosopher of science, I've sanity-checked the twist: in an infinite world, a non-black non-raven offers negligible confirmation. But in Ailsa's finite universe (the island), once the ledger is complete, the set of "non-black things" is exhaustively defined. If the final object (the crate's content) is non-black and non-raven, the set of non-black things contains zero ravens. Therefore, all ravens (the nine shadows) must be black. The poem must convey that the *completion* of the list gives the stone its weight, without turning into a lecture. The double confirmation (that the stone also supports "All ravens are white") needs to be present but subtle—a hint that the color doesn't matter, only the exclusion.

  ***

  **Sgeir Mhòr**

  Her hand upon the crate, the lamp turned low,
  Nine shadows on the shingle, nothing more.
  Forty years of index cards in rows,
  The ledger closed, the island counted out.

  Nine shadows on the shingle, nothing more.
  The uncle's note said wait until the end.
  The ledger closed, the island counted out.
  Now one last object waits to be a friend.

  The uncle's note said wait until the end.
  A thing not black, and not a bird in flight.
  Now one last object waits to be a friend.
  It proves the rule by standing in the light.

  A thing not black, and not a bird in flight.
  If every other thing is checked and known,
  It proves the rule by standing in the light.
  The weight of it is heavier than stone.

  If every other thing is checked and known,
  It speaks for black, though white would serve the test.
  The weight of it is heavier than stone.
  The world shrinks down to what we hold as true.

  It speaks for black, though white would serve the test.
  Forty years of index cards in rows.
  The world shrinks down to what we hold as true.
  Her hand upon the crate, the lamp turned low.

  ***

  **Revision Notes**

  In drafting, I initially made the logical equivalence too explicit ("It confirms the hypothesis"), which felt like a lecture; I changed this to "It speaks for black, though white would serve the test" to keep the ambiguity of relief versus confirmation while still signaling the double-confirmation problem to those looking for it. I also tightened the rhythm in the fourth stanza to ensure the "finite set" condition ("If every other thing is checked and known") landed with enough stress to justify the twist that the evidence isn't infinitesimal.
