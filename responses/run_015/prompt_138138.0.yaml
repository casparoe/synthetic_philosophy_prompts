  The idea in plain words
  Participants should come away feeling the tension between security and potential without being told it exists. They will experience a visceral pull toward a guaranteed sum in one context and a risky jackpot in another, only to discover later that the mathematical difference between the two contexts was invisible. The activity aims to surface the hidden weight of regret and the psychological value of a guaranteed floor. By the end, they should feel the discomfort of having chosen inconsistently, not because they calculated wrong, but because the "nothing" outcome felt heavier when it meant missing out on a sure thing versus missing out on a gamble. They will leave questioning whether their gut or the arithmetic should drive the choice.

  Setup, materials and stakes
  You need 14 slips of paper per person, pens, and a whiteboard. Have five $10 bookshop vouchers ready. Tell the group: "We will do five choice rounds. One round will be picked at random at the end. If your choice wins in that round, you get a voucher." If too many win the selected round, draw names until vouchers run out. Write probabilities clearly (e.g., "100%"). Ensure amounts are multiples of 10 for easy mental math. Arrange seating so everyone can see the board. Have a box for collecting slips. Emphasize anonymity on slips to prevent peer influence. Keep the mood light; this is an experiment, not a test. Remind them constantly that only one round counts for money, so they should treat every choice as if it were the real one.

  The rounds, as I would read them
  "Round 1: Choice One. On your slip, write A or B. Look at the board. Option A: 100% chance of $10. Option B: 10% chance $50, 89% chance $10, 1% chance $0. Think: Is the extra chance at $50 worth the risk of getting nothing? Write your choice. Fold the slip."

  "Round 2: Choice Two. Board: Option A: 50% chance $10. Option B: 100% chance $4. Simple trade-off. Write A or B. Fold."

  "Round 3: Choice Three. You are choosing for the person on your left. Write their name and A or B. Board: Option A: 11% chance $10, 89% $0. Option B: 10% chance $50, 90% $0. Does responsibility change your risk? Write and fold."

  "Round 4: Choice Four. Board: Gamble: 50% chance $20. Don't choose A or B. Write the smallest sure dollar amount you would accept to walk away from this gamble. Be honest. If you write $5, you'd take $5 instead of playing. Fold."

  "Round 5: Choice Five. Board: Option A: 11% chance $10, 89% $0. Option B: 10% chance $50, 90% $0. Note: The 'nothing' probability differs by 1% compared to Option A. Does that tiny gap matter? Write A or B. Fold."

  "Pause ten seconds between rounds. Collect slips after each. Remind them: Only one round counts for money. Ensure they understand 100% means sure. If anyone asks about expected value, tell them to follow their gut."

  Timeline
  0-10: Intro & Rules. Explain stakes, anonymity, one round payout. Distribute slips.
  10-60: Five Rounds. 10 minutes each including thinking, writing, collecting. Keep pace brisk.
  60-70: Break & Tally. Shuffle slips, pick round, resolve outcomes. Prepare vouchers.
  70-90: Debrief. Reveal pattern, discuss inconsistencies, hand out vouchers. Allow Q&A.
  Ensure you keep time strictly; 90 minutes passes quickly with 14 people discussing. If a round drags, cut the discussion short and promise answers at the end. The break is crucial for you to organize the data before speaking.

  Debrief
  Start by revealing Round 1 and 3 were linked. Ask who picked A in Round 1 and B in Round 3. Show this is mathematically inconsistent if you ignore the common 89% branch. This is the collision point.
  To test your hypothesis (Regret/Comparison): Look at Round 3 (Delegate). If they picked safer for others than for themselves, it suggests personal regret drives the safe choice in Round 1. They spare themselves the comparison.
  To test Rival 1 (Risk/Floor): Use Round 4 (Bids). If bids are low (e.g., $5), they value the floor highly regardless of structure. This supports simple risk aversion.
  To test Rival 2 (Trust): Use Round 5 (Near-Miss). If choices flip when the 1% 'nothing' shifts, they are sensitive to probability precision, not just structure. They may distrust the 'clean' numbers.
  Conclude: Logic says choices should match; feelings say context matters. Neither is fully 'wrong', but they conflict. You have shown the conflict; now they must decide which master to serve.

  What will go wrong
  Participants will try to calculate expected value explicitly and get stuck on percentages. Remind them to go with gut.
  Someone will spot the Allais pattern early. If so, acknowledge it but ask them to keep choosing honestly.
  Bids in Round 4 might be wild ($1000). Cap them at $20 verbally.
  Delegate round might cause confusion on whose name to write. Clarify immediately.
  If the random round selection gives everyone $0 (lose gamble), morale dips. Have a backup 'consolation' voucher ready.
  People may feel cheated if the "real" round yields nothing. Emphasize that the *process* was the point, not the voucher.
  If the whiteboard math is unclear, people will disengage. Write large and clear.
  Be prepared to simplify fractions if someone struggles with 89%. Call it "almost 90%".

  What the activity cannot show
  This activity shows descriptive inconsistency (what we do), not normative error (what we should do). It cannot prove that maximizing expected value is the only rational goal. You must supply the philosophical argument that consistency is a virtue of rationality, whereas avoiding regret is a virtue of emotional well-being. The math shows the conflict; you must explain why we care about the conflict. It cannot resolve whether the axiom or the intuition is correct; it only proves they disagree.
