answer: |-
  You are describing a position that is well-known in moral philosophy, though it rarely gets a single catchy name. You are not a utilitarian, but you are not a strict non-aggregationist (like Taurek) either. You are what is often called a **Moderate Aggregationist with Lexical Priorities**.

  Your intuitions align most closely with the work of **Frances Kamm** (specifically her *Principle of Permissibility* and distinctions about aggregation) and **T.M. Scanlon** (Contractualism), but with a heavy dose of **Risk Aversion** and **Threshold Deontology**.

  Here is a breakdown of the principle that best fits your verdicts, the tensions you will have to resolve, and how that principle handles your unsettled cases.

  ### The Principle: Weighted Claims with Lexical Thresholds

  Your intuitions suggest a multi-step decision procedure rather than a single formula. It looks something like this:

  1.  **Lexical Priority of Severity:** Compare the worst outcome for any single individual in each group. If one group faces a *qualitatively* worse harm (e.g., Death vs. Lost Hand, or Torture vs. Pinprick), you must save that individual regardless of the numbers in the other group. (This handles cases 4 and 5).
  2.  **Relevant Claims:** If the harms are of the same *kind* (e.g., Death vs. Death), every person has a claim to be saved. These claims aggregate. (This handles case 1).
  3.  **The Margin of Significance:** Aggregation is not linear. A small difference in the number of claims does not create a moral obligation to override the presumption of equality. There is a "zone of discretion" where the numbers are close enough that a lottery is permissible. (This handles case 2).
  4.  **Intra-Personal Aggregation:** Harms aggregated within a single life count for more than the same harms distributed across many lives, because the burden is concentrated. (This handles case 5 vs. 6).
  5.  **Modifiers:** Claim strength is modified by Special Obligations (Kin/Self) and Responsibility (Innocence/Desert). (This handles cases 3 and 9).
  6.  **Certainty Preference:** A certain rescue carries a weight that probabilistic rescue does not match until the probability is very high. (This handles case 7).

  ### Where This Principle Clashes With Your Verdicts

  To make this systematic, you will have to tighten up two areas where your gut is currently vague.

  **1. The "Zone of Discretion" (Case 2)**
  Your view that 100 vs. 96 is a coin flip is the hardest to systematize. Most Moderate Aggregationists would say 100 > 96 creates an obligation, even if a weak one.
  *   **The Conflict:** If you insist 100 vs. 96 is a wash, you need a *threshold*. Is it 10%? 50%? If you save 5 vs. 1, but flip for 100 vs. 96, where is the line? 50 vs. 40?
  *   **The Cost:** To be consistent, you must either admit that 100 vs. 96 *does* obligate you to save the 100 (giving up the coin flip intuition) OR you must accept that your principle contains an arbitrary "vagueness" zone where morality runs out. The latter is philosophically defensible (it's called *vagueness in moral obligations*), but it feels unsatisfying.

  **2. Concentration vs. Distribution (Case 5 vs. 6)**
  You say 1M pinpricks to one person (Torture) beats 1 pinprick to 1M people (Case 5). But 5 injuries to one person is a "wash" against 1 injury to 5 people (Case 6).
  *   **The Conflict:** Why does aggregating pinpricks into torture change the moral math, but aggregating injuries doesn't?
  *   **The Fix:** You need to commit to the idea that **severity is non-linear.** 1M pinpricks is not just "more pain" than 1 pinprick; it crosses a threshold into a different *category* of harm (Torture). In Case 6, 5 injuries is likely just "more pain" than 1 injury, not a different category.
  *   **The Cost:** You must accept that 5 injuries to one person is *not* lexically worse than 1 injury to five people. If you decide 5 injuries *is* torturous compared to 1, your principle forces you to save the one person in Case 6. If you stick with your "wash" verdict, you must accept that moderate aggregation across lives is permissible.

  ### Predictions for Your Unsettled Cases

  Here is how the **Weighted Claims with Lexical Thresholds** principle predicts you should answer the three new cases you proposed.

  #### Case A: The Probabilistic One
  *Scenario:* Save one person for sure OR give a different single person a 20% chance of being saved (otherwise they die).
  *   **Analysis:** This tests your Risk Aversion (Case 7). In Case 7, you preferred 1 certain life over 3.06 expected lives (51% of 6). Here, the expected value is 0.2 lives.
  *   **Prediction:** **Save the certain one.**
  *   **Reasoning:** Your threshold for trading certainty for probability is high (above 51%, perhaps near 99%). A 20% chance is too weak to override the claim of the person who can be definitely saved. The "certain claim" lexically outweighs the "probabilistic claim" at this level.

  #### Case B: The Scarce Drug (Quality/Quantity)
  *Scenario:* Five people get 6 months of life each OR One person gets 10 years of life. (Total life years: 2.5 vs 10).
  *   **Analysis:** This tests your Lexical Priority (Case 4) vs. Aggregation (Case 1). Is 10 years *lexically* worse to lose than 6 months?
  *   **Prediction:** **Save the Five.**
  *   **Reasoning:** Unless 6 months is enough to complete a "life narrative" (e.g., see a child born) and 10 years is not, the harm is likely in the same *category* (Loss of Future). It is not Death vs. Hand. Therefore, you aggregate claims.
  *   **Nuance:** Even if you weight the claims by duration (10 years is a stronger claim than 6 months), Moderate Aggregation usually holds that numbers can outweigh significant individual differences unless the difference is catastrophic. Five people losing their near future outweighs one person losing a medium-term future. You would likely need the one person to get *decades* or a *lifetime* to override the five, and even then, it's debatable. Your intuition in (4) (Death trumps Hand) suggests you only override numbers when the *type* of harm changes, not just the duration.

  #### Case C: You Are The One
  *Scenario:* You die OR Five strangers die.
  *   **Analysis:** This tests Special Obligations (Case 3).
  *   **Prediction:** **Save Yourself.**
  *   **Reasoning:** In Case 3, you said saving your kid is permissible/required over five strangers. The obligation to self is generally considered stronger than the obligation to kin in most non-utilitarian frameworks (Agent-Centered Prerogative).
  *   **Reasoning:** Utilitarianism demands you die. Your framework allows for **Partiality**. You are permitted to weight your own claim significantly higher than a stranger's. However, unlike the kid case, you might feel more "guilt" (as per Case 1), but the verdict remains: you are not required to sacrifice yourself for the greater number.

  ### Summary of the "Cleaner Principle"

  If you want to write this down to show your flatmate, try this formulation:

  > **The Principle of Disproportionate Burden:**
  > We ought to save the greater number of people, *unless*:
  > 1.  **Severity:** One group faces a qualitatively worse harm (Death > Injury > Pain), in which case we save the group facing the worse harm regardless of numbers.
  > 2.  **Concentration:** Aggregating harm onto one person creates a disproportionate burden (Torture) that outweighs distributed minor harms.
  > 3.  **Partiality:** We have special obligations to specific individuals (Self, Kin) that strengthen their claims beyond the numerical weight of strangers.
  > 4.  **Significance:** When harms are equal, small numerical differences do not create an obligation; a lottery is permissible within a "zone of indifference."

  **What you lose:** You lose the comfort of a single calculator (Utilitarianism) and the comfort of pure equality (Taurek). You have to accept that morality has "fuzzy edges" (Case 2) and that you are permitted to be partial (Case 3).

  **What you gain:** A system that respects the "separateness of persons" (why 1M pinpricks on one person matters more than 1M pinpricks spread out) while still acknowledging that numbers *do* matter when the stakes are truly equal. It validates your irritation with Taurek without forcing you to become a utilitarian.
