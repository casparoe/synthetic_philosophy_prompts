      *   *Check:* Did I address the Safe Harbor liability aspect enough? *Correction:* Emphasize that Safe Harbor reduces the employer's risk, which is a *quid pro quo* for auto-enrollment. This challenges the "welfare of the chooser" purity.
      *   *Check:* Is the "One Sentence Test" analysis deep enough? *Correction:* Connect it to "Reason-Giving" obligations in administrative law. It's not just ethics; it's governance.

