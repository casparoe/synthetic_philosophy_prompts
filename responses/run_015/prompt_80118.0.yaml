prompt: |-
  I'm preparing a paper on the demandingness objection, and I want a thought experiment built to a precise specification. The scenario should present an agent who complies perfectly with every demand of a demanding moral theory — a Singer-style view on which you are required to redirect nearly all of your discretionary income to the most effective causes — and who is nevertheless not admirable as a moral saint, with the explanation of the non-admirability being not the standard objection that saints sacrifice their personal projects and make poor friends, but a distinct supererogation point. For background: Driver's moral-saints argument holds that a person who does everything morality requires is not fully admirable, and therefore morality cannot actually require what the saint does; I want you to press on a different seam — not that the saint gives up personal projects, but that the saint never does anything above duty. Because a fully demanding theory leaves little or no room for acts that go beyond the call of duty, an agent who does exactly what is required does only the moral minimum, and the moral minimum becomes a ceiling on moral performance rather than a floor; perfect compliance is thus the least admirable kind of moral life, even though it is the only kind the theory allows.

  Constraints: the case must be set in an ordinary context (a workplace, a family, or a small community), fit in a single paragraph, and the agent's non-admirability must not come from the agent doing anything wrong, from the agent's selfishness, or from any cost to the agent's own flourishing; it must fall out of the structure of the demanding theory itself. After the scenario, walk through what the demanding theory says the agent ought to do and why, what a Driver-style saint critique says, and why the supererogation point — rather than the personal-project point — is doing the work. Then say what happens if the theory is revised to admit a zone of supererogation, so that some acts are genuinely good but not required, and how a defender of demanding theories would attack the case on the grounds that the supererogation objection is either incoherent or trivial.
reasoning: |-
  Here's a thinking process that leads to the suggested thought experiment and analysis:

  1.  **Analyze the Request:**
      *   **Topic:** The demandingness objection to consequentialist/utilitarian moral theories (specifically Singer-style).
      *   **Goal:** Create a thought experiment where an agent complies *perfectly* with the demanding theory but is *not admirable*.
      *   **Specific Constraint 1 (The Twist):** The lack of admirability must *not* be the standard "moral saint" objection (i.e., sacrificing personal projects, being a bore, bad friend). It must be based on the *absence of supererogation*. The agent does only the minimum because the theory makes everything required the minimum. Perfect compliance = moral ceiling.
      *   **Specific Constraint 2 (Context):** Ordinary context (workplace, family, small community).
      *   **Specific Constraint 3 (Length):** Single paragraph for the scenario.
      *   **Specific Constraint 4 (Agent's Status):** Agent does nothing wrong, isn't selfish, suffers no loss of flourishing. The flaw is structural to the theory.
      *   **Follow-up:** Walkthrough of the theory's requirements, Driver's critique vs. this supererogation critique, revision with supererogation, and a demandingness defender's counter-attack.

  2.  **Drafting the Thought Experiment (Iterative Process):**
      *   *Attempt 1:* John gives all his money to charity. He works hard. But he never gives extra. People think he's just doing his job. (Too vague, doesn't capture the "ceiling" aspect well).
      *   *Attempt 2:* Sarah works at a non-profit. She gives 100% of her surplus income. She never takes a break. But she never does anything "nice" that isn't calculated for utility. (This leans too close to the "no personal projects/robotic" objection).
      *   *Attempt 3 (Focusing on the Supererogation Gap):* I need a situation where an act *looks* like it should be "above and beyond," but under the theory, it's just "required." So, if the agent does it, they are just meeting the baseline. If they *can't* do more than the baseline, they can't be heroic.
      *   *Refining for the "Ceiling" Effect:* The agent needs to be in a position where they maximize good constantly. Because the theory demands maximization, *every* optimal act is obligatory. Therefore, there is no room to be "generous" or "heroic" because generosity implies giving more than owed.
      *   *Setting:* A small community fund or workplace allocation. Let's go with a community disaster relief coordinator.
      *   *Drafting the Paragraph:* Elias manages the neighborhood emergency fund. Under his moral theory, every dollar must go where it saves the most lives. He calculates perfectly. He donates his own salary entirely. He never keeps a cent for leisure. He is perfectly compliant. But when the town thanks him, calling him a hero, he corrects them: "I did what was required." Because the theory demands the maximum, he could not have done more. He is morally perfect, yet morally flat. There is no distinction between his baseline duty and moral excellence. He is a compliant machine, not a virtuous agent.
      *   *Checking Constraints:* Ordinary context? Yes (neighborhood fund). Single paragraph? Yes. No selfishness/wrongdoing? Yes. No loss of flourishing? (Need to ensure this is clear—he finds satisfaction in compliance, or at least isn't miserable). The key is the *structural* lack of supererogation.

      *   *Polishing the Paragraph:* Make sure the "non-admirability" stems from the lack of room to exceed duty, not from being cold.
      *   *Revised Draft:* Elias coordinates the district's disaster relief, adhering to a moral code requiring every resource to maximize global welfare. He directs all surplus funds to the most effective charities and works overtime whenever it produces marginal utility, never retaining income for leisure or personal hobbies. When neighbors praise his generosity, he corrects them, noting that keeping any resource for less effective uses would be immoral, so his actions are merely obligatory. Because his theory mandates the optimal outcome in every instance, there is no logical space for him to act benevolently beyond duty; every good deed is a tick-box requirement. Consequently, while Elias is blameless and effective, he lacks moral distinction, appearing not as a virtuous hero but as a compliant functionary whose moral ceiling is indistinguishable from his moral floor.

  3.  **Drafting the Analysis:**
      *   **Theory's View:** Singer-style utilitarianism. Marginal utility principle. If you can prevent something bad without sacrificing anything of comparable moral significance, you must. Elias does this. He is morally perfect.
      *   **Driver-Style Critique:** Julia Driver argues moral saints are unattractive because they lack non-moral virtues (humor, hobbies). *Correction:* I need to distinguish my point from Driver's. Driver says saints are unadmirable because they are *too* moral at the expense of other goods. My point is they are unadmirable because the *concept* of moral excellence vanishes when everything is required.
      *   **Supererogation Point:** The core argument is that admirability requires the possibility of *not* doing the act (freedom) or doing *more* than required (excess). If the theory consumes all discretionary action, "duty" swallows "goodness." Elias isn't admirable because he couldn't have done otherwise (in a normative sense), or rather, he never had the chance to be *more* than compliant.
      *   **Revision (Admitting Supererogation):** If the theory says "Give 90%," then giving 100% is supererogatory. Elias could then be admirable for giving 100%. This restores the floor/ceiling distinction.
      *   **Defender's Counter-Attack:** Why would a demandingness defender reject this?
          1.  *Incoherence:* If an act is good, why isn't it required? (The "Why stop there?" argument).
          2.  *Triviality:* Calling it "supererogatory" is just semantic window-dressing to make us feel better about not doing enough. It doesn't change the moral reality, just the labeling.
          3.  *Admirability redefined:* Maybe admirability isn't the point; rightness is.

  4.  **Refining the Output:**
      *   Ensure the distinction between Driver and the Supererogation point is sharp. Driver = "Saints are boring/one-dimensional." Supererogation Objection = "Saints are merely compliant; excellence is impossible."
      *   Ensure the "flourishing" constraint is met. Elias isn't miserable; he's just structurally capped.
      *   Check the paragraph constraint strictly.

  5.  **Final Review against constraints:**
      *   Single paragraph scenario? Yes.
      *   Ordinary context? Yes (district relief/neighborhood).
      *   No selfishness/wrongdoing? Yes.
      *   No loss of flourishing? (Implicitly, he is compliant and effective, not described as miserable).
      *   Explanation of theory? Yes.
      *   Driver vs. Supererogation? Yes.
      *   Revision & Counter-attack? Yes.

      *(Self-Correction during drafting the analysis)*: I need to be careful not to accidentally slip into the "personal projects" objection when explaining why Elias isn't admirable. I must emphasize that even if he *liked* his work, the *structure* of praise fails. The issue is the *concept* of moral merit, not the *psychology* of the agent.

      *(Refining the Defender's Counter)*: The defender might argue that "admirability" is a separate aesthetic/social category from "moral rightness." Just because he isn't a "hero" doesn't mean he isn't morally perfect. The objection conflates social praise with moral truth.

  6.  **Final Polish:** Check tone and clarity. Ensure the "ceiling vs. floor" metaphor is clear.

      *(Final check on the paragraph)*: "Elias coordinates..." looks good. It fits the constraints.

      *(Final check on the analysis)*: Make sure to explicitly state why Driver's view is different. Driver: Saints lack non-moral virtues. This view: Saints lack the *opportunity* for moral excess.

      *(Final check on the Defender)*: The "Incoherence or Triviality" prompt requirement needs to be addressed directly.

      Let's assemble.
answer: |-
  Elias coordinates his district's disaster relief fund, adhering to a moral code requiring every resource to maximize global welfare. He directs all surplus funds to the most effective charities and works overtime whenever it produces marginal utility, never retaining income for leisure or personal hobbies. When neighbors praise his generosity, he corrects them, noting that keeping any resource for less effective uses would be immoral, so his actions are merely obligatory. Because his theory mandates the optimal outcome in every instance, there is no logical space for him to act benevolently beyond duty; every good deed is a tick-box requirement. Consequently, while Elias is blameless and effective, he lacks moral distinction, appearing not as a virtuous hero but as a compliant functionary whose moral ceiling is indistinguishable from his moral floor.

  **Analysis of the Case**

  **The Demanding Theory's View:**
  Under a Singer-style principle of marginal utility, Elias is morally perfect. The theory posits that if an agent can prevent something bad without sacrificing anything of comparable moral significance, they are obligated to do so. Since Elias has redirected nearly all discretionary income and time to the most effective causes, he has met every obligation. The theory cannot criticize him; indeed, it cannot conceive of him doing *more* than he already does, because "more" would imply he was previously withholding resources that could have saved lives, which would have been impermissible. Elias is the ideal agent.

  **Driver vs. The Supererogation Objection:**
  Julia Driver's "moral saints" argument suggests that a life devoted entirely to moral ends is unadmirable because it crowds out non-moral virtues (like humor, artistic pursuit, or deep friendship), rendering the agent one-dimensional. My scenario bypasses this. We need not assume Elias is boring or lacks friends; we assume only that his moral theory leaves no room for *moral* excess. The lack of admirability here stems from the collapse of the distinction between the "moral minimum" and "moral excellence." If every optimal act is required, compliance is merely the baseline. Admirability typically attaches to acts that exceed expectations (supererogation). By eliminating the category of the supererogatory, the theory eliminates the possibility of moral heroism. Elias is not unadmirable because he lacks hobbies (Driver's point); he is unadmirable because he is structurally incapable of being morally generous, as generosity implies giving what is not owed.

  **Revising the Theory:**
  If the theory is revised to admit a zone of supererogation—for example, by setting the obligation at 50% of income rather than the marginal utility limit—Elias could choose to give 80%. In this revised framework, the 50% is the floor (duty), and the extra 30% is the ceiling (supererogatory). Elias becomes admirable not because he is compliant, but because he exceeds compliance. The moral landscape is restored: there is a difference between being a good citizen and being a saint.

  **The Defender's Counter-Attack:**
  A defender of the demanding theory would attack this objection on two fronts. First, they might argue the objection is **incoherent**: if an act (giving the extra 30%) is genuinely good and costs the agent less than the moral significance of the lives saved, why is it not required? To call it "supererogatory" is to admit it is good but optional, which contradicts the core consequentialist axiom that one must always produce the best available outcome. Second, they might argue the objection is **trivial**: it conflates social praise ("admirability") with moral truth ("rightness"). The defender would claim that Elias *should* be admired precisely because he does what is right, and if our intuition says he isn't admirable, that is a flaw in our psychology, not the theory. We should revise our concept of admirability to fit the moral truth, not revise the moral truth to fit our desire for heroes.
