      *   **The Ethical Conflict:** Aggregation of subthreshold harms (42k tiny harms) vs. Concentrated identifiable harms (800 households). One side says tiny harms don't add up (Torture vs. Dust Specks); the other says ignoring them makes structural wrongs invisible.
      *   **Specific Constraint 1:** Recommend one concrete course (Approve w/ conditions, Reject, or Approve w/ sunset & mitigation). Include a timeline.
