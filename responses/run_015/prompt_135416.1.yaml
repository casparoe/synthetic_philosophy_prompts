      *   *Refinement:* Actually, looking at the trade-off: 800 households with *heavy-metal exposure* (likely from old lamps breaking/disposal or industrial correlation) vs. 42k with *sleep fragmentation*. Heavy metal is usually more acute/dangerous than sleep fragmentation. However, the prompt frames the 42k harm as the ethical puzzle. Let's lean into the "Moral Granularity" idea to justify a conditional approval. If we treat the *policy* as the unit of harm, we need to monitor the policy's effect.
