  # JOINT STATEMENT ON THE METAPHYSICS OF LAWS
  **Signed by:** The Humean Collaborator & The Anti-Humean Collaborator
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Ontological Status of Laws of Nature

  ## 1. Agreed Claims

  1.  **Existence of the Mosaic:** Both parties agree that there exists a spatiotemporal distribution of local qualitative facts (the "mosaic"). This mosaic constitutes the empirical data of science.
  2.  **Existence of Lawlike Regularities:** Both parties agree that not all regularities in the mosaic are equal. There is a distinction between accidental generalizations (e.g., "all gold spheres are less than 1km in diameter") and lawlike regularities (e.g., "all charged particles obey Maxwell's equations").
  3.  **Scientific Practice:** Both parties agree that standard scientific practice treats laws as explanatory primitives that support counterfactual reasoning and inductive inference. Neither party seeks to abolish laws from scientific discourse.
  4.  **Connection Thesis:** Both parties agree that there is a systematic connection between the laws of nature and the mosaic of particular facts. They disagree only on the *direction* and *nature* of this connection.
  5.  **Scope of Dispute:** Both parties agree that this dispute is metaphysical, not scientific. It is not a dispute about what the laws *are* (e.g., Newtonian vs. Quantum), but about what it *means* for something to be a law.
  6.  **Non-Skepticism:** Neither party is a skeptic about laws. Both affirm that there are true propositions deserving the name "laws of nature."
  7.  **Counterfactual Support:** Both parties agree that laws support counterfactuals (e.g., "If this match had been struck, it would have lit") in a way accidental generalizations do not. They disagree on the metaphysical ground of this support.

  ## 2. Disagreements and Cruxes Analysis

  | Issue / Crux | Humean Position (Best System Account) | Anti-Humean Position (Necessitarian/Primitivist) | Case / Argument Bearing on Crux | Humean Conclusion on Case | Anti-Humean Conclusion on Case | Diagnostic Flag (Genuine vs. Verbal) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Ontological Status** | Laws are nothing over and above the mosaic. They are descriptive summaries. | Laws are ontologically distinct from the mosaic. They are prescriptive constraints. | **The Empty Universe:** Consider a universe with no particles, only spacetime. Are there laws there? | **No.** Without a mosaic, there is nothing to summarize. Laws vanish. | **Yes.** Laws could exist as potentialities or governing structures even without instances. | **Genuine.** Disagreement on supervenience base. |
  | **2. Direction of Grounding** | The particular facts ground the laws. The laws are true *because* the facts are as they are. | The laws ground the particular facts. The facts are as they are *because* the laws govern them. | **The Single Instance:** A universe with only one particle accelerating once. Is there a law of acceleration? | **No/Weak.** A single fact cannot establish a regularity sufficient for a "system." | **Yes.** The law of motion explains why the particle accelerated as it did, even once. | **Genuine.** Disagreement on metaphysical priority. |
  | **3. BSA Status (Reduction vs. Circle)** | The "Best System" is a substantive reductive account. Simplicity and strength are non-nomic virtues that select laws from the mosaic. | The "Best System" is a circular redescription. "Simplicity" and "Strength" presuppose nomic notions or merely pragmatic interests. | **The Alien System:** An axiomatization that is simpler than ours but uses predicates not projectible by humans. Is it a law? | **Yes.** If it best summarizes the mosaic objectively, it is the law, regardless of human cognition. | **No.** If it lacks nomic necessity or governance, it is just a pattern, not a law. | **Mixed.** Verbal on "law" definition; Genuine on objectivity of simplicity. |
  | **4. Explanation & Asymmetry** | Explanation is unification. Laws explain instances by subsuming them under the best system. Asymmetry arises from informational structure. | Explanation is production. Laws explain instances by producing or necessitating them. Asymmetry arises from causal power. | **Barometer vs. Storm:** The barometer falls; the storm arrives. Both are regular. Why does the barometer not explain the storm? | **Systematicity.** The law linking pressure to storm is in the best system; the reverse inference is not optimally simple. | **Causal Power.** The atmospheric pressure produces the storm; the barometer reading is merely a symptom. | **Genuine.** Disagreement on the nature of explanation (unification vs. production). |
  | **5. Counterfactuals** | Counterfactuals are true if they hold in the possible worlds where the Best System remains fixed. | Counterfactuals are true if they hold in worlds where the Governing Laws remain fixed. | **Law Breaking:** Could the laws have been different? (e.g., gravity being inverse-cube). | **Yes.** Different mosaics would yield different best systems. Laws are contingent on the mosaic. | **No/Restricted.** Laws are necessary (or metaphysically robust); a world with different laws is a different kind of reality. | **Genuine.** Disagreement on modal force. |

  ## 3. Methodological Postscript: Assumptions and Dependencies

  This document depends on several critical assumptions established during our collaboration. If these were dropped, the agreement would dissolve or shift significantly.

  1.  **Charitable Reconstruction:** We have assumed that both Humeanism and Anti-Humeanism are formulated in their strongest, most coherent versions (e.g., assuming a sophisticated Best System Account for the Humean, and a non-mystical Governing Account for the Anti-Humean).
      *   *If dropped:* The document would devolve into a critique of strawmen (e.g., Humeanism as naive regularity theory; Anti-Humeanism as occult powers).
  2.  **Choice of Cruxes:** We selected grounding, reduction, and explanation as the primary loci of disagreement. We intentionally sidelined epistemological worries (how we *know* laws) to focus on metaphysics.
      *   *If dropped:* Including epistemology might reveal greater convergence (both agree on scientific methodology) or greater divergence (skepticism about accessing "governance").
  3.  **Shared Vocabulary:** We agreed to use terms like "mosaic," "grounding," and "law" with specific technical definitions outlined in Section 1.
      *   *If dropped:* Much of the "Genuine" disagreement might collapse into verbal dispute (e.g., if "law" simply means "regularity" for one and "necessary connection" for the other without acknowledgement).
  4.  **Classical Metaphysical Framework:** The document assumes a framework where "grounding" and "supervenience" are meaningful relations.
      *   *If dropped:* In a framework rejecting metaphysical grounding (e.g., strict positivism or certain pragmatist views), the "Direction of Grounding" crux would be meaningless, rendering the document incoherent.
