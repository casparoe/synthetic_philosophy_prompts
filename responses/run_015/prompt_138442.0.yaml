prompt: |-
  Hey — I'm a reporter, I cover science and ideas now but I spent about six years on the labor beat before they moved me, so I know my way around a mediation room: BATNAs, the zone of possible agreement, the mediator shutteling between caucus rooms to get each side to shave something off it's maximum demand, strike deadlines, pattern settlements that the next local in line will copy, ability-to-pay arguments, and the fact that whatever you land on has to survive a ratification vote. I'm working on a piece about what happens when software agents negociate with each other on people's behalf, and everyone I interview tells me the serious thinking about this is in the axiomatic bargaining literature, which I cannot read. So: take the old Nash solution and the Kalai-Smorodinsky alternative that was built to fix it, and translate that whole dispute as faithfully as you can into the vocabulary I just listed. What is the feasible set in a room with a mediator in it? Is the disagreement point the BATNA, or is it what happens when the clock runs out and both sides are worse off than any deal — and does the theory care which, given that my sources spend most of their working lives trying to move it? What does Nash's independence-of-irrelevant-alternatives amount to when I'd put it as "a demand the other side could never have gotten anyway shouldn't change what you settle on"? And what is Kalai-Smorodinsky's monotonicity axiom really demanding, if my gloss is "if the company's best conceivable outcome just got better, the union's settlement ought to get better too, even though nothing actually on the table changed"? Also please state plainly what each solution picks — I've been told one of them is basically "both sides give up the same fraction of their maximum demand," and I want to know whether that's right or whether I've flattened something.

  Then the part I actually need, which is the residue report: tell me what does not survive the translation. My own hunches, which I fully expect to be half wrong: (a) my whole vocabulary quietly assumes a common measuring stick — dollars, percentages, headcount — and I'm told the theory is built so that you can rescale each side's utility separately without changing the answer, which if true makes "split the difference" and "each side concedes proportionally" completely different claims and makes at least one of them inadmissible; (b) "the company can afford it" and "the members will never ratify that" are doing real work in every negotiation I've covered, and I can't find the slot for either in a model that apparently only has a feasible set and a disagreement point; (c) we can't offer two parties a coin flip between two contracts, which I suspect is what lets them assume the feasible set is convex, so something important may be riding on an assumption that's just false on my beat. Also, separately, people keep claiming that automated agents land on equal-proportional-concession outcomes rather than the Nash one, and I'd like to know whether that's even a meaningful thing to say or whether I'm projecting a mediator's intuition onto a machine. Tell me which of these are genuine residue, which are just me misunderstanding the model, and — this is the bit I care about most — give me the mismatches I haven't thought of, especially anything my vocabulary lets me say that theirs can't, or anything they say that turns out to be empty once it's in my language. I'd much rather hear "that distinction of theirs has no counterpart for you" than get a tidy translation that quietly changed the subject.
