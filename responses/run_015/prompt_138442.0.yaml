  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Experienced labor reporter (6 years on the beat), now covers science/ideas. Knows practical negotiation terminology (BATNA, ZOPA, caucus, ratification, pattern settlements, ability-to-pay).
      *   **Task:** Translate axiomatic bargaining theory (Nash Bargaining Solution vs. Kalai-Smorodinsky Solution) into labor negotiation vocabulary.
      *   **Specific Questions to Answer:**
          *   What is the feasible set in a mediation room?
          *   Is the disagreement point the BATNA or the post-strike reality? Does theory care?
          *   Translate Nash's Independence of Irrelevant Alternatives (IIA).
          *   Translate Kalai-Smorodinsky's Monotonicity axiom.
          *   Clarify what each solution picks (is it "equal fractional concession"?).
          *   **The "Residue Report":** Identify what *doesn't* survive translation.
          *   **Evaluate User's Hunches:** (a) Common measuring stick vs. utility rescaling, (b) Ability-to-pay/ratification constraints, (c) Convexity/lotteries.
          *   **Agent Question:** Do automated agents actually aim for equal-proportional-concession?
          *   **Crucial Requirement:** Highlight mismatches the user *hasn't* thought of (things their vocabulary can say that theory can't, and vice versa). Avoid tidy translations that change the subject.

  2.  **Deconstruct the Theory (Mental Sandbox):**
      *   *Nash Bargaining Solution (NBS):* Maximizes the product of gains over disagreement. $(u_1 - d_1)(u_2 - d_2)$. Key axiom: IIA.
      *   *Kalai-Smorodinsky (KS):* Maximizes equal proportional gain relative to the ideal point. Key axiom: Monotonicity (replaces IIA).
      *   *Feasible Set ($S$):* All possible utility pairs achievable by agreement. Usually assumed convex.
      *   *Disagreement Point ($d$):* Utility if no deal.
      *   *Ideal Point:* The best each player could get *within the feasible set* (utopia point).
      *   *Utility:* Ordinal, invariant to affine transformations (scaling/shifting). This is critical for the "common measuring stick" hunch.

  3.  **Drafting the Translation (Labor Beat $\leftrightarrow$ Axiomatic Theory):**

      *   *Feasible Set:* In the room, it's the ZOPA (Zone of Possible Agreement), but technically broader. It's every deal the mediator knows *could* be signed and ratified.
      *   *Disagreement Point:* It's the BATNA *value*, not just the option. If strike happens, that's the utility of the strike. Theory treats $d$ as fixed, but in labor, $d$ is dynamic (strike funds run out, public opinion shifts).
      *   *Nash IIA:* "If you take away a deal the union was never going to get anyway, the final deal shouldn't change."
      *   *KS Monotonicity:* "If the company's ceiling gets raised (maybe profits soar), the union's share shouldn't drop, even if the union's ceiling didn't change."
      *   *The Solutions:*
          *   Nash: Equalizes *marginal* rates of substitution? No, simpler: It balances the *percentage gain from the disagreement point* relative to the slope of the frontier. It's often *not* equal fractional concession of the *ideal* point.
          *   KS: *Is* equal fractional concession of the *ideal* point. (User's hunch is right for KS, wrong for Nash).

  4.  **Addressing the "Residue Report" (The Mismatches):**

      *   *Hunch (a) Utility Scaling:* User is right. Theory uses utility (ordinal), labor uses dollars (cardinal). "Split the difference" in dollars is meaningless in Nash theory unless utility is linear in dollars. This is a huge mismatch.
      *   *Hunch (b) Constraints:* "Ability to pay" shapes the feasible set. "Ratification" shapes the feasible set (some deals aren't feasible if members vote no). Theory assumes these are baked into $S$. But in reality, these are *process* constraints, not just geometric ones.
      *   *Hunch (c) Convexity/Lotteries:* User is spot on. Convexity implies lotteries are allowed (50% chance of Contract A, 50% of Contract B). Labor contracts are deterministic. This is a major theoretical assumption that fails in practice.
      *   *Agent Question:* Automated agents often optimize for specific utility functions. If they are programmed to be "fair" in a KS sense, they do equal proportional concession. If they optimize Nash, they don't. But often, "equal concession" is a heuristic, not an axiomatic outcome.

      *   *New Mismatches (The "Gold"):*
          *   *Time:* Theory is static (one shot). Labor is dynamic (deadlines, extensions, fatigue).
          *   *Information:* Theory assumes common knowledge of $S$ and $d$. Labor is all about hiding $S$ and bluffing $d$.
          *   *Principals/Agents:* Theory assumes two players. Labor has Union Leadership $\to$ Members and Management $\to$ Shareholders/Board. Ratification is a second game.
          *   *Relationship:* Theory is transactional. Labor is relational (you have to work together tomorrow).

  5.  **Refining the Tone:**
      *   Respect the user's expertise. Don't talk down.
      *   Use their vocabulary (caucus, ratification, pattern settlements).
      *   Be precise about the math without showing the math.
      *   Be honest about where the theory breaks.

  6.  **Step-by-Step Construction of the Response:**

      *   **Introduction:** Acknowledge the expertise. Validate the difficulty of the translation.
      *   **Part 1: The Translation:**
          *   Feasible Set = The ZOPA + Ratification constraint.
          *   Disagreement Point = The *value* of the strike/lockout (BATNA utility), not just the event.
          *   Nash IIA = "Ghost demands don't matter."
          *   KS Monotonicity = "Expanding the pie helps everyone."
          *   The Solutions: Clarify Nash vs. KS on "fractional concession." (Nash = product maximization, KS = proportional gain to ideal).
      *   **Part 2: The Residue Report (Evaluating Hunches):**
          *   (a) Utility vs. Dollars: Confirm this is the biggest gap. "Split the difference" is theoretically empty without knowing utility curves.
          *   (b) Constraints: Confirm they are baked into the Feasible Set, but theory ignores *why* they are there (politics).
          *   (c) Convexity: Confirm lotteries are the secret sauce of convexity and they don't exist in labor contracts.
      *   **Part 3: The Agent Question:**
          *   Clarify that agents optimize objective functions. "Equal concession" is a specific design choice (KS-like), not a default law of nature.
      *   **Part 4: The Unthought Mismatches (Crucial):**
          *   *Common Knowledge:* Theory assumes everyone knows the map. Labor is poker.
          *   *Time:* Theory is timeless. Labor is about the clock.
          *   *The Principal Problem:* Theory assumes the negotiator *is* the player. Labor negotiators are agents for constituents.
          *   *Relationship:* Theory is one-off. Labor is repeated game (contract expires in 3 years).

  7.  **Review against Constraints:**
      *   Did I answer the specific questions about IIA and Monotonicity? Yes.
      *   Did I address the "equal fractional concession" claim? Yes (It's KS, not Nash).
      *   Did I provide the residue report? Yes.
      *   Did I find mismatches the user didn't think of? Yes (Information asymmetry, Time, Principal-Agent).
      *   Is the tone appropriate? Professional, peer-to-peer.

  8.  **Self-Correction/Nuance Check:**
      *   *Correction on Nash:* Nash doesn't necessarily mean "equal concession." It depends on the curvature of the frontier. If the frontier is linear, Nash is the midpoint (equal gain). If curved, it shifts. KS forces the line to the ideal point. I need to be careful not to say Nash *never* looks like equal concession, but it's not the *definition*.
      *   *Correction on BATNA:* In theory, $d$ is the utility of no deal. In labor, BATNA is often "walk away." But the *value* of walking away is what matters. I need to distinguish the *action* from the *utility*.
      *   *Convexity:* Make sure to explain *why* convexity requires lotteries (mixing two points creates a third point in the middle). If lotteries aren't allowed, the set might be non-convex, breaking the existence/uniqueness proofs.

  9.  **Final Polish:** Ensure the distinction between "dollars" (cardinal) and "utility" (ordinal/transformable) is clear, as that's the core of hunch (a). Ensure the "Residue" section feels like a reporter's notebook, not a textbook.

  *(Self-Correction during drafting)*: Wait, I need to be careful about the "equal fractional concession" claim.
  *   KS: Yes, equal distance from disagreement to ideal, proportionally. $(u_1 - d_1) / (max_1 - d_1) = (u_2 - d_2) / (max_2 - d_2)$.
  *   Nash: Maximizes $(u_1 - d_1) * (u_2 - d_2)$. This is *not* generally equal proportional concession unless the frontier is symmetric/linear.
  *   So the user's source told them one of them is equal fractional concession. That is KS. I need to confirm that.

  Okay, ready to write.
answer: |-
  This is a sharp brief. You've identified the exact friction points where the rubber of game theory meets the road of labor relations. The axiomatic literature is notoriously hermetic because it treats negotiation as a geometry problem, whereas you know it's a political and psychological one.

  Here is the translation of the Nash vs. Kalai-Smorodinsky dispute into your vocabulary, followed by the residue report you asked for.

  ### Part 1: The Translation

  **The Feasible Set**
  In the literature, the *feasible set* is the shape drawn on the graph containing every possible outcome both sides could agree to.
  *   **In your room:** This is the **Zone of Possible Agreement (ZOPA)**, but with a critical caveat. It includes only the deals that survive **ratification**. If a deal is on the table but the membership will vote it down, it is *not* in the feasible set. It also includes the "ability-to-pay" constraint; if the company literally goes bankrupt at a certain wage number, that number is outside the set.
  *   **The Mediator's View:** The mediator's job is to map this set. The theory assumes the set is known. In your room, the mediator is trying to discover the boundaries of the set by shuttling between caucuses.

  **The Disagreement Point**
  *   **In the literature:** The *disagreement point* ($d$) is the utility value each side receives if negotiations terminate without agreement.
  *   **In your room:** This is the **value of the BATNA**, not the BATNA itself. It is not "the strike." It is the *economic and political cost* of the strike to both sides.
  *   **Does theory care if it's BATNA vs. Clock Running Out?** No. The theory only cares about the *payoff* at the end of the tunnel. Whether you get there because the clock ran out, the union voted to strike, or the company locked you out, the theory treats it as the same coordinate ($d$). However, your sources try to move it because in reality, $d$ is dynamic. Strike funds deplete (union $d$ gets worse); public opinion sours (company $d$ gets worse). The theory treats $d$ as a fixed anchor; you know it's a drifting buoy.

  **Nash's Independence of Irrelevant Alternatives (IIA)**
  *   **The Axiom:** If you remove options from the feasible set that were *not* chosen, the solution shouldn't change.
  *   **Your Translation:** "Ghost demands don't matter." If the union initially demanded a 10% raise (which the company would never pay) and later drops it to 5%, that initial 10% demand shouldn't change the final settlement on the 5%. The settlement should depend only on the deals actually on the table, not on the maximum demands that were never feasible.
  *   **The Catch:** Nash assumes that removing a "ghost demand" doesn't change the *shape* of the remaining feasible set in a way that alters the bargaining power.

  **Kalai-Smorodinsky's Monotonicity**
  *   **The Axiom:** If the feasible set expands in a way that makes one player's maximum possible gain higher (without lowering the other's), that player should not end up worse off.
  *   **Your Translation:** "If the pie gets bigger, nobody should get less." Specifically, if the company's profits soar (raising the company's best conceivable outcome) while the union's best conceivable outcome stays the same, the union's final settlement should not *decrease*. In fact, KS implies the union's settlement should increase to maintain the same *proportion* of their maximum possible gain.
  *   **Why KS was built:** Nash violates this. Under Nash, if the company's ceiling gets raised, the solution can actually shift *against* the union depending on the curvature of the frontier. KS says that's unfair.

  **What Each Solution Picks**
  *   **Your Hunch:** "Both sides give up the same fraction of their maximum demand."
  *   **The Verdict:** That is **Kalai-Smorodinsky**, not Nash.
      *   **Kalai-Smorodinsky** picks the point where both sides achieve the same *percentage* of their maximum possible gain (from the disagreement point to their ideal point). If the union can get at most \$5 more and the company can save at most \$10, KS finds a deal where, say, both get 60% of their maximum possible gain.
      *   **Nash** picks the point that maximizes the *product* of the gains. $(Union Gain) \times (Company Gain)$. This often looks like "splitting the difference" only if the bargaining frontier is a straight line and the sides are symmetric. If the frontier is curved (diminishing returns), Nash shifts the settlement toward the side that values the marginal dollar less.

  ---

  ### Part 2: The Residue Report

  You asked what does not survive the translation. Your hunches are largely correct, but there are deeper mismatches.

  **Evaluating Your Hunches**

  *   **(a) The Common Measuring Stick (Utility vs. Dollars):** **Genuine Residue.** This is the biggest break. Axiomatic theory is built on *von Neumann-Morgenstern utility*, which is invariant to scaling. If I measure your payoff in dollars, and you measure yours in "happiness points," the theory still works.
      *   **Why it matters:** "Split the difference" in dollars is theoretically meaningless. If the union values \$1M differently than the company values \$1M (due to risk aversion or marginal utility), splitting the dollar difference is not "fair" in the Nash sense. The theory assumes we can't compare dollars across people. Your vocabulary assumes we can. When an agent says "equal concession," if they mean dollars, they are violating the invariance principle of the theory.
  *   **(b) Ability-to-Pay and Ratification:** **Partial Residue.** In the model, these are baked into the *Feasible Set*. If the members won't ratify, that deal isn't in the set. If the company can't pay, it isn't in the set.
      *   **The Mismatch:** The theory treats the Feasible Set as a *geometric fact*. In your room, these are *political claims*. "We can't afford it" is a bargaining move, not necessarily a boundary. The theory has no slot for "bluffing about the boundary."
  *   **(c) Convexity and Coin Flips:** **Genuine Residue.** You are absolutely right. For the Feasible Set to be convex (a smooth shape without dents), the theory implicitly allows **lotteries**. (e.g., "50% chance of Contract A, 50% chance of Contract B").
      *   **The Mismatch:** Labor contracts are deterministic. You don't flip a coin to decide wages. Without lotteries, the set might be non-convex. If the set is non-convex, the Nash solution might not be unique, or might not exist. The theory assumes away the rigidity of the actual contract language.

  **The Mismatches You Haven't Thought Of**

  Here is where the theory becomes empty in your language, and where your language sees things the theory is blind to.

  **1. Common Knowledge vs. Information Asymmetry**
  *   **Theory:** Assumes **Common Knowledge**. Both sides know the Feasible Set. Both sides know the Disagreement Point. Both sides know the other side knows this.
  *   **Your Room:** The entire mediation is about **hiding** the Feasible Set and **bluffing** the Disagreement Point. The union doesn't know the company's true ability-to-pay; the company doesn't know the union's true strike vote threshold.
  *   **The Residue:** The axiomatic solutions tell you where to land *if you already know everything*. They offer zero guidance on how to get there when you don't. An automated agent using Nash assumes it knows your utility function. If it doesn't, the "solution" is garbage.

  **2. Time and Deadlines**
  *   **Theory:** Static. It is a "one-shot" game. The solution is instantaneous.
  *   **Your Room:** Dynamic. **Strike deadlines** and **contract expiration dates** create pressure that changes the Disagreement Point ($d$) over time.
  *   **The Residue:** The theory cannot model the *tactic* of letting the clock run out to worsen the other side's BATNA. In Nash bargaining, $d$ is fixed. In your beat, $d$ is a weapon.

  **3. The Principal-Agent Problem (Ratification)**
  *   **Theory:** Two players. The people at the table *are* the players.
  *   **Your Room:** Four players minimum. Union Leadership $\to$ Membership. Management Negotiators $\to$ Board/Shareholders.
  *   **The Residue:** The "Feasible Set" for the negotiators is smaller than the "Feasible Set" for the principals. Negotiators often settle for a deal *worse* than the theoretical optimum because they need to protect their relationship with their own side (e.g., a union leader won't take a deal that looks like a sellout, even if it's economically optimal). The theory has no variable for "looking weak to your constituents."

  **4. Repeated Games vs. One-Off**
  *   **Theory:** Single interaction.
  *   **Your Room:** **Pattern Settlements.** You mentioned this. This contract sets the pattern for the next local, and the next contract in three years.
  *   **The Residue:** Axiomatic bargaining ignores reputation. In your room, conceding too quickly today might make you look weak in the next round. The theory optimizes for *this* deal; you are optimizing for *the relationship*.

  ### Part 3: The Automated Agents Question

  > *People keep claiming that automated agents land on equal-proportional-concession outcomes rather than the Nash one... I'd like to know whether that's even a meaningful thing to say.*

  It is meaningful, but it is a **design choice**, not a law of nature.

  If you program an agent to maximize the Nash product, it will not necessarily produce equal proportional concessions (unless the problem is symmetric). If you program it to follow the Kalai-Smorodinsky path, it will produce equal proportional concessions.

  However, many automated negotiation systems (especially in e-commerce or simple resource allocation) use **heuristics** that *approximate* Kalai-Smorodinsky because it is computationally easier to calculate the "ideal point" and split the difference proportionally than to solve the calculus required for the Nash frontier maximization.

  **The Trap:** If your sources are seeing agents do "equal proportional concession," they are likely seeing agents programmed with a **fairness heuristic** that matches KS, *or* they are seeing agents operating in a domain where dollars map linearly to utility (making Nash and KS look similar).

  **The Warning:** If you deploy a Nash-optimizing agent against a human union negotiator, the agent will assume the human's utility function is known. It will make offers that are mathematically optimal but politically toxic (e.g., offering a high wage with a total removal of grievance procedures, because the math says the "value" is the same). The human will walk away. The agent will record this as "Disagreement Point reached." The model will have failed because it couldn't model the *politics* of the ratification vote.

  ### Summary for your Piece

  The axiomatic literature describes a negotiation between two omniscient gods who know exactly how much the deal is worth to each other, care only about this single transaction, and can sign a contract based on a coin flip.

  Your beat covers two teams of agents who are guessing at the value, playing for a reputation that extends years into the future, constrained by constituents who hold veto power, and forbidden from using lotteries.

  The "residue" isn't just noise; it's the entire job of the mediator. The theory solves the geometry; the mediator solves the politics. When your sources say the "serious thinking" is in the axioms, they are right about the *logic* of fairness, but they are wrong about the *mechanics* of agreement. The mismatch is not a bug in your vocabulary; it's a bug in the model.
