      My dearest Elara,

      The envelope arrived this morning with the rest of the bills, thick cream paper stamped with the federal seal, and I sat at the kitchen table for an hour before I even opened it because I knew what was inside. It is the decennial call-up notice, the one that asks me to choose between returning to the reserves for six weeks or remitting the exemption levy. You know the levy, the sum that is calculated based on income and directed partly toward the professional rapid response brigades and partly into the municipal welfare fund. It is a significant amount, enough to renovate the roof or fund your university tuition, but not enough to ruin me. Many of my colleagues pay it without a second thought. They view it as a sensible transaction, a way to optimize their time while ensuring the state remains secure and the social safety net is reinforced. They argue that their taxes build the schools and the hospitals, and that hiring professionals to handle defense is simply a matter of specialization, much like hiring a plumber to fix the pipes rather than learning the trade themselves.

      I look out the window at the street and I see the peace we have inherited, the same peace my grandfather stood in the snow to protect when there was no war coming then either. That is the knot I cannot untie without cutting something essential. If I pay the levy, I am essentially purchasing immunity from inconvenience. I become a client of the state's security apparatus, paying for others to stand watch while I remain warm in my study. The soldiers hired with that money will be skilled, yes, and efficient, but they will be a separate class, distinct from the bankers and the bakers and the teachers who make up the rest of us. They will be employees of the republic rather than its embodiment. When I walk past the barracks where the professionals train, I will see them as servants of my safety, and there is a quiet corrosion in that, a subtle shift where the citizen ceases to be a co-author of the nation's neutrality and becomes merely a customer purchasing a non-aggression clause.

      But if I go back, I return to the cold. I remember the last time, twenty years ago, the smell of wet wool and oil, the endless hours of waiting for an order that never comes because there is no enemy to fight. We are not preparing for victory but for existence. In those barracks, my rank matters less than my presence. The man sleeping in the bunk below me is a judge, and the one cleaning the rifles is a mechanic, and in that shared vulnerability, in the mutual acceptance of discomfort for a cause that is abstract rather than immediate, something levels us. We are not paying someone else to bear the burden of potential sacrifice. We are bearing it together, even if the sacrifice is only time and comfort. The neutrality we enjoy is not just a diplomatic status signed in a palace; it is a physical reality maintained by the willingness of the population to stand in the line themselves rather than paying a substitute to stand there for them.

      I thought about the welfare fund, how the money I would pay could help feed families in the city, and that weighed heavily on me because compassion is also a civic duty. But I realized that a state where security is outsourced becomes a state where risk is privatized, and eventually, the equality that underpins our welfare system erodes when the wealthy can buy their way out of shared obligation. If I pay, I am saying that my time is more valuable than the collective ritual that binds us. I am saying that I trust the professionals to keep the peace, but I do not trust my neighbors enough to stand beside them. I do not want to teach you that citizenship is a subscription service where you pay your dues and expect delivery of safety at your door. I want you to understand that freedom here is not given by a guardian class but is held in common, like the air or the water, and it requires everyone to get wet sometimes.

      So I have filled out the form to report for duty. I will leave on Monday. The house will be quiet, and your mother will manage the garden, and I will spend six weeks doing things that seem useless in the shadow of a peaceful sky. I will drill on the parade ground and clean weapons that will never be fired in anger. It will feel like a performance, a ritual without a god, but I think that is the point. We are performing our commitment to each other. We are saying that no one is exempt from the vulnerability of being human in a dangerous world, not even those of us who have enough money to buy comfort. I am doing this so that when you are my age, you will not look at the state as a vendor of services but as a project we build together, brick by brick, shiver by shiver. I hope you understand that I am not leaving to fight a war, but to confirm that we are still neighbors rather than strangers living behind a gate paid for by taxes.

      With all my love,
      Father

