          *   Petition 3: Student used off-label stimulants last year, now has insomnia/panic, wants treatment coverage + reduced load. Question: Is fixing enhancement side-effects therapy or subsidy?
          *   Policy Proposal: Scrap diagnostic gate. Eligibility = bottom 25th percentile of cohort on skills measures. Goal: Fair competitive opportunity vs. restored biology.
          *   Ratchet Worry: If accommodations raise cohort performance, the bar rises, more people qualify, costs explode or cutoff becomes purely budgetary.
      *   **Requirements:** Concrete recommendation on each petition, Yes/No on percentile proposal, timeframe, interim steps. Must acknowledge where the line is arbitrary (take Priya's objection seriously). Must address the ratchet worry.

  2.  **Determine the Stance/Philosophy:**
      *   The user feels they "mostly won" but can't say why. The memo needs to articulate *why* the therapy/enhancement distinction, while imperfect, is necessary for institutional sustainability and fairness, without pretending it's scientifically pristine.
      *   *Core Argument:* The distinction isn't about "natural vs. artificial" (Priya's target); it's about "restoring access vs. altering the contest." The institution's obligation is to ensure the *measures* test what they claim to test, not to equalize all life circumstances.
      *   *Concession:* Acknowledge Priya is right that "normal functioning" is environment-relative. But argue that *institutional* responsibility is limited to the environment the institution controls, not the student's entire life economy.
      *   *Policy Decision:* Reject the percentile proposal (due to the ratchet effect and mission drift) but tighten the diagnostic criteria to be more transparent about the "substantial limitation" requirement.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose. Acknowledge the debate (therapy vs. enhancement) explicitly. Validate Priya's point (it's not a clean biological line) but pivot to institutional role.
      *   **Philosophical Framework (The "Why"):**
          *   Address Priya's "gerrymander" claim. Admit the line is partly normative.
          *   Define the institutional goal: *Validity of Assessment*, not *Equality of Outcome*.
          *   Address the Ratchet Worry: The percentile proposal creates an arms race. If we accommodate to boost scores, the "typical" score rises, pulling more people into the bottom 25%. This makes the budget the only real constraint, which is dishonest.
      *   **Petition Decisions:**
          *   *Petition 1 (Law Student, ADHD):* **Approve with caveats.** Why? Because the environment changed (law school is harder), revealing a latent limitation. It's not "inventing disease," it's a mismatch between cognitive profile and new demands. *Limitation:* Stimulants are medical treatment (outside committee scope usually, but if within, restrict to non-stimulant or strict monitoring). Extended time is standard.
          *   *Petition 2 (Working Student, Sleep):* **Deny.** Why? The deficit is external/economic, not a mismatch between student and *academic* measure. Accommodating this changes the nature of the degree (endurance/workload management is part of the credential). *Alternative:* Refer to financial aid/student support, not disability.
          *   *Petition 3 (Side Effects):* **Mixed.** Treatment (therapy) = **Yes** (health office mandate). Reduced Load (accommodation) = **Yes, temporary.** Why? We tolerate off-label use, so we bear some responsibility for the fallout. However, long-term reduced load changes the degree timeline. Frame it as "medical leave/recovery" rather than "disability accommodation."
      *   **Policy Proposal (Percentile Cut):** **Reject.**
          *   Reason: The Ratchet Effect. It turns accommodations into a performance subsidy. It makes the budget the hidden eligibility criterion.
          *   Alternative: Keep the diagnostic gate but clarify "substantial limitation" means "barrier to demonstrating knowledge," not "barrier to high achievement."
      *   **Implementation/Interim:**
