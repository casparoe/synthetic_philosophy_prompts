  1. Public commemoration constitutes an ongoing endorsement by the institution; it is permissible only if the institution does not currently perpetuate the honoree's specific wrongs, the name does not actively signal approval of those wrongs to the affected public, and the community most directly impacted by the memorial consents to its presence.
  2. The "perpetuation clause" handles cases (c) and (j) by blocking names where institutional practice contradicts the name's virtue, the "signaling clause" distinguishes (f) from (g) and (d) from (e) based on active harm, and the "consent clause" handles (h) and (i) by prioritizing current community use over historical preservation.
  3. This principle cannot deliver your verdict on case (d) without modification, as it implies benefiting from tainted wealth sustains the wrongdoer's legacy even without the name; it substitutes a verdict requiring the money be redirected to reparations, and I suggest you abandon the comfort with keeping the convict-leasing money once the source is public, as retaining the benefit while scrubbing the name is a form of structural hypocrisy similar to (j).
  4. For the community-commissioned monument, the consent clause preserves it despite external controversy, while for Founders Hall, the perpetuation clause requires renaming if the university's founding structure still dictates exclusionary practices but allows it if the name denotes historical origin rather than moral endorsement.
  5. The principle breaks when the "affected community" is irreconcilably divided, such as when veterans want the Soviet memorial but the occupied populace wants it gone, leaving no clear metric for whose consent counts most.
