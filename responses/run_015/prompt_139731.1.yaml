      *   **Task:** Create an instrument (decision tree/quiz) to sort readers into metaphysical positions based on their judgments about the specific fictional cases provided.
      *   **Constraints:**
          1.  *Audience:* Intelligent readers, no philosophy jargon. Questions must be about the story cases, not metaphysical labels. Max 8-9 nodes.
          2.  *Cases:* Must use 6 specific cases (Changed Origin, Betrayal Bystander, Indiscernible Pair, Galactic Variant, Non-Transitive Chain, Governess Disclosure). Can add 1-2 if needed.
          3.  *Structure:* Build from logical space first, then map positions. Identify empty cells and why.
          4.  *Distinctions:* Must test specific metaphysical distinctions (intra-book vs. inter-book relations, bare identity matters, similarity weighting, ontological status of books/worlds, primitive modality, transitivity).
          5.  *Leaves:* 6-8 leaves. Specific required leaves (Concrete Worlds/Counterparts, Representational Worlds/Counterparts, Transworld Identity + Bare Identity Matters, Transworld Identity + Bare Identity Doesn't Matter, Primitive Modality). Label contested views.
          6.  *Indistinguishable Leaves:* Acknowledge if two leaves can't be separated by the tree and assess if the difference is real.
          7.  *Fictionality:* Address the fact that characters don't exist (abstracta vs. make-believe) in a closing section.
          8.  *Commitment:* Be decisive on ordering and empty cells.
