  ### Part II: Logical Space and The Leaves

  The tree above maps onto a logical space defined by three axes: **Relation** (Identity vs. Similarity), **Ontology** (Concrete vs. Representational), and **Grounding** (Essential/Traits vs. Primitive/Bare).

  Here are the six required leaves, plus two additional distinctions found in the logical space.

  1.  **Concrete Counterpart Theory (Lewisian Realism)**
      *   *Path:* 1B $\rightarrow$ 4A $\rightarrow$ 5A.
      *   *Summary:* The books describe concrete, spatiotemporally isolated worlds. "Madeleine" exists only in one world; elsewhere there are counterparts resembling her. Likeness need not be transitive.
      *   *Status:* Coherent and occupied (by David Lewis and his followers).

  2.  **Representational Counterpart Theory (Stalnaker/Adams)**
      *   *Path:* 1B $\rightarrow$ 4A/B $\rightarrow$ 5B.
      *   *Summary:* Worlds are abstract representations (like your books). Individuals are world-bound. Cross-book reference is a matter of stipulated similarity, not identity.
      *   *Status:* Coherent and occupied.

  3.  **Haecceitist Transworld Identity**
      *   *Path:* 1A $\rightarrow$ 2B $\rightarrow$ 3B $\rightarrow$ 6A.
      *   *Summary:* The same individual appears in several books. Bare "thisness" matters; Cécile and Céline can be distinct despite sharing all traits.
      *   *Status:* Coherent and occupied (by Kripkeans who accept haecceitism).

  4.  **Anti-Haecceitist Transworld Identity**
      *   *Path:* 1A $\rightarrow$ 2B $\rightarrow$ 3B $\rightarrow$ 6B.
      *   *Summary:* The same individual appears in several books. However, distinctness requires a qualitative difference. Cécile and Céline must be one person if they share all traits.
      *   *Status:* Coherent and occupied (by Leibnizian essentialists).

  5.  **Primitive Modality**
      *   *Path:* 7A.
      *   *Summary:* There is a brute fact about "Madeleine-ness" that is not derived from worlds, traits, or similarity. The modal facts are primitive.
      *   *Status:* Coherent, less common, but occupied (by certain modal rationalists).

  6.  **Relative Identity**
      *   *Path:* 1A $\rightarrow$ 2A.
      *   *Summary:* Identity is not absolute. "Madeleine" in Book 1 is the same *person* as the Governess, but "Madeleine" in Book 3 is not. Identity holds relative to the book/world.
      *   *Status:* Coherent, occupied (by Geach and followers), though controversial.

  7.  **Essentialist Transworld Identity (Kripkean)**
      *   *Path:* 1A $\rightarrow$ 2B $\rightarrow$ 3A.
      *   *Summary:* The same individual appears in several books, but origin is essential. Book 2's Madeleine is a different person because her parents differ.
      *   *Status:* Coherent and highly occupied.

  8.  **Bundle Theory (No Bare Particulars)**
      *   *Path:* 1A $\rightarrow$ 6B (with rejection of TWI).
      *   *Summary:* Individuals are just bundles of traits. If the bundle changes significantly (Book 3 Bystander), it is a new individual.
      *   *Status:* Coherent, often collapses into Counterpart Theory.

  #### Empty Cells in the Logical Space

  *   **Concrete Worlds + Transworld Identity:** This cell is empty.
      *   *Verdict:* **Incoherent.** If worlds are concrete and spatiotemporally isolated (as per Lewis), an individual cannot be in two places at once without violating the definition of concrete existence. You cannot be wholly in New York and wholly in London; you cannot be wholly in World A and wholly in World B.
  *   **Non-Transitive Identity:** This cell is empty.
      *   *Verdict:* **Incoherent.** Identity is logically transitive (if A=B and B=C, then A=C). If a reader claims identity holds in a non-transitive chain, they are using the word "identity" to mean "similarity."
  *   **Representational Worlds + Haecceitism:** This cell is sparsely occupied.
      *   *Verdict:* **Unattractive.** If worlds are representations (descriptions), distinctness usually derives from the description. To posit bare distinctness in a description requires positing a "label" in the description that does no descriptive work, which many find ontologically wasteful.

