answer: |-
  ### The Madeleine Instrument: A Decision Tree for Transfictional Identity

  You are correct that your readers are not merely disagreeing about plot interpretation; they are disagreeing about the metaphysics of identity. They are implicitly arguing over whether "Madeleine" is a rigid designator picking out an individual across contexts, or a cluster of traits that can be reassembled.

  Below is the instrument you requested. It is constructed from eight nodes (questions). Each node forces a choice based on one of your six required cases (plus two structural questions). Following the tree, I map the logical space, identify the leaves (positions), analyze empty cells, address the indistinguishability of certain views, and finally handle the problem of fictionality and your own placement.

  ---

  ### Part I: The Decision Tree

  **Instructions for the Reader:** Answer each question based on your intuition about the story. Do not worry about philosophical terminology. Follow the path indicated by your answer.

  **Node 1: The Galactic Variant**
  *Case:* Imagine a variant of the story set on the far side of the galaxy. In it, a woman exists who is qualitatively identical to Madeleine in Book 1: same memories, same body, same choices, same parents. There is no physical connection between them.
  *Question:* Is this distant woman **Madeleine herself**, or is she merely **someone exactly like Madeleine**?
  *   **(A) She is Madeleine herself.** $\rightarrow$ Go to Node 2. (Transworld Identity Path)
  *   **(B) She is someone exactly like Madeleine.** $\rightarrow$ Go to Node 4. (Counterpart/Similarity Path)

  **Node 2: The Governess Disclosure**
  *Case:* In Book 1, the text reveals the Governess and Madeleine are one woman. In Book 3, they are two distinct women with no disclosure to the contrary.
  *Question:* Can the statement "The Governess is Madeleine" be **true in Book 1 and false in Book 3**, or must one of the books be **mistaken about the facts**?
  *   **(A) It can be true in one and false in the other.** $\rightarrow$ Go to Node 3. (Relative Identity Path)
  *   **(B) One book must be mistaken.** $\rightarrow$ Go to Node 3. (Absolute Identity Path)
      *(Note: For the purpose of this tree, we treat the "mistaken" option as the standard Transworld Identity view where identity is absolute, and the "true in one" option as a relativized view.)*
      *Correction for Logic:* If Identity is Absolute, the books describe different possibilities, but the *fact* of identity doesn't change. If Identity is Relative, the fact changes.
      *Refined Question:* Does the fact of their identity **depend on which book you are reading**, or is it a **fixed fact that the books describe differently**?
      *   **(A) Depends on the book.** $\rightarrow$ **Leaf: Relative Identity.**
      *   **(B) Fixed fact.** $\rightarrow$ Go to Node 3.

  **Node 3: The Changed Origin**
  *Case:* In Book 2, Madeleine is born in a different city to different parents.
  *Question:* Does this change in origin make her **a different person**, or is she **the same person with a different history**?
  *   **(A) A different person.** $\rightarrow$ **Leaf: Essentialist Transworld Identity.**
  *   **(B) The same person.** $\rightarrow$ Go to Node 6.

  **Node 4: The Non-Transitive Chain**
  *Case:* Consider the chain: Book 1 Madeleine is very like Book 2 Madeleine. Book 2 Madeleine is very like Book 4 Madeleine. But Book 1 and Book 4 share nothing recognizable.
  *Question:* Is it possible for Book 1 Madeleine to be a counterpart of Book 2, and Book 2 of Book 4, **without** Book 1 being a counterpart of Book 4?
  *   **(A) Yes, likeness chains can break.** $\rightarrow$ Go to Node 5.
  *   **(B) No, if A is like B and B like C, A must be like C.** $\rightarrow$ Go to Node 5.

  **Node 5: The Nature of the Books**
  *Question:* Are the four books **windows into concrete realities** that actually exist somewhere, or are they **descriptions representing possibilities** in our single world?
  *   **(A) Windows into concrete realities.** $\rightarrow$ **Leaf: Concrete Counterpart Theory.**
  *   **(B) Descriptions representing possibilities.** $\rightarrow$ **Leaf: Representational Counterpart Theory.**

  **Node 6: The Indiscernible Pair**
  *Case:* In Book 4, Cécile and Céline are distinct women, yet no reader can tell them apart and they share all traits.
  *Question:* If they share every trait, is there still a **brute fact** that makes one Cécile and the other Céline, or does their distinctness **vanish** without a difference in traits?
  *   **(A) There is a brute fact (Bare Identity matters).** $\rightarrow$ **Leaf: Haecceitist Transworld Identity.**
  *   **(B) Distinctness vanishes (Bare Identity doesn't matter).** $\rightarrow$ **Leaf: Anti-Haecceitist Transworld Identity.**

  **Node 7: The Betrayal Bystander**
  *Case:* In Book 3, the betrayal is committed by someone else; the woman with Madeleine's temperament is a bystander.
  *Question:* Is the reason she is not Madeleine because she **lacks the essential narrative role**, or because she **lacks the intrinsic connection** to the original Madeleine?
  *(This node serves to filter Primitive Modality views.)*
