  ### Part III: Indistinguishable Leaves

  You asked specifically about the gap between **Similarity-based Counterparts** (weighting bare identity heavily) and **Transworld Identity** (where bare differences don't matter).

  **The Overlap:**
  If a Counterpart Theorist decides that the most important similarity condition is "originating from the same sperm and egg" or "having the same narrative essence," and weights this at 100%, their verdict on every case will match the Transworld Identity theorist.
  *   *Galactic Variant:* Counterpart theorist says "Not similar enough (wrong origin)," TWI says "Not her."
  *   *Changed Origin:* Counterpart says "Not similar enough," TWI says "Not her."

  **Is the difference real?**
  Yes, but it is **modal**, not empirical.
  *   The **Transworld Identity** theorist says: "It is *impossible* for her to have had different parents." (Necessity of Origin).
  *   The **Counterpart** theorist says: "It is *possible* for her to have had different parents, but in that case, we wouldn't call her 'Madeleine'."
  *   *The Tree's Limit:* Node 1 ("Is it her or like her?") usually separates them. But if the Counterpart theorist answers "It is her, because 'her' just means 'the one most similar'," they collapse into TWI linguistically.
  *   *Resolution:* The distinction survives in **Node 3 (Changed Origin)**. The TWI theorist says the variant is *impossible* for Madeleine. The Counterpart theorist says the variant is *possible*, but depicts a *different* individual. If the reader admits the variant is possible but "not Madeleine," they are Counterpart. If they say the variant is "Madeleine in a different situation," they are TWI. The tree captures this at Node 3.

