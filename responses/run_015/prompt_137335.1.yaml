          *   *Reasoning:* A timeless cause cannot change to produce an effect unless it wills to do so (Agent Causation). Mechanistic causes require antecedent conditions; if the cause is timeless, conditions are timeless, effect should be timeless. To get a temporal effect from a timeless cause, you need free will.
          *   *Vulnerability:* Highly speculative metaphysics of time and causation. Assumes "timeless" is coherent. Assumes agent-causation solves the problem (does a timeless agent change when they will?).
