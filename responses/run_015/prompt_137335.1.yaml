          *   *Selection:* The load-bearing step is **Premise 1: Whatever begins to exist has a cause.** (Specifically, the application of causal necessity to the origin of the totality of space-time). Without this, the temporal beginning doesn't imply a *transcendent* cause.
      *   *Contingency (LCA):*
          1.  Contingent things exist.
          2.  Every contingent thing has an explanation (PSR).
          3.  The explanation of the totality of contingent things cannot be contingent.
          4.  Therefore, a necessary being exists.
          *   *Analysis:* P1 is trivial. P2 (PSR) is the heavy lifter. P3 (Explanation of the whole) is the tricky inference.
          *   *Selection:* The load-bearing step is **The Principle of Sufficient Reason (PSR) applied to the totality of contingent facts.** Specifically, the claim that the *collection* requires an explanation distinct from the explanations of the *members*.
      *   *Comparison:* Are they the same step? No. KCA relies on a *Causal Principle* tied to *temporal beginning*. LCA relies on an *Explanatory Principle* tied to *ontological status* (contingency).

