answer: |-
  You have hit upon one of the most intractable problems in bioethics. Your hunch is remarkably astute: this is not a disagreement that can be resolved by gathering more clinical data, because the dispute is not about the *facts* of the case, but about the *ontology* of the person and the *source* of moral authority.

  To diagnose this properly, we must look beneath the surface of the argument. What you are witnessing is a **hybrid disagreement**, comprising a metaphysical clash over personal identity and a normative clash over the scope of autonomy. It is not merely verbal, though language obscures the fracture. It is also not purely substantive in a way that allows for a clean philosophical resolution.

  Here is the breakdown of what is actually happening in your ethics reviews.

  ### 1. The Metaphysical Fault Line: Personal Identity
  At the heart of the stalemate is an unspoken disagreement about what makes a person the *same person* over time.

  *   **Side A (The Dworkin/Precedent Autonomy Camp)** operates on a **Psychological Continuity** view. They believe that personal identity is constituted by the continuity of memory, values, and critical life plans. As long as there is a chain of connection (even if frayed) between the woman who signed the directive and the woman in the bed, they are the *same moral agent*. Therefore, the earlier self has the authority to bind the later self, just as a sober person might bind their intoxicated future self.
  *   **Side B (The Current Interest/Welfare Camp)** operates on a view closer to **Biological Continuity** or even **Narrative Discontinuity**. They implicitly treat the advanced dementia as a rupture in personhood. To them, the "person" who signed the directive is effectively gone, and the being in the bed is a new moral subject—a 'survivor' in a philosophical sense, if not a biological one. If they are not the same person, then the directive is not a self-binding command; it is one person (the past self) making demands on a different person (the present self).

  This is why the argument goes in circles. Side A says, "It is her right," assuming *she* is the subject across time. Side B says, "It harms her," assuming *she* is primarily the present sentient being. They are using the pronoun "she" to refer to two different metaphysical entities.

  ### 2. The Normative Clash: Authority vs. Welfare
  Even if we set aside the metaphysics, there is a foundational conflict in moral theory.

  *   **Side A prioritises Autonomy as Integrity.** For them, autonomy is not just about moment-to-moment choice; it is about the capacity to shape one's life as a whole narrative. To ignore the advance directive is to disrespect the life project of the competent person. They view the demented self's distress as a tragic cost of maintaining the integrity of the whole life.
  *   **Side B prioritises Beneficence and Non-Maleficence.** For them, moral status is grounded in sentience and the capacity to suffer or flourish *now*. They view the imposition of a past value upon a present, contented being as a violation of that being's welfare. To them, autonomy cannot extend beyond the capacity to hold values; once the capacity to value is gone, welfare becomes the only currency that matters.

  This is a clash of bedrock intuitions. Side A cannot argue for the primacy of critical interests without assuming that life-narratives matter more than present experience. Side B cannot argue for the primacy of present experience without assuming that current sentience trumps past rationality. Neither premise can be proven without begging the question.

  ### 3. Is the Question Ill-Posed?
  You suggested that 'the patient' might not pick out one thing. You are correct. In cases of advanced dementia, the concept of "the patient" becomes **fractured**.

  When we ask, "What does the patient want?", we assume a unity of subjecthood that dementia has dismantled.
  *   If we mean "What did the *agent* decide?", the answer is "No tube feeding."
  *   If we mean "What does the *subject* experience?", the answer is "Contentment with feeding."

  The question is ill-posed because it asks for a single answer to a situation that generates two conflicting moral claims from two different temporal stages of the same human organism. We are trying to solve a conflict of interest between the Past Self and the Present Self, but our language and laws force us to pretend they are a single unitary interest.

  A better question to ask in these reviews would not be "Whose will prevails?" but rather: **"Under what conditions does the welfare of the present subject override the precedent autonomy of the past agent?"** This acknowledges that both claims have weight, rather than treating one as a trump card.

  ### 4. Can This Be Settled?
  **Philosophically? No.**
  There is no 'view from nowhere' to adjudicate between the moral weight of a past rational choice and a present experiential state. One must ultimately privilege either the *narrative life* or the *sentient moment*. This is a value choice, not a factual discovery.

  **Empirically? No.**
  Knowing more about how dementia patients experience time or emotion will not tell us whether a past signature *ought* to bind them. That is an 'ought' question, not an 'is' question.

  **Legally/Politically? Yes, but imperfectly.**
  This is where your administration role becomes crucial. Since the ethical tension is permanent, the solution is procedural. Most jurisdictions (including under the Mental Capacity Act 2005 here in the UK) attempt a compromise:
  1.  **Validity:** Was the directive made competently and specifically?
  2.  **Applicability:** Does the current situation match the anticipated scenario?
  3.  **Best Interests:** If there is doubt, does following the directive cause severe harm to the current being?

  The law essentially picks a side (usually Side A, upholding the directive) for the sake of social utility and respect for autonomy, but it builds in 'safety valves' (like 'best interests' overrides) to acknowledge Side B's concerns. This does not solve the philosophical problem; it merely manages the risk.

  ### Summary Diagnosis
  You are dealing with a **foundational normative disagreement disguised as a factual debate about the patient's wishes.**

  *   **Side A** is committed to the idea that we are the authors of our lives, and authorship survives the loss of the pen.
  *   **Side B** is committed to the idea that moral status resides in the capacity to feel, and the present feeling is the only reality that counts.

  It is permanently hard because it reflects a tragic tension in how we value human life: do we value the *story* of a life, or the *experience* of living? In advanced dementia, the story and the experience diverge. Your committee will never agree because they are worshipping different gods: one of Integrity, the other of Welfare.

  **Recommendation:** Stop trying to convince one side of the other's philosophy. Instead, reframe the committee's task. Acknowledge explicitly that there are two competing moral claims (Past Autonomy vs. Present Welfare). The job of the committee is not to find the 'true' patient, but to determine if the harm to the Present Self is severe enough to justify violating the Past Self's instructions. This moves the debate from "Who is right?" to "What is the threshold for override?", which is a much more productive administrative question.
