  Okay, so I've been chewing on the evidential cooperation in large worlds idea: the claim that in a world big enough that your decision procedure is shared by or correlated with a great many other agents facing similar choices, an evidential decision theorist gets real reason to cooperate in one-shot anonymous dilemmas even with no causal influence, reputation, or enforcment. I find it attractive, but I want it stress-tested. Tell me what would actually count against this: which empirical findings, arguments, formal results, or thought-experimental developments should move me, and sort them from fatal to merely akward. Say what a fan of the view would themselves concede as a genuine defeater, not just what a causal-decision-theory critic would say, and be honest about whether the view has been qualified so much (say, any failed case just wasn't large or similar enough) that it has become unfalsifiable—and if so, whether that is a fatal problem or just the normal fate of a framework. I also want to know what it predicts that its main rivals do not. Personally, I'd be most moved by a case where the world is clearly large and the agents clearly similar, yet cooperation still looks unjustified. Finally, say how confident you are in what you claim and single out the point you're least sure of.
