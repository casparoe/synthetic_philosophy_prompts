          *   Direction: Accepting from customer (Anti-Kickback risk).
          *   Decision: **Hard No.** Criminal risk. Hand-off to GC for formal rejection letter.
      *   *Scenario (c) Customer -> Rep (Chocolates, $25, 15 Years, New Year).*
          *   Threshold check: Under.
          *   Context: Relationship maintenance, not bidding.
          *   Policy Conflict: Policy says "nothing."
          *   Decision: **Yes (with caveat).** This highlights the policy flaw. The procedure should flag the policy needs updating, but allow the gift under a *de minimis* exception if it exists, or recommend a policy waiver. *Correction:* The prompt says policy says "may not accept anything." I need to follow the procedure. If the procedure has a *de minimis* clause, it's a Yes. If not, it's a No that upsets the rep. I will build a *de minimis* exception into the procedure to solve the "honest account" requirement. Let's assume the procedure allows a *de minimis* override for nominal items to avoid absurdity.
