  4.  **Drafting Section 2: Setting the Numbers (Philosophy):**
      *   Address the "Stipulation vs. Discovery" question.
      *   *Answer:* It is a **Stipulation of Risk Tolerance**, not a discovery of moral truth.
      *   *Why:* Because the predicate ("bribe") is vague, the number is a bright line drawn for *administrative enforceability*, not moral ontology.
      *   *Preamble:* Must state this clearly. "This limit does not define bribery; it defines our risk tolerance."
      *   *Position:* Presupposes **Contextualism** managed by **Stipulation**. A procedure based on Epistemicism would claim the number is "the law" (false). A procedure based on Degree Theory would require a sliding scale (too complex for 5 mins).

  5.  **Drafting Section 3: Handling the Two Failures:**
      *   *Failure 1: Accumulation.* A single gift is under threshold, but 50 gifts a year is not.
      *   *Fix:* A "Rolling Register" check. Procedure must include a step: "Check recipient history last 12 months."
      *   *Failure 2: Context.* Same gift, different meaning (bidding vs. steady state).
      *   *Fix:* "Sensitive Periods" multiplier or prohibition. During a bid, threshold drops to zero or requires GC approval regardless of value.
      *   *Intent:* Keep the "Quid Pro Quo" check separate from the value check.

  6.  **Drafting Section 4: Rule for the Middle:**
      *   The "Gray Zone."
      *   *Default:* **No.** (Conservative bias protects the company).
      *   *Reason:* Risk asymmetry (Gain is small, Penalty is huge).
      *   *Override:* Requires Business Justification + Senior Mgmt (not just Compliance).
