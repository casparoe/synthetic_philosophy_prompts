          *   Show Calibration holds.
          *   Try to set thresholds for Equal FPR/FNR. Show it breaks Calibration or requires different thresholds that violate the parity.
          *   Apply the 3 escapes to this specific table.

  8.  **Refining the Worked Case (Mental Check):**
      *   Impossibility Theorem (Chouldechova/Kleinberg): Calibration + Error Rate Parity $\rightarrow$ Base Rates must be equal.
