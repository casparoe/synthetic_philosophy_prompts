      *   User's claim: This is a *moral* loss.
      *   Defeater: Maybe Error Rate Parity is the wrong moral goal when base rates differ.
      *   Case Construction:
          *   Let's make it concrete. Loan approval.
          *   Groups: G1, G2, G3.
          *   Base Rates: 0.2, 0.5, 0.8.
          *   Score: Perfectly calibrated (Score = Prob).
          *   Constraint 1: Calibration (Score means risk).
          *   Constraint 2: Equal FPR (False Positive Rate).
          *   Constraint 3: Equal FNR (False Negative Rate).
          *   Math: If Calibration holds, and Base Rates differ, FPR and FNR *cannot* be equal across groups unless thresholds vary wildly, which breaks other notions of fairness, or simply is mathematically impossible to balance simultaneously.
          *   Actually, the theorem says: Calibration + FPR Parity + FNR Parity $\implies$ Base Rates Equal.
          *   So if Base Rates $\neq$, you must drop Calibration or Error Parity.
          *   User says: Dropping either is a moral loss.
