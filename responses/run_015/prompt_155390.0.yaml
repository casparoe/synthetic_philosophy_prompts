      *   *Fatal:* **The "Ought Implies Can" Reversal.** If the moral requirements are jointly unsatisfiable, then at least one of them *cannot* be a valid moral requirement. The existence of the impossibility theorem *tells us* that our moral theory is wrong, not that the world is tragic. The friend is right: the math constrains the moral theory.
