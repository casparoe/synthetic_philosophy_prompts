answer: |-
  You have stumbled upon one of the stickiest problems in modern ethics, often associated with the philosopher Thomas Nagel. You are wrestling with the tension between the **Control Principle** (you are only responsible for what you control) and the reality of **Moral Luck** (we judge people based on things outside their control).

  First, a small note: you did spell 'autonomus' incorrectly, but as you requested, I shall leave it be in the spirit of your thought experiment.

  There is no single principle that perfectly captures all your verdicts without forcing you to abandon at least one of your gut feelings. Your intuitions are oscillating between two competing frameworks. To make sense of them, I will lay out the two candidates, propose a synthesis that fits most of your views, apply it to your new doctor case, and then tell you honestly which intuition you will have to sacrifice.

  ### Candidate 1: The Control Principle (The Purist View)
  **The Principle:** *An agent is morally assessable only for factors within their voluntary control.*

  *   **Predictions:**
      *   **Surgeons:** Both are equally blameworthy/praiseworthy. Career hits for the one whose patient died are unjust.
      *   **Activist:** Both deserve the exact same moral assessment. Praising one and vilifying the other is irrational.
      *   **Programmer:** Neither did anything "worse." Both were equally negligent. The death is a tragedy, not a moral difference.
      *   **Soldier:** If he genuinely couldn't have known and was coerced, he is not culpable.
      *   **Jokers:** They are morally identical.

  *   **Verdict:** This principle cleans up the inconsistency but contradicts your gut on the Surgeon's career, the Activist's praise, and the Programmer's wrongness. It demands you reject moral luck entirely.

  ### Candidate 2: The Outcome Liability Principle (The Pragmatist View)
  **The Principle:** *Moral assessment is partly constituted by the actual causal impact of an action, regardless of intent.*

  *   **Predictions:**
      *   **Surgeons:** The surgeon whose patient died is more blameworthy and deserves the career hit.
      *   **Activist:** The one who saved lives is morally better; the one who caused a spill is morally worse.
      *   **Programmer:** The one whose code killed someone objectively did something worse.
      *   **Soldier:** He is fully responsible for the massacre because the act was objectively wrong, regardless of his belief.
      *   **Jokers:** The recorded friend is "unluckier," but if the harm (reputation ruin) is real, the situation is morally weightier.

  *   **Verdict:** This fits your intuitions on the Activist and Programmer, but it clashes with your Surgeon intuition (where you separated blame from career) and feels too harsh on the Soldier.

  ### The Synthesis: The Principle of Divided Assessment
  Your specific mix of verdicts suggests you are actually holding a third, more nuanced view. You distinguish between **internal blameworthiness** (character/intent) and **external liability** (consequences/social response). Let's formalise this into a single working principle:

  **The Principle of Risk-Realisation Accountability**
  > *An agent's **culpability** is determined by the risks they knowingly imposed and their control over the choice; however, their **liability** (punishment, praise, or social consequence) is modulated by whether those risks actually materialised into harm or benefit.*

  This principle splits the moral landscape into two layers.
  1.  **The Choice Layer:** Did you take an unjustified risk? (Controls blameworthiness).
  2.  **The World Layer:** Did the risk turn into reality? (Controls liability).

  #### How it handles your cases:
  *   **Surgeons:** Both took the same risk (Choice Layer = Equal Blame). Only one realised the harm (World Layer = Different Career Liability). This matches your gut perfectly.
  *   **Activist:** The action imposed a risk. When it saved lives, the World Layer grants praise. When it spilled toxins, the World Layer demands vilification.
  *   **Programmer:** Both imposed the same buggy risk (Choice Layer = Equal Negligence). But because one killed, the World Layer makes her *liable* for a death. This explains why you feel she "did something worse" without necessarily saying her *character* was worse. She is accountable for a death, not just a bug.
  *   **Soldier:** The Choice Layer (coercion/ignorance) reduces culpability. But the World Layer (massacre occurred) means he is not "off the hook" entirely, as objective duties were violated.
  *   **Jokers:** Choice Layer = Equal rudeness. World Layer = One suffered reputation damage. She is not *worse*, but she is *liable* for the consequences in a way the other is not.

  ### Application to the New Case
  **The Case:** A doctor prescribes a standard drug following every guideline. An unknown genetic factor makes it fatal for this one patient.

  **Applying The Principle of Risk-Realisation Accountability:**
  1.  **Choice Layer:** Did the doctor impose an *unjustified* risk? No. They followed guidelines and the risk was unknown (not reasonably foreseeable). Therefore, **culpability is zero.**
  2.  **World Layer:** Did harm materialise? Yes. A patient died.

  **The Verdict:**
  Unlike the *risky* surgeon you described earlier, this doctor is not blameworthy in the Choice Layer. Therefore, under this principle, **their career should not take a hit.** The "career hit" for the first surgeon was justified because they took a *known* risky action. Here, the risk was hidden.
  *   **Prediction:** The doctor is not morally at fault. They may face a tragic liability (e.g., the hospital pays compensation), but they should not be professionally sanctioned or morally vilified. This distinguishes them from the risky surgeon, preserving your intuition that the risky surgeon deserves a career hit while this doctor does not.

  ### The Hard Truth: What You Must Drop
  You asked me to be honest about which gut feeling this principle forces you to drop.

  To maintain consistency with **The Principle of Risk-Realisation Accountability**, you must refine your intuition regarding the **Programmer**.

  You wrote: *"I want to say the first did something worse."*

  If you accept the principle above, you cannot say she did something **morally worse** in terms of her character or her initial wrong. She committed the exact same wrong (writing buggy code) as the other programmer. What differs is not the *wrongness of the act*, but the **gravity of the liability**.

  *   **You must drop:** The idea that the programmer is *more negligent* or *more vicious* than the lucky one.
  *   **You must accept:** That she is *more liable*. She has a death on her conscience that the other does not, and she deserves punishment the other does not, but the *moral flaw* in her decision-making was identical.

  If you insist that she actually *did something worse* (in terms of the quality of the action itself, not just the result), you slide back into **Candidate 2 (Outcome Liability)**, which then forces you to admit the *Risky Surgeon* whose patient lived was less blameworthy than the one whose patient died. But you explicitly said they *aren't* more blameworthy.

  So, to keep your surgeon intuition intact, you must concede that the programmer's "wrongness" is identical to the lucky programmer's; only her **accountability for the consequence** changes. It is a subtle shift, but it is the only way to stop the whole system from contradicting itself.

  In short: Luck cannot change who you *are* (your blameworthiness), but it absolutely changes what you *owe* (your liability).
