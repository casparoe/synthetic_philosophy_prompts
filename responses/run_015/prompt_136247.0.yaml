          4.  Distinguish between descriptive utility (political durability) and normative utility (moral obligation).
          5.  Assess alternative analogies (Reinsurer of Last Resort, Public Utility).
      *   **Tone:** Academic, rigorous, critical, nuanced, peer-to-peer (not talking down, but not assuming too much shared jargon without definition).

  2.  **Deconstruct the "Welfare as Insurance" Analogy:**
      *   *The Core Claim:* Contributions buy entitlements. Conditions are like policy warranties. Fraud hurts fellow contributors.
      *   *The Supervisor's Argument:* This justifies conditionality (mitigating loss) and harsh sanctions for fraud (betrayal of the pool).
      *   *The User's Skepticism:* Covariate risk, lack of voluntariness, PAYG structure, fraud vs. tax avoidance asymmetry.

  3.  **Drafting the Correspondence Table:**
      *   Need to map specific insurance concepts to welfare concepts accurately based on the supervisor's usage.
      *   *Premium:* NICs/Taxes.
      *   *Insurer:* The State (DWP/HMRC).
      *   *Policyholder:* The Worker/Citizen.
      *   *Insured Event:* Unemployment, Sickness, Old Age.
      *   *Claim:* Benefit Application.
      *   *Underwriting:* Eligibility criteria (NI record, means test).
      *   *Moral Hazard:* Shirk/Leisure preference (justifies conditionality).
      *   *Warranty/Conditions:* Claimant Commitment/Job Search requirements.
      *   *Fraud:* False claims.
      *   *Pool:* The National Insurance Fund (notional).

  4.  **Analyzing the Breakages (The "Audit"):**
      *   *Covariate Risk:* Insurance relies on independence. Recessions are systemic. Private insurers fail here; states absorb via debt/tax. *Impact:* Undermines the "actuarial fairness" argument.
      *   *Voluntariness/Exit:* Insurance is a contract. Welfare is statutory/coercive. *Impact:* Undermines the "consent" basis for conditions.
      *   *Actuarial Link:* UK NI is PAYG, not funded. No actual pot of money. *Impact:* Undermines the "depletion of others' contributions" argument regarding fraud.
      *   *Fraud vs. Tax Avoidance:* Fraud is illegal, avoidance is legal but reduces the pool. *Impact:* Undermines the "categorical betrayal" argument.
      *   *Moral Hazard:* Insurers manage this via excess/no-claims. Welfare manages this via sanctions/conditionality. *Impact:* Is "search effort" truly analogous to "locking your door"?

  5.  **Evaluating the Normative Conclusions:**
      *   *Conclusion 1: Conditionality is Fair Reciprocity.*
          *   Does the breakage bite? Yes. If there's no voluntary contract and no actuarial link, "reciprocity" is imposed, not agreed. The "warranty" analogy fails because the risk isn't individually mitigable in a recession.
          *   *Pedantry?* The voluntariness point is crucial. You can't breach a contract you didn't sign.
      *   *Conclusion 2: Fraud is Categorically Worse than Tax Non-Compliance.*
