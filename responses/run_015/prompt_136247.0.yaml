  10. **Final Polish:** Ensure clear headings, bullet points for readability, and a strong concluding thought on how to use this in the thesis (e.g., treating the analogy as an *object of study* rather than a *tool of analysis*).

  *(Self-Correction Note)*: Wait, the user asked "Which breakages would someone who uses the analogy concede?" I need to make sure I address the *defender's* perspective, not just the critic's. A defender might concede the actuarial link is notional but argue the *principle* of contribution matters politically. I need to nuance that.

