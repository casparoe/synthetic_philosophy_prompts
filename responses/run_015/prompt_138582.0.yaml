answer: |-
  Here is the straight answer: **You cannot have a single impersonal principle that treats Case 1 as "neutral" and the Kid in the Pond as "an improvement."**

  Mathematically and axiologically, they are identical changes: a finite local improvement in an infinite background of positive well-being. If adding a happy person to an infinite happy world changes nothing (Case 1), then saving a kid in an infinite happy world changes nothing *impersonally*.

  However, you *can* have a principle that saves Cases 1, 2, 3, 4, 5, and 6, and preserves the *obligation* to save the kid without claiming the *universe* is better. You do this by separating **Impersonal Betterness** (ranking worlds) from **Moral Obligation** (ranking actions).

  Here is the principle that captures your world-rankings, clause by clause.

  ### The Principle: Lexical Suffering-Average Utilitarianism

  **Clause 1: The Suffering Lexicality.**
  Any world containing suffering is impersonally worse than any world containing no suffering, regardless of averages or totals.
  *   *Saves Case 3 & 6:* Explains why finite agony (Case 3) and 0-volume agony (Case 6) make a world worse than the all-happy baseline, even if they don't drag down the average.
  *   *Saves Case 4:* Explains why the equal world (+1 everywhere) is better than the unequal world (+3/-1), because the latter contains suffering.

  **Clause 2: Suffering Density.**
  Among worlds that both contain suffering, the world with the lower density of suffering (suffering per unit spacetime volume) is better.
  *   *Saves Case 5:* Explains why 1-in-1000 agony is *much* worse than finite agony (higher density).
  *   *Saves Case 6:* Explains why the filament (0 density) is better than spread suffering (positive density), even though both are worse than no suffering (Clause 1).

  **Clause 3: Well-being Density.**
  Among worlds with identical suffering status (both have none, or both have equal density), the world with higher average well-being per unit spacetime volume is better.
  *   *Saves Case 2:* Explains why +2 everywhere is better than +1 everywhere.
  *   *Saves Case 1:* Explains why adding one happy person is **neutral**. In an infinite universe, one person adds 0 to the density. The suffering status is unchanged. Therefore, the worlds are equal.

  **Clause 4: Agent-Relative Obligation (The Kid Clause).**
  Moral obligation is not determined solely by impersonal betterness. An agent is obligated to prevent suffering or create happiness within their causal reach, even if the action does not improve the impersonal value of the infinite world.
  *   *Saves the Kid:* You must save the kid because you have a specific duty to that claimant, not because you have successfully improved the "score" of the universe.

  ---

  ### Prediction for Your New Test Case

  **The Case:** One happy person per cubic parsec at well-being $W$ **versus** two people per cubic parsec at well-being $W/2$ each.

  **The Prediction:** **Indifferent.**

  **Why:**
  1.  **Suffering Status:** Both worlds have zero suffering. (Clause 1 ties).
  2.  **Suffering Density:** Both are zero. (Clause 2 ties).
  3.  **Well-being Density:**
      *   World A: $1 \text{ person} \times W = W$ per parsec.
      *   World B: $2 \text{ persons} \times (W/2) = W$ per parsec.
      *   The density of well-being per unit volume is identical. (Clause 3 ties).

  **Verdict:** On this principle, these worlds are axiologically equivalent. It does not matter if you pack more people in at lower welfare, provided the *total well-being per cubic meter of universe* remains constant and no suffering is introduced.

  ---

  ### The Hard Truth: What You Have to Give Up

  You asked to be straight about which verdict cannot be saved. Here is the trade-off:

  **1. You must give up the idea that saving the kid makes the *world* better.**
  If you accept Case 1 (adding a happy person is neutral), you must accept that saving the kid is impersonally neutral. If you insist saving the kid makes the *world* better, you must admit Case 1 is better. You cannot have both.
  *   *Recommendation:* Keep Case 1 as neutral. If you make Case 1 an improvement, you open the door to the conclusion that you should always prioritize creating new happy people over helping existing ones, even in infinite worlds. It is safer to ground the Kid intuition in **Clause 4 (Obligation)** than in **Impersonal Value**.

  **2. You must accept that Case 6 is "worse" solely due to existence, not measure.**
  Your intuition on Case 6 (filament) is tricky. You want it to be worse than the all-happy world, but it has 0 volume.
  *   *The Cost:* This principle commits you to the view that **existence of suffering has lexical disvalue independent of its spatial measure.** Some philosophers will argue this is incoherent (how can something with 0 volume have weight?). But it is the only way to satisfy your gut verdict that the filament world is not *exactly* as good as the paradise world.

  **3. You must accept Indifference in the New Test Case.**
  Many people intuitively feel that 1 person at $W$ is better than 2 people at $W/2$ (diminishing marginal utility of persons). This principle says they are equal. If you feel strongly that the higher-quality life is better, you would need to add a clause for "Average Well-being Per Person," but that creates conflicts with Case 2 (where +2 is better than +1, which is already handled by density). Stick to Density Per Volume to keep the system stable.

  ### Summary
  Adopt **Lexical Suffering-Average Utilitarianism**.
  *   It saves Cases 1, 2, 3, 4, 5, 6.
  *   It saves the Kid via **Obligation**, not **Betterness**.
  *   It predicts **Indifference** for the 1-person vs. 2-person density case.
  *   It requires you to admit that **Impersonal Value** does not track **Moral Duty** in infinite contexts.
