answer: |-
  | Requirement | Motivating Case & Necessity | Status | Rules Out |
  | :--- | :--- | :--- | :--- |
  | **1. Bayesian Limit** | Shape 1 (Limit): If reliability=1, must match ordinary conditionalization. | Non-negotiable | Ad-hoc averaging rules |
  | **2. Identity (No-Op)** | Stability: If input matches current credence, state must not change. | Non-negotiable | Forced drift mechanisms |
  | **3. Continuity** | Sensor Noise: Small error in input reliability yields small output change. | Non-negotiable | Threshold-based triggers |
  | **4. Partition Invariance** | Granularity: Result invariant under refinement of evidence partition. | Preference (Imprecise/MEP) | Jeffrey Kinematics |
  | **5. Input Provenance** | Shape 1 & 4: Input must be likelihoods/constraints, not bare posteriors. | Preference (Bayes-net) | Bare posterior updates |
  | **6. Idempotence** | Stream Duplicates: Receiving identical item twice equals receiving it once. | Non-negotiable | Naive accumulation |
  | **7. Order-Independence** | Stream Processing: Sequence $A, B$ yields same state as $B, A$. | Preference (Bayes-net) | General Jeffrey updates |
  | **8. Reversibility** | Shape 4 (Retraction): Must restore prior state upon evidence withdrawal. | Non-negotiable (for this thesis) | Standard absorption without history |
  | **9. Second-Order Handling** | Shape 2: Can update on uncertainty about past evidence competence. | Preference (Hierarchical) | Flat update models |
  | **10. Interval Accommodation** | Shape 3: Accepts interval constraints directly without point collapse. | Preference (Imprecise) | Point-estimate only rules |

  **Incompatibility Analysis**
  Requirements 4 (Partition Invariance), 7 (Order-Independence), and 10 (Interval Accommodation) cannot be jointly satisfied by a single rule under general dependence structures without significant computational cost or structural assumptions. Specifically, Order-Independence (7) generally fails for uncertain evidence unless the evidence items are conditionally independent given the hypothesis partition. Jeffrey conditionalization satisfies neither 4 nor 7 in general cases. To maintain coherence, I recommend weakening **Order-Independence** to "Order-Independence under Conditional Independence." The cost is that the agent must track dependence relations between evidence sources; treating them as independent when they are not leads to double-counting, but demanding strict order-independence universally forces an unrealistic independence assumption or sacrifices Partition Invariance.

  **Scoring Candidate Rules**

  **Ordinary Conditionalization on Report:** This treats "Source says $p$" as a hard event. It satisfies the Bayesian Limit and Order-Independence but fails Shape 1 (Reliability) unless the reliability is explicitly modeled as a separate variable, effectively turning it into a different rule. It fails Shape 3 (Intervals) and Shape 4 (Retraction) without storing specific likelihood histories. It is too brittle for uncertain evidence streams where the evidence itself is not a certain event in the object language.

  **Jeffrey-Style Probability Kinematics:** This updates by shifting probabilities on a partition while maintaining rigidity (conditional probabilities stay fixed). It handles Shape 1 conceptually but fails Partition Invariance (the Diaconis-Zabell critique): refining the partition changes the posterior. It also fails Order-Independence for overlapping partitions and lacks native Reversibility, as the likelihood ratio is absorbed and lost. It is theoretically elegant but structurally fragile for engineered systems.

  **Constraint-Based (Minimally Informative):** This selects the posterior satisfying input constraints (e.g., intervals) that minimizes information gain (cross-entropy). It excels at Shape 3 (Intervals) and satisfies Partition Invariance. However, it is computationally intensive for large factored spaces. Crucially, it often fails Reversibility unless the specific constraints are stored separately from the distribution, and it struggles with Shape 1 (Reliability) unless reliability is encoded as a constraint on likelihoods rather than posteriors.

  **Likelihood-Ratio (Virtual Evidence):** Used in graphical models, this treats uncertain evidence as a likelihood function on parent nodes. It satisfies Input Provenance, Reversibility (by removing the likelihood), and Order-Independence (assuming conditional independence). It handles Shape 1 (Reliability) naturally via likelihood ratios. However, it fails Shape 3 (Intervals) without modification, as it requires precise likelihood functions. It is the most robust for engineering but least flexible for imprecise inputs.

  Verdict: Partition Invariance
