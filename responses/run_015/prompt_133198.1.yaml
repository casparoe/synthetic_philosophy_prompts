answer: |-
  **Project Title:** Computational Intractability and Normative Authority: A Parameterized Approach

  **Project Overview**
  Contemporary philosophy of computation and ethics largely focuses on *bounded rationality*: the idea that human agents lack the cognitive capacity to compute the optimal choice prescribed by a normative theory. This project proposes a shift in focus from the limitations of the agent to the structural limitations of the theory itself. Many normative procedures—particularly in social choice theory and contractualist ethics—require aggregating preference profiles or scanning feasible worlds in ways that are computationally intractable (e.g., NP-hard). This research asks whether the inherent complexity of a normative decision procedure undermines the theory's authority, independent of human cognitive limits. Furthermore, it investigates whether parameterized complexity offers a rescue strategy: a theory might be intractable for large populations but fixed-parameter tractable for small groups, suggesting that normative authority is scale-relative.

  **Research Question and Significance**
  The central research question is: *Does the computational complexity class of a normative decision procedure constrain its validity as a action-guiding theory?*

  Existing literature treats computational limits as epistemic barriers for agents. If a utilitarian calculus is too hard for a human to solve, the failure is attributed to the human. This project argues there is a deeper, ontological problem. If a theory defines the "right action" as the output of a function that cannot be computed in polynomial time, the theory may fail to specify a determinate answer within any reasonable timeframe, even for idealized computers. This challenges the "ought implies can" principle at the level of theory construction rather than agent psychology.

  The significance of this project lies in bridging formal computer science and normative ethics. By utilizing parameterized complexity, I will test whether normative theories can be salvaged via approximation. If a procedure is fixed-parameter tractable (FPT) relative to the number of agents, it implies that justice is computable for small committees but not nation-states. This would necessitate a revision of universalist claims in political philosophy, suggesting that different normative procedures are required for different scales of social organization.

  **Methodology and Work Plan**
  This project employs a formal modeling approach followed by normative analysis. I will not derive new complexity theorems but will apply existing classification methods to philosophical models.

  *Month 1: Formalization of Toy Models*
  I will select two representative normative procedures known to involve heavy computational lifting.
  1.  **Social Choice Aggregation:** A ranking procedure that requires checking consistency across all possible preference profiles (likely related to Kemeny-Young optimal ranking).
  2.  **Contractualist Scanning:** A procedure that requires checking whether a principle could be reasonably rejected by comparing it against all feasible alternative worlds.
  I will formalize these as decision problems, defining inputs (preferences/worlds) and outputs (ranking/principle). The deliverable is a precise mathematical specification of these procedures suitable for complexity analysis.

  *Month 2: Complexity Classification*
  Using standard reduction techniques, I will classify the formalized problems.
  1.  **General Complexity:** Determine if the problems are in P, NP-complete, or harder.
  2.  **Parameterized Analysis:** Identify relevant parameters (e.g., number of agents, number of options, depth of preference ordering). I will investigate if the problems become fixed-parameter tractable when these variables are bounded.
  The goal is to produce a complexity profile for each theory. For example, demonstrating that the contractualist procedure is NP-hard generally but FPT when the number of competing principles is small.

  *Month 3: Normative Analysis of Approximation*
  I will argue whether approximation algorithms preserve normative force. If a theory is intractable, can we substitute the exact solution with a polynomial-time approximation scheme (PTAS) without losing ethical validity? I will assess whether "close enough" computations satisfy the normative criteria (e.g., does an approximate ranking satisfy the conditions of fairness?). The month will conclude with drafting the final paper, synthesizing the formal results with the philosophical argument regarding scale-relative authority.

  **Expected Outcomes and Criteria for Success**
  The primary outcome will be a complete draft of a research paper suitable for submission to a journal in philosophy of computation or ethical theory. The paper will argue that computational complexity is a validity condition for normative theories, not merely a practical constraint.

  *Success:* Successfully mapping the toy models to known complexity classes (e.g., proving the contractualist scan is NP-hard) and providing a coherent philosophical argument that FPT status rescues normative authority for small-scale contexts.
  *Failure:* If the formal models prove too complex to classify with my current mathematical background, or if the reduction to known problems is inconclusive. In this case, the deliverable will shift to a conceptual paper outlining the argument with informal formalizations, highlighting the need for interdisciplinary collaboration.

  **Feasibility and Scope**
  I am trained in philosophy with a background in basic logic and formal methods. I am not attempting to prove new results in complexity theory (e.g., P vs. NP). Instead, I will rely on established reductions and known complexity classifications of related problems in social choice theory. The scope is limited to two toy models to ensure depth over breadth. This constraint ensures the project is completable within three months while still producing a novel contribution to the debate on computation and ethics. The risk of mathematical overreach is mitigated by focusing on the philosophical implications of existing complexity classes rather than deriving new bounds.
