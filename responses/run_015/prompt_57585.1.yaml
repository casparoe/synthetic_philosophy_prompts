  Here the soil is sifted fine, the light is metered out,
  No patch of shade to starve a stalk, no drought to induce doubt.
  The seeds are mixed, a random handful, genetically diverse,
  But the ground treats every root exactly the same, for better or worse.
  So when the stalks rise up to measure, tall against the short,
  The difference speaks the language of the embryo, not the dirt.
  The variance is mostly lineage, the environment is quiet,
  Though a flood could flatten all, regardless of their diet.
  The score climbs high when noise is stripped, when earth holds still its breath,
  A near-perfect echo of the code, flirting with genetic death.
  H² = 0.92

  There the ground is broken rough, the nutrients uneven,
  One patch rich in limestone deep, the next barely given.
  The seeds are matched, the very same, genetically diverse,
  But the earth treats every root uniquely, for better or worse.
  So when the stalks rise up to measure, tall against the short,
  The difference speaks the language of the clod, not the seed.
  The variance is mostly location, the lineage is quiet,
  Though a uniform soil could equalize them, regardless of diet.
  The score sinks low when noise is loud, when earth holds not its breath,
  A muffled echo of the code, distant from genetic death.
  H² = 0.14

  Yet step back from the variance, look across the divide,
  Where the lush plot towers over the stunted, side by side.
  No ratio within the rows explains the mean's displacement,
  Only the soil accounts for the shift in placement.

