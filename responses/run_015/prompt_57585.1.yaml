  **Technical Liberties:**
  1.  **The Numbers:** I chose 0.92 and 0.14 to maximize the pedagogical contrast. In reality, finding a natural population with $H^2$ near 0.92 is rare (usually inbred lines in controlled chambers), and 0.14 implies massive environmental noise. These are idealized extremes to serve the argument.
  2.  **$H^2$ vs. $h^2$:** As requested, I used broad-sense heritability ($H^2$). A quantitative geneticist might note that for sexually reproducing seeds (implied by "genetically diverse"), narrow-sense ($h^2$) is often more relevant for predicting selection response. However, $H^2$ is correct for describing the total proportion of phenotypic variance attributable to all genetic factors (additive, dominance, epistatic), which fits the "total genetic variance" requirement of the seed story.
  3.  **"Genetic Death":** This is poetic license for "determinism" or "fixity." Genes don't die when heritability is low; their variance is just masked.

  **On the Conceit:**
  The conceit is not bad; it is essentially Richard Lewontin's famous cornfield analogy, which remains the gold standard for this lesson. However, there is a risk you should flag for your students: **reification of variance.**

  By presenting two static plots, the poem risks suggesting that "High $H^2$" and "Low $H^2$" are stable properties of the *seeds* or the *traits*, rather than dynamic descriptions of a specific population in a specific context at a specific time. Students often walk away thinking, "Height is highly heritable in Plot A," rather than "Variance was partitioned this way in Plot A." The mirror structure fights this by showing the seeds unchanged, but the visual symmetry can inadvertently suggest two fixed states of being rather than a continuous interaction. The coda saves it by pointing to the between-group difference, but ensure your discussion emphasizes that $H^2$ says nothing about the *cause* of the mean difference between the plots, only the variance *within* them.
