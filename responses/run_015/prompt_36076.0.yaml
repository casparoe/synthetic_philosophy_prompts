      *   *The "Yes" Case (Extended Mind):* Explain Clark & Chalmers without naming them necessarily (or keeping it light). Use the "Otto and his Notebook" thought experiment. The key is *trust* and *accessibility*. If you trust it like memory, it *is* memory. The phone wasn't a library; it was a hippocampus.
      *   *The "No" Case (The Objection):* The "Coupling-Constitution Fallacy." Just because a calculator is coupled to your hand doesn't mean the math happens in the calculator. The brain does the *thinking*; the phone just holds the *data*. The "dumbness" was just friction, not lobotomy.
      *   *The Notebook Wrinkle:* This is the pivot. If the notebook worked, it proves the *system* matters, not the silicon. The phone wasn't special because it was digital; it was special because it was *integrated*. The notebook becoming functional shows the mind is flexible. It supports the "Extended Mind" view but suggests the "extension" is about the *relationship*, not the *device*.
