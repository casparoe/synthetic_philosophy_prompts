  5.  **Final Polish:** Ensure the follow-ups bite hard on the philosophical weakness (usually the gap between *interpretation* and *reality*, or the *utility* vs. *truth* of belief). Make sure the voice sounds like a serious literary interviewer (think *The Paris Review* meets *Journal of Consciousness Studies*).

