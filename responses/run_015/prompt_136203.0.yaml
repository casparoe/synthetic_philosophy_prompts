      *   *Threshold:* There's a switch from Design Stance (mechanism) to Intentional Stance (persona).
      *   *Vulnerability:* What constitutes "integration"? Is it coherence? Continuity? Self-reference? What happens when the narrative breaks? How is this different from reading a novel?

  3.  **Drafting the Questions (Iterative Process):**

