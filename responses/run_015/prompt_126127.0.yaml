answer: |-
  Your hypothesis is correct: the stalemate persists because the group is conflating three distinct normative questions under a single semantic label.

  The agreement on cases occurs because, in concrete scenarios, the three normative frameworks usually point in the same direction, but the disagreement on principles arises because each position prioritizes a different moral mechanism. Position 1 (Equivalence) is consequentialist, weighing only the outcome of false belief; Position 2 (Specialness) is deontological, weighing the violation of the assertion norm itself; Position 3 (Reversalists) is virtue-structural, weighing the corruption of accountability mechanisms. When you agree that lying to the murderer is fine, the consequentialist weight (saving a life) overwhelms the deontological weight (breaking an assertion norm) for everyone, masking the underlying divergence. When you agree that misleading in sales is bad, the accountability cost ( Position 3) and the outcome cost (Position 1) align, masking the fact that Position 2 might view it as less egregious than a direct lie. You are not failing to find the truth; you are failing to acknowledge that you are measuring three different things with one ruler.

  Regarding load-bearing versus decoration, the "auditable trace" (your point b) and the "normative invitation" (your point a) are the engines of the disagreement, while the definition of lying (your point c) is largely decorative. If you stipulate a definition, Position 1 will simply argue that the defined category lacks moral significance compared to the outcome, and Position 3 will argue the defined category ignores the strategic cost of deniability. The "escalation test" is a useful diagnostic for isolating *commitment*, which serves Position 2, but it fails to resolve the debate because Position 1 does not care about commitment levels and Position 3 cares about why the commitment was avoided. The test clarifies the mechanism but does not assign the moral weight.

  Progress requires disaggregation rather than resolution. You should stop asking "Which is worse?" and start asking "Under which conditions does the mechanism matter?" A formal result or empirical finding won't help because the dispute is normative, not factual. Instead, map the three positions onto specific contexts: in legal contexts, the auditable trace (Position 3/2) dominates; in intimate relationships, the normative invitation (Position 2) dominates; in high-stakes survival, the outcome (Position 1) dominates. Expect no progress if you continue to seek a unified theory, because the moral landscape here is pluralistic, not singular.
