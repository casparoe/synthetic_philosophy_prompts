      *   **Specific Questions:**
          1.  Implications for NR practice (gauge freedom, lapse/shift, "where/when" questions, simulation identity).
          2.  Does it *force* abandonment of substantivalism? (Escape hatches: sophisticated substantivalism, structural realism, etc.)
          3.  **Crucial Constraint:** "If you think I've garbled the setup... please say so plainly." Don't be polite if it means hiding confusion. Check technical accuracy regarding active vs. passive diffeos and determinism.

  2.  **Evaluate the User's Understanding (The "Garbled Setup" Check):**
      *   *Claim:* "In GR you can take a diffeomorphism that's the identity outside some finite region but shuffles the metric and matter filed around inside it..."
