answer: |-
  Here is a 40-minute lesson plan designed to treat the Two-Envelope Paradox (TEP) as a structural precursor to Newcomb's Problem, targeting the specific misconceptions you identified.

  ### The Strategy: Closed $\to$ Open $\to$ Policy
  **Verdict:** Do **Closed first, then Open.**
  **Reasoning:** The Closed version isolates the *variable equivocation* fallacy (treating $X$ as constant across branches). This is a logical error independent of priors. The Open version introduces the *Bayesian* error (improper priors/conditionalization). Since your students have Bayesian epistemology, they will instinctively reach for priors too early. Force them to solve the logic puzzle first, then unleash their Bayesian tools on the second half. This mirrors the Newcomb structure: first the dominance argument (Closed/Two-Box), then the evidential/prior argument (Open/One-Box).

  ---

  ### Minute 0–5: The Hook (Closed Envelope)
  **Setup:** Two envelopes, one has $2A$, one has $A$. You pick one. You do not look.
  **The Argument:** Let $X$ be the amount in your hand. The other is $2X$ or $X/2$ with $p=0.5$.
  $$E[\text{Switch}] = 0.5(2X) + 0.5(X/2) = 1.25X$$
  Since $1.25X > X$, you should switch. But by symmetry, you should have picked the other one first. Paradox.

  **Pedagogical Goal:** Elicit the "symmetry intuition" vs. the "calculation intuition."

  ### Minute 5–15: Defusing Misconception #1 (Variable Equivocation)
  **The Slip:** Students will say, "But $X$ is different in the two branches."
  **The Fix:** Formalize the states.
  Let $S$ be the state (Small, Large). Let $V$ be the value in your hand.
  *   If $S=\text{Small}$, $V=A$, Other $=2A$.
  *   If $S=\text{Large}$, $V=2A$, Other $=A$.
  $$E[\text{Switch}] = 0.5(2A) + 0.5(A) = 1.5A$$
  $$E[\text{Keep}] = 0.5(A) + 0.5(2A) = 1.5A$$
  **Takeaway:** In the Closed version, the paradox is a scope error. $X$ is a random variable, not a rigid designator. You cannot condition on $X$ if you haven't observed it.
  **Bridge Note:** This dissolves the *Closed* paradox completely. But it doesn't touch the *Open* version, which is where Decision Theory gets interesting.

  ### Minute 15–25: The Open Version & Misconception #2 (The Prior)
  **Setup:** You open the envelope. You see $x$.
  **The Argument:** $E[\text{Other}|X=x] = 0.5(2x) + 0.5(x/2) = 1.25x$. Switch.
  **The Bayesian Intervention:** This calculation assumes $P(\text{Small}|X=x) = 0.5$. By Bayes' Rule, this is only true if the prior $P(\text{Small})$ and the likelihood of seeing $x$ balance out perfectly.

  **Misconception:** "The paradox exists because there is no uniform distribution over $\mathbb{R}^+$."
  **Defusal:** This is a dead end. Show them a **proper prior** where the paradox still tempts.
  *   *Example:* Let the smaller amount $A$ follow a geometric distribution: $P(A=2^k) = 2^{-k}$ for $k \ge 1$.
  *   If you see $x=2$, you know you have the smaller amount (since $A \ge 2$). Switch.
  *   If you see $x=4$, it could be $(A=2, \text{You=Large})$ or $(A=4, \text{You=Small})$. Calculate the posterior.
  *   *Point:* With proper priors, there will always be some $x$ where you should **not** switch. The $1.25x$ calculation fails because the probability you hold the smaller amount is not $0.5$ for all $x$.

  ### Minute 25–35: Misconception #3 (Always Switch & Infinite Expectation)
  **The Stubborn Student:** "Okay, maybe not for *every* $x$. But if I calculate $E[\text{Other}|X=x] > x$ for every $x$ I might possibly see, then the policy 'Always Switch' must yield higher utility than 'Never Switch'."

  **Is this true?**
  *   **Standard Setup:** No. For any proper prior with a **finite mean**, it is mathematically impossible for $E[\text{Other}|X=x] > x$ for all $x$. There must be some "stop" values.
  *   **The Heavy-Tailed Exception:** If you allow a prior where the expected value of the money in the envelopes is **infinite** (e.g., a St. Petersburg-style distribution), then yes, you can construct a case where switching looks beneficial for every $x$.
  *   **The Catch:** If $E[\text{Money}] = \infty$, then $E[\text{Keep}] = \infty$ and $E[\text{Switch}] = \infty$. You are comparing $\infty$ to $\infty$. Expected Utility Theory (EUT) does not rank these.
  *   **How to say it:** "If the game allows for infinite expected payoff, EUT loses its grip. The 'Always Switch' argument isn't proof that EUT is broken; it's proof that you've left the domain where EUT gives unique advice. In any real-world scenario (finite bankroll), there is always an $x$ high enough that you should keep."

  **Bridge to Newcomb:**
  *   **TEP "Always Switch":** Relies on comparing conditional expectations that sum to an undefined/unbounded total. It ignores the *ex-ante* symmetry.
  *   **Newcomb "Two-Box":** Relies on the Dominance Principle (I get more regardless of what's in Box B). It ignores the *probabilistic dependence* between your choice and the Predictor's fill.
  *   **The Link:** Both paradoxes arise when you apply a local reasoning rule (Dominance / Conditional Expectation) that violates a global constraint (Ex-Ante Symmetry / Probabilistic Correlation). In Newcomb, as in TEP, the "rational" local move leads to a globally dominated outcome if you ignore the structure of the prior/prediction.

  ### Minute 35–40: The Diagnostic Question
  Do not ask "What is the solution?" Ask this:

  > **"Suppose I offer you a game where, for every specific amount $x$ you see in the envelope, the expected value of switching is strictly greater than $x$. Can I also offer you a side-bet before the game starts that you will end up with less money if you adopt the policy 'Always Switch' compared to 'Always Stay'?"**

  *   **The "Mutterer" (Surface Understanding):** "No, because if switching is better for every $x$, it must be better overall. It depends on the prior."
  *   **The "Got It" (Deep Understanding):** "Yes. If the unconditional expectation is finite, such a prior is impossible (contradiction). If the unconditional expectation is infinite, EUT can't rank the policies, so a side-bet exploiting the difference is possible because the 'Always Switch' policy doesn't actually dominate in terms of realized utility over repeated trials."
  *   **Ideal Answer:** "Yes. If the expectations are finite, the premise is impossible. If the expectations are infinite, EUT is silent, so 'dominance' is ill-defined."

  ### What to Deliberately Leave Out
  1.  **Measure Theory:** Do not write down integrals. Use sums or conceptual descriptions of "heavy tails."
  2.  **Nalebuff's Variant:** There is a version of TEP where the amounts are generated *after* you pick the envelope, which makes switching rational. Do not introduce this. It confuses the "fixed amounts" setup required to bridge to Newcomb (where the boxes are filled *before* you choose).
  3.  **History:** Skip Schwartz, Nalebuff, and Broome citations. They distract from the decision-theoretic structure.
  4.  **Resolution of Newcomb:** Do not solve Newcomb. Use TEP to show *why* Newcomb is hard (the conflict between local dominance and global expectation).

  ### Summary of Misconception Mapping
  | Misconception | Where to Defuse | The Fix |
  | :--- | :--- | :--- |
  | **Variable Equivocation** ($X$ is fixed) | **Closed Version** (Min 5-15) | Distinguish random variable $X$ from realized value $A$. |
  | **Uniform Prior Red Herring** | **Open Version** (Min 15-25) | Show a proper geometric prior where calculation still fails. |
  | **Always Switch Dominance** | **Policy Discussion** (Min 25-35) | Distinguish finite mean (impossible) vs. infinite mean (EUT silent). |
  | **EUT is Broken** | **Bridge to Newcomb** | EUT works if constraints (finitude/independence) are respected. |

  This sequence respects their Bayesian background, uses their mathematical level appropriately, and sets the exact conceptual trap (Dominance vs. Expectation) they will need to navigate in Newcomb's Problem.
