answer: |-
  ### The Diagnostic Tree

  Start by reminding the group: *We all agree proofs give knowledge, CH is a meaningful sentence, and math works on physics. We are not testing your maths; we are testing your intuitions about what the maths is doing.*

  Hand out this flowchart. Tell them to answer honestly, not to aim for a specific leaf.

  **Q1 (The Reduction Case):** Two children learn arithmetic. One is taught $2 = \{\emptyset, \{\emptyset\}\}$ (von Neumann), the other $2 = \{\{\emptyset\}\}$ (Zermelo). Both do perfect maths. Is there a fact of the matter about which child is *wrong* about what the number 2 really is?
  *   **Yes:** Go to **Leaf A**.
  *   **No:** Go to Q2.

  **Q2 (The CH Case):** The Continuum Hypothesis is independent of ZFC. Does the sentence "$2^{\aleph_0} = \aleph_1$" nonetheless have a determinate truth value (true or false) in reality, even if we can't prove it?
  *   **No (It's indeterminate/relative):** Go to Q3.
  *   **Yes (It's determinate):** Go to Q4.

  **Q3 (The Multiverse Case):** If CH has no single truth value, is that because there are many equally real set-theoretic universes (a multiverse), or because set theory is just a game of symbols without a subject matter?
  *   **Many Universes:** Go to **Leaf B**.
  *   **Just Symbols/Game:** Go to **Leaf C**.

  **Q4 (The Arithmetic Uniqueness Case):** Consider the natural numbers. Second-order PA pins them down; first-order PA allows non-standard models. Could there be two non-isomorphic structures that both equally deserve to be called "the natural numbers" in reality?
  *   **Yes (Arithmetic is plural):** Go to **Leaf B**.
  *   **No (There is one unique structure):** Go to Q5.

  **Q5 (The Physics Case):** Could the truth of the Twin Prime Conjecture depend, even in principle, on what our best physical theory requires to model the universe? (i.e., If physics needed finite primes to work, would math bend?)
  *   **Yes (Math serves physics):** Go to **Leaf D**.
  *   **No (Math is autonomous):** Go to Q6.

  **Q6 (The Unapplied Case):** Take a consistent piece of pure algebra that has never been applied to physics and never will. Does it describe something real, or is it merely a consistent fiction?
  *   **Merely Consistent Fiction:** Go to **Leaf E**.
  *   **Describes Something Real:** Go to Q7.

  **Q7 (The Epistemic Case):** If mathematical objects are real but causally inert (they don't bump into us), how do we refer to them? Is it enough to say they have "thin" existence via abstraction, or do we need a "spooky" faculty of intuition to grasp them?
  *   **Spooky Intuition/Direct Grip:** Go to **Leaf F**.
  *   **Thin Existence/Abstraction/Logic:** Go to Q8.

  **Q8 (The Impredicativity Case):** Is it legitimate to define an object by quantifying over a totality that includes the object itself (e.g., defining the least upper bound by quantifying over all real numbers)?
  *   **No (Vicious Circle):** Go to **Leaf G**.
  *   **Yes (Legitimate):** Go to **Leaf H**.

  *(Note for the facilitator: If Q7 leads to "Thin," you may need a quick tie-breaker for Leaf I vs Leaf H based on whether they think the "thin" things are objects or structural positions.)*

  ---

  ### The Leaves

  **Leaf A: Set-Theoretic Reductionism**
  *   **Position:** There is a fact about which set reduction is correct; numbers *are* sets.
  *   **Awkward Commitment:** You must explain why centuries of mathematicians did valid work without knowing what their objects actually were.

  **Leaf B: Plenitudinous Platonism / Multiverse View**
  *   **Position:** All consistent mathematical structures exist; there is no single universe of sets or unique N.
  *   **Awkward Commitment:** You lose the ability to say a statement like CH is simply "true," which clashes with standard mathematical practice.

  **Leaf C: Formalism**
  *   **Position:** Mathematics is the manipulation of symbols according to rules; consistency is the only reality.
  *   **Awkward Commitment:** You have to explain why this symbol game predicts the behaviour of subatomic particles with ridiculous success.

  **Leaf D: Naturalism (Quinean)**
  *   **Position:** Mathematical truth is continuous with scientific truth; math is validated by its role in our best physical theory.
  *   **Awkward Commitment:** You might have to accept that if physics changes, the truth of "2+2=4" could theoretically change.

  **Leaf E: Fictionalism**
  *   **Position:** Mathematical sentences are literally false (no objects exist), but useful fictions.
  *   **Awkward Commitment:** You must explain how we can have knowledge of a fiction without being systematically deceived.

  **Leaf F: Gödelian Platonism**
  *   **Position:** Mathematical objects exist independently and uniquely; we grasp them via a form of mathematical intuition.
  *   **Awkward Commitment:** You must defend the existence of a cognitive faculty that detects causally inert objects, which sounds like magic to scientists.

  **Leaf G: Constructivism / Predicativism**
  *   **Position:** Mathematical objects must be constructible or definable without vicious circles; classical logic is too strong.
  *   **Awkward Commitment:** You must reject standard theorems of analysis (like the Least Upper Bound property in its classical form) that your colleagues use daily.

  **Leaf H: Ante Rem Structuralism**
  *   **Position:** Structures exist independently of systems; numbers are positions in a pattern, not objects with internal identity.
  *   **Awkward Commitment:** You struggle to explain the identity of indiscernibles (how to tell apart two identical positions in a symmetric structure).

  **Leaf I: Neo-Logicism**
  *   **Position:** Mathematical objects are "thin" posits secured by logical abstraction principles (like Hume's Principle).
  *   **Awkward Commitment:** You must argue that existence claims can be derived purely from logical definitions without smuggling in metaphysical assumptions.

  *(Note: If someone lands between H and I, they are likely an **In Re Structuralist** (Leaf J), who thinks structures only exist insofar as they are instantiated in physical systems. **Awkward Commitment:** You cannot account for infinite sets or large cardinals that have no physical instantiation.)*

  ---

  ### Diagnostics for the Facilitator

  **(a) Unoccupied Combinations**
  You will likely find no one at the intersection of **Fictionalism (Leaf E)** and **CH Determinacy (Q2-Yes)**. It is incoherent to claim mathematical objects are fictions while insisting independent sentences have determinate truth values. Similarly, **Constructivism (Leaf G)** combined with **Plenitudinous Platonism (Leaf B)** is unoccupied; if you require construction, you cannot accept all consistent structures as real. These gaps aren't just unattractive; they represent logical tensions in the definitions.

  **(b) Indistinguishable Leaves**
  Be prepared for **Gödelian Platonism (Leaf F)** and **Ante Rem Structuralism (Leaf H)** to collapse. For a working mathematician, "grasping the number 2" and "grasping the 2-position in the natural structure" feel identical in practice. The tree separates them on the *Epistemic Case (Q7)*, but many participants will say "It's structure" but "We intuit it," blurring the line. If this happens, acknowledge that for practical purposes, these views function identically in a proof, differing only when pressed on the metaphysics of *what* is being intuited. Also, **Neo-Logicism (Leaf I)** often collapses into **Platonism (Leaf F)** if the participant admits the "logical" abstraction principles feel like discoveries about reality rather than definitions.
