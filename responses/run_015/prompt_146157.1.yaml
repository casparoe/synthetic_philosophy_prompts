      *   **Harnad (SGP):** Focuses on how symbols get their meaning. He argues symbols can't just refer to other symbols (infinite regress). They must "bottom out" in something non-symbolic. For Harnad, this "bottoming out" is specifically *sensorimotor interaction* with the world. It's about the *connection* to reality, not necessarily the internal "feeling" of understanding (though they are related).

