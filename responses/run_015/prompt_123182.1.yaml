answer: |-
  You are not imagining this, and you are not out of your depth. You have identified a specific, recurring rhetorical and technical maneuver that sits at the boundary of computer science, cognitive science, and philosophy of mind. It does not have a single canonical Latin name like *ad hominem*, but in technical circles, it is most closely associated with **Meta-Complexity** or the **Hardness of Recognition**.

  Philosophically, it is a shift from an **ontic** claim (about what the system does) to an **epistemic** claim (about what the system can know about what it does).

  Here is the carving you asked for: what the move is, its nearest neighbors, and the criteria for distinguishing a legitimate reduction from a swindle.

  ### 1. What is the move?
  Let's call it **The Meta-Complexity Shift**.

  The structure is as follows:
  1.  **Object-Level Claim:** Task $T$ is intractable (e.g., NP-hard) in the worst case.
  2.  **Objection:** Agents (humans/brains) never encounter worst-case instances; they encounter a specific, benign distribution $D$.
  3.  **The Shift:** To exploit distribution $D$, the agent must first *identify* that an input $x$ belongs to $D$ (or to a tractable subset $S \subset D$).
  4.  **Meta-Level Claim:** The problem of *recognizing* membership in $S$ is itself intractable.
  5.  **Conclusion:** Therefore, the agent cannot reliably access the tractable subset, so the original intractability bound effectively holds.

  In your examples:
  *   **Route Planning:** It's not just that finding the path is hard; it's that *knowing which map configurations allow easy pathfinding* is hard.
  *   **P=NP/Creativity:** It's not just that finding the proof is hard; it's that *knowing which algorithm works for this class of proofs* (or bounding the constant) is inaccessible.
  *   **Bayesian Inference:** It's not just that exact inference is hard; it's that *certifying the approximation is good enough* is hard.

  ### 2. Nearest Named Concepts (and how they differ)

  **A. Worst-Case vs. Average-Case Complexity**
  *   *The Concept:* Standard CS distinction. Worst-case looks at the hardest input of size $n$; average-case looks at expected time over a distribution.
  *   *The Difference:* The Meta-Complexity Shift accepts the average-case concession but argues that *computing the average* (or identifying the distribution) is part of the cost. It treats the "distribution" not as a given external fact, but as something the agent must compute or recognize internally.

  **B. The Motte-and-Bailey Fallacy**
  *   *The Concept:* Retreating to a defensible position (the Motte) when attacked, then claiming the original controversial position (the Bailey) is safe.
  *   *The Difference:* You correctly sensed this isn't quite it. In a Motte-and-Bailey, the retreat is usually dishonest. In the Meta-Complexity Shift, the retreat is often technically valid: if you can't identify the easy cases, you *are* stuck with the hard cases. The "swindle" aspect only comes in if the agent doesn't actually *need* to identify the cases (see "Legitimacy" below).

  **C. Non-Constructive Existence (Constructivism)**
  *   *The Concept:* Proving an object exists without showing how to find it.
  *   *The Difference:* This covers the P=NP example well (an algorithm exists, but we don't know it). However, it doesn't cover the Bayesian example, where the algorithm (sampling) exists and is used, but the *guarantee* is missing. The Meta-Complexity Shift is broader: it's about the cost of *certainty* or *selection*, not just existence.

  **D. The Frame Problem (AI)**
  *   *The Concept:* How does an agent know which facts remain unchanged after an action?
  *   *The Difference:* This is about relevance. The Meta-Complexity Shift is about *tractability*. They are cousins: both ask, "How does the mind filter the infinite space of possibilities down to the relevant/computable ones without spending forever filtering?"

  ### 3. When is it legitimate, and when is it a swindle?

  This is the crux of your question. The move relocates the difficulty from **solving** to **accessing**. Whether this is valid depends on the **Architecture of the Agent**.

  #### Case 1: The Swindle (The "Homunculus" Error)
  The move is illegitimate when it assumes the agent needs a **meta-algorithm** to select the **object-algorithm**.

  *   **Scenario:** A critic says, "The brain can't do vision because inverting the light field is ill-posed." The defender says, "But we use heuristics." The critic replies, "But choosing the right heuristic is NP-hard."
  *   **Why it's a swindle:** This assumes the brain works like a classical symbolic AI: *Input -> Classifier -> Select Algorithm -> Run Algorithm.*
  *   **The Reality:** In connectionist or embodied systems (like actual brains), there is no separation between "recognizing the case" and "solving the case." The neural network *is* the solution. It doesn't first check "Is this a face?" and then run "Face_Recognizer.exe." It just processes the pixels. The "recognition" is implicit in the weights.
  *   **The Test:** If the proposed mechanism requires a "manager" to check the complexity of the input before processing it, the Meta-Complexity Shift is legitimate. If the mechanism is **end-to-end** (the processing *is* the recognition), the shift is a swindle.

  #### Case 2: Legitimate (The "Certification" Requirement)
  The move is legitimate when the task requires **verification** or **guarantees**.

  *   **Scenario:** Mathematical proof or safety-critical planning.
  *   **Why it's legitimate:** Here, outputting an answer isn't enough; you must *know* it is right. If P=NP, we can find proofs, but if we can't verify the verification process (or bound the constants), we don't have *knowledge*, we just have lucky guesses.
  *   **The Test:** Does the capacity require **internal access** to the correctness? If the mind needs to *know* it understands (metacognition), then the hardness of certifying understanding is relevant. If the mind just needs to *act* successfully, it is not.

  #### Case 3: The Circularity (Your Specific Worry)
  You noted: *"The instances that matter look definable only by appeal to the very capacity we were trying to say something about."*

  This is the **Ecological Rationality** critique (associated with Gerd Gigerenzer).
  *   **The Argument:** The "benign instances" aren't benign by accident. They are benign *because* the mind evolved to handle them. The environment and the mind are co-adapted.
  *   **The Circularity:** To ask "How does the mind recognize the instances it can handle?" is to ask "How does the mind recognize itself?"
  *   **Why the Shift fails here:** The Meta-Complexity Shift assumes the distribution of problems is **exogenous** (given from outside, like a math problem set). In cognition, the distribution is **endogenous** (we create problems we can solve, or we evolved in a niche we fit).
  *   **The Verdict:** If the "instances that matter" are defined by the agent's success, then claiming "recognizing them is hard" is circular. It's like saying, "It's hard to find the key that fits this lock," when the lock was cast around the key.

  ### 4. Summary Definition

  If you need to name this in the room, I suggest calling it **"The Access Barrier"** or **"The Meta-Complexity Shift."**

  **Definition:** An argumentative move that preserves a computational impossibility claim by conceding that easy instances exist, but asserting that the *identification* or *certification* of those instances is itself computationally intractable for the agent.

  **Boundary Conditions:**
  1.  **Legitimate:** When the agent requires **certificates of correctness** (math, logic, safety) or must **switch strategies** explicitly (classical AI architecture).
  2.  **Illegitimate:** When the agent operates via **implicit, end-to-end processing** (neural nets, embodied cognition) where recognition and solution are unified.
  3.  **Circular:** When the "easy instances" are defined **teleologically** by the agent's own success (evolutionary/ecological fit), making the cost of recognition a category error.

  ### 5. Why it feels unsatisfying to you
  It feels unsatisfying because it conflates **competence** (what the system can do) with **performance** (what the system can justify).

  In medieval land law (to borrow your expertise), this would be like arguing a tenant cannot hold land because the *title search* to prove the land is free of encumbrances is too expensive. The counter-argument is: "They aren't doing a title search; they are just farming it, and the King accepts the rent."

  The computationalist says: "But without the search, they don't *know* they hold the land."
  The cognitivist says: "They don't need to know; they just need to farm."

  The Meta-Complexity Shift is the attempt to force the farmer to pay for the title search by claiming that *farming without the search* is theoretically indistinguishable from *trespassing*. That is the philosophical heart of the move you are spotting.
