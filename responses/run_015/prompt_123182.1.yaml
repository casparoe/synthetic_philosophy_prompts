prompt: |-
  I'm a graduate student in something completely unrelated (medieval land law) and I've been sitting in on a reading group on computation and the mind, so I'm the least qualified person in the room and I've probably been noticing something everyone else already has a word for. But I keep seeing the same move, and I'd like to know what it is.

  It goes like this. Someone wants to show that some human capacity — understanding a sentence, or planning a route, or telling a morally relevant difference — can't just be a matter of running a mechanical procedure. The evidence offered is a complexity result: formalized in a reasonable-looking way, the task comes out NP-hard or worse, so no efficient procedure does it in general. Invariably someone points out that the hard instances are cooked up: enormous, gnarly, stuffed with structure no person ever actually encounters. And the reply, which I've now heard in three or four versions from three or four different people, is: sure, but the subset of instances that actually matter isn't something you can pick out efficiently either — there's no fast way to tell whether a given instance is one of the benign ones — so the difficulty hasn't been explained away at all, it has just moved into our inability to carve out the good cases.

  The same shape keeps turning up elsewhere. Someone argues that if P were equal to NP then mathematical creativity would be finished, since finding a proof would be no harder than checking one; you object that "polynomial" isn't "feasible" when the exponent is huge, and you get told that the exponent is beside the philosophical point, which is only about whether an algorithm exists. Or: someone argues that the brain can't be doing Bayesian inference because exact inference is intractible; you point out that variational and sampling methods do fine in practice; you get told that those carry no guarantees, so they aren't really Bayesian inference, and the intractability result stands. In each case what strikes me is that the conclusion keeps all its force while the content that made the result interesting gets conceded away, and what's left standing is a claim about our access to the problem — we can't recognize the easy instances, we can't bound the constants, we can't certify the approximation — rather than about the problem or the capacity itself.

  So: does this move have a name? I dont think it's just the usual complaint that hardness results are only worst-case, though it sits right next to that; and I don't think it's the thing where someone defends a strong claim by retreating to a weaker one under pressure and then quietly resuming the strong one, though it sits next to that too. It also feels close to something about non-constructivity — the gap between an algorithm existing and our being able to say which algorithm — but not identical. I'm not after a bibliography or citations I can't check; I want the carving. What exactly is the move, what are the nearest named things and where does it differ from each, does one of them fit best or is this genuinely unnamed, and if it's unnamed, what would you call it, how would you define it, and what are its boundary cases — in particular, when is relocating the difficulty into our own access actually legitimate (a real reduction of the philosophical claim to a claim about unrecognizability, or about missing certificates) and when is it a swindle? One last thing that bugs me and that I'd want any definition to handle: in the first case, "the instances that matter" look definable only by appeal to the very capacity we were trying to say something about, so the relocation may be circular rather than merely weak.
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Request:**
      *   **Background:** Graduate student in medieval land law (non-expert in comp sci/cog sci), sitting in on a computation/mind reading group.
      *   **Observation:** Notices a recurring argumentative move.
      *   **The Move:**
          1.  Claim: Human capacity $X$ cannot be mechanical procedure $Y$ because $Y$ is computationally intractable (NP-hard, etc.).
          2.  Counter: Real-world instances aren't the worst-case "cooked up" ones.
          3.  Reply: True, but identifying the "real-world/easy" instances is *itself* intractable. Therefore, the intractability remains, just shifted from *solving* the problem to *identifying* the solvable cases.
          4.  Variations: P=NP debate (existence vs. feasibility), Bayesian inference (exact vs. approximate/no guarantees).
      *   **Core Characteristic:** The conclusion retains its force (intractability/impossibility) while conceding the original ground (worst-case inputs), shifting the burden to *meta-level access* (recognizing easy cases, bounding constants, certifying approximations).
      *   **Questions:** Does this move have a name? What are the nearest named concepts? How does it differ? Is it legitimate or a swindle? When is the relocation of difficulty valid vs. circular?
      *   **Tone:** Intellectual, precise, philosophical, slightly skeptical but open. Avoids jargon-heavy bibliographies, wants "the carving."

  2.  **Deconstruct the Argumentative Move:**
      *   *Premise 1:* Task $T$ is hard in the worst case.
      *   *Premise 2:* Humans don't face worst cases.
      *   *Rebuttal:* Distinguishing worst cases from average/benign cases is *also* hard.
      *   *Implication:* You can't exploit the easiness because you can't find it.
      *   *Underlying Logic:* It's a closure principle. If you can't efficiently *filter* for easy instances, you must assume the hard complexity bound applies to the agent anyway.

  3.  **Brainstorming Names/Concepts:**
      *   *Worst-case vs. Average-case complexity:* This is the context, but not the name of the *move*.
      *   *Smoothed Analysis:* Related (Spielman/Teng), but that's a mathematical technique, not the philosophical move.
      *   *No Free Lunch Theorems:* Related (optimization), but not quite.
      *   *The Frame Problem:* Related to AI/cognition, but distinct.
      *   *Gödelian Escape / Lucas-Penrose Argument:* Related to "mind vs. machine," but usually relies on incompleteness, not complexity.
      *   *Epistemic Closure / Access Internalism:* Philosophical terms. The move relies on the idea that if you can't *know* you're in the easy case, you don't *have* the easy solution.
      *   *Meta-Complexity:* Complexity of recognizing complexity. This is technically what's happening.
      *   *The "Hardness of Recognition" Move:* Descriptive.
      *   *Levin Search / Universal Search:* Related to P=NP discussions.
      *   *Worst-Case to Average-Case Reductions:* In crypto, we prove average case is hard by reducing worst case to it. This is the inverse: claiming average case is hard because filtering is hard.
      *   *The "Certification Gap":* Focusing on the inability to certify the solution.

  4.  **Identifying the Best Fit:**
      *   There isn't a single canonical Latin phrase for this specific rhetorical maneuver in cognitive science.
      *   However, it aligns closely with **"The Hardness of Recognition"** or **"Meta-Complexity Barriers."**
      *   Philosophically, it resembles **"Epistemic Closure"** applied to computational resources.
      *   In the specific context of the "P=NP implies creativity" debate, it's often called the **"Constructivity Objection"** or **"Non-Constructive Existence."**
      *   In the Bayesian context, it's the **"Normative vs. Descriptive"** gap, specifically regarding **"Computational Level (Marr)"** vs. **"Algorithmic Level."**
      *   *Crucial Insight:* The user describes a situation where the *boundary* of the tractable set is itself intractable. This is formally known as the **Hardness of Distinguishing Instances** or **Instance Recognition Hardness**.
      *   Is there a fallacy name? It feels like a **Motte-and-Bailey** (retreat to "existence of algorithm," claim "creativity is dead"), but the user explicitly said it's *not* quite that.
      *   It feels like a **Category Error** between *Ontic* (what the system does) and *Epistemic* (what we know about the system).
      *   *Best Technical Term:* **Meta-Complexity** (specifically, the complexity of identifying tractable subsets).
      *   *Best Philosophical Term:* **The Access Problem** or **Epistemic Intractability**.

  5.  **Developing the "Carving" (Analysis):**
      *   *Name:* Let's call it **"The Meta-Complexity Shift"** or **"The Recognition Barrier."** In literature, it's often discussed under **"Average-Case Complexity vs. Distributional Complexity."**
      *   *Legitimacy:* When is it valid? When the agent *needs* to know it's solved (certification). When is it a swindle? When the agent just needs to *output* the answer without knowing *why* it's right (oracle style).
      *   *Circularity:* The user notes the "instances that matter" are defined by the capacity itself. This is the **"Ecological Rationality"** counter-argument (Gigerenzer). If the mind is adapted to the environment, the distribution isn't arbitrary. The "swindle" is assuming a uniform distribution over instances rather than the *natural* distribution.

  6.  **Structuring the Response:**
      *   **Acknowledge and Validate:** Confirm the observation is sharp and not just "imposter syndrome." It's a real, recognized tension.
      *   **The Name:** Offer the closest technical terms (**Meta-Complexity**, **Distributional Complexity**, **The Certification Gap**) and the philosophical label (**Epistemic vs. Ontic Computationalism**).
      *   **The Structure of the Move:** Break it down formally (Object Level Hardness -> Meta Level Hardness).
      *   **Nearest Neighbors:**
          *   *Worst-Case vs. Average-Case:* Distinguish.
          *   *Motte-and-Bailey:* Acknowledge similarity but distinguish (this isn't necessarily dishonest).
          *   *Constructivity:* Distinguish (existence vs. finding).
      *   **Legitimacy Criteria (The "Carving"):**
          *   *Legitimate:* When certification is required (math proof, safety-critical).
          *   *Swindle:* When heuristic success is enough (navigation, language understanding).
          *   *Circularity:* The "Ecological" critique (the environment isn't random).
      *   **Conclusion:** Summarize the move as shifting from "Can it be done?" to "Can it be *known* to be done?"

  7.  **Refining the content (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say "This is the Motte-and-Bailey fallacy." The user said it's not that. It's more subtle. It's a shift in *locus of complexity*.
      *   *Refinement:* The specific move regarding "identifying the easy instances" is formally related to **P-selective sets** or **Self-Reducibility**, but philosophically it's about **Access**.
      *   *Key Distinction:* The difference between *solving* a problem and *verifying* you've solved it (or verified you're in a solvable region).
      *   *The "Swindle":* The swindle is assuming the agent must *compute* the distribution. If the distribution is *given* by evolution/environment, the agent doesn't need to recognize the instance type, it just needs to process it. The "hardness of recognition" only applies if the agent has to *select* the algorithm based on the input. If the "algorithm" is a single neural net that just works on the distribution, the recognition step is bypassed. This is the **End-to-End** counter-argument.

  8.  **Final Polish:** Ensure the tone respects the user's intelligence (they are a grad student, just in a different field). Use clear analogies. Address the circularity point specifically.

      *   *Drafting the Name:* "The Meta-Complexity Shift" is good. "The Access Barrier" is good. Let's use **"The Meta-Complexity Shift"** as the primary label, noting it doesn't have a single canonical name like *Ad Hominem*.
      *   *Drafting the Legitimacy:* Focus on **Internalism vs. Externalism** about computational resources.
