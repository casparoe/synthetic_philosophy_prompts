      *   *The "Generation" aspect:* For Hobbes, *scientia* is knowledge of consequences. In geometry, we know the cause because we posit it. In physics, we guess the cause. In politics, we posit the cause (the covenant).
      *   *The User's Test:* The student with the wobbly ruler *does* know the theorem, provided they grasp the *definition* (the rule of generation). The physical drawing is secondary. But Hobbes *wants* it to be primary to maintain materialism. That's the crack.

  6.  **Final Polish:** Organize into clear headers matching the user's requested "machinery." End with the politics implication. (Proceed to generate output based on this structure.)

      *   *Key Insight to emphasize:* The "necessity" comes from the *arbitrariness* of the definition. Because we impose the meaning, we exhaust the possibilities.
