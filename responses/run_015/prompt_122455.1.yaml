  7.  **Final Review against constraints:** No reading list. No citations. Walk through the parts. Address the equivocation. Address the politics.

      *(Self-Correction during drafting)*: Make sure to explicitly answer the "wobbly ruler" question. Does the student know it? Yes, on Hobbes's best day. No, on his materialist day. That's the equivocation.

      *(Refining the Politics section)*: Connect the "Artificial Man" to the "Generated Figure." The Commonwealth is a geometric figure we construct. That's why the science is possible.

      *(Final check)*: Ensure the tone is analytical, not dismissive. Hobbes is tricky, not just stupid. The tension is productive.

