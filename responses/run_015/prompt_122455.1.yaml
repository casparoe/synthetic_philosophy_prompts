          *   *The Boast:* It's both. It's a real methodological claim (constructivism) but it relies on the same equivocation as the math. It works *if* everyone accepts the definitions (the Covenant). If they don't, the "demonstration" is just words.

  4.  **Refining the Tone:**
      *   Keep it peer-to-peer (grad student level).
      *   Avoid pedantry.
      *   Be direct about the instability in Hobbes's system.
