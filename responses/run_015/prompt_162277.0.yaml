answer: |-
  This is an exceptionally sharp puzzle. You have correctly identified one of the central fault lines in legal theory: the tension between **corrective justice** (the domain of torts) and **distributive efficiency** (the domain of regulation).

  First, the most important confidence flag: **Your puzzle is not fake.** [High Confidence]
  You have not muddled unrelated doctrines. The divergence you describe between the bilateral structure of tort litigation and the aggregative structure of administrative cost-benefit analysis (CBA) is a well-documented feature of the U.S. legal system. It is discussed extensively in the literature on "ex post vs. ex ante" perspectives (e.g., work by Louis Kaplow, Steven Shavell, and Cass Sunstein).

  However, your inference that this divergence *necessarily* rests on the "separateness of persons" metaphysics is where the confidence drops. The law often arrives at non-aggregative outcomes for pragmatic, institutional, or doctrinal reasons that are compatible with utilitarianism, even if they *look* like Rawlsianism.

  Here is the breakdown of what the practice requires, what it tolerates, and where the metaphysics actually enter.

  ### 1. What does the refusal to net presuppose?

  **The Practice:** In tort law, a defendant generally cannot argue, "I harmed the plaintiff, but my activity created more social value elsewhere, so I owe nothing." (See *Vincent v. Lake Erie Transp. Co.*: necessity is a privilege to act, not a privilege to avoid paying).

  **Does this require the "Separateness of Persons"?**
  **[Low Confidence that it requires metaphysics] / [High Confidence that it requires institutional structure]**

  You do not need a metaphysical commitment to the separateness of persons to justify this rule. You can justify it entirely on **rule-utilitarian** or **institutional competence** grounds:
  *   **Information Costs:** A court is a bilateral forum. It is equipped to hear evidence about *this* plaintiff and *this* defendant. It is not equipped to audit the defendant's entire supply chain, employment records, and consumer surplus effects to calculate net social welfare. Allowing a "ledger defense" would make trials unmanageably complex and error-prone.
  *   **Incentive Effects:** If defendants could net benefits against harms, they would have an incentive to over-invest in high-volume activities that generate diffuse benefits but concentrate harms, knowing they can offset liability. A strict liability rule (pay for the harm you cause) forces the actor to internalize the cost, which leads to efficient outcomes *without* the court needing to do the math.
  *   **Corrective Justice:** This is the non-utilitarian explanation (championed by scholars like Ernest Weinrib). It argues that tort law is about rectifying a wrong between two specific parties. Aggregation dissolves the "wrong" into a "social cost."

  **Verdict:** The practice *sits well* with the separateness of persons objection, but it does not *strictly require* it. A sophisticated act-utilitarian could support the refusal to net in court because the administrative costs of netting outweigh the benefits, or because a rigid rule produces better long-term consequences.

  ### 2. Which features strictly require an anti-aggregation view?

  Here we must distinguish between **liability rules** and **standing rules**.

  **A. Standing (The "Injury in Fact" Requirement)**
  *   **Practice:** Article III standing requires a "concrete and particularized" injury. You cannot sue because a regulation hurts "the environment" or "the public" unless it hurts *you* specifically.
  *   **Confidence:** [High] This is constitutional doctrine (*Lujan v. Defenders of Wildlife*).
  *   **Does it require anti-aggregation?** Yes, structurally. The federal judicial power is limited to "Cases" and "Controversies." A generalized grievance (an aggregative harm shared by all) is not a case. This is a structural limit on the judiciary, not necessarily a moral claim about persons, though it functions to prevent the courts from becoming mini-legislatures.

  **B. Compensatory Damages**
  *   **Practice:** Damages are calculated to make the *plaintiff* whole, not to optimize social welfare.
  *   **Confidence:** [High]
  *   **Does it require anti-aggregation?** No. As noted above, a utilitarian can support individual compensation as a mechanism for deterrence. However, if you adopted a *pure* aggregative view, you might replace compensatory damages with **fines paid to the state**. If the goal is total welfare, it doesn't matter who gets the money, so long as the defendant pays the social cost. The fact that the money goes to the *victim* suggests a commitment to the victim's specific claim, which leans toward anti-aggregation.

  **C. The "Learned Hand Formula" (Negligence)**
  *   **Practice:** In negligence, courts *do* aggregate. They weigh the Burden (B) against the Probability (P) times Loss (L). This is explicitly utilitarian.
  *   **Confidence:** [High]
  *   **Implication:** This contradicts the idea that tort law is wholly non-aggregative. Tort law aggregates *risks* ex ante (was the conduct unreasonable?) but refuses to aggregate *outcomes* ex post (you still pay the specific victim).
  *   **Verdict:** The system is hybrid. It uses aggregation to determine *if* you were wrong, but refuses aggregation to determine *what you owe*.

  ### 3. Are the Per-Person Bit and Pure-Risk Bit consistent?

  You noted: Tort shrugs at pure risk (exposure); Regulation thrives on it (VSL).

  **[High Confidence] These are consistent, but they serve different temporal functions.**
  *   **Tort is Ex Post:** It remedies realized harms. Pure risk is not a harm in corrective justice because nothing has been "taken" from the plaintiff yet (though some jurisdictions allow "medical monitoring" claims, this is the exception).
  *   **Regulation is Ex Ante:** It manages future risks. It *must* aggregate because it is deciding whether to allow a risk-imposing activity before the harm occurs.

  **The Inconsistency:** The inconsistency arises in **mass exposure cases** (e.g., toxic torts). If 1,000 people are exposed to a carcinogen, tort law often denies recovery until cancer manifests (statute of limitations issues, causation issues). Regulation would have banned the exposure based on the statistical deaths.
  *   **Why?** Tort law demands **causal proof** (more likely than not, *this* chemical caused *this* cancer). Regulation demands **statistical correlation**.
  *   **Metaphysical implication:** Tort law treats persons as distinct causal chains. Regulation treats persons as a statistical population. This *is* a form of the separateness of persons objection in practice, even if courts don't cite Rawls.

  ### 4. If we swapped in the aggregative view wholesale, what changes at trial?

  If you implemented the "Ledger Defense" and full aggregation (a pure utilitarian tort system):

  1.  **Standing:** Would vanish or expand to "citizen suits." Anyone could sue for net negative welfare, even without personal injury. [High Confidence]
  2.  **Verdict Form:** Would not ask "Did Defendant harm Plaintiff?" but "Did Defendant's activity reduce net social welfare?" [Theoretical Inference]
  3.  **Remedy:** Damages would likely become **fines payable to the Treasury**, not compensation to the victim. Why pay the victim if the goal is just to price the externality? The victim is just the location where the cost manifested. [High Confidence]
  4.  **Causation:** Would shift from "but-for" causation to **probabilistic causation**. If your activity raised the risk by 10%, you pay 10% of the damages, regardless of whether you actually caused this specific plaintiff's injury. (Some scholars propose this, but it is not current law).

  ### 5. Is there a version of the "Ledger Defense" a utilitarian should reject?

  **[High Confidence] Yes.**

  A **Rule Utilitarian** (or an Institutional Utilitarian) would likely reject the Ledger Defense in court, even if they accept aggregation in regulation.
  *   **Reasoning:** Allowing defendants to introduce evidence of social benefits in every trial creates massive **transaction costs**, uncertainty, and potential for bias (judges are bad at macroeconomics).
  *   **Division of Labor:** The utilitarian argument is that we should have *two* systems.
      1.  **Regulation (Ex Ante):** Decide which activities are socially valuable on net. Allow them.
      2.  **Torts (Ex Post):** If the regulated activity still causes harm, make the actor pay. This ensures the cost is internalized without re-litigating the social value of the industry in every courtroom.
  *   **The Trap:** If you allow the Ledger Defense in tort, you undermine the regulatory scheme. The agency already decided the plant was worth it (hence the permit). If the court then says "Actually, netting the specific harm, you owe nothing," you lose the deterrence signal. If the court says "You owe damages despite the net benefit," you preserve the incentive to minimize harm *within* the socially useful activity.

  ### Summary of Confidence & Reconstruction

  | Claim | Confidence | Notes |
  | :--- | :--- | :--- |
  | **The Puzzle is Real** | **High** | The Tort/Regulation split is a standard topic in legal theory. |
  | **Tort refuses to net benefits** | **High** | With exceptions for "public necessity" (rare) and negligence calculus (ex ante). |
  | **Regulation aggregates welfare** | **High** | Mandated by Executive Order 12866 for major rules. |
  | **This requires "Separateness of Persons" metaphysics** | **Low** | Institutional competence and rule-utilitarianism explain it equally well. |
  | **Tort treats risk differently than Regulation** | **High** | Tort requires manifestation; Regulation acts on probability. |
  | **A Utilitarian must support the Ledger Defense** | **Low** | Rule-utilitarians would likely reject it due to admin costs and institutional role. |

  ### Where you might be over-reading (The "Mistake" Check)

  You asked me to flag if you muddled doctrines. There is one nuance: **Class Actions.**
  *   **Your Claim:** "I half-remember some rule about not being allowed to add together different people's claims to reach a jurisdictional threshhold."
  *   **Correction:** This used to be true (*Snyder v. Harris*, 1969), but the **Class Action Fairness Act (CAFA)** of 2005 largely overturned this for interstate class actions. Aggregation of claims to meet the $5 million threshold is now standard in class actions.
  *   **Implication:** The legal system *does* allow aggregation when the procedural mechanism shifts from "individual litigation" to "representative litigation." This supports the **Institutional Competence** theory: Courts won't aggregate for 100 individual plaintiffs (too messy), but they will for 1 class representative (manageable). This weakens the "metaphysical separateness" argument and strengthens the "administrative burden" argument.

  ### Final Answer to Your Core Question

  **What does the refusal to net presuppose?**
  It presupposes a **bilateral conception of the trial**, not necessarily a metaphysical conception of the person. The court sees itself as an arbiter between *A* and *B*, not a regulator of *Society*.

  **Does it need the anti-aggregation view?**
  No. It merely **tolerates** it. The practice is compatible with corrective justice (anti-aggregation) *and* rule-utilitarianism (pro-aggregation theory, anti-aggregation procedure).

  **If you want to find the "Separateness of Persons" in the wild:**
  Look at the **remedy**, not the liability. The fact that the check is written to the *victim*, not the state, is the strongest evidence that the law views the victim as having a specific claim that cannot be dissolved into the general welfare. That is the closest the law gets to Nozick. But even that can be explained as a heuristic for efficient deterrence.

  You have found a real tension, but it is likely a tension of **institutional design** (Courts vs. Agencies) rather than **moral metaphysics** (Persons vs. Utilities).
