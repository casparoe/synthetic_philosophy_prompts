answer: |-
  This is a rigorous framework, and the Colston episode is a stress test severe enough to reveal its load-bearing walls and its fault lines. Below is an application of your four claims to the Bristol case, followed by the requested stress tests, contrastive analysis, and engagement with memory theory.

  ### 1. The Act/Object Distinction (Persistence as Re-dedication)
  **The Claim:** Leaving a statue up is not neutrality; it is a renewal of the claim.
  **The Test:** Bristol City Council's position between 1895 and 2020 was effectively one of "benign neglect" turned "anxious stewardship." They argued that keeping the statue up while adding context (the stalled 2018 plaque) was a middle path.
  **The Verdict:** The framework holds, and it bites hard. The failure to remove or significantly alter the monument between the rise of the Black Lives Matter movement (2013 onwards) and 2020 was interpreted by the protesters—and subsequently by the jury—not as neutrality, but as an active choice to prioritize the comfort of the status quo over the dignity of the descendants of the enslaved. In public space, inertia is a speech act. By leaving Colston on the plinth, the city was indeed "re-dedicating" him, or at least re-endorsing his right to occupy that civic center. The framework's strongest claim does not collapse; rather, it exposes the myth of the "neutral curator." There is no passive voice in monumental politics.

  ### 2. Modes of Display (Honorific, Documentary, Admonitory)
  **The Claim:** Museums convert Honorific display into Documentary or Admonitory.
  **The Test:** The statue is now in the M Shed museum, lying on its back, graffitied.
  **The Verdict:** This is where the framework succeeds but requires nuance regarding the *graffiti*. Standard musealisation often sanitizes: the object is cleaned, placed behind glass, and stripped of its power to offend. Bristol did the opposite. By preserving the paint and the prone position, the museum created a hybrid mode. It is **Documentary** (evidence of the slave trade) but also **Admonitory** (a warning about racial injustice) and, crucially, **Testimonial** (evidence of the 2020 uprising).
  Does this defuse the honorific force? Yes, because the "gaze" of the statue is broken; it is no longer looking down on the citizenry from a height. However, it does not settle the question. The display keeps the wound open. It refuses to let the city "move on" to a clean narrative. The framework predicts a conversion; the reality was a *preservation of conflict*. The museum did not resolve the tension; it institutionalized it.

  ### 3. Standing (Who is Entitled to Alter the Settlement?)
  **The Claim:** A question of entitlement (Residents, Descendants, Council, Crowd).
  **The Test:** The acquittal of the "Colston Four" in January 2022.
  **The Verdict:** This is the most significant pressure point for the framework. Theoretically, "Standing" belongs to the legal owners (the Council) or the democratic representatives. The crowd has no standing in law. However, the jury's acquittal (based on the belief that the defendants had a "lawful excuse" rooted in conscience) effectively granted **retrospective standing** to the crowd.
  The framework asks "Who is entitled?" The trial answered: "Those whose moral claim outweighs the property right, as judged by their peers." This complicates your third claim. Standing is not a fixed category (like 'donor' or 'resident'); it is a contested status that can be seized and then legitimated. The framework treats standing as a pre-condition for action; the Colston case shows standing can be a *post-condition* of action. The crowd acted *as if* they had standing, and the legal system eventually agreed.

  ### 4. Iconoclasm: From Below vs. Official Removal
  **The Claim:** Distinction between crowd action and official channels.
  **The Test:** The toppling was from below; the museum placement and 2025 plaque were official.
  **The Verdict:** The framework distinguishes these cleanly, but the Colston episode shows them as a sequence rather than a binary. The "Iconoclasm from Below" forced the "Official Removal/Recontextualization." Without the rope, the plaque would not have been installed in 2025. The framework holds, but it must acknowledge that "Official Removal" is often just "Iconoclasm from Below" that has successfully lobbied the authorities. The distinction is less about the *outcome* and more about the *legitimacy narrative*.

  ---

  ### Contrast Case: The Rhodes Statue (University of Cape Town, 2015)
  To test generalizability, consider the #RhodesMustFall campaign.
  *   **Similarities:** Colonial figure, student-led pressure, debate over erasure vs. context.
  *   **Differences:** The removal was executed by the University Council (Official), not by students pulling it down (Below).
  *   **Framework Application:**
      *   *Claim 1:* UCT keeping the statue up was viewed as affirming colonial exclusion. Removal stopped the re-dedication.
      *   *Claim 2:* The statue was removed to storage/archives, not immediately displayed. This halted the "Honorific" but delayed the "Documentary."
      *   *Claim 3:* Standing was debated in Senate meetings. The "Crowd" had influence but not direct agency.
      *   *Claim 4:* This was Official Removal precipitated by Below pressure.
  *   **Generalization:** The framework generalizes well here. It highlights that the *mode* of removal dictates the *aftermath*. In Bristol, the violence of the toppling became part of the story (the graffiti). In Cape Town, the bureaucratic removal made the story about *policy* and *transformation*. The framework successfully captures that the *process* of removal is as semiotically loaded as the presence of the statue.

  ---

  ### The Reverse: What the Framework Cannot Express
  If we turn the lens around, the Colston episode reveals three blind spots in the framework:

  1.  **The Ritual Dimension:** The framework is structural and legalistic. It misses the *visceral* reality of the toppling. The act of rolling the statue into the harbour was a ritual cleansing (water as purification) that a "framework of claims" cannot quantify. The joy, the catharsis, and the trauma of the event are not captured by "Act/Object" or "Standing." The framework explains the *right* to act, but not the *power* of the act.
  2.  **The Global Signal:** The framework treats the statue as a local "commemorative settlement" between Bristol and Colston. But the toppling was a node in a global network (George Floyd, Minneapolis, global BLM). The "Standing" wasn't just Bristolians; it was a transnational moral community. The framework is too methodologically nationalist/localist to capture why a statue in England mattered to people in Tokyo or New York.
  3.  **The Power of Absence (The Empty Plinth):** Your framework accounts for Object, Museum, and Plinth. It does not account for the *Void*. For years, the empty plinth stood in Colston Avenue. This was not "neutral persistence." It was an active monument to the *absence* of the man. It forced every passerby to confront the removal daily. The framework assumes the debate is about the *presence* of the object; Colston showed that the *absence* can be more politically potent than the presence.

  ---

  ### Memory Literature: Margalit vs. Rieff
  Finally, does the philosophy of memory help, or does it muddy the waters?

  **Avishai Margalit (The Ethics of Memory):**
  Margalit argues for ethical duties of remembrance, particularly within "thick relations" (communities bound by shared history).
  *   **Application:** Margalit would likely argue that the statue violated the ethical duty of memory. A community has a duty to remember the *victims* of the slave trade, not the *perpetrator*. By honoring Colston, Bristol was failing its ethical duty to the descendants of the enslaved.
  *   **Verdict:** Margalit would support the toppling. He would view the museum display as a corrective—an attempt to shift memory from "glory" to "ethical warning." For Margalit, the statue's fate matters immensely because memory is the glue of moral community. To remember wrongly is to fracture the community.

  **Philip Rieff (The Triumph of the Therapeutic):**
  Rieff is skeptical of the "cult of memory." He argues that modern society is obsessed with remembering and expressing trauma, which prevents the "forgetting" necessary for social functioning and authority.
  *   **Application:** Rieff would likely view the entire saga—the protests, the trial, the museum display, the 2025 plaque—as a symptom of a "remissive society" unable to let go. He might argue that whether the statue is up or down is irrelevant; the obsession with the *symbol* distracts from substantive political change.
  *   **Verdict:** Rieff would say the statue's fate matters *too much*. He would argue that the framework itself is part of the problem—a theoretical over-engineering of what should be a matter of cultural forgetting. For Rieff, the healthy society would have quietly removed the statue in the night and refused to make a museum exhibit of the conflict. The "graffitied display" is the ultimate therapeutic act: wallowing in the symbol of the wound rather than healing it.

  ### Conclusion
  Your framework is robust. It survives the Colston episode without collapsing, but it is scarred by it.
  *   **Claim 1** is vindicated: Inertia is affirmation.
  *   **Claim 2** is complicated: Musealisation can preserve conflict rather than resolve it.
  *   **Claim 3** is expanded: Standing can be seized and retrospectively legitimized by a jury.
  *   **Claim 4** is blurred: Official action often trails unofficial action.

  The memory literature does not muddy things so much as it reveals the stakes. Margalit explains *why* the protesters felt compelled to act (ethical duty); Rieff explains *why* the debate has dragged on for years (cultural neurosis). The framework provides the architecture for the argument; the memory theorists provide the psychology. If you wish to strengthen the framework, you must add a category for **Absence** (the empty plinth) and acknowledge that **Standing** is not just a right possessed, but a power taken.
