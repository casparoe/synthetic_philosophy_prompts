  11. **Final Polish:** Ensure the distinction between "Risk" (known odds) and "Uncertainty" (unknown odds) is clear, as that's the bedrock here. Emphasize that the expert treats the rainfall bet as "Uncertainty" while the amateurs treat it as "Risk."

      *(Self-Correction on the Expert Case)*: Wait, Heath & Tversky's "Competence Hypothesis" suggests people prefer betting on their area of competence. The user observes the *opposite*. This is crucial. I need to explain *why* the expert behaves differently. It's because true expertise reveals complexity. Amateurs have "illusion of validity." So the expert is exhibiting **Calibrated Ambiguity Aversion**.

