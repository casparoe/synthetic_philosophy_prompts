answer: |-
  You have spotted a genuine crack in the way decision theory is often sold to non-specialists. You are right to be unsatisfied with the "quiet pessimist" explanation. If your friends were truly acting as if the urn were stacked against them, they would have a preference between Red and Black. The fact that they are indifferent between Red and Black, yet still prefer the Coin, means their issue isn't with the *direction* of the odds, but with the *substance* of the odds.

  To answer your question directly: Yes, there is a notion for this. It is usually discussed under the umbrella of **Second-Order Uncertainty** (or uncertainty about probabilities), often framed through Keynes's concept of the **Weight of Evidence**.

  Here is the argument for what is actually happening, how your two cases fit together, and how you can test it in your pool.

  ### 1. The Core Mechanism: Risk vs. Uncertainty vs. Weight

  The textbook explanation you're fighting assumes your friends are treating the urn as a **Risk** with bad odds. They aren't. They are treating it as **Uncertainty**.

  *   **Risk:** You know the probability distribution (The Coin).
  *   **Uncertainty:** You don't know the probability distribution (The Urn).
  *   **Second-Order Uncertainty:** You have an estimate of the probability (50%), but you also have an estimate of how *reliable* that estimate is.

  When your friends say "50/50" for the urn, they are giving you their **First-Order Belief**. When they refuse to bet on it in favor of the coin, they are revealing their **Second-Order Belief**. They are saying, "I believe it's 50/50, but I have zero confidence in that belief."

  In decision theory terms, they are **Ambiguity Averse**, but not because they think the ambiguity hides a loss. They are averse because the *fuzziness* itself carries a cost. Think of it like currency: A guaranteed $100 is worth more to most people than a 50% chance at $200, even though the expected value is the same. Your friends treat "50% probability derived from a known mechanism" (the coin) as a stronger currency than "50% probability derived from a guess" (the urn).

  This isn't pessimism. It's a **Source Preference**. They trust the *generator* of the coin flip more than the *generator* of the urn mix.

  ### 2. The Expert Case: Why Knowledge Kills Betting

  Your second observation (the hydrologist) is the tell that confirms this isn't simple ignorance.

  If ambiguity aversion were just about "I don't know enough," then knowing more should make you bet *more*. But you're seeing the opposite. This is because the expert and the amateurs are playing two different games.

  *   **The Amateurs:** They see **Risk**. They hear "50% chance of rain." To them, that feels like a coin flip. They don't see the gears turning behind the number. They suffer from an **Illusion of Validity**. They think the probability is solid.
  *   **The Expert:** She sees **Model Uncertainty**. She knows that "50%" is the output of a simulation that relies on assumptions about soil saturation, upstream usage, and atmospheric pressure models. She knows that if one assumption is slightly off, the 50% could easily be 20% or 80%.

  The expert isn't more ignorant; she is **metacognitively aware**. She knows the *error bars* on her probability estimate are huge. The amateurs don't know the error bars exist.

  So, is this a different effect from the urn? **No, it is the same effect operating at a higher resolution.**
  *   In the **Urn** case, everyone knows they are ignorant of the mix. The "Weight of Evidence" is low for everyone.
  *   In the **Rainfall** case, the amateurs *think* the Weight of Evidence is high (because they trust the number given). The expert *knows* the Weight of Evidence is low (because she knows the model's fragility).

  The phenomenon you are watching is **Sensitivity to the Reliability of the Probability Estimate.**

  ### 3. Why the "Pessimist" Explanation Fails

  The standard "pessimist" model (often called MaxMin Expected Utility) suggests that when people face ambiguity, they act as if the worst-case probability is the true one.
  *   If I think the urn could be anywhere between 0% and 100% red, the pessimist model says I act as if it's 0% red.
  *   If I act as if it's 0% red, I should desperately want to bet on **Black**.

  Your friends don't do that. They shrug. This implies they aren't minimizing their maximum loss based on a specific hidden distribution. Instead, they are applying a **discount factor** to the bet itself because the information is shaky. They aren't saying "The urn is rigged." They are saying "The urn is unstable."

  ### 4. How to Tell Them Apart (Tests for Your Pool)

  You want to know if you're looking at one effect or two, and how to verify this without a library. You can run these small experiments in your pool to separate "Source Aversion" from "Expertise Awareness."

  **Test A: The "Randomizer" Swap (Testing Source Preference)**
  Take the rainfall bet. Offer the hydrologist a deal: "You don't have to bet on the rain directly. We will flip a coin. If it's Heads, you win if it rains. If it's Tails, you win if it doesn't."
  *   **Logic:** This converts the uncertain event (rain) into a known risk (coin) *contingent* on the rain.
  *   **Prediction:** If she is just pessimistic about rain, she still won't bet. If she is averse to the *fuzziness* of the probability, she might accept this, because the *payoff mechanism* is now a clean 50/50 coin, decoupling her from the model risk.
  *   **What it tells you:** If she takes this, it confirms she is averse to the *source* of the uncertainty, not the outcome.

  **Test B: The "Confidence" Auction (Testing Second-Order Uncertainty)**
  Don't just ask for a probability. Ask everyone to write down their probability *and* how much money they are willing to stake on it (or ask them to set the odds).
  *   **Logic:** The amateurs will likely say "50%" and bet big. The expert will say "50%" and bet small (or zero).
  *   **Variation:** Ask them to give a range. "Is the chance between 40-60%? Or 10-90%?"
  *   **What it tells you:** The amateurs will claim a tight range (high confidence, low actual knowledge). The expert will claim a wide range (low confidence, high actual knowledge). This proves the reluctance is driven by the **width of the second-order distribution**, not the first-order mean.

  **Test C: The "Insider" Information (Testing the Expertise Paradox)**
  Give the amateurs a fake "tip." Tell them, "I heard from a guy at the reservoir that the levels are critical."
  *   **Logic:** This gives them a false sense of high Weight of Evidence.
  *   **Prediction:** The amateurs will suddenly become eager to bet, even though their actual knowledge hasn't changed. The expert will remain reluctant because she knows the "tip" doesn't fix the model uncertainty.
  *   **What it tells you:** If the amateurs' behavior flips based on *feeling* knowledgeable, while the expert's stays stable based on *being* knowledgeable, you have isolated the **Illusion of Validity** as the counter-force to Ambiguity Aversion.

  ### Summary

  You are looking at a single underlying animal: **Aversion to Second-Order Uncertainty.**

  *   **The Urn Case:** Everyone sees the second-order uncertainty (nobody knows the mix). Everyone applies a discount to the bet. They prefer the Coin because it has no second-order uncertainty.
  *   **The Expert Case:** Only the expert sees the second-order uncertainty (the model fragility). The amateurs think they are betting on Risk (like the coin); the expert knows she is betting on Uncertainty (like the urn).

  The "pessimist" explanation fails because it assumes the agent is trying to guess the hidden truth. Your friends aren't trying to guess the truth; they are assessing the **quality of the information** they have to make the guess.

  In your pool, the most valuable player isn't the one who predicts best, but the one who best assesses the *reliability* of their prediction. Your hydrologist is the only one playing the game correctly; the rest are suffering from an illusion of knowledge. If you want to make your pool more "rational," force people to state confidence intervals, not just point predictions. That will make the second-order uncertainty visible to everyone.
