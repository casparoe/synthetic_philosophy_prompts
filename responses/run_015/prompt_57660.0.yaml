      *   **The Text:** A condensed paragraph summarizing the chapter's argument (Computational Functionalism/Strong AI).
      *   **The BIL's Objection:** Focuses on the distinction between *simulation* and *reality*, specifically using the "slow motion/out of order" argument (likely derived from Block or Searle) and the distinction between *being* a computer vs. *being modeled* as one.
      *   **The User's Leanings:** Agrees with the first sentence (functionalism), suspects Chinese Room is verbal.
