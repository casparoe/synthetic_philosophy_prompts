answer: |-
  Here are ten interview questions designed to press the internal tensions of Dr. Voss's theory of mnemonic triage, including standard replies and sharp follow-ups.

  ### 1. The Conflict of Duties
  **Question:** Dr. Voss, you build on Avishai Margalit's claim that we have a thin ethical duty to remember victims of radical evil, yet you argue this duty must be curtailed by Philip Rieff's diagnosis of our diminished cultural capacity. If the duty to remember stems from the *victim's* right not to be erased, on what grounds do you prioritize the *perpetrator society's* psychological capacity to bear guilt over that right?

  *   **Likely Standard Reply:** She will likely argue that this isn't about prioritizing the perpetrator's comfort, but about preserving the *efficacy* of the memory. If a culture is overwhelmed (mnemonic inflation), the memory loses its normative force and the victim is forgotten in practice anyway.
  *   **Sharp Follow-up:** But that assumes the victim's moral standing is contingent on the utility of their memory to the living. If a memory is "too costly" for a culture to sustain authentically, are you not essentially arguing that some victims are too expensive to keep alive ethically?

  ### 2. The Metric of Authority
  **Question:** Your triage relies on ranking memories based on their ability to sustain "authoritative moral boundaries." In a pluralistic society where moral authority is fragmented, who measures this capacity? Is there an objective metric for whether a specific injustice strengthens or dilutes a culture's moral fabric, or is this an intuitive judgment call?

  *   **Likely Standard Reply:** She will likely suggest it is a matter of public reason and deliberative democracy, assessing which narratives cohere with existing constitutional or ethical commitments without causing civic paralysis.
  *   **Sharp Follow-up:** But historically, the narratives that cause "civic paralysis" are often exactly those that challenge the status quo most profoundly. If your metric favors coherence, doesn't mnemonic triage structurally bias remembrance toward injustices the state is already willing to admit?

  ### 3. Institutional Mechanism: The Curator
  **Question:** You describe this triage as a "curatorial practice." In practical terms, does this require a state body, a commission of experts, or a decentralized cultural process? If it is institutional, how do you prevent the "curator" from becoming a censor who protects national mythology under the guise of managing moral capacity?

  *   **Likely Standard Reply:** She will likely argue for decentralized cultural institutions (museums, schools, media) guided by ethical frameworks rather than a central ministry of memory, emphasizing that triage is organic, not legislative.
  *   **Sharp Follow-up:** But you explicitly argue that forgetting can be *ethically mandatory*. If it's a duty, it requires enforcement. If you leave it to the "organic" market of ideas, the dominant culture will naturally forget the margins. If you institutionalize it, you create a bureaucracy of erasure. Which is it?

  ### 4. Institutional Mechanism: The Victim Veto
  **Question:** Let's say a victim community rejects your triage ranking. They insist their suffering must be remembered centrally, even if your assessment suggests their trauma contributes to "mnemonic inflation." Do these communities have a veto power over the triage process?

  *   **Likely Standard Reply:** She will likely say they have a strong voice but not an absolute veto, because the ethical obligation is to the *society's* long-term moral health, which encompasses but is not limited to specific group demands.
  *   **Sharp Follow-up:** If the group whose suffering is being managed does not consent to the management, on what authority do you impose "strategic forgetting" upon them? Does this not replicate the original silencing that Margalit warns us against?

  ### 5. Nostalgia for Hierarchy
  **Question:** Philip Rieff's "moral interdicts" were rooted in traditional, often religious, hierarchies that demanded obedience. Many of the collective wrongs we remember today—colonialism, slavery, genocide—were committed by societies operating under exactly that kind of unquestioned moral authority. Is invoking Rieff to limit remembrance nostalgic for the very power structures that enabled the crimes?

  *   **Likely Standard Reply:** She will likely distinguish between *authoritarianism* and *moral authority*, arguing we need the latter (shared norms) without the former (coercion), and that modern therapeutic culture lacks even the benign version.
  *   **Sharp Follow-up:** But Rieff argued those two were inseparable. If you strip away the hierarchy, do you have moral authority left, or just preferences? And if you keep the hierarchy to sustain memory, aren't you risking the conditions that make new atrocities possible?

  ### 6. Inflation vs. Democratization
  **Question:** You term the proliferation of commemorative obligations "mnemonic inflation," implying a devaluation of currency. But could this not be viewed as the *democratization* of suffering? Might what you call inflation actually be the necessary expansion of the moral circle to include previously ignored groups?

  *   **Likely Standard Reply:** She will likely concede that expansion is good but argue that without hierarchy, *all* suffering becomes noise. If everything is a tragedy, nothing is a crime. Distinction is necessary for judgment.
  *   **Sharp Follow-up:** But who benefits when distinction is lost? Usually, it is the powerful, whose crimes get lumped in with general human suffering. By insisting on a hierarchy of memory to preserve "clarity," aren't you protecting the powerful from the specific weight of their historical liability?

  ### 7. The Risk of Revisionism
  **Question:** How does your framework distinguish "ethical strategic forgetting" from historical revisionism or denialism? If a state decides that remembering a famine undermines current social stability, your framework seems to provide a philosophical justification for suppressing that history.

  *   **Likely Standard Reply:** She will likely draw a line based on *intent*. Revisionism denies truth to protect power; triage acknowledges truth but limits its *public liturgical weight* to preserve moral function.
  *   **Sharp Follow-up:** But in the public sphere, limiting the "liturgical weight" of a truth *is* a form of denial. If you remove a monument or scrub a curriculum not because it's false, but because it's "too heavy," haven't you still falsified the society's relationship to its past?

  ### 8. Transitional Justice Applications
  **Question:** In transitional justice contexts, like post-apartheid South Africa or post-dictatorship Latin America, the standard is often "the right to truth." Victims demand full disclosure. Your model suggests that full disclosure might overwhelm a fragile democracy. Are you arguing that truth commissions should sometimes withhold truth for the sake of moral sustainability?

  *   **Likely Standard Reply:** She will likely argue for a distinction between *archival* truth (preserved for experts) and *public* memory (curated for the citizenry). The truth exists, but it isn't all foregrounded.
  *   **Sharp Follow-up:** But transitional justice is about restoring agency to victims. If you relegate their truth to the archives because the public can't handle it, you are treating victims as data points for social engineering rather than agents of justice. Does triage treat victims as ends or means?

  ### 9. The Therapeutic Paradox
  **Question:** You critique "therapeutic culture" for lacking moral authority, yet your solution—managing collective guilt to prevent psychological overwhelm—sounds remarkably therapeutic. You are prescribing a coping mechanism for the national psyche. Is mnemonic triage not just another form of the therapeutic management you criticize?

  *   **Likely Standard Reply:** She will likely argue that therapy manages feelings, whereas triage manages *norms*. The goal isn't to feel better, but to be better capable of moral judgment.
  *   **Sharp Follow-up:** But if the criterion for triage is the culture's "capacity to bear" guilt, aren't you diagnosing the culture as a patient? If the goal is moral capacity, why does the limit depend on psychological endurance rather than moral necessity?

  ### 10. Irreversibility and Error
  **Question:** Finally, let's assume a triage decision is made to "strategically forget" a specific injustice to preserve moral coherence. Ten years later, the culture's capacity expands. Can that memory be exhumed without damage? Or is forgetting, even when strategic, inherently destructive to the historical record in a way that remembrance is not?

  *   **Likely Standard Reply:** She will likely argue that memory is always reconstructive, so "exhuming" is possible, provided the archival record remains intact (linking back to the archival/public distinction).
  *   **Sharp Follow-up:** Memory studies suggest that once a narrative leaves the living social fabric, it becomes inert data. If you intentionally let a memory die socially to save the culture, aren't you betting that you can resurrect the dead at will? And if you're wrong, who pays the price for that miscalculation?
