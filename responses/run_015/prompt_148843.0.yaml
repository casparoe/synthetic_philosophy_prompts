answer: |-
  **Project Title:** Tickets and Blood: Reconstructing Berkeley's Normative Theory of Monetary Circulation

  **Project Summary**
  George Berkeley's *The Querist* (1730s) is typically archived as a footnote in the history of economic thought, dismissed either as confused mercantilism or theology disguised as policy. This project proposes a conceptual reconstruction of Berkeley's monetary theory, specifically his distinction between real wealth (land, labor, goods) and nominal wealth (money as tickets). By stripping away the theological premises, I will test whether Berkeley's model offers a coherent normative theory of monetary circulation. The goal is to determine if his metaphors of blood flow and stagnation can sustain a philosophical distinction between productive lending and rent extraction independent of his religious framework.

  **Research Question**
  Can Berkeley's distinction between real and nominal wealth support a normative theory of monetary circulation that separates productive lending from rent extraction, without relying on his theological premises?

  **Background and Problem Statement**
  Standard scholarship treats Berkeley's economic writings as secondary to his idealism. When *The Querist* is addressed, the consensus is that Berkeley was a naive mercantilist who misunderstood the nature of capital, or that his economic views were merely instrumental tools for moral reform grounded in Anglican theology. His famous comparison of money circulation to blood in the body politic is usually cataloged as rhetorical flourish rather than structural analysis. Similarly, his opposition to interest is dismissed as usury theory repackaged.

  This dismissals create a gap. Scholars have not tested the conceptual structure of Berkeley's argument on its own merits. They assume the distinction between real and nominal wealth collapses without the theological backing. This project challenges that assumption. It posits that Berkeley identifies a functional problem in monetary systems—specifically the decoupling of nominal tokens from real productive capacity—that remains analytically viable even if his theological conclusions are discarded. The problem is not historical exegesis, but philosophical reconstruction: does the mechanism hold up if we remove the divine warrant?

  **Methodology**
  The project will proceed in three phases over the three-month period:

  1.  **Textual Extraction:** A close reading of the relevant queries in *The Querist* focused exclusively on money, wealth, and interest. I will paraphrase and catalog the logical dependencies of his arguments without engaging in broader biographical or theological context.
  2.  **Conceptual Contrast:** I will use John Locke's monetary views as a framing device only. Locke represents the dominant contemporary view of money as property and contract. Contrasting Berkeley against Locke will highlight where Berkeley diverges on the ontology of money (ticket vs. commodity) without requiring a full literature review of early modern economics.
  3.  **Normative Reconstruction:** I will attempt to steelman Berkeley's argument. This involves formalizing the distinction between circulation that feeds the economy (blood flow) and hoarding that stagnates it (clotting). I will test whether this distinction can logically sustain a normative prohibition on certain types of interest (rent extraction) without invoking sin or divine law.

  **Deliverables**
  The primary output will be a 30-page philosophical paper. The paper will include:
  *   A reconstructed argument map of Berkeley's monetary theory.
  *   A stress-test of the real/nominal wealth distinction.
  *   A clearly defined failure condition: If the distinction between real and nominal wealth collapses under secular scrutiny, the paper will document exactly where the logic fails, which is itself a valuable negative result.

  **Significance: Why Fund This?**
  Most history of philosophy grants fund exegesis. This project funds a stress-test. Think of this less like archiving and more like debugging legacy code. Berkeley's *The Querist* contains a specific model of how money interacts with labor and goods. The standard view is that the code is broken because it relies on an outdated operating system (18th-century theology). But if there is even a half-coherent theory of circulation vs. stagnation buried in there, it might actually matter for how we think about interest and debt mechanisms today.

  If Berkeley is right that money is purely a ticket for claiming real wealth, then treating the ticket as a wealth-generating asset in itself is a category error. That sounds like a theological quirk, but it maps onto modern debates about financialization versus production. If we can separate the mechanism from the theology, we might recover a normative tool for distinguishing between credit that enables production and credit that extracts rent. Even if the argument fails, knowing *why* it fails updates our priors on the limits of normative monetary theory. We fund this to see if the mechanism works, not to worship the architect.

  **Timeline and Feasibility Assessment**
  *   **Month 1:** Textual extraction and paraphrase of relevant queries; establishment of the Locke contrast frame.
  *   **Month 2:** Conceptual reconstruction and drafting of the core argument.
  *   **Month 3:** Refinement, stress-testing the failure conditions, and final editing.

  **Honest Scope Assessment:**
  This scope is realistic for a three-month grant. A 30-page paper is a focused output that allows for depth without requiring exhaustive historical contextualization. The risk is not logistical overload, but philosophical viability. There is a non-zero chance that upon reconstruction, Berkeley's argument proves incoherent without the theological premises. However, this is accounted for in the deliverables (the failure condition). The project is bounded tightly enough that even a negative result constitutes a completed, valuable paper within the timeframe. It is not too big; it is appropriately constrained for a single researcher over one semester.
