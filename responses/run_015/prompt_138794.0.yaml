  To: The Trustees of the Marchmont Trust
  From: [Your Name]
  Date: 10 March 2024
  Subject: Recommendation on the Small-Grants Stream Selection Process

  **Purpose**
  This paper recommends a conditional adoption of the Director's proposal to replace the outcomes metric with an AI-assisted endorsement procedure for the small-grants stream. It outlines specific conditions to mitigate risks regarding gaming, historical bias, and the lack of monitoring data.

  **Context**
  Our current outcomes framework is failing. It incentivises gaming—as evidenced by the provider counting text messages as engagement—and excludes organisations supporting the most chaotic care leavers who cannot guarantee twelve-month metrics. We are funding what is easy to measure, not what is most needed. 

  The Director proposes replacing the cost-per-outcome ranking with a language model trained on our past twelve years of decisions. Applications would be anonymised and described as they might appear in a future annual report, rather than as initial bids. The model would score 'endorsement likelihood', guiding the officer and trustee to the top band for final decision. This 'ex-post' framing aims to force applicants to articulate success clearly, mimicking the clarity we see in retrospect.

  **The Case For Adoption**
  Proponents argue this restores trustee intuition to the process. The current metric is a blunt instrument that cannot capture nuance. A model trained on our written reasons may identify high-quality narratives that correlate with successful interventions better than a cost-per-outcome figure. Furthermore, anonymisation reduces unconscious bias regarding an organisation's reputation, focusing attention on the activity itself. If successful, this allows us to fund high-need, hard-to-measure work without abandoning rigour. It acknowledges that human judgement, codified over twelve years, is a better heuristic than a flawed quantitative proxy.

  **The Case Against**
  Opponents raise three substantive objections that must be steelmanned.
  First, **historical bias**. The model learns from our past approvals. Since those approvals were influenced by the very metric we now disown, the model may simply automate our past mistakes, prioritising applications that look like previous winners rather than those that best serve care leavers. It optimises for resemblance to our history, not necessarily our mission.
  Second, **adversarial gaming**. If applicants know a model ranks them, they will write to satisfy the model, not us. We have already seen applications drafted in 'machine-readable' prose. This shifts gaming from metrics to language, potentially favouring those with grant-writing resources over those with grassroots impact.
  Third, **the ground truth problem**. We cannot individually monitor 200 small grants. Without monitoring, we cannot verify if the model's endorsements lead to better outcomes than the metric. We risk replacing a failed proxy with an unmeasurable one. If we cannot audit the results, we cannot know if the new system is an improvement or merely a different kind of failure.

  **On AI Framing**
  One trustee has framed this as a choice between 'approval-directed' systems (predicting trustee approval) and 'goal-directed' systems (achieving actual impact). This distinction earns its keep. The proposed model is explicitly approval-directed. It optimises for resemblance to past trustee behaviour, not necessarily care-leaver welfare. Recognising this clarifies the risk: we are not building a tool to find what works, but a tool to find what looks like what we previously approved. This confirms the need for external verification. The framing is not merely jargon; it highlights the alignment problem at the heart of this proposal.

  **Recommendation**
  I recommend we **adopt the proposal subject to three strict conditions**. Rejecting it leaves us with a broken metric that actively harms our mission by excluding the most vulnerable. Adopting it unconditionally ignores serious risks regarding bias and verification. A conditional pilot allows innovation while securing accountability.

  **Conditions for Adoption**
  To address the monitoring and ground truth deficit, the following conditions must be met:

  1.  **Audit Sample:** From 1 April 2024, 10% of successful small grants (20 awards) will be selected at random for full monitoring, including site visits and outcome verification. This creates a ground-truth dataset against which the model's scores can be compared.
  2.  **Performance Review:** By 14 March 2025, the Director must present a paper comparing the model's endorsement scores against the actual performance of the Audit Sample. If the correlation between high scores and verified success is weak, or if evidence of systemic gaming emerges, the procedure must be suspended pending further review.
  3.  **Human Override:** The deciding trustee and officer retain veto power. If an application ranks highly but raises concerns during human review, it may be rejected without penalty to the applicant's future eligibility. This ensures final accountability remains with the board, not the model.

  **Conclusion**
  The current metric is actively harming our mission by excluding the most vulnerable. We must change. However, we cannot swap a broken ruler for a black box without checking the measurements. By implementing a 10% audit sample, we generate the evidence needed to judge the model's efficacy within two years. This satisfies the need for innovation while respecting our fiduciary duty to verify impact.

  I move that we adopt the endorsement procedure subject to the conditions outlined above.
