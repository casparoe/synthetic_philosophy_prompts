      One trustee has framed this as a choice between 'approval-directed' systems (predicting trustee approval) and 'goal-directed' systems (achieving actual impact). This distinction earns its keep. The proposed model is explicitly approval-directed. It optimises for resemblance to past trustee behaviour, not necessarily care-leaver welfare. Recognising this clarifies the risk: we are not building a tool to find what works, but a tool to find what looks like what we previously approved. This confirms the need for external verification.

      **Recommendation**
      I recommend we **adopt the proposal subject to three strict conditions**. Rejecting it leaves us with a broken metric. Adopting it无条件 (unconditionally) ignores serious risks. A conditional pilot allows innovation while securing accountability.

      **Conditions for Adoption**
      To address the monitoring and ground truth deficit, the following conditions must be met:

      1.  **Audit Sample:** From 1 April 2024, 10% of successful small grants (20 awards) will be selected at random for full monitoring, including site visits and outcome verification. This creates a ground-truth dataset against which the model's scores can be compared.
      2.  **Performance Review:** By 14 March 2025, the Director must present a paper comparing the model's endorsement scores against the actual performance of the Audit Sample. If the correlation between high scores and verified success is weak, the procedure must be suspended.
      3.  **Human Override:** The deciding trustee and officer retain veto power. If an application ranks highly but raises concerns during human review, it may be rejected without penalty to the applicant's future eligibility.

      **Conclusion**
      The current metric is actively harming our mission by excluding the most vulnerable. We must change. However, we cannot swap a broken ruler for a black box without checking the measurements. By implementing a 10% audit sample, we generate the evidence needed to judge the model's efficacy within two years. This satisfies the need for innovation while respecting our fiduciary duty to verify impact.

