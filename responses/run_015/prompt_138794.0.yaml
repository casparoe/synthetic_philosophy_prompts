      To: The Trustees of the Marchmont Trust
      From: [Your Name]
      Date: 10 March 2024
      Subject: Recommendation on the Small-Grants Stream Selection Process

      **Purpose**
      This paper recommends a conditional adoption of the Director's proposal to replace the outcomes metric with an AI-assisted endorsement procedure for the small-grants stream. It outlines conditions to mitigate risks regarding gaming, historical bias, and monitoring.

      **Context**
      Our current outcomes framework is failing. It incentivises gaming—as evidenced by the provider counting text messages as engagement—and excludes organisations supporting the most chaotic care leavers who cannot guarantee twelve-month metrics. We are funding what is easy to measure, not what is most needed. The Director proposes replacing the cost-per-outcome ranking with a language model trained on our past twelve years of decisions. Applications would be anonymised and described as they might appear in a future annual report. The model would score 'endorsement likelihood', guiding the officer and trustee to the top band for final decision.

      **The Case For Adoption**
      Proponents argue this restores trustee intuition to the process. The current metric is a blunt instrument that cannot capture nuance. A model trained on our written reasons may identify high-quality narratives that correlate with successful interventions better than a cost-per-outcome figure. The 'annual report' framing forces applicants to articulate success clearly, potentially reducing ambiguity. Furthermore, anonymisation reduces unconscious bias regarding an organisation's reputation, focusing attention on the activity itself. If successful, this allows us to fund high-need, hard-to-measure work without abandoning rigour.

      **The Case Against**
      Opponents raise three substantive objections that must be steelmanned.
      First, **historical bias**. The model learns from our past approvals. Since those approvals were influenced by the very metric we now disown, the model may simply automate our past mistakes, prioritising applications that look like previous winners rather than those that best serve care leavers.
      Second, **adversarial gaming**. If applicants know a model ranks them, they will write to satisfy the model, not us. We have already seen applications drafted in 'machine-readable' prose. This shifts gaming from metrics to language, potentially favouring those with grant-writing resources over those with grassroots impact.
      Third, **the ground truth problem**. We cannot individually monitor 200 small grants. Without monitoring, we cannot verify if the model's endorsements lead to better outcomes than the metric. We risk replacing a failed proxy with an unmeasurable one.

