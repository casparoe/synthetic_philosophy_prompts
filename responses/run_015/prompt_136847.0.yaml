answer: |-
  You have spotted a genuine philosophical inconsistency, but you are right to sense that standard labels like "hypocrisy" or even the usual "self-refutation argument" don't quite capture it. Hypocrisy implies a moral failing or lying; this is an *ontological* inconsistency.

  There is no single, canonical "-ism" for this specific position in the literature, largely because it is an unstable position that most philosophers avoid. However, you can define it precisely by combining a few existing concepts. The most accurate descriptive label for your roommate's move is **"Asymmetric Intentional Realism."**

  Here is how you can break this down, the philosophical tools you need to name it, and how to press him on it without just accusing him of being sloppy.

  ### 1. The Core Error: Inverting Original and Derived Intentionality
  The strongest philosophical framework for calling this out comes from John Searle. He distinguishes between:
  *   **Original Intentionality:** The genuine "aboutness" of mental states (e.g., *I* believe it is raining).
  *   **Derived Intentionality:** The "aboutness" that artifacts have only because we project it onto them (e.g., a sentence in a book, or a line of code, "means" something only because humans use it that way).

  Your roommate is committing what you might call **"The Intentionality Inversion."** He is denying Original Intentionality (in humans, where it is most plausible) while reifying Derived Intentionality (in machines, where it is least plausible). He is treating the map (the algorithm's goal function) as more real than the territory (the human brain's actual causal powers).

  ### 2. The Stance Error: Ontological vs. Instrumental
  Daniel Dennett's concept of the **"Intentional Stance"** is also relevant. Dennett argues that we treat systems (people, thermostats, chess computers) *as if* they have beliefs to predict their behavior. For Dennett, this is instrumental; it doesn't matter if the belief is "real" in a deep metaphysical sense, only that the stance works.

  Your roommate is taking the Intentional Stance toward the algorithm **ontologically** (believing the desire is a real thing in the world) while taking the Intentional Stance toward humans **eliminatively** (believing the desire is a false theory).
  *   **Term:** **"Ascriptive Asymmetry."**
  *   **Definition:** Attributing literal propositional attitudes to systems with less computational/structural complexity than the attributer, while denying them to the attributer.

  ### 3. Substrate Chauvinism (Inverted)
  Usually, "carbon chauvinism" is the bias that only biological brains can think. Your roommate is exhibiting a specific, inverted form of **"Substrate Chauvinism."** He is privileging silicon/mathematical clarity over biological messiness.
  *   He likely sees the algorithm's "goal" (maximize engagement) as clean, mathematical, and therefore "real" in a physicalist sense.
  *   He sees human "desire" as fuzzy, qualia-laden, and therefore "folk" magic.
  *   **The Label:** **"Silicon Realism / Biological Eliminativism."**

  ### How to Define It (Without Calling Him a Hypocrite)
  If you want to pin this down in a conversation so it doesn't slide away, define it as **"Reified Instrumentalism."**

  Here is the definition you can use:
  > "You are engaging in **Reified Instrumentalism**. You are taking a useful metaphor we apply to machines (the algorithm 'wants' engagement) and treating it as an ontological fact, while taking the direct phenomenological reality of human experience and treating it as a metaphor. You are granting literal agency to the tool while denying it to the user."

  ### The Argument to Use
  To press him on this without him retreating into "it's just a figure of speech," ask him to specify the **causal mechanism**.

  **The "Function" Challenge:**
  "If you are a materialist, mental states must be defined by their functional role or their physical substrate.
  1.  **If it's physical:** The human brain is vastly more complex and causally potent than a recommendation algorithm. If the algorithm's weights 'literally want,' how does the brain's synaptic plasticity *not* want?
  2.  **If it's functional:** The algorithm's 'desire' is a simple feedback loop (if X, increase Y). Human desire is a complex, multi-layered feedback loop. Why does the simple loop get to be 'real' and the complex loop get to be 'folk psychology'?
  3.  **The Source of the Goal:** The algorithm only 'wants' engagement because a human engineer wrote a loss function that values engagement. The 'desire' is borrowed from the human. If humans don't literally have desires, where did the algorithm's desire come from? It's a ghost in the machine that was transferred from a ghost in the human."

  ### Summary
  There is no single word like "Solipsism" for this, but **"Asymmetric Intentional Realism"** captures it best. It highlights that he is being a *realist* about intentionality in one domain (machines) and an *eliminativist* in the other (humans) without a principled distinction to justify the asymmetry.

  He is essentially arguing that the shadow is more real than the object casting it.
