answer: |-
  Good morning. To [Honoree's Name]'s family, to her colleagues—both the skeptics and the supporters—and to the students who will carry this work forward: welcome.

  Standing here, I am aware of the tension in this room. I see senior historians who believe that looking at "what might have been" is a distraction from "what was." I see philosophers who argue that without understanding possibility, we cannot understand necessity. And I see family members who might be wondering why we are arguing about possibility at a retirement party.

  The reason we are all here is because [Honoree's Name] refused to let those groups stay separate. She built a career on a single, stubborn claim: that we cannot prove history was inevitable just by telling a smooth story. Coherence is not proof. To claim something had to happen, you must test the alternatives. She called this "modal fragility analysis." It sounds technical, but the heart of it is simple. It is the practice of checking whether a historical outcome was robust, or whether it was balanced on a knife's edge that we have since forgotten.

  To understand her legacy, we need to make a precise distinction. It is the difference between **inevitability-as-overdetermination** and **inevitability-as-retrospective-illusion**.

  Inevitability-as-overdetermination means that many different paths lead to the same result. If you block one road, traffic finds another. The outcome is robust. Inevitability-as-retrospective-illusion means the outcome looks robust only because we have erased the other roads from the map. We look back and see a single highway, but at the time, it was a dirt track chosen over several paved alternatives.

  This distinction does real work. It determines what we can say about [Honoree's Name]'s contribution. She was not merely adding footnotes to existing histories. She was testing the structural integrity of our causal explanations. If she shows an event was overdetermined, she confirms the strength of existing forces. If she shows it was an illusion, she reveals that human agency mattered more than we thought.

  Let me give you one example of how this changes everything. Consider the adoption of tetraethyl lead in gasoline during the 1920s.

  The standard narrative is one of overdetermination. Internal combustion engines were becoming more powerful; they required higher compression to avoid knocking; chemistry dictated that lead was the only viable additive to prevent that knocking. Therefore, leaded gas was inevitable. The engineers were just solving a technical problem.

  [Honoree's Name]'s analysis showed this was a retrospective illusion. She demonstrated that ethanol blends were technically viable at the time. They were known, they worked, and they were renewable. The choice of lead was not dictated by chemistry alone; it was dictated by patent control and cost structures specific to one corporation. The causal chain was fragile. The "lead path" was not overdetermined; it was selected.

  Why does this matter? It matters because it changes the moral evaluation of the actors involved.

  If leaded gas was overdetermined—if chemistry left no other choice—then the subsequent decades of public lead poisoning are a tragedy of nature. The engineers and executives are merely agents of progress dealing with unfortunate side effects. They bear no special moral burden for the toxicity because they had no real choice.

  But if the adoption was fragile—if ethanol was a genuine, accessible alternative—then the toxicity is a tragedy of choice. The actors prioritized patent monopolies and short-term profit over public health and long-term environmental stability. Recognizing the fragility shifts the blame from the universe to the boardroom. It transforms the history from a story of discovery into a story of responsibility.

  This is what [Honoree's Name] taught us. She taught us that identifying fragility is not a parlor game of "what ifs." It is an ethical imperative. When we treat a fragile outcome as overdetermined, we let decision-makers off the hook. We tell ourselves that things had to be this way. She refused to let us say that.

  So, how do we honor her legacy? We do not honor her by simply repeating her findings. We honor her by applying that distinction to our own work. When we look at the technologies shaping our lives today—algorithms, energy grids, genetic editing—we must ask: Is this overdetermined? Or is this a retrospective illusion?

  To the historians here: she showed you that counterfactuals are not escapes from reality, but tools to test its weight. To the philosophers: she showed you that modal reasoning must be grounded in archival dirt, not just logical space. And to her family: she showed us that history is not a force that crushes us, but a series of choices made by people like us.

  [Honoree's Name], you have spent your career proving that the past was not written in stone. You showed us that the doors we think were locked were actually just closed. And in doing so, you reminded us that the future remains open, provided we have the courage to test the hinges.

  Thank you.
