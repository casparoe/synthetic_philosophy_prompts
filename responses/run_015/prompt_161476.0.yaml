      *   *What about the Atrocity case?* If the principle is "Future Utility," does that justify forgetting atrocities if we feel safe? No, because the *risk* remains. The duty is to the *possibility* of recurrence.
      *   *Does this fix the "Own Worst Action" vs "Adolescent Cruelty"?* Yes. One has utility for character; the other is stagnant.

  9.  **Final Polish:** Structure the answer to first tackle the principle, then the specific case. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to be careful not to dismiss the Atrocity intuition. The user feels a duty there despite no "debt." My principle must accommodate that. The "Debt" model is too transactional. A "Stewardship" model might be better. You are a steward of truth. But stewardship requires a purpose.

  *Revised Principle:* **Memory is a duty when it sustains a normative good (Justice, Care, Integrity, Safety).**
  *   Grandmother: Care (sustained by life, not constant recall).
  *   Grandfather: Justice/Truth.
  *   Friends: Integrity of relationship.
  *   Own Wrong: Integrity of Self.
  *   Adolescent: No good served (Vanity).
  *   Atrocities: Safety/Justice (Collective).
