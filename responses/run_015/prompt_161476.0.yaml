      *   **Problem:** The user admits this principle breaks down on Own Wrongdoing, Rumination, and Atrocity Victims.
      *   **The Core Question:** Is there a unifying principle, or do some verdicts need correcting?
      *   **The Specific Case:** The user is the sole keeper of a dead friend's secret bad deed (no victims, no claims). Should they remember or let it die?

  2.  **Deconstruct the User's Verdicts & Principle:**
      *   *Grandmother:* Forget mostly. (No debt). -> Fits principle.
      *   *Collaborator Grandfather:* Remember/Pass down. (Accountability/Truth debt). -> Fits principle.
