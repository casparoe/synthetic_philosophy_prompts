answer: |-
  David Hume's framework posits that while beauty is not an inherent property of objects, there exists a universal standard of taste grounded in human nature. According to this view, sentiment is subjective, but the structures of human psychology are sufficiently uniform that individuals with "delicacy," practice, and freedom from prejudice—the ideal critics—should converge on the same judgments. Disagreement, in this model, is essentially an error signal; it indicates that either the object lacks the stability to produce consistent sentiment or, more likely, that one or more critics lack the requisite refinement or are clouded by prejudice. The goal of criticism is to filter out these defects to reveal the joint verdict of the ideal critics, which constitutes the true standard of beauty.

  In contrast, the community taste calibration model suggests that aesthetic value is not discovered but constructed through social coordination. Here, individuals adjust their judgments to align with a shared baseline, similar to calibrating instruments to a common standard. There is no hidden objective beauty waiting to be found by the most delicate sensibility; instead, value emerges from intersubjective agreement within a specific cultural context. Disagreement in this framework is not necessarily a sign of defective perception but rather evidence of competing social baselines or an ongoing process of negotiation. Value is stable only insofar as the community maintains a consensus, and shifts in taste reflect shifts in the community's calibration rather than the discovery of prior truths.

  When applied to the phenomenon of trained experts disagreeing about avant-garde art, the two frameworks offer distinct explanations. For Hume, persistent disagreement among qualified critics is problematic. If these experts possess the necessary practice, comparison, and good sense, their delicacy should allow them to perceive the work's merit uniformly. To maintain his standard, Hume must argue that the disagreeing parties are not truly "ideal" or that the avant-garde work itself is flawed because it fails to engage universal human sentiments. This struggles to account for cases where history vindicates initially rejected art, suggesting the critics were not defective, but rather that the standard itself needed to evolve. Hume's model is inherently conservative, relying on established norms of human nature to judge new works, making it difficult to explain why equally trained experts cannot agree on works designed to challenge existing norms.

  The community calibration framework handles this specific phenomenon more robustly. Avant-garde art is intentionally disruptive, designed to challenge existing aesthetic norms and propose new ways of seeing. In this context, expert disagreement is expected because the community has not yet recalibrated to the new baseline proposed by the artwork. Different experts may belong to different sub-communities or theoretical schools, each operating with a different calibration standard. One critic may judge the work based on traditional baselines, while another judges it based on emerging progressive baselines. The disagreement is not a failure of perception but a negotiation over which social baseline should dominate. This model explains why consensus often forms only retrospectively, once the community has had time to adjust its instruments to the new style.

  While Hume's framework better explains the normative force of criticism—why we feel others *ought* to agree with us—the calibration model better explains the sociological reality of persistent divergence among the qualified. Hume treats disagreement as an anomaly to be resolved by finding the ideal critic, whereas calibration treats disagreement as a natural state during periods of aesthetic innovation. Since avant-garde art is defined by its resistance to established norms, a model that views taste as dynamic and socially constructed accounts for the friction among experts more effectively than one that assumes a static human nature waiting to be accessed by the refined.

  \answer{calibration}
  Summary: Calibration better explains expert disagreement because it treats divergent judgments as natural outcomes of shifting social baselines rather than defects in critical faculties.
