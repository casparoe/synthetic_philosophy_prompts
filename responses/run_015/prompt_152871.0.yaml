prompt: |-
  I'm a grad student in cognitive science who mostly thinks in terms of predicive processing, interoceptive inference, and precission-weighted prediction errors. I want you to take the three main philosphy of emotion positions -- that emotions are judgments (the Nussbaum/Solomon kind), that they're perceptions (Prinz-style), and that they're just felt bodily changes (James-Lange) -- and restate each one using only my vocabulary: generative models, prior beliefs, prediction error, precission weighting, allostasis, etc. Do it one by one. For each, tell me what maps cleanly, what I have to twist or fudge to make fit, and what just has no counterpart in my framework at all. Then the residue report: if something in the philosophical view can't be expressed in predictive-processing terms, is that because my framework is missing a real distinction, or because the philosophical claim was never that precise to begin with? I especially care about whether the judgment view forces me to smuggle in propositional content that prediction-error dynamics can't carry, and whether the feeling view collapses into just interoceptive prediction. No reading lists or citations please -- I just want the translation and where it breaks.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Grad student in cognitive science.
      *   **User Framework:** Predictive Processing (PP), Interoceptive Inference, Precision-Weighted Prediction Errors (PWPE), Generative Models, Allostasis.
      *   **Task:** Translate three major philosophical theories of emotion into PP vocabulary.
          1.  Emotions as Judgments (Nussbaum/Solomon).
          2.  Emotions as Perceptions (Prinz).
          3.  Emotions as Felt Bodily Changes (James-Lange).
      *   **Requirements per Theory:**
          *   Restate using PP vocabulary.
          *   Identify what maps cleanly.
          *   Identify what requires twisting/fudging.
          *   Identify what has no counterpart.
      *   **Residue Report:** Analyze the leftovers. Is the PP framework missing something, or was the philosophy imprecise?
      *   **Specific Concerns:**
          *   Does the Judgment view require propositional content PP can't handle?
          *   Does the Feeling view collapse into interoceptive prediction?
      *   **Constraints:** No reading lists, no citations. Just translation and critique.

  2.  **Deconstruct the Target Framework (Predictive Processing):**
      *   *Core Mechanism:* Hierarchical generative models minimize variational free energy (surprise).
      *   *Key Terms:* Priors (beliefs), Likelihoods, Prediction Errors (PE), Precision Weighting (gain control/attention), Active Inference (action to minimize PE), Interoception (visceral sensing), Allostasis (anticipatory regulation).
      *   *Ontology:* Everything is inference. Perception is controlled hallucination. Emotion is likely a specific mode of inference regarding bodily states and their causes.

  3.  **Drafting Translation 1: Emotions as Judgments (Nussbaum/Solomon)**
      *   *Philosophy:* Emotions are evaluative judgments about the world relative to one's flourishing/goals. Fear = judgment of danger. Anger = judgment of wrongdoing. They have propositional content ("I judge that X is bad").
      *   *PP Translation:* Emotions are high-level generative models (priors) about the significance of sensory data relative to homeostatic/allostatic setpoints. A "judgment" is a posterior belief formed by minimizing PE between incoming data and deep priors about value/survival.
      *   *Clean Map:* "Evaluation" maps to precision-weighting based on allostatic needs. "Judgment" maps to posterior belief formation at high hierarchical levels.
      *   *Twist/Fudge:* Philosophical judgments are often conscious and propositional ("That dog is dangerous"). PP priors are often sub-personal and probabilistic. Need to equate "propositional content" with "structured latent causes."
      *   *No Counterpart:* The normative dimension (is the judgment *correct* in a moral/eudaimonic sense?) is hard to capture in purely descriptive PE minimization.
      *   *Specific Concern (Propositional Content):* PP handles structured representations, but "propositions" imply truth conditions. PP deals in *accuracy* (minimizing surprise), not truth. This is a friction point.

  4.  **Drafting Translation 2: Emotions as Perceptions (Prinz)**
      *   *Philosophy:* Emotions are perceptions of bodily changes (neo-Jamesian) but calibrated to represent core relational themes. They are like sensory perceptions but of the body.
      *   *PP Translation:* Emotions are the result of interoceptive inference. The "perception" is the brain's best guess (posterior) about the cause of interoceptive signals. It's a controlled hallucination of bodily state.
      *   *Clean Map:* "Perception of body" maps perfectly to Interoceptive Inference. "Calibration" maps to learning likelihoods.
      *   *Twist/Fudge:* Prinz wants emotions to represent *external* concerns (danger, loss) via the body. PP needs to ensure the generative model links interoceptive states to exteroceptive causes (e.g., "heart rate up" caused by "bear").
      *   *No Counterpart:* The idea of the emotion *being* the perception vs. the *result* of the inference. PP distinguishes the signal, the model, and the error. Prinz lumps them.
      *   *Specific Concern:* Does it collapse? Yes, largely. In PP, emotion *is* largely interoceptive prediction error resolution.

  5.  **Drafting Translation 3: Emotions as Felt Bodily Changes (James-Lange)**
      *   *Philosophy:* We don't cry because we're sad; we're sad because we cry. Emotion = awareness of physiological disturbance.
      *   *PP Translation:* Emotion is the precision-weighted prediction error arising from the interoceptive channel that cannot be explained away by existing priors, or the active inference policy enacted to resolve it.
      *   *Clean Map:* "Bodily changes" maps to Interoceptive signals/visceral motor output. "Feeling" maps to the conscious access of the posterior/PE.
      *   *Twist/Fudge:* James-Lange is linear (Stimulus -> Body -> Emotion). PP is recursive/circular (Model <-> Body <-> Error). Need to frame "feeling" not as passive reception but as active inference.
      *   *No Counterpart:* The raw "qualia" of the feeling might be distinct from the inference itself, though PP tries to explain qualia as precision.
      *   *Specific Concern:* Collapse into interoceptive prediction? Yes. In PP, "feeling" *is* the inference about the body.

  6.  **Developing the Residue Report:**
      *   *Judgment View:* The "propositional" issue. PP has structure, but does it have *truth*? PP has "accuracy." If the user cares about rationality/normativity, PP is descriptive. The "smuggling" happens when we treat high-level priors as propositions.
      *   *Feeling View:* Does it collapse? Yes. In PP, there is no "raw feel" separate from the inference. If the philosopher insists on a non-inferential qualia, PP can't touch it. But if "feeling" is just access to the model, it fits.
      *   *General:* PP is a mechanism; Philosophy is often about ontology or normativity. The residue is often the "Why" (norms) vs. the "How" (mechanisms).

  7.  **Refining the Tone:**
      *   Keep it technical but direct.
      *   Avoid fluff.
