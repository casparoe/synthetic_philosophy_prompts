answer: |-
  This is a specification for a historiographical standard, not a historical argument. You are asking for the epistemological machinery required to move from "evidence" to "public classification." Below is the requirements list derived from your constraints, followed by the analysis of its internal tensions, the exclusionary requirement, the methodology scorecard, and the necessary fragmentation of the question.

  ### Part 1: The Requirements List for Historicity Assessment

  **Goal:** To underwrite a textbook classification (History / Core / Story) for national education.

  | # | Requirement | Motivation / Case | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **Dimensional Separation** | **Case:** A real battle (Event) described with wrong generals (Figure) in a poem written 500 years later (Transmission). <br>**Consideration:** The theory must output four distinct confidence scores: Event Occurrence, Narrative Reliability, Transmission Continuity, Figure Existence. Conflating them allows a true event to validate a false narrative. | **Non-Negotiable** |
  | **2** | **Temporal Stratification** | **Case:** Troy VIIa destruction fused with Homeric epic. <br>**Consideration:** The theory must allow a tradition to be archival evidence for Period A (destruction) and invention for Period B (the duel of Achilles). It must identify *which* layer is being tested. | **Non-Negotiable** |
  | **3** | **Retrospective Calibration** | **Case:** Year 2400 historians judging the "Moon Landing" (true) vs. "Washington's Cherry Tree" (false). <br>**Consideration:** The method must be tested on traditions where the outcome is known. If it cannot distinguish a known fabrication from a known fact using only the evidence available *at the time*, it is overfitted. | **Non-Negotiable** |
  | **4** | **Causal Independence** | **Case:** A commemorative layer built *because* of the story, then dated to confirm the story. <br>**Consideration:** Evidence generated by the belief in the tradition cannot count as evidence for the truth of the tradition. The causal arrow must be单向 (one-way). | **Non-Negotiable** |
  | **5** | **Referential Stability** | **Case:** "Arthur" attached to a 6th-century warlord vs. a 5th-century Roman officer. <br>**Consideration:** The theory must specify the allowable drift between the signifier (Name/Place) and the signified (Historical Entity). If the name moves, does the history move with it? | **Preference** (Camp: Philological vs. Functionalist) |
  | **6** | **Reference Class Transparency** | **Case:** "Conquest by God" vs. "Migration of Pastoralists." <br>**Consideration:** Priors must be explicit. You cannot assess probability without stating the base rate of the *type* of event. The class must be defined before evidence is weighed. | **Non-Negotiable** |
  | **7** | **Media Neutrality** | **Case:** Oral societies vs. Literate Empires. <br>**Consideration:** Absence of contemporary text cannot be decisive against a tradition from a non-literate culture. The evidentiary threshold must adjust for the medium of preservation. | **Non-Negotiable** |
  | **8** | **Silence Weighting** | **Case:** Egyptian records mention Habiru but not Exodus. <br>**Consideration:** The theory must define the conditions under which silence is evidence of absence (e.g., expected record type exists) vs. evidence of irrelevance (e.g., propaganda omission). | **Preference** (Camp: Maximalist vs. Minimalist) |
  | **9** | **Termination Rule** | **Case:** "Wait for the next dig." <br>**Consideration:** The theory must declare when a question is *in principle* unanswerable given current media limits. A verdict of "Unknown" is a valid output; "Pending" is not a textbook category. | **Non-Negotiable** |
  | **10** | **Stakeholder Neutrality** | **Case:** Exodus (religious load-bearing) vs. Arthur (national load-bearing). <br>**Consideration:** The cost of error (social unrest vs. mild disappointment) cannot influence the evidentiary threshold. | **Non-Negotiable** |

  ---

  ### Part 2: Incompatibility Analysis

  You asked whether any subset of these requirements is jointly unsatisfiable. **Yes.** There is a fundamental tension between **Dimensional Separation (Req 1)** and the **Ministry's Goal (Single Verdict).**

  **The Conflict:**
  The Ministry requires a ternary label (History / Core / Story). Requirement 1 demands four distinct confidence scores. There is no mathematical or logical function that can reduce four independent variables to one label without losing information or introducing arbitrary weighting.
  *   *Example:* If "Event Occurrence" is High but "Narrative Reliability" is Low, is that "History" or "Story with Core"?
  *   *Result:* To produce the single verdict the Ministry wants, you must betray Requirement 1 (by collapsing the dimensions) or betray the Ministry's goal (by issuing a multi-axis report card).
  *   *Finding:* The list cannot be met all at once. The Ministry must choose between a **simple lie** (single verdict) and a **complex truth** (dashboard).

  **The Reference Class Problem:**
  Requirement 6 (Reference Class Transparency) is theoretically non-negotiable but practically unstable. There is no privileged way to place a tradition in a class.
  *   Is the Exodus a "Mass Migration" (high base rate of occurrence) or a "Divine Liberation" (zero base rate)?
  *   Is Arthur a "Warlord" (common) or a "Messianic King" (rare)?
  *   *Result:* The choice of reference class determines the prior, which often determines the verdict. Since the class selection is subjective, the "objective" prior is an illusion. This requirement cannot be fully satisfied without a meta-theory of classification that does not currently exist.

  ---

  ### Part 3: The Exclusionary Requirement

  **The Requirement:** **Reference Class Transparency (Req 6).**

  **Why it excludes:** This requirement excludes the majority of traditional historical scholarship, which operates on *intuitive priors*. Most historians do not explicitly state, "I assign a 5% prior probability to this event because it falls into the class 'Supernatural Military Intervention'." They argue from the evidence up, implicitly assuming the event is possible. By forcing the prior to the surface, you expose the theological or ideological assumptions driving the inquiry.

  **Desideratum or Prejudice?**
  It is a **genuine desideratum for policy**, but a **methodological prejudice of social science.**
  *   *As Policy:* It is necessary. A state cannot teach "probable" history if the probability rests on a hidden assumption about the nature of gods or miracles.
  *   *As Historiography:* It privileges a Bayesian/Social-Science model over a Hermeneutic/Philological one. It assumes history is a science of types rather than a study of unique particulars. If the Exodus is *sui generis*, reference classes are irrelevant. However, for a *textbook standard*, the scientific approach is required to ensure consistency across cases (Troy vs. Exodus).

  ---

  ### Part 4: Methodology Scorecard

  **1. Criteria of Authenticity (Biblical/Textual Scholarship)**
  *   **Score:** Fails Calibration (Req 3) and Reference Class (Req 6).
  *   **Notes:** Designed to find "kernels" in texts, not to assess event probability. Often circular (criteria derived from the text they validate). Cannot handle fusion well.

  **2. Conservative Stance (Reliable until disproven)**
  *   **Score:** Fails Silence Weighting (Req 8) and Causal Independence (Req 4).
  *   **Notes:** Treats silence as neutral too often. Vulnerable to feedback loops (accepts commemorative layers as confirmation). Good for Media Neutrality.

  **3. Minimalist Stance (Late construction unless attested)**
  *   **Score:** Fails Media Neutrality (Req 7) and Reference Class (Req 6).
  *   **Notes:** Implicitly requires literacy. Overweights silence (Req 8). Priors are hidden but effectively zero for most traditions.

  **4. Explicit Bayesian Treatment**
  *   **Score:** Passes Reference Class (Req 6) and Calibration (Req 3). Fails Stakeholder Neutrality (Req 10) in practice.
  *   **Notes:** Mathematically robust, but priors are subjective. Two Bayesians with different reference classes reach different verdicts. Hard to explain in a textbook.

  **5. Anthropological (Social Memory/Oral Transmission)**
  *   **Score:** Passes Fusion (Req 2) and Media Neutrality (Req 7). Fails Termination Rule (Req 9).
  *   **Notes:** Excellent at explaining *why* the story exists. Poor at adjudicating *if* the event happened. Tends to dissolve the question into "memory" rather than "history."

  ---

  ### Part 5: The Split and Reissued Desiderata

  **Conclusion:** "When does a legend become history?" is not one question. It is four. A single textbook verdict is epistemologically dishonest. The Ministry should not ask for a verdict on "The Historicity of the Exodus." It should ask for a verdict on four specific claims.

  **Reissued Desiderata by Question:**

  **Q1: Did the Central Event Occur? (e.g., A mass departure from Egypt)**
  *   **Primary Standard:** **Causal Independence (Req 4).**
  *   **Requirement:** Evidence must exist outside the causal sphere of the tradition's propagation.
  *   **Verdict:** Probable / Improbable / Undecidable.

  **Q2: Did the Central Figure Exist? (e.g., Moses/Arthur)**
  *   **Primary Standard:** **Referential Stability (Req 5).**
  *   **Requirement:** A name must be anchored to a specific time and location with minimal drift.
  *   **Verdict:** Historical Person / Eponymous Construct / Unknown.

  **Q3: Is the Narrative Reliable? (e.g., The plagues/The sword in the stone)**
  *   **Primary Standard:** **Retrospective Calibration (Req 3).**
  *   **Requirement:** Does this type of narrative detail survive contact with known false traditions in calibration cases?
  *   **Verdict:** Reportage / Theologized / Mythic.

  **Q4: Is the Transmission Continuous? (e.g., Oral tradition to Text)**
  *   **Primary Standard:** **Temporal Stratification (Req 2).**
  *   **Requirement:** Can we distinguish the layer of the event from the layer of the recording?
  *   **Verdict:** Contemporary / Near-Contemporary / Retrospective.

  **Policy Recommendation:**
  The textbook should not say "The Exodus is History." It should say:
  *"Archaeological evidence for a mass departure is currently lacking (Q1: Improbable). The figure of Moses cannot be historically isolated (Q2: Construct). The narrative contains elements typical of Late Bronze Age treaty structures (Q3: Theologized). The text was compiled centuries after the alleged events (Q4: Retrospective)."*

  This satisfies your demand for granularity while acknowledging that the "Single Verdict" is the source of the argument's collapse.
