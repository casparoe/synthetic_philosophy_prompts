answer: |-
  **Methods Section: Evaluation Protocol and Conceptual Resonance Scoring**

  **1. The Case Against Single-Label Exact Match**
  Standard benchmarking protocols treat analogy items as closed-form logic puzzles, assuming a single ground-truth derivation exists independent of the solver. We argue that applying single-gold-label scoring to letter-string analogy tasks constitutes a category error regarding the structure of the microworld. In formal logic, axioms are fixed; in the Copycat microworld, the "axioms" are perceptual resources subject to contextual pressure.

  The alphabet provided in these items is not a fixed mathematical group; it is an under-specified semantic space. Whether the alphabet is cyclic (z wraps to a), bounded (z has no successor), or symmetric (reversal is valid) is not stated in the prompt. These properties are discovered, not given. Consequently, an answer like `xya` for the target `xyz` (given `abc:abd`) is not an error in calculation; it is a valid deduction based on the hypothesis that the alphabet is cyclic. Similarly, `xyd` is valid under the hypothesis that the rule operates on token identity ("replace with d") rather than relational structure ("successor").

  Exact-match scoring treats these competing conceptual frameworks as noise. It penalizes a model for adopting a consistent but minority conceptualization (e.g., prioritizing group length over letter identity in `mrrjjj`). This conflates *conceptual divergence* with *reasoning failure*. A model that produces a human-like distribution of answers demonstrates that it inhabits the same conceptual landscape as the human baseline, experiencing the same attractors and repulsions in the solution space. A model that outputs only the modal answer may simply be overfitting to the most common surface pattern without grasping the underlying structural tensions. Therefore, we propose **Conceptual Resonance Scoring (CRS)**, which evaluates the divergence between the model's output distribution and the human baseline distribution (e.g., via Jensen-Shannon divergence), rather than binary accuracy against a single label.

  **2. Addressing the Relativism Objection**
  A common objection to distributional scoring is that it renders correctness relative to the sample population: if the human baseline shifts, the "correct" answer shifts. This is framed as a *reductio ad absurdum*, implying the benchmark measures popularity rather than competence.

  This objection misunderstands the objective of the benchmark. We are not measuring logical validity in a vacuum; we are measuring *cognitive fidelity*. The "truth" in this domain is not Platonic but empirical: it is defined by the inductive biases of the cognitive architecture processing the symbols. If the human population splits 60/40 on an item, it indicates the item sits on a ridge between two conceptual basins. A model that outputs the 60% answer 100% of the time is not "more correct" than the humans; it is *over-confident* and lacks the nuanced sensitivity to the competing pressures that define the task.

  This is not relativism in the sense that "anything goes." It is stability analysis. The human distribution acts as a fixed point of reference for what constitutes human-like reasoning *at this time, with these resources*. If the human distribution changes (e.g., due to cultural shifts in how the alphabet is taught), a model that fails to track that shift is, by definition, becoming less human-like. The benchmark measures alignment with the cognitive mechanism, not alignment with an external oracle.

  **3. Unanimity as a Prediction, Not an Exception**
  Critics argue that on "easy" items (e.g., `abc:abd :: ijk:?`), where human agreement is near 100%, CRS collapses into exact-match scoring, rendering the complex framework vacuous for the majority of the test set.

  We argue the opposite: unanimity is a specific *prediction* of the conceptual pressure theory, not an exception to it. High agreement indicates a "deep basin" in the conceptual landscape where structural pressures converge on a single description (e.g., "successor" is the only salient relation; no boundaries or grouping complications exist). CRS validates the *design theory* of the items. If we design an item to be ambiguous but humans agree unanimously, our design theory is wrong. If we design an item to create tension and humans split, the theory is right.

  To make this actionable, we do not discover diffusion post-hoc; we engineer it based on structural features known to induce competing descriptions. We categorize items by **Slippage Potential**:
  *   **Boundary Conditions:** Items involving `z` or `a` (e.g., `xyz`) inherently trigger the "bounded vs. cyclic" tension.
  *   **Description Level Competition:** Items with repeated letters (e.g., `mrrjjj`) trigger "letter identity vs. group length" tension.
  *   **Directional Ambiguity:** Items with symmetry (e.g., `aba`) trigger "left-to-right vs. right-to-left" tension.

  A valid benchmark must contain a stratified mix of these features. On low-potential items, CRS rewards mode-matching. On high-potential items, CRS rewards entropy-matching. This allows us to distinguish between a model that genuinely understands the structural pressures and one that simply memorizes the most frequent string transformations.

  **4. Multi-Source Constraints and Distribution Sharpening**
  To further probe the stability of these conceptual pressures, we introduce **Dual-Source Items** (e.g., providing both `abc→abd` and `abc→bcd` as source pairs for a single target).

  On our account, adding a second source pair should **sharpen** the human distribution (reduce entropy), not blur it. A single source pair (`abc→abd`) allows multiple consistent rules (increment last, replace with d, etc.). A second source pair (`abc→bcd`) acts as a constraint satisfaction filter. It eliminates rules that cannot generalize across both sources.
  *   *Example:* If `abc→abd` suggests "increment last" and `abc→bcd` suggests "increment all," the intersection might force a higher-order abstraction like "modify the rightmost group."
  *   *Prediction:* For a target like `mrrjjj`, a single source might yield a split between `mrrkkk` and `mrrjjjj`. A dual source should force convergence on whichever answer satisfies the abstracted rule common to both sources.

  If a model's distribution does not sharpen in response to the added constraint (i.e., it remains diffuse when humans converge, or converges when humans remain split), it indicates the model is not performing rule abstraction but rather pattern matching on surface features. CRS captures this sensitivity to contextual constraint; exact-match scoring cannot, as it treats the additional context as irrelevant provided the final string matches the gold label.

  **Summary of Scoring Protocol**
  We will report two metrics:
  1.  **Mode Accuracy:** Traditional exact match against the most common human answer (for comparability with prior work).
  2.  **Conceptual Resonance Score (CRS):** The inverse Jensen-Shannon divergence between the model's sampled output distribution (N=50 generations per item) and the empirical human distribution collected during piloting.

  Items will be weighted by their *Slippage Potential* score. High-potential items contribute more to the CRS metric, ensuring that the benchmark rewards sensitivity to conceptual ambiguity rather than just rote retrieval of the dominant pattern.
