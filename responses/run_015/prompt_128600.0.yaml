answer: |-
  This is a precise dissection of a critical habitus that governs our literary institutions. You have identified a fault line where aesthetic ethics meets political epistemology. To reconstruct the implicit theory that licenses this tri-partite distinction—persuasion (moral), manipulation (political), and witness (historical)—we must excavate the specific philosophical commitments regarding autonomy, the nature of belief, and the epistemic weight of facticity that allow this taxonomy to function without collapsing into hypocrisy.

  Here is the reconstruction of the implicit theory, distinguished by what it strictly requires to function logically versus what merely fits it culturally, followed by an analysis of its viability under the condition of ethical neutrality.

  ### I. The Implicit Theory of Autonomy: The "Imagination Exemption"

  The primary distinction between the "persuasive" moral revision and the "manipulative" political thesis rests on a specific, often unstated, definition of readerly autonomy.

  **The Commitment:** The critical establishment operates on a **Non-Cognitivist Theory of Emotion**. It presupposes that moral dispositions (how I feel about the parent) are distinct from propositional beliefs (what I think about the policy).
  *   **Strict Requirement:** For the taxonomy to hold, it must be true that emotional architecture does not constitute belief-formation. If feeling pity for a character is logically equivalent to assenting to the proposition "this character deserves pity," then the "persuasive" narrative is simply a covert form of political argument. The system requires that affective states be categorized as *pre-rational* or *extra-rational* expansions of the self, whereas political assent is categorized as a *rational* contract.
  *   **What Fits Well:** This aligns with a Romantic/Modernist ideal of the "aesthetic sphere" as a sanctuary from the instrumental rationality of the political sphere. It fits the liberal humanist preference for individual moral growth (internal, safe) over collective political action (external, contentious).

  **The Autonomy Paradox:** The theory posits that autonomy is violated only when the reader is asked to adopt a *public* stance (politics), but not when they are asked to adopt a *private* stance (moral sentiment). This implies that legitimate persuasion must operate through the reader's **simulative imagination** (trying on a life) rather than their **judicative reason** (adopting a rule). The moment the narrative architecture points toward a generalizable rule (a thesis), it crosses from "exploration" to "instruction," and instruction is deemed a violation of the reader's sovereign rationality.

  ### II. The Rational/Affective Division and Its Collapse

  You ask if this implicitly endorses a division between rational and affective influence that would collapse under scrutiny. The answer is yes; the taxonomy survives only by ignoring the **Cognitive Theory of Emotions** (championed by philosophers like Martha Nussbaum or Robert Solomon), which argues that emotions *are* judgments of value.

  **The Commitment:** The critical practice requires a **Folk-Psychological Dualism**. It treats the heart and the head as separate jurisdictions.
  *   **Strict Requirement:** It requires that the "mechanism of influence" (focalization, withholding) be ethically neutral *in a vacuum*, but ethically charged based on the *faculty* it targets. If the mechanism targets the "moral imagination," it is benign. If it targets the "political intellect," it is coercive.
  *   **The Collapse:** If we acknowledge that inducing grief for a victim of war is functionally identical to inducing assent to the proposition "this war was unjust," the distinction evaporates. The "persuasive" narrative about the parent *is* a political thesis about family structure, gender roles, or culpability. The taxonomy survives only by refusing to trace the moral sentiment to its logical, propositional conclusion. It treats the moral sentiment as an end in itself, whereas the political belief is treated as a means to an end.

  ### III. The Documentary Exemption: The Epistemic Status of Fact

  The "documentary exemption" is the most philosophically fragile yet institutionally robust part of this triad. Here, the same emotional engineering is reclassified from "manipulation" to "witness."

  **The Commitment:** This relies on a **Correspondence Theory of Truth** that trumps **Aesthetic Ethics**.
  *   **Strict Requirement:** For this to hold, factual grounding must possess an ethical gravity that overrides the reader's right to aesthetic consent. It presupposes that the *truth value* of the content immunizes the *method* of delivery. It requires that "witness" is a category outside of rhetoric—a direct transmission of reality where the medium becomes transparent.
  *   **What Fits Well:** This fits the contemporary demand for "authenticity" and the ethical imperative of memory. It allows the institution to champion difficult, coercive texts (trauma narratives) without accusing them of the same "manipulation" they condemn in political thrillers or didactic fiction.
  *   **The Implication:** This suggests that the ethics of influence are **Consequentialist** in the documentary mode (the good outcome of remembrance justifies the coercive means) but **Deontological** in the political mode (the act of persuading belief is inherently wrong, regardless of the truth of the belief). This inconsistency is the glue holding the taxonomy together.

  ### IV. Strict Requirements vs. Good Fits

  To clarify the structural integrity of this critical consensus, we must distinguish between the logical prerequisites and the cultural conveniences.

  **What the Practice Strictly Requires:**
  1.  **Non-Cognitivism:** Emotions must not be treated as truth-claims.
  2.  **Public/Private Split:** Political beliefs are public property subject to rational scrutiny; moral sentiments are private property subject to aesthetic exploration.
  3.  **Referential Immunity:** Reference to actual historical events alters the ethical status of the narrative technique from "rhetoric" to "testimony."

  **What Merely Fits It Well:**
  1.  **Anti-Didacticism:** The Modernist hangover that "art should not preach." This fits well because it protects the critic from having to engage with the politics, allowing them to focus on the "craft."
  2.  **Liberal Individualism:** The idea that the reader is a sovereign consumer of experiences. It fits well because it frames "manipulation" as a consumer rights violation rather than an epistemic problem.
  3.  **Institutional Risk Management:** Condemning political fiction as "manipulative" is safer than condemning it as "wrong." It allows the committee to reject a radical thesis without having to refute it on its merits.

  ### V. The Neutral Emotional Architecture Test

  Finally, you ask if these standards could survive if we treated emotional architecture as ethically neutral regardless of whether its output is classified as belief or sentiment.

  **The Verdict:** No. The taxonomy would immediately collapse.

  If the mechanism (focalization, pacing, withholding) is ethically neutral, then the ethical weight shifts entirely to the **Truth Value of the Output**.
  *   If the emotional architecture is neutral, then a novel that engineers pity for a genocidaire using "documentary" techniques is ethically identical to one that engineers pity for a victim.
  *   If the architecture is neutral, then a novel that engineers assent to a socialist thesis is ethically identical to one that engineers assent to a liberal thesis about parental forgiveness.

  **The Necessary Shift:** For the standards to survive this neutrality test, the critical establishment would have to abandon the *process-based* critique ("this is manipulative") and adopt a *content-based* critique ("this is false" or "this is harmful").
  *   Currently, they say: "You manipulated me into believing X." (Process critique)
  *   They would have to say: "X is false, and you used effective tools to make me believe it." (Epistemic critique)

  They avoid the latter because it requires them to take a stance on the truth of X. It is much safer to condemn the *tool* (manipulation) than the *product* (the political thesis).

  ### VI. Conclusion: The View of Autonomy and Influence

  For your observed taxonomy to hold together, the following view must be in place:

  1.  **Autonomy is Negative, not Positive:** Autonomy is defined as freedom from *external* determination (political instruction) but allows for *internal* determination (emotional immersion). The reader is sovereign over their votes, but not their tears.
  2.  **Ethics of Influence is Context-Dependent:** The same rhetorical act is ethical or unethical based on the ontological status of its object (Character = Ethical; Policy = Unethical; History = Sacred).
  3.  **Epistemic Status of Feeling is Subordinate:** Feelings are epistemically inert unless anchored by History. A feeling about a parent is "insight." A feeling about a policy is "bias." A feeling about a historical atrocity is "witness."

  This system is not philosophically coherent; it is **institutionally coherent**. It allows literary culture to claim it shapes moral sensibilities (persuasion) without accepting responsibility for shaping political realities (manipulation), while reserving the right to claim moral authority when convenient (witness). To expose this is to reveal that the "manipulation" critique is rarely about the protection of the reader's mind, but about the protection of the institution's neutrality.
