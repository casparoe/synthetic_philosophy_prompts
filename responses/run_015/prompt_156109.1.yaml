answer: |-
  **Project Title:** Contrastive Calibration: Moral Pedagogy and Structural Juxtaposition in Plutarch's *Parallel Lives*

  **Project Summary and Research Question**
  Contemporary moral psychology and exemplarist ethics operate largely within an "admiration-and-imitation" framework. This standard model assumes that biographical subjects function as templates: the reader identifies a virtue in the subject, admires it, and attempts to reproduce it in their own context. The philosophical debate currently turns on whether admiration yields moral knowledge and whether imitation is feasible across disparate historical circumstances. However, this framing ignores the specific textual architecture of the genre's founding model. Plutarch's *Parallel Lives* does not present isolated subjects but paired biographies capped by explicit comparisons (*Synkrisis*). Furthermore, Plutarch explicitly privileges private anecdotes—gestures, jokes, moments of temper—over public deeds as indices of character.

  This project asks: **Does the structural juxtaposition of the *Parallel Lives* function phenomenologically as a mechanism of "contrastive calibration" rather than exemplarist imitation?**

  The standard framing leaves this question open because it treats the biographical subject as a singular vector (reader to hero). It cannot account for the triangular relationship established by Plutarch (reader to hero A <-> hero B). If the moral work is done by holding two lives against each other to gauge a "direction" in moral space rather than copying a specific outcome, the admiration-and-imitation model is categorically insufficient. This project seeks to determine if the text compels this calibrated reading through its composition.

  **Methodology and Work Plan**
  The method is textual analysis focused on structural mechanics rather than thematic overview. I will test the calibration model by examining whether the text resists singular imitation. If the calibration model holds, the pairs should present mutually correcting flaws that prevent simple copying of either subject.

  *   **Months 1–3: Corpus Selection and Anecdotal Coding.** I will select three complete pairs where the *Synkrisis* is extant and the subjects are morally complex (e.g., Alcibiades/Coriolanus, Demetrius/Antony, Lysander/Sulla). I will catalog incidental details (remarks, gestures) versus public deeds in the narrative sections, coding them for moral ambiguity. This tests Plutarch's programmatic claim that small details reveal character where battles do not.
  *   **Months 4–6: Structural Analysis of the *Synkrisis*.** I will analyze the comparative endings not as verdicts but as weighing mechanisms. I will map the criteria used for comparison. Are the criteria consistent across pairs? Do they prioritize character stability over success? This establishes whether the comparison is a consistent pedagogical tool or rhetorical ornament.
  *   **Months 7–9: Testing the Calibration Hypothesis.** I will attempt to construct an "imitation model" for each pair based solely on the narrative. I will then measure this against the *Synkrisis*. If the *Synkrisis* systematically undermines the imitability of the narrative hero by highlighting fatal flaws visible only in contrast, the calibration model is supported. If the narrative stands alone as a coherent model of virtue independent of the pair, the standard model holds.
  *   **Months 10–12: Synthesis and Drafting.** I will write the dissertation chapter, focusing on the implications for moral epistemology. If the calibration model holds, it suggests moral knowledge is comparative and situational rather than replicative.

  **The Problem of the Verdict**
  A significant obstacle is that Plutarch's comparisons frequently conclude by declaring one subject greater than the other. This appears to undercut the calibration reading, reverting to a hierarchical verdict rather than a spatial mapping. This project treats this not as a contradiction to be explained away, but as a live branch point for the argument.

  I will test whether the verdict is the *termination* of calibration or its *result*. If the verdict is reached by weighing specific character traits revealed through the contrast (e.g., Subject A is greater because he endured misfortune with less resentment than Subject B), then the verdict is the output of the calibration process. However, if the verdict relies on external metrics (military success, political power) unrelated to the character details highlighted in the narratives, the calibration model fails. I will determine which metric dominates the final judgment. This distinction is crucial: if the verdict relies on external success, Plutarch is teaching us to admire winners; if it relies on calibrated character traits, he is teaching us to measure ourselves.

  **Success and Failure Conditions**
  A **positive result** would demonstrate that the *Synkrisis* consistently reinterprets the narrative anecdotes in light of the paired subject, such that neither life yields a complete moral lesson in isolation. It would show that the "moral" of the life is emergent from the comparison.

  The project **fails** if the analysis reveals that the *Synkrisis* is inconsistent or rhetorical filler that does not alter the moral reading of the individual lives. Specifically, failure is defined as finding that the narratives function perfectly well as standalone exemplars and the comparisons add no pedagogical value regarding character assessment.

  The **likeliest failure** is that the verdicts of greatness rely too heavily on external success rather than character calibration. If Plutarch ultimately declares the more successful general "better" regardless of the character contrasts established in the anecdotes, the project must conclude that the calibration model is limited to the narrative phase but collapses under the weight of conventional social valuation in the conclusion. This would still be a valuable contribution, delineating the limits of Plutarch's moral innovation, but it would negate the stronger claim that the *Parallel Lives* offer a distinct epistemology of virtue.

  **Scope and Feasibility**
  This scope is limited to three pairs to ensure depth over breadth within the twelve-month window. Attempting to cover the entire corpus would risk superficiality. By focusing on pairs with high moral ambiguity, I maximize the chance of detecting calibration mechanics. If the method proves robust, it can be expanded in future work; if not, the limited scope prevents wasted effort. This ensures a determinate answer within the fellowship year.
