answer: |-
  | Pair | Verdict | Severity (1–5) | What_Gives | Cost |
  | :--- | :--- | :--- | :--- | :--- |
  | **4 vs 5** | Genuine | 4 | **4 (Alienation)** must be redefined. You cannot ground alienation in a trans-historical "human flourishing" (essentialism) if you hold to **5 (Immanent Critique)**. Alienation must be framed as a contradiction internal to capitalist social forms (e.g., value-form), not a violation of human nature. | You lose the "Humanist Marx" appeal. The critique becomes structural/functional rather than ethical/anthropological, which may feel colder to a reading group. |
  | **1 vs 6a** | Genuine | 3 | **6a (Rentiers)** requires expansion. If exploitation is strictly the production gap (**1**), a pure rentier doesn't exploit *directly*. You must adopt a class-based theory (e.g., Roemer) where rentiers appropriate a share of the *total* social surplus value via financial mechanisms. | You move away from Marx's technical definition in *Capital* Vol 1 toward a more sociological/analytical Marxism definition of class and exploitation. |
  | **3 vs 4** | Apparent | 2 | **Meta-ethics** needs clarification. **3** denies *justice* (a juridical category), while **4** asserts *badness* (a functional or eudaimonic category). They only conflict if you assume all normative claims are moral claims. | You must explicitly distinguish "unjust" (violating rights/norms of exchange) from "oppressive/alienating" (hindering agency/flourishing). |
  | **2 vs 1** | Apparent | 2 | **1 (Measurability)** relies on the "New Interpretation." If prices diverge from labor values (**2**), the "gap" in **1** is still measurable in labor-command or value-added terms, not direct labor-hours. | You concede that *Capital* Vol 1's simple value schema is an abstraction, not a direct price predictor, which traditionalists may contest. |

  The actual problem is **4 vs 5**: grounding alienation in "human flourishing" secretly imports the external ideal your immanent critique forbids.
  The single revision that cleans up the most is to redefine **Alienation (4)** as "subordination to abstract social powers (value/market)" rather than "lack of self-governance," making it consistent with **Immanent Critique (5)**.
  One tension I didn't list: **3 vs 6b** — if the Global North worker is a "net beneficiary" of global exploitation, their local wage may no longer qualify as a strict "exchange of equivalents" (**3**) without a theory of imperialist value transfer.
