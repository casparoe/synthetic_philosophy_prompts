answer: |-
  **Mark: 54/100 (Lower Second Class)**

  **General Comment:**
  You demonstrate a clear familiarity with the primary text and key secondary literature (Wallace, Watson), and your essay is structured logically. However, the mark is limited by a fundamental misinterpretation of Strawson's account of internal norms, a failure to follow a specific instruction regarding case analysis, and a significant misattribution of Watson's view. In an upper-level seminar, accurate textual interpretation is as important as argumentative ambition.

  **Point-by-Point Assessment:**

  **Paragraph 1:**
  *   **Strengths:** Your summary of Strawson's naturalistic turn and the definition of the reactive attitudes is accurate. You correctly identify that Strawson grounds responsibility in human nature rather than metaphysical facts about determinism.
  *   **Weaknesses:** The claim that "an agent is morally responsible when and because resentment toward her would be warranted" risks circularity if not carefully qualified. Strawson is more precise: responsibility is constituted by our susceptibility to these attitudes, and their *appropriateness* is determined by the quality of will.

  **Paragraph 2:**
  *   **Strengths:** You correctly distinguish between the participant and objective stances and note Strawson's claim that the participant stance is non-optional globally.
  *   **Weaknesses:** You list "the child, the psychopath, the person acting under coercion" as targets of the objective attitude. Be careful here: Strawson distinguishes between *exempting* conditions (which invite the objective attitude globally, e.g., severe psychopathy) and *excusing* conditions (which invite the objective attitude locally regarding a specific act, e.g., coercion or accident). Conflating these weakens your later argument about internal resources.

  **Paragraph 3 (Substantive Error):**
  *   **Major Misinterpretation:** You argue that Strawson fails the internal adequacy condition because "what we actually feel is the standard" and he "cannot say of any particular episode of resentment that it is mistaken." This is a significant misreading. Strawson explicitly provides internal resources for distinguishing apt from inapt blame: the **quality of will**. We modify or suspend resentment when we see the action did not manifest ill will (accidents) or when the agent was not capable of ordinary goodwill (exempting conditions). These *are* the internal norms. You have treated Strawson as a radical descriptivist (whatever we feel is right), whereas he is a normative naturalist (what we feel is appropriate relative to interpersonal demands).
  *   **Missed Instruction:** The prompt explicitly asks you to "Discuss at least one case in which resentment seems inapt, and say what Strawson's account is committed to saying about it." You mention cases in passing in Paragraph 2, but you do not discuss a specific case in detail here. You assert Strawson has no resources rather than demonstrating how his resources fail (or succeed) in a concrete example. This is a failure to answer the question set.

  **Paragraph 4:**
  *   **Attribution Error (Wallace):** Your summary of Wallace is generally acceptable; he does link reactive attitudes to normative competence/reasons-responsiveness to supply a normative standard.
  *   **Attribution Error (Watson):** Your claim that Watson argues "only the aretaic notion [attributability] is really constitutive of responsibility" and that reactive attitudes are "at best a useful heuristic" is incorrect. In "Two Faces of Responsibility," Watson argues that *both* attributability and accountability are genuine aspects of responsibility. He critiques Strawson for conflating them, but he does not discard accountability (which is tied to the reactive attitudes and demands). He argues we need to distinguish them to handle specific puzzles, not that one is real and the other is merely heuristic. This misrepresentation undermines your conclusion about how the "gap" is filled.
  *   **Argumentative Gap:** You conclude that Wallace and Watson "fill the gap" left by Strawson's failure. However, if Strawson *does* have internal norms (quality of will), the gap is not as wide as you suggest. The real debate (which you hint at but do not explore) is whether Strawson's internal norms *amount to* a reasons-responsiveness view (as McKenna might argue) or whether they remain distinct. You bypass this nuance by declaring Strawson's account normatively empty.

  **Advice for Improvement:**
  1.  **Read for Normativity:** When reading Strawson, pay close attention to how he distinguishes between *having* a reactive attitude and it being *appropriate*. The internal adequacy condition is satisfied by the excusing and exempting conditions, which rely on the interpretation of the agent's will.
  2.  **Follow Instructions:** Ensure you address every part of the prompt. The request for a specific case study was an opportunity to test your interpretation against a concrete example; omitting it leaves your argument abstract and untested.
  3.  **Check Secondary Claims:** When citing interlocutors like Watson, ensure you represent their conclusion accurately. Watson preserves the importance of accountability; he does not reduce it to a heuristic.

  **Summary:**
  You have written a coherent essay that engages with the right literature, but the central philosophical claim rests on a misreading of Strawson's internal criteria, and the handling of secondary sources contains significant errors. This prevents the essay from reaching the upper-second threshold.
