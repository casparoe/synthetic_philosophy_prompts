          *   **Watson:** Gary Watson ("Two Faces of Responsibility"). The candidate says Watson argues "only the aretaic notion [attributability] is really constitutive of responsibility, the reactive attitudes being at best a useful heuristic." **This is wrong.** Watson argues *both* are important but distinct. He critiques Strawson for conflating them, but he doesn't discard accountability (which involves reactive attitudes/demands) in favor of solely attributability. He argues we need to distinguish them to solve specific problems, not that one is real and the other is just a heuristic. Furthermore, Watson is often seen as *developing* Strawson, not just saying Strawson fails internal adequacy in the way the candidate suggests.
          *   **The "Collapse" Question:** The prompt asks if satisfying internal adequacy collapses the view into reasons-responsiveness. The candidate says Strawson *fails* adequacy, so Wallace *fills the gap*. This sidesteps the nuanced question of whether Strawson's internal criteria *already amount to* reasons-responsiveness (a common debate, e.g., McKenna).
      *   *Overall Argument:* The core thesis (Strawson fails internal adequacy) is controversial but defensible *if* argued well. However, the justification ("what we feel is the standard") is a caricature of Strawson. Strawson thinks feelings are appropriate or inappropriate based on the quality of will. The candidate misses the normative structure *within* the practice.

