answer: |-
  **MINISTRY OF HEALTH & CIVIC AUTONOMY**
  **WHITE PAPER 44-B: POST-IMPLEMENTATION REVIEW**
  **SUBJECT:** Problems in Living (Reform) Act, Year 1

  *"To call a trouble a disease is to forgive the trouble and enslave the troubled."* — Aris Thorne, Architect of the Autonomy Accord

  **1.0 Introduction**
  One year following the passage of the Problems in Living (Reform) Act, the Ministry confirms that the separation of biology from behavior has achieved projected efficiency gains. By restricting medical jurisdiction to demonstrable bodily lesions, we have liberated citizens from the paternalism of the therapeutic state. The following clauses outline the operational framework ensuring that liberty is preserved through strict contractual consent.

  **2.0 Lesion Review Board (LRB) Certification**
  All requests for state support are routed through the LRB. Conditions exhibiting verifiable bodily lesions (e.g., necrosis, tumours, enzymatic deficits) remain under Health Ministry jurisdiction. Conditions lacking such markers are reclassified as Problems in Living and transferred to the Ministry of Civic Conduct. This binary ensures budgetary clarity: biology is funded; behavior is contracted. This eliminates the ambiguity where moral failures were previously subsidized as medical events.

  **3.0 Form 7B Voluntary Distress Contract**
  No individual may receive state intervention without signing Form 7B. This document confirms the signatory understands their distress is not a disease but a deviation in living. By signing, the client accepts full agency over their conduct. Involuntary holds are abolished. If a signatory refuses assistance, their right to refuse is upheld as a cornerstone of liberty. The State does not intervene unless the contract is breached via public harm.

  **4.0 Provisional Category & Retroactive Lesion Clause**
  Conditions lacking current biomarkers are classified P-Null (Provisional). Should future science identify a lesion for a P-Null condition, the Retroactive Lesion Clause activates. All prior Form 7B contracts signed by individuals under that classification are voided *ab initio*. The State acknowledges these individuals were not agents but biological mechanisms. Compensation claims for wrongful contractual enforcement will be processed via Tribunal 9. While current liabilities are unquantified, this mechanism ensures historical accuracy regarding agency.

  **5.0 Jurisdictional Case Processing**
  *   **Neurological Degradation:** Cases involving visible atrophy or tumours (e.g., dementia) remain medical. Since bodily mechanism overrides agency, contractual capacity is revoked. The State assumes guardianship, acknowledging conduct is determined by physiology.
  *   **Acute Psychosis & Criminal Conduct:** Where no lesion is found, insanity defences are inadmissible. An individual committing harm during psychotic episodes is liable under criminal statute. Their refusal of help prior to the event validates their status as a responsible agent.
  *   **Somatic Distress (Migraine, Fatigue):** Without lesion confirmation, these are reclassified as Civic Burdens. Budgets shift from Health to Conduct. Signatories must negotiate accommodations via contract rather than claim medical leave.
  *   **Substance Dependency:** This reform yields significant liberty gains. Ingestion is a voluntary act. Private use is decriminalized; public nuisance is penalized. Clients are no longer "treated" for vice but held to contractual standards of public order.

  **6.0 Fiscal Outlook**
  The transfer of P-Null cases to Civic Conduct reduces Health expenditure by 40%. While Tribunal 9 liabilities for future Retroactive Clause claims are unquantified, current savings justify the risk. We have replaced the therapeutic state with the contract state.

  ^1 It is gratifying to note that no *symptoms* were ignored during this transition; all distress was merely re-categorized.

  ***

  **Afterword**

  This piece leans heavily on Szasz's strict lesion criterion, pushing his distinction between "brain disease" and "problems in living" to its bureaucratic extreme. I am reasonably confident the parody is fair regarding his hostility to involuntary treatment and the medicalization of vice; Szasz genuinely argued addiction should be a legal, not medical, issue. The Retroactive Clause exaggerates the logical consequence of his fallibility admission: if mental illness is a myth, but later proves real, the state's prior coercion was unjust. I am least sure about Clause 5's handling of dementia; Szasz accepted neurological disease, but framing guardianship as "revoked capacity" rather than "care" risks caricature. The footnote slip is the only place illness-talk survives, highlighting how deeply the vocabulary is entrenched even when banned.
