answer: |-
  **Private Brainstorming**

  *   **Core Tension:** Williams wants reasons to explain action (internalism). But if "wanting to do what there is reason to do" is in $S$ (subjective motivational set), then any reason becomes internal. The distinction collapses.
  *   **Is this fatal?** If the distinction collapses, internalism loses its critical force. It can no longer say "you have no reason" to the immoralist, because the immoralist likely has the formal policy.
  *   **Load-bearing Objection:** The circularity of the reason-tracking policy. To have the policy, you must already grasp the concept of a reason. If the reason is external, the desire presupposes the external reason exists. Internalism was supposed to ground reasons in motivation, not vice versa.
  *   **Noise:** "People are irrational." Williams accounts for this via "sound deliberation." "Morality requires external reasons." Irrelevant to the metaphysical structure.
  *   **The Fix:** Restrict $S$. Only *substantive* ends (projects, loves) count, not formal policies. But is this arbitrary? It looks like moving the goalposts to save the theory's "bite."
  *   **Verdict:** It is a reductio of the unrestricted view. Williams must restrict $S$. The underdetermined premise is the neutrality of elements in $S$. Formal dispositions cannot ground substantive reasons without vacuity.
  *   **Residual Case:** The agent without the policy. Internalism still bites here. But since most have the policy, the theory is trivialized for the norm. This matters because philosophy should explain the norm, not just the edge case.

  ***

  **The Echo Chamber: A Reductio of Unrestricted Internalism**

  Bernard Williams's internal reasons thesis asserts that for a statement to be true about an agent having a reason to act, there must be a sound deliberative route from that agent's subjective motivational set to the action. This view is motivated by a desire to ensure that reasons can figure in the explanation of action. If a reason cannot motivate the agent even under idealized reflection, it stands apart from her agency as a bare verdict, lacking normative grip. However, this framework faces a structural collapse when confronted with what we might call "echo internalism." If nearly every adult agent possesses a higher-order commitment to do what there is decisive reason to do, then any candidate consideration can travel a deliberative route to action. The external reason echoes into the internal set, dissolving the distinction Williams seeks to protect.

  This collapse is not a harmless equivalence; it is a reductio of the unrestricted internal reasons thesis. The primary function of internalism is to provide a critical tool for assessing whether an agent truly has a reason, based on who they are and what they care about. It is supposed to allow us to say to the cruel agent that they have no reason to be kind, because kindness connects to nothing in their subjective set. But if the cruel agent possesses a formal policy of "doing what there is reason to do," and if kindness is objectively reasonable, then the internalist must concede the cruel agent has an internal reason to be kind. The theory loses its ability to discriminate between agents who are responsive to values and those who are merely responsive to the concept of reasons. It renders internalism trivially true for almost all rational agents, vacating its explanatory power.

  To save the thesis, one might propose a principled restriction: only substantive ends—projects, commitments, desires for specific outcomes—can ground internal reasons, while formal reason-tracking policies cannot. This restriction is not merely a device to preserve the theory's dramatic verdicts; it is required to maintain the explanatory role reasons are supposed to play. A reason explains an action by linking it to something the agent finds valuable or desirable. If the only motivation is "because it is a reason," the explanation is empty. It presupposes the very normative force it is meant to ground. For a reason to be internal, it must anchor in a substantive concern that gives the action weight for the agent, not merely a formal disposition to comply with normative verdicts.

  Critics might argue this restriction is arbitrary, designed solely to prevent the collapse. However, the arbitrariness charge fails when we recall the motivation for internalism: the link between reasons and motivation. A formal policy links the agent to the *concept* of a reason, not to the *content* of the action. It is a second-order disposition that parasitizes first-order values. If internalism is to explain how reasons guide action, it must trace the guide-wires to substantive ground. Allowing formal policies to do the grounding severs the connection between reasons and the agent's concrete identity, reducing the subjective motivational set to a mere receptacle for normative commands.

  Nevertheless, the residual case remains significant. Consider the agent who lacks even the reason-tracking policy—the thoroughgoing amoralist or psychopath. For this agent, the internalist distinction still bites. If they lack the substantive ends and the formal policy, they have no internal reasons to be moral. This shows that the thesis retains some force at the margins. However, a theory of reasons that applies only to the pathological edge case while collapsing for the normal population is deeply flawed. The fact that the distinction holds for the psychopath does not redeem its triviality for the rest of us. The theory must account for the normative landscape of ordinary agency, not just the breakdown cases.

  Therefore, echo internalism exposes a critical underdetermination in Williams's argument: the premise that *any* element of the subjective motivational set, combined with *any* sound deliberative route, generates a reason. This premise treats all motivational elements as normatively equivalent. It fails to distinguish between substantive drives that generate value and formal dispositions that merely track it. Williams must reject the neutrality of the motivational set. He must argue that only substantive elements can ground reasons, while formal policies are insufficient because they presuppose the external reasons they are meant to internalize.

  The verdict is clear: echo internalism is a reductio of the unrestricted formulation. Williams cannot accept the collapse without abandoning the critical function of his thesis. He must block the echo by restricting the grounding elements of the subjective motivational set. To do otherwise is to admit that internalism offers no resistance to externalism for any agent capable of grasping the concept of a reason. The internal reasons thesis survives only if it demands that reasons be grounded in what we substantively care about, not merely in our willingness to follow the law of reason. Without this restriction, internalism becomes a hollow echo, repeating external verdicts without explaining their grip.
