answer: |-
  1. When Gregor wakes up unable to speak, Paul's view suggests his human desires are now unreachable and irrelevant. But Gregor still worries about missing his train, proving his old human obligations persist despite the physical change.

  2. When Grete tests which food he likes, Paul's framework implies the family owes him nothing they cannot verify from outside. Yet Grete feels a special duty to care for him anyway, implying moral bonds survive even when subjective experience is unknowable.

  3. When the father throws an apple that sticks in Gregor's back, Paul's logic suggests the father's past debt to the son is voided by the transformation. The wound festers and kills him slowly, though, suggesting the violence of denying his continued identity has real moral consequences.

  4. When the family rents rooms and hides Gregor to maintain income, Paul's idea says their new life values prioritize survival over the transformed being's claims. Gregor retreats to protect them, however, showing he still values their well-being even when they treat him as a burden.

  5. When the charwoman throws his body out and the family takes a tram ride, Paul's theory says the old Gregor's moral claims finally dissolve entirely. The family feels relief rather than justice, hinting that abandoning obligation leaves a moral cost even after the subject is gone.
