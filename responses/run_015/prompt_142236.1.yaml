prompt: |-
  I read philosophy on my own, with no academic background and no access to a library, mostly from papers and blog posts I can find in the open. There is one dispute I have been circling for a couple of years, and instead of asking who is right I would like a diagnosis of why it does not move.

  I came in through a case I take to be standard: a demon tells you that it will destroy something you care about unless you admire it. You plainly have a reason to admire the demon. It also seems wrong to say that the demon is admirable, or that admiring it is the fitting, correct, or appropriate response to it. The same shape recurs whenever a consideration speaks in favour of having an attitude without speaking in favour of what the attitude is about: a reason to be afraid of a dog you know is harmless, because being afraid is exhilarating; a reason to believe something, because believing it would make you happy; a reason to feel gratitude toward someone who benefitted you for manipulative reasons. I first got interested because of the last sort of case, for personal reasons, and it is still the one I care about.

  From what I can find, nobody disagrees about which verdict the central cases should get. The disagreement is entirely about what the distinction is, and about whether there is one distinction at all. One family of answers sorts reasons by what they bear on: some bear on whether the attitude fits its object, others on whether it would be good, useful, or safe to be in that state. Another family says the difference is not in the reasons but in the route to the attitude: a reason of the right kind is one you could arrive at the attitude through, one you could cite in forming it, whereas the demon's threat cannot be cited that way because you cannot admire on command. A third family builds the distinction into a theory of what value is, so that the interesting question becomes whether the phenomenon is a problem for that theory specifically or a problem for everyone equally. And there is no agreement about scope either: some writers seem to treat the phenomenon as special to evaluative attitudes like admiration, others treat belief and intention as instances of the very same thing.

  What I find dispiriting is the pattern rather than the positions. Every account I read handles the easy cases, and then needs some addition to handle the hard ones. There is no agreed criterion, no agreed list of which cases are hard, and no visible mechanism by which anyone's mind gets changed. So I have two hypotheses, and I want to know whether either is close.

  The first is that the phenomenon is largely an artefact of how the cases are described. Very often, what is called a wrong-kind reason for an attitude looks like a perfectly good right-kind reason for some neighbouring attitude: the demon's threat is an excellent reason for relief, or for a wary kind of deference; the manipulator's benefit may be a perfectly good reason for a qualified acknowledgement rather than for gratitude. If that is generally true, then the wrong kind is not a kind of reason at all but a mismatch between the scope of a reason and the attitude we fixed on when we described the case. A test I have been applying to myself: take any alleged wrong-kind reason and ask whether there is some nearby attitude for which it is a right-kind reason, and then ask what happens to the verdict if we redescribe the case around that attitude instead. If the answer is always yes, and if the verdict always flips with the redescription, the distinction is doing less work than it looks like it is doing.

  The second hypothesis is that even if the first fails, the dispute is really three disputes being run under one name, and that writers switch between them without noticing: an extension question about which reasons bear on whether an attitude is correct; a deliberative question about which reasons can be the ones you act on in forming it; and a question about what you are accountable for, which reasons make you criticizable or blameworthy for lacking the attitude. Nothing requires these to have the same answer, and the two sides, as I read them, seem to be answering different ones and treating the disagreement as if it were about a single thing.

  I also have one case I have never seen discussed, which I would like used as a probe rather than as a puzzle to be settled: suppose the demon's threat is that unless you admire it, it will prevent a third party from admiring something genuinely admirable, and your admiring the demon is the only way to stop that. Here the reason for admiring is not merely prudential and not merely about your own state; it points at the fittingness of someone else's attitude. What an account says about this case, and whether it says it for the same reason it says what it says about the original demon case, seems to me to reveal what the account is actually tracking.

  So: is this a substantive disagreement about a real distinction that has not yet been characterised correctly; a verbal disagreement conducted in terms like fitting, appropriate, and reason; several distinct questions sharing a name; or a clash of bedrock case intuitions that neither side can argue for? I would like the diagnosis argued from what the different accounts actually claim and actually need, not a tour of the options. And I would like an honest account of what would count as progress given your diagnosis: a criterion that settles the contested cases, agreement on what the hard cases even are, splitting the question into pieces, or nothing at all, on the grounds that the question is ill-posed. If it is the last, say so and say why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Independent philosophy reader, no academic background, no library access (relies on open access papers/blogs). Deeply engaged with a specific problem (Wrong Kind of Reasons - WKR) for years.
      *   **The Problem:** The "Wrong Kind of Reasons" (WKR) problem in value theory/normativity. Specifically, the distinction between reasons that bear on the *fittingness/correctness* of an attitude (RKR) vs. reasons that bear on the *benefit/prudence* of having the attitude (WKR).
      *   **The User's Observation:** Everyone agrees on the verdicts of the central cases (Demon Case, etc.), but disagrees on the *explanation* (the distinction). Accounts handle easy cases but need ad-hoc additions for hard cases. No consensus on scope (belief? intention?). No visible mechanism for mind-changing.
      *   **User's Hypotheses:**
          1.  *Redescription Hypothesis:* WKRs are actually RKRs for a *different* attitude (e.g., threat is a reason for *deference*, not *admiration*). The distinction is a mismatch between reason scope and attitude label.
          2.  *Conflation Hypothesis:* The dispute is actually three distinct questions (extension/correctness, deliberative/process, accountability/blame) conflated under one name.
      *   **User's Probe Case:** A "Third-Party Fittingness" case: Demon threatens to prevent a third party from admiring something genuinely admirable unless *you* admire the demon. This links the WKR to the fittingness of *another's* attitude.
      *   **The Task:** Diagnose *why* the dispute doesn't move. Is it substantive, verbal, conflated questions, or bedrock intuition clash? Argue from what accounts *claim/need*. Define what "progress" would look like given the diagnosis.
      *   **Constraint:** Do not give a tour of options. Give an honest diagnosis.

  2.  **Deconstruct the Philosophical Landscape (Mental Sandbox):**
      *   *The WKR Problem:* Originates with the "Demon Case" (Pascal's Wager vibes, but for attitudes). Standard view: RKR = object-related (demon is great), WKR = state-related (admiring saves the world).
      *   *Major Accounts:*
          *   *Fittingness First (FF):* Value = fittingness of pro-attitude. WKR is a threat to this. Needs to exclude WKR from constituting value.
          *   *Reasons First (RF):* Value = what there is reason to value. Needs to distinguish RKR from WKR to avoid "value inflation."
          *   *Deliberative Constraints:* You can't admire on command. WKR can't be the basis of the attitude.
          *   *Object-Given vs. State-Given:* Classic distinction (Parfit). Object-given = RKR, State-given = WKR. But counterexamples exist (e.g., evidence for belief is state-given in some sense?).
      *   *User's Hypothesis 1 (Redescription):* This aligns with "Attitude Modification" strategies (e.g., distinguishing admiration from deference). Some philosophers (like Hieronymi or McHugh) touch on this regarding belief.
      *   *User's Hypothesis 2 (Conflation):* This aligns with the "Normative Kind" vs. "Deliberative Constraint" vs. "Criticism" distinctions. E.g., Hieronymi on reasoning, Scanlon on accountability.
      *   *The Probe Case:* This is a "Cross-Person Fittingness" case. It tests whether the RKR/WKR distinction is agent-relative or objective. If I admire the demon to save *your* ability to admire the good, is that a RKR for me? It challenges the "object-given" constraint.

  3.  **Evaluate the User's Hypotheses:**
      *   *Hypothesis 1 (Redescription):* Strong. Many "WKR" cases dissolve if we specify the attitude precisely. But some resist. If the demon says "Admire me or I kill your dog," and you *do* admire them out of desperation, is it admiration? If yes, Redescription fails. If no, it's not admiration. This suggests the *nature of the attitude* is the bottleneck.
      *   *Hypothesis 2 (Conflation):* Very Strong. The literature often slides between "What makes it correct?" (Metaphysics), "How can I form it?" (Psychology/Deliberation), and "Am I blameworthy?" (Ethics).
      *   *Synthesis:* The stalemate exists because the "WKR Problem" is a *node* where three different philosophical projects intersect, but they are using the same terminology to solve different constraints.

  4.  **Formulate the Diagnosis:**
      *   **Verdict:** It is primarily **Hypothesis 2 (Conflation of Distinct Questions)**, reinforced by **Hypothesis 1 (Attitude Indeterminacy)**.
      *   **Why?** The "WKR" label is a placeholder for a tension between *Normative Realism* (values are out there), *Psychological Reality* (attitudes have constitutive aims), and *Practical Rationality* (we act for reasons).
      *   **The "Why it doesn't move" factor:** Different camps are optimizing for different theoretical virtues.
          *   *Fittingness First* folks need to protect the definition of Value.
          *   *Reasons First* folks need to protect the unity of Normativity.
          *   *Psychologists/Action Theorists* need to protect the transparency of deliberation.
      *   They talk past each other because a solution for one (e.g., "WKR aren't real reasons") breaks the other (e.g., "But I have a reason to believe to be happy").

  5.  **Address the Probe Case:**
      *   *Case:* Admire Demon to prevent blocking Third Party's fitting admiration.
      *   *Analysis:* This breaks the "Object-Given" vs. "State-Given" distinction. The reason is about the *fittingness of another's attitude*.
      *   *Implication:* If this counts as RKR, then RKR isn't just about *this* object's properties. It's about the *ecosystem of fittingness*. If it counts as WKR, then "saving fittingness" is merely prudential.
      *   *Diagnosis Support:* This case reveals that the dispute is about the *boundaries of the normative domain*. Is value atomic (object-attitude pair) or holistic (system of attitudes)?

  6.  **Define Progress:**
      *   If it's Conflation: Progress = **Splitting the Question**. Stop asking "Is it RKR or WKR?" Ask "Is it a reason for correctness?", "Is it a reason for formation?", "Is it a reason for criticism?"
      *   If it's Redescription: Progress = **Phenomenological Precision**. Better taxonomy of attitudes (e.g., distinguishing *admiration* from *deferential compliance*).
      *   *Honest Truth:* Likely no "criterion that settles contested cases" will emerge because the cases are designed to break criteria. Progress is recognizing the trade-offs.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Respectful, rigorous, acknowledging the user's sophistication (they clearly know the lit despite no formal training).
      *   *Structure:*
          1.  Validate the user's insight (it's rare to see the meta-problem so clearly).
          2.  Diagnose the Stalemate (Conflation + Theoretical Constraints).
          3.  Evaluate Hypothesis 1 (Redescription) - Partial success, hits limits.
          4.  Evaluate Hypothesis 2 (Conflation) - The core driver.
          5.  Analyze the Probe Case (The "Holistic" Challenge).
          6.  Define Progress (Deflationary but useful).
      *   *Key Philosophical References (Implicit or Explicit):* Parfit (Object/State), Hieronymi (Constitutive aims), Scanlon (Accountability), Schroeder (Reasons First), D'Arco & Deonna (Attitude taxonomy). *Self-Correction:* Keep references minimal as requested ("not a tour of options"), focus on the *structure* of the arguments.
      *   *Refining the "Why it doesn't move":* It's not just confusion; it's that the concept of "Reason" is doing too much work. It's trying to bridge the gap between *truth/fittingness* and *action/utility*.

  8.  **Final Polish:** Ensure the probe case is integrated as a diagnostic tool, not just answered. Make sure the definition of progress is clear. (The user asked: "If it is the last [ill-posed], say so and say why.") I lean towards "Ill-posed because it conflates distinct normative relations," which is a version of Hypothesis 2.

      *(Self-Correction during drafting)*: I need to be careful not to just say "You're right." I need to explain *why* the literature behaves this way. The literature doesn't move because the "WKR Problem" is a symptom of a deeper tension in normative theory, not a bug that can be fixed with a better definition.

      *Plan:*
      1.  Endorse Hypothesis 2 as the primary driver.
      2.  Endorse Hypothesis 1 as a secondary factor (attitude individuation).
      3.  Use the Probe Case to show why the distinction is unstable.
      4.  Conclude on "Progress = Disaggregation."

  9.  **Final Review against constraints:**
      *   No library access acknowledged? (Implicitly, by keeping refs general).
