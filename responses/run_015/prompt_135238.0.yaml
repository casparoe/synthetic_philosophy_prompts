answer: |-
  Cognitive automation poses a qualitatively distinct threat to the meaning of work compared to industrial mechanization because it displaces the locus of human agency from physical oversight to the very reasoning processes that constitute professional identity, yet meaningful work remains possible if organizational design prioritizes resistant engagement over seamless efficiency. Industrial automation, while displacing physical labor, largely preserved the phenomenological structure of work by retaining a feedback loop between human intention and material reality. When a machine replaced a worker's muscle, the worker often transitioned to maintaining that machine, a role that demanded diagnostic reasoning, tactile feedback, and the satisfaction of overcoming mechanical failure. The friction of the physical world remained; the machine still broke, the material still resisted, and the worker's judgment was required to restore function. This preserved the link between effort and outcome, allowing social recognition to align with genuine problem-solving. The worker was not merely present; they were necessary to navigate the unpredictability of physical systems.

  Cognitive automation, by contrast, targets the reasoning process itself, severing the link between mental effort and decisional outcome. When algorithms replace judgment, the human role shifts from operator to validator, often reducing the worker to a rubber stamp for decisions they do not fully understand and cannot easily contest. This creates the "hollow role," where the external trappings of employment—title, salary, organizational chart—remain, but the internal architecture of agency is evacuated. Unlike the factory floor where a breakdown signals a clear demand for human intervention, cognitive systems are designed to minimize friction and uncertainty, smoothing over the very ambiguities that traditionally required human wisdom. If the system predicts the outcome, optimizes the route, and drafts the content, the human employee is left without the resistance necessary to feel that their effort caused the result. The threat is distinctive because it does not just change what the worker does; it changes the worker's relationship to their own mind, rendering their capacity for judgment obsolete rather than redirected.

  The framing of "resistant engagement" resolves the tension between the view that work's meaning is social and the view that it is cognitive. Meaning does not reside solely in social recognition or the abstract exercise of judgment, but in the experience of intentions meeting a environment that pushes back. Industrial automation preserved this resistance in the material domain; cognitive automation eliminates it in the informational domain. When resistance is removed, work becomes mere occupancy. A pilot whose plane flies itself without turbulence or system errors is no longer flying; they are monitoring. If the monitoring requires no intervention, the role loses its tether to agency. Therefore, the danger of cognitive automation is not unemployment, but the proliferation of roles that lack the friction required to generate a sense of contribution. The hollowness arises because the system is too successful at its primary goal of efficiency, removing the obstacles that make human problem-solving visible and valuable to the actor.

  However, this outcome is not inevitable if the design of automated economies shifts from maximizing frictionlessness to cultivating meaningful resistance. For work to remain meaningful, organizations must intentionally design systems where human judgment is required not for routine exceptions, but for high-stakes ambiguity where data is incomplete or ethical trade-offs are necessary. This requires resisting the urge to automate the final decision in complex social or moral contexts, keeping humans in the loop where the "map" of the algorithm does not match the "territory" of reality. Furthermore, the economy must revalue forms of resistance that are inherently human, such as negotiation, care, and creative synthesis, recognizing these not as inefficiencies to be streamlined but as the core sites of value creation. If a nurse's work is meaningful because it involves navigating the unpredictable emotional needs of a patient, then automation should handle the charting, not the interaction.

  Ultimately, cognitive automation is more dangerous than its industrial predecessor because it risks decoupling human identity from the act of overcoming challenges. Industrial mechanization changed the tool; cognitive automation changes the thinker. To prevent the widespread emergence of hollow roles, the future of work must be structured around the preservation of resistant engagement. This means accepting that efficient systems are not always meaningful systems. Work will retain its significance only if we design technologies that augment human struggle against complexity rather than eliminating the struggle entirely. If we can engineer environments where human intention still meets genuine friction—whether in managing unpredictable automated ecosystems or navigating complex social dynamics—work can remain a site of agency. Without this intentional preservation of resistance, cognitive automation will not just replace tasks; it will replace the experience of being a worker who matters.
