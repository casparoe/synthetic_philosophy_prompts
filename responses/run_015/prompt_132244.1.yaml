answer: |-
  Start with the phenomenology of akrasia using the fridge pact (which survives if framed as authoritative constraint rather than prudential planning), define idealization as cleared biases not moral perfection, then establish the binding link via core commitments, intercepting the 'saint' error during definition and the 'hypocrisy' error during the binding link.

  Open by describing the specific feeling of eating the leftovers while knowing you shouldn't, using the fridge pact to isolate the conflict between current impulse and standing commitment; this prevents the "just be perfect" collapse because you aren't prescribing a new moral code but explaining the authority of an existing one. When introducing the idealized agent, explicitly stipulate that idealization removes distortions (fatigue, hunger, ignorance of consequences) but preserves core values, which head-offs the "ideal me is a saint" misconception immediately by distinguishing epistemic/volitional clarity from moral superiority. The fridge example works only if you emphasize that the pact binds you *because* your calm self endorses it as a rule for your hungry self, not because breaking it has bad utility; if students treat it as mere prudential planning, pivot to a case where the idealized self endorses a costly moral duty the actual self wants to evade.

  Intercept the "hypocrisy with extra steps" objection exactly when you claim the idealized judgment binds the actual agent; counter this by stressing continuity of identity—the idealized self isn't a different person issuing orders, but the actual self's own commitments unclouded by temporary noise. For the end-of-session check, ask: "If your idealized self would endorse a norm that contradicts a core commitment you hold right now (e.g., loyalty to a friend), does that norm bind you, and why?" A correct grasp of indirect normativity requires them to say "no" (because core commitments must remain intact for the idealization to be *yours*) or to explain the hierarchy of commitments, whereas a superficial grasp will simply say "yes, because ideal knows best." Refuse to explain the metaphysical status of the idealized self (e.g., possible worlds semantics) or dive into primary contractualist texts like Scanlon's formulaic principles; keep the focus on the structure of authority and identity, not the ontology of the deliberator or the history of the theory.
