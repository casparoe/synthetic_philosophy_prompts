prompt: |-
  I'm running a philosophy club session for undergrads who've had one intro ethics class, nothin deep. Next week I want to teach indirect normativity through idealized deliberation — the idea that a norm binds your actual self not head-on but through an endorsement made by an idealized version of you (stripped of specific biasses like fatigue or craving, fully informed about downstream effects, but still recognizably you with your core commitments intact), and that this endorsement reaches back to constrain what you actually do. Don't explain the theory to me; plan the teaching arc. What has to come first so they don't immediately collapse it into "just be perfect," the one concrete example that should carry the whole thing — I'm leaning on a roommate "fridge pact" about not eating each other's leftovers, but tell me if that's too trivial and what properties it needs to work — the misconceptions they'll form in order of occurance (probably "the ideal me is just a saint" and then "this is hypocrisy with extra steps"), exactly where in the sequence to head off each one, plus one end-of-session check question that reveals whether they've grasped the indirect binding or just memorized the phrase. Also say what I should openly refuse to explain at this level — maybe actual contractualist texts? — and lead with your bottom line in the first sentence (the sequence order and whether the fridge example survives), then the reasoning, with no preamble and no restating the question.
