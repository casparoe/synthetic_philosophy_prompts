  2.  **Deconstruct the Teaching Challenge:**
      *   *Core Concept:* Indirect Normativity via Idealized Deliberation. (Think Scanlon, Smith, perhaps some Kantian autonomy interpretations, or Internalism vs. Externalism bridges). The key is the *link* between the idealized agent's judgment and the actual agent's obligation.
      *   *Risk 1: Perfectionism.* Students think "idealized" means "morally perfect saint." Need to emphasize *idealized conditions* (information, calmness) not *idealized virtues*.
      *   *Risk 2: Triviality.* The example needs to show normative *binding*, not just prudential planning.
      *   *Risk 3: Hypocrisy/Alienation.* Students think "That's not me, so why does it bind me?" Need to emphasize continuity of core commitments.
      *   *Risk 4: Complexity.* Don't dive into raw contractualist texts (Scanlon's *What We Owe to Each Other* is too dense for this specific arc in one session).

  3.  **Evaluate the "Fridge Pact" Example:**
      *   *Pros:* Relatable, concrete, involves rules/norms.
      *   *Cons:* Might seem too prudential ("I don't want my food eaten") rather than normative/moral ("I am *bound* not to eat theirs").
      *   *Fix:* Needs to involve a conflict between immediate desire and deeper commitment. The "idealized self" isn't just "full self," it's "self without the distortion of hunger/impulse."
      *   *Verdict:* It survives *if* modified to highlight the *authority* of the idealized judgment over the current impulse, not just the utility of the pact. It needs to be about *why* the pact binds when you're hungry, not just that you made a pact.

  4.  **Drafting the Sequence:**
      *   *Step 1: The Problem of Current Desire.* Start with a conflict where the agent knows better but wants otherwise. (Don't start with the theory).
      *   *Step 2: The Idealized Counterpart.* Introduce the "calm, informed you" not as a saint, but as a clearer version.
      *   *Step 3: The Binding Link.* Explain why the calm you speaks for the hungry you.
      *   *Step 4: Misconception Check.* Address "Saint" and "Hypocrisy."
      *   *Step 5: Assessment.* The check question.

  5.  **Refining the Bottom Line:**
