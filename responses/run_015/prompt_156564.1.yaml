  I am preparing a lecture on the philosophy of quantitative genetics and have become entangled in what seems like an internal contradiction in heritability reasoning. Twin studies in developed populations routinely report narrow-sense heritability for general cognitive ability near 0.70, whereas genome-wide SNP-based estimates are closer to 0.25. I understand that the gap partly reflects missing heritability—rare variants, gene-environment correlation, and non-additive effects—so the twin figure captures total genetic variance within that environment. My confusion concerns policy implications. Applying the standard breeder's equation R = h²S, I reason that if h² is 0.70, then any within-generation environmental intervention—say, reducing class size—can shift the population mean by at most (1 − h²), or 30 percent, of the selection differential. This suggests high heritability imposes a biological ceiling on how much education policy can close achievement gaps. Is my error treating a cross-generational evolutionary formula as a bound on single-generation environmental manipulation, or is there a deeper misconception about how variance partitioning relates to reaction norms? Please answer in American English, in one paragraph of no more than 130 words.
