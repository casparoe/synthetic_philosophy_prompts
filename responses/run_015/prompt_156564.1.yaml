      *   **User's Confusion:** The user thinks high heritability ($h^2 \approx 0.70$) implies a ceiling on environmental intervention effectiveness within a generation, based on $R = h^2S$. They suspect this might be misapplying a cross-generational formula to single-generation environmental manipulation.
      *   **Constraints:** American English, one paragraph, no more than 130 words.

  2.  **Identify the Core Error:**
      *   The Breeder's Equation ($R = h^2S$) predicts response to *selection* across generations, not response to *environmental intervention* within a generation.
      *   Heritability is the proportion of phenotypic variance due to genetic variance *within a specific environment*. It does not dictate the magnitude of phenotypic change possible when the environment itself changes (the reaction norm).
      *   High heritability does not mean immutability. Example: Height is highly heritable, but average height increased drastically due to nutrition (environmental change).
      *   The user's calculation $(1 - h^2)$ as a ceiling for environmental impact is incorrect.

