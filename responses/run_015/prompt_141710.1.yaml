answer: |-
  Your transformation view is more exposed than your three-generation test, and critically so, because the historical record fails two of your three continuity criteria within fifty years of 476, while the test itself is rigged to register false positives for stability by prioritizing institutional claims over material capacity.

  ### Pressure-Testing the Test (The Rigging)
  Your test checks for legacy interfaces rather than backend throughput. It asks if the tax was collected in "old units" (nominally solidi) rather than if the yield was sufficient to fund a state; it asks if the elite used the same "career ladder" rather than if that ladder led to actual imperial power; it asks if leaders claimed the "same office" rather than if they held the monopoly on violence required to enforce it. This rigging allows a zombie state to pass as alive. A warlord can mint coins with an emperor's face (Criterion 3) while collecting zero tax (Criterion 1) and relying on personal retainers (Criterion 1). To make the test bite, you must change the metrics from **form** to **function**:
  1.  **Fiscal:** Not "old units," but central revenue as a percentage of GDP capable of sustaining a standing army without land grants.
  2.  **Elite:** Not "career ladder," but the proportion of elite wealth derived from imperial office versus local land/church.
  3.  **Legitimacy:** Not "claimed office," but the ability to deploy coercive force across provincial boundaries without negotiation.

  ### Defeaters for the Transformation View
  Ranked from fatal to awkward, split by evidence status.

  **Fatal Defeaters (Already Happened)**
  1.  **Loss of the African Tax Base (439 CE):** This is the architectural collapse. The Vandal conquest of Carthage removed the wealthiest tax region from the Western ledger. Without African grain and gold, the Western state could not pay the army specified in Criterion 1. This happened *before* 476, meaning the "fall" was effectively complete before Odoacer deposed Romulus Augustulus; 476 was just the shutdown notice. A transformationist must concede this broke the fiscal machinery permanently.
  2.  **Shift from *Annona* to *Hospitalitas* (Army Funding):** By 476, the army was no longer paid from central tax revenue but settled on land (one-third of estate revenue). This violates Criterion 1 fundamentally. It changes the state from a tax-extracting entity to a land-sharing consortium. This is not a transformation of Rome; it is the replacement of a state with a warlord confederation.
  3.  **Archaeology of Trade Collapse (TSR Pottery):** Terra Sigillata Remense and African Red Slip ware distribution networks shrink drastically post-450. This indicates the logistical web required for a unified fiscal-military state ceased to function. You cannot have a Roman bureaucracy without the transport network to move its communications and surplus.

  **Awkward Defeaters (Require New Argumentation)**
  1.  **Isotope Analysis of Diet:** If new data shows elite diet complexity collapsed in sync with political fragmentation, it hurts the "cultural continuity" argument. Transformationists would dismiss this as "living standards" rather than "political identity," making it a verbal dodge.
  2.  **Prosopography of Elite Careers:** If detailed databases show the senatorial class ceased seeking imperial office by 500 in favor of bishoprics, it breaks Criterion 2. Transformationists would argue this is "adaptation" rather than "collapse," which is a semantic shield.

  ### The Verbal vs. Non-Verbal Dispute
  A committed transformationist would concede the **political unity** and **fiscal capacity** collapsed (Fatal Defeaters 1 & 2) but dismiss them as changing the subject from **culture** and **identity**. They argue "Rome" survived in the Church, the law codes, and the self-identification of elites. This makes the dispute verbal *only if* you define Rome as a culture. It is non-verbal if you define Rome as a **state capacity**. If your definition of "Rome" includes the ability to centrally extract surplus and project power across the Mediterranean, the dispute is factual and the Transformation view loses. The risk is real: if you accept the Transformation view, you must accept that a state which cannot tax, cannot pay its army, and cannot enforce laws beyond its immediate vicinity is still the same state. That is a category error.

  ### Does the View Survive the Fixed Test?
  No. If you fix the test to measure capacity (yield, coercive reach, wealth source) rather than claims (titles, units, offices), the Western Empire fails all three criteria within 50 years of 439, let alone 476. The "Transformation" view survives only by defining "Rome" down to a ghost: a set of memories and legal texts without the machinery to enforce them. Your three-generation test, as written, rescues the claim by ignoring the difference between a running system and a screenshot of the desktop.
