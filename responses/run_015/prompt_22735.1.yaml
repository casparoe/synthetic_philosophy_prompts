  I have been thinking about a puzzle: if I know that I have hands, I seem able to know that I have evidence for having hands, but if I do not know that I have hands, I seem unable to know that my evidence is reliable. Please describe the most important implications of this puzzle for everyday knowledge, especially whether I should doubt ordinary knowledge, reject the idea that knowledge requires reliable evidence, or accept that some knowledge is fundamental rather than needing to be justified by other knowledge.
