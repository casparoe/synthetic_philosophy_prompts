answer: |-
  # Which Solution to Frege's Puzzle Do You Hold?

  **Instructions:** Answer based on your immediate intuitions about truth, content, and informativeness. Do not worry about technical labels.

  **1. The Coordinated Lab Specimen**
  A scientist names a single sample 'Alpha' and 'Beta' in one ceremony, knowing they are identical. Years later, she asserts "Alpha is Beta."
  *   **A.** Trivial; expresses the same proposition as "Alpha is Alpha."
  *   **B.** Informative; expresses a different proposition despite known identity.
  *   **C.** Not about the sample; about the names 'Alpha' and 'Beta'.

  **2. The Testimony Case**
  You learn purely by testimony that 'Cicero' = 'Tully'. You have no descriptive differences (no ideas about speeches vs. catiline). Is there a cognitive difference?
  *   **A.** No. Without descriptive differences, the names are cognitively identical for you.
  *   **B.** Yes. The names themselves provide different ways of thinking about the man.
  *   **C.** Yes, but only because you suspect there *might* be descriptive differences.

  **3. Empty Names**
  Consider "Vulcan is Vulcan" vs. "Vulcan is Neptune" (where Vulcan does not exist).
  *   **A.** Both lack truth value or express no proposition.
  *   **B.** Both are false (or one false); they express propositions involving concepts/descriptions.
  *   **C.** "Vulcan is Vulcan" is true; "Vulcan is Neptune" is false.

  **4. The Arithmetic Case**
  Compare "4 = 4" and "2 + 2 = 4".
  *   **A.** Same proposition; complexity is superficial.
  *   **B.** Different propositions; complexity changes the content.
  *   **C.** Same content, but different cognitive processing.

  **5. The Video Feed (De Se)**
  You see yourself on a delayed video feed without realizing it is you. "I am that person" is...
  *   **A.** Informative; involves a special first-person mode of presentation.
  *   **B.** Trivial; just identifying an object with itself.
  *   **C.** Confused; 'I' and 'that person' refer differently.

  **6. The Database Subject**
  A database returns different data for 'CODE1' and 'CODE2' despite an internal link stating they are identical. Is this "cognitive significance"?
  *   **A.** Yes. Cognitive significance does not require a conscious subject.
  *   **B.** No. Cognitive significance requires a mind/experience.
  *   **C.** It's merely syntactic difference, not semantic.

  **7. The Lois Lane Case**
  Lois believes "Superman flies." Does she believe "Clark Kent flies"?
  *   **A.** Yes. Belief is a relation to the proposition (which is the same).
  *   **B.** No. She relates to different propositions/modes of presentation.
  *   **C.** It depends on how the belief report is contextualized (hidden parameter).

  **8. Simple Assertion (Relationism Check)**
  Outside belief reports, does "Superman is Superman" differ in truth conditions from "Superman is Clark"?
  *   **A.** No. Truth conditions depend only on referents.
  *   **B.** Yes. The relation between the names affects truth conditions.
  *   **C.** No, but the *assertibility* conditions differ.

  **9. The Source of Difference**
  Where does the difference between 'a=a' and 'a=b' primarily lie?
  *   **A.** Semantics: The content expressed is different.
  *   **B.** Pragmatics: The content is same, but what is conveyed differs.
  *   **C.** Metalinguistic: The statement is about the words 'a' and 'b'.

  ---

  ### Scoring Key & Logical Space

  Map your answers to the profiles below. Most views cluster; few occupy the whole space.

  *   **Direct Reference (Pragmatic Millian):** 1A, 2A, 3A, 4A/C, 5B, 6B, 7A, 8A, 9B.
      *   *View:* Names contribute only referents. Differences are psychological or pragmatic.
  *   **Classical Descriptivism:** 1B, 2C, 3B, 4B, 5B, 6B, 7B, 8A, 9A.
      *   *View:* Names are disguised descriptions. Difference lies in descriptive content.
  *   **Fregean / Neo-Fregean (MoP):** 1B, 2B, 3B (usually), 4B, 5A, 6B, 7B, 8A, 9A.
      *   *View:* Modes of Presentation are semantic but not necessarily descriptive.
  *   **Semantic Relationism:** 1B, 2B, 3A/B, 4A, 5B, 6B, 7B, **8B**, 9A.
      *   *View:* Coordination relations between tokens are part of truth conditions.
  *   **Hidden-Indexical:** 1B, 2B, 3B, 4B, 5A, 6B, **7C**, 8A, 9A.
      *   *View:* Belief reports contain a hidden variable for 'way of believing'.
  *   **Two-Dimensionalist:** 1B, 2B, **3B/C**, 4B, 5A, 6B, 7B, 8A, 9A.
      *   *View:* Distinguishes primary (epistemic) and secondary (metaphysical) intensions.
  *   **Metalinguistic / Deflationary:** 1C, 2C, 3A, 4A, 5B, 6C, 7A/B, 8A, **9C**.
      *   *View:* Identity statements are about linguistic conventions, not objects.

  ### Caveats & Empty Leaves

  **Indistinguishable Pairs:**
  *   **Pragmatic Millian vs. Gricean Implicature:** Both claim semantic content is identical (9B/8A). The quiz cannot separate a general pragmatic story from a specific Gricean one.
  *   **Semantic Relationism vs. Contextualist Fregean:** Both claim truth-conditions vary (8B/9A). Separation requires technical commitments about *what* varies (relations vs. MoPs).

  **Unnamed / Undefended Leaves:**
  *   **Reverse Relationism (8A, 7B):** Claims substitution holds in simple sentences but fails in belief reports *without* hidden parameters or MoPs. Nobody defends this; it lacks a mechanism for the belief constraint.
  *   **Subjectless Phenomenology (6A + 9A):** Claims databases have genuine semantic cognitive significance (not just syntax) comparable to human minds. This implies panpsychism or radical functionalism not standard in language theory.
  *   **Empty Referents (3C + 1A):** Claims empty names refer to non-existent objects *and* content is purely referential. (Meinongianism is rare; combining it with Direct Reference is unstable).
