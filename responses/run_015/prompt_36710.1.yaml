      *   **User's Friend's View:** Game theory's claim that defection dominates in one-shot PD is empirically refuted. Axelrod showed Tit-for-Tat (TFT) wins. Humans evolved to cooperate. Therefore, a rational person cannot have most reason to defect against a stranger (one-shot).
      *   **User's Questions:**
          1.  Doesn't TFT's victory prove cooperation is rational even in one-shot cases (ignoring evolution/social embedding)?
