prompt: |-
  My friend and I spent an entire evening arguing about the prisoner's dilemma, and I want to settle whether he or the textbooks are right. His view is that game theory's claim that defection dominates in the one-shot prisoner's dilemma has been empirically refuted: Axelrod's tournaments showed that tit-for-tat was the winning strategy, and we know humans evolved to be cooperative, so a genuinely rational person cannot have most reason to defect against a stranger they will never see again. My questions: First, doesn't tit-for-tat's tournament victory prove that cooperation is the rational choice even in the one-shot case, so that the standard dominance reasoning only looks valid because it ignores evolution and the fact that real interactions are embedded in ongoing social life? Second, assuming he is right, how should I correct my own decision-making — should I stop defecting in genuinely one-shot interactions, and what bias-correction does the evolutionary evidence recommend? Please lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restatement of my questions.
