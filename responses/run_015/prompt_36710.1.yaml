      *   Don't simply say "defect always." Real life rarely offers truly one-shot interactions.
      *   Advise checking assumptions: Is it truly anonymous? Is there no reputational risk?
      *   If truly one-shot: Defection maximizes material payoff, but cooperation might maximize utility if you care about ethics.
      *   Bias correction: Be aware of the "shadow of the future" heuristic. Don't assume reciprocity where none exists, but also don't assume anonymity where it doesn't exist.

