      *   **Friend's Counter:** Axelrod's tournaments showed TFT wins. Humans evolved to cooperate. Therefore, defection isn't rational in one-shot.
      *   **Analysis:**
          *   Axelrod's tournaments were *Iterated* Prisoner's Dilemma (IPD), not one-shot. TFT works because of the shadow of the future (retaliation/reward in subsequent rounds).
          *   In a *strictly* one-shot PD (no future interaction, no reputation effects, no external enforcement), defection is indeed the dominant strategy in classical game theory (Nash Equilibrium).
          *   Empirical studies (experimental economics) show humans *often* cooperate in one-shot PDs, but this doesn't refute the *normative* claim of rationality defined as payoff maximization given the payoff matrix. It suggests human utility functions include social preferences (fairness, reciprocity) or that humans misapply heuristics designed for repeated interactions.
          *   Evolutionary argument: We evolved for repeated interactions (social life), so we have instincts to cooperate. This explains *why* people cooperate, but doesn't change the *game theoretic definition* of rationality in a one-shot scenario where payoffs are strictly material and isolated.
          *   Conclusion: The friend is conflating Iterated PD with One-shot PD. The textbook is right about the one-shot dominance of defection *given standard assumptions*, but the friend is right that real humans often cooperate due to evolved heuristics or broader utility functions. However, logically, TFT's victory in *iterated* tournaments does not prove cooperation is dominant in *one-shot* games.

  3.  **Drafting the Bottom Line:**
      *   Need to be direct. The friend is incorrect about the specific game theory claim regarding one-shot dilemmas, though correct about human behavior.
      *   Draft: Your friend is incorrect that Axelrod's results refute the standard game-theoretic conclusion for one-shot interactions, because Tit-for-Tat only wins in iterated games where future retaliation is possible.
      *   Refinement for brevity and punch: Your friend is mistaken because Axelrod's tournaments involved repeated interactions, whereas the standard game-theoretic conclusion that defection dominates applies strictly to one-shot scenarios where future consequences are impossible.

  4.  **Developing the Reasoning:**
      *   **Point 1: Axelrod's Tournaments.** They were Iterated PD. TFT relies on the probability of future encounters. In a one-shot game, TFT is identical to "Cooperate once then stop," which loses to Defect.
      *   **Point 2: Rationality Definition.** Game theory defines rationality as maximizing payoff given the matrix. If the matrix says Defect yields higher payoff regardless of opponent's move (which is the definition of PD), then Defect is rational. If humans cooperate, either their utility function includes "warm glow" of cooperating (changing the payoffs) or they are using a heuristic suited for repeated games (ecological rationality).
      *   **Point 3: Evolutionary Argument.** Evolution selected for cooperation in *repeated* social contexts. Applying this heuristic to a truly anonymous one-shot interaction is a mismatch, not proof that defection is irrational in that specific context.
      *   **Point 4: Decision Making.** Should the user stop defecting? If the interaction is truly one-shot and anonymous, defecting maximizes material gain. However, if there's *any* chance of reputation damage, future interaction, or if the user values fairness intrinsically, cooperation might be rational. The "bias correction" is recognizing when you are in a truly one-shot scenario vs. when your brain assumes it's repeated.

