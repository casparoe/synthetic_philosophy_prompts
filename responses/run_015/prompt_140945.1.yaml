answer: |-
  Your intuition is tracking something real, but your principle is looking at the wrong variables. You are trying to judge compromise based on *consent* and *cost distribution* (who pays, who agrees). But your gut verdicts show you are actually judging based on *integrity* and *function* (what role are you playing, and what is this system for?).

  Case 3 (Council) and Case 4 (Editors) feel different because a City Council is a **negotiating body** (logrolling is a feature), while a Journal is a **filtering body** (logrolling is a bug). Case 5 (Dictator) and Case 6 (Mob) feel different because in one you *reduce harm*, and in the other you *select the victim*.

  Here is a principle built to capture those distinctions. It is designed to be applied cold.

  ### The Principle of Functional Integrity

  A compromise between parties with conflicting values is legitimate if and only if it satisfies all three clauses:

  1.  **The Agency Clause (Complicity):** The compromise may require you to *permit* an action you deem wrong, but it must not require you to *perform* or *instrumentalize* that action yourself.
      *   *Motivated by:* Case 5 vs. Case 6 (and Case 1 vs. Case 10).
  2.  **The Teleology Clause (Purpose):** The compromise must not undermine the constitutive aim of the shared enterprise or institution.
      *   *Motivated by:* Case 3 vs. Case 4 (and Case 7).
  3.  **The Fiduciary Clause (Authority):** The costs of the compromise may be borne by dependents only if the compromising parties hold legitimate authority over those dependents and the compromise aims at the dependent's welfare, not merely the parties' peace of mind.
      *   *Motivated by:* Case 9 vs. Case 6.

  ---

  ### Application to Your Cases

  Here is how this principle sorts your pile, including where it challenges your verdicts.

  **1. Flatmate (Meat):** **Fine.**
  *   *Agency:* You permit meat (toleration), you do not cook/kill it (performance).
  *   *Teleology:* The aim of a household is coexistence, not moral purity.
  *   *Note:* If the deal required *you* to cook the meat on those two days, this would fail the Agency Clause and become "Not Fine."

  **2. Public Health Doc:** **Fine.**
  *   *Teleology:* The aim is actionable guidance. A blended recommendation serves the aim better than a deadlock.
  *   *Agency:* You sign a document that is sub-optimal, but you are not lying.

  **3. City Council:** **Fine.**
  *   *Teleology:* The aim of a council is resource allocation via representation. Logrolling is a recognized mechanism for this.
  *   *Agency:* You vote for a waste of money, but you are not stealing it personally; you are engaging in democratic trade.

  **4. Journal Editors:** **Not Fine.** (Principle upholds your verdict).
  *   *Teleology:* The aim of a journal is quality certification. Accepting a weak paper undermines the core function.
  *   *Why 3 ≠ 4:* Councils distribute *goods*; Journals certify *truth*. You can trade goods; you cannot trade truth without corrupting the currency.

  **5. Dictator:** **Fine.** (Principle upholds your verdict).
  *   *Agency:* You negotiate to stop killing. You do not select who dies.
  *   *Teleology:* The aim of negotiation is harm reduction.

  **6. The Mob:** **Not Fine.** (Principle upholds your verdict).
  *   *Agency:* You hand over the victim. You become the instrument of the selection. This violates the Agency Clause.
  *   *Why 5 ≠ 6:* In 5, the dictator kills 100, you save 100. In 6, the mob kills 5, you choose the 1. In 6, your signature is on the death warrant.

  **7. School Board:** **Mixed.** (Principle refines your verdict).
  *   *Vaccines:* **Not Fine.** Teleology of public health is herd immunity. Opt-outs undermine the function.
  *   *Sex Ed:* **Fine.** Teleology of schooling includes respecting parental moral jurisdiction on non-safety issues.
  *   *Distinction:* One is a public safety system (like the Mob/Dictator stakes), the other is a moral upbringing system (like the Flatmate stakes).

  **8. Lab Rivals:** **Fine.**
  *   *Teleology:* The aim is research output. Splitting funds allows both to proceed.
  *   *Agency:* No integrity violated.

  **9. Parents/School:** **Fine, with a warning.** (Principle upholds verdict but adds a constraint).
  *   *Fiduciary:* Parents hold legitimate authority over the child.
  *   *Constraint:* The compromise must aim at the *child's* welfare. If the compromise is "We pick a school neither likes to avoid arguing," that fails the Fiduciary Clause. If it is "We pick a middle-ground school that serves the child reasonably well," it passes.

  **10. Moral Trade:** **Not Fine.** (Principle overturns your flip-flop).
  *   *Agency:* You are actively funding what you believe is worthless/wrong. This is not toleration (Case 1); it is participation.
  *   *Teleology:* The aim of charity is impact. Trading donations turns charity into a token exchange, corrupting the function of the act. It creates the *appearance* of good without the *substance* you believe in.

  **11. Dad/Politics:** **Fine (as a Treaty, not a Truth).**
  *   *Teleology:* The aim of this specific interaction is relationship maintenance, not political persuasion.
  *   *Agency:* Silence is permitting disagreement, not endorsing it.
  *   *Caveat:* This is only Fine if the politics do not impinge on external harm (e.g., if Dad was planning to vote for a genocidal candidate, silence fails the Teleology of moral citizenship).

  ---

  ### The Holdout Problem

  You asked: *Does this principle reward the person who refuses to compromise?*

  **Prediction:** Under the Principle of Functional Integrity, a holdout is **only** justified if the proposed compromise violates one of the three clauses.

  *   **If the compromise is Legitimate:** (e.g., The Journal Editors case). If I refuse to accept your weak paper because it hurts the journal's quality, I am not a "holdout rewarding intransigence"; I am a **guardian of function**. My intransigence is a feature, not a bug.
  *   **If the compromise is Corrupt:** (e.g., The Mob case). If I refuse to hand over a victim, I am morally required to hold out.
  *   **If the compromise is Valid but I dislike it:** (e.g., The Council case). If I refuse the bike lane/library trade just because I want *my* project only, I am violating the Teleology of the Council (which is to govern via agreement). Here, the principle treats me as an **obstructionist**.

  **Verdict on Intransigence:** The principle does not reward intransigence generally; it rewards *principled* intransigence. It punishes *selfish* intransigence. If you hold out on a legitimate compromise (Case 3), you are failing your duty to the institution. If you hold out on a corrupt one (Case 4 or 6), you are fulfilling it.

  ### Honest Assessment: Where We Disagree

  To be precise about where this principle might clash with your gut:

  1.  **Case 10 (Moral Trade):** My principle says this is **Not Fine**. You said you flip-flop. The principle argues that funding a "worthless" cause makes you complicit in waste, violating the purpose of donation. It turns moral action into a currency, which devalues both sides. I would urge you to settle on "Not Fine."
  2.  **Case 1 (Meat):** My principle hinges on *who cooks*. If you share the cooking duties and the schedule requires *you* to cook meat on Tuesdays, this becomes **Not Fine** under the Agency Clause. You are now performing the wrong, not just permitting it. If your current arrangement involves you cooking the meat, I would urge you to overturn your verdict.
  3.  **Case 9 (Parents):** My principle adds a strict constraint. If the compromise is merely "We stop fighting" rather than "This is best for the kid," it is **Not Fine**. Parents cannot compromise *on the child* for the sake of their own peace. They can only compromise *on the method* for the child's sake.

  ### Summary of the Distinction You Were Missing

  You mentioned: *"I have a vague idea that the difference is about doing something wrong yourself versus merely failing to prevent it."*

  This idea is rescuable, but it needs the **Institutional Context** added to it.
  *   **Case 1 (Meat):** You fail to prevent meat-eating (in your home), but you do not do it. (Passes).
  *   **Case 6 (Mob):** You fail to prevent the burning, but you *do* the handing over. (Fails).
  *   **Case 4 (Editors):** You fail to prevent a bad paper, but by accepting it, you *certify* it. You make the institution lie. (Fails).

  The Principle of Functional Integrity codifies this: **You may compromise on outcomes, but never on the integrity of your agency or the function of your shared system.**
