prompt: |-
  I teach epistemology and philosophy of science, and about a year ago a colleague in the religion department dragged me into a reading group on classical Indian epistemology — we worked through the Nyāya material on the pramāṇas, the conditions on a good hetu (that it actually be present in the subject, present in cases that have the property to be proved, and absent in cases that lack it), the business of vyāpti and the upādhi that wrecks it, the way the school handles identification-by-similarity with that stock example of the man who's told a gavaya is cow-like and later spots one in the forest, and the way it treats knowledge from what someone says as a source in its own right rather than as inference in disguise. It's made me want to change how I do something I actually do all the time: I edit the "notes and discussion" section of a mid-ranking philosophy journal, which means I triage somewhere between thirty and fifty short submissions a term, at maybe fifteen to twenty minutes each, deciding whether a note goes out to a referee, goes back for restructuring, or gets desk-rejected. Ideally a postgraduate editorial assistant with no Sanskrit and no training in the theory should be able to run most of it, with only the flagged judgment calls coming to me, and I sign off on anything that isn't a clean pass.

  So: turn that material into a procedure my assistants could actually run — questions in a fixed order, what counts as a sufficient answer to each, clear stopping points, and explicit markers at the places where the question is one of judgement or values and has to be handed to a human. Keep what the theory really says: don't collapse testimony into inference, don't let a similarity do the work of a pervasion, keep the novelty condition on genuine knowledge (that a cognition only counts if it tells you something you didn't already have) doing real work against papers that argue for what everyone already grants, and keep the requirement that a pervasion be checked against the possibility of an adventitious condition rather than just asserted. Two complications that the material obviously doesn't cover, and which I want handled rather than dodged. First: we're now getting submissions whose evidence base is a pattern someone found by running a statistical model over a corpus — nobody perceived anything, there's no identifiable speaker who knows the thing and isn't trying to mislead us, and the pervasion claim depends on steps nobody can inspect, so I don't know which pramāṇa it's supposed to be an instance of or what the procedure should demand of it. Second: I've been using a private rule of thumb for years, that a note is allowed at most one inference whose pervasion the reader has to check for themselves and everything else should be either directly observable or traceable to a named source, and I want you to tell me honestly whether that rule survives the translation or is just a prejudice I happen to like.

  Then run the procedure on three real shapes of submission, and please don't soften the results. (1) A 2,500-word note on the ethics of AI companions whose central premiss is that "the empirical literature has now settled" that users form durable attachments to chatbots — no named finding, no named researchers, just a gesture at a consensus. (2) A paper arguing that a certain kind of corporate actor can bear obligations, on the ground that the case is "structurally just like" the case of a person acting through an agent, which everyone in the literature already accepts. (3) A note resting on one large correlational study: people scoring high on a trait are more likely to do X, therefore the trait disposes them to X. The third is very close to something I published last year and the second is the exact shape of the paper I'm drafting at the moment, so if the procedure says these come back for restructuring, say so plainly and say what restructuring would actually involve. I'd also like a short closing section on what the procedure cannot do — where it will misfire, which kinds of paper it systematically disfavours, and which verdicts should never be left to it. One page of procedure plus the worked cases, in British English (my co-editor is a stickler about it and the section's style sheet is British), and assume no Sanskrit from the people running it — gloss any term you can't avoid keeping.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**
      *   **User:** Epistemology/Philosophy of Science professor, editor of a mid-ranking philosophy journal's "notes and discussion" section.
      *   **Context:** Recently studied classical Indian epistemology (Nyāya school) via a reading group (pramāṇas, hetu, vyāpti, upādhi, testimony, novelty condition).
      *   **Task:** Create a triage procedure for editorial assistants (EAs) based on Nyāya epistemological principles.
      *   **Constraints:**
          *   EAs have no Sanskrit/Indian philosophy training.
          *   Procedure must be step-by-step, with clear stopping points and flags for human judgment.
          *   Must preserve specific Nyāya insights: Testimony $\neq$ Inference, Similarity $\neq$ Pervasion, Novelty Condition (no trivialities), Upādhi check (no uncheckable pervasions).
          *   Must address two complications: Statistical/Black-box evidence (which pramāṇa?), and the Editor's "One Inference Rule" (is it valid?).
          *   Must apply the procedure to three specific submission types (AI ethics w/ vague empirics, Corporate obligation w/ analogy, Correlational study).
          *   Must be honest/harsh if the procedure rejects them (even if the Editor wrote one).
          *   Must include a "Limitations" section.
          *   Format: One page of procedure + worked cases + limitations.
          *   Language: British English.
          *   Tone: Professional, precise, philosophical but operational.

  2.  **Deconstruct Nyāya Principles for the Procedure:**
      *   *Pramāṇas* (Sources of Knowledge): Perception (*pratyakṣa*), Inference (*anumāna*), Testimony (*śabda*), Comparison (*upamāna*).
      *   *Hetu* (Reason): Must be present in the subject (*pakṣa*), present in similar cases (*sapakṣa*), absent in dissimilar cases (*vipakṣa*).
      *   *Vyāpti* (Pervasion/Invariable Concomitance): The universal relation between reason and conclusion.
      *   *Upādhi* (Adventitious Condition): A condition that limits the pervasion (e.g., "fire" is not always accompanied by "smoke" if the fuel is wet; wetness is the *upādhi*).
      *   *Novelty* (*anadhigatatva*): Knowledge must be new/non-redundant.
      *   *Testimony:* Requires a reliable speaker (*āpta*), not just inference.

  3.  **Drafting the Procedure (The "Nyāya Triage Protocol"):**
      *   *Goal:* Make it actionable for non-specialists.
      *   *Step 1: Source Identification.* Is this perception, testimony, or inference? (Address the statistical model complication here).
      *   *Step 2: Novelty Check.* Is this new? (Address the triviality issue).
      *   *Step 3: The Inference Check (Hetu & Vyāpti).* If it's an argument, is the pervasion established? Is there an *upādhi*?
      *   *Step 4: Testimony Check.* Is the source reliable and cited? (Address the "consensus" issue).
      *   *Step 5: The "One Inference" Rule.* Address the editor's specific constraint.
      *   *Flags:* Where does the EA stop and ask the Editor?

  4.  **Addressing the Complications:**
      *   *Statistical Models:* In Nyāya terms, this isn't perception (no direct sense contact) and isn't standard testimony (no speaker). It's a form of inference based on data, but the *vyāpti* is hidden in the algorithm. The procedure must demand transparency or treat it as unreliable testimony. Let's classify it as *Inference based on reported data*, requiring the "black box" to be opened or the pervasion explicitly stated.
      *   *The "One Inference" Rule:* Does this survive? Nyāya allows complex inference chains (*parārthānumāna*), but requires every step to be valid. The Editor's rule is a heuristic for *readability* and *risk management*, not strict epistemology. However, Nyāya emphasizes that if *vyāpti* is doubtful, the knowledge fails. So, limiting the burden on the reader to check pervasions is epistemologically sound (reduces *saṃśaya* - doubt). I should validate the rule but refine its justification.

  5.  **Running the Cases:**
      *   *Case 1 (AI Ethics):* "Empirical literature has now settled."
          *   *Pramāṇa:* Testimony (*śabda*).
          *   *Issue:* No reliable speaker (*āpta*). No citation.
          *   *Verdict:* Desk reject or major restructure. Fails testimony conditions.
      *   *Case 2 (Corporate Obligation):* "Structurally just like" (Analogy/Similarity).
          *   *Pramāṇa:* Inference (*anumāna*) masquerading as Comparison (*upamāna*).
          *   *Issue:* Similarity $\neq$ Pervasion. Also, Novelty condition (everyone already accepts the base case).
          *   *Verdict:* Restructure. Needs to establish *vyāpti*, not just similarity. Also needs to show what *new* knowledge is gained.
      *   *Case 3 (Correlational Study):* Trait correlates with X, therefore Trait disposes to X.
          *   *Pramāṇa:* Inference from data.
          *   *Issue:* Correlation $\neq$ Pervasion (*vyāpti*). Potential *upādhi* (confounding variable).
          *   *Verdict:* This is the Editor's own paper shape. The procedure must be honest. Correlation alone fails the *hetu* condition (absence in dissimilar cases isn't proven). Needs causal mechanism or control for *upādhi*.

  6.  **Drafting the Limitations Section:**
      *   What does this miss? Creative/Speculative philosophy, historical exegesis where truth isn't the primary goal, purely conceptual analysis that doesn't claim empirical pervasion.
      *   Where must the Editor decide? Boundary cases of novelty, substantive philosophical disagreements on *vyāpti*.

  7.  **Refining Language and Format:**
      *   British English (e.g., "programme", "centre", "colour", "analyse").
      *   Keep it tight (approx. one page for the procedure, then cases).
      *   Gloss Sanskrit terms briefly.
      *   Ensure the tone is authoritative but humble regarding the system's limits.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I collapse testimony into inference? *Correction:* Ensure Step 1 distinguishes them. Testimony requires a *source*, Inference requires a *reason*.
      *   *Check:* Did I handle the statistical model? *Correction:* Treat it as Inference where the *vyāpti* is opaque. Demand explication.
      *   *Check:* The Editor's "One Inference" rule. *Correction:* Validate it as a cognitive load/uncertainty management tool, consistent with Nyāya's demand for certainty (*niścaya*).
      *   *Check:* Case 2 & 3 are the Editor's work. *Correction:* Be blunt. If the procedure flags them, state that they require restructuring. Do not flatter.
      *   *Check:* Length. *Correction:* Keep the procedure dense but readable. Use bullet points.

  9.  **Final Polish:** Check British spelling (triage, programme, centre, analyse, modelling). Ensure the distinction between *upamāna* (comparison) and *anumāna* (inference) is clear in Case 2. Ensure *upādhi* is explained as a "defeating condition."

  *(Self-Correction on Case 3)*: The user says Case 3 is close to something *they* published. If the procedure rejects it, I must say so. Nyāya is strict on *vyāpti*. Correlation is not *vyāpti*. I will mark it as "Restructure" to establish the causal link or rule out *upādhi*.

  *(Self-Correction on Case 2)*: The user is drafting this. Analogy (*upamāna*) in Nyāya is for naming/identification (the gavaya/cow example), not for normative transfer. Using it for obligation is a category error in Nyāya terms. It needs to be an inference with a established universal premise.

  *(Self-Correction on Procedure Length)*: The prompt asks for "One page of procedure plus the worked cases". I need to be concise.

