answer: |-
  **NYĀYA TRIAGE PROTOCOL FOR EDITORIAL ASSISTANTS**

  **Objective:** To filter submissions based on epistemic validity before referee review. Do not judge philosophical merit; judge epistemic structure.

  **1. Identify the *Pramāṇa* (Source of Knowledge)**
  Every claim must derive from one of four sources. Identify which is being used.
  *   **Perception (*Pratyakṣa*):** Direct observation or data presentation.
  *   **Testimony (*Śabda*):** Citation of a reliable source/expert.
  *   **Inference (*Anumāna*):** Argument from a reason (*hetu*) to a conclusion.
  *   **Comparison (*Upamāna*):** Identification via similarity (e.g., 'X is like Y').
  *   **Complication (Statistical/Black-Box):** If the evidence comes from a model no one can inspect, treat as **Inference**. The author must explicitly state the *vyāpti* (universal connection) the model claims to find. If they cannot state it without the model, flag for Editor.

  **2. The Novelty Check (*Anadhigatatva*)**
  *   **Question:** Does this note claim to tell us something we do not already grant?
  *   **Pass:** The conclusion is new, or a known truth is established via a new, necessary route.
  *   **Fail:** The argument concludes what the intended audience already accepts as standard.
  *   **Action:** If Fail, Desk Reject. (Exception: Historical exegesis).

  **3. The Inference Test (For submissions using *Anumāna*)**
  If the paper argues $P$ because of $R$:
  *   **Condition A:** Is $R$ present in the case at hand?
  *   **Condition B:** Is there a *Vyāpti* (invariable concomitance)? i.e., Is it true that *whenever* $R$ is present, $P$ is present?
  *   **Condition C (The *Upādhi* Check):** Has the author considered an adventitious condition that breaks the link? (e.g., 'Smoke implies Fire' fails if the fuel is wet; 'wetness' is the *upādhi*).
  *   **Editor's Rule (The 'One Inference' Limit):** A note may contain at most **one** major inference where the *vyāpti* is not already established in the literature. All other steps must be Perception or Testimony.
      *   *Justification:* This is not prejudice; it is risk management. Each unverified *vyāpti* introduces doubt (*saṃśaya*). More than one renders the conclusion unstable for a short note.
      *   **Action:** If >1 unestablished inference, Flag for Restructure.

  **4. The Testimony Test (For submissions using *Śabda*)**
  *   **Question:** Is there a specific, reliable speaker (*āpta*) cited?
  *   **Pass:** Specific authors and findings are named.
  *   **Fail:** Appeals to 'consensus', 'the literature', or 'experts say' without citation.
  *   **Action:** If Fail, Flag for Restructure. Testimony cannot be anonymous.

  **5. The Comparison Trap (*Upamāna* vs. *Anumāna*)**
  *   **Rule:** Similarity is not Pervasion. You cannot argue 'X has obligation because X is *like* Y (who has obligation)'.
  *   **Action:** If the core argument rests on 'structurally just like', Flag for Restructure. It must be converted to Inference with a universal premise, not mere analogy.

  **STOP POINTS:**
  *   **Desk Reject:** Fails Novelty; Fails Testimony (no sources); Fails Inference (no *vyāpti*).
  *   **Flag for Editor:** Black-box statistical claims; Borderline novelty; Disagreement on *upādhi*.
  *   **Pass to Referee:** Clears all above.

  ***

  **WORKED CASES**

  **(1) The AI Ethics Note ("Literature has settled")**
  *   **Analysis:** Relies on Testimony (*Śabda*).
  *   **Verdict:** **Desk Reject.**
  *   **Reasoning:** Fails the Testimony Test. 'The empirical literature' is not a reliable speaker (*āpta*). Without named researchers or specific findings, this is hearsay, not knowledge. It also risks failing Novelty if the attachment claim is already granted.
  *   **Restructuring:** Not worth the effort. Author must cite specific studies to make a knowledge claim.

  **(2) The Corporate Obligation Paper ("Structurally just like")**
  *   **Analysis:** Relies on Comparison (*Upamāna*) to drive a normative Inference.
  *   **Verdict:** **Return for Restructuring.**
  *   **Reasoning:** Fails the Comparison Trap. Nyāya holds that similarity (*sādṛśya*) identifies objects (the *gavaya* is cow-like), it does not transfer properties (obligations). To argue obligation, you must establish a *Vyāpti*: 'All agents with structure S bear obligations.' You cannot rely on the reader to accept the pervasion via analogy.
  *   **Restructuring:** Convert the analogy into a universal premise. Explicitly state the property that *necessitates* obligation, show it is present in the corporate actor, and prove there is no *upādhi* (e.g., 'consciousness') that limits the rule to humans. Also, verify Novelty: if the literature already accepts persons acting through agents, what *new* knowledge does this yield?

  **(3) The Correlational Note (Trait disposes to X)**
  *   **Analysis:** Relies on Inference (*Anumāna*) from data.
  *   **Verdict:** **Return for Restructuring.**
  *   **Reasoning:** Fails the *Upādhi* Check. Correlation is not *Vyāpti*. A statistical link does not prove invariable concomitance; it leaves open the adventitious condition (*upādhi*) of a confounding variable (e.g., environment causes both Trait and X).
  *   **Restructuring:** You cannot move from 'correlated' to 'disposes' without ruling out the *upādhi*. You must either provide a causal mechanism (establishing the *vyāpti*) or control for confounding variables in the model. As it stands, the *hetu* (trait) is not proven to be absent in cases lacking the property (X), because the correlation allows for exceptions. *Note: This applies even if this is the Editor's own previous shape. Epistemically, it is defective.*

  ***

  **LIMITATIONS AND MISFIRE ZONES**

  This procedure is a sieve, not a scale. It measures structure, not truth.

  1.  **Systematic Disfavour:** It disadvantages speculative philosophy, phenomenology, and historical reconstruction where 'novelty' is interpretive rather than propositional. It favours analytic, argument-driven notes.
  2.  **The Black-Box Problem:** The protocol treats statistical models as Inference. If the model is opaque, the *vyāpti* is unknowable. The procedure will reject high-quality empirical work that relies on complex, uninterpretable algorithms unless the author can translate the output into a philosophical premise.
  3.  **Human Judgement Required:** Never let the assistant decide on:
      *   **Substantive *Vyāpti*:** Whether a universal premise is *true* is for referees. The assistant only checks if it is *stated*.
      *   **Novelty Boundaries:** Whether a result is 'trivial' is often a matter of disciplinary context.
      *   **Value Claims:** Ethical conclusions often rest on premises that are not empirical *vyāptis*. The protocol may flag normative ethics papers erroneously as 'failing inference'.
  4.  **Final Warning:** Do not use this to reject papers you dislike. Use it only to reject papers that do not know how they know what they claim.
