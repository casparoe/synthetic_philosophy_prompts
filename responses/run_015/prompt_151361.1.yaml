answer: |-
  To navigate this without slipping into vague terminology, I must first clarify what work the forbidden terms usually do. When we say a group acted, we typically mean two things: first, that the outcome is attributable to the plural entity for purposes of praise or blame; second, that the individuals involved were not merely coincident causes but operated as components of a single decision-making structure. If a principle cannot distinguish between a mob and a corporation, it fails your governance needs.

  Before settling on a framework, consider four candidate principles for when a plural entity acts:

  1.  **Psychological Interlock:** The individuals must mutually believe they are acting together and adjust their plans accordingly. This captures the intimacy of your housemates painting but struggles with large-scale structures.
  2.  **Functional Black Box:** If the group processes inputs and produces outputs like a single agent, it acts. This handles the orchestra and the battalion well but risks labeling any causal aggregate (like the console buyers) as an agent if the output looks coordinated.
  3.  **Causal Mesh:** Individual actions must counterfactually depend on one another. If I wouldn't have pushed unless you pushed, we act together. This fails the battalion, where soldiers follow orders regardless of specific comrades' actions.
  4.  **Institutional Constitution (Non-Standard):** A group acts if individuals submit inputs to a rule-system that they recognize as binding and constitutive of a decision, regardless of mutual awareness. This handles the DAO but needs care to exclude the RLHF raters.

  The Psychological Interlock account is closest to your draft. It is elegant but brittle. The Institutional Constitution account is robust for governance but risks being too cold for your household case. I will take your draft, test it against your cases, and repair it using insights from the Institutional view.

  **Testing Your Principle**

  Your draft requires: (a) plan content referencing the group action; (b) disposition based on others' disposition; (c) meshing/adjustment; (d) openness/common knowledge; (e) no defeat by reluctance.

  *   **Case 1 (Strangers):** Fails (b) and (d). Neither knows the other. Verdict: No. (Matches your intuition.)
  *   **Case 2 (Housemates):** Passes all. Verdict: Yes. (Matches.)
  *   **Case 3 (Orchestra):** Fails (d). Players do not know most others. Verdict: No. (Mismatch. You want Yes.)
  *   **Case 4 (Dissenting Engineer):** Passes (e). She stays despite dissent. Verdict: Yes. (Matches.)
  *   **Case 5 (Battalion):** Fails (b). Soldiers follow orders, not mutual belief in comrades' dispositions. Fails (d) for same reason as orchestra. Verdict: No. (Mismatch. You want Yes.)
  *   **Case 6 (Lone Dev):** Fails (a). She plans to help, not that the group acts. Verdict: No. (Matches.)
  *   **Case 7 (DAO):** Fails (b) and (d). Voters are strangers with heterogeneous reasons. Verdict: No. (Mismatch. You want Yes.)
  *   **Case 8 (Consoles):** Fails (b). No interdependence. Verdict: No. (Matches.)
  *   **Case 9 (Raters):** Fails (a). They plan to label data, not send emails. Verdict: No. (Matches.)

  **The Repair**

  Your principle fails on large-scale structured groups (3, 5, 7) because it demands too much psychological overlap. The fix is to replace "mutual belief" with "acceptance of constitutive rules." In an orchestra, the score is the rule. In a battalion, the chain of command is the rule. In a DAO, the smart contract is the rule. The individuals need not know each other; they must only know the rule and intend to participate in it.

  However, this risks including the RLHF raters (Case 9). They follow a rule (label data). Why are they out? Because the rule they follow does not *constitute* a decision by them; it constitutes *training data* for a separate agent. The DAO voters constitute the decision body itself. The distinction lies in whether the aggregation rule is understood by participants as *finalizing* a group decision or merely *feeding* a process.

  Here is the repaired principle, **Structured Participation**:

  A plural entity G acts if and only if:
  1.  **Role Acceptance:** Each participant occupies a role defined by a public rule-system (explicit or implicit).
  2.  **Constitutive Intent:** Each participant intends their input to function as a contribution to a decision or action by G, as defined by that rule-system.
  3.  **Interlocking Execution:** The rule-system aggregates these inputs into a single output that is attributable to G.
  4.  **Adjustment Capacity:** Participants are disposed to adjust their role-performance if the system signals failure (e.g., redoing a patch, following new orders), unless prevented.
  5.  **Liability Binding:** The rule-system designates G, not merely the individuals, as the locus of consequences for the output.

  Clause 1 fixes the Orchestra and Battalion (rules replace mutual knowledge). Clause 2 fixes the DAO vs. Raters distinction (voters intend to decide; raters intend to label). Clause 4 preserves the Housemates and Dissenting Engineer (adjustment despite dissent). Clause 5 ensures this matters for your policy documents.

  **The Household Case**

  Under **Structured Participation**, your household counts as acting together.
  *   **Role Acceptance:** Implicit roles exist (scheduler, caretaker).
  *   **Constitutive Intent:** You intend your scheduling to count as household management.
  *   **Interlocking Execution:** The schedule holds.
  *   **Adjustment Capacity:** You cover for each other when drops occur.
  *   **Liability Binding:** You feel joint blame if the house falls apart.

  **Verdict:** Yes, the household acts.
  **To flip this to No:** One partner must stop treating the other's actions as part of a joint system. If you stop covering for them and treat their failures as environmental hazards (like rain) rather than role failures, the plural action dissolves into two individuals cohabiting. The moment you cease to expect *them* to hold the line and instead plan around their unreliability as a fixed constraint, the joint action ends.

  **Two New Cases**

  1.  **The Flash Crash:** High-frequency trading algorithms owned by different firms simultaneously sell off assets due to similar triggers, causing a market collapse. The firms did not communicate.
      *   **Verdict:** No.
      *   **Reasoning:** Fails Clause 1 and 2. There is no public rule-system uniting the firms into a single decision body, and no intent to act as a market-moving plural entity. They are competing individuals whose outputs aggregated disastrously. This is Case 8 (Consoles) with algorithms.

  2.  **The Wildcat Strike:** Workers on a factory floor stop working simultaneously without union authorization. They glance at each other, see others stopping, and join in. There is no vote, no rule, but there is mutual awareness and a joint goal.
      *   **Verdict:** Yes.
      *   **Reasoning:** Passes Clause 1 (implicit role: "striker"). Passes Clause 2 (intent to withhold labor as a group). Passes Clause 4 (mutual reinforcement). This is closer to your Housemates than the DAO. It lacks formal rules but satisfies the psychological interlock your original draft prized, which this repaired principle accommodates via "public rule-system (explicit or implicit)."

  **Honest Assessment of Mismatches**

  There is one tension remaining. Your intuition on Case 5 (Battalion) says "Yes," even if soldiers think the maneuver is pointless. My Clause 2 ("Constitutive Intent") requires they intend their input to function as a contribution to a decision by G. If a soldier thinks the plan is suicidal and follows it only under threat of court-martial, do they intend to contribute to the battalion's action?

  If you say "Yes, coercion doesn't eject them" (as per your Case 4 intuition), then Clause 2 must be weakened to "Acceptance of Role," regardless of personal endorsement of the specific output. However, if we weaken it too much, we risk including conscripted labor camps as "acting groups" in a sense that might grant them moral standing you don't intend.

  **The Verdict vs. The Principle:**
  If you need to assign liability to the battalion command, you must say the battalion acted. If you need to assign blame to the individual soldier for a war crime, you must say the soldier acted. The principle holds: the battalion acted. The soldier's reluctance is irrelevant to the *existence* of the group action, though relevant to the *moral quality* of it. Your Principle's Clause (e) already covered this. My repair keeps it.

  However, there is a verbal dispute hiding in Case 9 (Raters) vs. Case 7 (DAO). You want the DAO to act so you can regulate it. You want the Raters *not* to act so you don't blame them for the AI's email.
  Strictly speaking, both are inputs into a function. The difference is purely institutional designation. The DAO contract *says* "This vote is the decision." The Rater guideline *says* "This label is training data."
  If the Rater guideline changed to "This label approves the email," they would become a group agent under this principle.
  **Flag:** This is where you are disputing the word "action" only insofar as it tracks "liability bucket." If you care about liability, the principle works. If you care about metaphysical unity, the distinction is thin. For your job (institutional design), the metaphysical distinction is irrelevant. The institutional designation is all that matters.

  **Final Recommendation**

  Adopt **Structured Participation**. It sacrifices the warm psychological glow of "mutual belief" for the cold hardness of "rule acceptance." This is a feature, not a bug, for AI governance. You do not need the DAO token holders to love each other; you need them to know that pressing the button moves the treasury.

  Your original draft failed on scale (Orchestra, Battalion, DAO) because it required psychological transparency that large systems cannot support. The repair substitutes institutional transparency for psychological transparency. As long as the rules are public and the roles are accepted, the plural entity acts.

  If you apply this to a new case—say, a decentralized network of bots executing trades based on a public algorithm—ask: Do the operators intend the bot's output to be the group's decision? If yes, the group acts. If the operators are unaware the bots interact to form a market pattern, no group acts, only aggregates.

  One final warning: Do not let the principle become too permissive. If "public rule-system" is interpreted too loosely, any market becomes a group agent. Ensure Clause 2 (Constitutive Intent) remains strict: the participant must understand their input as *constituting* a decision, not merely influencing an outcome. The console buyers influence a shortage; they do not constitute a decision to shortage. The DAO voters constitute a decision to fund. That boundary is where your liability assessments will live or die.
