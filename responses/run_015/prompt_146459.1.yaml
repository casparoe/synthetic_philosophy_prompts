answer: |-
  **1. The Question**

  **Question 4**
  Consider an agent, A, who faces a choice between pursuing a personal project and performing an act required by maximizing consequentialism. By stipulation, A possesses a perfectly adaptive psychology: whichever path A takes, A's well-being remains exactly the same. A derives equal satisfaction from the work, sustains equally good relationships, and experiences no net loss in welfare regardless of compliance. The only difference is that if A complies, the shape and direction of A's life are determined by the requirement to produce the best available outcome, whereas if A declines, the shape of A's life is determined by A's own commitments.

  Write an essay that addresses the following points. First, state whether the demandingness objection applies to this case and explain what your answer shows about the distinction between the quantitative and structural readings of the objection. Second, explain why familiar revisions (satisficing, scalar, or threshold views) are responsive to only one of these readings. Third, address the worry that the quantitative reading must appeal to an independent account of how demanding morality may permissibly be, which is precisely what is in dispute. Finally, take a definite position on whether, if the structural reading is the right one, the demandingness objection has any force of its own or is merely a vivid symptom of the deeper complaint about agent-relative reasons.

  ***

  **2. Model Answer**

  In the case described, the demandingness objection cannot succeed on quantitative grounds. The quantitative reading claims consequentialism is defective because it requires sacrifices that are too large to be reasonably demanded. Here, however, the agent's welfare is stipulated to remain constant regardless of compliance. There is no loss of well-being, no reduction in satisfaction, and no degradation of relationships. Since the quantitative objection is fundamentally a complaint about the cost to the agent's welfare, and that cost is zero by hypothesis, the objection fails to gain traction. If the intuition persists that something is wrong with requiring compliance here, it must be because the defect lies not in the amount sacrificed, but in the structure of the requirement itself.

  This reveals the core distinction between the two readings. The quantitative reading treats the objection as a limit condition on sacrifice: morality cannot demand *this much* welfare loss. The structural reading treats the objection as a complaint about authority: morality cannot claim the right to determine the shape of an agent's life, regardless of the welfare cost. In this case, the agent loses authorship over their life's narrative without losing welfare. Therefore, if the objection applies, it must be structural. It is a complaint that the agent is being used as a vessel for value production rather than treated as a source of projects that generate value.

  Familiar revisions to consequentialism, such as satisficing, scalar, or threshold views, are designed to address the quantitative reading. Satisficing consequentialism requires producing good enough outcomes rather than the best; threshold views permit agent-centred prerogatives up to a point where sacrifice becomes too great. These mechanisms lower the volume of sacrifice required. However, they leave the structural defect untouched. Even under a satisficing view, the standard of "good enough" is set externally by the moral theory, not by the agent's own commitments. The agent's life is still shaped by the requirement to meet a moral target rather than by personal projects. Unless the revision grants the agent the authority to set the target based on non-moral reasons, the structural complaint remains. These revisions reduce the price of compliance, but they do not change the fact that the bill is issued by an external authority.

  This leads to the problem facing the quantitative reading regarding independent accounts of permissible demandingness. To claim that a sacrifice is "too large," one needs a standard of measurement independent of consequentialism itself. If the standard is consequentialist (e.g., "sacrifice is too large when it reduces overall value"), the objection collapses, as maximizing value is the definition of right action. If the standard is non-consequentialist (e.g., "agents have a right to retain X percent of their welfare"), the objection begs the question against consequentialism. It assumes a non-consequentialist constraint to prove consequentialism wrong. The quantitative objection therefore lacks independent leverage; it either circularly assumes consequentialist values or illicitly imports rival norms.

  Finally, regarding the structural reading, the demandingness objection has no force of its own; it is merely a vivid symptom of the deeper complaint about agent-relative reasons. The structural reading claims that agents need standing to organise their lives around their own commitments. But this is precisely the definition of agent-relative reasons. To say the theory is "too demanding" in the structural sense is just to say it does not recognise agent-relative reasons. There is no additional work for "demandingness" to do here. The objection is not that the theory demands too much, but that it demands anything at all in the face of competing personal projects.

  For the verdict to go the other way, one would have to show that "authorship" is a distinct value separate from both welfare and agent-relative reasons. If one could argue that having control over one's life shape is a component of well-being that the adaptive psychology stipulation failed to capture, then the structural complaint might collapse back into a quantitative welfare loss. Alternatively, if one could demonstrate a limit on moral authority that does not rely on agent-relative reasons (perhaps based on the nature of moral address itself), the objection might stand independently. However, without such a demonstration, the structural reading is indistinguishable from the general rejection of agent-neutrality. The demandingness objection, stripped of its quantitative force, is simply the complaint that consequentialism ignores the separateness of persons. It is a restatement of the foundational dispute, not an independent argument against the theory.

  ***

  **3. Marking Scheme**

  | Move | Marks | Characteristic Failure |
  | :--- | :--- | :--- |
  | **1. Case Analysis:** Correctly identifies that the quantitative objection fails because welfare loss is stipulated as zero. | 4 | Treats the case as one involving high welfare cost despite the stipulation. |
  | **2. Readings Distinction:** Clearly distinguishes the quantitative reading (cost limits) from the structural reading (authority/authorship). | 4 | Conflates the two readings or treats them as merely different degrees of sacrifice. |
  | **3. Revisions Critique:** Explains that satisficing/threshold views lower the cost but do not restore agent-authority over life-shape. | 4 | Assumes satisficing automatically solves the structural complaint without argument. |
  | **4. Independent Account:** Argues that the quantitative reading requires a non-consequentialist standard, risking circularity or begging the question. | 4 | Claims the quantitative limit can be set internally without explaining how. |
  | **5. Final Verdict:** Takes a definite position on whether the structural objection has independent force (arguing it is a symptom of the agent-relative reasons complaint). | 4 | Hedges or refuses to take a position on the independence of the objection. |
  | **Total** | **20** | |

  ***

  **4. Differentiation Criteria**

  An A answer explicitly argues *why* the structural reading collapses into the general complaint about agent-relative reasons, rather than merely asserting that connection. It also satisfies the constraint to specify what would have to be true for the verdict to go the other way (e.g., identifying authorship as a distinct value). A B answer will correctly identify the distinction between readings and critique the revisions but will treat the final verdict as a matter of intuition rather than argumentative necessity.
