      *   *Crucial Distinction:* It is *not* relativism ("all opinions are equal"). It is *not* skepticism ("truth is unknowable"). It asserts reality is complex, and ego/attachment (*kashaya*) blinds us to that complexity. Lies born of selfishness are *not* valid standpoints; they are distortions.

