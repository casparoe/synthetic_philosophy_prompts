  ### III. Diagnostic Quiz (10 Cases)
  *Circle your answer. Tally your letters to find your leaf.*

  1.  **Hurricane:** Rich lose surplus, all equal & poorer. Is this *any* better? (A) No. (B) Yes, in one respect.
  2.  **Peasant:** Poor don't know they're poor. Injustice? (A) No. (B) Yes, material injustice remains.
  3.  **Gambler:** Poor lost everything gambling. Compensate? (A) No. (B) Yes.
  4.  **Threshold:** All have enough. Transfer rich to poor? (A) Irrelevant. (B) Still matters.
  5.  **Sum:** Huge gain for rich vs. small gain for poor. (A) Choose rich (Sum). (B) Choose poor (Priority).
  6.  **Action:** Can the state enforce equality? (A) Only if it improves welfare. (B) Required even if state of affairs isn't "better."
  7.  **Status:** Wealth gap, no class stigma. (A) Just. (B) Unjust.
  8.  **LDO All-Things-Considered:** Should we level down? (A) Never. (B) Yes, if equality is the only value.
  9.  **Hermit:** One person alone on earth with more than others elsewhere. (A) No injustice. (B) Injustice exists.
  10. **Welfare:** Equality reduces total welfare significantly. (A) Reject equality. (B) Trade-off required.

  **Scoring Key:**
  *   **Mostly 1B, 8B:** *Strict Telic Egalitarianism.*
  *   **Mostly 1B, 8A, 4B:** *Pluralistic Telic Egalitarianism.*
  *   **Mostly 1A, 6B, 2B:** *Deontic Egalitarianism.*
  *   **Mostly 1A, 2A, 7B:** *Relational Egalitarianism.*
  *   **Mostly 1A, 2B, 3A:** *Luck Egalitarianism.*
  *   **Mostly 1A, 2B, 3B, 4A:** *Sufficientarianism.*
  *   **Mostly 1A, 2B, 3B, 4B, 5A:** *Utilitarianism.*
  *   **Mostly 1A, 2B, 3B, 4B, 5B:** *Prioritarianism.*
  *   **Mostly 1A, 2B, 3B, 4B, 5B, 10B (Extreme):** *Rawlsian Maximin.*
  *   **Mixed/Inconsistent:** *You occupy an Empty Cell.*
      *   *If 1B + 3A:* **Incoherent** (Intrinsic equality usually ignores choice).
      *   *If 1A + 2A + 3A:* **Unexplored** (Relational Luck Egalitarianism).
      *   *Advice:* Check if you distinguish between "value of states" and "duties of agents." You may be a Deontic Pluralist.
