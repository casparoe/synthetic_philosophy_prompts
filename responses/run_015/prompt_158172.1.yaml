  # Distributive Justice & The Leveling-Down Objection: A Taxonomy

  ### I. The Logical Space (Four Separating Questions)
  *Before assigning names, we map the logical terrain using four concrete cases. Your position is defined by your answers.*

  1.  **The Hurricane Case (Intrinsic Value):** A hurricane destroys the surplus of the rich, making everyone equal but poorer. Is the resulting state *in any respect* better than the unequal, richer status quo?
      *   **Yes:** Equality has intrinsic value. (**Telic Family**)
      *   **No:** Equality is only instrumentally valuable (or irrelevant). (**Non-Telic Family**)
  2.  **The Ignorant Peasant Case (Locus):** The poor are materially worse off but never know it and suffer no social stigma. Is there still a *distributive* injustice regarding their material holdings?
      *   **Yes:** Material distribution matters independently of social meaning. (**Distributive**)
      *   **No:** Injustice lies in social status/power, not goods. (**Relational**)
  3.  **The Reckless Gambler Case (Responsibility):** Inequality arises entirely from the poor person's voluntary, informed risks. Is compensation still required?
      *   **Yes:** Luck (even option luck) shouldn't dictate fate; or responsibility is irrelevant to justice. (**Strict/Non-Luck**)
      *   **No:** People are responsible for their choices. (**Luck Egalitarian**)
  4.  **The Threshold Case (Aggregation):** Everyone is above a decent minimum. Does transferring wealth from rich to poor still matter?
      *   **No:** Only the threshold matters. (**Sufficientarian**)
      *   **Yes:** We must still weight the worse-off or maximize sums. (**Prioritarian/Utilitarian/Maximin**)

  ---

  ### II. The Taxonomy Tree
  *Branches represent claims separating siblings. Leaves include the view's most awkward commitment.*

  **ROOT: Distributive Justice Views**
  ├── **Q1: Is the equal/poorer state *in any respect* better? (YES)**
  │   ├── **Q4: Does equality *always* trump welfare?**
  │   │   ├── **YES:** **Strict Telic Egalitarianism**
  │   │   │   └── *Awkward Commitment:* Must welcome the Hurricane outcome as partially good, even if everyone suffers.
  │   │   └── **NO:** **Pluralistic Telic Egalitarianism**
  │   │       └── *Awkward Commitment:* Equality is a value, but we should never pursue it if it costs welfare (LDO accepted in theory, rejected in practice).
  │   └── *(Empty Cell: Strict Telic + Responsibility Sensitive. Incoherent: If equality is the sole intrinsic good, choice cannot justify inequality.)*
  │
  └── **Q1: Is the equal/poorer state *in any respect* better? (NO)**
      ├── **Q2: Is the injustice in Material Goods or Social Status?**
      │   ├── **Social Status:** **Relational Family**
      │   │   ├── **Q3: Does choice justify status hierarchy?**
      │   │   │   ├── **NO:** **Relational Egalitarianism**
      │   │   │   │   └── *Awkward Commitment:* A hermit society with massive wealth gaps is perfectly just.
      │   │   │   └── **YES:** **Relational Luck Egalitarianism** *(Unexplored Cell)*
      │   │   │       └── *Why Empty?* Combines social status focus with brute/option luck distinction; theoretically possible but rarely defended.
      │   │   └── *(Empty Cell: Relational + Threshold Only. Unattractive: Why does status matter only below a threshold?)*
      │   │
      │   └── **Material Goods:** **Distributive Family**
      │       ├── **Q3: Does choice justify material inequality?**
      │       │   ├── **YES:** **Luck Egalitarianism**
      │       │   │   └── *Awkward Commitment:* Must let the reckless gambler starve to respect their agency.
      │       │   └── **NO:** **Non-Luck Distributive Family**
      │       │       ├── **Q2b: Is equality a Constraint on Action or a Goal?**
      │       │       │   ├── **Action Constraint:** **Deontic Egalitarianism**
      │       │       │   │   └── *Awkward Commitment:* "Equality is not good, but we must pursue it" (Moore's Paradox of justice).
      │       │       │   └── **Goal (Consequentialist):** **Aggregation Family**
      │       │       │       ├── **Q4: How do we weigh benefits?**
      │       │       │       │   ├── **Sum Only:** **Utilitarianism**
      │       │       │       │   │   └── *Awkward Commitment:* Accept slavery if it maximizes net happiness.
      │       │       │       │   ├── **Threshold Only:** **Sufficientarianism**
      │       │       │       │   │   └── *Awkward Commitment:* Ignore massive gaps between rich and middle-class if both are "above enough."
      │       │       │       │   ├── **Weighted Worse-Off:** **Prioritarianism**
      │       │       │       │   │   └── *Awkward Commitment:* Spend vast resources on tiny benefits for the worst-off over huge benefits for many.
      │       │       │       │   └── **Lexicographical:** **Rawlsian Maximin**
      │       │       │       │       └── *Awkward Commitment:* Sacrifice huge gains for millions to give a penny to the single worst-off person.
      │       │       │       └── *(Collapsed Cell: Prioritarianism & Pluralistic Telic. Indistinguishable on LDO verdicts, differ only on metaphysical grounding.)*

