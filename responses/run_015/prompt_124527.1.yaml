answer: |-
  Good evening.

  Before I start, a correction. I am not here to celebrate my grandmother being *retired*. She is *retiring*. There is a difference. One implies an end, the other implies a choice. After forty-seven years of running the hill-sheep breeding programme at this station, she is choosing to stop.

  We have three groups in this room. There are the neighbours and family, who know the smell of the yards and the weight of the ledger. There are the genomic scientists, who have spent fifteen years politely baffled by her paper records. And there is the startup team, whose selection pipeline just won its independent validation.

  I promised her I wouldn't call her work a "gift." She considers that a way of avoiding the question of how it was actually done. I also promised I wouldn't stand here and claim that modern science has finally "figured out" what she was doing. She draws a sharp line between *knowing how* and *knowing why*. She knows how to breed sheep. She does not need to know why a SNP marker correlates with wool density to make the right call.

  But there is a philosophical idea that ties this room together. It's called "Darwin's Strange Inversion of Reasoning."

  Usually, we think comprehension comes first. We think you need to understand the physics before you build a bridge. You need to understand the genetics before you breed the animal. Darwin inverted this. He showed that competence comes first. Nature builds complex, functioning things without understanding a single thing about them. Competence is the foundation; comprehension is the optional extra.

  My grandmother's career is a testament to this inversion. For forty-seven years, she produced excellence without needing the molecular comprehension the genomics team craves. She didn't need the *why*. She needed the *how*. She looked at the animal, she looked at the hill, she looked at the record, and she made a decision. That is competence.

  Now, look at the new pipeline. The startup team has built a system that is, in the Turing sense, competent without comprehending. It does not know what a sheep feels like in the hand. It does not know what a hard winter looks like on the ridge. It has no comprehension. But it has competence. It predicts. It selects. It works.

  But here is the crucial point, and where we must be honest about what is changing.

  The genomics team told us once that their models work fine on average, but they cannot reproduce her decisions in the tails. The edge cases. The exceptional animals. The ones that break the rule.

  Why? Because her competence wasn't just pattern matching. It was context. It was forty-seven years of situational awareness that never made it into the columns of the ledger. The new pipeline is competent, yes. But it is a second-order competence. It is literally made out of her. It is her decisions, crystallized into code. It is her *how*, stripped of her *context*.

  Something real is being lost. The ability to look at an animal and see the exception rather than the average. That requires a comprehension of the specific that an algorithm, by definition, cannot have. The algorithm deals in probabilities. She dealt in individuals.

  So, we are not here to say that the new system is the same as the old. It isn't. It is a map drawn from her territory. It will navigate the average ground perfectly. But when the terrain gets rough, when the selection pressure hits the tails, we will miss the person who could read the ground without a map.

  To the startup team: You have built something remarkable. But remember that your validation rests on forty-seven years of her labour. You are standing on her competence.

  To the scientists: You sought the *why*. She gave you the *how*. Respect the distinction.

  And to my grandmother: You proved that you don't need to understand the mechanism to master the outcome. You prioritized the work over the explanation. You prioritized the sheep over the theory.

  We are not here to talk about what you leave behind. We are here to acknowledge what you built. A system of competence so robust that it can now run without you. That is not a consolation. It is a fact.

  You are retiring. The work continues. But we know who taught it how to walk.

  To Grandma.
