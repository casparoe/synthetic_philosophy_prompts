      *   *Refining the Bins:*
          *   (a) Territory (Ontic).
          *   (b) Map (Epistemic).
          *   (c) Legend/Scale on the Map (Nomological).
          *   Does (c) collapse? If the Legend is required for the Territory to exist, it's Ontic. If it's just how we read it, it's Epistemic/Instrumental. Keep it separate for the vote, merge it later for nuance.

      *   *Handling the "Bell Guy":*
          *   Script: "Bell kills *Local Hidden Variables*. It does not kill Epistemic views that deny hidden variables exist (like QBism) or accept non-locality (like Bohm)."

      *   *Handling the "3D Space Guy":*
          *   Whiteboard: Draw 1 particle = 3D wave. Draw 2 particles = 6D wave. Draw 10 particles = 30D wave. "Where is this wave?"

      *   *Handling Decoherence:*
          *   "Decoherence explains why we don't see superpositions. It doesn't explain what is doing the decohering."

      *   *The PBR Theorem:*
          *   This is the heavy hitter for "Is $\psi$ real?". It suggests epistemic views are incompatible with QM predictions *under certain assumptions*.
          *   Don't prove it. Just state: "There is a theorem (PBR) that says if you assume X, $\psi$ must be ontic."
          *   Actually, maybe too complex. Stick to the Interference argument. Interference is more intuitive for engineers. If $\psi$ is just info, why does the *info* create an interference pattern in the double slit?

      *   *Final Question:*
          *   "If two engineers have different information about the same system, do they assign different $\psi$s?"
          *   If Yes -> Epistemic/Subjective.
          *   If No -> Ontic/Objective.
          *   Wait, user wants: "Epistemic isn't Subjective."
          *   Question: "If I know the state of a deck of cards is shuffled, my probability distribution is 1/52. If you peek at the top card, yours changes. Is the probability distribution 'real'? No. Is it 'subjective'? Yes. In QM, if $\psi$ is epistemic, can two people have different $\psi$s for the same system without one being wrong?"

  4.  **Finalizing the Plan Structure:**

      *   **Title:** "The Map, The Territory, and The Compression Algorithm."
      *   **Phase 1: The Vote (5 mins).** Define the bins clearly.
      *   **Phase 2: The Engineer's Analogy (10 mins).** Bloom filters/Hashes. Where it works (prediction). Where it breaks (Interference/Entanglement).
      *   **Phase 3: The Hard Constraints (10 mins).** Configuration Space (the dimensionality argument). Bell (the locality argument).
      *   **Phase 4: The Escape Hatches (10 mins).** QBism (Subjective), Decoherence (Distraction), PBR (The "Actually maybe it is real" theorem).
      *   **Phase 5: The Check (5 mins).** The specific question.

  5.  **Review against Constraints:**
