          4.  *Crucial Claim:* Modern embodied cognition shows Ryle was "half right": skills aren't conscious theories but are subpersonal representations working like implicit premises.
          5.  *Conclusion:* Knowing-how is really a subtype of knowing-that (just hidden in the body).
