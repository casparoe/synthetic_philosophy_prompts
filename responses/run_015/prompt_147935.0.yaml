          *   **Verdict:** Accurate. Ryle argues against the regress argument (if every intelligent act requires contemplating a rule, you need another rule to contemplate that rule, ad infinitum).
      *   *Claim 3: Ryle thought knowing-how involves propositional knowledge, just implicit/dispositional.*
          *   **Verdict:** **Highly Controversial/Likely False.** This is the "Intellectualist Interpretation" of Ryle (often associated with Jason Stanley or certain cognitive science readings). Standard Rylean scholarship (e.g., Michael Kremer, Stephen Hetherington) argues Ryle wanted to *dissolve* the idea that knowing-how reduces to knowing-that. Ryle argued they are *distinct* categories. Saying knowing-how is *just* implicit knowing-that reintroduces the intellectualism Ryle fought against, even if it's "subpersonal." Ryle emphasized *dispositions* to act, not internal representations (propositional or otherwise).
