answer: |-
  Here is the definite position you asked for: **Your roommate is misreading Ryle.**

  While your roommate got the surface-level definitions right, their core conclusion—that Ryle thought knowing-how is ultimately a hidden form of knowing-that (propositional knowledge)—is a direct contradiction of Ryle's actual argument. Furthermore, their appeal to embodied cognition to support this conclusion is philosophically confused.

  Here is the breakdown of what is accurate, what is a misrepresentation, and why you should trust Ryle's original intuition over your roommate's synthesis.

  ### 1. What Your Roommate Got Right
  Your roommate accurately summarized the setup of Ryle's argument in *The Concept of Mind* (1949):
  *   **The Distinction:** Ryle does argue that knowing-how (skills, abilities) is distinct from knowing-that (facts, theories).
  *   **The Target:** Ryle does attack the "Intellectualist Legend." This is the idea that intelligent action must always be preceded by an internal mental act of contemplating a rule or proposition.
  *   **The Regress Argument:** Ryle argues that if every smart action required a prior internal rule-check, you would need another smart action to check that rule, leading to an infinite regress.

  So far, your roommate is on solid ground. But then they pivot, and that is where the reading collapses.

  ### 2. The Critical Misrepresentation: "Implicit Propositions"
  Your roommate claims: *"Ryle actually thought knowing-how involves propositional knowledge too, just arranged in a dispositional architecture where rules are stored implicitly."*

  **This is false.** This is the exact view Ryle was trying to destroy.

  Ryle was a logical behaviorist (of sorts). He argued that mental states are not "ghosts in the machine" hidden inside the brain. For Ryle, to say someone "knows how to play guitar" is not to say they possess a hidden file of implicit rules in their neurons. It is to say they have a **disposition** to succeed when they try.

  If you claim that knowing-how is just "implicit knowing-that," you are reintroducing the ghost. You are saying there is still a theoretical state inside the person causing the action, it's just unconscious. Ryle explicitly rejected this. He argued that the skill *is* the public performance and the readiness to perform, not an internal causal mechanism made of propositions.

  Your roommate is actually describing the view of **Jason Stanley** (a modern philosopher who wrote *Know How* in 2011). Stanley argues *against* Ryle, claiming knowing-how *is* a species of knowing-that. Your roommate has accidentally attributed Stanley's anti-Rylean view *to* Ryle.

  ### 3. The Embodied Cognition Error
  Your roommate claims: *"Modern embodied cognition shows... knowing-how is really a subtype of knowing-that after all, just hidden in the body."*

  **This does not follow.** In fact, most serious proponents of embodied cognition would disagree with your roommate.

  There are two camps in embodied cognition:
  1.  **Representationalists:** They believe the body uses internal models (implicit rules). Your roommate is in this camp.
  2.  **Radical Embodied Cognitivists (e.g., Gibson, Chemero, Noë):** They argue that skills are **not** representations at all. They are dynamic couplings between the agent and the environment.

  Radical embodied cognition actually supports Ryle *better* than your roommate's version does. For a radical embodied cognitivist, when you play a guitar chord, you aren't accessing "hidden premises" in your muscles. You are directly perceiving affordances (possibilities for action) and responding. There is no "knowledge-that" hidden in the body; there is only the interaction itself.

  By claiming skills are "implicit premises," your roommate is treating the body like a slow computer running a hidden program. That is **computationalism**, not true embodied cognition.

  ### 4. The Verdict: What You Should Believe
  You should believe **Ryle's original distinction**, not your roommate's revision.

  **Why?**
  1.  **Philosophical Accuracy:** Ryle explicitly argued that knowing-how is *sui generis* (in a class of its own). It is not a subtype of knowing-that. To reduce skill to hidden facts is to commit the "intellectualist legend" error all over again, just at a subconscious level.
  2.  **Practical Utility for Guitar:** This is the most important part for you.
      *   **If you believe your roommate:** You will think that to get better, you need to internalize more theory, more rules, and more "implicit data." You might try to intellectualize your practice, thinking there is a secret code in your muscles you need to decode.
      *   **If you believe Ryle:** You understand that the knowledge *is* the playing. You don't need to find the hidden rules; you need to train the disposition. The "knowing" is in the successful action, not in a hidden mental state.

  ### Summary
  Your roommate gave you a "Intellectualist" reading of an "Anti-Intellectualist" philosopher. They claimed Ryle said **A** (Skill is hidden theory), when Ryle famously argued **Not-A** (Skill is a disposition to act, not a theory).

  **Takeaway for your guitar playing:** Stop looking for the "rules" hidden in your fingers. Ryle would tell you that if you can play the chord, you already have the knowledge. The ability *is* the knowledge. Don't let philosophy convince you that you need to turn your muscle memory into a secret textbook.
