answer: |-
  1.

  My uncle stood at the podium with his hands flat on the wood,
  speaking of the ledger, the balance, the long winter.
  He told us how she counted every cent twice,
  how she mended coats instead of buying new ones,
  how she taught us that safety is a thing you build
  brick by brick, dollar by dollar,
  never spending what you do not have,
  never promising what you cannot keep.

  2.

  But she would not keep anything when we were involved.
  I saw the bank statements she hid from him,
  the withdrawals marked only as travel.
  She bought the tickets the morning she heard we were sick,
  stood on the platform with a suitcase heavy as guilt,
  rode the rails just to sit by the bed,
  just to press her palm against our cheeks
  and say she was there, she was finally here,
  looking at our faces.

  3.

  And when our faces were red with shouting,
  when the neighborhood quarrel spilled over the fence,
  she was the one who walked out onto the lawn.
  She didn't take sides, she took the heat,
  stood between the shouting men until their voices tired,
  poured lemonade into plastic cups,
  waited for the anger to cool down
  before it could catch fire.

  4.

  Except with me, she brought the fire.
  I would start the argument just to see if she was still sharp,
  and she was, sharper than I wanted,
  cutting through my excuses, meeting my volume with her own.
  We burned through evenings, through holidays,
  through everything safe my brother described.
  She didn't smooth me over; she struck the match,
  and we lit up the room until one of us blinked.

  5.

  I try to say she was careful. The word sticks.
  I try to say she was reckless. The word breaks.
  She was the ledger. She was the ticket.
  She was the silence between the shouts.
  She was the shout itself.
  In some respects, she is here.
  In some respects, the sentence ends.
  In some respects, I am speaking to the air.
  In some respects, the air is speaking back.
  She was. She was not. She was—

  the match is struck
  the match is unlit
  the hand is open
  the hand is closed
  I say her name and it fits
  I say her name and it
