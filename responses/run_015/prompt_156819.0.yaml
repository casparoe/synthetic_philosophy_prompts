answer: |-
  Good morning. Thanks for coming. I know the coffee is still kicking in for most of us—my third cup was at 2 AM, so if I seem slightly too awake, that's why.

  Looking around this room, I see a familiar fault line. On one side, we have biologists who treat Zahavi's handicap principle as a workhorse mechanism. Cost ensures honesty. If it's expensive, it's real. On the other side, we have philosophers of science who look at the same models and see a tautology. If the signal works, it's because it's costly; if it's costly, it must be a signal. It's a beautiful story, but is it falsifiable?

  Usually, we spend workshops like this pointing fingers at animals. Peacocks, gazelles, stags. But I want to turn the lens inward. We are signaling systems too.

  Think about our own replication rituals. Pre-registration badges, open-data mandates, multi-lab checks. We treat these as virtue signals of rigor. But structurally, what are they?

  Some of these practices function as **indices**. An index signal is physically coupled to the quality it represents. You can't fake a deep roar without having large vocal cords. In our context, locked pre-registration is index-like. It physically constrains the researcher. You literally cannot p-hack the primary analysis if the analysis plan is timestamped and immutable before you see the data. The constraint is mechanical. It doesn't matter how much you want to lie; the structure stops you. That's truth-tracking.

  But then there are the **handicaps**. These are arbitrarily costly displays. They prove quality because only high-quality individuals can afford to burn the energy. Think about the performative side of open science. Spending forty hours formatting data for a repository no one will ever check, or collecting triple the sample size needed just to slap a "high power" badge on the paper.

  Does that improve truth-tracking? Maybe not. But it does signal commitment. It says, "I am so confident in my paradigm, I can afford to burn this much time." It's institutional peacocking.

  Here's where I need both halves of this room to meet me.

  To the biologists: You're right that cost matters. If transparency rituals were cheap, everyone would do them, including the frauds. The cost is what filters the signal. But you also need to hear the philosophers.

  To the philosophers: You're right to worry about tautology. If we define "good science" as "whatever survives these costly rituals," we risk circular reasoning. Just because a lab endured a painful review process doesn't mean their result is true. It just means they have grant money to burn.

  So, the challenge for this workshop is to distinguish between the two. When we propose a new signaling model, or a new methodological standard, we need to ask: Is this an index, or is it a handicap?

  If it's an index, does it physically constrain the possibility of error? If it's a handicap, is the cost actually buying us honesty, or just status?

  We don't need to stop signaling. We can't. Science is a communication system. But we need to make sure our signals are doing structural work, not just decoration. We need enough index-like constraints to keep the fraud out, and we need to admit that some of the handicap-like costs are just the price of admission to the tribe.

  Let's spend the next two days figuring out which is which. If we can do that, maybe we leave here with a signaling theory that doesn't just explain gazelles, but explains us.

  Thanks, let's get started.
