answer: |-
  **The Hinge of History: A Dialogue**

  **Participants:**
  **Elena Vance**, Professor of Metaphysics and History, University of Zurich.
  **Marcus Thorne**, Senior Fellow in Critical Historiography, London School of Economics.

  **Context:** *Recorded following the closing panel of the International Colloquium on Temporal Logic, October 2023.*

  ***

  **Elena Vance:** Marcus, I want to return to your objection during the Q&A. You dismissed the hinge-of-history hypothesis as a category error. But if we accept Wittgenstein's late insight—that certain propositions stand fast not because they are verified, but because they are the scaffolding upon which verification rests—why should history be exempt from this structure?

  **Marcus Thorne:** Because history is not a language game, Elena. It is an empirical reconstruction. In *On Certainty*, hinge propositions like "I have two hands" are conditions for *my* agency. They are immediate. Historical events are mediated by archives, bias, and decay. To label an event a "hinge" suggests it is immune to revision. But every historical narrative is, in principle, revisable. If you claim the French Revolution is a hinge, and I find evidence that the administrative state remained continuous from the monarchy, your hinge bends. If it bends, it isn't a hinge.

  **Vance:** You are conflating the *event* with the *function*. I am not arguing that the storming of the Bastille is metaphysically immutable. I am arguing that within the framework of modern political intelligibility, "1789" operates as a hinge. It is the point around which the concepts of "citizen," "rights," and "legacy" rotate. If you try to question the significance of 1789 without accepting its pivot status, your questions lose their grip. You cannot ask "how did modern democracy emerge?" without already accepting the hinge that separates the *ancien régime* from the modern.

  **Thorne:** But that is a normative claim disguised as an epistemological one. You are saying, "To make sense of the story I want to tell, I must treat this event as foundational." That is a choice of narrative scale, not a discovery about the past. If I choose a micro-historical scale—the history of grain prices in Normandy—1789 ceases to be a hinge. The harvest of 1788 is the pivot. So, the hinge is not in the history; it is in the historian's selection of lens.

  **Vance:** Precisely. Hinges are framework-relative. Wittgenstein never claimed hinges were absolute truths of the universe; they are the things that stand fast for *us*, within a specific form of life. In the form of life we call "macro-political history," Westphalia or 1789 function as hinges. The fact that they dissolve at the level of grain prices doesn't negate their status at the level of sovereignty. The hypothesis is not that the past *is* hinged, but that our access to the past *requires* hinges to be intelligible at all.

  **Thorne:** There is the rub. "Intelligible to whom?" If the hinge is relative to the framework, then calling it a "hinge of history" is misleading. It's a "hinge of historiography." You are describing how we organize knowledge, not how time unfolds. But your hypothesis implies that certain moments possess a structural density that forces themselves upon us. That suggests an objective feature of the timeline. If it's merely our organizational preference, then the hypothesis is trivial. If it's an objective feature, it's dogmatic.

  **Vance:** It is not dogmatic because it admits of functional falsification. If a purported hinge event ceases to organize subsequent inquiry—if it no longer serves as the condition for questioning—then it loses its hinge status.

  **Thorne:** Let's test that. Take Westphalia. You've cited it as a candidate for the hinge of modern sovereignty. Yet, for forty years, diplomatic historians have demonstrated that the Peace of Westphalia did not create the state system in the way the myth suggests. Sovereignty was messy, overlapping, and imperfect long after 1648. If the archival reality contradicts the hinge, and you maintain the hinge anyway, you are protecting the theory from evidence.

  **Vance:** I would argue the opposite. The fact that historians must constantly *refute* Westphalia proves it is a hinge. Think of the energy expended to debunk it. To say "Westphalia didn't happen as described" is to acknowledge that "Westphalia" is the standard against which we measure deviation. Even the revisionist narrative relies on the conceptual geography established by the hinge. If Westphalia were merely an ordinary event, disproving its significance would be a footnote. Instead, disproving it is a career. That resistance indicates a structural role.

  **Thorne:** That is a sociological observation, not an epistemological one. It proves Westphalia is a *mythos*, not a hinge proposition. In Wittgenstein's sense, a hinge is something I do not doubt because doubting it paralyzes my action. If I doubt I have hands, I cannot type. If I doubt Westphalia, I can still write history; I just write a different kind. I write a history of gradual consolidation rather than treaty-based genesis. The edifice does not collapse; it shifts. Therefore, it fails the hinge test.

  **Vance:** But does it shift without cost? If you remove Westphalia, do you not have to reconstruct the entire grammar of international relations? You cannot simply swap the event; you must swap the logic of legitimacy. That suggests the hinge is not just a story we tell, but a constraint on the stories we *can* tell. You argue that history is structurally revisable. I argue it is only revisable *around* fixed points. Without the hinge, you don't have revision; you have noise.

  **Thorne:** Noise is a strong word. Let's call it "contingency." Your model risks freezing history into a series of lock-joints. If 1789 is a hinge, then everything before is "preparation" and everything after is "consequence." That smuggles in a teleology. It privileges state-level institutional change over micro-social practice because the hinge is defined by the former. You are implicitly arguing that the history of the state is the history of history.

  **Vance:** I am not privileging the state ontologically, but pragmatically. If our current form of life is organized around nation-states, then the hinges of that form of life will be state-centric. This is not a moral endorsement. It is an acknowledgment of our current epistemic situation. We cannot think from outside our framework. To ask for a hinge that satisfies the grain merchant in Normandy and the diplomat in Münster equally is to ask for a "view from nowhere."

  **Thorne:** But the philosopher of history *must* attempt that view, or at least acknowledge the distortion. If you accept the hinge-of-history hypothesis, you grant the historian license to treat certain uncertainties as certainties because they are "functionally necessary." That is dangerous. It allows the historian to say, "We cannot question this transition, because it makes the rest of the narrative possible." That is how ideologies harden into textbooks.

  **Vance:** Wittgenstein warned against questioning hinges *groundlessly*, not *critically*. We can examine the hinge, but we cannot stand on it while we examine it. We must be aware of its status. The hypothesis does not demand we treat hinges as empirical truths; it demands we recognize them as the boundaries of our inquiry. Recognizing Westphalia as a hinge allows us to see exactly where our concept of sovereignty begins to fray. It highlights the limit.

  **Thorne:** Yet, by defining it as a hinge, you naturalize the limit. You make it seem as though the fraying is a feature of the world, rather than a feature of your conceptual scheme. Let's press the falsifiability point again. Suppose we discover a cache of documents showing that the concept of "sovereignty" was fully operational in a non-state context in 1500, rendering the Westphalian shift illusory. Would you abandon the hinge?

  **Vance:** If that discovery fundamentally altered how we practice international law and political theory today, then yes. The hinge holds only as long as it sustains the practice. But if we discover those documents and *still* organize the world via Westphalian sovereignty, then the documents are historically interesting but structurally irrelevant. The hinge is defined by its current load-bearing capacity, not its archival origin.

  **Thorne:** So the hinge is presentist. It is determined by the needs of the present, not the reality of the past.

  **Vance:** All history is presentist in that sense. We query the past from the standpoint of the living. The hinge hypothesis simply makes this explicit. It stops us from pretending that our narrative flow is discovered in the dust of archives. It admits that we impose the pivot points to make the flow coherent.

  **Thorne:** And there I must stop you. To say we *impose* them is to admit they are not features of history. You began by suggesting these moments function as "conditions of intelligibility for everything that follows," implying a structural necessity in the timeline itself. Now you concede they are heuristic tools for the present. If they are tools, they can be swapped. If they can be swapped, they are not hinges in the Wittgensteinian sense. They are merely dominant paradigms.

  **Vance:** But paradigms *function* as hinges while they are dominant. The distinction you are drawing—between "real feature of the past" and "condition of intelligibility"—is exactly what the hypothesis dissolves. We cannot access the "real feature of the past" except through conditions of intelligibility. If Westphalia is the condition under which we recognize sovereignty, then for all historical purposes, it *is* the hinge of sovereignty. To demand it be something more is to demand a metaphysics we cannot sustain.

  **Thorne:** Then we are left with a tautology. "The events we treat as foundational are foundational to our treatment." That is true, but it tells us nothing about history. It tells us only about historians. The hinge-of-history hypothesis promises to reveal something about the architecture of time. If it only reveals the architecture of our textbooks, it is a modest claim masquerading as a profound one.

  **Vance:** It is not modest because it constrains us. It tells us where we cannot go. It warns us that certain skepticisms are idle. If you try to write a history of modern law that ignores the hinge of the constitutional moment, you are not writing "alternative history"; you are writing nonsense. The hypothesis identifies the boundaries of sense.

  **Thorne:** Or it identifies the boundaries of our imagination. And the job of the critic is to test those boundaries, not enshrine them. If I can write a coherent history of law that traces legitimacy through ritual rather than constitutions, I have shown your hinge was merely a habit.

  **Vance:** If you succeed, you have not removed the hinge; you have located a new one. You have shown that "ritual" is the pivot, not "constitution." The structure remains, even if the content shifts. The hypothesis holds: there *are* hinges. We just disagree on how to identify them.

  **Thorne:** Then the disagreement is not about the existence of hinges, but about whether calling them "hinges" adds anything to saying "dominant narratives."

  **Vance:** It adds the recognition that these narratives are not subject to ordinary evidential standards. You cannot refute a hinge with a counter-example. You can only displace it with a new framework. That is a crucial distinction for how we evaluate historical claims.

  **Thorne:** And that is why I resist it. Because it grants immunity to the dominant narrative. It tells the revisionist, "You are not wrong on the evidence; you are playing a different game." It protects the status quo from the friction of evidence. In history, nothing should stand fast. Not even the hinges.

  **Vance:** Then you are asking for a history without a ground.

  **Thorne:** I am asking for a history that admits it is always building the plane while flying it. No hinges. Just scaffolding that we know we can take down.

  **Vance:** And I am arguing that without the hinges, the plane never leaves the runway. We need the fixed points to generate the motion.

  **Thorne:** Perhaps. But we must never forget we placed them there.

  **Vance:** Agreed. But we cannot see them while we are standing on them. That is the tragedy, and the necessity, of the hinge.
