      *   Verify the constraint: "free of bibliographies... obscure primary sources." Keep references general (Wittgenstein, Westphalia).

  7.  **Final Review against constraints:**
      *   Formal tone? Yes.
      *   Two scholars? Yes (Vance/Thorne).
      *   Specific points covered (falsifiability, scale, Westphalia)? Yes.
      *   No strawmen? Yes, both arguments are charitable.

  *(Self-Correction Note during drafting)*: I need to make sure Vance doesn't confuse "hinge" with "cause." A hinge isn't necessarily the biggest cause; it's the thing that makes the question of cause intelligible. I need to make that distinction explicit in the dialogue. Thorne should press on this distinction.

  *(Refining the Westphalia point)*: Vance should argue that even if the treaty didn't happen *exactly* as told, the *concept* operates as a hinge. Thorne should counter that this makes it a myth, not a hinge proposition. A hinge proposition in Wittgenstein isn't a myth; it's a certainty. If it's a myth, it's a lie. This is a strong point for Thorne. Vance needs to recover by saying the *function* is what matters, not the archival truth.

