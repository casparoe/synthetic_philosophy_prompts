answer: |-
  This is a fantastic question. You've hit on one of the deepest tensions in modern decision theory, and invoking Frank Ramsey is the perfect way to cut through the noise. Ramsey is the grandfather of both subjective probability and the pragmatist view of truth, so his lens is uniquely suited to dissolve the "magic vs. math" dichotomy you and your friend are stuck in.

  Here is how Ramsey would likely analyze your argument, based on his key texts (*Truth and Probability*, *Facts and Propositions*, and especially *General Propositions and Causality*).

  ### 1. The Core Ramseyian Framework
  To understand his verdict, we have to recall three pillars of his thought:
  *   **Degrees of Belief:** Probability isn't about frequencies in the world; it's about the strength of your disposition to act. A probability is a betting quotient. If you believe $P(A) = 0.5$, you should be indifferent to a bet that pays \$1 if $A$ happens and costs \$1 if it doesn't.
  *   **Causality as Inference Rules:** In *General Propositions and Causality* (1929), Ramsey argues that causal laws aren't empirical descriptions of hidden "glue" in the universe. They are **variable hypotheticals**—rules we adopt for navigating the future. "If I meet a snake, I shall run" is a causal belief not because snakes emit "cause-rays," but because holding this rule leads to successful action.
  *   **The Nature of Acts:** Ramsey insisted that we do not assign probabilities to our own voluntary acts in the same way we do to external events. I don't predict my choice; I make it. However, I can have beliefs about the *consequences* of my choices.

  ### 2. Would Ramsey call it "Smuggling Causality"?
  Your friend says acausal trade is just Expected Utility Theory (EUT) with correlated probabilities. You say it's "vibes" that smuggles in causal claims where none exist.

  Ramsey would likely tell **you** that you are too hung up on a physicalist definition of "cause," but he would tell **your friend** that they are being too casual about the grounds for correlation.

  **On Causality:**
  Since Ramsey views causality as a "rule for prediction" rather than a physical mechanism, he wouldn't reject acausal trade simply because there is no spatiotemporal signal between you and the stranger. If the correlation is robust enough to serve as a reliable rule for inference, it functions *like* a causal law in his system.
  *   **Verdict:** He would reject your claim that it's "not decision theory." If the correlation allows for a coherent betting quotient, it fits his definition of probability.

  **On "Vibes" (Epistemic Grounding):**
  However, Ramsey was a rigorous epistemologist. He would demand to know *why* you assign a high probability to the correlation.
  *   If you say, "I feel like the universe wants us to cooperate," Ramsey would call that nonsense (incoherent degrees of belief).
  *   If you say, "We are both running the exact same source code, and I know mine outputs 'Cooperate'," Ramsey would say the correlation is a **logical truth**, not a causal one.
  *   **Verdict:** He would agree with your caution. You cannot simply *assume* correlation. The "acausal" link must be grounded in logical identity or strong structural evidence, not wishful thinking.

  ### 3. The "Same Decision Procedure" Condition
  This is where Ramsey's view becomes decisive. You asked if the answer changes if the stranger is running the same procedure. **Yes, absolutely.**

  For Ramsey, a belief is true if it leads to successful action (satisfaction of desire).
  *   **Case A: Random Stranger.** If you have no reason to think the stranger's algorithm matches yours, assigning $P(\text{They Coop} | \text{I Coop}) \approx 1$ is incoherent. It violates the rules of probability because it isn't based on evidence or logic. Here, **you win**. It is "vibes."
  *   **Case B: Identical Algorithm.** If you know the stranger is a perfect copy (or running the same FDT algorithm), then the statement "If I output C, they output C" is a logical tautology.
      *   Ramsey would argue that in this case, treating the correlation as a premise in your expected utility calculation is not only rational but *required*. To ignore a logical truth when calculating expected utility is to be incoherent.
      *   Here, **your friend wins**. It is just EUT extended to logical correlations.

  ### 4. The "Probability of Acts" Objection
  There is one nuance where Ramsey might push back on the standard FDT formulation. Ramsey argued we shouldn't treat our own choices as probabilistic events we observe.
  *   **Standard FDT:** "I will choose Cooperate, therefore my copy will Choose Cooperate."
  *   **Ramsey's View:** "I am adopting the rule 'Cooperate'. Given that my copy adopts the same rule, they will Cooperate."

  Ramsey would frame this not as your act *influencing* theirs, but as your act *revealing* the output of a shared function. He would say you aren't betting on a causal influence; you are betting on a **logical consistency**.

  If you frame acausal trade as "my choice magically reaches across space," Ramsey would call that a confused variable hypothetical. But if you frame it as "my choice identifies the output of a function that is instantiated elsewhere," he would accept it as a valid rule for prediction.

  ### 5. The Final Verdict
  If you brought this to Frank Ramsey in 1929, here is how he would settle the bet:

  1.  **To the Friend:** "You are right that the *mathematics* is just Expected Utility. There is no new 'decision theory' needed, only a correct application of probability to logical relations. But you are wrong if you think this implies a new kind of physical causation."
  2.  **To You:** "You are right to be suspicious of 'acausal' magic. If the correlation is not grounded in logical identity or known structural similarity, the belief is incoherent. But you are wrong to call it 'vibes' if the logical link is established. Ignoring a logical correlation is irrational."

  **Who won?**
  It's a draw, but with a twist.
  *   **Your friend wins the technical point:** Acausal trade is consistent with Ramseyian subjective expected utility, provided the probabilities are grounded in logic.
  *   **You win the epistemic point:** It is irrational to apply this reasoning without strict proof of correlation (e.g., identical source code).

  **Ramsey's likely closing remark:**
  >"Causality is a fiction we use to organize our expectations. If the fiction of 'acausal trade'—or rather, the logical rule of 'functional correlation'—leads you to maximize the satisfaction of your desires where standard causal reasoning fails, then it is a rational habit of belief. But do not mistake the map for the territory. You are not moving their hand with your mind; you are simply reading the same book."

  **Summary:** Ramsey would validate **Functional Decision Theory** as a rigorous application of his own probability framework, *but only* in cases of logical correlation (same code). He would dismiss "acausal trade" with random agents as incoherent betting. Your friend is right about the framework; you are right about the constraints.
