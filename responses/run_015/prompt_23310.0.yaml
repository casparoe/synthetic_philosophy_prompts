      *   *General Propositions and Causality (1929):* This is the crucial text for this query. Ramsey views causal laws not as descriptions of necessary connections in nature, but as *rules for inference* or *habits of belief* that help us navigate the world. "If I meet a snake, I shall run." It's a variable hypothetical.
      *   *Decision Theory:* He laid the groundwork for EUT. An agent maximizes expected utility based on subjective probabilities.

