      *   **Conclusion:** Ramsey would likely side with the *structure* of the Friend's argument (it's consistent EUT) but with the *epistemic caution* of the User (you need solid grounds for the correlation). He wouldn't call it "acausal causation," he would call it a "logical relation informing a habit of belief."

