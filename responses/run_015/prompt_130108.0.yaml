      *   *Refining the Order:* The Teleosemantic argument is the core of the philosophical opposition. That goes first. The Combinatoriality/Syntax argument is the second strongest philosophical pillar. The Biologist's pragmatic argument is strong but easier to deflect as "instrumentalism" vs "ontology." The Context one is actually a point *for* the user, so it needs to be framed as an objection to their dismissal of the code. Let's make the "Causal Specificity" argument the killer one.

      *   *Re-evaluating Order based on "Damaging":*
