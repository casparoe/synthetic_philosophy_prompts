      *   **Audience:**
          *   Majority: Philosophers of biology defending informational/teleosemantic accounts (some view the code as *literal* semantics).
          *   Minority (2): Practicing molecular biologists (view code as instrumentally useful, ontologically neutral).
      *   **User's Thesis:** DNA is *not* a semantic code. It's a chemically reactive substrate. Context mediates everything. Informational framing imposes false discreteness and obstructs clarity.
      *   **Task:** Create a Q&A preparation sheet.
      *   **Requirements:**
          *   Objections ordered from most damaging to least.
          *   Phrased in the audience's vocabulary (philosophers: content, function, intentionality; biologists: prediction, operation).
          *   Concise reply (2-minute response limit).
          *   Explicit note on vulnerability/soft spot for each reply.
          *   Indication of source (Philosopher vs. Biologist).
          *   Include the "Single Objection I Hope Nobody Asks" (the concealed weakness).
          *   No bibliographies/citations.

  2.  **Deconstruct the Thesis & Anticipate Objections:**
      *   *Thesis:* DNA = Chemical Substrate, not Semantic Code. Information = False Discreteness.
      *   *Philosophical Counter-arguments:* Teleosemantics (function derived from selection), Combinatoriality (syntax-like structure), Decouplability (representation vs. reaction), Explanatory Power (informational models predict better).
      *   *Biological Counter-arguments:* Utility (it works), Communication (we talk this way to get things done), Abstraction (all models are false but some are useful).
      *   *The "Killer" Objection:* If DNA isn't information, how do you account for the specificity of the genotype-phenotype map without smuggling in "information" under a different name (e.g., "causal specificity")?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Heavy Hitter):* Teleosemantics. If selection shaped the system to produce specific outcomes, isn't that *function* in the semantic sense? (Philosopher)
