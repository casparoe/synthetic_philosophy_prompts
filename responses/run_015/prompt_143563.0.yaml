          *   Flaw: You can climb a smaller hill (local maximum) thinking it's the peak.
      *   *Selection:* The **Mountain Climbing / Gradient Ascent** analogy fits RL best. Or perhaps **Code Compilation vs. Unit Tests**. Let's go with a hybrid: **Architect/Inspector vs. Structural Engineer**.
      *   *Actually, let's refine the "Navigation" one.* It captures the "path dependence" better.
