  10. (Final thought on the "Hidden Lemma"): This is essentially the problem of **non-Markovian rewards**. A PRM assumes the reward at step $t$ depends mostly on state $t$ and $t-1$. If the reward depends on $t$ and $t+10$, the PRM is structurally blind to it. I need to mention Non-Markovianity.

