answer: |-
  **MEMORANDUM**

  **TO:** Dr. Elena Rosales, Museum Director
  **FROM:** Julian Thorne, Chair, Curatorial Advisory Board
  **DATE:** October 24, 2023
  **SUBJECT:** Advisory Board Opinion on Permanent Gallery Proposal "From Well to Tap"

  **DECISION: REJECT AND REMAND FOR REDESIGN**

  The Curatorial Advisory Board has reviewed the proposal for the permanent gallery exhibition *From Well to Tap: The Making of Modern Water*. While we acknowledge the significant labor invested in this draft, the Board cannot recommend approval in its current form. We formally recommend that the Board of Trustees **reject the current proposal and remand it to the Curatorial Department for redesign**, contingent upon the specific narrative and structural conditions outlined below.

  This decision is not made lightly. We recognize that the lead curator's argument regarding pedagogical coherence and institutional viability constitutes the strongest consideration on the losing side of this deliberation. We accept that school groups and general audiences require a legible narrative structure, and we acknowledge that our district contract and funding streams rely on a demonstrable "civic-progress" framework. To disrupt the narrative flow risks visitor confusion and potential contractual friction. However, the Board's primary fiduciary duty is to historical integrity. A narrative that secures pedagogical ease or funding compliance at the expense of factual accuracy regarding political violence and ideological suppression fails the museum's core mission. Therefore, while the Curator's concerns are pragmatic and substantial, they cannot override the ethical imperative to avoid historical distortion.

  **I. HISTORIOGRAPHICAL ASSESSMENT: THE 1892 COOPERATIVE**

  The central historiographical flaw in the current proposal is the deployment of infrastructural Whig history. The exhibition currently frames the 1870s private companies, 1884 mutual-aid wells, 1892 socialist cooperative, and 1901 municipal works as successive approximations of the current integrated system. This teleology implies that the current system was the inevitable and superior outcome of a natural evolution.

  This is historically untenable regarding the 1892 Water Cooperative. The historical record indicates that the 1892 Cooperative explicitly rejected state-centralized water ownership in favor of decentralized, worker-controlled distribution. They were not "early public-health pioneers" in the mold of the 1901 municipal engineers; they were ideological opponents of municipalization. Their dissolution was not a natural market correction or a benign administrative consolidation; it was a forcible suppression by state authorities.

  To incorporate the 1892 Cooperative into a "steps toward us" framework is to engage in retrospective legitimation. It sanitizes the violence of consolidation by suggesting the Cooperative was merely a "prototype" for the system that crushed it, rather than an alternative model that was extinguished. Honesty requires we acknowledge that the current system exists not because it was the only logical endpoint, but because it won a political conflict.

  **II. REQUIRED ALTERATIONS TO DISPLAY ELEMENTS**

  To rectify these distortions, the following specific elements must be altered during the redesign phase:

  1.  **The Chronological Timeline Wall:**
      *   *Current State:* Depicts a linear arrow where each system replaces the previous one due to "efficiency improvements."
      *   *Required Change:* The timeline must be reconfigured to show divergence and conflict. The transition from 1892 to 1901 must be marked not as an "upgrade," but as a "Transition of Authority," with explicit text noting the legal and physical dissolution of the Cooperative by state mandate.
  2.  **The "Foundations of Public Health" Room:**
      *   *Current State:* Attributes public health gains solely to the 1901 centralized chlorination and piping efforts.
      *   *Required Change:* This room must acknowledge that the 1892 Cooperative achieved comparable sanitation metrics through decentralized filtration. The narrative must shift from "Centralization brought health" to "Competing visions of health security."
  3.  **Biographical Panels (Key Figures):**
      *   *Current State:* Portrays 1901 Municipal Engineers as visionaries and 1892 Cooperative leaders as "well-meaning but impractical."
      *   *Required Change:* Biographical text for Cooperative leaders must accurately reflect their political platform (worker control/anti-statist) without qualifying it as "impractical." The role of the 1901 Engineers must include their advocacy for the state powers used to dissolve the Cooperative.

  **III. ALTERNATIVE ORGANIZATIONAL PRINCIPLE**

  We propose abandoning the "Chronological Progress" model in favor of a thematic framework titled **"Models of Stewardship."**

  Instead of arranging the gallery as a march toward the present, arrange the space around three incompatible models of maintenance, access, and ownership:
  1.  **Private Commodity (1870s)**
  2.  **Commons/Cooperative (1884 & 1892)**
  3.  **Public Utility (1901–Present)**

  Visitors would move through these as distinct ideological zones rather than temporal steps. This preserves visitor coherence—guests can still understand the differences between systems—without imposing a teleological judgment that the final zone is the "winner" by virtue of historical inevitability. The conclusion of the gallery can then invite visitors to consider the trade-offs of the current system, rather than celebrating its arrival.

  **IV. ADDRESSING THE SCHOOL-DISTRICT CONTRACT**

  The Education Director has rightly flagged a tension between this redesign and the district contract's requirement for a "clear civic-progress narrative." The Board has deliberated on whether accommodating this clause compromises our duty to avoid Whig historiography.

  **Assessment:** Yes, interpreting "civic progress" as "inevitable improvement toward the current status quo" compromises our duty. However, we believe the contract can be fulfilled without historical falsification.

  **Recommendation:** We advise the Director's office to initiate an immediate addendum negotiation with the school district. We propose redefining "civic progress" for the purposes of this exhibition as **"Civic Evolution through Debate."** The learning objectives can focus on how citizens organized, conflicted, and negotiated over resources. This satisfies the requirement for a "clear narrative" (the story of the debate) without requiring a Whig interpretation (the story of inevitable improvement). If the district insists on a narrative that erases the suppression of the 1892 Cooperative, the Board advises that the museum must consider the reputational risk of endorsing state-sanctioned historical revisionism against the funding risk of the contract. We stand ready to support the Director in this negotiation.

  **V. TIME-BOUND IMPLEMENTATION PLAN**

  To ensure the gallery opens on schedule while meeting these standards, the Board mandates the following timeline:

  *   **November 7 (2 Weeks):** Curatorial team submits revised narrative outline based on the "Models of Stewardship" framework.
  *   **November 21 (4 Weeks):** Consulting Historian reviews revised outline for historiographical compliance.
  *   **December 15 (8 Weeks):** Draft text for Timeline, Public Health Room, and Biographical Panels submitted for Board review.
  *   **January 10 (12 Weeks):** Final sign-off on narrative content. Production begins.
  *   **February 1:** Education Director to finalize contract addendum with School District regarding "Civic Evolution" learning standards.

  **CONCLUSION**

  The Curator's concerns regarding funding and pedagogy are valid institutional constraints. However, a museum that sacrifices the complexity of the past for the comfort of the present ceases to be a history museum and becomes a public relations office. By remanding this proposal, we provide the Curatorial team the protection they need to produce an exhibition that is both intellectually honest and publicly engaging. We look forward to reviewing the redesigned proposal.

  Respectfully submitted,

  Julian Thorne
  Chair, Curatorial Advisory Board
  Riverside City History Museum
