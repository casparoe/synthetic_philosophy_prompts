answer: |-
  ### Part 1: Framing Brainstorm & Selection

  Here are four ways to frame this activity. I've selected the fourth one for the full plan.

  1.  **The "Mind-Reading Society" Simulation:** Frame the programs as literal brain-scans in a sci-fi future where thoughts are transparent before action.
      *   *Why dropped:* It encourages students to think about *privacy* and *psychology* rather than game structure. They'll debate whether humans *can* be read, rather than whether the equilibrium holds given the rules.
  2.  **The "Contract Design" Workshop:** Frame the programs as binding legal contracts submitted to a court (the compiler) that enforces the terms.
      *   *Why dropped:* This conflates Program Equilibrium with Pre-Commitment (Schelling). Contracts imply a third-party enforcer. The philosophical punch of Program Equilibrium is that the *logic itself* enforces the outcome, not an external court.
  3.  **The "AI Safety" Tournament:** Frame it as testing autonomous agents to see if we can code morality into bots.
      *   *Why dropped:* It shifts the focus to "how do we build good bots" (engineering) rather than "what is rational" (philosophy). It also invites the "bots aren't people" dismissal too early.
  4.  **The "Expanded Strategy Space" Protocol:** (Selected). Frame it strictly as a change in the *rules of the game*. The "move" is no longer C or D; the move is a *function*. This forces them to confront the definition of a strategy in game theory without metaphorical baggage.
      *   *Why kept:* It isolates the variable. The only thing that changed is the allowable move set. If cooperation emerges, it must be due to the structure of rationality, not morality or enforcement.

  ***

  ### Part 2: The Activity Plan — "Source Code PD"

  #### 1. Materials List
  *   **Index Cards:** 50 (pre-cut into "Program Cards").
  *   **Pens:** 20 (black, fine point for legibility).
  *   **Whiteboard & Markers:** For the "Compiler Log" and Payoff Table.
  *   **Timer:** Visible to the class.
  *   **Prize:** One nice chocolate bar or coffee voucher (for the winning pair).
  *   **Handout:** One half-sheet per student with the Language Syntax & Token Rules.

  #### 2. The Language (Hand-Executable)
  To ensure I can run this on paper, the language is restricted. A program is a sequence of up to **10 lines** (Token Budget).

  **Syntax:**
  1.  `READ O` : Loads opponent's program into memory.
  2.  `IF [CONDITION] THEN [LINE #]` : Jumps to a specific line number in *your* program.
  3.  `OUTPUT COOP` : Ends execution. Payoff calculated.
  4.  `OUTPUT DEF` : Ends execution. Payoff calculated.
  5.  `SELF` : A keyword that expands to *your own program's exact text*.
  6.  `==` : String equality check.

  **Execution Rules (The "Compiler"):**
  *   **Step Limit:** 10 execution steps max. If a program loops or exceeds 10 steps, it crashes and outputs `DEF`.
  *   **Equality Check:** `O == SELF` is true only if the opponent's card is character-for-character identical to yours.
  *   **Halting:** If a program doesn't explicitly output, it defaults to `DEF`.

  #### 3. Mechanics Selection
  *   **Token Budget (Keep):** Limit programs to 10 lines. This makes the "Mirror" strategy (`IF O==SELF THEN COOP...`) tight. It forces them to choose between complex logic and the cooperative equilibrium.
  *   **Public Sandbox (Keep):** Before final submission, allow 5 minutes where students can ask me: "If I play Program X against Program Y, what happens?" I simulate on the board. This lets them test hypotheses without revealing their final move.
  *   **Lossy Channel (Drop):** Too hard to simulate fairly on paper. Perfect transparency is required for the "Mirror" equilibrium to work cleanly.
  *   **Noise (Drop):** Saves time. We want to establish the equilibrium first; fragility is a week-two problem.

  #### 4. Timeline (90 Minutes)

  **0:00 – 0:05 | Framing (The "New Move")**
  *   **Script:** "Last week you proved defection is rational in a one-shot PD. Today, we change one rule. You don't choose C or D. You choose a *program* that chooses C or D. You submit this card. I pair you anonymously. I run your program against theirs. If your code says COOP, you cooperate. The payoff matrix is unchanged. You have 10 lines of code. Go."
  *   **Action:** Hand out syntax sheets and 3 blank program cards each (for drafts).

  **0:05 – 0:25 | Drafting & Sandbox Phase**
  *   Students write drafts.
  *   **Sandbox:** Students raise hands to query. "Prof, if I write `OUTPUT COOP` and they write `OUTPUT DEF`, what happens?" You answer publicly. This builds shared knowledge of the "physics" of the room.
  *   **Incentive:** Remind them: "The pair with the highest *combined* score wins the prize." (Aligns incentives toward finding the cooperative equilibrium).

  **0:25 – 0:35 | Final Submission**
  *   Students write final code on the official Index Card. No names, just a Student ID number.
  *   Collect cards. You (the Prof) act as the CPU.
  *   **Pairing:** Pre-assign pairs (1-2, 3-4, etc.) secretly.

  **0:35 – 0:55 | The Compilation (Live Execution)**
  *   This is the theater. Pick a pair. Read Program A. Read Program B.
  *   Trace the logic on the whiteboard step-by-step.
      *   *Example:* "A checks if B equals A. They are different. A goes to Line 5. A outputs DEF. B outputs DEF. Payoff 1,1."
  *   Record scores on the board.
  *   **Crucial Moment:** If a pair successfully runs the `IF O==SELF THEN COOP` mirror strategy, highlight it. "Look. No enforcement. No repetition. Just logic."

  **0:55 – 1:05 | Round 2 (Iteration)**
  *   Return cards. Allow them to modify their program based on what they saw.
  *   "You know the population now. Write a new program."
  *   Collect and run 4 random pairs quickly (to save time).
  *   *Expected Shift:* More people try to clone the winning strategy, or try to write a program that cooperates with the "Mirror" but defects against "Always Defect."

  **1:05 – 1:25 | The Debrief (The Philosophy)**
  *   **Map to Theory:**
      1.  **Strategy Space:** "In standard PD, your strategy is a single choice. Here, your strategy is a *function*. You expanded the move space."
      2.  **Program Equilibrium:** "The `IF O==SELF` strategy is a Nash Equilibrium. If you switch to Defect, your opponent's program (which is identical) also switches to Defect. You gain nothing. You are locked in."
      3.  **Self-Reference:** "The `SELF` token is doing the heavy lifting. It allows your move to depend on the *disposition* of the other, not just their action."
      4.  **The Skeptic:** "Does this solve the PD? No. It relocates the assumption. We assumed *transparency*. Is that realistic?"

  **1:25 – 1:30 | Closing & Objections**
  *   Address the "Kant" and "Real World" questions (see scripts below).
  *   Award prize.

  #### 5. Scoring & Incentives
  *   **Payoffs:** CC=3pts, DC=5pts, CD=0pts, DD=1pt.
  *   **Course Credit:** Everyone gets full participation points regardless of outcome (to prevent risk-aversion).
  *   **Prize:** The *Pair* with the highest combined score (e.g., 6 points for CC) wins the chocolate. This is vital. If you prize the highest *individual* score, they will try to exploit cooperators. If you prize the *pair*, they are incentivized to find the cooperative equilibrium.

  #### 6. Execution & Arbitration Procedure
  *   **The "Crash" Rule:** If you get stuck tracing a loop (e.g., A reads B, B reads A), count 10 seconds. If not resolved, declare "Timeout -> DEFECT."
  *   **The "Syntax Error" Rule:** If a program is unreadable, it defaults to DEFECT. (Encourages clarity).
  *   **Cheating:** If two friends sit together and write identical code to game the "Pair Prize," call it out as "Collusion vs. Program Equilibrium." It's actually a great teaching moment about the difference between *communication* and *logical correlation*.

  #### 7. Troubleshooting: What Will Go Wrong
  *   **Problem:** Students write "If you cooperate, I cooperate."
      *   **Fix:** Remind them: "You cannot see their *output* before you output. You can only see their *code*."
  *   **Problem:** The `O==SELF` check takes too long to verify manually.
      *   **Fix:** Have the two students stand up and hold cards side-by-side. The class verifies.
  *   **Problem:** Everyone defects anyway because they don't trust the "Mirror."
      *   **Fix:** In the debrief, point out that *they* chose not to trust the logic. The equilibrium *existed*, but they didn't play it. This proves the point: rationality requires common knowledge of rationality.
  *   **Problem:** A student writes a program that simulates the opponent (infinite regress).
      *   **Fix:** Enforce the 10-step timeout strictly. "You ran out of compute. You defaulted to Defect."

  #### 8. The Limitation (What You Must Admit)
  *   **The Honesty Note:** "This activity assumes a magical compiler that can solve the Halting Problem. In reality, I cannot know if your program will halt without running it, and running it might take forever. We assumed *perfect, costless transparency*. In the real world, reading 'source code' (intentions/capabilities) is costly and often impossible. We haven't solved the PD; we've shown that *if* transparency were free, cooperation would be rational."

  #### 9. Scripts for Tough Questions

  **Q: "Isn't this just the Golden Rule or Kant? Do unto others as you'd have them do unto you?"**
  *   **A:** "Kant is a moral imperative: 'You *ought* to cooperate.' This is a causal prediction: 'If you change your code to Defect, the other program *will* output Defect.' Kant asks you to ignore the consequences; Program Equilibrium works *because* of the consequences. It's not morality; it's logic."

  **Q: "Real people aren't code. Real AI won't share source. Is this useless?"**
  *   **A:** "Humans aren't code, but institutions are. Contracts, APIs, and verification protocols are 'source code.' More importantly, this models *logical correlation*. If you and I are both perfectly rational agents with the same information, we will reason to the same conclusion. My decision *is* a prediction of yours. That correlation exists even without sharing code. This activity just makes that correlation visible."

  ***

  ### Instructor's Cheat Sheet (For the Whiteboard)

  **Payoff Matrix:**
  | | COOP | DEFECT |
  |---|---|---|
  | **COOP** | 3, 3 | 0, 5 |
  | **DEFECT** | 5, 0 | 1, 1 |

  **Example "Mirror" Program (Fits in 10 lines):**
  ```
  1. READ O
  2. IF O == SELF THEN 5
  3. OUTPUT DEF
  4. END
  5. OUTPUT COOP
  6. END
  ```
  *Trace:* If playing against self, Line 2 is True -> Jump to 5 -> COOP. If playing against `OUTPUT DEF`, Line 2 is False -> Line 3 -> DEF.

  **Example "Unconditional Cooperator" (Sucker):**
  ```
  1. OUTPUT COOP
  ```

  **Example "Unconditional Defector":**
  ```
  1. OUTPUT DEF
  ```

  **Example "Exploiter" (Try to break the Mirror):**
  ```
  1. READ O
  2. IF O == [Copy of Exploiter Code] THEN DEF
  3. IF O == [Copy of Mirror Code] THEN DEF
  4. OUTPUT COOP
  ```
  *(Note: This usually fails because the Mirror will see the Exploiter is different and Defect.)*

  Good luck on Thursday. The key is to let them feel the frustration of the "Defect" equilibrium in Round 1 so the "Mirror" solution in Round 2 feels like a discovery, not a lecture.
