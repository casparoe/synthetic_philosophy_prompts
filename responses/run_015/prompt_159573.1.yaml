answer: |-
  **The Setup (10 mins)**
  *   **Materials:** Index cards, envelopes, markers, scoreboard.
  *   **Roles:** Pairs. One "Driver," one "Hitchhiker." Swap roles each round.
  *   **Currency:** Points. Top scorers win wine.
  *   **Payoffs:**
      *   **Driver:** +5 if Hitchhiker pays. -5 if picks up and Hitchhiker doesn't pay. 0 if strands them.
      *   **Hitchhiker:** +10 if brought to town. -5 if they pay. (Net +5 if pay, +10 if cheat, 0 if stranded).
  *   **The "Policy" Card:** Before Round 1, everyone writes "I Pay" or "I Don't" on a card, seals it in an envelope. No one sees these yet.

  **The Rounds (40 mins)**
  *   **Round 1 & 2 (Public):** Partners rotate. Names visible. Past choices tracked on scoreboard. Drivers decide based on history.
  *   **Round 3 (The Void):** Anonymous re-pairing (use numbers). No history visible. Drivers are handed their partner's sealed "Policy" envelope. They may open it *before* deciding to pick up. Hitchhikers decide privately.
  *   **Constraint:** No talking during decisions. No side payments.

  **The Debrief (20 mins)**
  *   **Map the Trap:** Ask Round 3 Drivers: "Why did you strand them?" (Answer: "No future rounds to punish cheating.") Ask Hitchhikers: "Why did you cheat?" (Answer: "No cost to cheating.")
  *   **The Lesson:** In Round 3, reputation is dead. Contracts are void. The only way to get the ride was to be the *kind of person* who pays even when it's pointless. Those who wrote "I Pay" and meant it got rides. Those who lied on the card stranded themselves because Drivers trusted the card.
  *   **Jargon Drop:** Now introduce "Parfit's Hitchhiker," "Precommitment," and "Decision Theory."

  **Predictable Failures**
  *   **The Equilibrium Announcer:** One person will say in Round 1: "We should all defect in the last round."
      *   *Fix:* Acknowledge it. "Great, let's test if that's true." Let the game prove that universal defection yields zero wine.
  *   **The Charmer:** Players trying to wink/nod in Round 3.
      *   *Fix:* Enforce silence strictly. The signal must be the Policy card, not performance.

  **Honest Limitation**
  *   **Prediction vs. Psychology:** Real PH relies on logical prediction (the driver *knows*). This game relies on human trust (the driver *hopes*). You must explicitly state: "In the哲学 thought experiment, the driver is a perfect mind-reader. Here, they're just guessing based on your policy."

  **Where This Design Fails**
  *   **The Cynic Sweep:** If everyone treats the Policy Card as cheap talk (lying "I Pay" then defecting), Drivers will learn to ignore the cards in Round 3. Everyone gets stranded.
  *   **Visual Cue:** If you see half the room smirking while sealing envelopes, the lesson collapses into "liars win." You must intervene: "If you lie on the card, you are proving you aren't the type who gets rescued." If they still lie, the game demonstrates the tragedy of causal decision theory, but misses the "virtue" angle.
