answer: |-
  Hi everyone. Thanks for coming.

  For those who don't know me, I'm a software engineer. I work on distributed systems, and I spend about half my life writing documentation for things I barely understand. So, I'm used to standing in front of people and explaining complex systems while secretly hoping nobody asks a question I can't answer.

  Standing here today, between the historians in this room—who actually know how to study the past—and the developers who think "history" is just the git commit log from last sprint… I feel that same imposter syndrome. But I was asked to kick things off, so I'm going to talk about the one thing I know engineers are guilty of: telling ourselves a comforting story about how we got here.

  We love a victory lap. In engineering, it's very tempting to look at the past as a straight line leading directly to our current stack. We treat old projects like rough drafts. We say things like, "Well, that system failed, but it taught us how to build *this* system." We turn dead ends into stepping stones.

  There's actually a name for this. It's called Whig history. I'm not a historian, so I'll butcher the academic definition, but basically, it's the habit of writing history as if the present was inevitable. As if everything that happened before was just practice for where we are now.

  And I think that's a trap for this workshop.

  If we look at "Failed Futures" through that lens, we flatten everything. We turn real alternatives into mere prehistory. For example, if we talk about a 1970s symbolic AI project, it's easy to say, "That was naive, but necessary for modern machine learning." It sounds respectful, but it's actually dismissive. It implies the people working on it were just waiting for us to show up. It suggests they didn't actually believe in what they were building.

  But they did. They believed in it. To them, that wasn't a stepping stone to TensorFlow. That was the future. It was a viable path that got closed off for reasons that weren't just technical—they were social, economic, political.

  I know half the room here lives in the world of technical debt. You look at old code and see mistakes. You see things that should have been refactored. But the other half of this room knows that code exists in a context. Those "mistakes" were often rational decisions made by people who were just as smart as us, working with a different map of reality.

  So, my request for today is simple. Let's try to resist the urge to judge these projects by whether they survived. Let's not treat them as errors in the calculation that produced modern computing.

  For the developers here: I know it's hard. We're trained to optimize. We want to know the "right" way. But today, try to look at these failed projects not as broken versions of what we have, but as complete versions of what *could have been*.

  And for the historians: I know you know this better than I do. But help us see the humanity in the failure. Help us see the moments where things could have gone differently.

  If we do that, this workshop isn't just a post-mortem on dead tech. It becomes a way to understand that the future isn't a destination we're marching toward. It's a garden of forking paths. Most of them got pruned. But today, we're going to look at the branches we cut off, and ask why.

  We're not here to judge the past by our present. We're here to let the past challenge our present.

  So, let's get into it. Welcome to "Failed Futures."
