answer: |-
  # The Coarse Limit: Why Accuracy-First Probabilism Fails Without Fine-Grained Measures

  The accuracy-first program in epistemology, championed by Jim Joyce and others, seeks to ground the norms of rational belief in the single value of accuracy. The central result of this program is an argument for probabilism: the claim that a rational agent's credences must obey the axioms of probability. The standard argument proceeds by selecting a strictly proper scoring rule, such as the Brier score, and demonstrating that for any non-probabilistic credence function, there exists a probabilistic one that is strictly more accurate at every possible world. Thus, non-probabilistic credences are accuracy-dominated and irrational.

  However, this argument hinges on a specific conception of accuracy: one that aggregates error across all propositions using a fine-grained, continuous distance metric. But what if accuracy is not fine-grained? What if the primary epistemic sin is not total distance from the truth, but catastrophic error? This essay examines the "coarse-first" measure, where the primary goal is minimizing the maximum error (minimax) on the true proposition, with total squared distance serving only as a tie-breaker. I will argue that under this measure, the dominance argument for probabilism collapses. The framework does not deliver classical probabilism; instead, it yields a permissivism that validates non-probabilistic credences. Ultimately, this reveals that the accuracy-first argument for probabilism is not a robust discovery about rationality, but a contingent consequence of insisting on fine-grained measurement. To save probabilism, the accuracy-firster must admit that their framework smuggles in a specific, contestable theory of epistemic value that excludes pragmatic safety constraints.

  ### The Coarse-First Challenge

  To understand the threat, we must analyze the mechanics of the coarse-first measure. The standard Brier score sums the squared differences between credences and truth values across a partition. It penalizes a spread of error evenly. In contrast, the coarse-first measure prioritizes the "worst-case miss." Specifically, it looks at the error on the *true* cell of the partition. The intuition is that being wildly underconfident about the truth is a worse epistemic failure than being moderately overconfident about falsehoods.

  Consider the prompt's example: a partition of three mutually exclusive and exhaustive worlds $\{w_1, w_2, w_3\}$.
  Let $C$ be the non-probabilistic credence function $(0.51, 0.51, 0.51)$. This function violates the probability axioms because the credences sum to $1.53$, not $1$.
  Let $P$ be the probabilistic function $(1/3, 1/3, 1/3)$.

  Under the coarse-first metric, we evaluate the "miss" on the true world. If $w_1$ is the actual world:
  *   For $P$, the credence in the truth is $1/3$. The error (distance from 1) is $0.66$.
  *   For $C$, the credence in the truth is $0.51$. The error (distance from 1) is $0.49$.

  The prompt notes that $C$ has a worst-case miss of $0.49$, while $P$ misses by at least $2/3$. This holds regardless of which world is true. Because $P$ must normalize its credences to sum to 1, it is forced to spread its confidence thinly across the partition. In a three-cell partition, it cannot assign more than $1/3$ to the truth without assigning less to others. $C$, unconstrained by normalization, assigns a robust $0.51$ to every cell. Consequently, $C$ guarantees that it is never more than $0.49$ away from the truth, whereas $P$ guarantees it is at least $0.66$ away.

  ### The Reversal of Dominance

  In the standard accuracy-first framework, probabilistic functions *dominate* non-probabilistic ones. There is no world where a non-probabilistic function beats a specific probabilistic rival on a strictly proper scoring rule. Under the coarse-first measure, this relationship inverts.

  In the scenario above, the non-probabilistic function $C$ *dominates* the probabilistic function $P$ with respect to the primary metric (max error on truth). At every world, $C$ is closer to the truth value of 1 than $P$ is. If we take the dominance argument seriously—that rational agents should not adopt credence functions that are accuracy-dominated by alternatives—then the coarse-first measure dictates that $C$ is more rational than $P$.

  This breaks the accuracy-first argument for probabilism. If accuracy is defined by minimizing the risk of significant underconfidence on the truth, then violating the probability axioms is not a defect; it is a feature. The normalization constraint, which is the hallmark of probabilism, becomes a liability. It forces the agent to be timid. To satisfy the coarse-first accuracy norm, the agent should be optimistically non-probabilistic, assigning high credence to all possibilities to ensure they are never caught off guard by the truth.

  One might object that $C$ incurs massive errors on the *false* worlds (assigning 0.51 to falsehoods). However, the coarse-first setup explicitly prioritizes the max error on the truth (or the max error generally, which $C$ still minimizes in many configurations compared to uniform probabilities). If the tie-breaker is total squared distance (Brier), $P$ might win there. But because the primary metric is the "coarse" max-error, $C$ wins the lexicographical ordering. The dominance argument no longer singles out probabilism as the unique rational standard.

  ### Verdict: Permissivism and Breakdown

  Does this framework deliver a weaker form of probabilism, such as imprecise credences? Not really. Imprecise probabilism usually involves sets of probability functions, still adhering to the axioms within the bounds. The function $(0.51, 0.51, 0.51)$ is not an imprecise probability; it is a violation of additivity.

  The framework delivers **Permissivism**. It suggests that there are multiple rational ways to value accuracy. If an agent values total truth-likeness (Brier), they should be probabilistic. If an agent values safety from underconfidence (Coarse), they should be non-probabilistic. Since the accuracy-first program aims to derive norms from the *value of accuracy* simpliciter, the fact that different explications of "accuracy" yield contradictory norms indicates a **breakdown** of the program's normative force. It cannot tell us what we ought to believe without first stipulating a controversial metric of measurement.

  Consequently, the accuracy-first argument for probabilism does not survive the drop to coarse-grained measures. It survives only as a conditional claim: *If* accuracy is measured by strictly proper, fine-grained scoring rules, *then* probabilism is required. But this concedes that probabilism is not a necessary condition of valuing truth; it is only a necessary condition of valuing truth *in a specific mathematical way*.

  ### Is Coarse-First Epistemic?

  This leads to the crucial question: Should an accuracy-firster want a coarse-first measure? The temptation to say "no" is strong, but the reasons reveal the fragility of the accuracy-first project.

  The coarse-first measure resembles a pragmatic safety constraint more than a veritistic one. Minimizing the maximum error is a minimax regret strategy common in decision theory, where the goal is to avoid catastrophic outcomes. In an epistemic context, prioritizing the error on the true cell amounts to saying, "It is worse to be surprised by the truth than to be confident about falsehoods." This is not a pure concern for representing the world as it is; it is a concern for *utility*. It treats belief like a bet where bankruptcy (being wildly wrong on the truth) is the only sin that matters.

  If the accuracy-firster rejects the coarse measure, they must argue that it is not truly *epistemic*. They would claim that epistemic accuracy requires symmetry: error on falsehoods matters just as much as error on truths. But this defense is not derived from the concept of accuracy itself; it is an additional philosophical commitment. It implies that the standard accuracy-first argument relies on a "fine-grained" bias that privileges mathematical elegance (additivity, continuity) over the intuitive desire to avoid being blindsided.

  Furthermore, the coarse-first measure smuggles in a notion of **belief-as-acceptance**. By ensuring credence is above 0.5 everywhere, the agent is effectively "accepting" all propositions as live possibilities. This looks like a doxastic strategy for inquiry ("keep all options open") rather than a representation of truth. If accuracy-first epistemology is meant to replace pragmatic accounts of belief, adopting a measure that mimics pragmatic risk-aversion undermines its own distinctiveness.

  ### Conclusion

  The accuracy-first argument for probabilism does not survive the transition to coarse-first measures. Under a minimax accuracy norm, non-probabilistic credence functions can dominate probabilistic ones, rendering the probability axioms optional rather than mandatory. This does not merely weaken probabilism to imprecise credences; it validates outright violations of additivity as rational strategies for avoiding underconfidence.

  To maintain probabilism, the accuracy-firster must reject coarse measures as illegitimate explications of epistemic value. But doing so reveals that the argument for probabilism is not a robust consequence of "valuing accuracy," but rather a consequence of valuing accuracy *as measured by strictly proper scoring rules*. This concession undermines the project's ambition to ground rationality in a self-evident epistemic good. The honest conclusion is that epistemic rationality is not monolithic. If we value safety from surprise, non-probabilism is rational. If we value global truth-approximation, probabilism is rational. The accuracy-first framework cannot adjudicate between these values without begging the question. Thus, the argument for probabilism breaks down not because probabilism is false, but because "accuracy" is too thin a concept to bear the normative weight placed upon it without contentious, fine-grained constraints.
