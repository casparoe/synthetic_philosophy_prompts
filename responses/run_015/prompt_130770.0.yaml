      *   *Cognitive Science:* Kuhn's Paradigm Shifts / Gestalt Switches. Are these just hidden rules? Or are they incommensurable? If I see a duck and then see a rabbit, is the "rabbit rule" hidden in the "duck rule"? No, the *organization* of data changes fundamentally.
      *   *Creativity/Novelty:* Radical novelty. If I invent a new game (like Chess vs. Go), are the rules of Go implicit in Chess? No. Human creativity often involves breaking constraints, not just finding loopholes.
      *   *Falsifiability:* If every surprise is explained as "implicit," the theory explains everything and predicts nothing. This is the "All theories are true" problem.

  4.  **Ranking the Defeaters:**

      *   *Fatal:* The Tarski/Gödel distinction. The formal proof that truth cannot be defined *within* the system. The meta-system isn't "hidden" inside; it requires a stronger axiomatic basis.
      *   *Severe:* The Falsifiability/Tautology charge. If "implicit" means "could eventually be derived," it's trivial. If it means "was determined at the Big Bang," it's metaphysical, not explanatory.
      *   *Moderate:* Cognitive restructuring (Gestalt/Kuhn). Hard to prove it's not just neural computation, but phenomenologically it feels like a break.
      *   *Awkward:* The pragmatic utility of "Jootsing." Even if technically false, the *concept* is useful for describing the *experience* of insight.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the view. It's a strong determinist/computationalist stance.
      *   *Defeater 1 (Fatal):* Tarski's Undefinability of Truth. This is the hard logical hammer. You can't encode the truth predicate of System S inside System S. The meta-system isn't implicit; it's *stronger*. It has axioms S doesn't have.
      *   *Defeater 2 (Severe):* The Tautology Trap. If "implicit" means "physically possible given the laws of physics," then *everything* is implicit. This makes the claim vacuous. It strips "system" of its definitional boundaries.
