answer: |-
  Here are ten questions drafted for your prep sheet. I've kept the tone conversational—something you can read straight off the phone—but sharpened the edges to challenge her specific framework. Each includes a follow-up note anticipating her "transparency assumption" defense.

  ***

  **1. The Gyges Reinterpretation**
  "Let's start with the Ring of Gyges. The standard reading is that invisibility removes the *fear* of punishment. You're arguing the real issue is 'structural opacity'—that modern harm is so diffuse no one sees the causal link to their actions. But isn't there a risk here? By shifting from 'no one sees *me*' to 'I don't see the *harm*,' aren't you changing the problem from moral weakness to epistemic limitation? How does a self-binding commitment fix a knowledge problem?"

  *Follow-up:* She'll likely say the objection assumes we need external visibility to validate the norm. Push back: "If the opacity is structural, doesn't that mean my internal disposition is flying blind? How do I bind myself to a norm when I can't verify if I'm violating it?"

  **2. The Evolutionary Reply**
  "Evolutionary ethicists usually solve Gyges with indirect reciprocity: I behave because reputation tracking ensures others will cooperate with me later. But you claim structural opacity breaks this. Why doesn't evolution just select for better opacity detectors? If reputation tracking is so vital, why wouldn't we evolve to see through the systemic smoke screens rather than adopt internal commitments?"

  *Follow-up:* Expect her to say reputation relies on transparency that opacity hides. Push: "So you're arguing evolution hit a wall? If our biology expects transparency and our systems provide opacity, isn't your 'dispositional transparency' fighting millions of years of hardware?"

  **3. The Psychopath Objection**
  "I want to press you on the 'disposition' itself. What about the agent who genuinely lacks the capacity for this self-binding commitment—say, a psychopath who feels no pull toward normative dispositions? On your view, are they simply exempt from morality, or are they irrational? If it's the latter, isn't that just saying 'morality is for people who like morality'?"

  *Follow-up:* She'll likely argue this objection smuggles in a transparency assumption about motive. Push: "But if the disposition is the gatekeeper, doesn't that make morality exclusive by definition? You're solving the justification problem by restricting the club."

  **4. Internalism vs. Normative Dispositionality**
  "You distinguish your view from motivational internalism, calling it 'normative dispositionality.' Internalists say judging something 'right' motivates you automatically. You seem to say the commitment comes first. But practically, what's the difference? If I have the disposition, I'm motivated. If I don't, I'm not. Isn't this just internalism with extra steps?"

  *Follow-up:* She'll say internalism is about psychological state, dispositionality is about structural commitment. Push: "But if the output is the same behavior, why does the architecture matter? Are you worried that internalism makes morality too fragile if the feeling fades?"

  **5. Falsifiability**
  "Philosophical frameworks often struggle with falsifiability. What kind of evidence would actually convince you that 'dispositional transparency' is wrong? Would it take a psychological study showing people can't maintain commitments without oversight? Or a sociological study showing opaque systems always collapse regardless of individual virtue?"

  *Follow-up:* She'll likely point to systemic collapse or psychological impossibility. Push: "If you point to systemic collapse, aren't you slipping into consequentialism? I thought the commitment was supposed to hold *regardless* of the outcome."

  **6. The Contractualist Counterparty**
  "You call this a form of contractualism. Usually, a contract implies two parties who can agree. But if structural opacity means I can't see the people I'm harming, who am I contracting with? Is it an abstract 'others'? How do I bind myself to someone I cannot conceptualize because the system hides them?"

  *Follow-up:* She'll say the contract is with the *structure* of agency, not specific people. Push: "But doesn't that abstract away the victim? If I'm binding myself to a principle rather than a person, isn't that exactly the kind of detachment that allows structural harm to continue?"

  **7. Psychological Feasibility**
  "Let's talk about the cognitive load. Maintaining a self-binding commitment in the face of structural opacity sounds exhausting. Most people use heuristics or follow rules because they're told to. Are you asking every moral agent to become a philosopher-monitor of their own causal impact? Is this view actually livable for anyone without a degree in ethics?"

  *Follow-up:* She'll argue objections assume transparency of effort is needed. Push: "But if the effort is invisible and the results are opaque, what sustains the habit? Isn't burnout a rational response to your framework?"

  **8. Individual vs. Systemic Change**
  "If the problem is structural opacity, why is the solution individual disposition? Isn't this letting the systems off the hook? If I maintain perfect dispositional transparency but work within a corrupt system, haven't I just become a virtuous cog in a machine that still produces harm?"

  *Follow-up:* She'll say changing the system requires agents who don't rely on the system for validation. Push: "Sure, but doesn't that prioritize the moral purity of the agent over the actual reduction of harm? Isn't that a luxury we can't afford?"

  **9. Transparency vs. Surveillance**
  "The term 'transparency' usually implies surveillance—someone watching. You're using it to mean internal consistency. Aren't you co-opting a political term for a psychological state? Does this risk depoliticizing transparency? If we focus on my internal disposition, do we stop demanding external accountability?"

  *Follow-up:* She'll say her view rejects the need for external watching. Push: "But in a democracy, don't we need external watching? If everyone is self-binding, who checks the binders?"

  **10. The Cost of Opacity**
  "Finally, is structural opacity always bad? Some privacy advocates argue opacity protects marginalized groups from surveillance capitalism. If we demand 'dispositional transparency,' are we inadvertently arguing for a world where moral agents must assume visibility even when invisibility is a shield? Where do you draw the line between protective opacity and moral evasion?"

  *Follow-up:* She'll likely say her framework distinguishes between hiding harm and hiding identity. Push: "But structurally, those look the same. How does the agent know the difference without the very transparency you say isn't required?"
