  The coin spins on the old dry wood.
  The pot begins with only two.
  Each head doubles what we owe you.
  The math is clean, the line is true.
  I watch the numbers start to climb.
  The curve goes up, the world stops here.

  The second flip extends the debt but hands begin to tremble now.
  Entropy grinds the copper edge and sweat beads on the brow.
  The bank has limits written deep in ledgers made of ink.
  No treasury can hold the sum before the vessels sink.
  I count the years against the growth and find the cutoff soon.
  The curve goes up, the world stops here, though math demands it continue.

  The series stretches out beyond the life of any man who sits to watch the coin descend and still the value climbs without a bound.
  But entropy will cool the stars before the final tail appears to end the game and dissolve the table into the cold dark dust.
  I spent thirty years counting birds and knew that the population always hits the hard wall of carrying capacity limit.
  The infinite expected value is a ghost that haunts the physical reality where flesh and bone and time itself ends now.
  We stand between abstract sum and where experiment must finally cease due to strict limits of the known real physical hard world.
  The curve goes up, the world stops here, though math demands it continue on and on past heat death of stars and silence of the cold dark void.

  The series climbs beyond the starry dome.
  The hand stays here, within the finite room.
