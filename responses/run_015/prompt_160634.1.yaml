answer: |-
  Here is a reconstruction of your supervisor's implicit criteria, derived strictly from the track record you provided, followed by a prediction for the employment-agency proposal and a proposal for a crucial test case.

  ### I. Three Candidate Rules Consistent with the Track Record

  Your supervisor's verdicts are consistent with three distinct interpretations of Deweyan experimentalism. They align on the past five cases but diverge on the employment-agency proposal.

  **Rule 1: The Continuity of Inquiry (Procedural)**
  *   **Definition:** A policy is experimental if consequences are systematically observed, fed back into the practice, made public, and *no point is declared where inquiry is finished*.
  *   **Logic:** This rule focuses on the *temporal structure* of the policy. It excludes the Tax Initiative (permanent correction), Zoning (settled matter), and Health Dept (closed for a decade). It includes the School District (reopened question) and Housing Authority (revising repeatedly).
  *   **Prediction for Target Case:** **Experimental.** The algorithm updates weekly, logs everything, and the dashboard is public. While the *statute* sunsets in five years, the *allocation* is in continuous flux. Unlike the Health Dept's "decade" closure, this system is technically never "settled" until the statute expires.

  **Rule 2: The Constitution of the Public (Participatory)**
  *   **Definition:** A policy is experimental only if the people affected are parties to *fixing the problem* and *reading the results*, not merely subjects of measurement.
  *   **Logic:** This rule focuses on *agency*. It excludes the Health Dept (no patient involvement in framing), Tax Initiative (campaign-driven), and Zoning (town halls treated as settled input). It includes the School District (teachers/parents argued about the problem) and Housing Authority (tenant union testimony drives revision).
  *   **Prediction for Target Case:** **Not Experimental.** Claimants are not told they are in an allocation; no claimant body was consulted; the advocacy group has access but no formal role. The "inquiry" is conducted *on* them, not *with* them.

  **Rule 3: The Fluidity of Ends (Teleological)**
  *   **Definition:** A policy is experimental only if the *end* (the goal/criterion of success) is held revisable. Optimizing means toward a fixed end is engineering, not inquiry.
  *   **Logic:** This rule focuses on the *object* of the inquiry. It excludes the Health Dept (attendance target never questioned), Tax Initiative (bias correction), and Zoning (ordinance settled). It includes the School District (reopened "what reading well consists in") and Housing Authority (redefined "what would count as working").
  *   **Prediction for Target Case:** **Not Experimental.** The six-month employment target is written into statute; the agency explicitly disclaims authority to reconsider it. The algorithm optimizes *means* (allocation) toward a *fixed end* (employment rate).

  ### II. Best Guess at Her Verdict

  **Verdict:** **Not Experimental.**

  **Reasoning:**
  I predict she will reject the proposal, and she will do so primarily on the grounds of **Rule 2 (Participation)**, reinforced by **Rule 3 (Ends)**.

  The **Health Department case** is the dominant precedent here. Like the Health Dept, the employment agency is using data to optimize service delivery (means) toward a fixed metric (ends) while excluding the recipients from the framing of the problem. The fact that the employment agency uses a "learning algorithm" rather than a one-off RCT will not save it; your supervisor's "warm" endorsement of the Housing Authority (which used *no* formal measurement, only minuted testimony) signals that she does not equate "data" or "feedback loops" with "inquiry."

  For her, "inquiry" is a social process, not a cybernetic one. The algorithm "learns," but the public does not "inquire." The dashboard provides transparency, but not *participation*. The sunset clause provides a legislative review, but not *continuous common inquiry*.

  **The Key Precedent:** The **Housing Authority** case is doing the most work. It proves that formal measurement is unnecessary (ruling out Rule 1 as sufficient) and that qualitative testimony from affected parties is sufficient *if* it drives the revision of ends. The employment agency has the measurement but lacks the testimony and the revisable ends.

  **Consistency Check:**
  Is she inconsistent? **No.** The track record is remarkably stable.
  *   **The Outlier Test:** One might suspect the **School District** case is the outlier because it involved quantitative matching (like the Health Dept). However, the distinction holds: the School District *reopened the definition of the end* ("what reading well consists in"), whereas the Health Dept *closed the question*. The supervisor is consistent on the **Fluidity of Ends**.
  *   **The "Evidence-Based Policy" Allergy:** This confirms the reading. "Evidence-based policy" typically implies Rule 1 (feedback) without Rule 2 or 3 (fixed ends, expert-driven). Her allergy suggests she views "evidence-based policy" as technocratic optimization, which she distinguishes sharply from Deweyan experimentalism.

  ### III. The Crucial Case

  To force the surviving readings apart (specifically to determine if she prioritizes Participation over Ends-Revisability, or if she sees them as inseparable), you should present her with the following case:

  **The "Internal Revision" Case:**
  > A welfare agency operates a job-training program with a fixed statutory goal (employment at 6 months). However, the agency has internal discretion to *redefine the metric* of employment (e.g., shifting from "any employment" to "living-wage employment") based on internal data reviews. They publish these shifts and their rationales. However, **no claimant body is consulted** on these redefinitions; the revision is done entirely by agency economists.

  **What she would have to say to confirm each reading:**

  1.  **If she says "Experimental":** She is committed to **Rule 3 (Fluidity of Ends)** as the primary criterion. She believes inquiry is primarily about epistemic fallibilism regarding goals, even if conducted by experts. This would weaken the "democracy as common inquiry" thesis in favor of a "pragmatism as intelligent administration" thesis.
  2.  **If she says "Not Experimental":** She is committed to **Rule 2 (Participation)** as definitional. She believes that *who* revises the end matters more than *that* the end is revised. This confirms that for her, "experimentalism" is synonymous with "democracy" (inquiry *in common*), not just "smart policy."

  ### IV. Principles at Stake

  If her precedents leave the new case open (which they technically do, as Rule 1 supports "Experimental" while Rules 2 and 3 support "Not"), here is what she commits to with each answer:

  *   **If she rules "Experimental":** She commits to the principle that **systematic feedback is sufficient for democracy.** She concedes that a machine can conduct inquiry on behalf of a public, provided the results are public. This risks collapsing Dewey's distinction between *technical control* and *democratic association*. It validates the "evidence-based policy" framework she claims to dislike.
  *   **If she rules "Not Experimental":** She commits to the principle that **inquiry is constitutively democratic.** She asserts that a process cannot be "experimental" in the Deweyan sense if it treats human beings as objects to be allocated rather than agents to be consulted. This preserves the robustness of the term but risks making "experimentalism" so demanding (requiring stakeholder consensus on ends) that it becomes politically fragile.

  **Recommendation:** Given her "warm" reception of the Housing Authority (tenants redefining success) and her rejection of the Health Dept (experts fixing success), she is almost certainly prepared to make the second commitment. She views the employment agency's proposal not as experimentalism, but as **behavioral nudging with a dashboard.** It is administration, not inquiry.
