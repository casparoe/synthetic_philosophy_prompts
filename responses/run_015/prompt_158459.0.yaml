answer: |-
  ### Brainstorming Conceptual Distinctions

  Before formulating the principles, I need to isolate the variables shifting your verdicts across these six cases.

  *   **Individual vs. Institutional Agency:** Cases 1, 3, and 5 involve individual career choices. Cases 2, 4, and 6 involve institutional policies. Your verdicts suggest individuals have more liberty to specialize (e.g., in quantifiable metrics) than institutions do. Institutions seem to have a duty to preserve ecosystem diversity.
  *   **Complicity vs. Consequence:** Case 1 and Case 5 both involve high-income careers offset by donations. The divergence implies that consequences (net good) are not the only metric; the *nature of the activity itself* matters. Case 5 suggests a deontological constraint against complicity in structural harm that cannot be washed away by consequentialist offsetting.
  *   **Voluntary vs. Coercive Quantification:** In Case 1, the individual *chooses* to support quantifiable charities. In Cases 2 and 4, institutions *mandate* quantification, crowding out other goods. The moral weight lies in whether the metric regime is chosen or imposed.
  *   **Threshold of Harm:** Finance (Case 1) is treated as permissible, while fossil fuels (Case 5) are not. This implies a threshold distinction between careers that are neutral/abstractly extractive versus those that are physically destructive or existentially risky.
  *   **Epistemic Humility:** Cases 2, 4, and 6 valorize the acknowledgment of uncertainty and the value of unquantifiable goods (trust, literacy). Case 1 relies on certainty (RCTs). The principle must reconcile valuing certainty for oneself while respecting uncertainty for others.

  ***

  ### 1. The Proposed Principles

  Your verdicts are best captured by a family of two complementary principles. I will call them **The Integrity Constraint** and **The Principle of Epistemic Pluralism**.

  **Principle A: The Integrity Constraint**
  *   **Clause:** An agent cannot claim moral credit for offsetting good deeds if their primary means of income involves direct complicity in structurally harmful or destructive industries.
  *   **Motivation:** This is motivated by **Case 5** (fossil fuels) versus **Case 1** (finance). It establishes that some careers are morally "tainted" regardless of donation ratios.
  *   **Verdicts:**
      *   Case 1: Passes (Finance is treated as below the harm threshold). Verdict: Admirable.
      *   Case 3: Passes (Direct charity work). Verdict: Admirable.
      *   Case 5: Fails (Fossil fuels are structurally harmful). Verdict: Not okay/Corrupt.

  **Principle B: The Principle of Epistemic Pluralism**
  *   **Clause:** Individuals are permitted to prioritize rigorously quantifiable impact in their personal choices, but institutions wielding power over a field must not enforce metric monocultures that exclude hard-to-quantify goods.
  *   **Motivation:** This is motivated by **Case 1** (individual choice of metrics) versus **Cases 2, 4, and 6** (institutional mandates or refusals). It distinguishes between personal specialization and institutional tyranny.
  *   **Verdicts:**
      *   Case 1: Passes (Individual donor choosing rigor). Verdict: Admirable.
      *   Case 2: Fails (Nonprofit abandoning diffuse goods for metrics). Verdict: Damaging.
      *   Case 4: Fails (Foundation mandating metrics). Verdict: Harmful.
      *   Case 6: Passes (Organization refusing metrics to protect social trust). Verdict: Defensible.

  ***

  ### 2. Tensions and Limitations

  While this family of principles captures your verdicts, there are two significant tensions where the principles strain against each other or rely on contested empirical judgments.

  **The Case 1 vs. Case 5 Tension (The Harm Threshold)**
  The Integrity Constraint relies on a distinction between "finance" and "fossil fuels." Philosophically, this is the weakest link. Both industries can be argued to cause structural harm (finance via extraction/inequality, fossil fuels via climate change). Your verdict implies a *threshold* of harm—perhaps immediacy or existential risk—rather than a binary of harm/no-harm.
  *   *Honest Admission:* The principle cannot objectively define where this threshold lies without relying on your specific intuition that finance is "neutral enough" while fossil fuels are not. If a critic argues that quantitative finance accelerates inequality just as fossil fuels accelerate warming, Principle A collapses. It accommodates your verdict only by accepting your empirical classification of industries as a premise.

  **The Case 1 vs. Case 2/4 Tension (Metric Spillover)**
  The Principle of Epistemic Pluralism allows individuals to fund only quantifiable charities (Case 1) but forbids institutions from demanding quantification (Case 2, 4). The tension here is *systemic*. If enough individuals act according to Case 1, they create the market pressure that forces the institutional distortions in Case 2 and 4.
  *   *Honest Admission:* The principles treat individual and institutional agency as separate silos. They do not account for the feedback loop where individual "earning-to-give" preferences create the very donor demands that distort nonprofits. To fully resolve this, one would need to argue that individuals have a duty to diversify their giving to protect the epistemic ecosystem, which would contradict your verdict in Case 1 that specializing in quantifiable charity is "clearly good."

  ***

  ### 3. Prediction: The Software Engineer Case

  **Case:** A software engineer builds ethically ambiguous recommendation algorithms, donates 40% to a mix of quantifiable global health and unquantifiable local advocacy, and chooses this over a lower-paying nonprofit job.

  **Prediction using Principle A (Integrity):**
  The career involves "ethically ambiguous but not obviously catastrophic" work. This differs from Case 5 (fossil fuels), which is structurally destructive. Unless the algorithms are deemed to cross the harm threshold (e.g., radicalization engines), this passes the Integrity Constraint.
  *   *Prediction:* Admirable (or at least permissible).

  **Prediction using Principle B (Epistemic Pluralism):**
  The engineer is an individual choosing a mix of quantifiable and unquantifiable causes. This is a voluntary allocation, not an institutional mandate. This aligns perfectly with the liberty granted in Case 1 and respected in Case 6.
  *   *Prediction:* Admirable.

  **Overall Verdict:**
  I predict you would find this **admirable**, likely viewing it as a sophisticated synthesis of Case 1 and Case 6. The mix of giving addresses the "metric monoculture" worry internally, and the career is sufficiently distant from the "corrupt" label of Case 5.

  ***

  ### 4. Distinguishing Hypothetical Case

  To distinguish between the **Integrity Constraint** (which focuses on the source of income) and a stricter **Consequentialist Principle** (which focuses only on net outcomes), consider the following case:

  **The "Tobacco Lawyer" Case:**
  A brilliant lawyer works for a major tobacco company, successfully defending them against lawsuits which allows the company to continue selling products that cause known health harms. She earns a very high salary and donates 60% of her income to malaria bed nets, saving statistically more lives than her work harms.

  *   **Why this distinguishes the principles:**
      *   A pure **Consequentialist** view (maximize net lives saved) must endorse this career. The math works.
      *   Your **Integrity Constraint** (based on Case 5) suggests this should be condemned as "corrupt" because the work involves direct complicity in selling a harmful product, regardless of the offset.
      *   However, if you find this case *admirable* (because the net saving of lives is so clear), it would suggest your verdict on Case 5 was actually about *uncertainty* (climate harm is probabilistic/collective) rather than *complicity*. If you find it *corrupt*, it confirms the Integrity Constraint is based on the nature of the act, not just the net outcome.

  This case forces a choice between the "clean hands" intuition driving Case 5 and the "net good" intuition driving Case 1.
