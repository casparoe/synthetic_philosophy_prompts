      *   *Wait, one more check on (iii) vs (ii).* (ii) says "Expanding-circle picture is the right shape." (iii) says "scope is not where the important change happened." This is a direct contradiction. (ii) says Shape = Scope. (iii) says Shape != Scope. This might be more severe than (ii)/(vi) because it's internal inconsistency in the description of the phenomenon.
