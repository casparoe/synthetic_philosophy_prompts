      *   *Wait, a better candidate:* Revise (vi). If you admit philosophy/norms have causal power, you save (ii), you strengthen (i), you make (vii) make more sense. But (vi) seems deeply held ("mostly a by-product").
      *   *Let's look at (ii) again.* "The engine... is impartial reasoning." (vi) says "philosophers have mostly supplied after-the-fact rationalisations." These are mutually exclusive.
      *   *Decision:* The most efficient cut is to soften (ii). Make reasoning the *medium* not the *motor*. This aligns with (vi), preserves (i) (progress still happened), preserves (iii) (content changed), preserves (vii) (future generations is still evidence, just not caused *by* philosophy alone).
      *   *Wait, what about (viii)?* (viii) is the "worry I cannot place." It likely points to the limitation of the "Expanding Circle" metaphor itself.

  7.  **Drafting the Audit:**

      *   **Introduction:** Acknowledge the sophistication of the position.
      *   **Tension 1 (Critical): (ii) vs. (vi).** The Causal Contradiction. Reason as Engine vs. Reason as Epiphenomenon.
      *   **Tension 2 (Structural): (ii) vs. (iii).** The Definitional Contradiction. Scope vs. Depth.
