      *   (iv) **Institutional vs. Individual:** Progress is in norms/institutions, not individual virtue (people aren't better).
      *   (v) **Future Blindness:** Future people will see our blind spots as atrocities. This doesn't undermine (i).
      *   (vi) **Materialist Explanation:** Progress is a by-product of material/institutional changes (literacy, commerce, etc.); philosophy rationalizes *ex post*.
      *   (vii) **Future Generations:** Best evidence is concern for non-existent people (duties to future generations).
      *   (viii) **Dilution Worry:** As scope widens, concern per individual thins. Is this progress?

  3.  **Identify Tensions (Brainstorming & Pairing):**

      *   *(i) & (v):* If progress is real (i), how can we be so blind (v)? *Resolution:* Fallibilism. Compatible.
      *   *(i) & (vi):* If progress is real moral improvement (i), but driven by material forces with philosophy just rationalizing (vi), is it *moral* progress or just functional adaptation? *Tension:* Moral realism vs. Sociological functionalism.
      *   *(ii) & (vi):* (ii) says impartial reasoning is the *engine*. (vi) says material change is the *engine* and reasoning is *rationalization*. *Major Tension:* Causal mechanism conflict.
      *   *(ii) & (iii):* (ii) says scope is the shape. (iii) says scope isn't the important change, *concept of harm* is. *Moderate Tension:* Definitional conflict on what constitutes the progress.
