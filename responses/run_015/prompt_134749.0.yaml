  **Verdict:** You are more wrong about the **implications of the physics**. The conservation law is a moral showstopper that your 0.7 ignores. Your flatmate is more wrong about the **implications of the phenomenology**, but their skepticism leads them to a number closer to the tractability-adjusted reality.

