  *   **You (0.7)** are likely overweighting **Aggregation/Scale** and underweighting **Conservation**. You see the astronomical number of micro-subjects and conclude the moral weight must be astronomical. You are implicitly assuming that "working on" micro-valence means *reducing* it, effectively ignoring the constraint that the total charge is fixed. You are treating it as a standard suffering reduction problem.
