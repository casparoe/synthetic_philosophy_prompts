  **Most Sensitive Term:** **Tractability under Conservation.**
  If you can show me that "redistribution" allows for a net moral gain comparable to "elimination" (e.g., concentrating negative charge into subjects that can neutralize it, or dumping it into regions causally disconnected from value-generating systems), my credence jumps to >0.6. If conservation strictly implies the total moral badness of the universe is a fixed constant forever, my credence drops to <0.1 (why prioritize an unsolvable problem?).

  **Secondary Sensitivity:** **Linearity of Scale.**
  If you convince me that intensity is lexical (a human scream > any number of electron twinges), my credence drops to near 0, regardless of the numbers.

  ***

