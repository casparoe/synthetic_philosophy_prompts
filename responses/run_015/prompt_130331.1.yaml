      *Revised Plan:* Direct address to the demonstrators.

      *Key tension:* The later Tolstoy (Christian anarchist) vs. the *War and Peace* theorist. The prompt mentions "later Tolstoy demands that we condemn." I need to blend the metaphysical determinism of W&P with the moral urgency of his later years.

      *Final Polish:* Ensure the ending lands hard on the "bad place" constraint. He accepts the machine clears everyone of historical guilt, leaving him alone with the burden of moral judgment in a deterministic universe.

