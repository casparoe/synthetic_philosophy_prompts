prompt: |-
  I chair the collections committee of a mid-sized city museum — roughly 120,000 objects, of which perhaps 4,000 fall within the periods and regions that restitution claims concern. We receive four to six inquiries or claims a year. Our capacity is two registrars, a shared conservator, and no in-house lawyer; outside legal advice is billed by the hour and the board resents paying for it. Triage has to happen within a week of an inquiry arriving, and any recommendation to return has to reach the board's collections subcommittee, which meets quarterly, as a file a non-specialist trustee can read in twenty minutes.

  Please write me a decision procedure my committee can actually run: the questions in the order we should ask them, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the point at which it hands the decision to a person because the question is one of values rather than facts. Build it on the following positions, which the committee has argued itself into over the last two years and which I want the procedure to honour rather than reopen:

  a) The anti-washing rule: a later good-faith purchase does not cure an originally tainted taking while the dispossession is still live — that is, within the living memory of the community concerned, or before a genuine change in the political relation between that community and the power that took the object. Work out how "live" is to be determined on our records, and what to do when the record is silent.
  b) Burden of proof: for anything acquired under a colonial administration with an incomplete chain, the gap counts against us rather than against the claimant. Silence in our own documentation is evidence, not neutrality.
  c) Authorisation by an occupying or imperial power does not by itself make a removal legitimate — but tell me what work, if any, a surviving document of permission can still do in the procedure.
  d) Capacity: where the receiving institution's storage or conservation weaknesses are traceable to the same historical relation as the taking, they cannot be made a condition of return. Remediation is something we fund, not something we require. Where the weaknesses are not so traceable, decide whether and how much they may count.
  e) Display value: any argument from what the object teaches in our galleries has to survive a surrogate test — could we teach the same thing with a replica, a digital surrogate, or the documentation together with the story of the object's removal? Decide what passes and what fails, and say who judges.
  f) Role reversal: any condition we attach to a return must be one we would accept if the roles were reversed.
  g) Claimants: continuity of grievance matters more than formal state locus. A body that has carried the claim forward and is recognised by the community should count even without state backing. Tell me what to do when two such bodies claim the same object, and what to do when a state claims without them.
  h) Sets and parts: a "set" is our curatorial category more often than theirs. Say when a group may be divided and when it may not, and whether we may retain a token piece.

  At every fork where reasonable people could go either way, commit to one branch and give your reason. I do not want a menu of options with their trade-offs; I want a procedure with your choices baked in, each with a one-line note saying that a reasonable committee could have gone the other way and why you went yours. Where a step is irreducibly a value judgement, mark it as a place where the procedure stops and a person signs off, and say which person.

  Then run it on three live files:

  1. A Benin-type brass plaque bequeathed to us in 1938 by the family of a colonial officer, with a documented chain going back to the British punitive expedition that sacked Benin City in the 1890s. The claim comes from Nigeria's federal antiquities authority and from the court of the Oba. Tell me what paperwork is sufficient, what timing the procedure implies, and — this is the part the board will fight about — which conditions we may *not* attach. They will want a long-term loan back, a shared rotating display, and a delay until our digitisation project finishes. Say which of these the procedure blocks and why.
  2. A fragment of sculpture from the Parthenon, bought at auction in 1921 from a private collection, with a chain going back to the early nineteenth century but not to Elgin himself. The claim comes from the Greek state. The committee is split on whether the gap in our chain is our problem under (b), and on how much the permission documents from the imperial authority then in place are worth under (c). Commit. Also say how an architectural-reunification argument should be weighed against an encyclopedic-display argument at the display-value step.
  3. The one where I expect to dislike the answer. A carved figure bought from a dealer in 1961, whose file shows it was carved in the 1920s and sold by its maker, with nothing in the record connecting it to any taking; the claim comes from a national heritage body on the argument that all such material belongs to the national patrimony. My instinct is that refusing feels wrong and will read as special pleading. Tell me honestly whether the procedure returns a no here, and if it does, what the committee should say out loud when it says no.

  Finally, be explicit about what the procedure cannot do: where it will misfire, which claims it cannot adjudicate at all, and what we should do with those. We know the general shape of the restitution literature and do not need citations, bibliographies, or reading lists; what we lack is something we can run. Keep it to something my committee can hold to a few pages.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Chair of a Collections Committee at a mid-sized city museum (120k objects, 4k relevant).
      *   **Constraints:** Limited staff (2 registrars, shared conservator, no in-house lawyer), board resists legal costs, tight triage (1 week), board presentation (20-min read, quarterly meetings).
      *   **Task:** Write a concrete decision procedure (flowchart-style logic) based on specific agreed-upon positions (a-h).
      *   **Requirements:**
          *   Order of questions.
          *   Sufficient answers.
          *   Stop points (No).
          *   Hand-off points (Value Judgments).
          *   Commit to choices at forks (no menus), with one-line justification for the choice.
          *   Mark value judgments for specific sign-off.
          *   Run the procedure on three specific case studies.
          *   Explicitly state limitations (what the procedure *can't* do).
          *   Keep it short (few pages).
          *   No citations/bibliographies.

  2.  **Deconstruct the Agreed Positions (a-h):**

      *   (a) *Anti-washing:* Good faith purchase doesn't cure tainted taking if dispossession is "live." Need to define "live."
      *   (b) *Burden of Proof:* Gaps in colonial chains count against the museum. Silence = evidence against us.
      *   (c) *Authorization:* Imperial permission $\neq$ legitimacy. Documents have limited weight.
      *   (d) *Capacity:* Can't use receiver's weakness (if historically linked) as a barrier. We fund remediation. If not linked, weakness counts somewhat.
      *   (e) *Display Value:* Must pass "surrogate test" (replica/digital/story). Curator judges, Committee validates.
      *   (f) *Role Reversal:* Conditions must be reciprocal.
      *   (g) *Claimants:* Continuity of grievance > State locus. Community recognition matters. Handle competing claims.
      *   (h) *Sets/Parts:* Curatorial sets $\neq$ Cultural sets. Retaining tokens generally discouraged.

  3.  **Drafting the Procedure (The "Engine"):**

      *   *Goal:* A linear checklist that filters claims quickly but rigorously.
      *   *Structure:* Triage -> Provenance/Legitimacy -> Claimant Validity -> Practicalities -> Final Decision.
      *   *Tone:* Administrative, decisive, operational.

      *   *Step 1: Triage & Standing (The "Who" and "When").*
          *   Check if object falls within the 4,000 relevant scope.
          *   Check Claimant status (Position g).
          *   *Commitment:* If competing community claims, pause return until resolved between them. If State vs. Community, Community wins unless State is the only vehicle for care. (Choice: Community priority).
          *   *Check "Live" Dispossession (Position a).* Define "Live": < 100 years OR no treaty/settlement. If silent records, assume live.

      *   *Step 2: Provenance & Legitimacy (The "How").*
          *   Check Chain of Title.
          *   *Commitment (Position b):* If colonial era + gap > 10 years, burden shifts to Museum to prove legitimacy. If we can't, presumption is tainted.
          *   *Commitment (Position c):* Imperial permission documents are noted but do not override taint. They only help if signed by the *source* community leadership, not the occupier.

      *   *Step 3: The "No" Filters.*
          *   If provenance is clean (non-colonial, clear gift/sale with no duress) -> No return.
          *   If claimant lacks standing -> No return (but refer).

      *   *Step 4: Value & Capacity (The "But").*
          *   *Display Value (Position e):* Curator proposes surrogate. Committee votes. If surrogate works, return proceeds.
          *   *Capacity (Position d):* If weakness is historical result -> Museum funds fix. If unrelated -> Minor delay allowed, not refusal.
          *   *Conditions (Position f):* Apply "Role Reversal" test. Long-term loan back? (Would we accept that?) Rotating display? (Does it hinder care?)

      *   *Step 5: Sets (Position h).*
          *   If part of a set, return all unless physically impossible. No "token" retention.

      *   *Value Judgment Hand-offs:*
          *   Defining "Community Recognition" (g).
          *   Surrogate Sufficiency (e).
          *   Funding Cap for Remediation (d).

  4.  **Running the Cases:**

      *   *Case 1 (Benin Brass):*
          *   Provenance: Punitive expedition (1897). Tainted.
          *   Claimant: Federal + Oba. Strong standing (g).
          *   "Live": Yes (Position a).
          *   Conditions: Loan back? (Fails Role Reversal f). Rotation? (Fails Capacity/Care). Delay for digitization? (Fails Priority).
          *   Outcome: Return unconditionally. Fund conservation there.

      *   *Case 2 (Parthenon):*
          *   Provenance: 1921 auction, chain back to early 19th, not Elgin. Gap exists.
          *   Position (b): Colonial admin (Ottoman/British). Gap counts against Museum.
          *   Position (c): Imperial permission (Ottoman) doesn't cure.
          *   Display Value: Encyclopedic vs. Reunification. Surrogate test: Can we teach "Empire" with a cast? Yes.
          *   Outcome: Return recommended. (This is the hard commit).

      *   *Case 3 (1961 Carved Figure):*
          *   Provenance: 1961 purchase, made 1920s, sold by maker. No taking record.
          *   Claim: National Patrimony (State).
          *   Position (b): No colonial gap here. Commercial transaction.
          *   Position (g): State claims without community body.
          *   Outcome: No return.
          *   Messaging: Acknowledge the "vibe" but stick to the rule (transactional integrity vs. confiscatory taking).

  5.  **Refining the Limitations:**

      *   What can't this do? Human remains (needs separate protocol), Sacred/Secret objects (needs restricted access handling), Legal title litigation (if sued, procedure pauses).

  6.  **Review against Constraints:**

      *   *Length:* Keep it tight.
      *   *Tone:* Direct, no waffle.
      *   *Commitments:* Ensure every fork has a chosen path with a one-line rationale.
      *   *Sign-offs:* Identify who signs (Committee Chair, Director, Board).

  7.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Set the scope.
      *   *The Procedure:* Numbered steps.
      *   *The Cases:* Apply the steps.
      *   *Limitations:* Honest assessment.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm giving legal advice. I am writing *committee procedure*.
      *(Refining Position b)*: The prompt says "acquired under a colonial administration." For the Parthenon case, is 1921 "under colonial administration"? The chain goes back to early 19th. Elgin was early 19th. The gap is the issue. I need to be strict on the "gap counts against us" rule.
      *(Refining Position f)*: "Role Reversal." If we wouldn't accept a loan back from Nigeria, they shouldn't get one from us. Actually, the prompt says "any condition we attach... must be one we would accept if roles reversed." So if we demand a loan back, would we accept Nigeria demanding a loan back of something they took from us? (Hypothetical). Better interpretation: If we demand they keep it on display for us, would we accept them demanding we display their loan forever? No. It means: Don't attach strings that restrict their sovereignty over the object.
      *(Refining Case 3)*: The user expects to dislike the answer. The procedure *must* say No based on the rules (no tainted taking evidence), but the *messaging* needs to be careful. The prompt asks: "Tell me honestly whether the procedure returns a no here." I must follow the logic. If the logic says "No tainted taking," then it's a No.

  8.  **Final Polish:** Check word count and formatting. Ensure the "one-line note" requirement is met for every committed choice. Ensure the "Value Judgment" sign-offs are clear.

      *Wait, one detail on Case 2:* The prompt says "bought at auction in 1921... chain going back to early nineteenth century but not to Elgin himself." The gap is between the early 19th century and the 1921 purchase? Or between Elgin and the early 19th? Usually, the gap is between the removal (Elgin ~1800s) and the museum acquisition (1921). If the chain doesn't reach Elgin, there is a gap in the colonial era. Position (b) says gaps count against us. So, Presumption of Taint.
      *Wait, one detail on Case 3:* "Sold by its maker." This implies voluntary sale. Position (a) says "originally tainted taking." If there was no taking, (a) doesn't trigger. So the procedure stops at Provenance.

      *Let's write.*
answer: |-
  # COLLECTIONS COMMITTEE RESTITUTION DECISION PROCEDURE
  **Version 1.0 | Effective Date: [Date] | Owner: Committee Chair**

  ## PURPOSE
  To triage and adjudicate restitution inquiries within one week for staff assessment and quarterly for Board recommendation. This procedure operationalizes the Committee's agreed positions (a–h). It is not legal advice; it is an ethical operating system.

  ## PHASE 1: TRIAGE & STANDING (Week 1)
  *Completed by Registrars with Committee Chair oversight.*

  **1.1 Scope Check**
  *   **Question:** Does the object fall within the 4,000 relevant items (period/region)?
  *   **No:** Close file. Send standard response acknowledging inquiry but noting scope.
  *   **Yes:** Proceed to 1.2.

  **1.2 Claimant Standing (Position g)**
  *   **Question:** Is the claimant a State body, a Community body, or both?
  *   **Rule:** Continuity of grievance > Formal State locus.
  *   **Commitment:** If a Community body recognized by the source population claims the object, they take precedence over a State body claiming solely on national patrimony laws.
      *   *Note: We prioritise the aggrieved party over the administrative successor, though State support aids logistics.*
  *   **Competing Claims:** If two Community bodies claim the same object, pause procedure. Inform parties we will return to the *region* but require them to designate a single receiving custodian.
      *   *Note: We refuse to adjudicate internal community politics; return is paused until resolved.*
  *   **State Only:** If only a State body claims (no community body), proceed but flag for enhanced due diligence on representation.

  **1.3 The "Live" Dispossession Test (Position a)**
  *   **Question:** Is the dispossession "live"?
  *   **Definition:** "Live" = Taking occurred <100 years ago OR no formal treaty/settlement explicitly resolving this specific class of objects exists.
  *   **Silence Rule:** If records are silent on the date or context of taking, assume "Live."
      *   *Note: Ambiguity benefits the dispossessed, not the holder.*
  *   **No (Not Live):** Proceed to Phase 2 (Provenance).
  *   **Yes (Live):** Proceed to Phase 2. (Note: "Good faith purchase" does not cure taint here).

  ## PHASE 2: PROVENANCE & LEGITIMACY (Week 1)
  *Completed by Registrars; Legal review only if litigation is threatened.*

  **2.1 Chain of Title (Position b)**
  *   **Question:** Is there a continuous, documented chain of title from the point of removal to acquisition?
  *   **Rule:** For objects acquired under colonial administration (or during conflict/occupation), gaps >10 years count against the Museum.
  *   **Commitment:** If the chain is broken during the colonial period, the burden shifts to the Museum to prove legitimacy. If we cannot, presumption = Tainted.
      *   *Note: Our documentation failures are not the claimant's burden to fix.*
  *   **Clean Chain:** If chain is complete and shows voluntary sale/gift with no duress -> **STOP. Recommendation: No Return.**
  *   **Tainted/Presumed Tainted:** Proceed to 2.2.

  **2.2 Authority & Permission (Position c)**
  *   **Question:** Does the file contain permission documents from an occupying/imperial power?
  *   **Rule:** Imperial permission $\neq$ Legitimacy.
  *   **Commitment:** Such documents are recorded as historical context but carry zero weight in validating the transfer. Only permission from the *source community's* leadership at the time counts.
      *   *Note: An occupier cannot gift what they do not morally own.*
  *   **Result:** If only imperial permission exists, treat as Tainted. Proceed to Phase 3.

  ## PHASE 3: PRACTICALITIES & CONDITIONS (Quarterly Board Pack)
  *Completed by Committee. Value Judgments marked [VJ].*

  **3.1 The Surrogate Test (Position e)**
  *   **Question:** Does retaining the object serve an essential educational function that cannot be met by a surrogate?
  *   **Test:** Could a replica, digital surrogate, or the story of removal teach the same lesson?
  *   **Commitment:** If the lesson is "Artistic Achievement" or "Cultural Practice," a surrogate suffices. If the lesson is "Material Evidence of a Crime," the original is required *by the claimant*, not us.
      *   *Note: We do not retain evidence of harm to teach about harm.*
  *   **Judgement:** [VJ] Curator proposes surrogate plan. Committee Chair signs off on sufficiency.
  *   **Fail:** Proceed to Return Recommendation.
  *   **Pass:** Retain (Rare).

  **3.2 Capacity & Care (Position d)**
  *   **Question:** Does the receiving institution have conservation/storage weaknesses?
  *   **Test:** Are these weaknesses traceable to the same historical relation (underfunding/colonial legacy)?
  *   **Commitment:** If traceable to history, Museum funds remediation. It is not a condition of return.
      *   *Note: We do not penalise the victim for the perpetrator's long-term underfunding.*
  *   **Unrelated Weakness:** If unrelated (e.g., general mismanagement), a short delay (max 12 months) is permitted for stabilization.
      *   *Note: We ensure safety but do not weaponize standards.*
  *   **Judgement:** [VJ] Shared Conservator assesses cost. Committee Chair approves budget cap.

  **3.3 Conditions & Role Reversal (Position f)**
  *   **Question:** What conditions are attached to the return?
  *   **Test:** Would we accept this condition if the roles were reversed?
  *   **Commitment:**
      *   **Long-term Loan Back:** **BLOCKED.** (We would not accept a demand to keep their object on loan forever).
      *   **Rotating Display:** **BLOCKED.** (Imposes curatorial burden and restricts their sovereignty).
      *   **Delay for Digitization:** **BLOCKED.** (Our project timeline does not supersede their right of possession).
      *   **Permitted:** Joint press release, co-authored label text for the *story* of return.
      *   *Note: Conditions must not restrict the recipient's sovereignty over the object.*

  **3.4 Sets and Parts (Position h)**
  *   **Question:** Is the object part of a set?
  *   **Commitment:** Return the whole set as defined by the *source culture*, not our curatorial catalog. Retaining a "token" piece is prohibited.
      *   *Note: Wholeness is a cultural right, not a curatorial preference.*
  *   **Exception:** Only if physical division is impossible without destruction (e.g., fixed architectural element), in which case return the fragment we hold.

  ## PHASE 4: FINAL SIGN-OFF
  *   **Recommendation:** Return / Retain / Pause.
  *   **Sign-off:** Committee Chair (Fact/Procedure) + Museum Director (Value/Risk).
  *   **Board:** Collections Subcommittee receives the 20-minute file.

  ***

  # CASE RUNS

  ## CASE 1: Benin-Type Brass Plaque (1938 Bequest, 1897 Sack)
  **Run:**
  1.  **Standing:** Federal Antiquities + Oba's Court. Both valid. Community + State alignment simplifies (1.2).
  2.  **Live:** 1897 is <100 years ago (at time of claim logic) and no treaty settled this. Dispossession Live (1.3).
  3.  **Provenance:** Chain goes to Punitive Expedition. Tainted. No gap needed to prove taint here, but gap would count against us anyway (2.1).
  4.  **Permission:** British Military authority permission (if any) is void under 2.2.
  5.  **Surrogate:** Plaque teaches history/art. Replica + Story of Sack suffices (3.1).
  6.  **Capacity:** If Nigeria has storage issues, they stem from colonial extraction legacy. Museum funds remediation (3.2).
  7.  **Conditions:**
      *   *Long-term loan back:* **BLOCKED** (Fails Role Reversal 3.3).
      *   *Rotating display:* **BLOCKED** (Fails Role Reversal 3.3).
      *   *Delay for digitization:* **BLOCKED** (Our timeline $\neq$ their right).
  **Outcome:** **Recommend Unconditional Return.** Museum funds packing/transport and contributes to conservation storage upgrade in Benin.
  **Board Fight:** The Board will lose on conditions. The procedure explicitly forbids them.

  ## CASE 2: Parthenon Fragment (1921 Auction, Early 19th Chain)
  **Run:**
  1.  **Standing:** Greek State. No competing community body noted. Proceed (1.2).
  2.  **Live:** Early 19th Century removal. Is it "Live"? No treaty settled the *objects* specifically until recent decades. Treat as Live for procedure safety (1.3).
  3.  **Provenance:** Chain back to early 19th, *not* to Elgin. There is a gap in the colonial era.
      *   **Commitment:** Under 2.1, the gap counts against us. We cannot prove legitimacy. Presumption = Tainted.
  4.  **Permission:** Ottoman permission exists (Imperial). Under 2.2, this carries zero weight.
  5.  **Surrogate:** Argument is "Encyclopedic Display" vs. "Reunification."
      *   **Commitment:** Can we teach "British Empire/Collecting History" with a cast? Yes. Does the fragment teach "Greek Culture" better in Athens? Yes. Surrogate test passed for return (3.1).
  6.  **Capacity:** Greek National Archaeological Museum is capable. No barrier (3.2).
  7.  **Conditions:** No conditions permitted under 3.3.
  **Outcome:** **Recommend Return.**
  **Committee Split:** The procedure forces a "Return" recommendation because the burden of proof (b) and the value of imperial permission (c) are pre-decided. The "Encyclopedic" argument fails the Surrogate Test (e).

  ## CASE 3: Carved Figure (1961 Purchase, 1920s Maker Sale)
  **Run:**
  1.  **Standing:** National Heritage Body (State). No community body. Flag for due diligence (1.2).
  2.  **Provenance:** File shows sale by *maker* in 1920s. Purchase by Museum 1961.
      *   **Question:** Is there a "tainted taking"?
      *   **Finding:** Record shows voluntary sale by creator. No colonial confiscation, no gap in chain suggesting theft.
  3.  **Burden:** Under 2.1, burden shifts only if "acquired under colonial administration with incomplete chain." Here, chain is complete and shows commercial transaction.
  4.  **Live:** Even if "Live," the *taking* was not tainted. Position (a) applies to "originally tainted taking."
  **Outcome:** **Recommend No Return.**
  **The "Dislike" Factor:** You are correct to feel uneasy. This is the "Patrimony Law" trap.
  **What to Say Out Loud:** "Our procedure addresses *wrongful taking*, not *national ownership laws*. We return stolen property. We do not enforce foreign export statutes on historical private sales. To do so would destabilize all museum holdings globally. We acknowledge the moral desire for repatriation, but without evidence of dispossession, we cannot trigger the restitution mechanism."
  **Note:** This is the safety valve. If you return this, you open the door to claims on every object sold legally in the 20th century.

  ***

  # LIMITATIONS & FAILURE MODES
  *Be explicit with the Board: This procedure is a tool, not a shield.*

  1.  **Human Remains:** This procedure **does not apply**. Human remains require immediate, separate protocol based on dignity, not provenance.
  2.  **Sacred/Secret Objects:** If an object is revealed to be sacred/secret during the process, the procedure pauses. Access restrictions take precedence over display value (e).
  3.  **Litigation:** If a claimant threatens suit, the procedure stops. Legal counsel takes over. This procedure is for *voluntary* restitution.
  4.  **The "Hard No" Zone:** This procedure cannot adjudicate claims where the "taking" was a legal tax, inheritance, or debt settlement under local law at the time, even if that legal system was unjust. It targets *confiscation, looting, and duress*.
  5.  **Resource Cap:** If the cost of remediation (d) exceeds 15% of the annual acquisitions budget, the Committee Chair must escalate to the full Board for a budget override. We cannot bankrupt the museum to fix history, though we must try.

  **Sign-Off:**
  *Committee Chair:* ___________________ Date: __________
  *Museum Director:* ___________________ Date: __________
