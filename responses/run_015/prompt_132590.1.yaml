answer: |-
  Your skepticism is well-founded. Your colleague has constructed an elegant model, but in doing so, he has conflated empirical descriptions of psychological mechanisms with normative claims about moral truth. As a physicist, you will recognize this as a category error akin to deriving the *laws* of thermodynamics solely from the *behavior* of a specific gas, without accounting for the boundary conditions or the nature of the measurement apparatus itself.

  Here is an audit of the reasoning, separated into empirical accuracy, measurement theory (the calibration metaphor), and metaethical validity.

  ### 1. Empirical Accuracy: The WEIRD Literature
  Your colleague's summary of the psychological literature is broadly consistent with the dominant narrative of Moral Foundations Theory (MFT), but it smooths over significant empirical friction.

  *   **The WEIRD Profile:** It is accurate that MFT posits Western populations rely heavily on "Individualizing Foundations" (Harm/Care and Fairness/Cheating), while non-WEIRD populations utilize these plus "Binding Foundations" (Loyalty, Authority, Sanctity).
  *   **The Stability of Harm:** This is the weak link. Your colleague claims judgments about direct physical harm are an "objective core" because they are stable across populations. Empirically, this is contested. Cross-cultural research shows that what counts as "harm" is itself culturally constructed. In some societies, violating a taboo (Sanctity) *is* perceived as causing direct physical or spiritual harm to the community. If a culture believes a specific food violation causes sickness, their condemnation is driven by a harm-avoidance mechanism, not a distinct "purity" module.
  *   **The Verdict:** The descriptive claim that moral *weights* vary is supported. The claim that there is a culture-invariant "harm core" is an oversimplification of the data. The variance is not just in the *weighting* of foundations, but often in the *perception* of the facts (i.e., whether an act constitutes harm).

  ### 2. The Calibration Metaphor: Measurement Theory
  The "Normative Calibration" metaphor is the most sophisticated part of your colleague's argument, but it is a philosophical posit, not an empirical finding. It smuggles in a assumption of commensurability.

  *   **Shared Metric Assumption:** The metaphor assumes all human societies are measuring the same quantity ("Morality") using the same instrument, merely calibrated to different zero-points. In physics terms, he assumes everyone is measuring temperature, but some use Celsius and others Fahrenheit.
  *   **Incommensurability:** It is equally plausible that different societies are measuring *different quantities*. A WEIRD subject might be measuring "Individual Rights Violation," while a non-WEIRD subject measures "Social Cohesion Disruption." If the underlying quantities differ, no linear calibration can map one onto the other. The data shows correlation in responses, but it does not prove a shared underlying metric.
  *   **The Verdict:** The calibration framework is a useful *heuristic*, but presenting it as a description of the cognitive architecture is unjustified. It assumes a universal moral ontology that the data does not necessitate.

  ### 3. Metaethical Inference: From Stability to Objectivity
  This is where the reasoning fails most critically. Your colleague attempts to bridge the Is-Ought gap by asserting that descriptive stability *constitutes* normative objectivity.

  *   **Universality $\neq$ Objectivity:** Even if we grant that 100% of humans condemn unprovoked physical violence, this establishes *psychological universality*, not *moral objectivity*.
      *   *Analogy:* Humans universally perceive the sky as blue (under standard conditions). This does not make "blueness" an objective property of the sky independent of observers; it is a feature of our visual processing.
      *   *Application:* Similarly, universal condemnation of harm could be a feature of our evolutionary processing (e.g., pain-aversion mechanisms) rather than evidence of mind-independent moral truths.
  *   **The Is-Ought Gap:** Your colleague suggests philosophers ignore this gap to avoid empirical engagement. This is incorrect. The gap is logical, not territorial. To move from "Humans universally judge X as wrong" to "X is objectively wrong," one requires a bridging premise, such as "What is universally judged by humans is morally true." That premise is itself a normative claim, not an empirical one. The colleague has not eliminated the gap; he has merely hidden the bridging premise inside the "calibration" metaphor.
  *   **The Verdict:** The move from descriptive stability to normative objectivity is invalid. It commits the naturalistic fallacy.

  ### 4. Domain-Partitioned Objectivity
  Your colleague proposes that morality is objective in the harm domain but relative in the purity domain. While this is a defensible philosophical position (a form of moral pluralism), the *argument* he uses to support it is circular.

  *   **The Partition:** He partitions the domains based on the *degree of variance* in the data. High variance = Relative; Low variance = Objective.
  *   **The Problem:** This makes objectivity contingent on sample size and cultural diversity. If we discovered a culture that did not condemn unprovoked violence, would harm suddenly become "subjective"? Objectivity should not fluctuate based on anthropological headcounts.
  *   **Alternative Explanations:** As you suspected, evolutionary explanations carry no objectivist commitment.
      *   *Functionalism:* We can explain the "harm core" via evolutionary biology. Organisms that do not protect their young or cooperate to avoid mutual destruction go extinct. This explains the *universality* of harm norms without requiring them to be *objectively true* in a Platonic sense. They are adaptive heuristics, not moral laws.
      *   *Error Theory:* It is possible that *all* moral judgments (harm and purity) are false claims about objective properties, even if the harm judgments are more useful for survival. The data cannot distinguish between "Harm is objectively wrong" and "Believing harm is wrong is evolutionarily advantageous."

  ### 5. Conclusion: Does the Reasoning Survive Correction?
  No. The reasoning does not survive correction, though the intuition behind it is valuable.

  1.  **Empirically:** The "harm core" is less stable than claimed, and the "calibration" metaphor assumes a shared metric that is not proven.
  2.  **Logically:** The inference from universality to objectivity is invalid. Consensus among observers does not prove the existence of an observer-independent fact.
  3.  **Philosophically:** The critique of the Is-Ought gap misunderstands the nature of logical entailment. Empirical data can inform ethics (e.g., by revealing the consequences of actions), but it cannot ground normative truth without a prior normative premise.

  **Recommendation for the Seminar:**
  You might frame your critique using the distinction between *epistemic access* and *ontological status*. Your colleague is arguing that because we have reliable epistemic access to harm norms (they are stable), they must have a different ontological status (objectivity). You can point out that we also have reliable epistemic access to the fact that sugar tastes sweet, but that does not make sweetness an objective property of sugar.

  The "Normative Calibration" model is a compelling *narrative* for reconciling cultural difference, but it is a metaphysical framework imposed *upon* the data, not a conclusion derived *from* it. It is a philosophical hypothesis, not a scientific finding.
