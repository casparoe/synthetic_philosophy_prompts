  5.  **Self-Correction during drafting:** I need to make sure I don't just bash the anthropologist. The "Normative Calibration" idea is actually an interesting philosophical *hypothesis*, even if not empirically proven. I should frame it as a *metaphysical commitment* disguised as an *empirical summary*. Also, ensure I acknowledge that MFT itself has critics within psychology (the "WEIRD" critique applies to MFT too).

  6.  **Final Output Structure:**
      *   Executive Summary.
      *   Audit of Empirical Claims (The Psychology).
      *   Audit of the Calibration Metaphor (The Measurement Theory).
      *   Audit of the Metaethical Inference (The Is-Ought Gap).
      *   Alternative Explanations (Evolutionary/Functional).
      *   Final Verdict.

  *(Self-Correction)*: Wait, I need to be careful about the "Harm" stability. Recent work suggests even harm is interpreted differently (e.g., spiritual harm). I should mention that the "Objective Core" is empirically shakier than the colleague admits.

