  ## 9. Final Check on the Risk Intuition

  You asked me to confirm your suspicion about the risk case.
  *   **Your Intuition:** "Concavity plus monotonicity seems to make any lottery no better than its own expected-welfare vector."
  *   **My Assessment:** This is true for **Ex-Ante Prioritarianism**. If you transform expected welfare, $V(L) = \sum f(\sum p_s w_{is})$, then the view is indifferent to the correlation of risks across people. It treats a lottery exactly like its expected value vector. In this specific formulation, you are right: the risk case is a dead end for distinguishing views, because it collapses into a form of Utilitarianism over transformed expectations.
  *   **The Caveat:** It is *not* true for **Ex-Post Prioritarianism**. $V(L) = \sum p_s (\sum f(w_{is}))$. Here, the view prefers equalizing welfare across states. However, for *Comparative* Prioritarianism, Ex-Post is disastrous (violates Dominance).
  *   **Decision:** I will use your intuition. I will argue that Ex-Ante CP collapses to AP (losing the comparative element), and Ex-Post CP is irrational. This "pincer movement" kills the risk branch efficiently, saving word count for the fixed-population argument where the real philosophical work lies. This validates your hunch while adding the necessary formal precision to make it stick.

