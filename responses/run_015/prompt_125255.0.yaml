answer: |-
  # Fellowship Proposal: The Price of Immunity — Absolute vs. Comparative Weighting in Distributive Ethics

  ## 1. The Determinate Research Question

  **Does the immunity of Prioritarianism to the Levelling-Down Objection depend essentially on the absolute nature of its weighting function, such that any coherent formulation of 'Comparative Prioritarianism' necessarily reintroduces the objection, thereby collapsing the distinction between Priority and Equality?**

  This question is determinate because it forces a binary outcome regarding the structural stability of Prioritarianism. Either:
  1.  **Stability:** There exists a weighting function sensitive to relative standing (comparative) that retains the formal immunity to Levelling-Down (monotonicity in all persons' welfare) while distinctively capturing the intuition that we should prioritize the worse off *because* they are worse off than others.
  2.  **Instability:** Any weighting function sensitive to relative standing either (a) violates monotonicity (succumbing to Levelling-Down) or (b) is mathematically equivalent to standard Telic Egalitarianism, implying that Prioritarianism's immunity is purchased solely by ignoring relational facts.

  The project will not ask "Which view is correct?" but rather "Is the conceptual space occupied by Prioritarianism stable when we vary the input of the weighting function?"

  ## 2. Why the Existing Framing Leaves This Open

  The standard debate is tripartite: Utilitarianism (sum of welfare), Telic Egalitarianism (value of equality), and Prioritarianism (weighted sum of welfare, weights determined by absolute level). This framing treats Prioritarianism as a monolith defined by a concave transformation of absolute welfare levels ($\sum f(w_i)$ where $f' > 0, f'' < 0$).

  This framing obscures two critical issues:

  **First, it conflates the *source* of priority with the *structure* of priority.**
  The motivation for Prioritarianism is often verbalized as "giving priority to the worse off." In the standard model, "worse off" means "low absolute welfare." But in ordinary moral discourse, "worse off" is often comparative (worse off *than others*). By hard-coding "absolute" into the definition of Prioritarianism, the literature pre-emptively solves the Levelling-Down Objection (LDO). If weights depend only on absolute levels, lowering everyone's welfare lowers the weighted sum. Case closed. But this solution is trivial. It solves LDO by refusing to look at relations. The friend in your argument is technically correct: standard Prioritarianism escapes LDO. But your intuition is also correct: it escapes it too cheaply. It escapes it by being a separable, person-affecting view that ignores the very comparative facts that usually motivate egalitarian concern. The existing framing allows Prioritarians to claim they capture the egalitarian intuition without the egalitarian cost, without testing whether the intuition *requires* the cost.

  **Second, it treats the Levelling-Down Objection as a view-sorting mechanism rather than a structural stress test.**
  LDO is used to sort Egalitarianism (fails) from Prioritarianism (passes). But if the only feature that allows Prioritarianism to pass is its absolutism, then LDO isn't testing "Priority vs. Equality"; it's testing "Separable/Absolute vs. Non-Separable/Comparative." If we construct a view that weights welfare based on rank or gap from the mean (Comparative Prioritarianism), does it fail LDO? If it does, then the "Priority" label is doing no work; the view stands or falls on its absolutism. If it doesn't, then we have a new view that captures relational concern without LDO vulnerability, rendering the standard tripartite map obsolete. The current literature dismisses comparative weighting as "just Egalitarianism" without demonstrating that comparative weighting *necessitates* LDO vulnerability. This assumption needs to be proven, not asserted.

  ## 3. Methodology: Philosophical Engineering

  A literature survey is insufficient because the literature assumes the conclusion (that comparative views are vulnerable). Pure axiomatics (proving representation theorems) is also insufficient because it risks losing the normative connection to the Levelling-Down intuition. We need **Philosophical Engineering**.

  **The Approach:**
  1.  **Construct:** Explicitly define Social Welfare Functions (SWFs) for "Comparative Prioritarianism" (CP). I will model at least two variants:
      *   *Rank-Weighted CP:* Weight depends on a person's ordinal rank in the distribution.
      *   *Gap-Weighted CP:* Weight depends on the distance between a person's welfare and the mean (or maximum).
  2.  **Stress-Test:** Run these SWFs against the specific conditions that generate LDO. The condition for LDO vulnerability is not just "preferring equality," but "asserting a *pro tanto* improvement when welfare is destroyed to achieve equality." Formally, does the view imply $V(A) > V(B)$ where $A$ is an equal distribution with lower total welfare than unequal $B$, and does it imply this *even if* no one is better off in $A$?
  3.  **Compare:** Contrast the results with Standard Absolute Prioritarianism (AP) and Utilitarianism.

  **Why This Beats Alternatives:**
  *   **Vs. Lit Survey:** A survey reports that "Prioritarians claim immunity." This project tests *whether that immunity holds* when we tweak the definition to match the verbal motivation (comparative worse-offness). It moves from exegesis to analysis.
  *   **Vs. Pure Axiomatics:** Axiomatics tells us what properties a function has (e.g., separability). It doesn't tell us if the resulting view is normatively plausible regarding LDO. By building specific functions and running cases, we keep the normative stakes visible. We aren't just proving non-separability; we are asking if non-separability *forces* us to accept that levelling down is in one respect good.

  This method forces the "cheap immunity" claim into the open. If AP escapes LDO only because it is blind to relations, and CP captures relations but fails LDO, then the "Priority" view is revealed as a hybrid that only works by ignoring half the moral picture.

  ## 4. Test Cases

  To ensure the 8,000-word limit is respected, I will focus on three specific domains. These are chosen to isolate the variables of Absoluteness, Population, and Risk.

  ### A. The Fixed-Population Comparative Case (The Core Test)
  This is the direct test of the user's hypothesis.
  *   **Scenario:** Two populations, same size.
      *   *World 1:* (10, 100). Total 110. Gap 90.
      *   *World 2:* (5, 5). Total 10. Gap 0.
  *   **AP Prediction:** World 1 is better. $f(10)+f(100) > f(5)+f(5)$ for any increasing $f$. Immune to LDO.
  *   **CP Prediction:** This depends on the weighting function.
      *   If weight $w_i = g(\text{rank}_i)$, World 2 has same ranks as World 1. If $f$ is increasing, World 1 still wins. CP might be immune!
      *   If weight $w_i = h(\text{mean} - w_i)$, the mean drops in World 2. The weights change.
  *   **The Crux:** I need to determine if there is *any* comparative weighting scheme that assigns higher value to World 2 *in some respect* (or all-things-considered) solely due to the reduction in gap. If Rank-Weighted CP prefers World 1, then "comparative concern" based on rank doesn't generate LDO. If Gap-Weighted CP prefers World 2, it does.
  *   **Goal:** Identify exactly which comparative metric triggers LDO. Is it rank? Gap? Variance? This isolates the "poison pill" in egalitarian views.

  ### B. Variable Population / Replacement Cases
  This tests whether the view is truly person-affecting or if it treats welfare as a resource to be distributed.
  *   **Scenario:** "The Sadist Replacement."
      *   *World A:* One person at welfare 100.
      *   *World B:* One person at welfare 10.
      *   *World C:* Two people. One at 100, one at -100 (or very low).
  *   **Standard Issue:** Utilitarianism might prefer A to C. Egalitarianism might prefer C (if it values equality of existence, though usually variable pop breaks egalitarianism). Prioritarianism usually handles this via Critical-Level Utilitarianism modifications.
  *   **The CP Twist:** If weights depend on the *mean*, adding a miserable person lowers the mean, raising the weight of the existing happy person.
      *   Does CP imply that adding a miserable person is *good* because it increases the priority weight of the happy person? (The "Sadist Instrumentalism" problem).
      *   Or does the miserable person's low weight drag the sum down?
  *   **Why this matters:** If CP makes the value of a happy person's welfare dependent on the existence of miserable people (to boost their weight), it violates a strong form of Separability and potentially Intuition of Neutrality. This tests if "Comparative Priority" is coherent across population changes. If the weight of a life depends on who else exists, the view becomes radically non-separable. This is a stronger objection than LDO.

  ### C. Risk and Uncertainty (The "Dead End" Check)
  You suspect this is a dead end because "concavity plus monotonicity seems to make any lottery no better than its own expected-welfare vector."
  *   **Correction/Refinement:** Your intuition is half-right but needs formal unpacking.
      *   *Ex-Ante Prioritarianism:* Maximize $\sum f(E[w_i])$. Here, you are right. It evaluates lotteries based on individual expected welfare. It is indifferent to how welfare is distributed *across states of the world*, only across people. It behaves like Utilitarianism over transformed expectations.
      *   *Ex-Post Prioritarianism:* Maximize $E[\sum f(w_i)]$. This cares about inequality in every state.
  *   **The CP Problem in Risk:** If weights are comparative, *when* do we calculate the comparison?
      *   *Ex-Post Comparative:* Weights depend on who is worst off *in that state*. This creates "State-Dependent Weights."
      *   *The Trap:* If I am the worst off in State 1 but best off in State 2, my weight flips. This can lead to violations of **Stochastic Dominance**. A view that violates Stochastic Dominance is arguably irrational.
  *   **Plan:** I will not try to solve risk. I will use it as a *reductio*. If Comparative Prioritarianism requires state-dependent weights that violate Dominance, that is a fatal flaw independent of LDO. This confirms your suspicion that the risk branch is hostile to CP, but for a sharper reason (irrationality vs. mere LDO vulnerability). I will spend limited words here to demonstrate the collapse, rather than trying to fix it.

  ## 5. Positive and Negative Results

  A project like this must be robust to either outcome. Here is what the conclusion looks like in both scenarios.

  **Positive Result (The "Distinction is Real" Outcome):**
  *   **Finding:** We construct a Comparative Prioritarianism (likely Rank-Weighted) that captures the intuition of "helping the worse off relative to others" but *does not* imply that Levelling Down is in any respect good. It passes LDO because it is still monotonic in absolute welfare, even if weights are relative.
  *   **Implication:** The standard debate is confused. LDO does not distinguish Priority from Equality. Absoluteness does. We can have a view that is relational *and* LDO-immune. The friend's claim (Prioritarianism escapes LDO) is right, but your claim (it's too cheap) is wrong—it's not cheap, it's structural. We can have our relational cake and eat it too.
  *   **Paper Conclusion:** Propose "Rank-Prioritarianism" as the superior view to both Standard Prioritarianism (too atomistic) and Egalitarianism (LDO vulnerable).

  **Negative Result (The "Collapse" Outcome):**
  *   **Finding:** Any weighting function that makes priority sensitive to comparative standing either (a) becomes mathematically equivalent to Telic Egalitarianism (valuing the gap itself) or (b) violates Monotonicity (implying levelling down increases value). Specifically, Gap-Weighted CP succumbs to LDO, and Rank-Weighted CP fails to capture the *magnitude* of disadvantage (a gap of 1 vs 100 doesn't matter, only rank does).
  *   **Implication:** Prioritarianism is stable *only* as an Absolute view. If you want comparative concern, you must buy the LDO vulnerability. The "Priority" label is essentially a marketing term for "Utilitarianism with diminishing marginal value," and it cannot bear the weight of relational egalitarian intuition without collapsing into Egalitarianism.
  *   **Paper Conclusion:** The tripartite map is correct, but for the wrong reasons. Prioritarianism is not a middle ground; it is Absolute Utilitarianism. True comparative concern requires accepting LDO.

  **My Prediction:** The Negative Result is more likely. Comparative weighting usually introduces non-separability that allows the "value of equality" to outweigh "loss of total welfare" in edge cases, triggering LDO. If I can prove that *any* non-separable weighting function vulnerable to the "Sadist Replacement" case also triggers LDO, that is a strong negative result.

  ## 6. Feasibility and Risk Assessment (The 3-Month Constraint)

  An 8,000-word paper is tight for formal ethics. The main risk is scope creep in the formalism.

  **What Makes This Too Big:**
  1.  **Axiomatic Proofs:** If I attempt to prove representation theorems for Comparative Prioritarianism, I will run out of time. I must stick to *counter-examples* and *function construction*. I need to show *one* CP function that works or fails, not characterize the set of all CP functions.
  2.  **Risk/Uncertainty Deep Dive:** As noted, the risk case can explode into Ex-Ante vs. Ex-Post debates. I must limit this to a single section demonstrating the Stochastic Dominance violation. If it gets messy, I cut it. The Fixed-Population and Variable-Population cases are sufficient for the main argument.
  3.  **Defining "Welfare":** I must assume a cardinal, interpersonally comparable welfare scale. Debating the measurement of welfare is a separate project. I will state this assumption upfront and hold it fixed.
  4.  **Population Ethics Rabbit Hole:** The Variable Population case can lead into the Repugnant Conclusion and Non-Identity Problem. I must restrict this to the "Replacement" case (same number of people, different identities/welfares) to avoid needing a full theory of critical levels.

  **Mitigation Strategy:**
  *   **Month 1:** Formalize the SWFs. Define AP, Rank-CP, Gap-CP. Run the Fixed-Population LDO cases. (Drafting Sections 1-3).
  *   **Month 2:** Run Variable Population and Risk cases. Determine which CP variants fail. (Drafting Sections 4-5).
  *   **Month 3:** Synthesis. Write the "Why It Matters" section connecting back to the LDO debate. Edit for word count.

  **The "Killer" Risk:**
  The biggest risk is that "Comparative Prioritarianism" is ill-defined. If I define it poorly, critics will say "That's not priority, that's just egalitarianism."
  *   *Defense:* I will define it structurally, not nominally. If it maximizes a weighted sum where weights are functions of relative standing, it is structurally Prioritarian (weighted sum) even if the input is comparative. The burden is on the critic to show why the *input* definition changes the *structural* label. I will make this definitional stipulation explicit in the introduction to prevent semantic drift.

  ## 7. Detailed Argument Outline (For the 8,000 Words)

  **Introduction (1,000 words)**
  *   The stalemate: LDO is used to kill Egalitarianism and save Prioritarianism.
  *   The hypothesis: This immunity is an artifact of Absolute Weighting.
  *   The proposal: Test Comparative Prioritarianism (CP).
  *   Roadmap.

  **Section 1: The Architecture of Priority (1,500 words)**
  *   Define Standard Absolute Prioritarianism (AP). Show formally why it escapes LDO (Monotonicity).
  *   Define the "Comparative Intuition": We care about the worse off *because* they are below others.
  *   Construct two CP models: Rank-Weighted and Gap-Weighted.
  *   *Crucial Move:* Distinguish between the *value function* (what we maximize) and the *weighting function* (how we count). CP keeps the sum structure but changes the weights.

  **Section 2: The Levelling-Down Stress Test (2,000 words)**
  *   Apply AP and CP to the standard LDO case.
  *   Show AP passes trivially.
  *   Show Gap-CP fails (values the gap reduction enough to offset total loss).
  *   Show Rank-CP might pass (ranks don't change in levelling down), but argue Rank-CP is normatively inadequate (ignores magnitude of inequality).
  *   *Interim Conclusion:* To capture the magnitude of disadvantage (the real egalitarian intuition), you need Gap-Weighting. Gap-Weighting fails LDO. Therefore, robust comparative concern implies LDO vulnerability.

  **Section 3: Variable Population and Replacement (2,000 words)**
  *   Introduce the "Sadist Replacement" case.
  *   Show how CP creates perverse incentives (adding miserable people to boost weights of the happy).
  *   Argue that AP avoids this via Separability.
  *   Argue that avoiding this requires Absolutism.
  *   This reinforces the Section 2 finding: Comparativity brings structural instability.

  **Section 4: The Risk Constraint (1,500 words)**
  *   Briefly address Uncertainty.
  *   Show that Ex-Post CP violates Stochastic Dominance (weights shift across states).
  *   Show that Ex-Ante CP collapses to AP (expected welfare is absolute).
  *   Conclude that Risk considerations further squeeze CP out of existence.

  **Conclusion (1,000 words)**
  *   Summarize findings: Prioritarianism is stable only as an Absolute view.
  *   Implications for the debate: Your friend is right that PP escapes LDO, but you are right that it's "cheap." It's cheap because it abandons the comparative intuition.
  *   Final verdict: We must choose between Absolute Priority (LDO immune, relationally blind) and Comparative Equality (LDO vulnerable, relationally sensitive). There is no free lunch.

  ## 8. Why This Proposal Works for a Junior Fellowship

  1.  **Novelty:** It doesn't just rehash Parfit. It constructs a new hybrid view (CP) to test the boundaries of the old ones.
