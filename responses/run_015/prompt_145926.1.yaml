answer: |-
  Your intuition about the metalanguage is sharp, and it points directly to why this debate has calcified. To give you the diagnosis you need for your piece: the stall is no longer about logic or compositionality. Technically, the Frege-Geach problem has been solved. The stalemate persists because the disagreement has shifted from a technical challenge to a clash over explanatory priority, obscured by a shared representationalist framework that neither side seems willing to fully abandon.

  Here is the breakdown of why the argument refuses to die.

  ### 1. The Technical Problem is Dead (But Nobody Told the Realists)
  If you look at the formal literature, specifically Mark Schroeder's *Being For* (2008), the logical objection is effectively neutralized. Schroeder demonstrated that an expressivist can construct a compositional semantics where the meaning of a moral sentence is identified with the mental state it expresses (e.g., being "for" something). He showed how to assign semantic values to complex sentences like conditionals without positing moral facts.

  If the problem were purely about logical validity or compositionality, the debate should have ended fifteen years ago. The fact that it hasn't tells you that the Frege-Geach problem was never really about logic. It was a proxy war. Realists used logic as a wedge to force expressivists to admit that moral sentences function *as if* they describe facts. Expressivists accepted the challenge, built the formal machinery, and said, "There, we can do it."

  The realists replied, in effect, "You can mimic the structure, but you haven't explained the *nature* of the consistency." When a realist says, "It is contradictory to believe P and not-P," they appeal to the nature of belief and truth. When an expressivist says, "It is inconsistent to be for A and not be for A," the realist asks: "What makes that a *logical* inconsistency rather than just a psychological clash?"

  The stall here is not technical; it is metaphysical. The realist demands an ontology to ground logical relations. The expressivist offers a psychology. They are talking past each other because they disagree on what logic *is*.

  ### 2. The Shadow of Representationalism
  This brings us to your hypothesis about the metalanguage. You are correct that both sides are operating with a representationalist default, and this is the primary engine of the deadlock.

  The debate is framed by a question that favors the realist: "What kind of *content* do moral sentences have?"
  *   The Cognitivist answers: "Representational content (facts)."
  *   The Expressivist answers: "Expressive content (attitudes)."

  By accepting this framing, the expressivist concedes that the default mode of meaningful language is representation. They position their view as the "alternative" or the "deviant" case that needs special explaining. This forces expressivists onto defensive turf. They spend decades building "quasi-realist" workarounds to earn the right to use words like "true," "fact," and "knowledge."

  But in doing so, they validate the realist's suspicion. If the expressivist has to build a complex semantic model to show how "Murder is wrong" functions *like* a truth-apt sentence, the realist argues they have simply reinvented cognitivism with extra steps. The expressivist insists the underlying psychology is different, but if the semantic output is identical, the realist asks why the psychological substrate matters for the philosophy of *language*.

  The deadlock exists because expressivists haven't fully rejected the representationalist metalanguage; they have tried to co-opt it. A more radical diagnosis would suggest that the debate stalls because expressivists refuse to abandon the idea that semantics must be truth-conditional (even if "deflated"), while realists refuse to accept that truth-conditions can exist without robust facts. Both are trapped in a picture where meaning must be cashed out in terms of "fitting the world."

  ### 3. Is it a Verbal Dispute?
  There is a strong case that this is now a verbal dispute disguised as a substantive one, specifically regarding the word "belief."

  Expressivists like Allan Gibbard argue that normative judgments are a species of "planning" or "norm-acceptance." Realists argue these are "beliefs." The impasse occurs because both sides can accommodate the data.
  *   Can you reason with plans? Yes.
  *   Can plans be inconsistent? Yes.
  *   Do we talk about moral beliefs as if they are true? Yes.

  The expressivist says, "We call it belief, but it's really planning."
  The realist says, "If it walks like a belief and talks like a belief, it's a belief, and beliefs represent facts."

  The disagreement reduces to a classification dispute. However, it feels substantive because of the metaphysical baggage attached to "belief." If moral states are beliefs, they must be caused by moral facts (causal theory of knowledge). If they are plans, they need not be. The stall is actually a disagreement about *epistemology* masquerading as semantics. The realist cannot conceive of knowledge without a causal link to the world. The expressivist cannot conceive of a causal link to a normative world. They are arguing about the nature of knowledge, but they keep fighting on the terrain of the Frege-Geach problem because that is where the rules of engagement were set in the 1960s.

  ### 4. What Could Break the Deadlock?
  For your magazine piece, the most compelling angle is that the Frege-Geach problem is a zombie argument. It should be dead, but it walks because it serves a sociological function in the field. It keeps the metaethical debate bounded within analytic semantics, preventing it from dissolving into broader pragmatism or anthropology.

  To actually break the deadlock, one of two things needs to happen:

  **A. A Shift to Pragmatics over Semantics**
  The debate stalls because both sides are obsessed with *sentence meaning*. A breakthrough would require abandoning the search for the semantic content of "wrong" entirely. If philosophers stopped asking "What does 'wrong' mean?" and started asking "What are the social norms governing the use of 'wrong'?", the Frege-Geach problem dissolves. It becomes a problem about the rules of a language game, not the composition of propositions. However, analytic philosophy is heavily invested in semantics, so this shift is unlikely to be accepted as a "solution" by the old guard.

  **B. Owning the Metalanguage**
  The expressivists need to stop trying to earn the right to talk like realists. As long as they engage in "quasi-realism," they admit that realism is the ideal they are approximating. A new conceptual distinction would require expressivists to argue that the realist's "fact" is the confused concept, not the expressivist's "attitude." They need to argue that representational semantics is the special case, applicable only to descriptive science, and that normative language reveals the poverty of the representational model, not the poverty of expressivism.

  ### The Verdict
  The stall is not about logic. It is not merely verbal. It is a conflict over **explanatory priority**.

  Realists prioritize the *structure* of discourse (logic, truth, embedding) and argue that only ontology can explain it. Expressivists prioritize the *function* of discourse (guiding action, coordinating attitudes) and argue that only psychology can explain it. The Frege-Geach problem persists because it is the perfect intersection where structure and function collide.

  Until one side concedes that the other's explanatory virtue (ontology vs. psychology) is secondary, the debate will continue. Your readers should understand that the argument hasn't moved in decades not because the puzzle is unsolved, but because both sides are satisfied with their own explanatory costs. The expressivists are willing to pay the cost of complex semantics to save naturalism. The realists are willing to pay the cost of queer ontology to save intuitive semantics. They are not trying to convince each other anymore; they are simply managing their own theoretical budgets.
