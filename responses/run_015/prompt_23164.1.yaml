answer: |-
  This is a sophisticated objection that cuts to the heart of Lewisian game theory. You are essentially identifying what we might call the **"Epistemic Fragility Objection."**

  Many philosophers have defended Lewis by arguing that "common knowledge" is an idealization, much like frictionless planes in physics. However, your intuition is correct: because Lewis ties the *rationality* of conformity so tightly to the *arbitrariness* of the equilibrium, the lack of a "frictionless" epistemic state isn't just a minor error—it creates a structural collapse in the theory's ability to explain stability.

  Here is a structured argument demonstrating that this is a genuine theoretical gap in Lewis's account, not merely an empirical simplification.

  ### The Argument: The Epistemic Fragility of Arbitrary Equilibria

  **1. The Lewisian Dependency Thesis**
  For Lewis, a convention is a solution to a recurrent coordination problem. Crucially, the rationality of an agent's conformity is **conditionally dependent**. I conform to regularity $R$ (e.g., driving on the right) *if and only if* I expect others to conform to $R$. Because Lewis insists on **Arbitrariness** (Condition 4 of his definition), there is no intrinsic payoff difference between $R$ and alternative $R'$. Driving on the right is not inherently safer than the left; it is only safer *given* that others do it. Therefore, my reason to conform rests *exclusively* on my expectation of others' conformity.

  **2. The Epistemic Requirement**
  To sustain this expectation in a rational agent, Lewis requires **Common Knowledge** (Condition 5). It is not enough that I know you will drive on the right; I must know that you know that I know, *ad infinitum*. This infinite regress is required to rule out higher-order doubts (e.g., "I know you'll drive on the right, but do you know that *I* know that, or might you think I'm confused and drive on the left?"). Without this chain, the game-theoretic justification for the equilibrium unravels.

  **3. The Fragility Premise**
  Common knowledge is an epistemically "expensive" state. In the real world, it is easily disrupted by:
  *   **New Agents:** A new driver enters the population. Do they know the convention? Do I know that they know?
  *   **Noise/Opacity:** Fog, distractions, or cultural barriers reduce the clarity of signals.
  *   **Bounded Rationality:** Real agents cannot process infinite iterations of "knows that."

  In formal game theory (specifically following Rubinstein's "Electronic Mail Game" logic, which post-dates Lewis but validates your intuition), even a tiny break in common knowledge (e.g., a 1% chance the message didn't get through) can theoretically cause rational agents to abandon the coordination equilibrium entirely.

  **4. The Stability Observation**
  Despite these epistemic breaks, arbitrary conventions are empirically **robust**. When a tourist from a left-driving country enters a right-driving country, they do not cause a collapse of the convention. They usually conform, even if the "common knowledge" chain between them and the locals is broken or imperfect. The convention persists through epistemic noise that should, by Lewis's logic, render the rationality of conformity indeterminate.

  **5. The Gap (The *Reductio*)**
  Here is where the gap becomes theoretical rather than empirical:
  *   **If** Lewis treats Common Knowledge as a strict necessary condition (which he does to define convention), **then** any situation where Common Knowledge fails is, by definition, *not a convention*.
  *   **But** in those situations, the behavior (driving on the right) continues stably.
  *   **Therefore**, Lewis's theory cannot classify this stable behavior as a convention, even though it fits every intuitive and functional description of one.

  Lewis cannot wave this away as an "idealization" because the *source* of the stability in his model is the Common Knowledge itself. If you remove the Common Knowledge, you remove the *reason* for the behavior (due to Arbitrariness). In physics, if you remove friction from a model, the ball still rolls. In Lewis's model, if you remove Common Knowledge, the "ball" (conformity) has no force pushing it.

  ### Why this is a "Real Gap" and not just "Idealization"

  To defend Lewis, one might argue: *"Well, common knowledge is just a shorthand for 'high probability'."*

  **The Counter-Argument:**
  If Lewis reduces Common Knowledge to "high probability," he collapses the distinction between a **Convention** and a **Habitus** or **Blind Habit**.
  *   If I drive on the right because I calculate a 95% probability you will too, I am acting on statistical expectation.
  *   If I drive on the right because it is *the rule*, I am acting on normative expectation.

  Lewis wants conventions to be rational equilibria, not just habits. But by making the rationality depend on the infinite epistemic chain, he makes the convention **hostage to epistemic perfection**.

  The gap is this: **Lewis explains the *genesis* of convention (how we select an equilibrium), but he fails to explain the *persistence* of convention (how the equilibrium survives epistemic decay).**

  In practice, conventions acquire a **normative inertia** that Lewis's account misses. Once a convention is established, it generates its own reasons for compliance (social sanction, internalized rules, "that's just what we do") that are *independent* of the current state of common knowledge.
  *   **Lewis:** I conform because I know you know I know... (Fragile)
  *   **Reality:** I conform because deviating is "wrong" or "dangerous" regardless of what I think you know. (Robust)

  By insisting on Arbitrariness, Lewis forbids the convention from generating independent value. By insisting on Common Knowledge, he forbids the convention from surviving epistemic uncertainty. The combination creates a model of social life that is impossibly brittle.

  ### Conclusion

  Your intuition identifies a structural flaw. Lewis's account implies that conventions should shatter under the slightest epistemic pressure because they lack intrinsic value. Since they do not shatter, Lewis's account is missing a mechanism—likely a transition from **expectation-based rationality** to **norm-based rationality**.

  The convention stops being a "solution to a coordination problem" that we re-solve every day via common knowledge, and becomes a "social rule" that carries its own weight. Lewis's theory has no room for this transition; for him, if the common knowledge goes, the convention goes. Since the convention stays, the theory has a gap.
