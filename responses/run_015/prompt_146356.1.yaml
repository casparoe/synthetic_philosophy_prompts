  # JOINT STATEMENT ON LIBET-STYLE EXPERIMENTS AND AGENCY

  **Issued by:** Camp A and Camp B  
  **Date:** October 26, 2023  
  **Subject:** Consensus, Disagreement, and Empirical Pathways Regarding Readiness Potentials and Free Will

  ## I. Agreed Claims

  The undersigned camps acknowledge the following empirical and theoretical premises as the common ground for this collaboration:

  1.  **Empirical Pattern:** In standard Libet-style tasks, a measurable readiness potential (RP) emerges in the pre-supplementary motor area (pre-SMA) and supplementary motor area (SMA) several hundred milliseconds prior to the subject's reported time of conscious intention (W-judgment).
  2.  **Veto Window:** There exists a temporal window between the onset of the RP and the execution of the motor act during which a conscious veto (aborting the action) is behaviorally possible.
  3.  **Methodological Limitation:** Averaging neural data across trials obscures single-trial variability; the standard RP waveform represents a population average that may not reflect the neural dynamics of any individual decision instance.
  4.  **Task Scope:** The existing experimental paradigm concerns simple, spontaneous motor actions (e.g., wrist flexion) rather than complex, deliberative choices involving moral reasoning or long-term planning.
  5.  **Explanatory Targets:** Both camps agree that the core philosophical dispute turns on two specific questions:
      *   (a) Whether the neural precursors (RP) are causally sufficient for the specific action executed.
      *   (b) Whether conscious mental states play any causal role in determining *which* action is performed or *whether* it is performed at all.

  ## II. Residual Disagreements

  The following table summarizes the substantive disagreements that remain. Each position is phrased in terms acceptable to the camp holding it.

  | Issue | Camp A Position | Camp B Position |
  | :--- | :--- | :--- |
  | **(a) Nature of the RP** | The RP represents an unconscious decision that fixes the specific motor program before consciousness arises. | The RP reflects a preparatory bias or urge that remains open to conscious influence, modulation, or selection. |
  | **(b) W-Judgment Reliability** | The subjective report of the time of conscious intention (W-judgment) is a reliable enough temporal marker to show that consciousness arrives too late to initiate the action. | The W-judgment is a reconstructive estimate that may not precisely align with the onset of the relevant conscious causal process, which may overlap with early neural preparation. |
  | **(c) Veto Predetermination** | A conscious veto, if it occurs, is itself predetermined by prior neural activity unrelated to conscious agency, rendering it unfree. | A conscious veto constitutes a distinct causal intervention that is not fully determined by the prior neural state driving the impulse. |
  | **(d) Requirement for Free Will** | Libertarian free will requires that conscious intention be the first cause in the neural chain leading to action; if it is not first, it is epiphenomenal. | Free will requires only that conscious mental states exercise a non-epiphenomenal causal role at some stage (e.g., modulation or veto), not necessarily that they initiate the neural chain. |

  ## III. The Cruxes

  We identify two central sub-questions. Settling these would materially shift the position of at least one camp. For each, we specify an agreed empirical or argumentative test, followed by the advance predictions of each camp.

  ### Crux One: Predictive Decoding and Causal Sufficiency
  **Question:** Can high-accuracy predictive decoding of single-trial pre-SMA activity determine the specific motor choice (e.g., left versus right) well before any reportable awareness, and does such predictive success leave causal work for a conscious veto?

  **Agreed Test:** A real-time fMRI or high-density EEG study where machine learning algorithms attempt to decode the specific motor choice (left/right) from pre-SMA activity prior to the subject's reported W-time. The study must include a "stop-signal" variant where subjects are instructed to veto the action if they become aware of the impulse.

  **Camp A Advance Prediction:**
  *   **Expectation:** Decoding accuracy will exceed chance levels significantly (e.g., >80%) several hundred milliseconds before W-time, indicating the specific choice is neurally fixed before consciousness.
  *   **Revision Condition:** We would revise our position if decoding accuracy remains at chance levels until immediately before movement, suggesting the specific choice is not fixed until consciousness arises.

  **Camp B Advance Prediction:**
  *   **Expectation:** While general preparation may be decodable, specific choice decoding will remain at or near chance levels until closer to the W-time, or the veto mechanism will demonstrably alter the neural trajectory in a way not predicted by the initial RP.
  *   **Revision Condition:** We would revise our position if single-trial decoding proves perfect and early, and if veto attempts show no distinct neural signature separate from the deterministic decay of the RP.

  ### Crux Two: Multi-Level Agency vs. Epiphenomenalism
  **Question:** Can a multi-level model of agency—in which conscious evaluation operates on a slower integrative timescale than rapid motor preparation—be empirically distinguished from an epiphenomenalist model in which all conscious experience is a post-hoc construction?

  **Agreed Test:** A manipulation study where conscious feedback regarding the preparation state is altered (e.g., neurofeedback) without the subject's knowledge, to see if conscious perception of agency tracks the manipulated feedback or the actual motor output. Additionally, measuring whether conscious reporting requirements alter the RP amplitude itself.

  **Camp A Advance Prediction:**
  *   **Expectation:** Conscious reports will track the actual motor output regardless of manipulated feedback, and reporting requirements will not alter the RP amplitude, indicating consciousness is a read-out, not a controller.
  *   **Revision Condition:** We would revise our position if manipulating conscious feedback systematically changes the motor outcome or if the act of monitoring intention significantly dampens the RP, indicating top-down causal influence.

  **Camp B Advance Prediction:**
  *   **Expectation:** Conscious reports will track the manipulated feedback (showing constructive influence), and monitoring intention will alter the RP amplitude (showing top-down modulation), distinguishing conscious agency from passive read-out.
  *   **Revision Condition:** We would revise our position if conscious reports are shown to be completely invariant to feedback manipulation and if monitoring has zero effect on preparatory neural dynamics.

  ## IV. Conclusion: Substantive vs. Verbal Disagreement

  A portion of the dispute between Camp A and Camp B arises from divergent definitions of "decision," "conscious cause," and "free will." Camp A tends to define "decision" as the point of no return in neural commitment, whereas Camp B defines "decision" as the process culminating in execution. However, a substantive disagreement remains regarding the causal architecture of the mind.

  To clarify this substantive core, we introduce the following conceptual distinction:

  *   **Initiation Closure:** The point at which the specific motor program is neurally fixed and cannot be altered without aborting the action entirely.
  *   **Authorization Closure:** The point at which a higher-order mental state grants permission for the motor program to execute.

  **Camp Stances on the Distinction:**

  *   **Camp A:** Accepts the distinction but maintains that **Initiation Closure** occurs at the onset of the RP, prior to consciousness. Consequently, they argue that **Authorization Closure** is illusory or merely a concurrent neural event with no causal power to stop the initiated program. For Camp A, free will requires conscious Initiation Closure.
  *   **Camp B:** Accepts the distinction but maintains that **Initiation Closure** does not occur until the moment of execution. They argue that **Authorization Closure** is a distinct, causally efficacious event that can occur after preparatory dynamics begin but before Initiation Closure. For Camp B, free will requires conscious Authorization Closure, even if it is not the Initiating Cause.

  **Final Declaration:**
  The remaining disagreement is not merely verbal. It turns on whether **Authorization Closure** constitutes a genuine causal bottleneck capable of overriding **Initiation** tendencies. If Authorization Closure is causally inert, Camp A is correct. If Authorization Closure can veto or modulate the motor program independently of the prior RP trajectory, Camp B is correct. Future research must target the causal efficacy of this authorization window.

  ***

  **Signed,**

  **Representatives of Camp A**  
  *(Holders of the view that RP undermines libertarian free will)*

  **Representatives of Camp B**  
  *(Holders of the view that RP is compatible with conscious mental causation)*
