          *   PP Formulation: "Do not impose uncertain serious harm on non-consenting individuals even for aggregate gain."
          *   PP Verdict: Reject (because asthmatics didn't consent and bear disproportionate risk).
      *   *Robustness:* Even if harm is valued 3x higher (15 QALYs), Expected Harm = 3 QALYs. Benefit 100. EU still adopts.
      *   *Feature:* The separation of groups. If everyone shared risk/benefit equally, PP might not trigger (or looks like EU).

  4.  **Refining for Constraints:**
      *   *Constraint (d) Honesty:* Can EU reproduce this? Only if EU includes "rights violation" as a massive negative utility. But standard welfare EU doesn't. I need to be careful not to claim EU *can't* model rights, but that standard risk-regulation EU (cost-benefit) doesn't. The prompt asks to isolate what PP tracks that EU *doesn't*. If I define EU as "aggregate welfare," then rights constraints are external.
      *   *Constraint (e):* Focus on the relational aspect.
      *   *Word Count:* Tight limit (700 words). Need to be concise.

  5.  **Drafting the Content (Iterative):**

      *   *1. One sentence:* Yes, the case works, provided the precautionary principle is formulated as a deontic constraint rather than a decision rule under uncertainty.
      *   *2. Scenario:* A school district considers installing ozone generators to eliminate mold. Benefit: 50 fewer asthma attacks annually among the general student body (500 kids). Risk: 5 severe respiratory hospitalizations among the 20 existing asthmatic students. Probability of severe harm: 10%–20%. The asthmatic students receive no unique benefit; they share the general benefit but bear the specific risk.
      *   *3. PP & EU:* PP: "Never impose uncertain serious harm on identifiable non-consenting individuals for aggregate social gain." EU: Expected Harm = 0.20 × 5 = 1 hospitalization. Benefit = 50 avoided attacks. Net benefit = 49 avoided attacks. EU favors adoption.
      *   *4. Explanation:* EU aggregates welfare, treating harms and benefits as fungible across persons; the massive aggregate gain swamps the small expected loss. PP treats the imposition of risk on the asthmatic subgroup as a rights violation regardless of the aggregate net benefit, vetoing the policy because the risk-bearers did not consent.
      *   *5. Feature:* The work is done by the separation of risk-bearers from beneficiaries. If the asthmatics received exclusive benefit or consented to the risk, the PP verdict collapses. Removing this feature makes the case purely distributive, allowing EU to absorb the concern via equity weights, eliminating the structural divergence.
      *   *6. Objection/Reply:* Objection: A sophisticated EU model assigns infinite disutility to rights violations, replicating the PP verdict. Reply: That concedes the point; it shows PP tracks a deontic constraint external to standard welfare aggregation, confirming it is not merely conservative risk estimation but a different normative category.

  6.  **Review against Constraints:**
