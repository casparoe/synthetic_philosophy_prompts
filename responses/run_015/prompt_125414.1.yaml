answer: |-
  1. Yes, the case works, provided the precautionary principle is formulated as a deontic constraint rather than a decision rule under uncertainty.

  2. A school district considers installing ozone generators to eliminate mold. Benefit: 50 fewer mild asthma attacks annually among the 500-person student body. Risk: 5 severe respiratory hospitalizations among the 20 existing asthmatic students. Probability of severe harm: 10%–20%. The asthmatic students share the general benefit but bear the specific risk without individual consent.

  3. Precautionary Principle: "Do not impose uncertain serious harm on identifiable non-consenting individuals for aggregate social gain." Expected Utility: Expected Harm = 0.20 × 5 = 1 hospitalization. Benefit = 50 avoided attacks. Even valuing one hospitalization equal to three avoided attacks, expected cost (3) remains below benefit (50). EU favors adoption.

  4. EU aggregates welfare, treating harms and benefits as fungible across persons; the massive aggregate gain swamps the small expected loss. PP treats the imposition of risk on the asthmatic subgroup as a rights violation regardless of the aggregate net benefit, vetoing the policy because the risk-bearers did not consent.

  5. The work is done by the separation of risk-bearers from beneficiaries. If the asthmatics received exclusive benefit or consented to the risk, the PP verdict collapses. Removing this feature makes the case purely distributive, allowing EU to absorb the concern via equity weights, eliminating the structural divergence.

  6. Objection: A sophisticated EU model assigns infinite disutility to rights violations, replicating the PP verdict. Reply: That concedes the point; it shows PP tracks a deontic constraint external to standard welfare aggregation, confirming it is not merely conservative risk estimation but a different normative category.
