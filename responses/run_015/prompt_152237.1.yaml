      *   *Section 4: The Risk of Triviality.* Address the unfalsifiability concern. If every counter-example is just "you're using the wrong language game," the theory says nothing.
      *   *Section 5: Concessions.* What would a defender admit? They'd admit the "Within-Justification" point is the hardest hurdle.
