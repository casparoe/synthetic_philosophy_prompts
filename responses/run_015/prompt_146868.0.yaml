      *   **Philosophical References:** Mention Rawls (Separateness), Nozick (Side Constraints), Kant (Means/Ends), Scanlon (Contractualism).
      *   **Conclusion:** Help the user see that their intuitions point toward **Contractualism** or **Rights-based Deontology** rather than pure Utilitarianism.

  8.  **Refining the Output (Self-Correction during drafting):**
