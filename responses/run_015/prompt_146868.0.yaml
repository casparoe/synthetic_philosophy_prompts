      *   *Option B: Threshold Deontology.* Aggregation is okay up to a point, but certain harms (death, severe liberty loss) cross a threshold where numbers don't matter.
      *   *Option C: The "Distribution of Burden" View.* It's not just *what* is lost, but *how* it is distributed.
          *   Taxes: Broadly distributed.
          *   Vaccines: Broadly distributed risk.
          *   Trolley/Organs/Factory: Concentrated burden on a specific non-consenting individual.
          *   Second Child: Distributed burden (family resources shared).
          *   Savior Sibling: Concentrated burden (medical procedures) but arguably low harm compared to death.
      *   *Option D: The "Integrity/Project" View (Williams).* Does this violate the person's ability to pursue their own life projects?

  5.  **Address Specific Tensions:**
      *   *Factory Worker vs. Tax:* Tax is a share of *external* resources. Factory work is a demand on *bodily integrity* and *time* in a way that defines the person's existence. Also, taxes are usually general rules; the factory case sounds like a specific assignment of doom.
