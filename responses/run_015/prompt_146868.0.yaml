      *   *Money (Taxes):* Fungible. You lose dollars, not life. You can earn more. It's a share of resources, not the self.
      *   *Statistical Risk (Vaccines):* Fungible/Shared. Everyone takes a tiny risk. It's not *targeted* at one specific person to die.
