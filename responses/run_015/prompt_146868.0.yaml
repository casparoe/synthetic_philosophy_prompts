      *   *Isolation Case:* This is high burden (liberty, social connection) concentrated on one person. Likely fails the test unless voluntary.

  6.  **Synthesize a Refined Principle:**
      *   The user's "fungibility" idea is good but needs to be coupled with **Targeting** and **Bodily Integrity/Basic Liberty**.
