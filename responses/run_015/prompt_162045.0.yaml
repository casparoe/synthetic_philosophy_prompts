answer: |-
  1. This is a substantive disagreement masquerading as a single question, but it is actually three distinct problems conflated under one heading. The impasse persists because proponents of planning solve the static solvability problem while critics attack the dynamic discovery problem, with neither side acknowledging the shift in terrain.
  2. Solvability carries the least weight today as modern computing largely validates Lange's static model, while incentive compatibility is a severe but mechanistic hurdle that mechanism design can partially address. The discovery problem carries the decisive weight because it challenges the ontological status of the data itself, though you have missed the political economy question of who guards the guardians of the planning mechanism.
  3. The Austrian objection survives the oracle test because the simulator presupposes a fixed set of technologies and preferences, whereas the market process generates new options and valuations that did not exist to be simulated. The test proves the calculation debate is not about processing existing data but about the generation of data through competitive experimentation.
  4. Progress requires formally separating the static allocation problem from the dynamic entrepreneurship problem rather than attempting to measure the lag ratio, which assumes an observer-independent reality that the discovery argument denies. A change of question toward comparing institutional error-correction mechanisms under radical uncertainty would yield more fruit than debating equilibrium convergence.
  5. The strongest objection is that the discovery process is merely a distributed computational algorithm that a sufficiently advanced centralizer could replicate, rendering the epistemic distinction a temporary artifact of limited technology. This challenges the oracle conclusion by asserting that tacit knowledge is simply uncodified data rather than fundamentally inarticulable information.
