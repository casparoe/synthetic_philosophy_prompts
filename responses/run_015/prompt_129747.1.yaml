  I'm working through the metaphysics of modality for an advanced seminar and keep returning to a specific conceptual knot: what exactly divides Lewis-style counterpart theory from the Kripkean commitment to transworld identity, once we move past the familiar slogan that possible worlds contain qualitative duplicates rather than the same individual traveling elsewhere? I want an explanation of the underlying structural issue—specifically, how de re modal properties are grounded either in qualitative similarity relations across causally isolated concrete worlds or in a primitive cross-world identity relation—and why treating this disagreement as a mere terminological dispute about the word same misses the genuine metaphysical stakes. To keep the answer from being a generic survey, please organize your analysis around a distinction I have been trying to formalize: what we might call world-indexed essentialism, where an object's essential properties are assigned relative to the world in which evaluation occurs, versus cross-world essentialism, where essential properties constrain which worlds contain that very object regardless of qualitative resemblance. I am particularly interested in why acceptance of spatiotemporally disconnected concrete worlds on the Lewisian picture exerts systematic pressure toward counterpart relations rather than primitive identity, and whether the Kripkean can consistently maintain that identity is fundamental without implicitly importing counterpart-like conditions through the back door of origin essentialism.

  Please structure your response in the following sections: (1) The core distinction (approximately 200 words): explain the conceptual divergence between counterpart-based and identity-based analyses of modal claims, being precise about what is being analyzed in each case; (2) World-indexed versus cross-world essentialism (approximately 250 words): unpack how these two forms of essentialism map onto the respective metaphysical pictures, why they are not interchangeable, and what each is committed to about modal inertia; (3) The smuggling objection and its limits (approximately 200 words): assess whether origin essentialism in the transworld-identity framework secretly relies on qualitative similarity conditions analogous to counterpart relations, and if so whether that undermines the claim to primitiveness; (4) Bottom line (approximately 100 words): summarize which view carries the heavier conceptual cost and why, without appealing to authority or bibliographic weight. Do not provide bibliographies, reading lists, or citations; I am asking for conceptual clarification rather than scholarly attribution.
