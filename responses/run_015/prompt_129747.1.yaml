answer: |-
  (1) The core distinction
  The divergence lies in the truth conditions for de re modal claims. Counterpart theory analyzes "Possibly, a is F" as quantification over a distinct entity in another concrete world that resembles a. The subject of the predicate is not a, but a's counterpart. Transworld identity analyzes the same claim as asserting that a itself exists in another world and is F there. The subject remains numerically identical across worlds. Specifically, CT treats the other-worldly subject as a surrogate, while TWI treats it as the original. This is not merely terminological. In counterpart theory, modal properties are extrinsic relations grounded in qualitative similarity between distinct existents. In transworld identity, modal properties are intrinsic features grounded in a primitive identity relation that holds across modal space. The former reduces modality to actuality plus similarity; the latter treats modality as a fundamental feature of objects. Consequently, the dispute concerns whether identity is world-bound and strict or flexible and transworld. The structural issue is whether the link between worlds is mediated by qualities or by brute identity. Lewis demands a reductive base; Kripke accepts primitive modal facts. This determines whether modal discourse describes relations between worlds or properties of individuals transcending worlds.

  (2) World-indexed versus cross-world essentialism
  On the Lewisian picture, worlds are causally isolated concrete particulars. Since identity typically supervenes on spatiotemporal continuity, nothing can be in two worlds. Thus, essential properties are world-indexed: an object is essentially F only relative to its own world. Its counterparts in other worlds may lack F without contradiction, because they are distinct entities. This yields a fragmented modal profile where what is essential to a here does not strictly constrain what a is elsewhere, since a is not elsewhere. Conversely, Kripkean cross-world essentialism treats essential properties as constraints on the transworld identity relation. If a is essentially F, then any world containing a must represent a as F. This requires modal inertia: a principle securing the object's identity across modal space independent of qualitative overlap. Without this inertia, there is no fact of the matter regarding which object in another world is me. The divergence is stark. World-indexed essentialism makes modality extrinsic and contextual; cross-world essentialism makes it intrinsic and absolute. Lewis's concrete worlds exert pressure toward counterparts because admitting transworld identity would require identity to float free of spatiotemporal grounding, violating his Humean supervenience. If worlds are concrete and disconnected, identity cannot bridge the gap without becoming magical. Kripkeans accept primitive identity to preserve the intuition that I could have been otherwise, not just that someone like me could have been. The cost is accepting non-qualitative individuation. Cross-world essentialism implies that objects carry their identity conditions with them across all possibilities, whereas world-indexed essentialism implies identity is local to the world, with modality handled by external comparison. This fundamentally alters the metaphysics of objects: are they world-bound snapshots or transworld continuants?

  (3) The smuggling objection and its limits
  Critics argue that Kripkean origin essentialism secretly functions like a counterpart relation. By stipulating that a must originate from specific material to exist in any world, the Kripkean imposes a qualitative constraint on transworld identity. If identity is primitive, why should material origin matter? This suggests that even TWI relies on qualitative conditions to individuate objects across worlds, mirroring the similarity metrics of counterpart theory. However, this objection has limits. For the counterpart theorist, similarity is graded and context-dependent; a counterpart relation can shift based on conversational context. For the Kripkean, origin conditions are absolute metaphysical constraints. Smuggling occurs only if one conflates conditions of existence with criteria of similarity. The Kripkean maintains that origin fixes which object is present, not merely which object is sufficiently similar. Yet, the pressure remains: if qualitative facts determine transworld presence, identity is no longer purely primitive. It becomes grounded in haecceities tied to qualitative bases. This weakens the claim that TWI avoids qualitative grounding entirely, though it preserves the logical distinction that the object in the other world is numerically identical, not a surrogate. The Kripkean avoids full reduction but pays with brute necessary connections.

  (4) Bottom line
  The Kripkean view carries the heavier metaphysical cost. It requires primitive thisness to ground identity across worlds without qualitative supervenience, positing brute modal facts. Lewis's counterpart theory pays a higher intuitive price, denying we exist elsewhere, but offers a reductive analysis of modality via concrete entities and similarity. TWI preserves pre-theoretic intuition at the expense of ontological parsimony; CT achieves ontological clarity by revising de re reference. TWI demands we accept identity as a brute fact; CT demands we accept we are world-bound. Metaphysically, brute identity is costlier than revised semantics. Accepting primitive cross-world identity introduces opaque machinery, whereas counterpart theory utilizes transparent qualitative relations.
