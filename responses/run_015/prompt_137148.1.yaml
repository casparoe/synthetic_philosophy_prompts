answer: |-
  ### Q&A Preparation Sheet

  **1. The Med Humanities Objection (Pain Reality)**
  *   **Who:** Medical Humanities Graduate Students.
  *   **Objection:** "If pain is just a draft, are you telling the woman in severe suffering that the most important thing about her situation is a editorial summary? That her pain isn't real?"
  *   **Likelihood:** High | **Damage:** Critical (Loss of Room)
  *   **Reply:** "I am saying the *suffering* is real, but the *phenomenal property*—the magic inner glow—is not. The draft is a neural event with causal power; it drives behavior, demands care, and hurts. Calling it a draft doesn't make it optional, it makes it biological. We treat the draft because the draft is the organism screaming. Denying the magic glow doesn't silence the scream."
  *   **Soft Spot:** Sounds cold if delivered too quickly. Risks equating 'real' with 'physical' in a way that dismisses the lived weight.
  *   **Concession Required:** Yes. Concede that "illusion" is toxic terminology for pain. Use "construct" or "model" instead when discussing suffering.

  **2. The Literary Objection (Interiority)**
  *   **Who:** Novelists and Literary Scholars.
  *   **Objection:** "If there is no 'what it is like,' what is fiction exploring? You seem to say the novelist's privileged access to interiority is access to nothing."
  *   **Likelihood:** High | **Damage:** Critical (Loss of Room)
  *   **Reply:** "Fiction explores the drafts. We are not reading souls; we are reading each other's monitoring subsystems. The novelist's genius is simulating the drafting process so well that readers recognize their own. Interiority isn't a deep well; it's the surface texture of the draft. That texture is still rich enough for art."
  *   **Soft Spot:** May feel like a demotion of the literary enterprise to mere mechanism.
  *   **Concession Required:** Yes. Concede that the *value* of fiction is undiminished; only the metaphysics of what it tracks changes.

  **3. The Self-Referential Objection (Truth)**
  *   **Who:** You (Private Fear) / Analytic Philosopher (Sympathetic).
  *   **Objection:** "If avowals are drafts whose correctness is adequacy rather than truth, is the sentence *there are no phenomenal properties* itself merely adequate? If so, have you said anything true?"
  *   **Likelihood:** Medium | **Damage:** Critical (Loss of Argument)
  *   **Reply:** "It is a draft that aims to be adequate to the causal structure of the world. Truth is not a mirror of nature; it's successful steering. This theory steers us away from dualism and toward better science. It is 'true' in the only way a map can be: it gets us where we need to go without crashing."
  *   **Soft Spot:** Risks sounding like relativism or pragmatism that abandons truth entirely.
  *   **Concession Required:** No, but must clarify definition of truth.

  **4. The Realist Objection (Hard Problem)**
  *   **Who:** Analytic Philosopher (Realist).
  *   **Objection:** "You have explained the report of experience, and the behavior, but you have not explained the experience itself. The hard problem remains."
  *   **Likelihood:** High | **Damage:** Medium (Loss of Argument)
  *   **Reply:** "The 'experience itself' is the report. There is no second step. The seeming is the issuing of the draft. To ask for the experience behind the draft is to ask for the desktop icon behind the pixels. There is nothing there but the display."
  *   **Soft Spot:** Begs the question against the realist; assumes the conclusion.

  **5. The Med Humanities Objection (Moral Weight)**
  *   **Who:** Medical Humanities Graduate Students.
  *   **Objection:** "How can pain retain moral seriousness if it is an illusion? Doesn't this undermine the ethical urgency of suffering?"
  *   **Likelihood:** High | **Damage:** High (Loss of Room)
  *   **Reply:** "Moral weight attaches to the harm done to the organism, not the metaphysics of the feeling. A broken leg is morally serious whether qualia exist or not. The draft drives the harm. We respond to the damage, not the metaphysics."
  *   **Soft Spot:** Can sound utilitarian and cold.
  *   **Concession Required:** Yes. Reiterate commitment to moral realism regarding suffering.

  **6. The Psychologist Objection (Confabulation)**
  *   **Who:** Cognitive Psychologist.
  *   **Objection:** "Isn't this just the confabulation literature from decades ago? Nisbett and Wilson already showed introspection is flawed. What is the new prediction?"
  *   **Likelihood:** Medium | **Damage:** Medium (Credibility)
  *   **Reply:** "Confabulation implies there is a truth you are getting wrong. I am saying there is no truth to get wrong. The prediction is that neural correlates of avowal will look like construction, not retrieval. We should see editing artifacts in introspection, not just noise."
  *   **Soft Spot:** Semantic distinction may seem trivial to an empiricist.

  **7. The Sympathetic Philosopher Objection (Illusion Vehicle)**
  *   **Who:** Analytic Philosopher (Sympathetic).
  *   **Objection:** "If the draft is the illusion, what is the substrate? Doesn't the substrate itself have to be phenomenal for the illusion to appear?"
  *   **Likelihood:** Medium | **Damage:** Medium (Loss of Argument)
  *   **Reply:** "The substrate is functional. A computer screen isn't made of little pictures; it's made of pixels switching states. The brain is made of neurons firing. No qualia needed at the bottom, only complex signaling."
  *   **Soft Spot:** Hard to explain without invoking a homunculus.

  **8. The Literary Objection (Scientism)**
  *   **Who:** Literary Scholars.
  *   **Objection:** "This is scientism. You are reducing the mystery of art to cognitive mechanics."
  *   **Likelihood:** Medium | **Damage:** Medium (Loss of Room)
  *   **Reply:** "Understanding the brush doesn't ruin the painting. Mechanics of meaning are still meaning. I am not reducing the value, only the ontology."
  *   **Soft Spot:** "Ontology" is a trigger word for this group.

  **9. The Realist Objection (Knowledge Argument)**
  *   **Who:** Analytic Philosopher (Realist).
  *   **Objection:** "Mary learns something new when she sees red. Your draft theory cannot account for that new knowledge."
  *   **Likelihood:** Low | **Damage:** Low (Loss of Argument)
  *   **Reply:** "Mary learns a new mode of access, a new way to draft. She doesn't learn a new fact about the world, she learns a new skill of reporting."
  *   **Soft Spot:** Standard illusionist move, may not satisfy a committed realist.

  **10. The General Objection (Agency)**
  *   **Who:** General Audience.
  *   **Objection:** "If drafts are automatic, are we responsible for what we say we feel?"
  *   **Likelihood:** Low | **Damage:** Low (Loss of Argument)
