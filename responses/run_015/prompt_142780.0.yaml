answer: |-
  ### Screen Scores (0–10)

  **1. Value Ceiling**
  *   (a) Stops Mugger: 9 (Caps the leverage.)
  *   (b) Keeps Portfolio: 6
  *   **Wrongly Kills:** The pandemic-prevention portfolio (civilisational scale exceeds the cap).

  **2. Satisficing Ceiling**
  *   (a) Stops Mugger: 9 (Same as above.)
  *   (b) Keeps Portfolio: 6
  *   **Wrongly Kills:** The pandemic-prevention portfolio (upside beyond the satisfice is ignored).

  **3. Probability Floor**
  *   (a) Stops Mugger: 4 (Mugger can claim 1-in-1,000; floor must be higher to stop them.)
  *   (b) Keeps Portfolio: 10
  *   **Wrongly Kills:** None, *but* if you raise the floor high enough to stop the mugger, it kills the atmospheric physics grant (1-in-a-million).

  **4. Escalation Screen**
  *   (a) Stops Mugger: 10 (Targets the structural flaw directly.)
  *   (b) Keeps Portfolio: 7
  *   **Wrongly Kills:** The atmospheric physics grant (genuine uncertainty can look like escalation to a tired officer).

  **5. Mechanism Requirement**
  *   (a) Stops Mugger: 10 ("Magic powers" fails the causal link test.)
  *   (b) Keeps Portfolio: 10
  *   **Wrongly Kills:** None (assuming standard due diligence).

  **6. Track Record**
  *   (a) Stops Mugger: 9 (Muggers lack calibration.)
  *   (b) Keeps Portfolio: 5
  *   **Wrongly Kills:** The atmospheric physics grant (new group, no prior calibration at this magnitude).

  **7. Median Not Mean**
  *   (a) Stops Mugger: 10 (Median of "magic" is zero.)
  *   (b) Keeps Portfolio: 3
  *   **Wrongly Kills:** The pandemic-prevention portfolio (relies on mean EV, median outcome is likely "no pandemic averted").

  **8. Robustness to Disagreement**
  *   (a) Stops Mugger: 8 (Skeptics veto magic.)
  *   (b) Keeps Portfolio: 6
  *   **Wrongly Kills:** The pandemic-prevention portfolio (if one skeptical trustee holds a low prior on intervention efficacy).

  **9. Information Only**
  *   (a) Stops Mugger: 10 (You don't pay for unverified threats.)
  *   (b) Keeps Portfolio: 2
  *   **Wrongly Kills:** The pandemic-prevention portfolio (this is implementation, not research).

  ### Grouping and Collapse

  Screens 1, 2, and 7 are the same rule wearing different clothes: they all truncate the right tail of the distribution. Collapsing them loses nothing; they are just different mathematical levers for "ignore the huge upside." Screens 4 and 5 are also siblings: escalation is the behavioural symptom of a missing mechanism. Collapsing them loses operational clarity; "check the mechanism" is easier for a programme officer to audit than "judge if this number is escalating."

  ### Tier List

  1.  **Adopt as written:** Screen 5 (Mechanism Requirement) is standard due diligence, stops magic, saves physics, and looks professional in print.
  2.  **Adopt with one patch:** Screen 3 (Probability Floor) works only if you patch it to read "de minimis probability as determined by reference class" rather than a fixed number, to avoid public ridicule.
  3.  **Drop:** Screen 1 (Arbitrary caps look incompetent to donors and kill your mission).
  4.  **Drop:** Screen 2 (Functionally identical to 1 but harder to explain).
  5.  **Drop:** Screen 4 (Too subjective for a 4pm Friday decision; requires judging intent).
  6.  **Drop:** Screen 6 (Too conservative; kills innovation by definition).
  7.  **Drop:** Screen 7 (Abandons expected value, which is your foundation's core engine).
  8.  **Drop:** Screen 8 (Politicizes the decision rule and empowers veto players).
  9.  **Drop:** Screen 9 (Changes your mission from doing good to studying good).

  ### Reserve Fraction

  **0.05 (5%).** It isn't 0 because genuine black swans exist and you need option value to act when a verified tail risk emerges. It isn't "as much as the biggest number implies" because your epistemic tools cannot distinguish between a real tail risk and a sophisticated mugging beyond that threshold; 5% is the cost of insurance against your own blindness without bankrupting the core portfolio.

  ### Where the Work Is Happening

  The work is not in the decision rule, but in the epistemic standard used to generate the probabilities. A decision rule is just a calculator; if you feed it "magic," it outputs "mugging," and if you feed it "physics," it outputs "grant," regardless of the math. The written rule should not focus on how to *process* the numbers, but on *how the numbers are derived*: it should mandate that probabilities must rest on peer-reviewed models, reference classes, or mechanistic chains, and that any claim lacking an audit trail for its probability estimate is automatically assigned a probability of zero.
