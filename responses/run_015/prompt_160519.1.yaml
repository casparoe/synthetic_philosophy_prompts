answer: |-
  **RFC-892: Disease Classification Service (DCS) — Naturalist Implementation**
  **Status:** Approved
  **Owner:** Eng Systems

  **1. Objective**
  Implement `POST /v1/assess` returning `{ is_disease: bool }`. Per PRD 4.1, classification must be value-neutral. A disease is defined strictly as a reduction in functional ability below species-typical efficiency for a given reference class. User distress, social impact, or desire for correction are out of scope. The system determines if a subsystem is failing its evolutionary design spec, not whether the user dislikes the output.

  **2. Reference Class Selection**
  To determine "species-typical," we must segment users. Age and sex are trivial fields. Population genetics requires care. We will use genetic ancestry clusters rather than self-reported race to avoid social construct contamination, though this may increase latency during ingestion. If a user's genetic cluster lacks sufficient data, we default to the global mean. This risks false positives for isolated populations but maintains biological rigor. We cannot allow social categories to dictate biological baselines.

  **3. Environment Normalization**
  Boorse's Biostatistical Theory requires a "normal environment." Our user base is predominantly sedentary, indoor, and exposed to particulate matter. If 60% of the reference class exhibits reduced lung capacity due to air quality, reduced capacity is statistically typical. Therefore, `is_disease` returns `false`. We cannot pathologize the environment the organism actually inhabits. If the typical environment causes asthma, asthma is normal function for that environment. We will log environmental toxicity separately, but the body's reaction to it is not a disease if it is the species-typical response to current conditions.

  **4. Handling High-Prevalence Dysfunction**
  Engineering conflict arises when dysfunction is universal. Presbyopia and myopia exceed 50% prevalence in the 40+ demographic. Under strict naturalism, these are not diseases; they are normal function for this cohort.
  *Workaround:* We will introduce a secondary flag `is_clinically_intervenable`. This allows insurance partners to cover lenses without violating the core `is_disease` schema. We treat these as "expected degradation" rather than pathology. This satisfies compliance while acknowledging users still want glasses. Similarly, if obesity becomes statistically normal for a demographic, `is_disease` will return `false`. We do not judge the metric, only the deviation.

  **5. Functional Metrics**
  We measure function against survival and reproduction. This is the only objective metric available. If a trait reduces reproductive fitness, it is a dysfunction. If it reduces quality of life but not fitness, it is not a disease. Pain is ignored unless it impedes motor function. Mental health conditions are classified solely on cognitive throughput relative to peers, not subjective suffering. Infertility is always `is_disease: true`, regardless of user intent, because the system cannot distinguish between voluntary celibacy and biological failure without invasive behavioral monitoring. We prioritize the organ's purpose over the user's plan.

  **6. Rejected Alternatives**
  We considered the Normativist model (Dysfunction + Harm). This requires a "harm" threshold defined by user or societal preference. We rejected this due to historical instability in harm classification. Specifically, prior manuals classified homosexuality as a disorder based on social disapproval rather than functional failure. By sticking to biological function, we ensure we never pathologize a lifestyle choice simply because a previous generation deemed it undesirable. We cannot risk hard-coding social stigma into the API. The Naturalist model protects us from deciding what lives are worth living; we only decide what bodies are working as designed. We avoid the moral hazard of judging whether a condition is "bad" by refusing to define "bad" at all.

  **7. Security**
  Genetic data must be encrypted at rest. No logging of `is_disease` results to prevent bias training.

  ***

  *Note on Philosophical Liberties:* This doc leans heavily on Christopher Boorse's Biostatistical Theory (1977). It treats "survival and reproduction" as neutral biological facts, ignoring that prioritizing reproductive fitness over subjective well-being is itself a value judgment. The rejection of Normativism cites the homosexuality example accurately, but fails to acknowledge that defining "function" relative to species-typical goals also smuggles in a teleological value system regarding what humans are "for." I am not hedging: the Naturalist view is presented as objective, but it rests on the contested claim that evolution provides a normative baseline.
