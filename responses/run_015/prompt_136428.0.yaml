  hey guys, so i've been thinking about this paper too and honestly that court algorithm thing is wild. like, imagine a computer simulating your whole life just to see if you'd still rob a bank. kinda sci-fi but i guess based on those risk assessment tools they use now anyway.

  okay so here's the thing about frankfurt. everyone gets stuck on the "could have done otherwise" part, right? that's the Principle of Alternative Possibilities (PAP). basically the idea that you cant be blamed unless you had a real choice. frankfurt's whole deal in his 1969 paper was to show that PAP is wrong. he says you can be responsible even if you couldn't have done otherwise, as long as you did it because you wanted to, not because the hidden controller made you.

  so if frankfurt saw these court sims... i think he'd be pretty critical of how the judges are using them. the court is saying "if the sim shows you'd do it 90% of the time, you had no alternative, so less blame." but that's literally relying on PAP! they're saying no alternatives = no responsibility. frankfurt spent his whole career saying alternatives dont matter for responsibility. what matters is the "actual sequence." did the action come from your own will?

  the algorithm is looking at causal history (parents, neighborhood) to see if the outcome was determined. but frankfurt is a compatibilist. he thinks determinism doesnt kill responsibility. even if the sim proves you were determined to do it, frankfurt would ask: did you identify with that desire? was it a first-order desire you endorsed with a second-order volition? if you committed the crime because you genuinely wanted to and wanted to want to, then the fact that you couldn't have done otherwise (according to the sim) is irrelevant. you're still on the hook.

  the court is treating "no alternative" as an excuse. frankfurt treats "no alternative" as irrelevant unless it involves coercion that bypasses your will. so he'd probably say the court is missing the point about internal identification. they're looking at the wrong data. they should be looking at whether the defendant accepted the motive, not whether the motive was inevitable.

  tho, there is a catch. if the simulations show that your ability to form those second-order desires was itself messed up by your childhood (like you never had a chance to develop free will), then maybe he'd concede. but strictly speaking, his hierarchical model focuses on the structure of your will at the time of action, not the history of how you got there.

  let me know if that makes sense, gonna try to draft my intro now.

