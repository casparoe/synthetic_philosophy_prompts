      *   **Duration:** ~4 minutes (roughly 500 words).
      *   **Audience:** 100 people (50% colleagues/engineers, 50% family/in-laws including nursery-running parents).
      *   **Groom's Personality/Philosophy:** Staff engineer, obsessed with Adam Smith's *Theory of Moral Sentiments*. Key concepts: "Praised vs. Praise-worthy" (only the latter matters), "Borrowed Spectators" (internal judge is assembled from actual observers; if they flattered you, your judge is corrupt). Marriage = finding out whose voice that judge is.
      *   **Constraints (Hard No's):**
          *   No list of compliments from the younger brother (biased gaze).
          *   No claims about feelings (e.g., "I've never seen him so happy" = mind-reading).
          *   No predictions about marriage success/destiny/soulmates.
          *   No blessings about happiness (luck vs. conduct).
          *   No performance review vibe for the non-engineers.
      *   **Requirements:**
          *   Fair version of the truth about him.
          *   One demanding, concrete, checkable standard for the future.
