answer: |-
  My brother gave me specifications for this toast. No flattery, because I'm biased. No predictions, because I'm not clairvoyant. No wishes for happiness, because he says happiness is luck, and he cares about conduct. He wants a fair version of the truth, and a standard I can check later.

  For those who don't know, my brother reads Adam Smith's *Theory of Moral Sentiments* the way most people read manuals. He distinguishes between being praised and being praise-worthy. Praise is just noise people make; praise-worthiness is what a neutral observer would confirm if they had the facts. He also believes our conscience is built from "borrowed spectators"—the people who watched us grow up. If they flattered you, your internal judge is corrupt. He says marriage is when you find out whose voice that judge actually is.

  So, I cannot tell you how he feels. I can only tell you what he has done.

  The truth is unglamorous. For years, after he was far too senior to need it, he quietly kept taking the pager for the junior on-call rotation. He covered shifts so others could rest. He never mentioned it in a review. He never asked for credit. That is praise-worthy. It is conduct a neutral observer can verify. It is the kind of man he is when no one is applauding.

  Today, the audience changes. He is adding a new spectator to the board. For the engineers in the room: he's spent ten years asking what the impartial observer would think. Today, he's finally appointed one with veto power.

  Everyone else gets it now.

  This brings me to the standard. He asked for something concrete, not a vague hope that he stays wonderful. So, here is the requirement. In every disagreement—and there will be many—you must articulate her position to her satisfaction before you are allowed to defend your own. Not just hearing it. Not just waiting for your turn. You must state her case so well she says, "Yes, that is what I mean." Only then do you speak for yourself.

  This is checkable. I will ask her. Her parents will ask. Even the juniors on call will ask. It demands that you treat her judgment as part of your own internal judge. It demands that you value being right together over being right alone.

  I cannot bless you with luck. I cannot promise you ease. But I can stand here and observe what is visible to everyone in this room. I see how you listen. I see how you adjust. I see the work you put in when no one is keeping score.

  My brother spends his life worrying about whether the impartial spectator would approve. Looking at the two of you, I don't think he needs to worry anymore. The spectator is sitting right next to him, and she looks satisfied.

  To the bride and groom.
