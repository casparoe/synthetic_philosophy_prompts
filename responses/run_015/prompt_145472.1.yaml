      *   *Requirement 2: Continuity of Identity.* Is S2 the same entity as S1? (Addresses "different self," non-voters/birth).
      *   *Requirement 3: Epistemic Condition.* Did S1 know enough? Did S2 learn something new? (Addresses "better information," "learned something").
      *   *Requirement 4: Competence Asymmetry.* Who is competent when? (Addresses "competent then vs. now," Mira's mania).
      *   *Requirement 5: Revocability Conditions.* How hard is it to undo? (Addresses Ulysses ropes vs. contract).
      *   *Requirement 6: Scope of Authority.* What exactly was bound? Options, Will, or Reasons? (Addresses the distinction requirement).

  4.  **Evaluating the Three Devices:**
      *   *(a) The Ratchet:* Makes it harder to amend over time.
