      *   *Confidence Check:* I need to be honest. Philosophy doesn't have "solutions," it has "frameworks." My confidence should be high on the *structure* of the debate, lower on the *normative weight* of specific criteria.

      *(Self-Correction during drafting)*: I need to make sure I don't just list philosophical theories (Elster, Schelling, Dworkin) but synthesize them into a "Standard" as requested. The user wants a *checklist* for their characters to argue against.
