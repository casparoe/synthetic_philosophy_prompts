      *   Move 3: Constitution as framework.
      *   *Candidate:* **The Condition of Non-Alienation.** If the present self cannot recognize the past commitment as *in principle* their own (even if currently unwanted), the bind breaks.
      *   *Wait, better:* **The Epistemic/Competence Asymmetry.**
          *   Vs. Different Self: Doesn't matter if you are different, matters if you are *right/capable*.
