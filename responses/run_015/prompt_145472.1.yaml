          *   Apply the standard briefly to Mira and the Republic.
          *   **Meta-Requirement:** State confidence level and identify the weakest point.

  2.  **Deconstruct the Philosophical Problem:**
      *   This is the problem of *Diachronic Autonomy* and *Precommitment*.
      *   Key tension: Past Self (S1) vs. Present Self (S2).
      *   Key tension: Autonomy (self-rule) vs. Paternalism (protection from self).
      *   Key tension: Stability (rule of law/health) vs. Democracy/Agency (current will).

  3.  **Drafting the Requirements List (The "Standard"):**
      *   Need to cover the user's specific cases.
